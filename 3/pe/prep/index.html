ان والبراعة في أقسام المهرجان.\n5. يطبق قواعد الأقسام والأمان.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: كرات طبية\n- أخرى: حقيبة\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: لوحة نقاط", "المفاهيم": "- القوام السليم\n- الرفع الصحيح\n- ثني الركبتين\n- حمل الأشياء\n- المهرجان الرياضي التعليمي\n- الموانع\n- الاتزان\n- البراعة الحركية", "التهيئة / التمهيد / التعلم القبلي": "يرفع المعلم كرة طبية بثني الظهر ثم بثني الركبتين ويسأل: أي الطريقتين تحمي الظهر؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرفع الصحيح: الاقتراب من الشيء، ثني الركبتين والظهر مستقيم، مسك الشيء وضمه للجسم، الوقوف بمد الركبتين، مع التفكير بصوت عالٍ عن حماية الظهر (برنامج صحتي ص 23)، ويقلد التلميذ الرفع الصحيح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ رفع كرة طبية خفيفة بالطريقتين ويكتشف أيهما أسهل وأين يشعر بالجهد، ويستنتج القاعدة، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (ناقل الأدوات): تتابع في نقل الأدوات (كرات، أقماع) من مكان لآخر بالرفع الصحيح فقط، ولا تحسب النقلة الخاطئة، ويلعب التلميذ ويرفع بالطريقة الصحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم): قسم مسار الموانع، قسم الاتزان الثابت (الميزان الأمامي ولمس الأداة)، قسم الاتزان الحركي (المشي على المقعد بالبالون والهبوط بنصف دورة)، قسم البراعة (الوثب بتلامس القدمين ودوران الطاحونة ودوران عقارب الساعة)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: تتابع يجمع مانعًا واتزانًا وحركة براعة، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ماذا نثني عند رفع شيء من الأرض؟\nالإجابة: الركبتين والظهر مستقيم.\nس2 (مستوى التطبيق): لماذا نضم الشيء إلى الجسم عند الحمل؟\nالإجابة: ليكون الحمل أخف على الظهر.\nس3 (مستوى الاستدلال): ما ضرر الرفع بثني الظهر؟\nالإجابة: يؤلم الظهر ويضر العمود الفقري.\n\n• نشاط علاجي (لمن لم يتقن): يرفع المعلم مع التلميذ كرة طبية من الأرض بثني الركبتين والظهر مستقيم، ويضمانها إلى الجسم، ثم يسأله: ماذا نثني عند رفع شيء من الأرض؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بنقل أدوات المهرجان (أقماع وكرات) بالطريقة الصحيحة، وتصحيح زميل يرفع بثني الظهر مع تفسير ضرر ذلك.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه المقعد السويدي والبالون؟\nالإجابة: قسم الاتزان الحركي.\nس5 (مستوى التطبيق): اذكر حركة براعة أديتها في قسم البراعة.\nالإجابة: مثل: دوران الطاحونة.\nس6 (مستوى الاستدلال): ما قاعدة الأمان في مسار الموانع؟\nالإجابة: الهبوط على المرتبة وعدم الدفع.\n\n• نشاط علاجي (لمن لم يتقن): يرفع المعلم مع التلميذ كرة طبية من الأرض بثني الركبتين والظهر مستقيم، ويضمانها إلى الجسم، ثم يسأله: ماذا نثني عند رفع شيء من الأرض؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بنقل أدوات المهرجان (أقماع وكرات) بالطريقة الصحيحة، وتصحيح زميل يرفع بثني الظهر مع تفسير ضرر ذلك.", "التقويم الختامي": "س1 (مستوى المعرفة): ارفع الكرة الطبية من الأرض بالطريقة الصحيحة.\nالإجابة: يثني الركبتين والظهر مستقيم.\nس2 (مستوى التطبيق): أرفع صورة طفل يرفع حقيبة بظهر منحنٍ، ما الخطأ؟\nالإجابة: ثني الظهر بدل الركبتين.\nس3 (مستوى الاستدلال): كيف ترفع حقيبتك الثقيلة في الصباح؟\nالإجابة: أقترب منها وأثني ركبتي وأضمها لجسمي ثم أقف.\n\nس4 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الموانع، الاتزان الثابت، الاتزان الحركي، البراعة.\nس5 (مستوى التطبيق): ما القسم الذي أحببته أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\nس6 (مستوى الاستدلال): كيف ساهمت في عمل مجموعتك اليوم؟\nالإجابة: يذكر مساهمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راقب طفلك عند رفع حقيبته وذكّره بثني الركبتين (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، ومارسا الاتزان والبراعة في مكان آمن (دليل المعلم ص 53-81).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الطريقة الصحيحة لرفع الأشياء من الأرض وحملها.\n2. يميز الرفع الصحيح (ثني الركبتين) من الخاطئ (ثني الظهر).\n3. يطبق الرفع والحمل الصحيح للأدوات الرياضية.\n4. يوظف تمرينات الموانع والاتزان والبراعة في أقسام المهرجان.\n5. يطبق قواعد الأقسام والأمان.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: كرات طبية\n- أخرى: حقيبة\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- القوام السليم\n- الرفع الصحيح\n- ثني الركبتين\n- حمل الأشياء\n- المهرجان الرياضي التعليمي\n- الموانع\n- الاتزان\n- البراعة الحركية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرفع المعلم كرة طبية بثني الظهر ثم بثني الركبتين ويسأل: أي الطريقتين تحمي الظهر؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرفع الصحيح: الاقتراب من الشيء، ثني الركبتين والظهر مستقيم، مسك الشيء وضمه للجسم، الوقوف بمد الركبتين، مع التفكير بصوت عالٍ عن حماية الظهر (برنامج صحتي ص 23)، ويقلد التلميذ الرفع الصحيح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ رفع كرة طبية خفيفة بالطريقتين ويكتشف أيهما أسهل وأين يشعر بالجهد، ويستنتج القاعدة، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (ناقل الأدوات): تتابع في نقل الأدوات (كرات، أقماع) من مكان لآخر بالرفع الصحيح فقط، ولا تحسب النقلة الخاطئة، ويلعب التلميذ ويرفع بالطريقة الصحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم): قسم مسار الموانع، قسم الاتزان الثابت (الميزان الأمامي ولمس الأداة)، قسم الاتزان الحركي (المشي على المقعد بالبالون والهبوط بنصف دورة)، قسم البراعة (الوثب بتلامس القدمين ودوران الطاحونة ودوران عقارب الساعة)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: تتابع يجمع مانعًا واتزانًا وحركة براعة، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ماذا نثني عند رفع شيء من الأرض؟\nالإجابة: الركبتين والظهر مستقيم.\nس2 (مستوى التطبيق): لماذا نضم الشيء إلى الجسم عند الحمل؟\nالإجابة: ليكون الحمل أخف على الظهر.\nس3 (مستوى الاستدلال): ما ضرر الرفع بثني الظهر؟\nالإجابة: يؤلم الظهر ويضر العمود الفقري.\n\n• نشاط علاجي (لمن لم يتقن): يرفع المعلم مع التلميذ كرة طبية من الأرض بثني الركبتين والظهر مستقيم، ويضمانها إلى الجسم، ثم يسأله: ماذا نثني عند رفع شيء من الأرض؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بنقل أدوات المهرجان (أقماع وكرات) بالطريقة الصحيحة، وتصحيح زميل يرفع بثني الظهر مع تفسير ضرر ذلك.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه المقعد السويدي والبالون؟\nالإجابة: قسم الاتزان الحركي.\nس5 (مستوى التطبيق): اذكر حركة براعة أديتها في قسم البراعة.\nالإجابة: مثل: دوران الطاحونة.\nس6 (مستوى الاستدلال): ما قاعدة الأمان في مسار الموانع؟\nالإجابة: الهبوط على المرتبة وعدم الدفع.\n\n• نشاط علاجي (لمن لم يتقن): يرفع المعلم مع التلميذ كرة طبية من الأرض بثني الركبتين والظهر مستقيم، ويضمانها إلى الجسم، ثم يسأله: ماذا نثني عند رفع شيء من الأرض؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بنقل أدوات المهرجان (أقماع وكرات) بالطريقة الصحيحة، وتصحيح زميل يرفع بثني الظهر مع تفسير ضرر ذلك.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارفع الكرة الطبية من الأرض بالطريقة الصحيحة.\nالإجابة: يثني الركبتين والظهر مستقيم.\nس2 (مستوى التطبيق): أرفع صورة طفل يرفع حقيبة بظهر منحنٍ، ما الخطأ؟\nالإجابة: ثني الظهر بدل الركبتين.\nس3 (مستوى الاستدلال): كيف ترفع حقيبتك الثقيلة في الصباح؟\nالإجابة: أقترب منها وأثني ركبتي وأضمها لجسمي ثم أقف.\n\nس4 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الموانع، الاتزان الثابت، الاتزان الحركي، البراعة.\nس5 (مستوى التطبيق): ما القسم الذي أحببته أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\nس6 (مستوى الاستدلال): كيف ساهمت في عمل مجموعتك اليوم؟\nالإجابة: يذكر مساهمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راقب طفلك عند رفع حقيبته وذكّره بثني الركبتين (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، ومارسا الاتزان والبراعة في مكان آمن (دليل المعلم ص 53-81).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=8"}}, {"title": "الطلاقة الحركية بالأدوات", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "العاشر – الحادي عشر", "date": "8-12/11/2026 إلى 15-19/11/2026", "pages": "دليل المعلم ص 82-90", "n": 2, "periods": [{"focus": "الطلاقة الحركية بالكرات (الرمي والدوران واللقف) + الطلاقة الحركية بالحبل (الوثب بالحبل الفردي وتدوير الحبل من أسفل)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي حركات الطلاقة بالكرة (رمي عاليًا والدوران واللقف، تمرير الكرة حول الجسم).\n3. يحافظ على السيطرة على الكرة أثناء الحركة.\n4. يتعرف حركات الطلاقة الحركية بالحبل.\n5. يؤدي الوثب بالحبل الفردي بالمشطين وتدوير الحبل من أسفل.\n6. يحافظ على الإيقاع بين دوران الحبل والوثب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات\n- أخرى: بالونات\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: حبال وثب\n- أخرى: مراتب", "المفاهيم": "- الطلاقة الحركية\n- السيطرة على الكرة\n- الرمي واللقف\n- الدوران\n- الوثب بالحبل\n- تدوير الحبل\n- الإيقاع\n- المشطان", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الكرة عاليًا ويدور ثم يلقفها ويسأل: كم حركة أديت؟ ويقدم مفهوم الطلاقة الحركية (ربط الحركات بانسيابية) ص 82-83.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم بالكرة، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 83-84): رمي الكرة عاليًا والتصفيق واللقف، رمي ودوران ولقف، تمرير الكرة حول الخصر والركبتين، تنطيط ودوران ولقف، بالتدرج، ويقلد كل حركة بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (محطات الطلاقة الحركية بالكرات) ص 86: محطة الصف (رمي ولقف أثناء المشي 5 م)، محطة الانتشار الحر (تمرير الكرة حول الجسم داخل الطوق)، محطة القطار (الجري بالكرة والرمي والدوران عند القمع)، محطة التبادل مع الزميل، مع التبديل، ويؤدي التلميذ مهمة المحطة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كم مرة؟): من يرمي الكرة ويصفق أكبر عدد قبل اللقف، ويلعب التلميذ (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النماذج (ص 84-85): الوثب بالحبل الفردي (وقوف، مسك الحبل، الوثب بالمشطين مع تدوير الحبل أمامًا)، تدوير الحبل من أسفل (مسك طرفي الحبل بيد واحدة وتدويره دائرة على الأرض والوثب فوقه)، بالتدرج: الحبل دون وثب، ثم الوثب، ويقلد التلميذ بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. يجرب التلميذ الوثب بالحبل بتدوير بطيء ثم سريع، وبالوثب العالي ثم المنخفض، ويكتشف أن الوثب المنخفض بالمشطين مع التدوير المنتظم يحفظ الإيقاع، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. في أزواج: يعد أحدهما عدد وثبات زميله في 20 ثانية ويتبادلان، ثم يحاولان تحسين العدد، ويعد التلميذ ويحسن (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الطلاقة الحركية؟\nالإجابة: أداء عدة حركات مترابطة بانسيابية وسيطرة.\nس2 (مستوى التطبيق): اذكر حركة طلاقة بالكرة.\nالإجابة: رمي الكرة عاليًا والدوران ثم لقفها.\nس3 (مستوى الاستدلال): كيف نحافظ على الكرة عند الرمي والدوران؟\nالإجابة: نرميها عاليًا بشكل مستقيم وندور بسرعة وننظر إليها.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.\n\nس4 (مستوى المعرفة): بأي جزء من القدم نثب بالحبل؟\nالإجابة: بالمشطين.\nس5 (مستوى التطبيق): كيف نؤدي تدوير الحبل من أسفل؟\nالإجابة: نمسك طرفي الحبل بيد واحدة وندوره على الأرض ونثب فوقه.\nس6 (مستوى الاستدلال): لماذا يفضل الوثب المنخفض؟\nالإجابة: لأنه يحفظ الإيقاع ويقلل التعب.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة عاليًا وصفق مرتين ثم القفها.\nالإجابة: يؤديها دون سقوط الكرة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الرمي واللقف أثناء المشي، وتمرير الكرة حول الجسم.\nس3 (مستوى الاستدلال): ماذا يحدث لو رمينا الكرة مائلة قبل الدوران؟\nالإجابة: تسقط بعيدًا ولا نستطيع لقفها.\n\nس4 (مستوى المعرفة): أدِّ الوثب بالحبل 10 مرات متتالية.\nالإجابة: يؤديها بالمشطين دون توقف.\nس5 (مستوى التطبيق): ما طول حبل الوثب الفردي المناسب؟\nالإجابة: من 2.5 إلى 3 أمتار.\nس6 (مستوى الاستدلال): كيف حسنت عدد وثباتك مع زميلك؟\nالإجابة: بتدوير منتظم ووثب منخفض.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على رمي الكرة عاليًا والتصفيق واللقف 10 مرات (دليل المعلم ص 83-86).\nإرشاد لولي الأمر: وفر لطفلك حبل وثب مناسبًا وشجعه على 3 دقائق يوميًا (دليل المعلم ص 84-85).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}, {"focus": "الطلاقة الحركية بسلم الرشاقة + محطات ومنافسات الطلاقة الحركية بالأدوات", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف سلم الرشاقة وحركات الطلاقة فيه.\n2. يؤدي الجري بهبوط قدم داخل المربعات والخطو الجانبي والوثب في سلم الرشاقة.\n3. يميز بين أنماط الحركة في سلم الرشاقة.\n4. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n5. يوظف الطلاقة الحركية في منافسات.\n6. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: أطواق", "المفاهيم": "- سلم الرشاقة\n- الجري داخل المربعات\n- الخطو الجانبي\n- الوثب\n- الحجل\n- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم سلم الرشاقة ويسأل: كيف نتحرك داخل مربعاته؟ ويوضح رسم مربعات 30 سم عند عدم توفره (ص 85).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 85-86): الجري بهبوط قدم في كل مربع، الجري بهبوط القدمين في كل مربع، الخطو الجانبي داخل المربعات، الوثب بالقدمين من مربع لآخر، الحجل، مع رفع الركبتين وتحريك الذراعين، ويقلد كل نمط ببطء ثم بسرعة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ النمط نفسه بالنظر إلى القدمين ثم للأمام، وبسرعتين، ويكتشف أن النظر للأمام والإيقاع المنتظم أسرع وأدق، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. قطارات، كل تلميذ يؤدي النمط الذي يناديه المعلم عبر السلم والعودة بالجري، ويتسابق التلميذ بدقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 2 و3 ص 87-88: محطة الحبل (وثب 3 مرات بتدوير يمين ثم يسار)، محطة الكرة (رمي ودوران ولقف)، محطة سلم الرشاقة (نمط يختاره القائد)، محطة الكرة والسلم (الجري في السلم بالكرة)، بأربع مجموعات والتبديل، ويؤدي التلميذ ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. منافسة ص 89: تتابع يجمع الأدوات الثلاث: وثب بالحبل 5 مرات، جري في سلم الرشاقة، رمي الكرة والدوران واللقف ثم العودة، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا كانت بعض الفرق أسرع؟ ليستنتج التلاميذ أهمية الانسيابية في الانتقال بين الحركات، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر حركتين في سلم الرشاقة.\nالإجابة: الجري بهبوط قدم في كل مربع، والخطو الجانبي.\nس2 (مستوى التطبيق): كم طول سلم الرشاقة تقريبًا؟\nالإجابة: 4 أمتار.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: لنحافظ على السرعة والاتزان وعدم التعثر.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.\n\nس4 (مستوى المعرفة): في أي محطة استخدمنا أداتين معًا؟\nالإجابة: محطة الكرة والسلم.\nس5 (مستوى التطبيق): ما ترتيب حركات منافسة اليوم؟\nالإجابة: وثب بالحبل، جري في السلم، رمي الكرة والدوران واللقف.\nس6 (مستوى الاستدلال): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الجري بهبوط قدم في كل مربع عبر السلم.\nالإجابة: يؤديه دون لمس الأطراف.\nس2 (مستوى التطبيق): ما الفرق بين الحجل والوثب في السلم؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (مستوى الاستدلال): ماذا نفعل إذا لم يتوفر سلم الرشاقة؟\nالإجابة: نرسم مربعات بطول 30 سم.\n\nس4 (مستوى المعرفة): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة الحبل ومحطة الكرة.\nس6 (مستوى الاستدلال): كيف شعرت عندما أنهيت المسار دون أخطاء؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك 8 مربعات بالطباشير ومارسا الجري والخطو الجانبي فيها (دليل المعلم ص 85-86).\nإرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي (حبل، مربعات، كرة) (دليل المعلم ص 87-89).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي حركات الطلاقة بالكرة (رمي عاليًا والدوران واللقف، تمرير الكرة حول الجسم).\n3. يحافظ على السيطرة على الكرة أثناء الحركة.\n4. يتعرف حركات الطلاقة الحركية بالحبل.\n5. يؤدي الوثب بالحبل الفردي بالمشطين وتدوير الحبل من أسفل.\n6. يحافظ على الإيقاع بين دوران الحبل والوثب.\n\nالحصة 2:\n1. يتعرف سلم الرشاقة وحركات الطلاقة فيه.\n2. يؤدي الجري بهبوط قدم داخل المربعات والخطو الجانبي والوثب في سلم الرشاقة.\n3. يميز بين أنماط الحركة في سلم الرشاقة.\n4. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n5. يوظف الطلاقة الحركية في منافسات.\n6. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات\n- أخرى: بالونات\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: حبال وثب\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- الطلاقة الحركية\n- السيطرة على الكرة\n- الرمي واللقف\n- الدوران\n- الوثب بالحبل\n- تدوير الحبل\n- الإيقاع\n- المشطان\n\nالحصة 2:\n- سلم الرشاقة\n- الجري داخل المربعات\n- الخطو الجانبي\n- الوثب\n- الحجل\n- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم الكرة عاليًا ويدور ثم يلقفها ويسأل: كم حركة أديت؟ ويقدم مفهوم الطلاقة الحركية (ربط الحركات بانسيابية) ص 82-83.\n\nالحصة 2:\nيعرض المعلم سلم الرشاقة ويسأل: كيف نتحرك داخل مربعاته؟ ويوضح رسم مربعات 30 سم عند عدم توفره (ص 85).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم بالكرة، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 83-84): رمي الكرة عاليًا والتصفيق واللقف، رمي ودوران ولقف، تمرير الكرة حول الخصر والركبتين، تنطيط ودوران ولقف، بالتدرج، ويقلد كل حركة بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (محطات الطلاقة الحركية بالكرات) ص 86: محطة الصف (رمي ولقف أثناء المشي 5 م)، محطة الانتشار الحر (تمرير الكرة حول الجسم داخل الطوق)، محطة القطار (الجري بالكرة والرمي والدوران عند القمع)، محطة التبادل مع الزميل، مع التبديل، ويؤدي التلميذ مهمة المحطة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كم مرة؟): من يرمي الكرة ويصفق أكبر عدد قبل اللقف، ويلعب التلميذ (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النماذج (ص 84-85): الوثب بالحبل الفردي (وقوف، مسك الحبل، الوثب بالمشطين مع تدوير الحبل أمامًا)، تدوير الحبل من أسفل (مسك طرفي الحبل بيد واحدة وتدويره دائرة على الأرض والوثب فوقه)، بالتدرج: الحبل دون وثب، ثم الوثب، ويقلد التلميذ بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. يجرب التلميذ الوثب بالحبل بتدوير بطيء ثم سريع، وبالوثب العالي ثم المنخفض، ويكتشف أن الوثب المنخفض بالمشطين مع التدوير المنتظم يحفظ الإيقاع، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. في أزواج: يعد أحدهما عدد وثبات زميله في 20 ثانية ويتبادلان، ثم يحاولان تحسين العدد، ويعد التلميذ ويحسن (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 85-86): الجري بهبوط قدم في كل مربع، الجري بهبوط القدمين في كل مربع، الخطو الجانبي داخل المربعات، الوثب بالقدمين من مربع لآخر، الحجل، مع رفع الركبتين وتحريك الذراعين، ويقلد كل نمط ببطء ثم بسرعة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ النمط نفسه بالنظر إلى القدمين ثم للأمام، وبسرعتين، ويكتشف أن النظر للأمام والإيقاع المنتظم أسرع وأدق، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. قطارات، كل تلميذ يؤدي النمط الذي يناديه المعلم عبر السلم والعودة بالجري، ويتسابق التلميذ بدقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 2 و3 ص 87-88: محطة الحبل (وثب 3 مرات بتدوير يمين ثم يسار)، محطة الكرة (رمي ودوران ولقف)، محطة سلم الرشاقة (نمط يختاره القائد)، محطة الكرة والسلم (الجري في السلم بالكرة)، بأربع مجموعات والتبديل، ويؤدي التلميذ ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. منافسة ص 89: تتابع يجمع الأدوات الثلاث: وثب بالحبل 5 مرات، جري في سلم الرشاقة، رمي الكرة والدوران واللقف ثم العودة، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا كانت بعض الفرق أسرع؟ ليستنتج التلاميذ أهمية الانسيابية في الانتقال بين الحركات، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الطلاقة الحركية؟\nالإجابة: أداء عدة حركات مترابطة بانسيابية وسيطرة.\nس2 (مستوى التطبيق): اذكر حركة طلاقة بالكرة.\nالإجابة: رمي الكرة عاليًا والدوران ثم لقفها.\nس3 (مستوى الاستدلال): كيف نحافظ على الكرة عند الرمي والدوران؟\nالإجابة: نرميها عاليًا بشكل مستقيم وندور بسرعة وننظر إليها.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.\n\nس4 (مستوى المعرفة): بأي جزء من القدم نثب بالحبل؟\nالإجابة: بالمشطين.\nس5 (مستوى التطبيق): كيف نؤدي تدوير الحبل من أسفل؟\nالإجابة: نمسك طرفي الحبل بيد واحدة وندوره على الأرض ونثب فوقه.\nس6 (مستوى الاستدلال): لماذا يفضل الوثب المنخفض؟\nالإجابة: لأنه يحفظ الإيقاع ويقلل التعب.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر حركتين في سلم الرشاقة.\nالإجابة: الجري بهبوط قدم في كل مربع، والخطو الجانبي.\nس2 (مستوى التطبيق): كم طول سلم الرشاقة تقريبًا؟\nالإجابة: 4 أمتار.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: لنحافظ على السرعة والاتزان وعدم التعثر.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.\n\nس4 (مستوى المعرفة): في أي محطة استخدمنا أداتين معًا؟\nالإجابة: محطة الكرة والسلم.\nس5 (مستوى التطبيق): ما ترتيب حركات منافسة اليوم؟\nالإجابة: وثب بالحبل، جري في السلم، رمي الكرة والدوران واللقف.\nس6 (مستوى الاستدلال): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارمِ الكرة عاليًا وصفق مرتين ثم القفها.\nالإجابة: يؤديها دون سقوط الكرة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الرمي واللقف أثناء المشي، وتمرير الكرة حول الجسم.\nس3 (مستوى الاستدلال): ماذا يحدث لو رمينا الكرة مائلة قبل الدوران؟\nالإجابة: تسقط بعيدًا ولا نستطيع لقفها.\n\nس4 (مستوى المعرفة): أدِّ الوثب بالحبل 10 مرات متتالية.\nالإجابة: يؤديها بالمشطين دون توقف.\nس5 (مستوى التطبيق): ما طول حبل الوثب الفردي المناسب؟\nالإجابة: من 2.5 إلى 3 أمتار.\nس6 (مستوى الاستدلال): كيف حسنت عدد وثباتك مع زميلك؟\nالإجابة: بتدوير منتظم ووثب منخفض.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الجري بهبوط قدم في كل مربع عبر السلم.\nالإجابة: يؤديه دون لمس الأطراف.\nس2 (مستوى التطبيق): ما الفرق بين الحجل والوثب في السلم؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (مستوى الاستدلال): ماذا نفعل إذا لم يتوفر سلم الرشاقة؟\nالإجابة: نرسم مربعات بطول 30 سم.\n\nس4 (مستوى المعرفة): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة الحبل ومحطة الكرة.\nس6 (مستوى الاستدلال): كيف شعرت عندما أنهيت المسار دون أخطاء؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على رمي الكرة عاليًا والتصفيق واللقف 10 مرات (دليل المعلم ص 83-86).\nإرشاد لولي الأمر: وفر لطفلك حبل وثب مناسبًا وشجعه على 3 دقائق يوميًا (دليل المعلم ص 84-85).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9\n\nالحصة 2:\nإرشاد لولي الأمر: ارسم مع طفلك 8 مربعات بالطباشير ومارسا الجري والخطو الجانبي فيها (دليل المعلم ص 85-86).\nإرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي (حبل، مربعات، كرة) (دليل المعلم ص 87-89).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}, {"title": "سباقات الجري", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 94-103", "n": 1, "periods": [{"focus": "سباق تتابع العدو + سباق الجري المتنوع (الفورميلا 1)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق تتابع العدو.\n2. يؤدي العدو السريع والتسليم بلمس يد الزميل في تتابع العدو.\n3. يطبق قواعد السباق (الانطلاق بعد اللمس، البقاء في المسار).\n4. يتعرف سباق الجري المتنوع وقواعده.\n5. يوظف الحركات الأساسية (العدو، الجري المتعرج، تعدية الحواجز، الدحرجة) في سباق واحد.\n6. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: مراتب\n- أخرى: عصي التتابع", "المفاهيم": "- العدو\n- التتابع المكوكي\n- المسار\n- التسليم\n- القاعدة القانونية\n- الجري المتنوع\n- الفورميلا 1\n- تعدية الحواجز\n- الجري المتعرج", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور عدائين في سباق تتابع ويسأل: كيف يفوز الفريق؟ ويقدم ألعاب القوى للصغار (ص 94-95).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف، رفع الركبتين، جري مع تزايد السرعة، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج العدو (الجري على المشطين، الذراعان منثنيتان وتتحركان بالتبادل، النظر للأمام) ونموذج التسليم المكوكي بلمس يد الزميل الواقف خلف الخط (ص 95-96)، ويقلد التلميذ العدو والتسليم (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 97: فرق متساوية في قطارات متقابلة على مسافة 20 م، يعدو الأول ويلمس يد الزميل المقابل فينطلق، حتى يعود الجميع، ويسجل القائد الأخطاء، ويؤدي التلميذ السباق ويلتزم بالقواعد (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول سباق تتابع العدو، ويبدأ المعلم بسؤال «متى ينطلق العداء التالي في تتابع العدو» (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. يؤدي المعلم نموذج مناطق المسار المنحني (40-50 م): دحرجة فوق المراتب، عدو، عدو متعرج بين الأعلام، جري بتعدية الحواجز، تسليم العصا، ويقلد كل منطقة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 و3 ص 98-100: فرق في قطارات، يؤدي كل تلميذ المسار كاملًا ويسلم العصا للتالي، ويراقب القائد تعدية الحواجز دون إسقاطها، ويؤدي التلميذ المسار ويسلم العصا (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 (السباق الرئيسي) ص 103: الفورميلا 1 بين الفرق وتحديد الفائز، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): متى ينطلق العداء التالي في تتابع العدو؟\nالإجابة: بعد لمس يد زميله.\nس2 (مستوى التطبيق): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وتتحركان بالتبادل مع الرجلين.\nس3 (مستوى الاستدلال): ما الخطأ الذي يجعل الفريق يخسر؟\nالإجابة: الانطلاق قبل اللمس أو الخروج من المسار.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على التسليم بلمس اليد ببطء: يقف التلميذ في مساره ولا ينطلق إلا بعد اللمس، ثم يسأله: متى ينطلق العداء التالي في تتابع العدو؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق تتابع عدو لفريقين مع تحكيمه وفق القواعد (الانطلاق بعد اللمس، والبقاء في المسار)، وتحديد الأخطاء التي تُخسر الفريق.\n\nس4 (مستوى المعرفة): اذكر مناطق مسار الفورميلا 1.\nالإجابة: الدحرجة، العدو، العدو المتعرج، تعدية الحواجز.\nس5 (مستوى التطبيق): ماذا نسلم للزميل في هذا السباق؟\nالإجابة: عصا التتابع.\nس6 (مستوى الاستدلال): ما الحركة التي نؤديها بين الأعلام؟\nالإجابة: الجري المتعرج.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على التسليم بلمس اليد ببطء: يقف التلميذ في مساره ولا ينطلق إلا بعد اللمس، ثم يسأله: متى ينطلق العداء التالي في تتابع العدو؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق تتابع عدو لفريقين مع تحكيمه وفق القواعد (الانطلاق بعد اللمس، والبقاء في المسار)، وتحديد الأخطاء التي تُخسر الفريق.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدتين لسباق تتابع العدو.\nالإجابة: الانطلاق بعد اللمس، والبقاء في المسار.\nس2 (مستوى التطبيق): أدِّ العدو 20 م بالطريقة الصحيحة.\nالإجابة: يعدو على المشطين والنظر للأمام.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام في العدو ولا ننظر للزملاء؟\nالإجابة: للمحافظة على السرعة والاتجاه.\n\nس4 (مستوى المعرفة): أدِّ مسار الفورميلا 1 كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس5 (مستوى التطبيق): ما الحركات الأساسية التي تضمنها سباق اليوم؟\nالإجابة: الجري، الوثب (تعدية الحواجز)، الدحرجة، تغيير الاتجاه.\nس6 (مستوى الاستدلال): كيف شعرت بمشاركة فريقك في السباق؟\nالإجابة: يعبر عن الرضا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على جري قصير سريع مع العائلة بالتتابع في مكان آمن (دليل المعلم ص 95-97).\nإرشاد لولي الأمر: ناقش مع طفلك مناطق سباق الفورميلا 1 وشجعه على الجري اليومي (دليل المعلم ص 96-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=10"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق تتابع العدو.\n2. يؤدي العدو السريع والتسليم بلمس يد الزميل في تتابع العدو.\n3. يطبق قواعد السباق (الانطلاق بعد اللمس، البقاء في المسار).\n4. يتعرف سباق الجري المتنوع وقواعده.\n5. يوظف الحركات الأساسية (العدو، الجري المتعرج، تعدية الحواجز، الدحرجة) في سباق واحد.\n6. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: مراتب\n- أخرى: عصي التتابع", "المفاهيم": "الحصة 1:\n- العدو\n- التتابع المكوكي\n- المسار\n- التسليم\n- القاعدة القانونية\n- الجري المتنوع\n- الفورميلا 1\n- تعدية الحواجز\n- الجري المتعرج", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور عدائين في سباق تتابع ويسأل: كيف يفوز الفريق؟ ويقدم ألعاب القوى للصغار (ص 94-95).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري خفيف، رفع الركبتين، جري مع تزايد السرعة، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج العدو (الجري على المشطين، الذراعان منثنيتان وتتحركان بالتبادل، النظر للأمام) ونموذج التسليم المكوكي بلمس يد الزميل الواقف خلف الخط (ص 95-96)، ويقلد التلميذ العدو والتسليم (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 97: فرق متساوية في قطارات متقابلة على مسافة 20 م، يعدو الأول ويلمس يد الزميل المقابل فينطلق، حتى يعود الجميع، ويسجل القائد الأخطاء، ويؤدي التلميذ السباق ويلتزم بالقواعد (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول سباق تتابع العدو، ويبدأ المعلم بسؤال «متى ينطلق العداء التالي في تتابع العدو» (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. يؤدي المعلم نموذج مناطق المسار المنحني (40-50 م): دحرجة فوق المراتب، عدو، عدو متعرج بين الأعلام، جري بتعدية الحواجز، تسليم العصا، ويقلد كل منطقة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 و3 ص 98-100: فرق في قطارات، يؤدي كل تلميذ المسار كاملًا ويسلم العصا للتالي، ويراقب القائد تعدية الحواجز دون إسقاطها، ويؤدي التلميذ المسار ويسلم العصا (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 (السباق الرئيسي) ص 103: الفورميلا 1 بين الفرق وتحديد الفائز، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): متى ينطلق العداء التالي في تتابع العدو؟\nالإجابة: بعد لمس يد زميله.\nس2 (مستوى التطبيق): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وتتحركان بالتبادل مع الرجلين.\nس3 (مستوى الاستدلال): ما الخطأ الذي يجعل الفريق يخسر؟\nالإجابة: الانطلاق قبل اللمس أو الخروج من المسار.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على التسليم بلمس اليد ببطء: يقف التلميذ في مساره ولا ينطلق إلا بعد اللمس، ثم يسأله: متى ينطلق العداء التالي في تتابع العدو؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق تتابع عدو لفريقين مع تحكيمه وفق القواعد (الانطلاق بعد اللمس، والبقاء في المسار)، وتحديد الأخطاء التي تُخسر الفريق.\n\nس4 (مستوى المعرفة): اذكر مناطق مسار الفورميلا 1.\nالإجابة: الدحرجة، العدو، العدو المتعرج، تعدية الحواجز.\nس5 (مستوى التطبيق): ماذا نسلم للزميل في هذا السباق؟\nالإجابة: عصا التتابع.\nس6 (مستوى الاستدلال): ما الحركة التي نؤديها بين الأعلام؟\nالإجابة: الجري المتعرج.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على التسليم بلمس اليد ببطء: يقف التلميذ في مساره ولا ينطلق إلا بعد اللمس، ثم يسأله: متى ينطلق العداء التالي في تتابع العدو؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق تتابع عدو لفريقين مع تحكيمه وفق القواعد (الانطلاق بعد اللمس، والبقاء في المسار)، وتحديد الأخطاء التي تُخسر الفريق.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر قاعدتين لسباق تتابع العدو.\nالإجابة: الانطلاق بعد اللمس، والبقاء في المسار.\nس2 (مستوى التطبيق): أدِّ العدو 20 م بالطريقة الصحيحة.\nالإجابة: يعدو على المشطين والنظر للأمام.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام في العدو ولا ننظر للزملاء؟\nالإجابة: للمحافظة على السرعة والاتجاه.\n\nس4 (مستوى المعرفة): أدِّ مسار الفورميلا 1 كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس5 (مستوى التطبيق): ما الحركات الأساسية التي تضمنها سباق اليوم؟\nالإجابة: الجري، الوثب (تعدية الحواجز)، الدحرجة، تغيير الاتجاه.\nس6 (مستوى الاستدلال): كيف شعرت بمشاركة فريقك في السباق؟\nالإجابة: يعبر عن الرضا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على جري قصير سريع مع العائلة بالتتابع في مكان آمن (دليل المعلم ص 95-97).\nإرشاد لولي الأمر: ناقش مع طفلك مناطق سباق الفورميلا 1 وشجعه على الجري اليومي (دليل المعلم ص 96-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=10"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 18-23", "n": 1, "periods": [{"focus": "الممارسات الصحية: التنفس الصحيح أثناء الجري والراحة بعد الجهد + المهرجان الرياضي التعليمي لألعاب القوى للصغار (سباقات الجري) والطلاقة الحركية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التنفس الصحيح أثناء الجري (الشهيق من الأنف والزفير من الفم).\n2. يميز علامات التعب التي تستدعي الراحة.\n3. يطبق المشي والتنفس العميق بعد الجري بدل التوقف المفاجئ.\n4. يوظف العدو والتتابع والجري المتنوع في أقسام المهرجان.\n5. يطبق قواعد السباقات والأمان.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: زجاجات ماء\n- أخرى: حواجز منخفضة\n- أخرى: أعلام\n- أخرى: عصي التتابع\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: لوحة نقاط", "المفاهيم": "- التنفس\n- الشهيق والزفير\n- النبض\n- الراحة\n- التعب\n- المهرجان الرياضي التعليمي\n- سباقات الجري\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "بعد جري قصير يسأل المعلم: كيف تتنفسون الآن؟ ويعرض صورة عداء يتنفس بانتظام.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع التنفس المنتظم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم بالنموذج: الشهيق من الأنف والزفير من الفم بإيقاع مع الخطوات، وعدم التوقف فجأة بعد الجري بل المشي والتنفس العميق، وعلامات التعب (دوار، ألم في الجنب) التي تستدعي الراحة (برنامج صحتي ص 23)، ويقلد التلميذ التنفس ويرتب البطاقات (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجري التلاميذ 30 ثانية ثم يقيس كل تلميذ نبضه بيده على الصدر، ثم يمشي دقيقة ويقيس مرة أخرى، ويكتشف أثر المشي والتنفس في عودة النبض، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (العداء الذكي): نداءات (اجرِ، امشِ وتنفس، استرح في الظل) ويستجيب التلاميذ، ويلعب التلميذ ويستجيب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم): قسم تتابع العدو، قسم الفورميلا 1 المصغر، قسم سلم الرشاقة والحبل، قسم الجري المتعرج بين الأعلام بالكرة، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. سباق ختامي بين الفرق، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة بالمشي والتنفس وتكريم، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين نأخذ الشهيق أثناء الجري؟\nالإجابة: من الأنف.\nس2 (مستوى التطبيق): لماذا لا نتوقف فجأة بعد الجري السريع؟\nالإجابة: حتى لا نشعر بالدوار، فنمشي ونتنفس بعمق.\nس3 (مستوى الاستدلال): اذكر علامة تعب تستدعي الراحة.\nالإجابة: الدوار أو ألم الجنب.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على الشهيق من الأنف والزفير من الفم أثناء جري خفيف، ثم المشي والتنفس العميق بعده، ثم يسأله: لماذا لا نتوقف فجأة بعد الجري السريع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «علامات التعب» (الدوار، وألم الجنب) وما نفعله عند كل علامة، وقيادة زملائهم في التهدئة بعد سباق المهرجان.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه عصا التتابع؟\nالإجابة: قسم الفورميلا 1.\nس5 (مستوى التطبيق): كيف نسلم في تتابع العدو؟\nالإجابة: بلمس يد الزميل.\nس6 (مستوى الاستدلال): ماذا نفعل بعد كل قسم جري؟\nالإجابة: نمشي ونتنفس بعمق.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على الشهيق من الأنف والزفير من الفم أثناء جري خفيف، ثم المشي والتنفس العميق بعده، ثم يسأله: لماذا لا نتوقف فجأة بعد الجري السريع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «علامات التعب» (الدوار، وألم الجنب) وما نفعله عند كل علامة، وقيادة زملائهم في التهدئة بعد سباق المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): ماذا حدث لنبضك بعد المشي دقيقة؟\nالإجابة: انخفض وعاد إلى الهدوء.\nس2 (مستوى التطبيق ع العدو؟\nالإجابة: بلمس يد الزميل.\nس6 (مستوى الاستدلال): ماذا نفعل بعد كل قسم جري؟\nالإجابة: نمشي ونتنفس بعمق.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على الشهيق من الأنف والزفير من الفم أثناء جري خفيف، ثم المشي والتنفس العميق بعده، ثم يسأله: لماذا لا نتوقف فجأة بعد الجري السريع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «علامات التعب» (الدوار، وألم الجنب) وما نفعله عند كل علامة، وقيادة زملائهم في التهدئة بعد سباق المهرجان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ماذا حدث لنبضك بعد المشي دقيقة؟\nالإجابة: انخفض وعاد إلى الهدوء.\nس2 (مستوى التطبيق): أرفع بطاقة طفل جلس فجأة بعد الجري، ما الأفضل له؟\nالإجابة: أن يمشي ويتنفس بعمق أولًا.\nس3 (مستوى الاستدلال): كيف تنظم تنفسك في سباق طويل؟\nالإجابة: شهيق من الأنف وزفير من الفم بإيقاع منتظم.\n\nس4 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: تتابع العدو، الفورميلا 1، سلم الرشاقة والحبل، الجري المتعرج بالكرة.\nس5 (مستوى التطبيق): ما القاعدة التي راقبها الحكم الصغير في التتابع؟\nالإجابة: الانطلاق بعد اللمس.\nس6 (مستوى الاستدلال): كيف تشجع زميلًا تأخر في السباق؟\nالإجابة: أصفق له وأقول: أحسنت، المهم المشاركة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: علّم طفلك المشي والتنفس العميق بعد اللعب وعدم التوقف المفاجئ (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على الجري اليومي (دليل المعلم ص 94-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=11"}}, {"title": "مسابقات الوثب", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الرابع عشر", "date": "6-10/12/2026", "pages": "دليل المعلم ص 104-113", "n": 1, "periods": [{"focus": "مسابقة وثبة القرفصاء للأمام + مسابقة الوثب في المربعات المتقاطعة ومنافسات الوثب", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الوثب في ألعاب القوى للصغار وقواعد وثبة القرفصاء.\n2. يؤدي وثبة القرفصاء للأمام بمرجحة الذراعين والهبوط على القدمين.\n3. يطبق قواعد المسابقة (الوثب من خلف الخط، تتابع الفريق).\n4. يتعرف مسابقة المربعات المتقاطعة وقواعدها.\n5. يوظف الوثب بالقدمين في اتجاهات (أمام، خلف، جانب) داخل المربعات.\n6. يستمتع بمشاركة زملائه مسابقات الوثب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: بطاقات مرقمة\n- أخرى: مراتب\n- صورة توضيحية\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: حبال\n- أخرى: مربعات الأرقام", "المفاهيم": "- الوثب\n- وثبة القرفصاء\n- الارتقاء\n- الهبوط\n- خط الوثب\n- المربعات المتقاطعة\n- الوثب في اتجاهات\n- الإيقاع\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب الوثب الطويل ويسأل: من أين يبدأ الوثب وأين يهبط؟ ويقدم مسابقات الوثب للصغار (ص 104-105).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، وثب في المكان، ثني الركبتين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وثبة القرفصاء (ص 106): وقوف خلف الخط، ثني الركبتين بعمق ومرجحة الذراعين خلفًا، الدفع بالقدمين مع مرجحة الذراعين أمامًا عاليًا، الهبوط على القدمين بثني الركبتين، ونقطة القياس من مؤخرة القدم، ويقلد التلميذ بالتدرج (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 107: فرق في قطارات، يثب الأول من خلف الخط مرة واحدة لأبعد نقطة، ثم يثب الثاني من نقطة هبوط الأول وهكذا، وتقاس المسافة الكلية للفريق، ويؤدي التلميذ الوثبة ويتتابع (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم نموذج المربعات المتقاطعة (ص 108): الوقوف في المربع الأوسط والوثب بالقدمين للأمام ثم العودة ثم للجانبين بالترتيب وبإيقاع، وعد الوثبات الصحيحة في 20 ثانية، ويقلد التلميذ بالترتيب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 و3 ص 109-111: محطات الوثب: المربعات المتقاطعة، الوثب فوق الحبال، الوثب داخل الأطواق المتباعدة، وثبة القرفصاء على المرتبة، بأربع مجموعات والتبديل، ويؤدي التلميذ ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 ( الرئيسية) ص 113: ثبة القرفصاء بالتتابع بين الفرق، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين تقاس وثبة الفريق التالي؟\nالإجابة: من نقطة هبوط التلميذ السابق.\nس2 (مستوى التطبيق): ماذا نفعل بالذراعين عند الوثب؟\nالإجابة: نمرجحهما خلفًا ثم أمامًا عاليًا.\nس3 (مستوى الاستدلال): كيف نهبط بعد وثبة القرفصاء؟\nالإجابة: على القدمين معًا بثني الركبتين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ وثبة القرفصاء ببطء: مرجحة الذراعين خلفًا ثم أمامًا عاليًا، والوثب من خلف الخط، والهبوط على القدمين بثني الركبتين، ثم يطلب منه أداءها مرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ مسابقة وثب فريقية تقاس فيها وثبة كل تلميذ من نقطة هبوط السابق، وتسجيل المسافة الكلية، واقتراح طريقة لزيادتها.\n\nس4 (مستوى المعرفة): من أين نبدأ في المربعات المتقاطعة؟\nالإجابة: من المربع الأوسط.\nس5 (مستوى التطبيق): ما ترتيب الوثب في المربعات؟\nالإجابة: أمام ثم عودة ثم الجانبان.\nس6 (مستوى الاستدلال): كيف نحسب النقاط في المربعات المتقاطعة؟\nالإجابة: بعدد الوثبات الصحيحة في الزمن المحدد.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ وثبة القرفصاء ببطء: مرجحة الذراعين خلفًا ثم أمامًا عاليًا، والوثب من خلف الخط، والهبوط على القدمين بثني الركبتين، ثم يطلب منه أداءها مرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ مسابقة وثب فريقية تقاس فيها وثبة كل تلميذ من نقطة هبوط السابق، وتسجيل المسافة الكلية، واقتراح طريقة لزيادتها.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ وثبة القرفصاء للأمام من خلف الخط.\nالإجابة: يؤديها بمرجحة الذراعين والهبوط الآمن.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد المسابقة.\nالإجابة: الوثب من خلف الخط دون تجاوزه.\nس3 (مستوى الاستدلال): كيف يفوز الفريق في مسابقة وثبة القرفصاء؟\nالإجابة: بأكبر مسافة كلية لوثبات أفراده.\n\nس4 (مستوى المعرفة): أدِّ الوثب في المربعات المتقاطعة 10 ثوانٍ.\nالإجابة: يؤديه بالترتيب والإيقاع.\nس5 (مستوى التطبيق): أرفع صورة مسابقة وثب، ما اسمها؟\nالإجابة: وثبة القرفصاء أو المربعات المتقاطعة.\nس6 (مستوى الاستدلال): كيف شعرت في مسابقات الوثب؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على وثبة القرفصاء للأمام وقياس المسافة في مكان آمن (دليل المعلم ص 106-107).\nإرشاد لولي الأمر: ارسم مع طفلك مربعات متقاطعة بالطباشير ومارسا الوثب فيها (دليل المعلم ص 108-113).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=12"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الوثب في ألعاب القوى للصغار وقواعد وثبة القرفصاء.\n2. يؤدي وثبة القرفصاء للأمام بمرجحة الذراعين والهبوط على القدمين.\n3. يطبق قواعد المسابقة (الوثب من خلف الخط، تتابع الفريق).\n4. يتعرف مسابقة المربعات المتقاطعة وقواعدها.\n5. يوظف الوثب بالقدمين في اتجاهات (أمام، خلف، جانب) داخل المربعات.\n6. يستمتع بمشاركة زملائه مسابقات الوثب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: بطاقات مرقمة\n- أخرى: مراتب\n- صورة توضيحية\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: حبال\n- أخرى: مربعات الأرقام", "المفاهيم": "الحصة 1:\n- الوثب\n- وثبة القرفصاء\n- الارتقاء\n- الهبوط\n- خط الوثب\n- المربعات المتقاطعة\n- الوثب في اتجاهات\n- الإيقاع\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة لاعب الوثب الطويل ويسأل: من أين يبدأ الوثب وأين يهبط؟ ويقدم مسابقات الوثب للصغار (ص 104-105).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري، وثب في المكان، ثني الركبتين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وثبة القرفصاء (ص 106): وقوف خلف الخط، ثني الركبتين بعمق ومرجحة الذراعين خلفًا، الدفع بالقدمين مع مرجحة الذراعين أمامًا عاليًا، الهبوط على القدمين بثني الركبتين، ونقطة القياس من مؤخرة القدم، ويقلد التلميذ بالتدرج (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 107: فرق في قطارات، يثب الأول من خلف الخط مرة واحدة لأبعد نقطة، ثم يثب الثاني من نقطة هبوط الأول وهكذا، وتقاس المسافة الكلية للفريق، ويؤدي التلميذ الوثبة ويتتابع (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم نموذج المربعات المتقاطعة (ص 108): الوقوف في المربع الأوسط والوثب بالقدمين للأمام ثم العودة ثم للجانبين بالترتيب وبإيقاع، وعد الوثبات الصحيحة في 20 ثانية، ويقلد التلميذ بالترتيب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 و3 ص 109-111: محطات الوثب: المربعات المتقاطعة، الوثب فوق الحبال، الوثب داخل الأطواق المتباعدة، وثبة القرفصاء على المرتبة، بأربع مجموعات والتبديل، ويؤدي التلميذ ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 ( الرئيسية) ص 113: ثبة القرفصاء بالتتابع بين الفرق، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): من أين تقاس وثبة الفريق التالي؟\nالإجابة: من نقطة هبوط التلميذ السابق.\nس2 (مستوى التطبيق): ماذا نفعل بالذراعين عند الوثب؟\nالإجابة: نمرجحهما خلفًا ثم أمامًا عاليًا.\nس3 (مستوى الاستدلال): كيف نهبط بعد وثبة القرفصاء؟\nالإجابة: على القدمين معًا بثني الركبتين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ وثبة القرفصاء ببطء: مرجحة الذراعين خلفًا ثم أمامًا عاليًا، والوثب من خلف الخط، والهبوط على القدمين بثني الركبتين، ثم يطلب منه أداءها مرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ مسابقة وثب فريقية تقاس فيها وثبة كل تلميذ من نقطة هبوط السابق، وتسجيل المسافة الكلية، واقتراح طريقة لزيادتها.\n\nس4 (مستوى المعرفة): من أين نبدأ في المربعات المتقاطعة؟\nالإجابة: من المربع الأوسط.\nس5 (مستوى التطبيق): ما ترتيب الوثب في المربعات؟\nالإجابة: أمام ثم عودة ثم الجانبان.\nس6 (مستوى الاستدلال): كيف نحسب النقاط في المربعات المتقاطعة؟\nالإجابة: بعدد الوثبات الصحيحة في الزمن المحدد.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ وثبة القرفصاء ببطء: مرجحة الذراعين خلفًا ثم أمامًا عاليًا، والوثب من خلف الخط، والهبوط على القدمين بثني الركبتين، ثم يطلب منه أداءها مرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ مسابقة وثب فريقية تقاس فيها وثبة كل تلميذ من نقطة هبوط السابق، وتسجيل المسافة الكلية، واقتراح طريقة لزيادتها.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ وثبة القرفصاء للأمام من خلف الخط.\nالإجابة: يؤديها بمرجحة الذراعين والهبوط الآمن.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد المسابقة.\nالإجابة: الوثب من خلف الخط دون تجاوزه.\nس3 (مستوى الاستدلال): كيف يفوز الفريق في مسابقة وثبة القرفصاء؟\nالإجابة: بأكبر مسافة كلية لوثبات أفراده.\n\nس4 (مستوى المعرفة): أدِّ الوثب في المربعات المتقاطعة 10 ثوانٍ.\nالإجابة: يؤديه بالترتيب والإيقاع.\nس5 (مستوى التطبيق): أرفع صورة مسابقة وثب، ما اسمها؟\nالإجابة: وثبة القرفصاء أو المربعات المتقاطعة.\nس6 (مستوى الاستدلال): كيف شعرت في مسابقات الوثب؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على وثبة القرفصاء للأمام وقياس المسافة في مكان آمن (دليل المعلم ص 106-107).\nإرشاد لولي الأمر: ارسم مع طفلك مربعات متقاطعة بالطباشير ومارسا الوثب فيها (دليل المعلم ص 108-113).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=12"}}, {"title": "مسابقات الرمي", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 114-124", "n": 1, "periods": [{"focus": "مسابقة الرمي لإصابة هدف من فوق حاجز + مسابقة رمي الرمح للصغار لأبعد مسافة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الرمي في ألعاب القوى للصغار وقواعد الرمي على الهدف.\n2. يؤدي رمي الكرة بيد واحدة من فوق الكتف لإصابة هدف من فوق حاجز.\n3. يطبق قواعد الرمي (من خلف خط الرمي، عدد المحاولات).\n4. يتعرف مسابقة رمي الرمح للصغار وقواعدها.\n5. يؤدي رمي الرمح البلاستيكي من اقتراب قصير لأبعد مسافة.\n6. يشعر بالسعادة والرضا بمشاركة زملائه مسابقات الرمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات صغيرة\n- أخرى: حواجز\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- صورة توضيحية\n- أخرى: رماح بلاستيكية\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: مراتب", "المفاهيم": "- الرمي\n- الدقة\n- خط الرمي\n- الهدف\n- المحاولة\n- رمي الرمح\n- الاقتراب\n- منطقة الرمي\n- المسافة\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور مسابقات الرمي ويسأل: كيف نرمي بدقة نحو هدف؟ ويقدم مسابقة الرمي على الهدف (ص 114-115).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، دوران الذراعين، رمي الكرة لأعلى ولقفها، ويقلد التلميذ (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بيد واحدة من فوق الكتف: قدم متقدمة عكس اليد الرامية، سحب الذراع خلفًا، الرمي مع نقل الثقل للأمام والنظر إلى الهدف (ص 115-116)، ويقلد التلميذ بالتدرج (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 117: فرق في قطارات خلف خط الرمي، حاجز بينها وبين الأهداف (أطواق وسلال)، لكل تلميذ محاولتان، وتحسب نقاط الإصابة للفريق، ويرمي التلميذ ويسجل القائد (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يؤدي المعلم النموذج (ص 116): مسك الرمح من المقبض فوق الكتف، اقتراب 5 م، سحب الذراع خلفًا ورمي الرمح للأمام عاليًا قبل خط الرمي، مع قواعد الأمان (الرمي بالإشارة فقط، عدم جمع الرماح قبل انتهاء الجميع)، ويقلد التلميذ بالتدرج دون رمح ثم بالرمح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. نشاط 2 و3 ص 118-121: محطات الرمي: رمي الرمح لأبعد مسافة، الرمي على الهدف من فوق الحاجز، رمي الكرة من الاقتراب، بمجموعات وقائد يسجل المسافة بالشريط، ويرمي التلميذ ويسجل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 4 ( الرئيسية) ص 123: رمي الرمح للصغار بين الفرق، محاولتان لكل تلميذ، وتحسب أبعد محاولة، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): أي قدم تتقدم عند الرمي باليد اليمنى؟\nالإجابة: القدم اليسرى.\nس2 (مستوى التطبيق): من أين نرمي في المسابقة؟\nالإجابة: من خلف خط الرمي.\nس3 (مستوى الاستدلال): كم محاولة لكل تلميذ؟\nالإجابة: محاولتان.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ قريبًا من هدف كبير، ويرميان كرة صغيرة بيد واحدة من فوق الكتف مع تقديم القدم المعاكسة، ثم يسأله: أي قدم تتقدم عند الرمي باليد اليمنى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي من فوق حاجز نحو أهداف على مسافات مختلفة بمحاولتين لكل هدف، وتسجيل النقاط، وتفسير دور القدم المتقدمة.\n\nس4 (مستوى المعرفة): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس5 (مستوى التطبيق): كم مسافة الاقتراب قبل الرمي؟\nالإجابة: 5 أمتار.\nس6 (مستوى الاستدلال): اذكر قاعدة أمان في رمي الرمح.\nالإجابة: نرمي بإشارة المعلم فقط ولا نجمع الرماح قبل انتهاء الجميع.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ قريبًا من هدف كبير، ويرميان كرة صغيرة بيد واحدة من فوق الكتف مع تقديم القدم المعاكسة، ثم يسأله: أي قدم تتقدم عند الرمي باليد اليمنى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي من فوق حاجز نحو أهداف على مسافات مختلفة بمحاولتين لكل هدف، وتسجيل النقاط، وتفسير دور القدم المتقدمة.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة من فوق الحاجز لتصيب الطوق.\nالإجابة: يرمي بدقة من فوق الكتف.\nس2 (مستوى التطبيق): كيف يفوز الفريق في مسابقة الرمي على الهدف؟\nالإجابة: بأكبر عدد من الإصابات.\nس3 (مستوى الاستدلال): لماذا ننظر إلى الهدف لا إلى الكرة أثناء الرمي؟\nالإجابة: لتوجيه الرمية بدقة نحو الهدف.\n\nس4 (مستوى المعرفة): ارمِ الرمح من الاقتراب لأبعد مسافة.\nالإجابة: يرمي قبل خط الرمي داخل منطقة الرمي.\nس5 (مستوى التطبيق): أي المحاولتين تحتسب؟\nالإجابة: الأبعد.\nس6 (مستوى الاستدلال): كيف شعرت في مسابقات الرمي هذا الأسبوع؟\nالإجابة: يعبر عن الرضا والسعادة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك رمي كرة صغيرة فوق حبل لإصابة سلة (دليل المعلم ص 115-117).\nإرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان في الرمي، وشجعه على الرمي بأدوات خفيفة في مكان آمن (دليل المعلم ص 116-123).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=13"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الرمي في ألعاب القوى للصغار وقواعد الرمي على الهدف.\n2. يؤدي رمي الكرة بيد واحدة من فوق الكتف لإصابة هدف من فوق حاجز.\n3. يطبق قواعد الرمي (من خلف خط الرمي، عدد المحاولات).\n4. يتعرف مسابقة رمي الرمح للصغار وقواعدها.\n5. يؤدي رمي الرمح البلاستيكي من اقتراب قصير لأبعد مسافة.\n6. يشعر بالسعادة والرضا بمشاركة زملائه مسابقات الرمي.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات صغيرة\n- أخرى: حواجز\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- صورة توضيحية\n- أخرى: رماح بلاستيكية\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- الرمي\n- الدقة\n- خط الرمي\n- الهدف\n- المحاولة\n- رمي الرمح\n- الاقتراب\n- منطقة الرمي\n- المسافة\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور مسابقات الرمي ويسأل: كيف نرمي بدقة نحو هدف؟ ويقدم مسابقة الرمي على الهدف (ص 114-115).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري، دوران الذراعين، رمي الكرة لأعلى ولقفها، ويقلد التلميذ (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بيد واحدة من فوق الكتف: قدم متقدمة عكس اليد الرامية، سحب الذراع خلفًا، الرمي مع نقل الثقل للأمام والنظر إلى الهدف (ص 115-116)، ويقلد التلميذ بالتدرج (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 117: فرق في قطارات خلف خط الرمي، حاجز بينها وبين الأهداف (أطواق وسلال)، لكل تلميذ محاولتان، وتحسب نقاط الإصابة للفريق، ويرمي التلميذ ويسجل القائد (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يؤدي المعلم النموذج (ص 116): مسك الرمح من المقبض فوق الكتف، اقتراب 5 م، سحب الذراع خلفًا ورمي الرمح للأمام عاليًا قبل خط الرمي، مع قواعد الأمان (الرمي بالإشارة فقط، عدم جمع الرماح قبل انتهاء الجميع)، ويقلد التلميذ بالتدرج دون رمح ثم بالرمح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. نشاط 2 و3 ص 118-121: محطات الرمي: رمي الرمح لأبعد مسافة، الرمي على الهدف من فوق الحاجز، رمي الكرة من الاقتراب، بمجموعات وقائد يسجل المسافة بالشريط، ويرمي التلميذ ويسجل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 4 ( الرئيسية) ص 123: رمي الرمح للصغار بين الفرق، محاولتان لكل تلميذ، وتحسب أبعد محاولة، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): أي قدم تتقدم عند الرمي باليد اليمنى؟\nالإجابة: القدم اليسرى.\nس2 (مستوى التطبيق): من أين نرمي في المسابقة؟\nالإجابة: من خلف خط الرمي.\nس3 (مستوى الاستدلال): كم محاولة لكل تلميذ؟\nالإجابة: محاولتان.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ قريبًا من هدف كبير، ويرميان كرة صغيرة بيد واحدة من فوق الكتف مع تقديم القدم المعاكسة، ثم يسأله: أي قدم تتقدم عند الرمي باليد اليمنى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي من فوق حاجز نحو أهداف على مسافات مختلفة بمحاولتين لكل هدف، وتسجيل النقاط، وتفسير دور القدم المتقدمة.\n\nس4 (مستوى المعرفة): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس5 (مستوى التطبيق): كم مسافة الاقتراب قبل الرمي؟\nالإجابة: 5 أمتار.\nس6 (مستوى الاستدلال): اذكر قاعدة أمان في رمي الرمح.\nالإجابة: نرمي بإشارة المعلم فقط ولا نجمع الرماح قبل انتهاء الجميع.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ قريبًا من هدف كبير، ويرميان كرة صغيرة بيد واحدة من فوق الكتف مع تقديم القدم المعاكسة، ثم يسأله: أي قدم تتقدم عند الرمي باليد اليمنى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي من فوق حاجز نحو أهداف على مسافات مختلفة بمحاولتين لكل هدف، وتسجيل النقاط، وتفسير دور القدم المتقدمة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارمِ الكرة من فوق الحاجز لتصيب الطوق.\nالإجابة: يرمي بدقة من فوق الكتف.\nس2 (مستوى التطبيق): كيف يفوز الفريق في مسابقة الرمي على الهدف؟\nالإجابة: بأكبر عدد من الإصابات.\nس3 (مستوى الاستدلال): لماذا ننظر إلى الهدف لا إلى الكرة أثناء الرمي؟\nالإجابة: لتوجيه الرمية بدقة نحو الهدف.\n\nس4 (مستوى المعرفة): ارمِ الرمح من الاقتراب لأبعد مسافة.\nالإجابة: يرمي قبل خط الرمي داخل منطقة الرمي.\nس5 (مستوى التطبيق): أي المحاولتين تحتسب؟\nالإجابة: الأبعد.\nس6 (مستوى الاستدلال): كيف شعرت في مسابقات الرمي هذا الأسبوع؟\nالإجابة: يعبر عن الرضا والسعادة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: العب مع طفلك رمي كرة صغيرة فوق حبل لإصابة سلة (دليل المعلم ص 115-117).\nإرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان في الرمي، وشجعه على الرمي بأدوات خفيفة في مكان آمن (دليل المعلم ص 116-123).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=13"}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 64-124 (الوحدتان الثانية والثالثة)", "n": 1, "periods": [{"focus": "قياس أداء الاتزان والبراعة والطلاقة الحركية + قياس أداء ألعاب القوى للصغار (الجري، الوثب، الرمي)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الميزان الأمامي والاتزان على المقعد السويدي.\n2. يؤدي حركات البراعة الحركية (الوثب بتلامس القدمين، دوران الطاحونة).\n3. يؤدي الوثب بالحبل والجري في سلم الرشاقة.\n4. يؤدي العدو والتسليم في تتابع العدو بالقواعد الصحيحة.\n5. يؤدي وثبة القرفصاء للأمام بالطريقة الصحيحة.\n6. يؤدي رمي الكرة على الهدف ورمي الرمح البلاستيكي.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: كرات\n- أخرى: استمارة تقويم الأداء\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: كرات صغيرة\n- أخرى: رماح بلاستيكية\n- أخرى: حواجز", "المفاهيم": "- قياس الأداء\n- الاتزان\n- البراعة الحركية\n- الطلاقة الحركية\n- العدو\n- الوثب\n- الرمي", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات القياس ويطمئن التلاميذ ويذكر بالنقاط الفنية.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 الميزان الأمامي 5 ثوانٍ ثم المشي على المقعد والهبوط بثبات، محطة 2 الوثب بتلامس القدمين 3 مرات ودوران الطاحونة، محطة 3 الوثب بالحبل 10 مرات والجري في سلم الرشاقة؛ ويرصد المعلم في الاستمارة، ويؤدي التلميذ عند دوره ويتدرب مستقلًا (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية (تمثال الاتزان)، ويلعب التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. قياس فردي في ثلاث محطات مع تدريب ذاتي: محطة 1 عدو 20 م وتسليم بلمس اليد، محطة 2 وثبة القرفصاء للأمام مع قياس المسافة، محطة 3 رمي الكرة على الهدف من فوق الحاجز (محاولتان) ورمي الرمح من الاقتراب؛ ويرصد المعلم، ويؤدي التلميذ عند دوره ويتدرب مستقلًا (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. سباق ختامي قصير، ويلعب التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تهدئة وتعزيز وإعلان الإجازة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): أين تكون الذراعان في الميزان الأمامي؟\nالإجابة: جانبًا.\nس2 (مستوى التطبيق): بأي جزء من القدم نثب بالحبل؟\nالإجابة: بالمشطين.\nس3 (مستوى الاستدلال): ما الحركة التي تؤدى من الوقوف فتحًا بتلامس القدمين في الهواء؟\nالإجابة: الوثب بتلامس القدمين.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ المهارة التي لم يتقنها في القياس (الميزان الأمامي أو الوثب بالحبل على المشطين) بالتدرج مع سند، ثم يطلب منه أداءها مرة دون مساعدة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء مسار متصل يجمع الميزان الأمامي، والوثب بتلامس القدمين، والجري في سلم الرشاقة، مع المحافظة على النقاط الفنية لكل حركة.\n\nس4 (مستوى المعرفة): متى ينطلق العداء التالي؟\nالإجابة: بعد لمس يد زميله.\nس5 (مستوى التطبيق): كيف نهبط في وثبة القرفصاء؟\nالإجابة: على القدمين بثني الركبتين.\nس6 (مستوى الاستدلال): من أين نمسك الرمح؟\nالإجابة: من المقبض.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ المهارة التي لم يتقنها في القياس (الميزان الأمامي أو الوثب بالحبل على المشطين) بالتدرج مع سند، ثم يطلب منه أداءها مرة دون مساعدة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء مسار متصل يجمع الميزان الأمامي، والوثب بتلامس القدمين، والجري في سلم الرشاقة، مع المحافظة على النقاط الفنية لكل حركة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الجري بهبوط قدم في كل مربع عبر السلم.\nالإجابة: يؤديه بدقة.\nس2 (مستوى التطبيق): كيف تهبط بثبات من المقعد السويدي؟\nالإجابة: بالقدمين معًا وثني الركبتين.\nس3 (مستوى الاستدلال): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر ويعلل.\n\nس4 (مستوى المعرفة): أدِّ وثبة القرفصاء وقس مسافتك.\nالإجابة: يؤديها ويقيس.\nس5 (مستوى التطبيق): ارمِ الكرة لإصابة الهدف من فوق الحاجز.\nالإجابة: يرمي بدقة.\nس6 (مستوى الاستدلال): أي مسابقات ألعاب القوى أحببتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك مهارات الاتزان والبراعة قبل حصة القياس الثانية (دليل المعلم ص 64-90).\nإرشاد لولي الأمر: شجع طفلك على ممارسة الجري والوثب والرمي في العطلة بأمان (دليل المعلم ص 94-124).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=14"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يؤدي الميزان الأمامي والاتزان على المقعد السويدي.\n2. يؤدي حركات البراعة الحركية (الوثب بتلامس القدمين، دوران الطاحونة).\n3. يؤدي الوثب بالحبل والجري في سلم الرشاقة.\n4. يؤدي العدو والتسليم في تتابع العدو بالقواعد الصحيحة.\n5. يؤدي وثبة القرفصاء للأمام بالطريقة الصحيحة.\n6. يؤدي رمي الكرة على الهدف ورمي الرمح البلاستيكي.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: سم.\n2. يميز بين اليوم النشط واليوم الخامل.\n3. يخطط لنشاط بدني يومي في العطلة.\n4. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله.\n5. يطبق قواعد الأمن والسلامة أثناء النشاط الحر.\n6. يتعاون مع مجموعته ويتبادل القيادة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: رماح بلاستيكية", "المفاهيم": "- النشاط البدني\n- وقت الشاشة\n- اليوم النشط\n- الصحة\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم بطاقتين (طفل يلعب في الحديقة، طفل أمام الشاشة ساعات) ويسأل: أي اليومين أفضل للجسم؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم فوائد النشاط اليومي (قلب أقوى، عضلات أقوى، نوم أفضل، مزاج أفضل) وضرر الجلوس الطويل أمام الشاشة، ونصيحة: ساعة حركة يوميًا (برنامج صحتي ص 23)، ويستمع التلميذ ويرتب البطاقات (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (اليوم النشط): مسار بمحطات تمثل اليوم (مشي للمدرسة، لعب في الفسحة، رياضة عصرًا) يؤديه التلاميذ بالتتابع، ويلعب التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تضع كل مجموعة خطة أسبوعية لنشاط بدني في العطلة (نشاط لكل يوم) وتعرضها، ويخطط التلميذ ويعرض (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تقسيم المجموعات بقائد وتحاور كل مجموعة لاختيار لعبة وإعداد أدواتها، ويحاور التلميذ ويختار (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تنفذ المجموعات ألعابها بإشراف المعلم مع تبديل القائد في المنتصف، ويلعب التلميذ ويلتزم ويتبادل القيادة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تعرض كل مجموعة لعبتها في دقيقة، ويعرض التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة وتعبير عن أجمل حصة في الفصل، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر فائدتين للنشاط البدني اليومي.\nالإجابة: قلب أقوى ونوم أفضل.\nس2 (مستوى التطبيق): كم ساعة حركة يوميًا ينصح بها للأطفال؟\nالإجابة: ساعة على الأقل.\nس3 (مستوى الاستدلال): ما ضرر الجلوس الطويل أمام الشاشة؟\nالإجابة: ضعف العضلات والقوام وتعب العين.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا ليوم نشط وآخر خامل، ويفرزها مع التلميذ ويعدّان دقائق الحركة في كل يوم، ثم يسأله: كم ساعة حركة يوميًا ينصح بها للأطفال؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتخطيط جدول نشاط بدني يومي لأسبوع من العطلة لا يقل عن ساعة يوميًا، واختيار نشاط حر لمجموعتهم وقيادته بأمان.\n\nس4 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر ويعلل.\nس5 (مستوى التطبيق): ما دور القائد في النشاط الحر؟\nالإجابة: ينظم ويوزع الأدوار ويحرص على السلامة.\nس6 (مستوى الاستدلال): لماذا نبدل القائد؟\nالإجابة: ليجرب الجميع القيادة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا ليوم نشط وآخر خامل، ويفرزها مع التلميذ ويعدّان دقائق الحركة في كل يوم، ثم يسأله: كم ساعة حركة يوميًا ينصح بها للأطفال؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتخطيط جدول نشاط بدني يومي لأسبوع من العطلة لا يقل عن ساعة يوميًا، واختيار نشاط حر لمجموعتهم وقيادته بأمان.", "التقويم الختامي": "س1 (مستوى المعرفة): ما النشاط الذي خططت له ليوم السبت في العطلة؟\nالإجابة: يذكر نشاطًا.\nس2 (مستوى التطبيق): أرفع صورة طفل يلعب بالدراجة، أهو يوم نشط؟\nالإجابة: نعم.\nس3 (مستوى الاستدلال): اقترح طريقة لتقليل وقت الشاشة.\nالإجابة: تحديد وقت محدد واللعب خارج المنزل.\n\nس4 (مستوى المعرفة): اذكر قاعدة سلامة التزمتم بها.\nالإجابة: مثل: عدم الدفع واستخدام الأدوات بحذر.\nس5 (مستوى التطبيق): ما المهارة من هذا الفصل التي استخدمتها في لعبتكم؟\nالإجابة: يذكر مهارة.\nس6 (مستوى الاستدلال): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ساعد طفلك على تنفيذ خطته الأسبوعية للنشاط البدني في العطلة (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: شجع طفلك على الألعاب الشعبية والحركية مع الأصدق   document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
