ات الفردية بالكرات الطبية للذراعين + التمرينات الفردية بالكرات الطبية للجذع والرجلين", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات بالأدوات (الكرات الطبية) وأهميتها.\n2. يؤدي تمرينات فردية بالكرة الطبية للذراعين بالعد.\n3. يميز بين التمرين الحر والتمرين بالأدوات.\n4. يؤدي تمرينات فردية بالكرة الطبية للجذع والرجلين.\n5. يميز أنواع التمرينات بالكرة الطبية حسب الجزء العامل.\n6. يقدر أهمية التمرينات بالأدوات في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: فهم\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: أقماع\n- أخرى: بطاقات مصورة", "المفاهيم": "- التمرين بالأدوات\n- الكرة الطبية\n- التمرينات الفردية بالأدوات\n- الذراعان\n- الجذع\n- الرجلان\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم كرة طبية وكرة عادية ويسأل: ما الفرق بينهما؟ ولماذا نستخدم الكرة الثقيلة في التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، تحريك الذراعين والكتفين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 43-44: (وقوف. الكرة أمامًا) رفع الكرة عاليًا وخفضها، (وقوف فتحًا. الكرة عاليًا) ثني الجذع جانبًا، (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا، بالعد مع التفكير بصوت عالٍ عن مسك الكرة بأمان، ويقلد التلميذ بالعد ويمسك الكرة بأمان (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ التمرين نفسه بكرة عادية ثم بالكرة الطبية ويكتشف الفرق في جهد الذراعين، ويستنتج فائدة الأدوات في زيادة قوة العضلات، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الكرة الثقيلة): في دائرة، تمرير الكرة الطبية من فوق الرأس من تلميذ لآخر بالعد، والمجموعة الأسرع دون سقوط تفوز، ويلعب التلميذ ويمرر بأمان (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم نماذج ص 45-46: (جلوس طويل. الكرة أمامًا) لف الجذع بالكرة، (رقود. الكرة بين القدمين) رفع الرجلين، (وقوف. الكرة بين القدمين) الوثب مع الكرة، (جلوس القرفصاء. الكرة أمامًا) الوقوف مع رفع الكرة، بالعد، ويقلد التلميذ بالعد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات بأربع مجموعات: محطة الجذع (لف الجذع بالكرة)، محطة الرجلين (رفع الرجلين بالكرة)، محطة الوثب بالكرة بين القدمين، محطة الذراعين (مراجعة)، مع تبديل وتسجيل القائد، ويؤدي التلميذ تمرين المحطة ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (أين الجزء؟): يرفع المعلم بطاقة تمرين بالكرة ويؤديه التلاميذ ويذكرون الجزء العامل، ويستجيب التلميذ ويذكر الجزء (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وإطالة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الكرة الطبية؟\nالإجابة: كرة ثقيلة نستخدمها أداة في التمرينات.\nس2 (مستوى التطبيق): أدِّ تمرين رفع الكرة عاليًا بالعد.\nالإجابة: يرفع الكرة ويخفضها بالعد.\nس3 (مستوى الاستدلال): لماذا تزيد الكرة الطبية من قوة الذراعين؟\nالإجابة: لأن حملها يحتاج إلى جهد أكبر من العضلات.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.\n\nس4 (مستوى المعرفة): اذكر تمرينًا بالكرة الطبية للجذع.\nالإجابة: لف الجذع بالكرة من الجلوس الطويل.\nس5 (مستوى التطبيق): أين نضع الكرة في تمرين رفع الرجلين؟\nالإجابة: بين القدمين.\nس6 (مستوى الاستدلال): ما الجزء العامل في الوثب بالكرة بين القدمين؟\nالإجابة: الرجلان.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "س1 (مستوى المعرفة): ما الفرق بين التمرين الحر والتمرين بالأدوات؟\nالإجابة: الحر بلا أدوات، وبالأدوات نستخدم كرة أو حبلًا أو عصا.\nس2 (مستوى التطبيق): اذكر تمرينًا بالكرة الطبية للذراعين.\nالإجابة: مد الذراعين عاليًا بالكرة من خلف الرأس.\nس3 (مستوى الاستدلال): كيف نمسك الكرة الطبية بأمان؟\nالإجابة: باليدين معًا وبإحكام وعدم رميها على الزملاء.\n\nس4 (مستوى المعرفة): أدِّ تمرين رفع الرجلين بالكرة بين القدمين 5 مرات.\nالإجابة: يؤديه من الرقود.\nس5 (مستوى التطبيق): صنّف هذا التمرين: (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا.\nالإجابة: تمرين للذراعين.\nس6 (مستوى الاستدلال): لماذا تحافظ التمرينات بالأدوات على لياقتنا؟\nالإجابة: لأنها تقوي العضلات بجهد أكبر وتنوع التدريب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل في المنزل لتمرينين للذراعين (دليل المعلم ص 43-44).\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع وآخر للرجلين بكرة خفيفة (دليل المعلم ص 45-46).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}, {"focus": "التمرينات الزوجية بالكرات الطبية + محطات وألعاب التمرينات بالكرات الطبية", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الزوجية بالكرات الطبية.\n2. يؤدي تمرينات زوجية بالكرة الطبية بالتوافق مع الزميل.\n3. يشارك زميله الأداء بأمان وتعاون.\n4. يؤدي التمرينات الفردية والزوجية بالكرات الطبية في محطات.\n5. يوظف الكرة الطبية في ألعاب ومنافسات بأمان.\n6. يميز نوع التمرين (فردي، زوجي) والجزء العامل من الصورة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: أطواق\n- أخرى: بطاقات مصورة", "المفاهيم": "- التمرينات الزوجية بالأدوات\n- التوافق\n- الزميل\n- الدفع بالقدم\n- الكرة الطبية\n- المحطات\n- الرمي\n- الجري بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يؤدي المعلم مع تلميذ تمرين (وقوف مواجه. الكرة أمام القدمين) تبادل دفع الكرة بالقدم ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم في أزواج، ويقلد التلميذ مع زميله (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ نماذج ص 47-48: (وقوف مواجه. مسك الكرة باليدين) تبادل دفع الكرة بالقدمين، (جلوس القرفصاء مواجه. الكرة بين القدمين) تبادل دفع الكرة، (جلوس طويل مواجه) تمرير الكرة من فوق الرأس، (وقوف ظهرًا لظهر) تمرير الكرة بلف الجذع، مع العد المشترك، ويؤدي التلميذ مع زميله بالتوافق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار (قائد يعد، وزميل يبدأ) تؤدي كل ثنائية البطاقات الأربع ثم تبتكر تمرينًا زوجيًا جديدًا بالكرة، والتلاميذ يتعاون ويبتكر (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المرآة بالكرة): يؤدي أحد الزوجين تمرينًا بالكرة ويقلده الآخر، ويلعب التلميذ بدقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 3 و4 ص 49-50: أربع محطات: رمي الكرة عاليًا والتقاطها، الجري بالكرة بين الأقماع، تمرينات زوجية بالكرة، تمرينات فردية للجذع، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 5 (ألعاب) ص 51: من فوق الرأس في القطار، والمجموعة الأسرع دون سقوط تفوز، ويتسابق التلميذ ويمرر بأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا سقطت الكرة في بعض القطارات؟ ليستنتج التلاميذ أهمية المسك الجيد والتوافق، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر تمرينًا زوجيًا بالكرة الطبية.\nالإجابة: تبادل دفع الكرة بالقدم من الوقوف مواجهًا للزميل.\nس2 (مستوى التطبيق): ماذا نراعي في التمرين الزوجي بالكرة؟\nالإجابة: العد معًا والدفع بلطف والمسك الجيد.\nس3 (مستوى الاستدلال): كيف نمرر الكرة ظهرًا لظهر؟\nالإجابة: بلف الجذع للجانب.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.\n\nس4 (مستوى المعرفة): في أي محطة جرينا بالكرة؟\nالإجابة: محطة الجري بين الأقماع.\nس5 (مستوى التطبيق): كيف مررنا الكرة في التتابع؟\nالإجابة: بين الرجلين ثم من فوق الرأس.\nس6 (مستوى الاستدلال): لماذا نمسك الكرة الطبية بإحكام؟\nالإجابة: حتى لا تسقط على القدمين أو الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ مع زميلك تمرير الكرة من فوق الرأس 5 مرات.\nالإجابة: يؤديانه من الجلوس الطويل المواجه.\nس2 (مستوى التطبيق): ما التمرين الزوجي الذي ابتكرتماه؟\nالإجابة: يذكر التمرين.\nس3 (مستوى الاستدلال): ماذا يحدث لو دفع زميلك الكرة بقوة كبيرة؟\nالإجابة: قد تؤذي الزميل، فندفعها بلطف وتوافق.\n\nس4 (مستوى المعرفة): أرفع صورة تمرين بالكرة، ما نوعه وما الجزء العامل؟\nالإجابة: يذكر فردي/زوجي والجزء.\nس5 (مستوى التطبيق): أدِّ مع مجموعتك تمرير الكرة من فوق الرأس في القطار.\nالإجابة: يمرر بتوافق.\nس6 (مستوى الاستدلال): ما أهم قاعدة سلامة مع الكرة الطبية؟\nالإجابة: عدم رميها على الزملاء والمسك بإحكام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بتمرير كرة من فوق الرأس من الجلوس (دليل المعلم ص 47-48).\nإرشاد لولي الأمر: العب مع طفلك تمرير كرة ثقيلة قليلًا في قطار الأسرة من فوق الرأس وبين الرجلين (دليل المعلم ص 49-51).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات بالأدوات (الكرات الطبية) وأهميتها.\n2. يؤدي تمرينات فردية بالكرة الطبية للذراعين بالعد.\n3. يميز بين التمرين الحر والتمرين بالأدوات.\n4. يؤدي تمرينات فردية بالكرة الطبية للجذع والرجلين.\n5. يميز أنواع التمرينات بالكرة الطبية حسب الجزء العامل.\n6. يقدر أهمية التمرينات بالأدوات في المحافظة على اللياقة البدنية.\n\nالحصة 2:\n1. يتعرف التمرينات الزوجية بالكرات الطبية.\n2. يؤدي تمرينات زوجية بالكرة الطبية بالتوافق مع الزميل.\n3. يشارك زميله الأداء بأمان وتعاون.\n4. يؤدي التمرينات الفردية والزوجية بالكرات الطبية في محطات.\n5. يوظف الكرة الطبية في ألعاب ومنافسات بأمان.\n6. يميز نوع التمرين (فردي، زوجي) والجزء العامل من الصورة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: فهم\nالمخرج 6: تقييم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: أقماع\n- أخرى: بطاقات مصورة\n\nالحصة 2:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: أطواق\n- أخرى: بطاقات مصورة", "المفاهيم": "الحصة 1:\n- التمرين بالأدوات\n- الكرة الطبية\n- التمرينات الفردية بالأدوات\n- الذراعان\n- الجذع\n- الرجلان\n- اللياقة البدنية\n\nالحصة 2:\n- التمرينات الزوجية بالأدوات\n- التوافق\n- الزميل\n- الدفع بالقدم\n- الكرة الطبية\n- المحطات\n- الرمي\n- الجري بالكرة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم كرة طبية وكرة عادية ويسأل: ما الفرق بينهما؟ ولماذا نستخدم الكرة الثقيلة في التمرين؟\n\nالحصة 2:\nيؤدي المعلم مع تلميذ تمرين (وقوف مواجه. الكرة أمام القدمين) تبادل دفع الكرة بالقدم ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري، تحريك الذراعين والكتفين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 43-44: (وقوف. الكرة أمامًا) رفع الكرة عاليًا وخفضها، (وقوف فتحًا. الكرة عاليًا) ثني الجذع جانبًا، (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا، بالعد مع التفكير بصوت عالٍ عن مسك الكرة بأمان، ويقلد التلميذ بالعد ويمسك الكرة بأمان (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ التمرين نفسه بكرة عادية ثم بالكرة الطبية ويكتشف الفرق في جهد الذراعين، ويستنتج فائدة الأدوات في زيادة قوة العضلات، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الكرة الثقيلة): في دائرة، تمرير الكرة الطبية من فوق الرأس من تلميذ لآخر بالعد، والمجموعة الأسرع دون سقوط تفوز، ويلعب التلميذ ويمرر بأمان (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم نماذج ص 45-46: (جلوس طويل. الكرة أمامًا) لف الجذع بالكرة، (رقود. الكرة بين القدمين) رفع الرجلين، (وقوف. الكرة بين القدمين) الوثب مع الكرة، (جلوس القرفصاء. الكرة أمامًا) الوقوف مع رفع الكرة، بالعد، ويقلد التلميذ بالعد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات بأربع مجموعات: محطة الجذع (لف الجذع بالكرة)، محطة الرجلين (رفع الرجلين بالكرة)، محطة الوثب بالكرة بين القدمين، محطة الذراعين (مراجعة)، مع تبديل وتسجيل القائد، ويؤدي التلميذ تمرين المحطة ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (أين الجزء؟): يرفع المعلم بطاقة تمرين بالكرة ويؤديه التلاميذ ويذكرون الجزء العامل، ويستجيب التلميذ ويذكر الجزء (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وإطالة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم في أزواج، ويقلد التلميذ مع زميله (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ نماذج ص 47-48: (وقوف مواجه. مسك الكرة باليدين) تبادل دفع الكرة بالقدمين، (جلوس القرفصاء مواجه. الكرة بين القدمين) تبادل دفع الكرة، (جلوس طويل مواجه) تمرير الكرة من فوق الرأس، (وقوف ظهرًا لظهر) تمرير الكرة بلف الجذع، مع العد المشترك، ويؤدي التلميذ مع زميله بالتوافق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار (قائد يعد، وزميل يبدأ) تؤدي كل ثنائية البطاقات الأربع ثم تبتكر تمرينًا زوجيًا جديدًا بالكرة، والتلاميذ يتعاون ويبتكر (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المرآة بالكرة): يؤدي أحد الزوجين تمرينًا بالكرة ويقلده الآخر، ويلعب التلميذ بدقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 3 و4 ص 49-50: أربع محطات: رمي الكرة عاليًا والتقاطها، الجري بالكرة بين الأقماع، تمرينات زوجية بالكرة، تمرينات فردية للجذع، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 5 (ألعاب) ص 51: من فوق الرأس في القطار، والمجموعة الأسرع دون سقوط تفوز، ويتسابق التلميذ ويمرر بأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا سقطت الكرة في بعض القطارات؟ ليستنتج التلاميذ أهمية المسك الجيد والتوافق، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الكرة الطبية؟\nالإجابة: كرة ثقيلة نستخدمها أداة في التمرينات.\nس2 (مستوى التطبيق): أدِّ تمرين رفع الكرة عاليًا بالعد.\nالإجابة: يرفع الكرة ويخفضها بالعد.\nس3 (مستوى الاستدلال): لماذا تزيد الكرة الطبية من قوة الذراعين؟\nالإجابة: لأن حملها يحتاج إلى جهد أكبر من العضلات.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.\n\nس4 (مستوى المعرفة): اذكر تمرينًا بالكرة الطبية للجذع.\nالإجابة: لف الجذع بالكرة من الجلوس الطويل.\nس5 (مستوى التطبيق): أين نضع الكرة في تمرين رفع الرجلين؟\nالإجابة: بين القدمين.\nس6 (مستوى الاستدلال): ما الجزء العامل في الوثب بالكرة بين القدمين؟\nالإجابة: الرجلان.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر تمرينًا زوجيًا بالكرة الطبية.\nالإجابة: تبادل دفع الكرة بالقدم من الوقوف مواجهًا للزميل.\nس2 (مستوى التطبيق): ماذا نراعي في التمرين الزوجي بالكرة؟\nالإجابة: العد معًا والدفع بلطف والمسك الجيد.\nس3 (مستوى الاستدلال): كيف نمرر الكرة ظهرًا لظهر؟\nالإجابة: بلف الجذع للجانب.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.\n\nس4 (مستوى المعرفة): في أي محطة جرينا بالكرة؟\nالإجابة: محطة الجري بين الأقماع.\nس5 (مستوى التطبيق): كيف مررنا الكرة في التتابع؟\nالإجابة: بين الرجلين ثم من فوق الرأس.\nس6 (مستوى الاستدلال): لماذا نمسك الكرة الطبية بإحكام؟\nالإجابة: حتى لا تسقط على القدمين أو الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ما الفرق بين التمرين الحر والتمرين بالأدوات؟\nالإجابة: الحر بلا أدوات، وبالأدوات نستخدم كرة أو حبلًا أو عصا.\nس2 (مستوى التطبيق): اذكر تمرينًا بالكرة الطبية للذراعين.\nالإجابة: مد الذراعين عاليًا بالكرة من خلف الرأس.\nس3 (مستوى الاستدلال): كيف نمسك الكرة الطبية بأمان؟\nالإجابة: باليدين معًا وبإحكام وعدم رميها على الزملاء.\n\nس4 (مستوى المعرفة): أدِّ تمرين رفع الرجلين بالكرة بين القدمين 5 مرات.\nالإجابة: يؤديه من الرقود.\nس5 (مستوى التطبيق): صنّف هذا التمرين: (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا.\nالإجابة: تمرين للذراعين.\nس6 (مستوى الاستدلال): لماذا تحافظ التمرينات بالأدوات على لياقتنا؟\nالإجابة: لأنها تقوي العضلات بجهد أكبر وتنوع التدريب.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ مع زميلك تمرير الكرة من فوق الرأس 5 مرات.\nالإجابة: يؤديانه من الجلوس الطويل المواجه.\nس2 (مستوى التطبيق): ما التمرين الزوجي الذي ابتكرتماه؟\nالإجابة: يذكر التمرين.\nس3 (مستوى الاستدلال): ماذا يحدث لو دفع زميلك الكرة بقوة كبيرة؟\nالإجابة: قد تؤذي الزميل، فندفعها بلطف وتوافق.\n\nس4 (مستوى المعرفة): أرفع صورة تمرين بالكرة، ما نوعه وما الجزء العامل؟\nالإجابة: يذكر فردي/زوجي والجزء.\nس5 (مستوى التطبيق): أدِّ مع مجموعتك تمرير الكرة من فوق الرأس في القطار.\nالإجابة: يمرر بتوافق.\nس6 (مستوى الاستدلال): ما أهم قاعدة سلامة مع الكرة الطبية؟\nالإجابة: عدم رميها على الزملاء والمسك بإحكام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل في المنزل لتمرينين للذراعين (دليل المعلم ص 43-44).\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع وآخر للرجلين بكرة خفيفة (دليل المعلم ص 45-46).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بتمرير كرة من فوق الرأس من الجلوس (دليل المعلم ص 47-48).\nإرشاد لولي الأمر: العب مع طفلك تمرير كرة ثقيلة قليلًا في قطار الأسرة من فوق الرأس وبين الرجلين (دليل المعلم ص 49-51).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 18-23", "n": 1, "periods": [{"focus": "الممارسات الصحية: الإحماء والتهدئة ووقاية العضلات والمفاصل + المهرجان الرياضي التعليمي للتمرينات (الأوضاع المشتقة، التمرينات بالأدوات)", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده.\n2. يميز تمرينات الإحماء من تمرينات التهدئة ويعلل.\n3. يقود إحماءً بسيطًا لزملائه.\n4. يؤدي الأوضاع المشتقة والتمرينات بالكرات الطبية ضمن أقسام المهرجان.\n5. يطبق قواعد الأقسام والالتزام بالدور.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: كرات طبية خفيفة\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- الإحماء\n- التهدئة\n- الإصابة\n- المفاصل\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يحدث لو جرينا بسرعة قصوى من أول ثانية؟ ويعرض صورة لاعب يحمي عضلاته بالإحماء.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. يؤدي المعلم نموذج إحماء متدرج (مشي، جري خفيف، تحريك المفاصل من الرقبة إلى الكاحلين، إطالة خفيفة) مع التفكير بصوت عالٍ، ويقلد التلميذ ويكرر السبب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يقارن التلاميذ النبض والدفء قبل الإحماء وبعده ويستنتجون دوره في الوقاية من الإصابة (برنامج صحتي ص 23)، ويلاحظ التلميذ ويستنتج (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بأربع حركات ثم يتبادلون، ويقود التلميذ ويؤدي (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تصنف كل مجموعة بطاقات التمرينات إلى إحماء وتهدئة وتعلل، ويصنف التلميذ ويعلل (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم): قسم الأوضاع المشتقة من الجلوس والرقود (أداء الوضع من البطاقة وتمرين منه)، قسم التمرينات الفردية بالكرات الطبية، قسم التمرينات الزوجية بالكرات، قسم جمباز الموانع المبسط (وثب فوق الحبال ومروق أسفل الحاجز)، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: تتابع تمرير الكرة الطبية، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا يحمي الإحماء العضلات؟\nالإجابة: لأنه يرفع حرارتها ويجعلها مرنة فلا تصاب.\nس2 (مستوى التطبيق): بماذا نبدأ الإحماء؟\nالإجابة: بالمشي والجري الخفيف.\nس3 (مستوى الاستدلال): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء في البداية لتسخين الجسم، والتهدئة في النهاية لإراحته.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً من المشي ثم الجري الخفيف ثم تمرين مرونة، ثم تهدئة بالمشي البطيء والتنفس العميق، ثم يسأله: بماذا نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إحماء بسيط لمجموعتهم وتهدئة في نهاية النشاط، وتعليل ترتيب الحركات فيهما.\n\nس4 (مستوى المعرفة): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الزوجية بالكرات.\nس5 (مستوى التطبيق): اذكر وضعًا مشتقًا أديته في قسم الأوضاع.\nالإجابة: مثل: جلوس طويل فتحًا.\nس6 (مستوى الاستدلال): لماذا نسجل نقاط النظام والتعاون؟\nالإجابة: لأنهما من أهداف المهرجان.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً من المشي ثم الجري الخفيف ثم تمرين مرونة، ثم تهدئة بالمشي البطيء والتنفس العميق، ثم يسأله: بماذا نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إحماء بسيط لمجموعتهم وتهدئة في نهاية النشاط، وتعليل ترتيب الحركات فيهما.", "التقويم الختامي": "س1 (مستوى المعرفة): قُد إحماءً لزملائك بأربع حركات.\nالإجابة: يؤديه متدرجًا.\nس2 (مستوى التطبيق): صنّف: الإطالة البطيئة والتنفس العميق.\nالإجابة: تهدئة.\nس3 (مستوى الاستدلال): زميلك يريد الجري بأقصى سرعة فورًا، بماذا تنصحه؟\nالإجابة: أن يحمي عضلاته بالإحماء أولًا.\n\nس4 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الفردية بالكرات، التمرينات الزوجية، جمباز الموانع.\nس5 (مستوى التطبيق): ما دورك في مجموعتك؟\nالإجابة: يذكر دوره.\nس6 (مستوى الاستدلال): كيف تعبر عن روحك الرياضية عند الخسارة؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب والتهدئة بعده (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين بالكرة يوميًا (دليل المعلم ص 42-52).\n🎮  الفردية بالكرات، التمرينات الزوجية، جمباز الموانع.\nس5 (مستوى التطبيق): ما دورك في مجموعتك؟\nالإجابة: يذكر دوره.\nس6 (مستوى الاستدلال): كيف تعبر عن روحك الرياضية عند الخسارة؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب والتهدئة بعده (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين بالكرة يوميًا (دليل المعلم ص 42-52).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=4"}}, {"title": "تمرينات الموانع (جمباز الموانع)", "unit": "التمرينات (أتمرن بنظام)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 53-60", "n": 1, "periods": [{"focus": "التعرف إلى الموانع وطرق تخطيها + مسارات ومنافسات تمرينات الموانع", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع والأدوات المستخدمة كموانع.\n2. يؤدي حركات تخطي الموانع (الوثب فوق الحاجز، المروق أسفل الحبل، المشي على المقعد).\n3. يختار الحركة المناسبة لتخطي كل مانع.\n4. يؤدي مسار موانع متكاملًا بحركات متنوعة.\n5. يوظف الحركات والمهارات (جري، وثب، مروق، توازن) في منافسات الموانع.\n6. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: أقماع", "المفاهيم": "- تمرينات الموانع\n- المانع\n- الوثب\n- المروق\n- المشي على المقعد\n- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الأدوات ويسأل: كيف نتخطى الحاجز؟ وكيف نمر من تحت الحبل؟ ويعرض صور جمباز الموانع (ص 53-54).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، وثب، مروق، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل مانع (ص 55-56): الوثب بالقدمين فوق الحاجز، المروق أسفل الحبل المثبت، المشي على المقعد السويدي، المروق داخل قطعة الصندوق المقسم، الوثب بالحبل 5 م، مع نقاط الأمان، ويقلد كل حركة بعد النموذج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ طريقتين لتخطي المانع نفسه (مثلًا الوثب فوق الصندوق أم المروق داخله) ويكتشف الأنسب والأسرع والأكثر أمانًا، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في مجموعات، تؤدي كل مجموعة مسار موانع قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الحركة الصحيحة، ويؤدي التلميذ المسار بالتتابع (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 2 و3 ص 57-58: مجموعات بقائد تؤدي المسار بالتتابع مرتين، ويلاحظ القائد الأداء الصحيح ويصححه، ويؤدي التلميذ المسار ويصحح زملاءه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. منافسة الموانع ص 59: تتابع بين المجموعات في المسار، وتحسب النقاط للأداء الصحيح والسرعة، ويتسابق التلميذ بأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: ما الحركة التي أخذت وقتًا أطول؟ ولماذا؟ ليستنتج التلاميذ أن التوازن على المقعد يحتاج إلى هدوء، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور بالثقة، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما المانع؟\nالإجابة: أداة أو جهاز نتخطاه بحركة مثل الوثب أو المروق.\nس2 (مستوى التطبيق): كيف نتخطى الحبل المثبت المنخفض؟\nالإجابة: بالمروق أسفله أو الوثب فوقه حسب ارتفاعه.\nس3 (مستوى الاستدلال): ما الحركة المناسبة للمقعد السويدي؟\nالإجابة: المشي عليه بتوازن.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (المروق أسفل الحبل، ثم المشي على المقعد السويدي بتوازن)، ثم يطلب منه اجتياز المانعين وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باجتياز مسار موانع متكامل (حاجز، وحبل، ومقعد سويدي) بحركات متنوعة، واقتراح طريقة جديدة آمنة لتخطي أحد الموانع.\n\nس4 (مستوى المعرفة): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: جري متعرج، وثب فوق الحاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة.\nس5 (مستوى التطبيق): ما الحركة التي نؤديها على المرتبة في نهاية المسار؟\nالإجابة: الدحرجة.\nس6 (مستوى الاستدلال): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (المروق أسفل الحبل، ثم المشي على المقعد السويدي بتوازن)، ثم يطلب منه اجتياز المانعين وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باجتياز مسار موانع متكامل (حاجز، وحبل، ومقعد سويدي) بحركات متنوعة، واقتراح طريقة جديدة آمنة لتخطي أحد الموانع.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر ثلاث أدوات تستخدم موانع.\nالإجابة: الحاجز، الحبل، المقعد السويدي (أو الصندوق المقسم).\nس2 (مستوى التطبيق): أدِّ المروق داخل قطعة الصندوق المقسم.\nالإجابة: يؤديه دون لمس الأطراف.\nس3 (مستوى الاستدلال): لماذا اخترت الوثب فوق الحاجز لا المروق؟\nالإجابة: لأن الحاجز منخفض والوثب أسرع وأسهل.\n\nس4 (مستوى المعرفة): أدِّ مسار الموانع كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس5 (مستوى التطبيق): كيف شعرت عندما تخطيت الموانع كلها؟\nالإجابة: يعبر عن الثقة.\nس6 (مستوى الاستدلال): اقترح مانعًا جديدًا للمسار والحركة المناسبة له.\nالإجابة: مثل: أطواق على الأرض والحجل داخلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا (وسادة للوثب، كرسي للمروق تحته) ومارساه بأمان (دليل المعلم ص 55-56).\nإرشاد لولي الأمر: شجع طفلك على ممارسة مسار الموانع في مكان آمن وتسجيل زمنه (دليل المعلم ص 57-59).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع والأدوات المستخدمة كموانع.\n2. يؤدي حركات تخطي الموانع (الوثب فوق الحاجز، المروق أسفل الحبل، المشي على المقعد).\n3. يختار الحركة المناسبة لتخطي كل مانع.\n4. يؤدي مسار موانع متكاملًا بحركات متنوعة.\n5. يوظف الحركات والمهارات (جري، وثب، مروق، توازن) في منافسات الموانع.\n6. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- تمرينات الموانع\n- المانع\n- الوثب\n- المروق\n- المشي على المقعد\n- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم الأدوات ويسأل: كيف نتخطى الحاجز؟ وكيف نمر من تحت الحبل؟ ويعرض صور جمباز الموانع (ص 53-54).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري، وثب، مروق، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل مانع (ص 55-56): الوثب بالقدمين فوق الحاجز، المروق أسفل الحبل المثبت، المشي على المقعد السويدي، المروق داخل قطعة الصندوق المقسم، الوثب بالحبل 5 م، مع نقاط الأمان، ويقلد كل حركة بعد النموذج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ طريقتين لتخطي المانع نفسه (مثلًا الوثب فوق الصندوق أم المروق داخله) ويكتشف الأنسب والأسرع والأكثر أمانًا، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في مجموعات، تؤدي كل مجموعة مسار موانع قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الحركة الصحيحة، ويؤدي التلميذ المسار بالتتابع (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 2 و3 ص 57-58: مجموعات بقائد تؤدي المسار بالتتابع مرتين، ويلاحظ القائد الأداء الصحيح ويصححه، ويؤدي التلميذ المسار ويصحح زملاءه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. منافسة الموانع ص 59: تتابع بين المجموعات في المسار، وتحسب النقاط للأداء الصحيح والسرعة، ويتسابق التلميذ بأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: ما الحركة التي أخذت وقتًا أطول؟ ولماذا؟ ليستنتج التلاميذ أن التوازن على المقعد يحتاج إلى هدوء، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور بالثقة، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما المانع؟\nالإجابة: أداة أو جهاز نتخطاه بحركة مثل الوثب أو المروق.\nس2 (مستوى التطبيق): كيف نتخطى الحبل المثبت المنخفض؟\nالإجابة: بالمروق أسفله أو الوثب فوقه حسب ارتفاعه.\nس3 (مستوى الاستدلال): ما الحركة المناسبة للمقعد السويدي؟\nالإجابة: المشي عليه بتوازن.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (المروق أسفل الحبل، ثم المشي على المقعد السويدي بتوازن)، ثم يطلب منه اجتياز المانعين وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باجتياز مسار موانع متكامل (حاجز، وحبل، ومقعد سويدي) بحركات متنوعة، واقتراح طريقة جديدة آمنة لتخطي أحد الموانع.\n\nس4 (مستوى المعرفة): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: جري متعرج، وثب فوق الحاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة.\nس5 (مستوى التطبيق): ما الحركة التي نؤديها على المرتبة في نهاية المسار؟\nالإجابة: الدحرجة.\nس6 (مستوى الاستدلال): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (المروق أسفل الحبل، ثم المشي على المقعد السويدي بتوازن)، ثم يطلب منه اجتياز المانعين وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باجتياز مسار موانع متكامل (حاجز، وحبل، ومقعد سويدي) بحركات متنوعة، واقتراح طريقة جديدة آمنة لتخطي أحد الموانع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر ثلاث أدوات تستخدم موانع.\nالإجابة: الحاجز، الحبل، المقعد السويدي (أو الصندوق المقسم).\nس2 (مستوى التطبيق): أدِّ المروق داخل قطعة الصندوق المقسم.\nالإجابة: يؤديه دون لمس الأطراف.\nس3 (مستوى الاستدلال): لماذا اخترت الوثب فوق الحاجز لا المروق؟\nالإجابة: لأن الحاجز منخفض والوثب أسرع وأسهل.\n\nس4 (مستوى المعرفة): أدِّ مسار الموانع كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس5 (مستوى التطبيق): كيف شعرت عندما تخطيت الموانع كلها؟\nالإجابة: يعبر عن الثقة.\nس6 (مستوى الاستدلال): اقترح مانعًا جديدًا للمسار والحركة المناسبة له.\nالإجابة: مثل: أطواق على الأرض والحجل داخلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا (وسادة للوثب، كرسي للمروق تحته) ومارساه بأمان (دليل المعلم ص 55-56).\nإرشاد لولي الأمر: شجع طفلك على ممارسة مسار الموانع في مكان آمن وتسجيل زمنه (دليل المعلم ص 57-59).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=5"}}, {"title": "الاتزان", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 64-73", "n": 1, "periods": [{"focus": "الاتزان الثابت (الميزان الأمامي والارتكاز على قدم واحدة) + الاتزان الحركي (الوثب لأعلى والدوران والهبوط، الاتزان على المقعد السويدي)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الاتزان الثابت ومواقفه.\n2. يؤدي الميزان الأمامي والارتكاز على قدم واحدة مع الثبات.\n3. يحدد العوامل التي تساعد على الاتزان (الذراعان جانبًا، النظر لنقطة ثابتة).\n4. يميز بين الاتزان الثابت والاتزان الحركي.\n5. يؤدي الوثب لأعلى والدوران نصف دورة والهبوط بثبات من مستوى عالٍ.\n6. يوظف حركات الاتزان في المسابقات والألعاب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: قطع إسفنجية\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بالونات\n- صورة توضيحية\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع", "المفاهيم": "- الاتزان الثابت\n- مركز الثقل\n- الميزان الأمامي\n- قاعدة الارتكاز\n- الاتزان الحركي\n- الدوران\n- الهبوط\n- المقعد السويدي", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم على قدم واحدة ويسأل: لماذا لا أسقط؟ ثم يضم ذراعيه ويغمض عينيه ويسأل: لماذا اهتز جسمي؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ثم الوقوف على قدم واحدة بالتبادل، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج (ص 65-66): الوقوف على قدم واحدة والذراعان جانبًا، ثم الميزان الأمامي (الرجل الحرة ممدودة للخلف وميل الجذع للأمام ولمس القطعة الإسفنجية بالرأس) مع التفكير بصوت عالٍ عن النظر لنقطة ثابتة، ويقلد التلميذ ويثبت 5 ثوانٍ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ الثبات على قدم والذراعان جانبًا ثم مضمومتان، وبعينين مفتوحتين ثم مغمضتين، ويكتشف ما يساعد على الاتزان، ويجرب التلميذ ويستنتج العوامل (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 1 (الاتزان الثابت) ص 68: جري في المكان داخل الأطواق وعند النداء يثبت التلميذ في وضع الاتزان المطلوب، ومن يثبت أطول يفوز، ويلعب التلميذ ويثبت (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج (ص 67): الوقوف على المقعد، أرجحة الذراعين وثني الركبتين، الوثب لأعلى بالقدمين مع دوران ربع ثم نصف دورة والمحافظة على استقامة الجسم، والهبوط بالقدمين على المرتبة والثبات؛ ثم المشي على المقعد مع حمل بالون، ويقلد التلميذ بالتدرج (ربع ثم نصف دورة) (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 3 (محطات الاتزان) ص 70: محطة الدائرة (أوضاع اتزان ثابت)، محطة الصفين (الوقوف على قدم مع تمرير البالون)، محطة القطارين (المشي بين الأقماع المنخفضة والهبوط على المرتبة)، محطة الأدوات المتنوعة (الوقوف على قدم ولمس أدوات بارتفاعات مختلفة)، مع التبديل، ويؤدي التلميذ مهمة المحطة ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. أي مجموعة تمشي على المقعد وتهبط بثبات دون سقوط أكبر عدد من المرات، ويتسابق التلميذ (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الاتزان الثابت؟\nالإجابة: المحافظة على ثبات الجسم في وضع معين دون حركة.\nس2 (مستوى التطبيق): أين تكون الذراعان لمساعدتنا على الاتزان؟\nالإجابة: جانبًا.\nس3 (مستوى الاستدلال): لماذا نهتز عند إغماض العينين؟\nالإجابة: لأن النظر لنقطة ثابتة يساعد على الاتزان.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على قدم واحدة والذراعان جانبًا والنظر إلى نقطة ثابتة، مع الاستناد إلى الحائط أولًا ثم دونه، ثم يسأله: أين تكون الذراعان لتساعدانا على الاتزان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء الميزان الأمامي ثم المشي على خط بتوازن حاملين كيس حبوب على الرأس، والمقارنة بين الاتزان الثابت والاتزان الحركي.\n\nس4 (مستوى المعرفة): ما الفرق بين الاتزان الثابت والحركي؟\nالإجابة: الثابت دون حركة، والحركي أثناء أداء حركة كالمشي على المقعد أو الهبوط.\nس5 (مستوى التطبيق): كيف نهبط بثبات بعد الوثب والدوران؟\nالإجابة: بالقدمين معًا وثني الركبتين والذراعان جانبًا.\nس6 (مستوى الاستدلال): اذكر لعبة أو مسابقة فيها اتزان حركي.\nالإجابة: الجمباز أو المشي على العارضة.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على قدم واحدة والذراعان جانبًا والنظر إلى نقطة ثابتة، مع الاستناد إلى الحائط أولًا ثم دونه، ثم يسأله: أين تكون الذراعان لتساعدانا على الاتزان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء الميزان الأمامي ثم المشي على خط بتوازن حاملين كيس حبوب على الرأس، والمقارنة بين الاتزان الثابت والاتزان الحركي.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الميزان الأمامي 5 ثوانٍ.\nالإجابة: يؤديه والرجل الحرة ممدودة للخلف والذراعان جانبًا.\nس2 (مستوى التطبيق): اذكر عاملين يساعدان على الاتزان.\nالإجابة: فتح الذراعين جانبًا، والنظر لنقطة ثابتة.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز على نقطة واحدة ونقطتين؟\nالإجابة: الارتكاز على نقطتين (القدمين) أثبت وأسهل من نقطة واحدة.\n\nس4 (مستوى المعرفة): أدِّ الوثب من المقعد مع نصف دورة والهبوط بثبات.\nالإجابة: يؤديه ويثبت بعد الهبوط.\nس5 (مستوى التطبيق): اذكر محطتين من محطات الاتزان.\nالإجابة: محطة البالون ومحطة الأدوات المتنوعة.\nس6 (مستوى الاستدلال): لماذا يصعب الاتزان على المقعد مع حمل البالون؟\nالإجابة: لأن حمل الشيء يغير مركز ثقل الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الوقوف على قدم واحدة 10 ثوانٍ لكل قدم (دليل المعلم ص 65-68).\nإرشاد لولي الأمر: تدرب مع طفلك على المشي على خط مرسوم مع حمل كتاب على الرأس (دليل المعلم ص 67-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الاتزان الثابت ومواقفه.\n2. يؤدي الميزان الأمامي والارتكاز على قدم واحدة مع الثبات.\n3. يحدد العوامل التي تساعد على الاتزان (الذراعان جانبًا، النظر لنقطة ثابتة).\n4. يميز بين الاتزان الثابت والاتزان الحركي.\n5. يؤدي الوثب لأعلى والدوران نصف دورة والهبوط بثبات من مستوى عالٍ.\n6. يوظف حركات الاتزان في المسابقات والألعاب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: قطع إسفنجية\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بالونات\n- صورة توضيحية\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الاتزان الثابت\n- مركز الثقل\n- الميزان الأمامي\n- قاعدة الارتكاز\n- الاتزان الحركي\n- الدوران\n- الهبوط\n- المقعد السويدي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف المعلم على قدم واحدة ويسأل: لماذا لا أسقط؟ ثم يضم ذراعيه ويغمض عينيه ويسأل: لماذا اهتز جسمي؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري ثم الوقوف على قدم واحدة بالتبادل، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج (ص 65-66): الوقوف على قدم واحدة والذراعان جانبًا، ثم الميزان الأمامي (الرجل الحرة ممدودة للخلف وميل الجذع للأمام ولمس القطعة الإسفنجية بالرأس) مع التفكير بصوت عالٍ عن النظر لنقطة ثابتة، ويقلد التلميذ ويثبت 5 ثوانٍ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ الثبات على قدم والذراعان جانبًا ثم مضمومتان، وبعينين مفتوحتين ثم مغمضتين، ويكتشف ما يساعد على الاتزان، ويجرب التلميذ ويستنتج العوامل (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 1 (الاتزان الثابت) ص 68: جري في المكان داخل الأطواق وعند النداء يثبت التلميذ في وضع الاتزان المطلوب، ومن يثبت أطول يفوز، ويلعب التلميذ ويثبت (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج (ص 67): الوقوف على المقعد، أرجحة الذراعين وثني الركبتين، الوثب لأعلى بالقدمين مع دوران ربع ثم نصف دورة والمحافظة على استقامة الجسم، والهبوط بالقدمين على المرتبة والثبات؛ ثم المشي على المقعد مع حمل بالون، ويقلد التلميذ بالتدرج (ربع ثم نصف دورة) (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 3 (محطات الاتزان) ص 70: محطة الدائرة (أوضاع اتزان ثابت)، محطة الصفين (الوقوف على قدم مع تمرير البالون)، محطة القطارين (المشي بين الأقماع المنخفضة والهبوط على المرتبة)، محطة الأدوات المتنوعة (الوقوف على قدم ولمس أدوات بارتفاعات مختلفة)، مع التبديل، ويؤدي التلميذ مهمة المحطة ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. أي مجموعة تمشي على المقعد وتهبط بثبات دون سقوط أكبر عدد من المرات، ويتسابق التلميذ (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الاتزان الثابت؟\nالإجابة: المحافظة على ثبات الجسم في وضع معين دون حركة.\nس2 (مستوى التطبيق): أين تكون الذراعان لمساعدتنا على الاتزان؟\nالإجابة: جانبًا.\nس3 (مستوى الاستدلال): لماذا نهتز عند إغماض العينين؟\nالإجابة: لأن النظر لنقطة ثابتة يساعد على الاتزان.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على قدم واحدة والذراعان جانبًا والنظر إلى نقطة ثابتة، مع الاستناد إلى الحائط أولًا ثم دونه، ثم يسأله: أين تكون الذراعان لتساعدانا على الاتزان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء الميزان الأمامي ثم المشي على خط بتوازن حاملين كيس حبوب على الرأس، والمقارنة بين الاتزان الثابت والاتزان الحركي.\n\nس4 (مستوى المعرفة): ما الفرق بين الاتزان الثابت والحركي؟\nالإجابة: الثابت دون حركة، والحركي أثناء أداء حركة كالمشي على المقعد أو الهبوط.\nس5 (مستوى التطبيق): كيف نهبط بثبات بعد الوثب والدوران؟\nالإجابة: بالقدمين معًا وثني الركبتين والذراعان جانبًا.\nس6 (مستوى الاستدلال): اذكر لعبة أو مسابقة فيها اتزان حركي.\nالإجابة: الجمباز أو المشي على العارضة.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على قدم واحدة والذراعان جانبًا والنظر إلى نقطة ثابتة، مع الاستناد إلى الحائط أولًا ثم دونه، ثم يسأله: أين تكون الذراعان لتساعدانا على الاتزان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء الميزان الأمامي ثم المشي على خط بتوازن حاملين كيس حبوب على الرأس، والمقارنة بين الاتزان الثابت والاتزان الحركي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الميزان الأمامي 5 ثوانٍ.\nالإجابة: يؤديه والرجل الحرة ممدودة للخلف والذراعان جانبًا.\nس2 (مستوى التطبيق): اذكر عاملين يساعدان على الاتزان.\nالإجابة: فتح الذراعين جانبًا، والنظر لنقطة ثابتة.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز على نقطة واحدة ونقطتين؟\nالإجابة: الارتكاز على نقطتين (القدمين) أثبت وأسهل من نقطة واحدة.\n\nس4 (مستوى المعرفة): أدِّ الوثب من المقعد مع نصف دورة والهبوط بثبات.\nالإجابة: يؤديه ويثبت بعد الهبوط.\nس5 (مستوى التطبيق): اذكر محطتين من محطات الاتزان.\nالإجابة: محطة البالون ومحطة الأدوات المتنوعة.\nس6 (مستوى الاستدلال): لماذا يصعب الاتزان على المقعد مع حمل البالون؟\nالإجابة: لأن حمل الشيء يغير مركز ثقل الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الوقوف على قدم واحدة 10 ثوانٍ لكل قدم (دليل المعلم ص 65-68).\nإرشاد لولي الأمر: تدرب مع طفلك على المشي على خط مرسوم مع حمل كتاب على الرأس (دليل المعلم ص 67-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=6"}}, {"title": "البراعة الحركية", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 74-81", "n": 1, "periods": [{"focus": "حركات البراعة الحركية الفردية (دوران الطاحونة، الوثب بتلامس القدمين، المشي المعكوس) + البراعة مع الزميل (دوران عقارب الساعة) وألعاب البراعة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركات البراعة الحركية وأهميتها.\n2. يؤدي دوران الطاحونة والوثب بتلامس القدمين والمشي المعكوس.\n3. يحافظ على جمالية الأداء والاتزان أثناء الحركة.\n4. يؤدي حركات البراعة مع الزميل (دوران عقارب الساعة) بالتوافق.\n5. يشارك زملاءه أنشطة متنوعة للبراعة الحركية.\n6. يشعر بالثقة في النفس عند أدائه حركات البراعة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مربعات مرقمة\n- صورة توضيحية\n- أخرى: أكياس رمل\n- أخرى: أقماع", "المفاهيم": "- البراعة الحركية\n- دوران الطاحونة\n- الوثب بتلامس القدمين\n- المشي المعكوس\n- البراعة مع الزميل\n- دوران عقارب الساعة\n- التوافق\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب جمباز يؤدي حركة مميزة ويسأل: ما الذي يجعل الحركة جميلة؟ ويقدم مصطلح البراعة الحركية (ص 74-75).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 75-76): الوثب بتلامس القدمين (وقوف فتحًا، وثب عاليًا مع تلامس القدمين وتباعدهما، الهبوط فتحًا)، دوران الطاحونة على المرتبة، المشي المعكوس (للخلف) مع النظر عبر الكتف؛ مع نقاط الأمان، ويقلد كل حركة بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (حركات التقليد والبراعة الفردية) ص 77: قطارات على خط البداية، يؤدي التلميذ الوثب بتلامس القدمين داخل الأطواق ثم دوران الطاحونة على المرتبة ثم المشي المعكوس لخط النهاية، ويسجل القائد الأداء الجميل، ويؤدي التلميذ المسار ويسجل القائد (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الحكم الصغير): يؤدي تلميذ حركة براعة ويقيّمها زملاؤه بالتصفيق (1-3) حسب الجمال والثبات، ويؤدي التلميذ ويقيّم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم مع تلميذ النموذج (ص 76): تلميذان في وضع الانبطاح المائل متجاوران، استناد اليدين والأصابع مفرودة، تلاصق القدمين، التحرك باليدين في اتجاه عقارب الساعة مع ثبات القدمين كمحور، ثم تطبيق في أزواج، ويؤدي التلميذ مع زميله بالتوافق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 (البراعة مع الزميل) ص 78: ثنائيات تجري على محيط المستطيل وعند النداء تدخل كل ثنائية طوقًا وتؤدي حركة براعة مشتركة (دوران عقارب الساعة، وقوف على قدم متقابلين ومسك اليدين)، ويؤدي التلميذ مع زميله (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (المربعات المرقمة): الوثب بتلامس القدمين إلى المربع الذي يناديه المعلم ثم حركة براعة فيه، ويلعب التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتعبير عن الثقة، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما البراعة الحركية؟\nالإجابة: أداء الحركات بمهارة وجمال وثبات.\nس2 (مستوى التطبيق): كيف نؤدي الوثب بتلامس القدمين؟\nالإجابة: نثب عاليًا من الوقوف فتحًا ونلامس القدمين في الهواء ثم نهبط فتحًا.\nس3 (مستوى الاستدلال): ماذا نفعل بالرأس في المشي المعكوس؟\nالإجابة: ننظر عبر الكتف لنرى الطريق.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الوثب بتلامس القدمين بالتدرج: الوثب فتحًا وضمًا على الأرض أولًا ثم التلامس في الهواء، ثم يطلب منه أداءها مرة واحدة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: دوران الطاحونة ثم الوثب بتلامس القدمين ثم المشي المعكوس، مع زميل بتوافق ومحافظة على جمال الأداء.\n\nس4 (مستوى المعرفة): في دوران عقارب الساعة، ما الذي يثبت وما الذي يتحرك؟\nالإجابة: تثبت القدمان كمحور وتتحرك اليدان.\nس5 (مستوى التطبيق): ما الوضع الذي نبدأ منه الحركة؟\nالإجابة: الانبطاح المائل.\nس6 (مستوى الاستدلال): لماذا نحتاج إلى التوافق مع الزميل؟\nالإجابة: حتى نتحرك بالسرعة نفسها ولا نسقط.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الوثب بتلامس القدمين بالتدرج: الوثب فتحًا وضمًا على الأرض أولًا ثم التلامس في الهواء، ثم يطلب منه أداءها مرة واحدة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: دوران الطاحونة ثم الوثب بتلامس القدمين ثم المشي المعكوس، مع زميل بتوافق ومحافظة على جمال الأداء.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ دوران الطاحونة على المرتبة.\nالإجابة: يؤديه بثبات.\nس2 (مستوى التطبيق): ما الذي يجعل الحركة أكثر جمالًا؟\nالإجابة: استقامة الجذع والرجلين والنظر للأمام والهبوط الهادئ.\nس3 (مستوى الاستدلال): اذكر ثلاث حركات براعة تعلمتها اليوم.\nالإجابة: الوثب بتلامس القدمين، دوران الطاحونة، المشي المعكوس.\n\nس4 (مستوى المعرفة): أدِّ مع زميلك دوران عقارب الساعة نصف دورة.\nالإجابة: يؤديانه بتوافق.\nس5 (مستوى التطبيق): اذكر حركة براعة مشتركة أديتها في الطوق.\nالإجابة: مثل: الوقوف على قدم متقابلين مع مسك اليدين.\nس6 (مستوى الاستدلال): كيف شعرت عند أداء الحركات أمام زملائك؟\nالإجابة: يعبر عن ا
