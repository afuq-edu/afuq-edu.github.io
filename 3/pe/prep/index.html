لم الذاتي\n- المعلم: يحدد كل تلميذ المهارة التي يحتاج إلى تدريب أكثر عليها ويخبر المعلم.\n- الطالب: يحدد ويعبر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا نبدأ الحصة بالإعداد البدني؟\nالإجابة: لتسخين العضلات والمفاصل ومنع الإصابة.\nس2 (المستوى المتوقع): اذكر تمرينًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (المستوى المتقدم): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\n\nالحصة 2:\nس1 (مستوى الدعم): بأي جزء من اليد ننطط الكرة؟\nالإجابة: بالأصابع.\nس2 (المستوى المتوقع): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة، وثبة، خطوة.\nس3 (المستوى المتقدم): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالساعدين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ تمرينًا للرجلين بالعد الرباعي.\nالإجابة: تبادل رفع الركبتين بالعد.\nس2 (المستوى المتوقع): اذكر قاعدتين من قواعد الأمن والسلامة.\nالإجابة: الاستجابة للصافرة، وعدم الدفع.\nس3 (المستوى المتقدم): كيف تنظم مجموعتك عرض التمرينات؟\nالإجابة: يعد القائد ويؤدي الجميع معًا بتوافق.\n\nالحصة 2:\nس1 (مستوى الدعم): حاور بالكرة حول قمعين.\nالإجابة: يحاور بتنطيط منخفض.\nس2 (المستوى المتوقع): اذكر محطتين من المراجعة.\nالإجابة: التنطيط المتعرج وضرب البالون.\nس3 (المستوى المتقدم): ما المهارة التي ستتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على التدرب 10 دقائق يوميًا على المهارة التي اختارها."}}, {"title": "الأوضاع المشتقة في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 30-41", "n": 2, "periods": [{"focus": "الأوضاع المشتقة من الجلوس", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الجلوس (جلوس طويل، جلوس فتحًا، جلوس تربيع، جلوس القرفصاء).\n2. يؤدي أوضاعًا مشتقة من الجلوس بدقة وتمرينًا بسيطًا من كل من الجلوس الطويل بالعد.\nالإجابة: يؤديه بالعد والركبتان مستقيمتان.\nس3 (المستوى المتقدم): ابتكر وضعًا مشتقًا من الجلوس وسمِّه.\nالإجابة: مثل: جلوس طويل. الذراعان جانبًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الجلوس في دليل المعلم ص 31-33 ومارسا تمرينًا من كل وضع."}}, {"focus": "الأوضاع المشتقة من الرقود", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الرقود (رقود فتحًا، رقود على البطن، رقود الذراعان عاليًا).\n2. يؤدي تمرينات من الأوضاع المشتقة من الرقود بالعد.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: كرات\n- أخرى: بطاقات مصورة\n- أخرى: أعلام ملونة", "المفاهيم": "- الرقود\n- الوضع المشتق\n- القوام السليم\n- عضلات البطن والظهر", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم أوضاع الجلوس بالنداء، ثم يرقد ويرفع ذراعيه عاليًا ويسأل: من أي وضع اشتققت هذا الوضع؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج ص 34-36: (رقود فتحًا)، (رقود. الذراعان عاليًا)، (رقود على البطن)، (رقود. ثني الركبتين)، مع تمرين من كل وضع (رفع الرجلين بالتبادل، رفع الجذع من الرقود على البطن) بالعد.\n- الطالب: يقلد ويؤدي التمرين بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الأوضاع المشتقة من الرقود والجلوس بأربع مجموعات: محطة رقود فتحًا (رفع الرجلين)، محطة رقود على البطن (رفع الذراعين والرجلين)، محطة جلوس طويل (مد الذراعين للقدمين)، محطة جلوس تربيع (لف الجذع)، مع التبديل.\n- الطالب: يؤدي تمرين المحطة ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 ص 40: يرفع المعلم علمًا ملونًا يرمز لوضع أساسي، ويؤدي التلاميذ وضعًا مشتقًا منه من اختيارهم الرجلين)، محطة جلوس طويل (مد الذراعين للقدمين)، محطة جلوس تربيع (لف الجذع)، مع التبديل.\n- الطالب: يؤدي تمرين المحطة ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 ص 40: يرفع المعلم علمًا ملونًا يرمز لوضع أساسي، ويؤدي التلاميذ وضعًا مشتقًا منه من اختيارهم.\n- الطالب: يستجيب بوضع مشتق صحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة من الرقود والتنفس.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الوضع الأساسي لوضع (جلوس طويل فتحًا)؟\nالإجابة: الجلوس.\nس2 (المستوى المتوقع): أدِّ وضع (جلوس القرفصاء).\nالإجابة: يجلس على المشطين والركبتان منثنيتان بالكامل.\nس3 (المستوى المتقدم): كيف يكون الظهر في الجلوس الطويل؟\nالإجابة: مستقيمًا.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر وضعين مشتقين من الرقود.\nالإجابة: رقود فتحًا، رقود على البطن.\nس2 (المستوى المتوقع): ما التمرين الذي أديناه من الرقود على البطن؟\nالإجابة: رفع الذراعين والرجلين (أو الجذع).\nس3 (المستوى المتقدم): أي العضلات تعمل في رفع الرجلين من الرقود؟\nالإجابة: عضلات البطن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاثة أوضاع مشتقة من الجلوس.\nالإجابة: جلوس طويل، جلوس فتحًا، جلوس تربيع.\nس2 (المستوى المتوقع): أدِّ تمرين ثني الجذع أمامًا من الجلوس الطويل بالعد.\nالإجابة: يؤديه بالعد والركبتان مستقيمتان.\nس3 (المستوى المتقدم): ابتكر وضعًا مشتقًا من الجلوس وسمِّه.\nالإجابة: مثل: جلوس طويل. الذراعان جانبًا.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ وضع (رقود. ثني الركبتين) ثم تمرين رفع الجذع مرتين.\nالإجابة: يؤديه بطريقة صحيحة.\nس2 (المستوى المتوقع): أرفع علمًا يرمز للرقود، أدِّ وضعًا مشتقًا منه.\nالإجابة: يؤدي وضعًا مشتقًا من الرقود.\nس3 (المستوى المتقدم): كيف تساعد تمرينات الرقود على القوام السليم؟\nالإجابة: تقوي عضلات البطن والظهر التي تحمل الجذع معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الجلوس في دليل المعلم ص 31-33 ومارسا تمرينًا من كل وضع.\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا من الرقود (رفع الرجلين بالتبادل) 10 مرات يوميًا (دليل المعلم ص 34-40)."}}, {"title": "التمرينات بالأدوات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث – الرابع", "date": "20-24/9/2026 إلى 27/9-1/10/2026", "pages": "دليل المعلم ص 42-52", "n": 4, "periods": [{"focus": "التمرينات الفردية بالكرات الطبية للذراعين", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات بالأدوات (الكرات الطبية) وأهميتها.\n2. يؤدي تمرينات فردية بالكرة الطبية للذراعين بالعد.\n3. يميز بين التمرين الحر والتمرين بالأدوات.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- التمرين بالأدوات\n- الكرة الطبية\n- التمرينات الفردية بالأدوات\n- الذراعان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم كرة طبية وكرة عادية ويسأل: ما الفرق بينهما؟ ولماذا نستخدم الكرة الثقيلة في التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، تحريك الذراعين والكتفين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج ص 43-44: (وقوف. الكرة أمامًا) رفع الكرة عاليًا وخفضها، (وقوف فتحًا. الكرة عاليًا) ثني الجذع جانبًا، (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا، بالعد مع التفكير بصوت عالٍ عن مسك الكرة بأمان.\n- الطالب: يقلد بالعد ويمسك الكرة بأمان.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ التمرين نفسه بكرة عادية ثم بالكرة الطبية ويكتشف الفرق في جهد الذراعين، ويستنتج فائدة الأدوات في زيادة قوة العضلات.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الكرة الثقيلة): في دائرة، تمرير الكرة الطبية من فوق الرأس من تلميذ لآخر بالعد، والمجموعة الأسرع دون سقوط تفوز.\n- الطالب: يلعب ويمرر بأمان.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الذراعين والكتفين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الكرة الطبية؟\nالإجابة: كرة ثقيلة نستخدمها أداة في التمرينات.\nس2 (المستوى المتوقع): أدِّ تمرين رفع الكرة عاليًا بالعد.\nالإجابة: يرفع الكرة ويخفضها بالعد.\nس3 (المستوى المتقدم): لماذا تزيد الكرة الطبية من قوة الذراعين؟\nالإجابة: لأن حملها يحتاج إلى جهد أكبر من العضلات.", "التقويم الختامي": "س1 (مستوى الدعم): ما الفرق بين التمرين الحر والتمرين بالأدوات؟\nالإجابة: الحر بلا أدوات، وبالأدوات نستخدم كرة أو حبلًا أو عصا.\nس2 (المستوى المتوقع): اذكر تمرينًا بالكرة الطبية للذراعين.\nالإجابة: مد الذراعين عاليًا بالكرة من خلف الرأس.\nس3 (المستوى المتقدم): كيف نمسك الكرة الطبية بأمان؟\nالإجابة: باليدين معًا وبإحكام وعدم رميها على الزملاء.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل في المنزل لتمرينين للذراعين (دليل المعلم ص 43-44)."}}, {"focus": "التمرينات الفردية بالكرات الطبية للجذع والرجلين", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تمرينات فردية بالكرة الطبية للجذع والرجلين.\n2. يميز أنواع التمرينات بالكرة الطبية حسب الجزء العامل.\n3. يقدر أهمية التمرينات بالأدوات في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة", "المفاهيم": "- الكرة الطبية\n- الجذع\n- الرجلان\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الذراعين بالكرة، ثم يسأل: هل نستطيع تمرين الرجلين بالكرة الطبية؟ وكيف؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم بالكرة الطبية الخفيفة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج ص 45-46: (جلوس طويل. الكرة أمامًا) لف الجذع بالكرة، (رقود. الكرة بين القدمين) رفع الرجلين، (وقوف. الكرة بين القدمين) الوثب مع الكرة، (جلوس القرفصاء. الكرة أمامًا) الوقوف مع رفع الكرة، بالعد.\n- الطالب: يقلد بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات بأربع مجموعات: محطة الجذع (لف الجذع بالكرة)، محطة الرجلين (رفع الرجلين بالكرة)، محطة الوثب بالكرة بين القدمين، محطة الذراعين (مراجعة)، مع تبديل وتسجيل القائد.\n- الطالب: يؤدي تمرين المحطة ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أين الجزء؟): يرفع المعلم بطاقة تمرين بالكرة ويؤديه التلاميذ ويذكرون الجزء العامل.\n- الطالب: يستجيب ويذكر الجزء.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر تمرينًا بالكرة الطبية للجذع.\nالإجابة: لف الجذع بالكرة من الجلوس الطويل.\nس2 (المستوى المتوقع): أين نضع الكرة في تمرين رفع الرجلين؟\nالإجابة: بين القدمين.\nس3 (المستوى المتقدم): ما الجزء العامل في الوثب بالكرة بين القدمين؟\nالإجابة: الرجلان.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تمرين رفع الرجلين بالكرة بين القدمين 5 مرات.\nالإجابة: يؤديه من الرقود.\nس2 (المستوى المتوقع): صنّف هذا التمرين: (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا.\nالإجابة: تمرين للذراعين.\nس3 (المستوى المتقدم): لماذا تحافظ التمرينات بالأدوات على لياقتنا؟\nالإجابة: لأنها تقوي العضلات بجهد أكبر وتنوع التدريب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع وآخر للرجلين بكرة خفيفة (دليل المعلم ص 45-46)."}}, {"focus": "التمرينات الزوجية بالكرات الطبية", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الزوجية بالكرات الطبية.\n2. يؤدي تمرينات زوجية بالكرة الطبية بالتوافق مع الزميل.\n3. يشارك زميله الأداء بأمان وتعاون.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التمرينات الزوجية بالأدوات\n- التوافق\n- الزميل\n- الدفع بالقدم", "التهيئة / التمهيد / التعلم القبلي": "يؤدي المعلم مع تلميذ تمرين (وقوف مواجه. الكرة أمام القدمين) تبادل دفع الكرة بالقدم ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم في أزواج.\n- الطالب: يقلد مع زميله.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ نماذج ص 47-48: (وقوف مواجه. مسك الكرة باليدين) تبادل دفع الكرة بالقدمين، (جلوس القرفصاء مواجه. الكرة بين القدمين) تبادل دفع الكرة، (جلوس طويل مواجه) تمرير الكرة من فوق الرأس، (وقوف ظهرًا لظهر) تمرير الكرة بلف الجذع، مع العد المشترك.\n- الطالب: يؤدي مع زميله بالتوافق.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج بأدوار (قائد يعد، وزميل يبدأ) تؤدي كل ثنائية البطاقات الأربع ثم تبتكر تمرينًا زوجيًا جديدًا بالكرة.\n- الطالب: يتعاون ويبتكر.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المرآة بالكرة): يؤدي أحد الزوجين تمرينًا بالكرة ويقلده الآخر.\n- الطالب: يلعب بدقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة زوجية.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر تمرينًا زوجيًا بالكرة الطبية.\nالإجابة: تبادل دفع الكرة بالقدم من الوقوف مواجهًا للزميل.\nس2 (المستوى المتوقع): ماذا نراعي في التمرين الزوجي بالكرة؟\nالإجابة: العد معًا والدفع بلطف والمسك الجيد.\nس3 (المستوى المتقدم): كيف نمرر الكرة ظهرًا لظهر؟\nالإجابة: بلف الجذع للجانب.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مع زميلك تمرير الكرة من فوق الرأس 5 مرات.\nالإجابة: يؤديانه من الجلوس الطويل المواجه.\nس2 (المستوى المتوقع): ما التمرين الزوجي الذي ابتكرتماه؟\nالإجابة: يذكر التمرين.\nس3 (المستوى المتقدم): ماذا يحدث لو دفع زميلك الكرة بقوة كبيرة؟\nالإجابة: قد تؤذي الزميل، فندفعها بلطف وتوافق.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بتمرير كرة من فوق الرأس من الجلوس (دليل المعلم ص 47-48)."}}, {"focus": "محطات وألعاب التمرينات بالكرات الطبية", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي التمرينات الفردية والزوجية بالكرات الطبية في محطات.\n2. يوظف الكرة الطبية في ألعاب ومنافسات بأمان.\n3. يميز نوع التمرين (فردي، زوجي) والجزء العامل من الصورة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: بطاقات مصورة", "المفاهيم": "- الكرة الطبية\n- المحطات\n- الرمي\n- الجري بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم أنواع التمرينات بالكرة بالبطاقات ويسأل: ما نوع التمرين؟ وما الجزء العامل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 49-50: أربع محطات: رمي الكرة عاليًا والتقاطها، الجري بالكرة بين الأقماع، تمرينات زوجية بالكرة، تمرينات فردية للجذع، بأربع مجموعات بقائد والتبديل.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب) ص 51: مسابقة تتابع بتمرير الكرة الطبية بين الرجلين ثم من فوق الرأس في القطار، والمجموعة الأسرع دون سقوط تفوز.\n- الطالب: يتسابق ويمرر بأمان.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سقطت الكرة في بعض القطارات؟ ليستنتج التلاميذ أهمية المسك الجيد والتوافق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): في أي محطة جرينا بالكرة؟\nالإجابة: محطة الجري بين الأقماع.\nس2 (المستوى المتوقع): كيف مررنا الكرة في التتابع؟\nالإجابة: بين الرجلين ثم من فوق الرأس.\nس3 (المستوى المتقدم): لماذا نمسك الكرة الطبية بإحكام؟\nالإجابة: حتى لا تسقط على القدمين أو الزملاء.", "التقويم الختامي": "س1 (مستوى الدعم): أرفع صورة تمرين بالكرة، ما نوعه وما الجزء العامل؟\nالإجابة: يذكر فردي/زوجي والجزء.\nس2 (المستوى المتوقع): أدِّ مع مجموعتك تمرير الكرة من فوق الرأس في القطار.\nالإجابة: يمرر بتوافق.\nس3 (المستوى المتقدم): ما أهم قاعدة سلامة مع الكرة الطبية؟\nالإجابة: عدم رميها على الزملاء والمسك بإحكام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك تمرير كرة ثقيلة قليلًا في قطار الأسرة من فوق الرأس وبين الرجلين (دليل المعلم ص 49-51)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات بالأدوات (الكرات الطبية) وأهميتها.\n2. يؤدي تمرينات فردية بالكرة الطبية للذراعين بالعد.\n3. يميز بين التمرين الحر والتمرين بالأدوات.\n\nالحصة 2:\n1. يؤدي تمرينات فردية بالكرة الطبية للجذع والرجلين.\n2. يميز أنواع التمرينات بالكرة الطبية حسب الجزء العامل.\n3. يقدر أهمية التمرينات بالأدوات في المحافظة على اللياقة البدنية.\n\nالحصة 3:\n1. يتعرف التمرينات الزوجية بالكرات الطبية.\n2. يؤدي تمرينات زوجية بالكرة الطبية بالتوافق مع الزميل.\n3. يشارك زميله الأداء بأمان وتعاون.\n\nالحصة 4:\n1. يؤدي التمرينات الفردية والزوجية بالكرات الطبية في محطات.\n2. يوظف الكرة الطبية في ألعاب ومنافسات بأمان.\n3. يميز نوع التمرين (فردي، زوجي) والجزء العامل من الصورة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة\n\nالحصة 3:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: بطاقات مصورة", "المفاهيم": "الحصة 1:\n- التمرين بالأدوات\n- الكرة الطبية\n- التمرينات الفردية بالأدوات\n- الذراعان\n\nالحصة 2:\n- الكرة الطبية\n- الجذع\n- الرجلان\n- اللياقة البدنية\n\nالحصة 3:\n- التمرينات الزوجية بالأدوات\n- التوافق\n- الزميل\n- الدفع بالقدم\n\nالحصة 4:\n- الكرة الطبية\n- المحطات\n- الرمي\n- الجري بالكرة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم كرة طبية وكرة عادية ويسأل: ما الفرق بينهما؟ ولماذا نستخدم الكرة الثقيلة في التمرين؟\n\nالحصة 2:\nيراجع المعلم تمرينات الذراعين بالكرة، ثم يسأل: هل نستطيع تمرين الرجلين بالكرة الطبية؟ وكيف؟\n\nالحصة 3:\nيؤدي المعلم مع تلميذ تمرين (وقوف مواجه. الكرة أمام القدمين) تبادل دفع الكرة بالقدم ويسأل: ما الجديد في هذا التمرين؟\n\nالحصة 4:\nيراجع المعلم أنواع التمرينات بالكرة بالبطاقات ويسأل: ما نوع التمرين؟ وما الجزء العامل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، تحريك الذراعين والكتفين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج ص 43-44: (وقوف. الكرة أمامًا) رفع الكرة عاليًا وخفضها، (وقوف فتحًا. الكرة عاليًا) ثني الجذع جانبًا، (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا، بالعد مع التفكير بصوت عالٍ عن مسك الكرة بأمان.\n- الطالب: يقلد بالعد ويمسك الكرة بأمان.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ التمرين نفسه بكرة عادية ثم بالكرة الطبية ويكتشف الفرق في جهد الذراعين، ويستنتج فائدة الأدوات في زيادة قوة العضلات.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الكرة الثقيلة): في دائرة، تمرير الكرة الطبية من فوق الرأس من تلميذ لآخر بالعد، والمجموعة الأسرع دون سقوط تفوز.\n- الطالب: يلعب ويمرر بأمان.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الذراعين والكتفين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم بالكرة الطبية الخفيفة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج ص 45-46: (جلوس طويل. الكرة أمامًا) لف الجذع بالكرة، (رقود. الكرة بين القدمين) رفع الرجلين، (وقوف. الكرة بين القدمين) الوثب مع الكرة، (جلوس القرفصاء. الكرة أمامًا) الوقوف مع رفع الكرة، بالعد.\n- الطالب: يقلد بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات بأربع مجموعات: محطة الجذع (لف الجذع بالكرة)، محطة الرجلين (رفع الرجلين بالكرة)، محطة الوثب بالكرة بين القدمين، محطة الذراعين (مراجعة)، مع تبديل وتسجيل القائد.\n- الطالب: يؤدي تمرين المحطة ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أين الجزء؟): يرفع المعلم بطاقة تمرين بالكرة ويؤديه التلاميذ ويذكرون الجزء العامل.\n- الطالب: يستجيب ويذكر الجزء.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم في أزواج.\n- الطالب: يقلد مع زميله.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ نماذج ص 47-48: (وقوف مواجه. مسك الكرة باليدين) تبادل دفع الكرة بالقدمين، (جلوس القرفصاء مواجه. الكرة بين القدمين) تبادل دفع الكرة، (جلوس طويل مواجه) تمرير الكرة من فوق الرأس، (وقوف ظهرًا لظهر) تمرير الكرة بلف الجذع، مع العد المشترك.\n- الطالب: يؤدي مع زميله بالتوافق.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج بأدوار (قائد يعد، وزميل يبدأ) تؤدي كل ثنائية البطاقات الأربع ثم تبتكر تمرينًا زوجيًا جديدًا بالكرة.\n- الطالب: يتعاون ويبتكر.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المرآة بالكرة): يؤدي أحد الزوجين تمرينًا بالكرة ويقلده الآخر.\n- الطالب: يلعب بدقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة زوجية.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 49-50: أربع محطات: رمي الكرة عاليًا والتقاطها، الجري بالكرة بين الأقماع، تمرينات زوجية بالكرة، تمرينات فردية للجذع، بأربع مجموعات بقائد والتبديل.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب) ص 51: مسابقة تتابع بتمرير الكرة الطبية بين الرجلين ثم من فوق الرأس في القطار، والمجموعة الأسرع دون سقوط تفوز.\n- الطالب: يتسابق ويمرر بأمان.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سقطت الكرة في بعض القطارات؟ ليستنتج التلاميذ أهمية المسك الجيد والتوافق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الكرة الطبية؟\nالإجابة: كرة ثقيلة نستخدمها أداة في التمرينات.\nس2 (المستوى المتوقع): أدِّ تمرين رفع الكرة عاليًا بالعد.\nالإجابة: يرفع الكرة ويخفضها بالعد.\nس3 (المستوى المتقدم): لماذا تزيد الكرة الطبية من قوة الذراعين؟\nالإجابة: لأن حملها يحتاج إلى جهد أكبر من العضلات.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر تمرينًا بالكرة الطبية للجذع.\nالإجابة: لف الجذع بالكرة من الجلوس الطويل.\nس2 (المستوى المتوقع): أين نضع الكرة في تمرين رفع الرجلين؟\nالإجابة: بين القدمين.\nس3 (المستوى المتقدم): ما الجزء العامل في الوثب بالكرة بين القدمين؟\nالإجابة: الرجلان.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر تمرينًا زوجيًا بالكرة الطبية.\nالإجابة: تبادل دفع الكرة بالقدم من الوقوف مواجهًا للزميل.\nس2 (المستوى المتوقع): ماذا نراعي في التمرين الزوجي بالكرة؟\nالإجابة: العد معًا والدفع بلطف والمسك الجيد.\nس3 (المستوى المتقدم): كيف نمرر الكرة ظهرًا لظهر؟\nالإجابة: بلف الجذع للجانب.\n\nالحصة 4:\nس1 (مستوى الدعم): في أي محطة جرينا بالكرة؟\nالإجابة: محطة الجري بين الأقماع.\nس2 (المستوى المتوقع): كيف مررنا الكرة في التتابع؟\nالإجابة: بين الرجلين ثم من فوق الرأس.\nس3 (المستوى المتقدم): لماذا نمسك الكرة الطبية بإحكام؟\nالإجابة: حتى لا تسقط على القدمين أو الزملاء.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ما الفرق بين التمرين الحر والتمرين بالأدوات؟\nالإجابة: الحر بلا أدوات، وبالأدوات نستخدم كرة أو حبلًا أو عصا.\nس2 (المستوى المتوقع): اذكر تمرينًا بالكرة الطبية للذراعين.\nالإجابة: مد الذراعين عاليًا بالكرة من خلف الرأس.\nس3 (المستوى المتقدم): كيف نمسك الكرة الطبية بأمان؟\nالإجابة: باليدين معًا وبإحكام وعدم رميها على الزملاء.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ تمرين رفع الرجلين بالكرة بين القدمين 5 مرات.\nالإجابة: يؤديه من الرقود.\nس2 (المستوى المتوقع): صنّف هذا التمرين: (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا.\nالإجابة: تمرين للذراعين.\nس3 (المستوى المتقدم): لماذا تحافظ التمرينات بالأدوات على لياقتنا؟\nالإجابة: لأنها تقوي العضلات بجهد أكبر وتنوع التدريب.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ مع زميلك تمرير الكرة من فوق الرأس 5 مرات.\nالإجابة: يؤديانه من الجلوس الطويل المواجه.\nس2 (المستوى المتوقع): ما التمرين الزوجي الذي ابتكرتماه؟\nالإجابة: يذكر التمرين.\nس3 (المستوى المتقدم): ماذا يحدث لو دفع زميلك الكرة بقوة كبيرة؟\nالإجابة: قد تؤذي الزميل، فندفعها بلطف وتوافق.\n\nالحصة 4:\nس1 (مستوى الدعم): أرفع صورة تمرين بالكرة، ما نوعه وما الجزء العامل؟\nالإجابة: يذكر فردي/زوجي والجزء.\nس2 (المستوى المتوقع): أدِّ مع مجموعتك تمرير الكرة من فوق الرأس في القطار.\nالإجابة: يمرر بتوافق.\nس3 (المستوى المتقدم): ما أهم قاعدة سلامة مع الكرة الطبية؟\nالإجابة: عدم رميها على الزملاء والمسك بإحكام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل في المنزل لتمرينين للذراعين (دليل المعلم ص 43-44).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع وآخر للرجلين بكرة خفيفة (دليل المعلم ص 45-46).\n\nالحصة 3:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بتمرير كرة من فوق الرأس من الجلوس (دليل المعلم ص 47-48).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طفلك تمرير كرة ثقيلة قليلًا في قطار الأسرة من فوق الرأس وبين الرجلين (دليل المعلم ص 49-51)."}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 18-23", "n": 2, "periods": [{"focus": "الممارسات الصحية: الإحماء والتهدئة ووقاية العضلات والمفاصل", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده.\n2. يميز تمرينات الإحماء من تمرينات التهدئة ويعلل.\n3. يقود إحماءً بسيطًا لزملائه.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: مراتب", "المفاهيم": "- الإحماء\n- التهدئة\n- الإصابة\n- المفاصل", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يحدث لو جرينا بسرعة قصوى من أول ثانية؟ ويعرض صورة لاعب يحمي عضلاته بالإحماء.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج إحماء متدرج (مشي، جري خفيف، تحريك المفاصل من الرقبة إلى الكاحلين، إطالة خفيفة) مع التفكير بصوت عالٍ.\n- الطالب: يقلد ويكرر السبب.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن التلاميذ النبض والدفء قبل الإحماء وبعده ويستنتجون دوره في الوقاية من الإصابة (برنامج صحتي ص 23).\n- الطالب: يلاحظ ويستنتج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بأربع حركات ثم يتبادلون.\n- الطالب: يقود ويؤدي.\n\nالنشاط 4 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تصنف كل مجموعة بطاقات التمرينات إلى إحماء وتهدئة وتعلل.\n- الطالب: يصنف ويعلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التهدئة ونصيحة اليوم.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): لماذا يحمي الإحماء العضلات؟\nالإجابة: لأنه يرفع حرارتها ويجعلها مرنة فلا تصاب.\nس2 (المستوى المتوقع): بماذا نبدأ الإحماء؟\nالإجابة: بالمشي والجري الخفيف.\nس3 (المستوى المتقدم): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء في البداية لتسخين الجسم، والتهدئة في النهاية لإراحته.", "التقويم الختامي": "س1 (مستوى الدعم): قُد إحماءً لزملائك بأربع حركات.\nالإجابة: يؤديه متدرجًا.\nس2 (المستوى المتوقع): صنّف: الإطالة البطيئة والتنفس العميق.\nالإجابة: تهدئة.\nس3 (المستوى المتقدم): زميلك يريد الجري بأقصى سرعة فورًا، بماذا تنصحه؟\nالإجابة: أن يحمي عضلاته بالإحماء أولًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب والتهدئة بعده (برنامج صحتي، دليل المعلم ص 23)."}}, {"focus": "المهرجان الرياضي التعليمي للتمرينات (الأوضاع المشتقة، التمرينات بالأدوات)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الأوضاع المشتقة والتمرينات بالكرات الطبية ضمن أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء محافظات مع قائد ويعرض الأقسام (ص 18-20، 59).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بنموذج المعلم.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم الأوضاع المشتقة من الجلوس والرقود (أداء الوضع من البطاقة وتمرين منه)، قسم التمرينات الفردية بالكرات الطبية، قسم التمرينات الزوجية بالكرات، قسم جمباز الموانع المبسط (وثب فوق الحبال ومروق أسفل الحاجز)، مع تسجيل النقاط.\n- الطالب: يؤدي مهام الأقسام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع تمرير الكرة الطبية.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى الدعم): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الزوجية بالكرات.\nس2 (المستوى المتوقع): اذكر وضعًا مشتقًا أديته في قسم الأوضاع.\nالإجابة: مثل: جلوس طويل فتحًا.\nس3 (المستوى المتقدم): لماذا نسجل نقاط النظام والتعاون؟\nالإجابة: لأنهما من أهداف المهرجان.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر أقسام المهرجان الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الفردية بالكرات، التمرينات الزوجية، جمباز الموانع.\nس2 (المستوى المتوقع): ما دورك في مجموعتك؟\nالإجابة: يذكر دوره.\nس3 (المستوى المتقدم): كيف تعبر عن روحك الرياضية عند الخسارة؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين بالكرة يوميًا (دليل المعلم ص 42-52)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده.\n2. يميز تمرينات الإحماء من تمرينات التهدئة ويعلل.\n3. يقود إحماءً بسيطًا لزملائه.\n\nالحصة 2:\n1. يؤدي الأوضاع المشتقة والتمرينات بالكرات الطبية ضمن أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الإحماء\n- التهدئة\n- الإصابة\n- المفاصل\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا يحدث لو جرينا بسرعة قصوى من أول ثانية؟ ويعرض صورة لاعب يحمي عضلاته بالإحماء.\n\nالحصة 2:\nيعلن المعلم مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء محافظات مع قائد ويعرض الأقسام (ص 18-20، 59).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج إحماء متدرج (مشي، جري خفيف، تحريك المفاصل من الرقبة إلى الكاحلين، إطالة خفيفة) مع التفكير بصوت عالٍ.\n- الطالب: يقلد ويكرر السبب.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن التلاميذ النبض والدفء قبل الإحماء وبعده ويستنتجون دوره في الوقاية من الإصابة (برنامج صحتي ص 23).\n- الطالب: يلاحظ ويستنتج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بأربع حركات ثم يتبادلون.\n- الطالب: يقود ويؤدي.\n\nالنشاط 4 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تصنف كل مجموعة بطاقات التمرينات إلى إحماء وتهدئة وتعلل.\n- الطالب: يصنف ويعلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التهدئة ونصيحة اليوم.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بنموذج المعلم.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم الأوضاع المشتقة من الجلوس والرقود (أداء الوضع من البطاقة وتمرين منه)، قسم التمرينات الفردية بالكرات الطبية، قسم التمرينات الزوجية بالكرات، قسم جمباز الموانع المبسط (وثب فوق الحبال ومروق أسفل الحاجز)، مع تسجيل النقاط.\n- الطالب: يؤدي مهام الأقسام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع تمرير الكرة الطبية.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا يحمي الإحماء العضلات؟\nالإجابة: لأنه يرفع حرارتها ويجعلها مرنة فلا تصاب.\nس2 (المستوى المتوقع): بماذا نبدأ الإحماء؟\nالإجابة: بالمشي والجري الخفيف.\nس3 (المستوى المتقدم): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء في البداية لتسخين الجسم، والتهدئة في النهاية لإراحته.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الزوجية بالكرات.\nس2 (المستوى المتوقع): اذكر وضعًا مشتقًا أديته في قسم الأوضاع.\nالإجابة: مثل: جلوس طويل فتحًا.\nس3 (المستوى المتقدم): لماذا نسجل نقاط النظام والتعاون؟\nالإجابة: لأنهما من أهداف المهرجان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): قُد إحماءً لزملائك بأربع حركات.\nالإجابة: يؤديه متدرجًا.\nس2 (المستوى المتوقع): صنّف: الإطالة البطيئة والتنفس العميق.\nالإجابة: تهدئة.\nس3 (المستوى المتقدم): زميلك يريد الجري بأقصى سرعة فورًا، بماذا تنصحه؟\nالإجابة: أن يحمي عضلاته بالإحماء أولًا.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أقسام المهرجان الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الفردية بالكرات، التمرينات الزوجية، جمباز الموانع.\nس2 (المستوى المتوقع): ما دورك في مجموعتك؟\nالإجابة: يذكر دوره.\nس3 (المستوى المتقدم): كيف تعبر عن روحك الرياضية عند الخسارة؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب والتهدئة بعده (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين بالكرة يوميًا (دليل المعلم ص 42-52)."}}, {"title": "تمرينات الموانع (جمباز الموانع)", "unit": "التمرينات (أتمرن بنظام)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 53-60", "n": 2, "periods": [{"focus": "التعرف إلى الموانع وطرق تخطيها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع والأدوات المستخدمة كموانع.\n2. يؤدي حركات تخطي الموانع (الوثب فوق الحاجز، المروق أسفل الحبل، المشي على المقعد).\n3. يختار الحركة المناسبة لتخطي كل مانع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- تمرينات الموانع\n- المانع\n- الوثب\n- المروق\n- المشي على المقعد", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الأدوات ويسأل: كيف نتخطى الحاجز؟ وكيف نمر من تحت الحبل؟ ويعرض صور جمباز الموانع (ص 53-54).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب، مروق.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج كل مانع (ص 55-56): الوثب بالقدمين فوق الحاجز، المروق أسفل الحبل المثبت، المشي على المقعد السويدي، المروق داخل قطعة الصندوق المقسم، الوثب بالحبل 5 م، مع نقاط الأمان.\n- الطالب: يقلد كل حركة بعد النموذج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ طريقتين لتخطي المانع نفسه (مثلًا الوثب فوق الصندوق أم المروق داخله) ويكتشف الأنسب والأسرع والأكثر أمانًا.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تؤدي كل مجموعة مسار موانع قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الحركة الصحيحة.\n- الطالب: يؤدي المسار بالتتابع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما المانع؟\nالإجابة: أداة أو جهاز نتخطاه بحركة مثل الوثب أو المروق.\nس2 (المستوى المتوقع): كيف نتخطى الحبل المثبت المنخفض؟\nالإجابة: بالمروق أسفله أو الوثب فوقه حسب ارتفاعه.\nس3 (المستوى المتقدم): ما الحركة المناسبة للمقعد السويدي؟\nالإجابة: المشي عليه بتوازن.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر ثلاث أدوات تستخدم موانع.\nالإجابة: الحاجز، الحبل، المقعد السويدي (أو الصندوق المقسم).\nس2 (المستوى المتوقع): أدِّ المروق داخل قطعة الصندوق المقسم.\nالإجابة: يؤديه دون لمس الأطراف.\nس3 (المستوى المتقدم): لماذا اخترت الوثب فوق الحاجز لا المروق؟\nالإجابة: لأن الحاجز منخفض والوثب أسرع وأسهل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا (وسادة للوثب، كرسي للمروق تحته) ومارساه بأمان (دليل المعلم ص 55-56)."}}, {"focus": "مسارات ومنافسات تمرينات الموانع", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي مسار موانع متكاملًا بحركات متنوعة.\n2. يوظف الحركات والمهارات (جري، وثب، مروق، توازن) في منافسات الموانع.\n3. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم حركات الموانع بنموذج تلميذ ويعرض مسار اليوم: جري متعرج، وثب فوق حاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة على المرتبة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 57-58: مجموعات بقائد تؤدي المسار بالتتابع مرتين، ويلاحظ القائد الأداء الصحيح ويصححه.\n- الطالب: يؤدي المسار ويصحح زملاءه.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة الموانع ص 59: تتابع بين المجموعات في المسار، وتحسب النقاط للأداء الصحيح والسرعة.\n- الطالب: يتسابق بأمان.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: ما الحركة التي أخذت وقتًا أطول؟ ولماذا؟ ليستنتج التلاميذ أن التوازن على المقعد يحتاج إلى هدوء.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور بالثقة.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: جري متعرج، وثب فوق الحاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة.\nس2 (المستوى المتوقع): ما الحركة التي نؤديها على المرتبة في نهاية المسار؟\nالإجابة: الدحرجة.\nس3 (المستوى المتقدم): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والسرعة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مسار الموانع كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (المستوى المتوقع): كيف شعرت عندما تخطيت الموانع كلها؟\nالإجابة: يعبر عن الثقة.\nس3 (المستوى المتقدم): اقترح مانعًا جديدًا للمسار والحركة المناسبة له.\nالإجابة: مثل: أطواق على الأرض والحجل داخلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ممارسة مسار الموانع في مكان آمن وتسجيل زمنه (دليل المعلم ص 57-59)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع والأدوات المستخدمة كموانع.\n2. يؤدي حركات تخطي الموانع (الوثب فوق الحاجز، المروق أسفل الحبل، المشي على المقعد).\n3. يختار الحركة المناسبة لتخطي كل مانع.\n\nالحصة 2:\n1. يؤدي مسار موانع متكاملًا بحركات متنوعة.\n2. يوظف الحركات والمهارات (جري، وثب، مروق، توازن) في منافسات الموانع.\n3. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- تمرينات الموانع\n- المانع\n- الوثب\n- المروق\n- المشي على المقعد\n\nالحصة 2:\n- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم الأدوات ويسأل: كيف نتخطى الحاجز؟ وكيف نمر من تحت الحبل؟ ويعرض صور جمباز الموانع (ص 53-54).\n\nالحصة 2:\nيراجع المعلم حركات الموانع بنموذج تلميذ ويعرض مسار اليوم: جري متعرج، وثب فوق حاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة على المرتبة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب، مروق.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج كل مانع (ص 55-56): الوثب بالقدمين فوق الحاجز، المروق أسفل الحبل المثبت، المشي على المقعد السويدي، المروق داخل قطعة الصندوق المقسم، الوثب بالحبل 5 م، مع نقاط الأمان.\n- الطالب: يقلد كل حركة بعد النموذج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ طريقتين لتخطي المانع نفسه (مثلًا الوثب فوق الصندوق أم المروق داخله) ويكتشف الأنسب والأسرع والأكثر أمانًا.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تؤدي كل مجموعة مسار موانع قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الحركة الصحيحة.\n- الطالب: يؤدي المسار بالتتابع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 57-58: مجموعات بقائد تؤدي المسار بالتتابع مرتين، ويلاحظ القائد الأداء الصحيح ويصححه.\n- الطالب: يؤدي المسار ويصحح زملاءه.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة الموانع ص 59: تتابع بين المجموعات في المسار، وتحسب النقاط للأداء الصحيح والسرعة.\n- الطالب: يتسابق بأمان.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: ما الحركة التي أخذت وقتًا أطول؟ ولماذا؟ ليستنتج التلاميذ أن التوازن على المقعد يحتاج إلى هدوء.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور بالثقة.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما المانع؟\nالإجابة: أداة أو جهاز نتخطاه بحركة مثل الوثب أو المروق.\nس2 (المستوى المتوقع): كيف نتخطى الحبل المثبت المنخفض؟\nالإجابة: بالمروق أسفله أو الوثب فوقه حسب ارتفاعه.\nس3 (المستوى المتقدم): ما الحركة المناسبة للمقعد السويدي؟\nالإجابة: المشي عليه بتوازن.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: جري متعرج، وثب فوق الحاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة.\nس2 (المستوى المتوقع): ما الحركة التي نؤديها على المرتبة في نهاية المسار؟\nالإجابة: الدحرجة.\nس3 (المستوى المتقدم): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والسرعة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاث أدوات تستخدم موانع.\nالإجابة: الحاجز، الحبل، المقعد السويدي (أو الصندوق المقسم).\nس2 (المستوى المتوقع): أدِّ المروق داخل قطعة الصندوق المقسم.\nالإجابة: يؤديه دون لمس الأطراف.\nس3 (المستوى المتقدم): لماذا اخترت الوثب فوق الحاجز لا المروق؟\nالإجابة: لأن الحاجز منخفض والوثب أسرع وأسهل.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ مسار الموانع كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (المستوى المتوقع): كيف شعرت عندما تخطيت الموانع كلها؟\nالإجابة: يعبر عن الثقة.\nس3 (المستوى المتقدم): اقترح مانعًا جديدًا للمسار والحركة المناسبة له.\nالإجابة: مثل: أطواق على الأرض والحجل داخلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا (وسادة للوثب، كرسي للمروق تحته) ومارساه بأمان (دليل المعلم ص 55-56).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على ممارسة مسار الموانع في مكان آمن وتسجيل زمنه (دليل المعلم ص 57-59)."}}, {"title": "الاتزان", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 64-73", "n": 2, "periods": [{"focus": "الاتزان الثابت (الميزان الأمامي والارتكاز على قدم واحدة)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الاتزان الثابت ومواقفه.\n2. يؤدي الميزان الأمامي والارتكاز على قدم واحدة مع الثبات.\n3. يحدد العوامل التي تساعد على الاتزان (الذراعان جانبًا، النظر لنقطة ثابتة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: قطع إسفنجية\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بالونات\n- صورة توضيحية", "المفاهيم": "- الاتزان الثابت\n- مركز الثقل\n- الميزان الأمامي\n- قاعدة الارتكاز", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم على قدم واحدة ويسأل: لماذا لا أسقط؟ ثم يضم ذراعيه ويغمض عينيه ويسأل: لماذا اهتز جسمي؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ثم الوقوف على قدم واحدة بالتبادل.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج (ص 65-66): الوقوف على قدم واحدة والذراعان جانبًا، ثم الميزان الأمامي (الرجل الحرة ممدودة للخلف وميل الجذع للأمام ولمس القطعة الإسفنجية بالرأس) مع التفكير بصوت عالٍ عن النظر لنقطة ثابتة.\n- الطالب: يقلد ويثبت 5 ثوانٍ.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ الثبات على قدم والذراعان جانبًا ثم مضمومتان، وبعينين مفتوحتين ثم مغمضتين، ويكتشف ما يساعد على الاتزان.\n- الطالب: يجرب ويستنتج العوامل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 1 (الاتزان الثابت) ص 68: جري في المكان داخل الأطواق وعند النداء يثبت التلميذ في وضع الاتزان المطلوب، ومن يثبت أطول يفوز.\n- الطالب: يلعب ويثبت.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الاتزان الثابت؟\nالإجابة: المحافظة على ثبات الجسم في وضع معين دون حركة.\nس2 (المستوى المتوقع): أين تكون الذراعان لمساعدتنا على الاتزان؟\nالإجابة: جانبًا.\nس3 (المستوى المتقدم): لماذا نهتز عند إغماض العينين؟\nالإجابة: لأن النظر لنقطة ثابتة يساعد على الاتزان.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الميزان الأمامي 5 ثوانٍ.\nالإجابة: يؤديه والرجل الحرة ممدودة للخلف والذراعان جانبًا.\nس2 (المستوى المتوقع): اذكر عاملين يساعدان على الاتزان.\nالإجابة: فتح الذراعين جانبًا، والنظر لنقطة ثابتة.\nس3 (المستوى المتقدم): ما الفرق بين الارتكاز على نقطة واحدة ونقطتين؟\nالإجابة: الارتكاز على نقطتين (القدمين) أثبت وأسهل من نقطة واحدة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الوقوف على قدم واحدة 10 ثوانٍ لكل قدم (دليل المعلم ص 65-68)."}}, {"focus": "الاتزان الحركي (الوثب لأعلى والدوران والهبوط، الاتزان على المقعد السويدي)", "num": لوثب والدوران؟\nالإجابة: بالقدمين معًا وثني الركبتين والذراعان جانبًا.\nس3 (المستوى المتقدم): اذكر لعبة أو مسابقة فيها اتزان حركي.\nالإجابة: الجمباز أو المشي على العارضة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب من المقعد مع نصف دورة والهبوط بثبات.\nالإجابة: يؤديه ويثبت بعد الهبوط.\nس2 (المستوى المتوقع): اذكر محطتين من محطات الاتزان.\nالإجابة: محطة البالون ومحطة الأدوات المتنوعة.\nس3 (المستوى المتقدم): لماذا يصعب الاتزان على المقعد مع حمل البالون؟\nالإجابة: لأن حمل الشيء يغير مركز ثقل الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على المشي على خط مرسوم مع حمل كتاب على الرأس (دليل المعلم ص 67-72)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الاتزان الثابت ومواقفه.\n2. يؤدي الميزان الأمامي والارتكاز على قدم واحدة مع الثبات.\n3. يحدد العوامل التي تساعد على الاتزان (الذراعان جانبًا، النظر لنقطة ثابتة).\n\nالحصة 2:\n1. يميز بين الاتزان الثابت والاتزان الحركي.\n2. يؤدي الوثب لأعلى والدوران نصف دورة والهبوط بثبات من مستوى عالٍ.\n3. يوظف حركات الاتزان في المسابقات والألعاب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: قطع إسفنجية\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بالونات\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: بالونات\n- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الاتزان الثابت\n- مركز الثقل\n- الميزان الأمامي\n- قاعدة الارتكاز\n\nالحصة 2:\n- الاتزان الحركي\n- الدوران\n- الهبوط\n- المقعد السويدي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف المعلم على قدم واحدة ويسأل: لماذا لا أسقط؟ ثم يضم ذراعيه ويغمض عينيه ويسأل: لماذا اهتز جسمي؟\n\nالحصة 2:\nيراجع المعلم الاتزان الثابت، ثم يمشي على المقعد السويدي ويسأل: هل هذا اتزان ثا من المرات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الاتزان الثابت؟\nالإجابة: المحافظة على ثبات الجسم في وضع معين دون حركة.\nس2 (المستوى المتوقع): أين تكون الذراعان لمساعدتنا على الاتزان؟\nالإجابة: جانبًا.\nس3 (المستوى المتقدم): لماذا نهتز عند إغماض العينين؟\nالإجابة: لأن النظر لنقطة ثابتة يساعد على الاتزان.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الفرق بين الاتزان الثابت والحركي؟\nالإجابة: الثابت دون حركة، والحركي أثناء أداء حركة كالمشي على المقعد أو الهبوط.\nس2 (المستوى المتوقع): كيف نهبط بثبات بعد الوثب والدوران؟\nالإجابة: بالقدمين معًا وثني الركبتين والذراعان جانبًا.\nس3 (المستوى المتقدم): اذكر لعبة أو مسابقة فيها اتزان حركي.\nالإجابة: الجمباز أو المشي على العارضة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الميزان الأمامي 5 ثوانٍ.\nالإجابة: يؤديه والرجل الحرة ممدودة للخلف والذراعان جانبًا.\nس2 (المستوى المتوقع): اذكر عاملين يساعدان على الاتزان.\nالإجابة: فتح الذراعين جانبًا، والنظر لنقطة ثابتة.\nس3 (المستوى المتقدم): ما الفرق بين الارتكاز على نقطة واحدة ونقطتين؟\nالإجابة: الارتكاز على نقطتين (القدمين) أثبت وأسهل من نقطة واحدة.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الوثب من المقعد مع نصف دورة والهبوط بثبات.\nالإجابة: يؤديه ويثبت بعد الهبوط.\nس2 (المستوى المتوقع): اذكر محطتين من محطات الاتزان.\nالإجابة: محطة البالون ومحطة الأدوات المتنوعة.\nس3 (المستوى المتقدم): لماذا يصعب الاتزان على المقعد مع حمل البالون؟\nالإجابة: لأن حمل الشيء يغير مركز ثقل الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الوقوف على قدم واحدة 10 ثوانٍ لكل قدم (دليل المعلم ص 65-68).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طفلك على المشي على خط مرسوم مع حمل كتاب على الرأس (دليل المعلم ص 67-72)."}}, {"title": "البراعة الحركية", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 74-81", "n": 2, "periods": [{"focus": "حركات البراعة الحركية الفردية (دوران الطاحونة، الوثب بتلامس القدمين، المشي المعكوس)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركات البراعة الحركية وأهميتها.\n2. يؤدي دوران الطاحونة والوثب بتلامس القدمين والمشي المعكوس.\n3. يحافظ على جمالية الأداء والاتزان أثناء الحركة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مربعات مرقمة\n- صورة توضيحية", "المفاهيم": "- البراعة الحركية\n- دوران الطاحونة\n- الوثب بتلامس القدمين\n- المشي المعكوس", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب جمباز يؤدي حركة مميزة ويسأل: ما الذي يجعل الحركة جميلة؟ ويقدم مصطلح البراعة الحركية (ص 74-75).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 75-76): الوثب بتلامس القدمين (وقوف فتحًا، وثب عاليًا مع تلامس القدمين وتباعدهما، الهبوط فتحًا)، دوران الطاحونة على المرتبة، المشي المعكوس (للخلف) مع النظر عبر الكتف؛ مع نقاط الأمان.\n- الطالب: يقلد كل حركة بالتدرج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (حركات التقليد والبراعة الفردية) ص 77: قطارات على خط البداية، يؤدي التلميذ الوثب بتلامس القدمين داخل الأطواق ثم دوران الطاحونة على المرتبة ثم المشي المعكوس لخط النهاية، ويسجل القائد الأداء الجميل.\n- الطالب: يؤدي المسار ويسجل القائد.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الحكم الصغير): يؤدي تلميذ حركة براعة ويقيّمها زملاؤه بالتصفيق (1-3) حسب الجمال والثبات.\n- الطالب: يؤدي ويقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما البراعة الحركية؟\nالإجابة: أداء الحركات بمهارة وجمال وثبات.\nس2 (المستوى المتوقع): كيف نؤدي الوثب بتلامس القدمين؟\nالإجابة: نثب عاليًا من الوقوف فتحًا ونلامس القدمين في الهواء ثم نهبط فتحًا.\nس3 (المستوى المتقدم): ماذا نفعل بالرأس في المشي المعكوس؟\nالإجابة: ننظر عبر الكتف لنرى الطريق.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ دوران الطاحونة على المرتبة.\nالإجابة: يؤديه بثبات.\nس2 (المستوى المتوقع): ما الذي يجعل الحركة أكثر جمالًا؟\nالإجابة: استقامة الجذع والرجلين والنظر للأمام والهبوط الهادئ.\nس3 (المستوى المتقدم): اذكر ثلاث حركات براعة تعلمتها اليوم.\nالإجابة: الوثب بتلامس القدمين، دوران الطاحونة، المشي المعكوس.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على أداء المشي المعكوس في الممر بأمان والوثب بتلامس القدمين (دليل المعلم ص 75-77)."}}, {"focus": "البراعة مع الزميل (دوران عقارب الساعة) وألعاب البراعة", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي حركات البراعة مع الزميل (دوران عقارب الساعة) بالتوافق.\n2. يشارك زملاءه أنشطة متنوعة للبراعة الحركية.\n3. يشعر بالثقة في النفس عند أدائه حركات البراعة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أكياس رمل\n- أخرى: مربعات مرقمة\n- أخرى: أقماع", "المفاهيم": "- البراعة مع الزميل\n- دوران عقارب الساعة\n- التوافق\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم حركات البراعة الفردية، ثم يعرض مع تلميذ دوران عقارب الساعة ويسأل: ما الذي يدور وما الذي يثبت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ النموذج (ص 76): تلميذان في وضع الانبطاح المائل متجاوران، استناد اليدين والأصابع مفرودة، تلاصق القدمين، التحرك باليدين في اتجاه عقارب الساعة مع ثبات القدمين كمحور، ثم تطبيق في أزواج.\n- الطالب: يؤدي مع زميله بالتوافق.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (البراعة مع الزميل) ص 78: ثنائيات تجري على محيط المستطيل وعند النداء تدخل كل
