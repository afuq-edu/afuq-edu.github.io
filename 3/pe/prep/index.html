ة: يعد القائد ويؤدي الجميع معًا بتوافق.\n\nالحصة 2:\nس1 (مستوى المعرفة): حاور بالكرة حول قمعين.\nالإجابة: يحاور بتنطيط منخفض.\nس2 (مستوى التطبيق): اذكر محطتين من المراجعة.\nالإجابة: التنطيط المتعرج وضرب البالون.\nس3 (مستوى الاستدلال): ما المهارة التي ستتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على التدرب 10 دقائق يوميًا على المهارة التي اختارها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=1"}}, {"title": "الأوضاع المشتقة في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 30-41", "n": 2, "periods": [{"focus": "الأوضاع المشتقة من الجلوس", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الجلوس (جلوس طويل، جلوس فتحًا، جلوس تربيع، جلوس القرفصاء).\n2. يؤدي أوضاعًا مشتقة من الجلوس بدقة وتمرينًا بسيطًا من كل وضع.\n3. يميز بين الوضع الأساسي والوضع المشتق.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: بطاقات مصورة\n- أخرى: كرات\n- صورة توضيحية", "المفاهيم": "- الوضع الأساسي\n- الوضع المشتق\n- الجلوس\n- الجذع\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يجلس المعلم جلوسًا طويلًا ثم يفتح رجليه ويسأل: ما الوضع الأساسي؟ وماذا تغير؟ ويراجع مفهوم الوضع المشتق (ص 30-31).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 31-33: (جلوس طويل)، (جلوس طويل فتحًا)، (جلوس تربيع. الذراعان عاليًا)، (جلوس القرفصاء)، (جلوس. الذراعان خلفًا استنادًا) مع النقاط الفنية (استقامة الظهر)، ثم تمرين من كل وضع بالعد (ثني الجذع أمامًا، لف الجذع)، ويقلد التلميذ ويؤدي التمرين بالعد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. بطاقة وضع الجلوس الأساسي لكل زوج؛ يبتكر الزوجان أربعة أوضاع مشتقة بتحريك الرجلين أو الذراعين أو الجذع، ويستنتج الصف القاعدة، ويبتكر التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال الجلوس): جري حر وعند نداء الوضع يجلس التلميذ في الوضع المشتق الصحيح على أقرب مرتبة، ويستجيب التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من الجلوس الطويل بالإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الوضع الأساسي لوضع (جلوس طويل فتحًا)؟\nالإجابة: الجلوس.\nس2 (مستوى التطبيق): أدِّ وضع (جلوس القرفصاء).\nالإجابة: يجلس على المشطين والركبتان منثنيتان بالكامل.\nس3 (مستوى الاستدلال): كيف يكون الظهر في الجلوس الطويل؟\nالإجابة: مستقيمًا.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ أوضاع الجلوس المشتقة (الطويل، وفتحًا، والتربيع، والقرفصاء) ببطء مع صور مساعدة، ويؤديها معه، ثم ينادي «جلوس القرفصاء!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين أوضاع الجلوس المشتقة مع تمرين بسيط من كل وضع، وتحديد الوضع الأساسي لكل وضع مشتق.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر ثلاثة أوضاع مشتقة من الجلوس.\nالإجابة: جلوس طويل، جلوس فتحًا، جلوس تربيع.\nس2 (مستوى التطبيق): أدِّ تمرين ثني الجذع أمامًا من الجلوس الطويل بالعد.\nالإجابة: يؤديه بالعد والركبتان مستقيمتان.\nس3 (مستوى الاستدلال): ابتكر وضعًا مشتقًا من الجلوس وسمِّه.\nالإجابة: مثل: جلوس طويل. الذراعان جانبًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الجلوس في دليل المعلم ص 31-33 ومارسا تمرينًا من كل وضع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=2"}}, {"focus": "الأوضاع المشتقة من الرقود", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الرقود (رقود فتحًا، رقود على البطن، رقود الذراعان عاليًا).\n2. يؤدي تمرينات من الأوضاع المشتقة من الرقود بالعد.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: كرات\n- أخرى: بطاقات مصورة\n- أخرى: أعلام ملونة", "المفاهيم": "- الرقود\n- الوضع المشتق\n- القوام السليم\n- عضلات البطن والظهر", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم أوضاع الجلوس بالنداء، ثم يرقد ويرفع ذراعيه عاليًا ويسأل: من أي وضع اشتققت هذا الوضع؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 34-36: (رقود فتحًا)، (رقود. الذراعان عاليًا)، (رقود على البطن)، (رقود. ثني الركبتين)، مع تمرين من كل وضع (رفع الرجلين بالتبادل، رفع الجذع من الرقود على البطن) بالعد، ويقلد التلميذ ويؤدي التمرين بالعد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الأوضاع المشتقة من الرقود والجلوس بأربع مجموعات: محطة رقود فتحًا (رفع الرجلين)، محطة رقود على البطن (رفع الذراعين والرجلين)، محطة جلوس طويل (مد الذراعين للقدمين)، محطة جلوس تربيع (لف الجذع)، مع التبديل، ويؤدي التلميذ تمرين المحطة ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 5 ص 40: يرفع المعلم علمًا ملونًا يرمز لوضع أساسي، ويؤدي التلاميذ وضعًا مشتقًا منه من اختيارهم، ويستجيب التلميذ بوضع مشتق صحيح (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من الرقود والتنفس، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر وضعين مشتقين من الرقود.\nالإجابة: رقود فتحًا، رقود على البطن.\nس2 (مستوى التطبيق): ما التمرين الذي أديناه من الرقود على البطن؟\nالإجابة: رفع الذراعين والرجلين (أو الجذع).\nس3 (مستوى الاستدلال): أي العضلات تعمل في رفع الرجلين من الرقود؟\nالإجابة: عضلات البطن.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ أوضاع الجلوس المشتقة (الطويل، وفتحًا، والتربيع، والقرفصاء) ببطء مع صور مساعدة، ويؤديها معه، ثم ينادي «جلوس القرفصاء!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين أوضاع الجلوس المشتقة مع تمرين بسيط من كل وضع، وتحديد الوضع الأساسي لكل وضع مشتق.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ وضع (رقود. ثني الركبتين) ثم تمرين رفع الجذع مرتين.\nالإجابة: يؤديه بطريقة صحيحة.\nس2 (مستوى التطبيق): أرفع علمًا يرمز للرقود، أدِّ وضعًا مشتقًا منه.\nالإجابة: يؤدي وضعًا مشتقًا من الرقود.\nس3 (مستوى الاستدلال): كيف تساعد تمرينات الرقود على القوام السليم؟\nالإجابة: تقوي عضلات البطن والظهر التي تحمل الجذع معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا من الرقود (رفع الرجلين بالتبادل) 10 مرات يوميًا (دليل المعلم ص 34-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الأوضاع المشتقة من الجلوس (جلوس طويل، جلوس فتحًا، جلوس تربيع، جلوس القرفصاء).\n2. يؤدي أوضاعًا مشتقة من الجلوس بدقة وتمرينًا بسيطًا من كل وضع.\n3. يميز بين الوضع الأساسي والوضع المشتق.\n\nالحصة 2:\n1. يتعرف الأوضاع المشتقة من الرقود (رقود فتحًا، رقود على البطن، رقود الذراعان عاليًا).\n2. يؤدي تمرينات من الأوضاع المشتقة من الرقود بالعد.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: بطاقات مصورة\n- أخرى: كرات\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: كرات\n- أخرى: بطاقات مصورة\n- أخرى: أعلام ملونة", "المفاهيم": "الحصة 1:\n- الوضع الأساسي\n- الوضع المشتق\n- الجلوس\n- الجذع\n- اللياقة البدنية\n\nالحصة 2:\n- الرقود\n- الوضع المشتق\n- القوام السليم\n- عضلات البطن والظهر", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيجلس المعلم جلوسًا طويلًا ثم يفتح رجليه ويسأل: ما الوضع الأساسي؟ وماذا تغير؟ ويراجع مفهوم الوضع المشتق (ص 30-31).\n\nالحصة 2:\nيراجع المعلم أوضاع الجلوس بالنداء، ثم يرقد ويرفع ذراعيه عاليًا ويسأل: من أي وضع اشتققت هذا الوضع؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 31-33: (جلوس طويل)، (جلوس طويل فتحًا)، (جلوس تربيع. الذراعان عاليًا)، (جلوس القرفصاء)، (جلوس. الذراعان خلفًا استنادًا) مع النقاط الفنية (استقامة الظهر)، ثم تمرين من كل وضع بالعد (ثني الجذع أمامًا، لف الجذع)، ويقلد التلميذ ويؤدي التمرين بالعد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. بطاقة وضع الجلوس الأساسي لكل زوج؛ يبتكر الزوجان أربعة أوضاع مشتقة بتحريك الرجلين أو الذراعين أو الجذع، ويستنتج الصف القاعدة، ويبتكر التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال الجلوس): جري حر وعند نداء الوضع يجلس التلميذ في الوضع المشتق الصحيح على أقرب مرتبة، ويستجيب التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من الجلوس الطويل بالإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 34-36: (رقود فتحًا)، (رقود. الذراعان عاليًا)، (رقود على البطن)، (رقود. ثني الركبتين)، مع تمرين من كل وضع (رفع الرجلين بالتبادل، رفع الجذع من الرقود على البطن) بالعد، ويقلد التلميذ ويؤدي التمرين بالعد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الأوضاع المشتقة من الرقود والجلوس بأربع مجموعات: محطة رقود فتحًا (رفع الرجلين)، محطة رقود على البطن (رفع الذراعين والرجلين)، محطة جلوس طويل (مد الذراعين للقدمين)، محطة جلوس تربيع (لف الجذع)، مع التبديل، ويؤدي التلميذ تمرين المحطة ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 5 ص 40: يرفع المعلم علمًا ملونًا يرمز لوضع أساسي، ويؤدي التلاميذ وضعًا مشتقًا منه من اختيارهم، ويستجيب التلميذ بوضع مشتق صحيح (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من الرقود والتنفس، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الوضع الأساسي لوضع (جلوس طويل فتحًا)؟\nالإجابة: الجلوس.\nس2 (مستوى التطبيق): أدِّ وضع (جلوس القرفصاء).\nالإجابة: يجلس على المشطين والركبتان منثنيتان بالكامل.\nس3 (مستوى الاستدلال): كيف يكون الظهر في الجلوس الطويل؟\nالإجابة: مستقيمًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر وضعين مشتقين من الرقود.\nالإجابة: رقود فتحًا، رقود على البطن.\nس2 (مستوى التطبيق): ما التمرين الذي أديناه من الرقود على البطن؟\nالإجابة: رفع الذراعين والرجلين (أو الجذع).\nس3 (مستوى الاستدلال): أي العضلات تعمل في رفع الرجلين من الرقود؟\nالإجابة: عضلات البطن.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ أوضاع الجلوس المشتقة (الطويل، وفتحًا، والتربيع، والقرفصاء) ببطء مع صور مساعدة، ويؤديها معه، ثم ينادي «جلوس القرفصاء!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين أوضاع الجلوس المشتقة مع تمرين بسيط من كل وضع، وتحديد الوضع الأساسي لكل وضع مشتق.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر ثلاثة أوضاع مشتقة من الجلوس.\nالإجابة: جلوس طويل، جلوس فتحًا، جلوس تربيع.\nس2 (مستوى التطبيق): أدِّ تمرين ثني الجذع أمامًا من الجلوس الطويل بالعد.\nالإجابة: يؤديه بالعد والركبتان مستقيمتان.\nس3 (مستوى الاستدلال): ابتكر وضعًا مشتقًا من الجلوس وسمِّه.\nالإجابة: مثل: جلوس طويل. الذراعان جانبًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ وضع (رقود. ثني الركبتين) ثم تمرين رفع الجذع مرتين.\nالإجابة: يؤديه بطريقة صحيحة.\nس2 (مستوى التطبيق): أرفع علمًا يرمز للرقود، أدِّ وضعًا مشتقًا منه.\nالإجابة: يؤدي وضعًا مشتقًا من الرقود.\nس3 (مستوى الاستدلال): كيف تساعد تمرينات الرقود على القوام السليم؟\nالإجابة: تقوي عضلات البطن والظهر التي تحمل الجذع معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الجلوس في دليل المعلم ص 31-33 ومارسا تمرينًا من كل وضع.\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا من الرقود (رفع الرجلين بالتبادل) 10 مرات يوميًا (دليل المعلم ص 34-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=2"}}, {"title": "التمرينات بالأدوات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث – الرابع", "date": "20-24/9/2026 إلى 27/9-1/10/2026", "pages": "دليل المعلم ص 42-52", "n": 4, "periods": [{"focus": "التمرينات الفردية بالكرات الطبية للذراعين", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات بالأدوات (الكرات الطبية) وأهميتها.\n2. يؤدي تمرينات فردية بالكرة الطبية للذراعين بالعد.\n3. يميز بين التمرين الحر والتمرين بالأدوات.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- التمرين بالأدوات\n- الكرة الطبية\n- التمرينات الفردية بالأدوات\n- الذراعان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم كرة طبية وكرة عادية ويسأل: ما الفرق بينهما؟ ولماذا نستخدم الكرة الثقيلة في التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، تحريك الذراعين والكتفين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 43-44: (وقوف. الكرة أمامًا) رفع الكرة عاليًا وخفضها، (وقوف فتحًا. الكرة عاليًا) ثني الجذع جانبًا، (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا، بالعد مع التفكير بصوت عالٍ عن مسك الكرة بأمان، ويقلد التلميذ بالعد ويمسك الكرة بأمان (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ التمرين نفسه بكرة عادية ثم بالكرة الطبية ويكتشف الفرق في جهد الذراعين، ويستنتج فائدة الأدوات في زيادة قوة العضلات، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الكرة الثقيلة): في دائرة، تمرير الكرة الطبية من فوق الرأس من تلميذ لآخر بالعد، والمجموعة الأسرع دون سقوط تفوز، ويلعب التلميذ ويمرر بأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة الذراعين والكتفين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الكرة الطبية؟\nالإجابة: كرة ثقيلة نستخدمها أداة في التمرينات.\nس2 (مستوى التطبيق): أدِّ تمرين رفع الكرة عاليًا بالعد.\nالإجابة: يرفع الكرة ويخفضها بالعد.\nس3 (مستوى الاستدلال): لماذا تزيد الكرة الطبية من قوة الذراعين؟\nالإجابة: لأن حملها يحتاج إلى جهد أكبر من العضلات.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "س1 (مستوى المعرفة): ما الفرق بين التمرين الحر والتمرين بالأدوات؟\nالإجابة: الحر بلا أدوات، وبالأدوات نستخدم كرة أو حبلًا أو عصا.\nس2 (مستوى التطبيق): اذكر تمرينًا بالكرة الطبية للذراعين.\nالإجابة: مد الذراعين عاليًا بالكرة من خلف الرأس.\nس3 (مستوى الاستدلال): كيف نمسك الكرة الطبية بأمان؟\nالإجابة: باليدين معًا وبإحكام وعدم رميها على الزملاء.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل في المنزل لتمرينين للذراعين (دليل المعلم ص 43-44).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}, {"focus": "التمرينات الفردية بالكرات الطبية للجذع والرجلين", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تمرينات فردية بالكرة الطبية للجذع والرجلين.\n2. يميز أنواع التمرينات بالكرة الطبية حسب الجزء العامل.\n3. يقدر أهمية التمرينات بالأدوات في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة", "المفاهيم": "- الكرة الطبية\n- الجذع\n- الرجلان\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الذراعين بالكرة، ثم يسأل: هل نستطيع تمرين الرجلين بالكرة الطبية؟ وكيف؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم بالكرة الطبية الخفيفة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 45-46: (جلوس طويل. الكرة أمامًا) لف الجذع بالكرة، (رقود. الكرة بين القدمين) رفع الرجلين، (وقوف. الكرة بين القدمين) الوثب مع الكرة، (جلوس القرفصاء. الكرة أمامًا) الوقوف مع رفع الكرة، بالعد، ويقلد التلميذ بالعد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات بأربع مجموعات: محطة الجذع (لف الجذع بالكرة)، محطة الرجلين (رفع الرجلين بالكرة)، محطة الوثب بالكرة بين القدمين، محطة الذراعين (مراجعة)، مع تبديل وتسجيل القائد، ويؤدي التلميذ تمرين المحطة ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أين الجزء؟): يرفع المعلم بطاقة تمرين بالكرة ويؤديه التلاميذ ويذكرون الجزء العامل، ويستجيب التلميذ ويذكر الجزء (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر تمرينًا بالكرة الطبية للجذع.\nالإجابة: لف الجذع بالكرة من الجلوس الطويل.\nس2 (مستوى التطبيق): أين نضع الكرة في تمرين رفع الرجلين؟\nالإجابة: بين القدمين.\nس3 (مستوى الاستدلال): ما الجزء العامل في الوثب بالكرة بين القدمين؟\nالإجابة: الرجلان.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تمرين رفع الرجلين بالكرة بين القدمين 5 مرات.\nالإجابة: يؤديه من الرقود.\nس2 (مستوى التطبيق): صنّف هذا التمرين: (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا.\nالإجابة: تمرين للذراعين.\nس3 (مستوى الاستدلال): لماذا تحافظ التمرينات بالأدوات على لياقتنا؟\nالإجابة: لأنها تقوي العضلات بجهد أكبر وتنوع التدريب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع وآخر للرجلين بكرة خفيفة (دليل المعلم ص 45-46).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}, {"focus": "التمرينات الزوجية بالكرات الطبية", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الزوجية بالكرات الطبية.\n2. يؤدي تمرينات زوجية بالكرة الطبية بالتوافق مع الزميل.\n3. يشارك زميله الأداء بأمان وتعاون.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التمرينات الزوجية بالأدوات\n- التوافق\n- الزميل\n- الدفع بالقدم", "التهيئة / التمهيد / التعلم القبلي": "يؤدي المعلم مع تلميذ تمرين (وقوف مواجه. الكرة أمام القدمين) تبادل دفع الكرة بالقدم ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم في أزواج، ويقلد التلميذ مع زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ نماذج ص 47-48: (وقوف مواجه. مسك الكرة باليدين) تبادل دفع الكرة بالقدمين، (جلوس القرفصاء مواجه. الكرة بين القدمين) تبادل دفع الكرة، (جلوس طويل مواجه) تمرير الكرة من فوق الرأس، (وقوف ظهرًا لظهر) تمرير الكرة بلف الجذع، مع العد المشترك، ويؤدي التلميذ مع زميله بالتوافق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار (قائد يعد، وزميل يبدأ) تؤدي كل ثنائية البطاقات الأربع ثم تبتكر تمرينًا زوجيًا جديدًا بالكرة، والتلاميذ يتعاون ويبتكر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المرآة بالكرة): يؤدي أحد الزوجين تمرينًا بالكرة ويقلده الآخر، ويلعب التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة زوجية، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر تمرينًا زوجيًا بالكرة الطبية.\nالإجابة: تبادل دفع الكرة بالقدم من الوقوف مواجهًا للزميل.\nس2 (مستوى التطبيق): ماذا نراعي في التمرين الزوجي بالكرة؟\nالإجابة: العد معًا والدفع بلطف والمسك الجيد.\nس3 (مستوى الاستدلال): كيف نمرر الكرة ظهرًا لظهر؟\nالإجابة: بلف الجذع للجانب.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ مع زميلك تمرير الكرة من فوق الرأس 5 مرات.\nالإجابة: يؤديانه من الجلوس الطويل المواجه.\nس2 (مستوى التطبيق): ما التمرين الزوجي الذي ابتكرتماه؟\nالإجابة: يذكر التمرين.\nس3 (مستوى الاستدلال): ماذا يحدث لو دفع زميلك الكرة بقوة كبيرة؟\nالإجابة: قد تؤذي الزميل، فندفعها بلطف وتوافق.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بتمرير كرة من فوق الرأس من الجلوس (دليل المعلم ص 47-48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}, {"focus": "محطات وألعاب التمرينات بالكرات الطبية", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي التمرينات الفردية والزوجية بالكرات الطبية في محطات.\n2. يوظف الكرة الطبية في ألعاب ومنافسات بأمان.\n3. يميز نوع التمرين (فردي، زوجي) والجزء العامل من الصورة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: بطاقات مصورة", "المفاهيم": "- الكرة الطبية\n- المحطات\n- الرمي\n- الجري بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم أنواع التمرينات بالكرة بالبطاقات ويسأل: ما نوع التمرين؟ وما الجزء العامل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 و4 ص 49-50: أربع محطات: رمي الكرة عاليًا والتقاطها، الجري بالكرة بين الأقماع، تمرينات زوجية بالكرة، تمرينات فردية للجذع، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 (ألعاب) ص 51: من فوق الرأس في القطار، والمجموعة الأسرع دون سقوط تفوز، ويتسابق التلميذ ويمرر بأمان (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا سقطت الكرة في بعض القطارات؟ ليستنتج التلاميذ أهمية المسك الجيد والتوافق، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): في أي محطة جرينا بالكرة؟\nالإجابة: محطة الجري بين الأقماع.\nس2 (مستوى التطبيق): كيف مررنا الكرة في التتابع؟\nالإجابة: بين الرجلين ثم من فوق الرأس.\nس3 (مستوى الاستدلال): لماذا نمسك الكرة الطبية بإحكام؟\nالإجابة: حتى لا تسقط على القدمين أو الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة تمرين بالكرة، ما نوعه وما الجزء العامل؟\nالإجابة: يذكر فردي/زوجي والجزء.\nس2 (مستوى التطبيق): أدِّ مع مجموعتك تمرير الكرة من فوق الرأس في القطار.\nالإجابة: يمرر بتوافق.\nس3 (مستوى الاستدلال): ما أهم قاعدة سلامة مع الكرة الطبية؟\nالإجابة: عدم رميها على الزملاء والمسك بإحكام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك تمرير كرة ثقيلة قليلًا في قطار الأسرة من فوق الرأس وبين الرجلين (دليل المعلم ص 49-51).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات بالأدوات (الكرات الطبية) وأهميتها.\n2. يؤدي تمرينات فردية بالكرة الطبية للذراعين بالعد.\n3. يميز بين التمرين الحر والتمرين بالأدوات.\n\nالحصة 2:\n1. يؤدي تمرينات فردية بالكرة الطبية للجذع والرجلين.\n2. يميز أنواع التمرينات بالكرة الطبية حسب الجزء العامل.\n3. يقدر أهمية التمرينات بالأدوات في المحافظة على اللياقة البدنية.\n\nالحصة 3:\n1. يتعرف التمرينات الزوجية بالكرات الطبية.\n2. يؤدي تمرينات زوجية بالكرة الطبية بالتوافق مع الزميل.\n3. يشارك زميله الأداء بأمان وتعاون.\n\nالحصة 4:\n1. يؤدي التمرينات الفردية والزوجية بالكرات الطبية في محطات.\n2. يوظف الكرة الطبية في ألعاب ومنافسات بأمان.\n3. يميز نوع التمرين (فردي، زوجي) والجزء العامل من الصورة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة\n\nالحصة 3:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: بطاقات مصورة", "المفاهيم": "الحصة 1:\n- التمرين بالأدوات\n- الكرة الطبية\n- التمرينات الفردية بالأدوات\n- الذراعان\n\nالحصة 2:\n- الكرة الطبية\n- الجذع\n- الرجلان\n- اللياقة البدنية\n\nالحصة 3:\n- التمرينات الزوجية بالأدوات\n- التوافق\n- الزميل\n- الدفع بالقدم\n\nالحصة 4:\n- الكرة الطبية\n- المحطات\n- الرمي\n- الجري بالكرة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم كرة طبية وكرة عادية ويسأل: ما الفرق بينهما؟ ولماذا نستخدم الكرة الثقيلة في التمرين؟\n\nالحصة 2:\nيراجع المعلم تمرينات الذراعين بالكرة، ثم يسأل: هل نستطيع تمرين الرجلين بالكرة الطبية؟ وكيف؟\n\nالحصة 3:\nيؤدي المعلم مع تلميذ تمرين (وقوف مواجه. الكرة أمام القدمين) تبادل دفع الكرة بالقدم ويسأل: ما الجديد في هذا التمرين؟\n\nالحصة 4:\nيراجع المعلم أنواع التمرينات بالكرة بالبطاقات ويسأل: ما نوع التمرين؟ وما الجزء العامل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، تحريك الذراعين والكتفين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 43-44: (وقوف. الكرة أمامًا) رفع الكرة عاليًا وخفضها، (وقوف فتحًا. الكرة عاليًا) ثني الجذع جانبًا، (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا، بالعد مع التفكير بصوت عالٍ عن مسك الكرة بأمان، ويقلد التلميذ بالعد ويمسك الكرة بأمان (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ التمرين نفسه بكرة عادية ثم بالكرة الطبية ويكتشف الفرق في جهد الذراعين، ويستنتج فائدة الأدوات في زيادة قوة العضلات، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الكرة الثقيلة): في دائرة، تمرير الكرة الطبية من فوق الرأس من تلميذ لآخر بالعد، والمجموعة الأسرع دون سقوط تفوز، ويلعب التلميذ ويمرر بأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة الذراعين والكتفين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم بالكرة الطبية الخفيفة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 45-46: (جلوس طويل. الكرة أمامًا) لف الجذع بالكرة، (رقود. الكرة بين القدمين) رفع الرجلين، (وقوف. الكرة بين القدمين) الوثب مع الكرة، (جلوس القرفصاء. الكرة أمامًا) الوقوف مع رفع الكرة، بالعد، ويقلد التلميذ بالعد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات بأربع مجموعات: محطة الجذع (لف الجذع بالكرة)، محطة الرجلين (رفع الرجلين بالكرة)، محطة الوثب بالكرة بين القدمين، محطة الذراعين (مراجعة)، مع تبديل وتسجيل القائد، ويؤدي التلميذ تمرين المحطة ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أين الجزء؟): يرفع المعلم بطاقة تمرين بالكرة ويؤديه التلاميذ ويذكرون الجزء العامل، ويستجيب التلميذ ويذكر الجزء (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم في أزواج، ويقلد التلميذ مع زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ نماذج ص 47-48: (وقوف مواجه. مسك الكرة باليدين) تبادل دفع الكرة بالقدمين، (جلوس القرفصاء مواجه. الكرة بين القدمين) تبادل دفع الكرة، (جلوس طويل مواجه) تمرير الكرة من فوق الرأس، (وقوف ظهرًا لظهر) تمرير الكرة بلف الجذع، مع العد المشترك، ويؤدي التلميذ مع زميله بالتوافق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار (قائد يعد، وزميل يبدأ) تؤدي كل ثنائية البطاقات الأربع ثم تبتكر تمرينًا زوجيًا جديدًا بالكرة، والتلاميذ يتعاون ويبتكر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المرآة بالكرة): يؤدي أحد الزوجين تمرينًا بالكرة ويقلده الآخر، ويلعب التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة زوجية، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 و4 ص 49-50: أربع محطات: رمي الكرة عاليًا والتقاطها، الجري بالكرة بين الأقماع، تمرينات زوجية بالكرة، تمرينات فردية للجذع، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 (ألعاب) ص 51: من فوق الرأس في القطار، والمجموعة الأسرع دون سقوط تفوز، ويتسابق التلميذ ويمرر بأمان (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا سقطت الكرة في بعض القطارات؟ ليستنتج التلاميذ أهمية المسك الجيد والتوافق، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الكرة الطبية؟\nالإجابة: كرة ثقيلة نستخدمها أداة في التمرينات.\nس2 (مستوى التطبيق): أدِّ تمرين رفع الكرة عاليًا بالعد.\nالإجابة: يرفع الكرة ويخفضها بالعد.\nس3 (مستوى الاستدلال): لماذا تزيد الكرة الطبية من قوة الذراعين؟\nالإجابة: لأن حملها يحتاج إلى جهد أكبر من العضلات.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر تمرينًا بالكرة الطبية للجذع.\nالإجابة: لف الجذع بالكرة من الجلوس الطويل.\nس2 (مستوى التطبيق): أين نضع الكرة في تمرين رفع الرجلين؟\nالإجابة: بين القدمين.\nس3 (مستوى الاستدلال): ما الجزء العامل في الوثب بالكرة بين القدمين؟\nالإجابة: الرجلان.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر تمرينًا زوجيًا بالكرة الطبية.\nالإجابة: تبادل دفع الكرة بالقدم من الوقوف مواجهًا للزميل.\nس2 (مستوى التطبيق): ماذا نراعي في التمرين الزوجي بالكرة؟\nالإجابة: العد معًا والدفع بلطف والمسك الجيد.\nس3 (مستوى الاستدلال): كيف نمرر الكرة ظهرًا لظهر؟\nالإجابة: بلف الجذع للجانب.\n\nالحصة 4:\nس1 (مستوى المعرفة): في أي محطة جرينا بالكرة؟\nالإجابة: محطة الجري بين الأقماع.\nس2 (مستوى التطبيق): كيف مررنا الكرة في التتابع؟\nالإجابة: بين الرجلين ثم من فوق الرأس.\nس3 (مستوى الاستدلال): لماذا نمسك الكرة الطبية بإحكام؟\nالإجابة: حتى لا تسقط على القدمين أو الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ كرة طبية خفيفة الوزن، ويؤديان معًا تمرين رفع الكرة عاليًا وخفضها ببطء بالعد حتى 4، ثم يسأله: ما الفرق بين التمرين الحر والتمرين بالأدوات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين بالكرة الطبية للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه وتفسير زيادة القوة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ما الفرق بين التمرين الحر والتمرين بالأدوات؟\nالإجابة: الحر بلا أدوات، وبالأدوات نستخدم كرة أو حبلًا أو عصا.\nس2 (مستوى التطبيق): اذكر تمرينًا بالكرة الطبية للذراعين.\nالإجابة: مد الذراعين عاليًا بالكرة من خلف الرأس.\nس3 (مستوى الاستدلال): كيف نمسك الكرة الطبية بأمان؟\nالإجابة: باليدين معًا وبإحكام وعدم رميها على الزملاء.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ تمرين رفع الرجلين بالكرة بين القدمين 5 مرات.\nالإجابة: يؤديه من الرقود.\nس2 (مستوى التطبيق): صنّف هذا التمرين: (وقوف. الكرة خلف الرأس) مد الذراعين عاليًا.\nالإجابة: تمرين للذراعين.\nس3 (مستوى الاستدلال): لماذا تحافظ التمرينات بالأدوات على لياقتنا؟\nالإجابة: لأنها تقوي العضلات بجهد أكبر وتنوع التدريب.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ مع زميلك تمرير الكرة من فوق الرأس 5 مرات.\nالإجابة: يؤديانه من الجلوس الطويل المواجه.\nس2 (مستوى التطبيق): ما التمرين الزوجي الذي ابتكرتماه؟\nالإجابة: يذكر التمرين.\nس3 (مستوى الاستدلال): ماذا يحدث لو دفع زميلك الكرة بقوة كبيرة؟\nالإجابة: قد تؤذي الزميل، فندفعها بلطف وتوافق.\n\nالحصة 4:\nس1 (مستوى المعرفة): أرفع صورة تمرين بالكرة، ما نوعه وما الجزء العامل؟\nالإجابة: يذكر فردي/زوجي والجزء.\nس2 (مستوى التطبيق): أدِّ مع مجموعتك تمرير الكرة من فوق الرأس في القطار.\nالإجابة: يمرر بتوافق.\nس3 (مستوى الاستدلال): ما أهم قاعدة سلامة مع الكرة الطبية؟\nالإجابة: عدم رميها على الزملاء والمسك بإحكام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل في المنزل لتمرينين للذراعين (دليل المعلم ص 43-44).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع وآخر للرجلين بكرة خفيفة (دليل المعلم ص 45-46).\n\nالحصة 3:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بتمرير كرة من فوق الرأس من الجلوس (دليل المعلم ص 47-48).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طفلك تمرير كرة ثقيلة قليلًا في قطار الأسرة من فوق الرأس وبين الرجلين (دليل المعلم ص 49-51).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=3"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 18-23", "n": 2, "periods": [{"focus": "الممارسات الصحية: الإحماء والتهدئة ووقاية العضلات والمفاصل", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده.\n2. يميز تمرينات الإحماء من تمرينات التهدئة ويعلل.\n3. يقود إحماءً بسيطًا لزملائه.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: مراتب", "المفاهيم": "- الإحماء\n- التهدئة\n- الإصابة\n- المفاصل", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يحدث لو جرينا بسرعة قصوى من أول ثانية؟ ويعرض صورة لاعب يحمي عضلاته بالإحماء.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. يؤدي المعلم نموذج إحماء متدرج (مشي، جري خفيف، تحريك المفاصل من الرقبة إلى الكاحلين، إطالة خفيفة) مع التفكير بصوت عالٍ، ويقلد التلميذ ويكرر السبب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يقارن التلاميذ النبض والدفء قبل الإحماء وبعده ويستنتجون دوره في الوقاية من الإصابة (برنامج صحتي ص 23)، ويلاحظ التلميذ ويستنتج (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بأربع حركات ثم يتبادلون، ويقود التلميذ ويؤدي (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تصنف كل مجموعة بطاقات التمرينات إلى إحماء وتهدئة وتعلل، ويصنف التلميذ ويعلل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نموذج التهدئة ونصيحة اليوم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا يحمي الإحماء العضلات؟\nالإجابة: لأنه يرفع حرارتها ويجعلها مرنة فلا تصاب.\nس2 (مستوى التطبيق): بماذا نبدأ الإحماء؟\nالإجابة: بالمشي والجري الخفيف.\nس3 (مستوى الاستدلال): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء في البداية لتسخين الجسم، والتهدئة في النهاية لإراحته.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً من المشي ثم الجري الخفيف ثم تمرين مرونة، ثم تهدئة بالمشي البطيء والتنفس العميق، ثم يسأله: بماذا نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إحماء بسيط لمجموعتهم وتهدئة في نهاية النشاط، وتعليل ترتيب الحركات فيهما.", "التقويم الختامي": "س1 (مستوى المعرفة): قُد إحماءً لزملائك بأربع حركات.\nالإجابة: يؤديه متدرجًا.\nس2 (مستوى التطبيق): صنّف: الإطالة البطيئة والتنفس العميق.\nالإجابة: تهدئة.\nس3 (مستوى الاستدلال): زميلك يريد الجري بأقصى سرعة فورًا، بماذا تنصحه؟\nالإجابة: أن يحمي عضلاته بالإحماء أولًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب والتهدئة بعده (برنامج صحتي، دليل المعلم ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=4"}}, {"focus": "المهرجان الرياضي التعليمي للتمرينات (الأوضاع المشتقة، التمرينات بالأدوات)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الأوضاع المشتقة والتمرينات بالكرات الطبية ضمن أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء محافظات مع قائد ويعرض الأقسام (ص 18-20، 59).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء جماعي بنموذج المعلم، ويؤدي التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم): قسم الأوضاع المشتقة من الجلوس والرقود (أداء الوضع من البطاقة وتمرين منه)، قسم التمرينات الفردية بالكرات الطبية، قسم التمرينات الزوجية بالكرات، قسم جمباز الموانع المبسط (وثب فوق الحبال ومروق أسفل الحاجز)، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته (26 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ختامية: تتابع تمرير الكرة الطبية، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الزوجية بالكرات.\nس2 (مستوى التطبيق): اذكر وضعًا مشتقًا أديته في قسم الأوضاع.\nالإجابة: مثل: جلوس طويل فتحًا.\nس3 (مستوى الاستدلال): لماذا نسجل نقاط النظام والتعاون؟\nالإجابة: لأنهما من أهداف المهرجان.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً من المشي ثم الجري الخفيف ثم تمرين مرونة، ثم تهدئة بالمشي البطيء والتنفس العميق، ثم يسأله: بماذا نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إحماء بسيط لمجموعتهم وتهدئة في نهاية النشاط، وتعليل ترتيب الحركات فيهما.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الفردية بالكرات، التمرينات الزوجية، جمباز الموانع.\nس2 (مستوى التطبيق): ما دورك في مجموعتك؟\nالإجابة: يذكر دوره.\nس3 (مستوى الاستدلال): كيف تعبر عن روحك الرياضية عند الخسارة؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين بالكرة يوميًا (دليل المعلم ص 42-52).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده.\n2. يميز تمرينات الإحماء من تمرينات التهدئة ويعلل.\n3. يقود إحماءً بسيطًا لزملائه.\n\nالحصة 2:\n1. يؤدي الأوضاع المشتقة والتمرينات بالكرات الطبية ضمن أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: كرات طبية خفيفة\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الإحماء\n- التهدئة\n- الإصابة\n- المفاصل\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا يحدث لو جرينا بسرعة قصوى من أول ثانية؟ ويعرض صورة لاعب يحمي عضلاته بالإحماء.\n\nالحصة 2:\nيعلن المعلم مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء محافظات مع قائد ويعرض الأقسام (ص 18-20، 59).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. يؤدي المعلم نموذج إحماء متدرج (مشي، جري خفيف، تحريك المفاصل من الرقبة إلى الكاحلين، إطالة خفيفة) مع التفكير بصوت عالٍ، ويقلد التلميذ ويكرر السبب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يقارن التلاميذ النبض والدفء قبل الإحماء وبعده ويستنتجون دوره في الوقاية من الإصابة (برنامج صحتي ص 23)، ويلاحظ التلميذ ويستنتج (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بأربع حركات ثم يتبادلون، ويقود التلميذ ويؤدي (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تصنف كل مجموعة بطاقات التمرينات إلى إحماء وتهدئة وتعلل، ويصنف التلميذ ويعلل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نموذج التهدئة ونصيحة اليوم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء جماعي بنموذج المعلم، ويؤدي التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم): قسم الأوضاع المشتقة من الجلوس والرقود (أداء الوضع من البطاقة وتمرين منه)، قسم التمرينات الفردية بالكرات الطبية، قسم التمرينات الزوجية بالكرات، قسم جمباز الموانع المبسط (وثب فوق الحبال ومروق أسفل الحاجز)، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته (26 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ختامية: تتابع تمرير الكرة الطبية، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): لماذا يحمي الإحماء العضلات؟\nالإجابة: لأنه يرفع حرارتها ويجعلها مرنة فلا تصاب.\nس2 (مستوى التطبيق): بماذا نبدأ الإحماء؟\nالإجابة: بالمشي والجري الخفيف.\nس3 (مستوى الاستدلال): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء في البداية لتسخين الجسم، والتهدئة في النهاية لإراحته.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الزوجية بالكرات.\nس2 (مستوى التطبيق): اذكر وضعًا مشتقًا أديته في قسم الأوضاع.\nالإجابة: مثل: جلوس طويل فتحًا.\nس3 (مستوى الاستدلال): لماذا نسجل نقاط النظام والتعاون؟\nالإجابة: لأنهما من أهداف المهرجان.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً من المشي ثم الجري الخفيف ثم تمرين مرونة، ثم تهدئة بالمشي البطيء والتنفس العميق، ثم يسأله: بماذا نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إحماء بسيط لمجموعتهم وتهدئة في نهاية النشاط، وتعليل ترتيب الحركات فيهما.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): قُد إحماءً لزملائك بأربع حركات.\nالإجابة: يؤديه متدرجًا.\nس2 (مستوى التطبيق): صنّف: الإطالة البطيئة والتنفس العميق.\nالإجابة: تهدئة.\nس3 (مستوى الاستدلال): زميلك يريد الجري بأقصى سرعة فورًا، بماذا تنصحه؟\nالإجابة: أن يحمي عضلاته بالإحماء أولًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الفردية بالكرات، التمرينات الزوجية، جمباز الموانع.\nس2 (مستوى التطبيق): ما دورك في مجموعتك؟\nالإجابة: يذكر دوره.\nس3 (مستوى الاستدلال): كيف تعبر عن روحك الرياضية عند الخسارة؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب والتهدئة بعده (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين بالكرة يوميًا (دليل المعلم ص 42-52).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=4"}}, {"title": "تمرينات الموانع (جمباز الموانع)", "unit": "التمرينات (أتمرن بنظام)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 53-60", "n": 2, "periods": [{"focus": "التعرف إلى الموانع وطرق تخطيها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع والأدوات المستخدمة كموانع.\n2. يؤدي حركات تخطي الموانع (الوثب فوق الحاجز، المروق أسفل الحبل، المشي على المقعد).\n3. يختار الحركة المناسبة لتخطي كل مانع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- تمرينات الموانع\n- المانع\n- الوثب\n- المروق\n- المشي على المقعد", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الأدوات ويسأل: كيف نتخطى الحاجز؟ وكيف نمر من تحت الحبل؟ ويعرض صور جمباز الموانع (ص 53-54).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، وثب، مروق، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل مانع (ص 55-56): الوثب بالقدمين فوق الحاجز، المروق أسفل الحبل المثبت، المشي على المقعد السويدي، المروق داخل قطعة الصندوق المقسم، الوثب بالحبل 5 م، مع نقاط الأمان، ويقلد كل حركة بعد النموذج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ طريقتين لتخطي المانع نفسه (مثلًا الوثب فوق الصندوق أم المروق داخله) ويكتشف الأنسب والأسرع والأكثر أمانًا، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في مجموعات، تؤدي كل مجموعة مسار موانع قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الحركة الصحيحة، ويؤدي التلميذ المسار بالتتابع (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما المانع؟\nالإجابة: أداة أو جهاز نتخطاه بحركة مثل الوثب أو المروق.\nس2 (مستوى التطبيق): كيف نتخطى الحبل المثبت المنخفض؟\nالإجابة: بالمروق أسفله أو الوثب فوقه حسب ارتفاعه.\nس3 (مستوى الاستدلال): ما الحركة المناسبة للمقعد السويدي؟\nالإجابة: المشي عليه بتوازن.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (المروق أسفل الحبل، ثم المشي على المقعد السويدي بتوازن)، ثم يطلب منه اجتياز المانعين وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باجتياز مسار موانع متكامل (حاجز، وحبل، ومقعد سويدي) بحركات متنوعة، واقتراح طريقة جديدة آمنة لتخطي أحد الموانع.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر ثلاث أدوات تستخدم موانع.\nالإجابة: الحاجز، الحبل، المقعد السويدي (أو الصندوق المقسم).\nس2 (مستوى التطبيق): أدِّ المروق داخل قطعة الصندوق المقسم.\nالإجابة: يؤديه دون لمس الأطراف.\nس3 (مستوى الاستدلال): لماذا اخترت الوثب فوق الحاجز لا المروق؟\nالإجابة: لأن الحاجز منخفض والوثب أسرع وأسهل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا (وسادة للوثب، كرسي للمروق تحته) ومارساه بأمان (دليل المعلم ص 55-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=5"}}, {"focus": "مسارات ومنافسات تمرينات الموانع", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي مسار موانع متكاملًا بحركات متنوعة.\n2. يوظف الحركات والمهارات (جري، وثب، مروق، توازن) في منافسات الموانع.\n3. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم حركات الموانع بنموذج تلميذ ويعرض مسار اليوم: جري متعرج، وثب فوق حاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة على المرتبة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 2 و3 ص 57-58: مجموعات بقائد تؤدي المسار بالتتابع مرتين، ويلاحظ القائد الأداء الصحيح ويصححه، ويؤدي التلميذ المسار ويصحح زملاءه (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة الموانع ص 59: تتابع بين المجموعات في المسار، وتحسب النقاط للأداء الصحيح والسرعة، ويتسابق التلميذ بأمان (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: ما الحركة التي أخذت وقتًا أطول؟ ولماذا؟ ليستنتج التلاميذ أن التوازن على المقعد يحتاج إلى هدوء، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور بالثقة، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: جري متعرج، وثب فوق الحاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة.\nس2 (مستوى التطبيق): ما الحركة التي نؤديها على المرتبة في نهاية المسار؟\nالإجابة: الدحرجة.\nس3 (مستوى الاستدلال): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (المروق أسفل الحبل، ثم المشي على المقعد السويدي بتوازن)، ثم يطلب منه اجتياز المانعين وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باجتياز مسار موانع متكامل (حاجز، وحبل، ومقعد سويدي) بحركات متنوعة، واقتراح طريقة جديدة آمنة لتخطي أحد الموانع.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ مسار الموانع كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (مستوى التطبيق): كيف شعرت عندما تخطيت الموانع كلها؟\nالإجابة: يعبر عن الثقة.\nس3 (مستوى الاستدلال): اقترح مانعًا جديدًا للمسار والحركة المناسبة له.\nالإجابة: مثل: أطواق على الأرض والحجل داخلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ممارسة مسار الموانع في مكان آمن وتسجيل زمنه (دليل المعلم ص 57-59).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع والأدوات المستخدمة كموانع.\n2. يؤدي حركات تخطي الموانع (الوثب فوق الحاجز، المروق أسفل الحبل، المشي على المقعد).\n3. يختار الحركة المناسبة لتخطي كل مانع.\n\nالحصة 2:\n1. يؤدي مسار موانع متكاملًا بحركات متنوعة.\n2. يوظف الحركات والمهارات (جري، وثب، مروق، توازن) في منافسات الموانع.\n3. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- تمرينات الموانع\n- المانع\n- الوثب\n- المروق\n- المشي على المقعد\n\nالحصة 2:\n- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم الأدوات ويسأل: كيف نتخطى الحاجز؟ وكيف نمر من تحت الحبل؟ ويعرض صور جمباز الموانع (ص 53-54).\n\nالحصة 2:\nيراجع المعلم حركات الموانع بنموذج تلميذ ويعرض مسار اليوم: جري متعرج، وثب فوق حاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة على المرتبة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، وثب، مروق، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل مانع (ص 55-56): الوثب بالقدمين فوق الحاجز، المروق أسفل الحبل المثبت، المشي على المقعد السويدي، المروق داخل قطعة الصندوق المقسم، الوثب بالحبل 5 م، مع نقاط الأمان، ويقلد كل حركة بعد النموذج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ طريقتين لتخطي المانع نفسه (مثلًا الوثب فوق الصندوق أم المروق داخله) ويكتشف الأنسب والأسرع والأكثر أمانًا، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في مجموعات، تؤدي كل مجموعة مسار موانع قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الحركة الصحيحة، ويؤدي التلميذ المسار بالتتابع (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 2 و3 ص 57-58: مجموعات بقائد تؤدي المسار بالتتابع مرتين، ويلاحظ القائد الأداء الصحيح ويصححه، ويؤدي التلميذ المسار ويصحح زملاءه (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة الموانع ص 59: تتابع بين المجموعات في المسار، وتحسب النقاط للأداء الصحيح والسرعة، ويتسابق التلميذ بأمان (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: ما الحركة التي أخذت وقتًا أطول؟ ولماذا؟ ليستنتج التلاميذ أن التوازن على المقعد يحتاج إلى هدوء، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور بالثقة، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما المانع؟\nالإجابة: أداة أو جهاز نتخطاه بحركة مثل الوثب أو المروق.\nس2 (مستوى التطبيق): كيف نتخطى الحبل المثبت المنخفض؟\nالإجابة: بالمروق أسفله أو الوثب فوقه حسب ارتفاعه.\nس3 (مستوى الاستدلال): ما الحركة المناسبة للمقعد السويدي؟\nالإجابة: المشي عليه بتوازن.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: جري متعرج، وثب فوق الحاجزين، مروق أسفل الحبل، مشي على المقعد، دحرجة.\nس2 (مستوى التطبيق): ما الحركة التي نؤديها على المرتبة في نهاية المسار؟\nالإجابة: الدحرجة.\nس3 (مستوى الاستدلال): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (المروق أسفل الحبل، ثم المشي على المقعد السويدي بتوازن)، ثم يطلب منه اجتياز المانعين وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باجتياز مسار موانع متكامل (حاجز، وحبل، ومقعد سويدي) بحركات متنوعة، واقتراح طريقة جديدة آمنة لتخطي أحد الموانع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر ثلاث أدوات تستخدم موانع.\nالإجابة: الحاجز، الحبل، المقعد السويدي (أو الصندوق المقسم).\nس2 (مستوى التطبيق): أدِّ المروق داخل قطعة الصندوق المقسم.\nالإجابة: يؤديه دون لمس الأطراف.\nس3 (مستوى الاستدلال): لماذا اخترت الوثب فوق الحاجز لا المروق؟\nالإجابة: لأن الحاجز منخفض والوثب أسرع وأسهل.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ مسار الموانع كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (مستوى التطبيق): كيف شعرت عندما تخطيت الموانع كلها؟\nالإجابة: يعبر عن الثقة.\nس3 (مستوى الاستدلال): اقترح مانعًا جديدًا للمسار والحركة المناسبة له.\nالإجابة: مثل: أطواق على الأرض والحجل داخلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا (وسادة للوثب، كرسي للمروق تحته) ومارساه بأمان (دليل المعلم ص 55-56).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على ممارسة مسار الموانع في مكان آمن وتسجيل زمنه (دليل المعلم ص 57-59).\n🎮 رابط ألعاب ونشاط ة: المحافظة على ثبات الجسم في وضع معين دون حركة.\nس2 (مستوى التطبيق): أين تكون الذراعان لمساعدتنا على الاتزان؟\nالإجابة: جانبًا.\nس3 (مستوى الاستدلال): لماذا نهتز عند إغماض العينين؟\nالإجابة: لأن النظر لنقطة ثابتة يساعد على الاتزان.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على قدم واحدة والذراعان جانبًا والنظر إلى نقطة ثابتة، مع الاستناد إلى الحائط أولًا ثم دونه، ثم يسأله: أين تكون الذراعان لتساعدانا على الاتزان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء الميزان الأمامي ثم المشي على خط بتوازن حاملين كيس حبوب على الرأس، والمقارنة بين الاتزان الثابت والاتزان الحركي.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الميزان الأمامي 5 ثوانٍ.\nالإجابة: يؤديه والرجل الحرة ممدودة للخلف والذراعان جانبًا.\nس2 (مستوى التطبيق): اذكر عاملين يساعدان على الاتزان.\nالإجابة: فتح الذراعين جانبًا، والنظر لنقطة ثابتة.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز على نقطة واحدة ونقطتين؟\nالإجابة: الارتكاز على نقطتين (القدمين) أثبت وأسهل من نقطة واحدة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الوقوف على قدم واحدة 10 ثوانٍ لكل قدم (دليل المعلم ص 65-68).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=6"}}, {"focus": "الاتزان الحركي (الوثب لأعلى والدوران والهبوط، الاتزان على المقعد السويدي)", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز بين الاتزان الثابت والاتزان الحركي.\n2. يؤدي الوثب لأعلى والدوران نصف دورة والهبوط بثبات من مستوى عالٍ.\n3. يوظف حركات الاتزان في المسابقات والألعاب.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: بالونات\n- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع", "المفاهيم": "- الاتزان الحركي\n- الدوران\n- الهبوط\n- المقعد السويدي", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الاتزان الثابت، ثم يمشي على المقعد السويدي ويسأل: هل هذا اتزان ثابت؟ وما الفرق؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج (ص 67): الوقوف على المقعد، أرجحة الذراعين وثني الركبتين، الوثب لأعلى بالقدمين مع دوران ربع ثم نصف دورة والمحافظة على استقامة الجسم، والهبوط بالقدمين على المرتبة والثبات؛ ثم المشي على المقعد مع حمل بالون، ويقلد التلميذ بالتدرج (ربع ثم نصف دورة) (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الاتزان) ص 70: محطة الدائرة (أوضاع اتزان ثابت)، محطة الصفين (الوقوف على قدم مع تمرير البالون)، محطة القطارين (المشي بين الأقماع المنخفضة والهبوط على المرتبة)، محطة الأدوات المتنوعة (الوقوف على قدم ولمس أدوات بارتفاعات مختلفة)، مع التبديل، ويؤدي التلميذ مهمة المحطة ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أي مجموعة تمشي على المقعد وتهبط بثبات دون سقوط أكبر عدد من المرات، ويتسابق التلميذ (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الفرق بين الاتزان الثابت والحركي؟\nالإجابة: الثابت دون حركة، والحركي أثناء أداء حركة كالمشي على المقعد أو الهبوط.\nس2 (مستوى التطبيق): كيف نهبط بثبات بعد الوثب والدوران؟\nالإجابة: بالقدمين معًا وثني الركبتين والذراعان جانبًا.\nس3 (مستوى الاستدلال): اذكر لعبة أو مسابقة فيها اتزان حركي.\nالإجابة: الجمباز أو المشي على العارضة.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على قدم واحدة والذراعان جانبًا والنظر إلى نقطة ثابتة، مع الاستناد إلى الحائط أولًا ثم دونه، ثم يسأله: أين تكون الذراعان لتساعدانا على الاتزان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء الميزان الأمامي ثم المشي على خط بتوازن حاملين كيس حبوب على الرأس، والمقارنة بين الاتزان الثابت والاتزان الحركي.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الوثب من المقعد مع نصف دورة والهبوط بثبات.\nالإجابة: يؤديه ويثبت بعد الهبوط.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الاتزان.\nالإجابة: محطة البالون ومحطة الأدوات المتنوعة.\nس3 (مستوى الاستدلال): لماذا يصعب الاتزان على المقعد مع حمل البالون؟\nالإجابة: لأن حمل الشيء يغير مركز ثقل الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على المشي على خط مرسوم مع حمل كتاب على الرأس (دليل المعلم ص 67-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الاتزان الثابت ومواقفه.\n2. يؤدي الميزان الأمامي والارتكاز على قدم واحدة مع الثبات.\n3. يحدد العوامل التي تساعد على الاتزان (الذراعان جانبًا، النظر لنقطة ثابتة).\n\nالحصة 2:\n1. يميز بين الاتزان الثابت والاتزان الحركي.\n2. يؤدي الوثب لأعلى والدوران نصف دورة والهبوط بثبات من مستوى عالٍ.\n3. يوظف حركات الاتزان في المسابقات والألعاب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: قطع إسفنجية\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بالونات\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n- أخرى: بالونات\n- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الاتزان الثابت\n- مركز الثقل\n- الميزان الأمامي\n- قاعدة الارتكاز\n\nالحصة 2:\n- الاتزان الحركي\n- الدوران\n- الهبوط\n- المقعد السويدي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف المعلم على قدم واحدة ويسأل: لماذا لا أسقط؟ ثم يضم ذراعيه ويغمض عينيه ويسأل: لماذا اهتز جسمي؟\n\nالحصة 2:\nيراجع المعلم الاتزان الثابت، ثم يمشي على المقعد السويدي ويسأل: هل هذا اتزان ثابت؟ وما الفرق؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري ثم الوقوف على قدم واحدة بالتبادل، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج (ص 65-66): الوقوف على قدم واحدة والذراعان جانبًا، ثم الميزان الأمامي (الرجل الحرة ممدودة للخلف وميل الجذع للأمام ولمس القطعة الإسفنجية بالرأس) مع التفكير بصوت عالٍ عن النظر لنقطة ثابتة، ويقلد التلميذ ويثبت 5 ثوانٍ (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ الثبات على قدم والذراعان جانبًا ثم مضمومتان، وبعينين مفتوحتين ثم مغمضتين، ويكتشف ما يساعد على الاتزان، ويجرب التلميذ ويستنتج العوامل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 1 (الاتزان الثابت) ص 68: جري في المكان داخل الأطواق وعند النداء يثبت التلميذ في وضع الاتزان المطلوب، ومن يثبت أطول يفوز، ويلعب التلميذ ويثبت (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج (ص 67): الوقوف على المقعد، أرجحة الذراعين وثني الركبتين، الوثب لأعلى بالقدمين مع دوران ربع ثم نصف دورة والمحافظة على استقامة الجسم، والهبوط بالقدمين على المرتبة والثبات؛ ثم المشي على المقعد مع حمل بالون، ويقلد التلميذ بالتدرج (ربع ثم نصف دورة) (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الاتزان) ص 70: محطة الدائرة (أوضاع اتزان ثابت)، محطة الصفين (الوقوف على قدم مع تمرير البالون)، محطة القطارين (المشي بين الأقماع المنخفضة والهبوط على المرتبة)، محطة الأدوات المتنوعة (الوقوف على قدم ولمس أدوات بارتفاعات مختلفة)، مع التبديل، ويؤدي التلميذ مهمة المحطة ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أي مجموعة تمشي على المقعد وتهبط بثبات دون سقوط أكبر عدد من المرات، ويتسابق التلميذ (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الاتزان الثابت؟\nالإجابة: المحافظة على ثبات الجسم في وضع معين دون حركة.\nس2 (مستوى التطبيق): أين تكون الذراعان لمساعدتنا على الاتزان؟\nالإجابة: جانبًا.\nس3 (مستوى الاستدلال): لماذا نهتز عند إغماض العينين؟\nالإجابة: لأن النظر لنقطة ثابتة يساعد على الاتزان.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الفرق بين الاتزان الثابت والحركي؟\nالإجابة: الثابت دون حركة، والحركي أثناء أداء حركة كالمشي على المقعد أو الهبوط.\nس2 (مستوى التطبيق): كيف نهبط بثبات بعد الوثب والدوران؟\nالإجابة: بالقدمين معًا وثني الركبتين والذراعان جانبًا.\nس3 (مستوى الاستدلال): اذكر لعبة أو مسابقة فيها اتزان حركي.\nالإجابة: الجمباز أو المشي على العارضة.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على قدم واحدة والذراعان جانبًا والنظر إلى نقطة ثابتة، مع الاستناد إلى الحائط أولًا ثم دونه، ثم يسأله: أين تكون الذراعان لتساعدانا على الاتزان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء الميزان الأمامي ثم المشي على خط بتوازن حاملين كيس حبوب على الرأس، والمقارنة بين الاتزان الثابت والاتزان الحركي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الميزان الأمامي 5 ثوانٍ.\nالإجابة: يؤديه والرجل الحرة ممدودة للخلف والذراعان جانبًا.\nس2 (مستوى التطبيق): اذكر عاملين يساعدان على الاتزان.\nالإجابة: فتح الذراعين جانبًا، والنظر لنقطة ثابتة.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز على نقطة واحدة ونقطتين؟\nالإجابة: الارتكاز على نقطتين (القدمين) أثبت وأسهل من نقطة واحدة.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الوثب من المقعد مع نصف دورة والهبوط بثبات.\nالإجابة: يؤديه ويثبت بعد الهبوط.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الاتزان.\nالإجابة: محطة البالون ومحطة الأدوات المتنوعة.\nس3 (مستوى الاستدلال): لماذا يصعب الاتزان على المقعد مع حمل البالون؟\nالإجابة: لأن حمل الشيء يغير مركز ثقل الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الوقوف على قدم واحدة 10 ثوانٍ لكل قدم (دليل المعلم ص 65-68).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طفلك على المشي على خط مرسوم مع حمل كتاب على الرأس (دليل المعلم ص 67-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=6"}}, {"title": "البراعة الحركية", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 74-81", "n": 2, "periods": [{"focus": "حركات البراعة الحركية الفردية (دوران الطاحونة، الوثب بتلامس القدمين، المشي المعكوس)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركات البراعة الحركية وأهميتها.\n2. يؤدي دوران الطاحونة والوثب بتلامس القدمين والمشي المعكوس.\n3. يحافظ على جمالية الأداء والاتزان أثناء الحركة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مربعات مرقمة\n- صورة توضيحية", "المفاهيم": "- البراعة الحركية\n- دوران الطاحونة\n- الوثب بتلامس القدمين\n- المشي المعكوس", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب جمباز يؤدي حركة مميزة ويسأل: ما الذي يجعل الحركة جميلة؟ ويقدم مصطلح البراعة الحركية (ص 74-75).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 75-76): الوثب بتلامس القدمين (وقوف فتحًا، وثب عاليًا مع تلامس القدمين وتباعدهما، الهبوط فتحًا)، دوران الطاحونة على المرتبة، المشي المعكوس (للخلف) مع النظر عبر الكتف؛ مع نقاط الأمان، ويقلد كل حركة بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (حركات التقليد والبراعة الفردية) ص 77: قطارات على خط البداية، يؤدي التلميذ الوثب بتلامس القدمين داخل الأطواق ثم دوران الطاحونة على المرتبة ثم المشي المعكوس لخط النهاية، ويسجل القائد الأداء الجميل، ويؤدي التلميذ المسار ويسجل القائد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الحكم الصغير): يؤدي تلميذ حركة براعة ويقيّمها زملاؤه بالتصفيق (1-3) حسب الجمال والثبات، ويؤدي التلميذ ويقيّم (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما البراعة الحركية؟\nالإجابة: أداء الحركات بمهارة وجمال وثبات.\nس2 (مستوى التطبيق): كيف نؤدي الوثب بتلامس القدمين؟\nالإجابة: نثب عاليًا من الوقوف فتحًا ونلامس القدمين في الهواء ثم نهبط فتحًا.\nس3 (مستوى الاستدلال): ماذا نفعل بالرأس في المشي المعكوس؟\nالإجابة: ننظر عبر الكتف لنرى الطريق.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الوثب بتلامس القدمين بالتدرج: الوثب فتحًا وضمًا على الأرض أولًا ثم التلامس في الهواء، ثم يطلب منه أداءها مرة واحدة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: دوران الطاحونة ثم الوثب بتلامس القدمين ثم المشي المعكوس، مع زميل بتوافق ومحافظة على جمال الأداء.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ دوران الطاحونة على المرتبة.\nالإجابة: يؤديه بثبات.\nس2 (مستوى التطبيق): ما الذي يجعل الحركة أكثر جمالًا؟\nالإجابة: استقامة الجذع والرجلين والنظر للأمام والهبوط الهادئ.\nس3 (مستوى الاستدلال): اذكر ثلاث حركات براعة تعلمتها اليوم.\nالإجابة: الوثب بتلامس القدمين، دوران الطاحونة، المشي المعكوس.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على أداء المشي المعكوس في الممر بأمان والوثب بتلامس القدمين (دليل المعلم ص 75-77).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=7"}}, {"focus": "البراعة مع الزميل (دوران عقارب الساعة) وألعاب البراعة", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي حركات البراعة مع الزميل (دوران عقارب الساعة) بالتوافق.\n2. يشارك زملاءه أنشطة متنوعة للبراعة الحركية.\n3. يشعر بالثقة في النفس عند أدائه حركات البراعة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أكياس رمل\n- أخرى: مربعات مرقمة\n- أخرى: أقماع", "المفاهيم": "- البراعة مع الزميل\n- دوران عقارب الساعة\n- التوافق\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم حركات البراعة الفردية، ثم يعرض مع تلميذ دوران عقارب الساعة ويسأل: ما الذي يدور وما الذي يثبت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ النموذج (ص 76): تلميذان في وضع الانبطاح المائل متجاوران، استناد اليدين والأصابع مفرودة، تلاصق القدمين، التحرك باليدين في اتجاه عقارب الساعة مع ثبات القدمين كمحور، ثم تطبيق في أزواج، ويؤدي التلميذ مع زميله بالتوافق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 (البراعة مع الزميل) ص 78: ثنائيات تجري على محيط المستطيل وعند النداء تدخل كل ثنائية طوقًا وتؤدي حركة براعة مشتركة (دوران عقارب الساعة، وقوف على قدم متقابلين ومسك اليدين)، ويؤدي التلميذ مع زميله (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المربعات المرقمة): الوثب بتلامس القدمين إلى المربع الذي يناديه المعلم ثم حركة براعة فيه، ويلعب التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتعبير عن الثقة، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): في دوران عقارب الساعة، ما الذي يثبت وما الذي يتحرك؟\nالإجابة: تثبت القدمان كمحور وتتحرك اليدان.\nس2 (مستوى التطبيق): ما الوضع الذي نبدأ منه الحركة؟\nالإجابة: الانبطاح المائل.\nس3 (مستوى الاستدلال): لماذا نحتاج إلى التوافق مع الزميل؟\nالإجابة: حتى نتحرك بالسرعة نفسها ولا نسقط.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الوثب بتلامس القدمين بالتدرج: الوثب فتحًا وضمًا على الأرض أولًا ثم التلامس في الهواء، ثم يطلب منه أداءها مرة واحدة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: دوران الطاحونة ثم الوثب بتلامس القدمين ثم المشي المعكوس، مع زميل بتوافق ومحافظة على جمال الأداء.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ مع زميلك دوران عقارب الساعة نصف دورة.\nالإجابة: يؤديانه بتوافق.\nس2 (مستوى التطبيق): اذكر حركة براعة مشتركة أديتها في الطوق.\nالإجابة: مثل: الوقوف على قدم متقابلين مع مسك اليدين.\nس3 (مستوى الاستدلال): كيف شعرت عند أداء الحركات أمام زملائك؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك دوران عقارب الساعة من الانبطاح المائل على سجادة (دليل المعلم ص 76-80).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركات البراعة الحركية وأهميتها.\n2. يؤدي دوران الطاحونة والوثب بتلامس القدمين والمشي المعكوس.\n3. يحافظ على جمالية الأداء والاتزان أثناء الحركة.\n\nالحصة 2:\n1. يؤدي حركات البراعة مع الزميل (دوران عقارب الساعة) بال 5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ النموذج (ص 76): تلميذان في وضع الانبطاح المائل متجاوران، استناد اليدين والأصابع مفرودة، تلاصق القدمين، التحرك باليدين في اتجاه عقارب الساعة مع ثبات القدمين كمحور، ثم تطبيق في أزواج، ويؤدي التلميذ مع زميله بالتوافق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 (البراعة مع الزميل) ص 78: ثنائيات تجري على محيط المستطيل وعند النداء تدخل كل ثنائية طوقًا وتؤدي حركة براعة مشتركة (دوران عقارب الساعة، وقوف على قدم متقابلين ومسك اليدين)، ويؤدي التلميذ مع زميله (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المربعات المرقمة): الوثب بتلامس القدمين إلى المربع الذي يناديه المعلم ثم حركة براعة فيه، ويلعب التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتعبير عن الثقة، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما البراعة الحركية؟\nالإجابة: أداء الحركات بمهارة وجمال وثبات.\nس2 (مستوى التطبيق): كيف نؤدي الوثب بتلامس القدمين؟\nالإجابة: نثب عاليًا من الوقوف فتحًا ونلامس القدمين في الهواء ثم نهبط فتحًا.\nس3 (مستوى الاستدلال): ماذا نفعل بالرأس في المشي المعكوس؟\nالإجابة: ننظر عبر الكتف لنرى الطريق.\n\nالحصة 2:\nس1 (مستوى المعرفة): في دوران عقارب الساعة، ما الذي يثبت وما الذي يتحرك؟\nالإجابة: تثبت القدمان كمحور وتتحرك اليدان.\nس2 (مستوى التطبيق): ما الوضع الذي نبدأ منه الحركة؟\nالإجابة: الانبطاح المائل.\nس3 (مستوى الاستدلال): لماذا نحتاج إلى التوافق مع الزميل؟\nالإجابة: حتى نتحرك بالسرعة نفسها ولا نسقط.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الوثب بتلامس القدمين بالتدرج: الوثب فتحًا وضمًا على الأرض أولًا ثم التلامس في الهواء، ثم يطلب منه أداءها مرة واحدة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: دوران الطاحونة ثم الوثب بتلامس القدمين ثم المشي المعكوس، مع زميل بتوافق ومحافظة على جمال الأداء.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ دوران الطاحونة على المرتبة.\nالإجابة: يؤديه بثبات.\nس2 (مستوى التطبيق): ما الذي يجعل الحركة أكثر جمالًا؟\nالإجابة: استقامة الجذع والرجلين والنظر للأمام والهبوط الهادئ.\nس3 (مستوى الاستدلال): اذكر ثلاث حركات براعة تعلمتها اليوم.\nالإجابة: الوثب بتلامس القدمين، دوران الطاحونة، المشي المعكوس.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ مع زميلك دوران عقارب الساعة نصف دورة.\nالإجابة: يؤديانه بتوافق.\nس2 (مستوى التطبيق): اذكر حركة براعة مشتركة أديتها في الطوق.\nالإجابة: مثل: الوقوف على قدم متقابلين مع مسك اليدين.\nس3 (مستوى الاستدلال): كيف شعرت عند أداء الحركات أمام زملائك؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على أداء المشي المعكوس في الممر بأمان والوثب بتلامس القدمين (دليل المعلم ص 75-77).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك دوران عقارب الساعة من الانبطاح المائل على سجادة (دليل المعلم ص 76-80).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=7"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 18-23", "n": 2, "periods": [{"focus": "الممارسات الصحية: الوضع الصحيح للجسم عند حمل الأشياء ورفعها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الطريقة الصحيحة لرفع الأشياء من الأرض وحملها.\n2. يميز الرفع الصحيح (ثني الركبتين) من الخاطئ (ثني الظهر).\n3. يطبق الرفع والحمل الصحيح للأدوات الرياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: كرات طبية\n- أخرى: حقيبة\n- أخرى: بطاقات مصورة\n- أخرى: أقماع", "المفاهيم": "- القوام السليم\n- الرفع الصحيح\n- ثني الركبتين\n- حمل الأشياء", "التهيئة / التمهيد / التعلم القبلي": "يرفع المعلم كرة طبية بثني الظهر ثم بثني الركبتين ويسأل: أي الطريقتين تحمي الظهر؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرفع الصحيح: الاقتراب من الشيء، ثني الركبتين والظهر مستقيم، مسك الشيء وضمه للجسم، الوقوف بمد الركبتين، مع التفكير بصوت عالٍ عن حماية الظهر (برنامج صحتي ص 23)، ويقلد التلميذ الرفع الصحيح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ رفع كرة طبية خفيفة بالطريقتين ويكتشف أيهما أسهل وأين يشعر بالجهد، ويستنتج القاعدة، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (ناقل الأدوات): تتابع في نقل الأدوات (كرات، أقماع) من مكان لآخر بالرفع الصحيح فقط، ولا تحسب النقلة الخاطئة، ويلعب التلميذ ويرفع بالطريقة الصحيحة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الظهر، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ماذا نثني عند رفع شيء من الأرض؟\nالإجابة: الركبتين والظهر مستقيم.\nس2 (مستوى التطبيق): لماذا نضم الشيء إلى الجسم عند الحمل؟\nالإجابة: ليكون الحمل أخف على الظهر.\nس3 (مستوى الاستدلال): ما ضرر الرفع بثني الظهر؟\nالإجابة: يؤلم الظهر ويضر العمود الفقري.\n\n• نشاط علاجي (لمن لم يتقن): يرفع المعلم مع التلميذ كرة طبية من الأرض بثني الركبتين والظهر مستقيم، ويضمانها إلى الجسم، ثم يسأله: ماذا نثني عند رفع شيء من الأرض؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بنقل أدوات المهرجان (أقماع وكرات) بالطريقة الصحيحة، وتصحيح زميل يرفع بثني الظهر مع تفسير ضرر ذلك.", "التقويم الختامي": "س1 (مستوى المعرفة): ارفع الكرة الطبية من الأرض بالطريقة الصحيحة.\nالإجابة: يثني الركبتين والظهر مستقيم.\nس2 (مستوى التطبيق): أرفع صورة طفل يرفع حقيبة بظهر منحنٍ، ما الخطأ؟\nالإجابة: ثني الظهر بدل الركبتين.\nس3 (مستوى الاستدلال): كيف ترفع حقيبتك الثقيلة في الصباح؟\nالإجابة: أقترب منها وأثني ركبتي وأضمها لجسمي ثم أقف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راقب طفلك عند رفع حقيبته وذكّره بثني الركبتين (برنامج صحتي، دليل المعلم ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=8"}}, {"focus": "المهرجان الرياضي التعليمي للم
