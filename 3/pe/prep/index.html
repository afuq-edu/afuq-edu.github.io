رة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أكياس رمل\n- أخرى: مربعات مرقمة\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- البراعة الحركية\n- دوران الطاحونة\n- الوثب بتلامس القدمين\n- المشي المعكوس\n\nالحصة 2:\n- البراعة مع الزميل\n- دوران عقارب الساعة\n- التوافق\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة لاعب جمباز يؤدي حركة مميزة ويسأل: ما الذي يجعل الحركة جميلة؟ ويقدم مصطلح البراعة الحركية (ص 74-75).\n\nالحصة 2:\nيراجع المعلم حركات البراعة الفردية، ثم يعرض مع تلميذ دوران عقارب الساعة ويسأل: ما الذي يدور وما الذي يثبت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 75-76): الوثب بتلامس القدمين (وقوف فتحًا، وثب عاليًا مع تلامس القدمين وتباعدهما، الهبوط فتحًا)، دوران الطاحونة على المرتبة، المشي المعكوس (للخلف) مع النظر عبر الكتف؛ مع نقاط الأمان.\n- الطالب: يقلد كل حركة بالتدرج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (حركات التقليد والبراعة الفردية) ص 77: قطارات على خط البداية، يؤدي التلميذ الوثب بتلامس القدمين داخل الأطواق ثم دوران الطاحونة على المرتبة ثم المشي المعكوس لخط النهاية، ويسجل القائد الأداء الجميل.\n- الطالب: يؤدي المسار ويسجل القائد.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الحكم الصغير): يؤدي تلميذ حركة براعة ويقيّمها زملاؤه بالتصفيق (1-3) حسب الجمال والثبات.\n- الطالب: يؤدي ويقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ النموذج (ص 76): تلميذان في وضع الانبطاح المائل متجاوران، استناد اليدين والأصابع مفرودة، تلاصق القدمين، التحرك باليدين في اتجاه عقارب الساعة مع ثبات القدمين كمحور، ثم تطبيق في أزواج.\n- الطالب: يؤدي مع زميله بالتوافق.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (البراعة مع الزميل) ص 78: ثنائيات تجري على محيط المستطيل وعند النداء تدخل كل ثنائية طوقًا وتؤدي حركة براعة مشتركة (دوران عقارب الساعة، وقوف على قدم متقابلين ومسك اليدين).\n- الطالب: يؤدي مع زميله.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المربعات المرقمة): الوثب بتلامس القدمين إلى المربع الذي يناديه المعلم ثم حركة براعة فيه.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الثقة.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما البراعة الحركية؟\nالإجابة: أداء الحركات بمهارة وجمال وثبات.\nس2 (المستوى المتوقع): كيف نؤدي الوثب بتلامس القدمين؟\nالإجابة: نثب عاليًا من الوقوف فتحًا ونلامس القدمين في الهواء ثم نهبط فتحًا.\nس3 (المستوى المتقدم): ماذا نفعل بالرأس في المشي المعكوس؟\nالإجابة: ننظر عبر الكتف لنرى الطريق.\n\nالحصة 2:\nس1 (مستوى الدعم): في دوران عقارب الساعة، ما الذي يثبت وما الذي يتحرك؟\nالإجابة: تثبت القدمان كمحور وتتحرك اليدان.\nس2 (المستوى المتوقع): ما الوضع الذي نبدأ منه الحركة؟\nالإجابة: الانبطاح المائل.\nس3 (المستوى المتقدم): لماذا نحتاج إلى التوافق مع الزميل؟\nالإجابة: حتى نتحرك بالسرعة نفسها ولا نسقط.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ دوران الطاحونة على المرتبة.\nالإجابة: يؤديه بثبات.\nس2 (المستوى المتوقع): ما الذي يجعل الحركة أكثر جمالًا؟\nالإجابة: استقامة الجذع والرجلين والنظر للأمام والهبوط الهادئ.\nس3 (المستوى المتقدم): اذكر ثلاث حركات براعة تعلمتها اليوم.\nالإجابة: الوثب بتلامس القدمين، دوران الطاحونة، المشي المعكوس.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ مع زميلك دوران عقارب الساعة نصف دورة.\nالإجابة: يؤديانه بتوافق.\nس2 (المستوى المتوقع): اذكر حركة براعة مشتركة أديتها في الطوق.\nالإجابة: مثل: الوقوف على قدم متقابلين مع مسك اليدين.\nس3 (المستوى المتقدم): كيف شعرت عند أداء الحركات أمام زملائك؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على أداء المشي المعكوس في الممر بأمان والوثب بتلامس القدمين (دليل المعلم ص 75-77).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك دوران عقارب الساعة من الانبطاح المائل على سجادة (دليل المعلم ص 76-80)."}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 18-23", "n": 2, "periods": [{"focus": "الممارسات الصحية: الوضع الصحيح للجسم عند حمل الأشياء ورفعها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الطريقة الصحيحة لرفع الأشياء من الأرض وحملها.\n2. يميز الرفع الصحيح (ثني الركبتين) من الخاطئ (ثني الظهر).\n3. يطبق الرفع والحمل الصحيح للأدوات الرياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: كرات طبية\n- أخرى: حقيبة\n- أخرى: بطاقات مصورة\n- أخرى: أقماع", "المفاهيم": "- القوام السليم\n- الرفع الصحيح\n- ثني الركبتين\n- حمل الأشياء", "التهيئة / التمهيد / التعلم القبلي": "يرفع المعلم كرة طبية بثني الظهر ثم بثني الركبتين ويسأل: أي الطريقتين تحمي الظهر؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الرفع الصحيح: الاقتراب من الشيء، ثني الركبتين والظهر مستقيم، مسك الشيء وضمه للجسم، الوقوف بمد الركبتين، مع التفكير بصوت عالٍ عن حماية الظهر (برنامج صحتي ص 23).\n- الطالب: يقلد الرفع الصحيح.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ رفع كرة طبية خفيفة بالطريقتين ويكتشف أيهما أسهل وأين يشعر بالجهد، ويستنتج القاعدة.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (ناقل الأدوات): تتابع في نقل الأدوات (كرات، أقماع) من مكان لآخر بالرفع الصحيح فقط، ولا تحسب النقلة الخاطئة.\n- الطالب: يلعب ويرفع بالطريقة الصحيحة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الظهر.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا نثني عند رفع شيء من الأرض؟\nالإجابة: الركبتين والظهر مستقيم.\nس2 (المستوى المتوقع): لماذا نضم الشيء إلى الجسم عند الحمل؟\nالإجابة: ليكون الحمل أخف على الظهر.\nس3 (المستوى المتقدم): ما ضرر الرفع بثني الظهر؟\nالإجابة: يؤلم الظهر ويضر العمود الفقري.", "التقويم الختامي": "س1 (مستوى الدعم): ارفع الكرة الطبية من الأرض بالطريقة الصحيحة.\nالإجابة: يثني الركبتين والظهر مستقيم.\nس2 (المستوى المتوقع): أرفع صورة طفل يرفع حقيبة بظهر منحنٍ، ما الخطأ؟\nالإجابة: ثني الظهر بدل الركبتين.\nس3 (المستوى المتقدم): كيف ترفع حقيبتك الثقيلة في الصباح؟\nالإجابة: أقترب منها وأثني ركبتي وأضمها لجسمي ثم أقف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راقب طفلك عند رفع حقيبته وذكّره بثني الركبتين (برنامج صحتي، دليل المعلم ص 23)."}}, {"focus": "المهرجان الرياضي التعليمي للموانع والاتزان والبراعة الحركية", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف تمرينات الموانع والاتزان والبراعة في أقسام المهرجان.\n2. يطبق قواعد الأقسام والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- الموانع\n- الاتزان\n- البراعة الحركية", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أتحرك بطلاقة) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم مسار الموانع، قسم الاتزان الثابت (الميزان الأمامي ولمس الأداة)، قسم الاتزان الحركي (المشي على المقعد بالبالون والهبوط بنصف دورة)، قسم البراعة (الوثب بتلامس القدمين ودوران الطاحونة ودوران عقارب الساعة)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع يجمع مانعًا واتزانًا وحركة براعة.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى الدعم): ما القسم الذي استخدمنا فيه المقعد السويدي والبالون؟\nالإجابة: قسم الاتزان الحركي.\nس2 (المستوى المتوقع): اذكر حركة براعة أديتها في قسم البراعة.\nالإجابة: مثل: دوران الطاحونة.\nس3 (المستوى المتقدم): ما قاعدة الأمان في مسار الموانع؟\nالإجابة: الهبوط على المرتبة وعدم الدفع.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر أقسام المهرجان الأربعة.\nالإجابة: الموانع، الاتزان الثابت، الاتزان الحركي، البراعة.\nس2 (المستوى المتوقع): ما القسم الذي أحببته أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): كيف ساهمت في عمل مجموعتك اليوم؟\nالإجابة: يذكر مساهمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، ومارسا الاتزان والبراعة في مكان آمن (دليل المعلم ص 53-81)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الطريقة الصحيحة لرفع الأشياء من الأرض وحملها.\n2. يميز الرفع الصحيح (ثني الركبتين) من الخاطئ (ثني الظهر).\n3. يطبق الرفع والحمل الصحيح للأدوات الرياضية.\n\nالحصة 2:\n1. يوظف تمرينات الموانع والاتزان والبراعة في أقسام المهرجان.\n2. يطبق قواعد الأقسام والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: كرات طبية\n- أخرى: حقيبة\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- القوام السليم\n- الرفع الصحيح\n- ثني الركبتين\n- حمل الأشياء\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- الموانع\n- الاتزان\n- البراعة الحركية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرفع المعلم كرة طبية بثني الظهر ثم بثني الركبتين ويسأل: أي الطريقتين تحمي الظهر؟\n\nالحصة 2:\nيعلن المعلم مهرجان (أتحرك بطلاقة) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الرفع الصحيح: الاقتراب من الشيء، ثني الركبتين والظهر مستقيم، مسك الشيء وضمه للجسم، الوقوف بمد الركبتين، مع التفكير بصوت عالٍ عن حماية الظهر (برنامج صحتي ص 23).\n- الطالب: يقلد الرفع الصحيح.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ رفع كرة طبية خفيفة بالطريقتين ويكتشف أيهما أسهل وأين يشعر بالجهد، ويستنتج القاعدة.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (ناقل الأدوات): تتابع في نقل الأدوات (كرات، أقماع) من مكان لآخر بالرفع الصحيح فقط، ولا تحسب النقلة الخاطئة.\n- الطالب: يلعب ويرفع بالطريقة الصحيحة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الظهر.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم مسار الموانع، قسم الاتزان الثابت (الميزان الأمامي ولمس الأداة)، قسم الاتزان الحركي (المشي على المقعد بالبالون والهبوط بنصف دورة)، قسم البراعة (الوثب بتلامس القدمين ودوران الطاحونة ودوران عقارب الساعة)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع يجمع مانعًا واتزانًا وحركة براعة.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ماذا نثني عند رفع شيء من الأرض؟\nالإجابة: الركبتين والظهر مستقيم.\nس2 (المستوى المتوقع): لماذا نضم الشيء إلى الجسم عند الحمل؟\nالإجابة: ليكون الحمل أخف على الظهر.\nس3 (المستوى المتقدم): ما ضرر الرفع بثني الظهر؟\nالإجابة: يؤلم الظهر ويضر العمود الفقري.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القسم الذي استخدمنا فيه المقعد السويدي والبالون؟\nالإجابة: قسم الاتزان الحركي.\nس2 (المستوى المتوقع): اذكر حركة براعة أديتها في قسم البراعة.\nالإجابة: مثل: دوران الطاحونة.\nس3 (المستوى المتقدم): ما قاعدة الأمان في مسار الموانع؟\nالإجابة: الهبوط على المرتبة وعدم الدفع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ارفع الكرة الطبية من الأرض بالطريقة الصحيحة.\nالإجابة: يثني الركبتين والظهر مستقيم.\nس2 (المستوى المتوقع): أرفع صورة طفل يرفع حقيبة بظهر منحنٍ، ما الخطأ؟\nالإجابة: ثني الظهر بدل الركبتين.\nس3 (المستوى المتقدم): كيف ترفع حقيبتك الثقيلة في الصباح؟\nالإجابة: أقترب منها وأثني ركبتي وأضمها لجسمي ثم أقف.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أقسام المهرجان الأربعة.\nالإجابة: الموانع، الاتزان الثابت، الاتزان الحركي، البراعة.\nس2 (المستوى المتوقع): ما القسم الذي أحببته أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): كيف ساهمت في عمل مجموعتك اليوم؟\nالإجابة: يذكر مساهمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راقب طفلك عند رفع حقيبته وذكّره بثني الركبتين (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، ومارسا الاتزان والبراعة في مكان آمن (دليل المعلم ص 53-81)."}}, {"title": "الطلاقة الحركية بالأدوات", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "العاشر – الحادي عشر", "date": "8-12/11/2026 إلى 15-19/11/2026", "pages": "دليل المعلم ص 82-90", "n": 4, "periods": [{"focus": "الطلاقة الحركية بالكرات (الرمي والدوران واللقف)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي حركات الطلاقة بالكرة (رمي عاليًا والدوران واللقف، تمرير الكرة حول الجسم).\n3. يحافظ على السيطرة على الكرة أثناء الحركة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات\n- أخرى: بالونات\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- الطلاقة الحركية\n- السيطرة على الكرة\n- الرمي واللقف\n- الدوران", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الكرة عاليًا ويدور ثم يلقفها ويسأل: كم حركة أديت؟ ويقدم مفهوم الطلاقة الحركية (ربط الحركات بانسيابية) ص 82-83.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 83-84): رمي الكرة عاليًا والتصفيق واللقف، رمي ودوران ولقف، تمرير الكرة حول الخصر والركبتين، تنطيط ودوران ولقف، بالتدرج.\n- الطالب: يقلد كل حركة بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات الطلاقة الحركية بالكرات) ص 86: محطة الصف (رمي ولقف أثناء المشي 5 م)، محطة الانتشار الحر (تمرير الكرة حول الجسم داخل الطوق)، محطة القطار (الجري بالكرة والرمي والدوران عند القمع)، محطة التبادل مع الزميل، مع التبديل.\n- الطالب: يؤدي مهمة المحطة.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كم مرة؟): من يرمي الكرة ويصفق أكبر عدد قبل اللقف.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الطلاقة الحركية؟\nالإجابة: أداء عدة حركات مترابطة بانسيابية وسيطرة.\nس2 (المستوى المتوقع): اذكر حركة طلاقة بالكرة.\nالإجابة: رمي الكرة عاليًا والدوران ثم لقفها.\nس3 (المستوى المتقدم): كيف نحافظ على الكرة عند الرمي والدوران؟\nالإجابة: نرميها عاليًا بشكل مستقيم وندور بسرعة وننظر إليها.", "التقويم الختامي": "س1 (مستوى الدعم): ارمِ الكرة عاليًا وصفق مرتين ثم القفها.\nالإجابة: يؤديها دون سقوط الكرة.\nس2 (المستوى المتوقع): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الرمي واللقف أثناء المشي، وتمرير الكرة حول الجسم.\nس3 (المستوى المتقدم): ماذا يحدث لو رمينا الكرة مائلة قبل الدوران؟\nالإجابة: تسقط بعيدًا ولا نستطيع لقفها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على رمي الكرة عاليًا والتصفيق واللقف 10 مرات (دليل المعلم ص 83-86)."}}, {"focus": "الطلاقة الحركية بالحبل (الوثب بالحبل الفردي وتدوير الحبل من أسفل)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركات الطلاقة الحركية بالحبل.\n2. يؤدي الوثب بالحبل الفردي بالمشطين وتدوير الحبل من أسفل.\n3. يحافظ على الإيقاع بين دوران الحبل والوثب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: مراتب\n- صورة توضيحية", "المفاهيم": "- الوثب بالحبل\n- تدوير الحبل\n- الإيقاع\n- المشطان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم حبل الوثب ويسأل: من جرب الوثب بالحبل؟ ويوضح طول الحبل المناسب (2.5-3 م) ص 84.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب في المكان بالمشطين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 84-85): الوثب بالحبل الفردي (وقوف، مسك الحبل، الوثب بالمشطين مع تدوير الحبل أمامًا)، تدوير الحبل من أسفل (مسك طرفي الحبل بيد واحدة وتدويره دائرة على الأرض والوثب فوقه)، بالتدرج: الحبل دون وثب، ثم الوثب.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ الوثب بالحبل بتدوير بطيء ثم سريع، وبالوثب العالي ثم المنخفض، ويكتشف أن الوثب المنخفض بالمشطين مع التدوير المنتظم يحفظ الإيقاع.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج: يعد أحدهما عدد وثبات زميله في 20 ثانية ويتبادلان، ثم يحاولان تحسين العدد.\n- الطالب: يعد ويحسن.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء من القدم نثب بالحبل؟\nالإجابة: بالمشطين.\nس2 (المستوى المتوقع): كيف نؤدي تدوير الحبل من أسفل؟\nالإجابة: نمسك طرفي الحبل بيد واحدة وندوره على الأرض ونثب فوقه.\nس3 (المستوى المتقدم): لماذا يفضل الوثب المنخفض؟\nالإجابة: لأنه يحفظ الإيقاع ويقلل التعب.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب بالحبل 10 مرات متتالية.\nالإجابة: يؤديها بالمشطين دون توقف.\nس2 (المستوى المتوقع): ما طول حبل الوثب الفردي المناسب؟\nالإجابة: من 2.5 إلى 3 أمتار.\nس3 (المستوى المتقدم): كيف حسنت عدد وثباتك مع زميلك؟\nالإجابة: بتدوير منتظم ووثب منخفض.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: وفر لطفلك حبل وثب مناسبًا وشجعه على 3 دقائق يوميًا (دليل المعلم ص 84-85)."}}, {"focus": "الطلاقة الحركية بسلم الرشاقة", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف سلم الرشاقة وحركات الطلاقة فيه.\n2. يؤدي الجري بهبوط قدم داخل المربعات والخطو الجانبي والوثب في سلم الرشاقة.\n3. يميز بين أنماط الحركة في سلم الرشاقة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- سلم الرشاقة\n- الجري داخل المربعات\n- الخطو الجانبي\n- الوثب\n- الحجل", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم سلم الرشاقة ويسأل: كيف نتحرك داخل مربعاته؟ ويوضح رسم مربعات 30 سم عند عدم توفره (ص 85).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 85-86): الجري بهبوط قدم في كل مربع، الجري بهبوط القدمين في كل مربع، الخطو الجانبي داخل المربعات، الوثب بالقدمين من مربع لآخر، الحجل، مع رفع الركبتين وتحريك الذراعين.\n- الطالب: يقلد كل نمط ببطء ثم بسرعة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ النمط نفسه بالنظر إلى القدمين ثم للأمام، وبسرعتين، ويكتشف أن النظر للأمام والإيقاع المنتظم أسرع وأدق.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: قطارات، كل تلميذ يؤدي النمط الذي يناديه المعلم عبر السلم والعودة بالجري.\n- الطالب: يتسابق بدقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر حركتين في سلم الرشاقة.\nالإجابة: الجري بهبوط قدم في كل مربع، والخطو الجانبي.\nس2 (المستوى المتوقع): كم طول سلم الرشاقة تقريبًا؟\nالإجابة: 4 أمتار.\nس3 (المستوى المتقدم): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: لنحافظ على السرعة والاتزان وعدم التعثر.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الجري بهبوط قدم في كل مربع عبر السلم.\nالإجابة: يؤديه دون لمس الأطراف.\nس2 (المستوى المتوقع): ما الفرق بين الحجل والوثب في السلم؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (المستوى المتقدم): ماذا نفعل إذا لم يتوفر سلم الرشاقة؟\nالإجابة: نرسم مربعات بطول 30 سم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك 8 مربعات بالطباشير ومارسا الجري والخطو الجانبي فيها (دليل المعلم ص 85-86)."}}, {"focus": "محطات ومنافسات الطلاقة الحركية بالأدوات", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n2. يوظف الطلاقة الحركية في منافسات.\n3. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الأدوات الثلاث ويسأل: ما حركة الطلاقة التي أحببتموها في كل أداة؟ ويعرض محطات اليوم.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 87-88: محطة الحبل (وثب 3 مرات بتدوير يمين ثم يسار)، محطة الكرة (رمي ودوران ولقف)، محطة سلم الرشاقة (نمط يختاره القائد)، محطة الكرة والسلم (الجري في السلم بالكرة)، بأربع مجموعات والتبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 89: تتابع يجمع الأدوات الثلاث: وثب بالحبل 5 مرات، جري في سلم الرشاقة، رمي الكرة والدوران واللقف ثم العودة.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كانت بعض الفرق أسرع؟ ليستنتج التلاميذ أهمية الانسيابية في الانتقال بين الحركات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): في أي محطة استخدمنا أداتين معًا؟\nالإجابة: محطة الكرة والسلم.\nس2 (المستوى المتوقع): ما ترتيب حركات منافسة اليوم؟\nالإجابة: وثب بالحبل، جري في السلم، رمي الكرة والدوران واللقف.\nس3 (المستوى المتقدم): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: محطة الحبل ومحطة الكرة.\nس3 (المستوى المتقدم): كيف شعرت عندما أنهيت المسار دون أخطاء؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي (حبل، مربعات، كرة) (دليل المعلم ص 87-89)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي حركات الطلاقة بالكرة (رمي عاليًا والدوران واللقف، تمرير الكرة حول الجسم).\n3. يحافظ على السيطرة على الكرة أثناء الحركة.\n\nالحصة 2:\n1. يتعرف حركات الطلاقة الحركية بالحبل.\n2. يؤدي الوثب بالحبل الفردي بالمشطين وتدوير الحبل من أسفل.\n3. يحافظ على الإيقاع بين دوران الحبل والوثب.\n\nالحصة 3:\n1. يتعرف سلم الرشاقة وحركات الطلاقة فيه.\n2. يؤدي الجري بهبوط قدم داخل المربعات والخطو الجانبي والوثب في سلم الرشاقة.\n3. يميز بين أنماط الحركة في سلم الرشاقة.\n\nالحصة 4:\n1. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n2. يوظف الطلاقة الحركية في منافسات.\n3. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات\n- أخرى: بالونات\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: مراتب\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- الطلاقة الحركية\n- السيطرة على الكرة\n- الرمي واللقف\n- الدوران\n\nالحصة 2:\n- الوثب بالحبل\n- تدوير الحبل\n- الإيقاع\n- المشطان\n\nالحصة 3:\n- سلم الرشاقة\n- الجري داخل المربعات\n- الخطو الجانبي\n- الوثب\n- الحجل\n\nالحصة 4:\n- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم الكرة عاليًا ويدور ثم يلقفها ويسأل: كم حركة أديت؟ ويقدم مفهوم الطلاقة الحركية (ربط الحركات بانسيابية) ص 82-83.\n\nالحصة 2:\nيعرض المعلم حبل الوثب ويسأل: من جرب الوثب بالحبل؟ ويوضح طول الحبل المناسب (2.5-3 م) ص 84.\n\nالحصة 3:\nيعرض المعلم سلم الرشاقة ويسأل: كيف نتحرك داخل مربعاته؟ ويوضح رسم مربعات 30 سم عند عدم توفره (ص 85).\n\nالحصة 4:\nيراجع المعلم الأدوات الثلاث ويسأل: ما حركة الطلاقة التي أحببتموها في كل أداة؟ ويعرض محطات اليوم.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 83-84): رمي الكرة عاليًا والتصفيق واللقف، رمي ودوران ولقف، تمرير الكرة حول الخصر والركبتين، تنطيط ودوران ولقف، بالتدرج.\n- الطالب: يقلد كل حركة بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات الطلاقة الحركية بالكرات) ص 86: محطة الصف (رمي ولقف أثناء المشي 5 م)، محطة الانتشار الحر (تمرير الكرة حول الجسم داخل الطوق)، محطة القطار (الجري بالكرة والرمي والدوران عند القمع)، محطة التبادل مع الزميل، مع التبديل.\n- الطالب: يؤدي مهمة المحطة.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كم مرة؟): من يرمي الكرة ويصفق أكبر عدد قبل اللقف.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب في المكان بالمشطين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 84-85): الوثب بالحبل الفردي (وقوف، مسك الحبل، الوثب بالمشطين مع تدوير الحبل أمامًا)، تدوير الحبل من أسفل (مسك طرفي الحبل بيد واحدة وتدويره دائرة على الأرض والوثب فوقه)، بالتدرج: الحبل دون وثب، ثم الوثب.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ الوثب بالحبل بتدوير بطيء ثم سريع، وبالوثب العالي ثم المنخفض، ويكتشف أن الوثب المنخفض بالمشطين مع التدوير المنتظم يحفظ الإيقاع.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج: يعد أحدهما عدد وثبات زميله في 20 ثانية ويتبادلان، ثم يحاولان تحسين العدد.\n- الطالب: يعد ويحسن.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج (ص 85-86): الجري بهبوط قدم في كل مربع، الجري بهبوط القدمين في كل مربع، الخطو الجانبي داخل المربعات، الوثب بالقدمين من مربع لآخر، الحجل، مع رفع الركبتين وتحريك الذراعين.\n- الطالب: يقلد كل نمط ببطء ثم بسرعة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ النمط نفسه بالنظر إلى القدمين ثم للأمام، وبسرعتين، ويكتشف أن النظر للأمام والإيقاع المنتظم أسرع وأدق.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: قطارات، كل تلميذ يؤدي النمط الذي يناديه المعلم عبر السلم والعودة بالجري.\n- الطالب: يتسابق بدقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 87-88: محطة الحبل (وثب 3 مرات بتدوير يمين ثم يسار)، محطة الكرة (رمي ودوران ولقف)، محطة سلم الرشاقة (نمط يختاره القائد)، محطة الكرة والسلم (الجري في السلم بالكرة)، بأربع مجموعات والتبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 89: تتابع يجمع الأدوات الثلاث: وثب بالحبل 5 مرات، جري في سلم الرشاقة، رمي الكرة والدوران واللقف ثم العودة.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كانت بعض الفرق أسرع؟ ليستنتج التلاميذ أهمية الانسيابية في الانتقال بين الحركات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الطلاقة الحركية؟\nالإجابة: أداء عدة حركات مترابطة بانسيابية وسيطرة.\nس2 (المستوى المتوقع): اذكر حركة طلاقة بالكرة.\nالإجابة: رمي الكرة عاليًا والدوران ثم لقفها.\nس3 (المستوى المتقدم): كيف نحافظ على الكرة عند الرمي والدوران؟\nالإجابة: نرميها عاليًا بشكل مستقيم وندور بسرعة وننظر إليها.\n\nالحصة 2:\nس1 (مستوى الدعم): بأي جزء من القدم نثب بالحبل؟\nالإجابة: بالمشطين.\nس2 (المستوى المتوقع): كيف نؤدي تدوير الحبل من أسفل؟\nالإجابة: نمسك طرفي الحبل بيد واحدة وندوره على الأرض ونثب فوقه.\nس3 (المستوى المتقدم): لماذا يفضل الوثب المنخفض؟\nالإجابة: لأنه يحفظ الإيقاع ويقلل التعب.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر حركتين في سلم الرشاقة.\nالإجابة: الجري بهبوط قدم في كل مربع، والخطو الجانبي.\nس2 (المستوى المتوقع): كم طول سلم الرشاقة تقريبًا؟\nالإجابة: 4 أمتار.\nس3 (المستوى المتقدم): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: لنحافظ على السرعة والاتزان وعدم التعثر.\n\nالحصة 4:\nس1 (مستوى الدعم): في أي محطة استخدمنا أداتين معًا؟\nالإجابة: محطة الكرة والسلم.\nس2 (المستوى المتوقع): ما ترتيب حركات منافسة اليوم؟\nالإجابة: وثب بالحبل، جري في السلم، رمي الكرة والدوران واللقف.\nس3 (المستوى المتقدم): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ارمِ الكرة عاليًا وصفق مرتين ثم القفها.\nالإجابة: يؤديها دون سقوط الكرة.\nس2 (المستوى المتوقع): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الرمي واللقف أثناء المشي، وتمرير الكرة حول الجسم.\nس3 (المستوى المتقدم): ماذا يحدث لو رمينا الكرة مائلة قبل الدوران؟\nالإجابة: تسقط بعيدًا ولا نستطيع لقفها.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الوثب بالحبل 10 مرات متتالية.\nالإجابة: يؤديها بالمشطين دون توقف.\nس2 (المستوى المتوقع): ما طول حبل الوثب الفردي المناسب؟\nالإجابة: من 2.5 إلى 3 أمتار.\nس3 (المستوى المتقدم): كيف حسنت عدد وثباتك مع زميلك؟\nالإجابة: بتدوير منتظم ووثب منخفض.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ الجري بهبوط قدم في كل مربع عبر السلم.\nالإجابة: يؤديه دون لمس الأطراف.\nس2 (المستوى المتوقع): ما الفرق بين الحجل والوثب في السلم؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (المستوى المتقدم): ماذا نفعل إذا لم يتوفر سلم الرشاقة؟\nالإجابة: نرسم مربعات بطول 30 سم.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: محطة الحبل ومحطة الكرة.\nس3 (المستوى المتقدم): كيف شعرت عندما أنهيت المسار دون أخطاء؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على رمي الكرة عاليًا والتصفيق واللقف 10 مرات (دليل المعلم ص 83-86).\n\nالحصة 2:\nإرشاد لولي الأمر: وفر لطفلك حبل وثب مناسبًا وشجعه على 3 دقائق يوميًا (دليل المعلم ص 84-85).\n\nالحصة 3:\nإرشاد لولي الأمر: ارسم مع طفلك 8 مربعات بالطباشير ومارسا الجري والخطو الجانبي فيها (دليل المعلم ص 85-86).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي (حبل، مربعات، كرة) (دليل المعلم ص 87-89)."}}, {"title": "سباقات الجري", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 94-103", "n": 2, "periods": [{"focus": "سباق تتابع العدو", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق تتابع العدو.\n2. يؤدي العدو السريع والتسليم بلمس يد الزميل في تتابع العدو.\n3. يطبق قواعد السباق (الانطلاق بعد اللمس، البقاء في المسار).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- العدو\n- التتابع المكوكي\n- المسار\n- التسليم\n- القاعدة القانونية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور عدائين في سباق تتابع ويسأل: كيف يفوز الفريق؟ ويقدم ألعاب القوى للصغار (ص 94-95).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف، رفع الركبتين، جري مع تزايد السرعة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج العدو (الجري على المشطين، الذراعان منثنيتان وتتحركان بالتبادل، النظر للأمام) ونموذج التسليم المكوكي بلمس يد الزميل الواقف خلف الخط (ص 95-96).\n- الطالب: يقلد العدو والتسليم.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 97: فرق متساوية في قطارات متقابلة على مسافة 20 م، يعدو الأول ويلمس يد الزميل المقابل فينطلق، حتى يعود الجميع، ويسجل القائد الأخطاء.\n- الطالب: يؤدي السباق ويلتزم بالقواعد.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير يراقب الانطلاق قبل اللمس.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى ينطلق العداء التالي في تتابع العدو؟\nالإجابة: بعد لمس يد زميله.\nس2 (المستوى المتوقع): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وتتحركان بالتبادل مع الرجلين.\nس3 (المستوى المتقدم): ما الخطأ الذي يجعل الفريق يخسر؟\nالإجابة: الانطلاق قبل اللمس أو الخروج من المسار.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدتين لسباق تتابع العدو.\nالإجابة: الانطلاق بعد اللمس، والبقاء في المسار.\nس2 (المستوى المتوقع): أدِّ العدو 20 م بالطريقة الصحيحة.\nالإجابة: يعدو على المشطين والنظر للأمام.\nس3 (المستوى المتقدم): لماذا ننظر للأمام في العدو ولا ننظر للزملاء؟\nالإجابة: للمحافظة على السرعة والاتجاه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على جري قصير سريع مع العائلة بالتتابع في مكان آمن (دليل المعلم ص 95-97)."}}, {"focus": "سباق الجري المتنوع (الفورميلا 1)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف سباق الجري المتنوع وقواعده.\n2. يوظف الحركات الأساسية (العدو، الجري المتعرج، تعدية الحواجز، الدحرجة) في سباق واحد.\n3. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: أعلام ملونة\n- أخرى: مراتب\n- أخرى: عصي التتابع", "المفاهيم": "- الجري المتنوع\n- الفورميلا 1\n- تعدية الحواجز\n- الجري المتعرج", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تتابع العدو ويسأل: ماذا لو وضعنا في مسار السباق حواجز وأعلامًا ومراتب؟ ويقدم سباق الفورميلا 1 (ص 96).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم يشمل الوثب فوق الحواجز والدحرجة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج مناطق المسار المنحني (40-50 م): دحرجة فوق المراتب، عدو، عدو متعرج بين الأعلام، جري بتعدية الحواجز، تسليم العصا.\n- الطالب: يقلد كل منطقة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 98-100: فرق في قطارات، يؤدي كل تلميذ المسار كاملًا ويسلم العصا للتالي، ويراقب القائد تعدية الحواجز دون إسقاطها.\n- الطالب: يؤدي المسار ويسلم العصا.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (السباق الرئيسي) ص 103: الفورميلا 1 بين الفرق وتحديد الفائز.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر مناطق مسار الفورميلا 1.\nالإجابة: الدحرجة، العدو، العدو المتعرج، تعدية الحواجز.\nس2 (المستوى المتوقع): ماذا نسلم للزميل في هذا السباق؟\nالإجابة: عصا التتابع.\nس3 (المستوى المتقدم): ما الحركة التي نؤديها بين الأعلام؟\nالإجابة: الجري المتعرج.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مسار الفورميلا 1 كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (المستوى المتوقع): ما الحركات الأساسية التي تضمنها سباق اليوم؟\nالإجابة: الجري، الوثب (تعدية الحواجز)، الدحرجة، تغيير الاتجاه.\nس3 (المستوى المتقدم): كيف شعرت بمشاركة فريقك في السباق؟\nالإجابة: يعبر عن الرضا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طفلك مناطق سباق الفورميلا 1 وشجعه على الجري اليومي (دليل المعلم ص 96-103)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق تتابع العدو.\n2. يؤدي العدو السريع والتسليم بلمس يد الزميل في تتابع العدو.\n3. يطبق قواعد السباق (الانطلاق بعد اللمس، البقاء في المسار).\n\nالحصة 2:\n1. يتعرف سباق الجري المتنوع وقواعده.\n2. يوظف الحركات الأساسية (العدو، الجري المتعرج، تعدية الحواجز، الدحرجة) في سباق واحد.\n3. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: أعلام ملونة\n- أخرى: مراتب\n- أخرى: عصي التتابع", "المفاهيم": "الحصة 1:\n- العدو\n- التتابع المكوكي\n- المسار\n- التسليم\n- القاعدة القانونية\n\nالحصة 2:\n- الجري المتنوع\n- الفورميلا 1\n- تعدية الحواجز\n- الجري المتعرج", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور عدائين في سباق تتابع ويسأل: كيف يفوز الفريق؟ ويقدم ألعاب القوى للصغار (ص 94-95).\n\nالحصة 2:\nيراجع المعلم تتابع العدو ويسأل: ماذا لو وضعنا في مسار السباق حواجز وأعلامًا ومراتب؟ ويقدم سباق الفورميلا 1 (ص 96).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف، رفع الركبتين، جري مع تزايد السرعة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج العدو (الجري على المشطين، الذراعان منثنيتان وتتحركان بالتبادل، النظر للأمام) ونموذج التسليم المكوكي بلمس يد الزميل الواقف خلف الخط (ص 95-96).\n- الطالب: يقلد العدو والتسليم.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 97: فرق متساوية في قطارات متقابلة على مسافة 20 م، يعدو الأول ويلمس يد الزميل المقابل فينطلق، حتى يعود الجميع، ويسجل القائد الأخطاء.\n- الطالب: يؤدي السباق ويلتزم بالقواعد.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير يراقب الانطلاق قبل اللمس.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم يشمل الوثب فوق الحواجز والدحرجة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج مناطق المسار المنحني (40-50 م): دحرجة فوق المراتب، عدو، عدو متعرج بين الأعلام، جري بتعدية الحواجز، تسليم العصا.\n- الطالب: يقلد كل منطقة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 98-100: فرق في قطارات، يؤدي كل تلميذ المسار كاملًا ويسلم العصا للتالي، ويراقب القائد تعدية الحواجز دون إسقاطها.\n- الطالب: يؤدي المسار ويسلم العصا.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (السباق الرئيسي) ص 103: الفورميلا 1 بين الفرق وتحديد الفائز.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): متى ينطلق العداء التالي في تتابع العدو؟\nالإجابة: بعد لمس يد زميله.\nس2 (المستوى المتوقع): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وتتحركان بالتبادل مع الرجلين.\nس3 (المستوى المتقدم): ما الخطأ الذي يجعل الفريق يخسر؟\nالإجابة: الانطلاق قبل اللمس أو الخروج من المسار.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر مناطق مسار الفورميلا 1.\nالإجابة: الدحرجة، العدو، العدو المتعرج، تعدية الحواجز.\nس2 (المستوى المتوقع): ماذا نسلم للزميل في هذا السباق؟\nالإجابة: عصا التتابع.\nس3 (المستوى المتقدم): ما الحركة التي نؤديها بين الأعلام؟\nالإجابة: الجري المتعرج.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر قاعدتين لسباق تتابع العدو.\nالإجابة: الانطلاق بعد اللمس،  المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على الجري اليومي (دليل المعلم ص 94-103)."}}, {"title": "مسابقات الوثب", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الرابع عشر", "date": "6-10/12/2026", "pages": "دليل المعلم ص 104-113", "n": 2, "periods": [{"focus": "مسابقة وثبة القرفصاء للأمام", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الوثب في ألعاب القوى للصغار وقواعد وثبة القرفصاء.\n2. يؤدي وثبة القرفصاء للأمام بمرجحة الذراعين والهبوط على القدمين.\n3. يطبق قواعد المسابقة (الوثب من خلف الخط، تتابع الفريق).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: بطاقات مرقمة\n- أخرى: مراتب\n- صورة توضيحية", "المفاهيم": "- الوثب\n- وثبة القرفصاء\n- الارتقاء\n- الهبوط\n- خط الوثب", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب الوثب الطويل ويسأل: من أين يبدأ الوثب وأين يهبط؟ ويقدم مسابقات الوثب للصغار (ص 104-105).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب في المكان، ثني الركبتين.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج وثبة القرفصاء (ص 106): وقوف خلف الخط، ثني الركبتين بعمق ومرجحة الذراعين خلفًا، الدفع بالقدمين مع مرجحة الذراعين أمامًا عاليًا، الهبوط على القدمين بثني الركبتين، ونقطة القياس من مؤخرة القدم.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 107: فرق في قطارات، يثب الأول من خلف الخط مرة واحدة لأبعد نقطة، ثم يثب الثاني من نقطة هبوط الأول وهكذا، وتقاس المسافة الكلية للفريق.\n- الطالب: يؤدي الوثبة ويتتابع.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير يراقب الهبوط والخط.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أين تقاس وثبة الفريق التالي؟\nالإجابة: من نقطة هبوط التلميذ السابق.\nس2 (المستوى المتوقع): ماذا نفعل بالذراعين عند الوثب؟\nالإجابة: نمرجحهما خلفًا ثم أمامًا عاليًا.\nس3 (المستوى المتقدم): كيف نهبط بعد وثبة القرفصاء؟\nالإجابة: على القدمين معًا بثني الركبتين.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ وثبة القرفصاء للأمام من خلف الخط.\nالإجابة: يؤديها بمرجحة الذراعين والهبوط الآمن.\nس2 (المستوى المتوقع): اذكر قاعدة من قواعد المسابقة.\nالإجابة: الوثب من خلف الخط دون تجاوزه.\nس3 (المستوى المتقدم): كيف يفوز الفريق في مسابقة وثبة القرفصاء؟\nالإجابة: بأكبر مسافة كلية لوثبات أفراده.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على وثبة القرفصاء للأمام وقياس المسافة في مكان آمن (دليل المعلم ص 106-107)."}}, {"focus": "مسابقة الوثب في المربعات المتقاطعة ومنافسات الوثب", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقة المربعات المتقاطعة وقواعدها.\n2. يوظف الوثب بالقدمين في اتجاهات (أمام، خلف، جانب) داخل المربعات.\n3. يستمتع بمشاركة زملائه مسابقات الوثب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: شريط لاصق\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: حبال\n- أخرى: مربعات الأرقام\n- أخرى: أقماع", "المفاهيم": "- المربعات المتقاطعة\n- الوثب في اتجاهات\n- الإيقاع\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم وثبة القرفصاء، ثم يرسم مربعات متقاطعة (شكل +) ويسأل: كيف نثب فيها بالترتيب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج المربعات المتقاطعة (ص 108): الوقوف في المربع الأوسط والوثب بالقدمين للأمام ثم العودة ثم للجانبين بالترتيب وبإيقاع، وعد الوثبات الصحيحة في 20 ثانية.\n- الطالب: يقلد بالترتيب.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 109-111: محطات الوثب: المربعات المتقاطعة، الوثب فوق الحبال، الوثب داخل الأطواق المتباعدة، وثبة القرفصاء على المرتبة، بأربع مجموعات والتبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (المسابقة الرئيسية) ص 113: وثبة القرفصاء بالتتابع بين الفرق ثم مسابقة المربعات المتقاطعة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أين نبدأ في المربعات المتقاطعة؟\nالإجابة: من المربع الأوسط.\nس2 (المستوى المتوقع): ما ترتيب الوثب في المربعات؟\nالإجابة: أمام ثم عودة ثم الجانبان.\nس3 (المستوى المتقدم): كيف نحسب النقاط في المربعات المتقاطعة؟\nالإجابة: بعدد الوثبات الصحيحة في الزمن المحدد.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب في المربعات المتقاطعة 10 ثوانٍ.\nالإجابة: يؤديه بالترتيب والإيقاع.\nس2 (المستوى المتوقع): أرفع صورة مسابقة وثب، ما اسمها؟\nالإجابة: وثبة القرفصاء أو المربعات المتقاطعة.\nس3 (المستوى المتقدم): كيف شعرت في مسابقات الوثب؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك مربعات متقاطعة بالطباشير ومارسا الوثب فيها (دليل المعلم ص 108-113)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الوثب في ألعاب القوى للصغار وقواعد وثبة القرفصاء.\n2. يؤدي وثبة القرفصاء للأمام بمرجحة الذراعين والهبوط على القدمين.\n3. يطبق قواعد المسابقة (الوثب من خلف الخط، تتابع الفريق).\n\nالحصة 2:\n1. يتعرف مسابقة المربعات المتقاطعة وقواعدها.\n2. يوظف الوثب بالقدمين في اتجاهات (أمام، خلف، جانب) داخل المربعات.\n3. يستمتع بمشاركة زملائه مسابقات الوثب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: بطاقات مرقمة\n- أخرى: مراتب\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: حبال\n- أخرى: مربعات الأرقام\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الوثب\n- وثبة القرفصاء\n- الارتقاء\n- الهبوط\n- خط الوثب\n\nالحصة 2:\n- المربعات المتقاطعة\n- الوثب في اتجاهات\n- الإيقاع\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة لاعب الوثب الطويل ويسأل: من أين يبدأ الوثب وأين يهبط؟ ويقدم مسابقات الوثب للصغار (ص 104-105).\n\nالحصة 2:\nيراجع المعلم وثبة القرفصاء، ثم يرسم مربعات متقاطعة (شكل +) ويسأل: كيف نثب فيها بالترتيب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب في المكان، ثني الركبتين.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج وثبة القرفصاء (ص 106): وقوف خلف الخط، ثني الركبتين بعمق ومرجحة الذراعين خلفًا، الدفع بالقدمين مع مرجحة الذراعين أمامًا عاليًا، الهبوط على القدمين بثني الركبتين، ونقطة القياس من مؤخرة القدم.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 107: فرق في قطارات، يثب الأول من خلف الخط مرة واحدة لأبعد نقطة، ثم يثب الثاني من نقطة هبوط الأول وهكذا، وتقاس المسافة الكلية للفريق.\n- الطالب: يؤدي الوثبة ويتتابع.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير يراقب الهبوط والخط.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج المربعات المتقاطعة (ص 108): الوقوف في المربع الأوسط والوثب بالقدمين للأمام ثم العودة ثم للجانبين بالترتيب وبإيقاع، وعد الوثبات الصحيحة في 20 ثانية.\n- الطالب: يقلد بالترتيب.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 109-111: محطات الوثب: المربعات المتقاطعة، الوثب فوق الحبال، الوثب داخل الأطواق المتباعدة، وثبة القرفصاء على المرتبة، بأربع مجموعات والتبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (المسابقة الرئيسية) ص 113: وثبة القرفصاء بالتتابع بين الفرق ثم مسابقة المربعات المتقاطعة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): من أين تقاس وثبة الفريق التالي؟\nالإجابة: من نقطة هبوط التلميذ السابق.\nس2 (المستوى المتوقع): ماذا نفعل بالذراعين عند الوثب؟\nالإجابة: نمرجحهما خلفًا ثم أمامًا عاليًا.\nس3 (المستوى المتقدم): كيف نهبط بعد وثبة القرفصاء؟\nالإجابة: على القدمين معًا بثني الركبتين.\n\nالحصة 2:\nس1 (مستوى الدعم): من أين نبدأ في المربعات المتقاطعة؟\nالإجابة: من المربع الأوسط.\nس2 (المستوى المتوقع): ما ترتيب الوثب في المربعات؟\nالإجابة: أمام ثم عودة ثم الجانبان.\nس3 (المستوى المتقدم): كيف نحسب النقاط في المربعات المتقاطعة؟\nالإجابة: بعدد الوثبات الصحيحة في الزمن المحدد.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ وثبة القرفصاء للأمام من خلف الخط.\nالإجابة: يؤديها بمرجحة الذراعين والهبوط الآمن.\nس2 (المستوى المتوقع): اذكر قاعدة من قواعد المسابقة.\nالإجابة: الوثب من خلف الخط دون تجاوزه.\nس3 (المستوى المتقدم): كيف يفوز الفريق في مسابقة وثبة القرفصاء؟\nالإجابة: بأكبر مسافة كلية لوثبات أفراده.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الوثب في المربعات المتقاطعة 10 ثوانٍ.\nالإجابة: يؤديه بالترتيب والإيقاع.\nس2 (المستوى المتوقع): أرفع صورة مسابقة وثب، ما اسمها؟\nالإجابة: وثبة القرفصاء أو المربعات المتقاطعة.\nس3 (المستوى المتقدم): كيف شعرت في مسابقات الوثب؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على وثبة القرفصاء للأمام وقياس المسافة في مكان آمن (دليل المعلم ص 106-107).\n\nالحصة 2:\nإرشاد لولي الأمر: ارسم مع طفلك مربعات متقاطعة بالطباشير ومارسا الوثب فيها (دليل المعلم ص 108-113)."}}, {"title": "مسابقات الرمي", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 114-124", "n": 2, "periods": [{"focus": "مسابقة الرمي لإصابة هدف من فوق حاجز", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الرمي في ألعاب القوى للصغار وقواعد الرمي على الهدف.\n2. يؤدي رمي الكرة بيد واحدة من فوق الكتف لإصابة هدف من فوق حاجز.\n3. يطبق قواعد الرمي (من خلف خط الرمي، عدد المحاولات).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات صغيرة\n- أخرى: حواجز\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- صورة توضيحية", "المفاهيم": "- الرمي\n- الدقة\n- خط الرمي\n- الهدف\n- المحاولة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور مسابقات الرمي ويسأل: كيف نرمي بدقة نحو هدف؟ ويقدم مسابقة الرمي على الهدف (ص 114-115).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، دوران الذراعين، رمي الكرة لأعلى ولقفها.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الرمي بيد واحدة من فوق الكتف: قدم متقدمة عكس اليد الرامية، سحب الذراع خلفًا، الرمي مع نقل الثقل للأمام والنظر إلى الهدف (ص 115-116).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 117: فرق في قطارات خلف خط الرمي، حاجز بينها وبين الأهداف (أطواق وسلال)، لكل تلميذ محاولتان، وتحسب نقاط الإصابة للفريق.\n- الطالب: يرمي ويسجل القائد.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع تغيير مسافة الحاجز.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الذراعين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): أي قدم تتقدم عند الرمي باليد اليمنى؟\nالإجابة: القدم اليسرى.\nس2 (المستوى المتوقع): من أين نرمي في المسابقة؟\nالإجابة: من خلف خط الرمي.\nس3 (المستوى المتقدم): كم محاولة لكل تلميذ؟\nالإجابة: محاولتان.", "التقويم الختامي": "س1 (مستوى الدعم): ارمِ الكرة من فوق الحاجز لتصيب الطوق.\nالإجابة: يرمي بدقة من فوق الكتف.\nس2 (المستوى المتوقع): كيف يفوز الفريق في مسابقة الرمي على الهدف؟\nالإجابة: بأكبر عدد من الإصابات.\nس3 (المستوى المتقدم): لماذا ننظر إلى الهدف لا إلى الكرة أثناء الرمي؟\nالإجابة: لتوجيه الرمية بدقة نحو الهدف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك رمي كرة صغيرة فوق حبل لإصابة سلة (دليل المعلم ص 115-117)."}}, {"focus": "مسابقة رمي الرمح للصغار لأبعد مسافة", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقة رمي الرمح للصغار وقواعدها.\n2. يؤدي رمي الرمح البلاستيكي من اقتراب قصير لأبعد مسافة.\n3. يشعر بالسعادة والرضا بمشاركة زملائه مسابقات الرمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: رماح بلاستيكية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: مراتب", "المفاهيم": "- رمي الرمح\n- الاقتراب\n- منطقة الرمي\n- المسافة\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الرمي على الهدف، ثم يعرض الرمح البلاستيكي ويسأل: كيف نمسكه؟ وما قواعد الأمان عند رميه؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج (ص 116): مسك الرمح من المقبض فوق الكتف، اقتراب 5 م، سحب الذراع خلفًا ورمي الرمح للأمام عاليًا قبل خط الرمي، مع قواعد الأمان (الرمي بالإشارة فقط، عدم جمع الرماح قبل انتهاء الجميع).\n- الطالب: يقلد بالتدرج دون رمح ثم بالرمح.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 118-121: محطات الرمي: رمي الرمح لأبعد مسافة، الرمي على الهدف من فوق الحاجز، رمي الكرة من الاقتراب، بمجموعات وقائد يسجل المسافة بالشريط.\n- الطالب: يرمي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (المسابقة الرئيسية) ص 123: رمي الرمح للصغار بين الفرق، محاولتان لكل تلميذ، وتحسب أبعد محاولة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس2 (المستوى المتوقع): كم مسافة الاقتراب قبل الرمي؟\nالإجابة: 5 أمتار.\nس3 (المستوى المتقدم): اذكر قاعدة أمان في رمي الرمح.\nالإجابة: نرمي بإشارة المعلم فقط ولا نجمع الرماح قبل انتهاء الجميع.", "التقويم الختامي": "س1 (مستوى الدعم): ارمِ الرمح من الاقتراب لأبعد مسافة.\nالإجابة: يرمي قبل خط الرمي داخل منطقة الرمي.\nس2 (المستوى المتوقع): أي المحاولتين تحتسب؟\nالإجابة: الأبعد.\nس3 (المستوى المتقدم): كيف شعرت في مسابقات الرمي هذا الأسبوع؟\nالإجابة: يعبر عن الرضا والسعادة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان في الرمي، وشجعه على الرمي بأدوات خفيفة في مكان آمن (دليل المعلم ص 116-123)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الرمي في ألعاب القوى للصغار وقواعد الرمي على الهدف.\n2. يؤدي رمي الكرة بيد واحدة من فوق الكتف لإصابة هدف من فوق حاجز.\n3. يطبق قواعد الرمي (من خلف خط الرمي، عدد المحاولات).\n\nالحصة 2:\n1. يتعرف مسابقة رمي الرمح للصغار وقواعدها.\n2. يؤدي رمي الرمح البلاستيكي من اقتراب قصير لأبعد مسافة.\n3. يشعر بالسعادة والرضا بمشاركة زملائه مسابقات الرمي.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات صغيرة\n- أخرى: حواجز\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: رماح بلاستيكية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- الرمي\n- الدقة\n- خط الرمي\n- الهدف\n- المحاولة\n\nالحصة 2:\n- رمي الرمح\n- الاقتراب\n- منطقة الرمي\n- المسافة\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور مسابقات الرمي ويسأل: كيف نرمي بدقة نحو هدف؟ ويقدم مسابقة الرمي على الهدف (ص 114-115).\n\nالحصة 2:\nيراجع المعلم الرمي على الهدف، ثم يعرض الرمح البلاستيكي ويسأل: كيف نمسكه؟ وما قواعد الأمان عند رميه؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، دوران الذراعين، رمي الكرة لأعلى ولقفها.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الرمي بيد واحدة من فوق الكتف: قدم متقدمة عكس اليد الرامية، سحب الذراع خلفًا، الرمي مع نقل الثقل للأمام والنظر إلى الهدف (ص 115-116).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 117: فرق في قطارات خلف خط الرمي، حاجز بينها وبين الأهداف (أطواق وسلال)، لكل تلميذ محاولتان، وتحسب نقاط الإصابة للفريق.\n- الطالب: يرمي ويسجل القائد.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع تغيير مسافة الحاجز.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الذراعين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج (ص 116): مسك الرمح من المقبض فوق الكتف، اقتراب 5 م، سحب الذراع خلفًا ورمي الرمح للأمام عاليًا قبل خط الرمي، مع قواعد الأمان (الرمي بالإشارة فقط، عدم جمع الرماح قبل انتهاء الجميع).\n- الطالب: يقلد بالتدرج دون رمح ثم بالرمح.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 و3 ص 118-121: محطات الرمي: رمي الرمح لأبعد مسافة، الرمي على الهدف من فوق الحاجز، رمي الكرة من الاقتراب، بمجموعات وقائد يسجل المسافة بالشريط.\n- الطالب: يرمي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (المسابقة الرئيسية) ص 123: رمي الرمح للصغار بين الفرق، محاولتان لكل تلميذ، وتحسب أبعد محاولة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): أي قدم تتقدم عند الرمي باليد اليمنى؟\nالإجابة: القدم اليسرى.\nس2 (المستوى المتوقع): من أين نرمي في المسابقة؟\nالإجابة: من خلف خط الرمي.\nس3 (المستوى المتقدم): كم محاولة لكل تلميذ؟\nالإجابة: محاولتان.\n\nالحصة 2:\nس1 (مستوى الدعم): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس2 (المستوى المتوقع): كم مسافة الاقتراب قبل الرمي؟\nالإجابة: 5 أمتار.\nس3 (المستوى المتقدم): اذكر قاعدة أمان في رمي الرمح.\nالإجابة: نرمي بإشارة المعلم فقط ولا نجمع الرماح قبل انتهاء الجميع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ارمِ الكرة من فوق الحاجز لتصيب الطوق.\nالإجابة: يرمي بدقة من فوق الكتف.\nس2 (المستوى المتوقع): كيف يفوز الفريق في مسابقة الرمي على الهدف؟\nالإجابة: بأكبر عدد من الإصابات.\nس3 (المستوى المتقدم): لماذا ننظر إلى الهدف لا إلى الكرة أثناء الرمي؟\nالإجابة: لتوجيه الرمية بدقة نحو الهدف.\n\nالحصة 2:\nس1 (مستوى الدعم): ارمِ الرمح من الاقتراب لأبعد مسافة.\nالإجابة: يرمي قبل خط الرمي داخل منطقة الرمي.\nس2 (المستوى المتوقع): أي المحاولتين تحتسب؟\nالإجابة: الأبعد.\nس3 (المستوى المتقدم): كيف شعرت في مسابقات الرمي هذا الأسبوع؟\nالإجابة: يعبر عن الرضا والسعادة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: العب مع طفلك رمي كرة صغيرة فوق حبل لإصابة سلة (دليل المعلم ص 115-117).\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان في الرمي، وشجعه على الرمي بأدوات خفيفة في مكان آمن (دليل المعلم ص 116-123)."}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 64-124 (الوحدتان الثانية والثالثة)", "n": 2, "periods": [{"focus": "قياس أداء الاتزان والبراعة والطلاقة الحركية", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الميزان الأمامي const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
</body>
</html>
