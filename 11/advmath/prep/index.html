يم", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المماس، نقطة التماس، تعامد المماس ونصف القطر، تقاطع الأعمدة المنصفة.", "يسأل المعلم: ما الزاوية بين المماس ونصف القطر عند نقطة التماس؟ والطالب: قائمة.", "1. التهيئة: يسأل المعلم: ما الزاوية بين المماس ونصف القطر عند نقطة التماس؟ والطالب: قائمة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم المماس للدائرة (س − 2)² + (ص + 3)² = 25 عند (5، 1): ميل نصف القطر 4/3 ← ميل المماس −3/4 ← 3س + 4ص − 19 = 0، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. حل مشكلة: يقدم المعلم: دائرة تمر بـ (0، 0)، (8، 0)، (0، 6). يقود الطلبة لإيجاد المركز (4، 3) من العمودين المنصفين ونق = 5، ويحل الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يكلف المعلم بسؤال مماس من التمارين، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 5-4 ومحور «معادلة المماس للدائرة عند نقطة ودائرة تمر بثلاث نقاط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-4: الأسئلة 9–12، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] ميل نصف القطر من (2، −3) إلى (5، 1)؟\nالإجابة النموذجية: 4/3\n2) [مستوى التطبيق] معادلة المماس عند (5، 1)؟\nالإجابة النموذجية: 3س + 4ص − 19 = 0\n3) [مستوى الاستدلال] مركز الدائرة المارة بـ (0، 0)، (8، 0)، (0، 6)؟\nالإجابة النموذجية: (4، 3)", "1) [مستوى المعرفة] أكمل: المماس ___ نصف القطر عند نقطة التماس.\nالإجابة النموذجية: عمودي على\n2) [مستوى التطبيق] معادلة المماس للدائرة س² + ص² = 25 عند (3، 4)؟\nالإجابة النموذجية: ميل نصف القطر 4/3، المماس 3س + 4ص = 25\n3) [مستوى الاستدلال] نصف قطر الدائرة المارة بـ (0، 0)، (8، 0)، (0، 6)؟\nالإجابة النموذجية: 5", "للطالب: تمارين 5-4: الأسئلة 9–12 (كتاب الطالب ص151–157، كتاب النشاط ص130–132).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «معادلة المماس للدائرة عند نقطة ودائرة تمر بثلاث نقاط».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=26"]}]}, {"id": "5-5", "title": "علاقة المستقيم بالدائرة", "p": [{"ax": "نقاط تقاطع المستقيم والدائرة", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يجد نقاط تقاطع مستقيم ودائرة بالتعويض.\n2) يحدد عدد نقاط التقاطع بالمميّز.\nمخرج تعليمي آخر: يجد طول الوتر الناتج عن التقاطع.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "القاطع، المماس، الوتر، المميّز، طول الوتر.", "يعرض المعلم على GeoGebra دائرة ومستقيمًا متحركًا ويسأل: كم وضعًا ممكنًا للمستقيم بالنسبة للدائرة؟ والطالب: ثلاثة: يقطع، يمس، لا يقطع.", "1. التهيئة: يعرض المعلم على GeoGebra دائرة ومستقيمًا متحركًا ويسأل: كم وضعًا ممكنًا للمستقيم بالنسبة للدائرة؟ والطالب: ثلاثة: يقطع، يمس، لا يقطع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ص = س + 1 و س² + ص² = 25 ← 2س² + 2س − 24 = 0 ← (3، 4) و (−4، −3)، وطول الوتر √98 = 7√2، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تطبيق موجّه: يطلب المعلم عدد نقاط تقاطع ص = 2س + 10 مع س² + ص² = 9، والطالب: 5س² + 40س + 91 = 0، المميّز 1600 − 1820 < 0، لا تقاطع (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يصنف المعلم ثلاث حالات بالمميّز، ويصنف الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-5: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] تقاطع ص = س + 1 مع س² + ص² = 25؟\nالإجابة النموذجية: (3، 4) و (−4، −3)\n2) [مستوى التطبيق] طول الوتر في السؤال السابق؟\nالإجابة النموذجية: 7√2\n3) [مستوى الاستدلال] هل ص = 2س + 10 يقطع س² + ص² = 9؟\nالإجابة النموذجية: لا", "1) [مستوى المعرفة] أكمل: إذا كان مميّز معادلة التقاطع موجبًا فالمستقيم ___ الدائرة\nالإجابة النموذجية: يقطع\n2) [مستوى التطبيق] تقاطع ص = 7 − س مع س² + ص² = 25؟\nالإجابة النموذجية: (3، 4) و (4، 3)\n3) [مستوى الاستدلال] طول الوتر في السؤال السابق؟\nالإجابة النموذجية: √2", "للطالب: تمارين 5-5: الأسئلة 1–4 (كتاب الطالب ص158–161، ومراجعة الوحدة ص162–165، كتاب النشاط ص133–135، ومراجعة الوحدة ص136–139).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=27"]}, {"ax": "شرط التماس وقيم الثابت", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يجد قيم الثابت التي تجعل المستقيم مماسًا للدائرة.\n2) يجد مدى قيم الثابت لكي يقطع المستقيم الدائرة في نقطتين.\nمخرج تعليمي آخر: يتحقق بالرسم.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "شرط التماس، المميّز، المتباينة في الثابت.", "يسأل المعلم: متى يمس المستقيم ص = س + ك الدائرة س² + ص² = 8؟ ويقترح الطالب المميّز = 0.", "1. التهيئة: يسأل المعلم: متى يمس المستقيم ص = س + ك الدائرة س² + ص² = 8؟ ويقترح الطالب المميّز = 0 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س² + 2ك س + ك² − 8 = 0 ← 4ك² − 8(ك² − 8) = 0 ← ك = ±4، ونقطتا التماس (−2، 2) و (2، −2)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: قيم م التي تجعل ص = م س + 5 يقطع س² + ص² = 5 في نقطتين، والطالب: (1 + م²)س² + 10م س + 20 = 0 ← 100م² − 80(1 + م²) > 0 ← م² > 4 ← م < −2 أو م > 2 (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تقويم تكويني: يتحقق المعلم بالرسم على GeoGebra، ويقارن الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-5: الأسئلة 5–8، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "1) [مستوى المعرفة] قيم ك لكي يمس ص = س + ك الدائرة س² + ص² = 8؟\nالإجابة النموذجية: ±4\n2) [مستوى التطبيق] نقطة التماس عندما ك = 4؟\nالإجابة النموذجية: (−2، 2)\n3) [مستوى الاستدلال] قيم م لكي يقطع ص = م س + 5 الدائرة س² + ص² = 5 في نقطتين؟\nالإجابة النموذجية: م < −2 أو م > 2", "1) [مستوى المعرفة] أكمل: شرط التماس هو المميّز = ___\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] قيم م لكي يمس ص = م س + 5 الدائرة س² + ص² = 5؟\nالإجابة النموذجية: م = ±2\n3) [مستوى الاستدلال] هل ص = 4 مماس للدائرة س² + ص² = 16؟\nالإجابة النموذجية: نعم عند (0، 4)", "للطالب: تمارين 5-5: الأسئلة 5–8 (كتاب الطالب ص158–161، ومراجعة الوحدة ص162–165، كتاب النشاط ص133–135، ومراجعة الوحدة ص136–139).\nلولي الأمر: متابعة تقدم الابن/الابنة في «شرط التماس وقيم الثابت» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=27"]}, {"ax": "مراجعة الوحدة الخامسة: الهندسة الإحداثية", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحل مسائل شاملة على المسافة والمنتصف والميل والمستقيم والدائرة.\n2) يربط المفاهيم في مسائل مركبة.\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- ا ين منطبقين ويسأل: كم حلًا لكل نظام؟ والطالب: لا حل، وعدد لانهائي.", "1. التهيئة: يرسم المعلم مستقيمين متوازيين وآخرين منطبقين ويسأل: كم حلًا لكل نظام؟ والطالب: لا حل، وعدد لانهائي (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س + 4ص = 6، س + 2ص = 5 ← المحدد 0، والمستقيمان متوازيان ← لا حل؛ س + 2ص = 3، 2س + 4ص = 6 ← منطبقان ← عدد لانهائي، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: قيم ك التي تجعل ك س + 2ص = 3، 2س + ك ص = 3 بلا حل وحيد، والطالب: ك² − 4 = 0 ← ك = ±2؛ ك = 2 منطبقان، ك = −2 متوازيان (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تقويم تكويني: يصنف المعلم أنظمة سريعة، ويصنف الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 6-4: الأسئلة 10–12، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "1) [مستوى المعرفة] محدد معاملات 2س + 4ص = 6، س + 2ص = 5؟\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] كم حلًا لهذا النظام؟\nالإجابة النموذجية: لا حل (متوازيان)\n3) [مستوى الاستدلال] كم حلًا لـ س + 2ص = 3، 2س + 4ص = 6؟\nالإجابة النموذجية: عدد لانهائي", "1) [مستوى المعرفة] أكمل: إذا كان محدد المعاملات صفرًا فليس للنظام حل ___\nالإجابة النموذجية: وحيد\n2) [مستوى التطبيق] قيم ك التي تجعل ك س + 2ص = 3، 2س + ك ص = 3 بلا حل وحيد؟\nالإجابة النموذجية: ك = ±2\n3) [مستوى الاستدلال] عند ك = −2 هل للنظام حل؟\nالإجابة النموذجية: لا، المستقيمان متوازيان", "للطالب: تمارين 6-4: الأسئلة 10–12 (كتاب الطالب ص189–196، ومراجعة الوحدة ص197، كتاب النشاط ص148–151، ومراجعة الوحدة ص152).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.githu السادسة: المصفوفات»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص197، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] أ + ب للمصفوفتين أ و ب؟\nالإجابة النموذجية: ⁦[3 -1 | 3 7]⁩\n2) [مستوى التطبيق] محدد أ ب؟\nالإجابة النموذجية: 15\n3) [مستوى الاستدلال] حل أ س = ⁦[4 | 7]⁩.\nالإجابة النموذجية: 1/5 × ⁦[9 | 2]⁩", "1) [مستوى المعرفة] أكمل: شرط ضرب أ (م × ن) في ب (ن × ك) أن يكون عدد أعمدة أ = ___ ب\nالإجابة النموذجية: عدد صفوف\n2) [مستوى التطبيق] معكوس ⁦[2 5 | 1 3]⁩؟\nالإجابة النموذجية: ⁦[3 -5 | -1 2]⁩\n3) [مستوى الاستدلال] حل 2س + 5ص = 9، س + 3ص = 5.\nالإجابة النموذجية: ⁦[3 -5 | -1 2]⁩ × ⁦[9 | 5]⁩ = ⁦[2 | 1]⁩", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص197 (كتاب الطالب ص189–196، ومراجعة الوحدة ص197، كتاب النشاط ص148–151، ومراجعة الوحدة ص152).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=31"]}]}],[{"id": "1-1", "title": "الإكمال إلى مربع", "p": [{"ax": "كتابة العبارة التربيعية س² + ب س + جـ بطريقة الإكمال إلى مربع", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يكتب العبارة س² + ب س + جـ على الصورة (س + ب/2)² + ك.\n2) يستنتج القيمة الصغرى للعبارة من صورتها المكتملة.\nمخرج تعليمي آخر: يفسر الإكمال إلى مربع هندسيًا بنموذج المساحات.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- نماذج مجسمة", "المربع الكامل، الإكمال إلى مربع، نصف معامل س، الصورة (س + ف)² + ك.", "يطلب المعلم فك (س + 3)² و (س − 5)²، ثم يسأل: ما العلاقة بين معامل س والعدد داخل القوس؟ ويلاحظ الطالب أن العدد داخل القوس نصف معامل س.", "1. التهيئة: يطلب المعلم فك (س + 3)² و (س − 5)²، ثم يسأل: ما العلاقة بين معامل س والعدد داخل القوس؟ ويلاحظ الطالب أن العدد داخل القوس نصف معامل س (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يمثل المعلم س² + 6س بمربع ومستطيلين، ويبين الحاجة لإضافة 9 لإكمال المربع، ثم يكتب س² + 6س + 2 = (س + 3)² − 7، ويتابع الطالب النموذج الهندسي ويكتب الخطوات (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تطبيق موجّه: يطبق المعلم على: س² − 8س + 5 = (س − 4)² − 11، و س² + 5س + 1 = (س + 5/2)² − 21/4، ويحل الطالب على السبورة الصغيرة ويقارن (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يسأل المعلم: ما أصغر قيمة للعبارة (س + 3)² − 7؟ ومتى تحدث؟ ويجيب الطالب: −7 عندما س = −3 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1أ: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] اكتب س² + 4س + 1 بصورة الإكمال إلى مربع.\nالإجابة النموذجية: (س + 2)² − 3\n2) [مستوى التطبيق] اكتب س² − 10س + 30 بصورة الإكمال إلى مربع.\nالإجابة النموذجية: (س − 5)² + 5\n3) [مستوى الاستدلال] أوجد أصغر قيمة للعبارة س² − 10س + 30.\nالإجابة النموذجية: 5 عندما س = 5", "1) [مستوى المعرفة] أكمل: س² + 6س + 2 = (س + 3)² − ___\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] اكتب س² − 3س + 2 بصورة الإكمال إلى مربع.\nالإجابة النموذجية: (س − 3/2)² − 1/4\n3) [مستوى الاستدلال] أوجد قيمتي ف و ك إذا كان س² + 12س + ك = (س + ف)² − 4.\nالإجابة النموذجية: ف = 6، ك = 32", "للطالب: تمارين 1-1أ: الأسئلة 1–3 (كتاب الطالب ص19–24، كتاب النشاط ص13–16).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «كتابة العبارة التربيعية س² + ب س + جـ بطريقة الإكمال إلى مربع».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=1"]}, {"ax": "الإكمال إلى مربع عندما يكون معامل س² لا يساوي 1", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يخرج معامل س² عاملًا مشتركًا ثم يكمل المربع.\n2) يكتب العبارة أ س² + ب س + جـ على الصورة أ(س + ف)² + ك.\nمخرج تعليمي آخر: يحدد القيمة العظمى أو الصغرى من الصورة المكتملة حسب إشارة أ.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المعامل الرئيس، إخراج العامل المشترك، الصورة أ(س + ف)² + ك، القيمة العظمى، القيمة الصغرى.", "يطلب المعلم كتابة 2س² + 12س بإخراج العامل المشترك 2، ويكتب الطالب 2(س² + 6س).", "1. التهيئة: يطلب المعلم كتابة 2س² + 12س بإخراج العامل المشترك 2، ويكتب الطالب 2(س² + 6س) (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س² + 12س + 7 = 2(س² + 6س) + 7 = 2[(س + 3)² − 9] + 7 = 2(س + 3)² − 11، ويتابع الطالب ويحدد أن القيمة الصغرى −11 (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: 3س² − 6س + 1، و 5 − 4س − س²، و −2س² + 8س − 3 على المجموعات، وتجد المجموعة: 3(س − 1)² − 2؛ 9 − (س + 2)²؛ −2(س − 2)² + 5 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم تحديد القيمة العظمى للعبارة 9 − (س + 2)² ومتى تحدث، ويجيب الطالب: 9 عندما س = −2 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1أ: الأسئلة 4–6، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] اكتب 2س² + 8س + 3 بالصورة أ(س + ف)² + ك.\nالإجابة النموذجية: 2(س + 2)² − 5\n2) [مستوى التطبيق] اكتب 4 + 6س − س² بالصورة ك − (س − ف)².\nالإجابة النموذجية: 13 − (س − 3)²\n3) [مستوى الاستدلال] أوجد القيمة العظمى للعبارة 4 + 6س − س².\nالإجابة النموذجية: 13 عندما س = 3", "1) [مستوى المعرفة] أكمل: 3س² − 6س + 1 = 3(س − 1)² − ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] اكتب 2س² − 4س + 7 بصورة الإكمال إلى مربع.\nالإجابة النموذجية: 2(س − 1)² + 5\n3) [مستوى الاستدلال] بيّن أن 2س² − 4س + 7 > 0 لجميع قيم س.\nالإجابة النموذجية: 2(س − 1)² + 5 ≥ 5 > 0", "للطالب: تمارين 1-1أ: الأسئلة 4–6 (كتاب الطالب ص19–24، كتاب النشاط ص13–16).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الإكمال إلى مربع عندما يكون معامل س² لا يساوي 1» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=1"]}, {"ax": "استخدام الإكمال إلى مربع لحل المعادلات التربيعية", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحل معادلة تربيعية بطريقة الإكمال إلى مربع.\n2) يكتب الحلول بالصورة الجذرية الدقيقة.\nمخرج تعليمي آخر: يبرر متى لا يكون للمعادلة حل حقيقي من الصورة المكتملة.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحل الدقيق، الصورة الجذرية، الجذر التربيعي الموجب والسالب، المعادلة غير القابلة للتحليل.", "يطرح المعلم: حل (س + 3)² = 7 ويسأل: كم حلًا؟ ويكتب الطالب س + 3 = ±√7.", "1. التهيئة: يطرح المعلم: حل (س + 3)² = 7 ويسأل: كم حلًا؟ ويكتب الطالب س + 3 = ±√7 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: س² + 6س + 2 = 0 ← (س + 3)² = 7 ← س = −3 ± √7؛ و 2س² − 4س − 3 = 0 ← 2(س − 1)² = 5 ← س = 1 ± √(5/2)، ويحل الطالب ويكتب الحلول الدقيقة والتقريبية (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يكلف المعلم بحل س² − 4س − 1 = 0 و 3س² + 6س − 2 = 0، ويجد الطالب: 2 ± √5؛ −1 ± √(5/3) (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يسأل المعلم: لماذا ليس للمعادلة (س − 2)² + 4 = 0 حل حقيقي؟ ويجيب الطالب: لأن المربع لا يكون سالبًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-1 ومحور «استخدام الإكمال إلى مربع لحل المعادلات التربيعية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-1ب: الأسئلة 1–4، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] حل بالإكمال إلى مربع: س² + 2س − 5 = 0.\nالإجابة النموذجية: (س + 1)² = 6 ← س = −1 ± √6\n2) [مستوى التطبيق] حل: س² − 6س + 4 = 0 تاركًا الإجابة بصورة جذرية.\nالإجابة النموذجية: (س − 3)² = 5 ← س = 3 ± √5\n3) [مستوى الاستدلال] هل للمعادلة س² + 4س + 7 = 0 حل حقيقي؟\nالإجابة النموذجية: (س + 2)² = −3، لا حل حقيقي.", "1) [مستوى المعرفة] أكمل: إذا كان (س − 1)² = 3 فإن س = 1 ± ___\nالإجابة النموذجية: √3\n2) [مستوى التطبيق] حل: س² + 8س + 13 = 0.\nالإجابة النموذجية: (س + 4)² = 3 ← س = −4 ± √3\n3) [مستوى الاستدلال] حل: 2س² + 4س − 1 = 0.\nالإجابة النموذجية: 2(س + 1)² = 3 ← س = −1 ± √(3/2)", "للطالب: تمارين 1-1ب: الأسئلة 1–4 (كتاب الطالب ص19–24، كتاب النشاط ص13–16).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «استخدام الإكمال إلى مربع لحل المعادلات التربيعية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=1"]}]}, {"id": "1-2", "title": "التمثيل البياني للدالة التربيعية", "p": [{"ax": "رأس المنحنى ومحور التماثل من صورة الإكمال إلى مربع + رسم منحنى الدالة التربيعية بتحديد المقاطع والرأس", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحدد إحداثيي رأس المنحنى من الصورة أ(س − ف)² + ك.\n2) يكتب معادلة محور التماثل.\n3) يجد المقطعين السيني والصادي للمنحنى.\n4) يرسم رسمًا تخطيطيًا دقيقًا للمنحنى يوضح الرأس والمقاطع.\n\nمخرج تعليمي آخر:\nيحدد نوع نقطة الرأس (عظمى أو صغرى) من إشارة أ.\nيحدد مدى الدالة من الرسم.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- أخرى: ورق رسم بياني", "رأس المنحنى (نقطة التحول)، محور التماثل، نقطة الثبات، القيمة العظمى، القيمة الصغرى.، الرسم التخطيطي، المقطع السيني، المقطع الصادي، الرأس، المدى.", "يعرض المعلم على GeoGebra ص = (س − ف)² + ك بمنزلقين ف و ك، ويسأل: ماذا يحدث للرأس عند تغيير ف و ك؟ ويلاحظ الطالب أن الرأس هو (ف، ك).", "1. التهيئة: يعرض المعلم على GeoGebra ص = (س − ف)² + ك بمنزلقين ف و ك، ويسأل: ماذا يحدث للرأس عند تغيير ف و ك؟ ويلاحظ الطالب أن الرأس هو (ف، ك) (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يتيح المعلم للطلبة تحريك المنزلقين وتسجيل إحداثيات الرأس في جدول، ويستنتج الطالب العلاقة بين الصيغة والرأس (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم: ص = س² − 4س − 5 = (س − 2)² − 9 ← الرأس (2، −9)، محور التماثل س = 2، نقطة صغرى، ويطبق الطالب على ص = −2س² + 8س − 3 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم تحديد الرأس ونوعه لعدة دوال مكتوبة بصورة مكتملة، ويجيب الطالب على السبورة الصغيرة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. النمذجة: ينمذج المعلم رسم ص = س² − 4س − 5: الرأس (2، −9)، المقطعان السينيان −1 و 5، المقطع الصادي −5، والمدى ص ≥ −9، ويرسم الطالب المنحنى في دفتره (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعلم تعاوني: يوزع المعلم دوالًا مختلفة على المجموعات لترسمها وتعلقها (بعضها لا يقطع محور السينات)، وترسم المجموعة وتكتب النقاط المميزة والمدى (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. تقويم تكويني: يعرض المعلم رسمًا فيه خطأ في اتجاه الفتحة ويطلب التصحيح، ويكتشف الطالب الخطأ ويصححه (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-2: الأسئلة 4–6، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] ما رأس منحنى ص = (س + 1)² + 4؟\nالإجابة النموذجية: (−1، 4)، نقطة صغرى\n2) [مستوى التطبيق] ما رأس منحنى ص = −2س² + 8س − 3؟\nالإجابة النموذجية: −2(س − 2)² + 5 ← (2، 5) نقطة عظمى\n3) [مستوى الاستدلال] اكتب معادلة محور التماثل لـ ص = 3(س − 5)² − 1.\nالإجابة النموذجية: س = 5\n\n4) [مستوى المعرفة] أوجد المقطعين السينيين لـ ص = س² − 2س − 8.\nالإجابة النموذجية: س = 4 و س = −2\n5) [مستوى التطبيق] أوجد المقطع الصادي لـ ص = 2س² − 3س + 7.\nالإجابة النموذجية: 7\n6) [مستوى الاستدلال] ما مدى الدالة د(س) = (س − 1)² + 3؟\nالإجابة النموذجية: د(س) ≥ 3", "1) [مستوى المعرفة] أكمل: رأس منحنى ص = (س − 2)² − 9 هو (2، ___)\nالإجابة النموذجية: −9\n2) [مستوى التطبيق] أوجد رأس منحنى ص = س² + 6س + 11.\nالإجابة النموذجية: (س + 3)² + 2 ← (−3، 2)\n3) [مستوى الاستدلال] أوجد معادلة محور التماثل ونوع الرأس لـ ص = 5 − 4س − س².\nالإجابة النموذجية: 9 − (س + 2)² ← س = −2، نقطة عظمى (−2، 9)\n\n4) [مستوى المعرفة] أكمل: منحنى ص = س² + 2س + 5 لا يقطع محور السينات لأن رأسه (−1، ___) فوق المحور.\nالإجابة النموذجية: 4\n5) [مستوى التطبيق] ارسم ص = −(س − 1)² + 4 موضحًا الرأس والمقاطع.\nالإجابة النموذجية: الرأس (1، 4)، المقطعان السينيان −1 و 3، المقطع الصادي 3\n6) [مستوى الاستدلال] أوجد مدى د(س) = 2س² + 4س − 1.\nالإجابة النموذجية: 2(س + 1)² − 3 ← د(س) ≥ −3", "للطالب: تمارين 1-2: الأسئلة 1–3 (كتاب الطالب ص25–29، كتاب النشاط ص17–21).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 1-2: الأسئلة 4–6 (كتاب الطالب ص25–29، كتاب النشاط ص17–21).\nلولي الأمر: متابعة تقدم الابن/الابنة في «رسم منحنى الدالة التربيعية بتحديد المقاطع والرأس» والتواصل مع المعلم عند ملاحظة صعوبة متكررة د الواجب: تمارين 1-4: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] حل: س² + 3س − 1 = 0 بصورة دقيقة.\nالإجابة النموذجية: (−3 ± √13) ÷ 2\n2) [مستوى التطبيق] قرّب حلول السؤال السابق لثلاثة أرقام معنوية.\nالإجابة النموذجية: 0.303 و −3.30\n3) [مستوى الاستدلال] ما قيمة ما تحت الجذر في صيغة حل 2س² − 5س − 1 = 0؟\nالإجابة النموذجية: 25 + 8 = 33", "1) [مستوى المعرفة] أكمل: في الصيغة التربيعية المقام يساوي ___\nالإجابة النموذجية: 2أ\n2) [مستوى التطبيق] حل: س² − 4س + 1 = 0.\nالإجابة النموذجية: 2 ± √3\n3) [مستوى الاستدلال] حل: 5س² + 2س − 1 = 0 مقربًا لثلاثة أرقام معنوية.\nالإجابة النموذجية: (−2 ± √24) ÷ 10 ≈ 0.290 أو −0.690", "للطالب: تمارين 1-4: الأسئلة 1–3 (كتاب الطالب ص32–33، كتاب النشاط ص24–26).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «اشتقاق الصيغة التربيعية واستخدامها».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=4"]}, {"ax": "اختيار طريقة الحل المناسبة وتطبيقات الصيغة التربيعية", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يختار الطريقة الأنسب للحل (تحليل، إكمال مربع، صيغة).\n2) يحل مسائل حياتية بالصيغة التربيعية.\nمخرج تعليمي آخر: يفسر الحلول في السياق ويستبعد غير المقبول.", "المخرج 1: تقييم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "اختيار الاستراتيجية، النمذجة، الحلول المقبولة، التقريب المناسب.", "يعرض المعلم ثلاث معادلات ويسأل: أي طريقة تختار لكل منها ولماذا؟ ويبرر الطالب اختياره.", "1. التهيئة: يعرض المعلم ثلاث معادلات ويسأل: أي طريقة تختار لكل منها ولماذا؟ ويبرر الطالب اختياره (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يعرض المعلم: مستطيل طوله يزيد على عرضه 3 سم ومساحته 20 سم². أوجد العرض لثلاثة أرقام معنوية، ويكتب الطالب س² + 3س − 20 = 0 ← س ≈ 3.22 سم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم مسائل حياتية (ارتفاع مقذوف ع = 15ن − 4.9ن²) لإيجاد زمن الوصول لارتفاع 10 م، وتحل: 4.9ن² − 15ن + 10 = 0 ← ن ≈ 0.981 أو 2.08 ث (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم تفسير وجود زمنين في مسألة المقذوف، ويفسر الطالب: صاعدًا ونازلًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-4 ومحور «اختيار طريقة الحل المناسبة وتطبيقات الصيغة التربيعية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-4: الأسئلة 4–6، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] مستطيل عرضه س وطوله س + 3 ومساحته 20. أوجد س.\nالإجابة النموذجية: س ≈ 3.22\n2) [مستوى التطبيق] لماذا يوجد زمنان للوصول لارتفاع 10 م؟\nالإجابة النموذجية: مرة أثناء الصعود ومرة أثناء الهبوط.\n3) [مستوى الاستدلال] أي طريقة تختار لحل س² − 5س + 6 = 0؟\nالإجابة النموذجية: التحليل إلى عوامل لأنه أسرع.", "1) [مستوى المعرفة] أكمل: نستخدم الصيغة التربيعية عندما لا يمكن ___ المعادلة بسهولة.\nالإجابة النموذجية: تحليل\n2) [مستوى التطبيق] حل: ن² − 6ن + 4 = 0 لثلاثة أرقام معنوية.\nالإجابة النموذجية: 3 ± √5 ← 5.24 أو 0.764\n3) [مستوى الاستدلال] مقذوف ع = 20ن − 5ن². متى يكون ارتفاعه 12 م؟\nالإجابة النموذجية: 5ن² − 20ن + 12 = 0 ← ن ≈ 0.735 أو 3.26 ث", "للطالب: تمارين 1-4: الأسئلة 4–6 (كتاب الطالب ص32–33، كتاب النشاط ص24–26).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=4"]}]}, {"id": "1-5", "title": "حلّ المعادلات الآنية (معادلة خطية ومعادلة تربيعية)", "p": [{"ax": "الحل بالتعويض لأنظمة بسيطة", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يعزل متغيرًا في المعادلة الخطية ويعوضه في التربيعية.\n2) يحل المعادلة الناتجة ويجد الأزواج المرتبة.\nمخرج تعليمي آخر: يفسر الحلول بيانيًا بنقاط التقاطع.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المعادلات الآنية، التعويض، الأزواج المرتبة، نقاط التقاطع.", "يعرض المعلم بيانيًا دائرة ومستقيمًا متقاطعين ويسأل: كم حلًا للنظام؟ ويعد الطالب نقاط التقاطع.", "1. التهيئة: يعرض المعلم بيانيًا دائرة ومستقيمًا متقاطعين ويسأل: كم حلًا للنظام؟ ويعد الطالب نقاط التقاطع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: س + ص = 4، س² + ص² = 10 ← 2س² − 8س + 6 = 0 ← (1، 3) و (3، 1)، ويتابع الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يكلف المعلم بحل: ص = 2س − 3، س² − س ص = −4، ويجد الطالب: س² − 3س − 4 = 0 ← (4، 5) و (−1، −5) (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطلب المعلم التحقق من الحلول بالتعويض في المعادلتين، ويتحقق الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] حل: س + ص = 4، س² + ص² = 10.\nالإجابة النموذجية: (1، 3) و (3، 1)\n2) [مستوى التطبيق] حل: ص = 2س − 3، س² − س ص = −4.\nالإجابة النموذجية: (4، 5) و (−1، −5)\n3) [مستوى الاستدلال] تحقق من (4، 5) في س² − س ص = −4.\nالإجابة النموذجية: 16 − 20 = −4 ✓", "1) [مستوى المعرفة] أكمل: من س + ص = 4 نكتب ص = ___\nالإجابة النموذجية: 4 − س\n2) [مستوى التطبيق] حل: ص = س + 1، س² + ص² = 25.\nالإجابة النموذجية: (3، 4) و (−4، −3)\n3) [مستوى الاستدلال] حل: س − ص = 2، س ص = 15.\nالإجابة النموذجية: (5، 3) و (−3، −5)", "للطالب: تمارين 1-5: الأسئلة 1–3 (كتاب الطالب ص34–36، كتاب النشاط ص27–31).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الحل بالتعويض لأنظمة بسيطة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=5"]}, {"ax": "أنظمة أكثر تعقيدًا وحلول غير صحيحة", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحل أنظمة تتطلب عزل متغير بمعامل لا يساوي 1.\n2) يستخدم الصيغة التربيعية عند الحاجة ويقرب الحلول.\nمخرج تعليمي آخر: يحلل الأنظمة التي ليس لها حل حقيقي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "العزل، الكسور، الصيغة التربيعية، عدم وجود حل حقيقي.", "يسأل المعلم: من 2س + 3ص = 7 أي متغير أسهل للعزل؟ ويناقش الطالب ويختار.", "1. التهيئة: يسأل المعلم: من 2س + 3ص = 7 أي متغير أسهل للعزل؟ ويناقش الطالب ويختار (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س + ص = 5، س² + س ص = 6 ← ص = 5 − 2س ← س² − 5س + 6 = 0 ← (2، 1) و (3، −1)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: ص = س + 2، س² + 2ص² = 10 (حلول غير صحيحة)، و ص = س + 5، س² + ص² = 4 (لا حل)، وتحل: 3س² + 8س − 2 = 0 ← س ≈ 0.230 أو −2.90؛ والثاني 2س² + 10س + 21 = 0 مميّزها سالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يسأل المعلم: ماذا يعني بيانيًا عدم وجود حل؟ ويقوم الطالب بالمستقيم لا يقطع المنحنى (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-5 ومحور «أنظمة أكثر تعقيدًا وحلول غير صحيحة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-5: الأسئلة 4–7، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حل: 2س + ص = 5، س² + س ص = 6.\nالإجابة النموذجية: (2، 1) و (3، −1)\n2) [مستوى التطبيق] هل للنظام ص = س + 5، س² + ص² = 4 حل؟\nالإجابة النموذجية: لا؛ المميّز 100 − 168 < 0\n3) [مستوى الاستدلال] حل: س + 2ص = 3، س² + ص² = 5.\nالإجابة النموذجية: س = 3 − 2ص ← 5ص² − 12ص + 4 = 0 ← (−1، 2) و (11/5، 2/5)", "1) [مستوى المعرفة] أكمل: عدم وجود حل يعني أن المستقيم ___ المنحنى.\nالإجابة النموذجية: لا يقطع\n2) [مستوى التطبيق] حل: 3س − ص = 1، س ص = 2.\nالإجابة النموذجية: ص = 3س − 1 ← 3س² − س − 2 = 0 ← (1، 2) و (−2/3، −3)\n3) [مستوى الاستدلال] حل: ص = س + 2، س² + 2ص² = 10 لثلاثة أرقام معنوية.\nالإجابة النموذجية: س ≈ 0.230، ص ≈ 2.23؛ س ≈ −2.90، ص ≈ −0.897", "للطالب: تمارين 1-5: الأسئلة 4–7 (كتاب الطالب ص34–36، كتاب النشاط ص27–31).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=5"]}]}, {"id": "1-6", "title": "حلّ معادلات تربيعية أكثر تعقيدًا", "p": [{"ax": "المعادلات في صورة تربيعية مقنّعة (س⁴، √س)", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يتعرف المعادلة التربيعية المقنّعة.\n2) يحل المعادلة باستخدام تعويض مناسب مثل ص = س² أو ص = √س.\nمخرج تعليمي آخر: يستبعد الحلول غير المقبولة بعد الرجوع للمتغير الأصلي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المعادلة التربيعية المقنّعة، التعويض بمتغير جديد، الرجوع للمتغير الأصلي، الحلول الدخيلة.", "يكتب المعلم س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟ ويلاحظ الطالب ص² − 5ص + 4 = 0.", "1. التهيئة: يكتب المعلم س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟ ويلاحظ الطالب ص² − 5ص + 4 = 0 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: س⁴ − 5س² + 4 = 0 ← ص = س² ← (ص − 1)(ص − 4) = 0 ← س = ±1، ±2، ويتابع الطالب ويكمل الرجوع للمتغير (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يحل المعلم: س − 5√س + 6 = 0 ← ص = √س ← ص = 2، 3 ← س = 4، 9، ويتحقق، ويحل الطالب مسألة مشابهة: س − √س − 2 = 0 ← س = 4 فقط (نرفض √س = −1) (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يسأل المعلم: لماذا رفضنا √س = −1؟ والطالب: لأن الجذر التربيعي الموجب لا يكون سالبًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] حل: س⁴ − 10س² + 9 = 0.\nالإجابة النموذجية: س² = 1 أو 9 ← س = ±1، ±3\n2) [مستوى التطبيق] حل: س − 5√س + 6 = 0.\nالإجابة النموذجية: س = 4 أو 9\n3) [مستوى الاستدلال] حل: س − √س − 2 = 0.\nالإجابة النموذجية: √س = 2 (نرفض −1) ← س = 4", "1) [مستوى المعرفة] أكمل: في س⁴ − 5س² + 4 = 0 نعوض ص = ___\nالإجابة النموذجية: س²\n2) [مستوى التطبيق] حل: س⁴ − 3س² − 4 = 0.\nالإجابة النموذجية: س² = 4 أو −1 (مرفوض) ← س = ±2\n3) [مستوى الاستدلال] حل: 2س − 7√س + 3 = 0.\nالإجابة النموذجية: √س = 3 أو 1/2 ← س = 9 أو 1/4", "للطالب: تمارين 1-6: الأسئلة 1–4 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «المعادلات في صورة تربيعية مقنّعة (س⁴، √س)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=6"]}, {"ax": "معادلات بمقلوبات أو بعبارات مركبة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحول معادلة فيها 1/س أو 1/س² إلى تربيعية.\n2) يحل معادلات من الصورة (عبارة)² + ب(عبارة) + جـ = 0.\nمخرج تعليمي آخر: يختار التعويض الأنسب ويبرره.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المقلوب، الضرب في المقام المشترك، التعويض بعبارة، القيود على المجال.", "يسأل المعلم: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟ ويقترح الطالب الضرب في س².", "1. التهيئة: يسأل المعلم: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟ ويقترح الطالب الضرب في س² (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 6/س² − 5/س + 1 = 0 ← س² − 5س + 6 = 0 ← س = 2، 3 (س ≠ 0)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: (س² + 1)² − 7(س² + 1) + 10 = 0، و (2س − 1)² − 5(2س − 1) + 6 = 0، وتحل: س² + 1 = 2 أو 5 ← س = ±1، ±2؛ 2س − 1 = 2 أو 3 ← س = 3/2، 2 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يكلف المعلم بسؤال من تمارين 1-6 فرديًا، ويحل الطالب ويعرض (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-6 ومحور «معادلات بمقلوبات أو بعبارات مركبة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-6: الأسئلة 5–8، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حل: 6/س² − 5/س + 1 = 0.\nالإجابة النموذجية: س = 2 أو 3\n2) [مستوى التطبيق] حل: (س² + 1)² − 7(س² + 1) + 10 = 0.\nالإجابة النموذجية: س = ±1، ±2\n3) [مستوى الاستدلال] حل: (2س − 1)² − 5(2س − 1) + 6 = 0.\nالإجابة النموذجية: س = 3/2 أو 2", "1) [مستوى المعرفة] أكمل: في (س² + 1)² − 7(س² + 1) + 10 = 0 نعوض ص = ___\nالإجابة النموذجية: س² + 1\n2) [مستوى التطبيق] حل: س + 6/س = 5.\nالإجابة النموذجية: س² − 5س + 6 = 0 ← س = 2 أو 3\n3) [مستوى الاستدلال] حل: 1/س² − 3/س − 4 = 0.\nالإجابة النموذجية: نضرب في س²: 1 − 3س − 4س² = 0 ← 4س² + 3س − 1 = 0 ← س = 1/4 أو −1", "للطالب: تمارين 1-6: الأسئلة 5–8 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «معادلات بمقلوبات أو بعبارات مركبة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=6"]}]}, {"id": "1-7", "title": "حلّ المتباينات التربيعية", "p": [{"ax": "حل المتباينات التربيعية بالقيم الحرجة والرسم", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد القيم الحرجة للمتباينة التربيعية.\n2) يستخدم الرسم التخطيطي لتحديد مجموعة الحل.\nمخرج تعليمي آخر: يكتب مجموعة الحل بالصيغة المناسبة (فترة واحدة أو فترتان).", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتباينة التربيعية، القيم الحرجة، الرسم التخطيطي، مجموعة الحل.", "يسأل المعلم: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟ ويحدد الطالب ±2 للمعادلة وفترة للمتباينة.", "1. التهيئة: يسأل المعلم: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟ ويحدد الطالب ±2 للمعادلة وفترة للمتباينة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س² + 5س − 3 < 0 ← (2س − 1)(س + 3) < 0 ← −3 < س < 1/2؛ و س² − 4س − 12 ≥ 0 ← س ≤ −2 أو س ≥ 6، ويرسم الطالب المنحنى ويقرأ الحل (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يكلف المعلم بـ: 6 − س − س² > 0 و 3س² ≤ 2س + 8، ويحل الطالب: −3 < س < 2؛ (3س + 4)(س − 2) ≤ 0 ← −4/3 ≤ س ≤ 2 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يعرض المعلم حلولًا ويطلب الحكم عليها، ويحكم الطالب ويبرر (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-7: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] حل: 2س² + 5س − 3 < 0.\nالإجابة النموذجية: −3 < س < 1/2\n2) [مستوى التطبيق] حل: س² − 4س − 12 ≥ 0.\nالإجابة النموذجية: س ≤ −2 أو س ≥ 6\n3) [مستوى الاستدلال] حل: 3س² ≤ 2س + 8.\nالإجابة النموذجية: −4/3 ≤ س ≤ 2", "1) [مستوى المعرفة] أكمل: حل (س − 1)(س − 4) > 0 هو س < 1 أو س > ___\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] حل: 6 − س − س² > 0.\nالإجابة النموذجية: −3 < س < 2\n3) [مستوى الاستدلال] حل: س² + 2س > 15.\nالإجابة النموذجية: (س + 5)(س − 3) > 0 ← س < −5 أو س > 3", "للطالب: تمارين 1-7: الأسئلة 1–4 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «حل المتباينات التربيعية بالقيم الحرجة والرسم».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=7"]}, {"ax": "متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل متباينة تربيعية قيمها الحرجة غير صحيحة باستخدام الصيغة التربيعية.\n2) يحل متباينات ناتجة عن شروط المميّز.\nمخرج تعليمي آخر: يحل نظامًا من متباينة خطية وأخرى تربيعية.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "القيم الحرجة الجذرية، متباينة المميّز، تقاطع مجموعتي الحل.", "يسأل المعلم: ما القيم الحرجة لـ س² − 2س − 1 < 0؟ ويستخدم الطالب الصيغة: 1 ± √2.", "1. التهيئة: يسأل المعلم: ما القيم الحرجة لـ س² − 2س − 1 < 0؟ ويستخدم الطالب الصيغة: 1 ± √2 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: س² − 2س − 1 < 0 ← 1 − √2 < س < 1 + √2؛ ثم: قيم ك التي تجعل س² + ك س + ك + 3 = 0 لها جذران حقيقيان ← ك² − 4ك − 12 ≥ 0 ← ك ≤ −2 أو ك ≥ 6، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم نظامًا: س² − 5س + 4 < 0 و 2س − 5 > 0، وتجد: 1 < س < 4 و س > 2.5 ← 2.5 < س < 4 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يكلف المعلم بسؤال متقدم من تمارين 1-7، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-7 ومحور «متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-7: الأسئلة 5–9، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حل: س² − 2س − 1 < 0.\nالإجابة النموذجية: 1 − √2 < س < 1 + √2\n2) [مستوى التطبيق] أوجد قيم ك لكي يكون لـ س² + ك س + ك + 3 = 0 جذران حقيقيان.\nالإجابة النموذجية: ك ≤ −2 أو ك ≥ 6\n3) [مستوى الاستدلال] حل النظام: س² − 5س + 4 < 0، 2س − 5 > 0.\nالإجابة النموذجية: 2.5 < س < 4", "1) [مستوى المعرفة] أكمل: القيمتان الحرجتان لـ س² − 2س − 1 = 0 هما 1 ± ___\nالإجابة النموذجية: √2\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل ك س² + 2س + ك = 0 بلا جذور حقيقية (ك ≠ 0).\nالإجابة النموذجية: 4 − 4ك² < 0 ← ك < −1 أو ك > 1\n3) [مستوى الاستدلال] حل: س² ≥ 3، س < 5.\nالإجابة النموذجية: س ≤ −√3 أو √3 ≤ س < 5", "للطالب: تمارين 1-7: الأسئلة 5–9 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=7"]}]}, {"id": "1-8", "title": "التقاطع بين المستقيم ومنحنى الدالة التربيعية", "p": [{"ax": "نقاط التقاطع وعددها باستخدام المميّز", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد نقاط تقاطع مستقيم ومنحنى تربيعي.\n2) يحدد عدد نقاط التقاطع بالمميّز.\nمخرج تعليمي آخر: يميّز المماس من القاطع.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "القاطع، المماس، نقطة التماس، المميّز، عدد نقاط التقاطع.", "يعرض المعلم على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟ ويلاحظ الطالب وجود قيمتين للميل يحدث عندهما التماس.", "1. التهيئة: يعرض المعلم على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟ ويلاحظ الطالب وجود قيمتين للميل يحدث عندهما التماس (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ص = س² − 3س + 4، ص = س + 1 ← س² − 4س + 3 = 0 ← (1، 2) و (3، 4)؛ ثم ص = 2س − 1 مع ص = س² ← (س − 1)² = 0 مماس عند (1، 1)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تطبيق موجّه: يكلف المعلم بتحديد عدد نقاط تقاطع ص = 3س − 5 مع ص = س² + س − 2 بالمميّز، والطالب: س² − 2س + 3 = 0، المميّز −8 < 0، لا تقاطع (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم تصنيف ثلاثة أزواج (قاطع، مماس، لا يقطع)، ويصنف الطالب بالمميّز (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-8: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] أوجد تقاطع ص = س² − 3س + 4 و ص = س + 1.\nالإجابة النموذجية: (1، 2) و (3، 4)\n2) [مستوى التطبيق] بيّن أن ص = 2س − 1 مماس لـ ص = س².\nالإجابة النموذجية: س² − 2س + 1 = 0، المميّز 0\n3) [مستوى الاستدلال] كم نقطة تقاطع بين ص = 3س − 5 و ص = س² + س − 2؟\nالإجابة النموذجية: لا توجد؛ المميّز −8", "1) [مستوى المعرفة] أكمل: إذا كان المميّز صفرًا فالمستقيم ___ للمنحنى.\nالإجابة النموذجية: مماس\n2) [مستوى التطبيق] أوجد تقاطع ص = 2س + 3 و ص = س² − 2س + 3.\nالإجابة النموذجية: س² − 4س = 0 ← (0، 3) و (4، 11)\n3) [مستوى الاستدلال] أوجد نقطة تماس ص = 4س − 4 مع ص = س².\nالإجابة النموذجية: (2، 4)", "للطالب: تمارين 1-8: الأسئلة 1–4 (كتاب الطالب ص43–46، ومراجعة الوحدة ص47–50، كتاب النشاط ص43–45، ومراجعة الوحدة ص46–52).\nلولي الأمر: متابعة تقدم الابن/الابنة في «نقاط التقاطع وعددها باستخدام المميّز» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=8"]}, {"ax": "إيجاد قيم ثابت بشرط التماس أو التقاطع ومراجعة الوحدة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد قيم الثابت التي تجعل المستقيم مماسًا للمنحنى.\n2) يجد مدى قيم الثابت لعدد معين من نقاط التقاطع.\nمخرج تعليمي آخر: يربط مفاهيم الوحدة الأولى في حل مسائل المراجعة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "شرط التماس، شرط التقاطع، المتباينة في الثابت، مراجعة الوحدة.", "يسأل المعلم: ص = ك س − 3 يمس ص = س² + 1، ما المعادلة الناتجة في س؟ ويكتب الطالب س² − ك س + 4 = 0.", "1. التهيئة: يسأل المعلم: ص = ك س − 3 يمس ص = س² + 1، ما المعادلة الناتجة في س؟ ويكتب الطالب س² − ك س + 4 = 0 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ك² − 16 = 0 ← ك = ±4، ونقطتا التماس (2، 5) و (−2، 5)، ويتابع الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: ص = س + ك يقطع ص = 2س² − 3س + 4 في نقطتين؛ وأسئلة من مراجعة نهاية الوحدة ص47–50، وتحل: 2س² − 4س + 4 − ك = 0 ← 16 − 8(4 − ك) > 0 ← ك > 2 (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يقدم المعلم بطاقة «أستطيع أن...» لمفاهيم الوحدة، ويقيم الطالب نفسه (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-8 ومحور «إيجاد قيم ثابت بشرط التماس أو التقاطع ومراجعة الوحدة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-8: الأسئلة 5–9، وتمارين مراجعة نهاية الوحدة ص47–50، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد ك إذا كان ص = ك س − 3 مماسًا لـ ص = س² + 1.\nالإجابة النموذجية: ك = ±4\n2) [مستوى التطبيق] أوجد قيم ك لكي يقطع ص = س + ك المنحنى ص = 2س² − 3س + 4 في نقطتين.\nالإجابة النموذجية: ك > 2\n3) [مستوى الاستدلال] أوجد نقطة التماس عندما ك = 4.\nالإجابة النموذجية: س² − 4س + 4 = 0 ← (2، 5)", "1) [مستوى المعرفة] أكمل: شرط أن يقطع المستقيم المنحنى في نقطتين هو المميّز ___ 0\nالإجابة النموذجية: >\n2) [مستوى التطبيق] أوجد ك إذا كان ص = 2س + ك مماسًا لـ ص = س² − 4س + 3.\nالإجابة النموذجية: س² − 6س + 3 − ك = 0 ← 36 − 4(3 − ك) = 0 ← ك = −6\n3) [مستوى الاستدلال] أوجد قيم م لكي لا يقطع ص = م س المنحنى ص = س² + 9.\nالإجابة النموذجية: م² − 36 < 0 ← −6 < م < 6", "للطالب: تمارين 1-8: الأسئلة 5–9، وتمارين مراجعة نهاية الوحدة ص47–50 (كتاب الطالب ص43–46، ومراجعة الوحدة ص47–50، كتاب النشاط ص43–45، ومراجعة الوحدة ص46–52).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=8"]}]}, {"id": "2-1", "title": "تعريف الدالة", "p": [{"ax": "الدالة وأنواع التطابق والمجال والمدى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يميّز الدالة باستخدام المخطط السهمي واختبار المستقيم الرأسي.\n2) يصنف الدوال: واحد إلى واحد، متعدد إلى واحد.\nمخرج تعليمي آخر: يستخدم الرمز د: س ↦ ... ويحسب الصور.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات منحنيات", "الدالة، المجال، المجال المقابل، المدى، واحد إلى واحد، متعدد إلى واحد، اختبار المستقيم الرأسي والأفقي.", "يسأل المعلم: هل كل علاقة دالة؟ يعرض علاقة «الطالب ← أرقام هواتف أقاربه» ويناقش، ويستنتج الطالب شرط الصورة الوحيدة.", "1. التهيئة: يسأل المعلم: هل كل علاقة دالة؟ يعرض علاقة «الطالب ← أرقام هواتف أقاربه» ويناقش، ويستنتج الطالب شرط الصورة الوحيدة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرّف المعلم الدالة والمجال والمدى، ويعرض أمثلة بمخططات سهمية ومنحنيات، ويطبق اختبار المستقيم الرأسي والأفقي، ويصنف الطالب الأمثلة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم بطاقات منحنيات (قطع مكافئ، دائرة، مستقيم، س = ص²) لتصنيفها، وتصنف المجموعة وتبرر (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطرح المعلم: د: س ↦ 3 − 2س، أوجد د(−1) و د(1/2)، ويحسب الطالب: 5 و 2 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] هل المنحنى س = ص² يمثل ص دالة في س؟\nالإجابة النموذجية: لا؛ المستقيم س = 4 يقطعه في نقطتين.\n2) [مستوى التطبيق] صنف الدالة د(س) = س³.\nالإجابة النموذجية: واحد إلى واحد\n3) [مستوى الاستدلال] أوجد د(3) إذا كان د: س ↦ س² − 2س.\nالإجابة النموذجية: 3", "1) [مستوى المعرفة] أكمل: الدالة التي تحقق اختبار المستقيم الأفقي تسمى ___\nالإجابة النموذجية: واحدًا إلى واحد\n2) [مستوى التطبيق] صنف د(س) = (س − 1)²، س ∈ ح.\nالإجابة النموذجية: متعدد إلى واحد\n3) [مستوى الاستدلال] أوجد قيم س التي تجعل د(س) = 8 حيث د(س) = س² − 2س.\nالإجابة النموذجية: س² − 2س − 8 = 0 ← س = 4 أو −2", "للطالب: تمارين 2-1: الأسئلة 1–4 (كتاب الطالب ص51–56، كتاب النشاط ص53–58).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الدالة وأنواع التطابق والمجال والمدى».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=9"]}, {"ax": "مدى الدوال ذات المجال المحدد باستخدام الإكمال إلى مربع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحدد مدى دالة خطية ذات مجال محدد.\n2) يستخدم الإكمال إلى مربع لتحديد مدى دالة تربيعية ذات مجال محدد.\nمخرج تعليمي آخر: يحدد مجال ومدى دوال نسبية وجذرية بسيطة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المجال المحدد، المدى، القيمة الصغرى داخل المجال، الدالة النسبية، الدالة الجذرية.", "يسأل المعلم: ما أصغر قيمة لـ (س − 2)² + 3؟ وهل تتغير الإجابة إذا كان المجال 3 ≤ س ≤ 5؟ ويلاحظ الطالب أن الرأس قد يقع خارج المجال.", "1. التهيئة: يسأل المعلم: ما أصغر قيمة لـ (س − 2)² + 3؟ وهل تتغير الإجابة إذا كان المجال 3 ≤ س ≤ 5؟ ويلاحظ الطالب أن الرأس قد يقع خارج المجال (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = س² − 4س + 7، 0 ≤ س ≤ 5 ← (س − 2)² + 3 ← المدى 3 ≤ د(س) ≤ 12؛ وعندما 3 ≤ س ≤ 5 ← 4 ≤ د(س) ≤ 12، ويرسم الطالب ويقرأ المدى (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: د(س) = 2س − 1، 1 ≤ س ≤ 4؛ هـ(س) = 1 ÷ (س − 3)؛ ك(س) = √(2س − 4) + 1، وتجد: 1 ≤ د ≤ 7؛ مجال هـ س ≠ 3 ومداها هـ ≠ 0؛ مجال ك س ≥ 2 ومداها ك ≥ 1 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم مدى د(س) = 5 − (س + 1)²، −3 ≤ س ≤ 1، ويقوم الطالب بالمدى 1 ≤ د(س) ≤ 5 (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-1 ومحور «مدى الدوال ذات المجال المحدد باستخدام الإكمال إلى مربع»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-1: الأسئلة 5–9، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد مدى د(س) = س² − 4س + 7، 0 ≤ س ≤ 5.\nالإجابة النموذجية: 3 ≤ د(س) ≤ 12\n2) [مستوى التطبيق] أوجد مدى د(س) = 5 − (س + 1)²، −3 ≤ س ≤ 1.\nالإجابة النموذجية: 1 ≤ د(س) ≤ 5\n3) [مستوى الاستدلال] ما مجال د(س) = √(2س − 4) + 1؟\nالإجابة النموذجية: س ≥ 2", "1) [مستوى المعرفة] أكمل: مدى د(س) = 2س − 1 عندما 1 ≤ س ≤ 4 هو 1 ≤ د(س) ≤ ___\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] أوجد مدى د(س) = س² + 6س + 10، س ∈ ح.\nالإجابة النموذجية: (س + 3)² + 1 ← د(س) ≥ 1\n3) [مستوى الاستدلال] أوجد مدى د(س) = س² − 4س + 7 عندما 3 ≤ س ≤ 5.\nالإجابة النموذجية: 4 ≤ د(س) ≤ 12", "للطالب: تمارين 2-1: الأسئلة 5–9 (كتاب الطالب ص51–56، كتاب النشاط ص53–58).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مدى الدوال ذات المجال المحدد باستخدام الإكمال إلى مربع» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=9"]}]}, {"id": "2-2", "title": "الدوال المركّبة", "p": [{"ax": "تكوين الدالة المركّبة وحساب قيمها", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يكوّن الدالة المركّبة د هـ(س) = د(هـ(س)).\n2) يحسب قيمًا عددية لدوال مركّبة.\nمخرج تعليمي آخر: يوضح أن تركيب الدوال ليس إبداليًا.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الدالة المركّبة د هـ، ترتيب التطبيق، عدم الإبدال، تركيب الدالة مع نفسها.", "يطلب المعلم تطبيق «اضرب في 2 ثم أضف 3» و«ربّع ثم اطرح 1» على العدد 2 بترتيبين، ويحصل الطالب على 48 و 9.", "1. التهيئة: يطلب المعلم تطبيق «اضرب في 2 ثم أضف 3» و«ربّع ثم اطرح 1» على العدد 2 بترتيبين، ويحصل الطالب على 48 و 9 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = س² ج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "شرط التركيب، مجال الدالة المركّبة، مدى الدالة المركّبة، معادلة التركيب.", "يسأل المعلم: د(س) = √س، هـ(س) = س − 5. هل يمكن حساب د(هـ(2))؟ ويجد الطالب هـ(2) = −3 ولا جذر حقيقي لها.", "1. التهيئة: يسأل المعلم: د(س) = √س، هـ(س) = س − 5. هل يمكن حساب د(هـ(2))؟ ويجد الطالب هـ(2) = −3 ولا جذر حقيقي لها (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يوضح المعلم الشرط: مدى هـ ⊆ مجال د، ويجد مجال د(هـ(س)) = √(س − 5): س ≥ 5 ومداها ≥ 0، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم معادلات: هـ(د(س)) = 9 (حيث د = س² − 1، هـ = 2س + 3)، و د(هـ(س)) = 0، وتحل: 2س² + 1 = 9 ← س = ±2؛ (2س + 3)² = 1 ← س = −1 أو −2 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم مدى د(هـ(س)) حيث د(س) = س²، هـ(س) = س − 1، 0 ≤ س ≤ 3، والطالب: هـ من −1 إلى 2، المدى 0 ≤ د(هـ) ≤ 4 (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-2 ومحور «مجال الدالة المركّبة ومداها وحل المعادلات»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-2: الأسئلة 5–8، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما مجال √(س − 5)؟\nالإجابة النموذجية: س ≥ 5\n2) [مستوى التطبيق] حل هـ(د(س)) = 9 حيث د(س) = س² − 1، هـ(س) = 2س + 3.\nالإجابة النموذجية: س = ±2\n3) [مستوى الاستدلال] حل د(هـ(س)) = 0 للدالتين نفسيهما.\nالإجابة النموذجية: (2س + 3)² = 1 ← س = −1 أو −2", "1) [مستوى المعرفة] أكمل: تُعرّف د(هـ(س)) إذا كان مدى هـ ضمن ___ د\nالإجابة النموذجية: مجال\n2) [مستوى التطبيق] د(س) = √(س + 4)، هـ(س) = س² − 8. حل د(هـ(س)) = 3.\nالإجابة النموذجية: س² − 4 = 9 ← س = ±√13\n3) [مستوى الاستدلال] أوجد مدى د(هـ(س)) حيث د(س) = س²، هـ(س) = س − 1، 0 ≤ س ≤ 3.\nالإجابة النموذجية: 0 ≤ د(هـ(س)) ≤ 4", "للطالب: تمارين 2-2: الأسئلة 5–8 (كتاب الطالب ص57–61، كتاب النشاط ص59–61).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=10"]}]}, {"id": "2-3", "title": "الدوال العكسية", "p": [{"ax": "شرط وجود الدالة العكسية وإيجاد معكوس الدوال الخطية والنسبية", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يذكر شرط وجود الدالة العكسية.\n2) يجد معكوس دوال خطية ونسبية.\nمخرج تعليمي آخر: يتحقق من أن د(د⁻¹(س)) = د⁻¹(د(س)) = س.", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الدالة العكسية د⁻¹، واحد إلى واحد، تبادل المجال والمدى، التحقق بالتركيب.", "يسأل المعلم: ما العملية العكسية لـ «اضرب في 3 ثم اطرح 4»؟ ويكتب الطالب: أضف 4 ثم اقسم على 3.", "1. التهيئة: يسأل المعلم: ما العملية العكسية لـ «اضرب في 3 ثم اطرح 4»؟ ويكتب الطالب: أضف 4 ثم اقسم على 3 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = 3س − 4 ← د⁻¹(س) = (س + 4) ÷ 3؛ و د(س) = (2س + 1) ÷ (س − 3) ← د⁻¹(س) = (3س + 1) ÷ (س − 2)، ويتابع الطالب خطوات الجبر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم معكوس د(س) = 5 ÷ (س + 1) والتحقق بالتركيب، ويجد الطالب د⁻¹(س) = 5 ÷ س − 1 ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطرح المعلم: ما مجال د⁻¹ للدالة (2س + 1) ÷ (س − 3)؟ والطالب: س ≠ 2 (وهو مدى د) (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-3: الأسئلة 1–5، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] أوجد د⁻¹(س) للدالة د(س) = 3س − 4.\nالإجابة النموذجية: (س + 4) ÷ 3\n2) [مستوى التطبيق] أوجد د⁻¹(س) للدالة د(س) = 5 ÷ (س + 1).\nالإجابة النموذجية: 5 ÷ س − 1\n3) [مستوى الاستدلال] تحقق من أن د(د⁻¹(س)) = س للدالة الأولى.\nالإجابة النموذجية: 3 × (س + 4) ÷ 3 − 4 = س", "1) [مستوى المعرفة] أكمل: مجال د⁻¹ يساوي ___ د\nالإجابة النموذجية: مدى\n2) [مستوى التطبيق] أوجد معكوس د(س) = (2س + 1) ÷ (س − 3).\nالإجابة النموذجية: (3س + 1) ÷ (س − 2)\n3) [مستوى الاستدلال] أوجد د⁻¹(7) إذا كان د(س) = 3س − 4.\nالإجابة النموذجية: 11 ÷ 3", "للطالب: تمارين 2-3: الأسئلة 1–5 (كتاب الطالب ص62–66، كتاب النشاط ص62–64).\nلولي الأمر: متابعة تقدم الابن/الابنة في «شرط وجود الدالة العكسية وإيجاد معكوس الدوال الخطية والنسبية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=11"]}, {"ax": "معكوس الدالة التربيعية بتقييد المجال والإكمال إلى مربع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحدد أكبر مجال تكون فيه الدالة التربيعية واحدًا إلى واحد.\n2) يجد معكوس الدالة التربيعية باستخدام الإكمال إلى مربع.\nمخرج تعليمي آخر: يحدد مجال المعكوس ومداه.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "تقييد المجال، الإكمال إلى مربع، معكوس الدالة التربيعية، الجذر الموجب والسالب.", "يسأل المعلم: لماذا لا يوجد معكوس لـ د(س) = س² − 6س + 11، س ∈ ح؟ وكيف نقيد المجال؟ ويقترح الطالب س ≥ 3 أو س ≤ 3.", "1. التهيئة: يسأل المعلم: لماذا لا يوجد معكوس لـ د(س) = س² − 6س + 11، س ∈ ح؟ وكيف نقيد المجال؟ ويقترح الطالب س ≥ 3 أو س ≤ 3 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = س² − 6س + 11 = (س − 3)² + 2، س ≥ 3 ← د⁻¹(س) = 3 + √(س − 2)، س ≥ 2، ويتابع الطالب ويحدد المجال والمدى (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: د(س) = 2س² + 4س − 1، س ≥ −1؛ و د(س) = (س + 2)² − 5، س ≤ −2، وتجد: −1 + √((س + 3) ÷ 2)، س ≥ −3؛ و −2 − √(س + 5)، س ≥ −5 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يسأل المعلم: لماذا أخذنا الإشارة السالبة في الحالة الثانية؟ والطالب: لأن مدى المعكوس يجب أن يكون ≤ −2 (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-3 ومحور «معكوس الدالة التربيعية بتقييد المجال والإكمال إلى مربع»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-3: الأسئلة 6–10، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد معكوس د(س) = (س − 3)² + 2، س ≥ 3.\nالإجابة النموذجية: 3 + √(س − 2)، س ≥ 2\n2) [مستوى التطبيق] أوجد معكوس د(س) = (س + 2)² − 5، س ≤ −2.\nالإجابة النموذجية: −2 − √(س + 5)\n3) [مستوى الاستدلال] ما أكبر مجال للدالة س² + 4س يكون فيه لها معكوس ويحوي س = 0؟\nالإجابة النموذجية: س ≥ −2", "1) [مستوى المعرفة] أكمل: لتكون الدالة التربيعية واحدًا إلى واحد نقيد المجال عند ___\nالإجابة النموذجية: محور التماثل (الرأس)\n2) [مستوى التطبيق] أوجد معكوس د(س) = 2س² + 4س − 1، س ≥ −1.\nالإجابة النموذجية: −1 + √((س + 3) ÷ 2)، س ≥ −3\n3) [مستوى الاستدلال] أوجد معكوس د(س) = س² − 8س، س ≥ 4.\nالإجابة النموذجية: (س − 4)² − 16 ← 4 + √(س + 16)، س ≥ −16", "للطالب: تمارين 2-3: الأسئلة 6–10 (كتاب الطالب ص62–66، كتاب النشاط ص62–64).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=11"]}]}, {"id": "2-4", "title": "منحنى الدالة ومنحنى دالتها العكسية", "p": [{"ax": "الانعكاس في المستقيم ص = س + رسم منحنيات الدوال التربيعية والجذرية ومعكوساتها ونقاط التقاطع", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يبين أن منحنى د⁻¹ انعكاس لمنحنى د في ص = س.\n2) يرسم منحنى المعكوس من منحنى الدالة.\n3) يرسم دالة تربيعية مقيدة ومعكوسها على المحورين نفسيهما.\n4) يجد نقاط تقاطع الدالة المتزايدة مع معكوسها بحل د(س) = س.\n\nمخرج تعليمي آخر:\nيستنتج تبادل إحداثيات النقاط بين المنحنيين.\nيبرر وقوع هذه النقاط على ص = س.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "الانعكاس، المستقيم ص = س، تبادل الإحداثيات، التماثل.، الدالة المتزايدة، نقاط التقاطع على ص = س، المجال المقيد.", "يعرض المعلم نقطة (2، 5) ويسأل: ما صورتها بالانعكاس في ص = س؟ ويجيب الطالب (5، 2).", "1. التهيئة: يعرض المعلم نقطة (2، 5) ويسأل: ما صورتها بالانعكاس في ص = س؟ ويجيب الطالب (5، 2) (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يرسم الطلبة د(س) = 2س + 1 ومعكوسها على GeoGebra ويطوون الورقة على ص = س، ويلاحظ الطالب التطابق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم رسم معكوس د(س) = √(س − 1) من خلال عكس نقاطها (1، 0)، (2، 1)، (5، 2)، ويرسم الطالب المعكوس ص = س² + 1، س ≥ 0 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم رسم معكوس منحنى معطى على ورقة مربعات، ويرسم الطالب بعكس النقاط (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. النمذجة: ينمذج المعلم: د(س) = س² − 2، س ≥ 0: د(س) = س ← س² − س − 2 = 0 ← (2، 2)، ويرسم الطالب المنحنيين (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعلم تعاوني: يوزع المعلم: د(س) = (س − 1)² + 1، س ≥ 1؛ و د(س) = س² + 3، س ≥ 0، وتجد: (س − 1)² + 1 = س ← س² − 3س + 2 = 0 ← (1، 1) و (2، 2)؛ والثانية لا تقاطع (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. تقويم تكويني: يطلب المعلم تبرير عدم التقاطع في الحالة الثانية، ويقوم الطالب بالمميّز 1 − 12 < 0 (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-4: الأسئلة 4–6، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] صورة (−3، 1) بالانعكاس في ص = س؟\nالإجابة النموذجية: (1، −3)\n2) [مستوى التطبيق] إذا كانت (4، 2) على د فما النقطة المقابلة على د⁻¹؟\nالإجابة النموذجية: (2، 4)\n3) [مستوى الاستدلال] ما معكوس د(س) = √(س − 1)؟\nالإجابة النموذجية: س² + 1، س ≥ 0\n\n4) [مستوى المعرفة] أوجد تقاطع د(س) = س² − 2، س ≥ 0 مع معكوسها.\nالإجابة النموذجية: (2، 2)\n5) [مستوى التطبيق] أوجد تقاطع (س − 1)² + 1، س ≥ 1 مع معكوسها.\nالإجابة النموذجية: (1، 1) و (2، 2)\n6) [مستوى الاستدلال] هل يتقاطع د(س) = س² + 3، س ≥ 0 مع معكوسه؟\nالإجابة النموذجية: لا", "1) [مستوى المعرفة] أكمل: منحنى د⁻¹ انعكاس لمنحنى د في المستقيم ___\nالإجابة النموذجية: ص = س\n2) [مستوى التطبيق] إذا قطع د المحور الصادي عند (0، 3) فأين يقطع د⁻¹ المحور السيني؟\nالإجابة النموذجية: (3، 0)\n3) [مستوى الاستدلال] ارسم د(س) = 2س − 2 ومعكوسها وحدد نقطة تقاطعهما.\nالإجابة النموذجية: د⁻¹(س) = (س + 2) ÷ 2، التقاطع (2، 2)\n\n4) [مستوى المعرفة] أكمل: لإيجاد تقاطع الدالة المتزايدة مع معكوسها نحل د(س) = ___\nالإجابة النموذجية: س\n5) [مستوى التطبيق] أوجد تقاطع د(س) = س² − 6، س ≥ 0 مع معكوسها.\nالإجابة النموذجية: (3، 3)\n6) [مستوى الاستدلال] أوجد تقاطع د(س) = 2س − 3 مع معكوسها.\nالإجابة النموذجية: (3، 3)", "للطالب: تمارين 2-4: الأسئلة 1–3 (كتاب الطالب ص67–70، كتاب النشاط ص65–69).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الانعكاس في المستقيم ص = س».\nللطالب: تمارين 2-4: الأسئلة 4–6 (كتاب الطالب ص67–70، كتاب النشاط ص65–69).\nلولي الأمر: الاطلاع على دفتر الواجب ومنا السابقة.\nالإجابة النموذجية: (س + 1)² − 4 = س ← س² + س − 3 = 0 ← س = (−1 + √13) ÷ 2\n3) [مستوى الاستدلال] أوجد د(د⁻¹(5)).\nالإجابة النموذجية: 5", "1) [مستوى المعرفة] أكمل: د⁻¹(د(س)) = ___\nالإجابة النموذجية: س\n2) [مستوى التطبيق] د(س) = (س − 2) ÷ 3. أوجد د⁻¹(س) وتحقق.\nالإجابة النموذجية: 3س + 2\n3) [مستوى الاستدلال] د(س) = س² + 2س، س ≥ −1. أوجد د⁻¹(8).\nالإجابة النموذجية: س² + 2س = 8 ← س = 2 (نرفض −4)", "للطالب: إكمال تمارين 2-4، وكتاب النشاط (كتاب الطالب ص67–70، كتاب النشاط ص65–69).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «مسائل شاملة على الدالة ومعكوسها».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=12"]}]}, {"id": "2-5أ", "title": "التحويلات الهندسية للدوال: الانسحاب", "p": [{"ax": "الانسحاب الرأسي ص = د(س) + ب + الانسحاب الأفقي ص = د(س − أ)", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يصف أثر إضافة ثابت ب إلى الدالة على منحناها.\n2) يرسم منحنى ص = د(س) + ب من منحنى ص = د(س).\n3) يصف أثر استبدال س بـ (س − أ) على المنحنى.\n4) يميّز اتجاه الانسحاب الأفقي (س − أ يمين، س + أ يسار).\n\nمخرج تعليمي آخر:\nيكتب معادلة المنحنى بعد انسحاب رأسي.\nيرسم منحنى ص = د(س − أ).", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "التحويل الهندسي، الانسحاب الرأسي، المتجه (0، ب)، صورة النقطة.، الانسحاب الأفقي، المتجه (أ، 0)، اتجاه الانسحاب", "يعرض المعلم ص = س² و ص = س² + 3 معًا ويسأل: ما العلاقة بين المنحنيين؟ ويلاحظ الطالب الإزاحة 3 وحدات للأعلى.", "1. التهيئة: يعرض المعلم ص = س² و ص = س² + 3 معًا ويسأل: ما العلاقة بين المنحنيين؟ ويلاحظ الطالب الإزاحة 3 وحدات للأعلى (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يتيح المعلم للطلبة على GeoGebra تحريك منزلق ب في ص = د(س) + ب لدوال مختلفة، ويسجل الطالب أثر ب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم: ص = س² − 4 انسحاب لـ ص = س² بالمتجه (0، −4)، وصورة النقطة (1، 1) هي (1، −3)، ويطبق الطالب على ص = √س + 2 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم وصف التحويل من ص = س³ إلى ص = س³ − 5، والطالب: انسحاب 5 وحدات للأسفل (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. اكتشاف: يطلب المعلم جدول قيم لـ ص = (س − 3)² لإيجاد أين تصبح ص = 0، ويجد الطالب س = 3 ويفسر الاتجاه (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. النمذجة: ينمذج المعلم: ص = √(س + 2) انسحاب لـ ص = √س بالمتجه (−2، 0)، ونقطة البداية (−2، 0)، ويتابع الطالب ويرسم (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. تقويم تكويني: يعرض المعلم بطاقات معادلات ويطلب تحديد اتجاه الانسحاب، ويحدد الطالب ويبرر (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-5أ: الأسئلة 3–4، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] صف التحويل من ص = س² إلى ص = س² + 3.\nالإجابة النموذجية: انسحاب 3 وحدات للأعلى\n2) [مستوى التطبيق] صورة (2، 4) على ص = س² بعد الانسحاب إلى ص = س² − 4؟\nالإجابة النموذجية: (2، 0)\n3) [مستوى الاستدلال] اكتب معادلة ص = 1 ÷ س بعد انسحاب وحدتين للأسفل.\nالإجابة النموذجية: ص = 1 ÷ س − 2\n\n4) [مستوى المعرفة] صف التحويل من ص = س² إلى ص = (س + 4)².\nالإجابة النموذجية: انسحاب 4 وحدات لليسار\n5) [مستوى التطبيق] صورة (1، 1) على ص = س² بعد التحويل إلى ص = (س − 3)²؟\nالإجابة النموذجية: (4، 1)\n6) [مستوى الاستدلال] اكتب ص = س³ بعد انسحاب وحدتين لليمين.\nالإجابة النموذجية: ص = (س − 2)³", "1) [مستوى المعرفة] أكمل: منحنى ص = د(س) + ب هو انسحاب لمنحنى د بمقدار ب وحدة ___\nالإجابة النموذجية: رأسيًا\n2) [مستوى التطبيق] صف التحويل من ص = √س إلى ص = √س + 2.\nالإجابة النموذجية: انسحاب وحدتين للأعلى\n3) [مستوى الاستدلال] رأس ص = س² بعد الانسحاب إلى ص = س² − 7؟\nالإجابة النموذجية: (0، −7)\n\n4) [مستوى المعرفة] أكمل: منحنى ص = د(س − أ) انسحاب لمنحنى د بمقدار أ وحدة ___\nالإجابة النموذجية: أفقيًا (لليمين إذا أ > 0)\n5) [مستوى التطبيق] رأس ص = (س + 5)²؟\nالإجابة النموذجية: (−5، 0)\n6) [مستوى الاستدلال] اكتب ص = 1 ÷ س بعد انسحاب 3 وحدات لليسار.\nالإجابة النموذجية: ص = 1 ÷ (س + 3)", "للطالب: تمارين 2-5أ: الأسئلة 1–2 (كتاب الطالب ص71–74، كتاب النشاط ص70–72).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 2-5أ: الأسئلة 3–4 (كتاب الطالب ص71–74، كتاب النشاط ص70–72).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الانسحاب الأفقي ص = د(س − أ)» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=13"]}, {"ax": "الانسحاب المركب بالمتجه (أ، ب)", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يكتب معادلة المنحنى بعد انسحاب بالمتجه (أ، ب).\n2) يحدد المتجه بين منحنيين معطيين.\n\nمخرج تعليمي آخر: يربط صورة الإكمال إلى مربع بانسحاب منحنى ص = س².", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الانسحاب بالمتجه (أ، ب)، ص = د(س − أ) + ب، صورة الرأس.", "يسأل المعلم: كيف نحصل على ص = (س − 3)² − 2 من ص = س²؟ ويقترح الطالب انسحابين.", "1. التهيئة: يسأل المعلم: كيف نحصل على ص = (س − 3)² − 2 من ص = س²؟ ويقترح الطالب انسحابين (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: انسحاب ص = س² بالمتجه (3، −2) ← ص = (س − 3)² − 2، والرأس (3، −2)؛ ثم ص = س² − 6س + 5 = (س − 3)² − 4 انسحاب بالمتجه (3، −4)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع أزواج منحنيات لتحديد المتجه بينها، وتحدد المجموعة المتجه وتتحقق (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم كتابة معادلة ص = √س بعد انسحاب (−1، 4)، والطالب: ص = √(س + 1) + 4 (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-5أ ومحور «الانسحاب المركب بالمتجه (أ، ب)»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-5أ: الأسئلة 5–7، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] اكتب معادلة ص = س² بعد انسحاب (3، −2).\nالإجابة النموذجية: ص = (س − 3)² − 2\n2) [مستوى التطبيق] صف التحويل من ص = س² إلى ص = س² + 4س + 1.\nالإجابة النموذجية: (س + 2)² − 3، انسحاب (−2، −3)\n3) [مستوى الاستدلال] اكتب ص = √س بعد انسحاب (−1، 4).\nالإجابة النموذجية: ص = √(س + 1) + 4", "1) [مستوى المعرفة] أكمل: انسحاب ص = د(س) بالمتجه (أ، ب) يعطي ص = د(س − أ) + ___\nالإجابة النموذجية: ب\n2) [مستوى التطبيق] صورة الرأس (0، 0) لـ ص = س² بالانسحاب (−1، 5)؟\nالإجابة النموذجية: (−1، 5)\n3) [مستوى الاستدلال] صف التحويل من ص = س² إلى ص = س² − 6س + 5.\nالإجابة النموذجية: انسحاب (3، −4)", "للطالب: تمارين 2-5أ: الأسئلة 5–7 (كتاب الطالب ص71–74، كتاب النشاط ص70–72).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=13"]}]}, {"id": "2-5ب", "title": "التحويلات الهندسية للدوال: الانعكاس", "p": [{"ax": "الانعكاس في المحور السيني والمحور الصادي", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف أثر ص = −د(س) (انعكاس في المحور السيني).\n2) يصف أثر ص = د(−س) (انعكاس في المحور الصادي).\nمخرج تعليمي آخر: يكتب معادلة المنحنى بعد الانعكاس.", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "الانعكاس، المحور السيني، المحور الصادي، ص = −د(س)، ص = د(−س).", "يعرض المعلم ص = √س و ص = −√س و ص = √(−س) ويسأل: أين تقع كل صورة؟ ويميز الطالب الانعكاسين.", "1. التهيئة: يعرض المعلم ص = √س و ص = −√س و ص = √(−س) ويسأل: أين تقع كل صورة؟ ويميز الطالب الانعكاسين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يطلب المعلم جدول قيم لـ ص = −(س² − 4س) و ص = (−س)² − 4(−س) ومقارنتها بالأصل، ويكتشف الطالب أثر كل تحويل على النقاط (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم: انعكاس ص = س² − 4س في المحور الصادي ← ص = س² + 4س؛ وفي المحور السيني ← ص = −س² + 4س، ويتابع الطالب ويحدد صورة الرأس (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم صورة (2، −4) في كل انعكاس، والطالب: في السيني (2، 4) وفي الصادي (−2، −4) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-5ب: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] اكتب معادلة ص = √س بعد الانعكاس في المحور السيني.\nالإجابة النموذجية: ص = −√س\n2) [مستوى التطبيق] اكتب ص = س³ + 1 بعد الانعكاس في المحور الصادي.\nالإجابة النموذجية: ص = −س³ + 1\n3) [مستوى الاستدلال] صورة (2، −4) بالانعكاس في المحور الصادي؟\nالإجابة النموذجية: (−2، −4)", "1) [مستوى المعرفة] أكمل: ص = −د(س) انعكاس في المحور ___\nالإجابة النموذجية: السيني\n2) [مستوى التطبيق] اكتب ص = س² − 4س بعد الانعكاس في المحور الصادي.\nالإجابة النموذجية: ص = س² + 4س\n3) [مستوى الاستدلال] ما الدالة التي لا تتغير بالانعكاس في المحور الصادي من بين: س²، س³؟\nالإجابة النموذجية: س² (دالة زوجية)", "للطالب: تمارين 2-5ب: الأسئلة 1–3 (كتاب الطالب ص75–76، كتاب النشاط ص73–75).\nلولي الأمر: متابعة إنجاز الواجب في
