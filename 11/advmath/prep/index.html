يم ك التي تجعل ك² − 16 ≥ 0؟ ويحل الطالب: ك ≤ −4 أو ك ≥ 4.", "1. التهيئة: يسأل المعلم: ما قيم ك التي تجعل ك² − 16 ≥ 0؟ ويحل الطالب: ك ≤ −4 أو ك ≥ 4 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ك س² + 4س + ك = 0 لها جذران متساويان ← 16 − 4ك² = 0 ← ك = ±2، ويتابع الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: س² + (ك − 2)س + 1 = 0 لا جذور حقيقية لها؛ وبرهن أن س² + ك س − 2 = 0 لها جذران مختلفان لكل ك، وتحل: (ك − 2)² < 4 ← 0 < ك < 4؛ والمميّز ك² + 8 > 0 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم حل مسألة من تمارين 1-3 فرديًا، ويحل الطالب ويعرض (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-3 ومحور «إيجاد قيم ثابت مجهول بشرط نوع الجذور»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-3: الأسئلة 4–7، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ك س² + 4س + ك = 0 لها جذران متساويان. أوجد ك.\nالإجابة النموذجية: ك = ±2\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل س² + (ك − 2)س + 1 = 0 بلا جذور حقيقية.\nالإجابة النموذجية: 0 < ك < 4\n3) [مستوى الاستدلال] برهن أن س² + ك س − 2 = 0 لها جذران مختلفان لكل ك.\nالإجابة النموذجية: المميّز ك² + 8 > 0 دائمًا", "1) [مستوى المعرفة] أكمل: شرط الجذرين الحقيقيين هو المميّز ___ 0\nالإجابة النموذجية: ≥\n2) [مستوى التطبيق] أوجد ك إذا كان 2س² − ك س + 8 = 0 له جذران متساويان.\nالإجابة النموذجية: ك² − 64 = 0 ← ك = ±8\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل س² + 2ك س + 9 = 0 لها جذران حقيقيان مختلفان.\nالإجابة النموذجية: 4ك² − 36 > 0 ← ك < −3 أو ك > 3", "للطالب: تمارين 1-3: الأسئلة 4–7 (كتاب الطالب ص30–31، كتاب النشاط ص22–23).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «إيجاد قيم ثابت مجهول بشرط نوع الجذور» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=3"]}]}, {"id": "1-4", "title": "الصيغة التربيعية", "p": [{"ax": "اشتقاق الصيغة التربيعية واستخدامها", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يشتق الصيغة التربيعية بالإكمال إلى مربع.\n2) يحل المعادلات التربيعية بالصيغة التربيعية.\nمخرج تعليمي آخر: يقرّب الحلول إلى ثلاثة أرقام معنوية.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الصيغة التربيعية س = (−ب ± √(ب² − 4أجـ)) ÷ 2أ، الأرقام المعنوية، الحل الدقيق والتقريبي.", "يسأل المعلم: هل يمكن تحليل 2س² − 5س − 1 إلى عوامل بأعداد صحيحة؟ فما البديل؟ ويقترح الطالب الإكمال إلى مربع أو صيغة عامة.", "1. التهيئة: يسأل المعلم: هل يمكن تحليل 2س² − 5س − 1 إلى عوامل بأعداد صحيحة؟ فما البديل؟ ويقترح الطالب الإكمال إلى مربع أو صيغة عامة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يشتق المعلم الصيغة بالإكمال إلى مربع للمعادلة العامة، ويشارك الطالب في خطوات الاشتقاق (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطبق المعلم على 2س² − 5س − 1 = 0: س = (5 ± √33) ÷ 4 ≈ 2.69 أو −0.186، ويحل الطالب ويقرب لثلاثة أرقام معنوية (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطلب المعلم حل 3س² + 2س − 4 = 0 بالصيغة، ويجد الطالب (−2 ± √52) ÷ 6 ≈ 0.869 أو −1.54 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-4: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] حل: س² + 3س − 1 = 0 بصورة دقيقة.\nالإجابة النموذجية: (−3 ± √13) ÷ 2\n2) [مستوى التطبيق] قرّب حلول السؤال السابق لثلاثة أرقام معنوية.\nالإجابة النموذجية: 0.303 و −3.30\n3) [مستوى الاستدلال] ما قيمة ما تحت الجذر في صيغة حل 2س² − 5س − 1 = 0؟\nالإجابة النموذجية: 25 + 8 = 33", "1) [مستوى المعرفة] أكمل: في الصيغة التربيعية المقام يساوي ___\nالإجابة النموذجية: 2أ\n2) [مستوى التطبيق] حل: س² − 4س + 1 = 0.\nالإجابة النموذجية: 2 ± √3\n3) [مستوى الاستدلال] حل: 5س² + 2س − 1 = 0 مقربًا لثلاثة أرقام معنوية.\nالإجابة النموذجية: (−2 ± √24) ÷ 10 ≈ 0.290 أو −0.690", "للطالب: تمارين 1-4: الأسئلة 1–3 (كتاب الطالب ص32–33، كتاب النشاط ص24–26).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «اشتقاق الصيغة التربيعية واستخدامها».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=4"]}, {"ax": "اختيار طريقة الحل المناسبة وتطبيقات الصيغة التربيعية", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يختار الطريقة الأنسب للحل (تحليل، إكمال مربع، صيغة).\n2) يحل مسائل حياتية بالصيغة التربيعية.\nمخرج تعليمي آخر: يفسر الحلول في السياق ويستبعد غير المقبول.", "المخرج 1: تقييم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "اختيار الاستراتيجية، النمذجة، الحلول المقبولة، التقريب المناسب.", "يعرض المعلم ثلاث معادلات ويسأل: أي طريقة تختار لكل منها ولماذا؟ ويبرر الطالب اختياره.", "1. التهيئة: يعرض المعلم ثلاث معادلات ويسأل: أي طريقة تختار لكل منها ولماذا؟ ويبرر الطالب اختياره (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يعرض المعلم: مستطيل طوله يزيد على عرضه 3 سم ومساحته 20 سم². أوجد العرض لثلاثة أرقام معنوية، ويكتب الطالب س² + 3س − 20 = 0 ← س ≈ 3.22 سم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم مسائل حياتية (ارتفاع مقذوف ع = 15ن − 4.9ن²) لإيجاد زمن الوصول لارتفاع 10 م، وتحل: 4.9ن² − 15ن + 10 = 0 ← ن ≈ 0.981 أو 2.08 ث (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم تفسير وجود زمنين في مسألة المقذوف، ويفسر الطالب: صاعدًا ونازلًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-4 ومحور «اختيار طريقة الحل المناسبة وتطبيقات الصيغة التربيعية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-4: الأسئلة 4–6، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] مستطيل عرضه س وطوله س + 3 ومساحته 20. أوجد س.\nالإجابة النموذجية: س ≈ 3.22\n2) [مستوى التطبيق] لماذا يوجد زمنان للوصول لارتفاع 10 م؟\nالإجابة النموذجية: مرة أثناء الصعود ومرة أثناء الهبوط.\n3) [مستوى الاستدلال] أي طريقة تختار لحل س² − 5س + 6 = 0؟\nالإجابة النموذجية: التحليل إلى عوامل لأنه أسرع.", "1) [مستوى المعرفة] أكمل: نستخدم الصيغة التربيعية عندما لا يمكن ___ المعادلة بسهولة.\nالإجابة النموذجية: تحليل\n2) [مستوى التطبيق] حل: ن² − 6ن + 4 = 0 لثلاثة أرقام معنوية.\nالإجابة النموذجية: 3 ± √5 ← 5.24 أو 0.764\n3) [مستوى الاستدلال] مقذوف ع = 20ن − 5ن². متى يكون ارتفاعه 12 م؟\nالإجابة النموذجية: 5ن² − 20ن + 12 = 0 ← ن ≈ 0.735 أو 3.26 ث", "للطالب: تمارين 1-4: الأسئلة 4–6 (كتاب الطالب ص32–33، كتاب النشاط ص24–26).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=4"]}]}, {"id": "1-5", "title": "حلّ المعادلات الآنية (معادلة خطية ومعادلة تربيعية)", "p": [{"ax": "الحل بالتعويض لأنظمة بسيطة", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يعزل متغيرًا في المعادلة الخطية ويعوضه في التربيعية.\n2) يحل المعادلة الناتجة ويجد الأزواج المرتبة.\nمخرج تعليمي آخر: يفسر الحلول بيانيًا بنقاط التقاطع.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المعادلات الآنية، التعويض، الأزواج المرتبة، نقاط التقاطع.", "يعرض المعلم بيانيًا دائرة ومستقيمًا متقاطعين ويسأل: كم حلًا للنظام؟ ويعد الطالب نقاط التقاطع.", "1. التهيئة: يعرض المعلم بيانيًا دائرة ومستقيمًا متقاطعين ويسأل: كم حلًا للنظام؟ ويعد الطالب نقاط التقاطع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: س + ص = 4، س² + ص² = 10 ← 2س² − 8س + 6 = 0 ← (1، 3) و (3، 1)، ويتابع الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يكلف المعلم بحل: ص = 2س − 3، س² − س ص = −4، ويجد الطالب: س² − 3س − 4 = 0 ← (4، 5) و (−1، −5) (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطلب المعلم التحقق من الحلول بالتعويض في المعادلتين، ويتحقق الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] حل: س + ص = 4، س² + ص² = 10.\nالإجابة النموذجية: (1، 3) و (3، 1)\n2) [مستوى التطبيق] حل: ص = 2س − 3، س² − س ص = −4.\nالإجابة النموذجية: (4، 5) و (−1، −5)\n3) [مستوى الاستدلال] تحقق من (4، 5) في س² − س ص = −4.\nالإجابة النموذجية: 16 − 20 = −4 ✓", "1) [مستوى المعرفة] أكمل: من س + ص = 4 نكتب ص = ___\nالإجابة النموذجية: 4 − س\n2) [مستوى التطبيق] حل: ص = س + 1، س² + ص² = 25.\nالإجابة النموذجية: (3، 4) و (−4، −3)\n3) [مستوى الاستدلال] حل: س − ص = 2، س ص = 15.\nالإجابة النموذجية: (5، 3) و (−3، −5)", "للطالب: تمارين 1-5: الأسئلة 1–3 (كتاب الطالب ص34–36، كتاب النشاط ص27–31).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الحل بالتعويض لأنظمة بسيطة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=5"]}, {"ax": "أنظمة أكثر تعقيدًا وحلول غير صحيحة", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحل أنظمة تتطلب عزل متغير بمعامل لا يساوي 1.\n2) يستخدم الصيغة التربيعية عند الحاجة ويقرب الحلول.\nمخرج تعليمي آخر: يحلل الأنظمة التي ليس لها حل حقيقي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "العزل، الكسور، الصيغة التربيعية، عدم وجود حل حقيقي.", "يسأل المعلم: من 2س + 3ص = 7 أي متغير أسهل للعزل؟ ويناقش الطالب ويختار.", "1. التهيئة: يسأل المعلم: من 2س + 3ص = 7 أي متغير أسهل للعزل؟ ويناقش الطالب ويختار (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س + ص = 5، س² + س ص = 6 ← ص = 5 − 2س ← س² − 5س + 6 = 0 ← (2، 1) و (3، −1)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: ص = س + 2، س² + 2ص² = 10 (حلول غير صحيحة)، و ص = س + 5، س² + ص² = 4 (لا حل)، وتحل: 3س² + 8س − 2 = 0 ← س ≈ 0.230 أو −2.90؛ والثاني 2س² + 10س + 21 = 0 مميّزها سالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يسأل المعلم: ماذا يعني بيانيًا عدم وجود حل؟ ويقوم الطالب بالمستقيم لا يقطع المنحنى (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-5 ومحور «أنظمة أكثر تعقيدًا وحلول غير صحيحة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-5: الأسئلة 4–7، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حل: 2س + ص = 5، س² + س ص = 6.\nالإجابة النموذجية: (2، 1) و (3، −1)\n2) [مستوى التطبيق] هل للنظام ص = س + 5، س² + ص² = 4 حل؟\nالإجابة النموذجية: لا؛ المميّز 100 − 168 < 0\n3) [مستوى الاستدلال] حل: س + 2ص = 3، س² + ص² = 5.\nالإجابة النموذجية: س = 3 − 2ص ← 5ص² − 12ص + 4 = 0 ← (−1، 2) و (11/5، 2/5)", "1) [مستوى المعرفة] أكمل: عدم وجود حل يعني أن المستقيم ___ المنحنى.\nالإجابة النموذجية: لا يقطع\n2) [مستوى التطبيق] حل: 3س − ص = 1، س ص = 2.\nالإجابة النموذجية: ص = 3س − 1 ← 3س² − س − 2 = 0 ← (1، 2) و (−2/3، −3)\n3) [مستوى الاستدلال] حل: ص = س + 2، س² + 2ص² = 10 لثلاثة أرقام معنوية.\nالإجابة النموذجية: س ≈ 0.230، ص ≈ 2.23؛ س ≈ −2.90، ص ≈ −0.897", "للطالب: تمارين 1-5: الأسئلة 4–7 (كتاب الطالب ص34–36، كتاب النشاط ص27–31).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=5"]}]}, {"id": "1-6", "title": "حلّ معادلات تربيعية أكثر تعقيدًا", "p": [{"ax": "المعادلات في صورة تربيعية مقنّعة (س⁴، √س)", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يتعرف المعادلة التربيعية المقنّعة.\n2) يحل المعادلة باستخدام تعويض مناسب مثل ص = س² أو ص = √س.\nمخرج تعليمي آخر: يستبعد الحلول غير المقبولة بعد الرجوع للمتغير الأصلي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المعادلة التربيعية المقنّعة، التعويض بمتغير جديد، الرجوع للمتغير الأصلي، الحلول الدخيلة.", "يكتب المعلم س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟ ويلاحظ الطالب ص² − 5ص + 4 = 0.", "1. التهيئة: يكتب المعلم س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟ ويلاحظ الطالب ص² − 5ص + 4 = 0 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: س⁴ − 5س² + 4 = 0 ← ص = س² ← (ص − 1)(ص − 4) = 0 ← س = ±1، ±2، ويتابع الطالب ويكمل الرجوع للمتغير (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يحل المعلم: س − 5√س + 6 = 0 ← ص = √س ← ص = 2، 3 ← س = 4، 9، ويتحقق، ويحل الطالب مسألة مشابهة: س − √س − 2 = 0 ← س = 4 فقط (نرفض √س = −1) (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يسأل المعلم: لماذا رفضنا √س = −1؟ والطالب: لأن الجذر التربيعي الموجب لا يكون سالبًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] حل: س⁴ − 10س² + 9 = 0.\nالإجابة النموذجية: س² = 1 أو 9 ← س = ±1، ±3\n2) [مستوى التطبيق] حل: س − 5√س + 6 = 0.\nالإجابة النموذجية: س = 4 أو 9\n3) [مستوى الاستدلال] حل: س − √س − 2 = 0.\nالإجابة النموذجية: √س = 2 (نرفض −1) ← س = 4", "1) [مستوى المعرفة] أكمل: في س⁴ − 5س² + 4 = 0 نعوض ص = ___\nالإجابة النموذجية: س²\n2) [مستوى التطبيق] حل: س⁴ − 3س² − 4 = 0.\nالإجابة النموذجية: س² = 4 أو −1 (مرفوض) ← س = ±2\n3) [مستوى الاستدلال] حل: 2س − 7√س + 3 = 0.\nالإجابة النموذجية: √س = 3 أو 1/2 ← س = 9 أو 1/4", "للطالب: تمارين 1-6: الأسئلة 1–4 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «المعادلات في صورة تربيعية مقنّعة (س⁴، √س)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=6"]}, {"ax": "معادلات بمقلوبات أو بعبارات مركبة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحول معادلة فيها 1/س أو 1/س² إلى تربيعية.\n2) يحل معادلات من الصورة (عبارة)² + ب(عبارة) + جـ = 0.\nمخرج تعليمي آخر: يختار التعويض الأنسب ويبرره.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المقلوب، الضرب في المقام المشترك، التعويض بعبارة، القيود على المجال.", "يسأل المعلم: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟ ويقترح الطالب الضرب في س².", "1. التهيئة: يسأل المعلم: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟ ويقترح الطالب الضرب في س² (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 6/س² − 5/س + 1 = 0 ← س² − 5س + 6 = 0 ← س = 2، 3 (س ≠ 0)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: (س² + 1)² − 7(س² + 1) + 10 = 0، و (2س − 1)² − 5(2س − 1) + 6 = 0، وتحل: س² + 1 = 2 أو 5 ← س = ±1، ±2؛ 2س − 1 = 2 أو 3 ← س = 3/2، 2 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يكلف المعلم بسؤال من تمارين 1-6 فرديًا، ويحل الطالب ويعرض (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-6 ومحور «معادلات بمقلوبات أو بعبارات مركبة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-6: الأسئلة 5–8، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حل: 6/س² − 5/س + 1 = 0.\nالإجابة النموذجية: س = 2 أو 3\n2) [مستوى التطبيق] حل: (س² + 1)² − 7(س² + 1) + 10 = 0.\nالإجابة النموذجية: س = ±1، ±2\n3) [مستوى الاستدلال] حل: (2س − 1)² − 5(2س − 1) + 6 = 0.\nالإجابة النموذجية: س = 3/2 أو 2", "1) [مستوى المعرفة] أكمل: في (س² + 1)² − 7(س² + 1) + 10 = 0 نعوض ص = ___\nالإجابة النموذجية: س² + 1\n2) [مستوى التطبيق] حل: س + 6/س = 5.\nالإجابة النموذجية: س² − 5س + 6 = 0 ← س = 2 أو 3\n3) [مستوى الاستدلال] حل: 1/س² − 3/س − 4 = 0.\nالإجابة النموذجية: نضرب في س²: 1 − 3س − 4س² = 0 ← 4س² + 3س − 1 = 0 ← س = 1/4 أو −1", "للطالب: تمارين 1-6: الأسئلة 5–8 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «معادلات بمقلوبات أو بعبارات مركبة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=6"]}]}, {"id": "1-7", "title": "حلّ المتباينات التربيعية", "p": [{"ax": "حل المتباينات التربيعية بالقيم الحرجة والرسم", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد القيم الحرجة للمتباينة التربيعية.\n2) يستخدم الرسم التخطيطي لتحديد مجموعة الحل.\nمخرج تعليمي آخر: يكتب مجموعة الحل بالصيغة المناسبة (فترة واحدة أو فترتان).", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتباينة التربيعية، القيم الحرجة، الرسم التخطيطي، مجموعة الحل.", "يسأل المعلم: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟ ويحدد الطالب ±2 للمعادلة وفترة للمتباينة.", "1. التهيئة: يسأل المعلم: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟ ويحدد الطالب ±2 للمعادلة وفترة للمتباينة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س² + 5س − 3 < 0 ← (2س − 1)(س + 3) < 0 ← −3 < س < 1/2؛ و س² − 4س − 12 ≥ 0 ← س ≤ −2 أو س ≥ 6، ويرسم الطالب المنحنى ويقرأ الحل (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يكلف المعلم بـ: 6 − س − س² > 0 و 3س² ≤ 2س + 8، ويحل الطالب: −3 < س < 2؛ (3س + 4)(س − 2) ≤ 0 ← −4/3 ≤ س ≤ 2 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يعرض المعلم حلولًا ويطلب الحكم عليها، ويحكم الطالب ويبرر (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-7: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] حل: 2س² + 5س − 3 < 0.\nالإجابة النموذجية: −3 < س < 1/2\n2) [مستوى التطبيق] حل: س² − 4س − 12 ≥ 0.\nالإجابة النموذجية: س ≤ −2 أو س ≥ 6\n3) [مستوى الاستدلال] حل: 3س² ≤ 2س + 8.\nالإجابة النموذجية: −4/3 ≤ س ≤ 2", "1) [مستوى المعرفة] أكمل: حل (س − 1)(س − 4) > 0 هو س < 1 أو س > ___\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] حل: 6 − س − س² > 0.\nالإجابة النموذجية: −3 < س < 2\n3) [مستوى الاستدلال] حل: س² + 2س > 15.\nالإجابة النموذجية: (س + 5)(س − 3) > 0 ← س < −5 أو س > 3", "للطالب: تمارين 1-7: الأسئلة 1–4 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «حل المتباينات التربيعية بالقيم الحرجة والرسم».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=7"]}, {"ax": "متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل متباينة تربيعية قيمها الحرجة غير صحيحة باستخدام الصيغة التربيعية.\n2) يحل متباينات ناتجة عن شروط المميّز.\nمخرج تعليمي آخر: يحل نظامًا من متباينة خطية وأخرى تربيعية.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "القيم الحرجة الجذرية، متباينة المميّز، تقاطع مجموعتي الحل.", "يسأل المعلم: ما القيم الحرجة لـ س² − 2س − 1 < 0؟ ويستخدم الطالب الصيغة: 1 ± √2.", "1. التهيئة: يسأل المعلم: ما القيم الحرجة لـ س² − 2س − 1 < 0؟ ويستخدم الطالب الصيغة: 1 ± √2 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: س² − 2س − 1 < 0 ← 1 − √2 < س < 1 + √2؛ ثم: قيم ك التي تجعل س² + ك س + ك + 3 = 0 لها جذران حقيقيان ← ك² − 4ك − 12 ≥ 0 ← ك ≤ −2 أو ك ≥ 6، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم نظامًا: س² − 5س + 4 < 0 و 2س − 5 > 0، وتجد: 1 < س < 4 و س > 2.5 ← 2.5 < س < 4 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يكلف المعلم بسؤال متقدم من تمارين 1-7، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 1-7 ومحور «متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-7: الأسئلة 5–9، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حل: س² − 2س − 1 < 0.\nالإجابة النموذجية: 1 − √2 < س < 1 + √2\n2) [مستوى التطبيق] أوجد قيم ك لكي يكون لـ س² + ك س + ك + 3 = 0 جذران حقيقيان.\nالإجابة النموذجية: ك ≤ −2 أو ك ≥ 6\n3) [مستوى الاستدلال] حل النظام: س² − 5س + 4 < 0، 2س − 5 > 0.\nالإجابة النموذجية: 2.5 < س < 4", "1) [مستوى المعرفة] أكمل: القيمتان الحرجتان لـ س² − 2س − 1 = 0 هما 1 ± ___\nالإجابة النموذجية: √2\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل ك س² + 2س + ك = 0 بلا جذور حقيقية (ك ≠ 0).\nالإجابة النموذجية: 4 − 4ك² < 0 ← ك < −1 أو ك > 1\n3) [مستوى الاستدلال] حل: س² ≥ 3، س < 5.\nالإجابة النموذجية: س ≤ −√3 أو √3 ≤ س < 5", "للطالب: تمارين 1-7: الأسئلة 5–9 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=7"]}]}, {"id": "1-8", "title": "التقاطع بين المستقيم ومنحنى الدالة التربيعية", "p": [{"ax": "نقاط التقاطع وعددها باستخدام المميّز", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد نقاط تقاطع مستقيم ومنحنى تربيعي.\n2) يحدد عدد نقاط التقاطع بالمميّز.\nمخرج تعليمي آخر: يميّز المماس من القاطع.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "القاطع، المماس، نقطة التماس، المميّز، عدد نقاط التقاطع.", "يعرض المعلم على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟ ويلاحظ الطالب وجود قيمتين للميل يحدث عندهما التماس.", "1. التهيئة: يعرض المعلم على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟ ويلاحظ الطالب وجود قيمتين للميل يحدث عندهما التماس (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ص = س² − 3س + 4، ص = س + 1 ← س² − 4س + 3 = 0 ← (1، 2) و (3، 4)؛ ثم ص = 2س − 1 مع ص = س² ← (س − 1)² = 0 مماس عند (1، 1)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تطبيق موجّه: يكلف المعلم بتحديد عدد نقاط تقاطع ص = 3س − 5 مع ص = س² + س − 2 بالمميّز، والطالب: س² − 2س + 3 = 0، المميّز −8 < 0، لا تقاطع (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم تصنيف ثلاثة أزواج (قاطع، مماس، لا يقطع)، ويصنف الطالب بالمميّز (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-8: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] أوجد تقاطع ص = س² − 3س + 4 و ص = س + 1.\nالإجابة النموذجية: (1، 2) و (3، 4)\n2) [مستوى التطبيق] بيّن أن ص = 2س − 1 مماس لـ ص = س².\nالإجابة النموذجية: س² − 2س + 1 = 0، المميّز 0\n3) [مستوى الاستدلال] كم نقطة تقاطع بين ص = 3س − 5 و ص = س² + س − 2؟\nالإجابة النموذجية: لا توجد؛ المميّز −8", "1) [مستوى المعرفة] أكمل: إذا كان المميّز صفرًا فالمستقيم ___ للمنحنى.\nالإجابة النموذجية: مماس\n2) [مستوى التطبيق] أوجد تقاطع ص = 2س + 3 و ص = س² − 2س + 3.\nالإجابة النموذجية: س² − 4س = 0 ← (0، 3) و (4، 11)\n3) [مستوى الاستدلال] أوجد نقطة تماس ص = 4س − 4 مع ص = س² دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-8: الأسئلة 5–9، وتمارين مراجعة نهاية الوحدة ص47–50، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد ك إذا كان ص = ك س − 3 مماسًا لـ ص = س² + 1.\nالإجابة النموذجية: ك = ±4\n2) [مستوى التطبيق] أوجد قيم ك لكي يقطع ص = س + ك المنحنى ص = 2س² − 3س + 4 في نقطتين.\nالإجابة النموذجية: ك > 2\n3) [مستوى الاستدلال] أوجد نقطة التماس عندما ك = 4.\nالإجابة النموذجية: س² − 4س + 4 = 0 ← (2، 5)", "1) [مستوى المعرفة] أكمل: شرط أن يقطع المستقيم المنحنى في نقطتين هو المميّز ___ 0\nالإجابة النموذجية: >\n2) [مستوى التطبيق] أوجد ك إذا كان ص = 2س + ك مماسًا لـ ص = س² − 4س + 3.\nالإجابة النموذجية: س² − 6س + 3 − ك = 0 ← 36 − 4(3 − ك) = 0 ← ك = −6\n3) [مستوى الاستدلال] أوجد قيم م لكي لا يقطع ص = م س المنحنى ص = س² + 9.\nالإجابة النموذجية: م² − 36 < 0 ← −6 < م < 6", "للطالب: تمارين 1-8: الأسئلة 5–9، وتمارين مراجعة نهاية الوحدة ص47–50 (كتاب الطالب ص43–46، ومراجعة الوحدة ص47–50، كتاب النشاط ص43–45، ومراجعة الوحدة ص46–52).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=8"]}]}, {"id": "2-1", "title": "تعريف الدالة", "p": [{"ax": "الدالة وأنواع التطابق والمجال والمدى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يميّز الدالة باستخدام المخطط السهمي واختبار المستقيم الرأسي.\n2) يصنف الدوال: واحد إلى واحد، متعدد إلى واحد.\nمخرج تعليمي آخر: يستخدم الرمز د: س ↦ ... ويحسب الصور.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات منحنيات", "الدالة، المجال، المجال المقابل، المدى، واحد إلى واحد، متعدد إلى واحد، اختبار المستقيم الرأسي والأفقي.", "يسأل المعلم: هل كل علاقة دالة؟ يعرض علاقة «الطالب ← أرقام هواتف أقاربه» ويناقش، ويستنتج الطالب شرط الصورة الوحيدة.", "1. التهيئة: يسأل المعلم: هل كل علاقة دالة؟ يعرض علاقة «الطالب ← أرقام هواتف أقاربه» ويناقش، ويستنتج الطالب شرط الصورة الوحيدة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرّف المعلم الدالة والمجال والمدى، ويعرض أمثلة بمخططات سهمية ومنحنيات، ويطبق اختبار المستقيم الرأسي والأفقي، ويصنف الطالب الأمثلة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم بطاقات منحنيات (قطع مكافئ، دائرة، مستقيم، س = ص²) لتصنيفها، وتصنف المجموعة وتبرر (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطرح المعلم: د: س ↦ 3 − 2س، أوجد د(−1) و د(1/2)، ويحسب الطالب: 5 و 2 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] هل المنحنى س = ص² يمثل ص دالة في س؟\nالإجابة النموذجية: لا؛ المستقيم س = 4 يقطعه في نقطتين.\n2) [مستوى التطبيق] صنف الدالة د(س) = س³.\nالإجابة النموذجية: واحد إلى واحد\n3) [مستوى الاستدلال] أوجد د(3) إذا كان د: س ↦ س² − 2س.\nالإجابة النموذجية: 3", "1) [مستوى المعرفة] أكمل: الدالة التي تحقق اختبار المستقيم الأفقي تسمى ___\nالإجابة النموذجية: واحدًا إلى واحد\n2) [مستوى التطبيق] صنف د(س) = (س − 1)²، س ∈ ح.\nالإجابة النموذجية: متعدد إلى واحد\n3) [مستوى الاستدلال] أوجد قيم س التي تجعل د(س) = 8 حيث د(س) = س² − 2س.\nالإجابة النموذجية: س² − 2س − 8 = 0 ← س = 4 أو −2", "للطالب: تمارين 2-1: الأسئلة 1–4 (كتاب الطالب ص51–56، كتاب النشاط ص53–58).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الدالة وأنواع التطابق والمجال والمدى».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=9"]}, {"ax": "مدى الدو س⁴ − 2س²، هـ(هـ(س)) = 4س + 9 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يسأل المعلم: هل د(هـ(1)) = هـ(د(1))؟ ويحسب الطالب 24 و 3 ويستنتج عدم الإبدال (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-2: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] أوجد د(هـ(س)) إذا كان د(س) = س² − 1، هـ(س) = 2س + 3.\nالإجابة النموذجية: 4س² + 12س + 8\n2) [مستوى التطبيق] أوجد هـ(هـ(س)).\nالإجابة النموذجية: 4س + 9\n3) [مستوى الاستدلال] أوجد د(هـ(1)).\nالإجابة النموذجية: هـ(1) = 5، د(5) = 24", "1) [مستوى المعرفة] أكمل: في د(هـ(س)) نطبق ___ أولًا.\nالإجابة النموذجية: هـ\n2) [مستوى التطبيق] د(س) = 1 ÷ س، هـ(س) = س + 2. أوجد د(هـ(س)) و هـ(د(س)).\nالإجابة النموذجية: 1 ÷ (س + 2) و 1 ÷ س + 2\n3) [مستوى الاستدلال] أوجد د(د(س)) إذا كان د(س) = س² − 1.\nالإجابة النموذجية: س⁴ − 2س²", "للطالب: تمارين 2-2: الأسئلة 1–4 (كتاب الطالب ص57–61، كتاب النشاط ص59–61).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تكوين الدالة المركّبة وحساب قيمها».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=10"]}, {"ax": "مجال الدالة المركّبة ومداها وحل المعادلات", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحدد شرط وجود الدالة المركّبة (مدى الداخلية ضمن مجال الخارجية).\n2) يجد مجال الدالة المركّبة ومداها.\nمخرج تعليمي آخر: يحل معادلات تتضمن دوالًا مركّبة.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot س) للدالة د(س) = 3س − 4.\nالإجابة النموذجية: (س + 4) ÷ 3\n2) [مستوى التطبيق] أوجد د⁻¹(س) للدالة د(س) = 5 ÷ (س + 1).\nالإجابة النموذجية: 5 ÷ س − 1\n3) [مستوى الاستدلال] تحقق من أن د(د⁻¹(س)) = س للدالة الأولى.\nالإجابة النموذجية: 3 × (س + 4) ÷ 3 − 4 = س", "1) [مستوى المعرفة] أكمل: مجال د⁻¹ يساوي ___ د\nالإجابة النموذجية: مدى\n2) [مستوى التطبيق] أوجد معكوس د(س) = (2س + 1) ÷ (س − 3).\nالإجابة النموذجية: (3س + 1) ÷ (س − 2)\n3) [مستوى الاستدلال] أوجد د⁻¹(7) إذا كان د(س) = 3س − 4.\nالإجابة النموذجية: 11 ÷ 3", "للطالب: تمارين 2-3: الأسئلة 1–5 (كتاب الطالب ص62–66، كتاب النشاط ص62–64).\nلولي الأمر: متابعة تقدم الابن/الابنة في «شرط وجود الدالة العكسية وإيجاد معكوس الدوال الخطية والنسبية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=11"]}, {"ax": "معكوس الدالة التربيعية بتقييد المجال والإكمال إلى مربع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحدد أكبر مجال تكون فيه الدالة التربيعية واحدًا إلى واحد.\n2) يجد معكوس الدالة التربيعية باستخدام الإكمال إلى مربع.\nمخرج تعليمي آخر: يحدد مجال المعكوس ومداه.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "تقييد المجال، الإكمال إلى مربع، معكوس الدالة التربيعية، الجذر الموجب والسالب.", "يسأل المعلم: لماذا لا يوجد معكوس لـ د(س) = س² − 6س + 11، س ∈ ح؟ وكيف نقيد المجال؟ ويقترح الطالب س ≥ 3 أو س ≤ 3.", "1. التهيئة: يسأل المعلم: لماذا لا يوجد معكوس لـ د(س) = س² − 6س + 11، س ∈ ح؟ وكيف نقيد المجال؟ ويقترح الطالب س ≥ 3 أو س ≤ 3 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = س² − 6س + 11 = (س − 3)² + 2، س ≥ 3 ← د⁻¹(س) = 3 + √(س − 2)، س ≥ 2، ويتابع الطالب ويحدد المجال والمدى (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: د(س) = 2س² + 4س − 1، س ≥ −1؛ و )، ص = د(−س).", "يعرض المعلم ص = √س و ص = −√س و ص = √(−س) ويسأل: أين تقع كل صورة؟ ويميز الطالب الانعكاسين.", "1. التهيئة: يعرض المعلم ص = √س و ص = −√س و ص = √(−س) ويسأل: أين تقع كل صورة؟ ويميز الطالب الانعكاسين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يطلب المعلم جدول قيم لـ ص = −(س² − 4س) و ص = (−س)² − 4(−س) ومقارنتها بالأصل، ويكتشف الطالب أثر كل تحويل على النقاط (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم: انعكاس ص = س² − 4س في المحور الصادي ← ص = س² + 4س؛ وفي المحور السيني ← ص = −س² + 4س، ويتابع الطالب ويحدد صورة الرأس (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم صورة (2، −4) في كل انعكاس، والطالب: في السيني (2، 4) وفي الصادي (−2، −4) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-5ب: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] اكتب معادلة ص = √س بعد الانعكاس في المحور السيني.\nالإجابة النموذجية: ص = −√س\n2) [مستوى التطبيق] اكتب ص = س³ + 1 بعد الانعكاس في المحور الصادي.\nالإجابة النموذجية: ص = −س³ + 1\n3) [مستوى الاستدلال] صورة (2، −4) بالانعكاس في المحور الصادي؟\nالإجابة النموذجية: (−2، −4)", "1) [مستوى المعرفة] أكمل: ص = −د(س) انعكاس في المحور ___\nالإجابة النموذجية: السيني\n2) [مستوى التطبيق] اكتب ص = س² − 4س بعد الانعكاس في المحور الصادي.\nالإجابة النموذجية: ص = س² + 4س\n3) [مستوى الاستدلال] ما الدالة التي لا تتغير بالانعكاس في المحور الصادي من بين: س²، س³؟\nالإجابة النموذجية: س² (دالة زوجية)", "للطالب: تمارين 2-5ب: الأسئلة 1–3 (كتاب الطالب ص75–76، كتاب النشاط ص73–75).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الانعكاس في المحور السيني والمحور الصادي».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=14"]}, {"ax": "دمج الانعكاس مع الانسحاب", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يطبق انعكاسًا وانسحابًا متتاليين على منحنى.\n2) يكتب معادلة المنحنى الناتج.\nمخرج تعليمي آخر: يحلل تحويلًا مركبًا إلى تحويلات بسيطة.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التحويل المركب، الانعكاس ثم الانسحاب، صورة الرأس.", "يسأل المعلم: ص = 3 − س² يمكن الحصول عليها من ص = س² بأي تحويلين؟ ويقترح الطالب: انعكاس في السيني ثم انسحاب 3 للأعلى.", "1. التهيئة: يسأل المعلم: ص = 3 − س² يمكن الحصول عليها من ص = س² بأي تحويلين؟ ويقترح الطالب: انعكاس في السيني ثم انسحاب 3 للأعلى (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ص = س² ← انعكاس في السيني ← ص = −س² ← انسحاب (0، 3) ← ص = 3 − س²، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم تحويلات مركبة لوصفها: ص = −(س − 2)² + 1، ص = √(−س) + 2، وتصف المجموعة التحويلات بالترتيب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم صورة الرأس (0، 0) في ص = −(س − 2)² + 1، والطالب: (2، 1) نقطة عظمى (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-5ب ومحور «دمج الانعكاس مع الانسحاب»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-5ب: الأسئلة 4–6، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] صف تحويل ص = س² إلى ص = 3 − س².\nالإجابة النموذجية: انعكاس في المحور السيني ثم انسحاب 3 للأعلى\n2) [مستوى التطبيق] اكتب ص = √س بعد انعكاس في الصادي ثم انسحاب وحدتين للأعلى.\nالإجابة النموذجية: ص = √(−س) + 2\n3) [مستوى الاستدلال] رأس ص = −(س − 2)² + 1؟\nالإجابة النموذجية: (2، 1) عظمى", "1) [مستوى المعرفة] أكمل: ص = −س² + 5 هي انعكاس ص = س² في المحور السيني ثم انسحاب ___ وحدات للأعلى.\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] صف تحويل ص = س³ إلى ص = −س³ − 1.\nالإجابة النموذجية: انعكاس في السيني (أو الصادي) ثم انسحاب 1 للأسفل\n3) [مستوى الاستدلال] اكتب ص = 1 ÷ س بعد الانعكاس في السيني ثم الانسحاب (2، 0).\nالإجابة النموذجية: ص = −1 ÷ (س − 2)", "للطالب: تمارين 2-5ب: الأسئلة 4–6 (كتاب الطالب ص75–76، كتاب النشاط ص73–75).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «دمج الانعكاس مع الانسحاب» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=14"]}]}, {"id": "2-5ج", "title": "التحويلات الهندسية للدوال: التمدد", "p": [{"ax": "التمدد الرأسي ص = أ د(س)", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف التمدد الرأسي بمعامل أ.\n2) يجد صور النقاط بالتمدد الرأسي.\nمخرج تعليمي آخر: يكتب معادلة المنحنى بعد تمدد رأسي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "التمدد الرأسي، معامل التمدد، المحور الثابت (السيني)، ص = أ د(س).", "يعرض المعلم ص = س² و ص = 3س² ويسأل: ماذا حدث لارتفاع كل نقطة؟ ويلاحظ الطالب تضاعف الإحداثي الصادي 3 مرات.", "1. التهيئة: يعرض المعلم ص = س² و ص = 3س² ويسأل: ماذا حدث لارتفاع كل نقطة؟ ويلاحظ الطالب تضاعف الإحداثي الصادي 3 مرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يتيح المعلم تحريك المنزلق أ في ص = أ د(س) على GeoGebra، ويسجل الطالب أثر أ > 1 و 0 < أ < 1 (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم: ص = 2(س² − 4) تمدد رأسي لـ ص = س² − 4 بمعامل 2؛ صورة (3، 5) هي (3، 10)، والمقاطع السينية ثابتة، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يسأل المعلم: لماذا لا تتغير المقاطع السينية بالتمدد الرأسي؟ والطالب: لأن ص = 0 تبقى صفرًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-5ج: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] صف تحويل ص = س² إلى ص = 3س².\nالإجابة النموذجية: تمدد رأسي بمعامل 3\n2) [مستوى التطبيق] صورة (2، 4) بتمدد رأسي معامله 1/2؟\nالإجابة النموذجية: (2، 2)\n3) [مستوى الاستدلال] اكتب ص = √س بعد تمدد رأسي معامله 4.\nالإجابة النموذجية: ص = 4√س", "1) [مستوى المعرفة] أكمل: ص = أ د(س) تمدد رأسي بمعامل ___\nالإجابة النموذجية: أ\n2) [مستوى التطبيق] صف تحويل ص = س³ إلى ص = 0.5س³.\nالإجابة النموذجية: تمدد رأسي بمعامل 0.5\n3) [مستوى الاستدلال] هل تتغير المقاطع السينية لـ ص = س² − 4 بالتمدد الرأسي؟\nالإجابة النموذجية: لا، تبقى ±2", "للطالب: تمارين 2-5ج: الأسئلة 1–3 (كتاب الطالب ص77–79، كتاب النشاط ص76–79).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «التمدد الرأسي ص = أ د(س)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=15"]}, {"ax": "التمدد الأفقي ص = د(أس)", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف التمدد الأفقي بمعامل 1/أ.\n2) يجد صور النقاط بالتمدد الأفقي.\nمخرج تعليمي آخر: يميّز بين التمدد الأفقي والرأسي من المعادلة.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات معادلات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التمدد الأفقي، المعامل 1/أ، المحور الثابت (الصادي)، ص = د(أس).", "يعرض المعلم ص = س² − 4 و ص = (2س)² − 4 ويسأل: أين أصبحت المقاطع السينية؟ ويجد الطالب ±1 بدل ±2.", "1. التهيئة: يعرض المعلم ص = س² − 4 و ص = (2س)² − 4 ويسأل: أين أصبحت المقاطع السينية؟ ويجد الطالب ±1 بدل ±2 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ص = د(2س) تمدد أفقي معامله 1/2؛ صورة (4، د(4)) هي (2، د(4))، ويتابع الطالب ويطبق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم بطاقات معادلات لتمييز نوع التمدد ومعامله، وتصنف المجموعة (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم صورة (6، 3) بالتمدد ص = د(3س)، والطالب: (2، 3) (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-5ج ومحور «التمدد الأفقي ص = د(أس)»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-5ج: الأسئلة 4–6، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] صف تحويل ص = د(س) إلى ص = د(2س).\nالإجابة النموذجية: تمدد أفقي بمعامل 1/2\n2) [مستوى التطبيق] صورة (6، 3) بالتحويل ص = د(3س)؟\nالإجابة النموذجية: (2، 3)\n3) [مستوى الاستدلال] صف تحويل ص = √س إلى ص = √(س ÷ 2).\nالإجابة النموذجية: تمدد أفقي بمعامل 2", "1) [مستوى المعرفة] أكمل: ص = د(أس) تمدد أفقي بمعامل ___\nالإجابة النموذجية: 1/أ\n2) [مستوى التطبيق] أين تصبح المقاطع السينية لـ ص = س² − 9 بعد التحويل ص = (3س)² − 9؟\nالإجابة النموذجية: ±1\n3) [مستوى الاستدلال] ميّز: ص = 2د(س) و ص = د(2س).\nالإجابة النموذجية: الأول تمدد رأسي بمعامل 2، والثاني أفقي بمعامل 1/2", "للطالب: تمارين 2-5ج: الأسئلة 4–6 (كتاب الطالب ص77–79، كتاب النشاط ص76–79).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=15"]}]}, {"id": "2-6", "title": "تركيب التحويلات الهندسية", "p": [{"ax": "ترتيب التحويلات وأثره على المعادلة", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يطبق تحويلين أو أكثر بترتيب معين ويكتب المعادلة الناتجة.\n2) يبين أثر ترتيب التحويلات على الناتج.\nمخرج تعليمي آخر: يجد صورة نقطة تحت تحويلات متتالية.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "تركيب التحويلات، الترتيب، ص = أ د(س) + ب، ص = أ(د(س) + ب).", "يسأل المعلم: هل «تمدد بمعامل 2 ثم انسحاب 3 للأعلى» يعطي النتيجة نفسها لـ «انسحاب 3 ثم تمدد 2»؟ ويجرب الطالب على نقطة ويقارن.", "1. التهيئة: يسأل المعلم: هل «تمدد بمعامل 2 ثم انسحاب 3 للأعلى» يعطي النتيجة نفسها لـ «انسحاب 3 ثم تمدد 2»؟ ويجرب الطالب على نقطة ويقارن (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: تمدد 2 ثم انسحاب (0، 3) ← ص = (س) + 3؛ أما انسحاب ثم تمدد ← ص = (س) + 6، ويقارن الطالب صورة النقطة (1، 1) في الحالتين (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم سلاسل تحويلات على المجموعات لكتابة المعادلة الناتجة لـ ص = س²، وتكتب المجموعة المعادلات وتتحقق (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطلب المعلم صورة (2، 4) على ص = س² بالتحويل ص = 3(س − 1)² + 2، والطالب: (3، 14) (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-6: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] اكتب ص = س² بعد تمدد رأسي 2 ثم انسحاب (0، 3).\nالإجابة النموذجية: ص = 2س² + 3\n2) [مستوى التطبيق] اكتبها بعد انسحاب (0، 3) ثم تمدد رأسي 2.\nالإجابة النموذجية: ص = 2س² + 6\n3) [مستوى الاستدلال] صورة (2، 4) بالتحويل ص = 3(س − 1)² + 2؟\nالإجابة النموذجية: (3، 14)", "1) [مستوى المعرفة] أكمل: ترتيب التحويلات ___ على المعادلة الناتجة.\nالإجابة النموذجية: يؤثر\n2) [مستوى التطبيق] اكتب ص = √س بعد انعكاس في السيني ثم انسحاب (1، 2).\nالإجابة النموذجية: ص = −√(س − 1) + 2\n3) [مستوى الاستدلال] صورة (1، 1) على ص = س² بالتحويل ص = −2(س + 3)² + 4؟\nالإجابة النموذجية: (−2، 2)", "للطالب: تمارين 2-6: الأسئلة 1–4 (كتاب الطالب ص80–87، ومراجعة الوحدة ص88–92، كتاب النشاط ص80–85، ومراجعة الوحدة ص86–89).\nلولي الأمر: متابعة تقدم الابن/الابنة في «ترتيب التحويلات وأثره على المعادلة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=16"]}, {"ax": "وصف تسلسل التحويلات بين منحنيين ومراجعة الوحدة", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف تسلسل التحويلات التي تحول منحنى إلى آخر.\n2) يستخدم الإكمال إلى مربع لوصف التحويلات.\nمخرج تعليمي آخر: يقيم أوصاف تحويلات مقترحة ويصحح الخاطئ منها.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "وصف التحويلات، الإكمال إلى مربع، التحقق بالنقاط، مراجعة الوحدة.", "يكتب المعلم ص = 2س² − 12س + 13 ويسأل: كيف نحصل عليها من ص = س²؟ ويقترح الطالب الإكمال إلى مربع أولًا.", "1. التهيئة: يكتب المعلم ص = 2س² − 12س + 13 ويسأل: كيف نحصل عليها من ص = س²؟ ويقترح الطالب الإكمال إلى مربع أولًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س² − 12س + 13 = 2(س − 3)² − 5 ← انسحاب (3، 0)، تمدد رأسي 2، انسحاب (0، −5)، ويتابع الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم أسئلة من مراجعة نهاية الوحدة ص88–92 على المجموعات، وتحل المجموعة وتعرض (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يعرض المعلم وصفًا خاطئًا ويطلب تصحيحه، ويصحح الطالب ويبرر (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-6 ومحور «وصف تسلسل التحويلات بين منحنيين ومراجعة الوحدة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-6: الأسئلة 5–8، وتمارين مراجعة نهاية الوحدة ص88–92، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] صف تحويل ص = س² إلى ص = 2(س − 3)² − 5.\nالإجابة النموذجية: انسحاب 3 لليمين، تمدد رأسي 2، انسحاب 5 للأسفل\n2) [مستوى التطبيق] اكتب 2س² − 12س + 13 بصورة أ(س − ف)² + ك.\nالإجابة النموذجية: 2(س − 3)² − 5\n3) [مستوى الاستدلال] صف تحويل ص = س² إلى ص = −(س + 1)² + 4.\nالإجابة النموذجية: انسحاب 1 لليسار، انعكاس في السيني، انسحاب 4 للأعلى", "1) [مستوى المعرفة] أكمل: لوصف التحويلات لدالة تربيعية نكتبها أولًا بصورة ___\nالإجابة النموذجية: الإكمال إلى مربع\n2) [مستوى التطبيق] صف تحويل ص = س² إلى ص = 3س² + 6س + 1.\nالإجابة النموذجية: 3(س + 1)² − 2: انسحاب 1 لليسار، تمدد رأسي 3، انسحاب 2 للأسفل\n3) [مستوى الاستدلال] اكتب معادلة صورة ص = 1 ÷ س بتمدد أفقي 1/2 ثم انسحاب (0، 1).\nالإجابة النموذجية: ص = 1 ÷ (2س) + 1", "للطالب: تمارين 2-6: الأسئلة 5–8، وتمارين مراجعة نهاية الوحدة ص88–92 (كتاب الطالب ص80–87، ومراجعة الوحدة ص88–92، كتاب النشاط ص80–85، ومراجعة الوحدة ص86–89).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=16"]}]}, {"id": "3-1", "title": "المتتاليات الحسابية", "p": [{"ax": "الحد العام للمتتالية الحسابية وعدد الحدود", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يجد الحد العام حن = أ + (ن − 1)د لمتتالية حسابية.\n2) يجد عدد حدود متتالية حسابية منتهية.\nمخرج تعليمي آخر: يجد أ و د من حدين معلومين.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتتالية الحسابية، الحد الأول أ، الأساس د، الحد العام حن، عدد الحدود.", "يعرض المعلم 7، 11، 15، ... ويسأل: ما الحد المئة دون كتابة الحدود؟ ويبحث الطالب عن قاعدة عامة.", "1. التهيئة: يعرض المعلم 7، 11، 15، ... ويسأل: ما الحد المئة دون كتابة الحدود؟ ويبحث الطالب عن قاعدة عامة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. استكشاف: يوزع المعلم نشاط «استكشف 1» ص93 لاستنتاج قاعدة الحد العام من أنماط، ويستنتج الطالب حن = أ + (ن − 1)د (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم: ح100 في 7، 11، 15 = 7 + 99 × 4 = 403؛ عدد حدود 5، 8، ...، 302 = 100؛ ح4 = 17 و ح9 = 42 ← د = 5، أ = 2، ويطبق الطالب أمثلة مشابهة (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطرح المعلم: هل 500 حد في 7، 11، 15، ...؟ والطالب: 4ن + 3 = 500 ← ن غير صحيح، فلا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-1: الأسئلة 1–6، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] ح20 في 3، 9، 15، ...؟\nالإجابة النموذجية: 3 + 19 × 6 = 117\n2) [مستوى التطبيق] عدد حدود 5، 8، ...، 302؟\nالإجابة النموذجية: (302 − 5) ÷ 3 + 1 = 100\n3) [مستوى الاستدلال] ح4 = 17، ح9 = 42. أوجد أ و د.\nالإجابة النموذجية: د = 5، أ = 2", "1) [مستوى المعرفة] أكمل: حن = أ + (___)د\nالإجابة النموذجية: ن − 1\n2) [مستوى التطبيق] ح3 = 20، ح10 = −1. أوجد ح15.\nالإجابة النموذجية: د = −3، أ = 26، ح15 = −16\n3) [مستوى الاستدلال] أول حد سالب في 100، 93، 86، ...؟\nالإجابة النموذجية: 100 − 7(ن − 1) < 0 ← ن ≥ 16، ح16 = −5", "للطالب: تمارين 3-1: الأسئلة 1–6 (كتاب الطالب ص93–98، كتاب النشاط ص90–93). ويني: يطلب المعلم صياغة مسألة حياتية حلها متسلسلة حسابية، ويصوغ الطالب ويتبادل (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 3-1 ومحور «تطبيقات حياتية على المتتاليات الحسابية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 3-1: الأسئلة 13–16، وكتاب النشاط، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] راتب 600 يزيد 25 سنويًا. الراتب الشهري في السنة العاشرة؟\nالإجابة النموذجية: 825 ريالًا\n2) [مستوى التطبيق] مجموع الرواتب الشهرية (لشهر واحد من كل سنة) في 10 سنوات؟\nالإجابة النموذجية: 5 × (600 + 825) = 7125\n3) [مستوى الاستدلال] مدرج 25 صفًا، الأول 20 مقعدًا ويزيد 2. المجموع؟\nالإجابة النموذجية: 12.5 × (40 + 48) = 1100", "1) [مستوى المعرفة] أكمل: إذا زاد الادخار بمقدار ثابت كل شهر فهو متتالية ___\nالإجابة النموذجية: حسابية\n2) [مستوى التطبيق] ادخار 10 ريالات تزيد 5 شهريًا. متى يصل المجموع إلى 1000؟\nالإجابة النموذجية: ن(5ن + 15) ÷ 2 = 1000 ← ن² + 3ن − 400 = 0 ← ن ≈ 18.6، أي في الشهر 19\n3) [مستوى الاستدلال] عرضان: 500 يزيد 40، أو 600 يزيد 20 سنويًا. أيهما أكثر مجموعًا في 10 سنوات؟\nالإجابة النموذجية: الأول 5 × (1000 + 360) = 6800، الثاني 5 × (1200 + 180) = 6900، الثاني", "للطالب: تمارين 3-1: الأسئلة 13–16، وكتاب النشاط (كتاب الطالب ص93–98، كتاب النشاط ص90–93).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تطبيقات حياتية على المتتاليات الحسابية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=17"]}]}, {"id": "3-2", "title": "المتتاليات الهندسية", "p": [{"ax": "الحد العام للمتتالية الهندسية وأساسها", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يجد الحد العام حن = أ ر^(ن − 1).\n2) يجد أ و ر من حدين معلومين بما في ذلك ر السالب.\nمخرج تعليمي آخر: يجد أول حد يتجاوز قيمة معينة بالتجريب.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "المتتالية الهندسية، النسبة المشتركة ر، الحد العام، القوى.", "يعرض المعلم 3، 6، 12، ... ويسأل: كيف نتنبأ بالحد العاشر؟ ويلاحظ الطالب الضرب المتكرر في 2.", "1. التهيئة: يعرض المعلم 3، 6، 12، ... ويسأل: كيف نتنبأ بالحد العاشر؟ ويلاحظ الطالب الضرب المتكرر في 2 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ح10 = 3 × 2^9 = 1536؛ ح2 = 12، ح5 = −96 ← ر³ = −8 ← ر = −2، أ = −6، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم أول حد في 3، 6، 12، ... يتجاوز 1000، ويجرب الطالب: ح9 = 768، ح10 = 1536 ← الحد العاشر (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطرح المعلم: ح3 = 18، ح5 = 162. أوجد ر، والطالب: ر² = 9 ← ر = ±3 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 1–6، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] ح8 في 2، 6، 18، ...؟\nالإجابة النموذجية: 2 × 3^7 = 4374\n2) [مستوى التطبيق] ح2 = 12، ح5 = −96. أوجد ر و أ.\nالإجابة النموذجية: ر = −2، أ = −6\n3) [مستوى الاستدلال] أول حد في 3، 6، 12 يتجاوز 1000؟\nالإجابة النموذجية: الحد العاشر 1536", "1) [مستوى المعرفة] أكمل: ر = حن+1 ÷ ___\nالإجابة النموذجية: حن\n2) [مستوى التطبيق] ح3 = 18، ح5 = 162. أوجد القيم الممكنة لـ ح1.\nالإجابة النموذجية: ر = ±3، ح1 = 2\n3) [مستوى الاستدلال] أول حد في 80، 40، 20، ... أقل من 1؟\nالإجابة النموذجية: ح8 = 0.625", "للطالب: تمارين 3-2: الأسئلة 1–6 (كتاب الطالب ص99–104، كتاب النشاط ص94–97).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=18"]}, {"ax": "مجموع المتسلسلة الهندسية المنتهية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يبرهن صيغة جن = أ(1 − رⁿ) ÷ (1 − ر).\n2) يحسب مجموع أول ن حدًا.\nمخرج تعليمي آخر: يجد أقل عدد حدود ليتجاوز المجموع قيمة معينة.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "المتسلسلة الهندسية، جن، الطرح المتداخل، أقل عدد حدود.", "يسأل المعلم: 1 + 2 + 4 + ... + 512 = ؟ ويقترح الطالب 1023.", "1. التهيئة: يسأل المعلم: 1 + 2 + 4 + ... + 512 = ؟ ويقترح الطالب 1023 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يبرهن المعلم الصيغة بطرح ر جن من جن، ويطبق: 2 + 6 + 18 + ... (8 حدود) = 6560، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. حل مشكلة: يقدم المعلم: أقل ن يجعل 1 + 2 + 4 + ... > 5000، والطالب: 2ⁿ − 1 > 5000 ← ن = 13 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطلب مجموع 64 − 32 + 16 − ... (6 حدود)، والطالب: 64(1 − (−1/2)^6) ÷ (3/2) = 42 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 7–11، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] مجموع أول 8 حدود من 2، 6، 18، ...؟\nالإجابة النموذجية: 2(3^8 − 1) ÷ 2 = 6560\n2) [مستوى التطبيق] أقل ن ليتجاوز 1 + 2 + 4 + ... العدد 5000؟\nالإجابة النموذجية: 13\n3) [مستوى الاستدلال] مجموع 64 − 32 + 1 -2 ومحور «تطبيقات النمو والتناقص الهندسي»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 3-2: الأسئلة 12–15، وكتاب النشاط، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] معامل النمو لزيادة 4%؟\nالإجابة النموذجية: 1.04\n2) [مستوى التطبيق] قيمة 2000 بعد 5 سنوات بفائدة 4%؟\nالإجابة النموذجية: ≈ 2433 ريالًا\n3) [مستوى الاستدلال] سيارة 10000 تفقد 12% سنويًا، قيمتها بعد 3 سنوات؟\nالإجابة النموذجية: 10000 × 0.88³ ≈ 6815 ريالًا", "1) [مستوى المعرفة] أكمل: معامل التناقص لانخفاض 12% هو ___\nالإجابة النموذجية: 0.88\n2) [مستوى التطبيق] بعد كم سنة يتجاوز 2000 بفائدة 4% مبلغ 3000؟\nالإجابة النموذجية: 11 سنة\n3) [مستوى الاستدلال] قرية 5000 نسمة تزيد 2.5% سنويًا. عددها بعد 4 سنوات؟\nالإجابة النموذجية: 5000 × 1.025^4 ≈ 5519", "للطالب: تمارين 3-2: الأسئلة 12–15، وكتاب النشاط (كتاب الطالب ص99–104، كتاب النشاط ص94–97).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=18"]}]}, {"id": "3-3", "title": "المتسلسلات الهندسية غير المنتهية", "p": [{"ax": "شرط التقارب والمجموع إلى ما لا نهاية", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يذكر شرط التقارب |ر| < 1.\n2) يحسب ج∞ = أ ÷ (1 − ر).\nمخرج تعليمي آخر: يستنتج الصيغة من جن عندما ن تؤول إلى ما لا نهاية.", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "التقارب، التباعد، المجموع إلى ما لا نهاية، النهاية.", "يعرض المعلم المجاميع الجزئية لـ 1/2 + 1/4 + ... في جدول ويسأل: إلى أين تقترب؟ ويلاحظ الطالب الاقتراب من 1.", "1. التهيئة: يعرض المعلم المجاميع الجزئية لـ 1/2 + 1/4 + ... في جدول ويسأل: إلى أين تقترب؟ ويلاحظ الطالب الاقتراب من 1 (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يشتق المعلم ج∞ ويطبق: 18 + 6 + 2 + ... = 27؛ 10 − 5 + 2.5 − ... = 20/3، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تطبيق موجّه: يطلب المعلم تمييز المتقاربة من المتباعدة وحساب ج∞ للمتقاربة، ويصنف الطالب ويحسب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطرح المعلم: لماذا لا يوجد ج∞ لـ 1 + 1.1 + 1.21 + ...؟ والطالب: ر = 1.1 > 1 (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: الأسئلة 1–5، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] ج∞ لـ 18 + 6 + 2 + ...؟\nالإجابة النموذجية: 27\n2) [مستوى التطبيق] ج∞ لـ 10 − 5 + 2.5 − ...؟\nالإجابة النموذجية: 20/3\n3) [مستوى الاستدلال] هل 1 + 1.1 + 1.21 + ... متقاربة؟\nالإجابة النموذجية: لا، ر = 1.1", "1) [مستوى المعرفة] أكمل: ج∞ = أ ÷ (___)\nالإجابة النموذجية: 1 − ر\n2) [مستوى التطبيق] ج∞ لـ 0.6 + 0.06 + 0.006 + ...؟\nالإجابة النموذجية: 2/3\n3) [مستوى الاستدلال] ج∞ لـ 5 + 4 + 3.2 + ...؟\nالإجابة النموذجية: ر = 0.8، ج∞ = 25", "للطالب: تمارين 3-3: الأسئلة 1–5 (كتاب الطالب ص105–109، كتاب النشاط ص98–102).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «شرط التقارب والمجموع إلى ما لا نهاية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=19"]}, {"ax": "مسائل على ج∞ ومتسلسلات تتضمن متغيرًا", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يجد أ أو ر من ج∞ ومعطيات أخرى.\n2) يجد قيم س التي تجعل متسلسلة في س متقاربة.\nمخرج تعليمي آخر: يجد ج∞ بدلالة س.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "ر بدلالة متغير، شرط التقارب كمتباينة، ج∞ بدلالة س.", "يكتب المعلم 1 + 2س + 4س² + ... ويسأل: ما الأساس؟ ومتى تتقارب؟ والطالب: ر = 2س، |2س| < 1.", "1. التهيئة: يكتب المعلم 1 + 2س + 4س² + ... ويسأل: ما الأساس؟ ومتى تتقارب؟ والطالب: ر = 2س، |2س| < 1 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: التقارب عندما −1/2 < س < 1/2، و ج∞ = 1 ÷ (1 − 2س)؛ وإذا ج∞ = 4 ← س = 3/8، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: ح2 = 6 و ج∞ = 32 أوجد ر (ر = 1/4 أو 3/4)، وتحل: أر = 6، أ ÷ (1 − ر) = 32 ← 16ر² − 16ر + 3 = 0 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم قيم س لتقارب 1 + (س − 1) + (س − 1)² +، والطالب: 0 < س < 2 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: الأسئلة 6–10، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] متى تتقارب 1 + 2س + 4س² + ...؟\nالإجابة النموذجية: −1/2 < س < 1/2\n2) [مستوى التطبيق] أوجد س إذا ج∞ = 4 للمتسلسلة السابقة.\nالإجابة النموذجية: س = 3/8\n3) [مستوى الاستدلال] ح2 = 6، ج∞ = 32. أوجد ر.\nالإجابة النموذجية: ر = 1/4 أو 3/4", "1) [مستوى المعرفة] أكمل: المتسلسلة 1 + (س − 1) + ... تتقارب عندما 0 < س < ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد ج∞ بدلالة س للمتسلسلة 3 + 3س + 3س² + ...\nالإجابة النموذجية: 3 ÷ (1 − س)، |س| < 1\n3) [مستوى الاستدلال] ج∞ = 3 × الحد الأول. أوجد ر.\nالإجابة النموذجية: ر = 2/3", "للطالب: تمارين 3-3: الأسئلة 6–10 (كتاب الطالب ص105–109، كتاب النشاط ص98–102).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مسائل على ة ص113–116 (كتاب الطالب ص110–112، ومراجعة الوحدة ص113–116، كتاب النشاط ص103–105، ومراجعة الوحدة ص106).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=20"]}]}, {"id": "4-1", "title": "الوسط الحسابي (المعدل)", "p": [{"ax": "الوسط الحسابي ورمز المجموع للبيانات المفردة والتكرارية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يحسب الوسط الحسابي باستخدام ∑س ÷ ن و ∑(ت س) ÷ ∑ت.\n2) يستخدم رمز المجموع في الصيغ الإحصائية.\nمخرج تعليمي آخر: يجد قيمة مجهولة في جدول تكراري بمعلومية الوسط.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الوسط الحسابي (المعدل)، ∑س، ∑ت س، التكرار، القيمة المجهولة.", "يعرض المعلم أعمار 6 لاعبين ويسأل: كيف نعبر عن مجموعها برمز مختصر؟ ويكتب الطالب ∑س.", "1. التهيئة: يعرض المعلم أعمار 6 لاعبين ويسأل: كيف نعبر عن مجموعها برمز مختصر؟ ويكتب الطالب ∑س (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم الوسط من جدول تكراري: س = 1، 2، 3، 4 و ت = 3، 5، ك، 2، والوسط 2.4 ← (3 + 10 + 3ك + 8) ÷ (10 + ك) = 2.4 ← 21 + 3ك = 24 + 2.4ك ← ك = 5، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم وسط بيانات معطاة بالملخصات: ن = 25، ∑س = 1150، ويقوم الطالب بالوسط 46 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يسأل المعلم: أضيف لاعب عمره 30 لمجموعة من 6 وسطها 24. الوسط الجديد؟ والطالب: (144 + 30) ÷ 7 ≈ 24.9 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 1–5، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] ن = 25، ∑س = 1150. الوسط؟\nالإجابة النموذجية: 46\n2) [مستوى التطبيق] س = 1، 2، 3، 4 و ت = 3، 5، ك، 2، الوسط 2.4. أوجد ك.\nالإجابة النموذجية: ك = 5\n3) [مستوى الاستدلال] أضيف 30 لمجموعة من 6 وسطها 24. الوسط الجديد؟\nالإجابة النموذجية: ≈ 24.9", "1) [مستوى المعرفة] أكمل: الوسط من الجدول التكراري = ∑(ت س) ÷ ___\nالإجابة النموذجية: ∑ت\n2) [مستوى التطبيق] وسط 8 قيم 15، حذفت قيمة فأصبح الوسط 14. ما القيمة المحذوفة؟\nالإجابة النموذجية: 120 − 98 = 22\n3) [مستوى الاستدلال] س = 0، 1، 2 و ت = 4، ك، 6، الوسط 1.1. أوجد ك.\nالإجابة النموذجية: (ك + 12) ÷ (10 + ك) = 1.1 ← ك = 10", "للطالب: تمارين 4-1: الأسئلة 1–5 (كتاب الطالب ص117–125، كتاب النشاط ص107–110).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الوسط الحسابي ورمز المجموع للبيانات المفردة والتكرارية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=21"]}, {"ax": "الوسط الحسابي للبيانات المشفّرة", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يحسب الوسط باستخدام البيانات المشفرة: الوسط = ب + ∑(س − ب) ÷ ن.\n2) يفسر فائدة التشفير في تبسيط الحسابات.\nمخرج تعليمي آخر: يحول بين ملخصات مشفرة وغير مشفرة.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "البيانات المشفرة، الثابت ب، ∑(س − ب)، فك التشفير.", "يعرض المعلم أوزانًا قريبة من 50 كغم (48، 53، 51، 49، 54) ويسأل: كيف نحسب الوسط بسرعة؟ ويقترح الطالب طرح 50 من كل قيمة.", "1. التهيئة: يعرض المعلم أوزانًا قريبة من 50 كغم (48، 53، 51، 49، 54) ويسأل: كيف نحسب الوسط بسرعة؟ ويقترح الطالب طرح 50 من كل قيمة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ∑(س − 50) = 5 لخمس قيم ← الوسط = 50 + 1 = 51؛ ثم ن = 12 و ∑(س − 50) = 36 ← الوسط 53، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: ∑(س − 20) = −16 و ن = 8؛ و ∑(س − ب) = 30، ن = 10، ال م: كيف نقدر التباين لأطوال في فئات؟ ويقترح الطالب مراكز الفئات.", "1. التهيئة: يسأل المعلم: كيف نقدر التباين لأطوال في فئات؟ ويقترح الطالب مراكز الفئات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 0–<10 (2)، 10–<20 (5)، 20–<30 (3): الوسط 16، ∑ت م² = 3050، التباين 49، الانحراف 7، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم أسئلة من مراجعة نهاية الوحدة ص135–138 للمقارنة بين توزيعين، وتحل وتكتب استنتاجات (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...» للوحدة، ويقيم الطالب نفسه (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 4-2 ومحور «تقدير التباين للبيانات المجمعة ومراجعة الوحدة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين 4-2 ومراجعة نهاية الوحدة ص135–138، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] الانحراف المعياري التقديري في المثال؟\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] أ: الوسط 50، الانحراف 4؛ ب: الوسط 52، الانحراف 9. قارن.\nالإجابة النموذجية: ب أعلى في المتوسط، و أ أكثر اتساقًا\n3) [مستوى الاستدلال] 0–<4 (5)، 4–<8 (5). التباين التقديري؟\nالإجابة النموذجية: 4", "1) [مستوى المعرفة] أكمل: في البيانات المجمعة نستخدم ___ الفئات\nالإجابة النموذجية: مراكز\n2) [مستوى التطبيق] 0–<10 (4)، 10–<20 (6). التباين التقديري؟\nالإجابة النموذجية: الوسط 11، ∑ت م² = 1450، التباين 145 − 121 = 24\n3) [مستوى الاستدلال] أي توزيع أكثر اتساقًا: انحراف 3 أم 8 (بنفس الوحدات)؟\nالإجابة النموذجية: الانحراف 3", "للطالب: إكمال تمارين 4-2 ومراجعة نهاية الوحدة ص135–138 (كتاب الطالب ص126–134، ومراجعة الوحدة ص135–138، كتاب النشاط ص111–115، ومراجعة الوحدة ص116–117).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=22"]}]}, {"id": "5-1", "title": "طول القطعة المستقيمة وإحداثيات نقطة منتصفها", "p": [{"ax": "طول القطعة المستقيمة (المسافة بين نقطتين)", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يشتق صيغة المسافة بين نقطتين من نظرية فيثاغورس.\n2) يحسب طول قطعة مستقيمة بمعلومية طرفيها.\nمخرج تعليمي آخر: يصنف مثلثًا (متطابق الضلعين، قائم) باستخدام الأطوال.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني", "المسافة بين نقطتين، نظرية فيثاغورس، الصيغة الدقيقة بالجذور.", "يرسم المعلم النقطتين (1، 2) و (4، 6) على شبكة ويسأل: كيف نجد المسافة بينهما؟ ويرسم الطالب مثلثًا قائمًا ويستخدم فيثاغورس: 5.", "1. التهيئة: يرسم المعلم النقطتين (1، 2) و (4، 6) على شبكة ويسأل: كيف نجد المسافة بينهما؟ ويرسم الطالب مثلثًا قائمًا ويستخدم فيثاغورس: 5 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يشتق المعلم: المسافة = √((س2 − س1)² + (ص2 − ص1)²) ويطبق على (−2، 3) و (4، −5) ← √(36 + 64) = 10، ويتابع الطالب ويطبق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم رؤوس مثلثات: أ(1، 1)، ب(4، 5)، جـ(8، 2) لتحديد نوعها، وتحسب: أب = 5، ب جـ = 5، أ جـ = √50 ← متطابق الضلعين وقائم الزاوية عند ب (25 + 25 = 50) (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطرح المعلم: أوجد ك إذا كانت المسافة بين (1، ك) و (4، 5) تساوي 5، والطالب: 9 + (5 − ك)² = 25 ← ك = 1 أو 9 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-1: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] المسافة بين (1، 2) و (4، 6)؟\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] المسافة بين (−2، 3) و (4، −5)؟\nالإجابة النموذجية: 10\n3) [مستوى الاستدلال] المسافة بين (0، 0) و (2، 3) بصورة دقيقة؟\nالإجابة النموذجية: √13", "1) [مستوى المعرفة] أكمل: المسافة بين (س1، ص1) و (س2، ص2) = √((س2 − س1)² + (___)²)\nالإجابة النموذجية: ص2 − ص1\n2) [مستوى التطبيق] أوجد ك إذا كانت المسافة بين (1، ك) و (4، 5) تساوي 5.\nالإجابة النموذجية: ك = 1 أو 9\n3) [مستوى الاستدلال] بيّن أن المثلث أ(1، 1)، ب(4، 5)، جـ(8، 2) قائم الزاوية.\nالإجابة النموذجية: أب² + ب جـ² = 25 + 25 = 50 = أ جـ²", "للطالب: تمارين 5-1: الأسئلة 1–4 (كتاب الطالب ص139–142، كتاب النشاط ص118–121).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «طول القطعة المستقيمة (المسافة بين نقطتين)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=23"]}, {"ax": "إحداثيات نقطة المنتصف وتطبيقاتها", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يحسب إحداثيات نقطة منتصف قطعة مستقيمة.\n2) يجد أحد طرفي القطعة بمعلومية المنتصف والطرف الآخر.\nمخرج تعليمي آخر: يستخدم المنتصف والمسافة لحل مسائل هندسية (القطر، الدائرة).", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "نقطة المنتصف، متوسط الإحداثيين، الطرف المجهول، القطر.", "يسأل المعلم: ما منتصف المسافة بين 2 و 8 على خط الأعداد؟ والطالب: 5؛ ويعمم إلى متوسط الإحداثيات.", "1. التهيئة: يسأل المعلم: ما منتصف المسافة بين 2 و 8 على خط الأعداد؟ والطالب: 5؛ ويعمم إلى متوسط الإحداثيات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: منتصف (2، −1) و (6، 5) = (4، 2)؛ والمنتصف (3، 4) والطرف (−1، 6) ← الطرف الآخر (7، 2)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: أ ب قطر دائرة حيث أ(−3، 2)، ب(5، 8). أوجد المركز ونصف القطر، ويقوم الطالب بالمركز (1، 5)، نصف القطر 5 (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يكلف المعلم بسؤال من التمارين، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 5-1 ومحور «إحداثيات نقطة المنتصف وتطبيقاتها»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-1: الأسئلة 5–9، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] منتصف (2، −1) و (6، 5)؟\nالإجابة النموذجية: (4، 2)\n2) [مستوى التطبيق] المنتصف (3، 4) والطرف (−1، 6). الطرف الآخر؟\nالإجابة النموذجية: (7، 2)\n3) [مستوى الاستدلال] مركز ونصف قطر دائرة قطرها من (−3، 2) إلى (5، 8)؟\nالإجابة النموذجية: (1، 5)، 5", "1) [مستوى المعرفة] أكمل: منتصف (س1، ص1) و (س2، ص2) = ((س1 + س2) ÷ 2، ___)\nالإجابة النموذجية: (ص1 + ص2) ÷ 2\n2) [مستوى التطبيق] منتصف (−4، 7) و (2، −3)؟\nالإجابة النموذجية: (−1، 2)\n3) [مستوى الاستدلال] المنتصف (0، 0) وأحد الطرفين (5، −2). الآخر؟\nالإجابة النموذجية: (−5، 2)", "للطالب: تمارين 5-1: الأسئلة 5–9 (كتاب الطالب ص139–142، كتاب النشاط ص118–121).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «إحداثيات نقطة المنتصف وتطبيقاتها» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=23"]}]}, {"id": "5-2", "title": "المستقيمات المتوازية والمستقيمات المتعامدة", "p": [{"ax": "الميل والمستقيمات المتوازية", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يحسب ميل المستقيم المار بنقطتين.\n2) يستنتج أن المستقيمات المتوازية متساوية الميل.\nمخرج تعليمي آخر: يثبت أن ثلاث نقاط على استقامة واحدة باستخدام الميل.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "الميل م = (ص2 − ص1) ÷ (س2 − س1)، التوازي، الاستقامة.", "يعرض المعلم منحدرين للكراسي المتحركة ويسأل: أيهما أشد انحدارًا؟ كيف نقيس؟ ويقترح الطالب نسبة الارتفاع إلى المسافة الأفقية.", "1. التهيئة: يعرض المعلم منحدرين للكراسي المتحركة ويسأل: أيهما أشد انحدارًا؟ كيف نقيس؟ ويقترح الطالب نسبة الارتفاع إلى المسافة الأفقية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ميل المستقيم المار بـ (1، 2) و (4، 11) = 3؛ وأن المستقيمين المتوازيين لهما الميل نفسه، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم أسئلة: هل (1، 3)، (3، 7)، (6، 13) على استقامة واحدة؟ وهل أ ب جـ د متوازي أضلاع؟ وتحسب الميول وتحكم (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطرح المعلم: ميل مستقيم يوازي ص = 4 − 2س؟ والطالب: −2 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-2: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] ميل المستقيم المار بـ (1، 2) و (4، 11)؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] هل (1، 3)، (3، 7)، (6، 13) على استقامة واحدة؟\nالإجابة النموذجية: نعم، الميلان متساويان 2\n3) [مستوى الاستدلال] ميل مستقيم يوازي ص = 4 − 2س؟\nالإجابة النموذجية: −2", "1) [مستوى المعرفة] أكمل: المستقيمان المتوازيان ___ في الميل.\nالإجابة النموذجية: متساويان\n2) [مستوى التطبيق] ميل المستقيم المار بـ (−2، 5) و (3، −5)؟\nالإجابة النموذجية: −2\n3) [مستوى الاستدلال] أوجد ك إذا كان المستقيم المار بـ (1، ك) و (3، 7) يوازي ص = 3س + 1.\nالإجابة النموذجية: (7 − ك) ÷ 2 = 3 ← ك = 1", "للطالب: تمارين 5-2: الأسئلة 1–4 (كتاب الطالب ص143–146، كتاب النشاط ص122–126).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «الميل والمستقيمات المتوازية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=24"]}, {"ax": "المستقيمات المتعامدة والعمود المنصّف", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يستخدم شرط التعامد م1 × م2 = −1.\n2) يجد ميل العمود المنصّف لقطعة مستقيمة.\nمخرج تعليمي آخر: يثبت تعامد ضلعين في شكل هندسي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التعامد، م1 × م2 = −1، الميل العمودي، العمود المنصّف.", "يرسم المعلم مستقيمين متعامدين على شبكة بميلين 2 و −1/2 ويسأل: ما حاصل ضرب الميلين؟ ويجد الطالب −1.", "1. التهيئة: يرسم المعلم مستقيمين متعامدين على شبكة بميلين 2 و −1/2 ويسأل: ما حاصل ضرب الميلين؟ ويجد الطالب −1 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ميل العمودي على مستقيم ميله 2/3 هو −3/2؛ والعمود المنصّف لـ (1، 2) و (5، 6): المنتصف (3، 4) والميل −1، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: هل المثلث (0، 0)، (4، 2)، (1، 8) قائم؟ وتحسب: ميل (0،0)-(4،2) = 1/2، ميل (4،2)-(1،8) = −2 ← قائم عند (4، 2) (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يكلف المعلم بسؤال من التمارين، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 5-2 ومحور «المستقيمات المتعامدة والعمود المنصّف»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-2: الأسئلة 5–9، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ميل العمودي على مستقيم ميله 2/3؟\nالإج
