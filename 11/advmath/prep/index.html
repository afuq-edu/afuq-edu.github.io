:root{--bg:#f6f9fb;--card:#fff;--line:#dfe8ee;--ink:#2b3440;--mute:#64748b;--teal:#28607a;--tealbg:#eaf5f9;--lav:#eef0fb;--lavink:#454f8c;--green:#2f6b47;--greenbg:#e6f4ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'AR',system-ui,sans-serif;color:var(--ink);line-height:1.7}
header{background:linear-gradient(180deg,#f0f8fb,#f6f9fb);border-bottom:1px solid var(--line);padding:14px 16px 10px;position:sticky;top:0;z-index:5}
h1{margin:0 0 6px;font-size:1.15rem;color:var(--teal)}
.mode{display:flex;gap:6px;background:#e9eef2;border-radius:14px;padding:4px;max-width:520px}
.mode button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;padding:8px;border-radius:10px;color:var(--mute);cursor:pointer;transition:.25s}
.mode button.on{background:#fff;color:var(--teal);box-shadow:0 2px 8px rgba(40,96,122,.15)}
.explain{font-size:.85rem;color:var(--mute);margin:6px 2px 4px}
.now{display:inline-block;background:var(--greenbg);color:var(--green);border:1px solid #c5e5d2;border-radius:20px;padding:2px 12px;font-weight:700;font-size:.9rem;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
select{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;min-width:260px;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 14px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--tealbg);border-color:#b9d7e6;color:var(--teal);font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px}
.meta{background:#fff8e8;border:1px solid #f1e0b5;border-radius:12px;padding:8px 12px;margin-bottom:10px;color:#7a5a17;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ch{display:flex;justify-content:space-between;align-items:center;background:var(--lav);padding:7px 12px}
.ch b{color:var(--lavink)}.ch small{color:#8a90b8;margin-left:6px}
.copy{font:inherit;font-weight:700;border:1px solid #c5e5d2;background:var(--greenbg);color:var(--green);border-radius:10px;padding:4px 14px;cursor:pointer;min-width:96px;transition:.2s}
.copy.done{background:#2f6b47;color:#fff}
.cb{padding:10px 14px;white-space:pre-wrap;font-size:.95rem}
.hint{display:none;color:#a05a1c;font-size:.85rem;padding:0 14px 8px}
@media(max-width:700px){header{position:static}}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:16px}

ر جديد، الرجوع للمتغير الأصلي، الحلول الدخيلة.", "يكتب س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟\nدور الطالب: يلاحظ ص² − 5ص + 4 = 0.", "(5 د) التهيئة: المعلم: يكتب س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟ | الطالب: يلاحظ ص² − 5ص + 4 = 0.\n(10 د) النمذجة: المعلم: ينمذج: س⁴ − 5س² + 4 = 0 ← ص = س² ← (ص − 1)(ص − 4) = 0 ← س = ±1، ±2. | الطالب: يتابع ويكمل الرجوع للمتغير.\n(10 د) تطبيق موجّه: المعلم: يحل: س − 5√س + 6 = 0 ← ص = √س ← ص = 2، 3 ← س = 4، 9، ويتحقق. | الطالب: يحل مسألة مشابهة: س − √س − 2 = 0 ← س = 4 فقط (نرفض √س = −1).\n(8 د) تقويم تكويني: المعلم: يسأل: لماذا رفضنا √س = −1؟ | الطالب: لأن الجذر التربيعي الموجب لا يكون سالبًا.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: الأسئلة 1–4. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: س⁴ − 10س² + 9 = 0.\nالإجابة النموذجية: س² = 1 أو 9 ← س = ±1، ±3\n2) [مستوى المتوقع] حل: س − 5√س + 6 = 0.\nالإجابة النموذجية: س = 4 أو 9\n3) [مستوى المتقدم] حل: س − √س − 2 = 0.\nالإجابة النموذجية: √س = 2 (نرفض −1) ← س = 4", "1) [مستوى الدعم] أكمل: في س⁴ − 5س² + 4 = 0 نعوض ص = ___\nالإجابة النموذجية: س²\n2) [مستوى المتوقع] حل: س⁴ − 3س² − 4 = 0.\nالإجابة النموذجية: س² = 4 أو −1 (مرفوض) ← س = ±2\n3) [مستوى المتقدم] حل: 2س − 7√س + 3 = 0.\nالإجابة النموذجية: √س = 3 أو 1/2 ← س = 9 أو 1/4", "للطالب: تمارين 1-6: الأسئلة 1–4 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «المعادلات في صورة تربيعية مقنّعة (س⁴، √س)»."]}, {"ax": "معادلات بمقلوبات أو بعبارات مركبة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحول معادلة فيها 1/س أو 1/س² إلى تربيعية.\n2) يحل معادلات من الصورة (عبارة)² + ب(عبارة) + جـ = 0.\nمخرج تعليمي آخر: يختار التعويض الأنسب ويبرره.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المقلوب، الضرب في المقام المشترك، التعويض بعبارة، القيود على المجال.", "يسأل: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟\nدور الطالب: يقترح الضرب في س².", "(5 د) التهيئة: المعلم: يسأل: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟ | الطالب: يقترح الضرب في س².\n(10 د) النمذجة: المعلم: ينمذج: 6/س² − 5/س + 1 = 0 ← س² − 5س + 6 = 0 ← س = 2، 3 (س ≠ 0). | الطالب: يتابع.\n(10 د) تعلم تعاوني: المعلم: يوزع: (س² + 1)² − 7(س² + 1) + 10 = 0، و (2س − 1)² − 5(2س − 1) + 6 = 0. | الطالب: تحل: س² + 1 = 2 أو 5 ← س = ±1، ±2؛ 2س − 1 = 2 أو 3 ← س = 3/2، 2.\n(8 د) تقويم تكويني: المعلم: يكلف بسؤال من تمارين 1-6 فرديًا. | الطالب: يحل ويعرض.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-6 ومحور «معادلات بمقلوبات أو بعبارات مركبة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-6: الأسئلة 5–8. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: 6/س² − 5/س + 1 = 0.\nالإجابة النموذجية: س = 2 أو 3\n2) [مستوى المتوقع] حل: (س² + 1)² − 7(س² + 1) + 10 = 0.\nالإجابة النموذجية: س = ±1، ±2\n3) [مستوى المتقدم] حل: (2س − 1)² − 5(2س − 1) + 6 = 0.\nالإجابة النموذجية: س = 3/2 أو 2", "1) [مستوى الدعم] أكمل: في (س² + 1)² − 7(س² + 1) + 10 = 0 نعوض ص = ___\nالإجابة النموذجية: س² + 1\n2) [مستوى المتوقع] حل: س + 6/س = 5.\nالإجابة النموذجية: س² − 5س + 6 = 0 ← س = 2 أو 3\n3) [مستوى المتقدم] حل: 1/س² − 3/س − 4 = 0.\nالإجابة النموذجية: نضرب في س²: 1 − 3س − 4س² = 0 ← 4س² + 3س − 1 = 0 ← س = 1/4 أو −1", "للطالب: تمارين 1-6: الأسئلة 5–8 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «معادلات بمقلوبات أو بعبارات مركبة» بسؤال واحد بسيط."]}]}, {"id": "1-7", "title": "حلّ المتباينات التربيعية", "p": [{"ax": "حل المتباينات التربيعية بالقيم الحرجة والرسم", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد القيم الحرجة للمتباينة التربيعية.\n2) يستخدم الرسم التخطيطي لتحديد مجموعة الحل.\nمخرج تعليمي آخر: يكتب مجموعة الحل بالصيغة المناسبة (فترة واحدة أو فترتان).", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتباينة التربيعية، القيم الحرجة، الرسم التخطيطي، مجموعة الحل.", "يسأل: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟\nدور الطالب: يحدد ±2 للمعادلة وفترة للمتباينة.", "(5 د) التهيئة: المعلم: يسأل: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟ | الطالب: يحدد ±2 للمعادلة وفترة للمتباينة.\n(10 د) النمذجة: المعلم: ينمذج: 2س² + 5س − 3 < 0 ← (2س − 1)(س + 3) < 0 ← −3 < س < 1/2؛ و س² − 4س − 12 ≥ 0 ← س ≤ −2 أو س ≥ 6. | الطالب: يرسم المنحنى ويقرأ الحل.\n(10 د) تطبيق موجّه: المعلم: يكلف بـ: 6 − س − س² > 0 و 3س² ≤ 2س + 8. | الطالب: يحل: −3 < س < 2؛ (3س + 4)(س − 2) ≤ 0 ← −4/3 ≤ س ≤ 2.\n(8 د) تقويم تكويني: المعلم: يعرض حلولًا ويطلب الحكم عليها. | الطالب: يحكم ويبرر.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-7: الأسئلة 1–4. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: 2س² + 5س − 3 < 0.\nالإجابة النموذجية: −3 < س < 1/2\n2) [مستوى المتوقع] حل: س² − 4س − 12 ≥ 0.\nالإجابة النموذجية: س ≤ −2 أو س ≥ 6\n3) [مستوى المتقدم] حل: 3س² ≤ 2س + 8.\nالإجابة النموذجية: −4/3 ≤ س ≤ 2", "1) [مستوى الدعم] أكمل: حل (س − 1)(س − 4) > 0 هو س < 1 أو س > ___\nالإجابة النموذجية: 4\n2) [مستوى المتوقع] حل: 6 − س − س² > 0.\nالإجابة النموذجية: −3 < س < 2\n3) [مستوى المتقدم] حل: س² + 2س > 15.\nالإجابة النموذجية: (س + 5)(س − 3) > 0 ← س < −5 أو س > 3", "للطالب: تمارين 1-7: الأسئلة 1–4 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «حل المتباينات التربيعية بالقيم الحرجة والرسم»."]}, {"ax": "متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل متباينة تربيعية قيمها الحرجة غير صحيحة باستخدام الصيغة التربيعية.\n2) يحل متباينات ناتجة عن شروط المميّز.\nمخرج تعليمي آخر: يحل نظامًا من متباينة خطية وأخرى تربيعية.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "القيم الحرجة الجذرية، متباينة المميّز، تقاطع مجموعتي الحل.", "يسأل: ما القيم الحرجة لـ س² − 2س − 1 < 0؟\nدور الطالب: يستخدم الصيغة: 1 ± √2.", "(5 د) التهيئة: المعلم: يسأل: ما القيم الحرجة لـ س² − 2س − 1 < 0؟ | الطالب: يستخدم الصيغة: 1 ± √2.\n(10 د) النمذجة: المعلم: ينمذج: س² − 2س − 1 < 0 ← 1 − √2 < س < 1 + √2؛ ثم: قيم ك التي تجعل س² + ك س + ك + 3 = 0 لها جذران حقيقيان ← ك² − 4ك − 12 ≥ 0 ← ك ≤ −2 أو ك ≥ 6. | الطالب: يتابع.\n(10 د) تعلم تعاوني: المعلم: يوزع نظامًا: س² − 5س + 4 < 0 و 2س − 5 > 0. | الطالب: تجد: 1 < س < 4 و س > 2.5 ← 2.5 < س < 4.\n(8 د) تقويم تكويني: المعلم: يكلف بسؤال متقدم من تمارين 1-7. | الطالب: يحل.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-7 ومحور «متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-7: الأسئلة 5–9. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: س² − 2س − 1 < 0.\nالإجابة النموذجية: 1 − √2 < س < 1 + √2\n2) [مستوى المتوقع] أوجد قيم ك لكي يكون لـ س² + ك س + ك + 3 = 0 جذران حقيقيان.\nالإجابة النموذجية: ك ≤ −2 أو ك ≥ 6\n3) [مستوى المتقدم] حل النظام: س² − 5س + 4 < 0، 2س − 5 > 0.\nالإجابة النموذجية: 2.5 < س < 4", "1) [مستوى الدعم] أكمل: القيمتان الحرجتان لـ س² − 2س − 1 = 0 هما 1 ± ___\nالإجابة النموذجية: √2\n2) [مستوى المتوقع] أوجد قيم ك التي تجعل ك س² + 2س + ك = 0 بلا جذور حقيقية (ك ≠ 0).\nالإجابة النموذجية: 4 − 4ك² < 0 ← ك < −1 أو ك > 1\n3) [مستوى المتقدم] حل: س² ≥ 3، س < 5.\nالإجابة النموذجية: س ≤ −√3 أو √3 ≤ س < 5", "للطالب: تمارين 1-7: الأسئلة 5–9 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم."]}]}, {"id": "1-8", "title": "التقاطع بين المستقيم ومنحنى الدالة التربيعية", "p": [{"ax": "نقاط التقاطع وعددها باستخدام المميّز", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد نقاط تقاطع مستقيم ومنحنى تربيعي.\n2) يحدد عدد نقاط التقاطع بالمميّز.\nمخرج تعليمي آخر: يميّز المماس من القاطع.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "القاطع، المماس، نقطة التماس، المميّز، عدد نقاط التقاطع.", "يعرض على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟\nدور الطالب: يلاحظ وجود قيمتين للميل يحدث عندهما التماس.", "(5 د) التهيئة: المعلم: يعرض على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟ | الطالب: يلاحظ وجود قيمتين للميل يحدث عندهما التماس.\n(10 د) النمذجة: المعلم: ينمذج: ص = س² − 3س + 4، ص = س + 1 ← س² − 4س + 3 = 0 ← (1، 2) و (3، 4)؛ ثم ص = 2س − 1 مع ص = س² ← (س − 1)² = 0 مماس عند (1، 1). | الطالب: يتابع.\n(10 د) تطبيق موجّه: المعلم: يكلف بتحديد عدد نقاط الة التي تحقق اختبار المستقيم الأفقي تسمى ___\nالإجابة النموذجية: واحدًا إلى واحد\n2) [مستوى المتوقع] صنف د(س) = (س − 1)²، س ∈ ح.\nالإجابة النموذجية: متعدد إلى واحد\n3) [مستوى المتقدم] أوجد قيم س التي تجعل د(س) = 8 حيث د(س) = س² − 2س.\nالإجابة النموذجية: س² − 2س − 8 = 0 ← س = 4 أو −2", "للطالب: تمارين 2-1: الأسئلة 1–4 (كتاب الطالب ص51–56، كتاب النشاط ص53–58).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الدالة وأنواع التطابق والمجال والمدى»."]}, {"ax": "مدى الدوال ذات المجال المحدد باستخدام الإكمال إلى مربع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحدد مدى دالة خطية ذات مجال محدد.\n2) يستخدم الإكمال إلى مربع لتحديد مدى دالة تربيعية ذات مجال محدد.\nمخرج تعليمي آخر: يحدد مجال ومدى دوال نسبية وجذرية بسيطة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المجال المحدد، المدى، القيمة الصغرى داخل المجال، الدالة النسبية، الدالة الجذرية.", "يسأل: ما أصغر قيمة لـ (س − 2)² + 3؟ وهل تتغير الإجابة إذا كان المجال 3 ≤ س ≤ 5؟\nدور الطالب: يلاحظ أن الرأس قد يقع خارج المجال.", "(5 د) التهيئة: المعلم: يسأل: ما أصغر قيمة لـ (س − 2)² + 3؟ وهل تتغير الإجابة إذا كان المجال 3 ≤ س ≤ 5؟ | الطالب: يلاحظ أن الرأس قد يقع خارج المجال.\n(10 د) النمذجة: المعلم: ينمذج: د(س) = س² − 4س + 7، 0 ≤ س ≤ 5 ← (س − 2)² + 3 ← المدى 3 ≤ د(س) ≤ 12؛ وعندما 3 ≤ س ≤ 5 ← 4 ≤ د(س) ≤ 12. | الطالب: يرسم ويقرأ المدى.\n(10 د) تعلم تعاوني: المعلم: يوزع: د(س) = 2س − 1، 1 ≤ س ≤ 4؛ هـ(س) = 1 ÷ (س − 3)؛ ك(س) = √(2س − 4) + 1. | الطالب: تجد: 1 ≤ د ≤ 7؛ مجال هـ س ≠ 3 ومداها هـ ≠ 0؛ مجال ك س ≥ 2 ومداها ك ≥ 1.\n(8 د) تقويم تكويني: المعلم: يطلب مدى د(س) = 5 − (س + 1)²، −3 ≤ س ≤ 1. | الطالب: المدى 1 ≤ د(س) ≤ 5.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويخت ] معادلة المستقيم المار بـ (−1، 2) و (3، −6)؟\nالإجابة النموذجية: الميل −2، ص = −2س\n3) [مستوى المتقدم] المقطع الصادي للمستقيم 3س + 2ص = 8؟\nالإجابة النموذجية: 4", "للطالب: تمارين 5-3: الأسئلة 1–5 (كتاب الطالب ص147–150، كتاب النشاط ص127–129).\nلولي الأمر: متابعة تقدم الابن/الابنة في «معادلة المستقيم بمعلومية نقطة وميل أو نقطتين» والتواصل مع المعلم عند ملاحظة صعوبة متكررة."]}, {"ax": "معادلات المستقيمات العمودية والعمود المنصّف ونقاط التقاطع", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يكتب معادلة مستقيم عمودي على مستقيم معلوم ويمر بنقطة.\n2) يكتب معادلة العمود المنصّف لقطعة.\nمخرج تعليمي آخر: يجد نقطة تقاطع مستقيمين بحل معادلتيهما آنيًا.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المستقيم العمودي، العمود المنصّف، نقطة التقاطع، الحل الآني.", "يسأل: كيف نجد النقطة على مستقيم أقرب ما تكون إلى نقطة خارجه؟\nدور الطالب: يقترح العمود.", "(5 د) التهيئة: المعلم: يسأل: كيف نجد النقطة على مستقيم أقرب ما تكون إلى نقطة خارجه؟ | الطالب: يقترح العمود.\n(10 د) النمذجة: المعلم: ينمذج العمود المنصّف للقطعة من (1، 2) إلى (5، 6): ص − 4 = −(س − 3) ← س + ص = 7. | الطالب: يتابع.\n(10 د) تعلم تعاوني: المعلم: يوزع: أوجد قدم العمود من (6، 1) على ص = 2س − 1. | الطالب: العمودي: ص − 1 = −1/2(س − 6) ← التقاطع مع ص = 2س − 1 ← (2، 3).\n(8 د) تقويم تكويني: المعلم: يطلب تقاطع س + ص = 7 و ص = 2س + 1. | الطالب: (2، 5).\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 5-3 ومحور «معادلات المستقيمات العمودية والعمود المنصّف ونقاط التقاطع»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من الت ا.", "المخرج 1: تحليل\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "النظام المتسق وغير المتسق، المستقيمات المتوازية، المستقيمات المنطبقة.", "يرسم مستقيمين متوازيين وآخرين منطبقين ويسأل: كم حلًا لكل نظام؟\nدور الطالب: لا حل، وعدد لانهائي.", "(5 د) التهيئة: المعلم: يرسم مستقيمين متوازيين وآخرين منطبقين ويسأل: كم حلًا لكل نظام؟ | الطالب: لا حل، وعدد لانهائي.\n(10 د) النمذجة: المعلم: ينمذج: 2س + 4ص = 6، س + 2ص = 5 ← المحدد 0، والمستقيمان متوازيان ← لا حل؛ س + 2ص = 3، 2س + 4ص = 6 ← منطبقان ← عدد لانهائي. | الطالب: يتابع.\n(10 د) تعلم تعاوني: المعلم: يوزع: قيم ك التي تجعل ك س + 2ص = 3، 2س + ك ص = 3 بلا حل وحيد. | الطالب: ك² − 4 = 0 ← ك = ±2؛ ك = 2 منطبقان، ك = −2 متوازيان.\n(8 د) تقويم تكويني: المعلم: يصنف أنظمة سريعة. | الطالب: يصنف.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 6-4: الأسئلة 10–12. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] محدد معاملات 2س + 4ص = 6، س + 2ص = 5؟\nالإجابة النموذجية: 0\n2) [مستوى المتوقع] كم حلًا لهذا النظام؟\nالإجابة النموذجية: لا حل (متوازيان)\n3) [مستوى المتقدم] كم حلًا لـ س + 2ص = 3، 2س + 4ص = 6؟\nالإجابة النموذجية: عدد لانهائي", "1) [مستوى الدعم] أكمل: إذا كان محدد المعاملات صفرًا فليس للنظام حل ___\nالإجابة النموذجية: وحيد\n2) [مستوى المتوقع] قيم ك التي تجعل ك س + 2ص = 3، 2س + ك ص = 3 بلا حل وحيد؟\nالإجابة النموذجية: ك = ±2\n3) [مستوى المتقدم] عند ك = −2 هل للنظام حل؟\nالإجابة النموذجية: لا، المستقيمان متوازيان", "للطالب: تمارين 6-4: الأسئلة 10–12 (كتاب الطالب ص189–196، ومراجعة الوحدة ص197، كتاب النشاط ص148–151، ومراجعة الوحدة ص152).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الا \nالإجابة النموذجية: 2ك + 3ص = 14، ك + ص = 5 ← ك = 1، ص = 4\n3) [مستوى المتقدم] تحقق من (1، 2، 3) في المعادلة 2س − ص + ع = 3.\nالإجابة النموذجية: 2 − 2 + 3 = 3 ✓", "للطالب: تمارين 6-4: الأسئلة 13–15 (كتاب الطالب ص189–196، ومراجعة الوحدة ص197، كتاب النشاط ص148–151، ومراجعة الوحدة ص152).\nلولي الأمر: متابعة تقدم الابن/الابنة في «تطبيقات حياتية وحل نظام ثلاثي بقاعدة كرامر» والتواصل مع المعلم عند ملاحظة صعوبة متكررة."]}, {"ax": "مراجعة الوحدة السادسة: المصفوفات", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يحل مسائل شاملة على العمليات والمحددات والمعكوس والأنظمة.\n2) يربط المفاهيم في مسائل مركبة.\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "العمليات على المصفوفات، المحدد، المعكوس، حل الأنظمة.", "ينظم مسابقة «سلسلة المصفوفات»: كل مجموعة تكمل خطوة من حل مسألة.\nدور الطالب: يتعاون الطلبة.", "(5 د) التهيئة: المعلم: ينظم مسابقة «سلسلة المصفوفات»: كل مجموعة تكمل خطوة من حل مسألة. | الطالب: يتعاون الطلبة.\n(12 د) تعلم تعاوني: المعلم: يوزع تمارين مراجعة نهاية الوحدة ص197 على المجموعات. | الطالب: تحل المجموعة.\n(10 د) تعلم تشاركي: المعلم: تعرض المجموعات حلولها ويثبت المعلم خريطة الوحدة. | الطالب: تشرح.\n(6 د) تقويم ذاتي: المعلم: يوزع بطاقة «أستطيع أن...». | الطالب: يقيم نفسه.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 6-4 ومحور «مراجعة الوحدة السادسة: المصفوفات»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص197. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أ + ب للمصفوفتين أ و ب؟\nالإجابة النموذجية: ⁦[3 -1 | 3 7]⁩\n2) [مستوى المتوقع] محدد أ ب؟\nالإجابة النموذجية: 15\n3) [مستوى المتقدم] حل أ س = ⁦[4 | 7]⁩.\nالإجابة النموذجية: 1/5 × ⁦[9 | 2]⁩", "1) [مستوى الدعم] أكمل: شرط ضرب أ (م × ن) في ب (ن × ك) أن يكون عدد أعمدة أ = ___ ب\nالإجابة النموذجية: عدد صفوف\n2) [مستوى المتوقع] معكوس ⁦[2 5 | 1 3]⁩؟\nالإجابة النموذجية: ⁦[3 -5 | -1 2]⁩\n3) [مستوى المتقدم] حل 2س + 5ص = 9، س + 3ص = 5.\nالإجابة النموذجية: ⁦[3 -5 | -1 2]⁩ × ⁦[9 | 5]⁩ = ⁦[2 | 1]⁩", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص197 (كتاب الطالب ص189–196، ومراجعة الوحدة ص197، كتاب النشاط ص148–151، ومراجعة الوحدة ص152).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم."]}]}];
const F=["المخرجات التعليمية","المستوى المعرفي","الاستراتيجيات","المصادر التعليمية","المفاهيم","التهيئة / التمهيد / التعلم القبلي","إجراءات سير الدرس / الأنشطة التدريسية","التقويم التكويني","التقويم الختامي","ملاحظات ضمن خطة الدراسة الأسبوعية"];
let mode='sep',li=0,pi=0;
function H(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\u2066/g,'<bdo dir="ltr" style="white-space:nowrap">').replace(/\u2069/g,'</bdo>')}
const $=id=>document.getElementById(id);
D.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=L.id+' '+L.title+' ('+L.p.length+' حصص)';$('les').appendChild(o)});
$('les').onchange=e=>{li=+e.target.value;pi=0;draw()};
$('mSep').onclick=()=>{mode='sep';draw()};$('mCom').onclick=()=>{mode='com';draw()};
function text(fi){const L=D[li];if(mode=='sep')return L.p[pi].f[fi];
 return L.p.map((P,k)=>'الحصة '+(k+1)+': '+P.ax+'\n'+P.f[fi]).join('\n\n');}
function draw(){const L=D[li];
 $('mSep').classList.toggle('on',mode=='sep');$('mCom').classList.toggle('on',mode=='com');
 $('now').textContent=mode=='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
 const t=$('tabs');t.innerHTML='';
 if(mode=='sep'){L.p.forEach((P,k)=>{const b=document.createElement('button');b.textContent='الحصة '+(k+1);if(k==pi)b.className='on';b.onclick=()=>{pi=k;draw()};t.appendChild(b)})}
 const m=$('main');m.innerHTML='';
 const meta=document.createElement('div');meta.className='meta';
 meta.textContent=mode=='sep'?('الحصة '+(pi+1)+' من '+L.p.length+' — محور الحصة: '+L.p[pi].ax+' — '+L.p[pi].wk):('الدرس '+L.id+' '+L.title+' — نموذج مدمج لـ '+L.p.length+' حصص');
 m.appendChild(meta);
 F.forEach((fn,fi)=>{const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="ch"><span><small>البند '+(fi+1)+'</small><b></b></span><button class="copy">نسخ</button></div><div class="cb"></div><div class="hint">تعذّر النسخ التلقائي: النص محدد الآن، انسخه يدويًا.</div>';
  c.querySelector('b').textContent=fn;const body=c.querySelector('.cb');body.innerHTML=H(text(fi));
  c.querySelector('.copy').onclick=ev=>copy(text(fi),ev.target,body,c.querySelector('.hint'));m.appendChild(c)});}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(t,btn,body,hint){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
 if(s)ok(btn);else{const r=document.createRange();r.selectNodeContents(body);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);hint.style.display='block';setTimeout(()=>hint.style.display='none',4000)}}
function copy(t,btn,body,hint){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>ok(btn),()=>fallback(t,btn,body,hint))}else fallback(t,btn,body,hint)}
draw();
</script></body></html>
