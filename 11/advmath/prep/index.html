] صف تحويل ص = س² إلى ص = 3 − س².\nالإجابة النموذجية: انعكاس في المحور السيني ثم انسحاب 3 للأعلى\n2) [مستوى التطبيق] اكتب ص = √س بعد انعكاس في الصادي ثم انسحاب وحدتين للأعلى.\nالإجابة النموذجية: ص = √(−س) + 2\n3) [مستوى الاستدلال] رأس ص = −(س − 2)² + 1؟\nالإجابة النموذجية: (2، 1) عظمى", "1) [مستوى المعرفة] أكمل: ص = −س² + 5 هي انعكاس ص = س² في المحور السيني ثم انسحاب ___ وحدات للأعلى.\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] صف تحويل ص = س³ إلى ص = −س³ − 1.\nالإجابة النموذجية: انعكاس في السيني (أو الصادي) ثم انسحاب 1 للأسفل\n3) [مستوى الاستدلال] اكتب ص = 1 ÷ س بعد الانعكاس في السيني ثم الانسحاب (2، 0).\nالإجابة النموذجية: ص = −1 ÷ (س − 2)", "للطالب: تمارين 2-5ب: الأسئلة 4–6 (كتاب الطالب ص75–76، كتاب النشاط ص73–75).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «دمج الانعكاس مع الانسحاب» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=14"]}]}, {"id": "2-5ج", "title": "التحويلات الهندسية للدوال: التمدد", "p": [{"ax": "التمدد الرأسي ص = أ د(س)", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف التمدد الرأسي بمعامل أ.\n2) يجد صور النقاط بالتمدد الرأسي.\nمخرج تعليمي آخر: يكتب معادلة المنحنى بعد تمدد رأسي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "التمدد الرأسي، معامل التمدد، المحور الثابت (السيني)، ص = أ د(س).", "يعرض المعلم ص = س² و ص = 3س² ويسأل: ماذا حدث لارتفاع كل نقطة؟ ويلاحظ الطالب تضاعف الإحداثي الصادي 3 مرات.", "1. التهيئة: يعرض المعلم ص = س² و ص = 3س² ويسأل: ماذا حدث لارتفاع كل نقطة؟ ويلاحظ الطالب تضاعف الإحداثي الصادي 3 مرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يتيح المعلم تحريك المنزلق أ في ص = أ د(س) على GeoGebra، ويسجل الطالب أثر أ > 1 و 0 < أ < 1 (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: ينمذج المعلم: ص = 2(س² − 4) تمدد رأسي لـ ص = س² − 4 بمعامل 2؛ صورة (3، 5) هي (3، 10)، والمقاطع السينية ثابتة، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يسأل المعلم: لماذا لا تتغير المقاطع السينية بالتمدد الرأسي؟ والطالب: لأن ص = 0 تبقى صفرًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-5ج: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] صف تحويل ص = س² إلى ص = 3س².\nالإجابة النموذجية: تمدد رأسي بمعامل 3\n2) [مستوى التطبيق] صورة (2، 4) بتمدد رأسي معامله 1/2؟\nالإجابة النموذجية: (2، 2)\n3) [مستوى الاستدلال] اكتب ص = √س بعد تمدد رأسي معامله 4.\nالإجابة النموذجية: ص = 4√س", "1) [مستوى المعرفة] أكمل: ص = أ د(س) تمدد رأسي بمعامل ___\nالإجابة النموذجية: أ\n2) [مستوى التطبيق] صف تحويل ص = س³ إلى ص = 0.5س³.\nالإجابة النموذجية: تمدد رأسي بمعامل 0.5\n3) [مستوى الاستدلال] هل تتغير المقاطع السينية لـ ص = س² − 4 بالتمدد الرأسي؟\nالإجابة النموذجية: لا، تبقى ±2", "للطالب: تمارين 2-5ج: الأسئلة 1–3 (كتاب الطالب ص77–79، كتاب النشاط ص76–79).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «التمدد الرأسي ص = أ د(س)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=15"]}, {"ax": "التمدد الأفقي ص = د(أس)", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف التمدد الأفقي بمعامل 1/أ.\n2) يجد صور النقاط بالتمدد الأفقي.\nمخرج تعليمي آخر: يميّز بين التمدد الأفقي والرأسي من المعادلة.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات معادلات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التمدد الأفقي، المعامل 1/أ، المحور الثابت (الصادي)، ص = د(أس).", "يعرض المعلم ص = س² − 4 و ص = (2س)² − 4 ويسأل: أين أصبحت المقاطع السينية؟ ويجد الطالب ±1 بدل ±2.", "1. التهيئة: يعرض المعلم ص = س² − 4 و ص = (2س)² − 4 ويسأل: أين أصبحت المقاطع السينية؟ ويجد الطالب ±1 بدل ±2 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ص = د(2س) تمدد أفقي معامله 1/2؛ صورة (4، د(4)) هي (2، د(4))، ويتابع الطالب ويطبق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم بطاقات معادلات لتمييز نوع التمدد ومعامله، وتصنف المجموعة (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم صورة (6، 3) بالتمدد ص = د(3س)، والطالب: (2، 3) (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-5ج ومحور «التمدد الأفقي ص = د(أس)»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-5ج: الأسئلة 4–6، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] صف تحويل ص = د(س) إلى ص = د(2س).\nالإجابة النموذجية: تمدد أفقي بمعامل 1/2\n2) [مستوى التطبيق] صورة (6، 3) بالتحويل ص = د(3س)؟\nالإجابة النموذجية: (2، 3)\n3) [مستوى الاستدلال] صف تحويل ص = √س إلى ص = √(س ÷ 2).\nالإجابة النموذجية: تمدد أفقي بمعامل 2", "1) [مستوى المعرفة] أكمل: ص = د(أس) تمدد أفقي بمعامل ___\nالإجابة النموذجية: 1/أ\n2) [مستوى التطبيق] أين تصبح المقاطع السينية لـ ص = س² − 9 بعد التحويل ص = (3س)² − 9؟\nالإجابة النموذجية: ±1\n3) [مستوى الاستدلال] ميّز: ص = 2د(س) و ص = د(2س).\nالإجابة النموذجية: الأول تمدد رأسي بمعامل 2، والثاني أفقي بمعامل 1/2", "للطالب: تمارين 2-5ج: الأسئلة 4–6 (كتاب الطالب ص77–79، كتاب النشاط ص76–79).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته با 2 ثم انسحاب (0، 3).\nالإجابة النموذجية: ص = 2س² + 3\n2) [مستوى التطبيق] اكتبها بعد انسحاب (0، 3) ثم تمدد رأسي 2.\nالإجابة النموذجية: ص = 2س² + 6\n3) [مستوى الاستدلال] صورة (2، 4) بالتحويل ص = 3(س − 1)² + 2؟\nالإجابة النموذجية: (3، 14)", "1) [مستوى المعرفة] أكمل: ترتيب التحويلات ___ على المعادلة الناتجة.\nالإجابة النموذجية: يؤثر\n2) [مستوى التطبيق] اكتب ص = √س بعد انعكاس في السيني ثم انسحاب (1، 2).\nالإجابة النموذجية: ص = −√(س − 1) + 2\n3) [مستوى الاستدلال] صورة (1، 1) على ص = س² بالتحويل ص = −2(س + 3)² + 4؟\nالإجابة النموذجية: (−2، 2)", "للطالب: تمارين 2-6: الأسئلة 1–4 (كتاب الطالب ص80–87، ومراجعة الوحدة ص88–92، كتاب النشاط ص80–85، ومراجعة الوحدة ص86–89).\nلولي الأمر: متابعة تقدم الابن/الابنة في «ترتيب التحويلات وأثره على المعادلة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=16"]}, {"ax": "وصف تسلسل التحويلات بين منحنيين ومراجعة الوحدة", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف تسلسل التحويلات التي تحول منحنى إلى آخر.\n2) يستخدم الإكمال إلى مربع لوصف التحويلات.\nمخرج تعليمي آخر: يقيم أوصاف تحويلات مقترحة ويصحح الخاطئ منها.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "وصف التحويلات، الإكمال إلى مربع، التحقق بالنقاط، مراجعة الوحدة.", "يكتب المعلم ص = 2س² − 12س + 13 ويسأل: كيف نحصل عليها من ص = س²؟ ويقترح الطالب الإكمال إلى مربع أولًا.", "1. التهيئة: يكتب المعلم ص = 2س² − 12س + 13 ويسأل: كيف نحصل عليها من ص = س²؟ ويقترح الطالب الإكمال إلى مربع أولًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2س² − 12س + 13 = 2(س − 3)² − 5 ← انسحاب (3، 0)، تمدد رأسي 2، انسحاب (0، −5)، ويتابع الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم أسئلة من مراجعة نهاية الوحدة ص88–92 على المجموعات، وتحل المجموعة وتعرض (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يعرض المعلم وصفًا خاطئًا ويطلب تصحيحه، ويصحح الطالب ويبرر (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 2-6 ومحور «وصف تسلسل التحويلات بين منحنيين ومراجعة الوحدة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-6: الأسئلة 5–8، وتمارين مراجعة نهاية الوحدة ص88–92، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] صف تحويل ص = س² إلى ص = 2(س − 3)² − 5.\nالإجابة النموذجية: انسحاب 3 لليمين، تمدد رأسي 2، انسحاب 5 للأسفل\n2) [مستوى التطبيق] اكتب 2س² − 12س + 13 بصورة أ(س − ف)² + ك.\nالإجابة النموذجية: 2(س − 3)² − 5\n3) [مستوى الاستدلال] صف تحويل ص = س² إلى ص = −(س + 1)² + 4.\nالإجابة النموذجية: انسحاب 1 لليسار، انعكاس في السيني، انسحاب 4 للأعلى", "1) [مستوى المعرفة] أكمل: لوصف التحويلات لدالة تربيعية نكتبها أولًا بصورة ___\nالإجابة النموذجية: الإكمال إلى مربع\n2) [مستوى التطبيق] صف تحويل ص = س² إلى ص = 3س² + 6س + 1.\nالإجابة النموذجية: 3(س + 1)² − 2: انسحاب 1 لليسار، تمدد رأسي 3، انسحاب 2 للأسفل\n3) [مستوى الاستدلال] اكتب معادلة صورة ص = 1 ÷ س بتمدد أفقي 1/2 ثم انسحاب (0، 1).\nالإجابة النموذجية: ص = 1 ÷ (2س) + 1", "للطالب: تمارين 2-6: الأسئلة 5–8، وتمارين مراجعة نهاية الوحدة ص88–92 (كتاب الطالب ص80–87، ومراجعة الوحدة ص88–92، كتاب النشاط ص80–85، ومراجعة الوحدة ص86–89).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=16"]}]}, {"id": "3-1", "title": "المتتاليات الحسابية", "p": [{"ax": "الحد العام للمتتالية الحسابية وعدد الحدود + مجموع المتسلسلة الحسابية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يجد الحد العام حن = أ + (ن − 1)د لمتتالية حسابية.\n2) ي ل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-1: الأسئلة 7–12، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] ح20 في 3، 9، 15، ...؟\nالإجابة النموذجية: 3 + 19 × 6 = 117\n2) [مستوى التطبيق] عدد حدود 5، 8، ...، 302؟\nالإجابة النموذجية: (302 − 5) ÷ 3 + 1 = 100\n3) [مستوى الاستدلال] ح4 = 17، ح9 = 42. أوجد أ و د.\nالإجابة النموذجية: د = 5، أ = 2\n\n4) [مستوى المعرفة] مجموع أول 20 حدًا من 2، 5، 8، ...؟\nالإجابة النموذجية: 10 × (4 + 57) = 610\n5) [مستوى التطبيق] كم حدًا من 3 + 7 + 11 + ... مجموعها 820؟\nالإجابة النموذجية: 20\n6) [مستوى الاستدلال] جن = 3ن² + 2ن. أوجد د.\nالإجابة النموذجية: د = 6", "1) [مستوى المعرفة] أكمل: حن = أ + (___)د\nالإجابة النموذجية: ن − 1\n2) [مستوى التطبيق] ح3 = 20، ح10 = −1. أوجد ح15.\nالإجابة النموذجية: د = −3، أ = 26، ح15 = −16\n3) [مستوى الاستدلال] أول حد سالب في 100، 93، 86، ...؟\nالإجابة النموذجية: 100 − 7(ن − 1) < 0 ← ن ≥ 16، ح16 = −5\n\n4) [مستوى المعرفة] أكمل: جن = ن ÷ 2 (أ + ___)\nالإجابة النموذجية: ل\n5) [مستوى التطبيق] مجموع الأعداد الزوجية بين 1 و 200؟\nالإجابة النموذجية: 100 × 101 = 10100\n6) [مستوى الاستدلال] جن = ن² + 4ن. أوجد الحد العاشر.\nالإجابة النموذجية: ج10 − ج9 = 140 − 117 = 23", "للطالب: تمارين 3-1: الأسئلة 1–6 (كتاب الطالب ص93–98، كتاب النشاط ص90–93).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الحد العام للمتتالية الحسابية وعدد الحدود».\nللطالب: تمارين 3-1: الأسئلة 7–12 (كتاب الطالب ص93–98، كتاب النشاط ص90–93).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مجموع المتسلسلة الحسابية» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=17"]}, {"ax": "تطبيقات حياتية على المتتاليات الحسابية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": [ 0 + 825) = 7125\n3) [مستوى الاستدلال] مدرج 25 صفًا، الأول 20 مقعدًا ويزيد 2. المجموع؟\nالإجابة النموذجية: 12.5 × (40 + 48) = 1100", "1) [مستوى المعرفة] أكمل: إذا زاد الادخار بمقدار ثابت كل شهر فهو متتالية ___\nالإجابة النموذجية: حسابية\n2) [مستوى التطبيق] ادخار 10 ريالات تزيد 5 شهريًا. متى يصل المجموع إلى 1000؟\nالإجابة النموذجية: ن(5ن + 15) ÷ 2 = 1000 ← ن² + 3ن − 400 = 0 ← ن ≈ 18.6، أي في الشهر 19\n3) [مستوى الاستدلال] عرضان: 500 يزيد 40، أو 600 يزيد 20 سنويًا. أيهما أكثر مجموعًا في 10 سنوات؟\nالإجابة النموذجية: الأول 5 × (1000 + 360) = 6800، الثاني 5 × (1200 + 180) = 6900، الثاني", "للطالب: تمارين 3-1: الأسئلة 13–16، وكتاب النشاط (كتاب الطالب ص93–98، كتاب النشاط ص90–93).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تطبيقات حياتية على المتتاليات الحسابية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=17"]}]}, {"id": "3-2", "title": "المتتاليات الهندسية", "p": [{"ax": "الحد العام للمتتالية الهندسية وأساسها + مجموع المتسلسلة الهندسية المنتهية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يجد الحد العام حن = أ ر^(ن − 1).\n2) يجد أ و ر من حدين معلومين بما في ذلك ر السالب.\n3) يبرهن صيغة جن = أ(1 − رⁿ) ÷ (1 − ر).\n4) يحسب مجموع أول ن حدًا.\n\nمخرج تعليمي آخر:\nيجد أول حد يتجاوز قيمة معينة بالتجريب.\nيجد أقل عدد حدود ليتجاوز المجموع قيمة معينة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "المتتالية الهندسية، النسبة المشتركة ر، الحد العام، القوى.، المتسلسلة الهندسية، جن، الطرح المتداخل، أقل عدد حدود.", "يعرض المعلم 3، 6، 12، ... ويسأل: كيف نتنبأ بالحد العاشر؟ ويلاحظ الطالب الضرب المتكرر في 2.", "1. التهيئة: يعرض المعلم 3، 6، 12، ... ويسأل: كيف نتنبأ بالحد العاشر؟ ويلاحظ الطالب الضرب المتكرر في 2 (3 دقائق)\nالاستراتيجيات: التعلم بالنمذ ـ 18 + 6 + 2 + ...؟\nالإجابة النموذجية: 27\n2) [مستوى التطبيق] ج∞ لـ 10 − 5 + 2.5 − ...؟\nالإجابة النموذجية: 20/3\n3) [مستوى الاستدلال] هل 1 + 1.1 + 1.21 + ... متقاربة؟\nالإجابة النموذجية: لا، ر = 1.1\n\n4) [مستوى المعرفة] متى تتقارب 1 + 2س + 4س² + ...؟\nالإجابة النموذجية: −1/2 < س < 1/2\n5) [مستوى التطبيق] أوجد س إذا ج∞ = 4 للمتسلسلة السابقة.\nالإجابة النموذجية: س = 3/8\n6) [مستوى الاستدلال] ح2 = 6، ج∞ = 32. أوجد ر.\nالإجابة النموذجية: ر = 1/4 أو 3/4", "1) [مستوى المعرفة] أكمل: ج∞ = أ ÷ (___)\nالإجابة النموذجية: 1 − ر\n2) [مستوى التطبيق] ج∞ لـ 0.6 + 0.06 + 0.006 + ...؟\nالإجابة النموذجية: 2/3\n3) [مستوى الاستدلال] ج∞ لـ 5 + 4 + 3.2 + ...؟\nالإجابة النموذجية: ر = 0.8، ج∞ = 25\n\n4) [مستوى المعرفة] أكمل: المتسلسلة 1 + (س − 1) + ... تتقارب عندما 0 < س < ___\nالإجابة النموذجية: 2\n5) [مستوى التطبيق] أوجد ج∞ بدلالة س للمتسلسلة 3 + 3س + 3س² + ...\nالإجابة النموذجية: 3 ÷ (1 − س)، |س| < 1\n6) [مستوى الاستدلال] ج∞ = 3 × الحد الأول. أوجد ر.\nالإجابة النموذجية: ر = 2/3", "للطالب: تمارين 3-3: الأسئلة 1–5 (كتاب الطالب ص105–109، كتاب النشاط ص98–102).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «شرط التقارب والمجموع إلى ما لا نهاية».\nللطالب: تمارين 3-3: الأسئلة 6–10 (كتاب الطالب ص105–109، كتاب النشاط ص98–102).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مسائل على ج∞ ومتسلسلات تتضمن متغيرًا» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=19"]}, {"ax": "الكسور الدورية وتطبيقات المتسلسلات غير المنتهية", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يحول الكسر الدوري إلى كسر اعتيادي.\n2) يحل مسائل حياتية (الارتداد، الأرجوحة).\n\nمخرج تعليمي آخر: يقيّم حدود النموذج الرياضي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الكسر الدوري، الارتداد، المسافة الكلية، حدود النموذج.", "يسأل المعلم: هل 0.999... = 1؟ ويناقش الطالب ويبرهن بالمتسلسلة.", "1. التهيئة: يسأل المعلم: هل 0.999... = 1؟ ويناقش الطالب ويبرهن بالمتسلسلة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 0.1212... = 12/99 = 4/33؛ 2.3777... = 2.3 + 0.07 ÷ 0.9 = 107/45، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. حل مشكلة: كرة تسقط من 12 م وترتد ثلثي ارتفاعها: المسافة = 12 + 2 × (8 ÷ (1/3)) = 60 م، ويحسب الطالب ويفسر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يكلف المعلم بكتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 3-3 ومحور «الكسور الدورية وتطبيقات المتسلسلات غير المنتهية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 3-3: الأسئلة 11–14، وكتاب النشاط، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] حوّل 0.1212... إلى كسر اعتيادي.\nالإجابة النموذجية: 4/33\n2) [مستوى التطبيق] المسافة الكلية لكرة من 12 م ترتد الثلثين؟\nالإجابة النموذجية: 60 م\n3) [مستوى الاستدلال] حوّل 0.444... إلى كسر.\nالإجابة النموذجية: 4/9", "1) [مستوى المعرفة] أكمل: 0.999... = ___\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] حوّل 2.3777... إلى كسر اعتيادي.\nالإجابة النموذجية: 107/45\n3) [مستوى الاستدلال] كرة من 5 م ترتد 80%. المسافة الكلية؟\nالإجابة النموذجية: 5 + 2 × 4 ÷ 0.2 = 45 م", "للطالب: تمارين 3-3: الأسئلة 11–14، وكتاب النشاط (كتاب الطالب ص105–109، كتاب النشاط ص98–102).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «الكسور الدورية وتطبيقات المتسلسلات غير المنتهية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=19"]}]}, {"id": "3-4", "title": "المزيد من المتتاليات الحسابية والهندسية", "p": [{"ax": "مسائل تربط المتتاليات الحسابية بالهندسية + رمز المجموع ∑ ومسائل متنوعة", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يحل مسائل تكون فيها حدود متتالية حسابية حدودًا لمتتالية هندسية.\n2) يكوّن معادلات في أ و د و ر.\n3) يقرأ رمز المجموع ∑ ويكتب حدود المتسلسلة.\n4) يحسب مجاميع مكتوبة برمز ∑ لمتسلسلات حسابية وهندسية.\n\nمخرج تعليمي آخر:\nيتحقق من الحلول ويستبعد الحالات المرفوضة (د = 0).\nيحدد نوع المتسلسلة من صيغة الحد.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج الآخر: تقييم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الوسط الحسابي، الوسط الهندسي، الربط بين المتتاليتين، الحالة المرفوضة.، رمز المجموع ∑، الدليل ر، الحد الأدنى والأعلى للدليل، صيغة الحد.", "يسأل المعلم: الأعداد 2، س، 18: ما س لتكون حسابية؟ ولتكون هندسية؟ والطالب: س = 10 للحسابية، س = ±6 للهندسية.", "1. التهيئة: يسأل المعلم: الأعداد 2، س، 18: ما س لتكون حسابية؟ ولتكون هندسية؟ والطالب: س = 10 للحسابية، س = ±6 للهندسية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: الحدود الأول والثاني والخامس لمتتالية حسابية (د ≠ 0) تشكل متتالية هندسية ← (أ + د)² = أ(أ + ) ← د = 2أ، والنسبة ر = 3، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم مسائل مشابهة على المجموعات، وتكوّن المعادلات وتحلها (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم الوسط الحسابي والهندسي للعددين 4 و 16، والطالب: 10 و 8 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. النمذجة: ينمذج المعلم: ∑ (3ر + 2) من 1 إلى 20 = 20 ÷ 2 × (5 + 62) = 670؛ ∑ 2^ر من 1 إلى 10 = 2046، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. تطبيق موجّه: يطلب المعلم ∑ 5 × (1/2)^ر من 1 إلى ما لا نهاية، والطالب: أ = 5/2، ر = 1/2 ← 5 (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. تقويم تكويني: يعرض المعلم صيغًا ويطلب تصنيفها (حسابية/هندسية)، ويصنف الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-4: الأسئلة 4–6، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] الوسط الهندسي للعددين 2 و 18؟\nالإجابة النموذجية: ±6\n2) [مستوى التطبيق] الحدود ح1، ح2، ح5 لمتتالية حسابية تشكل هندسية. أوجد د بدلالة أ.\nالإجابة النموذجية: د = 2أ\n3) [مستوى الاستدلال] ما النسبة المشتركة في الحالة السابقة؟\nالإجابة النموذجية: 3\n\n4) [مستوى المعرفة] ∑ (2ر + 1) من 1 إلى 4؟\nالإجابة النموذجية: 24\n5) [مستوى التطبيق] ∑ (3ر + 2) من 1 إلى 20؟\nالإجابة النموذجية: 670\n6) [مستوى الاستدلال] ∑ 2^ر من 1 إلى 10؟\nالإجابة النموذجية: 2046", "1) [مستوى المعرفة] أكمل: إذا كانت أ، ب، جـ هندسية فإن ب² = ___\nالإجابة النموذجية: أجـ\n2) [مستوى التطبيق] الوسط الحسابي والهندسي (الموجب) للعددين 4 و 16؟\nالإجابة النموذجية: 10 و 8\n3) [مستوى الاستدلال] متتالية حسابية أ = 4؛ ح1، ح3، ح9 تشكل هندسية. أوجد د (د ≠ 0).\nالإجابة النموذجية: (4 + 2د)² = 4(4 + 8د) ← 4د² − 16د = 0 ← د = 4\n\n4) [مستوى المعرفة] أكمل: ∑ (4ر) من 1 إلى 5 = ___\nالإجابة النموذجية: 60\n5) [مستوى التطبيق] ∑ 5(1/2)^ر من 1 إلى ما لا نهاية؟\nالإجابة النموذجية: 5\n6) [مستوى الاستدلال] هل ∑ (ر² ) حسابية أم هندسية؟\nالإجابة النموذجية: ليست أيًّا منهما", "للطالب: تمارين 3-4: الأسئلة 1–3 (كتاب الطالب ص110–112، ومراجعة الوحدة ص113–116، كتاب النشاط ص103–105، ومراجعة الوحدة ص106).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 3-4: الأسئلة 4–6 (كتاب الطالب ص110–112، ومراجعة الوحدة ص113–116، كتاب النشاط ص103–105، ومراجعة الوحدة ص106).\nلولي الأمر: متابعة تقدم الابن/الابنة في «رمز المجموع ∑ ومسائل متنوعة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=20"]}, {"ax": "مراجعة الوحدة الثالثة", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يحل مسائل مراجعة شاملة على الوحدة.\n2) يختار الصيغة المناسبة.\n\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحد العام، المجموع، التقارب، رمز المجموع، الربط بين المتتاليات.", "ينظم المعلم مسابقة سريعة «أكمل النمط»، ويتنافس الطلبة.", "1. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول المزيد من المتتاليات الحسابية والهندسية، ويبدأ المعلم بسؤال «مجموع أول 6 حدود من 1، 3، 9، » (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص113–116 على المجموعات، وتحل المجموعة محورها (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تعلم تشاركي: تعرض المجموعات الحلول ويثبت المعلم جدول الصيغ، وتشرح وتناقش (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...»، ويقيم الطالب نفسه (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. المعلم: يختار المعلم الدرس 3-4 ومحور «مراجعة الوحدة الثالثة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص113–116، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] ح5 في متتالية حسابية 14 و ح12 = 35. أوجد ح1.\nالإجابة النموذجية: د = 3، أ = 2\n2) [مستوى التطبيق] ج∞ لـ 12 − 6 + 3 − ...؟\nالإجابة النموذجية: 8\n3) [مستوى الاستدلال] مجموع أول 6 حدود من 1، 3، 9، ...؟\nالإجابة النموذجية: 364", "1) [مستوى المعرفة] أكمل: المتسلسلة الهندسية تتقارب عندما −1 < ر < ___\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] ح1 = 3، د = 4. جن = 210، أوجد ن.\nالإجابة النموذجية: ن(2ن + 1) = 210 ← ن = 10\n3) [مستوى الاستدلال] ر = 0.4 و ج∞ = 15. أوجد ح2.\nالإجابة النموذجية: أ = 9، ح2 = 3.6", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص113–116 (كتاب الطالب ص110–112، ومراجعة الوحدة ص113–116، كتاب النشاط ص103–105، ومراجعة الوحدة ص106).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=20"]}]}, {"id": "4-1", "title": "الوسط الحسابي (المعدل)", "p": [{"ax": "الوسط الحسابي ورمز المجموع للبيانات المفردة والتكرارية + الوسط الحسابي للبيانات المشفّرة", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يحسب الوسط الحسابي باستخدام ∑س ÷ ن و ∑(ت س) ÷ ∑ت.\n2) يستخدم رمز المجموع في الصيغ الإحصائية.\n3) يحسب الوسط باستخدام البيانات المشفرة: الوسط = ب + ∑(س − ب) ÷ ن.\n4) يفسر فائدة التشفير في تبسيط الحسابات.\n\nمخرج تعليمي آخر:\nيجد قيمة مجهولة في جدول تكراري بمعلومية الوسط.\nيحول بين ملخصات مشفرة وغير مشفرة.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الوسط الحسابي (المعدل)، ∑س، ∑ت س، التكرار، القيمة المجهولة.، البيانات المشفرة، الثابت ب، ∑(س − ب)، فك التشفير.", "يعرض المعلم أعمار 6 لاعبين ويسأل: كيف نعبر عن مجموعها برمز مختصر؟ ويكتب الطالب ∑س.", "1. التهيئة: يعرض المعلم أعمار 6 لاعبين ويسأل: كيف نعبر عن مجموعها برمز مختصر؟ ويكتب الطالب ∑س (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم الوسط من جدول تكراري: س = 1، 2، 3، 4 و ت = 3، 5، ك، 2، والوسط 2.4 ← (3 + 10 + 3ك + 8) ÷ (10 + ك) = 2.4 ← 21 + 3ك = 24 + 2.4ك ← ك = 5، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم وسط بيانات معطاة بالملخصات: ن = 25، ∑س = 1150، ويقوم الطالب بالوسط 46 (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يسأل المعلم: أضيف لاعب عمره 30 لمجموعة من 6 وسطها 24. الوسط الجديد؟ والطالب: (144 + 30) ÷ 7 ≈ 24.9 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. النمذجة: ينمذج المعلم: ∑(س − 50) = 5 لخمس قيم ← الوسط = 50 + 1 = 51؛ ثم ن = 12 و ∑(س − 50) = 36 ← الوسط 53، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعلم تعاوني: يوزع المعلم: ∑(س − 20) = −16 و ن = 8؛ و ∑(س − ب) = 30، ن = 10، الوسط 28. أوجد ب، وتحل: 18؛ ب = 25 (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. تقويم تكويني: يطلب المعلم ∑س إذا كان ن = 10، ∑(س − 5) = 12، والطالب: ∑س = 62 (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 6–10، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] ن = 25، ∑س = 1150. الوسط؟\nالإجابة النموذجية: 46\n2) [مستوى التطبيق] س = 1، 2، 3، 4 و ت = 3، 5، ك، 2، الوسط 2.4. أوجد ك.\nالإجابة النموذجية: ك = 5\n3) [مستوى الاستدلال] أضيف 30 لمجموعة من 6 وسطها 24. الوسط الجديد؟\nالإجابة النموذجية: ≈ 24.9\n\n4) [مستوى المعرفة] ن = 12، ∑(س − 50) = 36. الوسط؟\nالإجابة النموذجية: 53\n5) [مستوى التطبيق] ن = 8، ∑(س − 20) = −16. الوسط؟\nالإجابة النموذجية: 18\n6) [مستوى الاستدلال] ن = 10، ∑(س − 5) = 12. أوجد ∑س.\nالإجابة النموذجية: 62", "1) [مستوى المعرفة] أكمل: الوسط من الجدول التكراري = ∑(ت س) ÷ ___\nالإجابة النموذجية: ∑ت\n2) [مستوى التطبيق] وسط 8 قيم 15، حذفت قيمة فأصبح الوسط 14. ما القيمة المحذوفة؟\nالإجابة النموذجية: 120 − 98 = 22\n3) [مستوى الاستدلال] س = 0، 1، 2 و ت = 4، ك، 6، الوسط 1.1. أوجد ك.\nالإجابة النموذجية: (ك + 12) ÷ (10 + ك) = 1.1 ← ك = 10\n\n4) [مستوى المعرفة] أكمل: الوسط = ب + ∑(س − ب) ÷ ___\nالإجابة النموذجية: ن\n5) [مستوى التطبيق] ن = 10، ∑(س − ب) = 30، الوسط 28. أوجد ب.\nالإجابة النموذجية: ب = 25\n6) [مستوى الاستدلال] حوّل: ∑(س − 3) = 20، ن = 15 إلى ∑س.\nالإجابة النموذجية: ∑س = 65", "للطالب: تمارين 4-1: الأسئلة 1–5 (كتاب الطالب ص117–125، كتاب النشاط ص107–110).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الوسط الحسابي ورمز المجموع للبيانات المفردة والتكرارية».\nللطالب: تمارين 4-1: الأسئلة 6–10 (كتاب الطالب ص117–125، كتاب النشاط ص107–110).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الوسط الحسابي للبيانات المشفّرة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=21"]}, {"ax": "الوسط التقديري للبيانات المجمعة والوسط المركب", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يقدّر الوسط للبيانات المجمعة بمراكز الفئات.\n2) يحسب الوسط المركب لمجموعتين.\n\nمخرج تعليمي آخر: يفسر قيود التقدير.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "مركز الفئة، الوسط التقديري، الوسط المركب، حدود الفئات.", "يسأل المعلم: إذا كانت الأطوال في فئات فلماذا نحتاج مراكز الفئات؟ والطالب: لأن القيم الفعلية غير معروفة.", "1. التهيئة: يسأل المعلم: إذا كانت الأطوال في فئات فلماذا نحتاج مراكز الفئات؟ والطالب: لأن القيم الفعلية غير معروفة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 150–<160 (6)، 160–<170 (10)، 170–<180 (4): المراكز 155، 165، 175 ← الوسط = 3280 ÷ 20 = 164، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم مسائل الوسط المركب (صفان) ومسائل بيانات مجمعة بفئات غير متساوية، وتحل المجموعة (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يكلف المعلم بكتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 4-1 ومحور «الوسط التقديري للبيانات المجمعة والوسط المركب»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-1: الأسئلة 11–15، وكتاب النشاط، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] مركز الفئة 160–<170؟\nالإجابة النموذجية: 165\n2) [مستوى التطبيق] الوسط التقديري في المثال؟\nالإجابة النموذجية: 164\n3) [مستوى الاستدلال] 20 طالبًا وسطهم 60 و 30 وسطهم 70. الوسط المركب؟\nالإجابة النموذجية: 66", "1) [مستوى المعرفة] أكمل: الوسط للبيانات المجمعة قيمة ___\nالإجابة النموذجية: تقديرية\n2) [مستوى التطبيق] 0–<10 (5)، 10–<30 (10)، 30–<40 (5). الوسط التقديري؟\nالإجابة النموذجية: (25 + 200 + 175) ÷ 20 = 20\n3) [مستوى الاستدلال] وسط 15 قيمة 40 ووسط 10 قيم ك، والمركب 44. أوجد ك.\nالإجابة النموذجية: (600 + 10ك) ÷ 25 = 44 ← ك = 50", "للطالب: تمارين 4-1: الأسئلة 11–15، وكتاب النشاط (كتاب الطالب ص117–125، كتاب النشاط ص107–110).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «الوسط التقديري للبيانات المجمعة والوسط المركب».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=21"]}]}, {"id": "4-2", "title": "التباين والانحراف المعياري", "p": [{"ax": "التباين والانحراف المعياري للبيانات المفردة والتكرارية + التباين للبيانات المشفرة", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يحسب التباين بالصيغتين ∑(س − الوسط)² ÷ ن و ∑س² ÷ ن − الوسط².\n2) يحسبهما من جدول تكراري.\n3) يحسب التباين من ∑(س − ب) و ∑(س − ب)².\n4) يبين أن الإزاحة بثابت لا تغير التباين.\n\nمخرج تعليمي آخر:\nيفسر الانحراف المعياري في السياق.\nيحول الملخصات المشفرة إلى ∑س و ∑س².", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج الآخر: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "التباين، الانحراف المعياري، ∑س²، ∑ت س²، التشتت.، البيانات المشفرة، ∑(س − ب)²، ثبات التباين عند الإزاحة.", "يعرض مجموعتين بالوسط نفسه وتشتت مختلف ويسأل: كيف نقيس الانتشار حول الوسط؟ ويقترح الطالب متوسط بعد القيم عن الوسط.", "1. التهيئة: يعرض مجموعتين بالوسط نفسه وتشتت مختلف ويسأل: كيف نقيس الانتشار حول الوسط؟ ويقترح الطالب متوسط بعد القيم عن الوسط (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 2، 4، 4، 4، 5، 5، 7، 9: ∑س = 40، ∑س² = 232 ← التباين 29 − 25 = 4، الانحراف 2، ويتابع الطالب ويقارن بالصيغة الأولى (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم من جدول تكراري: س = 1، 2، 3 و ت = 2، 5، 3، ويقوم الطالب بالوسط 2.1، ∑ت س² = 49، التباين 4.9 − 4.41 = 0.49، الانحراف 0.7 (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطرح المعلم: ن = 5، ∑س = 30، ∑س² = 200. التباين؟ والطالب: 40 − 36 = 4 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. النمذجة: ينمذج المعلم: ن = 10، ∑(س − 20) = 15، ∑(س − 20)² = 97.5 ← التباين 9.75 − 2.25 = 7.5، الوسط 21.5، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعلم تعاوني: يوزع المعلم ملخصات مشفرة لحساب الوسط والانحراف، وتحويلها إلى ∑س²، وتحل المجموعة (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. تقويم تكويني: يسأل المعلم: لماذا لا يتغير التباين بالإزاحة؟ والطالب: لأن الانحرافات عن الوسط لا تتغير (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-2: الأسئلة 6–10، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] ن = 8، ∑س = 40، ∑س² = 232. الانحراف المعياري؟\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] س = 1، 2، 3 و ت = 2، 5، 3. التباين؟\nالإجابة النموذجية: 0.49\n3) [مستوى الاستدلال] ن = 5، ∑س = 30، ∑س² = 200. التباين؟\nالإجابة النموذجية: 4\n\n4) [مستوى المعرفة] ن = 10، ∑(س − 20) = 15، ∑(س − 20)² = 97.5. التباين؟\nالإجابة النموذجية: 7.5\n5) [مستوى التطبيق] الوسط في السؤال السابق؟\nالإجابة النموذجية: 21.5\n6) [مستوى الاستدلال] هل يتغير التباين إذا أضيف 7 لكل القيم؟\nالإجابة النموذجية: لا", "1) [مستوى المعرفة] أكمل: التباين = ∑س² ÷ ن − (___)²\nالإجابة النموذجية: الوسط\n2) [مستوى التطبيق] أوجد الانحراف المعياري: 3، 7، 8، 10، 12.\nالإجابة النموذجية: الوسط 8، ∑س² = 366، التباين 73.2 − 64 = 9.2، الانحراف ≈ 3.03\n3) [مستوى الاستدلال] ن = 10، الوسط 6، الانحراف 2. أوجد ∑س².\nالإجابة النموذجية: 10 × (4 + 36) = 400\n\n4) [مستوى المعرفة] أكمل: تباين (س − ب) = تباين ___\nالإجابة النموذجية: س\n5) [مستوى التطبيق] ن = 20، ∑(س − 5) = 40، ∑(س − 5)² = 180. الانحراف المعياري؟\nالإجابة النموذجية: التباين 9 − 4 = 5، الانحراف ≈ 2.24\n6) [مستوى الاستدلال] ن = 4، ∑(س − 10) = 8، ∑(س − 10)² = 24. أوجد ∑س².\nالإجابة النموذجية: ∑س = 48، الوسط 12، التباين 6 − 4 = 2، ∑س² = 4 × (2 + 144) = 584", "للطالب: تمارين 4-2: الأسئلة 1–5 (كتاب الطالب ص126–134، ومراجعة الوحدة ص135–138، كتاب النشاط ص111–115، ومراجعة الوحدة ص116–117).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 4-2: الأسئلة 6–10 (كتاب الطالب ص126–134، ومراجعة الوحدة ص135–138، كتاب النشاط ص111–115، ومراجعة الوحدة ص116–117).\nلولي الأمر: متابعة تقدم الابن/الابنة في «التباين للبيانات المشفرة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=22"]}, {"ax": "تقدير التباين للبيانات المجمعة ومراجعة الوحدة", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يقدر التباين والانحراف للبيانات المجمعة.\n2) يقارن بين توزيعين بالوسط والانحراف.\n\nمخرج تعليمي آخر: يحل أسئلة مراجعة الوحدة الرابعة.", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "مراكز الفئات، التباين التقديري، المقارنة، مراجعة الوحدة.", "يسأل المعلم: كيف نقدر التباين لأطوال في فئات؟ ويقترح الطالب مراكز الفئات.", "1. التهيئة: يسأل المعلم: كيف نقدر التباين لأطوال في فئات؟ ويقترح الطالب مراكز الفئات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 0–<10 (2)، 10–<20 (5)، 20–<30 (3): الوسط 16، ∑ت م² = 3050، التباين 49، الانحراف 7، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم أسئلة من مراجعة نهاية الوحدة ص135–138 للمقارنة بين توزيعين، وتحل وتكتب استنتاجات (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...» للوحدة، ويقيم الطالب نفسه (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 4-2 ومحور «تقدير التباين للبيانات المجمعة ومراجعة الوحدة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين 4-2 ومراجعة نهاية الوحدة ص135–138، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] الانحراف المعياري التقديري في المثال؟\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] أ: الوسط 50، الانحراف 4؛ ب: الوسط 52، الانحراف 9. قارن.\nالإجابة النموذجية: ب أعلى في المتوسط، و أ أكثر اتساقًا\n3) [مستوى الاستدلال] 0–<4 (5)، 4–<8 (5). التباين التقديري؟\nالإجابة النموذجية: 4", "1) [مستوى المعرفة] أكمل: في البيانات المجمعة نستخدم ___ الفئات\nالإجابة النموذجية: مراكز\n2) [مستوى التطبيق] 0–<10 (4)، 10–<20 (6). التباين التقديري؟\nالإجابة النموذجية: الوسط 11، ∑ت م² = 1450، التباين 145 − 121 = 24\n3) [مستوى الاستدلال] أي توزيع أكثر اتساقًا: انحراف 3 أم 8 (بنفس الوحدات)؟\nالإجابة النموذجية: الانحراف 3", "للطالب: إكمال تمارين 4-2 ومراجعة نهاية الوحدة ص135–138 (كتاب الطالب ص126–134، ومراجعة الوحدة ص135–138، كتاب النشاط ص111–115، ومراجعة الوحدة ص116–117).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=22"]}]}, {"id": "5-1", "title": "طول القطعة المستقيمة وإحداثيات نقطة منتصفها", "p": [{"ax": "طول القطعة المستقيمة (المسافة بين نقطتين)", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يشتق صيغة المسافة بين نقطتين من نظرية فيثاغورس.\n2) يحسب طول قطعة مستقيمة بمعلومية طرفيها.\nمخرج تعليمي آخر: يصنف مثلثًا (متطابق الضلعين، قائم) باستخدام الأطوال.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني", "المسافة بين نقطتين، نظرية فيثاغورس، الصيغة الدقيقة بالجذور.", "يرسم المعلم النقطتين (1، 2) و (4، 6) على شبكة ويسأل: كيف نجد المسافة بينهما؟ ويرسم الطالب مثلثًا قائمًا ويستخدم فيثاغورس: 5.", "1. التهيئة: يرسم المعلم النقطتين (1، 2) و (4، 6) على شبكة ويسأل: كيف نجد المسافة بينهما؟ ويرسم الطالب مثلثًا قائمًا ويستخدم فيثاغورس: 5 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يشتق المعلم: المسافة = √((س2 − س1)² + (ص2 − ص1)²) ويطبق على (−2، 3) و (4، −5) ← √(36 + 64) = 10، ويتابع الطالب ويطبق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم رؤوس مثلثات: أ(1، 1)، ب(4، 5)، جـ(8، 2) لتحديد نوعها، وتحسب: أب = 5، ب جـ = 5، أ جـ = √50 ← متطابق الضلعين وقائم الزاوية عند ب (25 + 25 = 50) (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطرح المعلم: أوجد ك إذا كانت المسافة بين (1، ك) و (4، 5) تساوي 5، والطالب: 9 + (5 − ك)² = 25 ← ك = 1 أو 9 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-1: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] المسافة بين (1، 2) و (4، 6)؟\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] المسافة بين (−2، 3) و (4، −5)؟\nالإجابة النموذجية: 10\n3) [مستوى الاستدلال] المسافة بين (0، 0) و (2، 3) بصورة دقيقة؟\nالإجابة النموذجية: √13", "1) [مستوى المعرفة] أكمل: المسافة بين (س1، ص1) و (س2، ص2) = √((س2 − س1)² + (___)²)\nالإجابة النموذجية: ص2 − ص1\n2) [مستوى التطبيق] أوجد ك إذا كانت المسافة بين (1، ك) و (4، 5) تساوي 5.\nالإجابة النموذجية: ك = 1 أو 9\n3) [مستوى الاستدلال] بيّن أن المثلث أ(1، 1)، ب(4، 5)، جـ(8، 2) قائم الزاوية.\nالإجابة النموذجية: أب² + ب جـ² = 25 + 25 = 50 = أ جـ²", "للطالب: تمارين 5-1: الأسئلة 1–4 (كتاب الطالب ص139–142، كتاب النشاط ص118–121).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «طول القطعة المستقيمة (المسافة بين نقطتين)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=23"]}, {"ax": "إحداثيات نقطة المنتصف وتطبيقاتها", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يحسب إحداثيات نقطة منتصف قطعة مستقيمة.\n2) يجد أحد طرفي القطعة بمعلومية المنتصف والطرف الآخر.\nمخرج تعليمي آخر: يستخدم المنتصف والمسافة لحل مسائل هندسية (القطر، الدائرة).", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "نقطة المنتصف، متوسط الإحداثيين، الطرف المجهول، القطر.", "يسأ /11/advmath/?l=23"]}]}, {"id": "5-2", "title": "المستقيمات المتوازية والمستقيمات المتعامدة", "p": [{"ax": "الميل والمستقيمات المتوازية", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يحسب ميل المستقيم المار بنقطتين.\n2) يستنتج أن المستقيمات المتوازية متساوية الميل.\nمخرج تعليمي آخر: يثبت أن ثلاث نقاط على استقامة واحدة باستخدام الميل.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "الميل م = (ص2 − ص1) ÷ (س2 − س1)، التوازي، الاستقامة.", "يعرض المعلم منحدرين للكراسي المتحركة ويسأل: أيهما أشد انحدارًا؟ كيف نقيس؟ ويقترح الطالب نسبة الارتفاع إلى المسافة الأفقية.", "1. التهيئة: يعرض المعلم منحدرين للكراسي المتحركة ويسأل: أيهما أشد انحدارًا؟ كيف نقيس؟ ويقترح الطالب نسبة الارتفاع إلى المسافة الأفقية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ميل المستقيم المار بـ (1، 2) و (4، 11) = 3؛ وأن المستقيمين المتوازيين لهما الميل نفسه، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم أسئلة: هل (1، 3)، (3، 7)، (6، 13) على استقامة واحدة؟ وهل أ ب جـ د متوازي أضلاع؟ وتحسب الميول وتحكم (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يطرح المعلم: ميل مستقيم يوازي ص = 4 − 2س؟ والطالب: −2 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-2: الأسئلة 1–4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] ميل المستقيم المار بـ (1، 2) و (4، 11)؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] هل (1، 3)، (3، 7)، (6، 13) على استقامة واحدة؟\nالإجابة النموذجية: نعم، الميلان متساويان 2\n3) [مستوى الاستدلال] ميل مستقيم يوازي ص = 4 − 2س؟\nالإجابة النموذجية: −2", "1) [مستوى المعرفة] أكمل: المستقيمان المتوازيان ___ في الميل.\nالإجابة النموذجية: متساويان\n2) [مستوى التطبيق] ميل المستقيم المار بـ (−2، 5) و (3، −5)؟\nالإجابة النموذجية: −2\n3) [مستوى الاستدلال] أوجد ك إذا كان المستقيم المار بـ (1، ك) و (3، 7) يوازي ص = 3س + 1.\nالإجابة النموذجية: (7 − ك) ÷ 2 = 3 ← ك = 1", "للطالب: تمارين 5-2: الأسئلة 1–4 (كتاب الطالب ص143–146، كتاب النشاط ص122–126).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «الميل والمستقيمات المتوازية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=24"]}, {"ax": "المستقيمات المتعامدة والعمود المنصّف", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يستخدم شرط التعامد م1 × م2 = −1.\n2) يجد ميل العمود المنصّف لقطعة مستقيمة.\nمخرج تعليمي آخر: يثبت تعامد ضلعين في شكل هندسي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التعامد، م1 × م2 = −1، الميل العمودي، العمود المنصّف.", "يرسم المعلم مستقيمين متعامدين على شبكة بميلين 2 و −1/2 ويسأل: ما حاصل ضرب الميلين؟ ويجد الطالب −1.", "1. التهيئة: يرسم المعلم مستقيمين متعامدين على شبكة بميلين 2 و −1/2 ويسأل: ما حاصل ضرب الميلين؟ ويجد الطالب −1 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ميل العمودي على مستقيم ميله 2/3 هو −3/2؛ والعمود المنصّف لـ (1، 2) و (5، 6): المنتصف (3، 4) والميل −1، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: هل المثلث (0، 0)، (4، 2)، (1، 8) قائم؟ وتحسب: ميل (0،0)-(4،2) = 1/2، ميل (4،2)-(1،8) = −2 ← قائم عند (4، 2) (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يكلف المعلم بسؤال من التمارين، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يخت . التهيئة: يسأل المعلم: كم معلومة نحتاج لتحديد مستقيم واحد فقط؟ والطالب: نقطة وميل، أو نقطتان (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: مستقيم يمر بـ (2، −1) وميله 3 ← ص + 1 = 3(س − 2) ← ص = 3س − 7 ← 3س − ص − 7 = 0؛ ومستقيم يمر بـ (1، 4) و (3، 10) ← ص = 3س + 1، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم معادلة المستقيم الموازي لـ 2س + ص = 5 والمار بـ (1، 3)، ويقوم الطالب بالميل −2 ← ص = −2س + 5... ص − 3 = −2(س − 1) ← ص = −2س + 5 (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطلب المعلم كتابة ص = (2/3)س − 4 بالصيغة العامة بمعاملات صحيحة، والطالب: 2س − 3ص − 12 = 0 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3: الأسئلة 1–5، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] معادلة المستقيم المار بـ (2، −1) وميله 3؟\nالإجابة النموذجية: ص = 3س − 7\n2) [مستوى التطبيق] معادلة المستقيم المار بـ (1، 4) و (3، 10)؟\nالإجابة النموذجية: ص = 3س + 1\n3) [مستوى الاستدلال] اكتب ص = (2/3)س − 4 بالصيغة العامة.\nالإجابة النموذجية: 2س − 3ص − 12 = 0", "1) [مستوى المعرفة] أكمل: صيغة النقطة والميل: ص − ص1 = م(___)\nالإجابة النموذجية: س − س1\n2) [مستوى التطبيق] معادلة المستقيم المار بـ (−1، 2) و (3، −6)؟\nالإجابة النموذجية: الميل −2، ص = −2س\n3) [مستوى الاستدلال] المقطع الصادي للمستقيم 3س + 2ص = 8؟\nالإجابة النموذجية: 4", "للطالب: تمارين 5-3: الأسئلة 1–5 (كتاب الطالب ص147–150، كتاب النشاط ص127–129).\nلولي الأمر: متابعة تقدم الابن/الابنة في «معادلة المستقيم بمعلومية نقطة وميل أو نقطتين» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=25"]}, {"ax": "معادلات المستقيمات العمودية والعمود المنصّف ونقاط التقاطع", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يكتب معادلة مستقيم عمودي على مستقيم معلوم ويمر بنقطة.\n2) يكتب معادلة العمود المنصّف لقطعة.\nمخرج تعليمي آخر: يجد نقطة تقاطع مستقيمين بحل معادلتيهما آنيًا.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المستقيم العمودي، العمود المنصّف، نقطة التقاطع، الحل الآني.", "يسأل المعلم: كيف نجد النقطة على مستقيم أقرب ما تكون إلى نقطة خارجه؟ ويقترح الطالب العمود.", "1. التهيئة: يسأل المعلم: كيف نجد النقطة على مستقيم أقرب ما تكون إلى نقطة خارجه؟ ويقترح الطالب العمود (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم العمود المنصّف للقطعة من (1، 2) إلى (5، 6): ص − 4 = −(س − 3) ← س + ص = 7، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعلم تعاوني: يوزع المعلم: أوجد قدم العمود من (6، 1) على ص = 2س − 1، ويقوم الطالب بالعمودي: ص − 1 = −1/2(س − 6) ← التقاطع مع ص = 2س − 1 ← (2، 3) (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تقويم تكويني: يطلب المعلم تقاطع س + ص = 7 و ص = 2س + 1، والطالب: (2، 5) (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 5-3 ومحور «معادلات المستقيمات العمودية والعمود المنصّف ونقاط التقاطع»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-3: الأسئلة 6–10، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] معادلة العمود المنصّف للقطعة من (1، 2) إلى (5، 6)؟\nالإجابة النموذجية: س + ص = 7\n2) [مستوى التطبيق] تقاطع س + ص = 7 و ص = 2س + 1؟\nالإجابة النموذجية: (2، 5)\n3) [مستوى الاستدلال] معادلة المستقيم العمودي على ص = 2س − 1 والمار بـ (6، 1)؟\nالإجابة النموذجية: ص = −1/2 س + 4", "1) [مستوى المعرفة] أكمل: العمود المنصّف يمر بـ ___ القطعة.\nالإجابة النموذجية: منتصف\n2) [مستوى التطبيق] قدم العمود من (6، 1) على ص = 2س − 1؟\nالإجابة النموذجية: (2، 3)\n3) [مستوى الاستدلال] معادلة المستقيم المار بـ (2، 3) والعمودي على 3س + 4ص = 1؟\nالإجابة النموذجية: الميل 4/3: ص − 3 = 4/3(س − 2) ← 4س − 3ص + 1 = 0", "للطالب: تمارين 5-3: الأسئلة 6–10 (كتاب الطالب ص147–150، كتاب النشاط ص127–129).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=25"]}]}, {"id": "5-4", "title": "معادلة الدائرة", "p": [{"ax": "معادلة الدائرة بمعلومية المركز ونصف القطر + الصورة العامة لمعادلة الدائرة والإكمال إلى مربع", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يكتب معادلة الدائرة (س − أ)² + (ص − ب)² = نق².\n2) يحدد المركز ونصف القطر من المعادلة القياسية.\n3) يحول الصورة العامة إلى القياسية بالإكمال إلى مربع.\n4) يحدد المركز ونصف القطر من الصورة العامة.\n\nمخرج تعليمي آخر:\nيتحقق من وقوع نقطة على الدائرة أو داخلها أو خارجها.\nيحدد هل المعادلة تمثل دائرة حقيقية.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "الدائرة، المركز (أ، ب)، نصف القطر نق، المعادلة القياسية.، الصورة العامة س² + ص² + 2ج س + 2ف ص + جـ = 0، الإكمال إلى مربع، شرط الدائرة الحقيقية.", "يسأل المعلم: ما مجموعة النقاط التي تبعد 5 وحدات عن (2، −3)؟ ويربط بصيغة المسافة، ويستنتج الطالب (س − 2)² + (ص + 3)² = 25.", "1. التهيئة: يسأل المعلم: ما مجموعة النقاط التي تبعد 5 وحدات عن (2، −3)؟ ويربط بصيغة المسافة، ويستنتج الطالب (س − 2)² + (ص + 3)² = 25 (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يشتق المعلم المعادلة من صيغة المسافة ويطبق: مركز (−1، 4) ونصف قطر 3 ← (س + 1)² + (ص − 4)² = 9، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم: هل (5، 1) تقع على (س − 2)² + (ص + 3)² = 25؟ وماذا عن (0، 0)؟ والطالب: (5، 1): 9 + 16 = 25 تقع عليها؛ (0، 0): 4 + 9 = 13 < 25 داخلها (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يطرح المعلم أسئلة سريعة عن المركز ونصف القطر، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. النمذجة: ينمذج المعلم: (س − 2)² + (ص + 3)² = 25 ← المركز (2، −3)، نق = 5، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعلم تعاوني: يوزع المعلم: س² + ص² + 8س − 2ص + 1 = 0، و س² + ص² − 6س + 10 = 0، وتجد: (−4، 1)، نق = 4؛ والثانية (س − 3)² + ص² = −1 ليست دائرة (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. تقويم تكويني: يطلب المعلم مركز ونصف قطر 2س² + 2ص² − 8س = 0، والطالب: س² + ص² − 4س = 0 ← (2، 0)، نق = 2 (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: الأسئلة 5–8، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] معادلة دائرة مركزها (−1، 4) ونصف قطرها 3؟\nالإجابة النموذجية: (س + 1)² + (ص − 4)² = 9\n2) [مستوى التطبيق] مركز ونصف قطر (س − 2)² + (ص + 3)² = 25؟\nالإجابة النموذجية: (2، −3)، 5\n3) [مستوى الاستدلال] هل (0، 0) داخل الدائرة السابقة؟\nالإجابة النموذجية: نعم، 13 < 25\n\n4) [مستوى المعرفة] مركز ونصف قطر س² + ص² − 4س + 6ص − 12 = 0؟\nالإجابة النموذجية: (2، −3)، 5\n5) [مستوى التطبيق] مركز ونصف قطر س² + ص² + 8س − 2ص + 1 = 0؟\nالإجابة النموذجية: (−4، 1)، 4\n6) [مستوى الاستدلال] هل س² + ص² − 6س + 10 = 0 دائرة؟\nالإجابة النموذجية: لا", "1) [مستوى المعرفة] أكمل: معادلة الدائرة التي مركزها نقطة الأصل ونصف قطرها نق: س² + ص² = ___\nالإجابة النموذجية: نق²\n2) [مستوى التطبيق] معادلة دائرة مركزها (3، 0) وتمر بـ (6، 4)؟\nالإجابة النموذجية: نق = 5: (س − 3)² + ص² = 25\n3) [مستوى الاستدلال] هل (1، 7) على (س + 2)² + (ص − 3)² = 25؟\nالإجابة النموذجية: 9 + 16 = 25، نعم\n\n4) [مستوى المعرفة] أكمل: س² − 4س = (س − 2)² − ___\nالإجابة النموذجية: 4\n5) [مستوى التطبيق] مركز ونصف قطر 2س² + 2ص² − 8س = 0؟\nالإجابة النموذجية: (2، 0)، 2\n6) [مستوى الاستدلال] أوجد ك إذا كانت س² + ص² − 2س + 4ص + ك = 0 دائرة نصف قطرها 3.\nالإجابة النموذجية: 1 + 4 − ك = 9 ← ك = −4", "للطالب: تمارين 5-4: الأسئلة 1–4 (كتاب الطالب ص151–157، كتاب النشاط ص130–132).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «معادلة الدائرة بمعلومية المركز ونصف القطر».\nللطالب: تمارين 5-4: الأسئلة 5–8 (كتاب الطالب ص151–157، كتاب النشاط ص130–132).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الصورة العامة لمعادلة الدائرة والإكمال إلى مربع» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=26"]}, {"ax": "معادلة المماس للدائرة عند نقطة ودائرة تمر بثلاث نقاط", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يستخدم تعامد المماس مع نصف القطر لإيجاد معادلة المماس.\n2) يجد معادلة دائرة تمر بنقاط معلومة باستخدام العمود المنصّف.\n\nمخرج تعليمي آخر: يربط مفاهيم الوحدة في حل مسائل مركبة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المماس، نقطة التماس، تعامد المماس ونصف القطر، تقاطع الأعمدة المنصفة.", "يسأل المعلم: ما الزاوية بين المماس ونصف القطر عند نقطة التماس؟ والطالب: قائمة.", "1. التهيئة: يسأل المعلم: ما الزاوية بين المماس ونصف القطر عند نقطة التماس؟ والطالب: قائمة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم المماس للدائرة (س − 2)² + (ص + 3)² = 25 عند (5، 1): ميل نصف القطر 4/3 ← ميل المماس −3/4 ← 3س + 4ص − 19 = 0، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. حل مشكلة: يقدم المعلم: دائرة تمر بـ (0، 0)، (8، 0)، (0، 6). يقود الطلبة لإيجاد المركز (4، 3) من العمودين المنصفين ونق = 5، ويحل الطالب ويتحقق (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يكلف المعلم بسؤال مماس من التمارين، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. المعلم: يختار المعلم الدرس 5-4 ومحور «معادلة المماس للدائرة عند نقطة ودائرة تمر بثلاث نقاط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-4: الأسئلة 9–12، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] ميل نصف القطر من (2، −3) إلى (5، 1)؟\nالإجابة النموذجية: 4/3\n2) [مستوى التطبيق] معادلة المماس عند (5، 1)؟\nالإجابة النموذجية: 3س + 4ص − 19 = 0\n3) [مستوى الاستدلال] مركز الدائرة المارة بـ (0، 0)، (8، 0)، (0، 6)؟\nالإجابة النموذجية: (4، 3)", "1) [مستوى المعرفة] أكمل: المماس ___ نصف القطر عند نقطة التماس.\nالإجابة النموذجية: عمودي على\n2) [مستوى التطبيق] معادلة المماس للدائرة س² + ص² = 25 عند (3، 4)؟\nالإجابة النموذجية: ميل نصف القطر 4/3، المماس 3س + 4ص = 25\n3) [مستوى الاستدلال] نصف قطر الدائرة المارة بـ (0، 0)، (8، 0)، (0، 6)؟\nالإجابة النموذجية: 5", "للطالب: تمارين 5-4: الأسئلة 9–12 (كتاب الطالب ص151–157، كتاب النشاط ص130–132).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «معادلة المماس للدائرة عند نقطة ودائرة تمر بثلاث نقاط».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=26"]}]}, {"id": "5-5", "title": "علاقة المستقيم بالدائرة", "p": [{"ax": "نقاط تقاطع المستقيم والدائرة + شرط التماس وقيم الثابت", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يجد نقاط تقاطع مستقيم ودائرة بالتعويض.\n2) يحدد عدد نقاط التقاطع بالمميّز.\n3) يجد قيم الثابت التي تجعل المستقيم مماسًا للدائرة.\n4) يجد مدى قيم الثابت لكي يقطع المستقيم الدائرة في نقطتين.\n\nمخرج تعليمي آخر:\nيجد طول الوتر الناتج عن التقاطع.\nيتحقق بالرسم.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "القاطع، المماس، الوتر، المميّز، طول الوتر.، شرط التماس، المتباينة في الثابت.", "يعرض المعلم على GeoGebra دائرة ومستقيمًا متحركًا ويسأل: كم وضعًا ممكنًا للمستقيم بالنسبة للدائرة؟ والطالب: ثلاثة: يقطع، يمس، لا يقطع.", "1. التهيئة: يعرض المعلم على GeoGebra دائرة ومستقيمًا متحركًا ويسأل: كم وضعًا ممكنًا للمستقيم بالنسبة للدائرة؟ والطالب: ثلاثة: يقطع، يمس، لا يقطع (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: ص = س + 1 و س² + ص² = 25 ← 2س² + 2س − 24 = 0 ← (3، 4) و (−4، −3)، وطول الوتر √98 = 7√2، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تطبيق موجّه: يطلب المعلم عدد نقاط تقاطع ص = 2س + 10 مع س² + ص² = 9، والطالب: 5س² + 40س + 91 = 0، المميّز 1600 − 1820 < 0، لا تقاطع (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم تكويني: يصنف المعلم ثلاث حالات بالمميّز، ويصنف الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. النمذجة: ينمذج المعلم: 2س² + 2ك س + ك² − 8 = 0 ← 4ك² − 8(ك² − 8) = 0 ← ك = ±4، ونقطتا التماس (−2، 2) و (2، −2)، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعلم تعاوني: يوزع المعلم: قيم م التي تجعل ص = م س + 5 يقطع س² + ص² = 5 في نقطتين، والطالب: (1 + م²)س² + 10م س + 20 = 0 ← 100م² − 80(1 + م²) > 0 ← م² > 4 ← م < −2 أو م > 2 (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. تقويم تكويني: يتحقق المعلم بالرسم على GeoGebra، ويقارن الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. التقويم الختامي: يعرض المعلم أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي، ويحل الطالب أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-5: الأسئلة 5–8، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "1) [مستوى المعرفة] تقاطع ص = س + 1 مع س² + ص² = 25؟\nالإجابة النموذجية: (3، 4) و (−4، −3)\n2) [مستوى التطبيق] طول الوتر في السؤال السابق؟\nالإجابة النموذجية: 7√2\n3) [مستوى الاستدلال] هل ص = 2س + 10 يقطع س² + ص² = 9؟\nالإجابة النموذجية: لا\n\n4) [مستوى المعرفة] قيم ك لكي يمس ص = س + ك الدائرة س² + ص² = 8؟\nالإجابة النموذجية: ±4\n5) [مستوى التطبيق] نقطة التماس عندما ك = 4؟\nالإجابة النموذجية: (−2، 2)\n6) [مستوى الاستدلال] قيم م لكي يقطع ص = م س + 5 الدائرة س² + ص² = 5 في نقطتين؟\nالإجابة النموذجية: م < −2 أو م > 2", "1) [مستوى المعرفة] أكمل: إذا كان مميّز معادلة التقاطع موجبًا فالمستقيم ___ الدائرة\nالإجابة النموذجية: يقطع\n2) [مستوى التطبيق] تقاطع ص = 7 − س مع س² + ص² = 25؟\nالإجابة النموذجية: (3، 4) و (4، 3)\n3) [مستوى الاستدلال] طول الوتر في السؤال السابق؟\nالإجابة النموذجية: √2\n\n4) [مستوى المعرفة] أكمل: شرط التماس هو المميّز = ___\nالإجابة النموذجية: 0\n5) [مستوى التطبيق] قيم م لكي يمس ص = م س + 5 الدائرة س² + ص² = 5؟\nالإجابة النموذجية: م = ±2\n6) [مستوى الاستدلال] هل ص = 4 مماس للدائرة س² + ص² = 16؟\nالإجابة النموذجية: نعم عند (0، 4)", "للطالب: تمارين 5-5: الأسئلة 1–4 (كتاب الطالب ص158–161، ومراجعة الوحدة ص162–165، كتاب النشاط ص133–135، ومراجعة الوحدة ص136–139).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 5-5: الأسئلة 5–8 (كتاب الطالب ص158–161، ومراجعة الوحدة ص162–165، كتاب النشاط ص133–135، ومراجعة الوحدة ص136–139). جابة النموذجية: لا\n3) [مستوى الاستدلال] أ م (م المحايدة)؟\nالإجابة النموذجية: أ", "1) [مستوى المعرفة] أكمل: ضرب المصفوفات ليس ___ بوجه عام\nالإجابة النموذجية: إبداليًا\n2) [مستوى التطبيق] أ²؟\nالإجابة النموذجية: ⁦[7 6 | 18 19]⁩\n3) [مستوى الاستدلال] مبيعات يومين ⁦[10 5 | 8 6]⁩ وأسعار ⁦[0.5 | 1]⁩. الإيراد؟\nالإجابة النموذجية: ⁦[10 | 10]⁩", "للطالب: تمارين 6-1: الأسئلة المتبقية، وكتاب النشاط (كتاب الطالب ص166–173، كتاب النشاط ص140–142).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=28"]}]}, {"id": "6-2", "title": "محدد المصفوفة", "p": [{"ax": "محدد المصفوفة المربعة من الرتبة 2 × 2 + حل معادلات تتضمن محددات", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يحسب محدد مصفوفة 2 × 2: أد − ب جـ.\n2) يفسر أن المحدد عدد حقيقي يُعرّف للمصفوفات المربعة فقط.\n3) يكوّن معادلة من محدد يتضمن متغيرًا.\n4) يحل المعادلة الناتجة (خطية أو تربيعية).\n\nمخرج تعليمي آخر:\nيقارن محددات مصفوفات مختلفة.\nيتحقق من الحلول بالتعويض.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المحدد، المصفوفة المربعة، القطر الرئيس، القطر الثانوي، أد − ب جـ.، محدد بدلالة متغير، المعادلة التربيعية، التحقق.", "يسأل المعلم: هل يمكن أن نربط بكل مصفوفة مربعة عددًا واحدًا يصف خاصية مهمة لها؟ ويتوقع الطالب.", "1. التهيئة: يسأل المعلم: هل يمكن أن نربط بكل مصفوفة مربعة عددًا واحدًا يصف خاصية مهمة لها؟ ويتوقع الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: محدد أ = 2 × 4 − 1 × 3 = 5؛ محدد ب = 3، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يطلب المعلم محدد ⁦[-3 2 | 5 -4]⁩ و ⁦[7 0 | 0 7]⁩، والطالب: 12 − 10 = 2؛ 49 (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تقويم تكويني: يسأل المعلم: هل لمصفوفة 2 × 3 محدد function fallback(t,btn,body,hint){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
 if(s)ok(btn);else{const r=document.createRange();r.selectNodeContents(body);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);hint.style.display='block';setTimeout(()=>hint.style.display='none',4000)}}
function copy(t,btn,body,hint){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>ok(btn),()=>fallback(t,btn,body,hint))}else fallback(t,btn,body,hint)}
draw();
