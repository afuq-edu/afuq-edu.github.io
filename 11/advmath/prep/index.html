² = 5.\nالإجابة النموذجية: س = 3 − 2ص ← 5ص² − 12ص + 4 = 0 ← (−1، 2) و (11/5، 2/5)", "1) [مستوى المعرفة] أكمل: عدم وجود حل يعني أن المستقيم ___ المنحنى.\nالإجابة النموذجية: لا يقطع\n2) [مستوى التطبيق] حل: 3س − ص = 1، س ص = 2.\nالإجابة النموذجية: ص = 3س − 1 ← 3س² − س − 2 = 0 ← (1، 2) و (−2/3، −3)\n3) [مستوى الاستدلال] حل: ص = س + 2، س² + 2ص² = 10 لثلاثة أرقام معنوية.\nالإجابة النموذجية: س ≈ 0.230، ص ≈ 2.23؛ س ≈ −2.90، ص ≈ −0.897", "للطالب: تمارين 1-5: الأسئلة 4–7 (كتاب الطالب ص34–36، كتاب النشاط ص27–31).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=5"]}]}, {"id": "1-6", "title": "حلّ معادلات تربيعية أكثر تعقيدًا", "p": [{"ax": "المعادلات في صورة تربيعية مقنّعة (س⁴، √س)", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يتعرف المعادلة التربيعية المقنّعة.\n2) يحل المعادلة باستخدام تعويض مناسب مثل ص = س² أو ص = √س.\nمخرج تعليمي آخر: يستبعد الحلول غير المقبولة بعد الرجوع للمتغير الأصلي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المعادلة التربيعية المقنّعة، التعويض بمتغير جديد، الرجوع للمتغير الأصلي، الحلول الدخيلة.", "يكتب س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟\nدور الطالب: يلاحظ ص² − 5ص + 4 = 0.", "(5 د) التهيئة: المعلم: يكتب س⁴ − 5س² + 4 = 0 ويسأل: هل هي تربيعية؟ ماذا لو سمينا س² = ص؟ | الطالب: يلاحظ ص² − 5ص + 4 = 0.\n(10 د) النمذجة: المعلم: ينمذج: س⁴ − 5س² + 4 = 0 ← ص = س² ← (ص − 1)(ص − 4) = 0 ← س = ±1، ±2. | الطالب: يتابع ويكمل الرجوع للمتغير.\n(10 د) تطبيق موجّه: المعلم: يحل: س − 5√س + 6 = 0 ← ص = √س ← ص = 2، 3 ← س = 4، 9، ويتحقق. | الطالب: يحل مسألة مشابهة: س − √س − 2 = 0 ← س = 4 فقط (نرفض √س = −1).\n(8 د) تقويم تكويني: المعلم: يسأل: لماذا رفضنا √س = −1؟ | الطالب: لأن الجذر التربيعي الموجب لا يكون سالبًا.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: الأسئلة 1–4. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] حل: س⁴ − 10س² + 9 = 0.\nالإجابة النموذجية: س² = 1 أو 9 ← س = ±1، ±3\n2) [مستوى التطبيق] حل: س − 5√س + 6 = 0.\nالإجابة النموذجية: س = 4 أو 9\n3) [مستوى الاستدلال] حل: س − √س − 2 = 0.\nالإجابة النموذجية: √س = 2 (نرفض −1) ← س = 4", "1) [مستوى المعرفة] أكمل: في س⁴ − 5س² + 4 = 0 نعوض ص = ___\nالإجابة النموذجية: س²\n2) [مستوى التطبيق] حل: س⁴ − 3س² − 4 = 0.\nالإجابة النموذجية: س² = 4 أو −1 (مرفوض) ← س = ±2\n3) [مستوى الاستدلال] حل: 2س − 7√س + 3 = 0.\nالإجابة النموذجية: √س = 3 أو 1/2 ← س = 9 أو 1/4", "للطالب: تمارين 1-6: الأسئلة 1–4 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «المعادلات في صورة تربيعية مقنّعة (س⁴، √س)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=6"]}, {"ax": "معادلات بمقلوبات أو بعبارات مركبة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحول معادلة فيها 1/س أو 1/س² إلى تربيعية.\n2) يحل معادلات من الصورة (عبارة)² + ب(عبارة) + جـ = 0.\nمخرج تعليمي آخر: يختار التعويض الأنسب ويبرره.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المقلوب، الضرب في المقام المشترك، التعويض بعبارة، القيود على المجال.", "يسأل: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟\nدور الطالب: يقترح الضرب في س².", "(5 د) التهيئة: المعلم: يسأل: كيف نتخلص من الكسور في 6/س² − 5/س + 1 = 0؟ | الطالب: يقترح الضرب في س².\n(10 د) النمذجة: المعلم: ينمذج: 6/س² − 5/س + 1 = 0 ← س² − 5س + 6 = 0 ← س = 2، 3 (س ≠ 0). | الطالب: يتابع.\n(10 د) تعلم تعاوني: المعلم: يوزع: (س² + 1)² − 7(س² + 1) + 10 = 0، و (2س − 1)² − 5(2س − 1) + 6 = 0. | الطالب: تحل: س² + 1 = 2 أو 5 ← س = ±1، ±2؛ 2س − 1 = 2 أو 3 ← س = 3/2، 2.\n(8 د) تقويم تكويني: المعلم: يكلف بسؤال من تمارين 1-6 فرديًا. | الطالب: يحل ويعرض.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-6 ومحور «معادلات بمقلوبات أو بعبارات مركبة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-6: الأسئلة 5–8. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] حل: 6/س² − 5/س + 1 = 0.\nالإجابة النموذجية: س = 2 أو 3\n2) [مستوى التطبيق] حل: (س² + 1)² − 7(س² + 1) + 10 = 0.\nالإجابة النموذجية: س = ±1، ±2\n3) [مستوى الاستدلال] حل: (2س − 1)² − 5(2س − 1) + 6 = 0.\nالإجابة النموذجية: س = 3/2 أو 2", "1) [مستوى المعرفة] أكمل: في (س² + 1)² − 7(س² + 1) + 10 = 0 نعوض ص = ___\nالإجابة النموذجية: س² + 1\n2) [مستوى التطبيق] حل: س + 6/س = 5.\nالإجابة النموذجية: س² − 5س + 6 = 0 ← س = 2 أو 3\n3) [مستوى الاستدلال] حل: 1/س² − 3/س − 4 = 0.\nالإجابة النموذجية: نضرب في س²: 1 − 3س − 4س² = 0 ← 4س² + 3س − 1 = 0 ← س = 1/4 أو −1", "للطالب: تمارين 1-6: الأسئلة 5–8 (كتاب الطالب ص37–38، كتاب النشاط ص32–35).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «معادلات بمقلوبات أو بعبارات مركبة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=6"]}]}, {"id": "1-7", "title": "حلّ المتباينات التربيعية", "p": [{"ax": "حل المتباينات التربيعية بالقيم الحرجة والرسم", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد القيم الحرجة للمتباينة التربيعية.\n2) يستخدم الرسم التخطيطي لتحديد مجموعة الحل.\nمخرج تعليمي آخر: يكتب مجموعة الحل بالصيغة المناسبة (فترة واحدة أو فترتان).", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتباينة التربيعية، القيم الحرجة، الرسم التخطيطي، مجموعة الحل.", "يسأل: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟\nدور الطالب: يحدد ±2 للمعادلة وفترة للمتباينة.", "(5 د) التهيئة: المعلم: يسأل: ما الفرق بين حل س² − 4 = 0 وحل س² − 4 < 0؟ | الطالب: يحدد ±2 للمعادلة وفترة للمتباينة.\n(10 د) النمذجة: المعلم: ينمذج: 2س² + 5س − 3 < 0 ← (2س − 1)(س + 3) < 0 ← −3 < س < 1/2؛ و س² − 4س − 12 ≥ 0 ← س ≤ −2 أو س ≥ 6. | الطالب: يرسم المنحنى ويقرأ الحل.\n(10 د) تطبيق موجّه: المعلم: يكلف بـ: 6 − س − س² > 0 و 3س² ≤ 2س + 8. | الطالب: يحل: −3 < س < 2؛ (3س + 4)(س − 2) ≤ 0 ← −4/3 ≤ س ≤ 2.\n(8 د) تقويم تكويني: المعلم: يعرض حلولًا ويطلب الحكم عليها. | الطالب: يحكم ويبرر.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-7: الأسئلة 1–4. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] حل: 2س² + 5س − 3 < 0.\nالإجابة النموذجية: −3 < س < 1/2\n2) [مستوى التطبيق] حل: س² − 4س − 12 ≥ 0.\nالإجابة النموذجية: س ≤ −2 أو س ≥ 6\n3) [مستوى الاستدلال] حل: 3س² ≤ 2س + 8.\nالإجابة النموذجية: −4/3 ≤ س ≤ 2", "1) [مستوى المعرفة] أكمل: حل (س − 1)(س − 4) > 0 هو س < 1 أو س > ___\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] حل: 6 − س − س² > 0.\nالإجابة النموذجية: −3 < س < 2\n3) [مستوى الاستدلال] حل: س² + 2س > 15.\nالإجابة النموذجية: (س + 5)(س − 3) > 0 ← س < −5 أو س > 3", "للطالب: تمارين 1-7: الأسئلة 1–4 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «حل المتباينات التربيعية بالقيم الحرجة والرسم».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=7"]}, {"ax": "متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل متباينة تربيعية قيمها الحرجة غير صحيحة باستخدام الصيغة التربيعية.\n2) يحل متباينات ناتجة عن شروط المميّز.\nمخرج تعليمي آخر: يحل نظامًا من متباينة خطية وأخرى تربيعية.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "القيم الحرجة الجذرية، متباينة المميّز، تقاطع مجموعتي الحل.", "يسأل: ما القيم الحرجة لـ س² − 2س − 1 < 0؟\nدور الطالب: يستخدم الصيغة: 1 ± √2.", "(5 د) التهيئة: المعلم: يسأل: ما القيم الحرجة لـ س² − 2س − 1 < 0؟ | الطالب: يستخدم الصيغة: 1 ± √2.\n(10 د) النمذجة: المعلم: ينمذج: س² − 2س − 1 < 0 ← 1 − √2 < س < 1 + √2؛ ثم: قيم ك التي تجعل س² + ك س + ك + 3 = 0 لها جذران حقيقيان ← ك² − 4ك − 12 ≥ 0 ← ك ≤ −2 أو ك ≥ 6. | الطالب: يتابع.\n(10 د) تعلم تعاوني: المعلم: يوزع نظامًا: س² − 5س + 4 < 0 و 2س − 5 > 0. | الطالب: تجد: 1 < س < 4 و س > 2.5 ← 2.5 < س < 4.\n(8 د) تقويم تكويني: المعلم: يكلف بسؤال متقدم من تمارين 1-7. | الطالب: يحل.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-7 ومحور «متباينات بقيم حرجة غير صحيحة وتطبيقات على شروط الجذور»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-7: الأسئلة 5–9. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] حل: س² − 2س − 1 < 0.\nالإجابة النموذجية: 1 − √2 < س < 1 + √2\n2) [مستوى التطبيق] أوجد قيم ك لكي يكون لـ س² + ك س + ك + 3 = 0 جذران حقيقيان.\nالإجابة النموذجية: ك ≤ −2 أو ك ≥ 6\n3) [مستوى الاستدلال] حل النظام: س² − 5س + 4 < 0، 2س − 5 > 0.\nالإجابة النموذجية: 2.5 < س < 4", "1) [مستوى المعرفة] أكمل: القيمتان الحرجتان لـ س² − 2س − 1 = 0 هما 1 ± ___\nالإجابة النموذجية: √2\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل ك س² + 2س + ك = 0 بلا جذور حقيقية (ك ≠ 0).\nالإجابة النموذجية: 4 − 4ك² < 0 ← ك < −1 أو ك > 1\n3) [مستوى الاستدلال] حل: س² ≥ 3، س < 5.\nالإجابة النموذجية: س ≤ −√3 أو √3 ≤ س < 5", "للطالب: تمارين 1-7: الأسئلة 5–9 (كتاب الطالب ص39–42، كتاب النشاط ص36–42).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=7"]}]}, {"id": "1-8", "title": "التقاطع بين المستقيم ومنحنى الدالة التربيعية", "p": [{"ax": "نقاط التقاطع وعددها باستخدام المميّز", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد نقاط تقاطع مستقيم ومنحنى تربيعي.\n2) يحدد عدد نقاط التقاطع بالمميّز.\nمخرج تعليمي آخر: يميّز المماس من القاطع.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "القاطع، المماس، نقطة التماس، المميّز، عدد نقاط التقاطع.", "يعرض على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟\nدور الطالب: يلاحظ وجود قيمتين للميل يحدث عندهما التماس.", "(5 د) التهيئة: المعلم: يعرض على GeoGebra منحنى ص = س² + 1 ومستقيمًا ص = ك س يتحرك ميله، ويسأل: متى يمس المستقيم المنحنى؟ | الطالب: يلاحظ وجود قيمتين للميل يحدث عندهما التماس.\n(10 د) النمذجة: المعلم: ينمذج: ص = س² − 3س + 4، ص = س + 1 ← س² − 4س + 3 = 0 ← (1، 2) و (3، 4)؛ ثم ص = 2س − 1 مع ص = س² ← (س − 1)² = 0 مماس عند (1، 1). | الطالب: يتابع.\n(10 د) تطبيق موجّه: المعلم: يكلف بتحديد عدد نقاط تقاطع ص = 3س − 5 مع ص = س² + س − 2 بالمميّز. | الطالب: س² − 2س + 3 = 0، المميّز −8 < 0، لا تقاطع.\n(8 د) تقويم تكويني: المعلم: يطلب تصنيف ثلاثة أزواج (قاطع، مماس، لا يقطع). | الطالب: يصنف بالمميّز.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-8: الأسئلة 1–4. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] أوجد تقاطع ص = س² − 3س + 4 و ص = س + 1.\nالإجابة النموذجية: (1، 2) و (3، 4)\n2) [مستوى التطبيق] بيّن أن ص = 2س − 1 مماس لـ ص = س².\nالإجابة النموذجية: س² − 2س + 1 = 0، المميّز 0\n3) [مستوى الاستدلال] كم نقطة تقاطع بين ص = 3س − 5 و ص = س² + س − 2؟\nالإجابة النموذجية: لا توجد؛ المميّز −8", "1) [مستوى المعرفة] أكمل: إذا كان المميّز صفرًا فالمستقيم ___ للمنحنى.\nالإجابة النموذجية: مماس\n2) [مستوى التطبيق] أوجد تقاطع ص = 2س + 3 و ص = س² − 2س + 3.\nالإجابة النموذجية: س² − 4س = 0 ← (0، 3) و (4، 11)\n3) [مستوى الاستدلال] أوجد نقطة تماس ص = 4س − 4 مع ص = س².\nالإجابة النموذجية: (2، 4)", "للطالب: تمارين 1-8: الأسئلة 1–4 (كتاب الطالب ص43–46، ومراجعة الوحدة ص47–50، كتاب النشاط ص43–45، ومراجعة الوحدة ص46–52).\nلولي الأمر: متابعة تقدم الابن/الابنة في «نقاط التقاطع وعددها باستخدام المميّز» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=8"]}, {"ax": "إيجاد قيم ثابت بشرط التماس أو التقاطع ومراجعة الوحدة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجد قيم الثابت التي تجعل المستقيم مماسًا للمنحنى.\n2) يجد مدى قيم الثابت لعدد معين من نقاط التقاطع.\nمخرج تعليمي آخر: يربط مفاهيم الوحدة الأولى في حل مسائل المراجعة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "شرط التماس، شرط التقاطع، المتباينة في الثابت، مراجعة الوحدة.", "يسأل: ص = ك س − 3 يمس ص = س² + 1، ما المعادلة الناتجة في س؟\nدور الطالب: يكتب س² − ك س + 4 = 0.", "(5 د) التهيئة: المعلم: يسأل: ص = ك س − 3 يمس ص = س² + 1، ما المعادلة الناتجة في س؟ | الطالب: يكتب س² − ك س + 4 = 0.\n(10 د) النمذجة: المعلم: ينمذج: ك² − 16 = 0 ← ك = ±4، ونقطتا التماس (2، 5) و (−2، 5). | الطالب: يتابع ويتحقق.\n(10 د) تعلم تعاوني: المعلم: يوزع: ص = س + ك يقطع ص = 2س² − 3س + 4 في نقطتين؛ وأسئلة من مراجعة نهاية الوحدة ص47–50. | الطالب: تحل: 2س² − 4س + 4 − ك = 0 ← 16 − 8(4 − ك) > 0 ← ك > 2.\n(8 د) تقويم تكويني: المعلم: يقدم بطاقة «أستطيع أن...» لمفاهيم الوحدة. | الطالب: يقيم نفسه.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-8 ومحور «إيجاد قيم ثابت بشرط التماس أو التقاطع ومراجعة الوحدة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-8: الأسئلة 5–9، وتمارين مراجعة نهاية الوحدة ص47–50. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] أوجد ك إذا كان ص = ك س − 3 مماسًا لـ ص = س² + 1.\nالإجابة النموذجية: ك = ±4\n2) [مستوى التطبيق] أوجد قيم ك لكي يقطع ص = س + ك المنحنى ص = 2س² − 3س + 4 في نقطتين.\nالإجابة النموذجية: ك > 2\n3) [مستوى الاستدلال] أوجد نقطة التماس عندما ك = 4.\nالإجابة النموذجية: س² − 4س + 4 = 0 ← (2، 5)", "1) [مستوى المعرفة] أكمل: شرط أن يقطع المستقيم المنحنى في نقطتين هو المميّز ___ 0\nالإجابة النموذجية: >\n2) [مستوى التطبيق] أوجد ك إذا كان ص = 2س + ك مماسًا لـ ص = س² − 4س + 3.\nالإجابة النموذجية: س² − 6س + 3 − ك = 0 ← 36 − 4(3 − ك) = 0 ← ك = −6\n3) [مستوى الاستدلال] أوجد قيم م لكي لا يقطع ص = م س المنحنى ص = س² + 9.\nالإجابة النموذجية: م² − 36 < 0 ← −6 < م < 6", "للطالب: تمارين 1-8: الأسئلة 5–9، وتمارين مراجعة نهاية الوحدة ص47–50 (كتاب الطالب ص43–46، ومراجعة الوحدة ص47–50، كتاب النشاط ص43–45، ومراجعة الوحدة ص46–52).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=8"]}]}, {"id": "2-1", "title": "تعريف الدالة", "p": [{"ax": "الدالة وأنواع التطابق والمجال والمدى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يميّز الدالة باستخدام المخطط السهمي واختبار المستقيم الرأسي.\n2) يصنف الدوال: واحد إلى واحد، متعدد إلى واحد.\nمخرج تعليمي آخر: يستخدم الرمز د: س ↦ ... ويحسب الصور.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات منحنيات", "الدالة، المجال، المجال المقابل، المدى، واحد إلى واحد، متعدد إلى واحد، اختبار المستقيم الرأسي والأفقي.", "يسأل: هل كل علاقة دالة؟ يعرض علاقة «الطالب ← أرقام هواتف أقاربه» ويناقش.\nدور الطالب: يستنتج شرط الصورة الوحيدة.", "(5 د) التهيئة: المعلم: يسأل: هل كل علاقة دالة؟ يعرض علاقة «الطالب ← أرقام هواتف أقاربه» ويناقش. | الطالب: يستنتج شرط الصورة الوحيدة.\n(10 د) النمذجة: المعلم: يعرّف الدالة والمجال والمدى، ويعرض أمثلة بمخططات سهمية ومنحنيات، ويطبق اختبار المستقيم الرأسي والأفقي. | الطالب: يصنف الأمثلة.\n(10 د) تعلم تعاوني: المعلم: يوزع بطاقات منحنيات (قطع مكافئ، دائرة، مستقيم، س = ص²) لتصنيفها. | الطالب: تصنف المجموعة وتبرر.\n(8 د) تقويم تكويني: المعلم: يطرح: د: س ↦ 3 − 2س، أوجد د(−1) و د(1/2). | الطالب: يحسب: 5 و 2.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: الأسئلة 1–4. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] هل المنحنى س = ص² يمثل ص دالة في س؟\nالإجابة النموذجية: لا؛ المستقيم س = 4 يقطعه في نقطتين.\n2) [مستوى التطبيق] صنف الدالة د(س) = س³.\nالإجابة النموذجية: واحد إلى واحد\n3) [مستوى الاستدلال] أوجد د(3) إذا كان د: س ↦ س² − 2س.\nالإجابة النموذجية: 3", "1) [مستوى المعرفة] أكمل: الدالة التي تحقق اختبار المستقيم الأفقي تسمى ___\nالإجابة النموذجية: واحدًا إلى واحد\n2) [مستوى التطبيق] صنف د(س) = (س − 1)²، س ∈ ح.\nالإجابة النموذجية: متعدد إلى واحد\n3) [مستوى الاستدلال] أوجد قيم س التي تجعل د(س) = 8 حيث د(س) = س² − 2س.\nالإجابة النموذجية: س² − 2س − 8 = 0 ← س = 4 أو −2", "للطالب: تمارين 2-1: الأسئلة 1–4 (كتاب الطالب ص51–56، كتاب النشاط ص53–58).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الدالة وأنواع التطابق والمجال والمدى».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=9"]}, {"ax": "مدى الدوال ذات المجال المحدد باستخدام الإكمال إلى مربع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحدد مدى دالة خطية ذات مجال محدد.\n2) يستخدم الإكمال إلى مربع لتحديد مدى دالة تربيعية ذات مجال محدد.\nمخرج تعليمي آخر: يحدد مجال ومدى دوال نسبية وجذرية بسيطة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المجال المحدد، المدى، القيمة الصغرى داخل المجال، الدالة النسبية، الدالة الجذرية.", "يسأل: ما أصغر قيمة لـ (س − 2)² + 3؟ وهل تتغير الإجابة إذا كان المجال 3 ≤ س ≤ 5؟\nدور الطالب: يلاحظ أن الرأس قد يقع خارج المجال.", "(5 د) التهيئة: المعلم: يسأل: ما أصغر قيمة لـ (س − 2)² + 3؟ وهل تتغير الإجابة إذا كان المجال 3 ≤ س ≤ 5؟ | الطالب: يلاحظ أن الرأس قد يقع خارج المجال.\n(10 د) النمذجة: المعلم: ينمذج: د(س) = س² − 4س + 7، 0 ≤ س ≤ 5 ← (س − 2)² + 3 ← المدى 3 ≤ د(س) ≤ 12؛ وعندما 3 ≤ س ≤ 5 ← 4 ≤ د(س) ≤ 12. | الطالب: يرسم ويقرأ المدى.\n(10 د) تعلم تعاوني: المعلم: يوزع: د(س) = 2س − 1، 1 ≤ س ≤ 4؛ هـ(س) = 1 ÷ (س − 3)؛ ك(س) = √(2س − 4) + 1. | الطالب: تجد: 1 ≤ د ≤ 7؛ مجال هـ س ≠ 3 ومداها هـ ≠ 0؛ مجال ك س ≥ 2 ومداها ك ≥ 1.\n(8 د) تقويم تكويني: المعلم: يطلب مدى د(س) = 5 − (س + 1)²، −3 ≤ س ≤ 1. | الطالب: المدى 1 ≤ د(س) ≤ 5.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 2-1 ومحور «مدى الدوال ذات المجال المحدد باستخدام /10/2026م)", "f": ["1) يصف أثر ص = −د(س) (انعكاس في المحور السيني).\n2) يصف أثر ص = د(−س) (انعكاس في المحور الصادي).\nمخرج تعليمي آخر: يكتب معادلة المنحنى بعد الانعكاس.", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "الانعكاس، المحور السيني، المحور الصادي، ص = −د(س)، ص = د(−س).", "يعرض ص = √س و ص = −√س و ص = √(−س) ويسأل: أين تقع كل صورة؟\nدور الطالب: يميز الانعكاسين.", "(5 د) التهيئة: المعلم: يعرض ص = √س و ص = −√س و ص = √(−س) ويسأل: أين تقع كل صورة؟ | الطالب: يميز الانعكاسين.\n(10 د) اكتشاف: المعلم: يطلب جدول قيم لـ ص = −(س² − 4س) و ص = (−س)² − 4(−س) ومقارنتها بالأصل. | الطالب: يكتشف أثر كل تحويل على النقاط.\n(10 د) النمذجة: المعلم: ينمذج: انعكاس ص = س² − 4س في المحور الصادي ← ص = س² + 4س؛ وفي المحور السيني ← ص = −س² + 4س. | الطالب: يتابع ويحدد صورة الرأس.\n(8 د) تقويم تكويني: المعلم: يطلب صورة (2، −4) في كل انعكاس. | الطالب: في السيني (2، 4) وفي الصادي (−2، −4).\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-5ب: الأسئلة 1–3. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] اكتب معادلة ص = √س بعد الانعكاس في المحور السيني.\nالإجابة النموذجية: ص = −√س\n2) [مستوى التطبيق] اكتب ص = س³ + 1 بعد الانعكاس في المحور الصادي.\nالإجابة النموذجية: ص = −س³ + 1\n3) [مستوى الاستدلال] صورة (2، −4) بالانعكاس في المحور الصادي؟\nالإجابة النموذجية: (−2، −4)", "1) [مستوى المعرفة] أكمل: ص = −د(س) انعكاس في المحور ___\nالإجابة النموذجية: السيني\n2) [مستوى التطبيق] اكتب ص = س² − 4س بعد الانعكاس في المحور الصادي.\nالإجابة النموذجية: ص = س² + 4س\n3) [مستوى الاستدلال] ما الدالة التي لا تتغير بالانعكاس في المحور الصادي من بين: س²، س³؟\nالإج ف تحويل ص = س² إلى ص = 3 − س².\nالإجابة النموذجية: انعكاس في المحور السيني ثم انسحاب 3 للأعلى\n2) [مستوى التطبيق] اكتب ص = √س بعد انعكاس في الصادي ثم انسحاب وحدتين للأعلى.\nالإجابة النموذجية: ص = √(−س) + 2\n3) [مستوى الاستدلال] رأس ص = −(س − 2)² + 1؟\nالإجابة النموذجية: (2، 1) عظمى", "1) [مستوى المعرفة] أكمل: ص = −س² + 5 هي انعكاس ص = س² في المحور السيني ثم انسحاب ___ وحدات للأعلى.\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] صف تحويل ص = س³ إلى ص = −س³ − 1.\nالإجابة النموذجية: انعكاس في السيني (أو الصادي) ثم انسحاب 1 للأسفل\n3) [مستوى الاستدلال] اكتب ص = 1 ÷ س بعد الانعكاس في السيني ثم الانسحاب (2، 0).\nالإجابة النموذجية: ص = −1 ÷ (س − 2)", "للطالب: تمارين 2-5ب: الأسئلة 4–6 (كتاب الطالب ص75–76، كتاب النشاط ص73–75).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «دمج الانعكاس مع الانسحاب» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=14"]}]}, {"id": "2-5ج", "title": "التحويلات الهندسية للدوال: التمدد", "p": [{"ax": "التمدد الرأسي ص = أ د(س)", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف التمدد الرأسي بمعامل أ.\n2) يجد صور النقاط بالتمدد الرأسي.\nمخرج تعليمي آخر: يكتب معادلة المنحنى بعد تمدد رأسي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "التمدد الرأسي، معامل التمدد، المحور الثابت (السيني)، ص = أ د(س).", "يعرض ص = س² و ص = 3س² ويسأل: ماذا حدث لارتفاع كل نقطة؟\nدور الطالب: يلاحظ تضاعف الإحداثي الصادي 3 مرات.", "(5 د) التهيئة: المعلم: يعرض ص = س² و ص = 3س² ويسأل: ماذا حدث لارتفاع كل نقطة؟ | الطالب: يلاحظ تضاعف الإحداثي الصادي 3 مرات.\n(10 د) اكتشاف: المعلم: يتيح تحريك المنزلق أ في ص = أ د(س) على GeoGebra. | الطالب: يسجل أثر أ > 1 و 0 < أ < 1.\n(10 د) النمذجة: المعلم: ينمذج: ص = 2(س² − 4) تمدد رأسي لـ ص = س² − 4 بمعامل 2؛ صورة (3، 5) هي (3، 10)، والمقاطع السينية ثابتة. | الطالب: يتابع.\n(8 د) تقويم تكويني: المعلم: يسأل: لماذا لا تتغير المقاطع السينية بالتمدد الرأسي؟ | الطالب: لأن ص = 0 تبقى صفرًا.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-5ج: الأسئلة 1–3. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] صف تحويل ص = س² إلى ص = 3س².\nالإجابة النموذجية: تمدد رأسي بمعامل 3\n2) [مستوى التطبيق] صورة (2، 4) بتمدد رأسي معامله 1/2؟\nالإجابة النموذجية: (2، 2)\n3) [مستوى الاستدلال] اكتب ص = √س بعد تمدد رأسي معامله 4.\nالإجابة النموذجية: ص = 4√س", "1) [مستوى المعرفة] أكمل: ص = أ د(س) تمدد رأسي بمعامل ___\nالإجابة النموذجية: أ\n2) [مستوى التطبيق] صف تحويل ص = س³ إلى ص = 0.5س³.\nالإجابة النموذجية: تمدد رأسي بمعامل 0.5\n3) [مستوى الاستدلال] هل تتغير المقاطع السينية لـ ص = س² − 4 بالتمدد الرأسي؟\nالإجابة النموذجية: لا، تبقى ±2", "للطالب: تمارين 2-5ج: الأسئلة 1–3 (كتاب الطالب ص77–79، كتاب النشاط ص76–79).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «التمدد الرأسي ص = أ د(س)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=15"]}, {"ax": "التمدد الأفقي ص = د(أس)", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف التمدد الأفقي بمعامل 1/أ.\n2) يجد صور النقاط بالتمدد الأفقي.\nمخرج تعليمي آخر: يميّز بين التمدد الأفقي والرأسي من المعادلة.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات معادلات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التمدد الأفقي، المعامل 1/أ، المحور الثابت (الصادي)، ص = د(أس).", "يعرض ص = س² − 4 و ص = (2س)² − 4 ويسأل: أين أصبحت المقاطع السينية؟\nدور الطالب: يجد ±1 بدل ±2.", "(5 د) التهيئة: المعلم: يعرض ص = س² − 4 و ص = (2س)² − 4 ويسأل: أين أصبحت المقاطع السينية؟ | الطالب: يجد ±1 بدل ±2.\n(10 د) النمذجة: المعلم: ينمذج: ص = د(2س) تمدد أفقي معامله 1/2؛ صورة (4، د(4)) هي (2، د(4)). | الطالب: يتابع ويطبق.\n(10 د) تعلم تعاوني: المعلم: يوزع بطاقات معادلات لتمييز نوع التمدد ومعامله. | الطالب: تصنف المجموعة.\n(8 د) تقويم تكويني: المعلم: يطلب صورة (6، 3) بالتمدد ص = د(3س). | الطالب: (2، 3).\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 2-5ج ومحور «التمدد الأفقي ص = د(أس)»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-5ج: الأسئلة 4–6. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] صف تحويل ص = د(س) إلى ص = د(2س).\nالإجابة النموذجية: تمدد أفقي بمعامل 1/2\n2) [مستوى التطبيق] صورة (6، 3) بالتحويل ص = د(3س)؟\nالإجابة النموذجية: (2، 3)\n3) [مستوى الاستدلال] صف تحويل ص = √س إلى ص = √(س ÷ 2).\nالإجابة النموذجية: تمدد أفقي بمعامل 2", "1) [مستوى المعرفة] أكمل: ص = د(أس) تمدد أفقي بمعامل ___\nالإجابة النموذجية: 1/أ\n2) [مستوى التطبيق] أين تصبح المقاطع السينية لـ ص = س² − 9 بعد التحويل ص = (3س)² − 9؟\nالإجابة النموذجية: ±1\n3) [مستوى الاستدلال] ميّز: ص = 2د(س) و ص = د(2س).\nالإجابة النموذجية: الأول تمدد رأسي بمعامل 2، والثاني أفقي بمعامل 1/2", "للطالب: تمارين 2-5ج: الأسئلة 4–6 (كتاب الطالب ص77–79، كتاب النشاط ص76–79).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=15"]}]}, {"id": "2-6", "title": "تركيب التحويلات الهندسية", "p": [{"ax": "ترتيب التحويلات وأثره على المعادلة", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يطبق تحويلين أو أكثر بترتيب معين ويكتب المعادلة الناتجة.\n2) يبين أثر ترتيب التحويلات على الناتج.\nمخرج تعليمي آخر: يجد صورة نقطة تحت تحويلات متتالية.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "تركيب التحويلات، الترتيب، ص = أ د(س) + ب، ص = أ(د(س) + ب).", "يسأل: هل «تمدد بمعامل 2 ثم انسحاب 3 للأعلى» يعطي النتيجة نفسها لـ «انسحاب 3 ثم تمدد 2»؟\nدور الطالب: يجرب على نقطة ويقارن.", "(5 د) التهيئة: المعلم: يسأل: هل «تمدد بمعامل 2 ثم انسحاب 3 للأعلى» يعطي النتيجة نفسها لـ «انسحاب 3 ثم تمدد 2»؟ | الطالب: يجرب على نقطة ويقارن.\n(10 د) النمذجة: المعلم: ينمذج: تمدد 2 ثم انسحاب (0، 3) ← ص = 2د(س) + 3؛ أما انسحاب ثم تمدد ← ص = 2د(س) + 6. | الطالب: يقارن صورة النقطة (1، 1) في الحالتين.\n(10 د) تعلم تعاوني: المعلم: يوزع سلاسل تحويلات على المجموعات لكتابة المعادلة الناتجة لـ ص = س². | الطالب: تكتب المجموعة المعادلات وتتحقق.\n(8 د) تقويم تكويني: المعلم: يطلب صورة (2، 4) على ص = س² بالتحويل ص = 3(س − 1)² + 2. | الطالب: (3، 14).\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-6: الأسئلة 1–4. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] اكتب ص = س² بعد تمدد رأسي 2 ثم انسحاب (0، 3).\nالإجابة النموذجية: ص = 2س² + 3\n2) [مستوى التطبيق] اكتبها بعد انسحاب (0، 3) ثم تمدد رأسي 2.\nالإجابة النموذجية: ص = 2س² + 6\n3) [مستوى الاستدلال] صورة (2، 4) بالتحويل ص = 3(س − 1)² + 2؟\nالإجابة النموذجية: (3، 14)", "1) [مستوى المعرفة] أكمل: ترتيب التحويلات ___ على المعادلة الناتجة.\nالإجابة النموذجية: يؤثر\n2) [مستوى التطبيق] اكتب ص = √س بعد انعكاس في السيني ثم انسحاب (1، 2).\nالإجابة النموذجية: ص = −√(س − 1) + 2\n3) [مستوى الاستدلال] صورة (1، 1) على ص = س² بالتحويل ص = −2(س + 3)² + 4؟\nالإجابة النموذجية: (−2، 2)", "للطالب: تمارين 2-6: الأسئلة 1–4 (كتاب الطالب ص80–87، ومراجعة الوحدة ص88–92، كتاب النشاط ص80–85، ومراجعة الوحدة ص86–89).\nلولي الأمر: متابعة تقدم الابن/الابنة في «ترتيب التحويلات وأثره على المعادلة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=16"]}, {"ax": "وصف تسلسل التحويلات بين منحنيين ومراجعة الوحدة", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يصف تسلسل التحويلات التي تحول منحنى إلى آخر.\n2) يستخدم الإكمال إلى مربع لوصف التحويلات.\nمخرج تعليمي آخر: يقيم أوصاف تحويلات مقترحة ويصحح الخاطئ منها.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "وصف التحويلات، الإكمال إلى مربع، التحقق بالنقاط، مراجعة الوحدة.", "يكتب ص = 2س² − 12س + 13 ويسأل: كيف نحصل عليها من ص = س²؟\nدور الطالب: يقترح الإكمال إلى مربع أولًا.", "(5 د) التهيئة: المعلم: يكتب ص = 2س² − 12س + 13 ويسأل: كيف نحصل عليها من ص = س²؟ | الطالب: يقترح الإكمال إلى مربع أولًا.\n(10 د) النمذجة: المعلم: ينمذج: 2س² − 12س + 13 = 2(س − 3)² − 5 ← انسحاب (3، 0)، تمدد رأسي 2، انسحاب (0، −5). | الطالب: يتابع ويتحقق.\n(10 د) تعلم تعاوني: المعلم: يوزع أسئلة من مراجعة نهاية الوحدة ص88–92 على المجموعات. | الطالب: تحل المجموعة وتعرض.\n(8 د) تقويم تكويني: المعلم: يعرض وصفًا خاطئًا ويطلب تصحيحه. | الطالب: يصحح ويبرر.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 2-6 ومحور «وصف تسلسل التحويلات بين منحنيين ومراجعة الوحدة»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-6: الأسئلة 5–8، وتمارين مراجعة نهاية الوحدة ص88–92. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] صف تحويل ص = س² إلى ص = 2(س − 3)² − 5.\nالإجابة النموذجية: انسحاب 3 لليمين، تمدد رأسي 2، انسحاب 5 للأسفل\n2) [مستوى التطبيق] اكتب 2س² − 12س + 13 بصورة أ(س − ف)² + ك.\nالإجابة النموذجية: 2(س − 3)² − 5\n3) [مستوى الاستدلال] صف تحويل ص = س² إلى ص = −(س + 1)² + 4.\nالإجابة النموذجية: انسحاب 1 لليسار، انعكاس في السيني، انسحاب 4 للأعلى", "1) [مستوى المعرفة] أكمل: لوصف التحويلات لدالة تربيعية نكتبها أولًا بصورة ___\nالإجابة النموذجية: الإكمال إلى مربع\n2) [مستوى التطبيق] صف تحويل ص = س² إلى ص = 3س² + 6س + 1.\nالإجابة النموذجية: 3(س + 1)² − 2: انسحاب 1 لليسار، تمدد رأسي 3، انسحاب 2 للأسفل\n3) [مستوى الاستدلال] اكتب معادلة صورة ص = 1 ÷ س بتمدد أفقي 1/2 ثم انسحاب (0، 1).\nالإجابة النموذجية: ص = 1 ÷ (2س) + 1", "للطالب: تمارين 2-6: الأسئلة 5–8، وتمارين مراجعة نهاية الوحدة ص88–92 (كتاب الطالب ص80–87، ومراجعة الوحدة ص88–92، كتاب النشاط ص80–85، ومراجعة الوحدة ص86–89).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=16"]}]}, {"id": "3-1", "title": "المتتاليات الحسابية", "p": [{"ax": "الحد العام للمتتالية الحسابية وعدد الحدود", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يجد الحد العام حن = أ + (ن − 1)د لمتتالية حسابية.\n2) يجد عدد حدود متتالية حسابية منتهية.\nمخرج تعليمي آخر: يجد أ و د من حدين معلومين.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتتالية الحسابية، الحد الأول أ، الأساس د، الحد العام حن، عدد الحدود.", "يعرض 7، 11، 15، ... ويسأل: ما الحد المئة دون كتابة الحدود؟\nدور الطالب: يبحث عن قاعدة عامة.", "(5 د) التهيئة: المعلم: يعرض 7، 11، 15، ... ويسأل: ما الحد المئة دون كتابة الحدود؟ | الطالب: يبحث عن قاعدة عامة.\n(10 د) استكشاف: المعلم: يوزع نشاط «استكشف 1» ص93 لاستنتاج قاعدة الحد العام من أنماط. | الطالب: يستنتج حن = أ + (ن − 1)د.\n(10 د) النمذجة: المعلم: ينمذج: ح100 في 7، 11، 15 = 7 + 99 × 4 = 403؛ عدد حدود 5، 8، ...، 302 = 100؛ ح4 = 17 و ح9 = 42 ← د = 5، أ = 2. | الطالب: يطبق أمثلة مشابهة.\n(8 د) تقويم تكويني: المعلم: يطرح: هل 500 حد في 7، 11، 15، ...؟ | الطالب: 4ن + 3 = 500 ← ن غير صحيح، فلا.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-1: الأسئلة 1–6. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] ح20 في 3، 9، 15، ...؟\nالإجابة النموذجية: 3 + 19 × 6 = 117\n2) [مستوى التطبيق] عدد حدود 5، 8، ...، 302؟\nالإجابة النموذجية: (302 − 5) ÷ 3 + 1 = 100\n3) [مستوى الاستدلال] ح4 = 17، ح9 = 42. أوجد أ و د.\nالإجابة النموذجية: د = 5، أ = 2", "1) [مستوى المعرفة] أكمل: حن = أ + (___)د\nالإجابة النموذجية: ن − 1\n2) [مستوى التطبيق] ح3 = 20، ح10 = −1. أوجد ح15.\nالإجابة النموذجية: د = −3، أ = 26، ح15 = −16\n3) [مستوى الاستدلال] أول حد سالب في 100، 93، 86، ...؟\nالإجابة النموذجية: 100 − 7(ن − 1) < 0 ← ن ≥ 16، ح16 = −5", "للطالب: تمارين 3-1: الأسئلة 1–6 (كتاب الطالب ص93–98، كتاب النشاط ص90–93).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الحد العام للمتتالية الحسابية وعدد الحدود».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=17"]}, {"ax": "مجموع المتسلسلة الحسابية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يبرهن صيغة مجموع أول ن حدًا من متسلسلة حسابية.\n2) يستخدم صيغتي جن.\nمخرج تعليمي آخر: يجد ن عند معرفة المجموع بحل معادلة تربيعية.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتسلسلة الحسابية، جن = ن ÷ 2 [2أ + (ن − 1)د] = ن ÷ 2 (أ + ل)، عدد الحدود المجهول.", "يسأل عن مجموع 1 + 2 + ... + 100 ويقدم فكرة الجمع المعكوس.\nدور الطالب: يجد 5050.", "(5 د) ال  النمذجة: المعلم: ينمذج الوسط من جدول تكراري: س = 1، 2، 3، 4 و ت = 3، 5، ك، 2، والوسط 2.4 ← (3 + 10 + 3ك + 8) ÷ (10 + ك) = 2.4 ← 21 + 3ك = 24 + 2.4ك ← ك = 5. | الطالب: يتابع.\n(10 د) تطبيق موجّه: المعلم: يطلب وسط بيانات معطاة بالملخصات: ن = 25، ∑س = 1150. | الطالب: الوسط 46.\n(8 د) تقويم تكويني: المعلم: يسأل: أضيف لاعب عمره 30 لمجموعة من 6 وسطها 24. الوسط الجديد؟ | الطالب: (144 + 30) ÷ 7 ≈ 24.9.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 1–5. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى المعرفة] ن = 25، ∑س = 1150. الوسط؟\nالإجابة النموذجية: 46\n2) [مستوى التطبيق] س = 1، 2، 3، 4 و ت = 3، 5، ك، 2، الوسط 2.4. أوجد ك.\nالإجابة النموذجية: ك = 5\n3) [مستوى الاستدلال] أضيف 30 لمجموعة من 6 وسطها 24. الوسط الجديد؟\nالإجابة النموذجية: ≈ 24.9", "1) [مستوى المعرفة] أكمل: الوسط من الجدول التكراري = ∑(ت س) ÷ ___\nالإجابة النموذجية: ∑ت\n2) [مستوى التطبيق] وسط 8 قيم 15، حذفت قيمة فأصبح الوسط 14. ما القيمة المحذوفة؟\nالإجابة النموذجية: 120 − 98 = 22\n3) [مستوى الاستدلال] س = 0، 1، 2 و ت = 4، ك، 6، الوسط 1.1. أوجد ك.\nالإجابة النموذجية: (ك + 12) ÷ (10 + ك) = 1.1 ← ك = 10", "للطالب: تمارين 4-1: الأسئلة 1–5 (كتاب الطالب ص117–125، كتاب النشاط ص107–110).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الوسط الحسابي ورمز المجموع للبيانات المفردة والتكرارية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/advmath/?l=21"]}, {"ax": "الوسط الحسابي للبيانات المشفّرة", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يحسب الوسط باستخدام البيانات المشفرة: الوسط = ب + ∑(س − ب) ÷ ن.\n2) يفسر فائدة التشفير في تبسيط الحسابات.\nمخرج تعليمي آخر: يحول بين ملخصات مشفرة وغير مشفرة.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "-
