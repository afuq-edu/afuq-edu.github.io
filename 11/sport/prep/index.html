يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما القيادة؟\nالإجابة: تأثير وتحريك الأفراد لتحقيق الأهداف.\nس2 (المستوى المتوقع): ما التنسيق؟\nالإجابة: الترتيب المنظم للمجهود الجماعي.\nس3 (المستوى المتقدم): ما الرقابة؟\nالإجابة: التحقق من سير العمل وفق الخطة وتصحيح الأخطاء.", "التقويم الختامي": "س1 (مستوى الدعم): صنف: اكتشاف تأخر الحكام وتصحيحه.\nالإجابة: رقابة.\nس2 (المستوى المتوقع): اذكر الوظائف الخمس.\nالإجابة: التخطيط، التنظيم، القيادة، التنسيق، الرقابة.\nس3 (المستوى المتقدم): اقترح أسلوب رقابة لبطولة.\nالإجابة: قائمة تحقق يومية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك وظائف الإدارة بأمثلة."}}, {"focus": "مبادئ الإدارة الرياضية (الشمول، التكامل، المستقبلية) والإعلام والعلاقات العامة", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف مبادئ الإدارة الرياضية.\n2. يفسر دور الإعلام الرياضي والعلاقات العامة.\n3. يصمم رسالة إعلامية لنشاط مدرسي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- الكتاب\n- أخرى: نماذج ملصقات", "المفاهيم": "- الشمول\n- التكامل\n- المستقبلية\n- الإعلام الرياضي\n- العلاقات العامة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف يعرف الطلبة بموعد البطولة؟ (ص 81-82).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المبادئ والإعلام والعلاقات العامة.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصمم رسالة إعلامية (ملصق أو إذاعة) لبطولة الصف.\n- الطالب: يصمم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض ونقد.\n- الطالب: يقيّم.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما مبدأ الشمول؟\nالإجابة: إدارة كل جوانب العمل في الهيئة الرياضية.\nس2 (المستوى المتوقع): ما المستقبلية؟\nالإجابة: العمل للمستقبل بأهداف وتطلعات.\nس3 (المستوى المتقدم): ما دور الإعلام الرياضي؟\nالإجابة: تنوير المجتمع الرياضي وإحداث التغيير المنشود.", "التقويم الختامي": "س1 (مستوى الدعم): اعرض رسالة مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): كيف تخدم العلاقات العامة النشاط المدرسي؟\nالإجابة: بالتواصل مع أولياء الأمور والمجتمع.\nس3 (المستوى المتقدم): ما مبدأ التكامل؟\nالإجابة: تولي كل قسم جانبًا من التنظيم في نسق واحد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على إعداد ملصق لنشاط رياضي."}}, {"focus": "تطبيق: تخطيط فعالية رياضية مدرسية بوظائف الإدارة", "num": 5, "fields": {"المخرجات التعليمية": "1. يطبق وظائف الإدارة الخمس في تخطيط فعالية رياضية.\n2. يوزع الأدوار ويحدد أدوات الرقابة.\n3. يقيم خطط المجموعات الأخرى.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: نماذج خطط\n- أخرى: بطاقات الأدوار", "المفاهيم": "- الفعالية\n- الخطة\n- الأدوار\n- الرقابة", "التهيئة / التمهيد / التعلم القبلي": "يكلف المعلم كل مجموعة بتخطيط فعالية (يوم رياضي، بطولة قصيرة، مهرجان).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (24 دقائق):\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: مشروع مصغر: تضع كل مجموعة خطة فعالية كاملة (أهداف، تنظيم، قيادة، تنسيق، رقابة، إعلام) على نموذج.\n- الطالب: يخطط.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: عرض الخطط وتقييم الأقران ببطاقة.\n- الطالب: يعرض ويقيّم.\n\nالنشاط 4 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الهدف من فعاليتكم؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف ستتابعون التنفيذ؟\nالإجابة: بأداة رقابة.\nس3 (المستوى المتقدم): من القائد وما دوره؟\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): اعرض خطة مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ما نقطة القوة في خطة المجموعة الأخرى؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي تحتاج إليه خطتكم؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على طرق تنظيم المسابقات (دليل المعلم ص 84)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم الإدارة الرياضية.\n2. يفسر أهميتها للعاملين في المجال الرياضي.\n3. يقدر دور الإدارة في نجاح المؤسسات الرياضية.\n\nالحصة 2:\n1. يتعرف وظيفتي التخطيط والتنظيم.\n2. يميز بين التخطيط (الأهداف والخطوات) والتنظيم (توزيع المهام).\n3. يضع خطة مبسطة لنشاط رياضي.\n\nالحصة 3:\n1. يتعرف وظائف القيادة والتنسيق والرقابة.\n2. يميز كل وظيفة بمثال من الرياضة المدرسية.\n3. يقترح أسلوب رقابة لنشاط مدرسي.\n\nالحصة 4:\n1. يتعرف مبادئ الإدارة الرياضية.\n2. يفسر دور الإعلام الرياضي والعلاقات العامة.\n3. يصمم رسالة إعلامية لنشاط مدرسي.\n\nالحصة 5:\n1. يطبق وظائف الإدارة الخمس في تخطيط فعالية رياضية.\n2. يوزع الأدوار ويحدد أدوات الرقابة.\n3. يقيم خطط المجموعات الأخرى.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: إبداع\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- جهاز عرض البيانات\n- السبورة الذكية\n- الكتاب\n\nالحصة 2:\n- السبورة الذكية\n- أخرى: نماذج خطط\n- الكتاب\n\nالحصة 3:\n- السبورة الذكية\n- الكتاب\n- أخرى: بطاقات الوظائف\n\nالحصة 4:\n- السبورة الذكية\n- الكتاب\n- أخرى: نماذج ملصقات\n\nالحصة 5:\n- السبورة الذكية\n- أخرى: نماذج خ لم: تلخيص.\n- الطالب: يلخص.\n\nالحصة 3:\nالنشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الوظائف الثلاث.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصنف مواقف إلى الوظائف الخمس وتعرض.\n- الطالب: يصنف.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: استنتاج علاقة الوظائف ببعضها.\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.\n\nالحصة 4:\nالنشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المبادئ والإعلام والعلاقات العامة.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصمم رسالة إعلامية (ملصق أو إذاعة) لبطولة الصف.\n- الطالب: يصمم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض ونقد.\n- الطالب: يقيّم.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.\n\nالحصة 5:\nالنشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (24 دقائق):\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: مشروع مصغر: تضع كل مجموعة خطة فعالية كاملة (أهداف، تنظيم، قيادة، تنسيق، رقابة، إعلام) على نموذج.\n- الطالب: يخطط.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: عرض الخطط وتقييم الأقران ببطاقة.\n- الطالب: يعرض ويقيّم.\n\nالنشاط 4 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الإدارة الرياضية؟\nالإجابة: استخدام الموارد المتاحة بكفاءة لتحقيق أهداف المؤسسة الرياضية.\nس2 (المستوى المتوقع): لماذا أصبحت ضرورة؟\nالإجابة: لتنظيم العمل الرياضي بأنواعه.\nس3 (المستوى المتقدم): اذكر مجالًا للإدارة الرياضية.\nالإجابة: المؤسسات الحكومية أو الخاصة.\n\nالحصة 2:\nس1 (مستوى الدعم): ما التخطيط؟\nالإجابة: تحديد الأهداف والخطوات لتحقيقها.\nس2 (المستوى المتوقع): ما التنظيم؟\nالإجابة: ترتيب الجهود وتوزيع المهام.\nس3 (المستوى المتقدم): أيهما يسبق الآخر؟\nالإجابة: التخطيط.\n\nالحصة 3:\nس1 (مستوى الدعم): ما القيادة؟\nالإجابة: تأثير وتحريك الأفراد لتحقيق الأهداف.\nس2 (المستوى المتوقع): ما التنسيق؟\nالإجابة: الترتيب المنظم للمجهود الجماعي.\nس3 (المستوى المتقدم): ما الرقابة؟\nالإجابة: التحقق من سير العمل وفق الخطة وتصحيح الأخطاء.\n\nالحصة 4:\nس1 (مستوى الدعم): ما مبدأ الشمول؟\nالإجابة: إدارة كل جوانب العمل في الهيئة الرياضية.\nس2 (المستوى المتوقع): ما المستقبلية؟\nالإجابة: العمل للمستقبل بأهداف وتطلعات.\nس3 (المستوى المتقدم): ما دور الإعلام الرياضي؟\nالإجابة: تنوير المجتمع الرياضي وإحداث التغيير المنشود.\n\nالحصة 5:\nس1 (مستوى الدعم): ما الهدف من فعاليتكم؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف ستتابعون التنفيذ؟\nالإجابة: بأداة رقابة.\nس3 (المستوى المتقدم): من القائد وما دوره؟\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): عرّف الإدارة الرياضية بكلماتك.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): متى نستخدم وظيفتين أو ثلاثًا فقط من وظائف الإدارة؟\nالإجابة: عندما تكون الموارد محدودة والعمل بسيطًا.\nس3 (المستوى المتقدم): ما الذي احتاجه مهرجان مدرستكم من إدارة؟\nالإجابة: يذكر.\n\nالحصة 2:\nس1 (مستوى الدعم): اعرض خطة مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ما الفرق بين الهدف والخطوة؟\nالإجابة: الهدف الغاية والخطوة وسيلة.\nس3 (المستوى المتقدم): كيف وزعتم المهام؟\nالإجابة: يذكر.\n\nالحصة 3:\nس1 (مستوى الدعم): صنف: اكتشاف تأخر الحكام وتصحيحه.\nالإجابة: رقابة.\nس2 (المستوى المتوقع): اذكر الوظائف الخمس.\nالإجابة: التخطيط، التنظيم، القيادة، التنسيق، الرقابة.\nس3 (المستوى المتقدم): اقترح أسلوب رقابة لبطولة.\nالإجابة: قائمة تحقق يومية.\n\nالحصة 4:\nس1 (مستوى الدعم): اعرض رسالة مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): كيف تخدم العلاقات العامة النشاط المدرسي؟\nالإجابة: بالتواصل مع أولياء الأمور والمجتمع.\nس3 (المستوى المتقدم): ما مبدأ التكامل؟\nالإجابة: تولي كل قسم جانبًا من التنظيم في نسق واحد.\n\nالحصة 5:\nس1 (مستوى الدعم): اعرض خطة مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ما نقطة القوة في خطة المجموعة الأخرى؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي تحتاج إليه خطتكم؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك دور الإدارة في الأندية والمدارس.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التخطيط لنشاط رياضي عائلي.\n\nالحصة 3:\nإرشاد لولي الأمر: ناقش مع طالبك وظائف الإدارة بأمثلة.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على إعداد ملصق لنشاط رياضي.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على طرق تنظيم المسابقات (دليل المعلم ص 84)."}}, {"title": "طرق تنظيم المسابقات الرياضية والاختبار العملي (2)", "unit": "التنظيم والإدارة في الرياضة المدرسية", "week": "الرابع عشر – الخامس عشر", "date": "6-10/12/2026 إلى 13-17/12/2026", "pages": "دليل المعلم ص 84-92", "n": 10, "periods": [{"focus": "مفهوم التنظيم وما يراعى عند تنظيم المسابقات واللجان", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم التنظيم وأهمية المسابقات الرياضية.\n2. يحدد ما يراعى عند التنظيم (التخطيط المسبق، تشكيل اللجان).\n3. يشكل لجان بطولة مصغرة ويحدد اختصاصاتها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- الكتاب\n- أخرى: نماذج لجان", "المفاهيم": "- التنظيم\n- المسابقات والدورات\n- اللجان\n- الاختصاصات", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما اللجان التي تحتاجها بطولة خماسيات؟ (ص 84).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم وما يراعى واللجان.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تشكل لجان بطولة الصف وتحدد اختصاصاتها.\n- الطالب: يشكل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض.\n- الطالب: يعرض.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما التنظيم؟\nالإجابة: تعاون مجموعة تحت إدارة لتحقيق أهداف مشتركة وفق الإمكانات.\nس2 (المستوى المتوقع): ما أول ما يراعى عند التنظيم؟\nالإجابة: التخطيط المسبق.\nس3 (المستوى المتقدم): اذكر لجنة من لجان البطولة.\nالإجابة: لجنة التحكيم.", "التقويم الختامي": "س1 (مستوى الدعم): اعرض لجان مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ما اختصاص اللجنة الفنية؟\nالإجابة: الجداول والقرعة والنتائج.\nس3 (المستوى المتقدم): لماذا نشكل اللجان قبل البطولة؟\nالإجابة: لتوزيع المسؤوليات وضمان السير المنظم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك لجان البطولات المدرسية."}}, {"focus": "طريقة خروج المغلوب من مرة واحدة (8 فرق)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة خروج المغلوب من مرة واحدة.\n2. يرسم جدول 8 فرق ويوزع الفرق بالقرعة.\n3. يحدد عدد المباريات.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق رسم الجداول\n- أخرى: قصاصات قرعة", "المفاهيم": "- خروج المغلوب من مرة واحدة\n- القرعة\n- الأقواس\n- الأدوار", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم مثال بطولة خماسيات 8 مدارس (ص 85).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الخطوات: رسم الجدول، القرعة، المباريات بين كل قوس، تقدم الفائز.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل مجموعة ترسم جدول 8 فرق وتجري قرعة وتملأ الأدوار بنتائج افتراضية.\n- الطالب: يرسم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: استنتاج عدد المباريات = عدد الفرق - 1.\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا يحدث للفريق المغلوب؟\nالإجابة: يخرج من البطولة.\nس2 (المستوى المتوقع): كم مباراة لـ8 فرق؟\nالإجابة: 7.\nس3 (المستوى المتقدم): كيف نوزع الفرق في الجدول؟\nالإجابة: بالقرعة.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول 8 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): كم دورًا في بطولة 8 فرق؟\nالإجابة: ثلاثة أدوار.\nس3 (المستوى المتقدم): كم مباراة لـ16 فريقًا؟\nالإجابة: 15.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على رسم جدول بطولة لفرق الحي."}}, {"focus": "طريقة الاستبقاء عندما لا يكون عدد الفرق من مضاعفات الرقم 2", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف قاعدة الاستبقاء ومتى تستخدم.\n2. يحسب عدد الفرق المستبقاة والمشاركة في الدور الأول.\n3. يرسم جدولًا لعدد 6 و13 فريقًا.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق رسم الجداول", "المفاهيم": "- الاستبقاء\n- مضاعفات الرقم 2\n- الدور الأول", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لو شارك 6 فرق، كيف يسير الجدول بانتظام؟ (ص 86-87).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح القاعدة بمثال 6 فرق (فريقان يستبقيان) و13 فريقًا (أقرب مضاعف 16، يستبقى 3).\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تحل أمثلة (5، 7، 10 فرق) وترسم الجداول.\n- الطالب: يحسب ويرسم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض الحلول.\n- الطالب: يعرض.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم الاستبقاء؟\nالإجابة: عندما لا يكون عدد الفرق من مضاعفات الرقم 2.\nس2 (المستوى المتوقع): كم فريقًا يستبقى من 6؟\nالإجابة: فريقان.\nس3 (المستوى المتقدم): في أي دور تطبق القاعدة؟\nالإجابة: الدور الأول فقط.", "التقويم الختامي": "س1 (مستوى الدعم): 13 فريقًا: كم يستبقى وكم يشارك في الدور الأول؟\nالإجابة: يستبقى 3 ويشارك 10.\nس2 (المستوى المتوقع): ارسم جدول 6 فرق.\nالإجابة: يرسم.\nس3 (المستوى المتقدم): لماذا تطبق على الدور الأول فقط؟\nالإجابة: لينتج عدد منتظم من مضاعفات 2 للأدوار التالية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على حل مثال استبقاء لعدد 11 فريقًا."}}, {"focus": "عدد المباريات وميزات وعيوب خروج المغلوب من مرة واحدة ونظام الترضية", "num": 4, "fields": {"المخرجات التعليمية": "1. يحسب عدد مباريات خروج المغلوب من مرة.\n2. يقارن ميزات الطريقة وعيوبها.\n3. يفسر نظام الترضية وفائدته.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- الكتاب", "المفاهيم": "- عدد المباريات\n- الميزات\n- العيوب\n- نظام الترضية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما عيب خروج نصف الفرق من الدور الأول؟ (ص 87-88).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الحساب والميزات (وقت قصير، إمكانات محدودة) والعيوب (قلة الاحتكاك، الحظ) والترضية.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تعد جدول مقارنة وترسم جدول ترضية للمغلوبين في الدور الأول.\n- الطالب: يقارن ويرسم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: متى تناسب هذه الطريقة المدرسة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كم مباراة لـ12 فريقًا؟\nالإجابة: 11.\nس2 (المستوى المتوقع): اذكر ميزة.\nالإجابة: تستغرق وقتًا قصيرًا.\nس3 (المستوى المتقدم): اذكر عيبًا.\nالإجابة: خروج نصف المشتركين من الدور الأول.", "التقويم الختامي": "س1 (مستوى الدعم): ما نظام الترضية؟\nالإجابة: مسابقة بين المغلوبين من الدور الأول لإتاحة فرصة أخرى.\nس2 (المستوى المتوقع): متى تناسب الطريقة المدرسة؟\nالإجابة: عند محدودية الوقت والحكام والأدوات.\nس3 (المستوى المتقدم): كيف يعالج الترضية عيب الطريقة؟\nالإجابة: يزيد الاحتكاك والمباريات للفرق الخارجة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك ميزات وعيوب الطرق."}}, {"focus": "طريقة خروج المغلوب من مرتين", "num": 5, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة خروج المغلوب من مرتين وميزاتها.\n2. يرسم جدول 8 فرق (الفائز يسارًا والمغلوب يمينًا).\n3. يقارنها بخروج المغلوب من مرة واحدة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق رسم الجداول", "المفاهيم": "- خروج المغلوب من مرتين\n- جدول الفائزين\n- جدول المغلوبين", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نعطي الفريق فرصة ثانية؟ (ص 89).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الطريقة ورسم الجدول.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات ترسم جدول 8 فرق بالطريقة وتتابع نتائج افتراضية.\n- الطالب: يرسم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة الطريقتين.\n- الطالب: يقارن.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): متى يخرج الفريق في هذه الطريقة؟\nالإجابة: بعد الهزيمة مرتين.\nس2 (المستوى المتوقع): إلى أي جهة يتحرك المغلوب في الجدول؟\nالإجابة: اليمين.\nس3 (المستوى المتقدم): متى تستخدم؟\nالإجابة: عند توفر وقت لمزيد من المباريات.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول 8 فرق بخروج المغلوب من مرتين.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): ما ميزتها على الطريقة الأولى؟\nالإجابة: فرصة أكبر وأثر أقل للحظ.\nس3 (المستوى المتقدم): ما عيبها؟\nالإجابة: تحتاج إلى وقت ومباريات أكثر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على رسم الجدول لعدد 4 فرق."}}, {"focus": "الدوري من مرحلة واحدة (جدول المباريات واحتساب النقاط)", "num": 6, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة الدوري من مرحلة واحدة.\n2. يرسم جدول دوري لـ5 أو 6 فرق ويحسب عدد المباريات.\n3. يحتسب النقاط ويرتب الفرق.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق رسم الجداول", "المفاهيم": "- الدوري\n- مرحلة واحدة\n- النقاط\n- الترتيب", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: في أي طريقة يلعب كل فريق مع جميع الفرق؟ (ص 90-91).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الطريقة وعدد المباريات ن(ن-1)/2 وجدول الجولات واحتساب النقاط.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات ترسم جدول دوري لـ5 فرق وتحسب نتائج افتراضية وترتب.\n- الطالب: يرسم ويرتب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: استنتاج ميزات الدوري (عدالة) وعيوبه (وقت).\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كم مباراة لـ6 فرق في دوري من مرحلة؟\nالإجابة: 15.\nس2 (المستوى المتوقع): كيف يرتب الفرق؟\nالإجابة: بالنقاط ثم فارق الأهداف.\nس3 (المستوى المتقدم): ما ميزة الدوري؟\nالإجابة: يلعب كل فريق مع الجميع فيكون أعدل.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول دوري لـ5 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): كم جولة لـ6 فرق؟\nالإجابة: 5 جولات.\nس3 (المستوى المتقدم): ما عيب الدوري في المدرسة؟\nالإجابة: يحتاج إلى وقت طويل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على رسم جدول دوري لفرق الحي."}}, {"focus": "تطبيق: تنظيم بطولة مصغرة للصف بالأدوار واللجان", "num": 7, "fields": {"المخرجات التعليمية": ملونة\n- أخرى: جداول البطولة", "المفاهيم": "- النهائي\n- الترضية\n- التقويم\n- التحسين", "التهيئة / التمهيد / التعلم القبلي": "تعلن اللجنة الفنية مباريات النهائي والترضية.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (22 دقائق):\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: مباريات النهائي والترضية وتتويج الفائز.\n- الطالب: يلعب وينفذ دوره.\n\nالنشاط 3 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقويم التنظيم بنقاط قوة وتحسين من كل لجنة.\n- الطالب: يقوّم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما نظام الترضية الذي طبقتموه؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): من فاز وكيف تم الترتيب؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما نقطة القوة في التنظيم؟\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): اقترح تحسينًا للبطولة القادمة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي الطرق أنسب للمدرسة ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): ما الذي تعلمته من عمل اللجان؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك مهارات كرة القدم قبل الاختبار العملي (2)."}}, {"focus": "الاختبار العملي (2): مهارات كرة القدم", "num": 9, "fields": {"المخرجات التعليمية": "1. يؤدي الحائطية والبينية مع مدافعين.\n2. يؤدي مهارات الحارس (مسك الأرضية والمتوسطة والعالية).\n3. يطبق القواعد في موقف لعب قصير.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- أخرى: صدريات ملونة\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- الاختبار العملي\n- الحائطية\n- البينية\n- الحارس", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات الاختبار.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: محطات: حائطية مع مدافع إيجابي، بينية بين مدافعين، مسك 9 كرات (3 لكل نوع)، موقف 3 ضد 2؛ ويرصد المعلم.\n- الطالب: يؤدي عند دوره.\n\nالنشاط 3 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستمع.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): بكم لمسة يعيد الحائط الكرة؟\nالإجابة: واحدة.\nس2 (المستوى المتوقع): إلى أين تمرر البينية؟\nالإجابة: إلى المكان الشاغر خلف المدافعين.\nس3 (المستوى المتقدم): بكم قدم يثب الحارس للكرة العالية؟\nالإجابة: بقدم واحدة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ محطات الاختبار.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما المهارة التي أتقنتها أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما خطتك لتطوير الأضعف؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك طرق تنظيم المسابقات قبل الحصة الأخيرة من الاختبار."}}, {"focus": "الاختبار العملي (2): التنظيم والإدارة (رسم الجداول وحل مسائل التنظيم)", "num": 10, "fields": {"المخرجات التعليمية": "1. يرسم جداول (خروج المغلوب من مرة ومرتين، الاستبقاء، الدوري) لأعداد مختلفة.\n2. يحل مسائل عدد المباريات والفرق المستبقاة.\n3. يفسر وظائف الإدارة الخمس بأمثلة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أوراق اختبار\n- السبورة الذكية", "المفاهيم": "- الاختبار\n- الجداول\n- وظائف الإدارة", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم الاختبار الكتابي والعملي للتنظيم.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة وتعليمات.\n- الطالب: يستمع.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار: رسم جدول 8 فرق بخروج المغلوب من مرة، جدول 6 فرق بالاستبقاء، حساب مباريات دوري 5 فرق، أمثلة على وظائف الإدارة.\n- الطالب: يجيب.\n\nالنشاط 3 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مراجعة سريعة للإجابات.\n- الطالب: يصحح.\n\nالنشاط 4 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص وإعلان الإجازة.\n- الطالب: يستمع.", "التقويم التكويني": "س1 (مستوى الدعم): كم مباراة لـ8 فرق بخروج المغلوب من مرة؟\nالإجابة: 7.\nس2 (المستوى المتوقع): كم فريقًا يستبقى من 6؟\nالإجابة: فريقان.\nس3 (المستوى المتقدم): اذكر وظائف الإدارة الخمس.\nالإجابة: التخطيط، التنظيم، القيادة، التنسيق، الرقابة.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول 6 فرق بالاستبقاء.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): كم مباراة لدوري 5 فرق؟\nالإجابة: 10.\nس3 (المستوى المتقدم): أي الطرق أنسب لبطولة من ثلاثة أيام لعشر فرق؟\nالإجابة: خروج المغلوب من مرة مع الترضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على موضوعات الفصل الثاني (الكرة الطائرة، كرة السلة، كرة اليد) في دليل المعلم."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم التنظيم وأهمية المسابقات الرياضية.\n2. يحدد ما يراعى عند التنظيم (التخطيط المسبق، تشكيل اللجان).\n3. يشكل لجان بطولة مصغرة ويحدد اختصاصاتها.\n\nالحصة 2:\n1. يتعرف طريقة خروج المغلوب من مرة واحدة.\n2. يرسم جدول 8 فرق ويوزع الفرق بالقرعة.\n3. يحدد عدد المباريات.\n\nالحصة 3:\n1. يتعرف قاعدة الاستبقاء ومتى تستخدم.\n2. يحسب عدد الفرق المستبقاة والمشاركة في الدور الأول.\n3. يرسم جدولًا لعدد 6 و13 فريقًا.\n\nالحصة 4:\n1. يحسب عدد مباريات خروج المغلوب من مرة.\n2. يقارن ميزات الطريقة وعيوبها.\n3. يفسر نظام الترضية وفائدته.\n\nالحصة 5:\n1. يتعرف طريقة خروج المغلوب من مرتين وميزاتها.\n2. يرسم جدول 8 فرق (الفائز يسارًا والمغلوب يمينًا).\n3. يقارنها بخروج المغلوب من مرة واحدة.\n\nالحصة 6:\n1. يتعرف طريقة الدوري من مرحلة واحدة.\n2. يرسم جدول دوري لـ5 أو 6 فرق ويحسب عدد المباريات.\n3. يحتسب النقاط ويرتب الفرق.\n\nالحصة 7:\n1. ينظم مع زملائه بطولة خماسيات مصغرة بطريقة خروج المغلوب من مرة.\n2. يؤدي دوره في اللجان (فنية، تحكيم، إعلام).\n3. يتعاون ويلتزم بالخطة.\n\nالحصة 8:\n1. يستكمل البطولة (النهائي و للمغلوبين في الدور الأول.\n- الطالب: يقارن ويرسم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: متى تناسب هذه الطريقة المدرسة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.\n\nالحصة 5:\nالنشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الطريقة ورسم الجدول.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات ترسم جدول 8 فرق بالطريقة وتتابع نتائج افتراضية.\n- الطالب: يرسم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة الطريقتين.\n- الطالب: يقارن.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.\n\nالحصة 6:\nالنشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الطريقة وعدد المباريات ن(ن-1)/2 وجدول الجولات واحتساب النقاط.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات ترسم جدول دوري لـ5 فرق وتحسب نتائج افتراضية وترتب.\n- الطالب: يرسم ويرتب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: استنتاج ميزات الدوري (عدالة) وعيوبه (وقت).\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.\n\nالحصة 7:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (29 دقائق):\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: تنفيذ الدور الأول والثاني من البطولة بمباريات قصيرة مع عمل اللجان.\n- الطالب: ينفذ دوره ويلعب.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 8:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (22 دقائق):\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: مباريات النهائي والترضية وتتويج الفائز.\n- الطالب: يلعب وينفذ دوره.\n\nالنشاط 3 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقويم التنظيم بنقاط قوة وتحسين من كل لجنة.\n- الطالب: يقوّم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 9:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: محطات: حائطية مع مدافع إيجابي، بينية بين مدافعين، مسك 9 كرات (3 لكل نوع)، موقف 3 ضد 2؛ ويرصد المعلم.\n- الطالب: يؤدي عند دوره.\n\nالنشاط 3 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستمع.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 10:\nالنشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة وتعليمات.\n- الطالب: يستمع.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار: رسم جدول 8 فرق بخروج المغلوب من مرة، جدول 6 فرق بالاستبقاء، حساب مباريات دوري 5 فرق، أمثلة على وظائف الإدارة.\n- الطالب: يجيب.\n\nالنشاط 3 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مراجعة سريعة للإجابات.\n- الطالب: يصحح.\n\nالنشاط 4 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص وإعلان الإجازة.\n- الطالب: يستمع.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما التنظيم؟\nالإجابة: تعاون مجموعة تحت إدارة لتحقيق أهداف مشتركة وفق الإمكانات.\nس2 (المستوى المتوقع): ما أول ما يراعى عند التنظيم؟\nالإجابة: التخطيط المسبق.\nس3 (المستوى المتقدم): اذكر لجنة من لجان البطولة.\nالإجابة: لجنة التحكيم.\n\nالحصة 2:\nس1 (مستوى الدعم): ماذا يحدث للفريق المغلوب؟\nالإجابة: يخرج من البطولة.\nس2 (المستوى المتوقع): كم مباراة لـ8 فرق؟\nالإجابة: 7.\nس3 (المستوى المتقدم): كيف نوزع الفرق في الجدول؟\nالإجابة: بالقرعة.\n\nالحصة 3:\nس1 (مستوى الدعم): متى نستخدم الاستبقاء؟\nالإجابة: عندما لا يكون عدد الفرق من مضاعفات الرقم 2.\nس2 (المستوى المتوقع): كم فريقًا يستبقى من 6؟\nالإجابة: فريقان.\nس3 (المستوى المتقدم): في أي دور تطبق القاعدة؟\nالإجابة: الدور الأول فقط.\n\nالحصة 4:\nس1 (مستوى الدعم): كم مباراة لـ12 فريقًا؟\nالإجابة: 11.\nس2 (المستوى المتوقع): اذكر ميزة.\nالإجابة: تستغرق وقتًا قصيرًا.\nس3 (المستوى المتقدم): اذكر عيبًا.\nالإجابة: خروج نصف المشتركين من الدور الأول.\n\nالحصة 5:\nس1 (مستوى الدعم): متى يخرج الفريق في هذه الطريقة؟\nالإجابة: بعد الهزيمة مرتين.\nس2 (المستوى المتوقع): إلى أي جهة يتحرك المغلوب في الجدول؟\nالإجابة: اليمين.\nس3 (المستوى المتقدم): متى تستخدم؟\nالإجابة: عند توفر وقت لمزيد من المباريات.\n\nالحصة 6:\nس1 (مستوى الدعم): كم مباراة لـ6 فرق في دوري من مرحلة؟\nالإجابة: 15.\nس2 (المستوى المتوقع): كيف يرتب الفرق؟\nالإجابة: بالنقاط ثم فارق الأهداف.\nس3 (المستوى المتقدم): ما ميزة الدوري؟\nالإجابة: يلعب كل فريق مع الجميع فيكون أعدل.\n\nالحصة 7:\nس1 (مستوى الدعم): ما اللجنة التي أنت فيها؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تقدم الفائز في الجدول؟\nالإجابة: إلى القوس التالي.\nس3 (المستوى المتقدم): ما الطريقة المستخدمة؟\nالإجابة: خروج المغلوب من مرة واحدة.\n\nالحصة 8:\nس1 (مستوى الدعم): ما نظام الترضية الذي طبقتموه؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): من فاز وكيف تم الترتيب؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما نقطة القوة في التنظيم؟\nالإجابة: يذكر.\n\nالحصة 9:\nس1 (مستوى الدعم): بكم لمسة يعيد الحائط الكرة؟\nالإجابة: واحدة.\nس2 (المستوى المتوقع): إلى أين تمرر البينية؟\nالإجابة: إلى المكان الشاغر خلف المدافعين.\nس3 (المستوى المتقدم): بكم قدم يثب الحارس للكرة العالية؟\nالإجابة: بقدم واحدة.\n\nالحصة 10:\nس1 (مستوى الدعم): كم مباراة لـ8 فرق بخروج المغلوب من مرة؟\nالإجابة: 7.\nس2 (المستوى المتوقع): كم فريقًا يستبقى من 6؟\nالإجابة: فريقان.\nس3 (المستوى المتقدم): اذكر وظائف الإدارة الخمس.\nالإجابة: التخطيط، التنظيم، القيادة، التنسيق، الرقابة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اعرض لجان مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ما اختصاص اللجنة الفنية؟\nالإجابة: الجداول والقرعة والنتائج.\nس3 (المستوى المتقدم): لماذا نشكل اللجان قبل البطولة؟\nالإجابة: لتوزيع المسؤوليات وضمان السير المنظم.\n\nالحصة 2:\nس1 (مستوى الدعم): ارسم جدول 8 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): كم دورًا في بطولة 8 فرق؟\nالإجابة: ثلاثة أدوار.\nس3 (المستوى المتقدم): كم مباراة لـ16 فريقًا؟\nالإجابة: 15.\n\nالحصة 3:\nس1 (مستوى الدعم): 13 فريقًا: كم يستبقى وكم يشارك في الدور الأول؟\nالإجابة: يستبقى 3 ويشارك 10.\nس2 (المستوى المتوقع): ارسم جدول 6 فرق.\nالإجابة: يرسم.\nس3 (المستوى المتقدم): لماذا تطبق على الدور الأول فقط؟\nالإجابة: لينتج عدد منتظم من مضاعفات 2 للأدوار التالية.\n\nالحصة 4:\nس1 (مستوى الدعم): ما نظام الترضية؟\nالإجابة: مسابقة بين المغلوبين من الدور الأول لإتاحة فرصة أخرى.\nس2 (المستوى المتوقع): متى تناسب الطريقة المدرسة؟\nالإجابة: عند محدودية الوقت والحكام والأدوات.\nس3 (المستوى المتقدم): كيف يعالج الترضية عيب الطريقة؟\nالإجابة: يزيد الاحتكاك والمباريات للفرق الخارجة.\n\nالحصة 5:\nس1 (مستوى الدعم): ارسم جدول 8 فرق بخروج المغلوب من مرتين.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): ما ميزتها على الطريقة الأولى؟\nالإجابة: فرصة أكبر وأثر أقل للحظ.\nس3 (المستوى المتقدم): ما عيبها؟\nالإجابة: تحتاج إلى وقت ومباريات أكثر.\n\nالحصة 6:\nس1 (مستوى الدعم): ارسم جدول دوري لـ5 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): كم جولة لـ6 فرق؟\nالإجابة: 5 جولات.\nس3 (المستوى المتقدم): ما عيب الدوري في المدرسة؟\nالإجابة: يحتاج إلى وقت طويل.\n\nالحصة 7:\nس1 (مستوى الدعم): ما الذي سار جيدًا في عمل لجنتك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما المشكلة التي واجهتكم وكيف حللتموها؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كم مباراة بقيت؟\nالإجابة: يذكر.\n\nالحصة 8:\nس1 (مستوى الدعم): اقترح تحسينًا للبطولة القادمة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي الطرق أنسب للمدرسة ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): ما الذي تعلمته من عمل اللجان؟\nالإجابة: يذكر.\n\nالحصة 9:\nس1 (مستوى الدعم): أدِّ محطات الاختبار.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما المهارة التي أتقنتها أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما خطتك لتطوير الأضعف؟\nالإجابة: يذكر.\n\nالحصة 10:\nس1 (مستوى الدعم): ارسم جدول 6 فرق بالاستبقاء.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): كم مباراة لدوري 5 فرق؟\nالإجابة: 10.\nس3 (المستوى المتقدم): أي الطرق أنسب لبطولة من ثلاثة أيام لعشر فرق؟\nالإجابة: خروج المغلوب من مرة مع الترضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك لجان البطولات المدرسية.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على رسم جدول بطولة لفرق الحي.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على حل مثال استبقاء لعدد 11 فريقًا.\n\nالحصة 4:\nإرشاد لولي الأمر: ناقش مع طالبك ميزات وعيوب الطرق.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على رسم الجدول لعدد 4 فرق.\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على رسم جدول دوري لفرق الحي.\n\nالحصة 7:\nإرشاد لولي الأمر: اسأل طالبك عن دوره في بطولة الصف.\n\nالحصة 8:\nإرشاد لولي الأمر: راجع مع طالبك مهارات كرة القدم قبل الاختبار العملي (2).\n\nالحصة 9:\nإرشاد لولي الأمر: راجع مع طالبك طرق تنظيم المسابقات قبل الحصة الأخيرة من الاختبار.\n\nالحصة 10:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على موضوعات الفصل الثاني (الكرة الطائرة، كرة السلة، كرة اليد) في دليل المعلم."}}];
const FIELDS = ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const GNOTE = "خمس حصص أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ اعتُمد مسار الذكور (كرة القدم) في الوحدة الثالثة.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
