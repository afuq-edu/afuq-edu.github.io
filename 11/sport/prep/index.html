معلم: إعلان النتائج.\n- الطالب: يستمع.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف رتبتم المتسابقين؟\nالإجابة: بالقرعة.\nس2 (المستوى المتوقع): كم محاولة لكل متسابق؟\nالإجابة: ثلاث.\nس3 (المستوى المتقدم): كيف حددتم الفائز؟\nالإجابة: بأفضل محاولة صحيحة.", "التقويم الختامي": "س1 (مستوى الدعم): ما دورك وكيف أديته؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الحالة التحكيمية التي واجهتها؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يمكن تحسينه في التنظيم؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طالبك عن دوره في تنظيم المسابقة."}}, {"focus": "تقويم المسابقة وتحليل الحالات التحكيمية", "num": 5, "fields": {"المخرجات التعليمية": "1. يقوّم تنظيم المسابقة من حيث القواعد والأدوار والزمن.\n2. يحلل الحالات التحكيمية التي وقعت ويقرر الصواب.\n3. يقترح تحسينات للتنظيم.", "المستوى المعرفي": "المخرج 1: تقييم\nالمخرج 2: تحليل\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: استمارات المسابقة\n- أخرى: بطاقات حالات", "المفاهيم": "- التقويم\n- الحالات التحكيمية\n- التحسين", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم استمارات المسابقة ويسأل: ما الذي سار جيدًا وما الذي تعثر؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تراجع استماراتها وتسجل ثلاث نقاط قوة وثلاث نقاط تحسين.\n- الطالب: يقوّم.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض حالات تحكيمية وقعت والقرار الصحيح.\n- الطالب: يحلل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: اختبار قصير شفهي في المصطلحات والقواعد.\n- الطالب: يجيب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما العلامة التي تحدد المحاولة الفاشلة؟\nالإجابة: البيضاء.\nس2 (المستوى المتوقع): اذكر نقطة قوة في مسابقتكم.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اذكر نقطة تحسين.\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة لم تطبق جيدًا وكيف نصححها.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): متسابق دار دورة كاملة وظهره للقوس، ما القرار؟\nالإجابة: غير مسموح.\nس3 (المستوى المتقدم): اقترح تحسينًا لمسابقة قادمة.\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على سباقات المسافات القصيرة (دليل المعلم ص 41)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد العامة لمسابقة رمي الرمح.\n2. يحدد حالات المحاولة الفاشلة.\n3. يطبق القواعد على حالات افتراضية.\n\nالحصة 2:\n1. يتعرف المصطلحات (قوس الرمي، مقطع الرمي، منطقة التخلص، العلامة) ومواصفات الميدان.\n2. يقيس الرمية من أقرب علامة إلى الحد الداخلي للقوس.\n3. يميز العلامات (البيضاء للفاشلة والحمراء للصحيحة).\n\nالحصة 3:\n1. يتعرف لجان المسابقة (الحكام، القائسون، المسجلون، الأمن والسلامة).\n2. يحدد مسؤولية كل عضو.\n3. يصمم هيكلًا تنظيميًا لمسابقة مدرسية.\n\nالحصة 4:\n1. ينظم مع زملائه مسابقة رمي رمح كاملة بالأدوار.\n2. يطبق القواعد والقياس والتسجيل.\n3. يتعاون ويلتزم بالأمن والسلامة.\n\nالحصة 5:\n1. يقوّم تنظيم المسابقة من حيث القواعد والأدوار والزمن.\n2. يحلل الحالات التحكيمية التي وقعت ويقرر الصواب.\n3. يقترح تحسينات للتنظيم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: إبداع\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 5:\nالمخرج 1: تقييم\nالمخرج 2: تحليل\nالمخرج 3: إبداع", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- جهاز عرض البيانات\n- السبورة الذكية\n- أخرى: بطاقات الحالات\n- أخرى: رماح\n\nالحصة 2:\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: علامات\n- أخرى: رماح\n- أخرى: جير\n\nالحصة 3:\n- السبورة الذكية\n- أخرى: بطاقات الأدوار\n- أخرى: استمارات تسجيل\n\nالحصة 4:\n- أخرى: رماح\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: علامات\n- أخرى: استمارات تسجيل\n\nالحصة 5:\n- السبورة الذكية\n- أخرى: استمارات المسابقة\n- أخرى: بطاقات حالات", "المفاهيم": "الحصة 1:\n- القرعة\n- المحاولات\n- المحاولة الفاشلة\n- قوس الرمي\n\nالحصة 2:\n- قوس الرمي\n- مقطع الرمي\n- العلامة\n- القياس\n\nالحصة 3:\n- رئيس الحكام\n- القائس\n- المسجل\n- الأمن والسلامة\n\nالحصة 4:\n- المسابقة\n- الأدوار\n- الترتيب\n- التسجيل\n\nالحصة 5:\n- التقويم\n- الحالات التحكيمية\n- التحسين", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: لو شارك 12 طالبًا، كم محاولة لكل منهم؟ (ص 39).\n\nالحصة 2:\nيرسم المعلم الميدان على الأرض ويسأل: من أين يقاس الرمي؟ (ص 46، 51).\n\nالحصة 3:\nيسأل المعلم: من يقرر صحة المحاولة ومن يقيس ومن يسجل؟\n\nالحصة 4:\nيوزع المعلم الأدوار حسب هيكل الحصة السابقة ويعلن بدء المسابقة.\n\nالحصة 5:\nيعرض المعلم استمارات المسابقة ويسأل: ما الذي سار جيدًا وما الذي تعثر؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح القواعد: الترتيب بالقرعة، ثلاث محاولات فثلاث للثمانية الأوائل، ست محاولات لثمانية فأقل، حالات الفشل.\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تقرر في بطاقات حالات (لمس الأرض خارج القوس، سقوط الرمح خارج المقطع...).\n- الطالب: يقرر ويبرر.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: رمي تطبيقي مع حكم من الطلبة.\n- الطالب: يرمي ويحكم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المصطلحات والميدان وطريقة القياس والعلامات.\n- الطالب: يستمع ويرسم.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات ترسم الميدان بالجير وتقيس رميات تجريبية.\n- الطالب: يرسم ويقيس.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا يقاس من الحد الداخلي للقوس؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح اللجان والمسؤوليات.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصمم هيكلًا تنظيميًا لمسابقة الصف وتوزع الأدوار.\n- الطالب: يصمم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: تمثيل أدوار: رمية واحدة بكل اللجان.\n- الطالب: يمثل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تنفيذ المسابقة: قرعة، ثلاث محاولات، تحكيم وقياس وتسجيل وترتيب.\n- الطالب: ينفذ دوره ويرمي.\n\nالنشاط 3 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: إعلان النتائج.\n- الطالب: يستمع.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تراجع استماراتها وتسجل ثلاث نقاط قوة وثلاث نقاط تحسين.\n- الطالب: يقوّم.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض حالات تحكيمية وقعت والقرار الصحيح.\n- الطالب: يحلل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: اختبار قصير شفهي في المصطلحات والقواعد.\n- الطالب: يجيب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كيف يرتب المتسابقون؟\nالإجابة: بالقرعة.\nس2 (المستوى المتوقع): كم محاولة إذا كان العدد ثمانية فأقل؟\nالإجابة: ست.\nس3 (المستوى المتقدم): اذكر حالة فشل.\nالإجابة: سقوط الرمح خارج المقطع.\n\nالحصة 2:\nس1 (مستوى الدعم): ما لون علامة المحاولة الصحيحة؟\nالإجابة: حمراء.\nس2 (المستوى المتوقع): من أين يقاس الرمي؟\nالإجابة: من أقرب علامة للرمح إلى الحد الداخلي للقوس.\nس3 (المستوى المتقدم): ما مقطع الرمي؟\nالإجابة: المنطقة التي يجب أن يسقط فيها الرمح.\n\nالحصة 3:\nس1 (مستوى الدعم): من يرفع العلم للمحاولة؟\nالإجابة: الحكم.\nس2 (المستوى المتوقع): ما مسؤولية المسجل؟\nالإجابة: تدوين المحاولات والمسافات.\nس3 (المستوى المتقدم): ما دور لجنة الأمن؟\nالإجابة: تأمين منطقة الرمي.\n\nالحصة 4:\nس1 (مستوى الدعم): كيف رتبتم المتسابقين؟\nالإجابة: بالقرعة.\nس2 (المستوى المتوقع): كم محاولة لكل متسابق؟\nالإجابة: ثلاث.\nس3 (المستوى المتقدم): كيف حددتم الفائز؟\nالإجابة: بأفضل محاولة صحيحة.\n\nالحصة 5:\nس1 (مستوى الدعم): ما العلامة التي تحدد المحاولة الفاشلة؟\nالإجابة: البيضاء.\nس2 (المستوى المتوقع): اذكر نقطة قوة في مسابقتكم.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اذكر نقطة تحسين.\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): متسابق ترك منطقة التخلص قبل سقوط الرمح، ما القرار؟\nالإجابة: محاولة فاشلة.\nس2 (المستوى المتوقع): 13 متسابقًا، كيف توزع المحاولات؟\nالإجابة: ثلاث للجميع ثم ثلاث للثمانية الأوائل.\nس3 (المستوى المتقدم): لماذا لا تحتسب فاشلة إذا انكسر الرمح؟\nالإجابة: لأن الرمية تمت وفق القانون.\n\nالحصة 2:\nس1 (مستوى الدعم): قس رمية زميلك بالطريقة الصحيحة.\nالإجابة: يقيس.\nس2 (المستوى المتوقع): اذكر مصطلحين من مصطلحات المسابقة.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): هل يسمح باستخدام القفازات؟\nالإجابة: لا.\n\nالحصة 3:\nس1 (مستوى الدعم): اعرض هيكل مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ماذا يحدث لو غاب القائس؟\nالإجابة: تتعطل المسابقة.\nس3 (المستوى المتقدم): ما دورك في مسابقة الأسبوع؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): ما دورك وكيف أديته؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الحالة التحكيمية التي واجهتها؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يمكن تحسينه في التنظيم؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر قاعدة لم تطبق جيدًا وكيف نصححها.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): متسابق دار دورة كاملة وظهره للقوس، ما القرار؟\nالإجابة: غير مسموح.\nس3 (المستوى المتقدم): اقترح تحسينًا لمسابقة قادمة.\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد مسابقة رمي الرمح.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على رسم ميدان الرمي وشرح مصطلحاته.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على معرفة أدوار الحكام في المسابقات.\n\nالحصة 4:\nإرشاد لولي الأمر: اسأل طالبك عن دوره في تنظيم المسابقة.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على سباقات المسافات القصيرة (دليل المعلم ص 41)."}}, {"title": "سباقات المسافات القصيرة والاختبار العملي (1)", "unit": "مسابقات الميدان والمضمار", "week": "السابع – الثامن", "date": "18-22/10/2026 إلى 25-29/10/2026", "pages": "دليل المعلم ص 41-52", "n": 10, "periods": [{"focus": "أنواع سباقات المسافات القصيرة والصفات البدنية والمراحل الفنية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف سباقات المسافات القصيرة (100، 200، 400 م، التتابع، الحواجز).\n2. يحدد الصفات البدنية للعداء والمراحل الفنية الثلاث.\n3. يقدر دور هذه السباقات في الرياضة المدرسية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- جهاز عرض البيانات\n- أخرى: أقماع\n- أخرى: مكعبات البدء", "المفاهيم": "- سباقات السرعة\n- المراحل الفنية\n- الصفات البدنية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما السباقات التي تسمى سباقات السرعة؟ (ص 41).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالعدو.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الأنواع والصفات (القوة، القوة المميزة بالسرعة، السرعة، المرونة، التحمل) والمراحل (البدء، جري المسافة، النهاية).\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات تمثل الصفات (عدو 30 م، وثب، إطالة، جري 200 م).\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط كل محطة بصفة.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر ثلاثة من سباقات المسافات القصيرة.\nالإجابة: 100، 200، 400 م.\nس2 (المستوى المتوقع): ما المراحل الفنية؟\nالإجابة: بدء السباق، جري المسافة، نهاية السباق.\nس3 (المستوى المتقدم): اذكر صفتين للعداء.\nالإجابة: السرعة والقوة المميزة بالسرعة.", "التقويم الختامي": "س1 (مستوى الدعم): لماذا يحتاج عداء 400 م إلى التحمل؟\nالإجابة: لطول المسافة بسرعة عالية.\nس2 (المستوى المتوقع): ما سباقات التتابع القصيرة؟\nالإجابة: 4×100 م و4×400 م.\nس3 (المستوى المتقدم): كيف تساعد مساحات المدرسة في تنمية السرعة؟\nالإجابة: بتدريبات متنوعة حسب المساحة المتاحة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة سباق 100 م وتحديد مراحله."}}, {"focus": "مرحلة بدء السباق (البدء المنخفض والدفع)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي البدء المنخفض بأقسامه ودفع القدم الخلفية بقوة.\n2. يميز النقاط الفنية للدفع (مرجحة الرجل الخلفية، ميل الجذع، فرد الحوض والركبة).\n3. يصحح أخطاء البدء لزميله.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعة إيقاف", "المفاهيم": "- البدء المنخفض\n- الدفع\n- ميل الجذع", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الذي يميز انطلاقة العداء القوية؟ (ص 42).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج البدء والدفع بالنقاط الفنية.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: أوامر وتصحيح، ثم عدو 20 م من البدء.\n- الطالب: يتدرب ويصحح.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة رد الفعل بالانطلاق.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): أي قدم تدفع بقوة؟\nالإجابة: الخلفية.\nس2 (المستوى المتوقع): كيف يكون الجذع عند الدفع؟\nالإجابة: مائلًا للأمام.\nس3 (المستوى المتقدم): متى يفرد مفصل الحوض والركبة تمامًا؟\nالإجابة: في نهاية مرحلة الدفع.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ البدء المنخفض وعدو 20 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الخطأ الذي صححته لزميلك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): لماذا لا نرفع الجذع فجأة بعد الانطلاق؟\nالإجابة: لنحافظ على الدفع وتزايد السرعة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب البدء المنخفض."}}, {"focus": "مرحلة جري مسافة السباق (الخطوات والذراعان وتوزيع الجهد)", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي جري المسافة بانسيابية وخطوات أوسع وأكثر ترددًا.\n2. يحرك الذراعين في مدى واسع بحرية واسترخاء.\n3. يفسر أهمية تنظيم الجهد للمرحلة النهائية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: ساعات إيقاف", "المفاهيم": "- اتساع الخطوة\n- تردد الخطوة\n- الاسترخاء\n- توزيع الجهد", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يتباطأ بعض العدائين في النهاية؟ (ص 42).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج جري المسافة مع التركيز على الذراعين والاسترخاء.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: جري 60 م بخطوات واسعة، جري مع تحريك الذراعين في مدى واسع، عدو 100 م بتوزيع جهد.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة الزمن بين جري متوتر ومسترخٍ.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف تكون الخطوات في جري المسافة؟\nالإجابة: أكثر اتساعًا وترددًا.\nس2 (المستوى المتوقع): كيف تتحرك الذراعان؟\nالإجابة: في مدى واسع بحرية واسترخاء.\nس3 (المستوى المتقدم): لماذا ننظم الجهد؟\nالإجابة: لتوفيره للمرحلة النهائية.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ 60 م بخطوات واسعة ومسترخية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما أثر التوتر في السرعة؟\nالإجابة: يبطئها.\nس3 (المستوى المتقدم): كيف توزع جهدك في 200 م؟\nالإجابة: سرعة قصوى في البداية ثم محافظة ثم زيادة في النهاية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الاسترخاء أثناء الجري."}}, {"focus": "مرحلة نهاية السباق (التنفس، إخراج الهواء، الاندفاع بالصدر)", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي نهاية السباق بزيادة السرعة والاندفاع بالصدر عند الخط.\n2. يطبق التنفس الصحيح (إخراج الزفير من الفم) في نقص الأكسجين.\n3. يفسر لماذا تعد النهاية أصعب المراحل.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط خط النهاية\n- أخرى: ساعات إيقاف", "المفاهيم": "- نهاية السباق\n- الزفير\n- الاندفاع بالصدر", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يشعر العداء في الأمتار الأخيرة؟ (ص 42-43).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج نهاية السباق والتنفس.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: عدو 30 م ثم زيادة السرعة في آخر 10 م والاندفاع بالصدر، مع التدريب على الزفير.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباقات 50 م مع التركيز على النهاية.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): لماذا النهاية أصعب المراحل؟\nالإجابة: لشعور العداء بالتعب الشديد.\nس2 (المستوى المتوقع): من أين نخرج الزفير؟\nالإجابة: من الفم.\nس3 (المستوى المتقدم): كيف ننهي السباق؟\nالإجابة: بزيادة السرعة والاندفاع بالصدر.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ نهاية سباق 30 م بالاندفاع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا ندرب العدو في حالة نقص الأكسجين؟\nالإجابة: لتعويد الجسم على نهاية السباق.\nس3 (المستوى المتقدم): ما الخطأ في التوقف قبل الخط؟\nالإجابة: يفقد الزمن ويخسر المركز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب نهاية السباق."}}, {"focus": "تدريبات السرعة (الجري على المشطين، الدفع بين الزملاء، الوثبات)", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي تدريبات السرعة (الجري في المكان على المشطين، المشي من ثني الركبتين نصفًا، تبادل دفع الزميل، الجري الخفيف وفرد الرجلين، الجري بخطوات واسعة كالوثبات).\n2. يميز هدف كل تدريب.\n3. يبني برنامج تدريب سرعة لأسبوع.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز منخفضة", "المفاهيم": "- تدريبات السرعة\n- تردد الخطوة\n- القوة المميزة بالسرعة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المراحل ويسأل: كيف نطور السرعة بالتدريب؟ (ص 43-44).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج التدريبات الخمسة.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات التدريبات بالتبديل.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط كل تدريب بهدفه.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا ينمي الجري في المكان على المشطين؟\nالإجابة: تردد الخطوة.\nس2 (المستوى المتوقع): ماذا ينمي الجري بخطوات واسعة كالوثبات؟\nالإجابة: القوة المميزة بالسرعة واتساع الخطوة.\nس3 (المستوى المتقدم): ماذا ينمي تبادل دفع الزميل؟\nالإجابة: قوة الرجلين.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر ثلاثة تدريبات للسرعة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ضع برنامجًا لأسبوع.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أي التدريبات أصعب ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تنفيذ برنامجه الأسبوعي للسرعة."}}, {"focus": "سباق 100 م منظم بالأدوار (حكام، ميقاتيون)", "num": 6, "fields": {"المخرجات التعليمية": "1. يؤدي سباق 100 م من البدء المنخفض بالقواعد.\n2. يشارك في تنظيم السباق بدور (حكم بداية، ميقاتي، حكم نهاية، مسجل).\n3. يقارن زمنه بزمنه الأولي.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: ساعات إيقاف\n- أخرى: أعلام\n- أخرى: استمارات تسجيل", "المفاهيم": "- سباق 100 م\n- الميقاتي\n- حكم البداية\n- الحارة", "التهيئة / التمهيد / التعلم القبلي": "يوزع المعلم الأدوار ويعرض الحالات التحكيمية الأساسية (ص 45).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب البدء في المجموعات.\n- الطالب: يتدرب.\n\nالنشاط 3 (20 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: تصفيات ونهائي 100 م بالأدوار وتسجيل الأزمنة.\n- الطالب: يتسابق ويحكم.\n\nالنشاط 4 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: إعلان النتائج.\n- الطالب: يستمع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: مقارنة الزمن بالقياس الأولي.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما دور حكم البداية؟\nالإجابة: الأوامر ورصد البداية الخاطئة.\nس2 (المستوى المتوقع): متى يوقف الميقاتي الساعة؟\nالإجابة: عند مرور الجذع خط النهاية.\nس3 (المستوى المتقدم): ما قرار الخروج من الحارة؟\nالإجابة: الاستبعاد.", "التقويم الختامي": "س1 (مستوى الدعم): ما زمنك مقارنة بالأسبوع الأول؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما دورك في التنظيم؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يحتاج إلى تحسين في سباقك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على متابعة زمنه في 100 م."}}, {"focus": "سباق 200 م وتوزيع الجهد والجري في المنحنى", "num": 7, "fields": {"المخرجات التعليمية": "1. يؤدي سباق 200 م مع الجري في المنحنى بميل خفيف للداخل.\n2. يوزع جهده على مراحل السباق.\n3. يفسر تأثير المنحنى في وضع الجسم.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: مكعبات البدء", "المفاهيم": "- سباق 200 م\n- المنحنى\n- توزيع الجهد", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يميل العداء للداخل في المنحنى؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الجري في المنحنى وتوزيع الجهد.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: جري 50 م في منحنى، ثم 150 م بتوزيع جهد.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق 200 م (أو المسافة المتاحة) بالأدوار.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف يجري العداء في المنحنى؟\nالإجابة: بميل خفيف للداخل.\nس2 (المستوى المتوقع): كيف يوزع الجهد في 200 م؟\nالإجابة: انطلاق قوي ومحافظة في المنحنى وزيادة في المستقيم الأخير.\nس3 (المستوى المتقدم): ما الصفة الإضافية التي يحتاجها عداء 200 م؟\nالإجابة: التحمل.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ 200 م بتوزيع جهد.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين 100 و200 م في المراحل؟\nالإجابة: 200 م يضيف منحنى وتوزيع جهد.\nس3 (المستوى المتقدم): ما زمنك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة القواعد القانونية للسباقات (دليل المعلم ص 45-46)."}}, {"focus": "القواعد القانونية لسباقات المسافات القصيرة والحالات التحكيمية", "num": 8, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية (البدء المنخفض، الحارة، البداية الخاطئة، خط النهاية).\n2. يحلل الحالات التحكيمية ويقرر.\n3. يطبق القواعد في سباق قصير محكّم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: بطاقات الحالات\n- أخرى: مكعبات البدء\n- أخرى: أقماع", "المفاهيم": "- القواعد القانونية\n- البداية الخاطئة\n- الحارة\n- خط النهاية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم بطاقات حالات ويسأل: ما القرار؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح القواعد.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تقرر في الحالات وتعرض.\n- الطالب: يقرر.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق 50 م بحكام يطبقون القواعد.\n- الطالب: يتسابق ويحكم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما قرار البداية الخاطئة؟\nالإجابة: الاستبعاد.\nس2 (المستوى المتوقع): متى ينتهي السباق للعداء؟\nالإجابة: بمرور جذعه خط النهاية.\nس3 (المستوى المتقدم): هل يجوز لمس خط البداية؟\nالإجابة: لا.", "التقويم الختامي": "س1 (مستوى الدعم): عداء دخل حارة زميله، ما القرار؟\nالإجابة: الاستبعاد.\nس2 (المستوى المتوقع): اذكر ثلاث قواعد.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما دور الحكم عند تعادل اثنين؟\nالإجابة: الرجوع إلى التصوير أو الحكام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك مهارات الوحدتين الأولى والثانية قبل الاختبار العملي (1)."}}, {"focus": "الاختبار العملي (1): اللياقة البدنية ورمي الرمح", "num": 9, "fields": {"المخرجات التعليمية": "1. يطبق اختبارات اللياقة (الجلوس من الرقود، الوثب من الثبات، ثني الجذع).\n2. يؤدي رمي الرمح من الاقتراب الكامل بالقواعد.\n3. يقيم تقدمه خلال الأسابيع السابقة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: شريط قياس\n- أخرى: صندوق المرونة\n- أخرى: رماح\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- الاختبار العملي\n- اللياقة\n- رمي الرمح", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات الاختبار ومعاييره.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار فردي في أربع محطات مع تدريب ذاتي للباقين، ويرصد المعلم.\n- الطالب: يؤدي عند دوره.\n\nالنشاط 3 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستمع.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الذي يقيسه ثني الجذع؟\nالإجابة: المرونة.\nس2 (المستوى المتوقع): كم محاولة في رمي الرمح؟\nالإجابة: ثلاث.\nس3 (المستوى المتقدم): من أين يقاس الرمي؟\nالإجابة: من أقرب علامة إلى الحد الداخلي للقوس.", "التقويم الختامي": "س1 (مستوى الدعم): ما العنصر الذي تحسن أكثر؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أدِّ رمي الرمح من الاقتراب.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): ما خطتك للفصل الثاني؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك مراحل سباق العدو قبل الحصة الثانية من الاختبار."}}, {"focus": "الاختبار العملي (1): سباق العدو والاختبار المعرفي القصير", "num": 10, "fields": {"المخرجات التعليمية": "1. يؤدي سباق 100 م من البدء المنخفض بالقواعد.\n2. يجيب عن الاختبار المعرفي القصير (مراحل السباق، الصفات البدنية، قواعد الرمح).\n3. يقيم أداءه بموضوعية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: ساعات إيقاف\n- أخرى: أوراق اختبار\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- الاختبار العملي\n- سباق 100 م\n- الاختبار المعرفي", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم محطات الاختبار (ص 51-52).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: سباق 100 م بالزمن لكل طالب.\n- الطالب: يعدو.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار معرفي قصير كتابي.\n- الطالب: يجيب.\n\nالنشاط 4 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستمع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما مراحل سباقات المسافات القصيرة؟\nالإجابة: البدء، جري المسافة، النهاية.\nس2 (المستوى المتوقع): اذكر صفات عداء المسافات القصيرة.\nالإجابة: القوة، السرعة، التحمل، المرونة، القوة المميزة بالسرعة.\nس3 (المستوى المتقدم): ما لون علامة المحاولة الصحيحة في الرمح؟\nالإجابة: حمراء.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ سباق 100 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر تدريبين لتحسين الرمي.\nالإجابة: الرمي بالأدوات البديلة والرمي من المشي والجري.\nس3 (المستوى المتقدم): ما تقييمك لأدائك في الوحدة؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على مقدمة التمرير في كرة القدم (دليل المعلم ص 53)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف سباقات المسافات القصيرة (100، 200، 400 م، التتابع، الحواجز).\n2. يحدد الصفات البدنية للعداء والمراحل الفنية الثلاث.\n3. يقدر دور هذه السباقات في الرياضة المدرسية.\n\nالحصة 2:\n1. يؤدي البدء المنخفض بأقسامه ودفع القدم الخلفية بقوة.\n2. يميز النقاط الفنية للدفع (مرجحة الرجل الخلفية، ميل الجذع، فرد الحوض والركبة).\n3. يصحح أخطاء البدء لزميله.\n\nالحصة 3:\n1. يؤدي جري المسافة بانسيابية وخطوات أوسع وأكثر ترددًا.\n2. يحرك الذراعين في مدى واسع بحرية واسترخاء.\n3. يفسر أهمية تنظيم الجهد للمرحلة النهائية.\n\nالحصة 4:\n1. يؤدي نهاية السباق بزيادة السرعة والاندفاع بالصدر عند الخط.\n2. يطبق التنفس الصحيح (إخراج الزفير من الفم) في نقص الأكسجين.\n3. يفسر لماذا تعد النهاية أصعب المراحل.\n\nالحصة 5:\n1. يؤدي تدريبات السرعة (الجري في المكان على المشطين، المشي من ثني الركبتين نصفًا، تبادل دفع الزميل، الجري الخفيف وفرد الرجلين، الجري بخطوات واسعة كالوثبات).\n2. يميز هدف كل تدريب.\n3. يبني برنامج تدريب سرعة لأسبوع.\n\nالحصة 6:\n1. يؤدي سباق 100 م من البدء المنخفض بالقواعد.\n2. يشارك في تنظيم السباق بدور (حكم بداية، ميقاتي، حكم نهاية، مسجل).\n3. يقارن زمنه بزمنه الأولي.\n\nالحصة 7:\n1. يؤدي سباق 200 م مع الجري في المنحنى بميل خفيف للداخل.\n2. يوزع جهده على مراحل السباق.\n3. يفسر تأثير المنحنى في وضع الجسم.\n\nالحصة 8:\n1. يتعرف القواعد القانونية (البدء المنخفض، الحارة، البداية الخاطئة، خط النهاية).\n2. يحلل الحالات التحكيمية ويقرر.\n3. يطبق القواعد في سباق قصير محكّم.\n\nالحصة 9:\n1. يطبق اختبارات اللياقة (الجلوس من الرقود، الوثب من الثبات، ثني الجذع).\n2. يؤدي رمي الرمح من الاقتراب الكامل بالقواعد.\n3. يقيم تقدمه خلال الأسابيع السابقة.\n\nالحصة 10:\n1. يؤدي سباق 100 م من البدء المنخفض بالقواعد.\n2. يجيب عن الاختبار المعرفي القصير (مراحل السباق، الصفات البدنية، قواعد الرمح).\n3. يقيم أداءه بموضوعية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 7:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 8:\nالمخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 9:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 10:\nالمخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 6:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 7:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 8:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 9:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف\n\nالحصة 10:\n- التعلم بالنمذجة\n- التعلم الذاتي\n-  معرفي قصير كتابي.\n- الطالب: يجيب.\n\nالنشاط 4 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستمع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاثة من سباقات المسافات القصيرة.\nالإجابة: 100، 200، 400 م.\nس2 (المستوى المتوقع): ما المراحل الفنية؟\nالإجابة: بدء السباق، جري المسافة، نهاية السباق.\nس3 (المستوى المتقدم): اذكر صفتين للعداء.\nالإجابة: السرعة والقوة المميزة بالسرعة.\n\nالحصة 2:\nس1 (مستوى الدعم): أي قدم تدفع بقوة؟\nالإجابة: الخلفية.\nس2 (المستوى المتوقع): كيف يكون الجذع عند الدفع؟\nالإجابة: مائلًا للأمام.\nس3 (المستوى المتقدم): متى يفرد مفصل الحوض والركبة تمامًا؟\nالإجابة: في نهاية مرحلة الدفع.\n\nالحصة 3:\nس1 (مستوى الدعم): كيف تكون الخطوات في جري المسافة؟\nالإجابة: أكثر اتساعًا وترددًا.\nس2 (المستوى المتوقع): كيف تتحرك الذراعان؟\nالإجابة: في مدى واسع بحرية واسترخاء.\nس3 (المستوى المتقدم): لماذا ننظم الجهد؟\nالإجابة: لتوفيره للمرحلة النهائية.\n\nالحصة 4:\nس1 (مستوى الدعم): لماذا النهاية أصعب المراحل؟\nالإجابة: لشعور العداء بالتعب الشديد.\nس2 (المستوى المتوقع): من أين نخرج الزفير؟\nالإجابة: من الفم.\nس3 (المستوى المتقدم): كيف ننهي السباق؟\nالإجابة: بزيادة السرعة والاندفاع بالصدر.\n\nالحصة 5:\nس1 (مستوى الدعم): ماذا ينمي الجري في المكان على المشطين؟\nالإجابة: تردد الخطوة.\nس2 (المستوى المتوقع): ماذا ينمي الجري بخطوات واسعة كالوثبات؟\nالإجابة: القوة المميزة بالسرعة واتساع الخطوة.\nس3 (المستوى المتقدم): ماذا ينمي تبادل دفع الزميل؟\nالإجابة: قوة الرجلين.\n\nالحصة 6:\nس1 (مستوى الدعم): ما دور حكم البداية؟\nالإجابة: الأوامر ورصد البداية الخاطئة.\nس2 (المستوى المتوقع): متى يوقف الميقاتي الساعة؟\nالإجابة: عند مرور الجذع خط النهاية.\nس3 (المستوى المتقدم): ما قرار الخروج من الحارة؟\nالإجابة: الاستبعاد.\n\nالحصة 7:\nس1 (مستوى الدعم): كيف يجري العداء في المنحنى؟\nالإجابة: بميل خفيف للداخل.\nس2 (المستوى المتوقع): كيف يوزع الجهد في 200 م؟\nالإجابة: انطلاق قوي ومحافظة في المنحنى وزيادة في المستقيم الأخير.\nس3 (المستوى المتقدم): ما الصفة الإضافية التي يحتاجها عداء 200 م؟\nالإجابة: التحمل.\n\nالحصة 8:\nس1 (مستوى الدعم): ما قرار البداية الخاطئة؟\nالإجابة: الاستبعاد.\nس2 (المستوى المتوقع): متى ينتهي السباق للعداء؟\nالإجابة: بمرور جذعه خط النهاية.\nس3 (المستوى المتقدم): هل يجوز لمس خط البداية؟\nالإجابة: لا.\n\nالحصة 9:\nس1 (مستوى الدعم): ما الذي يقيسه ثني الجذع؟\nالإجابة: المرونة.\nس2 (المستوى المتوقع): كم محاولة في رمي الرمح؟\nالإجابة: ثلاث.\nس3 (المستوى المتقدم): من أين يقاس الرمي؟\nالإجابة: من أقرب علامة إلى الحد الداخلي للقوس.\n\nالحصة 10:\nس1 (مستوى الدعم): ما مراحل سباقات المسافات القصيرة؟\nالإجابة: البدء، جري المسافة، النهاية.\nس2 (المستوى المتوقع): اذكر صفات عداء المسافات القصيرة.\nالإجابة: القوة، السرعة، التحمل، المرونة، القوة المميزة بالسرعة.\nس3 (المستوى المتقدم): ما لون علامة المحاولة الصحيحة في الرمح؟\nالإجابة: حمراء.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): لماذا يحتاج عداء 400 م إلى التحمل؟\nالإجابة: لطول المسافة بسرعة عالية.\nس2 (المستوى المتوقع): ما سباقات التتابع القصيرة؟\nالإجابة: 4×100 م و4×400 م.\nس3 (المستوى المتقدم): كيف تساعد مساحات المدرسة في تنمية السرعة؟\nالإجابة: بتدريبات متنوعة حسب المساحة المتاحة.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ البدء المنخفض وعدو 20 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الخطأ الذي صححته لزميلك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): لماذا لا نرفع الجذع فجأة بعد الانطلاق؟\nالإجابة: لنحافظ على الدفع وتزايد السرعة.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ 60 م بخطوات واسعة ومسترخية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما أثر التوتر في السرعة؟\nالإجابة: يبطئها.\nس3 (المستوى المتقدم): كيف توزع جهدك في 200 م؟\nالإجابة: سرعة قصوى في البداية ثم محافظة ثم زيادة في النهاية.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ نهاية سباق 30 م بالاندفاع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا ندرب العدو في حالة نقص الأكسجين؟\nالإجابة: لتعويد الجسم على نهاية السباق.\nس3 (المستوى المتقدم): ما الخطأ في التوقف قبل الخط؟\nالإجابة: يفقد الزمن ويخسر المركز.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر ثلاثة تدريبات للسرعة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ضع برنامجًا لأسبوع.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أي التدريبات أصعب ولماذا؟\nالإجابة: يذكر ويعلل.\n\nالحصة 6:\nس1 (مستوى الدعم): ما زمنك مقارنة بالأسبوع الأول؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما دورك في التنظيم؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يحتاج إلى تحسين في سباقك؟\nالإجابة: يذكر.\n\nالحصة 7:\nس1 (مستوى الدعم): أدِّ 200 م بتوزيع جهد.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين 100 و200 م في المراحل؟\nالإجابة: 200 م يضيف منحنى وتوزيع جهد.\nس3 (المستوى المتقدم): ما زمنك؟\nالإجابة: يذكر.\n\nالحصة 8:\nس1 (مستوى الدعم): عداء دخل حارة زميله، ما القرار؟\nالإجابة: الاستبعاد.\nس2 (المستوى المتوقع): اذكر ثلاث قواعد.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما دور الحكم عند تعادل اثنين؟\nالإجابة: الرجوع إلى التصوير أو الحكام.\n\nالحصة 9:\nس1 (مستوى الدعم): ما العنصر الذي تحسن أكثر؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أدِّ رمي الرمح من الاقتراب.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): ما خطتك للفصل الثاني؟\nالإجابة: يذكر.\n\nالحصة 10:\nس1 (مستوى الدعم): أدِّ سباق 100 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر تدريبين لتحسين الرمي.\nالإجابة: الرمي بالأدوات البديلة والرمي من المشي والجري.\nس3 (المستوى المتقدم): ما تقييمك لأدائك في الوحدة؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة سباق 100 م وتحديد مراحله.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تدريب البدء المنخفض.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تمرينات الاسترخاء أثناء الجري.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تدريب نهاية السباق.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على تنفيذ برنامجه الأسبوعي للسرعة.\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على متابعة زمنه في 100 م.\n\nالحصة 7:\nإرشاد لولي الأمر: شجع طالبك على مراجعة القواعد القانونية للسباقات (دليل المعلم ص 45-46).\n\nالحصة 8:\nإرشاد لولي الأمر: راجع مع طالبك مهارات الوحدتين الأولى والثانية قبل الاختبار العملي (1).\n\nالحصة 9:\nإرشاد لولي الأمر: راجع مع طالبك مراحل سباق العدو قبل الحصة الثانية من الاختبار.\n\nالحصة 10:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على مقدمة التمرير في كرة القدم (دليل المعلم ص 53)."}}, {"title": "التمريرة الحائطية", "unit": "كرة القدم (ذكور)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 53-56", "n": 5, "periods": [{"focus": "مفهوم التمرير وأنواعه والتمريرة الحائطية (1-2)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم التمرير وأهميته كخطة جماعية أساسية.\n2. يصف التمريرة الحائطية (1-2) وشروط نجاحها.\n3. يؤدي التمريرة الحائطية من الثبات ثم المشي مع زميل.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- جهاز عرض البيانات", "المفاهيم": "- التمرير\n- التمريرة الحائطية\n- الحائط\n- التوقيت", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف يتجاوز لاعبان مدافعًا واحدًا بتمريرة وعودة؟ (ص 53-54).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح التمرير وأنواعه ونموذج الحائطية: تمرير للزميل (الحائط) والجري خلف المدافع واستلام العودة بلمسة واحدة.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: الحائطية من الثبات ثم المشي ثم الجري الخفيف دون مدافع.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا يمرر الحائط بلمسة واحدة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما التمرير؟\nالإجابة: تبادل الكرة بين أعضاء الفريق.\nس2 (المستوى المتوقع): لماذا سميت الحائطية؟\nالإجابة: لأن الزميل يعيد الكرة كما يعيدها الحائط.\nس3 (المستوى المتقدم): بكم لمسة يعيد الحائط الكرة؟\nالإجابة: لمسة واحدة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الحائطية مع زميلك من المشي.\nالإجابة: يؤديه.\nس2 (المستوى المتو  يؤدي الحائطية من الجري مع مدافع سلبي.\n2. يحدد توقيت التمرير والانطلاق.\n3. يصحح أخطاء الزميل (التمرير المتأخر، الانطلاق البطيء).\n\nالحصة 3:\n1. يؤدي الحائطية مع مدافع إيجابي.\n2. يختار جهة الانطلاق حسب حركة المدافع.\n3. يتعاون مع زميله بالثقة.\n\nالحصة 4:\n1. يوظف الحائطية في تدريب 2 ضد 1 و3 ضد 2 نحو الهدف.\n2. يقرر بين الحائطية والمحاورة والتصويب.\n3. يتعاون في مجموعة هجوم ضد مجموعة دفاع.\n\nالحصة 5:\n1. يوظف الحائطية في لعب 4 ضد 4 بمرميين صغيرين.\n2. يطبق القواعد القانونية في اللعب.\n3. يقيم نجاح الحائطيات في المباراة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n\nالحصة 3:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n\nالحصة 4:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- أخرى: صدريات ملونة\n\nالحصة 5:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- التمرير\n- التمريرة الحائطية\n- الحائط\n- التوقيت\n\nالحصة 2:\n- المدافع السلبي\n- التوقيت\n- الانطلاق\n\nالحصة 3:\n- المدافع الإيجابي\n- جهة الانطلاق\n- القراءة\n\nالحصة 4:\n- 2 ضد 1\n- 3 ضد 2\n- اتخاذ القرار\n\nالحصة 5:\n- 4 ضد 4\n- الهدف المضاعف\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كيف يتجاوز لاعبان مدافعًا واحدًا بتمريرة وعودة؟ (ص 53-54).\n\nالحصة 2:\nيراجع المعلم الحائطية ويضيف مدافعًا ثابتًا.\n\nالحصة 3:\nيسأل المعلم: ماذا لو تحرك المدافع نحو الحائط؟\n\nالحصة 4:\nيعرض المعلم التدريب رقم 2 ص 56 (مجموعة هجوم ومجموعة دفاع، الجري بجوار خط الجانب والتمرير والتصويب).\n\nالحصة 5:\nيعلن المعلم: الهدف بعد حائطية ناجحة يحتسب هدفين.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح التمرير وأنواعه ونموذج الحائطية: تمرير للزميل (الحائط) والجري خلف المدافع واستلام العودة بلمسة واحدة.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: الحائطية من الثبات ثم المشي ثم الجري الخفيف دون مدافع.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا يمرر الحائط بلمسة واحدة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج مع مدافع سلبي.\n- الطالب: يشاهد.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: ثلاثيات (ممرر، حائط، مدافع سلبي) بالتبادل ويصحح الثالث.\n- الطالب: يتدرب ويصحح.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش التوقيت.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الحائطية مع مدافع إيجابي واختيار الجهة.\n- الطالب: يشاهد.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: ثلاثيات بمدافع إيجابي من اليمين واليسار بالتبادل.\n- الطالب: يتدرب.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش قراءة المدافع.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح التدريب بالرسم.\n- الطالب: يشاهد.\n\nالنشاط 3 (22 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات أربعة (هجوم/دفاع) وتبديل العمل كل دقيقتين والمجموعات كل أربع دقائق.\n- الطالب: يتدرب ويقرر.\n\nالنشاط 4 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص القرارات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تخطيط كل فريق لتوظيف الحائطية.\n- الطالب: يخطط.\n\nالنشاط 3 (22 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات 4 ضد 4 بحكام وتسجيل الحائطيات الناجحة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: إحصاء الحائطيات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما التمرير؟\nالإجابة: تبادل الكرة بين أعضاء الفريق.\nس2 (المستوى المتوقع): لماذا سميت الحائطية؟\nالإجابة: لأن الزميل يعيد الكرة كما يعيدها الحائط.\nس3 (المستوى المتقدم): بكم لمسة يعيد الحائط الكرة؟\nالإجابة: لمسة واحدة.\n\nالحصة 2:\nس1 (مستوى الدعم): متى يمرر المهاجم للحائط؟\nالإجابة: عند اقترابه من المدافع.\nس2 (المستوى المتوقع): ما الخطأ عند التمرير المتأخر؟\nالإجابة: يقطع المدافع الكرة.\nس3 (المستوى المتقدم): ما المدافع السلبي؟\nالإجابة: مدافع لا يحاول أخذ الكرة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما الفرق بين المدافع السلبي والإيجابي؟\nالإجابة: الإيجابي يحاول قطع الكرة.\nس2 (المستوى المتوقع): إلى أي جهة ينطلق المهاجم؟\nالإجابة: عكس حركة المدافع.\nس3 (المستوى المتقدم): ماذا يفعل الحائط إذا تابعه المدافع؟\nالإجابة: يحتفظ بالكرة ويحاور.\n\nالحصة 4:\nس1 (مستوى الدعم): كم لاعبًا في كل مجموعة في التدريب؟\nالإجابة: أربعة.\nس2 (المستوى المتوقع): متى يبدل العمل بين المجموعتين؟\nالإجابة: كل دقيقتين.\nس3 (المستوى المتقدم): متى نختار الحائطية في 2 ضد 1؟\nالإجابة: عندما يقترب المدافع من حامل الكرة.\n\nالحصة 5:\nس1 (مستوى الدعم): كم يحتسب الهدف بعد حائطية؟\nالإجابة: هدفين.\nس2 (المستوى المتوقع): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس3 (المستوى المتقدم): كم حائطية نجحت لفريقك؟\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الحائطية مع زميلك من المشي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما شرط نجاح الحائطية؟\nالإجابة: التوقيت والجري الفوري خلف المدافع.\nس3 (المستوى المتقدم): متى تستخدم الحائطية؟\nالإجابة: لتجاوز مدافع واحد قريب.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الحائطية من الجري مع مدافع سلبي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الخطأ الذي صححته؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف يتحرك المهاجم بعد التمرير؟\nالإجابة: ينطلق فورًا خلف المدافع.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ الحائطية مع مدافع إيجابي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف تقرأ حركة المدافع؟\nالإجابة: بالنظر إلى اتجاه جسمه وقدميه.\nس3 (المستوى المتقدم): لماذا تحتاج الحائطية إلى الثقة بين الزميلين؟\nالإجابة: لأن كلًا منهما يعتمد على توقيت الآخر.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ 2 ضد 1 بالحائطية والتصويب.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): متى قررت المحاورة بدل الحائطية؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف نظمت مجموعتك الدفاع؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر موقفًا نجحت فيه الحائطية.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا فشلت بعض الحائطيات؟\nالإجابة: التوقيت أو قراءة المدافع.\nس3 (المستوى المتقدم): كيف تصرفت عند الخسارة؟\nالإجابة: بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تدريب الحائطية مع صديق.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التدرب على التوقيت.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة أمثلة للحائطية في المباريات.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على التدرب على القرار السريع.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على التمريرة البينية (دليل المعلم ص 57)."}}, {"title": "التمريرة البينية", "unit": "كرة القدم (ذكور)", "week": "العاشر", "date": "8-12/11/2026", "pages": "دليل المعلم ص 57-59", "n": 5, "periods": [{"focus": "مفهوم التمريرة البينية وشروط نجاحها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمريرة البينية (بين مدافعين) وتأثيرها في الدفاع.\n2. يميز التمريرة البينية من التمريرات العرضية السهلة.\n3. يؤدي البينية بين قمعين لزميل منطلق.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- جهاز عرض البيانات", "المفاهيم": "- التمريرة البينية\n- الاختراق\n- المكان الشاغر\n- السرعة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: أي التمريرات تفقد الدفاع اتزانه؟ (ص 57).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح البينية وشروطها (سرعة الاستلام وتوقيت الانطلاق والتمرير إلى المكان الشاغر) ونموذج بين قمعين.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: ثلاثيات: ممرر، منطلق، قمعان كمدافعين، بالتبادل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا تضيع التمريرات العرضية السهلة الوقت؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما التمريرة ا  الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج بينية ثم تصويب بلمسة أو لمستين.\n- الطالب: يشاهد.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: قطاران: تمرير بيني لمنطلق يصوب، ثم مع مدافعين، بالتبادل.\n- الطالب: يتدرب.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: متى الحائطية ومتى البينية؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح التدريب.\n- الطالب: يشاهد.\n\nالنشاط 3 (22 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات هجوم ودفاع بالتبادل كل 3 دقائق مع تسجيل البينيات الناجحة.\n- الطالب: يتدرب.\n\nالنشاط 4 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تخطيط الفرق.\n- الطالب: يخطط.\n\nالنشاط 3 (22 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات 5 ضد 5 بحكام وتسجيل البينيات.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: إحصاء.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما التمريرة البينية؟\nالإجابة: تمريرة لزميل من بين مدافعين يستقبلها خلفهما.\nس2 (المستوى المتوقع): ما أثرها في الدفاع؟\nالإجابة: تخترقه وتفقده اتزانه.\nس3 (المستوى المتقدم): على ماذا يتوقف نجاحها؟\nالإجابة: سرعة المستقبل والتوقيت.\n\nالحصة 2:\nس1 (مستوى الدعم): متى ينطلق المستقبل؟\nالإجابة: لحظة تمرير الكرة لا قبلها.\nس2 (المستوى المتوقع): ما التسلل مبسطًا؟\nالإجابة: وجود المهاجم خلف آخر مدافع قبل تمرير الكرة.\nس3 (المستوى المتقدم): ما الذي يصعب البينية مع مدافعين متحركين؟\nالإجابة: إغلاق الفراغ بسرعة.\n\nالحصة 3:\nس1 (مستوى الدعم): ماذا يفعل المستقبل بعد البينية؟\nالإجابة: يسيطر ويصوب أو يمرر.\nس2 (المستوى المتوقع): متى نختار الحائطية بدل البينية؟\nالإجابة: عند مدافع واحد قريب.\nس3 (المستوى المتقدم): ما خطأ الاستلام المتأخر؟\nالإجابة: يلحق المدافع بالكرة.\n\nالحصة 4:\nس1 (مستوى الدعم): ما ميزة التفوق العددي للهجوم؟\nالإجابة: يفتح فراغات للبينية.\nس2 (المستوى المتوقع): متى تصعب البينية في 4 ضد 3؟\nالإجابة: عندما يتراجع الدفاع ويغلق الفراغ.\nس3 (المستوى المتقدم): كم بينية نجحت لمجموعتك؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): كم يحتسب الهدف بعد البينية؟\nالإجابة: هدفين.\nس2 (المستوى المتوقع): ما قرار الحكم عند التسلل؟\nالإجابة: ركلة حرة للدفاع.\nس3 (المستوى المتقدم): كم بينية نجحت لفريقك؟\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ البينية بين القمعين لزميل منطلق.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): متى تكون التمريرة العرضية غير مؤثرة؟\nالإجابة: عندما تذهب لزميل قريب غير مراقب فتعطي الدفاع وقتًا.\nس3 (المستوى المتقدم): إلى أين تمرر البينية؟\nالإجابة: إلى المكان الشاغر خلف المدافعين.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ البينية مع مدافعين متحركين.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف تتجنب التسلل؟\nالإجابة: بالانطلاق لحظة التمرير.\nس3 (المستوى المتقدم): ما الخطأ عند التمرير القوي جدًا؟\nالإجابة: تسبق الكرة المستقبل أو تخرج.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ البينية ثم التصويب.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر موقفًا تناسبه البينية.\nالإجابة: مدافعان متباعدان وفراغ خلفهما.\nس3 (المستوى المتقدم): ما الخطأ الذي صححته لزميلك؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ 3 ضد 2 بالبينية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف يتحرك المهاجمون لفتح الفراغ؟\nالإجابة: بالانتشار وجذب المدافعين.\nس3 (المستوى المتقدم): ما قرارك الأفضل اليوم؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر موقفًا نجحت فيه البينية.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا فشلت بعض البينيات؟\nالإجابة: التوقيت أو قوة التمرير.\nس3 (المستوى المتقدم): كيف تصرفت مع قرار الحكم؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة أمثلة للبينية.\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طالبك قاعدة التسلل مبسطة.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التدرب على التصويب بعد الاستلام.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على التدرب في مجموعات.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على مهارات حارس المرمى (دليل المعلم ص 60)."}}, {"title": "مهارات حارس مرمى كرة القدم", "unit": "كرة القدم (ذكور)", "week": "الحادي عشر", "date": "15-19/11/2026", "pages": "دليل المعلم ص 60-64", "n": 5, "periods": [{"focus": "صفات حارس المرمى والوقفة الأساسية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف صفات حارس المرمى البدنية والإرادية ومهاراته.\n2. يؤدي الوقفة الأساسية للحارس (القدمان متباعدتان، الركبتان منثنيتان، الذراعان أمامًا).\n3. يفسر أهمية الوقفة الأساسية في سرعة الاستجابة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرمى\n- أخرى: قفازات حارس\n- صورة توضيحية", "المفاهيم": "- حارس المرمى\n- الوقفة الأساسية\n- سرعة الاستجابة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الصفات التي يتميز بها حارس المرمى؟ (ص 60).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالحارس.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الصفات والمهارات ونموذج الوقفة الأساسية والتحرك جانبًا منها.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: وقفة أساسية وتحرك بالإشارة ثم استقبال كرات مرمية خفيفة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة رد الفعل: الحارس يلمس الكرة المرمية إلى الجانبين.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر صفتين بدنيتين للحارس.\nالإجابة: الرشاقة والسرعة.\nس2 (المستوى المتوقع): اذكر سمة إرادية.\nالإجابة: الشجاعة.\nس3 (المستوى المتقدم): كيف تكون الوقفة الأساسية؟\nالإجابة: القدمان متباعدتان والركبتان منثنيتان والذراعان أمامًا.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوقفة الأساسية والتحرك جانبًا.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا تنثني الركبتان؟\nالإجابة: للتحرك السريع في أي اتجاه.\nس3 (المستوى المتقدم): اذكر مهارات الحارس.\nالإجابة: المسك الأرضية والمتوسطة والعالية، الضرب بالقبضة، الرمي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الوقفة والتحرك."}}, {"focus": "مسك الكرة الأرضية (من الوقوف مع ثني الجذع، ومن الجثو)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي مسك الكرة الأرضية بالطريقتين.\n2. يختار الطريقة المناسبة حسب سرعة الكرة.\n3. يطبق النقاط الفنية (القدمان متوازيتان، الجسم خلف الكرة، الضم للصدر).", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرمى\n- أخرى: أقماع", "المفاهيم": "- الكرة الأرضية\n- الجسم خلف الكرة\n- الضم للصدر", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يضع الحارس جسمه خلف الكرة؟ (ص 61).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الطريقتين بالنقاط الفنية.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: دحرجة كرات أرضية بسرعات مختلفة والمسك بالطريقتين.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: الحارس يمسك 10 كرات أرضية دون تسرب.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف تكون القدمان عند مسك الكرة الأرضية؟\nالإجابة: متوازيتين ومتباعدتين مسافة لا تسمح بمرور الكرة.\nس2 (المستوى المتوقع): ماذا نفعل بعد لمس الكرة للكفين؟\nالإجابة: نرفعها ونضمها للصدر.\nس3 (المستوى المتقدم): متى نمسك من الجثو؟\nالإجابة: للكرات السريعة أو الزلقة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مسك الكرة الأرضية من الوقوف مع ثني الجذع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الخطأ في تباعد القدمين كثيرًا؟\nالإجابة: تمر الكرة بينهما.\nس3 (المستوى المتقدم): لماذا تنتشر الأصابع لمواجهة الكرة؟\nالإجابة: لتغطية مساحة أكبر ومسك آمن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على مسك الكرات الأرضية."}}, {"focus": "مسك الكرة متوسطة الارتفاع", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف الكرة متوسطة الارتفاع (بين الركبتين والرأس).\n2. يؤدي مسكها بوضع الكفين متوازيتين وضمها بالساعدين للصدر.\n3. يميز متى يستخدم كل نوع من المسك.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرمى\n- أخرى: أقماع", "المفاهيم": "- الكرة متوسطة الارتفاع\n- راحتا اليدين\n- الضم بالساعدين", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الأرضية ويسأل: ماذا لو جاءت الكرة في مستوى البطن؟ (ص 62).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج المسك بالنقاط الفنية.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: رمي كرات متوسطة ثم تصويبات خفيفة بالقدم والمسك.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة مسك 10 كرات متوسطة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الكرة متوسطة الارتفاع؟\nالإجابة: بين الركبتين ومستوى الرأس.\nس2 (المستوى المتوقع): كيف توجه راحتا اليدين؟\nالإجابة: باتجاه الكرة والأصابع منتشرة.\nس3 (المستوى المتقدم): ماذا نفعل بعد وصول الكرة لليدين؟\nالإجابة: نرفعها بالساعدين ونضمها للصدر.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مسك كرة متوسطة من تصويبة خفيفة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين مسك الأرضية والمتوسطة؟\nالإجابة: الأرضية بثني الجذع والأصابع لأسفل، والمتوسطة بالكفين أمامًا.\nس3 (المستوى المتقدم): لماذا نضم الكرة للصدر؟\nالإجابة: لتأمينها من الارتداد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب مع صديق يصوب بخفة."}}, {"focus": "مسك الكرة العالية فوق الرأس من الوثب", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي مسك الكرة العالية بالوثب بقدم واحدة ورفع الركبة الأمامية والذراعين والإبهامان متلامسان.\n2. يمتص قوة الكرة من الرسغين والمرفقين والكتفين وينزل على القدم الخلفية.\n3. يطبق الحماية والاتزان أثناء الوثب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرمى\n- أخرى: مراتب", "المفاهيم": "- الكرة العالية\n- الوثب بقدم واحدة\n- الإبهامان\n- الامتصاص", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف يمسك الحارس كرة فوق رأسه لا يمكن وضع الجسم خلفها؟ (ص 63).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج المسك العالي بالنقاط الفنية.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: رمي كرات عالية والمسك من الوثب، ثم من كرات عرضية.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة مسك 10 كرات عالية.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): بكم قدم يثب الحارس؟\nالإجابة: بقدم واحدة.\nس2 (المستوى المتوقع): لماذا ترفع الركبة الأمامية؟\nالإجابة: للحماية والاتزان.\nس3 (المستوى المتقدم): كيف يكون الإبهامان؟\nالإجابة: متلامسين تقريبًا خلف الكرة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مسك الكرة العالية من الوثب.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): من أين يمتص الحارس قوة الكرة؟\nالإجابة: من الرسغين والمرفقين والكتفين.\nس3 (المستوى المتقدم): على أي قدم ينزل الحارس؟\nالإجابة: على القدم الخلفية بثني الركبة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الوثب ومسك الكرات العالية بأمان."}}, {"focus": "ضرب الكرة بقبضة اليد ورمي الكرة وتدريبات مركبة للحارس", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي ضرب الكرة بقبضة اليد للكرات التي يصعب مسكها.\n2. يؤدي رمي الكرة لبدء الهجوم بدقة.\n3. يوظف مهارات الحارس في تدريب مركب ضد تصويبات.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرمى\n- أخرى: أقماع\n- أخرى: مراتب", "المفاهيم": "- الضرب بقبضة اليد\n- رمي الكرة\n- بدء الهجوم", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يفعل الحارس إذا تعذر المسك في الزحام؟ (ص 64).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الضرب بالقبضة والرمي بيد واحدة ورمي الكرة لبدء الهجوم.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب مركب: تصويبات أرضية ومتوسطة وعالية ثم رمي الكرة لزميل في الجناح.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: الحارس ضد 5 تصويبات.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): متى يضرب الحارس الكرة بالقبضة؟\nالإجابة: عند صعوبة المسك في الزحام.\nس2 (المستوى المتوقع): لماذا يرمي الحارس الكرة بدل ركلها أحيانًا؟\nالإجابة: للدقة في بدء الهجوم.\nس3 (المستوى المتقدم): اذكر مهارات الحارس الخمس.\nالإجابة: المسك الأرضية والمتوسطة والعالية، الضرب بالقبضة، الرمي.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التدريب المركب.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما المهارة الأصعب لديك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف يبدأ الحارس الهجوم بسرعة؟\nالإجابة: برمية دقيقة لزميل حر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة مهارات الوحدة قبل التطبيقات والاختبار القصير."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف صفات حارس المرمى البدنية والإرادية ومهاراته.\n2. يؤدي الوقفة الأساسية للحارس (القدمان متباعدتان، الركبتان منثنيتان، الذراعان أمامًا).\n3. يفسر أهمية الوقفة الأساسية في سرعة الاستجابة.\n\nالحصة 2:\n1. يؤدي مسك الكرة الأرضية بالطريقتين.\n2. يختار الطريقة المناسبة حسب سرعة الكرة.\n3. يطبق النقاط الفنية (القدمان متوازيتان، الجسم خلف الكرة، الضم للصدر).\n\nالحصة 3:\n1. يتعرف الكرة متوسطة الارتفاع (بين الركبتين والرأس).\n2. يؤدي مسكها بوضع الكفين متوازيتين وضمها بالساعدين للصدر.\n3. يميز متى يستخدم كل نوع من المسك.\n\nالحصة 4:\n1. يؤدي مسك الكرة العالية بالوثب بقدم واحدة ورفع الركبة الأمامية والذراعين والإبهامان متلامسان.\n2. يمتص قوة الكرة من الرسغين والمرفقين والكتفين وينزل على القدم الخلفية.\n3. يطبق الحماية والاتزان أثناء الوثب.\n\nالحصة 5:\n1. يؤدي ضرب الكرة بقبضة اليد للكرات التي يصعب مسكها.\n2. يؤدي رمي الكرة لبدء الهجوم بدقة.\n3. يوظف مهارات الحارس في تدريب مركب ضد تصويبات.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج :\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: وقفة أساسية وتحرك بالإشارة ثم استقبال كرات مرمية خفيفة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة رد الفعل: الحارس يلمس الكرة المرمية إلى الجانبين.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الطريقتين بالنقاط الفنية.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: دحرجة كرات أرضية بسرعات مختلفة والمسك بالطريقتين.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: الحارس يمسك 10 كرات أرضية دون تسرب.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج المسك بالنقاط الفنية.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: رمي كرات متوسطة ثم تصويبات خفيفة بالقدم والمسك.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة مسك 10 كرات متوسطة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج المسك العالي بالنقاط الفنية.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: رمي كرات عالية والمسك من الوثب، ث  (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستنتع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): متى تختار الحائطية؟\nالإجابة: مدافع واحد قريب.\nس2 (المستوى المتوقع): متى تختار البينية؟\nالإجابة: مدافعان بينهما فراغ.\nس3 (المستوى المتقدم): ما شرط التصويب اليوم؟\nالإجابة: تمريرة حائطية أو بينية قبله.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف يقرأ الحارس اتجاه التصويبة؟\nالإجابة: من وضع قدم الارتكاز والجذع.\nس2 (المستوى المتوقع): أي مهارة لكرة أرضية سريعة؟\nالإجابة: المسك من الجثو.\nس3 (المستوى المتقدم): ماذا يفعل الحارس في 2 ضد الحارس؟\nالإجابة: يتقدم لتضييق الزاوية.\n\nالحصة 3:\nس1 (مستوى الدعم): ما دورك الأول والثاني؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اذكر قاعدة طبقتها.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كم تمريرة حائطية أو بينية نجحت؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): كم تمريرة بينية نجحت للفريقين؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كم تصديًا للحارسين؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما دور المحلل؟\nالإجابة: تسجيل الإحصاءات.\n\nالحصة 5:\nس1 (مستوى الدعم): على ماذا يتوقف نجاح البينية؟\nالإجابة: سرعة المستقبل والتوقيت.\nس2 (المستوى المتوقع): بكم لمسة يعيد الحائط الكرة؟\nالإجابة: لمسة واحدة.\nس3 (المستوى المتقدم): اذكر مهارتين للحارس.\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ 3 ضد 2 بالتمريرتين.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما القرار الصحيح الذي اتخذته؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ساعدت زملاءك؟\nالإجابة: يذكر.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ دور الحارس ضد 5 تصويبات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما المهارة التي نجحت أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصوب على حارس يتقدم؟\nالإجابة: بالتمرير للزميل أو التصويب بجانبه.\n\nالحصة 3:\nس1 (مستوى الدعم): قيّم أداء الحارس في فريقك.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الذي يحتاج إليه فريقك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت مع الحكم؟\nالإجابة: احترمته.\n\nالحصة 4:\nس1 (مستوى الدعم): حلل سبب فوز الفريق الفائز.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الذي يحتاج إليه الحارس؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تحسن فريقك المرة القادمة؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): أدِّ محطات الاختبار.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما المهارة التي أتقنتها أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما خطتك لتحسين الأضعف؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على التدرب على القرار السريع.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تبادل أدوار الحراسة والتصويب.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على مراجعة النقاط الفنية للمهارات.\n\nالحصة 4:\nإرشاد لولي الأمر: راجع مع طالبك مهارات الوحدة قبل الاختبار القصير.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على مفهوم الإدارة الرياضية (دليل المعلم ص 80)."}}, {"title": "الإدارة الرياضية", "unit": "التنظيم والإدارة في الرياضة المدرسية", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 80-83", "n": 5, "periods": [{"focus": "مفهوم الإدارة الرياضية وأهميتها ومجالاتها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم الإدارة الرياضية.\n2. يفسر أهميتها للعاملين في المجال الرياضي.\n3. يقدر دور الإدارة في نجاح المؤسسات الرياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- جهاز عرض البيانات\n- السبورة الذكية\n- الكتاب", "المفاهيم": "- الإدارة الرياضية\n- الموارد\n- المؤسسات الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الذي يجعل بطولة مدرسية ناجحة غير اللاعبين؟ (ص 80).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة ذهنية وربط بالمهرجانات المدرسية.\n- الطالب: يشارك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض المفهوم والأهمية والمجالات (حكومية، خاصة).\n- الطالب: يستمع ويدون.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تحلل مثالًا لحدث رياضي مدرسي وتحدد ما احتاجه من إدارة.\n- الطالب: يحلل ويعرض.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يستنتج الطلبة تعريفًا بكلماتهم.\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الإدارة الرياضية؟\nالإجابة: استخدام الموارد المتاحة بكفاءة لتحقيق أهداف المؤسسة الرياضية.\nس2 (المستوى المتوقع): لماذا أصبحت ضرورة؟\nالإجابة: لتنظيم العمل الرياضي بأنواعه.\nس3 (المستوى المتقدم): اذكر مجالًا للإدارة الرياضية.\nالإجابة: المؤسسات الحكومية أو الخاصة.", "التقويم الختامي": "س1 (مستوى الدعم): عرّف الإدارة الرياضية بكلماتك.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): متى نستخدم وظيفتين أو ثلاثًا فقط من وظائف الإدارة؟\nالإجابة: عندما تكون الموارد محدودة والعمل بسيطًا.\nس3 (المستوى المتقدم): ما الذي احتاجه مهرجان مدرستكم من إدارة؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك دور الإدارة في الأندية والمدارس."}}, {"focus": "وظائف الإدارة الرياضية: التخطيط والتنظيم", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف وظيفتي التخطيط والتنظيم.\n2. يميز بين التخطيط (الأهداف والخطوات) والتنظيم (توزيع المهام).\n3. يضع خطة مبسطة لنشاط رياضي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: نماذج خطط\n- الكتاب", "المفاهيم": "- التخطيط\n- التنظيم\n- الأهداف\n- توزيع المهام", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: قبل تنظيم بطولة، بماذا نبدأ؟ (ص 83).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح التخطيط والتنظيم بأمثلة.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تضع خطة ليوم رياضي (هدف
