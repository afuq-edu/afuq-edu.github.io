ثم 2 ضد 2 بالتبادل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة 1 ضد 1.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالوثب.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الضرب الساحق والدفاع بيد واحدة.\n- الطالب: يشاهد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب مركب: إعداد، ضرب، دفاع بالتبادل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة مصغرة 4 ضد 4.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: محطات: جري 50 م بالزمن، الوثب الطويل من الثبات، الجلوس من الرقود في دقيقة؛ يسجل كل طالب نتائجه بينما يتدرب الباقون ذاتيًا.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة النتائج بالجداول (ص 28-31) ويستنتجون مستواهم.\n- الطالب: يستنتج.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تحديد هدف شخصي للفصل.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): اذكر وحدات الفصل الأربع.\nالإجابة: الإعداد البدني، مسابقات الميدان والمضمار، كرة القدم، التنظيم والإدارة.\nس2 (المستوى المتوقع): ما ترتيب الإحماء العام؟\nالإجابة: من الخفيف إلى الأقوى.\nس3 (المستوى المتقدم): لماذا نحمي العضلات بالإحماء؟\nالإجابة: لرفع حرارتها ومرونتها.\n\nالحصة 2:\nس1 (مستوى الدعم): كم خطوة إيقاع في رمي الرمح؟\nالإجابة: خمس.\nس2 (المستوى المتوقع): بأي قدم يبدأ دوران القرص؟\nالإجابة: مشط اليسرى.\nس3 (المستوى المتقدم): ما خطأ الرمي من الجانب؟\nالإجابة: يجب الرمي من فوق الكتف.\n\nالحصة 3:\nس1 (مستوى الدعم): متى تفشل المحاورة من حيث التوقيت؟\nالإجابة: عندما يكون المنافس بعيدًا.\nس2 (المستوى المتوقع): أين ثقل الجسم في المهاجمة؟\nالإجابة: على القدم الثابتة.\nس3 (المستوى المتقدم): متى نفضل التمرير؟\nالإجابة: عندما يكون الزميل حرًا.\n\nالحصة 4:\nس1 (مستوى الدعم): كم خطوة في اقتراب الضرب الساحق؟\nالإجابة: خطوتان.\nس2 (المستوى المتوقع): من أي وقفة يبدأ الدفاع؟\nالإجابة: الاستعداد العميقة.\nس3 (المستوى المتقدم): كم لمسة للفريق؟\nالإجابة: ثلاث.\n\nالحصة 5:\nس1 (مستوى الدعم): ما الذي يقيسه الوثب الطويل من الثبات؟\nالإجابة: القدرة العضلية.\nس2 (المستوى المتوقع): ما الذي يقيسه الجلوس من الرقود؟\nالإجابة: التحمل العضلي.\nس3 (المستوى المتقدم): لماذا نقيس في بداية الفصل؟\nالإجابة: لتحديد المستوى ومتابعة التقدم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاث قواعد للأمن والسلامة.\nالإجابة: الصافرة، الإحماء، الحذاء.\nس2 (المستوى المتوقع): صمم إحماءً عامًا بخمس حركات.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما علاقة الإعداد البدني بالإصابة؟\nالإجابة: يقلل احتمالها برفع جاهزية العضلات والمفاصل.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ رمي الرمح من الحركة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ قذف القرص من الحركة.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): ما الذي ستطوره ولماذا؟\nالإجابة: يذكر ويعلل.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ المهاجمة من الجانب.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): اذكر أنواع المحاورة.\nالإجابة: من الأمام والجانب والخلف.\nس3 (المستوى المتقدم): كيف ساعدت زميلك في 2 ضد 1؟\nالإجابة: بالتحرك لمساحة خالية.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ الضرب الساحق المواجه.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما خطأ الكرة الخارجة عند الضرب؟\nالإجابة: عدم تغطيتها باليد.\nس3 (المستوى المتقدم): كيف شعرت في المباراة؟\nالإجابة: يعبر.\n\nالحصة 5:\nس1 (مستوى الدعم): سجل نتائجك الثلاث.\nالإجابة: يسجل.\nس2 (المستوى المتوقع): ما هدفك البدني للفصل؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ستحقق هدفك؟\nالإجابة: بخطة تدريب أسبوعية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك خطة الفصل في دليل المعلم ص 11-13.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مراجعة مراحل الرمي والقذف.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التدرب مع صديق على المحاورة والمهاجمة.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على ممارسة الكرة الطائرة مع الأصدقاء.\n\nالحصة 5:\nإرشاد لولي الأمر: ساعد طالبك على الالتزام بهدفه البدني وتسجيل تقدمه."}}, {"title": "التهيئة (الإحماء والتهدئة)", "unit": "الإعداد البدني", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 15-20", "n": 5, "periods": [{"focus": "مفهوم الإحماء وأهدافه الفسيولوجية والنفسية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم الإحماء وأهميته.\n2. يصنف أهداف الإحماء إلى فسيولوجية ونفسية.\n3. يربط بين الإحماء والوقاية من الإصابة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- جهاز عرض البيانات\n- السبورة الذكية\n- أخرى: أقماع", "المفاهيم": "- الإحماء\n- الأهداف الفسيولوجية\n- الأهداف النفسية\n- درجة حرارة الجسم", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يحتاج المحرك إلى التسخين؟ ويربطه بالعضلات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض الأهداف الفسيولوجية (سرعة القلب، اتساع الأوعية، التهوية، الحرارة) والنفسية (الانتباه، الدافعية) ص 17.\n- الطالب: يستمع ويدون.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصنف بطاقات الأهداف وتعرض مثالًا لكل هدف.\n- الطالب: يصنف ويعرض.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقيس الطلبة النبض قبل الإحماء وبعده ويستنتجون.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما مهمة الإحماء؟\nالإجابة: رفع حرارة الجسم والعضلات وتهيئة الجهاز القلبي التنفسي.\nس2 (المستوى المتوقع): اذكر هدفًا فسيولوجيًا.\nالإجابة: زيادة سرعة ضربات القلب.\nس3 (المستوى المتقدم): اذكر هدفًا نفسيًا.\nالإجابة: رفع شدة الانتباه.", "التقويم الختامي": "س1 (مستوى الدعم): صنف: زيادة التهوية الرئوية.\nالإجابة: فسيولوجي.\nس2 (المستوى المتوقع): كيف يقلل الإحماء الإصابات؟\nالإجابة: يزيد مطاطية العضلات وسرعة التوصيل العصبي.\nس3 (المستوى المتقدم): متى تزداد أهمية الإحماء؟\nالإجابة: عندما يكون النشاط عنيفًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك أهداف الإحماء (دليل المعلم ص 17)."}}, {"focus": "الإحماء العام: أنواعه وتمريناته ومدته", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز الإحماء العام من الخاص.\n2. يؤدي تمرينات الإحماء العام بسرعة بطيئة نسبيًا وفترات راحة قصيرة.\n3. يصمم إحماءً عامًا لمدة محددة.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حبال وثب\n- أخرى: كرات", "المفاهيم": "- الإحماء العام\n- الإحماء الخاص\n- السرعة\n- فترات الراحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الأهداف ويسأل: ما الفرق بين إحماء عام يصلح لكل نشاط وإحماء يخص الكرة الطائرة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الإحماء العام (مشي، جري، وثب بالحبل، تحريك المفاصل، إطالة) مع شرح السرعة والراحة ص 19-20.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصمم إحماءً عامًا لمدة 8 دقائق وتنفذه.\n- الطالب: يصمم وينفذ.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة إحماء من اختيار المجموعة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الإحماء العام؟\nالإجابة: تمرينات عامة ترفع حرارة الجسم وتهيئ أجهزته.\nس2 (المستوى المتوقع): كيف تكون سرعة تمرينات الإحماء العام؟\nالإجابة: بطيئة نسبيًا.\nس3 (المستوى المتقدم): ما الإحماء الخاص؟\nالإجابة: الجزء الثاني الذي يهيئ الجسم للنشاط المحدد.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر خمسة تمرينات للإحماء العام.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا تكون فترات الراحة قصيرة؟\nالإجابة: للمحافظة على ارتفاع الحرارة.\nس3 (المستوى المتقدم): ما مدة الإحماء العام المناسبة؟\nالإجابة: نحو 8-10 دقائق.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على أداء إحماء عام قبل أي نشاط رياضي."}}, {"focus": "الإحماء الخاص لأنشطة مختلفة", "num": 3, "fields": {"المخرجات التعليمية": "1. يحدد تمرينات الإحماء الخاص لنشاط محدد (رمي الرمح، العدو، كرة القدم).\n2. يؤدي إحماءً خاصًا متكاملًا بعد العام.\n3. يقيم مناسبة إحماء زميله للنشاط.", "المستوى المعرفي": "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: رماح\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مكعبات البدء", "المفاهيم": "- الإحماء الخاص\n- خصوصية النشاط\n- الاستعداد البدني", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الحركات التي يحتاجها رامي الرمح قبل الرمية؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج إحماء خاص لثلاثة أنشطة (الرمح، العدو، كرة القدم).\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل مجموعة تختار نشاطًا وتصمم إحماءه الخاص وتنفذه، وتقيّمها مجموعة أخرى ببطاقة.\n- الطالب: يصمم ويقيّم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش: لماذا يختلف الإحماء الخاص من نشاط لآخر؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): متى يأتي الإحماء الخاص؟\nالإجابة: في الجزء الثاني من زمن الإحماء.\nس2 (المستوى المتوقع): اذكر تمرينًا للإحماء الخاص للعدو.\nالإجابة: الانطلاق من البدء المنخفض 10 م.\nس3 (المستوى المتقدم): ما هدف الإحماء الخاص؟\nالإجابة: الوصول بأعضاء الجسم إلى أفضل درجة استعداد للنشاط.", "التقويم الختامي": "س1 (مستوى الدعم): صمم إحماءً خاصًا لكرة القدم.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): قيّم إحماء زميلك بمعيارين.\nالإجابة: مناسبته للنشاط وتدرجه.\nس3 (المستوى المتقدم): لماذا لا نكتفي بالإحماء العام قبل رمي الرمح؟\nالإجابة: لأن الرمي يحتاج إلى تهيئة الكتف والجذع خاصة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تصميم إحماء خاص لرياضته المفضلة."}}, {"focus": "التهدئة: مفهومها وتمريناتها وأهميتها", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم التهدئة وأهميتها.\n2. يؤدي تمرينات التهدئة (مشي، تنفس، إطالة) بعد الجهد.\n3. يفسر لماذا لا نتوقف فجأة بعد الجهد.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- جهاز عرض البيانات", "المفاهيم": "- التهدئة\n- الشد العضلي\n- الإطالة\n- التنفس", "التهيئة / التمهيد / التعلم القبلي": "بعد جري قصير يسأل المعلم: ماذا لو جلسنا الآن فجأة؟ ويقدم التهدئة ص 20.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة بجهد متوسط 8 دقائق.\n- الطالب: يلعب.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التهدئة: مشي، تنفس عميق، إطالة ثابتة للعضلات العاملة، مع الشرح.\n- الطالب: يقلد.\n\nالنشاط 4 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصمم تهدئة لنشاط وتنفذها.\n- الطالب: يصمم وينفذ.\n\nالنشاط 5 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقيس الطلبة النبض بعد اللعبة وبعد التهدئة ويستنتجون.\n- الطالب: يستنتج.", "التقويم التكويني": "س1 (مستوى الدعم): ما التهدئة؟\nالإجابة: تمارين تؤدى لتهدئة عضلات الجسم بعد النشاط.\nس2 (المستوى المتوقع): ما ضرر التوقف المفاجئ؟\nالإجابة: الشد العضلي والدوار.\nس3 (المستوى المتقدم): اذكر تمرينًا للتهدئة.\nالإجابة: الإطالة الثابتة.", "التقويم الختامي": "س1 (مستوى الدعم): صمم تهدئة بثلاث خطوات.\nالإجابة: مشي، تنفس، إطالة.\nس2 (المستوى المتوقع): ماذا حدث للنبض بعد التهدئة؟\nالإجابة: انخفض تدريجيًا.\nس3 (المستوى المتقدم): لماذا تساوي التهدئة الإحماء في الأهمية؟\nالإجابة: لأنها تعيد الجسم إلى حالته الطبيعية وتمنع الإصابة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ذكّر طالبك بالتهدئة بعد اللعب (دليل المعلم ص 20)."}}, {"focus": "الإرشادات الصحية لممارسة النشاط البدني وتطبيق قيادة الإحماء والتهدئة", "num": 5, "fields": {"المخرجات التعليمية": "1. يذكر الإرشادات الصحية قبل النشاط وأثناءه وبعده (التدرج، التوقف عند الألم، شرب الماء، تجنب الحمام الساخن).\n2. يقود إحماءً وتهدئة كاملين لمجموعة.\n3. يقدر الفوائد الصحية للنشاط البدني.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: كرات\n- أخرى: بطاقات الإرشادات", "المفاهيم": "- الإرشادات الصحية\n- الفوائد الصحية\n- القيادة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الإرشادات الصحية ص 18 ويسأل: متى يجب التوقف عن النشاط؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض الإرشادات والفوائد الصحية.\n- الطالب: يستمع.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل مجموعة يقود أحد أفرادها الإحماء العام والخاص (8 دقائق) ثم نشاطًا قصيرًا ثم التهدئة، بالتناوب على القيادة وتقييم الأقران.\n- الطالب: يقود ويقيّم.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش: ما أفضل إحماء رأيتموه ولماذا؟\n- الطالب: يستنتج.", "التقويم التكويني": "س1 (مستوى الدعم): متى نتوقف عن النشاط فورًا؟\nالإجابة: عند ألم الصدر أو الدوخة أو الغثيان.\nس2 (المستوى المتوقع): هل نمارس النشاط مع الحمى؟\nالإجابة: لا.\nس3 (المستوى المتقدم): اذكر فائدة صحية للنشاط.\nالإجابة: حرق السعرات وتحسين اللياقة القلبية.", "التقويم الختامي": "س1 (مستوى الدعم): قُد إحماءً خاصًا بنشاط تختاره.\nالإجابة: يقود.\nس2 (المستوى المتوقع): لماذا نتجنب الحمام الساخن بعد النشاط مباشرة؟\nالإجابة: لتجنب هبوط الضغط والدوار.\nس3 (المستوى المتقدم): قيّم قيادة زميلك للتهدئة.\nالإجابة: يذكر نقطة قوة ونقطة تحسين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك الإرشادات الصحية للنشاط (دليل المعلم ص 18)، وراجعا مفهوم اللياقة البدنية ص 21."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم الإحماء وأهميته.\n2. يصنف أهداف الإحماء إلى فسيولوجية ونفسية.\n3. يربط بين الإحماء والوقاية من الإصابة.\n\nالحصة 2:\n1. يميز الإحماء العام من الخاص.\n2. يؤدي تمرينات الإحماء العام بسرعة بطيئة نسبيًا وفترات راحة قصيرة.\n3. يصمم إحماءً عامًا لمدة محددة.\n\nالحصة 3:\n1. يحدد تمرينات الإحماء الخاص لنشاط محدد (رمي الرمح، العدو، كرة القدم).\n2. يؤدي إحماءً خاصًا متكاملًا بعد العام.\n3. يقيم مناسبة إحماء زميله للنشاط.\n\nالحصة 4:\n1. يتعرف مفهوم التهدئة وأهميتها.\n2. يؤدي تمرينات التهدئة (مشي، تنفس، إطالة) بعد الجهد.\n3. يفسر لماذا لا نتوقف فجأة بعد الجهد.\n\nالحصة 5:\n1. يذكر الإرشادات الصحية قبل النشاط وأثناءه وبعده (التدرج، التوقف عند الألم، شرب الماء، تجنب الحمام الساخن).\n2. يقود إحماءً وتهدئة كاملين لمجموعة.\n3. يقدر الفوائد الصحية للنشاط البدني.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 3:\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 5:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبن الة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الإحماء العام (مشي، جري، وثب بالحبل، تحريك المفاصل، إطالة) مع شرح السرعة والراحة ص 19-20.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصمم إحماءً عامًا لمدة 8 دقائق وتنفذه.\n- الطالب: يصمم وينفذ.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة إحماء من اختيار المجموعة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج إحماء خاص لثلاثة أنشطة (الرمح، العدو، كرة القدم).\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل مجموعة تختار نشاطًا وتصمم إحماءه الخاص وتنفذه، وتقيّمها مجموعة أخرى ببطاقة.\n- الطالب: يصمم ويقيّم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش: لماذا يختلف الإحماء الخاص من نشاط لآخر؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة بجهد متوسط 8 دقائق.\n- الطالب: يلعب.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التهدئة: مشي، تنفس عميق، إطالة ثابتة للعضلات العاملة، مع الشرح.\n- الطالب: يقلد.\n\nالنشاط 4 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصمم تهدئة لنشاط وتنفذها.\n- الطالب: يصمم وينفذ.\n\nالنشاط 5 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقيس الطلبة النبض بعد اللعبة وبعد التهدئة ويستنتجون.\n- الطالب: يستنتج.\n\nالحصة 5:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض الإرشادات والفوائد الصحية.\n- الطالب: يستمع.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل مجموعة يقود أحد أفرادها الإحماء العام والخاص (8 دقائق) ثم نشاطًا قصيرًا ثم التهدئة، بالتناوب على القيادة وتقييم الأقران.\n- الطالب: يقود ويقيّم.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش: ما أفضل إحماء رأيتموه ولماذا؟\n- الطالب: يستنتج.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما مهمة الإحماء؟\nالإجابة: رفع حرارة الجسم والعضلات وتهيئة الجهاز القلبي التنفسي.\nس2 (المستوى المتوقع): اذكر هدفًا فسيولوجيًا.\nالإجابة: زيادة سرعة ضربات القلب.\nس3 (المستوى المتقدم): اذكر هدفًا نفسيًا.\nالإجابة: رفع شدة الانتباه.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الإحماء العام؟\nالإجابة: تمرينات عامة ترفع حرارة الجسم وتهيئ أجهزته.\nس2 (المستوى المتوقع): كيف تكون سرعة تمرينات الإحماء العام؟\nالإجابة: بطيئة نسبيًا.\nس3 (المستوى المتقدم): ما الإحماء الخاص؟\nالإجابة: الجزء الثاني الذي يهيئ الجسم للنشاط المحدد.\n\nالحصة 3:\nس1 (مستوى الدعم): متى يأتي الإحماء الخاص؟\nالإجابة: في الجزء الثاني من زمن الإحماء.\nس2 (المستوى المتوقع): اذكر تمرينًا للإحماء الخاص للعدو.\nالإجابة: الانطلاق من البدء المنخفض 10 م.\nس3 (المستوى المتقدم): ما هدف الإحماء الخاص؟\nالإجابة: الوصول بأعضاء الجسم إلى أفضل درجة استعداد للنشاط.\n\nالحصة 4:\nس1 (مستوى الدعم): ما التهدئة؟\nالإجابة: تمارين تؤدى لتهدئة عضلات الجسم بعد النشاط.\nس2 (المستوى المتوقع): ما ضرر التوقف المفاجئ؟\nالإجابة: الشد العضلي والدوار.\nس3 (المستوى المتقدم): اذكر تمرينًا للتهدئة.\nالإجابة: الإطالة الثابتة.\n\nالحصة 5:\nس1 (مستوى الدعم): متى نتوقف عن النشاط فورًا؟\nالإجابة: عند ألم الصدر أو الدوخة أو الغثيان.\nس2 (المستوى المتوقع): هل نمارس النشاط مع الحمى؟\nالإجابة: لا.\nس3 (المستوى المتقدم): اذكر فائدة صحية للنشاط.\nالإجابة: حرق السعرات وتحسين اللياقة القلبية.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): صنف: زيادة التهوية الرئوية.\nالإجابة: فسيولوجي.\nس2 (المستوى المتوقع): كيف يقلل الإحماء الإصابات؟\nالإجابة: يزيد مطاطية العضلات وسرعة التوصيل العصبي.\nس3 (المستوى المتقدم): متى تزداد أهمية الإحماء؟\nالإجابة: عندما يكون النشاط عنيفًا.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر خمسة تمرينات للإحماء العام.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا تكون فترات الراحة قصيرة؟\nالإجابة: للمحافظة على ارتفاع الحرارة.\nس3 (المستوى المتقدم): ما مدة الإحماء العام المناسبة؟\nالإجابة: نحو 8-10 دقائق.\n\nالحصة 3:\nس1 (مستوى الدعم): صمم إحماءً خاصًا لكرة القدم.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): قيّم إحماء زميلك بمعيارين.\nالإجابة: مناسبته للنشاط وتدرجه.\nس3 (المستوى المتقدم): لماذا لا نكتفي بالإحماء العام قبل رمي الرمح؟\nالإجابة: لأن الرمي يحتاج إلى تهيئة الكتف والجذع خاصة.\n\nالحصة 4:\nس1 (مستوى الدعم): صمم تهدئة بثلاث خطوات.\nالإجابة: مشي، تنفس، إطالة.\nس2 (المستوى المتوقع): ماذا حدث للنبض بعد التهدئة؟\nالإجابة: انخفض تدريجيًا.\nس3 (المستوى المتقدم): لماذا تساوي التهدئة الإحماء في الأهمية؟\nالإجابة: لأنها تعيد الجسم إلى حالته الطبيعية وتمنع الإصابة.\n\nالحصة 5:\nس1 (مستوى الدعم): قُد إحماءً خاصًا بنشاط تختاره.\nالإجابة: يقود.\nس2 (المستوى المتوقع): لماذا نتجنب الحمام الساخن بعد النشاط مباشرة؟\nالإجابة: لتجنب هبوط الضغط والدوار.\nس3 (المستوى المتقدم): قيّم قيادة زميلك للتهدئة.\nالإجابة: يذكر نقطة قوة ونقطة تحسين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك أهداف الإحماء (دليل المعلم ص 17).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على أداء إحماء عام قبل أي نشاط رياضي.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تصميم إحماء خاص لرياضته المفضلة.\n\nالحصة 4:\nإرشاد لولي الأمر: ذكّر طالبك بالتهدئة بعد اللعب (دليل المعلم ص 20).\n\nالحصة 5:\nإرشاد لولي الأمر: ناقش مع طالبك الإرشادات الصحية للنشاط (دليل المعلم ص 18)، وراجعا مفهوم اللياقة البدنية ص 21."}}, {"title": "اللياقة البدنية", "unit": "الإعداد البدني", "week": "الثالث – الرابع", "date": "20-24/9/2026 إلى 27/9-1/10/2026", "pages": "دليل المعلم ص 21-34", "n": 10, "periods": [{"focus": "مفهوم اللياقة البدنية (للرياضي والفرد العادي) ومكوناتها", "num": 1, "fields": {"المخرجات التعليمية": "1. يميز مفهوم اللياقة البدنية لدى الرياضي والفرد العادي.\n2. يصنف مكونات اللياقة إلى مرتبطة بالصحة ومرتبطة بالمهارة.\n3. يقدر أهمية اللياقة البدنية في الحياة اليومية.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- جهاز عرض البيانات\n- السبورة الذكية\n- أخرى: بطاقات المكونات", "المفاهيم": "- اللياقة البدنية\n- المكونات المرتبطة بالصحة\n- المكونات المرتبطة بالمهارة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: هل لياقة عداء 100 م هي لياقة الطالب العادي؟ (ص 21).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض المفهومين والمكونات (قلبية تنفسية، قوة، تحمل عضلي، قدرة، مرونة، تركيب جسمي؛ سرعة، رشاقة، توازن، توافق).\n- الطالب: يستمع ويدون.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصنف البطاقات وتربط كل مكون بمثال رياضي.\n- الطالب: يصنف ويعرض.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة: نداء المكون وأداء تمرين يمثله.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما المفهوم العام للياقة؟\nالإجابة: المقدرة على تنفيذ الواجبات اليومية بنشاط دون تعب مفرط.\nس2 (المستوى المتوقع): اذكر مكونين مرتبطين بالصحة.\nالإجابة: القوة والمرونة.\nس3 (المستوى المتقدم): اذكر مكونين مرتبطين بالمهارة.\nالإجابة: السرعة والتوازن.", "التقويم الختامي": "س1 (مستوى الدعم): ما الفرق بين لياقة الرياضي والفرد العادي؟\nالإجابة: الرياضي تحمل جهد طويل، والعادي أعباء الحياة والجهد الطارئ.\nس2 (المستوى المتوقع): صنف: التركيب الجسمي.\nالإجابة: مرتبط بالصحة.\nس3 (المستوى المتقدم): لماذا تهمك اللياقة في حياتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك مكونات اللياقة (دليل المعلم ص 21)."}}, {"focus": "اللياقة القلبية التنفسية وتطويرها (نوع النشاط، المدة، التكرار، الشدة)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف اللياقة القلبية التنفسية وأهميتها.\n2. يحدد شروط تطويرها (نشاط هوائي، مدة، تكرار، شدة).\n3. يؤدي نشاطًا هوائيًا بشدة مناسبة مع متابعة النبض.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: ساعات إيقاف\n- أخرى: حبال وثب\n- أخرى: أقماع", "المفاهيم": "- اللياقة القلبية التنفسية\n- النشاط الهوائي\n- الشدة\n- النبض", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الأنشطة التي تجعل القلب أقوى؟ (ص 22).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الشروط: نشاط هوائي (مشي، جري، سباحة، دراجة)، المدة 20-60 دقيقة، التكرار 3-5 مرات أسبوعيًا، الشدة بالنبض.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات هوائية (جري خفيف، وثب بالحبل، مكوكي) 4 دقائق لكل محطة مع قياس النبض.\n- الطالب: يؤدي ويقيس.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحسب كل طالب نبضه المستهدف تقريبيًا ويقارن.\n- الطالب: يحسب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما النشاط الهوائي؟\nالإجابة: نشاط متوسط الشدة مستمر مثل الجري والسباحة.\nس2 (المستوى المتوقع): كم مرة أسبوعيًا؟\nالإجابة: 3-5 مرات.\nس3 (المستوى المتقدم): كيف نقدر الشدة؟\nالإجابة: بالنبض.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر شروط تطوير اللياقة القلبية التنفسية.\nالإجابة: النوع والمدة والتكرار والشدة.\nس2 (المستوى المتوقع): ضع خطة أسبوعية لنفسك.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): لماذا تعد الأهم للصحة؟\nالإجابة: لعلاقتها بكفاءة القلب والرئتين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على نشاط هوائي ثلاث مرات أسبوعيًا."}}, {"focus": "القوة العضلية: مفهومها وأنواعها وتمريناتها", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم القوة العضلية وأنواعها (القصوى، المميزة بالسرعة).\n2. يؤدي تمرينات قوة بوزن الجسم وبالأدوات بأمان.\n3. يميز تمرينات القوة من تمرينات التحمل.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: أحزمة مطاطية\n- أخرى: مراتب", "المفاهيم": "- القوة العضلية\n- المقاومة\n- الانقباض\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الذي يمكن رامي الجلة من دفعها بعيدًا؟ (ص 23).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والأنواع ونماذج تمرينات (انبطاح مائل، قرفصاء، دفع كرة طبية، حزام مطاطي) مع قواعد الأمان.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات قوة بتكرارات محددة والراحة بين المجموعات.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة بين 8 تكرارات بمقاومة عالية و30 تكرارًا خفيفة ويستنتجون الفرق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس2 (المستوى المتوقع): اذكر نوعين للقوة.\nالإجابة: القصوى والمميزة بالسرعة.\nس3 (المستوى المتقدم): اذكر تمرينًا للقوة بوزن الجسم.\nالإجابة: الانبطاح المائل.", "التقويم الختامي": "س1 (مستوى الدعم): ما الفرق بين تمرين القوة وتمرين التحمل العضلي؟\nالإجابة: القوة مقاومة عالية وتكرار قليل، والتحمل مقاومة أقل وتكرار كثير.\nس2 (المستوى المتوقع): اذكر قاعدة أمان في تمرينات القوة.\nالإجابة: التدرج وعدم حبس النفس.\nس3 (المستوى المتقدم): أدِّ 10 قرفصاء بوضع صحيح.\nالإجابة: يؤديها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات قوة بوزن الجسم بتدرج."}}, {"focus": "التحمل (الجلد) العضلي واختبار الجلوس من الرقود", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف التحمل العضلي وعلاقته باللياقة القلبية التنفسية.\n2. يطبق اختبار الجلوس من الرقود مع ثني الركبتين.\n3. يفسر نتيجته وفق جدول الدرجات.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: جداول الدرجات", "المفاهيم": "- التحمل العضلي\n- الجلوس من الرقود\n- جدول الدرجات", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يستطيع أداء 40 جلوسًا من الرقود في دقيقة؟ (ص 23، 29).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الاختبار: رقود القرفصاء، تشبيك اليدين، الجلوس ولمس الركبتين بالمرفقين، العدد في دقيقة.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يؤدي أحدهما ويعد الآخر ويثبت قدميه، ثم التبادل والتسجيل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن كل طالب نتيجته بجدول الدرجات ويفسر.\n- الطالب: يفسر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما التحمل العضلي؟\nالإجابة: قدرة العضلة على انقباضات متعاقبة لعدد من التكرارات.\nس2 (المستوى المتوقع): بماذا يقاس؟\nالإجابة: الجلوس من الرقود أو الشد لأعلى.\nس3 (المستوى المتقدم): ما علاقته باللياقة القلبية التنفسية؟\nالإجابة: توفر للعضلات الطاقة الأكسجينية.", "التقويم الختامي": "س1 (مستوى الدعم): ما درجتك وفق الجدول؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اقترح تمرينًا لتحسين النتيجة.\nالإجابة: الجلوس من الرقود يوميًا بزيادة تدريجية.\nس3 (المستوى المتقدم): اذكر اختبارًا آخر للتحمل العضلي.\nالإجابة: الشد لأعلى (التعلق).", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرين الجلوس من الرقود يوميًا."}}, {"focus": "القدرة العضلية واختبار الوثب الطويل من الثبات", "num": 5, "fields": {"المخرجات التعليمية": "1. يتعرف القدرة العضلية (الانقباض المتفجر) وأمثلتها.\n2. يطبق اختبار الوثب الطويل من الثبات.\n3. يفسر نتيجته ويحدد طريقة تحسينها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: شريط قياس\n- أخرى: جير\n- أخرى: استمارات تسجيل\n- أخرى: جداول الدرجات", "المفاهيم": "- القدرة العضلية\n- الانقباض المتفجر\n- الوثب الطويل من الثبات", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الفرق بين قوة رافع الأثقال وقدرة الواثب؟ (ص 23، 30).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالوثب.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الاختبار: الوقوف خلف الخط، مرجحة الذراعين، الوثب والهبوط بالقدمين، القياس من الخط إلى أقرب أثر.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائس ومسجل: محاولتان لكل طالب.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة بجدول الدرجات ونقاش طرق التحسين.\n- الطالب: يفسر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما القدرة العضلية؟\nالإجابة: الجهد الناتج عن القوة في زمن قصير (انقباض متفجر).\nس2 (المستوى المتوقع): اذكر مثالًا.\nالإجابة: الوثب أو الرمي.\nس3 (المستوى المتقدم): من أين تقاس الوثبة؟\nالإجابة: من خط الارتقاء إلى أقرب أثر.", "التقويم الختامي": "س1 (مستوى الدعم): ما درجتك وفق الجدول؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اقترح تمرينًا لتحسين القدرة.\nالإجابة: الوثب العميق أو الوثب بالقدمين فوق حواجز.\nس3 (المستوى المتقدم): ما العلاقة بين القوة والسرعة في القدرة؟\nالإجابة: القدرة = قوة × سرعة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الوثب بأمان."}}, {"focus": "المرونة: مفهومها وأنواعها (الثابتة والمتحركة) واختبار ثني الجذع", "num": 6, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم المرونة وأهميتها الوقائية.\n2. يميز المرونة الثابتة من المتحركة ويؤدي تمرينات لكل نوع.\n3. يطبق اختبار المرونة ويفسر نتيجته.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: صندوق المرونة أو مقعد ومسطرة\n- أخرى: مراتب\n- أخرى: استمارات تسجيل", "المفاهيم": "- المرونة\n- المرونة الثابتة\n- المرونة المتحركة\n- المدى الحركي", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يتميز لاعب الجمباز بمرونة عالية؟ (ص 24-25).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المرونة وأنواعها ونماذج (إطالة ثابتة 15 ثانية، مرجحات) وتوقيتها بعد الإحماء، ونموذج اختبار ثني الجذع.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات إطالة ثابتة ومتحركة ثم اختبار ثني الجذع من الجلوس بالتسجيل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة بالجدول ونقاش.\n- الطالب: يفسر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما المرونة؟\nالإجابة: مطاطية العضلات والأوتار والأربطة بما يسمح بمدى حركي كامل.\nس2 (المستوى المتوقع): ما الفرق بين الثابتة والمتحركة؟\nالإجابة: الثابتة إطالة بطيئة وثبات، والمتحركة مرجحة.\nس3 (المستوى المتقدم): متى نؤدي تمرينات المرونة؟\nالإجابة: بعد الإحماء العام أو بعد التدريب.", "التقويم الختامي": "س1 (مستوى الدعم): ما درجتك في اختبار المرونة؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا تقلل المرونة الإصابات؟\nالإجابة: لأن العضلات والأوتار المرنة تتحمل المدى الحركي دون تمزق.\nس3 (المستوى المتقدم): أيهما أكثر أمانًا للمبتدئ؟\nالإجابة: المرونة الثابتة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الإطالة الثابتة اليومية."}}, {"focus": "التركيب الجسمي ومؤشر كتلة الجسم", "num": 7, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم التركيب الجسمي (نسبة الشحوم إلى الوزن الكلي).\n2. يحسب مؤشر كتلة الجسم ويفسر فئته.\n3. يقدر أثر النشاط البدني والغذاء في التركيب الجسمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: ميزان\n- أخرى: شريط قياس الطول\n- جهاز الحاسب\n- السبورة الذكية", "المفاهيم": "- التركيب الجسمي\n- نسبة الشحوم\n- مؤشر كتلة الجسم\n- الوزن الصحي", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: هل الوزن وحده يكفي للحكم على اللياقة؟ (ص 25).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح التركيب الجسمي ومؤشر كتلة الجسم (الوزن ÷ مربع الطول) وفئاته.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يقيس كل طالب طوله ووزنه ويحسب مؤشره بمساعدة زميل ويحتفظ بالنتيجة لنفسه.\n- الطالب: يحسب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: كيف يغير النشاط البدني التركيب الجسمي؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما التركيب الجسمي؟\nالإجابة: نسبة وزن الشحوم إلى الوزن الكلي.\nس2 (المستوى المتوقع): كيف يحسب مؤشر كتلة الجسم؟\nالإجابة: الوزن بالكيلوجرام ÷ مربع الطول بالمتر.\nس3 (المستوى المتقدم): ما القسمان اللذان يشكلان الوزن الكلي؟\nالإجابة: الكتلة الشحمية والكتلة الخالية من الشحوم.", "التقويم الختامي": "س1 (مستوى الدعم): احسب مؤشر كتلة جسم طالب وزنه 60 كجم وطوله 1.7 م.\nالإجابة: نحو 20.8.\nس2 (المستوى المتوقع): لماذا قد يكون مؤشر لاعب القوة مرتفعًا دون سمنة؟\nالإجابة: لأن الكتلة العضلية تزيد الوزن.\nس3 (المستوى المتقدم): كيف يحسن النشاط التركيب الجسمي؟\nالإجابة: يقلل الشحوم ويزيد العضلات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك أثر الغذاء والنشاط في التركيب الجسمي دون التركيز على الوزن فقط."}}, {"focus": "السرعة: مفهومها وأنواعها واختبار جري 50 م", "num": 8, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم السرعة وأنواعها (الانتقالية، الحركية، رد الفعل).\n2. يطبق اختبار جري 50 م من البدء المنخفض.\n3. يميز نوع السرعة في مواقف رياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: ساعات إيقاف\n- أخرى: أقماع\n- أخرى: مكعبات البدء\n- أخرى: استمارات تسجيل", "المفاهيم": "- السرعة الانتقالية\n- السرعة الحركية\n- سرعة رد الفعل\n- جري 50 م", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الفرق بين سرعة العداء وسرعة رد فعل حارس المرمى؟ (ص 26، 32).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالعدو.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الأنواع ونموذج الاختبار من البدء المنخفض.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بميقاتي: محاولتان لكل طالب في 50 م والتسجيل.\n- الطالب: يعدو ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يصنف الطلبة مواقف (تمرير سريع، انطلاق بالصافرة، عدو) حسب نوع السرعة.\n- الطالب: يصنف.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما السرعة ميكانيكيًا؟\nالإجابة: معدل التغير في المسافة بالنسبة إلى الزمن.\nس2 (المستوى المتوقع): ما سرعة رد الفعل؟\nالإجابة: الاستجابة لمثير في أقصر زمن.\nس3 (المستوى المتقدم): ما السرعة الحركية؟\nالإجابة: سرعة انقباض عضلة عند أداء حركة.", "التقويم الختامي": "س1 (مستوى الدعم): ما زمنك في 50 م ودرجتك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): صنف: لمس الإناء الساخن وسحب اليد.\nالإجابة: رد فعل.\nس3 (المستوى المتقدم): اقترح تمرينًا لسرعة رد الفعل.\nالإجابة: الانطلاق بإشارات مختلفة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات العدو القصير."}}, {"focus": "الرشاقة والتوازن والتوافق وتمريناتها", "num": 9, "fields": {"المخرجات التعليمية": "1. يتعرف مفاهيم الرشاقة والتوازن والتوافق وعلاقتها ببعضها.\n2. يؤدي تمرينات لكل عنصر (تغيير اتجاه، وقوف على قدم، رمي ولقف بالتناوب).\n3. يربط كل عنصر بمهارات الألعاب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: كرات تنس\n- أخرى: وسائد توازن\n- أخرى: سلم الرشاقة", "المفاهيم": "- الرشاقة\n- التوازن\n- التوافق\n- التوافق العضلي العصبي", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: أي العناصر يحتاجها لاعب الريشة الطائرة أكثر؟ (ص 27).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح العناصر الثلاثة ونماذج تمرينات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: اختبار T مصغر، الوقوف على قدم بعينين مغمضتين، رمي الكرة على الحائط بالتناوب، سلم الرشاقة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط كل عنصر بمهارة من كرة القدم.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الرشاقة؟\nالإجابة: تغيير أوضاع الجسم واتجاهاته بدقة وسرعة.\nس2 (المستوى المتوقع): ما نوعا التوازن؟\nالإجابة: الثابت والحركي.\nس3 (المستوى المتقدم): بماذا يتصل التوافق؟\nالإجابة: بالرشاقة وإدماج عدة حركات في إطار واحد.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر تمرينًا لكل عنصر.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي العناصر يحتاجها حارس المرمى أكثر؟\nالإجابة: رد الفعل والرشاقة والتوافق.\nس3 (المستوى المتقدم): لماذا يرتبط التوازن بالتوافق العضلي العصبي؟\nالإجابة: لأنه يحتاج إلى تنسيق الدماغ والعضلات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات التوازن اليومية."}}, {"focus": "القياس والتقويم: تنفيذ بطارية اختبارات اللياقة وتسجيل الدرجات", "num": 10, "fields": {"المخرجات التعليمية": "1. يطبق بطارية اختبارات اللياقة (الجلوس من الرقود، الوثب من الثبات، ثني الجذع، جري 50 م) بالطريقة الصحيحة.\n2. يسجل درجاته وفق الجداول ويقارنها بالقياس الأولي.\n3. يضع خطة شخصية لتحسين أضعف عنصر.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: شريط قياس\n- أخرى: ساعات إيقاف\n- أخرى: صندوق المرونة\n- أخرى: استمارات تسجيل\n- أخرى: جداول الدرجات", "المفاهيم": "- بطارية الاختبارات\n- الدرجة\n- التقدم\n- الخطة الشخصية", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات القياس ويذكر بالقياس الأولي في الأسبوع الأول.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: أربع محطات بطاقة تسجيل شخصية، يؤدي كل طالب الاختبارات ويسجل بمساعدة زميل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن كل طالب نتائجه بالقياس الأولي ويحدد أضعف عنصر.\n- الطالب: يحلل.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: كتابة خطة شخصية مختصرة.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الذي يقيسه كل اختبار؟\nالإجابة: الجلوس من الرقود: التحمل العضلي، الوثب: القدرة، ثني الجذع: المرونة، 50 م: السرعة.\nس2 (المستوى المتوقع): كيف نحول النتيجة إلى درجة؟\nالإجابة: بجداول الدرجات في الدليل.\nس3 (المستوى المتقدم): لماذا نقارن بالقياس الأولي؟\nالإجابة: لمتابعة التقدم.", "التقويم الختامي": "س1 (مستوى الدعم): ما أضعف عنصر لديك وخطتك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما العنصر الذي تحسن منذ الأسبوع الأول؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اقترح تمرينًا لكل عنصر ضعيف لزميلك.\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ساعد طالبك على تنفيذ خطته الشخصية، وراجعا مقدمة رمي الرمح (دليل المعلم ص 35-36)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يميز مفهوم اللياقة البدنية لدى الرياضي والفرد العادي.\n2. يصنف مكونات اللياقة إلى مرتبطة بالصحة ومرتبطة بالمهارة.\n3. يقدر أهمية اللياقة البدنية في الحياة اليومية.\n\nالحصة 2:\n1. يتعرف اللياقة القلبية التنفسية وأهميتها.\n2. يحدد شروط تطويرها (نشاط هوائي، مدة، تكرار، شدة).\n3. يؤدي نشاطًا هوائيًا بشدة مناسبة مع متابعة النبض.\n\nالحصة 3:\n1. يتعرف مفهوم القوة العضلية وأنواعها (القصوى، المميزة بالسرعة).\n2. يؤدي تمرينات قوة بوزن الجسم وبالأدوات بأمان.\n3. يميز تمرينات القوة من تمرينات التحمل.\n\nالحصة 4:\n1. يتعرف التحمل العضلي وعلاقته باللياقة القلبية التنفسية.\n2. يطبق اختبار الجلوس من الرقود مع ثني الركبتين.\n3. يفسر نتيجته وفق جدول الدرجات.\n\nالحصة 5:\n1. يتعرف القدرة العضلية (الانقباض المتفجر) وأمثلتها.\n2. يطبق اختبار الوثب الطويل من الثبات.\n3. يفسر نتيجته ويحدد طريقة تحسينها.\n\nالحصة 6:\n1. يتعرف مفهوم المرونة وأهميتها الوقائية.\n2. يميز المرونة الثابتة من المتحركة ويؤدي تمرينات لكل نوع.\n3. يطبق اختبار المرونة ويفسر نتيجته.\n\nالحصة 7:\n1. يتعرف مفهوم التركيب الجسمي (نسبة الشحوم إلى الوزن الكلي).\n2. يحسب مؤشر كتلة الجسم ويفسر فئته.\n3. يقدر أثر النشاط البدني والغذاء في التركيب الجسمي.\n\nالحصة 8:\n1. يتعرف مفهوم السرعة وأنواعها (الانتقالية، الحركية، رد الفعل).\n2. يطبق اختبار جري 50 م من البدء المنخفض.\n3. يميز نوع السرعة في مواقف رياضية.\n\nالحصة 9:\n1. يتعرف مفاهيم الرشاقة والتوازن والتوافق وعلاقتها ببعضها.\n2. يؤدي تمرينات لكل عنصر (تغيير اتجاه، وقوف على قدم، رمي ولقف بالتناوب).\n3. يربط كل عنصر بمهارات الألعاب.\n\nالحصة 10:\n1. يطبق بطارية اختبارات اللياقة (الجلوس من الرقود، الوثب من الثبات، ثني الجذع، جري 50 م) بالطريقة الصحيحة.\n2. يسجل درجاته وفق الجداول ويقارنها بالقياس الأولي.\n3. يضع خطة شخصية لتحسين أضعف عنصر.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 6:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 7:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 8:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 9:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 10:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 6:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 7:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 8:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 9:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 10:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- جهاز عرض البيانات\n- السبورة الذكية\n- أخرى: بطاقات المكونات\n\nالحصة 2:\n- أخرى: ساعات إيقاف\n- أخرى: حبال وثب\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: كرات طبية\n- أخرى: أحزمة مطاطية\n- أخرى: مراتب\n\nالحصة 4:\n- أخرى: مراتب\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: جداول الدرجات\n\nالحصة 5:\n- أخرى: شريط قياس\n- أخرى: جير\n- أخرى: استمارات تسجيل\n- أخرى: جداول الدرجات\n\nالحصة 6:\n- أخرى: صندوق المرونة أو مقعد ومسطرة\n- أخرى: مراتب\n- أخرى: استمارات تسجيل\n\nالحصة 7:\n- أخرى: ميزان\n- أخرى: شريط قياس الطول\n- جهاز الحاسب\n- السبورة الذكية\n\nالحصة 8:\n- أخرى: ساعات إيقاف\n- أخرى: أقماع\n- أخرى: مكعبات البدء\n- أخرى: استمارات تسجيل\n\nالحصة 9:\n- أخرى: أقماع\n- أخرى: كرات تنس\n- أخرى: وسائد توازن\n- أخرى: سلم الرشاقة\n\nالحصة 10:\n- أخرى: مراتب\n- أخرى: شريط قياس\n- أخرى: ساعات إيقاف\n- أخرى: صندوق المرونة\n- أخرى: استمارات تسجيل\n- أخرى: جداول الدرجات", "المفاهيم": "الحصة 1:\n- اللياقة البدنية\n- المكونات المرتبطة بالصحة\n- المكونات المرتبطة بالمهارة\n\nالحصة 2:\n- اللياقة القلبية التنفسية\n- النشاط الهوائي\n- الشدة\n- النبض\n\nالحصة 3:\n- القوة العضلية\n- المقاومة\n- الانقباض\n- الأمان\n\nالحصة 4:\n- التحمل العضلي\n- الجلوس من الرقود\n- جدول الدرجات\n\nالحصة 5:\n- القدرة العضلية\n- الانقباض المتفجر\n- الوثب الطويل من الثبات\n\nالحصة 6:\n- المرونة\n- المرونة الثابتة\n- المرونة المتحركة\n- المدى الحركي\n\nالحصة 7:\n- التركيب الجسمي\n- نسبة الشحوم\n- مؤشر كتلة الجسم\n- الوزن الصحي\n\nالحصة 8:\n- السرعة الانتقالية\n- السرعة الحركية\n- سرعة رد الفعل\n- جري 50 م\n\nالحصة 9:\n- الرشاقة\n- التوازن\n- التوافق\n- التوافق العضلي العصبي\n\nالحصة 10:\n- بطارية الاختبارات\n- الدرجة\n- التقدم\n- الخطة الشخصية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: هل لياقة عداء 100 م هي لياقة الطالب العادي؟ (ص 21).\n\nالحصة 2:\nيسأل المعلم: ما الأنشطة التي تجعل القلب أقوى؟ (ص 22).\n\nالحصة 3:\nيسأل المعلم: ما الذي يمكن رامي الجلة من دفعها بعيدًا؟ (ص 23).\n\nالحصة 4:\nيسأل المعلم: من يستطيع أداء 40 جلوسًا من الرقود في دقيقة؟ (ص 23، 29).\n\nالحصة 5:\nيسأل المعلم: ما الفرق بين قوة رافع الأثقال وقدرة الواثب؟ (ص 23، 30).\n\nالحصة 6:\nيسأل المعلم: لماذا يتميز لاعب الجمباز بمرونة عالية؟ (ص 24-25).\n\nالحصة 7:\nيسأل المعلم: هل الوزن وحده يكفي للحكم على اللياقة؟ (ص 25).\n\nالحصة 8:\nيسأل المعلم: ما الفرق بين سرعة العداء وسرعة رد فعل حارس المرمى؟ (ص 26، 32).\n\nالحصة 9:\nيسأل المعلم: أي العناصر يحتاجها لاعب الريشة الطائرة أكثر؟ (ص 27).\n\nالحصة 10:\nيوضح المعلم محطات القياس ويذكر بالقياس الأولي في الأسبوع الأول.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض المفهومين والمكونات (قلبية تنفسية، قوة، تحمل عضلي، قدرة، مرونة، تركيب جسمي؛ سرعة، رشاقة، توازن، توافق).\n- الطالب: يستمع ويدون.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصنف البطاقات وتربط كل مكون بمثال رياضي.\n- الطالب: يصنف ويعرض.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة: نداء المكون وأداء تمرين يمثله.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الشروط: نشاط هوائي (مشي، جري، سباحة، دراجة)، المدة 20-60 دقيقة، التكرار 3-5 مرات أسبوعيًا، الشدة بالنبض.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات هوائية (جري خفيف، وثب بالحبل، مكوكي) 4 دقائق لكل محطة مع قياس النبض.\n- الطالب: يؤدي ويقيس.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحسب كل طالب نبضه المستهدف تقريبيًا ويقارن.\n- الطالب: يحسب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والأنواع ونماذج تمرينات (انبطاح مائل، قرفصاء، دفع كرة طبية، حزام مطاطي) مع قواعد الأمان.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات قوة بتكرارات محددة والراحة بين المجموعات.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة بين 8 تكرارات بمقاومة عالية و30 تكرارًا خفيفة ويستنتجون الفرق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الاختبار: رقود القرفصاء، تشبيك اليدين، الجلوس ولمس الركبتين بالمرفقين، العدد في دقيقة.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يؤدي أحدهما ويعد الآخر ويثبت قدميه، ثم التبادل والتسجيل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن كل طالب نتيجته بجدول الدرجات ويفسر.\n- الطالب: يفسر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالوثب.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الاختبار: الوقوف خلف الخط، مرجحة الذراعين، الوثب والهبوط بالقدمين، القياس من الخط إلى أقرب أثر.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائس ومسجل: محاولتان لكل طالب.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة بجدول الدرجات ونقاش طرق التحسين.\n- الطالب: يفسر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 6:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المرونة وأنواعها ونماذج (إطالة ثابتة 15 ثانية، مرجحات) وتوقيتها بعد الإحماء، ونموذج اختبار ثني الجذع.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات إطالة ثابتة ومتحركة ثم اختبار ثني الجذع من الجلوس بالتسجيل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة بالجدول ونقاش.\n- الطالب: يفسر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 7:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح التركيب الجسمي ومؤشر كتلة الجسم (الوزن ÷ مربع الطول) وفئاته.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يقيس كل طالب طوله ووزنه ويحسب مؤشره بمساعدة زميل ويحتفظ بالنتيجة لنفسه.\n- الطالب: يحسب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: كيف يغير النشاط البدني التركيب الجسمي؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 8:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالعدو.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الأنواع ونموذج الاختبار من البدء المنخفض.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بميقاتي: محاولتان لكل طالب في 50 م والتسجيل.\n- الطالب: يعدو ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يصنف الطلبة مواقف (تمرير سريع، انطلاق بالصافرة، عدو) حسب نوع السرعة.\n- الطالب: يصنف.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 9:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح العناصر الثلاثة ونماذج تمرينات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: اختبار T مصغر، الوقوف على قدم بعينين مغمضتين، رمي الكرة على الحائط بالتناوب، سلم الرشاقة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط كل عنصر بمهارة من كرة القدم.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 10:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: أربع محطات بطاقة تسجيل شخصية، يؤدي كل طالب الاختبارات ويسجل بمساعدة زميل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن كل طالب نتائجه بالقياس الأولي ويحدد أضعف عنصر.\n- الطالب: يحلل.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: كتابة خطة شخصية مختصرة.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما المفهوم العام للياقة؟\nالإجابة: المقدرة على تنفيذ الواجبات اليومية بنشاط دون تعب مفرط.\nس2 (المستوى المتوقع): اذكر مكونين مرتبطين بالصحة.\nالإجابة: القوة والمرونة.\nس3 (المستوى المتقدم): اذكر مكونين مرتبطين بالمهارة.\nالإجابة: السرعة والتوازن.\n\nالحصة 2:\nس1 (مستوى الدعم): ما النشاط الهوائي؟\nالإجابة: نشاط متوسط الشدة مستمر مثل الجري والسباحة.\nس2 (المستوى المتوقع): كم مرة أسبوعيًا؟\nالإجابة: 3-5 مرات.\nس3 (المستوى المتقدم): كيف نقدر الشدة؟\nالإجابة: بالنبض.\n\nالحصة 3:\nس1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس2 (المستوى المتوقع): اذكر نوعين للقوة.\nالإجابة: القصوى والمميزة بالسرعة.\nس3 (المستوى المتقدم): اذكر تمرينًا للقوة بوزن الجسم.\nالإجابة: الانبطاح المائل.\n\nالحصة 4:\nس1 (مستوى الدعم): ما التحمل العضلي؟\nالإجابة: قدرة العضلة على انقباضات متعاقبة لعدد من التكرارات.\nس2 (المستوى المتوقع): بماذا يقاس؟\nالإجابة: الجلوس من الرقود أو الشد لأعلى.\nس3 (المستوى المتقدم): ما علاقته باللياقة القلبية التنفسية؟\nالإجابة: توفر للعضلات الطاقة الأكسجينية.\n\nالحصة 5:\nس1 (مستوى الدعم): ما القدرة العضلية؟\nالإجابة: الجهد الناتج عن القوة في زمن قصير (انقباض متفجر).\nس2 (المستوى المتوقع): اذكر مثالًا.\nالإجابة: الوثب أو الرمي.\nس3 (المستوى المتقدم): من أين تقاس الوثبة؟\nالإجابة: من خط الارتقاء إلى أقرب أثر.\n\nالحصة 6:\nس1 (مستوى الدعم): ما المرونة؟\nالإجابة: مطاطية العضلات والأوتار والأربطة بما يسمح بمدى حركي كامل.\nس2 (المستوى المتوقع): ما الفرق بين الثابتة والمتحركة؟\nالإجابة: الثابتة إطالة بطيئة وثبات، والمتحركة مرجحة.\nس3 (المستوى المتقدم): متى نؤدي تمرينات المرونة؟\nالإجابة: بعد الإحماء العام أو بعد التدريب.\n\nالحصة 7:\nس1 (مستوى الدعم): ما التركيب الجسمي؟\nالإجابة: نسبة وزن الشحوم إلى الوزن الكلي.\nس2 (المستوى المتوقع): كيف يحسب مؤشر كتلة الجسم؟\nالإجابة: الوزن بالكيلوجرام ÷ مربع الطول بالمتر.\nس3 (المستوى المتقدم): ما القسمان اللذان يشكلان الوزن الكلي؟\nالإجابة: الكتلة الشحمية والكتلة الخالية من الشحوم.\n\nالحصة 8:\nس1 (مستوى الدعم): ما السرعة ميكانيكيًا؟\nالإجابة: معدل التغير في المسافة بالنسبة إلى الزمن.\nس2 (المستوى المتوقع): ما سرعة رد الفعل؟\nالإجابة: الاستجابة لمثير في أقصر زمن.\nس3 (المستوى المتقدم): ما السرعة الحركية؟\nالإجابة: سرعة انقباض عضلة عند أداء حركة.\n\nالحصة 9:\nس1 (مستوى الدعم): ما الرشاقة؟\nالإجابة: تغيير أوضاع الجسم واتجاهاته بدقة وسرعة.\nس2 (المستوى المتوقع): ما نوعا التوازن؟\nالإجابة: الثابت والحركي.\nس3 (المستوى المتقدم): بماذا يتصل التوافق؟\nالإجابة: بالرشاقة وإدماج عدة حركات في إطار واحد.\n\nالحصة 10:\nس1 (مستوى الدعم): ما الذي يقيسه كل اختبار؟\nالإجابة: الجلوس من الرقود: التحمل العضلي، الوثب: القدرة، ثني الجذع: المرونة، 50 م: السرعة.\nس2 (المستوى المتوقع): كيف نحول النتيجة إلى درجة؟\nالإجابة: بجداول الدرجات في الدليل.\nس3 (المستوى المتقدم): لماذا نقارن بالقياس الأولي؟\nالإجابة: لمتابعة التقدم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ما الفرق بين لياقة الرياضي والفرد العادي؟\nالإجابة: الرياضي تحمل جهد طويل، والعادي أعباء الحياة والجهد الطارئ.\nس2 (المستوى المتوقع): صنف: التركيب الجسمي.\nالإجابة: مرتبط بالصحة.\nس3 (المستوى المتقدم): لماذا تهمك اللياقة في حياتك؟\nالإجابة: يذكر.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر شروط تطوير اللياقة القلبية التنفسية.\nالإجابة: النوع والمدة والتكرار والشدة.\nس2 (المستوى المتوقع): ضع خطة أسبوعية لنفسك.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): لماذا تعد الأهم للصحة؟\nالإجابة: لعلاقتها بكفاءة القلب والرئتين.\n\nالحصة 3:\nس1 (مستوى الدعم): ما الفرق بين تمرين القوة وتمرين التحمل العضلي؟\nالإجابة: القوة مقاومة عالية وتكرار قليل، والتحمل مقاومة أقل وتكرار كثير.\nس2 (المستوى المتوقع): اذكر قاعدة أمان في تمرينات القوة.\nالإجابة: التدرج وعدم حبس النفس.\nس3 (المستوى المتقدم): أدِّ 10 قرفصاء بوضع صحيح.\nالإجابة: يؤديها.\n\nالحصة 4:\nس1 (مستوى الدعم): ما درجتك وفق الجدول؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اقترح تمرينًا لتحسين النتيجة.\nالإجابة: الجلوس من الرقود يوميًا بزيادة تدريجية.\nس3 (المستوى المتقدم): اذكر اختبارًا آخر للتحمل العضلي.\nالإجابة: الشد لأعلى (التعلق).\n\nالحصة 5:\nس1 (مستوى الدعم): ما درجتك وفق الجدول؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اقترح تمرينًا لتحسين القدرة.\nالإجابة: الوثب العميق أو الوثب بالقدمين فوق حواجز.\nس3 (المستوى المتقدم): ما العلاقة بين القوة والسرعة في القدرة؟\nالإجابة: القدرة = قوة × سرعة.\n\nالحصة 6:\nس1 (مستوى الدعم): ما درجتك في اختبار المرونة؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا تقلل المرونة الإصابات؟\nالإجابة: لأن العضلات والأوتار المرنة تتحمل المدى الحركي دون تمزق.\nس3 (المستوى المتقدم): أيهما أكثر أمانًا للمبتدئ؟\nالإجابة: المرونة الثابتة.\n\nالحصة 7:\nس1 (مستوى الدعم): احسب مؤشر كتلة جسم طالب وزنه 60 كجم وطوله 1.7 م.\nالإجابة: نحو 20.8.\nس2 (المستوى المتوقع): لماذا قد يكون مؤشر لاعب القوة مرتفعًا دون سمنة؟\nالإجابة: لأن الكتلة العضلية تزيد الوزن.\nس3 (المستوى المتقدم): كيف يحسن النشاط التركيب الجسمي؟\nالإجابة: يقلل الشحوم ويزيد العضلات.\n\nالحصة 8:\nس1 (مستوى الدعم): ما زمنك في 50 م ودرجتك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): صنف: لمس الإناء الساخن وسحب اليد.\nالإجابة: رد فعل.\nس3 (المستوى المتقدم): اقترح تمرينًا لسرعة رد الفعل.\nالإجابة: الانطلاق بإشارات مختلفة.\n\nالحصة 9:\nس1 (مستوى الدعم): اذكر تمرينًا لكل عنصر.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي العناصر يحتاجها حارس المرمى أكثر؟\nالإجابة: رد الفعل والرشاقة والتوافق.\nس3 (المستوى المتقدم): لماذا يرتبط التوازن بالتوافق العضلي العصبي؟\nالإجابة: لأنه يحتاج إلى تنسيق الدماغ والعضلات.\n\nالحصة 10:\nس1 (مستوى الدعم): ما أضعف عنصر لديك وخطتك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما العنصر الذي تحسن منذ الأسبوع الأول؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اقترح تمرينًا لكل عنصر ضعيف لزميلك.\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك مكونات اللياقة (دليل المعلم ص 21).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على نشاط هوائي ثلاث مرات أسبوعيًا.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تمرينات قوة بوزن الجسم بتدرج.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تمرين الجلوس من الرقود يوميًا.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على تمرينات الوثب بأمان.\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على الإطالة الثابتة اليومية.\n\nالحصة 7:\nإرشاد لولي الأمر: ناقش مع طالبك أثر الغذاء والنشاط في التركيب الجسمي دون التركيز على الوزن فقط.\n\nالحصة 8:\nإرشاد لولي الأمر: شجع طالبك على تمرينات العدو القصير.\n\nالحصة 9:\nإرشاد لولي الأمر: شجع طالبك على تمرينات التوازن اليومية.\n\nالحصة 10:\nإرشاد لولي الأمر: ساعد طالبك على تنفيذ خطته الشخصية، وراجعا مقدمة رمي الرمح (دليل المعلم ص 35-36)."}}, {"title": "تدريبات لرمي الرمح", "unit": "مسابقات الميدان والمضمار", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 35-38", "n": 5, "periods": [{"focus": "المرحلة التدريبية الأولى: الإعداد البدني الخاص لرمي الرمح (العدو، الوثب)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف المراحل التدريبية لرمي الرمح (الإعداد البدني، الإعداد الفني والخاص والتنافسي).\n2. يؤدي تمرينات الإعداد البدني الخاص (العدو 20-60 م، الوثب بالقدمين للأمام ولأعلى في الرمل).\n3. يربط بين كل تمرين والصفة البدنية التي ينميها للرمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", وقوف مع التركيز على الفرملة وتثبيت الركبة اليسرى والتقوس.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: وضع الرجل اليسرى على علامة وتثبيتها ثم الرمي، ثم من خطوة واحدة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة الرمي بفرملة وبدونها ويستنتجون.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الخطوات الخمس على علامات بالعد مع سحب الرمح ثم الرمي من المشي.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مسارات بعلامات: المشي بالإيقاع دون رمي، ثم مع الرمي بالإشارة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا تكون الخطوة الخامسة قصيرة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الرمي من الجري الكامل.\n- الطالب: يشاهد.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يرمي أحدهما ويقيّم الآخر بالبطاقة (الحمل، الإيقاع، الفرملة، التخلص) ثم التبادل، 3 محاولات.\n- الطالب: يرمي ويقيّم.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش أهم نقطة تحسين.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما المرحلة التدريبية الأولى؟\nالإجابة: الإعداد البدني.\nس2 (المستوى المتوقع): ماذا تتضمن المرحلة الثانية؟\nالإجابة: الإعداد الفني والخاص والتنافسي.\nس3 (المستوى المتقدم): ماذا ينمي الوثب بالقدمين لأعلى؟\nالإجابة: القدرة العضلية للرجلين.\n\nالحصة 2:\nس1 (مستوى الدعم): لماذا نستخدم الأدوات البديلة؟\nالإجابة: لتعلم الحركة بأمان وتثبيت الإيقاع قبل الرمح.\nس2 (المستوى المتوقع): ماذا ينمي رمي الرمح بالذراعين معًا؟\nالإجابة: قوة الجذع والذراعين والشعور بمسار الرمح.\nس3 (المستوى المتقدم): ما قاعدة الأمان؟\nالإجابة: الرمي بالإشارة والجمع بعد الجميع.\n\nالحصة 3:\nس1 (مستوى الدعم): ما الفرملة؟\nالإجابة: تثبيت الرجل اليسرى لنقل سرعة الجسم إلى الرمح.\nس2 (المستوى المتوقع): ماذا يحدث دون فرملة؟\nالإجابة: تضيع السرعة ويضعف الرمي.\nس3 (المستوى المتقدم): أين تكون الركبة اليسرى عند الفرملة؟\nالإجابة: مثبتة.\n\nالحصة 4:\nس1 (مستوى الدعم): كم خطوة إيقاع؟\nالإجابة: خمس.\nس2 (المستوى المتوقع): متى يبدأ سحب الرمح؟\nالإجابة: مع بداية خطوات الإيقاع.\nس3 (المستوى المتقدم): بماذا تتميز الخطوة الخامسة؟\nالإجابة: قصيرة والقدم تمد في اتجاه الرمي.\n\nالحصة 5:\nس1 (مستوى الدعم): ما مرحلتا الاقتراب؟\nالإجابة: تزايد السرعة والإيقاع.\nس2 (المستوى المتوقع): اذكر تدريبًا لتحسين الرمي.\nالإجابة: الرمي من المشي ثم الجري.\nس3 (المستوى المتقدم): ما النقاط الأربع في بطاقة التقييم؟\nالإجابة: الحمل، الإيقاع، الفرملة، التخلص.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاثة تمرينات للإعداد البدني لرمي الرمح.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا يحتاج الرامي إلى السرعة؟\nالإجابة: لنقل سرعة الاقتراب إلى الرمح.\nس3 (المستوى المتقدم): ما الصفات البدنية لرامي الرمح؟\nالإجابة: القوة والسرعة والقوة المميزة بالسرعة والمرونة.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الرمي بكرة التنس من الحركة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ رمي الرمح بالذراعين معًا.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): ما الفرق بين الرمي بالصولجان والرمح؟\nالإجابة: الرمح يحتاج إلى مسك من القبضة وحمل فوق الكتف.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ الرمي من الوقوف بفرملة واضحة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر خطأ شائعًا في الفرملة.\nالإجابة: ثني الركبة اليسرى.\nس3 (المستوى المتقدم): كيف تساعد الفرملة على التقوس؟\nالإجابة: تكبح الحوض فيتقوس الجذع للخلف.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ الاقتراب بالعد والرمي من المشي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما خطأ الرمح المرتفع المقدمة في الاقتراب؟\nالإجابة: يجب أن تكون المقدمة منخفضة.\nس3 (المستوى المتقدم): كيف يحسن الإيقاع الرمي؟\nالإجابة: ينقل السرعة بانسيابية إلى التخلص.\n\nالحصة 5:\nس1 (مستوى الدعم): أدِّ الرمي من الاقتراب الكامل.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما نقطة التحسين لزميلك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما مسافتك الأفضل؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات الوثب والعدو القصير.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على الرمي بكرة تنس نحو هدف في مكان آمن.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تدريب الفرملة دون أداة.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تدريب الإيقاع بعصا على علامات.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على مراجعة قواعد مسابقة رمي الرمح (دليل المعلم ص 39-40)."}}, {"title": "تنظيم وإدارة مسابقة رمي الرمح", "unit": "مسابقات الميدان والمضمار", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 39-40، 45-46", "n": 5, "periods": [{"focus": "القواعد العامة للمسابقة (القرعة، المحاولات، المحاولة الفاشلة)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد العامة لمسابقة رمي الرمح.\n2. يحدد حالات المحاولة الفاشلة.\n3. يطبق القواعد على حالات افتراضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- جهاز عرض البيانات\n- السبورة الذكية\n- أخرى: بطاقات الحالات\n- أخرى: رماح", "المفاهيم": "- القرعة\n- المحاولات\n- المحاولة الفاشلة\n- قوس الرمي", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لو شارك 12 طالبًا، كم محاولة لكل منهم؟ (ص 39).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح القواعد: الترتيب بالقرعة، ثلاث محاولات فثلاث للثمانية الأوائل، ست محاولات لثمانية فأقل، حالات الفشل.\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تقرر في بطاقات حالات (لمس الأرض خارج القوس، سقوط الرمح خارج المقطع...).\n- الطالب: يقرر ويبرر.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: رمي تطبيقي مع حكم من الطلبة.\n- الطالب: يرمي ويحكم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف يرتب المتسابقون؟\nالإجابة: بالقرعة.\nس2 (المستوى المتوقع): كم محاولة إذا كان العدد ثمانية فأقل؟\nالإجابة: ست.\nس3 (المستوى المتقدم): اذكر حالة فشل.\nالإجابة: سقوط الرمح خارج المقطع.", "التقويم الختامي": "س1 (مستوى الدعم): متسابق ترك منطقة التخلص قبل سقوط الرمح، ما القرار؟\nالإجابة: محاولة فاشلة.\nس2 (المستوى المتوقع): 13 متسابقًا، كيف توزع المحاولات؟\nالإجابة: ثلاث للجميع ثم ثلاث للثمانية الأوائل.\nس3 (المستوى المتقدم): لماذا لا تحتسب فاشلة إذا انكسر الرمح؟\nالإجابة: لأن الرمية تمت وفق القانون.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد مسابقة رمي الرمح."}}, {"focus": "المصطلحات المستخدمة والأدوات والميدان والقياس", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف المصطلحات (قوس الرمي، مقطع الرمي، منطقة التخلص، العلامة) ومواصفات الميدان.\n2. يقيس الرمية من أقرب علامة إلى الحد الداخلي للقوس.\n3. يميز العلامات (البيضاء للفاشلة والحمراء للصحيحة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: علامات\n- أخرى: رماح\n- أخرى: جير", "المفاهيم": "- قوس الرمي\n- مقطع الرمي\n- العلامة\n- القياس", "التهيئة / التمهيد / التعلم القبلي": "يرسم المعلم الميدان على الأرض ويسأل: من أين يقاس الرمي؟ (ص 46، 51).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المصطلحات والميدان وطريقة القياس والعلامات.\n- الطالب: يستمع ويرسم.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات ترسم الميدان بالجير وتقيس رميات تجريبية.\n- الطالب: يرسم ويقيس.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا يقاس من الحد الداخلي للقوس؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما لون علامة المحاولة الصحيحة؟\nالإجابة: حمراء.\nس2 (المستوى المتوقع): من أين يقاس الرمي؟\nالإجابة: من أقرب علامة للرمح إلى الحد الداخلي للقوس.\nس3 (المستوى المتقدم): ما مقطع الرمي؟\nالإجابة: المنطقة التي يجب أن يسقط فيها الرمح.", "التقويم الختامي": "س1 (مستوى الدعم): قس رمية زميلك بالطريقة الصحيحة.\nالإجابة: يقيس.\nس2 (المستوى المتوقع): اذكر مصطلحين من مصطلحات المسابقة.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): هل يسمح باستخدام القفازات؟\nالإجابة: لا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على رسم ميدان الرمي وشرح مصطلحاته."}}, {"focus": "اللجان والحكام ومسؤولياتهم", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف لجان المسابقة (الحكام، القائسون، المسجلون، الأمن والسلامة).\n2. يحدد مسؤولية كل عضو.\n3. يصمم هيكلًا تنظيميًا لمسابقة مدرسية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: بطاقات الأدوار\n- أخرى: استمارات تسجيل", "المفاهيم": "- رئيس الحكام\n- القائس\n- المسجل\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يقرر صحة المحاولة ومن يقيس ومن يسجل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- ال
