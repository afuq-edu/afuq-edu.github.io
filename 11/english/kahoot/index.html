 const C=2*Math.PI*48,f=Math.max(0,rem/30);const c=$('#ring');c.style.strokeDasharray=C;c.style.strokeDashoffset=C*(1-f);
 const over=e>30;c.style.stroke=over?'#e8b86a':(rem<8?'#e9a58f':'#79c19a');
 $('#tnum').textContent=over?'+'+Math.floor(e-30):Math.ceil(rem);$('#tlab').textContent=over?'extra time':'sec';
 $('#livepts').textContent=cur<0&&!tInt?'Possible points: 1000':'Possible points now: '+pts(e);
}
function elapsed(){return tInt?(Date.now()-tStart)/1000:0}
function answer(ok,btn,choices,box){
 if(answered)return;if(cur<0){flash('Choose the answering group first');return}
 answered=true;const e=elapsed();stopTimer();
 [...box.children].forEach((b,i)=>{b.disabled=true;if(choices[i].ok)b.classList.add('good')});if(!ok)btn.classList.add('bad');
 award(ok,e);
}
function flash(t){const m=$('#msg');m.className='msg bad';m.textContent=t;setTimeout(()=>{if(!answered)m.classList.add('hide')},1800)}
let lastGain=0,lastWin=-1;
function award(ok,e){
 const p=ok?pts(e):0;G[cur].score+=p;lastGain=p;lastWin=ok?cur:-1;
 const m=$('#msg');m.classList.remove('hide');m.className='msg '+(ok?'good':'bad');
 m.textContent=ok?('Correct! +'+p+' points for '+G[cur].name):('Incorrect - no points for '+G[cur].name);
 ok?snd.good():snd.bad();$('#toChart').classList.remove('hide');$('#livepts').textContent='';
}
$('#showAns').onclick=()=>{if(answered)return;if(cur<0){flash('Choose the answering group first');return}answered=true;window._e=elapsed();stopTimer();
 const q=Q[qi];$('#revealBox').classList.remove('hide');$('#revealBox').textContent=q.a;$('#showAns').classList.add('hide');$('#jBtns').classList.remove('hide')};
$('#jOk').onclick=()=>{$('#jBtns').classList.add('hide');award(true,window._e)};
$('#jNo').onclick=()=>{$('#jBtns').classList.add('hide');award(false,window._e)};
$('#toChart').onclick=()=>{showChart()};
function showChart(){
 show('result');const ch=$('#chart'),nm=$('#cnames');ch.innerHTML='';nm.innerHTML='';
 const max=Math.max(1000,...G.map(g=>g.score));
 const order=G.map((g,i)=>({g,i})).sort((a,b)=>b.g.score-a.g.score);
 const rank={};order.forEach((o,r)=>rank[o.i]=r+1);
 G.forEach((g,i)=>{
  const c=el('div','col');const gain=el('div','gain',i===lastWin?'+'+lastGain:'');const sc=el('div','sc',String(g.score-(i===lastWin?lastGain:0)));
  const bar=el('div','bar'+(i===lastWin?' win':''));bar.style.background=g.color;
  c.appendChild(gain);c.appendChild(sc);c.appendChild(bar);ch.appendChild(c);
  const n=el('div','');n.appendChild(el('span','rank','#'+rank[i]));n.appendChild(document.createTextNode(g.name));nm.appendChild(n);
  const prevH=((g.score-(i===lastWin?lastGain:0))/max*100);bar.style.height=prevH+'%';
  setTimeout(()=>{bar.style.height=Math.max(2,g.score/max*100)+'%';animNum(sc,g.score-(i===lastWin?lastGain:0),g.score)},350);
 });
 $('#rtitle').textContent='Group ranking after question '+(qi+1)+' of '+Q.length;
 $('#nextBtn').textContent=qi+1>=Q.length?'Show the podium':'Next question';
}
function animNum(e,a,b){const t0=performance.now();const d=1000;function f(t){const k=Math.min(1,(t-t0)/d);e.textContent=Math.round(a+(b-a)*k);if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
$('#nextBtn').onclick=()=>{qi++;nextQ()};
function final(){
 show('final');const ord=G.slice().sort((a,b)=>b.score-a.score);const pod=$('#pod');pod.innerHTML='';
 const layout=ord.length>=3?[1,0,2]:[1,0].filter(i=>i<ord.length);
 const hs={0:'100%',1:'78%',2:'60%'};const medals=['🥇','🥈','🥉'];
 layout.forEach(i=>{const g=ord[i];const s=el('div','step');s.appendChild(el('div','who',g.name+' ('+g.score+')'));const b=el('div','blk',medals[i]);b.style.background=g.color;b.style.color='#2b3a4a';s.appendChild(b);pod.appendChild(s);setTimeout(()=>{b.style.height=(i===0?'240px':i===1?'190px':'150px')},300+(2-i)*400)});
 const rest=ord.slice(3);$('#rest').innerHTML='';rest.forEach((g,k)=>{const d=el('div','small',(k+4)+'. '+g.name+' — '+g.score);$('#rest').appendChild(d)});
 setTimeout(()=>{snd.fan();confetti()},1200);
}
function confetti(){for(let i=0;i<46;i++){const c=el('div','conf');c.style.left=Math.random()*100+'vw';c.style.background=COLORS[i%6];c.style.animationDuration=(4+Math.random()*3)+'s';c.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),9000)}}
$('#again').onclick=()=>{show('setup')};
$('#replay').onclick=()=>{G.forEach(g=>g.score=0);qi=0;nextQ()};
show('setup');
</script></body></html>
