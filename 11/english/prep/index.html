 Which phrases belong to sailing holidays and why?\nAnswer: Luxury yacht hire and experienced crews – both are connected with boats and sailing.\n\nPeriod 3:\nQ1 (Support level): Which holiday is advertised in the ad about a hotel built entirely of ice?\nAnswer: Ice tourism (ad b).\nQ2 (Expected level): Which advertisement is about 'visiting local markets'?\nAnswer: The cooking holiday advertisement (e).\nQ3 (Advanced level): Which key words in 'accommodation that disappears' lead you to the ice hotel ad?\nAnswer: 'Disappears' links to 'the hotel melts in early spring'.\n\nPeriod 4:\nQ1 (Support level): Name one benefit of foreign tourism.\nAnswer: e.g. it helps the economy / creates jobs / promotes international understanding.\nQ2 (Expected level): Name one disadvantage of foreign tourism.\nAnswer: e.g. it can change local traditions / cause crowding.\nQ3 (Advanced level): Do the advantages outweigh the disadvantages? Give reasons.\nAnswer: Open answer with reasons."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What do you do on a sightseeing tour?\nAnswer: See the famous places of a town or area.\nQ2 (Expected level): Which holiday is relaxing: a cruise or an adventure holiday?\nAnswer: A cruise.\nQ3 (Advanced level): Which type of holiday would you choose for your family and why?\nAnswer: Open answer with a reason.\n\nPeriod 2:\nQ1 (Support level): Which type is going on safari?\nAnswer: Wildlife holidays.\nQ2 (Expected level): Which two phrases belong to wildlife holidays?\nAnswer: Going on safari and whale watching.\nQ3 (Advanced level): Add two phrases of your own to extreme sports tourism.\nAnswer: Open answer, e.g. skydiving, rock climbing.\n\nPeriod 3:\nQ1 (Support level): Which advertisement is about creating a work of art?\nAnswer: The painting holidays advertisement (c).\nQ2 (Expected level): Which advert is for 'a variety of physical activities'?\nAnswer: The adventure sports advert (a).\nQ3 (Advanced level): Write a two-sentence advertisement for a holiday in Oman.\nAnswer: Open answer using persuasive adjectives.\n\nPeriod 4:\nQ1 (Support level): Complete: Foreign tourism helps to promote international ______.\nAnswer: understanding.\nQ2 (Expected level): Give two effects of tourism on local traditions.\nAnswer: Open answer.\nQ3 (Advanced level): Write a four-sentence paragraph with a concluding sentence about tourism in Oman.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents read CB p. 34 (Unit 1 activities) and list holiday words they know.\n\nPeriod 2:\nStudents make a four-column chart of the types and phrases.\n\nPeriod 3:\nStudents collect two holiday advertisements and underline the key words.\n\nPeriod 4:\nStudents write the final draft and put both drafts in the portfolio. WB pp. 30–31 are completed."]]}, {"label": "Theme 3 - Unit 2: Getting There", "periods": [{"focus": "Reading jumbled brochures: bus and flight to Salalah (CB p. 36, Activity 1)", "week": "Week 9: 1/11 - 5/11", "num": 53, "fields": [[1, "Learning Outcomes", "1. Sort paragraphs into two brochures\n2. Put the paragraphs of each brochure in order"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Analyze"], [3, "Strategies", "1. Problem-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. brochure\n2. border control\n3. travel permit\n4. chauffeur-driven\n5. refreshment stop\n6. terminal\n7. depart\n8. arrive"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'How can you travel from Dubai to Salalah? Which is faster?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: The problem. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: presents eight jumbled paragraphs and asks: Which paragraphs describe the bus trip and which the flight?.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a plan for sorting.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Sort and order. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: sort paragraphs a–h into two brochures and order them (bus: c, e, g, b; flight: f, h, a, d) using time and sequence clues.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two ordered brochures.\n\nActivity 3 (12 minutes):\n- Strategy: Problem-based learning\n- Teacher: Check and justify. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: justify the order using clues such as times, 'after', 'on arrival'.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a clue list.\n\nActivity 4 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: Compare. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: say which journey you prefer and why.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: one reason."], [8, "Formative Assessment", "Q1 (Support level): How long is the flight from Dubai to Salalah in the brochure?\nAnswer: About two hours (9:30 am departure and 11 am landing).\nQ2 (Expected level): Which paragraph begins the bus brochure?\nAnswer: Paragraph c – boarding the bus at Dubai bus station at 7:30 am.\nQ3 (Advanced level): What time clues help you order the bus journey?\nAnswer: 7.30am boarding, 45 minutes to the border, 30 minutes formalities, Nizwa stop (20 min), Hayma lunch, Thumrait 6pm, arrival 6.45pm."], [9, "Summative Assessment", "Q1 (Support level): What do you need to buy at the border?\nAnswer: A travel permit.\nQ2 (Expected level): Where does the bus stop for a refreshment break?\nAnswer: Nizwa.\nQ3 (Advanced level): Which would you choose, the flight or the bus? Give two reasons.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students read paragraphs a–h again and underline time words."]]}, {"focus": "Listening to a message and true/false/NG (CB p. 36–37, Activities 2–3)", "week": "Week 9: 1/11 - 5/11", "num": 54, "fields": [[1, "Learning Outcomes", "1. Listen for specific information in a telephone message\n2. Decide whether statements are true, false or not given"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Analyze"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. answering machine\n2. set out\n3. border\n4. visa\n5. fort\n6. petrol\n7. hotel number"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What do people say when they leave a phone message?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Listening model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models reading statements a–i first and underlining key words to listen for.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a key-word list.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and decide. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the message twice and mark statements a–i T, F or NG.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a completed answer list.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Compare and justify. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers and listen again to settle differences.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected answers.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Own message. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: write a two-line message on an answering machine.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a short message."], [8, "Formative Assessment", "Q1 (Support level): What is the first thing you listen for in a message: the name or the weather?\nAnswer: The name (and the main details).\nQ2 (Expected level): How do you decide NG in a listening task?\nAnswer: If the recording does not give the information, the answer is NG.\nQ3 (Advanced level): Write a statement that would be NG for a message about a trip.\nAnswer: Open answer, e.g. He will take a lot of luggage (if not mentioned)."], [9, "Summative Assessment", "Q1 (Support level): Why do we read statements before listening?\nAnswer: To know what information to listen for.\nQ2 (Expected level): Give one thing a traveller might say about his plans in a message.\nAnswer: e.g. the time he will leave, places he will stop.\nQ3 (Advanced level): Leave a short telephone message about your journey to a friend (3 sentences).\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students record or write a message about their next trip."]]}, {"focus": "Grammar Recall: ways of expressing the future (CB p. 37)", "week": "Week 10: 8/11 - 12/11", "num": 55, "fields": [[1, "Learning Outcomes", "1. State the uses of will, going to and the present continuous for the future\n2. Match sentences to uses"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. will\n2. won't\n3. going to\n4. present continuous for the future\n5. prediction\n6. offer\n7. promise\n8. decision\n9. plan\n10. arrangement"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'I'm meeting my brother tomorrow' and 'It will rain tomorrow' and asks how they differ."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the forms. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: compare six sentences with different future forms and group them by form.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a three-column chart.\n\nActivity 2 (14 minutes):\n- Strategy: Discovery learning\n- Teacher: Match sentences to uses. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: match: 1→e, 2→a, 3→d, 4→a, 5→c, 6→b (prediction, offer/promise, decision, plan, arrangement).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a completed rule chart.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Find in the message. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: find three different future forms in the sentences from the listening message.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three examples.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: State the rule. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: explain one rule to a partner with an example.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a spoken rule."], [8, "Formative Assessment", "Q1 (Support level): Which future form is used in: 'I'm going to watch TV, then go to bed'?\nAnswer: 'going to' – a future plan or intention.\nQ2 (Expected level): Why is 'I'll have the blue one' using will?\nAnswer: A decision made at the moment of speaking.\nQ3 (Advanced level): What is the difference between 'I'm meeting my brother tomorrow' and 'I'm going to meet my brother'?\nAnswer: The present continuous shows a fixed arrangement; 'going to' shows an intention or plan."], [9, "Summative Assessment", "Q1 (Support level): Which form shows a promise: 'I'll help you with your homework.' or 'I'm helping you now.'?\nAnswer: 'I'll help you…' (will).\nQ2 (Expected level): Give one prediction using will.\nAnswer: Open answer, e.g. Cars will fly in the future.\nQ3 (Advanced level): Write three sentences about tomorrow: a plan, an arrangement and a prediction.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students write five sentences about their weekend using three future forms."]]}, {"focus": "Choosing the best future forms (CB p. 37, Activity 4)", "week": "Week 10: 8/11 - 12/11", "num": 56, "fields": [[1, "Learning Outcomes", "1. Choose the best future form for each context\n2. Justify the choice of form"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "1. Modeling\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. going to\n2. will\n3. present continuous\n4. predict\n5. promise\n6. arrangement"], [6, "Warm-up / Introduction / Prior Learning", "Reads: 'I can't come tomorrow because I'm ______ my parents.' and asks for the verb."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling choice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models choosing between will, going to and the present continuous using a context clue (plan, arrangement, promise).\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a decision flow chart.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Sentences a–g. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: choose the best form: a We're going to go, b will happen, c I'm visiting, d I'll work, e is going to have, f won't replace, g She's meeting.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: seven correct answers.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Check and explain. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: explain each choice to a partner.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: reasons.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Own sentences. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write two original sentences.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: two sentences."], [8, "Formative Assessment", "Q1 (Support level): Choose: I promise I (will work / am working) harder next year.\nAnswer: will work.\nQ2 (Expected level): Choose: That man is driving too fast. He (is going to have / is having) an accident soon.\nAnswer: is going to have.\nQ3 (Advanced level): Why is 'She's meeting her friend later today' correct?\nAnswer: It is an arrangement for the near future, so the present continuous is used."], [9, "Summative Assessment", "Q1 (Support level): Choose: What do you think (will happen / is happening) in the next ten years?\nAnswer: will happen.\nQ2 (Expected level): Choose: I can't come because I (visit / am visiting) my parents tomorrow.\nAnswer: am visiting.\nQ3 (Advanced level): Write two sentences: one with 'will' (prediction) and one with 'going to' (plan).\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students correct five sentences from the board."]]}, {"focus": "Activate Your English: preparing for a holiday; WB pp. 32–33 and Grammar Practice (WB p. 66)", "week": "Week 10: 8/11 - 12/11", "num": 57, "fields": [[1, "Learning Outcomes", "1. Make plans and decisions using future forms in a dialogue\n2. Write sentences about future arrangements"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "1. Game-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "1. to-do list\n2. buy tickets\n3. change money\n4. I'll get them\n5. we need to\n6. plan"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What do you need to do before going on a trip?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: List ten things. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: in pairs write ten things to do before a holiday.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of ten items.\n\nActivity 2 (14 minutes):\n- Strategy: Game-based learning\n- Teacher: Planning game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: exchange lists with another pair and take turns saying who will do what and when (e.g. 'I'm going to the bank on Thursday. I'll change it then.'); score accurate future forms.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a dialogue with scores.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Workbook practice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: complete WB pp. 32–33 and Grammar Practice (WB p. 66) in groups.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: completed tasks.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Feedback. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give one positive comment and one correction.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a feedback note."], [8, "Formative Assessment", "Q1 (Support level): Complete: We need to buy the plane tickets. I ______ get them tomorrow.\nAnswer: 'll / will.\nQ2 (Expected level): Make a sentence with 'I'm … -ing' for an arrangement for Thursday.\nAnswer: Open answer, e.g. I'm going to the bank on Thursday.\nQ3 (Advanced level): Write a short dialogue (4 lines) planning a holiday with a friend.\nAnswer: Open answer using will, going to and the present continuous."], [9, "Summative Assessment", "Q1 (Support level): Which form for a decision at the moment: will or the present continuous?\nAnswer: will.\nQ2 (Expected level): Correct: 'I will meeting my friend tomorrow.'\nAnswer: I'm meeting my friend tomorrow.\nQ3 (Advanced level):  rule.\n\nPeriod 4:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling choice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models choosing between will, going to and the present continuous using a context clue (plan, arrangement, promise).\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a decision flow chart.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Sentences a–g. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: choose the best form: a We're going to go, b will happen, c I'm visiting, d I'll work, e is going to have, f won't replace, g She's meeting.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: seven correct answers.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Check and explain. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: explain each choice to a partner.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: reasons.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Own sentences. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write two original sentences.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: two sentences.\n\nPeriod 5:\nActivity 1 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: List ten things. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: in pairs write ten things to do before a holiday.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of ten items.\n\nActivity 2 (14 minutes):\n- Strategy: Game-based learning\n- Teacher: Planning game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: exchange lists with another pair and take turns saying who will do what and when (e.g. 'I'm going to the bank on Thursday. I'll change it then.'); score accurate future forms.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a dialogue with scores.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Workbook practice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: complete WB pp. 32–33 and Grammar Practice (WB p. 66) in groups.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: completed tasks.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Feedback. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give one positive comment and one correction.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a feedback note."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): How long is the flight from Dubai to Salalah in the brochure?\nAnswer: About two hours (9:30 am departure and 11 am landing).\nQ2 (Expected level): Which paragraph begins the bus brochure?\nAnswer: Paragraph c – boarding the bus at Dubai bus station at 7:30 am.\nQ3 (Advanced level): What time clues help you order the bus journey?\nAnswer: 7.30am boarding, 45 minutes to the border, 30 minutes formalities, Nizwa stop (20 min), Hayma lunch, Thumrait 6pm, arrival 6.45pm.\n\nPeriod 2:\nQ1 (Support level): What is the first thing you listen for in a message: the name or the weather?\nAnswer: The name (and the main details).\nQ2 (Expected level): How do you decide NG in a listening task?\nAnswer: If the recording does not give the information, the answer is NG.\nQ3 (Advanced level): Write a statement that would be NG for a message about a trip.\nAnswer: Open answer, e.g. He will take a lot of luggage (if not mentioned).\n\nPeriod 3:\nQ1 (Support level): Which future form is used in: 'I'm going to watch TV, then go to bed'?\nAnswer: 'going to' – a future plan or intention.\nQ2 (Expected level): Why is 'I'll have the blue one' using will?\nAnswer: A decision made at the moment of speaking.\nQ3 (Advanced level): What is the difference between 'I'm meeting my brother tomorrow' and 'I'm going to meet my brother'?\nAnswer: The present continuous shows a fixed arrangement; 'going to' shows an intention or plan.\n\nPeriod 4:\nQ1 (Support level): Choose: I promise I (will work / am working) harder next year.\nAnswer: will work.\nQ2 (Expected level): Choose: That man is driving too fast. He (is going to have / is having) an accident soon.\nAnswer: is going to have.\nQ3 (Advanced level): Why is 'She's meeting her friend later today' correct?\nAnswer: It is an arrangement for the near future, so the present continuous is used.\n\nPeriod 5:\nQ1 (Support level): Complete: We need to buy the plane tickets. I ______ get them tomorrow.\nAnswer: 'll / will.\nQ2 (Expected level): Make a sentence with 'I'm … -ing' for an arrangement for Thursday.\nAnswer: Open answer, e.g. I'm going to the bank on Thursday.\nQ3 (Advanced level): Write a short dialogue (4 lines) planning a holiday with a friend.\nAnswer: Open answer using will, going to and the present continuous."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What do you need to buy at the border?\nAnswer: A travel permit.\nQ2 (Expected level): Where does the bus stop for a refreshment break?\nAnswer: Nizwa.\nQ3 (Advanced level): Which would you choose, the flight or the bus? Give two reasons.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): Why do we read statements before listening?\nAnswer: To know what information to listen for.\nQ2 (Expected level): Give one thing a traveller might say about his plans in a message.\nAnswer: e.g. the time he will leave, places he will stop.\nQ3 (Advanced level): Leave a short telephone message about your journey to a friend (3 sentences).\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Which form shows a promise: 'I'll help you with your homework.' or 'I'm helping you now.'?\nAnswer: 'I'll help you…' (will).\nQ2 (Expected level): Give one prediction using will.\nAnswer: Open answer, e.g. Cars will fly in the future.\nQ3 (Advanced level): Write three sentences about tomorrow: a plan, an arrangement and a prediction.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): Choose: What do you think (will happen / is happening) in the next ten years?\nAnswer: will happen.\nQ2 (Expected level): Choose: I can't come because I (visit / am visiting) my parents tomorrow.\nAnswer: am visiting.\nQ3 (Advanced level): Write two sentences: one with 'will' (prediction) and one with 'going to' (plan).\nAnswer: Open answer.\n\nPeriod 5:\nQ1 (Support level): Which form for a decision at the moment: will or the present continuous?\nAnswer: will.\nQ2 (Expected level): Correct: 'I will meeting my friend tomorrow.'\nAnswer: I'm meeting my friend tomorrow.\nQ3 (Advanced level): Write three sentences about preparing for a trip using three future forms.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents read paragraphs a–h again and underline time words.\n\nPeriod 2:\nStudents record or write a message about their next trip.\n\nPeriod 3:\nStudents write five sentences about their weekend using three future forms.\n\nPeriod 4:\nStudents correct five sentences from the board.\n\nPeriod 5:\nStudents finish the workbook tasks."]]}, {"label": "Theme 3 - Unit 3: Destinations", "periods": [{"focus": "Which holidaymakers suit which brochures? (CB p. 38, Activity 1; WB p. 34)", "week": "Week 10: 8/11 - 12/11", "num": 58, "fields": [[1, "Learning Outcomes", "1. Match holiday brochures to groups of holidaymakers\n2. Justify choices using reasons"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Evaluate"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook p. 34)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. brochure\n2. honeymoon\n3. middle-aged\n4. professional\n5. cosmopolitan\n6. secluded\n7. unspoilt\n8. luxury"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Where would a honeymoon couple go? Where would two students go?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: think about different holiday needs.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Match groups. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decide which group (friends in their early twenties, honeymoon couple, middle-aged professional couple, two friends seeking an unusual natural environment) each brochure suits and why.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: four matches with reasons.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Adjective sort. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: sort holiday adjectives (five-star, lively, dreamy, exotic, cosmopolitan, secluded, entertaining, luxurious, private, superb, romantic, first-class, unspoilt, vibrant, adventurous) under each brochure.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: four word boxes.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: explain one choice to the class.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one reason."], [8, "Formative Assessment", "Q1 (Support level): Which group of holidaymakers would like a secluded, romantic place?\nAnswer: A honeymoon couple.\nQ2 (Expected level): Which adjective is likely in a brochure for friends in their early twenties in a big city: lively or secluded?\nAnswer: lively.\nQ3 (Advanced level): Why would a middle-aged professional couple like 'first-class' and 'luxurious' hotels?\nAnswer: They want top quality and comfort."], [9, "Summative Assessment", "Q1 (Support level): What does 'unspoilt' mean in a holiday brochure?\nAnswer: Natural and not damaged by tourism.\nQ2 (Expected level): Which two adjectives suit an adventure holiday?\nAnswer: adventurous and exotic / vibrant (any suitable).\nQ3 (Advanced level): Write two sentences describing a holiday resort using four adjectives.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students learn the fifteen holiday adjectives."]]}, {"focus": "Learning vocabulary in phrases (CB p. 39, Activity 3)", "week": "Week 10: 8/11 - 12/11", "num": 59, "fields": [[1, "Learning Outcomes", "1. Understand phrases that describe tourist places\n2. Link phrases to places in Oman"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Apply"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)"], [5, "Concepts", "1. rolling sand dunes\n2. busy souks\n3. variety of wildlife\n4. beautiful beaches\n5. old forts\n6. interesting museums\n7. traditional handicrafts\n8. wooden dhows\n9. expert craftsmen\n10. high mountains"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'rolling sand dunes' and asks: 'Where in Oman can you see this?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Why phrases help. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: compare learning 'dunes' with learning 'rolling sand dunes' and decide which is easier to remember.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a statement about learning phrases.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Check meanings. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: check ten phrases in a dictionary and copy them with meanings.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a phrase list with meanings.\n\nActivity 3 (12 minutes):\n- Strategy: Discovery learning\n- Teacher: Places in Oman. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: think of places in Oman for each phrase (e.g. Wahiba Sands, Muttrah souq, Nakhal Fort, Sur dhows).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: ten phrase–place pairs.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Test a partner. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: one partner says a place, the other gives a phrase.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: five correct answers."], [8, "Formative Assessment", "Q1 (Support level): Which phrase describes the Wahiba Sands?\nAnswer: rolling sand dunes.\nQ2 (Expected level): Where in Oman can you see old forts?\nAnswer: e.g. Nizwa, Bahla, Nakhal (any correct place).\nQ3 (Advanced level): Write a sentence about Muttrah using two phrases.\nAnswer: Open answer, e.g. Muttrah has busy souks and traditional handicrafts."], [9, "Summative Assessment", "Q1 (Support level): What are 'wooden dhows'?\nAnswer: Traditional wooden boats.\nQ2 (Expected level): Match: expert craftsmen = ?\nAnswer: People with great skill in making things by hand.\nQ3 (Advanced level): Write two sentences about a region of Oman using four phrases from the lesson.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students write five sentences about places in Oman using the phrases."]]}, {"focus": "Role play: choosing a hotel (CB p. 39, Activity 4)", "week": "Week 10: 8/11 - 12/11", "num": 60, "fields": [[1, "Learning Outcomes", "1. Ask and answer about hotel facilities in a role play\n2. Decide on a suitable hotel using criteria"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (role cards)"], [5, "Concepts", "1. hotel owner\n2. facilities\n3. swimming pool\n4. near the beach\n5. local transport\n6. sports facilities\n7. couple\n8. students"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What do you look for in a hotel?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Model dialogue. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models a hotel-owner and guest dialogue with questions about location, beach and facilities.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a model dialogue.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Role play. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: in groups of three, A is the hotel owner (with a hotel name and facilities); B and C are a couple, a family, an elderly couple or students deciding what matters.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a role play.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Decide. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: B and C discuss whether it is a good place to stay.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a decision with reasons.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Feedback. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: other groups tick the vocabulary used.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a vocabulary tick-list."], [8, "Formative Assessment", "Q1 (Support level): Ask a question about a hotel's location.\nAnswer: e.g. Is the hotel near the beach?\nQ2 (Expected level): What facilities might a family with children want?\nAnswer: e.g. a swimming pool, a kids' club, restaurants.\nQ3 (Advanced level): Write a four-line dialogue between a hotel owner and a guest.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): Complete: 'Does your hotel have a swimming ______?'\nAnswer: pool.\nQ2 (Expected level): Name two things an elderly couple may want in a hotel.\nAnswer: e.g. quiet rooms, easy access, local transport.\nQ3 (Advanced level): Write four sentences advertising a hotel to students.\nAnswer: Open answer using holiday adjectives."], [10, "Notes within the Weekly Study Plan", "Students write a short advertisement for their role-play hotel."]]}, {"focus": "Consolidation: WB pp. 34–35 and describing places", "week": "Week 11: 15/11 - 19/11", "num": 61, "fields": [[1, "Learning Outcomes", "1. Complete vocabulary tasks on holiday adjectives and phrases\n2. Write a short description of a tourist place"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Create"], [3, "Strategies", "1. Self-learning\n2. Project-based learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "1. describe\n2. adjective\n3. exotic\n4. vibrant\n5. superb\n6. breathtaking"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Describe your favourite place in Oman in three words.'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Warm-up. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write three words for a favourite place.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: three words.\n\nActivity 2 (18 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 34–35 and check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 3 (12 minutes):\n- Strategy: Project-based learning\n- Teacher: Mini-brochure. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: write a 5-line description of a tourist place in Oman using five adjectives and two phrases.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a short brochure text.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: underline the vocabulary used.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-check."], [8, "Formative Assessment", "Q1 (Support level): Choose the best adjective for a quiet beach: lively or secluded?\nAnswer: secluded.\nQ2 (Expected level): Complete: a city that has people from many countries is ______.\nAnswer: cosmopolitan.\nQ3 (Advanced level): Write two descriptive sentences about a mountain village using four adjectives.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): Match: luxurious = ?\nAnswer: Very comfortable and expensive.\nQ2 (Expected level): Which adjective means 'natural and untouched': unspoilt or entertaining?\nAnswer: unspoilt.\nQ3 (Advanced level): Write a four-sentence description of a resort using the vocabulary of the unit.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 34–35."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Match holiday brochures to groups of holidaymakers\n2. Justify choices using reasons\n\nPeriod 2:\n1. Understand phrases that describe tourist places\n2. Link phrases to places in Oman\n\nPeriod 3:\n1. Ask and answer about hotel facilities in a role play\n2. Decide on a suitable hotel u tuation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: compare learning 'dunes' with learning 'rolling sand dunes' and decide which is easier to remember.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a statement about learning phrases.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Check meanings. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: check ten phrases in a dictionary and copy them with meanings.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a phrase list with meanings.\n\nActivity 3 (12 minutes):\n- Strategy: Discovery learning\n- Teacher: Places in Oman. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: think of places in Oman for each phrase (e.g. Wahiba Sands, Muttrah souq, Nakhal Fort, Sur dhows).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: ten phrase–place pairs.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Test a partner. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: one partner says a place, the other gives a phrase.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: five correct answers.\n\nPeriod 3:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Model dialogue. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models a hotel-owner and guest dialogue with questions about location, beach and facilities.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a model dialogue.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Role play. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: in groups of three, A is the hotel owner (with a hotel name and facilities); B and C are a couple, a family, an elderly couple or students deciding what matters.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a role play.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Decide. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: B and C discuss whether it is a good place to stay.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a decision with reasons.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Feedback. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: other groups tick the vocabulary used.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a vocabulary tick-list.\n\nPeriod 4:\nActivity 1 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Warm-up. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write three words for a favourite place.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: three words.\n\nActivity 2 (18 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 34–35 and check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 3 (12 minutes):\n- Strategy: Project-based learning\n- Teacher: Mini-brochure. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: write a 5-line description of a tourist place in Oman using five adjectives and two phrases.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a short brochure text.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: underline the vocabulary used.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-check."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Which group of holidaymakers would like a secluded, romantic place?\nAnswer: A honeymoon couple.\nQ2 (Expected level): Which adjective is likely in a brochure for friends in their early twenties in a big city: lively or secluded?\nAnswer: lively.\nQ3 (Advanced level): Why would a middle-aged professional couple like 'first-class' and 'luxurious' hotels?\nAnswer: They want top quality and comfort.\n\nPeriod 2:\nQ1 (Support level): Which phrase describes the Wahiba Sands?\nAnswer: rolling sand dunes.\nQ2 (Expected level): Where in Oman can you see old forts?\nAnswer: e.g. Nizwa, Bahla, Nakhal (any correct place).\nQ3 (Advanced level): Write a sentence about Muttrah using two phrases.\nAnswer: Open answer, e.g. Muttrah has busy souks and traditional handicrafts.\n\nPeriod 3:\nQ1 (Support level): Ask a question about a hotel's location.\nAnswer: e.g. Is the hotel near the beach?\nQ2 (Expected level): What facilities might a family with children want?\nAnswer: e.g. a swimming pool, a kids' club, restaurants.\nQ3 (Advanced level): Write a four-line dialogue between a hotel owner and a guest.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): Choose the best adjective for a quiet beach: lively or secluded?\nAnswer: secluded.\nQ2 (Expected level): Complete: a city that has people from many countries is ______.\nAnswer: cosmopolitan.\nQ3 (Advanced level): Write two descriptive sentences about a mountain village using four adjectives.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What does 'unspoilt' mean in a holiday brochure?\nAnswer: Natural and not damaged by tourism.\nQ2 (Expected level): Which two adjectives suit an adventure holiday?\nAnswer: adventurous and exotic / vibrant (any suitable).\nQ3 (Advanced level): Write two sentences describing a holiday resort using four adjectives.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): What are 'wooden dhows'?\nAnswer: Traditional wooden boats.\nQ2 (Expected level): Match: expert craftsmen = ?\nAnswer: People with great skill in making things by hand.\nQ3 (Advanced level): Write two sentences about a region of Oman using four phrases from the lesson.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Complete: 'Does your hotel have a swimming ______?'\nAnswer: pool.\nQ2 (Expected level): Name two things an elderly couple may want in a hotel.\nAnswer: e.g. quiet rooms, easy access, local transport.\nQ3 (Advanced level): Write four sentences advertising a hotel to students.\nAnswer: Open answer using holiday adjectives.\n\nPeriod 4:\nQ1 (Support level): Match: luxurious = ?\nAnswer: Very comfortable and expensive.\nQ2 (Expected level): Which adjective means 'natural and untouched': unspoilt or entertaining?\nAnswer: unspoilt.\nQ3 (Advanced level): Write a four-sentence description of a resort using the vocabulary of the unit.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents learn the fifteen holiday adjectives.\n\nPeriod 2:\nStudents write five sentences about places in Oman using the phrases.\n\nPeriod 3:\nStudents write a short advertisement for their role-play hotel.\n\nPeriod 4:\nStudents finish WB pp. 34–35."]]}, {"label": "Theme 3 - Unit 4: Tourist Information", "periods": [{"focus": "Reading about tourist sites in Dhofar (CB p. 40; WB p. 36)", "week": "Week 11: 15/11 - 19/11", "num": 62, "fields": [[1, "Learning Outcomes", "1. Find specific information about tourist sites in Dhofar\n2. Name what each site is famous for"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Understand"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Illustrative picture\n4. Traditional board\n5. Pens"], [5, "Concepts", "1. Khor Rori\n2. Tawi Attair\n3. Mughsayl\n4. Sadah\n5. Taqah\n6. Jarzeez Springs\n7. Mirbat\n8. Salalah Museum\n9. Khareef"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What do you know about Dhofar and the Khareef season?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share what they know about Dhofar.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (18 minutes):\n- Strategy: Cooperative learning\n- Teacher: Jigsaw reading. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: each member reads about two sites (Khor Rori, Tawi Attair, Mughsayl, Sadah, Taqah, Jarzeez, Mirbat, Salalah Museum) and teaches the others.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a table: site – features.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: WB p. 36 task. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: complete WB p. 36 Activity 1 using the table.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a completed task.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Quick quiz. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: ask each other 'What is X famous for?'.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: five quiz answers."], [8, "Formative Assessment", "Q1 (Support level): What is Tawi Attair?\nAnswer: A natural sinkhole over 100 metres wide and 220 metres deep, home to many birds.\nQ2 (Expected level): What is Taqah famous for?\nAnswer: Its pottery and silverwork; its fort is famous for wooden doors and screens.\nQ3 (Advanced level): Why is Mirbat Fort famous?\nAnswer: It survived an attack in 1970 that threatened to destroy the town and its port."], [9, "Summative Assessment", "Q1 (Support level): Which site has blowholes that shoot fountains of water 30 metres high?\nAnswer: Mughsayl.\nQ2 (Expected level): What can visitors do at Sadah?\nAnswer: Camp, sail and dive on its beautiful beaches and visit the fort.\nQ3 (Advanced level): Which site would you recommend to a bird-lover and why?\nAnswer: Tawi Attair or Khor Rori – both are good for studying birdlife."], [10, "Notes within the Weekly Study Plan", "Students choose their favourite site and write two sentences about it."]]}, {"focus": "Making and responding to suggestions (CB p. 41, Soundbites)", "week": "Week 11: 15/11 - 19/11", "num": 63, "fields": [[1, "Learning Outcomes", "1. Use phrases to make suggestions\n2. Respond to suggestions  Task: other pairs tick the phrases used.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a tick-list."], [8, "Formative Assessment", "Q1 (Support level): Complete: 'How about ______ them to Taqah?'\nAnswer: taking.\nQ2 (Expected level): Which response means you prefer a different plan: 'Good idea.' or 'I'd prefer to go to the wadi.'?\nAnswer: I'd prefer to go to the wadi.\nQ3 (Advanced level): Write two suggestions for visitors to Salalah using different phrases.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): Which phrase begins with 'If I…'?\nAnswer: If I were you, I'd…\nQ2 (Expected level): Respond to: 'Why don't you visit Khor Rori?'\nAnswer: e.g. Good idea. / I'd rather go to the beach.\nQ3 (Advanced level): Write a three-line dialogue with a suggestion and a response.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students prepare three suggestions for a friend visiting their town."]]}, {"focus": "Role play: tourist information centre (CB p. 41, Activity 2; Communication Activity)", "week": "Week 11: 15/11 - 19/11", "num": 64, "fields": [[1, "Learning Outcomes", "1. Perform a role play in which visitors ask for suggestions\n2. Decide on a sightseeing plan"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "1. Cooperative learning\n2. Game-based learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (role cards)"], [5, "Concepts", "1. tourist information centre\n2. sightseeing\n3. visitors\n4. suggestions\n5. itinerary\n6. decide"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What would you ask at a tourist information centre?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Roles. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: assign roles (two visitors and one information officer) and read the instructions.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: role cards.\n\nActivity 2 (18 minutes):\n- Strategy: Game-based learning\n- Teacher: Role-play game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: visitors ask for suggestions and respond; the officer uses CB pp. 40–41 information; the class scores use of suggestion and response phrases.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: three role plays with scores.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Decide. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: visitors agree on a one-day plan.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a one-day plan.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Feedback. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give feedback on phrases and fluency.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a feedback note."], [8, "Formative Assessment", "Q1 (Support level): What does a tourist information officer do?\nAnswer: Gives visitors information and suggestions about places to visit.\nQ2 (Expected level): Make a suggestion for a visitor who likes history.\nAnswer: e.g. Why don't you visit Khor Rori?\nQ3 (Advanced level): Write four lines of a dialogue between a visitor and an officer.\nAnswer: Open answer."], [9, "Summative As ions and justify the answers. Product: three role plays with scores.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Decide. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: visitors agree on a one-day plan.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a one-day plan.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Feedback. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give feedback on phrases and fluency.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a feedback note.\n\nPeriod 4:\nActivity 1 (5 minutes):\n- Strategy: Cooperative learning\n- Teacher: Warm-up. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: guess the plan from a short extract.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a prediction.\n\nActivity 2 (20 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook tasks. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 36–37 and check with the answer key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Speaking practice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: perform short suggestion dialogues for peers.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two performed dialogues.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: tick a speaking checklist (phrases, clear voice, eye contact).\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a completed checklist."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): What is Tawi Attair?\nAnswer: A natural sinkhole over 100 metres wide and 220 metres deep, home to many birds.\nQ2 (Expected level): What is Taqah famous for?\nAnswer: Its pottery and silverwork; its fort is famous for wooden doors and screens.\nQ3 (Advanced level): Why is Mirbat Fort famous?\nAnswer: It survived an attack in 1970 that threatened to destroy the town and its port.\n\nPeriod 2:\nQ1 (Support level): Complete: 'How about ______ them to Taqah?'\nAnswer: taking.\nQ2 (Expected level): Which response means you prefer a different plan: 'Good idea.' or 'I'd prefer to go to the wadi.'?\nAnswer: I'd prefer to go to the wadi.\nQ3 (Advanced level): Write two suggestions for visitors to Salalah using different phrases.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): What does a tourist information officer do?\nAnswer: Gives visitors information and suggestions about places to visit.\nQ2 (Expected level): Make a suggestion for a visitor who likes history.\nAnswer: e.g. Why don't you visit Khor Rori?\nQ3 (Advanced level): Write four lines of a dialogue between a visitor and an officer.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): True or false: 'Let's go diving instead' is a response.\nAnswer: True – it suggests an alternative.\nQ2 (Expected level): Complete: 'May I ______ that you visit the museum?'\nAnswer: suggest.\nQ3 (Advanced level): Write three suggestions for a day in Muscat.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Which site has blowholes that shoot fountains of water 30 metres high?\nAnswer: Mughsayl.\nQ2 (Expected level): What can visitors do at Sadah?\nAnswer: Camp, sail and dive on its beautiful beaches and visit the fort.\nQ3 (Advanced level): Which site would you recommend to a bird-lover and why?\nAnswer: Tawi Attair or Khor Rori – both are good for studying birdlife.\n\nPeriod 2:\nQ1 (Support level): Which phrase begins with 'If I…'?\nAnswer: If I were you, I'd…\nQ2 (Expected level): Respond to: 'Why don't you visit Khor Rori?'\nAnswer: e.g. Good idea. / I'd rather go to the beach.\nQ3 (Advanced level): Write a three-line dialogue with a suggestion and a response.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Complete: 'I'd ______ go on Thursday.'\nAnswer: rather.\nQ2 (Expected level): Name two places in Dhofar for a family and explain.\nAnswer: Open answer.\nQ3 (Advanced level): Write a one-day plan for visitors to Dhofar in three sentences.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): Which phrase agrees: 'Good idea.' or 'No way.'?\nAnswer: Good idea.\nQ2 (Expected level): Give a polite way to say you prefer another plan.\nAnswer: I'd prefer to… / I'd rather…\nQ3 (Advanced level): Write a short dialogue (4 lines) between a visitor and a tourist officer.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents choose their favourite site and write two sentences about it.\n\nPeriod 2:\nStudents prepare three suggestions for a friend visiting their town.\n\nPeriod 3:\nStudents refine the one-day plan.\n\nPeriod 4:\nStudents finish WB pp. 36–37."]]}, {"label": "Theme 3 - Unit 5: Designing a Tour", "periods": [{"focus": "Why do people travel? Reading a list of tours in Istanbul (CB p. 42, Activities 1–2)", "week": "Week 11: 15/11 - 19/11", "num": 66, "fields": [[1, "Learning Outcomes", "1. Discuss reasons for travelling and choose a tour\n2. Read a list of tours for specific information"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Understand"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Illustrative picture"], [5, "Concepts", "1. tour\n2. travel\n3. reasons\n4. sightseeing\n5. bazaar\n6. palace\n7. old Istanbul\n8. traditional music"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Which country would you most like to visit? Why?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: vote for favourite countries.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class chart.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss a why people travel, b which countries you would like to visit, c what you would like to see and do.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes with reasons.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Choose a tour. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the list of tours in and around Istanbul (e.g. Walking tour of Sultanahmet, Istanbul by night) and decide which one you would most like and why.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a chosen tour with a reason.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: tell a partner why.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one reason."], [8, "Formative Assessment", "Q1 (Support level): Name two reasons why people travel.\nAnswer: e.g. to relax, to learn about other cultures, to see famous places.\nQ2 (Expected level): Which tour includes dinner at a Turkish restaurant and a show of traditional music?\nAnswer: Istanbul by night.\nQ3 (Advanced level): Which tour would you choose and why?\nAnswer: Open answer with a reason."], [9, "Summative Assessment", "Q1 (Support level): What is Sultanahmet?\nAnswer: The old part of Istanbul.\nQ2 (Expected level): Which tour includes a visit to Topkapi Palace?\nAnswer: The walking tour of Sultanahmet.\nQ3 (Advanced level): Write three sentences about a tour you would like to take.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students list three places they would put in a tour of their own area."]]}, {"focus": "Analysing a description of a tour (CB p. 43, Activity 3)", "week": "Week 12: 22/11 - 26/11", "num": 67, "fields": [[1, "Learning Outcomes", "1. Complete a description of a tour using suitable words\n2. Identify the structure of a tour description"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Analyze"], [3, "Strategies", "1. Discovery learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. walking tour\n2. half day\n3. museum\n4. palace\n5. ornaments\n6. jewels\n7. bazaar\n8. take a walk"], [6, "Warm-up / Introduction / Prior Learning", "Shows the first sentence of the Sultanahmet description and asks how the text begins and ends."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the structure. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study the description: start time and place, route, places and what you can see/do, final stop.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a structure outline.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Fill the gaps. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete the eight gaps in the description of the Walking Tour of Sultanahmet using words from the box.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: eight words in context.\n\nActivity 3 (10 minutes):\n- Strategy: Discovery learning\n- Teacher: Language of tours. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: find phrases such as 'Our tour starts at…', 'From … it is a short walk to…', 'Here you will have the chance to…'.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a phrase bank.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: corrected answers."], [8, "Formative Assessment", "Q1 (Support level): At what time does the Sultanahmet tour start?\nAnswer: 9 a.m.\nQ2 (Expected level): Where does the tour start?\nAnswer: At Topkapi Palace.\nQ3 (Advanced level): Which phrases show the order of places?\nAnswer: 'From Topkapi, it is a short walk to…', 'From Aya Sofia, we will walk…', 'Our final stop will be…'."], [9, "Summative Assessment", "Q1 (Support level): Which mosque takes its name from the blue tiles on the inside of its walls?\nAnswer: The Blue Mosque.\nQ2 (Expected level): Where can you find carpets, jewellery, pictures and ceramics?\nAnswer: In the Arasta Bazaar.\nQ3 (Advanced level): Write two sentences about a tour using 'Our tour starts at…' and 'From … it is a short walk to…'.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students write the phrase bank in the notebook."]]}, {"focus": "Listening to a series of events and putting them in sequence (WB pp. 38–39)", "week": "Week 12: 22/11 - 26/11", "num": 68, "fields": [[1, "Learning Outcomes", "1. Listen to a series of events and put them in order\n2. Use sequence words to describe a trip"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Multimedia (audio-visual)\n4. Pens"], [5, "Concepts", "1. sequence\n2. first\n3. then\n4. after that\n5. next\n6. finally\n7. trip\n8. desert"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What did you do first this morning? Then?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling sequence. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models listening for sequence words and numbering events.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a sequence strategy.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and order. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the events and number them in order.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: an ordered list.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Retell. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: retell the events using first, then, after that, finally.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a retelling paragraph.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Own sequence. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: write four events of your last trip in order.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: four sentences."], [8, "Formative Assessment", "Q1 (Support level): Which word is used to start a sequence: first or finally?\nAnswer: first.\nQ2 (Expected level): Put in order: finally / first / then.\nAnswer: first, then, finally.\nQ3 (Advanced level): Write three sentences about your last holiday using sequence words.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): Give one sequence word.\nAnswer: e.g. then, next, after that.\nQ2 (Expected level): Rewrite in order: 'We had lunch. We left the hotel. We went to the market.'\nAnswer: We left the hotel. We went to the market. We had lunch (or any order given by the text).\nQ3 (Advanced level): Write a short paragraph (4 sentences) about a trip with sequence words.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 38–39."]]}, {"focus": "Designing a tour for visitors to Oman; Review & Reference (CB pp. 43, 48)", "week": "Week 12: 22/11 - 26/11", "
