riod 5:\n1. SMS language\n2. text message\n3. abbreviation\n4. informal\n5. formal"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nPlays three short descriptions (laptop, mobile phone, MP3 player) and asks what each speaker is talking about.\n\nPeriod 2:\nWrites 'noise pollution' and asks students to guess the meaning from the two words.\n\nPeriod 3:\nAsks: 'Do all people like mobile phones? Who might not?'\n\nPeriod 4:\nWrites 'Dr' and 'Mr' and asks what they stand for.\n\nPeriod 5:\nWrites an SMS such as 'C u 2moro' and asks what it means."], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Listening warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: listen to three speakers and say what each object is.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three objects named.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss: a What are the advantages and disadvantages of mobile phones? b At what age should children or teenagers own a phone?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a two-column list and an agreed age with reasons.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Speakers report. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each group's speaker reports its view and the class compares opinions.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class opinion summary.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs write one advantage and one disadvantage.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: two sentences.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Guess and match. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: match the nine words a–i with the nine meanings with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: nine word–meaning pairs.\n\nActivity 2 (14 minutes):\n- Strategy: Self-learning\n- Teacher: Check and copy. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: check meanings in a dictionary and copy the words with meanings into the exercise book.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a personal vocabulary list.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Use the words. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each pair writes sentences using three of the words and reads them aloud.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three sentences.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Mini self-test. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: cover the meanings and test oneself.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-score.\n\nPeriod 3:\nActivity 1 (7 minutes):\n- Strategy: Modeling\n- Teacher: Listening strategy model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models how to number callers and tick 'likes' and 'owns' after each caller while listening.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a three-column note-taking grid.\n\nActivity 2 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and note. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the phone-in twice; answer a How many callers? b How many like phones? c How many own one?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: grid with ticks and crosses.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Compare notes. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare grids and listen again to settle differences.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a group answer for a, b and c.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Independent check. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: report one caller's opinion in a sentence.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: one reported sentence.\n\nPeriod 4:\nActivity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: How abbreviations form. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study 'Dr' and the eight abbreviations and decide how they are formed (leaving out letters or taking first letters).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: two rules for forming abbreviations.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Write the full forms. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: copy a exam, b info, c IT, d dept, e SMS, f uni, g tv, h USA and write the full words.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: eight full forms.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Own abbreviations. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: think of other abbreviations (e.g. ASAP, Dr, PM) and test another group.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: five new abbreviations.\n\nActivity 4 (6 minutes):\n- Strategy: Discovery learning\n- Teacher: Reflect. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: state the two rules again with one example.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a rule statement.\n\nPeriod 5:\nActivity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Decode messages. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decode three short SMS messages and write them in full English.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three decoded messages.\n\nActivity 2 (20 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 6–7 individually and check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 3 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: SMS or not?. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decide in groups when SMS language is acceptable (friends) and when it is not (teacher, formal).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a short agreement.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: score own answers.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-score."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Name one advantage of a mobile phone.\nAnswer: Any, e.g. you can call someone in an emergency.\nQ2 (Expected level): Name one disadvantage of mobile phones.\nAnswer: Any, e.g. noise pollution, loss of privacy, cost.\nQ3 (Advanced level): At what age should teenagers own a phone? Give two reasons.\nAnswer: Open answer with two reasons.\n\nPeriod 2:\nQ1 (Support level): Match: privacy = ?\nAnswer: state of being alone.\nQ2 (Expected level): What is the meaning of 'can't stand'?\nAnswer: dislike strongly.\nQ3 (Advanced level): Write a sentence using 'emergency'.\nAnswer: Open answer, e.g. I keep my phone for an emergency.\n\nPeriod 3:\nQ1 (Support level): Does the first caller like mobile phones?\nAnswer: She says she cannot say she likes it, but it is useful.\nQ2 (Expected level): Does the caller who says 'I like my privacy and my peace and quiet' like mobile phones?\nAnswer: No – he/she has never owned one.\nQ3 (Advanced level): Why does the first caller carry her phone all the time?\nAnswer: So that the school and her husband's office can contact her at any time.\n\nPeriod 4:\nQ1 (Support level): What does 'exam' stand for?\nAnswer: examination.\nQ2 (Expected level): What does 'USA' stand for?\nAnswer: United States of America.\nQ3 (Advanced level): Make an abbreviation for 'Ministry of Education' and say how it was formed.\nAnswer: MOE – first letter of each word.\n\nPeriod 5:\nQ1 (Support level): What does 'c u' mean?\nAnswer: see you.\nQ2 (Expected level): Rewrite in full: 'info pls 2moro'.\nAnswer: Information please tomorrow.\nQ3 (Advanced level): Should you use SMS language in an e-mail to a teacher? Why/why not?\nAnswer: No – an e-mail to a teacher is formal; use full words."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Which object is described: 'I charge up the battery and plug in my earphones'?\nAnswer: An MP3 player.\nQ2 (Expected level): Why does the first speaker feel safe with the phone in the second description?\nAnswer: She can ring someone if she misses the bus or cannot find a taxi.\nQ3 (Advanced level): Write a sentence giving your opinion about children owning phones, using 'In my opinion…'.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): Match: marvellous = ?\nAnswer: wonderful.\nQ2 (Expected level): What is 'noise pollution'?\nAnswer: loud and unpleasant sound.\nQ3 (Advanced level): Use 'constant' and 'get rid of' in two sentences.\nAnswer: Open answer, e.g. The constant noise made me want to get rid of my old phone.\n\nPeriod 3:\nQ1 (Support level): Does the caller who has never had a phone like mobile phones?\nAnswer: No – he likes his privacy and his peace and quiet.\nQ2 (Expected level): Why does one caller say mobiles are noise pollution?\nAnswer: People are always shouting into them.\nQ3 (Advanced level): Do you agree with the caller who says phones are bad for your health? Give a reason.\nAnswer: Open answer with a reason.\n\nPeriod 4:\nQ1 (Support level): Write the full form of 'info'.\nAnswer: information.\nQ2 (Expected level): What is 'dept' short for? What is 'SMS'?\nAnswer: department; short message service (a text message).\nQ3 (Advanced level): Write two sentences using two abbreviations from the lesson.\nAnswer: Open answer, e.g. The IT dept sent an SMS.\n\nPeriod 5:\nQ1 (Support level): Give the full form of 'tv'.\nAnswer: television.\nQ2 (Expected level): Write 'See you later' as a short SMS.\nAnswer: cu l8r / C u later.\nQ3 (Advanced level): Write two SMS-style sentences and then the same two sentences in full.\nAnswer: Open answer, correct pairs."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents ask a family member about the age they think is right for a first phone and note the reason.\n\nPeriod 2:\nStudents learn the nine words for a short spelling check.\n\nPeriod 3:\nStudents write three sentences reporting what two callers said.\n\nPeriod 4:\nStudents collect five abbreviations from newspapers or signs.\n\nPeriod 5:\nStudents finish WB pp. 6–7 and learn the Theme 1 Glossary words (CB p. 16)."]]}, {"label": "Theme 1 - Unit 4: Communication Skills", "periods": [{"focus": "Reading about communication and finding a title (CB p. 8, Activity 1)", "week": "Week 3: 20/9 - 24/9", "num": 16, "fields": [[1, "Learning Outcomes", "1. Answer questions about a short text on communication\n2. Infer the meaning of 'pent-up' from context and suggest a title"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Participatory learning\n2. Modeling"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. communication\n2. two-sided relationship\n3. express feelings\n4. pent-up\n5. balanced"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Why is it important to talk about your feelings?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up talk. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: discuss why communication is important and who they find it hard to talk to.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class list of reasons.\n\nActivity 2 (12 minutes):\n- Strategy: Modeling\n- Teacher: Modelling inference. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models guessing 'pent-up' (line 10) from the sentences around it.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a context-clue strategy.\n\nActivity 3 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Answer a, b, c. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read the questions first, then the text; answer: a What two things does communication involve? b Why express feelings? c Meaning of pent-up?.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three answers.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Suggest a title. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs suggest titles and vote.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class-chosen title."], [8, "Formative Assessment", "Q1 (Support level): What two things does communication involve?\nAnswer: Talking and listening.\nQ2 (Expected level): Why is it important to express our feelings?\nAnswer: Negative feelings can get trapped inside and make you unhappy or angry.\nQ3 (Advanced level): What does 'pent-up' mean? Which words help you?\nAnswer: Held in or closed in; 'feelings can get trapped inside your head'."], [9, "Summative Assessment", "Q1 (Support level): What can happen if you don't express negative feelings?\nAnswer: They can make you unhappy or angry; you may not sleep or relax.\nQ2 (Expected level): Give a suitable title for the text.\nAnswer: e.g. The Importance of Communication / Why Communication Is Important.\nQ3 (Advanced level): What does the writer advise if you have pent-up feelings?\nAnswer: Talk to someone about them – sharing a problem makes you feel better."], [10, "Notes within the Weekly Study Plan", "Students list three people they talk to and what they talk about."]]}, {"focus": "Listening to two conversations (CB p. 8, Activity 2 and Soundbites)", "week": "Week 3: 20/9 - 24/9", "num": 17, "fields": [[1, "Learning Outcomes", "1. Listen to two interviews and decide which student communicates better\n2. Use everyday conversation phrases"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. interview\n2. communication skills\n3. keep the conversation going\n4. Soundbites\n5. Nice to see you!\n6. How about you?"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What is the difference between a short answer and an interesting answer?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Listening model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models taking notes on the first speaker's answers (yes/no answers, no questions back).\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a comparison note frame.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and decide. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the interviews of Ahmed and Laila; decide who communicates better and give reasons.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a group decision with reasons.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Soundbites. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: practise the everyday phrases (Hello, how are you? / Really? / How about you? / That's interesting.) in role plays.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three short exchanges.\n\nActivity 4 (8 minutes):\n- Strategy: Modeling\n- Teacher: Independent practice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: each student asks and answers one question using at least two phrases.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a short model dialogue."], [8, "Formative Assessment", "Q1 (Support level): Who communicates better, Ahmed or Laila?\nAnswer: Laila.\nQ2 (Expected level): Why is Laila a better communicator?\nAnswer: She gives extra information, adds comments and asks the teacher a question.\nQ3 (Advanced level): What could Ahmed say to improve a 'Yes' answer?\nAnswer: Open answer, e.g. adding a reason, a detail or a question back."], [9, "Summative Assessment", "Q1 (Support level): Complete the phrase: 'How ______ you?'\nAnswer: about.\nQ2 (Expected level): Name two things Laila told the teacher.\nAnswer: e.g. she has three brothers and two sisters; she likes swimming and the gym; she would like to learn French.\nQ3 (Advanced level): Write a three-line conversation using 'Really?' and 'How about you?'.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students prepare two interesting answers to 'What do you like doing at weekends?'"]]}, {"focus": "Making conversation: roles and tips (CB p. 9, Activity 3)", "week": "Week 3: 20/9 - 24/9", "num": 18, "fields": [[1, "Learning Outcomes", "1. Judge whether a conversation is successful using given tips\n2. Act out and extend a conversation with extra phrases"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Apply"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. show interest\n2. eye contact\n3. take turns\n4. ask follow-up questions\n5. conversation"], [6, "Warm-up / Introduction / Prior Learning", "Two volunteers have a very short 'yes/no' conversation; the class says what is missing."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Notice the problem. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read the conversation and say whether it is successful and why.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three reasons.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Improve and act out. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: use the five tips (show interest, eye contact, take turns, don't just say yes/no, ask related questions) to improve the conversation and act it out.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: an improved dialogue.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Role play. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: swap roles and create a new conversation using phrases of their own.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a second dialogue.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Feedback. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: other groups tick the tips they heard.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a tip checklist."], [8, "Formative Assessment", "Q1 (Support level): Name one tip for a good conversation.\nAnswer: e.g. make eye contact / take turns / show interest.\nQ2 (Expected level): Why should you not just answer 'yes' or 'no'?\nAnswer: It does not keep the conversation going; give more information.\nQ3 (Advanced level): Give a follow-up question for: 'I went to Salalah last week.'\nAnswer: Open answer, e.g. What did you do there?"], [9, "Summative Assessment", "Q1 (Support level): Which words show interest: 'mm' or 'whatever'?\nAnswer: 'mm' (and 'really?').\nQ2 (Expected level): How can you show you are listening?\nAnswer: Nod your head, say 'mm' or 'really?', make eye contact.\nQ3 (Advanced level): Write four lines of a successful conversation about a holiday.\nAnswer: Open answer using at least two tips."], [10, "Notes within the Weekly Study Plan", "Students practise a conversation with a family member using three tips."]]}, {"focus": "Consolidation and speaking assessment (WB pp. 8–9)", "week": "Week 4: 27/9 - 1/10", "num": 19, "fields": [[1, "Learning Outcomes", "1. Use conversation strategies in a short assessed dialogue\n2. Complete workbook tasks on conversation phrases"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "1. conversation strategy\n2. everyday phrases\n3. asking questions\n4. responding\n5. feedback"], [6, "Warm-up / Introduction / Prior Learning", "Reviews the five tips with a quick 'tip or not?' quiz."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Tip or not?. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decide quickly whether given behaviours are good or poor conversation habits.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a class answer for each.\n\nActivity 2 (18 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 8–9 individually and check with the answer key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Pair dialogues. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: perform a 1-minute dialogue using at least three tips while a partner ticks a checklist.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a performed dialogue and checklist.\n\nActivity 4 (4 minutes):\n- Strategy: Self-learning\n- Teacher: Self-evaluation. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write one thing done well and one to improve.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-evaluation line."], [8, "Formative Assessment", "Q1 (Support level): True or false: Taking turns is a good conversation tip.\nAnswer: True.\nQ2 (Expected level): Which is better: 'Yes.' or 'Yes, I love football. Do you play?' Why?\nAnswer: The second – it adds information and asks a question.\nQ3 (Advanced level): Improve this exchange: A: Do you like school? B: No.\nAnswer: Open answer, e.g. B: Not really, I find maths hard. Do you like it?"], [9, "Summative Assessment", "Q1 (Support level): Complete: See you ______ (tomorrow / next week).\nAnswer: later / any (everyday phrase).\nQ2 (Expected level): Which phrase shows sympathy: 'That's interesting.' or 'I'm sorry to hear that.'?\nAnswer: I'm sorry to hear that.\nQ3 (Advanced level): Write a short conversation (4 lines) between two classmates meeting after the holiday.\nAnswer: Open answer using everyday phrases."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 8–9."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Answer questions about a short text on communication\n2. Infer the meaning of 'pent-up' from context and suggest a title\n\nPeriod 2:\n1. Listen to two interviews and decide which student communicates better\n2. Use everyday conversation phrases\n\nPeriod 3:\n1. Judge whether a conversation is successful using given tips\n2. Act out and extend a conversation with extra phrases\n\nPeriod 4:\n1. Use conversation strategies in a short assessed dialogue\n2. Complete workbook tasks on conversation phrases"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Understand\nOutcome 2: Analyze\n\nPeriod 2:\nOutcome 1: Analyze\nOutcome 2: Apply\n\nPeriod 3:\nOutcome 1: Evaluate\nOutcome 2: Apply\n\nPeriod 4:\nOutcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "Period 1:\n1. Participatory learning\n2. Modeling\n\nPeriod 2:\n1. Modeling\n2. Cooperative learning\n\nPeriod 3:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 4:\n1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 2:\n1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens\n\nPeriod 3:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 4:\n1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "Period 1:\n1. communication\n2. two-sided relationship\n3. express feelings\n4. pent-up\n5. balanced\n\nPeriod 2:\n1. interview\n2. communication skills\n3. keep the conversation going\n4. Soundbites\n5. Nice to see you!\n6. How about you?\n\nPeriod 3:\n1. show interest\n2. eye contact\n3. take turns\n4. ask follow-up questions\n5. conversation\n\nPeriod 4:\n1. conversation strategy\n2. everyday phrases\n3. asking questions\n4. responding\n5. feedback"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'Why is it important to talk about your feelings?'\n\nPeriod 2:\nAsks: 'What is the difference between a short answer and an interesting answer?'\n\nPeriod 3:\nTwo volunteers have a very short 'yes/no' conversation; the class says what is missing.\n\nPeriod 4:\nReviews the five tips with a quick 'tip or not?' quiz."], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up talk. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: discuss why communication is important and who they find it hard to talk to.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class list of reasons.\n\nActivity 2 (12 minutes):\n- Strategy: Modeling\n- Teacher: Modelling inference. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models guessing 'pent-up' (line 10) from the sentences around it.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a context-clue strategy.\n\nActivity 3 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Answer a, b, c. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read the questions first, then the text; answer: a What two things does communication involve? b Why express feelings? c Meaning of pent-up?.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three answers.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Suggest a title. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs suggest titles and vote.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class-chosen title.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Listening model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models taking notes on the first speaker's answers (yes/no answers, no questions back).\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a comparison note frame.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and decide. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the interviews of Ahmed and Laila; decide who communicates better and give reasons.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a group decision with reasons.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Soundbites. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: practise the everyday phrases (Hello, how are you? / Really? / How about you? / That's interesting.) in role plays.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three short exchanges.\n\nActivity 4 (8 minutes):\n- Strategy: Modeling\n- Teacher: Independent practice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: each student asks and answers one question using at least two phrases.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a short model dialogue.\n\nPeriod 3:\nActivity 1 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Notice the problem. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read the conversation and say whether it is successful and why.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three reasons.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Improve and act out. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: use the five tips (show interest, eye contact, take turns, don't just say yes/no, ask related questions) to improve the conversation and act it out.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: an improved dialogue.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Role play. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: swap roles and create a new conversation using phrases of their own.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a second dialogue.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Feedback. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: other groups tick the tips they heard.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a tip checklist.\n\nPeriod 4:\nActivity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Tip or not?. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decide quickly whether given behaviours are good or poor conversation habits.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a class answer for each.\n\nActivity 2 (18 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 8–9 individually and check with the answer key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Pair dialogues. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: perform a 1-minute dialogue using at least three tips while a partner ticks a checklist.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a performed dialogue and checklist.\n\nActivity 4 (4 minutes):\n- Strategy: Self-learning\n- Teacher: Self-evaluation. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write one thing done well and one to improve.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-evaluation line."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): What two things does communication involve?\nAnswer: Talking and listening.\nQ2 (Expected level): Why is it important to express our feelings?\nAnswer: Negative feelings can get trapped inside and make you unhappy or angry.\nQ3 (Advanced level): What does 'pent-up' mean? Which words help you?\nAnswer: Held in or closed in; 'feelings can get trapped inside your head'.\n\nPeriod 2:\nQ1 (Support level): Who communicates better, Ahmed or Laila?\nAnswer: Laila.\nQ2 (Expected level): Why is Laila a better communicator?\nAnswer: She gives extra information, adds comments and asks the teacher a question.\nQ3 (Advanced level): What could Ahmed say to improve a 'Yes' answer?\nAnswer: Open answer, e.g. adding a reason, a detail or a question back.\n\nPeriod 3:\nQ1 (Support level): Name one tip for a good conversation.\nAnswer: e.g. make eye contact / take turns / show interest.\nQ2 (Expected level): Why should you not just answer 'yes' or 'no'?\nAnswer: It does not keep the conversation going; give more information.\nQ3 (Advanced level): Give a follow-up question for: 'I went to Salalah last week.'\nAnswer: Open answer, e.g. What did you do there?\n\nPeriod 4:\nQ1 (Support level): True or false: Taking turns is a good conversation tip.\nAnswer: True.\nQ2 (Expected level): Which is better: 'Yes.' or 'Yes, I love football. Do you play?' Why?\nAnswer: The second – it adds information and asks a question.\nQ3 (Advanced level): Improve this exchange: A: Do you like school? B: No.\nAnswer: Open answer, e.g. B: Not really, I find maths hard. Do you like it?"], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What can happen if you don't express negative feelings?\nAnswer: They can make you unhappy or angry; you may not sleep or relax.\nQ2 (Expected level): Give a suitable title for the text.\nAnswer: e.g. The Importance of Communication / Why Communication Is Important.\nQ3 (Advanced level): What does the writer advise if you have pent-up feelings?\nAnswer: Talk to someone about them – sharing a problem makes you feel better.\n\nPeriod 2:\nQ1 (Support level): Complete the phrase: 'How ______ you?'\nAnswer: about.\nQ2 (Expected level): Name two things Laila told the teacher.\nAnswer: e.g. she has three brothers and two sisters; she likes swimming and the gym; she would like to learn French.\nQ3 (Advanced level): Write a three-line conversation using 'Really?' and 'How about you?'.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Which words show interest: 'mm' or 'whatever'?\nAnswer: 'mm' (and 'really?').\nQ2 (Expected level): How can you show you are listening?\nAnswer: Nod your head, say 'mm' or 'really?', make eye contact.\nQ3 (Advanced level): Write four lines of a successful conversation about a holiday.\nAnswer: Open answer using at least two tips.\n\nPeriod 4:\nQ1 (Support level): Complete: See you ______ (tomorrow / next week).\nAnswer: later / any (everyday phrase).\nQ2 (Expected level): Which phrase shows sympathy: 'That's interesting.' or 'I'm sorry to hear that.'?\nAnswer: I'm sorry to hear that.\nQ3 (Advanced level): Write a short conversation (4 lines) between two classmates meeting after the holiday.\nAnswer: Open answer using everyday phrases."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents list three people they talk to and what they talk about.\n\nPeriod 2:\nStudents prepare two interesting answers to 'What do you like doing at weekends?'\n\nPeriod 3:\nStudents practise a conversation with a family member using three tips.\n\nPeriod 4:\nStudents finish WB pp. 8–9."]]}, {"label": "Theme 1 - Unit 5: E-Mail", "periods": [{"focus": "Talking about e-mail habits (CB p. 10, Activity 1)", "week": "Week 4: 27/9 - 1/10", "num": 20, "fields": [[1, "Learning Outcomes", "1. Discuss personal e-mail habits and etiquette\n2. Report group views to the class"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Understand"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. e-mail\n2. reply\n3. jokes\n4. monitor\n5. private\n6. writing style\n7. inbox"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Who sent an e-mail this week? Who did you send it to?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: raise hands for e-mail habits and compare.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class tally.\n\nActivity 2 (18 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss questions a–h (Do you send e-mails? Who do you e-mail? Which style? Reply at once or wait? Jokes? Pictures? Print? Monitoring?).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Spokesperson reports. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each spokesperson reports the most interesting point and the class asks questions.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class summary.\n\nActivity 4 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: one new idea about e-mail each.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: exit statements."], [8, "Formative Assessment", "Q1 (Support level): Name two people you might e-mail.\nAnswer: Open answer, e.g. a friend, a teacher.\nQ2 (Expected level): Which is better: reply to an e-mail at once or wait to think? Why?\nAnswer: Open answer with a reason.\nQ3 (Advanced level): Is it ever right to monitor private e-mails? Give one example.\nAnswer: Open answer with a reason."], [9, "Summative Assessment", "Q1 (Support level): What is a 'reply'?\nAnswer: A message you send back to someone.\nQ2 (Expected level): Give one advantage and one disadvantage of sending jokes by e-mail.\nAnswer: Open answer.\nQ3 (Advanced level): Write two sentences about the writing style you use in e-mails.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students bring one real or imagined e-mail to the next lesson."]]}, {"focus": "True/False statements and the ten rules for writing e-mails (CB p. 10, Activities 2–3)", "week": "Week 4: 27/9 - 1/10", "num": 21, "fields": [[1, "Learning Outcomes", "1. Decide whether e-mail statements are true or false using the ten rules\n2. Explain why an e-mail rule matters"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Evaluate"], [3, "Strategies", "1. Discovery learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. rule\n2. subject line\n3. capitals\n4. smileys\n5. politely\n6. confidential\n7. priority"], [6, "Warm-up / Introduction / Prior Learning", "Writes an e-mail written in CAPITAL LETTERS and asks how it feels to read."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (7 minutes):\n- Strategy: Discovery learning\n- Teacher: Decide first. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: decide T/F for statements a–h from experience before seeing the rules.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a first set of answers.\n\nActivity 2 (15 minutes):\n- Strategy: Discovery learning\n- Teacher: Check against the rules. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: read the Ten Rules for Writing E-Mails and compare answers; decide which rule supports each statement.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: answers with the rule number.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Explain a rule. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: each group explains why one rule matters and gives an example.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a rule poster entry.\n\nActivity 4 (6 minutes):\n- Strategy: Discovery learning\n- Teacher: Conclude. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: state the rules about politeness, accuracy and privacy.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a three-point summary."], [8, "Formative Assessment", "Q1 (Support level): True or false: You should include a subject line.\nAnswer: True (Rule 8).\nQ2 (Expected level): Why should you not write in CAPITALS?\nAnswer: The reader will think you are shouting (Rule 6).\nQ3 (Advanced level): Which rule would you give a friend who sends a confidential password by e-mail? Why?\nAnswer: Rule 9 – e-mails are not private, so don't send confidential information."], [9, "Summative Assessment", "Q1 (Support level): True or false: Always use smileys in e-mails.\nAnswer: False – use smileys only in the most informal e-mails.\nQ2 (Expected level): Which rule says to keep e-mails short?\nAnswer: Rule 2 – short sentences in one or two paragraphs.\nQ3 (Advanced level): Do you agree with Rule 10? Why?\nAnswer: Open answer, e.g. Yes – if a message is really urgent, use the telephone."], [10, "Notes within the Weekly Study Plan", "Students learn the key words of the rules and underline them in the text."]]}, {"focus": "Analysing four e-mails: which rules are broken? (CB p. 11, Activity 4)", "week": "Week 4: 27/9 - 1/10", "num": 22, "fields": [[1, "Learning Outcomes", "1. Find the e-mail rules broken in four sample e-mails\n2. Rewrite part of an e-mail correctly"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Problem-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. rule broken\n2. informal e-mail\n3. formal e-mail\n4. spelling\n5. punctuation\n6. capital letters\n7. private information"], [6, "Warm-up / Introduction / Prior Learning", "Shows the line 'hi everyone, i have now got my internet connection.' and asks what is wrong."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: The problem. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: presents four e-mails (a–d) with mistakes and asks: Which rules are broken in each?.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a list of errors per e-mail.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Rule detectives. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: groups analyse e-mails a–d and write the numbers of the broken rules (e.g. no subject line, capitals, confidential information, rude comments).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a table: e-mail → broken rules.\n\nActivity 3 (12 minutes):\n- Strategy: Problem-based learning\n- Teacher: Fix one e-mail. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: choose one e-mail and rewrite its opening and closing correctly.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a corrected e-mail extract.\n\nActivity 4 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: Compare. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: compare corrections with another group.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a final corrected extract."], [8, "Formative Assessment", "Q1 (Support level): In e-mail c, which rule is broken by writing 'PLEASE send me the MONEY'?\nAnswer: Rule 6 – don't write in capitals.\nQ2 (Expected level): Which rule is broken when Khadija writes her password in the e-mail?\nAnswer: Rule 9 – don't send confidential information.\nQ3 (Advanced level): Why is e-mail d a problem?\nAnswer: It writes unkind things about another teacher and shares them; Rule 1 – think carefully about what you write."], [9, "Summative Assessment", "Q1 (Support level): What is missing from many of the e-mails?\nAnswer: A subject line / correct greetings and punctuation.\nQ2 (Expected level): Correct: 'hi everyone, i have now got my internet connection.'\nAnswer: Hi everyone, I have now got my Internet connection.\nQ3 (Advanced level): Rewrite the first line of e-mail c in a polite way.\nAnswer: e.g. Dear Mr Salim, Your new car has arrived in Oman. Could you please send the payment?"], [10, "Notes within the Weekly Study Plan", "Students check their own old e-mails against the ten rules."]]}, {"focus": "Planning an informal e-mail: layout and language (WB p. 10; Writing Guide)", "week": "Week 4: 27/9 - 1/10", "num": 23, "fields": [[1, "Learning Outcomes", "1. Label the parts of an e-mail and choose suitable informal phrases\n2. Plan an informal e-mail using the Writing Guide"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook p. 10 and Writing Guide)\n3. Pens"], [5, "Concepts", "1. subject\n2. greeting\n3. opening\n4. body\n5. closing\n6. sign-off\n7. informal language"], [6, "Warm-up / Introduction / Prior Learning", "Shows an e-mail with blank labels and asks what each part is called."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling a plan. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models labelling the parts of an e-mail and planning an informal e-mail to a friend, thinking aloud about greeting, news, questions and closing.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a model plan.\n\nActivity 2 (14 minutes):\n- Strategy: Self-learning\n- Teacher: Label and sort phrases. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB p. 10 Activity 1 and sort phrases such as 'Take care, speak soon' / 'How are you?' / 'I can't wait to see you again' by place.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a labelled e-mail and sorted phrases.\n\nActivity 3 (12 minutes):\n- Strategy: Self-learning\n- Teacher: Own plan. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: plan an e-mail about a recent event using the Writing Guide.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a personal plan.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Peer check. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: swap plans and tick the layout checklist.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a checked plan."], [8, "Formative Assessment", "Q1 (Support level): Which part of an e-mail comes first after the subject: the greeting or the closing?\nAnswer: The greeting.\nQ2 (Expected level): Is 'Take care, speak soon' used at the beginning or the end?\nAnswer: At the end.\nQ3 (Advanced level): Write an informal opening line and closing line for an e-mail to a cousin.\nAnswer: Open answer, e.g. Hi Salim, how are you? … Look after yourself, Ali."], [9, "Summative Assessment", "Q1 (Support level): Name two parts of an e-mail.\nAnswer: e.g. subject line, greeting, body, closing.\nQ2 (Expected level): Choose the informal greeting: Dear Sir or Hi there!\nAnswer: Hi there!\nQ3 (Advanced level): Plan an e-mail to a friend in three bullet points.\nAnswer: Open answer with news, a question and a closing."], [10, "Notes within the Weekly Study Plan", "Students finish planning and collect the e-mail rules for the writing lesson."]]}, {"focus": "Writing an informal e-mail and Review & Reference (CB pp. 11, 16; WB p. 11)", "week": "Week 4: 27/9 - 1/10", "num": 24, "fields": [[1, "Learning Outcomes", "1. Write an informal e-mail that follows the ten rules\n2. Review the Theme 1 learning and glossary words"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Create\nOutcome 2: Remember"], [3, "Strategies", "1. Project-based learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook p. 11)\n3. Pens"], [5, "Concepts", "1. draft\n2. proofread\n3. edit\n4. glossary\n5. self-assessment\n6. Theme 1"], [6, "Warm-up / Introduction / Prior Learning", "Reminds students of the ten rules in a one-minute speed round."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Rules recap. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: recall as many rules as possible.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a class list.\n\nActivity 2 (22 minutes):\n- Strategy: Project-based learning\n- Teacher: Write the e-mail. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: draft an informal e-mail in class, proofread against the checklist, then plan the final version at home (portfolio).\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a first-draft e-mail.\n\nActivity 3 (8 minutes):\n- Strategy: Project-based learning\n- Teacher: Peer review. Introduces a m an the final version at home (portfolio).\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a first-draft e-mail.\n\nActivity 3 (8 minutes):\n- Strategy: Project-based learning\n- Teacher: Peer review. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: exchange drafts and give two positive points and one suggestion.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a peer feedback note.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Review page. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: read the CB p. 16 'In this theme you have learned…' and glossary; plan spelling practice for the core words.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-assessment line."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Name two people you might e-mail.\nAnswer: Open answer, e.g. a friend, a teacher.\nQ2 (Expected level): Which is better: reply to an e-mail at once or wait to think? Why?\nAnswer: Open answer with a reason.\nQ3 (Advanced level): Is it ever right to monitor private e-mails? Give one example.\nAnswer: Open answer with a reason.\n\nPeriod 2:\nQ1 (Support level): True or false: You should include a subject line.\nAnswer: True (Rule 8).\nQ2 (Expected level): Why should you not write in CAPITALS?\nAnswer: The reader will think you are shouting (Rule 6).\nQ3 (Advanced level): Which rule would you give a friend who sends a confidential password by e-mail? Why?\nAnswer: Rule 9 – e-mails are not private, so don't send confidential information.\n\nPeriod 3:\nQ1 (Support level): In e-mail c, which rule is broken by writing 'PLEASE send me the MONEY'?\nAnswer: Rule 6 – don't write in capitals.\nQ2 (Expected level): Which rule is broken when Khadija writes her password in the e-mail?\nAnswer: Rule 9 – don't send confidential information.\nQ3 (Advanced level): Why is e-mail d a problem?\nAnswer: It writes unkind things about another teacher and shares them; Rule 1 – think carefully about what you write.\n\nPeriod 4:\nQ1 (Support level): Which part of an e-mail comes first after the subject: the greeting or the closing?\nAnswer: The greeting.\nQ2 (Expected level): Is 'Take care, speak soon' used at the beginning or the end?\nAnswer: At the end.\nQ3 (Advanced level): Write an informal opening line and closing line for an e-mail to a cousin.\nAnswer: Open answer, e.g. Hi Salim, how are you? … Look after yourself, Ali.\n\nPeriod 5:\nQ1 (Support level): Which word do you write first in an informal e-mail to a friend?\nAnswer: A greeting such as Hi or Dear + name.\nQ2 (Expected level): Correct: 'see you at scool tomorrow'.\nAnswer: See you at school tomorrow.\nQ3 (Advanced level): Write the closing of an informal e-mail to a friend.\nAnswer: e.g. Look after yourself. See you soon, Khadija."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What is a 'reply'?\nAnswer: A message you send back to someone.\nQ2 (Expected level): Give one advantage and one disadvantage of sending jokes by e-mail.\nAnswer: Open answer.\nQ3 (Advanced level): Write two sentences about the writing style you use in e-mails.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): True or false: Always use smileys in e-mails.\nAnswer: False – use smileys only in the most informal e-mails.\nQ2 (Expected level): Which rule says to keep e-mails short?\nAnswer: Rule 2 – short sentences in one or two paragraphs.\nQ3 (Advanced level): Do you agree with Rule 10? Why?\nAnswer: Open answer, e.g. Yes – if a message is really urgent, use the telephone.\n\nPeriod 3:\nQ1 (Support level): What is missing from many of the e-mails?\nAnswer: A subject line / correct greetings and punctuation.\nQ2 (Expected level): Correct: 'hi everyone, i have now got my internet connection.'\nAnswer: Hi everyone, I have now got my Internet connection.\nQ3 (Advanced level): Rewrite the first line of e-mail c in a polite way.\nAnswer: e.g. Dear Mr Salim, Your new car has arrived in Oman. Could you please send the payment?\n\nPeriod 4:\nQ1 (Support level): Name two parts of an e-mail.\nAnswer: e.g. subject line, greeting, body, closing.\nQ2 (Expected level): Choose the informal greeting: Dear Sir or Hi there!\nAnswer: Hi there!\nQ3 (Advanced level): Plan an e-mail to a friend in three bullet points.\nAnswer: Open answer with news, a question and a closing.\n\nPeriod 5:\nQ1 (Support level): Match: confident = ?\nAnswer: Being sure you have the ability to do something well.\nQ2 (Expected level): Choose the correct meaning of 'liar'.\nAnswer: Someone who says things that are not true.\nQ3 (Advanced level): Write four sentences of an informal e-mail to a friend about your weekend, following three rules.\nAnswer: Open answer: greeting, news, question, closing; correct spelling and no capitals."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents bring one real or imagined e-mail to the next lesson.\n\nPeriod 2:\nStudents learn the key words of the rules and underline them in the text.\n\nPeriod 3:\nStudents check their own old e-mails against the ten rules.\n\nPeriod 4:\nStudents finish planning and collect the e-mail rules for the writing lesson.\n\nPeriod 5:\nFinal draft is attached to the first draft in the portfolio. The core words of Theme 1 (CB p. 16) are given as a spelling test next week."]]}, {"label": "Theme 2 - Unit 1: Goodbye to Childhood", "periods": [{"focus": "Introducing Theme 2: What is adolescence? (CB p. 17)", "week": "Week 5: 4/10 - 8/10", "num": 25, "fields": [[1, "Learning Outcomes", "1. Choose the correct meaning of 'adolescence'\n2. Explain the words and phrases in bold in the introduction"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Understand"], [3, "Strategies", "1. Participatory learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Illustrative picture\n3. Traditional board\n4. Pens\n5. Other (dictionary)"], [5, "Concepts", "1. adolescence\n2. angst\n3. acne\n4. mood swings\n5. peer pressure\n6. suspicious\n7. critical\n8. circle of friends"], [6, "Warm-up / Introduction / Prior Learning", "Shows the cartoon on p. 17 and asks: 'What's the matter with him? Is he ill?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Cartoon talk. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: predict why the boy is behaving strangely.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three predictions.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: What does adolescence mean?. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: choose a, b, c or d for 'adolescence' and justify.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: the correct meaning (c) with reason.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Words in bold. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the introduction and use a dictionary to check angst, acne, mood swings, peer pressure, suspicious, critical.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a glossary with meanings.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs use one new word in a sentence.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one sentence each."], [8, "Formative Assessment", "Q1 (Support level): Choose the meaning of 'adolescence': the period between childhood and adulthood or the training period for a new job?\nAnswer: The period between childhood and adulthood.\nQ2 (Expected level): What do parents complain about, according to the introduction?\nAnswer: Teenage mood swings.\nQ3 (Advanced level): How can peer pressure be a problem for teenagers?\nAnswer: It can lead teenagers into bad habits."], [9, "Summative Assessment", "Q1 (Support level): Which word means 'ugly red spots on the face'?\nAnswer: acne.\nQ2 (Expected level): What do teens complain about?\nAnswer: That parents are suspicious and critical.\nQ3 (Advanced level): What question does the introduction ask about young Omanis?\nAnswer: Whether they are in danger of forgetting their own culture because of Western media and the Internet."], [10, "Notes within the Weekly Study Plan", "Students read CB p. 18 'Adolescence' once and note three words they do not know."]]}, {"focus": "Questions teenagers ask and skimming for topics (CB p. 18, Activities 1–2)", "week": "Week 5: 4/10 - 8/10", "num": 26, "fields": [[1, "Learning Outcomes", "1. Discuss questions teenagers ask themselves\n2. Skim a text and match paragraph numbers to topics"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Cooperative learning\n2. Modeling"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. skim\n2. paragraph\n3. topic\n4. values\n5. transition\n6. dependent\n7. independent"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'Who am I?' on the board and asks if anyone has asked this question."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss which of the four questions (Who am I? What am I going to do with my life? What are my values? What am I good at?) they have asked and add others.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of extra questions.\n\nActivity 2 (12 minutes):\n- Strategy: Modeling\n- Teacher: Skimming model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models skimming 'Adolescence' and noting each paragraph's main idea in two words.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a paragraph-topic note.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Match topics. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: write the paragraph number for: a relationship with family, b the nature of adolescence, c physical changes, d mental changes.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: four matched answers.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Independent check. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: check answers against first lines.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: corrected answers."], [8, "Formative Assessment", "Q1 (Support level): Which paragraph deals with physical changes?\nAnswer: Paragraph 2.\nQ2 (Expected level): Which paragraph deals with relationships with family?\nAnswer: Paragraph 4.\nQ3 (Advanced level): How does paragraph 3 differ from paragraph 2?\nAnswer: Paragraph 2 is about physical changes (growth spurt, puberty); paragraph 3 is about mental changes (how teenagers see themselves)."], [9, "Summative Assessment", "Q1 (Support level): Which paragraph describes the nature of adolescence?\nAnswer: Paragraph 1.\nQ2 (Expected level): What is the main idea of paragraph 3?\nAnswer: Hormonal changes cause mental changes – teenagers become self-conscious and easily embarrassed.\nQ3 (Advanced level): Write a one-sentence topic sentence for paragraph 4.\nAnswer: e.g. Teenagers want independence but still need the security of their families."], [10, "Notes within the Weekly Study Plan", "Students list the topic sentences of paragraphs 1–4."]]}, {"focus": "Main ideas and answering questions about the text (CB p. 19, Activity 4)", "week": "Week 5: 4/10 - 8/10", "num": 27, "fields": [[1, "Learning Outcomes", "1. Identify the main ideas of a reading text\n2. Answer detailed questions about adolescence"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Understand"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (Workbook)"], [5, "Concepts", "1. main idea\n2. topic sentence\n3. growth spurt\n4. puberty\n5. acne\n6. conflict"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What changes have you noticed in your body or your thinking in the last two years?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Finding main ideas. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models underlining the topic sentence of paragraph 1 and discarding details; gives the Top Tip: skim, don't read every word.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a topic sentence strategy.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Questions a–d. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: answer: a How is adolescence described? b How is the growth spurt different for girls and boys? c What is acne? d How can friends cause family conflict?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: four full-sentence answers.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: WB plan. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: complete WB p. 16 reading tasks independently using the strategy.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a completed plan.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected answers."], [8, "Formative Assessment", "Q1 (Support level): What is acne?\nAnswer: Ugly red spots that appear on the face or neck in the teenage years.\nQ2 (Expected level): How is the growth spurt different for girls and boys?\nAnswer: Girls begin earlier (as young as 10); boys' growth spurt occurs between 12 and 17.\nQ3 (Advanced level): How can a teenager's friends cause family conflict?\nAnswer: If he regards his friends as more important than his family."], [9, "Summative Assessment", "Q1 (Support level): How old are adolescents, approximately?\nAnswer: From about thirteen to nineteen.\nQ2 (Expected level): Why do teenagers become self-conscious?\nAnswer: They think everyone is looking at them and judging them.\nQ3 (Advanced level): Do you agree that adolescence can be both exciting and stressful? Explain.\nAnswer: Open answer with a reason from the text."], [10, "Notes within the Weekly Study Plan", "Students complete WB p. 16 Activity 1 at home."]]}, {"focus": "Words with similar meanings (CB p. 19, Activity 3)", "week": "Week 5: 4/10 - 8/10", "num": 28, "fields": [[1, "Learning Outcomes", "1. Find words in the text with the same meaning as given words or phrases\n2. Use synonyms to rewrite sentences"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)"], [5, "Concepts", "1. transition\n2. physical\n3. mental\n4. growth spurt\n5. acne\n6. security\n7. conflict\n8. synonym"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'disagreement' and asks for a similar word."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the method. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study the example 'period between 13 and 19 = adolescence' and find how to locate a synonym (paragraph clue + same part of speech).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a search method.\n\nActivity 2 (16 minutes):\n- Strategy: Participatory learning\n- Teacher: Find the words. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: find words for: a change, b worrying (para 1), c related to the body, d sudden increase, e related to the mind, f small round marks on the skin, g feeling of safety, h disagreement.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: eight word pairs.\n\nActivity 3 (10 minutes):\n- Strategy: Discovery learning\n- Teacher: Apply. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: use two of the words in new sentences.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: two sentences.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Check. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare with another pair.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a corrected list."], [8, "Formative Assessment", "Q1 (Support level): Which word in paragraph 2 means 'related to the body'?\nAnswer: physical.\nQ2 (Expected level): Which word in paragraph 3 means 'related to the mind'?\nAnswer: mental.\nQ3 (Advanced level): Find a word in paragraph 4 that means 'disagreement' and use it in a sentence.\nAnswer: conflict – e.g. A conflict started between the brothers."], [9, "Summative Assessment", "Q1 (Support level): Which word means 'a feeling of safety'?\nAnswer: security.\nQ2 (Expected level): What is the word for 'a sudden increase' in weight and height?\nAnswer: growth spurt.\nQ3 (Advanced level): Replace 'change' with a word from the text in: 'Adolescence is a time of change.'\nAnswer: Adolescence is a time of transition."], [10, "Notes within the Weekly Study Plan", "Students add the synonyms to their vocabulary notebooks."]]}, {"focus": "Time to Talk: teenage stereotypes (CB p. 19; WB p. 17)", "week": "Week 5: 4/10 - 8/10", "num": 29, "fields": [[1, "Learning Outcomes", "1. Evaluate to what extent a stereotype is true of Omani teenagers\n2. Write a paragraph of opinion with reasons"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Create"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (Workbook)"], [5, "Concepts", "1. stereotype\n2. selfish\n3. lazy\n4. mood swings\n5. untidy\n6. communicate"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Are all teenagers lazy? What do people say about teenagers?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: list what people say about teenagers.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Time to Talk. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss to what extent the six stereotype statements are true of Omani teenagers and add others.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes with reasons.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Paragraph first draft. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: write a first draft: 'The stereotype is partly true because…'.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a first-draft paragraph.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Feedback. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: swap drafts and give feedback.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a peer comment."], [8, "Formative Assessment", "Q1 (Support level): Name one idea from the teenage stereotype.\nAnswer: e.g. selfish and lazy / has mood swings / very untidy.\nQ2 (Expected level): Say whether you agree with 'Teenagers spend too much time in bed' and why.\nAnswer: Open answer with a reason.\nQ3 (Advanced level): Why is a stereotype not always true?\nAnswer: It describes a group as if everyone were the same; individuals differ."], [9, "Summative Assessment", "Q1 (Support level): What is a stereotype?\nAnswer: A fixed idea about what a group of people is like.\nQ2 (Expected level): Give one example of a stereotype about students.\nAnswer: Open answer.\nQ3 (Advanced level): Write four sentences giving your opinion on the stereotype.\nAnswer: Open answer; opinion, reason, example, conclusion."], [10, "Notes within the Weekly Study Plan", "Students write the final draft and attach it to the first draft in the portfolio. WB p. 17."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Choose the correct meaning of 'adolescence'\n2. Explain the words and phrases in bold in the introduction\n\nPeriod 2:\n1. Discuss questions teenagers ask themselves\n2. Skim a text and match paragraph numbers to topics\n\nPeriod 3:\n1. Identify the main ideas of a reading text\n2. Answer detailed questions about adolescence\n\nPeriod 4:\n1. Find words in the text with the same meaning as given words or phrases\n2. Use synonyms to rewrite sentences\n\nPeriod 5:\n1. Evaluate to what extent a stereotype is true of Omani teenagers\n2. Write a paragraph of opinion with reasons"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Understand\nOutcome 2: Understand\n\nPeriod 2:\nOutcome 1: Understand\nOutcome 2: Analyze\n\nPeriod 3:\nOutcome 1: Analyze\nOutcome 2: Understand\n\nPeriod 4:\n
