k: retell the events using first, then, after that, finally.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a retelling paragraph.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Own sequence. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: write four events of your last trip in order.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: four sentences.\n\nPeriod 4:\nActivity 1 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Plan. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: choose a place and list the route, times and activities.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a plan.\n\nActivity 2 (22 minutes):\n- Strategy: Project-based learning\n- Teacher: Design the tour. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: write a description of a tour for visitors to Oman (or a trip to the Wahiba Sands) using the Writing Guide and the phrase bank.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a first-draft tour description.\n\nActivity 3 (6 minutes):\n- Strategy: Project-based learning\n- Teacher: Peer review. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: exchange drafts and give feedback.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a feedback note.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Review page. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: read CB p. 48 'In this theme you have learned…' and choose core words.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-assessment line."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Name two reasons why people travel.\nAnswer: e.g. to relax, to learn about other cultures, to see famous places.\nQ2 (Expected level): Which tour includes dinner at a Turkish restaurant and a show of traditional music?\nAnswer: Istanbul by night.\nQ3 (Advanced level): Which tour would you choose and why?\nAnswer: Open answer with a reason.\n\nPeriod 2:\nQ1 (Support level): At what time does the Sultanahmet tour start?\nAnswer: 9 a.m.\nQ2 (Expected level): Where does the tour start?\nAnswer: At Topkapi Palace.\nQ3 (Advanced level): Which phrases show the order of places?\nAnswer: 'From Topkapi, it is a short walk to…', 'From Aya Sofia, we will walk…', 'Our final stop will be…'.\n\nPeriod 3:\nQ1 (Support level): Which word is used to start a sequence: first or finally?\nAnswer: first.\nQ2 (Expected level): Put in order: finally / first / then.\nAnswer: first, then, finally.\nQ3 (Advanced level): Write three sentences about your last holiday using sequence words.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): Which phrase begins a tour description: 'Our tour starts at…' or 'My name is…'?\nAnswer: Our tour starts at…\nQ2 (Expected level): Correct: 'we will visit the fort then we go to the souq'.\nAnswer: We will visit the fort, then we will go to the souq.\nQ3 (Advanced level): Write the first two sentences of a tour to Nizwa.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What is Sultanahmet?\nAnswer: The old part of Istanbul.\nQ2 (Expected level): Which tour includes a visit to Topkapi Palace?\nAnswer: The walking tour of Sultanahmet.\nQ3 (Advanced level): Write three sentences about a tour you would like to take.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): Which mosque takes its name from the blue tiles on the inside of its walls?\nAnswer: The Blue Mosque.\nQ2 (Expected level): Where can you find carpets, jewellery, pictures and ceramics?\nAnswer: In the Arasta Bazaar.\nQ3 (Advanced level): Write two sentences about a tour using 'Our tour starts at…' and 'From … it is a short walk to…'.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Give one sequence word.\nAnswer: e.g. then, next, after that.\nQ2 (Expected level): Rewrite in order: 'We had lunch. We left the hotel. We went to the market.'\nAnswer: We left the hotel. We went to the market. We had lunch (or any order given by the text).\nQ3 (Advanced level): Write a short paragraph (4 sentences) about a trip with sequence words.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): Match: itinerary = ?\nAnswer: A plan or list of places you will visit on a journey.\nQ2 (Expected level): What is a 'sanctuary'?\nAnswer: A protected area for animals or birds.\nQ3 (Advanced level): Write four sentences describing a one-day tour of your area.\nAnswer: Open answer using sequence words."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents list three places they would put in a tour of their own area.\n\nPeriod 2:\nStudents write the phrase bank in the notebook.\n\nPeriod 3:\nStudents finish WB pp. 38–39.\n\nPeriod 4:\nFinal draft is attached to the first draft in the portfolio. Core words (CB p. 48) are tested at the end of Theme 3. WB pp. 42–43 are completed."]]}, {"label": "Theme 4 - Unit 1: Smart Homes", "periods": [{"focus": "Introducing Theme 4 and listening: technology we would miss (CB pp. 49–50, Activities 1–2)", "week": "Week 13: 29/11 - 3/12", "num": 70, "fields": [[1, "Learning Outcomes", "1. Listen for the technology each speaker would miss and the reasons\n2. Discuss what a smart home can do"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Understand"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. innovation\n2. invention\n3. technology\n4. smart home\n5. appliance\n6. miss\n7. reason"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Which technology could you not live without for a week?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: vote for the technology they would miss most.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class vote.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen for two types. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to four people (two technologies each); note ONE they would miss and listen again for the reasons.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a table: speaker – technology – reason.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: What is a smart home?. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the short text on p. 50 and discuss a, b, c (what can it do; what equipment would you like; would you like to live in one?).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group answers.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share the most interesting idea.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one sentence."], [8, "Formative Assessment", "Q1 (Support level): What is a smart home?\nAnswer: A home whose appliances have computers inside and are connected and controlled by a computer.\nQ2 (Expected level): Name one piece of smart equipment you would like to have and why.\nAnswer: Open answer with a reason.\nQ3 (Advanced level): Would you like to live in a smart home? Give two reasons.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): What do many new appliances like washing machines now have inside?\nAnswer: Computers.\nQ2 (Expected level): Which technology would you miss most? Give a reason.\nAnswer: Open answer.\nQ3 (Advanced level): Write two sentences about how technology has changed your home in ten years.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students read the text 'Smart Homes' (CB p. 50) at home and underline new words."]]}, {"focus": "Reading 'Smart Homes' and answering questions (CB pp. 50–51, Activities 3–4)", "week": "Week 13: 29/11 - 3/12", "num": 71, "fields": [[1, "Learning Outcomes", "1. Read a text to find the answer to a focus question\n2. Answer five detailed questions about smart homes"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Understand"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. smart home\n2. appliances\n3. electrical wires\n4. convenient\n5. energy prices\n6. save money\n7. special features"], [6, "Warm-up / Introduction / Prior Learning", "Writes the focus question 'What can a smart home do?' on the board."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Focus-question model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models reading with a focus question: reads the question, scans for key words and underlines the answer.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a focus-question strategy.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Questions 1–5. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: answer: 1 What special equipment? 2 How are appliances connected? 3 Which appliances talk to shops? 4 Can you turn things on and off when away? 5 Another big advantage?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: five answers with evidence.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Independent reading. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: read the 'Special Features' paragraph and write one question and answer.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a question and answer.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected answers."], [8, "Formative Assessment", "Q1 (Support level): How are the appliances connected in a smart home?\nAnswer: Through the home's electrical wires.\nQ2 (Expected level): Which appliances can talk to shops over the Internet?\nAnswer: Electronic cupboards and fridges.\nQ3 (Advanced level): How can a smart home save money?\nAnswer: By turning off lights and air conditioners when they are not needed and showing how much money is saved."], [9, "Summative Assessment", "Q1 (Support level): Can you turn things on and off when you are away?\nAnswer: Yes – with a mobile phone or by sending a message over the Internet.\nQ2 (Expected level): What happens when you walk into a room in a smart home?\nAnswer: The lights come on, the temperature adjusts, your favourite song plays and your pictures appear on screens.\nQ3 (Advanced level): Which feature of a smart home is the most useful? Explain.\nAnswer: Open answer with a reason."], [10, "Notes within the Weekly Study Plan", "Students prepare their ideas for 'What other features will smart homes have?'"]]}, {"focus": "Extensive reading, Time to Talk and WB pp. 44–45", "week": "Week 13: 29/11 - 3/12", "num": 72, "fields": [[1, "Learning Outcomes", "1. Discuss differences between homes today and ten years ago and predict smart features\n2. Write a paragraph about a smart home of the future"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Create"], [3, "Strategies", "1. Cooperative learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. extensive reading\n2. feature\n3. disadvantage\n4. problem\n5. future\n6. paragraph"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'How is your home different from ten years ago?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Warm-up. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: share how homes changed in ten years.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a class list.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Time to Talk. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss the four questions (home then and now; smart features at home or school; features you want; disadvantages and problems).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes.\n\nActivity 3 (14 minutes):\n- Strategy: Self-learning\n- Teacher: Paragraph and WB. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write a paragraph about the smart home you want, then complete WB pp. 44–45.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a first draft and completed tasks.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Top Tip. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: read the Top Tip on extensive reading and plan a 15-minute daily reading.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a reading plan."], [8, "Formative Assessment", "Q1 (Support level): Name one disadvantage of a smart home.\nAnswer: e.g. it can be expensive / it may break down / it can be hacked.\nQ2 (Expected level): Why does the Top Tip say reading is like learning a sport?\nAnswer: The way to improve is through regular practice – reading a lot every day.\nQ3 (Advanced level): Which smart feature would you like in a school? Explain.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): How long should you read each day, according to the Top Tip?\nAnswer: Fifteen or twenty minutes.\nQ2 (Expected level): Complete: In smart homes, appliances are controlled by a ______.\nAnswer: computer.\nQ3 (Advanced level): Write a four-sentence paragraph about a smart home you would like.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students write the final draft and put it with the first draft in the portfolio."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Listen for the technology each speaker would miss and the reasons\n2. Discuss what a smart home can do\n\nPeriod 2:\n1. Read a text to find the answer to a focus question\n2. Answer five detailed questions about smart homes\n\nPeriod 3:\n1. Discuss differences between homes today and ten years ago and predict smart features\n2. Write a paragraph about a smart home of the future"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Analyze\nOutcome 2: Understand\n\nPeriod 2:\nOutcome 1: Analyze\nOutcome 2: Understand\n\nPeriod 3:\nOutcome 1: Evaluate\nOutcome 2: Create"], [3, "Strategies", "Period 1:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 2:\n1. Modeling\n2. Cooperative learning\n\nPeriod 3:\n1. Cooperative learning\n2. Self-learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n4. Smart board\n\nPeriod 3:\n1. Book\n2. Other (Workbook)\n3. Traditional board\n4. Pens"], [5, "Concepts", "Period 1:\n1. innovation\n2. invention\n3. technology\n4. smart home\n5. appliance\n6. miss\n7. reason\n\nPeriod 2:\n1. smart home\n2. appliances\n3. electrical wires\n4. convenient\n5. energy prices\n6. save money\n7. special features\n\nPeriod 3:\n1. extensive reading\n2. feature\n3. disadvantage\n4. problem\n5. future\n6. paragraph"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'Which technology could you not live without for a week?'\n\nPeriod 2:\nWrites the focus question 'What can a smart home do?' on the board.\n\nPeriod 3:\nAsks: 'How is your home different from ten years ago?'"], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learni ): How can a smart home save money?\nAnswer: By turning off lights and air conditioners when they are not needed and showing how much money is saved.\n\nPeriod 3:\nQ1 (Support level): Name one disadvantage of a smart home.\nAnswer: e.g. it can be expensive / it may break down / it can be hacked.\nQ2 (Expected level): Why does the Top Tip say reading is like learning a sport?\nAnswer: The way to improve is through regular practice – reading a lot every day.\nQ3 (Advanced level): Which smart feature would you like in a school? Explain.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What do many new appliances like washing machines now have inside?\nAnswer: Computers.\nQ2 (Expected level): Which technology would you miss most? Give a reason.\nAnswer: Open answer.\nQ3 (Advanced level): Write two sentences about how technology has changed your home in ten years.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): Can you turn things on and off when you are away?\nAnswer: Yes – with a mobile phone or by sending a message over the Internet.\nQ2 (Expected level): What happens when you walk into a room in a smart home?\nAnswer: The lights come on, the temperature adjusts, your favourite song plays and your pictures appear on screens.\nQ3 (Advanced level): Which feature of a smart home is the most useful? Explain.\nAnswer: Open answer with a reason.\n\nPeriod 3:\nQ1 (Support level): How long should you read each day, according to the Top Tip?\nAnswer: Fifteen or twenty minutes.\nQ2 (Expected level): Complete: In smart homes, appliances are controlled by a ______.\nAnswer: computer.\nQ3 (Advanced level): Write a four-sentence paragraph about a smart home you would like.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents read the text 'Smart Homes' (CB p. 50) at home and underline new words.\n\nPeriod 2:\nStudents prepare their ideas for 'What other features will smart homes have?'\n\nPeriod 3:\nStudents write the final draft and put it with the first draft in the portfolio."]]}, {"label": "Theme 4 - Unit 2: Questions and Answers", "periods": [{"focus": "A trivia quiz and listening (CB p. 52, Activity 1)", "week": "Week 13: 29/11 - 3/12", "num": 73, "fields": [[1, "Learning Outcomes", "1. Answer general-knowledge questions and check answers by listening\n2. Notice passive forms in the questions"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Game-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. trivia quiz\n2. first grown\n3. taken from\n4. won by\n5. destroyed by\n6. written by\n7. sent into space"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Where were bananas first grown?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group guess. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the eight questions and choose a, b or c in groups.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: eight predicted answers.\n\nActivity 2 (18 minutes):\n- Strategy: Game-based learning\n- Teacher: Trivia game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: listen to the recording and check; score a point for each correct answer.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a team score.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Notice the language. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: underline the passive verbs in the questions (was destroyed, was written, was sent).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of passive questions.\n\nActivity 4 (6 minutes):\n- Strategy: Game-based learning\n- Teacher: Wrap-up. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: announce the winners.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a final score."], [8, "Formative Assessment", "Q1 (Support level): By whom was Romeo and Juliet written?\nAnswer: William Shakespeare.\nQ2 (Expected level): How was the city of Pompeii destroyed?\nAnswer: By a volcano.\nQ3 (Advanced level): What do the verbs 'was destroyed' and 'was written' have in common?\nAnswer: Both are past passive – the verb 'was' + past participle."], [9, "Summative Assessment", "Q1 (Support level): Where were the first modern Olympic Games held?\nAnswer: Athens, Greece.\nQ2 (Expected level): Which animal was first sent into space?\nAnswer: A dog.\nQ3 (Advanced level): Make a trivia question using 'was invented by'.\nAnswer: Open answer, e.g. Who was the light bulb invented by?"], [10, "Notes within the Weekly Study Plan", "Students write three trivia questions of their own."]]}, {"focus": "Grammar Recall: the past passive and past participles (CB p. 53)", "week": "Week 14: 6/12 - 10/12", "num": 74, "fields": [[1, "Learning Outcomes", "1. State when the past passive is used\n2. Form the past passive with past participles"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Apply"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. past passive\n2. was/were + past participle\n3. by + agent\n4. past participle\n5. emphasise\n6. unknown agent"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'Edison invented the light bulb.' and 'The light bulb was invented by Edison.' and asks which sentence is about the light bulb."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the form. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: compare active and passive versions of three sentences and find how the passive is formed.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a form pattern.\n\nActivity 2 (14 minutes):\n- Strategy: Discovery learning\n- Teacher: Match to uses. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: match: 1 Three paintings were stolen (we don't know who) → b; 2 My brother was born in Muscat → c; 3 Julius Caesar was written by William Shakespeare → a.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: three matches.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Past participles. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: list the past participles of ten verbs (steal–stolen, write–written, invent–invented, build–built…).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a participle list.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: State the rule. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: explain the rule to a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a spoken rule."], [8, "Formative Assessment", "Q1 (Support level): Complete: Julius Caesar was ______ by Shakespeare. (write)\nAnswer: written.\nQ2 (Expected level): Why is the passive used in 'Three paintings were stolen from the museum'?\nAnswer: We don't know who stole them.\nQ3 (Advanced level): Explain the form of 'My brother was born in Muscat'.\nAnswer: was + past participle (born); used for date or place of birth."], [9, "Summative Assessment", "Q1 (Support level): Give the past participle of 'invent' and 'discover'.\nAnswer: invented; discovered.\nQ2 (Expected level): Which sentence is passive: 'Edison invented the bulb' or 'The bulb was invented by Edison'?\nAnswer: The bulb was invented by Edison.\nQ3 (Advanced level): Write two passive sentences about places in Oman.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students list ten past participles of irregular verbs."]]}, {"focus": "Rewriting active sentences in the past passive (CB p. 53, Activity 2)", "week": "Week 14: 6/12 - 10/12", "num": 75, "fields": [[1, "Learning Outcomes", "1. Rewrite active sentences in the past passive\n2. Check the accuracy of passive sentences"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Analyze"], [3, "Strategies", "1. Modeling\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. active\n2. passive\n3. agent\n4. invented\n5. discovered\n6. designed\n7. sank\n8. sent"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'Marie Curie discovered radium.' and asks for the passive."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling the change. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models changing an active sentence to passive in three steps: move the object, add was/were + past participle, add by + agent.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a three-step rule.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Seven sentences. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: rewrite sentences 1–7 (e.g. Tim Berners-Lee invented the world wide web; An iceberg sank the Titanic; Alfred Nobel invented dynamite).\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: seven passive sentences.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Check. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: check answers and correct errors.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: corrected sentences.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Own sentences. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write two passive sentences about inventions.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: two sentences."], [8, "Formative Assessment", "Q1 (Support level): Rewrite: Edison invented the light bulb.\nAnswer: The light bulb was invented by Edison.\nQ2 (Expected level): Rewrite: An iceberg sank the Titanic.\nAnswer: The Titanic was sunk by an iceberg.\nQ3 (Advanced level): Rewrite: Marie Curie discovered radium and Alfred Nobel invented dynamite.\nAnswer: Radium was discovered by Marie Curie and dynamite was invented by Alfred Nobel."], [9, "Summative Assessment", "Q1 (Support level): Rewrite: Alfred Nobel invented dynamite.\nAnswer: Dynamite was invented by Alfred Nobel.\nQ2 (Expected level): Rewrite: Ustad Ahmad Lahauri designed the Taj Mahal.\nAnswer: The Taj Mahal was designed by Ustad Ahmad Lahauri.\nQ3 (Advanced level): Rewrite: South Americans first grew potatoes.\nAnswer: Potatoes were first grown by South Americans."], [10, "Notes within the Weekly Study Plan", "Students correct five passive sentences prepared by the teacher."]]}, {"focus": "Activate Your English: questions and answers; WB pp. 46–47 and Grammar Practice (WB p. 67)", "week": "Week 14: 6/12 - 10/12", "num": 76, "fields": [[1, "Learning Outcomes", "1. Ask and answer indirect questions using the past passive\n2. Complete grammar tasks accurately"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "1. Game-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "1. Do you know…?\n2. Can you tell me…?\n3. I'm not sure but…\n4. trivia quiz\n5. past passive\n6. pair work"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Can you tell me who invented the telephone?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: Match questions and answers. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: match the eight questions with the eight answers.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: eight matched pairs.\n\nActivity 2 (14 minutes):\n- Strategy: Game-based learning\n- Teacher: Trivia quiz in pairs. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: Student A asks Student B the quiz A questions and B asks A the quiz B questions (CB p. 71); note the partner's answers and score.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a score for each student.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Workbook practice. Forms gro ful and most harmful inventions; reading the essay (CB p. 54, Activities 1–2)", "week": "Week 14: 6/12 - 10/12", "num": 77, "fields": [[1, "Learning Outcomes", "1. Rank inventions as helpful or harmful and justify the choices\n2. Read an essay and list the writer's helpful and harmful inventions"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Analyze"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. invention\n2. helpful\n3. harmful\n4. writing systems\n5. paper\n6. money\n7. medicine\n8. the wheel\n9. cigarettes\n10. cars\n11. guns"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What is the most useful invention in your life? The most harmful?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: list one useful and one harmful invention each.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class list.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Own lists. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: make a list of five helpful and five harmful inventions and discuss with the group.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two group lists.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Read the essay. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read 'The Best and Worst Inventions' and list the writer's five helpful (writing systems, paper, money, medicine, the wheel) and the harmful inventions; compare with your lists.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two lists and a comparison.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: say whether you agree with the writer.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one sentence."], [8, "Formative Assessment", "Q1 (Support level): Name two of the writer's helpful inventions.\nAnswer: e.g. writing systems, paper, money, medicine, the wheel.\nQ2 (Expected level): Why does the writer say the wheel is helpful?\nAnswer: It is necessary for most types of transportation.\nQ3 (Advanced level): Why does the writer list cars as harmful?\nAnswer: They cause global warming and kill huge numbers of people in traffic accidents."], [9, "Summative Assessment", "Q1 (Support level): How many deaths a year does cigarette smoking cause, according to the WHO?\nAnswer: Almost 5.5 million.\nQ2 (Expected level): How many people are killed in traffic accidents every year?\nAnswer: Two million (WHO).\nQ3 (Advanced level): Do you agree that cars are harmful? Explain.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students re-read the essay and note new words."]]}, {"focus": "Vocabulary: word forms and invention words (CB p. 55)", "week": "Week 14: 6/12 - 10/12", "num": 78, "fields": [[1, "Learning Outcomes", "1. Build a table of word forms (noun, verb, adjective)\n2. Use word forms correctly in sentences"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "1. Discovery learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)"], [5, "Concepts", "1. invent / invention / inventor\n2. discover / discovery\n3. help / helpful\n4. harm / harmful\n5. use / useful / useless\n6. noun\n7. verb\n8. adjective"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'invent' on the board and asks for related words."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice word endings. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: compare invent–invention–inventor and help–helpful and identify endings that make nouns, adjectives and people words.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a word-ending rule.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Word-form table. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete a table of nouns, verbs and adjectives from the essay and the glossary.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a completed table.\n\nActivity 3 (10 minutes):\n- Strategy: Discovery learning\n- Teacher: Use them. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: write sentences using three word forms.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: three sentences.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Self-test. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: cover and test spelling.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-score."], [8, "Formative Assessment", "Q1 (Support level): What is the noun of 'invent'?\nAnswer: invention.\nQ2 (Expected level): What is the adjective of 'harm'?\nAnswer: harmful.\nQ3 (Advanced level): Complete: The ______ (invent) of the wheel was very ______ (help).\nAnswer: invention; helpful."], [9, "Summative Assessment", "Q1 (Support level): What is the noun of 'discover'?\nAnswer: discovery.\nQ2 (Expected level): Complete: Smoking is very ______ (harm).\nAnswer: harmful.\nQ3 (Advanced level): Write two sentences using 'invention' and 'useful'.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students add five word-form families to their vocabulary notebooks."]]}, {"focus": "Discussion: helpful or harmful? WB pp. 48–49", "week": "Week 14: 6/12 - 10/12", "num": 79, "fields": [[1, "Learning Outcomes", "1. Present an argument about an invention using reasons\n2. Complete workbook tasks on invention vocabulary"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Apply"], [3, "Strategies", "1. Cooperative learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. argument\n2. reason\n3. because\n4. on the other hand\n5. benefit\n6. harm\n7. invention"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Is the mobile phone a helpful or a harmful invention?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Warm-up. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: vote and give one reason.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a class vote.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Present an argument. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: choose one invention and prepare a two-minute argument (helpful or harmful) with three reasons and an example.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: an argument outline.\n\nActivity 3 (12 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 48–49 alone and check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Feedback. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give one positive comment and one question.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a feedback note."], [8, "Formative Assessment", "Q1 (Support level): Say whether the wheel is helpful or harmful.\nAnswer: Helpful.\nQ2 (Expected level): Give one reason why cigarettes are harmful.\nAnswer: They cause millions of deaths a year.\nQ3 (Advanced level): Present one argument for an invention you consider harmful.\nAnswer: Open answer with reasons."], [9, "Summative Assessment", "Q1 (Support level): Complete: Money is helpful ______ it helps businesses develop. (because / but)\nAnswer: because.\nQ2 (Expected level): Give two reasons why paper is helpful.\nAnswer: It allows us to keep and share information; modern technology depends on it.\nQ3 (Advanced level): Write a four-sentence argument about the Internet.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 48–49."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Rank inventions as helpful or harmful and justify the choices\n2. Read an essay and list the writer's helpful and harmful inventions\n\nPeriod 2:\n1. Build a table of word forms (noun, verb, adjective)\n2. Use word forms correctly in sentences\n\nPeriod 3:\n1. Present an argument about an invention using reasons\n2. Complete workbook tasks on invention vocabulary"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Evaluate\nOutcome 2: Analyze\n\nPeriod 2:\nOutcome 1: Apply\nOutcome 2: Apply\n\nPeriod 3:\nOutcome 1: Evaluate\nOutcome 2: Apply"], [3, "Strategies", "Period 1:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 2:\n1. Discovery learning\n2. Self-learning\n\nPeriod 3:\n1. Cooperative learning\n2. Self-learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Traditional board\n3. Pens\n4. Smart board\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)\n\nPeriod 3:\n1. Book\n2. Other (Workbook)\n3. Traditional board\n4. Pens"], [5, "Concepts", "Period 1:\n1. invention\n2. helpful\n3. harmful\n4. writing systems\n5. paper\n6. money\n7. medicine\n8. the wheel\n9. cigarettes\n10. cars\n11. guns\n\nPeriod 2:\n1. invent / invention / inventor\n2. discover / discovery\n3. help / helpful\n4. harm / harmful\n5. use / useful / useless\n6. noun\n7. verb\n8. adjective\n\nPeriod 3:\n1. argument\n2. reason\n3. because\n4. on the other hand\n5. benefit\n6. harm\n7. invention"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'What is the most useful invention in your life? The most harmful?'\n\nPeriod 2:\nWrites 'invent' on the board and asks for related words.\n\nPeriod 3:\nAsks: 'Is the mobile phone a helpful or a harmful invention?'"], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to resent one argument for an invention you consider harmful.\nAnswer: Open answer with reasons."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): How many deaths a year does cigarette smoking cause, according to the WHO?\nAnswer: Almost 5.5 million.\nQ2 (Expected level): How many people are killed in traffic accidents every year?\nAnswer: Two million (WHO).\nQ3 (Advanced level): Do you agree that cars are harmful? Explain.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): What is the noun of 'discover'?\nAnswer: discovery.\nQ2 (Expected level): Complete: Smoking is very ______ (harm).\nAnswer: harmful.\nQ3 (Advanced level): Write two sentences using 'invention' and 'useful'.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Complete: Money is helpful ______ it helps businesses develop. (because / but)\nAnswer: because.\nQ2 (Expected level): Give two reasons why paper is helpful.\nAnswer: It allows us to keep and share information; modern technology depends on it.\nQ3 (Advanced level): Write a four-sentence argument about the Internet.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents re-read the essay and note new words.\n\nPeriod 2:\nStudents add five word-form families to their vocabulary notebooks.\n\nPeriod 3:\nStudents finish WB pp. 48–49."]]}, {"label": "Theme 4 - Unit 4: Virtual Reality", "periods": [{"focus": "Computers and reading about virtual reality (CB p. 56, Activities 1–2)", "week": "Week 15: 13/12 - 17/12", "num": 80, "fields": [[1, "Learning Outcomes", "1. Discuss computer use and read a text about virtual reality\n2. Find answers to three questions about virtual reality"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Illustrative picture\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. virtual reality\n2. interactive environment\n3. audio and visual\n4. keyboard and mouse\n5. CAD\n6. limitations"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'How many hours a week do you use a computer? What for?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: discuss a computer use and games.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class summary.\n\nActivity 2 (18 minutes):\n- Strategy: Cooperative learning\n- Teacher: Reading. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the virtual reality text and answer: a What is virtual reality? b What is it used for (copying the real world, fictional worlds)? c What limitations does it have?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three answers.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Examples. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: list examples (pilot training, virtual museum tours, virtual pets, CAD, PacMan, Super Mario Brothers).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a table of examples.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs share one example.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one sentence."], [8, "Formative Assessment", "Q1 (Support level): What is virtual reality?\nAnswer: An interactive environment made using a computer.\nQ2 (Expected level): Give two examples of virtual reality copying the real world.\nAnswer: e.g. training pilots and doctors, virtual museum tours, CAD.\nQ3 (Advanced level): What limitations does virtual reality have?\nAnswer: It is difficult to make it seem real because computers and the Internet are not powerful enough yet."], [9, "Summative Assessment", "Q1 (Support level): Which two games are early fictional virtual reality games?\nAnswer: PacMan and Super Mario Brothers.\nQ2 (Expected level): What may virtual reality of the future have in addition to sights and sounds?\nAnswer: Smell and touch.\nQ3 (Advanced level): Why is CAD software useful?\nAnswer: Designers can clearly see what they are trying to make."], [10, "Notes within the Weekly Study Plan", "Students list two uses of virtual reality they know."]]}, {"focus": "Indirect questions and listening strategies (CB p. 57)", "week": "Week 15: 13/12 - 17/12", "num": 81, "fields": [[1, "Learning Outcomes", "1. Form indirect questions with polite openers\n2. Use strategies to make a listening text easier"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. indirect question\n2. Can you tell us…?\n3. Do you know…?\n4. Could you give some examples…?\n5. predict\n6. key words\n7. listening strategy"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'How do you ask politely for information from a stranger?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling indirect questions. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models turning 'What is virtual reality?' into 'Can you tell us what virtual reality is?' with word order explained.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a transformation rule.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Make indirect questions. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: turn six direct questions into indirect ones with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: six indirect questions.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Listening strategies. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: discuss strategies (predict, read questions first, listen for key words, listen again) and apply them to a short listening.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a strategy list.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Own question. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: write one indirect question for an expert.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: one question."], [8, "Formative Assessment", "Q1 (Support level): Make polite: 'What is virtual reality?' (Can you tell us…)\nAnswer: Can you tell us what virtual reality is?\nQ2 (Expected level): Which has correct word order: 'Do you know when did it begin?' or 'Do you know when it began?'\nAnswer: 'Do you know when it began?'\nQ3 (Advanced level): Write an indirect question about the future of virtual reality.\nAnswer: e.g. Do you have any idea what virtual reality will be like in the future?"], [9, "Summative Assessment", "Q1 (Support level): Give one listening strategy.\nAnswer: e.g. read the questions first / predict the topic.\nQ2 (Expected level): Turn into an indirect question: 'Where is the museum?' (Could you tell me…)\nAnswer: Could you tell me where the museum is?\nQ3 (Advanced level): Write two indirect questions for a talk on computers.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students write three indirect questions about an invention."]]}, {"focus": "Speaking: talking about uses and limits of virtual reality; WB pp. 50–51", "week": "Week 15: 13/12 - 17/12", "num": 82, "fields": [[1, "Learning Outcomes", "1. Talk about uses and limitations of virtual reality in a mini-presentation\n2. Complete workbook tasks on virtual reality"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "1. Project-based learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Computer\n4. Pens"], [5, "Concepts", "1. use\n2. limitation\n3. education\n4. training\n5. game\n6. expert\n7. presentation"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'If you could visit any place in virtual reality, where would you go?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Warm-up. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: choose a place and say why.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: one sentence.\n\nActivity 2 (18 minutes):\n- Strategy: Project-based learning\n- Teacher: Mini-presentation. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: prepare a one-minute presentation on the uses and limitations of virtual reality with one example and one indirect question for the audience.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a presentation outline.\n\nActivity 3 (10 minutes):\n- Strategy: Project-based learning\n- Teacher: Present and ask. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: present and answer indirect questions from the audience.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a presented talk.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: WB practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: start WB pp. 50–51 and check.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: started tasks."], [8, "Formative Assessment", "Q1 (Support level): Name one use of virtual reality.\nAnswer: e.g. training pilots / virtual museum tours.\nQ2 (Expected level): Name one limitation of virtual reality.\nAnswer: It cannot yet seem as real as reality.\nQ3 (Advanced level): Ask an indirect question about virtual reality.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): Complete: Virtual reality is mainly a sound and ______ experience.\nAnswer: sight (visual).\nQ2 (Expected level): Why does the writer say virtual reality will seem more real in future?\nAnswer: Computers and the Internet will develop.\nQ3 (Advanced level): Write four sentences about the uses and limits of virtual reality.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 50–51."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Discuss computer use and read a text about virtual reality\n2. Find answers to three questions about virtual reality\n\nPeriod 2:\n1. Form indirect questions with polite openers\n2. Use strategies to make a listening text easier\n\nPeriod 3:\n1. Talk about uses and limitations of virtual reality in a mini-presentation\n2. Complete workbook tasks on virtual reality"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Understand\nOutcome 2: Analyze\n\nPeriod 2:\nOutcome 1: Apply\nOutcome 2: Apply\n\nPeriod 3:\nOutcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "Period 1:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 2:\n1. Modeling\n2. Participatory learning\n\nPeriod 3:\n1. Project-based learning\n2. Self-learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Illustrative picture\n3. Traditional board\n4. Pens\n\nPeriod 2:\n1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens\n\nPeriod 3:\n1. Book\n2. Other (Workbook)\n3. Computer\n4. Pens"], [5, "Concepts", "Period 1:\n1. virtual reality\n2. interactive environment\n3. audio and visual\n4. keyboard and mouse\n5. CAD\n6. limitations\n\nPeriod 2:\n1. indirect question\n2. Can you tell us…?\n3. Do you know…?\n4. Could you give some examples…?\n5. predict\n6. key words\n7. listening strategy\n\nPeriod 3:\n1. use\n2. limitation\n3. education\n4. training\n5. game\n6. expert\n7. presentation"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'How many hours a week do you use a computer? What for?'\n\nPeriod 2:\nAsks: 'How do you ask politely for information from a stranger?'\n\nPeriod 3:\nAsks: 'If you could visit any place in virtual reality, where would you go?'"], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: discuss a computer use and games.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class summary.\n\nActivity 2 (18 minutes):\n- Strategy: Cooperative learning\n- Teacher: Reading. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the virtual reality text and answer: a What is virtual reality? b What is it used for (copying the real world, fictional worlds)? c What limitations does it have?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three answers.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Examples. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: list examples (pilot training, virtual museum tours, virtual pets, CAD, PacMan, Super Mario Brothers).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a table of examples.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs share one example.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one sentence.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling indirect questions. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models turning 'What is virtual reality?' into 'Can you tell us what virtual reality is?' with word order explained.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a transformation rule.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Make indirect questions. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: turn six direct questions into indirect ones with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: six indirect questions.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Listening strategies. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: discuss strategies (predict, read questions first, listen for key words, listen again) and apply them to a short listening.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a strategy list.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Own question. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: write one indirect question for an expert.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: one question.\n\nPeriod 3:\nActivity 1 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Warm-up. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: choose a place and say why.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: one sentence.\n\nActivity 2 (18 minutes):\n- Strategy: Project-based learning\n- Teacher: Mini-presentation. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: prepare a one-minute presentation on the uses and limitations of virtual reality with one example and one indirect question for the audience.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a presentation outline.\n\nActivity 3 (10 minutes):\n- Strategy: Project-based learning\n- Teacher: Present and ask. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: present and answer indirect questions from the audience.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a presented talk.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: WB practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: start WB pp. 50–51 and check.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: started tasks."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): What is virtual reality?\nAnswer: An interactive environment made using a computer.\nQ2 (Expected level): Give two examples of virtual reality copying the real world.\nAnswer: e.g. training pilots and doctors, virtual museum tours, CAD.\nQ3 (Advanced level): What limitations does virtual reality have?\nAnswer: It is difficult to make it seem real because computers and the Internet are not powerful enough yet.\n\nPeriod 2:\nQ1 (Support level): Make polite: 'What is virtual reality?' (Can you tell us…)\nAnswer: Can you tell us what virtual reality is?\nQ2 (Expected level): Which has correct word order: 'Do you know when did it begin?' or 'Do you know when it began?'\nAnswer: 'Do you know when it began?'\nQ3 (Advanced level): Write an indirect question about the future of virtual reality.\nAnswer: e.g. Do you have any idea what virtual reality will be like in the future?\n\nPeriod 3:\nQ1 (Support level): Name one use of virtual reality.\nAnswer: e.g. training pilots / virtual museum tours.\nQ2 (Expected level): Name one limitation of virtual reality.\nAnswer: It cannot yet seem as real as reality.\nQ3 (Advanced level): Ask an indirect question about virtual reality.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Which two games are early fictional virtual reality games?\nAnswer: PacMan and Super Mario Brothers.\nQ2 (Expected level): What may virtual reality of the future have in addition to sights and sounds?\nAnswer: Smell and touch.\nQ3 (Advanced level): Why is CAD software useful?\nAnswer: Designers can clearly see what they are trying to make.\n\nPeriod 2:\nQ1 (Support level): Give one listening strategy.\nAnswer: e.g. read the questions first / predict the topic.\nQ2 (Expected level): Turn into an indirect question: 'Where is the museum?' (Could you tell me…)\nAnswer: Could you tell me where the museum is?\nQ3 (Advanced level): Write two indirect questions for a talk on computers.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Complete: Virtual reality is mainly a sound and ______ experience.\nAnswer: sight (visual).\nQ2 (Expected level): Why does the writer say virtual reality will seem more real in future?\nAnswer: Computers and the Internet will develop.\nQ3 (Advanced level): Write four sentences about the uses and limits of virtual reality.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents list two uses of virtual reality they know.\n\nPeriod 2:\nStudents write three indirect questions about an invention.\n\nPeriod 3:\nStudents finish WB pp. 50–51."]]}, {"label": "Theme 4 - Unit 5: E-Shopping", "periods": [{"focus": "Talking about buying online and reading terms and conditions (CB p. 58, Activities 1–2)", "week": "Week 15: 13/12 - 17/12", "num": 83, "fields": [[1, "Learning Outcomes", "1. Discuss the dangers of buying online\n2. Read terms and conditions to answer yes/no questions"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Analyze"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. e-shopping\n2. online\n3. terms and conditions\n4. membership\n5. password\n6. faulty\n7. recommended\n8. minimum\n9. maximum"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Have you or anyone you know bought something online? What?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share online buying experiences.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class list.\n\nActivity 2 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss the dangers of buying online and which items from the box you would buy.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes.\n\nActivity 3 (18 minutes):\n- Strategy: Cooperative learning\n- Teacher: Terms and conditions. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the Online DVD Club terms and answer questions a–h (e.g. Can you buy DVDs if you are 19? Can you return DVDs after watching?).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: eight answers.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Check. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare answers.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: corrected answers."], [8, "Formative Assessment", "Q1 (Support level): Can you buy DVDs if you are 19?\nAnswer: Yes – you must be 18 or over.\nQ2 (Expected level): Can you send a DVD back after you have watched it?\nAnswer: No – you can only return DVDs that are faulty.\nQ3 (Advanced level): If you wait two months to pay, do you pay extra? Why?\nAnswer: No – you must pay within three months; after that 10 percent is added."], [9, "Summative Assessment", "Q1 (Support level): Do you have to buy the recommended DVDs?\nAnswer: No.\nQ2 (Expected level): How many DVDs must you buy a year for the first two years?\nAnswer: A minimum of ten.\nQ3 (Advanced level): Which condition would you not accept? Why?\nAnswer: Open answer with a reason."], [10, "Notes within the Weekly Study Plan", "Students read the e-mail of complaint on CB p. 59 at home."]]}, {"focus": "Reading an e-mail of complaint and its language (CB p. 59, Activity 3)", "week": "Week 15: 13/12 - 17/12", "num": 84, "fields": [[1, "Learning Outcomes", "1. Identify the four complaints in an e-mail\n2. Decide who is right using the terms and conditions"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Evaluate"], [3, "Strategies", "1. Problem-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. complaint\n2. dissatisfied\n3. inform\n4. as soon as possible\n5. Yours faithfully\n6. Dear Sir or Madam\n7. I am writing to…"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'If you buy something online and it is wrong, what do you do?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: The problem. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: presents the e-mail and asks: Is the customer right?.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a first opinion.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Find the complaints. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the e-mail and list the four complaints (forced recommended DVD, extra 10 percent charge, disliked DVDs, could not return DVDs).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of complaints.\n\nActivity 3 (12 minutes):\n- Strategy: Problem-based learning\n- Teacher: Who is wrong?. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: check each complaint against the terms and conditions (CB p. 58) and decide who is right.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a justified decision.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Language. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: underline formal phrases (Dear Sir or Madam / I am writing to inform you / Yours faithfully).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a phrase bank."], [8, "Formative Assessment", "Q1 (Support level): How does the e-mail begin?\nAnswer: Dear Sir or Madam:\nQ2 (Expected level): Name two complaints in the e-mail.\nAnswer: e.g. he had to order the recommended DVD; he was charged an extra 10 percent; he could not return the DVDs.\nQ3 (Advanced level): Is the company wrong about returning DVDs? Explain.\nAnswer: No – the terms say DVDs can only be returned if they are faulty."], [9, "Summative Assessment", "Q1 (Support level): How does the e-mail end?\nAnswer: Yours faithfully.\nQ2 (Expected level): What does the customer want?\nAnswer: To return the DVDs and not pay the extra 10 percent.\nQ3 (Advanced level): Write one formal sentence of complaint about a late delivery.\nAnswer: Open answer, e.g. I am writing to inform you that my order has not arrived."], [10, "Notes within the Weekly Study Plan", "Students list formal phrases from the e-mail."]]}, {"focus": "Writing an e-mail of complaint; Review & Reference (CB pp. 59, 64; WB pp. 52–53)", "week": "Week 15: 13/12 - 17/12", "num": 85, "fields": [[1, "Learning Outcomes", "1. Write a formal e-mail of complaint about an online purchase\n2. Review the Theme 4 learning and glossary words"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Create\nOutcome 2: Remember"], [3, "Strategies", "1. Modeling\n2. Project-based learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook and Writing Guide p. 72)\n3. Pens"], [5, "Concepts", "1. complaint e-mail\n2. formal register\n3. explain the problem\n4. request\n5. draft\n6. proofread\n7. glossary\n8. self-assessment"], [6, "Warm-up / Introduction / Prior Learning", "Reminds students of formal opening and closing phrases."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling the e-mail. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models planning and writing the first paragraph of a complaint (what you ordered, what went wrong, what you want) thinking aloud about formal phrases.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a model first paragraph.\n\nActivity 2 (22 minutes):\n- Strategy: Project-based learning\n- Teacher: Write the e-mail. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: choose one situation (a noisy song; wrong shoes; wrong book; wrong air ticket; DVD not received) and write a first draft following the Writing Guide, then proofread.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a first-draft e-mail.\n\nActivity 3 (6 minutes):\n- Strategy: Project-based learning\n- Teacher: Peer review. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: exchange drafts and give feedback.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a feedback note.\n\nActivity 4 (4 minutes):\n- Strategy: Modeling\n- Teacher: Review page. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: read CB p. 64 'In this theme you have learned…' and choose core words.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a self-assessment line."], [8, "Formative Assessment", "Q1 (Support level): Which opening is correct for a complaint: 'Hi!' or 'Dear Sir or Madam'?\nAnswer: Dear Sir or Madam.\nQ2 (Expected level): Put in order: I am writing to… / Yours faithfully / Please reply as soon as possible.\nAnswer: I am writing to… / Please reply as soon as possible. / Yours faithfully.\nQ3 (Advanced level): Write the first two sentences of a complaint about a wrong book.\nAnswer: e.g. I am writing to inform you that I received the wrong book. I ordered Introduction to Accounting but received Introduction to Chemistry."], [9, "Summative Assessment", "Q1 (Support level): Match: innovation = ?\nAnswer: The introduction of new ideas, methods or inventions (from the unit).\nQ2 (Expected level): Correct: 'dear sir i am not happy about you're service'.\nAnswer: Dear Sir, I am not happy about your service.\nQ3 (Advanced level): Write four sentences of a complaint e-mail about a late delivery, including a request.\nAnswer: Open answer: problem, details, request, formal closing."], [10, "Notes within the Weekly Study Plan", "Final draft is attached to the first draft in the portfolio. Core words (CB p. 64) are tested at the end of Theme 4. WB pp. 56–57 (Review) are completed."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Discuss the dangers of buying online\n2. Read terms and conditions to answer yes/no questions\n\nPeriod 2:\n1. Identify the four complaints in an e-mail\n2. Decide who is right using the terms and conditions\n\nPeriod 3:\n1. Write a formal e-mail of complaint about an online purchase\n2. Review the Theme 4 learning and glossary words"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Evaluate\nOutcome 2: Analyze\n\nPeriod 2:\nOutcome 1: Analyze\nOutcome 2: Evaluate\n\nPeriod 3:\nOutcome 1: Create\nOutcome 2: Remember"], [3, "Strategies", "Period 1:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 2:\n1. Problem-based learning\n2. Cooperative learning\n\nPeriod 3:\n1. Modeling\n2. Project-based learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n4. Smart board\n\nPeriod 3:\n1. Book\n2. Other (Workbook and Writing Guide p. 72)\n3. Pens"], [5, "Concepts", "Period 1:\n1. e-shopping\n2. online\n3. terms and conditions\n4. membership\n5. password\n6. faulty\n7. recommended\n8. minimum\n9. maximum\n\nPeriod 2:\n1. complaint\n2. dissatisfied\n3. inform\n4. as soon as possible\n5. Yours faithfully\n6. Dear Sir or Madam\n7. I am writing to…\n\nPeriod 3:\n1. complaint e-mail\n2. formal register\n3. explain the problem\n4. request\n5. draft\n6. proofread\n7. glossary\n8. self-assessment"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'Have you or anyone you know bought something online? What?'\n\nPeriod 2:\nAsks: 'If you buy something online and it is wrong, what do you do?'\n\nPeriod 3:\nReminds students of formal opening and closing phrases."], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share online buying experiences.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class list.\n\nActivity 2 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Dis
