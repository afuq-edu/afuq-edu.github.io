Outcome 1: Analyze\nOutcome 2: Apply\n\nPeriod 5:\nOutcome 1: Evaluate\nOutcome 2: Create"], [3, "Strategies", "Period 1:\n1. Participatory learning\n2. Cooperative learning\n\nPeriod 2:\n1. Cooperative learning\n2. Modeling\n\nPeriod 3:\n1. Modeling\n2. Cooperative learning\n\nPeriod 4:\n1. Discovery learning\n2. Participatory learning\n\nPeriod 5:\n1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Illustrative picture\n3. Traditional board\n4. Pens\n5. Other (dictionary)\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 3:\n1. Book\n2. Traditional board\n3. Pens\n4. Other (Workbook)\n\nPeriod 4:\n1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)\n\nPeriod 5:\n1. Book\n2. Traditional board\n3. Pens\n4. Other (Workbook)"], [5, "Concepts", "Period 1:\n1. adolescence\n2. angst\n3. acne\n4. mood swings\n5. peer pressure\n6. suspicious\n7. critical\n8. circle of friends\n\nPeriod 2:\n1. skim\n2. paragraph\n3. topic\n4. values\n5. transition\n6. dependent\n7. independent\n\nPeriod 3:\n1. main idea\n2. topic sentence\n3. growth spurt\n4. puberty\n5. acne\n6. conflict\n\nPeriod 4:\n1. transition\n2. physical\n3. mental\n4. growth spurt\n5. acne\n6. security\n7. conflict\n8. synonym\n\nPeriod 5:\n1. stereotype\n2. selfish\n3. lazy\n4. mood swings\n5. untidy\n6. communicate"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nShows the cartoon on p. 17 and asks: 'What's the matter with him? Is he ill?'\n\nPeriod 2:\nWrites 'Who am I?' on the board and asks if anyone has asked this question.\n\nPeriod 3:\nAsks: 'What changes have you noticed in your body or your thinking in the last two years?'\n\nPeriod 4:\nWrites 'disagreement' and asks for a similar word.\n\nPeriod 5:\nAsks: 'Are all teenagers lazy? What do people say about teenagers?'"], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Cartoon talk. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: predict why the boy is behaving strangely.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three predictions.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: What does adolescence mean?. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: choose a, b, c or d for 'adolescence' and justify.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: the correct meaning (c) with reason.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Words in bold. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the introduction and use a dictionary to check angst, acne, mood swings, peer pressure, suspicious, critical.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a glossary with meanings.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs use one new word in a sentence.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one sentence each.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss which of the four questions (Who am I? What am I going to do with my life? What are my values? What am I good at?) they have asked and add others.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of extra questions.\n\nActivity 2 (12 minutes):\n- Strategy: Modeling\n- Teacher: Skimming model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models skimming 'Adolescence' and noting each paragraph's main idea in two words.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a paragraph-topic note.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Match topics. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: write the paragraph number for: a relationship with family, b the nature of adolescence, c physical changes, d mental changes.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: four matched answers.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Independent check. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: check answers against first lines.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: corrected answers.\n\nPeriod 3:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Finding main ideas. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models underlining the topic sentence of paragraph 1 and discarding details; gives the Top Tip: skim, don't read every word.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a topic sentence strategy.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Questions a–d. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: answer: a How is adolescence described? b How is the growth spurt different for girls and boys? c What is acne? d How can friends cause family conflict?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: four full-sentence answers.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: WB plan. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: complete WB p. 16 reading tasks independently using the strategy.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a completed plan.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected answers.\n\nPeriod 4:\nActivity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the method. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study the example 'period between 13 and 19 = adolescence' and find how to locate a synonym (paragraph clue + same part of speech).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a search method.\n\nActivity 2 (16 minutes):\n- Strategy: Participatory learning\n- Teacher: Find the words. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: find words for: a change, b worrying (para 1), c related to the body, d sudden increase, e related to the mind, f small round marks on the skin, g feeling of safety, h disagreement.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: eight word pairs.\n\nActivity 3 (10 minutes):\n- Strategy: Discovery learning\n- Teacher: Apply. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: use two of the words in new sentences.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: two sentences.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Check. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare with another pair.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a corrected list.\n\nPeriod 5:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: list what people say about teenagers.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Time to Talk. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss to what extent the six stereotype statements are true of Omani teenagers and add others.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes with reasons.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Paragraph first draft. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: write a first draft: 'The stereotype is partly true because…'.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a first-draft paragraph.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Feedback. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: swap drafts and give feedback.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a peer comment."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Choose the meaning of 'adolescence': the period between childhood and adulthood or the training period for a new job?\nAnswer: The period between childhood and adulthood.\nQ2 (Expected level): What do parents complain about, according to the introduction?\nAnswer: Teenage mood swings.\nQ3 (Advanced level): How can peer pressure be a problem for teenagers?\nAnswer: It can lead teenagers into bad habits.\n\nPeriod 2:\nQ1 (Support level): Which paragraph deals with physical changes?\nAnswer: Paragraph 2.\nQ2 (Expected level): Which paragraph deals with relationships with family?\nAnswer: Paragraph 4.\nQ3 (Advanced level): How does paragraph 3 differ from paragraph 2?\nAnswer: Paragraph 2 is about physical changes (growth spurt, puberty); paragraph 3 is about mental changes (how teenagers see themselves).\n\nPeriod 3:\nQ1 (Support level): What is acne?\nAnswer: Ugly red spots that appear on the face or neck in the teenage years.\nQ2 (Expected level): How is the growth spurt different for girls and boys?\nAnswer: Girls begin earlier (as young as 10); boys' growth spurt occurs between 12 and 17.\nQ3 (Advanced level): How can a teenager's friends cause family conflict?\nAnswer: If he regards his friends as more important than his family.\n\nPeriod 4:\nQ1 (Support level): Which word in paragraph 2 means 'related to the body'?\nAnswer: physical.\nQ2 (Expected level): Which word in paragraph 3 means 'related to the mind'?\nAnswer: mental.\nQ3 (Advanced level): Find a word in paragraph 4 that means 'disagreement' and use it in a sentence.\nAnswer: conflict – e.g. A conflict started between the brothers.\n\nPeriod 5:\nQ1 (Support level): Name one idea from the teenage stereotype.\nAnswer: e.g. selfish and lazy / has mood swings / very untidy.\nQ2 (Expected level): Say whether you agree with 'Teenagers spend too much time in bed' and why.\nAnswer: Open answer with a reason.\nQ3 (Advanced level): Why is a stereotype not always true?\nAnswer: It describes a group as if everyone were the same; individuals differ."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Which word means 'ugly red spots on the face'?\nAnswer: acne.\nQ2 (Expected level): What do teens complain about?\nAnswer: That parents are suspicious and critical.\nQ3 (Advanced level): What question does the introduction ask about young Omanis?\nAnswer: Whether they are in danger of forgetting their own culture because of Western media and the Internet.\n\nPeriod 2:\nQ1 (Support level): Which paragraph describes the nature of adolescence?\nAnswer: Paragraph 1.\nQ2 (Expected level): What is the main idea of paragraph 3?\nAnswer: Hormonal changes cause mental changes – teenagers become self-conscious and easily embarrassed.\nQ3 (Advanced level): Write a one-sentence topic sentence for paragraph 4.\nAnswer: e.g. Teenagers want independence but still need the security of their families.\n\nPeriod 3:\nQ1 (Support level): How old are adolescents, approximately?\nAnswer: From about thirteen to nineteen.\nQ2 (Expected level): Why do teenagers become self-conscious?\nAnswer: They think everyone is looking at them and judging them.\nQ3 (Advanced level): Do you agree that adolescence can be both exciting and stressful? Explain.\nAnswer: Open answer with a reason from the text.\n\nPeriod 4:\nQ1 (Support level): Which word means 'a feeling of safety'?\nAnswer: security.\nQ2 (Expected level): What is the word for 'a sudden increase' in weight and height?\nAnswer: growth spurt.\nQ3 (Advanced level): Replace 'change' with a word from the text in: 'Adolescence is a time of change.'\nAnswer: Adolescence is a time of transition.\n\nPeriod 5:\nQ1 (Support level): What is a stereotype?\nAnswer: A fixed idea about what a group of people is like.\nQ2 (Expected level): Give one example of a stereotype about students.\nAnswer: Open answer.\nQ3 (Advanced level): Write four sentences giving your opinion on the stereotype.\nAnswer: Open answer; opinion, reason, example, conclusion."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents read CB p. 18 'Adolescence' once and note three words they do not know.\n\nPeriod 2:\nStudents list the topic sentences of paragraphs 1–4.\n\nPeriod 3:\nStudents complete WB p. 16 Activity 1 at home.\n\nPeriod 4:\nStudents add the synonyms to their vocabulary notebooks.\n\nPeriod 5:\nStudents write the final draft and attach it to the first draft in the portfolio. WB p. 17."]]}, {"label": "Theme 2 - Unit 2: Teens and Adults", "periods": [{"focus": "Teens and parents: discussion questions (CB p. 20, Activity 1)", "week": "Week 5: 4/10 - 8/10", "num": 30, "fields": [[1, "Learning Outcomes", "1. Discuss how relationships with parents change in the teenage years\n2. Give reasons why parents and teenagers find communication hard"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. relationship\n2. communicate\n3. older brothers and sisters\n4. argue\n5. trust\n6. rules"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What is one rule at home that you would like to change?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share one rule they would like to change.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a list of rules.\n\nActivity 2 (18 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss a how your relationship with parents has changed, b why communication is difficult, c whether older siblings make things easier.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Report back. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: spokespersons share and the class compares.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class summary.\n\nActivity 4 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: one idea for better communication.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: an exit sentence."], [8, "Formative Assessment", "Q1 (Support level): Name one reason teens and parents do not understand each other.\nAnswer: e.g. different interests, rules, little time to talk.\nQ2 (Expected level): Give one way your relationship with your parents has changed.\nAnswer: Open answer.\nQ3 (Advanced level): Do older brothers and sisters make it easier for a teen? Explain.\nAnswer: Open answer with a reason."], [9, "Summative Assessment", "Q1 (Support level): Complete: I talk to my parents about ______.\nAnswer: Open answer.\nQ2 (Expected level): Give two ways to improve communication between teens and parents.\nAnswer: e.g. listen without interrupting; talk calmly.\nQ3 (Advanced level): Write three sentences about a problem between parents and teens and a possible solution.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students prepare one question they would like to ask their parents."]]}, {"focus": "Reading the dialogue between Mr Hamed and Nasser (CB p. 20, Activity 2)", "week": "Week 6: 11/10 - 15/10", "num": 31, "fields": [[1, "Learning Outcomes", "1. Understand a dialogue about a teenager's behaviour\n2. Identify examples of past tense forms in the dialogue"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. dialogue\n2. falling asleep\n3. snoring\n4. suspiciously\n5. straightaway\n6. chatting online"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Have you ever fallen asleep in class? Why?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Read aloud with expression. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: reads the first lines aloud with tone and gesture and explains 'suspiciously' and 'straightaway'.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: an expressive model reading.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Read in pairs. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the dialogue in pairs, then answer: Why was Nasser tired? What time did he really go to sleep?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two correct answers.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Role-play. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: act out the dialogue and change one detail.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a changed dialogue.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Reflect. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: say what Mr Hamed advised.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a one-sentence advice."], [8, "Formative Assessment", "Q1 (Support level): What time did Nasser really go to sleep?\nAnswer: About three o'clock (half past two, no, three).\nQ2 (Expected level): Why was Nasser falling asleep in class?\nAnswer: He was chatting on the Internet all night.\nQ3 (Advanced level): What advice does Mr Hamed give Nasser and why?\nAnswer: He should get more sleep because he has exams soon."], [9, "Summative Assessment", "Q1 (Support level): What did Nasser say first about the time he went to bed?\nAnswer: Ten o'clock.\nQ2 (Expected level): How did Mr Hamed show he did not believe Nasser?\nAnswer: He asked suspiciously whether he went to sleep straightaway and asked what time he really slept.\nQ3 (Advanced level): What would you say to Nasser? Give two pieces of advice.\nAnswer: Open answer, e.g. switch off the computer by 10; do homework earlier."], [10, "Notes within the Weekly Study Plan", "Students underline all the past-tense verbs in the dialogue."]]}, {"focus": "Grammar Recall: past simple and past continuous (CB p. 21)", "week": "Week 6: 11/10 - 15/10", "num": 32, "fields": [[1, "Learning Outcomes", "1. State the uses of the past simple and past continuous\n2. Match sentences to their uses"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Analyze"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. past simple\n2. past continuous\n3. completed action\n4. ongoing action\n5. interrupted action\n6. when\n7. while"], [6, "Warm-up / Introduction / Prior Learning", "Writes: 'I was doing my homework when my friend knocked on the door.' and asks which action was longer."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the pattern. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study sentences 1–3: I was doing… when my friend knocked / Oman won the Gulf Cup in March 2009 / She was wearing a pink dress.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a table of forms and uses.\n\nActivity 2 (14 minutes):\n- Strategy: Discovery learning\n- Teacher: Match sentences to uses. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: match: a completed action in the past, b an ongoing activity in the past, c something happening when another action happened.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: three matched pairs.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Find in the dialogue. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: find examples of both tenses in the Mr Hamed–Nasser dialogue (e.g. You were falling asleep… / What time did you go to bed?).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: five examples sorted by tense.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: State the rule. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: explain the rule to a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a spoken rule."], [8, "Formative Assessment", "Q1 (Support level): Which tense: 'Oman won the Gulf Cup in March 2009'?\nAnswer: Past simple – a completed action.\nQ2 (Expected level): Which tense: 'She was wearing a lovely pink dress'? What does it describe?\nAnswer: Past continuous – an ongoing activity in the past.\nQ3 (Advanced level): Explain the two tenses in: 'I was doing my homework when my friend knocked on the door.'\nAnswer: Past continuous 'was doing' = longer action in progress; past simple 'knocked' = shorter action that interrupted it."], [9, "Summative Assessment", "Q1 (Support level): Choose: At 4 o'clock yesterday I (drank / was drinking) coffee.\nAnswer: was drinking.\nQ2 (Expected level): Choose: When the phone (rang / was ringing), I answered it.\nAnswer: rang.\nQ3 (Advanced level): Write one sentence with 'was/were … when …'.\nAnswer: Open answer, e.g. We were having dinner when the lights went out."], [10, "Notes within the Weekly Study Plan", "Students write a short paragraph (5 sentences) about last weekend using both tenses."]]}, {"focus": "Choosing the best verb form (CB p. 21, Activity 2)", "week": "Week 6: 11/10 - 15/10", "num": 33, "fields": [[1, "Learning Outcomes", "1. Choose the correct past form of the verb in sentences\n2. Explain why a form is correct"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Analyze"], [3, "Strategies", "1. Modeling\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. past simple\n2. past continuous\n3. power cut\n4. experience\n5. abroad\n6. fall asleep"], [6, "Warm-up / Introduction / Prior Learning", "Reads: 'We ___ dinner when there was a power cut.' and asks for the verb."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling choice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models choosing between had and were having by looking for a time clue and 'when'.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a decision strategy.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Sentences a–e. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: choose the best form: a were having/had, b wrote/was writing, c experienced/was experiencing, d were you doing/did you do and was drinking/drank, e fell/was falling.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: five correct answers.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Check with partner. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: explain choices to a partner.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: corrections.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Own sentences. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write two original sentences.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: two sentences."], [8, "Formative Assessment", "Q1 (Support level): Choose: J.K. Rowling taught English before she (wrote / was writing) the Harry Potter books.\nAnswer: wrote.\nQ2 (Expected level): Choose: What (were you doing / did you do) at four o'clock yesterday afternoon? I was drinking coffee.\nAnswer: were you doing.\nQ3 (Advanced level): Explain why 'The film was so boring that I almost fell asleep' uses past simple.\nAnswer: 'fell' is a completed (single) action; 'was falling' would suggest a continuing action."], [9, "Summative Assessment", "Q1 (Support level): Choose: We (were having / had) dinner when there was a power cut.\nAnswer: were having.\nQ2 (Expected level): Choose: When I first lived abroad, I (experienced / was experiencing) many problems.\nAnswer: experienced.\nQ3 (Advanced level): Write two sentences: one with 'when' + past simple and one with 'while' + past continuous.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students correct 5 sentences prepared by the teacher."]]}, {"focus": "Activate Your English: role play – parents and teens; WB pp. 18–19 and Grammar Practice (WB p. 65)", "week": "Week 6: 11/10 - 15/10", "num": 34, "fields": [[1, "Learning Outcomes", "1. Perform a role play using past simple and past continuous accurately\n2. Evaluate how well a partner solves a problem"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "1. Game-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "1. role play\n2. parent\n3. teenager\n4. agreement\n5. point of view\n6. behaviour"], [6, "Warm-up / Introduction / Prior Learning", "Reviews one-minute 'what were you doing at…?' pair questions."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: Prepare roles. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: choose a topic from the list (mobile phone, Internet, a car, a new friend, homework, choice of career) and plan arguments.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a short role plan.\n\nActivity 2 (14 minutes):\n- Strategy: Game-based learning\n- Teacher: Role-play game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: perform the parent–teen role play, change roles, and reach an agreement; the class scores accuracy of tenses.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: two role plays with scores.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Written practice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: complete WB pp. 18–19 and Grammar Practice (WB p. 65) in groups.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: completed tasks.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Feedback. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give one positive comment and one tense correction per pair.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a feedback note."], [8, "Formative Assessment", "Q1 (Support level): Complete: Yesterday I ______ (watch) TV when my phone ______ (ring).\nAnswer: was watching; rang.\nQ2 (Expected level): Choose the best form: She (was cooking / cooked) when the guests arrived.\nAnswer: was cooking.\nQ3 (Advanced level): Make two sentences about a quarrel with a parent using past simple and past continuous.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): Which tense for a completed action: past simple or past continuous?\nAnswer: Past simple.\nQ2 (Expected level): Correct: 'I was seeing a film yesterday.'\nAnswer: I saw a film yesterday.\nQ3 (Advanced level): Write a short dialogue (4 lines) between a parent and a teenager about homework.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finish any WB tasks and check with the key."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Discuss how relationships with parents change in the teenage years\n2. Give reasons why parents and teenagers find communication hard\n\nPeriod 2:\n1. Understand a dialogue about a teenager's behaviour\n2. Identify examples of past tense forms in the dialogue\n\nPeriod 3:\n1. State the uses of the past simple and past continuous\n2. Match sentences to their uses\n\nPeriod 4:\n1. Choose the correct past form of the verb in sentences\n2. Explain why a form is correct\n\nPeriod 5:\n1. Perform a role play using past simple and past continuous accurately\n2. Evaluate how well a partner solves a problem"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Understand\nOutcome 2: Analyze\n\nPeriod 2:\nOutcome 1: Understand\nOutcome 2: Analyze\n\nPeriod 3:\nOutcome 1: Understand\nOutcome 2: Analyze\n\nPeriod 4:\nOutcome 1: Apply\nOutcome 2: Analyze\n\nPeriod 5:\nOutcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "Period 1:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 2:\n1. Modeling\n2. Cooperative learning\n\nPeriod 3:\n1. Discovery learning\n2. Participatory learning\n\nPeriod 4:\n1. Modeling\n2. Self-learning\n\nPeriod 5:\n1. Game-based learning\n2. Cooperative learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 3:\n1. Book\n2. Traditional board\n3. Pens\n4. Smart board\n\nPeriod 4:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 5:\n1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "Period 1:\n1. relationship\n2. communicate\n3. older brothers and sisters\n4. argue\n5. trust\n6. rules\n\nPeriod 2:\n1. dialogue\n2. falling asleep\n3. snoring\n4. suspiciously\n5. straightaway\n6. chatting online\n\nPeriod 3:\n1. past simple\n2. past continuous\n3. completed action\n4. ongoing action\n5. interrupted action\n6. when\n7. while\n\nPeriod 4:\n1. past simple\n2. past continuous\n3. power cut\n4. experience\n5. abroad\n6. fall asleep\n\nPeriod 5:\n1. role play\n2. parent\n3. teenager\n4. agreement\n5. point of view\n6. behaviour"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'What is one rule at home that you would like to change?'\n\nPeriod 2:\nAsks: 'Have you ever fallen asleep in class? Why?'\n\nPeriod 3:\nWrites: 'I was doing my homework when my friend knocked on the door.' and asks which action was longer.\n\nPeriod 4:\nReads: 'We ___ dinner when there was a power cut.' and asks for the verb.\n\nPeriod 5:\nReviews one-minute 'what were you doing at…?' pair questions."], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share one rule they would like to change.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a list of rules.\n\nActivity 2 (18 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss a how your relationship with parents has changed, b why communication is difficult, c whether older siblings make things easier.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Report back. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: spokespersons share and the class compares.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class summary.\n\nActivity 4 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: one idea for better communication.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: an exit sentence.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Read aloud with expression. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: reads the first lines aloud with tone and gesture and explains 'suspiciously' and 'straightaway'.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: an expressive model reading.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Read in pairs. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the dialogue in pairs, then answer: Why was Nasser tired? What time did he really go to sleep?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two correct answers.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Role-play. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: act out the dialogue and change one detail.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a changed dialogue.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Reflect. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: say what Mr Hamed advised.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a one-sentence advice.\n\nPeriod 3:\nActivity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the pattern. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study sentences 1–3: I was doing… when my friend knocked / Oman won the Gulf Cup in March 2009 / She was wearing a pink dress.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a table of forms and uses.\n\nActivity 2 (14 minutes):\n- Strategy: Discovery learning\n- Teacher: Match sentences to uses. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: match: a completed action in the past, b an ongoing activity in the past, c something happening when another action happened.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: three matched pairs.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Find in the dialogue. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: find examples of both tenses in the Mr Hamed–Nasser dialogue (e.g. You were falling asleep… / What time did you go to bed?).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: five examples sorted by tense.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: State the rule. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: explain the rule to a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a spoken rule.\n\nPeriod 4:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling choice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models choosing between had and were having by looking for a time clue and 'when'.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a decision strategy.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Sentences a–e. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: choose the best form: a were having/had, b wrote/was writing, c experienced/was experiencing, d were you doing/did you do and was drinking/drank, e fell/was falling.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: five correct answers.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Check with partner. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: explain choices to a partner.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: corrections.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Own sentences. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write two original sentences.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: two sentences.\n\nPeriod 5:\nActivity 1 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: Prepare roles. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: choose a topic from the list (mobile phone, Internet, a car, a new friend, homework, choice of career) and plan arguments.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a short role plan.\n\nActivity 2 (14 minutes):\n- Strategy: Game-based learning\n- Teacher: Role-play game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: perform the parent–teen role play, change roles, and reach an agreement; the class scores accuracy of tenses.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: two role plays with scores.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Written practice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: complete WB pp. 18–19 and Grammar Practice (WB p. 65) in groups.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: completed tasks.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Feedback. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give one positive comment and one tense correction per pair.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a feedback note."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Name one reason teens and parents do not understand each other.\nAnswer: e.g. different interests, rules, little time to talk.\nQ2 (Expected level): Give one way your relationship with your parents has changed.\nAnswer: Open answer.\nQ3 (Advanced level): Do older brothers and sisters make it easier for a teen? Explain.\nAnswer: Open answer with a reason.\n\nPeriod 2:\nQ1 (Support level): What time did Nasser really go to sleep?\nAnswer: About three o'clock (half past two, no, three).\nQ2 (Expected level): Why was Nasser falling asleep in class?\nAnswer: He was chatting on the Internet all night.\nQ3 (Advanced level): What advice does Mr Hamed give Nasser and why?\nAnswer: He should get more sleep because he has exams soon.\n\nPeriod 3:\nQ1 (Support level): Which tense: 'Oman won the Gulf Cup in March 2009'?\nAnswer: Past simple – a completed action.\nQ2 (Expected level): Which tense: 'She was wearing a lovely pink dress'? What does it describe?\nAnswer: Past continuous – an ongoing activity in the past.\nQ3 (Advanced level): Explain the two tenses in: 'I was doing my homework when my friend knocked on the door.'\nAnswer: Past continuous 'was doing' = longer action in progress; past simple 'knocked' = shorter action that interrupted it.\n\nPeriod 4:\nQ1 (Support level): Choose: J.K. Rowling taught English before she (wrote / was writing) the Harry Potter books.\nAnswer: wrote.\nQ2 (Expected level): Choose: What (were you doing / did you do) at four o'clock yesterday afternoon? I was drinking coffee.\nAnswer: were you doing.\nQ3 (Advanced level): Explain why 'The film was so boring that I almost fell asleep' uses past simple.\nAnswer: 'fell' is a completed (single) action; 'was falling' would suggest a continuing action.\n\nPeriod 5:\nQ1 (Support level): Complete: Yesterday I ______ (watch) TV when my phone ______ (ring).\nAnswer: was watching; rang.\nQ2 (Expected level): Choose the best form: She (was cooking / cooked) when the guests arrived.\nAnswer: was cooking.\nQ3 (Advanced level): Make two sentences about a quarrel with a parent using past simple and past continuous.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Complete: I talk to my parents about ______.\nAnswer: Open answer.\nQ2 (Expected level): Give two ways to improve communication between teens and parents.\nAnswer: e.g. listen without interrupting; talk calmly.\nQ3 (Advanced level): Write three sentences about a problem between parents and teens and a possible solution.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): What did Nasser say first about the time he went to bed?\nAnswer: Ten o'clock.\nQ2 (Expected level): How did Mr Hamed show he did not believe Nasser?\nAnswer: He asked suspiciously whether he went to sleep straightaway and asked what time he really slept.\nQ3 (Advanced level): What would you say to Nasser? Give two pieces of advice.\nAnswer: Open answer, e.g. switch off the computer by 10; do homework earlier.\n\nPeriod 3:\nQ1 (Support level): Choose: At 4 o'clock yesterday I (drank / was drinking) coffee.\nAnswer: was drinking.\nQ2 (Expected level): Choose: When the phone (rang / was ringing), I answered it.\nAnswer: rang.\nQ3 (Advanced level): Write one sentence with 'was/were … when …'.\nAnswer: Open answer, e.g. We were having dinner when the lights went out.\n\nPeriod 4:\nQ1 (Support level): Choose: We (were having / had) dinner when there was a power cut.\nAnswer: were having.\nQ2 (Expected level): Choose: When I first lived abroad, I (experienced / was experiencing) many problems.\nAnswer: experienced.\nQ3 (Advanced level): Write two sentences: one with 'when' + past simple and one with 'while' + past continuous.\nAnswer: Open answer.\n\nPeriod 5:\nQ1 (Support level): Which tense for a completed action: past simple or past continuous?\nAnswer: Past simple.\nQ2 (Expected level): Correct: 'I was seeing a film yesterday.'\nAnswer: I saw a film yesterday.\nQ3 (Advanced level): Write a short dialogue (4 lines) between a parent and a teenager about homework.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents prepare one question they would like to ask their parents.\n\nPeriod 2:\nStudents underline all the past-tense verbs in the dialogue.\n\nPeriod 3:\nStudents write a short paragraph (5 sentences) about last weekend using both tenses.\n\nPeriod 4:\nStudents correct 5 sentences prepared by the teacher.\n\nPeriod 5:\nStudents finish any WB tasks and check with the key."]]}, {"label": "Theme 2 - Unit 3: Teenage Friendships", "periods": [{"focus": "Friendship questions and adjectives for qualities (CB p. 22, Activity 1; WB p. 20)", "week": "Week 6: 11/10 - 15/10", "num": 35, "fields": [[1, "Learning Outcomes", "1. Discuss common teenage questions about friendship\n2. Use adjectives that describe personal qualities"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Apply"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook p. 20)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. friendship\n2. loyal\n3. dependable\n4. honest\n5. cheerful\n6. similar interests\n7. circle of friends"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What do you look for in a friend?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share one quality of a good friend.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Friendship questions. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss the six common teenage questions (e.g. 'My parents don't like my friends. What can I do?') and add one of their own.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group advice notes.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Adjective sort. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: sort the personal-quality adjectives from WB p. 20 into positive and negative.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a two-column word chart.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: use two adjectives to describe a friend.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: two sentences."], [8, "Formative Assessment", "Q1 (Support level): Name two qualities of a good friend.\nAnswer: e.g. loyal, honest, dependable, cheerful.\nQ2 (Expected level): What can you do if your parents do not like your friends?\nAnswer: Open answer, e.g. talk calmly and invite the friend home.\nQ3 (Advanced level): Which quality is most important in a friend? Why?\nAnswer: Open answer with a reason."], [9, "Summative Assessment", "Q1 (Support level): Complete: A ______ friend always supports you. (loyal / lazy)\nAnswer: loyal.\nQ2 (Expected level): Which adjective means 'someone you can rely on'?\nAnswer: dependable.\nQ3 (Advanced level): Write a sentence describing your best friend using two adjectives.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students list five adjectives for a good friend with meanings."]]}, {"focus": "Listening to an interview with Emily (CB p. 22, Activity 2)", "week": "Week 6: 11/10 - 15/10", "num": 36, "fields": [[1, "Learning Outcomes", "1. Listen to an interview and note answers to five questions\n2. Report the benefits of friendships from other cultures"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Understand"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. interview\n2. qualities\n3. loyal\n4. dependable\n5. honest\n6. customs\n7. international school"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Do you have friends from other countries? What can you learn from them?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Listening model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models reading the five questions first and noting key words in a table before listening.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a note-taking table.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and note. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the interview with Emily and answer questions a–e.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: notes for a–e.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Compare and discuss. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare notes and listen again for disagreements; discuss the benefits of friends from other cultures.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group answers.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Independent summary. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: write two sentences summarising Emily's views.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: two summary sentences."], [8, "Formative Assessment", "Q1 (Support level): Which countries are Emily's closest friends in Oman from?\nAnswer: Lebanon, Afghanistan and the UK.\nQ2 (Expected level): What qualities are important to her in a friend?\nAnswer: Similar interests and personalities, and being loyal, dependable and honest.\nQ3 (Advanced level): What benefits does she mention of having friends from other cultures?\nAnswer: Learning about other cultures and customs in a fun way and trying food from different countries."], [9, "Summative Assessment", "Q1 (Support level): Which school does Emily attend?\nAnswer: An international school in Muscat.\nQ2 (Expected level): Has Emily had difficulties because of her friends from other cultures?\nAnswer: No – only differences in how strict parents are, which she says is not a difficulty.\nQ3 (Advanced level): Would you like friends from other countries? Give two reasons.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students write three questions they would ask a friend from another country."]]}, {"focus": "A letter to a problem page: giving advice (CB p. 23, Activity 3)", "week": "Week 7: 18/10 - 22/10", "num": 37, "fields": [[1, "Learning Outcomes", "1. Suggest reasons for a problem described in a letter\n2. Give advice using suitable phrases"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Create"], [3, "Strategies", "1. Problem-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. problem page\n2. counsellor\n3. lonely\n4. maintain friendships\n5. advice\n6. You should…\n7. A good idea would be to…"], [6, "Warm-up / Introduction / Prior Learning", "Reads the first line of the letter: 'I can't seem to maintain friendships.' and asks how he feels."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: Present the problem. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: reads the letter from 'Lonely' and asks what the problem is.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a problem statement.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Reasons and advice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss possible reasons and prepare advice using You should… / Our advice is that… / A good idea would be to… / We think the best thing for you to do is….\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a written piece of advice.\n\nActivity 3 (14 minutes):\n- Strategy: Problem-based learning\n- Teacher: Present advice. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: a spokesperson presents the group's advice; the class chooses the most helpful advice and justifies.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a ranked list of advice.\n\nActivity 4 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: Reflect. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: say what you would do in his place.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a one-sentence reflection."], [8, "Formative Assessment", "Q1 (Support level): What is the boy's problem?\nAnswer: He cannot maintain friendships; friends lose interest in him.\nQ2 (Expected level): How does he feel and why?\nAnswer: Lonely – he has nobody to share problems with.\nQ3 (Advanced level): Give two pieces of advice using 'You should…'.\nAnswer: Open answer, e.g. You should show interest in others. You should join a club."], [9, "Summative Assessment", "Q1 (Support level): Complete the advice phrase: 'A good idea would be ______ talk to him.'\nAnswer: to.\nQ2 (Expected level): Give one possible reason why the boy loses friends.\nAnswer: e.g. he is not interested enough in the others / he talks only about himself.\nQ3 (Advanced level): Write four lines of advice to 'Lonely'.\nAnswer: Open answer using the advice phrases."], [10, "Notes within the Weekly Study Plan", "Students write advice to a different problem letter of their own invention."]]}, {"focus": "The poem 'Change' by Hilary (CB p. 23, Activity 4)", "week": "Week 7: 18/10 - 22/10", "num": 38, "fields": [[1, "Learning Outcomes", "1. Understand the situation and feelings in a poem about friendship\n2. Evaluate what the writer should do"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Evaluate"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. poem\n2. best friend\n3. hurtful\n4. new friend\n5. rhyme\n6. feelings"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Do you like poems? Have you ever written one?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Discover the situation. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: read the poem silently after the questions (What is the situation? Why is it hurtful? What should Hilary do?) and infer the situation from clues.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a situation statement.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Discuss the poem. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read aloud in pairs and discuss feelings and the cause of hurt.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three feelings identified.\n\nActivity 3 (12 minutes):\n- Strategy: Discovery learning\n- Teacher: What should Hilary do?. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: propose and evaluate solutions.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a ranked solution list.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read a favourite line aloud.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one line and why."], [8, "Formative Assessment", "Q1 (Support level): Who wrote the poem 'Change'?\nAnswer: Hilary (a teenage girl).\nQ2 (Expected level): What is the situation in the poem?\nAnswer: Her best friend now spends time with a new friend, and Hilary feels left out.\nQ3 (Advanced level): What should Hilary do now? Give a reason.\nAnswer: Open answer, e.g. talk to her friend honestly because friendships can change."], [9, "Summative Assessment", "Q1 (Support level): How long have they been best friends?\nAnswer: Since Grade Nine / for a long time.\nQ2 (Expected level): Why won't she come round today?\nAnswer: She cannot pretend to be happy.\nQ3 (Advanced level): Write two lines to Hilary as her friend.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Optional homework: write a short poem (it need not rhyme) for a best friend or someone important to you."]]}, {"focus": "Consolidation: WB pp. 20–21 and listening to four teenagers", "week": "Week 7: 18/10 - 22/10", "num": 39, "fields": [[1, "Learning Outcomes", "1. Complete a chart using information from short listening texts\n2. Apply friendship vocabulary in writing"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Multimedia (audio-visual)\n4. Pens"], [5, "Concepts", "1. best friend\n2. since\n3. secrets\n4. cheerful\n5. dependable\n6. chart"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'How long have you known your best friend?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Predict the information. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the chart headings and say what kind of answers to listen for (time, reason, quality).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a prediction list.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Listen and complete. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: listen to four teenagers on WB p. 21 and complete the chart alone.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a completed chart.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check and WB practice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare charts and complete WB pp. 20–21.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected answers.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: mark own work.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-score."], [8, "Formative Assessment", "Q1 (Support level): How long has Katie known her best friend?\nAnswer: Since they were four.\nQ2 (Expected level): Why is Ali important to his friend?\nAnswer: They do lots of things together, like sports.\nQ3 (Advanced level): Which quality does Ali's friend value and why?\nAnswer: He is dependable (always)."], [9, "Summative Assessment", "Q1 (Support level): Which adjective describes Katie: cheerful or dependable?\nAnswer: cheerful.\nQ2 (Expected level): Write a chart entry for Katie: time / reason / quality.\nAnswer: Since four / can tell her secrets / cheerful.\nQ3 (Advanced level): Write three sentences about your best friend using time, reason and quality.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 20–21."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Discuss common teenage questions about friendship\n2. Use adjectives that describe personal qualities\n\nPeriod 2:\n1. Listen to an interview and note answers to five questions\n2. Report the benefits of friendships from other cultures\n\nPeriod 3:\n1. Suggest reasons for a problem described in a letter\n2. Give advice using suitable phrases\n\nPeriod 4:\n1. Understand the situation and feelings in a poem about friendship\n2. Evaluate what the writer should do\n\nPeriod 5:\n1. Complete a chart using information from short listening texts\n2. Apply friendship vocabulary in writing"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Understand\nOutcome 2: Apply\n\nPeriod 2:\nOutcome 1: Analyze\nOutcome 2: Understand\n\nPeriod 3:\nOutcome 1: Analyze\nOutcome 2: Create\n\nPeriod 4:\nOutcome 1: Understand\nOutcome 2: Evaluate\n\nPeriod 5:\nOutcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "Period 1:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 2:\n1. Modeling\n2. Cooperative learning\n\nPeriod 3:\n1. Problem-based learning\n2. Cooperative learning\n\nPeriod 4:\n1. Discovery learning\n2. Participatory learning\n\nPeriod 5:\n1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Other (Workbook p. 20)\n3. Traditional board\n4. Pens\n\nPeriod 2:\n1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens\n\nPeriod 3:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 4:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 5:\n1. Book\n2. Other (Workbook)\n3. Multimedia (audio-visual)\n4. Pens"], [5, "Concepts", "Period 1:\n1. friendship\n2. loyal\n3. dependable\n4. honest\n5. cheerful\n6. similar interests\n7. circle of friends\n\nPeriod 2:\n1. interview\n2. qualities\n3. loyal\n4. dependable\n5. honest\n6. customs\n7. international school\n\nPeriod 3:\n1. problem page\n2. counsellor\n3. lonely\n4. maintain friendships\n5. advice\n6. You should…\n7. A good idea would be to…\n\nPeriod 4:\n1. poem\n2. best friend\n3. hurtful\n4. new friend\n5. rhyme\n6. feelings\n\nPeriod 5:\n1. best friend\n2. since\n3. secrets\n4. cheerful\n5. dependable\n6. chart"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'What do you look for in a friend?'\n\nPeriod 2:\nAsks: 'Do you have friends from other countries? What can you learn from them?'\n\nPeriod 3:\nReads the first line of the letter: 'I can't seem to maintain friendships.' and asks how he feels.\n\nPeriod 4:\nAsks: 'Do you like poems? Have you ever written one?'\n\nPeriod 5:\nAsks: 'How long have you known your best friend?'"], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share one quality of a good friend.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Friendship questions. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss the six common teenage questions (e.g. 'My parents don't like my friends. What can I do?') and add one of their own.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group advice notes.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Adjective sort. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: sort the personal-quality adjectives from WB p. 20 into positive and negative.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a two-column word chart.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: use two adjectives to describe a friend.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: two sentences.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Listening model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models reading the five questions first and noting key words in a table before listening.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a note-taking table.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and note. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the interview with Emily and answer questions a–e.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: notes for a–e.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Compare and discuss. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare notes and listen again for disagreements; discuss the benefits of friends from other cultures.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group answers.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Independent summary. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: write two sentences summarising Emily's views.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: two summary sentences.\n\nPeriod 3:\nActivity 1 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: Present the problem. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: reads the letter from 'Lonely' and asks what the problem is.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a problem statement.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Reasons and advice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss possible reasons and prepare advice using You should… / Our advice is that… / A good idea would be to… / We think the best thing for you to do is….\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a written piece of advice.\n\nActivity 3 (14 minutes):\n- Strategy: Problem-based learning\n- Teacher: Present advice. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: a spokesperson presents the group's advice; the class chooses the most helpful advice and justifies.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a ranked list of advice.\n\nActivity 4 (6 minutes):\n- Strategy: Problem-based learning\n- Teacher: Reflect. Poses a problem, guides students to analyse it, suggest solutions and justify the best one. Task: say what you would do in his place.\n- Student: Analyse the problem, propose and compare solutions and justify a final answer. Product: a one-sentence reflection.\n\nPeriod 4:\nActivity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Discover the situation. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: read the poem silently after the questions (What is the situation? Why is it hurtful? What should Hilary do?) and infer the situation from clues.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a situation statement.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Discuss the poem. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read aloud in pairs and discuss feelings and the cause of hurt.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three feelings identified.\n\nActivity 3 (12 minutes):\n- Strategy: Discovery learning\n- Teacher: What should Hilary do?. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: propose and evaluate solutions.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a ranked solution list.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: read a favourite line aloud.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one line and why.\n\nPeriod 5:\nActivity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Predict the information. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the chart headings and say what kind of answers to listen for (time, reason, quality).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a prediction list.\n\nActivity 2 (16 minutes):\n- Strategy: Self-learning\n- Teacher: Listen and complete. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: listen to four teenagers on WB p. 21 and complete the chart alone.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a completed chart.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check and WB practice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare charts and complete WB pp. 20–21.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected answers.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: mark own work.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-score."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Name two qualities of a good friend.\nAnswer: e.g. loyal, honest, dependable, cheerful.\nQ2 (Expected level): What can you do if your parents do not like your friends?\nAnswer: Open answer, e.g. talk calmly and invite the friend home.\nQ3 (Advanced level): Which quality is most important in a friend? Why?\nAnswer: Open answer with a reason.\n\nPeriod 2:\nQ1 (Support level): Which countries are Emily's closest friends in Oman from?\nAnswer: Lebanon, Afghanistan and the UK.\nQ2 (Expected level): What qualities are important to her in a friend?\nAnswer: Similar interests and personalities, and being loyal, dependable and honest.\nQ3 (Advanced level): What benefits does she mention of having friends from other cultures?\nAnswer: Learning about other cultures and customs in a fun way and trying food from different countries.\n\nPeriod 3:\nQ1 (Support level): What is the boy's problem?\nAnswer: He cannot maintain friendships; friends lose interest in him.\nQ2 (Expected level): How does he feel and why?\nAnswer: Lonely – he has nobody to share problems with.\nQ3 (Advanced level): Give two pieces of advice using 'You should…'.\nAnswer: Open answer, e.g. You should show interest in others. You should join a club.\n\nPeriod 4:\nQ1 (Support level): Who wrote the poem 'Change'?\nAnswer: Hilary (a teenage girl).\nQ2 (Expected level): What is the situation in the poem?\nAnswer: Her best friend now spends time with a new friend, and Hilary feels left out.\nQ3 (Advanced level): What should Hilary do now? Give a reason.\nAnswer: Open answer, e.g. talk to her friend honestly because friendships can change.\n\nPeriod 5:\nQ1 (Support level): How long has Katie known her best friend?\nAnswer: Since they were four.\nQ2 (Expected level): Why is Ali important to his friend?\nAnswer: They do lots of things together, like sports.\nQ3 (Advanced level): Which quality does Ali's friend value and why?\nAnswer: He is dependable (always)."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Complete: A ______ friend always supports you. (loyal / lazy)\nAnswer: loyal.\nQ2 (Expected level): Which adjective means 'someone you can rely on'?\nAnswer: dependable.\nQ3 (Advanced level): Write a sentence describing your best friend using two adjectives.\nAnswer: Open answer.\n\nPeriod 2:\nQ1 (Support level): Which school does Emily attend?\nAnswer: An international school in Muscat.\nQ2 (Expected level): Has Emily had difficulties because of her friends from other cultures?\nAnswer: No – only differences in how strict parents are, which she says is not a difficulty.\nQ3 (Advanced level): Would you like friends from other countries? Give two reasons.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Complete the advice phrase: 'A
