const DATA=[{"label": "Theme 1 - Unit 1: Body Language", "periods": [{"focus": "Introducing Theme 1: ways of communicating (CB p. 1)", "week": "Week 1: 6/9 - 10/9", "num": 1, "fields": [[1, "Learning Outcomes", "1. Name the communication tools shown in the photos and in bold in the text on page 1\n2. Explain how communication tools have moved human development forward"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Remember\nOutcome 2: Understand"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Illustrative picture\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. communication\n2. body language\n3. speech\n4. wireless system\n5. laptop computer\n6. blog\n7. text messaging\n8. social networking site"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'How did people send a message 100 years ago? How do you send one today?' and lists the answers on the board."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up discussion. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: elicit old and new ways of communicating and list them on the board.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class list of communication tools.\n\nActivity 2 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Bold words and photos. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the text on CB p. 1, match each bold word or phrase to the photos and check meanings in dictionaries.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a vocabulary list with meanings copied into exercise books.\n\nActivity 3 (15 using ideas from the text, e.g. In the past people used newspapers and the telephone; today they use blogs and social networking sites."], [10, "Notes within the Weekly Study Plan", "Students revise the page 1 words and read CB p. 2 (Unit 1 reading text) once at home."]]}, {"focus": "Gestures and skimming for the best title (CB p. 2, Activities 1–2)", "week": "Week 1: 6/9 - 10/9", "num": 2, "fields": [[1, "Learning Outcomes", "1. Match common gestures to the expressions they express\n2. Skim a text to choose the most appropriate title and justify the choice"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Analyze"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Illustrative picture\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. gesture\n2. skim\n3. title\n4. main idea\n5. non-verbal clue"], [6, "Warm-up / Introduction / Prior Learning", "Teacher performs a gesture (a shrug) and asks 'What am I saying?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Gestures match. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: match the five speech bubbles (Don't say a word! / I have no idea. / Not maths homework again! / Eeew! / For me? How lovely!) to photos a–e and compare common Omani gestures.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: matched pairs and one Omani gesture.\n\nActivity 2 (12 minutes):\n- Strategy: Modeling\n- Teacher: Skimming model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: thinks aloud while skimming 'Understanding Body Language': reads the three titles, the first and last lines, chooses a title and gives a reason.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a skimming checklist (title, first lines, key words).\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Choose the title. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: skim the text in two minutes, choose among a Understanding Body Language / b Police Officers Are Doing a Good Job / c Hidden Messages and justify the choice.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a group decision with two reasons.\n\nActivity 4 (8 minutes):\n- Strategy: Modeling\n- Teacher: Independent skim. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: apply the checklist to a new short paragraph from the Workbook or the board.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a title for the new paragraph."], [8, "Formative Assessment", "Q1 (Support level): Which title is best for the text: a Understanding Body Language, b Police Officers Are Doing a Good Job or c Hidden Messages?\nAnswer: a Understanding Body Language.\nQ2 (Expected level): Why is title b not suitable?\nAnswer: Police officers are mentioned only briefly; the text is about body language in general.\nQ3 (Advanced level): Why is title c less suitable than title a?\nAnswer: 'Hidden Messages' does not describe the real topic; the text explains what body language is and how it is used."], [9, "Summative Assessment", "Q1 (Support level): What does skimming mean?\nAnswer: Reading quickly to get the general idea of a text.\nQ2 (Expected level): Name two things you look at when you skim a text.\nAnswer: The title, the first (and last) lines of paragraphs, key words.\nQ3 (Advanced level): Skim this: 'Rashid walked in slowly, looked at the floor and crossed his arms.' Choose a title and say why: a A Confident Speaker / b A Nervous Visitor.\nAnswer: b A Nervous Visitor – walking slowly, not making eye contact and crossing arms show nervousness."], [10, "Notes within the Weekly Study Plan", "Students read the second paragraph of the text again and underline the jobs mentioned."]]}, {"focus": "Reading in detail: True / False / No Information (CB p. 3, Activity 3; WB p. 2)", "week": "Week 1: 6/9 - 10/9", "num": 3, "fields": [[1, "Learning Outcomes", "1. Decide whether statements about the text are true, false or not given\n2. Correct false statements using information from the text"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Cooperative learning\n2. Modeling"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (Workbook)"], [5, "Concepts", "1. true\n2. false\n3. no information given (NG)\n4. body language\n5. signal\n6. job interview"], [6, "Warm-up / Introduction / Prior Learning", "Teacher reads two statements about the class (one true, one not stated) and asks students to say T, F or NG."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (7 minutes):\n- Strategy: Modeling\n- Teacher: Modelling T/F/NG. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models how to find the sentence that proves or disproves statement a and explains what 'NG' means.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a three-step T/F/NG strategy.\n\nActivity 2 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Statements a–h. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decide T, F or NG for statements a–h, underline the evidence and rewrite the false statements in exercise books.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: answers with evidence and corrected sentences.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Guided then independent practice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: complete WB p. 2 Activity 1 (plan of the text) alone after one guided example.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a completed paragraph plan.\n\nActivity 4 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check and correct. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers across groups and check with the teacher.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a corrected set of answers."], [8, "Formative Assessment", "Q1 (Support level): Statement: 'You can tell when someone is lying by reading their body language.' True, false or NG?\nAnswer: True.\nQ2 (Expected level): Statement: 'Animals use body language too.' True, false or NG? Why?\nAnswer: NG – the text does not mention animals.\nQ3 (Advanced level): Correct the false statement: 'Liars always put their head on one side when they talk to you.'\nAnswer: Someone who is interested in what you say often puts their head on one side; a liar looks down to the left."], [9, "Summative Assessment", "Q1 (Support level): True or false: Police officers and teachers use an understanding of body language in their jobs.\nAnswer: True.\nQ2 (Expected level): Correct: 'All people who work need to understand body language.'\nAnswer: Not everyone who works needs it; many people need it in their jobs (e.g. police officers, teachers, politicians).\nQ3 (Advanced level): Write one T, one F and one NG statement about the text.\nAnswer: Open answer; checked against the text."], [10, "Notes within the Weekly Study Plan", "Students finish WB p. 2 Activity 2 (adding the best final sentence to each paragraph)."]]}, {"focus": "Words with similar meanings and parts of speech (CB p. 3, Activity 4)", "week": "Week 1: 6/9 - 10/9", "num": 4, "fields": [[1, "Learning Outcomes", "1. Identify the part of speech of words from the text\n2. Find words in the text with a similar meaning to given words"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Remember\nOutcome 2: Apply"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)"], [5, "Concepts", "1. noun\n2. verb\n3. adjective\n4. adverb\n5. pronoun\n6. synonym\n7. nervously = anxiously\n8. bored = uninterested"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'anxiously' on the board and asks which part of speech it is and what word in the text means the same."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the rule. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study the example 'anxiously (adv) = nervously' and 'uninterested (adj) = bored' and decide how to find a similar word in a text.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a rule: look for the same part of speech.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Parts of speech. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: identify the part of speech of bodies, gestures, we, send, interested, confused, use, nervously, you and share answers.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: words with their parts of speech in exercise books.\n\nActivity 3 (12 minutes):\n- Strategy: Discovery learning\n- Teacher: Find similar words. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: find words in the text meaning 'moving the body to send a message', 'not interested' and similar items and test the rule.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: three word pairs.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share and check. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare pairs with another pair.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a corrected list."], [8, "Formative Assessment", "Q1 (Support level): What part of speech is 'nervously'?\nAnswer: Adverb.\nQ2 (Expected level): Which word in the text means 'bored' (adjective)?\nAnswer: uninterested.\nQ3 (Advanced level): Find a word in the text similar in meaning to 'anxiously' and say why you look for an adverb.\nAnswer: nervously; 'anxiously' is an adverb, so the similar word must also be an adverb."], [9, "Summative Assessment", "Q1 (Support level): Identify: 'gestures' and 'send'.\nAnswer: gestures – noun; send – verb.\nQ2 (Expected level): Identify the parts of speech: interested, confused, we.\nAnswer: interested – adjective; confused – adjective; we – pronoun.\nQ3 (Advanced level): Write a sentence using 'nervously' and underline the word it describes.\nAnswer: Open answer, e.g. He walked nervously into the room (describes 'walked')."], [10, "Notes within the Weekly Study Plan", "Students make a mini-list of 5 new words from Unit 1 with their parts of speech."]]}, {"focus": "Time to Talk: body language across places and people (CB p. 3; WB p. 3)", "week": "Week 1: 6/9 - 10/9", "num": 5, "fields": [[1, "Learning Outcomes", "1. Discuss whether body language changes according to place and people\n2. Write a short paragraph giving and supporting an opinion"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Create"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (Workbook)"], [5, "Concepts", "1. greet\n2. eye contact\n3. personal space\n4. table manners\n5. opinion\n6. paragraph"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'How do you greet your teacher? Your cousin? A visitor?' and notes differences on the board."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share how different people are greeted at home, school and work.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list of greetings.\n\nActivity 2 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Time to Talk. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss 'Body language changes according to where you are and who you are with' using the four prompts (greeting, distance, body contact, table manners) and prepare a group view.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes with one reason and one example per prompt.\n\nActivity 3 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Paragraph first draft. Forms ted sentences.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Guided then independent practice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: complete WB p. 2 Activity 1 (plan of the text) alone after one guided example.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a completed paragraph plan.\n\nActivity 4 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check and correct. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers across groups and check with the teacher.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a corrected set of answers.\n\nPeriod 4:\nActivity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the rule. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study the example 'anxiously (adv) = nervously' and 'uninterested (adj) = bored' and decide how to find a similar word in a text.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a rule: look for the same part of speech.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Parts of speech. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: identify the part of speech of bodies, gestures, we, send, interested, confused, use, nervously, you and share answers.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: words with their parts of speech in exercise books.\n\nActivity 3 (12 minutes):\n- Strategy: Discovery learning\n- Teacher: Find similar words. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: find words in the text meaning 'moving the body to send a message', 'not interested' and similar items and test the rule.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: three word pairs.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share and check. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare pairs with another pair.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a corrected list.\n\nPeriod 5:\nActivity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share how different people are greeted at home, school and work.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list of greetings.\n\nActivity 2 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Time to Talk. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss 'Body language changes according to where you are and who you are with' using the four prompts (greeting, distance, body contact, table manners) and prepare a group view.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group notes with one reason and one example per prompt.\n\nActivity 3 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Paragraph first draft. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: write a first-draft paragraph from the group notes in class; students swap and give feedback.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a first-draft paragraph for the portfolio.\n\nActivity 4 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Class opinion poll. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each group states agree/disagree and one reason.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class tally."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Name two of the 'new communication technologies' mentioned in the text.\nAnswer: Any two of: the Internet, wireless systems, laptop computers, mobile phones, e-mail.\nQ2 (Expected level): What is 'body language'? Give one example.\nAnswer: Movements, gestures or facial expressions used to send a message, e.g. nodding the head.\nQ3 (Advanced level): Why does the text say communication tools have 'moved human development forward'? Give one reason of your own.\nAnswer: Open answer, e.g. people can share information and meet and interact from every part of the world.\n\nPeriod 2:\nQ1 (Support level): Which title is best for the text: a Understanding Body Language, b Police Officers Are Doing a Good Job or c Hidden Messages?\nAnswer: a Understanding Body Language.\nQ2 (Expected level): Why is title b not suitable?\nAnswer: Police officers are mentioned only briefly; the text is about body language in general.\nQ3 (Advanced level): Why is title c less suitable than title a?\nAnswer: 'Hidden Messages' does not describe the real topic; the text explains what body language is and how it is used.\n\nPeriod 3:\nQ1 (Support level): Statement: 'You can tell when someone is lying by reading their body language.' True, false or NG?\nAnswer: True.\nQ2 (Expected level): Statement: 'Animals use body language too.' True, false or NG? Why?\nAnswer: NG – the text does not mention animals.\nQ3 (Advanced level): Correct the false statement: 'Liars always put their head on one side when they talk to you.'\nAnswer: Someone who is interested in what you say often puts their head on one side; a liar looks down to the left.\n\nPeriod 4:\nQ1 (Support level): What part of speech is 'nervously'?\nAnswer: Adverb.\nQ2 (Expected level): Which word in the text means 'bored' (adjective)?\nAnswer: uninterested.\nQ3 (Advanced level): Find a word in the text similar in meaning to 'anxiously' and say why you look for an adverb.\nAnswer: nervously; 'anxiously' is an adverb, so the similar word must also be an adverb.\n\nPeriod 5:\nQ1 (Support level): Do you agree that body language changes according to where you are? Say yes or no.\nAnswer: Yes/No – any reasoned answer.\nQ2 (Expected level): Give one example of how you greet people differently at home and at school.\nAnswer: Open answer, e.g. I shake hands with a visitor but kiss my uncle's nose.\nQ3 (Advanced level): Which of the four Time to Talk ideas is most important for good table manners? Explain.\nAnswer: Open answer with a reason."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Which is NOT one of the new communication technologies in the text: the Internet, printing or mobile phones?\nAnswer: Printing (it is one of the older tools).\nQ2 (Expected level): Complete: Online blogs, video diaries and ______ mean that people can meet and interact from every part of the world.\nAnswer: text messaging and social networking sites.\nQ3 (Advanced level): Write two sentences comparing how people communicated in the past with how they communicate today.\nAnswer: Open answer using ideas from the text, e.g. In the past people used newspapers and the telephone; today they use blogs and social networking sites.\n\nPeriod 2:\nQ1 (Support level): What does skimming mean?\nAnswer: Reading quickly to get the general idea of a text.\nQ2 (Expected level): Name two things you look at when you skim a text.\nAnswer: The title, the first (and last) lines of paragraphs, key words.\nQ3 (Advanced level): Skim this: 'Rashid walked in slowly, looked at the floor and crossed his arms.' Choose a title and say why: a A Confident Speaker / b A Nervous Visitor.\nAnswer: b A Nervous Visitor – walking slowly, not making eye contact and crossing arms show nervousness.\n\nPeriod 3:\nQ1 (Support level): True or false: Police officers and teachers use an understanding of body language in their jobs.\nAnswer: True.\nQ2 (Expected level): Correct: 'All people who work need to understand body language.'\nAnswer: Not everyone who works needs it; many people need it in their jobs (e.g. police officers, teachers, politicians).\nQ3 (Advanced level): Write one T, one F and one NG statement about the text.\nAnswer: Open answer; checked against the text.\n\nPeriod 4:\nQ1 (Support level): Identify: 'gestures' and 'send'.\nAnswer: gestures – noun; send – verb.\nQ2 (Expected level): Identify the parts of speech: interested, confused, we.\nAnswer: interested – adjective; confused – adjective; we – pronoun.\nQ3 (Advanced level): Write a sentence using 'nervously' and underline the word it describes.\nAnswer: Open answer, e.g. He walked nervously into the room (describes 'walked').\n\nPeriod 5:\nQ1 (Support level): Write one sentence about how close people stand to each other in public.\nAnswer: Open answer.\nQ2 (Expected level): Write two sentences supporting the statement: Body language changes according to who you are with.\nAnswer: Open answer with an example, e.g. we hug friends but shake hands with teachers.\nQ3 (Advanced level): Write a 4-sentence paragraph agreeing or disagreeing with the statement, using one example.\nAnswer: Open answer; includes a topic sentence, an example and a conclusion."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents revise the page 1 words and read CB p. 2 (Unit 1 reading text) once at home.\n\nPeriod 2:\nStudents read the second paragraph of the text again and underline the jobs mentioned.\n\nPeriod 3:\nStudents finish WB p. 2 Activity 2 (adding the best final sentence to each paragraph).\n\nPeriod 4:\nStudents make a mini-list of 5 new words from Unit 1 with their parts of speech.\n\nPeriod 5:\nStudents polish the paragraph into a final draft, attach it to the first draft and place both in the portfolio. WB p. 3."]]}, {"label": "Theme 1 - Unit 2: The Internet", "periods": [{"focus": "Essential items and reading about the Internet (CB p. 4, Activities 1–2)", "week": "Week 1: 6/9 - 10/9", "num": 6, "fields": [[1, "Learning Outcomes", "1. Rank items as essential or non-essential and justify choices\n2. Read a text to answer gist questions about the Internet"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Understand"], [3, "Strategies", "1. Participatory learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. essential\n2. non-essential\n3. Internet\n4. worldwide web\n5. network\n6. e-shopping\n7. blogging\n8. social networking"], [6, "Warm-up / Introduction / Prior Learning", "Holds up a phone, a pencil and a coin: 'Which would you take to a desert island and why?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Essential items. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: write the ten most essential items from the list of fourteen and compare lists with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a personal top-ten list and a similarity count.\n\nActivity 2 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Reading for gist. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read 'The Internet' and answer: a How old is the Internet now? b Which activity is not mentioned: shopping, blogging, e-mailing, social networking?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two answers with evidence from the text.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Quick comprehension. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: answer: Who was Tim Berners-Lee? What is the Internet? What is blogging for?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group answers in full sentences.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs share one use of the Internet they have not tried.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one new idea each."], [8, "Formative Assessment", "Q1 (Support level): Who created the worldwide web in 1991?\nAnswer: Tim Berners-Lee.\nQ2 (Expected level): Which activity is NOT specifically mentioned: shopping, blogging, e-mailing or social networking?\nAnswer: E-mailing (the text mentions online shopping, blogging and social networking sites).\nQ3 (Advanced level): Why do airports, coffee shops and hotels provide free connections?\nAnswer: So that anyone with a laptop or pocket PC can stay connected to work or home wherever they are."], [9, "Summative Assessment", "Q1 (Support level): What is blogging?\nAnswer: Writing online to share your thoughts and invite comments from readers around the world.\nQ2 (Expected level): How is the Internet described in the text?\nAnswer: The fastest growing technology on the planet and in history, a huge network of millions of linked computers.\nQ3 (Advanced level): Do you think the Internet will 'dominate every aspect of our lives'? Give one reason.\nAnswer: Open answer with a reason."], [10, "Notes within the Weekly Study Plan", "Students re-read the text and list three things they do on the Internet in a week."]]}, {"focus": "Pronoun reference in the text (CB p. 5, Activity 3)", "week": "Week 2: 13/9 - 17/9", "num": 7, "fields": [[1, "Learning Outcomes", "1. Identify what pronouns and reference words in the text refer to\n2. Use reference words to avoid repetition in own sentences"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. pronoun\n2. reference\n3. they\n4. these services\n5. their\n6. who\n7. line"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'Ali bought a phone. He loves it.' and asks: 'Who is he? What is it?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling reference. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models how to find what 'they (line 16)' refers to by reading the sentence before it and thinking aloud.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a three-step reference strategy.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Find the references. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: work in pairs on a they (line 16), b these services (line 18), c they (line 21), d they (line 27), e their (line 38), f who (line 38).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: six referents with the supporting line.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Independent practice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: find references in a short paragraph from the board without help.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: three correct referents.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Check and discuss. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare with another pair and correct.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: corrected answers."], [8, "Formative Assessment", "Q1 (Support level): In 'airports... are providing these services free', what are 'these services'?\nAnswer: High-speed connections, links to PCs and wireless systems (connecting people globally).\nQ2 (Expected level): What does 'they' (line 16) refer to?\nAnswer: Airports, coffee shops and hotels (the places providing the services).\nQ3 (Advanced level): Rewrite using a pronoun: 'Tim Berners-Lee invented the web. Tim Berners-Lee was a computer scientist.'\nAnswer: Tim Berners-Lee invented the web. He was a computer scientist."], [9, "Summative Assessment", "Q1 (Support level): What does 'their' (line 38) refer to?\nAnswer: The readers of a blog / bloggers' readers (the people who comment).\nQ2 (Expected level): Underline the pronoun and say what it refers to: 'Experts predict that it will change our lives.'\nAnswer: it – the Internet (or the technology mentioned before).\nQ3 (Advanced level): Write two sentences about the Internet using 'they' and 'these' correctly.\nAnswer: Open answer, checked for correct reference."], [10, "Notes within the Weekly Study Plan", "Students find three more pronouns in the text and say what each refers to."]]}, {"focus": "Grammar Recall: present simple and present continuous (CB p. 5)", "week": "Week 2: 13/9 - 17/9", "num": 8, "fields": [[1, "Learning Outcomes", "1. Distinguish the uses of the present simple and present continuous\n2. Choose the correct form to complete sentences"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Discovery learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. present simple\n2. present continuous\n3. habit/routine\n4. permanent state\n5. action now\n6. temporary situation\n7. future arrangement"], [6, "Warm-up / Introduction / Prior Learning", "Writes: 'What do you think about technology?' / 'What are you thinking about?' and asks how the meanings differ."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the difference. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: compare the two questions and the six example sentences (She is texting…, He e-mails…, They live in Sohar…).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a sorted list of examples by meaning.\n\nActivity 2 (14 minutes):\n- Strategy: Discovery learning\n- Teacher: Match sentences to usages. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: match sentences 1–6 to usages a–f.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a rule chart: simple (habits, true situations, permanent states) vs continuous (now, around now, future plans).\n\nActivity 3 (10 minutes):\n- Strategy: Participatory learning\n- Teacher: Apply the rule. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: complete sentences choosing the correct form (e.g. I usually ___/am ___ now).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: six correct sentences.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Check and share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: explain choices to a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: corrected sentences."], [8, "Formative Assessment", "Q1 (Support level): Choose: She (texts / is texting) her friend right now.\nAnswer: is texting.\nQ2 (Expected level): Which usage is 'He e-mails his friends every day'?\nAnswer: Habit/routine (present simple).\nQ3 (Advanced level): Explain the difference: 'He lives in Sohar' and 'He is living in Sohar this month'.\nAnswer: Lives = permanent state; is living = temporary situation now."], [9, "Summative Assessment", "Q1 (Support level): Choose: They (live / are living) in Sohar. (permanent)\nAnswer: live.\nQ2 (Expected level): Choose the correct form: I (get / am getting) a new phone tomorrow.\nAnswer: am getting (future arrangement).\nQ3 (Advanced level): Write two sentences about yourself: one habit and one activity happening now.\nAnswer: Open answer, e.g. I read every night. I am studying English now."], [10, "Notes within the Weekly Study Plan", "Students write five true sentences using present simple and five using present continuous."]]}, {"focus": "Activate Your English: board game (CB p. 5; WB p. 60)", "week": "Week 2: 13/9 - 17/9", "num": 9, "fields": [[1, "Learning Outcomes", "1. Produce accurate sentences using present simple and present continuous in a game\n2. Evaluate a partner's sentences for accuracy"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "1. Game-based learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook p. 60)\n3. Pens"], [5, "Concepts", "1. usually\n2. now\n3. board game\n4. counter\n5. row of three\n6. in the kitchen\n7. washing the dishes"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What do you usually do in the kitchen? What are you doing now?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Rules and example. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the rules and model: 'In the kitchen I usually cook my breakfast, but now I'm washing the dishes.'.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: the game rules clear to every pair.\n\nActivity 2 (24 minutes):\n- Strategy: Game-based learning\n- Teacher: Play the game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: play in pairs; each player has three counters and says one correct sentence to place a counter; first to make a row of three wins.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: correct sentences, a winner in every pair.\n\nActivity 3 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Error correction. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: the class lists errors heard and corrects them together.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of three common errors."], [8, "Formative Assessment", "Q1 (Support level): Complete: In the classroom I usually ______ (sit) but now I ______ (stand).\nAnswer: sit; am standing.\nQ2 (Expected level): Correct the sentence: Now I wash the dishes.\nAnswer: Now I am washing the dishes.\nQ3 (Advanced level): Make a sentence about the library with 'usually' and 'now'.\nAnswer: Open answer, e.g. In the library I usually read, but now I'm using a computer."], [9, "Summative Assessment", "Q1 (Support level): Which tense goes with 'every day'?\nAnswer: Present simple.\nQ2 (Expected level): Write one sentence about the school yard using both tenses.\nAnswer: Open answer.\nQ3 (Advanced level): Why did the game ask for a sentence with 'usually' and 'now'?\nAnswer: To contrast habit (present simple) with an action happening now (present continuous)."], [10, "Notes within the Weekly Study Plan", "Students prepare three sentences about different places at home. WB p. 60 (board game) is used in class."]]}, {"focus": "Consolidation: WB pp. 4–5 and Grammar Practice (WB p. 64)", "week": "Week 2: 13/9 - 17/9", "num": 10, "fields": [[1, "Learning Outcomes", "1. Apply the present simple and continuous in written tasks\n2. Correct errors in sentences"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Analyze"], [3, "Strategies", "1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "1. present simple\n2. present continuous\n3. time expressions\n4. stative verbs\n5. correction"], [6, "Warm-up / Introduction / Prior Learning", "Writes 3 sentences with common errors on the board and asks students to fix them."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Cooperative learning\n- Teacher: Error hunt. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: find and correct errors in three sentences on the board.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three corrected sentences.\n\nActivity 2 (20 minutes):\n- Strategy: Self-learning\n- Teacher: Independent practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 4–5 and the Grammar Practice activities on WB p. 64, checking with the answer key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed workbook activities.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group correction. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers in groups and explain disagreements.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of tricky items.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: mark own work and note two areas to improve.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-evaluation line."], [8, "Formative Assessment", "Q1 (Support level): Choose: He ______ (go) to school every day.\nAnswer: goes.\nQ2 (Expected level): Choose the correct form: Look! It ______ (rain).\nAnswer: is raining.\nQ3 (Advanced level): Correct the sentence: I am knowing the answer now.\nAnswer: I know the answer now (know is a stative verb)."], [9, "Summative Assessment", "Q1 (Support level): Choose: Birds ______ (fly).\nAnswer: fly.\nQ2 (Expected level): Complete: Right now my friends ______ (text) me.\nAnswer: are texting.\nQ3 (Advanced level): Write two sentences: one about a routine and one about a plan for tomorrow using the present continuous.\nAnswer: Open answer, e.g. I walk to school every day. I'm visiting my aunt tomorrow."], [10, "Notes within the Weekly Study Plan", "Students finish any unfinished workbook tasks and check them with the key."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Rank items as essential or non-essential and justify choices\n2. Read a text to answer gist questions about the Internet\n\nPeriod 2:\n1. Identify what pronouns and reference words in the text refer to\n2. Use reference words to avoid repetition in own sentences\n\nPeriod 3:\n1. Distinguish the uses of the present simple and present continuous\n2. Choose the correct form to complete sentences\n\nPeriod 4:\n1. Produce accurate sentences using present simple and present continuous in a game\n2. Evaluate a partner's sentences for accuracy\n\nPeriod 5:\n1. Apply the present simple and continuous in written tasks\n2. Correct errors in sentences"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Evaluate\nOutcome 2: Understand\n\nPeriod 2:\nOutcome 1: Analyze\nOutcome 2: Apply\n\nPeriod 3:\nOutcome 1: Analyze\nOutcome 2: Apply\n\nPeriod 4:\nOutcome 1: Apply\nOutcome 2: Evaluate\n\nPeriod 5:\nOutcome 1: Apply\nOutcome 2: Analyze"], [3, "Strategies", "Period 1:\n1. Participatory learning\n2. Cooperative learning\n\nPeriod 2:\n1. Modeling\n2. Participatory learning\n\nPeriod 3:\n1. Discovery learning\n2. Participatory learning\n\nPeriod 4:\n1. Game-based learning\n2. Cooperative learning\n\nPeriod 5:\n1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 3:\n1. Book\n2. Traditional board\n3. Pens\n4. Smart board\n\nPeriod 4:\n1. Book\n2. Other (Workbook p. 60)\n3. Pens\n\nPeriod 5:\n1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "Period 1:\n1. essential\n2. non-essential\n3. Internet\n4. worldwide web\n5. network\n6. e-shopping\n7. blogging\n8. social networking\n\nPeriod 2:\n1. pronoun\n2. reference\n3. they\n4. these services\n5. their\n6. who\n7. line\n\nPeriod 3:\n1. present simple\n2. present continuous\n3. habit/routine\n4. permanent state\n5. action now\n6. temporary situation\n7. future arrangement\n\nPeriod 4:\n1. usually\n2. now\n3. board game\n4. counter\n5. row of three\n6. in the kitchen\n7. washing the dishes\n\nPeriod 5:\n1. present simple\n2. present continuous\n3. time expressions\n4. stative verbs\n5. correction"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nHolds up a phone, a pencil and a coin: 'Which would you take to a desert island and why?'\n\nPeriod 2:\nWrites 'Ali bought a phone. He loves it.' and asks: 'Who is he? What is it?'\n\nPeriod 3:\nWrites: 'What do you think about technology?' / 'What are you thinking about?' and asks how the meanings differ.\n\nPeriod 4:\nAsks: 'What do you usually do in the kitchen? What are you doing now?'\n\nPeriod 5:\nWrites 3 sentences with common errors on the board and asks students to fix them."], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Essential items. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: write the ten most essential items from the list of fourteen and compare lists with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a personal top-ten list and a similarity count.\n\nActivity 2 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Reading for gist. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read 'The Internet' and answer: a How old is the Internet now? b Which activity is not mentioned: shopping, blogging, e-mailing, social networking?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two answers with evidence from the text.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Quick comprehension. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: answer: Who was Tim Berners-Lee? What is the Internet? What is blogging for?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group answers in full sentences.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs share one use of the Internet they have not tried.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: one new idea each.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling reference. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models how to find what 'they (line 16)' refers to by reading the sentence before it and thinking aloud.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a three-step reference strategy.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Find the references. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: work in pairs on a they (line 16), b these services (line 18), c they (line 21), d they (line 27), e their (line 38), f who (line 38).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: six referents with the supporting line.\n\nActivity 3 (10 minutes):\n- Strategy: Modeling\n- Teacher: Independent practice. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: find references in a short paragraph from the board without help.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: three correct referents.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Check and discuss. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare with another pair and correct.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: corrected answers.\n\nPeriod 3:\nActivity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the difference. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: compare the two questions and the six example sentences (She is texting…, He e-mails…, They live in Sohar…).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a sorted list of examples by meaning.\n\nActivity 2 (14 minutes):\n- Strategy: Discovery learning\n- Teacher: Match sentences to usages. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: match sentences 1–6 to usages a–f.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a rule chart: simple (habits, true situations, permanent states) vs continuous (now, around now, future plans).\n\nActivity 3 (10 minutes):\n- Strategy: Participatory learning\n- Teacher: Apply the rule. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: complete sentences choosing the correct form (e.g. I usually ___/am ___ now).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: six correct sentences.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Check and share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: explain choices to a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: corrected sentences.\n\nPeriod 4:\nActivity 1 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Rules and example. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the rules and model: 'In the kitchen I usually cook my breakfast, but now I'm washing the dishes.'.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: the game rules clear to every pair.\n\nActivity 2 (24 minutes):\n- Strategy: Game-based learning\n- Teacher: Play the game. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: play in pairs; each player has three counters and says one correct sentence to place a counter; first to make a row of three wins.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: correct sentences, a winner in every pair.\n\nActivity 3 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Error correction. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: the class lists errors heard and corrects them together.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of three common errors.\n\nPeriod 5:\nActivity 1 (5 minutes):\n- Strategy: Cooperative learning\n- Teacher: Error hunt. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: find and correct errors in three sentences on the board.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three corrected sentences.\n\nActivity 2 (20 minutes):\n- Strategy: Self-learning\n- Teacher: Independent practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 4–5 and the Grammar Practice activities on WB p. 64, checking with the answer key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed workbook activities.\n\nActivity 3 (10 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group correction. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare answers in groups and explain disagreements.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a list of tricky items.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: mark own work and note two areas to improve.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-evaluation line."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): Who created the worldwide web in 1991?\nAnswer: Tim Berners-Lee.\nQ2 (Expected level): Which activity is NOT specifically mentioned: shopping, blogging, e-mailing or social networking?\nAnswer: E-mailing (the text mentions online shopping, blogging and social networking sites).\nQ3 (Advanced level): Why do airports, coffee shops and hotels provide free connections?\nAnswer: So that anyone with a laptop or pocket PC can stay connected to work or home wherever they are.\n\nPeriod 2:\nQ1 (Support level): In 'airports... are providing these services free', what are 'these services'?\nAnswer: High-speed connections, links to PCs and wireless systems (connecting people globally).\nQ2 (Expected level): What does 'they' (line 16) refer to?\nAnswer: Airports, coffee shops and hotels (the places providing the services).\nQ3 (Advanced level): Rewrite using a pronoun: 'Tim Berners-Lee invented the web. Tim Berners-Lee was a computer scientist.'\nAnswer: Tim Berners-Lee invented the web. He was a computer scientist.\n\nPeriod 3:\nQ1 (Support level): Choose: She (texts / is texting) her friend right now.\nAnswer: is texting.\nQ2 (Expected level): Which usage is 'He e-mails his friends every day'?\nAnswer: Habit/routine (present simple).\nQ3 (Advanced level): Explain the difference: 'He lives in Sohar' and 'He is living in Sohar this month'.\nAnswer: Lives = permanent state; is living = temporary situation now.\n\nPeriod 4:\nQ1 (Support level): Complete: In the classroom I usually ______ (sit) but now I ______ (stand).\nAnswer: sit; am standing.\nQ2 (Expected level): Correct the sentence: Now I wash the dishes.\nAnswer: Now I am washing the dishes.\nQ3 (Advanced level): Make a sentence about the library with 'usually' and 'now'.\nAnswer: Open answer, e.g. In the library I usually read, but now I'm using a computer.\n\nPeriod 5:\nQ1 (Support level): Choose: He ______ (go) to school every day.\nAnswer: goes.\nQ2 (Expected level): Choose the correct form: Look! It ______ (rain).\nAnswer: is raining.\nQ3 (Advanced level): Correct the sentence: I am knowing the answer now.\nAnswer: I know the answer now (know is a stative verb)."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): What is blogging?\nAnswer: Writing online to share your thoughts and invite comments from readers around the world.\nQ2 (Expected level): How is the Internet described in the text?\nAnswer: The fastest growing technology on the planet and in history, a huge network of millions of linked computers.\nQ3 (Advanced level): Do you think the Internet will 'dominate every aspect of our lives'? Give one reason.\nAnswer: Open answer with a reason.\n\nPeriod 2:\nQ1 (Support level): What does 'their' (line 38) refer to?\nAnswer: The readers of a blog / bloggers' readers (the people who comment).\nQ2 (Expected level): Underline the pronoun and say what it refers to: 'Experts predict that it will change our lives.'\nAnswer: it – the Internet (or the technology mentioned before).\nQ3 (Advanced level): Write two sentences about the Internet using 'they' and 'these' correctly.\nAnswer: Open answer, checked for correct reference.\n\nPeriod 3:\nQ1 (Support level): Choose: They (live / are living) in Sohar. (permanent)\nAnswer: live.\nQ2 (Expected level): Choose the correct form: I (get / am getting) a new phone tomorrow.\nAnswer: am getting (future arrangement).\nQ3 (Advanced level): Write two sentences about yourself: one habit and one activity happening now.\nAnswer: Open answer, e.g. I read every night. I am studying English now.\n\nPeriod 4:\nQ1 (Support level): Which tense goes with 'every day'?\nAnswer: Present simple.\nQ2 (Expected level): Write one sentence about the school yard using both tenses.\nAnswer: Open answer.\nQ3 (Advanced level): Why did the game ask for a sentence with 'usually' and 'now'?\nAnswer: To contrast habit (present simple) with an action happening now (present continuous).\n\nPeriod 5:\nQ1 (Support level): Choose: Birds ______ (fly).\nAnswer: fly.\nQ2 (Expected level): Complete: Right now my friends ______ (text) me.\nAnswer: are texting.\nQ3 (Advanced level): Write two sentences: one about a routine and one about a plan for tomorrow using the present continuous.\nAnswer: Open answer, e.g. I walk to school every day. I'm visiting my aunt tomorrow."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents re-read the text and list three things they do on the Internet in a week.\n\nPeriod 2:\nStudents find three more pronouns in the text and say what each refers to.\n\nPeriod 3:\nStudents write five true sentences using present simple and five using present continuous.\n\nPeriod 4:\nStudents prepare three sentences about different places at home. WB p. 60 (board game) is used in class.\n\nPeriod 5:\nStudents finish any unfinished workbook tasks and check them with the key."]]}, {"label": "Theme 1 - Unit 3: Mobile Phones", "periods": [{"focus": "Mobile phones: advantages, disadvantages and age (CB p. 6, Activity 1)", "week": "Week 2: 13/9 - 17/9", "num": 11, "fields": [[1, "Learning Outcomes", "1. Identify objects from short descriptions\n2. Discuss advantages and disadvantages of mobile phones and give opinions"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Evaluate"], [3, "Strategies", "1. Participatory learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. advantage\n2. disadvantage\n3. mobile phone\n4. laptop computer\n5. MP3 player\n6. opinion"], [6, "Warm-up / Introduction / Prior Learning", "Plays three short descriptions (laptop, mobile phone, MP3 player) and asks what each speaker is talking about."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Listening warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: listen to three speakers and say what each object is.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three objects named.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss: a What are the advantages and disadvantages of mobile phones? b At what age should children or teenagers own a phone?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a two-column list and an agreed age with reasons.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Speakers report. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each group's speaker reports its view and the class compares opinions.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class opinion summary.\n\nActivity 4 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs write one advantage and one disadvantage.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: two sentences."], [8, "Formative Assessment", "Q1 (Support level): Name one advantage of a mobile phone.\nAnswer: Any, e.g. you can call someone in an emergency.\nQ2 (Expected level): Name one disadvantage of mobile phones.\nAnswer: Any, e.g. noise pollution, loss of privacy, cost.\nQ3 (Advanced level): At what age should teenagers own a phone? Give two reasons.\nAnswer: Open answer with two reasons."], [9, "Summative Assessment", "Q1 (Support level): Which object is described: 'I charge up the battery and plug in my earphones'?\nAnswer: An MP3 player.\nQ2 (Expected level): Why does the first speaker feel safe with the phone in the second description?\nAnswer: She can ring someone if she misses the bus or cannot find a taxi.\nQ3 (Advanced level): Write a sentence giving your opinion about children owning phones, using 'In my opinion…'.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students ask a family member about the age they think is right for a first phone and note the reason."]]}, {"focus": "Vocabulary for the phone-in: matching words and meanings (CB p. 6, Activity 2)", "week": "Week 2: 13/9 - 17/9", "num": 12, "fields": [[1, "Learning Outcomes", "1. Match words from the phone-in to their meanings\n2. Use new words in own sentences"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Remember\nOutcome 2: Apply"], [3, "Strategies", "1. Participatory learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)"], [5, "Concepts", "1. opinion\n2. can't stand\n3. blab\n4. constant\n5. get rid of\n6. marvellous\n7. emergency\n8. noise pollution\n9. privacy"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'noise pollution' and asks students to guess the meaning from the two words."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Participatory learning\n- Teacher: Guess and match. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: match the nine words a–i with the nine meanings with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: nine word–meaning pairs.\n\nActivity 2 (14 minutes):\n- Strategy: Self-learning\n- Teacher: Check and copy. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: check meanings in a dictionary and copy the words with meanings into the exercise book.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a personal vocabulary list.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Use the words. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each pair writes sentences using three of the words and reads them aloud.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: three sentences.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Mini self-test. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: cover the meanings and test oneself.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-score."], [8, "Formative Assessment", "Q1 (Support level): Match: privacy = ?\nAnswer: state of being alone.\nQ2 (Expected level): What is the meaning of 'can't stand'?\nAnswer: dislike strongly.\nQ3 (Advanced level): Write a sentence using 'emergency'.\nAnswer: Open answer, e.g. I keep my phone for an emergency."], [9, "Summative Assessment", "Q1 (Support level): Match: marvellous = ?\nAnswer: wonderful.\nQ2 (Expected level): What is 'noise pollution'?\nAnswer: loud and unpleasant sound.\nQ3 (Advanced level): Use 'constant' and 'get rid of' in two sentences.\nAnswer: Open answer, e.g. The constant noise made me want to get rid of my old phone."], [10, "Notes within the Weekly Study Plan", "Students learn the nine words for a short spelling check."]]}, {"focus": "Listening to a radio phone-in (CB p. 6, Activity 3)", "week": "Week 3: 20/9 - 24/9", "num": 13, "fields": [[1, "Learning Outcomes", "1. Listen to a phone-in and note the number of callers and their opinions\n2. Report who owns and who likes mobile phones"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Understand"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. caller\n2. phone-in\n3. own\n4. like\n5. privacy\n6. noise pollution"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Do all people like mobile phones? Who might not?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (7 minutes):\n- Strategy: Modeling\n- Teacher: Listening strategy model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models how to number callers and tick 'likes' and 'owns' after each caller while listening.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a three-column note-taking grid.\n\nActivity 2 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and note. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the phone-in twice; answer a How many callers? b How many like phones? c How many own one?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: grid with ticks and crosses.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Compare notes. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare grids and listen again to settle differences.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a group answer for a, b and c.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Independent check. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: report one caller's opinion in a sentence.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: one reported sentence."], [8, "Formative Assessment", "Q1 (Support level): Does the first caller like mobile phones?\nAnswer: She says she cannot say she likes it, but it is useful.\nQ2 (Expected level): Does the caller who says 'I like my privacy and my peace and quiet' like mobile phones?\nAnswer: No – he/she has never owned one.\nQ3 (Advanced level): Why does the first caller carry her phone all the time?\nAnswer: So that the school and her husband's office can contact her at any time."], [9, "Summative Assessment", "Q1 (Support level): Does the caller who has never had a phone like mobile phones?\nAnswer: No – he likes his privacy and his peace and quiet.\nQ2 (Expected level): Why does one caller say mobiles are noise pollution?\nAnswer: People are always shouting into them.\nQ3 (Advanced level): Do you agree with the caller who says phones are bad for your health? Give a reason.\nAnswer: Open answer with a reason."], [10, "Notes within the Weekly Study Plan", "Students write three sentences reporting what two callers said."]]}, {"focus": "Abbreviations (CB p. 6, Activity 4)", "week": "Week 3: 20/9 - 24/9", "num": 14, "fields": [[1, "Learning Outcomes", "1. Write out the full form of common abbreviations\n2. Create own abbreviations and explain how they are formed"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Remember\nOutcome 2: Create"], [3, "Strategies", "1. Discovery learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. abbreviation\n2. exam\n3. info\n4. IT\n5. dept\n6. SMS\n7. uni\n8. tv\n9. USA"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'Dr' and 'Mr' and asks what they stand for."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: How abbreviations form. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: study 'Dr' and the eight abbreviations and decide how they are formed (leaving out letters or taking first letters).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: two rules for forming abbreviations.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Write the full forms. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: copy a exam, b info, c IT, d dept, e SMS, f uni, g tv, h USA and write the full words.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: eight full forms.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Own abbreviations. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: think of other abbreviations (e.g. ASAP, Dr, PM) and test another group.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: five new abbreviations.\n\nActivity 4 (6 minutes):\n- Strategy: Discovery learning\n- Teacher: Reflect. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: state the two rules again with one example.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a rule statement."], [8, "Formative Assessment", "Q1 (Support level): What does 'exam' stand for?\nAnswer: examination.\nQ2 (Expected level): What does 'USA' stand for?\nAnswer: United States of America.\nQ3 (Advanced level): Make an abbreviation for 'Ministry of Education' and say how it was formed.\nAnswer: MOE – first letter of each word."], [9, "Summative Assessment", "Q1 (Support level): Write the full form of 'info'.\nAnswer: information.\nQ2 (Expected level): What is 'dept' short for? What is 'SMS'?\nAnswer: department; short message service (a text message).\nQ3 (Advanced level): Write two sentences using two abbreviations from the lesson.\nAnswer: Open answer, e.g. The IT dept sent an SMS."], [10, "Notes within the Weekly Study Plan", "Students collect five abbreviations from newspapers or signs."]]}, {"focus": "SMS language and consolidation (WB pp. 6–7)", "week": "Week 3: 20/9 - 24/9", "num": 15, "fields": [[1, "Learning Outcomes", "1. Decode and write short text messages using SMS abbreviations\n2. Evaluate when SMS language is appropriate"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "1. SMS language\n2. text message\n3. abbreviation\n4. informal\n5. formal"], [6, "Warm-up / Introduction / Prior Learning", "Writes an SMS such as 'C u 2moro' and asks what it means."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Decode messages. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decode three short SMS messages and write them in full English.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three decoded messages.\n\nActivity 2 (20 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook practice. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 6–7 individually and check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: completed tasks.\n\nActivity 3 (8 minutes):\n- Strategy: Cooperative learning\n- Teacher: SMS or not?. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: decide in groups when SMS language is acceptable (friends) and when it is not (teacher, formal).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a short agreement.\n\nActivity 4 (6 minutes):\n- Strategy: Self-learning\n- Teacher: Self-check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: score own answers.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-score."], [8, "Formative Assessment", "Q1 (Support level): What does 'c u' mean?\nAnswer: see you.\nQ2 (Expected level): Rewrite in full: 'info pls 2moro'.\nAnswer: Information please tomorrow.\nQ3 (Advanced level): Should you use SMS language in an e-mail to a teacher? Why/why not?\nAnswer: No – an e-mail to a teacher is formal; use full words."], [9, "Summative Assessment", "Q1 (Support level): Give the full form of 'tv'.\nAnswer: television.\nQ2 (Expected level): Write 'See you later' as a short SMS.\nAnswer: cu l8r / C u later.\nQ3 (Advanced level): Write two SMS-style sentences and then the same two sentences in full.\nAnswer: Open answer, correct pairs."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 6–7 and learn the Theme 1 Glossary words (CB p. 16)."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Identify objects from short descriptions\n2. Discuss advantages and disadvantages of mobile phones and give opinions\n\nPeriod 2:\n1. Match words from the phone-in to their meanings\n2. Use new words in own sentences\n\nPeriod 3:\n1. Listen to a phone-in and note the number of callers and their opinions\n2. Report who owns and who likes mobile phones\n\nPeriod 4:\n1. Write out the full form of common abbreviations\n2. Create own abbreviations and explain how they are formed\n\nPeriod 5:\n1. Decode and write short text messages using SMS abbreviations\n2. Evaluate when SMS language is appropriate"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Understand\nOutcome 2: Evaluate\n\nPeriod 2:\nOutcome 1: Remember\nOutcome 2: Apply\n\nPeriod 3:\nOutcome 1: Analyze\nOutcome 2: Understand\n\nPeriod 4:\nOutcome 1: Remember\nOutcome 2: Create\n\nPeriod 5:\nOutcome 1: Apply\nOutcome 2: Evaluate"], [3, "Strategies", "Period 1:\n1. Participatory learning\n2. Cooperative learning\n\nPeriod 2:\n1. Participatory learning\n2. Self-learning\n\nPeriod 3:\n1. Modeling\n2. Cooperative learning\n\nPeriod 4:\n1. Discovery learning\n2. Cooperative learning\n\nPeriod 5:\n1. Self-learning\n2. Cooperative learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n4. Other (dictionary)\n\nPeriod 3:\n1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens\n\nPeriod 4:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 5:\n1. Book\n2. Other (Workbook)\n3. Pens"], [5, "Concepts", "Period 1:\n1. advantage\n2. disadvantage\n3. mobile phone\n4. laptop computer\n5. MP3 player\n6. opinion\n\nPeriod 2:\n1. opinion\n2. can't stand\n3. blab\n4. constant\n5. get rid of\n6. marvellous\n7. emergency\n8. noise pollution\n9. privacy\n\nPeriod 3:\n1. caller\n2. phone-in\n3. own\n4. like\n5. privacy\n6. noise pollution\n\nPeriod 4:\n1. abbreviation\n2. exam\n3. info\n4. IT\n5. dept\n6. SMS\n7. uni\n8. tv\n9. USA\n\nPe
