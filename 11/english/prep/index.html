 good idea would be ______ talk to him.'\nAnswer: to.\nQ2 (Expected level): Give one possible reason why the boy loses friends.\nAnswer: e.g. he is not interested enough in the others / he talks only about himself.\nQ3 (Advanced level): Write four lines of advice to 'Lonely'.\nAnswer: Open answer using the advice phrases.\n\nPeriod 4:\nQ1 (Support level): How long have they been best friends?\nAnswer: Since Grade Nine / for a long time.\nQ2 (Expected level): Why won't she come round today?\nAnswer: She cannot pretend to be happy.\nQ3 (Advanced level): Write two lines to Hilary as her friend.\nAnswer: Open answer.\n\nPeriod 5:\nQ1 (Support level): Which adjective describes Katie: cheerful or dependable?\nAnswer: cheerful.\nQ2 (Expected level): Write a chart entry for Katie: time / reason / quality.\nAnswer: Since four / can tell her secrets / cheerful.\nQ3 (Advanced level): Write three sentences about your best friend using time, reason and quality.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents list five adjectives for a good friend with meanings.\n\nPeriod 2:\nStudents write three questions they would ask a friend from another country.\n\nPeriod 3:\nStudents write advice to a different problem letter of their own invention.\n\nPeriod 4:\nOptional homework: write a short poem (it need not rhyme) for a best friend or someone important to you.\n\nPeriod 5:\nStudents finish WB pp. 20–21."]]}, {"label": "Theme 2 - Unit 4: Western Influence", "periods": [{"focus": "Predicting and listening to a talk: Western influence (CB p. 24; WB p. 22)", "week": "Week 7: 18/10 - 22/10", "num": 40, "fields": [[1, "Learning Outcomes", "1. Predict the topics of a listening text\n2. Listen to a talk and note reasons for changing tastes"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Analyze"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. Western influence\n2. fast food\n3. outlet\n4. fashion\n5. stylish\n6. convenient\n7. changing tastes"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What food and clothes do young people like these days? Where do they get ideas?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Prediction model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models predicting topics (food, fashion, music, health) from the title and noting question words.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a prediction list.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen for reasons. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the talk 'Western Influence – Good or Bad?' and note why teenagers like fast food and why they go to malls.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a two-column reason chart.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Compare notes. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare notes and discuss whether the reasons are convincing.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group agreement.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Summarise. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: summarise the talk in two sentences.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: two sentences."], [8, "Formative Assessment", "Q1 (Support level): What are the two areas of changing tastes in the talk?\nAnswer: Eating and shopping.\nQ2 (Expected level): Why are Omani teenagers attracted to fast food outlets?\nAnswer: The food is tasty, quick and convenient, and the outlets are cool places to hang out with friends.\nQ3 (Advanced level): Why do teenagers go to shopping malls so often?\nAnswer: To copy Western fashions they see on TV and the Internet."], [9, "Summative Assessment", "Q1 (Support level): Which two meals does the speaker mention: pizzas and burgers or rice and fish?\nAnswer: Pizzas and burgers.\nQ2 (Expected level): What kind of clothes are teenagers looking for?\nAnswer: Stylish jeans, fashionable shoes and hats.\nQ3 (Advanced level): Do you think Western influence is good or bad? Give one reason.\nAnswer: Open answer with a reason."], [10, "Notes within the Weekly Study Plan", "Students list three examples of Western influence they notice in their town."]]}, {"focus": "Soundbites: asking questions (CB p. 24)", "week": "Week 7: 18/10 - 22/10", "num": 41, "fields": [[1, "Learning Outcomes", "1. Use question phrases to ask for more information\n2. Ask and answer about things important to teenagers"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. Do you think…?\n2. Why do you think…?\n3. Can you give me some examples?\n4. What kind of changes?\n5. How do you mean?"], [6, "Warm-up / Introduction / Prior Learning", "Asks one student three follow-up questions about their favourite food."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling questions. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models an interview using the Soundbites phrases (Can you tell me…? / How do you mean?) and thinks aloud about which question to ask next.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a model interview.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Five important things. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each student lists five things important to them (e.g. clothes, mobile phone) and a partner asks for information using Soundbites.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: an interview note sheet.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Switch partners. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: repeat with a new partner using different question words (why, where, what kind).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a second note sheet.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Report. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: report one thing learnt about a partner.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: two reporting sentences."], [8, "Formative Assessment", "Q1 (Support level): Complete: 'Can you ______ me some examples?'\nAnswer: give.\nQ2 (Expected level): Make a question with 'Why do you think…' about fast food.\nAnswer: e.g. Why do you think teenagers like fast food?\nQ3 (Advanced level): Write three questions for an interview about teenage hobbies.\nAnswer: Open answer using Soundbites phrases."], [9, "Summative Assessment", "Q1 (Support level): Which question asks for more explanation: 'How do you mean?' or 'Goodbye'?\nAnswer: How do you mean?\nQ2 (Expected level): Write a question using 'What kind of…'.\nAnswer: e.g. What kind of music do you like?\nQ3 (Advanced level): Write a four-line interview (two questions and two answers) about shopping.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students prepare three questions for next lesson."]]}, {"focus": "Teenage opinions and speaking (CB p. 25)", "week": "Week 7: 18/10 - 22/10", "num": 42, "fields": [[1, "Learning Outcomes", "1. Discuss whether you agree with teenagers' statements\n2. Write and explain own statements about things important to them"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Evaluate\nOutcome 2: Create"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. I'm in love with fast food\n2. I can't live without the Internet\n3. My life is music\n4. My best friend is my mobile phone\n5. agree\n6. disagree"], [6, "Warm-up / Introduction / Prior Learning", "Reads: 'My best friend is my mobile phone.' and asks the class to stand on 'agree' or 'disagree' sides."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Walking debate. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: move to 'agree' or 'disagree' sides for each statement and give one reason.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: reasons for both sides.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss the four statements and write two statements of their own that apply to them.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two own statements.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Explain to a partner. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: tell a partner why each own statement is important to them.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a spoken explanation.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Class poll. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: vote for the most surprising statement.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class result."], [8, "Formative Assessment", "Q1 (Support level): Complete: 'I can't live without the ______.'\nAnswer: Internet (from the statement).\nQ2 (Expected level): Do you agree with 'My life is music'? Why/why not?\nAnswer: Open answer with a reason.\nQ3 (Advanced level): Write one statement about something important to you and explain why.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): Which statement is about food?\nAnswer: I'm in love with fast food.\nQ2 (Expected level): Give one reason why a mobile phone is important to a teenager.\nAnswer: Open answer.\nQ3 (Advanced level): Discuss: 'Teenagers cannot live without the Internet.' (3 sentences)\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students prepare a one-minute talk 'The thing I can't live without'."]]}, {"focus": "Consolidation: WB pp. 22–23 and speaking assessment", "week": "Week 8: 25/10 - 29/10", "num": 43, "fields": [[1, "Learning Outcomes", "1. Complete a chart from interviews on teenage tastes\n2. Present a one-minute talk using question phrases"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Self-learning\n2. Game-based learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook)\n3. Multimedia (audio-visual)\n4. Pens\n5. Software / apps such as Edpuzzle, Padlet, Kahoot"], [5, "Concepts", "1. interview\n2. chart\n3. taste\n4. opinion\n5. presentation\n6. fashion\n7. music\n8. health"], [6, "Warm-up / Introduction / Prior Learning", "Quick quiz: matching question phrases to their purposes."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Game-based learning\n- Teacher: Question quiz. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: teams match question phrases to their purposes in a quick game.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a team score.\n\nActivity 2 (20 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook listening. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 22–23 (interviews and chart) alone and check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a completed chart.\n\nActivity 3 (10 minutes):\n- Strategy: Game-based learning\n- Teacher: One-minute talks. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: give the one-minute talk 'The thing I can't live without' while peers score clarity with a card.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a scored talk.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Self-evaluation. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write one strength and one target.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-evaluation line."], [8, "Formative Assessment", "Q1 (Support level): Match: 'Why do you think…?' – asks for ______ (a reason / a place).\nAnswer: a reason.\nQ2 (Expected level): Which topics might a teenager interview cover: fashion, food or history of Oman?\nAnswer: fashion and food.\nQ3 (Advanced level): Write two questions you would ask in an interview about Western influence.\nAnswer: Open answer."], [9, "Summative Assessment", "Q1 (Support level): True or false: Predicting helps you understand a listening text.\nAnswer: True.\nQ2 (Expected level): Give one thing you predicted and found in an interview.\nAnswer: Open answer.\nQ3 (Advanced level): Write a short paragraph (3 sentences) about the influence of fast food on teenagers.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finish WB pp. 22–23."]]}], "merged": [[1, "Learning Outcomes", "Period 1:\n1. Predict the topics of a listening text\n2. Listen to a talk and note reasons for changing tastes\n\nPeriod 2:\n1. Use question phrases to ask for more information\n2. Ask and answer about things important to teenagers\n\nPeriod 3:\n1. Discuss whether you agree with teenagers' statements\n2. Write and explain own statements about things important to them\n\nPeriod 4:\n1. Complete a chart from interviews on teenage tastes\n2. Present a one-minute talk using question phrases"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Apply\nOutcome 2: Analyze\n\nPeriod 2:\nOutcome 1: Apply\nOutcome 2: Apply\n\nPeriod 3:\nOutcome 1: Evaluate\nOutcome 2: Create\n\nPeriod 4:\nOutcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "Period 1:\n1. Modeling\n2. Cooperative learning\n\nPeriod 2:\n1. Modeling\n2. Participatory learning\n\nPeriod 3:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 4:\n1. Self-learning\n2. Game-based learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 3:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 4:\n1. Book\n2. Other (Workbook)\n3. Multimedia (audio-visual)\n4. Pens\n5. Software / apps such as Edpuzzle, Padlet, Kahoot"], [5, "Concepts", "Period 1:\n1. Western influence\n2. fast food\n3. outlet\n4. fashion\n5. stylish\n6. convenient\n7. changing tastes\n\nPeriod 2:\n1. Do you think…?\n2. Why do you think…?\n3. Can you give me some examples?\n4. What kind of changes?\n5. How do you mean?\n\nPeriod 3:\n1. I'm in love with fast food\n2. I can't live without the Internet\n3. My life is music\n4. My best friend is my mobile phone\n5. agree\n6. disagree\n\nPeriod 4:\n1. interview\n2. chart\n3. taste\n4. opinion\n5. presentation\n6. fashion\n7. music\n8. health"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'What food and clothes do young people like these days? Where do they get ideas?'\n\nPeriod 2:\nAsks one student three follow-up questions about their favourite food.\n\nPeriod 3:\nReads: 'My best friend is my mobile phone.' and asks the class to stand on 'agree' or 'disagree' sides.\n\nPeriod 4:\nQuick quiz: matching question phrases to their purposes."], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Prediction model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models predicting topics (food, fashion, music, health) from the title and noting question words.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a prediction list.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen for reasons. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the talk 'Western Influence – Good or Bad?' and note why teenagers like fast food and why they go to malls.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a two-column reason chart.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Compare notes. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare notes and discuss whether the reasons are convincing.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: group agreement.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Summarise. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: summarise the talk in two sentences.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: two sentences.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling questions. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models an interview using the Soundbites phrases (Can you tell me…? / How do you mean?) and thinks aloud about which question to ask next.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a model interview.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Five important things. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: each student lists five things important to them (e.g. clothes, mobile phone) and a partner asks for information using Soundbites.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: an interview note sheet.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Switch partners. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: repeat with a new partner using different question words (why, where, what kind).\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a second note sheet.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Report. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: report one thing learnt about a partner.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: two reporting sentences.\n\nPeriod 3:\nActivity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Walking debate. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: move to 'agree' or 'disagree' sides for each statement and give one reason.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: reasons for both sides.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Group discussion. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: discuss the four statements and write two statements of their own that apply to them.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: two own statements.\n\nActivity 3 (12 minutes):\n- Strategy: Participatory learning\n- Teacher: Explain to a partner. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: tell a partner why each own statement is important to them.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a spoken explanation.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Class poll. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: vote for the most surprising statement.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class result.\n\nPeriod 4:\nActivity 1 (5 minutes):\n- Strategy: Game-based learning\n- Teacher: Question quiz. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: teams match question phrases to their purposes in a quick game.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a team score.\n\nActivity 2 (20 minutes):\n- Strategy: Self-learning\n- Teacher: Workbook listening. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB pp. 22–23 (interviews and chart) alone and check with the key.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a completed chart.\n\nActivity 3 (10 minutes):\n- Strategy: Game-based learning\n- Teacher: One-minute talks. Runs a game or contest linked to the lesson outcome, keeps score and gives immediate feedback. Task: give the one-minute talk 'The thing I can't live without' while peers score clarity with a card.\n- Student: Compete in teams, answer the game questions and justify the answers. Product: a scored talk.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Self-evaluation. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: write one strength and one target.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-evaluation line."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): What are the two areas of changing tastes in the talk?\nAnswer: Eating and shopping.\nQ2 (Expected level): Why are Omani teenagers attracted to fast food outlets?\nAnswer: The food is tasty, quick and convenient, and the outlets are cool places to hang out with friends.\nQ3 (Advanced level): Why do teenagers go to shopping malls so often?\nAnswer: To copy Western fashions they see on TV and the Internet.\n\nPeriod 2:\nQ1 (Support level): Complete: 'Can you ______ me some examples?'\nAnswer: give.\nQ2 (Expected level): Make a question with 'Why do you think…' about fast food.\nAnswer: e.g. Why do you think teenagers like fast food?\nQ3 (Advanced level): Write three questions for an interview about teenage hobbies.\nAnswer: Open answer using Soundbites phrases.\n\nPeriod 3:\nQ1 (Support level): Complete: 'I can't live without the ______.'\nAnswer: Internet (from the statement).\nQ2 (Expected level): Do you agree with 'My life is music'? Why/why not?\nAnswer: Open answer with a reason.\nQ3 (Advanced level): Write one statement about something important to you and explain why.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): Match: 'Why do you think…?' – asks for ______ (a reason / a place).\nAnswer: a reason.\nQ2 (Expected level): Which topics might a teenager interview cover: fashion, food or history of Oman?\nAnswer: fashion and food.\nQ3 (Advanced level): Write two questions you would ask in an interview about Western influence.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): Which two meals does the speaker mention: pizzas and burgers or rice and fish?\nAnswer: Pizzas and burgers.\nQ2 (Expected level): What kind of clothes are teenagers looking for?\nAnswer: Stylish jeans, fashionable shoes and hats.\nQ3 (Advanced level): Do you think Western influence is good or bad? Give one reason.\nAnswer: Open answer with a reason.\n\nPeriod 2:\nQ1 (Support level): Which question asks for more explanation: 'How do you mean?' or 'Goodbye'?\nAnswer: How do you mean?\nQ2 (Expected level): Write a question using 'What kind of…'.\nAnswer: e.g. What kind of music do you like?\nQ3 (Advanced level): Write a four-line interview (two questions and two answers) about shopping.\nAnswer: Open answer.\n\nPeriod 3:\nQ1 (Support level): Which statement is about food?\nAnswer: I'm in love with fast food.\nQ2 (Expected level): Give one reason why a mobile phone is important to a teenager.\nAnswer: Open answer.\nQ3 (Advanced level): Discuss: 'Teenagers cannot live without the Internet.' (3 sentences)\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): True or false: Predicting helps you understand a listening text.\nAnswer: True.\nQ2 (Expected level): Give one thing you predicted and found in an interview.\nAnswer: Open answer.\nQ3 (Advanced level): Write a short paragraph (3 sentences) about the influence of fast food on teenagers.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents list three examples of Western influence they notice in their town.\n\nPeriod 2:\nStudents prepare three questions for next lesson.\n\nPeriod 3:\nStudents prepare a one-minute talk 'The thing I can't live without'.\n\nPeriod 4:\nStudents finish WB pp. 22–23."]]}, {"label": "Theme 2 - Unit 5: Teenage Angst", "periods": [{"focus": "Reading three letters to a problem page (CB p. 26, Activity 1)", "week": "Week 8: 25/10 - 29/10", "num": 44, "fields": [[1, "Learning Outcomes", "1. Identify what each teenager is worried about\n2. Suggest advice for each letter"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Create"], [3, "Strategies", "1. Cooperative learning\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. problem page\n2. Auntie\n3. worried\n4. overweight\n5. distracted\n6. pressure\n7. career"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What worries teenagers most?' and notes ideas on the board."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: list common teenage worries.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Read the letters. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the letters from Nabil, Taha and Munira and answer: What is each worried about?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three worries.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Advice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give advice for each letter using advice phrases from Unit 3.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three pieces of advice.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare advice with another group.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a best-advice list."], [8, "Formative Assessment", "Q1 (Support level): What is Nabil worried about?\nAnswer: His football playing – he makes mistakes and is overweight, and his friends sometimes get angry.\nQ2 (Expected level): Why are Taha's marks dropping?\nAnswer: He does not spend enough time on homework, gets distracted and gets headaches at the computer.\nQ3 (Advanced level): Why does Munira's father's career wish worry her?\nAnswer: He wants her to be a doctor, but she is interested in art and fashion design."], [9, "Summative Assessment", "Q1 (Support level): How old is Munira?\nAnswer: 15.\nQ2 (Expected level): What does Munira want to do?\nAnswer: Train as a fashion designer in Italy.\nQ3 (Advanced level): Give advice to Munira.\nAnswer: Open answer, e.g. talk to your father about your interests and research fashion designing."], [10, "Notes within the Weekly Study Plan", "Students re-read the letters and underline words that show worry."]]}, {"focus": "The counsellor's answers (CB p. 27, Activity 2)", "week": "Week 8: 25/10 - 29/10", "num": 45, "fields": [[1, "Learning Outcomes", "1. Match counsellor sentences to the correct letter\n2. Explain why advice suits each problem"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Evaluate"], [3, "Strategies", "1. Discovery learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. counsellor\n2. advice\n3. imperative\n4. set time limits\n5. introduce\n6. research"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'What makes a piece of advice useful?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the language. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: look at the nine advice sentences and find patterns (imperatives and questions).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a list of advice structures.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Three columns. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: draw three columns Letter A, B, C and place the nine sentences.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a completed table.\n\nActivity 3 (10 minutes):\n- Strategy: Discovery learning\n- Teacher: Explain choices. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: explain why each sentence fits its letter.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: reasons for three choices.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare with the key: A 2, 4, 7; B 1, 6, 8; C 3, 5, 9.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected table."], [8, "Formative Assessment", "Q1 (Support level): Which letter does 'Give yourself more time to decide.' go with?\nAnswer: Letter C (Munira).\nQ2 (Expected level): Which sentences go with Letter B (Taha)?\nAnswer: 1, 6 and 8.\nQ3 (Advanced level): Why does 'Try and introduce your friends to another sport' suit Nabil?\nAnswer: He does not enjoy football and makes mistakes; another sport may suit him and his friends."], [9, "Summative Assessment", "Q1 (Support level): Which letter does 'Set yourself time limits for your homework tasks.' go with?\nAnswer: Letter B.\nQ2 (Expected level): Which letter goes with 'Why don't you just watch your friends play?'\nAnswer: Letter A.\nQ3 (Advanced level): Write one more piece of advice for Taha.\nAnswer: Open answer, e.g. Turn off your phone while you study."], [10, "Notes within the Weekly Study Plan", "Students write two pieces of advice for each of three imaginary letters."]]}, {"focus": "Proofreading, editing and informal phrases (CB p. 27, Top Tip and Activity 3)", "week": "Week 8: 25/10 - 29/10", "num": 46, "fields": [[1, "Learning Outcomes", "1. Sort informal letter phrases into beginning, end or either\n2. Proofread a short text using a correction code"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Participatory learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens"], [5, "Concepts", "1. proofread\n2. edit\n3. correction code\n4. beginning\n5. end\n6. PS (postscript)\n7. informal"], [6, "Warm-up / Introduction / Prior Learning", "Writes a sentence with three errors and asks pairs to fix it."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling proofreading. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models proofreading a paragraph with a code (sp = spelling, p = punctuation, gr = grammar) thinking aloud.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a correction-code chart.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Sort the phrases. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: decide for phrases a–i whether they go at the beginning, end or either place.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: nine phrases sorted.\n\nActivity 3 (12 minutes):\n- Strategy: Modeling\n- Teacher: Proofread. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: use the code to proofread a short informal letter extract.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a corrected extract.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Check. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a corrected list."], [8, "Formative Assessment", "Q1 (Support level): Does 'Take care, speak soon.' go at the beginning or the end?\nAnswer: The end.\nQ2 (Expected level): Does 'Hi there!' go at the beginning or the end?\nAnswer: The beginning.\nQ3 (Advanced level): What does 'PS' mean and where does it go?\nAnswer: Postscript – an extra message after you sign your name."], [9, "Summative Assessment", "Q1 (Support level): What is the difference between proofreading and editing?\nAnswer: Proofreading means looking for errors; editing means correcting them.\nQ2 (Expected level): Correct: 'I recieved you're letter yesterday.'\nAnswer: I received your letter yesterday.\nQ3 (Advanced level): Write an informal opening line and closing line for a letter to a friend.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students proofread their own paragraph from Theme 2 Time to Talk."]]}, {"focus": "Planning a letter to a problem page (WB pp. 24; Writing Guide)", "week": "Week 8: 25/10 - 29/10", "num": 47, "fields": [[1, "Learning Outcomes", "1. Plan a letter explaining a problem using the Writing Guide\n2. Explain acne and related vocabulary"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Apply\nOutcome 2: Understand"], [3, "Strategies", "1. Modeling\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook p. 24 and Writing Guide)\n3. Pens"], [ ): What is 'self-esteem'?\nAnswer: The feeling that you are a person of value or worth.\nQ3 (Advanced level): Write the opening sentence of a letter about homework problems.\nAnswer: Open answer, e.g. I'm writing to you about a very worrying problem with my homework."], [9, "Summative Assessment", "Q1 (Support level): What does 'emotional' mean?\nAnswer: Relating to feelings.\nQ2 (Expected level): Name two parts of a letter to a problem page.\nAnswer: e.g. greeting, the problem, a request for help, closing.\nQ3 (Advanced level): Write a three-point plan for a letter about too much homework.\nAnswer: Open answer."], [10, "Notes within the Weekly Study Plan", "Students finalise the plan at home."]]}, {"focus": "Writing the letter and Review & Reference (CB pp. 26, 32; WB p. 25)", "week": "Week 8: 25/10 - 29/10", "num": 48, "fields": [[1, "Learning Outcomes", "1. Write an informal letter to a problem page\n2. Review learning and glossary words of Theme 2"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Create\nOutcome 2: Remember"], [3, "Strategies", "1. Project-based learning\n2. Self-learning"], [4, "Learning Resources", "1. Book\n2. Other (Workbook p. 25)\n3. Pens"], [5, "Concepts", "1. draft\n2. proofread\n3. edit\n4. glossary\n5. growth spurt\n6. hormone\n7. transition\n8. self-assessment"], [6, "Warm-up / Introduction / Prior Learning", "Reminds students of the layout in a quick board sketch."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Recap. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: list the parts of a problem letter.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a part list.\n\nActivity 2 (22 minutes):\n- Strategy: Project-based learning\n- Teacher: Write the letter. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each at each teenager is worried about\n2. Suggest advice for each letter\n\nPeriod 2:\n1. Match counsellor sentences to the correct letter\n2. Explain why advice suits each problem\n\nPeriod 3:\n1. Sort informal letter phrases into beginning, end or either\n2. Proofread a short text using a correction code\n\nPeriod 4:\n1. Plan a letter explaining a problem using the Writing Guide\n2. Explain acne and related vocabulary\n\nPeriod 5:\n1. Write an informal letter to a problem page\n2. Review learning and glossary words of Theme 2"], [2, "Cognitive Level of Each Outcome", "Period 1:\nOutcome 1: Understand\nOutcome 2: Create\n\nPeriod 2:\nOutcome 1: Analyze\nOutcome 2: Evaluate\n\nPeriod 3:\nOutcome 1: Analyze\nOutcome 2: Apply\n\nPeriod 4:\nOutcome 1: Apply\nOutcome 2: Understand\n\nPeriod 5:\nOutcome 1: Create\nOutcome 2: Remember"], [3, "Strategies", "Period 1:\n1. Cooperative learning\n2. Participatory learning\n\nPeriod 2:\n1. Discovery learning\n2. Cooperative learning\n\nPeriod 3:\n1. Modeling\n2. Participatory learning\n\nPeriod 4:\n1. Modeling\n2. Self-learning\n\nPeriod 5:\n1. Project-based learning\n2. Self-learning"], [4, "Learning Resources", "Period 1:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 2:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 3:\n1. Book\n2. Traditional board\n3. Pens\n\nPeriod 4:\n1. Book\n2. Other (Workbook p. 24 and Writing Guide)\n3. Pens\n\nPeriod 5:\n1. Book\n2. Other (Workbook p. 25)\n3. Pens"], [5, "Concepts", "Period 1:\n1. problem page\n2. Auntie\n3. worried\n4. overweight\n5. distracted\n6. pressure\n7. career\n\nPeriod 2:\n1. counsellor\n2. advice\n3. imperative\n4. set time limits\n5. introduce\n6. research\n\nPeriod 3:\n1. proofread\n2. edit\n3. correction code\n4. beginning\n5. end\n6. PS (postscript)\n7. informal\n\nPeriod 4:\n1. problem\n2. explain\n3. reason\n4. layout\n5. paragraph\n6. acne\n7. self-esteem\n8. emotional\n\nPeriod 5:\n1. draft\n2. proofread\n3. edit\n4. glossary\n5. growth spurt\n6. hormone\n7. transition\n8. self-assessment"], [6, "Warm-up / Introduction / Prior Learning", "Period 1:\nAsks: 'What worries teenagers most?' and notes ideas on the board.\n\nPeriod 2:\nAsks: 'What makes a piece of advice useful?'\n\nPeriod 3:\nWrites a sentence with three errors and asks pairs to fix it.\n\nPeriod 4:\nAsks: 'What should the first sentence of a problem letter say?'\n\nPeriod 5:\nReminds students of the layout in a quick board sketch."], [7, "Lesson Procedures / Teaching Activities", "Period 1:\nActivity 1 (5 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: list common teenage worries.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a board list.\n\nActivity 2 (15 minutes):\n- Strategy: Cooperative learning\n- Teacher: Read the letters. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the letters from Nabil, Taha and Munira and answer: What is each worried about?.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three worries.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Advice. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: give advice for each letter using advice phrases from Unit 3.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: three pieces of advice.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Share. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare advice with another group.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a best-advice list.\n\nPeriod 2:\nActivity 1 (8 minutes):\n- Strategy: Discovery learning\n- Teacher: Notice the language. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: look at the nine advice sentences and find patterns (imperatives and questions).\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: a list of advice structures.\n\nActivity 2 (16 minutes):\n- Strategy: Cooperative learning\n- Teacher: Three columns. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: draw three columns Letter A, B, C and place the nine sentences.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a completed table.\n\nActivity 3 (10 minutes):\n- Strategy: Discovery learning\n- Teacher: Explain choices. Presents examples or a situation without stating the rule, asks guiding questions, then confirms the students' conclusion. Task: explain why each sentence fits its letter.\n- Student: Examine the examples, notice the pattern and state the rule or idea in their own words before testing it on new items. Product: reasons for three choices.\n\nActivity 4 (6 minutes):\n- Strategy: Cooperative learning\n- Teacher: Check. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: compare with the key: A 2, 4, 7; B 1, 6, 8; C 3, 5, 9.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: corrected table.\n\nPeriod 3:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling proofreading. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models proofreading a paragraph with a code (sp = spelling, p = punctuation, gr = grammar) thinking aloud.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a correction-code chart.\n\nActivity 2 (14 minutes):\n- Strategy: Participatory learning\n- Teacher: Sort the phrases. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: decide for phrases a–i whether they go at the beginning, end or either place.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: nine phrases sorted.\n\nActivity 3 (12 minutes):\n- Strategy: Modeling\n- Teacher: Proofread. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: use the code to proofread a short informal letter extract.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a corrected extract.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Check. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: compare with a partner.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a corrected list.\n\nPeriod 4:\nActivity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling a plan. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models planning a letter: greeting, the problem, details, a question, closing.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a model plan.\n\nActivity 2 (14 minutes):\n- Strategy: Self-learning\n- Teacher: Vocabulary and plan. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: complete WB p. 24 Activity 1 (acne, self-esteem, emotional) and plan an own letter with the Writing Guide.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a vocabulary task and a plan.\n\nActivity 3 (12 minutes):\n- Strategy: Self-learning\n- Teacher: Layout check. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: compare own plan with the layout in the letters on CB p. 26.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a checked plan.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Peer check. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: swap plans and give feedback.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a feedback note.\n\nPeriod 5:\nActivity 1 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Recap. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: list the parts of a problem letter.\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a part list.\n\nActivity 2 (22 minutes):\n- Strategy: Project-based learning\n- Teacher: Write the letter. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: draft a letter to a problem page in class and proofread it with the code.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a first-draft letter.\n\nActivity 3 (8 minutes):\n- Strategy: Project-based learning\n- Teacher: Peer review. Introduces a mini-project, sets the stages, criteria and time limits and gives feedback at each stage. Task: exchange drafts and give feedback.\n- Student: Plan, draft and refine a product in stages and present it for feedback. Product: a feedback note.\n\nActivity 4 (5 minutes):\n- Strategy: Self-learning\n- Teacher: Review page. Sets an individual task with clear success criteria and circulates to give feedback and support. Task: read CB p. 32 'In this theme you have learned…' and choose 15 core words (5 nouns, 5 verbs, 5 adjectives).\n- Student: Work independently, check own work against the criteria or answer key and note corrections. Product: a self-assessment line and word list."], [8, "Formative Assessment", "Period 1:\nQ1 (Support level): What is Nabil worried about?\nAnswer: His football playing – he makes mistakes and is overweight, and his friends sometimes get angry.\nQ2 (Expected level): Why are Taha's marks dropping?\nAnswer: He does not spend enough time on homework, gets distracted and gets headaches at the computer.\nQ3 (Advanced level): Why does Munira's father's career wish worry her?\nAnswer: He wants her to be a doctor, but she is interested in art and fashion design.\n\nPeriod 2:\nQ1 (Support level): Which letter does 'Give yourself more time to decide.' go with?\nAnswer: Letter C (Munira).\nQ2 (Expected level): Which sentences go with Letter B (Taha)?\nAnswer: 1, 6 and 8.\nQ3 (Advanced level): Why does 'Try and introduce your friends to another sport' suit Nabil?\nAnswer: He does not enjoy football and makes mistakes; another sport may suit him and his friends.\n\nPeriod 3:\nQ1 (Support level): Does 'Take care, speak soon.' go at the beginning or the end?\nAnswer: The end.\nQ2 (Expected level): Does 'Hi there!' go at the beginning or the end?\nAnswer: The beginning.\nQ3 (Advanced level): What does 'PS' mean and where does it go?\nAnswer: Postscript – an extra message after you sign your name.\n\nPeriod 4:\nQ1 (Support level): Which part comes first in a letter to a problem page?\nAnswer: The greeting (Dear Auntie).\nQ2 (Expected level): What is 'self-esteem'?\nAnswer: The feeling that you are a person of value or worth.\nQ3 (Advanced level): Write the opening sentence of a letter about homework problems.\nAnswer: Open answer, e.g. I'm writing to you about a very worrying problem with my homework.\n\nPeriod 5:\nQ1 (Support level): Which closing is suitable: Yours, Nabil or See you in the market?\nAnswer: Yours, Nabil.\nQ2 (Expected level): Correct: 'Dear Auntie i am worryed about my marks.'\nAnswer: Dear Auntie, I am worried about my marks.\nQ3 (Advanced level): Write two sentences explaining a problem about friends.\nAnswer: Open answer."], [9, "Summative Assessment", "Period 1:\nQ1 (Support level): How old is Munira?\nAnswer: 15.\nQ2 (Expected level): What does Munira want to do?\nAnswer: Train as a fashion designer in Italy.\nQ3 (Advanced level): Give advice to Munira.\nAnswer: Open answer, e.g. talk to your father about your interests and research fashion designing.\n\nPeriod 2:\nQ1 (Support level): Which letter does 'Set yourself time limits for your homework tasks.' go with?\nAnswer: Letter B.\nQ2 (Expected level): Which letter goes with 'Why don't you just watch your friends play?'\nAnswer: Letter A.\nQ3 (Advanced level): Write one more piece of advice for Taha.\nAnswer: Open answer, e.g. Turn off your phone while you study.\n\nPeriod 3:\nQ1 (Support level): What is the difference between proofreading and editing?\nAnswer: Proofreading means looking for errors; editing means correcting them.\nQ2 (Expected level): Correct: 'I recieved you're letter yesterday.'\nAnswer: I received your letter yesterday.\nQ3 (Advanced level): Write an informal opening line and closing line for a letter to a friend.\nAnswer: Open answer.\n\nPeriod 4:\nQ1 (Support level): What does 'emotional' mean?\nAnswer: Relating to feelings.\nQ2 (Expected level): Name two parts of a letter to a problem page.\nAnswer: e.g. greeting, the problem, a request for help, closing.\nQ3 (Advanced level): Write a three-point plan for a letter about too much homework.\nAnswer: Open answer.\n\nPeriod 5:\nQ1 (Support level): Match: transition = ?\nAnswer: A period of change.\nQ2 (Expected level): What is a hormone?\nAnswer: A chemical substance that causes changes in the body.\nQ3 (Advanced level): Write four sentences of a problem letter about pressure from parents.\nAnswer: Open answer: greeting, problem, a question, closing."], [10, "Notes within the Weekly Study Plan", "Period 1:\nStudents re-read the letters and underline words that show worry.\n\nPeriod 2:\nStudents write two pieces of advice for each of three imaginary letters.\n\nPeriod 3:\nStudents proofread their own paragraph from Theme 2 Time to Talk.\n\nPeriod 4:\nStudents finalise the plan at home.\n\nPeriod 5:\nFinal draft is attached to the first draft in the portfolio. Core words (CB p. 32) are tested in a spelling check at the end of Theme 2. WB pp. 28–29 (Review) are completed."]]}, {"label": "Theme 3 - Unit 1: Types of Tourism", "periods": [{"focus": "Introducing Theme 3: types of holidays (CB p. 33)", "week": "Week 9: 1/11 - 5/11", "num": 49, "fields": [[1, "Learning Outcomes", "1. Match photographs to types of holiday and name other types of tourism\n2. Explain the words in bold in the introduction"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Understand\nOutcome 2: Understand"], [3, "Strategies", "1. Participatory learning\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Illustrative picture\n3. Traditional board\n4. Pens\n5. Other (dictionary)"], [5, "Concepts", "1. sailing holiday\n2. camping trip\n3. history tour\n4. cruise\n5. safari holiday\n6. sightseeing tour\n7. adventure holiday\n8. tourist\n9. traveller"], [6, "Warm-up / Introduction / Prior Learning", "Asks: 'Where did you spend your last holiday? What did you do?'"], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Warm-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: share one memorable holiday.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: a class list of holiday activities.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Photos and types. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: match the seven photos to: sailing holiday, camping trip, history tour, cruise, safari holiday, sightseeing tour, adventure holiday.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: seven matched pairs.\n\nActivity 3 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Dangerous, cheap, relaxing or exciting?. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: classify the holidays as dangerous, cheap, relaxing or exciting and name other types of tourism (eco, medical, educational).\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a classification chart.\n\nActivity 4 (6 minutes):\n- Strategy: Participatory learning\n- Teacher: Wrap-up. Organises pair and whole-class sharing, invites different pairs to contribute and builds on their ideas. Task: pairs use two holiday words in sentences.\n- Student: Share ideas with a partner and then with the class, listening to and adding to others' answers. Product: two sentences."], [8, "Formative Assessment", "Q1 (Support level): What type of holiday is a trip on a big ship?\nAnswer: A cruise.\nQ2 (Expected level): Which holiday could be dangerous and which is cheap?\nAnswer: An adventure holiday could be dangerous; a camping trip is cheap.\nQ3 (Advanced level): Name two other types of tourism not in the photos and explain one.\nAnswer: e.g. eco-tourism (visiting natural areas), medical tourism (travelling for treatment)."], [9, "Summative Assessment", "Q1 (Support level): What do you do on a sightseeing tour?\nAnswer: See the famous places of a town or area.\nQ2 (Expected level): Which holiday is relaxing: a cruise or an adventure holiday?\nAnswer: A cruise.\nQ3 (Advanced level): Which type of holiday would you choose for your family and why?\nAnswer: Open answer with a reason."], [10, "Notes within the Weekly Study Plan", "Students read CB p. 34 (Unit 1 activities) and list holiday words they know."]]}, {"focus": "Listening: four tour operators; matching phrases to types of tourism (CB p. 34, Activity 1)", "week": "Week 9: 1/11 - 5/11", "num": 50, "fields": [[1, "Learning Outcomes", "1. Match phrases to wildlife, cultural, extreme sports and sailing holidays\n2. Check answers by listening"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Understand"], [3, "Strategies", "1. Cooperative learning\n2. Modeling"], [4, "Learning Resources", "1. Book\n2. Multimedia (audio-visual)\n3. Traditional board\n4. Pens"], [5, "Concepts", "1. wildlife holidays\n2. cultural tourism\n3. extreme sports tourism\n4. sailing holidays\n5. bungee jumping\n6. white water rafting\n7. whale watching\n8. yacht hire"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'bungee jumping' and asks what kind of holiday uses it."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Modelling key words. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models matching a phrase to a type by finding its key word (e.g. 'safari' → wildlife).\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a key-word strategy.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Match in pairs. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: match phrases a–h with the four types of tourism before listening.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a first matching.\n\nActivity 3 (12 minutes):\n- Strategy: Cooperative learning\n- Teacher: Listen and check. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: listen to the four speakers and correct the matching: 1 d, g; 2 c, f; 3 a, h; 4 b, e.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion. Product: a corrected matching.\n\nActivity 4 (6 minutes):\n- Strategy: Modeling\n- Teacher: Own examples. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: add one more phrase to each type.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: four new phrases."], [8, "Formative Assessment", "Q1 (Support level): Which type of tourism uses bungee jumping?\nAnswer: Extreme sports tourism.\nQ2 (Expected level): Which two phrases belong to cultural tourism?\nAnswer: Local festivals and museums and theatres.\nQ3 (Advanced level): Which phrases belong to sailing holidays and why?\nAnswer: Luxury yacht hire and experienced crews – both are connected with boats and sailing."], [9, "Summative Assessment", "Q1 (Support level): Which type is going on safari?\nAnswer: Wildlife holidays.\nQ2 (Expected level): Which two phrases belong to wildlife holidays?\nAnswer: Going on safari and whale watching.\nQ3 (Advanced level): Add two phrases of your own to extreme sports tourism.\nAnswer: Open answer, e.g. skydiving, rock climbing."], [10, "Notes within the Weekly Study Plan", "Students make a four-column chart of the types and phrases."]]}, {"focus": "Advertisements: matching with key words (CB p. 35, Activities 3–4 and Top Tip)", "week": "Week 9: 1/11 - 5/11", "num": 51, "fields": [[1, "Learning Outcomes", "1. Identify the type of holiday advertised in five advertisements\n2. Use key words to match phrases to advertisements"], [2, "Cognitive Level of Each Outcome", "Outcome 1: Analyze\nOutcome 2: Apply"], [3, "Strategies", "1. Modeling\n2. Cooperative learning"], [4, "Learning Resources", "1. Book\n2. Traditional board\n3. Pens\n4. Smart board"], [5, "Concepts", "1. advertisement\n2. key words\n3. adventure sports\n4. ice tourism\n5. painting holidays\n6. safari\n7. cooking holidays\n8. matching"], [6, "Warm-up / Introduction / Prior Learning", "Writes 'a hotel built entirely of ice' and asks what holiday that is."], [7, "Lesson Procedures / Teaching Activities", "Activity 1 (8 minutes):\n- Strategy: Modeling\n- Teacher: Top Tip model. Models the skill aloud (think-aloud), then guides practice with the students before independent practice. Task: models underlining key words in a phrase and finding them in the ads.\n- Student: Watch the model, practise with the teacher's guidance and then apply the skill independently. Product: a key-word matching strategy.\n\nActivity 2 (14 minutes):\n- Strategy: Cooperative learning\n- Teacher: Five ads. Forms groups with assigned roles (reader, recorder, speaker, timekeeper), explains the shared task and monitors and prompts each group. Task: read the advertisements and decide the type: a adventure sports, b ice tourism, c painting holidays, d safari, e cooking holidays; choose a new word from each ad and check its meaning.\n- Student: Each student performs a role, the group completes the shared task and presents its group product to the class for discussion.
