function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(){const L=DATA[st.lesson];const per=st.period+1;
 const mine=shuffle(L.q.filter(q=>q.p==per)).sort((a,b)=>a.l-b.l);
 const others=shuffle(L.q.filter(q=>q.p!=per)).sort((a,b)=>Math.abs(a.p-per)-Math.abs(b.p-per));
 let chosen=mine.slice(0,st.n);if(chosen.length<st.n)chosen=chosen.concat(others.slice(0,st.n-chosen.length));
 chosen=chosen.map((q,i)=>({...q,_r:Math.random()})).sort((a,b)=>a.l-b.l||a._r-b._r);
 return chosen.map(q=>{if(q.y==='t')return {...q,opts:['صواب ✓','خطأ ✗'],ans:q.a};
  const idx=shuffle(q.o.map((_,i)=>i));return {...q,opts:idx.map(i=>q.o[i]),ans:idx.indexOf(q.a)}})}

function pts(e){if(e<=30)return Math.round(1000-500*(e/30));return Math.max(100,Math.round(500-400*((e-30)/30)))}

 else qt.textContent=q.q;

  const s=document.createElement('span');s.textContent=t;b.appendChild(s);b.onclick=()=>answer(i);o.appendChild(b)});

 startTimer()}
const C=2*Math.PI*52;
function startTimer(){stopTimer();const arc=$('#arc');arc.style.strokeDasharray=C;game.t0=performance.now();let lastS=-1;

  if(e<=30){const rem=Math.ceil(30-e);$('#tnum').textContent=rem;$('#tlbl').textContent='ثانية';arc.style.strokeDashoffset=C*(e/30);arc.style.stroke=e>24?'#e7b65c':'#6a9fd4';if(rem<=5&&rem!==lastS){lastS=rem;SND.tick()}}

 if(ok){gained=pts(game.el);g.s+=gained;game.lastWin=game.cur;SND.ok();const gn=$('#gain');gn.textContent='+'+gained;gn.classList.remove('show');void gn.offsetWidth;gn.classList.add('show');
  $('#fb').className='feedback ok';$('#fb').textContent='إجابة صحيحة! أحسنت يا فريق «'+g.n+'» — حصلتم على '+gained+' نقطة.'}
 else{game.lastWin=-1;SND.bad();$('#fb').className='feedback bad';$('#fb').textContent=(i<0?'لم تُقدَّم إجابة. ':'إجابة غير صحيحة. ')+'الإجابة الصحيحة: '+q.opts[q.ans];
  if(q.y==='f'){const bl=$('#blank');bl.textContent=q.opts[q.ans];bl.classList.add('fill')}}
 renderGbar();
 const a=$('#acts');a.innerHTML='';const b=document.createElement('button');b.className='btn pri';b.textContent='عرض الترتيب 📊';b.onclick=board;a.appendChild(b)}
function board(){show('#sBoard');SND.board();const gs=game.groups;const max=Math.max(1,...gs.map(g=>g.s));
 const ranks=gs.map((g,i)=>i).sort((a,b)=>gs[b].s-gs[a].s);const rankOf={};ranks.forEach((gi,r)=>rankOf[gi]=r+1);
 const ch=$('#chart');ch.innerHTML='';
 gs.forEach((g,i)=>{const col=COLORS[g.c];const c=document.createElement('div');c.className='col'+(i===game.lastWin?' win':'');
  c.innerHTML='<div class="star">⭐</div><div class="bar"><div class="v">0</div></div><div class="rk"></div><div class="nm"></div>';
  const bar=c.querySelector('.bar');bar.style.background='linear-gradient(180deg,'+col[0]+','+col[1]+')';bar.style.height=Math.max(4,g.prev/max*100)+'%';
  c.querySelector('.rk').textContent='المركز '+rankOf[i];c.querySelector('.nm').textContent=g.n;c.querySelector('.nm').style.color=col[2];ch.appendChild(c);
  setTimeout(()=>{bar.style.height=Math.max(4,g.s/max*100)+'%';countUp(c.querySelector('.v'),g.prev,g.s)},80)});
 $('#bmsg').textContent=game.lastWin>=0?('⭐ فائزة السؤال: '+gs[game.lastWin].n):'لا فائز في هذا السؤال — السؤال القادم فرصة جديدة';
 $('#next').textContent=game.i+1<game.qs.length?'السؤال التالي ◀':'منصة التتويج 🏆'}
function countUp(el,a,b){const t0=performance.now();const d=1000;const f=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
$('#next').onclick=()=>{SND.click();game.i++;if(game.i<game.qs.length){show('#sPlay');ask()}else final()};
function final(){show('#sFinal');SND.win();const gs=game.groups.slice().sort((a,b)=>b.s-a.s);
 $('#fsum').textContent='الدرس: '+DATA[st.lesson].t+' — عدد الأسئلة: '+game.qs.length;
 const pod=$('#podium');pod.innerHTML='';const order=[1,0,2].filter(k=>k<gs.length);const H={0:260,1:190,2:140};const M=['🥇','🥈','🥉'];
 order.forEach((k,idx)=>{const g=gs[k];const col=COLORS[g.c];const d=document.createElement('div');d.className='pod';
  d.innerHTML='<div class="medal">'+M[k]+'</div><div class="nm"></div><div class="sc"></div><div class="blk">'+(k+1)+'</div>';
  d.querySelector('.nm').textContent=g.n;d.querySelector('.nm').style.color=col[2];d.querySelector('.sc').textContent=g.s+' نقطة';
  const blk=d.querySelector('.blk');blk.style.height=H[k]+'px';blk.style.background='linear-gradient(180deg,'+col[0]+','+col[1]+')';blk.style.animationDelay=(0.25+idx*0.25)+'s';pod.appendChild(d)});
 const rest=$('#rest');rest.innerHTML='';gs.slice(3).forEach((g,k)=>{const d=document.createElement('div');d.innerHTML='<span></span><b></b>';d.querySelector('span').textContent=(k+4)+'. '+g.n;d.querySelector('b').textContent=g.s+' نقطة';rest.appendChild(d)});
 confetti()}
$('#again').onclick=()=>{SND.click();show('#sSetup')};
$('#replay').onclick=()=>{$('#start').onclick()};
/* ---------- احتفال هادئ ---------- */
function confetti(){const cv=$('#fx');const x=cv.getContext&&cv.getContext('2d');if(!x)return;const W=cv.width=innerWidth,H=cv.height=innerHeight;const cols=['#9cc4ea','#f3c9c4','#b9e2c8','#f5dea0','#d8c4ee','#f8cfa8'];
 const ps=Array.from({length:120},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,r:4+Math.random()*5,vx:-.6+Math.random()*1.2,vy:1+Math.random()*1.6,a:Math.random()*6,va:-.05+Math.random()*.1,c:cols[Math.floor(Math.random()*cols.length)]}));
 const t0=performance.now();const f=t=>{x.clearRect(0,0,W,H);const alive=t-t0<6500;ps.forEach(p=>{p.x+=p.vx+Math.sin(p.a)*.4;p.y+=p.vy;p.a+=p.va;if(p.y>H+20&&alive){p.y=-20;p.x=Math.random()*W}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=.85;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  if(alive||ps.some(p=>p.y<H+20))requestAnimationFrame(f);else x.clearRect(0,0,W,H)};requestAnimationFrame(f)}
document.addEventListener('keydown',e=>{if(!$('#sPlay').classList.contains('on')||game.locked)return;const n=parseInt(e.key);if(n>=1&&n<=game.qs[game.i].opts.length)answer(n-1)});
</script></body></html>
