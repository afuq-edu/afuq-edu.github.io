\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\n1. بلاط الأرضية\n2. الأثاث في المنظور\n3. الترابط\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\n1. الخطوط النهائية\n2. خطوط الإنشاء\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\n1. التدرج اللوني\n2. العمق البصري\n3. الطبقة الأولى\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\n1. الظل الساقط\n2. التباين\n3. العمق البصري\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\n1. الإخراج النهائي\n2. النقد الفني", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nالتعلم القبلي: قواعد المنظور الهندسي والمفاهيم اللونية للعمق.\nيعرض المعلم صورة لرواق جامع بأقواس متتالية ويسأل: لماذا تبدو الأقواس أصغر كلما تقدمنا؟ ويربط الطالب التصغير بالبعد ونقطة التلاشي. (5 دقائق)\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nالتعلم القبلي: تحليل المشاهد الداخلية.\nيعرض المعلم لوحة الخياط (الشكل 9) ويسأل: من أين تدخل عينك اللوحة؟ وإلى أين تقودك؟ ويصف الطالب مسار العين نحو العمق. (5 دقائق)\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nالتعلم القبلي: تحليل المشاهد الداخلية.\nيطلب المعلم من الطلبة النظر إلى الجدار الأمامي للصف ويسأل: ما شكله من مكانك؟ وماذا عن الجدارين الجانبيين؟ ويلاحظ الطالب أن الأمامي مستطيل والجانبيين يميلان. (5 دقائق)\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nالتعلم القبلي: تخطيط المشهد وتحديد نقطة التلاشي.\nيسأل المعلم: من أين تبدأ خطوط زوايا الغرفة وإلى أين تتجه؟ ويجيب الطالب: من نقطة التلاشي عبر أركان الجدار الخلفي نحو إطار الورقة. (5 دقائق)\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nالتعلم القبلي: الجدران والسقف والأرضية المرسومة.\nيرسم المعلم نافذة على جدار جانبي بشكل مستطيل منتظم ويسأل: هل هذا صحيح؟ ويستنتج الطالب أن حوافها الأفقية يجب أن تتجه لنقطة التلاشي. (5 دقائق)\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nالتعلم القبلي: العناصر الجدارية المرسومة.\nيسأل المعلم: كيف نرسم بلاط الأرضية بحيث يصغر كلما ابتعد؟ ويقترح الطالب خطوطًا من نقطة التلاشي وخطوطًا أفقية متقاربة. (5 دقائق)\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nالتعلم القبلي: الرسم المنظوري المكتمل.\nيعرض المعلم رسمًا مزدحمًا بخطوط الإنشاء ويسأل: ما الذي يجب إزالته قبل التلوين؟ ويحدد الطالب خطوط الإنشاء الزائدة. (5 دقائق)\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nالتعلم القبلي: الرسم المنظوري المجهز.\nيسأل المعلم: أي الجدران أكثر إضاءة في الصف الآن؟ ولماذا؟ ويحدد الطالب الجدار المواجه للنافذة. (5 دقائق)\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nالتعلم القبلي: المساحات الكبيرة الملونة.\nيسأل المعلم: أين يسقط ظل الطاولة إذا كانت النافذة يمينًا؟ ويحدد الطالب الجهة المعاكسة للضوء. (5 دقائق)\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nالتعلم القبلي: المشهد الملون.\nيسأل المعلم: ما الذي يجعل المشاهد يشعر بأنه يستطيع الدخول إلى اللوحة؟ ويذكر الطالب العمق ودقة المنظور. (5 دقائق)", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية — زمن الحصة 40 دقيقة\n\n1. العمق في العمارة الإسلامية: يعرض المعلم صور عقود وأقواس ويوضح دورها في إبراز العمق، ويحدد الطالب اتجاه التلاشي في الصور (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التحليل الخطي: يوزع المعلم صورًا لمشاهد داخلية ويطلب تحديد خط الأفق ونقطة التلاشي والخطوط الأفقية والعمودية، ويحلل الطالب المشهد بالورق الشفاف (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. العرض: يعرض المعلم نماذج التحليل، ويشرح الطالب تحليله (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يستنتج المعلم أن المشاهد الداخلية المواجهة تعتمد غالبًا نقطة تلاشي واحدة، والطلبة يدون الاستنتاج (3 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري — زمن الحصة 40 دقيقة\n\n1. التحليل الفردي: يتابع المعلم التحليل بالورق الشفاف: خط الأفق، نقطة التلاشي، خطوط الرؤية، ويحلل الطالب اللوحة خطيًا (14 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n2. التدرج اللوني: يوجه المعلم إلى ملاحظة تدرج ألوان اللوحة من المقدمة للخلفية، والطلبة يدون ملاحظاته اللونية (6 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. المقارنة: يقارن المعلم التحليلات، ويقارن الطالب (1 دقيقة)\nالاستراتيجيات: الطاولة.\n\n4. الختام: يربط المعلم التحليل بالمشهد الذي سيرسمه، ويقترح الطالب مشهدًا داخليًا لرسمه (4 دقائق)\nالاستراتيجيات: السبورة.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم: تحديد نقطة الرؤية وخط الأفق، رسم الجدار الخلفي مستطيلًا، تحديد نقطة التلاشي داخله، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التخطيط: يتابع المعلم اختيار المشهد (غرفة صف، غرفة جلوس، رواق) وتخطيطه، ويحدد الطالب عناصر المنظور لمشهده (13 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n3. التحقق: يتحقق المعلم من موقع نقطة التلاشي، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يمهد المعلم لرسم خطوط الرؤية الجانبية، ويحفظ الطالب تخطيطه (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية — زمن الحصة 40 دقيقة\n\n1. التوضيح: يوضح المعلم مد الخطوط من نقطة التلاشي عبر أركان الجدار الخلفي، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. الرسم: يتابع المعلم رسم خطوط الرؤية وتحديد الأسطح، ويرسم الطالب خطوط الرؤية ويحدد الجدران والسقف والأرضية (16 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n3. التحقق: يتحقق المعلم من الاستقامة والالتقاء، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يمهد المعلم لرسم النوافذ والباب، ويحدد الطالب مواضع النوافذ والباب (4 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم رسم باب ونافذة على جدار جانبي بحواف تتجه لنقطة التلاشي، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: الطاولة.\n\n2. الرسم: يتابع المعلم رسم النوافذ والباب، ويرسم الطالب العناصر الجدارية (14 دقيقة)\nالاستراتيجيات: السبورة.\n\n3. التحقق: يتحقق المعلم من اتجاه الحواف، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: الأثاث).\n\n4. الختام: يمهد المعلم لإكمال التفاصيل، ويحدد الطالب التفاصيل الباقية (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث) — زمن الحصة 40 دقيقة\n\n1. البلاط: ينمذج المعلم تقسيم الأرضية إلى بلاط باستخدام خطوط الرؤية والخطوط الأفقية المتقاربة، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التفاصيل: يتابع المعلم إضافة الطاولة والسبورة والأثاث، ويكمل الطالب التفاصيل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التحقق: يتحقق المعلم من الترابط، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الختام: يطلب المعلم تقييمًا سريعًا قبل التحبير، ويحدد الطالب ما يحتاج تعديلًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين — زمن الحصة 40 دقيقة\n\n1. مراجعة الأقران: يوزع المعلم بطاقة فحص (خط الأفق، الالتقاء، الأحجام، التفاصيل)، ويفحص الطالب رسم زميله بالبطاقة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التصحيح والتأكيد: يتابع المعلم تصحيح الأخطاء وتخفيف خطوط الإنشاء وتأكيد الخطوط النهائية، ويصحح الطالب ويجهز رسمه (13 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n3. التحقق: يتحقق المعلم من جاهزية الرسم، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يمهد المعلم للتلوين بالألوان المائية، ويحدد الطالب خطة ألوانه (4 دقائق)\nالاستراتيجيات: الطاولة.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني — زمن الحصة 40 دقيقة\n\n1. الخطة: يوضح المعلم البدء بالطبقة الفاتحة وتحديد مصدر الضوء، ويحدد الطالب مصدر الضوء (4 دقائق)\nالاستراتيجيات: الأثاث).\n\n2. التلوين: يتابع المعلم تلوين الجدران والسقف والأرضية بتدرج، والطلبة يلون المساحات الكبيرة (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التحقق: يتحقق المعلم من التدرج، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يوجه المعلم لتنظيف الأدوات وترك العمل يجف، وينظف الطالب أدواته (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم تلوين قطعة أثاث وظلها الساقط، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التلوين: يتابع المعلم تلوين التفاصيل وإضافة الظلال، والطلبة يلون التفاصيل ويضيف الظلال (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. التحقق: يتحقق المعلم من اتساق الظلال، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n4. الختام: يمهد المعلم للإخراج والعرض، ويحدد الطالب اللمسات الأخيرة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده — زمن الحصة 40 دقيقة\n\n1. اللمسات الأخيرة: يتابع المعلم اللمسات الأخيرة وتحديد الإطار، ويكمل الطالب عمله (7 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. المعرض والنقد: ينظم المعلم معرضًا مصغرًا ونقدًا وفق: المنظور، العمق، الألوان، ويعرض الطالب وينقد (8 دقائق)\nالاستراتيجيات: الطاولة.\n\n3. أسئلة الكتاب: يطرح المعلم أسئلة الكتاب، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: السبورة.\n\n4. الختام: يلخص المعلم الدرس، ويلخص الطالب استفادته (2 دقيقتان)\nالاستراتيجيات: الأثاث).\n\n5. غلق الدرس – مجلس البيت العماني: تحدد المجموعات خطوط المنظور في مشهد داخلي لمجلس عماني تقليدي بنوافذه الخشبية ووسائده، ثم تتحدث عن قيمة الضيافة العمانية وتقديم القهوة والتمر للضيف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما القاعدة الأشيع في المشاهد الداخلية المواجهة؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (مستوى التطبيق): كيف تسهم الأقواس المتتالية في العمق البصري؟\nالإجابة: تصغر تدريجيًا نحو نقطة التلاشي فتوحي بالامتداد.\n\nس3 (مستوى الاستدلال): حلل صورة غرفة وحدد موقع الناظر منها.\nالإجابة: تحليل يحدد ارتفاع خط الأفق وموضع نقطة التلاشي.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا تحدد أولًا في التحليل الخطي للوحة؟\nالإجابة: خط الأفق.\n\nس2 (مستوى التطبيق): ما الذي يقود العين إلى عمق اللوحة؟\nالإجابة: خطوط الرؤية المتجهة إلى نقطة التلاشي.\n\nس3 (مستوى الاستدلال): كيف دعم اللون العمق في لوحة الخياط؟\nالإجابة: بتدرج الألوان من الداكن في المقدمة إلى الأفتح في العمق أو العكس بحسب الضوء.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما شكل الجدار الخلفي في منظور نقطة واحدة؟\nالإجابة: مستطيل بأبعاده الحقيقية.\n\nس2 (مستوى التطبيق): أين تقع نقطة التلاشي في المشهد الداخلي؟\nالإجابة: داخل الجدار الخلفي على خط الأفق.\n\nس3 (مستوى الاستدلال): ماذا يحدث إذا وضعت نقطة التلاشي قرب طرف الجدار؟\nالإجابة: يظهر جدار جانبي واسع والآخر ضيق.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كم خط رؤية يحدد زوايا الغرفة؟\nالإجابة: أربعة خطوط من الأركان الأربعة.\n\nس2 (مستوى التطبيق): كيف تميز السقف عن الأرضية؟\nالإجابة: السقف فوق خط الأفق والأرضية تحته.\n\nس3 (مستوى الاستدلال): لماذا يجب أن تمر الخطوط بنقطة التلاشي بدقة؟\nالإجابة: لأن أي انحراف يشوه العمق والأسطح.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): إلى أين تتجه الحواف الأفقية لنافذة على جدار جانبي؟\nالإجابة: إلى نقطة التلاشي.\n\nس2 (مستوى التطبيق): هل تبقى الحواف العمودية للباب عمودية؟\nالإجابة: نعم.\n\nس3 (مستوى الاستدلال): كيف ترسم نافذتين متساويتين على جدار جانبي؟\nالإجابة: تصغر الأبعد بحسب خطوط الرؤية رغم تساويهما في الواقع.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا تتقارب خطوط البلاط الأفقية كلما ابتعدت؟\nالإجابة: لأن المسافات تصغر بفعل البعد.\n\nس2 (مستوى التطبيق): كيف ترسم طاولة في منتصف الغرفة؟\nالإجابة: كصندوق تتجه خطوط عمقه إلى نقطة التلاشي نفسها.\n\nس3 (مستوى الاستدلال): حلل ترابط عناصر مشهدك.\nالإجابة: تحليل معلل.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما خطوط الإنشاء؟\nالإجابة: الخطوط المساعدة التي تُرسم لتحديد المنظور ثم تُخفف.\n\nس2 (مستوى التطبيق): لماذا نخفف خطوط الإنشاء قبل التلوين المائي؟\nالإجابة: لأن الألوان المائية شفافة فتظهر الخطوط الداكنة.\n\nس3 (مستوى الاستدلال): صمم معيارًا إضافيًا لبطاقة الفحص.\nالإجابة: مثال: تناسب أحجام الأثاث مع الغرفة.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا نبدأ بالمساحات الكبيرة؟\nالإجابة: لتأسيس الجو اللوني العام للمشهد.\n\nس2 (مستوى التطبيق): كيف يتغير لون الأرضية كلما ابتعدت؟\nالإجابة: يصبح أفتح أو أقل تشبعًا.\n\nس3 (مستوى الاستدلال): حلل أثر مصدر الضوء على ألوان الجدران.\nالإجابة: الجدار المقابل للضوء أفتح والجانبي الآخر أغمق.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): في أي جهة يقع الظل الساقط؟\nالإجابة: في الجهة المعاكسة لمصدر الضوء.\n\nس2 (مستوى التطبيق): كيف يؤكد التباين العمق؟\nالإجابة: بإبراز العناصر القريبة بتباين أقوى.\n\nس3 (مستوى الاستدلال): اقترح لونًا لظل على أرضية بيج.\nالإجابة: بني أو بنفسجي مخفف أغمق من البيج.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما معايير نقد المشهد الداخلي؟\nالإجابة: دقة المنظور، العمق البصري، انسجام الألوان.\n\nس2 (مستوى التطبيق): كيف يدل العمل على تطبيق نقطة تلاشي واحدة؟\nالإجابة: بالتقاء خطوط العمق في نقطة داخل الجدار الخلفي.\n\nس3 (مستوى الاستدلال): انقد عمل زميل نقدًا بنّاءً.\nالإجابة: نقد معلل.", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا تمثل الخطوط العمودية في المشهد الداخلي؟\nالإجابة: حواف الجدران والأبواب والنوافذ.\n\nس2 (مستوى التطبيق): اذكر عنصرين من العمارة الإسلامية يبرزان العمق.\nالإجابة: العقود والأقواس.\n\nس3 (مستوى الاستدلال): قارن بين مشهدين داخليين من حيث وضوح العمق.\nالإجابة: مقارنة معللة.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): من صاحب اللوحة المحللة؟\nالإجابة: الفنان محمد هشام الخياط.\n\nس2 (مستوى التطبيق): صف نقطة التلاشي في اللوحة.\nالإجابة: إجابة صحيحة بحسب التحليل.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في نجاح الفنان في إبراز العمق.\nالإجابة: رأي معلل.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المشهد الذي اخترته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف موقع خط الأفق في مشهدك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم اختيارك لموقع نقطة التلاشي.\nالإجابة: تقييم معلل.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الأسطح التي حددتها؟\nالإجابة: الجدار الخلفي والجداران الجانبيان والسقف والأرضية.\n\nس2 (مستوى التطبيق): صف ما ظهر أكثر في مشهدك: السقف أم الأرضية؟ ولماذا؟\nالإجابة: إجابة معللة بموقع خط الأفق.\n\nس3 (مستوى الاستدلال): قيّم دقة خطوط الرؤية لديك.\nالإجابة: تقييم معلل.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا رسمت على الجدران؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): اشرح كيف استعنت بخطوط الرؤية.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): صحح عنصرًا لا يتبع القاعدة في رسم زميل.\nالإجابة: تصحيح معلل.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر عنصرين أضفتهما.\nالإجابة: الطاولة والسبورة (أو غيرهما).\n\nس2 (مستوى التطبيق): صف طريقة رسم البلاط.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم مشهدك قبل التلوين.\nالإجابة: تقييم معلل.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر معيارين لفحص الرسم.\nالإجابة: التقاء الخطوط بنقطة التلاشي، وتناسب الأحجام.\n\nس2 (مستوى التطبيق): ما الخطأ الذي صححته؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم ملاحظة زميلك على رسمك.\nالإجابة: تقييم معلل.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المساحات التي لونتها؟\nالإجابة: الجدران والسقف والأرضية.\n\nس2 (مستوى التطبيق): صف التدرج في أرضيتك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم نظافة عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا أضفت في هذه الحصة؟\nالإجابة: التفاصيل والظلال.\n\nس2 (مستوى التطبيق): صف اتساق الظلال مع مصدر الضوء.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم وضوح العمق البصري.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما القاعدة المطبقة في المشهد الداخلي؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (مستوى التطبيق): احكم على عملك وفق المعايير.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا لعملك.\nالإجابة: إجابة إبداعية.", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nإرشاد للطالب: يلاحظ الممرات والقاعات من حوله ويحدد نقطة التلاشي.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جماليات العمارة الإسلامية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 54–55.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nإرشاد للطالب: يتأمل أعمال فنانين عمانيين وعرب.\nإرشاد لولي الأمر: يشجع ابنه على زيارة المعارض الفنية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nإرشاد للطالب: يلاحظ غرفة في منزله من زوايا مختلفة.\nإرشاد لولي الأمر: يتابع مع ابنه تخطيط مشهده.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nإرشاد للطالب: يلاحظ أركان الغرف وخطوطها.\nإرشاد لولي الأمر: يتابع دقة ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nإرشاد للطالب: يلاحظ النوافذ في الممرات الطويلة.\nإرشاد لولي الأمر: يتابع تقدم ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nإرشاد للطالب: يلاحظ الأثاث وأبعاده في الغرف.\nإرشاد لولي الأمر: يشجع ابنه على الإتقان.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 56.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nإرشاد للطالب: يحفظ رسمه نظيفًا.\nإرشاد لولي الأمر: يشجع ابنه على تقبل النقد.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 56.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nإرشاد للطالب: يلاحظ توزيع الضوء في غرف المنزل.\nإرشاد لولي الأمر: يتابع إنجاز ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 56.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nإرشاد للطالب: يتأمل الظلال داخل المنزل.\nإرشاد لولي الأمر: يتابع إتقان ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 56.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nإرشاد للطالب: يحتفظ بعمله في ملف إنجازه.\nإرشاد لولي الأمر: يشارك ابنه فرحة الإنجاز.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 54–56.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=3"]}, {"title": "الدرس الرابع: المنظور لمشهد خارجي", "unit": "الوحدة الثالثة: المنظور الهندسي", "periods": [{"ax": "تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي", "n": 1, "w": "الأسبوع السابع: من 18/10/2026 إلى 22/10/2026 – الحصة 1 من حصص الأسبوع", "pg": "57–58", "f": ["1. يحدد بالخطوط الأفقية والعمودية قواعد المنظور في مشاهد خارجية من العمارة والطبيعة (15 دقيقة)\n2. يوضح كيفية تطبيق قاعدة نقطتي التلاشي في رسم مشهد خارجي (15 دقيقة)\nمخرج آخر: يتذوق جماليات المشاهد الخارجية (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. الكتاب\n4. أخرى: ورق شفاف", "1. المشهد الخارجي\n2. نقطتا التلاشي\n3. زاوية النظر", "التعلم القبلي: قاعدة نقطتي التلاشي ورسم المشهد الداخلي.\nيعرض المعلم صورة لركن شارع ويسأل: كم اتجاهًا تتلاشى إليه الخطوط؟ ويحدد الطالب اتجاهين. (5 دقائق)", "1. العرض: يعرض المعلم مشاهد خارجية (حدائق، بنايات، بيوت عربية قديمة) ويوضح زاوية النظر، ويلاحظ الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ال بيعة (15 دقيقة)\n2. يوضح كيفية تطبيق قاعدة نقطتي التلاشي في رسم مشهد خارجي (15 دقيقة)\nمخرج آخر: يتذوق جماليات المشاهد الخارجية (10 دقائق)\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\n1. يحلل لوحة الفنان حسين عبيد لتوضيح العمق اللوني (15 دقيقة)\n2. يذكر دور الألوان الباردة والحارة في تأكيد المنظور اللوني (15 دقيقة)\nمخرج آخر: يقدر أعمال الفنانين العمانيين (10 دقائق)\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\n1. يستنتج قاعدة المنظور بنقطتي تلاشي من خلال تخطيط صور من العمارة الإسلامية (20 دقيقة)\n2. يستكشف تأثير القواعد في وضوح العمق في العقود والأقواس (10 دقائق)\nمخرج آخر: يوضح القيم الجمالية لعناصر العمارة الإسلامية (10 دقائق)\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\n1. يختار مشهدًا خارجيًا (حديقة عامة، بنايات، بيوت عربية قديمة) (5 دقائق)\n2. يحدد خط الأفق ونقطتي التلاشي وزاوية النظر في مساحة العمل (25 دقيقة)\nمخرج آخر: يخطط بعناية قبل التنفيذ (10 دقائق)\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\n1. يرسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر (10 دقائق)\n2. يرسم الكتل الرئيسة للمباني في المشهد (20 دقيقة)\nمخرج آخر: يلتزم بالدقة (10 دقائق)\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\n1. يكمل تفاصيل المشهد الخارجي من خلال خطوط الرؤية الوهمية (25 دقيقة)\n2. يضيف عناصر الطبيعة بأحجام متناسبة مع البعد (5 دقائق)\nمخرج آخر: يحقق الترابط بين عناصر المشهد (10 دقائق)\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\n1. يجرب الألوان الحارة والباردة على ورقة جانبية (15 دقيقة)\n2. يضع خطة لونية تؤكد العمق اللوني في المشهد (15 دقيقة)\nمخرج آخر: يتخذ قرارات لونية مدروسة (10 دقائق)\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\n1. يلون الخلفية والمستويات البعيدة بالألوان الباردة والفاتحة (25 دقيقة)\n2. يطبق التدرج اللوني لتأكيد العمق (5 دقائق)\nمخرج آخر: يهتم بنظافة العمل (10 دقائق)\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\n1. يلون المقدمة والعناصر القريبة بالألوان ال اج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\n1. صورة توضيحية\n2. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n3. الكتاب", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\n1. المشهد الخارجي\n2. نقطتا التلاشي\n3. زاوية النظر\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\n1. العمق اللوني\n2. الألوان الحارة والباردة\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\n1. التخطيط\n2. العقود والأقواس\n3. نقطتا التلاشي\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\n1. زاوية النظر\n2. خط الأفق\n3. نقطتا التلاشي\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\n1. خطوط الرؤية\n2. الكتل\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\n1. خطوط الرؤية الوهمية\n2. التفاصيل المعمارية\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\n1. الخطة اللونية\n2. الحار والبارد\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\n1. الخلفية\n2. المستويات البعيدة\n3. التدرج\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\n1. المقدمة\n2. التشبع\n3. العمق اللوني\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\n1. الإخراج النهائي\n2. تقويم الوحدة", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nالتعلم القبلي: قاعدة نقطتي التلاشي ورسم المشهد الداخلي.\nيعرض المعلم صورة لركن شارع ويسأل: كم اتجاهًا تتلاشى إليه الخطوط؟ ويحدد الطالب اتجاهين. (5 دقائق)\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nالتعلم القبلي: المنظور اللوني والألوان الحارة والباردة.\nيعرض المعلم لوحة حسين عبيد (الشكل 11) ويسأل: ما أبعد شيء في اللوحة؟ وكيف عرفت؟ ويستدل الطالب باللون والحجم. (5 دقائق)\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nالتعلم القبلي: تحليل المشاهد الخارجية.\nيعرض المعلم صورة قلعة نزوى أو جامع من الزاوية ويسأل: كيف نرسمها بدقة؟ ويقترح الطالب تخطيطها بخطوط الرؤية. (5 دقائق)\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nالتعلم القبلي: تخطيط صور من العمارة.\nيسأل المعلم: إذا كان مبناك مرتفعًا جدًا، فأين تضع خط الأفق لتُظهر شموخه؟ ويقترح الطالب خط أفق منخفضًا. (5 دقائق)\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nالتعلم القبلي: تخطيط المشهد الخارجي.\nيرسم المعلم صندوقًا كبيرًا بنقطتي تلاشي ويسأل: كيف يصبح هذا الصندوق بيتًا عربيًا؟ ويقترح الطالب إضافات. (5 دقائق)\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nالتعلم القبلي: الكتل الرئيسة المرسومة.\nيسأل المعلم: كيف نرسم صفًا من النخيل على الرصيف يبتعد؟ ويقترح الطالب تصغيرها وفق خطوط الرؤية. (5 دقائق)\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nالتعلم القبلي: المنظور اللوني والمشهد المرسوم.\nيسأل المعلم: إن رسمت البيوت البعيدة بالبرتقالي القوي، فماذا يحدث؟ ويتوقع الطالب أنها ستبدو قريبة. (5 دقائق)\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nالتعلم القبلي: الخطة اللونية.\nيسأل المعلم: لماذا نبدأ بالسماء والخلفية؟ ويجيب الطالب لأنها الأفتح والأبعد. (5 دقائق)\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nالتعلم القبلي: الخلفية الملونة.\nيسأل المعلم: كيف تجعل الباب القريب يبدو بارزًا؟ ويقترح الطالب لونًا حارًا متباينًا وظلًا. (5 دقائق)\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nالتعلم القبلي: المشهد الملون.\nيسأل المعلم: ما أهم ثلاثة أشياء تعلمتها في وحدة المنظور؟ ويذكر الطالب القواعد والعمق اللوني والإخراج. (5 دقائق)", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي — زمن الحصة 40 دقيقة\n\n1. العرض: يعرض المعلم مشاهد خارجية (حدائق، بنايات، بيوت عربية قديمة) ويوضح زاوية النظر، ويلاحظ الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التحليل: يوزع المعلم صورًا ويطلب تحديد خط الأفق ونقطتي التلاشي، ويحلل الطالب الصور (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. العرض: يعرض المعلم التحليلات، ويشرح الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يقارن المعلم بين المشهد الداخلي والخارجي، ويذكر الطالب الفرق (4 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني — زمن الحصة 40 دقيقة\n\n1. التحليل: يتابع المعلم التحليل الخطي واللوني للوحة، ويحلل الطالب خط الأفق والتلاشي والتدرج (13 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n2. الحار والبارد: يطلب المعلم تحديد مواضع الألوان الحارة والباردة في اللوحة، ويحدد الطالب المواضع ويربطها بالعمق (7 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. المقارنة: يقارن المعلم التحليلات، ويقارن الطالب (1 دقيقة)\nالاستراتيجيات: أبواب.\n\n4. الختام: يلخص المعلم أثر اللون في العمق، والطلبة يدون الخلاصة (4 دقائق)\nالاستراتيجيات: أشجار.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية — زمن الحصة 40 دقيقة\n\n1. التخطيط: يتابع المعلم تخطيط صورة من العمارة الإسلامية بخطوط الرؤية ونقطتي التلاشي، ويخطط الطالب الصورة (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. القيم الجمالية: يناقش المعلم جمال الأقواس والعقود في المنظور، ويذكر الطالب قيمة جمالية (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. العرض: يعرض المعلم نماذج، ويعرض الطالب (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يمهد المعلم لاختيار المشهد الخارجي، ويقترح الطالب مشهده (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم: خط الأفق ونقطتا التلاشي والحافة الأمامية للمبنى، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التخطيط: يتابع المعلم تحديد العناصر لمشهد كل طالب، ويخطط الطالب مشهده الخارجي (14 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحقق: يتحقق المعلم من التباعد بين نقطتي التلاشي، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يمهد المعلم لرسم خطوط الرؤية والكتل، ويحفظ الطالب تخطيطه (4 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة — زمن الحصة 40 دقيقة\n\n1. التوضيح: يوضح المعلم بناء الكتل كصناديق قبل التفاصيل، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. الرسم: يتابع المعلم رسم الكتل وخطوط الرؤية، ويرسم الطالب الكتل الرئيسة (16 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التحقق: يتحقق المعلم من الاتجاهات، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: أبواب.\n\n4. الختام: يمهد المعلم للتفاصيل، ويحدد الطالب التفاصيل (4 دقائق)\nالاستراتيجيات: أشجار.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة) — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم تقسيم الواجهة لنوافذ متساوية بخطوط وهمية، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التفاصيل: يتابع المعلم إضافة النوافذ والأبواب والأشجار والأرصفة، ويكمل الطالب التفاصيل (16 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التحقق: يتحقق المعلم من التناسب، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يطلب المعلم تخفيف خطوط الإنشاء، ويجهز الطالب الرسم للتلوين (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد — زمن الحصة 40 دقيقة\n\n1. التجريب: يتابع المعلم تجريب مزيج الألوان الحارة والباردة ودرجاتها، ويجرب الطالب المزائج (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الخطة: يطلب المعلم رسم مصغر للمشهد وتلوينه سريعًا كخطة، ويضع الطالب الخطة اللونية (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحقق: يراجع المعلم الخطط، ويعرض الطالب خطته (1 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يمهد المعلم للتلوين، ويثبت الطالب خطته (4 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم تلوين السماء رطبًا على رطب، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. التلوين: يتابع المعلم تلوين الخلفية والمستويات البعيدة، والطلبة يلون الخلفية (16 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التحقق: يتحقق المعلم من التدرج، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: أبواب.\n\n4. الختام: يوجه المعلم للتنظيف وترك العمل يجف، وينظف الطالب (4 دقائق)\nالاستراتيجيات: أشجار.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني — زمن الحصة 40 دقيقة\n\n1. التوضيح: يوضح المعلم زيادة التشبع والتفاصيل في المقدمة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التلوين: يتابع المعلم تلوين المقدمة والظلال، والطلبة يلون المقدمة ويؤكد العمق (16 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التحقق: يتحقق المعلم من التدرج من الحار للبارد، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يمهد المعلم للإخراج، ويحدد الطالب اللمسات الأخيرة (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة — زمن الحصة 40 دقيقة\n\n1. اللمسات الأخيرة: يتابع المعلم الإخراج، ويكمل الطالب عمله (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. المعرض والنقد: ينظم المعلم معرضًا ونقدًا بالمعايير، ويعرض الطالب وينقد (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. تقويم الوحدة: يدير المعلم مراجعة تفاعلية لأسئلة الوحدة، ويجيب الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: ينتقل المعلم للوحدة الأولى (الفن الإسلامي) وفق النشرة، ويلخص الطالب الوحدة (2 دقيقتان)\nالاستراتيجيات: التعلم بالملاحظة.\n\n5. غلق الدرس – ممر الفلج: ترسم المجموعات مخططًا سريعًا لفلج يمتد بين صفوف النخيل نحو نقطة التلاشي، ثم تذكر أهمية الأفلاج العمانية المدرجة في قائمة التراث العالمي وواجبنا في المحافظة عليها (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): متى نستخدم نقطتي التلاشي في المشهد الخارجي؟\nالإجابة: عندما نرى المباني من زاويتها.\n\nس2 (مستوى التطبيق): أين تقع نقطتا التلاشي غالبًا؟\nالإجابة: على خط الأفق وقد تقعان خارج حدود الورقة.\n\nس3 (مستوى الاستدلال): لماذا قد نضع نقطتي التلاشي خارج الورقة؟\nالإجابة: لتجنب التشوه وإظهار المبنى بنسب طبيعية.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من الفنان صاحب اللوحة المحللة؟\nالإجابة: حسين عبيد.\n\nس2 (مستوى التطبيق): أين وُظفت الألوان الباردة في اللوحة؟\nالإجابة: في المستويات البعيدة والخلفية غالبًا.\n\nس3 (مستوى الاستدلال): فسر كيف يتكامل المنظور الخطي واللوني في اللوحة.\nالإجابة: الخطوط تحدد الاتجاه نحو العمق والألوان تؤكد البعد بتدرجها.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا يحدث لأقواس رواق يُرى من زاوية؟\nالإجابة: تصغر وتتجه حوافها إلى نقطة تلاشي.\n\nس2 (مستوى التطبيق): كيف يساعد التخطيط على فهم المنظور؟\nالإجابة: بكشف خطوط الرؤية ونقاط التلاشي الخفية.\n\nس3 (مستوى الاستدلال): اقترح عنصرًا إسلاميًا يبرز العمق في مشهدك.\nالإجابة: أقواس متتالية أو صف أعمدة.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما أول خطوة في رسم المشهد الخارجي؟\nالإجابة: تحديد خط الأفق ونقطتي التلاشي.\n\nس2 (مستوى التطبيق): بماذا يوحي خط الأفق المنخفض؟\nالإجابة: بضخامة المباني وشموخها.\n\nس3 (مستوى الاستدلال): لماذا تُرسم الحافة الأمامية أولًا؟\nالإجابة: لأنها أقرب نقطة وتُبنى منها خطوط الرؤية.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف تبدأ رسم مبنى معقد؟\nالإجابة: بكتلة صندوقية بسيطة.\n\nس2 (مستوى التطبيق): إلى أين تتجه خطوط الواجهة اليسرى؟\nالإجابة: إلى نقطة التلاشي اليسرى.\n\nس3 (مستوى الاستدلال): كيف ترسم مبنيين متجاورين بارتفاعين مختلفين؟\nالإجابة: باستخدام نقطتي التلاشي نفسيهما مع تغيير الارتفاع.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بخطوط الرؤية الوهمية؟\nالإجابة: خطوط مساعدة تمتد إلى نقاط التلاشي لضبط التفاصيل ثم تُخفف.\n\nس2 (مستوى التطبيق): كيف تصغر الأشجار في البعد؟\nالإجابة: باتباع خطين يتجهان إلى نقطة التلاشي يحددان ارتفاعها.\n\nس3 (مستوى الاستدلال): حلل ترابط عناصر مشهدك.\nالإجابة: تحليل معلل.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا نجرب الألوان قبل التلوين؟\nالإجابة: لتجنب الأخطاء التي يصعب إصلاحها بالألوان المائية.\n\nس2 (مستوى التطبيق): اقترح لونًا للسماء البعيدة.\nالإجابة: أزرق فاتح مخفف.\n\nس3 (مستوى الاستدلال): كيف توازن بين الحار والبارد في مشهدك؟\nالإجابة: بالحار في المقدمة والبارد في البعيد مع لمسات مكررة للربط.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما أسلوب تلوين السماء المقترح؟\nالإجابة: لون رطب على سطح رطب.\n\nس2 (مستوى التطبيق): لماذا تكون الخلفية أقل تفصيلًا؟\nالإجابة: لأن العين لا ترى تفاصيل البعيد بوضوح.\n\nس3 (مستوى الاستدلال): حلل أثر خلفيتك على العمق.\nالإجابة: تحليل معلل.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا تكون ألوان المقدمة مشبعة؟\nالإجابة: لتبدو قريبة وواضحة.\n\nس2 (مستوى التطبيق): كيف تضيف ظل مبنى بالألوان المائية؟\nالإجابة: بطبقة شفافة أغمق في الجهة المعاكسة للضوء.\n\nس3 (مستوى الاستدلال): قيّم انتقال الألوان من المقدمة للخلفية في عملك.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما القاعدة المطبقة في المشهد الخارجي؟\nالإجابة: نقطتا التلاشي.\n\nس2 (مستوى التطبيق): ما دور الألوان الباردة في المشهد؟\nالإجابة: تأكيد البعد في الخلفية.\n\nس3 (مستوى الاستدلال): انقد عمل زميل نقدًا بنّاءً.\nالإجابة: نقد معلل.", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما القاعدة المناسبة لرسم ركن مبنى؟\nالإجابة: نقطتا تلاشي.\n\nس2 (مستوى التطبيق): حدد نقطتي التلاشي في صورة معروضة.\nالإجابة: تحديد صحيح.\n\nس3 (مستوى الاستدلال): قارن بين مشهد داخلي ومشهد خارجي من حيث القاعدة.\nالإجابة: الداخلي غالبًا نقطة واحدة والخارجي من الزاوية نقطتان.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما العمق اللوني؟\nالإجابة: الإحساس بالبعد الناتج من تدرج الألوان وتغير حرارتها.\n\nس2 (مستوى التطبيق): حدد لونًا حارًا في مقدمة اللوحة.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في توظيف الفنان للألوان.\nالإجابة: رأي معلل.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الصورة التي خططتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): حدد نقطتي التلاشي في تخطيطك.\nالإجابة: تحديد صحيح.\n\nس3 (مستوى الاستدلال): وضح قيمة جمالية لعنصر إسلامي في تخطيطك.\nالإجابة: إجابة معللة.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما مشهدك الخارجي؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف زاوية النظر التي اخترتها.\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (مستوى الاستدلال): قيّم اختيارك لموقع خط الأفق.\nالإجابة: تقييم معلل.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): كم كتلة رسمت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف اتجاه خطوط الواجهتين.\nالإجابة: كل واجهة تتجه إلى نقطة التلاشي في جهتها.\n\nس3 (مستوى الاستدلال): قيّم دقة رسمك.\nالإجابة: تقييم معلل.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر ثلاثة تفاصيل أضفتها.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف طريقة تقسيم الواجهة إلى نوافذ.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم مشهدك قبل التلوين.\nالإجابة: تقييم معلل.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما ألوان مقدمة مشهدك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف خطتك اللونية.\nالإجابة: إجابة شخصية واضحة.\n\nس3 (مستوى الاستدلال): قيّم خطتك من حيث تأكيد العمق.\nالإجابة: تقييم معلل.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الألوان التي استخدمتها للخلفية؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التدرج في سمائك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم نظافة عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الألوان الحارة في مقدمتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف كيف أكدت العمق اللوني.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): اقترح لمسة أخيرة تحسن عملك.\nالإجابة: إجابة معللة.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر ثلاث قواعد للمنظور درستها.\nالإجابة: نقطة تلاشي واحدة، نقطتا تلاشي، مستويات النظر.\n\nس2 (مستوى التطبيق): احكم على عملك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): كيف ستوظف المنظور في مجالات أخرى؟\nالإجابة: في التصميم الداخلي والتصوير والعمارة والرسوم التوضيحية.", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nإرشاد للطالب: يلاحظ أركان المباني في حيه.\nإرشاد لولي الأمر: يتحاور مع ابنه حول العمارة في الحي.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 57–58.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nإرشاد للطالب: يتأمل لوحات فنانين عمانيين.\nإرشاد لولي الأمر: يحدث ابنه عن الفن التشكيلي العماني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 58.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nإرشاد للطالب: يلاحظ عناصر العمارة الإسلامية في المساجد.\nإرشاد لولي الأمر: يزور مع ابنه معلمًا إسلاميًا إن تيسر.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 57–58.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nإرشاد للطالب: يلاحظ مشهدًا خارجيًا يرغب في رسمه.\nإرشاد لولي الأمر: يتابع مع ابنه خطته.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 58.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nإرشاد للطالب: يلاحظ أشكال المباني ككتل.\nإرشاد لولي الأمر: يتابع تقدم ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 58.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nإرشاد للطالب: يلاحظ تفاصيل الواجهات في حيه.\nإرشاد لولي الأمر: يشجع ابنه على الإتقان.\nالمرجع: دليل المع ويسأل: كم شكلًا هندسيًا يمكن أن يولد من هذه الدائرة؟ ويقترح الطالب نجومًا ومضلعات. (5 دقائق)\n\nالحصة 4: تصميم وحدات زخرفية إسلامية بالأدوات الهندسية محققًا التناسب الخطي\nالتعلم القبلي: تخطيط الوحدات الزخرفية.\nيعرض المعلم وحدتين إحداهما متناسبة الخطوط والأخرى غير متناسبة ويسأل: أيهما أجمل؟ ويختار الطالب ويعلل. (5 دقائق)\n\nالحصة 5: تلوين الوحدات الزخرفية وتحليلها وتقويم الدرس\nالتعلم القبلي: الوحدة الزخرفية المصممة.\nيعرض المعلم بلاطات إسلامية ملونة ويسأل: ما الألوان الغالبة؟ ويذكر الطالب الأزرق والفيروزي والذهبي. (5 دقائق)", "الحصة 1: مفهوم الفن الإسلامي ومجالاته الفنية — زمن الحصة 40 دقيقة\n\n1. المفهوم: يدير المعلم نقاشًا لاستنتاج مفهوم الفن الإسلامي وتأثره بالحضارات السابقة، ويشارك الطالب في صياغة المفهوم (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصنيف المجالات: يعرض المعلم صورًا ويطلب تحديد المجال الفني لكل منها (جدول المجالات ص 13)، ويصنف الطالب الصور بحسب المجال (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. خريطة ذهنية: يبني المعلم خريطة ذهنية للمجالات، ويكمل الطالب الخريطة (4 دقائق)\nالاستراتيجيات: التكرار.\n\n4. الختام: يمهد المعلم لخصائص الفن الإسلامي، ويذكر الطالب مجالين (3 دقائق)\nالاستراتيجيات: التماثل.\n\nالحصة 2: خصائص الفن الإسلامي (التجريد، التكرار، التماثل، كراهية الفراغ) — زمن الحصة 40 دقيقة\n\n1. الخصائص: يناقش المعلم الخصائص مستخدمًا جدول الأعمال والخاصية (ص 13)، ويربط كل عمل بخاصيته (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تحليل في مجموعات: يوزع المعلم صورًا ويطلب استخراج الخصائص منها، ويحلل الطالب ويستخرج الخصائص (11 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n3. المشاركة: يستمع المعلم للمجموعات، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: نباتية.\n\n4. الختام: يلخص المعلم الخصائص، ويذكر الطالب خاصيتين (4 دقائق)\nالاستراتيجيات: كتابية).\n\nالحصة 3: قواعد تخطيط الوحدات الزخرفية الإسلامية (هندسية، نباتية، كتابية) — زمن الحصة 40 دقيقة\n\n1. العرض التوضيحي: ينمذج المعلم تخطيط وحدة هندسية بتقسيم الدائرة، ووحدة نباتية بخطوط منحنية، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة: يتابع المعلم تخطيط وحدات وفق الشكل (1)، ويخطط الطالب وحدتين (14 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n3. الختام: يعرض المعلم نماذج، ويقيم الطالب تخطيطه (4 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 4: تصميم وحدات زخرفية إسلامية بالأدوات الهندسية محققًا التناسب الخطي — زمن الحصة 40 دقيقة\n\n1. المعيار: يوضح المعلم التناسب الخطي (تناسب سمك الخطوط وأطوالها وتوزيعها)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التصميم: يتابع المعلم تصميم وحدة هندسية أو نباتية، ويصمم الطالب وحدته (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الختام: يطلب المعلم تقييمًا ثنائيًا، ويقيم الطالب وحدة زميل (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 5: تلوين الوحدات الزخرفية وتحليلها وتقويم الدرس — زمن الحصة 40 دقيقة\n\n1. التلوين: يتابع المعلم التلوين بألوان متناسقة، والطلبة يلون وحدته (12 دقيقة)\nالاستراتيجيات: التماثل.\n\n2. التحليل والتقويم: ينظم المعلم عرضًا وتحليلًا وفق الخصائص، ويطرح أسئلة كتاب الطالب، ويحلل الطالب ويقيم (6 دقائق)\nالاستراتيجيات: كراهية الفراغ).\n\n3. الختام: يمهد المعلم لدرس الزخرفة الإسلامية وقواعد التماثل، ويذكر الطالب ما تعلمه (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n4. غلق الدرس – محطات الفن الإسلامي: تتنقل المجموعات بين بطاقات مجالات الفن الإسلامي (العمارة، الخزف، النسيج، المعادن، الخشب)، وتكتب على كل بطاقة مثالًا عمانيًا كالجوامع وفخار بهلا والخنجر والأبواب المنقوشة (5 دقائق)\nالاستراتيجيات: المحطات.", "الحصة 1: مفهوم الفن الإسلامي ومجالاته الفنية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بالفن الإسلامي؟\nالإجابة: فن نشأ في ظل الحضارة الإسلامية متأثرًا بالحضارات المحيطة ومعبرًا عن فكر منظم.\n\nس2 (مستوى التطبيق): اذكر ثلاثة مجالات للفن الإسلامي.\nالإجابة: العمارة والخزف والنسيج.\n\nس3 (مستوى الاستدلال): لماذا تنوعت مجالات الفن الإسلامي؟\nالإجابة: لارتباطها بحاجات الحياة اليومية والعمارة والعبادة.\n\nالحصة 2: خصائص الفن الإسلامي (التجريد، التكرار، التماثل، كراهية الفراغ)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بكراهية الفراغ؟\nالإجابة: ملء المساحة بالزخارف دون ترك فراغات.\n\nس2 (مستوى التطبيق): اذكر ثلاث خصائص للفن الإسلامي.\nالإجابة: التجريد والتكرار والتماثل.\n\nس3 (مستوى الاستدلال): كيف تعبر خاصية اللانهائية عن فكر الفنان المسلم؟\nالإجابة: بالامتداد المتكرر الذي يوحي بالاستمرار.\n\nالحصة 3: قواعد تخطيط الوحدات الزخرفية الإسلامية (هندسية، نباتية، كتابية)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما أساس الزخرفة الهندسية الإسلامية؟\nالإجابة: الأشكال الهندسية وتقسيمات الدائرة.\n\nس2 (مستوى التطبيق): بماذا تتميز الزخرفة النباتية الإسلامية؟\nالإجابة: بالخطوط المنحنية والأوراق والسيقان المجردة.\n\nس3 (مستوى الاستدلال): كيف تحول الكتابة إلى زخرفة؟\nالإجابة: بتشكيل الحروف وتكرارها في أشرطة ووحدات.\n\nالحصة 4: تصميم وحدات زخرفية إسلامية بالأدوات الهندسية محققًا التناسب الخطي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بالتناسب الخطي الزخرفي؟\nالإجابة: توافق سمك الخطوط وأطوالها وتوزيعها في الوحدة.\n\nس2 (مستوى التطبيق): اذكر أداتين هندسيتين.\nالإجابة: الفرجار والمسطرة.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يحسن التناسب في وحدة زميل.\nالإجابة: إجابة معللة.\n\nالحصة 5: تلوين الوحدات الزخرفية وتحليلها وتقويم الدرس\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اذكر لونين شائعين في الفن الإسلامي.\nالإجابة: الأزرق والفيروزي.\n\nس2 (مستوى التطبيق): ما خاصية الفن الإسلامي الظاهرة في وحدتك؟\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): انقد وحدة زميل.\nالإجابة: نقد معلل.", "الحصة 1: مفهوم الفن الإسلامي ومجالاته الفنية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صنف: صحن مزخرف مزجج.\nالإجابة: مجال الخزف.\n\nس2 (مستوى التطبيق): وضح تأثر الفن الإسلامي بالحضارات الأخرى.\nالإجابة: أخذ منها عناصر وطورها بروح إسلامية جديدة.\n\nس3 (مستوى الاستدلال): اقترح منتجًا معاصرًا يستلهم الفن الإسلامي.\nالإجابة: مثال: إضاءة معدنية مفرغة بزخارف هندسية.\n\nالحصة 2: خصائص الفن الإسلامي (التجريد، التكرار، التماثل، كراهية الفراغ)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الخاصية في زخرفة نباتية مبسطة لا تحاكي الواقع؟\nالإجابة: التجريد.\n\nس2 (مستوى التطبيق): حلل عملًا إسلاميًا واستخرج خاصيتين.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أي الخصائص ة المركبة", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nالتعلم القبلي: الوحدات الزخرفية الإسلامية.\nيطوي المعلم ورقة عليها نصف زخرفة ويفتحها ويسأل: ما الذي حدث؟ ويلاحظ الطالب تكون شكل متماثل. (5 دقائق)\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي\nالتعلم القبلي: قواعد التماثل.\nيسأل المعلم: إذا رسمنا ربع الزخرفة فقط، فكيف نكملها دون أخطاء؟ ويقترح الطالب الطي أو الورق الشفاف. (5 دقائق)\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي\nالتعلم القبلي: التماثل الربعي.\nيعرض المعلم شكل ورقة نبات ويسأل: هل جانباها متماثلان؟ ويلاحظ الطالب التماثل حول العرق الرئيس. (5 دقائق)\n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي\nالتعلم القبلي: الوحدتان المصممتان بالتماثل.\nيسأل المعلم: كيف يحافظ اللون على التماثل؟ ويقترح الطالب تلوين الأجزاء المتقابلة بالألوان نفسها. (5 دقائق)\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس\nالتعلم القبلي: التماثل النصفي والربعي.\nيعرض المعلم الشكل (4) زخرفة بالتماثل الثماني ويسأل: كم مرة تكررت الوحدة؟ ويعد الطالب ثماني مرات. (5 دقائق)", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية — زمن الحصة 40 دقيقة\n\n1. قواعد التماثل: يشرح المعلم الأنواع الثلاثة بالرسم على السبورة، ويميز الطالب بينها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. نماذج تاريخية: يعرض المعلم زخارف من حقب إسلامية (أموية، عباسية، أندلسية) ويطلب تحديد نوع التماثل، ويحلل الطالب النماذج (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. خريطة ذهنية: يلخص المعلم في خريطة ذهنية، ويكمل الطالب الخريطة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يمهد المعلم للتماثل الربعي، ويذكر الطالب الأنواع (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي — زمن الحصة 40 دقيقة\n\n1. الخطوات: ينمذج المعلم: رسم مربع وتقسيمه إلى أربعة، رسم الربع الأول من النقطة المركزية، استكمال الأجزاء، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التصميم: يتابع المعلم التصميم، ويصمم الطالب وحدته بالتماثل الربعي (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام: يتحقق المعلم من التقاء الأجزاء في المركز، ويعرض الطالب تصميمه (3 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي — زمن الحصة 40 دقيقة\n\n1. الخطوات: يوضح المعلم: رسم مستطيل يتوسطه خط رأسي، رسم النصف الأيمن، استكماله، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التصميم: يتابع المعلم التصميم، ويصمم الطالب وحدة بالتماثل النصفي (18 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. الختام: يعرض المعلم نماذج، ويقارن الطالب بين وحدتيه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي — زمن الحصة 40 دقيقة\n\n1. التوضيح: يوضح المعلم التلوين المتماثل واختيار مجموعة لونية متناغمة، ويختار مجموعته (4 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. التلوين: يتابع المعلم تلوين الوحدتين، والطلبة يلون وحدتيه (18 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. الختام: يعرض المعلم الأعمال، ويقيم الطالب التناغم (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس — زمن الحصة 40 دقيقة\n\n1. التماثل الثماني: يوضح المعلم التقسيم الثماني للدائرة ويتابع تصميمًا مبسطًا، ويصمم الطالب وحدة مبسطة بالتماثل الثماني (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. العرض والتقويم: ينظم المعلم عرضًا ويطرح أسئلة الكتاب، ويعرض الطالب ويجيب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الختام: يمهد المعلم لدرس عناصر العمارة، ويلخص الطالب الدرس (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. غلق الدرس – مرآة الزخرفة: يصمم كل زوج وحدة زخرفية بتماثل نصفي أو ربعي مستلهمة من زخارف جامع السلطان قابوس الأكبر أو الأبواب العمانية، ويخمّن الزوج المقابل نوع التماثل المستخدم (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما التماثل النصفي؟\nالإجابة: تطابق نصفي الوحدة حول محور واحد.\n\nس2 (مستوى التطبيق): كم محورًا في التماثل الربعي؟\nالإجابة: محوران متعامدان.\n\nس3 (مستوى الاستدلال): لماذا يكثر التماثل في الزخرفة الإسلامية؟\nالإجابة: لأنه يحقق النظام والاتزان والانسجام.\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من أين يبدأ رسم الربع الأول؟\nالإجابة: من النقطة المركزية.\n\nس2 (مستوى التطبيق): ما وظيفة الورق الشفاف هنا؟\nالإجابة: نقل الربع إلى الأرباع الأخرى بدقة.\n\nس3 (مستوى الاستدلال): حلل سبب عدم التقاء الأجزاء في وحدة زميل.\nالإجابة: خطأ في القياس أو موضع المركز.\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الخط الذي يقسم المستطيل في التماثل النصفي؟\nالإجابة: خط رأسي في المنتصف.\n\nس2 (مستوى التطبيق): أيهما أنسب لزخرفة إطار نافذة: النصفي أم الربعي؟\nالإجابة: النصفي لمناسبته الأشكال المستطيلة.\n\nس3 (مستوى الاستدلال): قارن بين التماثلين من حيث الإحساس.\nالإجابة: الربعي أكثر مركزية واستقرارًا والنصفي أكثر امتدادًا.\n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بالتناغم اللوني الزخرفي؟\nالإجابة: انسجام الألوان وتكرارها بإيقاع داخل الزخرفة.\n\nس2 (مستوى التطبيق): كيف يدعم اللون التماثل؟\nالإجابة: بتكرار الألوان نفسها في الأجزاء المتقابلة.\n\nس3 (مستوى الاستدلال): حلل المجموعة اللونية في وحدة زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كم قسمًا في التماثل الثماني؟\nالإجابة: ثمانية أقسام.\n\nس2 (مستوى التطبيق): كيف تقسم الدائرة إلى ثمانية أقسام؟\nالإجابة: بقطرين متعامدين ثم تنصيف الزوايا.\n\nس3 (مستوى الاستدلال): اقترح منتجًا يناسبه التماثل الثماني.\nالإجابة: غطاء صينية أو سقف قبة.", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر أنواع التماثل الثلاثة.\nالإجابة: النصفي والربعي والثماني.\n\nس2 (مستوى التطبيق): حدد نوع التماثل في زخرفة معروضة.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): اقترح نوع تماثل لنافذة مستطيلة وعلل.\nالإجابة: النصفي؛ لمناسبته الشكل المستطيل.\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): رتب خطوات التماثل الربعي.\nالإجابة: تقسيم المربع، رسم الربع، استكمال الأجزاء، التلوين.\n\nس2 (مستوى التطبيق): صف وحدتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم الانسجام الخطي في وحدتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أين يلتقي جزءا الوحدة؟\nالإجابة: على الخط الرأسي الذي ينصف المستطيل.\n\nس2 (مستوى التطبيق): ما نوع زخرفتك؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تطابق النصفين في وحدتك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما ألوان وحدتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف كيف حققت التناغم.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر أنواع التماثل.\nالإجابة: النصفي والربعي والثماني.\n\nس2 (مستوى التطبيق): أي أعمالك أفضل؟ علل.\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): صمم تحديًا لزميلك في التماثل.\nالإجابة: إجابة إبداعية.", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nإرشاد للطالب: يلاحظ التماثل في الزخارف من حوله.\nإرشاد لولي الأمر: يناقش ابنه في الزخارف المتماثلة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 15–16.\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي\nإرشاد للطالب: يحتفظ بتصميمه للتلوين.\nإرشاد لولي الأمر: يتابع دقة ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 16.\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي\nإرشاد للطالب: يلاحظ التماثل في الطبيعة.\nإرشاد لولي الأمر: يشجع ابنه على الملاحظة.\nالمرجع: دليل المعلم (الفنون التشكيلية – المخرج 3: تقييم", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\n1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التعلم بالممارسة العملية\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\n1. التعلم الذاتي\n2. التعلم التشاركي\n3. التعلم بالممارسة العملية\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\n1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. التعلم بالممارسة العملية\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\n1. التعلم التشاركي\n2. التعلم الذاتي\n3. التقويم الذاتي", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. الكتاب\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\n1. أخرى: أقلام رصاص، أدوات هندسية، أوراق رسم\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\n1. أخرى: أقلام رصاص، أدوات هندسية، أوراق رسم\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\n1. صورة توضيحية\n2. أخرى: ألوان مائية، فرش\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\n1. صورة توضيحية\n2. الكتاب\n3. الوسائل الاجتماعية", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\n1. القبة\n2. المئذنة\n3. العقد\n4. البرج\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\n1. الدراسة الخطية\n2. النسب المعمارية\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\n1. التناسب الخطي الزخرفي\n2. الشريط الزخرفي\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\n1. التناغم اللوني الزخرفي\n2. الألوان المائية\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\n1. الإخراج\n2. النقد الفني", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\nالتعلم القبلي: خصائص الفن الإسلامي.\nيعرض المعلم صورة جامع السلطان قابوس الأكبر ويسأل: ما العناصر المعمارية التي تراها؟ ويذكر الطالب القبة والمئذنة والأقواس. (5 دقائق)\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\nالتعلم القبلي: تحليل عناصر العمارة.\nيرسم المعلم قبة بخط واحد ويسأل: ما الذي ينقصها لتصبح قبة إسلامية؟ ويقترح الطالب الرقبة والهلال والزخارف. (5 دقائق)\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\nالتعلم القبلي: العنصر المعماري المرسوم والوحدات الزخرفية.\nيعرض المعلم الشكل (12) ويسأل: أين وضع الفنان الزخارف في العنصر المعماري؟ ويحدد الطالب الأشرطة والمساحات. (5 دقائق)\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\nالتعلم القبلي: العنصر المزخرف.\nيعرض المعلم الشكل (13) ويسأل: كيف ميز الفنان الزخارف عن العنصر نفسه؟ ويلاحظ الطالب اختلاف الألوان وتناغمها. (5 دقائق)\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\nالتعلم القبلي: العنصر الملون.\nيسأل المعلم: كيف نعرض أعمالنا بطريقة تليق بالعمارة الإسلامية؟ ويقترح الطالب أفكار عرض. (5 دقائق)", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية — زمن الحصة 40 دقيقة\n\n1. العناصر: يعرض المعلم صور عناصر العمارة الإسلامية (الشكل 11)، ويسمي الطالب العناصر (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التحليل: يوزع المعلم صورًا من حقب مختلفة ويطلب تحليل خصائصها، ويحلل الطالب مع مجموعته (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. المشاركة: يستمع المعلم للمجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: مئذنة.\n\n4. الختام: يطلب المعلم اختيار عنصر لرسمه، ويختار الطالب عنصرًا (3 دقائق)\nالاستراتيجيات: برج قلعة).\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة) — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم رسم قبة متماثلة بمحور رأسي، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. الرسم: يتابع المعلم الرسم، ويرسم الطالب عنصره المعماري (16 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. الختام: يراجع المعلم الرسوم، ويقيم الطالب رسمه (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي — زمن الحصة 40 دقيقة\n\n1. التوزيع: يوضح المعلم توزيع الزخارف على أجزاء العنصر في أشرطة ومساحات، ويحدد الطالب مواضع الزخرفة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الزخرفة: يتابع المعلم الزخرفة، ويزخرف الطالب عنصره (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الختام: يعرض المعلم نماذج، ويقيم الطالب التناسب (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي — زمن الحصة 40 دقيقة\n\n1. التلوين: يتابع المعلم التلوين، والطلبة يلون عنصره (18 دقيقة)\nالاستراتيجيات: برج قلعة).\n\n2. المراجعة: يطلب المعلم ملاحظة سريعة من زميل، ويعدل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. الختام: يوجه المعلم للتنظيف، وينظف الطالب (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس — زمن الحصة 40 دقيقة\n\n1. الإخراج: يتابع المعلم اللمسات الأخيرة والإطار، ويُخرج الطالب عمله (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. العرض والنقد: ينظم المعلم معرضًا ويطرح أسئلة الكتاب، ويعرض الطالب وينقد ويجيب (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. التلخيص: يلخص المعلم الدرس بخريطة ذهنية، ويكمل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يمهد المعلم لفنون العمارة العمانية، ويذكر الطالب عنصرًا عمانيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – لغز البرج والمئذنة: تصف كل مجموعة عنصرًا معماريًا (البرج، الشرفة، العقد، القبة، المئذنة) دون ذكر اسمه، ويخمّن الآخرون العنصر ويذكرون معلمًا عمانيًا يظهر فيه (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): سمِّ ثلاثة عناصر معمارية إسلامية.\nالإجابة: القبة والمئذنة والعقد.\n\nس2 (مستوى التطبيق): ما وظيفة المئذنة؟\nالإجابة: رفع الأذان، وهي عنصر جمالي مميز.\n\nس3 (مستوى الاستدلال): حلل سبب انتشار القباب في العمارة الإسلامية.\nالإجابة: لاعتبارات إنشائية وجمالية ورمزية وتحسين الصوت والتهوية.\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا نبدأ بالمحور الرأسي في رسم القبة؟\nالإجابة: لضمان التماثل.\n\nس2 (مستوى التطبيق): اذكر أجزاء القبة.\nالإجابة: القاعدة (الرقبة) والجسم والقمة.\n\nس3 (مستوى الاستدلال): حلل نسب عنصر زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أين توضع الزخارف عادة في المئذنة؟\nالإجابة: في أشرطة أفقية حول جسمها.\n\nس2 (مستوى التطبيق): كيف تحقق التناسب الخطي الزخرفي؟\nالإجابة: بتناسب حجم الزخرفة مع حجم الجزء المعماري.\n\nس3 (مستوى الاستدلال): اقترح زخرفة كتابية مناسبة لقبة.\nالإجابة: شريط كتابي حول الرقبة بعبارة مناسبة.\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما القيمة اللونية المستهدفة؟\nالإجابة: التناغم اللوني الزخرفي.\n\nس2 (مستوى التطبيق): كيف تبرز الزخرفة عن الجدار؟\nالإجابة: بلون متباين متناسق.\n\nس3 (مستوى الاستدلال): حلل ألوان عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما معايير تقويم عملك؟\nالإجابة: دقة الرسم، التناسب الزخرفي، التناغم اللوني.\n\nس2 (مستوى التطبيق): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nس3 (مستوى الاستدلال): اقترح استخدامًا لعملك في المدرسة.\nالإجابة: إجابة معللة.", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما العنصر المعماري في برج قلعة نزوى؟\nالإجابة: البرج.\n\nس2 (مستوى التطبيق): حلل خاصيتين لعنصر معماري.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): قارن بين عنصرين من حقبتين.\nالإجابة: مقارنة معللة.\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما العنصر الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف كيف حققت التماثل.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم رسمك.\nالإجابة: تقييم معلل.\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع الزخرفة التي استخدمتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف توزيع زخارفك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم التناسب في عملك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما ألوان عنصرك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التناغم في عملك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر عنصرين معماريين.\nالإجابة: القبة والمئذنة.\n\nس2 (مستوى التطبيق): احكم على عملك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): صمم فكرة لمعرض عن العمارة الإسلامية.\nالإجابة: إجابة إبداعية.", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\nإرشاد للطالب: يلاحظ عناصر العمارة في مسجد حيه.\nإرشاد لولي الأمر: يزور مع ابنه معلمًا تراثيًا إن تيسر.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 19–20.\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\nإرشاد للطالب: يتأمل القباب والمآذن.\nإرشاد لولي الأمر: يتابع رسم ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 20.\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\nإرشاد للطالب: يلاحظ الأشرطة الزخرفية في المساجد.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 20–21.\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\nإرشاد للطالب: يحتفظ بعمله.\nإرشاد لولي الأمر: يطلع على عمل ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 21.\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\nإرشاد للطالب: يحتفظ بعمله في ملف الإنجاز.\nإرشاد لولي الأمر: يشجع ابنه على المشاركة في المعارض.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 19–21.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu. لقبلي: عناصر العمارة الإسلامية.\nيعرض المعلم صورتين: بيت طيني قديم ومبنى حكومي حديث بطابع عماني ويسأل: ما المشترك بينهما؟ ويذكر الطالب الأقواس والشرفات والألوان الترابية. (5 دقائق)\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية\nالتعلم القبلي: خصائص العمارة العمانية.\nيعرض المعلم إعلانًا سياحيًا عن عمان ويسأل: ما الذي يجذبك فيه؟ ويحلل الطالب العناصر الجاذبة. (5 دقائق)\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية\nالتعلم القبلي: العناصر المختارة.\nيعرض المعلم الشكل (15) ويسأل: كيف رتب المصمم العناصر لتبدو بعضها قريبة؟ ويلاحظ الطالب الحجم والتداخل. (5 دقائق)\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية\nالتعلم القبلي: التصميم المرسوم.\nيعرض المعلم الشكل (16) ويسأل: كيف برزت المباني عن الخلفية؟ ويلاحظ الطالب التضاد. (5 دقائق)\n\nالحصة 5: إضافة النص الإعلاني وإخراج الإعلان وعرضه وتقويم الوحدة\nالتعلم القبلي: التصميم الملون.\nيسأل المعلم: ما مواصفات العبارة الإعلانية الناجحة؟ ويذكر الطالب القصر والوضوح والجاذبية. (5 دقائق)", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة — زمن الحصة 40 دقيقة\n\n1. الخصائص: يعرض المعلم الشكل (14) ويوضح الخصائص، والطلبة يدون الخصائص (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التحليل: يطلب المعلم تحليل نماذج قديمة وحديثة ومقارنتها، ويحلل الطالب ويقارن (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. المشاركة: يستمع المعلم للمجموعات، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يمهد المعلم لتصميم الإعلان، ويختار الطالب عناصر لإعلانه (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية — زمن الحصة 40 دقيقة\n\n1. الخطوات: يوضح المعلم خطوات التصميم: الفكرة، العناصر، التنظيم، التلوين، النص، والطلبة يدون (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يدير المعلم عصفًا لأفكار إعلانات (السياحة، الهوية، معرض)، ويقترح الطالب فكرته (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. تحديد العناصر: يتابع المعلم رسم مخططات أولية للعناصر، ويحدد الطالب عناصره ويرسمها مبدئيًا (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يراجع المعلم الخطط، ويعرض الطالب خطته (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية — زمن الحصة 40 دقيقة\n\n1. التوضيح: يوضح المعلم التنويع بين القديم والحديث والتفاوت في الأحجام، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التصميم: يتابع المعلم ترتيب العناصر، ويصمم الطالب الإعلان (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الختام: يعرض المعلم نماذج، ويقيم الطالب تصميمه (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية — زمن الحصة 40 دقيقة\n\n1. التلوين: يتابع المعلم التلوين، والطلبة يلون تصميمه (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المراجعة: يطلب المعلم ملاحظة زميل، ويعدل الطالب (4 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. الختام: يمهد المعلم لإضافة النص، ويحدد الطالب النص (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 5: إضافة النص الإعلاني وإخراج الإعلان وعرضه وتقويم الوحدة — زمن الحصة 40 دقيقة\n\n1. النص: يتابع المعلم اختيار النص وخطه وموضعه، ويضيف الطالب النص (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. العرض: ينظم المعلم معرضًا للإعلانات، ويعرض الطالب ويقيم (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. تقويم الوحدة: يطرح المعلم أسئلة مراجعة الوحدة، ويجيب الطالب (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يقترح المعلم نشر الإعلانات في المدرسة، ويقترح الطالب مكانًا للعرض (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – مرشدون في بهلا: يؤدي الطلبة دور مرشدين سياحيين، فتقدم كل مجموعة في دقيقة خصائص معلم عماني قديم أو حديث (قلعة بهلا، دار الأوبرا السلطانية مسقط) لزائر يمثله أحد زملائهم (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اذكر معلمًا عمانيًا حديثًا.\nالإجابة: برج الصحوة (أو برج الساعة بجامعة السلطان قابوس).\n\nس2 (مستوى التطبيق): ما الألوان الغالبة في العمارة العمانية القديمة؟\nالإجابة: الألوان الترابية.\n\nس3 (مستوى الاستدلال): كيف حافظت العمارة الحديثة على الطابع العماني؟\nالإجابة: باستخدام الأقواس والشرفات والزخارف واللون الأبيض والترابي.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): رتب خطوات تصميم الإعلان.\nالإجابة: الفكرة، العناصر، التنظيم، التلوين، النص.\n\nس2 (مستوى التطبيق): لماذا نجمع بين القديم والحديث؟\nالإجابة: لإظهار استمرار الهوية مع التطور.\n\nس3 (مستوى الاستدلال): اقترح فكرة إعلان مبتكرة.\nالإجابة: إجابة إبداعية.\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف توحي بأن عنصرًا بعيد؟\nالإجابة: بتصغيره ووضعه أعلى خلف العناصر الأخرى.\n\nس2 (مستوى التطبيق): ما قيمة الدرس؟\nالإجابة: التناسب الشكلي مع الأرضية.\n\nس3 (مستوى الاستدلال): حلل ترتيب زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما التضاد اللوني؟\nالإجابة: اختلاف قوي بين لون الشكل ولون الأرضية.\n\nس2 (مستوى التطبيق): اقترح خلفية لمبنى أبيض.\nالإجابة: خلفية زرقاء أو داكنة.\n\nس3 (مستوى الاستدلال): حلل التضاد في عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: إضافة النص الإعلاني وإخراج الإعلان وعرضه وتقويم الوحدة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما مواصفات النص الإعلاني؟\nالإجابة: قصير وواضح وجذاب.\n\nس2 (مستوى التطبيق): كيف ينسجم النص مع التصميم؟\nالإجابة: بخط ولون وموضع مناسب.\n\nس3 (مستوى الاستدلال): انقد إعلانًا.\nالإجابة: نقد معلل.", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صنف: قلعة نزوى.\nالإجابة: عمارة عمانية قديمة.\n\nس2 (مستوى التطبيق): قارن بين بيت قديم ومبنى حديث.\nالإجابة: مقارنة معللة.\n\nس3 (مستوى الاستدلال): اقترح عنصرًا عمانيًا لمبنى حديث.\nالإجابة: إجابة معللة.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما فكرة إعلانك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): اذكر العناصر التي اخترتها.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم مناسبة العناصر للفكرة.\nالإجابة: تقييم معلل.\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): كم عنصرًا في تصميمك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف ترتيب العناصر.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم التناسب في تصميمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما ألوان تصميمك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التضاد في عملك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 5: إضافة النص الإعلاني وإخراج الإعلان وعرضه وتقويم الوحدة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر قيمتين حققتهما.\nالإجابة: التناسب الشكلي والتضاد اللوني.\n\nس2 (مستوى التطبيق): احكم على إعلانك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): كيف يمكن تسويق مهارة تصميم الإعلانات؟\nالإجابة: بتصميم إعلانات للمؤسسات والمحلات مقابل أجر.", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة\nإرشاد للطالب: يلاحظ الطابع العماني في مباني ولايته.\nإرشاد لولي الأمر: يحدث ابنه عن البيوت العمانية القديمة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 22–23.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية\nإرشاد للطالب: يجمع صورًا لمعالم عمانية.\nإرشاد لولي الأمر: يساعد ابنه في اختيار المعالم.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 23.\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية\nإرشاد للطالب: يحتفظ بتصميمه.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 23.\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية\nإرشاد للطالب: يلاحظ التضاد في اللوحات الإرشادية.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (ا
