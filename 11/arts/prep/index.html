ية الفراغ)\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. الكتاب\n\nالحصة 3: قواعد تخطيط الوحدات الزخرفية الإسلامية (هندسية، نباتية، كتابية)\n1. السبورة الذكية\n2. الكتاب\n3. أخرى: أقلام رصاص، أدوات هندسية، أوراق رسم\n\nالحصة 4: تصميم وحدات زخرفية إسلامية بالأدوات الهندسية محققًا التناسب الخطي\n1. أخرى: أقلام رصاص، أدوات هندسية، أوراق رسم\n\nالحصة 5: تلوين الوحدات الزخرفية وتحليلها وتقويم الدرس\n1. صورة توضيحية\n2. الكتاب\n3. أخرى: ألوان مائية أو خشبية", "الحصة 1: مفهوم الفن الإسلامي ومجالاته الفنية\n1. الفن الإسلامي\n2. المجالات الفنية\n\nالحصة 2: خصائص الفن الإسلامي (التجريد، التكرار، التماثل، كراهية الفراغ)\n1. التجريد\n2. التكرار\n3. التماثل\n4. كراهية الفراغ\n5. اللانهائية\n\nالحصة 3: قواعد تخطيط الوحدات الزخرفية الإسلامية (هندسية، نباتية، كتابية)\n1. الوحدة الزخرفية\n2. الزخرفة الهندسية\n3. الزخرفة النباتية\n4. الزخرفة الكتابية\n\nالحصة 4: تصميم وحدات زخرفية إسلامية بالأدوات الهندسية محققًا التناسب الخطي\n1. التناسب الخطي الزخرفي\n2. التصميم الزخرفي\n\nالحصة 5: تلوين الوحدات الزخرفية وتحليلها وتقويم الدرس\n1. الألوان في الفن الإسلامي\n2. النقد الفني", "الحصة 1: مفهوم الفن الإسلامي ومجالاته الفنية\nالتعلم القبلي: الزخارف الإسلامية في البيئة المحيطة.\n\nالتهيئة:\n- المعلم: يعرض صور قطع إسلامية (إبريق معدني، سجادة، صحن خزفي، باب خشبي) ويسأل: ما الذي يجمع هذه القطع؟\n- الطالب: يلاحظ الزخارف المتشابهة.\n\nالحصة 2: خصائص الفن الإسلامي (التجريد، التكرار، التماثل، كراهية الفراغ)\nالتعلم القبلي: مجالات الفن الإسلامي.\n\nالتهيئة:\n- المعلم: يعرض بلاطة زخرفية ويسأل: لو مددنا الزخرفة، فأين تنتهي؟\n- الطالب: يلاحظ إمكانية امتدادها بلا نهاية.\n\nالحصة 3: قواعد تخطيط الوحدات الزخرفية الإسلامية (هندسية، نباتية، كتابية)\nالتعلم القبلي: خصائص الفن الإسلامي.\n\nالتهيئة:\n- المعلم: يرسم دائرة ويقسمها على السبورة ويسأل: كم شكلًا هندسيًا يمكن أن يولد من هذه الدائرة؟\n- الطالب: يقترح نجومًا ومضلعات.\n\nالحصة 4: تصميم وحدات زخرفية إسلامية بالأدوات الهندسية محققًا التناسب الخطي\nالتعلم القبلي: تخطيط الوحدات الزخرفية.\n\nالتهيئة:\n- المعلم: يعرض وحدتين إحداهما متناسبة الخطوط والأخرى غير متناسبة ويسأل: أيهما أجمل؟\n- الطالب: يختار ويعلل.\n\nالحصة 5: تلوين الوحدات الزخرفية وتحليلها وتقويم الدرس\nالتعلم القبلي: الوحدة الزخرفية المصممة.\n\nالتهيئة:\n- المعلم: يعرض بلاطات إسلامية ملونة ويسأل: ما الألوان الغالبة؟\n- الطالب: يذكر الأزرق والفيروزي والذهبي.", "الحصة 1: مفهوم الفن الإسلامي ومجالاته الفنية\nالتهيئة (5 دقائق):\n- المعلم: يعرض صور قطع إسلامية (إبريق معدني، سجادة، صحن خزفي، باب خشبي) ويسأل: ما الذي يجمع هذه القطع؟\n- الطالب: يلاحظ الزخارف المتشابهة.\n\nالمفهوم (10 دقائق):\n- المعلم: يدير نقاشًا لاستنتاج مفهوم الفن الإسلامي وتأثره بالحضارات السابقة.\n- الطالب: يشارك في صياغة المفهوم.\n\nتصنيف المجالات (15 دقيقة):\n- المعلم: يعرض صورًا ويطلب تحديد المجال الفني لكل منها (جدول المجالات ص 13).\n- الطالب: يصنف الصور بحسب المجال.\n\nخريطة ذهنية (5 دقائق):\n- المعلم: يبني خريطة ذهنية للمجالات.\n- الطالب: يكمل الخريطة.\n\nالختام (5 دقائق):\n- المعلم: يمهد لخصائص الفن الإسلامي.\n- الطالب: يذكر مجالين.\n\nالحصة 2: خصائص الفن الإسلامي (التجريد، التكرار، التماثل، كراهية الفراغ)\nالتهيئة (5 دقائق):\n- المعلم: يعرض بلاطة زخرفية ويسأل: لو مددنا الزخرفة، فأين تنتهي؟\n- الطالب: يلاحظ إمكانية امتدادها بلا نهاية.\n\nالخصائص (12 دقيقة):\n- المعلم: يناقش الخصائص مستخدمًا جدول الأعمال والخاصية (ص 13).\n- الطالب: يربط كل عمل بخاصيته.\n\nتحليل في مجموعات (15 دقيقة):\n- المعلم: يوزع صورًا ويطلب استخراج الخصائص منها.\n- الطالب: يحلل ويستخرج الخصائص.\n\nالمشاركة (3 دقائق):\n- المعلم: يستمع للمجموعات.\n- الطالب: يعرض.\n\nالختام (5 دقائق):\n- المعلم: يلخص الخصائص.\n- الطالب: يذكر خاصيتين.\n\nالحصة 3: قواعد تخطيط الوحدات الزخرفية الإسلامية (هندسية، نباتية، كتابية)\nالتهيئة (5 دقائق):\n- المعلم: يرسم دائرة ويقسمها على السبورة ويسأل: كم شكلًا هندسيًا يمكن أن يولد من هذه الدائرة؟\n- الطالب: يقترح نجومًا ومضلعات.\n\nالعرض التوضيحي (10 دقائق):\n- المعلم: ينمذج تخطيط وحدة هندسية بتقسيم الدائرة، ووحدة نباتية بخطوط منحنية.\n- الطالب: يتابع.\n\nالمحاكاة (20 دقيقة):\n- المعلم: يتابع تخطيط وحدات وفق الشكل (1).\n- الطالب: يخطط وحدتين.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم تخطيطه.\n\nالحصة 4: تصميم وحدات زخرفية إسلامية بالأدوات الهندسية محققًا التناسب الخطي\nالتهيئة (5 دقائق):\n- المعلم: يعرض وحدتين إحداهما متناسبة الخطوط والأخرى غير متناسبة ويسأل: أيهما أجمل؟\n- الطالب: يختار ويعلل.\n\nالمعيار (5 دقائق):\n- المعلم: يوضح التناسب الخطي (تناسب سمك الخطوط وأطوالها وتوزيعها).\n- الطالب: يتابع.\n\nالتصميم (25 دقيقة):\n- المعلم: يتابع تصميم وحدة هندسية أو نباتية.\n- الطالب: يصمم وحدته.\n\nالختام (5 دقائق):\n- المعلم: يطلب تقييمًا ثنائيًا.\n- الطالب: يقيم وحدة زميل.\n\nالحصة 5: تلوين الوحدات الزخرفية وتحليلها وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يعرض بلاطات إسلامية ملونة ويسأل: ما الألوان الغالبة؟\n- الطالب: يذكر الأزرق والفيروزي والذهبي.\n\nالتلوين (20 دقيقة):\n- المعلم: يتابع التلوين بألوان متناسقة.\n- الطالب: يلون وحدته.\n\nالتحليل والتقويم (10 دقائق):\n- المعلم: ينظم عرضًا وتحليلًا وفق الخصائص، ويطرح أسئلة كتاب الطالب.\n- الطالب: يحلل ويقيم.\n\nالختام (5 دقائق):\n- المعلم: يمهد لدرس الزخرفة الإسلامية وقواعد التماثل.\n- الطالب: يذكر ما تعلمه.", "الحصة 1: مفهوم الفن الإسلامي ومجالاته الفنية\nس1 (مستوى الدعم): ما المقصود بالفن الإسلامي؟\nالإجابة: فن نشأ في ظل الحضارة الإسلامية متأثرًا بالحضارات المحيطة ومعبرًا عن فكر منظم.\n\nس2 (المستوى المتوقع): اذكر ثلاثة مجالات للفن الإسلامي.\nالإجابة: العمارة والخزف والنسيج.\n\nس3 (المستوى المتقدم): لماذا تنوعت مجالات الفن الإسلامي؟\nالإجابة: لارتباطها بحاجات الحياة اليومية والعمارة والعبادة.\n\nالحصة 2: خصائص الفن الإسلامي (التجريد، التكرار، التماثل، كراهية الفراغ)\nس1 (مستوى الدعم): ما المقصود بكراهية الفراغ؟\nالإجابة: ملء المساحة بالزخارف دون ترك فراغات.\n\nس2 (المستوى المتوقع): اذكر ثلاث خصائص للفن الإسلامي.\nالإجابة: التجريد والتكرار والتماثل.\n\nس3 (المستوى المتقدم): كيف تعبر خاصية اللانهائية عن فكر الفنان المسلم؟\nالإجابة: بالامتداد المتكرر الذي يوحي بالاستمرار.\n\nالحصة 3: قواعد تخطيط الوحدات الزخرفية الإسلامية (هندسية، نباتية، كتابية)\nس1 (مستوى الدعم): ما أساس الزخرفة الهندسية الإسلامية؟\nالإجابة: الأشكال الهندسية وتقسيمات الدائرة.\n\nس2 (المستوى المتوقع): بماذا تتميز الزخرفة النب n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي\n1. التناغم اللوني الزخرفي\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس\n1. التماثل الثماني\n2. الزخرفة المركبة", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nالتعلم القبلي: الوحدات الزخرفية الإسلامية.\n\nالتهيئة:\n- المعلم: يطوي ورقة عليها نصف زخرفة ويفتحها ويسأل: ما الذي حدث؟\n- الطالب: يلاحظ تكون شكل متماثل.\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي\nالتعلم القبلي: قواعد التماثل.\n\nالتهيئة:\n- المعلم: يسأل: إذا رسمنا ربع الزخرفة فقط، فكيف نكملها دون أخطاء؟\n- الطالب: يقترح الطي أو الورق الشفاف.\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي\nالتعلم القبلي: التماثل الربعي.\n\nالتهيئة:\n- المعلم: يعرض شكل ورقة نبات ويسأل: هل جانباها متماثلان؟\n- الطالب: يلاحظ التماثل حول العرق الرئيس.\n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي\nالتعلم القبلي: الوحدتان المصممتان بالتماثل.\n\nالتهيئة:\n- المعلم: يسأل: كيف يحافظ اللون على التماثل؟\n- الطالب: يقترح تلوين الأجزاء المتقابلة بالألوان نفسها.\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس\nالتعلم القبلي: التماثل النصفي والربعي.\n\nالتهيئة:\n- المعلم: يعرض الشكل (4) زخرفة بالتماثل الثماني ويسأل: كم مرة تكررت الوحدة؟\n- الطالب: يعد ثماني مرات.", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nالتهيئة (5 دقائق):\n- المعلم: يطوي ورقة عليها نصف زخرفة ويفتحها ويسأل: ما الذي حدث؟\n- الطالب: يلاحظ تكون شكل متماثل.\n\nقواعد التماثل (12 دقيقة):\n- المعلم: يشرح الأنواع الثلاثة بالرسم على السبورة.\n- الطالب: يميز بينها.\n\nنماذج تاريخية (13 دقيقة):\n- المعلم: يعرض زخارف من حقب إسلامية (أموية، عباسية، أندلسية) ويطلب تحديد نوع التماثل.\n- الطالب: يحلل النماذج.\n\nخريطة ذهنية (5 دقائق):\n- المعلم: يلخص في خريطة ذهنية.\n- الطالب: يكمل الخريطة.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتماثل الربعي.\n- الطالب: يذكر الأنواع.\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي\nالتهيئة (5 دقائق):\n- المعلم: يسأل: إذا رسمنا ربع الزخرفة فقط، فكيف نكملها دون أخطاء؟\n- الطالب: يقترح الطي أو الورق الشفاف.\n\nالخطوات (8 دقائق):\n- المعلم: ينمذج: رسم مربع وتقسيمه إلى أربعة، رسم الربع الأول من النقطة المركزية، استكمال الأجزاء.\n- الطالب: يتابع.\n\nالتصميم (22 دقيقة):\n- المعلم: يتابع التصميم.\n- الطالب: يصمم وحدته بالتماثل الربعي.\n\nالختام (5 دقائق):\n- المعلم: يتحقق من التقاء الأجزاء في المركز.\n- الطالب: يعرض تصميمه.\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي\nالتهيئة (5 دقائق):\n- المعلم: يعرض شكل ورقة نبات ويسأل: هل جانباها متماثلان؟\n- الطالب: يلاحظ التماثل حول العرق الرئيس.\n\nالخطوات (5 دقائق):\n- المعلم: يوضح: رسم مستطيل يتوسطه خط رأسي، رسم النصف الأيمن، استكماله.\n- الطالب: يتابع.\n\nالتصميم (25 دقيقة):\n- المعلم: يتابع التصميم.\n- الطالب: يصمم وحدة بالتماثل النصفي.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقارن بين وحدتيه.\n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف يحافظ اللون على التماثل؟\n- الطالب: يقترح تلوين الأجزاء المتقابلة بالألوان نفسها.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح التلوين المتماثل واختيار مجموعة لونية متناغمة.\n- الطالب: يختار مجموعته.\n\nالتلوين (25 دقيقة):\n- المعلم: يتابع تلوين الوحدتين.\n- الطالب: يلون وحدتيه.\n\nالختام (5 دقائق):\n- المعلم: يعرض الأعمال.\n- الطالب: يقيم التناغم.\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (4) زخرفة بالتماثل الثماني ويسأل: كم مرة تكررت الوحدة؟\n- الطالب: يعد ثماني مرات.\n\nالتماثل الثماني (18 دقيقة):\n- المعلم: يوضح التقسيم الثماني للدائرة ويتابع تصميمًا مبسطًا.\n- الطالب: يصمم وحدة مبسطة بالتماثل الثماني.\n\nالعرض والتقويم (12 دقيقة):\n- المعلم: ينظم عرضًا ويطرح أسئلة الكتاب.\n- الطالب: يعرض ويجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لدرس عناصر العمارة.\n- الطالب: يلخص الدرس.", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nس1 (مستوى الدعم): ما التماثل النصفي؟\nالإجابة: تطابق نصفي الوحدة حول محور واحد.\n\nس2 (المستوى المتوقع): كم محورًا في التماثل الربعي؟\nالإجابة: محوران متعامدان.\n\nس3 (المستوى المتقدم): لماذا يكثر التماثل في الزخرفة الإسلامية؟\nالإجابة: لأنه يحقق النظام والاتزان والانسجام.\n\nالحصة 2: تصميم وحدة زخرفية إسلامية بقواعد التماثل الربعي\nس1 (مستوى الدعم): من أين يبدأ رسم الربع الأول؟\nالإجابة: من النقطة المركزية.\n\nس2 (المستوى المتوقع): ما وظيفة الورق الشفاف هنا؟\nالإجابة: نقل الربع إلى الأرباع الأخرى بدقة.\n\nس3 (المستوى المتقدم): حلل سبب عدم التقاء الأجزاء في وحدة زميل.\nالإجابة: خطأ في القياس أو موضع المركز.\n\nالحصة 3: تصميم وحدة زخرفية إسلامية بقواعد التماثل النصفي\nس1 (مستوى الدعم): ما الخط الذي يقسم المستطيل في التماثل النصفي؟\nالإجابة: خط رأسي في المنتصف.\n\nس2 (المستوى المتوقع): أيهما أنسب لزخرفة إطار نافذة: النصفي أم الربعي؟\nالإجابة: النصفي لمناسبته الأشكال المستطيلة.\n\nس3 (المستوى المتقدم): قارن بين التماثلين من حيث الإحساس.\nالإجابة: الربعي أكثر مركزية واستقرارًا والنصفي أكثر امتدادًا.\n\nالحصة 4: تلوين الوحدات الزخرفية لتحقيق قيمة التناغم اللوني الزخرفي\nس1 (مستوى الدعم): ما المقصود بالتناغم اللوني الزخرفي؟\nالإجابة: انسجام الألوان وتكرارها بإيقاع داخل الزخرفة.\n\nس2 (المستوى المتوقع): كيف يدعم اللون التماثل؟\nالإجابة: بتكرار الألوان نفسها في الأجزاء المتقابلة.\n\nس3 (المستوى المتقدم): حلل المجموعة اللونية في وحدة زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: التماثل الثماني (إثراء) وعرض الأعمال وتقويم الدرس\nس1 (مستوى الدعم): كم قسمًا في التماثل الثماني؟\nالإجابة: ثمانية أقسام.\n\nس2 (المستوى المتوقع): كيف تقسم الدائرة إلى ثمانية أقسام؟\nالإجابة: بقطرين متعامدين ثم تنصيف الزوايا.\n\nس3 (المستوى المتقدم): اقترح منتجًا يناسبه التماثل الثماني.\nالإجابة: غطاء صينية أو سقف قبة.", "الحصة 1: قواعد التماثل في تصميم الوحدات الزخرفية الإسلامية ونماذج من الحقب الإسلامية\nس1 (مستوى الدعم): اذكر أنواع التماثل الثلاثة.\nالإجابة: النصفي والربعي والثماني.\n\nس2 (المستوى المتوقع): حدد نوع التماثل في زخرفة معروضة.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): اقترح نوع تماثل لنافذة مستطيلة وعلل.\nالإجابة: النصفي؛ لمناسبته الشكل المستطيل.\n\nالحصة 2: تصميم العمانية.\n- الطالب: يذكر عنصرًا عمانيًا.", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\nس1 (مستوى الدعم): سمِّ ثلاثة عناصر معمارية إسلامية.\nالإجابة: القبة والمئذنة والعقد.\n\nس2 (المستوى المتوقع): ما وظيفة المئذنة؟\nالإجابة: رفع الأذان، وهي عنصر جمالي مميز.\n\nس3 (المستوى المتقدم): حلل سبب انتشار القباب في العمارة الإسلامية.\nالإجابة: لاعتبارات إنشائية وجمالية ورمزية وتحسين الصوت والتهوية.\n\nالحصة 2: رسم عنصر معماري مستوحى من العمارة الإسلامية (قبة، مئذنة، برج قلعة)\nس1 (مستوى الدعم): لماذا نبدأ بالمحور الرأسي في رسم القبة؟\nالإجابة: لضمان التماثل.\n\nس2 (المستوى المتوقع): اذكر أجزاء القبة.\nالإجابة: القاعدة (الرقبة) والجسم والقمة.\n\nس3 (المستوى المتقدم): حلل نسب عنصر زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: زخرفة أجزاء العنصر المعماري محققًا قيمة التناسب الخطي الزخرفي\nس1 (مستوى الدعم): أين توضع الزخارف عادة في المئذنة؟\nالإجابة: في أشرطة أفقية حول جسمها.\n\nس2 (المستوى المتوقع): كيف تحقق التناسب الخطي الزخرفي؟\nالإجابة: بتناسب حجم الزخرفة مع حجم الجزء المعماري.\n\nس3 (المستوى المتقدم): اقترح زخرفة كتابية مناسبة لقبة.\nالإجابة: شريط كتابي حول الرقبة بعبارة مناسبة.\n\nالحصة 4: تلوين العنصر المعماري المزخرف لتحقيق التناغم اللوني الزخرفي\nس1 (مستوى الدعم): ما القيمة اللونية المستهدفة؟\nالإجابة: التناغم اللوني الزخرفي.\n\nس2 (المستوى المتوقع): كيف تبرز الزخرفة عن الجدار؟\nالإجابة: بلون متباين متناسق.\n\nس3 (المستوى المتقدم): حلل ألوان عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: إخراج العنصر المعماري وعرضه وتقويم الدرس\nس1 (مستوى الدعم): ما معايير تقويم عملك؟\nالإجابة: دقة الرسم، التناسب الزخرفي، التناغم اللوني.\n\nس2 (المستوى المتوقع): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nس3 (المستوى المتقدم): اقترح استخدامًا لعملك في المدرسة.\nالإجابة: إجابة معللة.", "الحصة 1: تحليل نماذج من العمارة الإسلامية وخصائصها في الحقب التاريخية\nس1 (مستوى الدعم): ما العنصر المعماري في برج قلعة نزوى؟\nالإجابة: البرج.\n\nس2 (المستوى المتوقع): حلل خاصيتين لعنصر معماري.\nالإجابة: تحليل صحيح.\n\nس3 (المستوى المتقدم): قارن بين عنصرين من حقبتين.\nالإجابة: مقارنة معللة. n- المعلم: يسأل: ما مواصفات العبارة الإعلانية الناجحة؟\n- الطالب: يذكر القصر والوضوح والجاذبية.", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورتين: بيت طيني قديم ومبنى حكومي حديث بطابع عماني ويسأل: ما المشترك بينهما؟\n- الطالب: يذكر الأقواس والشرفات والألوان الترابية.\n\nالخصائص (12 دقيقة):\n- المعلم: يعرض الشكل (14) ويوضح الخصائص.\n- الطالب: يدون الخصائص.\n\nالتحليل (15 دقيقة):\n- المعلم: يطلب تحليل نماذج قديمة وحديثة ومقارنتها.\n- الطالب: يحلل ويقارن.\n\nالمشاركة (3 دقائق):\n- المعلم: يستمع للمجموعات.\n- الطالب: يعرض.\n\nالختام (5 دقائق):\n- المعلم: يمهد لتصميم الإعلان.\n- الطالب: يختار عناصر لإعلانه.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية\nالتهيئة (5 دقائق):\n- المعلم: يعرض إعلانًا سياحيًا عن عمان ويسأل: ما الذي يجذبك فيه؟\n- الطالب: يحلل العناصر الجاذبة.\n\nالخطوات (8 دقائق):\n- المعلم: يوضح خطوات التصميم: الفكرة، العناصر، التنظيم، التلوين، النص.\n- الطالب: يدون.\n\nالعصف الذهني (12 دقيقة):\n- المعلم: يدير عصفًا لأفكار إعلانات (السياحة، الهوية، معرض).\n- الطالب: يقترح فكرته.\n\nتحديد العناصر (10 دقائق):\n- المعلم: يتابع رسم مخططات أولية للعناصر.\n- الطالب: يحدد عناصره ويرسمها مبدئيًا.\n\nالختام (5 دقائق):\n- المعلم: يراجع الخطط.\n- الطالب: يعرض خطته.\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (15) ويسأل: كيف رتب المصمم العناصر لتبدو بعضها قريبة؟\n- الطالب: يلاحظ الحجم والتداخل.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح التنويع بين القديم والحديث والتفاوت في الأحجام.\n- الطالب: يتابع.\n\nالتصميم (25 دقيقة):\n- المعلم: يتابع ترتيب العناصر.\n- الطالب: يصمم الإعلان.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم تصميمه.\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (16) ويسأل: كيف برزت المباني عن الخلفية؟\n- الطالب: يلاحظ التضاد.\n\nالتلوين (25 دقيقة):\n- المعلم: يتابع التلوين.\n- الطالب: يلون تصميمه.\n\nالمراجعة (5 دقائق):\n- المعلم: يطلب ملاحظة زميل.\n- الطالب: يعدل.\n\nالختام (5 دقائق):\n- المعلم: يمهد لإضافة النص.\n- الطالب: يحدد النص.\n\nالحصة 5: إضافة النص الإعلاني وإخراج الإعلان وعرضه وتقويم الوحدة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما مواصفات العبارة الإعلانية الناجحة؟\n- الطالب: يذكر القصر والوضوح والجاذبية.\n\nالنص (10 دقائق):\n- المعلم: يتابع اختيار النص وخطه وموضعه.\n- الطالب: يضيف النص.\n\nالعرض (12 دقيقة):\n- المعلم: ينظم معرضًا للإعلانات.\n- الطالب: يعرض ويقيم.\n\nتقويم الوحدة (8 دقائق):\n- المعلم: يطرح أسئلة مراجعة الوحدة.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يقترح نشر الإعلانات في المدرسة.\n- الطالب: يقترح مكانًا للعرض.", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة\nس1 (مستوى الدعم): اذكر معلمًا عمانيًا حديثًا.\nالإجابة: برج الصحوة (أو برج الساعة بجامعة السلطان قابوس).\n\nس2 (المستوى المتوقع): ما الألوان الغالبة في العمارة العمانية القديمة؟\nالإجابة: الألوان الترابية.\n\nس3 (المستوى المتقدم): كيف حافظت العمارة الحديثة على الطابع العماني؟\nالإجابة: باستخدام الأقواس والشرفات والزخارف واللون الأبيض والترابي.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية\nس1 (مستوى الدعم): رتب خطوات تصميم الإعلان.\nالإجابة: الفكرة، العناصر، التنظيم، التلوين، النص.\n\nس2 (المستوى المتوقع): لماذا نجمع بين القديم والحديث؟\nالإجابة: لإظهار استمرار الهوية مع التطور.\n\nس3 (المستوى المتقدم): اقترح فكرة إعلان مبتكرة.\nالإجابة: إجابة إبداعية.\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى الدعم): كيف توحي بأن عنصرًا بعيد؟\nالإجابة: بتصغيره ووضعه أعلى خلف العناصر الأخرى.\n\nس2 (المستوى المتوقع): ما قيمة الدرس؟\nالإجابة: التناسب الشكلي مع الأرضية.\n\nس3 (المستوى المتقدم): حلل ترتيب زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية\nس1 (مستوى الدعم): ما التضاد اللوني؟\nالإجابة: اختلاف قوي بين لون الشكل ولون الأرضية.\n\nس2 (المستوى المتوقع): اقترح خلفية لمبنى أبيض.\nالإجابة: خلفية زرقاء أو داكنة.\n\nس3 (المستوى المتقدم): حلل التضاد في عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: إضافة النص الإعلاني وإخراج الإعلان وعرضه وتقويم الوحدة\nس1 (مستوى الدعم): ما مواصفات النص الإعلاني؟\nالإجابة: قصير وواضح وجذاب.\n\nس2 (المستوى المتوقع): كيف ينسجم النص مع التصميم؟\nالإجابة: بخط ولون وموضع مناسب.\n\nس3 (المستوى المتقدم): انقد إعلانًا.\nالإجابة: نقد معلل.", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة\nس1 (مستوى الدعم): صنف: قلعة نزوى.\nالإجابة: عمارة عمانية قديمة.\n\nس2 (المستوى المتوقع): قارن بين بيت قديم ومبنى حديث.\nالإجابة: مقارنة معللة.\n\nس3 (المستوى المتقدم): اقترح عنصرًا عمانيًا لمبنى حديث.\nالإجابة: إجابة معللة.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة العمانية\nس1 (مستوى الدعم): ما فكرة إعلانك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): اذكر العناصر التي اخترتها.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم مناسبة العناصر للفكرة.\nالإجابة: تقييم معلل.\n\nالحصة 3: ترتيب عناصر العمارة العمانية في تصميم مبتكر محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى الدعم): كم عنصرًا في تصميمك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف ترتيب العناصر.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم التناسب في تصميمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين تصميم العمارة العمانية محققًا التضاد اللوني بين الشكل والأرضية\nس1 (مستوى الدعم): ما ألوان تصميمك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف التضاد في عملك.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 5: إضافة النص الإعلاني وإخراج الإعلان وعرضه وتقويم الوحدة\nس1 (مستوى الدعم): اذكر قيمتين حققتهما.\nالإجابة: التناسب الشكلي والتضاد اللوني.\n\nس2 (المستوى المتوقع): احكم على إعلانك.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): كيف يمكن تسويق مهارة تصميم الإعلانات؟\nالإجابة: بتصميم إعلانات للمؤسسات والمحلات مقابل أجر.", "الحصة 1: خصائص العمارة العمانية القديمة والحديثة\nإرشاد للطالب: يلاحظ الطابع العماني في مباني ولايته.\nإرشاد لولي الأمر: يحدث ابنه عن البيوت العمانية القديمة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 22–23.\n\nالحصة 2: خطوات تصميم الإعلان وتحديد عناصر العمارة ا التخطيط.\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nالتعلم القبلي: تخطيط البلاطة.\n\nالتهيئة:\n- المعلم: يعرض الشكل (2) تصميمًا نصفيًا وربعيًا ويسأل: أيهما يناسب جدارية كبيرة؟\n- الطالب: يقترح ويعلل.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nالتعلم القبلي: تصميم البلاطة.\n\nالتهيئة:\n- المعلم: يعرض وحدة إضاءة خزفية ويسأل: كيف خرج الضوء منها؟\n- الطالب: يلاحظ الفتحات المفرغة.\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\nالتعلم القبلي: تصميمات البلاطة والشكل الخزفي.\n\nالتهيئة:\n- المعلم: يسأل: لو كنت مشتريًا، أي تصميم ستختار؟ ولماذا؟\n- الطالب: يختار ويعلل.", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة\nالتهيئة (5 دقائق):\n- المعلم: يعرض نماذج فخار عماني (جحلة، مجمر، خرس) ويسأل: لماذا اشتهرت بهلاء بالفخار؟\n- الطالب: يذكر توفر الطين والإرث الحرفي.\n\nالخزافون (10 دقائق):\n- المعلم: يعرض أعمال خزافين عالميين ويقارنها بالفخار العماني.\n- الطالب: يقارن.\n\nالتحليل (15 دقيقة):\n- المعلم: يطلب تحليل أشكال مبتكرة من حيث الهيئة والزخرفة.\n- الطالب: يحلل.\n\nالمشاركة (5 دقائق):\n- المعلم: يستمع للمجموعات.\n- الطالب: يعرض.\n\nالختام (5 دقائق):\n- المعلم: يمهد لتصميم البلاطة.\n- الطالب: يذكر قيمة من الدرس.\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة\nالتهيئة (5 دقائق):\n- المعلم: يعرض بلاطة خزفية جاهزة ويسأل: كيف بدأ المصمم عمله؟\n- الطالب: يتوقع التقسيم والتخطيط.\n\nالخطوات (8 دقائق):\n- المعلم: ينمذج: تقسيم الورقة إلى مساحات متساوية، تخطيط الزخرف، التصميم النهائي (الشكل 1).\n- الطالب: يتابع.\n\nالتنفيذ (22 دقيقة):\n- المعلم: يتابع التقسيم وتخطيط الزخرفة مع الاستفادة من وحدة الفن الإسلامي.\n- الطالب: يقسم الورقة ويخطط.\n\nالختام (5 دقائق):\n- المعلم: يراجع التخطيطات.\n- الطالب: يعرض.\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (2) تصميمًا نصفيًا وربعيًا ويسأل: أيهما يناسب جدارية كبيرة؟\n- الطالب: يقترح ويعلل.\n\nالتصميم (25 دقيقة):\n- المعلم: يتابع إكمال التصميم.\n- الطالب: يكمل تصميم بلاطته.\n\nالتبادل (5 دقائق):\n- المعلم: يطلب ملاحظة زميل.\n- الطالب: يعدل.\n\nالختام (5 دقائق):\n- المعلم: يمهد لتصميم الأشكال الخزفية.\n- الطالب: يحفظ تصميمه.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nالتهيئة (5 دقائق):\n- المعلم: يعرض وحدة إضاءة خزفية ويسأل: كيف خرج الضوء منها؟\n- الطالب: يلاحظ الفتحات المفرغة.\n\nالأفكار (8 دقائق):\n- المعلم: يعرض أمثلة (وحدات إضاءة، مجامر، أشكال هندسية).\n- الطالب: يختار فكرة.\n\nالتصميم (22 دقيقة):\n- المعلم: يتابع رسم التصميم بمساقطه البسيطة.\n- الطالب: يصمم الشكل الخزفي.\n\nالختام (5 دقائق):\n- المعلم: يراجع ملاءمة التصميم للتنفيذ بالشرائح.\n- الطالب: يعدل.\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\nالتهيئة (5 دقائق):\n- المعلم: يسأل: لو كنت مشتريًا، أي تصميم ستختار؟ ولماذا؟\n- الطالب: يختار ويعلل.\n\nالاستكمال (12 دقيقة):\n- المعلم: يتابع اللمسات الأخيرة.\n- الطالب: يستكمل تصميماته.\n\nالشرح والنقد (15 دقيقة):\n- المعلم: ينظم عرضًا يشرح فيه كل طالب خطواته.\n- الطالب: يشرح وينقد.\n\nأسئلة الكتاب (3 دقائق):\n- المعلم: يطرح سؤالًا من الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لتنفيذ البلاطات بالطين.\n- الطالب: يجهز تصميمه للتنفيذ.", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة\nس1 (مستوى الدعم): ما الفرق بين الفخار والخزف؟\nالإجابة: الفخار طين محروق دون طلاء زجاجي غالبًا، والخزف مطلي بطلاء زجاجي.\n\nس2 (المستوى المتوقع): اذكر منتجًا فخاريًا عمانيًا.\nالإجابة: الجحلة أو المجمر.\n\nس3 (المستوى المتقدم): كيف يمكن تطوير الشكل الفخاري العماني؟\nالإجابة: بتصاميم معاصرة مع الحفاظ على الهوية.\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة\nس1 (مستوى الدعم): ما مقاس ورقة تصميم البلاطة؟\nالإجابة: (15×15) سم.\n\nس2 (المستوى المتوقع): لماذا نقسم الورقة إلى مساحات متساوية؟\nالإجابة: لتنظيم الزخرفة وتحقيق التماثل.\n\nس3 (المستوى المتقدم): كيف تستفيد من وحدة الفن الإسلامي هنا؟\nالإجابة: بتوظيف قواعد التماثل والوحدات الزخرفية.\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nس1 (مستوى الدعم): ما أنواع تصاميم البلاطة؟\nالإجابة: متماثل نصفي، ربعي، حر.\n\nس2 (المستوى المتوقع): كيف تحقق التناسب الشكلي الزخرفي؟\nالإجابة: بتناسب حجم الوحدات مع مساحة البلاطة.\n\nس3 (المستوى المتقدم): اقترح تعديلًا لبلاطة زميل.\nالإجابة: إجابة معللة.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nس1 (مستوى الدعم): لماذا تناسب الأشكال الهندسية التنفيذ بالشرائح؟\nالإجابة: لأن الشرائح المسطحة تُقطع وتُجمع بسهولة.\n\nس2 (المستوى المتوقع): ما الذي يجب مراعاته في وحدة الإضاءة؟\nالإجابة: الفتحات المفرغة لمرور الضوء والاتزان.\n\nس3 (المستوى المتقدم): اقترح شكلًا خزفيًا مبتكرًا بطابع عماني.\nالإجابة: مثال: مجمر بشكل برج قلعة.\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\nس1 (مستوى الدعم): اشرح خطوات تصميمك.\nالإجابة: إجابة صحيحة.\n\nس2 (المستوى المتوقع): ما القيمة المستهدفة؟\nالإجابة: التناسب الشكلي الزخرفي.\n\nس3 (المستوى المتقدم): انقد تصميم زميل.\nالإجابة: نقد معلل.", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة\nس1 (مستوى الدعم): اذكر ولاية عمانية مشهورة بالفخار.\nالإجابة: بهلاء.\n\nس2 (المستوى المتوقع): حلل شكلًا خزفيًا مبتكرًا.\nالإجابة: تحليل صحيح.\n\nس3 (المستوى المتقدم): اقترح استخدامًا معاصرًا للفخار.\nالإجابة: وحدات إضاءة أو أوانٍ ديكورية.\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة\nس1 (مستوى الدعم): رتب خطوات تصميم البلاطة.\nالإجابة: التقسيم، تخطيط الزخرف، التصميم النهائي.\n\nس2 (المستوى المتوقع): صف تقسيمك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nس1 (مستوى الدعم): ما نوع تصميمك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف عناصر تصميمك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم تصميمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nس1 (مستوى الدعم): ما المنتج الذي صممته؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى - المعلم: يناقش تسويق البلاطات منتجاتٍ ديكورية.\n- الطالب: يقترح فكرة تسويقية.", "س1 (مستوى الدعم): اذكر تقنيتين لزخرفة البلاطة.\nالإجابة: الغائر والبارز، والطين الملون.\n\nس2 (المستوى المتوقع): حلل تقنيات جدارية زميلك.\nالإجابة: تحليل صحيح.\n\nس3 (المستوى المتقدم): صمم خطة تسويق للبلاطات.\nالإجابة: الفئة، السعر، قناة البيع.", "س1 (مستوى الدعم): ما خطوات تشكيل البلاطة؟\nالإجابة: الفرد، التقطيع، نقل التصميم، الزخرفة.\n\nس2 (المستوى المتوقع): احكم على عمل مجموعتك.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): كيف يحافظ هذا العمل على حرفة الفخار العمانية؟\nالإجابة: بإحيائها بتصاميم معاصرة.", "إرشاد للطالب: يحتفظ بصور العمل في ملف إنجازه.\nإرشاد لولي الأمر: يشجع ابنه على تقدير الحرف التقليدية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 35–38."]}], "comb": ["الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\n1. يتعرف نماذج للوحات جدارية منفذة بالبلاطات الطينية.\n2. يتعرف حالات الطين وتحديات التشكيل به.\nمخرج آخر: يبحث عن صور لبلاطات خزفية للاستفادة منها.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\n1. يشرح طريقة فرد طينة متساوية السماكة.\n2. يفرد شريحة طينية متساوية السمك باستخدام المسطرتين والنشابة.\nمخرج آخر: يلتزم بنظافة المكان.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\n1. يقطع الشرائح الطينية وفق تصميم البلاطات.\n2. ينوع في أشكال البلاطات وأحجامها.\nمخرج آخر: يستخدم الأدوات بأمان.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\n1. ينقل التصميم الزخرفي على البلاطات الطينية.\n2. يحقق قيمة التناسب الشكلي الزخرفي.\nمخرج آخر: يتعامل مع الطين بعناية.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\n1. يزخرف البلاطات بالحذف والإضافة بأسلوب الغائر والبارز.\n2. يحقق قيمة التناغم الزخرفي الملمسي.\nمخرج آخر: يتقن استخدام أدوات تشكيل الطين.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\n1. يضيف طينة ملونة بضغطها على الشريحة.\n2. يطبق ملامس الأشياء بالضغط على الطين.\nمخرج آخر: يجرب معالجات متنوعة.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\n1. يضيف الألوان بالفرشاة مباشرة على الشريحة.\n2. يجمع بين بعض المعالجات الفنية على البلاطة الواحدة.\nمخرج آخر: يحقق الانسجام بين المعالجات.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\n1. يتعرف طرق التجفيف البطيء للبلاطات لتجنب التشقق والالتواء.\n2. يخطط لتوزيع البلاطات في جدارية أو معلقة.\nمخرج آخر: يحقق قيمة التناغم الزخرفي الملمسي في التوزيع.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\n1. ينتج لوحة جدارية أو معلقة بالبلاطات الطينية.\n2. يحقق قيمة التناغم الزخرفي الملمسي عند توزيع البلاطات.\nمخرج آخر: يتعاون مع مجموعته.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\n1. يُخرج العمل ويعرضه في مرافق المدرسة.\n2. يحلل أشكال البلاطات المنفذة من حيث التقنيات الزخرفية.\nمخرج آخر: يقيم تعلمه في وحدة المنتجات الفخارية.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nالمخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: تطبيق\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nالمخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: تقييم\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nالمخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج 3: تقييم\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nالمخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nالمخرج 1: إبداع\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n\nالحصة 2: فرد شريحة طينية م البلاطات المقطعة والتصميم.\n\nالتهيئة:\n- المعلم: يسأل: كيف ننقل التصميم دون إتلاف الطين؟\n- الطالب: يقترح وضع الورقة والتحديد الخفيف.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nالتعلم القبلي: التصميم المنقول على البلاطة.\n\nالتهيئة:\n- المعلم: يمرر بلاطة مزخرفة بالغائر والبارز ويسأل: ما الذي تشعر به حين تلمسها؟\n- الطالب: يصف الملمس.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nالتعلم القبلي: الزخرفة بالغائر والبارز.\n\nالتهيئة:\n- المعلم: يضغط ورقة نبات على طين ويسأل: ماذا ترك؟\n- الطالب: يلاحظ الأثر.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nالتعلم القبلي: الملامس والطين الملون.\n\nالتهيئة:\n- المعلم: يعرض الشكل (7) ويسأل: ما المعالجات التي جُمعت في هذه البلاطة؟\n- الطالب: يحدد المعالجات.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nالتعلم القبلي: البلاطات المزخرفة.\n\nالتهيئة:\n- المعلم: يعرض بلاطة ملتوية ويسأل: ما سبب التوائها؟\n- الطالب: يتوقع الجفاف السريع غير المتساوي.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nالتعلم القبلي: البلاطات الجافة وخطة الجدارية.\n\nالتهيئة:\n- المعلم: يسأل: ما الذي يجعل الجدارية عملًا واحدًا لا بلاطات متفرقة؟\n- الطالب: يذكر الترابط والإيقاع.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nالتعلم القبلي: الجداريات المجمعة.\n\nالتهيئة:\n- المعلم: يسأل: أين نعرض أعمالنا لتصل إلى أكبر عدد؟\n- الطالب: يقترح أماكن.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nالتهيئة (5 دقائق):\n- المعلم: يمرر عينات طين رطب جدًا وصالح وجاف ويسأل: أيها يصلح للتشكيل؟\n- الطالب: يجرب ويستنتج.\n\nنماذج الجداريات (10 دقائق):\n- المعلم: يعرض جداريات بالبلاطات (الأشكال 10–13).\n- الطالب: يحلل.\n\nحالات الطين (12 دقيقة):\n- المعلم: يوضح: اللزج يصعب تشكيله، والجاف يتشقق، والصالح مرن متماسك.\n- الطالب: يجرب العينات.\n\nالتخطيط (8 دقائق):\n- المعلم: يطلب تحديد نوع العمل النهائي (جدارية أو معلقة).\n- الطالب: يحدد.\n\nالختام (5 دقائق):\n- المعلم: يذكر بأدوات الحصة القادمة.\n- الطالب: يستعد.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نضمن أن تكون البلاطة متساوية السمك؟\n- الطالب: يقترح المسطرتين.\n\nالبيان العملي (8 دقائق):\n- المعلم: ينمذج فرد الطين بين مسطرتين بالنشابة على قماش.\n- الطالب: يتابع.\n\nالتطبيق (22 دقيقة):\n- المعلم: يتابع الفرد.\n- الطالب: يفرد شريحته.\n\nالختام (5 دقائق):\n- المعلم: يوجه لتغطية الشرائح.\n- الطالب: يغطي شريحته.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (4) بلاطات بأشكال مختلفة ويسأل: كيف نقطع أشكالًا دقيقة؟\n- الطالب: يقترح قالبًا ورقيًا.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج التقطيع بقالب ورقي.\n- الطالب: يتابع.\n\nالتقطيع (25 دقيقة):\n- المعلم: يتابع التقطيع.\n- الطالب: يقطع بلاطاته.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتغطية.\n- الطالب: يغطي بلاطاته.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ننقل التصميم دون إتلاف الطين؟\n- الطالب: يقترح وضع الورقة والتحديد الخفيف.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج وضع التصميم والضغط بأداة مدببة.\n- الطالب: يتابع.\n\nالنقل (25 دقيقة):\n- المعلم: يتابع النقل.\n- الطالب: ينقل التصميم.\n\nالختام (5 دقائق):\n- المعلم: يذكر بالزخرفة القادمة.\n- الطالب: يغطي عمله.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nالتهيئة (5 دقائق):\n- المعلم: يمرر بلاطة مزخرفة بالغائر والبارز ويسأل: ما الذي تشعر به حين تلمسها؟\n- الطالب: يصف الملمس.\n\nالبيان العملي (8 دقائق):\n- المعلم: ينمذج الحذف بالأداة والإضافة مع التخشين والماء للالتصاق.\n- الطالب: يتابع.\n\nالزخرفة (22 دقيقة):\n- المعلم: يتابع.\n- الطالب: يزخرف بلاطته بالغائر والبارز.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتغطية.\n- الطالب: يغطي عمله.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nالتهيئة (5 دقائق):\n- المعلم: يضغط ورقة نبات على طين ويسأل: ماذا ترك؟\n- الطالب: يلاحظ الأثر.\n\nالعرض (8 دقائق):\n- المعلم: يعرض الشكلين (5، 6).\n- الطالب: يتابع.\n\nالتجريب (22 دقيقة):\n- المعلم: يتابع التطبيق.\n- الطالب: يضيف الطين الملون ويطبع الملامس.\n\nالختام (5 دقائق):\n- المعلم: يعرض النتائج.\n- الطالب: يقارن.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (7) ويسأل: ما المعالجات التي جُمعت في هذه البلاطة؟\n- الطالب: يحدد المعالجات.\n\nالتلوين والجمع (25 دقيقة):\n- المعلم: يتابع التلوين والجمع بين المعالجات.\n- الطالب: يلون بلاطاته ويجمع المعالجات.\n\nالمراجعة (5 دقائق):\n- المعلم: يطلب ملاحظة زميل.\n- الطالب: يعدل.\n\nالختام (5 دقائق):\n- المعلم: يذكر بالتجفيف البطيء.\n- الطالب: يغطي العمل جزئيًا.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nالتهيئة (5 دقائق):\n- المعلم: يعرض بلاطة ملتوية ويسأل: ما سبب التوائها؟\n- الطالب: يتوقع الجفاف السريع غير المتساوي.\n\nالتجفيف (10 دقائق):\n- المعلم: يوضح التجفيف البطيء بالتغطية وقلب البلاطات وتجنب الشمس المباشرة.\n- الطالب: يطبق على بلاطاته.\n\nتخطيط الجدارية (20 دقيقة):\n- المعلم: يوجه المجموعات لتخطيط توزيع البلاطات (هندسي، بمسافات متساوية، معلقات).\n- الطالب: تخطط المجموعة جداريتها.\n\nالختام (5 دقائق):\n- المعلم: يراجع الخطط.\n- الطالب: تعرض المجموعة خطتها.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الذي يجعل الجدارية عملًا واحدًا لا بلاطات متفرقة؟\n- الطالب: يذكر الترابط والإيقاع.\n\nالتنظيم (5 دقائق):\n- المعلم: يوزع الأدوار ويذكر بالخطة.\n- الطالب: يستلم دوره.\n\nالتجميع (25 دقيقة):\n- المعلم: يتابع التثبيت أو التعليق.\n- الطالب: يجمع البلاطات في العمل.\n\nالختام (5 دقائق):\n- المعلم: يطلب تأمل العمل من بعيد.\n- الطالب: يقيم الترابط.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: أين نعرض أعمالنا لتصل إلى أكبر عدد؟\n- الطالب: يقترح أماكن.\n\nالإخراج (10 دقائق):\n- المعلم: يتابع اللمسات الأخيرة.\n- الطالب: يُخرج العمل.\n\nالعرض والتحليل (12 دقيقة):\n- المعلم: ينظم عرضًا وتحليلًا للتقنيات.\n- الطالب: يحلل ويعرض.\n\nتقويم الوحدة (8 دقائق):\n- المعلم: يطرح أسئلة الوحدة وأسئلة الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يناقش تسويق البلاطات منتجاتٍ ديكورية.\n- الطالب: يقترح فكرة تسويقية.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nس1 (مستوى الدعم): لماذا يصعب التشكيل بالطين اللزج؟\nالإجابة: لأنه يلتصق ولا يحتفظ بالشكل.\n\nس2 (المستوى المتوقع): ماذا يحدث للطين الجاف عند تشكيله؟\nالإجابة: يتشقق.\n\nس3 (المستوى المتقدم): اقترح طريقة لحفظ الطين رطبًا.\nالإجابة: لفه بكيس بلاستيكي أو قطعة قماش رطبة.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nس1 (مستوى الدعم): ما وظيفة المسطرتين؟\nالإجابة: ضبط سمك الشريحة.\n\nس2 (المستوى المتوقع): لماذا نفرد الطين على قماش؟\nالإجابة: لمنع التصاقه باللوح.\n\nس3 (المستوى المتقدم): اقترح حلًا لشريحة ظهرت فيها فقاعات.\nالإجابة: ثقب الفقاعة بإبرة وإعادة التسوية.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nس1 (مستوى الدعم): ما فائدة القالب الورقي؟\nالإجابة: ضمان دقة الشكل والمقاس.\n\nس2 (المستوى المتوقع): اذكر شكلين للبلاطات.\nالإجابة: مربع ومستطيل (أو دائري).\n\nس3 (المستوى المتقدم): لماذا نهذب حواف البلاطة؟\nالإجابة: لتجنب التشقق وتحسين المظهر.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nس1 (مستوى الدعم): ما أداة النقل؟\nالإجابة: أداة مدببة.\n\nس2 (المستوى المتوقع): لماذا نضغط بخفة؟\nالإجابة: حتى لا تثقب الورقة الطين أو تشوهه.\n\nس3 (المستوى المتقدم): حلل وضوح الخطوط المنقولة في عملك.\nالإجابة: تحليل معلل.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nس1 (مستوى الدعم): ما الغائر؟\nالإجابة: الأجزاء المنخفضة عن السطح الناتجة عن الحذف.\n\nس2 (المستوى المتوقع): كيف نثبت الطين المضاف؟\nالإجابة: بتخشين السطحين وإضافة الماء أو البطانة.\n\nس3 (المستوى المتقدم): لماذا تنفصل الإضافات أحيانًا؟\nالإجابة: لعدم التخشين أو اختلاف الرطوبة.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nس1 (مستوى الدعم): كيف تضيف الطينة الملونة؟\nالإجابة: بضغطها على الشريحة الرطبة.\n\nس2 (المستوى المتوقع): اذكر شيئين يمكن طبع ملمسهما.\nالإجابة: أوراق النباتات والدانتيل.\n\nس3 (المستوى المتقدم): اقترح شيئًا من البيئة العمانية لطبع ملمسه.\nالإجابة: سعف النخيل أو الأصداف.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nس1 (مستوى الدعم): ما معالجات زخرفة البلاطة؟\nالإجابة: الطين الملون، الملامس، التلوين، الغائر والبارز.\n\nس2 (المستوى المتوقع): لماذا لا نكثر المعالجات في بلاطة واحدة؟\nالإجابة: حتى لا تزدحم وتفقد الانسجام.\n\nس3 (المستوى المتقدم): حلل انسجام المعالجات في عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nس1 (مستوى الدعم): لماذا تلتوي البلاطة؟\nالإجابة: بسبب الجفاف السريع وغير المتساوي.\n\nس2 (المستوى المتوقع): كيف تجفف البلاطة ببطء؟\nالإجابة: بتغطيتها جزئيًا وقلبها بعيدًا عن الشمس.\n\nس3 (المستوى المتقدم): اقترح توزيعًا يحقق التناغم.\nالإجابة: مثال: تبادل البلاطات الغائرة والبارزة بمسافات متساوية.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nس1 (مستوى الدعم): ما الفرق بين الجدارية والمعلقة؟\nالإجابة: الجدارية تثبت على سطح، والمعلقة تتدلى بخيوط.\n\nس2 (المستوى المتوقع): كيف تحقق الإيقاع في التوزيع؟\nالإجابة: بالتكرار المنتظم أو المتبادل.\n\nس3 (المستوى المتقدم): حلل ترابط جدارية مجموعة أخرى.\nالإجابة: تحليل معلل.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nس1 (مستوى الدعم): اذكر تقنيتين لزخرفة البلاطة.\nالإجابة: الغائر والبارز، والطين الملون.\n\nس2 (المستوى المتوقع): حلل تقنيات جدارية زميلك.\nالإجابة: تحليل صحيح.\n\nس3 (المستوى المتقدم): صمم خطة تسويق للبلاطات.\nالإجابة: الفئة، السعر، قناة البيع.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nس1 (مستوى الدعم): ما الجدارية؟\nالإجابة: عمل فني يثبت على الجدار من تجميع بلاطات.\n\nس2 (المستوى المتوقع): صف الطين الصالح للتشكيل.\nالإجابة: مرن متماسك لا يلتصق ولا يتشقق.\n\nس3 (المستوى المتقدم): قارن بين المعلقة واللوحة الجدارية.\nالإجابة: مقارنة معللة.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nس1 (مستوى الدعم): ما الأداة المستخدمة للفرد؟\nالإجابة: النشابة.\n\nس2 (المستوى المتوقع): اشرح طريقة الفرد.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم تساوي سمك شريحتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nس1 (مستوى الدعم): كم بلاطة قطعت؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف طريقة التقطيع.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم دقة القطع.\nالإجابة: تقييم معلل.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nس1 (مستوى الدعم): هل ظهر التصميم كاملًا؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف طريقة النقل.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم التناسب.\nالإجابة: تقييم معلل.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nس1 (مستوى الدعم): اذكر أسلوبي الزخرفة في هذه الحصة.\nالإجابة: الحذف والإضافة.\n\nس2 (المستوى المتوقع): صف الملمس الناتج.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم التناغم الملمسي.\nالإجابة: تقييم معلل.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nس1 (مستوى الدعم): ما الملامس التي طبقتها؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف أثر الطين الملون.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم تنوع الملامس.\nالإجابة: تقييم معلل.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nس1 (مستوى الدعم): ما المعالجات التي جمعتها؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف الانسجام في بلاطتك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nس1 (مستوى الدعم): اذكر طريقة للتجفيف البطيء.\nالإجابة: التغطية بالبلاستيك.\n\nس2 (المستوى المتوقع): صف خطة جداريتكم.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم الخطة من حيث التناغم.\nالإجابة: تقييم معلل.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nس1 (مستوى الدعم): ما نوع عمل مجموعتك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف دورك في المجموعة.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم التناغم في العمل.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nس1 (مستوى الدعم): ما خطوات تشكيل البلاطة؟\nالإجابة: الفرد، التقطيع، نقل التصميم، الزخرفة.\n\nس2 (المستوى المتوقع): احكم على عمل مجموعتك.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): كيف يحافظ هذا العمل على حرفة الفخار العمانية؟\nالإجابة: بإحيائها بتصاميم معاصرة.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nإرشاد للطالب: يبحث عن صور لبلاطات خزفية.\nإرشاد لولي الأمر: يساعد ابنه في جمع الصور.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 35.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nإرشاد للطالب: يلاحظ طريقة فرد العجين في المطبخ.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 36.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nإرشاد للطالب: يلاحظ أشكال البلاط في البيئة.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 36–37.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nإرشاد للطالب: يحافظ على تصميمه الورقي.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nإرشاد للطالب: يلاحظ النقوش البارزة في الأبواب الخشبية.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nإرشاد للطالب: يجمع عناصر طبيعية آمنة ذات ملامس.\nإرشاد لولي الأمر: يساعد ابنه في الجمع.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nإرشاد للطالب: يتابع جفاف عمله في المدرسة.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nإرشاد للطالب: يلاحظ أثر الشمس في تجفيف الطين.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 38.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nإرشاد للطالب: يشارك أسرته صور الجدارية.\nإرشاد لولي الأمر: يشيد بعمل ابنه الجماعي.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 38.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nإرشاد للطالب: يحتفظ بصور العمل في ملف إنجازه.\nإرشاد لولي الأمر: يشجع ابنه على تقدير الحرف التقليدية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 35–38."]}];

  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
