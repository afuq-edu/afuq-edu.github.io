const D=(window.AFUQ35||function(x){return x})([{"title": "الدرس الأول: قواعد المنظور الهندسي", "unit": "الوحدة الثالثة: المنظور الهندسي", "periods": [{"ax": "مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة", "n": 1, "w": "الأسبوع الأول: من 6/9/2026 إلى 10/9/2026 – الحصة 1 من حصص الأسبوع", "pg": "47–48", "f": ["1. يعرّف مفهوم المنظور الهندسي ودوره في تحقيق العمق الفراغي (البعد الثالث) (10 دقائق)\n2. يتتبع مراحل ظهور المنظور في المدارس الفنية وفنون عصر النهضة (15 دقيقة)\nمخرج آخر: يقدّر أهمية المنظور في إبراز الجوانب الجمالية للمشاهد (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. الكتاب", "1. المنظور الهندسي\n2. العمق الفراغي (البعد الثالث)\n3. عصر النهضة", "التعلم القبلي: رسم المجسمات وإظهار القرب والبعد بتغيير الأحجام في المراحل السابقة.\nيعرض المعلم صورة لطريق مستقيم يمتد نحو الأفق ويسأل: لماذا يبدو الطريق ضيقًا كلما ابتعد مع أنه بالعرض نفسه؟ ويفسر الطالب الظاهرة بأن الأشياء تصغر كلما ابتعدت عن العين. (5 دقائق)", "1. مفهوم المنظور: يوضح المعلم أن المنظور الهندسي رسم ما تراه العين من مسطحات ومجسمات كما تبدو في الواقع لتحقيق العمق الفراغي، ويصوغ الطالب تعريفًا للمنظور بلغته (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. نشأة المنظور: يعرض المعلم أعمالًا من عصر النهضة ويتتبع مع الطلبة ظهور قواعد المنظور فيها، ويتتبع الطالب تطور المنظور ويدون أبرز ملاحظاته (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. مقارنة: يعرض المعلم قبة الجامع الأكبر وقبة كاتدرائية فلورنسا (الشكل 1) ويطلب المقارنة من حيث وضوح عناصر المنظور، ويقارن الطالب بين الصورتين مع مجموعته (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يلخص المعلم بخريطة ذهنية لمفهوم المنظور، ويذكر الطالب فائدة المنظور للفنان والمصمم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بالمنظور الهندسي؟\nالإجابة: علم يقوم على رسم ما تراه العين من مسطحات أو مجسمات كما تبدو في الواقع لتحقيق العمق الفراغي.\n\nس2 (مستوى التطبيق): في أي عصر برزت قواعد المنظور في الفن؟\nالإجابة: عصر النهضة.\n\nس3 (مستوى الاستدلال): لماذا يحتاج المعماري والمصمم الداخلي إلى المنظور؟\nالإجابة: لعرض التصاميم بصورة واقعية توضح الأبعاد والعمق قبل التنفيذ.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: يحقق المنظور الإحساس بالبعد ……….\nالإجابة: الثالث (العمق الفراغي).\n\nس2 (مستوى التطبيق): قارن بين قبة الجامع الأكبر وقبة كاتدرائية فلورنسا من حيث وضوح المنظور.\nالإجابة: إجابة تذكر اختلاف زاوية التصوير ووضوح خطوط التلاشي في كل صورة.\n\nس3 (مستوى الاستدلال): اقترح موقفًا في الحياة اليومية تظهر فيه قواعد المنظور.\nالإجابة: مثال: صفوف أعمدة الإنارة على الطريق تصغر وتتقارب كلما ابتعدت.", "إرشاد للطالب: يلاحظ مظاهر المنظور في الطرق والممرات من حوله.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة الأبعاد في الصور الفوتوغرافية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 47–48.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=1"]}, {"ax": "عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية", "n": 2, "w": "الأسبوع الأول: من 6/9/2026 إلى 10/9/2026 – الحصة 2 من حصص الأسبوع", "pg": "48", "f": ["1. يتعرف عناصر المنظور الهندسي (5 دقائق)\n2. يحدد خط الأفق ونقطة التلاشي في صور ولوحات (20 دقيقة)\nمخرج آخر: يهتم بالدقة في التحليل الخطي (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم بالملاحظة", "1. السبورة الذكية\n2. صورة توضيحية\n3. الأقلام\n4. أخرى: مسطرة، ورق شفاف", "1. خط الأفق\n2. نقطة التلاشي\n3. نقطة الوقوف (الرؤية)\n4. خطوط الرؤية", "التعلم القبلي: مفهوم المنظور ونشأته.\nيضع المعلم ورقًا شفافًا على صورة ممر ويسأل: إلى أين تتجه خطوط الجدران إذا مددناها؟ ويتوقع الطالب التقاءها في نقطة واحدة. (5 دقائق)", "1. تعريف العناصر: يعرّف المعلم خط الأفق (مستوى عين الرسام) ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية بالرسم على السبورة، ويرسم الطالب العناصر في دفتره مع تعريفاتها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تحليل صور: يوزع المعلم صورًا لممرات وشوارع ويطلب تحديد العناصر بالورق الشفاف، ويمد الطالب خطوط الرؤية ويحدد خط الأفق ونقطة التلاشي (8 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\n3. مشاركة: يعرض المعلم تحليلات المجموعات ويصحح الأخطاء، ويعرض الطالب تحليله ويناقش (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يربط المعلم خط الأفق بمستوى النظر تمهيدًا للحصة القادمة، ويذكر الطالب عنصرين ودوريهما (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بخط الأفق؟\nالإجابة: الخط الذي يمثل مستوى عين الناظر.\n\nس2 (مستوى التطبيق): أين تلتقي خطوط الرؤية؟\nالإجابة: في نقطة التلاشي على خط الأفق.\n\nس3 (مستوى الاستدلال): ماذا يحدث لنقطة التلاشي إذا جلس الرسام على الأرض؟\nالإجابة: ينخفض خط الأفق فتنخفض نقطة التلاشي معه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر عنصرين من عناصر المنظور.\nالإجابة: خط الأفق ونقطة التلاشي.\n\nس2 (مستوى التطبيق): حدد نقطة التلاشي في صورة ممر عُرضت عليك.\nالإجابة: تحديد صحيح بمد خطوط الجدران حتى التقائها.\n\nس3 (مستوى الاستدلال): فسر لماذا يقع خط الأفق في أعلى صورة ملتقطة من مكان مرتفع.\nالإجابة: لأن عين المصور أعلى من المشهد فيرتفع مستوى النظر.", "إرشاد للطالب: يحدد خط الأفق في صور يلتقطها بهاتفه.\nإرشاد لولي الأمر: يتحاور مع ابنه حول زوايا التصوير.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 48.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=1"]}, {"ax": "مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله", "n": 3, "w": "الأسبوع الأول: من 6/9/2026 إلى 10/9/2026 – الحصة 3 من حصص الأسبوع", "pg": "49", "f": ["1. يطبق قواعد المنظور وفقًا لمستويات النظر المختلفة لرسم مجسم (10 دقائق)\n2. يرسم ثلاثة مكعبات بمستويات نظر مختلفة في مساحة (10×10) سم (20 دقيقة)\nمخرج آخر: يلتزم بالدقة في القياس والرسم (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التعلم بالممارسة العملية", "1. السبورة التقليدية\n2. الكتاب\n3. أخرى: مسطرة، منقلة، قلم رصاص", "1. مستوى النظر\n2. أعلى خط الأفق\n3. أسفل خط الأفق", "التعلم القبلي: عناصر المنظور.\nيرفع المعلم كتابًا فوق مستوى عيون الطلبة ثم يخفضه ويسأل: متى رأيتم وجهه السفلي؟ ومتى العلوي؟ ويربط الطالب الوجه الظاهر بموقع الجسم من مستوى العين. (5 دقائق)", "1. النمذجة: ينمذج المعلم الخطوات: خط الأفق بقياس 10 سم، تحديد نقطتين في نهايتيه، خطوط مائلة بزاوية من كل نقطة فوق الخط وأسفله، ويتابع الطالب الخطوات (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. رسم المكعبات: يتابع المعلم رسم ثلاثة مكعبات ناتجة من تقاطع الخطوط بمستويات نظر مختلفة، ويرسم الطالب المكعبات الثلاثة (14 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. المراجعة: يتحقق المعلم من وضوح الأوجه الظاهرة في كل مكعب، ويراجع الطالب رسمه (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطلب المعلم مقارنة الأوجه الظاهرة في المكعبات الثلاثة، ويقارن الطالب ويستنتج (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أي وجه يظهر من مكعب يقع أسفل خط الأفق؟\nالإجابة: الوجه العلوي.\n\nس2 (مستوى التطبيق): ما قياس خط الأفق في التمرين؟\nالإجابة: 10 سم.\n\nس3 (مستوى الاستدلال): لماذا لا يظهر الوجه العلوي ولا السفلي لمكعب في مستوى خط الأفق؟\nالإجابة: لأن مستوى العين يقطع المكعب فيرى الناظر الأوجه الجانبية فقط.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر مستويات النظر الثلاثة.\nالإجابة: أعلى خط الأفق، في مستواه، أسفله.\n\nس2 (مستوى التطبيق): صف ما ظهر في المكعب الواقع أعلى خط الأفق.\nالإجابة: ظهر الوجه السفلي والأوجه الجانبية.\n\nس3 (مستوى الاستدلال): قيّم دقة تقاطع الخطوط في رسمك.\nالإجابة: تقييم معلل يذكر تطابق الحواف مع خطوط الرؤية.", "إرشاد للطالب: يلاحظ الأجسام فوق مستوى نظره وتحته كالرفوف والطاولات.\nإرشاد لولي الأمر: يتابع مع ابنه الدقة في رسمه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=1"]}, {"ax": "تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)", "n": 4, "w": "الأسبوع الأول: من 6/9/2026 إلى 10/9/2026 – الحصة 4 من حصص الأسبوع", "pg": "49", "f": ["1. يرسم مجسمات من البيئة في مستويات نظر مختلفة (25 دقيقة)\n2. يطبق خطوات المنظور بدقة على أشكال مستطيلة (5 دقائق)\nمخرج آخر: يتقبل النقد حول رسوماته (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم الذاتي\n2. التعلم التشاركي\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. أخرى: نماذج حقيقية (كتب، صناديق)، أدوات رسم", "1. المجسم\n2. مستويات النظر\n3. التناسب", "التعلم القبلي: رسم المكعبات في مستويات النظر.\nيضع المعلم صندوقًا على الطاولة وآخر على الرف ويسأل: كيف ستختلف رسمة كل منهما؟ ويتوقع الطالب الأوجه الظاهرة لكل صندوق. (5 دقائق)", "1. توزيع النماذج: يوزع المعلم نماذج مجسمة ويحدد مواضعها بالنسبة لمستوى العين، ويلاحظ الطالب النماذج من مقعده (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الرسم: يتابع المعلم ويوجه إلى تحويل المكعب إلى متوازي مستطيلات بحسب أبعاد المجسم، ويرسم الطالب الكتاب أو الصندوق في ثلاثة مستويات (16 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. تبادل: يطلب المعلم تبادل الرسوم، ويقدم الطالب ملاحظة لزميله (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يعرض المعلم نماذج متميزة، ويتقبل الطالب الملاحظات ويعدل (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف تحول المكعب إلى شكل كتاب؟\nالإجابة: بتغيير أبعاده ليصبح متوازي مستطيلات رفيعًا.\n\nس2 (مستوى التطبيق): أين يقع مجسم على رف مرتفع بالنسبة لخط الأفق؟\nالإجابة: أعلى خط الأفق.\n\nس3 (مستوى الاستدلال): ما الخطأ إذا ظهر الوجه العلوي لمجسم أعلى خط الأفق؟\nالإجابة: خطأ في توجيه خطوط الرؤية؛ إذ يجب أن يظهر الوجه السفلي.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المجسم الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): وضح كيف طبقت مستوى النظر على مجسمك.\nالإجابة: إجابة تربط الأوجه الظاهرة بموقع المجسم.\n\nس3 (مستوى الاستدلال): انقد رسم زميل من حيث تطبيق القاعدة.\nالإجابة: نقد معلل مع اقتراح.", "إرشاد للطالب: يرسم مجسمًا من غرفته بملاحظة مستوى نظره دون تكليف منزلي.\nإرشاد لولي الأمر: يشجع ابنه على الرسم من الطبيعة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=1"]}, {"ax": "قاعدة نقطة الت ، ويذكر الطالب قاعدة طبقها في التصوير (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا نحدد أولًا عند تحليل لوحة؟\nالإجابة: خط الأفق.\n\nس2 (مستوى التطبيق): كيف تستفيد من المنظور في التصوير؟\nالإجابة: باختيار زاوية تبرز خطوط الرؤية والعمق.\n\nس3 (مستوى الاستدلال): حلل صورة التقطها زميلك وحدد نوع القاعدة.\nالإجابة: تحليل صحيح بدليل.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع القاعدة في صورة ممر مستقيم؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (مستوى التطبيق): صف الزاوية التي التقطت بها صورتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): ناقش أي الصور أنجح في إبراز العمق.\nالإجابة: نقاش معلل.", "إرشاد للطالب: يلتقط صورًا لمشاهد تبرز المنظور.\nإرشاد لولي الأمر: يشجع ابنه على التصوير الفني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 48–50.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=1"]}, {"ax": "مراجعة قواعد المنظور الهندسي وتقويم الدرس", "n": 10, "w": "الأسبوع الثاني: من 13/9/2026 إلى 17/9/2026 – الحصة 5 من حصص الأسبوع", "pg": "47–50", "f": ["1. يراجع قواعد المنظور (زاوية النظر، نقطة تلاشي، نقطتا تلاشي، مستويات النظر) (10 دقائق)\n2. يحكم على رسوماته ورسومات زملائه في ضوء القواعد (15 دقيقة)\nمخرج آخر: يتقبل النقد ويستفيد منه (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تقييم\nالمخرج 3: تقييم", "1. التعلم المبني على اللعب\n2. التعلم التشاركي\n3. التقويم الذاتي", "1. السبورة الذكية\n2. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n3. الكتاب", "1. قواعد المنظور الهندسي\n2. النقد الفني", "التعلم القبلي: رسومات الدرس كاملة.\nيطلق المعلم تحديًا سريعًا: أرسم على السبورة مجسمات وعلى المجموعات تحديد القاعدة، ويتسابق الطالب مع مجموعته في التحديد. (5 دقائق)", "1. لعبة المراجعة: يدير المعلم منافسة أسئلة سريعة عن القواعد عبر تطبيق تفاعلي أو بطاقات، ويجيب الطالب مع مجموعته (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. ملف الأعمال: يطلب المعلم ترتيب رسومات الدرس في ملف وتقييمها ذاتيًا، ويقيم الطالب رسوماته وفق بطاقة معايير (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. أسئلة كتاب: يطرح المعلم أسئلة كتاب الطالب المرتبطة بالدرس، ويجيب الطالب عن الأسئلة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يمهد المعلم لدرس اللون في المنظور، ويذكر الطالب ما يحتاج إلى تحسينه (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – ممر السوق القديم: يرسم كل زوج تخطيطًا سريعًا لممر في سوق نزوى التقليدي يتلاشى نحو نقطة واحدة، ويحدد خط الأفق ونقطة التلاشي، ثم يذكر قيمة الأسواق التقليدية في حياة المجتمع العماني (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما القاعدة المناسبة لرسم ممر طويل؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (مستوى التطبيق): ما القاعدة المناسبة لرسم مبنى من زاويته؟\nالإجابة: نقطتا تلاشي.\n\nس3 (مستوى الاستدلال): صحح: «في قاعدة نقطتي التلاشي تميل الخطوط العمودية».\nالإجابة: الخطوط العمودية تبقى عمودية.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر ثلاثة مستويات للنظر.\nالإجابة: أعلى خط الأفق، في مستواه، أسفله.\n\nس2 (مستوى التطبيق): قيّم أفضل رسم لك في الدرس وعلل.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): صمم تمرينًا لزميلك يختبر قاعدة النقطتين.\nالإجابة: مثال: رسم صندوقين مختلفي الحجم بنقطتي تلاشي مشتركتين.", "إرشاد للطالب: يراجع ملف رسوماته ويحدد نقاط قوته.\nإرشاد لولي الأمر: يطلع على ملف إنجاز ابنه ويحفزه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 47–50.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=1"]}], "comb": ["الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\n1. يعرّف مفهوم المنظور الهندسي ودوره في تحقيق العمق الفراغي (البعد الثالث) (10 دقائق)\n2. يتتبع مراحل ظهور المنظور في المدارس الفنية وفنون عصر النهضة (15 دقيقة)\nمخرج آخر: يقدّر أهمية المنظور في إبراز الجوانب الجمالية للمشاهد (15 دقيقة)\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\n1. يتعرف عناصر المنظور الهندسي (5 دقائق)\n2. يحدد خط الأفق ونقطة التلاشي في صور ولوحات (20 دقيقة)\nمخرج آخر: يهتم بالدقة في التحليل الخطي (15 دقيقة)\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\n1. يطبق قواعد المنظور وفقًا لمستويات النظر المختلفة لرسم مجسم (10 دقائق)\n2. يرسم ثلاثة مكعبات بمستويات نظر مختلفة في مساحة (10×10) سم (20 دقيقة)\nمخرج آخر: يلتزم بالدقة في القياس والرسم (10 دقائق)\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\n1. يرسم مجسمات من البيئة في مستويات نظر مختلفة (25 دقيقة)\n2. يطبق خطوات المنظور بدقة على أشكال مستطيلة (5 دقائق)\nمخرج آخر: يتقبل النقد حول رسوماته (10 دقائق)\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\n1. يتعرف خطوات رسم مجسم بقاعدة نقطة تلاشي واحدة (10 دقائق)\n2. يرسم صندوقًا بقاعدة نقطة التلاشي الواحدة (20 دقيقة)\nمخرج آخر: يهتم بتطبيق القاعدة بدقة (10 دقائق)\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\n1. يرسم مجسمًا (كرسيًا أو طاولة) بقاعدة نقطة التلاشي الواحدة (25 دقيقة)\n2. يوضح خطوات تطبيق القاعدة على مجسم مركب (5 دقائق)\nمخرج آخر: يناقش زملاءه في مدى مراعاتهم للقاعدة (10 دقائق)\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\n1. يتعرف خطوات رسم مجسم بقاعدة نقطتي التلاشي (10 دقائق)\n2. يرسم مكعبًا بالزاوية بقاعدة نقطتي التلاشي (20 دقيقة)\nمخرج آخر: يميز بين قاعدتي النقطة الواحدة والنقطتين (10 دقائق)\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\n1. يرسم مجسمًا بقاعدة نقطتي التلاشي (20 دقيقة)\n2. يتقن تحديد زاوية النظر المناسبة (10 دقائق)\nمخرج آخر: يتقبل النقد حول رسمه (10 دقائق)\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\n1. يحلل بعض اللوحات الفنية في ضوء قواعد المنظور (15 دقيقة)\n2. يطبق قواعد المنظور عند التقاط صور فوتوغرافية لإبراز الجوانب الجمالية (15 دقيقة)\nمخرج آخر: يناقش زملاءه في مدى تطبيق القواعد (10 دقائق)\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\n1. يراجع قواعد المنظور (زاوية النظر، نقطة تلاشي، نقطتا تلاشي، مستويات النظر) (10 دقائق)\n2. يحكم على رسوماته ورسومات زملائه في ضوء القواعد (15 دقيقة)\nمخرج آخر: يتقبل النقد ويستفيد منه (15 دقيقة)", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم دة نقطتي التلاشي\n1. التعلم الذاتي\n2. التعلم التشاركي\n3. التعلم بالممارسة العملية\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\n1. التعلم التعاوني\n2. التعلم بالاكتشاف\n3. الحوار والمناقشة\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\n1. التعلم المبني على اللعب\n2. التعلم التشاركي\n3. التقويم الذاتي", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. الكتاب\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\n1. السبورة الذكية\n2. صورة توضيحية\n3. الأقلام\n4. أخرى: مسطرة، ورق شفاف\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\n1. السبورة التقليدية\n2. الكتاب\n3. أخرى: مسطرة، منقلة، قلم رصاص\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\n1. صورة توضيحية\n2. أخرى: نماذج حقيقية (كتب، صناديق)، أدوات رسم\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\n1. السبورة الذكية\n2. السبورة التقليدية\n3. الكتاب\n4. أخرى: مسطرة\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\n1. صورة توضيحية\n2. الكتاب\n3. أخرى: كرسي أو طاولة نموذجًا، أدوات رسم\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\n1. السبورة الذكية\n2. السبورة التقليدية\n3. الكتاب\n4. أخرى: مسطرة طويلة\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\n1. صورة توضيحية\n2. الكتاب\n3. أخرى: نماذج أثاث، أدوات رسم\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: كاميرا الهاتف أو الكاميرا المدرسية بإشراف المعلم\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\n1. السبورة الذكية\n2. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n3. الكتاب", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\n1. المنظور الهندسي\n2. العمق الفراغي (البعد الثالث)\n3. عصر النهضة\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\n1. خط الأفق\n2. نقطة التلاشي\n3. نقطة الوقوف (الرؤية)\n4. خطوط الرؤية\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\n1. مستوى النظر\n2. أعلى خط الأفق\n3. أسفل خط الأفق\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\n1. المجسم\n2. مستويات النظر\n3. التناسب\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\n1. نقطة التلاشي الواحدة\n2. المنظور الأمامي (المواجه)\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\n1. المجسم المركب\n2. خطوط الرؤية\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\n1. نقطتا التلاشي\n2. المنظور الزاوي\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\n1. زاوية النظر\n2. المنظور الزاوي\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\n1. التحليل الخطي\n2. زاوية التصوير\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\n1. قواعد المنظور الهندسي\n2. النقد الفني", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nالتعلم القبلي: رسم المجسمات وإظهار القرب والبعد بتغيير الأحجام في المراحل السابقة.\nيعرض المعلم صورة لطريق مستقيم يمتد نحو الأفق ويسأل: لماذا يبدو الطريق ضيقًا كلما ابتعد مع أنه بالعرض نفسه؟ ويفسر الطالب الظاهرة بأن الأشياء تصغر كلما ابتعدت عن العين. (5 دقائق)\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nالتعلم القبلي: مفهوم المنظور ونشأته.\nيضع المعلم ورقًا شفافًا على صورة ممر ويسأل: إلى أين تتجه خطوط الجدران إذا مددناها؟ ويتوقع الطالب التقاءها في نقطة واحدة. (5 دقائق)\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nالتعلم القبلي: عناصر المنظور.\nيرفع المعلم كتابًا فوق مستوى عيون الطلبة ثم يخفضه ويسأل: متى رأيتم وجهه السفلي؟ ومتى العلوي؟ ويربط الطالب الوجه الظاهر بموقع الجسم من مستوى العين. (5 دقائق)\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nالتعلم القبلي: رسم المكعبات في مستويات النظر.\nيضع المعلم صندوقًا على الطاولة وآخر على الرف ويسأل: كيف ستختلف رسمة كل منهما؟ ويتوقع الطالب الأوجه الظاهرة لكل صندوق. (5 دقائق)\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nالتعلم القبلي: عناصر المنظور ومستويات النظر.\nيعرض المعلم صورة لسكة قطار ويسأل: كم نقطة تلاشي ترى؟ ويحدد الطالب نقطة واحدة تلتقي فيها القضبان. (5 دقائق)\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nالتعلم القبلي: رسم صندوق بنقطة تلاشي واحدة.\nيسأل المعلم: كيف نحول الصندوق المرسوم إلى طاولة؟ ويقترح الطالب إضافة أرجل وتنحيف السطح. (5 دقائق)\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nالتعلم القبلي: قاعدة نقطة التلاشي الواحدة.\nيعرض المعلم صورة لمبنى من زاويته ويسأل: هل تلتقي خطوط الجانبين في نقطة واحدة؟ ويلاحظ الطالب وجود نقطتين على جانبي الصورة. (5 دقائق)\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nالتعلم القبلي: رسم مكعب بنقطتي تلاشي.\nيدير المعلم طاولة نموذجية بزاوية ويسأل: كم وجهًا جانبيًا ترى الآن؟ ويذكر الطالب وجهين جانبيين. (5 دقائق)\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nالتعلم القبلي: قاعدتا نقطة التلاشي ونقطتي التلاشي.\nيعرض المعلم صورتين لمبنى المدرسة من زاويتين ويسأل: أيهما تُظهر عمقًا أكبر؟ ولماذا؟ ويقارن الطالب ويعلل باتجاه الخطوط. (5 دقائق)\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nالتعلم القبلي: رسومات الدرس كاملة.\nيطلق المعلم تحديًا سريعًا: أرسم على السبورة مجسمات وعلى المجموعات تحديد القاعدة، ويتسابق الطالب مع مجموعته في التحديد. (5 دقائق)", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة — زمن الحصة 40 دقيقة\n\n1. مفهوم المنظور: يوضح المعلم أن المنظور الهندسي رسم ما تراه العين من مسطحات ومجسمات كما تبدو في الواقع لتحقيق العمق الفراغي، ويصوغ الطالب تعريفًا للمنظور بلغته (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. نشأة المنظور: يعرض المعلم أعمالًا من عصر النهضة ويتتبع مع الطلبة ظهور قواعد المنظور فيها، ويتتبع الطالب تطور المنظور ويدون أبرز ملاحظاته (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. مقارنة: يعرض المعلم قبة الجامع الأكبر وقبة كاتدرائية فلورنسا (الشكل 1) ويطلب المقارنة من حيث وضوح عناصر المنظور، ويقارن الطالب بين الصورتين مع مجموعته (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يلخص المعلم بخريطة ذهنية لمفهوم المنظور، ويذكر الطالب فائدة المنظور للفنان والمصمم (4 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية — زمن الحصة 40 دقيقة\n\n1. تعريف العناصر: يعرّف المعلم خط الأفق (مستوى عين الرسام) ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية بالرسم على السبورة، ويرسم الطالب العناصر في دفتره مع تعريفاتها (7 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. تحليل صور: يوزع المعلم صورًا لممرات وشوارع ويطلب تحديد العناصر بالورق الشفاف، ويمد الطالب خطوط الرؤية ويحدد خط الأفق ونقطة التلاشي (8 دقائق)\nالاستراتيجيات: صندوق).\n\n3. مشاركة: يعرض المعلم تحليلات المجموعات ويصحح الأخطاء، ويعرض الطالب تحليله ويناقش (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يربط المعلم خط الأفق بمستوى النظر تمهيدًا للحصة القادمة، ويذكر الطالب عنصرين ودوريهما (4 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم الخطوات: خط الأفق بقياس 10 سم، تحديد نقطتين في نهايتيه، خطوط مائلة بزاوية من كل نقطة فوق الخط وأسفله، ويتابع الطالب الخطوات (6 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. رسم المكعبات: يتابع المعلم رسم ثلاثة مكعبات ناتجة من تقاطع الخطوط بمستويات نظر مختلفة، ويرسم الطالب المكعبات الثلاثة (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. المراجعة: يتحقق المعلم من وضوح الأوجه الظاهرة في كل مكعب، ويراجع الطالب رسمه (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطلب المعلم مقارنة الأوجه الظاهرة في المكعبات الثلاثة، ويقارن الطالب ويستنتج (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق) — زمن الحصة 40 دقيقة\n\n1. توزيع النماذج: يوزع المعلم نماذج مجسمة ويحدد مواضعها بالنسبة لمستوى العين، ويلاحظ الطالب النماذج من مقعده (4 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\n2. الرسم: يتابع المعلم ويوجه إلى تحويل المكعب إلى متوازي مستطيلات بحسب أبعاد المجسم، ويرسم الطالب الكتاب أو الصندوق في ثلاثة مستويات (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تبادل: يطلب المعلم تبادل الرسوم، ويقدم الطالب ملاحظة لزميله (2 دقيقتان)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يعرض المعلم نماذج متميزة، ويتقبل الطالب الملاحظات ويعدل (3 دقائق)\nالاستراتيجيات: صندوق).\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق — زمن الحصة 40 دقيقة\n\n1. الخطوات: يوضح المعلم: رسم خط الأفق وتحديد نقطة التلاشي، تحديد نقطة الوقوف، رسم خطوط مائلة باتجاه نقطة التلاشي، رسم المجسم من التقاطعات، والطلبة يدون الخطوات (6 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. التمرين: يتابع المعلم رسم صندوق بوجه أمامي مواجه وخطوط عمق نحو نقطة التلاشي، ويرسم الطالب صندوقًا بنقطة تلاشي واحدة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. التحقق: يتحقق المعلم من التقاء الخطوط، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يمهد المعلم لرسم الكرسي أو الطاولة، ويحدد الطالب المجسم الذي سيرسمه (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة — زمن الحصة 40 دقيقة\n\n1. التبسيط: يوضح المعلم تبسيط الكرسي إلى صناديق (المقعد، الظهر، الأرجل)، ويحلل الطالب المجسم إلى صناديق (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الرسم: يتابع المعلم ويوجه إلى الشكل (2 أ، ب)، ويرسم الطالب الكرسي أو الطاولة بالقاعدة (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النقاش: يناقش المعلم أخطاء شائعة، ويتعرف الطالب الأخطاء (1 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n4. الختام: ينظم المعلم نقاشًا حول مراعاة القاعدة، ويناقش الطالب زملاءه (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية — زمن الحصة 40 دقيقة\n\n1. الخطوات: يوضح المعلم: خط الأفق ونقطتا التلاشي على طرفيه، نقطة الوقوف، خطوط مائلة باتجاه النقطتين، رسم المجسم من التقاطعات، والطلبة يدون الخطوات (6 دقائق)\nالاستراتيجيات: صندوق).\n\n2. التمرين: يتابع المعلم رسم مكعب حافته الأمامية عمودية، ويرسم الطالب مكعبًا بنقطتي تلاشي (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مقارنة: يطلب المعلم المقارنة بالقاعدة السابقة، ويقارن الطالب (1 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n4. الختام: يمهد المعلم لرسم المجسم بالقاعدة، ويختار الطالب مجسمه (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي — زمن الحصة 40 دقيقة\n\n1. التخطيط: يوجه المعلم إلى اختيار زاوية النظر وموقع خط الأفق، ويحدد الطالب زاويته وخط الأفق (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الرسم: يتابع المعلم الرسم وفق الشكل (4)، ويرسم الطالب المجسم بنقطتي تلاشي (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التحقق: يتحقق المعلم من اتجاه الخطوط إلى النقطتين، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الختام: يعرض المعلم أعمالًا للنقد، ويتقبل الطالب النقد ويعدل (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور — زمن الحصة 40 دقيقة\n\n1. تحليل اللوحات: يوزع المعلم لوحات ويطلب تحديد خط الأفق ونقاط التلاشي ونوع القاعدة، ويحلل الطالب اللوحة مع مجموعته (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. التصوير: ينظم المعلم جولة تصوير قصيرة داخل المدرسة لالتقاط مشاهد بقواعد المنظور، ويلتقط الطالب صورًا بزاوية تبرز المنظور (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. العرض: يعرض بعض الصور، ويشرح الطالب القاعدة في صورته (2 دقيقتان)\nالاستراتيجيات: صندوق).\n\n4. الختام: يلخص المعلم علاقة المنظور بالتصوير، ويذكر الطالب قاعدة طبقها في التصوير (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس — زمن الحصة 40 دقيقة\n\n1. لعبة المراجعة: يدير المعلم منافسة أسئلة سريعة عن القواعد عبر تطبيق تفاعلي أو بطاقات، ويجيب الطالب مع مجموعته (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. ملف الأعمال: يطلب المعلم ترتيب رسومات الدرس في ملف وتقييمها ذاتيًا، ويقيم الطالب رسوماته وفق بطاقة معايير (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. أسئلة كتاب: يطرح المعلم أسئلة كتاب الطالب المرتبطة بالدرس، ويجيب الطالب عن الأسئلة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يمهد المعلم لدرس اللون في المنظور، ويذكر الطالب ما يحتاج إلى تحسينه (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – ممر السوق القديم: يرسم كل زوج تخطيطًا سريعًا لممر في سوق نزوى التقليدي يتلاشى نحو نقطة واحدة، ويحدد خط الأفق ونقطة التلاشي، ثم يذكر قيمة الأسواق التقليدية في حياة المجتمع العماني (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بالمنظور الهندسي؟\nالإجابة: علم يقوم على رسم ما تراه العين من مسطحات أو مجسمات كما تبدو في الواقع لتحقيق العمق الفراغي.\n\nس2 (مستوى التطبيق): في أي عصر برزت قواعد المنظور في الفن؟\nالإجابة: عصر النهضة.\n\nس3 (مستوى الاستدلال): لماذا يحتاج المعماري والمصمم الداخلي إلى المنظور؟\nالإجابة: لعرض التصاميم بصورة واقعية توضح الأبعاد والعمق قبل التنفيذ.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بخط الأفق؟\nالإجابة: الخط الذي يمثل مستوى عين الناظر.\n\nس2 (مستوى التطبيق): أين تلتقي خطوط الرؤية؟\nالإجابة: في نقطة التلاشي على خط الأفق.\n\nس3 (مستوى الاستدلال): ماذا يحدث لنقطة التلاشي إذا جلس الرسام على الأرض؟\nالإجابة: ينخفض خط الأفق فتنخفض نقطة التلاشي معه.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أي وجه يظهر من مكعب يقع أسفل خط الأفق؟\nالإجابة: الوجه العلوي.\n\nس2 (مستوى التطبيق): ما قياس خط الأفق في التمرين؟\nالإجابة: 10 سم.\n\nس3 (مستوى الاستدلال): لماذا لا يظهر الوجه العلوي ولا السفلي لمكعب في مستوى خط الأفق؟\nالإجابة: لأن مستوى العين يقطع المكعب فيرى الناظر الأوجه الجانبية فقط.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف تحول المكعب إلى شكل كتاب؟\nالإجابة: بتغيير أبعاده ليصبح متوازي مستطيلات رفيعًا.\n\nس2 (مستوى التطبيق): أين يقع مجسم على رف مرتفع بالنسبة لخط الأفق؟\nالإجابة: أعلى خط الأفق.\n\nس3 (مستوى الاستدلال): ما الخطأ إذا ظهر الوجه العلوي لمجسم أعلى خط الأفق؟\nالإجابة: خطأ في توجيه خطوط الرؤية؛ إذ يجب أن يظهر الوجه السفلي.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما أول خطوة في رسم مجسم بنقطة تلاشي واحدة؟\nالإجابة: رسم خط الأفق وتحديد نقطة التلاشي عليه.\n\nس2 (مستوى التطبيق): ما شكل الوجه الأمامي للصندوق في هذه القاعدة؟\nالإجابة: شكله الحقيقي (مربع أو مستطيل) دون تشويه.\n\nس3 (مستوى الاستدلال): متى نختار نقطة تلاشي واحدة؟\nالإجابة: عندما يواجه أحد أوجه المجسم الناظر مباشرة.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف تبسط رسم الكرسي؟\nالإجابة: بتحليله إلى صناديق للمقعد والظهر والأرجل.\n\nس2 (مستوى التطبيق): إلى أين تتجه خطوط أرجل الطاولة الخلفية؟\nالإجابة: إلى نقطة التلاشي نفسها.\n\nس3 (مستوى الاستدلال): لماذا تبدو الأرجل الخلفية أقصر؟\nالإجابة: لأنها أبعد عن الناظر فتصغر بحسب المنظور.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أين تقع نقطتا التلاشي؟\nالإجابة: على خط الأفق في طرفيه.\n\nس2 (مستوى التطبيق): ما الذي يواجه الناظر في قاعدة نقطتي التلاشي؟\nالإجابة: حافة (زاوية) المجسم لا وجهه.\n\nس3 (مستوى الاستدلال): لماذا يُفضل وضع نقطتي التلاشي متباعدتين؟\nالإجابة: لتجنب تشوه المجسم ومبالغة العمق.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): إلى أين تتجه خطوط الجانب الأيمن للطاولة؟\nالإجابة: إلى نقطة التلاشي اليمنى.\n\nس2 (مستوى التطبيق): هل تبقى الخطوط العمودية عمودية في هذه القاعدة؟\nالإجابة: نعم، تبقى عمودية.\n\nس3 (مستوى الاستدلال): اقترح زاوية تُظهر تفاصيل الكرسي أكثر.\nالإجابة: زاوية مائلة يظهر فيها الظهر والمقعد معًا مع خط أفق أعلى قليلًا.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا نحدد أولًا عند تحليل لوحة؟\nالإجابة: خط الأفق.\n\nس2 (مستوى التطبيق): كيف تستفيد من المنظور في التصوير؟\nالإجابة: باختيار زاوية تبرز خطوط الرؤية والعمق.\n\nس3 (مستوى الاستدلال): حلل صورة التقطها زميلك وحدد نوع القاعدة.\nالإجابة: تحليل صحيح بدليل.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما القاعدة المناسبة لرسم ممر طويل؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (مستوى التطبيق): ما القاعدة المناسبة لرسم مبنى من زاويته؟\nالإجابة: نقطتا تلاشي.\n\nس3 (مستوى الاستدلال): صحح: «في قاعدة نقطتي التلاشي تميل الخطوط العمودية».\nالإجابة: الخطوط العمودية تبقى عمودية.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: يحقق المنظور الإحساس بالبعد ……….\nالإجابة: الثالث (العمق الفراغي).\n\nس2 (مستوى التطبيق): قارن بين قبة الجامع الأكبر وقبة كاتدرائية فلورنسا من حيث وضوح المنظور.\nالإجابة: إجابة تذكر اختلاف زاوية التصوير ووضوح خطوط التلاشي في كل صورة.\n\nس3 (مستوى الاستدلال): اقترح موقفًا في الحياة اليومية تظهر فيه قواعد المنظور.\nالإجابة: مثال: صفوف أعمدة الإنارة على الطريق تصغر وتتقارب كلما ابتعدت.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر عنصرين من عناصر المنظور.\nالإجابة: خط الأفق ونقطة التلاشي.\n\nس2 (مستوى التطبيق): حدد نقطة التلاشي في صورة ممر عُرضت عليك.\nالإجابة: تحديد صحيح بمد خطوط الجدران حتى التقائها.\n\nس3 (مستوى الاستدلال): فسر لماذا يقع خط الأفق في أعلى صورة ملتقطة من مكان مرتفع.\nالإجابة: لأن عين المصور أعلى من المشهد فيرتفع مستوى النظر.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر مستويات النظر الثلاثة.\nالإجابة: أعلى خط الأفق، في مستواه، أسفله.\n\nس2 (مستوى التطبيق): صف ما ظهر في المكعب الواقع أعلى خط الأفق.\nالإجابة: ظهر الوجه السفلي والأوجه الجانبية.\n\nس3 (مستوى الاستدلال): قيّم دقة تقاطع الخطوط في رسمك.\nالإجابة: تقييم معلل يذكر تطابق الحواف مع خطوط الرؤية.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المجسم الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): وضح كيف طبقت مستوى النظر على مجسمك.\nالإجابة: إجابة تربط الأوجه الظاهرة بموقع المجسم.\n\nس3 (مستوى الاستدلال): انقد رسم زميل من حيث تطبيق القاعدة.\nالإجابة: نقد معلل مع اقتراح.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): رتب خطوات القاعدة.\nالإجابة: خط الأفق ونقطة التلاشي، نقطة الوقوف، خطوط الرؤية، المجسم.\n\nس2 (مستوى التطبيق): اشرح لماذا تتجه خطوط العمق إلى نقطة واحدة.\nالإجابة: لأنها خطوط متوازية تبتعد عن الناظر فتبدو ملتقية في نقطة على الأفق.\n\nس3 (مستوى الاستدلال): صحح رسمًا خطوط عمقه لا تلتقي.\nالإجابة: مد الخطوط وتعديلها لتلتقي في نقطة التلاشي.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المجسم الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): اشرح خطوات رسمك.\nالإجابة: إجابة تتضمن خط الأفق ونقطة التلاشي وخطوط الرؤية والتفاصيل.\n\nس3 (مستوى الاستدلال): ناقش مدى مراعاة زميلك للقاعدة.\nالإجابة: نقد معلل.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الفرق بين القاعدتين؟\nالإجابة: الواحدة يواجه فيها الوجه الناظر، والنقطتان تواجه فيهما الحافة.\n\nس2 (مستوى التطبيق): صف شكل الحافة الأمامية للمكعب.\nالإجابة: خط عمودي.\n\nس3 (مستوى الاستدلال): حلل صورة مبنى وحدد نوع قاعدة المنظور فيها.\nالإجابة: تحليل صحيح بدليل الخطوط.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المجسم الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف كيف حددت زاوية النظر.\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (مستوى الاستدلال): قيّم رسمك من حيث تطبيق القاعدة.\nالإجابة: تقييم معلل.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع القاعدة في صورة ممر مستقيم؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (مستوى التطبيق): صف الزاوية التي التقطت بها صورتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): ناقش أي الصور أنجح في إبراز العمق.\nالإجابة: نقاش معلل.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر ثلاثة مستويات للنظر.\nالإجابة: أعلى خط الأفق، في مستواه، أسفله.\n\nس2 (مستوى التطبيق): قيّم أفضل رسم لك في الدرس وعلل.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): صمم تمرينًا لزميلك يختبر قاعدة النقطتين.\nالإجابة: مثال: رسم صندوقين مختلفي الحجم بنقطتي تلاشي مشتركتين.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nإرشاد للطالب: يلاحظ مظاهر المنظور في الطرق والممرات من حوله.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة الأبعاد في الصور الفوتوغرافية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 47–48.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nإرشاد للطالب: يحدد خط الأفق في صور يلتقطها بهاتفه.\nإرشاد لولي الأمر: يتحاور مع ابنه حول زوايا التصوير.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 48.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nإرشاد للطالب: يلاحظ الأجسام فوق مستوى نظره وتحته كالرفوف والطاولات.\nإرشاد لولي الأمر: يتابع مع ابنه الدقة في رسمه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nإرشاد للطالب: يرسم مجسمًا من غرفته بملاحظة مستوى نظره دون تكليف منزلي.\nإرشاد لولي الأمر: يشجع ابنه على الرسم من الطبيعة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nإرشاد للطالب: يلاحظ صور الممرات والقطارات ذات نقطة التلاشي الواحدة.\nإرشاد لولي الأمر: يتابع مع ابنه تطبيق الخطوات بدقة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49–50.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nإرشاد للطالب: يتأمل الأثاث في غرفته ويحلله إلى صناديق.\nإرشاد لولي الأمر: يشجع ابنه على الرسم من الواقع.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 50.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nإرشاد للطالب: يلاحظ المباني من زواياها في الطريق.\nإرشاد لولي الأمر: يناقش ابنه في الفرق بين القاعدتين.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 50.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nإرشاد للطالب: يتأمل الأثاث من زوايا مختلفة.\nإرشاد لولي الأمر: يتابع مع ابنه تقدمه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 50.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nإرشاد للطالب: يلتقط صورًا لمشاهد تبرز المنظور.\nإرشاد لولي الأمر: يشجع ابنه على التصوير الفني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 48–50.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nإرشاد للطالب: يراجع ملف رسوماته ويحدد نقاط قوته.\nإرشاد لولي الأمر: يطلع على ملف إنجاز ابنه ويحفزه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 47–50.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=1"]}, {"title": "الدرس الثاني: اللون في المنظور الهندسي", "unit": "الوحدة الثالثة: المنظور الهندسي", "periods": [{"ax": "مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)", "n": 1, "w": "الأسبوع الثالث: من 20/9/2026 إلى 24/9/2026 – الحصة 1 من حصص الأسبوع", "pg": "51–52", "f": ["1. يتعرف مفهوم التباين اللوني وأنواعه (15 دقيقة)\n2. يستنتج دور التباين اللوني في تأكيد الإحساس بالعمق (10 دقائق)\nمخرج آخر: يقدّر أهمية المفاهيم اللونية في العمل الفني (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. الكتاب\n4. أخرى: دائرة الألوان", "1. التباين اللوني\n2. درجة اللون\n3. كنه اللون", "التعلم القبلي: دائرة الألوان والمجموعات اللونية.\nيعرض المعلم مربعًا رماديًا على خلفيتين فاتحة وداكنة ويسأل: هل المربعان بالدرجة نفسها؟ ويتفاجأ الطالب بأنهما متطابقان ويستنتج أثر التباين. (5 دقائق)", "1. المفاهيم: يوضح المعلم الكنه (اسم اللون: أحمر، أزرق) والدرجة (فتوحه وقتامته)، ويميز الطالب الكنه من الدرجة في أمثلة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أنواع التباين: يعرض المعلم أمثلة كتاب الطالب لثلاثة أنواع: تباين في الدرجة، في الكنه، في الدرجة والكنه معًا، ويصنف الطالب الأمثلة (8 دقائق)\nالاستراتيجيات: الحوار والمن , "n": 9, "w": "الأسبوع الرابع: من 27/9/2026 إلى 1/10/2026 – الحصة 4 من حصص الأسبوع", "pg": "53", "f": ["1. يضيف شخوصًا بأبعاد ونسب مختلفة لإظهار المنظور الهندسي (10 دقائق)\n2. يطبق قاعدة تصغير الأحجام بحسب البعد (20 دقيقة)\nمخرج آخر: يهتم بإخراج العمل (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم الذاتي\n2. التعلم المبني على حل المشكلات\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. أخرى: رسم منظوري سابق، قلم رصاص، ألوان مائية", "1. تصغير الأحجام\n2. خط الأفق والشخوص", "التعلم القبلي: رسم الشخوص ورسم المجسمات بالمنظور.\nيرسم المعلم ممرًا وشخصين بالحجم نفسه في القرب والبعد ويسأل: ما الخطأ؟ ويستنتج الطالب أن البعيد يجب أن يصغر. (5 دقائق)", "1. القاعدة: يوضح المعلم أن رؤوس الأشخاص الواقفين تقع على خط الأفق تقريبًا إذا كان الرسام واقفًا، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. التطبيق: يتابع المعلم إضافة ثلاثة شخوص بأحجام متدرجة لمشهد ممر، ويضيف الطالب الشخوص (14 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التحقق: يتحقق المعلم من التدرج، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يعرض المعلم أعمالًا، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أين تقع رؤوس الأشخاص الواقفين بالنسبة لخط الأفق؟\nالإجابة: عليه تقريبًا عندما يكون الرسام واقفًا.\n\nس2 (مستوى التطبيق): لماذا يصغر الشخص البعيد؟\nالإجابة: بسبب البعد عن الناظر وفق المنظور.\n\nس3 (مستوى الاستدلال): صحح مشهدًا يبدو فيه الشخص البعيد عملاقًا.\nالإجابة: تصغيره وفق خطوط الرؤية نحو نقطة التلاشي.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): كم شخصًا أضفت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف كيف حددت أحجامهم.\nالإجابة: باستخدام خطوط الرؤية من نقطة التلاشي.\n\nس3 (مستوى الاستدلال): قيّم إسهام الشخوص في إظهار العمق.\nالإجابة: تقييم معلل.", "إرشاد للطالب: يلاحظ أحجام الناس في الصور بحسب بعدهم.\nإرشاد لولي الأمر: يتابع مع ابنه تطور أعماله.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 53.\n🎮 رابط ألعاب ون مر على أرضية خضراء بالدرجة نفسها ويسأل: ما نوع التباين هنا؟ ويحدد الطالب التباين في الكنه. (5 دقائق)\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\nالتعلم القبلي: التباين اللوني وأنواعه.\nيعرض المعلم صورة لسلسلة جبال تتدرج من الداكن للفاتح ويسأل: أي جبل أبعد؟ كيف عرفت؟ ويستدل الطالب بفتوح اللون وضعف وضوحه. (5 دقائق)\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\nالتعلم القبلي: مفهوم التدرج اللوني.\nينفذ المعلم أمامهم شريط تدرج سريعًا ويسأل: كيف اختفت الحدود بين الدرجات؟ ويتوقع الطالب إضافة الماء تدريجيًا. (5 دقائق)\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\nالتعلم القبلي: التدرج اللوني والعمق اللوني.\nيعرض المعلم دائرتين متساويتين برتقالية وزرقاء ويسأل: أيهما تبدو أقرب؟ ويلاحظ الطالب تقدم البرتقالية. (5 دقائق)\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nالتعلم القبلي: التدرج والمنظور اللوني.\nيعرض المعلم الرسم نفسه على ثلاث خلفيات ويسأل: أي خلفية خدمت الرسم؟ ويختار الطالب ويعلل. (5 دقائق)\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nالتعلم القبلي: رسم المجسمات بقواعد المنظور.\nيطلب المعلم من طالب أن يقف ثم يجلس ثم يمشي ويسأل: ما الذي يتغير في هيئته؟ ويلاحظ الطالب تغير الخطوط والزوايا. (5 دقائق)\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nالتعلم القبلي: رسم الشخوص ورسم المجسمات بالمنظور.\nيرسم المعلم ممرًا وشخصين بالحجم نفسه في القرب والبعد ويسأل: ما الخطأ؟ ويستنتج الطالب أن البعيد يجب أن يصغر. (5 دقائق)\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nالتعلم القبلي: تمارين الدرس.\nيسأل المعلم: أي مفاهيم الدرس ستستخدم في إخراج عملك؟ ويذكر الطالب التباين والتدرج والخلفية. (5 دقائق)", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا) — زمن الحصة 40 دقيقة\n\n1. المفاهيم: يوضح المعلم الكنه (اسم اللون: أحمر، أزرق) والدرجة (فتوحه وقتامته)، ويميز الطالب الكنه من الدرجة في أمثلة (7 دقائق)\nالاستراتيجيات: فيهما معًا).\n\n2. أنواع التباين: يعرض المعلم أمثلة كتاب الطالب لثلاثة أنواع: تباين في الدرجة، في الكنه، في الدرجة والكنه معًا، ويصنف الطالب الأمثلة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. العمق: يناقش المعلم كيف يبرز التباين القريب ويبعد غير المتباين، ويستنتج الطالب العلاقة بين التباين والعمق (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يبني المعلم خريطة ذهنية للتباين، ويكمل الطالب الخريطة (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم — زمن الحصة 40 دقيقة\n\n1. رسم المربعات: يوجه المعلم إلى رسم مربعات بقياس (10×10) سم، ويرسم الطالب المربعات (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. النمذجة: ينمذج المعلم تنفيذ شكل بدرجة داكنة على أرضية فاتحة من اللون نفسه، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التنفيذ: يتابع المعلم التنفيذ، وينفذ الطالب تمرين التباين في الدرجة (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف الحر.\n\n4. الختام: يعرض المعلم التمارين ويقارن قوة التباين، ويقيم الطالب تمرينه (3 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا — زمن الحصة 40 دقيقة\n\n1. تمرين الكنه: يتابع المعلم تنفيذ مربع بتباين في الكنه مع ثبات الدرجة تقريبًا، وينفذ الطالب التمرين (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تمرين الكنه والدرجة: يتابع المعلم تنفيذ مربع بتباين في الكنه والدرجة معًا، وينفذ الطالب التمرين (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. المقارنة: يطلب المعلم ترتيب المربعات الثلاثة بحسب قوة الإبراز، ويرتب الطالب ويعلل (1 دقيقة)\nالاستراتيجيات: في الكنه.\n\n4. الختام: يستنتج المعلم أن الجمع بينهما أقوى إبرازًا، والطلبة يدون الاستنتاج (4 دقائق)\nالاستراتيجيات: فيهما معًا).\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة — زمن الحصة 40 دقيقة\n\n1. المفهوم: يوضح المعلم التدرج اللوني ودوره في إيهام العمق، ويصوغ الطالب التعريف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التحليل: يعرض المعلم اللوحة (الشكل 6) ويطلب تحليل ألوانها من المقدمة إلى الخلفية، ويحلل الطالب التدرج ويحدد مستويات العمق (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. العرض: يستمع المعلم لتحليلات المجموعات، ويعرض الطالب التحليل (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يمهد المعلم لتمرين التدرج، ويحدد الطالب اللون الذي سيتدرج به (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم التدرج بسحب اللون مع زيادة الماء تدريجيًا، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف الحر.\n\n2. التنفيذ: يتابع المعلم التنفيذ في المساحة المحددة، وينفذ الطالب التدرج مؤكدًا العمق (15 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n3. الملاحظة: يطلب المعلم الابتعاد عن العمل وملاحظته، ويتأمل الطالب (1 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يعرض المعلم التمارين الناجحة، ويقيم الطالب تمرينه (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني — زمن الحصة 40 دقيقة\n\n1. المفهوم: يوضح المعلم أن الألوان الحارة تبدو متقدمة والباردة متراجعة، ويصنف الطالب الألوان (7 دقائق)\nالاستراتيجيات: في الكنه.\n\n2. التمرين: يطلب المعلم تنفيذ مشهد مبسط بثلاث مستويات: مقدمة حارة، وسط متوسط، خلفية باردة، وينفذ الطالب التمرين (13 دقيقة)\nالاستراتيجيات: فيهما معًا).\n\n3. التحقق: يتحقق المعلم من الإحساس بالعمق، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يلخص المعلم قاعدة الحار والبارد، ويذكر الطالب القاعدة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني — زمن الحصة 40 دقيقة\n\n1. العرض: يعرض المعلم الشكل (7) لخلفيات أفقية وعمودية ودائرية ومائلة، ويلاحظ الطالب الأنواع (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التجريب: يتابع المعلم تجريب ثلاث خلفيات صغيرة بأساليب مختلفة، وينفذ الطالب الخلفيات (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الاختيار: يطلب المعلم اختيار الأنسب، ويختار الطالب ويعلل (1 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يربط المعلم الخلفية بالمشهد المنظوري، ويذكر الطالب الخلفية المختارة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف الحر.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص — زمن الحصة 40 دقيقة\n\n1. النسب: يوضح المعلم تقسيم الجسم بقياس الرأس وتبسيطه إلى خطوط ومساحات، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. الرسم: يتابع المعلم رسم شخوص بأوضاع (وقوف، جلوس، مشي) وفق الشكل (8)، ويرسم الطالب ثلاثة أوضاع (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. المراجعة: يتحقق المعلم من النسب، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يمهد المعلم لإضافة الشخوص للمشهد، ويختار الطالب وضعًا مناسبًا (4 دقائق)\nالاستراتيجيات: في الكنه.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري — زمن الحصة 40 دقيقة\n\n1. القاعدة: يوضح المعلم أن رؤوس الأشخاص الواقفين تقع على خط الأفق تقريبًا إذا كان الرسام واقفًا، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التطبيق: يتابع المعلم إضافة ثلاثة شخوص بأحجام متدرجة لمشهد ممر، ويضيف الطالب الشخوص (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التحقق: يتحقق المعلم من التدرج، ويراجع الطالب (1 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الختام: يعرض المعلم أعمالًا، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج — زمن الحصة 40 دقيقة\n\n1. الإخراج: يتابع المعلم تلوين المشهد بالشخوص والخلفية، ويُخرج الطالب العمل (12 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. الحكم: ينظم المعلم تقييمًا بمعايير التباين والتدرج، ويحكم الطالب على الأعمال (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف الحر.\n\n3. أسئلة الكتاب: يطرح المعلم سؤالًا من كتاب الطالب، ويجيب الطالب (1 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n4. الختام: يمهد المعلم لدرس المشهد الداخلي، ويذكر الطالب استفادته (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. غلق الدرس – عمق جبال الحجر: تناقش المجموعات كيف يُظهر التباين اللوني عمق سلسلة جبال الحجر خلف قرية جبلية، فتقترح ألوانًا للعناصر القريبة وأخرى للبعيدة وتعرض اقتراحها مع التعليل (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بكنه اللون؟\nالإجابة: اسم اللون أو نوعه كالأحمر والأزرق.\n\nس2 (مستوى التطبيق): اذكر أنواع التباين اللوني الثلاثة.\nالإجابة: في الدرجة، في الكنه، في الدرجة والكنه معًا.\n\nس3 (مستوى الاستدلال): لماذا تبدو العناصر عالية التباين أقرب؟\nالإجابة: لأنها تجذب العين بقوة فتبدو بارزة في المقدمة.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف تفتح اللون في الألوان المائية؟\nالإجابة: بزيادة الماء.\n\nس2 (مستوى التطبيق): هل يتغير الكنه في هذا التمرين؟\nالإجابة: لا، تتغير الدرجة فقط.\n\nس3 (مستوى الاستدلال): كيف تزيد قوة التباين في الدرجة؟\nالإجابة: بزيادة الفرق بين أفتح درجة وأغمقها.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أعطِ مثالًا على تباين في الكنه.\nالإجابة: أحمر بجوار أخضر بدرجة متقاربة.\n\nس2 (مستوى التطبيق): أي أنواع التباين أقوى إبرازًا؟\nالإجابة: التباين في الدرجة والكنه معًا.\n\nس3 (مستوى الاستدلال): متى يفضل الفنان التباين في الكنه وحده؟\nالإجابة: عندما يريد تنوعًا لونيًا دون إبراز مفرط.\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المقصود بالتدرج اللوني؟\nالإجابة: انتقال اللون تدريجيًا من درجة إلى أخرى.\n\nس2 (مستوى التطبيق): كيف تبدو الألوان البعيدة عادة؟\nالإجابة: أفتح وأقل تشبعًا وأميل إلى الزرقة.\n\nس3 (مستوى الاستدلال): كيف يحقق التدرج العمق اللوني في المنظور؟\nالإجابة: بتفتيح الألوان وتقليل تشبعها كلما ابتعدت.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف تحصل على تدرج ناعم؟\nالإجابة: بإضافة الماء تدريجيًا مع العمل والورق رطب.\n\nس2 (مستوى التطبيق): لماذا نستخدم فرشاة عريضة؟\nالإجابة: لتغطية المساحة بسرعة قبل الجفاف.\n\nس3 (مستوى الاستدلال): حلل تمرينك: هل يوحي بالعمق؟\nالإجابة: تحليل معلل.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اذكر لونين حارين.\nالإجابة: الأحمر والبرتقالي.\n\nس2 (مستوى التطبيق): لماذا تُلون الخلفيات بألوان باردة؟\nالإجابة: لأنها توحي بالبعد والتراجع.\n\nس3 (مستوى الاستدلال): ماذا يحدث لو لُونت الخلفية بالأحمر؟\nالإجابة: تبدو متقدمة فيضعف الإحساس بالعمق.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما وظيفة الخلفية في الإخراج؟\nالإجابة: إبراز العمل وتوجيه العين.\n\nس2 (مستوى التطبيق): بماذا توحي الخلفية الأفقية؟\nالإجابة: بالهدوء والامتداد.\n\nس3 (مستوى الاستدلال): حلل أي خلفية تناسب مشهدًا معماريًا ذا عمق.\nالإجابة: تدرج من الداكن للفاتح باتجاه نقطة التلاشي.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما وحدة قياس نسب الجسم؟\nالإجابة: الرأس.\n\nس2 (مستوى التطبيق): كيف تبسط رسم الشخص؟\nالإجابة: بخطوط للهيكل وأشكال بيضاوية للأجزاء.\n\nس3 (مستوى الاستدلال): لماذا تضيف الشخوص حيوية للمشهد المنظوري؟\nالإجابة: لأنها توضح المقياس والحجم وتمنح المشهد حياة.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أين تقع رؤوس الأشخاص الواقفين بالنسبة لخط الأفق؟\nالإجابة: عليه تقريبًا عندما يكون الرسام واقفًا.\n\nس2 (مستوى التطبيق): لماذا يصغر الشخص البعيد؟\nالإجابة: بسبب البعد عن الناظر وفق المنظور.\n\nس3 (مستوى الاستدلال): صحح مشهدًا يبدو فيه الشخص البعيد عملاقًا.\nالإجابة: تصغيره وفق خطوط الرؤية نحو نقطة التلاشي.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف وظفت التباين في عملك؟\nالإجابة: إجابة شخصية صحيحة.\n\nس2 (مستوى التطبيق): أين ظهر التدرج في عملك؟\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا لعمل زميل.\nالإجابة: إجابة معللة.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): عرّف درجة اللون.\nالإجابة: مدى فتوح اللون أو قتامته.\n\nس2 (مستوى التطبيق): صنف: أزرق فاتح بجوار أزرق داكن.\nالإجابة: تباين في الدرجة.\n\nس3 (مستوى الاستدلال): اقترح تباينًا مناسبًا لإبراز باب في مقدمة مشهد.\nالإجابة: تباين في الدرجة والكنه معًا بين الباب والجدار.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع التباين في تمرينك؟\nالإجابة: تباين في الدرجة.\n\nس2 (مستوى التطبيق): صف طريقة حصولك على الدرجة الداكنة.\nالإجابة: تقليل الماء وزيادة الصبغة أو طبقات متتالية.\n\nس3 (مستوى الاستدلال): قيّم وضوح الشكل على الأرضية في تمرينك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع التباين في: أصفر فاتح وبنفسجي داكن؟\nالإجابة: تباين في الدرجة والكنه معًا.\n\nس2 (مستوى التطبيق): رتب تمارينك الثلاثة بحسب قوة التباين.\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): حلل أثر التباين على الإحساس بالعمق في تمارينك.\nالإجابة: تحليل يربط قوة التباين بالقرب.\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): عرّف العمق اللوني.\nالإجابة: الإحساس بالبعد الناتج من تدرج الألوان وتغير تشبعها.\n\nس2 (مستوى التطبيق): حدد المقدمة والخلفية في اللوحة المحللة بالألوان.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): اقترح تدرجًا لونيًا لممر طويل.\nالإجابة: ألوان دافئة داكنة قريبًا تتدرج إلى فاتحة باردة بعيدًا.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الخامة المستخدمة؟\nالإجابة: الألوان المائية.\n\nس2 (مستوى التطبيق): صف خطوات تنفيذ تمرينك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): اقترح استخدامًا للتدرج في مشهد معماري.\nالإجابة: تدرج لون الأرضية في ممر لإظهار امتداده.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: الألوان ……… تبدو متقدمة.\nالإجابة: الحارة.\n\nس2 (مستوى التطبيق): صف توزيع الألوان في تمرينك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم نجاح تمرينك في إظهار العمق.\nالإجابة: تقييم معلل.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر اتجاهين للخلفيات.\nالإجابة: أفقي وعمودي (أو دائري ومائل).\n\nس2 (مستوى التطبيق): ما الخلفية التي اخترتها؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): اقترح خلفية لمعرض أعمال الصف.\nالإجابة: إجابة معللة.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر ثلاثة أوضاع رسمتها.\nالإجابة: وقوف وجلوس ومشي.\n\nس2 (مستوى التطبيق): صف كيف راعيت النسب.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم أحد رسومك من حيث التعبير عن الحركة.\nالإجابة: تقييم معلل.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): كم شخصًا أضفت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف كيف حددت أحجامهم.\nالإجابة: باستخدام خطوط الرؤية من نقطة التلاشي.\n\nس3 (مستوى الاستدلال): قيّم إسهام الشخوص في إظهار العمق.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المفهومان اللونيان المؤكدان للعمق؟\nالإجابة: التباين اللوني والتدرج اللوني.\n\nس2 (مستوى التطبيق): احكم على عملك وفق المعيارين.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): صمم معيارًا ثالثًا لتقويم الإخراج.\nالإجابة: مثال: انسجام الخلفية مع المشهد.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nإرشاد للطالب: يلاحظ التباين في اللافتات والإعلانات.\nإرشاد لولي الأمر: يتحاور مع ابنه حول وضوح الألوان المتباينة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 51–52.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم\nإرشاد للطالب: يلاحظ تدرج لون واحد في الطبيعة.\nإرشاد لولي الأمر: يتابع اهتمام ابنه بنظافة أعماله.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 52.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا\nإرشاد للطالب: يلاحظ التباين في ألوان الملابس والإعلانات.\nإرشاد لولي الأمر: يشجع ابنه على التجريب اللوني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 52.\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\nإرشاد للطالب: يلاحظ تغير ألوان الجبال البعيدة.\nإرشاد لولي الأمر: يتأمل مع ابنه مشاهد طبيعية ممتدة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 52.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\nإرشاد للطالب: يلاحظ تدرج ألوان السماء.\nإرشاد لولي الأمر: يشجع ابنه على التأمل في الطبيعة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 52.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\nإرشاد للطالب: يلاحظ أثر ألوان الغرف في الإحساس بالمساحة.\nإرشاد لولي الأمر: يتحاور مع ابنه حول ألوان المنزل.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 51–52.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nإرشاد للطالب: يلاحظ الخلفيات في الملصقات.\nإرشاد لولي الأمر: يتابع تجارب ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 53.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nإرشاد للطالب: يلاحظ حركات الناس من حوله ويرسمها سريعًا إن رغب.\nإرشاد لولي الأمر: يشجع ابنه على الرسم السريع (الاسكتش).\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 53.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nإرشاد للطالب: يلاحظ أحجام الناس في الصور بحسب بعدهم.\nإرشاد لولي الأمر: يتابع مع ابنه تطور أعماله.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 53.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nإرشاد للطالب: يحتفظ بعمله في ملف الإنجاز.\nإرشاد لولي الأمر: يطلع على أعمال ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 51–53.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=2"]}, {"title": "الدرس الثالث: المنظور لمشهد داخلي", "unit": "الوحدة الثالثة: المنظور الهندسي", "periods": [{"ax": "تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية", "n": 1, "w": "الأسبوع الخامس: من 4/10/2026 إلى 8/10/2026 – الحصة 1 من حصص الأسبوع", "pg": "54–55", "f": ["1. يحدد بالخطوط الأفقية والعمودية قواعد المنظور في مشاهد داخلية مختلفة (15 دقيقة)\n2. يتحدث عن م الذاتي.\n\n3. أسئلة الكتاب: يطرح المعلم أسئلة الكتاب، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يلخص المعلم الدرس، ويلخص الطالب استفادته (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – مجلس البيت العماني: تحدد المجموعات خطوط المنظور في مشهد داخلي لمجلس عماني تقليدي بنوافذه الخشبية ووسائده، ثم تتحدث عن قيمة الضيافة العمانية وتقديم القهوة والتمر للضيف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما معايير نقد المشهد الداخلي؟\nالإجابة: دقة المنظور، العمق البصري، انسجام الألوان.\n\nس2 (مستوى التطبيق): كيف يدل العمل على تطبيق نقطة تلاشي واحدة؟\nالإجابة: بالتقاء خطوط العمق في نقطة داخل الجدار الخلفي.\n\nس3 (مستوى الاستدلال): انقد عمل زميل نقدًا بنّاءً.\nالإجابة: نقد معلل.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما القاعدة المطبقة في المشهد الداخلي؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (مستوى التطبيق): احكم على عملك وفق المعايير.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا لعملك.\nالإجابة: إجابة إبداعية.", "إرشاد للطالب: يحتفظ بعمله في ملف إنجازه.\nإرشاد لولي الأمر: يشارك ابنه فرحة الإنجاز.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 54–56.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=3"]}], "comb": ["الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\n1. يحدد بالخطوط الأفقية والعمودية قواعد المنظور في مشاهد داخلية مختلفة (15 دقيقة)\n2. يتحدث عن أعمال فنانين تناولوا المنظور لمشاهد داخلية (5 دقائق)\nمخرج آخر: يدرك العمق البصري في العمارة الإسلامية (العقود والأقواس) (20 دقيقة)\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\n1. يحلل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري (20 دقيقة)\n2. يستنتج قواعد المنظور المطبقة في اللوحة (10 دقائق)\nمخرج آخر: يتذوق جماليات العمق البصري في الأعمال الفنية (10 دقائق)\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\n1. يخطط مشهدًا داخليًا مراعيًا قواعد المنظور بنقطة تلاشي واحدة (5 دقائق)\n2. يحدد نقطة الرؤية وخط الأفق ونقطة التلاشي في المساحة المحددة (25 دقيقة)\nمخرج آخر: يهتم بتطبيق القواعد لتحقيق العمق البصري (10 دقائق)\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\n1. يرسم خطوط الرؤية الجانبية من نقطة التلاشي باتجاه المشاهد (10 دقائق)\n2. يحدد الجدران والسقف والأرضية في المشهد الداخلي (20 دقيقة)\nمخرج آخر: يلتزم بالدقة والنظافة (10 دقائق)\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\n1. يرسم النوافذ والباب على الجدران مستعينًا بخطوط الرؤية (25 دقيقة)\n2. يطبق تصغير العناصر بحسب البعد (5 دقائق)\nمخرج آخر: يهتم بإبراز العمق البصري (10 دقائق)\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\n1. يكمل تفاصيل المشهد الداخلي كالأرضية والطاولة والسبورة (25 دقيقة)\n2. يرسم الأثاث وفق قواعد المنظور (5 دقائق)\nمخرج آخر: يحقق الترابط بين عناصر المشهد (10 دقائق)\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\n1. يراجع الرسم المنظوري ويصحح أخطاءه (15 دقيقة)\n2. يحدد الخطوط النهائية ويجهز الرسم للتلوين (15 دقيقة)\nمخرج آخر: يتقبل النقد ويستفيد منه (10 دقائق)\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\n1. يلون المساحات الكبيرة في المشهد الداخلي بالألوان المائية (25 دقيقة)\n2. يراعي التدرج اللوني للتأكيد على العمق البصري (5 دقائق)\nمخرج آخر: يهتم بنظافة العمل (10 دقائق)\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\n1. يلون تفاصيل المشهد الداخلي (الأثاث، النوافذ، الباب) (25 دقيقة)\n2. يؤكد العمق البصري بالظلال والتباين (5 دقائق)\nمخرج آخر: يتقن مهارة التلوين بالألوان المائية (10 دقائق)\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\n1. يُخرج المشهد الداخلي بصورته النهائية (10 دقائق)\n2. يحلل عمله وأعمال زملائه من حيث تطبيق قواعد المنظور والعمق البصري (15 دقيقة)\nمخرج آخر: يدرك أهمية اختيار الألوان وتوظيفها (15 دقيقة)", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nالمخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nالمخرج 1: تحليل\nالمخرج
