:root{--bg:#f6f9fc;--card:#fff;--line:#d9e5f0;--pri:#2f5f8f;--soft:#eaf2fb;--ok:#3f7a5a;--okbg:#e6f4ea;--txt:#24324a;--mut:#6b7c93}
*{box-sizing:border-box}
body{margin:0;font-family:T,Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
header{background:var(--soft);border-bottom:1px solid #c9dcf0;padding:14px 16px}
h1{margin:0;font-size:1.15rem;color:var(--pri)}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.mode button{font:inherit;font-weight:700;border:1.5px solid #b7cde3;background:#fff;color:var(--pri);border-radius:22px;padding:7px 18px;cursor:pointer}
.mode button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.explain{font-size:.88rem;color:var(--mut);margin:4px 0}
.now{display:inline-block;margin-top:6px;background:var(--okbg);color:var(--ok);border:1px solid #bfe0c9;border-radius:10px;padding:4px 12px;font-weight:700;font-size:.92rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:260px;max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;cursor:pointer;color:var(--pri)}
.tabs button.on{background:var(--soft);border-color:#9fbedc;font-weight:700}
.meta{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem;color:var(--mut);margin-bottom:12px}
.meta b{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;background:#f2f7fc;border-bottom:1px solid var(--line);padding:8px 12px}
.ch h3{margin:0;font-size:1rem;color:var(--pri)}
.ch .no{display:inline-block;width:24px;height:24px;line-height:25px;text-align:center;border-radius:50%;background:#fff;border:1px solid #b7cde3;margin-left:6px;font-size:.85rem}
.cp{font:inherit;font-weight:700;background:#fff;border:1.5px solid #9fbedc;color:var(--pri);border-radius:10px;padding:4px 16px;cursor:pointer;min-width:105px}
.cp.done{background:var(--okbg);border-color:#9fd1b0;color:var(--ok)}
pre{margin:0;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:.95rem}
.fb{display:none;padding:8px 12px;border-top:1px dashed var(--line);background:#fffdf5}
.fb textarea{width:100%;min-height:140px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.fb small{color:var(--mut)}
</style>
</head>

ية المنظور في إبراز الجوانب الجمالية للمشاهد.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\n1. يتعرف عناصر المنظور الهندسي.\n2. يحدد خط الأفق ونقطة التلاشي في صور ولوحات.\nمخرج آخر: يهتم بالدقة في التحليل الخطي.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\n1. يطبق قواعد المنظور وفقًا لمستويات النظر المختلفة لرسم مجسم.\n2. يرسم ثلاثة مكعبات بمستويات نظر مختلفة في مساحة (10×10) سم.\nمخرج آخر: يلتزم بالدقة في القياس والرسم.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\n1. يرسم مجسمات من البيئة في مستويات نظر مختلفة.\n2. يطبق خطوات المنظور بدقة على أشكال مستطيلة.\nمخرج آخر: يتقبل النقد حول رسوماته.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\n1. يتعرف خطوات رسم مجسم بقاعدة نقطة تلاشي واحدة.\n2. يرسم صندوقًا بقاعدة نقطة التلاشي الواحدة.\nمخرج آخر: يهتم بتطبيق القاعدة بدقة.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\n1. يرسم مجسمًا (كرسيًا أو طاولة) بقاعدة نقطة التلاشي الواحدة.\n2. يوضح خطوات تطبيق القاعدة على مجسم مركب.\nمخرج آخر: يناقش زملاءه في مدى مراعاتهم للقاعدة.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\n1. يتعرف خطوات رسم مجسم بقاعدة نقطتي التلاشي.\n2. يرسم مكعبًا بالزاوية بقاعدة نقطتي التلاشي.\nمخرج آخر: يميز بين قاعدتي النقطة الواحدة والنقطتين.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\n1. يرسم مجسمًا بقاعدة نقطتي التلاشي.\n2. يتقن تحديد زاوية النظر المناسبة.\nمخرج آخر: يتقبل النقد حول رسمه.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\n1. يحلل بعض اللوحات الفنية في ضوء قواعد المنظور.\n2. يطبق قواعد المنظور عند التقاط صور فوتوغرافية لإبراز الجوانب الجمالية.\nمخرج آخر: يناقش زملاءه في مدى تطبيق القواعد.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\n1. يراجع قواعد المنظور (زاوية النظر، نقطة تلاشي، نقطتا تلاشي، مستويات النظر).\n2. يحكم على رسوماته ورسومات زملائه في ضوء القواعد.\nمخرج آخر: يتقبل النقد ويستفيد منه.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة n4. خطوط الرؤية\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\n1. مستوى النظر\n2. أعلى خط الأفق\n3. أسفل خط الأفق\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\n1. المجسم\n2. مستويات النظر\n3. التناسب\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\n1. نقطة التلاشي الواحدة\n2. المنظور الأمامي (المواجه)\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\n1. المجسم المركب\n2. خطوط الرؤية\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\n1. نقطتا التلاشي\n2. المنظور الزاوي\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\n1. زاوية النظر\n2. المنظور الزاوي\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\n1. التحليل الخطي\n2. زاوية التصوير\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\n1. قواعد المنظور الهندسي\n2. النقد الفني", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nالتعلم القبلي: رسم المجسمات وإظهار القرب والبعد بتغيير الأحجام في المراحل السابقة.\n\nالتهيئة:\n- المعلم: يعرض صورة لطريق مستقيم يمتد نحو الأفق ويسأل: لماذا يبدو الطريق ضيقًا كلما ابتعد مع أنه بالعرض نفسه؟\n- الطالب: يفسر الظاهرة بأن الأشياء تصغر كلما ابتعدت عن العين.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nالتعلم القبلي: مفهوم المنظور ونشأته.\n\nالتهيئة:\n- المعلم: يضع ورقًا شفافًا على صورة ممر ويسأل: إلى أين تتجه خطوط الجدران إذا مددناها؟\n- الطالب: يتوقع التقاءها في نقطة واحدة.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nالتعلم القبلي: عناصر المنظور.\n\nالتهيئة:\n- المعلم: يرفع كتابًا فوق مستوى عيون الطلبة ثم يخفضه ويسأل: متى رأيتم وجهه السفلي؟ ومتى العلوي؟\n- الطالب: يربط الوجه الظاهر بموقع الجسم من مستوى العين.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nالتعلم القبلي: رسم المكعبات في مستويات النظر.\n\nالتهيئة:\n- المعلم: يضع صندوقًا على الطاولة وآخر على الرف ويسأل: كيف ستختلف رسمة كل منهما؟\n- الطالب: يتوقع الأوجه الظاهرة لكل صندوق.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nالتعلم القبلي: عناصر المنظور ومستويات النظر.\n\nالتهيئة:\n- المعلم: يعرض صورة لسكة قطار ويسأل: كم نقطة تلاشي ترى؟\n- الطالب: يحدد نقطة واحدة تلتقي فيها القضبان.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nالتعلم القبلي: رسم صندوق بنقطة تلاشي واحدة.\n\nالتهيئة:\n- المعلم: يسأل: كيف نحول الصندوق المرسوم إلى طاولة؟\n- الطالب: يقترح إضافة أرجل وتنحيف السطح.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nالتعلم القبلي: قاعدة نقطة التلاشي الواحدة.\n\nالتهيئة:\n- المعلم: يعرض صورة لمبنى من زاويته ويسأل: هل تلتقي خطوط الجانبين في نقطة واحدة؟\n- الطالب: يلاحظ وجود نقطتين على جانبي الصورة.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nالتعلم القبلي: رسم مكعب بنقطتي تلاشي.\n\nالتهيئة:\n- المعلم: يدير طاولة نموذجية بزاوية ويسأل: كم وجهًا جانبيًا ترى الآن؟\n- الطالب: يذكر وجهين جانبيين.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nالتعلم القبلي: قاعدتا نقطة التلاشي ونقطتي التلاشي.\n\nالتهيئة:\n- المعلم: يعرض صورتين لمبنى المدرسة من زاويتين ويسأل: أيهما تُظهر عمقًا أكبر؟ ولماذا؟\n- الطالب: يقارن ويعلل باتجاه الخطوط.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nالتعلم القبلي: رسومات الدرس كاملة.\n\nالتهيئة:\n- المعلم: يطلق تحديًا سريعًا: أرسم على السبورة مجسمات وعلى المجموعات تحديد القاعدة.\n- الطالب: يتسابق مع مجموعته في التحديد.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لطريق مستقيم يمتد نحو الأفق ويسأل: لماذا يبدو الطريق ضيقًا كلما ابتعد مع أنه بالعرض نفسه؟\n- الطالب: يفسر الظاهرة بأن الأشياء تصغر كلما ابتعدت عن العين.\n\nمفهوم المنظور (10 دقائق):\n- المعلم: يوضح أن المنظور الهندسي رسم ما تراه العين من مسطحات ومجسمات كما تبدو في الواقع لتحقيق العمق الفراغي.\n- الطالب: يصوغ تعريفًا للمنظور بلغته.\n\nنشأة المنظور (12 دقيقة):\n- المعلم: يعرض أعمالًا من عصر النهضة ويتتبع مع الطلبة ظهور قواعد المنظور فيها.\n- الطالب: يتتبع تطور المنظور ويدون أبرز ملاحظاته.\n\nمقارنة (8 دقائق):\n- المعلم: يعرض قبة الجامع الأكبر وقبة كاتدرائية فلورنسا (الشكل 1) ويطلب المقارنة من حيث وضوح عناصر المنظور.\n- الطالب: يقارن بين الصورتين مع مجموعته.\n\nالختام (5 دقائق):\n- المعلم: يلخص بخريطة ذهنية لمفهوم المنظور.\n- الطالب: يذكر فائدة المنظور للفنان والمصمم.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nالتهيئة (5 دقائق):\n- المعلم: يضع ورقًا شفافًا على صورة ممر ويسأل: إلى أين تتجه خطوط الجدران إذا مددناها؟\n- الطالب: يتوقع التقاءها في نقطة واحدة.\n\nتعريف العناصر (10 دقائق):\n- المعلم: يعرّف خط الأفق (مستوى عين الرسام) ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية بالرسم على السبورة.\n- الطالب: يرسم العناصر في دفتره مع تعريفاتها.\n\nتحليل صور (12 دقيقة):\n- المعلم: يوزع صورًا لممرات وشوارع ويطلب تحديد العناصر بالورق الشفاف.\n- الطالب: يمد خطوط الرؤية ويحدد خط الأفق ونقطة التلاشي.\n\nمشاركة (8 دقائق):\n- المعلم: يعرض تحليلات المجموعات ويصحح الأخطاء.\n- الطالب: يعرض تحليله ويناقش.\n\nالختام (5 دقائق):\n- المعلم: يربط خط الأفق بمستوى النظر تمهيدًا للحصة القادمة.\n- الطالب: يذكر عنصرين ودوريهما.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nالتهيئة (5 دقائق):\n- المعلم: يرفع كتابًا فوق مستوى عيون الطلبة ثم يخفضه ويسأل: متى رأيتم وجهه السفلي؟ ومتى العلوي؟\n- الطالب: يربط الوجه الظاهر بموقع الجسم من مستوى العين.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج الخطوات: خط الأفق بقياس 10 سم، تحديد نقطتين في نهايتيه، خطوط مائلة بزاوية من كل نقطة فوق الخط وأسفله.\n- الطالب: يتابع الخطوات.\n\nرسم المكعبات (20 دقيقة):\n- المعلم: يتابع رسم ثلاثة مكعبات ناتجة من تقاطع الخطوط بمستويات نظر مختلفة.\n- الطالب: يرسم المكعبات الثلاثة.\n\nالمراجعة (2 دقيقة):\n- المعلم: يتحقق من وضوح الأوجه الظاهرة في كل مكعب.\n- الطالب: يراجع رسمه.\n\nالختام (5 دقائق):\n- المعلم: يطلب مقارنة الأوجه الظاهرة في المكعبات الثلاثة.\n- الطالب: يقارن ويستنتج.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nالتهيئة (5 دقائق):\n- المعلم: يضع صندوقًا على الطاولة وآخر على الرف ويسأل: كيف ستختلف رسمة كل منهما؟\n- الطالب: يتوقع الأوجه الظاهرة لكل صندوق.\n\nتوزيع النماذج (5 دقائق):\n- المعلم: يوزع نماذج مجسمة ويحدد مواضعها بالنسبة لمستوى العين.\n- الطالب: يلاحظ النماذج من مقعده.\n\nالرسم (22 دقيقة):\n- المعلم: يتابع ويوجه إلى تحويل المكعب إلى متوازي مستطيلات بحسب أبعاد المجسم.\n- الطالب: يرسم الكتاب أو الصندوق في ثلاثة مستويات.\n\nتبادل (3 دقائق):\n- المعلم: يطلب تبادل الرسوم.\n- الطالب: يقدم ملاحظة لزميله.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج متميزة.\n- الطالب: يتقبل الملاحظات ويعدل.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لسكة قطار ويسأل: كم نقطة تلاشي ترى؟\n- الطالب: يحدد نقطة واحدة تلتقي فيها القضبان.\n\nالخطوات (8 دقائق):\n- المعلم: يوضح: رسم خط الأفق وتحديد نقطة التلاشي، تحديد نقطة الوقوف، رسم خطوط مائلة باتجاه نقطة التلاشي، رسم المجسم من التقاطعات.\n- الطالب: يدون الخطوات.\n\nالتمرين (20 دقيقة):\n- المعلم: يتابع رسم صندوق بوجه أمامي مواجه وخطوط عمق نحو نقطة التلاشي.\n- الطالب: يرسم صندوقًا بنقطة تلاشي واحدة.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من التقاء الخطوط.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم الكرسي أو الطاولة.\n- الطالب: يحدد المجسم الذي سيرسمه.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نحول الصندوق المرسوم إلى طاولة؟\n- الطالب: يقترح إضافة أرجل وتنحيف السطح.\n\nالتبسيط (5 دقائق):\n- المعلم: يوضح تبسيط الكرسي إلى صناديق (المقعد، الظهر، الأرجل).\n- الطالب: يحلل المجسم إلى صناديق.\n\nالرسم (23 دقيقة):\n- المعلم: يتابع ويوجه إلى الشكل (2 أ، ب).\n- الطالب: يرسم الكرسي أو الطاولة بالقاعدة.\n\nالنقاش (2 دقيقة):\n- المعلم: يناقش أخطاء شائعة.\n- الطالب: يتعرف الأخطاء.\n\nالختام (5 دقائق):\n- المعلم: ينظم نقاشًا حول مراعاة القاعدة.\n- الطالب: يناقش زملاءه.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لمبنى من زاويته ويسأل: هل تلتقي خطوط الجانبين في نقطة واحدة؟\n- الطالب: يلاحظ وجود نقطتين على جانبي الصورة.\n\nالخطوات (8 دقائق):\n- المعلم: يوضح: خط الأفق ونقطتا التلاشي على طرفيه، نقطة الوقوف، خطوط مائلة باتجاه النقطتين، رسم المجسم من التقاطعات.\n- الطالب: يدون الخطوات.\n\nالتمرين (20 دقيقة):\n- المعلم: يتابع رسم مكعب حافته الأمامية عمودية.\n- الطالب: يرسم مكعبًا بنقطتي تلاشي.\n\nمقارنة (2 دقيقة):\n- المعلم: يطلب المقارنة بالقاعدة السابقة.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم المجسم بالقاعدة.\n- الطالب: يختار مجسمه.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nالتهيئة (5 دقائق):\n- المعلم: يدير طاولة نموذجية بزاوية ويسأل: كم وجهًا جانبيًا ترى الآن؟\n- الطالب: يذكر وجهين جانبيين.\n\nالتخطيط (5 دقائق):\n- المعلم: يوجه إلى اختيار زاوية النظر وموقع خط الأفق.\n- الطالب: يحدد زاويته وخط الأفق.\n\nالرسم (23 دقيقة):\n- المعلم: يتابع الرسم وفق الشكل (4).\n- الطالب: يرسم المجسم بنقطتي تلاشي.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من اتجاه الخطوط إلى النقطتين.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يعرض أعمالًا للنقد.\n- الطالب: يتقبل النقد ويعدل.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورتين لمبنى المدرسة من زاويتين ويسأل: أيهما تُظهر عمقًا أكبر؟ ولماذا؟\n- الطالب: يقارن ويعلل باتجاه الخطوط.\n\nتحليل اللوحات (15 دقيقة):\n- المعلم: يوزع لوحات ويطلب تحديد خط الأفق ونقاط التلاشي ونوع القاعدة.\n- الطالب: يحلل اللوحة مع مجموعته.\n\nالتصوير (12 دقيقة):\n- المعلم: ينظم جولة تصوير قصيرة داخل المدرسة لالتقاط مشاهد بقواعد المنظور.\n- الطالب: يلتقط صورًا بزاوية تبرز المنظور.\n\nالعرض (3 دقائق):\n- المعلم: يعرض بعض الصور.\n- الطالب: يشرح القاعدة في صورته.\n\nالختام (5 دقائق):\n- المعلم: يلخص علاقة المنظور بالتصوير.\n- الطالب: يذكر قاعدة طبقها في التصوير.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يطلق تحديًا سريعًا: أرسم على السبورة مجسمات وعلى المجموعات تحديد القاعدة.\n- الطالب: يتسابق مع مجموعته في التحديد.\n\nلعبة المراجعة (10 دقائق):\n- المعلم: يدير منافسة أسئلة سريعة عن القواعد عبر تطبيق تفاعلي أو بطاقات.\n- الطالب: يجيب مع مجموعته.\n\nملف الأعمال (12 دقيقة):\n- المعلم: يطلب ترتيب رسومات الدرس في ملف وتقييمها ذاتيًا.\n- الطالب: يقيم رسوماته وفق بطاقة معايير.\n\nأسئلة كتاب الطالب (8 دقائق):\n- المعلم: يطرح أسئلة كتاب الطالب المرتبطة بالدرس.\n- الطالب: يجيب عن الأسئلة.\n\nالختام (5 دقائق):\n- المعلم: يمهد لدرس اللون في المنظور.\n- الطالب: يذكر ما يحتاج إلى تحسينه.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nس1 (مستوى الدعم): ما المقصود بالمنظور الهندسي؟\nالإجابة: علم يقوم على رسم ما تراه العين من مسطحات أو مجسمات كما تبدو في الواقع لتحقيق العمق الفراغي.\n\nس2 (المستوى المتوقع): في أي عصر برزت قواعد المنظور في الفن؟\nالإجابة: عصر النهضة.\n\nس3 (المستوى المتقدم): لماذا يحتاج المعماري والمصمم الداخلي إلى المنظور؟\nالإجابة: لعرض التصاميم بصورة واقعية توضح الأبعاد والعمق قبل التنفيذ.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nس1 (مستوى الدعم): ما المقصود بخط الأفق؟\nالإجابة: الخط الذي يمثل مستوى عين الناظر.\n\nس2 (المستوى المتوقع): أين تلتقي خطوط الرؤية؟\nالإجابة: في نقطة التلاشي على خط الأفق.\n\nس3 (المستوى المتقدم): ماذا يحدث لنقطة التلاشي إذا جلس الرسام على الأرض؟\nالإجابة: ينخفض خط الأفق فتنخفض نقطة التلاشي معه.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nس1 (مستوى الدعم): أي وجه يظهر من مكعب يقع أسفل خط الأفق؟\nالإجابة: الوجه العلوي.\n\nس2 (المستوى المتوقع): ما قياس خط الأفق في التمرين؟\nالإجابة: 10 سم.\n\nس3 (المستوى المتقدم): لماذا لا يظهر الوجه العلوي ولا السفلي لمكعب في مستوى خط الأفق؟\nالإجابة: لأن مستوى العين يقطع المكعب فيرى الناظر الأوجه الجانبية فقط.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nس1 (مستوى الدعم): كيف تحول المكعب إلى شكل كتاب؟\nالإجابة: بتغيير أبعاده ليصبح متوازي مستطيلات رفيعًا.\n\nس2 (المستوى المتوقع): أين يقع مجسم على رف مرتفع بالنسبة لخط الأفق؟\nالإجابة: أعلى خط الأفق.\n\nس3 (المستوى المتقدم): ما الخطأ إذا ظهر الوجه العلوي لمجسم أعلى خط الأفق؟\nالإجابة: خطأ في توجيه خطوط الرؤية؛ إذ يجب أن يظهر الوجه السفلي.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nس1 (مستوى الدعم): ما أول خطوة في رسم مجسم بنقطة تلاشي واحدة؟\nالإجابة: رسم خط الأفق وتحديد نقطة التلاشي عليه.\n\nس2 (المستوى المتوقع): ما شكل الوجه الأمامي للصندوق في هذه القاعدة؟\nالإجابة: شكله الحقيقي (مربع أو مستطيل) دون تشويه.\n\nس3 (المستوى المتقدم): متى نختار نقطة تلاشي واحدة؟\nالإجابة: عندما يواجه أحد أوجه المجسم الناظر مباشرة.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nس1 (مستوى الدعم): كيف تبسط رسم الكرسي؟\nالإجابة: بتحليله إلى صناديق للمقعد والظهر والأرجل.\n\nس2 (المستوى المتوقع): إلى أين تتجه خطوط أرجل الطاولة الخلفية؟\nالإجابة: إلى نقطة التلاشي نفسها.\n\nس3 (المستوى المتقدم): لماذا تبدو الأرجل الخلفية أقصر؟\nالإجابة: لأنها أبعد عن الناظر فتصغر بحسب المنظور.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nس1 (مستوى الدعم): أين تقع نقطتا التلاشي؟\nالإجابة: على خط الأفق في طرفيه.\n\nس2 (المستوى المتوقع): ما الذي يواجه الناظر في قاعدة نقطتي التلاشي؟\nالإجابة: حافة (زاوية) المجسم لا وجهه.\n\nس3 (المستوى المتقدم): لماذا يُفضل وضع نقطتي التلاشي متباعدتين؟\nالإجابة: لتجنب تشوه المجسم ومبالغة العمق.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nس1 (مستوى الدعم): إلى أين تتجه خطوط الجانب الأيمن للطاولة؟\nالإجابة: إلى نقطة التلاشي اليمنى.\n\nس2 (المستوى المتوقع): هل تبقى الخطوط العمودية عمودية في هذه القاعدة؟\nالإجابة: نعم، تبقى عمودية.\n\nس3 (المستوى المتقدم): اقترح زاوية تُظهر تفاصيل الكرسي أكثر.\nالإجابة: زاوية مائلة يظهر فيها الظهر والمقعد معًا مع خط أفق أعلى قليلًا.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nس1 (مستوى الدعم): ماذا نحدد أولًا عند تحليل لوحة؟\nالإجابة: خط الأفق.\n\nس2 (المستوى المتوقع): كيف تستفيد من المنظور في التصوير؟\nالإجابة: باختيار زاوية تبرز خطوط الرؤية والعمق.\n\nس3 (المستوى المتقدم): حلل صورة التقطها زميلك وحدد نوع القاعدة.\nالإجابة: تحليل صحيح بدليل.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nس1 (مستوى الدعم): ما القاعدة المناسبة لرسم ممر طويل؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (المستوى المتوقع): ما القاعدة المناسبة لرسم مبنى من زاويته؟\nالإجابة: نقطتا تلاشي.\n\nس3 (المستوى المتقدم): صحح: «في قاعدة نقطتي التلاشي تميل الخطوط العمودية».\nالإجابة: الخطوط العمودية تبقى عمودية.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nس1 (مستوى الدعم): أكمل: يحقق المنظور الإحساس بالبعد ……….\nالإجابة: الثالث (العمق الفراغي).\n\nس2 (المستوى المتوقع): قارن بين قبة الجامع الأكبر وقبة كاتدرائية فلورنسا من حيث وضوح المنظور.\nالإجابة: إجابة تذكر اختلاف زاوية التصوير ووضوح خطوط التلاشي في كل صورة.\n\nس3 (المستوى المتقدم): اقترح موقفًا في الحياة اليومية تظهر فيه قواعد المنظور.\nالإجابة: مثال: صفوف أعمدة الإنارة على الطريق تصغر وتتقارب كلما ابتعدت.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nس1 (مستوى الدعم): اذكر عنصرين من عناصر المنظور.\nالإجابة: خط الأفق ونقطة التلاشي.\n\nس2 (المستوى المتوقع): حدد نقطة التلاشي في صورة ممر عُرضت عليك.\nالإجابة: تحديد صحيح بمد خطوط الجدران حتى التقائها.\n\nس3 (المستوى المتقدم): فسر لماذا يقع خط الأفق في أعلى صورة ملتقطة من مكان مرتفع.\nالإجابة: لأن عين المصور أعلى من المشهد فيرتفع مستوى النظر.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nس1 (مستوى الدعم): اذكر مستويات النظر الثلاثة.\nالإجابة: أعلى خط الأفق، في مستواه، أسفله.\n\nس2 (المستوى المتوقع): صف ما ظهر في المكعب الواقع أعلى خط الأفق.\nالإجابة: ظهر الوجه السفلي والأوجه الجانبية.\n\nس3 (المستوى المتقدم): قيّم دقة تقاطع الخطوط في رسمك.\nالإجابة: تقييم معلل يذكر تطابق الحواف مع خطوط الرؤية.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nس1 (مستوى الدعم): ما المجسم الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): وضح كيف طبقت مستوى النظر على مجسمك.\nالإجابة: إجابة تربط الأوجه الظاهرة بموقع المجسم.\n\nس3 (المستوى المتقدم): انقد رسم زميل من حيث تطبيق القاعدة.\nالإجابة: نقد معلل مع اقتراح.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nس1 (مستوى الدعم): رتب خطوات القاعدة.\nالإجابة: خط الأفق ونقطة التلاشي، نقطة الوقوف، خطوط الرؤية، المجسم.\n\nس2 (المستوى المتوقع): اشرح لماذا تتجه خطوط العمق إلى نقطة واحدة.\nالإجابة: لأنها خطوط متوازية تبتعد عن الناظر فتبدو ملتقية في نقطة على الأفق.\n\nس3 (المستوى المتقدم): صحح رسمًا خطوط عمقه لا تلتقي.\nالإجابة: مد الخطوط وتعديلها لتلتقي في نقطة التلاشي.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nس1 (مستوى الدعم): ما المجسم الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): اشرح خطوات رسمك.\nالإجابة: إجابة تتضمن خط الأفق ونقطة التلاشي وخطوط الرؤية والتفاصيل.\n\nس3 (المستوى المتقدم): ناقش مدى مراعاة زميلك للقاعدة.\nالإجابة: نقد معلل.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nس1 (مستوى الدعم): ما الفرق بين القاعدتين؟\nالإجابة: الواحدة يواجه فيها الوجه الناظر، والنقطتان تواجه فيهما الحافة.\n\nس2 (المستوى المتوقع): صف شكل الحافة الأمامية للمكعب.\nالإجابة: خط عمودي.\n\nس3 (المستوى المتقدم): حلل صورة مبنى وحدد نوع قاعدة المنظور فيها.\nالإجابة: تحليل صحيح بدليل الخطوط.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nس1 (مستوى الدعم): ما المجسم الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف كيف حددت زاوية النظر.\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (المستوى المتقدم): قيّم رسمك من حيث تطبيق القاعدة.\nالإجابة: تقييم معلل.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nس1 (مستوى الدعم): ما نوع القاعدة في صورة ممر مستقيم؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (المستوى المتوقع): صف الزاوية التي التقطت بها صورتك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): ناقش أي الصور أنجح في إبراز العمق.\nالإجابة: نقاش معلل.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nس1 (مستوى الدعم): اذكر ثلاثة مستويات للنظر.\nالإجابة: أعلى خط الأفق، في مستواه، أسفله.\n\nس2 (المستوى المتوقع): قيّم أفضل رسم لك في الدرس وعلل.\nالإجابة: تقييم معلل.\n\nس3 (المستوى المتقدم): صمم تمرينًا لزميلك يختبر قاعدة النقطتين.\nالإجابة: مثال: رسم صندوقين مختلفي الحجم بنقطتي تلاشي مشتركتين.", "الحصة 1: مفهوم المنظور الهندسي ونشأته في فنون عصر النهضة\nإرشاد للطالب: يلاحظ مظاهر المنظور في الطرق والممرات من حوله.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة الأبعاد في الصور الفوتوغرافية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 47–48.\n\nالحصة 2: عناصر المنظور: خط الأفق ونقطة التلاشي ونقطة الوقوف وخطوط الرؤية\nإرشاد للطالب: يحدد خط الأفق في صور يلتقطها بهاتفه.\nإرشاد لولي الأمر: يتحاور مع ابنه حول زوايا التصوير.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 48.\n\nالحصة 3: مستويات النظر: رسم المجسم أعلى خط الأفق وفي مستواه وأسفله\nإرشاد للطالب: يلاحظ الأجسام فوق مستوى نظره وتحته كالرفوف والطاولات.\nإرشاد لولي الأمر: يتابع مع ابنه الدقة في رسمه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49.\n\nالحصة 4: تطبيق مستويات النظر على مجسمات من البيئة (كتاب، صندوق)\nإرشاد للطالب: يرسم مجسمًا من غرفته بملاحظة مستوى نظره دون تكليف منزلي.\nإرشاد لولي الأمر: يشجع ابنه على الرسم من الطبيعة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49.\n\nالحصة 5: قاعدة نقطة التلاشي الواحدة: الخطوات والتمرين على صندوق\nإرشاد للطالب: يلاحظ صور الممرات والقطارات ذات نقطة التلاشي الواحدة.\nإرشاد لولي الأمر: يتابع مع ابنه تطبيق الخطوات بدقة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 49–50.\n\nالحصة 6: رسم مجسم (كرسي أو طاولة) بقاعدة نقطة التلاشي الواحدة\nإرشاد للطالب: يتأمل الأثاث في غرفته ويحلله إلى صناديق.\nإرشاد لولي الأمر: يشجع ابنه على الرسم من الواقع.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 50.\n\nالحصة 7: قاعدة نقطتي التلاشي: الخطوات والتمرين على مكعب بالزاوية\nإرشاد للطالب: يلاحظ المباني من زواياها في الطريق.\nإرشاد لولي الأمر: يناقش ابنه في الفرق بين القاعدتين.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 50.\n\nالحصة 8: رسم مجسم (كرسي أو طاولة) بقاعدة نقطتي التلاشي\nإرشاد للطالب: يتأمل الأثاث من زوايا مختلفة.\nإرشاد لولي الأمر: يتابع مع ابنه تقدمه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 50.\n\nالحصة 9: تحليل لوحات فنية وصور فوتوغرافية في ضوء قواعد المنظور\nإرشاد للطالب: يلتقط صورًا لمشاهد تبرز المنظور.\nإرشاد لولي الأمر: يشجع ابنه على التصوير الفني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 48–50.\n\nالحصة 10: مراجعة قواعد المنظور الهندسي وتقويم الدرس\nإرشاد للطالب: يراجع ملف رسوماته ويحدد نقاط قوته.\nإرشاد لولي الأمر: يطلع على ملف إنجا اين اللوني في تأكيد الإحساس بالعمق.\nمخرج آخر: يقدّر أهمية المفاهيم اللونية في العمل الفني.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم\n1. ينفذ تمرينًا للتباين في درجة اللون بالألوان المائية.\n2. يتحكم في تفتيح اللون وتغميقه.\nمخرج آخر: يهتم بنظافة التمرين.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا\n1. ينفذ تمرينًا للتباين في كنه اللون.\n2. ينفذ تمرينًا للتباين في الدرجة والكنه معًا.\nمخرج آخر: يقارن بين أنواع التباين من حيث قوة الإبراز.\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\n1. يستكشف تأثير التدرج اللوني في إظهار العمق.\n2. يحلل الألوان وتدرجاتها في لوحة لتوضيح مفهوم العمق اللوني.\nمخرج آخر: يدرك أهمية التدرج في المنظور.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\n1. ينفذ تمرينًا لإظهار التدرج اللوني بالألوان المائية.\n2. يؤكد على العمق اللوني من خلال التدرج.\nمخرج آخر: يتحلى بالصبر والدقة.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\n1. يذكر دور الألوان الباردة والحارة في تأكيد المنظور اللوني.\n2. ينفذ تمرينًا يقارن فيه بين تقدم الألوان الحارة وتراجع الباردة.\nمخرج آخر: يقدر العلاقات اللونية في الأعمال الفنية.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\n1. يجرب خلفيات لونية متنوعة وباتجاهات مختلفة.\n2. يختار خلفية مناسبة لإخراج عمل منظوري.\nمخرج آخر: يدرك أهمية الإخراج الفني.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\n1. ينفذ تمرينات لرسم شخوص بأوضاع وهيئات مختلفة.\n2. يراعي نسب الجسم البشري.\nمخرج آخر: يهتم بالملاحظة الدقيقة.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\n1. يضيف شخوصًا بأبعاد ونسب مختلفة لإظهار المنظور الهندسي.\n2. يطبق قاعدة تصغير الأحجام بحسب البعد.\nمخرج آخر: يهتم بإخراج العمل.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\n1. يُخرج عملًا يوظف التباين والتدرج اللوني لتأكيد العمق.\n2. يحكم على عمله وأعمال زملائه من حيث تحقق التباين والتدرج.\nمخرج آخر: يدرك أهمية الإخراج الفني.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nالمخرج 1: تذكر\nالمخرج  يعرض دائرتين متساويتين برتقالية وزرقاء ويسأل: أيهما تبدو أقرب؟\n- الطالب: يلاحظ تقدم البرتقالية.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nالتعلم القبلي: التدرج والمنظور اللوني.\n\nالتهيئة:\n- المعلم: يعرض الرسم نفسه على ثلاث خلفيات ويسأل: أي خلفية خدمت الرسم؟\n- الطالب: يختار ويعلل.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nالتعلم القبلي: رسم المجسمات بقواعد المنظور.\n\nالتهيئة:\n- المعلم: يطلب من طالب أن يقف ثم يجلس ثم يمشي ويسأل: ما الذي يتغير في هيئته؟\n- الطالب: يلاحظ تغير الخطوط والزوايا.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nالتعلم القبلي: رسم الشخوص ورسم المجسمات بالمنظور.\n\nالتهيئة:\n- المعلم: يرسم ممرًا وشخصين بالحجم نفسه في القرب والبعد ويسأل: ما الخطأ؟\n- الطالب: يستنتج أن البعيد يجب أن يصغر.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nالتعلم القبلي: تمارين الدرس.\n\nالتهيئة:\n- المعلم: يسأل: أي مفاهيم الدرس ستستخدم في إخراج عملك؟\n- الطالب: يذكر التباين والتدرج والخلفية.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nالتهيئة (5 دقائق):\n- المعلم: يعرض مربعًا رماديًا على خلفيتين فاتحة وداكنة ويسأل: هل المربعان بالدرجة نفسها؟\n- الطالب: يتفاجأ بأنهما متطابقان ويستنتج أثر التباين.\n\nالمفاهيم (10 دقائق):\n- المعلم: يوضح الكنه (اسم اللون: أحمر، أزرق) والدرجة (فتوحه وقتامته).\n- الطالب: يميز الكنه من الدرجة في أمثلة.\n\nأنواع التباين (12 دقيقة):\n- المعلم: يعرض أمثلة كتاب الطالب لثلاثة أنواع: تباين في الدرجة، في الكنه، في الدرجة والكنه معًا.\n- الطالب: يصنف الأمثلة.\n\nالعمق (8 دقائق):\n- المعلم: يناقش كيف يبرز التباين القريب ويبعد غير المتباين.\n- الطالب: يستنتج العلاقة بين التباين والعمق.\n\nالختام (5 دقائق):\n- المعلم: يبني خريطة ذهنية للتباين.\n- الطالب: يكمل الخريطة.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم\nالتهيئة (5 دقائق):\n- المعلم: يمزج اللون بكمية ماء قليلة ثم كثيرة أمام الطلبة ويسأل: ماذا تغير؟\n- الطالب: يلاحظ تغير الدرجة.\n\nرسم المربعات (5 دقائق):\n- المعلم: يوجه إلى رسم مربعات بقياس (10×10) سم.\n- الطالب: يرسم المربعات.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج تنفيذ شكل بدرجة داكنة على أرضية فاتحة من اللون نفسه.\n- الطالب: يتابع.\n\nالتنفيذ (17 دقيقة):\n- المعلم: يتابع التنفيذ.\n- الطالب: ينفذ تمرين التباين في الدرجة.\n\nالختام (5 دقائق):\n- المعلم: يعرض التمارين ويقارن قوة التباين.\n- الطالب: يقيم تمرينه.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا\nالتهيئة (5 دقائق):\n- المعلم: يعرض شكلًا أحمر على أرضية خضراء بالدرجة نفسها ويسأل: ما نوع التباين هنا؟\n- الطالب: يحدد التباين في الكنه.\n\nتمرين الكنه (14 دقيقة):\n- المعلم: يتابع تنفيذ مربع بتباين في الكنه مع ثبات الدرجة تقريبًا.\n- الطالب: ينفذ التمرين.\n\nتمرين الكنه والدرجة (14 دقيقة):\n- المعلم: يتابع تنفيذ مربع بتباين في الكنه والدرجة معًا.\n- الطالب: ينفذ التمرين.\n\nالمقارنة (2 دقيقة):\n- المعلم: يطلب ترتيب المربعات الثلاثة بحسب قوة الإبراز.\n- الطالب: يرتب ويعلل.\n\nالختام (5 دقائق):\n- المعلم: يستنتج أن الجمع بينهما أقوى إبرازًا.\n- الطالب: يدون الاستنتاج.\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لسلسلة جبال تتدرج من الداكن للفاتح ويسأل: أي جبل أبعد؟ كيف عرفت؟\n- الطالب: يستدل بفتوح اللون وضعف وضوحه.\n\nالمفهوم (10 دقائق):\n- المعلم: يوضح التدرج اللوني ودوره في إيهام العمق.\n- الطالب: يصوغ التعريف.\n\nالتحليل (15 دقيقة):\n- المعلم: يعرض اللوحة (الشكل 6) ويطلب تحليل ألوانها من المقدمة إلى الخلفية.\n- الطالب: يحلل التدرج ويحدد مستويات العمق.\n\nالعرض (5 دقائق):\n- المعلم: يستمع لتحليلات المجموعات.\n- الطالب: يعرض التحليل.\n\nالختام (5 دقائق):\n- المعلم: يمهد لتمرين التدرج.\n- الطالب: يحدد اللون الذي سيتدرج به.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\nالتهيئة (5 دقائق):\n- المعلم: ينفذ أمامهم شريط تدرج سريعًا ويسأل: كيف اختفت الحدود بين الدرجات؟\n- الطالب: يتوقع إضافة الماء تدريجيًا.\n\nالنمذجة (7 دقائق):\n- المعلم: ينمذج التدرج بسحب اللون مع زيادة الماء تدريجيًا.\n- الطالب: يتابع.\n\nالتنفيذ (21 دقيقة):\n- المعلم: يتابع التنفيذ في المساحة المحددة.\n- الطالب: ينفذ التدرج مؤكدًا العمق.\n\nالملاحظة (2 دقيقة):\n- المعلم: يطلب الابتعاد عن العمل وملاحظته.\n- الطالب: يتأمل.\n\nالختام (5 دقائق):\n- المعلم: يعرض التمارين الناجحة.\n- الطالب: يقيم تمرينه.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\nالتهيئة (5 دقائق):\n- المعلم: يعرض دائرتين متساويتين برتقالية وزرقاء ويسأل: أيهما تبدو أقرب؟\n- الطالب: يلاحظ تقدم البرتقالية.\n\nالمفهوم (10 دقائق):\n- المعلم: يوضح أن الألوان الحارة تبدو متقدمة والباردة متراجعة.\n- الطالب: يصنف الألوان.\n\nالتمرين (18 دقيقة):\n- المعلم: يطلب تنفيذ مشهد مبسط بثلاث مستويات: مقدمة حارة، وسط متوسط، خلفية باردة.\n- الطالب: ينفذ التمرين.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من الإحساس بالعمق.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يلخص قاعدة الحار والبارد.\n- الطالب: يذكر القاعدة.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nالتهيئة (5 دقائق):\n- المعلم: يعرض الرسم نفسه على ثلاث خلفيات ويسأل: أي خلفية خدمت الرسم؟\n- الطالب: يختار ويعلل.\n\nالعرض (8 دقائق):\n- المعلم: يعرض الشكل (7) لخلفيات أفقية وعمودية ودائرية ومائلة.\n- الطالب: يلاحظ الأنواع.\n\nالتجريب (20 دقيقة):\n- المعلم: يتابع تجريب ثلاث خلفيات صغيرة بأساليب مختلفة.\n- الطالب: ينفذ الخلفيات.\n\nالاختيار (2 دقيقة):\n- المعلم: يطلب اختيار الأنسب.\n- الطالب: يختار ويعلل.\n\nالختام (5 دقائق):\n- المعلم: يربط الخلفية بالمشهد المنظوري.\n- الطالب: يذكر الخلفية المختارة.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nالتهيئة (5 دقائق):\n- المعلم: يطلب من طالب أن يقف ثم يجلس ثم يمشي ويسأل: ما الذي يتغير في هيئته؟\n- الطالب: يلاحظ تغير الخطوط والزوايا.\n\nالنسب (7 دقائق):\n- المعلم: يوضح تقسيم الجسم بقياس الرأس وتبسيطه إلى خطوط ومساحات.\n- الطالب: يتابع.\n\nالرسم (21 دقيقة):\n- المعلم: يتابع رسم شخوص بأوضاع (وقوف، جلوس، مشي) وفق الشكل (8).\n- الطالب: يرسم ثلاثة أوضاع.\n\nالمراجعة (2 دقيقة):\n- المعلم: يتحقق من النسب.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد لإضافة الشخوص للمشهد.\n- الطالب: يختار وضعًا مناسبًا.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nالتهيئة (5 دقائق):\n- المعلم: يرسم ممرًا وشخصين بالحجم نفسه في القرب والبعد ويسأل: ما الخطأ؟\n- الطالب: يستنتج أن البعيد يجب أن يصغر.\n\nالقاعدة (8 دقائق):\n- المعلم: يوضح أن رؤوس الأشخاص الواقفين تقع على خط الأفق تقريبًا إذا كان الرسام واقفًا.\n- الطالب: يتابع.\n\nالتطبيق (20 دقيقة):\n- المعلم: يتابع إضافة ثلاثة شخوص بأحجام متدرجة لمشهد ممر.\n- الطالب: يضيف الشخوص.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من التدرج.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يعرض أعمالًا.\n- الطالب: يعرض.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nالتهيئة (5 دقائق):\n- المعلم: يسأل: أي مفاهيم الدرس ستستخدم في إخراج عملك؟\n- الطالب: يذكر التباين والتدرج والخلفية.\n\nالإخراج (20 دقيقة):\n- المعلم: يتابع تلوين المشهد بالشخوص والخلفية.\n- الطالب: يُخرج العمل.\n\nالحكم (8 دقائق):\n- المعلم: ينظم تقييمًا بمعايير التباين والتدرج.\n- الطالب: يحكم على الأعمال.\n\nأسئلة الكتاب (2 دقيقة):\n- المعلم: يطرح سؤالًا من كتاب الطالب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لدرس المشهد الداخلي.\n- الطالب: يذكر استفادته.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nس1 (مستوى الدعم): ما المقصود بكنه اللون؟\nالإجابة: اسم اللون أو نوعه كالأحمر والأزرق.\n\nس2 (المستوى المتوقع): اذكر أنواع التباين اللوني الثلاثة.\nالإجابة: في الدرجة، في الكنه، في الدرجة والكنه معًا.\n\nس3 (المستوى المتقدم): لماذا تبدو العناصر عالية التباين أقرب؟\nالإجابة: لأنها تجذب العين بقوة فتبدو بارزة في المقدمة.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم\nس1 (مستوى الدعم): كيف تفتح اللون في الألوان المائية؟\nالإجابة: بزيادة الماء.\n\nس2 (المستوى المتوقع): هل يتغير الكنه في هذا التمرين؟\nالإجابة: لا، تتغير الدرجة فقط.\n\nس3 (المستوى المتقدم): كيف تزيد قوة التباين في الدرجة؟\nالإجابة: بزيادة الفرق بين أفتح درجة وأغمقها.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا\nس1 (مستوى الدعم): أعطِ مثالًا على تباين في الكنه.\nالإجابة: أحمر بجوار أخضر بدرجة متقاربة.\n\nس2 (المستوى المتوقع): أي أنواع التباين أقوى إبرازًا؟\nالإجابة: التباين في الدرجة والكنه معًا.\n\nس3 (المستوى المتقدم): متى يفضل الفنان التباين في الكنه وحده؟\nالإجابة: عندما يريد تنوعًا لونيًا دون إبراز مفرط.\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\nس1 (مستوى الدعم): ما المقصود بالتدرج اللوني؟\nالإجابة: انتقال اللون تدريجيًا من درجة إلى أخرى.\n\nس2 (المستوى المتوقع): كيف تبدو الألوان البعيدة عادة؟\nالإجابة: أفتح وأقل تشبعًا وأميل إلى الزرقة.\n\nس3 (المستوى المتقدم): كيف يحقق التدرج العمق اللوني في المنظور؟\nالإجابة: بتفتيح الألوان وتقليل تشبعها كلما ابتعدت.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\nس1 (مستوى الدعم): كيف تحصل على تدرج ناعم؟\nالإجابة: بإضافة الماء تدريجيًا مع العمل والورق رطب.\n\nس2 (المستوى المتوقع): لماذا نستخدم فرشاة عريضة؟\nالإجابة: لتغطية المساحة بسرعة قبل الجفاف.\n\nس3 (المستوى المتقدم): حلل تمرينك: هل يوحي بالعمق؟\nالإجابة: تحليل معلل.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\nس1 (مستوى الدعم): اذكر لونين حارين.\nالإجابة: الأحمر والبرتقالي.\n\nس2 (المستوى المتوقع): لماذا تُلون الخلفيات بألوان باردة؟\nالإجابة: لأنها توحي بالبعد والتراجع.\n\nس3 (المستوى المتقدم): ماذا يحدث لو لُونت الخلفية بالأحمر؟\nالإجابة: تبدو متقدمة فيضعف الإحساس بالعمق.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nس1 (مستوى الدعم): ما وظيفة الخلفية في الإخراج؟\nالإجابة: إبراز العمل وتوجيه العين.\n\nس2 (المستوى المتوقع): بماذا توحي الخلفية الأفقية؟\nالإجابة: بالهدوء والامتداد.\n\nس3 (المستوى المتقدم): حلل أي خلفية تناسب مشهدًا معماريًا ذا عمق.\nالإجابة: تدرج من الداكن للفاتح باتجاه نقطة التلاشي.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nس1 (مستوى الدعم): ما وحدة قياس نسب الجسم؟\nالإجابة: الرأس.\n\nس2 (المستوى المتوقع): كيف تبسط رسم الشخص؟\nالإجابة: بخطوط للهيكل وأشكال بيضاوية للأجزاء.\n\nس3 (المستوى المتقدم): لماذا تضيف الشخوص حيوية للمشهد المنظوري؟\nالإجابة: لأنها توضح المقياس والحجم وتمنح المشهد حياة.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nس1 (مستوى الدعم): أين تقع رؤوس الأشخاص الواقفين بالنسبة لخط الأفق؟\nالإجابة: عليه تقريبًا عندما يكون الرسام واقفًا.\n\nس2 (المستوى المتوقع): لماذا يصغر الشخص البعيد؟\nالإجابة: بسبب البعد عن الناظر وفق المنظور.\n\nس3 (المستوى المتقدم): صحح مشهدًا يبدو فيه الشخص البعيد عملاقًا.\nالإجابة: تصغيره وفق خطوط الرؤية نحو نقطة التلاشي.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nس1 (مستوى الدعم): كيف وظفت التباين في عملك؟\nالإجابة: إجابة شخصية صحيحة.\n\nس2 (المستوى المتوقع): أين ظهر التدرج في عملك؟\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (المستوى المتقدم): اقترح تحسينًا لعمل زميل.\nالإجابة: إجابة معللة.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nس1 (مستوى الدعم): عرّف درجة اللون.\nالإجابة: مدى فتوح اللون أو قتامته.\n\nس2 (المستوى المتوقع): صنف: أزرق فاتح بجوار أزرق داكن.\nالإجابة: تباين في الدرجة.\n\nس3 (المستوى المتقدم): اقترح تباينًا مناسبًا لإبراز باب في مقدمة مشهد.\nالإجابة: تباين في الدرجة والكنه معًا بين الباب والجدار.\n\nالحصة 2: تمرين التباين في درجة اللون في مربعات (10×10) سم\nس1 (مستوى الدعم): ما نوع التباين في تمرينك؟\nالإجابة: تباين في الدرجة.\n\nس2 (المستوى المتوقع): صف طريقة حصولك على الدرجة الداكنة.\nالإجابة: تقليل الماء وزيادة الصبغة أو طبقات متتالية.\n\nس3 (المستوى المتقدم): قيّم وضوح الشكل على الأرضية في تمرينك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تمرين التباين في الكنه والتباين في الدرجة والكنه معًا\nس1 (مستوى الدعم): ما نوع التباين في: أصفر فاتح وبنفسجي داكن؟\nالإجابة: تباين في الدرجة والكنه معًا.\n\nس2 (المستوى المتوقع): رتب تمارينك الثلاثة بحسب قوة التباين.\nالإجابة: إجابة معللة.\n\nس3 (المستوى المتقدم): حلل أثر التباين على الإحساس بالعمق في تمارينك.\nالإجابة: تحليل يربط قوة التباين بالقرب.\n\nالحصة 4: مفهوم التدرج اللوني والعمق اللوني وتحليل لوحة\nس1 (مستوى الدعم): عرّف العمق اللوني.\nالإجابة: الإحساس بالبعد الناتج من تدرج الألوان وتغير تشبعها.\n\nس2 (المستوى المتوقع): حدد المقدمة والخلفية في اللوحة المحللة بالألوان.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): اقترح تدرجًا لونيًا لممر طويل.\nالإجابة: ألوان دافئة داكنة قريبًا تتدرج إلى فاتحة باردة بعيدًا.\n\nالحصة 5: تمرين التدرج اللوني بالألوان المائية مؤكدًا العمق اللوني\nس1 (مستوى الدعم): ما الخامة المستخدمة؟\nالإجابة: الألوان المائية.\n\nس2 (المستوى المتوقع): صف خطوات تنفيذ تمرينك.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): اقترح استخدامًا للتدرج في مشهد معماري.\nالإجابة: تدرج لون الأرضية في ممر لإظهار امتداده.\n\nالحصة 6: الألوان الحارة والباردة ودورها في المنظور اللوني\nس1 (مستوى الدعم): أكمل: الألوان ……… تبدو متقدمة.\nالإجابة: الحارة.\n\nس2 (المستوى المتوقع): صف توزيع الألوان في تمرينك.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم نجاح تمرينك في إظهار العمق.\nالإجابة: تقييم معلل.\n\nالحصة 7: تجريب خلفيات لونية متنوعة باتجاهات مختلفة للإخراج الفني\nس1 (مستوى الدعم): اذكر اتجاهين للخلفيات.\nالإجابة: أفقي وعمودي (أو دائري ومائل).\n\nس2 (المستوى المتوقع): ما الخلفية التي اخترتها؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس3 (المستوى المتقدم): اقترح خلفية لمعرض أعمال الصف.\nالإجابة: إجابة معللة.\n\nالحصة 8: رسم شخوص بأوضاع وهيئات مختلفة بالقلم الرصاص\nس1 (مستوى الدعم): اذكر ثلاثة أوضاع رسمتها.\nالإجابة: وقوف وجلوس ومشي.\n\nس2 (المستوى المتوقع): صف كيف راعيت النسب.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم أحد رسومك من حيث التعبير عن الحركة.\nالإجابة: تقييم معلل.\n\nالحصة 9: إضافة شخوص بأحجام ونسب مختلفة لمشهد منظوري\nس1 (مستوى الدعم): كم شخصًا أضفت؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف كيف حددت أحجامهم.\nالإجابة: باستخدام خطوط الرؤية من نقطة التلاشي.\n\nس3 (المستوى المتقدم): قيّم إسهام الشخوص في إظهار العمق.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج العمل المنظوري وتقويم الدرس في التباين والتدرج\nس1 (مستوى الدعم): ما المفهومان اللونيان المؤكدان للعمق؟\nالإجابة: التباين اللوني والتدرج اللوني.\n\nس2 (المستوى المتوقع): احكم على عملك وفق المعيارين.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): صمم معيارًا ثالثًا لتقويم الإخراج.\nالإجابة: مثال: انسجام الخلفية مع المشهد.", "الحصة 1: مفهوم التباين اللوني وأنواعه (في الدرجة، في الكنه، فيهما معًا)\nإرشاد للطالب: يلاحظ التباين في اللافتات والإعلانات.\nإرشاد لولي الأمر: يتحاور مع ابنه حول وضوح الألوان المتباينة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 51–52.\n\nالحصة 2: تمرين \n1. المشهد الداخلي\n2. العمق البصري\n3. العقود والأقواس\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\n1. التحليل الخطي\n2. العمق البصري\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\n1. نقطة الرؤية\n2. الجدار الخلفي\n3. الإطار\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\n1. خطوط الرؤية الجانبية\n2. الجدران والسقف والأرضية\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\n1. تصغير الأحجام\n2. العناصر الجدارية\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\n1. بلاط الأرضية\n2. الأثاث في المنظور\n3. الترابط\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\n1. الخطوط النهائية\n2. خطوط الإنشاء\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\n1. التدرج اللوني\n2. العمق البصري\n3. الطبقة الأولى\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\n1. الظل الساقط\n2. التباين\n3. العمق البصري\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\n1. الإخراج النهائي\n2. النقد الفني", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nالتعلم القبلي: قواعد المنظور الهندسي والمفاهيم اللونية للعمق.\n\nالتهيئة:\n- المعلم: يعرض صورة لرواق جامع بأقواس متتالية ويسأل: لماذا تبدو الأقواس أصغر كلما تقدمنا؟\n- الطالب: يربط التصغير بالبعد ونقطة التلاشي.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nالتعلم القبلي: تحليل المشاهد الداخلية.\n\nالتهيئة:\n- المعلم: يعرض لوحة الخياط (الشكل 9) ويسأل: من أين تدخل عينك اللوحة؟ وإلى أين تقودك؟\n- الطالب: يصف مسار العين نحو العمق.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nالتعلم القبلي: تحليل المشاهد الداخلية.\n\nالتهيئة:\n- المعلم: يطلب من الطلبة النظر إلى الجدار الأمامي للصف ويسأل: ما شكله من مكانك؟ وماذا عن الجدارين الجانبيين؟\n- الطالب: يلاحظ أن الأمامي مستطيل والجانبيين يميلان.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nالتعلم القبلي: تخطيط المشهد وتحديد نقطة التلاشي.\n\nالتهيئة:\n- المعلم: يسأل: من أين تبدأ خطوط زوايا الغرفة وإلى أين تتجه؟\n- الطالب: يجيب: من نقطة التلاشي عبر أركان الجدار الخلفي نحو إطار الورقة.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nالتعلم القبلي: الجدران والسقف والأرضية المرسومة.\n\nالتهيئة:\n- المعلم: يرسم نافذة على جدار جانبي بشكل مستطيل منتظم ويسأل: هل هذا صحيح؟\n- الطالب: يستنتج أن حوافها الأفقية يجب أن تتجه لنقطة التلاشي.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nالتعلم القبلي: العناصر الجدارية المرسومة.\n\nالتهيئة:\n- المعلم: يسأل: كيف نرسم بلاط الأرضية بحيث يصغر كلما ابتعد؟\n- الطالب: يقترح خطوطًا من نقطة التلاشي وخطوطًا أفقية متقاربة.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nالتعلم القبلي: الرسم المنظوري المكتمل.\n\nالتهيئة:\n- المعلم: يعرض رسمًا مزدحمًا بخطوط الإنشاء ويسأل: ما الذي يجب إزالته قبل التلوين؟\n- الطالب: يحدد خطوط الإنشاء الزائدة.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nالتعلم القبلي: الرسم المنظوري المجهز.\n\nالتهيئة:\n- المعلم: يسأل: أي الجدران أكثر إضاءة في الصف الآن؟ ولماذا؟\n- الطالب: يحدد الجدار المواجه للنافذة.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nالتعلم القبلي: المساحات الكبيرة الملونة.\n\nالتهيئة:\n- المعلم: يسأل: أين يسقط ظل الطاولة إذا كانت النافذة يمينًا؟\n- الطالب: يحدد الجهة المعاكسة للضوء.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nالتعلم القبلي: المشهد الملون.\n\nالتهيئة:\n- المعلم: يسأل: ما الذي يجعل المشاهد يشعر بأنه يستطيع الدخول إلى اللوحة؟\n- الطالب: يذكر العمق ودقة المنظور.", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لرواق جامع بأقواس متتالية ويسأل: لماذا تبدو الأقواس أصغر كلما تقدمنا؟\n- الطالب: يربط التصغير بالبعد ونقطة التلاشي.\n\nالعمق في العمارة الإسلامية (10 دقائق):\n- المعلم: يعرض صور عقود وأقواس ويوضح دورها في إبراز العمق.\n- الطالب: يحدد اتجاه التلاشي في الصور.\n\nالتحليل الخطي (15 دقيقة):\n- المعلم: يوزع صورًا لمشاهد داخلية ويطلب تحديد خط الأفق ونقطة التلاشي والخطوط الأفقية والعمودية.\n- الطالب: يحلل المشهد بالورق الشفاف.\n\nالعرض (5 دقائق):\n- المعلم: يعرض نماذج التحليل.\n- الطالب: يشرح تحليله.\n\nالختام (5 دقائق):\n- المعلم: يستنتج أن المشاهد الداخلية المواجهة تعتمد غالبًا نقطة تلاشي واحدة.\n- الطالب: يدون الاستنتاج.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nالتهيئة (5 دقائق):\n- المعلم: يعرض لوحة الخياط (الشكل 9) ويسأل: من أين تدخل عينك اللوحة؟ وإلى أين تقودك؟\n- الطالب: يصف مسار العين نحو العمق.\n\nالتحليل الفردي (20 دقيقة):\n- المعلم: يتابع التحليل بالورق الشفاف: خط الأفق، نقطة التلاشي، خطوط الرؤية.\n- الطالب: يحلل اللوحة خطيًا.\n\nالتدرج اللوني (8 دقائق):\n- المعلم: يوجه إلى ملاحظة تدرج ألوان اللوحة من المقدمة للخلفية.\n- الطالب: يدون ملاحظاته اللونية.\n\nالمقارنة (2 دقيقة):\n- المعلم: يقارن التحليلات.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يربط التحليل بالمشهد الذي سيرسمه.\n- الطالب: يقترح مشهدًا داخليًا لرسمه.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nالتهيئة (5 دقائق):\n- المعلم: يطلب من الطلبة النظر إلى الجدار الأمامي للصف ويسأل: ما شكله من مكانك؟ وماذا عن الجدارين الجانبيين؟\n- الطالب: يلاحظ أن الأمامي مستطيل والجانبيين يميلان.\n\nالنمذجة (10 دقائق):\n- المعلم: ينمذج: تحديد نقطة الرؤية وخط الأفق، رسم الجدار الخلفي مستطيلًا، تحديد نقطة التلاشي داخله.\n- الطالب: يتابع.\n\nالتخطيط (18 دقيقة):\n- المعلم: يتابع اختيار المشهد (غرفة صف، غرفة جلوس، رواق) وتخطيطه.\n- الطالب: يحدد عناصر المنظور لمشهده.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من موقع نقطة التلاشي.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم خطوط الرؤية الجانبية.\n- الطالب: يحفظ تخطيطه.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nالتهيئة (5 دقائق):\n- المعلم: يسأل: من أين تبدأ خطوط زوايا الغرفة وإلى أين تتجه؟\n- الطالب: يجيب: من نقطة التلاشي عبر أركان الجدار الخلفي نحو إطار الورقة.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح مد الخطوط من نقطة التلاشي عبر أركان الجدار الخلفي.\n- الطالب: يتابع.\n\nالرسم (23 دقيقة):\n- المعلم: يتابع رسم خطوط الرؤية وتحديد الأسطح.\n- الطالب: يرسم خطوط الرؤية ويحدد الجدران والسقف والأرضية.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من الاستقامة والالتقاء.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم النوافذ والباب.\n- الطالب: يحدد مواضع النوافذ والباب.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nالتهيئة (5 دقائق):\n- المعلم: يرسم نافذة على جدار جانبي بشكل مستطيل منتظم ويسأل: هل هذا صحيح؟\n- الطالب: يستنتج أن حوافها الأفقية يجب أن تتجه لنقطة التلاشي.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج رسم باب ونافذة على جدار جانبي بحواف تتجه لنقطة التلاشي.\n- الطالب: يتابع.\n\nالرسم (20 دقيقة):\n- المعلم: يتابع رسم النوافذ والباب.\n- الطالب: يرسم العناصر الجدارية.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من اتجاه الحواف.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد لإكمال التفاصيل.\n- الطالب: يحدد التفاصيل الباقية.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نرسم بلاط الأرضية بحيث يصغر كلما ابتعد؟\n- الطالب: يقترح خطوطًا من نقطة التلاشي وخطوطًا أفقية متقاربة.\n\nالبلاط (8 دقائق):\n- المعلم: ينمذج تقسيم الأرضية إلى بلاط باستخدام خطوط الرؤية والخطوط الأفقية المتقاربة.\n- الطالب: يتابع.\n\nالتفاصيل (20 دقيقة):\n- المعلم: يتابع إضافة الطاولة والسبورة والأثاث.\n- الطالب: يكمل التفاصيل.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من الترابط.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يطلب تقييمًا سريعًا قبل التحبير.\n- الطالب: يحدد ما يحتاج تعديلًا.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nالتهيئة (5 دقائق):\n- المعلم: يعرض رسمًا مزدحمًا بخطوط الإنشاء ويسأل: ما الذي يجب إزالته قبل التلوين؟\n- الطالب: يحدد خطوط الإنشاء الزائدة.\n\nمراجعة الأقران (10 دقائق):\n- المعلم: يوزع بطاقة فحص (خط الأفق، الالتقاء، الأحجام، التفاصيل).\n- الطالب: يفحص رسم زميله بالبطاقة.\n\nالتصحيح والتأكيد (18 دقيقة):\n- المعلم: يتابع تصحيح الأخطاء وتخفيف خطوط الإنشاء وتأكيد الخطوط النهائية.\n- الطالب: يصحح ويجهز رسمه.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من جاهزية الرسم.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتلوين بالألوان المائية.\n- الطالب: يحدد خطة ألوانه.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nالتهيئة (5 دقائق):\n- المعلم: يسأل: أي الجدران أكثر إضاءة في الصف الآن؟ ولماذا؟\n- الطالب: يحدد الجدار المواجه للنافذة.\n\nالخطة (5 دقائق):\n- المعلم: يوضح البدء بالطبقة الفاتحة وتحديد مصدر الضوء.\n- الطالب: يحدد مصدر الضوء.\n\nالتلوين (23 دقيقة):\n- المعلم: يتابع تلوين الجدران والسقف والأرضية بتدرج.\n- الطالب: يلون المساحات الكبيرة.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من التدرج.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يوجه لتنظيف الأدوات وترك العمل يجف.\n- الطالب: ينظف أدواته.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nالتهيئة (5 دقائق):\n- المعلم: يسأل: أين يسقط ظل الطاولة إذا كانت النافذة يمينًا؟\n- الطالب: يحدد الجهة المعاكسة للضوء.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج تلوين قطعة أثاث وظلها الساقط.\n- الطالب: يتابع.\n\nالتلوين (20 دقيقة):\n- المعلم: يتابع تلوين التفاصيل وإضافة الظلال.\n- الطالب: يلون التفاصيل ويضيف الظلال.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من اتساق الظلال.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد للإخراج والعرض.\n- الطالب: يحدد اللمسات الأخيرة.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الذي يجعل المشاهد يشعر بأنه يستطيع الدخول إلى اللوحة؟\n- الطالب: يذكر العمق ودقة المنظور.\n\nاللمسات الأخيرة (12 دقيقة):\n- المعلم: يتابع اللمسات الأخيرة وتحديد الإطار.\n- الطالب: يكمل عمله.\n\nالمعرض والنقد (14 دقيقة):\n- المعلم: ينظم معرضًا مصغرًا ونقدًا وفق: المنظور، العمق، الألوان.\n- الطالب: يعرض وينقد.\n\nأسئلة الكتاب (4 دقائق):\n- المعلم: يطرح أسئلة الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يلخص الدرس.\n- الطالب: يلخص استفادته.", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nس1 (مستوى الدعم): ما القاعدة الأشيع في المشاهد الداخلية المواجهة؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (المستوى المتوقع): كيف تسهم الأقواس المتتالية في العمق البصري؟\nالإجابة: تصغر تدريجيًا نحو نقطة التلاشي فتوحي بالامتداد.\n\nس3 (المستوى المتقدم): حلل صورة غرفة وحدد موقع الناظر منها.\nالإجابة: تحليل يحدد ارتفاع خط الأفق وموضع نقطة التلاشي.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nس1 (مستوى الدعم): ماذا تحدد أولًا في التحليل الخطي للوحة؟\nالإجابة: خط الأفق.\n\nس2 (المستوى المتوقع): ما الذي يقود العين إلى عمق اللوحة؟\nالإجابة: خطوط الرؤية المتجهة إلى نقطة التلاشي.\n\nس3 (المستوى المتقدم): كيف دعم اللون العمق في لوحة الخياط؟\nالإجابة: بتدرج الألوان من الداكن في المقدمة إلى الأفتح في العمق أو العكس بحسب الضوء.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nس1 (مستوى الدعم): ما شكل الجدار الخلفي في منظور نقطة واحدة؟\nالإجابة: مستطيل بأبعاده الحقيقية.\n\nس2 (المستوى المتوقع): أين تقع نقطة التلاشي في المشهد الداخلي؟\nالإجابة: داخل الجدار الخلفي على خط الأفق.\n\nس3 (المستوى المتقدم): ماذا يحدث إذا وضعت نقطة التلاشي قرب طرف الجدار؟\nالإجابة: يظهر جدار جانبي واسع والآخر ضيق.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nس1 (مستوى الدعم): كم خط رؤية يحدد زوايا الغرفة؟\nالإجابة: أربعة خطوط من الأركان الأربعة.\n\nس2 (المستوى المتوقع): كيف تميز السقف عن الأرضية؟\nالإجابة: السقف فوق خط الأفق والأرضية تحته.\n\nس3 (المستوى المتقدم): لماذا يجب أن تمر الخطوط بنقطة التلاشي بدقة؟\nالإجابة: لأن أي انحراف يشوه العمق والأسطح.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nس1 (مستوى الدعم): إلى أين تتجه الحواف الأفقية لنافذة على جدار جانبي؟\nالإجابة: إلى نقطة التلاشي.\n\nس2 (المستوى المتوقع): هل تبقى الحواف العمودية للباب عمودية؟\nالإجابة: نعم.\n\nس3 (المستوى المتقدم): كيف ترسم نافذتين متساويتين على جدار جانبي؟\nالإجابة: تصغر الأبعد بحسب خطوط الرؤية رغم تساويهما في الواقع.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nس1 (مستوى الدعم): لماذا تتقارب خطوط البلاط الأفقية كلما ابتعدت؟\nالإجابة: لأن المسافات تصغر بفعل البعد.\n\nس2 (المستوى المتوقع): كيف ترسم طاولة في منتصف الغرفة؟\nالإجابة: كصندوق تتجه خطوط عمقه إلى نقطة التلاشي نفسها.\n\nس3 (المستوى المتقدم): حلل ترابط عناصر مشهدك.\nالإجابة: تحليل معلل.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nس1 (مستوى الدعم): ما خطوط الإنشاء؟\nالإجابة: الخطوط المساعدة التي تُرسم لتحديد المنظور ثم تُخفف.\n\nس2 (المستوى المتوقع): لماذا نخفف خطوط الإنشاء قبل التلوين المائي؟\nالإجابة: لأن الألوان المائية شفافة فتظهر الخطوط الداكنة.\n\nس3 (المستوى المتقدم): صمم معيارًا إضافيًا لبطاقة الفحص.\nالإجابة: مثال: تناسب أحجام الأثاث مع الغرفة.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nس1 (مستوى الدعم): لماذا نبدأ بالمساحات الكبيرة؟\nالإجابة: لتأسيس الجو اللوني العام للمشهد.\n\nس2 (المستوى المتوقع): كيف يتغير لون الأرضية كلما ابتعدت؟\nالإجابة: يصبح أفتح أو أقل تشبعًا.\n\nس3 (المستوى المتقدم): حلل أثر مصدر الضوء على ألوان الجدران.\nالإجابة: الجدار المقابل للضوء أفتح والجانبي الآخر أغمق.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nس1 (مستوى الدعم): في أي جهة يقع الظل الساقط؟\nالإجابة: في الجهة المعاكسة لمصدر الضوء.\n\nس2 (المستوى المتوقع): كيف يؤكد التباين العمق؟\nالإجابة: بإبراز العناصر القريبة بتباين أقوى.\n\nس3 (المستوى المتقدم): اقترح لونًا لظل على أرضية بيج.\nالإجابة: بني أو بنفسجي مخفف أغمق من البيج.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nس1 (مستوى الدعم): ما معايير نقد المشهد الداخلي؟\nالإجابة: دقة المنظور، العمق البصري، انسجام الألوان.\n\nس2 (المستوى المتوقع): كيف يدل العمل على تطبيق نقطة تلاشي واحدة؟\nالإجابة: بالتقاء خطوط العمق في نقطة داخل الجدار الخلفي.\n\nس3 (المستوى المتقدم): انقد عمل زميل نقدًا بنّاءً.\nالإجابة: نقد معلل.", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nس1 (مستوى الدعم): ماذا تمثل الخطوط العمودية في المشهد الداخلي؟\nالإجابة: حواف الجدران والأبواب والنوافذ.\n\nس2 (المستوى المتوقع): اذكر عنصرين من العمارة الإسلامية يبرزان العمق.\nالإجابة: العقود والأقواس.\n\nس3 (المستوى المتقدم): قارن بين مشهدين داخليين من حيث وضوح العمق.\nالإجابة: مقارنة معللة.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nس1 (مستوى الدعم): من صاحب اللوحة المحللة؟\nالإجابة: الفنان محمد هشام الخياط.\n\nس2 (المستوى المتوقع): صف نقطة التلاشي في اللوحة.\nالإجابة: إجابة صحيحة بحسب التحليل.\n\nس3 (المستوى المتقدم): أبدِ رأيك في نجاح الفنان في إبراز العمق.\nالإجابة: رأي معلل.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nس1 (مستوى الدعم): ما المشهد الذي اخترته؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف موقع خط الأفق في مشهدك.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم اختيارك لموقع نقطة التلاشي.\nالإجابة: تقييم معلل.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nس1 (مستوى الدعم): ما الأسطح التي حددتها؟\nالإجابة: الجدار الخلفي والجداران الجانبيان والسقف والأرضية.\n\nس2 (المستوى المتوقع): صف ما ظهر أكثر في مشهدك: السقف أم الأرضية؟ ولماذا؟\nالإجابة: إجابة معللة بموقع خط الأفق.\n\nس3 (المستوى المتقدم): قيّم دقة خطوط الرؤية لديك.\nالإجابة: تقييم معلل.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nس1 (مستوى الدعم): ماذا رسمت على الجدران؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): اشرح كيف استعنت بخطوط الرؤية.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): صحح عنصرًا لا يتبع القاعدة في رسم زميل.\nالإجابة: تصحيح معلل.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nس1 (مستوى الدعم): اذكر عنصرين أضفتهما.\nالإجابة: الطاولة والسبورة (أو غيرهما).\n\nس2 (المستوى المتوقع): صف طريقة رسم البلاط.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم مشهدك قبل التلوين.\nالإجابة: تقييم معلل.\n\nالحصة 7: مراجعة الرسم المنظوري وتحبيره وتجهيزه للتلوين\nس1 (مستوى الدعم): اذكر معيارين لفحص الرسم.\nالإجابة: التقاء الخطوط بنقطة التلاشي، وتناسب الأحجام.\n\nس2 (المستوى المتوقع): ما الخطأ الذي صححته؟\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم ملاحظة زميلك على رسمك.\nالإجابة: تقييم معلل.\n\nالحصة 8: تلوين المساحات الكبيرة (الجدران والسقف والأرضية) بالتدرج اللوني\nس1 (مستوى الدعم): ما المساحات التي لونتها؟\nالإجابة: الجدران والسقف والأرضية.\n\nس2 (المستوى المتوقع): صف التدرج في أرضيتك.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم نظافة عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: تلوين التفاصيل وتأكيد العمق البصري بالضوء والظل\nس1 (مستوى الدعم): ماذا أضفت في هذه الحصة؟\nالإجابة: التفاصيل والظلال.\n\nس2 (المستوى المتوقع): صف اتساق الظلال مع مصدر الضوء.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم وضوح العمق البصري.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج المشهد الداخلي وعرضه ونقده\nس1 (مستوى الدعم): ما القاعدة المطبقة في المشهد الداخلي؟\nالإجابة: نقطة تلاشي واحدة.\n\nس2 (المستوى المتوقع): احكم على عملك وفق المعايير.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): اقترح عنوانًا لعملك.\nالإجابة: إجابة إبداعية.", "الحصة 1: تحليل مشاهد داخلية من العمارة واللوحات بالخطوط الأفقية والعمودية\nإرشاد للطالب: يلاحظ الممرات والقاعات من حوله ويحدد نقطة التلاشي.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جماليات العمارة الإسلامية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 54–55.\n\nالحصة 2: تحليل لوحة الفنان محمد هشام الخياط خطيًا لتوضيح العمق البصري\nإرشاد للطالب: يتأمل أعمال فنانين عمانيين وعرب.\nإرشاد لولي الأمر: يشجع ابنه على زيارة المعارض الفنية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 3: اختيار المشهد الداخلي وتحديد نقطة الرؤية وخط الأفق ونقطة التلاشي\nإرشاد للطالب: يلاحظ غرفة في منزله من زوايا مختلفة.\nإرشاد لولي الأمر: يتابع مع ابنه تخطيط مشهده.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 4: رسم خطوط الرؤية الجانبية وتحديد الجدران والسقف والأرضية\nإرشاد للطالب: يلاحظ أركان الغرف وخطوطها.\nإرشاد لولي الأمر: يتابع دقة ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 5: رسم النوافذ والباب بالاستعانة بخطوط الرؤية\nإرشاد للطالب: يلاحظ النوافذ في الممرات الطويلة.\nإرشاد لولي الأمر: يتابع تقدم ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 55.\n\nالحصة 6: إكمال تفاصيل المشهد الداخلي (الأرضية، الطاولة، السبورة، الأثاث)\nإرشاد للطالب: يلاحظ الأثاث وأبعاده في الغرف.\nإرشاد لولي الأمر: يشجع ابنه على الإتقان.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 56.\n\nالحصة 7: مراجعة الرسم المنظوري و ق قاعدة نقطتي التلاشي في رسم مشهد خارجي.\nمخرج آخر: يتذوق جماليات المشاهد الخارجية.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\n1. يحلل لوحة الفنان حسين عبيد لتوضيح العمق اللوني.\n2. يذكر دور الألوان الباردة والحارة في تأكيد المنظور اللوني.\nمخرج آخر: يقدر أعمال الفنانين العمانيين.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\n1. يستنتج قاعدة المنظور بنقطتي تلاشي من خلال تخطيط صور من العمارة الإسلامية.\n2. يستكشف تأثير القواعد في وضوح العمق في العقود والأقواس.\nمخرج آخر: يوضح القيم الجمالية لعناصر العمارة الإسلامية.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\n1. يختار مشهدًا خارجيًا (حديقة عامة، بنايات، بيوت عربية قديمة).\n2. يحدد خط الأفق ونقطتي التلاشي وزاوية النظر في مساحة العمل.\nمخرج آخر: يخطط بعناية قبل التنفيذ.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\n1. يرسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر.\n2. يرسم الكتل الرئيسة للمباني في المشهد.\nمخرج آخر: يلتزم بالدقة.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\n1. يكمل تفاصيل المشهد الخارجي من خلال خطوط الرؤية الوهمية.\n2. يضيف عناصر الطبيعة بأحجام متناسبة مع البعد.\nمخرج آخر: يحقق الترابط بين عناصر المشهد.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\n1. يجرب الألوان الحارة والباردة على ورقة جانبية.\n2. يضع خطة لونية تؤكد العمق اللوني في المشهد.\nمخرج آخر: يتخذ قرارات لونية مدروسة.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\n1. يلون الخلفية والمستويات البعيدة بالألوان الباردة والفاتحة.\n2. يطبق التدرج اللوني لتأكيد العمق.\nمخرج آخر: يهتم بنظافة العمل.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\n1. يلون المقدمة والعناصر القريبة بالألوان الحارة والمشبعة.\n2. يؤكد العمق اللوني بالتباين والظلال.\nمخرج آخر: يتقن التلوين بالألوان المائية.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\n1. يُخرج المشهد الخارجي بصورته النهائية.\n2. يحكم على عمله وأعمال زملائه من حيث تطبيق نقطتي التلاشي والع المعلم: يرسم صندوقًا كبيرًا بنقطتي تلاشي ويسأل: كيف يصبح هذا الصندوق بيتًا عربيًا؟\n- الطالب: يقترح إضافات.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nالتعلم القبلي: الكتل الرئيسة المرسومة.\n\nالتهيئة:\n- المعلم: يسأل: كيف نرسم صفًا من النخيل على الرصيف يبتعد؟\n- الطالب: يقترح تصغيرها وفق خطوط الرؤية.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nالتعلم القبلي: المنظور اللوني والمشهد المرسوم.\n\nالتهيئة:\n- المعلم: يسأل: إن رسمت البيوت البعيدة بالبرتقالي القوي، فماذا يحدث؟\n- الطالب: يتوقع أنها ستبدو قريبة.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nالتعلم القبلي: الخطة اللونية.\n\nالتهيئة:\n- المعلم: يسأل: لماذا نبدأ بالسماء والخلفية؟\n- الطالب: يجيب لأنها الأفتح والأبعد.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nالتعلم القبلي: الخلفية الملونة.\n\nالتهيئة:\n- المعلم: يسأل: كيف تجعل الباب القريب يبدو بارزًا؟\n- الطالب: يقترح لونًا حارًا متباينًا وظلًا.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nالتعلم القبلي: المشهد الملون.\n\nالتهيئة:\n- المعلم: يسأل: ما أهم ثلاثة أشياء تعلمتها في وحدة المنظور؟\n- الطالب: يذكر القواعد والعمق اللوني والإخراج.", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لركن شارع ويسأل: كم اتجاهًا تتلاشى إليه الخطوط؟\n- الطالب: يحدد اتجاهين.\n\nالعرض (10 دقائق):\n- المعلم: يعرض مشاهد خارجية (حدائق، بنايات، بيوت عربية قديمة) ويوضح زاوية النظر.\n- الطالب: يلاحظ.\n\nالتحليل (17 دقيقة):\n- المعلم: يوزع صورًا ويطلب تحديد خط الأفق ونقطتي التلاشي.\n- الطالب: يحلل الصور.\n\nالعرض (3 دقائق):\n- المعلم: يعرض التحليلات.\n- الطالب: يشرح.\n\nالختام (5 دقائق):\n- المعلم: يقارن بين المشهد الداخلي والخارجي.\n- الطالب: يذكر الفرق.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nالتهيئة (5 دقائق):\n- المعلم: يعرض لوحة حسين عبيد (الشكل 11) ويسأل: ما أبعد شيء في اللوحة؟ وكيف عرفت؟\n- الطالب: يستدل باللون والحجم.\n\nالتحليل (18 دقيقة):\n- المعلم: يتابع التحليل الخطي واللوني للوحة.\n- الطالب: يحلل خط الأفق والتلاشي والتدرج.\n\nالحار والبارد (10 دقائق):\n- المعلم: يطلب تحديد مواضع الألوان الحارة والباردة في اللوحة.\n- الطالب: يحدد المواضع ويربطها بالعمق.\n\nالمقارنة (2 دقيقة):\n- المعلم: يقارن التحليلات.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يلخص أثر اللون في العمق.\n- الطالب: يدون الخلاصة.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة قلعة نزوى أو جامع من الزاوية ويسأل: كيف نرسمها بدقة؟\n- الطالب: يقترح تخطيطها بخطوط الرؤية.\n\nالتخطيط (22 دقيقة):\n- المعلم: يتابع تخطيط صورة من العمارة الإسلامية بخطوط الرؤية ونقطتي التلاشي.\n- الطالب: يخطط الصورة.\n\nالقيم الجمالية (6 دقائق):\n- المعلم: يناقش جمال الأقواس والعقود في المنظور.\n- الطالب: يذكر قيمة جمالية.\n\nالعرض (2 دقيقة):\n- المعلم: يعرض نماذج.\n- الطالب: يعرض.\n\nالختام (5 دقائق):\n- المعلم: يمهد لاختيار المشهد الخارجي.\n- الطالب: يقترح مشهده.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nالتهيئة (5 دقائق):\n- المعلم: يسأل: إذا كان مبناك مرتفعًا جدًا، فأين تضع خط الأفق لتُظهر شموخه؟\n- الطالب: يقترح خط أفق منخفضًا.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج: خط الأفق ونقطتا التلاشي والحافة الأمامية للمبنى.\n- الطالب: يتابع.\n\nالتخطيط (20 دقيقة):\n- المعلم: يتابع تحديد العناصر لمشهد كل طالب.\n- الطالب: يخطط مشهده الخارجي.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من التباعد بين نقطتي التلاشي.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم خطوط الرؤية والكتل.\n- الطالب: يحفظ تخطيطه.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nالتهيئة (5 دقائق):\n- المعلم: يرسم صندوقًا كبيرًا بنقطتي تلاشي ويسأل: كيف يصبح هذا الصندوق بيتًا عربيًا؟\n- الطالب: يقترح إضافات.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح بناء الكتل كصناديق قبل التفاصيل.\n- الطالب: يتابع.\n\nالرسم (23 دقيقة):\n- المعلم: يتابع رسم الكتل وخطوط الرؤية.\n- الطالب: يرسم الكتل الرئيسة.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من الاتجاهات.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتفاصيل.\n- الطالب: يحدد التفاصيل.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نرسم صفًا من النخيل على الرصيف يبتعد؟\n- الطالب: يقترح تصغيرها وفق خطوط الرؤية.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج تقسيم الواجهة لنوافذ متساوية بخطوط وهمية.\n- الطالب: يتابع.\n\nالتفاصيل (23 دقيقة):\n- المعلم: يتابع إضافة النوافذ والأبواب والأشجار والأرصفة.\n- الطالب: يكمل التفاصيل.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من التناسب.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يطلب تخفيف خطوط الإنشاء.\n- الطالب: يجهز الرسم للتلوين.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nالتهيئة (5 دقائق):\n- المعلم: يسأل: إن رسمت البيوت البعيدة بالبرتقالي القوي، فماذا يحدث؟\n- الطالب: يتوقع أنها ستبدو قريبة.\n\nالتجريب (18 دقيقة):\n- المعلم: يتابع تجريب مزيج الألوان الحارة والباردة ودرجاتها.\n- الطالب: يجرب المزائج.\n\nالخطة (10 دقائق):\n- المعلم: يطلب رسم مصغر للمشهد وتلوينه سريعًا كخطة.\n- الطالب: يضع الخطة اللونية.\n\nالتحقق (2 دقيقة):\n- المعلم: يراجع الخطط.\n- الطالب: يعرض خطته.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتلوين.\n- الطالب: يثبت خطته.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: لماذا نبدأ بالسماء والخلفية؟\n- الطالب: يجيب لأنها الأفتح والأبعد.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج تلوين السماء رطبًا على رطب.\n- الطالب: يتابع.\n\nالتلوين (23 دقيقة):\n- المعلم: يتابع تلوين الخلفية والمستويات البعيدة.\n- الطالب: يلون الخلفية.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من التدرج.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتنظيف وترك العمل يجف.\n- الطالب: ينظف.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف تجعل الباب القريب يبدو بارزًا؟\n- الطالب: يقترح لونًا حارًا متباينًا وظلًا.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح زيادة التشبع والتفاصيل في المقدمة.\n- الطالب: يتابع.\n\nالتلوين (23 دقيقة):\n- المعلم: يتابع تلوين المقدمة والظلال.\n- الطالب: يلون المقدمة ويؤكد العمق.\n\nالتحقق (2 دقيقة):\n- المعلم: يتحقق من التدرج من الحار للبارد.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد للإخراج.\n- الطالب: يحدد اللمسات الأخيرة.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما أهم ثلاثة أشياء تعلمتها في وحدة المنظور؟\n- الطالب: يذكر القواعد والعمق اللوني والإخراج.\n\nاللمسات الأخيرة (10 دقائق):\n- المعلم: يتابع الإخراج.\n- الطالب: يكمل عمله.\n\nالمعرض والنقد (10 دقائق):\n- المعلم: ينظم معرضًا ونقدًا بالمعايير.\n- الطالب: يعرض وينقد.\n\nتقويم الوحدة (10 دقائق):\n- المعلم: يدير مراجعة تفاعلية لأسئلة الوحدة.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: ينتقل للوحدة الأولى (الفن الإسلامي) وفق النشرة.\n- الطالب: يلخص الوحدة.", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nس1 (مستوى الدعم): متى نستخدم نقطتي التلاشي في المشهد الخارجي؟\nالإجابة: عندما نرى المباني من زاويتها.\n\nس2 (المستوى المتوقع): أين تقع نقطتا التلاشي غالبًا؟\nالإجابة: على خط الأفق وقد تقعان خارج حدود الورقة.\n\nس3 (المستوى المتقدم): لماذا قد نضع نقطتي التلاشي خارج الورقة؟\nالإجابة: لتجنب التشوه وإظهار المبنى بنسب طبيعية.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nس1 (مستوى الدعم): من الفنان صاحب اللوحة المحللة؟\nالإجابة: حسين عبيد.\n\nس2 (المستوى المتوقع): أين وُظفت الألوان الباردة في اللوحة؟\nالإجابة: في المستويات البعيدة والخلفية غالبًا.\n\nس3 (المستوى المتقدم): فسر كيف يتكامل المنظور الخطي واللوني في اللوحة.\nالإجابة: الخطوط تحدد الاتجاه نحو العمق والألوان تؤكد البعد بتدرجها.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nس1 (مستوى الدعم): ماذا يحدث لأقواس رواق يُرى من زاوية؟\nالإجابة: تصغر وتتجه حوافها إلى نقطة تلاشي.\n\nس2 (المستوى المتوقع): كيف يساعد التخطيط على فهم المنظور؟\nالإجابة: بكشف خطوط الرؤية ونقاط التلاشي الخفية.\n\nس3 (المستوى المتقدم): اقترح عنصرًا إسلاميًا يبرز العمق في مشهدك.\nالإجابة: أقواس متتالية أو صف أعمدة.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nس1 (مستوى الدعم): ما أول خطوة في رسم المشهد الخارجي؟\nالإجابة: تحديد خط الأفق ونقطتي التلاشي.\n\nس2 (المستوى المتوقع): بماذا يوحي خط الأفق المنخفض؟\nالإجابة: بضخامة المباني وشموخها.\n\nس3 (المستوى المتقدم): لماذا تُرسم الحافة الأمامية أولًا؟\nالإجابة: لأنها أقرب نقطة وتُبنى منها خطوط الرؤية.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nس1 (مستوى الدعم): كيف تبدأ رسم مبنى معقد؟\nالإجابة: بكتلة صندوقية بسيطة.\n\nس2 (المستوى المتوقع): إلى أين تتجه خطوط الواجهة اليسرى؟\nالإجابة: إلى نقطة التلاشي اليسرى.\n\nس3 (المستوى المتقدم): كيف ترسم مبنيين متجاورين بارتفاعين مختلفين؟\nالإجابة: باستخدام نقطتي التلاشي نفسيهما مع تغيير الارتفاع.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nس1 (مستوى الدعم): ما المقصود بخطوط الرؤية الوهمية؟\nالإجابة: خطوط مساعدة تمتد إلى نقاط التلاشي لضبط التفاصيل ثم تُخفف.\n\nس2 (المستوى المتوقع): كيف تصغر الأشجار في البعد؟\nالإجابة: باتباع خطين يتجهان إلى نقطة التلاشي يحددان ارتفاعها.\n\nس3 (المستوى المتقدم): حلل ترابط عناصر مشهدك.\nالإجابة: تحليل معلل.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nس1 (مستوى الدعم): لماذا نجرب الألوان قبل التلوين؟\nالإجابة: لتجنب الأخطاء التي يصعب إصلاحها بالألوان المائية.\n\nس2 (المستوى المتوقع): اقترح لونًا للسماء البعيدة.\nالإجابة: أزرق فاتح مخفف.\n\nس3 (المستوى المتقدم): كيف توازن بين الحار والبارد في مشهدك؟\nالإجابة: بالحار في المقدمة والبارد في البعيد مع لمسات مكررة للربط.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nس1 (مستوى الدعم): ما أسلوب تلوين السماء المقترح؟\nالإجابة: لون رطب على سطح رطب.\n\nس2 (المستوى المتوقع): لماذا تكون الخلفية أقل تفصيلًا؟\nالإجابة: لأن العين لا ترى تفاصيل البعيد بوضوح.\n\nس3 (المستوى المتقدم): حلل أثر خلفيتك على العمق.\nالإجابة: تحليل معلل.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nس1 (مستوى الدعم): لماذا تكون ألوان المقدمة مشبعة؟\nالإجابة: لتبدو قريبة وواضحة.\n\nس2 (المستوى المتوقع): كيف تضيف ظل مبنى بالألوان المائية؟\nالإجابة: بطبقة شفافة أغمق في الجهة المعاكسة للضوء.\n\nس3 (المستوى المتقدم): قيّم انتقال الألوان من المقدمة للخلفية في عملك.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nس1 (مستوى الدعم): ما القاعدة المطبقة في المشهد الخارجي؟\nالإجابة: نقطتا التلاشي.\n\nس2 (المستوى المتوقع): ما دور الألوان الباردة في المشهد؟\nالإجابة: تأكيد البعد في الخلفية.\n\nس3 (المستوى المتقدم): انقد عمل زميل نقدًا بنّاءً.\nالإجابة: نقد معلل.", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nس1 (مستوى الدعم): ما القاعدة المناسبة لرسم ركن مبنى؟\nالإجابة: نقطتا تلاشي.\n\nس2 (المستوى المتوقع): حدد نقطتي التلاشي في صورة معروضة.\nالإجابة: تحديد صحيح.\n\nس3 (المستوى المتقدم): قارن بين مشهد داخلي ومشهد خارجي من حيث القاعدة.\nالإجابة: الداخلي غالبًا نقطة واحدة والخارجي من الزاوية نقطتان.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nس1 (مستوى الدعم): ما العمق اللوني؟\nالإجابة: الإحساس بالبعد الناتج من تدرج الألوان وتغير حرارتها.\n\nس2 (المستوى المتوقع): حدد لونًا حارًا في مقدمة اللوحة.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): أبدِ رأيك في توظيف الفنان للألوان.\nالإجابة: رأي معلل.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nس1 (مستوى الدعم): ما الصورة التي خططتها؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): حدد نقطتي التلاشي في تخطيطك.\nالإجابة: تحديد صحيح.\n\nس3 (المستوى المتقدم): وضح قيمة جمالية لعنصر إسلامي في تخطيطك.\nالإجابة: إجابة معللة.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nس1 (مستوى الدعم): ما مشهدك الخارجي؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف زاوية النظر التي اخترتها.\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (المستوى المتقدم): قيّم اختيارك لموقع خط الأفق.\nالإجابة: تقييم معلل.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nس1 (مستوى الدعم): كم كتلة رسمت؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف اتجاه خطوط الواجهتين.\nالإجابة: كل واجهة تتجه إلى نقطة التلاشي في جهتها.\n\nس3 (المستوى المتقدم): قيّم دقة رسمك.\nالإجابة: تقييم معلل.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nس1 (مستوى الدعم): اذكر ثلاثة تفاصيل أضفتها.\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف طريقة تقسيم الواجهة إلى نوافذ.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم مشهدك قبل التلوين.\nالإجابة: تقييم معلل.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nس1 (مستوى الدعم): ما ألوان مقدمة مشهدك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف خطتك اللونية.\nالإجابة: إجابة شخصية واضحة.\n\nس3 (المستوى المتقدم): قيّم خطتك من حيث تأكيد العمق.\nالإجابة: تقييم معلل.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nس1 (مستوى الدعم): ما الألوان التي استخدمتها للخلفية؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف التدرج في سمائك.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): قيّم نظافة عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nس1 (مستوى الدعم): ما الألوان الحارة في مقدمتك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف كيف أكدت العمق اللوني.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): اقترح لمسة أخيرة تحسن عملك.\nالإجابة: إجابة معللة.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nس1 (مستوى الدعم): اذكر ثلاث قواعد للمنظور درستها.\nالإجابة: نقطة تلاشي واحدة، نقطتا تلاشي، مستويات النظر.\n\nس2 (المستوى المتوقع): احكم على عملك.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): كيف ستوظف المنظور في مجالات أخرى؟\nالإجابة: في التصميم الداخلي والتصوير والعمارة والرسوم التوضيحية.", "الحصة 1: تحليل مشاهد خارجية من العمارة والطبيعة وقاعدة نقطتي التلاشي\nإرشاد للطالب: يلاحظ أركان المباني في حيه.\nإرشاد لولي الأمر: يتحاور مع ابنه حول العمارة في الحي.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 57–58.\n\nالحصة 2: تحليل لوحة الفنان حسين عبيد موضحًا العمق اللوني\nإرشاد للطالب: يتأمل لوحات فنانين عمانيين.\nإرشاد لولي الأمر: يحدث ابنه عن الفن التشكيلي العماني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 58.\n\nالحصة 3: استنتاج نقطتي التلاشي بتخطيط صور من العمارة الإسلامية\nإرشاد للطالب: يلاحظ عناصر العمارة الإسلامية في المساجد.\nإرشاد لولي الأمر: يزور مع ابنه معلمًا إسلاميًا إن تيسر.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 57–58.\n\nالحصة 4: اختيار المشهد الخارجي وتحديد خط الأفق ونقطتي التلاشي وزاوية النظر\nإرشاد للطالب: يلاحظ مشهدًا خارجيًا يرغب في رسمه.\nإرشاد لولي الأمر: يتابع مع ابنه خطته.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 58.\n\nالحصة 5: رسم خطوط الرؤية من نقطتي التلاشي إلى مستوى النظر ورسم الكتل الرئيسة\nإرشاد للطالب: يلاحظ أشكال المباني ككتل.\nإرشاد لولي الأمر: يتابع تقدم ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 58.\n\nالحصة 6: إكمال التفاصيل بخطوط الرؤية الوهمية (نوافذ، أبواب، أشجار، أرصفة)\nإرشاد للطالب: يلاحظ تفاصيل الواجهات في حيه.\nإرشاد لولي الأمر: يشجع ابنه على الإتقان.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 59.\n\nالحصة 7: تجارب لونية بالألوان الحارة والباردة ووضع الخطة اللونية للمشهد\nإرشاد للطالب: يلاحظ ألوان المشاهد عند الغروب.\nإرشاد لولي الأمر: يتابع مع ابنه خطته.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 58–59.\n\nالحصة 8: تلوين الخلفية والمستويات البعيدة بالألوان الباردة\nإرشاد للطالب: يتأمل ألوان السماء.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 59.\n\nالحصة 9: تلوين المقدمة بالألوان الحارة وتأكيد العمق اللوني\nإرشاد للطالب: يلاحظ ألوان العناصر القريبة والبعيدة.\nإرشاد لولي الأمر: يتابع إنجاز ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 59.\n\nالحصة 10: إخراج المشهد الخارجي وعرضه ونقده وتقويم الوحدة\nإرشاد للطالب: يحتفظ بعمله في ملف إنجازه.\nإرشاد لولي الأمر: يشجع ابنه على توظيف المنظور في هواياته.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 57–59."]}, {"title": "الدرس الأول: الفن الإسلامي (مجالاته، وخصائصه)", "unit": "الوحدة الأولى: الفن الإسلامي", "periods": [{"ax": "مفهوم الفن الإسلامي ومجالاته الفنية", "n": 1, "w": "الأسبوع التاسع: من 1/11/2026 إلى 5/11/2026 – الحصة 1 من حصص الأسبوع", "pg": "11–13", "f": ["1. يعرّف مفهوم ا
