لوظيفة والجمال\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\n1. النقد الفني\n2. التناسب الشكلي الزخرفي", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة\nالتعلم القبلي: الفخار في البيئة العمانية.\nيعرض المعلم نماذج فخار عماني (جحلة، مجمر، خرس) ويسأل: لماذا اشتهرت بهلاء بالفخار؟ ويذكر الطالب توفر الطين والإرث الحرفي. (5 دقائق)\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة\nالتعلم القبلي: التماثل والوحدات الزخرفية الإسلامية.\nيعرض المعلم بلاطة خزفية جاهزة ويسأل: كيف بدأ المصمم عمله؟ ويتوقع الطالب التقسيم والتخطيط. (5 دقائق)\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nالتعلم القبلي: تخطيط البلاطة.\nيعرض المعلم الشكل (2) تصميمًا نصفيًا وربعيًا ويسأل: أيهما يناسب جدارية كبيرة؟ ويقترح الطالب ويعلل. (5 دقائق)\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nالتعلم القبلي: تصميم البلاطة.\nيعرض المعلم وحدة إضاءة خزفية ويسأل: كيف خرج الضوء منها؟ ويلاحظ الطالب الفتحات المفرغة. (5 دقائق)\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\nالتعلم القبلي: تصميمات البلاطة والشكل الخزفي.\nيسأل المعلم: لو كنت مشتريًا، أي تصميم ستختار؟ ولماذا؟ ويختار الطالب ويعلل. (5 دقائق)", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة — زمن الحصة 40 دقيقة\n\n1. الخزافون: يعرض المعلم أعمال خزافين عالميين ويقارنها بالفخار العماني، ويقارن الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التحليل: يطلب المعلم تحليل أشكال مبتكرة من حيث الهيئة والزخرفة، ويحلل الطالب (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. المشاركة: يستمع المعلم للمجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يمهد المعلم لتصميم البلاطة، ويذكر الطالب قيمة من الدرس (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة — زمن الحصة 40 دقيقة\n\n1. الخطوات: ينمذج المعلم: تقسيم الورقة إلى مساحات متساوية، تخطيط الزخرف، التصميم النهائي (الشكل 1)، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التنفيذ: يتابع المعلم التقسيم وتخطيط الزخرفة مع الاستفادة من وحدة الفن الإسلامي، ويقسم الطالب الورقة ويخطط (16 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. الختام: يراجع المعلم التخطيطات، ويعرض الطالب (3 دقائق)\nالاستراتيجيات: مجمر).\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي — زمن الحصة 40 دقيقة\n\n1. التصميم: يتابع المعلم إكمال التصميم، ويكمل الطالب تصميم بلاطته (18 دقيقة)\nالاستراتيجيات: التفكير الإبداعي.\n\n2. التبادل: يطلب المعلم ملاحظة زميل، ويعدل الطالب (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. الختام: يمهد المعلم لتصميم الأشكال الخزفية، ويحفظ الطالب تصميمه (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر) — زمن الحصة 40 دقيقة\n\n1. الأفكار: يعرض المعلم أمثلة (وحدات إضاءة، مجامر، أشكال هندسية)، ويختار الطالب فكرة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التصميم: يتابع المعلم رسم التصميم بمساقطه البسيطة، ويصمم الطالب الشكل الخزفي (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. الختام: يراجع المعلم ملاءمة التصميم للتنفيذ بالشرائح، ويعدل الطالب (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي — زمن الحصة 40 دقيقة\n\n1. الاستكمال: يتابع المعلم اللمسات الأخيرة، ويستكمل الطالب تصميماته (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الشرح والنقد: ينظم المعلم عرضًا يشرح فيه كل طالب خطواته، ويشرح الطالب وينقد (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. أسئلة الكتاب: يطرح المعلم سؤالًا من الكتاب، ويجيب الطالب (2 دقيقتان)\nالاستراتيجيات: مجمر).\n\n4. الختام: يمهد المعلم لتنفيذ البلاطات بالطين، ويجهز الطالب تصميمه للتنفيذ (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. غلق الدرس – جرة بهلا تتحدث: تتخيل المجموعات أن جرة من فخار بهلا تتحدث عن مراحل صناعتها واستخدامها في حفظ الماء وتبريده، فتكتب على لسانها ثلاث جمل تعرضها على الصف (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الفرق بين الفخار والخزف؟\nالإجابة: الفخار طين محروق دون طلاء زجاجي غالبًا، والخزف مطلي بطلاء زجاجي.\n\nس2 (مستوى التطبيق): اذكر منتجًا فخاريًا عمانيًا.\nالإجابة: الجحلة أو المجمر.\n\nس3 (مستوى الاستدلال): كيف يمكن تطوير الشكل الفخاري العماني؟\nالإجابة: بتصاميم معاصرة مع الحفاظ على الهوية.\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما مقاس ورقة تصميم البلاطة؟\nالإجابة: (15×15) سم.\n\nس2 (مستوى التطبيق): لماذا نقسم الورقة إلى مساحات متساوية؟\nالإجابة: لتنظيم الزخرفة وتحقيق التماثل.\n\nس3 (مستوى الاستدلال): كيف تستفيد من وحدة الفن الإسلامي هنا؟\nالإجابة: بتوظيف قواعد التماثل والوحدات الزخرفية.\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما أنواع تصاميم البلاطة؟\nالإجابة: متماثل نصفي، ربعي، حر.\n\nس2 (مستوى التطبيق): كيف تحقق التناسب الشكلي الزخرفي؟\nالإجابة: بتناسب حجم الوحدات مع مساحة البلاطة.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا لبلاطة زميل.\nالإجابة: إجابة معللة.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا تناسب الأشكال الهندسية التنفيذ بالشرائح؟\nالإجابة: لأن الشرائح المسطحة تُقطع وتُجمع بسهولة.\n\nس2 (مستوى التطبيق): ما الذي يجب مراعاته في وحدة الإضاءة؟\nالإجابة: الفتحات المفرغة لمرور الضوء والاتزان.\n\nس3 (مستوى الاستدلال): اقترح شكلًا خزفيًا مبتكرًا بطابع عماني.\nالإجابة: مثال: مجمر بشكل برج قلعة.\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اشرح خطوات تصميمك.\nالإجابة: إجابة صحيحة.\n\nس2 (مستوى التطبيق): ما القيمة المستهدفة؟\nالإجابة: التناسب الشكلي الزخرفي.\n\nس3 (مستوى الاستدلال): انقد تصميم زميل.\nالإجابة: نقد معلل.", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر ولاية عمانية مشهورة بالفخار.\nالإجابة: بهلاء.\n\nس2 (مستوى التطبيق): حلل شكلًا خزفيًا مبتكرًا.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): اقترح استخدامًا معاصرًا للفخار.\nالإجابة: وحدات إضاءة أو أوانٍ ديكورية.\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): رتب خطوات تصميم البلاطة.\nالإجابة: التقسيم، تخطيط الزخرف، التصميم النهائي.\n\nس2 (مستوى التطبيق): صف تقسيمك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع تصميمك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف عناصر تصميمك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تصميمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المنتج الذي صممته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف وظيفة تصميمك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم إمكانية تنفيذه.\nالإجابة: تقييم معلل.\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أي تصميماتك أفضل؟ علل.\nالإجابة: إجابة معللة.\n\nس2 (مستوى التطبيق): أبدِ رأيك في تحقق التناسب.\nالإجابة: رأي معلل.\n\nس3 (مستوى الاستدلال): اقترح سعرًا لمنتجك مع التعليل.\nالإجابة: إجابة منطقية.", "الحصة 1: أشهر الخزافين والمنتجات الفخارية العمانية وتحليل أشكال خزفية مبتكرة\nإرشاد للطالب: يتأمل المنتجات الفخارية في الأسواق التقليدية.\nإرشاد لولي الأمر: يزور مع ابنه سوقًا تقليديًا إن تيسر.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 31–32.\n\nالحصة 2: خطوات تصميم بلاطة خزفية مربعة: تقسيم المساحة وتخطيط الزخرفة\nإرشاد للطالب: يلاحظ البلاط المزخرف في المنازل.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 33.\n\nالحصة 3: إكمال تصميم البلاطة (متماثل أو حر) محققًا التناسب الشكلي الزخرفي\nإرشاد للطالب: يحتفظ بتصميمه للتنفيذ.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 33.\n\nالحصة 4: تصميم شكل خزفي مبتكر يصلح تنفيذه بالشرائح الطينية (وحدة إضاءة، مجمر)\nإرشاد للطالب: يلاحظ أشكال المجامر ووحدات الإضاءة.\nإرشاد لولي الأمر: يناقش ابنه في فكرته.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 33–34.\n\nالحصة 5: استكمال التصميمات وشرحها وتقويم التناسب الشكلي الزخرفي\nإرشاد للطالب: يحتفظ بتصميماته.\nإرشاد لولي الأمر: يشجع ابنه على تطويرها.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 33–34.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/arts/?l=9"]}, {"title": "الدرس الثاني: بلاطات طينية مزخرفة", "unit": "الوحدة الثانية: المنتجات الفخارية", "periods": [{"ax": "نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين", "n": 1, "w": "الأسبوع الرابع عشر: من 6/12/2026 إلى 10/12/2026 – الحصة 1 من حصص الأسبوع", "pg": "35", "f": ["1. يتعرف نماذج للوحات جدارية منفذة بالبلاطات الطينية (10 دقائق)\n2. يتعرف حالات الطين وتحديات التشكيل به (15 دقيقة)\nمخرج آخر: يبحث عن صور لبلاطات خزفية للاستفادة منها (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. الكتاب\n4. أخرى: عينات طين", "1. البلاطة الطينية\n2. حالات الطين\n3. الجدارية", "التعلم القبلي: تصميم البلاطة على الورق.\nيمرر المعلم عينات طين رطب جدًا وصالح وجاف ويسأل: أيها يصلح للتشكيل؟ ويجرب الطالب ويستنتج. (5 دقائق)", "1. نماذج الجداريات: يعرض المعلم جداريات بالبلاطات (الأشكال 10–13)، ويحلل الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حالات الطين: يوضح المعلم: اللزج يصعب تشكيله، والجاف يتشقق، والصالح مرن متماسك، ويجرب الطالب العينات (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط: يطلب المعلم تحديد نوع العمل النهائي (جدارية أو معلقة)، ويحدد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يذكر المعلم بأدوات الحصة القادمة، ويستعد الطالب (4 دق  6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\n1. الطينة الملونة\n2. الملمس المطبوع\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\n1. التلوين المباشر\n2. المعالجات المركبة\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\n1. التجفيف\n2. الالتواء\n3. توزيع البلاطات\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\n1. الجدارية\n2. المعلقة\n3. التناغم الزخرفي الملمسي\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\n1. الإخراج\n2. التسويق\n3. تقويم الوحدة", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nالتعلم القبلي: تصميم البلاطة على الورق.\nيمرر المعلم عينات طين رطب جدًا وصالح وجاف ويسأل: أيها يصلح للتشكيل؟ ويجرب الطالب ويستنتج. (5 دقائق)\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nالتعلم القبلي: حالات الطين.\nيسأل المعلم: كيف نضمن أن تكون البلاطة متساوية السمك؟ ويقترح الطالب المسطرتين. (5 دقائق)\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nالتعلم القبلي: فرد الشريحة الطينية.\nيعرض المعلم الشكل (4) بلاطات بأشكال مختلفة ويسأل: كيف نقطع أشكالًا دقيقة؟ ويقترح الطالب قالبًا ورقيًا. (5 دقائق)\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nالتعلم القبلي: البلاطات المقطعة والتصميم.\nيسأل المعلم: كيف ننقل التصميم دون إتلاف الطين؟ ويقترح الطالب وضع الورقة والتحديد الخفيف. (5 دقائق)\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nالتعلم القبلي: التصميم المنقول على البلاطة.\nيمرر المعلم بلاطة مزخرفة بالغائر والبارز ويسأل: ما الذي تشعر به حين تلمسها؟ ويصف الطالب الملمس. (5 دقائق)\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nالتعلم القبلي: الزخرفة بالغائر والبارز.\nيضغط المعلم ورقة نبات على طين ويسأل: ماذا ترك؟ ويلاحظ الطالب الأثر. (5 دقائق)\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nالتعلم القبلي: الملامس والطين الملون.\nيعرض المعلم الشكل (7) ويسأل: ما المعالجات التي جُمعت في هذه البلاطة؟ ويحدد الطالب المعالجات. (5 دقائق)\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nالتعلم القبلي: البلاطات المزخرفة.\nيعرض المعلم بلاطة ملتوية ويسأل: ما سبب التوائها؟ ويتوقع الطالب الجفاف السريع غير المتساوي. (5 دقائق)\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nالتعلم القبلي: البلاطات الجافة وخطة الجدارية.\nيسأل المعلم: ما الذي يجعل الجدارية عملًا واحدًا لا بلاطات متفرقة؟ ويذكر الطالب الترابط والإيقاع. (5 دقائق)\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nالتعلم القبلي: الجداريات المجمعة.\nيسأل المعلم: أين نعرض أعمالنا لتصل إلى أكبر عدد؟ ويقترح الطالب أماكن. (5 دقائق)", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين — زمن الحصة 40 دقيقة\n\n1. نماذج الجداريات: يعرض المعلم جداريات بالبلاطات (الأشكال 10–13)، ويحلل الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حالات الطين: يوضح المعلم: اللزج يصعب تشكيله، والجاف يتشقق، والصالح مرن متماسك، ويجرب الطالب العينات (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط: يطلب المعلم تحديد نوع العمل النهائي (جدارية أو معلقة)، ويحدد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يذكر المعلم بأدوات الحصة القادمة، ويستعد الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي) — زمن الحصة 40 دقيقة\n\n1. البيان العملي: ينمذج المعلم فرد الطين بين مسطرتين بالنشابة على قماش، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التطبيق: يتابع المعلم الفرد، ويفرد الطالب شريحته (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام: يوجه المعلم لتغطية الشرائح، ويغطي الطالب شريحته (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم التقطيع بقالب ورقي، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. التقطيع: يتابع المعلم التقطيع، ويقطع الطالب بلاطاته (18 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. الختام: يوجه المعلم للتغطية، ويغطي الطالب بلاطاته (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية — زمن الحصة 40 دقيقة\n\n1. النمذجة: ينمذج المعلم وضع التصميم والضغط بأداة مدببة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النقل: يتابع المعلم النقل، وينقل الطالب التصميم (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام: يذكر المعلم بالزخرفة القادمة، ويغطي الطالب عمله (3 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف) — زمن الحصة 40 دقيقة\n\n1. البيان العملي: ينمذج المعلم الحذف بالأداة والإضافة مع التخشين والماء للالتصاق، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الزخرفة: يتابع، ويزخرف الطالب بلاطته بالغائر والبارز (16 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام: يوجه المعلم للتغطية، ويغطي الطالب عمله (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط — زمن الحصة 40 دقيقة\n\n1. العرض: يعرض المعلم الشكلين (5، 6)، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التجريب: يتابع المعلم التطبيق، ويضيف الطالب الطين الملون ويطبع الملامس (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الختام: يعرض المعلم النتائج، ويقارن الطالب (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات — زمن الحصة 40 دقيقة\n\n1. التلوين والجمع: يتابع المعلم التلوين والجمع بين المعالجات، والطلبة يلون بلاطاته ويجمع المعالجات (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المراجعة: يطلب المعلم ملاحظة زميل، ويعدل الطالب (4 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n3. الختام: يذكر المعلم بالتجفيف البطيء، ويغطي الطالب العمل جزئيًا (3 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية — زمن الحصة 40 دقيقة\n\n1. التجفيف: يوضح المعلم التجفيف البطيء بالتغطية وقلب البلاطات وتجنب الشمس المباشرة، ويطبق الطالب على بلاطاته (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تخطيط الجدارية: يوجه المجموعات لتخطيط توزيع البلاطات (هندسي، بمسافات متساوية، معلقات)، وتخطط المجموعة جداريتها (14 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. الختام: يراجع المعلم الخطط، وتعرض المجموعة خطتها (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة — زمن الحصة 40 دقيقة\n\n1. التنظيم: يوزع المعلم الأدوار ويذكر بالخطة، ويستلم الطالب دوره (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التجميع: يتابع المعلم التثبيت أو التعليق، ويجمع الطالب البلاطات في العمل (18 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. الختام: يطلب المعلم تأمل العمل من بعيد، ويقيم الطالب الترابط (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة — زمن الحصة 40 دقيقة\n\n1. الإخراج: يتابع المعلم اللمسات الأخيرة، ويُخرج الطالب العمل (6 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. العرض والتحليل: ينظم المعلم عرضًا وتحليلًا للتقنيات، ويحلل الطالب ويعرض (7 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. تقويم الوحدة: يطرح المعلم أسئلة الوحدة وأسئلة الكتاب، ويجيب الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يناقش المعلم تسويق البلاطات منتجاتٍ ديكورية، ويقترح الطالب فكرة تسويقية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. غلق الدرس – جدارية الوطن: تخطط المجموعات جدارية من بلاطات طينية لمدخل المدرسة، تحمل كل بلاطة رمزًا عمانيًا (النخلة، الخنجر، السفينة، شجرة اللبان)، ثم تتفق على ترتيبها وتعرض الفكرة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا يصعب التشكيل بالطين اللزج؟\nالإجابة: لأنه يلتصق ولا يحتفظ بالشكل.\n\nس2 (مستوى التطبيق): ماذا يحدث للطين الجاف عند تشكيله؟\nالإجابة: يتشقق.\n\nس3 (مستوى الاستدلال): اقترح طريقة لحفظ الطين رطبًا.\nالإجابة: لفه بكيس بلاستيكي أو قطعة قماش رطبة.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما وظيفة المسطرتين؟\nالإجابة: ضبط سمك الشريحة.\n\nس2 (مستوى التطبيق): لماذا نفرد الطين على قماش؟\nالإجابة: لمنع التصاقه باللوح.\n\nس3 (مستوى الاستدلال): اقترح حلًا لشريحة ظهرت فيها فقاعات.\nالإجابة: ثقب الفقاعة بإبرة وإعادة التسوية.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما فائدة القالب الورقي؟\nالإجابة: ضمان دقة الشكل والمقاس.\n\nس2 (مستوى التطبيق): اذكر شكلين للبلاطات.\nالإجابة: مربع ومستطيل (أو دائري).\n\nس3 (مستوى الاستدلال): لماذا نهذب حواف البلاطة؟\nالإجابة: لتجنب التشقق وتحسين المظهر.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما أداة النقل؟\nالإجابة: أداة مدببة.\n\nس2 (مستوى التطبيق): لماذا نضغط بخفة؟\nالإجابة: حتى لا تثقب الورقة الطين أو تشوهه.\n\nس3 (مستوى الاستدلال): حلل وضوح الخطوط المنقولة في عملك.\nالإجابة: تحليل معلل.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الغائر؟\nالإجابة: الأجزاء المنخفضة عن السطح الناتجة عن الحذف.\n\nس2 (مستوى التطبيق): كيف نثبت الطين المضاف؟\nالإجابة: بتخشين السطحين وإضافة الماء أو البطانة.\n\nس3 (مستوى الاستدلال): لماذا تنفصل الإضافات أحيانًا؟\nالإجابة: لعدم التخشين أو اختلاف الرطوبة.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كيف تضيف الطينة الملونة؟\nالإجابة: بضغطها على الشريحة الرطبة.\n\nس2 (مستوى التطبيق): اذكر شيئين يمكن طبع ملمسهما.\nالإجابة: أوراق النباتات والدانتيل.\n\nس3 (مستوى الاستدلال): اقترح شيئًا من البيئة العمانية لطبع ملمسه.\nالإجابة: سعف النخيل أو الأصداف.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما معالجات زخرفة البلاطة؟\nالإجابة: الطين الملون، الملامس، التلوين، الغائر والبارز.\n\nس2 (مستوى التطبيق): لماذا لا نكثر المعالجات في بلاطة واحدة؟\nالإجابة: حتى لا تزدحم وتفقد الانسجام.\n\nس3 (مستوى الاستدلال): حلل انسجام المعالجات في عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا تلتوي البلاطة؟\nالإجابة: بسبب الجفاف السريع وغير المتساوي.\n\nس2 (مستوى التطبيق): كيف تجفف البلاطة ببطء؟\nالإجابة: بتغطيتها جزئيًا وقلبها بعيدًا عن الشمس.\n\nس3 (مستوى الاستدلال): اقترح توزيعًا يحقق التناغم.\nالإجابة: مثال: تبادل البلاطات الغائرة والبارزة بمسافات متساوية.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الفرق بين الجدارية والمعلقة؟\nالإجابة: الجدارية تثبت على سطح، والمعلقة تتدلى بخيوط.\n\nس2 (مستوى التطبيق): كيف تحقق الإيقاع في التوزيع؟\nالإجابة: بالتكرار المنتظم أو المتبادل.\n\nس3 (مستوى الاستدلال): حلل ترابط جدارية مجموعة أخرى.\nالإجابة: تحليل معلل.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nتفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اذكر تقنيتين لزخرفة البلاطة.\nالإجابة: الغائر والبارز، والطين الملون.\n\nس2 (مستوى التطبيق): حلل تقنيات جدارية زميلك.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): صمم خطة تسويق للبلاطات.\nالإجابة: الفئة، السعر، قناة البيع.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الجدارية؟\nالإجابة: عمل فني يثبت على الجدار من تجميع بلاطات.\n\nس2 (مستوى التطبيق): صف الطين الصالح للتشكيل.\nالإجابة: مرن متماسك لا يلتصق ولا يتشقق.\n\nس3 (مستوى الاستدلال): قارن بين المعلقة واللوحة الجدارية.\nالإجابة: مقارنة معللة.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الأداة المستخدمة للفرد؟\nالإجابة: النشابة.\n\nس2 (مستوى التطبيق): اشرح طريقة الفرد.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم تساوي سمك شريحتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): كم بلاطة قطعت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف طريقة التقطيع.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم دقة القطع.\nالإجابة: تقييم معلل.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): هل ظهر التصميم كاملًا؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف طريقة النقل.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم التناسب.\nالإجابة: تقييم معلل.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر أسلوبي الزخرفة في هذه الحصة.\nالإجابة: الحذف والإضافة.\n\nس2 (مستوى التطبيق): صف الملمس الناتج.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التناغم الملمسي.\nالإجابة: تقييم معلل.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الملامس التي طبقتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف أثر الطين الملون.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تنوع الملامس.\nالإجابة: تقييم معلل.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المعالجات التي جمعتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف الانسجام في بلاطتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر طريقة للتجفيف البطيء.\nالإجابة: التغطية بالبلاستيك.\n\nس2 (مستوى التطبيق): صف خطة جداريتكم.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم الخطة من حيث التناغم.\nالإجابة: تقييم معلل.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع عمل مجموعتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف دورك في المجموعة.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التناغم في العمل.\nالإجابة: تقييم معلل.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nأسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما خطوات تشكيل البلاطة؟\nالإجابة: الفرد، التقطيع، نقل التصميم، الزخرفة.\n\nس2 (مستوى التطبيق): احكم على عمل مجموعتك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): كيف يحافظ هذا العمل على حرفة الفخار العمانية؟\nالإجابة: بإحيائها بتصاميم معاصرة.", "الحصة 1: نماذج لوحات جدارية بالبلاطات الطينية وحالات الطين\nإرشاد للطالب: يبحث عن صور لبلاطات خزفية.\nإرشاد لولي الأمر: يساعد ابنه في جمع الصور.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 35.\n\nالحصة 2: فرد شريحة طينية متساوية السمك (بيان عملي)\nإرشاد للطالب: يلاحظ طريقة فرد العجين في المطبخ.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 36.\n\nالحصة 3: تقطيع الشرائح وفق تصميم البلاطات المراد تنفيذها\nإرشاد للطالب: يلاحظ أشكال البلاط في البيئة.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 36–37.\n\nالحصة 4: نقل التصميم الزخرفي إلى البلاطات الطينية\nإرشاد للطالب: يحافظ على تصميمه الورقي.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 5: الزخرفة بالحذف والإضافة للحصول على مناطق غائرة وبارزة (الريليف)\nإرشاد للطالب: يلاحظ النقوش البارزة في الأبواب الخشبية.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 6: إضافة طينة ملونة وتطبيق ملامس الأشياء بالضغط\nإرشاد للطالب: يجمع عناصر طبيعية آمنة ذات ملامس.\nإرشاد لولي الأمر: يساعد ابنه في الجمع.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 7: إضافة الألوان بالفرشاة مباشرة والجمع بين المعالجات\nإرشاد للطالب: يتابع جفاف عمله في المدرسة.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 37.\n\nالحصة 8: التجفيف البطيء والمحافظة على البلاطات وتخطيط الجدارية\nإرشاد للطالب: يلاحظ أثر الشمس في تجفيف الطين.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 38.\n\nالحصة 9: تجميع البلاطات في لوحة جدارية أو معلقة\nإرشاد للطالب: يشارك أسرته صور الجدارية.\nإرشاد لولي الأمر: يشيد بعمل ابنه الجماعي.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 38.\n\nالحصة 10: إخراج الجداريات وعرضها وتحليلها وتقويم الوحدة\nإرشاد للطالب: يحتفظ بصور العمل في ملف إنجازه.\nإرشاد لولي الأمر: يشجع ابنه على تقدير الحرف التقليدية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الحادي عشر) ص 35–38.\n🎮 رابط ألع   d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
