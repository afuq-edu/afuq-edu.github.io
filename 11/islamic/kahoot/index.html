:root{
 --bg1:#f4f8fc;--bg2:#eef3f9;--card:#ffffff;--ink:#2e3a48;--soft:#728396;--line:#e1e9f2;
 --acc:#6a9fd4;--acc-d:#4b7fb3;--ok:#4fae7b;--ok-bg:#e8f6ee;--bad:#e08e8e;--bad-bg:#fbeeee;--warn:#e7b65c;
 --r:18px;--sh:0 6px 24px rgba(40,70,110,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Tajawal,Naskh,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 85% -10%,#e7f0fb 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#f3ecf9 0,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:16px clamp(12px,3vw,28px) 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-size:13px;color:#9aabbd}
.title{font-size:clamp(18px,2.4vw,26px);font-weight:700;color:#3d5b7a;margin:0}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:999px;width:44px;height:44px;font-size:20px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh);transition:transform .2s}
.iconbtn:active{transform:scale(.94)}
.screen{display:none;animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(14px,2.4vw,24px)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.step{display:flex;gap:10px;align-items:center;margin:4px 0 10px;font-weight:700;color:#4a6886;font-size:17px}
.step b{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#eaf2fb;color:var(--acc-d);align-items:center;justify-content:center;font-size:15px}
select,input[type=text]{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfdff;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}
select:focus,input[type=text]:focus{border-color:#a9c7e6;box-shadow:0 0 0 4px #e5effa}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;color:var(--soft);transition:all .2s}
.chip.on{background:#eaf3fc;border-color:#a9c7e6;color:#35597d;font-weight:700;box-shadow:0 2px 10px rgba(80,130,190,.15)}
.chip small{display:block;font-size:12px;color:#97a7b8;font-weight:400}
.cnt{display:flex;gap:8px}
.cnt button{width:52px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--soft);transition:.2s}
.cnt button.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 12px rgba(90,140,200,.35)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:10px}
.names .nm{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.range{width:100%;accent-color:var(--acc)}
.qn{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qn .big{font-size:34px;font-weight:700;color:var(--acc-d);min-width:48px;text-align:center}
.go{display:block;width:100%;margin-top:16px;border:0;border-radius:16px;padding:16px;font-size:21px;font-weight:700;color:#fff;background:linear-gradient(135deg,#79acd9,#5d8fc4);box-shadow:0 8px 22px rgba(80,130,190,.35);transition:transform .2s,box-shadow .2s}
.go:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(80,130,190,.4)}
.go:disabled{opacity:.5;transform:none}
.hint{color:var(--soft);font-size:14px;margin-top:6px}
/* اللعب */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.prog{flex:1;min-width:200px}
.prog .lbl{font-size:15px;color:var(--soft);margin-bottom:5px}
.pbar{height:10px;background:#e6eef7;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9cc4ea,#6a9fd4);border-radius:99px;transition:width .6s ease}
.groups{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gchip{display:flex;align-items:center;gap:8px;border:2px solid transparent;background:#fff;border-radius:14px;padding:7px 12px;font-size:15px;box-shadow:var(--sh);transition:all .25s}
.gchip .sc{font-weight:700;color:var(--soft)}
.gchip.on{transform:translateY(-2px) scale(1.04)}
.stage{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.stage{grid-template-columns:1fr}}
.timerbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{position:relative;width:170px;height:170px}
@media(max-width:860px){.ring{width:120px;height:120px}.timerbox{flex-direction:row;justify-content:center}}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:#e7eef6;stroke-width:12}
.ring .fgc{fill:none;stroke:var(--acc);stroke-width:12;stroke-linecap:round;transition:stroke .4s}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:clamp(30px,4vw,46px);color:#3d5b7a;line-height:1}
.ring .num span{font-size:13px;color:var(--soft)}
.ptsnow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:15px;color:var(--soft);box-shadow:var(--sh);text-align:center}
.ptsnow b{color:var(--acc-d);font-size:20px}
.answering{font-size:16px;text-align:center;color:var(--soft)}
.answering b{font-size:19px}
.qcard{position:relative}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:13px;border-radius:999px;padding:4px 12px;background:#f1f5fa;color:#5c7590;border:1px solid var(--line)}
.badge.l1{background:#eaf6ef;color:#3e7d58;border-color:#cfe8da}
.badge.l2{background:#fdf5e4;color:#8a6a24;border-color:#f1e1b8}
.badge.l3{background:#f5eefb;color:#6c4f91;border-color:#e3d3f2}
.qtext{font-family:Naskh,Tajawal,serif;font-size:clamp(21px,2.8vw,32px);line-height:1.75;margin:4px 0 16px;color:#2a3644}
.blank{display:inline-block;min-width:120px;border-bottom:3px dashed #a9c7e6;margin:0 6px;text-align:center;color:var(--acc-d);font-weight:700;transition:all .3s}
.blank.fill{border-bottom-style:solid}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;font-size:clamp(17px,2.1vw,23px);font-family:Naskh,Tajawal,serif;color:var(--ink);transition:transform .15s,border .25s,background .25s,box-shadow .25s;box-shadow:0 2px 8px rgba(40,70,110,.05)}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#bcd4ec;box-shadow:0 8px 18px rgba(60,100,150,.1)}
.opt .k{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:Tajawal;font-weight:700;font-size:18px;color:#fff}
.opt.ok{border-color:#9fd5b6;background:var(--ok-bg);animation:pop .45s ease}
.opt.bad{border-color:#efbcbc;background:var(--bad-bg);animation:shake .45s ease}
.opt.dim{opacity:.45}
.opts.tf .opt{justify-content:center;font-family:Tajawal;font-size:clamp(22px,3vw,30px);padding:22px}
.opts.fill{display:flex;flex-wrap:wrap;gap:10px}
.opts.fill .opt{flex:1 1 180px;justify-content:center;font-weight:700}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 18px;font-size:17px;color:#4a6886;box-shadow:var(--sh);transition:.2s}
.btn:hover{background:#f3f8fd}
.btn.pri{background:linear-gradient(135deg,#79acd9,#5d8fc4);color:#fff;border:0}
.feedback{margin-top:14px;border-radius:14px;padding:12px 16px;font-size:18px;display:none;animation:fade .35s ease}
.feedback.ok{display:block;background:var(--ok-bg);color:#2f7a52;border:1px solid #cbe8d7}
.feedback.bad{display:block;background:var(--bad-bg);color:#a05252;border:1px solid #f0cfcf}
.gain{position:absolute;left:24px;top:14px;font-size:30px;font-weight:700;color:var(--ok);opacity:0;pointer-events:none}
.gain.show{animation:rise 1.4s ease forwards}
@keyframes rise{0%{opacity:0;transform:translateY(16px) scale(.8)}25%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-36px) scale(1)}}
/* لوحة النتائج */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:min(52vh,420px);padding:30px 10px 0;border-bottom:2px solid #e3ebf4}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:0 1 120px;position:relative}
.bar{width:100%;border-radius:16px 16px 6px 6px;height:4%;transition:height 1.1s cubic-bezier(.22,1,.36,1);position:relative;box-shadow:inset 0 -10px 20px rgba(255,255,255,.35)}
.bar .v{position:absolute;top:-30px;left:0;right:0;text-align:center;font-weight:700;font-size:20px;color:#3d5b7a}
.col .rk{margin-top:8px;font-size:14px;color:var(--soft)}
.col .nm{font-size:clamp(14px,1.8vw,18px);font-weight:700;text-align:center;margin-top:2px}
.col.win .bar{animation:glow 1.6s ease 1.1s 2}
.star{position:absolute;top:-64px;font-size:26px;opacity:0;transition:opacity .5s 1s}
.col.win .star{opacity:1}
@keyframes glow{0%,100%{box-shadow:inset 0 -10px 20px rgba(255,255,255,.35)}50%{box-shadow:0 0 0 6px rgba(255,214,120,.45),inset 0 -10px 20px rgba(255,255,255,.35)}}
.boardmsg{text-align:center;font-size:19px;color:#4a6886;margin:12px 0}
/* المنصة */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,20px);margin-top:20px;min-height:360px}
.pod{display:flex;flex-direction:column;align-items:center;width:clamp(110px,22vw,200px)}
.pod .blk{width:100%;border-radius:18px 18px 8px 8px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:44px;font-weight:700;color:#fff;transform-origin:bottom;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
.pod .nm{font-size:clamp(16px,2.2vw,22px);font-weight:700;margin-bottom:4px;text-align:center}
.pod .sc{color:var(--soft);margin-bottom:8px}
.pod .medal{font-size:40px;animation:fade .6s ease both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rest{max-width:520px;margin:18px auto 0}
.rest div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:6px 0}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.sum{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px;color:var(--soft)}
</style></head><body>

  const bar=c.querySelector('.bar');bar.style.background='linear-gradient(180deg,'+col[0]+','+col[1]+')';bar.style.height=Math.max(4,g.prev/max*100)+'%';
  c.querySelector('.rk').textContent='المركز '+rankOf[i];c.querySelector('.nm').textContent=g.n;c.querySelector('.nm').style.color=col[2];ch.appendChild(c);
  setTimeout(()=>{bar.style.height=Math.max(4,g.s/max*100)+'%';countUp(c.querySelector('.v'),g.prev,g.s)},80)});
 $('#bmsg').textContent=game.lastWin>=0?('⭐ فائزة السؤال: '+gs[game.lastWin].n):'لا فائز في هذا السؤال — السؤال القادم فرصة جديدة';
 $('#next').textContent=game.i+1<game.qs.length?'السؤال التالي ◀':'منصة التتويج 🏆'}
function countUp(el,a,b){const t0=performance.now();const d=1000;const f=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
$('#next').onclick=()=>{SND.click();game.i++;if(game.i<game.qs.length){show('#sPlay');ask()}else final()};
function final(){show('#sFinal');SND.win();const gs=game.groups.slice().sort((a,b)=>b.s-a.s);
 $('#fsum').textContent='الدرس: '+DATA[st.lesson].t+' — عدد الأسئلة: '+game.qs.length;
 const pod=$('#podium');pod.innerHTML='';const order=[1,0,2].filter(k=>k<gs.length);const H={0:260,1:190,2:140};const M=['🥇','🥈','🥉'];
 order.forEach((k,idx)=>{const g=gs[k];const col=COLORS[g.c];const d=document.createElement('div');d.className='pod';
  d.innerHTML='<div class="medal">'+M[k]+'</div><div class="nm"></div><div class="sc"></div><div class="blk">'+(k+1)+'</div>';
  d.querySelector('.nm').textContent=g.n;d.querySelector('.nm').style.color=col[2];d.querySelector('.sc').textContent=g.s+' نقطة';
  const blk=d.querySelector('.blk');blk.style.height=H[k]+'px';blk.style.background='linear-gradient(180deg,'+col[0]+','+col[1]+')';blk.style.animationDelay=(0.25+idx*0.25)+'s';pod.appendChild(d)});
 const rest=$('#rest');rest.innerHTML='';gs.slice(3).forEach((g,k)=>{const d=document.createElement('div');d.innerHTML='<span></span><b></b>';d.querySelector('span').textContent=(k+4)+'. '+g.n;d.querySelector('b').textContent=g.s+' نقطة';rest.appendChild(d)});
 confetti()}
$('#again').onclick=()=>{SND.click();show('#sSetup')};
$('#replay').onclick=()=>{$('#start').onclick()};
/* ---------- احتفال هادئ ---------- */
function confetti(){const cv=$('#fx');const x=cv.getContext&&cv.getContext('2d');if(!x)return;const W=cv.width=innerWidth,H=cv.height=innerHeight;const cols=['#9cc4ea','#f3c9c4','#b9e2c8','#f5dea0','#d8c4ee','#f8cfa8'];
 const ps=Array.from({length:120},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,r:4+Math.random()*5,vx:-.6+Math.random()*1.2,vy:1+Math.random()*1.6,a:Math.random()*6,va:-.05+Math.random()*.1,c:cols[Math.floor(Math.random()*cols.length)]}));
 const t0=performance.now();const f=t=>{x.clearRect(0,0,W,H);const alive=t-t0<6500;ps.forEach(p=>{p.x+=p.vx+Math.sin(p.a)*.4;p.y+=p.vy;p.a+=p.va;if(p.y>H+20&&alive){p.y=-20;p.x=Math.random()*W}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=.85;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  if(alive||ps.some(p=>p.y<H+20))requestAnimationFrame(f);else x.clearRect(0,0,W,H)};requestAnimationFrame(f)}
document.addEventListener('keydown',e=>{if(!$('#sPlay').classList.contains('on')||game.locked)return;const n=parseInt(e.key);if(n>=1&&n<=game.qs[game.i].opts.length)answer(n-1)});
</script></body></html>
