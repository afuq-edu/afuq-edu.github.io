:root{--bg1:#f3f8fb;--bg2:#f7f4fb;--ink:#2e3a46;--mute:#6b7a89;--teal:#2c6f8c;--tealsoft:#e3f2f7;--line:#dde7ee;--ok:#3f8f63;--oksoft:#e4f4ea;--bad:#c0664f;--badsoft:#fbebe6;--gold:#d9a93c;
--g0:#7fb7d6;--g1:#9ccf9f;--g2:#e9b98c;--g3:#b8a4dc;--g4:#ec9fae;--g5:#86cfc4}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:'AR',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 30px}
.screen{display:none;animation:in .45s cubic-bezier(.2,.8,.2,1)}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.panel{background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(44,111,140,.07)}
h1{margin:0;font-size:clamp(1.3rem,2.6vw,2rem);color:var(--teal)}
.sub{color:var(--mute);margin:4px 0 14px}
label.t{display:block;font-weight:700;margin:14px 0 6px;color:#3f5566}
select,input[type=text]{font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;color:#4b5d6c;transition:.2s}
.chip:hover{transform:translateY(-1px)}.chip.on{background:var(--tealsoft);border-color:#a9d3e3;color:var(--teal);font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.row{grid-template-columns:1fr}}
.step{display:flex;align-items:center;gap:10px}
.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.4rem;cursor:pointer;color:var(--teal)}
.step b{font-size:1.6rem;min-width:30px;text-align:center}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.names div{display:flex;align-items:center;gap:6px}.dot{width:14px;height:14px;border-radius:50%;flex:none}
input[type=range]{width:100%;accent-color:var(--teal)}
.go{font:inherit;font-weight:700;font-size:1.2rem;border:0;border-radius:16px;padding:13px 28px;background:linear-gradient(135deg,#5fa8c8,#2c6f8c);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(44,111,140,.25);transition:.2s}
.go:hover{transform:translateY(-2px)}.go:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ghost{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;color:#4b5d6c}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:#4b5d6c}
.turn{display:flex;gap:6px;flex-wrap:wrap}
.turn .chip{display:flex;align-items:center;gap:6px}.turn .chip.on{box-shadow:0 0 0 3px rgba(44,111,140,.15)}
.qgrid{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:start}@media(max-width:760px){.qgrid{grid-template-columns:1fr}}
.timer{position:relative;width:170px;height:170px;margin:auto}
.timer svg{transform:rotate(-90deg)}.timer .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .num b{font-size:2.6rem;color:var(--teal);line-height:1}.timer .num small{color:var(--mute)}
.pts{margin-top:10px;text-align:center;background:#fff;border:1px dashed #cfe0ea;border-radius:12px;padding:6px;color:#3f5566}
.pts b{color:var(--teal);font-size:1.3rem}
.qtype{display:inline-block;background:#f4effa;color:#6a54a0;border:1px solid #e1d6f1;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.lvl{display:inline-block;margin-right:6px;color:#a0742a;font-size:.85rem}
.qtext{font-size:clamp(1.25rem,2.4vw,1.85rem);font-weight:700;margin:12px 0 16px;line-height:1.7}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-size:clamp(1.05rem,2vw,1.35rem);text-align:right;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.18s;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:#a9d3e3;transform:translateY(-2px)}
.opt .k{width:34px;height:34px;border-radius:10px;background:var(--tealsoft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}.opt.bad{border-color:var(--bad);background:var(--badsoft)}.opt:disabled{cursor:default}
.short{display:flex;gap:10px}.short input{font-size:1.3rem}
.fb{margin-top:14px;border-radius:14px;padding:12px 16px;display:none;font-size:1.1rem}
.fb.ok{display:block;background:var(--oksoft);color:#2d6b49;border:1px solid #bfe2cc}.fb.bad{display:block;background:var(--badsoft);color:#9a4c38;border:1px solid #f0cfc4}
.after{margin-top:14px;display:none;gap:10px;flex-wrap:wrap}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:330px;padding:20px 10px 0;border-bottom:2px solid var(--line)}
.bar{width:clamp(48px,9vw,96px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .v{font-weight:700;margin-bottom:6px;color:#3f5566;transition:.3s}
.bar .b{width:100%;height:4px;border-radius:14px 14px 4px 4px;transition:height 1.1s cubic-bezier(.2,.9,.25,1.05);position:relative}
.bar.win .b{box-shadow:0 0 0 4px rgba(217,169,60,.35),0 10px 24px rgba(217,169,60,.35)}
.bar .rk{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.85rem;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.lbl{display:flex;justify-content:center;gap:clamp(10px,3vw,34px);margin-top:8px}
.lbl div{width:clamp(48px,9vw,96px);text-align:center;font-weight:700;font-size:.92rem;color:#4b5d6c;word-break:break-word}
.star{display:inline-block;color:var(--gold);animation:pop .6s ease}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.rank{margin-top:16px;display:grid;gap:6px}
.rank div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:400px;margin-top:10px}
.pd{width:clamp(90px,18vw,170px);text-align:center}
.pd .blk{border-radius:16px 16px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:2rem;font-weight:700;color:#fff;height:0;transition:height 1.2s cubic-bezier(.2,.9,.25,1.05)}
.pd .nm{font-weight:700;margin-bottom:6px}.pd .sc{color:var(--mute);margin-bottom:6px}
.p1 .blk{background:linear-gradient(180deg,#e8c56b,#d9a93c)}.p2 .blk{background:linear-gradient(180deg,#c9d4dd,#a8b6c2)}.p3 .blk{background:linear-gradient(180deg,#e7b48f,#cf8f63)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.mute{font:inherit;border:1px solid var(--line);background:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.2rem}
.foot{color:var(--mute);font-size:.85rem;text-align:center;margin-top:14px}
</style></head><body>
<canvas id="confetti"></canvas>
<div class="wrap">

<div class="top"><div><h1>مسابقات كاهوت</h1><div class="sub">الرياضيات الأساسية – الصف الحادي عشر – الفصل الدراسي الأول</div></div><button class="mute" id="mute1" title="كتم الصوت">🔊</button></div>
<label class="t">1) اختر الدرس</label><select id="les"></select>
<label class="t">2) اختر عنوان الحصة</label><div class="chips" id="axes"></div>

// ---------- question
const TN={m:'اختيار من متعدد',t:'صواب أم خطأ',c:'إكمال قصير'},LV=['','سهل','متوسط','متقدم'];
function pts(t){return t<=30?Math.round(1000-500*t/30):Math.max(100,Math.round(500-20*(t-30)))}
function drawTurn(){const t=$('turn');t.innerHTML='';for(let i=0;i<st.g;i++){const b=document.createElement('button');b.className='chip'+(i==st.turn?' on':'');b.innerHTML='<span class="dot" style="background:'+GC[i]+'"></span>'+esc(st.names[i]);b.onclick=()=>{if(!st.done){st.turn=i;drawTurn()}};t.appendChild(b)}}
function H(s){return esc(s).replace(/\u2066/g,'<bdo dir="ltr" style="white-space:nowrap">').replace(/\u2069/g,'</bdo>')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ask(){const q=st.qs[st.i];st.done=false;st.turn=st.i%st.g;drawTurn();
 $('qn').textContent='السؤال '+(st.i+1)+' من '+st.qs.length;$('qt').textContent=TN[q[0]];$('ql').textContent='• '+LV[q[2]];$('qx').innerHTML=H(q[3]);
 $('fb').className='fb';$('after').style.display='none';$('accept').style.display='none';const a=$('ans');a.innerHTML='';
 if(q[0]=='m'){const idx=shuf(q[4].map((_,i)=>i));const box=document.createElement('div');box.className='opts';const K='أبجد';
  idx.forEach((oi,n)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="k">'+K[n]+'</span><span></span>';b.lastChild.innerHTML=H(q[4][oi]);b.dataset.c=oi==q[5]?1:0;b.onclick=()=>answer(oi==q[5],b,box);box.appendChild(b)});a.appendChild(box)}
 else if(q[0]=='t'){const box=document.createElement('div');box.className='opts';[['صواب',true],['خطأ',false]].forEach(([s,v])=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="k">'+(v?'✓':'✗')+'</span>'+s;b.dataset.c=(v===q[4])?1:0;b.onclick=()=>answer(v===q[4],b,box);box.appendChild(b)});a.appendChild(box)}
 else{const box=document.createElement('div');box.className='short';const inp=document.createElement('input');inp.type='text';inp.placeholder='اكتب الإجابة هنا';const b=document.createElement('button');b.className='go';b.textContent='تحقق';
  const chk=()=>{if(st.done||!inp.value.trim())return;const v=norm(inp.value);answer(q[4].some(x=>norm(x)==v),null,box)};b.onclick=chk;inp.onkeydown=e=>{if(e.key=='Enter')chk()};box.append(inp,b);a.appendChild(box);setTimeout(()=>inp.focus(),200)}
 st.t0=performance.now();clearInterval(st.tick);st.lastSec=-1;st.tick=setInterval(timer,100);timer()}
function norm(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ـ/g,'').replace(/[−–]/g,'-').replace(/×/g,'*').replace(/٫/g,'.').replace(/،/g,',').replace(/\s+/g,'').toLowerCase()}
function timer(){const t=(performance.now()-st.t0)/1000;const left=Math.max(0,30-t);const arc=$('arc');
 if(t<=30){$('tn').textContent=Math.ceil(left);$('tl').textContent='ثانية';arc.style.strokeDashoffset=465*(1-left/30);arc.style.stroke=left>10?'#5fa8c8':'#e2a35f';const s=Math.ceil(left);if(s<=5&&s!=st.lastSec&&s>0){st.lastSec=s;SND.tick()}}
 else{$('tn').textContent='+'+Math.floor(t-30);$('tl').textContent='وقت إضافي';arc.style.strokeDashoffset=465;arc.style.stroke='#c9a0d6'}
 $('pv').textContent=pts(t)}
function answer(ok,btn,box){if(st.done)return;st.done=true;clearInterval(st.tick);const t=(performance.now()-st.t0)/1000;const q=st.qs[st.i];
 box.querySelectorAll('button,input').forEach(b=>b.disabled=true);
 if(box.classList.contains('opts'))box.querySelectorAll('.opt').forEach(b=>{if(b.dataset.c=='1')b.classList.add('ok')});
 if(btn&&!ok)btn.classList.add('bad');st.elapsed=t;
 const p=ok?pts(t):0;st.sc[st.turn]+=p;st.last=ok?st.turn:-1;st.lastPts=p;
 const right=q[0]=='m'?q[4][q[5]]:q[0]=='t'?(q[4]?'صواب':'خطأ'):q[4][0];
 const fb=$('fb');fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=ok?H('إجابة صحيحة! حصلت '+st.names[st.turn]+' على '+p+' نقطة.'):H('إجابة غير صحيحة. الإجابة الصحيحة: '+right);
 $('after').style.display='flex';if(!ok&&q[0]=='c')$('accept').style.display='inline-block';ok?SND.ok():SND.bad()}
$('accept').onclick=()=>{const p=pts(st.elapsed);st.sc[st.turn]+=p;st.last=st.turn;st.lastPts=p;$('fb').className='fb ok';$('fb').textContent='احتُسبت الإجابة صحيحة: '+p+' نقطة لـ '+st.names[st.turn]+'.';$('accept').style.display='none';SND.ok()};
// ---------- results
$('toRes').onclick=()=>{show('s3');results()};
function order(){return st.sc.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0])}
function results(){$('rh').textContent='النتائج بعد السؤال '+(st.i+1)+' من '+st.qs.length;const ch=$('chart'),lb=$('lbl');ch.innerHTML='';lb.innerHTML='';
 const mx=Math.max(1000,...st.sc);const ord=order();const rk={};ord.forEach(([s,i],r)=>rk[i]=r+1);
 for(let i=0;i<st.g;i++){const b=document.createElement('div');b.className='bar'+(i==st.last?' win':'');b.innerHTML='<div class="v">0</div><div class="b" style="background:'+GC[i]+'"><span class="rk">#'+rk[i]+'</span></div>';ch.appendChild(b);
  const l=document.createElement('div');l.innerHTML=esc(st.names[i])+(i==st.last?' <span class="star">★</span>':'');lb.appendChild(l);
  setTimeout(()=>{b.querySelector('.b').style.height=(14+80*st.sc[i]/mx)+'%';count(b.querySelector('.v'),st.sc[i])},80+i*90)}
 const r=$('rank');r.innerHTML='';ord.forEach(([s,i],n)=>{const d=document.createElement('div');d.innerHTML='<span>'+(n+1)+'. <span class="dot" style="display:inline-block;background:'+GC[i]+'"></span> '+esc(st.names[i])+'</span><b>'+s+'</b>';r.appendChild(d)});
 $('next').textContent=st.i+1<st.qs.length?'السؤال التالي':'إعلان الفائزين';SND.res()}
function count(el,to){const t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/1000);el.textContent=Math.round(to*k);if(k<1)requestAnimationFrame(f)};f()}
$('next').onclick=()=>{st.i++;if(st.i<st.qs.length){show('s2');ask()}else final()};
// ---------- final
function final(){show('s4');const ord=order();const pd=$('podium');pd.innerHTML='';const pos=[1,0,2];const H=[190,250,140];
 pos.forEach(p=>{if(!ord[p])return;const [s,i]=ord[p];const d=document.createElement('div');d.className='pd p'+(p+1);d.innerHTML='<div class="nm">'+esc(st.names[i])+'</div><div class="sc">'+s+' نقطة</div><div class="blk">'+(p+1)+'</div>';pd.appendChild(d);setTimeout(()=>d.querySelector('.blk').style.height=H[p==0?1:p==1?0:2]+'px',150+p*250)});
 const r=$('frank');r.innerHTML='';ord.forEach(([s,i],n)=>{const d=document.createElement('div');d.innerHTML='<span>'+(n+1)+'. '+esc(st.names[i])+'</span><b>'+s+'</b>';r.appendChild(d)});SND.win();confetti()}
$('again').onclick=()=>{show('s1')};
function confetti(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[];const cols=['#7fb7d6','#9ccf9f','#e9b98c','#b8a4dc','#ec9fae','#e8c56b'];
 for(let i=0;i<120;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,vy:1+Math.random()*2,vx:-.6+Math.random()*1.2,a:Math.random()*6,c:cols[i%6]});
 const t0=performance.now();(function f(){const k=(performance.now()-t0)/1000;x.clearRect(0,0,c.width,c.height);x.globalAlpha=Math.max(0,1-Math.max(0,k-4)/2);
 P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a+k*2)*.4;x.fillStyle=p.c;x.beginPath();x.ellipse(p.x,p.y,p.r,p.r*.6,p.a+k,0,7);x.fill()});if(k<6)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
drawAxes();drawNames();drawQ();
</script></body></html>
