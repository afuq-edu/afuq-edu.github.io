7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: السؤال 2، وكتاب النشاط ص31 (البنود الأولى)، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] فك: (س + 1)²\nالإجابة النموذجية: س² + 2س + 1\n2) [مستوى التطبيق] حل: ص = س + 1 و س² + ص² = 13\nالإجابة النموذجية: 2س² + 2س − 12 = 0 ← س² + س − 6 = 0 ← (2، 3) و (−3، −2)\n3) [مستوى الاستدلال] حل: س − ص = 2 و س² + ص² = 20\nالإجابة النموذجية: س = ص + 2 ← 2ص² + 4ص − 16 = 0 ← ص = 2 أو −4، الحلان (4، 2) و (−2، −4)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: (5 − س)² = 25 − ___ + س²\nالإجابة النموذجية: 10س\n2) [مستوى التطبيق] حل: س + ص = 5 و س² + ص² = 13\nالإجابة النموذجية: 2س² − 10س + 12 = 0 ← (2، 3) و (3، 2)\n3) [مستوى الاستدلال] حل: ص = س − 1 و س² + ص² = 25\nالإجابة النموذجية: 2س² − 2س − 24 = 0 ← س² − س − 12 = 0 ← (4، 3) و (−3، −4)", "للطالب: تمارين 1-5: السؤال 2، وكتاب النشاط ص31 (البنود الأولى) (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «أنظمة تتضمن س² + ص²».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "مسائل حياتية تؤدي إلى معادلات آنية", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يترجم مسألة لفظية إلى معادلتين آنيتين (15 دقيقة)\n2) يحل النظام ويفسر الحلول في سياق المسألة (10 دقائق)\n\nمخرج تعليمي آخر: يصوغ مسألة حياتية يمكن حلها بنظام آني (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم المبني على المشاريع", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "الترجمة الرياضية، المحيط، المساحة، مجموع عددين وحاصل ضربهما، التحقق من السياق.", "يعرض المعلم مخطط أرض زراعية مستطيلة في ولاية نزوى محيطها 22 م ومساحتها 30 م² ويسأل: ما بعداها؟ ويقترح الطالب تسمية الطول س والعرض ص. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى: س + ص = 11 و س ص = 30 ← س² − 11س + 30 = 0 ← البعدان 5 م و 6 م، ويكوّن الطالب المعادلتين ويحل ويتحقق من المحيط والمساحة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل: عددان مجموعهما 16 وحاصل ضربهما 28؛ ومربعان مجموع مساحتيهما 61 سم² ومجموع ضلعيهما 11 سم، وتحل المجموعة: العددان 14 و 2؛ الضلعان 5 و 6 (لأن 25 + 36 = 61) (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. صياغة مسألة: يطلب المعلم من كل طالب صياغة مسألة لفظية تؤدي إلى س + ص = 9 و س ص = 20 (تقويم تكويني)، ويصوغ الطالب المسألة ويتبادلها مع زميله لحلها (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: السؤالان 3 و 4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عددان مجموعهما 16 وحاصل ضربهما 28، اكتب النظام.\nالإجابة النموذجية: س + ص = 16 و س ص = 28\n2) [مستوى التطبيق] حل النظام السابق.\nالإجابة النموذجية: س² − 16س + 28 = 0 ← (س − 14)(س − 2) = 0، العددان 14 و 2\n3) [مستوى الاستدلال] مستطيل محيطه 22 م ومساحته 30 م². أوجد بعديه.\nالإجابة النموذجية: 5 م و 6 م", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: محيط مستطيل بعداه س و ص هو ___\nالإجابة النموذجية: 2(س + ص)\n2) [مستوى التطبيق] عددان الفرق بينهما 3 وحاصل ضربهما 40، أوجدهما (موجبين).\nالإجابة النموذجية: س − ص = 3 ← ص² + 3ص − 40 = 0 ← ص = 5، س = 8\n3) [مستوى الاستدلال] مستطيل قطره 13 سم ومحيطه 34 سم. أوجد بعديه.\nالإجابة النموذجية: س + ص = 17 و س² + ص² = 169 ← البعدان 5 سم و 12 سم", "للطالب: تمارين 1-5: السؤالان 3 و 4 (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "حل تمارين كتاب النشاط ومعالجة الأخطاء الشائعة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل تمارين كتاب النشاط على المعادلات الآنية بدقة (15 دقيقة)\n2) يكتشف الأخطاء الشائعة في حلول جاهزة ويصححها (15 دقيقة)\n\nمخرج تعليمي آخر: يتحقق من صحة الحل بالتعويض في المعادلتين (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات محطات الأخطاء", "التحقق من الحل، الأخطاء الشائعة، التعويض العكسي، الحل الكامل.", "يعرض المعلم حلًا ناقصًا يذكر قيمتي س فقط، ويسأل: هل الحل مكتمل؟ ويجيب الطالب بأن الحل يحتاج قيم ص المقابلة. (5 دقائق)", "1. تعلم ذاتي: يكلف الطلبة بحل تمارين كتاب النشاط ص31 فرديًا، ويقسمهم بحسب المستوى: دعم (أنظمة ص بدلالة س)، متوقع (عزل)، متقدم (س² + ص²)، ويحل الطالب التمارين المناسبة لمستواه، ويستخدم بطاقة مساعدة عند الحاجة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. محطات الأخطاء: يعد المعلم 3 محطات لكل منها حل خاطئ (خطأ في الإشارة، خطأ في فك القوس، نسيان ص)، وتنتقل المجموعات بين المحطات، وتكتشف المجموعة الخطأ في كل محطة وتكتب التصحيح (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مراجعة: يناقش المعلم أبرز الأخطاء ويثبت قاعدة التحقق (تقويم تكويني)، ويدوّن الطالب قاعدة التحقق في دفتره (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تمارين كتاب النشاط ص31، وتمارين 1-5 السؤال 5، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حدد الخطأ: ص = س + 1 و ص = س² − 1 ← س² − س − 2 = 0 ← س = 2 أو س = −1 (انتهى الحل).\nالإجابة النموذجية: الحل ناقص؛ يجب إيجاد ص لكل قيمة: الحلان (2، 3) و (−1، 0).\n2) [مستوى التطبيق] حل: ص = 4 − س و ص = س² − 2\nالإجابة النموذجية: س² + س − 6 = 0 ← (2، 2) و (−3، 7)\n3) [مستوى الاستدلال] تحقق من أن (−3، 7) يحقق المعادلتين السابقتين.\nالإجابة النموذجية: 7 = 4 − (−3) ✓ و 7 = 9 − 2 ✓", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: بعد إيجاد قيم س نعوّض في المعادلة ___ لإيجاد ص.\nالإجابة النموذجية: الخطية\n2) [مستوى التطبيق] حل: ص = س + 4 و ص = س² − 2س\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 8) و (−1، 3)\n3) [مستوى الاستدلال] حل: 2س − ص = 1 و س ص = 3\nالإجابة النموذجية: ص = 2س − 1 ← 2س² − س − 3 = 0 ← (3/2، 2) و (−1، −3)", "للطالب: إكمال تمارين كتاب النشاط ص31، وتمارين 1-5 السؤال 5 (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: متابعة تقدم الابن/الابنة في «حل تمارين كتاب النشاط ومعالجة الأخطاء الشائعة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "التفسير البياني للحل الآني ومراجعة الدرس", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يفسر حل النظام الآني بيانيًا بوصفه نقاط تقاطع المستقيم مع المنحنى (15 دقيقة)\n2) يتحقق من الحل الجبري باستخدام الرسم البياني (10 دقائق)\n\nمخرج تعليمي آخر: يتنبأ بعدد الحلول من الرسم قبل الحل الجبري (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "نقطة التقاطع، التمثيل البياني للنظام، عدد الحلول، التحقق البياني.", "يعرض المعلم على GeoGebra المنحنى ص = س² − 4 والمستقيم ص = 2س − 1 ويسأل: أين يلتقيان؟ قارن بحل الحصة الأولى، ويلاحظ الطالب أن نقطتي التقاطع (3، 5) و (−1، −3) هما الحلان. (5 دقائق)", "1. اكتشاف: يطلب المعلم من المجموعات تحريك المستقيم ص = 2س + ج على GeoGebra وملاحظة تغير عدد نقاط التقاطع، وتسجل المجموعة: نقطتان، نقطة واحدة، لا تقاطع، تمهيدًا للدرس 1-6 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مراجعة: يدير المعلم مراجعة سريعة على أنواع الأنظمة التي درست في الدرس (ص بدلالة س، عزل، س ص، س² + ص²)، ويحل الطالب مثالًا لكل نوع على السبورة الصغيرة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. المعلم: يختار المعلم الدرس 1-5 ومحور «التفسير البياني للحل الآني ومراجعة الدرس»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: مراجعة الدرس: تمارين 1-5 كاملة، والاستعداد للدرس 1-6 بقراءة ص44، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – حديقة في مسقط: يحل كل زوج لغز حديقة مستطيلة في متنزه عام محيطها 20 م ومساحتها 21 م² بالمعادلتين س + ص = 10 و س ص = 21، ثم يقترح سلوكًا يحافظ على المرافق العامة (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ماذا تمثل حلول النظام ص = س + 2 و ص = س² بيانيًا؟\nالإجابة النموذجية: نقطتي تقاطع المستقيم مع المنحنى: (2، 4) و (−1، 1)\n2) [مستوى التطبيق] من الرسم: المستقيم ص = −1 والمنحنى ص = س². كم حلًا للنظام؟\nالإجابة النموذجية: لا حلول، لأن س² ≥ 0 دائمًا والمستقيم تحت المحور.\n3) [مستوى الاستدلال] حل جبريًا: ص = 4 و ص = س² وفسّر بيانيًا.\nالإجابة النموذجية: س = ±2، المستقيم الأفقي يقطع المنحنى في (2، 4) و (−2، 4)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عدد حلول النظام الآني يساوي عدد نقاط ___ بين المستقيم والمنحنى.\nالإجابة النموذجية: التقاطع\n2) [مستوى التطبيق] حل: ص = 2س و ص = س² ثم صف التقاطع بيانيًا.\nالإجابة النموذجية: س² − 2س = 0 ← (0، 0) و (2، 4)، نقطتا تقاطع\n3) [مستوى الاستدلال] حل: ص = 2س − 1 و ص = س² وفسّر النتيجة.\nالإجابة النموذجية: س² − 2س + 1 = 0 ← س = 1 مكرر، حل واحد (1، 1)، المستقيم يمس المنحنى", "للطالب: مراجعة الدرس: تمارين 1-5 كاملة، والاستعداد للدرس 1-6 بقراءة ص44 (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}]}, {"id": "1-6", "title": "التقاطع بين مستقيم ومنحنى الدالة التربيعية", "p": [{"ax": "إيجاد إحداثيات نقاط التقاطع بين مستقيم ومنحنى + استخدام المميّز لتحديد عدد نقاط التقاطع (قاطع، مماس، لا تقاطع)", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يجد إحداثيات نقاط تقاطع مستقيم مع منحنى دالة تربيعية جبريًا (10 دقائق)\n2) يمثل المستقيم والمنحنى بيانيًا ويحدد نقاط التقاطع (5 دقائق)\n3) يستخدم مميّز المعادلة الناتجة لتحديد عدد نقاط التقاطع (5 دقائق)\n4) يميّز بين المستقيم القاطع والمستقيم المماس والمستقيم الذي لا يقطع المنحنى (5 دقائق)\n\nمخرج تعليمي آخر:\nيقارن بين الحل الجبري والحل البياني من حيث الدقة (5 دقائق)\nيجد نقطة التماس عندما يكون المميّز صفرًا (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج الآخر: تقييم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- عروض تقديمية\n- أخرى: ورقة العمل 1\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- أخرى: بطاقات تصنيف", "نقطة التقاطع، المساواة بين الدالتين، الحل الجبري، الحل البياني.، المستقيم القاطع، المماس، نقطة التماس، المميّز، عدد نقاط التقاطع.", "يذكّر المعلم بالحصة الأخيرة من الدرس السابق: ما العلاقة بين حلول النظام الآني ونقاط التقاطع؟ ويجيب الطالب بأن كل حل يمثل نقطة تقاطع. (5 دقائق)", "1. النمذجة: ينمذج المعلم إيجاد تقاطع ص = س² − 3س + 2 و ص = س − 1: س² − 4س + 3 = 0 ← (1، 0) و (3، 2) (المثال 18)، ويعرض الرسم بالعرض التوضيحي (PPT)، ويحل الطالب جبريًا ثم يتحقق من الرسم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم ورقة العمل 1 على المجموعات لإيجاد تقاطع ص = س² و ص = س + 6، و ص = س² − 4 و ص = 3س، وتحل المجموعة: (3، 9) و (−2، 4)؛ (4، 12) و (−1، −3) (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مقارنة: يسأل المعلم: متى يكون الحل البياني غير دقيق؟ (تقويم تكويني)، ويجيب الطالب: عندما تكون الإحداثيات كسرية أو جذرية (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: ينمذج المعلم: ص = س² + 4 و ص = 2س + 3 ← س² − 2س + 1 = 0، المميّز = 0، فالمستقيم مماس عند (1، 5) (المثال 19)، ويحسب الطالب المميّز ويجد نقطة التماس (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تصنيف: يوزع المعلم بطاقات أزواج (مستقيم، منحنى) على المجموعات لتصنيفها: قاطع / مماس / لا يقطع، باستخدام المميّز، وتحسب المجموعة المميّز لكل بطاقة وتصنفها في جدول (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: السؤالان 2 و 3، وكتاب النشاط ص33، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد تقاطع ص = س² و ص = س + 6.\nالإجابة النموذجية: س² − س − 6 = 0 ← (3، 9) و (−2، 4)\n2) [مستوى التطبيق] أوجد تقاطع ص = س² − 4 و ص = 3س.\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 12) و (−1، −3)\n3) [مستوى الاستدلال] لماذا نفضل الحل الجبري على البياني أحيانًا؟\nالإجابة النموذجية: لأنه يعطي قيمًا دقيقة، بينما الرسم يعطي قيمًا تقريبية.\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] حدد عدد نقاط تقاطع ص = س² و ص = 2س − 5.\nالإجابة النموذجية: س² − 2س + 5 = 0، المميّز = 4 − 20 = −16 < 0، لا تقاطع\n5) [مستوى التطبيق] بيّن أن ص = 4س − 4 مماس للمنحنى ص = س².\nالإجابة النموذجية: س² − 4س + 4 = 0، المميّز = 0\n6) [مستوى الاستدلال] أوجد نقطة التماس في السؤال السابق.\nالإجابة النموذجية: س = 2، ص = 4، النقطة (2، 4)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: لإيجاد نقاط التقاطع نساوي ___ بين المعادلتين.\nالإجابة النموذجية: ص\n2) [مستوى التطبيق] أوجد تقاطع ص = س² + 1 و ص = 2س + 4.\nالإجابة النموذجية: س² − 2س − 3 = 0 ← (3، 10) و (−1، 2)\n3) [مستوى الاستدلال] أوجد تقاطع ص = 2س² و ص = 3س + 2.\nالإجابة النموذجية: 2س² − 3س − 2 = 0 ← (2، 8) و (−1/2، 1/2)\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: إذا كان المميّز موجبًا فالمستقيم ___ المنحنى في نقطتين.\nالإجابة النموذجية: يقطع\n5) [مستوى التطبيق] هل المستقيم ص = س + 1 يقطع المنحنى ص = س² + 3؟\nالإجابة النموذجية: س² − س + 2 = 0، المميّز = 1 − 8 = −7 < 0، لا يقطعه\n6) [مستوى الاستدلال] بيّن أن ص = −2س − 1 مماس للمنحنى ص = س² وأوجد نقطة التماس.\nالإجابة النموذجية: س² + 2س + 1 = 0، المميّز = 0، النقطة (−1، 1)", "للطالب: تمارين 1-6: السؤال 1، وكتاب النشاط ص32 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «إيجاد إحداثيات نقاط التقاطع بين مستقيم ومنحنى».\nللطالب: تمارين 1-6: السؤالان 2 و 3، وكتاب النشاط ص33 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «استخدام المميّز لتحديد عدد نقاط التقاطع (قاطع، مماس، لا تقاطع)» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "إيجاد قيم ثابت مجهول بشرط التماس أو عدم التقاطع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يكوّن معادلة تربيعية في س تتضمن ثابتًا مجهولًا من شرط التقاطع (15 دقيقة)\n2) يجد قيم الثابت التي تجعل المستقيم مماسًا أو قاطعًا أو لا يقطع المنحنى (15 دقيقة)\n\nمخرج تعليمي آخر: يفسر النتائج بيانيًا بتحريك المستقيم (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "ثابت مجهول، شرط التماس (المميّز = 0)، شرط التقاطع في نقطتين (المميّز > 0)، شرط عدم التقاطع (المميّز < 0).", "يسأل المعلم: ما قيم ك التي تجعل ك² − 4 = 0؟ وما قيمها التي تجعل ك² − 4 < 0؟ ويجيب الطالب ك = ±2، و −2 < ك < 2. (5 دقائق)", "1. النمذجة: ينمذج المعلم: المستقيم ص = ك س يمس المنحنى ص = س² + 1 ← س² − ك س + 1 = 0 ← ك² − 4 = 0 ← ك = ±2 (المثال 20)، ويتابع الطالب ويتحقق بيانيًا من المماسين (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يقدم المعلم مسألة: ص = س + ك لا يقطع ص = س²؛ وأخرى: ص = 2س + ك يقطع ص = س² − 3 في نقطتين (المثال 21)، وتحل المجموعة: س² − س − ك = 0 ← 1 + 4ك < 0 ← ك < −1/4؛ و س² − 2س − 3 − ك = 0 ← 4 + 4(3 + ك) > 0 ← ك > −4 (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: الأسئلة 4–6، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ك إذا كان ص = س + ك مماسًا للمنحنى ص = س².\nالإجابة النموذجية: س² − س − ك = 0 ← 1 + 4ك = 0 ← ك = −1/4\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل ص = ك س يقطع ص = س² + 4 في نقطتين.\nالإجابة النموذجية: ك² − 16 > 0 ← ك < −4 أو ك > 4\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل ص = 2س + ك لا يقطع ص = س².\nالإجابة النموذجية: س² − 2س − ك = 0 ← 4 + 4ك < 0 ← ك < −1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: شرط أن يكون المستقيم مماسًا للمنحنى هو المميّز = ___\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد ك إذا كان ص = 4س + ك مماسًا للمنحنى ص = س².\nالإجابة النموذجية: 16 + 4ك = 0 ← ك = −4\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل ص = ك س − 1 لا يقطع ص = س².\nالإجابة النموذجية: س² − ك س + 1 = 0 ← ك² − 4 < 0 ← −2 < ك < 2", "للطالب: تمارين 1-6: الأسئلة 4–6 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد قيم ثابت مجهول بشرط التماس أو عدم التقاطع».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "تطبيقات حياتية وتصميمية على تقاطع المستقيم والمنحنى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) ينمذج موقفًا حياتيًا (جسر مقوس، مسار كرة، منحدر) بمستقيم ومنحنى (15 دقيقة)\n2) يحدد نقاط التقاطع ويفسرها في السياق (5 دقائق)\n\nمخرج تعليمي آخر: يصمم شكلًا زخرفيًا بسيطًا باستخدام مستقيم ومنحنى تربيعي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- صورة توضيحية", "النمذجة، المسار، المنحدر، التصميم الهندسي، تفسير نقاط التقاطع.", "يعرض المعلم صورة جسر مقوس فوق طريق مستقيم ويسأل: أين يلتقي القوس بالطريق؟ ويربط الطالب نقاط الالتقاء بنقاط التقاطع. (5 دقائق)", "1. حل مشكلة: يعرض المعلم مسألة: قوس جسر ص = −0.1س² + 2س ومنحدر ص = 0.5س. أين يلتقيان؟ ← 0.1س² − 1.5س = 0 ← س = 0 أو س = 15، النقطة (15، 7.5)، ويحل الطالب ويفسر نقطتي الالتقاء في السياق (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. مشروع مصغر: يكلف كل مجموعة بتصميم شعار بسيط يتكون من منحنى تربيعي ومستقيمين أحدهما مماس، وكتابة معادلاتهم والتحقق جبريًا، وتصمم المجموعة الشعار على GeoGebra وتتحقق من التماس بالمميّز (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: يعرض المعلم أعمال مجموعتين ويطلب تعليق الزملاء (تقويم تكويني)، وتعرض المجموعة وتجيب عن الأسئلة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: كتاب النشاط ص34، وإكمال تصميم الشعار، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد نقاط التقاطع بين ص = −0.1س² + 2س و ص = 0.5س.\nالإجابة النموذجية: (0، 0) و (15، 7.5)\n2) [مستوى التطبيق] ماذا تمثل النقطة (15، 7.5) في السياق؟\nالإجابة النموذجية: نقطة التقاء المنحدر بقوس الجسر على بعد 15 م أفقيًا وارتفاع 7.5 م.\n3) [مستوى الاستدلال] اقترح مستقيمًا أفقيًا يمس المنحنى ص = −0.1س² + 2س.\nالإجابة النموذجية: أعلى نقطة عند س = 10، ص = 10، فالمستقيم ص = 10", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المستقيم الأفقي المماس لقمة القوس يمر بنقطة القيمة ___\nالإجابة النموذجية: العظمى\n2) [مستوى التطبيق] هل يقطع المستقيم ص = 12 القوس ص = −0.1س² + 2س؟\nالإجابة النموذجية: 0.1س² − 2س + 12 = 0، المميّز = 4 − 4.8 < 0، لا يقطعه (القوس أعلاه 10 م).\n3) [مستوى الاستدلال] صمم مستقيمًا يقطع المنحنى ص = س² في نقطتين إحداهما (1، 1)، واكتب معادلته وتحقق.\nالإجابة النموذجية: مثلًا ص = س² و ص = 3س − 2 ← س² − 3س + 2 = 0 ← (1، 1) و (2، 4)", "للطالب: كتاب النشاط ص34، وإكمال تصميم الشعار (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "حل تمارين الدرس وكتاب النشاط", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحل تمارين الدرس 1-6 المتنوعة بدقة (15 دقيقة)\n2) يختار الطريقة المناسبة (حل جبري أم مميّز) بحسب المطلوب (15 دقيقة)\n\nمخرج تعليمي آخر: يقيّم حلول زملائه ويقدم تغذية راجعة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الأقلام", "التقاطع، المماس، المميّز، اختيار الاستراتيجية، التغذية الراجعة بين الأقران.", "يطرح المعلم سؤال تمييز: «أوجد نقاط التقاطع» و«أوجد عدد نقاط التقاطع»؛ ما الفرق في طريقة الحل؟ ويوضح الطالب أن الأول يحتاج حلًا كاملًا والثاني يكفيه المميّز. (5 دقائق)", "1. تعلم ذاتي: يكلف الطلبة بتمارين 1-6 المتبقية مع تدرج المستويات، ويتابع المتعثرين في مجموعة صغيرة، ويحل الطالب فرديًا وفق مستواه (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تقييم الأقران: يتبادل الطلبة الدفاتر ويصحح كل منهم حل زميله وفق نموذج إجابة معروض، ويصحح الطالب ويكتب ملاحظة بنّاءة (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تمارين 1-6، والبدء بتمارين مراجعة نهاية الوحدة ص50–51، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] كم نقطة تقاطع بين ص = 3س + 1 و ص = س² + س + 2؟\nالإجابة النموذجية: س² − 2س + 1 = 0، المميّز = 0، نقطة واحدة (1، 4)\n2) [مستوى التطبيق] أوجد نقاط تقاطع ص = 5 − س و ص = س² − 1.\nالإجابة النموذجية: س² + س − 6 = 0 ← (2، 3) و (−3، 8)\n3) [مستوى الاستدلال] أوجد ك إذا كان ص = س + ك مماسًا للمنحنى ص = س² + 3س.\nالإجابة النموذجية: س² + 2س − ك = 0 ← 4 + 4ك = 0 ← ك = −1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: سؤال «كم نقطة تقاطع؟» يكفي فيه حساب ___\nالإجابة النموذجية: المميّز\n2) [مستوى التطبيق] أوجد نقاط تقاطع ص = 2س + 3 و ص = س² .\nالإجابة النموذجية: س² − 2س − 3 = 0 ← (3، 9) و (−1، 1)\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل ص = ك يقطع ص = س² − 6س في نقطتين.\nالإجابة النموذجية: س² − 6س − ك = 0 ← 36 + 4ك > 0 ← ك > −9", "للطالب: إكمال تمارين 1-6، والبدء بتمارين مراجعة نهاية الوحدة ص50–51 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: متابعة تقدم الابن/الابنة في «حل تمارين الدرس وكتاب النشاط» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "مراجعة الوحدة الأولى (تمارين مراجعة نهاية الوحدة)", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يربط بين مفاهيم الوحدة: التحليل، القيم العظمى والصغرى، المتباينات، المميّز، التقاطع (10 دقائق)\n2) يحل أسئلة مراجعة متنوعة من نهاية الوحدة وكتاب النشاط (20 دقيقة)\n\nمخرج تعليمي آخر: يحدد نقاط قوته وضعفه في الوحدة ويضع خطة لمعالجتها (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "خريطة مفاهيم الوحدة، الدالة التربيعية، المميّز، المتباينة، التقاطع، التقويم الذاتي.", "يعرض المعلم خريطة مفاهيم ناقصة للوحدة على السبورة الذكية ويطلب إكمالها جماعيًا، ويكمل الطالب الخريطة بالمفاهيم والأمثلة. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص50–54 على المجموعات بحيث تأخذ كل مجموعة محورًا، وتحل المجموعة محورها وتجهز شرحًا موجزًا (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: تعرض كل مجموعة حلًا واحدًا لسؤال مميز، ويعلّق المعلم على الدقة والمصطلحات، وتشرح المجموعة وتجيب عن أسئلة زملائها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تقويم ذاتي: يوزع المعلم بطاقة تقويم ذاتي بعبارات «أستطيع أن...» لكل درس (تقويم تكويني)، ويقيم الطالب نفسه ويحدد الدروس التي يحتاج مراجعتها (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-6 ومحور «مراجعة الوحدة الأولى (تمارين مراجعة نهاية الوحدة)»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص50–54، وكتاب النشاط ص35–38، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n6. غلق الدرس – طريق فوق الوادي: تجد المجموعات نقاط تقاطع مستقيم يمثل طريقًا مع منحنى تربيعي يمثل مقطع وادٍ، ثم تناقش قاعدة السلامة الوطنية بعدم عبور الأودية أثناء جريانها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: س² − 7س + 10 = 0\nالإجابة النموذجية: س = 2 أو س = 5\n2) [مستوى التطبيق] أوجد قيمة ك التي تجعل س² + ك س + 16 = 0 لها جذران متساويان.\nالإجابة النموذجية: ك = ±8\n3) [مستوى الاستدلال] حل: س² − 7س + 10 > 0\nالإجابة النموذجية: س < 2 أو س > 5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: نقطة الصغرى للدالة د(س) = (س − 2)(س − 6) تقع عند س = ___\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد نقاط تقاطع ص = س² − 2س و ص = س + 4.\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 8) و (−1، 3)\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل المستقيم ص = ك س − 9 مماسًا للمنحنى ص = س².\nالإجابة النموذجية: س² − ك س + 9 = 0 ← ك² − 36 = 0 ← ك = ±6", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص50–54، وكتاب النشاط ص35–38 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}]}, {"id": "2-1", "title": "تعريف الدوال ومجالها ومداها", "p": [{"ax": "العلاقة والدالة وأنواع التطابق واختبار المستقيم الرأسي", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يميّز الدالة من العلاقة باستخدام المخطط السهمي واختبار المستقيم الرأسي (15 دقيقة)\n2) يصنف العلاقات: واحد إلى واحد، متعدد إلى واحد، واحد إلى متعدد، متعدد إلى متعدد (10 دقائق)\nمخرج تعليمي آخر: يستخدم اختبار المستقيم الأفقي للحكم على الدالة واحد إلى واحد (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "العلاقة، الدالة، المجال، المجال المقابل، واحد إلى واحد، متعدد إلى واحد، واحد إلى متعدد، متعدد إلى متعدد، اختبار المستقيم الرأسي، اختبار المستقيم الأفقي.", "يعرض المعلم جدولًا يربط كل طالب برقم مقعده، وآخر يربط كل طالب بهواياته، ويسأل: أي ربط يعطي ناتجًا واحدًا فقط لكل طالب؟ ويقارن الطالب بين الربطين ويستنتج فكرة «الناتج الوحيد». (5 دقائق)", "1. النمذجة: يعرّف المعلم الدالة بأنها علاقة تربط كل عنصر في المجال بعنصر واحد فقط في المجال المقابل، ويعرض مخططات سهمية للأنواع الأربعة (المثالان 1 و 2)، ويصنف الطالب المخططات السهمية المعروضة ويبرر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يعرض المعلم على GeoGebra منحنيات (مستقيم، قطع مكافئ، دائرة) ويطبق اختبار المستقيم الرأسي ثم الأفقي، ويحكم الطالب على كل منحنى: الدائرة ليست دالة، والقطع المكافئ دالة متعدد إلى واحد، والمستقيم المائل دالة واحد إلى واحد (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بالسؤال 1 من تمارين 2-1 (تقويم تكويني)، ويصنف الطالب العلاقات ويقارن مع زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: السؤالان 1 و 2، وكتاب النشاط ص39–40، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل العلاقة {(1، 2)، (2، 3)، (1، 4)} دالة؟ فسّر.\nالإجابة النموذجية: ليست دالة لأن العنصر 1 ارتبط بعنصرين 2 و 4.\n2) [مستوى التطبيق] ما نوع الدالة ص = س²، س ∈ ح؟\nالإجابة النموذجية: متعدد إلى واحد؛ لأن 2 و −2 لهما الصورة نفسها 4.\n3) [مستوى الاستدلال] هل الدائرة س² + ص² = 9 تمثل دالة؟\nالإجابة النموذجية: لا؛ المستقيم الرأسي س = 0 يقطعها في نقطتين.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الدالة التي يقطع منحناها أي مستقيم أفقي في نقطة واحدة على الأكثر تسمى دالة ___\nالإجابة النموذجية: واحد إلى واحد\n2) [مستوى التطبيق] صنف: ص = 2س + 3\nالإجابة النموذجية: دالة واحد إلى واحد\n3) [مستوى الاستدلال] ارسم مخططًا سهميًا لعلاقة متعدد إلى متعدد وبيّن لماذا ليست دالة.\nالإجابة النموذجية: عنصر في المجال يرتبط بعنصرين على الأقل، فهي ليست دالة.", "للطالب: تمارين 2-1: السؤالان 1 و 2، وكتاب النشاط ص39–40 (كتاب الطالب ص55–66، كتاب النشاط ص39–44).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «العلاقة والدالة وأنواع التطابق واختبار المستقيم الرأسي».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=7"]}, {"ax": "مجال ومدى الدوال الخطية والتربيعية ذات المجال المحدد", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يستخدم رمز الدالة د(س) لحساب صور عناصر المجال (5 دقائق)\n2) يحدد مدى دالة خطية أو تربيعية مجالها محدد (20 دقيقة)\nمخرج تعليمي آخر: يستعين بالتمثيل البياني لتحديد المدى بدقة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني", "رمز الدالة د(س)، الصورة، المجال المحدد، المدى، القيمة العظمى والصغرى ضمن المجال.", "يطرح المعلم: إذا كان د(س) = 2س + 1 فأوجد د(3) و د(−1)، ويعوض الطالب فيجد 7 و −1. (5 دقائق)", "1. النمذجة: ينمذج المعلم: د(س) = 2س + 1، −1 ≤ س ≤ 3 ← المدى −1 ≤ د(س) ≤ 7 لأن الدالة متزايدة (المثال 3)، ويمثل الطالب الدالة بيانيًا ويقرأ المدى من المحور الصادي (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم دوال تربيعية: د(س) = س² − 4س، س ∈ ح، و د(س) = س²، −2 ≤ س ≤ 3 (المثالان 4 و 5)، وتحدد المجموعة: الأولى نقطة صغرى (2، −4) فالمدى د(س) ≥ −4؛ الثانية المدى 0 ≤ د(س) ≤ 9 (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحليل خطأ: يعرض المعلم خطأ: مدى س² عندما −2 ≤ س ≤ 3 هو 4 ≤ د(س) ≤ 9، ويطلب التصحيح (تقويم تكويني)، ويصحح الطالب: أصغر قيمة 0 عند س = 0 (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: الأسئلة 3–5، وكتاب النشاط ص41–42، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د(−2) إذا كان د(س) = س² − 3س.\nالإجابة النموذجية: 4 + 6 = 10\n2) [مستوى التطبيق] أوجد مدى د(س) = 3 − س، 0 ≤ س ≤ 5.\nالإجابة النموذجية: −2 ≤ د(س) ≤ 3\n3) [مستوى الاستدلال] أوجد مدى د(س) = س² + 2، −1 ≤ س ≤ 2.\nالإجابة النموذجية: 2 ≤ د(س) ≤ 6", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مدى د(س) = 2س + 1 عندما 0 ≤ س ≤ 4 هو ___ ≤ د(س) ≤ ___\nالإجابة النموذجية: 1 و 9\n2) [مستوى التطبيق] أوجد مدى د(س) = س² − 6س + 5، س ∈ ح.\nالإجابة النموذجية: الجذران 1 و 5، الصغرى عند س = 3: د(3) = −4، المدى د(س) ≥ −4\n3) [مستوى الاستدلال] أوجد مدى د(س) = (س − 1)²، −2 ≤ س ≤ 2.\nالإجابة النموذجية: أصغر قيمة 0 عند س = 1، وأكبرها 9 عند س = −2، المدى 0 ≤ د(س) ≤ 9", "للطالب: تمارين 2-1: الأسئلة 3–5، وكتاب النشاط ص41–42 (كتاب الطالب ص55–66، كتاب النشاط ص39–44).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مجال ومدى الدوال الخطية والتربيعية ذات المجال المحدد» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=7"]}, {"ax": "مجال ومدى الدوال التبادلية والجذرية وتطبيقات حياتية", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يحدد مجال الدالة التبادلية بإبعاد القيم التي تجعل المقام صفرًا (5 دقائق)\n2) يحدد مجال الدالة الجذرية ومداها (10 دقائق)\nمخرج تعليمي آخر: يفسر المجال والمدى في سياق حياتي (تكلفة، زمن) (25 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الدالة التبادلية، الدالة الجذرية، القيم المستبعدة من المجال، المدى في السياق.", "يسأل المعلم: لماذا لا نستطيع حساب 1 ÷ 0؟ وما قيمة √(−4) في الأعداد الحقيقية؟ ويستنتج الطالب أن القسمة على الصفر غير معرفة، وأن الجذر التربيعي لعدد سالب غير حقيقي. (5 دقائق)", "1. النمذجة: ينمذج المعلم: د(س) = 1 ÷ (س − 2): المجال س ≠ 2، المدى د(س) ≠ 0؛ و هـ(س) = √(س − 3): المجال س ≥ 3، المدى هـ(س) ≥ 0، ويتابع الطالب ويطبق على د(س) = 3 ÷ (س + 1) (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يعرض المعلم مسألة: تكلفة رحلة مدرسية لكل طالب ت(ن) = 120 ÷ ن ريال حيث ن عدد الطلبة من 10 إلى 40؛ يطلب المجال والمدى وتفسيرهما، ويحدد الطالب المجال 10 ≤ ن ≤ 40 والمدى 3 ≤ ت ≤ 12 ويفسر: كلما زاد العدد قلت التكلفة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق فردي: يكلف المعلم بتمارين كتاب النشاط ص43–44 (تقويم تكويني)، ويحل الطالب فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 2-1 ومحور «مجال ومدى الدوال التبادلية والجذرية وتطبيقات حياتية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-1: الأسئلة 6–9، وكتاب النشاط ص43–44، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. غلق الدرس – دالة الولاية والمحافظة: ترسم المجموعات مخططًا سهميًا يربط ولايات (نزوى، بهلا، صور، صلالة، صحار) بمحافظاتها، وتقرر هل هو دالة ونوعها، ثم تعكس الاتجاه وتختبر هل يبقى دالة (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما مجال د(س) = 5 ÷ (س + 4)؟\nالإجابة النموذجية: س ≠ −4\n2) [مستوى التطبيق] ما مجال ومدى د(س) = √(س − 1)؟\nالإجابة النموذجية: المجال س ≥ 1، المدى د(س) ≥ 0\n3) [مستوى الاستدلال] ت(ن) = 120 ÷ ن، 10 ≤ ن ≤ 40. أوجد المدى.\nالإجابة النموذجية: 3 ≤ ت(ن) ≤ 12", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مجال الدالة د(س) = 1 ÷ (س − 7) هو جميع الأعداد الحقيقية ما عدا ___\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] أوجد مجال ومدى د(س) = √(س + 2) + 1.\nالإجابة النموذجية: المجال س ≥ −2، المدى د(س) ≥ 1\n3) [مستوى الاستدلال] لماذا نقيد المجال في دالة التكلفة بأعداد صحيحة موجبة؟\nالإجابة النموذجية: لأن عدد الطلبة عدد صحيح موجب لا يكون كسرًا أو سالبًا.", "للطالب: تمارين 2-1: الأسئلة 6–9، وكتاب النشاط ص43–44 (كتاب الطالب ص55–66، كتاب النشاط ص39–44).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «مجال ومدى الدوال التبادلية والجذرية وتطبيقات حياتية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=7"]}]}, {"id": "2-2", "title": "الدوال المركّبة", "p": [{"ax": "معنى تركيب دالتين وحساب قيمة عددية للدالة المركّبة", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يفسر الدالة المركّبة هـ(د(س)) بوصفها تطبيق د أولًا ثم هـ (15 دقيقة)\n2) يحسب قيمة عددية لدالة مركّبة (15 دقيقة)\nمخرج تعليمي آخر: يستنتج أن تركيب الدوال ليس إبداليًا بوجه عام (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات الآلات", "الدالة المركّبة، ترتيب التركيب، الدالة الداخلية، الدالة الخارجية، عدم الإبدال.", "يمثل المعلم «آلتين»: الأولى تضرب في 2 وتضيف 1، والثانية تربّع. يدخل العدد 3 في الأولى ثم الناتج في الثانية، ويسأل: ما الناتج النهائي؟ ويحسب الطالب: 3 ← 7 ← 49. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 1» ص67 لتطبيق الآلتين بترتيبين مختلفين على أعداد متعددة، ويسجل الطالب النتائج ويلاحظ اختلافها باختلاف الترتيب (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = 2س + 1، هـ(س) = س²: هـ(د(3)) = هـ(7) = 49، د(هـ(3)) = د(9) = 19 (المثال 6)، ويحسب الطالب قيمًا أخرى ويقارن (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-2: السؤال 1، وكتاب النشاط ص45، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] إذا كان د(س) = س + 3 و هـ(س) = 2س فأوجد هـ(د(1)).\nالإجابة النموذجية: د(1) = 4، هـ(4) = 8\n2) [مستوى التطبيق] أوجد د(هـ(1)) للدالتين السابقتين.\nالإجابة النموذجية: هـ(1) = 2، د(2) = 5\n3) [مستوى الاستدلال] هل هـ(د(1)) = د(هـ(1))؟ ماذا تستنتج؟\nالإجابة النموذجية: لا (8 ≠ 5)، التركيب ليس إبداليًا.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في هـ(د(س)) نطبق الدالة ___ أولًا.\nالإجابة النموذجية: د\n2) [مستوى التطبيق] د(س) = س² − 1، هـ(س) = 3س. أوجد د(هـ(2)).\nالإجابة النموذجية: هـ(2) = 6، د(6) = 35\n3) [مستوى الاستدلال] للدالتين السابقتين أوجد هـ(د(2)).\nالإجابة النموذجية: د(2) = 3، هـ(3) = 9", "للطالب: تمارين 2-2: السؤال 1، وكتاب النشاط ص45 (كتاب الطالب ص67–72، كتاب النشاط ص45–46).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=8"]}, {"ax": "إيجاد صيغة الدالة المركّبة ومجالها", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يكتب صيغة الدالة المركّبة جبريًا (15 دقيقة)\n2) يحدد مجال الدالة المركّبة في حالات بسيطة (جذرية، نسبية) (15 دقيقة)\nمخرج تعليمي آخر: يجد تركيب الدالة مع نفسها د(د(س)) (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "صيغة الدالة المركّبة، التعويض بعبارة، مجال الدالة المركّبة، تركيب الدالة مع نفسها.", "يطلب المعلم التعويض بالعبارة (2س + 1) مكان س في س² ثم فكّها، ويكتب الطالب (2س + 1)² = 4س² + 4س + 1. (5 دقائق)", "1. النمذجة: ينمذج المعلم: هـ(د(س)) = (2س + 1)² = 4س² + 4س + 1، د(هـ(س)) = 2س² + 1، د(د(س)) = 2(2س + 1) + 1 = 4س + 3 (المثالان 7 و 8)، ويتابع الطالب ويكتب الصيغ (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على، والطالب: د(س) = √س و هـ(س) = س − 4، ويطلب د(هـ(س)) ومجالها، ثم د(س) = 1 ÷ س و هـ(س) = س + 2 (المثال 9). تكتب المجموعة: √(س − 4) بمجال س ≥ 4؛ و 1 ÷ (س + 2) بمجال س ≠ −2 (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-2: السؤالان 2 و 3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] د(س) = س + 2، هـ(س) = س². أوجد هـ(د(س)).\nالإجابة النموذجية: (س + 2)² = س² + 4س + 4\n2) [مستوى التطبيق] أوجد د(هـ(س)) للدالتين السابقتين.\nالإجابة النموذجية: س² + 2\n3) [مستوى الاستدلال] أوجد د(د(س)) إذا كان د(س) = 3س − 1.\nالإجابة النموذجية: 3(3س − 1) − 1 = 9س − 4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان د(س) = 2س و هـ(س) = س + 5 فإن هـ(د(س)) = ___\nالإجابة النموذجية: 2س + 5\n2) [مستوى التطبيق] د(س) = √س، هـ(س) = س + 1. أوجد د(هـ(س)) ومجالها.\nالإجابة النموذجية: √(س + 1)، المجال س ≥ −1\n3) [مستوى الاستدلال] د(س) = 1 ÷ س، هـ(س) = 2س − 6. أوجد د(هـ(س)) ومجالها.\nالإجابة النموذجية: 1 ÷ (2س − 6)، المجال س ≠ 3", "للطالب: تمارين 2-2: السؤالان 2 و 3 (كتاب الطالب ص67–72، كتاب النشاط ص45–46).\nلولي الأمر: متابعة تقدم الابن/الابنة في «إيجاد صيغة الدالة المركّبة ومجالها» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=8"]}, {"ax": "حل معادلات تتضمن دوالًا مركّبة وتطبيقات حياتية", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يحل معادلات تتضمن دالة مركّبة (20 دقيقة)\n2) ينمذج موقفًا حياتيًا متعدد المراحل بدالة مركّبة (10 دقائق)\nمخرج تعليمي آخر: يقيّم صحة ترتيب التركيب في موقف حياتي (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "معادلة الدالة المركّبة، النمذجة متعددة المراحل، الخصم، تحويل العملات.", "يسأل المعلم: متجر يخصم 10% ثم يضيف رسوم توصيل 2 ريال. هل يختلف السعر لو أضاف الرسوم أولًا ثم خصم؟ ويتوقع الطالب ويحسب لسعر 50 ريالًا: 47 مقابل 46.8. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل معادلة: د(س) = 2س + 1، هـ(س) = س²: د(هـ(س)) = 19 ← 2س² + 1 = 19 ← س = ±3، ويحل الطالب معادلة مشابهة: هـ(د(س)) = 25 ← 2س + 1 = ±5 ← س = 2 أو س = −3 (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يقدم المعلم مسألة المتجر: خ(س) = 0.9س، ر(س) = س + 2، ويطلب ر(خ(س)) و خ(ر(س)) وتفسير الفرق، وتكتب المجموعة: ر(خ(س)) = 0.9س + 2، خ(ر(س)) = 0.9س + 1.8، والثاني أوفر للزبون (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق فردي: يكلف المعلم بتمارين كتاب النشاط ص46 (تقويم تكويني)، ويحل الطالب فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 2-2 ومحور «حل معادلات تتضمن دوالًا مركّبة وتطبيقات حياتية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-2: الأسئلة 4–6، وكتاب النشاط ص46، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. غلق الدرس – من النخلة إلى السوق: تصمم المجموعات دالتين لرحلة التمر العماني: د تحسب الوزن بعد الفرز، وهـ تحسب الثمن بالبيسة، ثم تحسب هـ(د(س)) لقيمة معينة وتشرح ترتيب التطبيق (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] د(س) = س − 1، هـ(س) = س². حل هـ(د(س)) = 16.\nالإجابة النموذجية: (س − 1)² = 16 ← س = 5 أو س = −3\n2) [مستوى التطبيق] للدالتين السابقتين حل د(هـ(س)) = 8.\nالإجابة النموذجية: س² − 1 = 8 ← س = ±3\n3) [مستوى الاستدلال] ر(خ(50)) في مسألة المتجر؟\nالإجابة النموذجية: خ(50) = 45، ر(45) = 47 ريالًا", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان د(هـ(س)) = 2س² + 1 = 9 فإن س = ___\nالإجابة النموذجية: ±2\n2) [مستوى التطبيق] د(س) = 3س، هـ(س) = س + 4. حل د(هـ(س)) = 21.\nالإجابة النموذجية: 3(س + 4) = 21 ← س = 3\n3) [مستوى الاستدلال] أيهما أوفر للزبون في مسألة المتجر لسعر 100 ريال؟\nالإجابة النموذجية: ر(خ(100)) = 92، خ(ر(100)) = 91.8، الثاني أوفر.", "للطالب: تمارين 2-2: الأسئلة 4–6، وكتاب النشاط ص46 (كتاب الطالب ص67–72، كتاب النشاط ص45–46).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=8"]}]}, {"id": "2-3", "title": "الدوال العكسية", "p": [{"ax": "شرط وجود الدالة العكسية وإيجاد معكوس الدالة الخطية", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يذكر شرط وجود الدالة العكسية (أن تكون الدالة واحدًا إلى واحد) (15 دقيقة)\n2) يجد الدالة العكسية لدالة خطية بتبديل س و ص ثم جعل ص موضوعًا (15 دقيقة)\nمخرج تعليمي آخر: يتحقق من أن د(د⁻¹(س)) = س (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الدالة العكسية د⁻¹، الدالة واحد إلى واحد، تبديل المتغيرين، مجال المعكوس يساوي مدى الدالة.", "يطرح المعلم: «أضف 3 ثم اضرب في 2» أعطت 14. ما العدد الأصلي؟ وما العمليات التي استخدمتها للرجوع؟ ويعكس الطالب العمليات وترتيبها: يقسم على 2 ثم يطرح 3 فيجد 4. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 2» ص73، ويطلب كتابة «آلة عكسية» لكل آلة معطاة، ويكتشف الطالب أن العمليات تعكس بترتيب معاكس (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = 3س − 2 ← ص = 3س − 2 ← س = 3ص − 2 ← ص = (س + 2) ÷ 3، إذن د⁻¹(س) = (س + 2) ÷ 3، ويتحقق: د(د⁻¹(س)) = س (المثال 10)، ويطبق الطالب على د(س) = 5 − 2س (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-3: السؤال 1، وكتاب النشاط ص47، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د⁻¹(س) إذا كان د(س) = س + 7.\nالإجابة النموذجية: د⁻¹(س) = س − 7\n2) [مستوى التطبيق] أوجد د⁻¹(س) إذا كان د(س) = 5 − 2س.\nالإجابة النموذجية: د⁻¹(س) = (5 − س) ÷ 2\n3) [مستوى الاستدلال] تحقق من أن د(د⁻¹(س)) = س للدالة د(س) = 3س − 2.\nالإجابة النموذجية: د((س + 2) ÷ 3) = 3 × (س + 2) ÷ 3 − 2 = س", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: شرط وجود الدالة العكسية أن تكون الدالة ___\nالإجابة النموذجية: واحدًا إلى واحد\n2) [مستوى التطبيق] أوجد د⁻¹(س) إذا كان د(س) = 4س + 1.\nالإجابة النموذجية: (س − 1) ÷ 4\n3) [مستوى الاستدلال] أوجد د⁻¹(9) إذا كان د(س) = 4س + 1.\nالإجابة النموذجية: (9 − 1) ÷ 4 = 2", "للطالب: تمارين 2-3: السؤال 1، وكتاب النشاط ص47 (كتاب الطالب ص73–78، كتاب النشاط ص47–48).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «شرط وجود الدالة العكسية وإيجاد معكوس الدالة الخطية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=9"]}, {"ax": "معكوس الدوال التربيعية بتقييد المجال والدوال الجذرية والنسبية", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يقيد مجال الدالة التربيعية لتصبح واحدًا إلى واحد ثم يجد معكوسها (5 دقائق)\n2) يجد معكوس دوال جذرية ونسبية بسيطة (15 دقيقة)\nمخرج تعليمي آخر: يحدد مجال الدالة العكسية من مدى الدالة الأصلية (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "تقييد المجال، الجذر التربيعي الموجب، الدالة النسبية، مجال المعكوس ومداه.", "يسأل المعلم: كيف نجعل د(س) = س² دالة واحد إلى واحد؟ ويقترح الطالب أخذ جزء المنحنى عندما س ≥ 0. (5 دقائق)", "1. النمذجة: ينمذج المعلم: د(س) = س² + 1، س ≥ 0 ← د⁻¹(س) = √(س − 1)، مجالها س ≥ 1 (مدى د) (المثال 11)، ويتابع الطالب ويطبق على د(س) = (س − 2)²، س ≥ 2 ← د⁻¹(س) = √س + 2 (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم: د(س) = 1 ÷ (س − 2)، س ≠ 2؛ و د(س) = √(س + 3)، س ≥ −3، وتجد المجموعة: د⁻¹(س) = 1 ÷ س + 2، س ≠ 0؛ و د⁻¹(س) = س² − 3، س ≥ 0 (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-3: السؤالان 2 و 3، وكتاب النشاط ص48، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د⁻¹(س) إذا كان د(س) = س² − 5، س ≥ 0.\nالإجابة النموذجية: √(س + 5)، س ≥ −5\n2) [مستوى التطبيق] أوجد د⁻¹(س) إذا كان د(س) = 2 ÷ (س + 1).\nالإجابة النموذجية: 2 ÷ س − 1، س ≠ 0\n3) [مستوى الاستدلال] ما مجال د⁻¹ إذا كان مدى د هو د(س) ≥ 3؟\nالإجابة النموذجية: س ≥ 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مجال الدالة العكسية يساوي ___ الدالة الأصلية.\nالإجابة النموذجية: مدى\n2) [مستوى التطبيق] أوجد د⁻¹(س) إذا كان د(س) = √(س − 4)، س ≥ 4.\nالإجابة النموذجية: س² + 4، س ≥ 0\n3) [مستوى الاستدلال] أوجد د⁻¹(س) إذا كان د(س) = (س + 3)² − 1، س ≥ −3.\nالإجابة النموذجية: √(س + 1) − 3، س ≥ −1", "للطالب: تمارين 2-3: السؤالان 2 و 3، وكتاب النشاط ص48 (كتاب الطالب ص73–78، كتاب النشاط ص47–48).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «معكوس الدوال التربيعية بتقييد المجال والدوال الجذرية والنسبية» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=9"]}, {"ax": "الدالة العكسية لنفسها وتطبيقات حياتية على الدوال العكسية", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يتعرف الدالة العكسية لنفسها ويتحقق من خاصيتها (10 دقائق)\n2) يستخدم الدالة العكسية لتحويل الصيغ في مواقف حياتية (درجات الحرارة، العملات) (15 دقيقة)\nمخرج تعليمي آخر: يصمم «رمزًا سريًا» بدالة ويحدد دالة فك الرمز (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الدالة العكسية لنفسها، تحويل الصيغ، التشفير وفك التشفير، الدالة المحايدة.", "يسأل المعلم: ما معكوس عملية «اطرح العدد من 5»؟ ويكتشف الطالب أن العملية تعكس نفسها: 5 − (5 − س) = س. (5 دقائق)", "1. النمذجة: ينمذج المعلم: د(س) = 5 − س و د(س) = 1 ÷ س دالتان عكسيتان لنفسيهما، لأن د(د(س)) = س، ويتحقق الطالب بالتعويض ويبحث عن مثال ثالث مثل د(س) = −س (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يعرض المعلم صيغة تحويل الحرارة ف = 1.8م + 32 ويطلب الدالة العكسية وتحويل 104° ف إلى مئوية، ويجد الطالب م = (ف − 32) ÷ 1.8، و 104° ف = 40° م (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تشفير: يطلب المعلم من كل زوج تشفير عدد بدالة خطية يختارها وتبادلها لفك التشفير بالمعكوس (تقويم تكويني)، ويشفر الطالب ويفك التشفير ويتحقق (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. المعلم: يختار المعلم الدرس 2-3 ومحور «الدالة العكسية لنفسها وتطبيقات حياتية على الدوال العكسية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-3: الأسئلة 4–6، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – الشيفرة العمانية: تختار كل مجموعة رقم ولاية من قائمة مرقمة وتشفّره بالدالة د(س) = 2س + 3، فتفك المجموعة الأخرى الشيفرة بالدالة العكسية وتذكر معلومة عن تلك الولاية (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بيّن أن د(س) = 7 − س دالة عكسية لنفسها.\nالإجابة النموذجية: د(د(س)) = 7 − (7 − س) = س\n2) [مستوى التطبيق] حوّل 40° م إلى فهرنهايت.\nالإجابة النموذجية: ف = 1.8 × 40 + 32 = 104°\n3) [مستوى الاستدلال] أوجد المعكوس لـ: ريال = 2.6 × دولار.\nالإجابة النموذجية: دولار = ريال ÷ 2.6", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان د(د(س)) = س فإن د دالة عكسية لـ ___\nالإجابة النموذجية: نفسها\n2) [مستوى التطبيق] حوّل 212° ف إلى مئوية.\nالإجابة النموذجية: م = (212 − 32) ÷ 1.8 = 100°\n3) [مستوى الاستدلال] شُفّر عدد بالدالة د(س) = 3س + 4 فأصبح 25. ما العدد الأصلي؟\nالإجابة النموذجية: د⁻¹(25) = (25 − 4) ÷ 3 = 7", "للطالب: تمارين 2-3: الأسئلة 4–6 (كتاب الطالب ص73–78، كتاب النشاط ص47–48).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «الدالة العكسية لنفسها وتطبيقات حياتية على الدوال العكسية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=9"]}]}, {"id": "2-4", "title": "منحنى الدالة ومنحنى دالتها العكسية", "p": [{"ax": "انعكاس منحنى الدالة في المستقيم ص = س + رسم منحنى الدالة التربيعية والجذرية المقيدتين ومعكوسهما ونقاط التقاطع", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يبيّن أن منحنى د⁻¹ هو انعكاس منحنى د في المستقيم ص = س (10 دقائق)\n2) يرسم منحنى الدالة العكسية لدالة خطية بعكس إحداثيات النقاط (10 دقائق)\n3) يرسم منحنى دالة تربيعية مقيدة المجال ومنحنى معكوسها (5 دقائق)\n4) يجد نقاط تقاطع الدالة مع معكوسها بحل د(س) = س (5 دقائق)\n\nمخرج تعليمي آخر:\nيستنتج أن النقطة (أ، ب) على د تقابلها (ب، أ) على د⁻¹ (5 دقائق)\nيفسر سبب وقوع نقاط تقاطع د و د⁻¹ (المتزايدة) على المستقيم ص = س (5 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- أخرى: ورق مربعات ومرآة", "الانعكاس، خط الانعكاس ص = س، تبديل الإحداثيات، التماثل.، منحنى الجذر التربيعي، تقييد المجال، نقطة التقاطع على ص = س.", "يعرض المعلم مرآة على ورقة مربعات ويضع نقطة (1، 3) ويسأل: أين صورتها في المستقيم ص = س؟ ويتوقع الطالب الصورة (3، 1). (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 3» ص79، ويطلب رسم د(س) = 2س + 1 ومعكوسها والمستقيم ص = س على ورقة واحدة وطيها على ص = س، ويلاحظ الطالب انطباق المنحنيين عند الطي (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم الرسم بعكس الإحداثيات: (0، 1) ← (1، 0)، (1، 3) ← (3، 1) (المثال 12)، ويستخدم GeoGebra للتأكيد، ويرسم الطالب معكوس د(س) = 3س − 3 بالطريقة نفسها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. النمذجة: ينمذج المعلم: د(س) = س² − 2، س ≥ 0، ومعكوسها √(س + 2)، ويجد تقاطعهما من س² − 2 = س ← (س − 2)(س + 1) = 0 ← (2، 2) بعد رفض −1 (المثال 13)، ويرسم الطالب المنحنيين ويحدد نقطة التقاطع (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعلم تعاوني: يوزع المعلم دوالًا مقيدة على، والطالب: د(س) = س² − 12، س ≥ 0؛ د(س) = س² + 2، س ≥ 0. ترسم المجموعة الدالة ومعكوسها وتبحث عن التقاطع: الأولى س² − س − 12 = 0 ← (4، 4) بعد رفض −3، والثانية لا تقاطع لأن س² − س + 2 = 0 مميّزها سالب (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-4: الأسئلة 3–5، وكتاب النشاط ص51–52، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما خط الانعكاس بين منحنى الدالة ومعكوسها؟\nالإجابة النموذجية: المستقيم ص = س\n2) [مستوى التطبيق] النقطة (4، −1) على د. ما النقطة المقابلة على د⁻¹؟\nالإجابة النموذجية: (−1، 4)\n3) [مستوى الاستدلال] ارسم د(س) = س + 2 ومعكوسها، ماذا تلاحظ؟\nالإجابة النموذجية: د⁻¹(س) = س − 2، المستقيمان متوازيان ومتماثلان حول ص = س.\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] ما معكوس د(س) = س² − 2، س ≥ 0؟\nالإجابة النموذجية: √(س + 2)، س ≥ −2\n5) [مستوى التطبيق] أوجد نقطة تقاطع د(س) = س² − 2، س ≥ 0 مع معكوسها.\nالإجابة النموذجية: (2، 2)\n6) [مستوى الاستدلال] هل يتقاطع د(س) = س² + 2، س ≥ 0 مع معكوسه؟\nالإجابة النموذجية: لا؛ س² − س + 2 = 0 مميّزها 1 − 8 < 0.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كانت (أ، ب) على منحنى د فإن (___، ___) على منحنى د⁻¹\nالإجابة النموذجية: (ب، أ)\n2) [مستوى التطبيق] أوجد د⁻¹(س) للدالة د(س) = 2س − 4 وارسمها مع د.\nالإجابة النموذجية: د⁻¹(س) = (س + 4) ÷ 2\n3) [مستوى الاستدلال] أين يتقاطع منحنى د(س) = 2س − 4 مع معكوسه؟\nالإجابة النموذجية: على ص = س: 2س − 4 = س ← (4، 4)\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: نقاط تقاطع الدالة المتزايدة مع معكوسها تقع على المستقيم ___\nالإجابة النموذجية: ص = س\n5) [مستوى التطبيق] أوجد تقاطع د(س) = س² − 6، س ≥ 0 مع معكوسها.\nالإجابة النموذجية: س² − س − 6 = 0 ← س = 3 (نرفض −2)، النقطة (3، 3)\n6) [مستوى الاستدلال] ارسم د(س) = س²، س ≥ 0 ومعكوسها، وحدد نقاط التقاطع.\nالإجابة النموذجية: د⁻¹(س) = √س، التقاطع (0، 0) و (1، 1)", "للطالب: تمارين 2-4: السؤالان 1 و 2، وكتاب النشاط ص49–50 (كتاب الطالب ص79–84، ومراجعة الوحدة ص85–88، كتاب النشاط ص49–52، ومراجعة الوحدة ص53–55).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 2-4: الأسئلة 3–5، وكتاب النشاط ص51–52 (كتاب الطالب ص79–84، ومراجعة الوحدة ص85–88، كتاب النشاط ص49–52، ومراجعة الوحدة ص53–55).\nلولي الأمر: متابعة تقدم الابن/الابنة في «رسم منحنى الدالة التربيعية والجذرية المقيدتين ومعكوسهما ونقاط التقاطع» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=10"]}, {"ax": "مراجعة الوحدة الثانية: الدوال", "wk": "الأسبوع السادس (11–15/10/2026م)", "f": ["1) يربط بين مفاهيم الوحدة: المجال والمدى، التركيب، المعكوس، الانعكاس (10 دقائق)\n2) يحل أسئلة مراجعة نهاية الوحدة وكتاب النشاط (20 دقيقة)\n\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا ويحدد ما يحتاج إلى مراجعة (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الدالة، المجال، المدى، الدالة المركّبة، الدالة العكسية، الانعكاس في ص = س.", "ينظم المعلم لعبة «أنا الدالة»: يعطي طالبًا قاعدة سرية، ويقترح زملاؤه مدخلات لاكتشاف القاعدة ثم معكوسها، ويقترح الطالب مدخلات ويستنتج القاعدة ومعكوسها. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص85–88 على المجموعات حسب المحاور، وتحل المجموعة محورها وتعد ملخصًا (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: تعرض كل مجموعة سؤالًا مميزًا، ويناقش المعلم الأخطاء الشائعة (خلط د⁻¹ مع 1 ÷ د)، وتشرح المجموعة وتجيب عن الأسئلة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...» للوحدة (تقويم تكويني)، ويقيم الطالب نفسه ويحدد خطة مراجعة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. المعلم: يختار المعلم الدرس 2-4 ومحور «مراجعة الوحدة الثانية: الدوال»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص85–88، وكتاب النشاط ص53–55، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – مرآة الباب العماني: يرسم كل زوج نقاطًا لدالة خطية ثم يعكسها في المستقيم ص = س، ويشبّه الانعكاس بتماثل زخارف الأبواب الخشبية العمانية، ثم يتحقق زوج آخر من صحة الرسم (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل د⁻¹(س) هي 1 ÷ د(س)؟ فسّر.\nالإجابة النموذجية: لا؛ د⁻¹ هي الدالة العكسية وليست مقلوب الدالة.\n2) [مستوى التطبيق] د(س) = س − 3، هـ(س) = 2س. أوجد هـ(د(س)).\nالإجابة النموذجية: 2س − 6\n3) [مستوى الاستدلال] أوجد مدى د(س) = س² − 4، −1 ≤ س ≤ 3.\nالإجابة النموذجية: −4 ≤ د(س) ≤ 5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: منحنى د⁻¹ انعكاس لمنحنى د في المستقيم ___\nالإجابة النموذجية: ص = س\n2) [مستوى التطبيق] أوجد د⁻¹(س) للدالة د(س) = (س − 5) ÷ 2.\nالإجابة النموذجية: 2س + 5\n3) [مستوى الاستدلال] د(س) = 2س + 1، هـ(س) = س². حل هـ(د(س)) = 9.\nالإجابة النموذجية: 2س + 1 = ±3 ← س = 1 أو س = −2", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص85–88، وكتاب النشاط ص53–55 (كتاب الطالب ص79–84، ومراجعة الوحدة ص85–88، كتاب النشاط ص49–52، ومراجعة الوحدة ص53–55).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=10"]}]}, {"id": "3-1", "title": "المتتاليات الحسابية", "p": [{"ax": "مفهوم المتتالية والمتتالية الحسابية وأساسها + الحد العام للمتتالية الحسابية وإيجاد حد معين ورتبة حد", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يتعرف المتتالية والحد ورتبة الحد (10 دقائق)\n2) يميّز المتتالية الحسابية ويجد أساسها (الفرق المشترك) د (10 دقائق)\n3) يستخدم صيغة الحد العام حن = أ + (ن − 1)د لإيجاد أي حد (5 دقائق)\n4) يجد رتبة حد معلوم في متتالية حسابية (5 دقائق)\n\nمخرج تعليمي آخر:\nيكتب حدودًا تالية لمتتالية حسابية معطاة (5 دقائق)\nيبرر صيغة الحد العام من نمط الحدود (5 دقائق)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- أخرى: بطاقات حسابية/ليست حسابية", "المتتالية، الحد، رتبة الحد، المتتالية الحسابية، الأساس (الفرق المشترك) د، الحد الأول أ.، الحد العام (الحد النوني) حن، رتبة الحد ن، الصيغة أ + (ن − 1)د.", "يعرض المعلم صورًا لمقاعد مدرج في مسرح؛ الصف الأول 20 مقعدًا ويزيد كل صف بمقعدين. يسأل: كم مقعدًا في الصف الخامس؟ ويكتب الطالب الأعداد 20، 22، 24، ... ويستنتج 28. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 1» ص89 لأنماط عددية متنوعة، ويطلب تصنيفها: هل الفرق بين كل حدين متتاليين ثابت؟ ويصنف الطالب الأنماط ويحسب الفروق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرّف المعلم المتتالية الحسابية والأساس د = حن+1 − حن، ويحلل أمثلة: 7، 11، 15 (د = 4)، 20، 17، 14 (د = −3) (المثالان 1 و 2)، ويحسب الطالب الأساس لكل متتالية ويكتب الحدين التاليين (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. النمذجة: يبني المعلم الصيغة: ح1 = أ، ح2 = أ + د، ح3 = أ + 2د، ... حن = أ + (ن − 1)د، ثم يطبق على 5، 8، 11: حن = 3ن + 2، ح20 = 62 (المثال 3)، ويشارك الطالب في بناء الصيغة ويحسب ح50 للمدرج: 20 + 49 × 2 = 118 (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعلم تعاوني: يوزع المعلم أسئلة رتبة الحد: أي حد في 5، 8، 11، ... يساوي 101؟ وهل 200 حد فيها؟ (المثال 4)، وتحل المجموعة: 3ن + 2 = 101 ← ن = 33؛ 3ن + 2 = 200 ← ن = 66 فنعم (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-1: الأسئلة 4–7، وكتاب النشاط ص56، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل 3، 7، 11، 15 متتالية حسابية؟ ما أساسها؟\nالإجابة النموذجية: نعم، د = 4\n2) [مستوى التطبيق] اكتب الحدين التاليين في 25، 21، 17، ...\nالإجابة النموذجية: 13، 9\n3) [مستوى الاستدلال] هل 1، 4، 9، 16 متتالية حسابية؟ فسّر.\nالإجابة النموذجية: لا، الفروق 3، 5، 7 غير ثابتة.\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد الحد العشرين في 2، 6، 10، ...\nالإجابة النموذجية: ح20 = 2 + 19 × 4 = 78\n5) [مستوى التطبيق] اكتب الحد العام للمتتالية 9، 6، 3، ...\nالإجابة النموذجية: حن = 9 − 3(ن − 1) = 12 − 3ن\n6) [مستوى الاستدلال] هل العدد 100 حد في المتتالية 3، 7، 11، ...؟\nالإجابة النموذجية: 4ن − 1 = 100 ← ن = 25.25 ليست عددًا صحيحًا، فلا.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: أساس المتتالية الحسابية 2، 9، 16، ... هو ___\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] متتالية حسابية حدها الأول 5 وأساسها −2، اكتب حدودها الأربعة الأولى.\nالإجابة النموذجية: 5، 3، 1، −1\n3) [مستوى الاستدلال] أوجد س إذا كانت 3، س، 15 حدودًا متتالية في متتالية حسابية.\nالإجابة النموذجية: س − 3 = 15 − س ← س = 9\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: الحد العام للمتتالية الحسابية هو حن = أ + (___)د\nالإجابة النموذجية: ن − 1\n5) [مستوى التطبيق] أوجد ح15 في 50، 47، 44، ...\nالإجابة النموذجية: 50 + 14 × (−3) = 8\n6) [مستوى الاستدلال] كم حدًا في المتتالية 7، 12، 17، ...، 102؟\nالإجابة النموذجية: 7 + 5(ن − 1) = 102 ← ن = 20", "للطالب: تمارين 3-1: الأسئلة 1–3 (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم المتتالية والمتتالية الحسابية وأساسها».\nللطالب: تمارين 3-1: الأسئلة 4–7، وكتاب النشاط ص56 (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الحد العام للمتتالية الحسابية وإيجاد حد معين ورتبة حد» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=11"]}, {"ax": "إيجاد الحد الأول والأساس من حدين معلومين", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يكوّن معادلتين في أ و د من حدين معلومين (5 دقائق)\n2) يحل المعادلتين لإيجاد أ و د ثم أي حد مطلوب (15 دقيقة)\n\nمخرج تعليمي آخر: يستنتج طريقة مختصرة لإيجاد د من الفرق بين حدين ورتبتيهما (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات أزواج حدود", "المعادلات الآنية الخطية، الحد الأول، الأساس، الفرق بين الرتب.", "يسأل المعلم: إذا كان الحد الثالث 11 والحد الثامن 26، فكم «قفزة» بينهما؟ وكم قيمة القفزة؟ ويستنتج الطالب 5 قفزات تساوي 15 فالقفزة 3. (5 دقائق)", "1. النمذجة: ينمذج المعلم: ح3 = أ + = 11، ح8 = أ + = 26 ← = 15 ← د = 3، أ = 5 (المثال 5)، ويحل الطالب بالطرح ويتحقق بالطريقة المختصرة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم بطاقات بأزواج حدود مختلفة على المجموعات لإيجاد أ و د وحد ثالث مطلوب، وتحل المجموعة مثلًا: ح4 = 20، ح10 = 2 ← د = −3، أ = 29، ح20 = −28 (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-1: الأسئلة 8–10، وكتاب النشاط ص57، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ح2 = 9، ح6 = 21. أوجد د.\nالإجابة النموذجية: 4د = 12 ← د = 3\n2) [مستوى التطبيق] أوجد أ في السؤال السابق.\nالإجابة النموذجية: أ = 9 − 3 = 6\n3) [مستوى الاستدلال] ح5 = 30، ح12 = 9. أوجد أ و د.\nالإجابة النموذجية: 7د = −21 ← د = −3، أ = 42", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان ح3 = 10 و ح7 = 22 فإن د = ___\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ح4 = 20، ح10 = 2. أوجد ح20.\nالإجابة النموذجية: د = −3، أ = 29، ح20 = 29 + 19 × (−3) = −28\n3) [مستوى الاستدلال] الحد الخامس لمتتالية حسابية مثلا الحد الثاني، والحد الأول 3. أوجد د.\nالإجابة النموذجية: 3 + 4د = 2(3 + د) ← 2د = 3 ← د = 1.5", "للطالب: تمارين 3-1: الأسئلة 8–10، وكتاب النشاط ص57 (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد الحد الأول والأساس من حدين معلومين».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=11"]}, {"ax": "المتسلسلة الحسابية ومجموع أول ن حدًا", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يميّز المتسلسلة من المتتالية (5 دقائق)\n2) يستخدم صيغتي المجموع جن = ن ÷ 2 [2أ + (ن − 1)د] و جن = ن ÷ 2 (أ + ل) (5 دقائق)\n\nمخرج تعليمي آخر: يبرر صيغة المجموع بطريقة كتابة المتسلسلة مرتين معكوسة (30 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المتسلسلة الحسابية، المجموع جن، الحد الأخير ل، طريقة الجمع المعكوس.", "يروي المعلم قصة جمع الأعداد من 1 إلى 100 بطريقة الأزواج المتساوية، ويسأل: كم زوجًا؟ وما مجموع كل زوج؟ ويجد الطالب 50 زوجًا مجموع كل منها 101، فالمجموع 5050. (5 دقائق)", "1. اكتشاف: يطلب المعلم كتابة 2 + 5 + 8 + 11 + 14 ثم كتابتها معكوسة وجمع العمودين لاستنتاج الصيغة (المثال 6)، ويجد الطالب أن كل عمود 16 وعدد الأعمدة 5 فالمجموع 5 × 16 ÷ 2 = 40 (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعمم المعلم الصيغة ويطبق: مجموع أول 20 حدًا من 2، 5، 8، ...: ج20 = 10 × (4 + 19 × 3) = 610، ويطبق الطالب الصيغتين ويقارن النتائج (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-1: الأسئلة 11–14، وكتاب النشاط ص58، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما الفرق بين المتتالية الحسابية والمتسلسلة الحسابية؟\nالإجابة النموذجية: المتتالية قائمة حدود، والمتسلسلة مجموع هذه الحدود.\n2) [مستوى التطبيق] أوجد مجموع أول 10 حدود من 3، 7، 11، ...\nالإجابة النموذجية: ج10 = 5 × (6 + 9 × 4) = 210\n3) [مستوى الاستدلال] أوجد 1 + 2 + 3 + ... + 50.\nالإجابة النموذجية: 25 × 51 = 1275", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مجموع أول ن حدًا إذا عُلم الحد الأول أ والأخير ل هو ___\nالإجابة النموذجية: ن ÷ 2 (أ + ل)\n2) [مستوى التطبيق] أوجد مجموع 5 + 9 + 13 + ... + 81.\nالإجابة النموذجية: ن = 20، ج = 10 × 86 = 860\n3) [مستوى الاستدلال] أوجد مجموع أول 15 حدًا من 40، 37، 34، ...\nالإجابة النموذجية: ج15 = 7.5 × (80 + 14 × (−3)) = 7.5 × 38 = 285", "للطالب: تمارين 3-1: الأسئلة 11–14، وكتاب النشاط ص58 (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=11"]}, {"ax": "مسائل حياتية على المتتاليات والمتسلسلات الحسابية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) ينمذج مواقف حياتية (ادخار، مقاعد، رواتب) بمتتالية أو متسلسلة حسابية (5 دقائق)\n2) يجد عدد الحدود اللازمة للوصول إلى مجموع معين بحل معادلة تربيعية (25 دقيقة)\n\nمخرج تعليمي آخر: يقارن بين عرضين حياتيين باستخدام المتسلسلات (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "النمذجة بالمتسلسلات، الادخار، الزيادة السنوية، عدد الحدود المجهول.", "يسأل المعلم: سالم يدخر 5 ريالات في الشهر الأول ويزيد ريالين كل شهر. كم يدخر في الشهر الثاني عشر؟ وكم المجموع؟ ويحسب الطالب ح12 = 27 ويقترح استخدام صيغة المجموع. (5 دقائق)", "1. حل مشكلة: يحل المعلم مع، والطالب: ج12 = 6 × (10 + 11 × 2) = 192 ريالًا، ثم يسأل: بعد كم شهرًا يصبح المجموع 320 ريالًا؟ ← ن(ن + 4) = 320 ← ن = 16 (المثال 7). يكوّن المعادلة التربيعية ويحلها ويرفض الحل السالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يعرض المعلم عرضَي عمل: الأول راتب 400 ريال يزيد 20 ريالًا سنويًا، والثاني 450 ريالًا يزيد 10 ريالات. أيهما أفضل في 10 سنوات؟ وتحسب المجموعة: الأول 5 × (800 + 180) = 4900، الثاني 5 × (900 + 90) = 4950، فالثاني أفضل في 10 سنوات (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-1: الأسئلة 15–18، وكتاب النشاط ص59، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] في مسألة سالم، كم يدخر في الشهر العاشر؟\nالإجابة النموذجية: ح10 = 5 + 9 × 2 = 23 ريالًا\n2) [مستوى التطبيق] كم مجموع ادخاره في 10 أشهر؟\nالإجابة النموذجية: 5 × (10 + 18) = 140 ريالًا\n3) [مستوى الاستدلال] كم حدًا من 3 + 7 + 11 + ... يعطي 210؟\nالإجابة النموذجية: ن(2ن + 1) = 210 ← 2ن² + ن − 210 = 0 ← ن = 10", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في مسألة العرضين بعد 20 سنة يكون مجموع الأول 10 × (800 + 19 × 20) = ___\nالإجابة النموذجية: 11800\n2) [مستوى التطبيق] في المسألة السابقة، أوجد مجموع العرض الثاني بعد 20 سنة وقارن.\nالإجابة النموذجية: 10 × (900 + 19 × 10) = 10900، فالأول أفضل بعد 20 سنة.\n3) [مستوى الاستدلال] مدرج فيه 20 صفًا، الأول 15 مقعدًا ويزيد كل صف 3 مقاعد. كم مقعدًا في المدرج؟\nالإجابة النموذجية: 10 × (30 + 19 × 3) = 870", "للطالب: تمارين 3-1: الأسئلة 15–18، وكتاب النشاط ص59 (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: متابعة تقدم الابن/الابنة في «مسائل حياتية على المتتاليات والمتسلسلات الحسابية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=11"]}, {"ax": "حل تمارين كتاب النشاط ومراجعة المتتاليات الحسابية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يحل تمارين متنوعة على الحد العام والمجموع (15 دقيقة)\n2) يختار الصيغة المناسبة بحسب المعطيات (15 دقيقة)\n\nمخرج تعليمي آخر: يقيّم حلول زملائه ويحدد مصدر الأخطاء (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحد العام، المجموع، الحد الأخير، اختيار الصيغة، تقييم الأقران.", "يعرض المعلم جدولًا بمعطيات مختلفة (أ، د، ن، ل، جن) ناقصة ويسأل: أي صيغة نستخدم في كل حالة؟ ويحدد الطالب الصيغة المناسبة لكل صف. (5 دقائق)", "1. تعلم ذاتي: يكلف الطلبة بتمارين كتاب النشاط ص59–60 حسب المستوى، ويتابع مجموعة الدعم، ويحل الطالب حسب مستواه (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تقييم الأقران: يتبادل الطلبة الحلول ويصححونها وفق نموذج إجابة، ويصحح الطالب ويكتب ملاحظة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 3-1 ومحور «حل تمارين كتاب النشاط ومراجعة المتتاليات الحسابية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال كتاب النشاط ص59–60، وتمارين 3-1 المتبقية، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – فسائل كل عام: يزرع مزارع 5 نخلات في السنة الأولى ويزيد 3 نخلات كل سنة؛ تجد المجموعات أساس المتتالية وحدها العاشر، وتتحدث عن قيمة الزراعة والنخيل في عمان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ح12 في 100، 93، 86، ...\nالإجابة النموذجية: 100 + 11 × (−7) = 23\n2) [مستوى التطبيق] أوجد مجموع أول 12 حدًا من المتتالية السابقة.\nالإجابة النموذجية: 6 × (100 + 23) = 738\n3) [مستوى الاستدلال] متتالية حسابية مجموع أول 10 حدود منها 155 وحدها الأول 2. أوجد د.\nالإجابة النموذجية: 5 × (4 + 9د) = 155 ← 9د = 27 ← د = 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان أ = 4، د = 5 فإن ح10 = ___\nالإجابة النموذجية: 49\n2) [مستوى التطبيق] أوجد مجموع الأعداد الفردية من 1 إلى 99.\nالإجابة النموذجية: ن = 50، ج = 25 × 100 = 2500\n3) [مستوى الاستدلال] متتالية حسابية ح1 = 8 و ج10 = 35. أوجد د.\nالإجابة النموذجية: 5 × (16 + 9د) = 35 ← 9د = −9 ← د = −1", "للطالب: إكمال كتاب النشاط ص59–60، وتمارين 3-1 المتبقية (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=11"]}]}, {"id": "3-2", "title": "المتتاليات الهندسية", "p": [{"ax": "مفهوم المتتالية الهندسية والنسبة المشتركة + الحد العام للمتتالية الهندسية ورتبة حد", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يميّز المتتالية الهندسية ويجد أساسها (النسبة المشتركة) ر (10 دقائق)\n2) يكتب حدودًا تالية لمتتالية هندسية (5 دقائق)\n3) يستخدم صيغة الحد العام حن = أ ر^(ن − 1) (10 دقائق)\n4) يجد رتبة حد معلوم في متتالية هندسية (5 دقائق)\n\nمخرج تعليمي آخر:\nيقارن بين المتتالية الحسابية والهندسية (5 دقائق)\nيستنتج صيغة الحد العام من نمط الحدود (5 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تحليل\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "المتتالية الهندسية، الأساس (النسبة المشتركة) ر = حن+1 ÷ حن، النمو، التناقص.، الحد العام للمتتالية الهندسية، الأسس، رتبة الحد، قوى العدد.", "يعرض المعلم قصة حبة القمح على رقعة الشطرنج (1، 2، 4، 8، ...) ويسأل: كيف ننتقل من حد إلى الذي يليه؟ ويلاحظ الطالب الضرب في 2. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 2» ص96 لأنماط مثل طي الورقة وتضاعف البكتيريا، ويطلب حساب ناتج قسمة كل حد على سابقه، ويجد الطالب أن النسبة ثابتة في بعض الأنماط (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرّف المعلم المتتالية الهندسية ويحلل: 3، 6، 12 (ر = 2)، 81، 27، 9 (ر = 1/3)، 2، −6، 18 (ر = −3) (المثال 8)، ويحسب الطالب ر ويكتب الحدين التاليين لكل منها (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. مقارنة: يطلب المعلم ملء جدول مقارنة بين الحسابية (جمع ثابت) والهندسية (ضرب ثابت) (تقويم تكويني)، ويكمل الطالب الجدول بأمثلة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يبني المعلم الصيغة: ح1 = أ، ح2 = أر، ح3 = أر²، ... حن = أر^(ن − 1)، ويطبق: 3، 6، 12، ... ح8 = 3 × 2^7 = 384 (المثال 9)، ويشارك الطالب ويطبق على 81، 27، 9: ح6 = 81 × (1/3)^5 = 1/3 (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعلم تعاوني: يوزع المعلم أسئلة رتبة الحد: أي حد في 3، 6، 12، ... يساوي 192؟ (المثال 10)، وتحل المجموعة: 3 × 2^(ن − 1) = 192 ← 2^(ن − 1) = 64 ← ن = 7 (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 4–6، وكتاب النشاط ص61، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ر في 5، 15، 45، ...\nالإجابة النموذجية: ر = 3\n2) [مستوى التطبيق] اكتب الحدين التاليين في 64، 32، 16، ...\nالإجابة النموذجية: 8، 4\n3) [مستوى الاستدلال] صنف: 2، 4، 6، 8 و 2، 4، 8، 16.\nالإجابة النموذجية: الأولى حسابية (د = 2) والثانية هندسية (ر = 2).\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد ح6 في 2، 10، 50، ...\nالإجابة النموذجية: 2 × 5^5 = 6250\n5) [مستوى التطبيق] اكتب الحد العام للمتتالية 5، 10، 20، ...\nالإجابة النموذجية: حن = 5 × 2^(ن − 1)\n6) [مستوى الاستدلال] أي حد في 1، 3، 9، ... يساوي 243؟\nالإجابة النموذجية: 3^(ن − 1) = 243 = 3^5 ← ن = 6", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: أساس المتتالية الهندسية 2، −6، 18، ... هو ___\nالإجابة النموذجية: −3\n2) [مستوى التطبيق] متتالية هندسية أ = 4، ر = 1/2. اكتب حدودها الأربعة الأولى.\nالإجابة النموذجية: 4، 2، 1، 1/2\n3) [مستوى الاستدلال] أوجد س إذا كانت 4، س، 25 حدودًا متتالية في متتالية هندسية موجبة.\nالإجابة النموذجية: س ÷ 4 = 25 ÷ س ← س² = 100 ← س = 10\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: الحد العام للمتتالية الهندسية حن = أ ر^(___)\nالإجابة النموذجية: ن − 1\n5) [مستوى التطبيق] أوجد ح5 في 48، 24، 12، ...\nالإجابة النموذجية: 48 × (1/2)^4 = 3\n6) [مستوى الاستدلال] كم حدًا في 4، 8، 16، ...، 1024؟\nالإجابة النموذجية: 2^(ن − 1) = 256 = 2^8 ← ن = 9", "للطالب: تمارين 3-2: الأسئلة 1–3 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم المتتالية الهندسية والنسبة المشتركة».\nللطالب: تمارين 3-2: الأسئلة 4–6، وكتاب النشاط ص61 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الحد العام للمتتالية الهندسية ورتبة حد» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "إيجاد الحد الأول والنسبة المشتركة من حدين معلومين", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يكوّن معادلتين في أ و ر من حدين معلومين (15 دقيقة)\n2) يجد ر بقسمة المعادلتين ثم يجد أ (15 دقيقة)\n\nمخرج تعليمي آخر: يناقش حالتي ر الموجبة والسالبة عند الأسس الزوجية (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "قسمة المعادلات، الجذر التكعيبي، القوة الزوجية، قيمتا ر الممكنتان.", "يسأل المعلم: إذا كان ر² = 9 فما قيم ر؟ وإذا كان ر³ = 27؟ ويجيب الطالب ±3 للأولى و 3 للثانية. (5 دقائق)", "1. النمذجة: ينمذج المعلم: ح2 = أر = 6، ح5 = أر^4 = 162 ← ر³ = 27 ← ر = 3، أ = 2 (المثال 11)، ويتابع الطالب ويطبق على ح3 = 12، ح6 = 96 (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسألة: ح2 = 6، ح4 = 54 ويطلب كل القيم الممكنة لـ ر و أ (المثال 12)، وتجد المجموعة: ر² = 9 ← ر = 3 (أ = 2) أو ر = −3 (أ = −2) (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 7–9، وكتاب النشاط ص62، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ح3 = 12، ح6 = 96. أوجد ر.\nالإجابة النموذجية: ر³ = 8 ← ر = 2\n2) [مستوى التطبيق] أوجد أ في السؤال السابق.\nالإجابة النموذجية: أ × 4 = 12 ← أ = 3\n3) [مستوى الاستدلال] ح2 = 6، ح4 = 54. أوجد القيم الممكنة لـ ر.\nالإجابة النموذجية: ر² = 9 ← ر = ±3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان ح1 = 5 و ح4 = −40 فإن ر = ___\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] ح2 = 10، ح5 = 80. أوجد أ و ر.\nالإجابة النموذجية: ر³ = 8 ← ر = 2، أ = 5\n3) [مستوى الاستدلال] ح3 = 18، ح5 = 162، أوجد ح1 لكل قيمة ممكنة لـ ر.\nالإجابة النموذجية: ر² = 9 ← ر = ±3، وفي الحالتين أ = 18 ÷ 9 = 2", "للطالب: تمارين 3-2: الأسئلة 7–9، وكتاب النشاط ص62 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد الحد الأول والنسبة المشتركة من حدين معلومين».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "المتسلسلة الهندسية ومجموع أول ن حدًا", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يستخدم صيغة مجموع أول ن حدًا جن = أ(1 − رⁿ) ÷ (1 − ر) (15 دقيقة)\n2) يختار صيغة المجموع المناسبة بحسب ر > 1 أو ر < 1 (15 دقيقة)\n\nمخرج تعليمي آخر: يبرر الصيغة بطرح جن من ر جن (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "المتسلسلة الهندسية، مجموع أول ن حدًا، الصيغة أ(رⁿ − 1) ÷ (ر − 1)، الطرح المتداخل.", "يطلب المعلم حساب 1 + 2 + 4 + 8 + 16 ثم مقارنته بـ 2^5 − 1، ويجد الطالب 31 = 32 − 1 ويتساءل عن السبب. (5 دقائق)", "1. النمذجة: يبرهن المعلم الصيغة: جن = أ + أر + ... + أرⁿ⁻¹، ر جن = أر + ... + أرⁿ، بالطرح: جن(1 − ر) = أ(1 − رⁿ) (المثال 13)، ويتابع الطالب البرهان ويكمل الخطوات الناقصة (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يطبق المعلم: 2 + 6 + 18 + ... (6 حدود) = 2(3^6 − 1) ÷ 2 = 728؛ و 64 + 32 + ... (6 حدود) = 64(1 − (1/2)^6) ÷ (1/2) = 126، ويحسب الطالب بالصيغتين ويتحقق بالآلة الحاسبة (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 10–12، وكتاب النشاط ص63، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعل
