دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الجدول التكراري، مخطط الساق والورقة، المفتاح، القيمة والتكرار.", "يعرض المعلم جدولًا تكراريًا ويسأل: هل المدى هو الفرق بين أكبر تكرار وأصغره؟ ويناقش الطالب أن المدى للقيم لا للتكرارات. (5 دقائق)", "1. النمذجة: ينمذج المعلم: س = 2، 3، 4، 5، 6 بتكرارات 1، 4، 7، 3، 0 ← المدى 5 − 2 = 3 (لأن 6 تكرارها صفر) (المثالان 3 و 4)، ويتابع الطالب ويطبق على جدول آخر (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يعرض المعلم مخطط ساق وورقة لأوزان حقائب (المفتاح 3 | 2 = 32 كغم) ويطلب المدى (المثال 5)، ويقرأ الطالب أصغر وأكبر قيمة ويحسب المدى (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-1: الأسئلة 4–6، وكتاب النشاط ص87، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س = 10، 20، 30، 40 و ت = 3، 0، 5، 2. أوجد المدى.\nالإجابة النموذجية: 40 − 10 = 30\n2) [مستوى التطبيق] ساق وورقة: 1 | 4 7، 2 | 0 3 9، 3 | 5. أوجد المدى.\nالإجابة النموذجية: 35 − 14 = 21\n3) [مستوى الاستدلال] س = 1، 2، 3، 4 و ت = 0، 5، 8، 2. أوجد المدى.\nالإجابة النموذجية: 4 − 2 = 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في الجدول التكراري نتجاهل القيم التي تكرارها ___ عند حساب المدى.\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] ساق وورقة: 4 | 1 5، 5 | 2 2 8، 6 | 0 7. أوجد المدى.\nالإجابة النموذجية: 67 − 41 = 26\n3) [مستوى الاستدلال] س = 5، 6، 7، 8 و ت = 2، 9، 1، 3. أوجد المدى.\nالإجابة النموذجية: 8 − 5 = 3", "للطالب: تمارين 5-1: الأسئلة 4–6، وكتاب النشاط ص87 (كتاب الطالب ص155–160، كتاب النشاط ص87–88).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «المدى من الجدول التكراري ومخطط الساق والورقة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=19"]}, {"ax": "المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يحدد الحدين الأدنى والأعلى لقيمة مقربة (15 دقيقة)\n2) يحسب أكبر مدى ممكن وأصغر مدى ممكن لبيانات مجمعة في فئات (15 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا لا يمكن حساب المدى الدقيق للبيانات المجمعة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "البيانات المجمعة، حدود الفئة، الحد الأدنى، الحد الأعلى، أكبر مدى ممكن، أصغر مدى ممكن، القيم المقربة.", "يسأل المعلم: طول قلم 14 سم مقربًا لأقرب سنتيمتر. ما أقصر طول ممكن؟ وما أطوله؟ ويجيب الطالب: من 13.5 إلى أقل من 14.5 سم. (5 دقائق)", "1. النمذجة: ينمذج المعلم: فئات 5 ≤ س < 8، 8 ≤ س < 10، 10 ≤ س < 15 كلها بتكرار: أكبر مدى ممكن 15 − 5 = 10، وأصغر مدى ممكن 10 − 8 = 2 (المثالان 6 و 7)، ويتابع الطالب ويرسم الفئات على خط الأعداد لتوضيح الفكرة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول لقيم مقربة (أوزان لأقرب 100 كغم، أعداد زوار لأقرب 1000) لإيجاد الحدود، وتجد المجموعة الحدود: 300 كغم ← 250 إلى 350 (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 5-1 ومحور «المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-1: الأسئلة 7–9، وكتاب النشاط ص88، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – مدى حرارة وطني: يكتب المعلم قراءات حرارة افتراضية لولاية ساحلية وأخرى صحراوية، فتحسب المجموعات المدى لكل منهما وتناقش أثر تنوع مناخ عمان في الزراعة والحياة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما حدا القيمة 4 سم المقربة لأقرب سنتيمتر؟\nالإجابة النموذجية: 3.5 سم و 4.5 سم\n2) [مستوى التطبيق] فئات 0 ≤ س < 10، 10 ≤ س < 20، 20 ≤ س < 30. أوجد أكبر مدى ممكن.\nالإجابة النموذجية: 30 − 0 = 30\n3) [مستوى الاستدلال] أوجد أصغر مدى ممكن للفئات السابقة.\nالإجابة النموذجية: 20 − 10 = 10", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: حدا القيمة 300 كغم المقربة لأقرب 100 كغم هما 250 و ___\nالإجابة النموذجية: 350\n2) [مستوى التطبيق] فئات 2 ≤ س < 4، 4 ≤ س < 6، 6 ≤ س < 9. أوجد أكبر وأصغر مدى ممكن.\nالإجابة النموذجية: الأكبر 9 − 2 = 7، الأصغر 6 − 4 = 2\n3) [مستوى الاستدلال] لماذا لا نحسب المدى الدقيق للبيانات المجمعة؟\nالإجابة النموذجية: لأننا لا نعرف القيم الفعلية داخل الفئات.", "للطالب: تمارين 5-1: الأسئلة 7–9، وكتاب النشاط ص88 (كتاب الطالب ص155–160، كتاب النشاط ص87–88).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=19"]}]}, {"id": "5-2", "title": "المدى الربيعي", "p": [{"ax": "الربيعات والمدى الربيعي للبيانات غير المجمعة", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يجد الربيع الأدنى ر1 والوسيط والربيع الأعلى ر3 لبيانات مرتبة (15 دقيقة)\n2) يحسب المدى الربيعي = ر3 − ر1 (5 دقائق)\nمخرج تعليمي آخر: يفسر المدى الربيعي بوصفه مدى النصف الأوسط من البيانات (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الربيع الأدنى، الربيع الأعلى، الوسيط، المدى الربيعي، النصف الأوسط من البيانات.", "يعرض المعلم بيانات فيها قيمة متطرفة: 3، 4، 5، 5، 6، 7، 40، ويسأل: هل المدى 37 يعبر عن انتشار معظم البيانات؟ ويلاحظ الطالب أن القيمة 40 ضخمت المدى. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 1» ص161 لتقسيم بيانات مرتبة إلى أربعة أجزاء متساوية، ويقسم الطالب البيانات ويحدد نقاط التقسيم (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 3، 5، 7، 8، 9، 11، 13، 15، 20: الوسيط 9، النصف الأدنى 3، 5، 7، 8 ← ر1 = 6، النصف الأعلى 11، 13، 15، 20 ← ر3 = 14، المدى الربيعي 8 (المثالان 8 و 9)، ويطبق الطالب على بيانات زوجية العدد (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-2: الأسئلة 1–3، وكتاب النشاط ص89، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] رتب وأوجد الوسيط: 8، 2، 6، 4، 10، 12، 14.\nالإجابة النموذجية: 2، 4، 6، 8، 10، 12، 14 ← الوسيط 8\n2) [مستوى التطبيق] أوجد ر1 و ر3 للبيانات السابقة.\nالإجابة النموذجية: ر1 = 4 (وسيط 2، 4، 6)، ر3 = 12 (وسيط 10، 12، 14)\n3) [مستوى الاستدلال] أوجد المدى الربيعي.\nالإجابة النموذجية: 12 − 4 = 8", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المدى الربيعي = ر3 − ___\nالإجابة النموذجية: ر1\n2) [مستوى التطبيق] أوجد المدى الربيعي: 1، 3، 4، 6، 7، 9، 10، 12.\nالإجابة النموذجية: النصف الأدنى 1، 3، 4، 6 ← ر1 = 3.5؛ الأعلى 7، 9، 10، 12 ← ر3 = 9.5؛ المدى الربيعي 6\n3) [مستوى الاستدلال] لماذا لا يتأثر المدى الربيعي كثيرًا بالقيم المتطرفة؟\nالإجابة النموذجية: لأنه يعتمد على النصف الأوسط من البيانات فقط.", "للطالب: تمارين 5-2: الأسئلة 1–3، وكتاب النشاط ص89 (كتاب الطالب ص161–168، كتاب النشاط ص89–92).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=20"]}, {"ax": "الربيعات من الجداول ومخطط الساق والورقة ومنحنى التكرار التراكمي", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يجد الربيعات من جدول تكراري ومخطط الساق والورقة (25 دقيقة)\n2) يقدّر الربيعات للبيانات المجمعة من منحنى التكرار التراكمي عند ن ÷ 4 و 3ن ÷ 4 (5 دقائق)\nمخرج تعليمي آخر: يحسب المدى الربيعي التقديري ويفسره (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني", "التكرار التراكمي، رتبة الربيع الأدنى ن ÷ 4، رتبة الربيع الأعلى 3ن ÷ 4، المدى الربيعي التقديري.", "يذكّر المعلم بقراءة الوسيط من منحنى التكرار التراكمي ويسأل: كيف نقرأ الربيعين؟ ويقترح الطالب القراءة عند ربع العدد الكلي وثلاثة أرباعه. (5 دقائق)", "1. النمذجة: ينمذج المعلم قراءة ر1 و ر3 من منحنى تكرار تراكمي لأطوال 80 نبتة: الرتبتان 20 و 60 (المثالان 10 و 11)، ويقرأ الطالب القيم من المنحنى ويحسب المدى الربيعي (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مخطط ساق وورقة لـ 15 قيمة وجدولًا تكراريًا لإيجاد الربيعات (المثال 12)، وتحدد المجموعة الوسيط ونصفي البيانات والربيعين (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-2: الأسئلة 4–6، وكتاب النشاط ص90–91، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ن = 80 في بيانات مجمعة. ما رتبتا الربيعين؟\nالإجابة النموذجية: ر1 عند 20، ر3 عند 60\n2) [مستوى التطبيق] من منحنى تكرار تراكمي قرأنا ر1 = 12 و ر3 = 21. ما المدى الربيعي؟\nالإجابة النموذجية: 9\n3) [مستوى الاستدلال] س = 1، 2، 3، 4، 5 و ت = 2، 3، 4، 3، 2 (ن = 14). أوجد الوسيط.\nالإجابة النموذجية: الرتبتان 7 و 8 عند 3 ← الوسيط 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: رتبة الربيع الأعلى التقديرية في البيانات المجمعة ___ × ن\nالإجابة النموذجية: 3 ÷ 4\n2) [مستوى التطبيق] للجدول السابق (ن = 14)، أوجد ر1 و ر3.\nالإجابة النموذجية: النصف الأدنى 7 قيم: 1، 1، 2، 2، 2، 3، 3 ← ر1 = 2؛ النصف الأعلى 3، 3، 4، 4، 4، 5، 5 ← ر3 = 4\n3) [مستوى الاستدلال] أوجد المدى الربيعي للجدول السابق.\nالإجابة النموذجية: 4 − 2 = 2", "للطالب: تمارين 5-2: الأسئلة 4–6، وكتاب النشاط ص90–91 (كتاب الطالب ص161–168، كتاب النشاط ص89–92).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الربيعات من الجداول ومخطط الساق والورقة ومنحنى التكرار التراكمي» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=20"]}, {"ax": "المخطط الصندوقي والمقارنة بين مجموعتين", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يرسم المخطط الصندوقي (الصندوق والمؤشر) من الملخص الخماسي (15 دقيقة)\n2) يقارن بين مجموعتين باستخدام الوسيط والمدى الربيعي من المخطط الصندوقي (15 دقيقة)\nمخرج تعليمي آخر: يصدر حكمًا مبررًا حول اتساق البيانات (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الملخص الخماسي (أصغر قيمة، ر1، الوسيط، ر3، أكبر قيمة)، المخطط الصندوقي، المقارنة، الاتساق.", "يعرض المعلم مخططين صندوقيين لأزمنة عداءين ويسأل: أي العداءين أسرع عادة؟ وأيهما أكثر ثباتًا؟ ويقارن الطالب الوسيطين وعرضي الصندوقين. (5 دقائق)", "1. النمذجة: ينمذج المعلم رسم المخطط الصندوقي للبيانات 3، 5، 7، 8، 9، 11، 13، 15، 20 (الملخص: 3، 6، 9، 14، 20) (المثال 13)، ويرسم الطالب المخطط على ورق رسم بياني (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم بيانات درجات صفين ويطلب رسم مخططين صندوقيين على المحور نفسه والمقارنة، وترسم المجموعة وتكتب مقارنتين: الوسيط والمدى الربيعي (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 5-2 ومحور «المخطط الصندوقي والمقارنة بين مجموعتين»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-2: الأسئلة 7–9، وكتاب النشاط ص92، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – ربيعيات سباق الهجن: تجد المجموعات الربيع الأدنى والوسيط والربيع الأعلى لأزمنة افتراضية لهجن في سباق تقليدي، ثم تحسب المدى الربيعي وتتحدث عن سباقات الهجن تراثًا عمانيًا (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما مكونات الملخص الخماسي؟\nالإجابة النموذجية: أصغر قيمة، ر1، الوسيط، ر3، أكبر قيمة\n2) [مستوى التطبيق] صف الصندوق في المخطط الصندوقي.\nالإجابة النموذجية: يمتد من ر1 إلى ر3 ويقسمه خط عند الوسيط.\n3) [مستوى الاستدلال] صندوق المجموعة أ أضيق من ب. ماذا تستنتج؟\nالإجابة النموذجية: بيانات أ أكثر اتساقًا (مدى ربيعي أصغر).", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عرض الصندوق في المخطط الصندوقي يساوي المدى ___\nالإجابة النموذجية: الربيعي\n2) [مستوى التطبيق] ملخص: 10، 15، 22، 28، 40. أوجد المدى والمدى الربيعي.\nالإجابة النموذجية: المدى 30، المدى الربيعي 13\n3) [مستوى الاستدلال] مجموعتان: أ (الوسيط 60، المدى الربيعي 8) و ب (الوسيط 65، المدى الربيعي 20). قارن بينهما.\nالإجابة النموذجية: ب أعلى في المتوسط، و أ أكثر اتساقًا.", "للطالب: تمارين 5-2: الأسئلة 7–9، وكتاب النشاط ص92 (كتاب الطالب ص161–168، كتاب النشاط ص89–92).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=20"]}]}, {"id": "5-3", "title": "التباين والانحراف المعياري", "p": [{"ax": "مفهوم الانحراف عن الوسط والتباين والانحراف المعياري", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يحسب انحراف كل قيمة عن الوسط الحسابي (15 دقيقة)\n2) يحسب التباين = مج(س − الوسط)² ÷ ن والانحراف المعياري = √التباين (15 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا نربّع الانحرافات قبل جمعها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الانحراف عن الوسط، مربع الانحراف، التباين، الانحراف المعياري، وحدة القياس.", "يطلب المعلم حساب الانحرافات عن الوسط للبيانات 2، 4، 6 وجمعها، ويسأل: لماذا كان المجموع صفرًا؟ ويلاحظ الطالب أن الانحرافات الموجبة والسالبة تلغي بعضها. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 2» ص169 ويقود الطلبة إلى فكرة تربيع الانحرافات، ويربع الطالب الانحرافات ويلاحظ أن جميعها موجبة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم في جدول: 2، 4، 4، 4، 5، 5، 7، 9 (الوسط 5): مربعات الانحرافات 9، 1، 1، 1، 0، 0، 4، 16 ومجموعها 32 ← التباين 4 ← الانحراف المعياري 2 (المثال 14)، ويكمل الطالب أعمدة الجدول ويحسب (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3أ: الأسئلة 1–2، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما مجموع الانحرافات عن الوسط لأي بيانات؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد التباين: 2، 4، 6.\nالإجابة النموذجية: الوسط 4، (4 + 0 + 4) ÷ 3 = 8/3\n3) [مستوى الاستدلال] أوجد الانحراف المعياري: 1، 1، 5، 5.\nالإجابة النموذجية: الوسط 3، التباين (4 + 4 + 4 + 4) ÷ 4 = 4، الانحراف المعياري 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الانحراف المعياري = الجذر التربيعي لـ ___\nالإجابة النموذجية: التباين\n2) [مستوى التطبيق] أوجد التباين: 3، 5، 7.\nالإجابة النموذجية: الوسط 5، (4 + 0 + 4) ÷ 3 = 8/3 ≈ 2.67\n3) [مستوى الاستدلال] لماذا نستخدم الانحراف المعياري بدل التباين في التفسير؟\nالإجابة النموذجية: لأن وحدته نفس وحدة البيانات.", "للطالب: تمارين 5-3أ: الأسئلة 1–2 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم الانحراف عن الوسط والتباين والانحراف المعياري».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}, {"ax": "الصيغة المختصرة للتباين للبيانات غير المجمعة", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يستخدم الصيغة: التباين = مج س² ÷ ن − (الوسط)² (15 دقيقة)\n2) يتحقق من تكافؤ الصيغتين بمثال عددي (5 دقائق)\nمخرج تعليمي آخر: يحسب الانحراف المعياري من ملخصات ن و مج س و مج س² (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الصيغة المختصرة، مج س، مج س²، الملخصات الإحصائية.", "يسأل المعلم: هل مج س² يساوي (مج س)²؟ جرب على 1، 2، 3، ويجد الطالب 14 مقابل 36، فهما مختلفان. (5 دقائق)", "1. النمذجة: يطبق المعلم الصيغة المختصرة على 2، 4، 4، 4، 5، 5، 7، 9: مج س² = 232، 232 ÷ 8 − 25 = 4 ✓ (المثال 15)، ويتحقق الطالب من النتيجة نفسها (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يعطي المعلم ملخصات: ن = 10، مج س = 50، مج س² = 290 ← التباين 29 − 25 = 4 ← الانحراف 2 (المثال 16)، ويحسب الطالب من الملخصات (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3أ: الأسئلة 3–5، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ن = 5، مج س = 20، مج س² = 100. أوجد التباين.\nالإجابة النموذجية: 20 − 16 = 4\n2) [مستوى التطبيق] أوجد الانحراف المعياري للسؤال السابق.\nالإجابة النموذجية: 2\n3) [مستوى الاستدلال] أوجد التباين: 1، 2، 3، 4، 5 بالصيغة المختصرة.\nالإجابة النموذجية: مج س² = 55، 11 − 9 = 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: التباين = مج س² ÷ ن − (___)²\nالإجابة النموذجية: الوسط\n2) [مستوى التطبيق] ن = 8، مج س = 40، مج س² = 232. أوجد الانحراف المعياري.\nالإجابة النموذجية: التباين 29 − 25 = 4، الانحراف 2\n3) [مستوى الاستدلال] ن = 4، مج س = 12، مج س² = 52. أوجد التباين.\nالإجابة النموذجية: 13 − 9 = 4", "للطالب: تمارين 5-3أ: الأسئلة 3–5 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الصيغة المختصرة للتباين للبيانات غير المجمعة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}, {"ax": "التباين والانحراف المعياري من الجدول التكراري", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يكوّن أعمدة ت × س و ت × س² في الجدول التكراري (5 دقائق)\n2) يحسب التباين = مج(ت س²) ÷ مج ت − (الوسط)² (15 دقيقة)\nمخرج تعليمي آخر: يستخدم الآلة الحاسبة في الوضع الإحصائي للتحقق (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الجدول التكراري، مج(ت س)، مج(ت س²)، الوضع الإحصائي في الآلة الحاسبة.", "يسأل المعلم: كيف عدّلنا صيغة الوسط للجدول التكراري؟ فكيف نعدّل صيغة التباين؟ ويقترح الطالب ضرب س² في التكرار. (5 دقائق)", "1. النمذجة: ينمذج المعلم: س = 1، 2، 3، 4 و ت = 2، 3، 4، 1: مج ت = 10، مج(ت س) = 24، الوسط 2.4، مج(ت س²) = 66، التباين 6.6 − 5.76 = 0.84، الانحراف ≈ 0.92 (المثال 17)، ويكمل الطالب الأعمدة ويحسب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول تكرارية لكل مجموعة، ويطلب الحساب يدويًا ثم بالآلة الحاسبة، وتحسب المجموعة وتتحقق بالآلة (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3أ: الأسئلة 6–8، وكتاب النشاط ص93، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س = 0، 1، 2 و ت = 3، 4، 3. أوجد الوسط.\nالإجابة النموذجية: (0 + 4 + 6) ÷ 10 = 1\n2) [مستوى التطبيق] أوجد التباين للجدول السابق.\nالإجابة النموذجية: مج(ت س²) = 0 + 4 + 12 = 16، 1.6 − 1 = 0.6\n3) [مستوى الاستدلال] أوجد الانحراف المعياري للجدول السابق.\nالإجابة النموذجية: √0.6 ≈ 0.77", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في الجدول التكراري، التباين = مج(ت س²) ÷ ___ − (الوسط)²\nالإجابة النموذجية: مج ت\n2) [مستوى التطبيق] س = 2، 4 و ت = 5، 5. أوجد التباين.\nالإجابة النموذجية: الوسط 3، مج(ت س²) = 20 + 80 = 100، 10 − 9 = 1\n3) [مستوى الاستدلال] س = 1، 2، 3 و ت = 1، 2، 1. أوجد الانحراف المعياري.\nالإجابة النموذجية: الوسط 2، مج(ت س²) = 1 + 8 + 9 = 18، 4.5 − 4 = 0.5، الانحراف ≈ 0.71", "للطالب: تمارين 5-3أ: الأسئلة 6–8، وكتاب النشاط ص93 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: توفير وقت هاد ية ولا يوجد تشتت.\n2) [مستوى التطبيق] مجموعة أ: الوسط 50 والانحراف 3، مجموعة ب: الوسط 50 والانحراف 10. قارن.\nالإجابة النموذجية: المستوى نفسه، و أ أكثر اتساقًا.\n3) [مستوى الاستدلال] أيهما أكثر تشتتًا: انحراف 4 أم 1.5 لنفس نوع البيانات؟\nالإجابة النموذجية: الانحراف 4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: كلما صغر الانحراف المعياري كانت البيانات أكثر ___\nالإجابة النموذجية: اتساقًا\n2) [مستوى التطبيق] لاعب أ: الوسط 18 والانحراف 2، لاعب ب: الوسط 20 والانحراف 7. من تختار لمباراة حاسمة؟ برّر.\nالإجابة النموذجية: قد يُختار أ لثباته، أو ب لارتفاع وسطه؛ الحكم يعتمد على الحاجة للثبات أم للنتيجة الأعلى.\n3) [مستوى الاستدلال] احسب الانحراف المعياري للبيانات 5، 5، 5، 5.\nالإجابة النموذجية: 0", "للطالب: تمارين 5-3ب: الأسئلة 4–5، وكتاب النشاط ص94 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: متابعة تقدم الابن/الابنة في «تفسير الانحراف المعياري والمقارنة بين مجموعتين» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}, {"ax": "تمارين متنوعة على التباين والانحراف المعياري", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يحل تمارين متنوعة على حساب التباين والانحراف المعياري (15 دقيقة)\n2) يجد قيمة مجهولة من ملخصات إحصائية (5 دقائق)\nمخرج تعليمي آخر: يقيم حلول الأقران (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الملخصات الإحصائية، القيمة المجهولة، التحقق، تقييم الأقران.", "يطرح المعلم لغزًا: ن = 5، مج س = 30، والتباين 4. ما مج س²؟ ويحسب الطالب: (مج س² ÷ 5) − 36 = 4 ← مج س² = 200. (5 دقائق)", "1. تعلم ذاتي: يكلف المعلم بالتمارين المتبقية من 5-3أ و 5-3ب حسب المستوى، ويحل الطالب حسب مستواه (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تقييم الأقران: يتبادل الطلبة الحلول ويصححونها وفق نموذج إجابة، ويصحح الطالب ويكتب ملاحظة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 5-3 ومحور «تمارين متنوعة على التباين والانحراف المعياري»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين 5-3أ و 5-3ب، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – ثبات الحرفي: تقارن المجموعات إنتاجًا يوميًا افتراضيًا لحرفيي فخار خلال أسبوع، وتحسب الانحراف المعياري لكل منهما لتحدد الأكثر انتظامًا، وتربط ذلك بقيمة الإتقان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ن = 5، مج س = 30، التباين 4. أوجد مج س².\nالإجابة النموذجية: 200\n2) [مستوى التطبيق] ن = 10، الوسط 6، مج س² = 400. أوجد التباين.\nالإجابة النموذجية: 40 − 36 = 4\n3) [مستوى الاستدلال] أضيفت قيمة تساوي الوسط إلى البيانات. هل يزيد التباين أم ينقص؟\nالإجابة النموذجية: ينقص؛ لأن مجموع مربعات الانحرافات لا يتغير بينما يزيد عدد القيم ن.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان التباين 9 فالانحراف المعياري ___\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ن = 6، مج س = 24، مج س² = 120. أوجد الانحراف المعياري.\nالإجابة النموذجية: التباين 20 − 16 = 4، الانحراف 2\n3) [مستوى الاستدلال] ن = 4، الوسط 5، التباين 2.5. أوجد مج س².\nالإجابة النموذجية: 4 × (2.5 + 25) = 110", "للطالب: إكمال تمارين 5-3أ و 5-3ب (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}]}, {"id": "5-4", "title": "خصائص مقاييس التشتت", "p": [{"ax": "مزايا وعيوب المدى والمدى الربيعي والانحراف المعياري", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يذكر مزايا كل مقياس من مقاييس التشتت وعيوبه (5 دقائق)\n2) يقارن بين المقاييس الثلاثة في جدول منظم (25 دقيقة)\nمخرج تعليمي آخر: يحكم على صلاحية مقياس في موقف معين (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المدى، المدى الربيعي، الانحراف المعياري، الحساسية للقيم المتطرفة، استخدام جميع القيم.", "يعرض المعلم بيانات 4، 5، 5، 6، 30 ويطلب المدى والمدى الربيعي بسرعة، ويحسب الطالب: المدى 26، المدى الربيعي (ر1 = 4.5، ر3 = 18) = 13.5، ويلاحظ أثر 30. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 3» ص179 لمقارنة أثر تغيير قيمة واحدة على المقاييس الثلاثة، ويحسب الطالب ويسجل التغيرات (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. نقاش موجّه: يستخلص المعلم: المدى سهل لكنه يعتمد على قيمتين فقط؛ المدى الربيعي لا يتأثر بالمتطرفة؛ الانحراف المعياري يستخدم كل القيم لكنه يتأثر بالمتطرفة (المثال 19)، ويكمل الطالب جدول المقارنة (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: السؤالان 1 و 2، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اذكر عيبًا للمدى.\nالإجابة النموذجية: يعتمد على أكبر وأصغر قيمة فقط ويتأثر بالقيم المتطرفة.\n2) [مستوى التطبيق] اذكر ميزة للانحراف المعياري.\nالإجابة النموذجية: يستخدم جميع القيم.\n3) [مستوى الاستدلال] أي المقاييس أنسب لبيانات فيها قيمة متطرفة؟\nالإجابة النموذجية: المدى الربيعي", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المقياس الذي يستخدم جميع القيم هو ___\nالإجابة النموذجية: الانحراف المعياري\n2) [مستوى التطبيق] بيانات 10، 11، 12، 13، 50. أي مقياس تشتت أنسب؟ ولماذا؟\nالإجابة النموذجية: المدى الربيعي لوجود القيمة المتطرفة 50.\n3) [مستوى الاستدلال] لماذا يُقرن الانحراف المعياري بالوسط والمدى الربيعي بالوسيط؟\nالإجابة النموذجية: لأن الانحراف يحسب حول الوسط، والربيعيات تعتمد على الترتيب مثل الوسيط.", "للطالب: تمارين 5-4: السؤالان 1 و 2 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مزايا وعيوب المدى والمدى الربيعي والانحراف المعياري».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}, {"ax": "أثر إضافة ثابت والضرب في ثابت على مقاييس التشتت", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يبين أن إضافة ثابت لا تغير المدى والمدى الربيعي والانحراف المعياري (15 دقيقة)\n2) يبين أن الضرب في ثابت أ يضرب المدى والانحراف في |أ| والتباين في أ² (15 دقيقة)\nمخرج تعليمي آخر: يطبق الخصائص لحساب مقاييس بيانات محولة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الإزاحة، التكبير، التحويل الخطي، ثبات التشتت عند الإزاحة.", "يسأل المعلم: إذا أضاف المعلم 5 درجات لكل الطلبة، هل يتغير انتشار الدرجات؟ ويتوقع الطالب أن الانتشار لا يتغير. (5 دقائق)", "1. اكتشاف: يعطي المعلم 2، 4، 6 (الانحراف ≈ 1.63) ويطلب الحساب بعد إضافة 10 وبعد الضرب في 3، ويلاحظ الطالب: الإضافة لا تغير الانحراف، والضرب يضاعفه 3 مرات (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعميم: يعمم المعلم: إذا ص = أس + ب فإن انحراف ص = |أ| × انحراف س، وتباين ص = أ² × تباين س (المثال 20)، ويطبق الطالب على تحويل الحرارة: انحراف 2° م ← 3.6° ف (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: الأسئلة 3–5، وكتاب النشاط ص95، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] انحراف مجموعة 4، أضيف 7 لكل قيمة. الانحراف الجديد؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] تباين مجموعة 9، ضربت القيم في 2. التباين الجديد؟\nالإجابة النموذجية: 36\n3) [مستوى الاستدلال] مدى مجموعة 10، ضربت القيم في 3 ثم أضيف 1. المدى الجديد؟\nالإجابة النموذجية: 30", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عند ضرب القيم في 5 يُضرب التباين في ___\nالإجابة النموذجية: 25\n2) [مستوى التطبيق] انحراف درجات حرارة 2° م. ما الانحراف بالفهرنهايت؟\nالإجابة النموذجية: 1.8 × 2 = 3.6\n3) [مستوى الاستدلال] مدى ربيعي 6، ضربت القيم في 0.5 ثم طرح 2. المدى الربيعي الجديد؟\nالإجابة النموذجية: 3", "للطالب: تمارين 5-4: الأسئلة 3–5، وكتاب النشاط ص95 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «أثر إضافة ثابت والضرب في ثابت على مقاييس التشتت» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}, {"ax": "اختيار مقياس التشتت المناسب للسياق", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يختار مقياس تشتت مناسبًا لبيانات حياتية ويبرر (5 دقائق)\n2) يقرن مقياس التشتت بمقياس النزعة المركزية المناسب (15 دقيقة)\nمخرج تعليمي آخر: يكتب وصفًا إحصائيًا متكاملًا لمجموعة بيانات (20 دقيقة)", "المخرج 1: تقييم\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الوصف الإحصائي، الاقتران بين المقاييس، السياق الحياتي.", "يسأل المعلم: لوصف أعمار سكان حي فيه دار للمسنين، أي مقياسين تختار؟ ويقترح الطالب الوسيط والمدى الربيعي. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم 4 مجموعات بيانات حياتية ويطلب من كل مجموعة وصفًا إحصائيًا كاملًا (نزعة + تشتت)، وتكتب المجموعة الوصف وتبرر الاختيار (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. عرض ونقاش: تعرض المجموعات أوصافها ويقدم المعلم تغذية راجعة، وتعرض وتجيب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: الأسئلة 6–7، وكتاب النشاط ص96، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بيانات متقاربة بلا قيم متطرفة. أي زوج مقاييس؟\nالإجابة النموذجية: الوسط والانحراف المعياري\n2) [مستوى التطبيق] بيانات فيها قيم متطرفة. أي زوج مقاييس؟\nالإجابة النموذجية: الوسيط والمدى الربيعي\n3) [مستوى الاستدلال] اكتب وصفًا للبيانات: الوسط 20، الانحراف 2.\nالإجابة النموذجية: القيم تتمركز حول 20 وأغلبها قريب منها بانتشار صغير.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: يُقرن الوسيط عادة بـ ___\nالإجابة النموذجية: المدى الربيعي\n2) [مستوى التطبيق] رواتب فيها راتب مرتفع جدًا. اختر مقياسي نزعة وتشتت.\nالإجابة النموذجية: الوسيط والمدى الربيعي\n3) [مستوى الاستدلال] صف بيانات: الوسيط 15، المدى الربيعي 4، المدى 40.\nالإجابة النموذجية: نصف البيانات الأوسط متقارب حول 15، مع وجود قيم متطرفة جعلت المدى كبيرًا.", "للطالب: تمارين 5-4: الأسئلة 6–7، وكتاب النشاط ص96 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «اختيار مقياس التشتت المناسب للسياق».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}, {"ax": "مقارنة توزيعين باستخدام مقياس نزعة ومقياس تشتت", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يقارن بين توزيعين باستخدام مقياس نزعة مركزية ومقياس تشتت (15 دقيقة)\n2) يكتب استنتاجين مبررين في سياق المسألة (15 دقيقة)\nمخرج تعليمي آخر: يحسب المقاييس اللازمة بدقة (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تقييم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "مقارنة التوزيعات، الاتساق، المستوى العام، الاستنتاج المبرر.", "يعرض المعلم درجات فريقين في مسابقة رياضيات ويسأل: كيف نقارن عادلًا بين الفريقين؟ ويقترح الطالب مقارنة المستوى والانتشار. (5 دقائق)", "1. النمذجة: ينمذج المعلم مقارنة: الفريق أ (الوسط 72، الانحراف 5)، الفريق ب (الوسط 68، الانحراف 12): «أ أعلى في المتوسط وأكثر اتساقًا»، ويدوّن الطالب صيغة الاستنتاج المزدوج (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم بيانات خام لمجموعتين لتحسب كل مجموعة المقاييس وتكتب استنتاجين، وتحسب المجموعة وتكتب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: الأسئلة 8–9، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما المطلوب في مقارنة توزيعين؟\nالإجابة النموذجية: مقارنة مقياس نزعة ومقياس تشتت مع تفسيرهما في السياق.\n2) [مستوى التطبيق] أ: الوسيط 30، المدى الربيعي 6؛ ب: الوسيط 26، المدى الربيعي 15. قارن.\nالإجابة النموذجية: أ أعلى في المتوسط وأكثر اتساقًا.\n3) [مستوى الاستدلال] ب: الوسط 50، الانحراف 4؛ ج: الوسط 55، الانحراف 4. قارن.\nالإجابة النموذجية: ج أعلى في المتوسط، والاتساق متساوٍ.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عند المقارنة نذكر مقياسًا للنزعة المركزية ومقياسًا لـ ___\nالإجابة النموذجية: التشتت\n2) [مستوى التطبيق] أزمنة سباحة: س (الوسط 62 ث، الانحراف 1.5)، ع (الوسط 60 ث، الانحراف 4). قارن.\nالإجابة النموذجية: ع أسرع في المتوسط، و س أكثر ثباتًا.\n3) [مستوى الاستدلال] أيهما تختار للسباق القادم من السؤال السابق؟ برّر.\nالإجابة النموذجية: ع إذا كان المطلوب الزمن الأفضل، أو س إذا كان المطلوب الثبات؛ الإجابة مبررة.", "للطالب: تمارين 5-4: الأسئلة 8–9 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}, {"ax": "مشروع تطبيقي: تحليل بيانات حياتية بمقاييس النزعة والتشتت", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يحلل مجموعة بيانات حياتية بمقاييس النزعة المركزية والتشتت (5 دقائق)\n2) يمثل البيانات بالمخطط الصندوقي (25 دقيقة)\nمخرج تعليمي آخر: يقدم تقريرًا مختصرًا باستنتاجات مبررة (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- أخرى: ورق رسم بياني", "التحليل الإحصائي، التقرير، المخطط الصندوقي، الاستنتاج.", "يعرض المعلم بيانات افتراضية لدرجات الحرارة العظمى في مسقط وصلالة لأسبوعين في الصيف، ويسأل: أي المدينتين أكثر استقرارًا في الحرارة؟ ويتوقع الطالب ويقترح طريقة للتحقق. (5 دقائق)", "1. مشروع: توزع المجموعات البيانات وتحسب الوسط والوسيط والمدى الربيعي والانحراف المعياري لكل مدينة، وترسم مخططين صندوقيين، وتحسب وترسم (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تقرير: يطلب المعلم كتابة تقرير من 4 أسطر بالاستنتاجات وعرضه، وتكتب المجموعة التقرير وتعرضه (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تقرير المشروع، وحل تمارين مراجعة الوحدة ص184، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما المقاييس اللازمة لمقارنة استقرار الحرارة؟\nالإجابة النموذجية: مقياس تشتت (الانحراف المعياري أو المدى الربيعي) مع مقياس نزعة.\n2) [مستوى التطبيق] حرارة 31، 32، 32، 33، 32. أوجد الوسط والانحراف المعياري.\nالإجابة النموذجية: الوسط 32، التباين (1 + 0 + 0 + 1 + 0) ÷ 5 = 0.4، الانحراف ≈ 0.63\n3) [مستوى الاستدلال] ماذا يعني انحراف معياري صغير لدرجات الحرارة؟\nالإجابة النموذجية: أن الحرارة مستقرة تقريبًا خلال الفترة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: البيانات الأكثر استقرارًا لها انحراف معياري ___\nالإجابة النموذجية: أصغر\n2) [مستوى التطبيق] حرارة 38، 41، 44، 40، 42. أوجد الوسط والمدى.\nالإجابة النموذجية: الوسط 41، المدى 6\n3) [مستوى الاستدلال] اكتب استنتاجًا يقارن بين مدينة (الوسط 32، الانحراف 0.6) ومدينة (الوسط 41، الانحراف 2).\nالإجابة النموذجية: الثانية أحر في المتوسط، والأولى أكثر استقرارًا في الحرارة.", "للطالب: إكمال تقرير المشروع، وحل تمارين مراجعة الوحدة ص184 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: متابعة تقدم الابن/الابنة في «مشروع تطبيقي: تحليل بيانات حياتية بمقاييس النزعة والتشتت» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}, {"ax": "مراجعة الوحدة الخامسة: مقاييس التشتت", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يحسب مقاييس التشتت المختلفة لبيانات غير مجمعة ومجمعة (10 دقائق)\n2) يقارن بين توزيعين ويختار المقاييس المناسبة (10 دقائق)\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا في الوحدة (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المدى، المدى الربيعي، المخطط الصندوقي، التباين، الانحراف المعياري، خصائص المقاييس.", "ينظم المعلم لعبة «من أنا؟»: يصف مقياسًا تشتت بخصائصه ويطلب تخمينه، ويخمن الطالب المقياس. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص184–185 وكتاب النشاط ص97 على المجموعات، وتحل المجموعة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: تعرض المجموعات حلولها ويثبت المعلم جدول خصائص المقاييس، وتشرح المجموعة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...» للوحدة (تقويم تكويني)، ويقيم الطالب نفسه (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. المعلم: يختار المعلم الدرس 5-4 ومحور «مراجعة الوحدة الخامسة: مقاييس التشتت»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص184–185، وكتاب النشاط ص97، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – مستشارو الإحصاء: تؤدي المجموعات دور مستشارين إحصائيين يختارون مقياس التشتت المناسب لبيانات عدد زوار القلاع العمانية أسبوعيًا، ويبررون اختيارهم بمزاياه وعيوبه (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المدى والمدى الربيعي: 2، 5، 6، 8، 9، 11، 15.\nالإجابة النموذجية: المدى 13، ر1 = 5، ر3 = 11، المدى الربيعي 6\n2) [مستوى التطبيق] ن = 5، مج س = 25، مج س² = 135. أوجد التباين.\nالإجابة النموذجية: 27 − 25 = 2\n3) [مستوى الاستدلال] انحراف مجموعة 3، ضربت في 4. الانحراف الجديد؟\nالإجابة النموذجية: 12", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المقياس الأنسب مع الوسيط هو ___\nالإجابة النموذجية: المدى الربيعي\n2) [مستوى التطبيق] أوجد الانحراف المعياري: 4، 6، 8.\nالإجابة النموذجية: الوسط 6، التباين 8/3، الانحراف ≈ 1.63\n3) [مستوى الاستدلال] فئات 0–<10، 10–<20 بتكرارين 5، 5. أوجد التباين التقديري.\nالإجابة النموذجية: الوسط 10، مج(ت م²) = 125 + 1125 = 1250، 125 − 100 = 25", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص184–185، وكتاب النشاط ص97 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}]}],[{"id": "1-1", "title": "حلّ المعادلات التربيعية بالتحليل إلى عوامل", "p": [{"ax": "تحليل س² + ب س + جـ وحل المعادلة بخاصية الضرب الصفري", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحلّل العبارة التربيعية س² + ب س + جـ إلى عاملين خطيين (5 دقائق)\n2) يحل معادلة تربيعية بالتحليل إلى عوامل مستخدمًا خاصية الضرب الصفري (20 دقيقة)\nمخرج تعليمي آخر: يفسّر ضرورة جعل أحد طرفي المعادلة صفرًا قبل التحليل (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "المعادلة التربيعية، الصورة العامة أس² + ب س + جـ = 0، التحليل إلى عوامل، خاصية الضرب الصفري، جذور المعادلة.", "يعرض المعلم على السبورة الذكية الضرب (س + 3)(س + 2) ويطلب فكّه، ثم يعكس السؤال: ما العددان اللذان حاصل ضربهما 6 ومجموعهما 5؟ ويفك الطالب الأقواس ذهنيًا ويقترح أزواج العوامل ويبرر اختياره. (5 دقائق)", "1. استكشاف: يوزع المعلم نشاط «استكشف 1» ص19 على مجموعات ثنائية، ويطلب تحليل عبارات مثل س² + 7س + 12 بالبحث عن عددين حاصل ضربهما جـ ومجموعهما ب، ويعمل الطالب مع زميله، ويسجل أزواج العوامل في جدول، ويقارن نتائجه بالمجموعة المجاورة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم حل المعادلة س² − 5س + 6 = 0: (س − 2)(س − 3) = 0، إذن س = 2 أو س = 3، ويوضح خاصية الضرب الصفري، ويتحقق بالتعويض (المثال 1)، ويتابع الطالب الخطوات ويدوّنها، ثم يتحقق من الحلين بالتعويض في المعادلة الأصلية (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بحل المثال 2 وبنود من السؤال 1 في تمارين 1-1، ويتجول لتقديم تغذية راجعة فورية (تقويم تكويني)، ويحل الطالب فرديًا ثم يقارن حله مع زميله ويصحح أخطاءه (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1: السؤال 1 (البنود الزوجية)، وكتاب النشاط ص13–14، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حلّل: س² + 7س + 10\nالإجابة النموذجية: (س + 2)(س + 5)\n2) [مستوى التطبيق] حل المعادلة: س² − س − 12 = 0\nالإجابة النموذجية: (س − 4)(س + 3) = 0، إذن س = 4 أو س = −3\n3) [مستوى الاستدلال] حل المعادلة: س² = 9س، وبيّن لماذا لا نقسم الطرفين على س.\nالإجابة النموذجية: س² − 9س = 0 ← س(س − 9) = 0 ← س = 0 أو س = 9؛ القسمة على س تُضيّع الحل س = 0.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان (س − 5)(س + 1) = 0 فإن س = ___ أو س = ___\nالإجابة النموذجية: س = 5 أو س = −1\n2) [مستوى التطبيق] حل المعادلة: س² + 2س − 15 = 0\nالإجابة النموذجية: (س + 5)(س − 3) = 0، إذن س = −5 أو س = 3\n3) [مستوى الاستدلال] اكتب معادلة تربيعية بالصورة العامة جذراها 4 و −2.\nالإجابة النموذجية: (س − 4)(س + 2) = 0 ← س² − 2س − 8 = 0", "للطالب: تمارين 1-1: السؤال 1 (البنود الزوجية)، وكتاب النشاط ص13–14 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «تحليل س² + ب س + جـ وحل المعادلة بخاصية الضرب الصفري».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=1"]}, {"ax": "التحليل عندما أ ≠ 1 والمعادلات التي تحتاج إعادة ترتيب", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحلّل عبارة تربيعية معامل س² فيها لا يساوي 1 (5 دقائق)\n2) يعيد ترتيب المعادلة إلى الصورة العامة ثم يحلها بالتحليل إلى عوامل (20 دقيقة)\nمخرج تعليمي آخر: يكتشف الخطأ في حلول مقدّمة ويصححه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات معادلات", "المعامل الرئيس أ، العامل المشترك الأكبر، إعادة الترتيب، الصورة العامة، الفرق بين مربعين.", "يطرح المعلم سؤالين سريعين: حلّل 2س² + 6س، وحلّل س² − 25؛ ليستذكر الطلبة إخراج العامل المشترك والفرق بين مربعين، ويجيب الطالب على السبورة الصغيرة ويرفعها للمعلم. (5 دقائق)", "1. النمذجة: ينمذج المعلم تحليل 2س² + 5س − 3 بطريقة تجزئة الحد الأوسط (أ × جـ = −6، والعددان 6 و −1): 2س² + 6س − س − 3 = (2س − 1)(س + 3)، ثم حل المعادلة = 0 (المثالان 3 و 4)، ويتابع الطالب ويطبق الطريقة نفسها على 3س² + 10س + 8 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على المجموعات بطاقات لمعادلات تحتاج إعادة ترتيب، مثل: س(س + 4) = 21 و 6س² = 7س + 3 (المثالان 5 و 6)، ويطلب حلها وعرض خطواتها، وتعيد المجموعة ترتيب المعادلة إلى الصورة العامة، وتحللها، وتعرض الحل على زملائها (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحليل الأخطاء: يعرض المعلم حلًا خاطئًا: س(س − 3) = 4 ← س = 4 أو س − 3 = 4، ويطلب تحديد الخطأ وتصحيحه (تقويم تكويني)، ويكتشف الطالب أن الطرف الأيمن ليس صفرًا، ويصحح: س² − 3س − 4 = 0 ← س = 4 أو س = −1 (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1: السؤالان 2 و 3، وكتاب النشاط ص15، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حلّل: 2س² + 7س + 3\nالإجابة النموذجية: (2س + 1)(س + 3)\n2) [مستوى التطبيق] حل: س(س + 4) = 21\nالإجابة النموذجية: س² + 4س − 21 = 0 ← (س + 7)(س − 3) = 0 ← س = −7 أو س = 3\n3) [مستوى الاستدلال] حل: 6س² = 7س + 3\nالإجابة النموذجية: 6س² − 7س − 3 = 0 ← (3س + 1)(2س − 3) = 0 ← س = −1/3 أو س = 3/2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حلّل: 3س² − 12\nالإجابة النموذجية: 3(س − 2)(س + 2)\n2) [مستوى التطبيق] حل: 2س² − 5س − 3 = 0\nالإجابة النموذجية: (2س + 1)(س − 3) = 0 ← س = −1/2 أو س = 3\n3) [مستوى الاستدلال] حل: (س + 1)² = 2س + 10\nالإجابة النموذجية: س² + 2س + 1 = 2س + 10 ← س² = 9 ← س = 3 أو س = −3", "للطالب: تمارين 1-1: السؤالان 2 و 3، وكتاب النشاط ص15 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «التحليل عندما أ ≠ 1 والمعادلات التي تحتاج إعادة ترتيب» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=1"]}, {"ax": "تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يكوّن معادلة تربيعية من موقف حياتي (مساحة، أعداد، حركة) (15 دقيقة)\n2) يحل المعادلة ويختار الحل المناسب للسياق ويستبعد غير المقبول (5 دقائق)\nمخرج تعليمي آخر: يصوغ مسألة حياتية تؤدي إلى معادلة تربيعية (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم المبني على المشاريع\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "النمذجة الرياضية، المتغير، الحل المقبول في السياق، المساحة، الأعداد المتتالية.", "يعرض المعلم صورة لحديقة مستطيلة في إحدى الحدائق العامة بمسقط طولها يزيد على عرضها 3 أمتار ومساحتها 40 م²، ويسأل: كيف نجد البعدين؟ ويقترح الطالب تسمية العرض س وكتابة الطول س + 3. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى المعادلة س(س + 3) = 40 ← س² + 3س − 40 = 0 ← (س + 8)(س − 5) = 0، ويناقش رفض س = −8 لأن الطول لا يكون سالبًا، ويكوّن الطالب المعادلة ويحلها ويبرر قبول س = 5 فقط (العرض 5 م والطول 8 م) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل كتاب النشاط ص16–17 على المجموعات (أعداد متتالية، أطوال أضلاع مثلث قائم)، ويحدد لكل عضو دورًا، وتحل المجموعة المسائل، وتكتب المعادلة والحل والتحقق، ويقدم المقرر الحل (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. إثراء: يطلب المعلم من المجيدين صياغة مسألة حياتية تؤدي إلى المعادلة س² − س − 20 = 0، ويقدّم للمتعثرين مسألة موجّهة بخطوات، ويصوغ الطالب مسألة أو يحل المسألة الموجّهة حسب مستواه (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-1 ومحور «تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-1: الأسئلة 4–6، وكتاب النشاط ص16–17، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – بستان النخيل المستطيل: تحل المجموعات المعادلة س(س + 5) = 84 بالتحليل إلى عوامل لإيجاد بعدي مزرعة نخيل مستطيلة، ثم تذكر سببًا لمكانة النخلة في حياة العمانيين واقتصادهم (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عددان موجبان متتاليان حاصل ضربهما 56، اكتب المعادلة.\nالإجابة النموذجية: س(س + 1) = 56\n2) [مستوى التطبيق] حل المعادلة س² + س − 56 = 0 واختر الحل المناسب للسؤال السابق.\nالإجابة النموذجية: (س + 8)(س − 7) = 0؛ العددان 7 و 8 (نرفض −8 لأنه غير موجب).\n3) [مستوى الاستدلال] مثلث قائم الزاوية ضلعاه القائمان س و س + 7 ووتره 13. أوجد س.\nالإجابة النموذجية: س² + (س + 7)² = 169 ← 2س² + 14س − 120 = 0 ← س² + 7س − 60 = 0 ← (س + 12)(س − 5) = 0 ← س = 5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] مستطيل طوله يزيد على عرضه 2 سم ومساحته 35 سم². أوجد العرض.\nالإجابة النموذجية: س(س + 2) = 35 ← (س + 7)(س − 5) = 0 ← العرض 5 سم\n2) [مستوى التطبيق] لماذا رفضنا الحل السالب في مسائل الأطوال؟\nالإجابة النموذجية: لأن الطول كمية موجبة لا تكون سالبة في الواقع.\n3) [مستوى الاستدلال] مربع زاد طول ضلعه 3 سم فأصبحت مساحته 64 سم². أوجد طول ضلعه الأصلي.\nالإجابة النموذجية: (س + 3)² = 64 ← س + 3 = 8 (نرفض −8) ← س = 5 سم", "للطالب: تمارين 1-1: الأسئلة 4–6، وكتاب النشاط ص16–17 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=1"]}]}, {"id": "1-2", "title": "القيم العظمى والقيم الصغرى للدالة التربيعية", "p": [{"ax": "شكل منحنى الدالة التربيعية ونقطة التحول ومحور التماثل", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحدد شكل منحنى الدالة التربيعية (∪ أو ∩) من إشارة معامل س² (15 دقيقة)\n2) يجد معادلة محور التماثل من جذري الدالة (10 دقائق)\nمخرج تعليمي آخر: يميّز بين نقطة القيمة العظمى ونقطة القيمة الصغرى (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المنحنى التربيعي، نقطة التحول (نقطة الثبات)، نقطة القيمة العظمى، نقطة القيمة الصغرى، محور التماثل.", "يعرض المعلم صورة نافورة ماء وجسر مقوس ويسأل: ما الشكل الذي ترسمه المياه؟ وأين أعلى نقطة؟ ويصف الطالب الشكل ويتوقع موقع أعلى نقطة. (5 دقائق)", "1. اكتشاف: يرسم المعلم مع الطلبة باستخدام GeoGebra منحنيات ص = س² − 4 و ص = −س² + 4 و ص = 2س² ويطلب ملاحظة أثر إشارة أ، ويلاحظ الطالب أن أ > 0 يعطي منحنى مفتوحًا للأعلى بنقطة صغرى، و أ < 0 مفتوحًا للأسفل بنقطة عظمى (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحلّل المعلم د(س) = س² − 6س + 8 = (س − 2)(س − 4)، ويبيّن أن محور التماثل يمر بمنتصف الجذرين س = (2 + 4) ÷ 2 = 3، وأن د(3) = −1، فنقطة الصغرى (3، −1) (المثال 7)، ويتابع الطالب ويطبق على د(س) = س² − 2س − 8 (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بإيجاد محور التماثل ونقطة التحول لـ د(س) = س² + 2س − 3، ويتابع (تقويم تكويني)، ويحلل الطالب: (س + 3)(س − 1)، محور التماثل س = −1، د(−1) = −4، نقطة صغرى (−1، −4) (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-2: السؤالان 1 و 2، وكتاب النشاط ص18، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل منحنى د(س) = −2س² + 3 مفتوح للأعلى أم للأسفل؟\nالإجابة النموذجية: للأسفل لأن معامل س² سالب، وله نقطة عظمى.\n2) [مستوى التطبيق] جذرا دالة تربيعية 1 و 7، اكتب معادلة محور التماثل.\nالإجابة النموذجية: س = (1 + 7) ÷ 2 = 4\n3) [مستوى الاستدلال] أوجد نقطة التحول للدالة د(س) = س² − 2س − 8 وحدد نوعها.\nالإجابة النموذجية: الجذران 4 و −2، المحور س = 1، د(1) = −9، نقطة صغرى (1، −9).", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان أ > 0 فإن للدالة التربيعية قيمة ___\nالإجابة النموذجية: صغرى\n2) [مستوى التطبيق] أوجد معادلة محور التماثل للدالة د(س) = (س + 1)(س − 5).\nالإجابة النموذجية: س = (−1 + 5) ÷ 2 = 2\n3) [مستوى الاستدلال] أوجد القيمة الصغرى للدالة د(س) = (س + 1)(س − 5).\nالإجابة النموذجية: د(2) = 3 × (−3) = −9", "للطالب: تمارين 1-2: السؤالان 1 و 2، وكتاب النشاط ص18 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=2"]}, {"ax": "رسم منحنى الدالة التربيعية باستخدام الجذور والتماثل والقيمة العظمى أو الصغرى", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يجد نقاط تقاطع المنحنى مع المحورين ونقطة التحول (15 دقيقة)\n2) يرسم منحنى الدالة التربيعية مستعينًا بالقيمة العظمى أو الصغرى والتماثل (15 دقيقة)\nمخرج تعليمي آخر: يحدد مدى الدالة من نقطة التحول (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق مربعات", "المقطع الصادي، المقطع السيني، التماثل، نقطة التحول، رسم المنحنى، مدى الدالة.", "يطرح المعلم: أين يقطع منحنى ص = س² − 4س محور الصادات؟ وأين يقطع محور السينات؟ ويعوض الطالب س = 0 فيجد ص = 0، ويحلل س(س − 4) = 0 فيجد س = 0 أو 4. (5 دقائق)", "1. النمذجة: ينمذج المعلم رسم د(س) = −س² + 4س + 5 = −(س − 5)(س + 1): الجذران 5 و −1، المحور س = 2، د(2) = 9 نقطة عظمى، المقطع الصادي 5، ثم يرسم المنحنى (المثالان 8 و 9)، ويرسم الطالب المنحنى في دفتره خطوة بخطوة ويحدد النقاط الأربع (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على كل مجموعة دالة مختلفة ليرسموها على ورقة مربعات ويعلقوها، ثم جولة معرض لمقارنة المنحنيات، وترسم المجموعة منحنى دالتها وتكتب عليه النقاط المميزة وتعلق على أعمال غيرها (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-2: السؤالان 3 و 4، وكتاب النشاط ص19، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المقطع الصادي لمنحنى د(س) = س² − 3س − 10.\nالإجابة النموذجية: د(0) = −10، النقطة (0، −10)\n2) [مستوى التطبيق] أوجد جذري د(س) = س² − 3س − 10 ونقطة الصغرى.\nالإجابة النموذجية: (س − 5)(س + 2)، الجذران 5 و −2، المحور س = 1.5، د(1.5) = −12.25\n3) [مستوى الاستدلال] حدد مدى الدالة د(س) = −س² + 4س + 5.\nالإجابة النموذجية: د(س) ≤ 9", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: منحنى د(س) = −(س − 1)(س − 3) يقطع محور السينات عند س = ___ و س = ___\nالإجابة النموذجية: 1 و 3\n2) [مستوى التطبيق] أوجد نقطة القيمة العظمى للدالة د(س) = −(س − 1)(س − 3).\nالإجابة النموذجية: المحور س = 2، د(2) = −(1)(−1) = 1، النقطة (2، 1)\n3) [مستوى الاستدلال] ارسم منحنى د(س) = س² − 4 موضحًا النقاط المميزة، وحدد مداه.\nالإجابة النموذجية: الجذران ±2، نقطة صغرى (0، −4)، المقطع الصادي −4، المدى د(س) ≥ −4", "للطالب: تمارين 1-2: السؤالان 3 و 4، وكتاب النشاط ص19 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: متابعة تقدم الابن/الابنة في «رسم منحنى الدالة التربيعية باستخدام الجذور والتماثل والقيمة العظمى أو الصغرى» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=2"]}, {"ax": "تطبيقات حياتية على القيمة العظمى والصغرى", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يستخدم القيمة العظمى أو الصغرى لحل مسائل حياتية (ربح، ارتفاع مقذوف) (15 دقيقة)\n2) يفسر معنى نقطة التحول في سياق المسألة (15 دقيقة)\nمخرج تعليمي آخر: يقيّم معقولية النتيجة في الموقف الحياتي (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "دالة الربح، ارتفاع المقذوف، أقصى ارتفاع، أكبر ربح، تفسير النتيجة.", "يعرض المعلم فيديو قصير لكرة تُقذف للأعلى ويسأل: متى تصل الكرة لأقصى ارتفاع؟ ومتى تعود للأرض؟ ويتوقع الطالب ويربط بين الزمن والارتفاع. (5 دقائق)", "1. حل مشكلة: يعرض المعلم المسألة: ارتفاع كرة ع(ن) = 20ن − 5ن² مترًا. يقود الطلبة لتحليلها 5ن(4 − ن)، الجذران 0 و 4، أقصى ارتفاع عند ن = 2 وهو 20 م (المثال 10)، ويحل الطالب المسألة ويفسر: الكرة تصل لأقصى ارتفاع 20 م بعد ثانيتين وتعود للأرض بعد 4 ثوانٍ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسألة ربح: ر(س) = −س² + 40س − 300 (س عدد القطع بالمئات). تحدد المجموعات عدد القطع لأكبر ربح وقيمته، وتحلل المجموعة: −(س − 10)(س − 30)، المحور س = 20، أكبر ربح ر(20) = 100 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق فردي: يكلف الطلبة بحل تمارين كتاب النشاط ص20–21، ويقدم دعمًا للمتعثرين بأسئلة موجهة (تقويم تكويني)، ويحل الطالب فرديًا ويطلب المساعدة عند الحاجة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-2 ومحور «تطبيقات حياتية على القيمة العظمى والصغرى»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-2: الأسئلة 5–7، وكتاب النشاط ص20–21، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – قفزة دلفين في مسندم: تمثل المجموعات مسار قفزة دلفين في خور مسندم بالدالة ص = 4س − س²، فتحدد شكل المنحنى ومحور التماثل وأعلى ارتفاع، ثم تقترح سلوكًا يحمي الحياة البحرية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ع(ن) = 20ن − 5ن²، متى تعود الكرة للأرض؟\nالإجابة النموذجية: عندما ع = 0: 5ن(4 − ن) = 0 ← ن = 4 ثوانٍ\n2) [مستوى التطبيق] ما أقصى ارتفاع للكرة؟\nالإجابة النموذجية: عند ن = 2: ع = 40 − 20 = 20 م\n3) [مستوى الاستدلال] ر(س) = −س² + 40س − 300. هل يحقق إنتاج 35 وحدة ربحًا؟ فسّر.\nالإجابة النموذجية: ر(35) = −1225 + 1400 − 300 = −125 < 0، خسارة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: القيمة العظمى للدالة ع(ن) = 20ن − 5ن² تساوي ___\nالإجابة النموذجية: 20\n2) [مستوى التطبيق] ربح مصنع ر(س) = −س² + 12س − 20. أوجد عدد الوحدات التي تحقق أكبر ربح.\nالإجابة النموذجية: −(س − 2)(س − 10)، المحور س = 6\n3) [مستوى الاستدلال] أوجد أكبر ربح في السؤال السابق وفسّر الجذرين.\nالإجابة النموذجية: ر(6) = 16؛ الجذران 2 و 10 هما نقطتا التعادل (ربح صفري).", "للطالب: تمارين 1-2: الأسئلة 5–7، وكتاب النشاط ص20–21 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=2"]}]}, {"id": "1-3", "title": "المتباينات التربيعية", "p": [{"ax": "حل المتباينة التربيعية بالتحليل والرسم البياني (أصغر من صفر)", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحدد الجذور الحرجة للمتباينة التربيعية بالتحليل (20 دقيقة)\n2) يستخدم رسمًا تخطيطيًا للمنحنى لتحديد الفترة التي يكون فيها المقدار سالبًا (5 دقائق)\nمخرج تعليمي آخر: يكتب مجموعة الحل بصيغة متباينة مزدوجة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المتباينة التربيعية، القيم الحرجة، مجموعة الحل، الرسم التخطيطي، المتباينة المزدوجة.", "يطرح المعلم: حل 2س − 3 < 5، ثم يسأل: ماذا يتغير لو كان لدينا س² بدل 2س؟ ويحل الطالب المتباينة الخطية ويتوقع اختلاف الحل في الحالة التربيعية. (5 دقائق)", "1. اكتشاف: يعرض المعلم منحنى ص = س² − س − 6 على GeoGebra، ويطلب من الطلبة تلوين الجزء الواقع تحت محور السينات وقراءة قيم س المقابلة، ويلاحظ الطالب أن المنحنى تحت المحور بين −2 و 3 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم حل س² − س − 6 < 0: (س − 3)(س + 2) < 0، القيم الحرجة −2 و 3، رسم تخطيطي ∪، الحل −2 < س < 3 (المثال 11)، ويدوّن الطالب الخطوات الأربع: التحليل، القيم الحرجة، الرسم، القراءة (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يكلف الطلبة بحل س² − 4س + 3 ≤ 0 ويتابع كتابة الإشارة ≤ (تقويم تكويني)، ويحل الطالب: (س − 1)(س − 3) ≤ 0 ← 1 ≤ س ≤ 3 (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-3: السؤال 1 (أ–د)، وكتاب النشاط ص22–23، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما القيم الحرجة للمتباينة س² − 9 < 0؟\nالإجابة النموذجية: س = −3 و س = 3\n2) [مستوى التطبيق] حل: س² − 9 < 0\nالإجابة النموذجية: −3 < س < 3\n3) [مستوى الاستدلال] حل: س² + 2س − 8 ≤ 0\nالإجابة النموذجية: (س + 4)(س − 2) ≤ 0 ← −4 ≤ س ≤ 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: حل (س − 1)(س − 5) < 0 هو ___ < س < ___\nالإجابة النموذجية: 1 < س < 5\n2) [مستوى التطبيق] حل: س² − 5س + 4 < 0\nالإجابة النموذجية: (س − 1)(س − 4) < 0 ← 1 < س < 4\n3) [مستوى الاستدلال] حل: 2س² − 3س − 2 ≤ 0\nالإجابة النموذجية: (2س + 1)(س − 2) ≤ 0 ← −1/2 ≤ س ≤ 2", "للطالب: تمارين 1-3: السؤال 1 (أ–د)، وكتاب النشاط ص22–23 (كتاب الطالب ص32–36، كتاب النشاط ص22–26).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «حل المتباينة التربيعية بالتحليل والرسم البياني (أصغر من صفر)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=3"]}, {"ax": "المتباينات (أكبر من صفر) وإعادة الترتيب ومعامل س² السالب", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحل متباينة تربيعية حلها منطقتان منفصلتان (15 دقيقة)\n2) يعيد ترتيب المتباينة ويتعامل مع معامل س² السالب بعكس إشارة التباين (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين شكلي مجموعة الحل في حالتي < 0 و > 0 (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات صح وخطأ", "المنطقتان المنفصلتان، أداة الربط «أو»، عكس إشارة التباين عند الضرب في عدد سالب، إعادة الترتيب.", "يسأل المعلم: إذا ضربنا طرفي المتباينة −س > 4 في −1 ماذا يحدث للإشارة؟ ويجيب الطالب: تنعكس فتصبح س < −4. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل س² − 4س ≥ 5: س² − 4س − 5 ≥ 0 ← (س − 5)(س + 1) ≥ 0، والمنحنى فوق المحور خارج الجذرين: س ≤ −1 أو س ≥ 5 (المثال 12)، ويتابع الطالب ويرسم المنطقتين على خط الأعداد (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: يقسم الطلبة أزواجًا: الأول يحل 6 + س − س² > 0 والثاني يحل س² − س − 6 < 0، ثم يقارنان (المثال 13)، ويكتشف الزوجان أن المتباينتين متكافئتان ولهما الحل −2 < س < 3 (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-3: السؤالان 2 و 3، وكتاب النشاط ص24، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: س² − 9 > 0\nالإجابة النموذجية: س < −3 أو س > 3\n2) [مستوى التطبيق] حل: س² ≥ 2س + 8\nالإجابة النموذجية: س² − 2س − 8 ≥ 0 ← (س − 4)(س + 2) ≥ 0 ← س ≤ −2 أو س ≥ 4\n3) [مستوى الاستدلال] حل: 3 + 2س − س² < 0\nالإجابة النموذجية: س² − 2س − 3 > 0 ← (س − 3)(س + 1) > 0 ← س < −1 أو س > 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: حل (س − 2)(س − 6) > 0 هو س < ___ أو س > ___\nالإجابة النموذجية: س < 2 أو س > 6\n2) [مستوى التطبيق] حل: س² + س − 12 > 0\nالإجابة النموذجية: (س + 4)(س − 3) > 0 ← س < −4 أو س > 3\n3) [مستوى الاستدلال] حل: 12 − س − س² ≥ 0\nالإجابة النموذجية: س² + س − 12 ≤ 0 ← −4 ≤ س ≤ 3", "للطالب: تمارين 1-3: السؤالان 2 و 3، وكتاب النشاط ص24 (كتاب الطالب ص32–36، كتاب النشاط ص22–26).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «المتباينات (أكبر من صفر) وإعادة الترتيب ومعامل س² السالب» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=3"]}, {"ax": "تطبيقات حياتية على المتباينات التربيعية", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يكوّن متباينة تربيعية من موقف حياتي (20 دقيقة)\n2) يحل المتباينة ويفسر الفترة الناتجة في السياق (10 دقائق)\nمخرج تعليمي آخر: يحكم على معقولية الحل بمراعاة قيود الموقف (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المتباينة في السياق، الفترة الزمنية، القيود الواقعية، تفسير الحل.", "يسأل المعلم: كرة ارتفاعها ع = 20ن − 5ن². في أي فترة يكون ارتفاعها أكبر من 15 م؟ هل هي لحظة واحدة أم فترة؟ ويتوقع الطالب أنها فترة زمنية. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى 20ن − 5ن² > 15 ← ن² − 4ن + 3 < 0 ← (ن − 1)(ن − 3) < 0 ← 1 < ن < 3، ويحل الطالب ويفسر: الكرة أعلى من 15 م لمدة ثانيتين (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: توزع مسائل كتاب النشاط ص25–26 (أبعاد حديقة بمساحة لا تقل عن قيمة معينة) على المجموعات، وتكوّن المجموعة المتباينة وتحلها وتراعي أن الأطوال موجبة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق فردي: يكلف الطلبة بأسئلة تمارين 1-3 الحياتية ويتابع الحلول (تقويم تكويني)، ويحل الطالب ويعرض حلّه على المعلم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-3 ومحور «تطبيقات حياتية على المتباينات التربيعية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-3: الأسئلة 4–6، وكتاب النشاط ص25–26، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – رحلات الصياد المربحة: يحل كل زوج المتباينة −س² + 10س − 16 > 0 لتحديد عدد الرحلات التي تحقق ربحًا لقارب صيد افتراضي، ثم يناقش أهمية مهنة الصيد في سواحل عمان (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اكتب المتباينة: ارتفاع الكرة 20ن − 5ن² أكبر من 15.\nالإجابة النموذجية: 20ن − 5ن² > 15\n2) [مستوى التطبيق] حل المتباينة السابقة.\nالإجابة النموذجية: ن² − 4ن + 3 < 0 ← 1 < ن < 3\n3) [مستوى الاستدلال] مستطيل عرضه س وطوله س + 4، ومساحته أقل من 21. أوجد قيم س الممكنة.\nالإجابة النموذجية: س² + 4س − 21 < 0 ← −7 < س < 3، ولأن س > 0: 0 < س < 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان 1 < ن < 3 فإن مدة الفترة ___ ثانية.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] ربح ر(س) = −س² + 12س − 20. متى يكون الربح موجبًا؟\nالإجابة النموذجية: س² − 12س + 20 < 0 ← 2 < س < 10\n3) [مستوى الاستدلال] لماذا نستبعد القيم السالبة في مسألة المستطيل؟\nالإجابة النموذجية: لأن العرض طول، والطول كمية موجبة.", "للطالب: تمارين 1-3: الأسئلة 4–6، وكتاب النشاط ص25–26 (كتاب الطالب ص32–36، كتاب النشاط ص22–26).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تطبيقات حياتية على المتباينات التربيعية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=3"]}]}, {"id": "1-4", "title": "جذور المعادلة التربيعية", "p": [{"ax": "المميّز وتحديد نوع الجذور وعددها", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحسب المميّز ب² − 4أجـ لمعادلة تربيعية (15 دقيقة)\n2) يحدد عدد الجذور الحقيقية ونوعها من إشارة المميّز (5 دقائق)\nمخرج تعليمي آخر: يربط بين إشارة المميّز وعدد نقاط تقاطع المنحنى مع محور السينات (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المميّز، الجذران الحقيقيان المختلفان، الجذران المتساويان (الجذر المكرر)، لا جذور حقيقية.", "يعرض المعلم ثلاثة منحنيات: يقطع محور السينات في نقطتين، يمسه، لا يقطعه، ويسأل: كم حلًا لـ د(س) = 0 في كل حالة؟ ويربط الطالب عدد نقاط التقاطع بعدد الحلول. (5 دقائق)", "1. النمذجة: يقدم المعلم المميّز ب² − 4أجـ ويحسبه لثلاث معادلات: س² − 5س + 6 (1 > 0)، س² − 6س + 9 (0)، س² + س + 5 (−19 < 0) (المثال 14)، ويحسب الطالب المميّز ويصنف الجذور في جدول (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يطلب المعلم رسم المعادلات الثلاث على GeoGebra لتأكيد العلاقة بين إشارة المميّز ونقاط التقاطع، ويتحقق الطالب بالرسم ويكتب استنتاجه بلغته (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بالسؤال 1 من تمارين 1-4 (تقويم تكويني)، ويحل الطالب ويصحح مع زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-4: السؤال 1، وكتاب النشاط ص27، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] احسب المميّز للمعادلة 2س² + 3س − 5 = 0.\nالإجابة النموذجية: 9 − 4(2)(−5) = 49\n2) [مستوى التطبيق] ما نوع جذري المعادلة السابقة؟\nالإجابة النموذجية: حقيقيان مختلفان لأن المميّز موجب.\n3) [مستوى الاستدلال] بيّن أن المعادلة س² − 4س + 7 = 0 ليس لها جذور حقيقية.\nالإجابة النموذجية: المميّز = 16 − 28 = −12 < 0", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان المميّز = 0 فللمعادلة جذران ___\nالإجابة النموذجية: حقيقيان متساويان\n2) [مستوى التطبيق] حدد نوع جذور 4س² − 12س + 9 = 0.\nالإجابة النموذجية: المميّز = 144 − 144 = 0، جذران متساويان\n3) [مستوى الاستدلال] كم مرة يقطع منحنى ص = س² + 2س + 3 محور السينات؟ فسّر.\nالإجابة النموذجية: لا يقطعه؛ المميّز = 4 − 12 = −8 < 0", "للطالب: تمارين 1-4: السؤال 1، وكتاب النشاط ص27 (كتاب الطالب ص37–41، كتاب النشاط ص27–30).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=4"]}, {"ax": "إيجاد قيمة ثابت مجهول بشرط نوع الجذور", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يكوّن معادلة أو متباينة في الثابت ك من شرط نوع الجذور (15 دقيقة)\n2) يجد قيم ك التي تجعل الجذرين متساويين أو حقيقيين أو غير حقيقيين (10 دقائق)\nمخرج تعليمي آخر: يبرر اختيار رمز التباين المناسب (> أو ≥ أو <) (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "الثابت المجهول، شرط الجذرين المتساويين (المميّز = 0)، شرط الجذرين الحقيقيين (المميّز ≥ 0)، شرط عدم وجود جذور حقيقية (المميّز < 0).", "يسأل المعلم: ما قيم ك التي تجعل ك² = 36؟ وما قيم ك التي تجعل ك² < 36؟ ويجيب الطالب ك = ±6، و −6 < ك < 6 مستفيدًا من الدرس السابق. (5 دقائق)", "1. النمذجة: ينمذج المعلم: س² + ك س + 9 = 0 لها جذران متساويان ← ك² − 36 = 0 ← ك = ±6 (المثال 15)، ويتابع الطالب ويحل مثالًا مشابهًا: س² − 8س + ك = 0 ← ك = 16 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على المجموعات مسائل: س² − 4س + ك = 0 ليس لها جذور حقيقية، و ك س² + 6س + 1 = 0 لها جذران حقيقيان (المثال 16)، وتحل: 16 − 4ك < 0 ← ك > 4؛ و 36 − 4ك ≥ 0 ← ك ≤ 9 مع ك ≠ 0 (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم الفرق بين «جذران حقيقيان» (≥ 0) و«جذران حقيقيان مختلفان» (> 0) (تقويم تكويني)، ويشرح الطالب الفرق بمثال من عنده (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-4: الأسئلة 2–5، وكتاب النشاط ص28، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] للمعادلة س² + 6س + ك = 0 جذران متساويان. أوجد ك.\nالإجابة النموذجية: 36 − 4ك = 0 ← ك = 9\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل س² − 4س + ك = 0 بلا جذور حقيقية.\nالإجابة النموذجية: 16 − 4ك < 0 ← ك > 4\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل 2س² + ك س + 2 = 0 لها جذران متساويان.\nالإجابة النموذجية: ك² − 16 = 0 ← ك = ±4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: شرط أن يكون للمعادلة جذران حقيقيان مختلفان هو المميّز ___ 0\nالإجابة النموذجية: >\n2) [مستوى التطبيق] أوجد ك إذا كان للمعادلة س² − 10س + ك = 0 جذران متساويان.\nالإجابة النموذجية: 100 − 4ك = 0 ← ك = 25\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل س² + ك س + 4 = 0 لها جذران حقيقيان مختلفان.\nالإجابة النموذجية: ك² − 16 > 0 ← ك < −4 أو ك > 4", "للطالب: تمارين 1-4: الأسئلة 2–5، وكتاب النشاط ص28 (كتاب الطالب ص37–41، كتاب النشاط ص27–30).\nلولي الأمر: متابعة تقدم الابن/الابنة في «إيجاد قيمة ثابت مجهول بشرط نوع الجذور» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=4"]}, {"ax": "تطبيقات المميّز ومسائل كتاب النشاط", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يستخدم المميّز للحكم على إمكانية تحقق موقف حياتي (10 دقائق)\n2) يحل مسائل متنوعة على الجذور من كتاب النشاط (15 دقيقة)\nمخرج تعليمي آخر: يقيّم ادعاءً رياضيًا حول جذور معادلة باستخدام المميّز (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورقة تنظيم الحل\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحكم بالمميّز، إمكانية تحقق الموقف، الادعاء الرياضي، البرهان المختصر.", "يسأل المعلم: هل يمكن أن تصل كرة ارتفاعها ع = 20ن − 5ن² إلى ارتفاع 25 م؟ كيف نتأكد دون رسم؟ ويقترح الطالب كتابة معادلة واستخدام المميّز. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى 5ن² − 20ن + 25 = 0 ← ن² − 4ن + 5 = 0، المميّز = 16 − 20 = −4 < 0، فلا تصل الكرة إلى 25 م، ويفسر الطالب النتيجة بربطها بأقصى ارتفاع (20 م) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: توزع مسائل كتاب النشاط ص29–30 على المجموعات مع ورقة تنظيم الحل، وتحل المجموعة وتعرض حلًا واحدًا على السبورة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تقييم ادعاء: يعرض المعلم ادعاء: «المعادلة س² + ك س − 1 = 0 لها جذران حقيقيان مختلفان لكل قيم ك» ويطلب الحكم (تقويم تكويني)، ويبرهن الطالب: المميّز = ك² + 4 > 0 دائمًا، فالادعاء صحيح (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-4 ومحور «تطبيقات المميّز ومسائل كتاب النشاط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-4: الأسئلة 6–11، وكتاب النشاط ص29–30، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – تحدي العدد 11: تتسابق المجموعات في حساب مميز معادلات معاملها الأوسط 11 (عدد محافظات سلطنة عمان) مثل س² + 11س + 30 = 0، وتحدد عدد الجذور ونوعها لكل معادلة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل تصل الكرة ع = 20ن − 5ن² إلى ارتفاع 20 م؟ كم مرة؟\nالإجابة النموذجية: ن² − 4ن + 4 = 0، المميّز = 0، تصل مرة واحدة عند ن = 2.\n2) [مستوى التطبيق] بيّن أن س² + ك س − 1 = 0 لها جذران مختلفان لكل ك.\nالإجابة النموذجية: المميّز = ك² + 4 > 0\n3) [مستوى الاستدلال] متى يكون للمعادلة س² − 2س + ك = 0 جذر مكرر؟ وما هو؟\nالإجابة النموذجية: ك = 1، والجذر س = 1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المميّز للمعادلة ن² − 4ن + 5 = 0 يساوي ___\nالإجابة النموذجية: −4\n2) [مستوى التطبيق] هل تصل الكرة ع = 20ن − 5ن² إلى 15 م؟ استخدم المميّز.\nالإجابة النموذجية: ن² − 4ن + 3 = 0، المميّز = 4 > 0، نعم مرتين (ن = 1 و ن = 3).\n3) [مستوى الاستدلال] أثبت أن المعادلة س² + 2ك س + ك² + 1 = 0 ليس لها جذور حقيقية لأي ك.\nالإجابة النموذجية: المميّز = 4ك² − 4(ك² + 1) = −4 < 0", "للطالب: تمارين 1-4: الأسئلة 6–11، وكتاب النشاط ص29–30 (كتاب الطالب ص37–41، كتاب النشاط ص27–30).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=4"]}]}, {"id": "1-5", "title": "حلّ المعادلات الآنية (معادلة خطية ومعادلة تربيعية)", "p": [{"ax": "طريقة التعويض عندما تكون ص معطاة بدلالة س + إعادة ترتيب المعادلة الخطية قبل التعويض", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل زوجًا من المعادلات الآنية (خطية وتربيعية) بطريقة التعويض (10 دقائق)\n2) يجد قيمة ص المقابلة لكل قيمة من قيم س ويكتب الحلول أزواجًا مرتبة (5 دقائق)\n3) يجعل أحد المتغيرين موضوعًا للمعادلة الخطية قبل التعويض (5 دقائق)\n4) يختار المتغير الأنسب لعزله لتسهيل الحل (5 دقائق)\n\nمخرج تعليمي آخر:\nيفسر سبب وجود أكثر من زوج حل (5 دقائق)\nيحل أنظمة تتضمن حاصل ضرب المتغيرين س ص (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج الآخر: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام\n- أخرى: بطاقات أنظمة", "المعادلات الآنية، طريقة التعويض، الزوج المرتب، المعادلة الخطية، المعادلة التربيعية.، موضوع المعادلة، عزل المتغير، التعويض، النظام المتماثل.", "يطرح المعلم حل نظام خطي سريع: ص = س + 1 و ص = 3س − 5، ويسأل: كم حلًا للنظام؟ ولماذا؟ ويحل الطالب بالتعويض فيجد (3، 4)، ويذكر أن المستقيمين يتقاطعان في نقطة واحدة. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل ص = 2س − 1 و ص = س² − 4: س² − 4 = 2س − 1 ← س² − 2س − 3 = 0 ← (س − 3)(س + 1) = 0، ثم ص = 5 أو ص = −3، فالحلان (3، 5) و (−1، −3)، ويدوّن الطالب الخطوات ويتحقق من كل زوج في المعادلتين (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يقدم المعلم نظامًا مشابهًا: ص = س + 2 و ص = س² ويوجه الطلبة خطوة خطوة، ويحل الطالب: س² − س − 2 = 0 ← س = 2 أو −1، الحلان (2، 4) و (−1، 1) (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النمذجة: ينمذج المعلم حل س + ص = 5 و س ص = 6: ص = 5 − س ← س(5 − س) = 6 ← س² − 5س + 6 = 0 ← (2، 3) و (3، 2) (المثال 17)، ويتابع الطالب ويلاحظ تماثل الحلين (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعلم تعاوني: يوزع المعلم أنظمة مثل: 2س + ص = 7 و س² + ص = 10، و س − ص = 1 و س ص = 12، ويطلب من كل مجموعة اختيار المتغير الأسهل للعزل، وتحل المجموعة وتبرر اختيارها: من الأولى ص = 7 − 2س ← س² − 2س − 3 = 0 ← (3، 1) و (−1، 9) (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: السؤال 1 (د–و)، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: ص = س + 2 و ص = س²\nالإجابة النموذجية: (2، 4) و (−1، 1)\n2) [مستوى التطبيق] حل: ص = 3س و ص = س² + 2\nالإجابة النموذجية: س² − 3س + 2 = 0 ← س = 1 أو 2، الحلان (1، 3) و (2، 6)\n3) [مستوى الاستدلال] تحقق من أن (3، 5) حل للنظام ص = 2س − 1 و ص = س² − 4.\nالإجابة النموذجية: 5 = 2(3) − 1 ✓ و 5 = 9 − 4 ✓\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] من س − ص = 1 اكتب س بدلالة ص.\nالإجابة النموذجية: س = ص + 1\n5) [مستوى التطبيق] حل: س − ص = 1 و س ص = 12\nالإجابة النموذجية: (ص + 1)ص = 12 ← ص² + ص − 12 = 0 ← ص = 3 أو −4، الحلان (4، 3) و (−3، −4)\n6) [مستوى الاستدلال] حل: 2س + ص = 7 و س² + ص = 10\nالإجابة النموذجية: ص = 7 − 2س ← س² − 2س − 3 = 0 ← (3، 1) و (−1، 9)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عند حل ص = س و ص = س² نحصل على س = 0 أو س = ___\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] حل: ص = س − 1 و ص = س² − 3س + 2\nالإجابة النموذجية: س² − 4س + 3 = 0 ← (1، 0) و (3، 2)\n3) [مستوى الاستدلال] حل: ص = 2س + 3 و ص = س² + 2س − 1\nالإجابة النموذجية: س² − 4 = 0 ← (2، 7) و (−2، −1)\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: من 3س + ص = 4 يكون ص = ___\nالإجابة النموذجية: 4 − 3س\n5) [مستوى التطبيق] حل: س + ص = 7 و س ص = 10\nالإجابة النموذجية: س² − 7س + 10 = 0 ← (2، 5) و (5، 2)\n6) [مستوى الاستدلال] حل: س + 2ص = 5 و س ص = 2\nالإجابة النموذجية: س = 5 − 2ص ← 2ص² − 5ص + 2 = 0 ← ص = 2 أو 1/2، الحلان (1، 2) و (4، 1/2)", "للطالب: تمارين 1-5: السؤال 1 (أ–ج) (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «طريقة التعويض عندما تكون ص معطاة بدلالة س».\nللطالب: تمارين 1-5: السؤال 1 (د–و) (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «إعادة ترتيب المعادلة الخطية قبل التعويض» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "أنظمة تتضمن س² + ص²", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل نظامًا من معادلة خطية ومعادلة على الصورة س² + ص² = ك (15 دقيقة)\n2) يفك مربع ذات الحدين بدقة أثناء التعويض (10 دقائق)\n\nمخرج تعليمي آخر: يحلل الخطأ الناتج عن فك (أ − ب)² بصورة غير صحيحة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "مربع ذات الحدين، التعويض، تبسيط المعادلة، القسمة على العامل المشترك.", "يطلب المعلم فك (7 − س)² ويسأل: هل يساوي 49 − س²؟ ويفك الطالب: 49 − 14س + س² ويكتشف أن الحد الأوسط ضروري. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل س + ص = 7 و س² + ص² = 25: ص = 7 − س ← س² + 49 − 14س + س² = 25 ← 2س² − 14س + 24 = 0 ← س² − 7س + 12 = 0 ← (3، 4) و (4، 3)، ويتابع الطالب ويلاحظ القسمة على 2 لتبسيط المعادلة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: يقدم المعلم نظامين لكل زوج: ص = س + 1 و س² + ص² = 13، و س − ص = 2 و س² + ص² = 20، ويحل الزوجان: 2س² + 2س − 12 = 0 ← (2، 3) و (−3، −2)؛ والثاني ← (4، 2) و (−2، −4) (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تحليل خطأ: يعرض المعلم حلًا عوّض فيه (س + 1)² = س² + 1، ويطلب تحديد الخطأ وأثره (تقويم تكويني)، ويصحح الطالب الخطأ ويعيد الحل (
