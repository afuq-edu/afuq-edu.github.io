const D=(window.AFUQ35||function(x){return x})([{"id": "1-1", "title": "حلّ المعادلات التربيعية بالتحليل إلى عوامل", "p": [{"ax": "تحليل س² + ب س + جـ وحل المعادلة بخاصية الضرب الصفري", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحلّل العبارة التربيعية س² + ب س + جـ إلى عاملين خطيين (5 دقائق)\n2) يحل معادلة تربيعية بالتحليل إلى عوامل مستخدمًا خاصية الضرب الصفري (20 دقيقة)\nمخرج تعليمي آخر: يفسّر ضرورة جعل أحد طرفي المعادلة صفرًا قبل التحليل (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "المعادلة التربيعية، الصورة العامة أس² + ب س + جـ = 0، التحليل إلى عوامل، خاصية الضرب الصفري، جذور المعادلة.", "يعرض المعلم على السبورة الذكية الضرب (س + 3)(س + 2) ويطلب فكّه، ثم يعكس السؤال: ما العددان اللذان حاصل ضربهما 6 ومجموعهما 5؟ ويفك الطالب الأقواس ذهنيًا ويقترح أزواج العوامل ويبرر اختياره. (5 دقائق)", "1. استكشاف: يوزع المعلم نشاط «استكشف 1» ص19 على مجموعات ثنائية، ويطلب تحليل عبارات مثل س² + 7س + 12 بالبحث عن عددين حاصل ضربهما جـ ومجموعهما ب، ويعمل الطالب مع زميله، ويسجل أزواج العوامل في جدول، ويقارن نتائجه بالمجموعة المجاورة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم حل المعادلة س² − 5س + 6 = 0: (س − 2)(س − 3) = 0، إذن س = 2 أو س = 3، ويوضح خاصية الضرب الصفري، ويتحقق بالتعويض (المثال 1)، ويتابع الطالب الخطوات ويدوّنها، ثم يتحقق من الحلين بالتعويض في المعادلة الأصلية (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بحل المثال 2 وبنود من السؤال 1 في تمارين 1-1، ويتجول لتقديم تغذية راجعة فورية (تقويم تكويني)، ويحل الطالب فرديًا ثم يقارن حله مع زميله ويصحح أخطاءه (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1: السؤال 1 (البنود الزوجية)، وكتاب النشاط ص13–14، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حلّل: س² + 7س + 10\nالإجابة النموذجية: (س + 2)(س + 5)\n2) [مستوى التطبيق] حل المعادلة: س² − س − 12 = 0\nالإجابة النموذجية: (س − 4)(س + 3) = 0، إذن س = 4 أو س = −3\n3) [مستوى الاستدلال] حل المعادلة: س² = 9س، وبيّن لماذا لا نقسم الطرفين على س.\nالإجابة النموذجية: س² − 9س = 0 ← س(س − 9) = 0 ← س = 0 أو س = 9؛ القسمة على س تُضيّع الحل س = 0.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان (س − 5)(س + 1) = 0 فإن س = ___ أو س = ___\nالإجابة النموذجية: س = 5 أو س = −1\n2) [مستوى التطبيق] حل المعادلة: س² + 2س − 15 = 0\nالإجابة النموذجية: (س + 5)(س − 3) = 0، إذن س = −5 أو س = 3\n3) [مستوى الاستدلال] اكتب معادلة تربيعية بالصورة العامة جذراها 4 و −2.\nالإجابة النموذجية: (س − 4)(س + 2) = 0 ← س² − 2س − 8 = 0", "للطالب: تمارين 1-1: السؤال 1 (البنود الزوجية)، وكتاب النشاط ص13–14 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «تحليل س² + ب س + جـ وحل المعادلة بخاصية الضرب الصفري».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=1"]}, {"ax": "التحليل عندما أ ≠ 1 والمعادلات التي تحتاج إعادة ترتيب", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحلّل عبارة تربيعية معامل س² فيها لا يساوي 1 (5 دقائق)\n2) يعيد ترتيب المعادلة إلى الصورة العامة ثم يحلها بالتحليل إلى عوامل (20 دقيقة)\nمخرج تعليمي آخر: يكتشف الخطأ في حلول مقدّمة ويصححه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات معادلات", "المعامل الرئيس أ، العامل المشترك الأكبر، إعادة الترتيب، الصورة العامة، الفرق بين مربعين.", "يطرح المعلم سؤالين سريعين: حلّل 2س² + 6س، وحلّل س² − 25؛ ليستذكر الطلبة إخراج العامل المشترك والفرق بين مربعين، ويجيب الطالب على السبورة الصغيرة ويرفعها للمعلم. (5 دقائق)", "1. النمذجة: ينمذج المعلم تحليل 2س² + 5س − 3 بطريقة تجزئة الحد الأوسط (أ × جـ = −6، والعددان 6 و −1): 2س² + 6س − س − 3 = (2س − 1)(س + 3)، ثم حل المعادلة = 0 (المثالان 3 و 4)، ويتابع الطالب ويطبق الطريقة نفسها على 3س² + 10س + 8 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على المجموعات بطاقات لمعادلات تحتاج إعادة ترتيب، مثل: س(س + 4) = 21 و 6س² = 7س + 3 (المثالان 5 و 6)، ويطلب حلها وعرض خطواتها، وتعيد المجموعة ترتيب المعادلة إلى الصورة العامة، وتحللها، وتعرض الحل على زملائها (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحليل الأخطاء: يعرض المعلم حلًا خاطئًا: س(س − 3) = 4 ← س = 4 أو س − 3 = 4، ويطلب تحديد الخطأ وتصحيحه (تقويم تكويني)، ويكتشف الطالب أن الطرف الأيمن ليس صفرًا، ويصحح: س² − 3س − 4 = 0 ← س = 4 أو س = −1 (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1: السؤالان 2 و 3، وكتاب النشاط ص15، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حلّل: 2س² + 7س + 3\nالإجابة النموذجية: (2س + 1)(س + 3)\n2) [مستوى التطبيق] حل: س(س + 4) = 21\nالإجابة النموذجية: س² + 4س − 21 = 0 ← (س + 7)(س − 3) = 0 ← س = −7 أو س = 3\n3) [مستوى الاستدلال] حل: 6س² = 7س + 3\nالإجابة النموذجية: 6س² − 7س − 3 = 0 ← (3س + 1)(2س − 3) = 0 ← س = −1/3 أو س = 3/2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حلّل: 3س² − 12\nالإجابة النموذجية: 3(س − 2)(س + 2)\n2) [مستوى التطبيق] حل: 2س² − 5س − 3 = 0\nالإجابة النموذجية: (2س + 1)(س − 3) = 0 ← س = −1/2 أو س = 3\n3) [مستوى الاستدلال] حل: (س + 1)² = 2س + 10\nالإجابة النموذجية: س² + 2س + 1 = 2س + 10 ← س² = 9 ← س = 3 أو س = −3", "للطالب: تمارين 1-1: السؤالان 2 و 3، وكتاب النشاط ص15 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «التحليل عندما أ ≠ 1 والمعادلات التي تحتاج إعادة ترتيب» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=1"]}, {"ax": "تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يكوّن معادلة تربيعية من موقف حياتي (مساحة، أعداد، حركة) (15 دقيقة)\n2) يحل المعادلة ويختار الحل المناسب للسياق ويستبعد غير المقبول (5 دقائق)\nمخرج تعليمي آخر: يصوغ مسألة حياتية تؤدي إلى معادلة تربيعية (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم المبني على المشاريع\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "النمذجة الرياضية، المتغير، الحل المقبول في السياق، المساحة، الأعداد المتتالية.", "يعرض المعلم صورة لحديقة مستطيلة في إحدى الحدائق العامة بمسقط طولها يزيد على عرضها 3 أمتار ومساحتها 40 م²، ويسأل: كيف نجد البعدين؟ ويقترح الطالب تسمية العرض س وكتابة الطول س + 3. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى المعادلة س(س + 3) = 40 ← س² + 3س − 40 = 0 ← (س + 8)(س − 5) = 0، ويناقش رفض س = −8 لأن الطول لا يكون سالبًا، ويكوّن الطالب المعادلة ويحلها ويبرر قبول س = 5 فقط (العرض 5 م والطول 8 م) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل كتاب النشاط ص16–17 على المجموعات (أعداد متتالية، أطوال أضلاع مثلث قائم)، ويحدد لكل عضو دورًا، وتحل المجموعة المسائل، وتكتب المعادلة والحل والتحقق، ويقدم المقرر الحل (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. إثراء: يطلب المعلم من المجيدين صياغة مسألة حياتية تؤدي إلى المعادلة س² − س − 20 = 0، ويقدّم للمتعثرين مسألة موجّهة بخطوات، ويصوغ الطالب مسألة أو يحل المسألة الموجّهة حسب مستواه (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-1 ومحور «تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-1: الأسئلة 4–6، وكتاب النشاط ص16–17، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – بستان النخيل المستطيل: تحل المجموعات المعادلة س(س + 5) = 84 بالتحليل إلى عوامل لإيجاد بعدي مزرعة نخيل مستطيلة، ثم تذكر سببًا لمكانة النخلة في حياة العمانيين واقتصادهم (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عددان موجبان متتاليان حاصل ضربهما 56، اكتب المعادلة.\nالإجابة النموذجية: س(س + 1) = 56\n2) [مستوى التطبيق] حل المعادلة س² + س − 56 = 0 واختر الحل المناسب للسؤال السابق.\nالإجابة النموذجية: (س + 8)(س − 7) = 0؛ العددان 7 و 8 (نرفض −8 لأنه غير موجب).\n3) [مستوى الاستدلال] مثلث قائم الزاوية ضلعاه القائمان س و س + 7 ووتره 13. أوجد س.\nالإجابة النموذجية: س² + (س + 7)² = 169 ← 2س² + 14س − 120 = 0 ← س² + 7س − 60 = 0 ← (س + 12)(س − 5) = 0 ← س = 5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] مستطيل طوله يزيد على عرضه 2 سم ومساحته 35 سم². أوجد العرض.\nالإجابة النموذجية: س(س + 2) = 35 ← (س + 7)(س − 5) = 0 ← العرض 5 سم\n2) [مستوى التطبيق] لماذا رفضنا الحل السالب في مسائل الأطوال؟\nالإجابة النموذجية: لأن الطول كمية موجبة لا تكون سالبة في الواقع.\n3) [مستوى الاستدلال] مربع زاد طول ضلعه 3 سم فأصبحت مساحته 64 سم². أوجد طول ضلعه الأصلي.\nالإجابة النموذجية: (س + 3)² = 64 ← س + 3 = 8 (نرفض −8) ← س = 5 سم", "للطالب: تمارين 1-1: الأسئلة 4–6، وكتاب النشاط ص16–17 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=1"]}]}, {"id": "1-2", "title": "القيم العظمى والقيم الصغرى للدالة التربيعية", "p": [{"ax": "شكل منحنى الدالة التربيعية ونقطة التحول ومحور التماثل", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحدد شكل منحنى الدالة التربيعية (∪ أو ∩) من إشارة معامل س² (15 دقيقة)\n2) يجد معادلة محور التماثل من جذري الدالة (10 دقائق)\nمخرج تعليمي آخر: يميّز بين نقطة القيمة العظمى ونقطة القيمة الصغرى (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المنحنى التربيعي، نقطة التحول (نقطة الثبات)، نقطة القيمة العظمى، نقطة القيمة الصغرى، محور التماثل.", "يعرض المعلم صورة نافورة ماء وجسر مقوس ويسأل: ما الشكل الذي ترسمه المياه؟ وأين أعلى نقطة؟ ويصف الطالب الشكل ويتوقع موقع أعلى نقطة. (5 دقائق)", "1. اكتشاف: يرسم المعلم مع الطلبة باستخدام GeoGebra منحنيات ص = س² − 4 و ص = −س² + 4 و ص = 2س² ويطلب ملاحظة أثر إشارة أ، ويلاحظ الطالب أن أ > 0 يعطي منحنى مفتوحًا للأعلى بنقطة صغرى، و أ < 0 مفتوحًا للأسفل بنقطة عظمى (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحلّل المعلم د(س) = س² − 6س + 8 = (س − 2)(س − 4)، ويبيّن أن محور التماثل يمر بمنتصف الجذرين س = (2 + 4) ÷ 2 = 3، وأن د(3) = −1، فنقطة الصغرى (3، −1) (المثال 7)، ويتابع الطالب ويطبق على د(س) = س² − 2س − 8 (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بإيجاد محور التماثل ونقطة التحول لـ د(س) = س² + 2س − 3، ويتابع (تقويم تكويني)، ويحلل الطالب: (س + 3)(س − 1)، محور التماثل س = −1، د(−1) = −4، نقطة صغرى (−1، −4) (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-2: السؤالان 1 و 2، وكتاب النشاط ص18، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل منحنى د(س) = −2س² + 3 مفتوح للأعلى أم للأسفل؟\nالإجابة النموذجية: للأسفل لأن معامل س² سالب، وله نقطة عظمى.\n2) [مستوى التطبيق] جذرا دالة تربيعية 1 و 7، اكتب معادلة محور التماثل.\nالإجابة النموذجية: س = (1 + 7) ÷ 2 = 4\n3) [مستوى الاستدلال] أوجد نقطة التحول للدالة د(س) = س² − 2س − 8 وحدد نوعها.\nالإجابة النموذجية: الجذران 4 و −2، المحور س = 1، د(1) = −9، نقطة صغرى (1، −9).", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان أ > 0 فإن للدالة التربيعية قيمة ___\nالإجابة النموذجية: صغرى\n2) [مستوى التطبيق] أوجد معادلة محور التماثل للدالة د(س) = (س + 1)(س − 5).\nالإجابة النموذجية: س = (−1 + 5) ÷ 2 = 2\n3) [مستوى الاستدلال] أوجد القيمة الصغرى للدالة د(س) = (س + 1)(س − 5).\nالإجابة النموذجية: د(2) = 3 × (−3) = −9", "للطالب: تمارين 1-2: السؤالان 1 و 2، وكتاب النشاط ص18 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=2"]}, {"ax": "رسم منحنى الدالة التربيعية باستخدام الجذور والتماثل والقيمة العظمى أو الصغرى", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يجد نقاط تقاطع المنحنى مع المحورين ونقطة التحول (15 دقيقة)\n2) يرسم منحنى الدالة التربيعية مستعينًا بالقيمة العظمى أو الصغرى والتماثل (15 دقيقة)\nمخرج تعليمي آخر: يحدد مدى الدالة من نقطة التحول (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق مربعات", "المقطع الصادي، المقطع السيني، التماثل، نقطة التحول، رسم المنحنى، مدى الدالة.", "يطرح المعلم: أين يقطع منحنى ص = س² − 4س محور الصادات؟ وأين يقطع محور السينات؟ ويعوض الطالب س = 0 فيجد ص = 0، ويحلل س(س − 4) = 0 فيجد س = 0 أو 4. (5 دقائق)", "1. النمذجة: ينمذج المعلم رسم د(س) = −س² + 4س + 5 = −(س − 5)(س + 1): الجذران 5 و −1، المحور س = 2، د(2) = 9 نقطة عظمى، المقطع الصادي 5، ثم يرسم المنحنى (المثالان 8 و 9)، ويرسم الطالب المنحنى في دفتره خطوة بخطوة ويحدد النقاط الأربع (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على كل مجموعة دالة مختلفة ليرسموها على ورقة مربعات ويعلقوها، ثم جولة معرض لمقارنة المنحنيات، وترسم المجموعة منحنى دالتها وتكتب عليه النقاط المميزة وتعلق على أعمال غيرها (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-2: السؤالان 3 و 4، وكتاب النشاط ص19، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المقطع الصادي لمنحنى د(س) = س² − 3س − 10.\nالإجابة النموذجية: د(0) = −10، النقطة (0، −10)\n2) [مستوى التطبيق] أوجد جذري د(س) = س² − 3س − 10 ونقطة الصغرى.\nالإجابة النموذجية: (س − 5)(س + 2)، الجذران 5 و −2، المحور س = 1.5، د(1.5) = −12.25\n3) [مستوى الاستدلال] حدد مدى الدالة د(س) = −س² + 4س + 5.\nالإجابة النموذجية: د(س) ≤ 9", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: منحنى د(س) = −(س − 1)(س − 3) يقطع محور السينات عند س = ___ و س = ___\nالإجابة النموذجية: 1 و 3\n2) [مستوى التطبيق] أوجد نقطة القيمة العظمى للدالة د(س) = −(س − 1)(س − 3).\nالإجابة النموذجية: المحور س = 2، د(2) = −(1)(−1) = 1، النقطة (2، 1)\n3) [مستوى الاستدلال] ارسم منحنى د(س) = س² − 4 موضحًا النقاط المميزة، وحدد مداه.\nالإجابة النموذجية: الجذران ±2، نقطة صغرى (0، −4)، المقطع الصادي −4، المدى د(س) ≥ −4", "للطالب: تمارين 1-2: السؤالان 3 و 4، وكتاب النشاط ص19 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: متابعة تقدم الابن/الابنة في «رسم منحنى الدالة التربيعية باستخدام الجذور والتماثل والقيمة العظمى أو الصغرى» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=2"]}, {"ax": "تطبيقات حياتية على القيمة العظمى والصغرى", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يستخدم القيمة العظمى أو الصغرى لحل مسائل حياتية (ربح، ارتفاع مقذوف) (15 دقيقة)\n2) يفسر معنى نقطة التحول في سياق المسألة (15 دقيقة)\nمخرج تعليمي آخر: يقيّم معقولية النتيجة في الموقف الحياتي (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "دالة الربح، ارتفاع المقذوف، أقصى ارتفاع، أكبر ربح، تفسير النتيجة.", "يعرض المعلم فيديو قصير لكرة تُقذف للأعلى ويسأل: متى تصل الكرة لأقصى ارتفاع؟ ومتى تعود للأرض؟ ويتوقع الطالب ويربط بين الزمن والارتفاع. (5 دقائق)", "1. حل مشكلة: يعرض المعلم المسألة: ارتفاع كرة ع(ن) = 20ن − 5ن² مترًا. يقود الطلبة لتحليلها 5ن(4 − ن)، الجذران 0 و 4، أقصى ارتفاع عند ن = 2 وهو 20 م (المثال 10)، ويحل الطالب المسألة ويفسر: الكرة تصل لأقصى ارتفاع 20 م بعد ثانيتين وتعود للأرض بعد 4 ثوانٍ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسألة ربح: ر(س) = −س² + 40س − 300 (س عدد القطع بالمئات). تحدد المجموعات عدد القطع لأكبر ربح وقيمته، وتحلل المجموعة: −(س − 10)(س − 30)، المحور س = 20، أكبر ربح ر(20) = 100 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق فردي: يكلف الطلبة بحل تمارين كتاب النشاط ص20–21، ويقدم دعمًا للمتعثرين بأسئلة موجهة (تقويم تكويني)، ويحل الطالب فرديًا ويطلب المساعدة عند الحاجة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-2 ومحور «تطبيقات حياتية على القيمة العظمى والصغرى»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-2: الأسئلة 5–7، وكتاب النشاط ص20–21، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – قفزة دلفين في مسندم: تمثل المجموعات مسار قفزة دلفين في خور مسندم بالدالة ص = 4س − س²، فتحدد شكل المنحنى ومحور التماثل وأعلى ارتفاع، ثم تقترح سلوكًا يحمي الحياة البحرية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ع(ن) = 20ن − 5ن²، متى تعود الكرة للأرض؟\nالإجابة النموذجية: عندما ع = 0: 5ن(4 − ن) = 0 ← ن = 4 ثوانٍ\n2) [مستوى التطبيق] ما أقصى ارتفاع للكرة؟\nالإجابة النموذجية: عند ن = 2: ع = 40 − 20 = 20 م\n3) [مستوى الاستدلال] ر(س) = −س² + 40س − 300. هل يحقق إنتاج 35 وحدة ربحًا؟ فسّر.\nالإجابة النموذجية: ر(35) = −1225 + 1400 − 300 = −125 < 0، خسارة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: القيمة العظمى للدالة ع(ن) = 20ن − 5ن² تساوي ___\nالإجابة النموذجية: 20\n2) [مستوى التطبيق] ربح مصنع ر(س) = −س² + 12س − 20. أوجد عدد الوحدات التي تحقق أكبر ربح.\nالإجابة النموذجية: −(س − 2)(س − 10)، المحور س = 6\n3) [مستوى الاستدلال] أوجد أكبر ربح في السؤال السابق وفسّر الجذرين.\nالإجابة النموذجية: ر(6) = 16؛ الجذران 2 و 10 هما نقطتا التعادل (ربح صفري).", "للطالب: تمارين 1-2: الأسئلة 5–7، وكتاب النشاط ص20–21 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=2"]}]}, {"id": "1-3", "title": "المتباينات التربيعية", "p": [{"ax": "حل المتباينة التربيعية بالتحليل والرسم البياني (أصغر من صفر)", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحدد الجذور الحرجة للمتباينة التربيعية بالتحليل (20 دقيقة)\n2) يستخدم رسمًا تخطيطيًا للمنحنى لتحديد الفترة التي يكون فيها المقدار سالبًا (5 دقائق)\nمخرج تعليمي آخر: يكتب مجموعة الحل بصيغة متباينة مزدوجة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المتباينة التربيعية، القيم الحرجة، مجموعة الحل، الرسم التخطيطي، المتباينة المزدوجة.", "يطرح المعلم: حل 2س − 3 < 5، ثم يسأل: ماذا يتغير لو كان لدينا س² بدل 2س؟ ويحل الطالب المتباينة الخطية ويتوقع اختلاف الحل في الحالة التربيعية. (5 دقائق)", "1. اكتشاف: يعرض المعلم منحنى ص = س² − س − 6 على GeoGebra، ويطلب من الطلبة تلوين الجزء الواقع تحت محور السينات وقراءة قيم س المقابلة، ويلاحظ الطالب أن المنحنى تحت المحور بين −2 و 3 (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم حل س² − س − 6 < 0: (س − 3)(س + 2) < 0، القيم الحرجة −2 و 3، رسم تخطيطي ∪، الحل −2 < س < 3 (المثال 11)، ويدوّن الطالب الخطوات الأربع: التحليل، القيم الحرجة، الرسم، القراءة (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق موجّه: يكلف الطلبة بحل س² − 4س + 3 ≤ 0 ويتابع كتابة الإشارة ≤ (تقويم تكويني)، ويحل الطالب: (س − 1)(س − 3) ≤ 0 ← 1 ≤ س ≤ 3 (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-3: السؤال 1 (أ–د)، وكتاب النشاط ص22–23، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما القيم الحرجة للمتباينة س² − 9 < 0؟\nالإجابة النموذجية: س = −3 و س = 3\n2) [مستوى التطبيق] حل: س² − 9 < 0\nالإجابة النموذجية: −3 < س < 3\n3) [مستوى الاستدلال] حل: س² + 2س − 8 ≤ 0\nالإجابة النموذجية: (س + 4)(س − 2) ≤ 0 ← −4 ≤ س ≤ 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: حل (س − 1)(س − 5) < 0 هو ___ < س < ___\nالإجابة النموذجية: 1 < س < 5\n2) [مستوى التطبيق] حل: س² − 5س + 4 < 0\nالإجابة النموذجية: (س − 1)(س − 4) < 0 ← 1 < س < 4\n3) [مستوى الاستدلال] حل: 2س² − 3س − 2 ≤ 0\nالإجابة النموذجية: (2س + 1)(س − 2) ≤ 0 ← −1/2 ≤ س ≤ 2", "للطالب: تمارين 1-3: السؤال 1 (أ–د)، وكتاب النشاط ص22–23 (كتاب الطالب ص32–36، كتاب النشاط ص22–26).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «حل المتباينة التربيعية بالتحليل والرسم البياني (أصغر من صفر)».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=3"]}, {"ax": "المتباينات (أكبر من صفر) وإعادة الترتيب ومعامل س² السالب", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحل متباينة تربيعية حلها منطقتان منفصلتان (15 دقيقة)\n2) يعيد ترتيب المتباينة ويتعامل مع معامل س² السالب بعكس إشارة التباين (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين شكلي مجموعة الحل في حالتي < 0 و > 0 (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات صح وخطأ", "المنطقتان المنفصلتان، أداة الربط «أو»، عكس إشارة التباين عند الضرب في عدد سالب، إعادة الترتيب.", "يسأل المعلم: إذا ضربنا طرفي المتباينة −س > 4 في −1 ماذا يحدث للإشارة؟ ويجيب الطالب: تنعكس فتصبح س < −4. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل س² − 4س ≥ 5: س² − 4س − 5 ≥ 0 ← (س − 5)(س + 1) ≥ 0، والمنحنى فوق المحور خارج الجذرين: س ≤ −1 أو س ≥ 5 (المثال 12)، ويتابع الطالب ويرسم المنطقتين على خط الأعداد (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: يقسم الطلبة أزواجًا: الأول يحل 6 + س − س² > 0 والثاني يحل س² − س − 6 < 0، ثم يقارنان (المثال 13)، ويكتشف الزوجان أن المتباينتين متكافئتان ولهما الحل −2 < س < 3 (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-3: السؤالان 2 و 3، وكتاب النشاط ص24، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: س² − 9 > 0\nالإجابة النموذجية: س < −3 أو س > 3\n2) [مستوى التطبيق] حل: س² ≥ 2س + 8\nالإجابة النموذجية: س² − 2س − 8 ≥ 0 ← (س − 4)(س + 2) ≥ 0 ← س ≤ −2 أو س ≥ 4\n3) [مستوى الاستدلال] حل: 3 + 2س − س² < 0\nالإجابة النموذجية: س² − 2س − 3 > 0 ← (س − 3)(س + 1) > 0 ← س < −1 أو س > 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: حل (س − 2)(س − 6) > 0 هو س < ___ أو س > ___\nالإجابة النموذجية: س < 2 أو س > 6\n2) [مستوى التطبيق] حل: س² + س − 12 > 0\nالإجابة النموذجية: (س + 4)(س − 3) > 0 ← س < −4 أو س > 3\n3) [مستوى الاستدلال] حل: 12 − س − س² ≥ 0\nالإجابة النموذجية: س² + س − 12 ≤ 0 ← −4 ≤ س ≤ 3", "للطالب: تمارين 1-3: السؤالان 2 و 3، وكتاب النشاط ص24 (كتاب الطالب ص32–36، كتاب النشاط ص22–26).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «المتباينات (أكبر من صفر) وإعادة الترتيب ومعامل س² السالب» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=3"]}, {"ax": "تطبيقات حياتية على المتباينات التربيعية", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يكوّن متباينة تربيعية من موقف حياتي (20 دقيقة)\n2) يحل المتباينة ويفسر الفترة الناتجة في السياق (10 دقائق)\nمخرج تعليمي آخر: يحكم على معقولية الحل بمراعاة قيود الموقف (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المتباينة في السياق، الفترة الزمنية، القيود الواقعية، تفسير الحل.", "يسأل المعلم: كرة ارتفاعها ع = 20ن − 5ن². في أي فترة يكون ارتفاعها أكبر من 15 م؟ هل هي لحظة واحدة أم فترة؟ ويتوقع الطالب أنها فترة زمنية. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى 20ن − 5ن² > 15 ← ن² − 4ن + 3 < 0 ← (ن − 1)(ن − 3) < 0 ← 1 < ن < 3، ويحل الطالب ويفسر: الكرة أعلى من 15 م لمدة ثانيتين (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: توزع مسائل كتاب النشاط ص25–26 (أبعاد حديقة بمساحة لا تقل عن قيمة معينة) على المجموعات، وتكوّن المجموعة المتباينة وتحلها وتراعي أن الأطوال موجبة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق فردي: يكلف الطلبة بأسئلة تمارين 1-3 الحياتية ويتابع الحلول (تقويم تكويني)، ويحل الطالب ويعرض حلّه على المعلم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-3 ومحور «تطبيقات حياتية على المتباينات التربيعية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-3: الأسئلة 4–6، وكتاب النشاط ص25–26، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – رحلات الصياد المربحة: يحل كل زوج المتباينة −س² + 10س − 16 > 0 لتحديد عدد الرحلات التي تحقق ربحًا لقارب صيد افتراضي، ثم يناقش أهمية مهنة الصيد في سواحل عمان (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اكتب المتباينة: ارتفاع الكرة 20ن − 5ن² أكبر من 15.\nالإجابة النموذجية: 20ن − 5ن² > 15\n2) [مستوى التطبيق] حل المتباينة السابقة.\nالإجابة النموذجية: ن² − 4ن + 3 < 0 ← 1 < ن < 3\n3) [مستوى الاستدلال] مستطيل عرضه س وطوله س + 4، ومساحته أقل من 21. أوجد قيم س الممكنة.\nالإجابة النموذجية: س² + 4س − 21 < 0 ← −7 < س < 3، ولأن س > 0: 0 < س < 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان 1 < ن < 3 فإن مدة الفترة ___ ثانية.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] ربح ر(س) = −س² + 12س − 20. متى يكون الربح موجبًا؟\nالإجابة النموذجية: س² − 12س + 20 < 0 ← 2 < س < 10\n3) [مستوى الاستدلال] لماذا نستبعد القيم السالبة في مسألة المستطيل؟\nالإجابة النموذجية: لأن العرض طول، والطول كمية موجبة.", "للطالب: تمارين 1-3: الأسئلة 4–6، وكتاب النشاط ص25–26 (كتاب الطالب ص32–36، كتاب النشاط ص22–26).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تطبيقات حياتية على المتباينات التربيعية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=3"]}]}, {"id": "1-4", "title": "جذور المعادلة التربيعية", "p": [{"ax": "المميّز وتحديد نوع الجذور وعددها", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يحسب المميّز ب² − 4أجـ لمعادلة تربيعية (15 دقيقة)\n2) يحدد عدد الجذور الحقيقية ونوعها من إشارة المميّز (5 دقائق)\nمخرج تعليمي آخر: يربط بين إشارة المميّز وعدد نقاط تقاطع المنحنى مع محور السينات (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المميّز، الجذران الحقيقيان المختلفان، الجذران المتساويان (الجذر المكرر)، لا جذور حقيقية.", "يعرض المعلم ثلاثة منحنيات: يقطع محور السينات في نقطتين، يمسه، لا يقطعه، ويسأل: كم حلًا لـ د(س) = 0 في كل حالة؟ ويربط الطالب عدد نقاط التقاطع بعدد الحلول. (5 دقائق)", "1. النمذجة: يقدم المعلم المميّز ب² − 4أجـ ويحسبه لثلاث معادلات: س² − 5س + 6 (1 > 0)، س² − 6س + 9 (0)، س² + س + 5 (−19 < 0) (المثال 14)، ويحسب الطالب المميّز ويصنف الجذور في جدول (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يطلب المعلم رسم المعادلات الثلاث على GeoGebra لتأكيد العلاقة بين إشارة المميّز ونقاط التقاطع، ويتحقق الطالب بالرسم ويكتب استنتاجه بلغته (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بالسؤال 1 من تمارين 1-4 (تقويم تكويني)، ويحل الطالب ويصحح مع زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-4: السؤال 1، وكتاب النشاط ص27، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] احسب المميّز للمعادلة 2س² + 3س − 5 = 0.\nالإجابة النموذجية: 9 − 4(2)(−5) = 49\n2) [مستوى التطبيق] ما نوع جذري المعادلة السابقة؟\nالإجابة النموذجية: حقيقيان مختلفان لأن المميّز موجب.\n3) [مستوى الاستدلال] بيّن أن المعادلة س² − 4س + 7 = 0 ليس لها جذور حقيقية.\nالإجابة النموذجية: المميّز = 16 − 28 = −12 < 0", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان المميّز = 0 فللمعادلة جذران ___\nالإجابة النموذجية: حقيقيان متساويان\n2) [مستوى التطبيق] حدد نوع جذور 4س² − 12س + 9 = 0.\nالإجابة النموذجية: المميّز = 144 − 144 = 0، جذران متساويان\n3) [مستوى الاستدلال] كم مرة يقطع منحنى ص = س² + 2س + 3 محور السينات؟ فسّر.\nالإجابة النموذجية: لا يقطعه؛ المميّز = 4 − 12 = −8 < 0", "للطالب: تمارين 1-4: السؤال 1، وكتاب النشاط ص27 (كتاب الطالب ص37–41، كتاب النشاط ص27–30).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=4"]}, {"ax": "إيجاد قيمة ثابت مجهول بشرط نوع الجذور", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يكوّن معادلة أو متباينة في الثابت ك من شرط نوع الجذور (15 دقيقة)\n2) يجد قيم ك التي تجعل الجذرين متساويين أو حقيقيين أو غير حقيقيين (10 دقائق)\nمخرج تعليمي آخر: يبرر اختيار رمز التباين المناسب (> أو ≥ أو <) (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "الثابت المجهول، شرط الجذرين المتساويين (المميّز = 0)، شرط الجذرين الحقيقيين (المميّز ≥ 0)، شرط عدم وجود جذور حقيقية (المميّز < 0).", "يسأل المعلم: ما قيم ك التي تجعل ك² = 36؟ وما قيم ك التي تجعل ك² < 36؟ ويجيب الطالب ك = ±6، و −6 < ك < 6 مستفيدًا من الدرس السابق. (5 دقائق)", "1. النمذجة: ينمذج المعلم: س² + ك س + 9 = 0 لها جذران متساويان ← ك² − 36 = 0 ← ك = ±6 (المثال 15)، ويتابع الطالب ويحل مثالًا مشابهًا: س² − 8س + ك = 0 ← ك = 16 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على المجموعات مسائل: س² − 4س + ك = 0 ليس لها جذور حقيقية، و ك س² + 6س + 1 = 0 لها جذران حقيقيان (المثال 16)، وتحل: 16 − 4ك < 0 ← ك > 4؛ و 36 − 4ك ≥ 0 ← ك ≤ 9 مع ك ≠ 0 (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم الفرق بين «جذران حقيقيان» (≥ 0) و«جذران حقيقيان مختلفان» (> 0) (تقويم تكويني)، ويشرح الطالب الفرق بمثال من عنده (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-4: الأسئلة 2–5، وكتاب النشاط ص28، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] للمعادلة س² + 6س + ك = 0 جذران متساويان. أوجد ك.\nالإجابة النموذجية: 36 − 4ك = 0 ← ك = 9\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل س² − 4س + ك = 0 بلا جذور حقيقية.\nالإجابة النموذجية: 16 − 4ك < 0 ← ك > 4\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل 2س² + ك س + 2 = 0 لها جذران متساويان.\nالإجابة النموذجية: ك² − 16 = 0 ← ك = ±4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: شرط أن يكون للمعادلة جذران حقيقيان مختلفان هو المميّز ___ 0\nالإجابة النموذجية: >\n2) [مستوى التطبيق] أوجد ك إذا كان للمعادلة س² − 10س + ك = 0 جذران متساويان.\nالإجابة النموذجية: 100 − 4ك = 0 ← ك = 25\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل س² + ك س + 4 = 0 لها جذران حقيقيان مختلفان.\nالإجابة النموذجية: ك² − 16 > 0 ← ك < −4 أو ك > 4", "للطالب: تمارين 1-4: الأسئلة 2–5، وكتاب النشاط ص28 (كتاب الطالب ص37–41، كتاب النشاط ص27–30).\nلولي الأمر: متابعة تقدم الابن/الابنة في «إيجاد قيمة ثابت مجهول بشرط نوع الجذور» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=4"]}, {"ax": "تطبيقات المميّز ومسائل كتاب النشاط", "wk": "الأسبوع الثاني (13–17/9/2026م)", "f": ["1) يستخدم المميّز للحكم على إمكانية تحقق موقف حياتي (10 دقائق)\n2) يحل مسائل متنوعة على الجذور من كتاب النشاط (15 دقيقة)\nمخرج تعليمي آخر: يقيّم ادعاءً رياضيًا حول جذور معادلة باستخدام المميّز (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورقة تنظيم الحل\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحكم بالمميّز، إمكانية تحقق الموقف، الادعاء الرياضي، البرهان المختصر.", "يسأل المعلم: هل يمكن أن تصل كرة ارتفاعها ع = 20ن − 5ن² إلى ارتفاع 25 م؟ كيف نتأكد دون رسم؟ ويقترح الطالب كتابة معادلة واستخدام المميّز. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى 5ن² − 20ن + 25 = 0 ← ن² − 4ن + 5 = 0، المميّز = 16 − 20 = −4 < 0، فلا تصل الكرة إلى 25 م، ويفسر الطالب النتيجة بربطها بأقصى ارتفاع (20 م) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: توزع مسائل كتاب النشاط ص29–30 على المجموعات مع ورقة تنظيم الحل، وتحل المجموعة وتعرض حلًا واحدًا على السبورة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تقييم ادعاء: يعرض المعلم ادعاء: «المعادلة س² + ك س − 1 = 0 لها جذران حقيقيان مختلفان لكل قيم ك» ويطلب الحكم (تقويم تكويني)، ويبرهن الطالب: المميّز = ك² + 4 > 0 دائمًا، فالادعاء صحيح (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-4 ومحور «تطبيقات المميّز ومسائل كتاب النشاط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-4: الأسئلة 6–11، وكتاب النشاط ص29–30، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – تحدي العدد 11: تتسابق المجموعات في حساب مميز معادلات معاملها الأوسط 11 (عدد محافظات سلطنة عمان) مثل س² + 11س + 30 = 0، وتحدد عدد الجذور ونوعها لكل معادلة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل تصل الكرة ع = 20ن − 5ن² إلى ارتفاع 20 م؟ كم مرة؟\nالإجابة النموذجية: ن² − 4ن + 4 = 0، المميّز = 0، تصل مرة واحدة عند ن = 2.\n2) [مستوى التطبيق] بيّن أن س² + ك س − 1 = 0 لها جذران مختلفان لكل ك.\nالإجابة النموذجية: المميّز = ك² + 4 > 0\n3) [مستوى الاستدلال] متى يكون للمعادلة س² − 2س + ك = 0 جذر مكرر؟ وما هو؟\nالإجابة النموذجية: ك = 1، والجذر س = 1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المميّز للمعادلة ن² − 4ن + 5 = 0 يساوي ___\nالإجابة النموذجية: −4\n2) [مستوى التطبيق] هل تصل الكرة ع = 20ن − 5ن² إلى 15 م؟ استخدم المميّز.\nالإجابة النموذجية: ن² − 4ن + 3 = 0، المميّز = 4 > 0، نعم مرتين (ن = 1 و ن = 3).\n3) [مستوى الاستدلال] أثبت أن المعادلة س² + 2ك س + ك² + 1 = 0 ليس لها جذور حقيقية لأي ك.\nالإجابة النموذجية: المميّز = 4ك² − 4(ك² + 1) = −4 < 0", "للطالب: تمارين 1-4: الأسئلة 6–11، وكتاب النشاط ص29–30 (كتاب الطالب ص37–41، كتاب النشاط ص27–30).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=4"]}]}, {"id": "1-5", "title": "حلّ المعادلات الآنية (معادلة خطية ومعادلة تربيعية)", "p": [{"ax": "طريقة التعويض عندما تكون ص معطاة بدلالة س", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل زوجًا من المعادلات الآنية (خطية وتربيعية) بطريقة التعويض (15 دقيقة)\n2) يجد قيمة ص المقابلة لكل قيمة من قيم س ويكتب الحلول أزواجًا مرتبة (15 دقيقة)\nمخرج تعليمي آخر: يفسر سبب وجود أكثر من زوج حل (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "المعادلات الآنية، طريقة التعويض، الزوج المرتب، المعادلة الخطية، المعادلة التربيعية.", "يطرح المعلم حل نظام خطي سريع: ص = س + 1 و ص = 3س − 5، ويسأل: كم حلًا للنظام؟ ولماذا؟ ويحل الطالب بالتعويض فيجد (3، 4)، ويذكر أن المستقيمين يتقاطعان في نقطة واحدة. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل ص = 2س − 1 و ص = س² − 4: س² − 4 = 2س − 1 ← س² − 2س − 3 = 0 ← (س − 3)(س + 1) = 0، ثم ص = 5 أو ص = −3، فالحلان (3، 5) و (−1، −3)، ويدوّن الطالب الخطوات ويتحقق من كل زوج في المعادلتين (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يقدم المعلم نظامًا مشابهًا: ص = س + 2 و ص = س² ويوجه الطلبة خطوة خطوة، ويحل الطالب: س² − س − 2 = 0 ← س = 2 أو −1، الحلان (2، 4) و (−1، 1) (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: السؤال 1 (أ–ج)، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: ص = س + 2 و ص = س²\nالإجابة النموذجية: (2، 4) و (−1، 1)\n2) [مستوى التطبيق] حل: ص = 3س و ص = س² + 2\nالإجابة النموذجية: س² − 3س + 2 = 0 ← س = 1 أو 2، الحلان (1، 3) و (2، 6)\n3) [مستوى الاستدلال] تحقق من أن (3، 5) حل للنظام ص = 2س − 1 و ص = س² − 4.\nالإجابة النموذجية: 5 = 2(3) − 1 ✓ و 5 = 9 − 4 ✓", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عند حل ص = س و ص = س² نحصل على س = 0 أو س = ___\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] حل: ص = س − 1 و ص = س² − 3س + 2\nالإجابة النموذجية: س² − 4س + 3 = 0 ← (1، 0) و (3، 2)\n3) [مستوى الاستدلال] حل: ص = 2س + 3 و ص = س² + 2س − 1\nالإجابة النموذجية: س² − 4 = 0 ← (2، 7) و (−2، −1)", "للطالب: تمارين 1-5: السؤال 1 (أ–ج) (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «طريقة التعويض عندما تكون ص معطاة بدلالة س».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "إعادة ترتيب المعادلة الخطية قبل التعويض", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يجعل أحد المتغيرين موضوعًا للمعادلة الخطية قبل التعويض (15 دقيقة)\n2) يختار المتغير الأنسب لعزله لتسهيل الحل (5 دقائق)\nمخرج تعليمي آخر: يحل أنظمة تتضمن حاصل ضرب المتغيرين س ص (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات أنظمة", "موضوع المعادلة، عزل المتغير، التعويض، النظام المتماثل.", "يكتب المعلم: س + ص = 5، ويسأل: كيف نكتب ص بدلالة س؟ وكيف نكتب س بدلالة ص؟ ويكتب الطالب ص = 5 − س و س = 5 − ص. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل س + ص = 5 و س ص = 6: ص = 5 − س ← س(5 − س) = 6 ← س² − 5س + 6 = 0 ← (2، 3) و (3، 2) (المثال 17)، ويتابع الطالب ويلاحظ تماثل الحلين (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم أنظمة مثل: 2س + ص = 7 و س² + ص = 10، و س − ص = 1 و س ص = 12، ويطلب من كل مجموعة اختيار المتغير الأسهل للعزل، وتحل المجموعة وتبرر اختيارها: من الأولى ص = 7 − 2س ← س² − 2س − 3 = 0 ← (3، 1) و (−1، 9) (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: السؤال 1 (د–و)، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] من س − ص = 1 اكتب س بدلالة ص.\nالإجابة النموذجية: س = ص + 1\n2) [مستوى التطبيق] حل: س − ص = 1 و س ص = 12\nالإجابة النموذجية: (ص + 1)ص = 12 ← ص² + ص − 12 = 0 ← ص = 3 أو −4، الحلان (4، 3) و (−3، −4)\n3) [مستوى الاستدلال] حل: 2س + ص = 7 و س² + ص = 10\nالإجابة النموذجية: ص = 7 − 2س ← س² − 2س − 3 = 0 ← (3، 1) و (−1، 9)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: من 3س + ص = 4 يكون ص = ___\nالإجابة النموذجية: 4 − 3س\n2) [مستوى التطبيق] حل: س + ص = 7 و س ص = 10\nالإجابة النموذجية: س² − 7س + 10 = 0 ← (2، 5) و (5، 2)\n3) [مستوى الاستدلال] حل: س + 2ص = 5 و س ص = 2\nالإجابة النموذجية: س = 5 − 2ص ← 2ص² − 5ص + 2 = 0 ← ص = 2 أو 1/2، الحلان (1، 2) و (4، 1/2)", "للطالب: تمارين 1-5: السؤال 1 (د–و) (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «إعادة ترتيب المعادلة الخطية قبل التعويض» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "أنظمة تتضمن س² + ص²", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل نظامًا من معادلة خطية ومعادلة على الصورة س² + ص² = ك (15 دقيقة)\n2) يفك مربع ذات الحدين بدقة أثناء التعويض (10 دقائق)\nمخرج تعليمي آخر: يحلل الخطأ الناتج عن فك (أ − ب)² بصورة غير صحيحة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "مربع ذات الحدين، التعويض، تبسيط المعادلة، القسمة على العامل المشترك.", "يطلب المعلم فك (7 − س)² ويسأل: هل يساوي 49 − س²؟ ويفك الطالب: 49 − 14س + س² ويكتشف أن الحد الأوسط ضروري. (5 دقائق)", "1. النمذجة: ينمذج المعلم حل س + ص = 7 و س² + ص² = 25: ص = 7 − س ← س² + 49 − 14س + س² = 25 ← 2س² − 14س + 24 = 0 ← س² − 7س + 12 = 0 ← (3، 4) و (4، 3)، ويتابع الطالب ويلاحظ القسمة على 2 لتبسيط المعادلة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: يقدم المعلم نظامين لكل زوج: ص = س + 1 و س² + ص² = 13، و س − ص = 2 و س² + ص² = 20، ويحل الزوجان: 2س² + 2س − 12 = 0 ← (2، 3) و (−3، −2)؛ والثاني ← (4، 2) و (−2، −4) (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تحليل خطأ: يعرض المعلم حلًا عوّض فيه (س + 1)² = س² + 1، ويطلب تحديد الخطأ وأثره (تقويم تكويني)، ويصحح الطالب الخطأ ويعيد الحل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: السؤال 2، وكتاب النشاط ص31 (البنود الأولى)، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] فك: (س + 1)²\nالإجابة النموذجية: س² + 2س + 1\n2) [مستوى التطبيق] حل: ص = س + 1 و س² + ص² = 13\nالإجابة النموذجية: 2س² + 2س − 12 = 0 ← س² + س − 6 = 0 ← (2، 3) و (−3، −2)\n3) [مستوى الاستدلال] حل: س − ص = 2 و س² + ص² = 20\nالإجابة النموذجية: س = ص + 2 ← 2ص² + 4ص − 16 = 0 ← ص = 2 أو −4، الحلان (4، 2) و (−2، −4)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: (5 − س)² = 25 − ___ + س²\nالإجابة النموذجية: 10س\n2) [مستوى التطبيق] حل: س + ص = 5 و س² + ص² = 13\nالإجابة النموذجية: 2س² − 10س + 12 = 0 ← (2، 3) و (3، 2)\n3) [مستوى الاستدلال] حل: ص = س − 1 و س² + ص² = 25\nالإجابة النموذجية: 2س² − 2س − 24 = 0 ← س² − س − 12 = 0 ← (4، 3) و (−3، −4)", "للطالب: تمارين 1-5: السؤال 2، وكتاب النشاط ص31 (البنود الأولى) (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «أنظمة تتضمن س² + ص²».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "مسائل حياتية تؤدي إلى معادلات آنية", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يترجم مسألة لفظية إلى معادلتين آنيتين (15 دقيقة)\n2) يحل النظام ويفسر الحلول في سياق المسألة (10 دقائق)\nمخرج تعليمي آخر: يصوغ مسألة حياتية يمكن حلها بنظام آني (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم المبني على المشاريع", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "الترجمة الرياضية، المحيط، المساحة، مجموع عددين وحاصل ضربهما، التحقق من السياق.", "يعرض المعلم مخطط أرض زراعية مستطيلة في ولاية نزوى محيطها 22 م ومساحتها 30 م² ويسأل: ما بعداها؟ ويقترح الطالب تسمية الطول س والعرض ص. (5 دقائق)", "1. حل مشكلة: يقود الطلبة إلى: س + ص = 11 و س ص = 30 ← س² − 11س + 30 = 0 ← البعدان 5 م و 6 م، ويكوّن الطالب المعادلتين ويحل ويتحقق من المحيط والمساحة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل: عددان مجموعهما 16 وحاصل ضربهما 28؛ ومربعان مجموع مساحتيهما 61 سم² ومجموع ضلعيهما 11 سم، وتحل المجموعة: العددان 14 و 2؛ الضلعان 5 و 6 (لأن 25 + 36 = 61) (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. صياغة مسألة: يطلب المعلم من كل طالب صياغة مسألة لفظية تؤدي إلى س + ص = 9 و س ص = 20 (تقويم تكويني)، ويصوغ الطالب المسألة ويتبادلها مع زميله لحلها (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-5: السؤالان 3 و 4، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عددان مجموعهما 16 وحاصل ضربهما 28، اكتب النظام.\nالإجابة النموذجية: س + ص = 16 و س ص = 28\n2) [مستوى التطبيق] حل النظام السابق.\nالإجابة النموذجية: س² − 16س + 28 = 0 ← (س − 14)(س − 2) = 0، العددان 14 و 2\n3) [مستوى الاستدلال] مستطيل محيطه 22 م ومساحته 30 م². أوجد بعديه.\nالإجابة النموذجية: 5 م و 6 م", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: محيط مستطيل بعداه س و ص هو ___\nالإجابة النموذجية: 2(س + ص)\n2) [مستوى التطبيق] عددان الفرق بينهما 3 وحاصل ضربهما 40، أوجدهما (موجبين).\nالإجابة النموذجية: س − ص = 3 ← ص² + 3ص − 40 = 0 ← ص = 5، س = 8\n3) [مستوى الاستدلال] مستطيل قطره 13 سم ومحيطه 34 سم. أوجد بعديه.\nالإجابة النموذجية: س + ص = 17 و س² + ص² = 169 ← البعدان 5 سم و 12 سم", "للطالب: تمارين 1-5: السؤالان 3 و 4 (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "حل تمارين كتاب النشاط ومعالجة الأخطاء الشائعة", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يحل تمارين كتاب النشاط على المعادلات الآنية بدقة (15 دقيقة)\n2) يكتشف الأخطاء الشائعة في حلول جاهزة ويصححها (15 دقيقة)\nمخرج تعليمي آخر: يتحقق من صحة الحل بالتعويض في المعادلتين (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات محطات الأخطاء", "التحقق من الحل، الأخطاء الشائعة، التعويض العكسي، الحل الكامل.", "يعرض المعلم حلًا ناقصًا يذكر قيمتي س فقط، ويسأل: هل الحل مكتمل؟ ويجيب الطالب بأن الحل يحتاج قيم ص المقابلة. (5 دقائق)", "1. تعلم ذاتي: يكلف الطلبة بحل تمارين كتاب النشاط ص31 فرديًا، ويقسمهم بحسب المستوى: دعم (أنظمة ص بدلالة س)، متوقع (عزل)، متقدم (س² + ص²)، ويحل الطالب التمارين المناسبة لمستواه، ويستخدم بطاقة مساعدة عند الحاجة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. محطات الأخطاء: يعد المعلم 3 محطات لكل منها حل خاطئ (خطأ في الإشارة، خطأ في فك القوس، نسيان ص)، وتنتقل المجموعات بين المحطات، وتكتشف المجموعة الخطأ في كل محطة وتكتب التصحيح (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مراجعة: يناقش المعلم أبرز الأخطاء ويثبت قاعدة التحقق (تقويم تكويني)، ويدوّن الطالب قاعدة التحقق في دفتره (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تمارين كتاب النشاط ص31، وتمارين 1-5 السؤال 5، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حدد الخطأ: ص = س + 1 و ص = س² − 1 ← س² − س − 2 = 0 ← س = 2 أو س = −1 (انتهى الحل).\nالإجابة النموذجية: الحل ناقص؛ يجب إيجاد ص لكل قيمة: الحلان (2، 3) و (−1، 0).\n2) [مستوى التطبيق] حل: ص = 4 − س و ص = س² − 2\nالإجابة النموذجية: س² + س − 6 = 0 ← (2، 2) و (−3، 7)\n3) [مستوى الاستدلال] تحقق من أن (−3، 7) يحقق المعادلتين السابقتين.\nالإجابة النموذجية: 7 = 4 − (−3) ✓ و 7 = 9 − 2 ✓", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: بعد إيجاد قيم س نعوّض في المعادلة ___ لإيجاد ص.\nالإجابة النموذجية: الخطية\n2) [مستوى التطبيق] حل: ص = س + 4 و ص = س² − 2س\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 8) و (−1، 3)\n3) [مستوى الاستدلال] حل: 2س − ص = 1 و س ص = 3\nالإجابة النموذجية: ص = 2س − 1 ← 2س² − س − 3 = 0 ← (3/2، 2) و (−1، −3)", "للطالب: إكمال تمارين كتاب النشاط ص31، وتمارين 1-5 السؤال 5 (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: متابعة تقدم الابن/الابنة في «حل تمارين كتاب النشاط ومعالجة الأخطاء الشائعة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}, {"ax": "التفسير البياني للحل الآني ومراجعة الدرس", "wk": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1) يفسر حل النظام الآني بيانيًا بوصفه نقاط تقاطع المستقيم مع المنحنى (15 دقيقة)\n2) يتحقق من الحل الجبري باستخدام الرسم البياني (10 دقائق)\nمخرج تعليمي آخر: يتنبأ بعدد الحلول من الرسم قبل الحل الجبري (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "نقطة التقاطع، التمثيل البياني للنظام، عدد الحلول، التحقق البياني.", "يعرض المعلم على GeoGebra المنحنى ص = س² − 4 والمستقيم ص = 2س − 1 ويسأل: أين يلتقيان؟ قارن بحل الحصة الأولى، ويلاحظ الطالب أن نقطتي التقاطع (3، 5) و (−1، −3) هما الحلان. (5 دقائق)", "1. اكتشاف: يطلب المعلم من المجموعات تحريك المستقيم ص = 2س + ج على GeoGebra وملاحظة تغير عدد نقاط التقاطع، وتسجل المجموعة: نقطتان، نقطة واحدة، لا تقاطع، تمهيدًا للدرس 1-6 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مراجعة: يدير المعلم مراجعة سريعة على أنواع الأنظمة التي درست في الدرس (ص بدلالة س، عزل، س ص، س² + ص²)، ويحل الطالب مثالًا لكل نوع على السبورة الصغيرة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. المعلم: يختار المعلم الدرس 1-5 ومحور «التفسير البياني للحل الآني ومراجعة الدرس»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: مراجعة الدرس: تمارين 1-5 كاملة، والاستعداد للدرس 1-6 بقراءة ص44، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – حديقة في مسقط: يحل كل زوج لغز حديقة مستطيلة في متنزه عام محيطها 20 م ومساحتها 21 م² بالمعادلتين س + ص = 10 و س ص = 21، ثم يقترح سلوكًا يحافظ على المرافق العامة (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ماذا تمثل حلول النظام ص = س + 2 و ص = س² بيانيًا؟\nالإجابة النموذجية: نقطتي تقاطع المستقيم مع المنحنى: (2، 4) و (−1، 1)\n2) [مستوى التطبيق] من الرسم: المستقيم ص = −1 والمنحنى ص = س². كم حلًا للنظام؟\nالإجابة النموذجية: لا حلول، لأن س² ≥ 0 دائمًا والمستقيم تحت المحور.\n3) [مستوى الاستدلال] حل جبريًا: ص = 4 و ص = س² وفسّر بيانيًا.\nالإجابة النموذجية: س = ±2، المستقيم الأفقي يقطع المنحنى في (2، 4) و (−2، 4)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عدد حلول النظام الآني يساوي عدد نقاط ___ بين المستقيم والمنحنى.\nالإجابة النموذجية: التقاطع\n2) [مستوى التطبيق] حل: ص = 2س و ص = س² ثم صف التقاطع بيانيًا.\nالإجابة النموذجية: س² − 2س = 0 ← (0، 0) و (2، 4)، نقطتا تقاطع\n3) [مستوى الاستدلال] حل: ص = 2س − 1 و ص = س² وفسّر النتيجة.\nالإجابة النموذجية: س² − 2س + 1 = 0 ← س = 1 مكرر، حل واحد (1، 1)، المستقيم يمس المنحنى", "للطالب: مراجعة الدرس: تمارين 1-5 كاملة، والاستعداد للدرس 1-6 بقراءة ص44 (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=5"]}]}, {"id": "1-6", "title": "التقاطع بين مستقيم ومنحنى الدالة التربيعية", "p": [{"ax": "إيجاد إحداثيات نقاط التقاطع بين مستقيم ومنحنى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يجد إحداثيات نقاط تقاطع مستقيم مع منحنى دالة تربيعية جبريًا (15 دقيقة)\n2) يمثل المستقيم والمنحنى بيانيًا ويحدد نقاط التقاطع (10 دقائق)\nمخرج تعليمي آخر: يقارن بين الحل الجبري والحل البياني من حيث الدقة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- عروض تقديمية\n- أخرى: ورقة العمل 1", "نقطة التقاطع، المساواة بين الدالتين، الحل الجبري، الحل البياني.", "يذكّر المعلم بالحصة الأخيرة من الدرس السابق: ما العلاقة بين حلول النظام الآني ونقاط التقاطع؟ ويجيب الطالب بأن كل حل يمثل نقطة تقاطع. (5 دقائق)", "1. النمذجة: ينمذج المعلم إيجاد تقاطع ص = س² − 3س + 2 و ص = س − 1: س² − 4س + 3 = 0 ← (1، 0) و (3، 2) (المثال 18)، ويعرض الرسم بالعرض التوضيحي (PPT)، ويحل الطالب جبريًا ثم يتحقق من الرسم (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم ورقة العمل 1 على المجموعات لإيجاد تقاطع ص = س² و ص = س + 6، و ص = س² − 4 و ص = 3س، وتحل المجموعة: (3، 9) و (−2، 4)؛ (4، 12) و (−1، −3) (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مقارنة: يسأل المعلم: متى يكون الحل البياني غير دقيق؟ (تقويم تكويني)، ويجيب الطالب: عندما تكون الإحداثيات كسرية أو جذرية (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: السؤال 1، وكتاب النشاط ص32، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد تقاطع ص = س² و ص = س + 6.\nالإجابة النموذجية: س² − س − 6 = 0 ← (3، 9) و (−2، 4)\n2) [مستوى التطبيق] أوجد تقاطع ص = س² − 4 و ص = 3س.\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 12) و (−1، −3)\n3) [مستوى الاستدلال] لماذا نفضل الحل الجبري على البياني أحيانًا؟\nالإجابة النموذجية: لأنه يعطي قيمًا دقيقة، بينما الرسم يعطي قيمًا تقريبية.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: لإيجاد نقاط التقاطع نساوي ___ بين المعادلتين.\nالإجابة النموذجية: ص\n2) [مستوى التطبيق] أوجد تقاطع ص = س² + 1 و ص = 2س + 4.\nالإجابة النموذجية: س² − 2س − 3 = 0 ← (3، 10) و (−1، 2)\n3) [مستوى الاستدلال] أوجد تقاطع ص = 2س² و ص = 3س + 2.\nالإجابة النموذجية: 2س² − 3س − 2 = 0 ← (2، 8) و (−1/2، 1/2)", "للطالب: تمارين 1-6: السؤال 1، وكتاب النشاط ص32 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «إيجاد إحداثيات نقاط التقاطع بين مستقيم ومنحنى».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "استخدام المميّز لتحديد عدد نقاط التقاطع (قاطع، مماس، لا تقاطع)", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يستخدم مميّز المعادلة الناتجة لتحديد عدد نقاط التقاطع (5 دقائق)\n2) يميّز بين المستقيم القاطع والمستقيم المماس والمستقيم الذي لا يقطع المنحنى (15 دقيقة)\nمخرج تعليمي آخر: يجد نقطة التماس عندما يكون المميّز صفرًا (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- أخرى: بطاقات تصنيف", "المستقيم القاطع، المماس، نقطة التماس، المميّز، عدد نقاط التقاطع.", "يعرض المعلم على GeoGebra منحنى ص = س² + 4 ومستقيمات مختلفة ميلها 2، ويسأل: متى يمس المستقيم المنحنى؟ ويلاحظ الطالب وجود موضع واحد يلامس فيه المستقيم المنحنى. (5 دقائق)", "1. النمذجة: ينمذج المعلم: ص = س² + 4 و ص = 2س + 3 ← س² − 2س + 1 = 0، المميّز = 0، فالمستقيم مماس عند (1، 5) (المثال 19)، ويحسب الطالب المميّز ويجد نقطة التماس (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصنيف: يوزع المعلم بطاقات أزواج (مستقيم، منحنى) على المجموعات لتصنيفها: قاطع / مماس / لا يقطع، باستخدام المميّز، وتحسب المجموعة المميّز لكل بطاقة وتصنفها في جدول (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: السؤالان 2 و 3، وكتاب النشاط ص33، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حدد عدد نقاط تقاطع ص = س² و ص = 2س − 5.\nالإجابة النموذجية: س² − 2س + 5 = 0، المميّز = 4 − 20 = −16 < 0، لا تقاطع\n2) [مستوى التطبيق] بيّن أن ص = 4س − 4 مماس للمنحنى ص = س².\nالإجابة النموذجية: س² − 4س + 4 = 0، المميّز = 0\n3) [مستوى الاستدلال] أوجد نقطة التماس في السؤال السابق.\nالإجابة النموذجية: س = 2، ص = 4، النقطة (2، 4)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان المميّز موجبًا فالمستقيم ___ المنحنى في نقطتين.\nالإجابة النموذجية: يقطع\n2) [مستوى التطبيق] هل المستقيم ص = س + 1 يقطع المنحنى ص = س² + 3؟\nالإجابة النموذجية: س² − س + 2 = 0، المميّز = 1 − 8 = −7 < 0، لا يقطعه\n3) [مستوى الاستدلال] بيّن أن ص = −2س − 1 مماس للمنحنى ص = س² وأوجد نقطة التماس.\nالإجابة النموذجية: س² + 2س + 1 = 0، المميّز = 0، النقطة (−1، 1)", "للطالب: تمارين 1-6: السؤالان 2 و 3، وكتاب النشاط ص33 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «استخدام المميّز لتحديد عدد نقاط التقاطع (قاطع، مماس، لا تقاطع)» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "إيجاد قيم ثابت مجهول بشرط التماس أو عدم التقاطع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يكوّن معادلة تربيعية في س تتضمن ثابتًا مجهولًا من شرط التقاطع (15 دقيقة)\n2) يجد قيم الثابت التي تجعل المستقيم مماسًا أو قاطعًا أو لا يقطع المنحنى (15 دقيقة)\nمخرج تعليمي آخر: يفسر النتائج بيانيًا بتحريك المستقيم (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "ثابت مجهول، شرط التماس (المميّز = 0)، شرط التقاطع في نقطتين (المميّز > 0)، شرط عدم التقاطع (المميّز < 0).", "يسأل المعلم: ما قيم ك التي تجعل ك² − 4 = 0؟ وما قيمها التي تجعل ك² − 4 < 0؟ ويجيب الطالب ك = ±2، و −2 < ك < 2. (5 دقائق)", "1. النمذجة: ينمذج المعلم: المستقيم ص = ك س يمس المنحنى ص = س² + 1 ← س² − ك س + 1 = 0 ← ك² − 4 = 0 ← ك = ±2 (المثال 20)، ويتابع الطالب ويتحقق بيانيًا من المماسين (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يقدم المعلم مسألة: ص = س + ك لا يقطع ص = س²؛ وأخرى: ص = 2س + ك يقطع ص = س² − 3 في نقطتين (المثال 21)، وتحل المجموعة: س² − س − ك = 0 ← 1 + 4ك < 0 ← ك < −1/4؛ و س² − 2س − 3 − ك = 0 ← 4 + 4(3 + ك) > 0 ← ك > −4 (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: الأسئلة 4–6، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ك إذا كان ص = س + ك مماسًا للمنحنى ص = س².\nالإجابة النموذجية: س² − س − ك = 0 ← 1 + 4ك = 0 ← ك = −1/4\n2) [مستوى التطبيق] أوجد قيم ك التي تجعل ص = ك س يقطع ص = س² + 4 في نقطتين.\nالإجابة النموذجية: ك² − 16 > 0 ← ك < −4 أو ك > 4\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل ص = 2س + ك لا يقطع ص = س².\nالإجابة النموذجية: س² − 2س − ك = 0 ← 4 + 4ك < 0 ← ك < −1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: شرط أن يكون المستقيم مماسًا للمنحنى هو المميّز = ___\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد ك إذا كان ص = 4س + ك مماسًا للمنحنى ص = س².\nالإجابة النموذجية: 16 + 4ك = 0 ← ك = −4\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل ص = ك س − 1 لا يقطع ص = س².\nالإجابة النموذجية: س² − ك س + 1 = 0 ← ك² − 4 < 0 ← −2 < ك < 2", "للطالب: تمارين 1-6: الأسئلة 4–6 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد قيم ثابت مجهول بشرط التماس أو عدم التقاطع».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "تطبيقات حياتية وتصميمية على تقاطع المستقيم والمنحنى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) ينمذج موقفًا حياتيًا (جسر مقوس، مسار كرة، منحدر) بمستقيم ومنحنى (15 دقيقة)\n2) يحدد نقاط التقاطع ويفسرها في السياق (5 دقائق)\nمخرج تعليمي آخر: يصمم شكلًا زخرفيًا بسيطًا باستخدام مستقيم ومنحنى تربيعي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- صورة توضيحية", "النمذجة، المسار، المنحدر، التصميم الهندسي، تفسير نقاط التقاطع.", "يعرض المعلم صورة جسر مقوس فوق طريق مستقيم ويسأل: أين يلتقي القوس بالطريق؟ ويربط الطالب نقاط الالتقاء بنقاط التقاطع. (5 دقائق)", "1. حل مشكلة: يعرض المعلم مسألة: قوس جسر ص = −0.1س² + 2س ومنحدر ص = 0.5س. أين يلتقيان؟ ← 0.1س² − 1.5س = 0 ← س = 0 أو س = 15، النقطة (15، 7.5)، ويحل الطالب ويفسر نقطتي الالتقاء في السياق (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. مشروع مصغر: يكلف كل مجموعة بتصميم شعار بسيط يتكون من منحنى تربيعي ومستقيمين أحدهما مماس، وكتابة معادلاتهم والتحقق جبريًا، وتصمم المجموعة الشعار على GeoGebra وتتحقق من التماس بالمميّز (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: يعرض المعلم أعمال مجموعتين ويطلب تعليق الزملاء (تقويم تكويني)، وتعرض المجموعة وتجيب عن الأسئلة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: كتاب النشاط ص34، وإكمال تصميم الشعار، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد نقاط التقاطع بين ص = −0.1س² + 2س و ص = 0.5س.\nالإجابة النموذجية: (0، 0) و (15، 7.5)\n2) [مستوى التطبيق] ماذا تمثل النقطة (15، 7.5) في السياق؟\nالإجابة النموذجية: نقطة التقاء المنحدر بقوس الجسر على بعد 15 م أفقيًا وارتفاع 7.5 م.\n3) [مستوى الاستدلال] اقترح مستقيمًا أفقيًا يمس المنحنى ص = −0.1س² + 2س.\nالإجابة النموذجية: أعلى نقطة عند س = 10، ص = 10، فالمستقيم ص = 10", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المستقيم الأفقي المماس لقمة القوس يمر بنقطة القيمة ___\nالإجابة النموذجية: العظمى\n2) [مستوى التطبيق] هل يقطع المستقيم ص = 12 القوس ص = −0.1س² + 2س؟\nالإجابة النموذجية: 0.1س² − 2س + 12 = 0، المميّز = 4 − 4.8 < 0، لا يقطعه (القوس أعلاه 10 م).\n3) [مستوى الاستدلال] صمم مستقيمًا يقطع المنحنى ص = س² في نقطتين إحداهما (1، 1)، واكتب معادلته وتحقق.\nالإجابة النموذجية: مثلًا ص = س² و ص = 3س − 2 ← س² − 3س + 2 = 0 ← (1، 1) و (2، 4)", "للطالب: كتاب النشاط ص34، وإكمال تصميم الشعار (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "حل تمارين الدرس وكتاب النشاط", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحل تمارين الدرس 1-6 المتنوعة بدقة (15 دقيقة)\n2) يختار الطريقة المناسبة (حل جبري أم مميّز) بحسب المطلوب (15 دقيقة)\nمخرج تعليمي آخر: يقيّم حلول زملائه ويقدم تغذية راجعة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الأقلام", "التقاطع، المماس، المميّز، اختيار الاستراتيجية، التغذية الراجعة بين الأقران.", "يطرح المعلم سؤال تمييز: «أوجد نقاط التقاطع» و«أوجد عدد نقاط التقاطع»؛ ما الفرق في طريقة الحل؟ ويوضح الطالب أن الأول يحتاج حلًا كاملًا والثاني يكفيه المميّز. (5 دقائق)", "1. تعلم ذاتي: يكلف الطلبة بتمارين 1-6 المتبقية مع تدرج المستويات، ويتابع المتعثرين في مجموعة صغيرة، ويحل الطالب فرديًا وفق مستواه (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تقييم الأقران: يتبادل الطلبة الدفاتر ويصحح كل منهم حل زميله وفق نموذج إجابة معروض، ويصحح الطالب ويكتب ملاحظة بنّاءة (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تمارين 1-6، والبدء بتمارين مراجعة نهاية الوحدة ص50–51، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] كم نقطة تقاطع بين ص = 3س + 1 و ص = س² + س + 2؟\nالإجابة النموذجية: س² − 2س + 1 = 0، المميّز = 0، نقطة واحدة (1، 4)\n2) [مستوى التطبيق] أوجد نقاط تقاطع ص = 5 − س و ص = س² − 1.\nالإجابة النموذجية: س² + س − 6 = 0 ← (2، 3) و (−3، 8)\n3) [مستوى الاستدلال] أوجد ك إذا كان ص = س + ك مماسًا للمنحنى ص = س² + 3س.\nالإجابة النموذجية: س² + 2س − ك = 0 ← 4 + 4ك = 0 ← ك = −1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: سؤال «كم نقطة تقاطع؟» يكفي فيه حساب ___\nالإجابة النموذجية: المميّز\n2) [مستوى التطبيق] أوجد نقاط تقاطع ص = 2س + 3 و ص = س² .\nالإجابة النموذجية: س² − 2س − 3 = 0 ← (3، 9) و (−1، 1)\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل ص = ك يقطع ص = س² − 6س في نقطتين.\nالإجابة النموذجية: س² − 6س − ك = 0 ← 36 + 4ك > 0 ← ك > −9", "للطالب: إكمال تمارين 1-6، والبدء بتمارين مراجعة نهاية الوحدة ص50–51 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: متابعة تقدم الابن/الابنة في «حل تمارين الدرس وكتاب النشاط» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}, {"ax": "مراجعة الوحدة الأولى (تمارين مراجعة نهاية الوحدة)", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يربط بين مفاهيم الوحدة: التحليل، القيم العظمى والصغرى، المتباينات، المميّز، التقاطع (10 دقائق)\n2) يحل أسئلة مراجعة متنوعة من نهاية الوحدة وكتاب النشاط (20 دقيقة)\nمخرج تعليمي آخر: يحدد نقاط قوته وضعفه في الوحدة ويضع خطة لمعالجتها (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "خريطة مفاهيم الوحدة، الدالة التربيعية، المميّز، المتباينة، التقاطع، التقويم الذاتي.", "يعرض المعلم خريطة مفاهيم ناقصة للوحدة على السبورة الذكية ويطلب إكمالها جماعيًا، ويكمل الطالب الخريطة بالمفاهيم والأمثلة. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص50–54 على المجموعات بحيث تأخذ كل مجموعة محورًا، وتحل المجموعة محورها وتجهز شرحًا موجزًا (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: تعرض كل مجموعة حلًا واحدًا لسؤال مميز، ويعلّق المعلم على الدقة والمصطلحات، وتشرح المجموعة وتجيب عن أسئلة زملائها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تقويم ذاتي: يوزع المعلم بطاقة تقويم ذاتي بعبارات «أستطيع أن...» لكل درس (تقويم تكويني)، ويقيم الطالب نفسه ويحدد الدروس التي يحتاج مراجعتها (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 1-6 ومحور «مراجعة الوحدة الأولى (تمارين مراجعة نهاية الوحدة)»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص50–54، وكتاب النشاط ص35–38، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n6. غلق الدرس – طريق فوق الوادي: تجد المجموعات نقاط تقاطع مستقيم يمثل طريقًا مع منحنى تربيعي يمثل مقطع وادٍ، ثم تناقش قاعدة السلامة الوطنية بعدم عبور الأودية أثناء جريانها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: س² − 7س + 10 = 0\nالإجابة النموذجية: س = 2 أو س = 5\n2) [مستوى التطبيق] أوجد قيمة ك التي تجعل س² + ك س + 16 = 0 لها جذران متساويان.\nالإجابة النموذجية: ك = ±8\n3) [مستوى الاستدلال] حل: س² − 7س + 10 > 0\nالإجابة النموذجية: س < 2 أو س > 5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: نقطة الصغرى للدالة د(س) = (س − 2)(س − 6) تقع عند س = ___\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد نقاط تقاطع ص = س² − 2س و ص = س + 4.\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 8) و (−1، 3)\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل المستقيم ص = ك س − 9 مماسًا للمنحنى ص = س².\nالإجابة النموذجية: س² − ك س + 9 = 0 ← ك² − 36 = 0 ← ك = ±6", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص50–54، وكتاب النشاط ص35–38 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=6"]}]}, {"id": "2-1", "title": "تعريف الدوال ومجالها ومداها", "p": [{"ax": "العلاقة والدالة وأنواع التطابق واختبار المستقيم الرأسي", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يميّز الدالة من العلاقة باستخدام المخطط السهمي واختبار المستقيم الرأسي (15 دقيقة)\n2) يصنف العلاقات: واحد إلى واحد، متعدد إلى واحد، واحد إلى متعدد، متعدد إلى متعدد (10 دقائق)\nمخرج تعليمي آخر: يستخدم اختبار المستقيم الأفقي للحكم على الدالة واحد إلى واحد (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "العلاقة، الدالة، المجال، المجال المقابل، واحد إلى واحد، متعدد إلى واحد، واحد إلى متعدد، متعدد إلى متعدد، اختبار المستقيم الرأسي، اختبار المستقيم الأفقي.", "يعرض المعلم جدولًا يربط كل طالب برقم مقعده، وآخر يربط كل طالب بهواياته، ويسأل: أي ربط يعطي ناتجًا واحدًا فقط لكل طالب؟ ويقارن الطالب بين الربطين ويستنتج فكرة «الناتج الوحيد». (5 دقائق)", "1. النمذجة: يعرّف المعلم الدالة بأنها علاقة تربط كل عنصر في المجال بعنصر واحد فقط في المجال المقابل، ويعرض مخططات سهمية للأنواع الأربعة (المثالان 1 و 2)، ويصنف الطالب المخططات السهمية المعروضة ويبرر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اكتشاف: يعرض المعلم على GeoGebra منحنيات (مستقيم، قطع مكافئ، دائرة) ويطبق اختبار المستقيم الرأسي ثم الأفقي، ويحكم الطالب على كل منحنى: الدائرة ليست دالة، والقطع المكافئ دالة متعدد إلى واحد، والمستقيم المائل دالة واحد إلى واحد (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق موجّه: يكلف الطلبة بالسؤال 1 من تمارين 2-1 (تقويم تكويني)، ويصنف الطالب العلاقات ويقارن مع زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: السؤالان 1 و 2، وكتاب النشاط ص39–40، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل العلاقة {(1، 2)، (2، 3)، (1، 4)} دالة؟ فسّر.\nالإجابة النموذجية: ليست دالة لأن العنصر 1 ارتبط بعنصرين 2 و 4.\n2) [مستوى التطبيق] ما نوع الدالة ص = س²، س ∈ ح؟\nالإجابة النموذجية: متعدد إلى واحد؛ لأن 2 و −2 لهما الصورة نفسها 4.\n3) [مستوى الاستدلال] هل الدائرة س² + ص² = 9 تمثل دالة؟\nالإجابة النموذجية: لا؛ المستقيم الرأسي س = 0 يقطعها في نقطتين.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الدالة التي يقطع منحناها أي مستقيم أفقي في نقطة واحدة على الأكثر تسمى دالة ___\nالإجابة النموذجية: واحد إلى واحد\n2) [مستوى التطبيق] صنف: ص = 2س + 3\nالإجابة النموذجية: دالة واحد إلى واحد\n3) [مستوى الاستدلال] ارسم مخططًا سهميًا لعلاقة متعدد إلى متعدد وبيّن لماذا ليست دالة.\nالإجابة النموذجية: عنصر في المجال يرتبط بعنصرين على الأقل، فهي ليست دالة.", "للطالب: تمارين 2-1: السؤالان 1 و 2، وكتاب النشاط ص39–40 (كتاب الطالب ص55–66، كتاب النشاط ص39–44).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «العلاقة والدالة وأنواع التطابق واختبار المستقيم الرأسي».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=7"]}, {"ax": "مجال ومدى الدوال الخطية والتربيعية ذات المجال المحدد", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يستخدم رمز الدالة د(س) لحساب صور عناصر المجال (5 دقائق)\n2) يحدد مدى دالة خطية أو تربيعية مجالها محدد (20 دقيقة)\nمخرج تعليمي آخر: يستعين بالتمثيل البياني لتحديد المدى بدقة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني", "رمز الدالة د(س)، الصورة، المجال المحدد، المدى، القيمة العظمى والصغرى ضمن المجال.", "يطرح المعلم: إذا كان د(س) = 2س + 1 فأوجد د(3) و د(−1)، ويعوض الطالب فيجد 7 و −1. (5 دقائق)", "1. النمذجة: ينمذج المعلم: د(س) = 2س + 1، −1 ≤ س ≤ 3 ← المدى −1 ≤ د(س) ≤ 7 لأن الدالة متزايدة (المثال 3)، ويمثل الطالب الدالة بيانيًا ويقرأ المدى من المحور الصادي (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم دوال تربيعية: د(س) = س² − 4س، س ∈ ح، و د(س) = س²، −2 ≤ س ≤ 3 (المثالان 4 و 5)، وتحدد المجموعة: الأولى نقطة صغرى (2، −4) فالمدى د(س) ≥ −4؛ الثانية المدى 0 ≤ د(س) ≤ 9 (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحليل خطأ: يعرض المعلم خطأ: مدى س² عندما −2 ≤ س ≤ 3 هو 4 ≤ د(س) ≤ 9، ويطلب التصحيح (تقويم تكويني)، ويصحح الطالب: أصغر قيمة 0 عند س = 0 (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: الأسئلة 3–5، وكتاب النشاط ص41–42، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د(−2) إذا كان د(س) = س² − 3س.\nالإجابة النموذجية: 4 + 6 = 10\n2) [مستوى التطبيق] أوجد مدى د(س) = 3 − س، 0 ≤ س ≤ 5.\nالإجابة النموذجية: −2 ≤ د(س) ≤ 3\n3) [مستوى الاستدلال] أوجد مدى د(س) = س² + 2، −1 ≤ س ≤ 2.\nالإجابة النموذجية: 2 ≤ د(س) ≤ 6", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مدى د(س) = 2س + 1 عندما 0 ≤ س ≤ 4 هو ___ ≤ د(س) ≤ ___\nالإجابة النموذجية: 1 و 9\n2) [مستوى التطبيق] أوجد مدى د(س) = س² − 6س + 5، س ∈ ح.\nالإجابة النموذجية: الجذران 1 و 5، الصغرى عند س = 3: د(3) = −4، المدى د(س) ≥ −4\n3) [مستوى الاستدلال] أوجد مدى د(س) = (س − 1)²، −2 ≤ س ≤ 2.\nالإجابة النموذجية: أصغر قيمة 0 عند س = 1، وأكبرها 9 عند س = −2، المدى 0 ≤ د(س) ≤ 9", "للطالب: تمارين 2-1: الأسئلة 3–5، وكتاب النشاط ص41–42 (كتاب الطالب ص55–66، كتاب النشاط ص39–44).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مجال ومدى الدوال الخطية والتربيعية ذات المجال المحدد» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=7"]}, {"ax": "مجال ومدى الدوال التبادلية والجذرية وتطبيقات حياتية", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يحدد مجال الدالة التبادلية بإبعاد القيم التي تجعل المقام صفرًا (5 دقائق)\n2) يحدد مجال الدالة الجذرية ومداها (10 دقائق)\nمخرج تعليمي آخر: يفسر المجال والمدى في سياق حياتي (تكلفة، زمن) (25 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الدالة التبادلية، الدالة الجذرية، القيم المستبعدة من المجال، المدى في السياق.", "يسأل المعلم: لماذا لا نستطيع حساب 1 ÷ 0؟ وما قيمة √(−4) في الأعداد الحقيقية؟ ويستنتج الطالب أن القسمة على الصفر غير معرفة، وأن الجذر التربيعي لعدد سالب غير حقيقي. (5 دقائق)", "1. النمذجة: ينمذج المعلم: د(س) = 1 ÷ (س − 2): المجال س ≠ 2، المدى د(س) ≠ 0؛ و هـ(س) = √(س − 3): المجال س ≥ 3، المدى هـ(س) ≥ 0، ويتابع الطالب ويطبق على د(س) = 3 ÷ (س + 1) (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يعرض المعلم مسألة: تكلفة رحلة مدرسية لكل طالب ت(ن) = 120 ÷ ن ريال حيث ن عدد الطلبة من 10 إلى 40؛ يطلب المجال والمدى وتفسيرهما، ويحدد الطالب المجال 10 ≤ ن ≤ 40 والمدى 3 ≤ ت ≤ 12 ويفسر: كلما زاد العدد قلت التكلفة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تطبيق فردي: يكلف المعلم بتمارين كتاب النشاط ص43–44 (تقويم تكويني)، ويحل الطالب فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. المعلم: يختار المعلم الدرس 2-1 ومحور «مجال ومدى الدوال التبادلية والجذرية وتطبيقات حياتية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 2-1: الأسئلة 6–9، وكتاب النشاط ص43–44، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. غلق الدرس – دالة الولاية والمحافظة: ترسم المجموعات مخططًا سهميًا يربط ولايات (نزوى، بهلا، صور، صلالة، صحار) بمحافظاتها، وتقرر هل هو دالة ونوعها، ثم تعكس الاتجاه وتختبر هل يبقى دالة (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما مجال د(س) = 5 ÷ (س + 4)؟\nالإجابة النموذجية: س ≠ −4\n2) [مستوى التطبيق] ما مجال ومدى د(س) = √(س − 1)؟\nالإجابة النموذجية: المجال س ≥ 1، المدى د(س) ≥ 0\n3) [مستوى الاستدلال] ت(ن) = 120 ÷ ن، 10 ≤ ن ≤ 40. أوجد المدى.\nالإجابة النموذجية: 3 ≤ ت(ن) ≤ 12", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مجال الدالة د(س) = 1 ÷ (س − 7) هو جميع الأعداد الحقيقية ما عدا ___\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] أوجد مجال ومدى د(س) = √(س + 2) + 1.\nالإجابة النموذجية: المجال س ≥ −2، المدى د(س) ≥ 1\n3) [مستوى الاستدلال] لماذا نقيد المجال في دالة التكلفة بأعداد صحيحة موجبة؟\nالإجابة النموذجية: لأن عدد الطلبة عدد صحيح موجب لا يكون كسرًا أو سالبًا.", "للطالب: تمارين 2-1: الأسئلة 6–9، وكتاب النشاط ص43–44 (كتاب الطالب ص55–66، كتاب النشاط ص39–44).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «مجال ومدى الدوال التبادلية والجذرية وتطبيقات حياتية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=7"]}]}, {"id": "2-2", "title": "الدوال المركّبة", "p": [{"ax": "معنى تركيب دالتين وحساب قيمة عددية للدالة المركّبة", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يفسر الدالة المركّبة هـ(د(س)) بوصفها تطبيق د أولًا ثم هـ (15 دقيقة)\n2) يحسب قيمة عددية لدالة مركّبة (15 دقيقة)\nمخرج تعليمي آخر: يستنتج أن تركيب الدوال ليس إبداليًا بوجه عام (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات الآلات", "الدالة المركّبة، ترتيب التركيب، الدالة الداخلية، الدالة الخارجية، عدم الإبدال.", "يمثل المعلم «آلتين»: الأولى تضرب في 2 وتضيف 1، والثانية تربّع. يدخل العدد 3 في الأولى ثم الناتج في الثانية، ويسأل: ما الناتج النهائي؟ ويحسب الطالب: 3 ← 7 ← 49. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 1» ص67 لتطبيق الآلتين بترتيبين مختلفين على أعداد متعددة، ويسجل الطالب النتائج ويلاحظ اختلافها باختلاف الترتيب (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: د(س) = 2س + 1، هـ(س) = س²: هـ(د(3)) = هـ(7) = 49، د(هـ(3)) = د(9) = 19 (المثال 6)، ويحسب الطالب قيمًا أخرى ويقارن (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-2: السؤال 1، وكتاب النشاط ص45، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] إذا كان د(س) = س + 3 و هـ(س) = 2س فأوجد هـ(د(1)).\nالإجابة النموذجية: د(1) = 4، هـ(4) = 8\n2) [مستوى التطبيق] أوجد د(هـ(1)) للدالتين السابقتين.\nالإجابة النموذجية: هـ(1) = 2، د(2) = 5\n3) [مستوى الاستدلال] هل هـ(د(1)) = د(هـ(1))؟ ماذا تستنتج؟\nالإجابة النموذجية: لا (8 ≠ 5)، التركيب ليس إبداليًا.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في هـ(د(س)) نطبق الدالة ___ أولًا.\nالإجابة النموذجية: د\n2) [مستوى التطبيق] د(س) = س² − 1، هـ(س) = 3س. أوجد د(هـ(2)).\nالإجابة النموذجية: هـ(2) = 6، د(6) = 35\n3) [مستوى الاستدلال] للدالتين السابقتين أوجد هـ(د(2)).\nالإجابة النموذجية: د(2) = 3، هـ(3) = 9", "للطالب: تمارين 2-2: السؤال 1، وكتاب النشاط ص45 (كتاب الطالب ص67–72، كتاب النشاط ص45–46).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=8"]}, {"ax": "إيجاد صيغة الدالة المركّبة ومجالها", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يكتب صيغة الدالة المركّبة جبريًا (15 دقيقة)\n2) يحدد مجال الدالة المركّبة في حالات بسيطة (جذرية، نسبية) (15 دقيقة)\nمخرج تعليمي آخر: يجد تركيب الدالة مع نفسها د(د(س)) (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "صيغة الدالة المركّبة، التعويض بعبارة، مجال الدالة المركّبة، تركيب الدالة مع نفسها.", "يطلب المعلم التعويض بالعبارة (2س + 1) مكان س في س² ثم فكّها، ويكتب الطالب (2س + 1)² = 4س² + 4س + 1. (5 دقائق)", "1. النمذجة: ينمذج المعلم: هـ(د(س)) = (2س + 1)² = 4س² + 4س + 1، د(هـ(س)) = 2س² + 1، د(د(س)) = 2(2س + 1) + 1 = 4س + 3 (المثالان 7 و 8)، ويتابع الطالب ويكتب الصيغ (12 دقيقة)\nالاستراتيجيات: ال
