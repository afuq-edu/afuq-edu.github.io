:root{--bg:#f6f9fb;--card:#fff;--line:#dfe8ee;--ink:#2b3440;--mute:#64748b;--teal:#28607a;--tealbg:#eaf5f9;--lav:#eef0fb;--lavink:#454f8c;--green:#2f6b47;--greenbg:#e6f4ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'AR',system-ui,sans-serif;color:var(--ink);line-height:1.7}
header{background:linear-gradient(180deg,#f0f8fb,#f6f9fb);border-bottom:1px solid var(--line);padding:14px 16px 10px;position:sticky;top:0;z-index:5}
h1{margin:0 0 6px;font-size:1.15rem;color:var(--teal)}
.mode{display:flex;gap:6px;background:#e9eef2;border-radius:14px;padding:4px;max-width:520px}
.mode button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;padding:8px;border-radius:10px;color:var(--mute);cursor:pointer;transition:.25s}
.mode button.on{background:#fff;color:var(--teal);box-shadow:0 2px 8px rgba(40,96,122,.15)}
.explain{font-size:.85rem;color:var(--mute);margin:6px 2px 4px}
.now{display:inline-block;background:var(--greenbg);color:var(--green);border:1px solid #c5e5d2;border-radius:20px;padding:2px 12px;font-weight:700;font-size:.9rem;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
select{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;min-width:260px;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 14px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--tealbg);border-color:#b9d7e6;color:var(--teal);font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px}
.meta{background:#fff8e8;border:1px solid #f1e0b5;border-radius:12px;padding:8px 12px;margin-bottom:10px;color:#7a5a17;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ch{display:flex;justify-content:space-between;align-items:center;background:var(--lav);padding:7px 12px}
.ch b{color:var(--lavink)}.ch small{color:#8a90b8;margin-left:6px}
.copy{font:inherit;font-weight:700;border:1px solid #c5e5d2;background:var(--greenbg);color:var(--green);border-radius:10px;padding:4px 14px;cursor:pointer;min-width:96px;transition:.2s}
.copy.done{background:#2f6b47;color:#fff}
.cb{padding:10px 14px;white-space:pre-wrap;font-size:.95rem}
.hint{display:none;color:#a05a1c;font-size:.85rem;padding:0 14px 8px}
@media(max-width:700px){header{position:static}}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:16px}

<script>
const D=[{"id": "1-1", "title": "حلّ المعادلات التربيعية بالتحليل إلى عوامل", "p": [{"ax": "تحليل س² + ب س + جـ وحل المعادلة بخاصية الضرب الصفري", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحلّل العبارة التربيعية س² + ب س + جـ إلى عاملين خطيين.\n2) يحل معادلة تربيعية بالتحليل إلى عوامل مستخدمًا خاصية الضرب الصفري.\nمخرج تعليمي آخر: يفسّر ضرورة جعل أحد طرفي المعادلة صفرًا قبل التحليل.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "المعادلة التربيعية، الصورة العامة أس² + ب س + جـ = 0، التحليل إلى عوامل، خاصية الضرب الصفري، جذور المعادلة.", "يعرض على السبورة الذكية الضرب (س + 3)(س + 2) ويطلب فكّه، ثم يعكس السؤال: ما العددان اللذان حاصل ضربهما 6 ومجموعهما 5؟\nدور الطالب: يفك الأقواس ذهنيًا ويقترح أزواج العوامل ويبرر اختياره.", "(5 د) التهيئة: المعلم: يعرض على السبورة الذكية الضرب (س + 3)(س + 2) ويطلب فكّه، ثم يعكس السؤال: ما العددان اللذان حاصل ضربهما 6 ومجموعهما 5؟ | الطالب: يفك الأقواس ذهنيًا ويقترح أزواج العوامل ويبرر اختياره.\n(10 د) استكشاف: المعلم: يوزع نشاط «استكشف 1» ص19 على مجموعات ثنائية، ويطلب تحليل عبارات مثل س² + 7س + 12 بالبحث عن عددين حاصل ضربهما جـ ومجموعهما ب. | الطالب: يعمل مع زميله، ويسجل أزواج العوامل في جدول، ويقارن نتائجه بالمجموعة المجاورة.\n(10 د) النمذجة: المعلم: ينمذج حل المعادلة س² − 5س + 6 = 0: (س − 2)(س − 3) = 0، إذن س = 2 أو س = 3، ويوضح خاصية الضرب الصفري، ويتحقق بالتعويض (المثال 1). | الطالب: يتابع الخطوات ويدوّنها، ثم يتحقق من الحلين بالتعويض في المعادلة الأصلية.\n(8 د) تطبيق موجّه: المعلم: يكلف الطلبة بحل المثال 2 وبنود من السؤال 1 في تمارين 1-1، ويتجول لتقديم تغذية راجعة فورية (تقويم تكويني). | الطالب: يحل فرديًا ثم يقارن حله مع زميله ويصحح أخطاءه.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1: السؤال 1 (البنود الزوجية)، وكتاب النشاط ص13–14. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حلّل: س² + 7س + 10\nالإجابة النموذجية: (س + 2)(س + 5)\n2) [مستوى المتوقع] حل المعادلة: س² − س − 12 = 0\nالإجابة النموذجية: (س − 4)(س + 3) = 0، إذن س = 4 أو س = −3\n3) [مستوى المتقدم] حل المعادلة: س² = 9س، وبيّن لماذا لا نقسم الطرفين على س.\nالإجابة النموذجية: س² − 9س = 0 ← س(س − 9) = 0 ← س = 0 أو س = 9؛ القسمة على س تُضيّع الحل س = 0.", "1) [مستوى الدعم] أكمل: إذا كان (س − 5)(س + 1) = 0 فإن س = ___ أو س = ___\nالإجابة النموذجية: س = 5 أو س = −1\n2) [مستوى المتوقع] حل المعادلة: س² + 2س − 15 = 0\nالإجابة النموذجية: (س + 5)(س − 3) = 0، إذن س = −5 أو س = 3\n3) [مستوى المتقدم] اكتب معادلة تربيعية بالصورة العامة جذراها 4 و −2.\nالإجابة النموذجية: (س − 4)(س + 2) = 0 ← س² − 2س − 8 = 0", "للطالب: تمارين 1-1: السؤال 1 (البنود الزوجية)، وكتاب النشاط ص13–14 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «تحليل س² + ب س + جـ وحل المعادلة بخاصية الضرب الصفري»."]}, {"ax": "التحليل عندما أ ≠ 1 والمعادلات التي تحتاج إعادة ترتيب", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحلّل عبارة تربيعية معامل س² فيها لا يساوي 1.\n2) يعيد ترتيب المعادلة إلى الصورة العامة ثم يحلها بالتحليل إلى عوامل.\nمخرج تعليمي آخر: يكتشف الخطأ في حلول مقدّمة ويصححه.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات معادلات", "المعامل الرئيس أ، العامل المشترك الأكبر، إعادة الترتيب، الصورة العامة، الفرق بين مربعين.", "يطرح سؤالين سريعين: حلّل 2س² + 6س، وحلّل س² − 25؛ ليستذكر الطلبة إخراج العامل المشترك والفرق بين مربعين.\nدور الطالب: يجيب على السبورة الصغيرة ويرفعها للمعلم.", "(5 د) التهيئة: المعلم: يطرح سؤالين سريعين: حلّل 2س² + 6س، وحلّل س² − 25؛ ليستذكر الطلبة إخراج العامل المشترك والفرق بين مربعين. | الطالب: يجيب على السبورة الصغيرة ويرفعها للمعلم.\n(10 د) النمذجة: المعلم: ينمذج تحليل 2س² + 5س − 3 بطريقة تجزئة الحد الأوسط (أ × جـ = −6، والعددان 6 و −1): 2س² + 6س − س − 3 = (2س − 1)(س + 3)، ثم حل المعادلة = 0 (المثالان 3 و 4). | الطالب: يتابع ويطبق الطريقة نفسها على 3س² + 10س + 8.\n(10 د) تعلم تعاوني: المعلم: يوزع على المجموعات بطاقات لمعادلات تحتاج إعادة ترتيب، مثل: س(س + 4) = 21 و 6س² = 7س + 3 (المثالان 5 و 6)، ويطلب حلها وعرض خطواتها. | الطالب: تعيد المجموعة ترتيب المعادلة إلى الصورة العامة، وتحللها، وتعرض الحل على زملائها.\n(8 د) تحليل الأخطاء: المعلم: يعرض حلًا خاطئًا: س(س − 3) = 4 ← س = 4 أو س − 3 = 4، ويطلب تحديد الخطأ وتصحيحه (تقويم تكويني). | الطالب: يكتشف أن الطرف الأيمن ليس صفرًا، ويصحح: س² − 3س − 4 = 0 ← س = 4 أو س = −1.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-1: السؤالان 2 و 3، وكتاب النشاط ص15. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حلّل: 2س² + 7س + 3\nالإجابة النموذجية: (2س + 1)(س + 3)\n2) [مستوى المتوقع] حل: س(س + 4) = 21\nالإجابة النموذجية: س² + 4س − 21 = 0 ← (س + 7)(س − 3) = 0 ← س = −7 أو س = 3\n3) [مستوى المتقدم] حل: 6س² = 7س + 3\nالإجابة النموذجية: 6س² − 7س − 3 = 0 ← (3س + 1)(2س − 3) = 0 ← س = −1/3 أو س = 3/2", "1) [مستوى الدعم] حلّل: 3س² − 12\nالإجابة النموذجية: 3(س − 2)(س + 2)\n2) [مستوى المتوقع] حل: 2س² − 5س − 3 = 0\nالإجابة النموذجية: (2س + 1)(س − 3) = 0 ← س = −1/2 أو س = 3\n3) [مستوى المتقدم] حل: (س + 1)² = 2س + 10\nالإجابة النموذجية: س² + 2س + 1 = 2س + 10 ← س² = 9 ← س = 3 أو س = −3", "للطالب: تمارين 1-1: السؤالان 2 و 3، وكتاب النشاط ص15 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «التحليل عندما أ ≠ 1 والمعادلات التي تحتاج إعادة ترتيب» بسؤال واحد بسيط."]}, {"ax": "تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يكوّن معادلة تربيعية من موقف حياتي (مساحة، أعداد، حركة).\n2) يحل المعادلة ويختار الحل المناسب للسياق ويستبعد غير المقبول.\nمخرج تعليمي آخر: يصوغ مسألة حياتية تؤدي إلى معادلة تربيعية.", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم المبني على المشاريع\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "النمذجة الرياضية، المتغير، الحل المقبول في السياق، المساحة، الأعداد المتتالية.", "يعرض صورة لحديقة مستطيلة في إحدى الحدائق العامة بمسقط طولها يزيد على عرضها 3 أمتار ومساحتها 40 م²، ويسأل: كيف نجد البعدين؟\nدور الطالب: يقترح تسمية العرض س وكتابة الطول س + 3.", "(5 د) التهيئة: المعلم: يعرض صورة لحديقة مستطيلة في إحدى الحدائق العامة بمسقط طولها يزيد على عرضها 3 أمتار ومساحتها 40 م²، ويسأل: كيف نجد البعدين؟ | الطالب: يقترح تسمية العرض س وكتابة الطول س + 3.\n(10 د) حل مشكلة: المعلم: يقود الطلبة إلى المعادلة س(س + 3) = 40 ← س² + 3س − 40 = 0 ← (س + 8)(س − 5) = 0، ويناقش رفض س = −8 لأن الطول لا يكون سالبًا. | الطالب: يكوّن المعادلة ويحلها ويبرر قبول س = 5 فقط (العرض 5 م والطول 8 م).\n(10 د) تعلم تعاوني: المعلم: يوزع مسائل كتاب النشاط ص16–17 على المجموعات (أعداد متتالية، أطوال أضلاع مثلث قائم)، ويحدد لكل عضو دورًا. | الطالب: تحل المجموعة المسائل، وتكتب المعادلة والحل والتحقق، ويقدم المقرر الحل.\n(8 د) إثراء: المعلم: يطلب من المجيدين صياغة مسألة حياتية تؤدي إلى المعادلة س² − س − 20 = 0، ويقدّم للمتعثرين مسألة موجّهة بخطوات. | الطالب: يصوغ مسألة أو يحل المسألة الموجّهة حسب مستواه.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-1 ومحور «تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 1-1: الأسئلة 4–6، وكتاب النشاط ص16–17. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] عددان موجبان متتاليان حاصل ضربهما 56، اكتب المعادلة.\nالإجابة النموذجية: س(س + 1) = 56\n2) [مستوى المتوقع] حل المعادلة س² + س − 56 = 0 واختر الحل المناسب للسؤال السابق.\nالإجابة النموذجية: (س + 8)(س − 7) = 0؛ العددان 7 و 8 (نرفض −8 لأنه غير موجب).\n3) [مستوى المتقدم] مثلث قائم الزاوية ضلعاه القائمان س و س + 7 ووتره 13. أوجد س.\nالإجابة النموذجية: س² + (س + 7)² = 169 ← 2س² + 14س − 120 = 0 ← س² + 7س − 60 = 0 ← (س + 12)(س − 5) = 0 ← س = 5", "1) [مستوى الدعم] مستطيل طوله يزيد على عرضه 2 سم ومساحته 35 سم². أوجد العرض.\nالإجابة النموذجية: س(س + 2) = 35 ← (س + 7)(س − 5) = 0 ← العرض 5 سم\n2) [مستوى المتوقع] لماذا رفضنا الحل السالب في مسائل الأطوال؟\nالإجابة النموذجية: لأن الطول كمية موجبة لا تكون سالبة في الواقع.\n3) [مستوى المتقدم] مربع زاد طول ضلعه 3 سم فأصبحت مساحته 64 سم². أوجد طول ضلعه الأصلي.\nالإجابة النموذجية: (س + 3)² = 64 ← س + 3 = 8 (نرفض −8) ← س = 5 سم", "للطالب: تمارين 1-1: الأسئلة 4–6، وكتاب النشاط ص16–17 (كتاب الطالب ص19–24، كتاب النشاط ص13–17).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «تطبيقات حياتية على المعادلات التربيعية وتمارين النشاط»."]}]}, {"id": "1-2", "title": "القيم العظمى والقيم الصغرى للدالة التربيعية", "p": [{"ax": "شكل منحنى الدالة التربيعية ونقطة التحول ومحور التماثل", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يحدد شكل منحنى الدالة التربيعية (∪ أو ∩) من إشارة معامل س².\n2) يجد معادلة محور التماثل من جذري الدالة.\nمخرج تعليمي آخر: يميّز بين نقطة القيمة العظمى ونقطة القيمة الصغرى.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "المنحنى التربيعي، نقطة التحول (نقطة الثبات)، نقطة القيمة العظمى، نقطة القيمة الصغرى، محور التماثل.", "يعرض صورة نافورة ماء وجسر مقوس ويسأل: ما الشكل الذي ترسمه المياه؟ وأين أعلى نقطة؟\nدور الطالب: يصف الشكل ويتوقع موقع أعلى نقطة.", "(5 د) التهيئة: المعلم: يعرض صورة نافورة ماء وجسر مقوس ويسأل: ما الشكل الذي ترسمه المياه؟ وأين أعلى نقطة؟ | الطالب: يصف الشكل ويتوقع موقع أعلى نقطة.\n(10 د) اكتشاف: المعلم: يرسم مع الطلبة باستخدام GeoGebra منحنيات ص = س² − 4 و ص = −س² + 4 و ص = 2س² ويطلب ملاحظة أثر إشارة أ. | الطالب: يلاحظ أن أ > 0 يعطي منحنى مفتوحًا للأعلى بنقطة صغرى، و أ < 0 مفتوحًا للأسفل بنقطة عظمى.\n(10 د) النمذجة: المعلم: يحلّل د(س) = س² − 6س + 8 = (س − 2)(س − 4)، ويبيّن أن محور التماثل يمر بمنتصف الجذرين س = (2 + 4) ÷ 2 = 3، وأن د(3) = −1، فنقطة الصغرى (3، −1) (المثال 7). | الطالب: يتابع ويطبق على د(س) = س² − 2س − 8.\n(8 د) تطبيق موجّه: المعلم: يكلف الطلبة بإيجاد محور التماثل ونقطة التحول لـ د(س) = س² + 2س − 3، ويتابع (تقويم تكويني). | الطالب: يحلل: (س + 3)(س − 1)، محور التماثل س = −1، د(−1) = −4، نقطة صغرى (−1، −4).\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-2: السؤالان 1 و 2، وكتاب النشاط ص18. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] هل منحنى د(س) = −2س² + 3 مفتوح للأعلى أم للأسفل؟\nالإجابة النموذجية: للأسفل لأن معامل س² سالب، وله نقطة عظمى.\n2) [مستوى المتوقع] جذرا دالة تربيعية 1 و 7، اكتب معادلة محور التماثل.\nالإجابة النموذجية: س = (1 + 7) ÷ 2 = 4\n3) [مستوى المتقدم] أوجد نقطة التحول للدالة د(س) = س² − 2س − 8 وحدد نوعها.\nالإجابة النموذجية: الجذران 4 و −2، المحور س = 1، د(1) = −9، نقطة صغرى (1، −9).", "1) [مستوى الدعم] أكمل: إذا كان أ > 0 فإن للدالة التربيعية قيمة ___\nالإجابة النموذجية: صغرى\n2) [مستوى المتوقع] أوجد معادلة محور التماثل للدالة د(س) = (س + 1)(س − 5).\nالإجابة النموذجية: س = (−1 + 5) ÷ 2 = 2\n3) [مستوى المتقدم] أوجد القيمة الصغرى للدالة د(س) = (س + 1)(س − 5).\nالإجابة النموذجية: د(2) = 3 × (−3) = −9", "للطالب: تمارين 1-2: السؤالان 1 و 2، وكتاب النشاط ص18 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم."]}, {"ax": "رسم منحنى الدالة التربيعية باستخدام الجذور والتماثل والقيمة العظمى أو الصغرى", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يجد نقاط تقاطع المنحنى مع المحورين ونقطة التحول.\n2) يرسم منحنى الدالة التربيعية مستعينًا بالقيمة العظمى أو الصغرى والتماثل.\nمخرج تعليمي آخر: يحدد مدى الدالة من نقطة التحول.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق مربعات", "المقطع الصادي، المقطع السيني، التماثل، نقطة التحول، رسم المنحنى، مدى الدالة.", "يطرح: أين يقطع منحنى ص = س² − 4س محور الصادات؟ وأين يقطع محور السينات؟\nدور الطالب: يعوض س = 0 فيجد ص = 0، ويحلل س(س − 4) = 0 فيجد س = 0 أو 4.", "(5 د) التهيئة: المعلم: يطرح: أين يقطع منحنى ص = س² − 4س محور الصادات؟ وأين يقطع محور السينات؟ | الطالب: يعوض س = 0 فيجد ص = 0، ويحلل س(س − 4) = 0 فيجد س = 0 أو 4.\n(12 د) النمذجة: المعلم: ينمذج رسم د(س) = −س² + 4س + 5 = −(س − 5)(س + 1): الجذران 5 و −1، المحور س = 2، د(2) = 9 نقطة عظمى، المقطع الصادي 5، ثم يرسم المنحنى (المثالان 8 و 9). | الطالب: يرسم المنحنى في دفتره خطوة بخطوة ويحدد النقاط الأربع.\n(10 د) تعلم تعاوني: المعلم: يوزع على كل مجموعة دالة مختلفة ليرسموها على ورقة مربعات ويعلقوها، ثم جولة معرض لمقارنة المنحنيات. | الطالب: ترسم المجموعة منحنى دالتها وتكتب عليه النقاط المميزة وتعلق على أعمال غيرها.\n(6 د) تقويم تكويني: المعلم: يسأل: ما مدى الدالة −س² + 4س + 5؟ وما مدى س² − 6س + 8؟ | الطالب: يستنتج أن المدى د(س) ≤ 9 للأولى و د(س) ≥ −1 للثانية.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-2: السؤالان 3 و 4، وكتاب النشاط ص19. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد المقطع الصادي لمنحنى د(س) = س² − 3س − 10.\nالإجابة النموذجية: د(0) = −10، النقطة (0، −10)\n2) [مستوى المتوقع] أوجد جذري د(س) = س² − 3س − 10 ونقطة الصغرى.\nالإجابة النموذجية: (س − 5)(س + 2)، الجذران 5 و −2، المحور س = 1.5، د(1.5) = −12.25\n3) [مستوى المتقدم] حدد مدى الدالة د(س) = −س² + 4س + 5.\nالإجابة النموذجية: د(س) ≤ 9", "1) [مستوى الدعم] أكمل: منحنى د(س) = −(س − 1)(س − 3) يقطع محور السينات عند س = ___ و س = ___\nالإجابة النموذجية: 1 و 3\n2) [مستوى المتوقع] أوجد نقطة القيمة العظمى للدالة د(س) = −(س − 1)(س − 3).\nالإجابة النموذجية: المحور س = 2، د(2) = −(1)(−1) = 1، النقطة (2، 1)\n3) [مستوى المتقدم] ارسم منحنى د(س) = س² − 4 موضحًا النقاط المميزة، وحدد مداه.\nالإجابة النموذجية: الجذران ±2، نقطة صغرى (0، −4)، المقطع الصادي −4، المدى د(س) ≥ −4", "للطالب: تمارين 1-2: السؤالان 3 و 4، وكتاب النشاط ص19 (كتاب الطالب ص25–31، كتاب النشاط ص18–21).\nلولي الأمر: متابعة تقدم الابن/الابنة في «رسم منحنى الدالة التربيعية باستخدام الجذور والتماثل والقيمة العظمى أو الصغرى» والتواصل مع المعلم عند ملاحظة صعوبة متكررة."]}, {"ax": "تطبيقات حياتية على القيمة العظمى والصغرى", "wk": "الأسبوع الأول (6–10/9/2026م)", "f": ["1) يستخدم القيمة العظمى أو الصغرى لحل مسائل حياتية (ربح، ارتفاع مقذوف).\n2) يفسر معنى نقطة التحول في سياق المسألة.\nمخرج تعليمي آخر: يقيّم معقولية النتيجة في الموقف الحياتي.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "دالة الربح، ارتفاع المقذوف، أقصى ارتفاع، أكبر ربح، تفسير النتيجة.", "يعرض فيديو قصير لكرة تُقذف للأعلى ويسأل: متى تصل الكرة لأقصى ارتفاع؟ ومتى تعود للأرض؟\nدور الطالب: يتوقع ويربط بين الزمن والارتفاع." عاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "نقطة التقاطع، التمثيل البياني للنظام، عدد الحلول، التحقق البياني.", "يعرض على GeoGebra المنحنى ص = س² − 4 والمستقيم ص = 2س − 1 ويسأل: أين يلتقيان؟ قارن بحل الحصة الأولى.\nدور الطالب: يلاحظ أن نقطتي التقاطع (3، 5) و (−1، −3) هما الحلان.", "(5 د) التهيئة: المعلم: يعرض على GeoGebra المنحنى ص = س² − 4 والمستقيم ص = 2س − 1 ويسأل: أين يلتقيان؟ قارن بحل الحصة الأولى. | الطالب: يلاحظ أن نقطتي التقاطع (3، 5) و (−1، −3) هما الحلان.\n(10 د) اكتشاف: المعلم: يطلب من المجموعات تحريك المستقيم ص = 2س + ج على GeoGebra وملاحظة تغير عدد نقاط التقاطع. | الطالب: تسجل المجموعة: نقطتان، نقطة واحدة، لا تقاطع، تمهيدًا للدرس 1-6.\n(10 د) مراجعة: المعلم: يدير مراجعة سريعة على أنواع الأنظمة التي درست في الدرس (ص بدلالة س، عزل، س ص، س² + ص²). | الطالب: يحل مثالًا لكل نوع على السبورة الصغيرة.\n(8 د) تقويم تكويني: المعلم: يعرض نظامًا ويطلب التنبؤ بعدد الحلول من الرسم ثم التأكد جبريًا. | الطالب: يتنبأ ثم يتحقق.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-5 ومحور «التفسير البياني للحل الآني ومراجعة الدرس»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: مراجعة الدرس: تمارين 1-5 كاملة، والاستعداد للدرس 1-6 بقراءة ص44. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ماذا تمثل حلول النظام ص = س + 2 و ص = س² بيانيًا؟\nالإجابة النموذجية: نقطتي تقاطع المستقيم مع المنحنى: (2، 4) و (−1، 1)\n2) [مستوى المتوقع] من الرسم: المستقيم ص = −1 والمنحنى ص = س². كم حلًا للنظام؟\nالإجابة النموذجية: لا حلول، لأن س² ≥ 0 دائمًا والمستقيم تحت المحور.\n3) [مستوى المتقدم] حل جبريًا: ص = 4 و ص = س² وفسّر بيانيًا.\nالإجابة النموذجية: س = ±2، المستقيم الأفقي يقطع المنحنى في (2، 4) و (−2، 4)", "1) [مستوى الدعم] أكمل: عدد حلول النظام الآني يساوي عدد نقاط ___ بين المستقيم والمنحنى.\nالإجابة النموذجية: التقاطع\n2) [مستوى المتوقع] حل: ص = 2س و ص = س² ثم صف التقاطع بيانيًا.\nالإجابة النموذجية: س² − 2س = 0 ← (0، 0) و (2، 4)، نقطتا تقاطع\n3) [مستوى المتقدم] حل: ص = 2س − 1 و ص = س² وفسّر النتيجة.\nالإجابة النموذجية: س² − 2س + 1 = 0 ← س = 1 مكرر، حل واحد (1، 1)، المستقيم يمس المنحنى", "للطالب: مراجعة الدرس: تمارين 1-5 كاملة، والاستعداد للدرس 1-6 بقراءة ص44 (كتاب الطالب ص42–43، كتاب النشاط ص31).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم."]}]}, {"id": "1-6", "title": "التقاطع بين مستقيم ومنحنى الدالة التربيعية", "p": [{"ax": "إيجاد إحداثيات نقاط التقاطع بين مستقيم ومنحنى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يجد إحداثيات نقاط تقاطع مستقيم مع منحنى دالة تربيعية جبريًا.\n2) يمثل المستقيم والمنحنى بيانيًا ويحدد نقاط التقاطع.\nمخرج تعليمي آخر: يقارن بين الحل الجبري والحل البياني من حيث الدقة.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- عروض تقديمية\n- أخرى: ورقة العمل 1", "نقطة التقاطع، المساواة بين الدالتين، الحل الجبري، الحل البياني.", "يذكّر بالحصة الأخيرة من الدرس السابق: ما العلاقة بين حلول النظام الآني ونقاط التقاطع؟\nدور الطالب: يجيب بأن كل حل يمثل نقطة تقاطع.", "(5 د) التهيئة: المعلم: يذكّر بالحصة الأخيرة من الدرس السابق: ما العلاقة بين حلول النظام الآني ونقاط التقاطع؟ | الطالب: يجيب بأن كل حل يمثل نقطة تقاطع.\n(10 د) النمذجة: المعلم: ينمذج إيجاد تقاطع ص = س² − 3س + 2 و ص = س − 1: س² − 4س + 3 = 0 ← (1، 0) و (3، 2) (المثال 18)، ويعرض الرسم بالعرض التوضيحي (PPT). | الطالب: يحل جبريًا ثم يتحقق من الرسم.\n(10 د) تعلم تعاوني: المعلم: يوزع ورقة العمل 1 على المجموعات لإيجاد تقاطع ص = س² و ص = س + 6، و ص = س² − 4 و ص = 3س. | الطالب: تحل المجموعة: (3، 9) و (−2، 4)؛ (4، 12) و (−1، −3).\n(8 د) مقارنة: المعلم: يسأل: متى يكون الحل البياني غير دقيق؟ (تقويم تكويني). | الطالب: يجيب: عندما تكون الإحداثيات كسرية أو جذرية.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: السؤال 1، وكتاب النشاط ص32. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد تقاطع ص = س² و ص = س + 6.\nالإجابة النموذجية: س² − س − 6 = 0 ← (3، 9) و (−2، 4)\n2) [مستوى المتوقع] أوجد تقاطع ص = س² − 4 و ص = 3س.\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 12) و (−1، −3)\n3) [مستوى المتقدم] لماذا نفضل الحل الجبري على البياني أحيانًا؟\nالإجابة النموذجية: لأنه يعطي قيمًا دقيقة، بينما الرسم يعطي قيمًا تقريبية.", "1) [مستوى الدعم] أكمل: لإيجاد نقاط التقاطع نساوي ___ بين المعادلتين.\nالإجابة النموذجية: ص\n2) [مستوى المتوقع] أوجد تقاطع ص = س² + 1 و ص = 2س + 4.\nالإجابة النموذجية: س² − 2س − 3 = 0 ← (3، 10) و (−1، 2)\n3) [مستوى المتقدم] أوجد تقاطع ص = 2س² و ص = 3س + 2.\nالإجابة النموذجية: 2س² − 3س − 2 = 0 ← (2، 8) و (−1/2، 1/2)", "للطالب: تمارين 1-6: السؤال 1، وكتاب النشاط ص32 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «إيجاد إحداثيات نقاط التقاطع بين مستقيم ومنحنى»."]}, {"ax": "استخدام المميّز لتحديد عدد نقاط التقاطع (قاطع، مماس، لا تقاطع)", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يستخدم مميّز المعادلة الناتجة لتحديد عدد نقاط التقاطع.\n2) يميّز بين المستقيم القاطع والمستقيم المماس والمستقيم الذي لا يقطع المنحنى.\nمخرج تعليمي آخر: يجد نقطة التماس عندما يكون المميّز صفرًا.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- أخرى: بطاقات تصنيف", "المستقيم القاطع، المماس، نقطة التماس، المميّز، عدد نقاط التقاطع.", "يعرض على GeoGebra منحنى ص = س² + 4 ومستقيمات مختلفة ميلها 2، ويسأل: متى يمس المستقيم المنحنى؟\nدور الطالب: يلاحظ وجود موضع واحد يلامس فيه المستقيم المنحنى.", "(5 د) التهيئة: المعلم: يعرض على GeoGebra منحنى ص = س² + 4 ومستقيمات مختلفة ميلها 2، ويسأل: متى يمس المستقيم المنحنى؟ | الطالب: يلاحظ وجود موضع واحد يلامس فيه المستقيم المنحنى.\n(10 د) النمذجة: المعلم: ينمذج: ص = س² + 4 و ص = 2س + 3 ← س² − 2س + 1 = 0، المميّز = 0، فالمستقيم مماس عند (1، 5) (المثال 19). | الطالب: يحسب المميّز ويجد نقطة التماس.\n(10 د) تصنيف: المعلم: يوزع بطاقات أزواج (مستقيم، منحنى) على المجموعات لتصنيفها: قاطع / مماس / لا يقطع، باستخدام المميّز. | الطالب: تحسب المجموعة المميّز لكل بطاقة وتصنفها في جدول.\n(8 د) تقويم تكويني: المعلم: يسأل كل مجموعة عن بطاقة واحدة لتبرير تصنيفها. | الطالب: تبرر المجموعة تصنيفها بالمميّز.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: السؤالان 2 و 3، وكتاب النشاط ص33. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حدد عدد نقاط تقاطع ص = س² و ص = 2س − 5.\nالإجابة النموذجية: س² − 2س + 5 = 0، المميّز = 4 − 20 = −16 < 0، لا تقاطع\n2) [مستوى المتوقع] بيّن أن ص = 4س − 4 مماس للمنحنى ص = س².\nالإجابة النموذجية: س² − 4س + 4 = 0، المميّز = 0\n3) [مستوى المتقدم] أوجد نقطة التماس في السؤال السابق.\nالإجابة النموذجية: س = 2، ص = 4، النقطة (2، 4)", "1) [مستوى الدعم] أكمل: إذا كان المميّز موجبًا فالمستقيم ___ المنحنى في نقطتين.\nالإجابة النموذجية: يقطع\n2) [مستوى المتوقع] هل المستقيم ص = س + 1 يقطع المنحنى ص = س² + 3؟\nالإجابة النموذجية: س² − س + 2 = 0، المميّز = 1 − 8 = −7 < 0، لا يقطعه\n3) [مستوى المتقدم] بيّن أن ص = −2س − 1 مماس للمنحنى ص = س² وأوجد نقطة التماس.\nالإجابة النموذجية: س² + 2س + 1 = 0، المميّز = 0، النقطة (−1، 1)", "للطالب: تمارين 1-6: السؤالان 2 و 3، وكتاب النشاط ص33 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «استخدام المميّز لتحديد عدد نقاط التقاطع (قاطع، مماس، لا تقاطع)» بسؤال واحد بسيط."]}, {"ax": "إيجاد قيم ثابت مجهول بشرط التماس أو عدم التقاطع", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يكوّن معادلة تربيعية في س تتضمن ثابتًا مجهولًا من شرط التقاطع.\n2) يجد قيم الثابت التي تجعل المستقيم مماسًا أو قاطعًا أو لا يقطع المنحنى.\nمخرج تعليمي آخر: يفسر النتائج بيانيًا بتحريك المستقيم.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "ثابت مجهول، شرط التماس (المميّز = 0)، شرط التقاطع في نقطتين (المميّز > 0)، شرط عدم التقاطع (المميّز < 0).", "يسأل: ما قيم ك التي تجعل ك² − 4 = 0؟ وما قيمها التي تجعل ك² − 4 < 0؟\nدور الطالب: يجيب ك = ±2، و −2 < ك < 2.", "(5 د) التهيئة: المعلم: يسأل: ما قيم ك التي تجعل ك² − 4 = 0؟ وما قيمها التي تجعل ك² − 4 < 0؟ | الطالب: يجيب ك = ±2، و −2 < ك < 2.\n(10 د) النمذجة: المعلم: ينمذج: المستقيم ص = ك س يمس المنحنى ص = س² + 1 ← س² − ك س + 1 = 0 ← ك² − 4 = 0 ← ك = ±2 (المثال 20). | الطالب: يتابع ويتحقق بيانيًا من المماسين.\n(10 د) تعلم تعاوني: المعلم: يقدم مسألة: ص = س + ك لا يقطع ص = س²؛ وأخرى: ص = 2س + ك يقطع ص = س² − 3 في نقطتين (المثال 21). | الطالب: تحل المجموعة: س² − س − ك = 0 ← 1 + 4ك < 0 ← ك < −1/4؛ و س² − 2س − 3 − ك = 0 ← 4 + 4(3 + ك) > 0 ← ك > −4.\n(8 د) تقويم تكويني: المعلم: يتحقق من النتائج بتحريك المستقيم على GeoGebra أمام الطلبة. | الطالب: يقارن الحل الجبري بما يراه.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 1-6: الأسئلة 4–6. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد ك إذا كان ص = س + ك مماسًا للمنحنى ص = س².\nالإجابة النموذجية: س² − س − ك = 0 ← 1 + 4ك = 0 ← ك = −1/4\n2) [مستوى المتوقع] أوجد قيم ك التي تجعل ص = ك س يقطع ص = س² + 4 في نقطتين.\nالإجابة النموذجية: ك² − 16 > 0 ← ك < −4 أو ك > 4\n3) [مستوى المتقدم] أوجد قيم ك التي تجعل ص = 2س + ك لا يقطع ص = س².\nالإجابة النموذجية: س² − 2س − ك = 0 ← 4 + 4ك < 0 ← ك < −1", "1) [مستوى الدعم] أكمل: شرط أن يكون المستقيم مماسًا للمنحنى هو المميّز = ___\nالإجابة النموذجية: 0\n2) [مستوى المتوقع] أوجد ك إذا كان ص = 4س + ك مماسًا للمنحنى ص = س².\nالإجابة النموذجية: 16 + 4ك = 0 ← ك = −4\n3) [مستوى المتقدم] أوجد قيم ك التي تجعل ص = ك س − 1 لا يقطع ص = س².\nالإجابة النموذجية: س² − ك س + 1 = 0 ← ك² − 4 < 0 ← −2 < ك < 2", "للطالب: تمارين 1-6: الأسئلة 4–6 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد قيم ثابت مجهول بشرط التماس أو عدم التقاطع»."]}, {"ax": "تطبيقات حياتية وتصميمية على تقاطع المستقيم والمنحنى", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) ينمذج موقفًا حياتيًا (جسر مقوس، مسار كرة، منحدر) بمستقيم ومنحنى.\n2) يحدد نقاط التقاطع ويفسرها في السياق.\nمخرج تعليمي آخر: يصمم شكلًا زخرفيًا بسيطًا باستخدام مستقيم ومنحنى تربيعي.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)\n- صورة توضيحية", "النمذجة، المسار، المنحدر، التصميم الهندسي، تفسير نقاط التقاطع.", "يعرض صورة جسر مقوس فوق طريق مستقيم ويسأل: أين يلتقي القوس بالطريق؟\nدور الطالب: يربط نقاط الالتقاء بنقاط التقاطع.", "(5 د) التهيئة: المعلم: يعرض صورة جسر مقوس فوق طريق مستقيم ويسأل: أين يلتقي القوس بالطريق؟ | الطالب: يربط نقاط الالتقاء بنقاط التقاطع.\n(10 د) حل مشكلة: المعلم: يعرض مسألة: قوس جسر ص = −0.1س² + 2س ومنحدر ص = 0.5س. أين يلتقيان؟ ← 0.1س² − 1.5س = 0 ← س = 0 أو س = 15، النقطة (15، 7.5). | الطالب: يحل ويفسر نقطتي الالتقاء في السياق.\n(10 د) مشروع مصغر: المعلم: يكلف كل مجموعة بتصميم شعار بسيط يتكون من منحنى تربيعي ومستقيمين أحدهما مماس، وكتابة معادلاتهم والتحقق جبريًا. | الطالب: تصمم المجموعة الشعار على GeoGebra وتتحقق من التماس بالمميّز.\n(8 د) عرض: المعلم: يعرض أعمال مجموعتين ويطلب تعليق الزملاء (تقويم تكويني). | الطالب: تعرض المجموعة وتجيب عن الأسئلة.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: كتاب النشاط ص34، وإكمال تصميم الشعار. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد نقاط التقاطع بين ص = −0.1س² + 2س و ص = 0.5س.\nالإجابة النموذجية: (0، 0) و (15، 7.5)\n2) [مستوى المتوقع] ماذا تمثل النقطة (15، 7.5) في السياق؟\nالإجابة النموذجية: نقطة التقاء المنحدر بقوس الجسر على بعد 15 م أفقيًا وارتفاع 7.5 م.\n3) [مستوى المتقدم] اقترح مستقيمًا أفقيًا يمس المنحنى ص = −0.1س² + 2س.\nالإجابة النموذجية: أعلى نقطة عند س = 10، ص = 10، فالمستقيم ص = 10", "1) [مستوى الدعم] أكمل: المستقيم الأفقي المماس لقمة القوس يمر بنقطة القيمة ___\nالإجابة النموذجية: العظمى\n2) [مستوى المتوقع] هل يقطع المستقيم ص = 12 القوس ص = −0.1س² + 2س؟\nالإجابة النموذجية: 0.1س² − 2س + 12 = 0، المميّز = 4 − 4.8 < 0، لا يقطعه (القوس أعلاه 10 م).\n3) [مستوى المتقدم] صمم مستقيمًا يقطع المنحنى ص = س² في نقطتين إحداهما (1، 1)، واكتب معادلته وتحقق.\nالإجابة النموذجية: مثلًا ص = س² و ص = 3س − 2 ← س² − 3س + 2 = 0 ← (1، 1) و (2، 4)", "للطالب: كتاب النشاط ص34، وإكمال تصميم الشعار (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم."]}, {"ax": "حل تمارين الدرس وكتاب النشاط", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يحل تمارين الدرس 1-6 المتنوعة بدقة.\n2) يختار الطريقة المناسبة (حل جبري أم مميّز) بحسب المطلوب.\nمخرج تعليمي آخر: يقيّم حلول زملائه ويقدم تغذية راجعة.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الأقلام", "التقاطع، المماس، المميّز، اختيار الاستراتيجية، التغذية الراجعة بين الأقران.", "يطرح سؤال تمييز: «أوجد نقاط التقاطع» و«أوجد عدد نقاط التقاطع»؛ ما الفرق في طريقة الحل؟\nدور الطالب: يوضح أن الأول يحتاج حلًا كاملًا والثاني يكفيه المميّز.", "(5 د) التهيئة: المعلم: يطرح سؤال تمييز: «أوجد نقاط التقاطع» و«أوجد عدد نقاط التقاطع»؛ ما الفرق في طريقة الحل؟ | الطالب: يوضح أن الأول يحتاج حلًا كاملًا والثاني يكفيه المميّز.\n(12 د) تعلم ذاتي: المعلم: يكلف الطلبة بتمارين 1-6 المتبقية مع تدرج المستويات، ويتابع المتعثرين في مجموعة صغيرة. | الطالب: يحل فرديًا وفق مستواه.\n(10 د) تقييم الأقران: المعلم: يتبادل الطلبة الدفاتر ويصحح كل منهم حل زميله وفق نموذج إجابة معروض. | الطالب: يصحح ويكتب ملاحظة بنّاءة.\n(6 د) تقويم تكويني: المعلم: يجمع أكثر الأخطاء تكرارًا ويعالجها على السبورة. | الطالب: يصحح أخطاءه.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تمارين 1-6، والبدء بتمارين مراجعة نهاية الوحدة ص50–51. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] كم نقطة تقاطع بين ص = 3س + 1 و ص = س² + س + 2؟\nالإجابة النموذجية: س² − 2س + 1 = 0، المميّز = 0، نقطة واحدة (1، 4)\n2) [مستوى المتوقع] أوجد نقاط تقاطع ص = 5 − س و ص = س² − 1.\nالإجابة النموذجية: س² + س − 6 = 0 ← (2، 3) و (−3، 8)\n3) [مستوى المتقدم] أوجد ك إذا كان ص = س + ك مماسًا للمنحنى ص = س² + 3س.\nالإجابة النموذجية: س² + 2س − ك = 0 ← 4 + 4ك = 0 ← ك = −1", "1) [مستوى الدعم] أكمل: سؤال «كم نقطة تقاطع؟» يكفي فيه حساب ___\nالإجابة النموذجية: المميّز\n2) [مستوى المتوقع] أوجد نقاط تقاطع ص = 2س + 3 و ص = س² .\nالإجابة النموذجية: س² − 2س − 3 = 0 ← (3، 9) و (−1، 1)\n3) [مستوى المتقدم] أوجد قيم ك التي تجعل ص = ك يقطع ص = س² − 6س في نقطتين.\nالإجابة النموذجية: س² − 6س − ك = 0 ← 36 + 4ك > 0 ← ك > −9", "للطالب: إكمال تمارين 1-6، والبدء بتمارين مراجعة نهاية الوحدة ص50–51 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: متابعة تقدم الابن/الابنة في «حل تمارين الدرس وكتاب النشاط» والتواصل مع المعلم عند ملاحظة صعوبة متكررة."]}, {"ax": "مراجعة الوحدة الأولى (تمارين مراجعة نهاية الوحدة)", "wk": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1) يربط بين مفاهيم الوحدة: التحليل، القيم العظمى والصغرى، المتباينات، المميّز، التقاطع.\n2) يحل أسئلة مراجعة متنوعة من نهاية الوحدة وكتاب النشاط.\nمخرج تعليمي آخر: يحدد نقاط قوته وضعفه في الوحدة ويضع خطة لمعالجتها.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "خريطة مفاهيم الوحدة، الدالة التربيعية، المميّز، المتباينة، التقاطع، التقويم الذاتي.", "يعرض خريطة مفاهيم ناقصة للوحدة على السبورة الذكية ويطلب إكمالها جماعيًا.\nدور الطالب: يكمل الخريطة بالمفاهيم والأمثلة.", "(5 د) التهيئة: المعلم: يعرض خريطة مفاهيم ناقصة للوحدة على السبورة الذكية ويطلب إكمالها جماعيًا. | الطالب: يكمل الخريطة بالمفاهيم والأمثلة.\n(12 د) تعلم تعاوني: المعلم: يوزع تمارين مراجعة نهاية الوحدة ص50–54 على المجموعات بحيث تأخذ كل مجموعة محورًا. | الطالب: تحل المجموعة محورها وتجهز شرحًا موجزًا.\n(10 د) تعلم تشاركي: المعلم: تعرض كل مجموعة حلًا واحدًا لسؤال مميز، ويعلّق المعلم على الدقة والمصطلحات. | الطالب: تشرح المجموعة وتجيب عن أسئلة زملائها.\n(6 د) تقويم ذاتي: المعلم: يوزع بطاقة تقويم ذاتي بعبارات «أستطيع أن...» لكل درس (تقويم تكويني). | الطالب: يقيم نفسه ويحدد الدروس التي يحتاج مراجعتها.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 1-6 ومحور «مراجعة الوحدة الأولى (تمارين مراجعة نهاية الوحدة)»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص50–54، وكتاب النشاط ص35–38. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: س² − 7س + 10 = 0\nالإجابة النموذجية: س = 2 أو س = 5\n2) [مستوى المتوقع] أوجد قيمة ك التي تجعل س² + ك س + 16 = 0 لها جذران متساويان.\nالإجابة النموذجية: ك = ±8\n3) [مستوى المتقدم] حل: س² − 7س + 10 > 0\nالإجابة النموذجية: س < 2 أو س > 5", "1) [مستوى الدعم] أكمل: نقطة الصغرى للدالة د(س) = (س − 2)(س − 6) تقع عند س = ___\nالإجابة النموذجية: 4\n2) [مستوى المتوقع] أوجد نقاط تقاطع ص = س² − 2س و ص = س + 4.\nالإجابة النموذجية: س² − 3س − 4 = 0 ← (4، 8) و (−1، 3)\n3) [مستوى المتقدم] أوجد قيم ك التي تجعل المستقيم ص = ك س − 9 مماسًا للمنحنى ص = س².\nالإجابة النموذجية: س² − ك س + 9 = 0 ← ك² − 36 = 0 ← ك = ±6", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص50–54، وكتاب النشاط ص35–38 (كتاب الطالب ص44–49، ومراجعة الوحدة ص50–54، كتاب النشاط ص32–34، ومراجعة الوحدة ص35–38).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم."]}]}, {"id": "2-1", "title": "تعريف الدوال ومجالها ومداها", "p": [{"ax": "العلاقة والدالة وأنواع التطابق واختبار المستقيم الرأسي", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يميّز الدالة من العلاقة باستخدام المخطط السهمي واختبار المستقيم الرأسي.\n2) يصنف العلاقات: واحد إلى واحد، متعدد إلى واحد، واحد إلى متعدد، متعدد إلى متعدد.\nمخرج تعليمي آخر: يستخدم اختبار المستقيم الأفقي للحكم على الدالة واحد إلى واحد.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (GeoGebra)", "العلاقة، الدالة، المجال، المجال المقابل، واحد إلى واحد، متعدد إلى واحد، واحد إلى متعدد، متعدد إلى متعدد، اختبار المستقيم الرأسي، اختبار المستقيم الأفقي.", "يعرض جدولًا يربط كل طالب برقم مقعده، وآخر يربط كل طالب بهواياته، ويسأل: أي ربط يعطي ناتجًا واحدًا فقط لكل طالب؟\nدور الطالب: يقارن بين الربطين ويستنتج فكرة «الناتج الوحيد».", "(5 د) التهيئة: المعلم: يعرض جدولًا يربط كل طالب برقم مقعده، وآخر يربط كل طالب بهواياته، ويسأل: أي ربط يعطي ناتجًا واحدًا فقط لكل طالب؟ | الطالب: يقارن بين الربطين ويستنتج فكرة «الناتج الوحيد».\n(10 د) النمذجة: المعلم: يعرّف الدالة بأنها علاقة تربط كل عنصر في المجال بعنصر واحد فقط في المجال المقابل، ويعرض مخططات سهمية للأنواع الأربعة (المثالان 1 و 2). | الطالب: يصنف المخططات السهمية المعروضة ويبرر.\n(10 د) اكتشاف: المعلم: يعرض على GeoGebra منحنيات (مستقيم، قطع مكافئ، دائرة) ويطبق اختبار المستقيم الرأسي ثم الأفقي. | الطالب: يحكم على كل منحنى: الدائرة ليست دالة، والقطع المكافئ دالة متعدد إلى واحد، والمستقيم المائل دالة واحد إلى واحد.\n(8 د) تطبيق موجّه: المعلم: يكلف الطلبة بالسؤال 1 من تمارين 2-1 (تقويم تكويني). | الطالب: يصنف العلاقات ويقارن مع زميله.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 2-1: السؤالان 1 و 2، وكتاب النشاط ص39–40. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] هل العلاقة {(1، 2)، (2، 3)، (1، 4)} دالة؟ فسّر.\nالإجابة النموذجية: ليست دالة لأن العنصر 1 ارتبط بعنصرين 2 و 4.\n2) [مستوى المتوقع] ما نوع الدالة ص = س²، س ∈ ح؟\nالإجابة النموذجية: متعدد إلى واحد؛ لأن 2 و −2 لهما الصورة نفسها 4.\n3) [مستوى المتقدم] هل الدائرة س² + ص² = 9 تمثل دالة؟\nالإجابة النموذجية: لا؛ المستقيم الرأسي س = 0 يقطعها في نقطتين.", "1) [مستوى الدعم] أكمل: الدالة التي يقطع منحناها أي مستقيم أفقي في نقطة واحدة على الأكثر تسمى دالة ___\nالإجابة النموذجية: واحد إلى واحد\n2) [مستوى المتوقع] صنف: ص = 2س + 3\nالإجابة النموذجية: دالة واحد إلى واحد\n3) [مستوى المتقدم] ارسم مخططًا سهميًا لعلاقة متعدد إلى متعدد وبيّن لماذا ليست دالة.\nالإجابة النموذجية: عنصر في المجال يرتبط بعنصرين على الأقل، فهي ليست دالة.", "للطالب: تمارين 2-1: السؤالان 1 و 2، وكتاب النشاط ص39–40 (كتاب الطالب ص55–66، كتاب النشاط ص39–44).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «العلاقة والدالة وأنواع التطابق واختبار المستقيم الرأسي»."]}, {"ax": "مجال ومدى الدوال الخطية والتربيعية ذات المجال المحدد", "wk": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1) يستخدم رمز الدالة د(س) لحساب صور عناصر المجال.\n2) يحدد مدى دالة خطية أو تربيعية مجالها محدد.\nمخرج تعليمي آخر: يستعين بالتمثيل البياني لتحديد المدى بدقة.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني", "رمز الدالة د(س)، الصورة، المجال المحدد، المدى، القيمة العظمى والصغرى ضمن المجال.", "يطرح: إذا كان د(س) = 2س + 1 فأوجد د(3) و د(−1).\nدور الطالب: يعوض فيجد 7 و −1.", "(5 د) التهيئة: المعلم: يطرح: إذا كان د(س) = 2س + 1 فأوجد د(3) و د(−1). | الطالب: يعوض فيجد 7 و −1.\n(10 د) النمذجة: المعلم: ينمذج: د(س) = 2س + 1، −1 ≤ س ≤ 3 ← المدى −1 ≤ د(س) ≤ 7 لأن الدالة متزايدة (المثال 3). | الطالب: يمثل الدالة بيانيًا ويقرأ المدى من المحور الصادي.\n(10 د) تعلم تعاوني: المعلم: يوزع دوال تربيعية: د(س) = س² − 4س، س ∈ ح، و د(س) = س²، −2 ≤ س ≤ 3 (المثالان 4 و 5). | الطالب: تحدد المجموعة: الأولى نقطة صغرى (2، −4) فالمدى د(س) ≥ −4؛ الثانية المدى 0 ≤ د(س) ≤ 9.\n(8 د) تحليل خطأ: المعلم: يعرض خطأ: مدى س² عندما −2 ≤ س ≤ 3 هو 4 ≤ د(س) ≤ 9، ويطلب التصحيح (تقويم تكويني). | الطالب: يصحح: أصغر قيمة 0 عند س = 0.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | يانات فيها قيم متطرفة (أزمنة سباق، أسعار منازل) لتحديد المقياس الأنسب وتبريره. | الطالب: تكتب المجموعة تبريرًا مكتوبًا.\n(8 د) تقويم تكويني: المعلم: يحل الطلبة بقية تمارين 4-1 المتعلقة بالوسيط. | الطالب: يحل فرديًا.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 4-1ج ومحور «أثر القيم المتطرفة على الوسط والوسيط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-1: الأسئلة المتبقية، وكتاب النشاط ص75. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما القيمة المتطرفة في 12، 14، 13، 15، 60؟\nالإجابة النموذجية: 60\n2) [مستوى المتوقع] أوجد الوسط والوسيط للبيانات السابقة.\nالإجابة النموذجية: الوسط 22.8، الوسيط 14\n3) [مستوى المتقدم] أي المقياسين يمثل البيانات أفضل؟ ولماذا؟\nالإجابة النموذجية: الوسيط، لأنه لا يتأثر بالقيمة المتطرفة.", "1) [مستوى الدعم] أكمل: المقياس الذي يتأثر كثيرًا بالقيم المتطرفة هو ___\nالإجابة النموذجية: الوسط الحسابي\n2) [مستوى المتوقع] أوجد الوسيط: 3، 4، 4، 5، 100.\nالإجابة النموذجية: 4\n3) [مستوى المتقدم] أضيفت قيمة 500 إلى 10، 20، 30. كيف تغير الوسط والوسيط؟\nالإجابة النموذجية: الوسط من 20 إلى 140، والوسيط من 20 إلى 25؛ تأثر الوسط أكثر.", "للطالب: تمارين 4-1: الأسئلة المتبقية، وكتاب النشاط ص75 (كتاب الطالب ص121–129، كتاب النشاط ص73–75).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «أثر القيم المتطرفة على الوسط والوسيط»."]}]}, {"id": "4-2", "title": "الحساب التقديري لمقاييس النزعة المركزية", "p": [{"ax": "الوسط الحسابي التقديري للبيانات المجمعة باستخدام مركز الفئة", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحسب مركز الفئة لكل فئة في جدول تكراري ذي فئات.\n2) يحسب الوسط الحسابي التقديري = مج(ت × م) ÷ مج ت.\nمخرج تعليمي آخر: يفسر لماذا تكون النتيجة تقديرية.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "البيانات المجمعة، الفئة، حدا الفئة، طول الفئة، مركز الفئة، الوسط الحسابي التقديري.", "يعرض جدولًا لأعمار زوار مكتبة في فئات ويسأل: هل نعرف العمر الدقيق لكل زائر؟ فكيف نقدّر الوسط؟\nدور الطالب: يقترح استخدام قيمة تمثل كل فئة.", "(5 د) التهيئة: المعلم: يعرض جدولًا لأعمار زوار مكتبة في فئات ويسأل: هل نعرف العمر الدقيق لكل زائر؟ فكيف نقدّر الوسط؟ | الطالب: يقترح استخدام قيمة تمثل كل فئة.\n(10 د) النمذجة: المعلم: يعرّف مركز الفئة = (الحد الأدنى + الحد الأعلى) ÷ 2، وينمذج: الفئات 0–<10، 10–<20، 20–<30، 30–<40 بتكرارات 4، 7، 6، 3 ← المراكز 5، 15، 25، 35 ← مج(ت × م) = 380 ← الوسط ≈ 19 (المثالان 10 و 11). | الطالب: يكمل أعمدة المركز و ت × م.\n(10 د) تعلم تعاوني: المعلم: يوزع جداول تكرارية ذات فئات (أطوال، أوزان، أزمنة) على المجموعات. | الطالب: تحسب المجموعة الوسط التقديري وتفسر سبب التقريب.\n(8 د) تقويم تكويني: المعلم: يسأل: متى يكون الوسط التقديري قريبًا جدًا من الوسط الفعلي؟ | الطالب: يجيب: عندما تتوزع القيم بانتظام حول مراكز الفئات.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-2أ: الأسئلة 1–3، وكتاب النشاط ص76. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] مركز الفئة 20–<30؟\nالإجابة النموذجية: 25\n2) [مستوى المتوقع] فئات 0–<4، 4–<8، 8–<12 بتكرارات 2، 5، 3. أوجد الوسط التقديري.\nالإجابة النموذجية: (2 × 2 + 6 × 5 + 10 × 3) ÷ 10 = 6.4\n3) [مستوى المتقدم] لماذا يسمى الوسط هنا تقديريًا؟\nالإجابة النموذجية: لأننا نفترض أن كل قيم الفئة تساوي مركزها.", "1) [مستوى الدعم] أكمل: مركز الفئة = (الحد الأدنى + الحد الأعلى) ÷ ___\nالإجابة النموذجية: 2\n2) [مستوى المتوقع] فئات 10–<20، 20–<30، 30–<40 بتكرارات 3، 5، 2. أوجد الوسط التقديري.\nالإجابة النموذجية: (45 + 125 + 70) ÷ 10 = 24\n3) [مستوى المتقدم] أضيفت إلى الجدول السابق فئة 40–<50 بتكرار 10. ما الوسط التقديري الجديد؟\nالإجابة النموذجية: (240 + 450) ÷ 20 = 34.5", "للطالب: تمارين 4-2أ: الأسئلة 1–3، وكتاب النشاط ص76 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم."]}, {"ax": "الفئة المنوالية والمدرج التكراري وكثافة الفئة", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحدد الفئة المنوالية في الفئات المتساوية الطول.\n2) يحسب كثافة الفئة ويحدد الفئة المنوالية عند اختلاف أطوال الفئات.\nمخرج تعليمي آخر: يقرأ الفئة المنوالية من المدرج التكراري.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "الفئة المنوالية، كثافة الفئة = التكرار ÷ طول الفئة، المدرج التكراري، الفئات غير المتساوية.", "يعرض فئتين: 0–<10 بتكرار 12، و 10–<40 بتكرار 18، ويسأل: أيهما أكثر ازدحامًا بالقيم؟\nدور الطالب: يلاحظ أن الفئة الثانية أطول بكثير.", "(5 د) التهيئة: المعلم: يعرض فئتين: 0–<10 بتكرار 12، و 10–<40 بتكرار 18، ويسأل: أيهما أكثر ازدحامًا بالقيم؟ | الطالب: يلاحظ أن الفئة الثانية أطول بكثير.\n(10 د) النمذجة: المعلم: ينمذج حساب كثافة الفئة: 12 ÷ 10 = 1.2 و 18 ÷ 30 = 0.6، فالفئة المنوالية 0–<10 (المثال 12). | الطالب: يحسب الكثافة ويحدد الفئة المنوالية.\n(10 د) تطبيق موجّه: المعلم: يعرض مدرجًا تكراريًا (المحور الرأسي كثافة الفئة) ويطلب تحديد الفئة المنوالية وحساب التكرار من مساحة العمود (المثال 13). | الطالب: يحسب التكرار = الكثافة × الطول.\n(8 د) تقويم تكويني: المعلم: يطرح جدولًا بفئات غير متساوية ويطلب الفئة المنوالية. | الطالب: يحسب الكثافات ويختار الأعلى.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-2أ: الأسئلة 4–6، وكتاب النشاط ص77. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] فئات متساوية بتكرارات 5، 12، 8. ما الفئة المنوالية؟\nالإجابة النموذجية: الفئة ذات التكرار 12\n2) [مستوى المتوقع] فئة طولها 5 وتكرارها 20. ما كثافتها؟\nالإجابة النموذجية: 4\n3) [مستوى المتقدم] في مدرج تكراري عمود كثافته 3 وطوله 4. ما التكرار؟\nالإجابة النموذجية: 12", "1) [مستوى الدعم] أكمل: كثافة الفئة = التكرار ÷ ___\nالإجابة النموذجية: طول الفئة\n2) [مستوى المتوقع] الفئات 0–<10 (10)، 10–<15 (8)، 15–<30 (15). حدد الفئة المنوالية.\nالإجابة النموذجية: الكثافات 1، 1.6، 1 ← الفئة 10–<15\n3) [مستوى المتقدم] لماذا لا نختار الفئة المنوالية بأعلى تكرار عند اختلاف الأطوال؟\nالإجابة النموذجية: لأن الفئة الأطول تحوي قيمًا أكثر بسبب طولها لا لكثافتها.", "للطالب: تمارين 4-2أ: الأسئلة 4–6، وكتاب النشاط ص77 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الفئة المنوالية والمدرج التكراري وكثافة الفئة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة."]}, {"ax": "الوسيط التقديري من منحنى التكرار التراكمي", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يكوّن جدول التكرار التراكمي ويرسم منحناه.\n2) يقدّر الوسيط من المنحنى عند الرتبة ن ÷ 2.\nمخرج تعليمي آخر: يحدد الفئة التي تحتوي الوسيط ويقدّره بالاستكمال الخطي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التكرار التراكمي، منحنى التكرار التراكمي، الحد الأعلى للفئة، الفئة الوسيطية، الاستكمال الخطي.", "يسأل: في الجدول (4، 7، 6، 3) كم قيمة أقل من 20؟ وكم أقل من 30؟\nدور الطالب: يجمع: 11 و 17.", "(5 د) التهيئة: المعلم: يسأل: في الجدول (4، 7، 6، 3) كم قيمة أقل من 20؟ وكم أقل من 30؟ | الطالب: يجمع: 11 و 17.\n(10 د) اكتشاف: المعلم: يوزع نشاط «استكشف 3» ص137، ويطلب رسم منحنى التكرار التراكمي بنقاط (الحد الأعلى، التكرار التراكمي): (0، 0)، (10، 4)، (20، 11)، (30، 17)، (40، 20). | الطالب: يرسم المنحنى على ورق رسم بياني.\n(10 د) النمذجة: المعلم: يقرأ الوسيط عند الرتبة 10 من المنحنى، ثم يحسبه بالاستكمال: 10 + (10 − 4) ÷ 7 × 10 ≈ 18.6 (المثال 14). | الطالب: يقارن القراءة البيانية بالحساب.\n(8 د) تقويم تكويني: المعلم: يكلف بتمارين كتاب النشاط ص78–81 (البنود الأولى). | الطالب: يحل فرديًا.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 4-2 ومحور «الوسيط التقديري من منحنى التكرار التراكمي»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-2ب: الأسئلة 1–4، وكتاب النشاط ص78–81. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما الفئة التي تحتوي الوسيط إذا كان التكرار التراكمي 4، 11، 17، 20؟\nالإجابة النموذجية: الرتبة 10 تقع في الفئة الثانية 10–<20\n2) [مستوى المتوقع] عند رسم منحنى التكرار التراكمي نستخدم أي حد للفئة؟\nالإجابة النموذجية: الحد الأعلى\n3) [مستوى المتقدم] قدّر الوسيط: الفئات 0–<5، 5–<10، 10–<15 بتكرارات 6، 10، 4.\nالإجابة النموذجية: ن = 20، الرتبة 10، التراكمي 6، 16 ← 5 + (10 − 6) ÷ 10 × 5 = 7", "1) [مستوى الدعم] أكمل: رتبة الوسيط في البيانات المجمعة تقديريًا ن ÷ ___\nالإجابة النموذجية: 2\n2) [مستوى المتوقع] التكرار التراكمي 4، 11، 17، 20 لفئات طولها 10 تبدأ من 0. قدّر الوسيط بالاستكمال الخطي.\nالإجابة النموذجية: الرتبة 10 في الفئة 10–<20: 10 + (10 − 4) ÷ 7 × 10 ≈ 18.6\n3) [مستوى المتقدم] كيف تقرأ من منحنى التكرار التراكمي عدد القيم الأقل من 25؟\nالإجابة النموذجية: أرسم خطًا رأسيًا من 25 إلى المنحنى ثم أفقيًا إلى المحور الرأسي وأقرأ القيمة.", "للطالب: تمارين 4-2ب: الأسئلة 1–4، وكتاب النشاط ص78–81 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم."]}]}, {"id": "4-3", "title": "خصائص مقاييس النزعة المركزية", "p": [{"ax": "مزايا الوسط الحسابي وعيوبه", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يذكر مزايا الوسط الحسابي (يستخدم كل القيم، يصلح للحسابات اللاحقة).\n2) يوضح عيوب الوسط الحسابي (التأثر بالقيم المتطرفة، قد لا يكون قيمة فعلية).\nمخرج تعليمي آخر: يحكم على صلاحية الوسط في سياقات محددة.", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تقييم", "- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات مواقف", "مزايا المقياس، عيوب المقياس، القيم المتطرفة، القيمة الفعلية، استخدام جميع البيانات.", "يسأل: معدل عدد أفراد الأسرة في الحي 4.6 فرد. هل توجد أسرة فيها 4.6 فرد؟ ماذا يعني هذا العدد؟\nدور الطالب: يناقش أن الوسط قد لا يكون قيمة فعلية لكنه يلخص البيانات.", "(5 د) التهيئة: المعلم: يسأل: معدل عدد أفراد الأسرة في الحي 4.6 فرد. هل توجد أسرة فيها 4.6 فرد؟ ماذا يعني هذا العدد؟ | الطالب: يناقش أن الوسط قد لا يكون قيمة فعلية لكنه يلخص البيانات.\n(10 د) نقاش موجّه: المعلم: يقود نقاشًا لاستخلاص مزايا الوسط وعيوبه من أمثلة الدروس السابقة (الرواتب، عدد أفراد الأسرة) (المثال 15). | الطالب: يشارك ويدوّن المزايا والعيوب في جدول.\n(10 د) تعلم تعاوني: المعلم: يوزع على المجموعات 4 مواقف ويطلب الحكم: هل الوسط مناسب؟ (درجات اختبار متقاربة، أسعار منازل، عدد الأطفال، أزمنة سباق فيها زمن شاذ). | الطالب: تحكم المجموعة وتبرر كتابيًا.\n(8 د) تقويم تكويني: المعلم: يطلب عرض حكم كل مجموعة على موقف واحد. | الطالب: تعرض المجموعة وتناقش.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-3: السؤالان 1 و 2. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] اذكر ميزة واحدة للوسط الحسابي.\nالإجابة النموذجية: يأخذ في الحسبان جميع القيم.\n2) [مستوى المتوقع] اذكر عيبًا واحدًا للوسط الحسابي.\nالإجابة النموذجية: يتأثر بالقيم المتطرفة.\n3) [مستوى المتقدم] هل الوسط مناسب لدرجات: 72، 75، 78، 74، 76؟\nالإجابة النموذجية: نعم، القيم متقاربة ولا توجد قيم متطرفة.", "1) [مستوى الدعم] أكمل: من عيوب الوسط الحسابي أنه يتأثر بالقيم ___\nالإجابة النموذجية: المتطرفة\n2) [مستوى المتوقع] أسعار منازل: 30، 32، 35، 33، 250 ألف ريال. هل الوسط مناسب؟\nالإجابة النموذجية: لا، لأن 250 قيمة متطرفة ترفع الوسط إلى 76 ألفًا.\n3) [مستوى المتقدم] لماذا يفضل الوسط عند مقارنة نتائج صفين في اختبار؟\nالإجابة النموذجية: لأنه يستخدم كل الدرجات ويعكس الأداء الكلي عند غياب القيم المتطرفة.", "للطالب: تمارين 4-3: السؤالان 1 و 2 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مزايا الوسط الحسابي وعيوبه»."]}, {"ax": "مزايا الوسيط والمنوال وعيوبهما", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يذكر مزايا الوسيط وعيوبه.\n2) يذكر مزايا المنوال وعيوبه.\nمخرج تعليمي آخر: يقارن بين المقاييس الثلاثة في جدول منظم.", "المخرج 1: تذكر\nالمخرج 2: تذكر\nالمخرج الآخر: تحليل", "- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الوسيط، المنوال، الثبات أمام القيم المتطرفة، البيانات النوعية، عدم الوحدانية.", "يعرض بيانات: 2، 3، 3، 4، 50 ويطلب حساب المقاييس الثلاثة بسرعة.\nدور الطالب: يحسب: الوسط 12.4، الوسيط 3، المنوال 3.", "(5 د) التهيئة: المعلم: يعرض بيانات: 2، 3، 3، 4، 50 ويطلب حساب المقاييس الثلاثة بسرعة. | الطالب: يحسب: الوسط 12.4، الوسيط 3، المنوال 3.\n(10 د) نقاش موجّه: المعلم: يستخلص مع الطلبة: الوسيط لا يتأثر بالقيم المتطرفة لكنه لا يستخدم كل القيم؛ المنوال يصلح للبيانات النوعية لكنه قد لا يوجد أو يتعدد (المثال 16). | الطالب: يكمل جدول المقارنة.\n(10 د) تعلم تشاركي: المعلم: يقسم الطلبة أزواجًا، كل زوج يكتب مثالًا يكون فيه مقياس معين هو الأنسب ويعرضه. | الطالب: يصوغ الزوج مثاله ويبرره.\n(8 د) تقويم تكويني: المعلم: يعرض جدول مقارنة ناقصًا ويطلب إكماله فرديًا. | الطالب: يكمل الجدول.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة الس مذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "التشتت، المدى، أكبر قيمة، أصغر قيمة، انتشار البيانات.", "يعرض درجات لاعبَي رماية في 5 جولات: الأول 8، 8، 9، 8، 7 والثاني 10، 4، 10، 6، 10 (الوسط 8 لكليهما)، ويسأل: أيهما أكثر ثباتًا؟\nدور الطالب: يلاحظ أن الأول أكثر ثباتًا رغم تساوي الوسطين.", "(5 د) التهيئة: المعلم: يعرض درجات لاعبَي رماية في 5 جولات: الأول 8، 8، 9، 8، 7 والثاني 10، 4، 10، 6، 10 (الوسط 8 لكليهما)، ويسأل: أيهما أكثر ثباتًا؟ | الطالب: يلاحظ أن الأول أكثر ثباتًا رغم تساوي الوسطين.\n(10 د) النمذجة: المعلم: يعرّف التشتت والمدى، ويحسب مدى اللاعبين: 9 − 7 = 2 و 10 − 4 = 6 (المثالان 1 و 2). | الطالب: يحسب المدى ويفسر الفرق.\n(10 د) تعلم تعاوني: المعلم: يوزع بيانات درجات حرارة لمدينتين عمانيتين خلال أسبوع (بيانات افتراضية) ويطلب الوسط والمدى والمقارنة. | الطالب: تحسب المجموعة المقياسين وتكتب مقارنة.\n(8 د) تقويم تكويني: المعلم: يسأل: هل يكفي الوسط وحده لوصف البيانات؟ ولماذا؟ | الطالب: يجيب بأن الوسط لا يصف الانتشار.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-1: الأسئلة 1–3. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد مدى: 12، 7، 15، 9، 20.\nالإجابة النموذجية: 20 − 7 = 13\n2) [مستوى المتوقع] أي المجموعتين أكثر تشتتًا: 5، 6، 7 أم 1، 6، 11؟\nالإجابة النموذجية: الثانية، مداها 10 مقابل 2.\n3) [مستوى المتقدم] لماذا نحتاج مقياسًا للتشتت؟\nالإجابة النموذجية: لأن مجموعات مختلفة قد يكون لها الوسط نفسه مع انتشار مختلف.", "1) [مستوى الدعم] أكمل: المدى = أكبر قيمة − ___\nالإجابة النموذجية: أصغر قيمة\n2) [مستوى المتوقع] أوجد مدى: 3.2، 4.8، 2.9، 5.1.\nالإجابة النموذجية: 5.1 − 2.9 = 2.2\n3) [مستوى المتقدم] مدى مجموعة 12 وأصغر قيمة فيها 15. ما أكبر قيمة؟\nالإجابة النموذجية: 27", "للطالب: تمارين 5-1: الأسئلة 1–3 (كتاب الطالب  س = 1، 2، 3، 4 و ت = 0، 5، 8، 2. أوجد المدى.\nالإجابة النموذجية: 4 − 2 = 2", "1) [مستوى الدعم] أكمل: في الجدول التكراري نتجاهل القيم التي تكرارها ___ عند حساب المدى.\nالإجابة النموذجية: صفر\n2) [مستوى المتوقع] ساق وورقة: 4 | 1 5، 5 | 2 2 8، 6 | 0 7. أوجد المدى.\nالإجابة النموذجية: 67 − 41 = 26\n3) [مستوى المتقدم] س = 5، 6، 7، 8 و ت = 2، 9، 1، 3. أوجد المدى.\nالإجابة النموذجية: 8 − 5 = 3", "للطالب: تمارين 5-1: الأسئلة 4–6، وكتاب النشاط ص87 (كتاب الطالب ص155–160، كتاب النشاط ص87–88).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «المدى من الجدول التكراري ومخطط الساق والورقة» بسؤال واحد بسيط."]}, {"ax": "المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يحدد الحدين الأدنى والأعلى لقيمة مقربة.\n2) يحسب أكبر مدى ممكن وأصغر مدى ممكن لبيانات مجمعة في فئات.\nمخرج تعليمي آخر: يفسر لماذا لا يمكن حساب المدى الدقيق للبيانات المجمعة.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "البيانات المجمعة، حدود الفئة، الحد الأدنى، الحد الأعلى، أكبر مدى ممكن، أصغر مدى ممكن، القيم المقربة.", "يسأل: طول قلم 14 سم مقربًا لأقرب سنتيمتر. ما أقصر طول ممكن؟ وما أطوله؟\nدور الطالب: يجيب: من 13.5 إلى أقل من 14.5 سم.", "(5 د) التهيئة: المعلم: يسأل: طول قلم 14 سم مقربًا لأقرب سنتيمتر. ما أقصر طول ممكن؟ وما أطوله؟ | الطالب: يجيب: من 13.5 إلى أقل من 14.5 سم.\n(10 د) النمذجة: المعلم: ينمذج: فئات 5 ≤ س < 8، 8 ≤ س < 10، 10 ≤ س < 15 كلها بتكرار: أكبر مدى ممكن 15 − 5 = 10، وأصغر مدى ممكن 10 − 8 = 2 (المثالان 6 و 7). | الطالب: يتابع ويرسم الفئات على خط الأعداد لتوضيح الفكرة.\n(10 د) تعلم تعاوني: المعلم: يوزع جداول لقيم مقربة (أوزان لأقرب 100 كغم، أعداد زوار لأقرب 1000) لإيجاد الحدود. | الطالب: تجد المجموعة الحدود: 300 كغم ← 250 إلى 350.\n(8 د) تقويم تكويني: المعلم: يكلف بكتاب النشاط ص88. | الطالب: يحل فرديًا.\n(5 د) مسابقة المجموعات: المعلم: يشغّل ملف مسابقة المجموعات، ويختار الدرس 5-1 ومحور «المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. | الطالب: تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية، وتتابع ترتيبها على مخطط النقاط.\n(2 د) الختام والواجب: المعلم: يطرح سؤال المستوى المتوقع من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-1: الأسئلة 7–9، وكتاب النشاط ص88. | الطالب: يجيب فرديًا ويدوّن الواجب في دفتره.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما حدا القيمة 4 سم المقربة لأقرب سنتيمتر؟\nالإجابة النموذجية: 3.5 سم و 4.5 سم\n2) [مستوى المتوقع] فئات 0 ≤ س < 10، 10 ≤ س < 20، 20 ≤ س < 30. أوجد أكبر مدى ممكن.\nالإجابة النموذجية: 30 − 0 = 30\n3) [مستوى المتقدم] أوجد أصغر مدى ممكن للفئات السابقة.\nالإجابة النموذجية: 20 − 10 = 10", "1) [مستوى الدعم] أكمل: حدا القيمة 300 كغم المقربة لأقرب 100 كغم هما 250 و ___\nالإجابة النموذجية: 350\n2) [مستوى المتوقع] فئات 2 ≤ س < 4، 4 ≤ س < 6، 6 ≤ س < 9. أوجد أكبر وأصغر مدى ممكن.\nالإجابة النموذجية: الأكبر 9 − 2 = 7، الأصغر 6 − 4 = 2\n3) [مستوى المتقدم] لماذا لا نحسب المدى الدقيق للبيانات المجمعة؟\nالإجابة النموذجية: لأننا لا نعرف القيم الفعلية داخل الفئات.", "للطالب: تمارين 5-1: الأسئلة 7–9، وكتاب النشاط ص88 (كتاب الطالب ص155–160، كتاب النشاط ص87–88).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن»."]}]}, {"id": "5-2", "title": "المدى الربيعي", "p": [{"ax": "الربيعات والمدى الربيعي للبيانات غير المجمعة", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يجد الربيع الأدنى ر1 والوسيط والربيع الأعلى ر3 لبيانات مرتبة.\n2) يحسب المدى الربيعي = ر3 − ر1.\nمخرج تعليمي آخر: يفسر المدى الربيعي بوصفه مدى النصف الأوسط من البيانات.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الربيع الأدنى، الربيع الأعلى، الوسيط، المدى الربيعي، النصف ي: المعلم: يعرض مواقف ويطلب اختيار المقياس. | الطالب: يختار ويبرر.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: السؤالان 1 و 2. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] اذكر عيبًا للمدى.\nالإجابة النموذجية: يعتمد على أكبر وأصغر قيمة فقط ويتأثر بالقيم المتطرفة.\n2) [مستوى المتوقع] اذكر ميزة للانحراف المعياري.\nالإجابة النموذجية: يستخدم جميع القيم.\n3) [مستوى المتقدم] أي المقاييس أنسب لبيانات فيها قيمة متطرفة؟\nالإجابة النموذجية: المدى الربيعي", "1) [مستوى الدعم] أكمل: المقياس الذي يستخدم جميع القيم هو ___\nالإجابة النموذجية: الانحراف المعياري\n2) [مستوى المتوقع] بيانات 10، 11، 12، 13، 50. أي مقياس تشتت أنسب؟ ولماذا؟\nالإجابة النموذجية: المدى الربيعي لوجود القيمة المتطرفة 50.\n3) [مستوى المتقدم] لماذا يُقرن الانحراف المعياري بالوسط والمدى الربيعي بالوسيط؟\nالإجابة النموذجية: لأن الانحراف يحسب حول الوسط، والربيعيات تعتمد على الترتيب مثل الوسيط.", "للطالب: تمارين 5-4: السؤالان 1 و 2 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مزايا وعيوب المدى والمدى الربيعي والانحراف المعياري»."]}, {"ax": "أثر إضافة ثابت والضرب في ثابت على مقاييس التشتت", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يبين أن إضافة ثابت لا تغير المدى والمدى الربيعي والانحراف المعياري.\n2) يبين أن الضرب في ثابت أ يضرب المدى والانحراف في |أ| والتباين في أ².\nمخرج تعليمي آخر: يطبق الخصائص لحساب مقاييس بيانات محولة.", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الإزاحة، التكبير، التحويل الخطي، ثبات التشتت عند الإزاحة.", "يسأل: إذا أضاف المعلم 5 درجات لكل الطلبة، هل يتغير انتشار الدرجات؟\nدور الطالب: يتوقع أن الانتشار لا يتغير.", "(5 د) التهيئة: المعلم: يسأل: إذا أضاف المعلم 5 درجات لكل الطلبة، هل يتغير انتشار الدرجات؟ | الطالب: يتوقع أن الانتشار لا يتغير.\n(10 د) اكتشاف: المعلم: يعطي 2، 4، 6 (الانحراف ≈ 1.63) ويطلب الحساب بعد إضافة 10 وبعد الضرب في 3. | الطالب: يلاحظ: الإضافة لا تغير الانحراف، والضرب يضاعفه 3 مرات.\n(10 د) تعميم: المعلم: يعمم: إذا ص = أس + ب فإن انحراف ص = |أ| × انحراف س، وتباين ص = أ² × تباين س (المثال 20). | الطالب: يطبق على تحويل الحرارة: انحراف 2° م ← 3.6° ف.\n(8 د) تقويم تكويني: المعلم: يطرح أسئلة سريعة على التحويلات. | الطالب: يجيب ويبرر.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة التقويم الختامي الثلاثة على بطاقة خروج، ويوجّه كل طالب لحل سؤال مستواه على الأقل ثم محاولة السؤال التالي. | الطالب: يحل أسئلة بطاقة الخروج فرديًا ويسلّمها للمعلم.\n(2 د) الختام والواجب: المعلم: يلخّص الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: الأسئلة 3–5، وكتاب النشاط ص95. | الطالب: يشارك في التلخيص ويدوّن الواجب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] انحراف مجموعة 4، أضيف 7 لكل قيمة. الانحراف الجديد؟\nالإجابة النموذجية: 4\n2) [مستوى المتوقع] تباين مجموعة 9، ضربت القيم في 2. التباين الجديد؟\nالإجابة النموذجية: 36\n3) [مستوى المتقدم] مدى مجموعة 10، ضربت القيم في 3 ثم أضيف 1. المدى الجديد؟\nالإجابة النموذجية: 30", "1) [مستوى الدعم] أكمل: عند ضرب القيم في 5 يُضرب التباين في ___\nالإجابة النموذجية: 25\n2) [مستوى المتوقع] انحراف درجات حرارة 2° م. ما الانحراف بالفهرنهايت؟\nالإجابة النموذجية: 1.8 × 2 = 3.6\n3) [مستوى المتقدم] مدى ربيعي 6، ضربت القيم في 0.5 ثم طرح 2. المدى الربيعي الجديد؟\nالإجابة النموذجية: 3", "للطالب: تمارين 5-4: الأسئلة 3–5، وكتاب النشاط ص95 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «أثر إضافة ثابت والضرب في ثابت على مقاييس التشتت» بسؤال واحد بسيط."]}, {"ax": "اختيار مقياس التشتت المناسب للسياق", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يختار مقياس تشتت مناسبًا لبيانات   c.innerHTML='<div class="ch"><span><small>البند '+(fi+1)+'</small><b></b></span><button class="copy">نسخ</button></div><div class="cb"></div><div class="hint">تعذّر النسخ التلقائي: النص محدد الآن، انسخه يدويًا.</div>';
  c.querySelector('b').textContent=fn;const body=c.querySelector('.cb');body.innerHTML=H(text(fi));
  c.querySelector('.copy').onclick=ev=>copy(text(fi),ev.target,body,c.querySelector('.hint'));m.appendChild(c)});}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(t,btn,body,hint){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
 if(s)ok(btn);else{const r=document.createRange();r.selectNodeContents(body);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);hint.style.display='block';setTimeout(()=>hint.style.display='none',4000)}}
function copy(t,btn,body,hint){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>ok(btn),()=>fallback(t,btn,body,hint))}else fallback(t,btn,body,hint)}
draw();
