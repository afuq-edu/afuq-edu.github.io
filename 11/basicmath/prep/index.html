ن 3 + 7 + 11 + ... يعطي 210؟\nالإجابة النموذجية: ن(2ن + 1) = 210 ← 2ن² + ن − 210 = 0 ← ن = 10", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في مسألة العرضين بعد 20 سنة يكون مجموع الأول 10 × (800 + 19 × 20) = ___\nالإجابة النموذجية: 11800\n2) [مستوى التطبيق] في المسألة السابقة، أوجد مجموع العرض الثاني بعد 20 سنة وقارن.\nالإجابة النموذجية: 10 × (900 + 19 × 10) = 10900، فالأول أفضل بعد 20 سنة.\n3) [مستوى الاستدلال] مدرج فيه 20 صفًا، الأول 15 مقعدًا ويزيد كل صف 3 مقاعد. كم مقعدًا في المدرج؟\nالإجابة النموذجية: 10 × (30 + 19 × 3) = 870", "للطالب: تمارين 3-1: الأسئلة 15–18، وكتاب النشاط ص59 (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: متابعة تقدم الابن/الابنة في «مسائل حياتية على المتتاليات والمتسلسلات الحسابية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=11"]}, {"ax": "حل تمارين كتاب النشاط ومراجعة المتتاليات الحسابية", "wk": "الأسبوع السابع (18–22/10/2026م)", "f": ["1) يحل تمارين متنوعة على الحد العام والمجموع (15 دقيقة)\n2) يختار الصيغة المناسبة بحسب المعطيات (15 دقيقة)\nمخرج تعليمي آخر: يقيّم حلول زملائه ويحدد مصدر الأخطاء (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحد العام، المجموع، الحد الأخير، اختيار الصيغة، تقييم الأقران.", "يعرض المعلم جدولًا بمعطيات مختلفة (أ، د، ن، ل، جن) ناقصة ويسأل: أي صيغة نستخدم في كل حالة؟ ويحدد الطالب الصيغة المناسبة لكل صف. (5 دقائق)", "1. تعلم ذاتي: يكلف الطلبة بتمارين كتاب النشاط ص59–60 حسب المستوى، ويتابع مجموعة الدعم، ويحل الطالب حسب مستواه (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تقييم الأقران: يتبادل الطلبة الحلول ويصححونها وفق نموذج إجابة، ويصحح الطالب ويكتب ملاحظة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 3-1 ومحور «حل تمارين كتاب النشاط ومراجعة المتتاليات الحسابية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال كتاب النشاط ص59–60، وتمارين 3-1 المتبقية، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – فسائل كل عام: يزرع مزارع 5 نخلات في السنة الأولى ويزيد 3 نخلات كل سنة؛ تجد المجموعات أساس المتتالية وحدها العاشر، وتتحدث عن قيمة الزراعة والنخيل في عمان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ح12 في 100، 93، 86، ...\nالإجابة النموذجية: 100 + 11 × (−7) = 23\n2) [مستوى التطبيق] أوجد مجموع أول 12 حدًا من المتتالية السابقة.\nالإجابة النموذجية: 6 × (100 + 23) = 738\n3) [مستوى الاستدلال] متتالية حسابية مجموع أول 10 حدود منها 155 وحدها الأول 2. أوجد د.\nالإجابة النموذجية: 5 × (4 + 9د) = 155 ← 9د = 27 ← د = 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان أ = 4، د = 5 فإن ح10 = ___\nالإجابة النموذجية: 49\n2) [مستوى التطبيق] أوجد مجموع الأعداد الفردية من 1 إلى 99.\nالإجابة النموذجية: ن = 50، ج = 25 × 100 = 2500\n3) [مستوى الاستدلال] متتالية حسابية ح1 = 8 و ج10 = 35. أوجد د.\nالإجابة النموذجية: 5 × (16 + 9د) = 35 ← 9د = −9 ← د = −1", "للطالب: إكمال كتاب النشاط ص59–60، وتمارين 3-1 المتبقية (كتاب الطالب ص89–95، كتاب النشاط ص56–60).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=11"]}]}, {"id": "3-2", "title": "المتتاليات الهندسية", "p": [{"ax": "مفهوم المتتالية الهندسية والنسبة المشتركة", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يميّز المتتالية الهندسية ويجد أساسها (النسبة المشتركة) ر (15 دقيقة)\n2) يكتب حدودًا تالية لمتتالية هندسية (10 دقائق)\nمخرج تعليمي آخر: يقارن بين المتتالية الحسابية والهندسية (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "المتتالية الهندسية، الأساس (النسبة المشتركة) ر = حن+1 ÷ حن، النمو، التناقص.", "يعرض المعلم قصة حبة القمح على رقعة الشطرنج (1، 2، 4، 8، ...) ويسأل: كيف ننتقل من حد إلى الذي يليه؟ ويلاحظ الطالب الضرب في 2. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 2» ص96 لأنماط مثل طي الورقة وتضاعف البكتيريا، ويطلب حساب ناتج قسمة كل حد على سابقه، ويجد الطالب أن النسبة ثابتة في بعض الأنماط (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرّف المعلم المتتالية الهندسية ويحلل: 3، 6، 12 (ر = 2)، 81، 27، 9 (ر = 1/3)، 2، −6، 18 (ر = −3) (المثال 8)، ويحسب الطالب ر ويكتب الحدين التاليين لكل منها (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. مقارنة: يطلب المعلم ملء جدول مقارنة بين الحسابية (جمع ثابت) والهندسية (ضرب ثابت) (تقويم تكويني)، ويكمل الطالب الجدول بأمثلة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ر في 5، 15، 45، ...\nالإجابة النموذجية: ر = 3\n2) [مستوى التطبيق] اكتب الحدين التاليين في 64، 32، 16، ...\nالإجابة النموذجية: 8، 4\n3) [مستوى الاستدلال] صنف: 2، 4، 6، 8 و 2، 4، 8، 16.\nالإجابة النموذجية: الأولى حسابية (د = 2) والثانية هندسية (ر = 2).", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: أساس المتتالية الهندسية 2، −6، 18، ... هو ___\nالإجابة النموذجية: −3\n2) [مستوى التطبيق] متتالية هندسية أ = 4، ر = 1/2. اكتب حدودها الأربعة الأولى.\nالإجابة النموذجية: 4، 2، 1، 1/2\n3) [مستوى الاستدلال] أوجد س إذا كانت 4، س، 25 حدودًا متتالية في متتالية هندسية موجبة.\nالإجابة النموذجية: س ÷ 4 = 25 ÷ س ← س² = 100 ← س = 10", "للطالب: تمارين 3-2: الأسئلة 1–3 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم المتتالية الهندسية والنسبة المشتركة».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "الحد العام للمتتالية الهندسية ورتبة حد", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يستخدم صيغة الحد العام حن = أ ر^(ن − 1) (15 دقيقة)\n2) يجد رتبة حد معلوم في متتالية هندسية (15 دقيقة)\nمخرج تعليمي آخر: يستنتج صيغة الحد العام من نمط الحدود (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الحد العام للمتتالية الهندسية، الأسس، رتبة الحد، قوى العدد.", "يسأل المعلم: كم حبة قمح في المربع العاشر من رقعة الشطرنج؟ ويكتب الطالب 1، 2، 4، ... ويستنتج 2^9 = 512. (5 دقائق)", "1. النمذجة: يبني المعلم الصيغة: ح1 = أ، ح2 = أر، ح3 = أر²، ... حن = أر^(ن − 1)، ويطبق: 3، 6، 12، ... ح8 = 3 × 2^7 = 384 (المثال 9)، ويشارك الطالب ويطبق على 81، 27، 9: ح6 = 81 × (1/3)^5 = 1/3 (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم أسئلة رتبة الحد: أي حد في 3، 6، 12، ... يساوي 192؟ (المثال 10)، وتحل المجموعة: 3 × 2^(ن − 1) = 192 ← 2^(ن − 1) = 64 ← ن = 7 (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 4–6، وكتاب النشاط ص61، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ح6 في 2، 10، 50، ...\nالإجابة النموذجية: 2 × 5^5 = 6250\n2) [مستوى التطبيق] اكتب الحد العام للمتتالية 5، 10، 20، ...\nالإجابة النموذجية: حن = 5 × 2^(ن − 1)\n3) [مستوى الاستدلال] أي حد في 1، 3، 9، ... يساوي 243؟\nالإجابة النموذجية: 3^(ن − 1) = 243 = 3^5 ← ن = 6", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الحد العام للمتتالية الهندسية حن = أ ر^(___)\nالإجابة النموذجية: ن − 1\n2) [مستوى التطبيق] أوجد ح5 في 48، 24، 12، ...\nالإجابة النموذجية: 48 × (1/2)^4 = 3\n3) [مستوى الاستدلال] كم حدًا في 4، 8، 16، ...، 1024؟\nالإجابة النموذجية: 2^(ن − 1) = 256 = 2^8 ← ن = 9", "للطالب: تمارين 3-2: الأسئلة 4–6، وكتاب النشاط ص61 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الحد العام للمتتالية الهندسية ورتبة حد» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "إيجاد الحد الأول والنسبة المشتركة من حدين معلومين", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يكوّن معادلتين في أ و ر من حدين معلومين (15 دقيقة)\n2) يجد ر بقسمة المعادلتين ثم يجد أ (15 دقيقة)\nمخرج تعليمي آخر: يناقش حالتي ر الموجبة والسالبة عند الأسس الزوجية (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الأقلام", "قسمة المعادلات، الجذر التكعيبي، القوة الزوجية، قيمتا ر الممكنتان.", "يسأل المعلم: إذا كان ر² = 9 فما قيم ر؟ وإذا كان ر³ = 27؟ ويجيب الطالب ±3 للأولى و 3 للثانية. (5 دقائق)", "1. النمذجة: ينمذج المعلم: ح2 = أر = 6، ح5 = أر^4 = 162 ← ر³ = 27 ← ر = 3، أ = 2 (المثال 11)، ويتابع الطالب ويطبق على ح3 = 12، ح6 = 96 (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسألة: ح2 = 6، ح4 = 54 ويطلب كل القيم الممكنة لـ ر و أ (المثال 12)، وتجد المجموعة: ر² = 9 ← ر = 3 (أ = 2) أو ر = −3 (أ = −2) (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 7–9، وكتاب النشاط ص62، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ح3 = 12، ح6 = 96. أوجد ر.\nالإجابة النموذجية: ر³ = 8 ← ر = 2\n2) [مستوى التطبيق] أوجد أ في السؤال السابق.\nالإجابة النموذجية: أ × 4 = 12 ← أ = 3\n3) [مستوى الاستدلال] ح2 = 6، ح4 = 54. أوجد القيم الممكنة لـ ر.\nالإجابة النموذجية: ر² = 9 ← ر = ±3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان ح1 = 5 و ح4 = −40 فإن ر = ___\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] ح2 = 10، ح5 = 80. أوجد أ و ر.\nالإجابة النموذجية: ر³ = 8 ← ر = 2، أ = 5\n3) [مستوى الاستدلال] ح3 = 18، ح5 = 162، أوجد ح1 لكل قيمة ممكنة لـ ر.\nالإجابة النموذجية: ر² = 9 ← ر = ±3، وفي الحالتين أ = 18 ÷ 9 = 2", "للطالب: تمارين 3-2: الأسئلة 7–9، وكتاب النشاط ص62 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد الحد الأول والنسبة المشتركة من حدين معلومين».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "المتسلسلة الهندسية ومجموع أول ن حدًا", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يستخدم صيغة مجموع أول ن حدًا جن = أ(1 − رⁿ) ÷ (1 − ر) (15 دقيقة)\n2) يختار صيغة المجموع المناسبة بحسب ر > 1 أو ر < 1 (15 دقيقة)\nمخرج تعليمي آخر: يبرر الصيغة بطرح جن من ر جن (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "المتسلسلة الهندسية، مجموع أول ن حدًا، الصيغة أ(رⁿ − 1) ÷ (ر − 1)، الطرح المتداخل.", "يطلب المعلم حساب 1 + 2 + 4 + 8 + 16 ثم مقارنته بـ 2^5 − 1، ويجد الطالب 31 = 32 − 1 ويتساءل عن السبب. (5 دقائق)", "1. النمذجة: يبرهن المعلم الصيغة: جن = أ + أر + ... + أرⁿ⁻¹، ر جن = أر + ... + أرⁿ، بالطرح: جن(1 − ر) = أ(1 − رⁿ) (المثال 13)، ويتابع الطالب البرهان ويكمل الخطوات الناقصة (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يطبق المعلم: 2 + 6 + 18 + ... (6 حدود) = 2(3^6 − 1) ÷ 2 = 728؛ و 64 + 32 + ... (6 حدود) = 64(1 − (1/2)^6) ÷ (1/2) = 126، ويحسب الطالب بالصيغتين ويتحقق بالآلة الحاسبة (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 10–12، وكتاب النشاط ص63، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد مجموع أول 5 حدود من 3، 6، 12، ...\nالإجابة النموذجية: 3(2^5 − 1) ÷ 1 = 93\n2) [مستوى التطبيق] أوجد مجموع أول 4 حدود من 81، 27، 9، ...\nالإجابة النموذجية: 81(1 − (1/3)^4) ÷ (2/3) = 120\n3) [مستوى الاستدلال] أوجد 1 + 3 + 9 + ... + 729.\nالإجابة النموذجية: ن = 7، ج = (3^7 − 1) ÷ 2 = 1093", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مجموع أول 6 حدود من 2، 6، 18، ... يساوي ___\nالإجابة النموذجية: 728\n2) [مستوى التطبيق] أوجد مجموع أول 8 حدود من 1، 2، 4، ...\nالإجابة النموذجية: 2^8 − 1 = 255\n3) [مستوى الاستدلال] أوجد مجموع أول 5 حدود من 5، −10، 20، ...\nالإجابة النموذجية: 5(1 − (−2)^5) ÷ (1 − (−2)) = 5 × 33 ÷ 3 = 55", "للطالب: تمارين 3-2: الأسئلة 10–12، وكتاب النشاط ص63 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "تطبيقات حياتية على المتتاليات والمتسلسلات الهندسية", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) ينمذج النمو والتناقص بنسبة مئوية ثابتة بمتتالية هندسية (5 دقائق)\n2) يحسب قيمة استثمار أو عدد سكان بعد عدد من السنوات (20 دقيقة)\nمخرج تعليمي آخر: يقارن بين النمو الحسابي والنمو الهندسي في المدى البعيد (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "معامل النمو، الزيادة بنسبة مئوية، التناقص بنسبة مئوية، الاستثمار، النمو السكاني.", "يسأل المعلم: إذا زاد سعر سلعة 10% ثم 10% مرة أخرى، هل الزيادة الكلية 20%؟ ويحسب الطالب: 1.1 × 1.1 = 1.21 أي 21%. (5 دقائق)", "1. حل مشكلة: يعرض المعلم: استثمار 1000 ريال يزيد 5% سنويًا، القيمة بعد 3 سنوات = 1000 × 1.05^3 ≈ 1157.63 ريالًا، ويناقش معامل النمو 1.05، ويحسب الطالب القيم سنة بسنة ويتحقق بالصيغة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل: سيارة قيمتها 8000 ريال تفقد 15% سنويًا (قيمتها بعد 4 سنوات)، وبكتيريا تتضاعف كل ساعة، وتحسب المجموعة: 8000 × 0.85^4 ≈ 4176 ريالًا، وعدد البكتيريا بعد 10 ساعات من 50 خلية = 50 × 2^10 = 51200 (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. مقارنة: يقارن المعلم بين ادخار حسابي (زيادة 10 ريالات) وهندسي (زيادة 10%) يبدأ كلاهما بـ 100 ريال على 10 سنوات (تقويم تكويني)، ويحسب الطالب الحد العاشر: الحسابي 190، والهندسي 100 × 1.1^9 ≈ 235.8 (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 13–16، وكتاب النشاط ص64، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما معامل النمو لزيادة سنوية 8%؟\nالإجابة النموذجية: 1.08\n2) [مستوى التطبيق] ما معامل التناقص لانخفاض سنوي 15%؟\nالإجابة النموذجية: 0.85\n3) [مستوى الاستدلال] قيمة 1000 ريال بعد سنتين بزيادة 5% سنويًا؟\nالإجابة النموذجية: 1000 × 1.05² = 1102.5 ريال", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا تضاعفت البكتيريا كل ساعة فالأساس ر = ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] عدد سكان قرية 2000 نسمة ويزيد 3% سنويًا. أوجد العدد بعد 5 سنوات.\nالإجابة النموذجية: 2000 × 1.03^5 ≈ 2319 نسمة\n3) [مستوى الاستدلال] هاتف ثمنه 300 ريال يفقد 20% من قيمته سنويًا. بعد كم سنة تقل قيمته عن 150 ريالًا؟\nالإجابة النموذجية: 300 × 0.8^ن < 150: بعد 3 سنوات (153.6) لا، بعد 4 سنوات (122.88) نعم، أي 4 سنوات.", "للطالب: تمارين 3-2: الأسئلة 13–16، وكتاب النشاط ص64 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: متابعة تقدم الابن/الابنة في «تطبيقات حياتية على المتتاليات والمتسلسلات الهندسية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "تمارين متنوعة ومقارنة بين المتتاليات الحسابية والهندسية", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يحدد نوع المتتالية (حسابية أو هندسية) ويختار الصيغ المناسبة (20 دقيقة)\n2) يحل مسائل تجمع بين النوعين (5 دقائق)\nمخرج تعليمي آخر: يصمم متتالية تحقق شروطًا معطاة (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المتتالية الحسابية، المتتالية الهندسية، الوسط الحسابي، الوسط الهندسي، اختيار الصيغة.", "يعرض المعلم 4 متتاليات ويطلب فرزها في عمودين: حسابية / هندسية / لا هذا ولا ذاك، ويفرز الطالب ويبرر. (5 دقائق)", "1. تعلم ذاتي: يكلف المعلم بحل تمارين كتاب النشاط المتبقية ص61–64 حسب المستوى، ويحل الطالب حسب مستواه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تحدٍّ تعاوني: يطرح المعلم تحديًا: ثلاثة أعداد تشكل متتالية حسابية مجموعها 15، وإذا أضيف 1، 3، 9 إليها على الترتيب تشكل متتالية هندسية. أوجدها، وتحل المجموعة: الأعداد 5 − د، 5، 5 + د ← (6 − د)(14 + د) = 8² ← د² + − 20 = 0 ← د = 2 أو −10، فالأعداد 3، 5، 7 أو 15، 5، −5 (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 3-2 ومحور «تمارين متنوعة ومقارنة بين المتتاليات الحسابية والهندسية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال كتاب النشاط ص61–64، والتحضير للدرس 3-3، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – مبادرة الشجرة تتضاعف: تقترح المجموعات مبادرة تشجير يدعو فيها كل مشارك اثنين جديدين، فتكتب المتتالية الهندسية 1، 2، 4، … وتجد أساسها وحدًّا تاليًا، وتناقش أثر التطوع في المجتمع (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صنف: 10، 7، 4، 1 و 10، 5، 2.5، 1.25.\nالإجابة النموذجية: الأولى حسابية (د = −3)، الثانية هندسية (ر = 1/2).\n2) [مستوى التطبيق] أوجد الوسط الهندسي للعددين 4 و 9.\nالإجابة النموذجية: √36 = 6\n3) [مستوى الاستدلال] أوجد الوسط الحسابي للعددين 4 و 9.\nالإجابة النموذجية: (4 + 9) ÷ 2 = 6.5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في المتتالية الهندسية ناتج قسمة أي حد على سابقه ___\nالإجابة النموذجية: ثابت\n2) [مستوى التطبيق] صمم متتالية هندسية حدها الأول 3 وحدها الرابع 24.\nالإجابة النموذجية: ر³ = 8 ← ر = 2: 3، 6، 12، 24\n3) [مستوى الاستدلال] أعداد في متتالية حسابية مجموعها 15، أوسطها؟\nالإجابة النموذجية: 5 (لأن 3 × الأوسط = 15)", "للطالب: إكمال كتاب النشاط ص61–64، والتحضير للدرس 3-3 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}]}, {"id": "3-3", "title": "المتسلسلات الهندسية غير المنتهية", "p": [{"ax": "فكرة التقارب وشرطه في المتسلسلة الهندسية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يستكشف سلوك مجموع حدود متسلسلة هندسية عندما يزداد عدد الحدود (15 دقيقة)\n2) يذكر شرط تقارب المتسلسلة الهندسية |ر| < 1 (15 دقيقة)\nمخرج تعليمي آخر: يميّز المتسلسلات المتقاربة من المتباعدة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: مربع ورقي ومقص\n- أخرى: الآلة الحاسبة العلمية", "المتسلسلة غير المنتهية، التقارب، التباعد، شرط التقارب |ر| < 1، المجموع الجزئي.", "يقص المعلم مربعًا ورقيًا: يأخذ النصف ثم نصف الباقي ثم نصف الباقي... ويسأل: هل سنصل إلى المربع كاملًا؟ ويلاحظ الطالب أن المجموع 1/2 + 1/4 + 1/8 + ... يقترب من 1. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 3» ص103، ويطلب حساب المجاميع الجزئية لـ 1/2 + 1/4 + 1/8 + ... ولـ 1 + 2 + 4 + ... في جدول، ويلاحظ الطالب أن الأولى تقترب من 1 والثانية تكبر بلا حد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يربط المعلم التقارب بقيمة ر: عندما |ر| < 1 تصغر رⁿ وتقترب من الصفر فيقترب جن من قيمة ثابتة (المثال 14)، ويحسب الطالب (1/2)^10 و 2^10 بالآلة الحاسبة ويقارن (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: السؤال 1، وكتاب النشاط ص65، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل المتسلسلة 9 + 3 + 1 + ... متقاربة؟\nالإجابة النموذجية: نعم، ر = 1/3 و |ر| < 1\n2) [مستوى التطبيق] هل المتسلسلة 2 + 6 + 18 + ... متقاربة؟\nالإجابة النموذجية: لا، ر = 3 > 1 فهي متباعدة.\n3) [مستوى الاستدلال] هل المتسلسلة 8 − 4 + 2 − ... متقاربة؟\nالإجابة النموذجية: نعم، ر = −1/2 و |ر| < 1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: شرط تقارب المتسلسلة الهندسية هو |ر| ___ 1\nالإجابة النموذجية: <\n2) [مستوى التطبيق] صنف: 5 + 5 + 5 + ...\nالإجابة النموذجية: متباعدة لأن ر = 1\n3) [مستوى الاستدلال] ماذا يحدث لـ (0.9)ⁿ عندما تكبر ن؟ وما أثر ذلك على المجموع؟\nالإجابة النموذجية: تقترب من الصفر، فيقترب جن من أ ÷ (1 − ر).", "للطالب: تمارين 3-3: السؤال 1، وكتاب النشاط ص65 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «فكرة التقارب وشرطه في المتسلسلة الهندسية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "مجموع المتسلسلة الهندسية إلى ما لا نهاية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يستخدم الصيغة ج∞ = أ ÷ (1 − ر) لإيجاد المجموع إلى ما لا نهاية (15 دقيقة)\n2) يتحقق من شرط التقارب قبل استخدام الصيغة (10 دقائق)\nمخرج تعليمي آخر: يستنتج الصيغة من صيغة جن عندما تقترب رⁿ من الصفر (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات متسلسلات", "المجموع إلى ما لا نهاية ج∞، الصيغة أ ÷ (1 − ر)، شرط التقارب.", "يسأل المعلم: في صيغة جن = أ(1 − رⁿ) ÷ (1 − ر)، ماذا يصبح البسط إذا اقتربت رⁿ من الصفر؟ ويستنتج الطالب أ ÷ (1 − ر). (5 دقائق)", "1. النمذجة: يطبق المعلم: 12 + 6 + 3 + ... ← ج∞ = 12 ÷ (1/2) = 24؛ 9 − 3 + 1 − ... ← ج∞ = 9 ÷ (4/3) = 27/4 (المثال 15)، ويتابع الطالب ويحسب ج∞ لـ 1/2 + 1/4 + ... = 1 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم بطاقات متسلسلات بعضها متباعد، ويطلب حساب ج∞ لما يتقارب فقط، وتتحقق المجموعة من الشرط ثم تحسب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحليل خطأ: يعرض المعلم حلًا حسب ج∞ للمتسلسلة 2 + 4 + 8 + ... فحصل على −2، ويطلب تفسير الخطأ (تقويم تكويني)، ويوضح الطالب أن ر = 2 لا تحقق الشرط (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: السؤالان 2 و 3، وكتاب النشاط ص66، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ج∞ للمتسلسلة 20 + 10 + 5 + ...\nالإجابة النموذجية: 20 ÷ (1/2) = 40\n2) [مستوى التطبيق] أوجد ج∞ للمتسلسلة 1 − 1/3 + 1/9 − ...\nالإجابة النموذجية: 1 ÷ (4/3) = 3/4\n3) [مستوى الاستدلال] لماذا لا نحسب ج∞ للمتسلسلة 3 + 6 + 12 + ...؟\nالإجابة النموذجية: لأن ر = 2 و |ر| > 1 فهي متباعدة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: ج∞ للمتسلسلة 12 + 6 + 3 + ... يساوي ___\nالإجابة النموذجية: 24\n2) [مستوى التطبيق] أوجد ج∞ للمتسلسلة 100 + 80 + 64 + ...\nالإجابة النموذجية: ر = 0.8، ج∞ = 100 ÷ 0.2 = 500\n3) [مستوى الاستدلال] أوجد ج∞ للمتسلسلة 9 − 3 + 1 − ...\nالإجابة النموذجية: 27/4 = 6.75", "للطالب: تمارين 3-3: السؤالان 2 و 3، وكتاب النشاط ص66 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مجموع المتسلسلة الهندسية إلى ما لا نهاية» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "إيجاد الحد الأول أو الأساس بمعلومية المجموع إلى ما لا نهاية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يكوّن معادلة من ج∞ ويحلها لإيجاد أ أو ر (15 دقيقة)\n2) يستبعد قيم ر التي لا تحقق شرط التقارب (15 دقيقة)\nمخرج تعليمي آخر: يحل مسائل تربط ج∞ بحدود معطاة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "معادلة المجموع إلى ما لا نهاية، استبعاد الحلول، شرط التقارب.", "يسأل المعلم: إذا كان أ ÷ (1 − ر) = 20 و أ = 5، فكم 1 − ر؟ ويحسب الطالب 1 − ر = 1/4 فـ ر = 3/4. (5 دقائق)", "1. النمذجة: ينمذج المعلم: ج∞ = 20، أ = 5 ← ر = 3/4؛ و ج∞ = 3أ ← 1 ÷ (1 − ر) = 3 ← ر = 2/3 (المثال 16)، ويحل الطالب أمثلة مشابهة على السبورة الصغيرة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسألة: متسلسلة هندسية متقاربة حدها الثاني 4 ومجموعها إلى ما لا نهاية 18. أوجد ر، وتكوّن المجموعة: أر = 4 و أ ÷ (1 − ر) = 18 ← 4 ÷ ر = 18(1 − ر) ← 9ر² − 9ر + 2 = 0 ← ر = 1/3 أو 2/3 (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: السؤالان 4 و 5، وكتاب النشاط ص67، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ج∞ = 30، أ = 10. أوجد ر.\nالإجابة النموذجية: 1 − ر = 1/3 ← ر = 2/3\n2) [مستوى التطبيق] ج∞ = 16، ر = 1/4. أوجد أ.\nالإجابة النموذجية: أ = 16 × 3/4 = 12\n3) [مستوى الاستدلال] ج∞ = 2أ. أوجد ر.\nالإجابة النموذجية: 1 ÷ (1 − ر) = 2 ← ر = 1/2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان ج∞ = 20 و أ = 5 فإن ر = ___\nالإجابة النموذجية: 3/4\n2) [مستوى التطبيق] متسلسلة متقاربة ر = −1/2 و ج∞ = 8. أوجد أ.\nالإجابة النموذجية: أ = 8 × 3/2 = 12\n3) [مستوى الاستدلال] حدها الثاني 4 و ج∞ = 18، وجدنا ر = 1/3 أو 2/3. أوجد أ لكل قيمة.\nالإجابة النموذجية: ر = 1/3 ← أ = 12؛ ر = 2/3 ← أ = 6", "للطالب: تمارين 3-3: السؤالان 4 و 5، وكتاب النشاط ص67 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد الحد الأول أو الأساس بمعلومية المجموع إلى ما لا نهاية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "تحويل الكسر العشري الدوري إلى كسر اعتيادي", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يكتب الكسر العشري الدوري متسلسلة هندسية غير منتهية (15 دقيقة)\n2) يحول الكسر العشري الدوري إلى كسر اعتيادي باستخدام ج∞ (10 دقائق)\nمخرج تعليمي آخر: يبرر لماذا 0.999... = 1 (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الكسر العشري الدوري، الدورة، الكسر الاعتيادي، المتسلسلة الهندسية.", "يطلب المعلم كتابة 1/3 كسرًا عشريًا، ثم يسأل: هل يمكن أن نعكس العملية؟ ويكتب الطالب 0.333... ويفكر في العكس. (5 دقائق)", "1. النمذجة: ينمذج المعلم: 0.333... = 0.3 + 0.03 + 0.003 + ... ← ج∞ = 0.3 ÷ 0.9 = 1/3؛ و 0.2727... = 0.27 ÷ 0.99 = 27/99 = 3/11 (المثال 17)، ويكتب الطالب المتسلسلة ويحدد أ و ر (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: يوزع المعلم على الأزواج: 0.777...، 0.1515...، 1.444، ويحول الطالب: 7/9، 15/99 = 5/33، 1 + 4/9 = 13/9 (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. نقاش: يطرح المعلم: هل 0.999... = 1؟ ويطلب البرهان بالمتسلسلة (تقويم تكويني)، ويبرهن الطالب: 0.9 ÷ 0.1 = 1 (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: السؤالان 6 و 7، وكتاب النشاط ص68، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اكتب 0.555... متسلسلة هندسية وحدد أ و ر.\nالإجابة النموذجية: 0.5 + 0.05 + ...، أ = 0.5، ر = 0.1\n2) [مستوى التطبيق] حوّل 0.555... إلى كسر اعتيادي.\nالإجابة النموذجية: 0.5 ÷ 0.9 = 5/9\n3) [مستوى الاستدلال] حوّل 0.1818... إلى كسر اعتيادي.\nالإجابة النموذجية: 0.18 ÷ 0.99 = 18/99 = 2/11", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: 0.777... = ___ في صورة كسر اعتيادي.\nالإجابة النموذجية: 7/9\n2) [مستوى التطبيق] حوّل 0.3636... إلى كسر اعتيادي.\nالإجابة النموذجية: 36/99 = 4/11\n3) [مستوى الاستدلال] بيّن أن 0.999... = 1.\nالإجابة النموذجية: أ = 0.9، ر = 0.1، ج∞ = 0.9 ÷ 0.9 = 1", "للطالب: تمارين 3-3: السؤالان 6 و 7، وكتاب النشاط ص68 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "تطبيقات حياتية على المتسلسلات الهندسية غير المنتهية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) ينمذج مواقف حياتية (ارتداد كرة، أرجوحة، دواء) بمتسلسلة هندسية غير منتهية (5 دقائق)\n2) يحسب المسافة الكلية لكرة مرتدة (20 دقيقة)\nمخرج تعليمي آخر: يقيّم معقولية النموذج الرياضي في الواقع (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم المبني على المشاريع", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: كرة", "الارتداد، المسافة الكلية، النموذج الرياضي، حدود النموذج.", "يُسقط المعلم كرة من ارتفاع مناسب ويسأل: هل تتوقف الكرة؟ وكم المسافة الكلية التي تقطعها؟ ويلاحظ الطالب تناقص الارتفاع ويتوقع مسافة محدودة. (5 دقائق)", "1. حل مشكلة: يعرض المعلم: كرة تسقط من 10 م وترتد 60% من ارتفاعها في كل مرة. المسافة الكلية = 10 + 2 × (6 ÷ (1 − 0.6)) = 10 + 30 = 40 م، ويرسم الطالب مخطط الارتدادات ويحسب، ويفسر سبب الضرب في 2 (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل كتاب النشاط ص69–70 (أرجوحة تقطع 80% من القوس السابق بدءًا بـ 5 م، تراكم مادة دوائية)، وتحل المجموعة: الأرجوحة 5 ÷ 0.2 = 25 م (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. نقاش: يسأل المعلم: هل ترتد الكرة فعلًا عددًا لا نهائيًا من المرات؟ ما حدود النموذج؟ (تقويم تكويني)، ويناقش الطالب الفرق بين النموذج والواقع (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: الأسئلة 8–10، وكتاب النشاط ص69–70، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أول ارتداد لكرة سقطت من 10 م وترتد 60%؟\nالإجابة النموذجية: 6 م\n2) [مستوى التطبيق] مجموع ارتفاعات الارتدادات فقط (للأعلى)؟\nالإجابة النموذجية: 6 ÷ 0.4 = 15 م\n3) [مستوى الاستدلال] المسافة الكلية التي تقطعها الكرة؟\nالإجابة النموذجية: 10 + 2 × 15 = 40 م", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: أرجوحة تقطع 5 م ثم 80% مما قبله، المسافة الكلية ___ م\nالإجابة النموذجية: 25\n2) [مستوى التطبيق] كرة تسقط من 8 م وترتد نصف ارتفاعها. أوجد المسافة الكلية.\nالإجابة النموذجية: 8 + 2 × (4 ÷ 0.5) = 24 م\n3) [مستوى الاستدلال] لماذا نضرب مجموع الارتدادات في 2؟\nالإجابة النموذجية: لأن الكرة تصعد كل ارتفاع ثم تهبطه.", "للطالب: تمارين 3-3: الأسئلة 8–10، وكتاب النشاط ص69–70 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: متابعة تقدم الابن/الابنة في «تطبيقات حياتية على المتسلسلات الهندسية غير المنتهية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "مراجعة الوحدة الثالثة: المتتاليات والمتسلسلات", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يربط بين المتتاليات الحسابية والهندسية والمتسلسلات غير المنتهية (5 دقائق)\n2) يحل أسئلة مراجعة نهاية الوحدة وكتاب النشاط (25 دقيقة)\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا ويحدد احتياجاته (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحد العام، المجموع، النسبة المشتركة، الفرق المشترك، التقارب، المجموع إلى ما لا نهاية.", "ينظم المعلم لعبة «اكتشف القاعدة»: يعرض ثلاثة حدود ويطلب تحديد النوع والقاعدة خلال 20 ثانية، ويتنافس الطلبة في الإجابة. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص109 وما بعدها على المجموعات حسب المحاور، وتحل المجموعة محورها (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: تعرض المجموعات حلولها، ويثبت المعلم جدول الصيغ للوحدة، وتشرح المجموعة وتجيب عن الأسئلة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...» للوحدة (تقويم تكويني)، ويقيم الطالب نفسه ويحدد ما يراجعه (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. المعلم: يختار المعلم الدرس 3-3 ومحور «مراجعة الوحدة الثالثة: المتتاليات والمتسلسلات»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة، وكتاب النشاط ص71–72، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – نصف الطريق إلى القلعة: يناقش الطلبة سائحًا يقطع كل دقيقة نصف المسافة المتبقية إلى بوابة قلعة نزوى، فيكتبون المتسلسلة ½ + ¼ + ⅛ + … ويستنتجون مجموعها وشرط التقارب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صنف وحدد القاعدة: 6، 2، 2/3، ...\nالإجابة النموذجية: هندسية، ر = 1/3\n2) [مستوى التطبيق] أوجد ج∞ للمتتالية السابقة.\nالإجابة النموذجية: 6 ÷ (2/3) = 9\n3) [مستوى الاستدلال] أوجد مجموع أول 20 حدًا من 1، 4، 7، ...\nالإجابة النموذجية: 10 × (2 + 19 × 3) = 590", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المتسلسلة الهندسية تتقارب عندما ___ < ر < ___\nالإجابة النموذجية: −1 و 1\n2) [مستوى التطبيق] أوجد ح10 في 3، 8، 13، ...\nالإجابة النموذجية: 3 + 9 × 5 = 48\n3) [مستوى الاستدلال] متسلسلة هندسية متقاربة أ = 6 و ج∞ = 10. أوجد ح3.\nالإجابة النموذجية: ر = 2/5، ح3 = 6 × 4/25 = 24/25", "للطالب: إكمال تمارين مراجعة نهاية الوحدة، وكتاب النشاط ص71–72 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}]}, {"id": "4-1أ", "title": "مقاييس النزعة المركزية: الوسط الحسابي", "p": [{"ax": "مفهوم النزعة المركزية والوسط الحسابي للبيانات غير المجمعة", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يوضح مفهوم مقاييس النزعة المركزية والحاجة إليها (5 دقائق)\n2) يحسب الوسط الحسابي لبيانات غير مجمعة (25 دقيقة)\nمخرج تعليمي آخر: يجد قيمة مفقودة بمعلومية الوسط الحسابي (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "النزعة المركزية، الوسط الحسابي، المعدل، البيانات غير المجمعة، مجموع القيم مج س.", "يعرض المعلم درجات الحرارة العظمى في مسقط خلال 5 أيام: 34، 36، 35، 38، 37، ويسأل: كيف نعبّر عن «درجة الحرارة النموذجية» لهذه الأيام بعدد واحد؟ ويقترح الطالب جمع القيم وقسمتها على عددها. (5 دقائق)", "1. النمذجة: يعرّف المعلم الوسط الحسابي = مج س ÷ ن، ويحسب مع الطلبة وسط درجات الحرارة: 180 ÷ 5 = 36 (المثال 1)، ويحسب الطالب الوسط لمجموعة أخرى: 4، 7، 7، 9، 13 ← 8 (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يعرض المعلم: وسط 5 أعداد يساوي 12، وأربعة منها 10، 14، 9، 15. ما العدد الخامس؟ (المثال 2)، ويحسب المجموع الكلي 60 ويطرح 48 فيجد 12 (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الوسط الحسابي للقيم 6، 8، 10، 12.\nالإجابة النموذجية: 36 ÷ 4 = 9\n2) [مستوى التطبيق] وسط 4 أعداد 15. ما مجموعها؟\nالإجابة النموذجية: 60\n3) [مستوى الاستدلال] وسط 6 درجات 70، أضيفت درجة 84. ما الوسط الجديد؟\nالإجابة النموذجية: (420 + 84) ÷ 7 = 72", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الوسط الحسابي = مجموع القيم ÷ ___\nالإجابة النموذجية: عددها\n2) [مستوى التطبيق] أوجد الوسط الحسابي: 3، 5، 5، 8، 9.\nالإجابة النموذجية: 30 ÷ 5 = 6\n3) [مستوى الاستدلال] وسط 5 أعداد 20، وأربعة منها 18، 22، 25، 17. أوجد الخامس.\nالإجابة النموذجية: 100 − 82 = 18", "للطالب: تمارين 4-1: الأسئلة 1–3 (كتاب الطالب ص114–118، كتاب النشاط ص73–75).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم النزعة المركزية والوسط الحسابي للبيانات غير المجمعة».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=14"]}, {"ax": "الوسط الحسابي من الجدول التكراري", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يكوّن عمود (س × ت) في الجدول التكراري ويحسب المجاميع (15 دقيقة)\n2) يحسب الوسط الحسابي = مج(س × ت) ÷ مج ت (5 دقائق)\nمخرج تعليمي آخر: يفسر الوسط الحسابي في سياق البيانات (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الجدول التكراري، التكرار ت، مج ت، مج(س × ت)، الوسط الحسابي الموزون.", "يسأل المعلم: سجلنا عدد الإخوة لعشرين طالبًا. هل نجمع 20 عددًا؟ أم هناك طريقة أسرع؟ ويقترح الطالب ضرب كل قيمة في تكرارها. (5 دقائق)", "1. النمذجة: ينمذج المعلم جدول: عدد الإخوة س = 0، 1، 2، 3، 4 بتكرارات 3، 5، 8، 3، 1؛ مج ت = 20، مج(س × ت) = 34، الوسط = 1.7 (المثالان 3 و 4)، ويكمل الطالب عمود س × ت ويحسب المجاميع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول تكرارية من سياقات عمانية (عدد الأهداف في مباريات دوري، عدد الرسائل اليومية)، وتحسب المجموعة الوسط وتفسره بجملة (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحليل خطأ: يعرض المعلم خطأ: قسمة مج(س × ت) على عدد القيم المختلفة (5) بدل مج ت (تقويم تكويني)، ويصحح الطالب الخطأ ويوضح السبب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 4–6، وكتاب النشاط ص73، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] في الجدول: س = 1، 2، 3 و ت = 2، 5، 3، أوجد مج(س × ت).\nالإجابة النموذجية: 2 + 10 + 9 = 21\n2) [مستوى التطبيق] أوجد الوسط الحسابي للجدول السابق.\nالإجابة النموذجية: 21 ÷ 10 = 2.1\n3) [مستوى الاستدلال] لماذا نقسم على مج ت وليس على عدد القيم المختلفة؟\nالإجابة النموذجية: لأن مج ت هو العدد الكلي للمشاهدات.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الوسط الحسابي من جدول تكراري = مج(س × ت) ÷ ___\nالإجابة النموذجية: مج ت\n2) [مستوى التطبيق] س = 0، 1، 2، 3 و ت = 4، 6، 7، 3. أوجد الوسط.\nالإجابة النموذجية: (0 + 6 + 14 + 9) ÷ 20 = 1.45\n3) [مستوى الاستدلال] س = 5، 6، 7 و ت = 2، ك، 3، والوسط 6.1. أوجد ك.\nالإجابة النموذجية: (10 + 6ك + 21) ÷ (5 + ك) = 6.1 ← 31 + 6ك = 30.5 + 6.1ك ← ك = 5", "للطالب: تمارين 4-1: الأسئلة 4–6، وكتاب النشاط ص73 (كتاب الطالب ص114–118، كتاب النشاط ص73–75).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الوسط الحسابي من الجدول التكراري» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=14"]}, {"ax": "الوسط من التمثيلات البيانية والوسط المركب لمجموعتين", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يستخرج البيانات من الأعمدة البيانية ومخطط الساق والورقة لحساب الوسط (15 دقيقة)\n2) يحسب الوسط المركب لمجموعتين (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين مجموعتين باستخدام الوسط الحسابي (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الأعمدة البيانية، مخطط الساق والورقة، الوسط المركب، المقارنة بين المجموعات.", "يسأل المعلم: صف فيه 20 طالبًا وسطهم 70، وصف فيه 30 طالبًا وسطهم 80. هل وسط الصفين معًا 75؟ ويتوقع الطالب ثم يتحقق. (5 دقائق)", "1. النمذجة: ينمذج المعلم الوسط المركب: (20 × 70 + 30 × 80) ÷ 50 = 3800 ÷ 50 = 76، ويوضح لماذا ليس 75 (المثال 5)، ويحسب الطالب ويفسر أثر حجم المجموعة الأكبر (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مخطط ساق وورقة لأوزان طلبة وأعمدة بيانية لعدد الكتب المقروءة، ويطلب حساب الوسط منهما (كتاب النشاط ص74–75)، وتستخرج المجموعة البيانات وتحسب الوسط (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 4-1أ ومحور «الوسط من التمثيلات البيانية والوسط المركب لمجموعتين»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-1: الأسئلة 7–9، وكتاب النشاط ص74–75، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – متوسط محصول التمر: يعطي المعلم كميات افتراضية لتمر خمس نخلات (40، 55، 60، 45، 50 كجم)، فتحسب المجموعات الوسط الحسابي وتناقش أهمية موسم الجداد في المجتمع العماني (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مخطط ساق وورقة: 2 | 3 5 8، 3 | 0 4 (الساق عشرات). أوجد الوسط.\nالإجابة النموذجية: (23 + 25 + 28 + 30 + 34) ÷ 5 = 28\n2) [مستوى التطبيق] وسط 10 طلاب 60 ووسط 15 طالبًا 70. أوجد الوسط المركب.\nالإجابة النموذجية: (600 + 1050) ÷ 25 = 66\n3) [مستوى الاستدلال] لماذا لا يساوي الوسط المركب متوسط الوسطين؟\nالإجابة النموذجية: لأن المجموعتين مختلفتان في الحجم.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الوسط المركب = (ن1 × س1 + ن2 × س2) ÷ (___)\nالإجابة النموذجية: ن1 + ن2\n2) [مستوى التطبيق] أعمدة بيانية: القيم 1، 2، 3 بتكرارات 4، 4، 2. أوجد الوسط.\nالإجابة النموذجية: (4 + 8 + 6) ÷ 10 = 1.8\n3) [مستوى الاستدلال] وسط 8 أعداد 25، حذف عدد فأصبح وسط الباقي 24. ما العدد المحذوف؟\nالإجابة النموذجية: 200 − 168 = 32", "للطالب: تمارين 4-1: الأسئلة 7–9، وكتاب النشاط ص74–75 (كتاب الطالب ص114–118، كتاب النشاط ص73–75).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «الوسط من التمثيلات البيانية والوسط المركب لمجموعتين».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=14"]}]}, {"id": "4-1ب", "title": "المنوال", "p": [{"ax": "المنوال للبيانات غير المجمعة والبيانات النوعية", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يجد المنوال لبيانات عددية غير مجمعة (15 دقيقة)\n2) يميّز حالات: منوال واحد، أكثر من منوال، لا منوال (5 دقائق)\nمخرج تعليمي آخر: يجد المنوال لبيانات نوعية (غير عددية) (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول إشارات", "المنوال، القيمة الأكثر تكرارًا، ثنائي المنوال، البيانات النوعية، البيانات الكمية.", "يسأل المعلم: ما اللون المفضل لدى طلبة الصف؟ ويجري تصويتًا سريعًا برفع الأيدي، ويصوّت الطالب ويحدد اللون الأكثر اختيارًا. (5 دقائق)", "1. النمذجة: يعرّف المعلم المنوال ويحلل أمثلة: 2، 3، 3، 5، 7 (المنوال 3)؛ 1، 2، 2، 4، 4 (منوالان 2 و 4)؛ 1، 3، 5، 7 (لا منوال) (المثال 6)، ويحدد الطالب المنوال لكل مجموعة ويبرر (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: تجمع كل مجموعة بيانات نوعية من الصف (الوجبة المفضلة، الرياضة المفضلة) وتحدد المنوال، وتجمع البيانات في جدول إشارات وتحدد المنوال (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. نقاش: يسأل المعلم: هل يمكن حساب الوسط الحسابي للألوان؟ ماذا نستخدم؟ (تقويم تكويني)، ويستنتج الطالب أن المنوال هو المقياس المناسب للبيانات النوعية (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: السؤال 10، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المنوال: 4، 6، 6، 7، 9، 6.\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد المنوال: 2، 2، 5، 5، 8.\nالإجابة النموذجية: منوالان: 2 و 5\n3) [مستوى الاستدلال] ما المقياس المناسب للبيانات: أحمر، أزرق، أحمر، أخضر؟\nالإجابة النموذجية: المنوال (أحمر)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: القيمة الأكثر تكرارًا في البيانات تسمى ___\nالإجابة النموذجية: المنوال\n2) [مستوى التطبيق] أوجد المنوال: 10، 12، 14، 16.\nالإجابة النموذجية: لا يوجد منوال\n3) [مستوى الاستدلال] أضف قيمة واحدة للبيانات 3، 4، 4، 5، 5 لتصبح ذات منوال واحد هو 5.\nالإجابة النموذجية: نضيف 5", "للطالب: تمارين 4-1: السؤال 10 (كتاب الطالب ص119–120، كتاب النشاط ص73–75).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=15"]}, {"ax": "المنوال من الجدول التكراري والأعمدة البيانية ومخطط الساق والورقة", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يجد المنوال من جدول تكراري (5 دقائق)\n2) يقرأ المنوال من الأعمدة البيانية ومخطط الساق والورقة (15 دقيقة)\nمخرج تعليمي آخر: يميّز بين القيمة المنوالية وتكرارها (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "المنوال من الجدول التكراري، أعلى عمود، الورقة الأكثر تكرارًا، التكرار.", "يعرض المعلم جدولًا تكراريًا لمقاسات أحذية مبيعة ويسأل: أي مقاس يجب أن يوفره المتجر بكثرة؟ ويختار الطالب المقاس صاحب أعلى تكرار. (5 دقائق)", "1. النمذجة: ينمذج المعلم: مقاسات 40، 41، 42، 43 بتكرارات 6، 11، 9، 4: المنوال 41 (وليس 11)، ويحدد الطالب المنوال ويميزه عن التكرار (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يعرض المعلم أعمدة بيانية ومخطط ساق وورقة لأطوال نباتات ويطلب المنوال من كل منهما، ويقرأ الطالب المنوال من كل تمثيل (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: كتاب النشاط ص74 (أسئلة المنوال)، وتمارين 4-1: السؤال 11، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س = 1، 2، 3، 4 و ت = 5، 9، 9، 2. أوجد المنوال.\nالإجابة النموذجية: منوالان: 2 و 3\n2) [مستوى التطبيق] في المقاسات السابقة، الطالب كتب أن المنوال 11. ما الخطأ؟\nالإجابة النموذجية: 11 هو التكرار، والمنوال هو القيمة 41.\n3) [مستوى الاستدلال] ساق وورقة: 1 | 2 5 5 7، 2 | 0 5 5 5. ما المنوال؟\nالإجابة النموذجية: 25", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في الأعمدة البيانية يكون المنوال هو القيمة ذات العمود ___\nالإجابة النموذجية: الأعلى\n2) [مستوى التطبيق] س = 0، 1، 2 و ت = 7، 3، 7. أوجد المنوال.\nالإجابة النموذجية: منوالان: 0 و 2\n3) [مستوى الاستدلال] س = 5، 6، 7 و ت = 4، ك، 6. ما قيم ك التي تجعل المنوال 6 فقط؟\nالإجابة النموذجية: ك > 6", "للطالب: كتاب النشاط ص74 (أسئلة المنوال)، وتمارين 4-1: السؤال 11 (كتاب الطالب ص119–120، كتاب النشاط ص73–75).\nلولي الأمر: متابعة تقدم الابن/الابنة في «المنوال من الجدول التكراري والأعمدة البيانية ومخطط الساق والورقة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=15"]}, {"ax": "المقارنة بين الوسط الحسابي والمنوال في سياقات حياتية", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يحسب الوسط الحسابي والمنوال للبيانات نفسها (15 دقيقة)\n2) يقارن بين المقياسين ويختار الأنسب للسياق (10 دقائق)\nمخرج تعليمي آخر: يصوغ مجموعة بيانات تحقق شروطًا معطاة للوسط والمنوال (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "اختيار المقياس، السياق، البيانات المنفصلة، التصميم العكسي للبيانات.", "يسأل المعلم: لماذا يهتم بائع الأحذية بالمنوال أكثر من الوسط الحسابي؟ ويوضح الطالب أن مقاسًا مثل 41.3 غير موجود. (5 دقائق)", "1. حل مشكلة: يعرض المعلم بيانات عدد ساعات استخدام الهاتف لعشرة طلاب ويطلب الوسط والمنوال ومناقشة أيهما يمثل البيانات أفضل، ويحسب الطالب ويقارن ويكتب استنتاجًا (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تحدٍّ: يطلب المعلم تكوين 5 أعداد صحيحة موجبة وسطها 6 ومنوالها 4، ويكوّن الطالب مثلًا 4، 4، 5، 7، 10 ويتحقق (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المعلم: يختار المعلم الدرس 4-1ب ومحور «المقارنة بين الوسط الحسابي والمنوال في سياقات حياتية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: كتاب النشاط ص75، وتمارين 4-1: السؤال 12، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – الطبق العماني المفضل: تجري المجموعات استطلاعًا سريعًا لأطباق زملائها العمانية المفضلة (شواء، هريس، عرسية، مشاكيك)، وتجد المنوال وتحدد هل للبيانات منوال واحد أو أكثر (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الوسط والمنوال: 2، 3، 3، 3، 9.\nالإجابة النموذجية: الوسط 4، المنوال 3\n2) [مستوى التطبيق] أي المقياسين أنسب لمقاسات الأحذية؟\nالإجابة النموذجية: المنوال\n3) [مستوى الاستدلال] كوّن 4 أعداد منوالها 5 ووسطها 6.\nالإجابة النموذجية: مثل: 5، 5، 6، 8", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: للبيانات النوعية نستخدم ___ مقياسًا للنزعة المركزية.\nالإجابة النموذجية: المنوال\n2) [مستوى التطبيق] أوجد الوسط والمنوال: 1، 2، 2، 2، 3، 8.\nالإجابة النموذجية: الوسط 3، المنوال 2\n3) [مستوى الاستدلال] كوّن 5 أعداد وسطها 10 ومنوالها 8.\nالإجابة النموذجية: مثل: 8، 8، 9، 11، 14 (المجموع 50)", "للطالب: كتاب النشاط ص75، وتمارين 4-1: السؤال 12 (كتاب الطالب ص119–120، كتاب النشاط ص73–75).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=15"]}]}, {"id": "4-1ج", "title": "الوسيط", "p": [{"ax": "الوسيط للبيانات غير المجمعة ورتبة الوسيط", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يرتب البيانات ويجد رتبة الوسيط (ن + 1) ÷ 2 (20 دقيقة)\n2) يجد الوسيط عندما يكون عدد القيم فرديًا أو زوجيًا (5 دقائق)\nمخرج تعليمي آخر: يفسر معنى الوسيط في سياق البيانات (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الوسيط، الترتيب التصاعدي، رتبة الوسيط، العدد الفردي والزوجي للقيم.", "يطلب المعلم من 7 طلاب الوقوف مرتبين حسب الطول، ويسأل: من الطالب الذي في المنتصف؟ وماذا لو كانوا 8؟ ويحدد الطالب الأوسط ويقترح متوسط الطالبين الأوسطين في الحالة الزوجية. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 2» ص121 ويطلب ترتيب مجموعات بيانات وتحديد القيمة الوسطى، ويرتب الطالب البيانات ويحدد الوسيط (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 7، 3، 9، 5، 11 ← 3، 5، 7، 9، 11 ← الوسيط 7 (الرتبة 3)؛ 4، 8، 6، 10 ← 4، 6، 8، 10 ← (6 + 8) ÷ 2 = 7 (المثال 7)، ويطبق الطالب رتبة الوسيط (ن + 1) ÷ 2 على أمثلة أخرى (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحليل خطأ: يعرض المعلم خطأ: إيجاد الوسيط دون ترتيب البيانات (تقويم تكويني)، ويصحح الطالب ويؤكد ضرورة الترتيب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 13–14، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الوسيط: 12، 5، 9، 3، 8.\nالإجابة النموذجية: بالترتيب 3، 5، 8، 9، 12 ← الوسيط 8\n2) [مستوى التطبيق] أوجد الوسيط: 2، 9، 4، 7، 5، 10.\nالإجابة النموذجية: 2، 4، 5، 7، 9، 10 ← (5 + 7) ÷ 2 = 6\n3) [مستوى الاستدلال] ما رتبة الوسيط في 25 قيمة؟\nالإجابة النموذجية: (25 + 1) ÷ 2 = 13", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: رتبة الوسيط في ن قيمة مرتبة هي ___\nالإجابة النموذجية: (ن + 1) ÷ 2\n2) [مستوى التطبيق] أوجد الوسيط: 15، 11، 18، 13، 20، 16، 14.\nالإجابة النموذجية: 11، 13، 14، 15، 16، 18، 20 ← 15\n3) [مستوى الاستدلال] أوجد الوسيط: 3.5، 2.1، 4.8، 3.9.\nالإجابة النموذجية: (3.5 + 3.9) ÷ 2 = 3.7", "للطالب: تمارين 4-1: الأسئلة 13–14 (كتاب الطالب ص121–129، كتاب النشاط ص73–75).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الوسيط للبيانات غير المجمعة ورتبة الوسيط».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=16"]}, {"ax": "الوسيط من الجدول التكراري ومخطط الساق والورقة", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يكوّن التكرار التراكمي من جدول تكراري (5 دقائق)\n2) يجد الوسيط من الجدول التكراري بالتكرار التراكمي (15 دقيقة)\nمخرج تعليمي آخر: يجد الوسيط من مخطط الساق والورقة (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "التكرار التراكمي، رتبة الوسيط في الجدول التكراري، مخطط الساق والورقة.", "يسأل المعلم: في جدول تكراري لـ 21 طالبًا، كيف نعرف أي قيمة تقع في الترتيب الحادي عشر دون كتابة القيم كلها؟ ويقترح الطالب جمع التكرارات تدريجيًا. (5 دقائق)", "1. النمذجة: ينمذج المعلم: س = 1، 2، 3، 4، 5 و ت = 3، 6، 7، 4، 1 (ن = 21) ← التكرار التراكمي 3، 9، 16، 20، 21 ← الرتبة 11 تقع عند س = 3 (المثال 8)، ويكمل الطالب عمود التكرار التراكمي ويحدد الوسيط (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يعرض المعلم مخطط ساق وورقة لـ 14 قيمة ويطلب إيجاد الوسيط (متوسط القيمتين 7 و 8) (المثال 9)، ويعد الطالب القيم ويجد الوسيط (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 15–16، وكتاب النشاط ص74، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س = 0، 1، 2، 3 و ت = 5، 8، 4، 3. أوجد التكرار التراكمي.\nالإجابة النموذجية: 5، 13، 17، 20\n2) [مستوى التطبيق] أوجد الوسيط للجدول السابق.\nالإجابة النموذجية: ن = 20، القيمتان 10 و 11 تقعان عند س = 1، الوسيط 1\n3) [مستوى الاستدلال] ساق وورقة: 3 | 1 4 6، 4 | 2 2 8 9. أوجد الوسيط.\nالإجابة النموذجية: القيم السبع 31، 34، 36، 42، 42، 48، 49 ← الوسيط 42", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: التكرار التراكمي لقيمة هو مجموع التكرارات حتى ___\nالإجابة النموذجية: تلك القيمة\n2) [مستوى التطبيق] س = 1، 2، 3، 4 و ت = 2، 5، 6، 2. أوجد الوسيط.\nالإجابة النموذجية: ن = 15، الرتبة 8، التراكمي 2، 7، 13 ← الوسيط 3\n3) [مستوى الاستدلال] س = 10، 20، 30 و ت = 4، 4، 4. أوجد الوسيط.\nالإجابة النموذجية: ن = 12، الرتبتان 6 و 7 عند 20، الوسيط 20", "للطالب: تمارين 4-1: الأسئلة 15–16، وكتاب النشاط ص74 (كتاب الطالب ص121–129، كتاب النشاط ص73–75).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الوسيط من الجدول التكراري ومخطط الساق والورقة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=16"]}, {"ax": "أثر القيم المتطرفة على الوسط والوسيط", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحدد القيمة المتطرفة في مجموعة بيانات (5 دقائق)\n2) يقارن أثر القيمة المتطرفة على الوسط الحسابي والوسيط (15 دقيقة)\nمخرج تعليمي آخر: يختار المقياس الأنسب عند وجود قيم متطرفة (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "القيم المتطرفة، حساسية الوسط الحسابي، ثبات الوسيط، المقياس الممثل.", "يعرض المعلم رواتب 5 موظفين في شركة صغيرة: 400، 450، 500، 550، 5000 ريال، ويسأل: هل يعبر الوسط عن راتب الموظف المعتاد؟ ويحسب الطالب الوسط 1380 ويلاحظ أنه بعيد عن معظم الرواتب. (5 دقائق)", "1. اكتشاف: يطلب المعلم حساب الوسط والوسيط للرواتب قبل وبعد حذف 5000، ويجد الطالب الوسط 1380 ← 475، والوسيط 500 ← 475 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع مجموعات بيانات فيها قيم متطرفة (أزمنة سباق، أسعار منازل) لتحديد المقياس الأنسب وتبريره، وتكتب المجموعة تبريرًا مكتوبًا (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 4-1ج ومحور «أثر القيم المتطرفة على الوسط والوسيط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-1: الأسئلة المتبقية، وكتاب النشاط ص75، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – وسيط الأسرة العمانية: يرتب كل زوج أعداد أفراد أسر مجموعته ويجد الوسيط للعدد الفردي ثم بعد إضافة قيمة جديدة، ويتحدث عن تماسك الأسرة العمانية وتكافلها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما القيمة المتطرفة في 12، 14، 13، 15، 60؟\nالإجابة النموذجية: 60\n2) [مستوى التطبيق] أوجد الوسط والوسيط للبيانات السابقة.\nالإجابة النموذجية: الوسط 22.8، الوسيط 14\n3) [مستوى الاستدلال] أي المقياسين يمثل البيانات أفضل؟ ولماذا؟\nالإجابة النموذجية: الوسيط، لأنه لا يتأثر بالقيمة المتطرفة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المقياس الذي يتأثر كثيرًا بالقيم المتطرفة هو ___\nالإجابة النموذجية: الوسط الحسابي\n2) [مستوى التطبيق] أوجد الوسيط: 3، 4، 4، 5، 100.\nالإجابة النموذجية: 4\n3) [مستوى الاستدلال] أضيفت قيمة 500 إلى 10، 20، 30. كيف تغير الوسط والوسيط؟\nالإجابة النموذجية: الوسط من 20 إلى 140، والوسيط من 20 إلى 25؛ تأثر الوسط أكثر.", "للطالب: تمارين 4-1: الأسئلة المتبقية، وكتاب النشاط ص75 (كتاب الطالب ص121–129، كتاب النشاط ص73–75).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «أثر القيم المتطرفة على الوسط والوسيط».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=16"]}]}, {"id": "4-2", "title": "الحساب التقديري لمقاييس النزعة المركزية", "p": [{"ax": "الوسط الحسابي التقديري للبيانات المجمعة باستخدام مركز الفئة", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحسب مركز الفئة لكل فئة في جدول تكراري ذي فئات (15 دقيقة)\n2) يحسب الوسط الحسابي التقديري = مج(ت × م) ÷ مج ت (15 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا تكون النتيجة تقديرية (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "البيانات المجمعة، الفئة، حدا الفئة، طول الفئة، مركز الفئة، الوسط الحسابي التقديري.", "يعرض المعلم جدولًا لأعمار زوار مكتبة في فئات ويسأل: هل نعرف العمر الدقيق لكل زائر؟ فكيف نقدّر الوسط؟ ويقترح الطالب استخدام قيمة تمثل كل فئة. (5 دقائق)", "1. النمذجة: يعرّف المعلم مركز الفئة = (الحد الأدنى + الحد الأعلى) ÷ 2، وينمذج: الفئات 0–<10، 10–<20، 20–<30، 30–<40 بتكرارات 4، 7، 6، 3 ← المراكز 5، 15، 25، 35 ← مج(ت × م) = 380 ← الوسط ≈ 19 (المثالان 10 و 11)، ويكمل الطالب أعمدة المركز و ت × م (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول تكرارية ذات فئات (أطوال، أوزان، أزمنة) على المجموعات، وتحسب المجموعة الوسط التقديري وتفسر سبب التقريب (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-2أ: الأسئلة 1–3، وكتاب النشاط ص76، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مركز الفئة 20–<30؟\nالإجابة النموذجية: 25\n2) [مستوى التطبيق] فئات 0–<4، 4–<8، 8–<12 بتكرارات 2، 5، 3. أوجد الوسط التقديري.\nالإجابة النموذجية: (2 × 2 + 6 × 5 + 10 × 3) ÷ 10 = 6.4\n3) [مستوى الاستدلال] لماذا يسمى الوسط هنا تقديريًا؟\nالإجابة النموذجية: لأننا نفترض أن كل قيم الفئة تساوي مركزها.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مركز الفئة = (الحد الأدنى + الحد الأعلى) ÷ ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] فئات 10–<20، 20–<30، 30–<40 بتكرارات 3، 5، 2. أوجد الوسط التقديري.\nالإجابة النموذجية: (45 + 125 + 70) ÷ 10 = 24\n3) [مستوى الاستدلال] أضيفت إلى الجدول السابق فئة 40–<50 بتكرار 10. ما الوسط التقديري الجديد؟\nالإجابة النموذجية: (240 + 450) ÷ 20 = 34.5", "للطالب: تمارين 4-2أ: الأسئلة 1–3، وكتاب النشاط ص76 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=17"]}, {"ax": "الفئة المنوالية والمدرج التكراري وكثافة الفئة", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحدد الفئة المنوالية في الفئات المتساوية الطول (5 دقائق)\n2) يحسب كثافة الفئة ويحدد الفئة المنوالية عند اختلاف أطوال الفئات (25 دقيقة)\nمخرج تعليمي آخر: يقرأ الفئة المنوالية من المدرج التكراري (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "الفئة المنوالية، كثافة الفئة = التكرار ÷ طول الفئة، المدرج التكراري، الفئات غير المتساوية.", "يعرض المعلم فئتين: 0–<10 بتكرار 12، و 10–<40 بتكرار 18، ويسأل: أيهما أكثر ازدحامًا بالقيم؟ ويلاحظ الطالب أن الفئة الثانية أطول بكثير. (5 دقائق)", "1. النمذجة: ينمذج المعلم حساب كثافة الفئة: 12 ÷ 10 = 1.2 و 18 ÷ 30 = 0.6، فالفئة المنوالية 0–<10 (المثال 12)، ويحسب الطالب الكثافة ويحدد الفئة المنوالية (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تطبيق موجّه: يعرض المعلم مدرجًا تكراريًا (المحور الرأسي كثافة الفئة) ويطلب تحديد الفئة المنوالية وحساب التكرار من مساحة العمود (المثال 13)، ويحسب الطالب التكرار = الكثافة × الطول (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-2أ: الأسئلة 4–6، وكتاب النشاط ص77، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] فئات متساوية بتكرارات 5، 12، 8. ما الفئة المنوالية؟\nالإجابة النموذجية: الفئة ذات التكرار 12\n2) [مستوى التطبيق] فئة طولها 5 وتكرارها 20. ما كثافتها؟\nالإجابة النموذجية: 4\n3) [مستوى الاستدلال] في مدرج تكراري عمود كثافته 3 وطوله 4. ما التكرار؟\nالإجابة النموذجية: 12", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: كثافة الفئة = التكرار ÷ ___\nالإجابة النموذجية: طول الفئة\n2) [مستوى التطبيق] الفئات 0–<10 (10)، 10–<15 (8)، 15–<30 (15). حدد الفئة المنوالية.\nالإجابة النموذجية: الكثافات 1، 1.6، 1 ← الفئة 10–<15\n3) [مستوى الاستدلال] لماذا لا نختار الفئة المنوالية بأعلى تكرار عند اختلاف الأطوال؟\nالإجابة النموذجية: لأن الفئة الأطول تحوي قيمًا أكثر بسبب طولها لا لكثافتها.", "للطالب: تمارين 4-2أ: الأسئلة 4–6، وكتاب النشاط ص77 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الفئة المنوالية والمدرج التكراري وكثافة الفئة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=17"]}, {"ax": "الوسيط التقديري من منحنى التكرار التراكمي", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يكوّن جدول التكرار التراكمي ويرسم منحناه (15 دقيقة)\n2) يقدّر الوسيط من المنحنى عند الرتبة ن ÷ 2 (10 دقائق)\nمخرج تعليمي آخر: يحدد الفئة التي تحتوي الوسيط ويقدّره بالاستكمال الخطي (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التكرار التراكمي، منحنى التكرار التراكمي، الحد الأعلى للفئة، الفئة الوسيطية، الاستكمال الخطي.", "يسأل المعلم: في الجدول (4، 7، 6، 3) كم قيمة أقل من 20؟ وكم أقل من 30؟ ويجمع الطالب: 11 و 17. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 3» ص137، ويطلب رسم منحنى التكرار التراكمي بنقاط (الحد الأعلى، التكرار التراكمي): (0، 0)، (10، 4)، (20، 11)، (30، 17)، (40، 20)، ويرسم الطالب المنحنى على ورق رسم بياني (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يقرأ المعلم الوسيط عند الرتبة 10 من المنحنى، ثم يحسبه بالاستكمال: 10 + (10 − 4) ÷ 7 × 10 ≈ 18.6 (المثال 14)، ويقارن الطالب القراءة البيانية بالحساب (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 4-2 ومحور «الوسيط التقديري من منحنى التكرار التراكمي»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-2ب: الأسئلة 1–4، وكتاب النشاط ص78–81، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس – جدول صيد القارب: تحسب المجموعات مراكز الفئات والوسط التقديري لجدول تكراري افتراضي لأوزان أسماك اصطادها قارب عماني، ثم تذكر نوعًا من الأسماك المشهورة في بحر عمان (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما الفئة التي تحتوي الوسيط إذا كان التكرار التراكمي 4، 11، 17، 20؟\nالإجابة النموذجية: الرتبة 10 تقع في الفئة الثانية 10–<20\n2) [مستوى التطبيق] عند رسم منحنى التكرار التراكمي نستخدم أي حد للفئة؟\nالإجابة النموذجية: الحد الأعلى\n3) [مستوى الاستدلال] قدّر الوسيط: الفئات 0–<5، 5–<10، 10–<15 بتكرارات 6، 10، 4.\nالإجابة النموذجية: ن = 20، الرتبة 10، التراكمي 6، 16 ← 5 + (10 − 6) ÷ 10 × 5 = 7", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: رتبة الوسيط في البيانات المجمعة تقديريًا ن ÷ ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] التكرار التراكمي 4، 11، 17، 20 لفئات طولها 10 تبدأ من 0. قدّر الوسيط بالاستكمال الخطي.\nالإجابة النموذجية: الرتبة 10 في الفئة 10–<20: 10 + (10 − 4) ÷ 7 × 10 ≈ 18.6\n3) [مستوى الاستدلال] كيف تقرأ من منحنى التكرار التراكمي عدد القيم الأقل من 25؟\nالإجابة النموذجية: أرسم خطًا رأسيًا من 25 إلى المنحنى ثم أفقيًا إلى المحور الرأسي وأقرأ القيمة.", "للطالب: تمارين 4-2ب: الأسئلة 1–4، وكتاب النشاط ص78–81 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=17"]}]}, {"id": "4-3", "title": "خصائص مقاييس النزعة المركزية", "p": [{"ax": "مزايا الوسط الحسابي وعيوبه", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يذكر مزايا الوسط الحسابي (يستخدم كل القيم، يصلح للحسابات اللاحقة) (15 دقيقة)\n2) يوضح عيوب الوسط الحسابي (التأثر بالقيم المتطرفة، قد لا يكون قيمة فعلية) (15 دقيقة)\nمخرج تعليمي آخر: يحكم على صلاحية الوسط في سياقات محددة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تقييم", "- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات مواقف", "مزايا المقياس، عيوب المقياس، القيم المتطرفة، القيمة الفعلية، استخدام جميع البيانات.", "يسأل المعلم: معدل عدد أفراد الأسرة في الحي 4.6 فرد. هل توجد أسرة فيها 4.6 فرد؟ ماذا يعني هذا العدد؟ ويناقش الطالب أن الوسط قد لا يكون قيمة فعلية لكنه يلخص البيانات. (5 دقائق)", "1. نقاش موجّه: يقود المعلم نقاشًا لاستخلاص مزايا الوسط وعيوبه من أمثلة الدروس السابقة (الرواتب، عدد أفراد الأسرة) (المثال 15)، ويشارك الطالب ويدوّن المزايا والعيوب في جدول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على المجموعات 4 مواقف ويطلب الحكم: هل الوسط مناسب؟ (درجات اختبار متقاربة، أسعار منازل، عدد الأطفال، أزمنة سباق فيها زمن شاذ)، وتحكم المجموعة وتبرر كتابيًا (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-3: السؤالان 1 و 2، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اذكر ميزة واحدة للوسط الحسابي.\nالإجابة النموذجية: يأخذ في الحسبان جميع القيم.\n2) [مستوى التطبيق] اذكر عيبًا واحدًا للوسط الحسابي.\nالإجابة النموذجية: يتأثر بالقيم المتطرفة.\n3) [مستوى الاستدلال] هل الوسط مناسب لدرجات: 72، 75، 78، 74، 76؟\nالإجابة النموذجية: نعم، القيم متقاربة ولا توجد قيم متطرفة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: من عيوب الوسط الحسابي أنه يتأثر بالقيم ___\nالإجابة النموذجية: المتطرفة\n2) [مستوى التطبيق] أسعار منازل: 30، 32، 35، 33، 250 ألف ريال. هل الوسط مناسب؟\nالإجابة النموذجية: لا، لأن 250 قيمة متطرفة ترفع الوسط إلى 76 ألفًا.\n3) [مستوى الاستدلال] لماذا يفضل الوسط عند مقارنة نتائج صفين في اختبار؟\nالإجابة النموذجية: لأنه يستخدم كل الدرجات ويعكس الأداء الكلي عند غياب القيم المتطرفة.", "للطالب: تمارين 4-3: السؤالان 1 و 2 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مزايا الوسط الحسابي وعيوبه».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "مزايا الوسيط والمنوال وعيوبهما", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يذكر مزايا الوسيط وعيوبه (15 دقيقة)\n2) يذكر مزايا المنوال وعيوبه (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين المقاييس الثلاثة في جدول منظم (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تذكر\nالمخرج الآخر: تحليل", "- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الوسيط، المنوال، الثبات أمام القيم المتطرفة، البيانات النوعية، عدم الوحدانية.", "يعرض المعلم بيانات: 2، 3، 3، 4، 50 ويطلب حساب المقاييس الثلاثة بسرعة، ويحسب الطالب: الوسط 12.4، الوسيط 3، المنوال 3. (5 دقائق)", "1. نقاش موجّه: يستخلص المعلم مع، ويقوم الطالب بالوسيط لا يتأثر بالقيم المتطرفة لكنه لا يستخدم كل القيم؛ المنوال يصلح للبيانات النوعية لكنه قد لا يوجد أو يتعدد (المثال 16). يكمل جدول المقارنة (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعلم تشاركي: يقسم الطلبة أزواجًا، كل زوج يكتب مثالًا يكون فيه مقياس معين هو الأنسب ويعرضه، ويصوغ الزوج مثاله ويبرره (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-3: السؤالان 3 و 4، وكتاب النشاط ص82، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اذكر ميزة للوسيط.\nالإجابة النموذجية: لا يتأثر بالقيم المتطرفة.\n2) [مستوى التطبيق] اذكر عيبًا للمنوال.\nالإجابة النموذجية: قد لا يوجد أو يكون أكثر من قيمة.\n3) [مستوى الاستدلال] أي المقاييس يصلح للبيانات النوعية؟\nالإجابة النموذجية: المنوال فقط.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المقياس الذي لا يتأثر بالقيم المتطرفة ويعتمد على الترتيب هو ___\nالإجابة النموذجية: الوسيط\n2) [مستوى التطبيق] أوجد المقاييس الثلاثة: 2، 3، 3، 4، 50.\nالإجابة النموذجية: الوسط 12.4، الوسيط 3، المنوال 3\n3) [مستوى الاستدلال] أي المقاييس أنسب للبيانات السابقة؟ ولماذا؟\nالإجابة النموذجية: الوسيط أو المنوال؛ لأن 50 قيمة متطرفة تشوه الوسط.", "للطالب: تمارين 4-3: السؤالان 3 و 4، وكتاب النشاط ص82 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مزايا الوسيط والمنوال وعيوبهما» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "اختيار مقياس النزعة المركزية المناسب للسياق", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يختار المقياس المناسب لسياق حياتي ويبرر اختياره (25 دقيقة)\n2) يحلل كيف يمكن أن يُساء استخدام المقاييس في الإعلانات (5 دقائق)\nمخرج تعليمي آخر: يحسب المقاييس لبيانات حياتية ويفسرها (10 دقائق)", "المخرج 1: تقييم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "السياق، التبرير الإحصائي، الإعلانات المضللة، تمثيل البيانات.", "يعرض المعلم إعلانًا: «متوسط راتب موظفينا 1500 ريال» ويسأل: هل يعني ذلك أن معظم الموظفين يتقاضون نحو 1500 ريال؟ ويناقش الطالب احتمال وجود رواتب مرتفعة جدًا للمديرين. (5 دقائق)", "1. حل مشكلة: يقدم المعلم رواتب شركة: 400 (6 موظفين)، 600 (3)، 5000 (1). يطلب المقاييس الثلاثة وأيها يستخدمه المدير للإعلان وأيها يمثل الموظفين، ويحسب الطالب: الوسط 920، الوسيط 400، المنوال 400، ويستنتج أن الإعلان بالوسط مضلل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل كتاب النشاط ص83–84 لاختيار المقياس المناسب، وتحل المجموعة وتبرر (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-3: الأسئلة 5–7، وكتاب النشاط ص83–84، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] رواتب: 400 ×6، 600 ×3، 5000 ×1. أوجد الوسط.\nالإجابة النموذجية: (2400 + 1800 + 5000) ÷ 10 = 920\n2) [مستوى التطبيق] أوجد الوسيط والمنوال للبيانات السابقة.\nالإجابة النموذجية: الوسيط 400، المنوال 400\n3) [مستوى الاستدلال] أي مقياس يمثل راتب الموظف المعتاد؟\nالإجابة النموذجية: الوسيط (أو المنوال) = 400", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: لاختيار أكثر مقاس قميص مبيعًا نستخدم ___\nالإجابة النموذجية: المنوال\n2) [مستوى التطبيق] أزمنة انتظار (دقائق): 3، 4، 4، 5، 6، 30. ما المقياس الأنسب؟\nالإجابة النموذجية: الوسيط = 4.5 لوجود قيمة متطرفة 30\n3) [مستوى الاستدلال] درجات اختبار متقاربة لـ 30 طالبًا. ما المقياس الأنسب لمقارنتها بصف آخر؟\nالإجابة النموذجية: الوسط الحسابي", "للطالب: تمارين 4-3: الأسئلة 5–7، وكتاب النشاط ص83–84 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «اختيار مقياس النزعة المركزية المناسب للسياق».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "أثر إضافة ثابت أو الضرب في ثابت على مقاييس النزعة المركزية", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يستكشف أثر إضافة ثابت لجميع القيم على الوسط والوسيط والمنوال (15 دقيقة)\n2) يستكشف أثر ضرب جميع القيم في ثابت على المقاييس (15 دقيقة)\nمخرج تعليمي آخر: يستخدم هذه الخصائص لحساب المقاييس بسرعة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "التحويل الخطي، إضافة ثابت، الضرب في ثابت، الإزاحة، التكبير.", "يسأل المعلم: إذا أضاف المعلم 5 درجات لكل طالب، ماذا يحدث لوسط الصف؟ ويتوقع الطالب أن يزيد الوسط 5. (5 دقائق)", "1. اكتشاف: يعطي المعلم البيانات 2، 4، 4، 7، 8 (الوسط 5، الوسيط 4، المنوال 4) ويطلب حسابها بعد إضافة 10 ثم بعد الضرب في 3، ويلاحظ: كل مقياس يزيد 10، ثم يتضاعف 3 مرات (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعميم: يعمم المعلم القاعدة: إذا ص = أس + ب فإن مقياس ص = أ × مقياس س + ب، ويطبق على تحويل درجات الحرارة، ويحول الطالب وسط درجات مئوية 30 إلى فهرنهايت: 1.8 × 30 + 32 = 86 (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: كتاب النشاط ص84، وتمارين 4-3: السؤال 8، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] وسط مجموعة 12، أضيف 3 لكل قيمة. الوسط الجديد؟\nالإجابة النموذجية: 15\n2) [مستوى التطبيق] وسيط مجموعة 8، ضربت كل قيمة في 2. الوسيط الجديد؟\nالإجابة النموذجية: 16\n3) [مستوى الاستدلال] منوال مجموعة 6، طُرح 1 من كل قيمة. المنوال الجديد؟\nالإجابة النموذجية: 5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عند ضرب كل القيم في 4 يُضرب الوسط في ___\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] وسط درجات حرارة 25° م. ما الوسط بالفهرنهايت؟\nالإجابة النموذجية: 1.8 × 25 + 32 = 77\n3) [مستوى الاستدلال] وسط مجموعة 20. ضربت القيم في 3 ثم أضيف 5. الوسط الجديد؟\nالإجابة النموذجية: 3 × 20 + 5 = 65", "للطالب: كتاب النشاط ص84، وتمارين 4-3: السؤال 8 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "مشروع إحصائي مصغر: جمع بيانات وتلخيصها واختيار المقياس الأنسب", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يجمع بيانات حقيقية من بيئته وينظمها في جدول تكراري (15 دقيقة)\n2) يحسب مقاييس النزعة المركزية ويختار الأنسب للبيانات (15 دقيقة)\nمخرج تعليمي آخر: يعرض نتائجه في تقرير مختصر وتمثيل بياني (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: استبانة ورقية", "جمع البيانات، التنظيم، التلخيص، التمثيل البياني، التقرير الإحصائي.", "يطرح المعلم سؤالًا بحثيًا: «كم ساعة ينام طلبة الحادي عشر ليلًا؟» ويسأل: كيف نجيب عنه؟ ويقترح الطالب جمع البيانات من الزملاء. (5 دقائق)", "1. مشروع: توزع المجموعات أسئلة بحثية (ساعات النوم، زمن الوصول للمدرسة، ساعات الاستذكار)، وتجمع البيانات من طلبة الصف، وتنظمها، وتجمع البيانات وتنظمها في جدول تكراري (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تحليل: يوجه كل مجموعة لحساب المقاييس الثلاثة ورسم تمثيل مناسب واختيار المقياس الأنسب، وتحسب وتمثل وتكتب استنتاجًا (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض مجموعتان نتائجهما ويقدم المعلم تغذية راجعة (تقويم تكويني)، وتعرض وتجيب عن الأسئلة (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تقرير المشروع المصغر وتسليمه في الحصة القادمة، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما أول خطوة في المشروع الإحصائي؟\nالإجابة النموذجية: تحديد السؤال البحثي\n2) [مستوى التطبيق] ساعات نوم: 6، 7، 7، 8، 7، 5، 9. أوجد المقاييس الثلاثة.\nالإجابة النموذجية: الوسط 7، الوسيط 7، المنوال 7\n3) [مستوى الاستدلال] ما التمثيل المناسب لبيانات عدد ساعات النوم؟\nالإجابة النموذجية: الأعمدة البيانية أو مخطط الساق والورقة", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: بعد جمع البيانات ننظمها في ___\nالإجابة النموذجية: جدول تكراري\n2) [مستوى التطبيق] أزمنة الوصول (دقائق): 10، 12، 15، 15، 45. أي مقياس أنسب؟\nالإجابة النموذجية: الوسيط 15 لوجود قيمة متطرفة 45\n3) [مستوى الاستدلال] اكتب استنتاجًا من جملة واحدة لبيانات النوم السابقة.\nالإجابة النموذجية: ينام الطالب المعتاد في الصف نحو 7 ساعات ليلًا.", "للطالب: إكمال تقرير المشروع المصغر وتسليمه في الحصة القادمة (كتاب الطالب ص147–150، ومر
