م التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد مجموع أول 5 حدود من 3، 6، 12، ...\nالإجابة النموذجية: 3(2^5 − 1) ÷ 1 = 93\n2) [مستوى التطبيق] أوجد مجموع أول 4 حدود من 81، 27، 9، ...\nالإجابة النموذجية: 81(1 − (1/3)^4) ÷ (2/3) = 120\n3) [مستوى الاستدلال] أوجد 1 + 3 + 9 + ... + 729.\nالإجابة النموذجية: ن = 7، ج = (3^7 − 1) ÷ 2 = 1093", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مجموع أول 6 حدود من 2، 6، 18، ... يساوي ___\nالإجابة النموذجية: 728\n2) [مستوى التطبيق] أوجد مجموع أول 8 حدود من 1، 2، 4، ...\nالإجابة النموذجية: 2^8 − 1 = 255\n3) [مستوى الاستدلال] أوجد مجموع أول 5 حدود من 5، −10، 20، ...\nالإجابة النموذجية: 5(1 − (−2)^5) ÷ (1 − (−2)) = 5 × 33 ÷ 3 = 55", "للطالب: تمارين 3-2: الأسئلة 10–12، وكتاب النشاط ص63 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "تطبيقات حياتية على المتتاليات والمتسلسلات الهندسية", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) ينمذج النمو والتناقص بنسبة مئوية ثابتة بمتتالية هندسية (5 دقائق)\n2) يحسب قيمة استثمار أو عدد سكان بعد عدد من السنوات (20 دقيقة)\n\nمخرج تعليمي آخر: يقارن بين النمو الحسابي والنمو الهندسي في المدى البعيد (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "معامل النمو، الزيادة بنسبة مئوية، التناقص بنسبة مئوية، الاستثمار، النمو السكاني.", "يسأل المعلم: إذا زاد سعر سلعة 10% ثم 10% مرة أخرى، هل الزيادة الكلية 20%؟ ويحسب الطالب: 1.1 × 1.1 = 1.21 أي 21%. (5 دقائق)", "1. حل مشكلة: يعرض المعلم: استثمار 1000 ريال يزيد 5% سنويًا، القيمة بعد 3 سنوات = 1000 × 1.05^3 ≈ 1157.63 ريالًا، ويناقش معامل النمو 1.05، ويحسب الطالب القيم سنة بسنة ويتحقق بالصيغة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل: سيارة قيمتها 8000 ريال تفقد 15% سنويًا (قيمتها بعد 4 سنوات)، وبكتيريا تتضاعف كل ساعة، وتحسب المجموعة: 8000 × 0.85^4 ≈ 4176 ريالًا، وعدد البكتيريا بعد 10 ساعات من 50 خلية = 50 × 2^10 = 51200 (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. مقارنة: يقارن المعلم بين ادخار حسابي (زيادة 10 ريالات) وهندسي (زيادة 10%) يبدأ كلاهما بـ 100 ريال على 10 سنوات (تقويم تكويني)، ويحسب الطالب الحد العاشر: الحسابي 190، والهندسي 100 × 1.1^9 ≈ 235.8 (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-2: الأسئلة 13–16، وكتاب النشاط ص64، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما معامل النمو لزيادة سنوية 8%؟\nالإجابة النموذجية: 1.08\n2) [مستوى التطبيق] ما معامل التناقص لانخفاض سنوي 15%؟\nالإجابة النموذجية: 0.85\n3) [مستوى الاستدلال] قيمة 1000 ريال بعد سنتين بزيادة 5% سنويًا؟\nالإجابة النموذجية: 1000 × 1.05² = 1102.5 ريال", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا تضاعفت البكتيريا كل ساعة فالأساس ر = ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] عدد سكان قرية 2000 نسمة ويزيد 3% سنويًا. أوجد العدد بعد 5 سنوات.\nالإجابة النموذجية: 2000 × 1.03^5 ≈ 2319 نسمة\n3) [مستوى الاستدلال] هاتف ثمنه 300 ريال يفقد 20% من قيمته سنويًا. بعد كم سنة تقل قيمته عن 150 ريالًا؟\nالإجابة النموذجية: 300 × 0.8^ن < 150: بعد 3 سنوات (153.6) لا، بعد 4 سنوات (122.88) نعم، أي 4 سنوات.", "للطالب: تمارين 3-2: الأسئلة 13–16، وكتاب النشاط ص64 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: متابعة تقدم الابن/الابنة في «تطبيقات حياتية على المتتاليات والمتسلسلات الهندسية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}, {"ax": "تمارين متنوعة ومقارنة بين المتتاليات الحسابية والهندسية", "wk": "الأسبوع الثامن (25–29/10/2026م)", "f": ["1) يحدد نوع المتتالية (حسابية أو هندسية) ويختار الصيغ المناسبة (20 دقيقة)\n2) يحل مسائل تجمع بين النوعين (5 دقائق)\n\nمخرج تعليمي آخر: يصمم متتالية تحقق شروطًا معطاة (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "المتتالية الحسابية، المتتالية الهندسية، الوسط الحسابي، الوسط الهندسي، اختيار الصيغة.", "يعرض المعلم 4 متتاليات ويطلب فرزها في عمودين: حسابية / هندسية / لا هذا ولا ذاك، ويفرز الطالب ويبرر. (5 دقائق)", "1. تعلم ذاتي: يكلف المعلم بحل تمارين كتاب النشاط المتبقية ص61–64 حسب المستوى، ويحل الطالب حسب مستواه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تحدٍّ تعاوني: يطرح المعلم تحديًا: ثلاثة أعداد تشكل متتالية حسابية مجموعها 15، وإذا أضيف 1، 3، 9 إليها على الترتيب تشكل متتالية هندسية. أوجدها، وتحل المجموعة: الأعداد 5 − د، 5، 5 + د ← (6 − د)(14 + د) = 8² ← د² + − 20 = 0 ← د = 2 أو −10، فالأعداد 3، 5، 7 أو 15، 5، −5 (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 3-2 ومحور «تمارين متنوعة ومقارنة بين المتتاليات الحسابية والهندسية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال كتاب النشاط ص61–64، والتحضير للدرس 3-3، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – مبادرة الشجرة تتضاعف: تقترح المجموعات مبادرة تشجير يدعو فيها كل مشارك اثنين جديدين، فتكتب المتتالية الهندسية 1، 2، 4، … وتجد أساسها وحدًّا تاليًا، وتناقش أثر التطوع في المجتمع (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صنف: 10، 7، 4، 1 و 10، 5، 2.5، 1.25.\nالإجابة النموذجية: الأولى حسابية (د = −3)، الثانية هندسية (ر = 1/2).\n2) [مستوى التطبيق] أوجد الوسط الهندسي للعددين 4 و 9.\nالإجابة النموذجية: √36 = 6\n3) [مستوى الاستدلال] أوجد الوسط الحسابي للعددين 4 و 9.\nالإجابة النموذجية: (4 + 9) ÷ 2 = 6.5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في المتتالية الهندسية ناتج قسمة أي حد على سابقه ___\nالإجابة النموذجية: ثابت\n2) [مستوى التطبيق] صمم متتالية هندسية حدها الأول 3 وحدها الرابع 24.\nالإجابة النموذجية: ر³ = 8 ← ر = 2: 3، 6، 12، 24\n3) [مستوى الاستدلال] أعداد في متتالية حسابية مجموعها 15، أوسطها؟\nالإجابة النموذجية: 5 (لأن 3 × الأوسط = 15)", "للطالب: إكمال كتاب النشاط ص61–64، والتحضير للدرس 3-3 (كتاب الطالب ص96–102، كتاب النشاط ص61–64).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=12"]}]}, {"id": "3-3", "title": "المتسلسلات الهندسية غير المنتهية", "p": [{"ax": "فكرة التقارب وشرطه في المتسلسلة الهندسية + مجموع المتسلسلة الهندسية إلى ما لا نهاية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يستكشف سلوك مجموع حدود متسلسلة هندسية عندما يزداد عدد الحدود (10 دقائق)\n2) يذكر شرط تقارب المتسلسلة الهندسية |ر| < 1 (10 دقائق)\n3) يستخدم الصيغة ج∞ = أ ÷ (1 − ر) لإيجاد المجموع إلى ما لا نهاية (5 دقائق)\n4) يتحقق من شرط التقارب قبل استخدام الصيغة (5 دقائق)\n\nمخرج تعليمي آخر:\nيميّز المتسلسلات المتقاربة من المتباعدة (5 دقائق)\nيستنتج الصيغة من صيغة جن عندما تقترب رⁿ من الصفر (5 دقائق)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج 4: تقييم\nالمخرج الآخر: تحليل\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: مربع ورقي ومقص\n- أخرى: الآلة الحاسبة العلمية\n- أخرى: بطاقات متسلسلات", "المتسلسلة غير المنتهية، التقارب، التباعد، شرط التقارب |ر| < 1، المجموع الجزئي.، المجموع إلى ما لا نهاية ج∞، الصيغة أ ÷ (1 − ر)، شرط التقارب.", "يقص المعلم مربعًا ورقيًا: يأخذ النصف ثم نصف الباقي ثم نصف الباقي... ويسأل: هل سنصل إلى المربع كاملًا؟ ويلاحظ الطالب أن المجموع 1/2 + 1/4 + 1/8 + ... يقترب من 1. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 3» ص103، ويطلب حساب المجاميع الجزئية لـ 1/2 + 1/4 + 1/8 + ... ولـ 1 + 2 + 4 + ... في جدول، ويلاحظ الطالب أن الأولى تقترب من 1 والثانية تكبر بلا حد (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يربط المعلم التقارب بقيمة ر: عندما |ر| < 1 تصغر رⁿ وتقترب من الصفر فيقترب جن من قيمة ثابتة (المثال 14)، ويحسب الطالب (1/2)^10 و 2^10 بالآلة الحاسبة ويقارن (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. النمذجة: يطبق المعلم: 12 + 6 + 3 + ... ← ج∞ = 12 ÷ (1/2) = 24؛ 9 − 3 + 1 − ... ← ج∞ = 9 ÷ (4/3) = 27/4 (المثال 15)، ويتابع الطالب ويحسب ج∞ لـ 1/2 + 1/4 + ... = 1 (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعلم تعاوني: يوزع المعلم بطاقات متسلسلات بعضها متباعد، ويطلب حساب ج∞ لما يتقارب فقط، وتتحقق المجموعة من الشرط ثم تحسب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. تحليل خطأ: يعرض المعلم حلًا حسب ج∞ للمتسلسلة 2 + 4 + 8 + ... فحصل على −2، ويطلب تفسير الخطأ (تقويم تكويني)، ويوضح الطالب أن ر = 2 لا تحقق الشرط (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: السؤالان 2 و 3، وكتاب النشاط ص66، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل المتسلسلة 9 + 3 + 1 + ... متقاربة؟\nالإجابة النموذجية: نعم، ر = 1/3 و |ر| < 1\n2) [مستوى التطبيق] هل المتسلسلة 2 + 6 + 18 + ... متقاربة؟\nالإجابة النموذجية: لا، ر = 3 > 1 فهي متباعدة.\n3) [مستوى الاستدلال] هل المتسلسلة 8 − 4 + 2 − ... متقاربة؟\nالإجابة النموذجية: نعم، ر = −1/2 و |ر| < 1\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد ج∞ للمتسلسلة 20 + 10 + 5 + ...\nالإجابة النموذجية: 20 ÷ (1/2) = 40\n5) [مستوى التطبيق] أوجد ج∞ للمتسلسلة 1 − 1/3 + 1/9 − ...\nالإجابة النموذجية: 1 ÷ (4/3) = 3/4\n6) [مستوى الاستدلال] لماذا لا نحسب ج∞ للمتسلسلة 3 + 6 + 12 + ...؟\nالإجابة النموذجية: لأن ر = 2 و |ر| > 1 فهي متباعدة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: شرط تقارب المتسلسلة الهندسية هو |ر| ___ 1\nالإجابة النموذجية: <\n2) [مستوى التطبيق] صنف: 5 + 5 + 5 + ...\nالإجابة النموذجية: متباعدة لأن ر = 1\n3) [مستوى الاستدلال] ماذا يحدث لـ (0.9)ⁿ عندما تكبر ن؟ وما أثر ذلك على المجموع؟\nالإجابة النموذجية: تقترب من الصفر، فيقترب جن من أ ÷ (1 − ر).\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: ج∞ للمتسلسلة 12 + 6 + 3 + ... يساوي ___\nالإجابة النموذجية: 24\n5) [مستوى التطبيق] أوجد ج∞ للمتسلسلة 100 + 80 + 64 + ...\nالإجابة النموذجية: ر = 0.8، ج∞ = 100 ÷ 0.2 = 500\n6) [مستوى الاستدلال] أوجد ج∞ للمتسلسلة 9 − 3 + 1 − ...\nالإجابة النموذجية: 27/4 = 6.75", "للطالب: تمارين 3-3: السؤال 1، وكتاب النشاط ص65 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «فكرة التقارب وشرطه في المتسلسلة الهندسية».\nللطالب: تمارين 3-3: السؤالان 2 و 3، وكتاب النشاط ص66 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مجموع المتسلسلة الهندسية إلى ما لا نهاية» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "إيجاد الحد الأول أو الأساس بمعلومية المجموع إلى ما لا نهاية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يكوّن معادلة من ج∞ ويحلها لإيجاد أ أو ر (15 دقيقة)\n2) يستبعد قيم ر التي لا تحقق شرط التقارب (15 دقيقة)\n\nمخرج تعليمي آخر: يحل مسائل تربط ج∞ بحدود معطاة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "معادلة المجموع إلى ما لا نهاية، استبعاد الحلول، شرط التقارب.", "يسأل المعلم: إذا كان أ ÷ (1 − ر) = 20 و أ = 5، فكم 1 − ر؟ ويحسب الطالب 1 − ر = 1/4 فـ ر = 3/4. (5 دقائق)", "1. النمذجة: ينمذج المعلم: ج∞ = 20، أ = 5 ← ر = 3/4؛ و ج∞ = 3أ ← 1 ÷ (1 − ر) = 3 ← ر = 2/3 (المثال 16)، ويحل الطالب أمثلة مشابهة على السبورة الصغيرة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسألة: متسلسلة هندسية متقاربة حدها الثاني 4 ومجموعها إلى ما لا نهاية 18. أوجد ر، وتكوّن المجموعة: أر = 4 و أ ÷ (1 − ر) = 18 ← 4 ÷ ر = 18(1 − ر) ← 9ر² − 9ر + 2 = 0 ← ر = 1/3 أو 2/3 (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: السؤالان 4 و 5، وكتاب النشاط ص67، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ج∞ = 30، أ = 10. أوجد ر.\nالإجابة النموذجية: 1 − ر = 1/3 ← ر = 2/3\n2) [مستوى التطبيق] ج∞ = 16، ر = 1/4. أوجد أ.\nالإجابة النموذجية: أ = 16 × 3/4 = 12\n3) [مستوى الاستدلال] ج∞ = 2أ. أوجد ر.\nالإجابة النموذجية: 1 ÷ (1 − ر) = 2 ← ر = 1/2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان ج∞ = 20 و أ = 5 فإن ر = ___\nالإجابة النموذجية: 3/4\n2) [مستوى التطبيق] متسلسلة متقاربة ر = −1/2 و ج∞ = 8. أوجد أ.\nالإجابة النموذجية: أ = 8 × 3/2 = 12\n3) [مستوى الاستدلال] حدها الثاني 4 و ج∞ = 18، وجدنا ر = 1/3 أو 2/3. أوجد أ لكل قيمة.\nالإجابة النموذجية: ر = 1/3 ← أ = 12؛ ر = 2/3 ← أ = 6", "للطالب: تمارين 3-3: السؤالان 4 و 5، وكتاب النشاط ص67 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «إيجاد الحد الأول أو الأساس بمعلومية المجموع إلى ما لا نهاية».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "تحويل الكسر العشري الدوري إلى كسر اعتيادي", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يكتب الكسر العشري الدوري متسلسلة هندسية غير منتهية (15 دقيقة)\n2) يحول الكسر العشري الدوري إلى كسر اعتيادي باستخدام ج∞ (10 دقائق)\n\nمخرج تعليمي آخر: يبرر لماذا 0.999... = 1 (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الكسر العشري الدوري، الدورة، الكسر الاعتيادي، المتسلسلة الهندسية.", "يطلب المعلم كتابة 1/3 كسرًا عشريًا، ثم يسأل: هل يمكن أن نعكس العملية؟ ويكتب الطالب 0.333... ويفكر في العكس. (5 دقائق)", "1. النمذجة: ينمذج المعلم: 0.333... = 0.3 + 0.03 + 0.003 + ... ← ج∞ = 0.3 ÷ 0.9 = 1/3؛ و 0.2727... = 0.27 ÷ 0.99 = 27/99 = 3/11 (المثال 17)، ويكتب الطالب المتسلسلة ويحدد أ و ر (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: يوزع المعلم على الأزواج: 0.777...، 0.1515...، 1.444، ويحول الطالب: 7/9، 15/99 = 5/33، 1 + 4/9 = 13/9 (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. نقاش: يطرح المعلم: هل 0.999... = 1؟ ويطلب البرهان بالمتسلسلة (تقويم تكويني)، ويبرهن الطالب: 0.9 ÷ 0.1 = 1 (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: السؤالان 6 و 7، وكتاب النشاط ص68، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اكتب 0.555... متسلسلة هندسية وحدد أ و ر.\nالإجابة النموذجية: 0.5 + 0.05 + ...، أ = 0.5، ر = 0.1\n2) [مستوى التطبيق] حوّل 0.555... إلى كسر اعتيادي.\nالإجابة النموذجية: 0.5 ÷ 0.9 = 5/9\n3) [مستوى الاستدلال] حوّل 0.1818... إلى كسر اعتيادي.\nالإجابة النموذجية: 0.18 ÷ 0.99 = 18/99 = 2/11", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: 0.777... = ___ في صورة كسر اعتيادي.\nالإجابة النموذجية: 7/9\n2) [مستوى التطبيق] حوّل 0.3636... إلى كسر اعتيادي.\nالإجابة النموذجية: 36/99 = 4/11\n3) [مستوى الاستدلال] بيّن أن 0.999... = 1.\nالإجابة النموذجية: أ = 0.9، ر = 0.1، ج∞ = 0.9 ÷ 0.9 = 1", "للطالب: تمارين 3-3: السؤالان 6 و 7، وكتاب النشاط ص68 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "تطبيقات حياتية على المتسلسلات الهندسية غير المنتهية", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) ينمذج مواقف حياتية (ارتداد كرة، أرجوحة، دواء) بمتسلسلة هندسية غير منتهية (5 دقائق)\n2) يحسب المسافة الكلية لكرة مرتدة (20 دقيقة)\n\nمخرج تعليمي آخر: يقيّم معقولية النموذج الرياضي في الواقع (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم المبني على المشاريع", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: كرة", "الارتداد، المسافة الكلية، النموذج الرياضي، حدود النموذج.", "يُسقط المعلم كرة من ارتفاع مناسب ويسأل: هل تتوقف الكرة؟ وكم المسافة الكلية التي تقطعها؟ ويلاحظ الطالب تناقص الارتفاع ويتوقع مسافة محدودة. (5 دقائق)", "1. حل مشكلة: يعرض المعلم: كرة تسقط من 10 م وترتد 60% من ارتفاعها في كل مرة. المسافة الكلية = 10 + 2 × (6 ÷ (1 − 0.6)) = 10 + 30 = 40 م، ويرسم الطالب مخطط الارتدادات ويحسب، ويفسر سبب الضرب في 2 (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل كتاب النشاط ص69–70 (أرجوحة تقطع 80% من القوس السابق بدءًا بـ 5 م، تراكم مادة دوائية)، وتحل المجموعة: الأرجوحة 5 ÷ 0.2 = 25 م (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. نقاش: يسأل المعلم: هل ترتد الكرة فعلًا عددًا لا نهائيًا من المرات؟ ما حدود النموذج؟ (تقويم تكويني)، ويناقش الطالب الفرق بين النموذج والواقع (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 3-3: الأسئلة 8–10، وكتاب النشاط ص69–70، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أول ارتداد لكرة سقطت من 10 م وترتد 60%؟\nالإجابة النموذجية: 6 م\n2) [مستوى التطبيق] مجموع ارتفاعات الارتدادات فقط (للأعلى)؟\nالإجابة النموذجية: 6 ÷ 0.4 = 15 م\n3) [مستوى الاستدلال] المسافة الكلية التي تقطعها الكرة؟\nالإجابة النموذجية: 10 + 2 × 15 = 40 م", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: أرجوحة تقطع 5 م ثم 80% مما قبله، المسافة الكلية ___ م\nالإجابة النموذجية: 25\n2) [مستوى التطبيق] كرة تسقط من 8 م وترتد نصف ارتفاعها. أوجد المسافة الكلية.\nالإجابة النموذجية: 8 + 2 × (4 ÷ 0.5) = 24 م\n3) [مستوى الاستدلال] لماذا نضرب مجموع الارتدادات في 2؟\nالإجابة النموذجية: لأن الكرة تصعد كل ارتفاع ثم تهبطه.", "للطالب: تمارين 3-3: الأسئلة 8–10، وكتاب النشاط ص69–70 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: متابعة تقدم الابن/الابنة في «تطبيقات حياتية على المتسلسلات الهندسية غير المنتهية» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}, {"ax": "مراجعة الوحدة الثالثة: المتتاليات والمتسلسلات", "wk": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1) يربط بين المتتاليات الحسابية والهندسية والمتسلسلات غير المنتهية (5 دقائق)\n2) يحل أسئلة مراجعة نهاية الوحدة وكتاب النشاط (25 دقيقة)\n\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا ويحدد احتياجاته (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الحد العام، المجموع، النسبة المشتركة، الفرق المشترك، التقارب، المجموع إلى ما لا نهاية.", "ينظم المعلم لعبة «اكتشف القاعدة»: يعرض ثلاثة حدود ويطلب تحديد النوع والقاعدة خلال 20 ثانية، ويتنافس الطلبة في الإجابة. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص109 وما بعدها على المجموعات حسب المحاور، وتحل المجموعة محورها (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: تعرض المجموعات حلولها، ويثبت المعلم جدول الصيغ للوحدة، وتشرح المجموعة وتجيب عن الأسئلة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...» للوحدة (تقويم تكويني)، ويقيم الطالب نفسه ويحدد ما يراجعه (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. المعلم: يختار المعلم الدرس 3-3 ومحور «مراجعة الوحدة الثالثة: المتتاليات والمتسلسلات»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة، وكتاب النشاط ص71–72، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – نصف الطريق إلى القلعة: يناقش الطلبة سائحًا يقطع كل دقيقة نصف المسافة المتبقية إلى بوابة قلعة نزوى، فيكتبون المتسلسلة ½ + ¼ + ⅛ + … ويستنتجون مجموعها وشرط التقارب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صنف وحدد القاعدة: 6، 2، 2/3، ...\nالإجابة النموذجية: هندسية، ر = 1/3\n2) [مستوى التطبيق] أوجد ج∞ للمتتالية السابقة.\nالإجابة النموذجية: 6 ÷ (2/3) = 9\n3) [مستوى الاستدلال] أوجد مجموع أول 20 حدًا من 1، 4، 7، ...\nالإجابة النموذجية: 10 × (2 + 19 × 3) = 590", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المتسلسلة الهندسية تتقارب عندما ___ < ر < ___\nالإجابة النموذجية: −1 و 1\n2) [مستوى التطبيق] أوجد ح10 في 3، 8، 13، ...\nالإجابة النموذجية: 3 + 9 × 5 = 48\n3) [مستوى الاستدلال] متسلسلة هندسية متقاربة أ = 6 و ج∞ = 10. أوجد ح3.\nالإجابة النموذجية: ر = 2/5، ح3 = 6 × 4/25 = 24/25", "للطالب: إكمال تمارين مراجعة نهاية الوحدة، وكتاب النشاط ص71–72 (كتاب الطالب ص103–108، ومراجعة الوحدة ص109، كتاب النشاط ص65–70، ومراجعة الوحدة ص71–72).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=13"]}]}, {"id": "4-1أ", "title": "مقاييس النزعة المركزية: الوسط الحسابي", "p": [{"ax": "مفهوم النزعة المركزية والوسط الحسابي للبيانات غير المجمعة + الوسط الحسابي من الجدول التكراري", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يوضح مفهوم مقاييس النزعة المركزية والحاجة إليها (5 دقائق)\n2) يحسب الوسط الحسابي لبيانات غير مجمعة (10 دقائق)\n3) يكوّن عمود (س × ت) في الجدول التكراري ويحسب المجاميع (5 دقائق)\n4) يحسب الوسط الحسابي = مج(س × ت) ÷ مج ت (5 دقائق)\n\nمخرج تعليمي آخر:\nيجد قيمة مفقودة بمعلومية الوسط الحسابي (5 دقائق)\nيفسر الوسط الحسابي في سياق البيانات (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "النزعة المركزية، الوسط الحسابي، المعدل، البيانات غير المجمعة، مجموع القيم مج س.، الجدول التكراري، التكرار ت، مج ت، مج(س × ت)، الوسط الحسابي الموزون.", "يعرض المعلم درجات الحرارة العظمى في مسقط خلال 5 أيام: 34، 36، 35، 38، 37، ويسأل: كيف نعبّر عن «درجة الحرارة النموذجية» لهذه الأيام بعدد واحد؟ ويقترح الطالب جمع القيم وقسمتها على عددها. (5 دقائق)", "1. النمذجة: يعرّف المعلم الوسط الحسابي = مج س ÷ ن، ويحسب مع الطلبة وسط درجات الحرارة: 180 ÷ 5 = 36 (المثال 1)، ويحسب الطالب الوسط لمجموعة أخرى: 4، 7، 7، 9، 13 ← 8 (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلة: يعرض المعلم: وسط 5 أعداد يساوي 12، وأربعة منها 10، 14، 9، 15. ما العدد الخامس؟ (المثال 2)، ويحسب المجموع الكلي 60 ويطرح 48 فيجد 12 (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النمذجة: ينمذج المعلم جدول: عدد الإخوة س = 0، 1، 2، 3، 4 بتكرارات 3، 5، 8، 3، 1؛ مج ت = 20، مج(س × ت) = 34، الوسط = 1.7 (المثالان 3 و 4)، ويكمل الطالب عمود س × ت ويحسب المجاميع (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعلم تعاوني: يوزع المعلم جداول تكرارية من سياقات عمانية (عدد الأهداف في مباريات دوري، عدد الرسائل اليومية)، وتحسب المجموعة الوسط وتفسره بجملة (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. تحليل خطأ: يعرض المعلم خطأ: قسمة مج(س × ت) على عدد القيم المختلفة (5) بدل مج ت (تقويم تكويني)، ويصحح الطالب الخطأ ويوضح السبب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 4–6، وكتاب النشاط ص73، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الوسط الحسابي للقيم 6، 8، 10، 12.\nالإجابة النموذجية: 36 ÷ 4 = 9\n2) [مستوى التطبيق] وسط 4 أعداد 15. ما مجموعها؟\nالإجابة النموذجية: 60\n3) [مستوى الاستدلال] وسط 6 درجات 70، أضيفت درجة 84. ما الوسط الجديد؟\nالإجابة النموذجية: (420 + 84) ÷ 7 = 72\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] في الجدول: س = 1، 2، 3 و ت = 2، 5، 3، أوجد مج(س × ت).\nالإجابة النموذجية: 2 + 10 + 9 = 21\n5) [مستوى التطبيق] أوجد الوسط الحسابي للجدول السابق.\nالإجابة النموذجية: 21 ÷ 10 = 2.1\n6) [مستوى الاستدلال] لماذا نقسم على مج ت وليس على عدد القيم المختلفة؟\nالإجابة النموذجية: لأن مج ت هو العدد الكلي للمشاهدات.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الوسط الحسابي = مجموع القيم ÷ ___\nالإجابة النموذجية: عددها\n2) [مستوى التطبيق] أوجد الوسط الحسابي: 3، 5، 5، 8، 9.\nالإجابة النموذجية: 30 ÷ 5 = 6\n3) [مستوى الاستدلال] وسط 5 أعداد 20، وأربعة منها 18، 22، 25، 17. أوجد الخامس.\nالإجابة النموذجية: 100 − 82 = 18\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: الوسط الحسابي من جدول تكراري = مج(س × ت) ÷ ___\nالإجابة النموذجية: مج ت\n5) [مستوى التطبيق] س = 0، 1، 2، 3 و ت = 4، 6، 7، 3. أوجد الوسط.\nالإجابة النموذجية: (0 + 6 + 14 + 9) ÷ 20 = 1.45\n6) [مستوى الاستدلال] س = 5، 6، 7 و ت = 2، ك، 3، والوسط 6.1. أوجد ك.\nالإجابة النموذجية: (10 + 6ك + 21) ÷ (5 + ك) = 6.1 ← 31 + 6ك = 30.5 + 6.1ك ← ك = 5", "للطالب: تمارين 4-1: الأسئلة 1–3 (كتاب الطالب ص114–118، كتاب النشاط ص73–75).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم النزعة المركزية والوسط الحسابي للبيانات غير المجمعة».\nللطالب: تمارين 4-1: الأسئلة 4–6، وكتاب النشاط ص73 (كتاب الطالب ص114–118، كتاب النشاط ص73–75).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الوسط الحسابي من الجدول التكراري» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=14"]}, {"ax": "الوسط من التمثيلات البيانية والوسط المركب لمجموعتين", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يستخرج البيانات من الأعمدة البيانية ومخطط الساق والورقة لحساب الوسط (15 دقيقة)\n2) يحسب الوسط المركب لمجموعتين (15 دقيقة)\n\nمخرج تعليمي آخر: يقارن بين مجموعتين باستخدام الوسط الحسابي (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الأعمدة البيانية، مخطط الساق والورقة، الوسط المركب، المقارنة بين المجموعات.", "يسأل المعلم: صف فيه 20 طالبًا وسطهم 70، وصف فيه 30 طالبًا وسطهم 80. هل وسط الصفين معًا 75؟ ويتوقع الطالب ثم يتحقق. (5 دقائق)", "1. النمذجة: ينمذج المعلم الوسط المركب: (20 × 70 + 30 × 80) ÷ 50 = 3800 ÷ 50 = 76، ويوضح لماذا ليس 75 (المثال 5)، ويحسب الطالب ويفسر أثر حجم المجموعة الأكبر (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مخطط ساق وورقة لأوزان طلبة وأعمدة بيانية لعدد الكتب المقروءة، ويطلب حساب الوسط منهما (كتاب النشاط ص74–75)، وتستخرج المجموعة البيانات وتحسب الوسط (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 4-1أ ومحور «الوسط من التمثيلات البيانية والوسط المركب لمجموعتين»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-1: الأسئلة 7–9، وكتاب النشاط ص74–75، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – متوسط محصول التمر: يعطي المعلم كميات افتراضية لتمر خمس نخلات (40، 55، 60، 45، 50 كجم)، فتحسب المجموعات الوسط الحسابي وتناقش أهمية موسم الجداد في المجتمع العماني (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مخطط ساق وورقة: 2 | 3 5 8، 3 | 0 4 (الساق عشرات). أوجد الوسط.\nالإجابة النموذجية: (23 + 25 + 28 + 30 + 34) ÷ 5 = 28\n2) [مستوى التطبيق] وسط 10 طلاب 60 ووسط 15 طالبًا 70. أوجد الوسط المركب.\nالإجابة النموذجية: (600 + 1050) ÷ 25 = 66\n3) [مستوى الاستدلال] لماذا لا يساوي الوسط المركب متوسط الوسطين؟\nالإجابة النموذجية: لأن المجموعتين مختلفتان في الحجم.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الوسط المركب = (ن1 × س1 + ن2 × س2) ÷ (___)\nالإجابة النموذجية: ن1 + ن2\n2) [مستوى التطبيق] أعمدة بيانية: القيم 1، 2، 3 بتكرارات 4، 4، 2. أوجد الوسط.\nالإجابة النموذجية: (4 + 8 + 6) ÷ 10 = 1.8\n3) [مستوى الاستدلال] وسط 8 أعداد 25، حذف عدد فأصبح وسط الباقي 24. ما العدد المحذوف؟\nالإجابة النموذجية: 200 − 168 = 32", "للطالب: تمارين 4-1: الأسئلة 7–9، وكتاب النشاط ص74–75 (كتاب الطالب ص114–118، كتاب النشاط ص73–75).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «الوسط من التمثيلات البيانية والوسط المركب لمجموعتين».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=14"]}]}, {"id": "4-1ب", "title": "المنوال", "p": [{"ax": "المنوال للبيانات غير المجمعة والبيانات النوعية + المنوال من الجدول التكراري والأعمدة البيانية ومخطط الساق والورقة", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يجد المنوال لبيانات عددية غير مجمعة (5 دقائق)\n2) يميّز حالات: منوال واحد، أكثر من منوال، لا منوال (5 دقائق)\n3) يجد المنوال من جدول تكراري (5 دقائق)\n4) يقرأ المنوال من الأعمدة البيانية ومخطط الساق والورقة (5 دقائق)\n\nمخرج تعليمي آخر:\nيجد المنوال لبيانات نوعية (غير عددية) (10 دقائق)\nيميّز بين القيمة المنوالية وتكرارها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول إشارات\n- صورة توضيحية", "المنوال، القيمة الأكثر تكر 41.\n6) [مستوى الاستدلال] ساق وورقة: 1 | 2 5 5 7، 2 | 0 5 5 5. ما المنوال؟\nالإجابة النموذجية: 25", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: القيمة الأكثر تكرارًا في البيانات تسمى ___\nالإجابة النموذجية: المنوال\n2) [مستوى التطبيق] أوجد المنوال: 10، 12، 14، 16.\nالإجابة النموذجية: لا يوجد منوال\n3) [مستوى الاستدلال] أضف قيمة واحدة للبيانات 3، 4، 4، 5، 5 لتصبح ذات منوال واحد هو 5.\nالإجابة النموذجية: نضيف 5\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: في الأعمدة البيانية يكون المنوال هو القيمة ذات العمود ___\nالإجابة النموذجية: الأعلى\n5) [مستوى التطبيق] س = 0، 1، 2 و ت = 7، 3، 7. أوجد المنوال.\nالإجابة النموذجية: منوالان: 0 و 2\n6) [مستوى الاستدلال] س = 5، 6، 7 و ت = 4، ك، 6. ما قيم ك التي تجعل المنوال 6 فقط؟\nالإجابة النموذجية: ك > 6", "للطالب: تمارين 4-1: السؤال 10 (كتاب الطالب ص119–120، كتاب النشاط ص73–75).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: كتاب النشاط ص74 (أسئلة المنوال)، وتمارين 4-1: السؤال 11 (كتاب الطالب ص119–120، كتاب النشاط ص73–75).\nلولي الأمر: متابعة تقدم الابن/الابنة في «المنوال من الجدول التكراري والأعمدة البيانية ومخطط الساق والورقة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=15"]}, {"ax": "المقارنة بين الوسط الحسابي والمنوال في سياقات حياتية", "wk": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1) يحسب الوسط الحسابي والمنوال للبيانات نفسها (15 دقيقة)\n2) يقارن بين المقياسين ويختار الأنسب للسياق (10 دقائق)\n\nمخرج تعليمي آخر: يصوغ مجموعة بيانات تحقق شروطًا معطاة للوسط والمنوال (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "اختيار المقياس، السياق، البيانات المنفصلة، التصميم العكسي للبيانات.", "يسأل ال
