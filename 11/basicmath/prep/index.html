لب عمود التكرار التراكمي ويحدد الوسيط (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. تطبيق موجّه: يعرض المعلم مخطط ساق وورقة لـ 14 قيمة ويطلب إيجاد الوسيط (متوسط القيمتين 7 و 8) (المثال 9)، ويعد الطالب القيم ويجد الوسيط (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-1: الأسئلة 15–16، وكتاب النشاط ص74، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الوسيط: 12، 5، 9، 3، 8.\nالإجابة النموذجية: بالترتيب 3، 5، 8، 9، 12 ← الوسيط 8\n2) [مستوى التطبيق] أوجد الوسيط: 2، 9، 4، 7، 5، 10.\nالإجابة النموذجية: 2، 4، 5، 7، 9، 10 ← (5 + 7) ÷ 2 = 6\n3) [مستوى الاستدلال] ما رتبة الوسيط في 25 قيمة؟\nالإجابة النموذجية: (25 + 1) ÷ 2 = 13\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] س = 0، 1، 2، 3 و ت = 5، 8، 4، 3. أوجد التكرار التراكمي.\nالإجابة النموذجية: 5، 13، 17، 20\n5) [مستوى التطبيق] أوجد الوسيط للجدول السابق.\nالإجابة النموذجية: ن = 20، القيمتان 10 و 11 تقعان عند س = 1، الوسيط 1\n6) [مستوى الاستدلال] ساق وورقة: 3 | 1 4 6، 4 | 2 2 8 9. أوجد الوسيط.\nالإجابة النموذجية: القيم السبع 31، 34، 36، 42، 42، 48، 49 ← الوسيط 42", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: رتبة الوسيط في ن قيمة مرتبة هي ___\nالإجابة النموذجية: (ن + 1) ÷ 2\n2) [مستوى التطبيق] أوجد الوسيط: 15، 11، 18، 13، 20، 16، 14.\nالإجابة النموذجية: 11، 13، 14، 15، 16، 18، 20 ← 15\n3) [مستوى الاستدلال] أوجد الوسيط: 3.5، 2.1، 4.8، 3.9.\nالإجابة النموذجية: (3.5 + 3.9) ÷ 2 = 3.7\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: التكرار التراكمي لقيمة هو مجموع التكرارات حتى ___\nالإجابة النموذجية: تلك القيمة\n5) [مستوى التطبيق] س = 1، 2، 3، 4 و ت = 2، 5، 6، 2. أوجد الوسيط.\nالإجابة النموذجية: ن = 15، الرتبة 8، التراكمي 2، 7، 13 ← الوسيط 3\n6) [مستوى الاستدلال] س = 10، 20، 30 و ت = 4، 4، 4. أوجد الوسيط.\nالإجابة النموذجية: ن = 12، الرتبتان 6 و 7 عند 20، الوسيط 20", "للطالب: تمارين 4-1: الأسئلة 13–14 (كتاب الطالب ص121–129، كتاب النشاط ص73–75).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «الوسيط للبيانات غير المجمعة ورتبة الوسيط».\nللطالب: تمارين 4-1: الأسئلة 15–16، وكتاب النشاط ص74 (كتاب الطالب ص121–129، كتاب النشاط ص73–75).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الوسيط من الجدول التكراري ومخطط الساق والورقة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=16"]}, {"ax": "أثر القيم المتطرفة على الوسط والوسيط", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحدد القيمة المتطرفة في مجموعة بيانات (5 دقائق)\n2) يقارن أثر القيمة المتطرفة على الوسط الحسابي والوسيط (15 دقيقة)\n\nمخرج تعليمي آخر: يختار المقياس الأنسب عند وجود قيم متطرفة (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "القيم المتطرفة، حساسية الوسط الحسابي، ثبات الوسيط، المقياس الممثل.", "يعرض المعلم رواتب 5 موظفين في شركة صغيرة: 400، 450، 500، 550، 5000 ريال، ويسأل: هل يعبر الوسط عن راتب الموظف المعتاد؟ ويحسب الطالب الوسط 1380 ويلاحظ أنه بعيد عن معظم الرواتب. (5 دقائق)", "1. اكتشاف: يطلب المعلم حساب الوسط والوسيط للرواتب قبل وبعد حذف 5000، ويجد الطالب الوسط 1380 ← 475، والوسيط 500 ← 475 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع مجموعات بيانات فيها قيم متطرفة (أزمنة سباق، أسعار منازل) لتحديد المقياس الأنسب وتبريره، وتكتب المجموعة تبريرًا مكتوبًا (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 4-1ج ومحور «أثر القيم المتطرفة على الوسط والوسيط»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-1: الأسئلة المتبقية، وكتاب النشاط ص75، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – وسيط الأسرة العمانية: يرتب كل زوج أعداد أفراد أسر مجموعته ويجد الوسيط للعدد الفردي ثم بعد إضافة قيمة جديدة، ويتحدث عن تماسك الأسرة العمانية وتكافلها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما القيمة المتطرفة في 12، 14، 13، 15، 60؟\nالإجابة النموذجية: 60\n2) [مستوى التطبيق] أوجد الوسط والوسيط للبيانات السابقة.\nالإجابة النموذجية: الوسط 22.8، الوسيط 14\n3) [مستوى الاستدلال] أي المقياسين يمثل البيانات أفضل؟ ولماذا؟\nالإجابة النموذجية: الوسيط، لأنه لا يتأثر بالقيمة المتطرفة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المقياس الذي يتأثر كثيرًا بالقيم المتطرفة هو ___\nالإجابة النموذجية: الوسط الحسابي\n2) [مستوى التطبيق] أوجد الوسيط: 3، 4، 4، 5، 100.\nالإجابة النموذجية: 4\n3) [مستوى الاستدلال] أضيفت قيمة 500 إلى 10، 20، 30. كيف تغير الوسط والوسيط؟\nالإجابة النموذجية: الوسط من 20 إلى 140، والوسيط من 20 إلى 25؛ تأثر الوسط أكثر.", "للطالب: تمارين 4-1: الأسئلة المتبقية، وكتاب النشاط ص75 (كتاب الطالب ص121–129، كتاب النشاط ص73–75).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «أثر القيم المتطرفة على الوسط والوسيط».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=16"]}]}, {"id": "4-2", "title": "الحساب التقديري لمقاييس النزعة المركزية", "p": [{"ax": "الوسط الحسابي التقديري للبيانات المجمعة باستخدام مركز الفئة + الفئة المنوالية والمدرج التكراري وكثافة الفئة", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يحسب مركز الفئة لكل فئة في جدول تكراري ذي فئات (10 دقائق)\n2) يحسب الوسط الحسابي التقديري = مج(ت × م) ÷ مج ت (5 دقائق)\n3) يحدد الفئة المنوالية في الفئات المتساوية الطول (5 دقائق)\n4) يحسب كثافة الفئة ويحدد الفئة المنوالية عند اختلاف أطوال الفئات (10 دقائق)\n\nمخرج تعليمي آخر:\nيفسر لماذا تكون النتيجة تقديرية (5 دقائق)\nيقرأ الفئة المنوالية من المدرج التكراري (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية\n- صورة توضيحية", "البيانات المجمعة، الفئة، حدا الفئة، طول الفئة، مركز الفئة، الوسط الحسابي التقديري.، الفئة المنوالية، كثافة الفئة = التكرار ÷ طول الفئة، المدرج التكراري، الفئات غير المتساوية.", "يعرض المعلم جدولًا لأعمار زوار مكتبة في فئات ويسأل: هل نعرف العمر الدقيق لكل زائر؟ فكيف نقدّر الوسط؟ ويقترح الطالب استخدام قيمة تمثل كل فئة. (5 دقائق)", "1. النمذجة: يعرّف المعلم مركز الفئة = (الحد الأدنى + الحد الأعلى) ÷ 2، وينمذج: الفئات 0–<10، 10–<20، 20–<30، 30–<40 بتكرارات 4، 7، 6، 3 ← المراكز 5، 15، 25، 35 ← مج(ت × م) = 380 ← الوسط ≈ 19 (المثالان 10 و 11)، ويكمل الطالب أعمدة المركز و ت × م (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول تكرارية ذات فئات (أطوال، أوزان، أزمنة) على المجموعات، وتحسب المجموعة الوسط التقديري وتفسر سبب التقريب (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النمذجة: ينمذج المعلم حساب كثافة الفئة: 12 ÷ 10 = 1.2 و 18 ÷ 30 = 0.6، فالفئة المنوالية 0–<10 (المثال 12)، ويحسب الطالب الكثافة ويحدد الفئة المنوالية (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تطبيق موجّه: يعرض المعلم مدرجًا تكراريًا (المحور الرأسي كثافة الفئة) ويطلب تحديد الفئة المنوالية وحساب التكرار من مساحة العمود (المثال 13)، ويحسب الطالب التكرار = الكثافة × الطول (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-2أ: الأسئلة 4–6، وكتاب النشاط ص77، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مركز الفئة 20–<30؟\nالإجابة النموذجية: 25\n2) [مستوى التطبيق] فئات 0–<4، 4–<8، 8–<12 بتكرارات 2، 5، 3. أوجد الوسط التقديري.\nالإجابة النموذجية: (2 × 2 + 6 × 5 + 10 × 3) ÷ 10 = 6.4\n3) [مستوى الاستدلال] لماذا يسمى الوسط هنا تقديريًا؟\nالإجابة النموذجية: لأننا نفترض أن كل قيم الفئة تساوي مركزها.\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] فئات متساوية بتكرارات 5، 12، 8. ما الفئة المنوالية؟\nالإجابة النموذجية: الفئة ذات التكرار 12\n5) [مستوى التطبيق] فئة طولها 5 وتكرارها 20. ما كثافتها؟\nالإجابة النموذجية: 4\n6) [مستوى الاستدلال] في مدرج تكراري عمود كثافته 3 وطوله 4. ما التكرار؟\nالإجابة النموذجية: 12", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: مركز الفئة = (الحد الأدنى + الحد الأعلى) ÷ ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] فئات 10–<20، 20–<30، 30–<40 بتكرارات 3، 5، 2. أوجد الوسط التقديري.\nالإجابة النموذجية: (45 + 125 + 70) ÷ 10 = 24\n3) [مستوى الاستدلال] أضيفت إلى الجدول السابق فئة 40–<50 بتكرار 10. ما الوسط التقديري الجديد؟\nالإجابة النموذجية: (240 + 450) ÷ 20 = 34.5\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: كثافة الفئة = التكرار ÷ ___\nالإجابة النموذجية: طول الفئة\n5) [مستوى التطبيق] الفئات 0–<10 (10)، 10–<15 (8)، 15–<30 (15). حدد الفئة المنوالية.\nالإجابة النموذجية: الكثافات 1، 1.6، 1 ← الفئة 10–<15\n6) [مستوى الاستدلال] لماذا لا نختار الفئة المنوالية بأعلى تكرار عند اختلاف الأطوال؟\nالإجابة النموذجية: لأن الفئة الأطول تحوي قيمًا أكثر بسبب طولها لا لكثافتها.", "للطالب: تمارين 4-2أ: الأسئلة 1–3، وكتاب النشاط ص76 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 4-2أ: الأسئلة 4–6، وكتاب النشاط ص77 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الفئة المنوالية والمدرج التكراري وكثافة الفئة» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=17"]}, {"ax": "الوسيط التقديري من منحنى التكرار التراكمي", "wk": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1) يكوّن جدول التكرار التراكمي ويرسم منحناه (15 دقيقة)\n2) يقدّر الوسيط من المنحنى عند الرتبة ن ÷ 2 (10 دقائق)\n\nمخرج تعليمي آخر: يحدد الفئة التي تحتوي الوسيط ويقدّره بالاستكمال الخطي (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "التكرار التراكمي، منحنى التكرار التراكمي، الحد الأعلى للفئة، الفئة الوسيطية، الاستكمال الخطي.", "يسأل المعلم: في الجدول (4، 7، 6، 3) كم قيمة أقل من 20؟ وكم أقل من 30؟ ويجمع الطالب: 11 و 17. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 3» ص137، ويطلب رسم منحنى التكرار التراكمي بنقاط (الحد الأعلى، التكرار التراكمي): (0، 0)، (10، 4)، (20، 11)، (30، 17)، (40، 20)، ويرسم الطالب المنحنى على ورق رسم بياني (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يقرأ المعلم الوسيط عند الرتبة 10 من المنحنى، ثم يحسبه بالاستكمال: 10 + (10 − 4) ÷ 7 × 10 ≈ 18.6 (المثال 14)، ويقارن الطالب القراءة البيانية بالحساب (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 4-2 ومحور «الوسيط التقديري من منحنى التكرار التراكمي»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 4-2ب: الأسئلة 1–4، وكتاب النشاط ص78–81، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس – جدول صيد القارب: تحسب المجموعات مراكز الفئات والوسط التقديري لجدول تكراري افتراضي لأوزان أسماك اصطادها قارب عماني، ثم تذكر نوعًا من الأسماك المشهورة في بحر عمان (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما الفئة التي تحتوي الوسيط إذا كان التكرار التراكمي 4، 11، 17، 20؟\nالإجابة النموذجية: الرتبة 10 تقع في الفئة الثانية 10–<20\n2) [مستوى التطبيق] عند رسم منحنى التكرار التراكمي نستخدم أي حد للفئة؟\nالإجابة النموذجية: الحد الأعلى\n3) [مستوى الاستدلال] قدّر الوسيط: الفئات 0–<5، 5–<10، 10–<15 بتكرارات 6، 10، 4.\nالإجابة النموذجية: ن = 20، الرتبة 10، التراكمي 6، 16 ← 5 + (10 − 6) ÷ 10 × 5 = 7", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: رتبة الوسيط في البيانات المجمعة تقديريًا ن ÷ ___\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] التكرار التراكمي 4، 11، 17، 20 لفئات طولها 10 تبدأ من 0. قدّر الوسيط بالاستكمال الخطي.\nالإجابة النموذجية: الرتبة 10 في الفئة 10–<20: 10 + (10 − 4) ÷ 7 × 10 ≈ 18.6\n3) [مستوى الاستدلال] كيف تقرأ من منحنى التكرار التراكمي عدد القيم الأقل من 25؟\nالإجابة النموذجية: أرسم خطًا رأسيًا من 25 إلى المنحنى ثم أفقيًا إلى المحور الرأسي وأقرأ القيمة.", "للطالب: تمارين 4-2ب: الأسئلة 1–4، وكتاب النشاط ص78–81 (كتاب الطالب ص130–146، كتاب النشاط ص76–81).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=17"]}]}, {"id": "4-3", "title": "خصائص مقاييس النزعة المركزية", "p": [{"ax": "مزايا الوسط الحسابي وعيوبه + مزايا الوسيط والمنوال وعيوبهما", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يذكر مزايا الوسط الحسابي (يستخدم كل القيم، يصلح للحسابات اللاحقة) (10 دقائق)\n2) يوضح عيوب الوسط الحسابي (التأثر بالقيم المتطرفة، قد لا يكون قيمة فعلية) (10 دقائق)\n3) يذكر مزايا الوسيط وعيوبه (5 دقائق)\n4) يذكر مزايا المنوال وعيوبه (5 دقائق)\n\nمخرج تعليمي آخر:\nيحكم على صلاحية الوسط في سياقات محددة (5 دقائق)\nيقارن بين المقاييس الثلاثة في جدول منظم (5 دقائق)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تذكر\nالمخرج الآخر: تقييم\nالمخرج الآخر: تحليل", "- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقات مواقف", "مزايا المقياس، عيوب المقياس، القيم المتطرفة، القيمة الفعلية، استخدام جميع البيانات.، الوسيط، المنوال، الثبات أمام القيم المتطرفة، البيانات النوعية، عدم الوحدانية.", "يسأل المعلم: معدل عدد أفراد الأسرة في الحي 4.6 فرد. هل توجد أسرة فيها 4.6 فرد؟ ماذا يعني هذا العدد؟ ويناقش الطالب أن الوسط قد لا يكون قيمة فعلية لكنه يلخص البيانات. (5 دقائق)", "1. نقاش موجّه: يقود المعلم نقاشًا لاستخلاص مزايا الوسط وعيوبه من أمثلة الدروس السابقة (الرواتب، عدد أفراد الأسرة) (المثال 15)، ويشارك الطالب ويدوّن المزايا والعيوب في جدول (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم على المجموعات 4 مواقف ويطلب الحكم: هل الوسط مناسب؟ (درجات اختبار متقاربة، أسعار منازل، عدد الأطفال، أزمنة سباق فيها زمن شاذ)، وتحكم المجموعة وتبرر كتابيًا (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. نقاش موجّه: يستخلص المعلم مع، ويقوم الطالب بالوسيط لا يتأثر بالقيم المتطرفة لكنه لا يستخدم كل القيم؛ المنوال يصلح للبيانات النوعية لكنه قد لا يوجد أو يتعدد (المثال 16). يكمل جدول المقارنة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تعلم تشاركي: يقسم الطلبة أزواجًا، كل زوج يكتب مثالًا يكون فيه مقياس معين هو الأنسب ويعرضه، ويصوغ الزوج مثاله ويبرره (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-3: السؤالان 3 و 4، وكتاب النشاط ص82، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اذكر ميزة واحدة للوسط الحسابي.\nالإجابة النموذجية: يأخذ في الحسبان جميع القيم.\n2) [مستوى التطبيق] اذكر عيبًا واحدًا للوسط الحسابي.\nالإجابة النموذجية: يتأثر بالقيم المتطرفة.\n3) [مستوى الاستدلال] هل الوسط مناسب لدرجات: 72، 75، 78، 74، 76؟\nالإجابة النموذجية: نعم، القيم متقاربة ولا توجد قيم متطرفة.\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] اذكر ميزة للوسيط.\nالإجابة النموذجية: لا يتأثر بالقيم المتطرفة.\n5) [مستوى التطبيق] اذكر عيبًا للمنوال.\nالإجابة النموذجية: قد لا يوجد أو يكون أكثر من قيمة.\n6) [مستوى الاستدلال] أي المقاييس يصلح للبيانات النوعية؟\nالإجابة النموذجية: المنوال فقط.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: من عيوب الوسط الحسابي أنه يتأثر بالقيم ___\nالإجابة النموذجية: المتطرفة\n2) [مستوى التطبيق] أسعار منازل: 30، 32، 35، 33، 250 ألف ريال. هل الوسط مناسب؟\nالإجابة النموذجية: لا، لأن 250 قيمة متطرفة ترفع الوسط إلى 76 ألفًا.\n3) [مستوى الاستدلال] لماذا يفضل الوسط عند مقارنة نتائج صفين في اختبار؟\nالإجابة النموذجية: لأنه يستخدم كل الدرجات ويعكس الأداء الكلي عند غياب القيم المتطرفة.\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: المقياس الذي لا يتأثر بالقيم المتطرفة ويعتمد على الترتيب هو ___\nالإجابة النموذجية: الوسيط\n5) [مستوى التطبيق] أوجد المقاييس الثلاثة: 2، 3، 3، 4، 50.\nالإجابة النموذجية: الوسط 12.4، الوسيط 3، المنوال 3\n6) [مستوى الاستدلال] أي المقاييس أنسب للبيانات السابقة؟ ولماذا؟\nالإجابة النموذجية: الوسيط أو المنوال؛ لأن 50 قيمة متطرفة تشوه الوسط.", "للطالب: تمارين 4-3: السؤالان 1 و 2 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مزايا الوسط الحسابي وعيوبه».\nللطالب: تمارين 4-3: السؤالان 3 و 4، وكتاب النشاط ص82 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «مزايا الوسيط والمنوال وعيوبهما» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "اختيار مقياس النزعة المركزية المناسب للسياق", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يختار المقياس المناسب لسياق حياتي ويبرر اختياره (25 دقيقة)\n2) يحلل كيف يمكن أن يُساء استخدام المقاييس في الإعلانات (5 دقائق)\n\nمخرج تعليمي آخر: يحسب المقاييس لبيانات حياتية ويفسرها (10 دقائق)", "المخرج 1: تقييم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "السياق، التبرير الإحصائي، الإعلانات المضللة، تمثيل البيانات.", "يعرض المعلم إعلانًا: «متوسط راتب موظفينا 1500 ريال» ويسأل: هل يعني ذلك أن معظم الموظفين يتقاضون نحو 1500 ريال؟ ويناقش الطالب احتمال وجود رواتب مرتفعة جدًا للمديرين. (5 دقائق)", "1. حل مشكلة: يقدم المعلم رواتب شركة: 400 (6 موظفين)، 600 (3)، 5000 (1). يطلب المقاييس الثلاثة وأيها يستخدمه المدير للإعلان وأيها يمثل الموظفين، ويحسب الطالب: الوسط 920، الوسيط 400، المنوال 400، ويستنتج أن الإعلان بالوسط مضلل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل كتاب النشاط ص83–84 لاختيار المقياس المناسب، وتحل المجموعة وتبرر (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 4-3: الأسئلة 5–7، وكتاب النشاط ص83–84، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] رواتب: 400 ×6، 600 ×3، 5000 ×1. أوجد الوسط.\nالإجابة النموذجية: (2400 + 1800 + 5000) ÷ 10 = 920\n2) [مستوى التطبيق] أوجد الوسيط والمنوال للبيانات السابقة.\nالإجابة النموذجية: الوسيط 400، المنوال 400\n3) [مستوى الاستدلال] أي مقياس يمثل راتب الموظف المعتاد؟\nالإجابة النموذجية: الوسيط (أو المنوال) = 400", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: لاختيار أكثر مقاس قميص مبيعًا نستخدم ___\nالإجابة النموذجية: المنوال\n2) [مستوى التطبيق] أزمنة انتظار (دقائق): 3، 4، 4، 5، 6، 30. ما المقياس الأنسب؟\nالإجابة النموذجية: الوسيط = 4.5 لوجود قيمة متطرفة 30\n3) [مستوى الاستدلال] درجات اختبار متقاربة لـ 30 طالبًا. ما المقياس الأنسب لمقارنتها بصف آخر؟\nالإجابة النموذجية: الوسط الحسابي", "للطالب: تمارين 4-3: الأسئلة 5–7، وكتاب النشاط ص83–84 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «اختيار مقياس النزعة المركزية المناسب للسياق».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "أثر إضافة ثابت أو الضرب في ثابت على مقاييس النزعة المركزية", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يستكشف أثر إضافة ثابت لجميع القيم على الوسط والوسيط والمنوال (15 دقيقة)\n2) يستكشف أثر ضرب جميع القيم في ثابت على المقاييس (15 دقيقة)\n\nمخرج تعليمي آخر: يستخدم هذه الخصائص لحساب المقاييس بسرعة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "التحويل الخطي، إضافة ثابت، الضرب في ثابت، الإزاحة، التكبير.", "يسأل المعلم: إذا أضاف المعلم 5 درجات لكل طالب، ماذا يحدث لوسط الصف؟ ويتوقع الطالب أن يزيد الوسط 5. (5 دقائق)", "1. اكتشاف: يعطي المعلم البيانات 2، 4، 4، 7، 8 (الوسط 5، الوسيط 4، المنوال 4) ويطلب حسابها بعد إضافة 10 ثم بعد الضرب في 3، ويلاحظ: كل مقياس يزيد 10، ثم يتضاعف 3 مرات (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعميم: يعمم المعلم القاعدة: إذا ص = أس + ب فإن مقياس ص = أ × مقياس س + ب، ويطبق على تحويل درجات الحرارة، ويحول الطالب وسط درجات مئوية 30 إلى فهرنهايت: 1.8 × 30 + 32 = 86 (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: كتاب النشاط ص84، وتمارين 4-3: السؤال 8، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] وسط مجموعة 12، أضيف 3 لكل قيمة. الوسط الجديد؟\nالإجابة النموذجية: 15\n2) [مستوى التطبيق] وسيط مجموعة 8، ضربت كل قيمة في 2. الوسيط الجديد؟\nالإجابة النموذجية: 16\n3) [مستوى الاستدلال] منوال مجموعة 6، طُرح 1 من كل قيمة. المنوال الجديد؟\nالإجابة النموذجية: 5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عند ضرب كل القيم في 4 يُضرب الوسط في ___\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] وسط درجات حرارة 25° م. ما الوسط بالفهرنهايت؟\nالإجابة النموذجية: 1.8 × 25 + 32 = 77\n3) [مستوى الاستدلال] وسط مجموعة 20. ضربت القيم في 3 ثم أضيف 5. الوسط الجديد؟\nالإجابة النموذجية: 3 × 20 + 5 = 65", "للطالب: كتاب النشاط ص84، وتمارين 4-3: السؤال 8 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "مشروع إحصائي مصغر: جمع بيانات وتلخيصها واختيار المقياس الأنسب", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يجمع بيانات حقيقية من بيئته وينظمها في جدول تكراري (15 دقيقة)\n2) يحسب مقاييس النزعة المركزية ويختار الأنسب للبيانات (15 دقيقة)\n\nمخرج تعليمي آخر: يعرض نتائجه في تقرير مختصر وتمثيل بياني (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: استبانة ورقية", "جمع البيانات، التنظيم، التلخيص، التمثيل البياني، التقرير الإحصائي.", "يطرح المعلم سؤالًا بحثيًا: «كم ساعة ينام طلبة الحادي عشر ليلًا؟» ويسأل: كيف نجيب عنه؟ ويقترح الطالب جمع البيانات من الزملاء. (5 دقائق)", "1. مشروع: توزع المجموعات أسئلة بحثية (ساعات النوم، زمن الوصول للمدرسة، ساعات الاستذكار)، وتجمع البيانات من طلبة الصف، وتنظمها، وتجمع البيانات وتنظمها في جدول تكراري (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تحليل: يوجه كل مجموعة لحساب المقاييس الثلاثة ورسم تمثيل مناسب واختيار المقياس الأنسب، وتحسب وتمثل وتكتب استنتاجًا (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض مجموعتان نتائجهما ويقدم المعلم تغذية راجعة (تقويم تكويني)، وتعرض وتجيب عن الأسئلة (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: إكمال تقرير المشروع المصغر وتسليمه في الحصة القادمة، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما أول خطوة في المشروع الإحصائي؟\nالإجابة النموذجية: تحديد السؤال البحثي\n2) [مستوى التطبيق] ساعات نوم: 6، 7، 7، 8، 7، 5، 9. أوجد المقاييس الثلاثة.\nالإجابة النموذجية: الوسط 7، الوسيط 7، المنوال 7\n3) [مستوى الاستدلال] ما التمثيل المناسب لبيانات عدد ساعات النوم؟\nالإجابة النموذجية: الأعمدة البيانية أو مخطط الساق والورقة", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: بعد جمع البيانات ننظمها في ___\nالإجابة النموذجية: جدول تكراري\n2) [مستوى التطبيق] أزمنة الوصول (دقائق): 10، 12، 15، 15، 45. أي مقياس أنسب؟\nالإجابة النموذجية: الوسيط 15 لوجود قيمة متطرفة 45\n3) [مستوى الاستدلال] اكتب استنتاجًا من جملة واحدة لبيانات النوم السابقة.\nالإجابة النموذجية: ينام الطالب المعتاد في الصف نحو 7 ساعات ليلًا.", "للطالب: إكمال تقرير المشروع المصغر وتسليمه في الحصة القادمة (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: متابعة تقدم الابن/الابنة في «مشروع إحصائي مصغر: جمع بيانات وتلخيصها واختيار المقياس الأنسب» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}, {"ax": "مراجعة الوحدة الرابعة: مقاييس النزعة المركزية", "wk": "الأسبوع الثاني عشر (22–26/11/2026م)", "f": ["1) يحسب المقاييس الثلاثة لبيانات غير مجمعة ومجمعة (15 دقيقة)\n2) يختار المقياس المناسب ويبرر (10 دقائق)\n\nمخرج تعليمي آخر: يقوّم تعلمه ذاتيًا ويحدد احتياجاته (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: بطاقة التقويم الذاتي\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الوسط، الوسيط، المنوال، البيانات المجمعة، الفئة المنوالية، الوسيط التقديري، خصائص المقاييس.", "ينظم المعلم مسابقة سريعة «أي مقياس؟» بعرض مواقف على الشاشة، ويجيب الطالب بسرعة ويبرر. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم تمارين مراجعة نهاية الوحدة ص151–154 على المجموعات حسب المحاور، وتحل المجموعة محورها (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعلم تشاركي: تعرض المجموعات حلولها ويثبت المعلم خريطة مفاهيم الوحدة، وتشرح المجموعة وتجيب (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تقويم ذاتي: يوزع المعلم بطاقة «أستطيع أن...» للوحدة (تقويم تكويني)، ويقيم الطالب نفسه ويحدد ما يراجعه (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. المعلم: يختار المعلم الدرس 4-3 ومحور «مراجعة الوحدة الرابعة: مقاييس النزعة المركزية»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين مراجعة نهاية الوحدة ص151–154، وكتاب النشاط ص85–86، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (1 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – مناظرة الوسط والوسيط: تتناظر مجموعتان: أيهما يمثل أسعار منازل حي في ولاية ساحلية أفضل، الوسط أم الوسيط، إذا كان بينها منزل مرتفع الثمن جدًا؟ ثم يحسم الصف النقاش بالتعليل (5 دقائق)\nالاستراتيجيات: المناظرة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الوسط التقديري: فئات 0–<20، 20–<40 بتكرارات 6، 4.\nالإجابة النموذجية: (60 + 120) ÷ 10 = 18\n2) [مستوى التطبيق] أوجد الوسيط: 9، 2، 7، 4، 6، 8.\nالإجابة النموذجية: 2، 4، 6، 7، 8، 9 ← 6.5\n3) [مستوى الاستدلال] ما المقياس الأنسب لعدد الأطفال في الأسر؟\nالإجابة النموذجية: المنوال أو الوسيط، لأنهما قيم صحيحة ممثلة.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الفئة المنوالية عند اختلاف الأطوال هي ذات أعلى ___\nالإجابة النموذجية: كثافة\n2) [مستوى التطبيق] س = 1، 2، 3 و ت = 4، 3، 3. أوجد الوسط والمنوال.\nالإجابة النموذجية: الوسط 1.9، المنوال 1\n3) [مستوى الاستدلال] وسط 10 قيم 15، أضيفت قيمة 37. الوسط الجديد؟\nالإجابة النموذجية: (150 + 37) ÷ 11 = 17", "للطالب: إكمال تمارين مراجعة نهاية الوحدة ص151–154، وكتاب النشاط ص85–86 (كتاب الطالب ص147–150، ومراجعة الوحدة ص151–154، كتاب النشاط ص82–84، ومراجعة الوحدة ص85–86).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=18"]}]}, {"id": "5-1", "title": "المدى للبيانات المجمعة وغير المجمعة", "p": [{"ax": "مفهوم التشتت والمدى للبيانات غير المجمعة + المدى من الجدول التكراري ومخطط الساق والورقة", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يوضح مفهوم التشتت وحاجتنا إليه إلى جانب مقاييس النزعة المركزية (10 دقائق)\n2) يحسب المدى = أكبر قيمة − أصغر قيمة (5 دقائق)\n3) يحسب المدى من جدول تكراري بتحديد أكبر وأصغر قيمة لها تكرار (5 دقائق)\n4) يحسب المدى من مخطط الساق والورقة (5 دقائق)\n\nمخرج تعليمي آخر:\nيقارن بين مجموعتين لهما الوسط نفسه ومدى مختلف (10 دقائق)\nيكتشف خطأ حساب المدى من التكرارات بدل القيم (5 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "التشتت، المدى، أكبر قيمة، أصغر قيمة، انتشار البيانات.، الجدول التكراري، مخطط الساق والورقة، المفتاح، القيمة والتكرار.", "يعرض المعلم درجات لاعبَي رماية في 5 جولات: الأول 8، 8، 9، 8، 7 والثاني 10، 4، 10، 6، 10 (الوسط 8 لكليهما)، ويسأل: أيهما أكثر ثباتًا؟ ويلاحظ الطالب أن الأول أكثر ثباتًا رغم تساوي الوسطين. (5 دقائق)", "1. النمذجة: يعرّف المعلم التشتت والمدى، ويحسب مدى اللاعبين: 9 − 7 = 2 و 10 − 4 = 6 (المثالان 1 و 2)، ويحسب الطالب المدى ويفسر الفرق (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم بيانات درجات حرارة لمدينتين عمانيتين خلال أسبوع (بيانات افتراضية) ويطلب الوسط والمدى والمقارنة، وتحسب المجموعة المقياسين وتكتب مقارنة (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. النمذجة: ينمذج المعلم: س = 2، 3، 4، 5، 6 بتكرارات 1، 4، 7، 3، 0 ← المدى 5 − 2 = 3 (لأن 6 تكرارها صفر) (المثالان 3 و 4)، ويتابع الطالب ويطبق على جدول آخر (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تطبيق موجّه: يعرض المعلم مخطط ساق وورقة لأوزان حقائب (المفتاح 3 | 2 = 32 كغم) ويطلب المدى (المثال 5)، ويقرأ الطالب أصغر وأكبر قيمة ويحسب المدى (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-1: الأسئلة 4–6، وكتاب النشاط ص87، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد مدى: 12، 7، 15، 9، 20.\nالإجابة النموذجية: 20 − 7 = 13\n2) [مستوى التطبيق] أي المجموعتين أكثر تشتتًا: 5، 6، 7 أم 1، 6، 11؟\nالإجابة النموذجية: الثانية، مداها 10 مقابل 2.\n3) [مستوى الاستدلال] لماذا نحتاج مقياسًا للتشتت؟\nالإجابة النموذجية: لأن مجموعات مختلفة قد يكون لها الوسط نفسه مع انتشار مختلف.\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] س = 10، 20، 30، 40 و ت = 3، 0، 5، 2. أوجد المدى.\nالإجابة النموذجية: 40 − 10 = 30\n5) [مستوى التطبيق] ساق وورقة: 1 | 4 7، 2 | 0 3 9، 3 | 5. أوجد المدى.\nالإجابة النموذجية: 35 − 14 = 21\n6) [مستوى الاستدلال] س = 1، 2، 3، 4 و ت = 0، 5، 8، 2. أوجد المدى.\nالإجابة النموذجية: 4 − 2 = 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المدى = أكبر قيمة − ___\nالإجابة النموذجية: أصغر قيمة\n2) [مستوى التطبيق] أوجد مدى: 3.2، 4.8، 2.9، 5.1.\nالإجابة النموذجية: 5.1 − 2.9 = 2.2\n3) [مستوى الاستدلال] مدى مجموعة 12 وأصغر قيمة فيها 15. ما أكبر قيمة؟\nالإجابة النموذجية: 27\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: في الجدول التكراري نتجاهل القيم التي تكرارها ___ عند حساب المدى.\nالإجابة النموذجية: صفر\n5) [مستوى التطبيق] ساق وورقة: 4 | 1 5، 5 | 2 2 8، 6 | 0 7. أوجد المدى.\nالإجابة النموذجية: 67 − 41 = 26\n6) [مستوى الاستدلال] س = 5، 6، 7، 8 و ت = 2، 9، 1، 3. أوجد المدى.\nالإجابة النموذجية: 8 − 5 = 3", "للطالب: تمارين 5-1: الأسئلة 1–3 (كتاب الطالب ص155–160، كتاب النشاط ص87–88).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم التشتت والمدى للبيانات غير المجمعة».\nللطالب: تمارين 5-1: الأسئلة 4–6، وكتاب النشاط ص87 (كتاب الطالب ص155–160، كتاب النشاط ص87–88).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «المدى من الجدول التكراري ومخطط الساق والورقة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=19"]}, {"ax": "المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يحدد الحدين الأدنى والأعلى لقيمة مقربة (15 دقيقة)\n2) يحسب أكبر مدى ممكن وأصغر مدى ممكن لبيانات مجمعة في فئات (15 دقيقة)\n\nمخرج تعليمي آخر: يفسر لماذا لا يمكن حساب المدى الدقيق للبيانات المجمعة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "البيانات المجمعة، حدود الفئة، الحد الأدنى، الحد الأعلى، أكبر مدى ممكن، أصغر مدى ممكن، القيم المقربة.", "يسأل المعلم: طول قلم 14 سم مقربًا لأقرب سنتيمتر. ما أقصر طول ممكن؟ وما أطوله؟ ويجيب الطالب: من 13.5 إلى أقل من 14.5 سم. (5 دقائق)", "1. النمذجة: ينمذج المعلم: فئات 5 ≤ س < 8، 8 ≤ س < 10، 10 ≤ س < 15 كلها بتكرار: أكبر مدى ممكن 15 − 5 = 10، وأصغر مدى ممكن 10 − 8 = 2 (المثالان 6 و 7)، ويتابع الطالب ويرسم الفئات على خط الأعداد لتوضيح الفكرة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول لقيم مقربة (أوزان لأقرب 100 كغم، أعداد زوار لأقرب 1000) لإيجاد الحدود، وتجد المجموعة الحدود: 300 كغم ← 250 إلى 350 (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. المعلم: يختار المعلم الدرس 5-1 ومحور «المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-1: الأسئلة 7–9، وكتاب النشاط ص88، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – مدى حرارة وطني: يكتب المعلم قراءات حرارة افتراضية لولاية ساحلية وأخرى صحراوية، فتحسب المجموعات المدى لكل منهما وتناقش أثر تنوع مناخ عمان في الزراعة والحياة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما حدا القيمة 4 سم المقربة لأقرب سنتيمتر؟\nالإجابة النموذجية: 3.5 سم و 4.5 سم\n2) [مستوى التطبيق] فئات 0 ≤ س < 10، 10 ≤ س < 20، 20 ≤ س < 30. أوجد أكبر مدى ممكن.\nالإجابة النموذجية: 30 − 0 = 30\n3) [مستوى الاستدلال] أوجد أصغر مدى ممكن للفئات السابقة.\nالإجابة النموذجية: 20 − 10 = 10", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: حدا القيمة 300 كغم المقربة لأقرب 100 كغم هما 250 و ___\nالإجابة النموذجية: 350\n2) [مستوى التطبيق] فئات 2 ≤ س < 4، 4 ≤ س < 6، 6 ≤ س < 9. أوجد أكبر وأصغر مدى ممكن.\nالإجابة النموذجية: الأكبر 9 − 2 = 7، الأصغر 6 − 4 = 2\n3) [مستوى الاستدلال] لماذا لا نحسب المدى الدقيق للبيانات المجمعة؟\nالإجابة النموذجية: لأننا لا نعرف القيم الفعلية داخل الفئات.", "للطالب: تمارين 5-1: الأسئلة 7–9، وكتاب النشاط ص88 (كتاب الطالب ص155–160، كتاب النشاط ص87–88).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «المدى للبيانات المجمعة: أكبر مدى ممكن وأصغر مدى ممكن».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=19"]}]}, {"id": "5-2", "title": "المدى الربيعي", "p": [{"ax": "الربيعات والمدى الربيعي للبيانات غير المجمعة + الربيعات من الجداول ومخطط الساق والورقة ومنحنى التكرار التراكمي", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يجد الربيع الأدنى ر1 والوسيط والربيع الأعلى ر3 لبيانات مرتبة (5 دقائق)\n2) يحسب المدى الربيعي = ر3 − ر1 (5 دقائق)\n3) يجد الربيعات من جدول تكراري ومخطط الساق والورقة (10 دقائق)\n4) يقدّر الربيعات للبيانات المجمعة من منحنى التكرار التراكمي عند ن ÷ 4 و 3ن ÷ 4 (5 دقائق)\n\nمخرج تعليمي آخر:\nيفسر المدى الربيعي بوصفه مدى النصف الأوسط من البيانات (10 دقائق)\nيحسب المدى الربيعي التقديري ويفسره (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني", "الربيع الأدنى، الربيع الأعلى، الوسيط، المدى الربيعي، النصف الأوسط من البيانات.، التكرار التراكمي، رتبة الربيع الأدنى ن ÷ 4، رتبة الربيع الأعلى 3ن ÷ 4، المدى الربيعي التقديري.", "يعرض المعلم بيانات فيها قيمة متطرفة: 3، 4، 5، 5، 6، 7، 40، ويسأل: هل المدى 37 يعبر عن انتشار معظم البيانات؟ ويلاحظ الطالب أن القيمة 40 ضخمت المدى. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 1» ص161 لتقسيم بيانات مرتبة إلى أربعة أجزاء متساوية، ويقسم الطالب البيانات ويحدد نقاط التقسيم (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم: 3، 5، 7، 8، 9، 11، 13، 15، 20: الوسيط 9، النصف الأدنى 3، 5، 7، 8 ← ر1 = 6، النصف الأعلى 11، 13، 15، 20 ← ر3 = 14، المدى الربيعي 8 (المثالان 8 و 9)، ويطبق الطالب على بيانات زوجية العدد (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. النمذجة: ينمذج المعلم قراءة ر1 و ر3 من منحنى تكرار تراكمي لأطوال 80 نبتة: الرتبتان 20 و 60 (المثالان 10 و 11)، ويقرأ الطالب القيم من المنحنى ويحسب المدى الربيعي (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعلم تعاوني: يوزع المعلم مخطط ساق وورقة لـ 15 قيمة وجدولًا تكراريًا لإيجاد الربيعات (المثال 12)، وتحدد المجموعة الوسيط ونصفي البيانات والربيعين (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-2: الأسئلة 4–6، وكتاب النشاط ص90–91، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] رتب وأوجد الوسيط: 8، 2، 6، 4، 10، 12، 14.\nالإجابة النموذجية: 2، 4، 6، 8، 10، 12، 14 ← الوسيط 8\n2) [مستوى التطبيق] أوجد ر1 و ر3 للبيانات السابقة.\nالإجابة النموذجية: ر1 = 4 (وسيط 2، 4، 6)، ر3 = 12 (وسيط 10، 12، 14)\n3) [مستوى الاستدلال] أوجد المدى الربيعي.\nالإجابة النموذجية: 12 − 4 = 8\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] ن = 80 في بيانات مجمعة. ما رتبتا الربيعين؟\nالإجابة النموذجية: ر1 عند 20، ر3 عند 60\n5) [مستوى التطبيق] من منحنى تكرار تراكمي قرأنا ر1 = 12 و ر3 = 21. ما المدى الربيعي؟\nالإجابة النموذجية: 9\n6) [مستوى الاستدلال] س = 1، 2، 3، 4، 5 و ت = 2، 3، 4، 3، 2 (ن = 14). أوجد الوسيط.\nالإجابة النموذجية: الرتبتان 7 و 8 عند 3 ← الوسيط 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المدى الربيعي = ر3 − ___\nالإجابة النموذجية: ر1\n2) [مستوى التطبيق] أوجد المدى الربيعي: 1، 3، 4، 6، 7، 9، 10، 12.\nالإجابة النموذجية: النصف الأدنى 1، 3، 4، 6 ← ر1 = 3.5؛ الأعلى 7، 9، 10، 12 ← ر3 = 9.5؛ المدى الربيعي 6\n3) [مستوى الاستدلال] لماذا لا يتأثر المدى الربيعي كثيرًا بالقيم المتطرفة؟\nالإجابة النموذجية: لأنه يعتمد على النصف الأوسط من البيانات فقط.\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: رتبة الربيع الأعلى التقديرية في البيانات المجمعة ___ × ن\nالإجابة النموذجية: 3 ÷ 4\n5) [مستوى التطبيق] للجدول السابق (ن = 14)، أوجد ر1 و ر3.\nالإجابة النموذجية: النصف الأدنى 7 قيم: 1، 1، 2، 2، 2، 3، 3 ← ر1 = 2؛ النصف الأعلى 3، 3، 4، 4، 4، 5، 5 ← ر3 = 4\n6) [مستوى الاستدلال] أوجد المدى الربيعي للجدول السابق.\nالإجابة النموذجية: 4 − 2 = 2", "للطالب: تمارين 5-2: الأسئلة 1–3، وكتاب النشاط ص89 (كتاب الطالب ص161–168، كتاب النشاط ص89–92).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\nللطالب: تمارين 5-2: الأسئلة 4–6، وكتاب النشاط ص90–91 (كتاب الطالب ص161–168، كتاب النشاط ص89–92).\nلولي الأمر: متابعة تقدم الابن/الابنة في «الربيعات من الجداول ومخطط الساق والورقة ومنحنى التكرار التراكمي» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=20"]}, {"ax": "المخطط الصندوقي والمقارنة بين مجموعتين", "wk": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "f": ["1) يرسم المخطط الصندوقي (الصندوق والمؤشر) من الملخص الخماسي (15 دقيقة)\n2) يقارن بين مجموعتين باستخدام الوسيط والمدى الربيعي من المخطط الصندوقي (15 دقيقة)\n\nمخرج تعليمي آخر: يصدر حكمًا مبررًا حول اتساق البيانات (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: ورق رسم بياني\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الملخص الخماسي (أصغر قيمة، ر1، الوسيط، ر3، أكبر قيمة)، المخطط الصندوقي، المقارنة، الاتساق.", "يعرض المعلم مخططين صندوقيين لأزمنة عداءين ويسأل: أي العداءين أسرع عادة؟ وأيهما أكثر ثباتًا؟ ويقارن الطالب الوسيطين وعرضي الصندوقين. (5 دقائق)", "1. النمذجة: ينمذج المعلم رسم المخطط الصندوقي للبيانات 3، 5، 7، 8، 9، 11، 13، 15، 20 (الملخص: 3، 6، 9، 14، 20) (المثال 13)، ويرسم الطالب المخطط على ورق رسم بياني (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم بيانات درجات صفين ويطلب رسم مخططين صندوقيين على المحور نفسه والمقارنة، وترسم المجموعة وتكتب مقارنتين: الوسيط والمدى الربيعي (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 5-2 ومحور «المخطط الصندوقي والمقارنة بين مجموعتين»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: تمارين 5-2: الأسئلة 7–9، وكتاب النشاط ص92، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – ربيعيات سباق الهجن: تجد المجموعات الربيع الأدنى والوسيط والربيع الأعلى لأزمنة افتراضية لهجن في سباق تقليدي، ثم تحسب المدى الربيعي وتتحدث عن سباقات الهجن تراثًا عمانيًا (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما مكونات الملخص الخماسي؟\nالإجابة النموذجية: أصغر قيمة، ر1، الوسيط، ر3، أكبر قيمة\n2) [مستوى التطبيق] صف الصندوق في المخطط الصندوقي.\nالإجابة النموذجية: يمتد من ر1 إلى ر3 ويقسمه خط عند الوسيط.\n3) [مستوى الاستدلال] صندوق المجموعة أ أضيق من ب. ماذا تستنتج؟\nالإجابة النموذجية: بيانات أ أكثر اتساقًا (مدى ربيعي أصغر).", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: عرض الصندوق في المخطط الصندوقي يساوي المدى ___\nالإجابة النموذجية: الربيعي\n2) [مستوى التطبيق] ملخص: 10، 15، 22، 28، 40. أوجد المدى والمدى الربيعي.\nالإجابة النموذجية: المدى 30، المدى الربيعي 13\n3) [مستوى الاستدلال] مجموعتان: أ (الوسيط 60، المدى الربيعي 8) و ب (الوسيط 65، المدى الربيعي 20). قارن بينهما.\nالإجابة النموذجية: ب أعلى في المتوسط، و أ أكثر اتساقًا.", "للطالب: تمارين 5-2: الأسئلة 7–9، وكتاب النشاط ص92 (كتاب الطالب ص161–168، كتاب النشاط ص89–92).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=20"]}]}, {"id": "5-3", "title": "التباين والانحراف المعياري", "p": [{"ax": "مفهوم الانحراف عن الوسط والتباين والانحراف المعياري + الصيغة المختصرة للتباين للبيانات غير المجمعة", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يحسب انحراف كل قيمة عن الوسط الحسابي (10 دقائق)\n2) يحسب التباين = مج(س − الوسط)² ÷ ن والانحراف المعياري = √التباين (5 دقائق)\n3) يستخدم الصيغة: التباين = مج س² ÷ ن − (الوسط)² (5 دقائق)\n4) يتحقق من تكافؤ الصيغتين بمثال عددي (5 دقائق)\n\nمخرج تعليمي آخر:\nيفسر لماذا نربّع الانحرافات قبل جمعها (5 دقائق)\nيحسب الانحراف المعياري من ملخصات ن و مج س و مج س² (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تقييم\nالمخرج الآخر: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الانحراف عن الوسط، مربع الانحراف، التباين، الانحراف المعياري، وحدة القياس.، الصيغة المختصرة، مج س، مج س²، الملخصات الإحصائية.", "يطلب المعلم حساب الانحرافات عن الوسط للبيانات 2، 4، 6 وجمعها، ويسأل: لماذا كان المجموع صفرًا؟ ويلاحظ الطالب أن الانحرافات الموجبة والسالبة تلغي بعضها. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 2» ص169 ويقود الطلبة إلى فكرة تربيع الانحرافات، ويربع الطالب الانحرافات ويلاحظ أن جميعها موجبة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: ينمذج المعلم في جدول: 2، 4، 4، 4، 5، 5، 7، 9 (الوسط 5): مربعات الانحرافات 9، 1، 1، 1، 0، 0، 4، 16 ومجموعها 32 ← التباين 4 ← الانحراف المعياري 2 (المثال 14)، ويكمل الطالب أعمدة الجدول ويحسب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. النمذجة: يطبق المعلم الصيغة المختصرة على 2، 4، 4، 4، 5، 5، 7، 9: مج س² = 232، 232 ÷ 8 − 25 = 4 ✓ (المثال 15)، ويتحقق الطالب من النتيجة نفسها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تطبيق موجّه: يعطي المعلم ملخصات: ن = 10، مج س = 50، مج س² = 290 ← التباين 29 − 25 = 4 ← الانحراف 2 (المثال 16)، ويحسب الطالب من الملخصات (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3أ: الأسئلة 3–5، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما مجموع الانحرافات عن الوسط لأي بيانات؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد التباين: 2، 4، 6.\nالإجابة النموذجية: الوسط 4، (4 + 0 + 4) ÷ 3 = 8/3\n3) [مستوى الاستدلال] أوجد الانحراف المعياري: 1، 1، 5، 5.\nالإجابة النموذجية: الوسط 3، التباين (4 + 4 + 4 + 4) ÷ 4 = 4، الانحراف المعياري 2\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] ن = 5، مج س = 20، مج س² = 100. أوجد التباين.\nالإجابة النموذجية: 20 − 16 = 4\n5) [مستوى التطبيق] أوجد الانحراف المعياري للسؤال السابق.\nالإجابة النموذجية: 2\n6) [مستوى الاستدلال] أوجد التباين: 1، 2، 3، 4، 5 بالصيغة المختصرة.\nالإجابة النموذجية: مج س² = 55، 11 − 9 = 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: الانحراف المعياري = الجذر التربيعي لـ ___\nالإجابة النموذجية: التباين\n2) [مستوى التطبيق] أوجد التباين: 3، 5، 7.\nالإجابة النموذجية: الوسط 5، (4 + 0 + 4) ÷ 3 = 8/3 ≈ 2.67\n3) [مستوى الاستدلال] لماذا نستخدم الانحراف المعياري بدل التباين في التفسير؟\nالإجابة النموذجية: لأن وحدته نفس وحدة البيانات.\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: التباين = مج س² ÷ ن − (___)²\nالإجابة النموذجية: الوسط\n5) [مستوى التطبيق] ن = 8، مج س = 40، مج س² = 232. أوجد الانحراف المعياري.\nالإجابة النموذجية: التباين 29 − 25 = 4، الانحراف 2\n6) [مستوى الاستدلال] ن = 4، مج س = 12، مج س² = 52. أوجد التباين.\nالإجابة النموذجية: 13 − 9 = 4", "للطالب: تمارين 5-3أ: الأسئلة 1–2 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مفهوم الانحراف عن الوسط والتباين والانحراف المعياري».\nللطالب: تمارين 5-3أ: الأسئلة 3–5 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «الصيغة المختصرة للتباين للبيانات غير المجمعة» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}, {"ax": "التباين والانحراف المعياري من الجدول التكراري", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يكوّن أعمدة ت × س و ت × س² في الجدول التكراري (5 دقائق)\n2) يحسب التباين = مج(ت س²) ÷ مج ت − (الوسط)² (15 دقيقة)\n\nمخرج تعليمي آخر: يستخدم الآلة الحاسبة في الوضع الإحصائي للتحقق (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الجدول التكراري، مج(ت س)، مج(ت س²)، الوضع الإحصائي في الآلة الحاسبة.", "يسأل المعلم: كيف عدّلنا صيغة الوسط للجدول التكراري؟ فكيف نعدّل صيغة التباين؟ ويقترح الطالب ضرب س² في التكرار. (5 دقائق)", "1. النمذجة: ينمذج المعلم: س = 1، 2، 3، 4 و ت = 2، 3، 4، 1: مج ت = 10، مج(ت س) = 24، الوسط 2.4، مج(ت س²) = 66، التباين 6.6 − 5.76 = 0.84، الانحراف ≈ 0.92 (المثال 17)، ويكمل الطالب الأعمدة ويحسب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول تكرارية لكل مجموعة، ويطلب الحساب يدويًا ثم بالآلة الحاسبة، وتحسب المجموعة وتتحقق بالآلة (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3أ: الأسئلة 6–8، وكتاب النشاط ص93، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س = 0، 1، 2 و ت = 3، 4، 3. أوجد الوسط.\nالإجابة النموذجية: (0 + 4 + 6) ÷ 10 = 1\n2) [مستوى التطبيق] أوجد التباين للجدول السابق.\nالإجابة النموذجية: مج(ت س²) = 0 + 4 + 12 = 16، 1.6 − 1 = 0.6\n3) [مستوى الاستدلال] أوجد الانحراف المعياري للجدول السابق.\nالإجابة النموذجية: √0.6 ≈ 0.77", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في الجدول التكراري، التباين = مج(ت س²) ÷ ___ − (الوسط)²\nالإجابة النموذجية: مج ت\n2) [مستوى التطبيق] س = 2، 4 و ت = 5، 5. أوجد التباين.\nالإجابة النموذجية: الوسط 3، مج(ت س²) = 20 + 80 = 100، 10 − 9 = 1\n3) [مستوى الاستدلال] س = 1، 2، 3 و ت = 1، 2، 1. أوجد الانحراف المعياري.\nالإجابة النموذجية: الوسط 2، مج(ت س²) = 1 + 8 + 9 = 18، 4.5 − 4 = 0.5، الانحراف ≈ 0.71", "للطالب: تمارين 5-3أ: الأسئلة 6–8، وكتاب النشاط ص93 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «التباين والانحراف المعياري من الجدول التكراري».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}, {"ax": "تقدير التباين والانحراف المعياري للبيانات المجمعة", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يستخدم مراكز الفئات لتقدير التباين والانحراف المعياري (15 دقيقة)\n2) ينظم الحساب في جدول (الفئة، م، ت، ت م، ت م²) (15 دقيقة)\n\nمخرج تعليمي آخر: يفسر سبب كون النتائج تقديرية (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "البيانات المجمعة، مركز الفئة م، التباين التقديري، الانحراف المعياري التقديري.", "يذكّر المعلم بالوسط التقديري للبيانات المجمعة ويسأل: كيف نقدّر التباين؟ ويقترح الطالب استخدام مراكز الفئات مكان القيم. (5 دقائق)", "1. النمذجة: ينمذج المعلم: فئات 0–<10، 10–<20، 20–<30 بتكرارات 2، 5، 3: المراكز 5، 15، 25، مج(ت م) = 160، الوسط 16، مج(ت م²) = 3050، التباين 305 − 256 = 49، الانحراف 7 (المثال 18)، وينظم الطالب الجدول ويحسب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم جداول بيانات مجمعة (أطوال، أوزان) على المجموعات، وتحسب المجموعة التقديرات وتفسرها (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3ب: الأسئلة 1–3، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مركز الفئة 10–<20؟\nالإجابة النموذجية: 15\n2) [مستوى التطبيق] فئات 0–<4، 4–<8 بتكرارين 5، 5. أوجد الوسط التقديري.\nالإجابة النموذجية: (10 + 30) ÷ 10 = 4\n3) [مستوى الاستدلال] أوجد التباين التقديري للسؤال السابق.\nالإجابة النموذجية: مج(ت م²) = 20 + 180 = 200، 20 − 16 = 4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: في البيانات المجمعة نستخدم ___ بدلًا من القيم الفعلية.\nالإجابة النموذجية: مراكز الفئات\n2) [مستوى التطبيق] فئات 0–<10، 10–<20 بتكرارين 4، 6. أوجد الوسط والتباين التقديريين.\nالإجابة النموذجية: الوسط (20 + 90) ÷ 10 = 11، مج(ت م²) = 100 + 1350 = 1450، التباين 145 − 121 = 24\n3) [مستوى الاستدلال] أوجد الانحراف المعياري التقديري للسؤال السابق.\nالإجابة النموذجية: √24 ≈ 4.9", "للطالب: تمارين 5-3ب: الأسئلة 1–3 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: التأكد من حل تمارين النشاط المحددة وتشجيع الابن/الابنة على التحقق من إجاباته بالتعويض أو الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}, {"ax": "تفسير الانحراف المعياري والمقارنة بين مجموعتين", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يفسر الانحراف المعياري الصغير والكبير في السياق (5 دقائق)\n2) يقارن بين مجموعتين باستخدام الوسط والانحراف المعياري (25 دقيقة)\n\nمخرج تعليمي آخر: يصدر حكمًا مبررًا حول أي المجموعتين أكثر اتساقًا (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "الاتساق، التجانس، المقارنة الإحصائية، الوسط والانحراف المعياري معًا.", "يعرض المعلم زمن وصول حافلتين مدرسيتين (الوسط 7:30 لكليهما) مع انحراف معياري 2 دقيقة و 9 دقائق، ويسأل: أيهما تفضل؟ ويختار الطالب الحافلة ذات الانحراف الأصغر لأنها أكثر انتظامًا. (5 دقائق)", "1. حل مشكلة: يقدم المعلم درجات لاعبين في 6 مباريات ويطلب حساب الوسط والانحراف المعياري لكل منهما والمقارنة، ويحسب الطالب ويكتب جملتي مقارنة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم مسائل كتاب النشاط ص94 للمقارنة بين مجموعتين، وتحل المجموعة وتعرض استنتاجها (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-3ب: الأسئلة 4–5، وكتاب النشاط ص94، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ماذا يعني انحراف معياري = 0؟\nالإجابة النموذجية: جميع القيم متساوية ولا يوجد تشتت.\n2) [مستوى التطبيق] مجموعة أ: الوسط 50 والانحراف 3، مجموعة ب: الوسط 50 والانحراف 10. قارن.\nالإجابة النموذجية: المستوى نفسه، و أ أكثر اتساقًا.\n3) [مستوى الاستدلال] أيهما أكثر تشتتًا: انحراف 4 أم 1.5 لنفس نوع البيانات؟\nالإجابة النموذجية: الانحراف 4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: كلما صغر الانحراف المعياري كانت البيانات أكثر ___\nالإجابة النموذجية: اتساقًا\n2) [مستوى التطبيق] لاعب أ: الوسط 18 والانحراف 2، لاعب ب: الوسط 20 والانحراف 7. من تختار لمباراة حاسمة؟ برّر.\nالإجابة النموذجية: قد يُختار أ لثباته، أو ب لارتفاع وسطه؛ الحكم يعتمد على الحاجة للثبات أم للنتيجة الأعلى.\n3) [مستوى الاستدلال] احسب الانحراف المعياري للبيانات 5، 5، 5، 5.\nالإجابة النموذجية: 0", "للطالب: تمارين 5-3ب: الأسئلة 4–5، وكتاب النشاط ص94 (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: متابعة تقدم الابن/الابنة في «تفسير الانحراف المعياري والمقارنة بين مجموعتين» والتواصل مع المعلم عند ملاحظة صعوبة متكررة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}, {"ax": "تمارين متنوعة على التباين والانحراف المعياري", "wk": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1) يحل تمارين متنوعة على حساب التباين والانحراف المعياري (15 دقيقة)\n2) يجد قيمة مجهولة من ملخصات إحصائية (5 دقائق)\n\nمخرج تعليمي آخر: يقيم حلول الأقران (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- أخرى: الآلة الحاسبة العلمية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات التفاعلية)", "الملخصات الإحصائية، القيمة المجهولة، التحقق، تقييم الأقران.", "يطرح المعلم لغزًا: ن = 5، مج س = 30، والتباين 4. ما مج س²؟ ويحسب الطالب: (مج س² ÷ 5) − 36 = 4 ← مج س² = 200. (5 دقائق)", "1. تعلم ذاتي: يكلف المعلم بالتمارين المتبقية من 5-3أ و 5-3ب حسب المستوى، ويحل الطالب حسب مستواه (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تقييم الأقران: يتبادل الطلبة الحلول ويصححونها وفق نموذج إجابة، ويصحح الطالب ويكتب ملاحظة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. المعلم: يختار المعلم الدرس 5-3 ومحور «تمارين متنوعة على التباين والانحراف المعياري»، ويحدد 5 أسئلة، ويدير التناوب بين المجموعات ويعلّق على الأخطاء الشائعة بعد كل سؤال. تتشاور كل مجموعة وتجيب في دورها خلال 30 ثانية (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والواجب: يطرح المعلم سؤال مستوى التطبيق من التقويم الختامي شفهيًا ويحدد الواجب: إكمال تمارين 5-3أ و 5-3ب، ويجيب الطالب فرديًا ويدوّن الواجب في دفتره (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – ثبات الحرفي: تقارن المجموعات إنتاجًا يوميًا افتراضيًا لحرفيي فخار خلال أسبوع، وتحسب الانحراف المعياري لكل منهما لتحدد الأكثر انتظامًا، وتربط ذلك بقيمة الإتقان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ن = 5، مج س = 30، التباين 4. أوجد مج س².\nالإجابة النموذجية: 200\n2) [مستوى التطبيق] ن = 10، الوسط 6، مج س² = 400. أوجد التباين.\nالإجابة النموذجية: 40 − 36 = 4\n3) [مستوى الاستدلال] أضيفت قيمة تساوي الوسط إلى البيانات. هل يزيد التباين أم ينقص؟\nالإجابة النموذجية: ينقص؛ لأن مجموع مربعات الانحرافات لا يتغير بينما يزيد عدد القيم ن.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: إذا كان التباين 9 فالانحراف المعياري ___\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ن = 6، مج س = 24، مج س² = 120. أوجد الانحراف المعياري.\nالإجابة النموذجية: التباين 20 − 16 = 4، الانحراف 2\n3) [مستوى الاستدلال] ن = 4، الوسط 5، التباين 2.5. أوجد مج س².\nالإجابة النموذجية: 4 × (2.5 + 25) = 110", "للطالب: إكمال تمارين 5-3أ و 5-3ب (كتاب الطالب ص169–178، كتاب النشاط ص93–94).\nلولي الأمر: حث الابن/الابنة على تلخيص ما تعلّمه اليوم في 3 أسطر وعرضه عليكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=21"]}]}, {"id": "5-4", "title": "خصائص مقاييس التشتت", "p": [{"ax": "مزايا وعيوب المدى والمدى الربيعي والانحراف المعياري + أثر إضافة ثابت والضرب في ثابت على مقاييس التشتت", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يذكر مزايا كل مقياس من مقاييس التشتت وعيوبه (10 دقائق)\n2) يقارن بين المقاييس الثلاثة في جدول منظم (10 دقائق)\n3) يبين أن إضافة ثابت لا تغير المدى والمدى الربيعي والانحراف المعياري (5 دقائق)\n4) يبين أن الضرب في ثابت أ يضرب المدى والانحراف في |أ| والتباين في أ² (5 دقائق)\n\nمخرج تعليمي آخر:\nيحكم على صلاحية مقياس في موقف معين (5 دقائق)\nيطبق الخصائص لحساب مقاييس بيانات محولة (5 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: فهم\nالمخرج الآخر: تقييم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التشاركي\n- التعلم الذاتي\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "المدى، المدى الربيعي، الانحراف المعياري، الحساسية للقيم المتطرفة، استخدام جميع القيم.، الإزاحة، التكبير، التحويل الخطي، ثبات التشتت عند الإزاحة.", "يعرض المعلم بيانات 4، 5، 5، 6، 30 ويطلب المدى والمدى الربيعي بسرعة، ويحسب الطالب: المدى 26، المدى الربيعي (ر1 = 4.5، ر3 = 18) = 13.5، ويلاحظ أثر 30. (5 دقائق)", "1. اكتشاف: يوزع المعلم نشاط «استكشف 3» ص179 لمقارنة أثر تغيير قيمة واحدة على المقاييس الثلاثة، ويحسب الطالب ويسجل التغيرات (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. نقاش موجّه: يستخلص المعلم: المدى سهل لكنه يعتمد على قيمتين فقط؛ المدى الربيعي لا يتأثر بالمتطرفة؛ الانحراف المعياري يستخدم كل القيم لكنه يتأثر بالمتطرفة (المثال 19)، ويكمل الطالب جدول المقارنة (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. اكتشاف: يعطي المعلم 2، 4، 6 (الانحراف ≈ 1.63) ويطلب الحساب بعد إضافة 10 وبعد الضرب في 3، ويلاحظ الطالب: الإضافة لا تغير الانحراف، والضرب يضاعفه 3 مرات (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تعميم: يعمم المعلم: إذا ص = أس + ب فإن انحراف ص = |أ| × انحراف س، وتباين ص = أ² × تباين س (المثال 20)، ويطبق الطالب على تحويل الحرارة: انحراف 2° م ← 3.6° ف (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: الأسئلة 3–5، وكتاب النشاط ص95، ويشارك الطالب في التلخيص ويدوّن الواجب (1 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اذكر عيبًا للمدى.\nالإجابة النموذجية: يعتمد على أكبر وأصغر قيمة فقط ويتأثر بالقيم المتطرفة.\n2) [مستوى التطبيق] اذكر ميزة للانحراف المعياري.\nالإجابة النموذجية: يستخدم جميع القيم.\n3) [مستوى الاستدلال] أي المقاييس أنسب لبيانات فيها قيمة متطرفة؟\nالإجابة النموذجية: المدى الربيعي\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] انحراف مجموعة 4، أضيف 7 لكل قيمة. الانحراف الجديد؟\nالإجابة النموذجية: 4\n5) [مستوى التطبيق] تباين مجموعة 9، ضربت القيم في 2. التباين الجديد؟\nالإجابة النموذجية: 36\n6) [مستوى الاستدلال] مدى مجموعة 10، ضربت القيم في 3 ثم أضيف 1. المدى الجديد؟\nالإجابة النموذجية: 30", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: المقياس الذي يستخدم جميع القيم هو ___\nالإجابة النموذجية: الانحراف المعياري\n2) [مستوى التطبيق] بيانات 10، 11، 12، 13، 50. أي مقياس تشتت أنسب؟ ولماذا؟\nالإجابة النموذجية: المدى الربيعي لوجود القيمة المتطرفة 50.\n3) [مستوى الاستدلال] لماذا يُقرن الانحراف المعياري بالوسط والمدى الربيعي بالوسيط؟\nالإجابة النموذجية: لأن الانحراف يحسب حول الوسط، والربيعيات تعتمد على الترتيب مثل الوسيط.\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أكمل: عند ضرب القيم في 5 يُضرب التباين في ___\nالإجابة النموذجية: 25\n5) [مستوى التطبيق] انحراف درجات حرارة 2° م. ما الانحراف بالفهرنهايت؟\nالإجابة النموذجية: 1.8 × 2 = 3.6\n6) [مستوى الاستدلال] مدى ربيعي 6، ضربت القيم في 0.5 ثم طرح 2. المدى الربيعي الجديد؟\nالإجابة النموذجية: 3", "للطالب: تمارين 5-4: السؤالان 1 و 2 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: متابعة إنجاز الواجب في موعده وتشجيع ابنه/ابنته على كتابة خطوات الحل كاملة في «مزايا وعيوب المدى والمدى الربيعي والانحراف المعياري».\nللطالب: تمارين 5-4: الأسئلة 3–5، وكتاب النشاط ص95 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: الاطلاع على دفتر الواجب ومناقشة الابن/الابنة في فكرة «أثر إضافة ثابت والضرب في ثابت على مقاييس التشتت» بسؤال واحد بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}, {"ax": "اختيار مقياس التشتت المناسب للسياق", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يختار مقياس تشتت مناسبًا لبيانات حياتية ويبرر (5 دقائق)\n2) يقرن مقياس التشتت بمقياس النزعة المركزية المناسب (15 دقيقة)\n\nمخرج تعليمي آخر: يكتب وصفًا إحصائيًا متكاملًا لمجموعة بيانات (20 دقيقة)", "المخرج 1: تقييم\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات", "الوصف الإحصائي، الاقتران بين المقاييس، السياق الحياتي.", "يسأل المعلم: لوصف أعمار سكان حي فيه دار للمسنين، أي مقياسين تختار؟ ويقترح الطالب الوسيط والمدى الربيعي. (5 دقائق)", "1. تعلم تعاوني: يوزع المعلم 4 مجموعات بيانات حياتية ويطلب من كل مجموعة وصفًا إحصائيًا كاملًا (نزعة + تشتت)، وتكتب المجموعة الوصف وتبرر الاختيار (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n2. عرض ونقاش: تعرض المجموعات أوصافها ويقدم المعلم تغذية راجعة، وتعرض وتجيب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم الفكرة الرئيسة للحصة مع الطلبة ويحدد الواجب: تمارين 5-4: الأسئلة 6–7، وكتاب النشاط ص96، ويشارك الطالب في التلخيص ويدوّن الواجب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بيانات متقاربة بلا قيم متطرفة. أي زوج مقاييس؟\nالإجابة النموذجية: الوسط والانحراف المعياري\n2) [مستوى التطبيق] بيانات فيها قيم متطرفة. أي زوج مقاييس؟\nالإجابة النموذجية: الوسيط والمدى الربيعي\n3) [مستوى الاستدلال] اكتب وصفًا للبيانات: الوسط 20، الانحراف 2.\nالإجابة النموذجية: القيم تتمركز حول 20 وأغلبها قريب منها بانتشار صغير.", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أكمل: يُقرن الوسيط عادة بـ ___\nالإجابة النموذجية: المدى الربيعي\n2) [مستوى التطبيق] رواتب فيها راتب مرتفع جدًا. اختر مقياسي نزعة وتشتت.\nالإجابة النموذجية: الوسيط والمدى الربيعي\n3) [مستوى الاستدلال] صف بيانات: الوسيط 15، المدى الربيعي 4، المدى 40.\nالإجابة النموذجية: نصف البيانات الأوسط متقارب حول 15، مع وجود قيم متطرفة جعلت المدى كبيرًا.", "للطالب: تمارين 5-4: الأسئلة 6–7، وكتاب النشاط ص96 (كتاب الطالب ص179–183، ومراجعة الوحدة ص184–185، كتاب النشاط ص95–96، ومراجعة الوحدة ص97).\nلولي الأمر: توفير وقت هادئ للمذاكرة (20 دقيقة تقريبًا) ومراجعة الأمثلة المحلولة في الكتاب حول «اختيار مقياس التشتت المناسب للسياق».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/11/basicmath/?l=22"]}, {"ax": "مقارنة توزيعين باستخدام مقياس نزعة ومقياس تشتت", "wk": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1) يقارن بين توزيعين باستخدام مقياس نزعة مركزية ومقياس تشتت (15 دقيقة)\n2) يكتب استنتاجين مبررين في سياق المسألة (15 دقيقة)\n\nمخرج تعليمي آخر: يحسب المقاييس اللازمة بدقة (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تقييم\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: الآلة الحاسبة العلمية", "مقارنة التوزيعات، الاتساق، المستوى العام، الاستنتاج المبرر.", "يعرض المعلم درجات فريقين في مسابقة رياضيات ويسأل: كيف نقارن عادلًا بين الفريقين؟ ويقترح الطالب مقارنة المستوى والانتشار. (5 دقائق)", "1. النمذجة: ينمذج المعلم مقارنة: الفريق أ (الوسط 72، الانحراف 5)، الفريق ب (الوسط 68، الانحراف 12): «أ أعلى في المتوسط وأكثر اتساقًا»، ويدوّن الطالب صيغة الاستنتاج المزدوج (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلم تعاوني: يوزع المعلم بيانات خام لمجموعتين لتحسب كل مجموعة المقاييس وتكتب استنتاجين، وتحسب المجموعة وتكتب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الختام والواجب: يلخّص المعلم ال  $('mSep').classList.toggle('on',mode=='sep');$('mCom').classList.toggle('on',mode=='com');
 $('now').textContent=mode=='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
 const t=$('tabs');t.innerHTML='';
 if(mode=='sep'){L.p.forEach((P,k)=>{const b=document.createElement('button');b.textContent='الحصة '+(k+1);if(k==pi)b.className='on';b.onclick=()=>{pi=k;draw()};t.appendChild(b)})}
 const m=$('main');m.innerHTML='';
 const meta=document.createElement('div');meta.className='meta';
 meta.textContent=mode=='sep'?('الحصة '+(pi+1)+' من '+L.p.length+' — محور الحصة: '+L.p[pi].ax+' — '+L.p[pi].wk):('الدرس '+L.id+' '+L.title+' — نموذج مدمج لـ '+L.p.length+' حصص');
 m.appendChild(meta);
 F.forEach((fn,fi)=>{const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="ch"><span><small>البند '+(fi+1)+'</small><b></b></span><button class="copy">نسخ</button></div><div class="cb"></div><div class="hint">تعذّر النسخ التلقائي: النص محدد الآن، انسخه يدويًا.</div>';
  c.querySelector('b').textContent=fn;const body=c.querySelector('.cb');body.innerHTML=H(text(fi));
  c.querySelector('.copy').onclick=ev=>copy(text(fi),ev.target,body,c.querySelector('.hint'));m.appendChild(c)});}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(t,btn,body,hint){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
 if(s)ok(btn);else{const r=document.createRange();r.selectNodeContents(body);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);hint.style.display='block';setTimeout(()=>hint.style.display='none',4000)}}
function copy(t,btn,body,hint){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>ok(btn),()=>fallback(t,btn,body,hint))}else fallback(t,btn,body,hint)}
draw();
</script><script src="/assets/qlink.js" defer></script>
</body></html>
