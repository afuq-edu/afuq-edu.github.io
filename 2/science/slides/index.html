  const draw=()=>{ vis.innerHTML=`<div class="scene">${bgSVG('table')}<svg viewBox="0 0 1000 560" direction="ltr" style="position:absolute;inset:0;width:100%;height:100%;direction:ltr"><path d="${P[k]}" stroke="#a855f7" stroke-width="${W[k]}" stroke-linecap="round" fill="none" style="transition:all .7s"/>${k==='twist'?`<path d="${P[k]}" stroke="#f0abfc" stroke-width="10" stroke-dasharray="20 26" fill="none"/>`:''}${k==='press'?'<text x="500" y="230" font-size="90" text-anchor="middle">✋</text>':''}${k==='stretch'?'<text x="80" y="250" font-size="70">🤚</text><text x="850" y="250" font-size="70">🤚</text>':''}</svg></div>`; $('#shr',ctl).textContent=N[k]; };
  draw();

/* ---- 10. Elastic bands with weights (3-3) ---- */
SIM.elastic = (s,b)=>{
  const B=[{n:'شريط رقيق جدًا',w:5,per:2.5,snap:2},{n:'شريط رقيق',w:9,per:2,snap:3},{n:'شريط متوسط',w:15,per:1.6,snap:9},{n:'شريط سميك',w:24,per:.8,snap:9}];
  let bi=2, wt=0; const base=3;
  const [vis,ctl]=simShell(b,'',`${B.map((x,i)=>`<button class="ctlbtn ${i===2?'on':''}" data-b="${i}"><span style="display:inline-block;width:60px;height:${x.w}px;background:#f59e0b;border-radius:9px"></span>${x.n}</button>`).join('')}<div style="display:flex;gap:6px"><button class="gbtn" id="ew" style="flex:1">➕ أضف ثقلًا 🎒</button><button class="gbtn alt" id="ez">↺</button></div><div class="readout" id="er"></div><div class="safety" style="font-size:16px">⚠️ احمِ عينيك؛ قد يطير الشريط المرن فجأة. أبعد قدميك عن الثقل المعلّق.</div>`, s.q||'أيّ الشرائط المرنة سيتمدد أكثر؟ (نقيس بالطوب)');
  const draw=()=>{ const x=B[bi]; const snapped = wt>=x.snap; const len = snapped? base : base + x.per*wt; const px=len*44;
    vis.innerHTML=`<div class="scene">${bgSVG('lab')}<svg viewBox="0 0 1000 560" direction="ltr" style="position:absolute;inset:0;width:100%;height:100%;direction:ltr"><rect x="150" y="40" width="700" height="22" rx="8" fill="#92400e"/>
      <g transform="translate(330 0)">${Array.from({length:11},(_,i)=>`<rect x="0" y="${62+i*44}" width="54" height="42" rx="5" fill="${['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6'][i%5]}" stroke="#fff" stroke-width="3"/><text x="27" y="${62+i*44+30}" font-size="22" text-anchor="middle" fill="#fff" font-weight="800">${toAr(i+1)}</text>`).join('')}</g>
      ${snapped?`<path d="M500 62 Q 520 90 505 120" stroke="#f59e0b" stroke-width="${x.w}" fill="none" stroke-linecap="round"/><text x="560" y="140" font-size="40">💥</text><text x="520" y="520" font-size="${40+wt*8}">🎒</text><text x="620" y="480" font-size="30" font-weight="800" fill="#e11d48">انقطع الشريط!</text>`
      :`<rect x="${500-x.w/2}" y="62" width="${x.w}" height="${px}" rx="${x.w/2}" fill="#f59e0b" style="transition:all .6s"/>${wt?`<text x="${500}" y="${62+px+52}" font-size="${40+wt*8}" text-anchor="middle">🎒</text>`:''}<line x1="390" y1="${62+px}" x2="${480-x.w/2}" y2="${62+px}" stroke="#e11d48" stroke-width="4" stroke-dasharray="8 6"/>`}
      <text x="700" y="120" font-size="28" font-weight="800" fill="#1f2a44">عدد الأثقال: ${toAr(wt)}</text></svg></div>`;
    $('#er',ctl).innerHTML = snapped ? `💥 انقطع ${x.n}!<br>لا نستخدمه لرفع الأشياء الثقيلة.` : `الطول بدون الثقل: ${toAr(base)} طوبة<br>الطول مع الثقل: ${toAr(+(len).toFixed(1))} طوبة<br>التمدّد = ${toAr(+(len-base).toFixed(1))} طوبة`; };
  draw();
  $$('[data-b]',ctl).forEach(x=>x.onclick=()=>{ bi=+x.dataset.b; wt=0; $$('[data-b]',ctl).forEach(y=>y.classList.toggle('on',y===x)); draw(); SND.play('click'); });
  $('#ew',ctl).onclick=()=>{ if(wt>=B[bi].snap) return; wt++; draw(); SND.play(wt>=B[bi].snap?'snap':'stretch'); };
  $('#ez',ctl).onclick=()=>{ wt=0; draw(); };
};

/* ---- 11. Paper plane launcher (3-6 review) ---- */
SIM.plane = (s,b)=>{
  const B=[{n:'شريط رقيق جدًا',d:2,w:5},{n:'شريط رقيق',d:4,w:9},{n:'شريط سميك',d:6,w:18},{n:'خيط بدل الشريط',d:0,w:2}];

    if(!res.includes(+x.dataset.b)){ res.push(+x.dataset.b); $('#pt',ctl).insertAdjacentHTML('beforeend',`<tr><td>${it.n}</td><td>${toAr(it.d)}</td></tr>`);} });
};

/* ---- 12. Heating & cooling (3-4) ---- */
SIM.heatcool = (s,b)=>{
  const M = s.items || [
    {n:'الشوكولاتة',st:[{e:'🍫',t:'صلبة'},{e:'🟤💧',t:'منصهرة (سائلة)'}],heat:1,cool:0,d:['عند التسخين تنصهر الشوكولاتة وتصبح سائلة.','عند التبريد تتصلّب الشوكولاتة من جديد.']},
    {n:'الزبدة',st:[{e:'🧈',t:'صلبة'},{e:'🟡💧',t:'منصهرة (سائلة)'}],heat:1,cool:0,d:['عند التسخين تنصهر الزبدة.','عند التبريد تتصلّب الزبدة.']},
    {n:'الماء والثلج',st:[{e:'🧊',t:'ثلج (صلب)'},{e:'💧',t:'ماء (سائل)'},{e:'♨️',t:'بخار'}],start:1,heat:1,cool:-1,d:['عند تسخين الثلج ينصهر ويصبح ماءً، والماء يغلي فيتصاعد البخار.','عند وضع الماء في الثلاجة (المجمّد) يتحول إلى ثلج.']},
    {n:'شمع الشمعة',st:[{e:'🕯️',t:'شمع صلب'},{e:'🫗',t:'شمع سائل'}],heat:1,cool:0,d:['الفتيل الساخن يصهر الشمع فيصبح سائلًا.','عندما يبرد الشمع السائل يعود صلبًا.']},
    {n:'البيضة',st:[{e:'🥚',t:'نيئة'},{e:'🍳',t:'مطبوخة'}],heat:1,cool:null,d:['عند التسخين يتغيّر بياض البيضة ويصبح أبيض صلبًا.','التبريد لا يعيد البيضة المطبوخة نيئة!']},
    {n:'الخبز',st:[{e:'🍞',t:'خبز طري'},{e:'🟫',t:'خبز محمّص'}],heat:1,cool:null,d:['عند التسخين في المحمصة يتحمّص الخبز ويصبح مقرمشًا.','التبريد لا يعيده طريًا.']}];
  let mi=0, si=0, temp=.5;
  const [vis,ctl]=simShell(b,'',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${M.map((m,i)=>`<button class="ctlbtn ${i?'':'on'}" data-m="${i}" style="font-size:17px;padding:6px 8px"><span class="e" style="font-size:28px">${m.st[m.start||0].e.slice(0,2)}</span>${m.n}</button>`).join('')}</div><div style="display:flex;gap:6px"><button class="gbtn" id="hh" style="flex:1;background:#ef4444">🔥 سخّن</button><button class="gbtn" id="hc" style="flex:1;background:#3b82f6">❄️ برّد</button></div><div class="readout" id="hr">اختر مادة ثم سخّنها أو برّدها.</div>`, s.q||'ماذا يحدث للمواد عند تسخينها أو تبريدها؟');
  const draw=(fx)=>{ const m=M[mi], cur=m.st[si];
    vis.innerHTML=`<div class="scene">${bgSVG('kitchen')}<div class="it" style="left:12%;top:50%;width:90px;height:300px">${V.thermo({level:temp})}</div><div class="it" style="left:55%;top:52%;font-size:190px;transition:all .6s">${cur.e}</div><div class="it" style="left:55%;top:16%"><span class="lb" style="font-size:30px">${m.n}: ${cur.t}</span></div>${fx==='h'?`<div class="it a-pulse" style="left:55%;top:86%;font-size:80px">🔥🔥🔥</div>`:''}${fx==='c'?`<div class="it a-bob" style="left:55%;top:86%;font-size:70px">❄️🧊❄️</div>`:''}</div>`; };
  draw();
  $$('[data-m]',ctl).forEach(x=>x.onclick=()=>{ mi=+x.dataset.m; si=M[mi].start||0; temp=.5; $$('[data-m]',ctl).forEach(y=>y.classList.toggle('on',y===x)); draw(); SND.play('click'); $('#hr',ctl).textContent='توقّع: ماذا سيحدث عند التسخين؟'; });
  $('#hh',ctl).onclick=()=>{ const m=M[mi]; temp=Math.min(1,temp+.3); if(si<m.st.length-1) si++; SND.play('sizzle'); draw('h'); $('#hr',ctl).innerHTML='🔥 '+m.d[0]; };
  $('#hc',ctl).onclick=()=>{ const m=M[mi]; temp=Math.max(0,temp-.3); if(m.cool===null){ SND.play('freeze'); draw('c'); $('#hr',ctl).innerHTML='❄️ '+m.d[1]; return; } if(si>0) si--; SND.play('freeze'); draw('c'); $('#hr',ctl).innerHTML='❄️ '+m.d[1]; };
};

/* ---- 13. Dissolving (3-5) ---- */
SIM.dissolve = (s,b)=>{
  const M = {salt:{n:'ملح',e:'🧂',c:'#fff',dis:true},sugar:{n:'سكر',e:'🍬',c:'#fff',dis:true},sand:{n:'رمل',e:'🏖️',c:'#d6b88a',dis:false,sink:true},flour:{n:'طحين',e:'🌾',c:'#f5f5f4',dis:false,cloud:true},rice:{n:'أرز',e:'🍚',c:'#fafaf9',dis:false,sink:true}};
  const TEMPS=[{n:'بارد جدًا',t:50,c:'#bfdbfe'},{n:'بارد',t:40,c:'#dbeafe'},{n:'دافئ',t:35,c:'#fde68a'},{n:'ساخن',t:20,c:'#fca5a5'}];
  let m='salt', st=0, ti=1, run=null;
  const [vis,ctl]=simShell(b,'',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${Object.entries(M).map(([k,v],i)=>`<button class="ctlbtn ${i?'':'on'}" data-m="${k}" style="padding:6px 8px"><span class="e" style="font-size:28px">${v.e}</span>${v.n}</button>`).join('')}</div>${s.temps!==false?`<div class="sm" style="font-weight:800">🌡️ حرارة الماء:</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${TEMPS.map((t,i)=>`<button class="tbtn ${i===1?'on':''}" data-t="${i}" style="font-size:16px">${t.n}</button>`).join('')}</div>`:''}<div style="display:flex;gap:6px"><button class="gbtn" id="da" style="flex:1">🥄 أضف</button><button class="gbtn" id="ds" style="flex:1">🌀 حرّك</button></div><div class="readout" id="dr">توقّع أولًا: هل ستذوب المادة في الماء؟</div>`, s.q||'نشاط ٣-٥: إذابة المواد في الماء');
  const draw=(p=0)=>{ const v=M[m], T=TEMPS[ti]; let inner='';
    const r=rnd(5);
    if(st>=1){ if(v.dis){ const n=Math.round(40*(1-p)); for(let i=0;i<n;i++) inner+=`<rect x="${330+r()*340}" y="${st===1?470+r()*10:260+r()*210}" width="7" height="7" fill="#fff" stroke="#94a3b8"/>`; }
      else if(v.sink){ for(let i=0;i<50;i++) inner+=`<ellipse cx="${330+r()*340}" cy="${470+r()*14}" rx="${m==='rice'?9:5}" ry="${m==='rice'?4:4}" fill="${v.c}" stroke="#a8a29e"/>`; }
      else if(v.cloud){ inner+=`<rect x="306" y="180" width="388" height="304" fill="#f5f5f4" opacity="${st===2?.85:.4}"/>`; for(let i=0;i<30;i++) inner+=`<circle cx="${330+r()*340}" cy="${468+r()*12}" r="5" fill="#fff"/>`; } }
    vis.innerHTML=`<div class="scene">${bgSVG('lab')}<svg viewBox="0 0 1000 560" direction="ltr" style="position:absolute;inset:0;width:100%;height:100%;direction:ltr"><path d="M300 150 L300 470 Q300 490 320 490 L680 490 Q700 490 700 470 L700 150" fill="none" stroke="#475569" stroke-width="8"/><rect x="306" y="180" width="388" height="304" fill="${T.c}" opacity=".55"/>${inner}${st===2?`<path d="M500 120 L520 420" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="-12 510 120;12 510 120;-12 510 120" dur=".6s" repeatCount="indefinite"/></path>`:''}<text x="500" y="540" font-size="28" text-anchor="middle" font-weight="800" fill="#1f2a44">${s.temps===false?'ماء':'ماء '+T.n}</text></svg></div>`; };
  draw();
  const stop=()=>{ clearInterval(run); run=null; };
  $$('[data-m]',ctl).forEach(x=>x.onclick=()=>{ stop(); m=x.dataset.m; st=0; $$('[data-m]',ctl).forEach(y=>y.classList.toggle('on',y===x)); draw(); SND.play('click'); $('#dr',ctl).textContent='توقّع: هل سيذوب '+M[m].n+' في الماء؟'; });
  $$('[data-t]',ctl).forEach(x=>x.onclick=()=>{ stop(); ti=+x.dataset.t; st=0; $$('[data-t]',ctl).forEach(y=>y.classList.toggle('on',y===x)); draw(); });
  $('#da',ctl).onclick=()=>{ stop(); st=1; draw(); SND.play('splash'); $('#dr',ctl).textContent='أضفنا ملعقة من '+M[m].n+'… الآن حرّك!'; };
  $('#ds',ctl).onclick=()=>{ if(st<1||run) return; st=2; const v=M[m], T=TEMPS[ti]; let sec=0; SND.play('stir');
    run=setInterval(()=>{ sec++; const p=Math.min(1,sec/T.t); draw(v.dis?p:0); $('#dr',ctl).innerHTML=`⏱️ ${toAr(sec)} ثانية`; if(sec%6===0) SND.play('stir');
      if(v.dis&&p>=1 || !v.dis&&sec>=8){ stop(); st=v.dis?3:2; if(!v.dis){ st=1; draw(); } SND.play(v.dis?'ok':'bad');
        $('#dr',ctl).innerHTML = v.dis ? `✅ <b style="color:#fde047">${v.n} يذوب في الماء</b> – اختفى في الماء خلال ${toAr(T.t)} ثانية${s.temps===false?'':' (ماء '+T.n+')'}.` : `❌ <b style="color:#fca5a5">${v.n} لا يذوب في الماء</b> – ${v.cloud?'يعكّر الماء ثم يترسّب':'يبقى ويترسّب في القاع'}.`; } }, 120);
    onLeave(stop); };
};

/* ---- 14. Salt pans (3-5) ---- */

    vis.innerHTML=`<div class="scene">${bgSVG('desert')}<svg viewBox="0 0 1000 560" direction="ltr" style="position:absolute;inset:0;width:100%;height:100%;direction:ltr"><rect x="190" y="340" width="620" height="110" rx="10" fill="#d6c6a5" stroke="#a16207" stroke-width="8"/><rect x="200" y="${440-90*lv}" width="600" height="${90*lv}" fill="#7dd3fc" opacity=".8"/>${salt}${lv<1?Array.from({length:6},(_,i)=>`<path d="M${260+i*90} 330 q 10 -20 0 -40 q -10 -20 0 -40" stroke="#fff" stroke-width="5" fill="none" opacity=".7"><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -60" dur="1.5s" repeatCount="indefinite"/></path>`).join(''):''}<g transform="translate(860 470)"><path d="M-40 0 L-30 -70 L30 -70 L40 0Z" fill="#a16207"/><text x="0" y="-25" font-size="22" text-anchor="middle" fill="#fff" font-weight="800">ملح</text></g></svg></div>`; };
  draw();

  $('#sr0',ctl).onclick=()=>{ clearInterval(run); run=null; lv=1; draw(); SND.play('splash'); $('#sr',ctl).textContent='بركة ممتلئة بمياه البحر المالحة.'; };
};

/* ---- 15. Tally chart of minibeast legs (skills) ---- */
SIM.tally = (s,b)=>{
  const A=[{e:'🕷️',n:'عنكبوت',l:8},{e:'🕷️',n:'عنكبوت',l:8},{e:'🪲',n:'خنفساء',l:6},{e:'🪲',n:'خنفساء',l:6},{e:'🐞',n:'دعسوقة',l:6},{e:'🐜',n:'نملة',l:6},{e:'🐜',n:'نملة',l:6},{e:'🪱',n:'دودة',l:0},{e:'🐌',n:'حلزون',l:0}];

/* ---- 16. Habitat compare: two places tally (1-1) ---- */
SIM.compare = (s,b)=>{
  const P=[{n:'مكان رطب',bg:'pond',items:['🌿','🌱','🌳','🍄','🐸','🐌','🪲','🐜','🦗','🪱','🐞','🌾']},{n:'مكان جاف',bg:'desert',items:['🌵','🦎','🐜','🪨','🦂']}];
  const seen=[new Set(),new Set()]; let pi=0;
  const [vis,ctl]=simShell(b,'',`<div style="display:flex;gap:6px">${P.map((p,i)=>`<button class="ctlbtn ${i?'':'on'}" data-p="${i}" style="flex:1">${p.n}</button>`).join('')}</div><div class="readout" id="cr"></div><table class="tbl"><tr><th>المكان</th><th>نباتات</th><th>حيوانات</th></tr>${P.map((p,i)=>`<tr><td>${p.n}</td><td id="cp${i}">٠</td><td id="ca${i}">٠</td></tr>`).join('')}</table><div class="card sm" style="padding:10px">📏 نقيس مساحتين <b class="hl">متماثلتين</b> بالشريط المتري، ثم نسجّل ما نجده.</div>`, s.q||'نشاط ١-١: قارن بين مكانين مختلفين');
  const plants=['🌿','🌱','🌳','🍄','🌾','🌵'];
  const draw=()=>{ const p=P[pi]; const r=rnd(pi+3); vis.innerHTML=`<div class="scene">${bgSVG(p.bg)}<div style="position:absolute;left:10%;right:10%;top:30%;bottom:8%;border:6px dashed #fff;border-radius:16px"></div>${p.items.map((e,i)=>`<div class="it click ${seen[pi].has(i)?'found':''}" data-i="${i}" style="left:${16+r()*68}%;top:${40+r()*46}%;font-size:${44+r()*20}px">${e}</div>`).join('')}</div>`;
    $$('[data-i]',vis).forEach(x=>x.onclick=()=>{ const i=+x.dataset.i; if(seen[pi].has(i)) return; seen[pi].add(i); x.classList.add('found'); SND.play('pop'); upd(); });
    upd(); };
  const upd=()=>{ P.forEach((p,i)=>{ const arr=[...seen[i]].map(k=>p.items[k]); $('#cp'+i,ctl).textContent=toAr(arr.filter(e=>plants.includes(e)).length); $('#ca'+i,ctl).textContent=toAr(arr.filter(e=>!plants.includes(e)&&e!=='🪨').length); });
    $('#cr',ctl).innerHTML=`ابحث في ${P[pi].n} واضغط على كل كائن حي تجده.`; if(seen[0].size>=P[0].items.length-1&&seen[1].size>=P[1].items.length-1) $('#cr',ctl).innerHTML='✅ المكان الرطب فيه <b style="color:#fde047">كائنات حية أكثر</b> من المكان الجاف.'; };
  draw();
  $$('[data-p]',ctl).forEach(x=>x.onclick=()=>{ pi=+x.dataset.p; $$('[data-p]',ctl).forEach(y=>y.classList.toggle('on',y===x)); draw(); SND.play('click'); });
};

};

    {type:'explain', sec:'present', t:'التبريد: من سائل إلى صلب ❄️',

      note:'• صورة كتاب التلميذ ص ٤٣ (يد تضع قالب مكعّبات الماء في المجمّد بجانب كيس البازلاء).\n• أخرج صينية الثلج التي جمّدتها أمس، ودع التلاميذ يقارنون: ماء سائل ⬅️ ثلج صلب.\n• مثال عُماني: نجمّد قناني الماء قبل الرحلة إلى الشاطئ أو الوادي في الصيف.\n• اسأل: ماذا يحدث للثلج إذا تركناه في الشمس؟ (ينصهر ويعود ماءً).', ans:'السائل يتحوّل إلى صلب بالتبريد؛ الماء يصبح ثلجًا.'},

    {type:'flip', sec:'present', t:'مفردات للتعلّم (٢) ❄️🔥', cols:5,
      cards:[{w:'الثَّلْجُ',e:'🧊',d:'الجليد الذي يتساقط على شكل رقائق بيضاء ولينة، ونسمّي الماء المتجمّد ثلجًا.'},{w:'الجَليدُ',e:'🏔️',d:'الماء عندما يكون في الحالة الصلبة.'},{w:'التَّسْخينُ',e:'🔥',d:'جعل الشيء ساخنًا.'},{w:'التَّبْريدُ',e:'❄️',d:'جعل الشيء باردًا.'},{w:'الانْصِهارُ',e:'🍫',d:'التغيّر من الحالة الصلبة إلى الحالة السائلة.'}],

      steps:['قم بتغليف قطعة من **الشوكولاتة**، ثم ضع القطعة في قبضة يدك لمدة **دقيقتين**. ماذا تلاحظ؟','هل يحدث فرق إذا أبقيتها في يدك لمدة أطول؟','أعد التجربة مستخدمًا أنواعًا أخرى من الأطعمة، ثم قارن ما يحدث لهذه الأطعمة.','هل يوجد **نمط** معيّن؟'],

      note:'• صورة كتاب التلميذ ص ٤٥: بنتان؛ إحداهما تضع ملعقة ملح في كأس ماء، وعلى الطاولة: أرز، بسكويت، سكر، طحين، بودرة.\n• وزّع ورقة العمل ٣-٥ أ (كمية الملح، كمية الماء، التوقّع بالرسم، ثم ما حدث بالفعل) و٣-٥ ب (الملح، السكر، مكعبات الجيلاتين، الطحين، الأرز، بودرة التلك).\n• العدالة: نفس الملعقة (مستوية)، ونفس كمية الماء، ونفس عدد مرات التحريك.\n• إثراء: عُدّ الملاعق حتى لا يذوب الملح بعد ذلك (يتجمّع في القاع).', ans:'الملح يختفي في الماء عند التحريك = يذوب. يمكن إذابة المزيد، لكن بعد عدد من الملاعق يتوقّف عن الذوبان ويبقى في القاع. السكر يذوب؛ الرمل والأرز والطحين والتلك لا تذوب.'},
