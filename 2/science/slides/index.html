<!doctype html>
<html lang="ar" dir="rtl">
<head><script>(function(){var k='ofuq-g2s-unlock-slides';function g(n,x){try{return window[n].getItem(x)==='1'}catch(e){return false}}if(g('localStorage',k)||g('sessionStorage',k)||g('localStorage','afuq-all')||g('sessionStorage','afuq-all'))return;document.documentElement.style.display='none';location.replace('../?lock=slides')})()</script><script src="/assets/pkgmode.js" data-role="page"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مستكشف العلوم ٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e9f6ff;--bg2:#fff7e6;--ink:#1f2a44;--muted:#5b6b86;--card:#ffffff;--line:#e3e9f3;
  --warm:#f59e0b;--present:#3b82f6;--activity:#10b981;--assess:#8b5cf6;--close:#ec4899;
  --u1:#0ea5a4;--u2:#d97706;--u3:#7c3aed;--ok:#16a34a;--bad:#e11d48;--hl:#ea580c;
  --acc:#0ea5a4;
  --shadow:0 10px 30px rgba(31,42,68,.12);--shadow-s:0 4px 12px rgba(31,42,68,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:"Tajawal","Baloo Bhaijaan 2",system-ui,sans-serif;direction:rtl}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hd{font-family:"Baloo Bhaijaan 2","Tajawal",sans-serif}
b.hl{color:var(--hl);font-weight:800}
.hidden{display:none!important}

/* ---------- HOME ---------- */
#home{position:fixed;inset:0;overflow:auto;padding:22px 16px 60px}
.home-wrap{max-width:1180px;margin:0 auto}
.hero{display:flex;align-items:center;gap:22px;background:#fff;border-radius:28px;padding:22px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#fde68a,transparent 70%)}
.hero h1{margin:0;font-size:clamp(26px,4vw,44px);line-height:1.15}
.hero h1 span{color:var(--acc)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:clamp(14px,1.8vw,18px)}
.hero .bot{width:120px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#f1f5fb;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chip.ph{color:#fff}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;margin-top:20px}
.unit{background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.unit-h{padding:16px 20px;color:#fff;display:flex;align-items:center;gap:12px}
.unit-h .n{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:26px;font-weight:800}
.unit-h h2{margin:0;font-size:22px}
.unit-h small{opacity:.9}
.lessons{padding:10px;display:grid;gap:8px}
.lbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#f7f9fd;text-align:right;transition:.2s;border:2px solid transparent;width:100%}
.lbtn:hover{transform:translateY(-2px);border-color:var(--c);background:#fff;box-shadow:var(--shadow-s)}
.lbtn .ic{font-size:30px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-s);flex:none}
.lbtn .tt{flex:1}
.lbtn .tt b{display:block;font-size:17px}
.lbtn .tt small{color:var(--muted);font-size:13px}
.lbtn .done{font-size:13px;color:var(--ok);font-weight:700}
.home-foot{margin-top:18px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- PLAYER ---------- */
#player{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.06);z-index:5}
.tbtn{height:40px;min-width:40px;padding:0 10px;border-radius:12px;background:#f1f5fb;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap}
.tbtn:hover{background:#e2e8f3}
.tbtn.on{background:var(--acc);color:#fff}
.ltitle{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}
.phases{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.phases::-webkit-scrollbar{display:none}
.phb{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;background:#f1f5fb;color:var(--muted);white-space:nowrap;transition:.2s}
.phb.cur{color:#fff;transform:scale(1.05)}
.phb.past{opacity:.75}
.stagewrap{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform-origin:center center}
.botbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(255,255,255,.85);box-shadow:0 -2px 10px rgba(0,0,0,.05);z-index:5}
.nav{height:42px;padding:0 18px;border-radius:14px;font-size:17px;font-weight:800;color:#fff;background:var(--acc);display:inline-flex;align-items:center;gap:6px}
.nav.prev{background:#94a3b8}
.nav:disabled{opacity:.35}
.prog{flex:1;height:10px;border-radius:9px;background:#e8eef7;overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 0 0 auto;background:linear-gradient(90deg,var(--acc),#38bdf8);border-radius:9px;transition:width .35s}
.cnt{font-weight:800;color:var(--muted);min-width:64px;text-align:center}
@media (max-width:760px){.ltitle{display:none}.phb{padding:5px 8px;font-size:12px}.nav{padding:0 12px}.tbtn .lbl{display:none}}

/* ---------- SLIDE ---------- */
.slide{position:absolute;inset:0;padding:22px 34px 24px;display:flex;flex-direction:column;animation:sIn .45s ease both}
@keyframes sIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.shead{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex:none}
.ptag{padding:6px 16px;border-radius:999px;color:#fff;font-weight:800;font-size:18px;display:inline-flex;gap:6px;align-items:center;box-shadow:var(--shadow-s)}
.stitle{font-size:38px;font-weight:800;margin:0;line-height:1.15}
.sbody{flex:1;min-height:0;position:relative}
.card{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:22px 26px}
.big{font-size:30px;line-height:1.75}
.mid{font-size:25px;line-height:1.7}
.sm{font-size:20px;line-height:1.6}
.row{display:flex;gap:22px;height:100%}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.center{display:flex;align-items:center;justify-content:center}
.fill{height:100%}
.qtext{font-size:32px;font-weight:800;line-height:1.5}
.note-pill{display:inline-block;background:#fff7ed;color:#9a3412;border:2px dashed #fdba74;border-radius:14px;padding:6px 14px;font-size:20px}

/* cover */
.cover{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;height:100%}
.cover>.col{overflow:auto;min-height:0}
.vchips.many .vchip{font-size:16px;padding:3px 10px}
.cover .hero2{border-radius:30px;color:#fff;padding:30px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.cover .hero2 .un{font-size:22px;opacity:.95;font-weight:700}
.cover .hero2 h1{font-size:62px;margin:6px 0;line-height:1.15}
.cover .hero2 .pg{font-size:18px;background:rgba(255,255,255,.2);border-radius:14px;padding:8px 14px;display:inline-block}
.cover .hero2 .bigemo{position:absolute;left:24px;bottom:16px;font-size:130px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
.obj li{font-size:24px;line-height:1.55;margin:6px 0}
.obj{margin:6px 0 0;padding:0 22px 0 0}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412;padding:5px 13px;border-radius:999px;font-size:20px;font-weight:700}

/* reveal points */
.pts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.pts li{font-size:25px;line-height:1.6;background:#f7f9fd;border-radius:16px;padding:10px 16px;border-inline-start:6px solid var(--acc);transition:.4s}
.pts li.hid{opacity:.0;transform:translateY(10px);pointer-events:none}
.pts.cmp li{font-size:21px;padding:7px 14px}
.pts li.hid{max-height:0;padding-top:0;padding-bottom:0;margin:0;overflow:hidden}
.pts li{max-height:200px}
.revbtn{align-self:flex-start;background:var(--acc);color:#fff;font-weight:800;border-radius:14px;padding:8px 18px;font-size:20px;box-shadow:var(--shadow-s)}

/* visuals */
.vis{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.scene{position:absolute;inset:0}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1;text-align:center;user-select:none;transition:transform .25s}
.it .lb{display:block;font-size:17px;font-weight:800;background:rgba(255,255,255,.92);border-radius:10px;padding:2px 8px;margin-top:4px;white-space:nowrap;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.it.click{cursor:pointer}
.it.click:hover{transform:translate(-50%,-50%) scale(1.12)}
.it.found{filter:drop-shadow(0 0 10px #22c55e)}
.it.found:after{content:"✔";position:absolute;top:-10px;right:-10px;background:#16a34a;color:#fff;border-radius:50%;width:28px;height:28px;font-size:18px;display:grid;place-items:center}
.bubble{position:absolute;max-width:360px;background:#fff;border-radius:16px;padding:10px 14px;font-size:20px;line-height:1.5;box-shadow:var(--shadow);z-index:20;border:3px solid var(--acc);animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pcards{display:grid;gap:14px;height:100%}
.pcard{background:#fff;border-radius:20px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;overflow:hidden;position:relative}
.pcard .pe{font-size:64px;line-height:1.1}
.pcard .pv{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pcard .pv svg{max-width:100%;max-height:100%}
.pcard .pt{font-size:21px;font-weight:800;margin-top:4px}
.pcard .pd{font-size:17px;color:var(--muted);line-height:1.4}
.pcard.click{cursor:pointer}

/* animations */
.a-bob{animation:bob 2.6s ease-in-out infinite}
.a-sway{animation:sway 3s ease-in-out infinite;transform-origin:bottom center}
.a-spin{animation:spin 8s linear infinite}
.a-pulse{animation:pulse 1.6s ease-in-out infinite}
.a-float{animation:floaty 5s ease-in-out infinite}
.a-drift{animation:drift 14s linear infinite}
.a-shake{animation:shake .5s ease-in-out infinite}
.a-swim{animation:swim 6s ease-in-out infinite}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-12px}}
@keyframes sway{0%,100%{rotate:-6deg}50%{rotate:6deg}}
@keyframes spin{to{rotate:360deg}}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.12}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -18px}}
@keyframes drift{from{translate:-40px 0}50%{translate:40px 0}to{translate:-40px 0}}
@keyframes shake{0%,100%{rotate:0}25%{rotate:-8deg}75%{rotate:8deg}}
@keyframes swim{0%,100%{translate:-30px 0}50%{translate:30px 0}}

/* quiz */
.opts{display:grid;gap:14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 18px;font-size:26px;font-weight:700;text-align:right;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-s);transition:.18s}
.opt:hover{border-color:var(--acc);transform:translateY(-2px)}
.opt .k{width:44px;height:44px;border-radius:12px;background:#eef2f9;display:grid;place-items:center;font-size:22px;flex:none}
.opt .oe{font-size:40px}
.opt.ok{border-color:var(--ok);background:#ecfdf5}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:#fff1f2;animation:shake .4s}
.opt.no .k{background:var(--bad);color:#fff}
.fb{margin-top:12px;font-size:23px;line-height:1.6;border-radius:16px;padding:10px 16px;display:none}
.fb.show{display:block;animation:pop .25s}
.fb.good{background:#ecfdf5;color:#065f46;border:2px solid #a7f3d0}
.fb.bad{background:#fff1f2;color:#9f1239;border:2px solid #fecdd3}
.tfrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:var(--shadow-s);font-size:24px}
.tfrow .s{flex:1;line-height:1.5}
.tfb{width:64px;height:54px;border-radius:14px;font-size:28px;background:#f1f5fb}
.tfrow.ok{background:#ecfdf5}.tfrow.no{background:#fff1f2}
.tfrow .why{display:block;font-size:18px;color:var(--muted)}

/* sort */
.sortwrap{display:flex;flex-direction:column;height:100%;gap:14px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:86px;background:#fff;border-radius:20px;padding:10px;box-shadow:var(--shadow-s)}
.tok{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 12px;font-size:22px;font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-s);transition:.15s;touch-action:none}
.tok .te{font-size:36px}
.tok.sel{border-color:var(--acc);transform:scale(1.08);box-shadow:0 0 0 5px rgba(14,165,164,.25)}
.tok.ok{border-color:var(--ok);background:#ecfdf5}
.tok.no{animation:shake .4s;border-color:var(--bad)}
.bins{display:grid;gap:14px;flex:1;min-height:0}
.bin{border-radius:22px;border:4px dashed #cbd5e1;background:rgba(255,255,255,.75);display:flex;flex-direction:column;padding:10px;transition:.2s;min-height:0}
.bin.hot{border-color:var(--acc);background:#f0fdfa}
.bin h4{margin:0 0 8px;font-size:25px;text-align:center}
.bin .bi{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;overflow:auto}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;height:100%;position:relative}
.mcol{display:flex;flex-direction:column;gap:10px;justify-content:center}
.mi{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 14px;font-size:23px;font-weight:700;box-shadow:var(--shadow-s);display:flex;align-items:center;gap:10px;min-height:58px;transition:.15s}
.mi .me{font-size:34px}
.mi.sel{border-color:var(--acc);box-shadow:0 0 0 5px rgba(14,165,164,.25)}
.mi.ok{border-color:var(--ok);background:#ecfdf5;opacity:.85}
.mi.no{animation:shake .4s;border-color:var(--bad)}
svg.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* fill */
.fsent{font-size:28px;line-height:2.2;background:#fff;border-radius:18px;padding:10px 18px;box-shadow:var(--shadow-s)}
.blank{display:inline-block;min-width:150px;border-bottom:4px dashed var(--acc);text-align:center;color:var(--acc);font-weight:800;padding:0 8px;cursor:pointer;border-radius:6px}
.blank.ok{color:var(--ok);border-color:var(--ok);background:#ecfdf5}
.blank.no{animation:shake .4s;color:var(--bad);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#fff7ed;border-radius:18px;padding:10px;border:2px dashed #fdba74}

/* order */
.olist{display:flex;flex-direction:column;gap:10px}
.oitem{background:#fff;border-radius:16px;padding:10px 14px;font-size:23px;box-shadow:var(--shadow-s);display:flex;align-items:center;gap:12px;border:3px solid var(--line)}
.oitem .num{width:42px;height:42px;border-radius:50%;background:#eef2f9;display:grid;place-items:center;font-weight:800;flex:none}
.oitem.ok{border-color:var(--ok)}.oitem.ok .num{background:var(--ok);color:#fff}
.oitem .mv{display:flex;gap:4px}
.oitem .mv button{width:40px;height:36px;border-radius:10px;background:#f1f5fb;font-size:18px}

/* flip cards */
.flips{display:grid;gap:16px;flex:1;min-height:0;height:auto;grid-auto-rows:minmax(0,1fr)}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;box-shadow:var(--shadow)}
.flip .f{background:#fff}
.flip .f .fe{font-size:58px}
.flip .f .fw{font-size:30px;font-weight:800;margin-top:6px}
.flip .b{background:linear-gradient(150deg,var(--acc),#38bdf8);color:#fff;transform:rotateY(180deg);font-size:19px;line-height:1.45;overflow:auto;justify-content:safe center}
.flip .b b{font-size:24px;display:block;margin-bottom:4px}

/* activity */
.act{display:grid;grid-template-columns:330px 1fr;gap:20px;height:100%}
.mat{background:#eff6ff;border-radius:22px;padding:16px 18px;border:3px solid #bfdbfe}
.mat h3{margin:0 0 10px;color:#1d4ed8;font-size:24px}
.mat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mat li{font-size:21px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:6px 10px}
.mat li span{font-size:30px}
.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:9px 14px;font-size:22px;line-height:1.5;box-shadow:var(--shadow-s);cursor:pointer;border:3px solid transparent;transition:.2s}
.step .sn{width:38px;height:38px;border-radius:50%;background:var(--activity);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.step.done{border-color:#a7f3d0;background:#f0fdf4}
.step.done .sn{background:#16a34a}
.step.done .sn:after{content:"✔"}
.step.done .sn span{display:none}
.safety{background:#fef2f2;border:3px solid #fecaca;color:#991b1b;border-radius:16px;padding:8px 14px;font-size:20px;line-height:1.5}
.timerbtn{background:var(--activity);color:#fff;border-radius:14px;padding:8px 14px;font-size:20px;font-weight:800}

/* summary */
.sumwrap{display:grid;grid-template-columns:1fr 330px;gap:22px;height:100%}
.sumcard{background:linear-gradient(160deg,#fff7ed,#fff);border:4px solid #fed7aa;border-radius:28px;padding:22px 26px}
.sumcard h3{margin:0 0 12px;color:#c2410c;font-size:32px}
.sumcard li{font-size:27px;line-height:1.6;margin:8px 0}

/* games common */
.gwrap{height:100%;display:flex;flex-direction:column;gap:12px}
.gbar{display:flex;align-items:center;gap:12px;flex:none}
.gbar .gq{flex:1;font-size:26px;font-weight:800;line-height:1.4}
.score{background:#fff;border-radius:14px;padding:6px 14px;font-size:22px;font-weight:800;box-shadow:var(--shadow-s);white-space:nowrap}
.gbtn{background:var(--acc);color:#fff;font-weight:800;border-radius:16px;padding:10px 22px;font-size:22px;box-shadow:var(--shadow-s)}
.gbtn.alt{background:#64748b}
.garea{flex:1;min-height:0;position:relative;border-radius:24px;overflow:hidden}
.win{position:absolute;inset:0;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;animation:pop .3s;text-align:center;gap:10px}
.win .we{font-size:110px;animation:bob 1.5s infinite}
.win h2{font-size:42px;margin:0}
.win p{font-size:24px;margin:0;color:var(--muted)}
.confetti{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards;z-index:31}
@keyframes fall{to{transform:translateY(780px) rotate(720deg)}}

/* memory */
.mem{display:grid;gap:12px;height:100%}
.mc{perspective:800px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.on .in,.mc.ok .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:var(--shadow-s);text-align:center;padding:6px}
.mc .f{background:linear-gradient(135deg,var(--acc),#38bdf8);color:#fff;font-size:46px}
.mc .b{background:#fff;transform:rotateY(180deg);font-size:22px;font-weight:800;line-height:1.3}
.mc .b .e{font-size:46px}
.mc.ok .b{background:#ecfdf5;outline:4px solid var(--ok)}

/* balloons */
.balloon{position:absolute;width:150px;height:180px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.balloon .bb{width:140px;height:160px;border-radius:50% 50% 48% 48%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;text-align:center;padding:10px;box-shadow:inset -12px -14px 0 rgba(0,0,0,.12),0 6px 12px rgba(0,0,0,.15);position:relative;line-height:1.25}
.balloon .bb .e{font-size:44px}
.balloon .bb:after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:inherit}
.balloon .str{width:2px;height:60px;background:#94a3b8}
.boom{position:absolute;font-size:70px;transform:translate(-50%,-50%);animation:boom .5s forwards;pointer-events:none;z-index:9}
@keyframes boom{to{transform:translate(-50%,-50%) scale(2);opacity:0}}

/* wheel */
.wheelbox{display:grid;grid-template-columns:520px 1fr;gap:24px;height:100%;align-items:center}
.wheel{position:relative;width:500px;height:500px}
.wheel svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.18,1)}
.wheel .ptr{position:absolute;top:-6px;left:50%;margin-left:-22px;width:0;height:0;border:22px solid transparent;border-top:40px solid #e11d48;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));z-index:2}
.wheel .hub{position:absolute;left:50%;top:50%;width:86px;height:86px;margin:-43px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;font-weight:800;cursor:pointer;z-index:2}

/* scramble */
.slots{display:flex;gap:10px;justify-content:center;flex-direction:row}
.slot{width:76px;height:84px;border-radius:16px;background:#fff;border:4px dashed #cbd5e1;display:grid;place-items:center;font-size:44px;font-weight:800}
.slot.f{border-style:solid;border-color:var(--acc)}
.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.let{width:76px;height:84px;border-radius:16px;background:linear-gradient(160deg,#fde68a,#fbbf24);font-size:44px;font-weight:800;box-shadow:0 6px 0 #d97706;transition:.12s}
.let:active{transform:translateY(4px);box-shadow:0 2px 0 #d97706}
.let.used{visibility:hidden}

/* reveal tiles */
.tiles{position:absolute;inset:0;display:grid}
.tile{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;color:#fff;font-size:40px;font-weight:800;transition:opacity .6s,transform .6s}
.tile.gone{opacity:0;transform:scale(.4) rotate(20deg);pointer-events:none}

/* teams */
.teams{display:flex;gap:10px;justify-content:center}
.team{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:var(--shadow-s);font-size:20px;font-weight:800;border:4px solid transparent;display:flex;align-items:center;gap:8px}
.team.cur{border-color:var(--c);transform:scale(1.07)}
.team .sc{font-size:28px;color:var(--c)}

/* catch */
.faller{position:absolute;top:-90px;cursor:pointer;text-align:center;font-size:58px;line-height:1;user-select:none}
.faller .lb{display:block;font-size:17px;font-weight:800;background:#fff;border-radius:10px;padding:2px 6px;box-shadow:var(--shadow-s)}

/* mole */
.holes{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;height:100%;padding:20px}
.hole{position:relative;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 70%,#78350f 0,#92400e 55%,#65a30d 56%);overflow:hidden;cursor:pointer}
.hole .pop{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);transition:bottom .25s;background:#fff;border-radius:18px;padding:6px 12px;font-size:22px;font-weight:800;text-align:center;min-width:120px;box-shadow:var(--shadow-s)}
.hole .pop .e{font-size:40px;display:block}
.hole.up .pop{bottom:18%}

/* climb path */
.climb{position:absolute;inset:0}

/* tools overlays */
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;position:relative}
.panel h3{margin:0 0 12px;font-size:24px}
.panel .x{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:12px;background:#f1f5fb;font-size:20px}
#notes{position:fixed;top:58px;bottom:56px;left:0;width:min(420px,92vw);background:#fffdf5;border-right:4px solid #fde68a;box-shadow:var(--shadow);z-index:40;padding:16px 18px;overflow:auto;transform:translateX(-105%);transition:transform .3s}
#notes.open{transform:none}
#notes h3{margin:0 0 8px;color:#a16207;font-size:21px}
#notes .nb{font-size:17px;line-height:1.75;white-space:pre-line}
#notes .ans{margin-top:10px;background:#ecfdf5;border-radius:12px;padding:8px 12px;font-size:16px;line-height:1.7;white-space:pre-line;color:#065f46}
.bigtimer{font-size:120px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.tgrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.scoreboard{position:fixed;top:66px;right:10px;z-index:30;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:6px}
.sbrow{display:flex;align-items:center;gap:6px;font-weight:800}
.sbrow .nm{min-width:84px;color:#fff;border-radius:10px;padding:4px 8px;font-size:15px}
.sbrow .v{min-width:34px;text-align:center;font-size:20px}
.sbrow button{width:30px;height:30px;border-radius:9px;background:#f1f5fb;font-size:18px}

/* sims */
.simwrap{display:grid;grid-template-columns:1fr 360px;gap:18px;height:100%}
.simctl{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;padding:2px 4px 6px}
.simwrap{min-height:0}
.simwrap>.vis{min-height:0}
.ctlbtn{background:#fff;border:3px solid var(--line);border-radius:16px;padding:9px 12px;font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-s);transition:.15s;text-align:right}
.ctlbtn .e{font-size:32px}
.ctlbtn.on{border-color:var(--acc);background:#f0fdfa}
.ctlbtn:hover{transform:translateY(-2px)}
.readout{background:#0f172a;color:#a7f3d0;border-radius:16px;padding:10px 14px;font-size:22px;line-height:1.6;font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:21px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-s)}
.tbl th{background:var(--acc);color:#fff;padding:8px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center}
input[type=range]{width:100%;accent-color:var(--acc);height:30px}
.discuss{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:100%}
.thinkbox{background:linear-gradient(160deg,#eef2ff,#fff);border:4px solid #c7d2fe;border-radius:28px;padding:22px}
.hintb{background:#fff;border-radius:14px;padding:8px 12px;font-size:21px;margin-top:8px;box-shadow:var(--shadow-s)}
.ans-reveal{margin-top:10px;background:#ecfdf5;border:2px solid #a7f3d0;border-radius:14px;padding:10px 14px;font-size:22px;line-height:1.6;color:#065f46}
.exitgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:100%}
.hw{background:linear-gradient(160deg,#fdf2f8,#fff);border:4px solid #fbcfe8;border-radius:26px;padding:20px}
.hw h3{margin:0 0 8px;color:#be185d;font-size:26px}
.stars{font-size:46px;letter-spacing:6px;cursor:pointer}

</style>
</head>
<body>
<script>

/* ---- vis.js ---- */
/* ================= VISUALS LIBRARY ================= */
const V = {};
let _uid = 0; const uid = p => (p||'g') + (++_uid);
function rnd(seed){ let s = seed||7; return () => (s = (s*16807)%2147483647, (s-1)/2147483646); }
const md = t => String(t==null?'':t).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>').replace(/\n/g,'<br>');

/* ---- small drawing helpers (SVG strings) ---- */
const SV = {
  cloud(x,y,s=1,c='#fff',o=1){return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><ellipse cx="0" cy="0" rx="60" ry="26" fill="${c}"/><circle cx="-26" cy="-14" r="26" fill="${c}"/><circle cx="12" cy="-24" r="32" fill="${c}"/><circle cx="42" cy="-6" r="22" fill="${c}"/></g>`},
  sun(x,y,r=46){let rays='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180;rays+=`<line x1="${x+Math.cos(a)*(r+10)}" y1="${y+Math.sin(a)*(r+10)}" x2="${x+Math.cos(a)*(r+30)}" y2="${y+Math.sin(a)*(r+30)}" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>`}
    return `<g class="sunrays">${rays}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#fcd34d" stroke="#f59e0b" stroke-width="5"/>`},
  tree(x,y,s=1,c='#22c55e'){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="-10" width="18" height="70" rx="6" fill="#92400e"/><circle cx="0" cy="-40" r="46" fill="${c}"/><circle cx="-30" cy="-16" r="30" fill="${c}"/><circle cx="30" cy="-16" r="30" fill="${c}"/><circle cx="-12" cy="-58" r="16" fill="#fff" opacity=".12"/></g>`},
  palm(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 C 6 -40 10 -80 4 -120" stroke="#a16207" stroke-width="14" fill="none" stroke-linecap="round"/><g fill="#16a34a"><path d="M4 -120 C -30 -140 -70 -130 -90 -100 C -60 -118 -30 -118 4 -116Z"/><path d="M4 -120 C 40 -142 80 -130 96 -100 C 66 -118 36 -118 4 -116Z"/><path d="M4 -122 C -10 -160 -40 -170 -60 -168 C -36 -150 -18 -138 2 -118Z"/><path d="M4 -122 C 20 -160 50 -170 70 -166 C 46 -150 26 -138 6 -118Z"/></g><circle cx="0" cy="-112" r="7" fill="#78350f"/><circle cx="10" cy="-110" r="7" fill="#78350f"/></g>`},
  acacia(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 L4 -70 M4 -70 L-30 -100 M4 -70 L40 -102" stroke="#7c2d12" stroke-width="9" fill="none" stroke-linecap="round"/><ellipse cx="4" cy="-108" rx="80" ry="20" fill="#65a30d"/><ellipse cx="-10" cy="-118" rx="50" ry="14" fill="#84cc16"/></g>`},
  cactus(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})" fill="#16a34a"><rect x="-12" y="-90" width="24" height="90" rx="12"/><rect x="-40" y="-60" width="16" height="36" rx="8"/><rect x="-40" y="-30" width="34" height="14" rx="7"/><rect x="24" y="-74" width="16" height="40" rx="8"/><rect x="8" y="-40" width="32" height="14" rx="7"/></g>`},
  grass(x,y,s=1,c='#16a34a'){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><path d="M0 0 L-8 -30 L-2 0Z M4 0 L6 -38 L10 0Z M12 0 L22 -26 L16 0Z"/></g>`},
  reed(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 L0 -90" stroke="#4d7c0f" stroke-width="5"/><rect x="-6" y="-120" width="12" height="36" rx="6" fill="#78350f"/><path d="M10 0 Q 20 -40 30 -70" stroke="#65a30d" stroke-width="5" fill="none"/></g>`},
  mountain(pts,c){return `<path d="${pts}" fill="${c}"/>`},
  house(x,y,s=1,c='#f5deb3'){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-40" y="-50" width="80" height="50" fill="${c}" stroke="#b45309" stroke-width="3"/><rect x="-12" y="-28" width="24" height="28" fill="#92400e"/><rect x="-34" y="-42" width="16" height="14" fill="#7dd3fc"/><rect x="18" y="-42" width="16" height="14" fill="#7dd3fc"/><rect x="-44" y="-56" width="88" height="8" fill="#d6b88a"/></g>`},
  fence(y,c='#a16207'){let s='';for(let x=0;x<=1000;x+=50)s+=`<rect x="${x}" y="${y-40}" width="10" height="44" fill="${c}"/>`;return s+`<rect x="0" y="${y-32}" width="1000" height="7" fill="${c}"/><rect x="0" y="${y-14}" width="1000" height="7" fill="${c}"/>`},
  rainLines(n=60,c='#60a5fa',seed=3){const r=rnd(seed);let s='<g class="rainanim">';for(let i=0;i<n;i++){const x=r()*1000,y=r()*560;s+=`<line x1="${x}" y1="${y}" x2="${x-10}" y2="${y+28}" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity=".8"/>`}return s+'</g>'},
  snowDots(n=70,seed=5){const r=rnd(seed);let s='<g class="snowanim">';for(let i=0;i<n;i++){s+=`<circle cx="${r()*1000}" cy="${r()*560}" r="${3+r()*5}" fill="#fff"/>`}return s+'</g>'}
};

/* ---- backgrounds (viewBox 1000x560) ---- */
const BG = {
  plain:()=>`<rect width="1000" height="560" fill="#f8fafc"/>`,

  beach:()=>`<defs><linearGradient id="bgbe" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#bae6fd"/></linearGradient></defs><rect width="1000" height="560" fill="url(#bgbe)"/>${SV.cloud(180,70,.8)}${SV.cloud(700,90,.7)}<rect y="170" width="1000" height="150" fill="#0ea5e9"/><path d="M0 300 Q 250 270 500 300 T 1000 290 V560 H0Z" fill="#fde68a"/><path d="M0 330 Q 300 310 600 340 T 1000 330 V560 H0Z" fill="#fcd34d" opacity=".6"/>`,
  underwater:()=>`<defs><linearGradient id="bguw" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#075985"/></linearGradient></defs><rect width="1000" height="560" fill="url(#bguw)"/><path d="M0 480 Q 250 450 500 480 T 1000 470 V560 H0Z" fill="#fde68a"/><g fill="#16a34a"><path d="M120 490 q -20 -60 10 -110 q -25 50 0 110z"/><path d="M820 480 q -25 -70 8 -130 q -20 60 2 130z"/><path d="M860 485 q 18 -50 -6 -100 q 30 40 16 100z"/></g><g fill="#fff" opacity=".35"><circle cx="300" cy="200" r="6"/><circle cx="310" cy="160" r="4"/><circle cx="700" cy="250" r="5"/></g>`,
  pond:()=>`<defs><linearGradient id="bgpo" x2="0" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs><rect width="1000" height="560" fill="url(#bgpo)"/>${SV.cloud(760,80,.8)}<rect y="240" width="1000" height="320" fill="#86efac"/>${SV.tree(120,250,1.1,'#16a34a')}${SV.tree(880,240,1,'#15803d')}<ellipse cx="500" cy="420" rx="420" ry="120" fill="#38bdf8"/><ellipse cx="500" cy="420" rx="380" ry="96" fill="#0ea5e9" opacity=".5"/>${SV.reed(130,420)}${SV.reed(160,430,.8)}${SV.reed(860,420)}${SV.reed(890,430,.8)}<ellipse cx="330" cy="430" rx="30" ry="10" fill="#22c55e"/><ellipse cx="650" cy="455" rx="26" ry="9" fill="#22c55e"/>`,
  desert:()=>`<defs><linearGradient id="bgde" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#fef3c7"/></linearGradient></defs><rect width="1000" height="560" fill="url(#bgde)"/>${SV.sun(820,100,52)}<path d="M0 330 Q 200 250 420 330 T 820 300 T 1000 320 V560 H0Z" fill="#fb923c"/><path d="M0 400 Q 260 330 520 400 T 1000 380 V560 H0Z" fill="#f59e0b"/><path d="M0 470 Q 300 420 640 470 T 1000 460 V560 H0Z" fill="#fbbf24"/>${SV.cactus(160,450,.9)}${SV.cactus(860,470,.7)}`,
  savanna:()=>`<defs><linearGradient id="bgsa" x2="0" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#fef9c3"/></linearGradient></defs><rect width="1000" height="560" fill="url(#bgsa)"/>${SV.sun(150,90,40)}<rect y="300" width="1000" height="260" fill="#e5d38a"/><path d="M0 300 Q 500 270 1000 300 V320 H0Z" fill="#d6c27a"/>${SV.acacia(760,320,1.2)}${SV.acacia(240,330,.8)}${SV.grass(100,500)}${SV.grass(420,520,1.2,'#a3a33a')}${SV.grass(700,510,1,'#a3a33a')}`,
  wadi:()=>`<defs><linearGradient id="bgwa" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs><rect width="1000" height="560" fill="url(#bgwa)"/>${SV.cloud(300,80,.8)}<path d="M0 300 L140 130 L260 230 L400 90 L560 240 L700 120 L860 220 L1000 140 V360 H0Z" fill="#a8a29e"/><path d="M0 330 L180 220 L320 300 L480 200 L640 310 L820 230 L1000 300 V380 H0Z" fill="#78716c"/><rect y="360" width="1000" height="200" fill="#4ade80"/><path d="M0 470 Q 250 420 520 460 T 1000 440 V500 Q 700 520 480 510 T 0 520Z" fill="#38bdf8"/>${SV.palm(150,420,.8)}${SV.palm(860,410,.9)}${SV.palm(780,430,.6)}`,
  mountain:()=>`<defs><linearGradient id="bgmo" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#f0f9ff"/></linearGradient></defs><rect width="1000" height="560" fill="url(#bgmo)"/>${SV.cloud(780,90,.8)}<path d="M0 420 L180 160 L300 300 L460 110 L640 330 L800 190 L1000 380 V560 H0Z" fill="#a8a29e"/><path d="M460 110 L520 190 L490 180 L460 210 L430 170Z M180 160 L220 220 L190 210 L160 230Z" fill="#fff"/><path d="M0 470 Q 300 390 600 460 T 1000 450 V560 H0Z" fill="#84cc16"/>`,

/* ---- bar chart ---- */
V.bars = (o) => {
  const L=o.labels, vals=o.values, max=o.max||Math.max(...vals), W=1000, H=560;
  const ylab = o.ylabels || [];
  const pad = o.pad || (ylab.length ? Math.min(300, 40 + Math.max(...ylab.map(t=>String(t).length))*11) : 90), padR = 40, bw=(W-pad-padR)/L.length;
  const step = ylab.length ? 1 : Math.max(1, Math.ceil(max/6));
  let s=`<svg viewBox="0 0 ${W} ${H}" direction="ltr" style="width:100%;height:100%;direction:ltr"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for(let i=0;i<=max;i+=step){const y=H-70-(H-130)*i/max; s+=`<line x1="${pad}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e2e8f0" stroke-width="2"/>`; if(ylab[i]!==undefined) s+=`<text x="${pad-10}" y="${y+7}" font-size="${o.yfs||20}" text-anchor="end" fill="#334155" font-weight="700">${ylab[i]}</text>`; else if(!ylab.length) s+=`<text x="${pad-14}" y="${y+8}" font-size="24" text-anchor="end" fill="#334155">${toAr(i)}</text>`;}
  s+=`<line x1="${pad}" y1="${H-70}" x2="${W-padR}" y2="${H-70}" stroke="#94a3b8" stroke-width="3"/>`;
  L.forEach((l,i)=>{const x=W-padR-(i+1)*bw+bw*.18, h=(H-130)*vals[i]/max; const y=H-70-h;
    s+=`<rect class="barr" x="${x}" y="${y}" width="${bw*.64}" height="${h}" rx="10" fill="${o.colors?o.colors[i]:(o.color||'#3b82f6')}" style="transform-box:fill-box;transform-origin:bottom;animation:barup .6s ease-out"/>`;
    if(o.showv) s+=`<text x="${x+bw*.32}" y="${y-10}" font-size="24" text-anchor="middle" font-weight="800" fill="#1f2a44">${toAr(vals[i])}</text>`;
    s+=`<text x="${x+bw*.32}" y="${H-36}" font-size="24" text-anchor="middle" font-weight="800" fill="#1f2a44">${l}</text>`;});
  if(o.xt) s+=`<text x="${W/2}" y="${H-6}" font-size="22" text-anchor="middle" fill="#64748b">${o.xt}</text>`;
  return s+`</svg>`;
};

/* ======== generic VIS renderer ======== */
function VIS(spec){
  if(spec==null) return '';
  if(typeof spec==='string'){
    if(spec.trim().startsWith('<')) return spec;
    return `<div class="center fill" style="font-size:180px">${spec}</div>`;
  }
  if(spec.scene) return sceneHTML(spec.scene);
  if(spec.cards) return cardsHTML(spec);
  if(spec.v && V[spec.v]) return `<div class="center fill">${V[spec.v](spec)}</div>`;
  if(spec.html) return spec.html;
  return '';
}
function sceneHTML(sc){
  const items = (sc.items||[]).map((it,i)=>{
    const style = `left:${it.x}%;top:${it.y}%;font-size:${it.s||64}px;${it.z?`z-index:${it.z};`:''}`;
    const inner = it.v ? `<div style="width:${it.w||(it.s||64)*2}px;height:${it.h||(it.s||64)*1.5}px">${V[it.v]?V[it.v](it):''}</div>` : `<span style="display:inline-block;${it.f?'transform:scaleX(-1);':''}${it.r?`rotate:${it.r}deg;`:''}">${it.e||''}</span>`;
    const lb = it.l ? `<span class="lb">${it.l}</span>` : '';
    const info = it.info ? ` data-info="${esc(it.info)}"` : '';
    const id = it.id ? ` data-id="${it.id}"` : '';
    return `<div class="it ${it.a?'a-'+it.a:''} ${(it.info||it.id)?'click':''}" style="${style}"${info}${id}>${inner}${lb}</div>`;
  }).join('');
  const cap = sc.cap ? `<div style="position:absolute;bottom:10px;right:12px;left:12px;text-align:center"><span class="note-pill" style="background:rgba(255,255,255,.92)">${md(sc.cap)}</span></div>` : '';
  return `<div class="scene">${bgSVG(sc.bg||'plain')}${items}${cap}</div>`;
}
function cardsHTML(spec){
  const cols = spec.cols || Math.min(spec.cards.length, 4);
  return `<div class="pcards" style="grid-template-columns:repeat(${cols},1fr)">${spec.cards.map(c=>{
    const pic = c.v ? `<div class="pv">${V[c.v]?V[c.v](c):''}</div>` : c.scene ? `<div class="pv" style="position:relative;width:100%;border-radius:14px;overflow:hidden">${sceneHTML(c.scene)}</div>` : `<div class="pe">${c.e||''}</div>`;
    return `<div class="pcard ${c.info?'click':''}" ${c.info?`data-info="${esc(c.info)}"`:''} ${c.bg?`style="background:${c.bg}"`:''}>${pic}${c.t?`<div class="pt">${md(c.t)}</div>`:''}${c.d?`<div class="pd">${md(c.d)}</div>`:''}</div>`}).join('')}</div>`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

/* ================= SOUND (WebAudio, no files) ================= */
const SND = {
  ctx:null, on:true, amb:null,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,d=.15,type='sine',v=.18,delay=0,f2){ if(!this.on||!this.ctx) return; const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)},
  noiseBuf(){ if(this._nb) return this._nb; const c=this.ctx,b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; return this._nb=b; },
  noise(d=.3,ftype='lowpass',freq=1200,v=.2,delay=0,q=1){ if(!this.on||!this.ctx) return null; const c=this.ctx,t=c.currentTime+delay,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.noiseBuf();s.loop=true;f.type=ftype;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+d+.1);return {s,f,g}},
  play(n){ this.init(); if(!this.on||!this.ctx) return;
    const T=(...a)=>this.tone(...a);
    switch(n){
      case 'click': T(660,.06,'triangle',.12); break;
      case 'ok': T(523,.12,'triangle',.18);T(659,.12,'triangle',.18,.09);T(784,.22,'triangle',.18,.18); break;
      case 'bad': T(220,.18,'sawtooth',.09);T(180,.25,'sawtooth',.09,.12); break;
      case 'flip': this.noise(.12,'bandpass',2500,.12); T(500,.08,'sine',.06,0,900); break;
      case 'pop': T(900,.07,'square',.08,0,200); this.noise(.08,'highpass',1500,.15); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>T(f,.22,'triangle',.16,i*.12)); break;
      case 'tick': T(1200,.04,'square',.05); break;
      case 'whoosh': { const x=this.noise(.45,'bandpass',400,.18); if(x){x.f.frequency.exponentialRampToValueAtTime(3000,this.ctx.currentTime+.4)} break; }
      case 'step': T(440,.08,'sine',.12,0,660); break;

      case 'spin': for(let i=0;i<18;i++) T(800,.03,'square',.04,i*i*.012); break;
      case 'splash': this.noise(.5,'lowpass',900,.25); T(300,.2,'sine',.1,0,120); break;
      case 'drip': T(1400,.12,'sine',.12,0,500); break;
      case 'stretch': T(180,.5,'sawtooth',.06,0,420); break;
      case 'snap': this.noise(.12,'highpass',2000,.35); T(150,.1,'square',.12); break;
      case 'squish': T(300,.25,'sine',.15,0,90); break;
      case 'sizzle': this.noise(1.2,'highpass',4000,.12); break;
      case 'freeze': [1600,1900,2300].forEach((f,i)=>T(f,.25,'sine',.06,i*.07)); break;
      case 'stir': for(let i=0;i<6;i++) this.noise(.12,'bandpass',1800+i*120,.08,i*.13); break;
      case 'scratch': this.noise(.35,'bandpass',3200,.22,0,4); break;
      case 'thud': T(90,.2,'sine',.3,0,50); break;
      case 'fanfare': [392,523,659,784].forEach((f,i)=>T(f,.3,'triangle',.18,i*.15)); T(1047,.6,'triangle',.18,.6); break;
    }
  },
  /* ambient nature sounds for guessing games (≈3s) */
  ambient(n){ this.init(); if(!this.ctx) return; const was=this.on; this.on=true;
    const c=this.ctx;
    if(n==='rain'){ this.noise(3,'lowpass',2600,.22); for(let i=0;i<40;i++) this.tone(1800+Math.random()*1800,.04,'sine',.05,Math.random()*3,600); }
    if(n==='wind'){ const x=this.noise(3.2,'bandpass',500,.35,0,6); if(x){const t=c.currentTime;[700,300,900,400,650].forEach((f,i)=>x.f.frequency.linearRampToValueAtTime(f,t+.6*(i+1)))} }
    if(n==='thunder'){ this.noise(.15,'highpass',1500,.5); const x=this.noise(3,'lowpass',180,.7,.1); this.tone(55,2.5,'sine',.3,.1,30); }
    if(n==='sea'){ for(let i=0;i<3;i++){const x=this.noise(1.3,'lowpass',700,.3,i*1.05);} }
    if(n==='birds'){ for(let i=0;i<9;i++){const d=Math.random()*2.6; this.tone(2200+Math.random()*1200,.12,'sine',.1,d,3600); this.tone(3000,.08,'sine',.08,d+.13,2400);} }
    if(n==='fire'){ this.noise(3,'lowpass',500,.15); for(let i=0;i<30;i++) this.noise(.03,'highpass',3000,.25,Math.random()*3); }
    if(n==='bubbles'){ for(let i=0;i<14;i++) this.tone(300+Math.random()*500,.1,'sine',.15,i*.2,900+Math.random()*600); }
    if(n==='crunch'){ for(let i=0;i<6;i++) this.noise(.15,'bandpass',2500,.3,i*.35,2); }
    if(n==='sizzle'){ this.noise(3,'highpass',5000,.15); for(let i=0;i<20;i++) this.noise(.04,'highpass',6000,.2,Math.random()*3); }
    if(n==='hail'){ for(let i=0;i<60;i++) this.tone(2500+Math.random()*2500,.03,'square',.05,Math.random()*3); }
    if(n==='footsnow'){ for(let i=0;i<6;i++) this.noise(.25,'lowpass',1200,.3,i*.45); }
    if(n==='stretch'){ this.tone(150,2,'sawtooth',.07,0,500); this.noise(.12,'highpass',2000,.35,2.1); }
    this.on=was;
  }
};

function go(i){
  const S = CUR.all; i = Math.max(0, Math.min(S.length-1, i));

    el.innerHTML = `<div class="shead"><span class="ptag" style="background:${ph.c}">${ph.e} ${s.tag||ph.n}</span><h2 class="stitle hd">${md(s.t||'')}</h2></div><div class="sbody"></div>`;

  $('#prog i').style.width = ((i+1)/S.length*100)+'%';
  $('#prev').disabled = i===0; $('#next').disabled = i===S.length-1;
  const curP = s.sec||'present';

/* win overlay + confetti */
function winBox(host, e, h, p){
  if(getComputedStyle(host).position==='static') host.style.position='relative';
  const w=document.createElement('div'); w.className='win'; w.innerHTML=`<div class="we">${e}</div><h2 class="hd">${h}</h2><p>${p||''}</p><button class="gbtn" style="margin-top:8px">متابعة ✨</button>`;
  host.appendChild(w); SND.play('win'); confetti(w);
  $('button',w).onclick=()=>w.remove();
}
function confetti(host){ const cols=['#f43f5e','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899'];
  for(let i=0;i<60;i++){ const c=document.createElement('i'); c.className='confetti'; c.style.left=Math.random()*100+'%'; c.style.background=cols[i%6]; c.style.animationDuration=(1.5+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.6)+'s'; host.appendChild(c); } }

/* ================= GAMES ================= */
const G = {};
R.game = (s,b)=>{ (G[s.game]||(()=>b.innerHTML='لعبة غير معروفة'))(s,b) };
const cellH = t => typeof t==='object' ? `${t.e?`<div class="e">${t.e}</div>`:''}${t.t?`<div>${md(t.t)}</div>`:''}` : `<div>${md(t)}</div>`;
const optH = t => typeof t==='object' ? `${t.e?`<span class="oe">${t.e}</span>`:''}${md(t.t||'')}` : md(t);
function gHead(s, extra=''){ return `<div class="gbar"><div class="gq">${md(s.q||'')}</div>${extra}</div>`; }

/* 1. MEMORY */
G.memory = (s,b)=>{
  const cards = shuffle(s.pairs.flatMap((p,i)=>[{c:p[0],i},{c:p[1],i}]));
  const n = cards.length, cols = n<=8?4:n<=12?4:n<=16?4:6;
  b.innerHTML = `<div class="gwrap">${gHead(s,`<span class="score" id="mv">المحاولات: ٠</span>`)}<div class="garea"><div class="mem" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${Math.ceil(n/cols)},1fr)">${cards.map((c,k)=>`<div class="mc" data-k="${k}"><div class="in"><div class="f">❓</div><div class="b">${cellH(c.c)}</div></div></div>`).join('')}</div></div></div>`;
  let open=[], moves=0, got=0, lock=false;
  $$('.mc',b).forEach(m=>m.onclick=()=>{ if(lock||m.classList.contains('on')||m.classList.contains('ok')) return; m.classList.add('on'); SND.play('flip'); open.push(m);
    if(open.length===2){ moves++; $('#mv',b).textContent='المحاولات: '+toAr(moves); const [x,y]=open; lock=true;
      if(cards[x.dataset.k].i===cards[y.dataset.k].i){ later(()=>{x.classList.add('ok');y.classList.add('ok');SND.play('ok');open=[];lock=false; if(++got===s.pairs.length) later(()=>winBox($('.garea',b),'🧠','ذاكرة قوية!',`أنهيت اللعبة في ${toAr(moves)} محاولة`),500)},400) }
      else later(()=>{x.classList.remove('on');y.classList.remove('on');open=[];lock=false},1000) } });
};

/* 2. RIDDLE – من أنا؟ */
G.riddle = (s,b)=>{
  let qi=0, pts=0;
  const draw=()=>{ const it=s.items[qi]; let shown=1;
    const opts = it.opts.map((o,i)=>({o,i}));
    b.innerHTML = `<div class="gwrap">${gHead({q:s.q||'🕵️ لغز: مَنْ أنا؟'},`<span class="score">⭐ ${toAr(pts)}</span><span class="score">${toAr(qi+1)}/${toAr(s.items.length)}</span>`)}
      <div class="garea" style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><div class="card" style="background:linear-gradient(160deg,#eef2ff,#fff)"><div style="font-size:70px;text-align:center">🕵️</div><div class="clues"></div><button class="gbtn alt" id="mc" style="margin-top:10px">🔎 تلميح آخر</button></div>
      <div class="opts" style="grid-template-columns:1fr 1fr;align-content:center">${opts.map(({o,i})=>`<button class="opt" style="flex-direction:column;justify-content:center;text-align:center;font-size:24px" data-i="${i}">${optH(o)}</button>`).join('')}</div></div></div>`;
    const showClues=()=>{ $('.clues',b).innerHTML = it.clues.slice(0,shown).map((c,k)=>`<div class="hintb" style="font-size:24px;animation:pop .3s">${toAr(k+1)}. ${md(c)}</div>`).join(''); $('#mc',b).style.display = shown>=it.clues.length?'none':''; };
    showClues();
    $('#mc',b).onclick=()=>{ shown++; SND.play('reveal'); showClues(); };
    let done=false;
    $$('.opt',b).forEach(x=>x.onclick=()=>{ if(done) return; if(+x.dataset.i===it.a){ done=true; x.classList.add('ok'); pts+=Math.max(1,it.clues.length-shown+1); SND.play('ok');
        $('.clues',b).insertAdjacentHTML('beforeend',`<div class="ans-reveal">✅ ${md(it.why||'إجابة صحيحة!')}</div>`);
        later(()=>{ if(qi<s.items.length-1){qi++;draw()} else winBox($('.garea',b),'🕵️','محقق بارع!',`مجموع نقاطك: ${toAr(pts)}`) },1800) }
      else { x.classList.add('no'); SND.play('bad'); later(()=>x.classList.remove('no'),500); if(shown<it.clues.length){shown++;showClues()} } });
  };
  draw();
};

/* 3. BALLOONS – فرقع البالونات الصحيحة */
G.balloons = (s,b)=>{
  const cols=['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316'];
  const need = s.items.filter(x=>x.ok).length; let got=0;
  b.innerHTML = `<div class="gwrap">${gHead(s,`<span class="score" id="bs">🎈 ${toAr(0)} / ${toAr(need)}</span>`)}<div class="garea" style="background:linear-gradient(#bae6fd,#f0f9ff)">${bgSVG('sky')}</div></div>`;
  const area=$('.garea',b);
  const items = shuffle(s.items);
  items.forEach((it,k)=>{
    const el=document.createElement('div'); el.className='balloon';
    const x = 3 + (k%6)*16 + Math.random()*2; el.style.left=x+'%';
    let y = 8 + Math.floor(k/6)*52 + (k%2)*20; const sp=.07;
    el.style.top=y+'%';
    el.innerHTML=`<div class="bb" style="background:${cols[k%8]};border-top-color:${cols[k%8]}">${it.e?`<span class="e">${it.e}</span>`:''}${it.t||''}</div><div class="str"></div>`;
    area.appendChild(el);
    const iv = every(()=>{ y-=sp; if(y<-36) y+=140; el.style.top=y+'%'; }, 30);
    el.onclick=()=>{ if(el._done) return;
      if(it.ok){ el._done=true; clearInterval(iv); SND.play('pop'); const r=el.getBoundingClientRect(), a=area.getBoundingClientRect(), sc=CUR.scale||1;
        area.insertAdjacentHTML('beforeend',`<div class="boom" style="left:${(r.left-a.left)/sc+70}px;top:${(r.top-a.top)/sc+70}px">💥</div>`); el.remove(); got++; $('#bs',b).textContent=`🎈 ${toAr(got)} / ${toAr(need)}`; if(it.why) toast(area,it.why);
        if(got===need) later(()=>winBox(area,'🎈','أحسنت!',s.win||'فرقعت كل البالونات الصحيحة'),500) }
      else { SND.play('bad'); el.style.animation='shake .4s'; later(()=>el.style.animation='',450); if(it.why) toast(area,'❌ '+it.why,true); }
    };
  });
};
function toast(area,msg,bad){ const t=document.createElement('div'); t.className='fb show '+(bad?'bad':'good'); t.style.cssText='position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:20;max-width:80%;text-align:center'; t.innerHTML=md(msg); area.appendChild(t); later(()=>t.remove(),1800); }

/* 4. CATCH – التقط الصحيح فقط */
G.catch = (s,b)=>{
  const T = s.time||45, target = s.target||8; let left=T, sc=0, run=false;
  b.innerHTML = `<div class="gwrap">${gHead(s,`<span class="score" id="cs">✅ ${toAr(0)} / ${toAr(target)}</span><span class="score" id="ct">⏱️ ${toAr(T)}</span><button class="gbtn" id="cgo">▶️ ابدأ</button>`)}<div class="garea" style="border:4px solid #e2e8f0">${bgSVG(s.bg||'sky')}<div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:80px">${s.basket||'🧺'}</div></div></div>`;
  const area=$('.garea',b);
  const spawn=()=>{ const it=s.items[Math.floor(Math.random()*s.items.length)]; const el=document.createElement('div'); el.className='faller'; el.innerHTML=`${it.e||''}${it.t?`<span class="lb">${it.t}</span>`:''}`;
    el.style.left=(5+Math.random()*82)+'%'; area.appendChild(el); let y=-12; const sp=.35+Math.random()*.35;
    const iv=every(()=>{ y+=sp; el.style.top=y+'%'; if(y>100){clearInterval(iv);el.remove()} },30);
    el.onpointerdown=()=>{ if(el._d) return; el._d=true; clearInterval(iv);
      if(it.ok){ sc++; SND.play('ok'); el.style.transition='all .4s'; el.style.top='88%'; el.style.left='46%'; el.style.opacity='0'; later(()=>el.remove(),400); }
      else { sc=Math.max(0,sc-1); SND.play('bad'); el.style.filter='grayscale(1)'; el.style.animation='shake .4s'; later(()=>el.remove(),400); if(it.why) toast(area,'❌ '+it.why,true) }
      $('#cs',b).textContent=`✅ ${toAr(sc)} / ${toAr(target)}`;
      if(sc>=target){ stop(); winBox(area,'🧺','رائع!',s.win||'التقطت الإجابات الصحيحة'); } };
  };
  let sp1,t1;

  $('#cgo',b).onclick=()=>{ if(run) return; run=true; sc=0; left=T; $('#cgo',b).style.display='none'; SND.play('click');
    sp1=every(spawn, s.rate||900); t1=every(()=>{ left--; $('#ct',b).textContent='⏱️ '+toAr(left); if(left<=0){ stop(); winBox(area, sc>=target/2?'👏':'⏰','انتهى الوقت!',`جمعت ${toAr(sc)} إجابة صحيحة`); $('#cgo',b).style.display=''; } },1000); };
};

/* 5. WHEEL – عجلة الأسئلة */
G.wheel = (s,b)=>{
  const n=s.items.length, cols=['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6','#2dd4bf','#fb923c'];
  let seg=''; for(let i=0;i<n;i++){ const a0=(i/n)*2*Math.PI-Math.PI/2, a1=((i+1)/n)*2*Math.PI-Math.PI/2, r=240;
    const x0=250+r*Math.cos(a0),y0=250+r*Math.sin(a0),x1=250+r*Math.cos(a1),y1=250+r*Math.sin(a1), am=(a0+a1)/2;
    seg+=`<path d="M250 250 L${x0} ${y0} A${r} ${r} 0 ${n<=2?1:0} 1 ${x1} ${y1}Z" fill="${cols[i%8]}" stroke="#fff" stroke-width="4"/><text x="${250+160*Math.cos(am)}" y="${250+160*Math.sin(am)+14}" font-size="40" text-anchor="middle" fill="#fff" font-weight="800">${s.items[i].e||toAr(i+1)}</text>`; }
  b.innerHTML = `<div class="gwrap">${gHead(s)}<div class="wheelbox garea"><div class="wheel"><div class="ptr"></div><svg viewBox="0 0 500 500"><circle cx="250" cy="250" r="246" fill="#fff"/>${seg}</svg><div class="hub">لُف</div></div><div class="card" id="wq" style="min-height:300px;display:flex;flex-direction:column;gap:12px;justify-content:center"><div class="qtext" style="text-align:center;color:#94a3b8">اضغط «لُف» لاختيار سؤال 🎡</div></div></div></div>`;
  let rot=0, used=new Set(), spinning=false;
  $('.hub',b).onclick=()=>{ if(spinning) return; let pick; const free=[...Array(n).keys()].filter(i=>!used.has(i)); if(!free.length){ winBox($('.garea',b),'🎡','انتهت الأسئلة!','أحسنتم جميعًا'); used.clear(); return; }
    pick=free[Math.floor(Math.random()*free.length)]; used.add(pick); spinning=true; SND.play('spin');
    const segA=360/n, target = 360 - (pick*segA + segA/2); rot += 360*5 + ((target - rot%360)+360)%360;
    $('.wheel svg',b).style.transform=`rotate(${rot}deg)`;
    later(()=>{ spinning=false; SND.play('reveal'); const it=s.items[pick];
      $('#wq',b).innerHTML=`<div style="font-size:54px;text-align:center">${it.e||'❓'}</div><div class="qtext" style="text-align:center">${md(it.q)}</div>${it.opts?`<div class="opts" style="grid-template-columns:1fr 1fr">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}" style="font-size:22px">${optH(o)}</button>`).join('')}</div>`:''}<button class="gbtn" id="wa" style="align-self:center;background:#16a34a">✅ أظهر الإجابة</button><div id="wans"></div>`;
      if(it.opts) $$('#wq .opt',b).forEach(x=>x.onclick=()=>{ if(+x.dataset.i===it.a){x.classList.add('ok');SND.play('ok')}else{x.classList.add('no');SND.play('bad')} });
      $('#wa',b).onclick=()=>{ $('#wans',b).innerHTML=`<div class="ans-reveal">${md(it.ans || (it.opts?optH(it.opts[it.a]):''))}</div>`; SND.play('ok'); };
    },4100);
  };
};

/* 6. SCRAMBLE – رتّب الحروف */
G.scramble = (s,b)=>{
  let wi=0;
  const draw=()=>{ const it=s.words[wi]; const letters=[...it.w.replace(/\s/g,'')]; let sh=shuffle(letters.map((l,i)=>({l,i}))); if(letters.length>1&&sh.every((x,i)=>x.i===i)) sh.reverse();
    let pos=0;
    b.innerHTML = `<div class="gwrap">${gHead({q:s.q||'🔤 رتّب الحروف لتكوّن كلمة علمية'},`<span class="score">${toAr(wi+1)}/${toAr(s.words.length)}</span>`)}<div class="garea card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px"><div style="font-size:90px" class="a-bob">${it.e||'❓'}</div><div class="hintb" style="font-size:24px">💡 ${md(it.hint||'')}</div><div class="slots">${letters.map((l,i)=>`<div class="slot" data-p="${i}"></div>`).join('')}</div><div class="letters">${sh.map((x,k)=>`<button class="let" data-l="${x.l}" data-k="${k}">${x.l}</button>`).join('')}</div><button class="gbtn alt" id="clr">↺ إعادة</button></div></div>`;
    const slots=$$('.slot',b);
    $$('.let',b).forEach(x=>x.onclick=()=>{ if(x.classList.contains('used')) return;
      if(x.dataset.l===letters[pos]){ slots[pos].textContent=x.dataset.l; slots[pos].classList.add('f'); x.classList.add('used'); pos++; SND.play('step');
        if(pos===letters.length){ SND.play('ok'); later(()=>{ if(wi<s.words.length-1){wi++;draw()} else winBox($('.garea',b),'🔤','عبقري الكلمات!','رتّبت كل الكلمات') },900) } }
      else { SND.play('bad'); x.style.animation='shake .4s'; later(()=>x.style.animation='',400) } });
    $('#clr',b).onclick=draw;
  };
  draw();
};

/* 7. SOUNDS – ما هذا الصوت؟ */
G.sounds = (s,b)=>{
  let qi=0, pts=0;

    b.innerHTML = `<div class="gwrap">${gHead({q:s.q||'👂 استمع جيدًا… ما هذا الصوت؟'},`<span class="score">⭐ ${toAr(pts)}</span><span class="score">${toAr(qi+1)}/${toAr(s.items.length)}</span>`)}<div class="garea" style="display:grid;grid-template-columns:380px 1fr;gap:20px"><div class="card center" style="flex-direction:column;gap:16px"><button id="play" style="width:220px;height:220px;border-radius:50%;background:linear-gradient(140deg,var(--acc),#38bdf8);font-size:110px;box-shadow:var(--shadow)" class="a-pulse">🔊</button><div class="sm">اضغط للاستماع</div></div><div class="opts" style="grid-template-columns:1fr 1fr;align-content:center">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}" style="flex-direction:column;justify-content:center;font-size:26px">${optH(o)}</button>`).join('')}</div></div></div>`;

/* 8. REVEAL – الصورة الغامضة */
G.reveal = (s,b)=>{
  const n=s.qs.length, cols = s.cols || Math.ceil(Math.sqrt(n*1.6)), rows=Math.ceil(n/cols);
  let qi=0;
  b.innerHTML = `<div class="gwrap">${gHead({q:s.q||'🖼️ أجب عن الأسئلة لتكشف الصورة الغامضة!'})}<div class="garea" style="display:grid;grid-template-columns:1.1fr 1fr;gap:18px"><div style="position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)"><div class="vis" style="position:absolute;inset:0">${VIS(s.pic)}</div><div class="tiles" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${Array.from({length:cols*rows},(_,i)=>`<div class="tile">${toAr(i+1)}</div>`).join('')}</div></div><div class="col" id="rq"></div></div></div>`;

    $$('#rq .opt',b).forEach(x=>x.onclick=()=>{ if(+x.dataset.i===q.a){ x.classList.add('ok'); SND.play('ok'); tiles.splice(0,per).forEach(t=>t.classList.add('gone')); later(()=>{ if(qi<n-1){qi++;ask()} else final() },900) } else { x.classList.add('no'); SND.play('bad') } });
  };
  const final=()=>{ tiles.forEach(t=>t.classList.add('gone')); $('#rq',b).innerHTML=`<div class="qtext">${md(s.final||'ما الذي تراه في الصورة؟')}</div><button class="gbtn" id="ra" style="align-self:flex-start;background:#16a34a">✅ الإجابة</button>`; $('#ra',b).onclick=()=>{ $('#rq',b).insertAdjacentHTML('beforeend',`<div class="ans-reveal" style="font-size:28px">${md(s.a)}</div>`); SND.play('fanfare'); }; };
  ask();

/* 9. RACE – سباق صح أم خطأ */
G.race = (s,b)=>{
  const T=s.time||60; let left=T, qi=0, sc=0, run=false, order=shuffle(s.items);

  const show=()=>{ $('#rq',b).innerHTML=md(order[qi%order.length].s); };

    $('#rs',b).textContent='✅ '+toAr(sc); qi++; later(()=>{$('#rq',b).style.color='';if(run){ if(qi>=order.length){end()} else show()}},500) };
  const end=()=>{ run=false; winBox($('.garea',b),'⚡','انتهى السباق!',`إجاباتك الصحيحة: ${toAr(sc)} من ${toAr(Math.min(qi,order.length))}`); $('#rgo',b).style.display=''; };

};

/* 10. ODD ONE OUT – الدخيل */
G.oddone = (s,b)=>{
  let qi=0;
  const draw=()=>{ const it=s.sets[qi];
    b.innerHTML = `<div class="gwrap">${gHead({q:s.q||'🔎 أين الدخيل؟ اختر الشيء المختلف عن المجموعة'},`<span class="score">${toAr(qi+1)}/${toAr(s.sets.length)}</span>`)}<div class="garea" style="display:flex;flex-direction:column;gap:14px"><div class="pcards" style="grid-template-columns:repeat(${it.items.length},1fr);flex:1">${it.items.map((c,i)=>`<button class="pcard" data-i="${i}" style="cursor:pointer;border:4px solid transparent">${c.v?`<div class="pv">${V[c.v](c)}</div>`:`<div class="pe" style="font-size:90px">${c.e||''}</div>`}<div class="pt">${md(c.t||'')}</div></button>`).join('')}</div><div class="fb"></div></div></div>`;
    let done=false;
    $$('.pcard',b).forEach(x=>x.onclick=()=>{ if(done) return; if(+x.dataset.i===it.odd){ done=true; x.style.borderColor='#16a34a'; x.style.background='#ecfdf5'; SND.play('ok'); const fb=$('.fb',b); fb.className='fb show good'; fb.innerHTML='✅ '+md(it.why);
      later(()=>{ if(qi<s.sets.length-1){qi++;draw()} else winBox($('.garea',b),'🔎','عين المستكشف!','وجدت كل الدخلاء') },2400) } else { x.style.borderColor='#e11d48'; x.style.animation='shake .4s'; SND.play('bad'); later(()=>{x.style.animation='';x.style.borderColor='transparent'},500) } });
  };
  draw();
};

/* 11. SPY – ابحث في الصورة */
G.spy = (s,b)=>{
  const targets=new Set(s.targets); let found=0;
  b.innerHTML = `<div class="gwrap">${gHead(s,`<span class="score" id="ss">🔍 ${toAr(0)} / ${toAr(targets.size)}</span>`)}<div class="garea vis">${sceneHTML(s.scene)}</div></div>`;
  $$('.it[data-id]',b).forEach(it=>{ it.removeAttribute('data-info'); it.onclick=e=>{ e.stopPropagation(); const id=it.dataset.id; if(it.classList.contains('found')) return; const def=s.scene.items.find(x=>x.id===id);
    if(targets.has(id)){ it.classList.add('found'); found++; SND.play('ok'); $('#ss',b).textContent=`🔍 ${toAr(found)} / ${toAr(targets.size)}`; if(def&&def.info) showBubble(it,def.info); if(found===targets.size) later(()=>winBox($('.garea',b),'🔍','عين الصقر!',s.win||'وجدت كل الأشياء'),1200) }
    else { SND.play('bad'); it.style.animation='shake .4s'; later(()=>it.style.animation='',400); if(def&&def.no) showBubble(it,def.no); } } });
};

/* 12. TEAMS – تحدي المجموعات */
G.teams = (s,b)=>{
  const nt=s.n||2, teams=SB.teams.slice(0,nt), sc=Array(nt).fill(0); let qi=0, cur=0; const qs=s.qs;
  const draw=()=>{ const q=qs[qi];
    b.innerHTML = `<div class="gwrap"><div class="teams">${teams.map((t,i)=>`<div class="team ${i===cur?'cur':''}" style="--c:${t.c}"><span style="color:${t.c}">●</span>${t.n}<span class="sc">${toAr(sc[i])}</span></div>`).join('')}<span class="score">سؤال ${toAr(qi+1)}/${toAr(qs.length)}</span></div>
      <div class="garea" style="display:grid;grid-template-columns:${q.vis?'1fr 1fr':'1fr'};gap:18px"><div class="col"><div class="note-pill" style="align-self:flex-start;border-color:${teams[cur].c};color:${teams[cur].c}">🎤 دور مجموعة ${teams[cur].n}</div><div class="qtext">${md(q.q)}</div><div class="opts" style="grid-template-columns:${q.opts.length>2?'1fr 1fr':'1fr'}">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${optH(o)}</button>`).join('')}</div><div class="fb"></div></div>${q.vis?`<div class="vis">${VIS(q.vis)}</div>`:''}</div></div>`;
    let done=false;
    $$('.opt',b).forEach(x=>x.onclick=()=>{ if(done) return; done=true; const ok=+x.dataset.i===q.a; const fb=$('.fb',b);
      if(ok){ x.classList.add('ok'); sc[cur]++; SND.play('ok'); fb.className='fb show good'; fb.innerHTML=`نقطة لمجموعة ${teams[cur].n}! ${md(q.why||'')}`; }
      else { x.classList.add('no'); $$('.opt',b)[q.a].classList.add('ok'); SND.play('bad'); fb.className='fb show bad'; fb.innerHTML=`الإجابة الصحيحة: ${optH(q.opts[q.a])}. ${md(q.why||'')}`; }
      later(()=>{ qi++; cur=(cur+1)%nt; if(qi<qs.length) draw(); else { const mx=Math.max(...sc), w=teams.filter((t,i)=>sc[i]===mx).map(t=>t.n).join(' و '); winBox($('.garea',b)||b,'🏆',`الفائز: ${w}`,teams.map((t,i)=>`${t.n}: ${toAr(sc[i])}`).join(' • ')) } }, 2300) });
  };
  draw();
};

/* 13. MOLE – اصطد الكلمة */
G.mole = (s,b)=>{
  const T=s.time||40; let left=T, sc=0, run=false;
  b.innerHTML = `<div class="gwrap">${gHead(s,`<span class="score" id="ms">✅ ٠</span><span class="score" id="mt">⏱️ ${toAr(T)}</span><button class="gbtn" id="mgo">▶️ ابدأ</button>`)}<div class="garea" style="background:linear-gradient(#bbf7d0,#86efac)"><div class="holes">${Array.from({length:8},(_,i)=>`<div class="hole" data-h="${i}"><div class="pop"></div></div>`).join('')}</div></div></div>`;
  const holes=$$('.hole',b);
  const up=()=>{ const free=holes.filter(h=>!h.classList.contains('up')); if(!free.length) return; const h=free[Math.floor(Math.random()*free.length)]; const it=s.items[Math.floor(Math.random()*s.items.length)];
    h._it=it; $('.pop',h).innerHTML=`${it.e?`<span class="e">${it.e}</span>`:''}${it.t||''}`; h.classList.add('up'); h._t=later(()=>h.classList.remove('up'), s.stay||1700); };
  holes.forEach(h=>h.onclick=()=>{ if(!run||!h.classList.contains('up')) return; h.classList.remove('up'); clearTimeout(h._t);
    if(h._it.ok){sc++;SND.play('pop')} else {sc=Math.max(0,sc-1);SND.play('bad'); if(h._it.why) toast($('.garea',b),'❌ '+h._it.why,true)} $('#ms',b).textContent='✅ '+toAr(sc); });
  $('#mgo',b).onclick=()=>{ run=true; sc=0; left=T; $('#mgo',b).style.display='none'; $('#ms',b).textContent='✅ ٠';
    const a=every(up, s.rate||800); const t=every(()=>{ left--; $('#mt',b).textContent='⏱️ '+toAr(left); if(left<=0){ clearInterval(a); clearInterval(t); run=false; holes.forEach(h=>h.classList.remove('up')); winBox($('.garea',b),'🎯','انتهى الوقت!',`نقاطك: ${toAr(sc)}`); $('#mgo',b).style.display=''; } },1000); };
};

/* 14. CLIMB – تسلق الجبل / مسار الأسئلة */
G.climb = (s,b)=>{
  const n=s.qs.length; let qi=0;
  const pts = Array.from({length:n+1},(_,i)=>{ const t=i/n; return [8+t*80 + Math.sin(i*1.3)*6, 88 - t*76]; });
  b.innerHTML = `<div class="gwrap">${gHead({q:s.q||'🧗 أجب صحيحًا لتصعد إلى القمة!'})}<div class="garea" style="display:grid;grid-template-columns:1fr 1fr;gap:18px"><div class="vis" style="position:relative">${sceneHTML({bg:s.bg||'mountain',items:[]})}<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2 1.5"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="${i===n?'#f59e0b':'#fff'}" stroke="#334155" stroke-width=".4"/>`).join('')}</svg><div id="flag" style="position:absolute;left:${pts[n][0]}%;top:${pts[n][1]}%;transform:translate(-50%,-90%);font-size:56px">${s.goal||'🚩'}</div><div id="hero" style="position:absolute;left:${pts[0][0]}%;top:${pts[0][1]}%;transform:translate(-50%,-80%);font-size:64px;transition:all .9s cubic-bezier(.3,1.5,.5,1)">${s.hero||'🧗'}</div></div><div class="col" id="cq"></div></div></div>`;
  const ask=()=>{ const q=s.qs[qi];
    $('#cq',b).innerHTML=`<div class="score" style="align-self:flex-start">المحطة ${toAr(qi+1)} من ${toAr(n)}</div><div class="qtext" style="font-size:28px">${md(q.q)}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${optH(o)}</button>`).join('')}</div><div class="fb"></div>`;
    $$('#cq .opt',b).forEach(x=>x.onclick=()=>{ if(+x.dataset.i===q.a){ x.classList.add('ok'); SND.play('step'); qi++; const h=$('#hero',b); h.style.left=pts[qi][0]+'%'; h.style.top=pts[qi][1]+'%'; if(q.why){const fb=$('.fb',b);fb.className='fb show good';fb.innerHTML=md(q.why)}
      later(()=>{ if(qi<n) ask(); else winBox($('.garea',b),s.goal||'🏆','وصلت إلى القمة!',s.win||'أحسنت') }, 1400) } else { x.classList.add('no'); SND.play('bad') } });
  };
  ask();
};

/* 15. CLEANUP – نظّف المكان (اضغط على الشيء لنقله إلى مكانه) */
G.cleanup = (s,b)=>{
  const trash=s.scene.items.filter(x=>x.id); let got=0;
  b.innerHTML = `<div class="gwrap">${gHead(s,`<span class="score" id="cl">🗑️ ${toAr(0)} / ${toAr(trash.length)}</span>`)}<div class="garea vis">${sceneHTML(s.scene)}<div id="binx" style="position:absolute;left:4%;bottom:4%;font-size:110px;z-index:5" class="a-pulse">${s.bin||'🗑️'}</div></div></div>`;
  const area=$('.garea',b), bin=$('#binx',b);
  $$('.it[data-id]',b).forEach(it=>it.onclick=e=>{ e.stopPropagation(); if(it._d) return; it._d=true; const a=area.getBoundingClientRect(), r=bin.getBoundingClientRect(), sc=CUR.scale||1;
    it.style.transition='all .7s ease-in'; it.style.left=((r.left-a.left+r.width/2)/sc/area.offsetWidth*100)+'%'; it.style.top=((r.top-a.top+r.height/3)/sc/area.offsetHeight*100)+'%'; it.style.transform='translate(-50%,-50%) scale(.2) rotate(360deg)'; it.style.opacity='.2';
    SND.play('whoosh'); later(()=>{ it.remove(); SND.play('pop'); got++; $('#cl',b).textContent=`🗑️ ${toAr(got)} / ${toAr(trash.length)}`; if(got===trash.length){ const after=s.after; if(after) $$('.it',area).forEach(x=>x.classList.add('a-bob')); winBox(area,'🌿',s.win||'المكان نظيف!',s.winp||'شكرًا لأنك تحمي البيئة') } },700); });
};

/* 16. BUZZ – أسرع إصبع (سؤال مفتوح يُكشف تدريجيًا للمجموعات) */
G.flash = (s,b)=>{ // flash cards: picture → name quickly
  let qi=0; const items=shuffle(s.items);
  const draw=()=>{ const it=items[qi];
    b.innerHTML = `<div class="gwrap">${gHead({q:s.q||'⚡ بطاقات سريعة: قل الاسم قبل أن تنقلب البطاقة!'},`<span class="score">${toAr(qi+1)}/${toAr(items.length)}</span>`)}<div class="garea center" style="flex-direction:column;gap:18px"><div class="flip" style="width:520px;height:380px" id="fc"><div class="in"><div class="f">${it.v?`<div style="width:90%;height:80%">${V[it.v](it)}</div>`:`<div class="fe" style="font-size:170px">${it.e}</div>`}</div><div class="b" style="font-size:44px"><b style="font-size:54px">${it.t}</b>${md(it.d||'')}</div></div></div><div style="display:flex;gap:12px"><button class="gbtn" id="fl">🔄 اقلب</button><button class="gbtn alt" id="nx">التالي ⬅</button></div></div></div>`;
    $('#fl',b).onclick=$('#fc',b).onclick=()=>{ $('#fc',b).classList.toggle('on'); SND.play('flip') };
    $('#nx',b).onclick=()=>{ if(qi<items.length-1){qi++;draw()} else winBox($('.garea',b),'⚡','أنهيتم البطاقات!','') };
  };
  draw();
};

/* ---- sims.js ---- */
/* ================= SIMULATIONS ================= */
const SIM = {};
R.sim = (s,b)=>{ (SIM[s.sim]||(()=>b.innerHTML='محاكاة غير معروفة'))(s,b) };
const simShell = (b, visHTML, ctlHTML, q) => { b.innerHTML = `<div class="col fill">${q?`<div class="note-pill" style="font-size:22px;align-self:flex-start">🔬 ${md(q)}</div>`:''}<div class="simwrap" style="flex:1;min-height:0"><div class="vis" id="sv">${visHTML}</div><div class="simctl" id="sc">${ctlHTML}</div></div></div>`; return [$('#sv',b),$('#sc',b)]; };

/* ---- 1. Rain gauge (1-3) ---- */
SIM.raingauge = (s,b)=>{
  const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس']; let di=0, level=0; const rec=[];
  const [vis,ctl] = simShell(b, '', `<div class="readout" id="rd">اليوم: الأحد<br>القياس: ٠ طوبة</div>
    <button class="ctlbtn" data-r="0"><span class="e">☀️</span>لا أمطار</button><button class="ctlbtn" data-r="1"><span class="e">🌦️</span>القليل من الأمطار</button><button class="ctlbtn" data-r="3"><span class="e">🌧️</span>الكثير من الأمطار</button><button class="ctlbtn" data-r="5"><span class="e">⛈️</span>أمطار على مدى اليوم</button>
    <button class="gbtn" id="sv1">📝 سجّل القراءة وفرّغ المقياس</button><table class="tbl" id="tb"><tr><th>اليوم</th><th>القياس (عدد الطوب)</th></tr></table>`, s.q||'مقياس المطر: قارورة بلاستيكية مُدرّجة بالطوب البلاستيكي');
  const draw=(rain)=>{ const h=level*48;
    vis.innerHTML = `<div class="scene">${bgSVG(rain>0?'rain':'sky')}<svg viewBox="0 0 1000 560" direction="ltr" style="position:absolute;inset:0;width:100%;height:100%;direction:ltr"><g transform="translate(380 120)">
      <rect x="0" y="0" width="160" height="300" rx="12" fill="rgba(255,255,255,.55)" stroke="#334155" stroke-width="6"/>
      <rect x="6" y="${294-h}" width="148" height="${h}" fill="#3b82f6" opacity=".8" style="transition:all .8s"/>
      ${[1,2,3,4,5,6].map(i=>`<line x1="0" y1="${300-i*48}" x2="40" y2="${300-i*48}" stroke="#e11d48" stroke-width="5"/><text x="-14" y="${300-i*48+8}" font-size="26" text-anchor="end" font-weight="800" fill="#1f2a44">${toAr(i)}</text>`).join('')}
      <g transform="translate(200 0)">${[0,1,2,3,4,5].map(i=>`<rect x="0" y="${252-i*48}" width="56" height="46" rx="6" fill="${['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899'][i]}" stroke="#fff" stroke-width="3"/>`).join('')}</g>
      <text x="80" y="345" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2a44">مقياس المطر</text></g></svg></div>`; };
  draw(0);
  $$('[data-r]',ctl).forEach(x=>x.onclick=()=>{ level=Math.min(6,+x.dataset.r); SND.ambient(level?'rain':'birds'); draw(level); $('#rd',ctl).innerHTML=`اليوم: ${days[di]}<br>القياس: ${toAr(level)} طوبة`; });
  $('#sv1',ctl).onclick=()=>{ if(di>=5) return; rec.push(level); $('#tb',ctl).insertAdjacentHTML('beforeend',`<tr><td>${days[di]}</td><td>${toAr(level)}</td></tr>`); SND.play('ok'); di++; level=0; draw(0);
    if(di<5) $('#rd',ctl).innerHTML=`اليوم: ${days[di]}<br>القياس: ٠ طوبة`; else { $('#rd',ctl).innerHTML='✅ انتهت ٥ أيام! انظر الرسم البياني'; vis.innerHTML=`<div style="position:absolute;inset:10px">${V.bars({labels:days,values:rec,max:6,color:'#3b82f6',xt:'كمية الأمطار (بالطوب) لكل يوم'})}</div>`; } };
};

/* ---- 2. Weather pictogram (1-3) ---- */
SIM.pictogram = (s,b)=>{
  const kinds=[{k:'cloud',n:'غائم'},{k:'rain',n:'ممطر'},{k:'sun',n:'مشمس'},{k:'snow',n:'ثلج'},{k:'storm',n:'رعد'}];
  const cnt=[0,0,0,0,0]; let day=0; const max=s.days||5;
  const [vis,ctl]=simShell(b,'',`<div class="readout" id="pd">اليوم ${toAr(1)} من ${toAr(max)}: ما حالة الطقس؟</div>${kinds.map((k,i)=>`<button class="ctlbtn" data-k="${i}"><span class="e">${V.wx[k.k]}</span>${k.n}</button>`).join('')}<button class="gbtn alt" id="prst">↺ من جديد</button>`, s.q||'صمّم تمثيلًا بالمصوّرات للطقس على مدى خمسة أيام');
  const draw=()=>{ vis.innerHTML=`<div style="position:absolute;inset:16px;display:grid;grid-template-columns:70px repeat(5,1fr);grid-template-rows:repeat(${max},1fr) 60px;gap:6px">${Array.from({length:max},(_,r)=>`<div class="center" style="font-weight:800;font-size:22px;grid-column:1;grid-row:${r+1}">${toAr(max-r)}</div>`).join('')}
    ${kinds.map((k,c)=>Array.from({length:max},(_,r)=>{const lvl=max-r;return `<div style="grid-column:${c+2};grid-row:${r+1};border:2px dashed #cbd5e1;border-radius:12px;display:grid;place-items:center;font-size:44px;background:${cnt[c]>=lvl?'#f0f9ff':'#fff'}">${cnt[c]>=lvl?V.wx[k.k]:''}</div>`}).join('')).join('')}
    ${kinds.map((k,c)=>`<div class="center" style="grid-column:${c+2};grid-row:${max+1};font-weight:800;font-size:22px">${k.n}</div>`).join('')}<div class="center" style="grid-column:1;grid-row:${max+1};font-size:15px;color:#64748b">عدد الأيام</div></div>`; };
  draw();
  $$('[data-k]',ctl).forEach(x=>x.onclick=()=>{ if(day>=max) return; cnt[+x.dataset.k]++; day++; SND.play('pop'); draw();
    if(day<max) $('#pd',ctl).textContent=`اليوم ${toAr(day+1)} من ${toAr(max)}: ما حالة الطقس؟`; else { const m=Math.max(...cnt); $('#pd',ctl).innerHTML=`✅ الطقس الأكثر تكرارًا: <b style="color:#fde047">${kinds.filter((k,i)=>cnt[i]===m).map(k=>k.n).join(' و ')}</b>`; SND.play('win'); } });
  $('#prst',ctl).onclick=()=>{ cnt.fill(0); day=0; draw(); $('#pd',ctl).textContent=`اليوم ${toAr(1)} من ${toAr(max)}: ما حالة الطقس؟`; };
};

/* ---- 3. Wind indicator (1-3/1-4) ---- */
SIM.wind = (s,b)=>{
  let lv=0, dir=1; const names=['هادئة (لا رياح)','ليست قوية جدًا','قوية','قوية جدًا'];
  const [vis,ctl]=simShell(b,'',`<div class="readout" id="wr">الرياح: ${names[0]}</div><label class="sm">💨 قوة الرياح</label><input type="range" min="0" max="3" step="1" value="0" id="wl" style="direction:ltr"><div style="display:flex;justify-content:space-between;font-size:15px;color:#64748b;direction:ltr"><span>هادئة</span><span>قوية جدًا</span></div><button class="ctlbtn" id="wd"><span class="e">↔️</span>غيّر اتجاه الرياح</button><div class="card sm" style="padding:10px 14px">📌 الشرائط الورقية تتحرك في <b class="hl">الاتجاه المعاكس</b> لمصدر الرياح.<br>⚠️ تأكّد من عدم وجود أحد بجانبك عندما تحمل العصا في الهواء.</div>`, s.q||'مقياس الرياح: عصا وشرائط ورقية');
  const draw=()=>{ const a=[86,58,28,6][lv]; const rot = dir>0 ? a : 180-a; const sway=[0,4,9,16][lv]*dir;
    vis.innerHTML=`<div class="scene">${bgSVG(lv>=3?'storm':'park')}<svg viewBox="0 0 1000 560" direction="ltr" style="position:absolute;inset:0;width:100%;height:100%;direction:ltr">
      <g transform="translate(500 520)"><rect x="-8" y="-330" width="16" height="330" rx="6" fill="#92400e"/>${[0,1,2,3].map(i=>`<g transform="translate(0 ${-320+i*14}) rotate(${rot})"><path d="M0 0 C 60 ${8+i*3} 120 ${-8-i*3} ${190-i*10} 6" stroke="${['#ef4444','#f59e0b','#3b82f6','#10b981'][i]}" stroke-width="12" fill="none" stroke-linecap="round">${lv?`<animate attributeName="d" dur="${[3,1.2,.6,.3][lv]}s" repeatCount="indefinite" values="M0 0 C 60 ${10+i*4} 120 ${-10-i*3} ${190-i*10} 8;M0 0 C 60 ${-8-i*3} 120 ${12+i*3} ${190-i*10} -6;M0 0 C 60 ${10+i*4} 120 ${-10-i*3} ${190-i*10} 8"/>`:''}</path></g>`).join('')}</g>
      <g transform="translate(150 520) rotate(${sway})">${SV.tree(0,-40,1.3)}</g><g transform="translate(860 520) rotate(${sway})">${SV.tree(0,-40,1,'#16a34a')}</g>
      ${lv?Array.from({length:lv*4},(_,i)=>`<path d="M${(i*137)%900} ${80+(i*71)%300} q 30 -10 60 0 t 60 0" stroke="#fff" stroke-width="5" fill="none" opacity=".8"><animateTransform attributeName="transform" type="translate" from="${dir>0?-200:200} 0" to="${dir>0?300:-300} 0" dur="${[0,2.4,1.4,.8][lv]}s" repeatCount="indefinite"/></path>`).join(''):''}

    $('#dr',ctl).innerHTML=`الطقس: ${w.e} ${w.n}`; $$('[data-c]',ctl).forEach(x=>x.classList.toggle('on',on.has(clothes[+x.dataset.c].e))); $$('[data-w]',ctl).forEach(x=>x.classList.toggle('on',+x.dataset.w===wi)); };

/* ---- 6. Soil in water (2-3) ---- */

  let k='garden', st=0;
  const [vis,ctl]=simShell(b,'',`${Object.entries(soils).map(([key,v],i)=>`<button class="ctlbtn ${i?'':'on'}" data-s="${key}"><span class="e">🟫</span>${v.n}</button>`).join('')}<button class="gbtn" id="s1">1️⃣ ضع العيّنة في الماء</button><button class="gbtn" id="s2">2️⃣ خُضّ الوعاء بتأنٍّ</button><button class="gbtn" id="s3">3️⃣ انتظر ولاحظ</button><div class="readout" id="sr">ماذا سترى في التربة؟</div>`, s.q||'نشاط ٢-٣: العثور على الحصى في التربة');

  draw();
  $$('[data-s]',ctl).forEach(x=>x.onclick=()=>{ k=x.dataset.s; st=0; $$('[data-s]',ctl).forEach(y=>y.classList.toggle('on',y===x)); draw(); $('#sr',ctl).textContent='ماذا سترى في التربة؟'; });
