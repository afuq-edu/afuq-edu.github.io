:root{--ink:#2E3A3F;--mute:#6f7f79;--bg:#F7FAF8;--card:#fff;--acc:#4E7F6A;--tint:#EAF3EE;--soft:#F5FAF7;--line:#CFE2D7}

*{box-sizing:border-box}html,body{margin:0}
body{font-family:T,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;transition:background .3s}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:2px solid var(--line);padding-bottom:10px}

.mode{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--acc);padding:7px 20px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button:focus-visible,.tabs button:focus-visible,.copy:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.explain{margin:8px 0 0;font-size:14px;color:var(--mute)}.explain b{color:var(--ink)}
.now{margin-top:8px;font-weight:700;color:var(--acc);background:var(--soft);border-right:4px solid var(--acc);padding:6px 10px;border-radius:6px}
.pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:260px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.meta{margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 14px;font-size:14px}
.meta span{display:block;font-size:12px;color:var(--acc);font-weight:700}
.cards{display:grid;gap:12px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card h2{margin:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);padding:8px 14px;font-size:16px;color:var(--acc)}
.card h2 .t{display:flex;align-items:center;gap:8px}
.n{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.copy{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--acc);background:#fff;color:var(--acc);padding:5px 16px;border-radius:999px;cursor:pointer;min-width:112px;transition:background .2s,color .2s}
.copy.ok{background:var(--acc);color:#fff}
.body{padding:10px 14px;white-space:pre-wrap;font-size:15px}
.body .ph{display:block;font-weight:700;color:var(--acc);margin-top:8px}.body .ph:first-child{margin-top:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;font-size:14px;transition:transform .25s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

5–12 د) المحجر:\nالمعلم: يشرح معنى المحجر واستخدام الآلات للحفر والنقل.\nالتلاميذ: يذكرون استخدامًا للصخور المنقولة (البناء).\n(12–17 د) استخدام العدسة:\nالمعلم: ينمذج طريقة النظر بالعدسة المكبرة، ويحذر من تحطيم الصخور لأن الشظايا تؤذي العيون.\nالتلاميذ: يجربون العدسة على عينة واحدة.\n(17–32 د) نشاط 2-1:\nالمعلم: يطرح السؤال العلمي: ما الاختلافات بين هذه الصخور؟\nالتلاميذ: يلاحظون العينات ويرسمونها ويدونون الاختلافات في ورقة العمل 2-1أ أو 2-1ب.\n(32–40 د) المشاركة:\nالمعلم: يجمع الاختلافات في جدول على السبورة.\nالتلاميذ: يعرضون: لون، حبيبات لامعة، ملمس خشن أو ناعم.\nزمن الحصة: 40 دقيقة", "1. (مستوى الدعم) س: ما المحجر؟ \nالإجابة النموذجية: مكان تُنتزع فيه الصخور من الأرض.\n2. (المستوى المتوقع) س: اذكر اختلافًا لاحظته بين صخرتين. \nالإجابة النموذجية: اللون أو الملمس أو وجود الحبيبات.\n3. (المستوى المتقدم) س: لماذا نستخدم العدسة المكبرة عند ملاحظة الصخور؟ \nالإجابة النموذجية: لنرى التفاصيل الصغيرة مثل الحبيبات والفتحات التي لا تراها العين بوضوح.", "1. (مستوى الدعم) س: ما الأداة التي تكبّر الأشياء الصغيرة؟ \nالإجابة النموذجية: العدسة المكبرة.\n2. (المستوى المتوقع) س: صف صخرة لاحظتها بكلمتين. \nالإجابة النموذجية: مثل: رمادية خشنة.\n3. (المستوى المتقدم) س: لماذا يجب عدم تحطيم الصخور في الصف؟ \nالإجابة النموذجية: لأن الأجزاء المتطايرة قد تصيب العيون.", "يحضر الطالب صخرة صغيرة من محيط المنزل ويصفها مع ولي أمره (اللون والملمس)، ويقرأ ص27 من كتاب الطالب."]}, {"n": 3, "axis": "خصائص الصخور: الصلابة وامتصاص الماء (تمرين 2-1)", "week": "السادس", "date": "11–15 أكتوبر 2026", "sb": "26–27", "ab": "16", "f": ["1. يرتب الصخور من حيث الصلابة اعتمادًا على نتائج خدشها.\n2. يستنتج أن الصخور الأقل صلابة تمتص ماءً أكثر.\nمخرج تعليمي آخر: يتوقع أي الصخور أكثر صلابة قبل الاختبار ثم يقارن توقعه بالنتيجة.", "المخرج 1: تحليل\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "التعلم بالاكتشاف\nالتعلم المبني على حل المشكلات\nالتعلم التعاوني", "الكتاب\nأخرى: عينات صخور، مسمار حديدي أو عصا خشبية، أوعية شفافة، ماء، مناشف ورقية، ورقة العمل 2-1ج", "الصلابة، أقل صلابة، يمتص، يتوقع", "يمرر المعلم عصا خشبية وحجرين ويسأل: «إذا خدشنا الحجرين بالعصا، أيهما سيتأثر أكثر؟». يدون التوقعات.", "(0–5 د) التهيئة والتوقع:\nالمعلم: يطرح السؤال ويسجل التوقعات.\nالتلاميذ: يتوقعون الحجر الأكثر صلابة.\n(5–15 د) تمرين 2-1 ص16:\nالمعلم: يقرأ نتائج منى: عصاها تحطمت عند خدش الجرانيت والفحم الحجري، وأزالت الكثير من الحجر الرملي، وانفصل قليل من الحجر الجيري.\nالتلاميذ: يكملون: الأقل صلابة الحجر الرملي، الأكثر صلابة الجرانيت، تحطمت العصا لأنها أحجار صلبة، ولم تتحطم لأنها أحجار أقل صلابة.\n(15–28 د) اختبار الامتصاص:\nالمعلم: ينمذج تحديد مستوى الماء ووضع الصخرة 3 دقائق ثم إخراجها.\nالتلاميذ: تختبر المجموعات صخرتين وتعلّم المستوى الجديد للماء.\n(28–35 د) مراجعة الاختبار العادل:\nالمعلم: يسأل: هل كانت الصخور متساوية الحجم؟ هل يؤثر ذلك؟\nالتلاميذ: يناقشون عدم العدالة عند اختلاف الأحجام.\n(35–40 د) الخلاصة:\nالمعلم: يربط: الصخور الأقل صلابة تمتص ماءً أكثر.\nالتلاميذ: يقارنون توقعاتهم بالنتائج.\nزمن الحصة: 40 دقيقة", "1. (مستوى الدعم) س: ما الحجر الأكثر صلابة في تمرين 2-1؟ \nالإجابة النموذجية: الجرانيت.\n2. (المستوى المتوقع) س: لماذا لم تتحطم العصا عند خدش الحجر الرملي؟ \nالإجابة النموذجية: لأنه حجر أقل صلابة.\n3. (المستوى المتقدم) س: لاحظت مجموعة أن صخرة كبيرة امتصت ماءً أكثر من صخرة صغيرة. هل نستطيع الحكم أنها أقل صلابة؟ \nالإجابة النموذجية: لا يمكن الحكم بدقة؛ لأن حجم الصخرتين مختلف فالاختبار غير عادل.", "1. (مستوى الدعم) س: رتب من الأقل صلابة إلى الأكثر: الجرانيت، الحجر الرملي. \nالإجابة النموذجية: الحجر الرملي ثم الجرانيت.\n2. (المستوى المتوقع) س: أي الصخرتين تمتص ماءً أكثر: الصلبة أم الأقل صلابة؟ \nالإجابة النموذجية: الأقل صلابة.\n3. (المستوى المتقدم) س: اقترح طريقة تجعل اختبار امتصاص الماء عادلًا. \nالإجابة النموذجية: استخدام صخور متساوية الحجم ونفس كمية الماء ونفس الوقت.", "يحل الطالب تمرين 2-1 ص16 من كتاب النشاط، ويراجع مع ولي أمره ص26–27 ويحاول أن يخدش برفق حجرين بعود خشبي ويقارن بينهما."]}]}, {"code": "2-2", "title": "استخدامات الصخور", "unit": "الوحدة الثانية: اكتشاف الصخور", "u": 2, "N": 3, "guide": "49–51", "periods": [{"n": 1, "axis": "خصائص الصخور واستخداماتها: الألماس والكوارتز والأردواز والجرانيت والرخام", "week": "السابع", "date": "18–22 أكتوبر 2026", "sb": "28", "ab": "—", "f": ["1. يحدد استخدامات الصخور المختلفة مثل البناء والطرق وصناعة المجوهرات والساعات.\n2. يربط استخدام الصخر بخاصيته (الألماس صلب جدًا، الأردواز ناعم وصلب، الرخام ناعم ومتين).\nمخرج تعليمي آخر: يعلل استخدام الجرانيت في البناء.", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "التعلم التشاركي\nالتعلم بالاكتشاف", "الكتاب\nالسبورة الذكية\nصورة توضيحية\nأخرى: عينات أو صور للرخام والجرانيت", "الألماس، الكوارتز، الأردواز، الرخام، الجرانيت", "يعرض المعلم خاتمًا لامعًا وساعة وبلاطة رخام، ويسأل: «ما الذي يجمع هذه الأشياء الثلاثة؟». يقود الإجابة: جميعها فيها صخور.", "(0–5 د) التهيئة:\nالمعلم: يعرض الأشياء ويطرح السؤال.\nالتلاميذ: يتوقعون العلاقة.\n(5–17 د) قراءة ص28:\nالمعلم: يقرأ عن كل صخر ويعرض صورته.\nالتلاميذ: يكملون جدولًا: الصخر - خاصيته - استخدامه.\n(17–27 د) لعبة البطاقات:\nالمعلم: يوزع بطاقات أسماء الصخور وبطاقات استخدامات.\nالتلاميذ: يطابقون كل صخر باستخدامه.\n(27–35 د) لماذا هذا الصخر؟:\nالمعلم: يطرح أسئلة تعليل: لماذا نستخدم الألماس في آلات القطع؟\nالتلاميذ: يعللون بالخاصية.\n(35–40 د) الخلاصة:\nالمعلم: يكتب: تستخدم الصخور المختلفة لأغراض متنوعة.\nالتلاميذ: يجيبون عن التقويم.\nزمن الحصة: 40 دقيقة", "1. (مستوى الدعم) س: في ماذا يُستخدم الكوارتز؟ \nالإجابة النموذجية: في صناعة الساعات وأجهزة الراديو.\n2. (المستوى المتوقع) س: لماذا يُستخدم الألماس في آلات القطع؟ \nالإجابة النموذجية: لأنه صلب جدًا.\n3. (المستوى المتقدم) س: لماذا يُفضَّل الأردواز للأسقف على الحجر الرملي؟ \nالإجابة النموذجية: لأن الأردواز صلب وناعم الملمس، أما الحجر الرملي فأقل صلابة فلا يتحمل كثيرًا.", "1. (مستوى الدعم) س: اذكر صخرًا يُستخدم في البناء. \nالإجابة النموذجية: الجرانيت أو الرخام.\n2. (المستوى المتوقع) س: صل: الأردواز ← … \nالإجابة النموذجية: الأرضيات والأسقف.\n3. (المستوى المتقدم) س: لو أردت صنع درج يدوم سنوات طويلة، أي صخر تختار؟ ولماذا؟ \nالإجابة النموذجية: الجرانيت أو الرخام؛ لأنهما صلبان ومتينان.", "يبحث الطالب مع ولي أمره في المنزل عن شيء مصنوع من الرخام أو الجرانيت (أرضية، سطح مطبخ) ويقر ": "32", "ab": "—", "f": ["1. يعرّف المادة الطبيعية بأنها مادة توجد في الطبيعة.\n2. يحدد المواد الطبيعية في صورة المزرعة ومصدر كل منها.\nمخرج تعليمي آخر: يذكر مادة طبيعية من البيئة العُمانية ومصدرها (السعف من النخلة، الحليب من الماعز).", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "التعلم بالاكتشاف\nالتعلم التشاركي", "الكتاب\nالسبورة الذكية\nصورة توضيحية\nأخرى: عينات: قطن، صوف، قطعة خشب، صخرة", "طبيعية، المطاط، المصدر، المواد", "يضع المعلم في صندوق مغلق قطنًا وصوفًا وخشبًا، ويطلب من متطوع لمس الأشياء دون النظر وتخمينها، ثم يسأل: «من أين أتت هذه المواد؟».", "(0–5 د) التهيئة:\nالمعلم: يدير لعبة الصندوق.\nالتلاميذ: يخمنون المواد ومصادرها.\n(5–13 د) قراءة ص32:\nالمعلم: يقرأ: الصخور مواد طبيعية تُستخرج من الأرض، والمطاط من الشجر.\nالتلاميذ: يكملون: المادة الطبيعية توجد في الطبيعة.\n(13–25 د) صورة المزرعة ص32:\nالمعلم: يسأل: ما المواد الطبيعية التي تراها في الصورة؟\nالتلاميذ: يحددون: صوف الأغنام، الحليب من الماعز، الخشب، التربة/السماد، الماء، الصخور.\n(25–35 د) المصدر والمادة:\nالمعلم: يرسم سهمًا على السبورة (مصدر ← مادة).\nالتلاميذ: يكملون: شجرة ← خشب، خروف ← صوف، نبتة القطن ← قطن، شجرة المطاط ← مطاط.\n(35–40 د) الخلاصة:\nالمعلم: يلخص معنى المادة الطبيعية.\nالتلاميذ: يجيبون عن التقويم.\nزمن الحصة: 40 دقيقة", "1. (مستوى الدعم) س: ما المادة الطبيعية التي نحصل عليها من الخروف؟ \nالإجابة النموذجية: الصوف.\n2. (المستوى المتوقع) س: من أين نحصل على المطاط الطبيعي؟ \nالإجابة النموذجية: من الشجر (شجرة المطاط).\n3. (المستوى المتقدم) س: هل الصخور مواد طبيعية؟ علل. \nالإجابة النموذجية: نعم؛ لأنها توجد في الطبيعة وتُستخرج من الأرض ولم يصنعها الإنسان.", "1. (مستوى الدعم) س: اذكر مادة طبيعية واحدة. \nالإجابة النموذجية: الخشب أو القطن أو الصوف أو الصخور.\n2. (المستوى المتوقع) س: صل: الخشب ← … \nالإجابة النموذجية: الشجرة.\n3. (المستوى المتقدم) س: اختر مادة طبيعية من بيئة عُمان واذكر استخدامًا لها. \nالإجابة النموذجية: سعف النخيل لصنع السلال (تقبل الإجابات الصحيحة).", "يبحث الطالب مع ولي أمره في المنزل عن ثلاث مواد طبيعية ويكتب مصدر كل منها، ويقرأ ص32 من كتاب الطالب."]}, {"n": 2 جية: الشيء القميص، والمادة القطن، والقطن مادة طبيعية لكن القميص صنعه الإنسان.", "يحل الطالب تمرين 2-4 ص19 من كتاب النشاط، ويصنف مع ولي أمره خمسة أشياء في المطبخ إلى طبيعية ومصنعة، ويقرأ ص33 من كتاب الطالب."]}, {"n": 3, "axis": "نشاط 2-4: العثور على المواد ومصادرها", "week": "التاسع", "date": "1–5 نوفمبر 2026", "sb": "33", "ab": "—", "f": ["1. يلاحظ المواد في جولة حول المدرسة ويحدد هل هي طبيعية أم مصنعة.\n2. يرسم المواد والمصادر التي أتت منها.\nمخرج تعليمي آخر: يحلل شيئًا مكونًا من عدة مواد (حقيبة، دراجة) ويصنف مواده.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "التعلم بالاكتشاف\nالتعلم التعاوني\nالتعلم الذاتي", "الكتاب\nالأقلام\nأخرى: حامل ورق، كاميرا رقمية، ورقتا العمل 2-4أ و2-4ب", "مصدر المادة، طبيعية، مصنعة، الجولة", "يرفع المعلم حقيبة مدرسية ويسأل: «من كم مادة صُنعت هذه الحقيبة؟». يعدد معهم: القماش، البلاستيك، المعدن في السحاب.", "(0–5 د) التهيئة:\nالمعلم: يعرض الحقيبة ويطرح السؤال.\nالتلاميذ: يعددون المواد.\n(5–20 د) جولة حول المدرسة:\nالمعلم: يقسم المجموعات ويحدد أماكن: الساحة، المقصف، الحديقة.\nالتلاميذ: يبحثون عن مواد ويرسمونها في ورقة العمل 2-4أ.\n(20–30 د) المصدر:\nالمعلم: يطلب أمام كل مادة ذكر مصدرها.\nالتلاميذ: يرسمون المصدر (شجرة، رمل، نفط) في ورقة العمل 2-4ب.\n(30–37 د) العرض:\nالمعلم: يجمع أمثلة على لوحة طبيعية/مصنعة.\nالتلاميذ: يعرضون ويناقشون الأمثلة الصعبة مثل الزجاج.\n(37–40 د) التقييم الذاتي:\nالمعلم: يسأل: ما الذي أجدته؟ ما الصعب؟\nالتلاميذ: يقيّمون أنفسهم.\nزمن الحصة: 40 دقيقة", "1. (مستوى الدعم) س: اذكر مادة طبيعية وجدتها في الجولة. \nالإجابة النموذجية: الخشب أو الحجر أو الرمل أو أوراق الشجر.\n2. (المستوى المتوقع) س: ما مصدر الخشب الذي في باب الصف؟ \nالإجابة النموذجية: الأشجار.\n3. (المستوى المتقدم) س: الزجاج يُصنع من الرمل. لماذا نصنفه مادة مصنعة؟ \nالإجابة النموذجية: لأن الإنسان حوّل الرمل إلى زجاج في المصنع، فالزجاج غير موجود في الطبيعة بهذا الشكل.", "1. (مستوى الدعم) س: هل المسطرة البلاستيكية طبيعية أم مصنعة؟ \nالإجابة النموذجية: مصنعة.\n2. (المستوى المتوقع) س: ارسم مادة طبيعية ومصدرها. \nالإجابة النموذجية: مثل: صوف وخروف.\n م: يسأل: هل بقي الشكل الجديد بعد التوقف عن الضغط؟\nالتلاميذ: يذكرون: الإسفنج عاد لشكله، الصلصال والزبدة بقيا، الخشب والطباشير لم يتغيرا.\n(35–40 د) مقارنة التوقعات:\nالمعلم: يعيد قراءة التوقعات.\nالتلاميذ: يحكمون: هل كانت توقعاتهم صحيحة؟\nزمن الحصة: 40 دقيقة", "1. (مستوى الدعم) س: هل تغير شكل الخشب عند الضغط عليه بالإصبع؟ \nالإجابة النموذجية: لا.\n2. (المستوى المتوقع) س: ماذا حدث للإسفنج بعد التوقف عن الضغط؟ \nالإجابة النموذجية: عاد إلى شكله الأول.\n3. (المستوى المتقدم) س: لماذا رسمنا المواد قبل الضغط وبعده؟ \nالإجابة النموذجية: لنقارن الشكلين ونعرف هل تغير الشكل وكيف تغير.", "1. (مستوى الدعم) س: اذكر مادة تغير شكلها بسهولة عند الضغط عليها. \nالإجابة النموذجية: الصلصال أو الزبدة.\n2. (المستوى المتوقع) س: قارن بين الصلصال والإسفنج بعد التوقف عن الضغط. \nالإجابة النموذجية: الصلصال يبقى بشكله الجديد، والإسفنج يعود لشكله.\n3. (المستوى المتقدم) س: توقع ماذا يحدث لقطعة شوكولاتة إذا ضغطت عليها بقوة كبيرة، وعلل. \nالإجابة النموذجية: قد تتكسر لأنها صلبة لا تنضغط بسهولة.", "يختبر الطالب مع ولي أمره الضغط على ثلاث مواد في المنزل (إسفنجة المطبخ، رغيف خبز، ملعقة) ويخبره بما حدث، ويقرأ نشاط 3-1 ص37."]}, {"n": 3, "axis": "تسجيل نتائج الضغط ومقارنة المواد: سهلة وصعبة وغير قابلة للتغيير", "week": "الحادي عشر", "date": "15–19 نوفمبر 2026", "sb": "37", "ab": "—", "f": ["1. يصنف المواد حسب تغير شكلها عند الضغط: تتغير بسهولة، تتغير بصعوبة، لا تتغير، تتكسر.\n2. يقارن بين توقعاته والنتائج الفعلية للتجربة.\nمخرج تعليمي آخر: يعرض نتائج مجموعته على الآخرين بطريقة مختارة (جدول أو رسم).", "المخرج 1: تحليل\nالمخرج 2: تقييم\nالمخرج الآخر: تطبيق", "التعلم التعاوني\nالتعلم التشاركي", "الكتاب\nالسبورة التقليدية\nالأقلام\nأخرى: لوحة تصنيف بأربعة أعمدة، صور المواد المختبرة", "يقارن، يصنف، يتكسر، يستعيد شكله", "يعرض المعلم صور المواد التي اختبرها التلاميذ في الحصة السابقة، ويسأل: «من يتذكر ماذا حدث للطباشير؟ وللزبدة؟».", "(0–5 د) التهيئة:\nالمعلم: يستدعي النتائج.\nالتلاميذ: يتذكرون ما حدث لكل مادة.\n(5–17 د) لوحة التصنيف:\nالمعلم: يرسم أربعة أعمدة: تتغير بسهولة، بصعوبة، لا تتغير، تتكسر.\nالتلاميذ: يضع function fieldText(L,k){
 if(mode==="sep") return L.periods[pi].f[k];
 return L.periods.map(p=>"الحصة "+p.n+":\n"+p.f[k]).join("\n\n");
}
function render(){
 const L=DATA.lessons[li];document.body.dataset.u=L.u;
 $("#mSep").classList.toggle("on",mode==="sep");$("#mCom").classList.toggle("on",mode==="com");
 $("#mSep").setAttribute("aria-selected",mode==="sep");$("#mCom").setAttribute("aria-selected",mode==="com");
 $("#now").textContent=mode==="sep"?"أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة "+(pi+1)+" من "+L.N:"أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه الـ"+L.N;
 const tabs=$("#tabs");tabs.innerHTML="";tabs.style.display=mode==="sep"?"flex":"none";
 L.periods.forEach((p,i)=>{const b=document.createElement("button");b.textContent="الحصة "+p.n;b.title=p.axis;if(i===pi)b.className="on";b.onclick=()=>{pi=i;render()};tabs.appendChild(b)});
 const P=L.periods[pi];
 let m='<div><span>الدرس</span>'+esc(L.code+" "+L.title)+'</div><div><span>الوحدة</span>'+esc(L.unit)+'</div>';
 if(mode==="sep") m+='<div><span>الأسبوع</span>'+esc(P.week+" ("+P.date+")")+'</div><div><span>الحصة</span>'+P.n+' من '+L.N+'</div><div><span>كتاب الطالب</span>ص '+esc(P.sb)+'</div><div><span>كتاب النشاط</span>'+(P.ab==="—"?"—":"ص "+esc(P.ab))+'</div><div><span>دليل المعلم</span>ص '+esc(L.guide)+'</div><div style="grid-column:1/-1"><span>محور الحصة</span>'+esc(P.axis)+'</div>';
 else { const w=[...new Set(L.periods.map(p=>p.week+" ("+p.date+")"))].join("، ");
  m+='<div><span>الأسبوع</span>'+esc(w)+'</div><div><span>عدد الحصص</span>'+L.N+'</div><div><span>دليل المعلم</span>ص '+esc(L.guide)+'</div><div style="grid-column:1/-1"><span>محاور الحصص</span>'+L.periods.map(p=>"الحصة "+p.n+": "+esc(p.axis)).join("<br>")+'</div>';}
 $("#meta").innerHTML=m;
 const cards=$("#cards");cards.innerHTML="";
 DATA.fields.forEach((name,k)=>{
  const c=document.createElement("article");c.className="card";
  let body;
  if(mode==="sep") body=esc(P.f[k]);
  else body=L.periods.map(p=>'<span class="ph">الحصة '+p.n+':</span>'+esc(p.f[k])).join("\n");
  c.innerHTML='<h2><span class="t"><span class="n">'+(k+1)+'</span>'+esc(name)+'</span><button class="copy" type="button">نسخ</button></h2><div class="body">'+body+'</div>';
  const btn=c.querySelector(".copy"), bd=c.querySelector(".body");
  btn.onclick=()=>copyText(fieldText(L,k),btn,bd);
  cards.appendChild(c);
 });
}
function done(btn){btn.textContent="تم النسخ ✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent="نسخ";btn.classList.remove("ok")},1800)}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),3200)}
function legacy(text){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function copyText(text,btn,bd){
 const fail=()=>{if(legacy(text)){done(btn)}else{selectEl(bd);toast("تعذّر النسخ تلقائيًا؛ النص محدد الآن — انسخه من قائمة المتصفح أو Ctrl+C")}};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>done(btn),fail)}else fail();
}
render();
</script></body></html>
