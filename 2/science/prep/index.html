دٍ، شاطئ، مزرعة) والكائنات الحية التي يراها فيها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/science/?l=1"]}, {"n": 2, "axis": "نشاط 1-1: المقارنة بين مكانين مختلفين في المدرسة", "week": "الأول", "date": "6–10 سبتمبر 2026", "sb": "17", "ab": "—", "f": ["1. يجمع الأدلة عن طريق الملاحظة عند مقارنة مكانين مختلفين (جاف ورطب أو مشمس وظليل) في المدرسة (25 دقيقة)\n2. يسجّل أسماء الحيوانات والنباتات التي وجدها في كل مكان ويقارن بينها (5 دقائق)\nمخرج تعليمي آخر: يوضح أن المقارنة تكون عادلة عندما تكون مساحة المكانين متساوية ومدة الملاحظة واحدة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "التعلم بالاكتشاف\nالتعلم التعاوني", "الكتاب\nالأقلام\nأخرى: حامل ورق، ساعة إيقاف، شريط متري أو حبل لقياس المساحة، كاميرا رقمية", "مكان جاف، مكان رطب، تسجيل، قياس، المقارنة العادلة", "يسأل المعلم: «هل تتوقعون أن نجد الحيوانات نفسها تحت شجرة ظليلة وفي ساحة مشمسة؟». يدوّن توقعات التلاميذ على السبورة لمراجعتها بعد النشاط، وينبّههم إلى أنهم سيجدون غالبًا حشرات صغيرة لا حيوانات كبيرة.", "1. التهيئة والتوقع: يطرح المعلم سؤال التوقع ويكتب السؤال العلمي: «كيف يؤثر المكان على أنواع الحيوانات والنباتات وأعدادها؟»، والتلاميذ يتوقعون ويسجلون توقعاتهم (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التخطيط والسلامة: يوزع المعلم الأدوات ويشرح طريقة قياس مساحة متساوية بالحبل أو الشريط، ويذكّر بعدم لمس النباتات الشائكة وغسل الأيدي بعد النشاط، والتلاميذ يحددون مع المعلم المكانين ويقترحون طريقة القياس (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الملاحظة الميدانية: يرافق المجموعات إلى مكانين (رطب وجاف) ويضبط مدة 5 دقائق لكل مكان، ويوجه: «هل نظرت تحت الحجر أو الورقة؟»، والتلاميذ يقيسون المساحة ويلاحظون ويرسمون الكائنات في ورقة العمل 1-1أ (أو 1-1ب للمتقدمين) ويعدّونها (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. عرض النتائج والمقارنة: يرسم المعلم جدولًا على السبورة بعمودين للمكانين ويجمع نتائج المجموعات، والتلاميذ يعرضون ما وجدوه ويقارنون: في المكان الرطب نباتات وحشرات أكثر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. المراجعة: يعيد المعلم قراءة التوقعات ويسأل: هل كانت مقارنتنا عادلة؟ لماذا؟ والتلاميذ يحكمون على توقعاتهم ويذكرون شرط المساحة والوقت المتساويين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (معرفة) س: سمِّ حيوانًا وجدته في المكان الرطب. \nالإجابة النموذجية: إجابة من الملاحظة مثل: الدودة أو النملة أو الخنفساء.\n2. (تطبيق) س: في أي المكانين وجدت نباتات أكثر؟ ولماذا؟ \nالإجابة النموذجية: في المكان الرطب؛ لأن فيه ماء أكثر تحتاجه النباتات.\n3. (استدلال) س: لماذا قسنا مساحة متساوية في المكانين قبل العدّ؟ \nالإجابة النموذجية: لكي تكون المقارنة عادلة؛ فلو كانت مساحة أحدهما أكبر لوجدنا فيه كائنات أكثر بسبب المساحة لا بسبب نوع المكان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتي نهر وصحراء، ويضع معه بطاقات حيوانات ونباتات في المكان المناسب، ويذكّره بأن الكائن يعيش حيث يجد الماء والغذاء، ثم يسأله: لماذا لا تعيش السمكة في الصحراء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بمقارنة مكانين في ساحة المدرسة (رطب وجاف) من حيث عدد النباتات والحشرات، وتسجيل النتائج في جدول بسيط مع تفسير الفرق.", "1. (معرفة) س: ما الأداة التي استخدمناها لقياس مساحة المكان؟ \nالإجابة النموذجية: الحبل أو الشريط المتري.\n2. (تطبيق) س: قارن بين المكان الجاف والمكان الرطب من حيث عدد الحشرات. \nالإجابة النموذجية: الحشرات في المكان الرطب أكثر غالبًا من المكان الجاف.\n3. (استدلال) س: بحث طالب في المكان المشمس دقيقتين وفي الظليل عشر دقائق، فوجد حشرات أكثر في الظليل. هل نتيجته موثوقة؟ ولماذا؟ \nالإجابة النموذجية: ليست موثوقة؛ لأن مدة البحث لم تكن متساوية، فالمقارنة غير عادلة.", "يبحث الطالب مع ولي أمره في حديقة المنزل أو الحي عن مكان رطب وآخر جاف، ويرسم كائنًا حيًا وجده في كل منهما، مع مراجعة نشاط 1-1 ص17 من كتاب الطالب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/science/?l=1"]}, {"n": 3, "axis": "الحيوانات والنباتات في البيئة الرطبة والجافة، وكائنات تعيش في بيئات متعددة أو محددة", "week": "الأول", "date": "6–10 سبتمبر 2026", "sb": "17", "ab": "12", "f": ["1. يحدد البيئة المناسبة لعيش الحيوانات والنباتات من خلال وجود الماء والغذاء والمأوى فيها (15 دقيقة)\n2. يصنّف الكائنات الحية إلى كائنات تعيش في بيئات متعددة (الإنسان، الحمام، الفأر) وأخرى تعيش في بيئات محددة (حوت العنبر، النمر الثلجي) (10 دقائق)\nمخرج تعليمي آخر: يصمّم حيوانًا خياليًا يناسب العيش في الصحراء الحارة مع ذكر صفة تساعده على ذلك (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "التعلم التعاوني\nالتعلم المبني على اللعب\nالتعلم الذاتي", "الكتاب\nالسبورة الذكية\nصورة توضيحية\nبرمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\nأخرى: بطاقات الكائنات الحية (ورقة المصادر 1-1أ)", "بيئة رطبة، بيئة جافة، مناسب للعيش، شاق للعيش، المأوى", "يعرض المعلم صورتي الصحراء والوادي الأخضر من ص17 ويسأل: «لو كنتَ غزالًا، في أي المكانين تجد طعامًا وماءً أكثر؟». يستمع للتعليلات ويربطها بما وجدوه في نشاط الحصة السابقة.", "1. التهيئة: يعرض المعلم الصورتين ويطرح السؤال، ويربطه بنتائج نشاط المقارنة، والتلاميذ يجيبون ويستدعون نتائج المكانين الرطب والجاف (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 1-1 كتاب النشاط ص12: يقرأ المعلم مع التلاميذ صورتي الشلال والصحراء القاحلة وبنك الكلمات، والتلاميذ يكملون الجمل: الشلال مكان مناسب للعيش، يوجد فيه الكثير من الماء، لذا من السهل العثور على الطعام والمأوى؛ والصحراء مكان شاق، فيها القليل من الماء، لذا من الصعب العثور على الطعام والمأوى (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. لعبة البطاقات: يوزع المعلم بطاقات ورقة المصادر 1-1أ ويرسم دائرتين: «يعيش في بيئات كثيرة» و«يعيش في بيئة واحدة»، والتلاميذ يتحركون ويضعون البطاقات في الدائرة المناسبة ويعللون (الفأر في البيت والحقل، حوت العنبر في المحيط فقط) (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحدٍّ إبداعي: يطلب المعلم من المجموعات تصميم حيوان خيالي للصحراء الحارة، وينبه إلى أن الخلق لله وحده وأن هذا مخلوق خيالي، والتلاميذ يرسمون الحيوان ويكتبون صفة تساعده (يخزّن الماء، له أقدام عريضة للرمل) ويعرضونه (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «س: هل الشلال مكان مناسب أم شاق لعيش الحيوانات»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – بيوت الكائنات العمانية: تختار كل مجموعة بيئة عمانية (بحر، صحراء، وادٍ) وتذكر حيوانًا ونباتًا يعيشان فيها وما يحتاجان إليه من ماء وغذاء ومأوى (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (معرفة) س: هل الشلال مكان مناسب أم شاق لعيش الحيوانات؟ \nالإجابة النموذجية: مكان مناسب.\n2. (تطبيق) س: لماذا يصعب على الحيوانات العيش في الصحراء القاحلة؟ \nالإجابة النموذجية: لأن الماء فيها قليل، فيصعب العثور على الطعام والمأوى.\n3. (استدلال) س: لماذا يعيش الحمام في المدينة والقرية والحقل بينما يعيش حوت العنبر في المحيط فقط؟ \nالإجابة النموذجية: لأن الحمام يجد الغذاء والماء والمأوى في أماكن كثيرة، أما حوت العنبر فيحتاج إلى ماء المحيط العميق ليعيش ويتغذى.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتي نهر وصحراء، ويضع معه بطاقات حيوانات ونباتات في المكان المناسب، ويذكّره بأن الكائن يعيش حيث يجد الماء والغذاء، ثم يسأله: لماذا لا تعيش السمكة في الصحراء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بمقارنة مكانين في ساحة المدرسة (رطب وجاف) من حيث عدد النباتات والحشرات، وتسجيل النتائج في جدول بسيط مع تفسير الفرق.", "1. (معرفة) س: اكتب كلمة (رطب) أو (جاف): البيئة التي فيها ماء كثير بيئة … \nالإجابة النموذجية: رطبة.\n2. (تطبيق) س: صنّف: الفأر، النمر الثلجي، الإنسان (يعيش في بيئات متعددة / بيئة محددة). \nالإجابة النموذجية: متعددة: الفأر والإنسان. محددة: النمر الثلجي.\n3. (استدلال) س: اقترح صفة لحيوان خيالي يعيش في جبل ثلجي بارد، وبيّن كيف تساعده. \nالإجابة النموذجية: فرو كثيف يحفظ دفء جسمه، أو أقدام عريضة لا تغوص في الثلج (تقبل الإجابات المنطقية).", "يحل الطالب تمرين 1-1 ص12 من كتاب النشاط إن لم يكمله في الصف، ويبحث مع ولي أمره عن حيوان يعيش في بيئة حارة وآخر يعيش في بيئة باردة ويرسمهما.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/science/?l=1"]}]}, {"code": "1-2", "title": "هل يمكننا العناية ببيئتنا؟", "unit": "الوحدة الأولى: اكتشاف المحيط من حولنا", "u": 1, "N": 3, "guide": "18–20", "periods": [{"n": 1, "axis": "النفايات ومياه المجاري وأثرها في الحياة البرية بجانب الشاطئ", "week": "الث لم الملاحظات ويسأل: هل لاحظتم أنماطًا متشابهة؟ ما ألوان الأحجار؟ والتلاميذ يعرضون ويستنتجون أن الأحجار المستخدمة في الممرات صلبة (10 دقائق)\nالاستراتيجيات: المناقشة.\n\n5. تقييم الأقران: يطلب المعلم تقييم عمل مجموعة أخرى: ما الجيد؟ ما الصعب؟ والتلاميذ يقيّمون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (معرفة) س: اذكر مكانًا في المدرسة استُخدمت فيه الأحجار. \nالإجابة النموذجية: الممرات أو الجدران أو حواف الحديقة.\n2. (تطبيق) س: هل الأسفلت صخر طبيعي؟ \nالإجابة النموذجية: لا، هو مادة صنعها الإنسان.\n3. (استدلال) س: لماذا تُستخدم الأحجار الصلبة في الممرات التي يمشي عليها الناس كثيرًا؟ \nالإجابة النموذجية: لأنها لا تتآكل بسرعة وتتحمل المشي عليها مدة طويلة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا للكوارتز والألماس والأردواز، ويطابقها معه ببطاقات استخداماتها (ساعة، آلة قطع، سقف)، ثم يسأله: لماذا يُستخدم الألماس في القطع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار صخر مناسب لبناء بيت أو رصف ممر، وتبرير الاختيار بصفة الصخر كالصلابة أو نعومة الملمس، ومقارنته بالحجر الرملي.", "1. (معرفة) س: ما الأداة التي استخدمتها لملاحظة الأحجار عن قرب؟ \nالإجابة النموذجية: العدسة المكبرة.\n2. (تطبيق) س: صنّف: الجرانيت، الإسمنت (طبيعي / مصنع). \nالإجابة النموذجية: الجرانيت طبيعي، الإسمنت مصنع.\n3. (استدلال) س: صف نمطًا لاحظته في الأحجار المستخدمة في المدرسة. \nالإجابة النموذجية: مثل: أغلب أحجار الجدران رمادية وصلبة (تقبل الملاحظات الصحيحة).", "يلاحظ الطالب مع ولي أمره الأحجار في جدران المنزل أو الحي ويرسم حجرًا ويذكر مكان استخدامه، مع قراءة ص29 من كتاب الطالب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/science/?l=7"]}, {"n": 3, "axis": "الصخور في المنزل واستخدامات أخرى (تمرين 2-2)", "week": "السابع", "date": "18–22 أكتوبر 2026", "sb": "28–29", "ab": "17", "f": ["1. يرسم أشياء توضح استخدام الألماس والفحم الحجري والصخور الكلسية البيضاء (الطبشور) والصخور الرملية (15 دقيقة)\n2. يستخدم مصادر معلومات بسيطة لمعرفة استخدامات صخور أخرى (الفحم الحجري للتدفئة، بودرة التلك، الطبشور للكتابة) (10 دقائق)\nمخرج تعليمي آخر: يصمم بطا }
function render(){
 const L=DATA.lessons[li];document.body.dataset.u=L.u;
 $("#mSep").classList.toggle("on",mode==="sep");$("#mCom").classList.toggle("on",mode==="com");
 $("#mSep").setAttribute("aria-selected",mode==="sep");$("#mCom").setAttribute("aria-selected",mode==="com");
 $("#now").textContent=mode==="sep"?"أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة "+(pi+1)+" من "+L.N:"أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه الـ"+L.N;
 const tabs=$("#tabs");tabs.innerHTML="";tabs.style.display=mode==="sep"?"flex":"none";
 L.periods.forEach((p,i)=>{const b=document.createElement("button");b.textContent="الحصة "+p.n;b.title=p.axis;if(i===pi)b.className="on";b.onclick=()=>{pi=i;render()};tabs.appendChild(b)});
 const P=L.periods[pi];
 let m='<div><span>الدرس</span>'+esc(L.code+" "+L.title)+'</div><div><span>الوحدة</span>'+esc(L.unit)+'</div>';
 if(mode==="sep") m+='<div><span>الأسبوع</span>'+esc(P.week+" ("+P.date+")")+'</div><div><span>الحصة</span>'+P.n+' من '+L.N+'</div><div><span>كتاب الطالب</span>ص '+esc(P.sb)+'</div><div><span>كتاب النشاط</span>'+(P.ab==="—"?"—":"ص "+esc(P.ab))+'</div><div><span>دليل المعلم</span>ص '+esc(L.guide)+'</div><div style="grid-column:1/-1"><span>محور الحصة</span>'+esc(P.axis)+'</div>';
 else { const w=[...new Set(L.periods.map(p=>p.week+" ("+p.date+")"))].join("، ");
  m+='<div><span>الأسبوع</span>'+esc(w)+'</div><div><span>عدد الحصص</span>'+L.N+'</div><div><span>دليل المعلم</span>ص '+esc(L.guide)+'</div><div style="grid-column:1/-1"><span>محاور الحصص</span>'+L.periods.map(p=>"الحصة "+p.n+": "+esc(p.axis)).join("<br>")+'</div>';}
 $("#meta").innerHTML=m;
 const cards=$("#cards");cards.innerHTML="";
 DATA.fields.forEach((name,k)=>{
  const c=document.createElement("article");c.className="card";
  let body;
  if(mode==="sep") body=esc(P.f[k]);
  else body=L.periods.map(p=>'<span class="ph">الحصة '+p.n+':</span>'+esc(p.f[k])).join("\n");
  c.innerHTML='<h2><span class="t"><span class="n">'+(k+1)+'</span>'+esc(name)+'</span><button class="copy" type="button">نسخ</button></h2><div class="body">'+body+'</div>';
  const btn=c.querySelector(".copy"), bd=c.querySelector(".body");
  btn.onclick=()=>copyText(fieldText(L,k),btn,bd);
  cards.appendChild(c);
 });
}
function done(btn){btn.textContent="تم النسخ ✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent="نسخ";btn.classList.remove("ok")},1800)}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),3200)}
function legacy(text){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function copyText(text,btn,bd){
 const fail=()=>{if(legacy(text)){done(btn)}else{selectEl(bd);toast("تعذّر النسخ تلقائيًا؛ النص محدد الآن — انسخه من قائمة المتصفح أو Ctrl+C")}};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>done(btn),fail)}else fail();
}
render();
</script><script src="/assets/qlink.js" defer></script>
