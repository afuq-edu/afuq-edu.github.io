body{font-family:T,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 85% -10%,#E3F1EA 0,transparent 60%),radial-gradient(900px 600px at 0% 110%,#E4EEF8 0,transparent 60%),var(--bg1);min-height:100%;overflow-x:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.screen{display:none;min-height:100vh;padding:clamp(12px,2.2vw,28px)}
.screen.on{display:flex;flex-direction:column;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* setup */
.hero{text-align:center;margin:6px 0 14px}
.hero .badge{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--mute);font-size:14px}
.hero h1{margin:8px 0 0;font-size:clamp(26px,4vw,46px);font-weight:800;color:var(--acc);letter-spacing:0}
.setup{max-width:1060px;width:100%;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:0 6px 24px -18px rgba(40,70,60,.35)}
.panel h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.step{width:26px;height:26px;border-radius:50%;background:#E7F2ED;color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
.periods{display:grid;gap:8px;margin-top:12px}
.pbtn{display:flex;gap:10px;align-items:flex-start;text-align:right;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;color:var(--ink);transition:border-color .2s,background .2s}
.pbtn b{flex:0 0 auto;color:var(--acc);font-weight:800}.pbtn span{font-size:15px;line-height:1.5}
.pbtn.on{border-color:var(--acc);background:#F1F8F4}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:#F2F7F5;width:40px;height:40px;font-size:22px;color:var(--acc)}
.stepper output{min-width:46px;text-align:center;font-weight:800;font-size:20px}
.groups{display:grid;gap:8px;margin-top:10px}
.gin{display:flex;align-items:center;gap:8px}
.gin i{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.gin input{flex:1;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 16px;font-weight:700;color:var(--ink)}
.quick button.on{border-color:var(--acc2);background:#EEF4FA;color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc2)}
.qcount{font-weight:800;color:var(--acc2);font-size:22px}
.go{margin:16px auto 6px;display:block;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:22px;padding:14px 46px;border-radius:999px;box-shadow:0 10px 24px -14px rgba(63,138,115,.9);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.note{color:var(--mute);font-size:13px;text-align:center}
/* game */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.crumb{color:var(--mute);font-size:15px}.crumb b{color:var(--ink)}
.tools{display:flex;gap:8px}
.ic{border:1px solid var(--line);background:#fff;border-radius:12px;height:40px;min-width:40px;padding:0 12px;color:var(--ink);font-size:15px}
.turns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
.chip{display:flex;align-items:center;gap:7px;border:2px solid transparent;background:#fff;border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;color:var(--ink);box-shadow:0 2px 10px -8px rgba(0,0,0,.4);transition:transform .25s,border-color .25s,opacity .25s;opacity:.62}
.chip i{width:14px;height:14px;border-radius:50%}
.chip small{color:var(--mute);font-weight:400}
.chip.on{opacity:1;border-color:var(--gc);transform:scale(1.08)}
.stage{flex:1;display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2.5vw,32px);align-items:center;max-width:1200px;width:100%;margin:8px auto 0}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.timerbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{position:relative;width:clamp(130px,17vw,200px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:#E6EEEB}.ring .prog{stroke:var(--acc);transition:stroke .4s}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:clamp(34px,4.6vw,56px);color:var(--ink)}
.ring .num small{font-size:13px;color:var(--mute);font-weight:400}
.pts{background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 14px;font-size:15px}.pts b{color:var(--acc2);font-size:19px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(16px,2.6vw,34px);box-shadow:0 18px 40px -30px rgba(40,70,60,.45)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:13px;border-radius:999px;padding:3px 12px;background:#F2F6F5;color:var(--mute);font-weight:700}
.tag.l1{background:#E8F4EE;color:#3F8A73}.tag.l2{background:#EAF1F9;color:#4D7FAD}.tag.l3{background:#F8F0E2;color:#A27322}
.qtext{font-size:clamp(22px,2.9vw,38px);font-weight:700;line-height:1.55;margin:4px 0 18px}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px dashed var(--acc2);margin:0 .2em;color:var(--acc2);text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:#FBFDFC;border-radius:18px;padding:14px 16px;font-size:clamp(18px,2.1vw,26px);font-weight:700;color:var(--ink);transition:transform .15s,border-color .2s,background .3s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--oc)}
.opt .k{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--oc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.opt:disabled{cursor:default}
.opt.right{background:#E6F4EC;border-color:var(--ok)}
.opt.wrong{background:#FBECEC;border-color:var(--bad)}
.opt.dim{opacity:.45}
.feedback{min-height:52px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fb{font-size:clamp(18px,2vw,24px);font-weight:800}
.fb.ok{color:var(--ok)}.fb.bad{color:#B86A6A}
.next{border:0;background:var(--acc2);color:#fff;font-weight:800;padding:11px 26px;border-radius:999px;font-size:18px}
.skip{border:1px solid var(--line);background:#fff;color:var(--mute);border-radius:999px;padding:8px 16px}
/* scoreboard */
.board{position:fixed;inset:0;background:rgba(243,248,246,.94);backdrop-filter:blur(4px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:5}
.board.on{display:flex;animation:fade .35s ease}
.board h3{margin:0 0 4px;font-size:clamp(22px,3vw,34px)}
.board .sub{color:var(--mute);margin-bottom:12px;font-size:17px}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.4vw,34px);height:min(52vh,420px);width:min(980px,96vw);padding:0 10px;border-bottom:2px solid var(--line)}
.bcol{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bval{font-weight:800;font-size:clamp(16px,2vw,24px);margin-bottom:6px}
.bfill{width:100%;border-radius:16px 16px 6px 6px;background:var(--gc);height:4px;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.rk{background:#fff;color:var(--ink);border:2px solid var(--gc);border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-bottom:6px}
.bcol.win .bfill{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gc)}
.bname{margin-top:8px;font-weight:700;font-size:clamp(14px,1.6vw,19px);text-align:center}
.gain{color:var(--ok);font-size:14px;font-weight:700;min-height:20px}
/* final */
.final{align-items:center;justify-content:center;text-align:center}
.final h2{font-size:clamp(28px,4vw,48px);margin:0;color:var(--acc)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,22px);margin:22px 0 10px}
.pd{display:flex;flex-direction:column;align-items:center;width:clamp(100px,16vw,190px)}
.pd .nm{font-weight:800;font-size:clamp(17px,2vw,24px);margin-bottom:4px}
.pd .sc{color:var(--mute);margin-bottom:8px}
.pd .blk{width:100%;border-radius:18px 18px 8px 8px;background:var(--gc);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:clamp(28px,3.4vw,44px);font-weight:800;color:#fff;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.rest{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 18px}
.rest span{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function tone(f,t0,d,type="sine",v=.12){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);const s=a.currentTime+t0;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05)}
const SND={ok:()=>{tone(523.25,0,.35);tone(659.25,.12,.35);tone(783.99,.24,.5)},bad:()=>{tone(311,0,.35,"triangle",.1);tone(247,.16,.45,"triangle",.09)},
tick:()=>tone(880,0,.08,"sine",.04),bars:()=>{[392,440,494,523].forEach((f,i)=>tone(f,i*.09,.3,"sine",.07))},
fin:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.16,.45,"sine",.09))},start:()=>{tone(440,0,.2);tone(660,.12,.3)}};
$("#mute").onclick=()=>{muted=!muted;$("#mute").textContent=muted?"🔇":"🔊"};
$("#fs").onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else document.exitFullscreen()};
/* ---------- setup ---------- */
const sel=$("#lesson");let og,cu;
DATA.forEach((L,i)=>{if(L.unit!==cu){og=document.createElement("optgroup");og.label=L.unit;sel.appendChild(og);cu=L.unit}const o=document.createElement("option");o.value=i;o.textContent=L.code+" "+L.title;og.appendChild(o)});
sel.onchange=()=>{S.li=+sel.value;S.pi=0;drawPeriods()};
function drawPeriods(){const box=$("#periods");box.innerHTML="";DATA[S.li].axes.forEach((a,i)=>{const b=document.createElement("button");b.className="pbtn"+(i===S.pi?" on":"");b.innerHTML="<b>الحصة "+(i+1)+"</b><span>"+a+"</span>";b.onclick=()=>{S.pi=i;drawPeriods()};box.appendChild(b)})}
function drawGroups(){$("#gCount").textContent=S.g;const box=$("#groups");box.innerHTML="";for(let i=0;i<S.g;i++){const d=document.createElement("label");d.className="gin";d.innerHTML='<i style="background:'+GC[i]+'"></i><input maxlength="18" aria-label="اسم المجموعة '+(i+1)+'">';const inp=d.querySelector("input");inp.value=S.names[i];inp.oninput=()=>S.names[i]=inp.value;box.appendChild(d)}}
$("#gMinus").onclick=()=>{if(S.g>2){S.g--;drawGroups()}};$("#gPlus").onclick=()=>{if(S.g<6){S.g++;drawGroups()}};
function setQ(n){S.nq=n;$("#qRange").value=n;$("#qOut").textContent=n;document.querySelectorAll("#quick button").forEach(b=>b.classList.toggle("on",+b.textContent===n))}
$("#qRange").oninput=e=>setQ(+e.target.value);document.querySelectorAll("#quick button").forEach(b=>b.onclick=()=>setQ(+b.textContent));
drawPeriods();drawGroups();
/* ---------- question pick ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function byLevel(arr){const out=[];[1,2,3].forEach(l=>out.push(...shuffle(arr.filter(q=>q.l===l))));return out}
function pickQs(){const L=DATA[S.li],p=S.pi+1;
 const own=byLevel(L.qs.filter(q=>q.p===p)).slice(0,S.nq);
 // fill: earlier (already taught) periods first, nearest first; later periods only if needed
 const others=shuffle(L.qs.filter(q=>q.p!==p)).sort((a,b)=>((a.p>p)-(b.p>p))||(Math.abs(a.p-p)-Math.abs(b.p-p)));
 const fill=others.slice(0,Math.max(0,S.nq-own.length)).sort((a,b)=>a.l-b.l);
 return own.concat(fill).map(q=>{if(q.t==="t")return {...q,opts:["صواب","خطأ"],ans:q.a===1?"صواب":"خطأ"};const ans=q.o[q.a];return {...q,opts:shuffle([...q.o]),ans}})}
/* ---------- game ---------- */
const CIRC=326.7;let timer=null,t0=0,locked=false;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on")}
function startGame(){const names=S.names.slice(0,S.g).map((n,i)=>n.trim()||("المجموعة "+(i+1)));
 G={qs:pickQs(),k:0,turn:0,groups:names.map((n,i)=>({n,c:GC[i],s:0}))};SND.start();show("#sGame");loadQ()}
$("#start").onclick=()=>{ac();startGame()};
function points(t){if(t<=30)return Math.round(1000-500*t/30);return Math.max(100,Math.round(500-400*(t-30)/30))}
function drawTurns(){const box=$("#turns");box.innerHTML="";G.groups.forEach((g,i)=>{const b=document.createElement("button");b.className="chip"+(i===G.turn?" on":"");b.style.setProperty("--gc",g.c);b.innerHTML='<i style="background:'+g.c+'"></i>'+g.n+' <small>'+g.s+'</small>';b.onclick=()=>{if(locked)return;G.turn=i;drawTurns()};box.appendChild(b)})}
function loadQ(){const q=G.qs[G.k],L=DATA[S.li];locked=false;
 $("#crumb").innerHTML="<b>"+L.code+" "+L.title+"</b> — السؤال "+(G.k+1)+" من "+G.qs.length;
 $("#qmeta").innerHTML='<span class="tag l'+q.l+'">'+LVN[q.l]+'</span><span class="tag">'+TYN[q.t]+'</span><span class="tag">الحصة '+q.p+'</span>';
 const qt=$("#qtext");qt.textContent="";
 if(q.t==="f"){const parts=q.q.split("___");qt.append(parts[0]);const s=document.createElement("span");s.className="blank";s.id="blank";s.textContent="؟";qt.append(s);qt.append(parts[1]||"")}else qt.textContent=q.q;
 const box=$("#opts");box.innerHTML="";const keys=["أ","ب","ج","د"];
 q.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.style.setProperty("--oc",q.t==="t"?(i?"#D59A9A":"#6FA98C"):OC[i]);b.innerHTML='<span class="k">'+(q.t==="t"?(i?"✗":"✓"):keys[i])+'</span><span>'+o+'</span>';b.onclick=()=>answer(o,b);box.appendChild(b)});
 $("#fb").textContent="";$("#fb").className="fb";$("#toBoard").hidden=true;$("#skip").hidden=false;
 drawTurns();t0=performance.now();clearInterval(timer);let lastSec=-1;
 timer=setInterval(()=>{const t=(performance.now()-t0)/1000;const left=30-t;const prog=$("#prog");
  if(left>=0){$("#tNum").textContent=Math.ceil(left);$("#tLbl").textContent="ثانية";prog.style.strokeDashoffset=CIRC*(t/30);prog.style.stroke=left>10?"var(--acc)":"var(--warm)";const s=Math.ceil(left);if(s<=5&&s!==lastSec&&s>0){SND.tick();lastSec=s}}
  else{$("#tNum").textContent="+"+Math.floor(-left);$("#tLbl").textContent="وقت إضافي";prog.style.strokeDashoffset=CIRC;prog.style.stroke="#E7C9A0"}
  $("#ptsNow").textContent=points(t)},100)}
function answer(o,btn){if(locked)return;locked=true;clearInterval(timer);const q=G.qs[G.k];const t=(performance.now()-t0)/1000;const g=G.groups[G.turn];
 const ok=o===q.ans;let gain=0;
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const txt=b.querySelector("span:last-child").textContent;if(txt===q.ans)b.classList.add("right");else if(b!==btn)b.classList.add("dim")});
 if(q.t==="f"){$("#blank").textContent=q.ans}
 if(ok){gain=points(t);$("#ptsNow").textContent=gain;g.s+=gain;SND.ok();$("#fb").className="fb ok";$("#fb").textContent="إجابة صحيحة! +"+gain+" لمجموعة "+g.n}
 else{btn.classList.add("wrong");SND.bad();$("#fb").className="fb bad";$("#fb").textContent="إجابة غير صحيحة — الإجابة: "+q.ans}
 G.last={i:G.turn,gain};$("#skip").hidden=true;$("#toBoard").hidden=false;drawTurns();$("#toBoard").focus()}
$("#skip").onclick=()=>{if(locked)return;locked=true;clearInterval(timer);const q=G.qs[G.k];document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.querySelector("span:last-child").textContent===q.ans)b.classList.add("right");else b.classList.add("dim")});if(q.t==="f")$("#blank").textContent=q.ans;$("#fb").className="fb";$("#fb").textContent="تم تخطي السؤال — الإجابة: "+q.ans;G.last={i:G.turn,gain:0};$("#skip").hidden=true;$("#toBoard").hidden=false};
$("#toBoard").onclick=showBoard;
function showBoard(){const bd=$("#board");const max=Math.max(1000,...G.groups.map(g=>g.s));const order=[...G.groups].map((g,i)=>({...g,i})).sort((a,b)=>b.s-a.s);
 const rank={};order.forEach(g=>rank[g.i]=1+order.filter(o=>o.s>g.s).length);
 $("#bTitle").textContent=G.k+1<G.qs.length?"النتائج بعد السؤال "+(G.k+1):"النتائج النهائية";
 const L=G.last;$("#bSub").textContent=L.gain>0?"فازت بهذا السؤال مجموعة «"+G.groups[L.i].n+"» بـ "+L.gain+" نقطة":"لا نقاط في هذا السؤال";
 const bars=$("#bars");bars.innerHTML="";
 G.groups.forEach((g,i)=>{const c=document.createElement("div");c.className="bcol"+(L.gain>0&&L.i===i?" win":"");c.style.setProperty("--gc",g.c);
  c.innerHTML='<div class="gain"><bdi dir="ltr">'+(L.gain>0&&L.i===i?"+"+L.gain:"")+'</bdi></div><div class="rk">'+rank[i]+'</div><div class="bval">'+g.s+'</div><div class="bfill"></div><div class="bname">'+g.n+'</div>';bars.appendChild(c)});
 bd.classList.add("on");SND.bars();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{bars.querySelectorAll(".bcol").forEach((c,i)=>{c.querySelector(".bfill").style.height=Math.max(4,(G.groups[i].s/max)*100)+"%"})}));
 $("#nextQ").textContent=G.k+1<G.qs.length?"السؤال التالي":"منصة التتويج";$("#nextQ").focus()}
$("#nextQ").onclick=()=>{$("#board").classList.remove("on");G.k++;if(G.k<G.qs.length){G.turn=(G.turn+1)%G.groups.length;loadQ()}else finish()};
$("#quit").onclick=()=>{if(confirm("إنهاء المسابقة والانتقال إلى منصة التتويج؟")){clearInterval(timer);finish()}};
function finish(){show("#sFinal");const order=[...G.groups].sort((a,b)=>b.s-a.s);const pod=$("#podium");pod.innerHTML="";
 const top=order.slice(0,3);const arrange=top.length===3?[top[1],top[0],top[2]]:[top[1],top[0]];const H={0:"min(34vh,260px)",1:"min(25vh,190px)",2:"min(18vh,140px)"};
 arrange.forEach(g=>{const r=order.indexOf(g);const rk=1+order.filter(o=>o.s>g.s).length;const d=document.createElement("div");d.className="pd";d.style.setProperty("--gc",g.c);d.innerHTML='<div class="nm">'+g.n+'</div><div class="sc">'+g.s+' نقطة</div><div class="blk">'+rk+'</div>';pod.appendChild(d);setTimeout(()=>d.querySelector(".blk").style.height=H[r],80+r*250)});
 $("#rest").innerHTML=order.slice(3).map(g=>'<span>'+(1+order.filter(o=>o.s>g.s).length)+'. '+g.n+' — '+g.s+'</span>').join("");
 SND.fin();confetti()}
$("#again").onclick=()=>show("#sSetup");$("#replay").onclick=()=>startGame();
/* ---------- calm confetti ---------- */
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=$("#confetti"),cx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
 const P=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,r:4+Math.random()*5,c:GC[Math.floor(Math.random()*GC.length)],vy:1+Math.random()*1.6,vx:-.5+Math.random(),a:Math.random()*6,va:.02+Math.random()*.04}));
 const end=performance.now()+6000;(function f(now){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a)*.6;p.a+=p.va;cx.globalAlpha=.85;cx.fillStyle=p.c;cx.beginPath();cx.ellipse(p.x,p.y,p.r,p.r*.6,p.a,0,7);cx.fill()});if(now<end)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})(performance.now())}
document.addEventListener("keydown",e=>{if(!$("#sGame").classList.contains("on"))return;if($("#board").classList.contains("on")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();$("#nextQ").click();return}
 const n=["1","2","3","4"].indexOf(e.key);if(n>=0&&!locked){const b=document.querySelectorAll(".opt")[n];b&&b.click()}});
</script></body></html>
