الأساسي الذي اشتققنا منه أوضاع اليوم؟\nالإجابة: الوقوف.\nس2 (مستوى التطبيق): أدِّ وضع (وقوف فتحًا).\nالإجابة: يقف والقدمان متباعدتان بعرض الحوض.\nس3 (مستوى الاستدلال): ما الفرق بين الوضع الأساسي والوضع المشتق؟\nالإجابة: المشتق وضع أساسي تغير فيه جزء من الجسم (رجل أو ذراع أو جذع).\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضع الوقوف الأساسي ثم الوقوف فتحًا وثبات الوسط ببطء، ويؤديها التلميذ معه، ثم ينادي «وقوف فتحًا!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتغيير جزء واحد من وضع أساسي (الجثو أو الجلوس أو الرقود) لابتكار وضع مشتق جديد، وتسميته وتعليمه لزميل.\n\nس4 (مستوى المعرفة): من أي وضع أساسي اشتققنا (جلوس طويل)؟\nالإجابة: الجلوس.\nس5 (مستوى التطبيق): أدِّ وضع (رقود. فتحًا).\nالإجابة: يرقد على الظهر والقدمان متباعدتان.\nس6 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين بالتبادل.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضع الوقوف الأساسي ثم الوقوف فتحًا وثبات الوسط ببطء، ويؤديها التلميذ معه، ثم ينادي «وقوف فتحًا!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتغيير جزء واحد من وضع أساسي (الجثو أو الجلوس أو الرقود) لابتكار وضع مشتق جديد، وتسميته وتعليمه لزميل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر وضعين مشتقين من الوقوف بتحريك الذراعين.\nالإجابة: وقوف الذراعان جانبًا، وقوف الذراعان عاليًا.\nس2 (مستوى التطبيق): أرفع بطاقة (وقوف. انحناء)، أدِّ الوضع.\nالإجابة: يثني الجذع أمامًا من الوقوف والركبتان مستقيمتان.\nس3 (مستوى الاستدلال): ابتكر وضعًا مشتقًا جديدًا من الوقوف وسمِّه.\nالإجابة: مثل: وقوف. ثبات الوسط. إحدى الرجلين أمامًا.\n\nس4 (مستوى المعرفة): اذكر الأوضاع الأساسية الأربعة التي اشتققنا منها أوضاع هذا الدرس.\nالإجابة: الوقوف، الجثو، الجلوس، الرقود.\nس5 (مستوى التطبيق): أرفع بطاقة (جثو نصفًا)، أدِّ الوضع.\nالإجابة: يرتكز على ركبة واحدة والقدم الأخرى أمامًا والساق عمودية.\nس6 (مستوى الاستدلال): لماذا تحافظ تمرينات الأوضاع على قوامنا؟\nالإجابة: لأنها تقوي عضلات الجذع والظهر فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الوقوف في دليل المعلم ص 33-35 واطلب منه أداء ثلاثة منها.\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا من وضع الجلوس الطويل وآخر من الرقود يوميًا (دليل المعلم ص 36-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=2"}}, {"title": "التمرينات الحرة", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 42-50", "n": 1, "periods": [{"focus": "التمرينات الحرة الفردية + التمرينات الحرة الزوجية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الحرة الفردية وأهميتها (5 دقائق)\n2. يؤدي تمرينات حرة فردية للذراعين والجذع والرجلين بالعد (10 دقائق)\n3. يميز بين التمرين الحر الفردي والتمرين بالأدوات (5 دقائق)\n4. يتعرف التمرينات الحرة الزوجية وشروط أدائها مع الزميل (5 دقائق)\n5. يؤدي تمرينات حرة زوجية بالتوافق مع الزميل (10 دقائق)\n6. يقدر أهمية التمرينات الحرة في المحافظة على اللياقة البدنية (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات\n- صورة توضيحية\n- أخرى: بطاقات مصورة للتمرينات الزوجية", "المفاهيم": "- التمرين الحر\n- التمرينات الحرة الفردية\n- الجذع\n- الإيقاع\n- التمرينات الحرة الزوجية\n- التوافق\n- الزميل\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: هل نحتاج إلى أدوات لنتمرن؟ ويؤدي تمرينًا بلا أدوات، ويوضح أن التمرينات التي تؤدى بالجسم فقط تسمى تمرينات حرة (ص 42-43).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم تحريك المفاصل، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج التمرينات الحرة الفردية من الدليل ص 43-45: (وقوف) تبادل رفع الذراعين عاليًا، (وقوف فتحًا) لف الجذع، (جلوس طويل) ثني الجذع أمامًا، (رقود) رفع الرجلين، بالعد الرباعي مع التفكير بصوت عالٍ، ويقلد التلميذ التمرينات بالعد ويذكر الجزء العامل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 ص 46: بطاقات تمرينات حرة؛ يؤدي كل تلميذ التمرين ويكتشف العضلة التي تعمل (يشعر بها) ويصنف البطاقات إلى ذراعين وجذع ورجلين، ويجرب التلميذ ويصنف البطاقات حسب الجزء العامل (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (العدد والتمرين) ص 50: ينادي المعلم تمرينًا ورقمًا، فيتجمع التلاميذ بعدد الرقم ويؤدون التمرين معًا، ويلعب التلميذ ويؤدي التمرين مع العدد الصحيح (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم مع تلميذ نماذج التمرينات الزوجية ص 47-48: (وقوف. جنبًا لجنب. الذراع الداخلية على كتف الزميل) مرجحة الرجل الخارجية، (جلوس طويل مواجه. مسك الأيدي) تبادل شد الجذع، (رقود. مواجه. مسك القدمين) الجلوس من الرقود؛ مع شرح التوقيت المشترك، ويؤدي التلميذ التمرينات مع زميله بالعد المشترك (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في أزواج بأدوار (قائد يعد، وزميل ينفذ ثم يتبادلان)، تؤدي كل مجموعة ثلاث بطاقات زوجية ثم تبتكر تمرينًا زوجيًا جديدًا وتعرضه، والتلاميذ يتعاون مع زميله ويبتكر تمرينًا زوجيًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (المرآة الزوجية): يؤدي أحد الزوجين تمرينًا حرًا ويقلده الآخر كالمرآة، وتفوز الثنائية الأدق، ويلعب التلميذ بدقة وتوافق (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة زوجية بالإطالة مع مساعدة الزميل، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – عدّ بأسماء الولايات: يؤدي الأزواج تمرينًا حرًا للذراعين والجذع والرجلين، ويعدّون بأسماء ثماني ولايات عمانية بدل الأرقام، ويتبادلون اختيار التمرين والولايات (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما التمرين الحر؟\nالإجابة: تمرين يؤدى بالجسم دون أدوات.\nس2 (مستوى التطبيق): اذكر تمرينًا حرًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (مستوى الاستدلال): كيف عرفت أن التمرين للرجلين؟\nالإجابة: لأنني شعرت بعمل عضلات الفخذين والساقين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرينًا حرًا للذراعين وآخر للجذع (لف الجذع من الوقوف فتحًا) ببطء بالعد، ثم يسأله: هل نحتاج إلى أدوات في التمرين الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين حر زوجي مع زميل للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد العضلات التي تعمل فيه.\n\nس4 (مستوى المعرفة): ما التمرين الزوجي؟\nالإجابة: تمرين يؤديه تلميذان معًا بالتوافق.\nس5 (مستوى التطبيق): أدِّ مع زميلك تمرين (جلوس طويل مواجه) تبادل شد الجذع.\nالإجابة: يؤديانه بالتوافق.\nس6 (مستوى الاستدلال): ماذا يحدث لو لم نعد معًا في التمرين الزوجي؟\nالإجابة: يختل التوافق وقد نسقط أو نؤذي الزميل.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرينًا حرًا للذراعين وآخر للجذع (لف الجذع من الوقوف فتحًا) ببطء بالعد، ثم يسأله: هل نحتاج إلى أدوات في التمرين الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين حر زوجي مع زميل للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد العضلات التي تعمل فيه.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تمرينًا حرًا للذراعين بالعد.\nالإجابة: يؤدي تبادل رفع الذراعين بالعد الرباعي.\nس2 (مستوى التطبيق): صنّف: (رقود) رفع الرجلين، لأي جزء هذا التمرين؟\nالإجابة: للرجلين (وعضلات البطن).\nس3 (مستوى الاستدلال): ما الفرق بين التمرين الحر والتمرين بالكرة؟\nالإجابة: التمرين الحر بلا أدوات، والتمرين بالكرة يستخدم أداة.\n\nس4 (مستوى المعرفة): اذكر تمرينًا زوجيًا للرجلين.\nالإجابة: مرجحة الرجل الخارجية من الوقوف جنبًا إلى جنب مع مسك كتف الزميل.\nس5 (مستوى التطبيق): ما شروط التمرين الزوجي الآمن؟\nالإجابة: العد معًا، والإمساك الصحيح، وعدم الشد بعنف.\nس6 (مستوى الاستدلال): لماذا تحافظ التمرينات الحرة على لياقتنا؟\nالإجابة: لأنها تقوي العضلات وتزيد المرونة دون الحاجة إلى أدوات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاثة تمرينات حرة (للذراعين والجذع والرجلين) بالعد صباحًا (دليل المعلم ص 43-46).\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا (الجلوس من الرقود مع مسك القدمين) 5 مرات (دليل المعلم ص 47-48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات ال  على اللعب.\n\n5. يؤدي المعلم مع تلميذ نماذج التمرينات الزوجية ص 47-48: (وقوف. جنبًا لجنب. الذراع الداخلية على كتف الزميل) مرجحة الرجل الخارجية، (جلوس طويل مواجه. مسك الأيدي) تبادل شد الجذع، (رقود. مواجه. مسك القدمين) الجلوس من الرقود؛ مع شرح التوقيت المشترك، ويؤدي التلميذ التمرينات مع زميله بالعد المشترك (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في أزواج بأدوار (قائد يعد، وزميل ينفذ ثم يتبادلان)، تؤدي كل مجموعة ثلاث بطاقات زوجية ثم تبتكر تمرينًا زوجيًا جديدًا وتعرضه، والتلاميذ يتعاون مع زميله ويبتكر تمرينًا زوجيًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (المرآة الزوجية): يؤدي أحد الزوجين تمرينًا حرًا ويقلده الآخر كالمرآة، وتفوز الثنائية الأدق، ويلعب التلميذ بدقة وتوافق (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة زوجية بالإطالة مع مساعدة الزميل، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – عدّ بأسماء الولايات: يؤدي الأزواج تمرينًا حرًا للذراعين والجذع والرجلين، ويعدّون بأسماء ثماني ولايات عمانية بدل الأرقام، ويتبادلون اختيار التمرين والولايات (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما التمرين الحر؟\nالإجابة: تمرين يؤدى بالجسم دون أدوات.\nس2 (مستوى التطبيق): اذكر تمرينًا حرًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (مستوى الاستدلال): كيف عرفت أن التمرين للرجلين؟\nالإجابة: لأنني شعرت بعمل عضلات الفخذين والساقين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرينًا حرًا للذراعين وآخر للجذع (لف الجذع من الوقوف فتحًا) ببطء بالعد، ثم يسأله: هل نحتاج إلى أدوات في التمرين الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين حر زوجي مع زميل للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد العضلات التي تعمل فيه.\n\nس4 (مستوى المعرفة): ما التمرين الزوجي؟\nالإجابة: تمرين يؤديه تلميذان معًا بالتوافق.\nس5 (مستوى التطبيق): أدِّ مع زميلك تمرين (جلوس طويل مواجه) تبادل شد الجذع.\nالإجابة: يؤديانه بالتوافق.\nس6 (مستوى الاستدلال): ماذا يحدث لو لم نعد معًا في التمرين الزوجي؟\n ضمن قصة حركية وطنية (10 دقائق)\n5. يستنتج القيم الوطنية والسلوكيات الواردة في القصة (5 دقائق)\n6. يشعر بالسعادة والانتماء أثناء أداء القصة مع زملائه (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: بطاقات صور مهن ومواقف\n- أخرى: أطواق\n- أخرى: مراتب\n- صورة توضيحية\n- أخرى: أقماع\n- أخرى: حبال", "المفاهيم": "- التمرين التمثيلي\n- التقليد\n- المهن\n- الأوضاع الحركية\n- القصة الحركية\n- الانتماء للوطن\n- التعاون\n- الحركات الأساسية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور مهن (الصياد يجدف، الفلاح يحصد، البنّاء يرفع الطوب) ويسأل: كيف نمثل عمل كل منهم بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء تمثيلي بنموذج المعلم: المشي كالجمل، الجري كالغزال، الوثب كالقرد، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ويؤدي النموذج: من الوقوف (الصياد يرمي الشبكة: مرجحة الذراعين)، من الجثو (الفلاح يزرع: ثني الجذع أمامًا)، من الجلوس (التجديف: ثني ومد الذراعين)، ويؤدي التلاميذ مع صوته (ص 52-53)، ويؤدي التلميذ التمرين التمثيلي من الوضع المحدد مع الإيقاع (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (خمّن المهنة): تسحب كل مجموعة بطاقة مهنة وتمثل حركتها بالتمرين، وتخمن المجموعات الأخرى، ويمثل التلميذ مع مجموعته ويخمن (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يبتكر الزوجان تمرينًا تمثيليًا لمهنة عمانية (صيد السمك، جني التمور) ويعرضانه، ويبتكر التلميذ ويعرض (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يسرد المعلم القصة ويؤدي النموذج: نصعد الجبل (مشي بطيء ورفع الركبتين)، نعبر الوادي (وثب فوق الحبال)، نمر بالممر الضيق (مشي على الخط)، نصعد درج القلعة (حجل)، نرفع العلم (مد الذراعين عاليًا)، نعود بالجري الخفيف (ص 54-55)، ويؤدي التلميذ الحركات مع السرد (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في مجموعات، تضيف كل مجموعة مشهدًا جديدًا للقصة (مثل مساعدة زائر ضل الطريق) وتعرضه بالحركة، ويبتكر التلميذ المشهد مع مجموعته ويعرضه (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. حوار: ماذا تعلمنا من الرحلة؟ وما شعورنا عند رفع العلم؟ ليستنتج التلاميذ قيم الانتماء والتعاون، ويستنتج التلميذ ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة بالتنفس كأننا نتأمل المنظر من القلعة، ويؤدي التلميذ التهدئة (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – مهن من بلادي: تمثل كل مجموعة مهنة عمانية تقليدية كالصياد وصانع الفخار ونجار السفن ومزارع النخيل، ويخمن الآخرون المهنة ويذكرون فائدتها لأهل البلد (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): من أي وضع مثلنا التجديف؟\nالإجابة: من الجلوس.\nس2 (مستوى التطبيق): ما الحركة التي تمثل رمي الصياد للشبكة؟\nالإجابة: مرجحة الذراعين من الوقوف.\nس3 (مستوى الاستدلال): لماذا نمثل المهن بالتمرينات؟\nالإجابة: لنتعرف المهن ونحرك أجزاء الجسم بطريقة ممتعة.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ حركة التجديف من الجلوس ورمي الصياد للشبكة من الوقوف ببطء، ثم يطلب منه تمثيل رمي الشبكة وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار تمرين تمثيلي لمهنة يختارونها (المزارع أو النجار أو الإطفائي) من وضع مناسب، وتعليمه لزملائهم وذكر الوضع الذي بدؤوا منه.\n\nس4 (مستوى المعرفة): ما الحركة التي أديناها عند عبور الوادي؟\nالإجابة: الوثب فوق الحبال.\nس5 (مستوى التطبيق): كيف صعدنا درج القلعة؟\nالإجابة: بالحجل.\nس6 (مستوى الاستدلال): ماذا فعلنا عندما ضل الزائر الطريق في مشهد المجموعة؟\nالإجابة: ساعدناه وأرشدناه إلى الطريق.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ حركة التجديف من الجلوس ورمي الصياد للشبكة من الوقوف ببطء، ثم يطلب منه تمثيل رمي الشبكة وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار تمرين تمثيلي لمهنة يختارونها (المزارع أو النجار أو الإطفائي) من وضع مناسب، وتعليمه لزملائهم وذكر الوضع الذي بدؤوا منه.", "التقويم الختامي": "س1 (مستوى المعرفة): مثّل حركة الفلاح وهو يزرع.\nالإجابة: يثني الجذع أمامًا من الجثو ويحرك اليدين.\nس2 (مستوى التطبيق): اذكر مهنة عمانية ابتكرت لها تمرينًا.\nالإجابة: صيد السمك أو جني التمور.\nس3 (مستوى الاستدلال): أي الأوضاع استخدمت في تمثيلك ولماذا؟\nالإجابة: يذكر الوضع ويعلل بأنه يناسب حركة المهنة.\n\nس4 (مستوى المعرفة): اذكر أربع حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب، الحجل.\nس5 (مستوى التطبيق): ما القيمة التي شعرت بها عند رفع العلم؟\nالإجابة: الانتماء وحب الوطن.\nس6 (مستوى الاستدلال): ابتكر حركة لمشهد جديد في القصة.\nالإجابة: يذكر مشهدًا وحركته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اطلب من طفلك تمثيل مهنتك بالحركة، وراجعا صور التمرينات التمثيلية في دليل المعلم ص 52-53.\nإرشاد لولي الأمر: تحدث مع طفلك عن قلعة أو حصن في محافظتكم، ومثّلا معًا رحلة قصيرة بالحركات (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات التمثيلية من أوضاع مختلفة (الوقوف، الجثو، الجلوس) (10 دقائق)\n2. يؤدي تمرينات تمثيلية لمواقف من الحياة اليومية والمهن (5 دقائق)\n3. يبتكر تمرينًا تمثيليًا لمهنة يختارها (5 دقائق)\n4. يؤدي الحركات الأساسية (مشي، جري، وثب، حجل) ضمن قصة حركية وطنية (10 دقائق)\n5. يستنتج القيم الوطنية والسلوكيات الواردة في القصة (5 دقائق)\n6. يشعر بالسعادة والانتماء أثناء أداء القصة مع زملائه (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: بطاقات صور مهن ومواقف\n- أخرى: أطواق\n- أخرى: مراتب\n- صورة توضيحية\n- أخرى: أقماع\n- أخرى: حبال", "المفاهيم": "الحصة 1:\n- التمرين التمثيلي\n- التقليد\n- المهن\n- الأوضاع الحركية\n- القصة الحركية\n- الانتماء للوطن\n- التعاون\n- الحركات الأساسية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور مهن (الصياد يجدف، الفلاح يحصد، البنّاء يرفع الطوب) ويسأل: كيف نمثل عمل كل منهم بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء تمثيلي بنموذج المعلم: المشي كالجمل، الجري كالغزال، الوثب كالقرد، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ويؤدي النموذج: من الوقوف (الصياد يرمي الشبكة: مرجحة الذراعين)، من الجثو (الفلاح يزرع: ثني الجذع أمامًا)، من الجلوس (التجديف: ثني ومد الذراعين)، ويؤدي التلاميذ مع صوته (ص 52-53)، ويؤدي التلميذ التمرين التمثيلي من الوضع المحدد مع الإيقاع (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (خمّن المهنة): تسحب كل مجموعة بطاقة مهنة وتمثل حركتها بالتمرين، وتخمن المجموعات الأخرى، ويمثل التلميذ مع مجموعته ويخمن (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يبتكر الزوجان تمرينًا تمثيليًا لمهنة عمانية (صيد السمك، جني التمور) ويعرضانه، ويبتكر التلميذ ويعرض (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يسرد المعلم القصة ويؤدي النموذج: نصعد الجبل (مشي بطيء ورفع الركبتين)، نعبر الوادي (وثب فوق الحبال)، نمر بالممر الضيق (مشي على الخط)، نصعد درج القلعة (حجل)، نرفع العلم (مد الذراعين عاليًا)، نعود بالجري الخفيف (ص 54-55)، ويؤدي التلميذ الحركات مع السرد (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في مجموعات، تضيف كل مجموعة مشهدًا جديدًا للقصة (مثل مساعدة زائر ضل الطريق) وتعرضه بالحركة، ويبتكر التلميذ المشهد مع مجموعته ويعرضه (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. حوار: ماذا تعلمنا من الرحلة؟ وما شعورنا عند رفع العلم؟ ليستنتج التلاميذ قيم الانتماء والتعاون، ويستنتج التلميذ ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة بالتنفس كأننا نتأمل المنظر من القلعة، ويؤدي التلميذ التهدئة (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – مهن من بلادي: تمثل كل مجموعة مهنة عمانية تقليدية كالصياد وصانع الفخار ونجار السفن ومزارع النخيل، ويخمن الآخرون المهنة ويذكرون فائدتها لأهل البلد (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): من أي وضع مثلنا التجديف؟\nالإجابة: من الجلوس.\nس2 (مستوى التطبيق): ما الحركة التي تمثل رمي الصياد للشبكة؟\nالإجابة: مرجحة الذراعين من الوقوف.\nس3 (مستوى الاستدلال): لماذا نمثل المهن
