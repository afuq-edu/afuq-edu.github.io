: التعلم التعاوني\n- المعلم: محطات مراجعة بأربع مجموعات: محطة الدحرجة والالتقاط في أزواج، محطة الرمي والاستلام، محطة الركل والإيقاف بين قمعين، محطة الوثب والحجل داخل الأطواق، مع التبديل كل 4 دقائق وتسجيل القائد لأفضل أداء.\n- الطالب: يؤدي مهمة المحطة ويساعد زملاءه ويبدل بنظام.\n\nالنشاط 3 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الكرة النارية) بالدحرجة لمراجعة الدحرجة والتوافق.\n- الطالب: يلعب ملتزمًا بالدحرجة على الأرض.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يسأل المعلم كل تلميذ: أي مهارة تحتاج إلى تدريب أكثر؟ ويسجل التلميذ إجابته ذهنيًا ليتدرب عليها في المنزل.\n- الطالب: يحدد المهارة التي يحتاج إلى تطويرها.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نلتقط الكرة المتدحرجة؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس2 (المستوى المتوقع): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس3 (المستوى المتقدم): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا والحجل بقدم واحدة.", "التقويم الختامي": "س1 (مستوى الدعم): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (المستوى المتوقع): اذكر محطتين من محطات المراجعة.\nالإجابة: محطة الدحرجة ومحطة الركل (أو الرمي، الوثب).\nس3 (المستوى المتقدم): ما المهارة التي قررت أن تتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر المهارة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على التدرب على المهارة التي اختارها (دحرجة أو رمي أو ركل) 10 دقائق يوميًا في مكان آمن."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتذكر قواعد الأمن والسلامة والتشكيلات الرياضية التي تعلمها في الصف الأول.\n2. يؤدي تمرينات إعداد بدني للذراعين والرجلين من نماذج الدليل.\n3. يلتزم بالنظام أثناء الانتقال بين التشكيلات.\n\nالحصة 2:\n1. يؤدي المشي والجري والوثب والحجل في مسار مراجعة.\n2. يؤدي دحرجة الكرة ورميها وركلها بالطريقة الصحيحة.\n3. يقيّم أداءه في المهارات السابقة ويحدد ما يحتاج إلى تدريب.", "المستوى ا النمذجة\n- المعلم: تلخيص: لماذا نبدأ الحصة بالإعداد البدني؟ ونموذج التنفس العميق.\n- الطالب: يجيب ويؤدي التنفس.\n\nالحصة 2:\nالنشاط 1 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: مشي، جري، وثب فوق الحبال، حجل بين الأقماع.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات مراجعة بأربع مجموعات: محطة الدحرجة والالتقاط في أزواج، محطة الرمي والاستلام، محطة الركل والإيقاف بين قمعين، محطة الوثب والحجل داخل الأطواق، مع التبديل كل 4 دقائق وتسجيل القائد لأفضل أداء.\n- الطالب: يؤدي مهمة المحطة ويساعد زملاءه ويبدل بنظام.\n\nالنشاط 3 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الكرة النارية) بالدحرجة لمراجعة الدحرجة والتوافق.\n- الطالب: يلعب ملتزمًا بالدحرجة على الأرض.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يسأل المعلم كل تلميذ: أي مهارة تحتاج إلى تدريب أكثر؟ ويسجل التلميذ إجابته ذهنيًا ليتدرب عليها في المنزل.\n- الطالب: يحدد المهارة التي يحتاج إلى تطويرها.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (المستوى المتوقع): لماذا نؤدي الإعداد البدني في بداية الحصة؟\nالإجابة: لتسخين العضلات والاستعداد للحركة ومنع الإصابة.\nس3 (المستوى المتقدم): اذكر تمرينًا للذراعين أديناه اليوم.\nالإجابة: تبادل دوران الذراعين أمامًا وخلفًا.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف نلتقط الكرة المتدحرجة؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس2 (المستوى المتوقع): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس3 (المستوى المتقدم): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا والحجل بقدم واحدة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر قاعدتين من قواعد الأمن والسلامة في الحصة.\nالإجابة: الاستجابة للصافرة، وعدم الدفع أو التصادم.\nس2 (المستوى المتوقع): أدِّ تمرينًا للرجلين بالعد من 1 إلى 4.\nالإجابة: يثني الركبتين ويمدهما بالعد.\nس3 (المستوى المتقدم): كيف تنتقل مجموعتك من الصف إلى الدائرة بنظام؟\nالإجابة: يشبك التلاميذ أيديهم ويتحركون بهدوء حتى تكتمل الدائرة.\n\nالحصة 2:\nس1 (مستوى الدعم): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (المستوى المتوقع): اذكر محطتين من محطات المراجعة.\nالإجابة: محطة الدحرجة ومحطة الركل (أو الرمي، الوثب).\nس3 (المستوى المتقدم): ما المهارة التي قررت أن تتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر المهارة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من تجهيز الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم ص 22.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على التدرب على المهارة التي اختارها (دحرجة أو رمي أو ركل) 10 دقائق يوميًا في مكان آمن."}}, {"title": "الأوضاع المشتقة في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 32-41", "n": 2, "periods": [{"focus": "الأوضاع المشتقة من الوقوف", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الوقوف (فتحًا، انحناء، ثبات الوسط، الذراعان جانبًا).\n2. يميز بين الوضع الأساسي والوضع المشتق.\n3. يؤدي أوضاعًا مشتقة من الوقوف بدقة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- التمرين\n- الوضع الأساسي\n- الوضع المشتق\n- الوقوف\n- الجذع", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم في وضع الوقوف الأساسي ثم يفتح رجليه ويسأل: ماذا تغير؟ ويشرح أن ما تغير يسمى وضعًا مشتقًا من الوقوف (ص 32-33).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم تمرينات للذراعين والرجلين من الوقوف.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج الأوضاع المشتقة من الوقوف بتحريك الرجلين (وقوف فتحًا، وقوف إحدى الرجلين أمامًا) وبتحريك الذراعين (الذراعان جانبًا، عاليًا، ثبات الوسط) وبتحريك الجذع (انحناء) مع التفكير بصوت عالٍ (ص 33-35)، ثم تطبيق موجه بالبطاقات.\n- الطالب: يقلد كل وضع ويسمّيه ويصحح زميله من البطاقة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعطي المعلم كل زوج بطاقة وضع أساسي ويطلب ابتكار ثلاثة أوضاع مشتقة منه بتحريك جزء واحد فقط، ثم يستنتج التلاميذ أن الوضع المشتق = وضع أساسي + تغيير في جزء.\n- الطالب: يبتكر الأوضاع مع زميله ويصوغ الاستنتاج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (تمثال الأوضاع): جري حر وعند نداء (وقوف فتحًا) أو (وقوف الذراعان جانبًا) يثبت التلميذ في الوضع داخل أقرب طوق.\n- الطالب: يستجيب بالوضع الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الجذع والذراعين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الوضع الأساسي الذي اشتققنا منه أوضاع اليوم؟\nالإجابة: الوقوف.\nس2 (المستوى المتوقع): أدِّ وضع (وقوف فتحًا).\nالإجابة: يقف والقدمان متباعدتان بعرض الحوض.\nس3 (المستوى المتقدم): ما الفرق بين الوضع الأساسي والوضع المشتق؟\nالإجابة: المشتق وضع أساسي تغير فيه جزء من الجسم (رجل أو ذراع أو جذع).", "التقويم الختامي": "س1 (مستوى الدعم): اذكر وضعين مشتقين من الوقوف بتحريك الذراعين.\nالإجابة: وقوف الذراعان جانبًا، وقوف الذراعان عاليًا.\nس2 (المستوى المتوقع): أرفع بطاقة (وقوف. انحناء)، أدِّ الوضع.\nالإجابة: يثني الجذع أمامًا من الوقوف والركبتان مستقيمتان.\nس3 (المستوى المتقدم): ابتكر وضعًا مشتقًا جديدًا من الوقوف وسمِّه.\nالإجابة: مثل: وقوف. ثبات الوسط. إحدى الرجلين أمامًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الوقوف في دليل المعلم ص 33-35 واطلب منه أداء ثلاثة منها."}}, {"focus": "الأوضاع المشتقة من الجثو والجلوس والرقود والتمرين منها", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الجثو والجلوس والرقود.\n2. يؤدي تمرينات من الأوضاع المشتقة بالعد.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم.", "المستوى المعرفي": "الم لتبادل.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر الأوضاع الأساسية الأربعة التي اشتققنا منها أوضاع هذا الدرس.\nالإجابة: الوقوف، الجثو، الجلوس، الرقود.\nس2 (المستوى المتوقع): أرفع بطاقة (جثو نصفًا)، أدِّ الوضع.\nالإجابة: يرتكز على ركبة واحدة والقدم الأخرى أمامًا والساق عمودية.\nس3 (المستوى المتقدم): لماذا تحافظ تمرينات الأوضاع على قوامنا؟\nالإجابة: لأنها تقوي عضلات الجذع والظهر فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا من وضع الجلوس الطويل وآخر من الرقود يوميًا (دليل المعلم ص 36-40)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الأوضاع المشتقة من الوقوف (فتحًا، انحناء، ثبات الوسط، الذراعان جانبًا).\n2. يميز بين الوضع الأساسي والوضع المشتق.\n3. يؤدي أوضاعًا مشتقة من الوقوف بدقة.\n\nالحصة 2:\n1. يتعرف الأوضاع المشتقة من الجثو والجلوس والرقود.\n2. يؤدي تمرينات من الأوضاع المشتقة بالعد.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: كرات\n- أخرى: مقاعد سويدية\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- التمرين\n- الوضع الأساسي\n- الوضع المشتق\n- الوقوف\n- الجذع\n\nالحصة 2:\n- الجثو\n- الجلوس\n- الرقود\n- الوضع المشتق\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف المعلم في وضع الوقوف الأساسي ثم يفتح رجليه ويسأل: ماذا تغير؟ ويشرح أن ما تغير يسمى وضعًا مشتقًا من الوقوف (ص 32-33).\n\nالحصة 2:\nيراجع المعلم أوضاع الحصة السابقة بالنداء، ثم يجثو ويمد رجلًا جانبًا ويسأل: من أي وضع أساسي اشتققت هذا الوضع؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم تمرينات للذراعين والرجلين من الوقوف.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج الأوضاع المشتقة من الوقوف بتحريك الرجلين (وقوف فتحًا، وقوف إحدى الرجلين أمامًا) وبتحريك الذراعين (الذراعان جانبًا، عاليًا، ثبات الوسط) وبتحريك الجذع (انحناء) مع التفكير بصوت عالٍ (ص 33-35)، ثم تطبيق موجه بالبطاقات.\n- الطالب: يقلد كل وضع ويسمّيه ويصحح زميله من البطاقة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعطي المعلم كل زوج بطاقة وضع أساسي ويطلب ابتكار ثلاثة أوضاع مشتقة منه بتحريك جزء واحد فقط، ثم يستنتج التلاميذ أن الوضع المشتق = وضع أساسي + تغيير في جزء.\n- الطالب: يبتكر الأوضاع مع زميله ويصوغ الاستنتاج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (تمثال الأوضاع): جري حر وعند نداء (وقوف فتحًا) أو (وقوف الذراعان جانبًا) يثبت التلميذ في الوضع داخل أقرب طوق.\n- الطالب: يستجيب بالوضع الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الجذع والذراعين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ثم أوضاع مشتقة من الوقوف بالنداء.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج: (جثو. انحناء جانبًا)، (جثو. فتحًا)، (جثو نصفًا)، (جلوس طويل)، (جلوس تربيع. الذراعان جانبًا)، (رقود. فتحًا) مع النقاط الفنية (ص 36-38)، ثم تمرين بسيط من كل وضع بالعد.\n- الطالب: يقلد الأوضاع ويؤدي التمرين بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الأوضاع المشتقة بأربع مجموعات: محطة الجثو (ثني الجذع جانبًا)، محطة الجلوس الطويل (مد الذراعين للقدمين)، محطة الرقود (رفع الرجلين بالتبادل)، محطة المقعد (جلوس على المقعد ومد الرجلين)، مع التبديل.\n- الطالب: تؤدي المجموعة تمرين محطتها بالوضع الصحيح وتنتقل بنظام.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب الأوضاع المشتقة) ص 41: يجري التلاميذ في محيط دائرة وعند النداء يؤدي كل تلميذ الوضع المحدد داخل طوق، ومن لا يجد طوقًا يصبح مناديًا.\n- الطالب: يلعب ويؤدي الوضع بسرعة ودقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة من وضع الرقود مع التنفس، وحوار عن فائدة التمرينات للقوام.\n- الطالب: يؤدي التهدئة ويذكر فائدة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الوضع الأساسي الذي اشتققنا منه أوضاع اليوم؟\nالإجابة: الوقوف.\nس2 (المستوى المتوقع): أدِّ وضع (وقوف فتحًا).\nالإجابة: يقف والقدمان متباعدتان بعرض الحوض.\nس3 (المستوى المتقدم): ما الفرق بين الوضع الأساسي والوضع المشتق؟\nالإجابة: المشتق وضع أساسي تغير فيه جزء من الجسم (رجل أو ذراع أو جذع).\n\nالحصة 2:\nس1 (مستوى الدعم): من أي وضع أساسي اشتققنا (جلوس طويل)؟\nالإجابة: الجلوس.\nس2 (المستوى المتوقع): أدِّ وضع (رقود. فتحًا).\nالإجابة: يرقد على الظهر والقدمان متباعدتان.\nس3 (المستوى المتقدم): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين بالتبادل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر وضعين مشتقين من الوقوف بتحريك الذراعين.\nالإجابة: وقوف الذراعان جانبًا، وقوف الذراعان عاليًا.\nس2 (المستوى المتوقع): أرفع بطاقة (وقوف. انحناء)، أدِّ الوضع.\nالإجابة: يثني الجذع أمامًا من الوقوف والركبتان مستقيمتان.\nس3 (المستوى المتقدم): ابتكر وضعًا مشتقًا جديدًا من الوقوف وسمِّه.\nالإجابة: مثل: وقوف. ثبات الوسط. إحدى الرجلين أمامًا.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر الأوضاع الأساسية الأربعة التي اشتققنا منها أوضاع هذا الدرس.\nالإجابة: الوقوف، الجثو، الجلوس، الرقود.\nس2 (المستوى المتوقع): أرفع بطاقة (جثو نصفًا)، أدِّ الوضع.\nالإجابة: يرتكز على ركبة واحدة والقدم الأخرى أمامًا والساق عمودية.\nس3 (المستوى المتقدم): لماذا تحافظ تمرينات الأوضاع على قوامنا؟\nالإجابة: لأنها تقوي عضلات الجذع والظهر فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الوقوف في دليل المعلم ص 33-35 واطلب منه أداء ثلاثة منها.\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا من وضع الجلوس الطويل وآخر من الرقود يوميًا (دليل ا التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما التمرين الحر؟\nالإجابة: تمرين يؤدى بالجسم دون أدوات.\nس2 (المستوى المتوقع): اذكر تمرينًا حرًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (المستوى المتقدم): كيف عرفت أن التمرين للرجلين؟\nالإجابة: لأنني شعرت بعمل عضلات الفخذين والساقين.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تمرينًا حرًا للذراعين بالعد.\nالإجابة: يؤدي تبادل رفع الذراعين بالعد الرباعي.\nس2 (المستوى المتوقع): صنّف: (رقود) رفع الرجلين، لأي جزء هذا التمرين؟\nالإجابة: للرجلين (وعضلات البطن).\nس3 (المستوى المتقدم): ما الفرق بين التمرين الحر والتمرين بالكرة؟\nالإجابة: التمرين الحر بلا أدوات، والتمرين بالكرة يستخدم أداة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاثة تمرينات حرة (للذراعين والجذع والرجلين) بالعد صباحًا (دليل المعلم ص 43-46)."}}, {"focus": "التمرينات الحرة الزوجية", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الحرة الزوجية وشروط أدائها مع الزميل.\n2. يؤدي تمرينات حرة زوجية بالتوافق مع الزميل.\n3. يقدر أهمية التمرينات الحرة في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات الزوجية", "المفاهيم": "- التمرينات الحرة الزوجية\n- التوافق\n- الزميل\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الحصة السابقة بالنداء، ثم يؤدي مع تلميذ تمرينًا زوجيًا (جلوس طويل مواجه، تبادل شد الذراعين) ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم في أزواج: جري جنبًا إلى جنب ومرجحات.\n- الطالب: يقلد مع زميله.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ نماذج التمرينات الزوجية ص 47-48: (وقوف. جنبًا لجنب. الذراع الداخلية على كتف الزميل) مرجحة الرجل الخارجية، (جلوس طويل مواجه. مسك الأيدي) تبادل شد الج \nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات الزوجية", "المفاهيم": "الحصة 1:\n- التمرين الحر\n- التمرينات الحرة الفردية\n- الجذع\n- الإيقاع\n\nالحصة 2:\n- التمرينات الحرة الزوجية\n- التوافق\n- الزميل\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: هل نحتاج إلى أدوات لنتمرن؟ ويؤدي تمرينًا بلا أدوات، ويوضح أن التمرينات التي تؤدى بالجسم فقط تسمى تمرينات حرة (ص 42-43).\n\nالحصة 2:\nيراجع المعلم تمرينات الحصة السابقة بالنداء، ثم يؤدي مع تلميذ تمرينًا زوجيًا (جلوس طويل مواجه، تبادل شد الذراعين) ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم تحريك المفاصل.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج التمرينات الحرة الفردية من الدليل ص 43-45: (وقوف) تبادل رفع الذراعين عاليًا، (وقوف فتحًا) لف الجذع، (جلوس طويل) ثني الجذع أمامًا، (رقود) رفع الرجلين، بالعد الرباعي مع التفكير بصوت عالٍ.\n- الطالب: يقلد التمرينات بالعد ويذكر الجزء العامل.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 2 ص 46: بطاقات تمرينات حرة؛ يؤدي كل تلميذ التمرين ويكتشف العضلة التي تعمل (يشعر بها) ويصنف البطاقات إلى ذراعين وجذع ورجلين.\n- الطالب: يجرب ويصنف البطاقات حسب الجزء العامل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (العدد والتمرين) ص 50: ينادي المعلم تمرينًا ورقمًا، فيتجمع التلاميذ بعدد الرقم ويؤدون التمرين معًا.\n- الطالب: يلعب ويؤدي التمرين مع العدد الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة فردية.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم في أزواج: جري جنبًا إلى جنب ومرجحات.\n- الطالب: يقلد مع زميله.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ نماذج التمرينات الزوجية ص 47-48: (وقوف. جنبًا لجنب. الذراع الداخلية على كتف الزميل) مرجحة الرجل الخارجية، (جلوس طويل مواجه. مسك الأيدي) تبادل شد الجذع، (رقود. مواجه. مسك القدمين) الجلوس من الرقود؛ مع شرح التوقيت المشترك.\n- الطالب: يؤدي التمرينات مع زميله بالعد المشترك.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج بأدوار (قائد يعد، وزميل ينفذ ثم يتبادلان)، تؤدي كل مجموعة ثلاث بطاقات زوجية ثم تبتكر تمرينًا زوجيًا جديدًا وتعرضه.\n- الطالب: يتعاون مع زميله ويبتكر تمرينًا زوجيًا.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المرآة الزوجية): يؤدي أحد الزوجين تمرينًا حرًا ويقلده الآخر كالمرآة، وتفوز الثنائية الأدق.\n- الطالب: يلعب بدقة وتوافق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة زوجية بالإطالة مع مساعدة الزميل.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما التمرين الحر؟\nالإجابة: تمرين يؤدى بالجسم دون أدوات.\nس2 (المستوى المتوقع): اذكر تمرينًا حرًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (المستوى المتقدم): كيف عرفت أن التمرين للرجلين؟\nالإجابة: لأنني شعرت بعمل عضلات الفخذين والساقين.\n\nالحصة 2:\nس1 (مستوى الدعم): ما التمرين الزوجي؟\nالإجابة: تمرين يؤديه تلميذان معًا بالتوافق.\nس2 (المستوى المتوقع): أدِّ مع زميلك تمرين (جلوس طويل مواجه) تبادل شد الجذع.\nالإجابة: يؤديانه بالتوافق.\nس3 (المستوى المتقدم): ماذا يحدث لو لم نعد معًا في التمرين الزوجي؟\nالإجابة: يختل التوافق وقد نسقط أو نؤذي الزميل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ تمرينًا حرًا للذراعين بالعد.\nالإجابة: يؤدي تبادل رفع الذراعين بالعد الرباعي.\nس2 (المستوى المتوقع): صنّف: (رقود) رفع الرجلين، لأي جزء هذا التمرين؟\nالإجابة: للرجلين (وعضلات البطن).\nس3 (المستوى المتقدم): ما الفرق بين التمرين الحر والتمرين بالكرة؟\nالإجابة: التمرين الحر بلا أدوات، والتمرين بالكرة يستخدم أداة.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر تمرينًا زوجيًا للرجلين.\nالإجابة: مرجحة الرجل الخارجية من الوقوف جنبًا إلى جنب مع مسك كتف الزميل.\nس2 (المستوى المتوقع): ما شروط التمرين الزوجي الآمن؟\nالإجابة: العد معًا، والإمساك الصحيح، وعدم الشد بعنف.\nس3 (المستوى المتقدم): لماذا تحافظ التمرينات الحرة على لياقتنا؟\nالإجابة: لأنها تقوي العضلات وتزيد المرونة دون الحاجة إلى أدوات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاثة تمرينات حرة (للذراعين والجذع والرجلين) بالعد صباحًا (دليل المعلم ص 43-46).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا (الجلوس من الرقود مع مسك القدمين) 5 مرات (دليل المعلم ص 47-48)."}}, {"title": "التمثيل الحركي", "unit": "التمرينات (أتمرن بنظام)", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 51-56", "n": 2, "periods": [{"focus": "التمرينات التمثيلية من أوضاع حركية مختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات التمثيلية من أوضاع مختلفة (الوقوف، الجثو، الجلوس).\n2. يؤدي تمرينات تمثيلية لمواقف من الحياة اليومية والمهن.\n3. يبتكر تمرينًا تمثيليًا لمهنة يختارها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: بطاقات صور مهن ومواقف\n- أخرى: أطواق\n- أخرى: مراتب\n- صورة توضيحية", "المفاهيم": "- التمرين التمثيلي\n- التقليد\n- المهن\n- الأوضاع الحركية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور مهن (الصياد يجدف، الفلاح يحصد، البنّاء يرفع الطوب) ويسأل: كيف نمثل عمل كل منهم بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء تمثيلي بنموذج المعلم: المشي كالجمل، الجري كالغزال، الوثب كالقرد.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم الموقف ويؤدي النموذج: من الوقوف (الصياد يرمي الشبكة: مرجحة الذراعين)، من الجثو (الفلاح يزرع: ثني الجذع أمامًا)، من الجلوس (التجديف: ثني ومد الذراعين)، ويؤدي التلاميذ مع صوته (ص 52-53).\n- الطالب: يؤدي التمرين التمثيلي من الوضع المحدد مع الإيقاع.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (خمّن المهنة): تسحب كل مجموعة بطاقة مهنة وتمثل حركتها بالتمرين، وتخمن المجموعات الأخرى.\n- الطالب: يمثل مع مجموعته ويخمن.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج، يبتكر الزوجان تمرينًا تمثيليًا لمهنة عمانية (صيد السمك، جني التمور) ويعرضانه.\n- الطالب: يبتكر ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة تمثيلية: الشمس تغرب ببطء.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أي وضع مثلنا التجديف؟\nالإجابة: من الجلوس.\nس2 (المستوى المتوقع): ما الحركة التي تمثل رمي الصياد للشبكة؟\nالإجابة: مرجحة الذراعين من الوقوف.\nس3 (المستوى المتقدم): لماذا نمثل المهن بالتمرينات؟\nالإجابة: لنتعرف المهن ونحرك أجزاء الجسم بطريقة ممتعة.", "التقويم الختامي": "س1 (مستوى الدعم): مثّل حركة الفلاح وهو يزرع.\nالإجابة: يثني الجذع أمامًا من الجثو ويحرك اليدين.\nس2 (المستوى المتوقع): اذكر مهنة عمانية ابتكرت لها تمرينًا.\nالإجابة: صيد السمك أو جني التمور.\nس3 (المستوى المتقدم): أي الأوضاع استخدمت في تمثيلك ولماذا؟\nالإجابة: يذكر الوضع ويعلل بأنه يناسب حركة المهنة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اطلب من طفلك تمثيل مهنتك بالحركة، وراجعا صور التمرينات التمثيلية في دليل المعلم ص 52-53."}}, {"focus": "القصة الحركية (قصة وطنية: رحلة إلى قلعة)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الحركات الأساسية (مشي، جري، وثب، حجل) ضمن قصة حركية وطنية.\n2. يستنتج القيم الوطنية والسلوكيات الواردة في القصة.\n3. يشعر بالسعادة والانتماء أثناء أداء القصة مع زملائه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: حبال\n- صورة توضيحية", "المفاهيم": "- القصة الحركية\n- الانتماء للوطن\n- التعاون\n- الحركات الأساسية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة قلعة عمانية ويسأل: من زار قلعة؟ ثم يقول: اليوم نذهب في رحلة إلى القلعة بأجسامنا!", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء على شكل بداية القصة: نستعد للرحلة (تمطي)، نحمل الحقائب (ثني ومد)، نمشي إلى الحافلة.\n- الطالب: يقلد.\n\nالنشاط 2 (18 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يسرد المعلم القصة ويؤدي النموذج: نصعد الجبل (مشي بطيء ورفع الركبتين)، نعبر الوادي (وثب فوق الحبال)، نمر بالممر الضيق (مشي على الخط)، نصعد درج القلعة (حجل)، نرفع العلم (مد الذراعين عاليًا)، نعود بالجري الخفيف (ص 54-55).\n- الطالب: يؤدي الحركات مع السرد.\n\nالنشاط 3 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تضيف كل مجموعة مشهدًا جديدًا للقصة (مثل مساعدة زائر ضل الطريق) وتعرضه بالحركة.\n- الطالب: يبتكر المشهد مع مجموعته ويعرضه.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: حوار: ماذا تعلمنا من الرحلة؟ وما شعورنا عند رفع العلم؟ ليستنتج التلاميذ قيم الانتماء والتعاون.\n- الطالب: يستنتج ويعبر.\n\nالنشاط 5 (3 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالتنفس كأننا نتأمل المنظر من القلعة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الحركة التي أديناها عند عبور الوادي؟\nالإجابة: الوثب فوق الحبال.\nس2 (المستوى المتوقع): كيف صعدنا درج القلعة؟\nالإجابة: بالحجل.\nس3 (المستوى المتقدم): ماذا فعلنا عندما ضل الزائر الطريق في مشهد المجموعة؟\nالإجابة: ساعدناه وأرشدناه إلى الطريق.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر أربع حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب، الحجل.\nس2 (المستوى المتوقع): ما القيمة التي شعرت بها عند رفع العلم؟\nالإجابة: الانتماء وحب الوطن.\nس3 (المستوى المتقدم): ابتكر حركة لمشهد جديد في القصة.\nالإجابة: يذكر مشهدًا وحركته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تحدث مع طفلك عن قلعة أو حصن في محافظتكم، ومثّلا معًا رحلة قصيرة بالحركات (دليل المعل
