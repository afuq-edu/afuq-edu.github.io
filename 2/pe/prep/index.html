 على الإيقاع باليدين بالتبادل والنظر إلى الأمام، والمجموعة التي تحافظ على الإيقاع تفوز (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بأصابع اليد.\nس2 (مستوى التطبيق): في أي مستوى ننطط الكرة؟\nالإجابة: في مستوى الحوص (الحوض).\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء التنطيط؟\nالإجابة: لنرى الزملاء والملعب ولا نصطدم.\n\nالحصة 2:\nس1 (مستوى المعرفة): إلى أين ندفع الكرة عند التنطيط أثناء المشي؟\nالإجابة: قليلًا للأمام بجانب الجسم.\nس2 (مستوى التطبيق): ما الهدف في لعبة المربع؟\nالإجابة: المحافظة على كرتي وقطع كرات الزملاء.\nس3 (مستوى الاستدلال): لماذا يصعب التنطيط في المسار المتعرج؟\nالإجابة: لأننا نغير الاتجاه فنحتاج إلى التحكم في الكرة باليدين.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ كرة كبيرة في المكان بأصابع اليد في مستوى الحوض ببطء، مع العد حتى 5، ثم يسأله: بأي جزء من اليد ندفع الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنطيط الكرة أثناء المشي ثم الجري في مسار متعرج مع النظر للأمام وتبديل اليدين، وعدّ المرات دون فقد الكرة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): نطط الكرة 10 مرات باليد اليمنى ثم 10 باليسرى.\nالإجابة: يؤديها دون فقد الكرة.\nس2 (مستوى التطبيق): ما الفرق بين الدفع بالأصابع والضرب بالراحة؟\nالإجابة: الدفع بالأصابع يتحكم في الكرة، والضرب بالراحة يجعلها تهرب.\nس3 (مستوى الاستدلال): سمِّ لعبة رياضية فيها تنطيط.\nالإجابة: كرة السلة أو كرة اليد.\n\nالحصة 2:\nس1 (مستوى المعرفة): نطط الكرة بين الأقماع ذهابًا وإيابًا.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات التنطيط.\nالإجابة: الخط المستقيم والمتعرج (أو المربع، تبادل اليدين).\nس3 (مستوى الاستدلال): كيف شعرت عندما حافظت على كرتك في اللعبة؟\nالإجابة: يعبر عن الرضا والثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على تنطيط كرة باليدين بالتبادل 20 مرة يوميًا مع النظر للأمام (دليل المعلم ص 86-88).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على التنطيط أثناء المشي في الممر وتبديل اليدين (دليل المعلم ص 89-92).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=10"}}, {"title": "المراوغة والمحاورة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 93-100", "n": 2, "periods": [{"focus": "المراوغة بالجسم والمحاورة بالكرة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي المراوغة والمحاورة وأهميتهما (5 دقائق)\n2. يؤدي المحاورة بتنطيط الكرة مع تغيير الاتجاه (25 دقيقة)\n3. يميز بين المراوغة (بالجسم) والمحاورة (بالكرة) (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أعلام\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- المراوغة\n- المحاورة\n- تغيير الاتجاه\n- التخلص\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "يقف تلميذ أمام المعلم ويحاول المعلم المرور منه بتغيير اتجاهه فجأة ويسأل: ماذا فعلت لأمر؟ ويعرض صورة لاعب يحاور بالكرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري مع تغيير الاتجاه بالإشارة، تنطيط في المكان، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: المراوغة بالجسم (خطوة جانبًا مع ميل الجذع ثم الانطلاق للجهة الأخرى)، ثم المحاورة (تنطيط أسفل مستوى الحوض وتغيير اتجاه الجسم أثناء التنطيط والابتعاد عن المنافس) ص 94-95، فتطبيق موجه، ويؤدي التلميذ المراوغة بلا كرة ثم المحاورة بالكرة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 96: يجرب التلميذ المحاورة بتنطيط عالٍ ثم منخفض عند تغيير الاتجاه حول الأقماع ويكتشف أن التنطيط المنخفض يسهل تغيير الاتجاه ويحفظ الكرة، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الظل): في أزواج، يحاور أحدهما بالكرة ويغير اتجاهه، ويتبعه زميله كالظل دون أخذ الكرة، ثم التبادل، ويلعب التلميذ ويحاور (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الفرق بين المراوغة والمحاورة؟\nالإجابة: المراوغة تغيير اتجاه الجسم للتخلص من المنافس، والمحاورة تنطيط الكرة مع تغيير الاتجاه.\nس2 (مستوى التطبيق): لماذا ننطط الكرة منخفضة عند المحاورة؟\nالإجابة: لنغير الاتجاه بسهولة ولا يأخذها المنافس.\nس3 (مستوى الاستدلال): اذكر لعبة فيها محاورة.\nالإجابة: كرة السلة أو كرة اليد.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ الكرة منخفضة ويغيّران الاتجاه حول قمع واحد ببطء، ثم يطلب منه أداء المحاورة حول القمع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة محاورة أمام زميل مدافع، يختارون فيها الاتجاه المناسب للتخلص منه، ويشرحون الفرق بين المراوغة والمحاورة.", "التقويم الختامي": "س1 (مستوى المعرفة): حاور بالكرة حول ثلاثة أقماع.\nالإجابة: يحاور مع تغيير الاتجاه.\nس2 (مستوى التطبيق): كيف تتخلص من زميلك المدافع بالمراوغة؟\nالإجابة: أميل جانبًا ثم أنطلق للجهة الأخرى بسرعة.\nس3 (مستوى الاستدلال): ماذا يحدث لو نططنا الكرة عالية أمام المدافع؟\nالإجابة: يسهل عليه قطعها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على المحاورة بالكرة حول أشياء في الحديقة مع التنطيط المنخفض (دليل المعلم ص 94-96).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=11"}}, {"focus": "ألعاب ومنافسات المراوغة والمحاورة", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف المراوغة والمحاورة في ألعاب ومنافسات بمدافعين (20 دقيقة)\n2. يختار الاتجاه المناسب للتخلص من المدافع (10 دقائق)\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة المراوغة والمحاورة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أعلام\n- أخرى: بطاقات", "المفاهيم": "- المراوغة\n- المحاورة\n- المدافع\n- المساحة الآمنة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركتين بنموذج تلميذين (مهاجم ومدافع) ويسأل: متى نغير الاتجاه؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 و4 ص 98-99: محطات: محاورة بين الأقماع ثم تصويب في طوق، مراوغة مدافع ثابت، محاورة مع تبديل اليد عند كل قمع، مراوغة في مثلث، بأربع مجموعات والتبديل، ويؤدي التلميذ مهمة المحطة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 (ألعاب المراوغة والمحاورة) ص 100: أربعة مربعات متقابلة، مجموعتان، تلميذان مدافعان بين المربعين، يحاول تلاميذ المجموعة العبور بالمحاورة إلى المربع المقابل دون أن يلمس المدافع كرتهم، ونقطة لكل عبور ناجح، ويلعب التلميذ ويحاور ويراوغ المدافعين (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجح العبور أكثر؟ ليستنتج التلاميذ أهمية تغيير الاتجاه المفاجئ والمساحة الآمنة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – محاورة بين النخيل: يضع المعلم أقماعًا تمثل نخيل مزرعة عمانية، فيحاور الطلبة بالكرة بينها مع تغيير الاتجاه دون أن يلمسوها، حفاظًا على النخلة رمز الخير في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ماذا يفعل المدافع في لعبة المربعات؟\nالإجابة: يحاول لمس كرة العابرين.\nس2 (مستوى التطبيق): متى يكون العبور أسهل؟\nالإجابة: عند تغيير الاتجاه فجأة بعيدًا عن المدافع.\nس3 (مستوى الاستدلال): ماذا تعني المساحة الآمنة؟\nالإجابة: مساحة بعيدة عن المدافع تحاور فيها دون احتكاك.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ الكرة منخفضة ويغيّران الاتجاه حول قمع واحد ببطء، ثم يطلب منه أداء المحاورة حول القمع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة محاورة أمام زميل مدافع، يختارون فيها الاتجاه المناسب للتخلص منه، ويشرحون الفرق بين المراوغة والمحاورة.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المحاورة بين الأقماع والتصويب، ومراوغة المدافع الثابت.\nس2 (مستوى التطبيق): راوغ زميلك المدافع واعبر إلى المربع المقابل.\nالإجابة: يراوغ ويعبر دون فقد الكرة.\nس3 (مستوى الاستدلال): كيف شعرت عندما عبرت من المدافع؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك دور المدافع ودعه يحاول المرور بالمحاورة في مساحة آمنة (دليل المعلم ص 98-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=11"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي المراوغة والمحاورة وأهميتهما (5 دقائق)\n2. يؤدي المحاورة بتنطيط الكرة مع تغيير الاتجاه (25 دقيقة)\n3. يميز بين المراوغة (بالجسم) والمحاورة (بالكرة) (10 دقائق)\n\nالحصة 2:\n1. يوظف المراوغة والمحاورة في ألعاب ومنافسات بمدافعين (20 دقيقة)\n2. يختار الاتجاه المناسب للتخلص من المدافع (10 دقائق)\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة المراوغة والمحاورة (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أعلام\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أعلام\n- أخرى: بطاقات", "المفاهيم": "الحصة 1:\n- المراوغة\n- المحاورة\n- تغيير الاتجاه\n- التخلص\n- تزايد السرعة وتناقصها\n\nالحصة 2:\n- المراوغة\n- المحاورة\n- المدافع\n- المساحة الآمنة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف تلميذ أمام المعلم ويحاول المعلم المرور منه بتغيير اتجاهه فجأة ويسأل: ماذا فعلت لأمر؟ ويعرض صورة لاعب يحاور بالكرة.\n\nالحصة 2:\nيراجع المعلم الحركتين بنموذج تلميذين (مهاجم ومدافع) ويسأل: متى نغير الاتجاه؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري مع تغيير الاتجاه بالإشارة، تنطيط في المكان، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: المراوغة بالجسم (خطوة جانبًا مع ميل الجذع ثم الانطلاق للجهة الأخرى)، ثم المحاورة (تنطيط أسفل مستوى الحوض وتغيير اتجاه الجسم أثناء التنطيط والابتعاد عن المنافس) ص 94-95، فتطبيق موجه، ويؤدي التلميذ المراوغة بلا كرة ثم المحاورة بالكرة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 96: يجرب التلميذ المحاورة بتنطيط عالٍ ثم منخفض عند تغيير الاتجاه حول الأقماع ويكتشف أن التنطيط المنخفض يسهل تغيير الاتجاه ويحفظ الكرة، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الظل): في أزواج، يحاور أحدهما بالكرة ويغير اتجاهه، ويتبعه زميله كالظل دون أخذ الكرة، ثم التبادل، ويلعب التلميذ ويحاور (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 و4 ص 98-99: محطات: محاورة بين الأقماع ثم تصويب في طوق، مراوغة مدافع ثابت، محاورة مع تبديل اليد عند كل قمع، مراوغة في مثلث، بأربع مجموعات والتبديل، ويؤدي التلميذ مهمة المحطة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 (ألعاب المراوغة والمحاورة) ص 100: أربعة مربعات متقابلة، مجموعتان، تلميذان مدافعان بين المربعين، يحاول تلاميذ المجموعة العبور بالمحاورة إلى المربع المقابل دون أن يلمس المدافع كرتهم، ونقطة لكل عبور ناجح، ويلعب التلميذ ويحاور ويراوغ المدافعين (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجح العبور أكثر؟ ليستنتج التلاميذ أهمية تغيير الاتجاه المفاجئ والمساحة الآمنة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – محاورة بين النخيل: يضع المعلم أقماعًا تمثل نخيل مزرعة عمانية، فيحاور الطلبة بالكرة بينها مع تغيير الاتجاه دون أن يلمسوها، حفاظًا على النخلة رمز الخير في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما الفرق بين المراوغة والمحاورة؟\nالإجابة: المراوغة تغيير اتجاه الجسم للتخلص من المنافس، والمحاورة تنطيط الكرة مع تغيير الاتجاه.\nس2 (مستوى التطبيق): لماذا ننطط الكرة منخفضة عند المحاورة؟\nالإجابة: لنغير الاتجاه بسهولة ولا يأخذها المنافس.\nس3 (مستوى الاستدلال): اذكر لعبة فيها محاورة.\nالإجابة: كرة السلة أو كرة اليد.\n\nالحصة 2:\nس1 (مستوى المعرفة): ماذا يفعل المدافع في لعبة المربعات؟\nالإجابة: يحاول لمس كرة العابرين.\nس2 (مستوى التطبيق): متى يكون العبور أسهل؟\nالإجابة: عند تغيير الاتجاه فجأة بعيدًا عن المدافع.\nس3 (مستوى الاستدلال): ماذا تعني المساحة الآمنة؟\nالإجابة: مساحة بعيدة عن المدافع تحاور فيها دون احتكاك.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ الكرة منخفضة ويغيّران الاتجاه حول قمع واحد ببطء، ثم يطلب منه أداء المحاورة حول القمع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة محاورة أمام زميل مدافع، يختارون فيها الاتجاه المناسب للتخلص منه، ويشرحون الفرق بين المراوغة والمحاورة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): حاور بالكرة حول ثلاثة أقماع.\nالإجابة: يحاور مع تغيير الاتجاه.\nس2 (مستوى التطبيق): كيف تتخلص من زميلك المدافع بالمراوغة؟\nالإجابة: أميل جانبًا ثم أنطلق للجهة الأخرى بسرعة.\nس3 (مستوى الاستدلال): ماذا يحدث لو نططنا الكرة عالية أمام المدافع؟\nالإجابة: يسهل عليه قطعها.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المحاورة بين الأقماع والتصويب، ومراوغة المدافع الثابت.\nس2 (مستوى التطبيق): راوغ زميلك المدافع واعبر إلى المربع المقابل.\nالإجابة: يراوغ ويعبر دون فقد الكرة.\nس3 (مستوى الاستدلال): كيف شعرت عندما عبرت من المدافع؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على المحاورة بالكرة حول أشياء في الحديقة مع التنطيط المنخفض (دليل المعلم ص 94-96).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك دور المدافع ودعه يحاول المرور بالمحاورة في مساحة آمنة (دليل المعلم ص 98-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=11"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 24-28", "n": 2, "periods": [{"focus": "الممارسات الصحية: الوجبة المدرسية الصحية وشرب الماء", "num": 1, "fields": {"المخرجات التعليمية": "1. يميز مكونات الوجبة المدرسية الصحية (15 دقيقة)\n2. يذكر أهمية شرب الماء قبل النشاط وبعده (15 دقيقة)\n3. يقدر أثر الغذاء الصحي والماء في نشاط الجسم (10 دقائق)", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور أطعمة\n- أخرى: زجاجات ماء\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- الوجبة الصحية\n- الماء\n- الطاقة\n- المقصف", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا أكلتم في الفسحة؟ ويعرض بطاقات (ساندويتش جبن، فاكهة، حلوى، مشروب غازي) ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم ثم شرب الماء برشفات، ويقلد التلميذ ويشرب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يفكر المعلم بصوت عالٍ: الوجبة الصحية فيها خبز وبروتين (جبن أو بيض) وفاكهة أو خضار وماء أو حليب، والحلويات والمشروبات الغازية تضر الأسنان والصحة (برنامج صحتي ص 26)، ويستمع التلميذ ويصنف البطاقات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (أركض إلى الصحة): طوقان (صحي، غير صحي)، يجري التلميذ ويسحب بطاقة ويضعها في الطوق الصحيح، ثم جولة ثانية بالتنطيط بالكرة، ويلعب التلميذ ويصنف (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تكوّن كل مجموعة وجبة مدرسية صحية من البطاقات وتعرضها وتشرح السبب، والتلاميذ يتعاون ويعرض (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة ونصيحة: أحضر وجبة صحية وزجاجة ماء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): اذكر مكونين للوجبة المدرسية الصحية.\nالإجابة: خبز وجبن (أو فاكهة وحليب).\nس2 (مستوى التطبيق): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس3 (مستوى الاستدلال): هل الشوكولاتة الكثيرة وجبة صحية؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير وتضر الأسنان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة، ويكوّن مع التلميذ وجبة مدرسية صحية (خبز وجبن وفاكهة وماء)، ثم يسأله: لماذا نشرب الماء بعد اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ثلاث وجبات مدرسية صحية مرسومة لثلاثة أيام، وتفسير لماذا لا تعد الشوكولاتة الكثيرة وجبة صحية.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة مشروب غازي، في أي طوق نضعه؟\nالإجابة: طوق غير صحي.\nس2 (مستوى التطبيق): كوّن وجبة مدرسية صحية.\nالإجابة: مثل: ساندويتش جبن وتفاحة وماء.\nس3 (مستوى الاستدلال): ماذا تنصح زميلك الذي يشتري الحلوى كل يوم؟\nالإجابة: أنصحه باختيار الفاكهة أو ساندويتش صحي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: جهّز مع طفلك وجبة مدرسية صحية وزجاجة ماء، وناقشا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 26).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=12"}}, {"focus": "المهرجان الرياضي التعليمي للمعالجة والتناول (التنطيط والمحاورة) والحركات الأساسية", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف التنطيط والمحاورة والحركات الأساسية في أقسام المهرجان (25 دقيقة)\n2. يطبق قواعد الأقسام والالتزام بالدور (5 دقائق)\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- التنطيط\n- المحاورة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (ألعب بالكرة) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام ويذكر قواعد الأمان.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء جماعي بالكرة بنموذج المعلم، ويؤدي التلميذ الإحماء (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم التنطيط في المكان (العدّاد)، قسم التنطيط المتعرج بين الأقماع، قسم المحاورة ومراوغة مدافع ثابت، قسم الحركات الأساسية بالكرة (ركضة الحصان حاملًا الكرة فوق الحبال)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (23 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ختامية: تتابع تنطيط ومحاورة، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – لقمة من مزارع عمان: تكوّن كل مجموعة وجبة مدرسية صحية من منتجات عمانية كالتمر والموز والسمك واللبن والليمون العماني، وتعرضها على زملائها مع كوب ماء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما القسم الذي كان فيه مدافع ثابت؟\nالإجابة: قسم المحاورة والمراوغة.\nس2 (مستوى التطبيق): كيف نحافظ على الكرة في قسم التنطيط المتعرج؟\nالإجابة: بالتنطيط المنخفض بالأصابع وتبديل اليدين عند الأقماع.\nس3 (مستوى الاستدلال): لماذا نسجل نقاط النظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة، ويكوّن مع التلميذ وجبة مدرسية صحية (خبز وجبن وفاكهة وماء)، ثم يسأله: لماذا نشرب الماء بعد اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ثلاث وجبات مدرسية صحية مرسومة لثلاثة أيام، وتفسير لماذا لا تعد الشوكولاتة الكثيرة وجبة صحية.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر أقسام مهرجان اليوم.\nالإجابة: التنطيط في المكان، التنطيط المتعرج، المحاورة والمراوغة، الحركات الأساسية بالكرة.\nس2 (مستوى التطبيق): ما دورك في مجموعتك اليوم؟\nالإجابة: يذكر دوره (قائد، مشارك، مسجل).\nس3 (مستوى الاستدلال): ماذا تقول للمجموعة الفائزة؟\nالإجابة: أهنئها بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وراجعا التنطيط والمحاورة (دليل المعلم ص 86-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=12"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يميز مكونات الوجبة المدرسية الصحية (15 دقيقة)\n2. يذكر أهمية شرب الماء قبل النشاط وبعده (15 دقيقة)\n3. يقدر أثر الغذاء الصحي والماء في نشاط الجسم (10 دقائق)\n\nالحصة 2:\n1. يوظف التنطيط والمحاورة والحركات الأساسية في أقسام المهرجان (25 دقيقة)\n2. يطبق قواعد الأقسام والالتزام بالدور (5 دقائق)\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور أطعمة\n- أخرى: زجاجات ماء\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الوجبة الصحية\n- الماء\n- الطاقة\n- المقصف\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- التنطيط\n- المحاورة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا أكلتم في الفسحة؟ ويعرض بطاقات (ساندويتش جبن، فاكهة، حلوى، مشروب غازي) ويسأل: أيها يعطينا طاقة للعب؟\n\nالحصة 2:\nيعلن المعلم مهرجان (ألعب بالكرة) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام ويذكر قواعد الأمان.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم ثم شرب الماء برشفات، ويقلد التلميذ ويشرب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يفكر المعلم بصوت عالٍ: الوجبة الصحية فيها خبز وبروتين (جبن أو بيض) وفاكهة أو خضار وماء أو حليب، والحلويات والمشروبات الغازية تضر الأسنان والصحة (برنامج صحتي ص 26)، ويستمع التلميذ ويصنف البطاقات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (أركض إلى الصحة): طوقان (صحي، غير صحي)، يجري التلميذ ويسحب بطاقة ويضعها في الطوق الصحيح، ثم جولة ثانية بالتنطيط بالكرة، ويلعب التلميذ ويصنف (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تكوّن كل مجموعة وجبة مدرسية صحية من البطاقات وتعرضها وتشرح السبب، والتلاميذ يتعاون ويعرض (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة ونصيحة: أحضر وجبة صحية وزجاجة ماء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء جماعي بالكرة بنموذج المعلم، ويؤدي التلميذ الإحماء (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم التنطيط في المكان (العدّاد)، قسم التنطيط المتعرج بين الأقماع، قسم المحاورة ومراوغة مدافع ثابت، قسم الحركات الأساسية بالكرة (ركضة الحصان حاملًا الكرة فوق الحبال)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (23 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ختامية: تتابع تنطيط ومحاورة، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – لقمة من مزارع عمان: تكوّن كل مجموعة وجبة مدرسية صحية من منتجات عمانية كالتمر والموز والسمك واللبن والليمون العماني، وتعرضها على زملائها مع كوب ماء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): اذكر مكونين للوجبة المدرسية الصحية.\nالإجابة: خبز وجبن (أو فاكهة وحليب).\nس2 (مستوى التطبيق): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس3 (مستوى الاستدلال): هل الشوكولاتة الكثيرة وجبة صحية؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير وتضر الأسنان.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما القسم الذي كان فيه مدافع ثابت؟\nالإجابة: قسم المحاورة والمراوغة.\nس2 (مستوى التطبيق): كيف نحافظ على الكرة في قسم التنطيط المتعرج؟\nالإجابة: بالتنطيط المنخفض بالأصابع وتبديل اليدين عند الأقماع.\nس3 (مستوى الاستدلال): لماذا نسجل نقاط النظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة، ويكوّن مع التلميذ وجبة مدرسية صحية (خبز وجبن وفاكهة وماء)، ثم يسأله: لماذا نشرب الماء بعد اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ثلاث وجبات مدرسية صحية مرسومة لثلاثة أيام، وتفسير لماذا لا تعد الشوكولاتة الكثيرة وجبة صحية.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة مشروب غازي، في أي طوق نضعه؟\nالإجابة: طوق غير صحي.\nس2 (مستوى التطبيق): كوّن وجبة مدرسية صحية.\nالإجابة: مثل: ساندويتش جبن وتفاحة وماء.\nس3 (مستوى الاستدلال): ماذا تنصح زميلك الذي يشتري الحلوى كل يوم؟\nالإجابة: أنصحه باختيار الفاكهة أو ساندويتش صحي.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر أقسام مهرجان اليوم.\nالإجابة: التنطيط في المكان، التنطيط المتعرج، المحاورة والمراوغة، الحركات الأساسية بالكرة.\nس2 (مستوى التطبيق): ما دورك في مجموعتك اليوم؟\nالإجابة: يذكر دوره (قائد، مشارك، مسجل).\nس3 (مستوى الاستدلال): ماذا تقول للمجموعة الفائزة؟\nالإجابة: أهنئها بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز مع طفلك وجبة مدرسية صحية وزجاجة ماء، وناقشا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 26).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وراجعا التنطيط والمحاورة (دليل المعلم ص 86-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=12"}}, {"title": "ضرب الكرة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الرابع عشر – الخامس عشر", "date": "6-10/12/2026 إلى 13-17/12/2026", "pages": "دليل المعلم ص 101-108", "n": 4, "periods": [{"focus": "ضرب الكرة باليدين من أعلى", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ضرب الكرة باليدين من أعلى ونقاطها الفنية (15 دقيقة)\n2. يؤدي ضرب الكرة (البالون) باليدين من أعلى لأعلى (15 دقيقة)\n3. يميز بين ضرب الكرة ورميها (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- ضرب الكرة\n- التوافق\n- الدقة\n- من أعلى\n- أطراف الأصابع", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم بالونًا لتلميذ ويسأل: كيف تبقيه في الهواء دون أن تمسكه؟ ويعرض صورة لاعب كرة طائرة يمرر من أعلى.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، رفع الذراعين عاليًا، تحريك الأصابع، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، اليدان فوق الجبهة والأصابع منتشرة، مد الذراعين والركبتين لضرب الكرة بأطراف الأصابع لأعلى (ص 102-103)، ثم تطبيق موجه بالبالون فالكرة الخفيفة، ويؤدي التلميذ الضرب من أعلى بالبالون ثم بالكرة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ ضرب البالون براحة اليدين ثم بأطراف الأصابع، ومن فوق الجبهة ثم من أمام الصدر، ويكتشف أي الطرق تجعل البالون يرتفع مستقيمًا، ويجرب التلميذ ويستنتج النقاط الفنية (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (البالون الطائر): من يبقي بالونه في الهواء أطول بالضرب من أعلى دون مسكه، ويلعب التلميذ ويعد (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): أين تكون اليدان قبل ضرب الكرة من أعلى؟\nالإجابة: فوق الجبهة والأصابع منتشرة.\nس2 (مستوى التطبيق): بأي جزء من اليد نضرب الكرة؟\nالإجابة: بأطراف الأصابع.\nس3 (مستوى الاستدلال): ما الفرق بين ضرب الكرة ورميها؟\nالإجابة: في الضرب تلمس الكرة لحظة وتنطلق، وفي الرمي نمسكها ثم نقذفها.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): اضرب البالون من أعلى 5 مرات متتالية.\nالإجابة: يؤديها دون مسك البالون.\nس2 (مستوى التطبيق): لماذا نمد الركبتين مع الذراعين عند الضرب؟\nالإجابة: لتزيد قوة الضرب وتذهب الكرة أعلى.\nس3 (مستوى الاستدلال): سمِّ لعبة فيها ضرب الكرة من أعلى.\nالإجابة: الكرة الطائرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك إبقاء بالون في الهواء بالضرب من أعلى بأطراف الأصابع (دليل المعلم ص 102-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}, {"focus": "ضرب الكرة باليدين من أسفل", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ضرب الكرة باليدين من أسفل ونقاطها الفنية (5 دقائق)\n2. يؤدي ضرب الكرة من أسفل بالساعدين (15 دقيقة)\n3. يختار طريقة الضرب (أعلى أو أسفل) حسب ارتفاع الكرة (20 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- ضرب الكرة من أسفل\n- الساعدان\n- مستوى الكرة\n- التوافق", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم كرة منخفضة لتلميذ ويسأل: هل تستطيع ضربها من أعلى؟ ثم يعرض نموذج الضرب من أسفل.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع مراجعة الضرب من أعلى بالبالون، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، ظهر إحدى اليدين على راحة الأخرى، مد الذراعين أمامًا أسفل، ضرب الكرة بالجزء الأمامي للساعدين مع مد الركبتين وتوجيه الكرة لأعلى (ص 103-104)، ثم تطبيق موجه، ويؤدي التلميذ الضرب من أسفل بالبالون ثم بالكرة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج: يرمي أحدهما الكرة منخفضة ويضربها الآخر من أسفل لتعود إليه، ثم يرميها عالية فيضربها من أعلى، ويتبادلان مع العد، ويتبادل التلميذ ويختار طريقة الضرب حسب ارتفاع الكرة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أعلى أم أسفل): ينادي المعلم ويرمي الكرة فيضربها التلميذ بالطريقة الصحيحة، ويلعب التلميذ ويختار الطريقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الساعدين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف توضع اليدان في الضرب من أسفل؟\nالإجابة: ظهر إحدى اليدين على راحة الأخرى.\nس2 (مستوى التطبيق): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالجزء الأمامي للساعدين.\nس3 (مستوى الاستدلال): متى نستخدم الضرب من أسفل؟\nالإجابة: عندما تكون الكرة منخفضة.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): اضرب الكرة القادمة منخفضة من أسفل لتعود لزميلك.\nالإجابة: يؤديها بالساعدين.\nس2 (مستوى التطبيق): زميلك يرمي الكرة عالية فوق رأسك، أي ضربة تختار ولماذا؟\nالإجابة: الضرب من أعلى لأن الكرة فوق مستوى الجبهة.\nس3 (مستوى الاستدلال): لماذا نمد الركبتين عند الضرب من أسفل؟\nالإجابة: لتعطي الكرة قوة وارتفاعًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على ضرب كرة خفيفة من أسفل بالساعدين 10 مرات (دليل المعلم ص 103-104).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}, {"focus": "محطات ضرب الكرة", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي ضرب الكرة من أعلى ومن أسفل في محطات مختلفة (20 دقيقة)\n2. يوجه الكرة بالضرب نحو هدف (طوق، زميل) (10 دقائق)\n3. يتعاون مع مجموعته في محطات ضرب الكرة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "- ضرب الكرة\n- الدقة\n- المحطات\n- الحبل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الضربتين بنموذج تلميذين ويعرض المحطات ويسأل: في أي محطة نحتاج إلى الضرب من أعلى؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: ضرب البالون من أعلى داخل طوق معلق، ضرب الكرة من أسفل فوق الحبل للزميل، ضرب الكرة على الحائط من أعلى والتقاطها، ضرب البالون بالتبادل أعلى وأسفل، ويشاهد التلميذ ويحدد الضربة المناسبة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 106-107: أربع مجموعات بقائد تؤدي المحطات بالتبديل، ويسجل القائد الضربات الصحيحة، ويؤدي التلميذ مهمة المحطة ويبدل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أي مجموعة تمرر الكرة فوق الحبل بالضرب أكبر عدد من المرات دون سقوط، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): في أي محطة ضربنا الكرة فوق الحبل؟\nالإجابة: محطة الضرب من أسفل للزميل.\nس2 (مستوى التطبيق): ما الضربة المناسبة لإدخال البالون في الطوق المعلق؟\nالإجابة: الضرب من أعلى.\nس3 (مستوى الاستدلال): كيف نوجه الكرة نحو الهدف؟\nالإجابة: ننظر إلى الهدف ونمد الذراعين في اتجاهه.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الطوق المعلق والحبل (أو الحائط، البالون بالتبادل).\nس2 (مستوى التطبيق): اضرب الكرة فوق الحبل لتصل إلى زميلك.\nالإجابة: يضرب من أسفل بدقة.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك؟\nالإجابة: سجل الضربات ونظم الدور وشجعنا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اربط حبلًا منخفضًا في المنزل وتبادل مع طفلك ضرب بالون فوقه (دليل المعلم ص 106-107).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}, {"focus": "ألعاب ومنافسات ضرب الكرة", "num": 4, "fields": {"المخرجات التعليمية": "1. يوظف ضرب الكرة من أعلى ومن أسفل في ألعاب ومنافسات (15 دقيقة)\n2. يطبق قواعد اللعبة ويحافظ على الكرة من السقوط (15 دقيقة)\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة ضرب الكرة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "- ضرب الكرة\n- الدائرة\n- المحافظة على الكرة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الضربتين بسرعة ويعلن: اليوم مباريات بالبالون والكرة!", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 5 (ألعاب ضرب الكرة) ص 108: دائرتان قطرهما 10 م، تضرب كل مجموعة البالون بالتبادل من أعلى أو أسفل دون توقف ولا يلمس الأرض، ويستبعد من يسقط بالونه، ثم لعبة تمرير الكرة فوق الحبل بين مجموعتين بالضرب، ويلعب التلميذ ويحافظ على الكرة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مباراة مصغرة بين مجموعتين فوق الحبل بثلاث ضربات لكل مجموعة قبل الإعادة، بأدوار (ضارب، مساعد، حكم صغير)، ويلعب التلميذ بدوره ويلتزم بالقواعد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: لماذا سقط البالون في بعض المرات؟ ليستنتج التلاميذ أهمية النظر إلى الكرة والتحرك تحتها، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – بالون حب الوطن: يضرب الأزواج البالون باليدين من أعلى لأعلى، وكلما ضربه أحدهم ذكر شيئًا يحبه في عمان، ويحاولون ألا يسقط البالون حتى ينتهي العد (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما قاعدة لعبة الدائرة؟\nالإجابة: نضرب البالون بالتبادل ولا نتركه يلمس الأرض.\nس2 (مستوى التطبيق): كم ضربة لكل مجموعة في المباراة قبل الإعادة فوق الحبل؟\nالإجابة: ثلاث ضربات.\nس3 (مستوى الاستدلال): لماذا نتحرك تحت الكرة قبل ضربها؟\nالإجابة: لنضربها بالطريقة الصحيحة وتذهب في الاتجاه المطلوب.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم.\nالإجابة: لعبة الدائرة بالبالون أو المباراة فوق الحبل.\nس2 (مستوى التطبيق): ما دور الحكم الصغير في المباراة؟\nالإجابة: يراقب القواعد ويحسب النقاط.\nس3 (مستوى الاستدلال): كيف شعرت عندما أعادت مجموعتك الكرة فوق الحبل؟\nالإجابة: يعبر عن سعادته بالتعاون.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك مباراة بالون فوق حبل في المنزل بالضرب من أعلى ومن أسفل (دليل المعلم ص 108).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة ضرب الكرة باليدين من أعلى ونقاطها الفنية (15 دقيقة)\n2. يؤدي ضرب الكرة (البالون) باليدين من أعلى لأعلى (15 دقيقة)\n3. يميز بين ضرب الكرة ورميها (10 دقائق)\n\nالحصة 2:\n1. يتعرف حركة ضرب الكرة باليدين من أسفل ونقاطها الفنية (5 دقائق)\n2. يؤدي ضرب الكرة من أسفل بالساعدين (15 دقيقة)\n3. يختار طريقة الضرب (أعلى أو أسفل) حسب ارتفاع الكرة (20 دقيقة)\n\nالحصة 3:\n1. يؤدي ضرب الكرة من أعلى ومن أسفل في محطات مختلفة (20 دقيقة)\n2. يوجه الكرة بالضرب نحو هدف (طوق، زميل) (10 دقائق)\n3. يتعاون مع مجموعته في محطات ضرب الكرة (10 دقائق)\n\nالحصة 4:\n1. يوظف ضرب الكرة من أعلى ومن أسفل في ألعاب ومنافسات (15 دقيقة)\n2. يطبق قواعد اللعبة ويحافظ على الكرة من السقوط (15 دقيقة)\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة ضرب الكرة (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- ضرب الكرة\n- التوافق\n- الدقة\n- من أعلى\n- أطراف الأصابع\n\nالحصة 2:\n- ضرب الكرة من أسفل\n- الساعدان\n- مستوى الكرة\n- التوافق\n\nالحصة 3:\n- ضرب الكرة\n- الدقة\n- المحطات\n- الحبل\n\nالحصة 4:\n- ضرب الكرة\n- الدائرة\n- المحافظة على الكرة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم بالونًا لتلميذ ويسأل: كيف تبقيه في الهواء دون أن تمسكه؟ ويعرض صورة لاعب كرة طائرة يمرر من أعلى.\n\nالحصة 2:\nيرمي المعلم كرة منخفضة لتلميذ ويسأل: هل تستطيع ضربها من أعلى؟ ثم يعرض نموذج الضرب من أسفل.\n\nالحصة 3:\nيراجع المعلم الضربتين بنموذج تلميذين ويعرض المحطات ويسأل: في أي محطة نحتاج إلى الضرب من أعلى؟\n\nالحصة 4:\nيراجع المعلم الضربتين بسرعة ويعلن: اليوم مباريات بالبالون والكرة!", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، رفع الذراعين عاليًا، تحريك الأصابع، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، اليدان فوق الجبهة والأصابع منتشرة، مد الذراعين والركبتين لضرب الكرة بأطراف الأصابع لأعلى (ص 102-103)، ثم تطبيق موجه بالبالون فالكرة الخفيفة، ويؤدي التلميذ الضرب من أعلى بالبالون ثم بالكرة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ ضرب البالون براحة اليدين ثم بأطراف الأصابع، ومن فوق الجبهة ثم من أمام الصدر، ويكتشف أي الطرق تجعل البالون يرتفع مستقيمًا، ويجرب التلميذ ويستنتج النقاط الفنية (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (البالون الطائر): من يبقي بالونه في الهواء أطول بالضرب من أعلى دون مسكه، ويلعب التلميذ ويعد (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم مع مراجعة الضرب من أعلى بالبالون، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، ظهر إحدى اليدين على راحة الأخرى، مد الذراعين أمامًا أسفل، ضرب الكرة بالجزء الأمامي للساعدين مع مد الركبتين وتوجيه الكرة لأعلى (ص 103-104)، ثم تطبيق موجه، ويؤدي التلميذ الضرب من أسفل بالبالون ثم بالكرة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج: يرمي أحدهما الكرة منخفضة ويضربها الآخر من أسفل لتعود إليه، ثم يرميها عالية فيضربها من أعلى، ويتبادلان مع العد، ويتبادل التلميذ ويختار طريقة الضرب حسب ارتفاع الكرة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أعلى أم أسفل): ينادي المعلم ويرمي الكرة فيضربها التلميذ بالطريقة الصحيحة، ويلعب التلميذ ويختار الطريقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الساعدين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: ضرب البالون من أعلى داخل طوق معلق، ضرب الكرة من أسفل فوق الحبل للزميل، ضرب الكرة على الحائط من أعلى والتقاطها، ضرب البالون بالتبادل أعلى وأسفل، ويشاهد التلميذ ويحدد الضربة المناسبة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 106-107: أربع مجموعات بقائد تؤدي المحطات بالتبديل، ويسجل القائد الضربات الصحيحة، ويؤدي التلميذ مهمة المحطة ويبدل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أي مجموعة تمرر الكرة فوق الحبل بالضرب أكبر عدد من المرات دون سقوط، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 5 (ألعاب ضرب الكرة) ص 108: دائرتان قطرهما 10 م، تضرب كل مجموعة البالون بالتبادل من أعلى أو أسفل دون توقف ولا يلمس الأرض، ويستبعد من يسقط بالونه، ثم لعبة تمرير الكرة فوق الحبل بين مجموعتين بالضرب، ويلعب التلميذ ويحافظ على الكرة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مباراة مصغرة بين مجموعتين فوق الحبل بثلاث ضربات لكل مجموعة قبل الإعادة، بأدوار (ضارب، مساعد، حكم صغير)، ويلعب التلميذ بدوره ويلتزم بالقواعد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: لماذا سقط البالون في بعض المرات؟ ليستنتج التلاميذ أهمية النظر إلى الكرة والتحرك تحتها، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – بالون حب الوطن: يضرب الأزواج البالون باليدين من أعلى لأعلى، وكلما ضربه أحدهم ذكر شيئًا يحبه في عمان، ويحاولون ألا يسقط البالون حتى ينتهي العد (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): أين تكون اليدان قبل ضرب الكرة من أعلى؟\nالإجابة: فوق الجبهة والأصابع منتشرة.\nس2 (مستوى التطبيق): بأي جزء من اليد نضرب الكرة؟\nالإجابة: بأطراف الأصابع.\nس3 (مستوى الاستدلال): ما الفرق بين ضرب الكرة ورميها؟\nالإجابة: في الضرب تلمس الكرة لحظة وتنطلق، وفي الرمي نمسكها ثم نقذفها.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف توضع اليدان في الضرب من أسفل؟\nالإجابة: ظهر إحدى اليدين على راحة الأخرى.\nس2 (مستوى التطبيق): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالجزء الأمامي للساعدين.\nس3 (مستوى الاستدلال): متى نستخدم الضرب من أسفل؟\nالإجابة: عندما تكون الكرة منخفضة.\n\nالحصة 3:\nس1 (مستوى المعرفة): في أي محطة ضربنا الكرة فوق الحبل؟\nالإجابة: محطة الضرب من أسفل للزميل.\nس2 (مستوى التطبيق): ما الضربة المناسبة لإدخال البالون في الطوق المعلق؟\nالإجابة: الضرب من أعلى.\nس3 (مستوى الاستدلال): كيف نوجه الكرة نحو الهدف؟\nالإجابة: ننظر إلى الهدف ونمد الذراعين في اتجاهه.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما قاعدة لعبة الدائرة؟\nالإجابة: نضرب البالون بالتبادل ولا نتركه يلمس الأرض.\nس2 (مستوى التطبيق): كم ضربة لكل مجموعة في المباراة قبل الإعادة فوق الحبل؟\nالإجابة: ثلاث ضربات.\nس3 (مستوى الاستدلال): لماذا نتحرك تحت الكرة قبل ضربها؟\nالإجابة: لنضربها بالطريقة الصحيحة وتذهب في الاتجاه المطلوب.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اضرب البالون من أعلى 5 مرات متتالية.\nالإجابة: يؤديها دون مسك البالون.\nس2 (مستوى التطبيق): لماذا نمد الركبتين مع الذراعين عند الضرب؟\nالإجابة: لتزيد قوة الضرب وتذهب الكرة أعلى.\nس3 (مستوى الاستدلال): سمِّ لعبة فيها ضرب الكرة من أعلى.\nالإجابة: الكرة الطائرة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اضرب الكرة القادمة منخفضة من أسفل لتعود لزميلك.\nالإجابة: يؤديها بالساعدين.\nس2 (مستوى التطبيق): زميلك يرمي الكرة عالية فوق رأسك، أي ضربة تختار ولماذا؟\nالإجابة: الضرب من أعلى لأن الكرة فوق مستوى الجبهة.\nس3 (مستوى الاستدلال): لماذا نمد الركبتين عند الضرب من أسفل؟\nالإجابة: لتعطي الكرة قوة وارتفاعًا.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الطوق المعلق والحبل (أو الحائط، البالون بالتبادل).\nس2 (مستوى التطبيق): اضرب الكرة فوق الحبل لتصل إلى زميلك.\nالإجابة: يضرب من أسفل بدقة.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك؟\nالإجابة: سجل الضربات ونظم الدور وشجعنا.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم.\nالإجابة: لعبة الدائرة بالبالون أو المباراة فوق الحبل.\nس2 (مستوى التطبيق): ما دور الحكم الصغير في المباراة؟\nالإجابة: يراقب القواعد ويحسب النقاط.\nس3 (مستوى الاستدلال): كيف شعرت عندما أعادت مجموعتك الكرة فوق الحبل؟\nالإجابة: يعبر عن سعادته بالتعاون.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: العب مع طفلك إبقاء بالون في الهواء بالضرب من أعلى بأطراف الأصابع (دليل المعلم ص 102-103).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طفلك على ضرب كرة خفيفة من أسفل بالساعدين 10 مرات (دليل المعلم ص 103-104).\n\nالحصة 3:\nإرشاد لولي الأمر: اربط حبلًا منخفضًا في المنزل وتبادل مع طفلك ضرب بالون فوقه (دليل المعلم ص 106-107).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طفلك مباراة بالون فوق حبل في المنزل بالضرب من أعلى ومن أسفل (دليل المعلم ص 108).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 60-108 (مهارات الوحدتين الثانية والثالثة)", "n": 2, "periods": [{"focus": "قياس أداء الحركات الأساسية (الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الخطو الجانبي وركضة الحصان في مسار محدد بالطريقة الصحيحة (20 دقيقة)\n2. يؤدي تبادل الخطو والحجل بإيقاع صحيح (10 دقائق)\n3. يؤدي اللف والدوران مع المحافظة على الاتزان (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: كرات متوسطة\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الإيقاع", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم أن الحصة لقياس الحركات الأساسية ويعرض محطات القياس ويطمئن التلاميذ.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم يشمل الحركات التي ستقاس، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 خطو جانبي بين الأقماع ثم ركضة حصان فوق الحبال، محطة 2 تبادل الخطو والحجل داخل الأطواق، محطة 3 لف الجذع لتسليم الكرة ثم دورة كاملة حول القمع؛ ويرصد المعلم في الاستمارة، ويؤدي التلميذ عند دوره ويتدرب مستقلًا (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية (البوصلة)، ويلعب التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتعزيز، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة) ن ثم تنطيط أثناء المشي للقمع، محطة 2 محاورة بين 4 أقماع، محطة 3 ضرب البالون من أعلى 5 مرات ثم من أسفل 5 مرات؛ ويرصد المعلم، ويؤدي التلميذ عند دوره ويتدرب مستقلًا (22 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية (البالون الطائر)، ويلعب التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتعزيز وإعلان الإجازة، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – رحلة المحافظات: ينظم المعلم محطات بأسماء محافظات عمانية مثل مسقط وظفار والداخلية ومسندم، وتؤدي المجموعات في كل محطة حركة: خطوًا جانبيًا أو ركضة حصان أو دورانًا (5 دقائق)\nالاستراتيجيات: المحطات.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة، وثبة، خطوة.\nس2 (مستوى التطبيق): هل تتقاطع القدمان في الخطو الجانبي؟\nالإجابة: لا.\nس3 (مستوى الاستدلال): كيف نحافظ على الاتزان بعد الدورة الكاملة؟\nالإجابة: بثني الركبتين والنظر للأمام.\n\nالحصة 2:\nس1 (مستوى المعرفة): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بالأصابع.\nس2 (مستوى التطبيق): لماذا ننطط الكرة منخفضة عند المحاورة؟\nالإجابة: لنغير الاتجاه بسهولة.\nس3 (مستوى الاستدلال): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالساعدين.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الحركة التي لم يتقنها في القياس (ركضة الحصان أو الخطو الجانبي) ببطء مع النداء، ثم يطلب منه أداءها مرة في المسار المحدد.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء مسار متصل يجمع الخطو الجانبي وركضة الحصان وتبادل الخطو والحجل ثم دورة كاملة متزنة، مع تنطيط الكرة في نهايته.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ تبادل الخطو والحجل داخل الأطواق.\nالإجابة: يؤديه بالإيقاع الصحيح.\nس2 (مستوى التطبيق): ما الفرق بين اللف والدوران؟\nالإجابة: اللف لجزء من الجسم، والدوران للجسم كله.\nس3 (مستوى الاستدلال): لماذا نتدرب بهدوء في انتظار الدور؟\nالإجابة: ليؤدي كل تلميذ قياسه بتركيز.\n\nالحصة 2:\nس1 (مستوى المعرفة): نطط الكرة أثناء المشي حتى القمع.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (مستوى التطبيق): اضرب البالون من أعلى 5 مرات.\nالإجا ذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ممارسة الألعاب الشعبية والحركية في العطلة ومراجعة مهارات الفصل الأول.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=15"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر طرق الوقاية من الشمس والحرارة أثناء اللعب (10 دقائق)\n2. يميز الأوقات والأماكن المناسبة للعب في الهواء الطلق (10 دقائق)\n3. يقدر أهمية شرب الماء والراحة في الظل (20 دقيقة)\n\nالحصة 2:\n1. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله (10 دقائق)\n2. يطبق قواعد الأمن والسلامة أثناء النشاط الحر (10 دقائق)\n3. يتعاون مع مجموعته ويتبادل القيادة (20 دقيقة)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: قبعة\n- أخرى: زجاجات ماء\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: بالونات", "المفاهيم": "الحصة 1:\n- الوقاية من الشمس\n- الظل\n- القبعة\n- الماء\n- الراحة\n\nالحصة 2:\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة أطفال يلعبون في الظهيرة بلا قبعات ويسأل: ماذا قد يحدث لهم؟\n\nالحصة 2:\nيعرض المعلم الأدوات ويقول: اليوم تختار كل مجموعة لعبتها (دليل المعلم ص 23) ويذكر الأنشطة المقترحة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء خفيف في الظل بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم البطاقات ويفكر بصوت عالٍ: نلعب في الصباح أو العصر، نلبس قبعة وملابس فاتحة، نشرب الماء، نستريح في الظل عند التعب (برنامج صحتي ص 26)، ويستمع التلميذ ويرتب بطاقات الوقاية (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الظل والشمس): عند نداء (شمس) يجري التلاميذ، وعند (ظل) يذهبون إلى الأطواق (الظل) ويشربون الماء تمثيلًا، ويلعب التلميذ ويستجيب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تعرض كل مجموعة ثلاث نصائح للعب الآمن في الحر بالتمثيل، والتلاميذ يتعاون ويعرض (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة في الظل وشرب الماء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تقسيم المجموعات (لا تقل عن أربعة) بقائد، وتحاور كل مجموعة لاختيار لعبة (شعبية بسيطة، منافسة صغيرة، عرض تمرينات) وإعداد أدواتها، ويحاور التلميذ ويختار ويعد الأدوات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تنفذ المجموعات ألعابها بإشراف المعلم مع تبديل القائد في منتصف الوقت، ويلعب التلميذ ويلتزم بالقواعد ويتبادل القيادة (18 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تعرض كل مجموعة لعبتها في دقيقة، ويعرض التلميذ (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وتعبير عن أجمل حصة في الفصل، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تحت ظل الغافة: تتحاور المجموعات في أفضل مكان ووقت للعب في صيف عمان، كظل شجرة الغاف أو بعد العصر، وتذكر لبس الكمة أو القبعة وشرب الماء والراحة في الظل (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): متى نفضل اللعب في الهواء الطلق؟\nالإجابة: في الصباح الباكر أو العصر.\nس2 (مستوى التطبيق): ماذا نلبس للوقاية من الشمس؟\nالإجابة: قبعة وملابس فاتحة.\nس3 (مستوى الاستدلال): ماذا نفعل إذا شعرنا بالتعب والحر أثناء اللعب؟\nالإجابة: نستريح في الظل ونشرب الماء.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر ويعلل.\nس2 (مستوى التطبيق): ما دور القائد؟\nالإجابة: ينظم اللعب ويوزع الأدوار ويحرص على السلامة.\nس3 (مستوى الاستدلال): لماذا نبدل القائد؟\nالإجابة: ليجرب الجميع القيادة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لأطفال يلعبون في الشمس والظل، ويختار مع التلميذ القبعة والملابس الفاتحة والماء، ثم يسأله: ماذا نفعل إذا شعرنا بالتعب والحر أثناء اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة إرشادات للعب الآمن في الصيف (الوقت المناسب، واللباس، والماء، والظل)، واختيار نشاط حر مناسب لمجموعتهم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة طفل يلعب ظهرًا بلا قبعة، ما الخطأ؟\nالإجابة: يلعب وقت الحر الشديد بلا قبعة.\nس2 (مستوى التطبيق): اذكر نصيحتين قدمتهما مجموعتك.\nالإجابة: مثل: اشرب الماء، والعب في الظل.\nس3 (مستوى الاستدلال): لماذا تضر الشمس الشديدة الجسم؟\nالإجابة: تسبب الصداع والتعب وضربة الشمس.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر قاعدة سلامة التزمتم بها.\nالإجابة: مثل: عدم الدفع، أو استخدام الأدوات بحذر.\nس2 (مستوى التطبيق): ما المهارة التي استخدمتها في لعبتكم؟\nالإجابة: يذكر مهارة (تنطيط، ضرب كرة، جري).\nس3 (مستوى الاستدلال): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: احرص على لعب طفلك في العطلة في أوقات مناسبة مع قبعة وماء (برنامج صحتي، دليل المعلم ص 26).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على ممارسة الألعاب الشعبية والحركية في العطلة ومراجعة مهارات الفصل الأول.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=15"}}],[{"title": "مراجعة (إعداد بدني)", "unit": "تمهيدية", "week": "الأول", "date": "6-10/9/2026", "pages": "دليل المعلم ص 18-23 (نماذج التهيئة والإعداد البدني)", "n": 1, "periods": [{"focus": "مراجعة قواعد الحصة والتشكيلات وتمرينات الإعداد البدني للذراعين والرجلين + مراجعة الحركات الأساسية ومهارات الكرة من الصف الأول", "num": 1, "fields": {"المخرجات التعليمية": "1. يتذكر قواعد الأمن والسلامة والتشكيلات الرياضية التي تعلمها في الصف الأول (5 دقائق)\n2. يؤدي تمرينات إعداد بدني للذراعين والرجلين من نماذج الدليل (15 دقيقة)\n3. يلتزم بالنظام أثناء الانتقال بين التشكيلات (5 دقائق)\n4. يؤدي المشي والجري والوثب والحجل في مسار مراجعة (5 دقائق)\n5. يؤدي دحرجة الكرة ورميها وركلها بالطريقة الصحيحة (5 دقائق)\n6. يقيّم أداءه في المهارات السابقة ويحدد ما يحتاج إلى تدريب (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم المبني على اللعب\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: بطاقات التشكيلات\n- أخرى: حبال\n- أخرى: مراتب", "المفاهيم": "- الإعداد البدني\n- التشكيلات\n- قواعد الحصة\n- الإحماء\n- الحركات الأساسية\n- الدحرجة\n- الرمي\n- الركل\n- التهيئة", "التهيئة / التمهيد / التعلم القبلي": "يرحب المعلم بالتلاميذ بعد العطلة ويسأل: ما التشكيلات التي تعلمناها؟ وكيف نستجيب للصافرة؟ ويعرض بطاقات التشكيلات للمراجعة السريعة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. لعبة (النداء على التشكيل): ينتشر التلاميذ بالجري وعند النداء (صف، قطار، دائرة) يكوّنون التشكيل بأسرع وقت، ويستجيب التلميذ للنداء ويكوّن التشكيل مع زملائه (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. يؤدي المعلم نماذج الإعداد البدني من الدليل ص 22: (وقوف. الذراعان جانبًا) تبادل دوران الذراعين أمامًا وخلفًا، (وقوف فتحًا) ثني الركبتين ومدهما، مع التفكير بصوت عالٍ عن العضلات العاملة، ثم تطبيق بالعد، ويقلد التلميذ التمرينات بالعد الصحيح ويذكر الجزء العامل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في مجموعات صغيرة بقائد، تؤدي كل مجموعة تمرينين من الإعداد البدني تختارهما من البطاقات وتعرضهما للصف، والتلاميذ يتعاون مع مجموعته في اختيار التمرينين وعرضهما (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تهدئة وإطالة مع مراجعة قواعد الحصة، ويؤدي التلميذ التهدئة ويذكر قاعدة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تلخيص: لماذا نبدأ الحصة بالإعداد البدني؟ ونموذج التنفس العميق، ويجيب التلميذ ويؤدي التنفس (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات مراجعة بأربع مجموعات: محطة الدحرجة والالتقاط في أزواج، محطة الرمي والاستلام، محطة الركل والإيقاف بين قمعين، محطة الوثب والحجل داخل الأطواق، مع التبديل كل 4 دقائق وتسجيل القائد لأفضل أداء، ويؤدي التلميذ مهمة المحطة ويساعد زملاءه ويبدل بنظام (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (الكرة النارية) بالدحرجة لمراجعة الدحرجة والتوافق، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. يسأل المعلم كل تلميذ: أي مهارة تحتاج إلى تدريب أكثر؟ ويسجل التلميذ إجابته ذهنيًا ليتدرب عليها في المنزل، ويحدد التلميذ المهارة التي يحتاج إلى تطويرها (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n9. تهدئة وإطالة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. غلق الدرس (نشاط ممتع مع المواطنة) – إحماء ألوان العلم: تؤدي كل مجموعة تمرين إعداد بدني للذراعين والرجلين بالعد، وتحمل اسم لون من ألوان علم عمان (الأحمر، الأبيض، الأخضر)، ثم يختم الجميع بتحية العلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (مستوى التطبيق): لماذا نؤدي الإعداد البدني في بداية الحصة؟\nالإجابة: لتسخين العضلات والاستعداد للحركة ومنع الإصابة.\nس3 (مستوى الاستدلال): اذكر تمرينًا للذراعين أديناه اليوم.\nالإجابة: تبادل دوران الذراعين أمامًا وخلفًا.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ تشكيل القطار ببطء، ثم يؤديان تمرين تبادل دوران الذراعين أمامًا وخلفًا بالعد، ثم يسأله: ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة جزء من الإعداد البدني: يختار كل منهم تمرينًا للذراعين أو الرجلين ويؤديه زملاؤه بالعد، ويشرح لماذا نبدأ الحصة بالإعداد البدني.\n\nس4 (مستوى المعرفة): كيف نلتقط الكرة المتدحرجة؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس5 (مستوى التطبيق): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس6 (مستوى الاستدلال): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا والحجل بقدم واحدة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ تشكيل القطار ببطء، ثم يؤديان تمرين تبادل دوران الذراعين أمامًا وخلفًا بالعد، ثم يسأله: ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة جزء من الإعداد البدني: يختار كل منهم تمرينًا للذراعين أو الرجلين ويؤديه زملاؤه بالعد، ويشرح لماذا نبدأ الحصة بالإعداد البدني.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدتين من قواعد الأمن والسلامة في الحصة.\nالإجابة: الاستجابة للصافرة، وعدم الدفع أو التصادم.\nس2 (مستوى التطبيق): أدِّ تمرينًا للرجلين بالعد من 1 إلى 4.\nالإجابة: يثني الركبتين ويمدهما بالعد.\nس3 (مستوى الاستدلال): كيف تنتقل مجموعتك من الصف إلى الدائرة بنظام؟\nالإجابة: يشبك التلاميذ أيديهم ويتحركون بهدوء حتى تكتمل الدائرة.\n\nس4 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس5 (مستوى التطبيق): اذكر محطتين من محطات المراجعة.\nالإجابة: محطة الدحرجة ومحطة الركل (أو الرمي، الوثب).\nس6 (مستوى الاستدلال): ما المهارة التي قررت أن تتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر المهارة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تأكد من تجهيز الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم ص 22.\nإرشاد لولي الأمر: شجع طفلك على التدرب على المهارة التي اختارها (دحرجة أو رمي أو ركل) 10 دقائق يوميًا في مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=1"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتذكر قواعد الأمن والسلامة والتشكيلات الرياضية التي تعلمها في الصف الأول (5 دقائق)\n2. يؤدي تمرينات إعداد بدني للذراعين والرجلين من نماذج الدليل (15 دقيقة)\n3. يلتزم بالنظام أثناء الانتقال بين التشكيلات (5 دقائق)\n4. يؤدي المشي والجري والوثب والحجل في مسار مراجعة (5 دقائق)\n5. يؤدي دحرجة الكرة ورميها وركلها بالطريقة الصحيحة (5 دقائق)\n6. يقيّم أداءه في المهارات السابقة ويحدد ما يحتاج إلى تدريب (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم المبني على اللعب\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: بطاقات التشكيلات\n- أخرى: حبال\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- الإعداد البدني\n- التشكيلات\n- قواعد الحصة\n- الإحماء\n- الحركات الأساسية\n- الدحرجة\n- الرمي\n- الركل\n- التهيئة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرحب المعلم بالتلاميذ بعد العطلة ويسأل: ما التشكيلات التي تعلمناها؟ وكيف نستجيب للصافرة؟ ويعرض بطاقات التشكيلات للمراجعة السريعة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. لعبة (النداء على التشكيل): ينتشر التلاميذ بالجري وعند النداء (صف، قطار، دائرة) يكوّنون التشكيل بأسرع وقت، ويستجيب التلميذ للنداء ويكوّن التشكيل مع زملائه (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. يؤدي المعلم نماذج الإعداد البدني من الدليل ص 22: (وقوف. الذراعان جانبًا) تبادل دوران الذراعين أمامًا وخلفًا، (وقوف فتحًا) ثني الركبتين ومدهما، مع التفكير بصوت عالٍ عن العضلات العاملة، ثم تطبيق بالعد، ويقلد التلميذ التمرينات بالعد الصحيح ويذكر الجزء العامل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في مجموعات صغيرة بقائد، تؤدي كل مجموعة تمرينين من الإعداد البدني تختارهما من البطاقات وتعرضهما للصف، والتلاميذ يتعاون مع مجموعته في اختيار التمرينين وعرضهما (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تهدئة وإطالة مع مراجعة قواعد الحصة، ويؤدي التلميذ التهدئة ويذكر قاعدة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تلخيص: لماذا نبدأ الحصة بالإعداد البدني؟ ونموذج التنفس العميق، ويجيب التلميذ ويؤدي التنفس (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات مراجعة بأربع مجموعات: محطة الدحرجة والالتقاط في أزواج، محطة الرمي والاستلام، محطة الركل والإيقاف بين قمعين، محطة الوثب والحجل داخل الأطواق، مع التبديل كل 4 دقائق وتسجيل القائد لأفضل أداء، ويؤدي التلميذ مهمة المحطة ويساعد زملاءه ويبدل بنظام (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (الكرة النارية) بالدحرجة لمراجعة الدحرجة والتوافق، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. يسأل المعلم كل تلميذ: أي مهارة تحتاج إلى تدريب أكثر؟ ويسجل التلميذ إجابته ذهنيًا ليتدرب عليها في المنزل، ويحدد التلميذ المهارة التي يحتاج إلى تطويرها (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n9. تهدئة وإطالة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. غلق الدرس (نشاط ممتع مع المواطنة) – إحماء ألوان العلم: تؤدي كل مجموعة تمرين إعداد بدني للذراعين والرجلين بالعد، وتحمل اسم لون من ألوان علم عمان (الأحمر، الأبيض، الأخضر)، ثم يختم الجميع بتحية العلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (مستوى التطبيق): لماذا نؤدي الإعداد البدني في بداية الحصة؟\nالإجابة: لتسخين العضلات والاستعداد للحركة ومنع الإصابة.\nس3 (مستوى الاستدلال): اذكر تمرينًا للذراعين أديناه اليوم.\nالإجابة: تبادل دوران الذراعين أمامًا وخلفًا.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ تشكيل القطار ببطء، ثم يؤديان تمرين تبادل دوران الذراعين أمامًا وخلفًا بالعد، ثم يسأله: ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة جزء من الإعداد البدني: يختار كل منهم تمرينًا للذراعين أو الرجلين ويؤديه زملاؤه بالعد، ويشرح لماذا نبدأ الحصة بالإعداد البدني.\n\nس4 (مستوى المعرفة): كيف نلتقط الكرة المتدحرجة؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس5 (مستوى التطبيق): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس6 (مستوى الاستدلال): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا والحجل بقدم واحدة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ تشكيل القطار ببطء، ثم يؤديان تمرين تبادل دوران الذراعين أمامًا وخلفًا بالعد، ثم يسأله: ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة جزء من الإعداد البدني: يختار كل منهم تمرينًا للذراعين أو الرجلين ويؤديه زملاؤه بالعد، ويشرح لماذا نبدأ الحصة بالإعداد البدني.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر قاعدتين من قواعد الأمن والسلامة في الحصة.\nالإجابة: الاستجابة للصافرة، وعدم الدفع أو التصادم.\nس2 (مستوى التطبيق): أدِّ تمرينًا للرجلين بالعد من 1 إلى 4.\nالإجابة: يثني الركبتين ويمدهما بالعد.\nس3 (مستوى الاستدلال): كيف تنتقل مجموعتك من الصف إلى الدائرة بنظام؟\nالإجابة: يشبك التلاميذ أيديهم ويتحركون بهدوء حتى تكتمل الدائرة.\n\nس4 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس5 (مستوى التطبيق): اذكر محطتين من محطات المراجعة.\nالإجابة: محطة الدحرجة ومحطة الركل (أو الرمي، الوثب).\nس6 (مستوى الاستدلال): ما المهارة التي قررت أن تتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر المهارة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من تجهيز الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم ص 22.\nإرشاد لولي الأمر: شجع طفلك على التدرب على المهارة التي اختارها (دحرجة أو رمي أو ركل) 10 دقائق يوميًا في مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=1"}}, {"title": "الأوضاع المشتقة في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 32-41", "n": 1, "periods": [{"focus": "الأوضاع المشتقة من الوقوف + الأوضاع المشتقة من الجثو والجلوس والرقود والتمرين منها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الوقوف (فتحًا، انحناء، ثبات الوسط، الذراعان جانبًا) (10 دقائق)\n2. يميز بين الوضع الأساسي والوضع المشتق (5 دقائق)\n3. يؤدي أوضاعًا مشتقة من الوقوف بدقة (5 دقائق)\n4. يتعرف الأوضاع المشتقة من الجثو والجلوس والرقود (10 دقائق)\n5. يؤدي تمرينات من الأوضاع المشتقة بالعد (5 دقائق)\n6. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: كرات\n- أخرى: مقاعد سويدية", "المفاهيم": "- التمرين\n- الوضع الأساسي\n- الوضع المشتق\n- الوقوف\n- الجذع\n- الجثو\n- الجلوس\n- الرقود\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم في وضع الوقوف الأساسي ثم يفتح رجليه ويسأل: ماذا تغير؟ ويشرح أن ما تغير يسمى وضعًا مشتقًا من الوقوف (ص 32-33).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم تمرينات للذراعين والرجلين من الوقوف، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج الأوضاع المشتقة من الوقوف بتحريك الرجلين (وقوف فتحًا، وقوف إحدى الرجلين أمامًا) وبتحريك الذراعين (الذراعان جانبًا، عاليًا، ثبات الوسط) وبتحريك الجذع (انحناء) مع التفكير بصوت عالٍ (ص 33-35)، ثم تطبيق موجه بالبطاقات، ويقلد كل وضع ويسمّيه ويصحح زميله من البطاقة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يعطي المعلم كل زوج بطاقة وضع أساسي ويطلب ابتكار ثلاثة أوضاع مشتقة منه بتحريك جزء واحد فقط، ثم يستنتج التلاميذ أن الوضع المشتق = وضع أساسي + تغيير في جزء، ويبتكر التلميذ الأوضاع مع زميله ويصوغ الاستنتاج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال الأوضاع): جري حر وعند نداء (وقوف فتحًا) أو (وقوف الذراعان جانبًا) يثبت التلميذ في الوضع داخل أقرب طوق، ويستجيب التلميذ بالوضع الصحيح (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم نماذج: (جثو. انحناء جانبًا)، (جثو. فتحًا)، (جثو نصفًا)، (جلوس طويل)، (جلوس تربيع. الذراعان جانبًا)، (رقود. فتحًا) مع النقاط الفنية (ص 36-38)، ثم تمرين بسيط من كل وضع بالعد، ويقلد التلميذ الأوضاع ويؤدي التمرين بالعد (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات الأوضاع المشتقة بأربع مجموعات: محطة الجثو (ثني الجذع جانبًا)، محطة الجلوس الطويل (مد الذراعين للقدمين)، محطة الرقود (رفع الرجلين بالتبادل)، محطة المقعد (جلوس على المقعد ومد الرجلين)، مع التبديل، وتؤدي المجموعة تمرين محطتها بالوضع الصحيح وتنتقل بنظام (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 5 (ألعاب الأوضاع المشتقة) ص 41: يجري التلاميذ في محيط دائرة وعند النداء يؤدي كل تلميذ الوضع المحدد داخل طوق، ومن لا يجد طوقًا يصبح مناديًا، ويلعب التلميذ ويؤدي الوضع بسرعة ودقة (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة من وضع الرقود مع التنفس، وحوار عن فائدة التمرينات للقوام، ويؤدي التلميذ التهدئة ويذكر فائدة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – صور من سوق مطرح: تتخذ كل مجموعة وضعًا مشتقًا يمثل شخصية في سوق مطرح، كالبائع بذراعين جانبًا يعرض بضاعته أو الحمّال بانحناء، ويخمن الآخرون الوضع واسمه (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الوضع الأساسي الذي اشتققنا منه أوضاع اليوم؟\nالإجابة: الوقوف.\nس2 (مستوى التطبيق): أدِّ وضع (وقوف فتحًا).\nالإجابة: يقف والقدمان متباعدتان بعرض الحوض.\nس3 (مستوى الاستدلال): ما الفرق بين الوضع الأساسي والوضع المشتق؟\nالإجابة: المشتق وضع أساسي تغير فيه جزء من الجسم (رجل أو ذراع أو جذع).\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضع الوقوف الأساسي ثم الوقوف فتحًا وثبات الوسط ببطء، ويؤديها التلميذ معه، ثم ينادي «وقوف فتحًا!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتغيير جزء واحد من وضع أساسي (الجثو أو الجلوس أو الرقود) لابتكار وضع مشتق جديد، وتسميته وتعليمه لزميل.\n\nس4 (مستوى المعرفة): من أي وضع أساسي اشتققنا (جلوس طويل)؟\nالإجابة: الجلوس.\nس5 (مستوى التطبيق): أدِّ وضع (رقود. فتحًا).\nالإجابة: يرقد على الظهر والقدمان متباعدتان.\nس6 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين بالتبادل.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضع الوقوف الأساسي ثم الوقوف فتحًا وثبات الوسط ببطء، ويؤديها التلميذ معه، ثم ينادي «وقوف فتحًا!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتغيير جزء واحد من وضع أساسي (الجثو أو الجلوس أو الرقود) لابتكار وضع مشتق جديد، وتسميته وتعليمه لزميل.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر وضعين مشتقين من الوقوف بتحريك الذراعين.\nالإجابة: وقوف الذراعان جانبًا، وقوف الذراعان عاليًا.\nس2 (مستوى التطبيق): أرفع بطاقة (وقوف. انحناء)، أدِّ الوضع.\nالإجابة: يثني الجذع أمامًا من الوقوف والركبتان مستقيمتان.\nس3 (مستوى الاستدلال): ابتكر وضعًا مشتقًا جديدًا من الوقوف وسمِّه.\nالإجابة: مثل: وقوف. ثبات الوسط. إحدى الرجلين أمامًا.\n\nس4 (مستوى المعرفة): اذكر الأوضاع الأساسية الأربعة التي اشتققنا منها أوضاع هذا الدرس.\nالإجابة: الوقوف، الجثو، الجلوس، الرقود.\nس5 (مستوى التطبيق): أرفع بطاقة (جثو نصفًا)، أدِّ الوضع.\nالإجابة: يرتكز على ركبة واحدة والقدم الأخرى أمامًا والساق عمودية.\nس6 (مستوى الاستدلال): لماذا تحافظ تمرينات الأوضاع على قوامنا؟\nالإجابة: لأنها تقوي عضلات الجذع والظهر فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الوقوف في دليل المعلم ص 33-35 واطلب منه أداء ثلاثة منها.\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا من وضع الجلوس الطويل وآخر من الرقود يوميًا (دليل المعلم ص 36-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الأوضاع المشتقة من الوقوف (فتحًا، انحناء، ثبات الوسط، الذراعان جانبًا) (10 دقائق)\n2. يميز بين الوضع الأساسي والوضع المشتق (5 دقائق)\n3. يؤدي أوضاعًا مشتقة من الوقوف بدقة (5 دقائق)\n4. يتعرف الأوضاع المشتقة من الجثو والجلوس والرقود (10 دقائق)\n5. يؤدي تمرينات من الأوضاع المشتقة بالعد (5 دقائق)\n6. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: كرات\n- أخرى: مقاعد سويدية", "المفاهيم": "الحصة 1:\n- التمرين\n- الوضع الأساسي\n- الوضع المشتق\n- الوقوف\n- الجذع\n- الجثو\n- الجلوس\n- الرقود\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف المعلم في وضع الوقوف الأساسي ثم يفتح رجليه ويسأل: ماذا تغير؟ ويشرح أن ما تغير يسمى وضعًا مشتقًا من الوقوف (ص 32-33).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري خفيف ثم تمرينات للذراعين والرجلين من الوقوف، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج الأوضاع المشتقة من الوقوف بتحريك الر
