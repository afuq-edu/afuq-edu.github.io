مراتب", "المفاهيم": "- الحركات الأساسية\n- الدحرجة\n- الرمي\n- الركل\n- التهيئة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا تعلمنا بالكرة في الصف الأول؟ ويعرض كرة ويطلب من ثلاثة تلاميذ أداء الدحرجة والرمي والركل.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: مشي، جري، وثب فوق الحبال، حجل بين الأقماع، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات مراجعة بأربع مجموعات: محطة الدحرجة والالتقاط في أزواج، محطة الرمي والاستلام، محطة الركل والإيقاف بين قمعين، محطة الوثب والحجل داخل الأطواق، مع التبديل كل 4 دقائق وتسجيل القائد لأفضل أداء، ويؤدي التلميذ مهمة المحطة ويساعد زملاءه ويبدل بنظام (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة (الكرة النارية) بالدحرجة لمراجعة الدحرجة والتوافق، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم كل تلميذ: أي مهارة تحتاج إلى تدريب أكثر؟ ويسجل التلميذ إجابته ذهنيًا ليتدرب عليها في المنزل، ويحدد التلميذ المهارة التي يحتاج إلى تطويرها (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – إحماء ألوان العلم: تؤدي كل مجموعة تمرين إعداد بدني للذراعين والرجلين بالعد، وتحمل اسم لون من ألوان علم عمان (الأحمر، الأبيض، الأخضر)، ثم يختم الجميع بتحية العلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف نلتقط الكرة المتدحرجة؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس2 (مستوى التطبيق): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس3 (مستوى الاستدلال): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا والحجل بقدم واحدة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ تشكيل القطار ببطء، ثم يؤديان تمرين تبادل دوران الذراعين أمامًا وخلفًا بالعد، ثم يسأله: ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة جزء من الإعداد البدني: يختار كل منهم تمرينًا للذراعين أو الرجلين ويؤديه زملاؤه بالعد، ويشرح لماذا نبدأ الحصة بالإعداد البدني.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات المراجعة.\nالإجابة: محطة الدحرجة ومحطة الركل (أو الرمي، الوثب).\nس3 (مستوى الاستدلال): ما المهارة التي قررت أن تتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر المهارة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على التدرب على المهارة التي اختارها (دحرجة أو رمي أو ركل) 10 دقائق يوميًا في مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=1"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتذكر قواعد الأمن والسلامة والتشكيلات الرياضية التي تعلمها في الصف الأول (10 دقائق)\n2. يؤدي تمرينات إعداد بدني للذراعين والرجلين من نماذج الدليل (25 دقيقة)\n3. يلتزم بالنظام أثناء الانتقال بين التشكيلات (5 دقائق)\n\nالحصة 2:\n1. يؤدي المشي والجري والوثب والحجل في مسار مراجعة (15 دقيقة)\n2. يؤدي دحرجة الكرة ورميها وركلها بالطريقة الصحيحة (10 دقائق)\n3. يقيّم أداءه في المهارات السابقة ويحدد ما يحتاج إلى تدريب (15 دقيقة)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم المبني على اللعب\n- التعلم بالنمذجة\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم الذاتي", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: بطاقات التشكيلات\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- الإعداد البدني\n- التشكيلات\n- قواعد الحصة\n- الإحماء\n\nالحصة 2:\n- الحركات الأساسية\n- الدحرجة\n- الرمي\n- الركل\n- التهيئة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرحب المعلم بالتلاميذ بعد العطلة ويسأل: ما التشكيلات التي تعلمناها؟ وكيف نستجيب للصافرة؟ ويعرض بطاقات التشكيلات للمراجعة السريعة.\n\nالحصة 2:\nيسأل المعلم: ماذا تعلمنا بالكرة في الصف الأول؟ ويعرض كرة ويطلب من ثلاثة تلاميذ أداء الدحرجة والرمي والركل.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. لعبة (النداء على التشكيل): ينتشر التلاميذ بالجري وعند النداء (صف، قطار، دائرة) يكوّنون التشكيل بأسرع وقت، ويستجيب التلميذ للنداء ويكوّن التشكيل مع زملائه (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. يؤدي المعلم نماذج الإعداد البدني من الدليل ص 22: (وقوف. الذراعان جانبًا) تبادل دوران الذراعين أمامًا وخلفًا، (وقوف فتحًا) ثني الركبتين ومدهما، مع التفكير بصوت عالٍ عن العضلات العاملة، ثم تطبيق بالعد، ويقلد التلميذ التمرينات بالعد الصحيح ويذكر الجزء العامل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في مجموعات صغيرة بقائد، تؤدي كل مجموعة تمرينين من الإعداد البدني تختارهما من البطاقات وتعرضهما للصف، والتلاميذ يتعاون مع مجموعته في اختيار التمرينين وعرضهما (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تهدئة وإطالة مع مراجعة قواعد الحصة، ويؤدي التلميذ التهدئة ويذكر قاعدة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تلخيص: لماذا نبدأ الحصة بالإعداد البدني؟ ونموذج التنفس العميق، ويجيب التلميذ ويؤدي التنفس (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: مشي، جري، وثب فوق الحبال، حجل بين الأقماع، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات مراجعة بأربع مجموعات: محطة الدحرجة والالتقاط في أزواج، محطة الرمي والاستلام، محطة الركل والإيقاف بين قمعين، محطة الوثب والحجل داخل الأطواق، مع التبديل كل 4 دقائق وتسجيل القائد لأفضل أداء، ويؤدي التلميذ مهمة المحطة ويساعد زملاءه ويبدل بنظام (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة (الكرة النارية) بالدحرجة لمراجعة الدحرجة والتوافق، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم كل تلميذ: أي مهارة تحتاج إلى تدريب أكثر؟ ويسجل التلميذ إجابته ذهنيًا ليتدرب عليها في المنزل، ويحدد التلميذ المهارة التي يحتاج إلى تطويرها (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – إحماء ألوان العلم: تؤدي كل مجموعة تمرين إعداد بدني للذراعين والرجلين بالعد، وتحمل اسم لون من ألوان علم عمان (الأحمر، الأبيض، الأخضر)، ثم يختم الجميع بتحية العلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (مستوى التطبيق): لماذا نؤدي الإعداد البدني في بداية الحصة؟\nالإجابة: لتسخين العضلات والاستعداد للحركة ومنع الإصابة.\nس3 (مستوى الاستدلال): اذكر تمرينًا للذراعين أديناه اليوم.\nالإجابة: تبادل دوران الذراعين أمامًا وخلفًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف نلتقط الكرة المتدحرجة؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس2 (مستوى التطبيق): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس3 (مستوى الاستدلال): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا والحجل بقدم واحدة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ تشكيل القطار ببطء، ثم يؤديان تمرين تبادل دوران الذراعين أمامًا وخلفًا بالعد، ثم يسأله: ما التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة جزء من الإعداد البدني: يختار كل منهم تمرينًا للذراعين أو الرجلين ويؤديه زملاؤه بالعد، ويشرح لماذا نبدأ الحصة بالإعداد البدني.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر قاعدتين من قواعد الأمن والسلامة في الحصة.\nالإجابة: الاستجابة للصافرة، وعدم الدفع أو التصادم.\nس2 (مستوى التطبيق): أدِّ تمرينًا للرجلين بالعد من 1 إلى 4.\nالإجابة: يثني الركبتين ويمدهما بالعد.\nس3 (مستوى الاستدلال): كيف تنتقل مجموعتك من الصف إلى الدائرة بنظام؟\nالإجابة: يشبك التلاميذ أيديهم ويتحركون بهدوء حتى تكتمل الدائرة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات المراجعة.\nالإجابة: محطة الدحرجة ومحطة الركل (أو الرمي، الوثب).\nس3 (مستوى الاستدلال): ما المهارة التي قررت أن تتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر المهارة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من تجهيز الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم ص 22.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على التدرب على المهارة التي اختارها (دحرجة أو رمي أو ركل) 10 دقائق يوميًا في مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=1"}}, {"title": "الأوضاع المشتقة في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 32-41", "n": 2, "periods": [{"focus": "الأوضاع المشتقة من الوقوف", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الوقوف (فتحًا، انحناء، ثبات الوسط، الذراعان جانبًا) (20 دقيقة)\n2. يميز بين الوضع الأساسي والوضع المشتق (10 دقائق)\n3. يؤدي أوضاعًا مشتقة من الوقوف بدقة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- التمرين\n- الوضع الأساسي\n- الوضع المشتق\n- الوقوف\n- الجذع", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم في وضع الوقوف الأساسي ثم يفتح رجليه ويسأل: ماذا تغير؟ ويشرح أن ما تغير يسمى وضعًا مشتقًا من الوقوف (ص 32-33).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم تمرينات للذراعين والرجلين من الوقوف، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج الأوضاع المشتقة من الوقوف بتحريك الرجلين (وقوف فتحًا، وقوف إحدى الرجلين أمامًا) وبتحريك الذراعين (الذراعان جانبًا، عاليًا، ثبات الوسط) وبتحريك الجذع (انحناء) مع التفكير بصوت عالٍ (ص 33-35)، ثم تطبيق موجه بالبطاقات، ويقلد كل وضع ويسمّيه ويصحح زميله من البطاقة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يعطي المعلم كل زوج بطاقة وضع أساسي ويطلب ابتكار ثلاثة أوضاع مشتقة منه بتحريك جزء واحد فقط، ثم يستنتج التلاميذ أن الوضع المشتق = وضع أساسي + تغيير في جزء، ويبتكر التلميذ الأوضاع مع زميله ويصوغ الاستنتاج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال الأوضاع): جري حر وعند نداء (وقوف فتحًا) أو (وقوف الذراعان جانبًا) يثبت التلميذ في الوضع داخل أقرب طوق، ويستجيب التلميذ بالوضع الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة الجذع والذراعين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الوضع الأساسي الذي اشتققنا منه أوضاع اليوم؟\nالإجابة: الوقوف.\nس2 (مستوى التطبيق): أدِّ وضع (وقوف فتحًا).\nالإجابة: يقف والقدمان متباعدتان بعرض الحوض.\nس3 (مستوى الاستدلال): ما الفرق بين الوضع الأساسي والوضع المشتق؟\nالإجابة: المشتق وضع أساسي تغير فيه جزء من الجسم (رجل أو ذراع أو جذع).\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضع الوقوف الأساسي ثم الوقوف فتحًا وثبات الوسط ببطء، ويؤديها التلميذ معه، ثم ينادي «وقوف فتحًا!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتغيير جزء واحد من وضع أساسي (الجثو أو الجلوس أو الرقود) لابتكار وضع مشتق جديد، وتسميته وتعليمه لزميل.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر وضعين مشتقين من الوقوف بتحريك الذراعين.\nالإجابة: وقوف الذراعان جانبًا، وقوف الذراعان عاليًا.\nس2 (مستوى التطبيق): أرفع بطاقة (وقوف. انحناء)، أدِّ الوضع.\nالإجابة: يثني الجذع أمامًا من الوقوف والركبتان مستقيمتان.\nس3 (مستوى الاستدلال): ابتكر وضعًا مشتقًا جديدًا من الوقوف وسمِّه.\nالإجابة: مثل: وقوف. ثبات الوسط. إحدى الرجلين أمامًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الوقوف في دليل المعلم ص 33-35 واطلب منه أداء ثلاثة منها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=2"}}, {"focus": "الأوضاع المشتقة من الجثو والجلوس والرقود والتمرين منها", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الجثو والجلوس والرقود (20 دقيقة)\n2. يؤدي تمرينات من الأوضاع المشتقة بالعد (10 دقائق)\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: كرات\n- أخرى: مقاعد سويدية\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: أطواق", "المفاهيم": "- الجثو\n- الجلوس\n- الرقود\n- الوضع المشتق\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم أوضاع الحصة السابقة بالنداء، ثم يجثو ويمد رجلًا جانبًا ويسأل: من أي وضع أساسي اشتققت هذا الوضع؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ثم أوضاع مشتقة من الوقوف بالنداء، ويقلد التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج: (جثو. انحناء جانبًا)، (جثو. فتحًا)، (جثو نصفًا)، (جلوس طويل)، (جلوس تربيع. الذراعان جانبًا)، (رقود. فتحًا) مع النقاط الفنية (ص 36-38)، ثم تمرين بسيط من كل وضع بالعد، ويقلد التلميذ الأوضاع ويؤدي التمرين بالعد (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الأوضاع المشتقة بأربع مجموعات: محطة الجثو (ثني الجذع جانبًا)، محطة الجلوس الطويل (مد الذراعين للقدمين)، محطة الرقود (رفع الرجلين بالتبادل)، محطة المقعد (جلوس على المقعد ومد الرجلين)، مع التبديل، وتؤدي المجموعة تمرين محطتها بالوضع الصحيح وتنتقل بنظام (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 5 (ألعاب الأوضاع المشتقة) ص 41: يجري التلاميذ في محيط دائرة وعند النداء يؤدي كل تلميذ الوضع المحدد داخل طوق، ومن لا يجد طوقًا يصبح مناديًا، ويلعب التلميذ ويؤدي الوضع بسرعة ودقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من وضع الرقود مع التنفس، وحوار عن فائدة التمرينات للقوام، ويؤدي التلميذ التهدئة ويذكر فائدة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – صور من سوق مطرح: تتخذ كل مجموعة وضعًا مشتقًا يمثل شخصية في سوق مطرح، كالبائع بذراعين جانبًا يعرض بضاعته أو الحمّال بانحناء، ويخمن الآخرون الوضع واسمه (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): من أي وضع أساسي اشتققنا (جلوس طويل)؟\nالإجابة: الجلوس.\nس2 (مستوى التطبيق): أدِّ وضع (رقود. فتحًا).\nالإجابة: يرقد على الظهر والقدمان متباعدتان.\nس3 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين بالتبادل.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضع الوقوف الأساسي ثم الوقوف فتحًا وثبات الوسط ببطء، ويؤديها التلميذ معه، ثم ينادي «وقوف فتحًا!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتغيير جزء واحد من وضع أساسي (الجثو أو الجلوس أو الرقود) لابتكار وضع مشتق جديد، وتسميته وتعليمه لزميل.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر الأوضاع الأساسية الأربعة التي اشتققنا منها أوضاع هذا الدرس.\nالإجابة: الوقوف، الجثو، الجلوس، الرقود.\nس2 (مستوى التطبيق): أرفع بطاقة (جثو نصفًا)، أدِّ الوضع.\nالإجابة: يرتكز على ركبة واحدة والقدم الأخرى أمامًا والساق عمودية.\nس3 (مستوى الاستدلال): لماذا تحافظ تمرينات الأوضاع على قوامنا؟\nالإجابة: لأنها تقوي عضلات الجذع والظهر فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا من وضع الجلوس الطويل وآخر من الرقود يوميًا (دليل المعلم ص 36-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الأوضاع المشتقة من الوقوف (فتحًا، انحناء، ثبات الوسط، الذراعان جانبًا) (20 دقيقة)\n2. يميز بين الوضع الأساسي والوضع المشتق (10 دقائق)\n3. يؤدي أوضاعًا مشتقة من الوقوف بدقة (10 دقائق)\n\nالحصة 2:\n1. يتعرف الأوضاع المشتقة من الجثو والجلوس والرقود (20 دقيقة)\n2. يؤدي تمرينات من الأوضاع المشتقة بالعد (10 دقائق)\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: كرات\n- أخرى: مقاعد سويدية\n- أخرى: بطاقات مصورة للأوضاع\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- التمرين\n- الوضع الأساسي\n- الوضع المشتق\n- الوقوف\n- الجذع\n\nالحصة 2:\n- الجثو\n- الجلوس\n- الرقود\n- الوضع المشتق\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف المعلم في وضع الوقوف الأساسي ثم يفتح رجليه ويسأل: ماذا تغير؟ ويشرح أن ما تغير يسمى وضعًا مشتقًا من الوقوف (ص 32-33).\n\nالحصة 2:\nيراجع المعلم أوضاع الحصة السابقة بالنداء، ثم يجثو ويمد رجلًا جانبًا ويسأل: من أي وضع أساسي اشتققت هذا الوضع؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف ثم تمرينات للذراعين والرجلين من الوقوف، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج الأوضاع المشتقة من الوقوف بتحريك الرجلين (وقوف فتحًا، وقوف إحدى الرجلين أمامًا) وبتحريك الذراعين (الذراعان جانبًا، عاليًا، ثبات الوسط) وبتحريك الجذع (انحناء) مع التفكير بصوت عالٍ (ص 33-35)، ثم تطبيق موجه بالبطاقات، ويقلد كل وضع ويسمّيه ويصحح زميله من البطاقة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يعطي المعلم كل زوج بطاقة وضع أساسي ويطلب ابتكار ثلاثة أوضاع مشتقة منه بتحريك جزء واحد فقط، ثم يستنتج التلاميذ أن الوضع المشتق = وضع أساسي + تغيير في جزء، ويبتكر التلميذ الأوضاع مع زميله ويصوغ الاستنتاج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال الأوضاع): جري حر وعند نداء (وقوف فتحًا) أو (وقوف الذراعان جانبًا) يثبت التلميذ في الوضع داخل أقرب طوق، ويستجيب التلميذ بالوضع الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة الجذع والذراعين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري ثم أوضاع مشتقة من الوقوف بالنداء، ويقلد التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج: (جثو. انحناء جانبًا)، (جثو. فتحًا)، (جثو نصفًا)، (جلوس طويل)، (جلوس تربيع. الذراعان جانبًا)، (رقود. فتحًا) مع النقاط الفنية (ص 36-38)، ثم تمرين بسيط من كل وضع بالعد، ويقلد التلميذ الأوضاع ويؤدي التمرين بالعد (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الأوضاع المشتقة بأربع مجموعات: محطة الجثو (ثني الجذع جانبًا)، محطة الجلوس الطويل (مد الذراعين للقدمين)، محطة الرقود (رفع الرجلين بالتبادل)، محطة المقعد (جلوس على المقعد ومد الرجلين)، مع التبديل، وتؤدي المجموعة تمرين محطتها بالوضع الصحيح وتنتقل بنظام (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 5 (ألعاب الأوضاع المشتقة) ص 41: يجري التلاميذ في محيط دائرة وعند النداء يؤدي كل تلميذ الوضع المحدد داخل طوق، ومن لا يجد طوقًا يصبح مناديًا، ويلعب التلميذ ويؤدي الوضع بسرعة ودقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من وضع الرقود مع التنفس، وحوار عن فائدة التمرينات للقوام، ويؤدي التلميذ التهدئة ويذكر فائدة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – صور من سوق مطرح: تتخذ كل مجموعة وضعًا مشتقًا يمثل شخصية في سوق مطرح، كالبائع بذراعين جانبًا يعرض بضاعته أو الحمّال بانحناء، ويخمن الآخرون الوضع واسمه (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما الوضع الأساسي الذي اشتققنا منه أوضاع اليوم؟\nالإجابة: الوقوف.\nس2 (مستوى التطبيق): أدِّ وضع (وقوف فتحًا).\nالإجابة: يقف والقدمان متباعدتان بعرض الحوض.\nس3 (مستوى الاستدلال): ما الفرق بين الوضع الأساسي والوضع المشتق؟\nالإجابة: المشتق وضع أساسي تغير فيه جزء من الجسم (رجل أو ذراع أو جذع).\n\nالحصة 2:\nس1 (مستوى المعرفة): من أي وضع أساسي اشتققنا (جلوس طويل)؟\nالإجابة: الجلوس.\nس2 (مستوى التطبيق): أدِّ وضع (رقود. فتحًا).\nالإجابة: يرقد على الظهر والقدمان متباعدتان.\nس3 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين بالتبادل.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضع الوقوف الأساسي ثم الوقوف فتحًا وثبات الوسط ببطء، ويؤديها التلميذ معه، ثم ينادي «وقوف فتحًا!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتغيير جزء واحد من وضع أساسي (الجثو أو الجلوس أو الرقود) لابتكار وضع مشتق جديد، وتسميته وتعليمه لزميل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر وضعين مشتقين من الوقوف بتحريك الذراعين.\nالإجابة: وقوف الذراعان جانبًا، وقوف الذراعان عاليًا.\nس2 (مستوى التطبيق): أرفع بطاقة (وقوف. انحناء)، أدِّ الوضع.\nالإجابة: يثني الجذع أمامًا من الوقوف والركبتان مستقيمتان.\nس3 (مستوى الاستدلال): ابتكر وضعًا مشتقًا جديدًا من الوقوف وسمِّه.\nالإجابة: مثل: وقوف. ثبات الوسط. إحدى الرجلين أمامًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر الأوضاع الأساسية الأربعة التي اشتققنا منها أوضاع هذا الدرس.\nالإجابة: الوقوف، الجثو، الجلوس، الرقود.\nس2 (مستوى التطبيق): أرفع بطاقة (جثو نصفًا)، أدِّ الوضع.\nالإجابة: يرتكز على ركبة واحدة والقدم الأخرى أمامًا والساق عمودية.\nس3 (مستوى الاستدلال): لماذا تحافظ تمرينات الأوضاع على قوامنا؟\nالإجابة: لأنها تقوي عضلات الجذع والظهر فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الوقوف في دليل المعلم ص 33-35 واطلب منه أداء ثلاثة منها.\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا من وضع الجلوس الطويل وآخر من الرقود يوميًا (دليل المعلم ص 36-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=2"}}, {"title": "التمرينات الحرة", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 42-50", "n": 2, "periods": [{"focus": "التمرينات الحرة الفردية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الحرة الفردية وأهميتها (10 دقائق)\n2. يؤدي تمرينات حرة فردية للذراعين والجذع والرجلين بالعد (25 دقيقة)\n3. يميز بين التمرين الحر الفردي والتمرين بالأدوات (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات\n- صورة توضيحية", "المفاهيم": "- التمرين الحر\n- التمرينات الحرة الفردية\n- الجذع\n- الإيقاع", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: هل نحتاج إلى أدوات لنتمرن؟ ويؤدي تمرينًا بلا أدوات، ويوضح أن التمرينات التي تؤدى بالجسم فقط تسمى تمرينات حرة (ص 42-43).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم تحريك المفاصل، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج التمرينات الحرة الفردية من الدليل ص 43-45: (وقوف) تبادل رفع الذراعين عاليًا، (وقوف فتحًا) لف الجذع، (جلوس طويل) ثني الجذع أمامًا، (رقود) رفع الرجلين، بالعد الرباعي مع التفكير بصوت عالٍ، ويقلد التلميذ التمرينات بالعد ويذكر الجزء العامل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 ص 46: بطاقات تمرينات حرة؛ يؤدي كل تلميذ التمرين ويكتشف العضلة التي تعمل (يشعر بها) ويصنف البطاقات إلى ذراعين وجذع ورجلين، ويجرب التلميذ ويصنف البطاقات حسب الجزء العامل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (العدد والتمرين) ص 50: ينادي المعلم تمرينًا ورقمًا، فيتجمع التلاميذ بعدد الرقم ويؤدون التمرين معًا، ويلعب التلميذ ويؤدي التمرين مع العدد الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة فردية، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما التمرين الحر؟\nالإجابة: تمرين يؤدى بالجسم دون أدوات.\nس2 (مستوى التطبيق): اذكر تمرينًا حرًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (مستوى الاستدلال): كيف عرفت أن التمرين للرجلين؟\nالإجابة: لأنني شعرت بعمل عضلات الفخذين والساقين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرينًا حرًا للذراعين وآخر للجذع (لف الجذع من الوقوف فتحًا) ببطء بالعد، ثم يسأله: هل نحتاج إلى أدوات في التمرين الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين حر زوجي مع زميل للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد العضلات التي تعمل فيه.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تمرينًا حرًا للذراعين بالعد.\nالإجابة: يؤدي تبادل رفع الذراعين بالعد الرباعي.\nس2 (مستوى التطبيق): صنّف: (رقود) رفع الرجلين، لأي جزء هذا التمرين؟\nالإجابة: للرجلين (وعضلات البطن).\nس3 (مستوى الاستدلال): ما الفرق بين التمرين الحر والتمرين بالكرة؟\nالإجابة: التمرين الحر بلا أدوات، والتمرين بالكرة يستخدم أداة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاثة تمرينات حرة (للذراعين والجذع والرجلين) بالعد صباحًا (دليل المعلم ص 43-46).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=3"}}, {"focus": "التمرينات الحرة الزوجية", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الحرة الزوجية وشروط أدائها مع الزميل (10 دقائق)\n2. يؤدي تمرينات حرة زوجية بالتوافق مع الزميل (20 دقيقة)\n3. يقدر أهمية التمرينات الحرة في المحافظة على اللياقة البدنية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات الزوجية", "المفاهيم": "- التمرينات الحرة الزوجية\n- التوافق\n- الزميل\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الحصة السابقة بالنداء، ثم يؤدي مع تلميذ تمرينًا زوجيًا (جلوس طويل مواجه، تبادل شد الذراعين) ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم في أزواج: جري جنبًا إلى جنب ومرجحات، ويقلد التلميذ مع زميله (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ نماذج التمرينات الزوجية ص 47-48: (وقوف. جنبًا لجنب. الذراع الداخلية على كتف الزميل) مرجحة الرجل الخارجية، (جلوس طويل مواجه. مسك الأيدي) تبادل شد الجذع، (رقود. مواجه. مسك القدمين) الجلوس من الرقود؛ مع شرح التوقيت المشترك، ويؤدي التلميذ التمرينات مع زميله بالعد المشترك (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار (قائد يعد، وزميل ينفذ ثم يتبادلان)، تؤدي كل مجموعة ثلاث بطاقات زوجية ثم تبتكر تمرينًا زوجيًا جديدًا وتعرضه، والتلاميذ يتعاون مع زميله ويبتكر تمرينًا زوجيًا (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المرآة الزوجية): يؤدي أحد الزوجين تمرينًا حرًا ويقلده الآخر كالمرآة، وتفوز الثنائية الأدق، ويلعب التلميذ بدقة وتوافق (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة زوجية بالإطالة مع مساعدة الزميل، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – عدّ بأسماء الولايات: يؤدي الأزواج تمرينًا حرًا للذراعين والجذع والرجلين، ويعدّون بأسماء ثماني ولايات عمانية بدل الأرقام، ويتبادلون اختيار التمرين والولايات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما التمرين الزوجي؟\nالإجابة: تمرين يؤديه تلميذان معًا بالتوافق.\nس2 (مستوى التطبيق): أدِّ مع زميلك تمرين (جلوس طويل مواجه) تبادل شد الجذع.\nالإجابة: يؤديانه بالتوافق.\nس3 (مستوى الاستدلال): ماذا يحدث لو لم نعد معًا في التمرين الزوجي؟\nالإجابة: يختل التوافق وقد نسقط أو نؤذي الزميل.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرينًا حرًا للذراعين وآخر للجذع (لف الجذع من الوقوف فتحًا) ببطء بالعد، ثم يسأله: هل نحتاج إلى أدوات في التمرين الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين حر زوجي مع زميل للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد العضلات التي تعمل فيه.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر تمرينًا زوجيًا للرجلين.\nالإجابة: مرجحة الرجل الخارجية من الوقوف جنبًا إلى جنب مع مسك كتف الزميل.\nس2 (مستوى التطبيق): ما شروط التمرين الزوجي الآمن؟\nالإجابة: العد معًا، والإمساك الصحيح، وعدم الشد بعنف.\nس3 (مستوى الاستدلال): لماذا تحافظ التمرينات الحرة على لياقتنا؟\nالإجابة: لأنها تقوي العضلات وتزيد المرونة دون الحاجة إلى أدوات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا (الجلوس من الرقود مع مسك القدمين) 5 مرات (دليل المعلم ص 47-48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات الحرة الفردية وأهميتها (10 دقائق)\n2. يؤدي تمرينات حرة فردية للذراعين والجذع والرجلين بالعد (25 دقيقة)\n3. يميز بين التمرين الحر الفردي والتمرين بالأدوات (5 دقائق)\n\nالحصة 2:\n1. يتعرف التمرينات الحرة الزوجية وشروط أدائها مع الزميل (10 دقائق)\n2. يؤدي تمرينات حرة زوجية بالتوافق مع الزميل (20 دقيقة)\n3. يقدر أهمية التمرينات الحرة في المحافظة على اللياقة البدنية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة للتمرينات الزوجية", "المفاهيم": "الحصة 1:\n- التمرين الحر\n- التمرينات الحرة الفردية\n- الجذع\n- الإيقاع\n\nالحصة 2:\n- التمرينات الحرة الزوجية\n- التوافق\n- الزميل\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: هل نحتاج إلى أدوات لنتمرن؟ ويؤدي تمرينًا بلا أدوات، ويوضح أن التمرينات التي تؤدى بالجسم فقط تسمى تمرينات حرة (ص 42-43).\n\nالحصة 2:\nيراجع المعلم تمرينات الحصة السابقة بالنداء، ثم يؤدي مع تلميذ تمرينًا زوجيًا (جلوس طويل مواجه، تبادل شد الذراعين) ويسأل: ما الجديد في هذا التمرين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف ثم تحريك المفاصل، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج التمرينات الحرة الفردية من الدليل ص 43-45: (وقوف) تبادل رفع الذراعين عاليًا، (وقوف فتحًا) لف الجذع، (جلوس طويل) ثني الجذع أمامًا، (رقود) رفع الرجلين، بالعد الرباعي مع التفكير بصوت عالٍ، ويقلد التلميذ التمرينات بالعد ويذكر الجزء العامل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 ص 46: بطاقات تمرينات حرة؛ يؤدي كل تلميذ التمرين ويكتشف العضلة التي تعمل (يشعر بها) ويصنف البطاقات إلى ذراعين وجذع ورجلين، ويجرب التلميذ ويصنف البطاقات حسب الجزء العامل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (العدد والتمرين) ص 50: ينادي المعلم تمرينًا ورقمًا، فيتجمع التلاميذ بعدد الرقم ويؤدون التمرين معًا، ويلعب التلميذ ويؤدي التمرين مع العدد الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة فردية، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم في أزواج: جري جنبًا إلى جنب ومرجحات، ويقلد التلميذ مع زميله (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع تلميذ نماذج التمرينات الزوجية ص 47-48: (وقوف. جنبًا لجنب. الذراع الداخلية على كتف الزميل) مرجحة الرجل الخارجية، (جلوس طويل مواجه. مسك الأيدي) تبادل شد الجذع، (رقود. مواجه. مسك القدمين) الجلوس من الرقود؛ مع شرح التوقيت المشترك، ويؤدي التلميذ التمرينات مع زميله بالعد المشترك (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار (قائد يعد، وزميل ينفذ ثم يتبادلان)، تؤدي كل مجموعة ثلاث بطاقات زوجية ثم تبتكر تمرينًا زوجيًا جديدًا وتعرضه، والتلاميذ يتعاون مع زميله ويبتكر تمرينًا زوجيًا (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المرآة الزوجية): يؤدي أحد الزوجين تمرينًا حرًا ويقلده الآخر كالمرآة، وتفوز الثنائية الأدق، ويلعب التلميذ بدقة وتوافق (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة زوجية بالإطالة مع مساعدة الزميل، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – عدّ بأسماء الولايات: يؤدي الأزواج تمرينًا حرًا للذراعين والجذع والرجلين، ويعدّون بأسماء ثماني ولايات عمانية بدل الأرقام، ويتبادلون اختيار التمرين والولايات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما التمرين الحر؟\nالإجابة: تمرين يؤدى بالجسم دون أدوات.\nس2 (مستوى التطبيق): اذكر تمرينًا حرًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (مستوى الاستدلال): كيف عرفت أن التمرين للرجلين؟\nالإجابة: لأنني شعرت بعمل عضلات الفخذين والساقين.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما التمرين الزوجي؟\nالإجابة: تمرين يؤديه تلميذان معًا بالتوافق.\nس2 (مستوى التطبيق): أدِّ مع زميلك تمرين (جلوس طويل مواجه) تبادل شد الجذع.\nالإجابة: يؤديانه بالتوافق.\nس3 (مستوى الاستدلال): ماذا يحدث لو لم نعد معًا في التمرين الزوجي؟\nالإجابة: يختل التوافق وقد نسقط أو نؤذي الزميل.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرينًا حرًا للذراعين وآخر للجذع (لف الجذع من الوقوف فتحًا) ببطء بالعد، ثم يسأله: هل نحتاج إلى أدوات في التمرين الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين حر زوجي مع زميل للجذع أو الرجلين، وأدائه بالعد بأمان، وتحديد العضلات التي تعمل فيه.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ تمرينًا حرًا للذراعين بالعد.\nالإجابة: يؤدي تبادل رفع الذراعين بالعد الرباعي.\nس2 (مستوى التطبيق): صنّف: (رقود) رفع الرجلين، لأي جزء هذا التمرين؟\nالإجابة: للرجلين (وعضلات البطن).\nس3 (مستوى الاستدلال): ما الفرق بين التمرين الحر والتمرين بالكرة؟\nالإجابة: التمرين الحر بلا أدوات، والتمرين بالكرة يستخدم أداة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر تمرينًا زوجيًا للرجلين.\nالإجابة: مرجحة الرجل الخارجية من الوقوف جنبًا إلى جنب مع مسك كتف الزميل.\nس2 (مستوى التطبيق): ما شروط التمرين الزوجي الآمن؟\nالإجابة: العد معًا، والإمساك الصحيح، وعدم الشد بعنف.\nس3 (مستوى الاستدلال): لماذا تحافظ التمرينات الحرة على لياقتنا؟\nالإجابة: لأنها تقوي العضلات وتزيد المرونة دون الحاجة إلى أدوات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاثة تمرينات حرة (للذراعين والجذع والرجلين) بالعد صباحًا (دليل المعلم ص 43-46).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا (الجلوس من الرقود مع مسك القدمين) 5 مرات (دليل المعلم ص 47-48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=3"}}, {"title": "التمثيل الحركي", "unit": "التمرينات (أتمرن بنظام)", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 51-56", "n": 2, "periods": [{"focus": "التمرينات التمثيلية من أوضاع حركية مختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات التمثيلية من أوضاع مختلفة (الوقوف، الجثو، الجلوس) (15 دقيقة)\n2. يؤدي تمرينات تمثيلية لمواقف من الحياة اليومية والمهن (15 دقيقة)\n3. يبتكر تمرينًا تمثيليًا لمهنة يختارها (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: بطاقات صور مهن ومواقف\n- أخرى: أطواق\n- أخرى: مراتب\n- صورة توضيحية", "المفاهيم": "- التمرين التمثيلي\n- التقليد\n- المهن\n- الأوضاع الحركية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور مهن (الصياد يجدف، الفلاح يحصد، البنّاء يرفع الطوب) ويسأل: كيف نمثل عمل كل منهم بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء تمثيلي بنموذج المعلم: المشي كالجمل، الجري كالغزال، الوثب كالقرد، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ويؤدي النموذج: من الوقوف (الصياد يرمي الشبكة: مرجحة الذراعين)، من الجثو (الفلاح يزرع: ثني الجذع أمامًا)، من الجلوس (التجديف: ثني ومد الذراعين)، ويؤدي التلاميذ مع صوته (ص 52-53)، ويؤدي التلميذ التمرين التمثيلي من الوضع المحدد مع الإيقاع (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (خمّن المهنة): تسحب كل مجموعة بطاقة مهنة وتمثل حركتها بالتمرين، وتخمن المجموعات الأخرى، ويمثل التلميذ مع مجموعته ويخمن (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يبتكر الزوجان تمرينًا تمثيليًا لمهنة عمانية (صيد السمك، جني التمور) ويعرضانه، ويبتكر التلميذ ويعرض (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة تمثيلية: الشمس تغرب ببطء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): من أي وضع مثلنا التجديف؟\nالإجابة: من الجلوس.\nس2 (مستوى التطبيق): ما الحركة التي تمثل رمي الصياد للشبكة؟\nالإجابة: مرجحة الذراعين من الوقوف.\nس3 (مستوى الاستدلال): لماذا نمثل المهن بالتمرينات؟\nالإجابة: لنتعرف المهن ونحرك أجزاء الجسم بطريقة ممتعة.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ حركة التجديف من الجلوس ورمي الصياد للشبكة من الوقوف ببطء، ثم يطلب منه تمثيل رمي الشبكة وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار تمرين تمثيلي لمهنة يختارونها (المزارع أو النجار أو الإطفائي) من وضع مناسب، وتعليمه لزملائهم وذكر الوضع الذي بدؤوا منه.", "التقويم الختامي": "س1 (مستوى المعرفة): مثّل حركة الفلاح وهو يزرع.\nالإجابة: يثني الجذع أمامًا من الجثو ويحرك اليدين.\nس2 (مستوى التطبيق): اذكر مهنة عمانية ابتكرت لها تمرينًا.\nالإجابة: صيد السمك أو جني التمور.\nس3 (مستوى الاستدلال): أي الأوضاع استخدمت في تمثيلك ولماذا؟\nالإجابة: يذكر الوضع ويعلل بأنه يناسب حركة المهنة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اطلب من طفلك تمثيل مهنتك بالحركة، وراجعا صور التمرينات التمثيلية في دليل المعلم ص 52-53.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=4"}}, {"focus": "القصة الحركية (قصة وطنية: رحلة إلى قلعة)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الحركات الأساسية (مشي، جري، وثب، حجل) ضمن قصة حركية وطنية (20 دقيقة)\n2. يستنتج القيم الوطنية والسلوكيات الواردة في القصة (10 دقائق)\n3. يشعر بالسعادة والانتماء أثناء أداء القصة مع زملائه (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: حبال\n- صورة توضيحية", "المفاهيم": "- القصة الحركية\n- الانتماء للوطن\n- التعاون\n- الحركات الأساسية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة قلعة عمانية ويسأل: من زار قلعة؟ ثم يقول: اليوم نذهب في رحلة إلى القلعة بأجسامنا!", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء على شكل بداية القصة: نستعد للرحلة (تمطي)، نحمل الحقائب (ثني ومد)، نمشي إلى الحافلة، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يسرد المعلم القصة ويؤدي النموذج: نصعد الجبل (مشي بطيء ورفع الركبتين)، نعبر الوادي (وثب فوق الحبال)، نمر بالممر الضيق (مشي على الخط)، نصعد درج القلعة (حجل)، نرفع العلم (مد الذراعين عاليًا)، نعود بالجري الخفيف (ص 54-55)، ويؤدي التلميذ الحركات مع السرد (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في مجموعات، تضيف كل مجموعة مشهدًا جديدًا للقصة (مثل مساعدة زائر ضل الطريق) وتعرضه بالحركة، ويبتكر التلميذ المشهد مع مجموعته ويعرضه (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. حوار: ماذا تعلمنا من الرحلة؟ وما شعورنا عند رفع العلم؟ ليستنتج التلاميذ قيم الانتماء والتعاون، ويستنتج التلميذ ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالتنفس كأننا نتأمل المنظر من القلعة، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – مهن من بلادي: تمثل كل مجموعة مهنة عمانية تقليدية كالصياد وصانع الفخار ونجار السفن ومزارع النخيل، ويخمن الآخرون المهنة ويذكرون فائدتها لأهل البلد (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الحركة التي أديناها عند عبور الوادي؟\nالإجابة: الوثب فوق الحبال.\nس2 (مستوى التطبيق): كيف صعدنا درج القلعة؟\nالإجابة: بالحجل.\nس3 (مستوى الاستدلال): ماذا فعلنا عندما ضل الزائر الطريق في مشهد المجموعة؟\nالإجابة: ساعدناه وأرشدناه إلى الطريق.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ حركة التجديف من الجلوس ورمي الصياد للشبكة من الوقوف ببطء، ثم يطلب منه تمثيل رمي الشبكة وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار تمرين تمثيلي لمهنة يختارونها (المزارع أو النجار أو الإطفائي) من وضع مناسب، وتعليمه لزملائهم وذكر الوضع الذي بدؤوا منه.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر أربع حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب، الحجل.\nس2 (مستوى التطبيق): ما القيمة التي شعرت بها عند رفع العلم؟\nالإجابة: الانتماء وحب الوطن.\nس3 (مستوى الاستدلال): ابتكر حركة لمشهد جديد في القصة.\nالإجابة: يذكر مشهدًا وحركته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تحدث مع طفلك عن قلعة أو حصن في محافظتكم، ومثّلا معًا رحلة قصيرة بالحركات (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات التمثيلية من أوضاع مختلفة (الوقوف، الجثو، الجلوس) (15 دقيقة)\n2. يؤدي تمرينات تمثيلية لمواقف من الحياة اليومية والمهن (15 دقيقة)\n3. يبتكر تمرينًا تمثيليًا لمهنة يختارها (10 دقائق)\n\nالحصة 2:\n1. يؤدي الحركات الأساسية (مشي، جري، وثب، حجل) ضمن قصة حركية وطنية (20 دقيقة)\n2. يستنتج القيم الوطنية والسلوكيات الواردة في القصة (10 دقائق)\n3. يشعر بالسعادة والانتماء أثناء أداء القصة مع زملائه (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: بطاقات صور مهن ومواقف\n- أخرى: أطواق\n- أخرى: مراتب\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: حبال\n- صورة توضيحية", "المفاهيم": "الحصة 1:\n- التمرين التمثيلي\n- التقليد\n- المهن\n- الأوضاع الحركية\n\nالحصة 2:\n- القصة الحركية\n- الانتماء للوطن\n- التعاون\n- الحركات الأساسية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور مهن (الصياد يجدف، الفلاح يحصد، البنّاء يرفع الطوب) ويسأل: كيف نمثل عمل كل منهم بأجسامنا؟\n\nالحصة 2:\nيعرض المعلم صورة قلعة عمانية ويسأل: من زار قلعة؟ ثم يقول: اليوم نذهب في رحلة إلى القلعة بأجسامنا!", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء تمثيلي بنموذج المعلم: المشي كالجمل، الجري كالغزال، الوثب كالقرد، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ويؤدي النموذج: من الوقوف (الصياد يرمي الشبكة: مرجحة الذراعين)، من الجثو (الفلاح يزرع: ثني الجذع أمامًا)، من الجلوس (التجديف: ثني ومد الذراعين)، ويؤدي التلاميذ مع صوته (ص 52-53)، ويؤدي التلميذ التمرين التمثيلي من الوضع المحدد مع الإيقاع (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (خمّن المهنة): تسحب كل مجموعة بطاقة مهنة وتمثل حركتها بالتمرين، وتخمن المجموعات الأخرى، ويمثل التلميذ مع مجموعته ويخمن (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يبتكر الزوجان تمرينًا تمثيليًا لمهنة عمانية (صيد السمك، جني التمور) ويعرضانه، ويبتكر التلميذ ويعرض (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة تمثيلية: الشمس تغرب ببطء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء على شكل بداية القصة: نستعد للرحلة (تمطي)، نحمل الحقائب (ثني ومد)، نمشي إلى الحافلة، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يسرد المعلم القصة ويؤدي النموذج: نصعد الجبل (مشي بطيء ورفع الركبتين)، نعبر الوادي (وثب فوق الحبال)، نمر بالممر الضيق (مشي على الخط)، نصعد درج القلعة (حجل)، نرفع العلم (مد الذراعين عاليًا)، نعود بالجري الخفيف (ص 54-55)، ويؤدي التلميذ الحركات مع السرد (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في مجموعات، تضيف كل مجموعة مشهدًا جديدًا للقصة (مثل مساعدة زائر ضل الطريق) وتعرضه بالحركة، ويبتكر التلميذ المشهد مع مجموعته ويعرضه (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. حوار: ماذا تعلمنا من الرحلة؟ وما شعورنا عند رفع العلم؟ ليستنتج التلاميذ قيم الانتماء والتعاون، ويستنتج التلميذ ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالتنفس كأننا نتأمل المنظر من القلعة، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – مهن من بلادي: تمثل كل مجموعة مهنة عمانية تقليدية كالصياد وصانع الفخار ونجار السفن ومزارع النخيل، ويخمن الآخرون المهنة ويذكرون فائدتها لأهل البلد (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): من أي وضع مثلنا التجديف؟\nالإجابة: من الجلوس.\nس2 (مستوى التطبيق): ما الحركة التي تمثل رمي الصياد للشبكة؟\nالإجابة: مرجحة الذراعين من الوقوف.\nس3 (مستوى الاستدلال): لماذا نمثل المهن بالتمرينات؟\nالإجابة: لنتعرف المهن ونحرك أجزاء الجسم بطريقة ممتعة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الحركة التي أديناها عند عبور الوادي؟\nالإجابة: الوثب فوق الحبال.\nس2 (مستوى التطبيق): كيف صعدنا درج القلعة؟\nالإجابة: بالحجل.\nس3 (مستوى الاستدلال): ماذا فعلنا عندما ضل الزائر الطريق في مشهد المجموعة؟\nالإجابة: ساعدناه وأرشدناه إلى الطريق.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ حركة التجديف من الجلوس ورمي الصياد للشبكة من الوقوف ببطء، ثم يطلب منه تمثيل رمي الشبكة وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار تمرين تمثيلي لمهنة يختارونها (المزارع أو النجار أو الإطفائي) من وضع مناسب، وتعليمه لزملائهم وذكر الوضع الذي بدؤوا منه.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): مثّل حركة الفلاح وهو يزرع.\nالإجابة: يثني الجذع أمامًا من الجثو ويحرك اليدين.\nس2 (مستوى التطبيق): اذكر مهنة عمانية ابتكرت لها تمرينًا.\nالإجابة: صيد السمك أو جني التمور.\nس3 (مستوى الاستدلال): أي الأوضاع استخدمت في تمثيلك ولماذا؟\nالإجابة: يذكر الوضع ويعلل بأنه يناسب حركة المهنة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر أربع حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب، الحجل.\nس2 (مستوى التطبيق): ما القيمة التي شعرت بها عند رفع العلم؟\nالإجابة: الانتماء وحب الوطن.\nس3 (مستوى الاستدلال): ابتكر حركة لمشهد جديد في القصة.\nالإجابة: يذكر مشهدًا وحركته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: اطلب من طفلك تمثيل مهنتك بالحركة، وراجعا صور التمرينات التمثيلية في دليل المعلم ص 52-53.\n\nالحصة 2:\nإرشاد لولي الأمر: تحدث مع طفلك عن قلعة أو حصن في محافظتكم، ومثّلا معًا رحلة قصيرة بالحركات (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=4"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 24-28", "n": 2, "periods": [{"focus": "الممارسات الصحية: الإحماء والتهدئة لحماية الجسم", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده (15 دقيقة)\n2. يميز تمرينات الإحماء من تمرينات التهدئة (15 دقيقة)\n3. يطبق إحماءً بسيطًا بنفسه قبل اللعب (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة لتمرينات الإحماء والتهدئة\n- أخرى: أقماع\n- أخرى: مراتب", "المفاهيم": "- الإحماء\n- التهدئة\n- الإصابة\n- العضلات", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يحدث للسيارة في الصباح البارد قبل الانطلاق؟ ويربط ذلك بحاجة العضلات إلى تسخين قبل اللعب.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. يؤدي المعلم نموذج إحماء كامل (مشي، جري خفيف، تحريك المفاصل، إطالة خفيفة) مع التفكير بصوت عالٍ: لماذا نبدأ بالمشي؟ لماذا نحرك المفاصل؟ ويقلد التلميذ ويكرر السبب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يقارن التلاميذ بين مشاعرهم بعد الإحماء وقبله (دفء، سرعة النبض) ويستنتجون فائدة الإحماء في حماية العضلات من الإصابة، ويلاحظ التلميذ ويستنتج (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بثلاث حركات ثم يتبادلون، ويقود التلميذ الإحماء ويؤديه (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تصنف كل مجموعة بطاقات التمرينات إلى (إحماء) و(تهدئة) وتعرض السبب، ويصنف التلميذ ويعلل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نموذج التهدئة: مشي بطيء وتنفس وإطالة، ونصيحة: لا تلعب بلا إحماء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): لماذا نحمي العضلات بالإحماء؟\nالإجابة: لأن العضلة الباردة قد تتمزق أو تصاب عند الحركة القوية.\nس2 (مستوى التطبيق): بأي حركة نبدأ الإحماء؟\nالإجابة: بالمشي ثم الجري الخفيف.\nس3 (مستوى الاستدلال): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء يسخن الجسم في البداية، والتهدئة تريحه في النهاية.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً بسيطًا (مشي ثم جري خفيف ثم دوران الذراعين) ثم تهدئة (مشي بطيء وتنفس عميق)، ثم يسأله: بأي حركة نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إحماء من ثلاث حركات وتهدئة من حركتين، وقيادتهما لمجموعتهم، وشرح الفرق بين الإحماء والتهدئة.", "التقويم الختامي": "س1 (مستوى المعرفة): قُد إحماءً قصيرًا لزملائك بثلاث حركات.\nالإجابة: يؤدي مشيًا وجريًا خفيفًا وتحريك المفاصل.\nس2 (مستوى التطبيق): صنّف: التنفس العميق والإطالة البطيئة، إحماء أم تهدئة؟\nالإجابة: تهدئة.\nس3 (مستوى الاستدلال): زميلك يريد أن يلعب كرة القدم مباشرة دون إحماء، بماذا تنصحه؟\nالإجابة: أنصحه بالإحماء أولًا حتى لا يصاب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب في الحي والتهدئة بعده (برنامج صحتي، دليل المعلم ص 26).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=5"}}, {"focus": "المهرجان الرياضي التعليمي للتمرينات (الأوضاع المشتقة، التمرينات الحرة، التمثيل الحركي)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الأوضاع المشتقة والتمرينات الحرة ضمن أقسام المهرجان (25 دقيقة)\n2. يوظف التمثيل الحركي في عرض جماعي قصير (5 دقائق)\n3. يتعاون مع مجموعته ويلتزم بالنظام في المهرجان (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: بطاقات الأوضاع والتمرينات\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- العرض الرياضي", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أتمرن بنظام) ويقسم التلاميذ أربع مجموعات بأسماء ولايات عمانية مع قائد، ويعرض الأقسام ويذكر قواعد السلامة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء جماعي بنموذج المعلم، ويؤدي التلميذ الإحماء (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25 وص 56: قسم الأوضاع المشتقة (أداء الوضع من البطاقة)، قسم التمرينات الحرة الفردية والزوجية (محطات)، قسم جمباز الموانع (وثب فوق الحبال ومروق أسفل الحاجز)، قسم التمثيل الحركي (عرض قصير لمهنة)، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته بقيادة القائد (23 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ختامية: أسرع مجموعة تؤدي ثلاثة أوضاع مشتقة بالنداء، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم جميع المشاركين، ويؤدي التلميذ التهدئة ويهنئ (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – رحلة قارب الصيد: تمثل المجموعات رحلة صيد: تجهيز القارب بحركات هادئة (إحماء)، ثم التجديف السريع (نشاط)، ثم العودة البطيئة إلى الشاطئ (تهدئة)، وتذكر لماذا لا نبدأ بالجري مباشرة (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الحرة.\nس2 (مستوى التطبيق): ما الوضع المشتق الذي ناداه القائد في المسابقة الختامية؟\nالإجابة: يذكر الوضع (مثل: وقوف فتحًا).\nس3 (مستوى الاستدلال): لماذا نسمي المجموعات بأسماء الولايات؟\nالإجابة: لنتعرف ولايات وطننا ونعتز بها.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً بسيطًا (مشي ثم جري خفيف ثم دوران الذراعين) ثم تهدئة (مشي بطيء وتنفس عميق)، ثم يسأله: بأي حركة نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إحماء من ثلاث حركات وتهدئة من حركتين، وقيادتهما لمجموعتهم، وشرح الفرق بين الإحماء والتهدئة.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر أقسام مهرجان اليوم الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الحرة، جمباز الموانع، التمثيل الحركي.\nس2 (مستوى التطبيق): ما المهنة التي مثلتها مجموعتك؟\nالإجابة: يذكر المهنة.\nس3 (مستوى الاستدلال): كيف أسهمت في فوز مجموعتك أو تحسين أدائها؟\nالإجابة: التزمت بالنظام وأديت التمرينات بدقة وساعدت زملائي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين حرين يوميًا (دليل المعلم ص 42-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده (15 دقيقة)\n2. يميز تمرينات الإحماء من تمرينات التهدئة (15 دقيقة)\n3. يطبق إحماءً بسيطًا بنفسه قبل اللعب (10 دقائق)\n\nالحصة 2:\n1. يؤدي الأوضاع المشتقة والتمرينات الحرة ضمن أقسام المهرجان (25 دقيقة)\n2. يوظف التمثيل الحركي في عرض جماعي قصير (5 دقائق)\n3. يتعاون مع مجموعته ويلتزم بالنظام في المهرجان (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة لتمرينات الإحماء والتهدئة\n- أخرى: أقماع\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: بطاقات الأوضاع والتمرينات\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الإحماء\n- التهدئة\n- الإصابة\n- العضلات\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- العرض الرياضي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا يحدث للسيارة في الصباح البارد قبل الانطلاق؟ ويربط ذلك بحاجة العضلات إلى تسخين قبل اللعب.\n\nالحصة 2:\nيعلن المعلم مهرجان (أتمرن بنظام) ويقسم التلاميذ أربع مجموعات بأسماء ولايات عمانية مع قائد، ويعرض الأقسام ويذكر قواعد السلامة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. يؤدي المعلم نموذج إحماء كامل (مشي، جري خفيف، تحريك المفاصل، إطالة خفيفة) مع التفكير بصوت عالٍ: لماذا نبدأ بالمشي؟ لماذا نحرك المفاصل؟ ويقلد التلميذ ويكرر السبب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يقارن التلاميذ بين مشاعرهم بعد الإحماء وقبله (دفء، سرعة النبض) ويستنتجون فائدة الإحماء في حماية العضلات من الإصابة، ويلاحظ التلميذ ويستنتج (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بثلاث حركات ثم يتبادلون، ويقود التلميذ الإحماء ويؤديه (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تصنف كل مجموعة بطاقات التمرينات إلى (إحماء) و(تهدئة) وتعرض السبب، ويصنف التلميذ ويعلل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نموذج التهدئة: مشي بطيء وتنفس وإطالة، ونصيحة: لا تلعب بلا إحماء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء جماعي بنموذج المعلم، ويؤدي التلميذ الإحماء (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25 وص 56: قسم الأوضاع المشتقة (أداء الوضع من البطاقة)، قسم التمرينات الحرة الفردية والزوجية (محطات)، قسم جمباز الموانع (وثب فوق الحبال ومروق أسفل الحاجز)، قسم التمثيل الحركي (عرض قصير لمهنة)، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته بقيادة القائد (23 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ختامية: أسرع مجموعة تؤدي ثلاثة أوضاع مشتقة بالنداء، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم جميع المشاركين، ويؤدي التلميذ التهدئة ويهنئ (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – رحلة قارب الصيد: تمثل المجموعات رحلة صيد: تجهيز القارب بحركات هادئة (إحماء)، ثم التجديف السريع (نشاط)، ثم العودة البطيئة إلى الشاطئ (تهدئة)، وتذكر لماذا لا نبدأ بالجري مباشرة (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): لماذا نحمي العضلات بالإحماء؟\nالإجابة: لأن العضلة الباردة قد تتمزق أو تصاب عند الحركة القوية.\nس2 (مستوى التطبيق): بأي حركة نبدأ الإحماء؟\nالإجابة: بالمشي ثم الجري الخفيف.\nس3 (مستوى الاستدلال): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء يسخن الجسم في البداية، والتهدئة تريحه في النهاية.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الحرة.\nس2 (مستوى التطبيق): ما الوضع المشتق الذي ناداه القائد في المسابقة الختامية؟\nالإجابة: يذكر الوضع (مثل: وقوف فتحًا).\nس3 (مستوى الاستدلال): لماذا نسمي المجموعات بأسماء الولايات؟\nالإجابة: لنتعرف ولايات وطننا ونعتز بها.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً بسيطًا (مشي ثم جري خفيف ثم دوران الذراعين) ثم تهدئة (مشي بطيء وتنفس عميق)، ثم يسأله: بأي حركة نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إحماء من ثلاث حركات وتهدئة من حركتين، وقيادتهما لمجموعتهم، وشرح الفرق بين الإحماء والتهدئة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): قُد إحماءً قصيرًا لزملائك بثلاث حركات.\nالإجابة: يؤدي مشيًا وجريًا خفيفًا وتحريك المفاصل.\nس2 (مستوى التطبيق): صنّف: التنفس العميق والإطالة البطيئة، إحماء أم تهدئة؟\nالإجابة: تهدئة.\nس3 (مستوى الاستدلال): زميلك يريد أن يلعب كرة القدم مباشرة دون إحماء، بماذا تنصحه؟\nالإجابة: أنصحه بالإحماء أولًا حتى لا يصاب.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر أقسام مهرجان اليوم الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الحرة، جمباز الموانع، التمثيل الحركي.\nس2 (مستوى التطبيق): ما المهنة التي مثلتها مجموعتك؟\nالإجابة: يذكر المهنة.\nس3 (مستوى الاستدلال): كيف أسهمت في فوز مجموعتك أو تحسين أدائها؟\nالإجابة: التزمت بالنظام وأديت التمرينات بدقة وساعدت زملائي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب في الحي والتهدئة بعده (برنامج صحتي، دليل المعلم ص 26).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين حرين يوميًا (دليل المعلم ص 42-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=5"}}, {"title": "الخطو الجانبي وركضة الحصان", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "السادس – السابع", "date": "11-15/10/2026 إلى 18-22/10/2026", "pages": "دليل المعلم ص 60-67", "n": 4, "periods": [{"focus": "الخطو الجانبي", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الخطو الجانبي ونقاطها الفنية (10 دقائق)\n2. يؤدي الخطو الجانبي لليمين واليسار بإيقاع منتظم (20 دقيقة)\n3. يميز بين الخطو الجانبي والمشي الأمامي (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- الخطو الجانبي\n- الاتجاه\n- الإيقاع\n- الجانب الأيمن والأيسر", "التهيئة / التمهيد / التعلم القبلي": "يتحرك المعلم جانبًا كلاعب كرة سلة يدافع ويسأل: كيف تحركت؟ هل مشيت للأمام؟ ويعرض صورة حارس المرمى يتحرك جانبًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم تحريك الرجلين جانبًا من الوقوف، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الخطو الجانبي: وقوف، الركبتان منثنيتان قليلًا، نقل القدم اليمنى جانبًا ثم ضم اليسرى إليها دون تقاطع، والذراعان للاتزان (ص 61-62)، بالعد ثم بالإيقاع المتصل، ثم للجهة الأخرى، ويؤدي التلميذ الخطو الجانبي بالعد ثم بالإيقاع لليمين واليسار (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 63: خطو جانبي على خط مستقيم ثم بين الأقماع؛ يجرب التلميذ ضم القدمين بشكل ملاصق ثم بمسافة ويكتشف أي الطريقتين أسرع وأثبت، ويستنتج أهمية عدم تقاطع القدمين، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (المرآة الجانبية): في أزواج متقابلين، يتحرك أحدهما جانبًا ويتبعه الآخر كالمرآة بسرعات مختلفة، ويلعب التلميذ ويتابع زميله (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الفخذين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): في الخطو الجانبي، هل تتقاطع القدمان؟\nالإجابة: لا، تنتقل قدم جانبًا وتضم إليها الأخرى.\nس2 (مستوى التطبيق): أين تكون الركبتان أثناء الخطو الجانبي؟\nالإجابة: منثنيتين قليلًا.\nس3 (مستوى الاستدلال): اذكر لعبة يستخدم فيها اللاعب الخطو الجانبي.\nالإجابة: كرة السلة (الدفاع) أو حارس المرمى.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ خطوًا جانبيًا لليمين 5 خطوات ثم لليسار.\nالإجابة: يؤديه دون تقاطع القدمين.\nس2 (مستوى التطبيق): ما الفرق بين الخطو الجانبي والمشي الأمامي؟\nالإجابة: الخطو الجانبي يتحرك فيه الجسم جانبًا والقدمان متوازيتان، والمشي يتحرك للأمام بتبادل القدمين.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين في الخطو الجانبي؟\nالإجابة: للاتزان وسرعة تغيير الاتجاه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الخطو الجانبي في الممر 5 خطوات لكل جهة (دليل المعلم ص 61-63).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}, {"focus": "ركضة الحصان (عدو الفرس)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ركضة الحصان وتسلسلها (خطوة، وثبة، خطوة) (10 دقائق)\n2. يؤدي ركضة الحصان بإيقاع صحيح مع الهبوط على قدم الارتقاء (20 دقيقة)\n3. يحافظ على الإيقاع والاتزان أثناء الأداء (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- ركضة الحصان\n- قدم الارتقاء\n- الإيقاع\n- الخطوة والوثبة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة حصان يعدو ويسأل: كيف يتحرك الحصان؟ ثم يؤدي ركضة الحصان ويطلب ملاحظة قدمي الهبوط.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، حجل، خطو جانبي للمراجعة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج بالعد: (1) وقوف وانثناء الركبتين وميل الجذع، (2) خطوة للأمام مع بقاء قدم أمام الأخرى، (3) ارتقاء عاليًا بالقدم الأمامية والهبوط عليها، ثم تتابع الحركة (ص 62)، فتطبيق موجه ثم مستقل في مسار الأقماع، ويؤدي التلميذ بالعد ثم بالإيقاع المتصل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار: يراقب أحدهما قدم الهبوط لزميله ويقول (صح/أعد)، ثم يتبادلان، ثم يؤديان ركضة الحصان جنبًا إلى جنب بإيقاع واحد، ويراقب التلميذ ويصحح ويؤدي بالتوافق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (سباق الخيول): قطارات، يؤدي كل تلميذ ركضة الحصان حتى القمع والعودة بالجري، وتفوز المجموعة الأدق إيقاعًا، ويتسابق التلميذ بالإيقاع الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة ثم وثبة ثم خطوة.\nس2 (مستوى التطبيق): على أي قدم نهبط بعد الوثبة؟\nالإجابة: على قدم الارتقاء نفسها.\nس3 (مستوى الاستدلال): لماذا نميل الجذع قليلًا للأمام؟\nالإجابة: للاندفاع والاتزان أثناء الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ ركضة الحصان حتى القمع.\nالإجابة: يؤديها بالتسلسل الصحيح.\nس2 (مستوى التطبيق): ما الفرق بين ركضة الحصان والجري العادي؟\nالإجابة: ركضة الحصان تمزج الجري بالوثب والهبوط على القدم نفسها، والجري تبادل القدمين.\nس3 (مستوى الاستدلال): زميلك يهبط على القدم الأخرى بعد الوثبة، ماذا تقول له؟\nالإجابة: اهبط على قدم الارتقاء نفسها ثم خذ الخطوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على أداء ركضة الحصان في ساحة آمنة مع العد (خطوة، وثبة، خطوة) (دليل المعلم ص 62-64).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}, {"focus": "محطات الخطو الجانبي وركضة الحصان", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي الخطو الجانبي وركضة الحصان في مسارات ومحطات مختلفة (20 دقيقة)\n2. يميز متى يستخدم كل حركة حسب المحطة (15 دقيقة)\n3. يتعاون مع مجموعته في تنفيذ المحطات (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: شريط لاصق", "المفاهيم": "- الخطو الجانبي\n- ركضة الحصان\n- المحطات\n- المسار", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركتين بنموذج تلميذين، ثم يعرض المحطات ويسأل: أي حركة تناسب كل محطة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم يشمل الحركتين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: خطو جانبي بين الأقماع ذهابًا وإيابًا، ركضة الحصان فوق الحبال المنخفضة، خطو جانبي بجانب المقعد، ركضة الحصان في المسار المنحني، ويشاهد التلميذ ويحدد الحركة المناسبة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 65-66: أربع مجموعات بقائد تؤدي المحطات بالتبادل، ويسجل القائد الأداء الصحيح، ويؤدي التلميذ الحركة الصحيحة في كل محطة ويبدل بنظام (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تتابع: مسار يجمع الحركتين (خطو جانبي للقمع، ركضة حصان للعودة)، ويتسابق التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة ونقاش: أي محطة احتاجت إلى الخطو الجانبي ولماذا؟ ويؤدي التلميذ التهدئة ويجيب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الحركة المناسبة لمحطة المقعد السويدي؟\nالإجابة: الخطو الجانبي بجانب المقعد.\nس2 (مستوى التطبيق): ما الحركة التي أديناها فوق الحبال؟\nالإجابة: ركضة الحصان.\nس3 (مستوى الاستدلال): لماذا لا نؤدي الخطو الجانبي فوق الحبال؟\nالإجابة: لأن الحبال تحتاج إلى وثبة، والخطو الجانبي لا وثب فيه.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين وحركة كل منهما.\nالإجابة: الأقماع: خطو جانبي، الحبال: ركضة الحصان.\nس2 (مستوى التطبيق): أدِّ مسار التتابع كاملًا.\nالإجابة: يؤدي الخطو الجانبي ثم ركضة الحصان.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك اليوم؟\nالإجابة: سجل الأداء وشجعنا ونظم الدور.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك محطتين في المنزل (ممر للخطو الجانبي، وسادة منخفضة لركضة الحصان) (دليل المعلم ص 65-66).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}, {"focus": "ألعاب الخطو الجانبي وركضة الحصان", "num": 4, "fields": {"المخرجات التعليمية": "1. يوظف الخطو الجانبي وركضة الحصان في الألعاب الرياضية (15 دقيقة)\n2. يطبق قواعد اللعبة وإشارات المعلم أثناء اللعب (15 دقيقة)\n3. يستمتع بمشاركة زملائه ألعاب الخطو الجانبي وركضة الحصان (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أعلام (أحمر وأخضر)\n- أخرى: كرات متوسطة\n- أخرى: شريط لاصق", "المفاهيم": "- الخطو الجانبي\n- ركضة الحصان\n- الإشارة\n- اللعبة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركتين بسرعة ثم يرفع علمين ويسأل: ماذا لو كان الأحمر خطوًا جانبيًا والأخضر ركضة حصان؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 5 (ألعاب الخطو الجانبي وركضة الحصان) ص 67: ساحة مقسمة نصفين ومجموعتان بلونين، يرفع المعلم العلم الأحمر فتهرب مجموعة الأحمر بالخطو الجانبي وتطاردها الأخرى بركضة الحصان حتى الخط، وتحسب نقاط اللمس، ثم التبادل، ويلعب التلميذ مستجيبًا للعلم بالحركة الصحيحة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. في مجموعات، تبتكر كل مجموعة لعبة قصيرة تستخدم الحركتين بالكرة وتعرضها على الصف، ويبتكر التلميذ مع مجموعته ويعرض (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: لماذا كانت ركضة الحصان أسرع في المطاردة والخطو الجانبي أفضل في المراوغة؟ ليستنتج التلاميذ استخدام كل حركة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – ميدان الخيل العربية: يؤدي الأزواج ركضة الحصان كأنهم خيول عربية أصيلة في ميدان سباق، والخطو الجانبي كأنهم فرسان يستعدون، ويتعرفون حب العمانيين للخيل واهتمامهم بها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ماذا تفعل مجموعة الأحمر عند رفع العلم الأحمر؟\nالإجابة: تهرب بالخطو الجانبي.\nس2 (مستوى التطبيق): بأي حركة طاردت المجموعة الأخرى؟\nالإجابة: بركضة الحصان.\nس3 (مستوى الاستدلال): أي الحركتين أسرع في المطاردة؟\nالإجابة: ركضة الحصان.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر لعبة ابتكرتها مجموعتك اليوم.\nالإجابة: يذكر اللعبة وحركاتها.\nس2 (مستوى التطبيق): متى نستخدم الخطو الجانبي في الألعاب؟\nالإجابة: للمراوغة والدفاع وتغيير الاتجاه جانبًا.\nس3 (مستوى الاستدلال): كيف شعرت في لعبة الأعلام ولماذا؟\nالإجابة: يعبر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك لعبة الأعلام (الأحمر خطو جانبي، الأخضر ركضة حصان) في مكان آمن (دليل المعلم ص 67).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة الخطو الجانبي ونقاطها الفنية (10 دقائق)\n2. يؤدي الخطو الجانبي لليمين واليسار بإيقاع منتظم (20 دقيقة)\n3. يميز بين الخطو الجانبي والمشي الأمامي (10 دقائق)\n\nالحصة 2:\n1. يتعرف حركة ركضة الحصان وتسلسلها (خطوة، وثبة، خطوة) (10 دقائق)\n2. يؤدي ركضة الحصان بإيقاع صحيح مع الهبوط على قدم الارتقاء (20 دقيقة)\n3. يحافظ على الإيقاع والاتزان أثناء الأداء (10 دقائق)\n\nالحصة 3:\n1. يؤدي الخطو الجانبي وركضة الحصان في مسارات ومحطات مختلفة (20 دقيقة)\n2. يميز متى يستخدم كل حركة حسب المحطة (15 دقيقة)\n3. يتعاون مع مجموعته في تنفيذ المحطات (5 دقائق)\n\nالحصة 4:\n1. يوظف الخطو الجانبي وركضة الحصان في الألعاب الرياضية (15 دقيقة)\n2. يطبق قواعد اللعبة وإشارات المعلم أثناء اللعب (15 دقيقة)\n3. يستمتع بمشاركة زملائه ألعاب الخطو الجانبي وركضة الحصان (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: شريط لاصق\n\nالحصة 4:\n- أخرى: أقماع\n- أخرى: أعلام (أحمر وأخضر)\n- أخرى: كرات متوسطة\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الخطو الجانبي\n- الاتجاه\n- الإيقاع\n- الجانب الأيمن والأيسر\n\nالحصة 2:\n- ركضة الحصان\n- قدم الارتقاء\n- الإيقاع\n- الخطوة والوثبة\n\nالحصة 3:\n- الخطو الجانبي\n- ركضة الحصان\n- المحطات\n- المسار\n\nالحصة 4:\n- الخطو الجانبي\n- ركضة الحصان\n- الإشارة\n- اللعبة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيتحرك المعلم جانبًا كلاعب كرة سلة يدافع ويسأل: كيف تحركت؟ هل مشيت للأمام؟ ويعرض صورة حارس المرمى يتحرك جانبًا.\n\nالحصة 2:\nيعرض المعلم صورة حصان يعدو ويسأل: كيف يتحرك الحصان؟ ثم يؤدي ركضة الحصان ويطلب ملاحظة قدمي الهبوط.\n\nالحصة 3:\nيراجع المعلم الحركتين بنموذج تلميذين، ثم يعرض المحطات ويسأل: أي حركة تناسب كل محطة؟\n\nالحصة 4:\nيراجع المعلم الحركتين بسرعة ثم يرفع علمين ويسأل: ماذا لو كان الأحمر خطوًا جانبيًا والأخضر ركضة حصان؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف ثم تحريك الرجلين جانبًا من الوقوف، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الخطو الجانبي: وقوف، الركبتان منثنيتان قليلًا، نقل القدم اليمنى جانبًا ثم ضم اليسرى إليها دون تقاطع، والذراعان للاتزان (ص 61-62)، بالعد ثم بالإيقاع المتصل، ثم للجهة الأخرى، ويؤدي التلميذ الخطو الجانبي بالعد ثم بالإيقاع لليمين واليسار (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 63: خطو جانبي على خط مستقيم ثم بين الأقماع؛ يجرب التلميذ ضم القدمين بشكل ملاصق ثم بمسافة ويكتشف أي الطريقتين أسرع وأثبت، ويستنتج أهمية عدم تقاطع القدمين، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (المرآة الجانبية): في أزواج متقابلين، يتحرك أحدهما جانبًا ويتبعه الآخر كالمرآة بسرعات مختلفة، ويلعب التلميذ ويتابع زميله (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الفخذين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، حجل، خطو جانبي للمراجعة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج بالعد: (1) وقوف وانثناء الركبتين وميل الجذع، (2) خطوة للأمام مع بقاء قدم أمام الأخرى، (3) ارتقاء عاليًا بالقدم الأمامية والهبوط عليها، ثم تتابع الحركة (ص 62)، فتطبيق موجه ثم مستقل في مسار الأقماع، ويؤدي التلميذ بالعد ثم بالإيقاع المتصل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. في أزواج بأدوار: يراقب أحدهما قدم الهبوط لزميله ويقول (صح/أعد)، ثم يتبادلان، ثم يؤديان ركضة الحصان جنبًا إلى جنب بإيقاع واحد، ويراقب التلميذ ويصحح ويؤدي بالتوافق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (سباق الخيول): قطارات، يؤدي كل تلميذ ركضة الحصان حتى القمع والعودة بالجري، وتفوز المجموعة الأدق إيقاعًا، ويتسابق التلميذ بالإيقاع الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم يشمل الحركتين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: خطو جانبي بين الأقماع ذهابًا وإيابًا، ركضة الحصان فوق الحبال المنخفضة، خطو جانبي بجانب المقعد، ركضة الحصان في المسار المنحني، ويشاهد التلميذ ويحدد الحركة المناسبة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 65-66: أربع مجموعات بقائد تؤدي المحطات بالتبادل، ويسجل القائد الأداء الصحيح، ويؤدي التلميذ الحركة الصحيحة في كل محطة ويبدل بنظام (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تتابع: مسار يجمع الحركتين (خطو جانبي للقمع، ركضة حصان للعودة)، ويتسابق التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة ونقاش: أي محطة احتاجت إلى الخطو الجانبي ولماذا؟ ويؤدي التلميذ التهدئة ويجيب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 5 (ألعاب الخطو الجانبي وركضة الحصان) ص 67: ساحة مقسمة نصفين ومجموعتان بلونين، يرفع المعلم العلم الأحمر فتهرب مجموعة الأحمر بالخطو الجانبي وتطاردها الأخرى بركضة الحصان حتى الخط، وتحسب نقاط اللمس، ثم التبادل، ويلعب التلميذ مستجيبًا للعلم بالحركة الصحيحة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. في مجموعات، تبتكر كل مجموعة لعبة قصيرة تستخدم الحركتين بالكرة وتعرضها على الصف، ويبتكر التلميذ مع مجموعته ويعرض (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: لماذا كانت ركضة الحصان أسرع في المطاردة والخطو الجانبي أفضل في المراوغة؟ ليستنتج التلاميذ استخدام كل حركة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – ميدان الخيل العربية: يؤدي الأزواج ركضة الحصان كأنهم خيول عربية أصيلة في ميدان سباق، والخطو الجانبي كأنهم فرسان يستعدون، ويتعرفون حب العمانيين للخيل واهتمامهم بها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): في الخطو الجانبي، هل تتقاطع القدمان؟\nالإجابة: لا، تنتقل قدم جانبًا وتضم إليها الأخرى.\nس2 (مستوى التطبيق): أين تكون الركبتان أثناء الخطو الجانبي؟\nالإجابة: منثنيتين قليلًا.\nس3 (مستوى الاستدلال): اذكر لعبة يستخدم فيها اللاعب الخطو الجانبي.\nالإجابة: كرة السلة (الدفاع) أو حارس المرمى.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة ثم وثبة ثم خطوة.\nس2 (مستوى التطبيق): على أي قدم نهبط بعد الوثبة؟\nالإجابة: على قدم الارتقاء نفسها.\nس3 (مستوى الاستدلال): لماذا نميل الجذع قليلًا للأمام؟\nالإجابة: للاندفاع والاتزان أثناء الحركة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما الحركة المناسبة لمحطة المقعد السويدي؟\nالإجابة: الخطو الجانبي بجانب المقعد.\nس2 (مستوى التطبيق): ما الحركة التي أديناها فوق الحبال؟\nالإجابة: ركضة الحصان.\nس3 (مستوى الاستدلال): لماذا لا نؤدي الخطو الجانبي فوق الحبال؟\nالإجابة: لأن الحبال تحتاج إلى وثبة، والخطو الجانبي لا وثب فيه.\n\nالحصة 4:\nس1 (مستوى المعرفة): ماذا تفعل مجموعة الأحمر عند رفع العلم الأحمر؟\nالإجابة: تهرب بالخطو الجانبي.\nس2 (مستوى التطبيق): بأي حركة طاردت المجموعة الأخرى؟\nالإجابة: بركضة الحصان.\nس3 (مستوى الاستدلال): أي الحركتين أسرع في المطاردة؟\nالإجابة: ركضة الحصان.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ خطوًا جانبيًا لليمين 5 خطوات ثم لليسار.\nالإجابة: يؤديه دون تقاطع القدمين.\nس2 (مستوى التطبيق): ما الفرق بين الخطو الجانبي والمشي الأمامي؟\nالإجابة: الخطو الجانبي يتحرك فيه الجسم جانبًا والقدمان متوازيتان، والمشي يتحرك للأمام بتبادل القدمين.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين في الخطو الجانبي؟\nالإجابة: للاتزان وسرعة تغيير الاتجاه.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ ركضة الحصان حتى القمع.\nالإجابة: يؤديها بالتسلسل الصحيح.\nس2 (مستوى التطبيق): ما الفرق بين ركضة الحصان والجري العادي؟\nالإجابة: ركضة الحصان تمزج الجري بالوثب والهبوط على القدم نفسها، والجري تبادل القدمين.\nس3 (مستوى الاستدلال): زميلك يهبط على القدم الأخرى بعد الوثبة، ماذا تقول له؟\nالإجابة: اهبط على قدم الارتقاء نفسها ثم خذ الخطوة.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر محطتين وحركة كل منهما.\nالإجابة: الأقماع: خطو جانبي، الحبال: ركضة الحصان.\nس2 (مستوى التطبيق): أدِّ مسار التتابع كاملًا.\nالإجابة: يؤدي الخطو الجانبي ثم ركضة الحصان.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك اليوم؟\nالإجابة: سجل الأداء وشجعنا ونظم الدور.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر لعبة ابتكرتها مجموعتك اليوم.\nالإجابة: يذكر اللعبة وحركاتها.\nس2 (مستوى التطبيق): متى نستخدم الخطو الجانبي في الألعاب؟\nالإجابة: للمراوغة والدفاع وتغيير الاتجاه جانبًا.\nس3 (مستوى الاستدلال): كيف شعرت في لعبة الأعلام ولماذا؟\nالإجابة: يعبر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الخطو الجانبي في الممر 5 خطوات لكل جهة (دليل المعلم ص 61-63).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على أداء ركضة الحصان في ساحة آمنة مع العد (خطوة، وثبة، خطوة) (دليل المعلم ص 62-64).\n\nالحصة 3:\nإرشاد لولي الأمر: ابنِ مع طفلك محطتين في المنزل (ممر للخطو الجانبي، وسادة منخفضة لركضة الحصان) (دليل المعلم ص 65-66).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طفلك لعبة الأعلام (الأحمر خطو جانبي، الأخضر ركضة حصان) في مكان آمن (دليل المعلم ص 67).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}, {"title": "تبادل الخطو والحجل", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 68-74", "n": 2, "periods": [{"focus": "تبادل الخطو والحجل (الخطوة والحجلة)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة تبادل الخطو والحجل ونقاطها الفنية (5 دقائق)\n2. يؤدي خطوة ثم حجلة بالتبادل مع رفع الركبة ومرجحة الذراعين (25 دقيقة)\n3. يحافظ على الإيقاع (خطوة، حجلة) في مسار مستقيم (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- تبادل الخطو والحجل\n- قدم الارتقاء\n- الإيقاع\n- مرجحة الذراعين", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يتذكر الحجل؟ ثم يؤدي خطوة ثم حجلة ويسأل: ماذا أضفت إلى الحجل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، حجل بالقدمين بالتبادل، مرجحة الذراعين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج بالعد: (1) وقوف والنظر للأمام، (2) خطوة للأمام، (3) حجلة بالقدم التي انتهت بها الخطوة مع رفع الركبة الأخرى، (4) الهبوط على قدم الارتقاء ثم خطوة بالأخرى وتكرار، مع مرجحة الذراعين عكس الرجلين (ص 69)، ثم تطبيق موجه فمستقل، ويؤدي التلميذ بالعد ثم بالإيقاع في المسار (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\
