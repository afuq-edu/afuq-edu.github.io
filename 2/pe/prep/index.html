n3. نشاط 1 ص 70: أطواق متباعدة في مسار؛ يجرب التلميذ الحركة بمسافات مختلفة بين الأطواق ويكتشف أن رفع الركبة ومرجحة الذراعين يزيدان طول الحجلة، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في أزواج متجاورين، يؤديان الحركة بإيقاع واحد مع العد الجماعي (خطوة، حجلة)، ويتبادل الزميلان ملاحظة رفع الركبة، ويؤدي التلميذ بالتوافق ويلاحظ (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): بأي قدم نحجل بعد الخطوة؟\nالإجابة: بالقدم التي انتهت بها الخطوة.\nس2 (مستوى التطبيق): ماذا نفعل بالركبة الأخرى أثناء الحجلة؟\nالإجابة: نرفعها لأعلى.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الحركة؟\nالإجابة: بالتبادل عكس حركة الرجلين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الحركة ببطء مع النداء «خطوة… حجلة» على خط مستقيم، مع رفع الركبة الأخرى، ثم يسأله: بأي قدم نحجل بعد الخطوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء تبادل الخطو والحجل في مسار متعرج بين أقماع مع مرجحة الذراعين بالتبادل والمحافظة على الإيقاع.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ خطوة وحجلة بالتبادل حتى القمع.\nالإجابة: يؤدي بالإيقاع الصحيح.\nس2 (مستوى التطبيق): ما الذي يجعل الحجلة أطول؟\nالإجابة: رفع الركبة ومرجحة الذراعين بقوة.\nس3 (مستوى الاستدلال): ما الفرق بين تبادل الخطو والحجل وركضة الحصان؟\nالإجابة: في تبادل الخطو والحجل نحجل ونهبط على القدم نفسها ثم نخطو بالأخرى، وفي ركضة الحصان خطوة ثم وثبة ثم خطوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على (خطوة، حجلة) بالعد في الممر مع مرجحة الذراعين (دليل المعلم ص 69-70).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=7"}}, {"focus": "محطات وألعاب تبادل الخطو والحجل", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تبادل الخطو والحجل في مسارات متنوعة (مستقيم، متعرج، فوق حواجز منخفضة) (20 دقيقة)\n2. يوظف الحركة في ألعاب ومسابقات (10 دقائق)\n3. يعبر عن سعادته بمشاركة زملائه الألعاب (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة", "المفاهيم": "- تبادل الخطو والحجل\n- المسار\n- المسابقة\n- الإيقاع", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركة بنموذج تلميذ ويسأل: هل نستطيع أداءها فوق حواجز منخفضة؟ ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (محطات) ص 72: محطة المسار المستقيم، محطة المسار المتعرج بين الأقماع، محطة الحواجز المنخفضة (الحجلة فوق الحاجز)، محطة الأطواق المتباعدة، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ الحركة في كل محطة ويبدل بنظام (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 (ألعاب تبادل الخطو والحجل) ص 74: ساحة بثلاث مناطق وأقماع في الأولى والثالثة، مجموعتان متقابلتان تتسابقان في نقل الأقماع بتبادل الخطو والحجل، وتفوز الأسرع بالأداء الصحيح، ويتسابق التلميذ بالحركة الصحيحة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا استُبعدت بعض الأقماع؟ ليستنتج التلاميذ أن الحركة الصحيحة شرط لاحتساب النقطة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – إيقاع الفنون الشعبية: يقف الطلبة في دائرة ويؤدون خطوة ثم حجلة على تصفيق المجموعة بإيقاع يشبه إيقاع الفنون الشعبية العمانية في الأعياد، ويتناوبون قيادة الإيقاع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): في أي محطة حجلنا فوق الحاجز؟\nالإجابة: محطة الحواجز المنخفضة.\nس2 (مستوى التطبيق): ماذا كان شرط احتساب القمع في المسابقة؟\nالإجابة: أداء الحركة الصحيحة (خطوة، حجلة) أثناء النقل.\nس3 (مستوى الاستدلال): ما المسار الأصعب في المحطات ولماذا؟\nالإجابة: المتعرج لأنه يحتاج إلى تغيير الاتجاه مع الحفاظ على الإيقاع.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الحركة ببطء مع النداء «خطوة… حجلة» على خط مستقيم، مع رفع الركبة الأخرى، ثم يسأله: بأي قدم نحجل بعد الخطوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء تبادل الخطو والحجل في مسار متعرج بين أقماع مع مرجحة الذراعين بالتبادل والمحافظة على الإيقاع.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المسار المستقيم والحواجز المنخفضة (أو المتعرج، الأطواق).\nس2 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجزين منخفضين.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس3 (مستوى الاستدلال): كيف شعرت عندما فازت مجموعتك أو خسرت؟\nالإجابة: يعبر بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على لعبة نقل الأشياء بتبادل الخطو والحجل في البيت (دليل المعلم ص 72-74).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة تبادل الخطو والحجل ونقاطها الفنية (5 دقائق)\n2. يؤدي خطوة ثم حجلة بالتبادل مع رفع الركبة ومرجحة الذراعين (25 دقيقة)\n3. يحافظ على الإيقاع (خطوة، حجلة) في مسار مستقيم (10 دقائق)\n\nالحصة 2:\n1. يؤدي تبادل الخطو والحجل في مسارات متنوعة (مستقيم، متعرج، فوق حواجز منخفضة) (20 دقيقة)\n2. يوظف الحركة في ألعاب ومسابقات (10 دقائق)\n3. يعبر عن سعادته بمشاركة زملائه الألعاب (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة", "المفاهيم": "الحصة 1:\n- تبادل الخطو والحجل\n- قدم الارتقاء\n- الإيقاع\n- مرجحة الذراعين\n\nالحصة 2:\n- تبادل الخطو والحجل\n- المسار\n- المسابقة\n- الإيقاع", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: من يتذكر الحجل؟ ثم يؤدي خطوة ثم حجلة ويسأل: ماذا أضفت إلى الحجل؟\n\nالحصة 2:\nيراجع المعلم الحركة بنموذج تلميذ ويسأل: هل نستطيع أداءها فوق حواجز منخفضة؟ ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، حجل بالقدمين بالتبادل، مرجحة الذراعين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج بالعد: (1) وقوف والنظر للأمام، (2) خطوة للأمام، (3) حجلة بالقدم التي انتهت بها الخطوة مع رفع الركبة الأخرى، (4) الهبوط على قدم الارتقاء ثم خطوة بالأخرى وتكرار، مع مرجحة الذراعين عكس الرجلين (ص 69)، ثم تطبيق موجه فمستقل، ويؤدي التلميذ بالعد ثم بالإيقاع في المسار (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 70: أطواق متباعدة في مسار؛ يجرب التلميذ الحركة بمسافات مختلفة بين الأطواق ويكتشف أن رفع الركبة ومرجحة الذراعين يزيدان طول الحجلة، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في أزواج متجاورين، يؤديان الحركة بإيقاع واحد مع العد الجماعي (خطوة، حجلة)، ويتبادل الزميلان ملاحظة رفع الركبة، ويؤدي التلميذ بالتوافق ويلاحظ (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (محطات) ص 72: محطة المسار المستقيم، محطة المسار المتعرج بين الأقماع، محطة الحواجز المنخفضة (الحجلة فوق الحاجز)، محطة الأطواق المتباعدة، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ الحركة في كل محطة ويبدل بنظام (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 (ألعاب تبادل الخطو والحجل) ص 74: ساحة بثلاث مناطق وأقماع في الأولى والثالثة، مجموعتان متقابلتان تتسابقان في نقل الأقماع بتبادل الخطو والحجل، وتفوز الأسرع بالأداء الصحيح، ويتسابق التلميذ بالحركة الصحيحة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا استُبعدت بعض الأقماع؟ ليستنتج التلاميذ أن الحركة الصحيحة شرط لاحتساب النقطة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – إيقاع الفنون الشعبية: يقف الطلبة في دائرة ويؤدون خطوة ثم حجلة على تصفيق المجموعة بإيقاع يشبه إيقاع الفنون الشعبية العمانية في الأعياد، ويتناوبون قيادة الإيقاع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): بأي قدم نحجل بعد الخطوة؟\nالإجابة: بالقدم التي انتهت بها الخطوة.\nس2 (مستوى التطبيق): ماذا نفعل بالركبة الأخرى أثناء الحجلة؟\nالإجابة: نرفعها لأعلى.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الحركة؟\nالإجابة: بالتبادل عكس حركة الرجلين.\n\nالحصة 2:\nس1 (مستوى المعرفة): في أي محطة حجلنا فوق الحاجز؟\nالإجابة: محطة الحواجز المنخفضة.\nس2 (مستوى التطبيق): ماذا كان شرط احتساب القمع في المسابقة؟\nالإجابة: أداء الحركة الصحيحة (خطوة، حجلة) أثناء النقل.\nس3 (مستوى الاستدلال): ما المسار الأصعب في المحطات ولماذا؟\nالإجابة: المتعرج لأنه يحتاج إلى تغيير الاتجاه مع الحفاظ على الإيقاع.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الحركة ببطء مع النداء «خطوة… حجلة» على خط مستقيم، مع رفع الركبة الأخرى، ثم يسأله: بأي قدم نحجل بعد الخطوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء تبادل الخطو والحجل في مسار متعرج بين أقماع مع مرجحة الذراعين بالتبادل والمحافظة على الإيقاع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ خطوة وحجلة بالتبادل حتى القمع.\nالإجابة: يؤدي بالإيقاع الصحيح.\nس2 (مستوى التطبيق): ما الذي يجعل الحجلة أطول؟\nالإجابة: رفع الركبة ومرجحة الذراعين بقوة.\nس3 (مستوى الاستدلال): ما الفرق بين تبادل الخطو والحجل وركضة الحصان؟\nالإجابة: في تبادل الخطو والحجل نحجل ونهبط على القدم نفسها ثم نخطو بالأخرى، وفي ركضة الحصان خطوة ثم وثبة ثم خطوة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المسار المستقيم والحواجز المنخفضة (أو المتعرج، الأطواق).\nس2 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجزين منخفضين.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس3 (مستوى الاستدلال): كيف شعرت عندما فازت مجموعتك أو خسرت؟\nالإجابة: يعبر بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على (خطوة، حجلة) بالعد في الممر مع مرجحة الذراعين (دليل المعلم ص 69-70).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على لعبة نقل الأشياء بتبادل الخطو والحجل في البيت (دليل المعلم ص 72-74).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=7"}}, {"title": "اللف والدوران", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 75-82", "n": 2, "periods": [{"focus": "اللف والدوران في المكان ومن الحركة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي اللف والدوران والفرق بينهما (5 دقائق)\n2. يؤدي لف الجذع والذراعين والدوران حول المحور الطولي (25 دقيقة)\n3. يحافظ على اتزانه بعد الدوران (10 دقائق)", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: مراتب\n- صورة توضيحية", "المفاهيم": "- اللف\n- الدوران\n- المحور الطولي\n- الاتزان\n- نصف دورة", "التهيئة / التمهيد / التعلم القبلي": "يلف المعلم جذعه يمينًا ويسارًا ثم يدور دورة كاملة ويسأل: ما الفرق بين الحركتين؟ ويعرض صورة لاعب دفع الجلة وهو يدور.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ثم لف الجذع والذراعين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: اللف (حركة جزء من الجسم حول محوره دون انتقال القاعدة: لف الجذع، دوران الذراع)، والدوران (حركة الجسم كله حول المحور الطولي مع تغيير القاعدة: نصف دورة، دورة كاملة من الوقوف ومن الوثب) مع الحفاظ على الاتزان (ص 76-77)، ثم تطبيق موجه، ويؤدي التلميذ اللف ثم الدوران نصف دورة فدورة كاملة ويثبت بعدها (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 78: يجرب التلميذ الدوران بالذراعين مفتوحتين ثم مضمومتين ويكتشف أيهما أسرع، ويجرب الهبوط بثني الركبتين بعد الدوران من الوثب ويستنتج ما يحفظ الاتزان، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (البوصلة): ينادي المعلم (نصف دورة) أو (دورة) أو (لف يمين) ويؤدي التلاميذ الحركة ويثبتون، ويستجيب التلميذ بالحركة الصحيحة ويحافظ على الثبات (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بلف بطيء للجذع والتنفس، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الفرق بين اللف والدوران؟\nالإجابة: اللف حركة جزء من الجسم حول محوره، والدوران حركة الجسم كله حول المحور الطولي.\nس2 (مستوى التطبيق): كيف نحافظ على اتزاننا بعد الدوران من الوثب؟\nالإجابة: بثني الركبتين عند الهبوط والنظر للأمام.\nس3 (مستوى الاستدلال): أيهما أسرع: الدوران والذراعان مضمومتان أم مفتوحتان؟\nالإجابة: مضمومتان.\n\n• نشاط علاجي (لمن لم يتقن): يلف المعلم مع التلميذ الجذع يمينًا ويسارًا ثم يدوران ببطء نصف دورة، والنظر للأمام وثني الركبتين للاتزان، ثم يسأله: ما الفرق بين اللف والدوران؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالدوران مرة والذراعان مضمومتان ومرة وهما مفتوحتان، ومقارنة السرعة، ثم أداء دوران من الوثب مع هبوط متزن.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ نصف دورة من الوقوف ثم اثبت.\nالإجابة: يدور 180 درجة ويثبت.\nس2 (مستوى التطبيق): اذكر مسابقة رياضية يستخدم فيها الدوران.\nالإجابة: دفع الجلة أو قذف القرص أو الجمباز.\nس3 (مستوى الاستدلال): أدِّ لفًا للجذع يمينًا ويسارًا من الوقوف فتحًا.\nالإجابة: يلف الجذع والقدمان ثابتتان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على نصف دورة ودورة كاملة من الوقوف مع الثبات بعدها (دليل المعلم ص 76-78).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=8"}}, {"focus": "محطات وألعاب اللف والدوران", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف اللف والدوران في محطات ومسابقات بالكرة (20 دقيقة)\n2. يميز متى يستخدم اللف ومتى يستخدم الدوران في اللعبة (10 دقائق)\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة اللف والدوران (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب", "المفاهيم": "- اللف\n- الدوران\n- التسليم\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم اللف والدوران بنداءات سريعة، ثم يعرض كرة ويسأل: كيف نسلم الكرة للزميل خلفنا دون أن ندور كاملًا؟ (بلف الجذع).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات اللف والدوران ص 80-81: محطة تسليم الكرة للزميل بلف الجذع في القطار، محطة الدوران حول القمع ومتابعة الجري، محطة الدوران من الوثب على المرتبة، محطة لف الذراعين بالكرة حول الجسم، بأربع مجموعات والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 (ألعاب اللف والدوران) ص 82: قطارات على خط البداية، تمرر الكرة بلف الجذع من الأول حتى الأخير الذي يجري بها إلى المقدمة ويعيد التمرير، وتفوز المجموعة التي تعود إلى ترتيبها الأول أولًا، ويلعب التلميذ ويسلم الكرة بلف الجذع بدقة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا نلف الجذع ولا ندور بالكامل عند التسليم؟ ليستنتج التلاميذ أن اللف أسرع ويحفظ مكان القاعدة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – دوران الرحى: يحكي المعلم أن الرحى حجر يدور لطحن الحبوب في البيوت العمانية القديمة، فتدور المجموعات حول نفسها كالرحى، ثم تقف ثابتة متزنة، والأثبت تفوز (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف سلمت الكرة للزميل خلفك؟\nالإجابة: بلف الجذع للجانب.\nس2 (مستوى التطبيق): في أي محطة دُرنا من الوثب؟\nالإجابة: محطة المرتبة.\nس3 (مستوى الاستدلال): لماذا اللف أسرع من الدوران في تسليم الكرة؟\nالإجابة: لأن القدمين تبقيان ثابتتين ولا نحتاج إلى تغيير مكان الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يلف المعلم مع التلميذ الجذع يمينًا ويسارًا ثم يدوران ببطء نصف دورة، والنظر للأمام وثني الركبتين للاتزان، ثم يسأله: ما الفرق بين اللف والدوران؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالدوران مرة والذراعان مضمومتان ومرة وهما مفتوحتان، ومقارنة السرعة، ثم أداء دوران من الوثب مع هبوط متزن.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: تسليم الكرة بلف الجذع، والدوران حول القمع (أو الوثب بالدوران، لف الذراعين).\nس2 (مستوى التطبيق): أدِّ دورة كاملة حول القمع ثم تابع الجري.\nالإجابة: يدور ويتابع دون سقوط.\nس3 (مستوى الاستدلال): كيف تساعد مجموعتك على الفوز في لعبة تسليم الكرة؟\nالإجابة: ألف جذعي بسرعة وأسلم الكرة بدقة دون إسقاطها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك تمرير الكرة بلف الجذع في قطار من أفراد الأسرة (دليل المعلم ص 80-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي اللف والدوران والفرق بينهما (5 دقائق)\n2. يؤدي لف الجذع والذراعين والدوران حول المحور الطولي (25 دقيقة)\n3. يحافظ على اتزانه بعد الدوران (10 دقائق)\n\nالحصة 2:\n1. يوظف اللف والدوران في محطات ومسابقات بالكرة (20 دقيقة)\n2. يميز متى يستخدم اللف ومتى يستخدم الدوران في اللعبة (10 دقائق)\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة اللف والدوران (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: مراتب\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- اللف\n- الدوران\n- المحور الطولي\n- الاتزان\n- نصف دورة\n\nالحصة 2:\n- اللف\n- الدوران\n- التسليم\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "الحصة ت: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا نلف الجذع ولا ندور بالكامل عند التسليم؟ ليستنتج التلاميذ أن اللف أسرع ويحفظ مكان القاعدة، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – دوران الرحى: يحكي المعلم أن الرحى حجر يدور لطحن الحبوب في البيوت العمانية القديمة، فتدور المجموعات حول نفسها كالرحى، ثم تقف ثابتة متزنة، والأثبت تفوز (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما الفرق بين اللف والدوران؟\nالإجابة: اللف حركة جزء من الجسم حول محوره، والدوران حركة الجسم كله حول المحور الطولي.\nس2 (مستوى التطبيق): كيف نحافظ على اتزاننا بعد الدوران من الوثب؟\nالإجابة: بثني الركبتين عند الهبوط والنظر للأمام.\nس3 (مستوى الاستدلال): أيهما أسرع: الدوران والذراعان مضمومتان أم مفتوحتان؟\nالإجابة: مضمومتان.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف سلمت الكرة للزميل خلفك؟\nالإجابة: بلف الجذع للجانب.\nس2 (مستوى التطبيق): في أي محطة دُرنا من الوثب؟\nالإجابة: محطة المرتبة.\nس3 (مستوى الاستدلال): لماذا اللف أسرع من الدوران في تسليم الكرة؟\nالإجابة: لأن القدمين تبقيان ثابتتين ولا نحتاج إلى تغيير مكان الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يلف المعلم مع التلميذ الجذع يمينًا ويسارًا ثم يدوران ببطء نصف دورة، والنظر للأمام وثني الركبتين للاتزان، ثم يسأله: ما الفرق بين اللف والدوران؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالدوران مرة والذراعان مضمومتان ومرة وهما مفتوحتان، ومقارنة السرعة، ثم أداء دوران من الوثب مع هبوط متزن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ نصف دورة من الوقوف ثم اثبت.\nالإجابة: يدور 180 درجة ويثبت.\nس2 (مستوى التطبيق): اذكر مسابقة رياضية يستخدم فيها الدوران.\nالإجابة: دفع الجلة أو قذف القرص أو الجمباز.\nس3 (مستوى الاستدلال): أدِّ لفًا للجذع يمينًا ويسارًا من الوقوف فتحًا.\nالإجابة: يلف الجذع والقدمان ثابتتان.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: تسليم الكرة بلف الجذع، والدوران حول القمع (أو الوثب بالدوران، لف الذراعين).\nس2 (مستوى التطبيق): أدِّ دورة كاملة حول القمع ثم تابع الجري.\nالإجابة: يدور ويتابع دون سقوط.\nس3 (مستوى الاستدلال): كيف تساعد مجموعتك على الفوز في لعبة تسليم الكرة؟\nالإجابة: ألف جذعي بسرعة وأسلم الكرة بدقة دون إسقاطها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على نصف دورة ودورة كاملة من الوقوف مع الثبات بعدها (دليل المعلم ص 76-78).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك تمرير الكرة بلف الجذع في قطار من أفراد الأسرة (دليل المعلم ص 80-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=8"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "العاشر", "date": "8-12/11/2026", "pages": "دليل المعلم ص 24-28", "n": 2, "periods": [{"focus": "الممارسات الصحية: نظافة الملعب والأدوات والزي والحذاء الرياضي", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية نظافة الملعب والأدوات الرياضية (15 دقيقة)\n2. يختار الحذاء والزي الرياضي المناسب للحصة (10 دقائق)\n3. يطبق سلوكيات المحافظة على نظافة الملعب والأدوات (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: أدوات رياضية\n- أخرى: سلة نفايات\n- أخرى: بطاقات مصورة لأحذية وملابس\n- أخرى: أقماع", "المفاهيم": "- النظافة\n- الأدوات الرياضية\n- الحذاء الرياضي\n- الزي الرياضي\n- العهدة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم كرة متسخة وأخرى نظيفة ويسأل: بأيهما تحب أن تلعب؟ ثم يعرض صور أحذية مختلفة ويسأل: أيها يناسب الجري؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم بالصور أهمية نظافة الملعب (خلوه من الحجارة والزجاج)، ونظافة الأدوات، واختيار الحذاء الرياضي (نعل مرن ورباط محكم) والزي القطني، مع نموذج ربط الحذاء، ويستمع التلميذ ويربط حذاءه بالطريقة الصحيحة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (فريق النظافة): مجموعات تجمع (بطاقات أشياء) من الساحة وتصنفها: ما يبقى (أدوات) وما يُرمى في السلة (نفايات)، وتفوز الأسرع والأدق، ويلعب التلميذ ويصنف (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تضع كل مجموعة ثلاث قواعد للمحافظة على الأدوات (إعادتها لمكانها، عدم الجلوس على الكرات) وتعرضها، والتلاميذ يتعاون ويعرض القواعد (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وتطبيق: إعادة الأدوات نظيفة إلى مكانها، ويؤدي التلميذ التهدئة ويعيد الأدوات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): لماذا نتأكد من نظافة الملعب قبل اللعب؟\nالإجابة: حتى لا نتعثر بالحجارة أو نصاب بالزجاج.\nس2 (مستوى التطبيق): ما مواصفات الحذاء الرياضي المناسب؟\nالإجابة: نعل مرن ورباط محكم ومقاس مناسب.\nس3 (مستوى الاستدلال): ماذا نفعل بالأدوات بعد الحصة؟\nالإجابة: نعيدها نظيفة إلى مكانها.\n\n• نشاط علاجي (لمن لم يتقن): يتفقد المعلم مع التلميذ أرض الملعب ويجمعان ما فيها من حجارة أو أوراق، ويختاران معًا حذاءً رياضيًا مناسبًا من صور، ثم يسأله: لماذا نتأكد من نظافة الملعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مرسومة لمواصفات الحذاء والزي الرياضي المناسب، وتنظيم إعادة الأدوات نظيفة إلى أماكنها بعد الحصة.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة حذاء بكعب عالٍ، أيناسب الحصة؟\nالإجابة: لا، لأنه يسبب السقوط والإصابة.\nس2 (مستوى التطبيق): اذكر قاعدة وضعتها مجموعتك للمحافظة على الأدوات.\nالإجابة: مثل: لا نجلس على الكرات.\nس3 (مستوى الاستدلال): كيف تساعد في نظافة الملعب؟\nالإجابة: أرمي النفايات في السلة وأبلغ المعلم عن أي شيء خطر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تأكد من مناسبة حذاء طفلك الرياضي ونظافة زيه، وذكّره بإعادة أدواته إلى مكانها (برنامج صحتي، دليل المعلم ص 26).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=9"}}, {"focus": "المهرجان الرياضي التعليمي للحركات الأساسية (الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران)", "num": 2, "fields": {"المخرجات التعليمية": " n\n• نشاط علاجي (لمن لم يتقن): يتفقد المعلم مع التلميذ أرض الملعب ويجمعان ما فيها من حجارة أو أوراق، ويختاران معًا حذاءً رياضيًا مناسبًا من صور، ثم يسأله: لماذا نتأكد من نظافة الملعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مرسومة لمواصفات الحذاء والزي الرياضي المناسب، وتنظيم إعادة الأدوات نظيفة إلى أماكنها بعد الحصة.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر القسم الذي أحببته أكثر ولماذا.\nالإجابة: يذكر القسم ويعلل.\nس2 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجز منخفض.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس3 (مستوى الاستدلال): ماذا تقول لزميل لم يلتزم بدوره في القسم؟\nالإجابة: أذكره بلطف أن ننتظر دورنا حتى نلعب بأمان ونظام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا الحركات الأساسية في مكان آمن (دليل المعلم ص 60-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية نظافة الملعب والأدوات الرياضية (15 دقيقة)\n2. يختار الحذاء والزي الرياضي المناسب للحصة (10 دقائق)\n3. يطبق سلوكيات المحافظة على نظافة الملعب والأدوات (15 دقيقة)\n\nالحصة 2:\n1. يوظف الحركات الأساسية التي تعلمها في أقسام المهرجان (20 دقيقة)\n2. يطبق قواعد الأقسام والالتزام بالدور (10 دقائق)\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: أدوات رياضية\n- أخرى: سلة نفايات\n- أخرى: بطاقات مصورة لأحذية وملابس\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- النظافة\n- الأدوات الرياضية\n- الحذاء الرياضي\n- الزي الرياضي\n- العهدة\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- الحركات الأساسية\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم كرة متسخة وأخرى نظيفة ويسأل: بأيهما تحب أن تلعب؟ ثم يعرض صور أحذية مختلفة ويسأل: أيها يناسب الجري؟\n\nالحصة 2:\nيعلن المعلم مهرجان (أتحرك بنشاط) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام بالصور.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم بالصور أهمية نظافة الملعب (خلوه من الحجارة والزجاج)، ونظافة الأدوات، واختيار الحذاء الرياضي (نعل مرن ورباط محكم) والزي القطني، مع نموذج ربط الحذاء، ويستمع التلميذ ويربط حذاءه بالطريقة الصحيحة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (فريق النظافة): مجموعات تجمع (بطاقات أشياء) من الساحة وتصنفها: ما يبقى (أدوات) وما يُرمى في السلة (نفايات)، وتفوز الأسرع والأدق، ويلعب التلميذ ويصنف (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تضع كل مجموعة ثلاث قواعد للمحافظة على الأدوات (إعادتها لمكانها، عدم الجلوس على الكرات) وتعرضها، والتلاميذ يتعاون ويعرض القواعد (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وتطبيق: إعادة الأدوات نظيفة إلى مكانها، ويؤدي التلميذ التهدئة ويعيد الأدوات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء جماعي بنموذج المعلم يشمل الحركات الأربع، ويؤدي التلميذ الإحماء (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم الخطو الجانبي (بين الأقماع ذهابًا وإيابًا)، قسم ركضة الحصان (فوق الحبال)، قسم تبادل الخطو والحجل (فوق الحواجز المنخفضة)، قسم اللف والدوران (تسليم الكرة بلف الجذع والدوران حول القمع)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته بقيادة القائد (23 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ختامية: تتابع يجمع الحركات الأربع، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم المشاركين، ويؤدي التلميذ التهدئة ويهنئ (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – حماة ساحتنا: تتسابق المجموعات في ترتيب الأدوات وجمع المخلفات من الملعب، ويربط المعلم ذلك بحملات تنظيف الشواطئ والأودية التي يشارك فيها العمانيون حبًا لبلدهم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): لماذا نتأكد من نظافة الملعب قبل اللعب؟\nالإجابة: حتى لا نتعثر بالحجارة أو نصاب بالزجاج.\nس2 (مستوى التطبيق): ما مواصفات الحذاء الرياضي المناسب؟\nالإجابة: نعل مرن ورباط محكم ومقاس مناسب.\nس3 (مستوى الاستدلال): ماذا نفعل بالأدوات بعد الحصة؟\nالإجابة: نعيدها نظيفة إلى مكانها.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الحركات الأربع في مهرجان اليوم؟\nالإجابة: الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران.\nس2 (مستوى التطبيق): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم ركضة الحصان.\nس3 (مستوى الاستدلال): ما القاعدة عند الانتقال بين الأقسام؟\nالإجابة: الانتقال بنظام عند الإشارة بقيادة القائد.\n\n• نشاط علاجي (لمن لم يتقن): يتفقد المعلم مع التلميذ أرض الملعب ويجمعان ما فيها من حجارة أو أوراق، ويختاران معًا حذاءً رياضيًا مناسبًا من صور، ثم يسأله: لماذا نتأكد من نظافة الملعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مرسومة لمواصفات الحذاء والزي الرياضي المناسب، وتنظيم إعادة الأدوات نظيفة إلى أماكنها بعد الحصة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة حذاء بكعب عالٍ، أيناسب الحصة؟\nالإجابة: لا، لأنه يسبب السقوط والإصابة.\nس2 (مستوى التطبيق): اذكر قاعدة وضعتها مجموعتك للمحافظة على الأدوات.\nالإجابة: مثل: لا نجلس على الكرات.\nس3 (مستوى الاستدلال): كيف تساعد في نظافة الملعب؟\nالإجابة: أرمي النفايات في السلة وأبلغ المعلم عن أي شيء خطر.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر القسم الذي أحببته أكثر ولماذا.\nالإجابة: يذكر القسم ويعلل.\nس2 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجز منخفض.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس3 (مستوى الاستدلال): ماذا تقول لزميل لم يلتزم بدوره في القسم؟\nالإجابة: أذكره بلطف أن ننتظر دورنا حتى نلعب بأمان ونظام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من مناسبة حذاء طفلك الرياضي ونظافة زيه، وذكّره بإعادة أدواته إلى مكانها (برنامج صحتي، دليل المعلم ص 26).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا الحركات الأساسية في مكان آمن (دليل المعلم ص 60-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=9"}}, {"title": "تنطيط الكرة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الحادي عشر", "date": "15-19/11/2026", "pages": "دليل المعلم ص 86-92", "n": 2, "periods": [{"focus": "تنطيط الكرة في المكان باليد اليمنى واليسرى", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة تنطيط الكرة ونقاطها الفنية (10 دقائق)\n2. يؤدي تنطيط الكرة في المكان باليدين بالتبادل والنظر للأمام (25 دقيقة)\n3. يميز بين دفع الكرة بالأصابع وضربها براحة اليد (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التنطيط\n- التوافق\n- دفع الكرة\n- رسغ اليد\n- ارتداد الكرة", "التهيئة / التمهيد / التعلم القبلي": "ينطط المعلم كرة وهو ينظر للأمام ويسأل: كيف بقيت الكرة بجانبي دون أن تهرب؟ ويعرض صورة لاعب كرة سلة ينطط.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري بالكرة، رمي الكرة لأسفل والتقاطها، تحريك الرسغين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف ورجل متقدمة، انثناء بسيط في الركبتين، ثني المرفق والرسغ ثم مدهما لدفع الكرة بالأصابع في مستوى الحوض أمام الجسم وجانبه، والنظر للأمام (ص 86-87)، مع تطبيق موجه: دفع والتقاط، ثم تنطيط متصل، ويؤدي التلميذ الدفع والالتقاط ثم التنطيط المتصل باليمنى ثم اليسرى (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 88: يجرب التلميذ التنطيط بضرب الكرة براحة اليد ثم بدفعها بالأصابع، وبالنظر إلى الكرة ثم للأمام، ويكتشف أيهما يحفظ الكرة أكثر، فيستنتج النقاط الفنية، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (العدّاد): من ينطط أكبر عدد دون فقد الكرة في 20 ثانية، ثم باليد الأخرى، ويلعب التلميذ ويعد (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بتدحرج الكرة حول الجسم والتنفس، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بأصابع اليد.\nس2 (مستوى التطبيق): في أي مستوى ننطط الكرة؟\nالإجابة: في مستوى الحوص (الحوض).\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء التنطيط؟\nالإجابة: لنرى الزملاء والملعب ولا نصطدم.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ كرة كبيرة في المكان بأصابع اليد في مستوى الحوض ببطء، مع العد حتى 5، ثم يسأله: بأي جزء من اليد ندفع الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنطيط الكرة أثناء المشي ثم الجري في مسار متعرج مع النظر للأمام وتبديل اليدين، وعدّ المرات دون فقد الكرة.", "التقويم الختامي": "س1 (مستوى المعرفة): نطط الكرة 10 مرات باليد اليمنى ثم 10 باليسرى.\nالإجابة: يؤديها دون فقد الكرة.\nس2 (مستوى التطبيق): ما الفرق بين الدفع بالأصابع والضرب بالراحة؟\nالإجابة: الدفع بالأصابع يتحكم في الكرة، والضرب بالراحة يجعلها تهرب.\nس3 (مستوى الاستدلال): سمِّ لعبة رياضية فيها تنطيط.\nالإجابة: كرة السلة أو كرة اليد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على تنطيط كرة باليدين بالتبادل 20 مرة يوميًا مع النظر للأمام (دليل المعلم ص 86-88).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=10"}}, {"focus": "تنطيط الكرة من الحركة وألعاب التنطيط", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تنطيط الكرة أثناء المشي والجري في مسارات (20 دقيقة)\n2. يوظف التنطيط في ألعاب ومسابقات (10 دقائق)\n3. يشعر بالسعادة والرضا عند مشاركة زملائه أنشطة التنطيط (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق", "المفاهيم": "- التنطيط من الحركة\n- المسار\n- الم ين، وعدّ المرات دون فقد الكرة.", "التقويم الختامي": "س1 (مستوى المعرفة): نطط الكرة بين الأقماع ذهابًا وإيابًا.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات التنطيط.\nالإجابة: الخط المستقيم والمتعرج (أو المربع، تبادل اليدين).\nس3 (مستوى الاستدلال): كيف شعرت عندما حافظت على كرتك في اللعبة؟\nالإجابة: يعبر عن الرضا والثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على التنطيط أثناء المشي في الممر وتبديل اليدين (دليل المعلم ص 89-92).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=10"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة تنطيط الكرة ونقاطها الفنية (10 دقائق)\n2. يؤدي تنطيط الكرة في المكان باليدين بالتبادل والنظر للأمام (25 دقيقة)\n3. يميز بين دفع الكرة بالأصابع وضربها براحة اليد (5 دقائق)\n\nالحصة 2:\n1. يؤدي تنطيط الكرة أثناء المشي والجري في مسارات (20 دقيقة)\n2. يوظف التنطيط في ألعاب ومسابقات (10 دقائق)\n3. يشعر بالسعادة والرضا عند مشاركة زملائه أنشطة التنطيط (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- التنطيط\n- التوافق\n- دفع الكرة\n- رسغ اليد\n- ارتداد الكرة\n\nالحصة 2:\n- التنطيط من الحركة\n- المسار\n- المحافظة على الكرة\n- قطع الكرة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nينطط المعلم كرة وهو ينظر للأمام ويسأل: كيف بقيت الكرة بجانبي دون أن تهرب؟ ويعرض صورة لاعب كرة سلة ينطط.\n\nالحصة 2:\nيراجع المعلم التنطيط في المكان بنموذج تلميذ، ثم ينطط وهو يمشي ويسأل: ما الذي تغير عندما تحركت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إ
