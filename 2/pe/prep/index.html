مستوى الاستدلال): ماذا يحدث لو نططنا الكرة عالية أمام المدافع؟\nالإجابة: يسهل عليه قطعها.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المحاورة بين الأقماع والتصويب، ومراوغة المدافع الثابت.\nس5 (مستوى التطبيق): راوغ زميلك المدافع واعبر إلى المربع المقابل.\nالإجابة: يراوغ ويعبر دون فقد الكرة.\nس6 (مستوى الاستدلال): كيف شعرت عندما عبرت من المدافع؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على المحاورة بالكرة حول أشياء في الحديقة مع التنطيط المنخفض (دليل المعلم ص 94-96).\nإرشاد لولي الأمر: العب مع طفلك دور المدافع ودعه يحاول المرور بالمحاورة في مساحة آمنة (دليل المعلم ص 98-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=11"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 24-28", "n": 1, "periods": [{"focus": "الممارسات الصحية: الوجبة المدرسية الصحية وشرب الماء + المهرجان الرياضي التعليمي للمعالجة والتناول (التنطيط والمحاورة) والحركات الأساسية", "num": 1, "fields": {"المخرجات التعليمية": "1. يميز مكونات الوجبة المدرسية الصحية (10 دقائق)\n2. يذكر أهمية شرب الماء قبل النشاط وبعده (5 دقائق)\n3. يقدر أثر الغذاء الصحي والماء في نشاط الجسم (5 دقائق)\n4. يوظف التنطيط والمحاورة والحركات الأساسية في أقسام المهرجان (10 دقائق)\n5. يطبق قواعد الأقسام والالتزام بالدور (5 دقائق)\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية (5 دقائق)", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور أطعمة\n- أخرى: زجاجات ماء\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- الوجبة الصحية\n- الماء\n- الطاقة\n- المقصف\n- المهرجان الرياضي التعليمي\n- التنطيط\n- المحاورة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا أكلتم في الفسحة؟ ويعرض بطاقات (ساندويتش جبن، فاكهة، حلوى، مشروب غازي) ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم ثم شرب الماء برشفات، ويقلد التلميذ ويشرب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يفكر المعلم بصوت عالٍ: الوجبة الصحية فيها خبز وبروتين (جبن أو بيض) وفاكهة أو خضار وماء أو حليب، والحلويات والمشروبات الغازية تضر الأسنان والصحة (برنامج صحتي ص 26)، ويستمع التلميذ ويصنف البطاقات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (أركض إلى الصحة): طوقان (صحي، غير صحي)، يجري التلميذ ويسحب بطاقة ويضعها في الطوق الصحيح، ثم جولة ثانية بالتنطيط بالكرة، ويلعب التلميذ ويصنف (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تكوّن كل مجموعة وجبة مدرسية صحية من البطاقات وتعرضها وتشرح السبب، والتلاميذ يتعاون ويعرض (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم التنطيط في المكان (العدّاد)، قسم التنطيط المتعرج بين الأقماع، قسم المحاورة ومراوغة مدافع ثابت، قسم الحركات الأساسية بالكرة (ركضة الحصان حاملًا الكرة فوق الحبال)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: تتابع تنطيط ومحاورة، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. غلق الدرس (نشاط ممتع مع المواطنة) – لقمة من مزارع عمان: تكوّن كل مجموعة وجبة مدرسية صحية من منتجات عمانية كالتمر والموز والسمك واللبن والليمون العماني، وتعرضها على زملائها مع كوب ماء (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): اذكر مكونين للوجبة المدرسية الصحية.\nالإجابة: خبز وجبن (أو فاكهة وحليب).\nس2 (مستوى التطبيق): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس3 (مستوى الاستدلال): هل الشوكولاتة الكثيرة وجبة صحية؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير وتضر الأسنان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة، ويكوّن مع التلميذ وجبة مدرسية صحية (خبز وجبن وفاكهة وماء)، ثم يسأله: لماذا نشرب الماء بعد اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ثلاث وجبات مدرسية صحية مرسومة لثلاثة أيام، وتفسير لماذا لا تعد الشوكولاتة الكثيرة وجبة صحية.\n\nس4 (مستوى المعرفة): ما القسم الذي كان فيه مدافع ثابت؟\nالإجابة: قسم المحاورة والمراوغة.\nس5 (مستوى التطبيق): كيف نحافظ على الكرة في قسم التنطيط المتعرج؟\nالإجابة: بالتنطيط المنخفض بالأصابع وتبديل اليدين عند الأقماع.\nس6 (مستوى الاستدلال): لماذا نسجل نقاط النظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة، ويكوّن مع التلميذ وجبة مدرسية صحية (خبز وجبن وفاكهة وماء)، ثم يسأله: لماذا نشرب الماء بعد اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ثلاث وجبات مدرسية صحية مرسومة لثلاثة أيام، وتفسير لماذا لا تعد الشوكولاتة الكثيرة وجبة صحية.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة مشروب غازي، في أي طوق نضعه؟\nالإجابة: طوق غير صحي.\nس2 (مستوى التطبيق): كوّن وجبة مدرسية صحية.\nالإجابة: مثل: ساندويتش جبن وتفاحة وماء.\nس3 (مستوى الاستدلال): ماذا تنصح زميلك الذي يشتري الحلوى كل يوم؟\nالإجابة: أنصحه باختيار الفاكهة أو ساندويتش صحي.\n\nس4 (مستوى المعرفة): اذكر أقسام مهرجان اليوم.\nالإجابة: التنطيط في المكان، التنطيط المتعرج، المحاورة والمراوغة، الحركات الأساسية بالكرة.\nس5 (مستوى التطبيق): ما دورك في مجموعتك اليوم؟\nالإجابة: يذكر دوره (قائد، مشارك، مسجل).\nس6 (مستوى الاستدلال): ماذا تقول للمجموعة الفائزة؟\nالإجابة: أهنئها بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: جهّز مع طفلك وجبة مدرسية صحية وزجاجة ماء، وناقشا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 26).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وراجعا التنطيط والمحاورة (دليل المعلم ص 86-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=12"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يميز مكونات الوجبة المدرسية الصحية (10 دقائق)\n2. يذكر أهمية شرب الماء قبل النشاط وبعده (5 دقائق)\n3. يقدر أثر الغذاء الصحي والماء في نشاط الجسم (5 دقائق)\n4. يوظف التنطيط والمحاورة والحركات الأساسية في أقسام المهرجان (10 دقائق)\n5. يطبق قواعد الأقسام والالتزام بالدور (5 دقائق)\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور أطعمة\n- أخرى: زجاجات ماء\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الوجبة الصحية\n- الماء\n- الطاقة\n- المقصف\n- المهرجان الرياضي التعليمي\n- التنطيط\n- المحاورة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا أكلتم في الفسحة؟ ويعرض بطاقات (ساندويتش جبن، فاكهة، حلوى، مشروب غازي) ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم ثم شرب الماء برشفات، ويقلد التلميذ ويشرب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يفكر المعلم بصوت عالٍ: الوجبة الصحية فيها خبز وبروتين (جبن أو بيض) وفاكهة أو خضار وماء أو حليب، والحلويات والمشروبات الغازية تضر الأسنان والصحة (برنامج صحتي ص 26)، ويستمع التلميذ ويصنف البطاقات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (أركض إلى الصحة): طوقان (صحي، غير صحي)، يجري التلميذ ويسحب بطاقة ويضعها في الطوق الصحيح، ثم جولة ثانية بالتنطيط بالكرة، ويلعب التلميذ ويصنف (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تكوّن كل مجموعة وجبة مدرسية صحية من البطاقات وتعرضها وتشرح السبب، والتلاميذ يتعاون ويعرض (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم التنطيط في المكان (العدّاد)، قسم التنطيط المتعرج بين الأقماع، قسم المحاورة ومراوغة مدافع ثابت، قسم الحركات الأساسية بالكرة (ركضة الحصان حاملًا الكرة فوق الحبال)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: تتابع تنطيط ومحاورة، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. غلق الدرس (نشاط ممتع مع المواطنة) – لقمة من مزارع عمان: تكوّن كل مجموعة وجبة مدرسية صحية من منتجات عمانية كالتمر والموز والسمك واللبن والليمون العماني، وتعرضها على زملائها مع كوب ماء (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): اذكر مكونين للوجبة المدرسية الصحية.\nالإجابة: خبز وجبن (أو فاكهة وحليب).\nس2 (مستوى التطبيق): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس3 (مستوى الاستدلال): هل الشوكولاتة الكثيرة وجبة صحية؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير وتضر الأسنان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة، ويكوّن مع التلميذ وجبة مدرسية صحية (خبز وجبن وفاكهة وماء)، ثم يسأله: لماذا نشرب الماء بعد اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ثلاث وجبات مدرسية صحية مرسومة لثلاثة أيام، وتفسير لماذا لا تعد الشوكولاتة الكثيرة وجبة صحية.\n\nس4 (مستوى المعرفة): ما القسم الذي كان فيه مدافع ثابت؟\nالإجابة: قسم المحاورة والمراوغة.\nس5 (مستوى التطبيق): كيف نحافظ على الكرة في قسم التنطيط المتعرج؟\nالإجابة: بالتنطيط المنخفض بالأصابع وتبديل اليدين عند الأقماع.\nس6 (مستوى الاستدلال): لماذا نسجل نقاط النظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة، ويكوّن مع التلميذ وجبة مدرسية صحية (خبز وجبن وفاكهة وماء)، ثم يسأله: لماذا نشرب الماء بعد اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ثلاث وجبات مدرسية صحية مرسومة لثلاثة أيام، وتفسير لماذا لا تعد الشوكولاتة الكثيرة وجبة صحية.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة مشروب غازي، في أي طوق نضعه؟\nالإجابة: طوق غير صحي.\nس2 (مستوى التطبيق): كوّن وجبة مدرسية صحية.\nالإجابة: مثل: ساندويتش جبن وتفاحة وماء.\nس3 (مستوى الاستدلال): ماذا تنصح زميلك الذي يشتري الحلوى كل يوم؟\nالإجابة: أنصحه باختيار الفاكهة أو ساندويتش صحي.\n\nس4 (مستوى المعرفة): اذكر أقسام مهرجان اليوم.\nالإجابة: التنطيط في المكان، التنطيط المتعرج، المحاورة والمراوغة، الحركات الأساسية بالكرة.\nس5 (مستوى التطبيق): ما دورك في مجموعتك اليوم؟\nالإجابة: يذكر دوره (قائد، مشارك، مسجل).\nس6 (مستوى الاستدلال): ماذا تقول للمجموعة الفائزة؟\nالإجابة: أهنئها بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز مع طفلك وجبة مدرسية صحية وزجاجة ماء، وناقشا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 26).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وراجعا التنطيط والمحاورة (دليل المعلم ص 86-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=12"}}, {"title": "ضرب الكرة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الرابع عشر – الخامس عشر", "date": "6-10/12/2026 إلى 13-17/12/2026", "pages": "دليل المعلم ص 101-108", "n": 2, "periods": [{"focus": "ضرب الكرة باليدين من أعلى + ضرب الكرة باليدين من أسفل", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ضرب الكرة باليدين من أعلى ونقاطها الفنية (10 دقائق)\n2. يؤدي ضرب الكرة (البالون) باليدين من أعلى لأعلى (5 دقائق)\n3. يميز بين ضرب الكرة ورميها (5 دقائق)\n4. يتعرف حركة ضرب الكرة باليدين من أسفل ونقاطها الفنية (5 دقائق)\n5. يؤدي ضرب الكرة من أسفل بالساعدين (5 دقائق)\n6. يختار طريقة الضرب (أعلى أو أسفل) حسب ارتفاع الكرة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: أقماع", "المفاهيم": "- ضرب الكرة\n- التوافق\n- الدقة\n- من أعلى\n- أطراف الأصابع\n- ضرب الكرة من أسفل\n- الساعدان\n- مستوى الكرة", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم بالونًا لتلميذ ويسأل: كيف تبقيه في الهواء دون أن تمسكه؟ ويعرض صورة لاعب كرة طائرة يمرر من أعلى.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، رفع الذراعين عاليًا، تحريك الأصابع، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، اليدان فوق الجبهة والأصابع منتشرة، مد الذراعين والركبتين لضرب الكرة بأطراف الأصابع لأعلى (ص 102-103)، ثم تطبيق موجه بالبالون فالكرة الخفيفة، ويؤدي التلميذ الضرب من أعلى بالبالون ثم بالكرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ ضرب البالون براحة اليدين ثم بأطراف الأصابع، ومن فوق الجبهة ثم من أمام الصدر، ويكتشف أي الطرق تجعل البالون يرتفع مستقيمًا، ويجرب التلميذ ويستنتج النقاط الفنية (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (البالون الطائر): من يبقي بالونه في الهواء أطول بالضرب من أعلى دون مسكه، ويلعب التلميذ ويعد (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، ظهر إحدى اليدين على راحة الأخرى، مد الذراعين أمامًا أسفل، ضرب الكرة بالجزء الأمامي للساعدين مع مد الركبتين وتوجيه الكرة لأعلى (ص 103-104)، ثم تطبيق موجه، ويؤدي التلميذ الضرب من أسفل بالبالون ثم بالكرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في أزواج: يرمي أحدهما الكرة منخفضة ويضربها الآخر من أسفل لتعود إليه، ثم يرميها عالية فيضربها من أعلى، ويتبادلان مع العد، ويتبادل التلميذ ويختار طريقة الضرب حسب ارتفاع الكرة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (أعلى أم أسفل): ينادي المعلم ويرمي الكرة فيضربها التلميذ بالطريقة الصحيحة، ويلعب التلميذ ويختار الطريقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وإطالة الساعدين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): أين تكون اليدان قبل ضرب الكرة من أعلى؟\nالإجابة: فوق الجبهة والأصابع منتشرة.\nس2 (مستوى التطبيق): بأي جزء من اليد نضرب الكرة؟\nالإجابة: بأطراف الأصابع.\nس3 (مستوى الاستدلال): ما الفرق بين ضرب الكرة ورميها؟\nالإجابة: في الضرب تلمس الكرة لحظة وتنطلق، وفي الرمي نمسكها ثم نقذفها.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.\n\nس4 (مستوى المعرفة): كيف توضع اليدان في الضرب من أسفل؟\nالإجابة: ظهر إحدى اليدين على راحة الأخرى.\nس5 (مستوى التطبيق): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالجزء الأمامي للساعدين.\nس6 (مستوى الاستدلال): متى نستخدم الضرب من أسفل؟\nالإجابة: عندما تكون الكرة منخفضة.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): اضرب البالون من أعلى 5 مرات متتالية.\nالإجابة: يؤديها دون مسك البالون.\nس2 (مستوى التطبيق): لماذا نمد الركبتين مع الذراعين عند الضرب؟\nالإجابة: لتزيد قوة الضرب وتذهب الكرة أعلى.\nس3 (مستوى الاستدلال): سمِّ لعبة فيها ضرب الكرة من أعلى.\nالإجابة: الكرة الطائرة.\n\nس4 (مستوى المعرفة): اضرب الكرة القادمة منخفضة من أسفل لتعود لزميلك.\nالإجابة: يؤديها بالساعدين.\nس5 (مستوى التطبيق): زميلك يرمي الكرة عالية فوق رأسك، أي ضربة تختار ولماذا؟\nالإجابة: الضرب من أعلى لأن الكرة فوق مستوى الجبهة.\nس6 (مستوى الاستدلال): لماذا نمد الركبتين عند الضرب من أسفل؟\nالإجابة: لتعطي الكرة قوة وارتفاعًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك إبقاء بالون في الهواء بالضرب من أعلى بأطراف الأصابع (دليل المعلم ص 102-103).\nإرشاد لولي الأمر: تدرب مع طفلك على ضرب كرة خفيفة من أسفل بالساعدين 10 مرات (دليل المعلم ص 103-104).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}, {"focus": "محطات ضرب الكرة + ألعاب ومنافسات ضرب الكرة", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي ضرب الكرة من أعلى ومن أسفل في محطات مختلفة (10 دقائق)\n2. يوجه الكرة بالضرب نحو هدف (طوق، زميل) (5 دقائق)\n3. يتعاون مع مجموعته في محطات ضرب الكرة (5 دقائق)\n4. يوظف ضرب الكرة من أعلى ومن أسفل في ألعاب ومنافسات (10 دقائق)\n5. يطبق قواعد اللعبة ويحافظ على الكرة من السقوط (5 دقائق)\n6. يشعر بالسعادة عند مشاركة زملائه أنشطة ضرب الكرة (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "- ضرب الكرة\n- الدقة\n- المحطات\n- الحبل\n- الدائرة\n- المحافظة على الكرة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الضربتين بنموذج تلميذين ويعرض المحطات ويسأل: في أي محطة نحتاج إلى الضرب من أعلى؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: ضرب البالون من أعلى داخل طوق معلق، ضرب الكرة من أسفل فوق الحبل للزميل، ضرب الكرة على الحائط من أعلى والتقاطها، ضرب البالون بالتبادل أعلى وأسفل، ويشاهد التلميذ ويحدد الضربة المناسبة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 106-107: أربع مجموعات بقائد تؤدي المحطات بالتبديل، ويسجل القائد الضربات الصحيحة، ويؤدي التلميذ مهمة المحطة ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أي مجموعة تمرر الكرة فوق الحبل بالضرب أكبر عدد من المرات دون سقوط، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 5 (ألعاب ضرب الكرة) ص 108: دائرتان قطرهما 10 م، تضرب كل مجموعة البالون بالتبادل من أعلى أو أسفل دون توقف ولا يلمس الأرض، ويستبعد من يسقط بالونه، ثم لعبة تمرير الكرة فوق الحبل بين مجموعتين بالضرب، ويلعب التلميذ ويحافظ على الكرة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. مباراة مصغرة بين مجموعتين فوق الحبل بثلاث ضربات لكل مجموعة قبل الإعادة، بأدوار (ضارب، مساعد، حكم صغير)، ويلعب التلميذ بدوره ويلتزم بالقواعد (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يسأل المعلم: لماذا سقط البالون في بعض المرات؟ ليستنتج التلاميذ أهمية النظر إلى الكرة والتحرك تحتها، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – بالون حب الوطن: يضرب الأزواج البالون باليدين من أعلى لأعلى، وكلما ضربه أحدهم ذكر شيئًا يحبه في عمان، ويحاولون ألا يسقط البالون حتى ينتهي العد (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): في أي محطة ضربنا الكرة فوق الحبل؟\nالإجابة: محطة الضرب من أسفل للزميل.\nس2 (مستوى التطبيق): ما الضربة المناسبة لإدخال البالون في الطوق المعلق؟\nالإجابة: الضرب من أعلى.\nس3 (مستوى الاستدلال): كيف نوجه الكرة نحو الهدف؟\nالإجابة: ننظر إلى الهدف ونمد الذراعين في اتجاهه.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.\n\nس4 (مستوى المعرفة): ما قاعدة لعبة الدائرة؟\nالإجابة: نضرب البالون بالتبادل ولا نتركه يلمس الأرض.\nس5 (مستوى التطبيق): كم ضربة لكل مجموعة في المباراة قبل الإعادة فوق الحبل؟\nالإجابة: ثلاث ضربات.\nس6 (مستوى الاستدلال): لماذا نتحرك تحت الكرة قبل ضربها؟\nالإجابة: لنضربها بالطريقة الصحيحة وتذهب في الاتجاه المطلوب.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الطوق المعلق والحبل (أو الحائط، البالون بالتبادل).\nس2 (مستوى التطبيق): اضرب الكرة فوق الحبل لتصل إلى زميلك.\nالإجابة: يضرب من أسفل بدقة.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك؟\nالإجابة: سجل الضربات ونظم الدور وشجعنا.\n\nس4 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم.\nالإجابة: لعبة الدائرة بالبالون أو المباراة فوق الحبل.\nس5 (مستوى التطبيق): ما دور الحكم الصغير في المباراة؟\nالإجابة: يراقب القواعد ويحسب النقاط.\nس6 (مستوى الاستدلال): كيف شعرت عندما أعادت مجموعتك الكرة فوق الحبل؟\nالإجابة: يعبر عن سعادته بالتعاون.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اربط حبلًا منخفضًا في المنزل وتبادل مع طفلك ضرب بالون فوقه (دليل المعلم ص 106-107).\nإرشاد لولي الأمر: العب مع طفلك مباراة بالون فوق حبل في المنزل بالضرب من أعلى ومن أسفل (دليل المعلم ص 108).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة ضرب الكرة باليدين من أعلى ونقاطها الفنية (10 دقائق)\n2. يؤدي ضرب الكرة (البالون) باليدين من أعلى لأعلى (5 دقائق)\n3. يميز بين ضرب الكرة ورميها (5 دقائق)\n4. يتعرف حركة ضرب الكرة باليدين من أسفل ونقاطها الفنية (5 دقائق)\n5. يؤدي ضرب الكرة من أسفل بالساعدين (5 دقائق)\n6. يختار طريقة الضرب (أعلى أو أسفل) حسب ارتفاع الكرة (10 دقائق)\n\nالحصة 2:\n1. يؤدي ضرب الكرة من أعلى ومن أسفل في محطات مختلفة (10 دقائق)\n2. يوجه الكرة بالضرب نحو هدف (طوق، زميل) (5 دقائق)\n3. يتعاون مع مجموعته في محطات ضرب الكرة (5 دقائق)\n4. يوظف ضرب الكرة من أعلى ومن أسفل في ألعاب ومنافسات (10 دقائق)\n5. يطبق قواعد اللعبة ويحافظ على الكرة من السقوط (5 دقائق)\n6. يشعر بالسعادة عند مشاركة زملائه أنشطة ضرب الكرة (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- ضرب الكرة\n- التوافق\n- الدقة\n- من أعلى\n- أطراف الأصابع\n- ضرب الكرة من أسفل\n- الساعدان\n- مستوى الكرة\n\nالحصة 2:\n- ضرب الكرة\n- الدقة\n- المحطات\n- الحبل\n- الدائرة\n- المحافظة على الكرة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم بالونًا لتلميذ ويسأل: كيف تبقيه في الهواء دون أن تمسكه؟ ويعرض صورة لاعب كرة طائرة يمرر من أعلى.\n\nالحصة 2:\nيراجع المعلم الضربتين بنموذج تلميذين ويعرض المحطات ويسأل: في أي محطة نحتاج إلى الضرب من أعلى؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري، رفع الذراعين عاليًا، تحريك الأصابع، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، اليدان فوق الجبهة والأصابع منتشرة، مد الذراعين والركبتين لضرب الكرة بأطراف الأصابع لأعلى (ص 102-103)، ثم تطبيق موجه بالبالون فالكرة الخفيفة، ويؤدي التلميذ الضرب من أعلى بالبالون ثم بالكرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ ضرب البالون براحة اليدين ثم بأطراف الأصابع، ومن فوق الجبهة ثم من أمام الصدر، ويكتشف أي الطرق تجعل البالون يرتفع مستقيمًا، ويجرب التلميذ ويستنتج النقاط الفنية (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (البالون الطائر): من يبقي بالونه في الهواء أطول بالضرب من أعلى دون مسكه، ويلعب التلميذ ويعد (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، ظهر إحدى اليدين على راحة الأخرى، مد الذراعين أمامًا أسفل، ضرب الكرة بالجزء الأمامي للساعدين مع مد الركبتين وتوجيه الكرة لأعلى (ص 103-104)، ثم تطبيق موجه، ويؤدي التلميذ الضرب من أسفل بالبالون ثم بالكرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في أزواج: يرمي أحدهما الكرة منخفضة ويضربها الآخر من أسفل لتعود إليه، ثم يرميها عالية فيضربها من أعلى، ويتبادلان مع العد، ويتبادل التلميذ ويختار طريقة الضرب حسب ارتفاع الكرة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (أعلى أم أسفل): ينادي المعلم ويرمي الكرة فيضربها التلميذ بالطريقة الصحيحة، ويلعب التلميذ ويختار الطريقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وإطالة الساعدين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: ضرب البالون من أعلى داخل طوق معلق، ضرب الكرة من أسفل فوق الحبل للزميل، ضرب الكرة على الحائط من أعلى والتقاطها، ضرب البالون بالتبادل أعلى وأسفل، ويشاهد التلميذ ويحدد الضربة المناسبة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 106-107: أربع مجموعات بقائد تؤدي المحطات بالتبديل، ويسجل القائد الضربات الصحيحة، ويؤدي التلميذ مهمة المحطة ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أي مجموعة تمرر الكرة فوق الحبل بالضرب أكبر عدد من المرات دون سقوط، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 5 (ألعاب ضرب الكرة) ص 108: دائرتان قطرهما 10 م، تضرب كل مجموعة البالون بالتبادل من أعلى أو أسفل دون توقف ولا يلمس الأرض، ويستبعد من يسقط بالونه، ثم لعبة تمرير الكرة فوق الحبل بين مجموعتين بالضرب، ويلعب التلميذ ويحافظ على الكرة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. مباراة مصغرة بين مجموعتين فوق الحبل بثلاث ضربات لكل مجموعة قبل الإعادة، بأدوار (ضارب، مساعد، حكم صغير)، ويلعب التلميذ بدوره ويلتزم بالقواعد (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يسأل المعلم: لماذا سقط البالون في بعض المرات؟ ليستنتج التلاميذ أهمية النظر إلى الكرة والتحرك تحتها، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – بالون حب الوطن: يضرب الأزواج البالون باليدين من أعلى لأعلى، وكلما ضربه أحدهم ذكر شيئًا يحبه في عمان، ويحاولون ألا يسقط البالون حتى ينتهي العد (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): أين تكون اليدان قبل ضرب الكرة من أعلى؟\nالإجابة: فوق الجبهة والأصابع منتشرة.\nس2 (مستوى التطبيق): بأي جزء من اليد نضرب الكرة؟\nالإجابة: بأطراف الأصابع.\nس3 (مستوى الاستدلال): ما الفرق بين ضرب الكرة ورميها؟\nالإجابة: في الضرب تلمس الكرة لحظة وتنطلق، وفي الرمي نمسكها ثم نقذفها.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.\n\nس4 (مستوى المعرفة): كيف توضع اليدان في الضرب من أسفل؟\nالإجابة: ظهر إحدى اليدين على راحة الأخرى.\nس5 (مستوى التطبيق): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالجزء الأمامي للساعدين.\nس6 (مستوى الاستدلال): متى نستخدم الضرب من أسفل؟\nالإجابة: عندما تكون الكرة منخفضة.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.\n\nالحصة 2:\nتفريد التعليم:\nس1 (مستوى المعرفة): في أي محطة ضربنا الكرة فوق الحبل؟\nالإجابة: محطة الضرب من أسفل للزميل.\nس2 (مستوى التطبيق): ما الضربة المناسبة لإدخال البالون في الطوق المعلق؟\nالإجابة: الضرب من أعلى.\nس3 (مستوى الاستدلال): كيف نوجه الكرة نحو الهدف؟\nالإجابة: ننظر إلى الهدف ونمد الذراعين في اتجاهه.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.\n\nس4 (مستوى المعرفة): ما قاعدة لعبة الدائرة؟\nالإجابة: نضرب البالون بالتبادل ولا نتركه يلمس الأرض.\nس5 (مستوى التطبيق): كم ضربة لكل مجموعة في المباراة قبل الإعادة فوق الحبل؟\nالإجابة: ثلاث ضربات.\nس6 (مستوى الاستدلال): لماذا نتحرك تحت الكرة قبل ضربها؟\nالإجابة: لنضربها بالطريقة الصحيحة وتذهب في الاتجاه المطلوب.\n\n• نشاط علاجي (لمن لم يتقن): يضرب المعلم مع التلميذ بالونًا باليدين من أعلى بأطراف الأصابع واليدان فوق الجبهة، ثم يطلب منه ضرب البالون لأعلى ثلاث مرات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتبادل ضرب الكرة الخفيفة مع زميل من أعلى ثم من أسفل دون سقوطها، وعدّ التمريرات، وتوضيح الفرق بين الضرب والرمي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اضرب البالون من أعلى 5 مرات متتالية.\nالإجابة: يؤديها دون مسك البالون.\nس2 (مستوى التطبيق): لماذا نمد الركبتين مع الذراعين عند الضرب؟\nالإجابة: لتزيد قوة الضرب وتذهب الكرة أعلى.\nس3 (مستوى الاستدلال): سمِّ لعبة فيها ضرب الكرة من أعلى.\nالإجابة: الكرة الطائرة.\n\nس4 (مستوى المعرفة): اضرب الكرة القادمة منخفضة من أسفل لتعود لزميلك.\nالإجابة: يؤديها بالساعدين.\nس5 (مستوى التطبيق): زميلك يرمي الكرة عالية فوق رأسك، أي ضربة تختار ولماذا؟\nالإجابة: الضرب من أعلى لأن الكرة فوق مستوى الجبهة.\nس6 (مستوى الاستدلال): لماذا نمد الركبتين عند الضرب من أسفل؟\nالإجابة: لتعطي الكرة قوة وارتفاعًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الطوق المعلق والحبل (أو الحائط، البالون بالتبادل).\nس2 (مستوى التطبيق): اضرب الكرة فوق الحبل لتصل إلى زميلك.\nالإجابة: يضرب من أسفل بدقة.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك؟\nالإجابة: سجل الضربات ونظم الدور وشجعنا.\n\nس4 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم.\nالإجابة: لعبة الدائرة بالبالون أو المباراة فوق الحبل.\nس5 (مستوى التطبيق): ما دور الحكم الصغير في المباراة؟\nالإجابة: يراقب القواعد ويحسب النقاط.\nس6 (مستوى الاستدلال): كيف شعرت عندما أعادت مجموعتك الكرة فوق الحبل؟\nالإجابة: يعبر عن سعادته بالتعاون.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: العب مع طفلك إبقاء بالون في الهواء بالضرب من أعلى بأطراف الأصابع (دليل المعلم ص 102-103).\nإرشاد لولي الأمر: تدرب مع طفلك على ضرب كرة خفيفة من أسفل بالساعدين 10 مرات (دليل المعلم ص 103-104).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13\n\nالحصة 2:\nإرشاد لولي الأمر: اربط حبلًا منخفضًا في المنزل وتبادل مع طفلك ضرب بالون فوقه (دليل المعلم ص 106-107).\nإرشاد لولي الأمر: العب مع طفلك مباراة بالون فوق حبل في المنزل بالضرب من أعلى ومن أسفل (دليل المعلم ص 108).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=13"}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 60-108 (مهارات الوحدتين الثانية والثالثة)", "n": 1, "periods": [{"focus": "قياس أداء الحركات الأساسية (الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران) + قياس أداء مهارات المعالجة والتناول (التنطيط، المحاورة، ضرب الكرة)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الخطو الجانبي وركضة الحصان في مسار محدد بالطريقة الصحيحة (10 دقائق)\n2. يؤدي تبادل الخطو والحجل بإيقاع صحيح (5 دقائق)\n3. يؤدي اللف والدوران مع المحافظة على الاتزان (5 دقائق)\n4. يؤدي تنطيط الكرة في المكان ومن الحركة بالطريقة الصحيحة (5 دقائق)\n5. يؤدي المحاورة بين الأقماع مع تغيير الاتجاه (5 دقائق)\n6. يؤدي ضرب الكرة من أعلى ومن أسفل (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: كرات متوسطة\n- أخرى: استمارة تقويم الأداء\n- أخرى: بالونات", "المفاهيم": "- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الإيقاع\n- التنطيط\n- المحاورة\n- ضرب الكرة", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم أن الحصة لقياس الحركات الأساسية ويعرض محطات القياس ويطمئن التلاميذ.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم يشمل الحركات التي ستقاس، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في  لم يتقن): يعيد المعلم مع التلميذ الحركة التي لم يتقنها في القياس (ركضة الحصان أو الخطو الجانبي) ببطء مع النداء، ثم يطلب منه أداءها مرة في المسار المحدد.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء مسار متصل يجمع الخطو الجانبي وركضة الحصان وتبادل الخطو والحجل ثم دورة كاملة متزنة، مع تنطيط الكرة في نهايته.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تبادل الخطو والحجل داخل الأطواق.\nالإجابة: يؤديه بالإيقاع الصحيح.\nس2 (مستوى التطبيق): ما الفرق بين اللف والدوران؟\nالإجابة: اللف لجزء من الجسم، والدوران للجسم كله.\nس3 (مستوى الاستدلال): لماذا نتدرب بهدوء في انتظار الدور؟\nالإجابة: ليؤدي كل تلميذ قياسه بتركيز.\n\nس4 (مستوى المعرفة): نطط الكرة أثناء المشي حتى القمع.\nالإجابة: يؤديه دون فقد الكرة.\nس5 (مستوى التطبيق): اضرب البالون من أعلى 5 مرات.\nالإجابة: يؤديها بأطراف الأصابع.\nس6 (مستوى الاستدلال): ما المهارة التي أتقنتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية قبل حصة القياس الثانية (دليل المعلم ص 60-82).\nإرشاد لولي الأمر: شجع طفلك على ممارسة التنطيط وضرب الكرة في العطلة (دليل المعلم ص 86-108).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=14"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يؤدي الخطو الجانبي وركضة الحصان في مسار محدد بالطريقة الصحيحة (10 دقائق)\n2. يؤدي تبادل الخطو والحجل بإيقاع صحيح (5 دقائق)\n3. يؤدي اللف والدوران مع المحافظة على الاتزان (5 دقائق)\n4. يؤدي تنطيط الكرة في المكان ومن الحركة بالطريقة الصحيحة (5 دقائق)\n5. يؤدي المحاورة بين الأقماع مع تغيير الاتجاه (5 دقائق)\n6. يؤدي ضرب الكرة من أعلى ومن أسفل (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: كرات متوسطة\n- أخرى: استمارة تقويم الأداء\n- أخرى: بالونات", "المفاهيم": "الحصة 1:\n- قياس ط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء مسار متصل يجمع الخطو الجانبي وركضة الحصان وتبادل الخطو والحجل ثم دورة كاملة متزنة، مع تنطيط الكرة في نهايته.\n\nس4 (مستوى المعرفة): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بالأصابع.\nس5 (مستوى التطبيق): لماذا ننطط الكرة منخفضة عند المحاورة؟\nالإجابة: لنغير الاتجاه بسهولة.\nس6 (مستوى الاستدلال): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالساعدين.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الحركة التي لم يتقنها في القياس (ركضة الحصان أو الخطو الجانبي) ببطء مع النداء، ثم يطلب منه أداءها مرة في المسار المحدد.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء مسار متصل يجمع الخطو الجانبي وركضة الحصان وتبادل الخطو والحجل ثم دورة كاملة متزنة، مع تنطيط الكرة في نهايته.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ تبادل الخطو والحجل داخل الأطواق.\nالإجابة: يؤديه بالإيقاع الصحيح.\nس2 (مستوى التطبيق): ما الفرق بين اللف والدوران؟\nالإجابة: اللف لجزء من الجسم، والدوران للجسم كله.\nس3 (مستوى الاستدلال): لماذا نتدرب بهدوء في انتظار الدور؟\nالإجابة: ليؤدي كل تلميذ قياسه بتركيز.\n\nس4 (مستوى المعرفة): نطط الكرة أثناء المشي حتى القمع.\nالإجابة: يؤديه دون فقد الكرة.\nس5 (مستوى التطبيق): اضرب البالون من أعلى 5 مرات.\nالإجابة: يؤديها بأطراف الأصابع.\nس6 (مستوى الاستدلال): ما المهارة التي أتقنتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية قبل حصة القياس الثانية (دليل المعلم ص 60-82).\nإرشاد لولي الأمر: شجع طفلك على ممارسة التنطيط وضرب الكرة في العطلة (دليل المعلم ص 86-108).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=14"}}, {"title": "الممارسات الصحية والنشاط الحر", "unit": "ختام الفصل الدراسي الأول", "week": "السابع عشر", "date": "27-30/12/2026", "pages": "دليل المعلم ص 23، 26", "n": 1, "periods": [{"focus": "الممارسات الصحية: الوقاية من أشعة الشمس والحرارة أثناء النشاط + النشاط الحر: ألعاب من اختيار التلاميذ", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر طرق الوقاية من الشمس والحرارة أثناء اللعب (5 دقائق)\n2. يميز الأوقات والأماكن المناسبة للعب في الهواء الطلق (5 دقائق)\n3. يقدر أهمية شرب الماء والراحة في الظل (10 دقائق)\n4. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله (5 دقائق)\n5. يطبق قواعد الأمن والسلامة أثناء النشاط الحر (5 دقائق)\n6. يتعاون مع مجموعته ويتبادل القيادة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: قبعة\n- أخرى: زجاجات ماء\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: بالونات", "المفاهيم": "- الوقاية من الشمس\n- الظل\n- القبعة\n- الماء\n- الراحة\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة أطفال يلعبون في الظهيرة بلا قبعات ويسأل: ماذا قد يحدث لهم؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء خفيف في الظل بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم البطاقات ويفكر بصوت عالٍ: نلعب في الصباح أو العصر، نلبس قبعة وملابس فاتحة، نشرب الماء، نستريح في الظل عند التعب (برنامج صحتي ص 26)، ويستمع التلميذ ويرتب بطاقات الوقاية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الظل والشمس): عند نداء (شمس) يجري التلاميذ، وعند (ظل) يذهبون إلى الأطواق (الظل) ويشربون الماء تمثيلًا، ويلعب التلميذ ويستجيب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تعرض كل مجموعة ثلاث نصائح للعب الآمن في الحر بالتمثيل، والتلاميذ يتعاون ويعرض (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تقسيم المجموعات (لا تقل عن أربعة) بقائد، وتحاور كل مجموعة لاختيار لعبة (شعبية بسيطة، منافسة صغيرة، عرض تمرينات) وإعداد أدواتها، ويحاور التلميذ ويختار ويعد الأدوات (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تنفذ المجموعات ألعابها بإشراف المعلم مع تبديل القائد في منتصف الوقت، ويلعب التلميذ ويلتزم بالقواعد ويتبادل القيادة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تعرض كل مجموعة لعبتها في دقيقة، ويعرض التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة وتعبير عن أجمل حصة في الفصل، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – تحت ظل الغافة: تتحاور المجموعات في أفضل مكان ووقت للعب في صيف عمان، كظل شجرة الغاف أو بعد العصر، وتذكر لبس الكمة أو القبعة وشرب الماء والراحة في الظل (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): متى نفضل اللعب في الهواء الطلق؟\nالإجابة: في الصباح الباكر أو العصر.\nس2 (مستوى التطبيق): ماذا نلبس للوقاية من الشمس؟\nالإجابة: قبعة وملابس فاتحة.\nس3 (مستوى الاستدلال): ماذا نفعل إذا شعرنا بالتعب والحر أثناء اللعب؟\nالإجابة: نستريح في الظل ونشرب الماء.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لأطفال يلعبون في الشمس والظل، ويختار مع التلميذ القبعة والملابس الفاتحة والماء، ثم يسأله: ماذا نفعل إذا شعرنا بالتعب والحر أثناء اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة إرشادات للعب الآمن في الصيف (الوقت المناسب، واللباس، والماء، والظل)، واختيار نشاط حر مناسب لمجموعتهم.\n\nس4 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر ويعلل.\nس5 (مستوى التطبيق): ما دور القائد؟\nالإجابة: ينظم اللعب ويوزع الأدوار ويحرص على السلامة.\nس6 (مستوى الاستدلال): لماذا نبدل القائد؟\nالإجابة: ليجرب الجميع القيادة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لأطفال يلعبون في الشمس والظل، ويختار مع التلميذ القبعة والملابس الفاتحة والماء، ثم يسأله: ماذا نفعل إذا شعرنا بالتعب والحر أثناء اللعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة إرشادات للعب الآمن في الصيف (الوقت المناسب، واللباس، والماء، والظل)، واختيار نشاط حر مناسب لمجموعتهم.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة طفل يلعب ظهرًا بلا قبعة، ما الخطأ؟\nالإجابة: يلعب وقت الحر الشديد بلا قبعة.\nس2 (مستوى التطبيق): اذكر نصيحتين قدمتهما مجموعتك.\nالإجابة: مثل: اشرب الماء، والعب في الظل.\nس3 (مستوى الاستدلال): لماذا تضر الشمس الشديدة الجسم؟\ let mode='sep', li=0, pi=0;

function render(){
  const L=DATA[li];

  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');

  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);

async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
<script src="/assets/qlink.js" defer></script>
