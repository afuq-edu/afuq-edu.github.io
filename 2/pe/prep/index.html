\nالمخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور أطعمة\n- أخرى: زجاجات ماء\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الوجبة الصحية\n- الماء\n- الطاقة\n- المقصف\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- التنطيط\n- المحاورة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا أكلتم في الفسحة؟ ويعرض بطاقات (ساندويتش جبن، فاكهة، حلوى، مشروب غازي) ويسأل: أيها يعطينا طاقة للعب؟\n\nالحصة 2:\nيعلن المعلم مهرجان (ألعب بالكرة) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام ويذكر قواعد الأمان.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم ثم شرب الماء برشفات.\n- الطالب: يقلد ويشرب.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يفكر المعلم بصوت عالٍ: الوجبة الصحية فيها خبز وبروتين (جبن أو بيض) وفاكهة أو خضار وماء أو حليب، والحلويات والمشروبات الغازية تضر الأسنان والصحة (برنامج صحتي ص 26).\n- الطالب: يستمع ويصنف البطاقات.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أركض إلى الصحة): طوقان (صحي، غير صحي)، يجري التلميذ ويسحب بطاقة ويضعها في الطوق الصحيح، ثم جولة ثانية بالتنطيط بالكرة.\n- الطالب: يلعب ويصنف.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تكوّن كل مجموعة وجبة مدرسية صحية من البطاقات وتعرضها وتشرح السبب.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة: أحضر وجبة صحية وزجاجة ماء.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بالكرة بنموذج المعلم.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم التنطيط في المكان (العدّاد)، قسم التنطيط المتعرج بين الأقماع، قسم المحاورة ومراوغة مدافع ثابت، قسم الحركات الأساسية بالكرة (ركضة الحصان حاملًا الكرة فوق الحبال)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع تنطيط ومحاورة.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): اذكر مكونين للوجبة المدرسية الصحية.\nالإجابة: خبز وجبن (أو فاكهة وحليب).\nس2 (المستوى المتوقع): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس3 (المستوى المتقدم): هل الشوكولاتة الكثيرة وجبة صحية؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير وتضر الأسنان.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القسم الذي كان فيه مدافع ثابت؟\nالإجابة: قسم المحاورة والمراوغة.\nس2 (المستوى المتوقع): كيف نحافظ على الكرة في قسم التنطيط المتعرج؟\nالإجابة: بالتنطيط المنخفض بالأصابع وتبديل اليدين عند الأقماع.\nس3 (المستوى المتقدم): لماذا نسجل نقاط النظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أرفع صورة مشروب غازي، في أي طوق نضعه؟\nالإجابة: طوق غير صحي.\nس2 (المستوى المتوقع): كوّن وجبة مدرسية صحية.\nالإجابة: مثل: ساندويتش جبن وتفاحة وماء.\nس3 (المستوى المتقدم): ماذا تنصح زميلك الذي يشتري الحلوى كل يوم؟\nالإجابة: أنصحه باختيار الفاكهة أو ساندويتش صحي.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أقسام مهرجان اليوم.\nالإجابة: التنطيط في المكان، التنطيط المتعرج، المحاورة والمراوغة، الحركات الأساسية بالكرة.\nس2 (المستوى المتوقع): ما دورك في مجموعتك اليوم؟\nالإجابة: يذكر دوره (قائد، مشارك، مسجل).\nس3 (المستوى المتقدم): ماذا تقول للمجموعة الفائزة؟\nالإجابة: أهنئها بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز مع طفلك وجبة مدرسية صحية وزجاجة ماء، وناقشا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 26).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وراجعا التنطيط والمحاورة (دليل المعلم ص 86-100)."}}, {"title": "ضرب الكرة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الرابع عشر – الخامس عشر", "date": "6-10/12/2026 إلى 13-17/12/2026", "pages": "دليل المعلم ص 101-108", "n": 4, "periods": [{"focus": "ضرب الكرة باليدين من أعلى", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ضرب الكرة باليدين من أعلى ونقاطها الفنية.\n2. يؤدي ضرب الكرة (البالون) باليدين من أعلى لأعلى.\n3. يميز بين ضرب الكرة ورميها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- ضرب الكرة\n- التوافق\n- الدقة\n- من أعلى\n- أطراف الأصابع", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم بالونًا لتلميذ ويسأل: كيف تبقيه في الهواء دون أن تمسكه؟ ويعرض صورة لاعب كرة طائرة يمرر من أعلى.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، رفع الذراعين عاليًا، تحريك الأصابع.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، اليدان فوق الجبهة والأصابع منتشرة، مد الذراعين والركبتين لضرب الكرة بأطراف الأصابع لأعلى (ص 102-103)، ثم تطبيق موجه بالبالون فالكرة الخفيفة.\n- الطالب: يؤدي الضرب من أعلى بالبالون ثم بالكرة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ ضرب البالون براحة اليدين ثم بأطراف الأصابع، ومن فوق الجبهة ثم من أمام الصدر، ويكتشف أي الطرق تجعل البالون يرتفع مستقيمًا.\n- الطالب: يجرب ويستنتج النقاط الفنية.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (البالون الطائر): من يبقي بالونه في الهواء أطول بالضرب من أعلى دون مسكه.\n- الطالب: يلعب ويعد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): أين تكون اليدان قبل ضرب الكرة من أعلى؟\nالإجابة: فوق الجبهة والأصابع منتشرة.\nس2 (المستوى المتوقع): بأي جزء من اليد نضرب الكرة؟\nالإجابة: بأطراف الأصابع.\nس3 (المستوى المتقدم): ما الفرق بين ضرب الكرة ورميها؟\nالإجابة: في الضرب تلمس الكرة لحظة وتنطلق، وفي الرمي نمسكها ثم نقذفها.", "التقويم الختامي": "س1 (مستوى الدعم): اضرب البالون من أعلى 5 مرات متتالية.\nالإجابة: يؤديها دون مسك البالون.\nس2 (المستوى المتوقع): لماذا نمد الركبتين مع الذراعين عند الضرب؟\nالإجابة: لتزيد قوة الضرب وتذهب الكرة أعلى.\nس3 (المستوى المتقدم): سمِّ لعبة فيها ضرب الكرة من أعلى.\nالإجابة: الكرة الطائرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك إبقاء بالون في الهواء بالضرب من أعلى بأطراف الأصابع (دليل المعلم ص 102-103)."}}, {"focus": "ضرب الكرة باليدين من أسفل", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ضرب الكرة باليدين من أسفل ونقاطها الفنية.\n2. يؤدي ضرب الكرة من أسفل بالساعدين.\n3. يختار طريقة الضرب (أعلى أو أسفل) حسب ارتفاع الكرة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- ضرب الكرة من أسفل\n- الساعدان\n- مستوى الكرة\n- التوافق", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم كرة منخفضة لتلميذ ويسأل: هل تستطيع ضربها من أعلى؟ ثم يعرض نموذج الضرب من أسفل.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع مراجعة الضرب من أعلى بالبالون.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، ظهر إحدى اليدين على راحة الأخرى، مد الذراعين أمامًا أسفل، ضرب الكرة بالجزء الأمامي للساعدين مع مد الركبتين وتوجيه الكرة لأعلى (ص 103-104)، ثم تطبيق موجه.\n- الطالب: يؤدي الضرب من أسفل بالبالون ثم بالكرة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج: يرمي أحدهما الكرة منخفضة ويضربها الآخر من أسفل لتعود إليه، ثم يرميها عالية فيضربها من أعلى، ويتبادلان مع العد.\n- الطالب: يتبادل ويختار طريقة الضرب حسب ارتفاع الكرة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أعلى أم أسفل): ينادي المعلم ويرمي الكرة فيضربها التلميذ بالطريقة الصحيحة.\n- الطالب: يلعب ويختار الطريقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساعدين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف توضع اليدان في الضرب من أسفل؟\nالإجابة: ظهر إحدى اليدين على راحة الأخرى.\nس2 (المستوى المتوقع): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالجزء الأمامي للساعدين.\nس3 (المستوى المتقدم): متى نستخدم الضرب من أسفل؟\nالإجابة: عندما تكون الكرة منخفضة.", "التقويم الختامي": "س1 (مستوى الدعم): اضرب الكرة القادمة منخفضة من أسفل لتعود لزميلك.\nالإجابة: يؤديها بالساعدين.\nس2 (المستوى المتوقع): زميلك يرمي الكرة عالية فوق رأسك، أي ضربة تختار ولماذا؟\nالإجابة: الضرب من أعلى لأن الكرة فوق مستوى الجبهة.\nس3 (المستوى المتقدم): لماذا نمد الركبتين عند الضرب من أسفل؟\nالإجابة: لتعطي الكرة قوة وارتفاعًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على ضرب كرة خفيفة من أسفل بالساعدين 10 مرات (دليل المعلم ص 103-104)."}}, {"focus": "محطات ضرب الكرة", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي ضرب الكرة من أعلى ومن أسفل في محطات مختلفة.\n2. يوجه الكرة بالضرب نحو هدف (طوق، زميل).\n3. يتعاون مع مجموعته في محطات ضرب الكرة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "- ضرب الكرة\n- الدقة\n- المحطات\n- الحبل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الضربتين بنموذج تلميذين ويعرض المحطات ويسأل: في أي محطة نحتاج إلى الضرب من أعلى؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج المحطات: ضرب البالون من أعلى داخل طوق معلق، ضرب الكرة من أسفل فوق الحبل للزميل، ضرب الكرة على الحائط من أعلى والتقاطها، ضرب البالون بالتبادل أعلى وأسفل.\n- الطالب: يشاهد ويحدد الضربة المناسبة.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 106-107: أربع مجموعات بقائد تؤدي المحطات بالتبديل، ويسجل القائد الضربات الصحيحة.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: أي مجموعة تمرر الكرة فوق الحبل بالضرب أكبر عدد من المرات دون سقوط.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): في أي محطة ضربنا الكرة فوق الحبل؟\nالإجابة: محطة الضرب من أسفل للزميل.\nس2 (المستوى المتوقع): ما الضربة المناسبة لإدخال البالون في الطوق المعلق؟\nالإجابة: الضرب من أعلى.\nس3 (المستوى المتقدم): كيف نوجه الكرة نحو الهدف؟\nالإجابة: ننظر إلى الهدف ونمد الذراعين في اتجاهه.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الطوق المعلق والحبل (أو الحائط، البالون بالتبادل).\nس2 (المستوى المتوقع): اضرب الكرة فوق الحبل لتصل إلى زميلك.\nالإجابة: يضرب من أسفل بدقة.\nس3 (المستوى المتقدم): كيف ساعد القائد مجموعتك؟\nالإجابة: سجل الضربات ونظم الدور وشجعنا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اربط حبلًا منخفضًا في المنزل وتبادل مع طفلك ضرب بالون فوقه (دليل المعلم ص 106-107)."}}, {"focus": "ألعاب ومنافسات ضرب الكرة", "num": 4, "fields": {"المخرجات التعليمية": "1. يوظف ضرب الكرة من أعلى ومن أسفل في ألعاب ومنافسات.\n2. يطبق قواعد اللعبة ويحافظ على الكرة من السقوط.\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة ضرب الكرة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "- ضرب الكرة\n- الدائرة\n- المحافظة على الكرة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الضربتين بسرعة ويعلن: اليوم مباريات بالبالون والكرة!", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب ضرب الكرة) ص 108: دائرتان قطرهما 10 م، تضرب كل مجموعة البالون بالتبادل من أعلى أو أسفل دون توقف ولا يلمس الأرض، ويستبعد من يسقط بالونه، ثم لعبة تمرير الكرة فوق الحبل بين مجموعتين بالضرب.\n- الطالب: يلعب ويحافظ على الكرة.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مباراة مصغرة بين مجموعتين فوق الحبل بثلاث ضربات لكل مجموعة قبل الإعادة، بأدوار (ضارب، مساعد، حكم صغير).\n- الطالب: يلعب بدوره ويلتزم بالقواعد.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سقط البالون في بعض المرات؟ ليستنتج التلاميذ أهمية النظر إلى الكرة والتحرك تحتها.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): ما قاعدة لعبة الدائرة؟\nالإجابة: نضرب البالون بالتبادل ولا نتركه يلمس الأرض.\nس2 (المستوى المتوقع): كم ضربة لكل مجموعة في المباراة قبل الإعادة فوق الحبل؟\nالإجابة: ثلاث ضربات.\nس3 (المستوى المتقدم): لماذا نتحرك تحت الكرة قبل ضربها؟\nالإجابة: لنضربها بالطريقة الصحيحة وتذهب في الاتجاه المطلوب.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر لعبة من ألعاب اليوم.\nالإجابة: لعبة الدائرة بالبالون أو المباراة فوق الحبل.\nس2 (المستوى المتوقع): ما دور الحكم الصغير في المباراة؟\nالإجابة: يراقب القواعد ويحسب النقاط.\nس3 (المستوى المتقدم): كيف شعرت عندما أعادت مجموعتك الكرة فوق الحبل؟\nالإجابة: يعبر عن سعادته بالتعاون.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك مباراة بالون فوق حبل في المنزل بالضرب من أعلى ومن أسفل (دليل المعلم ص 108)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة ضرب الكرة باليدين من أعلى ونقاطها الفنية.\n2. يؤدي ضرب الكرة (البالون) باليدين من أعلى لأعلى.\n3. يميز بين ضرب الكرة ورميها.\n\nالحصة 2:\n1. يتعرف حركة ضرب الكرة باليدين من أسفل ونقاطها الفنية.\n2. يؤدي ضرب الكرة من أسفل بالساعدين.\n3. يختار طريقة الضرب (أعلى أو أسفل) حسب ارتفاع الكرة.\n\nالحصة 3:\n1. يؤدي ضرب الكرة من أعلى ومن أسفل في محطات مختلفة.\n2. يوجه الكرة بالضرب نحو هدف (طوق، زميل).\n3. يتعاون مع مجموعته في محطات ضرب الكرة.\n\nالحصة 4:\n1. يوظف ضرب الكرة من أعلى ومن أسفل في ألعاب ومنافسات.\n2. يطبق قواعد اللعبة ويحافظ على الكرة من السقوط.\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة ضرب الكرة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: أطواق\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: بالونات\n- أخرى: كرات خفيفة\n- أخرى: حبل مثبت بين قائمين\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- ضرب الكرة\n- التوافق\n- الدقة\n- من أعلى\n- أطراف الأصابع\n\nالحصة 2:\n- ضرب الكرة من أسفل\n- الساعدان\n- مستوى الكرة\n- التوافق\n\nالحصة 3:\n- ضرب الكرة\n- الدقة\n- المحطات\n- الحبل\n\nالحصة 4:\n- ضرب الكرة\n- الدائرة\n- المحافظة على الكرة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم بالونًا لتلميذ ويسأل: كيف تبقيه في الهواء دون أن تمسكه؟ ويعرض صورة لاعب كرة طائرة يمرر من أعلى.\n\nالحصة 2:\nيرمي المعلم كرة منخفضة لتلميذ ويسأل: هل تستطيع ضربها من أعلى؟ ثم يعرض نموذج الضرب من أسفل.\n\nالحصة 3:\nيراجع المعلم الضربتين بنموذج تلميذين ويعرض المحطات ويسأل: في أي محطة نحتاج إلى الضرب من أعلى؟\n\nالحصة 4:\nيراجع المعلم الضربتين بسرعة ويعلن: اليوم مباريات بالبالون والكرة!", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، رفع الذراعين عاليًا، تحريك الأصابع.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، اليدان فوق الجبهة والأصابع منتشرة، مد الذراعين والركبتين لضرب الكرة بأطراف الأصابع لأعلى (ص 102-103)، ثم تطبيق موجه بالبالون فالكرة الخفيفة.\n- الطالب: يؤدي الضرب من أعلى بالبالون ثم بالكرة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ ضرب البالون براحة اليدين ثم بأطراف الأصابع، ومن فوق الجبهة ثم من أمام الصدر، ويكتشف أي الطرق تجعل البالون يرتفع مستقيمًا.\n- الطالب: يجرب ويستنتج النقاط الفنية.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (البالون الطائر): من يبقي بالونه في الهواء أطول بالضرب من أعلى دون مسكه.\n- الطالب: يلعب ويعد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع مراجعة الضرب من أعلى بالبالون.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف والقدمان متباعدتان والركبتان منثنيتان، ظهر إحدى اليدين على راحة الأخرى، مد الذراعين أمامًا أسفل، ضرب الكرة بالجزء الأمامي للساعدين مع مد الركبتين وتوجيه الكرة لأعلى (ص 103-104)، ثم تطبيق موجه.\n- الطالب: يؤدي الضرب من أسفل بالبالون ثم بالكرة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج: يرمي أحدهما الكرة منخفضة ويضربها الآخر من أسفل لتعود إليه، ثم يرميها عالية فيضربها من أعلى، ويتبادلان مع العد.\n- الطالب: يتبادل ويختار طريقة الضرب حسب ارتفاع الكرة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أعلى أم أسفل): ينادي المعلم ويرمي الكرة فيضربها التلميذ بالطريقة الصحيحة.\n- الطالب: يلعب ويختار الطريقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساعدين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج المحطات: ضرب البالون من أعلى داخل طوق معلق، ضرب الكرة من أسفل فوق الحبل للزميل، ضرب الكرة على الحائط من أعلى والتقاطها، ضرب البالون بالتبادل أعلى وأسفل.\n- الطالب: يشاهد ويحدد الضربة المناسبة.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 106-107: أربع مجموعات بقائد تؤدي المحطات بالتبديل، ويسجل القائد الضربات الصحيحة.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: أي مجموعة تمرر الكرة فوق الحبل بالضرب أكبر عدد من المرات دون سقوط.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب ضرب الكرة) ص 108: دائرتان قطرهما 10 م، تضرب كل مجموعة البالون بالتبادل من أعلى أو أسفل دون توقف ولا يلمس الأرض، ويستبعد من يسقط بالونه، ثم لعبة تمرير الكرة فوق الحبل بين مجموعتين بالضرب.\n- الطالب: يلعب ويحافظ على الكرة.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مباراة مصغرة بين مجموعتين فوق الحبل بثلاث ضربات لكل مجموعة قبل الإعادة، بأدوار (ضارب، مساعد، حكم صغير).\n- الطالب: يلعب بدوره ويلتزم بالقواعد.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سقط البالون في بعض المرات؟ ليستنتج التلاميذ أهمية النظر إلى الكرة والتحرك تحتها.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): أين تكون اليدان قبل ضرب الكرة من أعلى؟\nالإجابة: فوق الجبهة والأصابع منتشرة.\nس2 (المستوى المتوقع): بأي جزء من اليد نضرب الكرة؟\nالإجابة: بأطراف الأصابع.\nس3 (المستوى المتقدم): ما الفرق بين ضرب الكرة ورميها؟\nالإجابة: في الضرب تلمس الكرة لحظة وتنطلق، وفي الرمي نمسكها ثم نقذفها.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف توضع اليدان في الضرب من أسفل؟\nالإجابة: ظهر إحدى اليدين على راحة الأخرى.\nس2 (المستوى المتوقع): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالجزء الأمامي للساعدين.\nس3 (المستوى المتقدم): متى نستخدم الضرب من أسفل؟\nالإجابة: عندما تكون الكرة منخفضة.\n\nالحصة 3:\nس1 (مستوى الدعم): في أي محطة ضربنا الكرة فوق الحبل؟\nالإجابة: محطة الضرب من أسفل للزميل.\nس2 (المستوى المتوقع): ما الضربة المناسبة لإدخال البالون في الطوق المعلق؟\nالإجابة: الضرب من أعلى.\nس3 (المستوى المتقدم): كيف نوجه الكرة نحو الهدف؟\nالإجابة: ننظر إلى الهدف ونمد الذراعين في اتجاهه.\n\nالحصة 4:\nس1 (مستوى الدعم): ما قاعدة لعبة الدائرة؟\nالإجابة: نضرب البالون بالتبادل ولا نتركه يلمس الأرض.\nس2 (المستوى المتوقع): كم ضربة لكل مجموعة في المباراة قبل الإعادة فوق الحبل؟\nالإجابة: ثلاث ضربات.\nس3 (المستوى المتقدم): لماذا نتحرك تحت الكرة قبل ضربها؟\nالإجابة: لنضربها بالطريقة الصحيحة وتذهب في الاتجاه المطلوب.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اضرب البالون من أعلى 5 مرات متتالية.\nالإجابة: يؤديها دون مسك البالون.\nس2 (المستوى المتوقع): لماذا نمد الركبتين مع الذراعين عند الضرب؟\nالإجابة: لتزيد قوة الضرب وتذهب الكرة أعلى.\nس3 (المستوى المتقدم): سمِّ لعبة فيها ضرب الكرة من أعلى.\nالإجابة: الكرة الطائرة.\n\nالحصة 2:\nس1 (مستوى الدعم): اضرب الكرة القادمة منخفضة من أسفل لتعود لزميلك.\nالإجابة: يؤديها بالساعدين.\nس2 (المستوى المتوقع): زميلك يرمي الكرة عالية فوق رأسك، أي ضربة تختار ولماذا؟\nالإجابة: الضرب من أعلى لأن الكرة فوق مستوى الجبهة.\nس3 (المستوى المتقدم): لماذا نمد الركبتين عند الضرب من أسفل؟\nالإجابة: لتعطي الكرة قوة وارتفاعًا.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الطوق المعلق والحبل (أو الحائط، البالون بالتبادل).\nس2 (المستوى المتوقع): اضرب الكرة فوق الحبل لتصل إلى زميلك.\nالإجابة: يضرب من أسفل بدقة.\nس3 (المستوى المتقدم): كيف ساعد القائد مجموعتك؟\nالإجابة: سجل الضربات ونظم الدور وشجعنا.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر لعبة من ألعاب اليوم.\nالإجابة: لعبة الدائرة بالبالون أو المباراة فوق الحبل.\nس2 (المستوى المتوقع): ما دور الحكم الصغير في المباراة؟\nالإجابة: يراقب القواعد ويحسب النقاط.\nس3 (المستوى المتقدم): كيف شعرت عندما أعادت مجموعتك الكرة فوق الحبل؟\nالإجابة: يعبر عن سعادته بالتعاون.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: العب مع طفلك إبقاء بالون في الهواء بالضرب من أعلى بأطراف الأصابع (دليل المعلم ص 102-103).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طفلك على ضرب كرة خفيفة من أسفل بالساعدين 10 مرات (دليل المعلم ص 103-104).\n\nالحصة 3:\nإرشاد لولي الأمر: اربط حبلًا منخفضًا في المنزل وتبادل مع طفلك ضرب بالون فوقه (دليل المعلم ص 106-107).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طفلك مباراة بالون فوق حبل في المنزل بالضرب من أعلى ومن أسفل (دليل المعلم ص 108)."}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 60-108 (مهارات الوحدتين الثانية والثالثة)", "n": 2, "periods": [{"focus": "قياس أداء الحركات الأساسية (الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الخطو الجانبي وركضة الحصان في مسار محدد بالطريقة الصحيحة.\n2. يؤدي تبادل الخطو والحجل بإيقاع صحيح.\n3. يؤدي اللف والدوران مع المحافظة على الاتزان.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: كرات متوسطة\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الإيقاع", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم أن الحصة لقياس الحركات الأساسية ويعرض محطات القياس ويطمئن التلاميذ.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم يشمل الحركات التي ستقاس.\n- الطالب: يقلد.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 خطو جانبي بين الأقماع ثم ركضة حصان فوق الحبال، محطة 2 تبادل الخطو والحجل داخل الأطواق، محطة 3 لف الجذع لتسليم الكرة ثم دورة كاملة حول القمع؛ ويرصد المعلم في الاستمارة.\n- الطالب: يؤدي عند دوره ويتدرب مستقلًا.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة ختامية (البوصلة).\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعزيز.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة، وثبة، خطوة.\nس2 (المستوى المتوقع): هل تتقاطع القدمان في الخطو الجانبي؟\nالإجابة: لا.\nس3 (المستوى المتقدم): كيف نحافظ على الاتزان بعد الدورة الكاملة؟\nالإجابة: بثني الركبتين والنظر للأمام.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تبادل الخطو والحجل داخل الأطواق.\nالإجابة: يؤديه بالإيقاع الصحيح.\nس2 (المستوى المتوقع): ما الفرق بين اللف والدوران؟\nالإجابة: اللف لجزء من الجسم، والدوران للجسم كله.\nس3 (المستوى المتقدم): لماذا نتدرب بهدوء في انتظار الدور؟\nالإجابة: ليؤدي كل تلميذ قياسه بتركيز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية قبل حصة القياس الثانية (دليل المعلم ص 60-82)."}}, {"focus": "قياس أداء مهارات المعالجة والتناول (التنطيط، المحاورة، ضرب الكرة)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تنطيط الكرة في المكان ومن الحركة بالطريقة الصحيحة.\n2. يؤدي المحاورة بين الأقماع مع تغيير الاتجاه.\n3. يؤدي ضرب الكرة من أعلى ومن أسفل.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: بالونات\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- التنطيط\n- المحاورة\n- ضرب الكرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم محطات القياس الثلاث بنموذج سريع ويذكّر بالنقاط الفنية.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: قياس فردي في ثلاث محطات مع تدريب ذاتي: محطة 1 تنطيط 10 مرات في المكان ثم تنطيط أثناء المشي للقمع، محطة 2 محاورة بين 4 أقماع، محطة 3 ضرب البالون من أعلى 5 مرات ثم من أسفل 5 مرات؛ ويرصد المعلم.\n- الطالب: يؤدي عند دوره ويتدرب مستقلًا.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة ختامية (البالون الطائر).\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعزيز وإعلان الإجازة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بالأصابع.\nس2 (المستوى المتوقع): لماذا ننطط الكرة منخفضة عند المحاورة؟\nالإجابة: لنغير الاتجاه بسهولة.\nس3 (المستوى المتقدم): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالساعدين.", "التقويم الختامي": "س1 (مستوى الدعم): نطط الكرة أثناء المشي حتى القمع.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (المستوى المتوقع): اضرب البالون من أعلى 5 مرات.\nالإجابة: يؤديها بأطراف الأصابع.\nس3 (المستوى المتقدم): ما المهارة التي أتقنتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ممارسة التنطيط وضرب الكرة في العطلة (دليل المعلم ص 86-108)."} const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ المرجع: دليل المعلم للصف الثاني.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
</body>
</html>
