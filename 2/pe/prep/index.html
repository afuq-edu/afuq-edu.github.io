عليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 24-28", "n": 1, "periods": [{"focus": "الممارسات الصحية: الإحماء والتهدئة لحماية الجسم + المهرجان الرياضي التعليمي للتمرينات (الأوضاع المشتقة، التمرينات الحرة، التمثيل الحركي)", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده (10 دقائق)\n2. يميز تمرينات الإحماء من تمرينات التهدئة (5 دقائق)\n3. يطبق إحماءً بسيطًا بنفسه قبل اللعب (5 دقائق)\n4. يؤدي الأوضاع المشتقة والتمرينات الحرة ضمن أقسام المهرجان (10 دقائق)\n5. يوظف التمثيل الحركي في عرض جماعي قصير (5 دقائق)\n6. يتعاون مع مجموعته ويلتزم بالنظام في المهرجان (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة لتمرينات الإحماء والتهدئة\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات الأوضاع والتمرينات\n- أخرى: لوحة نقاط", "المفاهيم": "- الإحماء\n- التهدئة\n- الإصابة\n- العضلات\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- العرض الرياضي", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يحدث للسيارة في الصباح البارد قبل الانطلاق؟ ويربط ذلك بحاجة العضلات إلى تسخين قبل اللعب.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. يؤدي المعلم نموذج إحماء كامل (مشي، جري خفيف، تحريك المفاصل، إطالة خفيفة) مع التفكير بصوت عالٍ: لماذا نبدأ بالمشي؟ لماذا نحرك المفاصل؟ ويقلد التلميذ ويكرر السبب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يقارن التلاميذ بين مشاعرهم بعد الإحماء وقبله (دفء، سرعة النبض) ويستنتجون فائدة الإحماء في حماية العضلات من الإصابة، ويلاحظ التلميذ ويستنتج (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بثلاث حركات ثم يتبادلون، ويقود التلميذ الإحماء ويؤديه (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تصنف كل مجموعة بطاقات التمرينات إلى (إحماء) و(تهدئة) وتعرض السبب، ويصنف التلميذ ويعلل (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25 وص 56: قسم الأوضاع المشتقة (أداء الوضع من البطاقة)، قسم التمرينات الحرة الفردية والزوجية (محطات)، قسم جمباز الموانع (وثب فوق الحبال ومروق أسفل الحاجز)، قسم التمثيل الحركي (عرض قصير لمهنة)، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته بقيادة القائد (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: أسرع مجموعة تؤدي ثلاثة أوضاع مشتقة بالنداء، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم جميع المشاركين، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. غلق الدرس (نشاط ممتع مع المواطنة) – رحلة قارب الصيد: تمثل المجموعات رحلة صيد: تجهيز القارب بحركات هادئة (إحماء)، ثم التجديف السريع (نشاط)، ثم العودة البطيئة إلى الشاطئ (تهدئة)، وتذكر لماذا لا نبدأ بالجري مباشرة (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): لماذا نحمي العضلات بالإحماء؟\nالإجابة: لأن العضلة الباردة قد تتمزق أو تصاب عند الحركة القوية.\nس2 (مستوى التطبيق): بأي حركة نبدأ الإحماء؟\nالإجابة: بالمشي ثم الجري الخفيف.\nس3 (مستوى الاستدلال): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء يسخن الجسم في البداية، والتهدئة تريحه في النهاية.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً بسيطًا (مشي ثم جري خفيف ثم دوران الذراعين) ثم تهدئة (مشي بطيء وتنفس عميق)، ثم يسأله: بأي حركة نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إحماء من ثلاث حركات وتهدئة من حركتين، وقيادتهما لمجموعتهم، وشرح الفرق بين الإحماء والتهدئة.\n\nس4 (مستوى المعرفة): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الحرة.\nس5 (مستوى التطبيق): ما الوضع المشتق الذي ناداه القائد في المسابقة الختامية؟\nالإجابة: يذكر الوضع (مثل: وقوف فتحًا).\nس6 (مستوى الاستدلال): لماذا نسمي المجموعات بأسماء الولايات؟\nالإجابة: لنتعرف ولايات وطننا ونعتز بها.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً بسيطًا (مشي ثم جري خفيف ثم دوران الذراعين) ثم تهدئة (مشي بطيء وتنفس عميق)، ثم يسأله: بأي حركة نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إحماء من ثلاث حركات وتهدئة من حركتين، وقيادتهما لمجموعتهم، وشرح الفرق بين الإحماء والتهدئة.", "التقويم الختامي": "س1 (مستوى المعرفة): قُد إحماءً قصيرًا لزملائك بثلاث حركات.\nالإجابة: يؤدي مشيًا وجريًا خفيفًا وتحريك المفاصل.\nس2 (مستوى التطبيق): صنّف: التنفس العميق والإطالة البطيئة، إحماء أم تهدئة؟\nالإجابة: تهدئة.\nس3 (مستوى الاستدلال): زميلك يريد أن يلعب كرة القدم مباشرة دون إحماء، بماذا تنصحه؟\nالإجابة: أنصحه بالإحماء أولًا حتى لا يصاب.\n\nس4 (مستوى المعرفة): اذكر أقسام مهرجان اليوم الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الحرة، جمباز الموانع، التمثيل الحركي.\nس5 (مستوى التطبيق): ما المهنة التي مثلتها مجموعتك؟\nالإجابة: يذكر المهنة.\nس6 (مستوى الاستدلال): كيف أسهمت في فوز مجموعتك أو تحسين أدائها؟\nالإجابة: التزمت بالنظام وأديت التمرينات بدقة وساعدت زملائي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب في الحي والتهدئة بعده (برنامج صحتي، دليل المعلم ص 26).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين حرين يوميًا (دليل المعلم ص 42-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده (10 دقائق)\n2. يميز تمرينات الإحماء من تمرينات التهدئة (5 دقائق)\n3. يطبق إحماءً بسيطًا بنفسه قبل اللعب (5 دقائق)\n4. يؤدي الأوضاع المشتقة والتمرينات الحرة ضمن أقسام المهرجان (10 دقائق)\n5. يوظف التمثيل الحركي في عرض جماعي قصير (5 دقائق)\n6. يتعاون مع مجموعته ويلتزم بالنظام في المهرجان (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة لتمرينات الإحماء والتهدئة\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات الأوضاع والتمرينات\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الإحماء\n- التهدئة\n- الإصابة\n- العضلات\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- العرض الرياضي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا يحدث للسيارة في الصباح البارد قبل الانطلاق؟ ويربط ذلك بحاجة العضلات إلى تسخين قبل اللعب.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. يؤدي المعلم نموذج إحماء كامل (مشي، جري خفيف، تحريك المفاصل، إطالة خفيفة) مع التفكير بصوت عالٍ: لماذا نبدأ بالمشي؟ لماذا نحرك المفاصل؟ ويقلد التلميذ ويكرر السبب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يقارن التلاميذ بين مشاعرهم بعد الإحماء وقبله (دفء، سرعة النبض) ويستنتجون فائدة الإحماء في حماية العضلات من الإصابة، ويلاحظ التلميذ ويستنتج (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بثلاث حركات ثم يتبادلون، ويقود التلميذ الإحماء ويؤديه (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تصنف كل مجموعة بطاقات التمرينات إلى (إحماء) و(تهدئة) وتعرض السبب، ويصنف التلميذ ويعلل (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25 وص 56: قسم الأوضاع المشتقة (أداء الوضع من البطاقة)، قسم التمرينات الحرة الفردية والزوجية (محطات)، قسم جمباز الموانع (وثب فوق الحبال ومروق أسفل الحاجز)، قسم التمثيل الحركي (عرض قصير لمهنة)، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته بقيادة القائد (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: أسرع مجموعة تؤدي ثلاثة أوضاع مشتقة بالنداء، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم جميع المشاركين، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. غلق الدرس (نشاط ممتع مع المواطنة) – رحلة قارب الصيد: تمثل المجموعات رحلة صيد: تجهيز القارب بحركات هادئة (إحماء)، ثم التجديف السريع (نشاط)، ثم العودة البطيئة إلى الشاطئ (تهدئة)، وتذكر لماذا لا نبدأ بالجري مباشرة (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): لماذا نحمي العضلات بالإحماء؟\nالإجابة: لأن العضلة الباردة قد تتمزق أو تصاب عند الحركة القوية.\nس2 (مستوى التطبيق): بأي حركة نبدأ الإحماء؟\nالإجابة: بالمشي ثم الجري الخفيف.\nس3 (مستوى الاستدلال): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء يسخن الجسم في البداية، والتهدئة تريحه في النهاية.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً بسيطًا (مشي ثم جري خفيف ثم دوران الذراعين) ثم تهدئة (مشي بطيء وتنفس عميق)، ثم يسأله: بأي حركة نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إحماء من ثلاث حركات وتهدئة من حركتين، وقيادتهما لمجموعتهم، وشرح الفرق بين الإحماء والتهدئة.\n\nس4 (مستوى المعرفة): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الحرة.\nس5 (مستوى التطبيق): ما الوضع المشتق الذي ناداه القائد في المسابقة الختامية؟\nالإجابة: يذكر الوضع (مثل: وقوف فتحًا).\nس6 (مستوى الاستدلال): لماذا نسمي المجموعات بأسماء الولايات؟\nالإجابة: لنتعرف ولايات وطننا ونعتز بها.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ إحماءً بسيطًا (مشي ثم جري خفيف ثم دوران الذراعين) ثم تهدئة (مشي بطيء وتنفس عميق)، ثم يسأله: بأي حركة نبدأ الإحماء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إحماء من ثلاث حركات وتهدئة من حركتين، وقيادتهما لمجموعتهم، وشرح الفرق بين الإحماء والتهدئة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): قُد إحماءً قصيرًا لزملائك بثلاث حركات.\nالإجابة: يؤدي مشيًا وجريًا خفيفًا وتحريك المفاصل.\nس2 (مستوى التطبيق): صنّف: التنفس العميق والإطالة البطيئة، إحماء أم تهدئة؟\nالإجابة: تهدئة.\nس3 (مستوى الاستدلال): زميلك يريد أن يلعب كرة القدم مباشرة دون إحماء، بماذا تنصحه؟\nالإجابة: أنصحه بالإحماء أولًا حتى لا يصاب.\n\nس4 (مستوى المعرفة): اذكر أقسام مهرجان اليوم الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الحرة، جمباز الموانع، التمثيل الحركي.\nس5 (مستوى التطبيق): ما المهنة التي مثلتها مجموعتك؟\nالإجابة: يذكر المهنة.\nس6 (مستوى الاستدلال): كيف أسهمت في فوز مجموعتك أو تحسين أدائها؟\nالإجابة: التزمت بالنظام وأديت التمرينات بدقة وساعدت زملائي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب في الحي والتهدئة بعده (برنامج صحتي، دليل المعلم ص 26).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين حرين يوميًا (دليل المعلم ص 42-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=5"}}, {"title": "الخطو الجانبي وركضة الحصان", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "السادس – السابع", "date": "11-15/10/2026 إلى 18-22/10/2026", "pages": "دليل المعلم ص 60-67", "n": 2, "periods": [{"focus": "الخطو الجانبي + ركضة الحصان (عدو الفرس)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الخطو الجانبي ونقاطها الفنية (5 دقائق)\n2. يؤدي الخطو الجانبي لليمين واليسار بإيقاع منتظم (10 دقائق)\n3. يميز بين الخطو الجانبي والمشي الأمامي (5 دقائق)\n4. يتعرف حركة ركضة الحصان وتسلسلها (خطوة، وثبة، خطوة) (5 دقائق)\n5. يؤدي ركضة الحصان بإيقاع صحيح مع الهبوط على قدم الارتقاء (10 دقائق)\n6. يحافظ على الإيقاع والاتزان أثناء الأداء (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- الخطو الجانبي\n- الاتجاه\n- الإيقاع\n- الجانب الأيمن والأيسر\n- ركضة الحصان\n- قدم الارتقاء\n- الخطوة والوثبة", "التهيئة / التمهيد / التعلم القبلي": "يتحرك المعلم جانبًا كلاعب كرة سلة يدافع ويسأل: كيف تحركت؟ هل مشيت للأمام؟ ويعرض صورة حارس المرمى يتحرك جانبًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم تحريك الرجلين جانبًا من الوقوف، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الخطو الجانبي: وقوف، الركبتان منثنيتان قليلًا، نقل القدم اليمنى جانبًا ثم ضم اليسرى إليها دون تقاطع، والذراعان للاتزان (ص 61-62)، بالعد ثم بالإيقاع المتصل، ثم للجهة الأخرى، ويؤدي التلميذ الخطو الجانبي بالعد ثم بالإيقاع لليمين واليسار (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 63: خطو جانبي على خط مستقيم ثم بين الأقماع؛ يجرب التلميذ ضم القدمين بشكل ملاصق ثم بمسافة ويكتشف أي الطريقتين أسرع وأثبت، ويستنتج أهمية عدم تقاطع القدمين، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (المرآة الجانبية): في أزواج متقابلين، يتحرك أحدهما جانبًا ويتبعه الآخر كالمرآة بسرعات مختلفة، ويلعب التلميذ ويتابع زميله (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج بالعد: (1) وقوف وانثناء الركبتين وميل الجذع، (2) خطوة للأمام مع بقاء قدم أمام الأخرى، (3) ارتقاء عاليًا بالقدم الأمامية والهبوط عليها، ثم تتابع الحركة (ص 62)، فتطبيق موجه ثم مستقل في مسار الأقماع، ويؤدي التلميذ بالعد ثم بالإيقاع المتصل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في أزواج بأدوار: يراقب أحدهما قدم الهبوط لزميله ويقول (صح/أعد)، ثم يتبادلان، ثم يؤديان ركضة الحصان جنبًا إلى جنب بإيقاع واحد، ويراقب التلميذ ويصحح ويؤدي بالتوافق (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (سباق الخيول): قطارات، يؤدي كل تلميذ ركضة الحصان حتى القمع والعودة بالجري، وتفوز المجموعة الأدق إيقاعًا، ويتسابق التلميذ بالإيقاع الصحيح (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وإطالة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): في الخطو الجانبي، هل تتقاطع القدمان؟\nالإجابة: لا، تنتقل قدم جانبًا وتضم إليها الأخرى.\nس2 (مستوى التطبيق): أين تكون الركبتان أثناء الخطو الجانبي؟\nالإجابة: منثنيتين قليلًا.\nس3 (مستوى الاستدلال): اذكر لعبة يستخدم فيها اللاعب الخطو الجانبي.\nالإجابة: كرة السلة (الدفاع) أو حارس المرمى.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.\n\nس4 (مستوى المعرفة): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة ثم وثبة ثم خطوة.\nس5 (مستوى التطبيق): على أي قدم نهبط بعد الوثبة؟\nالإجابة: على قدم الارتقاء نفسها.\nس6 (مستوى الاستدلال): لماذا نميل الجذع قليلًا للأمام؟\nالإجابة: للاندفاع والاتزان أثناء الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ خطوًا جانبيًا لليمين 5 خطوات ثم لليسار.\nالإجابة: يؤديه دون تقاطع القدمين.\nس2 (مستوى التطبيق): ما الفرق بين الخطو الجانبي والمشي الأمامي؟\nالإجابة: الخطو الجانبي يتحرك فيه الجسم جانبًا والقدمان متوازيتان، والمشي يتحرك للأمام بتبادل القدمين.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين في الخطو الجانبي؟\nالإجابة: للاتزان وسرعة تغيير الاتجاه.\n\nس4 (مستوى المعرفة): أدِّ ركضة الحصان حتى القمع.\nالإجابة: يؤديها بالتسلسل الصحيح.\nس5 (مستوى التطبيق): ما الفرق بين ركضة الحصان والجري العادي؟\nالإجابة: ركضة الحصان تمزج الجري بالوثب والهبوط على القدم نفسها، والجري تبادل القدمين.\nس6 (مستوى الاستدلال): زميلك يهبط على القدم الأخرى بعد الوثبة، ماذا تقول له؟\nالإجابة: اهبط على قدم الارتقاء نفسها ثم خذ الخطوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الخطو الجانبي في الممر 5 خطوات لكل جهة (دليل المعلم ص 61-63).\nإرشاد لولي الأمر: شجع طفلك على أداء ركضة الحصان في ساحة آمنة مع العد (خطوة، وثبة، خطوة) (دليل المعلم ص 62-64).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}, {"focus": "محطات الخطو الجانبي وركضة الحصان + ألعاب الخطو الجانبي وركضة الحصان", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الخطو الجانبي وركضة الحصان في مسارات ومحطات مختلفة (10 دقائق)\n2. يميز متى يستخدم كل حركة حسب المحطة (10 دقائق)\n3. يتعاون مع مجموعته في تنفيذ المحطات (5 دقائق)\n4. يوظف الخطو الجانبي وركضة الحصان في الألعاب الرياضية (5 دقائق)\n5. يطبق قواعد اللعبة وإشارات المعلم أثناء اللعب (5 دقائق)\n6. يستمتع بمشاركة زملائه ألعاب الخطو الجانبي وركضة الحصان (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: شريط لاصق\n- أخرى: أعلام (أحمر وأخضر)\n- أخرى: كرات متوسطة", "المفاهيم": "- الخطو الجانبي\n- ركضة الحصان\n- المحطات\n- المسار\n- الإشارة\n- اللعبة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركتين بنموذج تلميذين، ثم يعرض المحطات ويسأل: أي حركة تناسب كل محطة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم يشمل الحركتين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: خطو جانبي بين الأقماع ذهابًا وإيابًا، ركضة الحصان فوق الحبال المنخفضة، خطو جانبي بجانب المقعد، ركضة الحصان في المسار المنحني، ويشاهد التلميذ ويحدد الحركة المناسبة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 65-66: أربع مجموعات بقائد تؤدي المحطات بالتبادل، ويسجل القائد الأداء الصحيح، ويؤدي التلميذ الحركة الصحيحة في كل محطة ويبدل بنظام (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تتابع: مسار يجمع الحركتين (خطو جانبي للقمع، ركضة حصان للعودة)، ويتسابق التلميذ بدقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 5 (ألعاب الخطو الجانبي وركضة الحصان) ص 67: ساحة مقسمة نصفين ومجموعتان بلونين، يرفع المعلم العلم الأحمر فتهرب مجموعة الأحمر بالخطو الجانبي وتطاردها الأخرى بركضة الحصان حتى الخط، وتحسب نقاط اللمس، ثم التبادل، ويلعب التلميذ مستجيبًا للعلم بالحركة الصحيحة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. في مجموعات، تبتكر كل مجموعة لعبة قصيرة تستخدم الحركتين بالكرة وتعرضها على الصف، ويبتكر التلميذ مع مجموعته ويعرض (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يسأل المعلم: لماذا كانت ركضة الحصان أسرع في المطاردة والخطو الجانبي أفضل في المراوغة؟ ليستنتج التلاميذ استخدام كل حركة، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – ميدان الخيل العربية: يؤدي الأزواج ركضة الحصان كأنهم خيول عربية أصيلة في ميدان سباق، والخطو الجانبي كأنهم فرسان يستعدون، ويتعرفون حب العمانيين للخيل واهتمامهم بها (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الحركة المناسبة لمحطة المقعد السويدي؟\nالإجابة: الخطو الجانبي بجانب المقعد.\nس2 (مستوى التطبيق): ما الحركة التي أديناها فوق الحبال؟\nالإجابة: ركضة الحصان.\nس3 (مستوى الاستدلال): لماذا لا نؤدي الخطو الجانبي فوق الحبال؟\nالإجابة: لأن الحبال تحتاج إلى وثبة، والخطو الجانبي لا وثب فيه.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.\n\nس4 (مستوى المعرفة): ماذا تفعل مجموعة الأحمر عند رفع العلم الأحمر؟\nالإجابة: تهرب بالخطو الجانبي.\nس5 (مستوى التطبيق): بأي حركة طاردت المجموعة الأخرى؟\nالإجابة: بركضة الحصان.\nس6 (مستوى الاستدلال): أي الحركتين أسرع في المطاردة؟\nالإجابة: ركضة الحصان.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين وحركة كل منهما.\nالإجابة: الأقماع: خطو جانبي، الحبال: ركضة الحصان.\nس2 (مستوى التطبيق): أدِّ مسار التتابع كاملًا.\nالإجابة: يؤدي الخطو الجانبي ثم ركضة الحصان.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك اليوم؟\nالإجابة: سجل الأداء وشجعنا ونظم الدور.\n\nس4 (مستوى المعرفة): اذكر لعبة ابتكرتها مجموعتك اليوم.\nالإجابة: يذكر اللعبة وحركاتها.\nس5 (مستوى التطبيق): متى نستخدم الخطو الجانبي في الألعاب؟\nالإجابة: للمراوغة والدفاع وتغيير الاتجاه جانبًا.\nس6 (مستوى الاستدلال): كيف شعرت في لعبة الأعلام ولماذا؟\nالإجابة: يعبر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك محطتين في المنزل (ممر للخطو الجانبي، وسادة منخفضة لركضة الحصان) (دليل المعلم ص 65-66).\nإرشاد لولي الأمر: العب مع طفلك لعبة الأعلام (الأحمر خطو جانبي، الأخضر ركضة حصان) في مكان آمن (دليل المعلم ص 67).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة الخطو الجانبي ونقاطها الفنية (5 دقائق)\n2. يؤدي الخطو الجانبي لليمين واليسار بإيقاع منتظم (10 دقائق)\n3. يميز بين الخطو الجانبي والمشي الأمامي (5 دقائق)\n4. يتعرف حركة ركضة الحصان وتسلسلها (خطوة، وثبة، خطوة) (5 دقائق)\n5. يؤدي ركضة الحصان بإيقاع صحيح مع الهبوط على قدم الارتقاء (10 دقائق)\n6. يحافظ على الإيقاع والاتزان أثناء الأداء (5 دقائق)\n\nالحصة 2:\n1. يؤدي الخطو الجانبي وركضة الحصان في مسارات ومحطات مختلفة (10 دقائق)\n2. يميز متى يستخدم كل حركة حسب المحطة (10 دقائق)\n3. يتعاون مع مجموعته في تنفيذ المحطات (5 دقائق)\n4. يوظف الخطو الجانبي وركضة الحصان في الألعاب الرياضية (5 دقائق)\n5. يطبق قواعد اللعبة وإشارات المعلم أثناء اللعب (5 دقائق)\n6. يستمتع بمشاركة زملائه ألعاب الخطو الجانبي وركضة الحصان (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: شريط لاصق\n- أخرى: أعلام (أحمر وأخضر)\n- أخرى: كرات متوسطة", "المفاهيم": "الحصة 1:\n- الخطو الجانبي\n- الاتجاه\n- الإيقاع\n- الجانب الأيمن والأيسر\n- ركضة الحصان\n- قدم الارتقاء\n- الخطوة والوثبة\n\nالحصة 2:\n- الخطو الجانبي\n- ركضة الحصان\n- المحطات\n- المسار\n- الإشارة\n- اللعبة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيتحرك المعلم جانبًا كلاعب كرة سلة يدافع ويسأل: كيف تحركت؟ هل مشيت للأمام؟ ويعرض صورة حارس المرمى يتحرك جانبًا.\n\nالحصة 2:\nيراجع المعلم الحركتين بنموذج تلميذين، ثم يعرض المحطات ويسأل: أي حركة تناسب كل محطة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري خفيف ثم تحريك الرجلين جانبًا من الوقوف، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الخطو الجانبي: وقوف، الركبتان منثنيتان قليلًا، نقل القدم اليمنى جانبًا ثم ضم اليسرى إليها دون تقاطع، والذراعان للاتزان (ص 61-62)، بالعد ثم بالإيقاع المتصل، ثم للجهة الأخرى، ويؤدي التلميذ الخطو الجانبي بالعد ثم بالإيقاع لليمين واليسار (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 63: خطو جانبي على خط مستقيم ثم بين الأقماع؛ يجرب التلميذ ضم القدمين بشكل ملاصق ثم بمسافة ويكتشف أي الطريقتين أسرع وأثبت، ويستنتج أهمية عدم تقاطع القدمين، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (المرآة الجانبية): في أزواج متقابلين، يتحرك أحدهما جانبًا ويتبعه الآخر كالمرآة بسرعات مختلفة، ويلعب التلميذ ويتابع زميله (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج بالعد: (1) وقوف وانثناء الركبتين وميل الجذع، (2) خطوة للأمام مع بقاء قدم أمام الأخرى، (3) ارتقاء عاليًا بالقدم الأمامية والهبوط عليها، ثم تتابع الحركة (ص 62)، فتطبيق موجه ثم مستقل في مسار الأقماع، ويؤدي التلميذ بالعد ثم بالإيقاع المتصل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. في أزواج بأدوار: يراقب أحدهما قدم الهبوط لزميله ويقول (صح/أعد)، ثم يتبادلان، ثم يؤديان ركضة الحصان جنبًا إلى جنب بإيقاع واحد، ويراقب التلميذ ويصحح ويؤدي بالتوافق (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (سباق الخيول): قطارات، يؤدي كل تلميذ ركضة الحصان حتى القمع والعودة بالجري، وتفوز المجموعة الأدق إيقاعًا، ويتسابق التلميذ بالإيقاع الصحيح (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وإطالة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم يشمل الحركتين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المحطات: خطو جانبي بين الأقماع ذهابًا وإيابًا، ركضة الحصان فوق الحبال المنخفضة، خطو جانبي بجانب المقعد، ركضة الحصان في المسار المنحني، ويشاهد التلميذ ويحدد الحركة المناسبة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 و4 ص 65-66: أربع مجموعات بقائد تؤدي المحطات بالتبادل، ويسجل القائد الأداء الصحيح، ويؤدي التلميذ الحركة الصحيحة في كل محطة ويبدل بنظام (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تتابع: مسار يجمع الحركتين (خطو جانبي للقمع، ركضة حصان للعودة)، ويتسابق التلميذ بدقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 5 (ألعاب الخطو الجانبي وركضة الحصان) ص 67: ساحة مقسمة نصفين ومجموعتان بلونين، يرفع المعلم العلم الأحمر فتهرب مجموعة الأحمر بالخطو الجانبي وتطاردها الأخرى بركضة الحصان حتى الخط، وتحسب نقاط اللمس، ثم التبادل، ويلعب التلميذ مستجيبًا للعلم بالحركة الصحيحة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. في مجموعات، تبتكر كل مجموعة لعبة قصيرة تستخدم الحركتين بالكرة وتعرضها على الصف، ويبتكر التلميذ مع مجموعته ويعرض (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يسأل المعلم: لماذا كانت ركضة الحصان أسرع في المطاردة والخطو الجانبي أفضل في المراوغة؟ ليستنتج التلاميذ استخدام كل حركة، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – ميدان الخيل العربية: يؤدي الأزواج ركضة الحصان كأنهم خيول عربية أصيلة في ميدان سباق، والخطو الجانبي كأنهم فرسان يستعدون، ويتعرفون حب العمانيين للخيل واهتمامهم بها (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): في الخطو الجانبي، هل تتقاطع القدمان؟\nالإجابة: لا، تنتقل قدم جانبًا وتضم إليها الأخرى.\nس2 (مستوى التطبيق): أين تكون الركبتان أثناء الخطو الجانبي؟\nالإجابة: منثنيتين قليلًا.\nس3 (مستوى الاستدلال): اذكر لعبة يستخدم فيها اللاعب الخطو الجانبي.\nالإجابة: كرة السلة (الدفاع) أو حارس المرمى.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.\n\nس4 (مستوى المعرفة): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة ثم وثبة ثم خطوة.\nس5 (مستوى التطبيق): على أي قدم نهبط بعد الوثبة؟\nالإجابة: على قدم الارتقاء نفسها.\nس6 (مستوى الاستدلال): لماذا نميل الجذع قليلًا للأمام؟\nالإجابة: للاندفاع والاتزان أثناء الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.\n\nالحصة 2:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما الحركة المناسبة لمحطة المقعد السويدي؟\nالإجابة: الخطو الجانبي بجانب المقعد.\nس2 (مستوى التطبيق): ما الحركة التي أديناها فوق الحبال؟\nالإجابة: ركضة الحصان.\nس3 (مستوى الاستدلال): لماذا لا نؤدي الخطو الجانبي فوق الحبال؟\nالإجابة: لأن الحبال تحتاج إلى وثبة، والخطو الجانبي لا وثب فيه.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.\n\nس4 (مستوى المعرفة): ماذا تفعل مجموعة الأحمر عند رفع العلم الأحمر؟\nالإجابة: تهرب بالخطو الجانبي.\nس5 (مستوى التطبيق): بأي حركة طاردت المجموعة الأخرى؟\nالإجابة: بركضة الحصان.\nس6 (مستوى الاستدلال): أي الحركتين أسرع في المطاردة؟\nالإجابة: ركضة الحصان.\n\n• نشاط علاجي (لمن لم يتقن): يخطو المعلم مع التلميذ جانبًا على خط مرسوم ببطء دون تقاطع القدمين والركبتان منثنيتان، ثم يطلب منه الخطو جانبًا لليمين ثم لليسار وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء ركضة الحصان (خطوة، وثبة، خطوة) في مسار منحنٍ، ثم الخطو الجانبي بين أقماع مثل مدافع كرة السلة مع إيقاع منتظم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ خطوًا جانبيًا لليمين 5 خطوات ثم لليسار.\nالإجابة: يؤديه دون تقاطع القدمين.\nس2 (مستوى التطبيق): ما الفرق بين الخطو الجانبي والمشي الأمامي؟\nالإجابة: الخطو الجانبي يتحرك فيه الجسم جانبًا والقدمان متوازيتان، والمشي يتحرك للأمام بتبادل القدمين.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين في الخطو الجانبي؟\nالإجابة: للاتزان وسرعة تغيير الاتجاه.\n\nس4 (مستوى المعرفة): أدِّ ركضة الحصان حتى القمع.\nالإجابة: يؤديها بالتسلسل الصحيح.\nس5 (مستوى التطبيق): ما الفرق بين ركضة الحصان والجري العادي؟\nالإجابة: ركضة الحصان تمزج الجري بالوثب والهبوط على القدم نفسها، والجري تبادل القدمين.\nس6 (مستوى الاستدلال): زميلك يهبط على القدم الأخرى بعد الوثبة، ماذا تقول له؟\nالإجابة: اهبط على قدم الارتقاء نفسها ثم خذ الخطوة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين وحركة كل منهما.\nالإجابة: الأقماع: خطو جانبي، الحبال: ركضة الحصان.\nس2 (مستوى التطبيق): أدِّ مسار التتابع كاملًا.\nالإجابة: يؤدي الخطو الجانبي ثم ركضة الحصان.\nس3 (مستوى الاستدلال): كيف ساعد القائد مجموعتك اليوم؟\nالإجابة: سجل الأداء وشجعنا ونظم الدور.\n\nس4 (مستوى المعرفة): اذكر لعبة ابتكرتها مجموعتك اليوم.\nالإجابة: يذكر اللعبة وحركاتها.\nس5 (مستوى التطبيق): متى نستخدم الخطو الجانبي في الألعاب؟\nالإجابة: للمراوغة والدفاع وتغيير الاتجاه جانبًا.\nس6 (مستوى الاستدلال): كيف شعرت في لعبة الأعلام ولماذا؟\nالإجابة: يعبر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الخطو الجانبي في الممر 5 خطوات لكل جهة (دليل المعلم ص 61-63).\nإرشاد لولي الأمر: شجع طفلك على أداء ركضة الحصان في ساحة آمنة مع العد (خطوة، وثبة، خطوة) (دليل المعلم ص 62-64).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6\n\nالحصة 2:\nإرشاد لولي الأمر: ابنِ مع طفلك محطتين في المنزل (ممر للخطو الجانبي، وسادة منخفضة لركضة الحصان) (دليل المعلم ص 65-66).\nإرشاد لولي الأمر: العب مع طفلك لعبة الأعلام (الأحمر خطو جانبي، الأخضر ركضة حصان) في مكان آمن (دليل المعلم ص 67).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=6"}}, {"title": "تبادل الخطو والحجل", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 68-74", "n": 1, "periods": [{"focus": "تبادل الخطو والحجل (الخطوة والحجلة) + محطات وألعاب تبادل الخطو والحجل", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة تبادل الخطو والحجل ونقاطها الفنية (5 دقائق)\n2. يؤدي خطوة ثم حجلة بالتبادل مع رفع الركبة ومرجحة الذراعين (10 دقائق)\n3. يحافظ على الإيقاع (خطوة، حجلة) في مسار مستقيم (5 دقائق)\n4. يؤدي تبادل الخطو والحجل في مسارات متنوعة (مستقيم، متعرج، فوق حواجز منخفضة) (10 دقائق)\n5. يوظف الحركة في ألعاب ومسابقات (5 دقائق)\n6. يعبر عن سعادته بمشاركة زملائه الألعاب (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة", "المفاهيم": "- تبادل الخطو والحجل\n- قدم الارتقاء\n- الإيقاع\n- مرجحة الذراعين\n- المسار\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يتذكر الحجل؟ ثم يؤدي خطوة ثم حجلة ويسأل: ماذا أضفت إلى الحجل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، حجل بالقدمين بالتبادل، مرجحة الذراعين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج بالعد: (1) وقوف والنظر للأمام، (2) خطوة للأمام، (3) حجلة بالقدم التي انتهت بها الخطوة مع رفع الركبة الأخرى، (4) الهبوط على قدم الارتقاء ثم خطوة بالأخرى وتكرار، مع مرجحة الذراعين عكس الرجلين (ص 69)، ثم تطبيق موجه فمستقل، ويؤدي التلميذ بالعد ثم بالإيقاع في المسار (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 70: أطواق متباعدة في مسار؛ يجرب التلميذ الحركة بمسافات مختلفة بين الأطواق ويكتشف أن رفع الركبة ومرجحة الذراعين يزيدان طول الحجلة، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في أزواج متجاورين، يؤديان الحركة بإيقاع واحد مع العد الجماعي (خطوة، حجلة)، ويتبادل الزميلان ملاحظة رفع الركبة، ويؤدي التلميذ بالتوافق ويلاحظ (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3 (محطات) ص 72: محطة المسار المستقيم، محطة المسار المتعرج بين الأقماع، محطة الحواجز المنخفضة (الحجلة فوق الحاجز)، محطة الأطواق المتباعدة، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ الحركة في كل محطة ويبدل بنظام (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 5 (ألعاب تبادل الخطو والحجل) ص 74: ساحة بثلاث مناطق وأقماع في الأولى والثالثة، مجموعتان متقابلتان تتسابقان في نقل الأقماع بتبادل الخطو والحجل، وتفوز الأسرع بالأداء الصحيح، ويتسابق التلميذ بالحركة الصحيحة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا استُبعدت بعض الأقماع؟ ليستنتج التلاميذ أن الحركة الصحيحة شرط لاحتساب النقطة، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – إيقاع الفنون الشعبية: يقف الطلبة في دائرة ويؤدون خطوة ثم حجلة على تصفيق المجموعة بإيقاع يشبه إيقاع الفنون الشعبية العمانية في الأعياد، ويتناوبون قيادة الإيقاع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): بأي قدم نحجل بعد الخطوة؟\nالإجابة: بالقدم التي انتهت بها الخطوة.\nس2 (مستوى التطبيق): ماذا نفعل بالركبة الأخرى أثناء الحجلة؟\nالإجابة: نرفعها لأعلى.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الحركة؟\nالإجابة: بالتبادل عكس حركة الرجلين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الحركة ببطء مع النداء «خطوة… حجلة» على خط مستقيم، مع رفع الركبة الأخرى، ثم يسأله: بأي قدم نحجل بعد الخطوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء تبادل الخطو والحجل في مسار متعرج بين أقماع مع مرجحة الذراعين بالتبادل والمحافظة على الإيقاع.\n\nس4 (مستوى المعرفة): في أي محطة حجلنا فوق الحاجز؟\nالإجابة: محطة الحواجز المنخفضة.\nس5 (مستوى التطبيق): ماذا كان شرط احتساب القمع في المسابقة؟\nالإجابة: أداء الحركة الصحيحة (خطوة، حجلة) أثناء النقل.\nس6 (مستوى الاستدلال): ما المسار الأصعب في المحطات ولماذا؟\nالإجابة: المتعرج لأنه يحتاج إلى تغيير الاتجاه مع الحفاظ على الإيقاع.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الحركة ببطء مع النداء «خطوة… حجلة» على خط مستقيم، مع رفع الركبة الأخرى، ثم يسأله: بأي قدم نحجل بعد الخطوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء تبادل الخطو والحجل في مسار متعرج بين أقماع مع مرجحة الذراعين بالتبادل والمحافظة على الإيقاع.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ خطوة وحجلة بالتبادل حتى القمع.\nالإجابة: يؤدي بالإيقاع الصحيح.\nس2 (مستوى التطبيق): ما الذي يجعل الحجلة أطول؟\nالإجابة: رفع الركبة ومرجحة الذراعين بقوة.\nس3 (مستوى الاستدلال): ما الفرق بين تبادل الخطو والحجل وركضة الحصان؟\nالإجابة: في تبادل الخطو والحجل نحجل ونهبط على القدم نفسها ثم نخطو بالأخرى، وفي ركضة الحصان خطوة ثم وثبة ثم خطوة.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المسار المستقيم والحواجز المنخفضة (أو المتعرج، الأطواق).\nس5 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجزين منخفضين.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس6 (مستوى الاستدلال): كيف شعرت عندما فازت مجموعتك أو خسرت؟\nالإجابة: يعبر بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على (خطوة، حجلة) بالعد في الممر مع مرجحة الذراعين (دليل المعلم ص 69-70).\nإرشاد لولي الأمر: شجع طفلك على لعبة نقل الأشياء بتبادل الخطو والحجل في البيت (دليل المعلم ص 72-74).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة تبادل الخطو والحجل ونقاطها الفنية (5 دقائق)\n2. يؤدي خطوة ثم حجلة بالتبادل مع رفع الركبة ومرجحة الذراعين (10 دقائق)\n3. يحافظ على الإيقاع (خطوة، حجلة) في مسار مستقيم (5 دقائق)\n4. يؤدي تبادل الخطو والحجل في مسارات متنوعة (مستقيم، متعرج، فوق حواجز منخفضة) (10 دقائق)\n5. يوظف الحركة في ألعاب ومسابقات (5 دقائق)\n6. يعبر عن سعادته بمشاركة زملائه الألعاب (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة", "المفاهيم": "الحصة 1:\n- تبادل الخطو والحجل\n- قدم الارتقاء\n- الإيقاع\n- مرجحة الذراعين\n- المسار\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: من يتذكر الحجل؟ ثم يؤدي خطوة ثم حجلة ويسأل: ماذا أضفت إلى الحجل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري، حجل بالقدمين بالتبادل، مرجحة الذراعين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج بالعد: (1) وقوف والنظر للأمام، (2) خطوة للأمام، (3) حجلة بالقدم التي انتهت بها الخطوة مع رفع الركبة الأخرى، (4) الهبوط على قدم الارتقاء ثم خطوة بالأخرى وتكرار، مع مرجحة الذراعين عكس الرجلين (ص 69)، ثم تطبيق موجه فمستقل، ويؤدي التلميذ بالعد ثم بالإيقاع في المسار (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 70: أطواق متباعدة في مسار؛ يجرب التلميذ الحركة بمسافات مختلفة بين الأطواق ويكتشف أن رفع الركبة ومرجحة الذراعين يزيدان طول الحجلة، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في أزواج متجاورين، يؤديان الحركة بإيقاع واحد مع العد الجماعي (خطوة، حجلة)، ويتبادل الزميلان ملاحظة رفع الركبة، ويؤدي التلميذ بالتوافق ويلاحظ (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3 (محطات) ص 72: محطة المسار المستقيم، محطة المسار المتعرج بين الأقماع، محطة الحواجز المنخفضة (الحجلة فوق الحاجز)، محطة الأطواق المتباعدة، بأربع مجموعات بقائد والتبديل، ويؤدي التلميذ الحركة في كل محطة ويبدل بنظام (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 5 (ألعاب تبادل الخطو والحجل) ص 74: ساحة بثلاث مناطق وأقماع في الأولى والثالثة، مجموعتان متقابلتان تتسابقان في نقل الأقماع بتبادل الخطو والحجل، وتفوز الأسرع بالأداء الصحيح، ويتسابق التلميذ بالحركة الصحيحة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا استُبعدت بعض الأقماع؟ ليستنتج التلاميذ أن الحركة الصحيحة شرط لاحتساب النقطة، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – إيقاع الفنون الشعبية: يقف الطلبة في دائرة ويؤدون خطوة ثم حجلة على تصفيق المجموعة بإيقاع يشبه إيقاع الفنون الشعبية العمانية في الأعياد، ويتناوبون قيادة الإيقاع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): بأي قدم نحجل بعد الخطوة؟\nالإجابة: بالقدم التي انتهت بها الخطوة.\nس2 (مستوى التطبيق): ماذا نفعل بالركبة الأخرى أثناء الحجلة؟\nالإجابة: نرفعها لأعلى.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الحركة؟\nالإجابة: بالتبادل عكس حركة الرجلين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الحركة ببطء مع النداء «خطوة… حجلة» على خط مستقيم، مع رفع الركبة الأخرى، ثم يسأله: بأي قدم نحجل بعد الخطوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء تبادل الخطو والحجل في مسار متعرج بين أقماع مع مرجحة الذراعين بالتبادل والمحافظة على الإيقاع.\n\nس4 (مستوى المعرفة): في أي محطة حجلنا فوق الحاجز؟\nالإجابة: محطة الحواجز المنخفضة.\nس5 (مستوى التطبيق): ماذا كان شرط احتساب القمع في المسابقة؟\nالإجابة: أداء الحركة الصحيحة (خطوة، حجلة) أثناء النقل.\nس6 (مستوى الاستدلال): ما المسار الأصعب في المحطات ولماذا؟\nالإجابة: المتعرج لأنه يحتاج إلى تغيير الاتجاه مع الحفاظ على الإيقاع.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الحركة ببطء مع النداء «خطوة… حجلة» على خط مستقيم، مع رفع الركبة الأخرى، ثم يسأله: بأي قدم نحجل بعد الخطوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء تبادل الخطو والحجل في مسار متعرج بين أقماع مع مرجحة الذراعين بالتبادل والمحافظة على الإيقاع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ خطوة وحجلة بالتبادل حتى القمع.\nالإجابة: يؤدي بالإيقاع الصحيح.\nس2 (مستوى التطبيق): ما الذي يجعل الحجلة أطول؟\nالإجابة: رفع الركبة ومرجحة الذراعين بقوة.\nس3 (مستوى الاستدلال): ما الفرق بين تبادل الخطو والحجل وركضة الحصان؟\nالإجابة: في تبادل الخطو والحجل نحجل ونهبط على القدم نفسها ثم نخطو بالأخرى، وفي ركضة الحصان خطوة ثم وثبة ثم خطوة.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المسار المستقيم والحواجز المنخفضة (أو المتعرج، الأطواق).\nس5 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجزين منخفضين.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس6 (مستوى الاستدلال): كيف شعرت عندما فازت مجموعتك أو خسرت؟\nالإجابة: يعبر بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على (خطوة، حجلة) بالعد في الممر مع مرجحة الذراعين (دليل المعلم ص 69-70).\nإرشاد لولي الأمر: شجع طفلك على لعبة نقل الأشياء بتبادل الخطو والحجل في البيت (دليل المعلم ص 72-74).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=7"}}, {"title": "اللف والدوران", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 75-82", "n": 1, "periods": [{"focus": "اللف والدوران في المكان ومن الحركة + محطات وألعاب اللف والدوران", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي اللف والدوران والفرق بينهما (5 دقائق)\n2. يؤدي لف الجذع والذراعين والدوران حول المحور الطولي (10 دقائق)\n3. يحافظ على اتزانه بعد الدوران (5 دقائق)\n4. يوظف اللف والدوران في محطات ومسابقات بالكرة (10 دقائق)\n5. يميز متى يستخدم اللف ومتى يستخدم الدوران في اللعبة (5 دقائق)\n6. يشعر بالسعادة عند مشاركة زملائه أنشطة اللف والدوران (5 دقائق)", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: مراتب\n- صورة توضيحية\n- أخرى: كرات متوسطة", "المفاهيم": "- اللف\n- الدوران\n- المحور الطولي\n- الاتزان\n- نصف دورة\n- التسليم\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "يلف المعلم جذعه يمينًا ويسارًا ثم يدور دورة كاملة ويسأل: ما الفرق بين الحركتين؟ ويعرض صورة لاعب دفع الجلة وهو يدور.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ثم لف الجذع والذراعين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: اللف (حركة جزء من الجسم حول محوره دون انتقال القاعدة: لف الجذع، دوران الذراع)، والدوران (حركة الجسم كله حول المحور الطولي مع تغيير القاعدة: نصف دورة، دورة كاملة من الوقوف ومن الوثب) مع الحفاظ على الاتزان (ص 76-77)، ثم تطبيق موجه، ويؤدي التلميذ اللف ثم الدوران نصف دورة فدورة كاملة ويثبت بعدها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 78: يجرب التلميذ الدوران بالذراعين مفتوحتين ثم مضمومتين ويكتشف أيهما أسرع، ويجرب الهبوط بثني الركبتين بعد الدوران من الوثب ويستنتج ما يحفظ الاتزان، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (البوصلة): ينادي المعلم (نصف دورة) أو (دورة) أو (لف يمين) ويؤدي التلاميذ الحركة ويثبتون، ويستجيب التلميذ بالحركة الصحيحة ويحافظ على الثبات (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محطات اللف والدوران ص 80-81: محطة تسليم الكرة للزميل بلف الجذع في القطار، محطة الدوران حول القمع ومتابعة الجري، محطة الدوران من الوثب على المرتبة، محطة لف الذراعين بالكرة حول الجسم، بأربع مجموعات والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 5 (ألعاب اللف والدوران) ص 82: قطارات على خط البداية، تمرر الكرة بلف الجذع من الأول حتى الأخير الذي يجري بها إلى المقدمة ويعيد التمرير، وتفوز المجموعة التي تعود إلى ترتيبها الأول أولًا، ويلعب التلميذ ويسلم الكرة بلف الجذع بدقة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا نلف الجذع ولا ندور بالكامل عند التسليم؟ ليستنتج التلاميذ أن اللف أسرع ويحفظ مكان القاعدة، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – دوران الرحى: يحكي المعلم أن الرحى حجر يدور لطحن الحبوب في البيوت العمانية القديمة، فتدور المجموعات حول نفسها كالرحى، ثم تقف ثابتة متزنة، والأثبت تفوز (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الفرق بين اللف والدوران؟\nالإجابة: اللف حركة جزء من الجسم حول محوره، والدوران حركة الجسم كله حول المحور الطولي.\nس2 (مستوى التطبيق): كيف نحافظ على اتزاننا بعد الدوران من الوثب؟\nالإجابة: بثني الركبتين عند الهبوط والنظر للأمام.\nس3 (مستوى الاستدلال): أيهما أسرع: الدوران والذراعان مضمومتان أم مفتوحتان؟\nالإجابة: مضمومتان.\n\n• نشاط علاجي (لمن لم يتقن): يلف المعلم مع التلميذ الجذع يمينًا ويسارًا ثم يدوران ببطء نصف دورة، والنظر للأمام وثني الركبتين للاتزان، ثم يسأله: ما الفرق بين اللف والدوران؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالدوران مرة والذراعان مضمومتان ومرة وهما مفتوحتان، ومقارنة السرعة، ثم أداء دوران من الوثب مع هبوط متزن.\n\nس4 (مستوى المعرفة): كيف سلمت الكرة للزميل خلفك؟\nالإجابة: بلف الجذع للجانب.\nس5 (مستوى التطبيق): في أي محطة دُرنا من الوثب؟\nالإجابة: محطة المرتبة.\nس6 (مستوى الاستدلال): لماذا اللف أسرع من الدوران في تسليم الكرة؟\nالإجابة: لأن القدمين تبقيان ثابتتين ولا نحتاج إلى تغيير مكان الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يلف المعلم مع التلميذ الجذع يمينًا ويسارًا ثم يدوران ببطء نصف دورة، والنظر للأمام وثني الركبتين للاتزان، ثم يسأله: ما الفرق بين اللف والدوران؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالدوران مرة والذراعان مضمومتان ومرة وهما مفتوحتان، ومقارنة السرعة، ثم أداء دوران من الوثب مع هبوط متزن.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ نصف دورة من الوقوف ثم اثبت.\nالإجابة: يدور 180 درجة ويثبت.\nس2 (مستوى التطبيق): اذكر مسابقة رياضية يستخدم فيها الدوران.\nالإجابة: دفع الجلة أو قذف القرص أو الجمباز.\nس3 (مستوى الاستدلال): أدِّ لفًا للجذع يمينًا ويسارًا من الوقوف فتحًا.\nالإجابة: يلف الجذع والقدمان ثابتتان.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: تسليم الكرة بلف الجذع، والدوران حول القمع (أو الوثب بالدوران، لف الذراعين).\nس5 (مستوى التطبيق): أدِّ دورة كاملة حول القمع ثم تابع الجري.\nالإجابة: يدور ويتابع دون سقوط.\nس6 (مستوى الاستدلال): كيف تساعد مجموعتك على الفوز في لعبة تسليم الكرة؟\nالإجابة: ألف جذعي بسرعة وأسلم الكرة بدقة دون إسقاطها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على نصف دورة ودورة كاملة من الوقوف مع الثبات بعدها (دليل المعلم ص 76-78).\nإرشاد لولي الأمر: العب مع طفلك تمرير الكرة بلف الجذع في قطار من أفراد الأسرة (دليل المعلم ص 80-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي اللف والدوران والفرق بينهما (5 دقائق)\n2. يؤدي لف الجذع والذراعين والدوران حول المحور الطولي (10 دقائق)\n3. يحافظ على اتزانه بعد الدوران (5 دقائق)\n4. يوظف اللف والدوران في محطات ومسابقات بالكرة (10 دقائق)\n5. يميز متى يستخدم اللف ومتى يستخدم الدوران في اللعبة (5 دقائق)\n6. يشعر بالسعادة عند مشاركة زملائه أنشطة اللف والدوران (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: مراتب\n- صورة توضيحية\n- أخرى: كرات متوسطة", "المفاهيم": "الحصة 1:\n- اللف\n- الدوران\n- المحور الطولي\n- الاتزان\n- نصف دورة\n- التسليم\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيلف المعلم جذعه يمينًا ويسارًا ثم يدور دورة كاملة ويسأل: ما الفرق بين الحركتين؟ ويعرض صورة لاعب دفع الجلة وهو يدور.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري ثم لف الجذع والذراعين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: اللف (حركة جزء من الجسم حول محوره دون انتقال القاعدة: لف الجذع، دوران الذراع)، والدوران (حركة الجسم كله حول المحور الطولي مع تغيير القاعدة: نصف دورة، دورة كاملة من الوقوف ومن الوثب) مع الحفاظ على الاتزان (ص 76-77)، ثم تطبيق موجه، ويؤدي التلميذ اللف ثم الدوران نصف دورة فدورة كاملة ويثبت بعدها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 78: يجرب التلميذ الدوران بالذراعين مفتوحتين ثم مضمومتين ويكتشف أيهما أسرع، ويجرب الهبوط بثني الركبتين بعد الدوران من الوثب ويستنتج ما يحفظ الاتزان، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (البوصلة): ينادي المعلم (نصف دورة) أو (دورة) أو (لف يمين) ويؤدي التلاميذ الحركة ويثبتون، ويستجيب التلميذ بالحركة الصحيحة ويحافظ على الثبات (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محطات اللف والدوران ص 80-81: محطة تسليم الكرة للزميل بلف الجذع في القطار، محطة الدوران حول القمع ومتابعة الجري، محطة الدوران من الوثب على المرتبة، محطة لف الذراعين بالكرة حول الجسم، بأربع مجموعات والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 5 (ألعاب اللف والدوران) ص 82: قطارات على خط البداية، تمرر الكرة بلف الجذع من الأول حتى الأخير الذي يجري بها إلى المقدمة ويعيد التمرير، وتفوز المجموعة التي تعود إلى ترتيبها الأول أولًا، ويلعب التلميذ ويسلم الكرة بلف الجذع بدقة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا نلف الجذع ولا ندور بالكامل عند التسليم؟ ليستنتج التلاميذ أن اللف أسرع ويحفظ مكان القاعدة، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – دوران الرحى: يحكي المعلم أن الرحى حجر يدور لطحن الحبوب في البيوت العمانية القديمة، فتدور المجموعات حول نفسها كالرحى، ثم تقف ثابتة متزنة، والأثبت تفوز (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما الفرق بين اللف والدوران؟\nالإجابة: اللف حركة جزء من الجسم حول محوره، والدوران حركة الجسم كله حول المحور الطولي.\nس2 (مستوى التطبيق): كيف نحافظ على اتزاننا بعد الدوران من الوثب؟\nالإجابة: بثني الركبتين عند الهبوط والنظر للأمام.\nس3 (مستوى الاستدلال): أيهما أسرع: الدوران والذراعان مضمومتان أم مفتوحتان؟\nالإجابة: مضمومتان.\n\n• نشاط علاجي (لمن لم يتقن): يلف المعلم مع التلميذ الجذع يمينًا ويسارًا ثم يدوران ببطء نصف دورة، والنظر للأمام وثني الركبتين للاتزان، ثم يسأله: ما الفرق بين اللف والدوران؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالدوران مرة والذراعان مضمومتان ومرة وهما مفتوحتان، ومقارنة السرعة، ثم أداء دوران من الوثب مع هبوط متزن.\n\nس4 (مستوى المعرفة): كيف سلمت الكرة للزميل خلفك؟\nالإجابة: بلف الجذع للجانب.\nس5 (مستوى التطبيق): في أي محطة دُرنا من الوثب؟\nالإجابة: محطة المرتبة.\nس6 (مستوى الاستدلال): لماذا اللف أسرع من الدوران في تسليم الكرة؟\nالإجابة: لأن القدمين تبقيان ثابتتين ولا نحتاج إلى تغيير مكان الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يلف المعلم مع التلميذ الجذع يمينًا ويسارًا ثم يدوران ببطء نصف دورة، والنظر للأمام وثني الركبتين للاتزان، ثم يسأله: ما الفرق بين اللف والدوران؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالدوران مرة والذراعان مضمومتان ومرة وهما مفتوحتان، ومقارنة السرعة، ثم أداء دوران من الوثب مع هبوط متزن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ نصف دورة من الوقوف ثم اثبت.\nالإجابة: يدور 180 درجة ويثبت.\nس2 (مستوى التطبيق): اذكر مسابقة رياضية يستخدم فيها الدوران.\nالإجابة: دفع الجلة أو قذف القرص أو الجمباز.\nس3 (مستوى الاستدلال): أدِّ لفًا للجذع يمينًا ويسارًا من الوقوف فتحًا.\nالإجابة: يلف الجذع والقدمان ثابتتان.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: تسليم الكرة بلف الجذع، والدوران حول القمع (أو الوثب بالدوران، لف الذراعين).\nس5 (مستوى التطبيق): أدِّ دورة كاملة حول القمع ثم تابع الجري.\nالإجابة: يدور ويتابع دون سقوط.\nس6 (مستوى الاستدلال): كيف تساعد مجموعتك على الفوز في لعبة تسليم الكرة؟\nالإجابة: ألف جذعي بسرعة وأسلم الكرة بدقة دون إسقاطها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على نصف دورة ودورة كاملة من الوقوف مع الثبات بعدها (دليل المعلم ص 76-78).\nإرشاد لولي الأمر: العب مع طفلك تمرير الكرة بلف الجذع في قطار من أفراد الأسرة (دليل المعلم ص 80-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=8"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "العاشر", "date": "8-12/11/2026", "pages": "دليل المعلم ص 24-28", "n": 1, "periods": [{"focus": "الممارسات الصحية: نظافة الملعب والأدوات والزي والحذاء الرياضي + المهرجان الرياضي التعليمي للحركات الأساسية (الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران)", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية نظافة الملعب والأدوات الرياضية (10 دقائق)\n2. يختار الحذاء والزي الرياضي المناسب للحصة (5 دقائق)\n3. يطبق سلوكيات المحافظة على نظافة الملعب والأدوات (5 دقائق)\n4. يوظف الحركات الأساسية التي تعلمها في أقسام المهرجان (10 دقائق)\n5. يطبق قواعد الأقسام والالتزام بالدور (5 دقائق)\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: أدوات رياضية\n- أخرى: سلة نفايات\n- أخرى: بطاقات مصورة لأحذية وملابس\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة\n- أخرى: لوحة نقاط", "المفاهيم": "- النظافة\n- الأدوات الرياضية\n- الحذاء الرياضي\n- الزي الرياضي\n- العهدة\n- المهرجان الرياضي التعليمي\n- الحركات الأساسية\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم كرة متسخة وأخرى نظيفة ويسأل: بأيهما تحب أن تلعب؟ ثم يعرض صور أحذية مختلفة ويسأل: أيها يناسب الجري؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم بالصور أهمية نظافة الملعب (خلوه من الحجارة والزجاج)، ونظافة الأدوات، واختيار الحذاء الرياضي (نعل مرن ورباط محكم) والزي القطني، مع نموذج ربط الحذاء، ويستمع التلميذ ويربط حذاءه بالطريقة الصحيحة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (فريق النظافة): مجموعات تجمع (بطاقات أشياء) من الساحة وتصنفها: ما يبقى (أدوات) وما يُرمى في السلة (نفايات)، وتفوز الأسرع والأدق، ويلعب التلميذ ويصنف (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تضع كل مجموعة ثلاث قواعد للمحافظة على الأدوات (إعادتها لمكانها، عدم الجلوس على الكرات) وتعرضها، والتلاميذ يتعاون ويعرض القواعد (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم الخطو الجانبي (بين الأقماع ذهابًا وإيابًا)، قسم ركضة الحصان (فوق الحبال)، قسم تبادل الخطو والحجل (فوق الحواجز المنخفضة)، قسم اللف والدوران (تسليم الكرة بلف الجذع والدوران حول القمع)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته بقيادة القائد (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: تتابع يجمع الحركات الأربع، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم المشاركين، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. غلق الدرس (نشاط ممتع مع المواطنة) – حماة ساحتنا: تتسابق المجموعات في ترتيب الأدوات وجمع المخلفات من الملعب، ويربط المعلم ذلك بحملات تنظيف الشواطئ والأودية التي يشارك فيها العمانيون حبًا لبلدهم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): لماذا نتأكد من نظافة الملعب قبل اللعب؟\nالإجابة: حتى لا نتعثر بالحجارة أو نصاب بالزجاج.\nس2 (مستوى التطبيق): ما مواصفات الحذاء الرياضي المناسب؟\nالإجابة: نعل مرن ورباط محكم ومقاس مناسب.\nس3 (مستوى الاستدلال): ماذا نفعل بالأدوات بعد الحصة؟\nالإجابة: نعيدها نظيفة إلى مكانها.\n\n• نشاط علاجي (لمن لم يتقن): يتفقد المعلم مع التلميذ أرض الملعب ويجمعان ما فيها من حجارة أو أوراق، ويختاران معًا حذاءً رياضيًا مناسبًا من صور، ثم يسأله: لماذا نتأكد من نظافة الملعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مرسومة لمواصفات الحذاء والزي الرياضي المناسب، وتنظيم إعادة الأدوات نظيفة إلى أماكنها بعد الحصة.\n\nس4 (مستوى المعرفة): ما الحركات الأربع في مهرجان اليوم؟\nالإجابة: الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران.\nس5 (مستوى التطبيق): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم ركضة الحصان.\nس6 (مستوى الاستدلال): ما القاعدة عند الانتقال بين الأقسام؟\nالإجابة: الانتقال بنظام عند الإشارة بقيادة القائد.\n\n• نشاط علاجي (لمن لم يتقن): يتفقد المعلم مع التلميذ أرض الملعب ويجمعان ما فيها من حجارة أو أوراق، ويختاران معًا حذاءً رياضيًا مناسبًا من صور، ثم يسأله: لماذا نتأكد من نظافة الملعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مرسومة لمواصفات الحذاء والزي الرياضي المناسب، وتنظيم إعادة الأدوات نظيفة إلى أماكنها بعد الحصة.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة حذاء بكعب عالٍ، أيناسب الحصة؟\nالإجابة: لا، لأنه يسبب السقوط والإصابة.\nس2 (مستوى التطبيق): اذكر قاعدة وضعتها مجموعتك للمحافظة على الأدوات.\nالإجابة: مثل: لا نجلس على الكرات.\nس3 (مستوى الاستدلال): كيف تساعد في نظافة الملعب؟\nالإجابة: أرمي النفايات في السلة وأبلغ المعلم عن أي شيء خطر.\n\nس4 (مستوى المعرفة): اذكر القسم الذي أحببته أكثر ولماذا.\nالإجابة: يذكر القسم ويعلل.\nس5 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجز منخفض.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس6 (مستوى الاستدلال): ماذا تقول لزميل لم يلتزم بدوره في القسم؟\nالإجابة: أذكره بلطف أن ننتظر دورنا حتى نلعب بأمان ونظام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تأكد من مناسبة حذاء طفلك الرياضي ونظافة زيه، وذكّره بإعادة أدواته إلى مكانها (برنامج صحتي، دليل المعلم ص 26).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا الحركات الأساسية في مكان آمن (دليل المعلم ص 60-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية نظافة الملعب والأدوات الرياضية (10 دقائق)\n2. يختار الحذاء والزي الرياضي المناسب للحصة (5 دقائق)\n3. يطبق سلوكيات المحافظة على نظافة الملعب والأدوات (5 دقائق)\n4. يوظف الحركات الأساسية التي تعلمها في أقسام المهرجان (10 دقائق)\n5. يطبق قواعد الأقسام والالتزام بالدور (5 دقائق)\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: أدوات رياضية\n- أخرى: سلة نفايات\n- أخرى: بطاقات مصورة لأحذية وملابس\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- النظافة\n- الأدوات الرياضية\n- الحذاء الرياضي\n- الزي الرياضي\n- العهدة\n- المهرجان الرياضي التعليمي\n- الحركات الأساسية\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم كرة متسخة وأخرى نظيفة ويسأل: بأيهما تحب أن تلعب؟ ثم يعرض صور أحذية مختلفة ويسأل: أيها يناسب الجري؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم بالصور أهمية نظافة الملعب (خلوه من الحجارة والزجاج)، ونظافة الأدوات، واختيار الحذاء الرياضي (نعل مرن ورباط محكم) والزي القطني، مع نموذج ربط الحذاء، ويستمع التلميذ ويربط حذاءه بالطريقة الصحيحة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (فريق النظافة): مجموعات تجمع (بطاقات أشياء) من الساحة وتصنفها: ما يبقى (أدوات) وما يُرمى في السلة (نفايات)، وتفوز الأسرع والأدق، ويلعب التلميذ ويصنف (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تضع كل مجموعة ثلاث قواعد للمحافظة على الأدوات (إعادتها لمكانها، عدم الجلوس على الكرات) وتعرضها، والتلاميذ يتعاون ويعرض القواعد (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم الخطو الجانبي (بين الأقماع ذهابًا وإيابًا)، قسم ركضة الحصان (فوق الحبال)، قسم تبادل الخطو والحجل (فوق الحواجز المنخفضة)، قسم اللف والدوران (تسليم الكرة بلف الجذع والدوران حول القمع)، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته بقيادة القائد (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ختامية: تتابع يجمع الحركات الأربع، ويتسابق التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم المشاركين، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. غلق الدرس (نشاط ممتع مع المواطنة) – حماة ساحتنا: تتسابق المجموعات في ترتيب الأدوات وجمع المخلفات من الملعب، ويربط المعلم ذلك بحملات تنظيف الشواطئ والأودية التي يشارك فيها العمانيون حبًا لبلدهم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): لماذا نتأكد من نظافة الملعب قبل اللعب؟\nالإجابة: حتى لا نتعثر بالحجارة أو نصاب بالزجاج.\nس2 (مستوى التطبيق): ما مواصفات الحذاء الرياضي المناسب؟\nالإجابة: نعل مرن ورباط محكم ومقاس مناسب.\nس3 (مستوى الاستدلال): ماذا نفعل بالأدوات بعد الحصة؟\nالإجابة: نعيدها نظيفة إلى مكانها.\n\n• نشاط علاجي (لمن لم يتقن): يتفقد المعلم مع التلميذ أرض الملعب ويجمعان ما فيها من حجارة أو أوراق، ويختاران معًا حذاءً رياضيًا مناسبًا من صور، ثم يسأله: لماذا نتأكد من نظافة الملعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مرسومة لمواصفات الحذاء والزي الرياضي المناسب، وتنظيم إعادة الأدوات نظيفة إلى أماكنها بعد الحصة.\n\nس4 (مستوى المعرفة): ما الحركات الأربع في مهرجان اليوم؟\nالإجابة: الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران.\nس5 (مستوى التطبيق): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم ركضة الحصان.\nس6 (مستوى الاستدلال): ما القاعدة عند الانتقال بين الأقسام؟\nالإجابة: الانتقال بنظام عند الإشارة بقيادة القائد.\n\n• نشاط علاجي (لمن لم يتقن): يتفقد المعلم مع التلميذ أرض الملعب ويجمعان ما فيها من حجارة أو أوراق، ويختاران معًا حذاءً رياضيًا مناسبًا من صور، ثم يسأله: لماذا نتأكد من نظافة الملعب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مرسومة لمواصفات الحذاء والزي الرياضي المناسب، وتنظيم إعادة الأدوات نظيفة إلى أماكنها بعد الحصة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة حذاء بكعب عالٍ، أيناسب الحصة؟\nالإجابة: لا، لأنه يسبب السقوط والإصابة.\nس2 (مستوى التطبيق): اذكر قاعدة وضعتها مجموعتك للمحافظة على الأدوات.\nالإجابة: مثل: لا نجلس على الكرات.\nس3 (مستوى الاستدلال): كيف تساعد في نظافة الملعب؟\nالإجابة: أرمي النفايات في السلة وأبلغ المعلم عن أي شيء خطر.\n\nس4 (مستوى المعرفة): اذكر القسم الذي أحببته أكثر ولماذا.\nالإجابة: يذكر القسم ويعلل.\nس5 (مستوى التطبيق): أدِّ تبادل الخطو والحجل فوق حاجز منخفض.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس6 (مستوى الاستدلال): ماذا تقول لزميل لم يلتزم بدوره في القسم؟\nالإجابة: أذكره بلطف أن ننتظر دورنا حتى نلعب بأمان ونظام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من مناسبة حذاء طفلك الرياضي ونظافة زيه، وذكّره بإعادة أدواته إلى مكانها (برنامج صحتي، دليل المعلم ص 26).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا الحركات الأساسية في مكان آمن (دليل المعلم ص 60-82).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=9"}}, {"title": "تنطيط الكرة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الحادي عشر", "date": "15-19/11/2026", "pages": "دليل المعلم ص 86-92", "n": 1, "periods": [{"focus": "تنطيط الكرة في المكان باليد اليمنى واليسرى + تنطيط الكرة من الحركة وألعاب التنطيط", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة تنطيط الكرة ونقاطها الفنية (5 دقائق)\n2. يؤدي تنطيط الكرة في المكان باليدين بالتبادل والنظر للأمام (10 دقائق)\n3. يميز بين دفع الكرة بالأصابع وضربها براحة اليد (5 دقائق)\n4. يؤدي تنطيط الكرة أثناء المشي والجري في مسارات (10 دقائق)\n5. يوظف التنطيط في ألعاب ومسابقات (5 دقائق)\n6. يشعر بالسعادة والرضا عند مشاركة زملائه أنشطة التنطيط (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: شريط لاصق", "المفاهيم": "- التنطيط\n- التوافق\n- دفع الكرة\n- رسغ اليد\n- ارتداد الكرة\n- التنطيط من الحركة\n- المسار\n- المحافظة على الكرة\n- قطع الكرة", "التهيئة / التمهيد / التعلم القبلي": "ينطط المعلم كرة وهو ينظر للأمام ويسأل: كيف بقيت الكرة بجانبي دون أن تهرب؟ ويعرض صورة لاعب كرة سلة ينطط.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري بالكرة، رمي الكرة لأسفل والتقاطها، تحريك الرسغين، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف ورجل متقدمة، انثناء بسيط في الركبتين، ثني المرفق والرسغ ثم مدهما لدفع الكرة بالأصابع في مستوى الحوض أمام الجسم وجانبه، والنظر للأمام (ص 86-87)، مع تطبيق موجه: دفع والتقاط، ثم تنطيط متصل، ويؤدي التلميذ الدفع والالتقاط ثم التنطيط المتصل باليمنى ثم اليسرى (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 88: يجرب التلميذ التنطيط بضرب الكرة براحة اليد ثم بدفعها بالأصابع، وبالنظر إلى الكرة ثم للأمام، ويكتشف أيهما يحفظ الكرة أكثر، فيستنتج النقاط الفنية، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (العدّاد): من ينطط أكبر عدد دون فقد الكرة في 20 ثانية، ثم باليد الأخرى، ويلعب التلميذ ويعد (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: دفع الكرة قليلًا للأمام أثناء المشي ثم الجري الخفيف مع إبقائها بجانب الجسم، ثم تطبيق موجه على خط مستقيم فمتعرج، ويؤدي التلميذ التنطيط من المشي ثم الجري (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 3 و4 ص 90-91: محطات بأربع مجموعات: تنطيط على خط مستقيم، تنطيط متعرج بين الأقماع، تنطيط داخل مربع صغير، تنطيط مع تبادل اليدين، والتبديل، ويؤدي التلميذ مهمة المحطة ويبدل (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 5 (ألعاب تنطيط الكرة) ص 92: داخل مربع 15 م، ينطط كل تلميذ كرته ويحاول قطع كرات الآخرين مع المحافظة على كرته، ونقطة على من يفقد كرته، ويفوز الأقل نقاطًا، ويلعب التلميذ ويحافظ على كرته (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – طبول العيد: يصفق المعلم إيقاعًا يشبه طبول العيد، فينطط الطلبة الكرة على الإيقاع باليدين بالتبادل والنظر إلى الأمام، والمجموعة التي تحافظ على الإيقاع تفوز (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بأصابع اليد.\nس2 (مستوى التطبيق): في أي مستوى ننطط الكرة؟\nالإجابة: في مستوى الحوص (الحوض).\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء التنطيط؟\nالإجابة: لنرى الزملاء والملعب ولا نصطدم.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ كرة كبيرة في المكان بأصابع اليد في مستوى الحوض ببطء، مع العد حتى 5، ثم يسأله: بأي جزء من اليد ندفع الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنطيط الكرة أثناء المشي ثم الجري في مسار متعرج مع النظر للأمام وتبديل اليدين، وعدّ المرات دون فقد الكرة.\n\nس4 (مستوى المعرفة): إلى أين ندفع الكرة عند التنطيط أثناء المشي؟\nالإجابة: قليلًا للأمام بجانب الجسم.\nس5 (مستوى التطبيق): ما الهدف في لعبة المربع؟\nالإجابة: المحافظة على كرتي وقطع كرات الزملاء.\nس6 (مستوى الاستدلال): لماذا يصعب التنطيط في المسار المتعرج؟\nالإجابة: لأننا نغير الاتجاه فنحتاج إلى التحكم في الكرة باليدين.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ كرة كبيرة في المكان بأصابع اليد في مستوى الحوض ببطء، مع العد حتى 5، ثم يسأله: بأي جزء من اليد ندفع الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنطيط الكرة أثناء المشي ثم الجري في مسار متعرج مع النظر للأمام وتبديل اليدين، وعدّ المرات دون فقد الكرة.", "التقويم الختامي": "س1 (مستوى المعرفة): نطط الكرة 10 مرات باليد اليمنى ثم 10 باليسرى.\nالإجابة: يؤديها دون فقد الكرة.\nس2 (مستوى التطبيق): ما الفرق بين الدفع بالأصابع والضرب بالراحة؟\nالإجابة: الدفع بالأصابع يتحكم في الكرة، والضرب بالراحة يجعلها تهرب.\nس3 (مستوى الاستدلال): سمِّ ل الإجابة: لنرى الزملاء والملعب ولا نصطدم.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ كرة كبيرة في المكان بأصابع اليد في مستوى الحوض ببطء، مع العد حتى 5، ثم يسأله: بأي جزء من اليد ندفع الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنطيط الكرة أثناء المشي ثم الجري في مسار متعرج مع النظر للأمام وتبديل اليدين، وعدّ المرات دون فقد الكرة.\n\nس4 (مستوى المعرفة): إلى أين ندفع الكرة عند التنطيط أثناء المشي؟\nالإجابة: قليلًا للأمام بجانب الجسم.\nس5 (مستوى التطبيق): ما الهدف في لعبة المربع؟\nالإجابة: المحافظة على كرتي وقطع كرات الزملاء.\nس6 (مستوى الاستدلال): لماذا يصعب التنطيط في المسار المتعرج؟\nالإجابة: لأننا نغير الاتجاه فنحتاج إلى التحكم في الكرة باليدين.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ كرة كبيرة في المكان بأصابع اليد في مستوى الحوض ببطء، مع العد حتى 5، ثم يسأله: بأي جزء من اليد ندفع الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنطيط الكرة أثناء المشي ثم الجري في مسار متعرج مع النظر للأمام وتبديل اليدين، وعدّ المرات دون فقد الكرة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): نطط الكرة 10 مرات باليد اليمنى ثم 10 باليسرى.\nالإجابة: يؤديها دون فقد الكرة.\nس2 (مستوى التطبيق): ما الفرق بين الدفع بالأصابع والضرب بالراحة؟\nالإجابة: الدفع بالأصابع يتحكم في الكرة، والضرب بالراحة يجعلها تهرب.\nس3 (مستوى الاستدلال): سمِّ لعبة رياضية فيها تنطيط.\nالإجابة: كرة السلة أو كرة اليد.\n\nس4 (مستوى المعرفة): نطط الكرة بين الأقماع ذهابًا وإيابًا.\nالإجابة: يؤديه دون فقد الكرة.\nس5 (مستوى التطبيق): اذكر محطتين من محطات التنطيط.\nالإجابة: الخط المستقيم والمتعرج (أو المربع، تبادل اليدين).\nس6 (مستوى الاستدلال): كيف شعرت عندما حافظت على كرتك في اللعبة؟\nالإجابة: يعبر عن الرضا والثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على تنطيط كرة باليدين بالتبادل 20 مرة يوميًا مع النظر للأمام (دليل المعلم ص 86-88).\nإرشاد لولي الأمر: شجع طفلك على التنطيط أثناء المشي في الممر وتبديل اليدين (دليل المعلم ص 89-92).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=10"}}, {"title": "المراوغة والمحاورة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 93-100", "n": 1, "periods": [{"focus": "المراوغة بالجسم والمحاورة بالكرة + ألعاب ومنافسات المراوغة والمحاورة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي المراوغة والمحاورة وأهميتهما (5 دقائق)\n2. يؤدي المحاورة بتنطيط الكرة مع تغيير الاتجاه (10 دقائق)\n3. يميز بين المراوغة (بالجسم) والمحاورة (بالكرة) (5 دقائق)\n4. يوظف المراوغة والمحاورة في ألعاب ومنافسات بمدافعين (10 دقائق)\n5. يختار الاتجاه المناسب للتخلص من المدافع (5 دقائق)\n6. يشعر بالسعادة عند مشاركة زملائه أنشطة المراوغة والمحاورة (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أعلام\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: بطاقات", "المفاهيم": "- المراوغة\n- المحاورة\n- تغيير الاتجاه\n- التخلص\n- تزايد السرعة وتناقصها\n- المدافع\n- المساحة الآمنة", "التهيئة / التمهيد / التعلم القبلي": "يقف تلميذ أمام المعلم ويحاول المعلم المرور منه بتغيير اتجاهه فجأة ويسأل: ماذا فعلت لأمر؟ ويعرض صورة لاعب يحاور بالكرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري مع تغيير الاتجاه بالإشارة، تنطيط في المكان، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: المراوغة بالجسم (خطوة جانبًا مع ميل الجذع ثم الانطلاق للجهة الأخرى)، ثم المحاورة (تنطيط أسفل مستوى الحوض وتغيير اتجاه الجسم أثناء التنطيط والابتعاد عن المنافس) ص 94-95، فتطبيق موجه، ويؤدي التلميذ المراوغة بلا كرة ثم المحاورة بالكرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 96: يجرب التلميذ المحاورة بتنطيط عالٍ ثم منخفض عند تغيير الاتجاه حول الأقماع ويكتشف أن التنطيط المنخفض يسهل تغيير الاتجاه ويحفظ الكرة، ويجرب التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الظل): في أزواج، يحاور أحدهما بالكرة ويغير اتجاهه، ويتبعه زميله كالظل دون أخذ الكرة، ثم التبادل، ويلعب التلميذ ويحاور (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 3 و4 ص 98-99: محطات: محاورة بين الأقماع ثم تصويب في طوق، مراوغة مدافع ثابت، محاورة مع تبديل اليد عند كل قمع، مراوغة في مثلث، بأربع مجموعات والتبديل، ويؤدي التلميذ مهمة المحطة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 5 (ألعاب المراوغة والمحاورة) ص 100: أربعة مربعات متقابلة، مجموعتان، تلميذان مدافعان بين المربعين، يحاول تلاميذ المجموعة العبور بالمحاورة إلى المربع المقابل دون أن يلمس المدافع كرتهم، ونقطة لكل عبور ناجح، ويلعب التلميذ ويحاور ويراوغ المدافعين (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى نجح العبور أكثر؟ ليستنتج التلاميذ أهمية تغيير الاتجاه المفاجئ والمساحة الآمنة، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – محاورة بين النخيل: يضع المعلم أقماعًا تمثل نخيل مزرعة عمانية، فيحاور الطلبة بالكرة بينها مع تغيير الاتجاه دون أن يلمسوها، حفاظًا على النخلة رمز الخير في عمان (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما الفرق بين المراوغة والمحاورة؟\nالإجابة: المراوغة تغيير اتجاه الجسم للتخلص من المنافس، والمحاورة تنطيط الكرة مع تغيير الاتجاه.\nس2 (مستوى التطبيق): لماذا ننطط الكرة منخفضة عند المحاورة؟\nالإجابة: لنغير الاتجاه بسهولة ولا يأخذها المنافس.\nس3 (مستوى الاستدلال): اذكر لعبة فيها محاورة.\nالإجابة: كرة السلة أو كرة اليد.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ الكرة منخفضة ويغيّران الاتجاه حول قمع واحد ببطء، ثم يطلب منه أداء المحاورة حول القمع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة محاورة أمام زميل مدافع، يختارون فيها الاتجاه المناسب للتخلص منه، ويشرحون الفرق بين المراوغة والمحاورة.\n\nس4 (مستوى المعرفة): ماذا يفعل المدافع في لعبة المربعات؟\nالإجابة: يحاول لمس كرة العابرين.\nس5 (مستوى التطبيق): متى يكون العبور أسهل؟\nالإجابة: عند تغيير الاتجاه فجأة بعيدًا عن المدافع.\nس6 (مستوى الاستدلال): ماذا تعني المساحة الآمنة؟\nالإجابة: مساحة بعيدة عن المدافع تحاور فيها دون احتكاك.\n\n• نشاط علاجي (لمن لم يتقن): ينطط المعلم مع التلميذ الكرة منخفضة ويغيّران الاتجاه حول قمع واحد ببطء، ثم يطلب منه أداء المحاورة حول القمع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة محاورة أمام زميل مدافع، يختارون فيها الاتجاه المناسب للتخلص منه، ويشرحون الفرق بين المراوغة والمحاورة.", "التقويم الختامي": "س1 (مستوى المعرفة): حاور بالكرة حول ثلاثة أقماع.\nالإجابة: يحاور مع تغيير الاتجاه.\nس2 (مستوى التطبيق): كيف تتخلص من زميلك المدافع بالمراوغة؟\nالإجابة: أميل جانبًا ثم أنطلق للجهة الأخرى بسرعة.\nس3 (مستوى الاستدلال): ماذا يحدث لو نططنا الكرة عالية أمام المدافع؟\nالإجابة: يسهل عليه قطعها.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المحاورة بين الأقماع والتصويب، ومراوغة المدافع الثابت.\nس5 (مستوى التطبيق): راوغ زميلك المدافع واعبر إلى المربع المقابل.\nالإجابة: يراوغ ويعبر دون فقد الكرة.\nس6 (مستوى الاستدلال): كيف شعرت عندما عبرت من المدافع؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على المحاورة بالكرة حول أشياء في الحديقة مع التنطيط المنخفض (دليل المعلم ص 94-96).\nإرشاد لولي الأمر: العب مع طفلك دور المدافع ودعه يحاول المرور بالمحاورة في مساحة آمنة (دليل المعلم ص 98-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/pe/?l=11"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي المراوغة والمحاورة وأهميتهما (5 دقائق)\n2. يؤدي المحاورة بتنطيط الكرة مع تغيير الاتجاه (10 دقائق)\n3. يميز بين المراوغة (بالجسم) والمحاورة (بالكرة) (5 دقائق)\n4. يوظف المراوغة والمحاورة في ألعاب ومنافسات بمدافعين (10 دقائق)\n5. يختار الاتجاه المناسب للتخلص من المدافع (5 دقائق)\n6. يشعر بالسعادة عند مشاركة زملائه أنشطة المراوغة والمحاورة (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "ا
