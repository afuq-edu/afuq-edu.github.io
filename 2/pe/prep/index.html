اقة مهنة وتمثل حركتها بالتمرين، وتخمن المجموعات الأخرى.\n- الطالب: يمثل مع مجموعته ويخمن.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج، يبتكر الزوجان تمرينًا تمثيليًا لمهنة عمانية (صيد السمك، جني التمور) ويعرضانه.\n- الطالب: يبتكر ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة تمثيلية: الشمس تغرب ببطء.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء على شكل بداية القصة: نستعد للرحلة (تمطي)، نحمل الحقائب (ثني ومد)، نمشي إلى الحافلة.\n- الطالب: يقلد.\n\nالنشاط 2 (18 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يسرد المعلم القصة ويؤدي النموذج: نصعد الجبل (مشي بطيء ورفع الركبتين)، نعبر الوادي (وثب فوق الحبال)، نمر بالممر الضيق (مشي على الخط)، نصعد درج القلعة (حجل)، نرفع العلم (مد الذراعين عاليًا)، نعود بالجري الخفيف (ص 54-55).\n- الطالب: يؤدي الحركات مع السرد.\n\nالنشاط 3 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تضيف كل مجموعة مشهدًا جديدًا للقصة (مثل مساعدة زائر ضل الطريق) وتعرضه بالحركة.\n- الطالب: يبتكر المشهد مع مجموعته ويعرضه.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: حوار: ماذا تعلمنا من الرحلة؟ وما شعورنا عند رفع العلم؟ ليستنتج التلاميذ قيم الانتماء والتعاون.\n- الطالب: يستنتج ويعبر.\n\nالنشاط 5 (3 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالتنفس كأننا نتأمل المنظر من القلعة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): من أي وضع مثلنا التجديف؟\nالإجابة: من الجلوس.\nس2 (المستوى المتوقع): ما الحركة التي تمثل رمي الصياد للشبكة؟\nالإجابة: مرجحة الذراعين من الوقوف.\nس3 (المستوى المتقدم): لماذا نمثل المهن بالتمرينات؟\nالإجابة: لنتعرف المهن ونحرك أجزاء الجسم بطريقة ممتعة.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الحركة التي أديناها عند عبور الوادي؟\nالإجابة: الوثب فوق الحبال.\nس2 (المستوى المتوقع): كيف صعدنا درج القلعة؟\nالإجابة: بالحجل.\nس3 (المستوى المتقدم): ماذا فعلنا عندما ضل الزائر الطريق في مشهد المجموعة؟\nالإجابة: ساعدناه وأرشدناه إلى الطريق.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): مثّل حركة الفلاح وهو يزرع.\nالإجابة: يثني الجذع أمامًا من الجثو ويحرك اليدين.\nس2 (المستوى المتوقع): اذكر مهنة عمانية ابتكرت لها تمرينًا.\nالإجابة: صيد السمك أو جني التمور.\nس3 (المستوى المتقدم): أي الأوضاع استخدمت في تمثيلك ولماذا؟\nالإجابة: يذكر الوضع ويعلل بأنه يناسب حركة المهنة.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أربع حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب، الحجل.\nس2 (المستوى المتوقع): ما القيمة التي شعرت بها عند رفع العلم؟\nالإجابة: الانتماء وحب الوطن.\nس3 (المستوى المتقدم): ابتكر حركة لمشهد جديد في القصة.\nالإجابة: يذكر مشهدًا وحركته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: اطلب من طفلك تمثيل مهنتك بالحركة، وراجعا صور التمرينات التمثيلية في دليل المعلم ص 52-53.\n\nالحصة 2:\nإرشاد لولي الأمر: تحدث مع طفلك عن قلعة أو حصن في محافظتكم، ومثّلا معًا رحلة قصيرة بالحركات (دليل المعلم ص 54-56)."}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 24-28", "n": 2, "periods": [{"focus": "الممارسات الصحية: الإحماء والتهدئة لحماية الجسم", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده.\n2. يميز تمرينات الإحماء من تمرينات التهدئة.\n3. يطبق إحماءً بسيطًا بنفسه قبل اللعب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة لتمرينات الإحماء والتهدئة\n- أخرى: أقماع\n- أخرى: مراتب", "المفاهيم": "- الإحماء\n- التهدئة\n- الإصابة\n- العضلات", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا يحدث للسيارة في الصباح البارد قبل الانطلاق؟ ويربط ذلك بحاجة العضلات إلى تسخين قبل اللعب.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج إحماء كامل (مشي، جري خفيف، تحريك المفاصل، إطالة خفيفة) مع التفكير بصوت عالٍ: لماذا نبدأ بالمشي؟ لماذا نحرك المفاصل؟\n- الطالب: يقلد ويكرر السبب.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن التلاميذ بين مشاعرهم بعد الإحماء وقبله (دفء، سرعة النبض) ويستنتجون فائدة الإحماء في حماية العضلات من الإصابة.\n- الطالب: يلاحظ ويستنتج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بثلاث حركات ثم يتبادلون.\n- الطالب: يقود الإحماء ويؤديه.\n\nالنشاط 4 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تصنف كل مجموعة بطاقات التمرينات إلى (إحماء) و(تهدئة) وتعرض السبب.\n- الطالب: يصنف ويعلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التهدئة: مشي بطيء وتنفس وإطالة، ونصيحة: لا تلعب بلا إحماء.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): لماذا نحمي العضلات بالإحماء؟\nالإجابة: لأن العضلة الباردة قد تتمزق أو تصاب عند الحركة القوية.\nس2 (المستوى المتوقع): بأي حركة نبدأ الإحماء؟\nالإجابة: بالمشي ثم الجري الخفيف.\nس3 (المستوى المتقدم): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء يسخن الجسم في البداية، والتهدئة تريحه في النهاية.", "التقويم الختامي": "س1 (مستوى الدعم): قُد إحماءً قصيرًا لزملائك بثلاث حركات.\nالإجابة: يؤدي مشيًا وجريًا خفيفًا وتحريك المفاصل.\nس2 (المستوى المتوقع): صنّف: التنفس العميق والإطالة البطيئة، إحماء أم تهدئة؟\nالإجابة: تهدئة.\nس3 (المستوى المتقدم): زميلك يريد أن يلعب كرة القدم مباشرة دون إحماء، بماذا تنصحه؟\nالإجابة: أنصحه بالإحماء أولًا حتى لا يصاب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب في الحي والتهدئة بعده (برنامج صحتي، دليل المعلم ص 26)."}}, {"focus": "المهرجان الرياضي التعليمي للتمرينات (الأوضاع المشتقة، التمرينات الحرة، التمثيل الحركي)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الأوضاع المشتقة والتمرينات الحرة ضمن أقسام المهرجان.\n2. يوظف التمثيل الحركي في عرض جماعي قصير.\n3. يتعاون مع مجموعته ويلتزم بالنظام في المهرجان.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: بطاقات الأوضاع والتمرينات\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- العرض الرياضي", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أتمرن بنظام) ويقسم التلاميذ أربع مجموعات بأسماء ولايات عمانية مع قائد، ويعرض الأقسام ويذكر قواعد السلامة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بنموذج المعلم.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25 وص 56: قسم الأوضاع المشتقة (أداء الوضع من البطاقة)، قسم التمرينات الحرة الفردية والزوجية (محطات)، قسم جمباز الموانع (وثب فوق الحبال ومروق أسفل الحاجز)، قسم التمثيل الحركي (عرض قصير لمهنة)، مع تسجيل النقاط.\n- الطالب: يؤدي مهام الأقسام مع مجموعته بقيادة القائد.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: أسرع مجموعة تؤدي ثلاثة أوضاع مشتقة بالنداء.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم جميع المشاركين.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى الدعم): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الحرة.\nس2 (المستوى المتوقع): ما الوضع المشتق الذي ناداه القائد في المسابقة الختامية؟\nالإجابة: يذكر الوضع (مثل: وقوف فتحًا).\nس3 (المستوى المتقدم): لماذا نسمي المجموعات بأسماء الولايات؟\nالإجابة: لنتعرف ولايات وطننا ونعتز بها.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر أقسام مهرجان اليوم الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الحرة، جمباز الموانع، التمثيل الحركي.\nس2 (المستوى المتوقع): ما المهنة التي مثلتها مجموعتك؟\nالإجابة: يذكر المهنة.\nس3 (المستوى المتقدم): كيف أسهمت في فوز مجموعتك أو تحسين أدائها؟\nالإجابة: التزمت بالنظام وأديت التمرينات بدقة وساعدت زملائي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين حرين يوميًا (دليل المعلم ص 42-50)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية الإحماء قبل النشاط والتهدئة بعده.\n2. يميز تمرينات الإحماء من تمرينات التهدئة.\n3. يطبق إحماءً بسيطًا بنفسه قبل اللعب.\n\nالحصة 2:\n1. يؤدي الأوضاع المشتقة والتمرينات الحرة ضمن أقسام المهرجان.\n2. يوظف التمثيل الحركي في عرض جماعي قصير.\n3. يتعاون مع مجموعته ويلتزم بالنظام في المهرجان.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة لتمرينات الإحماء والتهدئة\n- أخرى: أقماع\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: بطاقات الأوضاع والتمرينات\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الإحماء\n- التهدئة\n- الإصابة\n- العضلات\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- العرض الرياضي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ماذا يحدث للسيارة في الصباح البارد قبل الانطلاق؟ ويربط ذلك بحاجة العضلات إلى تسخين قبل اللعب.\n\nالحصة 2:\nيعلن المعلم مهرجان (أتمرن بنظام) ويقسم التلاميذ أربع مجموعات بأسماء ولايات عمانية مع قائد، ويعرض الأقسام ويذكر قواعد السلامة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج إحماء كامل (مشي، جري خفيف، تحريك المفاصل، إطالة خفيفة) مع التفكير بصوت عالٍ: لماذا نبدأ بالمشي؟ لماذا نحرك المفاصل؟\n- الطالب: يقلد ويكرر السبب.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن التلاميذ بين مشاعرهم بعد الإحماء وقبله (دفء، سرعة النبض) ويستنتجون فائدة الإحماء في حماية العضلات من الإصابة.\n- الطالب: يلاحظ ويستنتج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المدرب الصغير): يقود تلميذ من كل مجموعة إحماء زملائه بثلاث حركات ثم يتبادلون.\n- الطالب: يقود الإحماء ويؤديه.\n\nالنشاط 4 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تصنف كل مجموعة بطاقات التمرينات إلى (إحماء) و(تهدئة) وتعرض السبب.\n- الطالب: يصنف ويعلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التهدئة: مشي بطيء وتنفس وإطالة، ونصيحة: لا تلعب بلا إحماء.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بنموذج المعلم.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25 وص 56: قسم الأوضاع المشتقة (أداء الوضع من البطاقة)، قسم التمرينات الحرة الفردية والزوجية (محطات)، قسم جمباز الموانع (وثب فوق الحبال ومروق أسفل الحاجز)، قسم التمثيل الحركي (عرض قصير لمهنة)، مع تسجيل النقاط.\n- الطالب: يؤدي مهام الأقسام مع مجموعته بقيادة القائد.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: أسرع مجموعة تؤدي ثلاثة أوضاع مشتقة بالنداء.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم جميع المشاركين.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا نحمي العضلات بالإحماء؟\nالإجابة: لأن العضلة الباردة قد تتمزق أو تصاب عند الحركة القوية.\nس2 (المستوى المتوقع): بأي حركة نبدأ الإحماء؟\nالإجابة: بالمشي ثم الجري الخفيف.\nس3 (المستوى المتقدم): ما الفرق بين الإحماء والتهدئة؟\nالإجابة: الإحماء يسخن الجسم في البداية، والتهدئة تريحه في النهاية.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القسم الذي أديتم فيه تمرينات زوجية؟\nالإجابة: قسم التمرينات الحرة.\nس2 (المستوى المتوقع): ما الوضع المشتق الذي ناداه القائد في المسابقة الختامية؟\nالإجابة: يذكر الوضع (مثل: وقوف فتحًا).\nس3 (المستوى المتقدم): لماذا نسمي المجموعات بأسماء الولايات؟\nالإجابة: لنتعرف ولايات وطننا ونعتز بها.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): قُد إحماءً قصيرًا لزملائك بثلاث حركات.\nالإجابة: يؤدي مشيًا وجريًا خفيفًا وتحريك المفاصل.\nس2 (المستوى المتوقع): صنّف: التنفس العميق والإطالة البطيئة، إحماء أم تهدئة؟\nالإجابة: تهدئة.\nس3 (المستوى المتقدم): زميلك يريد أن يلعب كرة القدم مباشرة دون إحماء، بماذا تنصحه؟\nالإجابة: أنصحه بالإحماء أولًا حتى لا يصاب.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أقسام مهرجان اليوم الأربعة.\nالإجابة: الأوضاع المشتقة، التمرينات الحرة، جمباز الموانع، التمثيل الحركي.\nس2 (المستوى المتوقع): ما المهنة التي مثلتها مجموعتك؟\nالإجابة: يذكر المهنة.\nس3 (المستوى المتقدم): كيف أسهمت في فوز مجموعتك أو تحسين أدائها؟\nالإجابة: التزمت بالنظام وأديت التمرينات بدقة وساعدت زملائي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ذكّر طفلك بالإحماء قبل اللعب في الحي والتهدئة بعده (برنامج صحتي، دليل المعلم ص 26).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان، وشجعه على أداء تمرينين حرين يوميًا (دليل المعلم ص 42-50)."}}, {"title": "الخطو الجانبي وركضة الحصان", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "السادس – السابع", "date": "11-15/10/2026 إلى 18-22/10/2026", "pages": "دليل المعلم ص 60-67", "n": 4, "periods": [{"focus": "الخطو الجانبي", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الخطو الجانبي ونقاطها الفنية.\n2. يؤدي الخطو الجانبي لليمين واليسار بإيقاع منتظم.\n3. يميز بين الخطو الجانبي والمشي الأمامي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- الخطو الجانبي\n- الاتجاه\n- الإيقاع\n- الجانب الأيمن والأيسر", "التهيئة / التمهيد / التعلم القبلي": "يتحرك المعلم جانبًا كلاعب كرة سلة يدافع ويسأل: كيف تحركت؟ هل مشيت للأمام؟ ويعرض صورة حارس المرمى يتحرك جانبًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم تحريك الرجلين جانبًا من الوقوف.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الخطو الجانبي: وقوف، الركبتان منثنيتان قليلًا، نقل القدم اليمنى جانبًا ثم ضم اليسرى إليها دون تقاطع، والذراعان للاتزان (ص 61-62)، بالعد ثم بالإيقاع المتصل، ثم للجهة الأخرى.\n- الطالب: يؤدي الخطو الجانبي بالعد ثم بالإيقاع لليمين واليسار.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 63: خطو جانبي على خط مستقيم ثم بين الأقماع؛ يجرب التلميذ ضم القدمين بشكل ملاصق ثم بمسافة ويكتشف أي الطريقتين أسرع وأثبت، ويستنتج أهمية عدم تقاطع القدمين.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المرآة الجانبية): في أزواج متقابلين، يتحرك أحدهما جانبًا ويتبعه الآخر كالمرآة بسرعات مختلفة.\n- الطالب: يلعب ويتابع زميله.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الفخذين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): في الخطو الجانبي، هل تتقاطع القدمان؟\nالإجابة: لا، تنتقل قدم جانبًا وتضم إليها الأخرى.\nس2 (المستوى المتوقع): أين تكون الركبتان أثناء الخطو الجانبي؟\nالإجابة: منثنيتين قليلًا.\nس3 (المستوى المتقدم): اذكر لعبة يستخدم فيها اللاعب الخطو الجانبي.\nالإجابة: كرة السلة (الدفاع) أو حارس المرمى.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ خطوًا جانبيًا لليمين 5 خطوات ثم لليسار.\nالإجابة: يؤديه دون تقاطع القدمين.\nس2 (المستوى المتوقع): ما الفرق بين الخطو الجانبي والمشي الأمامي؟\nالإجابة: الخطو الجانبي يتحرك فيه الجسم جانبًا والقدمان متوازيتان، والمشي يتحرك للأمام بتبادل القدمين.\nس3 (المستوى المتقدم): لماذا نثني الركبتين في الخطو الجانبي؟\nالإجابة: للاتزان وسرعة تغيير الاتجاه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الخطو الجانبي في الممر 5 خطوات لكل جهة (دليل المعلم ص 61-63)."}}, {"focus": "ركضة الحصان (عدو الفرس)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ركضة الحصان وتسلسلها (خطوة، وثبة، خطوة).\n2. يؤدي ركضة الحصان بإيقاع صحيح مع الهبوط على قدم الارتقاء.\n3. يحافظ على الإيقاع والاتزان أثناء الأداء.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- ركضة الحصان\n- قدم الارتقاء\n- الإيقاع\n- الخطوة والوثبة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة حصان يعدو ويسأل: كيف يتحرك الحصان؟ ثم يؤدي ركضة الحصان ويطلب ملاحظة قدمي الهبوط.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، حجل، خطو جانبي للمراجعة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج بالعد: (1) وقوف وانثناء الركبتين وميل الجذع، (2) خطوة للأمام مع بقاء قدم أمام الأخرى، (3) ارتقاء عاليًا بالقدم الأمامية والهبوط عليها، ثم تتابع الحركة (ص 62)، فتطبيق موجه ثم مستقل في مسار الأقماع.\n- الطالب: يؤدي بالعد ثم بالإيقاع المتصل.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج بأدوار: يراقب أحدهما قدم الهبوط لزميله ويقول (صح/أعد)، ثم يتبادلان، ثم يؤديان ركضة الحصان جنبًا إلى جنب بإيقاع واحد.\n- الطالب: يراقب ويصحح ويؤدي بالتوافق.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (سباق الخيول): قطارات، يؤدي كل تلميذ ركضة الحصان حتى القمع والعودة بالجري، وتفوز المجموعة الأدق إيقاعًا.\n- الطالب: يتسابق بالإيقاع الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة ثم وثبة ثم خطوة.\nس2 (المستوى المتوقع): على أي قدم نهبط بعد الوثبة؟\nالإجابة: على قدم الارتقاء نفسها.\nس3 (المستوى المتقدم): لماذا نميل الجذع قليلًا للأمام؟\nالإجابة: للاندفاع والاتزان أثناء الحركة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ ركضة الحصان حتى القمع.\nالإجابة: يؤديها بالتسلسل الصحيح.\nس2 (المستوى المتوقع): ما الفرق بين ركضة الحصان والجري العادي؟\nالإجابة: ركضة الحصان تمزج الجري بالوثب والهبوط على القدم نفسها، والجري تبادل القدمين.\nس3 (المستوى المتقدم): زميلك يهبط على القدم الأخرى بعد الوثبة، ماذا تقول له؟\nالإجابة: اهبط على قدم الارتقاء نفسها ثم خذ الخطوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على أداء ركضة الحصان في ساحة آمنة مع العد (خطوة، وثبة، خطوة) (دليل المعلم ص 62-64)."}}, {"focus": "محطات الخطو الجانبي وركضة الحصان", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي الخطو الجانبي وركضة الحصان في مسارات ومحطات مختلفة.\n2. يميز متى يستخدم كل حركة حسب المحطة.\n3. يتعاون مع مجموعته في تنفيذ المحطات.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: شريط لاصق", "المفاهيم": "- الخطو الجانبي\n- ركضة الحصان\n- المحطات\n- المسار", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركتين بنموذج تلميذين، ثم يعرض المحطات ويسأل: أي حركة تناسب كل محطة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم يشمل الحركتين.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج المحطات: خطو جانبي بين الأقماع ذهابًا وإيابًا، ركضة الحصان فوق الحبال المنخفضة، خطو جانبي بجانب المقعد، ركضة الحصان في المسار المنحني.\n- الطالب: يشاهد ويحدد الحركة المناسبة.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 65-66: أربع مجموعات بقائد تؤدي المحطات بالتبادل، ويسجل القائد الأداء الصحيح.\n- الطالب: يؤدي الحركة الصحيحة في كل محطة ويبدل بنظام.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة تتابع: مسار يجمع الحركتين (خطو جانبي للقمع ثم ركضة حصان للعودة).\n- الطالب: يتسابق بدقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونقاش: أي محطة احتاجت إلى الخطو الجانبي ولماذا؟\n- الطالب: يؤدي التهدئة ويجيب.", "التقويم التكويني": "س1 (مستوى الدعم): ما الحركة المناسبة لمحطة المقعد السويدي؟\nالإجابة: الخطو الجانبي بجانب المقعد.\nس2 (المستوى المتوقع): ما الحركة التي أديناها فوق الحبال؟\nالإجابة: ركضة الحصان.\nس3 (المستوى المتقدم): لماذا لا نؤدي الخطو الجانبي فوق الحبال؟\nالإجابة: لأن الحبال تحتاج إلى وثبة، والخطو الجانبي لا وثب فيه.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين وحركة كل منهما.\nالإجابة: الأقماع: خطو جانبي، الحبال: ركضة الحصان.\nس2 (المستوى المتوقع): أدِّ مسار التتابع كاملًا.\nالإجابة: يؤدي الخطو الجانبي ثم ركضة الحصان.\nس3 (المستوى المتقدم): كيف ساعد القائد مجموعتك اليوم؟\nالإجابة: سجل الأداء وشجعنا ونظم الدور.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك محطتين في المنزل (ممر للخطو الجانبي، وسادة منخفضة لركضة الحصان) (دليل المعلم ص 65-66)."}}, {"focus": "ألعاب الخطو الجانبي وركضة الحصان", "num": 4, "fields": {"المخرجات التعليمية": "1. يوظف الخطو الجانبي وركضة الحصان في الألعاب الرياضية.\n2. يطبق قواعد اللعبة وإشارات المعلم أثناء اللعب.\n3. يستمتع بمشاركة زملائه ألعاب الخطو الجانبي وركضة الحصان.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أعلام (أحمر وأخضر)\n- أخرى: كرات متوسطة\n- أخرى: شريط لاصق", "المفاهيم": "- الخطو الجانبي\n- ركضة الحصان\n- الإشارة\n- اللعبة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركتين بسرعة ثم يرفع علمين ويسأل: ماذا لو كان الأحمر خطوًا جانبيًا والأخضر ركضة حصان؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب الخطو الجانبي وركضة الحصان) ص 67: ساحة مقسمة نصفين ومجموعتان بلونين، يرفع المعلم العلم الأحمر فتهرب مجموعة الأحمر بالخطو الجانبي وتطاردها الأخرى بركضة الحصان حتى الخط، وتحسب نقاط اللمس، ثم التبادل.\n- الطالب: يلعب مستجيبًا للعلم بالحركة الصحيحة.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تبتكر كل مجموعة لعبة قصيرة تستخدم الحركتين بالكرة وتعرضها على الصف.\n- الطالب: يبتكر مع مجموعته ويعرض.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كانت ركضة الحصان أسرع في المطاردة والخطو الجانبي أفضل في المراوغة؟ ليستنتج التلاميذ استخدام كل حركة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا تفعل مجموعة الأحمر عند رفع العلم الأحمر؟\nالإجابة: تهرب بالخطو الجانبي.\nس2 (المستوى المتوقع): بأي حركة طاردت المجموعة الأخرى؟\nالإجابة: بركضة الحصان.\nس3 (المستوى المتقدم): أي الحركتين أسرع في المطاردة؟\nالإجابة: ركضة الحصان.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر لعبة ابتكرتها مجموعتك اليوم.\nالإجابة: يذكر اللعبة وحركاتها.\nس2 (المستوى المتوقع): متى نستخدم الخطو الجانبي في الألعاب؟\nالإجابة: للمراوغة والدفاع وتغيير الاتجاه جانبًا.\nس3 (المستوى المتقدم): كيف شعرت في لعبة الأعلام ولماذا؟\nالإجابة: يعبر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك لعبة الأعلام (الأحمر خطو جانبي، الأخضر ركضة حصان) في مكان آمن (دليل المعلم ص 67)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة الخطو الجانبي ونقاطها الفنية.\n2. يؤدي الخطو الجانبي لليمين واليسار بإيقاع منتظم.\n3. يميز بين الخطو الجانبي والمشي الأمامي.\n\nالحصة 2:\n1. يتعرف حركة ركضة الحصان وتسلسلها (خطوة، وثبة، خطوة).\n2. يؤدي ركضة الحصان بإيقاع صحيح مع الهبوط على قدم الارتقاء.\n3. يحافظ على الإيقاع والاتزان أثناء الأداء.\n\nالحصة 3:\n1. يؤدي الخطو الجانبي وركضة الحصان في مسارات ومحطات مختلفة.\n2. يميز متى يستخدم كل حركة حسب المحطة.\n3. يتعاون مع مجموعته في تنفيذ المحطات.\n\nالحصة 4:\n1. يوظف الخطو الجانبي وركضة الحصان في الألعاب الرياضية.\n2. يطبق قواعد اللعبة وإشارات المعلم أثناء اللعب.\n3. يستمتع بمشاركة زملائه ألعاب الخطو الجانبي وركضة الحصان.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: شريط لاصق\n\nالحصة 4:\n- أخرى: أقماع\n- أخرى: أعلام (أحمر وأخضر)\n- أخرى: كرات متوسطة\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الخطو الجانبي\n- الاتجاه\n- الإيقاع\n- الجانب الأيمن والأيسر\n\nالحصة 2:\n- ركضة الحصان\n- قدم الارتقاء\n- الإيقاع\n- الخطوة والوثبة\n\nالحصة 3:\n- الخطو الجانبي\n- ركضة الحصان\n- المحطات\n- المسار\n\nالحصة 4:\n- الخطو الجانبي\n- ركضة الحصان\n- الإشارة\n- اللعبة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيتحرك المعلم جانبًا كلاعب كرة سلة يدافع ويسأل: كيف تحركت؟ هل مشيت للأمام؟ ويعرض صورة حارس المرمى يتحرك جانبًا.\n\nالحصة 2:\nيعرض المعلم صورة حصان يعدو ويسأل: كيف يتحرك الحصان؟ ثم يؤدي ركضة الحصان ويطلب ملاحظة قدمي الهبوط.\n\nالحصة 3:\nيراجع المعلم الحركتين بنموذج تلميذين، ثم يعرض المحطات ويسأل: أي حركة تناسب كل محطة؟\n\nالحصة 4:\nيراجع المعلم الحركتين بسرعة ثم يرفع علمين ويسأل: ماذا لو كان الأحمر خطوًا جانبيًا والأخضر ركضة حصان؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم تحريك الرجلين جانبًا من الوقوف.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الخطو الجانبي: وقوف، الركبتان منثنيتان قليلًا، نقل القدم اليمنى جانبًا ثم ضم اليسرى إليها دون تقاطع، والذراعان للاتزان (ص 61-62)، بالعد ثم بالإيقاع المتصل، ثم للجهة الأخرى.\n- الطالب: يؤدي الخطو الجانبي بالعد ثم بالإيقاع لليمين واليسار.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 63: خطو جانبي على خط مستقيم ثم بين الأقماع؛ يجرب التلميذ ضم القدمين بشكل ملاصق ثم بمسافة ويكتشف أي الطريقتين أسرع وأثبت، ويستنتج أهمية عدم تقاطع القدمين.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المرآة الجانبية): في أزواج متقابلين، يتحرك أحدهما جانبًا ويتبعه الآخر كالمرآة بسرعات مختلفة.\n- الطالب: يلعب ويتابع زميله.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الفخذين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، حجل، خطو جانبي للمراجعة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج بالعد: (1) وقوف وانثناء الركبتين وميل الجذع، (2) خطوة للأمام مع بقاء قدم أمام الأخرى، (3) ارتقاء عاليًا بالقدم الأمامية والهبوط عليها، ثم تتابع الحركة (ص 62)، فتطبيق موجه ثم مستقل في مسار الأقماع.\n- الطالب: يؤدي بالعد ثم بالإيقاع المتصل.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج بأدوار: يراقب أحدهما قدم الهبوط لزميله ويقول (صح/أعد)، ثم يتبادلان، ثم يؤديان ركضة الحصان جنبًا إلى جنب بإيقاع واحد.\n- الطالب: يراقب ويصحح ويؤدي بالتوافق.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (سباق الخيول): قطارات، يؤدي كل تلميذ ركضة الحصان حتى القمع والعودة بالجري، وتفوز المجموعة الأدق إيقاعًا.\n- الطالب: يتسابق بالإيقاع الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم يشمل الحركتين.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج المحطات: خطو جانبي بين الأقماع ذهابًا وإيابًا، ركضة الحصان فوق الحبال المنخفضة، خطو جانبي بجانب المقعد، ركضة الحصان في المسار المنحني.\n- الطالب: يشاهد ويحدد الحركة المناسبة.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 65-66: أربع مجموعات بقائد تؤدي المحطات بالتبادل، ويسجل القائد الأداء الصحيح.\n- الطالب: يؤدي الحركة الصحيحة في كل محطة ويبدل بنظام.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة تتابع: مسار يجمع الحركتين (خطو جانبي للقمع ثم ركضة حصان للعودة).\n- الطالب: يتسابق بدقة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونقاش: أي محطة احتاجت إلى الخطو الجانبي ولماذا؟\n- الطالب: يؤدي التهدئة ويجيب.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب الخطو الجانبي وركضة الحصان) ص 67: ساحة مقسمة نصفين ومجموعتان بلونين، يرفع المعلم العلم الأحمر فتهرب مجموعة الأحمر بالخطو الجانبي وتطاردها الأخرى بركضة الحصان حتى الخط، وتحسب نقاط اللمس، ثم التبادل.\n- الطالب: يلعب مستجيبًا للعلم بالحركة الصحيحة.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تبتكر كل مجموعة لعبة قصيرة تستخدم الحركتين بالكرة وتعرضها على الصف.\n- الطالب: يبتكر مع مجموعته ويعرض.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كانت ركضة الحصان أسرع في المطاردة والخطو الجانبي أفضل في المراوغة؟ ليستنتج التلاميذ استخدام كل حركة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): في الخطو الجانبي، هل تتقاطع القدمان؟\nالإجابة: لا، تنتقل قدم جانبًا وتضم إليها الأخرى.\nس2 (المستوى المتوقع): أين تكون الركبتان أثناء الخطو الجانبي؟\nالإجابة: منثنيتين قليلًا.\nس3 (المستوى المتقدم): اذكر لعبة يستخدم فيها اللاعب الخطو الجانبي.\nالإجابة: كرة السلة (الدفاع) أو حارس المرمى.\n\nالحصة 2:\nس1 (مستوى الدعم): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة ثم وثبة ثم خطوة.\nس2 (المستوى المتوقع): على أي قدم نهبط بعد الوثبة؟\nالإجابة: على قدم الارتقاء نفسها.\nس3 (المستوى المتقدم): لماذا نميل الجذع قليلًا للأمام؟\nالإجابة: للاندفاع والاتزان أثناء الحركة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما الحركة المناسبة لمحطة المقعد السويدي؟\nالإجابة: الخطو الجانبي بجانب المقعد.\nس2 (المستوى المتوقع): ما الحركة التي أديناها فوق الحبال؟\nالإجابة: ركضة الحصان.\nس3 (المستوى المتقدم): لماذا لا نؤدي الخطو الجانبي فوق الحبال؟\nالإجابة: لأن الحبال تحتاج إلى وثبة، والخطو الجانبي لا وثب فيه.\n\nالحصة 4:\nس1 (مستوى الدعم): ماذا تفعل مجموعة الأحمر عند رفع العلم الأحمر؟\nالإجابة: تهرب بالخطو الجانبي.\nس2 (المستوى المتوقع): بأي حركة طاردت المجموعة الأخرى؟\nالإجابة: بركضة الحصان.\nس3 (المستوى المتقدم): أي الحركتين أسرع في المطاردة؟\nالإجابة: ركضة الحصان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ خطوًا جانبيًا لليمين 5 خطوات ثم لليسار.\nالإجابة: يؤديه دون تقاطع القدمين.\nس2 (المستوى المتوقع): ما الفرق بين الخطو الجانبي والمشي الأمامي؟\nالإجابة: الخطو الجانبي يتحرك فيه الجسم جانبًا والقدمان متوازيتان، والمشي يتحرك للأمام بتبادل القدمين.\nس3 (المستوى المتقدم): لماذا نثني الركبتين في الخطو الجانبي؟\nالإجابة: للاتزان وسرعة تغيير الاتجاه.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ ركضة الحصان حتى القمع.\nالإجابة: يؤديها بالتسلسل الصحيح.\nس2 (المستوى المتوقع): ما الفرق بين ركضة الحصان والجري العادي؟\nالإجابة: ركضة الحصان تمزج الجري بالوثب والهبوط على القدم نفسها، والجري تبادل القدمين.\nس3 (المستوى المتقدم): زميلك يهبط على القدم الأخرى بعد الوثبة، ماذا تقول له؟\nالإجابة: اهبط على قدم الارتقاء نفسها ثم خذ الخطوة.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر محطتين وحركة كل منهما.\nالإجابة: الأقماع: خطو جانبي، الحبال: ركضة الحصان.\nس2 (المستوى المتوقع): أدِّ مسار التتابع كاملًا.\nالإجابة: يؤدي الخطو الجانبي ثم ركضة الحصان.\nس3 (المستوى المتقدم): كيف ساعد القائد مجموعتك اليوم؟\nالإجابة: سجل الأداء وشجعنا ونظم الدور.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر لعبة ابتكرتها مجموعتك اليوم.\nالإجابة: يذكر اللعبة وحركاتها.\nس2 (المستوى المتوقع): متى نستخدم الخطو الجانبي في الألعاب؟\nالإجابة: للمراوغة والدفاع وتغيير الاتجاه جانبًا.\nس3 (المستوى المتقدم): كيف شعرت في لعبة الأعلام ولماذا؟\nالإجابة: يعبر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الخطو الجانبي في الممر 5 خطوات لكل جهة (دليل المعلم ص 61-63).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على أداء ركضة الحصان في ساحة آمنة مع العد (خطوة، وثبة، خطوة) (دليل المعلم ص 62-64).\n\nالحصة 3:\nإرشاد لولي الأمر: ابنِ مع طفلك محطتين في المنزل (ممر للخطو الجانبي، وسادة منخفضة لركضة الحصان) (دليل المعلم ص 65-66).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طفلك لعبة الأعلام (الأحمر خطو جانبي، الأخضر ركضة حصان) في مكان آمن (دليل المعلم ص 67)."}}, {"title": "تبادل الخطو والحجل", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 68-74", "n": 2, "periods": [{"focus": "تبادل الخطو والحجل (الخطوة والحجلة)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة تبادل الخطو والحجل ونقاطها الفنية.\n2. يؤدي خطوة ثم حجلة بالتبادل مع رفع الركبة ومرجحة الذراعين.\n3. يحافظ على الإيقاع (خطوة، حجلة) في مسار مستقيم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- تبادل الخطو والحجل\n- قدم الارتقاء\n- الإيقاع\n- مرجحة الذراعين", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يتذكر الحجل؟ ثم يؤدي خطوة ثم حجلة ويسأل: ماذا أضفت إلى الحجل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، حجل بالقدمين بالتبادل، مرجحة الذراعين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج بالعد: (1) وقوف والنظر للأمام، (2) خطوة للأمام، (3) حجلة بالقدم التي انتهت بها الخطوة مع رفع الركبة الأخرى، (4) الهبوط على قدم الارتقاء ثم خطوة بالأخرى وتكرار، مع مرجحة الذراعين عكس الرجلين (ص 69)، ثم تطبيق موجه فمستقل.\n- الطالب: يؤدي بالعد ثم بالإيقاع في المسار.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 70: أطواق متباعدة في مسار؛ يجرب التلميذ الحركة بمسافات مختلفة بين الأطواق ويكتشف أن رفع الركبة ومرجحة الذراعين يزيدان طول الحجلة.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج متجاورين، يؤديان الحركة بإيقاع واحد مع العد الجماعي (خطوة، حجلة)، ويتبادل الزميلان ملاحظة رفع الركبة.\n- الطالب: يؤدي بالتوافق ويلاحظ.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي قدم نحجل بعد الخطوة؟\nالإجابة: بالقدم التي انتهت بها الخطوة.\nس2 (المستوى المتوقع): ماذا نفعل بالركبة الأخرى أثناء الحجلة؟\nالإجابة: نرفعها لأعلى.\nس3 (المستوى المتقدم): كيف تتحرك الذراعان أثناء الحركة؟\nالإجابة: بالتبادل عكس حركة الرجلين.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ خطوة وحجلة بالتبادل حتى القمع.\nالإجابة: يؤدي بالإيقاع الصحيح.\nس2 (المستوى المتوقع): ما الذي يجعل الحجلة أطول؟\nالإجابة: رفع الركبة ومرجحة الذراعين بقوة.\nس3 (المستوى المتقدم): ما الفرق بين تبادل الخطو والحجل وركضة الحصان؟\nالإجابة: في تبادل الخطو والحجل نحجل ونهبط على القدم نفسها ثم نخطو بالأخرى، وفي ركضة الحصان خطوة ثم وثبة ثم خطوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على (خطوة، حجلة) بالعد في الممر مع مرجحة الذراعين (دليل المعلم ص 69-70)."}}, {"focus": "محطات وألعاب تبادل الخطو والحجل", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تبادل الخطو والحجل في مسارات متنوعة (مستقيم، متعرج، فوق حواجز منخفضة).\n2. يوظف الحركة في ألعاب ومسابقات.\n3. يعبر عن سعادته بمشاركة زملائه الألعاب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة", "المفاهيم": "- تبادل الخطو والحجل\n- المسار\n- المسابقة\n- الإيقاع", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الحركة بنموذج تلميذ ويسأل: هل نستطيع أداءها فوق حواجز منخفضة؟ ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (13 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (محطات) ص 72: محطة المسار المستقيم، محطة المسار المتعرج بين الأقماع، محطة الحواجز المنخفضة (الحجلة فوق الحاجز)، محطة الأطواق المتباعدة، بأربع مجموعات بقائد والتبديل.\n- الطالب: يؤدي الحركة في كل محطة ويبدل بنظام.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب تبادل الخطو والحجل) ص 74: ساحة بثلاث مناطق وأقماع في الأولى والثالثة، مجموعتان متقابلتان تتسابقان في نقل الأقماع بتبادل الخطو والحجل، وتفوز الأسرع بالأداء الصحيح.\n- الطالب: يتسابق بالحركة الصحيحة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا استُبعدت بعض الأقماع؟ ليستنتج التلاميذ أن الحركة الصحيحة شرط لاحتساب النقطة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): في أي محطة حجلنا فوق الحاجز؟\nالإجابة: محطة الحواجز المنخفضة.\nس2 (المستوى المتوقع): ماذا كان شرط احتساب القمع في المسابقة؟\nالإجابة: أداء الحركة الصحيحة (خطوة، حجلة) أثناء النقل.\nس3 (المستوى المتقدم): ما المسار الأصعب في المحطات ولماذا؟\nالإجابة: المتعرج لأنه يحتاج إلى تغيير الاتجاه مع الحفاظ على الإيقاع.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المسار المستقيم والحواجز المنخفضة (أو المتعرج، الأطواق).\nس2 (المستوى المتوقع): أدِّ تبادل الخطو والحجل فوق حاجزين منخفضين.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس3 (المستوى المتقدم): كيف شعرت عندما فازت مجموعتك أو خسرت؟\nالإجابة: يعبر بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على لعبة نقل الأشياء بتبادل الخطو والحجل في البيت (دليل المعلم ص 72-74)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة تبادل الخطو والحجل ونقاطها الفنية.\n2. يؤدي خطوة ثم حجلة بالتبادل مع رفع الركبة ومرجحة الذراعين.\n3. يحافظ على الإيقاع (خطوة، حجلة) في مسار مستقيم.\n\nالحصة 2:\n1. يؤدي تبادل الخطو والحجل في مسارات متنوعة (مستقيم، متعرج، فوق حواجز منخفضة).\n2. يوظف الحركة في ألعاب ومسابقات.\n3. يعبر عن سعادته بمشاركة زملائه الألعاب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة", "المفاهيم": "الحصة 1:\n- تبادل الخطو والحجل\n- قدم الارتقاء\n- الإيقاع\n- مرجحة الذراعين\n\nالحصة 2:\n- تبادل الخطو والحجل\n- المسار\n- المسابقة\n- الإيقاع", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: من يتذكر الحجل؟ ثم يؤدي خطوة ثم حجلة ويسأل: ماذا أضفت إلى الحجل؟\n\nالحصة 2:\nيراجع المعلم الحركة بنموذج تلميذ ويسأل: هل نستطيع أداءها فوق حواجز منخفضة؟ ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، حجل بالقدمين بالتبادل، مرجحة الذراعين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج بالعد: (1) وقوف والنظر للأمام، (2) خطوة للأمام، (3) حجلة بالقدم التي انتهت بها الخطوة مع رفع الركبة الأخرى، (4) الهبوط على قدم الارتقاء ثم خطوة بالأخرى وتكرار، مع مرجحة الذراعين عكس الرجلين (ص 69)، ثم تطبيق موجه فمستقل.\n- الطالب: يؤدي بالعد ثم بالإيقاع في المسار.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 70: أطواق متباعدة في مسار؛ يجرب التلميذ الحركة بمسافات مختلفة بين الأطواق ويكتشف أن رفع الركبة ومرجحة الذراعين يزيدان طول الحجلة.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج متجاورين، يؤديان الحركة بإيقاع واحد مع العد الجماعي (خطوة، حجلة)، ويتبادل الزميلان ملاحظة رفع الركبة.\n- الطالب: يؤدي بالتوافق ويلاحظ.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (13 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (محطات) ص 72: محطة المسار المستقيم، محطة المسار المتعرج بين الأقماع، محطة الحواجز المنخفضة (الحجلة فوق الحاجز)، محطة الأطواق المتباعدة، بأربع مجموعات بقائد والتبديل.\n- الطالب: يؤدي الحركة في كل محطة ويبدل بنظام.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب تبادل الخطو والحجل) ص 74: ساحة بثلاث مناطق وأقماع في الأولى والثالثة، مجموعتان متقابلتان تتسابقان في نقل الأقماع بتبادل الخطو والحجل، وتفوز الأسرع بالأداء الصحيح.\n- الطالب: يتسابق بالحركة الصحيحة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا استُبعدت بعض الأقماع؟ ليستنتج التلاميذ أن الحركة الصحيحة شرط لاحتساب النقطة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): بأي قدم نحجل بعد الخطوة؟\nالإجابة: بالقدم التي انتهت بها الخطوة.\nس2 (المستوى المتوقع): ماذا نفعل بالركبة الأخرى أثناء الحجلة؟\nالإجابة: نرفعها لأعلى.\nس3 (المستوى المتقدم): كيف تتحرك الذراعان أثناء الحركة؟\nالإجابة: بالتبادل عكس حركة الرجلين.\n\nالحصة 2:\nس1 (مستوى الدعم): في أي محطة حجلنا فوق الحاجز؟\nالإجابة: محطة الحواجز المنخفضة.\nس2 (المستوى المتوقع): ماذا كان شرط احتساب القمع في المسابقة؟\nالإجابة: أداء الحركة الصحيحة (خطوة، حجلة) أثناء النقل.\nس3 (المستوى المتقدم): ما المسار الأصعب في المحطات ولماذا؟\nالإجابة: المتعرج لأنه يحتاج إلى تغيير الاتجاه مع الحفاظ على الإيقاع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ خطوة وحجلة بالتبادل حتى القمع.\nالإجابة: يؤدي بالإيقاع الصحيح.\nس2 (المستوى المتوقع): ما الذي يجعل الحجلة أطول؟\nالإجابة: رفع الركبة ومرجحة الذراعين بقوة.\nس3 (المستوى المتقدم): ما الفرق بين تبادل الخطو والحجل وركضة الحصان؟\nالإجابة: في تبادل الخطو والحجل نحجل ونهبط على القدم نفسها ثم نخطو بالأخرى، وفي ركضة الحصان خطوة ثم وثبة ثم خطوة.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المسار المستقيم والحواجز المنخفضة (أو المتعرج، الأطواق).\nس2 (المستوى المتوقع): أدِّ تبادل الخطو والحجل فوق حاجزين منخفضين.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس3 (المستوى المتقدم): كيف شعرت عندما فازت مجموعتك أو خسرت؟\nالإجابة: يعبر بروح رياضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على (خطوة، حجلة) بالعد في الممر مع مرجحة الذراعين (دليل المعلم ص 69-70).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على لعبة نقل الأشياء بتبادل الخطو والحجل في البيت (دليل المعلم ص 72-74)."}}, {"title": "اللف والدوران", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 75-82", "n": 2, "periods": [{"focus": "اللف والدوران في المكان ومن الحركة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي اللف والدوران والفرق بينهما.\n2. يؤدي لف الجذع والذراعين والدوران حول المحور الطولي.\n3. يحافظ على اتزانه بعد الدوران.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: مراتب\n- صورة توضيحية", "المفاهيم": "- اللف\n- الدوران\n- المحور الطولي\n- الاتزان\n- نصف دورة", "التهيئة / التمهيد / التعلم القبلي": "يلف المعلم جذعه يمينًا ويسارًا ثم يدور دورة كاملة ويسأل: ما الفرق بين الحركتين؟ ويعرض صورة لاعب دفع الجلة وهو يدور.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ثم لف الجذع والذراعين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اللف (حركة جزء من الجسم حول محوره دون انتقال القاعدة: لف الجذع، دوران الذراع)، والدوران (حركة الجسم كله حول المحور الطولي مع تغيير القاعدة: نصف دورة، دورة كاملة من الوقوف ومن الوثب) مع الحفاظ على الاتزان (ص 76-77)، ثم تطبيق موجه.\n- الطالب: يؤدي اللف ثم الدوران نصف دورة فدورة كاملة ويثبت بعدها.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 78: يجرب التلميذ الدوران بالذراعين مفتوحتين ثم مضمومتين ويكتشف أيهما أسرع، ويجرب الهبوط بثني الركبتين بعد الدوران من الوثب ويستنتج ما يحفظ الاتزان.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (البوصلة): ينادي المعلم (نصف دورة) أو (دورة) أو (لف يمين) ويؤدي التلاميذ الحركة ويثبتون.\n- الطالب: يستجيب بالحركة الصحيحة ويحافظ على الثبات.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بلف بطيء للجذع والتنفس.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الفرق بين اللف والدوران؟\nالإجابة: اللف حركة جزء من الجسم حول محوره، والدوران حركة الجسم كله حول المحور الطولي.\nس2 (المستوى المتوقع): كيف نحافظ على اتزاننا بعد الدوران من الوثب؟\nالإجابة: بثني الركبتين عند الهبوط والنظر للأمام.\nس3 (المستوى المتقدم): أيهما أسرع: الدوران والذراعان مضمومتان أم مفتوحتان؟\nالإجابة: مضمومتان.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ نصف دورة من الوقوف ثم اثبت.\nالإجابة: يدور 180 درجة ويثبت.\nس2 (المستوى المتوقع): اذكر مسابقة رياضية يستخدم فيها الدوران.\nالإجابة: دفع الجلة أو قذف القرص أو الجمباز.\nس3 (المستوى المتقدم): أدِّ لفًا للجذع يمينًا ويسارًا من الوقوف فتحًا.\nالإجابة: يلف الجذع والقدمان ثابتتان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على نصف دورة ودورة كاملة من الوقوف مع الثبات بعدها (دليل المعلم ص 76-78)."}}, {"focus": "محطات وألعاب اللف والدوران", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف اللف والدوران في محطات ومسابقات بالكرة.\n2. يميز متى يستخدم اللف ومتى يستخدم الدوران في اللعبة.\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة اللف والدوران.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب", "المفاهيم": "- اللف\n- الدوران\n- التسليم\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم اللف والدوران بنداءات سريعة، ثم يعرض كرة ويسأل: كيف نسلم الكرة للزميل خلفنا دون أن ندور كاملًا؟ (بلف الجذع).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (13 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات اللف والدوران ص 80-81: محطة تسليم الكرة للزميل بلف الجذع في القطار، محطة الدوران حول القمع ومتابعة الجري، محطة الدوران من الوثب على المرتبة، محطة لف الذراعين بالكرة حول الجسم، بأربع مجموعات والتبديل.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب اللف والدوران) ص 82: قطارات على خط البداية، تمرر الكرة بلف الجذع من الأول حتى الأخير الذي يجري بها إلى المقدمة ويعيد التمرير، وتفوز المجموعة التي تعود إلى ترتيبها الأول أولًا.\n- الطالب: يلعب ويسلم الكرة بلف الجذع بدقة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا نلف الجذع ولا ندور بالكامل عند التسليم؟ ليستنتج التلاميذ أن اللف أسرع ويحفظ مكان القاعدة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): كيف سلمت الكرة للزميل خلفك؟\nالإجابة: بلف الجذع للجانب.\nس2 (المستوى المتوقع): في أي محطة دُرنا من الوثب؟\nالإجابة: محطة المرتبة.\nس3 (المستوى المتقدم): لماذا اللف أسرع من الدوران في تسليم الكرة؟\nالإجابة: لأن القدمين تبقيان ثابتتين ولا نحتاج إلى تغيير مكان الجسم.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: تسليم الكرة بلف الجذع، والدوران حول القمع (أو الوثب بالدوران، لف الذراعين).\nس2 (المستوى المتوقع): أدِّ دورة كاملة حول القمع ثم تابع الجري.\nالإجابة: يدور ويتابع دون سقوط.\nس3 (المستوى المتقدم): كيف تساعد مجموعتك على الفوز في لعبة تسليم الكرة؟\nالإجابة: ألف جذعي بسرعة وأسلم الكرة بدقة دون إسقاطها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك تمرير الكرة بلف الجذع في قطار من أفراد الأسرة (دليل المعلم ص 80-82)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي اللف والدوران والفرق بينهما.\n2. يؤدي لف الجذع والذراعين والدوران حول المحور الطولي.\n3. يحافظ على اتزانه بعد الدوران.\n\nالحصة 2:\n1. يوظف اللف والدوران في محطات ومسابقات بالكرة.\n2. يميز متى يستخدم اللف ومتى يستخدم الدوران في اللعبة.\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة اللف والدوران.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: مراتب\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- اللف\n- الدوران\n- المحور الطولي\n- الاتزان\n- نصف دورة\n\nالحصة 2:\n- اللف\n- الدوران\n- التسليم\n- المسابقة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيلف المعلم جذعه يمينًا ويسارًا ثم يدور دورة كاملة ويسأل: ما الفرق بين الحركتين؟ ويعرض صورة لاعب دفع الجلة وهو يدور.\n\nالحصة 2:\nيراجع المعلم اللف والدوران بنداءات سريعة، ثم يعرض كرة ويسأل: كيف نسلم الكرة للزميل خلفنا دون أن ندور كاملًا؟ (بلف الجذع).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ثم لف الجذع والذراعين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اللف (حركة جزء من الجسم حول محوره دون انتقال القاعدة: لف الجذع، دوران الذراع)، والدوران (حركة الجسم كله حول المحور الطولي مع تغيير القاعدة: نصف دورة، دورة كاملة من الوقوف ومن الوثب) مع الحفاظ على الاتزان (ص 76-77)، ثم تطبيق موجه.\n- الطالب: يؤدي اللف ثم الدوران نصف دورة فدورة كاملة ويثبت بعدها.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 78: يجرب التلميذ الدوران بالذراعين مفتوحتين ثم مضمومتين ويكتشف أيهما أسرع، ويجرب الهبوط بثني الركبتين بعد الدوران من الوثب ويستنتج ما يحفظ الاتزان.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (البوصلة): ينادي المعلم (نصف دورة) أو (دورة) أو (لف يمين) ويؤدي التلاميذ الحركة ويثبتون.\n- الطالب: يستجيب بالحركة الصحيحة ويحافظ على الثبات.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بلف بطيء للجذع والتنفس.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (13 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات اللف والدوران ص 80-81: محطة تسليم الكرة للزميل بلف الجذع في القطار، محطة الدوران حول القمع ومتابعة الجري، محطة الدوران من الوثب على المرتبة، محطة لف الذراعين بالكرة حول الجسم، بأربع مجموعات والتبديل.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب اللف والدوران) ص 82: قطارات على خط البداية، تمرر الكرة بلف الجذع من الأول حتى الأخير الذي يجري بها إلى المقدمة ويعيد التمرير، وتفوز المجموعة التي تعود إلى ترتيبها الأول أولًا.\n- الطالب: يلعب ويسلم الكرة بلف الجذع بدقة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا نلف الجذع ولا ندور بالكامل عند التسليم؟ ليستنتج التلاميذ أن اللف أسرع ويحفظ مكان القاعدة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الفرق بين اللف والدوران؟\nالإجابة: اللف حركة جزء من الجسم حول محوره، والدوران حركة الجسم كله حول المحور الطولي.\nس2 (المستوى المتوقع): كيف نحافظ على اتزاننا بعد الدوران من الوثب؟\nالإجابة: بثني الركبتين عند الهبوط والنظر للأمام.\nس3 (المستوى المتقدم): أيهما أسرع: الدوران والذراعان مضمومتان أم مفتوحتان؟\nالإجابة: مضمومتان.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف سلمت الكرة للزميل خلفك؟\nالإجابة: بلف الجذع للجانب.\nس2 (المستوى المتوقع): في أي محطة دُرنا من الوثب؟\nالإجابة: محطة المرتبة.\nس3 (المستوى المتقدم): لماذا اللف أسرع من الدوران في تسليم الكرة؟\nالإجابة: لأن القدمين تبقيان ثابتتين ولا نحتاج إلى تغيير مكان الجسم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ نصف دورة من الوقوف ثم اثبت.\nالإجابة: يدور 180 درجة ويثبت.\nس2 (المستوى المتوقع): اذكر مسابقة رياضية يستخدم فيها الدوران.\nالإجابة: دفع الجلة أو قذف القرص أو الجمباز.\nس3 (المستوى المتقدم): أدِّ لفًا للجذع يمينًا ويسارًا من الوقوف فتحًا.\nالإجابة: يلف الجذع والقدمان ثابتتان.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: تسليم الكرة بلف الجذع، والدوران حول القمع (أو الوثب بالدوران، لف الذراعين).\nس2 (المستوى المتوقع): أدِّ دورة كاملة حول القمع ثم تابع الجري.\nالإجابة: يدور ويتابع دون سقوط.\nس3 (المستوى المتقدم): كيف تساعد مجموعتك على الفوز في لعبة تسليم الكرة؟\nالإجابة: ألف جذعي بسرعة وأسلم الكرة بدقة دون إسقاطها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على نصف دورة ودورة كاملة من الوقوف مع الثبات بعدها (دليل المعلم ص 76-78).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك تمرير الكرة بلف الجذع في قطار من أفراد الأسرة (دليل المعلم ص 80-82)."}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "العاشر", "date": "8-12/11/2026", "pages": "دليل المعلم ص 24-28", "n": 2, "periods": [{"focus": "الممارسات الصحية: نظافة الملعب والأدوات والزي والحذاء الرياضي", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية نظافة الملعب والأدوات الرياضية.\n2. يختار الحذاء والزي الرياضي المناسب للحصة.\n3. يطبق سلوكيات المحافظة على نظافة الملعب والأدوات.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: أدوات رياضية\n- أخرى: سلة نفايات\n- أخرى: بطاقات مصورة لأحذية وملابس\n- أخرى: أقماع", "المفاهيم": "- النظافة\n- الأدوات الرياضية\n- الحذاء الرياضي\n- الزي الرياضي\n- العهدة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم كرة متسخة وأخرى نظيفة ويسأل: بأيهما تحب أن تلعب؟ ثم يعرض صور أحذية مختلفة ويسأل: أيها يناسب الجري؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور أهمية نظافة الملعب (خلوه من الحجارة والزجاج)، ونظافة الأدوات، واختيار الحذاء الرياضي (نعل مرن ورباط محكم) والزي القطني، مع نموذج ربط الحذاء.\n- الطالب: يستمع ويربط حذاءه بالطريقة الصحيحة.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (فريق النظافة): مجموعات تجمع (بطاقات أشياء) من الساحة وتصنفها: ما يبقى (أدوات) وما يُرمى في السلة (نفايات)، وتفوز الأسرع والأدق.\n- الطالب: يلعب ويصنف.\n\nالنشاط 4 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تضع كل مجموعة ثلاث قواعد للمحافظة على الأدوات (إعادتها لمكانها، عدم الجلوس على الكرات) وتعرضها.\n- الطالب: يتعاون ويعرض القواعد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتطبيق: إعادة الأدوات نظيفة إلى مكانها.\n- الطالب: يؤدي التهدئة ويعيد الأدوات.", "التقويم التكويني": "س1 (مستوى الدعم): لماذا نتأكد من نظافة الملعب قبل اللعب؟\nالإجابة: حتى لا نتعثر بالحجارة أو نصاب بالزجاج.\nس2 (المستوى المتوقع): ما مواصفات الحذاء الرياضي المناسب؟\nالإجابة: نعل مرن ورباط محكم ومقاس مناسب.\nس3 (المستوى المتقدم): ماذا نفعل بالأدوات بعد الحصة؟\nالإجابة: نعيدها نظيفة إلى مكانها.", "التقويم الختامي": "س1 (مستوى الدعم): أرفع صورة حذاء بكعب عالٍ، أيناسب الحصة؟\nالإجابة: لا، لأنه يسبب السقوط والإصابة.\nس2 (المستوى المتوقع): اذكر قاعدة وضعتها مجموعتك للمحافظة على الأدوات.\nالإجابة: مثل: لا نجلس على الكرات.\nس3 (المستوى المتقدم): كيف تساعد في نظافة الملعب؟\nالإجابة: أرمي النفايات في السلة وأبلغ المعلم عن أي شيء خطر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تأكد من مناسبة حذاء طفلك الرياضي ونظافة زيه، وذكّره بإعادة أدواته إلى مكانها (برنامج صحتي، دليل المعلم ص 26)."}}, {"focus": "المهرجان الرياضي التعليمي للحركات الأساسية (الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران)", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف الحركات الأساسية التي تعلمها في أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: كرات متوسطة\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- الحركات الأساسية\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أتحرك بنشاط) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام بالصور.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بنموذج المعلم يشمل الحركات الأربع.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 24-25: قسم الخطو الجانبي (بين الأقماع ذهابًا وإيابًا)، قسم ركضة الحصان (فوق الحبال)، قسم تبادل الخطو والحجل (فوق الحواجز المنخفضة)، قسم اللف والدوران (تسليم الكرة رة بلف الجذع والدوران حول القمع)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته بقيادة القائد.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع يجمع الحركات الأربع.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم المشاركين.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا نتأكد من نظافة الملعب قبل اللعب؟\nالإجابة: حتى لا نتعثر بالحجارة أو نصاب بالزجاج.\nس2 (المستوى المتوقع): ما مواصفات الحذاء الرياضي المناسب؟\nالإجابة: نعل مرن ورباط محكم ومقاس مناسب.\nس3 (المستوى المتقدم): ماذا نفعل بالأدوات بعد الحصة؟\nالإجابة: نعيدها نظيفة إلى مكانها.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الحركات الأربع في مهرجان اليوم؟\nالإجابة: الخطو الجانبي، ركضة الحصان، تبادل الخطو والحجل، اللف والدوران.\nس2 (المستوى المتوقع): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم ركضة الحصان.\nس3 (المستوى المتقدم): ما القاعدة عند الانتقال بين الأقسام؟\nالإجابة: الانتقال بنظام عند الإشارة بقيادة القائد.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أرفع صورة حذاء بكعب عالٍ، أيناسب الحصة؟\nالإجابة: لا، لأنه يسبب السقوط والإصابة.\nس2 (المستوى المتوقع): اذكر قاعدة وضعتها مجموعتك للمحافظة على الأدوات.\nالإجابة: مثل: لا نجلس على الكرات.\nس3 (المستوى المتقدم): كيف تساعد في نظافة الملعب؟\nالإجابة: أرمي النفايات في السلة وأبلغ المعلم عن أي شيء خطر.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر القسم الذي أحببته أكثر ولماذا.\nالإجابة: يذكر القسم ويعلل.\nس2 (المستوى المتوقع): أدِّ تبادل الخطو والحجل فوق حاجز منخفض.\nالإجابة: يؤديه بالحجلة فوق الحاجز.\nس3 (المستوى المتقدم): ماذا تقول لزميل لم يلتزم بدوره في القسم؟\nالإجابة: أذكره بلطف أن ننتظر دورنا حتى نلعب بأمان ونظام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من مناسبة حذاء طفلك الرياضي ونظافة زيه، وذكّره بإعادة أدواته إلى مكانها (برنامج صحتي، دليل المعلم ص 26).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا الحركات الأساسية في مكان آمن (دليل المعلم ص 60-82)."}}, {"title": "تنطيط الكرة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الحادي عشر", "date": "15-19/11/2026", "pages": "دليل المعلم ص 86-92", "n": 2, "periods": [{"focus": "تنطيط الكرة في المكان باليد اليمنى واليسرى", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة تنطيط الكرة ونقاطها الفنية.\n2. يؤدي تنطيط الكرة في المكان باليدين بالتبادل والنظر للأمام.\n3. يميز بين دفع الكرة بالأصابع وضربها براحة اليد.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التنطيط\n- التوافق\n- دفع الكرة\n- رسغ اليد\n- ارتداد الكرة", "التهيئة / التمهيد / التعلم القبلي": "ينطط المعلم كرة وهو ينظر للأمام ويسأل: كيف بقيت الكرة بجانبي دون أن تهرب؟ ويعرض صورة لاعب كرة سلة ينطط.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري بالكرة، رمي الكرة لأسفل والتقاطها، تحريك الرسغين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف ورجل متقدمة، انثناء بسيط في الركبتين، ثني المرفق والرسغ ثم مدهما لدفع الكرة بالأصابع في مستوى الحوض أمام الجسم وجانبه، والنظر للأمام (ص 86-87)، مع تطبيق موجه: دفع والتقاط، ثم تنطيط متصل.\n- الطالب: يؤدي الدفع والالتقاط ثم التنطيط المتصل باليمنى ثم اليسرى.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 88: يجرب التلميذ التنطيط بضرب الكرة براحة اليد ثم بدفعها بالأصابع، وبالنظر إلى الكرة ثم للأمام، ويكتشف أيهما يحفظ الكرة أكثر، فيستنتج النقاط الفنية.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (العدّاد): من ينطط أكبر عدد دون فقد الكرة في 20 ثانية، ثم باليد الأخرى.\n- الطالب: يلعب ويعد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بتدحرج الكرة حول الجسم والتنفس.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بأصابع اليد.\nس2 (المستوى المتوقع): في أي مستوى ننطط الكرة؟\nالإجابة: في مستوى الحوص (الحوض).\nس3 (المستوى المتقدم): لماذا ننظر للأمام أثناء التنطيط؟\nالإجابة: لنرى الزملاء والملعب ولا نصطدم.", "التقويم الختامي": "س1 (مستوى الدعم): نطط الكرة 10 مرات باليد اليمنى ثم 10 باليسرى.\nالإجابة: يؤديها دون فقد الكرة.\nس2 (المستوى المتوقع): ما الفرق بين الدفع بالأصابع والضرب بالراحة؟\nالإجابة: الدفع بالأصابع يتحكم في الكرة، والضرب بالراحة يجعلها تهرب.\nس3 (المستوى المتقدم): سمِّ لعبة رياضية فيها تنطيط.\nالإجابة: كرة السلة أو كرة اليد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على تنطيط كرة باليدين بالتبادل 20 مرة يوميًا مع النظر للأمام (دليل المعلم ص 86-88)."}}, {"focus": "تنطيط الكرة من الحركة وألعاب التنطيط", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تنطيط الكرة أثناء المشي والجري في مسارات.\n2. يوظف التنطيط في ألعاب ومسابقات.\n3. يشعر بالسعادة والرضا عند مشاركة زملائه أنشطة التنطيط.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق", "المفاهيم": "- التنطيط من الحركة\n- المسار\n- المحافظة على الكرة\n- قطع الكرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التنطيط في المكان بنموذج تلميذ، ثم ينطط وهو يمشي ويسأل: ما الذي تغير عندما تحركت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: تنطيط في المكان ثم مشي بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: دفع الكرة قليلًا للأمام أثناء المشي ثم الجري الخفيف مع إبقائها بجانب الجسم، ثم تطبيق موجه على خط مستقيم فمتعرج.\n- الطالب: يؤدي التنطيط من المشي ثم الجري.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 90-91: محطات بأربع مجموعات: تنطيط على خط مستقيم، تنطيط متعرج بين الأقماع، تنطيط داخل مربع صغير، تنطيط مع تبادل اليدين، والتبديل.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب تنطيط الكرة) ص 92: داخل مربع 15 م، ينطط كل تلميذ كرته ويحاول قطع كرات الآخرين مع المحافظة على كرته، ونقطة على من يفقد كرته، ويفوز الأقل نقاطًا.\n- الطالب: يلعب ويحافظ على كرته.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): إلى أين ندفع الكرة عند التنطيط أثناء المشي؟\nالإجابة: قليلًا للأمام بجانب الجسم.\nس2 (المستوى المتوقع): ما الهدف في لعبة المربع؟\nالإجابة: المحافظة على كرتي وقطع كرات الزملاء.\nس3 (المستوى المتقدم): لماذا يصعب التنطيط في المسار المتعرج؟\nالإجابة: لأننا نغير الاتجاه فنحتاج إلى التحكم في الكرة باليدين.", "التقويم الختامي": "س1 (مستوى الدعم): نطط الكرة بين الأقماع ذهابًا وإيابًا.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (المستوى المتوقع): اذكر محطتين من محطات التنطيط.\nالإجابة: الخط المستقيم والمتعرج (أو المربع، تبادل اليدين).\nس3 (المستوى المتقدم): كيف شعرت عندما حافظت على كرتك في اللعبة؟\nالإجابة: يعبر عن الرضا والثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على التنطيط أثناء المشي في الممر وتبديل اليدين (دليل المعلم ص 89-92)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة تنطيط الكرة ونقاطها الفنية.\n2. يؤدي تنطيط الكرة في المكان باليدين بالتبادل والنظر للأمام.\n3. يميز بين دفع الكرة بالأصابع وضربها براحة اليد.\n\nالحصة 2:\n1. يؤدي تنطيط الكرة أثناء المشي والجري في مسارات.\n2. يوظف التنطيط في ألعاب ومسابقات.\n3. يشعر بالسعادة والرضا عند مشاركة زملائه أنشطة التنطيط.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- التنطيط\n- التوافق\n- دفع الكرة\n- رسغ اليد\n- ارتداد الكرة\n\nالحصة 2:\n- التنطيط من الحركة\n- المسار\n- المحافظة على الكرة\n- قطع الكرة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nينطط المعلم كرة وهو ينظر للأمام ويسأل: كيف بقيت الكرة بجانبي دون أن تهرب؟ ويعرض صورة لاعب كرة سلة ينطط.\n\nالحصة 2:\nيراجع المعلم التنطيط في المكان بنموذج تلميذ، ثم ينطط وهو يمشي ويسأل: ما الذي تغير عندما تحركت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري بالكرة، رمي الكرة لأسفل والتقاطها، تحريك الرسغين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف ورجل متقدمة، انثناء بسيط في الركبتين، ثني المرفق والرسغ ثم مدهما لدفع الكرة بالأصابع في مستوى الحوض أمام الجسم وجانبه، والنظر للأمام (ص 86-87)، مع تطبيق موجه: دفع والتقاط، ثم تنطيط متصل.\n- الطالب: يؤدي الدفع والالتقاط ثم التنطيط المتصل باليمنى ثم اليسرى.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 88: يجرب التلميذ التنطيط بضرب الكرة براحة اليد ثم بدفعها بالأصابع، وبالنظر إلى الكرة ثم للأمام، ويكتشف أيهما يحفظ الكرة أكثر، فيستنتج النقاط الفنية.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (العدّاد): من ينطط أكبر عدد دون فقد الكرة في 20 ثانية، ثم باليد الأخرى.\n- الطالب: يلعب ويعد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بتدحرج الكرة حول الجسم والتنفس.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: تنطيط في المكان ثم مشي بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: دفع الكرة قليلًا للأمام أثناء المشي ثم الجري الخفيف مع إبقائها بجانب الجسم، ثم تطبيق موجه على خط مستقيم فمتعرج.\n- الطالب: يؤدي التنطيط من المشي ثم الجري.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 90-91: محطات بأربع مجموعات: تنطيط على خط مستقيم، تنطيط متعرج بين الأقماع، تنطيط داخل مربع صغير، تنطيط مع تبادل اليدين، والتبديل.\n- الطالب: يؤدي مهمة المحطة ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب تنطيط الكرة) ص 92: داخل مربع 15 م، ينطط كل تلميذ كرته ويحاول قطع كرات الآخرين مع المحافظة على كرته، ونقطة على من يفقد كرته، ويفوز الأقل نقاطًا.\n- الطالب: يلعب ويحافظ على كرته.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): بأي جزء من اليد ندفع الكرة في التنطيط؟\nالإجابة: بأصابع اليد.\nس2 (المستوى المتوقع): في أي مستوى ننطط الكرة؟\nالإجابة: في مستوى الحوص (الحوض).\nس3 (المستوى المتقدم): لماذا ننظر للأمام أثناء التنطيط؟\nالإجابة: لنرى الزملاء والملعب ولا نصطدم.\n\nالحصة 2:\nس1 (مستوى الدعم): إلى أين ندفع الكرة عند التنطيط أثناء المشي؟\nالإجابة: قليلًا للأمام بجانب الجسم.\nس2 (المستوى المتوقع): ما الهدف في لعبة المربع؟\nالإجابة: المحافظة على كرتي وقطع كرات الزملاء.\nس3 (المستوى المتقدم): لماذا يصعب التنطيط في المسار المتعرج؟\nالإجابة: لأننا نغير الاتجاه فنحتاج إلى التحكم في الكرة باليدين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): نطط الكرة 10 مرات باليد اليمنى ثم 10 باليسرى.\nالإجابة: يؤديها دون فقد الكرة.\nس2 (المستوى المتوقع): ما الفرق بين الدفع بالأصابع والضرب بالراحة؟\nالإجابة: الدفع بالأصابع يتحكم في الكرة، والضرب بالراحة يجعلها تهرب.\nس3 (المستوى المتقدم): سمِّ لعبة رياضية فيها تنطيط.\nالإجابة: كرة السلة أو كرة اليد.\n\nالحصة 2:\nس1 (مستوى الدعم): نطط الكرة بين الأقماع ذهابًا وإيابًا.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (المستوى المتوقع): اذكر محطتين من محطات التنطيط.\nالإجابة: الخط المستقيم والمتعرج (أو المربع، تبادل اليدين).\nس3 (المستوى المتقدم): كيف شعرت عندما حافظت على كرتك في اللعبة؟\nالإجابة: يعبر عن الرضا والثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على تنطيط كرة باليدين بالتبادل 20 مرة يوميًا مع النظر للأمام (دليل المعلم ص 86-88).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على التنطيط أثناء المشي في الممر وتبديل اليدين (دليل المعلم ص 89-92)."}}, {"title": "المراوغة والمحاورة", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 93-100", "n": 2, "periods": [{"focus": "المراوغة بالجسم والمحاورة بالكرة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي المراوغة والمحاورة وأهميتهما.\n2. يؤدي المحاورة بتنطيط الكرة مع تغيير الاتجاه.\n3. يميز بين المراوغة (بالجسم) والمحاورة (بالكرة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أعلام\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- المراوغة\n- المحاورة\n- تغيير الاتجاه\n- التخلص\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "يقف تلميذ أمام المعلم ويحاول المعلم المرور منه بتغيير اتجاهه فجأة ويسأل: ماذا فعلت لأمر؟ ويعرض صورة لاعب يحاور بالكرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري مع تغيير الاتجاه بالإشارة، تنطيط في المكان.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: المراوغة بالجسم (خطوة جانبًا مع ميل الجذع ثم الانطلاق للجهة الأخرى)، ثم المحاورة (تنطيط أسفل مستوى الحوض وتغيير اتجاه الجسم أثناء التنطيط والابتعاد عن المنافس) ص 94-95، فتطبيق موجه.\n- الطالب: يؤدي المراوغة بلا كرة ثم المحاورة بالكرة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 96: يجرب التلميذ المحاورة بتنطيط عالٍ ثم منخفض عند تغيير الاتجاه حول الأقماع ويكتشف أن التنطيط المنخفض يسهل تغيير الاتجاه ويحفظ الكرة.\n- الطالب: يجرب ويستنتج.\n\nالنش لاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 98-99: محطات: محاورة بين الأقماع ثم تصويب في طوق، مراوغة مدافع ثابت، محاورة مع تبديل اليد عند كل قمع، مراوغة في مثلث، بأربع مجموعات والتبديل.\n- الطالب: يؤدي مهمة المحطة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب المراوغة والمحاورة) ص 100: أربعة مربعات متقابلة، مجموعتان، تلميذان مدافعان بين المربعين، يحاول تلاميذ المجموعة العبور بالمحاورة إلى المربع المقابل دون أن يلمس المدافع كرتهم، ونقطة لكل عبور ناجح.\n- الطالب: يلعب ويحاور ويراوغ المدافعين.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى نجح العبور أكثر؟ ليستنتج التلاميذ أهمية تغيير الاتجاه المفاجئ والمساحة الآمنة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا يفعل المدافع في لعبة المربعات؟\nالإجابة: يحاول لمس كرة العابرين.\nس2 (المستوى المتوقع): متى يكون العبور أسهل؟\nالإجابة: عند تغيير الاتجاه فجأة بعيدًا عن المدافع.\nس3 (المستوى المتقدم): ماذا تعني المساحة الآمنة؟\nالإجابة: مساحة بعيدة عن المدافع تحاور فيها دون احتكاك.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المحاورة بين الأقماع والتصويب، ومراوغة المدافع الثابت.\nس2 (المستوى المتوقع): راوغ زميلك المدافع واعبر إلى المربع المقابل.\nالإجابة: يراوغ ويعبر دون فقد الكرة.\nس3 (المستوى المتقدم): كيف شعرت عندما عبرت من المدافع؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك دور المدافع ودعه يحاول المرور بالمحاورة في مساحة آمنة (دليل المعلم ص 98-100)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي المراوغة والمحاورة وأهميتهما.\n2. يؤدي المحاورة بتنطيط الكرة مع تغيير الاتجاه.\n3. يميز بين المراوغة (بالجسم) والمحاورة (بالكرة).\n\nالحصة 2:\n1. يوظف المراوغة والمحاورة في ألعاب ومنافسات بمدافعين.\n2. يختار الاتجاه المناسب للتخلص من المدافع.\n3. يشعر بالسعادة عند مشاركة زملائه أنشطة المراوغة والمحاورة.", "ا الب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (13 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 و4 ص 98-99: محطات: محاورة بين الأقماع ثم تصويب في طوق، مراوغة مدافع ثابت، محاورة مع تبديل اليد عند كل قمع، مراوغة في مثلث، بأربع مجموعات والتبديل.\n- الطالب: يؤدي مهمة المحطة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (ألعاب المراوغة والمحاورة) ص 100: أربعة مربعات متقابلة، مجموعتان، تلميذان مدافعان بين المربعين، يحاول تلاميذ المجموعة العبور بالمحاورة إلى المربع المقابل دون أن يلمس المدافع كرتهم، ونقطة لكل عبور ناجح.\n- الطالب: يلعب ويحاور ويراوغ المدافعين.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى نجح العبور أكثر؟ ليستنتج التلاميذ أهمية تغيير الاتجاه المفاجئ والمساحة الآمنة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الفرق بين المراوغة والمحاورة؟\nالإجابة: المراوغة تغيير اتجاه الجسم للتخلص من المنافس، والمحاورة تنطيط الكرة مع تغيير الاتجاه.\nس2 (المستوى المتوقع): لماذا ننطط الكرة منخفضة عند المحاورة؟\nالإجابة: لنغير الاتجاه بسهولة ولا يأخذها المنافس.\nس3 (المستوى المتقدم): اذكر لعبة فيها محاورة.\nالإجابة: كرة السلة أو كرة اليد.\n\nالحصة 2:\nس1 (مستوى الدعم): ماذا يفعل المدافع في لعبة المربعات؟\nالإجابة: يحاول لمس كرة العابرين.\nس2 (المستوى المتوقع): متى يكون العبور أسهل؟\nالإجابة: عند تغيير الاتجاه فجأة بعيدًا عن المدافع.\nس3 (المستوى المتقدم): ماذا تعني المساحة الآمنة؟\nالإجابة: مساحة بعيدة عن المدافع تحاور فيها دون احتكاك.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): حاور بالكرة حول ثلاثة أقماع.\nالإجابة: يحاور مع تغيير الاتجاه.\nس2 (المستوى المتوقع): كيف تتخلص من زميلك المدافع بالمراوغة؟\nالإجابة: أميل جانبًا ثم أنطلق للجهة الأخرى بسرعة.\nس3 (المستوى المتقدم): ماذا يحدث لو نططنا الكرة عالية أمام المدافع؟\nالإجابة: يسهل عليه قطعها.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المحاورة بين الأقماع والتصويب، ومراوغة المدافع الثابت.\nس2 (المستوى المتوقع): راوغ زميلك المدافع واعبر إلى المربع المقابل.\nالإجابة: يراوغ ويعبر دون فقد الكرة.\nس3 (المستوى المتقدم): كيف شعرت عندما عبرت من المدافع؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على المحاورة بالكرة حول أشياء في الحديقة مع التنطيط المنخفض (دليل المعلم ص 94-96).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك دور المدافع ودعه يحاول المرور بالمحاورة في مساحة آمنة (دليل المعلم ص 98-100)."}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 24-28", "n": 2, "periods": [{"focus": "الممارسات الصحية: الوجبة المدرسية الصحية وشرب الماء", "num": 1, "fields": {"المخرجات التعليمية": "1. يميز مكونات الوجبة المدرسية الصحية.\n2. يذكر أهمية شرب الماء قبل النشاط وبعده.\n3. يقدر أثر الغذاء الصحي والماء في نشاط الجسم.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور أطعمة\n- أخرى: زجاجات ماء\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- الوجبة الصحية\n- الماء\n- الطاقة\n- المقصف", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا أكلتم في الفسحة؟ ويعرض بطاقات (ساندويتش جبن، فاكهة، حلوى، مشروب غازي) ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم ثم شرب الماء برشفات.\n- الطالب: يقلد ويشرب.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يفكر المعلم بصوت عالٍ: الوجبة الصحية فيها خبز وبروتين (جبن أو بيض) وفاكهة أو خضار وماء أو حليب، والحلويات والمشروبات الغازية تضر الأسنان والصحة (برنامج صحتي ص 26).\n- الطالب: يستمع ويصنف البطاقات.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أركض إلى الصحة): طوقان (صحي، غير صحي)، يجري التلميذ ويسحب بطاقة ويضعها في الطوق الصحيح، ثم جولة ثانية بالتنطيط بالكرة.\n- الطالب: يلعب ويصنف.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تكوّن كل مجموعة وجبة مدرسية صحية من البطاقات وتعرضها وتشرح السبب.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة: أحضر وجبة صحية وزجاجة ماء.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر مكونين للوجبة المدرسية الصحية.\nالإجابة: خبز وجبن (أو فاكهة وحليب).\nس2 (المستوى المتوقع): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس3 (المستوى المتقدم): هل الشوكولاتة الكثيرة وجبة صحية؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير وتضر الأسنان.", "التقويم الختامي": "س1 (مستوى الدعم): أرفع صورة مشروب غازي، في أي طوق نضعه؟\nالإجابة: طوق غير صحي.\nس2 (المستوى المتوقع): كوّن وجبة مدرسية صحية.\nالإجابة: مثل: ساندويتش جبن وتفاحة وماء.\nس3 (المستوى المتقدم): ماذا تنصح زميلك الذي يشتري الحلوى كل يوم؟\nالإجابة: أنصحه باختيار الفاكهة أو ساندويتش صحي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: جهّز مع طفلك وجبة مدرسية صحية وزجاجة ماء، وناقشا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 26)."}}, {"focus": "المهرجان الرياضي التعليمي للمعالجة والتناول (التنطيط والمحاورة) والحركات الأساسية", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف التنطيط والمحاورة والحركات الأساسية في أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- التنطيط\n- المحاورة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (ألعب بالك
