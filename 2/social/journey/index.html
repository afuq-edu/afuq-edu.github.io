:root{
 --bg:#e9f5f8;--bg2:#fff6e6;--card:#ffffff;--ink:#22323a;--soft:#5f7680;--line:#d7e7ec;
 --u1:#f2875a;--u1s:#fde6da;--u2:#8b6bd6;--u2s:#ece5fb;--u3:#18998a;--u3s:#dcf3ef;
 --ok:#3fae6a;--oks:#e2f6e9;--no:#e46c6c;--nos:#fde8e8;--sun:#ffc84a;--accent:var(--u1);--accents:var(--u1s);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a33;--bg2:#22323b;--card:#26363f;--ink:#eef5f7;--soft:#a9bec6;--line:#3a4d57;--u1s:#4a3227;--u2s:#352c4f;--u3s:#1f3f3b;--oks:#20402c;--nos:#4a2626}}
:root[data-theme="dark"]{--bg:#1b2a33;--bg2:#22323b;--card:#26363f;--ink:#eef5f7;--soft:#a9bec6;--line:#3a4d57;--u1s:#4a3227;--u2s:#352c4f;--u3s:#1f3f3b;--oks:#20402c;--nos:#4a2626}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 80% 0%,var(--bg2),var(--bg) 60%);color:var(--ink);font-family:'KufiK','Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid #7cc4e8;outline-offset:3px}
#app{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
/* top bar */
.top{height:84px;display:flex;align-items:center;gap:14px;padding:0 28px}
.tbtn{width:60px;height:60px;border-radius:20px;border:2px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:28px}
.tbtn svg{width:30px;height:30px}
.ltitle{font-size:30px;font-weight:800;color:var(--accent)}
.unitb{font-size:20px;color:var(--soft);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 16px}
.sp{flex:1}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:.3s}
.dots i.on{background:var(--accent);width:34px;border-radius:8px}
.dots i.done{background:var(--accent);opacity:.45}
.stage{flex:1;position:relative;margin:0 28px;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px}
.enter-n{animation:inN .55s cubic-bezier(.2,.8,.2,1)}
.enter-p{animation:inP .55s cubic-bezier(.2,.8,.2,1)}
@keyframes inN{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
.nav{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 36px}
.nbtn{height:78px;min-width:200px;border-radius:26px;border:0;font-size:30px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:0 30px}
.nbtn.next{background:var(--accent);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.nbtn.prev{background:var(--card);border:2px solid var(--line);color:var(--soft)}
.nbtn:disabled{opacity:.35}
.nbtn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.h{font-size:50px;font-weight:800;margin:0 0 4px;color:var(--ink);text-align:center;line-height:1.35}
.sub{font-size:30px;color:var(--soft);margin:0 0 14px;text-align:center}
.ask{font-size:36px;font-weight:700;color:var(--accent);margin:0 0 16px;text-align:center}
/* mascot */
.mascot{display:flex;align-items:center;gap:12px;pointer-events:none;flex:1;justify-content:center;padding:0 20px}
.mascot svg{width:86px;height:86px;flex:none;animation:bob 3s ease-in-out infinite}
.bubble{background:var(--card);border:3px solid var(--sun);border-radius:26px 26px 26px 6px;padding:12px 20px;font-size:24px;max-width:760px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.08);border-radius:26px 26px 26px 26px;opacity:0;transform:translateY(8px);transition:.35s}
.bubble.show{opacity:1;transform:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
/* home */
.home{align-items:center;padding:20px 40px}
.htitle{display:flex;align-items:center;gap:22px;margin-top:4px}
.htitle h1{font-size:66px;margin:0;color:var(--u3);font-weight:800}
.htitle p{margin:0;font-size:28px;color:var(--soft)}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:100%;margin-top:24px}
.unit{border-radius:36px;padding:22px 22px 26px;background:var(--card);border:3px solid var(--line);position:relative}
.unit h2{margin:0 0 4px;font-size:30px}
.unit .ue{font-size:62px;position:absolute;left:22px;top:12px}
.unit small{display:block;font-size:20px;color:var(--soft);margin-bottom:14px}
.lbtn{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:24px;padding:14px 18px;margin-top:12px;font-size:28px;font-weight:700;text-align:right;transition:transform .15s}
.lbtn:hover{transform:translateY(-3px)}
.lbtn .le{font-size:42px;width:56px;text-align:center}
.lbtn .st{margin-inline-start:auto;font-size:20px;font-weight:600;opacity:.85;white-space:nowrap}
.hfoot{margin-top:18px;font-size:22px;color:var(--soft)}
/* scene */
.scene{width:1180px;height:370px;border-radius:40px;position:relative;overflow:hidden;box-shadow:inset 0 -10px 0 rgba(0,0,0,.05)}
.scene .gnd{position:absolute;left:0;right:0;bottom:0;height:110px}
.scene .it{position:absolute;bottom:70px;line-height:1;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.15))}
.scene .it svg{display:block}
.bg-sky{background:linear-gradient(#bfe6fb,#e9f7fd 70%)}.bg-sky .gnd{background:#a9dc8e}
.bg-room{background:linear-gradient(#ffe9c9,#fff4e3)}.bg-room .gnd{background:#e8c08f}
.bg-farm{background:linear-gradient(#ffe7a3,#fff6d9)}.bg-farm .gnd{background:#d9b77a}
.bg-sunset{background:linear-gradient(#ffd0b0,#fff0e0)}.bg-sunset .gnd{background:#d9a774}
.bg-night{background:linear-gradient(#9bb8e6,#dbe8fb)}.bg-night .gnd{background:#9cc98a}
.bg-majlis{background:linear-gradient(#f5e2c8,#fbf0df)}.bg-majlis .gnd{background:#b9855a}
.cap{margin-top:14px;font-size:38px;font-weight:700;text-align:center;max-width:1300px;line-height:1.55;min-height:118px}
.cap .tag{display:inline-block;background:var(--accents);color:var(--accent);border-radius:999px;padding:0 18px;margin-inline-start:10px}
.srow{display:flex;gap:14px;align-items:center;margin-top:6px}
.pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 22px;font-size:24px;font-weight:700}
.pill.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.sdots{display:flex;gap:8px}
.sdots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.sdots i.on{background:var(--accent)}
/* cover */
.cover{justify-content:center;gap:6px}
.big{font-size:150px;line-height:1.1;animation:bob 3s ease-in-out infinite}
.lnum{font-size:26px;color:#fff;background:var(--accent);border-radius:999px;padding:4px 22px;font-weight:700}
.ctitle{font-size:96px;font-weight:800;color:var(--accent);margin:0;line-height:1.3}
.cq{font-size:38px;font-weight:700;background:var(--card);border:3px dashed var(--accent);border-radius:30px;padding:12px 30px;margin-top:10px}
/* cards & options */
.grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:1400px}
.card{border:4px solid var(--line);background:var(--card);border-radius:30px;padding:18px 26px;font-size:34px;font-weight:700;display:flex;align-items:center;gap:14px;transition:transform .15s,background .25s,border-color .25s;min-height:96px}
.card:hover:not(:disabled){transform:translateY(-4px) rotate(-1deg)}
.card .e{font-size:48px}
.card.ok{background:var(--oks);border-color:var(--ok)}
.card.no{background:var(--nos);border-color:var(--no)}
.card.sel{border-color:var(--accent);background:var(--accents);transform:scale(1.04)}
.card.gone{opacity:.25}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pop{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.progress{font-size:26px;color:var(--soft);font-weight:700;margin-bottom:10px}
.progress b{color:var(--accent)}
/* fish */
.sea{width:1300px;height:470px;border-radius:40px;background:linear-gradient(#bfe9ff,#4fb3e0);position:relative;overflow:hidden}
.sea .boat{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:90px}
.fish{position:absolute;border:0;background:transparent;font-size:31px;font-weight:800;color:#1f3a4a;animation:swim 6s ease-in-out infinite}
.fish .fb{display:flex;align-items:center;gap:6px;background:#ffe9a8;border-radius:70px 34px 34px 70px;padding:16px 30px 16px 22px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.fish .fb:after{content:'';position:absolute;left:-30px;top:50%;transform:translateY(-50%);border:22px solid transparent;border-right:30px solid #ffe9a8}
.fish .eye{width:10px;height:10px;border-radius:50%;background:#1f3a4a;margin-inline-end:8px}
.fish.ok .fb{background:#c9f0d4}.fish.ok .fb:after{border-right-color:#c9f0d4}
.fish.ok{animation:caught .9s forwards}
@keyframes swim{50%{transform:translateX(26px) translateY(-8px)}}
@keyframes caught{to{transform:translateY(-330px) scale(.7);opacity:0}}
/* match */
.mcols{display:flex;gap:90px;justify-content:center;width:100%}
.mcol{display:flex;flex-direction:column;gap:10px;width:600px}
.mcol .card{font-size:28px;min-height:64px;padding:8px 22px;width:100%}
/* order */
.slots{display:flex;flex-direction:column;gap:12px;width:900px;margin-bottom:18px}
.slot{height:74px;border:4px dashed var(--line);border-radius:24px;display:flex;align-items:center;gap:16px;padding:0 18px;font-size:30px;font-weight:700}
.slot i{font-style:normal;width:48px;height:48px;border-radius:50%;background:var(--accents);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.slot.fill{border-style:solid;border-color:var(--ok);background:var(--oks)}
/* sort */
.sortwrap{display:flex;align-items:center;gap:60px;margin-top:6px}
.bin{width:330px;height:330px;border-radius:44px;border:5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:800;gap:6px;transition:transform .15s}
.bin:hover{transform:translateY(-5px)}
.bin .be{font-size:96px}
.bin .bc{font-size:24px;color:var(--soft)}
.bin.b0{border-color:var(--ok);background:var(--oks)}
.bin.b1{border-color:var(--no);background:var(--nos)}
.scard{width:470px;min-height:250px;border-radius:40px;background:var(--card);border:5px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:38px;font-weight:800;padding:20px;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.08)}
.scard .e{font-size:90px}
.fly0{animation:fly0 .55s forwards}.fly1{animation:fly1 .55s forwards}
@keyframes fly0{to{transform:translateX(360px) scale(.3);opacity:0}}
@keyframes fly1{to{transform:translateX(-360px) scale(.3);opacity:0}}
/* quiz */
.qbox{width:1250px;background:var(--card);border:4px solid var(--line);border-radius:40px;padding:22px 34px;text-align:center}
.qbox .qe{font-size:96px;line-height:1.1}
.qbox .qt{font-size:40px;font-weight:800;margin:8px 0 18px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opts .card{justify-content:center;font-size:32px}
.opts.one{grid-template-columns:1fr}
.after{font-size:34px;font-weight:700;color:var(--ok);margin-top:14px;min-height:50px;text-align:center}
/* riddle */
.clues{display:flex;flex-direction:column;gap:12px;width:1100px;margin-bottom:16px}
.clue{font-size:34px;font-weight:700;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:12px 24px}

.wwrap{display:flex;align-items:center;gap:60px}
.wheel{width:520px;height:520px;position:relative}
.wheel svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.15,1)}
.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border:26px solid transparent;border-top:52px solid var(--ink);z-index:2}
.wres{width:600px;min-height:300px;border-radius:40px;background:var(--card);border:4px dashed var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}
.wres .r{font-size:44px;font-weight:800;line-height:1.5}
.gbtn{border:0;background:var(--accent);color:#fff;font-size:34px;font-weight:800;border-radius:28px;padding:16px 40px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.gbtn.alt{background:var(--card);color:var(--accent);border:3px solid var(--accent);box-shadow:none}

.board{display:flex;gap:14px;direction:rtl;margin:40px 0 12px}
.sq{width:104px;height:104px;border-radius:24px;background:var(--card);border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--soft);position:relative}
.sq.on{border-color:var(--accent);background:var(--accents);color:var(--accent)}
.sq .tok{position:absolute;top:-46px;font-size:56px;animation:hop .35s}
@keyframes hop{40%{transform:translateY(-34px)}}
.drow{display:flex;align-items:center;gap:40px}
.die{width:120px;height:120px;border-radius:28px;background:#fff;border:5px solid #22323a;display:grid;grid-template-columns:repeat(3,1fr);padding:14px;gap:4px}
.die i{border-radius:50%;background:#22323a;opacity:0;align-self:center;justify-self:center;width:26px;height:26px}
.die i.v{opacity:1}
.die.roll{animation:roll .9s}
@keyframes roll{25%{transform:rotate(90deg) scale(.9)}50%{transform:rotate(200deg)}75%{transform:rotate(300deg) scale(1.05)}100%{transform:rotate(360deg)}}
.dcard{width:1000px;background:var(--card);border:4px solid var(--accent);border-radius:36px;padding:12px 24px;text-align:center}
.dcard .ds{font-size:34px;font-weight:800;margin-bottom:10px}
.dcard .card{min-height:70px;font-size:28px;padding:10px 20px}
.dcard .opts{gap:10px}
/* flag */
.flagwrap{display:flex;gap:50px;align-items:flex-start}
.pennant{width:560px;position:relative}
.pennant svg{width:560px;height:520px;display:block}
.ptraits{position:absolute;top:130px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.ptraits span{font-size:34px;font-weight:800;background:var(--accent);border-radius:999px;padding:4px 26px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.tchips{display:flex;flex-wrap:wrap;gap:14px;width:760px}
.tchips .card{font-size:28px;min-height:70px;padding:10px 20px}
/* vote */
.vrow{display:flex;gap:24px}
.vopt{width:270px;border-radius:36px;background:var(--card);border:4px solid var(--line);padding:18px;text-align:center}
.vopt .e{font-size:90px}
.vopt .n{font-size:32px;font-weight:800}
.vopt .c{font-size:60px;font-weight:800;color:var(--accent)}
.vopt .bb{display:flex;justify-content:center;gap:14px}
.vopt .bb button{width:64px;height:64px;border-radius:20px;border:3px solid var(--line);background:var(--bg2);font-size:36px;font-weight:800}
.vopt.win{border-color:var(--ok);background:var(--oks);transform:scale(1.05)}
/* idea */
.ideas{display:flex;gap:30px;justify-content:center;flex-wrap:wrap}
.flip{width:440px;height:400px;perspective:1200px;border:0;background:transparent;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:40px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.flip .f{background:var(--accent);color:#fff}
.flip .f .e{font-size:120px;line-height:1.1}
.flip .f .w{font-size:52px;font-weight:800}
.flip .f small{font-size:22px;opacity:.9}
.flip .b{background:var(--card);border:5px solid var(--accent);transform:rotateY(180deg);font-size:34px;font-weight:700;line-height:1.6}
.verse{margin-top:22px;font-size:40px;font-weight:700;color:var(--accent);background:var(--card);border-radius:28px;padding:10px 30px;border:3px solid var(--line)}
.chips2{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:22px}
/* end */
.endl{display:flex;flex-direction:column;gap:14px;width:1100px;margin:10px 0 18px}
.endl div{font-size:36px;font-weight:700;background:var(--card);border:3px solid var(--line);border-radius:26px;padding:12px 26px;display:flex;gap:16px;align-items:center}
.endl div b{color:var(--ok);font-size:40px}
.stars{font-size:70px;letter-spacing:6px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(.6);font-size:110px;opacity:0;pointer-events:none;z-index:9}
.toast.go{animation:toast 1.1s ease}
@keyframes toast{25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,g,w,slide){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(w||0),o=a.createOscillator(),v=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g||.12,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,g,f){if(muted)return;const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f||1200;const v=a.createGain();v.gain.value=g||.08;s.connect(fl);fl.connect(v);v.connect(a.destination);s.start()}

if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,500);setTimeout(loadVoices,1500)}
/* browsers keep audio locked until the first tap/click: unlock it once so effects and speech work on computers too */
function unlockAudio(){try{const a=ac();if(a){const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}if('speechSynthesis'in window)speechSynthesis.resume()}catch(e){}}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,function f(){unlockAudio();removeEventListener(ev,f)},{passive:true}));
let noVoiceToast=false;
function speak(t){if(muted||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();speechSynthesis.resume();if(!arVoice&&!noVoiceToast){noVoiceToast=true;say('إن لم تسمع الصوت: أضف صوتًا عربيًا في إعدادات الجهاز، أو جرّب متصفح Edge')}const u=new SpeechSynthesisUtterance(t);if(arVoice){u.voice=arVoice;u.lang=arVoice.lang}else u.lang='ar-SA';u.rate=.85;u.volume=1;setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},60)}catch(e){}}

function confetti(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=fx,x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#f2875a','#8b6bd6','#18998a','#ffc84a','#5cb6e8','#ff8fb0'];const P=Array.from({length:n||120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:8+Math.random()*8,h:10+Math.random()*10,vy:2+Math.random()*2.5,vx:-1+Math.random()*2,r:Math.random()*6,vr:-.08+Math.random()*.16,c:cols[Math.floor(Math.random()*cols.length)]}));const t0=performance.now();(function f(){const t=performance.now()-t0;x.clearRect(0,0,c.width,c.height);const fade=t>2600?Math.max(0,1-(t-2600)/900):1;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.r+=p.vr;x.save();x.globalAlpha=fade;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(fade>0)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
