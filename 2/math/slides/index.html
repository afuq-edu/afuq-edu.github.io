<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){var k='ofuq-g2-unlock-slides';function g(n,x){try{return window[n].getItem(x)==='1'}catch(e){return false}}if(g('localStorage',k)||g('sessionStorage',k)||g('localStorage','afuq-all')||g('sessionStorage','afuq-all'))return;document.documentElement.style.display='none';location.replace('../?lock=slides')})()</script><script src="/assets/pkgmode.js" data-role="page"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رياضيات الصف الثاني — العروض التفاعلية (الفصل الأول)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EAF6FF; --cream:#FFF9EC; --ink:#1F2A44; --ink2:#55607A; --line:#E3E9F3;
  --blue:#1E9BE0; --yellow:#F2B90F; --green:#5DBB3F; --violet:#7B5CE6;
  --orange:#FF8A3D; --pink:#F2557A; --teal:#15B5A6; --red:#E8424F;
  --ok:#2FB463; --bad:#E8424F; --card:#fff;
  --u:#1E9BE0; --u2:#D7EEFC;
  --hf:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;
  --bf:'Tajawal','Baloo Bhaijaan 2',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(160deg,#E4F4FF 0%,#FFF7E6 100%);color:var(--ink);font-family:var(--bf);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0}
.hidden{display:none!important}

/* ===================== HOME ===================== */
#home{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 40px}
.hero{max-width:1200px;margin:18px auto 10px;background:linear-gradient(120deg,#1E9BE0,#47C1F5 55%,#7FD6FF);border-radius:28px;padding:26px 30px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 30px -12px rgba(30,155,224,.6)}
.hero h1{font-family:var(--hf);font-size:clamp(26px,4.2vw,46px);margin:0;line-height:1.15;font-weight:800}
.hero p{margin:8px 0 0;font-size:clamp(14px,1.8vw,19px);opacity:.95}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .chip{background:rgba(255,255,255,.22);padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px}
.hero .deco{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-family:var(--hf);font-size:120px;font-weight:800;opacity:.18;letter-spacing:-4px}
.hero .deco2{position:absolute;left:-30px;bottom:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.resume{max-width:1200px;margin:10px auto 0;display:flex}
.resume button{background:#fff;border-radius:16px;padding:10px 18px;font-weight:800;color:var(--blue);box-shadow:0 4px 14px -6px rgba(0,0,0,.2);font-size:15px}
.unit{max-width:1200px;margin:22px auto 0}
.unit-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.unit-h .tag{font-family:var(--hf);font-weight:800;color:#fff;padding:4px 16px;border-radius:14px;font-size:20px}
.unit-h h2{margin:0;font-family:var(--hf);font-size:clamp(18px,2.4vw,24px);font-weight:700}
.unit-h .cnt{color:var(--ink2);font-size:14px;margin-inline-start:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.lcard{background:#fff;border-radius:20px;padding:14px 14px 12px;text-align:right;box-shadow:0 6px 18px -10px rgba(31,42,68,.35);border:2px solid transparent;transition:transform .18s,border-color .18s;position:relative;display:flex;flex-direction:column;gap:6px;min-height:118px}
.lcard:hover{transform:translateY(-3px);border-color:var(--c)}
.lcard .top{display:flex;align-items:center;gap:8px}
.lcard .ico{width:44px;height:44px;border-radius:14px;background:var(--cl);display:grid;place-items:center;font-size:24px;flex:none}
.lcard .pg{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--c);background:var(--cl);padding:3px 9px;border-radius:99px}
.lcard .t{font-family:var(--hf);font-weight:800;font-size:18px;line-height:1.3;color:var(--ink)}
.lcard .s{font-size:12.5px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px}
.lcard .num{position:absolute;bottom:10px;left:12px;font-size:12px;color:#9AA6BD;font-weight:700}
.foot{max-width:1200px;margin:30px auto 0;color:var(--ink2);font-size:13px;text-align:center}

/* ===================== DECK ===================== */
#deck{position:absolute;inset:0;display:flex;flex-direction:column}
#vp{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform-origin:center center;}
.frame{position:absolute;inset:0;background:#fff;border-radius:30px;box-shadow:0 18px 50px -20px rgba(31,42,68,.45);overflow:hidden;display:flex;flex-direction:column}
.shead{height:74px;flex:none;display:flex;align-items:center;gap:14px;padding:0 26px;background:linear-gradient(90deg,var(--u2),#fff);border-bottom:2px solid var(--line)}
.phase{display:flex;align-items:center;gap:8px;font-family:var(--hf);font-weight:800;font-size:19px;color:#fff;padding:6px 16px 4px;border-radius:14px;background:var(--pc)}
.stitle{font-family:var(--hf);font-weight:800;font-size:28px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:720px}
.slesson{margin-inline-start:auto;font-size:15px;color:var(--ink2);font-weight:700;text-align:left;line-height:1.25}
.slesson b{color:var(--u);font-family:var(--hf);font-size:17px}
.sbody{flex:1;position:relative;padding:20px 30px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.sbody.center{justify-content:center;align-items:center}

/* bottom bar */
#bar{flex:none;height:64px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bb{height:46px;min-width:46px;border-radius:14px;background:#F1F5FB;color:var(--ink);font-size:20px;display:grid;place-items:center;padding:0 10px;font-weight:800;transition:background .15s}
.bb:hover{background:#E3ECF8}
.bb.main{background:var(--u);color:#fff;min-width:64px;font-size:24px}
.bb.on{background:var(--ink);color:#fff}
#prog{flex:1;display:flex;gap:4px;align-items:center;height:46px;overflow:hidden;padding:0 6px}
#prog i{flex:1;height:12px;border-radius:6px;background:#E3E9F3;cursor:pointer;position:relative;min-width:6px;transition:transform .15s}
#prog i:hover{transform:scaleY(1.5)}
#prog i.done{background:var(--pc);opacity:.45}
#prog i.cur{background:var(--pc);opacity:1;transform:scaleY(1.6)}
#cnt{font-family:var(--hf);font-weight:800;font-size:17px;color:var(--ink2);min-width:70px;text-align:center}

/* side menu */
#menu{position:absolute;top:0;bottom:64px;right:0;width:min(380px,92vw);background:#fff;box-shadow:-10px 0 40px -10px rgba(0,0,0,.25);z-index:30;overflow-y:auto;padding:14px;transform:translateX(105%);transition:transform .25s}
#menu.open{transform:none}
#menu h3{font-family:var(--hf);margin:4px 6px 10px;font-size:20px}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:#F7F9FC;border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:15px;color:var(--ink)}
.mi.cur{outline:3px solid var(--u)}
.mi .d{width:12px;height:12px;border-radius:50%;flex:none}
.mi .n{color:var(--ink2);font-weight:800;min-width:24px}
#notes{position:absolute;left:12px;bottom:76px;width:min(470px,94vw);max-height:60%;overflow:auto;background:#FFFBEA;border:2px solid #F5D76E;border-radius:18px;padding:14px 16px;z-index:25;box-shadow:0 14px 30px -12px rgba(0,0,0,.3);font-size:16px;line-height:1.75}
#notes h4{margin:0 0 6px;font-family:var(--hf);font-size:18px;color:#9A6B00}
#notes .x{position:absolute;top:8px;left:10px;background:none;font-size:20px}

/* ============ common slide parts ============ */
.lead{font-size:26px;line-height:1.6;font-weight:500;color:var(--ink)}
.lead b,.hl{color:var(--u);font-weight:800}
.row{display:flex;gap:18px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.fill{flex:1;min-height:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;min-height:0;align-items:stretch}
.vfit{flex:1;min-height:0;min-width:0;width:100%;overflow:hidden}
.split.w{grid-template-columns:1.25fr 1fr}
.split.n{grid-template-columns:.85fr 1.15fr}
.vizbox{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;min-height:0}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{font-size:23px;line-height:1.5;padding:8px 14px 8px 14px;background:#F6F9FD;border-radius:14px;border-inline-start:6px solid var(--u);animation:popin .35s both}
.tip{display:flex;gap:10px;align-items:flex-start;background:#FFF6D8;border:2px dashed #F2C94C;border-radius:18px;padding:10px 14px;font-size:20px;line-height:1.5;color:#6B5200}
.tip .m{font-size:34px;line-height:1}
.btn{background:var(--u);color:#fff;font-family:var(--hf);font-weight:800;font-size:22px;padding:8px 24px 6px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.alt{background:#fff;color:var(--u);border:3px solid var(--u)}
.btn.ok{background:var(--ok)}.btn.org{background:var(--orange)}.btn.vio{background:var(--violet)}.btn.pink{background:var(--pink)}
.btn.sm{font-size:18px;padding:5px 16px 4px}
.btn:disabled{opacity:.45}
.qbox{font-family:var(--hf);font-size:32px;font-weight:700;line-height:1.45;color:var(--ink)}
.qbox.sm{font-size:26px}
.why{background:#EAF8EF;border-radius:16px;padding:10px 16px;font-size:21px;line-height:1.55;color:#1D6B3B;animation:popin .3s both}
.why.bad{background:#FDECEE;color:#8E2330}
.center{text-align:center}
.big{font-family:var(--hf);font-weight:800}
@keyframes popin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .45s}
.good{box-shadow:0 0 0 4px var(--ok) inset!important;background:#E7F8EE!important}
.badc{box-shadow:0 0 0 4px var(--bad) inset!important;background:#FDECEE!important}

/* cover */
.cover{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:26px;min-height:0}
.cover .ttl{font-family:var(--hf);font-weight:800;font-size:64px;line-height:1.1;color:var(--u);margin:6px 0 4px}
.cover .sub{font-size:22px;color:var(--ink2);font-weight:700}
.cover .pg{display:inline-flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cover .pg span{background:var(--u2);color:var(--ink);font-weight:800;padding:6px 14px;border-radius:12px;font-size:17px}
.cbox{background:#F7FAFE;border-radius:20px;padding:14px 18px;border:2px solid var(--line)}
.cbox h4{margin:0 0 8px;font-family:var(--hf);font-size:21px;color:var(--u);display:flex;gap:8px;align-items:center}
.cbox ul{margin:0;padding-inline-start:22px;font-size:19px;line-height:1.6}
.vocab{display:flex;flex-direction:column;gap:6px}
.vocab div{font-size:18px;line-height:1.5}
.vocab b{color:var(--pink);font-family:var(--hf)}
.flow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.flow span{font-size:15px;font-weight:800;color:#fff;padding:5px 10px;border-radius:10px}
.cover .em{font-size:110px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15));animation:bounce 2.6s ease-in-out infinite}

/* mcq */
.opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.opt{min-width:150px;padding:12px 22px 9px;border-radius:20px;background:#fff;border:3px solid var(--line);font-family:var(--hf);font-size:30px;font-weight:800;color:var(--ink);box-shadow:0 5px 0 #DCE4F0;transition:transform .12s}
.opt:hover{transform:translateY(-2px);border-color:var(--u)}
.opt.sm{font-size:23px;min-width:120px}
.opt.good{border-color:var(--ok)}
.opt.badc{border-color:var(--bad)}

/* fill */
.fitems{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.fitems.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.fitem{display:flex;align-items:center;gap:10px;font-family:var(--hf);font-size:32px;font-weight:700;background:#F7FAFE;border-radius:18px;padding:8px 16px;border:2px solid var(--line);direction:rtl;flex-wrap:wrap}
.fitem.good{border-color:var(--ok)}
.blank{min-width:86px;height:56px;border-radius:14px;border:3px dashed #9FB3CF;background:#fff;display:inline-grid;place-items:center;font-size:32px;font-weight:800;color:var(--u);padding:0 10px;cursor:pointer}
.blank.act{border-style:solid;border-color:var(--u);box-shadow:0 0 0 4px rgba(30,155,224,.18)}
.blank.right{border-style:solid;border-color:var(--ok);color:var(--ok);background:#EFFBF3}
.blank.wrong{border-style:solid;border-color:var(--bad);color:var(--bad)}
.blank.w2{min-width:140px}.blank.w3{min-width:230px;font-size:24px}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{width:62px;height:58px;border-radius:14px;background:#EEF3FA;font-family:var(--hf);font-size:30px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 #D3DCE9}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #D3DCE9}
.pad .k-del{background:#FFE9EC;color:var(--bad)}
.pad .k-ok{background:var(--ok);color:#fff;width:96px;box-shadow:0 4px 0 #1E8A49}
.pad .k-w{width:auto;padding:0 12px;font-size:22px}

/* order / sort / match */
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:84px;padding:10px;border-radius:20px;background:#F7FAFE;border:2px dashed var(--line)}
.chipn{min-width:92px;padding:10px 18px 7px;border-radius:18px;background:#fff;border:3px solid var(--u);color:var(--ink);font-family:var(--hf);font-size:30px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.08);animation:popin .3s both;text-align:center}
.chipn.sel{background:var(--u);color:#fff;transform:translateY(-4px)}
.chipn.used{opacity:.25;pointer-events:none}
.slots{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.slot{min-width:110px;height:78px;border-radius:18px;border:3px dashed #9FB3CF;display:grid;place-items:center;font-family:var(--hf);font-size:30px;font-weight:800;background:#fff}
.slot.f{border-style:solid;border-color:var(--u);color:var(--u)}
.arrow{font-size:30px;color:#9FB3CF;font-weight:800}
.bins{display:flex;gap:16px;justify-content:center;flex:1;min-height:0}
.bin{flex:1;max-width:400px;border-radius:24px;border:3px solid var(--bc,#9FB3CF);background:var(--bb,#F7FAFE);display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px;cursor:pointer;transition:transform .15s}
.bin:hover{transform:translateY(-3px)}
.bin h5{margin:0;font-family:var(--hf);font-size:24px;color:var(--bc)}
.bin .in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bin .in .chipn{font-size:22px;min-width:60px;padding:6px 10px 4px;border-width:2px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:20px 80px;flex:1;align-content:center;position:relative}
.mcol{display:flex;flex-direction:column;gap:12px}
.mcard{min-height:70px;border-radius:18px;background:#fff;border:3px solid var(--line);font-family:var(--hf);font-size:27px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;box-shadow:0 4px 0 #DCE4F0;text-align:center;line-height:1.3}
.mcard.sel{border-color:var(--u);background:#EAF6FF}
.mcard.done{border-color:var(--mc);background:var(--mb);color:var(--ink);pointer-events:none}

/* discuss */
.dlist{display:flex;flex-direction:column;gap:12px}
.dq{background:#F7FAFE;border:2px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.dq .q{font-size:24px;font-weight:700;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.dq .q .n{background:var(--u);color:#fff;border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center;font-family:var(--hf);font-size:20px;flex:none}
.dq .a{font-size:22px;line-height:1.55;color:#1D6B3B;background:#EAF8EF;border-radius:12px;padding:8px 12px;animation:popin .3s both}
.dq .rv{align-self:flex-start;background:#fff;border:2px solid var(--u);color:var(--u);border-radius:12px;font-weight:800;font-size:17px;padding:4px 14px}

/* quiz */
.qz{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.qzh{display:flex;align-items:center;gap:10px}
.qzh .dots{display:flex;gap:6px}
.qzh .dots i{width:30px;height:12px;border-radius:6px;background:#E3E9F3}
.qzh .dots i.r{background:var(--ok)}.qzh .dots i.w{background:var(--bad)}.qzh .dots i.c{background:var(--u)}
.qzh .sc{margin-inline-start:auto;font-family:var(--hf);font-size:22px;font-weight:800;color:var(--ink2)}
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.result .stars{font-size:70px;letter-spacing:6px}
.result h3{font-family:var(--hf);font-size:44px;margin:0;color:var(--u)}

/* summary */
.sumg{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;flex:1;min-height:0}

/* confetti */
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}

/* ===================== VIZ ===================== */
.h100{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;direction:rtl;background:#CFDAE8;padding:3px;border-radius:12px}
.h100 div{background:#fff;display:grid;place-items:center;font-family:var(--hf);font-weight:700;color:var(--ink);border-radius:4px;transition:background .2s,transform .2s;user-select:none}
.h100 div.tp{cursor:pointer}
.h100 div.hid{background:#FFE7A8;color:#B07A00}
.h100 div.pulse{animation:pulse .9s ease-in-out infinite}
.tframe{display:grid;grid-template-columns:repeat(5,1fr);border:4px solid #3B4A6B;border-radius:8px;background:#fff}
.tframe div{border:2px solid #3B4A6B;display:grid;place-items:center;cursor:default}
.tframe div i{border-radius:50%;display:block;animation:popin .25s both}
.objg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl}
.objg span{display:grid;place-items:center;line-height:1;position:relative;transition:transform .15s;user-select:none}
.objg span.tp{cursor:pointer}
.objg span.cnt{transform:scale(.9);opacity:.55}
.objg span b{position:absolute;top:-6px;right:-6px;background:var(--u);color:#fff;font-family:var(--hf);font-size:14px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;opacity:1}
.objg .gap{width:18px}
.arr{display:inline-grid;gap:6px;direction:rtl;padding:10px;border-radius:14px;background:#F7FAFE;border:2px solid var(--line)}
.arr span{display:grid;place-items:center;line-height:1}
.pvw{display:flex;gap:28px;align-items:flex-end;justify-content:center;direction:rtl}
.rods{display:flex;gap:7px;align-items:flex-end}
.rod{display:grid;grid-template-rows:repeat(10,1fr);gap:2px;background:#2A6FBF;padding:2px;border-radius:5px;animation:popin .3s both}
.rod i{background:#5BB0FF;border-radius:2px}
.ones{display:grid;grid-template-columns:repeat(3,auto);gap:5px;align-content:end}
.ones i{background:#FFB020;border:2px solid #C98200;border-radius:4px;animation:popin .25s both}
.pvlabel{font-family:var(--hf);font-size:26px;font-weight:800;text-align:center}
.mcard .em,.cardn .em{font-size:1.1em}
.cardn{display:inline-grid;place-items:center;border-radius:16px;border:4px solid var(--cc,#9FB3CF);background:var(--cb,#fff);font-family:var(--hf);font-weight:800;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.08);position:relative}

<script>
/* ============ utilities ============ */
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=s=>String(s).replace(/[0-9]/g,d=>AR[d]);
const lat=s=>String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a) for(const k in a){
    const v=a[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='style'&&typeof v==='object'){ for(const sk in v){ if(sk.startsWith('--')) e.style.setProperty(sk,v[sk]); else e.style[sk]=v[sk]; } }
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);

  return e;
}
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.random()*a.length|0];
const norm=s=>lat(String(s)).replace(/\s+/g,'').replace(/[−–]/g,'-').toLowerCase();
const store={get(k,d){try{const v=localStorage.getItem('g2m_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('g2m_'+k,JSON.stringify(v))}catch(e){}}};

/* Arabic-Indic digits everywhere (text nodes only) */
function digitize(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/[0-9]/.test(n.nodeValue)&&!(n.parentNode&&/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName))?1:3});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>n.nodeValue=ar(n.nodeValue));
}
const skipN=n=>{ const p=n.parentNode; return !p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName); };
function startDigits(){ new MutationObserver(ms=>{for(const m of ms){
  if(m.type==='characterData'){ if(!skipN(m.target)&&/[0-9]/.test(m.target.nodeValue)) m.target.nodeValue=ar(m.target.nodeValue); }
  else m.addedNodes.forEach(n=>{ if(n.nodeType===3){ if(!skipN(n)&&/[0-9]/.test(n.nodeValue)) n.nodeValue=ar(n.nodeValue);} else if(n.nodeType===1 && !/^(SCRIPT|STYLE)$/.test(n.nodeName)) digitize(n); });
}}).observe(document.body,{subtree:true,childList:true,characterData:true}); }

/* ============ sound ============ */
const SND={on:store.get('snd',true),ctx:null,
  c(){ if(!this.ctx){ try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f,d=.15,type='sine',v=.18,t0=0,f2){ if(!this.on) return; const c=this.c(); if(!c) return; const t=c.currentTime+t0;
    const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.05); },
  noise(d=.25,v=.12,t0=0,hp=800){ if(!this.on) return; const c=this.c(); if(!c) return; const t=c.currentTime+t0;
    const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*(1-i/a.length);

  ok(){ this.tone(660,.12,'triangle',.2); this.tone(880,.14,'triangle',.2,.09); this.tone(1320,.22,'sine',.12,.18); },

};

/* ============ confetti ============ */
const FX={cv:null,parts:[],raf:0,
  burst(x=640,y=330,n=70){ const cv=this.cv; if(!cv) return; const cols=['#FF8A3D','#1E9BE0','#F2B90F','#5DBB3F','#F2557A','#7B5CE6'];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9; this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:4+Math.random()*6,c:pick(cols),l:70+Math.random()*40,rot:Math.random()*6})}

};

/* ---- RACE: two teams answer in turns ---- */
G.race=(s,b)=>{
  const racer={car:'🚗',camel:'🐪',rocket:'🚀',horse:'🐎',boat:'⛵',turtle:'🐢'}[s.theme||'car'];
  const teams=s.teams||['🔴 الفريق الأحمر','🔵 الفريق الأزرق'],goal=s.goal||5;
  const run=()=>{
    const qs=shuf(s.qs.map(qOf)); let qi=0,turn=0; const pos=teams.map(()=>0);
    const track=h('div',{class:'track'}); const lanes=teams.map((t,i)=>{ const rc=h('div',{class:'rc'},racer); const scr=h('div',{class:'scr'},'0 / '+goal); const ln=h('div',{class:'lane',style:{'--lc':TEAMC[i]}},h('div',{class:'tm'},t),h('div',{class:'fin'}),rc,scr); track.append(ln); return {ln,rc,scr}; });
    const qa=h('div',{style:{flex:1,minHeight:0,display:'flex',flexDirection:'column'}});
    b.append(track,qa);
    const place=()=>lanes.forEach((L,i)=>{ L.rc.style.right=(170+pos[i]/goal*(L.ln.clientWidth-270))+'px'; L.scr.textContent=pos[i]+' / '+goal; L.ln.classList.toggle('turn',i===turn); });
    const ask=()=>{ place(); qa.innerHTML=''; const q=qs[qi++%qs.length];
      qa.append(h('div',{class:'big',style:{color:TEAMC[turn],fontSize:'22px'}},'دور: '+teams[turn]));
      const cb=ok=>{ if(ok){ pos[turn]++; SND.step(); place(); if(pos[turn]>=goal){ later(()=>endScreen(b,{title:'فاز '+teams[turn]+'!',icon:racer,msg:'سباق رائع — أحسنتم جميعًا'},()=>run()),900); return; } }
        later(()=>{ turn=(turn+1)%teams.length; ask(); },ok?1300:1500); };
      qa.append(q.opts?mcqView(q,cb,{oneShot:true}):typedView(q,cb)); };
    ask();
  };
  startScreen(b,{icon:racer,title:s.title||'سباق الفريقين',desc:(s.desc||'يتناوب الفريقان على الإجابة. كل إجابة صحيحة تقدّم مركبة الفريق خطوة. أول فريق يصل إلى خط النهاية يفوز!')+'<br><small style="color:var(--ink2)">الهدف: '+goal+' إجابات صحيحة</small>'},run);
};

/* ---- MEMORY ---- */
G.memory=(s,b)=>{
  const run=()=>{
    const cards=shuf(s.pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]));
    const n=cards.length,cols=n<=12?(n<=8?4:6):n<=16?8:6, rows=Math.ceil(n/cols);
    let open=[],found=0,moves=0,lock=false;
    const mv=h('span',{class:'pill'},'المحاولات: 0'),fd=h('span',{class:'pill'},'الأزواج: 0 / '+s.pairs.length);
    b.append(h('div',{class:'ghud'},h('span',{class:'rule',html:s.rule||'اقلب بطاقتين متطابقتين'}),mv,fd));
    const g=h('div',{class:'mgrid',style:{gridTemplateColumns:`repeat(${cols},1fr)`,gridTemplateRows:`repeat(${rows},1fr)`}});
    cards.forEach((c,k)=>{ const el=h('div',{class:'mc'},h('div',{class:'in'},h('div',{class:'fa'},'؟'),h('div',{class:'ba',html:String(c.t),style:{fontSize:(String(c.t).replace(/<[^>]+>/g,'').length>8?22:30)+'px'}})));
      el.onclick=()=>{ if(lock||el.classList.contains('flip')) return; el.classList.add('flip'); SND.flip(); open.push({el,c});
        if(open.length===2){ moves++; mv.textContent='المحاولات: '+moves; const [a,bb]=open; open=[];
          if(a.c.i===bb.c.i){ found++; fd.textContent='الأزواج: '+found+' / '+s.pairs.length; later(()=>{a.el.classList.add('got');bb.el.classList.add('got');SND.ok();fxAt(bb.el,20); if(found===s.pairs.length) later(()=>endScreen(b,{title:'وجدتم كل الأزواج!',icon:'🧠',msg:'بعدد محاولات: '+moves,stars:moves<=s.pairs.length+3?3:moves<=s.pairs.length*2?2:1},()=>run()),700);},350); }
          else { lock=true; later(()=>{a.el.classList.remove('flip');bb.el.classList.remove('flip');lock=false;SND.flip()},950); } } };
      g.append(el); });
    b.append(g);
  };
  startScreen(b,{icon:'🧠',title:s.title||'لعبة الذاكرة',desc:s.rule||'اقلب بطاقتين في كل مرة وابحث عن البطاقتين المتطابقتين.'},run);
};

/* ---- WHEEL of questions ---- */
G.wheel=(s,b)=>{
  const run=()=>{
    const items=s.items.map(qOf),n=items.length,used=new Set(); let rot=0,busy=false;
    const segC=['#FF8A3D','#1E9BE0','#F2B90F','#5DBB3F','#F2557A','#7B5CE6','#15B5A6','#E8424F','#FFB26B','#7CC8FF'];
    const R0=200,cx=210,cy=210; let paths='';
    for(let i=0;i<n;i++){ const a0=(i/n)*2*Math.PI-Math.PI/2,a1=((i+1)/n)*2*Math.PI-Math.PI/2,am=(a0+a1)/2;
      paths+=`<path id="sg${i}" d="M${cx},${cy} L${cx+R0*Math.cos(a0)},${cy+R0*Math.sin(a0)} A${R0},${R0} 0 ${n<2?1:0} 1 ${cx+R0*Math.cos(a1)},${cy+R0*Math.sin(a1)} Z" fill="${segC[i%segC.length]}" stroke="#fff" stroke-width="4"/><text x="${cx+R0*.68*Math.cos(am)}" y="${cy+R0*.68*Math.sin(am)+12}" text-anchor="middle" font-size="36" font-weight="800" fill="#fff" font-family="Baloo Bhaijaan 2">${ar(i+1)}</text>`; }
    const w=h('div',{class:'wheelw'},h('div',{class:'ptr'},'🔻'),h('div',{html:`<svg viewBox="0 0 420 420" style="transition:transform 4s cubic-bezier(.15,.85,.2,1)">${paths}<circle cx="210" cy="210" r="34" fill="#fff" stroke="#1F2A44" stroke-width="4"/><text x="210" y="222" text-anchor="middle" font-size="30">🎯</text></svg>`}));
    const svgEl=()=>w.querySelector('svg');
    const card=h('div',{style:{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',gap:'14px'}});
    const spin=h('button',{class:'btn org',style:{fontSize:'28px',alignSelf:'center'}},'🎡 أدِر العجلة');
    card.append(h('div',{class:'lead center'},s.rule||'أدِر العجلة لتظهر لك مسألة. فكّر، ثم أجب!'),spin);
    b.append(h('div',{class:'row',style:{flex:1,minHeight:0,gap:'30px'}},w,card));
    spin.onclick=()=>{ if(busy) return; const free=[...Array(n).keys()].filter(i=>!used.has(i)); if(!free.length){ endScreen(b,{title:'انتهت كل المسائل!',icon:'🎡'},()=>run()); return; }
      busy=true; const k=pick(free); used.add(k); SND.spin();
      const segA=(k+.5)/n*360; rot+=360*5+((360-segA)-(rot%360)+360)%360; svgEl().style.transform=`rotate(${rot}deg)`;
      later(()=>{ busy=false; w.querySelector('#sg'+k).setAttribute('opacity','.35'); const q=items[k];
        card.innerHTML=''; const qc=h('div',{class:'qcard'},h('div',{class:'big',style:{color:'var(--u)',fontSize:'24px'}},'المسألة رقم '+(k+1)),h('div',{class:'qbox',html:q.q}),q.viz?h('div',{class:'vizbox vfit'},viz(q.viz)):null);
        const rv=h('button',{class:'btn sm vio',style:{alignSelf:'flex-start'}},'💡 الإجابة'); rv.onclick=()=>{rv.replaceWith(h('div',{class:'why',html:String(q.ans??q.a)}));SND.reveal()};
        qc.append(rv); card.append(qc,spin); SND.reveal(); },4100); };
  };
  startScreen(b,{icon:'🎡',title:s.title||'عجلة الأسئلة',desc:s.rule||'أدِر العجلة، واقرأ المسألة، وأجب قبل أن نكشف الحل!'},run);
};

/* ---- QUICK sprint ---- */
G.quick=(s,b)=>{
  const time=s.time||60;
  const run=()=>{
    const qs=shuf(s.qs.map(qOf)); let i=0,score=0,left=time,cur=null;
    const sp=h('span',{class:'pill'},'✔ 0'),tm=h('span',{class:'pill'},'⏱ '+left),tb=h('div',{class:'timerbar'},h('i',{style:{width:'100%'}}));
    const qa=h('div',{class:'col',style:{flex:1,alignItems:'center',justifyContent:'center',gap:'16px'}});
    b.append(h('div',{class:'ghud'},h('span',{class:'rule',html:s.rule||'أجب بأسرع ما يمكن!'}),sp,tm),tb,qa);
    let val=''; const disp=h('div',{class:'blank act',style:{minWidth:'160px',height:'80px',fontSize:'48px'}});
    const card=h('div',{class:'tfcard'});
    const next=()=>{ cur=qs[i++%qs.length]; card.innerHTML=cur.q; card.style.animation='none'; void card.offsetWidth; card.style.animation=''; val=''; disp.textContent=''; disp.classList.remove('wrong'); };
    const key=k=>{ if(left<=0) return; if(k==='del') val=val.slice(0,-1); else if(k==='ok'){ if(!val) return; if(okAns(val,cur.ans)){ score++; sp.textContent='✔ '+score; SND.ok(); fxAt(disp,20); next(); } else { bad(disp); val=''; } } else if(val.length<5) val+=k; disp.textContent=val; };
    qa.append(card,disp,Keypad(key),h('button',{class:'btn sm alt',onclick:()=>{SND.swoosh();next()}},'تخطَّ ⏭'));
    next();
    const tt=every(()=>{ left--; tm.textContent='⏱ '+left; tb.firstChild.style.width=(left/time*100)+'%'; if(left<=5) SND.tick(); if(left<=0){ clearInterval(tt); endScreen(b,{title:'انتهى الوقت!',icon:'⚡',msg:`عدد الإجابات الصحيحة: <b style="color:var(--ok)">${score}</b>`,stars:score>=10?3:score>=6?2:1},()=>run()); } },1000);
  };
  startScreen(b,{icon:'⚡',title:s.title||'تحدّي السرعة',desc:(s.rule||'أجب عن أكبر عدد من الأسئلة')+'<br><small style="color:var(--ink2)">المدة: '+time+' ثانية • اكتب الإجابة ثم اضغط ✓</small>'},run);
};

/* ---- TREASURE BOXES with teams ---- */
G.boxes=(s,b)=>{
  const teams=s.teams||['🔴 الأحمر','🔵 الأزرق'];
  const run=()=>{
    const qs=s.qs.map(qOf),pts=teams.map(()=>0); let opened=0;
    const tw=h('div',{class:'teams'}); const tb=teams.map((t,i)=>{ const v=h('b',null,'0'); tw.append(h('div',{class:'team',style:{background:TEAMC[i]}},t,v)); return v; });
    const grid=h('div',{class:'chests',style:{gridTemplateColumns:`repeat(${Math.min(5,qs.length)},1fr)`}});
    const modal=h('div',{style:{position:'absolute',inset:'74px 0 0 0',background:'rgba(255,255,255,.94)',display:'none',alignItems:'center',justifyContent:'center',zIndex:5,padding:'20px 60px'}});
    qs.forEach((q,k)=>{ const c=h('button',{class:'chest'},h('span',{class:'e'},q.p?'💎':'🎁'),k+1);
      c.onclick=()=>{ SND.reveal(); modal.innerHTML=''; modal.style.display='flex';
        const qc=h('div',{class:'qcard',style:{width:'100%',maxWidth:'1050px'}},h('div',{class:'big',style:{color:'var(--u)',fontSize:'24px'}},'الصندوق '+(k+1)+(q.p?' — '+q.p+' نقاط':' — نقطة واحدة')),h('div',{class:'qbox',html:q.q}),q.viz?h('div',{class:'vizbox vfit'},viz(q.viz)):null);
        const rv=h('button',{class:'btn sm vio',style:{alignSelf:'flex-start'}},'💡 الإجابة');
        const aw=h('div',{class:'row',style:{flexWrap:'wrap',gap:'10px'}},h('span',{style:{fontWeight:800,fontSize:'20px'}},'من أجاب صحيحًا؟'),...teams.map((t,i)=>h('button',{class:'btn sm',style:{background:TEAMC[i]},onclick:()=>{ pts[i]+=q.p||1; tb[i].textContent=pts[i]; SND.ok(); close(c,TEAMC[i]); }},t)),h('button',{class:'btn sm alt',onclick:()=>close(c,'#C8D1DE')},'لا أحد'));
        rv.onclick=()=>{rv.replaceWith(h('div',{class:'why',html:String(q.ans??q.a)}));SND.reveal()};
        qc.append(rv,aw); modal.append(qc); };
      grid.append(c); });
    const close=(c,color)=>{ modal.style.display='none'; c.classList.add('open'); c.style.background=color; c.style.color='#fff'; opened++; if(opened===qs.length){ const mx=Math.max(...pts),w=pts.map((p,i)=>p===mx?teams[i]:null).filter(Boolean); later(()=>endScreen(b,{title:w.length>1?'تعادل رائع!':'فاز '+w[0]+'!',icon:'🏴‍☠️',msg:teams.map((t,i)=>t+': '+pts[i]).join(' • ')},()=>run()),500); } };
    b.append(tw,h('div',{style:{flex:1,display:'flex',alignItems:'center'}},h('div',{style:{width:'100%'}},grid)),modal);
  };
  startScreen(b,{icon:'🎁',title:s.title||'صناديق الكنز',desc:s.rule||'يختار كل فريق صندوقًا ويجيب عن سؤاله. الإجابة الصحيحة تكسب الفريق نقاط الصندوق!'},run);
};

/* ---- HIDE: hidden numbers on a hundred square ---- */
G.hide=(s,b)=>{
  const run=()=>{
    const from=s.from||1,to=s.to||100; const pool=[]; for(let n=from;n<=to;n++) pool.push(n);
    const hidden=new Set(s.hide?nums(s.hide):shuf(pool).slice(0,s.count||10)); let left=hidden.size,act=null,val='',score=0;
    const sp=h('span',{class:'pill'},'المتبقي: '+left);
    b.append(h('div',{class:'ghud'},h('span',{class:'rule',html:s.rule||'اختر مربعًا مخفيًا واكتب العدد المختبئ فيه'}),sp));
    const cs=s.cs||(to-from>=99?50:58);
    const g=h('div',{class:'h100',style:{gridTemplateColumns:`repeat(10,${cs}px)`,gridAutoRows:cs+'px'}});
    for(let n=from;n<=to;n++){ const c=h('div',{style:{fontSize:Math.round(cs*.42)+'px',background:hidden.has(n)?null:(s.hl&&hlMap(s.hl)[n]||'#fff')}},hidden.has(n)?'؟':n);
      if(hidden.has(n)){ c.classList.add('hid','tp'); c.onclick=()=>{ if(!c.classList.contains('hid')) return; if(act) act.el.style.outline=''; act={el:c,n}; c.style.outline='4px solid var(--u)'; val=''; disp.textContent=''; SND.click(); }; }
      g.append(c); }
    const disp=h('div',{class:'blank act',style:{minWidth:'140px',height:'70px',fontSize:'40px'}});
    const key=k=>{ if(!act) return; if(k==='del') val=val.slice(0,-1); else if(k==='ok'){ if(!val) return; if(+lat(val)===act.n){ act.el.textContent=act.n; act.el.classList.remove('hid','tp'); act.el.style.background=col('g'); act.el.style.outline=''; SND.ok(); fxAt(act.el,24); act=null; left--; score++; sp.textContent='المتبقي: '+left; if(!left) later(()=>endScreen(b,{title:'وجدتم كل الأعداد المختبئة!',icon:'🔎'},()=>run()),600); } else { bad(disp); } val=''; } else if(val.length<3) val+=k; disp.textContent=val; };
    b.append(h('div',{class:'row',style:{flex:1,minHeight:0,justifyContent:'center',gap:'40px'}},g,h('div',{class:'col',style:{alignItems:'center',gap:'14px',width:'260px'}},h('div',{class:'lead center',style:{fontSize:'21px'}},'العدد المختبئ:'),disp,Keypad(key))));
  };
  startScreen(b,{icon:'🔎',title:s.title||'الأعداد المختبئة',desc:s.rule||'اختبأت بعض الأعداد في اللوحة! اضغط على المربع المخفي واكتب العدد الصحيح.'},run);
};

/* ---- TARGET on a number line ---- */
G.target=(s,b)=>{
  const run=()=>{
    const ts=shuf(s.nums); let i=0,total=0,picked=null;
    const sp=h('span',{class:'pill'},'النقاط: 0');
    b.append(h('div',{class:'ghud'},h('span',{class:'rule',html:s.rule||'اضغط على خط الأعداد في مكان العدد المطلوب'}),sp));
    const area=h('div',{class:'nltarget'}); b.append(area);
    const show=()=>{ area.innerHTML=''; picked=null; const t=ts[i];
      const tgt=h('div',{class:'big',style:{fontSize:'70px',color:'var(--u)'}},t);
      const msg=h('div',{class:'lead',style:{minHeight:'40px'}},'');
      const holder=h('div');
      const draw=(extra)=>{ holder.innerHTML=''; holder.append(viz({k:'nl',min:s.min??0,max:s.max??100,step:s.step??10,lab:s.lab,w:1150,pick:!extra,snap:s.snap||1,marks:extra||[],onpick:v=>{picked=v;ck.disabled=false}})); };
      draw();
      const ck=h('button',{class:'btn ok',disabled:true},'✓ تحقّق');
      ck.onclick=()=>{ if(picked==null) return; const d=Math.abs(picked-t),tol=s.tol||((s.max??100)-(s.min??0))/20; const p=d===0?3:d<=tol?2:d<=tol*2?1:0; total+=p; sp.textContent='النقاط: '+total;
        draw([{v:picked,c:'#FF8A3D',t:picked},{v:t,c:'#2FB463',t:'✔ '+t,tc:'#2FB463'}]);
        msg.innerHTML=p===3?'🎯 إصابة كاملة! +٣':p===2?'👏 قريب جدًا! +٢':p===1?'👍 قريب +١':'حاول التفكير في العشرات المجاورة';
        if(p>=2){SND.ok();fxAt(msg,30)} else SND.no();
        ck.replaceWith(nx); };
      const nx=h('button',{class:'btn org'},i<ts.length-1?'العدد التالي ◀':'النتيجة 🏆');
      nx.onclick=()=>{ i++; if(i<ts.length) show(); else endScreen(b,{title:'مجموع النقاط: '+total,icon:'🎯',stars:total>=ts.length*2.4?3:total>=ts.length*1.5?2:1},()=>run()); };
      area.append(h('div',{class:'lead'},'أين يقع العدد؟'),tgt,holder,msg,ck); };
    show();
  };
  startScreen(b,{icon:'🎯',title:s.title||'أصِب الهدف',desc:s.rule||'يظهر عدد، واضغط على مكانه على خط الأعداد. كلما اقتربت حصلت على نقاط أكثر!'},run);
};

/* ---- TRUE / FALSE ---- */
G.tf=(s,b)=>{
  const time=s.time||60;
  const run=()=>{
    const qs=shuf(s.qs.map(x=>Array.isArray(x)?{q:x[0],ok:x[1]}:x)); let i=0,score=0,left=time,lock=false;
    const sp=h('span',{class:'pill'},'✔ 0'),tm=h('span',{class:'pill'},'⏱ '+left),tb=h('div',{class:'timerbar'},h('i',{style:{width:'100%'}}));
    const card=h('div',{class:'tfcard'}),why=h('div',{class:'lead',style:{minHeight:'40px'}});
    const bT=h('button',{class:'tfb',style:{background:'var(--ok)'}},'✔'),bF=h('button',{class:'tfb',style:{background:'var(--bad)'}},'✘');
    b.append(h('div',{class:'ghud'},h('span',{class:'rule',html:s.rule||'هل العبارة صحيحة أم خاطئة؟'}),sp,tm),tb,h('div',{class:'col',style:{flex:1,alignItems:'center',justifyContent:'center',gap:'24px'}},card,h('div',{class:'row',style:{gap:'60px'}},bT,bF),why));
    const fin=()=>{ clearInterval(tt); endScreen(b,{title:'النتيجة: '+score+' من '+Math.min(i,qs.length),icon:'⚖️',stars:score>=qs.length*.85?3:score>=qs.length*.6?2:1},()=>run()); };
    const show=()=>{ if(i>=qs.length){ fin(); return; } card.innerHTML=qs[i].q; card.style.animation='none'; void card.offsetWidth; card.style.animation=''; why.innerHTML=''; lock=false; };
    const ans=v=>{ if(lock) return; lock=true; const q=qs[i]; if(v===!!q.ok){ score++; sp.textContent='✔ '+score; SND.ok(); card.classList.add('good'); fxAt(card,24); } else { SND.no(); card.classList.add('badc','shake'); why.innerHTML=q.why?('💡 '+q.why):(q.ok?'العبارة صحيحة':'العبارة خاطئة'); }
      later(()=>{ card.classList.remove('good','badc','shake'); i++; show(); },v===!!q.ok?900:2200); };
    bT.onclick=()=>ans(true); bF.onclick=()=>ans(false);
    show();
    const tt=every(()=>{ left--; tm.textContent='⏱ '+left; tb.firstChild.style.width=(left/time*100)+'%'; if(left<=5) SND.tick(); if(left<=0) fin(); },1000);
  };
  startScreen(b,{icon:'⚖️',title:s.title||'صح أم خطأ؟',desc:(s.rule||'اقرأ العبارة، واضغط ✔ إذا كانت صحيحة أو ✘ إذا كانت خاطئة.')+'<br><small style="color:var(--ink2)">المدة: '+time+' ثانية</small>'},run);
};

/* ---- BUILD a number with tens & ones ---- */
G.build=(s,b)=>{
  const run=()=>{
    const ts=shuf(s.targets); let i=0;
    const area=h('div',{class:'col',style:{flex:1,alignItems:'center',justifyContent:'center',gap:'10px'}}); b.append(area);
    const show=()=>{ area.innerHTML=''; const t=ts[i];
      area.append(h('div',{class:'lead'},h('span',null,'ابنِ العدد: '),h('b',{class:'big',style:{fontSize:'54px',color:'var(--u)'}},t),h('span',{style:{color:'var(--ink2)',fontSize:'20px'}},'  ('+(i+1)+' من '+ts.length+')')));
      const sp={k:'pv',t:0,o:0,build:true,target:t,cs:13};
      const v=viz(sp); area.append(h('div',{class:'vizbox vfit',style:{flex:1,minHeight:0,width:'100%'}},v)); refit();
      const ob=new MutationObserver(()=>{ const lab=v.querySelector('.pvlabel'); if(lab&&lab.textContent.endsWith('= '+ar(t))){ ob.disconnect(); later(()=>{ i++; if(i<ts.length) show(); else endScreen(b,{title:'بنيتم كل الأعداد!',icon:'🧱'},()=>run()); },1300); } });
      ob.observe(v,{subtree:true,childList:true,characterData:true}); onClean(()=>ob.disconnect()); };
    show();
  };
  startScreen(b,{icon:'🧱',title:s.title||'ابنِ العدد',desc:s.rule||'استخدم أعواد العشرات ومكعبات الآحاد لبناء العدد المطلوب.'},run);
};

(()=>{
/* the book's stack of shoe boxes: 5 full columns of 5 boxes + 1 column of 3 boxes (on the right) = 28 boxes */
const stack=(mode,cw)=>{ cw=cw||86; const ch=Math.round(cw*.66);
  const has=(r,c)=>c<5||r>=2;
  let g=`<div style="display:grid;grid-template-columns:repeat(6,${cw}px);grid-auto-rows:${ch}px;gap:4px;direction:ltr">`;
  for(let r=0;r<5;r++) for(let c=0;c<6;c++){
    if(!has(r,c)){ g+='<div></div>'; continue; }
    let txt='👟👟', bg='#F4C08A', fs=Math.round(ch*.45), col='#1F2A44';
    const k=c<5?r+1:r-1; /* position counted from the top of its column */
    if(mode===1&&c===0){ txt=2*k; bg='#FFD45C'; fs=Math.round(ch*.55); }
    if(mode>=2&&c<5){ bg=['#FFD45C','#9BE07A','#7CC8FF','#F7A8C4','#C3B1FF'][c]; }
    if(mode===3&&c===5){ txt=50+2*k; bg='#FFB26B'; fs=Math.round(ch*.5); }
    g+=`<div style="background:${bg};border:3px solid #B9773A;border-radius:6px;display:grid;place-items:center;font-size:${fs}px;font-weight:800;color:${col};font-family:var(--hf)">${txt}</div>`;
  }
  if(mode>=2){ for(let c=0;c<6;c++){ const t=c<5?10*(c+1):(mode===3?56:''); g+=`<div style="text-align:center;font-size:${Math.round(ch*.55)}px;font-weight:800;color:${c<5?'#7B5CE6':'#E8424F'};font-family:var(--hf)">${t}</div>`; } }
  return g+'</div>'; };
