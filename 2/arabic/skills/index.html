جي (لمن لم يتقن): يعرض المعلم صورتي الغرفة المبعثرة والمرتبة، ويرتب مع التلميذ أدوات حقيقية على الطاولة خطوة خطوة وهو يقول: أضع الكتاب، أعلّق الثوب؛ وللتحقق يسأله: ماذا تفعل بغرفتك قبل الخروج إلى المدرسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لمهام ترتيب الغرفة يتقاسمها أفراد الأسرة، ثم يقارنون بين صورتي درس «سيكبرون» بثلاث جمل مستعملين كلمة «بينما».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: ظرف الزمان في جملة (نخرج في الصباح): (لا يوجد / نخرج / في / الصباح)\nالإجابة: الصباح.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: تهتز أصابع الأخت عند الكتابة لأنها: (مريضة جدًا / غاضبة / ما زالت صغيرة تتعلم / نائمة)\nالإجابة: ما زالت صغيرة تتعلم.\n\nس3 (مستوى الاستدلال): اكتب جملة فيها ظرف مكان وكلمة بتاء مربوطة.\nالإجابة: مثل: وضعت الحقيبة تحت المنضدة.", "- للطالب: قراءة نص «سيكبرون» ص51–54 قراءة صامتة مرة واحدة على الأقل.\n- للطالب: قراءة النص ص51–54 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة.\n- للطالب: إكمال أنشطة خطوتي الأولى ص55–56 وقراءة النص مرة أخرى.\n- للطالب: إعادة سرد أحداث نص «سيكبرون» مرتبة أمام الأسرة.\n- للطالب: حل أنشطة خطوتي الثانية ص57 في الكتاب.\n- للطالب: كتابة جملتين تحاكي التعبير «لا تنزعج.. ستشفى بسرعة!» وحل أنشطة ص58–59.\n- للطالب: كتابة رأيه في إحدى شخصيات نص «سيكبرون» في سطرين.\n- للطالب: التدرب على قراءة النص قراءة معبرة وتمثيل مشهد منه مع الأسرة.\n- للطالب: حل أنشطة التحليل والتركيب ص60–61.\n- للطالب: مراجعة نص «سيكبرون» وأنشطته كاملة والتدرب على ما يحتاج إلى تدريب.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة.\n- لولي الأمر: الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف.\n- لولي الأمر: سؤال ابنه عن شخصيات النص ومكان أحداثه.\n- لولي الأمر: الاستماع إلى سرد ابنه ومساعدته على استخدام أدوات الربط.\n- لولي الأمر: سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «سيكبرون» ولماذا.\n- لولي الأمر: مناقشة ابنه في العبرة من النص وكيف يطبقها.\n- لولي الأمر: مناقشة ابنه في رأيه بالنص وتعليله.\n- لولي الأمر: مشاركة ابنه تمثيل مشهد من النص وتشجيعه.\n- لولي الأمر: لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت.\n- لولي الأمر: الاطلاع على بطاقة التقويم الذاتي ومساعدة ابنه في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=5"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: ظرفا الزمان والمكان (التعرف والمحاكاة)", "النمط اللغوي: ظرفا الزمان والمكان (التطبيق وأنشطة الكتاب)", "تدريبات إضافية على ظرفا الزمان والمكان (توظيف في التحدث والكتابة)"], "w": "الأسبوع الخامس: 4–8/10/2026م", "f": ["1. يتعرف ظرفا الزمان والمكان من خلال أمثلة من النص (15 دقيقة)\n2. يحاكي ظرفا الزمان والمكان في جمل جديدة (10 دقائق)\n3. يطبق ظرفا الزمان والمكان في أنشطة الكتاب (20 دقيقة)\n4. يميز ظرفا الزمان والمكان في جمل معروضة (5 دقائق)\n5. يوظف ظرفا الزمان والمكان في التحدث عن صور ومواقف (10 دقائق)\n6. يكتب جملًا صحيحة موظفًا ظرفا الزمان والمكان (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (15 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)\n- يقيّم جمل زملائه من حيث صحة توظيف النمط (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج 5: تطبيق\nالمخرج 6: إبداع\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني\n8. التعلم التشاركي\n9. تعلم الأقران", "1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. ظرفا الزمان والمكان\n2. ظرف الزمان\n3. ظرف المكان", "يضع المعلم قلمًا في أماكن مختلفة ويسأل في كل مرة: أين القلم؟ ويجيب التلميذ: تحت الكتاب/ فوق الطاولة (5 دقائق)", "1. اكتشاف النمط: يعرض المعلم جملًا من النص: نخرج في الصباح، أقلامنا تحت المنضدة، بين الكراسي، في الظهيرة تفاجئنا أمي، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: ظرف الزمان كلمة تدل على وقت حدوث الفعل (الصباح، الظهيرة، المساء، قبل، بعد)، وظرف المكان كلمة تدل على مكانه (تحت، فوق، بين، أمام، عند)، ويلاحظ التلميذ الأمثلة ويستنتج النمط (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المحاكاة: يضع المعلم كتابًا في أماكن مختلفة (تحت الطاولة، فوقها، أمامها، بين حقيبتين) ويطلب وصف مكانه في كل مرة، ثم يسأل عن أوقات اليوم ويطلب جملًا بظروف الزمان، ويحاكي التلميذ النمط في جمل جديدة على سبورته (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص62–63) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: في المساء يجلس أبي، نتحلق حوله، ننحني أمامهما، يجلس أبي قربها، ويذكر التلميذ أمثلة جديدة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم أنشطة الكتاب: إعادة الكلمات إلى مكانها في الجدول، وتوظيف (قبل، تحت، بعد، فوق) في جمل مستعينًا بالصور (ص62–63)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n7. التحدث بالنمط: يعرض المعلم صورة غرفة صف ويطلب من الطلاب وصف أماكن الأشياء بظروف المكان، ثم وصف يومهم بظروف الزمان (في الصباح، الظهيرة، المساء)، ويتحدث التلميذ موظفًا النمط (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الكتابة بالنمط: يطلب المعلم كتابة ثلاث جمل عن موضوع الدرس موظفين ظرفا الزمان والمكان، ويتبادلون الدفاتر للتقييم، ويكتب التلميذ ثلاث جمل ويقيّم جمل زميله (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n9. تصحيح جماعي: يعرض المعلم جملًا مختارة من كتابات الطلاب ويصحح معهم الأخطاء الشائعة، ويشارك التلميذ في التصحيح (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n10. غلق الدرس – أين ومتى في عمان؟: يطرح المعلم أسئلة سريعة مثل: متى نحتفل بالعيد الوطني؟ أين تقع قلعة نزوى؟ فتتسابق المجموعات في الإجابة بجمل فيها ظرف زمان أو ظرف مكان، وتنال نقطة على كل إجابة صحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: ظرف المكان في جملة (الكتاب تحت المنضدة): (لا يوجد / تحت / المنضدة / الكتاب)\nالإجابة: تحت.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الجملة التي فيها ظرف زمان وظرف مكان: (سافر أبي / الكتاب جميل / في المساء جلست أمام البيت / أمي ماهرة)\nالإجابة: في المساء جلست أمام البيت.\n\nس3 (مستوى الاستدلال): صف غرفتك في جملتين فيهما ظرفا مكان.\nالإجابة: مثل: سريري قرب النافذة، وكتبي فوق الرف.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي الغرفة المبعثرة والمرتبة، ويرتب مع التلميذ أدوات حقيقية على الطاولة خطوة خطوة وهو يقول: أضع الكتاب، أعلّق الثوب؛ وللتحقق يسأله: ماذا تفعل بغرفتك قبل الخروج إلى المدرسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لمهام ترتيب الغرفة يتقاسمها أفراد الأسرة، ثم يقارنون بين صورتي درس «سيكبرون» بثلاث جمل مستعملين كلمة «بينما».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): الطائر يطير .... الشجرة. (فوق / المساء / الظهيرة)\nالإجابة: فوق.\n\nس2 (مستوى التطبيق): صواب أم خطأ: كلمة (فوق) ظرف مكان.\nالإجابة: صواب.\n\nس3 (مستوى الاستدلال): اكتب ثلاث جمل عن يومك فيها ظروف زمان.\nالإجابة: في الصباح أذهب إلى المدرسة، وفي الظهيرة أتغدى، وفي المساء أراجع دروسي.", "- للطالب: حل أنشطة النمط اللغوي ص62–63 وكتابة جملتين موظفًا ظرفا الزمان والمكان.\n- للطالب: كتابة فقرة قصيرة من ثلاث جمل موظفًا ظرفا الزمان والمكان.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=5"]}, {"k": "الإملاء", "p": ["النمط الإملائي: التاء المفتوحة والتاء المربوطة (الملاحظة والتصنيف)", "النمط الإملائي: التاء المفتوحة والتاء المربوطة (التطبيق والإملاء المنقول)"], "w": "الأسبوع الخامس: 4–8/10/2026م", "f": ["1. يلاحظ التاء المفتوحة والتاء المربوطة في كلمات من النص (15 دقيقة)\n2. يصنف كلمات وفق التاء المفتوحة والتاء المربوطة (10 دقائق)\n3. يكتب كلمات تتضمن التاء المفتوحة والتاء المربوطة كتابة صحيحة (15 دقيقة)\n4. يكتب إملاءً منقولًا بخط واضح (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يذكر أمثلة جديدة من خارج النص (15 دقيقة)\n- يميز الخطأ الإملائي في كلمة ويصححه (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة\n6. السؤال والجواب", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. التاء المفتوحة والتاء المربوطة\n2. الوقف على الكلمة\n3. التاء في آخر الكلمة", "ينطق كلمات (بيت، مدرسة) ويطلب الوقف عليها ليلاحظوا الفرق، ويقف التلميذ على الكلمة ويلاحظ النطق (5 دقائق)", "1. ملاحظة الظاهرة: يعرض المعلم جملًا من النص فيها كلمات ملونة: البيت، المدرسة، المنضدة، هامسة، مبعثرة، الظهيرة، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: التاء المفتوحة تُكتب (ت) وتُنطق تاء عند الوقف مثل (البيت)، والتاء المربوطة تُكتب (ة/ـة) وتُنطق هاء عند الوقف مثل (المدرسة)، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التصنيف: يوجه الطلاب إلى توزيع الكلمات (البيت، المدرسة، المنضدة، هامسة، مبعثرة، الظهيرة، بسرعة، تحت، حرارة، كتابة، صنعت، المنزلية، ماهرة، الواجبات) في الجدول بحسب رسم التاء (ص64)، ويصنف التلميذ الكلمات في الجدول (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أنشطة الكتاب: يطلب المعلم إكمال كلمات بالتاء المناسبة (ت/ ة) ونطقها بالوقف عليها، ثم تصنيف كلمات النشاط (ص64)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n6. الإملاء المنقول: يكتب المعلم على السبورة: «في الصباح نخرج من البيت إلى المدرسة، وأمي ماهرة في كل ما تقدمه لنا.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – التاء الضائعة: يكتب المعلم كلمات عمانية ناقصة التاء (قلعـ، نخلـ، بيو، ولايـ)، وتتسابق المجموعات في إكمالها بالتاء المربوطة أو المفتوحة وقراءتها، ثم تذكر كل مجموعة مكانًا تحبه في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: التاء في كلمة (البيت): (تاء مفتوحة / تاء مربوطة)\nالإجابة: تاء مفتوحة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: التاء في كلمة (الواجبات): (تاء مربوطة / تاء مفتوحة)\nالإجابة: تاء مفتوحة.\n\nس3 (مستوى الاستدلال): كيف نعرف التاء المربوطة عند النطق؟\nالإجابة: نقف على الكلمة فتُنطق هاء مثل (مدرسه).\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي الغرفة المبعثرة والمرتبة، ويرتب مع التلميذ أدوات حقيقية على الطاولة خطوة خطوة وهو يقول: أضع الكتاب، أعلّق الثوب؛ وللتحقق يسأله: ماذا تفعل بغرفتك قبل الخروج إلى المدرسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لمهام ترتيب الغرفة يتقاسمها أفراد الأسرة، ثم يقارنون بين صورتي درس «سيكبرون» بثلاث جمل مستعملين كلمة «بينما».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: التاء في كلمة (ماهرة): (تاء مربوطة / تاء مفتوحة)\nالإجابة: تاء مربوطة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: التاء في كلمة (هامسة): (تاء مربوطة / تاء مفتوحة)\nالإجابة: تاء مربوطة.\n\nس3 (مستوى الاستدلال): صوّب: (المدرست جميلت).\nالإجابة: المدرسة جميلة.", "- للطالب: حل أنشطة النمط الإملائي ص64 وكتابة خمس كلمات تمثل التاء المفتوحة والتاء المربوطة.\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=5"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (ص ض) بخط النسخ"], "w": "الأسبوع الخامس: 4–8/10/2026م", "f": ["1. يكتب الحروف (ص ض) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (10 دقائق)\n2. يكتب الكلمات والجملة: «احرص على إرضاء والديك.» محاكيًا النموذج (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (ص ض) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (المنضدة، صغار، نقص، تعرض) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص65) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «احرص على إرضاء والديك.» ويختار أجود خط ليعلق في لوحة الصف (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – صاد وضاد: يكتب كل طالب بخط النسخ كلمة عمانية فيها حرف الصاد أو الضاد مثل: صحار، صلالة، الضاحية، ويختار زملاء المجموعة أجمل كتابة وتُعرض في ركن الصف (5 دقائق)\nالاستراتيجيات: تعلم الأقران.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أي الكلمات تبدأ بحرف الصاد؟ (سعاد / طفل / صغار / ضياء)\nالإجابة: صغار.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الفرق بين الصاد والضاد في الشكل: (ثلاث نقاط / نقطة فوق الضاد / لا فرق / نقطتان تحت الصاد)\nالإجابة: نقطة فوق الضاد.\n\nس3 (مستوى الاستدلال): اكتب كلمة فيها صاد وأخرى فيها ضاد.\nالإجابة: مثل: صباح، ضوء.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي الغرفة المبعثرة والمرتبة، ويرتب مع التلميذ أدوات حقيقية على الطاولة خطوة خطوة وهو يقول: أضع الكتاب، أعلّق الثوب؛ وللتحقق يسأله: ماذا تفعل بغرفتك قبل الخروج إلى المدرسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لمهام ترتيب الغرفة يتقاسمها أفراد الأسرة، ثم يقارنون بين صورتي درس «سيكبرون» بثلاث جمل مستعملين كلمة «بينما».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف المشترك في (المنضدة، تعرض): (الضاد / الطاء / الصاد / الدال)\nالإجابة: الضاد.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: كلمة فيها صاد متطرفة: (المنضدة / نقص / صغار / تعرض)\nالإجابة: نقص.\n\nس3 (مستوى الاستدلال): اكتب الجملة (احرص على إرضاء والديك.) بخط النسخ.\nالإجابة: كتابة الجملة بحروف متناسقة على السطر.", "- للطالب: إكمال صفحة الخط ص65 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=5"]}, {"k": "التعبير", "p": ["التعبير الكتابي: ترتيب جمل لتكوين فقرة متسلسلة (الإعداد والتخطيط)", "التعبير الكتابي: ترتيب جمل لتكوين فقرة متسلسلة (الكتابة والمراجعة)"], "w": "الأسبوع الخامس: 4–8/10/2026م", "f": ["1. يرتب الأفكار والأحداث للكتابة في: ترتيب جمل لتكوين فقرة متسلسلة (25 دقيقة)\n2. يتحدث شفويًا عن موضوع الكتابة في درس «سيكبرون» بجمل مترابطة (5 دقائق)\n3. يكتب ترتيب جمل لتكوين فقرة متسلسلة بجمل مترابطة (20 دقيقة)\n4. يراعي علامات الترقيم والنظافة في كتابته (5 دقائق)\n\nمخرج تعليمي آخر:\n- يتحدث عن الصور بجمل سليمة قبل الكتابة (10 دقائق)\n- يقيّم كتابته وكتابة زميله ويحسنها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التعلم الذاتي\n5. تعلم الأقران\n6. التقويم الذاتي\n7. التعلم المبني على المشاريع", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التعبير الكتابي\n2. ترتيب الأفكار\n3. علامات الترقيم", "يعرض المعلم ثلاث صور لطفل (يستيقظ، يذهب إلى المدرسة، ينام) مبعثرة ويطلب ترتيبها، ويرتب التلميذ الصور شفويًا (5 دقائق)", "1. التمهيد بالأسئلة: يطرح المعلم أسئلة ممهدة: كيف تبدأ يومك؟ ماذا تفعل بعد العودة من المدرسة؟ متى تراجع دروسك؟ ويجيب التلميذ ويستدعي خبرته (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. تأمل الصور والجمل: يعرض المعلم الجمل المبعثرة في النشاط ويقرؤها مع الطلاب ويناقش زمن كل جملة (الصباح، الظهيرة، المساء) ليستنتجوا ترتيبها (ص66)، ويتأمل التلميذ الصور ويتحدث عنها مع مجموعته (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط الشفوي: يطلب المعلم من كل مجموعة ترتيب الأفكار شفويًا (البداية، الأحداث، النهاية) وعرضها، ويرتب التلميذ الأفكار ويعرضها شفويًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مراجعة الخطة: يراجع المعلم مع الطلاب الأفكار المرتبة ويكتب كلمات مساعدة على السبورة، ويراجع التلميذ خطته (5 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n5. الكتابة الفردية: يطلب المعلم ترتيب الجمل من (1) إلى (5) ثم إعادة كتابة الفقرة متسلسلة مع إضافة أدوات الربط (ثم، بعد ذلك، وأخيرًا) (ص66)، ويمر بين الطلاب ويوجههم، ويكتب التلميذ في كتابه مراعيًا الترتيب وعلامات الترقيم (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n6. المراجعة والعرض: يطلب المعلم من بعض الطلاب قراءة ما كتبوه ويناقش مع الصف جوانب التميز والتحسين، ويطلب تصويب الأخطاء، ويقرأ التلميذ ما كتبه ويصوب أخطاءه (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – يوم في حياتي: تتسابق المجموعات في ترتيب بطاقات جمل عن يوم طالب عماني يساعد أسرته (يستيقظ، يرتب سريره، يذهب إلى المدرسة)، ثم تقرأ كل مجموعة فقرتها المرتبة أمام الصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نرتب الجمل في الفقرة حسب: (طول الجمل / تسلسل الأحداث والزمن / لون الخط / عدد الكلمات)\nالإجابة: تسلسل الأحداث والزمن.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نكتب الفقرة بخط: (صغير جدًا / مائل متداخل / واضح منظم / كبير غير منظم)\nالإجابة: واضح منظم.\n\nس3 (مستوى الاستدلال): اكتب فقرة من ثلاث جمل عن يوم في أسرتك.\nالإجابة: مثل: في الصباح أرتب غرفتي، ثم أذهب إلى المدرسة، وفي المساء أراجع دروسي مع أبي.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي الغرفة المبعثرة والمرتبة، ويرتب مع التلميذ أدوات حقيقية على الطاولة خطوة خطوة وهو يقول: أضع الكتاب، أعلّق الثوب؛ وللتحقق يسأله: ماذا تفعل بغرفتك قبل الخروج إلى المدرسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لمهام ترتيب الغرفة يتقاسمها أفراد الأسرة، ثم يقارنون بين صورتي درس «سيكبرون» بثلاث جمل مستعملين كلمة «بينما».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): استيقظت مبكرًا، .... ذهبت إلى المدرسة. (هل / ثم / تحت)\nالإجابة: ثم.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الجملة الأخيرة في فقرة عن اليوم: (ذهبت إلى المدرسة / استيقظت مبكرًا / تناولت الإفطار / نمت هانئًا)\nالإجابة: نمت هانئًا.\n\nس3 (مستوى الاستدلال): قيّم فقرة زميلك من حيث الترتيب والترقيم.\nالإجابة: يذكر نقطة جيدة وأخرى تحتاج إلى تحسين.", "- للطالب: التحدث مع الأسرة عن الصور ص66 وترتيب أحداثها.\n- للطالب: إكمال نشاط التعبير الكتابي ص66 وقراءته على الأسرة.\n- لولي الأمر: الاستماع إلى ابنه وهو يقرأ ما كتبه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=5"]}]}, {"t": "ليس هذا ضعفًا", "u": "المحور الأول: حياتي", "s": [{"k": "التحدث", "p": ["التحدث عن لوحة المحادثة والتمهيد لدرس «ليس هذا ضعفًا»"], "w": "الأسبوع السادس: 11–15/10/2026م", "f": ["1. يتحدث عن مضمون لوحة المحادثة في درس «ليس هذا ضعفًا» بلغة سليمة وجمل مكتملة (10 دقائق)\n2. يجيب عن أسئلة اللوحة مثل: اختر مشهدًا من المشاهد الخمسة وعلّق عليه (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يُعدّ سؤالًا إضافيًا عن اللوحة ويطرحه على زملائه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. جهاز عرض البيانات", "1. احترام الآخرين\n2. عدم التعدي على ممتلكات الآخرين\n3. نبذ التنمر", "يطرح المعلم التساؤل: ما واجبنا تجاه من هم أصغر منا؟ وكيف نتصرف مع من يسيء إلينا؟ ويعزز مداخلات الطلاب، ويعبر التلميذ عن رأيه في التعامل مع الآخرين (5 دقائق)", "1. أشاهد وأتحدث: يعرض المعلم لوحة المحادثة (ص67) ويترك للطلاب فرصة لتأملها ثم يسأل: ماذا تشاهدون؟ ويطرح أسئلة اللوحة: اختر مشهدًا من المشاهد الخمسة وعلّق عليه.، تحدث عن خلاف وقع بينك وبين أحد زملائك وكيف انتهى.، كيف تتصرف إذا حاول أحد زملائك أن يأخذ منك شيئًا بالقوة؟ ولماذا؟، ويساعدهم في صياغة جمل مكتملة، ويتأمل التلميذ اللوحة ويجيب بجمل مكتملة ويربطها بخبرته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أفضل سؤال: يطلب المعلم من كل مجموعة إعداد سؤال إضافي عن اللوحة يطرحه منسقها على المجموعات الأخرى، ويختار أفضل سؤال وأفضل إجابة، ويعد التلميذ سؤالًا مع مجموعته ويجيب عن أسئلة المجموعات الأخرى (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحدث الفردي: يطلب المعلم من بعض الطلاب التحدث في ثلاث جمل عن: خلاف حدث بينه وبين زميل وكيف انتهى بالتسامح، ويعزز اللغة السليمة وآداب التحدث، ويتحدث التلميذ أمام زملائه في ثلاث جمل مترابطة (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – موقف وحل: يسحب كل زوج بطاقة موقف (زميل أخطأ في حقك، طفل أصغر يحتاج إلى مساعدة)، ويتحاوران عن التصرف المناسب، ثم يعرضان الحل ويذكران أن التسامح خلق أصيل في المجتمع العماني (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: إذا أخذ زميلك شيئًا منك بالقوة: (أضربه / أطلب منه بأدب ثم أخبر المعلم / آخذ شيئًا منه / أصرخ عليه)\nالإجابة: أطلب منه بأدب ثم أخبر المعلم.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: أفضل طريقة لإنهاء الخلاف مع الزميل: (السخرية / الضرب / الحوار والتسامح / الخصام الطويل)\nالإجابة: الحوار والتسامح.\n\nس3 (مستوى الاستدلال): علّق على المشهد الذي اخترته في جملتين.\nالإجابة: مثل: في المشهد طفل يأخذ كرة صديقه بالقوة، وهذا تصرف مرفوض يسبب الخلاف.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ودمية موقف أخذ الكرة بالقوة، ويتدربان على الرد الصحيح: «أعطني كرتي من فضلك» ثم إخبار المعلم؛ وللتحقق يسأله: ماذا تفعل إذا أخذ زميلك شيئًا منك بالقوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مشهد من مشاهد لوحة «ليس هذا ضعفًا» الخمسة وتمثيل نهاية له بالحوار والتسامح، ثم يشرحون لماذا لا يكون التسامح ضعفًا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نتحدث عن المشهد بـ: (كلمة واحدة / إشارات فقط / صراخ / جمل مكتملة سليمة)\nالإجابة: جمل مكتملة سليمة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: التنمر على الزملاء سلوك: (مطلوب / مرفوض / مقبول أحيانًا / جيد)\nالإجابة: مرفوض.\n\nس3 (مستوى الاستدلال): تحدث عن خلاف حدث معك وكيف انتهى.\nالإجابة: يحكي موقفًا قصيرًا انتهى بالاعتذار والتسامح.", "- للطالب: تأمل لوحة المحادثة ص67 والتحدث عنها مع الأسرة في ثلاث جمل.\n- لولي الأمر: محاورة ابنه حول: خلاف حدث بينه وبين زميل وكيف انتهى بالتسامح، وتشجيعه على استخدام جمل مكتملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=6"]}, {"k": "القراءة", "p": ["القراءة التصفحية والتوقع والقراءة النموذجية لنص «ليس هذا ضعفًا»", "القراءة الجهرية الأولى لنص «ليس هذا ضعفًا» ومعاني المفردات", "القراءة الجهرية الثانية لنص «ليس هذا ضعفًا» وفهم المعنى الصريح (خطوتي الأولى)", "القراءة الجهرية الثالثة لنص «ليس هذا ضعفًا» وترتيب الأحداث", "القراءة الجهرية الرابعة وفهم المعنى الضمني في نص «ليس هذا ضعفًا» (خطوتي الثانية)", "تفسير أفكار نص «ليس هذا ضعفًا» ودمجها ومحاكاة التعبير (خطوتي الثالثة)", "القراءة الجهرية الخامسة وتقييم نص «ليس هذا ضعفًا» وإبداء الرأي (خطوتي الرابعة)", "التحليل والتركيب (أحلل وأركب) في درس «ليس هذا ضعفًا»"], "w": "الأسبوع السادس: 11–15/10/2026م", "f": ["1. يحدد هوية نص «ليس هذا ضعفًا»: العنوان والكاتب (حمدي هاشم حسانين) والمصدر والمتحدث (15 دقيقة)\n2. يتوقع مضمون النص من العنوان والصور ثم يتحقق من توقعه (5 دقائق)\n3. يقرأ نص «ليس هذا ضعفًا» قراءة جهرية صحيحة مراعيًا ضبط الكلمات وعلامات الترقيم (15 دقيقة)\n4. يذكر معاني الكلمات الجديدة (مهذب، جذب، بعنف، بشراهة) مستعينًا بالسياق (10 دقائق)\n5. يقرأ نص «ليس هذا ضعفًا» قراءة جهرية صحيحة معبرة (15 دقيقة)\n6. يسترجع معلومات صريحة وردت في النص عن (سليم، فهد، أصدقاء فهد) (15 دقيقة)\n7. يقرأ نص «ليس هذا ضعفًا» قراءة جهرية معبرة بتعدد القراءات (15 دقيقة)\n8. يرتب أحداث نص «ليس هذا ضعفًا» ترتيبًا صحيحًا (10 دقائق)\n9. يستنتج صفات الشخصيات (سليم، فهد) من أفعالها وأقوالها (5 دقائق)\n10. يقرأ الفقرات المرتبطة بالأسئلة قراءة جهرية صحيحة (20 دقيقة)\n11. يستخلص العبرة من نص «ليس هذا ضعفًا» ويحدد نوعه (15 دقيقة)\n12. يقترح عنوانًا آخر مناسبًا للنص (10 دقائق)\n13. يبدي رأيه في تصرفات سليم ويعلل رأيه (15 دقيقة)\n14. يقرأ جمل النص قراءة جهرية معبرة في نشاط تنافسي (15 دقيقة)\n15. يحلل الجمل إلى كلمات ويحدد عددها (10 دقائق)\n16. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (10 دقائق)\n- يعيد سرد مضمون النص بأسلوبه (15 دقيقة)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «ليس هذا ضعفًا مني، بل لأني أحترم حق الجار.» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يميز بين الحروف المتقاربة شكلًا (ج ح خ) في كلمات النص (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج 13: تقييم\nالمخرج 14: تطبيق\nالمخرج 15: تحليل\nالمخرج 16: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: إبداع\nالمخرج الآخر 5: تحليل\nالمخرج الآخر 6: تطبيق\nالمخرج الآخر 7: إبداع\nالمخرج الآخر 8: تطبيق", "1. التنبؤ\n2. التعلم الذاتي\n3. السؤال والجواب\n4. التعلم بالنمذجة\n5. التعلم المبني على اللعب\n6. تعلم الأقران\n7. التعلم التعاوني\n8. تعدد القراءات\n9. أعواد المثلجات\n10. التعلم بالاكتشاف\n11. العصف الذهني\n12. الحوار والمناقشة\n13. لعبة القطار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)، أعواد المثلجات بأسماء الطلاب، سلتان وبيضتان بلاستيكيتان وملعقتان", "1. القراءة التصفحية\n2. هوية النص\n3. التوقع\n4. المفردات\n5. السياق\n6. المرادف والضد\n7. المعنى الصريح\n8. الشخصيات\n9. المكان\n10. ترتيب الأحداث\n11. السرد\n12. الاستنتاج\n13. الفكرة الرئيسة\n14. احترام الآخرين\n15. العبرة\n16. نوع النص\n17. المحاكاة\n18. إبداء الرأي\n19. التقييم\n20. عدم التعدي على ممتلكات الآخرين\n21. المقطع الصوتي\n22. الكلمة\n23. الجملة", "يكتب المعلم عبارة «ليس هذا ضعفًا» ويسأل: من قد يقولها؟ ولمن؟ وفي أي موقف؟ ويتوقع التلميذ المتحدث والموقف (5 دقائق)", "1. القراءة التصفحية: يحدد المعلم صفحة النص (ص69–71) ويطلب تصفحًا سريعًا لمدة دقيقتين، ويكتب أهداف القراءة التصفحية، ثم يطلب من طالب كتابة العنوان على السبورة ومن آخر قراءة اسم الكاتب (حمدي هاشم حسانين) والمصدر (جاري العزيز)، ويتصفح التلميذ النص بسرعة ويستخرج العنوان والكاتب والمصدر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. بطاقة النص والتوقع: يكمل المعلم مع الطلاب بطاقة النص (العنوان، الكاتب، المتحدث)، ثم يطرح سؤال التوقع: من العنوان «ليس هذا ضعفًا»: هذا الكلام موجّه من طفل إلى من؟ ويدوّن التوقعات على السبورة، ويكمل التلميذ البطاقة ويكتب توقعه (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. القراءة النموذجية: يعرض المعلم النص على جهاز العرض ويقرؤه قراءة جهرية نموذجية معبرة مراعيًا علامات الترقيم ومستخدمًا المؤشر، ثم يطلب من الطلاب التحقق من توقعاتهم، ويتابع التلميذ القراءة النموذجية بالمؤشر ويقارن توقعه بمضمون النص (15 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة الجهرية الأولى: يكتب المعلم أهداف القراءة الجهرية، ثم يقرأ فقرة نموذجية ويطلب من الطلاب المجيدين ثم الأقل إجادة قراءة فقرات النص (ص69–71) بالتناوب، ويصحح الأخطاء بعد إتمام الجملة، ويقرأ التلميذ الفقرة المطلوبة قراءة جهرية صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. اكتشاف معاني المفردات: يعرض المعلم المفردات في بطاقات: مهذب (مؤدب حسن الخلق)، جذب (سحب بقوة)، بعنف (بشدة وقسوة)، بشراهة (بنهم وإفراط في الأكل)، ساخرًا (مستهزئًا)، ملازم الفراش (مريض لا يغادر سريره)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص72–73) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: ما العلاقة التي تربط سليمًا بفهد؟ (أخوان / لا تربطهما صلة / معلم وتلميذ / جاران)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (5 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الثالثة (تعدد القراءات): يوزع المعلم فقرات النص على المجموعات، ويسحب عود مثلجات باسم طالب ليقرأ الفقرة المحددة، ويستمر حتى نهاية النص، ويقرأ التلميذ الفقرة عند سحب اسمه ويتابع قراءة زملائه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. ترتيب الأحداث: يوزع المعلم بطاقات الأحداث على المجموعات ويطلب ترتيبها من (1) إلى (5) مستعينين بالنص (ص72–73)، ثم تعرض كل مجموعة ترتيبها، ويرتب التلميذ البطاقات مع مجموعته ويعلل الترتيب من النص (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. إعادة السرد: يطلب المعلم من طالبين إعادة سرد الأحداث المرتبة بأسلوبهما مستخدمين أدوات الربط (في البداية، ثم، بعد ذلك، وأخيرًا)، ويعيد التلميذ سرد الأحداث بأسلوبه (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n13. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص74–75) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (20 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n15. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: التسامح مع الجار والإحسان إليه قوة وليس ضعفًا، ويختار التلميذ الفكرة الرئيسة ويعلل (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n16. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص76) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n18. محاكاة التعبير: يعرض المعلم التعبير: «ليس هذا ضعفًا مني، بل لأني أحترم حق الجار.» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «ليس هذا خوفًا مني، بل لأني أحب السلام.»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n19. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n20. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص76–77) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص78–79) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (سليم طفل مهذب)، ويفصل التلميذ الكلمات ويعدها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n23. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: سليم، الحديقة، شطيرة، أصدقائي ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n24. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n25. غلق الدرس – سلسلة القراءة: تقرأ كل مجموعة جملة من نص «ليس هذا ضعفًا» قراءة معبرة وتسلّم الدور لمجموعة أخرى، ثم تختار المجموعات معًا قيمة من النص كالتسامح ومساعدة الآخرين وتذكر كيف يعيشها الناس في عمان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كاتب نص «ليس هذا ضعفًا»: (زهران القاسمي / نزار نجار / عبدالله الدنان / حمدي هاشم حسانين)\nالإجابة: حمدي هاشم حسانين.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الفكرة الرئيسة للنص: (أصدقاء فهد / كرة سليم الجديدة / التسامح مع الجار قوة لا ضعف / مرض فهد)\nالإجابة: التسامح مع الجار قوة لا ضعف.\n\nس3 (مستوى الاستدلال): ركّب من المقاطع (جا + رُ + نا) كلمة ذات معنى.\nالإجابة: جارُنا.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ودمية موقف أخذ الكرة بالقوة، ويتدربان على الرد الصحيح: «أعطني كرتي من فضلك» ثم إخبار المعلم؛ وللتحقق يسأله: ماذا تفعل إذا أخذ زميلك شيئًا منك بالقوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مشهد من مشاهد لوحة «ليس هذا ضعفًا» الخمسة وتمثيل نهاية له بالحوار والتسامح، ثم يشرحون لماذا لا يكون التسامح ضعفًا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): حلل كلمة (الحديقة) إلى مقاطع.\nالإجابة: الْ/ حَ/ دي/ قَةِ.\n\nس2 (مستوى التطبيق): ما الحدث الذي جاء قبل (زار سليم فهدًا في بيته فشعر فهد بالخجل)؟\nالإجابة: تغيّب فهد عن المدرسة لمرضه.\n\nس3 (مستوى الاستدلال): أكمل بالحرف المناسب (ح ج خ): ذات صبا.... ....رج سليم كي يلعب في ال....ديقة.\nالإجابة: صباح، خرج، الحديقة.", "- للطالب: قراءة نص «ليس هذا ضعفًا» ص69–71 قراءة صامتة مرة واحدة على الأقل.\n- للطالب: قراءة النص ص69–71 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة.\n- للطالب: إكمال أنشطة خطوتي الأولى ص72–73 وقراءة النص مرة أخرى.\n- للطالب: إعادة سرد أحداث نص «ليس هذا ضعفًا» مرتبة أمام الأسرة.\n- للطالب: حل أنشطة خطوتي الثانية ص74–75 في الكتاب.\n- للطالب: كتابة جملتين تحاكي التعبير «ليس هذا ضعفًا مني، بل لأني أحترم حق الجار.» وحل أنشطة ص76.\n- للطالب: كتابة رأيه في إحدى شخصيات نص «ليس هذا ضعفًا» في سطرين.\n- للطالب: حل أنشطة التحليل والتركيب ص78–79.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة.\n- لولي الأمر: الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف.\n- لولي الأمر: سؤال ابنه عن شخصيات النص ومكان أحداثه.\n- لولي الأمر: الاستماع إلى سرد ابنه ومساعدته على استخدام أدوات الربط.\n- لولي الأمر: سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «ليس هذا ضعفًا» ولماذا.\n- لولي الأمر: مناقشة ابنه في العبرة من النص وكيف يطبقها.\n- لولي الأمر: مناقشة ابنه في رأيه بالنص وتعليله.\n- لولي الأمر: لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=6"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: حروف الجر (التعرف والمحاكاة)", "النمط اللغوي: حروف الجر (التطبيق وأنشطة الكتاب)"], "w": "الأسبوع السادس: 11–15/10/2026م", "f": ["1. يتعرف حروف الجر من خلال أمثلة من النص (15 دقيقة)\n2. يحاكي حروف الجر في جمل جديدة (10 دقائق)\n3. يطبق حروف الجر في أنشطة الكتاب (20 دقيقة)\n4. يميز حروف الجر في جمل معروضة (5 دقائق)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (15 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. حروف الجر\n2. الربط بين الكلمات\n3. المعنى", "يضع المعلم القلم في الحقيبة ثم على الكتاب ويسأل: أين القلم؟ ويجيب التلميذ: في الحقيبة/ على الكتاب (5 دقائق)", "1. اكتشاف النمط: يعرض المعلم جملًا من النص: خرج سليم إلى الحديقة، اقترب منه جاره، ألعب مع أصدقائي في الحديقة، ظهرت علامات الغضب على وجهه، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: حروف الجر كلمات صغيرة تربط بين الكلمات في الجملة، منها: في، من، إلى، على، عن، الباء، اللام، مثل: خرج سليم إلى الحديقة، ويلاحظ التلميذ الأمثلة ويستنتج النمط (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المحاكاة: يضع المعلم قلمًا في الصندوق ويُخرجه ويضعه على الطاولة ويسأل في كل مرة: أين القلم؟ ليستخدم الطلاب (في، من، على)، ثم يطلب جملًا بحروف الجر (إلى، عن، الباء)، ويحاكي التلميذ النمط في جمل جديدة على سبورته (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص80) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: ذهب إلى زيارته، سأل عنه، أعد إليّ كرتي، أوصانا رسول الله ﷺ بالجار، ويذكر التلميذ أمثلة جديدة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم أنشطة الكتاب: ترتيب الكلمات لتكوين جمل فيها حروف جر، وإكمال الجمل بحرف الجر المناسب (ص80)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n7. غلق الدرس – أين المندوس؟: يخبئ المعلم مجسمًا لمندوس عماني في مكان من الصف، ويبحث عنه الطلاب ويصفون مكانه بجمل فيها حروف الجر (في، على، تحت، من، إلى)، والمجموعة التي تصيب أولًا تنال نقطة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: حرف الجر في جملة (خرج سليم إلى الحديقة): (سليم / إلى / الحديقة / خرج)\nالإجابة: إلى.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الجملة التي فيها حرفا جر: (سليم مهذب / ذهبت من البيت إلى المدرسة / الكرة جميلة / لعب الأطفال)\nالإجابة: ذهبت من البيت إلى المدرسة.\n\nس3 (مستوى الاستدلال): رتب: (الحديقة - إلى - سليم - خرج).\nالإجابة: خرج سليم إلى الحديقة.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ودمية موقف أخذ الكرة بالقوة، ويتدربان على الرد الصحيح: «أعطني كرتي من فضلك» ثم إخبار المعلم؛ وللتحقق يسأله: ماذا تفعل إذا أخذ زميلك شيئًا منك بالقوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مشهد من مشاهد لوحة «ليس هذا ضعفًا» الخمسة وتمثيل نهاية له بالحوار والتسامح، ثم يشرحون لماذا لا يكون التسامح ضعفًا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سافر أبي .... صلالة. (إلى / في / على)\nالإجابة: إلى.\n\nس2 (مستوى التطبيق): أي الكلمات حرف جر؟ (لعب / كرة / على / سليم)\nالإجابة: على.\n\nس3 (مستوى الاستدلال): أكمل بحرفي جر مناسبين: ذهبت .... البيت .... المسجد.\nالإجابة: ذهبت من البيت إلى المسجد.", "- للطالب: حل أنشطة النمط اللغوي ص80 وكتابة جملتين موظفًا حروف الجر.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=6"]}, {"k": "الإملاء", "p": ["النمط الإملائي: علامات الترقيم (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب) (الملاحظة والتصنيف)", "النمط الإملائي: علامات الترقيم (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب) (التطبيق والإملاء المنقول)"], "w": "الأسبوع السابع: 18–22/10/2026م", "f": ["1. يلاحظ علامات الترقيم (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب) في كلمات من النص (15 دقيقة)\n2. يصنف كلمات وفق علامات الترقيم (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب) (10 دقائق)\n3. يكتب كلمات تتضمن علامات الترقيم (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب) كتابة صحيحة (15 دقيقة)\n4. يكتب إملاءً منقولًا بخط واضح (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يذكر أمثلة جديدة من خارج النص (15 دقيقة)\n- يميز الخطأ الإملائي في كلمة ويصححه (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة\n6. السؤال والجواب", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. علامات الترقيم (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب)\n2. الوقف\n3. التنغيم", "يقرأ المعلم جملة واحدة بثلاث نبرات (خبر، سؤال، تعجب) ويسأل: ما الفرق؟ ويميز التلميذ النبرات (5 دقائق)", "1. ملاحظة الظاهرة: يعرض المعلم جملًا من النص فيها كلمات ملونة: سليم طفل مهذب.، أعطني هذه الكرة، ثم أردها إليك.، هل تزورني رغم كل ما بدر مني؟، وفجأة!، نعم، ولماذا لا أزورك؟، أنا آسف، لقد أسأت التصرف.، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: النقطة (.) في نهاية الجملة التامة، والفاصلة (،) بين الجمل القصيرة المتصلة في المعنى، وعلامة الاستفهام (؟) بعد السؤال، وعلامة التعجب (!) بعد التعبير عن الدهشة والانفعال، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التصنيف: يعرض المعلم الحوار بين فهد وسليم ويطلب ملاحظة العلامات، ثم يصنف الجمل حسب العلامة المناسبة لها في جدول (ص81)، ويصنف التلميذ الكلمات في الجدول (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أنشطة الكتاب: يطلب المعلم وضع علامات الترقيم المناسبة في الحوار بين الأقواس، ثم إعادة كتابة الحوار بعد وضع العلامات (ص81)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n6. الإملاء المنقول: يكتب المعلم على السبورة: «فهد: هل تزورني رغم كل ما بدر مني؟ سليم: نعم، ولماذا لا أزورك؟» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – علامتي المناسبة: يقرأ المعلم جملًا عن عمان (ما أجمل بحر عمان! أين تقع نزوى؟) فيرفع الطلاب بطاقة العلامة المناسبة (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب)، ثم تكتب كل مجموعة جملة عن وطنها بعلامتها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نضع في نهاية الجملة الخبرية التامة: (النقطة / علامة الاستفهام / علامة التعجب / الفاصلة)\nالإجابة: النقطة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: العلامة المناسبة مكان الفراغ: هل تعدني ألا تكرر ذلك (....): (علامة الاستفهام (؟) / الفاصلة (،) / النقطة (.))\nالإجابة: علامة الاستفهام (؟)\n\nس3 (مستوى الاستدلال): ضع علامات الترقيم: (نعم أعدك لن أكرر ذلك)\nالإجابة: نعم، أعدك لن أكرر ذلك.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ودمية موقف أخذ الكرة بالقوة، ويتدربان على الرد الصحيح: «أعطني كرتي من فضلك» ثم إخبار المعلم؛ وللتحقق يسأله: ماذا تفعل إذا أخذ زميلك شيئًا منك بالقوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مشهد من مشاهد لوحة «ليس هذا ضعفًا» الخمسة وتمثيل نهاية له بالحوار والتسامح، ثم يشرحون لماذا لا يكون التسامح ضعفًا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الجملة الصحيحة الترقيم: (سليم طفل؟ مهذب / سليم طفل مهذب؟ / سليم طفل مهذب. / سليم، طفل، مهذب!)\nالإجابة: سليم طفل مهذب.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نضع بين (نعم) و(لماذا لا أزورك) في الحوار: (النقطتين / الفاصلة / علامة التعجب / لا شيء)\nالإجابة: الفاصلة.\n\nس3 (مستوى الاستدلال): اكتب حوارًا من سطرين بين صديقين مستخدمًا ثلاث علامات ترقيم.\nالإجابة: مثل: أحمد: هل نلعب معًا؟ خالد: نعم، ما أجمل اللعب معك!", "- للطالب: حل أنشطة النمط الإملائي ص81 وكتابة خمس كلمات تمثل علامات الترقيم (النقطة، الفاصلة، علامة الاستفهام، علامة التعجب).\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=6"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (ج ح خ) بخط النسخ"], "w": "الأسبوع السابع: 18–22/10/2026م", "f": ["1. يكتب الحروف (ج ح خ) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (10 دقائق)\n2. يكتب الكلمات والجملة: «أحترم حق الجار.» محاكيًا النموذج (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (ج ح خ) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (جاره، الحديقة، خرج، فجأة) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص82) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «أحترم حق الجار.» ويختار أجود خط ليعلق في لوحة الصف (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – الخطاط العماني: يكتب كل طالب بخط النسخ كلمة عمانية فيها حرف من حروف (ج ح خ) مثل: جبل، حصن، خنجر، ويتبادل الزملاء البطاقات ويقيّمون جمال الحروف ثم تُعرض على لوحة الصف (5 دقائق)\nالاستراتيجيات: تعلم الأقران.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف الذي تحته نقطة: (ح / ع / ج / خ)\nالإجابة: ج.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الحرف الذي فوقه نقطة: (ح / ج / ع / خ)\nالإجابة: خ.\n\nس3 (مستوى الاستدلال): اكتب كلمة فيها جيم وأخرى فيها خاء.\nالإجابة: مثل: جمل، خبز.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ودمية موقف أخذ الكرة بالقوة، ويتدربان على الرد الصحيح: «أعطني كرتي من فضلك» ثم إخبار المعلم؛ وللتحقق يسأله: ماذا تفعل إذا أخذ زميلك شيئًا منك بالقوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مشهد من مشاهد لوحة «ليس هذا ضعفًا» الخمسة وتمثيل نهاية له بالحوار والتسامح، ثم يشرحون لماذا لا يكون التسامح ضعفًا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أي الكلمات فيها حرف الحاء؟ (خرج / فجأة / جاره / الحديقة)\nالإجابة: الحديقة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: كلمة فيها حرف الجيم في وسطها: (خرج / فجأة / حق / جاره)\nالإجابة: فجأة.\n\nس3 (مستوى الاستدلال): اكتب الجملة (أحترم حق الجار.) بخط النسخ.\nالإجابة: كتابة الجملة بحروف متناسقة على السطر.", "- للطالب: إكمال صفحة الخط ص82 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=6"]}, {"k": "التعبير", "p": ["التعبير الكتابي: إكمال قصة بكلمات مناسبة وتوقع نهايتها (الإعداد والتخطيط)", "التعبير الكتابي: إكمال قصة بكلمات مناسبة وتوقع نهايتها (الكتابة والمراجعة)"], "w": "الأسبوع السابع: 18–22/10/2026م", "f": ["1. يرتب الأفكار والأحداث للكتابة في: إكمال قصة بكلمات مناسبة وتوقع نهايتها (25 دقيقة)\n2. يتحدث شفويًا عن موضوع الكتابة في درس «ليس هذا ضعفًا» بجمل مترابطة (5 دقائق)\n3. يكتب إكمال قصة بكلمات مناسبة وتوقع نهايتها بجمل مترابطة (15 دقيقة)\n4. يراعي علامات الترقيم والنظافة في كتابته (5 دقائق)\n\nمخرج تعليمي آخر:\n- يتحدث عن الصور بجمل سليمة قبل الكتابة (10 دقائق)\n- يقيّم كتابته وكتابة زميله ويحسنها (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التعلم الذاتي\n5. تعلم الأقران\n6. التقويم الذاتي\n7. التعلم المبني على المشاريع", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التعبير الكتابي\n2. ترتيب الأفكار\n3. علامات الترقيم", "يمثل المعلم موقفًا: يصطدم بطالب دون قصد ثم يعتذر، ويسأل: ماذا قلت؟ وماذا يرد زميلك؟ ويعبر التلميذ عن الاعتذار وقبوله (5 دقائق)", "1. التمهيد بالأسئلة: يطرح المعلم أسئلة ممهدة: هل أصبت أحدًا بالخطأ يومًا؟ ماذا فعلت؟ كيف نعتذر؟ ويجيب التلميذ ويستدعي خبرته (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. تأمل الصور والجمل: يعرض المعلم نص القصة الناقص (سالم يلعب بالكرة فتصيب ناجية خطأ) والكلمات المساعدة (قصد، ناجية، الحديقة، اعتذاري) ويناقش مع الطلاب مكان كل كلمة شفويًا (ص83)، ويتأمل التلميذ الصور ويتحدث عنها مع مجموعته (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط الشفوي: يطلب المعلم من كل مجموعة ترتيب الأفكار شفويًا (البداية، الأحداث، النهاية) وعرضها، ويرتب التلميذ الأفكار ويعرضها شفويًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مراجعة الخطة: يراجع المعلم مع الطلاب الأفكار المرتبة ويكتب كلمات مساعدة على السبورة، ويراجع التلميذ خطته (5 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n5. الكتابة الفردية: يطلب المعلم إكمال القصة بالكلمات المناسبة، ثم كتابة رد ناجية المتوقع في جملتين (ص83)، ويمر بين الطلاب ويوجههم، ويكتب التلميذ في كتابه مراعيًا الترتيب وعلامات الترقيم (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n6. المراجعة والعرض: يطلب المعلم من بعض الطلاب قراءة ما كتبوه ويناقش مع الصف جوانب التميز والتحسين، ويطلب تصويب الأخطاء، ويقرأ التلميذ ما كتبه ويصوب أخطاءه (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – قوة التسامح: يختار كل زوج مشهدًا من اللوحة ويمثلانه، ثم يبيّنان أن الاعتذار والتسامح ومساعدة الآخرين ليست ضعفًا بل قوة يعتز بها المجتمع العماني، ويذكران موقفًا مشابهًا من حياتهما (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كان سالم يلعب بالكرة في: (البحر / المطبخ / الحديقة / المسجد)\nالإجابة: الحديقة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: شعرت ناجية بعد الإصابة بـ: (النعاس / الألم والانزعاج / الفرح الشديد / الجوع)\nالإجابة: الألم والانزعاج.\n\nس3 (مستوى الاستدلال): اكتب رد ناجية المتوقع في جملتين.\nالإجابة: مثل: لا بأس يا سالم، أقبل اعتذارك، وانتبه في المرة القادمة.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ودمية موقف أخذ الكرة بالقوة، ويتدربان على الرد الصحيح: «أعطني كرتي من فضلك» ثم إخبار المعلم؛ وللتحقق يسأله: ماذا تفعل إذا أخذ زميلك شيئًا منك بالقوة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مشهد من مشاهد لوحة «ليس هذا ضعفًا» الخمسة وتمثيل نهاية له بالحوار والتسامح، ثم يشرحون لماذا لا يكون التسامح ضعفًا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نختم القصة بـ: (سؤال غامض / حدث جديد لا علاقة له / لا شيء / نهاية مناسبة للأحداث)\nالإجابة: نهاية مناسبة للأحداث.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الرد المتوقع من ناجية: (اذهب بعيدًا / لن أكلمك أبدًا / سأضربك / لا بأس، سامحتك)\nالإجابة: لا بأس، سامحتك.\n\nس3 (مستوى الاستدلال): قيّم نهاية قصة زميلك.\nالإجابة: يذكر هل النهاية مناسبة ومترابطة ويعلل.", "- للطالب: التحدث مع الأسرة عن الصور ص83 وترتيب أحداثها.\n- للطالب: إكمال نشاط التعبير الكتابي ص83 وقراءته على الأسرة.\n- لولي الأمر: الاستماع إلى ابنه وهو يقرأ ما كتبه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=6"]}]}, {"t": "مفتاح القراءة (مراجعة المحور الأول)", "u": "المحور الأول: حياتي", "s": [{"k": "القراءة", "p": ["القراءة التصفحية والتوقع والقراءة النموذجية لنص «مفتاح القراءة (مراجعة المحور الأول)»", "القراءة الجهرية الأولى لنص «مفتاح القراءة (مراجعة المحور الأول)» ومعاني المفردات", "القراءة الجهرية الثانية لنص «مفتاح القراءة (مراجعة المحور الأول)» وفهم المعنى الصريح (خطوتي الأولى)", "القراءة الجهرية الرابعة وفهم المعنى الضمني في نص «مفتاح القراءة (مراجعة المحور الأول)» (خطوتي الثانية)", "تفسير أفكار نص «مفتاح القراءة (مراجعة المحور الأول)» ودمجها ومحاكاة التعبير (خطوتي الثالثة)", "القراءة الجهرية الخامسة وتقييم نص «مفتاح القراءة (مراجعة المحور الأول)» وإبداء الرأي (خطوتي الرابعة)", "التحليل والتركيب (أحلل وأركب) في درس «مفتاح القراءة (مراجعة المحور الأول)»", "مراجعة شاملة وتقويم ختامي لدرس «مفتاح القراءة (مراجعة المحور الأول)»"], "w": "الأسبوع السابع: 18–22/10/2026م – الأسبوع الثامن: 25–29/10/2026م", "f": ["1. يحدد هوية نص «مفتاح القراءة (مراجعة المحور الأول)»: العنوان والكاتب (مؤلفو الكتاب) والمصدر والمتحدث (15 دقيقة)\n2. يتوقع مضمون النص من العنوان والصور ثم يتحقق من توقعه (5 دقائق)\n3. يقرأ نص «مفتاح القراءة (مراجعة المحور الأول)» قراءة جهرية صحيحة مراعيًا ضبط الكلمات وعلامات الترقيم (15 دقيقة)\n4. يذكر معاني الكلمات الجديدة (أتقن، حقه، نخلط، جائزة) مستعينًا بالسياق (10 دقائق)\n5. يقرأ نص «مفتاح القراءة (مراجعة المحور الأول)» قراءة جهرية صحيحة معبرة (15 دقيقة)\n6. يسترجع معلومات صريحة وردت في النص عن (يحيى، معلمة اللغة العربية، زملاء يحيى) (15 دقيقة)\n7. يستنتج صفات الشخصيات (يحيى، معلمة اللغة العربية) من أفعالها وأقوالها (5 دقائق)\n8. يقرأ الفقرات المرتبطة بالأسئلة قراءة جهرية صحيحة (20 دقيقة)\n9. يستخلص العبرة من نص «مفتاح القراءة (مراجعة المحور الأول)» ويحدد نوعه (15 دقيقة)\n10. يقترح عنوانًا آخر مناسبًا للنص (10 دقائق)\n11. يبدي رأيه في تصرفات يحيى ويعلل رأيه (15 دقيقة)\n12. يقرأ جمل النص قراءة جهرية معبرة في نشاط تنافسي (15 دقيقة)\n13. يحلل الجمل إلى كلمات ويحدد عددها (10 دقائق)\n14. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (20 دقيقة)\n15. يجيب عن أسئلة متنوعة تقيس فهم النص والمفردات (15 دقيقة)\n16. يوظف نمطي الدرس (أنماط المحور، إملاء المحور) في جمل صحيحة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (10 دقائق)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «أحب مدرستي، وأحب زملائي ومعلماتي.» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يركب من الحروف كلمات ذات معنى (10 دقائق)\n- يحدد ما أتقنه وما يحتاج إلى تدريب في الدرس (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تحليل\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: إبداع\nالمخرج 11: تقييم\nالمخرج 12: تطبيق\nالمخرج 13: تحليل\nالمخرج 14: تطبيق\nالمخرج 15: فهم\nالمخرج 16: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: تحليل\nالمخرج الآخر 5: تطبيق\nالمخرج الآخر 6: إبداع\nالمخرج الآخر 7: تطبيق\nالمخرج الآخر 8: تقييم", "1. التنبؤ\n2. التعلم الذاتي\n3. السؤال والجواب\n4. التعلم بالنمذجة\n5. التعلم المبني على اللعب\n6. تعلم الأقران\n7. التعلم التعاوني\n8. تعدد القراءات\n9. التعلم بالاكتشاف\n10. أعواد المثلجات\n11. العصف الذهني\n12. الحوار والمناقشة\n13. لعبة القطار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)، أعواد المثلجات بأسماء الطلاب، سلتان وبيضتان بلاستيكيتان وملعقتان", "1. القراءة التصفحية\n2. هوية النص\n3. التوقع\n4. المفردات\n5. السياق\n6. المرادف والضد\n7. المعنى الصريح\n8. الشخصيات\n9. المكان\n10. الاستنتاج\n11. الفكرة الرئيسة\n12. حب القراءة\n13. العبرة\n14. نوع النص\n15. المحاكاة\n16. إبداء الرأي\n17. التقييم\n18. إتقان النطق\n19. المقطع الصوتي\n20. الكلمة\n21. الجملة\n22. المراجعة\n23. أنماط المحور\n24. إملاء المحور", "يعرض المعلم صندوقًا مغلفًا كهدية مكتوبًا عليه «جائزة القراءة» ويسأل: كيف نفوز بهذه الجائزة؟ ويقترح التلميذ طرقًا للفوز بالجائزة (5 دقائق)", "1. القراءة التصفحية: يحدد المعلم صفحة النص (ص88–89) ويطلب تصفحًا سريعًا لمدة دقيقتين، ويكتب أهداف القراءة التصفحية، ثم يطلب من طالب كتابة العنوان على السبورة ومن آخر قراءة اسم الكاتب (مؤلفو الكتاب) والمصدر (أحب لغتي – مراجعة المحور)، ويتصفح التلميذ النص بسرعة ويستخرج العنوان والكاتب والمصدر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. بطاقة النص والتوقع: يكمل المعلم مع الطلاب بطاقة النص (العنوان، الكاتب، المتحدث)، ثم يطرح سؤال التوقع: من العنوان «مفتاح القراءة»: ما المفتاح الذي يساعدنا على القراءة الجيدة؟ ويدوّن التوقعات على السبورة، ويكمل التلميذ البطاقة ويكتب توقعه (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. القراءة النموذجية: يعرض المعلم النص على جهاز العرض ويقرؤه قراءة جهرية نموذجية معبرة مراعيًا علامات الترقيم ومستخدمًا المؤشر، ثم يطلب من الطلاب التحقق من توقعاتهم، ويتابع التلميذ القراءة النموذجية بالمؤشر ويقارن توقعه بمضمون النص (15 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة الجهرية الأولى: يكتب المعلم أهداف القراءة الجهرية، ثم يقرأ فقرة نموذجية ويطلب من الطلاب المجيدين ثم الأقل إجادة قراءة فقرات النص (ص88–89) بالتناوب، ويصحح الأخطاء بعد إتمام الجملة، ويقرأ التلميذ الفقرة المطلوبة قراءة جهرية صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. اكتشاف معاني المفردات: يعرض المعلم المفردات في بطاقات: أتقن (أحسن وأجاد)، حقه (نصيبه الصحيح)، نخلط (نمزج ولا نفرق)، جائزة (مكافأة للفائز)، عيّنت (حددت)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص90–91) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: كم عمر يحيى؟ (سبع سنوات / خمس سنوات / تسع سنوات / عشر سنوات)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (10 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص92) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (20 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n12. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: إتقان القراءة الصحيحة طريق إلى حب الكتب والفوز، ويختار التلميذ الفكرة الرئيسة ويعلل (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n13. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص92–93) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n14. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n15. محاكاة التعبير: يعرض المعلم التعبير: «أحب مدرستي، وأحب زملائي ومعلماتي.» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «أحب بيتي، وأحب أسرتي وجيراني.»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n16. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص93) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n18. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n19. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص95) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (أحب مدرستي وأحب زملائي)، ويفصل التلميذ الكلمات ويعدها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n20. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: مدرستي، القراءة، جائزة، يحيى ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n21. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n22. محطات المراجعة: يوزع المجموعات على أربع محطات: محطة الفهم، محطة المفردات، محطة النمط اللغوي، محطة الإملاء، ويتنقل الطلاب بينها كل ثلاث دقائق ونصف، وينجز التلميذ مهمة كل محطة مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n23. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص الدرس، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n24. التقويم الذاتي: يوزع المعلم بطاقة (أتقنت/ أحتاج إلى تدريب) لكل مهارة في الدرس، ويقيّم التلميذ مستواه في مهارات الدرس (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n25. غلق الدرس – مفاتيح المندوس: تتنافس المجموعات في الإجابة عن أسئلة سريعة عن النص، وكل إجابة صحيحة تمنحها «مفتاحًا» لفتح مندوس عماني قديم مرسوم على السبورة، تجد فيه قيمة من قيم المحور كالتعاون أو الصدق (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: اسم التلميذ في نص المراجعة: (فهد / ضياء / يحيى / سليم)\nالإجابة: يحيى.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نوع نص المراجعة: (خبر / قصيدة / إعلان / قصة على لسان تلميذ)\nالإجابة: قصة على لسان تلميذ.\n\nس3 (مستوى الاستدلال): أعد سرد نص «مفتاح القراءة» في ثلاث جمل.\nالإجابة: يحيى يحب مدرسته، ودربته معلمته على القراءة الصحيحة، فتدرب جيدًا وينتظر مسابقة جائزة القراءة.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ فقرة من نص «مفتاح القراءة» جملة جملة، ويضعان خطًا تحت اسم يحيى وعبارة «جائزة القراءة»، ويوضح معنى «أتقن» بمثال؛ وللتحقق يسأله: ما اسم التلميذ في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إعلان قصير لمسابقة قراءة في صفهم يحددون فيه الموعد والجائزة مستعملين كلمتي «أتقن» و«جائزة»، ثم يتوقعون من يفوز بالمسابقة في النص ولماذا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الجملة الفعلية: (المدرسة جميلة / القراءة مفتاح / أحب يحيى القراءة / يحيى تلميذ)\nالإجابة: أحب يحيى القراءة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: معنى «لكل حرف حقه من اللسان والحلق والفم والأسنان»: (نحفظ الحروف فقط / نكتب الحروف بالألوان / ننطق كل حرف من مخرجه الصحيح / نقرأ بسرعة)\nالإجابة: ننطق كل حرف من مخرجه الصحيح.\n\nس3 (مستوى الاستدلال): اكتب جملة فعلية فيها حرف جر وظرف زمان.\nالإجابة: مثل: ذهب يحيى إلى المكتبة في الصباح.", "- للطالب: قراءة نص «مفتاح القراءة (مراجعة المحور الأول)» ص88–89 قراءة صامتة مرة واحدة على الأقل.\n- للطالب: قراءة النص ص88–89 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة.\n- للطالب: إكمال أنشطة خطوتي الأولى ص90–91 وقراءة النص مرة أخرى.\n- للطالب: حل أنشطة خطوتي الثانية ص92 في الكتاب.\n- للطالب: كتابة جملتين تحاكي التعبير «أحب مدرستي، وأحب زملائي ومعلماتي.» وحل أنشطة ص92–93.\n- للطالب: كتابة رأيه في إحدى شخصيات نص «مفتاح القراءة (مراجعة المحور الأول)» في سطرين.\n- للطالب: حل أنشطة التحليل والتركيب ص95.\n- للطالب: مراجعة نص «مفتاح القراءة (مراجعة المحور الأول)» وأنشطته كاملة والتدرب على ما يحتاج إلى تدريب.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة.\n- لولي الأمر: الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف.\n- لولي الأمر: سؤال ابنه عن شخصيات النص ومكان أحداثه.\n- لولي الأمر: سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «مفتاح القراءة (مراجعة المحور الأول)» ولماذا.\n- لولي الأمر: مناقشة ابنه في العبرة من النص وكيف يطبقها.\n- لولي الأمر: مناقشة ابنه في رأيه بالنص وتعليله.\n- لولي الأمر: لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت.\n- لولي الأمر: الاطلاع على بطاقة التقويم الذاتي ومساعدة ابنه في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=7"]}, {"k": "الأنماط اللغوية", "p": ["مراجعة النمط اللغوي: ظرفا الزمان والمكان من خلال نص «مفتاح القراءة (مراجعة المحور الأول)»", "مراجعة النمط اللغوي: الجملة الفعلية من خلال نص «مفتاح القراءة (مراجعة المحور الأول)»", "مراجعة النمط اللغوي: حروف الجر من خلال نص «مفتاح القراءة (مراجعة المحور الأول)»"], "w": "الأسبوع الثامن: 25–29/10/2026م", "f": ["1. يستخرج أمثلة على ظرفا الزمان والمكان من نص «مفتاح القراءة (مراجعة المحور الأول)» (20 دقيقة)\n2. يوظف ظرفا الزمان والمكان في جمل صحيحة (10 دقائق)\n3. يستخرج أمثلة على الجملة الفعلية من نص «مفتاح القراءة (مراجعة المحور الأول)» (10 دقائق)\n4. يوظف الجملة الفعلية في جمل صحيحة (20 دقيقة)\n5. يستخرج أمثلة على حروف الجر من نص «مفتاح القراءة (مراجعة المحور الأول)» (20 دقيقة)\n6. يوظف حروف الجر في جمل صحيحة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (15 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. ظرفا الزمان والمكان\n2. ظرف الزمان\n3. ظرف المكان\n4. الجملة الفعلية\n5. الفعل\n6. الفاعل\n7. حروف الجر\n8. الربط بين الكلمات\n9. المعنى", "يسأل المعلم: أين تجلس في الفصل؟ ومتى تقرأ في البيت؟ ويجيب التلميذ بظرف مكان وظرف زمان (5 دقائق)", "1. اكتشاف النمط: يعرض المعلم جملًا من النص: في الصباح أذهب إلى المدرسة، جلس يحيى أمام المعلمة، وضع الكتاب فوق المكتب، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: ظرف الزمان كلمة تدل على وقت حدوث الفعل (الصباح، الظهيرة، المساء، قبل، بعد)، وظرف المكان كلمة تدل على مكانه (تحت، فوق، بين، أمام، عند)، ويلاحظ التلميذ الأمثلة ويستنتج النمط (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المحاكاة: يضع المعلم كتابًا في أماكن مختلفة (تحت الطاولة، فوقها، أمامها، بين حقيبتين) ويطلب وصف مكانه في كل مرة، ثم يسأل عن أوقات اليوم ويطلب جملًا بظروف الزمان، ويحاكي التلميذ النمط في جمل جديدة على سبورته (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص93–94) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: أحب مدرستي، تحرص المعلمة على تدريبنا، تدرب يحيى على القراءة، ويذكر التلميذ أمثلة جديدة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم أنشطة الكتاب: وضع الفعل المناسب في الجملة بلعبة الإناء (يسحب طالب ورقة جملة ويختار فعلها من السبورة)، ثم إكمال الجمل بأفعال مناسبة (ص93–94)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (20 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n7. اكتشاف النمط: تدرب على القراءة، قرأ في سورة الليل، حصل على الجائزة، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: حروف الجر كلمات صغيرة تربط بين الكلمات في الجملة، منها: في، من، إلى، على، عن، الباء، اللام، مثل: خرج سليم إلى الحديقة، ويلاحظ التلميذ الأمثلة ويستنتج النمط (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. المحاكاة: يضع المعلم قلمًا في الصندوق ويُخرجه ويضعه على الطاولة ويسأل في كل مرة: أين القلم؟ ليستخدم الطلاب (في، من، على)، ثم يطلب جملًا بحروف الجر (إلى، عن، الباء)، ويحاكي التلميذ النمط في جمل جديدة على سبورته (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. غلق الدرس – أنماط من بلادي: تسحب كل مجموعة بطاقة نمط (جملة فعلية، ظرف، حرف جر) وتكوّن به جملة عن مكان في عمان مثل: ذهبنا إلى قلعة بهلاء صباحًا، وتقرؤها أمام الصف، وتنال نقطة على كل جملة صحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: ظرف الزمان في (المسابقة بعد أسبوع): (بعد / أسبوع / المسابقة / لا يوجد)\nالإجابة: بعد.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الفعل في (تدرب يحيى على القراءة): (القراءة / تدرب / على / يحيى)\nالإجابة: تدرب.\n\nس3 (مستوى الاستدلال): وظف حرفين من حروف الجر (في، من، على، الباء، عن) في جملتين.\nالإجابة: مثل: قرأت في الكتاب، وكتبت بالقلم.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ فقرة من نص «مفتاح القراءة» جملة جملة، ويضعان خطًا تحت اسم يحيى وعبارة «جائزة القراءة»، ويوضح معنى «أتقن» بمثال؛ وللتحقق يسأله: ما اسم التلميذ في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إعلان قصير لمسابقة قراءة في صفهم يحددون فيه الموعد والجائزة مستعملين كلمتي «أتقن» و«جائزة»، ثم يتوقعون من يفوز بالمسابقة في النص ولماذا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ذهب يحيى .... المكتبة. (إلى / لن / عن)\nالإجابة: إلى.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حوّل إلى جملة فعلية: (المعلمة أعلنت المسابقة): (المسابقة المعلمة / أعلنت المسابقة المعلمة المعلمة / أعلنت المعلمة المسابقة / المعلمة المسابقة)\nالإجابة: أعلنت المعلمة المسابقة.\n\nس3 (مستوى الاستدلال): اكتب جملة فيها ثلاثة حروف جر.\nالإجابة: مثل: ذهبت من البيت إلى المدرسة في الصباح.", "- للطالب: حل أنشطة النمط اللغوي ص93–94 وكتابة جملتين موظفًا ظرفا الزمان والمكان.\n- للطالب: حل أنشطة النمط اللغوي ص93–94 وكتابة جملتين موظفًا الجملة الفعلية.\n- للطالب: حل أنشطة النمط اللغوي ص93–94 وكتابة جملتين موظفًا حروف الجر.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=7"]}, {"k": "الإملاء", "p": ["مراجعة النمط الإملائي: التاء المفتوحة والتاء المربوطة من خلال نص «مفتاح القراءة (مراجعة المحور الأول)»", "مراجعة النمط الإملائي: اللام الشمسية واللام القمرية من خلال نص «مفتاح القراءة (مراجعة المحور الأول)»", "مراجعة النمط الإملائي: علامات الترقيم من خلال نص «مفتاح القراءة (مراجعة المحور الأول)»"], "w": "الأسبوع الثامن: 25–29/10/2026م", "f": ["1. يصنف كلمات من نص «مفتاح القراءة (مراجعة المحور الأول)» وفق التاء المفتوحة والتاء المربوطة (10 دقائق)\n2. يكتب كلمات وجملًا تتضمن التاء المفتوحة والتاء المربوطة كتابة صحيحة (20 دقيقة)\n3. يصنف كلمات من نص «مفتاح القراءة (مراجعة المحور الأول)» وفق اللام الشمسية واللام القمرية (10 دقائق)\n4. يكتب كلمات وجملًا تتضمن اللام الشمسية واللام القمرية كتابة صحيحة (25 دقيقة)\n5. يصنف كلمات من نص «مفتاح القراءة (مراجعة المحور الأول)» وفق علامات الترقيم (10 دقائق)\n6. يكتب كلمات وجملًا تتضمن علامات الترقيم كتابة صحيحة (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يميز الخطأ الإملائي في كلمة ويصححه (15 دقيقة)\n- يذكر أمثلة جديدة من خارج النص (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق", "1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. السؤال والجواب\n4. التعلم بالاكتشاف\n5. التعلم المبني على اللعب\n6. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. التاء المفتوحة والتاء المربوطة\n2. الوقف على الكلمة\n3. التاء في آخر الكلمة\n4. اللام الشمسية واللام القمرية\n5. ال التعريف\n6. تُكتب ولا تُنطق\n7. تُكتب وتُنطق\n8. علامات الترقيم\n9. الوقف\n10. التنغيم", "يعرض كلمات من نص المراجعة ويطلب رفع (ت) أو (ة)، ويرفع التلميذ البطاقة المناسبة (5 دقائق)", "1. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشطة الكتاب: يطلب المعلم تصنيف كلمات النشاط (السابعة، معلمات، قراءة، علامات، اشتدت، المعلمة، عفت، سورة، صوت، جائزة، رسالة) حسب رسم التاء (ص94–95)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. الإملاء المنقول: يكتب المعلم على السبورة: «أنا في السابعة، أحب مدرستي ومعلماتي، وأحب القراءة.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. ملاحظة الظاهرة: يعرض المعلم جملًا من النص فيها كلمات ملونة: الشمسية، القمرية، اللسان، الحلق، الفم، الأسنان، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: اللام الشمسية تُكتب ولا تُنطق ويُشدَّد الحرف بعدها مثل (الشّمس)، واللام القمرية تُكتب وتُنطق مثل (القمر)، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التصنيف: يوجه الطلاب إلى قراءة الجمل وملاحظة الكلمات الملونة وكتابتها بجانب الجملة، ثم تصنيفها في جدول (لام شمسية/ لام قمرية) (ص94–95)، ويصنف التلميذ الكلمات في الجدول (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. أنشطة الكتاب: يطلب المعلم وضع علامات الترقيم المناسبة في جمل من نص المراجعة، ثم قراءتها بالنبرة المناسبة (ص94–95)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n8. الإملاء المنقول: يكتب المعلم على السبورة: «هل سأفوز بجائزة القراءة؟ ما أجمل القراءة!» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n9. غلق الدرس – محقق الإملاء: يكتب المعلم على السبورة جملًا قصيرة عن عمان فيها أخطاء في التاء أو اللام أو علامات الترقيم، وتتسابق المجموعات في اكتشاف الخطأ وتصحيحه وقراءة الجملة صحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: التاء في (قراءة): (تاء مربوطة / تاء مفتوحة)\nالإجابة: تاء مربوطة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: اللام في (الحلق): (قمرية / شمسية)\nالإجابة: قمرية.\n\nس3 (مستوى الاستدلال): ضع علامات الترقيم: (هل تحب القراءة نعم أحبها كثيرًا)\nالإجابة: هل تحب القراءة؟ نعم، أحبها كثيرًا.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ فقرة من نص «مفتاح القراءة» جملة جملة، ويضعان خطًا تحت اسم يحيى وعبارة «جائزة القراءة»، ويوضح معنى «أتقن» بمثال؛ وللتحقق يسأله: ما اسم التلميذ في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إعلان قصير لمسابقة قراءة في صفهم يحددون فيه الموعد والجائزة مستعملين كلمتي «أتقن» و«جائزة»، ثم يتوقعون من يفوز بالمسابقة في النص ولماذا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: العلامة بين (أحب مدرستي) و(أحب زملائي): (علامة التعجب (!) / النقطة (.) / علامة الاستفهام (؟) / الفاصلة (،))\nالإجابة: الفاصلة (،)\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: اللام في (الفم): (قمرية / شمسية)\nالإجابة: قمرية.\n\nس3 (مستوى الاستدلال): اكتب جملة تعجب وجملة استفهام عن المسابقة.\nالإجابة: ما أجمل المسابقة! متى موعد المسابقة؟", "- للطالب: حل أنشطة النمط الإملائي ص94–95 وكتابة خمس كلمات تمثل التاء المفتوحة والتاء المربوطة.\n- للطالب: حل أنشطة النمط الإملائي ص94–95 وكتابة خمس كلمات تمثل اللام الشمسية واللام القمرية.\n- للطالب: حل أنشطة النمط الإملائي ص94–95 وكتابة خمس كلمات تمثل علامات الترقيم.\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=7"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (مراجعة حروف المحور (ب ت ث ج ح خ ص ض)) بخط النسخ"], "w": "الأسبوع الثامن: 25–29/10/2026م", "f": ["1. يكتب الحروف (مراجعة حروف المحور (ب ت ث ج ح خ ص ض)) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (5 دقائق)\n2. يكتب الكلمات والجملة: «فَأَمَّا مَنْ أَعْطَى وَاتَّقَى، وَصَدَّقَ بِالْحُسْنَى، فَسَنُيَسِّرُهُ لِلْيُسْرَى.» محاكيًا النموذج (25 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (مراجعة حروف المحور (ب ت ث ج ح خ ص ض)) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (أعطى، اتقى، صدّق، الحسنى، فسنيسره، لليسرى) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص96) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «فَأَمَّا مَنْ أَعْطَى وَاتَّقَى، وَصَدَّقَ بِالْحُسْنَى، فَسَنُيَسِّرُهُ لِلْيُسْرَى.» ويختار أجود خط ليعلق في لوحة الصف (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – حروف وطني: يكتب كل طالب بخط النسخ اسم ولاية عمانية فيها أحد حروف المحور مثل: صحار، بركاء، جعلان، خصب، ويتبادل الزملاء البطاقات ويختارون أجملها لتُعلّق على خريطة عمان (5 دقائق)\nالاستراتيجيات: تعلم الأقران.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: السورة التي فيها الآيات في صفحة الخط: (الفاتحة / القدر / الليل / العلق)\nالإجابة: الليل.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: كلمة فيها حرف التاء: (اتقى / صدّق / الحسنى / أعطى)\nالإجابة: اتقى.\n\nس3 (مستوى الاستدلال): اكتب كلمتين من الآيات فيهما حروف من حروف المحور.\nالإجابة: مثل: صدّق (ص)، الحسنى (ح).\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ فقرة من نص «مفتاح القراءة» جملة جملة، ويضعان خطًا تحت اسم يحيى وعبارة «جائزة القراءة»، ويوضح معنى «أتقن» بمثال؛ وللتحقق يسأله: ما اسم التلميذ في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إعلان قصير لمسابقة قراءة في صفهم يحددون فيه الموعد والجائزة مستعملين كلمتي «أتقن» و«جائزة»، ثم يتوقعون من يفوز بالمسابقة في النص ولماذا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: حرف الصاد في كلمة: (اتقى / صدّق / لليسرى / أعطى)\nالإجابة: صدّق.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حرف الحاء في كلمة: (اتقى / أعطى / الحسنى / صدّق)\nالإجابة: الحسنى.\n\nس3 (مستوى الاستدلال): اكتب الآيات الثلاث بخط النسخ.\nالإجابة: كتابة الآيات بحروف متناسقة مع الضبط.", "- للطالب: إكمال صفحة الخط ص96 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=7"]}]}, {"t": "قصة أعجبتني (الأولى)", "u": "المحور الأول: حياتي", "s": [{"k": "التحدث", "p": ["قصة أعجبتني (الأولى): تلخيص القصة شفويًا أمام الزملاء"], "w": "الأسبوع الثامن: 25–29/10/2026م", "f": ["1. يلخص قصته عن (حياتي في البيت والمدرسة) شفويًا بترتيب منطقي (20 دقيقة)\n2. يربط عبرة قصته بموضوع المحور (حياتي في البيت والمدرسة) (5 دقائق)\n\nمخرج تعليمي آخر:\n- يقيّم تلخيص زميله (15 دقيقة)", "المخرج 1: إبداع\nالمخرج 2: تقييم\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. تعلم الأقران", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات الكلمات والجمل، قصص المكتبة الصفية", "1. القراءة الحرة\n2. عناصر القصة\n3. التلخيص", "يضع المعلم كرسيًا مميزًا لمن سيلخص قصته عن (حياتي في البيت والمدرسة)، ويستعد التلميذ للتلخيص (5 دقائق)", "1. التدرب على التلخيص: يعرض المعلم خطوات التلخيص (العنوان، الشخصيات، أهم الأحداث، النهاية، رأيي)، ويرتب التلميذ أفكاره (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التلخيص الشفوي: يجلس الطلاب على كرسي الراوي ويلخصون قصصهم شفويًا (ص98–101)، ويلخص التلميذ قصته أمام زملائه (10 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n3. التقييم: يقيّم الطلاب التلخيص وفق معايير (الترتيب، الوضوح، اللغة)، ويقيّم التلميذ تلخيص زملائه (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – قصة من بيتنا: يحكي كل طالب لزميله باختصار القصة التي قرأها، ثم يربطان حدثها بعادة جميلة في البيت أو المدرسة العمانية كالتعاون أو احترام الكبير، ويعرضان ذلك للصف في جملتين (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نربط عبرة القصة بموضوع: (الرياضيات / المحور الأول (حياتي) / الأسعار / الطقس)\nالإجابة: المحور الأول (حياتي)\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: عند تلخيص القصة شفويًا نبدأ بـ: (العنوان والشخصيات / الصفحة الأخيرة / النهاية / الرسام)\nالإجابة: العنوان والشخصيات.\n\nس3 (مستوى الاستدلال): لخص قصتك عن (حياتي في البيت والمدرسة) في ثلاث جمل.\nالإجابة: يلخص البداية والأحداث والنهاية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ قصتين قصيرتين عن الحياة في البيت والمدرسة، ويتصفح معه الغلاف والصور ليختار ما يناسبه، ثم يقرأ معه الصفحة الأولى؛ وللتحقق يسأله: لماذا اخترت هذه القصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم بطاقة توصية لقصتهم عن حياتهم في البيت والمدرسة تضم العنوان والكاتب والشخصيات والمكان والعبرة، ثم يقدمونها لزميل ليقرأ القصة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نتحدث أمام زملائنا بـ: (صراخ / كلمات متقطعة / همس / صوت واضح ولغة سليمة)\nالإجابة: صوت واضح ولغة سليمة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نرتب أحداث القصة: (لا نرتبها / النهاية أولًا / البداية ثم الأحداث ثم النهاية / عشوائيًا)\nالإجابة: البداية ثم الأحداث ثم النهاية.\n\nس3 (مستوى الاستدلال): بماذا تنصح زملاءك عن قصتك في موضوع (حياتي في البيت والمدرسة)؟\nالإجابة: ينصح بقراءتها أو لا ويعلل.", "- للطالب: قراءة قصة جديدة وتلخيصها للأسرة.\n- لولي الأمر: تشجيع ابنه على القراءة اليومية ومناقشته فيما يقرأ.\n🎮 رابط
