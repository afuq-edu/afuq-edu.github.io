راتيجيات: تعلم الأقران.\n\n3. معاني الكلمات: يناقش المعلم معاني كلمات مثل: (حان: جاء وقته، يلزمنا: يرافقنا، يسطع: يلمع، الأغلى: الأثمن) من السياق، ويستنتج التلميذ المعاني من السياق (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. القراءة الجهرية الثانية: يطلب المعلم قراءة القصيدة بالتناوب بطريقة (أعواد المثلجات)، ويقرأ التلميذ عند سحب اسمه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. حل اللغز: يسأل المعلم: ما الشيء الذي يلزمنا في البيت والمدرسة؟ هل هو ذهب؟ ماذا اكتشف الأطفال في النهاية؟ ويصل معهم إلى أن الجواب «كتاب»، ويجيب التلميذ ويستدل بأبيات القصيدة (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. صفات الكتاب: يطلب المعلم من المجموعات استخراج صفات الكتاب من القصيدة (يروي خبرًا، يسطع نورًا، يجيب عما نجهله، الأغلى) وكتابتها على لوحة، ويستخرج التلميذ الصفات مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. قراءة السحب (ص19): يطلب المعلم قراءة العبارات في السحب: (أنيق المظهر، مأكولات لذيذة، خير جليس، كالماء، ذهب لماع، يروي خبرًا، أوفى الخلان، يحكي شعرًا، أوراق مفيدة)، ويقرأ التلميذ العبارات (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. التلوين والتعليل: يطلب المعلم تلوين السحب التي تناسب وصف الكتاب وتعليل الاختيار شفويًا، والتلاميذ يلون السحب المناسبة ويعلل (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n9. صفة من عندي: يطلب المعلم من كل طالب كتابة صفة جديدة للكتاب على بطاقة وتعليقها في ركن القراءة، ويكتب التلميذ صفة جديدة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. الإنشاد الجماعي: ينشد المعلم القصيدة مع الطلاب جماعيًا ثم زمريًا، وينشد التلميذ مع زملائه (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n11. الحفظ بالإخفاء التدريجي: يكتب المعلم أربعة أبيات على السبورة ويخفي كلمات تدريجيًا حتى يحفظوها، ويحفظ التلميذ الأبيات تدريجيًا (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. المنشد المتميز: تتسابق المجموعات في إنشاد الأبيات المحفوظة، ويقيّم الطلاب الأداء، وينشد التلميذ مع مجموعته ويقيّم غيره (10 دقائق)\nالاستراتيجيات: الإنشاد والترديد.\n\n13. النمذجة: يكتب المعلم حروفًا بالحركات القصيرة ويقرؤها نموذجيًا ثم يطلب القراءة الفردية، ويقرأ التلميذ الحروف بحركاتها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. لعبة الحركة المفقودة: يعرض كلمات من القصيدة ناقصة الضبط (كتاب، جرس، درس) ويطلب وضع الحركة المناسبة بسماع نطقها، ويضع التلميذ الحركة المناسبة على سبورته (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n15. قراءة كلمات: يوزع المعلم بطاقات كلمات مضبوطة (كَتَبَ، دَرْسٌ، قُلْتُ) ويطلب قراءتها بالتناوب، ويقرأ التلميذ البطاقات قراءة صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n16. النمذجة: يكتب المعلم الحرف بالحركة القصيرة والطويلة متجاورين ويقرؤهما ليلاحظوا الفرق، ويقرأ التلميذ ويلاحظ الفرق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n17. صيد المدود: يطلب المعلم البحث في القصيدة عن كلمات فيها مدود (يا، أطفال، كتاب، نورًا، عينيك) وتصنيفها في جدول (ا، و، ي)، ويبحث التلميذ ويصنف الكلمات (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n18. قراءة سريعة: يعرض المعلم بطاقات كلمات فيها مدود ويطلب قراءتها بسرعة ودقة، ويقرأ التلميذ البطاقات (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n19. النمذجة (ص21): يوضح المعلم نشاط الكتاب: أكوّن من الحروف كلمات مستخدمًا الحركات القصيرة والطويلة ثم أكتبها، ويتابع التلميذ المثال (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n20. سباق الكلمات: يوزع المعلم على المجموعات حروفًا مغناطيسية ويتسابقون في تكوين أكبر عدد من الكلمات الصحيحة، ويكوّن كلمات مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n21. من كلمة إلى جملة: يطلب المعلم اختيار كلمتين مكونتين ووضعهما في جملة، ويكوّن التلميذ جملة بكلمتين (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. النمذجة (ص22): يحلل كلمات (كتاب، جرس، مدرسة) بالتصفيق والأصابع ويكتب المقاطع، ويتابع التلميذ ويحاكي (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n23. حلل وصفق: يعرض المعلم صور أشياء ويطلب نطق أسمائها وتحليلها إلى مقاطع وكتابة عددها، ويحلل التلميذ ويكتب العدد (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n24. تركيب المقاطع: يوزع المعلم بطاقات مقاطع ويطلب تركيب كلمات (مَدْ + رَ + سَةٌ)، ويركب التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n25. النمذجة (ص22): يكتب المعلم جملة (حان الدرس) ويضع (/) بين كلماتها ويعدها، ويتابع التلميذ ويحاكي (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n26. حلل وعد: يكتب المعلم جملًا من القصيدة ويطلب وضع (/) وعد الكلمات على السبورات، ويحلل التلميذ الجمل ويعد الكلمات (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n27. كتابة بمسافات: يطلب المعلم نسخ جملتين مع ترك مسافة صحيحة بين الكلمات، وينسخ التلميذ الجملتين بمسافات صحيحة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n28. مجموعات الحروف: يعرض مجموعات (ب ت ث)، (ج ح خ)، (د ذ)، (ر ز) ويناقش الفرق بالنقاط، ويذكر التلميذ الفرق بين الحروف (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n29. كلمات ناقصة النقاط: يكتب كلمات بلا نقاط (حبر، بيت، خبز) ويطلب إكمالها، ويضع التلميذ النقاط الصحيحة (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n30. صيد الحروف: يطلب المعلم البحث في القصيدة عن كلمات فيها (ث، ذ، ز، خ)، ويستخرج كلمات من القصيدة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n31. النطق النموذجي: ينطق الأزواج (س ص، ت ط، د ض، ذ ظ، ك ق) موضحًا مخرج كل حرف، ويحاكي التلميذ النطق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n32. أكمل بالحرف: يكتب كلمات ناقصة (....باح، ....ين، ....لم) وينطقها ويطلب إكمالها بالحرف المسموع، ويكمل التلميذ الكلمات (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n33. لعبة الأذن الذكية: يقرأ كلمات ويرفع الطلاب بطاقة الحرف الذي سمعوه، ويرفع التلميذ البطاقة المناسبة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n34. النمذجة: يعرض المعلم بطاقات نصوص قصيرة متدرجة الصعوبة ويقرأ إحداها نموذجيًا، ويستمع التلميذ ويتابع (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n35. القراءة الثنائية: يوزع المعلم البطاقات على أزواج: يقرأ الأول ويتابع الثاني ثم يتبادلان، ويقيس المعلم طلاقة بعض الطلاب، ويقرأ التلميذ ويتابع زميله (20 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n36. سؤال وجواب: يطرح المعلم سؤالًا عن كل نص ليتحقق من الفهم، ويجيب التلميذ عن السؤال (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n37. الاختبار القصير: يوزع المعلم ورقة اختبار تشخيصي (قراءة كلمات بحركات ومدود، تحليل كلمة إلى مقاطع، إملاء ثلاث كلمات، كتابة جملة)، ويجيب التلميذ فرديًا (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n38. التصحيح والتحليل: يصحح المعلم جماعيًا ويسجل في سجله مستوى كل طالب ويحدد المجموعات العلاجية، ويصحح التلميذ ورقته (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n39. مجموعات العلاج والإثراء: يبدأ المعلم مع مجموعة العلاج نشاطًا قصيرًا ويكلف مجموعة الإثراء بقراءة قصة، وينجز التلميذ مهمة مجموعته (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n40. غلق الدرس – هوايات من تراثنا: يتحدث أفراد كل مجموعة عن هوايات يحبها العمانيون كالصيد والسباحة وركوب الخيل والرسم، ويختار كل طالب هوايته المفضلة ويذكر سبب حبه لها في جملة كاملة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كاتب قصيدة «ما هو؟»: (نزار نجار / مصطفى عكرمة / إبراهيم عباس ياسين / زهران القاسمي)\nالإجابة: إبراهيم عباس ياسين.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نكوّن من (د، ر، س) كلمة: (رسد / درس / سرد فقط / دسر)\nالإجابة: درس.\n\nس3 (مستوى الاستدلال): اكتب كلمة فيها مد بالياء.\nالإجابة: مثل: بيت/ فيل.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لهوايات (القراءة، الرسم، السباحة) ويسمّيها مع التلميذ، ثم يفرزان معًا الهوايات المفيدة من العادات الضارة كالسهر والكسل؛ وللتحقق يسأله: أيهما هواية مفيدة: القراءة أم السهر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة نصيحة للطفل الحائر في لوحة الهوايات يقترحون فيها هوايتين ويعللون كل اختيار بجملة، ثم يذكرون صفتين للكتاب من قصيدة «ما هو؟».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: اللام في (الشمس): (قمرية / شمسية)\nالإجابة: شمسية.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: كلمة من (ن، و، ر) فيها مد: (ورن / نور / رنو / نرو)\nالإجابة: نور.\n\nس3 (مستوى الاستدلال): اكتب جملة من أربع كلمات عن مدرستك.\nالإجابة: مثل: أحب مدرستي الجميلة كثيرًا.", "- للطالب: قراءة القصيدة ص17–18 قراءة جهرية للأسرة.\n- للطالب: كتابة ثلاث صفات للكتاب في الدفتر.\n- للطالب: إكمال نشاط ص19 وكتابة صفة جديدة للكتاب.\n- للطالب: حفظ أربعة أبيات من القصيدة وإنشادها للأسرة.\n- للطالب: قراءة عشر كلمات مضبوطة من الكتاب.\n- للطالب: كتابة ثلاث كلمات لكل مد.\n- للطالب: حل نشاط ص21.\n- للطالب: تحليل خمس كلمات من البيت إلى مقاطع.\n- للطالب: تحليل ثلاث جمل من الكتاب إلى كلمات.\n- للطالب: كتابة كلمتين لكل حرف من الحروف المتشابهة.\n- للطالب: التدرب على نطق الأزواج المتقاربة أمام الأسرة.\n- للطالب: قراءة قصة قصيرة يوميًا لمدة عشر دقائق.\n- للطالب: التدرب على المهارة التي حددها المعلم في الخطة العلاجية.\n- لولي الأمر: الاستماع إلى قراءة ابنه وتشجيعه.\n- لولي الأمر: قراءة كتاب قصير مع ابنه.\n- لولي الأمر: زيارة مكتبة مع ابنه أو اختيار كتاب من مكتبة البيت.\n- لولي الأمر: الاستماع إلى إنشاد ابنه وتشجيعه.\n- لولي الأمر: تدريب ابنه على نطق الحروف بالحركات.\n- لولي الأمر: البحث مع ابنه عن كلمات فيها مدود في أشياء البيت.\n- لولي الأمر: لعب لعبة تكوين الكلمات مع ابنه.\n- لولي الأمر: لعب لعبة التصفيق بالمقاطع.\n- لولي الأمر: متابعة ترك المسافات بين الكلمات عند الكتابة.\n- لولي الأمر: متابعة ابنه في وضع النقاط عند الكتابة.\n- لولي الأمر: تصحيح نطق ابنه للحروف المفخمة.\n- لولي الأمر: الاستماع إلى قراءة ابنه اليومية.\n- لولي الأمر: الاطلاع على نتيجة الاختبار التشخيصي ومتابعة الخطة العلاجية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=1"]}, {"k": "الأنماط اللغوية", "p": ["ترتيب كلمات مبعثرة لتكوين جمل مفيدة"], "w": "الأسبوع الأول: 6–10/9/2026م", "f": ["1. يرتب كلمات مبعثرة ليكوّن جملة مفيدة (20 دقيقة)\n2. يقرأ الجملة المكوّنة قراءة صحيحة (5 دقائق)\n\nمخرج تعليمي آخر:\n- يكوّن أكثر من جملة من الكلمات نفسها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "1. التعلم المبني على اللعب\n2. التعلم التعاوني\n3. التعلم بالنمذجة", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. الجملة المفيدة\n2. الترتيب", "يكتب المعلم (الجرس رنّ صباحًا) مقلوبة الكلمات ويسأل: هل الجملة مفهومة؟ ويعيد التلميذ ترتيبها (5 دقائق)", "1. النمذجة: يرتب المعلم أمام الطلاب كلمات (المدرسة - إلى - ذهبت) لتصبح: ذهبت إلى المدرسة، ويتابع التلميذ (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. سباق الترتيب: يوزع المعلم أظرفًا فيها كلمات مبعثرة وتتسابق المجموعات في ترتيبها ولصقها، ويرتب التلميذ الكلمات مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. جملتان من كلمات واحدة: يتحدى الطلاب: كوّنوا جملتين مختلفتين من الكلمات نفسها، ويكوّن التلميذ جملتين (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. غلق الدرس – جمل من وطني: تتسابق المجموعات في ترتيب كلمات مبعثرة في أظرف لتكوين جمل عن عمان مثل: (عمان - وطني - الجميل)، وتقرأ كل مجموعة جملتها بصوت واضح، والمجموعة الأسرع تعلّق جملتها في ركن الصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: رتب: (المدرسة - إلى - ذهبت): (المدرسة ذهبت إلى / إلى ذهبت المدرسة / ذهبت إلى المدرسة / ذهبت المدرسة إلى)\nالإجابة: ذهبت إلى المدرسة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: رتب: (كتابي - أقرأ): (أقرأ كتابي / كتابي أقرأ كتابي / كتابي / أقرأ)\nالإجابة: أقرأ كتابي.\n\nس3 (مستوى الاستدلال): رتب الكلمات: (درسي - أكتب).\nالإجابة: أكتب درسي.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لهوايات (القراءة، الرسم، السباحة) ويسمّيها مع التلميذ، ثم يفرزان معًا الهوايات المفيدة من العادات الضارة كالسهر والكسل؛ وللتحقق يسأله: أيهما هواية مفيدة: القراءة أم السهر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة نصيحة للطفل الحائر في لوحة الهوايات يقترحون فيها هوايتين ويعللون كل اختيار بجملة، ثم يذكرون صفتين للكتاب من قصيدة «ما هو؟».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: رتب: (الجرس - رنّ): (الجرس الجرس / رنّ / الجرس / رنّ الجرس)\nالإجابة: رنّ الجرس.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: رتب: (صديقي - الكتاب - خير): (الكتاب خير صديقي / خير الكتاب صديقي صديقي / صديقي الكتاب / خير صديقي الكتاب الكتاب)\nالإجابة: الكتاب خير صديقي.\n\nس3 (مستوى الاستدلال): كوّن جملتين مختلفتين من (أحب، الكتاب، كثيرًا).\nالإجابة: أحب الكتاب كثيرًا. الكتاب أحبه كثيرًا.", "- للطالب: ترتيب خمس جمل مبعثرة يعدها المعلم.\n- لولي الأمر: كتابة كلمات جملة على بطاقات وطلب ترتيبها من ابنه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=1"]}, {"k": "الإملاء", "p": ["التمييز بين الحركات القصيرة والطويلة في القراءة والكتابة", "مراجعة اللام الشمسية واللام القمرية", "مراجعة التنوين (الضم والفتح والكسر)", "مراجعة التاء المربوطة والمفتوحة", "الإملاء المنقول: نسخ جمل من القصيدة"], "w": "الأسبوع الأول: 6–10/9/2026م – الأسبوع الثاني: 13–17/9/2026م", "f": ["1. يفرق بين الحركة القصيرة والطويلة سماعًا (10 دقائق)\n2. يكتب الكلمة بالحركة المناسبة عند سماعها (15 دقيقة)\n3. يميز اللام الشمسية من القمرية نطقًا (10 دقائق)\n4. يقرأ كلمات فيها (ال) قراءة صحيحة (15 دقيقة)\n5. يميز أنواع التنوين نطقًا وكتابة (5 دقائق)\n6. يقرأ كلمات منونة قراءة صحيحة (20 دقيقة)\n7. يميز التاء المربوطة من المفتوحة نطقًا وكتابة (10 دقائق)\n8. يكتب كلمات تنتهي بالتاء كتابة صحيحة (20 دقيقة)\n9. ينسخ جملًا من القصيدة نسخًا صحيحًا (10 دقائق)\n10. يراعي المسافات بين الكلمات ووضوح الخط (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يصحح كلمة كُتبت بحركة خاطئة (15 دقيقة)\n- يصنف كلمات حسب نوع اللام (15 دقيقة)\n- يكتب كلمة بالتنوين الثلاثي (15 دقيقة)\n- يصحح كلمة كُتبت بتاء خاطئة (10 دقائق)\n- يقارن ما نسخه بالأصل ويصحح أخطاءه (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تطبيق\nالمخرج 9: تطبيق\nالمخرج 10: تطبيق\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تحليل\nالمخرج الآخر 3: تطبيق\nالمخرج الآخر 4: تقييم\nالمخرج الآخر 5: تقييم", "1. التعلم المبني على اللعب\n2. التعلم التعاوني\n3. التعلم بالنمذجة\n4. التعلم الذاتي\n5. التقويم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. السبورة التقليدية\n4. الأقلام\n5. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. قصير وطويل\n2. الإملاء الصوتي\n3. ال التعريف\n4. الشمسية\n5. القمرية\n6. التنوين\n7. النون الساكنة\n8. التاء المربوطة\n9. التاء المفتوحة\n10. النسخ\n11. الإملاء المنقول\n12. الخط الواضح", "ينطق كلمات (سَمَك/ سام، دُب/ دود) ويرفع الطلاب يدًا قصيرة أو طويلة، ويرفع التلميذ الإشارة المناسبة (5 دقائق)", "1. التمييز السمعي: يقرأ أزواجًا من الكلمات المتقاربة ويطلب تحديد الكلمة ذات المد، ويحدد التلميذ الكلمة ذات المد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الإملاء الصوتي: يملي كلمات قصيرة (قَلَم، قالَ، بُني، بيت) ويطلب كتابتها على السبورات، ويكتب التلميذ الكلمات المملاة (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التصحيح: يعرض المعلم الكلمات صحيحة ويطلب التصحيح الذاتي، ويصحح التلميذ أخطاءه (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. التذكير: يذكّر المعلم بما تعلموه في الصف الأول: اللام الشمسية تُكتب ولا تُنطق، والقمرية تُكتب وتُنطق، ويتذكر التلميذ ويذكر أمثلة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التصنيف: يعرض كلمات (الدرس، الجرس، الكتاب، الأطفال، السماء، القلم) ويطلب تصنيفها، ويصنف التلميذ الكلمات (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. القراءة الصحيحة: يطلب المعلم قراءة الكلمات المصنفة بنطق صحيح، ويقرأ التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. التذكير: يكتب المعلم (جرس) بالتنوين الثلاثي ويقرؤه، ويقرأ التلميذ ويحاكي (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. صيد التنوين: يطلب المعلم البحث في القصيدة عن كلمات منونة (خبرًا، نورًا) وتحديد نوع التنوين، ويستخرج التلميذ ويحدد النوع (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. كتابة بالتنوين: يملي كلمات منونة ويتابع الكتابة الصحيحة (ألف تنوين الفتح)، ويكتب التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التذكير: يكتب المعلم (مدرسة، بيت، شجرة، وقت) ويذكّر بالفرق، ويقرأ التلميذ ويلاحظ (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n11. التصنيف: يطلب المعلم تصنيف كلمات (حديقة، بنت، سيارة، زيت، مكتبة، صوت) في جدول، ويصنف التلميذ الكلمات (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n12. الإكمال: يكتب كلمات ناقصة التاء ويطلب إكمالها بـ(ت أو ة)، ويكمل التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. قراءة النص المختار: يكتب المعلم على السبورة بيتين من القصيدة ويقرؤهما ويوضح الكلمات الصعبة، ويقرأ التلميذ ويتأمل الكلمات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n14. النسخ: يطلب المعلم نسخ البيتين بخط واضح مع العناية بالنقاط والحركات والمسافات، وينسخ التلميذ البيتين (20 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n15. المقارنة والتصحيح: يطلب المعلم مقارنة المنسوخ بالأصل كلمة كلمة ووضع دائرة حول الخطأ ثم تصويبه، ويقارن التلميذ ويصوب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n16. غلق الدرس – صيد كلمات عمانية: يعرض المعلم كلمات من بيئة عمان (النَّخلة، الفَلَج، قلعةٌ، البحر)، فتصطاد كل مجموعة الكلمة وتحدد ما فيها من لام شمسية أو قمرية أو تنوين أو تاء مربوطة، وتكتبها على السبورة الصغيرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الكلمة التي فيها مد: (قال / كتب / قلم / درس)\nالإجابة: قال.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نوع التنوين في (كتابٌ): (تنوين الفتح / تنوين الضم / تنوين الكسر)\nالإجابة: تنوين الضم.\n\nس3 (مستوى الاستدلال): انسخ جملة (رنّ الجرس حان الدرس).\nالإجابة: رنّ الجرس، حان الدرس.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لهوايات (القراءة، الرسم، السباحة) ويسمّيها مع التلميذ، ثم يفرزان معًا الهوايات المفيدة من العادات الضارة كالسهر والكسل؛ وللتحقق يسأله: أيهما هواية مفيدة: القراءة أم السهر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة نصيحة للطفل الحائر في لوحة الهوايات يقترحون فيها هوايتين ويعللون كل اختيار بجملة، ثم يذكرون صفتين للكتاب من قصيدة «ما هو؟».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: بعد النسخ نقوم بـ: (الرسم / النوم / رمي الورقة / المقارنة بالأصل)\nالإجابة: المقارنة بالأصل.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الكتابة الصحيحة: (نوران / نورًا / نورً / نورن)\nالإجابة: نورًا.\n\nس3 (مستوى الاستدلال): صحح أخطاءك في النسخ.\nالإجابة: يكتب الكلمات التي أخطأ فيها صحيحة.", "- للطالب: كتابة خمس كلمات بحركات قصيرة وخمس بحركات طويلة.\n- للطالب: تصنيف عشر كلمات من الكتاب حسب نوع اللام.\n- للطالب: كتابة خمس كلمات بالتنوين الثلاثي.\n- للطالب: كتابة خمس كلمات لكل نوع من التاء.\n- للطالب: نسخ بيتين من القصيدة في البيت.\n- لولي الأمر: إملاء ابنه كلمات قصيرة ومتابعة كتابتها.\n- لولي الأمر: متابعة نطق ابنه للام الشمسية والقمرية.\n- لولي الأمر: إملاء ابنه كلمات منونة.\n- لولي الأمر: متابعة كتابة ابنه للتاء في آخر الكلمات.\n- لولي الأمر: متابعة نظافة دفتر ابنه ووضوح خطه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=1"]}, {"k": "الخط", "p": ["أشكال الحروف في أول الكلمة ووسطها وآخرها", "الخط: مراجعة كتابة الحروف الهجائية بخط النسخ"], "w": "الأسبوع الثاني: 13–17/9/2026م", "f": ["1. يتعرف أشكال الحرف في مواضعه المختلفة (15 دقيقة)\n2. يكتب الحرف بشكله الصحيح حسب موضعه (5 دقائق)\n3. يكتب الحروف الهجائية بخط النسخ كتابة صحيحة (20 دقيقة)\n4. يراعي خط القاعدة والتناسق في الكتابة (5 دقائق)\n\nمخرج تعليمي آخر:\n- يصنف كلمات حسب موضع حرف معين (20 دقيقة)\n- يقيّم كتابته ويحسنها (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم التعاوني\n3. التعلم بالنمذجة\n4. التعلم الذاتي\n5. التقويم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. السبورة التقليدية\n4. الأقلام\n5. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. أشكال الحروف\n2. الحروف المتصلة والمنفصلة\n3. خط النسخ\n4. خط القاعدة\n5. الجلسة الصحيحة", "يكتب المعلم حرف العين في (عين، بعد، طبع) ويسأل: لماذا تغير شكله؟ ويلاحظ التلميذ تغير الشكل (5 دقائق)", "1. النمذجة: يكتب المعلم حروفًا مختارة (ع، هـ، ك، ي) في أول الكلمة ووسطها وآخرها، ويتابع التلميذ ويحاكي (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. جدول المواضع: يطلب المعلم تصنيف كلمات في جدول (أول، وسط، آخر) لحرف معين، ويصنف التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. كتابة كلمات: يملي كلمات قصيرة ويتابع شكل الحرف في كل موضع، ويكتب التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. النمذجة: يرسم المعلم خط القاعدة ويكتب مجموعة حروف (ا ب ت ث ج ح خ د ذ ر ز) مع أسهم الاتجاه، ويتابع التلميذ الاتجاه (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. المحاكاة: يطلب المعلم محاكاة الحروف في الدفتر مع الجلسة الصحيحة ومسكة القلم ويمر بينهم، ويحاكي التلميذ الحروف بتأنٍّ (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n6. جملة جميلة: يطلب المعلم كتابة جملة (الكتاب خير جليس) بأجمل خط، ويكتب التلميذ الجملة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – الخطاط الصغير: يكتب كل طالب اسم مدينته أو ولايته العمانية بخط النسخ على بطاقة ملونة، ويتبادل الزملاء البطاقات ويختارون أجمل خط، ثم تُعلّق البطاقات على خريطة عمان في ركن الصف (5 دقائق)\nالاستراتيجيات: تعلم الأقران.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: العين في (عين) جاءت في: (آخرها / أول الكلمة / وسطها / لا توجد)\nالإجابة: أول الكلمة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الجلسة الصحيحة عند الكتابة: (استلقاء / انحناء شديد / وقوف / ظهر مستقيم وقدمان على الأرض)\nالإجابة: ظهر مستقيم وقدمان على الأرض.\n\nس3 (مستوى الاستدلال): اكتب الحروف (ج ح خ) بخط النسخ.\nالإجابة: كتابة الحروف متناسقة على السطر.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لهوايات (القراءة، الرسم، السباحة) ويسمّيها مع التلميذ، ثم يفرزان معًا الهوايات المفيدة من العادات الضارة كالسهر والكسل؛ وللتحقق يسأله: أيهما هواية مفيدة: القراءة أم السهر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة نصيحة للطفل الحائر في لوحة الهوايات يقترحون فيها هوايتين ويعللون كل اختيار بجملة، ثم يذكرون صفتين للكتاب من قصيدة «ما هو؟».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف الذي ينزل تحت السطر: (الألف / الراء / الباء / الدال)\nالإجابة: الراء.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الحرف الذي لا يتصل بما بعده: (الدال / الكاف / الباء / العين)\nالإجابة: الدال.\n\nس3 (مستوى الاستدلال): اكتب جملة (الكتاب خير جليس) بخط جميل.\nالإجابة: كتابة الجملة متناسقة الحروف والمسافات.", "- للطالب: كتابة حرف واحد في ثلاث كلمات بمواضع مختلفة.\n- للطالب: التدرب على كتابة الحروف في كراسة الخط.\n- لولي الأمر: متابعة شكل الحروف في كتابة ابنه.\n- لولي الأمر: متابعة جلسة ابنه ومسكة القلم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=1"]}, {"k": "التعبير", "p": ["التعبير الكتابي: كتابة جمل تصف صورًا"], "w": "الأسبوع الثاني: 13–17/9/2026م", "f": ["1. يكتب جملة مفيدة تصف صورة (20 دقيقة)\n2. يبدأ الجملة بحرف واضح وينهيها بنقطة (5 دقائق)\n\nمخرج تعليمي آخر:\n- يربط جملتين بأداة ربط (15 دقيقة)", "المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: السبورات الشخصية (الصغيرة)", "1. الجملة\n2. الوصف\n3. النقطة", "يعرض المعلم صورة طفل يقرأ كتابًا ويسأل: ماذا يفعل؟ ويقول التلميذ جملة تصف الصورة (5 دقائق)", "1. التحدث عن الصور: يعرض المعلم صورًا (طفل يقرأ، جرس المدرسة، طفلة ترسم) ويطلب وصفها شفويًا، ويصف التلميذ الصور شفويًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. كتابة الجمل: يطلب المعلم كتابة جملة لكل صورة مع النقطة في آخرها، ويكتب التلميذ الجمل (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. القراءة والتقييم: يقرأ بعض الطلاب جملهم ويقيّم الصف وضوحها وصحتها، ويقرأ التلميذ ويقيّم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – صورة وجملة: يعرض المعلم صورًا من عمان (قلعة نزوى، سوق مطرح، شاطئ صلالة)، وتكتب كل مجموعة جملة مفيدة تصف إحداها وتنهيها بنقطة، ثم تقرؤها وتخمّن المجموعات الأخرى الصورة المقصودة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: جملة تصف طفلًا يقرأ: (يلعب الطفل بالكرة / يقرأ الطفل كتابًا / الطفل نائم / رنّ الجرس)\nالإجابة: يقرأ الطفل كتابًا.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نضع في نهاية الجملة الخبرية: (علامة الاستفهام / النقطة / الفاصلة / لا شيء)\nالإجابة: النقطة.\n\nس3 (مستوى الاستدلال): اكتب جملة تصف صورة جرس المدرسة.\nالإجابة: مثل: رنّ جرس المدرسة صباحًا.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لهوايات (القراءة، الرسم، السباحة) ويسمّيها مع التلميذ، ثم يفرزان معًا الهوايات المفيدة من العادات الضارة كالسهر والكسل؛ وللتحقق يسأله: أيهما هواية مفيدة: القراءة أم السهر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة نصيحة للطفل الحائر في لوحة الهوايات يقترحون فيها هوايتين ويعللون كل اختيار بجملة، ثم يذكرون صفتين للكتاب من قصيدة «ما هو؟».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: أداة ربط بين جملتين: (هل / لم / تحت / ثم)\nالإجابة: ثم.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الجملة الأكثر وصفًا: (الطفلة / تقرأ / قصة / تقرأ الطفلة قصة ملونة بسعادة)\nالإجابة: تقرأ الطفلة قصة ملونة بسعادة.\n\nس3 (مستوى الاستدلال): اكتب جملتين مترابطتين عن صورة الطفلة التي ترسم.\nالإجابة: مثل: ترسم الطفلة شجرة، ثم تلونها بالأخضر.", "- للطالب: كتابة ثلاث جمل عن صور من مجلة أو كتاب.\n- لولي الأمر: مشاركة ابنه في وصف صور العائلة بجمل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=1"]}]}, {"t": "الاستماع: أتسوق مع أسرتي", "u": "المحور الأول: حياتي", "s": [{"k": "التحدث", "p": ["الاستماع إلى نص «أتسوق مع أسرتي» وفهمه وإبداء الرأي"], "w": "الأسبوع الثاني: 13–17/9/2026م", "f": ["1. يستمع إلى نص الاستماع بإنصات وانتباه ملتزمًا آدابه (10 دقائق)\n2. يبين هدف الأسرة من خروجها ويميز الطعام الصحي من غيره (5 دقائق)\n\nمخرج تعليمي آخر:\n- يوضح أهمية التخطيط المسبق ويبدي رأيه في أضرار المشروبات الغازية (25 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تقييم", "1. الاستماع الموجه\n2. الحوار والمناقشة\n3. التعلم التعاوني\n4. العصف الذهني", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. صورة توضيحية\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. أهمية التخطيط\n2. أضرار الأطعمة غير الصحية\n3. آداب الاستماع", "يعرض المعلم ورقة قائمة تسوق ويسأل: ماذا تتوقعون أن تكون هذه الورقة؟ ولماذا نحملها إلى السوق؟ ويتوقع التلميذ وظيفة القائمة (5 دقائق)", "1. آداب الاستماع والاستماع الأول (ص28): يهيئ المعلم البيئة الصفية ويذكّر بآداب الاستماع (الجلوس والهدوء، عدم الالتفات، عدم المقاطعة)، ويطلب قراءة الأسئلة أولًا، ثم يقرأ النص قراءة معبرة ويناقش: ما الهدف الذي خرجت من أجله الأسرة؟ ويطلب الإجابة فرديًا (ذهبت مع أبي وأمي وأختي إلى...، أصل بين العمودين)، ويستمع التلميذ منصتًا ويجيب عن أسئلة الاستماع الأول فرديًا (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الاستماع الثاني (ص29–30): يعيد المعلم قراءة النص ويناقش: هل اشترت الأسرة المشروبات الغازية؟ ولماذا؟ ويطلب رسم خط سير الأسرة في المخطط، ثم ينفذ لعبة سلة الأطعمة لتصنيف الأطعمة الصحية وغير الصحية، ويجيب التلميذ ويرسم خط السير ويصنف الأطعمة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الاستماع الثالث وإبداء الرأي (ص31–32): يعيد المعلم قراءة النص ويناقش: ماذا يوجد في الورقة التي كانت مع الأب؟ كيف نستفيد من قائمة التسوق؟ ثم يطرح: صديقك يتناول المشروبات الغازية كل يوم، بم تنصحه؟ ولماذا؟ ويبدي التلميذ رأيه وينصح صديقه ويعلل (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – في السوق مع أسرتي: يمثّل الطلبة في مجموعات أسرة تتسوق من سوق عماني تقليدي، فيختارون طعامًا صحيًا من خيرات عمان كالتمر والسمك والخضار، ويتعاملون مع البائع بأدب، ثم يذكرون قائمة مشترياتهم (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: ذهب المتحدث مع أسرته إلى: (المدرسة / السوق / المسجد / الحديقة)\nالإجابة: السوق.\n\nس2 (مستوى التطبيق): من الذين ذهبوا إلى السوق؟ (الأصدقاء / الأب والأم والأخت والمتحدث / الجد والجدة / المتحدث وحده)\nالإجابة: الأب والأم والأخت والمتحدث.\n\nس3 (مستوى الاستدلال): بم تنصح صديقك الذي يتناول المشروبات الغازية كل يوم؟ ولماذا؟\nالإجابة: أنصحه بشرب الماء والعصير الطبيعي؛ لأن المشروبات الغازية تضر الأسنان والصحة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم قراءة جزء من نص «أتسوق مع أسرتي» ببطء مع صور السوق وأفراد الأسرة، ويرتب التلميذ صور الأب والأم والأخت والمتحدث؛ وللتحقق يسأله: إلى أين ذهبت الأسرة؟ ومن ذهب إليه؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة تسوق مخطط لها مسبقًا لأسرة، يفرزون فيها الأطعمة الصحية من غيرها، ويستبدلون المشروبات الغازية ببديل صحي مع ذكر السبب.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا اختار الأب؟ (الحليب / الموز / الخس / الجبن)\nالإجابة: الجبن.\n\nس2 (مستوى التطبيق): ماذا اختارت الأم؟ (الأرز / الجبن / الحليب / الخبز)\nالإجابة: الحليب.\n\nس3 (مستوى الاستدلال): كيف يساعدنا التخطيط في أمور حياتنا؟ أعط مثالًا.\nالإجابة: يجعلنا ننجز أعمالنا دون نسيان أو إسراف، مثل: كتابة قائمة الواجبات قبل المذاكرة.", "- للطالب: كتابة قائمة تسوق لأسرته تتضمن أطعمة صحية.\n- لولي الأمر: إشراك ابنه في إعداد قائمة التسوق للأسرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=2"]}]}, {"t": "لعبتي", "u": "المحور الأول: حياتي", "s": [{"k": "التحدث", "p": ["التحدث عن لوحة المحادثة والتمهيد لدرس «لعبتي»"], "w": "الأسبوع الثالث: 20–24/9/2026م", "f": ["1. يتحدث عن مضمون لوحة المحادثة في درس «لعبتي» بلغة سليمة وجمل مكتملة (10 دقائق)\n2. يجيب عن أسئلة اللوحة مثل: ماذا تشاهد في الصورة؟ (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يُعدّ سؤالًا إضافيًا عن اللوحة ويطرحه على زملائه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. جهاز عرض البيانات", "1. ذكريات من حياتي\n2. المحافظة على ممتلكاتي\n3. الفلج العماني", "يطلب المعلم من الطلاب ذكر لعبة مفضلة قديمة لا تزال عالقة في ذاكرتهم، ثم يخبرهم أنهم سيقرؤون عن لعبة بقيت في ذاكرة صاحبتها سنوات طويلة، ويتذكر التلميذ لعبته القديمة ويتحدث عنها في جملة (5 دقائق)", "1. أشاهد وأتحدث: يعرض المعلم لوحة المحادثة (ص33) ويترك للطلاب فرصة لتأملها ثم يسأل: ماذا تشاهدون؟ ويطرح أسئلة اللوحة: ماذا تشاهد في الصورة؟، تحدث عن لعبتك المفضلة.، كيف تحافظ على ألعابك؟، ويساعدهم في صياغة جمل مكتملة، ويتأمل التلميذ اللوحة ويجيب بجمل مكتملة ويربطها بخبرته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أفضل سؤال: يطلب المعلم من كل مجموعة إعداد سؤال إضافي عن اللوحة يطرحه منسقها على المجموعات الأخرى، ويختار أفضل سؤال وأفضل إجابة، ويعد التلميذ سؤالًا مع مجموعته ويجيب عن أسئلة المجموعات الأخرى (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحدث الفردي: يطلب المعلم من بعض الطلاب التحدث في ثلاث جمل عن: لعبته المفضلة وكيف يحافظ عليها، ويعزز اللغة السليمة وآداب التحدث، ويتحدث التلميذ أمام زملائه في ثلاث جمل مترابطة (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – لعبتي الشعبية: يمثّل كل زوج حوارًا قصيرًا عن لعبة شعبية عمانية يعرفها من أهله، ويطرح أحدهما سؤالًا بأين أو كيف ويجيب الآخر بجملة مكتملة، ثم يعرض بعض الأزواج حوارهم أمام الصف (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا نفعل بألعابنا بعد الانتهاء من اللعب؟ (نكسرها / نرميها في الشارع / نرتبها في مكانها / نتركها على الأرض)\nالإجابة: نرتبها في مكانها.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نسأل عن المكان بأداة الاستفهام: (متى / أين / كيف / كم)\nالإجابة: أين.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا للوحة المحادثة وعلّل.\nالإجابة: مثل: «ألعابي أصدقائي»؛ لأن الأطفال في اللوحة يلعبون ويحافظون على ألعابهم.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ترتيب ألعاب حقيقية في صندوقها بعد اللعب، ثم يخبئ لعبة ويسأل «أين اللعبة؟» ليتدرب التلميذ على السؤال بأداة الاستفهام أين؛ وللتحقق يسأله: بأي أداة نسأل عن المكان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ثلاثة أسئلة عن لوحة «لعبتي» بأدوات استفهام مختلفة (أين، متى، كيف) وطرحها على زملائهم، ثم يقترحون عنوانًا جديدًا للوحة ويعللونه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: أفضل مكان لحفظ الألعاب: (الشارع / تحت المطر / سلة المهملات / صندوق الألعاب)\nالإجابة: صندوق الألعاب.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نسأل عن الزمان بأداة الاستفهام: (كم / أين / من / متى)\nالإجابة: متى.\n\nس3 (مستوى الاستدلال): تحدث في ثلاث جمل عن لعبتك المفضلة وكيف تحافظ عليها.\nالإجابة: مثل: لعبتي المفضلة سيارة حمراء، ألعب بها بعد الواجبات، ثم أعيدها إلى صندوقها.", "- للطالب: تأمل لوحة المحادثة ص33 والتحدث عنها مع الأسرة في ثلاث جمل.\n- لولي الأمر: محاورة ابنه حول: لعبته المفضلة وكيف يحافظ عليها، وتشجيعه على استخدام جمل مكتملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=3"]}, {"k": "القراءة", "p": ["القراءة التصفحية والتوقع والقراءة النموذجية لنص «لعبتي»", "القراءة الجهرية الأولى لنص «لعبتي» ومعاني المفردات", "القراءة الجهرية الثانية لنص «لعبتي» وفهم المعنى الصريح (خطوتي الأولى)", "القراءة الجهرية الثالثة لنص «لعبتي» وترتيب الأحداث", "القراءة الجهرية الرابعة وفهم المعنى الضمني في نص «لعبتي» (خطوتي الثانية)", "تفسير أفكار نص «لعبتي» ودمجها ومحاكاة التعبير (خطوتي الثالثة)", "القراءة الجهرية الخامسة وتقييم نص «لعبتي» وإبداء الرأي (خطوتي الرابعة)", "التحليل والتركيب (أحلل وأركب) في درس «لعبتي»"], "w": "الأسبوع الثالث: 20–24/9/2026م", "f": ["1. يحدد هوية نص «لعبتي»: العنوان والكاتب (زهران القاسمي) والمصدر والمتحدث (10 دقائق)\n2. يتوقع مضمون النص من العنوان والصور ثم يتحقق من توقعه (10 دقائق)\n3. يقرأ نص «لعبتي» قراءة جهرية صحيحة مراعيًا ضبط الكلمات وعلامات الترقيم (15 دقيقة)\n4. يذكر معاني الكلمات الجديدة (جرفها، الغبطة، ناعمة، انفلتت) مستعينًا بالسياق (10 دقائق)\n5. يقرأ نص «لعبتي» قراءة جهرية صحيحة معبرة (15 دقيقة)\n6. يسترجع معلومات صريحة وردت في النص عن (سعاد، العم، الأم) (15 دقيقة)\n7. يقرأ نص «لعبتي» قراءة جهرية معبرة بتعدد القراءات (15 دقيقة)\n8. يرتب أحداث نص «لعبتي» ترتيبًا صحيحًا (10 دقائق)\n9. يستنتج صفات الشخصيات (سعاد، العم) من أفعالها وأقوالها (5 دقائق)\n10. يقرأ الفقرات المرتبطة بالأسئلة قراءة جهرية صحيحة (20 دقيقة)\n11. يستخلص العبرة من نص «لعبتي» ويحدد نوعه (15 دقيقة)\n12. يقترح عنوانًا آخر مناسبًا للنص (10 دقائق)\n13. يبدي رأيه في تصرفات سعاد ويعلل رأيه (15 دقيقة)\n14. يقرأ جمل النص قراءة جهرية معبرة في نشاط تنافسي (15 دقيقة)\n15. يحلل الجمل إلى كلمات ويحدد عددها (10 دقائق)\n16. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (10 دقائق)\n- يعيد سرد مضمون النص بأسلوبه (15 دقيقة)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «كانت تسابق الماء، لكنّ الدمية اختفت.» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يرتب كلمات مبعثرة ليكوّن جملة مفيدة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج 13: تقييم\nالمخرج 14: تطبيق\nالمخرج 15: تحليل\nالمخرج 16: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: إبداع\nالمخرج الآخر 5: تحليل\nالمخرج الآخر 6: تطبيق\nالمخرج الآخر 7: إبداع\nالمخرج الآخر 8: تطبيق", "1. التنبؤ\n2. التعلم الذاتي\n3. السؤال والجواب\n4. التعلم بالنمذجة\n5. التعلم المبني على اللعب\n6. تعلم الأقران\n7. التعلم التعاوني\n8. تعدد القراءات\n9. أعواد المثلجات\n10. التعلم بالاكتشاف\n11. العصف الذهني\n12. الحوار والمناقشة\n13. لعبة القطار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)، أعواد المثلجات بأسماء الطلاب، سلتان وبيضتان بلاستيكيتان وملعقتان", "1. القراءة التصفحية\n2. هوية النص\n3. التوقع\n4. المفردات\n5. السياق\n6. المرادف والضد\n7. المعنى الصريح\n8. الشخصيات\n9. المكان\n10. ترتيب الأحداث\n11. السرد\n12. الاستنتاج\n13. الفكرة الرئيسة\n14. ذكريات من حياتي\n15. العبرة\n16. نوع النص\n17. المحاكاة\n18. إبداء الرأي\n19. التقييم\n20. المحافظة على ممتلكاتي\n21. المقطع الصوتي\n22. الكلمة\n23. الجملة", "يعرض المعلم صندوقًا مغلقًا فيه دمية ويذكر صفاتها (ناعمة، جميلة، تشبه الطفلة) ويطلب تخمين ما بداخله، ويخمن التلميذ محتوى الصندوق من الصفات (5 دقائق)", "1. القراءة التصفحية: يحدد المعلم صفحة النص (ص35–37) ويطلب تصفحًا سريعًا لمدة دقيقتين، ويكتب أهداف القراءة التصفحية، ثم يطلب من طالب كتابة العنوان على السبورة ومن آخر قراءة اسم الكاتب (زهران القاسمي) والمصدر (سيرة الحجر (2))، ويتصفح التلميذ النص بسرعة ويستخرج العنوان والكاتب والمصدر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. بطاقة النص والتوقع: يكمل المعلم مع الطلاب بطاقة النص (العنوان، الكاتب، المتحدث)، ثم يطرح سؤال التوقع: من عنوان النص وصوره: ماذا تتوقع أن يحدث للعبة؟ ويدوّن التوقعات على السبورة، ويكمل التلميذ البطاقة ويكتب توقعه (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. القراءة النموذجية: يعرض المعلم النص على جهاز العرض ويقرؤه قراءة جهرية نموذجية معبرة مراعيًا علامات الترقيم ومستخدمًا المؤشر، ثم يطلب من الطلاب التحقق من توقعاتهم، ويتابع التلميذ القراءة النموذجية بالمؤشر ويقارن توقعه بمضمون النص (15 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة الجهرية الأولى: يكتب المعلم أهداف القراءة الجهرية، ثم يقرأ فقرة نموذجية ويطلب من الطلاب المجيدين ثم الأقل إجادة قراءة فقرات النص (ص35–37) بالتناوب، ويصحح الأخطاء بعد إتمام الجملة، ويقرأ التلميذ الفقرة المطلوبة قراءة جهرية صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. اكتشاف معاني المفردات: يعرض المعلم المفردات في بطاقات: جرفها (سحبها بقوة)، الغبطة (الفرح والسرور)، ناعمة (ليّنة الملمس)، انفلتت (أفلتت وخرجت)، صوب (جهة أو نحو)، القنطرة (جسر صغير مقوّس فوق الماء)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص38–39) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: اختر الإجابة الصحيحة: أهدى سعاد الدمية: (عمها / خالها / أخوها / جدها)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (5 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الثالثة (تعدد القراءات): يوزع المعلم فقرات النص على المجموعات، ويسحب عود مثلجات باسم طالب ليقرأ الفقرة المحددة، ويستمر حتى نهاية النص، ويقرأ التلميذ الفقرة عند سحب اسمه ويتابع قراءة زملائه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. ترتيب الأحداث: يوزع المعلم بطاقات الأحداث على المجموعات ويطلب ترتيبها من (1) إلى (5) مستعينين بالنص (ص38–39)، ثم تعرض كل مجموعة ترتيبها، ويرتب التلميذ البطاقات مع مجموعته ويعلل الترتيب من النص (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. إعادة السرد: يطلب المعلم من طالبين إعادة سرد الأحداث المرتبة بأسلوبهما مستخدمين أدوات الربط (في البداية، ثم، بعد ذلك، وأخيرًا)، ويعيد التلميذ سرد الأحداث بأسلوبه (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n13. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص40) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (20 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n15. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: ذكرى سعاد مع دميتها الجميلة التي جرفها ماء الفلج، ويختار التلميذ الفكرة الرئيسة ويعلل (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n16. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص41–42) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n18. محاكاة التعبير: يعرض المعلم التعبير: «كانت تسابق الماء، لكنّ الدمية اختفت.» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «كان أخي يسابق الريح، لكنّ الطائرة الورقية ابتعدت.»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n19. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n20. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص42–43) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص44) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (كبرت سعاد وتركت أسرتها القرية)، ويفصل التلميذ الكلمات ويعدها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n23. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: سعاد، دُمْيَة، الفلج، صديقاتها ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n24. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n25. غلق الدرس – بطاقات الحكاية: توزَّع بطاقات أحداث نص «لعبتي» على المجموعات، فتتسابق في ترتيبها وقراءتها قراءة جهرية معبرة، ثم تذكر كل مجموعة قيمة المحافظة على الأشياء والأماكن الجميلة في بلادنا عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كاتب نص «لعبتي»: (وفاء الحسيني / عبدالله الدنان / نزار نجار / زهران القاسمي)\nالإجابة: زهران القاسمي.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الفكرة الرئيسة للنص: (عمل الأم في البيت / جمال الفلج / ذكرى سعاد مع دميتها التي جرفها الفلج / صديقات سعاد)\nالإجابة: ذكرى سعاد مع دميتها التي جرفها الفلج.\n\nس3 (مستوى الاستدلال): ركّب من المقاطع (لُعْ + بَ + تي) كلمة ذات معنى.\nالإجابة: لُعْبَتي.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ترتيب ألعاب حقيقية في صندوقها بعد اللعب، ثم يخبئ لعبة ويسأل «أين اللعبة؟» ليتدرب التلميذ على السؤال بأداة الاستفهام أين؛ وللتحقق يسأله: بأي أداة نسأل عن المكان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ثلاثة أسئلة عن لوحة «لعبتي» بأدوات استفهام مختلفة (أين، متى، كيف) وطرحها على زملائهم، ثم يقترحون عنوانًا جديدًا للوحة ويعللونه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): حلل كلمة (دُمْيَة) إلى مقاطع.\nالإجابة: دُمْ/ يَ/ ةٌ.\n\nس2 (مستوى التطبيق): ما الحدث الذي جاء قبل (كبرت سعاد وما زالت تتمنى أن تجد دميتها)؟\nالإجابة: وعدتها أمها أن تصنع لها دمية أخرى.\n\nس3 (مستوى الاستدلال): رتب الكلمات لتكوّن جملة: (الفلج - ماء - الدمية - جرف).\nالإجابة: جرف ماء الفلج الدمية.", "- للطالب: قراءة نص «لعبتي» ص35–37 قراءة صامتة مرة واحدة على الأقل.\n- للطالب: قراءة النص ص35–37 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة.\n- للطالب: إكمال أنشطة خطوتي الأولى ص38–39 وقراءة النص مرة أخرى.\n- للطالب: إعادة سرد أحداث نص «لعبتي» مرتبة أمام الأسرة.\n- للطالب: حل أنشطة خطوتي الثانية ص40 في الكتاب.\n- للطالب: كتابة جملتين تحاكي التعبير «كانت تسابق الماء، لكنّ الدمية اختفت.» وحل أنشطة ص41–42.\n- للطالب: كتابة رأيه في إحدى شخصيات نص «لعبتي» في سطرين.\n- للطالب: حل أنشطة التحليل والتركيب ص44.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة.\n- لولي الأمر: الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف.\n- لولي الأمر: سؤال ابنه عن شخصيات النص ومكان أحداثه.\n- لولي الأمر: الاستماع إلى سرد ابنه ومساعدته على استخدام أدوات الربط.\n- لولي الأمر: سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «لعبتي» ولماذا.\n- لولي الأمر: مناقشة ابنه في العبرة من النص وكيف يطبقها.\n- لولي الأمر: مناقشة ابنه في رأيه بالنص وتعليله.\n- لولي الأمر: لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=3"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: الجملة الفعلية (التعرف والمحاكاة)", "النمط اللغوي: الجملة الفعلية (التطبيق وأنشطة الكتاب)"], "w": "الأسبوع الثالث: 20–24/9/2026م", "f": ["1. يتعرف الجملة الفعلية من خلال أمثلة من النص (15 دقيقة)\n2. يحاكي الجملة الفعلية في جمل جديدة (10 دقائق)\n3. يطبق الجملة الفعلية في أنشطة الكتاب (20 دقيقة)\n4. يميز الجملة الفعلية في جمل معروضة (5 دقائق)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (15 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. الجملة الفعلية\n2. الفعل\n3. الفاعل", "يطلب المعلم من طالب تمثيل حركة صامتة ويسأل الصف: ماذا يفعل؟ ويصف التلميذ الحركة بجملة تبدأ بفعل (5 دقائق)", "1. اكتشاف النمط: يعرض المعلم جملًا من النص: أهدى عمها دمية، لعبت سعاد بدميتها، جرف الماء الدمية، كبرت سعاد، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: الجملة الفعلية تبدأ بفعل يدل على حدث، مثل: لعبت سعاد بدميتها، ويلاحظ التلميذ الأمثلة ويستنتج النمط (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المحاكاة: يختار طالبين: يقوم الأول بأفعال (يقفز، يكتب، يفتح) ويكتب الثاني الفعل على السبورة، ثم يسأل: ماذا يفعل زميلكم؟ ويستنتج أن الجملة التي تبدأ بفعل جملة فعلية، ويطلب كتابة جمل مشابهة، ويحاكي التلميذ النمط في جمل جديدة على سبورته (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص45) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: ركضت سعاد حافية، وعدت الأم ابنتها، نظرت سعاد صوب القنطرة، خاطت الأم ملابس للدمية، ويذكر التلميذ أمثلة جديدة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم أنشطة الكتاب: وضع الفعل المناسب في الجملة بلعبة الإناء (يسحب طالب ورقة جملة ويختار فعلها من السبورة)، ثم إكمال الجمل بأفعال مناسبة (ص45)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n7. غلق الدرس – جملة فعلية من بلادي: يمثّل طالب حركة (يسبح، يزرع، يصطاد) ويخمّن الزملاء الفعل، ثم تكوّن المجموعة جملة فعلية عن عمل عماني جميل مثل: يزرع الفلاح النخيل، وتقرؤها أمام الصف (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الجملة الفعلية: (الفلج بارد / سعاد طفلة / لعبت سعاد بالدمية / الدمية جميلة)\nالإجابة: لعبت سعاد بالدمية.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حوّل إلى جملة فعلية: (سعاد لعبت): (لعبت سعاد / سعاد لعبت / سعاد ولعبت / لعب سعاد)\nالإجابة: لعبت سعاد.\n\nس3 (مستوى الاستدلال): صحح الجملة لتصبح فعلية: (الدمية سحبها الماء).\nالإجابة: سحب الماء الدمية.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ترتيب ألعاب حقيقية في صندوقها بعد اللعب، ثم يخبئ لعبة ويسأل «أين اللعبة؟» ليتدرب التلميذ على السؤال بأداة الاستفهام أين؛ وللتحقق يسأله: بأي أداة نسأل عن المكان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ثلاثة أسئلة عن لوحة «لعبتي» بأدوات استفهام مختلفة (أين، متى، كيف) وطرحها على زملائهم، ثم يقترحون عنوانًا جديدًا للوحة ويعللونه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الفاعل في جملة (أهدى العمُّ سعاد دمية): (سعاد / أهدى / العم / دمية)\nالإجابة: العم.\n\nس2 (مستوى التطبيق): .... الماء الدمية بعيدًا. (من / جرف / الماء)\nالإجابة: جرف.\n\nس3 (مستوى الاستدلال): أكمل بفعل مناسب: .... الطفل الكرة.\nالإجابة: رمى/ ركل الطفل الكرة.", "- للطالب: حل أنشطة النمط اللغوي ص45 وكتابة جملتين موظفًا الجملة الفعلية.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=3"]}, {"k": "الإملاء", "p": ["النمط الإملائي: اللام الشمسية واللام القمرية (الملاحظة والتصنيف)", "النمط الإملائي: اللام الشمسية واللام القمرية (التطبيق والإملاء المنقول)"], "w": "الأسبوع الثالث: 20–24/9/2026م – الأسبوع الرابع: 27/9–1/10/2026م", "f": ["1. يلاحظ اللام الشمسية واللام القمرية في كلمات من النص (15 دقيقة)\n2. يصنف كلمات وفق اللام الشمسية واللام القمرية (10 دقائق)\n3. يكتب كلمات تتضمن اللام الشمسية واللام القمرية كتابة صحيحة (15 دقيقة)\n4. يكتب إملاءً منقولًا بخط واضح (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يذكر أمثلة جديدة من خارج النص (15 دقيقة)\n- يميز الخطأ الإملائي في كلمة ويصححه (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة\n6. السؤال والجواب", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. اللام الشمسية واللام القمرية\n2. ال التعريف\n3. تُكتب ولا تُنطق\n4. تُكتب وتُنطق", "يرفع المعلم صورة الشمس وصورة القمر ويطلب نطق الكلمتين وملاحظة الفرق في نطق اللام، وينطق التلميذ الكلمتين ويلاحظ الفرق (5 دقائق)", "1. ملاحظة الظاهرة: يعرض المعلم جملًا من النص فيها كلمات ملونة: السابعة، الغبطة، السلّم، الدمية، الماء، الفلج، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: اللام الشمسية تُكتب ولا تُنطق ويُشدَّد الحرف بعدها مثل (الشّمس)، واللام القمرية تُكتب وتُنطق مثل (القمر)، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التصنيف: يوجه الطلاب إلى قراءة الجمل وملاحظة الكلمات الملونة وكتابتها بجانب الجملة، ثم تصنيفها في جدول (لام شمسية/ لام قمرية) (ص46)، ويصنف التلميذ الكلمات في الجدول (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أنشطة الكتاب: يطلب المعلم تصنيف الكلمات الإملائية في الكتاب، وإكمال كلمات بـ(ال) ونطقها صحيحًا (ص46)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n6. الإملاء المنقول: يكتب المعلم على السبورة: «كانت سعاد في السابعة من عمرها، أخذتها هابطة بها السلّم الحجري إلى الفلج.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – شمس وقمر: يرفع الطلاب بطاقة «شمس» أو «قمر» عند سماع كلمات من بيئة عمان (النَّخلة، القلعة، الشاطئ، الجبل)، ثم تكتب كل مجموعة كلمتين عمانيتين في الجدول المناسب على السبورة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: اللام في كلمة (الشمس): (شمسية / قمرية)\nالإجابة: شمسية.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: اللام في كلمة (الفلج): (شمسية / قمرية)\nالإجابة: قمرية.\n\nس3 (مستوى الاستدلال): ما الفرق في النطق بين (الشمس) و(القمر)؟\nالإجابة: اللام في (الشمس) تُكتب ولا تُنطق ويُشدد الحرف بعدها، وفي (القمر) تُكتب وتُنطق.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ترتيب ألعاب حقيقية في صندوقها بعد اللعب، ثم يخبئ لعبة ويسأل «أين اللعبة؟» ليتدرب التلميذ على السؤال بأداة الاستفهام أين؛ وللتحقق يسأله: بأي أداة نسأل عن المكان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ثلاثة أسئلة عن لوحة «لعبتي» بأدوات استفهام مختلفة (أين، متى، كيف) وطرحها على زملائهم، ثم يقترحون عنوانًا جديدًا للوحة ويعللونه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: اللام في كلمة (القنطرة): (قمرية / شمسية)\nالإجابة: قمرية.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: اللام في كلمة (الغبطة): (قمرية / شمسية)\nالإجابة: قمرية.\n\nس3 (مستوى الاستدلال): صوّب: (اشّمس ساطعة).\nالإجابة: الشمس ساطعة.", "- للطالب: حل أنشطة النمط الإملائي ص46 وكتابة خمس كلمات تمثل اللام الشمسية واللام القمرية.\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=3"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (ب ت ث) بخط النسخ"], "w": "الأسبوع الرابع: 27/9–1/10/2026م", "f": ["1. يكتب الحروف (ب ت ث) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (10 دقائق)\n2. يكتب الكلمات والجملة: «ألعب بألعابي، ثم أرتبها.» محاكيًا النموذج (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (ب ت ث) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (بيت، كبرت، اختفت، ثوب) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص47) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «ألعب بألعابي، ثم أرتبها.» ويختار أجود خط ليعلق في لوحة الصف (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – بطاقة بلدتي: يكتب كل طالب بخط النسخ كلمة عمانية فيها حرف من حروف (ب ت ث) مثل: بركاء، تمر، ثمار، ويتبادل الزملاء البطاقات ويقيّمون جمال الحروف ثم تُعلّق في لوحة الصف (5 دقائق)\nالاستراتيجيات: تعلم الأقران.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أي الكلمات تبدأ بحرف الباء؟ (تمر / بيت / ثوب / سعاد)\nالإجابة: بيت.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: عدد نقاط حرف الثاء: (واحدة / ثلاث / لا نقاط / اثنتان)\nالإجابة: ثلاث.\n\nس3 (مستوى الاستدلال): اكتب كلمة تبدأ بالثاء وأخرى تنتهي بالتاء.\nالإجابة: مثل: ثعلب، بنت.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ترتيب ألعاب حقيقية في صندوقها بعد اللعب، ثم يخبئ لعبة ويسأل «أين اللعبة؟» ليتدرب التلميذ على السؤال بأداة الاستفهام أين؛ وللتحقق يسأله: بأي أداة نسأل عن المكان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ثلاثة أسئلة عن لوحة «لعبتي» بأدوات استفهام مختلفة (أين، متى، كيف) وطرحها على زملائهم، ثم يقترحون عنوانًا جديدًا للوحة ويعللونه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف المشترك في (كبرت، اختفت): (التاء / الثاء / الكاف / الباء)\nالإجابة: التاء.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حرف التاء تحته نقطة: (نقطة واحدة فوقه / ثلاث نقاط / لا، فوقه نقطتان / نعم)\nالإجابة: لا، فوقه نقطتان.\n\nس3 (مستوى الاستدلال): اكتب الجملة (ألعب بألعابي، ثم أرتبها.) بخط النسخ.\nالإجابة: كتابة الجملة بحروف واضحة متناسقة على السطر.", "- للطالب: إكمال صفحة الخط ص47 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=3"]}, {"k": "التعبير", "p": ["التعبير الكتابي: قصة مصورة (أنقل الكلام تحت الصورة المناسبة) (الإعداد والتخطيط)", "التعبير الكتابي: قصة مصورة (أنقل الكلام تحت الصورة المناسبة) (الكتابة والمراجعة)"], "w": "الأسبوع الرابع: 27/9–1/10/2026م", "f": ["1. يرتب الأفكار والأحداث للكتابة في: قصة مصورة (أنقل الكلام تحت الصورة المناسبة) (25 دقيقة)\n2. يتحدث شفويًا عن موضوع الكتابة في درس «لعبتي» بجمل مترابطة (5 دقائق)\n3. يكتب قصة مصورة (أنقل الكلام تحت الصورة المناسبة) بجمل مترابطة (15 دقيقة)\n4. يراعي علامات الترقيم والنظافة في كتابته (5 دقائق)\n\nمخرج تعليمي آخر:\n- يتحدث عن الصور بجمل سليمة قبل الكتابة (10 دقائق)\n- يقيّم كتابته وكتابة زميله ويحسنها (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التعلم الذاتي\n5. تعلم الأقران\n6. التقويم الذاتي\n7. التعلم المبني على المشاريع", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التعبير الكتابي\n2. ترتيب الأفكار\n3. علامات الترقيم", "يعرض المعلم صورة طفلة حزينة تبحث عن لعبتها ويسأل: ماذا تقول الطفلة؟ ويقترح كلامًا مناسبًا (5 دقائق)", "1. التمهيد بالأسئلة: يطرح المعلم أسئلة ممهدة: ما اللعبة التي تفضلها؟ ولماذا؟ كيف تتصرف إذا أضعت لعبتك؟ ويجيب التلميذ ويستدعي خبرته (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. تأمل الصور والجمل: يعرض المعلم صور القصة المصورة ويطلب من كل مجموعة التحدث عن صورة، ثم يعرض الجمل (لا تبكي يا بنيتي سأشتري لك دمية أخرى، هل هذه دميتك؟، ما أجمل هذه الدمية!) ويطلب اختيار الجملة المناسبة لكل صورة (ص48)، ويتأمل التلميذ الصور ويتحدث عنها مع مجموعته (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط الشفوي: يطلب المعلم من كل مجموعة ترتيب الأفكار شفويًا (البداية، الأحداث، النهاية) وعرضها، ويرتب التلميذ الأفكار ويعرضها شفويًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مراجعة الخطة: يراجع المعلم مع الطلاب الأفكار المرتبة ويكتب كلمات مساعدة على السبورة، ويراجع التلميذ خطته (5 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n5. الكتابة الفردية: يطلب المعلم نقل الكلام المناسب تحت كل صورة في الكتاب لتكوين قصة مصورة، ثم كتابة جملتين تحكيان نهاية القصة (ص48)، ويمر بين الطلاب ويوجههم، ويكتب التلميذ في كتابه مراعيًا الترتيب وعلامات الترقيم (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n6. المراجعة والعرض: يطلب المعلم من بعض الطلاب قراءة ما كتبوه ويناقش مع الصف جوانب التميز والتحسين، ويطلب تصويب الأخطاء، ويقرأ التلميذ ما كتبه ويصوب أخطاءه (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – ألعاب الحارة: يسأل كل طالب زميله عن لعبته المفضلة وكيف يحافظ عليها، ثم يتحدث الزوجان عن ألعاب جماعية لعبها آباؤهم في الحارة العمانية قديمًا، ويختاران لعبة جماعية يقترحانها للصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نكتب تحت صورة طفلة تبكي على لعبتها: (ما أجمل هذا اليوم! / هيا إلى المدرسة / أين القلم؟ / لا تبكي يا بنيتي سأشتري لك دمية أخرى)\nالإجابة: لا تبكي يا بنيتي سأشتري لك دمية أخرى.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: أفضل نهاية للقصة المصورة: (انتهى اليوم / نامت القطة / وجدت الطفلة دميتها ففرحت / لا شيء)\nالإجابة: وجدت الطفلة دميتها ففرحت.\n\nس3 (مستوى الاستدلال): اكتب نهاية للقصة المصورة في جملتين.\nالإجابة: مثل: وجدت الطفلة دميتها عند الباب، فشكرت أمها وفرحت كثيرًا.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ ترتيب ألعاب حقيقية في صندوقها بعد اللعب، ثم يخبئ لعبة ويسأل «أين اللعبة؟» ليتدرب التلميذ على السؤال بأداة الاستفهام أين؛ وللتحقق يسأله: بأي أداة نسأل عن المكان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ثلاثة أسئلة عن لوحة «لعبتي» بأدوات استفهام مختلفة (أين، متى، كيف) وطرحها على زملائهم، ثم يقترحون عنوانًا جديدًا للوحة ويعللونه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نترك عند بداية الفقرة: (مسافة قصيرة / نصف صفحة / لا شيء / سطرًا كاملًا فارغًا)\nالإجابة: مسافة قصيرة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نضع بعد (هل هذه دميتك): (علامة الاستفهام / الفاصلة / علامة التعجب / النقطة)\nالإجابة: علامة الاستفهام.\n\nس3 (مستوى الاستدلال): قيّم قصة زميلك: هل الجمل مناسبة للصور؟\nالإجابة: يذكر جملة مناسبة وأخرى تحتاج إلى تعديل مع التعليل.", "- للطالب: التحدث مع الأسرة عن الصور ص48 وترتيب أحداثها.\n- للطالب: إكمال نشاط التعبير الكتابي ص48 وقراءته على الأسرة.\n- لولي الأمر: الاستماع إلى ابنه وهو يقرأ ما كتبه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=3"]}]}, {"t": "أنشد وأحفظ: صباح الخير", "u": "المحور الأول: حياتي", "s": [{"k": "القراءة", "p": ["إنشاد «صباح الخير» إنشادًا مسموعًا واضحًا (الحصة الأولى)", "فهم معاني «صباح الخير» ومحاكاة تعبيراتها (الحصة الثانية)", "حفظ «صباح الخير» وإنشادها إنشادًا معبرًا (الحصة الثالثة)"], "w": "الأسبوع الرابع: 27/9–1/10/2026م – الأسبوع السادس: 11–15/10/2026م – الأسبوع السابع: 18–22/10/2026م", "f": ["1. يوظف إنصاته لتسهيل ترديد أنشودة «صباح الخير» (5 دقائق)\n2. يردد أنشودة «صباح الخير» بصوت مسموع واضح (20 دقيقة)\n3. يوضح معاني مفردات الأنشودة مثل: (ماضٍ: ذاهب، منفعتي: فائدتي، أبتي: أبي) (20 دقيقة)\n4. يستنتج القيم الواردة في الأنشودة: احترام الوالدين، الإقبال على العلم، النظام والترتيب (5 دقائق)\n5. يحفظ أبيات «صباح الخير» حفظًا متقنًا (15 دقيقة)\n6. ينشد «صباح الخير» مراعيًا الإيقاع والتعبير (10 دقائق)\n\nمخرج تعليمي آخر:\n- ينشد مع زمرته بانسجام (15 دقيقة)\n- يحاكي تعبيرًا من الأنشودة في جملة من إنشائه (15 دقيقة)\n- يقيّم إنشاد زملائه وفق معايير محددة (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تحليل\nالمخرج 5: تذكر\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تقييم", "1. الإنشاد والترديد\n2. التعلم بالنمذجة\n3. التعلم التعاوني", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. تحية الصباح واحترام الوالدين والإقبال على العلم\n2. احترام الوالدين\n3. الإقبال على العلم", "يمهد المعلم بالحديث عن تحية الصباح واحترام الوالدين والإقبال على العلم ويسأل الطلاب عن أناشيد يحبونها، ويتحدث التلميذ عن أنشودة يحبها (5 دقائق)", "1. الإلقاء النموذجي: يلقي المعلم «صباح الخير» (مصطفى عكرمة) بصوت واضح معبر أو يستعين بالتسجيل الصوتي، ويطلب المتابعة في الكتاب (ص84–87)، ويستمع التلميذ ويتابع في الكتاب (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الترديد في زمر: يطلب المعلم في الإلقاء الثاني ترديد الأنشودة وراءه في زمر، ويحفز الطلاب الخجولين على المشاركة، ويردد التلميذ مع زمرته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الإنشاد الجماعي: ينشد الطلاب جماعيًا مع تمثيل حركي بسيط لمعاني الأبيات، وينشد التلميذ جماعيًا (10 دقائق)\nالاستراتيجيات: الإنشاد والترديد.\n\n4. الإنشاد والمراجعة: يطلب المعلم إنشاد «صباح الخير» جماعيًا ويصحح ضبط الكلمات، وينشد التلميذ جماعيًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. المعاني والقيم: يناقش المعلم معاني المفردات (ماضٍ: ذاهب، منفعتي: فائدتي، أبتي: أبي) والقيم (احترام الوالدين، الإقبال على العلم، النظام والترتيب) بأسئلة الكتاب، ويجيب التلميذ ويستنتج القيم (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. المحاكاة: يطلب المعلم محاكاة تعبير من الأنشودة في جملة من إنشائهم ويعرضها، ويحاكي التلميذ التعبير (10 دقائق)\nالاستراتيجيات: الإنشاد والترديد.\n\n7. الحفظ بالإخفاء التدريجي: يكتب المعلم الأبيات ويخفي كلمات تدريجيًا حتى الحفظ، ويحفظ التلميذ الأبيات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. المنشد المتميز: الإيقاع، التعبير)، وينشد التلميذ مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. التقييم: يقيّم الطلاب أداء المجموعات ويعلن الفائزة، ويقيّم التلميذ الأداء (5 دقائق)\nالاستراتيجيات: الإنشاد والترديد.\n\n10. غلق الدرس – صباح الخير يا عمان: تنشد كل مجموعة مقطعًا من «صباح الخير» وتضيف إليه تحية صباحية لمدينة عمانية تختارها مثل: صباح الخير يا مسقط، صباح الخير يا صلالة، ثم تنشد المجموعات معًا بانسجام (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نقول (صباح الخير) لـ: (لا أحد / من نلاقيه ليلًا فقط / من نلاقيه في الصباح / الحيوانات فقط)\nالإجابة: من نلاقيه في الصباح.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: يطلب الطفل من أمه: (أن تدعو له / أن تنام / أن تسافر / أن تشتري له لعبة)\nالإجابة: أن تدعو له.\n\nس3 (مستوى الاستدلال): أنشد الأنشودة كاملة.\nالإجابة: إنشاد كامل بإيقاع صحيح.\n\n• نشاط علاجي (لمن لم يتقن): يقسّم المعلم مقطعًا من أنشودة «صباح الخير» إلى أسطر قصيرة، ويردده التلميذ بعده بصوت مسموع واضح مع زميل مساعد، ويوضح له «أبتي: أبي»؛ وللتحقق يسأله: لمن نقول صباح الخير؟ ثم يردد المقطع.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء أنشودة «صباح الخير» في زمرة بانسجام مع توزيع الأبيات، ثم يؤلف كل منهم جملة يحيي بها والديه صباحًا مستعملًا كلمة «منفعتي» أو «ماضٍ».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نختم الأنشودة بالحديث عن رضا: (الوالدين / الأصدقاء / البائع / الجيران)\nالإجابة: الوالدين.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: من القيم في الأنشودة: (إضاعة الوقت / الكسل / احترام الوالدين والإقبال على العلم / الفوضى)\nالإجابة: احترام الوالدين والإقبال على العلم.\n\nس3 (مستوى الاستدلال): اذكر قيمتين تعلمتهما من الأنشودة.\nالإجابة: احترام الوالدين، والإقبال على العلم.", "- للطالب: ترديد الأنشودة ص84 مع الأسرة.\n- للطالب: حل أنشطة الأنشودة ص85–86.\n- للطالب: حفظ الأنشودة كاملة وإنشادها لأسرته.\n- لولي الأمر: الاستماع إلى ابنه وهو ينشد «صباح الخير» وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=4"]}]}, {"t": "سيكبرون", "u": "المحور الأول: حياتي", "s": [{"k": "التحدث", "p": ["التحدث عن لوحة المحادثة والتمهيد لدرس «سيكبرون»"], "w": "الأسبوع الرابع: 27/9–1/10/2026م", "f": ["1. يتحدث عن مضمون لوحة المحادثة في درس «سيكبرون» بلغة سليمة وجمل مكتملة (10 دقائق)\n2. يجيب عن أسئلة اللوحة مثل: قارن بين الصورتين (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يُعدّ سؤالًا إضافيًا عن اللوحة ويطرحه على زملائه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. جهاز عرض البيانات", "1. الحقوق والواجبات\n2. احترام الأسرة\n3. النظام والترتيب", "يناقش الطلاب في أهمية وجود بيت للإنسان، ثم يسأل: من المسؤول عن ترتيب البيت ونظافته؟ وما دورك أنت؟ ويعبر التلميذ عن أهمية البيت ودوره في ترتيبه (5 دقائق)", "1. أشاهد وأتحدث: يعرض المعلم لوحة المحادثة (ص49) ويترك للطلاب فرصة لتأملها ثم يسأل: ماذا تشاهدون؟ ويطرح أسئلة اللوحة: قارن بين الصورتين.، كيف تترك غرفتك عندما تخرج في الصباح؟، كيف تجد الغرفة عندما تعود إلى البيت؟، ويساعدهم في صياغة جمل مكتملة، ويتأمل التلميذ اللوحة ويجيب بجمل مكتملة ويربطها بخبرته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أفضل سؤال: يطلب المعلم من كل مجموعة إعداد سؤال إضافي عن اللوحة يطرحه منسقها على المجموعات الأخرى، ويختار أفضل سؤال وأفضل إجابة، ويعد التلميذ سؤالًا مع مجموعته ويجيب عن أسئلة المجموعات الأخرى (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحدث الفردي: يطلب المعلم من بعض الطلاب التحدث في ثلاث جمل عن: دوره في ترتيب غرفته ومساعدة أسرته، ويعزز اللغة السليمة وآداب التحدث، ويتحدث التلميذ أمام زملائه في ثلاث جمل مترابطة (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – بيتنا العماني: تتحدث كل مجموعة عن عمل تقوم به في ترتيب البيت العماني ومساعدة الوالدين، ثم يمثّل أفرادها المشهد بحركات ويخمّن الزملاء العمل، ويختمون بجملة: «نتعاون في بيتنا كما نتعاون في وطننا» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا أفعل بغرفتي قبل الخروج إلى المدرسة؟ (أتركها مبعثرة / أرتبها / أغلق بابها على الفوضى / أرمي الملابس على الأرض)\nالإجابة: أرتبها.\n\nس2 (مستوى التطبيق): من المسؤول عن ترتيب غرفتي؟ (أمي وحدها / الضيوف / أنا مع أسرتي / لا أحد)\nالإجابة: أنا مع أسرتي.\n\nس3 (مستوى الاستدلال): قارن بين الغرفة في الصورتين في جملتين.\nالإجابة: في الصورة الأولى الغرفة مبعثرة، وفي الثانية مرتبة نظيفة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي الغرفة المبعثرة والمرتبة، ويرتب مع التلميذ أدوات حقيقية على الطاولة خطوة خطوة وهو يقول: أضع الكتاب، أعلّق الثوب؛ وللتحقق يسأله: ماذا تفعل بغرفتك قبل الخروج إلى المدرسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لمهام ترتيب الغرفة يتقاسمها أفراد الأسرة، ثم يقارنون بين صورتي درس «سيكبرون» بثلاث جمل مستعملين كلمة «بينما».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نضع الكتب بعد المذاكرة: (تحت السرير / على الأرض / في المكتبة / في المطبخ)\nالإجابة: في المكتبة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الصورة التي تُعجبنا أكثر: (الغرفة المرتبة / الغرفة المكسورة / الغرفة المبعثرة / الغرفة المظلمة)\nالإجابة: الغرفة المرتبة.\n\nس3 (مستوى الاستدلال): تحدث عن دورك في ترتيب البيت في ثلاث جمل.\nالإجابة: مثل: أرتب سريري صباحًا، وأضع ألعابي في صندوقها، وأساعد أمي في ترتيب المائدة.", "- للطالب: تأمل لوحة المحادثة ص49 والتحدث عنها مع الأسرة في ثلاث جمل.\n- لولي الأمر: محاورة ابنه حول: دوره في ترتيب غرفته ومساعدة أسرته، وتشجيعه على استخدام جمل مكتملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=5"]}, {"k": "القراءة", "p": ["القراءة التصفحية والتوقع والقراءة النموذجية لنص «سيكبرون»", "القراءة الجهرية الأولى لنص «سيكبرون» ومعاني المفردات", "القراءة الجهرية الثانية لنص «سيكبرون» وفهم المعنى الصريح (خطوتي الأولى)", "القراءة الجهرية الثالثة لنص «سيكبرون» وترتيب الأحداث", "القراءة الجهرية الرابعة وفهم المعنى الضمني في نص «سيكبرون» (خطوتي الثانية)", "تفسير أفكار نص «سيكبرون» ودمجها ومحاكاة التعبير (خطوتي الثالثة)", "القراءة الجهرية الخامسة وتقييم نص «سيكبرون» وإبداء الرأي (خطوتي الرابعة)", "القراءة المعبرة ومسرحة نص «سيكبرون»", "التحليل والتركيب (أحلل وأركب) في درس «سيكبرون»", "مراجعة شاملة وتقويم ختامي لدرس «سيكبرون»"], "w": "الأسبوع الرابع: 27/9–1/10/2026م – الأسبوع الخامس: 4–8/10/2026م", "f": ["1. يحدد هوية نص «سيكبرون»: العنوان والكاتب (نزار نجار) والمصدر والمتحدث (15 دقيقة)\n2. يتوقع مضمون النص من العنوان والصور ثم يتحقق من توقعه (5 دقائق)\n3. يقرأ نص «سيكبرون» قراءة جهرية صحيحة مراعيًا ضبط الكلمات وعلامات الترقيم (15 دقيقة)\n4. يذكر معاني الكلمات الجديدة (الفوضى، مبعثرة، المنضدة، أطايب الطعام) مستعينًا بالسياق (10 دقائق)\n5. يقرأ نص «سيكبرون» قراءة جهرية صحيحة معبرة (15 دقيقة)\n6. يسترجع معلومات صريحة وردت في النص عن (الراوي وإخوته، الأم، الأب) (15 دقيقة)\n7. يقرأ نص «سيكبرون» قراءة جهرية معبرة بتعدد القراءات (15 دقيقة)\n8. يرتب أحداث نص «سيكبرون» ترتيبًا صحيحًا (10 دقائق)\n9. يستنتج صفات الشخصيات (الراوي وإخوته، الأم) من أفعالها وأقوالها (5 دقائق)\n10. يقرأ الفقرات المرتبطة بالأسئلة قراءة جهرية صحيحة (20 دقيقة)\n11. يستخلص العبرة من نص «سيكبرون» ويحدد نوعه (15 دقيقة)\n12. يقترح عنوانًا آخر مناسبًا للنص (10 دقائق)\n13. يبدي رأيه في تصرفات الراوي وإخوته ويعلل رأيه (15 دقيقة)\n14. يقرأ جمل النص قراءة جهرية معبرة في نشاط تنافسي (15 دقيقة)\n15. يقرأ نص «سيكبرون» قراءة معبرة تظهر انفعالات الشخصيات (10 دقائق)\n16. يمثل أدوار الشخصيات (الراوي وإخوته، الأم، الأب، الأخت الصغيرة) بلغة سليمة (15 دقيقة)\n17. يحلل الجمل إلى كلمات ويحدد عددها (10 دقائق)\n18. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (20 دقيقة)\n19. يجيب عن أسئلة متنوعة تقيس فهم النص والمفردات (15 دقيقة)\n20. يوظف نمطي الدرس (ظرفا الزمان والمكان، التاء المفتوحة والتاء المربوطة) في جمل صحيحة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (10 دقائق)\n- يعيد سرد مضمون النص بأسلوبه (15 دقيقة)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «لا تنزعج.. ستشفى بسرعة!» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يقيّم أداء زملائه وفق معايير بسيطة (الصوت، التعبير، الطلاقة) (15 دقيقة)\n- يميز بين الحروف المتقاربة (ص، ض، ط، ظ) في كلمات من النص (10 دقائق)\n- يحدد ما أتقنه وما يحتاج إلى تدريب في الدرس (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج 13: تقييم\nالمخرج 14: تطبيق\nالمخرج 15: تطبيق\nالمخرج 16: تطبيق\nالمخرج 17: تحليل\nالمخرج 18: تطبيق\nالمخرج 19: فهم\nالمخرج 20: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: إبداع\nالمخرج الآخر 5: تحليل\nالمخرج الآخر 6: تطبيق\nالمخرج الآخر 7: إبداع\nالمخرج الآخر 8: تقييم\nالمخرج الآخر 9: تطبيق\nالمخرج الآخر 10: تقييم", "1. التنبؤ\n2. التعلم الذاتي\n3. السؤال والجواب\n4. التعلم بالنمذجة\n5. التعلم المبني على اللعب\n6. تعلم الأقران\n7. التعلم التعاوني\n8. تعدد القراءات\n9. أعواد المثلجات\n10. التعلم بالاكتشاف\n11. العصف الذهني\n12. الحوار والمناقشة\n13. تمثيل الأدوار\n14. لعبة القطار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)، أعواد المثلجات بأسماء الطلاب، سلتان وبيضتان بلاستيكيتان وملعقتان، أدوات تمثيل بسيطة (أقنعة وبطاقات أسماء)", "1. القراءة التصفحية\n2. هوية النص\n3. التوقع\n4. المفردات\n5. السياق\n6. المرادف والضد\n7. المعنى الصريح\n8. الشخصيات\n9. المكان\n10. ترتيب الأحداث\n11. السرد\n12. الاستنتاج\n13. الفكرة الرئيسة\n14. الحقوق والواجبات\n15. العبرة\n16. نوع النص\n17. المحاكاة\n18. إبداء الرأي\n19. التقييم\n20. احترام الأسرة\n21. القراءة المعبرة\n22. التمثيل\n23. المقطع الصوتي\n24. الكلمة\n25. الجملة\n26. المراجعة\n27. ظرفا الزمان والمكان\n28. التاء المفتوحة والتاء المربوطة", "يكتب المعلم عبارة «سيكبرون...» على السبورة ويسأل: من الذين سيكبرون؟ ومن قد يقول هذه العبارة؟ ويتوقع التلميذ قائل العبارة والمقصود بها (5 دقائق)", "1. القراءة التصفحية: يحدد المعلم صفحة النص (ص51–54) ويطلب تصفحًا سريعًا لمدة دقيقتين، ويكتب أهداف القراءة التصفحية، ثم يطلب من طالب كتابة العنوان على السبورة ومن آخر قراءة اسم الكاتب (نزار نجار) والمصدر (كفا أمي)، ويتصفح التلميذ النص بسرعة ويستخرج العنوان والكاتب والمصدر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. بطاقة النص والتوقع: يكمل المعلم مع الطلاب بطاقة النص (العنوان، الكاتب، المتحدث)، ثم يطرح سؤال التوقع: «سيكبرون...» من المقصود بهذه العبارة في النص القادم؟ ويدوّن التوقعات على السبورة، ويكمل التلميذ البطاقة ويكتب توقعه (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. القراءة النموذجية: يعرض المعلم النص على جهاز العرض ويقرؤه قراءة جهرية نموذجية معبرة مراعيًا علامات الترقيم ومستخدمًا المؤشر، ثم يطلب من الطلاب التحقق من توقعاتهم، ويتابع التلميذ القراءة النموذجية بالمؤشر ويقارن توقعه بمضمون النص (15 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة الجهرية الأولى: يكتب المعلم أهداف القراءة الجهرية، ثم يقرأ فقرة نموذجية ويطلب من الطلاب المجيدين ثم الأقل إجادة قراءة فقرات النص (ص51–54) بالتناوب، ويصحح الأخطاء بعد إتمام الجملة، ويقرأ التلميذ الفقرة المطلوبة قراءة جهرية صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. اكتشاف معاني المفردات: يعرض المعلم المفردات في بطاقات: الفوضى (عدم النظام)، مبعثرة (متفرقة غير مرتبة)، المنضدة (الطاولة)، أطايب الطعام (ألذ الطعام وأطيبه)، هانئين (مرتاحين سعداء)، تهتف (تنادي بصوت مرتفع)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص55–56) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: متى يخرج الأولاد من البيت؟ (في المساء / في الصباح / في الظهيرة / في الليل)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (10 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الثالثة (تعدد القراءات): يوزع المعلم فقرات النص على المجموعات، ويسحب عود مثلجات باسم طالب ليقرأ الفقرة المحددة، ويستمر حتى نهاية النص، ويقرأ التلميذ الفقرة عند سحب اسمه ويتابع قراءة زملائه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. ترتيب الأحداث: يوزع المعلم بطاقات الأحداث على المجموعات ويطلب ترتيبها من (1) إلى (6) مستعينين بالنص (ص55–56)، ثم تعرض كل مجموعة ترتيبها، ويرتب التلميذ البطاقات مع مجموعته ويعلل الترتيب من النص (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. إعادة السرد: يطلب المعلم من طالبين إعادة سرد الأحداث المرتبة بأسلوبهما مستخدمين أدوات الربط (في البداية، ثم، بعد ذلك، وأخيرًا)، ويعيد التلميذ سرد الأحداث بأسلوبه (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n13. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص57) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (20 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n15. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: صبر الأم وحنان الوالدين على الأولاد حتى يتعودوا النظام، ويختار التلميذ الفكرة الرئيسة ويعلل (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n16. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص58–59) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n18. محاكاة التعبير: يعرض المعلم التعبير: «لا تنزعج.. ستشفى بسرعة!» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «لا تضجر.. سينتهي الواجب قريبًا!»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n19. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n20. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص59) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. نمذجة القراءة المعبرة: يقرأ المعلم مقاطع الحوار والمواقف المؤثرة في النص بنبرات مختلفة، ويلفت إلى تلوين الصوت بحسب علامات الترقيم، ويستمع التلميذ ويحاكي القراءة المعبرة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n23. التدرب في: يوزع المعلم أدوار الشخصيات (الراوي وإخوته، الأم، الأب، الأخت الصغيرة) والراوي على المجموعات ويمنحها وقتًا للتدرب، ويتدرب التلميذ مع مجموعته على أداء دوره (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n24. العرض والتقييم: تعرض كل مجموعة مشهدًا، ويقيّم الطلاب الأداء ببطاقة (الصوت، التعبير، الطلاقة)، ويمثل التلميذ دوره ويقيّم أداء المجموعات الأخرى (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n25. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص60–61) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (في الصباح نخرج من البيت)، ويفصل التلميذ الكلمات ويعدها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n26. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: الصباح، المنضدة، أمي، ماهرة ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n27. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n28. محطات المراجعة: يوزع المجموعات على أربع محطات: محطة الفهم، محطة المفردات، محطة النمط اللغوي، محطة الإملاء، ويتنقل الطلاب بينها كل ثلاث دقائق ونصف، وينجز التلميذ مهمة كل محطة مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n29. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن مراجعة شاملة وتقويم ختامي لدرس «سيكبرون»، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n30. التقويم الذاتي: يوزع المعلم بطاقة (أتقنت/ أحتاج إلى تدريب) لكل مهارة في الدرس، ويقيّم التلميذ مستواه في مهارات الدرس (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n31. غلق الدرس – حين أكبر أخدم عمان: يكمل كل طالب جملة «عندما أكبر سأخدم عمان بأن أكون…» ويمثّل مهنته بحركة، فيخمّن زملاء المجموعة المهنة، ثم يتحدثون عن رد الجميل للوالدين حين يكبرون (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كاتب نص «سيكبرون»: (وفاء الحسيني / زهران القاسمي / حمدي هاشم حسانين / نزار نجار)\nالإجابة: نزار نجار.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: العبرة من النص: (ننام مبكرًا فقط / لا نساعد في البيت / نتعود النظام ونقدّر جهد الوالدين / نترك الفوضى دائمًا)\nالإجابة: نتعود النظام ونقدّر جهد الوالدين.\n\nس3 (مستوى الاستدلال): أعد سرد نص «سيكبرون» في ثلاث جمل.\nالإجابة: يخرج الأولاد ويتركون الفوضى، فتصبر الأم وترتب البيت وتطبخ لهم، ويساعدهم الأب مساءً ثم ينامون سعداء.\n\n• نشاط علا
