 "الأسبوع التاسع: 1–5/11/2026م", "f": ["1. يستمع إلى النص بانتباه ويحدد شخصيتي الحوار الرئيستين (10 دقائق)\n2. يبين ملامح القدوة في شخصية شمساء الخليلية وأدوات الاقتداء بها (10 دقائق)\n\nمخرج تعليمي آخر:\n- يقارن بين عصرين ويبدي رأيه في الشخصية التي يراها قدوة ويعلل (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تقييم", "1. الاستماع الموجه\n2. الحوار والمناقشة\n3. التعلم التعاوني\n4. العصف الذهني", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. صورة توضيحية\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. اختيار القدوة الحسنة\n2. عمان حافلة بالنماذج النسائية المؤثرة\n3. آداب الاستماع", "يسأل المعلم: هل تعرف لماذا سماك أهلك بهذا الاسم؟ ثم يخبرهم أنهم سيستمعون إلى قصة فتاة سألت أمها عن سبب اسمها، ويحكي التلميذ ما يعرفه عن اسمه (5 دقائق)", "1. آداب الاستماع والاستماع الأول (ص18–19): يذكّر المعلم بآداب الاستماع ويقرأ النص قراءة معبرة، ثم يطلب تلوين طرفي الحوار (الأم وشمساء) وكتابة اسم الشخصية التي دار حولها الحوار، ويستمع التلميذ ويلون ويكتب اسم الشخصية (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الاستماع الثاني (ص20): يعيد المعلم القراءة ويناقش: كم سنة بين شمساء الطفلة وشمساء العالمة؟ ويطلب إكمال: عندما كبرت شمساء أصبحت مثل أبيها، وجلست تعلّم النساء وتكتب كتبًا كثيرة، ويجيب التلميذ ويكمل العبارات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الاستماع الثالث والمقارنة (ص21): يعيد المعلم القراءة ويطلب المقارنة بين حياتنا اليوم وحياة العمانيين قديمًا (اللباس، البيوت، وسائل التعلم)، ثم يسأل: من الشخصية التي تراها قدوة لك؟ ولماذا؟ ويقارن التلميذ ويبدي رأيه ويعلل (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – قدوات من عمان: يتعاون أفراد كل مجموعة في ذكر صفة جميلة من صفات شمساء الخليلية كما وردت في النص، ثم يقترحون عملًا صغيرًا يقتدون بها فيه كحب العلم والقراءة، ويعرضونه بجملة واحدة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: سألت شمساء أمها عن سبب: (مرضها / سفرها / غيابها / تسميتها شمساء)\nالإجابة: تسميتها شمساء.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: شخصية الحوار الرئيسة التي حكت عنها الأم: (شمساء الخليلية / نور / ليلى / سعاد)\nالإجابة: شمساء الخليلية.\n\nس3 (مستوى الاستدلال): ما الأدوات التي تحتاجها شمساء الصغيرة لتصبح مثل العالمة شمساء الخليلية؟\nالإجابة: العلم والمعرفة والعزيمة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم قراءة الحوار بين شمساء وأمها مستعينًا ببطاقتين باسمي الشخصيتين، ويرفع التلميذ بطاقة المتكلم في كل جملة؛ وللتحقق يسأله: عن أي شيء سألت شمساء أمها؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة رسالة قصيرة من شمساء الصغيرة إلى العالمة شمساء الخليلية تذكر ما ستفعله لتكون مثلها (العلم، المعرفة، العزيمة)، ويعللون اختيارها قدوة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: وُلدت شمساء الخليلية في بلدة: (صلالة / بوشر / نزوى / صحار)\nالإجابة: بوشر.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: اسم والد شمساء العالمة: (سعيد بن خلفان الخليلي / سالم / الخليل بن أحمد / أحمد بن ماجد)\nالإجابة: سعيد بن خلفان الخليلي.\n\nس3 (مستوى الاستدلال): من الشخصية التي تراها قدوة لك؟ ولماذا؟\nالإجابة: يذكر شخصية مناسبة ويعلل بصفاتها الحسنة.", "- للطالب: سؤال والديه عن سبب تسميته وكتابته في سطرين.\n- لولي الأمر: الحديث مع ابنه عن شخصيات عمانية قدوة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=9"]}]}, {"t": "نور تحب قريتها", "u": "المحور الثاني: وطني", "s": [{"k": "التحدث", "p": ["التحدث عن لوحة المحادثة والتمهيد لدرس «نور تحب قريتها»"], "w": "الأسبوع التاسع: 1–5/11/2026م", "f": ["1. يتحدث عن مضمون لوحة المحادثة في درس «نور تحب قريتها» بلغة سليمة وجمل مكتملة (10 دقائق)\n2. يجيب عن أسئلة اللوحة مثل: ماذا تشاهد في الصورة؟ (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يُعدّ سؤالًا إضافيًا عن اللوحة ويطرحه على زملائه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. جهاز عرض البيانات", "1. حب الوطن\n2. التمسك والانتماء للأرض\n3. جمال القرى العمانية", "يسأل المعلم: هل تحب قريتك أو حيك؟ هل فكرت يومًا أن تبتعد عنه؟ لماذا؟ ثم يخبرهم أن الدرس قصة فتاة تحب قريتها، ويعبر التلميذ عن حبه لقريته أو حيه (5 دقائق)", "1. أشاهد وأتحدث: يعرض المعلم لوحة المحادثة (ص22) ويترك للطلاب فرصة لتأملها ثم يسأل: ماذا تشاهدون؟ ويطرح أسئلة اللوحة: ماذا تشاهد في الصورة؟، لماذا يعود الطائر إلى عشه مهما ابتعد عنه؟، ما العبرة التي تتعلمها من هذه الصورة؟، ويساعدهم في صياغة جمل مكتملة، ويتأمل التلميذ اللوحة ويجيب بجمل مكتملة ويربطها بخبرته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أفضل سؤال: يطلب المعلم من كل مجموعة إعداد سؤال إضافي عن اللوحة يطرحه منسقها على المجموعات الأخرى، ويختار أفضل سؤال وأفضل إجابة، ويعد التلميذ سؤالًا مع مجموعته ويجيب عن أسئلة المجموعات الأخرى (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحدث الفردي: يطلب المعلم من بعض الطلاب التحدث في ثلاث جمل عن: قريته أو حيه وما يحبه فيه، ويعزز اللغة السليمة وآداب التحدث، ويتحدث التلميذ أمام زملائه في ثلاث جمل مترابطة (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – جولة في قريتي: يتقمص كل طالب دور مرشد صغير ويصف لزملائه في المجموعة معلمًا من قريته أو حيه في عمان (الفلج، النخيل، الحصن) بجملتين، وتختار المجموعة أجمل وصف وتعرضه على الصف (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: يعود الطائر إلى عشه لأنه: (لا يعرف الطيران / يخاف الناس / يكره السماء / يحبه ويشعر فيه بالأمان)\nالإجابة: يحبه ويشعر فيه بالأمان.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نتعلم من الطائر الذي يعود إلى عشه: (حب الوطن والانتماء إليه / كثرة السفر / الكسل / الخوف)\nالإجابة: حب الوطن والانتماء إليه.\n\nس3 (مستوى الاستدلال): لماذا يعود الطائر إلى عشه مهما ابتعد؟\nالإجابة: لأنه يحبه ويشعر فيه بالأمان، كما يحب الإنسان وطنه.\n\n• نشاط علاجي (لمن لم يتقن): يستعين المعلم بعش وطائر من الورق ويمثّل مع التلميذ ابتعاد الطائر ثم عودته إلى عشه، ويربط ذلك بحب نور قريتها؛ وللتحقق يسأله: لماذا يعود الطائر إلى عشه مهما ابتعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة جملتين يشبّهون فيهما حبهم لقريتهم أو مدينتهم بحب الطائر لعشه، ثم يعدّون سؤالًا عن لوحة «نور تحب قريتها» ويطرحونه على زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: العش بيت: (النحلة / السمكة / الطائر / الأرنب)\nالإجابة: الطائر.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: أحب قريتي أو حيي لأن فيه: (لا شيء / أهلي وذكرياتي / الغرباء فقط / الضجيج)\nالإجابة: أهلي وذكرياتي.\n\nس3 (مستوى الاستدلال): تحدث عن قريتك أو حيك في ثلاث جمل.\nالإجابة: مثل: أسكن في حي جميل، فيه مسجد وحديقة، وأحب جيراني فيه.", "- للطالب: تأمل لوحة المحادثة ص22 والتحدث عنها مع الأسرة في ثلاث جمل.\n- لولي الأمر: محاورة ابنه حول: قريته أو حيه وما يحبه فيه، وتشجيعه على استخدام جمل مكتملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=10"]}, {"k": "القراءة", "p": ["القراءة التصفحية والتوقع والقراءة النموذجية لنص «نور تحب قريتها»", "القراءة الجهرية الأولى لنص «نور تحب قريتها» ومعاني المفردات", "القراءة الجهرية الثانية لنص «نور تحب قريتها» وفهم المعنى الصريح (خطوتي الأولى)", "القراءة الجهرية الثالثة لنص «نور تحب قريتها» وترتيب الأحداث", "القراءة الجهرية الرابعة وفهم المعنى الضمني في نص «نور تحب قريتها» (خطوتي الثانية)", "تفسير أفكار نص «نور تحب قريتها» ودمجها ومحاكاة التعبير (خطوتي الثالثة)", "القراءة الجهرية الخامسة وتقييم نص «نور تحب قريتها» وإبداء الرأي (خطوتي الرابعة)", "التحليل والتركيب (أحلل وأركب) في درس «نور تحب قريتها»", "مراجعة شاملة وتقويم ختامي لدرس «نور تحب قريتها»"], "w": "الأسبوع التاسع: 1–5/11/2026م – الأسبوع العاشر: 8–12/11/2026م", "f": ["1. يحدد هوية نص «نور تحب قريتها»: العنوان والكاتب (الطالبة الأبرار (بطاقة النص)) والمصدر والمتحدث (15 دقيقة)\n2. يتوقع مضمون النص من العنوان والصور ثم يتحقق من توقعه (5 دقائق)\n3. يقرأ نص «نور تحب قريتها» قراءة جهرية صحيحة مراعيًا ضبط الكلمات وعلامات الترقيم (15 دقيقة)\n4. يذكر معاني الكلمات الجديدة (فاق، مغردة، مفعمة، الإخفاق) مستعينًا بالسياق (10 دقائق)\n5. يقرأ نص «نور تحب قريتها» قراءة جهرية صحيحة معبرة (15 دقيقة)\n6. يسترجع معلومات صريحة وردت في النص عن (نور، الكاتبة بيان، أسرة نور) (15 دقيقة)\n7. يقرأ نص «نور تحب قريتها» قراءة جهرية معبرة بتعدد القراءات (15 دقيقة)\n8. يرتب أحداث نص «نور تحب قريتها» ترتيبًا صحيحًا (10 دقائق)\n9. يستنتج صفات الشخصيات (نور، الكاتبة بيان) من أفعالها وأقوالها (5 دقائق)\n10. يقرأ الفقرات المرتبطة بالأسئلة قراءة جهرية صحيحة (20 دقيقة)\n11. يستخلص العبرة من نص «نور تحب قريتها» ويحدد نوعه (15 دقيقة)\n12. يقترح عنوانًا آخر مناسبًا للنص (10 دقائق)\n13. يبدي رأيه في تصرفات نور ويعلل رأيه (15 دقيقة)\n14. يقرأ جمل النص قراءة جهرية معبرة في نشاط تنافسي (15 دقيقة)\n15. يحلل الجمل إلى كلمات ويحدد عددها (10 دقائق)\n16. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (20 دقيقة)\n17. يجيب عن أسئلة متنوعة تقيس فهم النص والمفردات (15 دقيقة)\n18. يوظف نمطي الدرس (الجملة الاسمية، التنوين (تنوين الضم والفتح والكسر)) في جمل صحيحة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (10 دقائق)\n- يعيد سرد مضمون النص بأسلوبه (15 دقيقة)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «فقريتي كزهرة بيضاء تأبى أن أتركها.» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يميز بين حرفي (س، ش) في كلمات النص (10 دقائق)\n- يحدد ما أتقنه وما يحتاج إلى تدريب في الدرس (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج 13: تقييم\nالمخرج 14: تطبيق\nالمخرج 15: تحليل\nالمخرج 16: تطبيق\nالمخرج 17: فهم\nالمخرج 18: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: إبداع\nالمخرج الآخر 5: تحليل\nالمخرج الآخر 6: تطبيق\nالمخرج الآخر 7: إبداع\nالمخرج الآخر 8: تطبيق\nالمخرج الآخر 9: تقييم", "1. التنبؤ\n2. التعلم الذاتي\n3. السؤال والجواب\n4. التعلم بالنمذجة\n5. التعلم المبني على اللعب\n6. تعلم الأقران\n7. التعلم التعاوني\n8. تعدد القراءات\n9. أعواد المثلجات\n10. التعلم بالاكتشاف\n11. العصف الذهني\n12. الحوار والمناقشة\n13. لعبة القطار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)، أعواد المثلجات بأسماء الطلاب، سلتان وبيضتان بلاستيكيتان وملعقتان", "1. القراءة التصفحية\n2. هوية النص\n3. التوقع\n4. المفردات\n5. السياق\n6. المرادف والضد\n7. المعنى الصريح\n8. الشخصيات\n9. المكان\n10. ترتيب الأحداث\n11. السرد\n12. الاستنتاج\n13. الفكرة الرئيسة\n14. حب الوطن\n15. العبرة\n16. نوع النص\n17. المحاكاة\n18. إبداء الرأي\n19. التقييم\n20. التمسك والانتماء للأرض\n21. المقطع الصوتي\n22. الكلمة\n23. الجملة\n24. المراجعة\n25. الجملة الاسمية\n26. التنوين (تنوين الضم والفتح والكسر)", "يعرض المعلم بطاقة النص في الكتاب ويطلب قراءتها للتعرف إلى القصة قبل قراءتها، ويقرأ التلميذ البطاقة ويتعرف القصة (5 دقائق)", "1. القراءة التصفحية: يحدد المعلم صفحة النص (ص24–26) ويطلب تصفحًا سريعًا لمدة دقيقتين، ويكتب أهداف القراءة التصفحية، ثم يطلب من طالب كتابة العنوان على السبورة ومن آخر قراءة اسم الكاتب (الطالبة الأبرار (بطاقة النص)) والمصدر (كتاب أحب لغتي)، ويتصفح التلميذ النص بسرعة ويستخرج العنوان والكاتب والمصدر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. بطاقة النص والتوقع: يكمل المعلم مع الطلاب بطاقة النص (العنوان، الكاتب، المتحدث)، ثم يطرح سؤال التوقع: من العنوان «نور تحب قريتها»: ماذا تتوقع أن تفعل نور؟ ويدوّن التوقعات على السبورة، ويكمل التلميذ البطاقة ويكتب توقعه (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. القراءة النموذجية: يعرض المعلم النص على جهاز العرض ويقرؤه قراءة جهرية نموذجية معبرة مراعيًا علامات الترقيم ومستخدمًا المؤشر، ثم يطلب من الطلاب التحقق من توقعاتهم، ويتابع التلميذ القراءة النموذجية بالمؤشر ويقارن توقعه بمضمون النص (15 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة الجهرية الأولى: يكتب المعلم أهداف القراءة الجهرية، ثم يقرأ فقرة نموذجية ويطلب من الطلاب المجيدين ثم الأقل إجادة قراءة فقرات النص (ص24–26) بالتناوب، ويصحح الأخطاء بعد إتمام الجملة، ويقرأ التلميذ الفقرة المطلوبة قراءة جهرية صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. اكتشاف معاني المفردات: يعرض المعلم المفردات في بطاقات: فاق (زاد على)، مغردة (تصدر أصواتًا جميلة)، مفعمة (مملوءة)، الإخفاق (الفشل)، تأبى (ترفض)، يانعة (نضرة ناضجة)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص27–28) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: بماذا كانت تحلم نور؟ (أن تصبح طبيبة / أن تصبح مهندسة / أن تسافر بعيدًا / أن تصبح كاتبة)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (10 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الثالثة (تعدد القراءات): يوزع المعلم فقرات النص على المجموعات، ويسحب عود مثلجات باسم طالب ليقرأ الفقرة المحددة، ويستمر حتى نهاية النص، ويقرأ التلميذ الفقرة عند سحب اسمه ويتابع قراءة زملائه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. ترتيب الأحداث: يوزع المعلم بطاقات الأحداث على المجموعات ويطلب ترتيبها من (1) إلى (5) مستعينين بالنص (ص27–28)، ثم تعرض كل مجموعة ترتيبها، ويرتب التلميذ البطاقات مع مجموعته ويعلل الترتيب من النص (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. إعادة السرد: يطلب المعلم من طالبين إعادة سرد الأحداث المرتبة بأسلوبهما مستخدمين أدوات الربط (في البداية، ثم، بعد ذلك، وأخيرًا)، ويعيد التلميذ سرد الأحداث بأسلوبه (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n13. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص30–31) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (20 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n15. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: حب نور لقريتها وتمسكها بها رغم إغراءات الشهرة، ويختار التلميذ الفكرة الرئيسة ويعلل (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n16. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص32–33) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n18. محاكاة التعبير: يعرض المعلم التعبير: «فقريتي كزهرة بيضاء تأبى أن أتركها.» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «فمدرستي كحديقة جميلة أحب أن أبقى فيها.»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n19. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n20. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص34) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص35–36) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (نور تحب قريتها)، ويفصل التلميذ الكلمات ويعدها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n23. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: قرية، سماء، الطيور، كاتبة ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n24. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n25. محطات المراجعة: يوزع المجموعات على أربع محطات: محطة الفهم، محطة المفردات، محطة النمط اللغوي، محطة الإملاء، ويتنقل الطلاب بينها كل ثلاث دقائق ونصف، وينجز التلميذ مهمة كل محطة مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n26. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول مراجعة شاملة وتقويم ختامي لدرس «نور تحب قريتها»، ويبدأ المعلم بسؤال «اختر الإجابة الصحيحة: رفضت نور مغادرة: (قريتها / السوق / مدرستها / بيت جدتها)» (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n27. التقويم الذاتي: يوزع المعلم بطاقة (أتقنت/ أحتاج إلى تدريب) لكل مهارة في الدرس، ويقيّم التلميذ مستواه في مهارات الدرس (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n28. غلق الدرس – مرشد قريتي الصغير: يصف كل طالب لمجموعته شيئًا يحبه في قريته أو حيه بعمان كالفلج أو النخيل أو البحر أو المسجد، وتختار المجموعة أجمل وصف وتقدّمه كأنها مرشد سياحي صغير (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: عنوان الدرس الأول في المحور الثاني: (لعبتي / ليلى ترسم وطنًا / البحر يتسع للجميع / نور تحب قريتها)\nالإجابة: نور تحب قريتها.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: صفة نور كما تظهر في النص: (حزينة دائمًا / مفعمة بالنشاط محبة لقريتها / متكبرة / كسولة)\nالإجابة: مفعمة بالنشاط محبة لقريتها.\n\nس3 (مستوى الاستدلال): أعد سرد القصة في ثلاث جمل.\nالإجابة: حلمت نور أن تصبح كاتبة فكتبت عن قريتها، ودعتها بيان إلى مغادرتها فرفضت وبقيت تكتب عن جمالها.\n\n• نشاط علاجي (لمن لم يتقن): يستعين المعلم بعش وطائر من الورق ويمثّل مع التلميذ ابتعاد الطائر ثم عودته إلى عشه، ويربط ذلك بحب نور قريتها؛ وللتحقق يسأله: لماذا يعود الطائر إلى عشه مهما ابتعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة جملتين يشبّهون فيهما حبهم لقريتهم أو مدينتهم بحب الطائر لعشه، ثم يعدّون سؤالًا عن لوحة «نور تحب قريتها» ويطرحونه على زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نوع التنوين في (قصةً): (تنوين الكسر / تنوين الفتح / لا تنوين / تنوين الضم)\nالإجابة: تنوين الفتح.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: معنى «هذه القرية أصغر من حلمك» عند بيان: (القرية صغيرة الحجم فقط / الحلم سيء / القرية مهجورة / النجاح في نظرها يحتاج مكانًا أكبر)\nالإجابة: النجاح في نظرها يحتاج مكانًا أكبر.\n\nس3 (مستوى الاستدلال): اكتب جملة اسمية فيها كلمة منونة.\nالإجابة: مثل: القريةُ جميلةٌ.", "- للطالب: قراءة نص «نور تحب قريتها» ص24–26 قراءة صامتة مرة واحدة على الأقل.\n- للطالب: قراءة النص ص24–26 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة.\n- للطالب: إكمال أنشطة خطوتي الأولى ص27–28 وقراءة النص مرة أخرى.\n- للطالب: إعادة سرد أحداث نص «نور تحب قريتها» مرتبة أمام الأسرة.\n- للطالب: حل أنشطة خطوتي الثانية ص30–31 في الكتاب.\n- للطالب: كتابة جملتين تحاكي التعبير «فقريتي كزهرة بيضاء تأبى أن أتركها.» وحل أنشطة ص32–33.\n- للطالب: كتابة رأيه في إحدى شخصيات نص «نور تحب قريتها» في سطرين.\n- للطالب: حل أنشطة التحليل والتركيب ص35–36.\n- للطالب: مراجعة نص «نور تحب قريتها» وأنشطته كاملة والتدرب على ما يحتاج إلى تدريب.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة.\n- لولي الأمر: الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف.\n- لولي الأمر: سؤال ابنه عن شخصيات النص ومكان أحداثه.\n- لولي الأمر: الاستماع إلى سرد ابنه ومساعدته على استخدام أدوات الربط.\n- لولي الأمر: سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «نور تحب قريتها» ولماذا.\n- لولي الأمر: مناقشة ابنه في العبرة من النص وكيف يطبقها.\n- لولي الأمر: مناقشة ابنه في رأيه بالنص وتعليله.\n- لولي الأمر: لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت.\n- لولي الأمر: الاطلاع على بطاقة التقويم الذاتي ومساعدة ابنه في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=10"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: الجملة الاسمية (التعرف والمحاكاة)", "النمط اللغوي: الجملة الاسمية (التطبيق وأنشطة الكتاب)"], "w": "الأسبوع التاسع: 1–5/11/2026م", "f": ["1. يتعرف الجملة الاسمية من خلال أمثلة من النص (15 دقيقة)\n2. يحاكي الجملة الاسمية في جمل جديدة (10 دقائق)\n3. يطبق الجملة الاسمية في أنشطة الكتاب (20 دقيقة)\n4. يميز الجملة الاسمية في جمل معروضة (5 دقائق)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (15 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. الجملة الاسمية\n2. المبتدأ (الاسم الأول)\n3. الخبر", "يعرض المعلم صورة قرية ويطلب جملة تبدأ باسم تصفها، ويقول التلميذ: القرية جميلة (5 دقائق)", "1. اكتشاف النمط: يعرض المعلم جملًا من النص: القرية جميلة، السماء زرقاء، الماء عذب، السكان طيبون، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: الجملة الاسمية تبدأ باسم، ونخبر عنه بكلمة أخرى، مثل: القريةُ جميلةٌ، البحرُ هادئٌ، ويلاحظ التلميذ الأمثلة ويستنتج النمط (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المحاكاة: يعرض المعلم صورًا (بحر، سماء، بنايات) ويطلب وصف كل صورة بجملة تبدأ باسم (البحر هادئ، السماء صافية، البنايات عالية)، ثم يقارنها بجملة فعلية ليلاحظوا الفرق، ويحاكي التلميذ النمط في جمل جديدة على سبورته (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص37) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: نور فتاة نشيطة، السهول خضراء، الزهور جميلة، قريتي زهرة بيضاء، ويذكر التلميذ أمثلة جديدة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم أنشطة الكتاب: إكمال الجمل الاسمية بما ينقصها من الصندوق لتصبح تامة مفيدة (ص37)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n7. غلق الدرس – جملة اسمية عن وطني: توزَّع على المجموعات بطاقات مبتدأ (القرية، الفلج، العلم) وبطاقات خبر (جميلة، جارٍ، مرفوع)، وتتسابق في تكوين جمل اسمية صحيحة عن عمان وقراءتها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الجملة الاسمية: (كتبت نور / القرية جميلة / زارت بيان القرية / رفضت نور العرض)\nالإجابة: القرية جميلة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الاسم الأول في جملة (نور فتاة نشيطة): (لا يوجد / فتاة / نشيطة / نور)\nالإجابة: نور.\n\nس3 (مستوى الاستدلال): حوّل الجملة إلى اسمية: (تغرد الطيور).\nالإجابة: الطيور تغرد.\n\n• نشاط علاجي (لمن لم يتقن): يستعين المعلم بعش وطائر من الورق ويمثّل مع التلميذ ابتعاد الطائر ثم عودته إلى عشه، ويربط ذلك بحب نور قريتها؛ وللتحقق يسأله: لماذا يعود الطائر إلى عشه مهما ابتعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة جملتين يشبّهون فيهما حبهم لقريتهم أو مدينتهم بحب الطائر لعشه، ثم يعدّون سؤالًا عن لوحة «نور تحب قريتها» ويطرحونه على زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: حوّل إلى جملة اسمية: (تحب نور قريتها): (القرية / نور تحب قريتها / أحبت نور / تحب قريتها نور)\nالإجابة: نور تحب قريتها.\n\nس2 (مستوى التطبيق): السماءُ .... (إلى / طارت / صافيةٌ)\nالإجابة: صافيةٌ.\n\nس3 (مستوى الاستدلال): أكمل بخبر مناسب: الماءُ ....\nالإجابة: عذبٌ/ صافٍ.", "- للطالب: حل أنشطة النمط اللغوي ص37 وكتابة جملتين موظفًا الجملة الاسمية.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=10"]}, {"k": "الإملاء", "p": ["النمط الإملائي: التنوين (تنوين الضم والفتح والكسر) (الملاحظة والتصنيف)", "النمط الإملائي: التنوين (تنوين الضم والفتح والكسر) (التطبيق والإملاء المنقول)"], "w": "الأسبوع العاشر: 8–12/11/2026م", "f": ["1. يلاحظ التنوين (تنوين الضم والفتح والكسر) في كلمات من النص (15 دقيقة)\n2. يصنف كلمات وفق التنوين (تنوين الضم والفتح والكسر) (10 دقائق)\n3. يكتب كلمات تتضمن التنوين (تنوين الضم والفتح والكسر) كتابة صحيحة (15 دقيقة)\n4. يكتب إملاءً منقولًا بخط واضح (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يذكر أمثلة جديدة من خارج النص (15 دقيقة)\n- يميز الخطأ الإملائي في كلمة ويصححه (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة\n6. السؤال والجواب", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل، السبورات الشخصية (الصغيرة)", "1. التنوين (تنوين الضم والفتح والكسر)\n2. نون ساكنة تُنطق ولا تُكتب\n3. ألف تنوين الفتح", "ينطق المعلم (كتابٌ) ويسأل: هل تسمعون نونًا؟ هل نكتبها؟ ويلاحظ التلميذ أن النون تُنطق ولا تُكتب (5 دقائق)", "1. ملاحظة الظاهرة: يعرض المعلم جملًا من النص فيها كلمات ملونة: سماءٌ، طيورٌ، ماءٌ، قصصًا، أشعارًا، فتاةً، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: التنوين نون ساكنة تُنطق ولا تُكتب في آخر الاسم، ونرسمه ضمتين (ـٌ) أو فتحتين (ـً) أو كسرتين (ـٍ)، مثل: سماءٌ، سماءً، سماءٍ، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التصنيف: يكتب كلمة (سماء) بالتنوين الثلاثي وينطقها، ثم يطلب استخراج كلمات منونة من النص وتصنيفها في جدول التنوين (ص37–38)، ويصنف التلميذ الكلمات في الجدول (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أنشطة الكتاب: يطلب المعلم كتابة الكلمات بالتنوين المناسب كما في المثال (السماء: سماءٌ، سماءً، سماءٍ)، ثم تحويل الحروف إلى كلمات لتكوين رسالة قصيرة (ص37–38)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n6. الإملاء المنقول: يكتب المعلم على السبورة: «في قريةٍ جميلةٍ سماءٌ زرقاءُ وطيورٌ مغردةٌ وماءٌ عذبٌ.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – تنوين القرية: يقرأ المعلم كلمات من بيئة القرية العمانية (نخلةٌ، فلجًا، بيتٍ)، فيرفع الطلاب بطاقة نوع التنوين، ثم تكتب كل مجموعة جملة عن قريتها فيها كلمة منوّنة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نوع التنوين في كلمة (سماءٌ): (تنوين الفتح / تنوين الكسر / تنوين الضم)\nالإجابة: تنوين الضم.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نوع التنوين في كلمة (فتاةً): (تنوين الكسر / تنوين الضم / تنوين الفتح)\nالإجابة: تنوين الفتح.\n\nس3 (مستوى الاستدلال): ما الفرق بين كتابة تنوين الفتح وتنوين الضم؟\nالإجابة: تنوين الفتح غالبًا تُزاد معه ألف (كتابًا)، وتنوين الضم ضمتان (كتابٌ).\n\n• نشاط علاجي (لمن لم يتقن): يستعين المعلم بعش وطائر من الورق ويمثّل مع التلميذ ابتعاد الطائر ثم عودته إلى عشه، ويربط ذلك بحب نور قريتها؛ وللتحقق يسأله: لماذا يعود الطائر إلى عشه مهما ابتعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة جملتين يشبّهون فيهما حبهم لقريتهم أو مدينتهم بحب الطائر لعشه، ثم يعدّون سؤالًا عن لوحة «نور تحب قريتها» ويطرحونه على زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نوع التنوين في كلمة (مكانٍ): (تنوين الكسر / تنوين الفتح / تنوين الضم)\nالإجابة: تنوين الكسر.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نوع التنوين في كلمة (طيورٌ): (تنوين الكسر / تنوين الضم / تنوين الفتح)\nالإجابة: تنوين الضم.\n\nس3 (مستوى الاستدلال): صوّب: (رسمت ليلى حصانً).\nالإجابة: رسمت ليلى حصانًا.", "- للطالب: حل أنشطة النمط الإملائي ص37–38 وكتابة خمس كلمات تمثل التنوين (تنوين الضم والفتح والكسر).\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=10"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (س ش) بخط النسخ"], "w": "الأسبوع العاشر: 8–12/11/2026م", "f": ["1. يكتب الحروف (س ش) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (10 دقائق)\n2. يكتب الكلمات والجملة: «نستعيذ بالله من شر الوسواس الخناس.» محاكيًا النموذج (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (س ش) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (سماء، منساب، أشعار، نشاط) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص39) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «نستعيذ بالله من شر الوسواس الخناس.» ويختار أجود خط ليعلق في لوحة الصف (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – سين وشين: يكتب كل طالب بخط النسخ كلمة عمانية فيها حرف السين أو الشين مثل: مسقط، سمائل، الشرقية، ويتبادل الزملاء البطاقات ويقيّمون جمال الحروف ثم تُعلّق في ركن الصف (5 دقائق)\nالاستراتيجيات: تعلم الأقران.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف الذي فوقه ثلاث نقاط: (ش / س / ص / ط)\nالإجابة: ش.\n\nس2 (مستوى التطبيق): أي الكلمات فيها حرف الشين؟ (سهول / أشعار / سماء / منساب)\nالإجابة: أشعار.\n\nس3 (مستوى الاستدلال): اكتب كلمتين: الأولى فيها سين، والثانية فيها شين.\nالإجابة: مثل: سمك، شمس.\n\n• نشاط علاجي (لمن لم يتقن): يستعين المعلم بعش وطائر من الورق ويمثّل مع التلميذ ابتعاد الطائر ثم عودته إلى عشه، ويربط ذلك بحب نور قريتها؛ وللتحقق يسأله: لماذا يعود الطائر إلى عشه مهما ابتعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة جملتين يشبّهون فيهما حبهم لقريتهم أو مدينتهم بحب الطائر لعشه، ثم يعدّون سؤالًا عن لوحة «نور تحب قريتها» ويطرحونه على زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كلمة فيها سين في وسطها: (نشاط / منساب / أشعار / سماء)\nالإجابة: منساب.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الفرق بين السين والشين: (الشين بلا أسنان / الشين فوقها ثلاث نقاط / السين تحتها نقطة / لا فرق)\nالإجابة: الشين فوقها ثلاث نقاط.\n\nس3 (مستوى الاستدلال): اكتب الجملة (نستعيذ بالله من شر الوسواس الخناس.) بخط النسخ.\nالإجابة: كتابة الجملة بحروف متناسقة على السطر.", "- للطالب: إكمال صفحة الخط ص39 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=10"]}, {"k": "التعبير", "p": ["التعبير الكتابي: كتابة نص قصير عن تحية العلم في مدرستي (الإعداد والتخطيط)", "التعبير الكتابي: كتابة نص قصير عن تحية العلم في مدرستي (الكتابة والمراجعة)"], "w": "الأسبوع العاشر: 8–12/11/2026م", "f": ["1. يرتب الأفكار والأحداث للكتابة في: كتابة نص قصير عن تحية العلم في مدرستي (25 دقيقة)\n2. يتحدث شفويًا عن موضوع الكتابة في درس «نور تحب قريتها» بجمل مترابطة (5 دقائق)\n3. يكتب كتابة نص قصير عن تحية العلم في مدرستي بجمل مترابطة (20 دقيقة)\n4. يراعي علامات الترقيم والنظافة في كتابته (5 دقائق)\n\nمخرج تعليمي آخر:\n- يتحدث عن الصور بجمل سليمة قبل الكتابة (10 دقائق)\n- يقيّم كتابته وكتابة زميله ويحسنها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التعلم الذاتي\n5. تعلم الأقران\n6. التقويم الذاتي\n7. التعلم المبني على المشاريع", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التعبير الكتابي\n2. ترتيب الأفكار\n3. علامات الترقيم", "يعرض المعلم صورة طابور صباحي ويسأل: ماذا يحدث في الصورة؟ ويصف التلميذ الصورة بجمل (5 دقائق)", "1. التمهيد بالأسئلة: يطرح المعلم أسئلة ممهدة: متى نحيي العلم في المدرسة؟ ماذا نفعل في طابور الصباح؟ بماذا تشعر وأنت تنشد النشيد الوطني؟ ويجيب التلميذ ويستدعي خبرته (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. تأمل الصور والجمل: يعرض المعلم الرسوم ويطلب وصل كل جملة بالرسم المناسب: (انتظم التلاميذ في صفوف متوازية)، (رفع ناصر وسعاد علم عمان عاليًا مرفرفًا)، (ردد التلاميذ النشيد الوطني بهمة وفخر)، (أعطت المعلمة إشارة انطلاق تحية العلم) (ص40)، ويتأمل التلميذ الصور ويتحدث عنها مع مجموعته (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط الشفوي: يطلب المعلم من كل مجموعة ترتيب الأفكار شفويًا (البداية، الأحداث، النهاية) وعرضها، ويرتب التلميذ الأفكار ويعرضها شفويًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مراجعة الخطة: يراجع المعلم مع الطلاب الأفكار المرتبة ويكتب كلمات مساعدة على السبورة، ويراجع التلميذ خطته (5 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n5. الكتابة الفردية: يطلب المعلم ربط الجمل السابقة بأدوات ربط مناسبة وكتابة نص قصير عن تحية العلم في مدرسته مرتبًا حسب تسلسل الأحداث (ص40)، ويمر بين الطلاب ويوجههم، ويكتب التلميذ في كتابه مراعيًا الترتيب وعلامات الترقيم (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n6. المراجعة والعرض: يطلب المعلم من بعض الطلاب قراءة ما كتبوه ويناقش مع الصف جوانب التميز والتحسين، ويطلب تصويب الأخطاء، ويقرأ التلميذ ما كتبه ويصوب أخطاءه (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – تحية العلم: تكتب كل مجموعة جملة عن تحية العلم في الطابور الصباحي، ثم تُجمع الجمل وتُرتّب فقرة واحدة يقرؤها الطلاب معًا وهم يقفون احترامًا لعلم عمان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: أول ما يحدث في تحية العلم: (ينتظم التلاميذ في صفوف / ينصرف التلاميذ / تنتهي الحصة / يُطوى العلم)\nالإجابة: ينتظم التلاميذ في صفوف.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: ألوان علم عمان: (الأسود فقط / البرتقالي / الأزرق والأصفر / الأحمر والأبيض والأخضر)\nالإجابة: الأحمر والأبيض والأخضر.\n\nس3 (مستوى الاستدلال): اكتب نصًا قصيرًا عن تحية العلم في ثلاث جمل مترابطة.\nالإجابة: مثل: في الصباح انتظمنا في صفوف متوازية، ثم رفع زميلانا العلم عاليًا، ورددنا النشيد الوطني بفخر.\n\n• نشاط علاجي (لمن لم يتقن): يستعين المعلم بعش وطائر من الورق ويمثّل مع التلميذ ابتعاد الطائر ثم عودته إلى عشه، ويربط ذلك بحب نور قريتها؛ وللتحقق يسأله: لماذا يعود الطائر إلى عشه مهما ابتعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة جملتين يشبّهون فيهما حبهم لقريتهم أو مدينتهم بحب الطائر لعشه، ثم يعدّون سؤالًا عن لوحة «نور تحب قريتها» ويطرحونه على زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): انتظم التلاميذ في صفوف .... . (مكسورة / مبعثرة / متوازية)\nالإجابة: متوازية.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: رفع ناصر وسعاد: (اللوحة / علم عمان / الحقيبة / الكرة)\nالإجابة: علم عمان.\n\nس3 (مستوى الاستدلال): قيّم نص زميلك من حيث الترتيب وأدوات الربط.\nالإجابة: يذكر نقطة تميز وأخرى للتحسين.", "- للطالب: التحدث مع الأسرة عن الصور ص40 وترتيب أحداثها.\n- للطالب: إكمال نشاط التعبير الكتابي ص40 وقراءته على الأسرة.\n- لولي الأمر: الاستماع إلى ابنه وهو يقرأ ما كتبه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=10"]}]}, {"t": "أنشد وأحفظ: أزهار الخمائل", "u": "المحور الثاني: وطني", "s": [{"k": "القراءة", "p": ["إنشاد «أزهار الخمائل» إنشادًا مسموعًا واضحًا (الحصة الأولى)", "فهم معاني «أزهار الخمائل» ومحاكاة تعبيراتها (الحصة الثانية)", "حفظ «أزهار الخمائل» وإنشادها إنشادًا معبرًا (الحصة الثالثة)"], "w": "الأسبوع العاشر: 8–12/11/2026م – الأسبوع الثاني عشر: 22–24/11/2026م – الأسبوع الرابع عشر: 6–10/12/2026م", "f": ["1. يوظف إنصاته لتسهيل ترديد أنشودة «أزهار الخمائل» (5 دقائق)\n2. يردد أنشودة «أزهار الخمائل» بصوت مسموع واضح (20 دقيقة)\n3. يوضح معاني مفردات الأنشودة مثل: (الخمائل: الشجر الكثيف، أنوار الحياة) (20 دقيقة)\n4. يستنتج القيم الواردة في الأنشودة: حب الوطن، الأطفال أمل الوطن، العمل والاجتهاد (5 دقائق)\n5. يحفظ أبيات «أزهار الخمائل» حفظًا متقنًا (15 دقيقة)\n6. ينشد «أزهار الخمائل» مراعيًا الإيقاع والتعبير (10 دقائق)\n\nمخرج تعليمي آخر:\n- ينشد مع زمرته بانسجام (15 دقيقة)\n- يحاكي تعبيرًا من الأنشودة في جملة من إنشائه (15 دقيقة)\n- يقيّم إنشاد زملائه وفق معايير محددة (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تحليل\nالمخرج 5: تذكر\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تقييم", "1. الإنشاد والترديد\n2. التعلم بالنمذجة\n3. التعلم التعاوني", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. حب الوطن وأن الأطفال أمل الوطن ومستقبله\n2. حب الوطن\n3. الأطفال أمل الوطن", "يمهد المعلم بالحديث عن حب الوطن وأن الأطفال أمل الوطن ومستقبله ويسأل الطلاب عن أناشيد يحبونها، ويتحدث التلميذ عن أنشودة يحبها (5 دقائق)", "1. الإلقاء النموذجي: يلقي المعلم «أزهار الخمائل» (سعيدة بنت خاطر الفارسية) بصوت واضح معبر أو يستعين بالتسجيل الصوتي، ويطلب المتابعة في الكتاب (ص77–78)، ويستمع التلميذ ويتابع في الكتاب (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الترديد في زمر: يطلب المعلم في الإلقاء الثاني ترديد الأنشودة وراءه في زمر، ويحفز الطلاب الخجولين على المشاركة، ويردد التلميذ مع زمرته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الإنشاد الجماعي: ينشد الطلاب جماعيًا مع تمثيل حركي بسيط لمعاني الأبيات، وينشد التلميذ جماعيًا (12 دقيقة)\nالاستراتيجيات: الإنشاد والترديد.\n\n4. المعاني والقيم: يناقش المعلم معاني المفردات (الخمائل: الشجر الكثيف، أنوار الحياة) والقيم (حب الوطن، الأطفال أمل الوطن، العمل والاجتهاد) بأسئلة الكتاب، ويجيب التلميذ ويستنتج القيم (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. المحاكاة: يطلب المعلم محاكاة تعبير من الأنشودة في جملة من إنشائهم ويعرضها، ويحاكي التلميذ التعبير (13 دقيقة)\nالاستراتيجيات: الإنشاد والترديد.\n\n6. الحفظ بالإخفاء التدريجي: يكتب المعلم الأبيات ويخفي كلمات تدريجيًا حتى الحفظ، ويحفظ التلميذ الأبيات (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. المنشد المتميز: تتنافس المجموعات في إنشاد «أزهار الخمائل» وفق معايير المنشد المتميز (الحفظ، الإيقاع، التعبير)، وينشد التلميذ مع مجموعته (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. التقييم: يقيّم الطلاب أداء المجموعات ويعلن الفائزة، ويقيّم التلميذ الأداء (6 دقائق)\nالاستراتيجيات: الإنشاد والترديد.\n\n9. غلق الدرس – أزهار حديقة الوطن: تنشد كل مجموعة بيتًا من الأنشودة، ويشبّه أفرادها أنفسهم بأزهار في حديقة الوطن، فيقول كل طالب: «أنا زهرة من عمان، وأخدمها بـ…» مكملًا الجملة بعمل جميل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: تتحدث الأنشودة عن: (الرياضة / البحر والسمك / الأطفال وحب الوطن / السوق)\nالإجابة: الأطفال وحب الوطن.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: يشير البيتان في الأنشودة إلى أن الأطفال: (لا قيمة لهم / ضعفاء / كسالى / أمل الوطن ومستقبله)\nالإجابة: أمل الوطن ومستقبله.\n\nس3 (مستوى الاستدلال): أنشد الأنشودة كاملة.\nالإجابة: إنشاد كامل بإيقاع صحيح.\n\n• نشاط علاجي (لمن لم يتقن): يردد المعلم مع التلميذ مقطعًا من أنشودة «أزهار الخمائل» سطرًا سطرًا، ويعرض صورة شجر كثيف ليفهم معنى «الخمائل»؛ وللتحقق يسأله: عمّ تتحدث الأنشودة؟ ثم يردد المقطع بصوت واضح.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتأليف جملة تحاكي تعبيرًا من «أزهار الخمائل» يعبرون بها عن أن الأطفال أمل الوطن، ثم ينشدون الأنشودة في زمرة بانسجام وتوزيع للأصوات.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: شبهت الأنشودة الأطفال بـ: (أزهار الخمائل / البحار / النجوم البعيدة / الجبال)\nالإجابة: أزهار الخمائل.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: من القيم في الأنشودة: (الأنانية / الكسل / حب الوطن والعمل له / الإسراف)\nالإجابة: حب الوطن والعمل له.\n\nس3 (مستوى الاستدلال): أنشد البيتين اللذين يشيران إلى أن الأطفال أمل الوطن.\nالإجابة: إنشاد البيتين المحددين في الكتاب.", "- للطالب: ترديد الأنشودة ص77 مع الأسرة؛ حل أنشطة الأنشودة ص78؛ حفظ الأنشودة كاملة وإنشادها لأسرته.\n- لولي الأمر: الاستماع إلى ابنه وهو ينشد «أزهار الخمائل» وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=11"]}]}, {"t": "ليلى ترسم وطنًا", "u": "المحور الثاني: وطني", "s": [{"k": "التحدث", "p": ["التحدث عن لوحة المحادثة والتمهيد لدرس «ليلى ترسم وطنًا»"], "w": "الأسبوع العاشر: 8–12/11/2026م", "f": ["1. يتحدث عن مضمون لوحة المحادثة في درس «ليلى ترسم وطنًا» بلغة سليمة وجمل مكتملة (10 دقائق)\n2. يجيب عن أسئلة اللوحة مثل: اختر من الصورة عنصرًا واحدًا وتحدث عنه أمام زملائك (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يُعدّ سؤالًا إضافيًا عن اللوحة ويطرحه على زملائه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. جهاز عرض البيانات", "1. أهمية الوطن والمواطنة\n2. حب الوطن والانتماء إليه\n3. الحنين إلى البيت", "يطلب المعلم من الطلاب ذكر قصة سمعوها عن الوطن ويناقشهم فيها، ثم يخبرهم أنهم سيقرؤون قصة عن حب الوطن، ويحكي التلميذ قصة قصيرة عن الوطن أو يستمع (5 دقائق)", "1. أشاهد وأتحدث: يعرض المعلم لوحة المحادثة (ص41) ويترك للطلاب فرصة لتأملها ثم يسأل: ماذا تشاهدون؟ ويطرح أسئلة اللوحة: اختر من الصورة عنصرًا واحدًا وتحدث عنه أمام زملائك.، ما الحيوان الذي تركبه ليلى؟، إلى أين يطير بها؟، ويساعدهم في صياغة جمل مكتملة، ويتأمل التلميذ اللوحة ويجيب بجمل مكتملة ويربطها بخبرته (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أفضل سؤال: يطلب المعلم من كل مجموعة إعداد سؤال إضافي عن اللوحة يطرحه منسقها على المجموعات الأخرى، ويختار أفضل سؤال وأفضل إجابة، ويعد التلميذ سؤالًا مع مجموعته ويجيب عن أسئلة المجموعات الأخرى (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحدث الفردي: يطلب المعلم من بعض الطلاب التحدث في ثلاث جمل عن: مكان يحب أن يزوره ثم يعود منه إلى بيته، ويعزز اللغة السليمة وآداب التحدث، ويتحدث التلميذ أمام زملائه في ثلاث جمل مترابطة (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – جواز سفر إلى عمان: يحمل كل طالب بطاقة على شكل جواز سفر، ويتخيل أنه يطير على حصان ليلى إلى مكان في عمان يحب زيارته، فيقول لمجموعته جملتين مكتملتين عن المكان، ثم يختم بجملة: «وأعود دائمًا إلى بيتي ووطني عمان»، وتختار المجموعة أجمل رحلة لتعرضها (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحيوان الذي تركبه ليلى في الصورة: (فيل / جمل / غزال / حصان أبيض له جناحان)\nالإجابة: حصان أبيض له جناحان.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: يطير الحصان بليلى إلى: (الحديقة فقط / السوق / بلاد العالم / المدرسة)\nالإجابة: بلاد العالم.\n\nس3 (مستوى الاستدلال): اختر عنصرًا من الصورة وتحدث عنه في جملتين.\nالإجابة: مثل: الحصان أبيض له جناحان كبيران، يطير بليلى فوق البلدان.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى عناصر صورة «ليلى ترسم وطنًا» واحدًا واحدًا: ليلى، الحصان الأبيض، جناحاه، البلدان، ويقول التلميذ جملة عن كل عنصر؛ وللتحقق يسأله: ما الحيوان الذي تركبه ليلى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم وطنهم كما رسمت ليلى وطنها، ثم يتخيلون أنهم يطيرون على الحصان المجنح ويصفون في ثلاث جمل بلدًا زاروه ويقارنونه بوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نتحدث عن عنصر في الصورة بـ: (كلمة واحدة / رسم فقط / إشارة / جمل مكتملة)\nالإجابة: جمل مكتملة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: بعد أي رحلة أعود دائمًا إلى: (السيارة / بيتي ووطني / الطائرة / الفندق)\nالإجابة: بيتي ووطني.\n\nس3 (مستوى الاستدلال): تحدث عن مكان تحب زيارته ولماذا تعود منه إلى بيتك.\nالإجابة: مثل: أحب زيارة البحر، لكني أعود إلى بيتي لأنه وطني الصغير.", "- للطالب: تأمل لوحة المحادثة ص41 والتحدث عنها مع الأسرة في ثلاث جمل.\n- لولي الأمر: محاورة ابنه حول: مكان يحب أن يزوره ثم يعود منه إلى بيته، وتشجيعه على استخدام جمل مكتملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=12"]}, {"k": "القراءة", "p": ["القراءة التصفحية والتوقع والقراءة النموذجية لنص «ليلى ترسم وطنًا»", "القراءة الجهرية الأولى لنص «ليلى ترسم وطنًا» ومعاني المفردات", "القراءة الجهرية الثانية لنص «ليلى ترسم وطنًا» وفهم المعنى الصريح (خطوتي الأولى)", "القراءة الجهرية الثالثة لنص «ليلى ترسم وطنًا» وترتيب الأحداث", "القراءة الجهرية الرابعة وفهم المعنى الضمني في نص «ليلى ترسم وطنًا» (خطوتي الثانية)", "تفسير أفكار نص «ليلى ترسم وطنًا» ودمجها ومحاكاة التعبير (خطوتي الثالثة)", "القراءة الجهرية الخامسة وتقييم نص «ليلى ترسم وطنًا» وإبداء الرأي (خطوتي الرابعة)", "القراءة المعبرة ومسرحة نص «ليلى ترسم وطنًا»", "القراءة الحرة والإثراء: قصص عن حب الوطن والحنين إليه", "التحليل والتركيب (أحلل وأركب) في درس «ليلى ترسم وطنًا»", "مراجعة شاملة وتقويم ختامي لدرس «ليلى ترسم وطنًا»"], "w": "الأسبوع العاشر: 8–12/11/2026م – الأسبوع الحادي عشر: 15–19/11/2026م – الأسبوع الثاني عشر: 22–24/11/2026م", "f": ["1. يحدد هوية نص «ليلى ترسم وطنًا»: العنوان والكاتب (وفاء الحسيني) والمصدر والمتحدث (15 دقيقة)\n2. يتوقع مضمون النص من العنوان والصور ثم يتحقق من توقعه (5 دقائق)\n3. يقرأ نص «ليلى ترسم وطنًا» قراءة جهرية صحيحة مراعيًا ضبط الكلمات وعلامات الترقيم (15 دقيقة)\n4. يذكر معاني الكلمات الجديدة (منحنية، عجائب، تغوص، أعماق) مستعينًا بالسياق (10 دقائق)\n5. يقرأ نص «ليلى ترسم وطنًا» قراءة جهرية صحيحة معبرة (20 دقيقة)\n6. يسترجع معلومات صريحة وردت في النص عن (ليلى، الحصان الأبيض المجنح، السمكة الملونة) (5 دقائق)\n7. يقرأ نص «ليلى ترسم وطنًا» قراءة جهرية معبرة بتعدد القراءات (15 دقيقة)\n8. يرتب أحداث نص «ليلى ترسم وطنًا» ترتيبًا صحيحًا (10 دقائق)\n9. يستنتج صفات الشخصيات (ليلى، الحصان الأبيض المجنح) من أفعالها وأقوالها (5 دقائق)\n10. يقرأ الفقرات المرتبطة بالأسئلة قراءة جهرية صحيحة (20 دقيقة)\n11. يستخلص العبرة من نص «ليلى ترسم وطنًا» ويحدد نوعه (15 دقيقة)\n12. يقترح عنوانًا آخر مناسبًا للنص (10 دقائق)\n13. يبدي رأيه في تصرفات ليلى ويعلل رأيه (15 دقيقة)\n14. يقرأ جمل النص قراءة جهرية معبرة في نشاط تنافسي (15 دقيقة)\n15. يقرأ نص «ليلى ترسم وطنًا» قراءة معبرة تظهر انفعالات الشخصيات (10 دقائق)\n16. يمثل أدوار الشخصيات (ليلى، الحصان الأبيض المجنح، السمكة الملونة، الجدة) بلغة سليمة (15 دقيقة)\n17. يقرأ نصًا قصيرًا في موضوع (قصص عن حب الوطن والحنين إليه) قراءة صحيحة (15 دقيقة)\n18. يقارن بين النص الإثرائي ونص «ليلى ترسم وطنًا» (10 دقائق)\n19. يحلل الجمل إلى كلمات ويحدد عددها (10 دقائق)\n20. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (20 دقيقة)\n21. يجيب عن أسئلة متنوعة تقيس فهم النص والمفردات (15 دقيقة)\n22. يوظف نمطي الدرس (تحويل الجملة الفعلية إلى اسمية والعكس، التاء المربوطة والهاء في آخر الكلمة) في جمل صحيحة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (15 دقيقة)\n- يعيد سرد مضمون النص بأسلوبه (15 دقيقة)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «لماذا أشعر بالشوق إلى البيت كلما غادرته؟» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يقيّم أداء زملائه وفق معايير بسيطة (الصوت، التعبير، الطلاقة) (15 دقيقة)\n- يبدي رأيه فيما قرأ ويعرضه على زملائه (15 دقيقة)\n- يرتب بطاقات الكلمات ليحصل على جمل مفيدة (10 دقائق)\n- يحدد ما أتقنه وما يحتاج إلى تدريب في الدرس (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج 13: تقييم\nالمخرج 14: تطبيق\nالمخرج 15: تطبيق\nالمخرج 16: تطبيق\nالمخرج 17: تطبيق\nالمخرج 18: تحليل\nالمخرج 19: تحليل\nالمخرج 20: تطبيق\nالمخرج 21: فهم\nالمخرج 22: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: إبداع\nالمخرج الآخر 5: تحليل\nالمخرج الآخر 6: تطبيق\nالمخرج الآخر 7: إبداع\nالمخرج الآخر 8: تقييم\nالمخرج الآخر 9: تقييم\nالمخرج الآخر 10: تطبيق\nالمخرج الآخر 11: تقييم", "1. التنبؤ\n2. التعلم الذاتي\n3. السؤال والجواب\n4. التعلم بالنمذجة\n5. التعلم المبني على اللعب\n6. تعلم الأقران\n7. التعلم التعاوني\n8. تعدد القراءات\n9. أعواد المثلجات\n10. التعلم بالاكتشاف\n11. العصف الذهني\n12. الحوار والمناقشة\n13. تمثيل الأدوار\n14. التعلم التشاركي\n15. الفصل المقلوب\n16. لعبة القطار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. أخرى: بطاقات الكلمات والجمل\n5. أخرى: السبورات الشخصية (الصغيرة)\n6. أخرى: أعواد المثلجات بأسماء الطلاب\n7. أخرى: سلتان وبيضتان بلاستيكيتان وملعقتان\n8. أخرى: أدوات تمثيل بسيطة (أقنعة وبطاقات أسماء)\n9. كتب إلكترونية\n10. أخرى: قصص المكتبة الصفية\n11. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. القراءة التصفحية\n2. هوية النص\n3. التوقع\n4. المفردات\n5. السياق\n6. المرادف والضد\n7. المعنى الصريح\n8. الشخصيات\n9. المكان\n10. ترتيب الأحداث\n11. السرد\n12. الاستنتاج\n13. الفكرة الرئيسة\n14. أهمية الوطن والمواطنة\n15. العبرة\n16. نوع النص\n17. المحاكاة\n18. إبداء الرأي\n19. التقييم\n20. حب الوطن والانتماء إليه\n21. القراءة المعبرة\n22. التمثيل\n23. القراءة الحرة\n24. المقارنة\n25. المقطع الصوتي\n26. الكلمة\n27. الجملة\n28. المراجعة\n29. تحويل الجملة الفعلية إلى اسمية والعكس\n30. التاء المربوطة والهاء في آخر الكلمة", "يعرض المعلم رسمة حصان أبيض بجناحين ويسأل: لو تحولت رسمتك إلى حقيقة، إلى أين ستأخذك؟ ويتخيل التلميذ ويجيب (5 دقائق)", "1. القراءة التصفحية: يحدد المعلم صفحة النص (ص43–45) ويطلب تصفحًا سريعًا لمدة دقيقتين، ويكتب أهداف القراءة التصفحية، ثم يطلب من طالب كتابة العنوان على السبورة ومن آخر قراءة اسم الكاتب (وفاء الحسيني) والمصدر (سلسلة: ليلى ترسم وطنًا)، ويتصفح التلميذ النص بسرعة ويستخرج العنوان والكاتب والمصدر (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. بطاقة النص والتوقع: يكمل المعلم مع الطلاب بطاقة النص (العنوان، الكاتب، المتحدث)، ثم يطرح سؤال التوقع: من العنوان «ليلى ترسم وطنًا»: ماذا ستفعل ليلى في رأيك؟ ويدوّن التوقعات على السبورة، ويكمل التلميذ البطاقة ويكتب توقعه (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. القراءة النموذجية: يعرض المعلم النص على جهاز العرض ويقرؤه قراءة جهرية نموذجية معبرة مراعيًا علامات الترقيم ومستخدمًا المؤشر، ثم يطلب من الطلاب التحقق من توقعاتهم، ويتابع التلميذ القراءة النموذجية بالمؤشر ويقارن توقعه بمضمون النص (17 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة الجهرية الأولى: يكتب المعلم أهداف القراءة الجهرية، ثم يقرأ فقرة نموذجية ويطلب من الطلاب المجيدين ثم الأقل إجادة قراءة فقرات النص (ص43–45) بالتناوب، ويصحح الأخطاء بعد إتمام الجملة، ويقرأ التلميذ الفقرة المطلوبة قراءة جهرية صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. اكتشاف معاني المفردات: يعرض المعلم المفردات في بطاقات: منحنية (مائلة إلى الأمام)، عجائب (أشياء مدهشة غريبة)، تغوص (تنزل في أعماق الماء)، أعماق (الأماكن البعيدة في الأسفل)، الشوق (الحنين)، تأوي (تلجأ وتسكن)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (13 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص46–47) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: اختر الإجابة الصحيحة: هواية ليلى المفضلة: (الرسم / الطبخ / الغناء / السباحة)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (17 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (8 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الثالثة (تعدد القراءات): يوزع المعلم فقرات النص على المجموعات، ويسحب عود مثلجات باسم طالب ليقرأ الفقرة المحددة، ويستمر حتى نهاية النص، ويقرأ التلميذ الفقرة عند سحب اسمه ويتابع قراءة زملائه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. ترتيب الأحداث: يوزع المعلم بطاقات الأحداث على المجموعات ويطلب ترتيبها من (1) إلى (6) مستعينين بالنص (ص46–47)، ثم تعرض كل مجموعة ترتيبها، ويرتب التلميذ البطاقات مع مجموعته ويعلل الترتيب من النص (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. إعادة السرد: يطلب المعلم من طالبين إعادة سرد الأحداث المرتبة بأسلوبهما مستخدمين أدوات الربط (في البداية، ثم، بعد ذلك، وأخيرًا)، ويعيد التلميذ سرد الأحداث بأسلوبه (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n13. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص47–48) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (19 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n15. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: الوطن هو العش الذي نأوي إليه ونشتاق إليه دائمًا، ويختار التلميذ الفكرة الرئيسة ويعلل (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n16. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص49–50) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (9 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n18. محاكاة التعبير: يعرض المعلم التعبير: «لماذا أشعر بالشوق إلى البيت كلما غادرته؟» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «لماذا أشعر بالفرح كلما زرت جدتي؟»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n19. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n20. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص51) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. نمذجة القراءة المعبرة: يقرأ المعلم مقاطع الحوار والمواقف المؤثرة في النص بنبرات مختلفة، ويلفت إلى تلوين الصوت بحسب علامات الترقيم، ويستمع التلميذ ويحاكي القراءة المعبرة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n23. التدرب في المجموعات: يوزع المعلم أدوار الشخصيات (ليلى، الحصان الأبيض المجنح، السمكة الملونة، الجدة) والراوي على المجموعات ويمنحها وقتًا للتدرب، ويتدرب التلميذ مع مجموعته على أداء دوره (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n24. العرض والتقييم: تعرض كل مجموعة مشهدًا، ويقيّم الطلاب الأداء ببطاقة (الصوت، التعبير، الطلاقة)، ويمثل التلميذ دوره ويقيّم أداء المجموعات الأخرى (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n25. القراءة الصامتة: يوجه الطلاب إلى قراءة صامتة لنص قصير يعرضه أو لقصة اختاروها في موضوع: قصص عن حب الوطن والحنين إليه، ويقرأ التلميذ قراءة صامتة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n26. المقارنة والمشاركة: يطلب المعلم من كل ثنائي المقارنة بين ما قرأه ونص «ليلى ترسم وطنًا»: الشخصيات، المكان، العبرة، ويقارن التلميذ مع زميله ويعرض المقارنة (15 دقيقة)\nالاستراتيجيات: الفصل المقلوب.\n\n27. بطاقة القراءة: يوزع المعلم بطاقة قراءة بسيطة: عنوان القصة، شخصياتها، ما أعجبني، ما لم يعجبني، ويكمل التلميذ بطاقة القراءة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n28. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص52) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (البيت هو الوطن الصغير)، ويفصل التلميذ الكلمات ويعدها (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n29. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: البيت، ليلى، حصانًا، الوطن ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n30. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n31. محطات المراجعة: يوزع المجموعات على أربع محطات: محطة الفهم، محطة المفردات، محطة النمط اللغوي، محطة الإملاء، ويتنقل الطلاب بينها كل ثلاث دقائق ونصف، وينجز التلميذ مهمة كل محطة مع مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n32. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اختر الإجابة الصحيحة: الكلمة التي تنتهي بهاء: (وطنه / صغيرة / مرة / سمكة)» على السبورة، ويناقش المعلم الإجابات مع الصف (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n33. غلق الدرس – لوحة وطني الجماعية: يرسم كل فرد في المجموعة عنصرًا من عمان على ورقة صغيرة، فيرسم أحدهم العلم وآخر النخلة وثالث القلعة ورابع البحر، ثم تُجمع الأوراق لتكوين لوحة وطن واحدة يتحدث عنها الطلبة (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشروع.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كاتبة نص «ليلى ترسم وطنًا»: (زهران القاسمي / عبدالله الدنان / نزار نجار / وفاء الحسيني)\nالإجابة: وفاء الحسيني.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: صفة ليلى كما تظهر في النص: (غاضبة / موهوبة محبة لوطنها / كسولة / خائفة دائمًا)\nالإجابة: موهوبة محبة لوطنها.\n\nس3 (مستوى الاستدلال): رتب أحداث النص ترتيبًا صحيحًا.\nالإجابة: (1) تقضي ليلى أوقات فراغها في الرسم والتلوين، (2) رسمت ليلى حصانًا أبيض له جناحان وطارت به إلى بلاد العالم، (3) أخبرت ليلى الحصان أنها تريد العودة إلى الوطن ففعل، (4) رسمت ليلى سمكة ملونة غاصت بها في أعماق البحار، (5) أحست بالتعب فرجت السمكة أن تعيدها إلى البيت، (6) سألت ليلى جدتها عن سبب شوقها إلى البيت فأجابتها: إنه الوطن.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى عناصر صورة «ليلى ترسم وطنًا» واحدًا واحدًا: ليلى، الحصان الأبيض، جناحاه، البلدان، ويقول التلميذ جملة عن كل عنصر؛ وللتحقق يسأله: ما الحيوان الذي تركبه ليلى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم وطنهم كما رسمت ليلى وطنها، ثم يتخيلون أنهم يطيرون على الحصان المجنح ويصفون في ثلاث جمل بلدًا زاروه ويقارنونه بوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: طلبت ليلى من السمكة أن: (ترسم معها / تغوص بها في أعماق البحار / تطير بها / تحملها إلى المدرسة)\nالإجابة: تغوص بها في أعماق البحار.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: العبرة من النص: (البيت لا قيمة له / الرسم أهم من الوطن / نحب الوطن ونشتاق إليه أينما كنا / نسافر ولا نعود)\nالإجابة: نحب الوطن ونشتاق إليه أينما كنا.\n\nس3 (مستوى الاستدلال): بماذا تشعر عندما تسافر بعيدًا عن وطنك؟\nالإجابة: أشعر بالشوق إلى أهلي وبيتي ووطني.", "- للطالب: قراءة نص «ليلى ترسم وطنًا» ص43–45 قراءة صامتة مرة واحدة على الأقل؛ قراءة النص ص43–45 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة؛ إكمال أنشطة خطوتي الأولى ص46–47 وقراءة النص مرة أخرى؛ إعادة سرد أحداث نص «ليلى ترسم وطنًا» مرتبة أمام الأسرة؛ حل أنشطة خطوتي الثانية ص47–48 في الكتاب؛ كتابة جملتين تحاكي التعبير «لماذا أشعر بالشوق إلى البيت كلما غادرته؟» وحل أنشطة ص49–50؛ كتابة رأيه في إحدى شخصيات نص «ليلى ترسم وطنًا» في سطرين؛ التدرب على قراءة النص قراءة معبرة وتمثيل مشهد منه مع الأسرة؛ قراءة قصة قصيرة من مكتبة البيت أو مركز مصادر التعلم وإكمال بطاقة القراءة؛ حل أنشطة التحليل والتركيب ص52؛ مراجعة نص «ليلى ترسم وطنًا» وأنشطته كاملة والتدرب على ما يحتاج إلى تدريب.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة؛ الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف؛ سؤال ابنه عن شخصيات النص ومكان أحداثه؛ الاستماع إلى سرد ابنه ومساعدته على استخدام أدوات الربط؛ سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «ليلى ترسم وطنًا» ولماذا؛ مناقشة ابنه في العبرة من النص وكيف يطبقها؛ مناقشة ابنه في رأيه بالنص وتعليله؛ مشاركة ابنه تمثيل مشهد من النص وتشجيعه؛ تخصيص عشر دقائق يوميًا لقراءة قصة مع ابنه؛ لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت؛ الاطلاع على بطاقة التقويم الذاتي ومساعدة ابنه في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=12"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: تحويل الجملة الفعلية إلى اسمية والعكس (التعرف والمحاكاة)", "النمط اللغوي: تحويل الجملة الفعلية إلى اسمية والعكس (التطبيق وأنشطة الكتاب)", "تدريبات إضافية على تحويل الجملة الفعلية إلى اسمية والعكس (توظيف في التحدث والكتابة)"], "w": "الأسبوع الحادي عشر: 15–19/11/2026م", "f": ["1. يتعرف تحويل الجملة الفعلية إلى اسمية والعكس من خلال أمثلة من النص (15 دقيقة)\n2. يحاكي تحويل الجملة الفعلية إلى اسمية والعكس في جمل جديدة (10 دقائق)\n3. يطبق تحويل الجملة الفعلية إلى اسمية والعكس في أنشطة الكتاب (20 دقيقة)\n4. يميز تحويل الجملة الفعلية إلى اسمية والعكس في جمل معروضة (5 دقائق)\n5. يوظف تحويل الجملة الفعلية إلى اسمية والعكس في التحدث عن صور ومواقف (10 دقائق)\n6. يكتب جملًا صحيحة موظفًا تحويل الجملة الفعلية إلى اسمية والعكس (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (15 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)\n- يقيّم جمل زملائه من حيث صحة توظيف النمط (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج 5: تطبيق\nالمخرج 6: إبداع\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني\n8. التعلم التشاركي\n9. تعلم الأقران", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل\n4. أخرى: السبورات الشخصية (الصغيرة)\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. تحويل الجملة الفعلية إلى اسمية والعكس\n2. الجملة الفعلية\n3. الجملة الاسمية", "يعرض المعلم بطاقتي (طار الحصان) و(الحصان طار) ويسأل: ما الذي تغير؟ ويلاحظ التلميذ تقديم الاسم أو الفعل (5 دقائق)", "1. اكتشاف النمط: يعرض المعلم جملًا من النص: رسمت ليلى حصانًا ← ليلى رسمت حصانًا، ركبت ليلى الحصان ← ليلى ركبت الحصان، حقّقت السمكة حلم ليلى ← السمكة حقّقت حلم ليلى، أحسّت ليلى بالتعب ← ليلى أحسّت بالتعب، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: الجملة الفعلية تبدأ بفعل (رسمت ليلى حصانًا)، ونحولها إلى اسمية بتقديم الاسم (ليلى رسمت حصانًا)، ونحول الاسمية إلى فعلية بتقديم الفعل، ويلاحظ التلميذ الأمثلة ويستنتج النمط (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المحاكاة: يعرض المعلم بطاقتين: (رسمت ليلى حصانًا) و(ليلى رسمت حصانًا) ويسأل: ما الفرق؟ بماذا بدأت كل جملة؟ ثم يطلب تحويل جمل قصيرة بنقل البطاقات، ويحاكي التلميذ النمط في جمل جديدة على سبورته (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص53–54) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: حلّ المساء ← المساء حلّ، طار الحصان ← الحصان طار، ليلى تحب الرسم ← تحب ليلى الرسم، الجدة أجابت ← أجابت الجدة، ويذكر التلميذ أمثلة جديدة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم أنشطة الكتاب: إكمال البطاقات وفق النموذج (تحويل الجملة)، ثم إنشاء بطاقات خاصة، وترتيب البطاقات لتكوين جمل مفيدة (ص53–54)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n7. التحدث بالنمط: يعرض المعلم صورًا من رحلات ليلى ويطلب وصف كل صورة بجملة فعلية ثم تحويلها إلى اسمية شفويًا، ويتحدث التلميذ موظفًا النمط (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الكتابة بالنمط: يطلب المعلم كتابة ثلاث جمل عن موضوع الدرس موظفين تحويل الجملة الفعلية إلى اسمية والعكس، ويتبادلون الدفاتر للتقييم، ويكتب التلميذ ثلاث جمل ويقيّم جمل زميله (13 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n9. تصحيح جماعي: يعرض المعلم جملًا مختارة من كتابات الطلاب ويصحح معهم الأخطاء الشائعة، ويشارك التلميذ في التصحيح (9 دقائق)\nالاستراتيجيات: المحاكاة.\n\n10. غلق الدرس – بدّل مكانك: يحمل طالبان بطاقتين لجملة عن عمان مثل (يرفرف العلم)، فيقرأ الصف الجملة فعلية، ثم يتبادلان مكانيهما فيقرؤها اسمية (العلم يرفرف)، وتتسابق المجموعات في تكوين جملة عن معلم عماني تحبه وتحويلها بالطريقة نفسها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: حوّل إلى اسمية: (رسمت ليلى حصانًا): (ليلى رسمت حصانًا / حصانًا رسمت / رسمت حصانًا / رسمت ليلى)\nالإجابة: ليلى رسمت حصانًا.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حوّل إلى فعلية: (الحصان طار بليلى): (الحصان بليلى / طار الحصان بليلى / ليلى طار الحصان / طار بليلى)\nالإجابة: طار الحصان بليلى.\n\nس3 (مستوى الاستدلال): صف صورة الحصان بجملة فعلية ثم حولها إلى اسمية.\nالإجابة: طار الحصان بليلى ← الحصان طار بليلى.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى عناصر صورة «ليلى ترسم وطنًا» واحدًا واحدًا: ليلى، الحصان الأبيض، جناحاه، البلدان، ويقول التلميذ جملة عن كل عنصر؛ وللتحقق يسأله: ما الحيوان الذي تركبه ليلى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم وطنهم كما رسمت ليلى وطنها، ثم يتخيلون أنهم يطيرون على الحصان المجنح ويصفون في ثلاث جمل بلدًا زاروه ويقارنونه بوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: حوّل إلى فعلية: (ليلى أحست بالتعب): (التعب ليلى / أحست بالتعب ليلى ليلى / ليلى بالتعب / أحست ليلى بالتعب)\nالإجابة: أحست ليلى بالتعب.\n\nس2 (مستوى التطبيق): صواب أم خطأ: جملة (السمكة حققت حلم ليلى) جملة اسمية.\nالإجابة: صواب.\n\nس3 (مستوى الاستدلال): اكتب جملتين عن وطنك: فعلية واسمية.\nالإجابة: أحب وطني عمان، عمان بلد جميل.", "- للطالب: حل أنشطة النمط اللغوي ص53–54 وكتابة جملتين موظفًا تحويل الجملة الفعلية إلى اسمية والعكس؛ كتابة فقرة قصيرة من ثلاث جمل موظفًا تحويل الجملة الفعلية إلى اسمية والعكس.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=12"]}, {"k": "الإملاء", "p": ["النمط الإملائي: التاء المربوطة والهاء في آخر الكلمة (الملاحظة والتصنيف)", "النمط الإملائي: التاء المربوطة والهاء في آخر الكلمة (التطبيق والإملاء المنقول)", "تدريبات إضافية وإملاء منظور على التاء المربوطة والهاء في آخر الكلمة"], "w": "الأسبوع الحادي عشر: 15–19/11/2026م", "f": ["1. يلاحظ التاء المربوطة والهاء في آخر الكلمة في كلمات من النص (15 دقيقة)\n2. يصنف كلمات وفق التاء المربوطة والهاء في آخر الكلمة (10 دقائق)\n3. يكتب كلمات تتضمن التاء المربوطة والهاء في آخر الكلمة كتابة صحيحة (10 دقائق)\n4. يكتب إملاءً منقولًا بخط واضح (20 دقيقة)\n5. يكتب إملاءً منظورًا يتضمن التاء المربوطة والهاء في آخر الكلمة كتابة صحيحة (20 دقيقة)\n6. يصحح أخطاءه الإملائية ذاتيًا (5 دقائق)\n\nمخرج تعليمي آخر:\n- يذكر أمثلة جديدة من خارج النص (15 دقيقة)\n- يميز الخطأ الإملائي في كلمة ويصححه (10 دقائق)\n- يكتشف أخطاء زميله ويصوبها (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة\n6. السؤال والجواب\n7. تعلم الأقران\n8. التقويم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل\n4. أخرى: السبورات الشخصية (الصغيرة)\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التاء المربوطة والهاء في آخر الكلمة\n2. الوصل والوقف\n3. آخر الكلمة", "ينطق المعلم (سمكةٌ صغيرةٌ) بالوصل ثم بالوقف، و(بيته) في الحالتين، ويلاحظ التلميذ تغير نطق التاء المربوطة وثبات الهاء (5 دقائق)", "1. ملاحظة الظاهرة: يعرض المعلم جملًا من النص فيها كلمات ملونة: البيت، وطنه، مرة، صغيرة، فيه، بيده، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: التاء المربوطة (ة/ـة) تُنطق تاء عند الوصل وهاء عند الوقف (مرّة)، أما الهاء (ه/ـه) فتُنطق هاء دائمًا (وطنه)، ونعرفها بوصل الكلمة بما بعدها، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التصنيف: يعرض المعلم فقرة الجدة ويطلب استخراج الكلمات التي تنتهي بالهاء (دونه، إليه، فيه، إنه) ثم مقارنتها بكلمات تنتهي بتاء مربوطة (مرة، صغيرة، سمكة) (ص55)، ويصنف التلميذ الكلمات في الجدول (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أنشطة الكتاب: يطلب المعلم إكمال العبارة بكلمات تنتهي بـ(ـه/ه) أو (ـة/ة) مستعينًا بالصندوق (رفعه، بيده، مرة، وطنه، أسامة، فيه، لونه، صغيرة) (ص55)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (14 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n6. الإملاء المنقول: يكتب المعلم على السبورة: «رسمت ليلى سمكة صغيرة ملونة، وطلبت منها رحلة إلى أعماق البحر.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n7. عرض فقرة الإملاء المنظور: يعرض المعلم الفقرة: «البيت يا بنيتي هو الوطن الصغير، نشتاق إليه دائمًا، ونشعر فيه بالأمان.» ويقرؤها ويناقش كلماتها الصعبة ثم يحجبها، ويقرأ التلميذ الفقرة ويتأمل كلماتها الصعبة (9 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n8. الإملاء المنظور: يملي المعلم الفقرة كلمة كلمة بتأنٍّ مع مراعاة الفروق الفردية، ويكتب التلميذ الفقرة إملاءً (13 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n9. التصحيح الذاتي والتبادلي: يعيد المعلم عرض الفقرة ويطلب من كل طالب تصحيح دفتر زميله ووضع دائرة حول الخطأ، ثم يكتب كل طالب أخطاءه صحيحة ثلاث مرات، ويصحح التلميذ دفتر زميله ثم يصوب أخطاءه (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – سلتا الوطن: تتسابق المجموعات في وضع بطاقات كلمات من بيئة عمان في سلتين (ة) و(ه)، مثل: قلعة، نخلة، قرية، بلاده، وطنه، علمه، ثم تقرأ كل مجموعة جملة تجمع كلمتين منها عن حبها لعمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: آخر كلمة (مرة): (هاء / تاء مربوطة)\nالإجابة: تاء مربوطة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: آخر كلمة (لونه): (هاء / تاء مربوطة)\nالإجابة: هاء.\n\nس3 (مستوى الاستدلال): اكتب جملة فيها كلمة تنتهي بهاء وأخرى بتاء مربوطة.\nالإجابة: مثل: رفع أخي لوحته في الرحلة.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى عناصر صورة «ليلى ترسم وطنًا» واحدًا واحدًا: ليلى، الحصان الأبيض، جناحاه، البلدان، ويقول التلميذ جملة عن كل عنصر؛ وللتحقق يسأله: ما الحيوان الذي تركبه ليلى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم وطنهم كما رسمت ليلى وطنها، ثم يتخيلون أنهم يطيرون على الحصان المجنح ويصفون في ثلاث جمل بلدًا زاروه ويقارنونه بوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: آخر كلمة (عنه): (تاء مربوطة / هاء)\nالإجابة: هاء.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: آخر كلمة (إليه): (تاء مربوطة / هاء)\nالإجابة: هاء.\n\nس3 (مستوى الاستدلال): كيف تفرق بين (مرة) و(وطنه)؟\nالإجابة: نصل الكلمة بما بعدها: (مرةً واحدة) تُنطق تاء، و(وطنُه جميل) تبقى هاء.", "- للطالب: حل أنشطة النمط الإملائي ص55 وكتابة خمس كلمات تمثل التاء المربوطة والهاء في آخر الكلمة؛ إعادة كتابة كلمات الإملاء التي أخطأ فيها ثلاث مرات.\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=12"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (ف ق) بخط النسخ"], "w": "الأسبوع الثاني عشر: 22–24/11/2026م", "f": ["1. يكتب الحروف (ف ق) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (10 دقائق)\n2. يكتب الكلمات والجملة: «البيت هو العش الدافئ الذي نشتاق إليه دائمًا.» محاكيًا النموذج (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (ف ق) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (مفضلة، لتكشف، تقضي، تحقق) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص56) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «البيت هو العش الدافئ الذي نشتاق إليه دائمًا.» ويختار أجود خط ليعلق في لوحة الصف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – ركن وطني في خطي: تكتب كل مجموعة على بطاقة كبيرة كلمة من بيئة عمان فيها الفاء أو القاف (قلعة، قرية، فلج) بخط النسخ، وتتسابق في التناسق والتأني، ثم تعلق البطاقات في ركن «وطني في خطي» ويقول كل طالب جملة عن الكلمة التي كتبها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف الذي فوقه نقطتان: (ف / ق / ع / غ)\nالإجابة: ق.\n\nس2 (مستوى التطبيق): أي الكلمات فيها حرف الفاء؟ (تقضي / البيت / مفضلة / تحقق)\nالإجابة: مفضلة.\n\nس3 (مستوى الاستدلال): اكتب كلمة فيها فاء وأخرى فيها قاف.\nالإجابة: مثل: فراشة، قمر.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى عناصر صورة «ليلى ترسم وطنًا» واحدًا واحدًا: ليلى، الحصان الأبيض، جناحاه، البلدان، ويقول التلميذ جملة عن كل عنصر؛ وللتحقق يسأله: ما الحيوان الذي تركبه ليلى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم وطنهم كما رسمت ليلى وطنها، ثم يتخيلون أنهم يطيرون على الحصان المجنح ويصفون في ثلاث جمل بلدًا زاروه ويقارنونه بوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الفرق بين الفاء والقاف في الكتابة المنفردة: (الفاء ينزل تحت السطر / القاف ينزل تحت السطر والفاء على السطر / القاف بلا نقاط / لا فرق)\nالإجابة: القاف ينزل تحت السطر والفاء على السطر.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: كلمة فيها قافان: (تحقق / مفضلة / تقضي / لتكشف)\nالإجابة: تحقق.\n\nس3 (مستوى الاستدلال): اكتب الجملة (البيت هو العش الدافئ الذي نشتاق إليه دائمًا.) بخط النسخ.\nالإجابة: كتابة الجملة بحروف متناسقة على السطر.", "- للطالب: إكمال صفحة الخط ص56 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=12"]}, {"k": "التعبير", "p": ["التعبير الكتابي: ترتيب مقاطع لتكوين قصة قصيرة (صندوق الجدة) (الإعداد والتخطيط)", "التعبير الكتابي: ترتيب مقاطع لتكوين قصة قصيرة (صندوق الجدة) (الكتابة والمراجعة)"], "w": "الأسبوع الثاني عشر: 22–24/11/2026م", "f": ["1. يرتب الأفكار والأحداث للكتابة في: ترتيب مقاطع لتكوين قصة قصيرة (صندوق الجدة) (25 دقيقة)\n2. يتحدث شفويًا عن موضوع الكتابة في درس «ليلى ترسم وطنًا» بجمل مترابطة (5 دقائق)\n3. يكتب ترتيب مقاطع لتكوين قصة قصيرة (صندوق الجدة) بجمل مترابطة (20 دقيقة)\n4. يراعي علامات الترقيم والنظافة في كتابته (5 دقائق)\n\nمخرج تعليمي آخر:\n- يتحدث عن الصور بجمل سليمة قبل الكتابة (10 دقائق)\n- يقيّم كتابته وكتابة زميله ويحسنها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التعلم الذاتي\n5. تعلم الأقران\n6. التقويم الذاتي\n7. التعلم المبني على المشاريع", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التعبير الكتابي\n2. ترتيب الأفكار\n3. علامات الترقيم", "يعرض المعلم صندوقًا خشبيًا قديمًا ويسأل: ماذا يمكن أن يكون بداخله؟ ويتوقع التلميذ ما في الصندوق (5 دقائق)", "1. التمهيد بالأسئلة: يطرح المعلم أسئلة ممهدة: هل تحتفظ أسرتك بأشياء قديمة؟ ماذا يوجد في صندوق جدتك؟ لماذا نحافظ على التراث؟ ويجيب التلميذ ويستدعي خبرته (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. تأمل الصور والجمل: يعرض المعلم المشاهد الثلاثة (ليلى أمام صندوق جدتها، الجدة تفتح الصندوق، ما في داخله: خنجر وعلم عمان مطوي بعناية وملابس تقليدية) ويناقش ترتيبها (ص57)، ويتأمل التلميذ الصور ويتحدث عنها مع مجموعته (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط الشفوي: يطلب المعلم من كل مجموعة ترتيب الأفكار شفويًا (البداية، الأحداث، النهاية) وعرضها، ويرتب التلميذ الأفكار ويعرضها شفويًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مراجعة الخطة: يراجع المعلم مع الطلاب الأفكار المرتبة ويكتب كلمات مساعدة على السبورة، ويراجع التلميذ خطته (6 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n5. الكتابة الفردية: يطلب المعلم ترتيب المقاطع لتوافق ترتيب المشاهد، ثم إعادة كتابتها للحصول على قصة قصيرة بعنوان «صندوق الجدة» (ص57)، ويمر بين الطلاب ويوجههم، ويكتب التلميذ في كتابه مراعيًا الترتيب وعلامات الترقيم (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n6. المراجعة والعرض: يطلب المعلم من بعض الطلاب قراءة ما كتبوه ويناقش مع الصف جوانب التميز والتحسين، ويطلب تصويب الأخطاء، ويقرأ التلميذ ما كتبه ويصوب أخطاءه (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – كنز من صندوق الجدة: يخرج المعلم من صندوق صغير بطاقات بصور من التراث العماني (الخنجر، علم عمان، الملابس التقليدية)، فتسحب كل مجموعة بطاقة وتكتب عنها جملتين مترابطتين وتقرؤهما، ثم يردد الطلاب معًا: «نحافظ على تراث عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: جلست ليلى أمام صندوق: (معلمتها / صديقتها / أمها / جدتها)\nالإجابة: جدتها.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: عنوان القصة: (الحصان الطائر / البحر الكبير / الكرة / صندوق الجدة)\nالإجابة: صندوق الجدة.\n\nس3 (مستوى الاستدلال): اكتب قصة «صندوق الجدة» في أربع جمل مرتبة.\nالإجابة: مثل: جلست ليلى أمام صندوق جدتها القديم تتخيل ما بداخله. دخلت الجدة فسألتها ليلى عما تخفيه. فتحت الجدة الصندوق وأرتها خنجرًا وعلمًا وملابس تقليدية. فرحت ليلى ووعدت أن تحافظ عليها.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى عناصر صورة «ليلى ترسم وطنًا» واحدًا واحدًا: ليلى، الحصان الأبيض، جناحاه، البلدان، ويقول التلميذ جملة عن كل عنصر؛ وللتحقق يسأله: ما الحيوان الذي تركبه ليلى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم وطنهم كما رسمت ليلى وطنها، ثم يتخيلون أنهم يطيرون على الحصان المجنح ويصفون في ثلاث جمل بلدًا زاروه ويقارنونه بوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): فتحت الجدة الصندوق، .... أرتها ما بداخله. (ثم / هل / تحت)\nالإجابة: ثم.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: أول مقطع في القصة: (ردت ليلى الصندوق / نامت ليلى / فتحت الجدة الصندوق / جلست ليلى أمام صندوق جدتها القديم تتخيل ما بداخله)\nالإجابة: جلست ليلى أمام صندوق جدتها القديم تتخيل ما بداخله.\n\nس3 (مستوى الاستدلال): لماذا تحتفظ الجدة بهذه الأشياء؟\nالإجابة: لأنها تراث وذكريات تعبر عن حب الوطن.", "- للطالب: التحدث مع الأسرة عن الصور ص57 وترتيب أحداثها؛ إكمال نشاط التعبير الكتابي ص57 وقراءته على الأسرة.\n- لولي الأمر: الاستماع إلى ابنه وهو يقرأ ما كتبه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=12"]}]}, {"t": "البحر يتسع للجميع", "u": "المحور الثاني: وطني", "s": [{"k": "التحدث", "p": ["التحدث عن لوحة المحادثة والتمهيد لدرس «البحر يتسع للجميع»"], "w": "الأسبوع الثاني عشر: 22–24/11/2026م", "f": ["1. يتحدث عن مضمون لوحة المحادثة في درس «البحر يتسع للجميع» بلغة سليمة وجمل مكتملة (10 دقائق)\n2. يجيب عن أسئلة اللوحة مثل: تأمل الصورة، ثم صف العلاقة بين الأسماك الصغيرة والأسماك الكبيرة (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يُعدّ سؤالًا إضافيًا عن اللوحة ويطرحه على زملائه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. جهاز عرض البيانات", "1. الوطن يتسع لنا جميعًا وإن كنا مختلفين\n2. الوطن لا يقدر بثمن\n3. التشاور", "يسأل المعلم: ماذا يوجد في البحر؟ هل البحر يتسع للجميع؟ ثم يخبرهم أن درس اليوم عن مكان تعيش فيه كائنات حية، ويذكر التلميذ كائنات البحر ويتوقع موضوع الدرس (5 دقائق)", "1. أشاهد وأتحدث: يعرض المعلم لوحة المحادثة (ص58) ويترك للطلاب فرصة لتأملها ثم يسأل: ماذا تشاهدون؟ ويطرح أسئلة اللوحة: تأمل الصورة، ثم صف العلاقة بين الأسماك الصغيرة والأسماك الكبيرة.، ماذا يوجد في البحر؟، هل يتسع البحر للجميع؟، ويساعدهم في صياغة جمل مكتملة، ويتأمل التلميذ اللوحة ويجيب بجمل مكتملة ويربطها بخبرته (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أفضل سؤال: يطلب
