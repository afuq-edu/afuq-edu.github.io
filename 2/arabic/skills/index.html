المعلم من كل مجموعة إعداد سؤال إضافي عن اللوحة يطرحه منسقها على المجموعات الأخرى، ويختار أفضل سؤال وأفضل إجابة، ويعد التلميذ سؤالًا مع مجموعته ويجيب عن أسئلة المجموعات الأخرى (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التحدث الفردي: يطلب المعلم من بعض الطلاب التحدث في ثلاث جمل عن: حياة الكائنات في البحر وكيف تعيش معًا، ويعزز اللغة السليمة وآداب التحدث، ويتحدث التلميذ أمام زملائه في ثلاث جمل مترابطة (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – بحر عمان يتسع لنا: يقف الطلاب في دائرة كأنهم أسماك في بحر عمان، ويمرر المعلم كرة صغيرة، فيقول من تصله جملة مكتملة عن كائن يعيش في بحر عمان أو عن تعاون الناس في وطننا، ويختار الصف أجمل جملة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: العلاقة بين الأسماك الصغيرة والكبيرة في الصورة: (لا علاقة بينها / تلعب معًا / الصغيرة تطارد الكبيرة / الكبيرة تطارد الصغيرة)\nالإجابة: الكبيرة تطارد الصغيرة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: من الكائنات التي تعيش في البحر: (الأسماك والحيتان والسلاحف / الجمال / العصافير / الأسود)\nالإجابة: الأسماك والحيتان والسلاحف.\n\nس3 (مستوى الاستدلال): صف العلاقة بين الأسماك الصغيرة والكبيرة في الصورة.\nالإجابة: الأسماك الكبيرة تطارد الأسماك الصغيرة وتعتدي عليها.\n\n• نشاط علاجي (لمن لم يتقن): يحرك المعلم أمام التلميذ أسماكًا كبيرة وصغيرة من الورق ليمثّل مطاردة الكبيرة للصغيرة، ثم يصنف معه صور كائنات البحر وغيرها؛ وللتحقق يسأله: من يطارد من في الصورة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح نهاية للصورة تعيش فيها الأسماك الكبيرة والصغيرة بسلام، وتفسير عنوان «البحر يتسع للجميع» بجملتين، وربطه بالتعايش بين الناس.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: البحر بالنسبة للأسماك: (وطن / سجن / مدرسة / صحراء)\nالإجابة: وطن.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: يتسع البحر لكائنات: (مختلفة الأحجام والألوان / لونها واحد / كبيرة فقط / صغيرة فقط)\nالإجابة: مختلفة الأحجام والألوان.\n\nس3 (مستوى الاستدلال): تحدث في ثلاث جمل: هل يتسع البحر للجميع؟\nالإجابة: ن ائق)\n10. يقرأ الفقرات المرتبطة بالأسئلة قراءة جهرية صحيحة (20 دقيقة)\n11. يستخلص العبرة من نص «البحر يتسع للجميع» ويحدد نوعه (15 دقيقة)\n12. يقترح عنوانًا آخر مناسبًا للنص (10 دقائق)\n13. يبدي رأيه في تصرفات الأسماك الصغيرة ويعلل رأيه (15 دقيقة)\n14. يقرأ جمل النص قراءة جهرية معبرة في نشاط تنافسي (15 دقيقة)\n15. يقرأ نص «البحر يتسع للجميع» قراءة معبرة تظهر انفعالات الشخصيات (10 دقائق)\n16. يمثل أدوار الشخصيات (الأسماك الصغيرة، الأسماك الكبيرة، الصياد) بلغة سليمة (15 دقيقة)\n17. يقرأ نصًا قصيرًا في موضوع (قصص على لسان الحيوان عن حب الوطن) قراءة صحيحة (15 دقيقة)\n18. يقارن بين النص الإثرائي ونص «البحر يتسع للجميع» (10 دقائق)\n19. يحلل الجمل إلى كلمات ويحدد عددها (10 دقائق)\n20. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (15 دقيقة)\n21. يجيب عن أسئلة متنوعة تقيس فهم النص والمفردات (15 دقيقة)\n22. يوظف نمطي الدرس (العدد (من 3 إلى 10)، علامات الترقيم (النقطة، الفاصلة، النقطتان)) في جمل صحيحة (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (10 دقائق)\n- يعيد سرد مضمون النص بأسلوبه (15 دقيقة)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «لكنّ الأسماك الصغيرة سرعان ما اختلفت.» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يقيّم أداء زملائه وفق معايير بسيطة (الصوت، التعبير، الطلاقة) (15 دقيقة)\n- يبدي رأيه فيما قرأ ويعرضه على زملائه (15 دقيقة)\n- يركب من البطاقات جملًا بحسب عدد الكلمات المطلوب (15 دقيقة)\n- يحدد ما أتقنه وما يحتاج إلى تدريب في الدرس (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج 13: تقييم\nالمخرج 14: تطبيق\nالمخرج 15: تطبيق\nالمخرج 16: تطبيق\nالمخرج 17: تطبيق\nالمخرج 18: تحليل\nالمخرج 19: تحليل\nالمخرج 20: تطبيق\nالمخرج 21: فهم\nالمخرج 22: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\ عنوان «البحر يتسع للجميع»: من سيتسع لهم البحر؟ ويدوّن التوقعات على السبورة، ويكمل التلميذ البطاقة ويكتب توقعه (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. القراءة النموذجية: يعرض المعلم النص على جهاز العرض ويقرؤه قراءة جهرية نموذجية معبرة مراعيًا علامات الترقيم ومستخدمًا المؤشر، ثم يطلب من الطلاب التحقق من توقعاتهم، ويتابع التلميذ القراءة النموذجية بالمؤشر ويقارن توقعه بمضمون النص (17 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة الجهرية الأولى: يكتب المعلم أهداف القراءة الجهرية، ثم يقرأ فقرة نموذجية ويطلب من الطلاب المجيدين ثم الأقل إجادة قراءة فقرات النص (ص60–62) بالتناوب، ويصحح الأخطاء بعد إتمام الجملة، ويقرأ التلميذ الفقرة المطلوبة قراءة جهرية صحيحة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. اكتشاف معاني المفردات: يعرض المعلم المفردات في بطاقات: تشاورت (تبادلت الرأي)، مطاردة (ملاحقة)، تفاوض (تتحاور للوصول إلى اتفاق)، تنازل (ترك ما يملك لغيره)، ذليلًا (ضعيفًا مهانًا)، تنعم (تعيش في خير وسعادة)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (13 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص63–64) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: اختر الإجابة الصحيحة: عقدت الأسماك الصغيرة اجتماعًا بسبب: (مطاردة الأسماك الكبيرة لها / تلوث مياه البحر / قلة الطعام / اعتداء الصيادين)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (17 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (7 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الثالثة (تعدد القراءات): يوزع المعلم فقرات النص على المجموعات، ويسحب عود مثلجات باسم طالب ليقرأ الفقرة المحددة، ويستمر حتى نهاية النص، ويقرأ التلميذ الفقرة عند سحب اسمه ويتابع قراءة زملائه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. ترتيب الأحداث: يوزع المعلم بطاقات الأحداث على المجموعات ويطلب ترتيبها من (1) إلى (5) مستعينين بالنص (ص63–64)، ثم تعرض كل مجموعة ترتيبها، ويرتب التلميذ البطاقات مع مجموعته ويعلل الترتيب من النص (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. إعادة السرد: يطلب المعلم من طالبين إعادة سرد الأحداث المرتبة بأسلوبهما مستخدمين أدوات الربط (في البداية، ثم، بعد ذلك، وأخيرًا)، ويعيد التلميذ سرد الأحداث بأسلوبه (9 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n13. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص64–65) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (18 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n15. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: حق الأسماك الصغيرة أن تعيش في وطنها البحر الذي يتسع للجميع، ويختار التلميذ الفكرة الرئيسة ويعلل (7 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n16. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص66–68) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (9 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n18. محاكاة التعبير: يعرض المعلم التعبير: «لكنّ الأسماك الصغيرة سرعان ما اختلفت.» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «لكنّ الأطفال سرعان ما اتفقوا.»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n19. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n20. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص69) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. نمذجة القراءة المعبرة: يقرأ المعلم مقاطع الحوار والمواقف المؤثرة في النص بنبرات مختلفة، ويلفت إلى تلوين الصوت بحسب علامات الترقيم، ويستمع التلميذ ويحاكي القراءة المعبرة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n23. التدرب في المجموعات: يوزع المعلم أدوار الشخصيات (الأسماك الصغيرة، الأسماك الكبيرة، الصياد) والراوي على المجموعات ويمنحها وقتًا للتدرب، ويتدرب التلميذ مع مجموعته على أداء دوره (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n24. العرض والتقييم: تعرض كل مجموعة مشهدًا، ويقيّم الطلاب الأداء ببطاقة (الصوت، التعبير، الطلاقة)، ويمثل التلميذ دوره ويقيّم أداء المجموعات الأخرى (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n25. القراءة الصامتة: يوجه الطلاب إلى قراءة صامتة لنص قصير يعرضه أو لقصة اختاروها في موضوع: قصص على لسان الحيوان عن حب الوطن، ويقرأ التلميذ قراءة صامتة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n26. المقارنة والمشاركة: يطلب المعلم من كل ثنائي المقارنة بين ما قرأه ونص «البحر يتسع للجميع»: الشخصيات، المكان، العبرة، ويقارن التلميذ مع زميله ويعرض المقارنة (15 دقيقة)\nالاستراتيجيات: الفصل المقلوب.\n\n27. بطاقة القراءة: يوزع المعلم بطاقة قراءة بسيطة: عنوان القصة، شخصياتها، ما أعجبني، ما لم يعجبني، ويكمل التلميذ بطاقة القراءة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n28. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص70) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (البحر يتسع للجميع)، ويفصل التلميذ الكلمات ويعدها (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n29. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: البحر، أسماك، الصياد، مجموعة ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n30. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n31. محطات المراجعة: يوزع المجموعات على أربع محطات: محطة الفهم، محطة المفردات، محطة النمط اللغوي، محطة الإملاء، ويتنقل الطلاب بينها كل ثلاث دقائق ونصف، وينجز التلميذ مهمة كل محطة مع مجموعته (20 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n32. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «اختر الإجابة الصحيحة: اكتب العدد بالحروف: (9) سمكات: (تسعة / سبع / تسع / ست)»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n33. غلق الدرس – البحر وطننا: يقرأ المعلم مواقف قصيرة، فإن عبّر الموقف عن التمسك بالوطن والمحافظة عليه (مثل: أحافظ على شاطئ بلادي نظيفًا) رفعت المجموعات بطاقة «البحر وطننا»، وإن لم يعبّر عنه جلست، ثم تقرأ كل مجموعة قول المجموعة الثالثة «البحر وطننا وسنبقى فيه» قراءة معبرة بحزم (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كاتب نص «البحر يتسع للجميع»: (نزار نجار / وفاء الحسيني / زهران القاسمي / عبدالله الدنان)\nالإجابة: عبدالله الدنان.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: سبب نجاة المجموعة الثالثة: (تمسكها بوطنها البحر / تفاوضها / هروبها / اختباؤها عند الصياد)\nالإجابة: تمسكها بوطنها البحر.\n\nس3 (مستوى الاستدلال): ما رأيك في مغادرة المجموعة الأولى البحر هربًا من الأسماك الكبيرة؟\nالإجابة: تصرف خاطئ؛ لأنها تركت وطنها فتعرضت للخطر والصيد.\n\n• نشاط علاجي (لمن لم يتقن): يحرك المعلم أمام التلميذ أسماكًا كبيرة وصغيرة من الورق ليمثّل مطاردة الكبيرة للصغيرة، ثم يصنف معه صور كائنات البحر وغيرها؛ وللتحقق يسأله: من يطارد من في الصورة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح نهاية للصورة تعيش فيها الأسماك الكبيرة والصغيرة بسلام، وتفسير عنوان «البحر يتسع للجميع» بجملتين، وربطه بالتعايش بين الناس.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: قررت المجموعة الأولى: (التفاوض / البقاء / مغادرة البحر / محاربة الصياد)\nالإجابة: مغادرة البحر.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: تعيش المجموعة الثالثة بين أسماك: (صغيرة فقط / كبيرة فقط / لونها أحمر فقط / مختلفة الأحجام والألوان والأنواع)\nالإجابة: مختلفة الأحجام والألوان والأنواع.\n\nس3 (مستوى الاستدلال): اكتب سبب ما حدث للمجموعة الأولى.\nالإجابة: غادرت البحر هربًا فالتقطها الصياد عند الشاطئ.", "- للطالب: قراءة نص «البحر يتسع للجميع» ص60–62 قراءة صامتة مرة واحدة على الأقل؛ قراءة النص ص60–62 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة؛ إكمال أنشطة خطوتي الأولى ص63–64 وقراءة النص مرة أخرى؛ إعادة سرد أحداث نص «البحر يتسع للجميع» مرتبة أمام الأسرة؛ حل أنشطة خطوتي الثانية ص64–65 في الكتاب؛ كتابة جملتين تحاكي التعبير «لكنّ الأسماك الصغيرة سرعان ما اختلفت.» وحل أنشطة ص66–68؛ كتابة رأيه في إحدى شخصيات نص «البحر يتسع للجميع» في سطرين؛ التدرب على قراءة النص قراءة معبرة وتمثيل مشهد منه مع الأسرة؛ قراءة قصة قصيرة من مكتبة البيت أو مركز مصادر التعلم وإكمال بطاقة القراءة؛ حل أنشطة التحليل والتركيب ص70؛ مراجعة نص «البحر يتسع للجميع» وأنشطته كاملة والتدرب على ما يحتاج إلى تدريب.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة؛ الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف؛ سؤال ابنه عن شخصيات النص ومكان أحداثه؛ الاستماع إلى سرد ابنه ومساعدته على استخدام أدوات الربط؛ سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «البحر يتسع للجميع» ولماذا؛ مناقشة ابنه في العبرة من النص وكيف يطبقها؛ مناقشة ابنه في رأيه بالنص وتعليله؛ مشاركة ابنه تمثيل مشهد من النص وتشجيعه؛ تخصيص عشر دقائق يوميًا لقراءة قصة مع ابنه؛ لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت؛ الاطلاع على بطاقة التقويم الذاتي ومساعدة ابنه في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=13"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: العدد (من 3 إلى 10) (التعرف والمحاكاة)", "النمط اللغوي: العدد (من 3 إلى 10) (التطبيق وأنشطة الكتاب)", "تدريبات إضافية على العدد (من 3 إلى 10) (توظيف في التحدث والكتابة)", "اختبار قصير وعلاج فردي في درس «البحر يتسع للجميع»"], "w": "الأسبوع الرابع عشر: 6–10/12/2026م", "f": ["1. يتعرف العدد (من 3 إلى 10) من خلال أمثلة من النص (5 دقائق)\n2. يحاكي العدد (من 3 إلى 10) في جمل جديدة (15 دقيقة)\n3. يطبق العدد (من 3 إلى 10) في أنشطة الكتاب (20 دقيقة)\n4. يميز العدد (من 3 إلى 10) في جمل معروضة (5 دقائق)\n5. يوظف العدد (من 3 إلى 10) في التحدث عن صور ومواقف (15 دقيقة)\n6. يكتب جملًا صحيحة موظفًا العدد (من 3 إلى 10) (5 دقائق)\n7. يجيب عن اختبار قصير يقيس مهارات درس «البحر يتسع للجميع» (15 دقيقة)\n8. يعالج أخطاءه بعد التصحيح بمساعدة المعلم والأقران (10 دقائق)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (20 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)\n- يقيّم جمل زملائه من حيث صحة توظيف النمط (20 دقيقة)\n- يضع هدفًا لتحسين مهارة يحتاجها (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\nالمخرج 5: تطبيق\nالمخرج 6: إبداع\nالمخرج 7: تطبيق\nالمخرج 8: تقييم\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم\nالمخرج الآخر 4: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني\n8. التعلم التشاركي\n9. تعلم الأقران\n10. التعلم العلاجي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل\n4. أخرى: السبورات الشخصية (الصغيرة)\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: ورقة اختبار قصير", "1. العدد (من 3 إلى 10)\n2. العدد\n3. المعدود\n4. التقويم\n5. العلاج\n6. التحسين", "يرفع المعلم عددًا من الأقلام ويسأل: كم قلمًا؟ ويطلب الإجابة بالحروف، ويجيب التلميذ بالعدد بالحروف (5 دقائق)", "1. اكتشاف النمط: يعرض المعلم جملًا من النص: تسع سمكات، خمس حمراء، أربع زرقاء، ثماني سمكات، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: نكتب الأعداد بالحروف ونحاكي ما في الكتاب: تسع سمكات، خمس حمراء، أربع زرقاء، تسعة صيادين، ثلاثة بالخيط، ستة بالشباك، ويلاحظ التلميذ الأمثلة ويستنتج النمط (17 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المحاكاة: يعرض المعلم الجدول ويقرأ صفه الأول (المجموعة الأولى: تسع سمكات، خمس حمراء، أربع زرقاء) ويطلب محاكاته شفويًا بأعداد وصور معروضة، ويحاكي التلميذ النمط في جمل جديدة على سبورته (14 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص71) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (12 دقيقة)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: ثلاث ملونة، خمس صفراء، تسعة صيادين، ستة بالشباك، ويذكر التلميذ أمثلة جديدة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم نشاط الكتاب: قراءة الجدول وتحويل الأرقام فيه إلى كلمات كما في الأمثلة، ويصحح القراءة والكتابة (ص71)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (23 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (12 دقيقة)\nالاستراتيجيات: المحاكاة.\n\n7. التحدث بالنمط: يعرض المعلم صورًا لأعداد من الأشياء (أقلام، كتب، طيور) ويطلب التحدث عنها بجمل فيها أعداد مكتوبة بالحروف محاكيًا أمثلة الكتاب، ويتحدث التلميذ موظفًا النمط (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الكتابة بالنمط: يطلب المعلم كتابة ثلاث جمل عن موضوع الدرس موظفين العدد (من 3 إلى 10)، ويتبادلون الدفاتر للتقييم، ويكتب التلميذ ثلاث جمل ويقيّم جمل زميله (16 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n9. تصحيح جماعي: يعرض المعلم جملًا مختارة من كتابات الطلاب ويصحح معهم الأخطاء الشائعة، ويشارك التلميذ في التصحيح (12 دقيقة)\nالاستراتيجيات: المحاكاة.\n\n10. مجموعات العلاج والإثراء: يقسم الطلاب: مجموعة علاج يتابعها المعلم في المهارة الأضعف، ومجموعة إثراء تكتب قصة قصيرة موظفة أنماط الدرس، وينضم التلميذ إلى مجموعته وينجز مهمتها (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n11. غلق الدرس – بحرنا يجمعنا: يمثّل الطلبة في مجموعات أسماكًا مختلفة تعيش معًا في بحر عمان دون أذى، ثم يتحدثون عن التعايش والتسامح بين الناس في عمان، ويقول كل طالب كلمة لطيفة لزميل يختلف عنه (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: اكتب الرقم (9) بالحروف في: (9) سمكات: (سبع / تسع / ست / تسعة)\nالإجابة: تسع.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الصواب كما في الكتاب: (ثلاثة صيادين بالخيط / ثلاثون صيادًا / ثلاث صيادين بالخيط / ثالث صيادين)\nالإجابة: ثلاثة صيادين بالخيط.\n\nس3 (مستوى الاستدلال): اكتب العددين بالحروف: (4) قروش، (7) حيتان.\nالإجابة: أربعة قروش، سبعة حيتان.\n\n• نشاط علاجي (لمن لم يتقن): يحرك المعلم أمام التلميذ أسماكًا كبيرة وصغيرة من الورق ليمثّل مطاردة الكبيرة للصغيرة، ثم يصنف معه صور كائنات البحر وغيرها؛ وللتحقق يسأله: من يطارد من في الصورة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح نهاية للصورة تعيش فيها الأسماك الكبيرة والصغيرة بسلام، وتفسير عنوان «البحر يتسع للجميع» بجملتين، وربطه بالتعايش بين الناس.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: اكتب الرقم (9) بالحروف في: (9) صيادين: (سبعة / تسعة / تسع / ستة)\nالإجابة: تسعة.\n\nس2 (مستوى التطبيق): صواب أم خطأ: نكتب الرقم (3) بالحروف: ثلاث أو ثلاثة.\nالإجابة: صواب.\n\nس3 (مستوى الاستدلال): اكتب ثلاث جمل فيها أعداد عن فصلك.\nالإجابة: مثل: في فصلي ثلاث نوافذ، وعشرة مقاعد، وسبع لوحات.", "- للطالب: حل أنشطة النمط اللغوي ص71 وكتابة جملتين موظفًا العدد (من 3 إلى 10)؛ كتابة فقرة قصيرة من ثلاث جمل موظفًا العدد (من 3 إلى 10)؛ التدرب على المهارة التي أخطأ فيها في الاختبار القصير.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة؛ الاطلاع على ورقة الاختبار القصير ومتابعة التدريب العلاجي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=13"]}, {"k": "الإملاء", "p": ["النمط الإملائي: علامات الترقيم (النقطة، الفاصلة، النقطتان) (الملاحظة والتصنيف)", "النمط الإملائي: علامات الترقيم (النقطة، الفاصلة، النقطتان) (التطبيق والإملاء المنقول)", "تدريبات إضافية وإملاء منظور على علامات الترقيم (النقطة، الفاصلة، النقطتان)"], "w": "الأسبوع الرابع عشر: 6–10/12/2026م", "f": ["1. يلاحظ علامات الترقيم (النقطة، الفاصلة، النقطتان) في كلمات من النص (15 دقيقة)\n2. يصنف كلمات وفق علامات الترقيم (النقطة، الفاصلة، النقطتان) (10 دقائق)\n3. يكتب كلمات تتضمن علامات الترقيم (النقطة، الفاصلة، النقطتان) كتابة صحيحة (15 دقيقة)\n4. يكتب إملاءً منقولًا بخط واضح (15 دقيقة)\n5. يكتب إملاءً منظورًا يتضمن علامات الترقيم (النقطة، الفاصلة، النقطتان) كتابة صحيحة (10 دقائق)\n6. يصحح أخطاءه الإملائية ذاتيًا (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يذكر أمثلة جديدة من خارج النص (15 دقيقة)\n- يميز الخطأ الإملائي في كلمة ويصححه (10 دقائق)\n- يكتشف أخطاء زميله ويصوبها (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة\n6. السؤال والجواب\n7. تعلم الأقران\n8. التقويم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل\n4. أخرى: السبورات الشخصية (الصغيرة)\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. علامات الترقيم (النقطة، الفاصلة، النقطتان)\n2. الوقف\n3. الكلام المنقول", "يكتب المعلم (قالت السمكة البحر وطننا) ويسأل: أين يبدأ الكلام المنقول؟ وماذا نضع قبله؟ ويحدد التلميذ موضع النقطتين (5 دقائق)", "1. ملاحظة الظاهرة: يعرض المعلم جملًا من النص فيها كلمات ملونة: عقدت أسماك البحر الصغيرة اجتماعًا، وتشاورت.، قالت المجموعة الأولى: نحن قررنا مغادرة البحر.، البحر وطننا.، لكن الأسماك سرعان ما اختلفت، وانقسمت.، قالت المجموعة الثالثة: البحر وطننا.، هذا البحر يتسع للجميع.، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: النقطة (.) في نهاية الجملة التامة، والفاصلة (،) بين الجمل القصيرة المتصلة، والنقطتان (:) قبل الكلام المنقول بعد (قال، قالت) وقبل التعداد، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التصنيف: يعرض المعلم فقرة من النص ويطلب ملاحظة النقطة والفاصلة والنقطتين، ثم يصنف مواضعها في جدول (نهاية جملة، بين جمل قصيرة، قبل كلام منقول) (ص72–73)، ويصنف التلميذ الكلمات في الجدول (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أنشطة الكتاب: يطلب المعلم قراءة فقرة النص ووضع علامة الترقيم المناسبة بين الأقواس مستعينًا بنص القراءة، ثم قراءة فقرة أخرى وبيان عدد الكلمات وعلامات الترقيم فيها (ص72–73)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (14 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n6. الإملاء المنقول: يكتب المعلم على السبورة: «قالت المجموعة الثالثة: البحر وطننا، وسنبقى فيه.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n7. عرض فقرة الإملاء المنظور: يعرض المعلم الفقرة: «عقدت أسماك البحر الصغيرة اجتماعًا، وتشاورت فيما يجب عمله. هذا البحر يتسع للجميع.» ويقرؤها ويناقش كلماتها الصعبة ثم يحجبها، ويقرأ التلميذ الفقرة ويتأمل كلماتها الصعبة (9 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n8. الإملاء المنظور: يملي المعلم الفقرة كلمة كلمة بتأنٍّ مع مراعاة الفروق الفردية، ويكتب التلميذ الفقرة إملاءً (13 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n9. التصحيح الذاتي والتبادلي: يعيد المعلم عرض الفقرة ويطلب من كل طالب تصحيح دفتر زميله ووضع دائرة حول الخطأ، ثم يكتب كل طالب أخطاءه صحيحة ثلاث مرات، ويصحح التلميذ دفتر زميله ثم يصوب أخطاءه (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – علامات على الطريق: يقرأ المعلم جملًا عن عمان (مثل: قال أبي: عمان وطننا الغالي.) فترسم المجموعات في الهواء العلامة المناسبة في كل موضع، وتفوز المجموعة الأدق، ثم تكتب كل مجموعة جملة عن بحر عمان بعلامات ترقيم صحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نضع في نهاية الجملة التامة: (الفاصلة (،) / النقطة (.) / النقطتين (:) / علامة الاستفهام)\nالإجابة: النقطة (.)\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: العلامة المناسبة مكان الفراغ: انقسمت الأسماك إلى ثلاث مجموعات (....): (النقطة (.) / علامة الاستفهام (؟) / النقطتان (:))\nالإجابة: النقطة (.)\n\nس3 (مستوى الاستدلال): صحح الترقيم: (قالت السمكة، البحر وطننا:)\nالإجابة: قالت السمكة: البحر وطننا.\n\n• نشاط علاجي (لمن لم يتقن): يحرك المعلم أمام التلميذ أسماكًا كبيرة وصغيرة من الورق ليمثّل مطاردة الكبيرة للصغيرة، ثم يصنف معه صور كائنات البحر وغيرها؛ وللتحقق يسأله: من يطارد من في الصورة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح نهاية للصورة تعيش فيها الأسماك الكبيرة والصغيرة بسلام، وتفسير عنوان «البحر يتسع للجميع» بجملتين، وربطه بالتعايش بين الناس.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: العلامة المناسبة مكان الفراغ: تعيش في البحر أسماك ملونة (....) وحيتان كبيرة.: (علامة الاستفهام (؟) / النقطتان (:) / الفاصلة (،))\nالإجابة: الفاصلة (،)\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نقف عند النقطتين قليلًا ثم نقرأ: (الكلام المنقول / الصفحة التالية / اسم الكاتب / العنوان)\nالإجابة: الكلام المنقول.\n\nس3 (مستوى الاستدلال): استخرج من النص جملة فيها فاصلة.\nالإجابة: مثل: عقدت أسماك البحر الصغيرة اجتماعًا، وتشاورت فيما يجب عمله.", "- للطالب: حل أنشطة النمط الإملائي ص72–73 وكتابة خمس كلمات تمثل علامات الترقيم (النقطة، الفاصلة، النقطتان)؛ إعادة كتابة كلمات الإملاء التي أخطأ فيها ثلاث مرات.\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=13"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (ع غ) بخط النسخ"], "w": "الأسبوع الرابع عشر: 6–10/12/2026م", "f": ["1. يكتب الحروف (ع غ) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (10 دقائق)\n2. يكتب الكلمات والجملة: «هذا البحر يتسع للجميع.» محاكيًا النموذج (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (ع غ) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (اجتماعًا، الصغيرة، مغادرة، يتسع) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص74) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «هذا البحر يتسع للجميع.» ويختار أجود خط ليعلق في لوحة الصف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – شبكة الصياد: يلقي المعلم شبكة ورقية فيها بطاقات كلمات من بيئة عمان البحرية فيها العين أو الغين (عمان، غواص، شراع، صغير)، وتكتب كل مجموعة ما اصطادته بخط النسخ ويختار الصف أجمل كلمة، ويتذكر الطلاب أن الغوص وصيد السمك من مهن الآباء والأجداد في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف الذي فوقه نقطة: (ح / ع / س / غ)\nالإجابة: غ.\n\nس2 (مستوى التطبيق): أي الكلمات فيها حرف الغين؟ (البحر / اجتماعًا / يتسع / الصغيرة)\nالإجابة: الصغيرة.\n\nس3 (مستوى الاستدلال): اكتب كلمة فيها عين وأخرى فيها غين.\nالإجابة: مثل: عصفور، غيمة.\n\n• نشاط علاجي (لمن لم يتقن): يحرك المعلم أمام التلميذ أسماكًا كبيرة وصغيرة من الورق ليمثّل مطاردة الكبيرة للصغيرة، ثم يصنف معه صور كائنات البحر وغيرها؛ وللتحقق يسأله: من يطارد من في الصورة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح نهاية للصورة تعيش فيها الأسماك الكبيرة والصغيرة بسلام، وتفسير عنوان «البحر يتسع للجميع» بجملتين، وربطه بالتعايش بين الناس.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كلمة فيها عين متطرفة: (مغادرة / الصغيرة / اجتماعًا / يتسع)\nالإجابة: يتسع.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الحرف المشترك في (مغادرة، الصغيرة): (الراء / الدال / العين / الغين)\nالإجابة: الغين.\n\nس3 (مستوى الاستدلال): اكتب الجملة (هذا البحر يتسع للجميع.) بخط النسخ.\nالإجابة: كتابة الجملة بحروف متناسقة على السطر.", "- للطالب: إكمال صفحة الخط ص74 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=13"]}, {"k": "التعبير", "p": ["التعبير الكتابي: ترتيب البطاقات لتكوين جمل ثم نص (العصفور والغراب) (الإعداد والتخطيط)", "التعبير الكتابي: ترتيب البطاقات لتكوين جمل ثم نص (العصفور والغراب) (الكتابة والمراجعة)"], "w": "الأسبوع الرابع عشر: 6–10/12/2026م", "f": ["1. يرتب الأفكار والأحداث للكتابة في: ترتيب البطاقات لتكوين جمل ثم نص (العصفور والغراب) (25 دقيقة)\n2. يتحدث شفويًا عن موضوع الكتابة في درس «البحر يتسع للجميع» بجمل مترابطة (5 دقائق)\n3. يكتب ترتيب البطاقات لتكوين جمل ثم نص (العصفور والغراب) بجمل مترابطة (20 دقيقة)\n4. يراعي علامات الترقيم والنظافة في كتابته (5 دقائق)\n\nمخرج تعليمي آخر:\n- يتحدث عن الصور بجمل سليمة قبل الكتابة (10 دقائق)\n- يقيّم كتابته وكتابة زميله ويحسنها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التعلم الذاتي\n5. تعلم الأقران\n6. التقويم الذاتي\n7. التعلم المبني على المشاريع", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التعبير الكتابي\n2. ترتيب الأفكار\n3. علامات الترقيم", "يعرض المعلم بطاقات كلمات مبعثرة ويطلب تكوين جملة سريعة منها، ويكوّن التلميذ جملة من البطاقات (5 دقائق)", "1. التمهيد بالأسئلة: يطرح المعلم أسئلة ممهدة: أين تعيش العصافير؟ ماذا يحدث لو احتل أحد بيتك؟ كيف نتعاون لنحمي بيوتنا؟ ويجيب التلميذ ويستدعي خبرته (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. تأمل الصور والجمل: يعرض المعلم البطاقات المبعثرة (العش، الغراب، سكن، هاربًا، فر، ليشكو، إخوانه، العصفور، عشًّا، بنى، جديدًا، القش، العصافير، اجتمعت) ويتحدث مع الطلاب عن القصة المتوقعة (ص75–76)، ويتأمل التلميذ الصور ويتحدث عنها مع مجموعته (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط الشفوي: يطلب المعلم من كل مجموعة ترتيب الأفكار شفويًا (البداية، الأحداث، النهاية) وعرضها، ويرتب التلميذ الأفكار ويعرضها شفويًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مراجعة الخطة: يراجع المعلم مع الطلاب الأفكار المرتبة ويكتب كلمات مساعدة على السبورة، ويراجع التلميذ خطته (6 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n5. الكتابة الفردية: يطلب المعلم ترتيب البطاقات لتكوين جمل مفيدة، ثم ترتيب الجمل لتكوين نص قصير عن العصفور الذي احتل الغراب عشه فتعاونت العصافير وبنت عشًا جديدًا (ص75–76)، ويمر بين الطلاب ويوجههم، ويكتب التلميذ في كتابه مراعيًا الترتيب وعلامات الترقيم (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n6. المراجعة والعرض: يطلب المعلم من بعض الطلاب قراءة ما كتبوه ويناقش مع الصف جوانب التميز والتحسين، ويطلب تصويب الأخطاء، ويقرأ التلميذ ما كتبه ويصوب أخطاءه (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – عش التعاون: تبني كل مجموعة عشًّا من بطاقات الجمل مرتبة ترتيبًا صحيحًا، ثم تكتب جملة عن تعاون أهل عمان في حماية بيوتهم ووطنهم وتلصقها في العش وتقرؤها على الصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: رتب لتكون جملة: (العش - الغراب - سكن): (سكن العش / الغراب سكن / العش الغراب سكن / سكن الغراب العش)\nالإجابة: سكن الغراب العش.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: العش بيت: (القط / السمكة / العصفور / الحصان)\nالإجابة: العصفور.\n\nس3 (مستوى الاستدلال): اكتب النص في أربع جمل مرتبة.\nالإجابة: مثل: سكن الغراب عش العصفور. ذهب العصفور إلى إخوانه يشكو حاله. اجتمعت العصافير معًا وجلبت القش. بنى العصفور عشًا جديدًا.\n\n• نشاط علاجي (لمن لم يتقن): يحرك المعلم أمام التلميذ أسماكًا كبيرة وصغيرة من الورق ليمثّل مطاردة الكبيرة للصغيرة، ثم يصنف معه صور كائنات البحر وغيرها؛ وللتحقق يسأله: من يطارد من في الصورة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح نهاية للصورة تعيش فيها الأسماك الكبيرة والصغيرة بسلام، وتفسير عنوان «البحر يتسع للجميع» بجملتين، وربطه بالتعايش بين الناس.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اجتمعت العصافير .... وجلبت القش. (معًا / تحت / هل)\nالإجابة: معًا.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نرتب الجمل في النص حسب: (عدد الحروف / تسلسل الأحداث / الألوان / طول الجمل)\nالإجابة: تسلسل الأحداث.\n\nس3 (مستوى الاستدلال): احكِ القصة شفويًا من البطاقات.\nالإجابة: سكن الغراب عش العصفور، فذهب العصفور إلى إخوانه يشكو حاله، فاجتمعت العصافير وبنت عشًا جديدًا.", "- للطالب: التحدث مع الأسرة عن الصور ص75–76 وترتيب أحداثها؛ إكمال نشاط التعبير الكتابي ص75–76 وقراءته على الأسرة.\n- لولي الأمر: الاستماع إلى ابنه وهو يقرأ ما كتبه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=13"]}]}, {"t": "ضياء في الفضاء (مراجعة المحور الثاني)", "u": "المحور الثاني: وطني", "s": [{"k": "القراءة", "p": ["القراءة التصفحية والتوقع والقراءة النموذجية لنص «ضياء في الفضاء (مراجعة المحور الثاني)»", "القراءة الجهرية الأولى لنص «ضياء في الفضاء (مراجعة المحور الثاني)» ومعاني المفردات", "القراءة الجهرية الثانية لنص «ضياء في الفضاء (مراجعة المحور الثاني)» وفهم المعنى الصريح (خطوتي الأولى)", "القراءة الجهرية الثالثة لنص «ضياء في الفضاء (مراجعة المحور الثاني)» وترتيب الأحداث", "القراءة الجهرية الرابعة وفهم المعنى الضمني في نص «ضياء في الفضاء (مراجعة المحور الثاني)» (خطوتي الثانية)", "تفسير أفكار نص «ضياء في الفضاء (مراجعة المحور الثاني)» ودمجها ومح \n20. يحلل الكلمات إلى مقاطع صوتية ويركب من المقاطع كلمات ذات معنى (20 دقيقة)\n21. يجيب عن أسئلة متنوعة تقيس فهم النص والمفردات (15 دقيقة)\n22. يوظف نمطي الدرس (أنماط المحور الثاني، إملاء المحور الثاني) في جمل صحيحة (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يستمع إلى القراءة النموذجية بانتباه ويتابع بالمؤشر (20 دقيقة)\n- يوظف الكلمات الجديدة في جمل من إنشائه (15 دقيقة)\n- يدعم إجابته بعبارة من النص (15 دقيقة)\n- يعيد سرد مضمون النص بأسلوبه (15 دقيقة)\n- يستنتج الفكرة الرئيسة للنص (15 دقيقة)\n- يحاكي التعبير: «حلمي أن أكون أول رائد فضاء عماني.» في جملة من إنشائه (15 دقيقة)\n- يقترح تصرفًا آخر أو نهاية أخرى للنص (10 دقائق)\n- يقيّم أداء زملائه وفق معايير بسيطة (الصوت، التعبير، الطلاقة) (15 دقيقة)\n- يبدي رأيه فيما قرأ ويعرضه على زملائه (15 دقيقة)\n- يكوّن من البطاقات جملًا مفيدة (10 دقائق)\n- يحدد ما أتقنه وما يحتاج إلى تدريب في الدرس (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تذكر\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج 13: تقييم\nالمخرج 14: تطبيق\nالمخرج 15: تطبيق\nالمخرج 16: تطبيق\nالمخرج 17: تطبيق\nالمخرج 18: تحليل\nالمخرج 19: تحليل\nالمخرج 20: تطبيق\nالمخرج 21: فهم\nالمخرج 22: تطبيق\nالمخرج الآخر 1: فهم\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: إبداع\nالمخرج الآخر 5: تحليل\nالمخرج الآخر 6: تطبيق\nالمخرج الآخر 7: إبداع\nالمخرج الآخر 8: تقييم\nالمخرج الآخر 9: تقييم\nالمخرج الآخر 10: تطبيق\nالمخرج الآخر 11: تقييم", "1. التنبؤ\n2. التعلم الذاتي\n3. السؤال والجواب\n4. التعلم بالنمذجة\n5. التعلم المبني على اللعب\n6. تعلم الأقران\n7. التعلم التعاوني\n8. تعدد القراءات\n9. أعواد المثلجات\n10. التعلم بالاكتشاف\n11. العصف الذهني\n12. الحوار والمناقشة\n13. تمثيل الأدوار\n14. التعلم التشاركي\n15. الفصل المقلوب\n16. لعبة القطار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. أخرى: بطاقات الكلمات والجمل\n5. أخرى: السبورات الشخصية (الصغيرة)\n6. أخرى: أعواد المثلجات بأسماء الطلاب\n7. أخرى: سلتان وبيضتان بلاستيكيتان وملعقتان رض المعلم المفردات في بطاقات: رائد فضاء (من يسافر إلى الفضاء)، شغوفًا (محبًا بشدة)، نادي (مكان يجتمع فيه أصحاب هواية واحدة)، عملاقة (كبيرة جدًا)، الكواكب (أجرام تدور حول الشمس)، يهمس (يتكلم بصوت منخفض)، ويستنتج معانيها من السياق والصور، ويستنتج التلميذ المعنى من السياق ويكتبه في سبورته الصغيرة (13 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. لعبة المطابقة: يوزع المعلم بطاقات الكلمات وبطاقات المعاني على المجموعات، وتتسابق المجموعات في مطابقتها، ثم يطلب توظيف كلمتين في جمل، ويطابق التلميذ الكلمة بمعناها ويوظفها في جملة (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية: يكتب المعلم أهداف القراءة، ويطبق تعلم الأقران: يقرأ طالب ويرصد زميله أخطاءه ثم يصححانها بعد إتمام الجملة، ويقيّم القراءة في سجله، ويقرأ التلميذ ويرصد أخطاء زميله ويصححها معه (15 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n8. أنشطة خطوتي الأولى في أثناء القراءة: يوجه المعلم أسئلة خطوتي الأولى (ص81–82) في أثناء القراءة لا بعدها، وتتسابق المجموعات في الإجابة على السبورات الصغيرة، مثل: اختر الإجابة الصحيحة: اللعبة التي اشتراها الوالدان لضياء: (سيارة / كرة / دراجة / لعبة تركيب الصور)، ويجيب التلميذ مع مجموعته على السبورة الصغيرة ويحدد موضع الإجابة في النص (17 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. تدوين الإجابات: يدون الإجابات الصحيحة على السبورة ويوجه الطلاب إلى نقلها في كتبهم ويمر بينهم للتصحيح، وينقل التلميذ الإجابات الصحيحة في كتابه (7 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. القراءة الجهرية الثالثة (تعدد القراءات): يوزع المعلم فقرات النص على المجموعات، ويسحب عود مثلجات باسم طالب ليقرأ الفقرة المحددة، ويستمر حتى نهاية النص، ويقرأ التلميذ الفقرة عند سحب اسمه ويتابع قراءة زملائه (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. ترتيب الأحداث: يوزع المعلم بطاقات الأحداث على المجموعات ويطلب ترتيبها من (1) إلى (5) مستعينين بالنص (ص81–82)، ثم تعرض كل مجموعة ترتيبها، ويرتب التلميذ البطاقات مع مجموعته ويعلل الترتيب من النص (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. إعادة السرد: يطلب المعلم من طالبين إعادة سرد الأحداث المرتبة بأسلوبهما مستخدمين أدوات الربط (في البداية، ثم، بعد ذلك، وأخيرًا)، ويعيد التلميذ سرد الأحداث بأسلوبه (9 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n13. القراءة الجهرية الرابعة: يوجه الطلاب إلى قراءة الفقرات المتعلقة بأسئلة خطوتي الثانية بطريقة الألعاب القرائية (رصد أخطاء الزميل وتصحيحها)، ويقرأ التلميذ الفقرات ويرصد الأخطاء (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. أسئلة خطوتي الثانية: يوزع المعلم أسئلة خطوتي الثانية (ص83) على المجموعات، لكل مجموعة سؤال، ويترك زمنًا مناسبًا، ثم يناقش الإجابات ويحدد المجموعة الأسرع والأدق، ويستنتج التلميذ الإجابة مع مجموعته ويدعمها بدليل من النص (18 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n15. الفكرة الرئيسة: يعرض المعلم خيارات للفكرة الرئيسة ويطلب اختيار الأنسب وتعليله: طموح ضياء أن يكون أول رائد فضاء عماني يرفع علم بلاده، ويختار التلميذ الفكرة الرئيسة ويعلل (7 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n16. أسئلة خطوتي الثالثة: يناقش المعلم أسئلة خطوتي الثالثة (ص84) بالحوار: العبرة من النص، ونوعه، وطبيعة أحداثه، ويستثمر التجربة الشخصية للطلاب في فهمها، ويجيب التلميذ ويربط النص بتجربته الشخصية (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. اقتراح عنوان آخر: يعرض المعلم عناوين المجموعات ويناقش مدى ارتباط كل عنوان بمضمون النص ويختار الطلاب أفضلها، ويقيّم التلميذ العناوين ويختار أنسبها (9 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n18. محاكاة التعبير: يعرض المعلم التعبير: «حلمي أن أكون أول رائد فضاء عماني.» ويوضح بناءه، ثم يطلب محاكاته في جمل جديدة مثل: «حلمي أن أكون أول طبيبة عمانية تكتشف دواءً جديدًا.»، ويحاكي التلميذ التعبير في جملة من إنشائه ويكتبها في سبورته (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n19. لعبة سباق الجمل: يضع المعلم سلتين فيهما بطاقات جمل النص، ويتسابق فريقان: يحمل الطالب البيضة بالملعقة إلى السلة ويأخذ جملة ويقرؤها، والفائز من يجمع جملًا أكثر ويقرؤها صحيحة، ويشارك التلميذ في السباق ويقرأ الجملة التي جمعها (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n20. أسئلة خطوتي الرابعة: يعرض المعلم أسئلة خطوتي الرابعة (ص84) ويترك للطلاب حرية التعبير بالفصحى مع التعليل، ويستمع إلى مواقف مشابهة من حياتهم، ويبدي التلميذ رأيه ويعلله ويحكي موقفًا مشابهًا (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. نهاية أخرى: يطلب المعلم من كل مجموعة اقتراح نهاية أخرى للنص أو تصرف بديل لإحدى الشخصيات وعرضه شفويًا، ويقترح التلميذ نهاية أخرى مع مجموعته (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. نمذجة القراءة المعبرة: يقرأ المعلم مقاطع الحوار والمواقف المؤثرة في النص بنبرات مختلفة، ويلفت إلى تلوين الصوت بحسب علامات الترقيم، ويستمع التلميذ ويحاكي القراءة المعبرة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n23. التدرب في المجموعات: يوزع المعلم أدوار الشخصيات (ضياء، والدا ضياء) والراوي على المجموعات ويمنحها وقتًا للتدرب، ويتدرب التلميذ مع مجموعته على أداء دوره (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n24. العرض والتقييم: تعرض كل مجموعة مشهدًا، ويقيّم الطلاب الأداء ببطاقة (الصوت، التعبير، الطلاقة)، ويمثل التلميذ دوره ويقيّم أداء المجموعات الأخرى (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n25. القراءة الصامتة: يوجه الطلاب إلى قراءة صامتة لنص قصير يعرضه أو لقصة اختاروها في موضوع: قصص عن الطموح وعلوم الفضاء، ويقرأ التلميذ قراءة صامتة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n26. المقارنة والمشاركة: يطلب المعلم من كل ثنائي المقارنة بين ما قرأه ونص «ضياء في الفضاء (مراجعة المحور الثاني)»: الشخصيات، المكان، العبرة، ويقارن التلميذ مع زميله ويعرض المقارنة (15 دقيقة)\nالاستراتيجيات: الفصل المقلوب.\n\n27. بطاقة القراءة: يوزع المعلم بطاقة قراءة بسيطة: عنوان القصة، شخصياتها، ما أعجبني، ما لم يعجبني، ويكمل التلميذ بطاقة القراءة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n28. تحليل الجمل إلى كلمات: يعرض المعلم جملًا من النص (ص85) ويطلب وضع (/) بين الكلمات وعد الكلمات، مثل: (سأكون رائد فضاء)، ويفصل التلميذ الكلمات ويعدها (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n29. تحليل الكلمات إلى مقاطع: يحلل كلمات بالأصابع والتصفيق: ضياء، الفضاء، صاروخ، الكواكب ويكتب المقاطع في سبوراتهم، ويحلل التلميذ الكلمات إلى مقاطع ويكتبها (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n30. لعبة القطار: تركيب الكلمات: يوزع المعلم بطاقات مقاطع، ويجلس أسرع ثلاثة طلاب يكوّنون كلمة صحيحة في كراسي القطار، ثم تكتب المجموعات جملة من الكلمات المكونة، ويركب التلميذ الكلمات من المقاطع ويكوّن جملة (15 دقيقة)\nالاستراتيجيات: لعبة القطار.\n\n31. محطات المراجعة: يوزع المجموعات على أربع محطات: محطة الفهم، محطة المفردات، محطة النمط اللغوي، محطة الإملاء، ويتنقل الطلاب بينها كل ثلاث دقائق ونصف، وينجز التلميذ مهمة كل محطة مع مجموعته (20 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n32. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن ضياء في الفضاء (مراجعة المحور الثاني)، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n33. غلق الدرس – من هنا مر رجل من عمان: تكتب كل مجموعة على نجمة ورقية حلمًا يرفع اسم عمان، ثم يقرأ ممثلها الجملة بحماس كما قرأ ضياء «سأكون رائد فضاء!»، وتلصق النجوم على لوحة «سماء عمان» في الصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: عنوان نص مراجعة المحور الثاني: (نور تحب قريتها / ليلى ترسم وطنًا / ضياء في الفضاء / مفتاح القراءة)\nالإجابة: ضياء في الفضاء.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: صفة ضياء كما تظهر في النص: (كسول / طموح مثابر / خائف / متردد دائمًا)\nالإجابة: طموح مثابر.\n\nس3 (مستوى الاستدلال): ما العبرة التي تعلمتها من النص؟\nالإجابة: أن أتمسك بحلمي وأسعى إليه بالعلم لأرفع اسم وطني.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ جملة «عندما كنت في الخامسة من عمري» ويشير إلى كلمة «كنت» ليبين أن ضياء هو المتكلم، ثم يكرران ذلك في جملة أخرى؛ وللتحقق يسأله: من الشخصية الرئيسة في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة كتابة جملتين من نص «ضياء في الفضاء» بضمير الغائب (كان ضياء…)، ثم يعدّون سؤالين يطرحونهما على ضياء عن الفضاء.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: ألحق الوالدان ضياء بـ: (نادي السباحة / مدرسة الرسم / نادي علوم الفضاء / نادي كرة القدم)\nالإجابة: نادي علوم الفضاء.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: موقف الوالدين من حلم ضياء: (لم يهتما / سخرا منه / رفضاه / شجعاه ودعماه)\nالإجابة: شجعاه ودعماه.\n\nس3 (مستوى الاستدلال): اكتب حلمك وخطوتين ستتبعهما لتحقيقه.\nالإجابة: مثل: حلمي أن أكون طبيبًا، سأجتهد في العلوم وأقرأ عن جسم الإنسان.", "- للطالب: قراءة نص «ضياء في الفضاء (مراجعة المحور الثاني)» ص79–80 قراءة صامتة مرة واحدة على الأقل؛ قراءة النص ص79–80 قراءة جهرية لأحد أفراد الأسرة وكتابة معاني ثلاث كلمات جديدة؛ إكمال أنشطة خطوتي الأولى ص81–82 وقراءة النص مرة أخرى؛ إعادة سرد أحداث نص «ضياء في الفضاء (مراجعة المحور الثاني)» مرتبة أمام الأسرة؛ حل أنشطة خطوتي الثانية ص83 في الكتاب؛ كتابة جملتين تحاكي التعبير «حلمي أن أكون أول رائد فضاء عماني.» وحل أنشطة ص84؛ كتابة رأيه في إحدى شخصيات نص «ضياء في الفضاء (مراجعة المحور الثاني)» في سطرين؛ التدرب على قراءة النص قراءة معبرة وتمثيل مشهد منه مع الأسرة؛ قراءة قصة قصيرة من مكتبة البيت أو مركز مصادر التعلم وإكمال بطاقة القراءة؛ حل أنشطة التحليل والتركيب ص85؛ مراجعة نص «ضياء في الفضاء (مراجعة المحور الثاني)» وأنشطته كاملة والتدرب على ما يحتاج إلى تدريب.\n- لولي الأمر: الاستماع إلى ابنه وهو يحكي توقعه عن النص وما وجده بعد القراءة؛ الاستماع إلى قراءة ابنه وتصويب أخطائه بلطف؛ سؤال ابنه عن شخصيات النص ومكان أحداثه؛ الاستماع إلى سرد ابنه ومساعدته على استخدام أدوات الربط؛ سؤال ابنه عن صفة يحبها في إحدى شخصيات نص «ضياء في الفضاء (مراجعة المحور الثاني)» ولماذا؛ مناقشة ابنه في العبرة من النص وكيف يطبقها؛ مناقشة ابنه في رأيه بالنص وتعليله؛ مشاركة ابنه تمثيل مشهد من النص وتشجيعه؛ تخصيص عشر دقائق يوميًا لقراءة قصة مع ابنه؛ لعب لعبة التصفيق بالمقاطع مع ابنه بكلمات من البيت؛ الاطلاع على بطاقة التقويم الذاتي ومساعدة ابنه في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=14"]}, {"k": "الأنماط اللغوية", "p": ["مراجعة النمط اللغوي: الجملة الاسمية من خلال نص «ضياء في الفضاء (مراجعة المحور الثاني)»", "مراجعة النمط اللغوي: تحويل الجملة الفعلية إلى اسمية والعكس من خلال نص «ضياء في الفضاء (مراجعة المحور الثاني)»", "مراجعة النمط اللغوي: العدد من خلال نص «ضياء في الفضاء (مراجعة المحور الثاني)»", "اختبار قصير وعلاج فردي في درس «ضياء في الفضاء (مراجعة المحور الثاني)»"], "w": "الأسبوع الخامس عشر: 13–17/12/2026م – الأسبوع السادس عشر: 20–24/12/2026م", "f": ["1. يستخرج أمثلة على الجملة الاسمية من نص «ضياء في الفضاء (مراجعة المحور الثاني)» (15 دقيقة)\n2. يوظف الجملة الاسمية في جمل صحيحة (10 دقائق)\n3. يستخرج أمثلة على تحويل الجملة الفعلية إلى اسمية والعكس من نص «ضياء في الفضاء (مراجعة المحور الثاني)» (10 دقائق)\n4. يوظف تحويل الجملة الفعلية إلى اسمية والعكس في جمل صحيحة (15 دقيقة)\n5. يستخرج أمثلة على العدد من نص «ضياء في الفضاء (مراجعة المحور الثاني)» (5 دقائق)\n6. يوظف العدد في جمل صحيحة (15 دقيقة)\n7. يجيب عن اختبار قصير يقيس مهارات درس «ضياء في الفضاء (مراجعة المحور الثاني)» (15 دقيقة)\n8. يعالج أخطاءه بعد التصحيح بمساعدة المعلم والأقران (10 دقائق)\n\nمخرج تعليمي آخر:\n- يستخرج أمثلة للنمط من النص (35 دقيقة)\n- يصحح جملة استخدم فيها النمط خطأ (15 دقيقة)\n- يضع هدفًا لتحسين مهارة يحتاجها (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تطبيق\nالمخرج 8: تقييم\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. المحاكاة\n5. التعلم الذاتي\n6. التعلم المبني على اللعب\n7. التعلم التعاوني\n8. تعلم الأقران\n9. التعلم العلاجي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل\n4. أخرى: السبورات الشخصية (الصغيرة)\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: ورقة اختبار قصير", "1. الجملة الاسمية\n2. المبتدأ (الاسم الأول)\n3. الخبر\n4. تحويل الجملة الفعلية إلى اسمية والعكس\n5. الجملة الفعلية\n6. العدد\n7. المعدود\n8. التقويم\n9. العلاج\n10. التحسين", "يذكر المعلم اسمًا (الصاروخ، القمر) ويطلب وصفه بجملة اسمية، ويقول التلميذ جملة اسمية (5 دقائق)", "1. اكتشاف نمط الجملة الاسمية: يعرض المعلم جملًا من النص: ضياء طموح، الصاروخ مستعد للانطلاق، حلمي كبير، الكواكب بعيدة، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: الجملة الاسمية تبدأ باسم، ونخبر عنه بكلمة أخرى، مثل: القريةُ جميلةٌ، البحرُ هادئٌ، ويلاحظ التلميذ الأمثلة ويستنتج النمط (18 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. محاكاة الجملة الاسمية: يعرض المعلم صورًا (بحر، سماء، بنايات) ويطلب وصف كل صورة بجملة تبدأ باسم (البحر هادئ، السماء صافية، البنايات عالية)، ثم يقارنها بجملة فعلية ليلاحظوا الفرق، ويحاكي التلميذ النمط في جمل جديدة على سبورته (16 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. أقرأ وأكتب: ينقل الطلاب إلى الكتاب (ص86–87) لقراءة الأمثلة ونسخ جملتين ويمر بينهم للتصحيح، ويقرأ التلميذ الأمثلة وينسخ جملتين (13 دقيقة)\nالاستراتيجيات: المحاكاة.\n\n4. مراجعة النمط: يراجع المعلم النمط بأمثلة سريعة: كبر الولد ← الولد كبر، رفرف العلم ← العلم رفرف، نما الطفل ← الطفل نما، ضاع المفتاح ← المفتاح ضاع، ويذكر التلميذ أمثلة جديدة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أنشطة الكتاب: ينفذ المعلم نشاط الكتاب: تحويل الجمل محاكيًا المثال (كبر الولد، رفرف العلم، نما الطفل، ضاع المفتاح) (ص86–87)، ويصحح إجابة أسرع طالبين ويكتبانها على السبورة، ويحل التلميذ أنشطة الكتاب فرديًا ثم يصحح (24 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة صح أم خطأ: يقرأ المعلم جملًا بعضها يوظف النمط صحيحًا وبعضها خطأ، ويرفع الطلاب بطاقة (✔) أو (✘) ويصححون الخطأ، ويحكم التلميذ على الجمل ويصحح الخطأ (13 دقيقة)\nالاستراتيجيات: المحاكاة.\n\n7. اكتشاف نمط العدد: يعرض المعلم جملًا من النص: ثلاثة كواكب، أربع طائرات، خمسة نجوم، ستة صواريخ، ويلوّن موضع النمط، ويستنتج مع الطلاب بأسلوب مبسط دون قواعد: نكتب الأعداد بالحروف ونحاكي ما في الكتاب: تسع سمكات، خمس حمراء، أربع زرقاء، تسعة صيادين، ثلاثة بالخيط، ستة بالشباك، ويلاحظ التلميذ الأمثلة ويستنتج النمط (18 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. محاكاة نمط العدد: يعرض المعلم الجدول ويقرأ صفه الأول (المجموعة الأولى: تسع سمكات، خمس حمراء، أربع زرقاء) ويطلب محاكاته شفويًا بأعداد وصور معروضة، ويحاكي التلميذ النمط في جمل جديدة على سبورته (16 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n9. مجموعات العلاج والإثراء: يقسم الطلاب: مجموعة علاج يتابعها المعلم في المهارة الأضعف، ومجموعة إثراء تكتب قصة قصيرة موظفة أنماط الدرس، وينضم التلميذ إلى مجموعته وينجز مهمتها (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – رواد عمان الصغار: يتخيل كل زوج أنه رائد فضاء عماني ينظر إلى بلاده من الأعلى، ويصف ما يراه بجملتين كالجبال والبحر والصحراء، ثم يشاركان الصف حلمهما بخدمة عمان بالعلم (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الجملة الاسمية: (اشترى أبي لعبة / ضياء طموح / كتب ضياء / رفرف العلم)\nالإجابة: ضياء طموح.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حوّل إلى اسمية: (رفرف العلم): (علم / رفرف / العلم / العلم رفرف)\nالإجابة: العلم رفرف.\n\nس3 (مستوى الاستدلال): اكتب بالحروف العدد المناسب: (5) طائرات.\nالإجابة: خمس طائرات.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ جملة «عندما كنت في الخامسة من عمري» ويشير إلى كلمة «كنت» ليبين أن ضياء هو المتكلم، ثم يكرران ذلك في جملة أخرى؛ وللتحقق يسأله: من الشخصية الرئيسة في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة كتابة جملتين من نص «ضياء في الفضاء» بضمير الغائب (كان ضياء…)، ثم يعدّون سؤالين يطرحونهما على ضياء عن الفضاء.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): رأيت في الصورة .... نجوم (5). (خمسة / خامس / خمس)\nالإجابة: خمسة.\n\nس2 (مستوى التطبيق): ضاع المفتاح ← المفتاح .... (ضيّع / ضائع / ضاع)\nالإجابة: ضاع.\n\nس3 (مستوى الاستدلال): استخرج من النص جملتين اسميتين.\nالإجابة: مثل: حلمي كبير، الصاروخ مستعد للانطلاق.", "- للطالب: حل أنشطة النمط اللغوي ص86–87 وكتابة جملتين لكل نمط: الجملة الاسمية، وتحويل الجملة الفعلية إلى اسمية والعكس، والعدد؛ التدرب على المهارة التي أخطأ فيها في الاختبار القصير.\n- لولي الأمر: متابعة ابنه في حل الأنشطة وتشجيعه على التحدث بجمل صحيحة؛ الاطلاع على ورقة الاختبار القصير ومتابعة التدريب العلاجي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=14"]}, {"k": "الإملاء", "p": ["مراجعة النمط الإملائي: التنوين من خلال نص «ضياء في الفضاء (مراجعة المحور الثاني)»", "مراجعة النمط الإملائي: التاء المربوطة والهاء من خلال نص «ضياء في الفضاء (مراجعة المحور الثاني)»", "مراجعة النمط الإملائي: علامات الترقيم من خلال نص «ضياء في الفضاء (مراجعة المحور الثاني)»"], "w": "الأسبوع السادس عشر: 20–24/12/2026م", "f": ["1. يصنف كلمات من نص «ضياء في الفضاء (مراجعة المحور الثاني)» وفق التنوين (10 دقائق)\n2. يكتب كلمات وجملًا تتضمن التنوين كتابة صحيحة (15 دقيقة)\n3. يصنف كلمات من نص «ضياء في الفضاء (مراجعة المحور الثاني)» وفق التاء المربوطة والهاء (10 دقائق)\n4. يكتب كلمات وجملًا تتضمن التاء المربوطة والهاء كتابة صحيحة (20 دقيقة)\n5. يصنف كلمات من نص «ضياء في الفضاء (مراجعة المحور الثاني)» وفق علامات الترقيم (15 دقيقة)\n6. يكتب كلمات وجملًا تتضمن علامات الترقيم كتابة صحيحة (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يميز الخطأ الإملائي في كلمة ويصححه (25 دقيقة)\n- يذكر أمثلة جديدة من خارج النص (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق", "1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. السؤال والجواب\n4. التعلم بالاكتشاف\n5. التعلم المبني على اللعب\n6. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات والجمل\n4. أخرى: السبورات الشخصية (الصغيرة)", "1. التنوين\n2. نون ساكنة تُنطق ولا تُكتب\n3. ألف تنوين الفتح\n4. التاء المربوطة والهاء\n5. الوصل والوقف\n6. آخر الكلمة\n7. علامات الترقيم\n8. الوقف\n9. الكلام المنقول", "ينطق المعلم (صاروخًا) ويسأل: ماذا نسمع في آخرها؟ هل نكتبها؟ ويلاحظ التلميذ التنوين (5 دقائق)", "1. مراجعة الظاهرة: يراجع المعلم الظاهرة ببطاقات سريعة يعرضها ويطلب تصنيفها شفويًا، ويصنف التلميذ البطاقات شفويًا (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشطة الكتاب (التنوين): يطلب المعلم استخراج الكلمات المنونة من نص المراجعة وتصنيفها حسب نوع التنوين (ص87–88)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n3. الإملاء المنقول (التنوين): يكتب المعلم على السبورة: «اشترى لي والداي زيًّا فضائيًّا وكتبًا كثيرةً.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. ملاحظة ظاهرة التاء المربوطة والهاء: يعرض المعلم جملًا من النص فيها كلمات ملونة: لعبة، رائدة، طائرة، بلاده، حلمه، نافذة، ويوجه الطلاب لقراءتها وملاحظة الظاهرة، ويوضح دون قواعد: التاء المربوطة (ة/ـة) تُنطق تاء عند الوصل وهاء عند الوقف (مرّة)، أما الهاء (ه/ـه) فتُنطق هاء دائمًا (وطنه)، ونعرفها بوصل الكلمة بما بعدها، ويقرأ التلميذ الكلمات ويلاحظ الظاهرة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التصنيف: يعرض المعلم فقرة الجدة ويطلب استخراج الكلمات التي تنتهي بالهاء (دونه، إليه، فيه، إنه) ثم مقارنتها بكلمات تنتهي بتاء مربوطة (مرة، صغيرة، سمكة) (ص87–88)، ويصنف التلميذ الكلمات في الجدول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الأمثلة: تقسم الفصل إلى مجموعتين، تذكر كل مجموعة كلمات تمثل جانبًا من الظاهرة، ومن يخطئ يخرج، ويذكر التلميذ أمثلة صحيحة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. أنشطة الكتاب (علامات الترقيم): يطلب المعلم وضع العلامات المناسبة في جملة ضياء بين الأقواس، ثم إعادة كتابتها (ص87–88)، ويتابع ويصحح فرديًا، ويحل التلميذ الأنشطة في الكتاب (15 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n8. الإملاء المنقول (علامات الترقيم): يكتب المعلم على السبورة: «قال ضياء: سأكون رائد فضاء، وسأكتب على الكواكب.» ويطلب نقلها بخط واضح مع مراعاة الظاهرة، وينقل التلميذ الفقرة بخط واضح (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n9. غلق الدرس – صاروخ الإملاء: يعرض المعلم صاروخًا من ثلاث مراحل (التنوين، التاء المربوطة والهاء، علامات الترقيم)، وتطلق كل مجموعة مرحلة حين تصحح جملة عن عمان كُتبت بخطأ مقصود (مثل: رفع ضياء علم بلادة)، ثم يقرأ الصف معًا الجملة الصحيحة: «عمانُ وطنٌ جميلٌ.» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نوع التنوين في (صاروخًا): (تنوين الفتح / تنوين الكسر / تنوين الضم)\nالإجابة: تنوين الفتح.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: آخر كلمة (بلاده): (هاء / تاء مربوطة)\nالإجابة: هاء.\n\nس3 (مستوى الاستدلال): ضع العلامات: (قال ضياء سأكون رائد فضاء وسأرفع علم عمان)\nالإجابة: قال ضياء: سأكون رائد فضاء، وسأرفع علم عمان.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ جملة «عندما كنت في الخامسة من عمري» ويشير إلى كلمة «كنت» ليبين أن ضياء هو المتكلم، ثم يكرران ذلك في جملة أخرى؛ وللتحقق يسأله: من الشخصية الرئيسة في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة كتابة جملتين من نص «ضياء في الفضاء» بضمير الغائب (كان ضياء…)، ثم يعدّون سؤالين يطرحونهما على ضياء عن الفضاء.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: العلامة في نهاية الجملة التامة: (النقطتان (:) / الفاصلة (،) / النقطة (.) / علامة الاستفهام (؟))\nالإجابة: النقطة (.)\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: آخر كلمة (حلمه): (هاء / تاء مربوطة)\nالإجابة: هاء.\n\nس3 (مستوى الاستدلال): اكتب كلمة (كوكب) بالتنوين الثلاثي.\nالإجابة: كوكبٌ، كوكبًا، كوكبٍ.", "- للطالب: حل أنشطة النمط الإملائي ص87–88 وكتابة خمس كلمات لكل ظاهرة: التنوين، والتاء المربوطة والهاء، وعلامات الترقيم.\n- لولي الأمر: إملاء ابنه خمس كلمات من الدرس ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=14"]}, {"k": "الخط", "p": ["الخط: كتابة الحروف (مراجعة حروف المحور (س ش ف ق ع غ)) بخط النسخ"], "w": "الأسبوع السادس عشر: 20–24/12/2026م", "f": ["1. يكتب الحروف (مراجعة حروف المحور (س ش ف ق ع غ)) مفردة ومتصلة في مواضعها المختلفة بخط النسخ (5 دقائق)\n2. يكتب الكلمات والجملة: «قال والدي: يا بني، الوطن شجرة تنمو بالتضحيات.» محاكيًا النموذج (25 دقيقة)\n\nمخرج تعليمي آخر:\n- يقارن كتابته بالنموذج ويحسنها (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: مجسمات الحروف والورق الشفاف", "1. خط النسخ\n2. خط القاعدة\n3. اتجاه الكتابة", "يعرض المعلم مجسمات الحروف (مراجعة حروف المحور (س ش ف ق ع غ)) بأشكالها المختلفة ويطلب من الطلاب ذكر كلمات فيها هذه الحروف، ويذكر كلمات تتضمن الحروف (5 دقائق)", "1. النمذجة على السبورة: يقسم المعلم السبورة قسمين، ويرسم خط القاعدة، ويكتب الحروف والكلمات (قال، والدي، الوطن، شجرة، تنمو، بالتضحيات) بخط كبير مع أسهم مرقمة توضح مسار الكتابة، ويتابع التلميذ اتجاه الكتابة ويرسم الحرف في الهواء (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المحاكاة في الكتاب: يطلب المعلم محاكاة النموذج (ص88) مع مراعاة الجلسة الصحيحة ومسكة القلم والتأني، ويمر بينهم ويكتب نموذجًا بخطه لمن يحتاج، ويوقف الصف عند الخطأ الشائع، ويحاكي التلميذ النموذج بتأنٍّ (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. لقب الخطاط: تكتب كل مجموعة الجملة: «قال والدي: يا بني، الوطن شجرة تنمو بالتضحيات.» ويختار أجود خط ليعلق في لوحة الصف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – شجرة الوطن: يرسم المعلم شجرة على السبورة، وتكتب كل مجموعة على ورقة شجر كلمة فيها حرف من حروف المحور تتصل بعمان (قلعة، شجرة، فلج، عمان) بخط النسخ وتلصقها على الشجرة، تذكيرًا بقول الوالد: «الوطن شجرة تنمو بالتضحيات» (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: كلمة فيها حرف القاف: (قال / تنمو / شجرة / والدي)\nالإجابة: قال.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: كلمة فيها حرف الشين: (الوطن / شجرة / قال / تنمو)\nالإجابة: شجرة.\n\nس3 (مستوى الاستدلال): اكتب كلمتين من الجملة فيهما حرفان من حروف المحور.\nالإجابة: مثل: قال (ق)، شجرة (ش).\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ جملة «عندما كنت في الخامسة من عمري» ويشير إلى كلمة «كنت» ليبين أن ضياء هو المتكلم، ثم يكرران ذلك في جملة أخرى؛ وللتحقق يسأله: من الشخصية الرئيسة في النص؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة كتابة جملتين من نص «ضياء في الفضاء» بضمير الغائب (كان ضياء…)، ثم يعدّون سؤالين يطرحونهما على ضياء عن الفضاء.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: شبّه الوالد الوطن بـ: (شجرة / بيت / بحر / نجمة)\nالإجابة: شجرة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: تنمو شجرة الوطن بـ: (الكسل / اللعب / التضحيات / النوم)\nالإجابة: التضحيات.\n\nس3 (مستوى الاستدلال): اكتب الجملة (قال والدي: يا بني، الوطن شجرة تنمو بالتضحيات.) بخط النسخ.\nالإجابة: كتابة الجملة بحروف متناسقة مع علامات الترقيم.", "- للطالب: إكمال صفحة الخط ص88 وكتابة الجملة مرتين بخط جميل.\n- لولي الأمر: متابعة جلسة ابنه ومسكته للقلم أثناء الكتابة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=14"]}, {"k": "التعبير", "p": ["التعبير الكتابي: وصف علم بلادي عمان (الإعداد والتخطيط)", "التعبير الكتابي: وصف علم بلادي عمان (الكتابة والمراجعة)"], "w": "الأسبوع السادس عشر: 20–24/12/2026م", "f": ["1. يرتب الأفكار والأحداث للكتابة في: وصف علم بلادي عمان (25 دقيقة)\n2. يتحدث شفويًا عن موضوع الكتابة في درس «ضياء في الفضاء (مراجعة المحور الثاني)» بجمل مترابطة (5 دقائق)\n3. يكتب وصف علم بلادي عمان بجمل مترابطة (20 دقيقة)\n4. يراعي علامات الترقيم والنظافة في كتابته (5 دقائق)\n\nمخرج تعليمي آخر:\n- يتحدث عن الصور بجمل سليمة قبل الكتابة (10 دقائق)\n- يقيّم كتابته وكتابة زميله ويحسنها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التعلم الذاتي\n5. تعلم الأقران\n6. التقويم الذاتي\n7. التعلم المبني على المشاريع", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. التعبير الكتابي\n2. ترتيب الأفكار\n3. علامات الترقيم", "يرفع المعلم علم عمان صغيرًا ويطلب من الطلاب ذكر ما يعرفونه عنه، ويذكر التلميذ معلومة عن العلم (5 دقائق)", "1. التمهيد بالأسئلة: يطرح المعلم أسئلة ممهدة: ما ألوان علم عمان؟ ماذا يوجد في زاويته؟ متى نرى العلم مرفوعًا؟ بماذا تشعر عندما تراه؟ ويجيب التلميذ ويستدعي خبرته (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. تأمل الصور والجمل: يعرض المعلم علم عمان ويطلب تلوينه في الكتاب، ثم يناقش ألوانه (الأحمر، الأبيض، الأخضر) ومكوناته (الشعار: الخنجر والسيفان) ومواضع رفعه (ص89)، ويتأمل التلميذ الصور ويتحدث عنها مع مجموعته (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التخطيط الشفوي: يطلب المعلم من كل مجموعة ترتيب الأفكار شفويًا (البداية، الأحداث، النهاية) وعرضها، ويرتب التلميذ الأفكار ويعرضها شفويًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مراجعة الخطة: يراجع المعلم مع الطلاب الأفكار المرتبة ويكتب كلمات مساعدة على السبورة، ويراجع التلميذ خطته (6 دقائق)\nالاستراتيجيات: تعلم الأقران.\n\n5. الكتابة الفردية: يطلب المعلم كتابة وصف لعلم عمان من حيث ألوانه ومكوناته في ثلاث جمل مترابطة، وختمها بجملة عن مشاعره نحو وطنه (ص89)، ويمر بين الطلاب ويوجههم، ويكتب علي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=14"]}]}, {"t": "قصة أعجبتني (الثانية)", "u": "المحور الثاني: وطني", "s": [{"k": "التحدث", "p": ["قصة أعجبتني (الثانية): تلخيص القصة شفويًا أمام الزملاء"], "w": "الأسبوع السادس عشر: 20–24/12/2026م", "f": ["1. يلخص قصته عن (حب الوطن والانتماء إليه) شفويًا بترتيب منطقي (20 دقيقة)\n2. يربط عبرة قصته بموضوع المحور (حب الوطن والانتماء إليه) (5 دقائق)\n\nمخرج تعليمي آخر:\n- يقيّم تلخيص زميله (15 دقيقة)", "المخرج 1: إبداع\nالمخرج 2: تقييم\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. تعلم الأقران", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. أخرى: بطاقات الكلمات والجمل\n5. أخرى: قصص المكتبة الصفية\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. القراءة الحرة\n2. عناصر القصة\n3. التلخيص", "يضع المعلم كرسيًا مميزًا لمن سيلخص قصته عن (حب الوطن والانتماء إليه)، ويستعد التلميذ للتلخيص (5 دقائق)", "1. التدرب على التلخيص: يعرض المعلم خطوات التلخيص (العنوان، الشخصيات، أهم الأحداث، النهاية، رأيي)، ويرتب التلميذ أفكاره (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التلخيص الشفوي: يجلس الطلاب على كرسي الراوي ويلخصون قصصهم شفويًا (ص90–92)، ويلخص التلميذ قصته أمام زملائه (11 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n3. التقييم: يقيّم الطلاب التلخيص وفق معايير (الترتيب، الوضوح، اللغة)، ويقيّم التلميذ تلخيص زملائه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس – مشهد حب الوطن: يعرض كل طالب على مجموعته موقفًا من قصته يدل على حب الوطن، وتختار المجموعة أجمل موقف وتمثّله في مشهد قصير، ثم تقول جملة عن واجبنا نحو عمان (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نربط عبرة القصة بموضوع: (الرياضيات / المحور الثاني (وطني) / الأسعار / الطقس)\nالإجابة: المحور الثاني (وطني)\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: عند تلخيص القصة شفويًا نبدأ بـ: (العنوان والشخصيات / الصفحة الأخيرة / النهاية / الرسام)\nالإجابة: العنوان والشخصيات.\n\nس3 (مستوى الاستدلال): لخص قصتك عن (حب الوطن والانتماء إليه) في ثلاث جمل.\nالإجابة: يلخص البداية والأحداث والنهاية.\n\n• نشاط علاجي (لمن لم يتقن): يقدّم المعلم للتلميذ قصة قصيرة مصورة عن حب الوطن، ويقرأ معه العنوان واسم الكاتب ويتأملان الصور ليتأكد أنها تناسبه، ثم يقرأ معه صفحتين؛ وللتحقق يسأله: عن أي شيء تتحدث قصتك؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتلخيص قصتهم عن حب الوطن والانتماء إليه في ثلاث جمل واستخراج عبرتها، ثم يقارنونها بالقصة التي قرؤوها في المحور الأول من حيث الشخصيات والمكان.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نتحدث أمام زملائنا بـ: (صراخ / كلمات متقطعة / همس / صوت واضح ولغة سليمة)\nالإجابة: صوت واضح ولغة سليمة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نرتب أحداث القصة: (لا نرتبها / النهاية أولًا / البداية ثم الأحداث ثم النهاية / عشوائيًا)\nالإجابة: البداية ثم الأحداث ثم النهاية.\n\nس3 (مستوى الاستدلال): بماذا تنصح زملاءك عن قصتك في موضوع (حب الوطن والانتماء إليه)؟\nالإجابة: ينصح بقراءتها أو لا ويعلل.", "- للطالب: قراءة قصة جديدة وتلخيصها للأسرة.\n- لولي الأمر: تشجيع ابنه على القراءة اليومية ومناقشته فيما يقرأ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=15"]}, {"k": "القراءة", "p": ["قصة أعجبتني (الثانية): اختيار قصة وقراءتها قراءة حرة", "قصة أعجبتني (الثانية): تعبئة استمارة القصة"], "w": "الأسبوع السادس عشر: 20–24/12/2026م", "f": ["1. يختار قصة مناسبة لمستواه في موضوع (حب الوطن والانتماء إليه) (10 دقائق)\n2. يقرأ قصته عن (حب الوطن والانتماء إليه) قراءة صامتة واعية (15 دقيقة)\n3. يحدد عناصر قصته عن (حب الوطن والانتماء إليه): العنوان، الكاتب، الشخصيات، المكان (20 دقيقة)\n4. يكتب ما أعجبه وما لم يعجبه في قصته (المحور الثاني) (5 دقائق)\n\nمخرج تعليمي آخر:\n- يعلل سبب اختياره القصة (15 دقيقة)\n- يستخرج العبرة من القصة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تقييم\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تحليل", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. تعلم الأقران", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. أخرى: بطاقات الكلمات والجمل\n5. أخرى: قصص المكتبة الصفية", "1. القراءة الحرة\n2. عناصر القصة\n3. التلخيص", "يعرض مجموعة قصص من المكتبة الصفية في موضوع (حب الوطن والانتماء إليه) ويقرأ عناوينها بتشويق، ويختار التلميذ قصة تجذبه (5 دقائق)", "1. اختيار القصة: يصحب الطلاب إلى ركن القراءة أو مركز مصادر التعلم ويرشدهم إلى اختيار قصة مناسبة (ص90–92)، ويختار التلميذ قصة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. القراءة الصامتة: يوجه المعلم إلى قراءة صامتة بتركيز ويتابع ويساعد من يحتاج، ويقرأ التلميذ قراءة صامتة (16 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n3. حديث سريع: يسأل بعض الطلاب عن أول انطباع لهم عن قصصهم، ويتحدث التلميذ عن انطباعه (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. شرح الاستمارة: يعرض المعلم استمارة «قصة أعجبتني» (ص90–92) ويوضح عناصرها، ويتعرف التلميذ العناصر (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعبئة الاستمارة: يطلب المعلم تعبئة الاستمارة: العنوان، الكاتب، الشخصيات، المكان، ما أعجبني، ما لم يعجبني، العبرة، ويعبئ التلميذ الاستمارة (16 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. مشاركة ثنائية: يتبادل كل طالبين الاستمارتين ويقرأ كل منهما ما كتبه زميله، ويقرأ التلميذ استمارة زميله (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. غلق الدرس – رف قصص من وطني: تضع كل مجموعة قصصها على رف «قصص من وطني»، ويشوّق كل طالب زملاءه لقصته بجملة واحدة، ثم يكمل كل طالب: «أحب عمان لأن…» (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: موضوع قصص هذه الحصة: (السيارات / الرياضة / حب الوطن والانتماء إليه / الطبخ)\nالإجابة: حب الوطن والانتماء إليه.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: نكتب في استمارة القصة: (العنوان والكاتب والشخصيات / لا شيء / الألوان فقط / أرقام الهواتف)\nالإجابة: العنوان والكاتب والشخصيات.\n\nس3 (مستوى الاستدلال): ما العبرة التي تعلمتها من قصتك عن (حب الوطن والانتماء إليه)؟\nالإجابة: يذكر عبرة مناسبة لقصته.\n\n• نشاط علاجي (لمن لم يتقن): يقدّم المعلم للتلميذ قصة قصيرة مصورة عن حب الوطن، ويقرأ معه العنوان واسم الكاتب ويتأملان الصور ليتأكد أنها تناسبه، ثم يقرأ معه صفحتين؛ وللتحقق يسأله: عن أي شيء تتحدث قصتك؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتلخيص قصتهم عن حب الوطن والانتماء إليه في ثلاث جمل واستخراج عبرتها، ثم يقارنونها بالقصة التي قرؤوها في المحور الأول من حيث الشخصيات والمكان.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نجد القصص في: (سلة المهملات / مكتبة المدرسة ومركز مصادر التعلم / الشارع / المطبخ فقط)\nالإجابة: مكتبة المدرسة ومركز مصادر التعلم.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: مكان القصة هو: (الموضع الذي جرت فيه الأحداث / العنوان / الصفحة / اسم الكاتب)\nالإجابة: الموضع الذي جرت فيه الأحداث.\n\nس3 (مستوى الاستدلال): ما أول انطباع لك عن قصتك في موضوع (حب الوطن والانتماء إليه)؟\nالإجابة: يعبر عن انطباعه في جملة.", "- للطالب: إكمال قراءة القصة في البيت؛ إكمال استمارة القصة.\n- لولي الأمر: تشجيع ابنه على القراءة اليومية ومناقشته فيما يقرأ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=15"]}]}, {"t": "مراجعة المحاور", "u": "المحوران الأول والثاني", "s": [{"k": "التحدث", "p": ["الأناشيد والاستماع: مراجعة «صباح الخير» و«أزهار الخمائل» ونصي الاستماع"], "w": "الأسبوع السابع عشر: 27–30/12/2026م", "f": ["1. ينشد الأنشودتين إنشادًا معبرًا (15 دقيقة)\n2. يسترجع أفكار نصي الاستماع (أتسوق مع أسرتي، الذكرى الخالدة) (10 دقائق)\n\nمخرج تعليمي آخر:\n- يربط قيم الأناشيد والاستماع بحياته (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج الآخر: تحليل", "1. الإنشاد والترديد\n2. التعلم بالنمذجة\n3. التعلم التعاوني", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية", "1. الإنشاد\n2. الاستماع\n3. القيم", "يبدأ المعلم بإنشاد مطلع «صباح الخير» ويكمل الطلاب، ويكمل التلميذ الإنشاد (5 دقائق)", "1. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن مراجعة المحاور، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أسئلة الاستماع: يطرح المعلم أسئلة سريعة عن نصي الاستماع (قائمة التسوق، شمساء الخليلية)، ويجيب التلميذ (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. قيمة وحياة: يطلب المعلم من كل طالب ذكر قيمة من الأناشيد أو الاستماع يطبقها في حياته، ويذكر التلميذ قيمة (6 دقائق)\nالاستراتيجيات: الإنشاد والترديد.\n\n4. غلق الدرس – القدوة العمانية: يقف الطلاب في دائرة ويمرر المعلم كرة، فيقول من تصله قيمة من الأناشيد أو نصي الاستماع يطبقها في حياته، ويذكر بعضهم قدوة عمانية مثل العالمة شمساء الخليلية، ثم ينشد الجميع مطلع «أزهار الخمائل» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: شاعر «صباح الخير»: (زهران القاسمي / مصطفى عكرمة / إبراهيم عباس ياسين / نزار نجار)\nالإجابة: مصطفى عكرمة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: معنى (الخمائل): (الصحراء / الشجر الجاف / البحر / الشجر الكثيف)\nالإجابة: الشجر الكثيف.\n\nس3 (مستوى الاستدلال): أنشد مقطعًا من «أزهار الخمائل».\nالإجابة: إنشاد صحيح.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات بعناوين نصوص المحور الأول (لعبتي، سيكبرون، ليس هذا ضعفًا) وصورة من كل نص، ويطابق التلميذ العنوان بالصورة مع زميل؛ وللتحقق يسأله: في أي نص ضاعت الدمية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يربط كل نص من نصوص المحورين بقيمته (لعبتي: المحافظة على الممتلكات، نور تحب قريتها: حب الوطن)، ثم يكتبون جملة عن حبهم لوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: لم تشتر الأسرة المشروبات الغازية لأنها: (غالية / غير موجودة في القائمة / نفدت / ممنوعة)\nالإجابة: غير موجودة في القائمة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: وُلدت العالمة شمساء الخليلية في: (نزوى / صور / صحار / بوشر)\nالإجابة: بوشر.\n\nس3 (مستوى الاستدلال): اذكر قيمة تعلمتها من نص «الذكرى الخالدة».\nالإجابة: اختيار القدوة الحسنة وطلب العلم.", "- للطالب: إنشاد الأنشودتين للأسرة.\n- لولي الأمر: الاستماع إلى ابنه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=16"]}, {"k": "القراءة", "p": ["مراجعة نصوص المحور الأول (لعبتي، سيكبرون، ليس هذا ضعفًا): الفهم والقيم", "مراجعة نصوص المحور الثاني (نور تحب قريتها، ليلى ترسم وطنًا، البحر يتسع للجميع): الفهم والقيم", "مراجعة التحليل والتركيب والحروف المتقاربة"], "w": "الأسبوع السابع عشر: 27–30/12/2026م", "f": ["1. يسترجع أحداث نصوص المحور الأول وشخصياتها (15 دقيقة)\n2. يستخلص القيم من نصوص المحور الأول (10 دقائق)\n3. يسترجع أحداث نصوص المحور الثاني وشخصياتها (15 دقيقة)\n4. يستنتج الفكرة المشتركة بين نصوص المحور (حب الوطن) (10 دقائق)\n5. يحلل الكلمات إلى مقاطع والجمل إلى كلمات (15 دقيقة)\n6. يميز الحروف المتقاربة (ص ض ط ظ، ج ح خ، س ش) (10 دقائق)\n\nمخرج تعليمي آخر:\n- يقارن بين شخصيات نصوص المحور (15 دقيقة)\n- يكتب جملة يعبر بها عن حبه لوطنه (15 دقيقة)\n- يركب جملًا من كلمات مبعثرة (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تذكر\nالمخرج 4: تحليل\nالمخرج 5: تحليل\nالمخرج 6: تحليل\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: إبداع\nالمخرج الآخر 3: تطبيق", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. تعلم الأقران\n4. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. أخرى: بطاقات الكلمات والجمل\n5. أخرى: السبورات الشخصية (الصغيرة)", "1. حياتي\n2. القيم\n3. وطني\n4. الانتماء\n5. المقاطع\n6. الحروف المتقاربة", "يقرأ المعلم عبارات من النصوص (سيكبرون، ليس هذا ضعفًا مني) ويسأل: من قالها؟ وفي أي نص؟ ويحدد التلميذ القائل والنص (5 دقائق)", "1. محطة نصوص المحور الأول: يوزع المعلم بطاقات أحداث مختلطة من النصوص الثلاثة ويطلب تصنيفها حسب النص ثم ترتيبها، ويصنف التلميذ ويرتب الأحداث (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. القيم: يطلب المعلم من كل مجموعة استخراج قيمة من كل نص (المحافظة على الممتلكات، النظام وبر الوالدين، التسامح وحق الجار)، ويستخرج التلميذ القيم (11 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n3. مقارنة الشخصيات: يقارن المعلم مع الطلاب بين سعاد وسليم والأم في الصفات، ويقارن التلميذ بين الشخصيات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. محطة نصوص المحور الثاني: يوزع المعلم بطاقات أحداث وشخصيات من النصوص الثلاثة ويطلب تصنيفها حسب النص، ويصنف التلميذ البطاقات (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الفكرة المشتركة: يناقش المعلم: ما الذي يجمع نور وليلى والأسماك الصغيرة؟ ويصل إلى حب الوطن والتمسك به، ويستنتج التلميذ الفكرة المشتركة (11 دقيقة)\nالاستراتيجيات: تعلم الأقران.\n\n6. جملة لوطني: يطلب المعلم كتابة جملة عن حب الوطن تعلق في لوحة الصف، ويكتب التلميذ جملته (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. التحليل: يعرض كلمات وجملًا من النصوص ويطلب تحليلها إلى مقاطع وكلمات، ويحلل التلميذ (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. الحروف المتقاربة: يملي كلمات فيها حروف متقاربة ويطلب كتابتها وتصحيحها، ويكتب التلميذ ويصحح (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. التركيب: يوزع المعلم بطاقات كلمات مبعثرة لتكوين جمل، ويركب التلميذ الجمل (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – من القائل؟: يقرأ المعلم عبارة من نصوص المحورين، فتتسابق المجموعات في ذكر النص والقائل، ثم تذكر المجموعة الفائزة قيمة عمانية تعلمتها من ذلك النص (التسامح، حب الوطن، بر الوالدين) (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: ضاعت الدمية في نص: (لعبتي / نور تحب قريتها / ليس هذا ضعفًا / سيكبرون)\nالإجابة: لعبتي.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: قالت الجدة إن البيت هو الوطن الصغير لـ: (يحيى / ليلى / ضياء / نور)\nالإجابة: ليلى.\n\nس3 (مستوى الاستدلال): حلل (الوطن) إلى مقاطع.\nالإجابة: الْ/ وَ/ طَنُ.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات بعناوين نصوص المحور الأول (لعبتي، سيكبرون، ليس هذا ضعفًا) وصورة من كل نص، ويطابق التلميذ العنوان بالصورة مع زميل؛ وللتحقق يسأله: في أي نص ضاعت الدمية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يربط كل نص من نصوص المحورين بقيمته (لعبتي: المحافظة على الممتلكات، نور تحب قريتها: حب الوطن)، ثم يكتبون جملة عن حبهم لوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: قيمة نص «ليس هذا ضعفًا»: (التسامح وحق الجار / الغضب / الإسراف / الكسل)\nالإجابة: التسامح وحق الجار.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الفكرة المشتركة بين نصوص المحور الثاني: (حب الوطن والتمسك به / حب السفر / الصيد / الرسم)\nالإجابة: حب الوطن والتمسك به.\n\nس3 (مستوى الاستدلال): رتب: (الصغير - الوطن - هو - البيت).\nالإجابة: البيت هو الوطن الصغير.", "- للطالب: إعادة قراءة نصوص المحور الأول؛ إعادة قراءة نصوص المحور الثاني؛ تحليل خمس كلما سافر)» (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس – نخلة القيم العمانية: يرسم المعلم نخلة على السبورة، وتضيف كل مجموعة سعفة تكتب عليها قيمة تعلمتها من نصوص المحورين كالتعاون وحب الوطن، ثم تذكر شخصية من النصوص تمثل هذه القيمة (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الجملة الاسمية: (أحب وطني / الوطن جميل / رسمت ليلى / لعبت سعاد)\nالإجابة: الوطن جميل.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حوّل إلى فعلية: (ليلى رسمت حصانًا): (رسمت حصانًا / رسمت ليلى حصانًا / ليلى حصانًا / حصان ليلى)\nالإجابة: رسمت ليلى حصانًا.\n\nس3 (مستوى الاستدلال): اكتب جملة اسمية عن وطنك.\nالإجابة: مثل: عمان جميلة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات بعناوين نصوص المحور الأول (لعبتي، سيكبرون، ليس هذا ضعفًا) وصورة من كل نص، ويطابق التلميذ العنوان بالصورة مع زميل؛ وللتحقق يسأله: في أي نص ضاعت الدمية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يربط كل نص من نصوص المحورين بقيمته (لعبتي: المحافظة على الممتلكات، نور تحب قريتها: حب الوطن)، ثم يكتبون جملة عن حبهم لوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: ظرف المكان في (جلست تحت الشجرة): (الشجرة / جلست / تحت / لا يوجد)\nالإجابة: تحت.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: حرف الجر في (سافر إلى صلالة): (صلالة / لا يوجد / إلى / سافر)\nالإجابة: إلى.\n\nس3 (مستوى الاستدلال): اكتب ثلاث جمل عن مدرستك توظف نمطين.\nالإجابة: مثل: في الصباح نذهب إلى المدرسة. مدرستي جميلة. فيها خمسة فصول.", "- للطالب: كتابة مثال لكل نمط لغوي في الدفتر؛ مراجعة المهارات التي أخطأ فيها في الاختبار.\n- لولي الأمر: مراجعة الأنماط اللغوية مع ابنه بأمثلة من حياته؛ الاطلاع على نتيجة الاختبار ومتابعة ابنه في الإجازة بالقراءة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=16"]}, {"k": "الإملاء", "p": ["مراجعة الأنماط الإملائية للمحورين (ال، التاء والهاء، التنوين، علامات الترقيم)"], "w": "الأسبوع السابع عشر: 27–30/12/2026م", "f": ["1. يميز الظواهر الإملائية التي تعلمها في المحوري
