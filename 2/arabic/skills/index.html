 / تنوين الضم / تنوين الفتح)\nالإجابة: تنوين الفتح.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: العلامة بعد (قالت الأم): (النقطتان (:) / النقطة (.) / الفاصلة (،) / علامة الاستفهام (؟))\nالإجابة: النقطتان (:)\n\nس3 (مستوى الاستدلال): ضع العلامات: (قال المعلم من يحب القراءة)\nالإجابة: قال المعلم: من يحب القراءة؟", "- للطالب: كتابة خمس كلمات لكل ظاهرة إملائية.\n- لولي الأمر: إملاء ابنه جملًا قصيرة ومتابعة تصحيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=16"]}, {"k": "الخط", "p": ["مراجعة الخط: حروف المحورين بخط النسخ"], "w": "الأسبوع السابع عشر: 27–30/12/2026م", "f": ["1. يكتب حروف المحورين (ب ت ث ج ح خ ص ض س ش ف ق ع غ) بخط النسخ (10 دقائق)\n2. يراعي التناسق والمسافات (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يقيّم خطه ويحسنه (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: السبورات الشخصية (الصغيرة)", "1. خط النسخ", "يذكر المعلم حرفًا ويطلب كلمة من نصوص المحور فيها هذا الحرف، ويذكر كلمة (5 دقائق)", "1. النمذجة: يكتب المعلم الحروف الأكثر صعوبة (ص، ق، ع، ح) مع اتجاه الكتابة، ويتابع التلميذ الاتجاه (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. المحاكاة: يطلب المعلم كتابة جملة لكل محور: (احرص على إرضاء والديك) و(البيت هو العش الدافئ)، ويكتب التلميذ الجملتين (9 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. معرض الخط: يعلق المعلم أجمل الخطوط في لوحة الصف ويناقش سبب جمالها، ويشارك التلميذ في المعرض (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – بطاقة لوطني: تكتب كل مجموعة جملة «عمان وطني الغالي» بخط النسخ على بطاقة ملونة، وتتنافس في التناسق والتأني، ثم تعلق البطاقات في معرض الخط (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف الذي ينزل تحت السطر: (التاء / القاف / الفاء / الباء)\nالإجابة: القاف.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: عدد نقاط الشين: (اثنتان / لا شيء / ثلاث / واحدة)\nالإجابة: ثلاث.\n\nس3 (مستوى الاستدلال): اكتب كلمتين فيهما (ق) و(ع).\nالإجابة: مثل: قرية، عش.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات بعناوين نصوص المحور الأول (لعبتي، سيكبرون، ليس هذا ضعفًا) وصورة من كل نص، ويطابق التلميذ العنوان بالصورة مع زميل؛ وللتحقق يسأله: في أي نص ضاعت الدمية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يربط كل نص من نصوص المحورين بقيمته (لعبتي: المحافظة على الممتلكات، نور تحب قريتها: حب الوطن)، ثم يكتبون جملة عن حبهم لوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: الحرف الذي فوقه نقطة: (الحاء / العين / الصاد / الغين)\nالإجابة: الغين.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: سر جمال الخط: (التناسق والتأني / السرعة / الكتابة الكبيرة جدًا / كثرة الشطب)\nالإجابة: التناسق والتأني.\n\nس3 (مستوى الاستدلال): اكتب جملة (البيت هو العش الدافئ) بخط النسخ.\nالإجابة: كتابة متناسقة على السطر.", "- للطالب: التدرب على كتابة حروف المحورين في كراسة الخط.\n- لولي الأمر: متابعة خط ابنه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=16"]}, {"k": "التعبير", "p": ["مراجعة التعبير الكتابي: كتابة قصة قصيرة أو وصف صورة"], "w": "الأسبوع السابع عشر: 27–30/12/2026م", "f": ["1. يرتب أحداث قصة قصيرة ويكتبها بجمل مترابطة (10 دقائق)\n2. يصف صورة في ثلاث جمل (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يراجع كتابته ويصحح أخطاءه (15 دقيقة)", "المخرج 1: إبداع\nالمخرج 2: إبداع\nالمخرج الآخر: تقييم", "1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. التقويم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: السبورات الشخصية (الصغيرة)", "1. التعبير الكتابي\n2. الترابط\n3. الترقيم", "يعرض المعلم صورة أسرة في رحلة داخل عمان ويسأل: ماذا حدث؟ ويقترح أحداثًا (5 دقائق)", "1. التخطيط الشفوي: يطلب المعلم من المجموعات ترتيب أحداث القصة شفويًا (البداية، الأحداث، النهاية)، ويرتب التلميذ الأحداث (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الكتابة: يطلب المعلم كتابة قصة قصيرة أو وصف للصورة في ثلاث إلى أربع جمل مع أدوات الربط والترقيم، ويكتب التلميذ (9 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. القراءة والتقييم: يقرأ بعض الطلاب ما كتبوه ويقيّم الصف الترتيب والترقيم، ويقرأ التلميذ ويقيّم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – رحلة في عمان: تسحب كل مجموعة صورة لمكان عماني (الجبل الأخضر، قلعة نزوى، شاطئ صلالة) وتكتب عنه جملتين مترابطتين بأدوات الربط، ثم تقرؤهما على الصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نبدأ القصة بـ: (البداية والشخصيات / العبرة فقط / النهاية / العنوان فقط)\nالإجابة: البداية والشخصيات.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: أداة ربط تدل على الترتيب: (هل / لم / ثم / تحت)\nالإجابة: ثم.\n\nس3 (مستوى الاستدلال): رتب شفويًا أحداث رحلة الأسرة.\nالإجابة: استعدت الأسرة، ثم سافرت، ثم استمتعت، وأخيرًا عادت إلى البيت.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات بعناوين نصوص المحور الأول (لعبتي، سيكبرون، ليس هذا ضعفًا) وصورة من كل نص، ويطابق التلميذ العنوان بالصورة مع زميل؛ وللتحقق يسأله: في أي نص ضاعت الدمية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يربط كل نص من نصوص المحورين بقيمته (لعبتي: المحافظة على الممتلكات، نور تحب قريتها: حب الوطن)، ثم يكتبون جملة عن حبهم لوطنهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر الإجابة الصحيحة: نضع في نهاية الجملة الخبرية: (علامة الاستفهام / النقطة / الفاصلة / النقطتين)\nالإجابة: النقطة.\n\nس2 (مستوى التطبيق): اختر الإجابة الصحيحة: الكتابة الجيدة: (مكررة / بلا فكرة / مترابطة ومرتبة / بلا ترقيم)\nالإجابة: مترابطة ومرتبة.\n\nس3 (مستوى الاستدلال): اكتب وصفًا للصورة في ثلاث جمل.\nالإجابة: مثل: خرجت الأسرة في رحلة إلى الجبل الأخضر. استمتعوا بالجو البارد. عادوا مساءً سعداء.", "- للطالب: كتابة قصة قصيرة عن رحلة مع أسرته.\n- لولي الأمر: قراءة قصة ابنه وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/2/arabic/?l=16"]}]}]</script>

  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done,function(){fb(t);done()}); else { fb(t); done(); } }
