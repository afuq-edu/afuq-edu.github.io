:root{--bg1:#f3f7ff;--bg2:#fdf6fb;--ink:#2d3a4a;--soft:#6f7f92;--card:#ffffff;--line:#e3e9f2;--ok:#3aa86b;--okL:#e7f7ee;--no:#e0626b;--noL:#fdecee;--acc:#5b8def;--accL:#eaf1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Andika',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
.bgdots{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgdots span{position:absolute;border-radius:50%;opacity:.35;filter:blur(1px);animation:float 18s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px 16px 30px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-weight:700;color:#3d5a80;font-size:clamp(16px,2.2vw,22px);display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;color:#4a5d73;box-shadow:0 1px 3px rgba(40,60,90,.06)}
.iconbtn:hover{background:#f7f9fc}
.screen{display:none;animation:fadein .45s ease}
.screen.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 30px rgba(60,80,120,.08);padding:18px 20px}
h1{font-size:clamp(24px,3.4vw,38px);margin:4px 0 6px;color:#2f4b75}
.lead{color:var(--soft);margin:0 0 14px}
.step{margin:14px 0}
.step h3{margin:0 0 8px;font-size:17px;color:#3d5a80;display:flex;align-items:center;gap:8px}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--accL);color:var(--acc);align-items:center;justify-content:center;font-size:14px}
select,input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cfdaea;border-radius:12px;background:#fff;color:var(--ink);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #cfdaea;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;color:#4a5d73;transition:.2s;text-align:left}
.chip.on{background:var(--accL);border-color:#9fbaf2;color:#2f5fc4;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.gname{display:flex;align-items:center;gap:8px}
.gname .sw{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 34px}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid #cfdaea;background:#fff;font-size:22px;cursor:pointer;color:#3d5a80}
.stepper b{font-size:24px;min-width:28px;text-align:center}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:99px;background:#e3eaf5;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#6fa3ff,#8f7cf7);border:3px solid #fff;box-shadow:0 2px 6px rgba(80,100,200,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#7d93f5;border:3px solid #fff}
.big{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:16px;padding:14px 28px;background:linear-gradient(135deg,#6fa3ff,#8f7cf7);color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(100,120,240,.3);transition:transform .15s}
.big:hover{transform:translateY(-2px)}
.big.ghost{background:#fff;color:#4a5d73;border:1px solid var(--line);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--soft);font-size:14px}
/* question screen */
.qhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.prog{flex:1 1 260px;height:10px;background:#e8eef7;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fb2ff,#a58cf8);border-radius:99px;transition:width .6s ease}
.turn{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gchip{display:flex;align-items:center;gap:6px;border:2px solid transparent;border-radius:999px;padding:5px 12px 5px 6px;background:#fff;cursor:pointer;font:inherit;color:var(--ink);transition:.25s;box-shadow:0 1px 3px rgba(40,60,90,.08)}
.gchip .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.gchip.on{transform:scale(1.07);font-weight:700}
.qwrap{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.qwrap{grid-template-columns:1fr}.timer{flex-direction:row;flex-wrap:wrap;justify-content:space-between;padding:10px 12px}.ring{width:96px;height:96px}.ring .t b{font-size:30px}.ring .t small{font-size:11px}.pts{min-width:110px}.brand{font-size:15px}.iconbtn{padding:6px 9px;font-size:14px}.chart{height:250px}}
.timer{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{position:relative;width:170px;height:170px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:46px;line-height:1}
.ring .t small{color:var(--soft)}
.pts{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 12px;text-align:center;min-width:150px}
.pts b{font-size:22px;color:#2f5fc4}
.qcard{padding:20px 22px}
.qtype{display:inline-block;background:#f1edfc;color:#6b54b8;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;margin-bottom:6px}
.lv{display:inline-block;margin-left:6px;font-size:13px;color:var(--soft)}
.qtext{font-size:clamp(22px,3vw,34px);font-weight:700;margin:6px 0 10px;line-height:1.3}
.qemoji{font-size:clamp(56px,9vw,96px);line-height:1.1;margin:4px 0 10px;text-align:center}
.swatch{display:inline-block;width:110px;height:110px;border-radius:50%;border:3px solid #dfe6ef;box-shadow:inset 0 -8px 16px rgba(0,0,0,.08)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.opt{font:inherit;font-size:clamp(18px,2.3vw,26px);text-align:left;padding:16px 18px;border-radius:18px;border:2px solid #dfe6f1;background:#fbfcff;cursor:pointer;transition:transform .15s,background .25s,border-color .25s;display:flex;gap:12px;align-items:center;color:var(--ink)}
.opt:hover{transform:translateY(-2px);border-color:#b9cdf0}
.opt .k{flex:0 0 36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.opt.picopt{justify-content:center;font-size:clamp(48px,7vw,80px);padding:12px}
.opt.ok{background:var(--okL);border-color:#8fd3ad}
.opt.no{background:var(--noL);border-color:#f0a9af}
.opt.dim{opacity:.45}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfrow .opt{justify-content:center;font-size:clamp(22px,3vw,32px);font-weight:700}
.tiles,.slots{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:10px;border-radius:16px}
.slots{background:#f5f8fd;border:2px dashed #cfdbee;margin-bottom:10px}
.tile{font:inherit;font-size:clamp(20px,2.6vw,28px);padding:10px 16px;border-radius:14px;border:2px solid #d8e2f0;background:#fff;cursor:pointer;transition:transform .15s;box-shadow:0 2px 0 #dfe6f0}
.tile:hover{transform:translateY(-2px)}
.tile.used{visibility:hidden}
.slots .tile{background:#eef4ff;border-color:#b6cbf2}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.small{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;color:#4a5d73}
.feedback{margin-top:14px;border-radius:18px;padding:14px 16px;display:none;align-items:center;gap:14px;flex-wrap:wrap;animation:pop .35s ease}
.feedback.show{display:flex}
.feedback.ok{background:var(--okL);border:1px solid #9fdab9}
.feedback.no{background:var(--noL);border:1px solid #f2b8bd}
.feedback .msg{flex:1 1 260px;font-size:20px}
.feedback .plus{font-size:28px;font-weight:700;color:var(--ok)}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
/* results */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:330px;padding:20px 10px 0;border-bottom:2px solid #e3e9f2;margin:10px 0 8px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:clamp(56px,11vw,110px);height:100%;position:relative}
.bar .col{width:100%;border-radius:16px 16px 6px 6px;height:4px;transition:height 1.1s cubic-bezier(.2,.9,.25,1.1);position:relative;box-shadow:0 6px 16px rgba(60,80,120,.12)}
.bar .val{font-weight:700;font-size:20px;margin-bottom:6px;transition:.3s}
.bar .rank{position:absolute;top:-4px;font-size:13px;color:var(--soft)}
.bar.win .col{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:none}50%{filter:brightness(1.08) drop-shadow(0 0 10px rgba(255,200,90,.9))}}
.names{display:flex;justify-content:center;gap:clamp(10px,3vw,34px)}
.names div{width:clamp(56px,11vw,110px);text-align:center;font-weight:700;font-size:15px;line-height:1.2}
.names .em{font-size:26px;display:block}
.banner{text-align:center;font-size:clamp(20px,2.6vw,28px);margin:6px 0 4px}
.banner b{color:#2f5fc4}
.ranklist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.ranklist span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:30px 0 10px;min-height:300px}
.pod{display:flex;flex-direction:column;align-items:center;width:clamp(100px,18vw,170px)}
.pod .blk{width:100%;border-radius:18px 18px 8px 8px;display:flex;align-items:flex-start;justify-content:center;font-size:44px;font-weight:700;color:#fff;padding-top:10px;height:0;transition:height 1.2s cubic-bezier(.2,.9,.25,1.05)}
.pod .who{font-weight:700;text-align:center;margin-bottom:8px;opacity:0;transform:translateY(10px);transition:.6s .9s}
.pod .who .em{font-size:44px;display:block}
.pod.show .who{opacity:1;transform:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
</style></head>

<div class="bgdots" id="bgdots"></div>
<canvas id="fx"></canvas>
<div class="app">
 <div class="top">
  <div class="brand"><span style="font-size:26px">🌟</span> Team Together 2A · Kahoot Quiz</div>
  <div class="row">
   <button class="iconbtn" id="sayBtn" title="Read aloud" style="display:none">🔊 Read</button>
   <button class="iconbtn" id="muteBtn" title="Sound on/off">🔔 Sound on</button>
   <button class="iconbtn hidden" id="homeBtn" title="New game">🏠 New game</button>
  </div>
 </div>

 <!-- SETUP -->
 <section class="screen on" id="setup"><div class="card">
  <h1>Let’s play!</h1>
  <p class="lead">Choose the lesson, the period, the teams and the number of questions.</p>
  <div class="step"><h3><span class="num">1</span>Lesson</h3><select id="lesson"></select></div>
  <div class="step"><h3><span class="num">2</span>Period</h3><div class="chips" id="periods"></div></div>
  <div class="step"><h3><span class="num">3</span>Teams</h3>
    <div class="row" style="margin-bottom:10px"><div class="stepper"><button id="gMinus" type="button">−</button><b id="gCount">4</b><button id="gPlus" type="button">+</button></div><span class="muted">2 to 6 teams</span></div>
    <div class="grid2" id="gNames"></div>
    <div class="row" style="margin-top:10px"><span class="muted">Who answers?</span>
      <div class="chips"><button class="chip on" id="modeRot" type="button">Teams take turns</button><button class="chip" id="modePick" type="button">Teacher picks the team</button></div></div>
  </div>
  <div class="step"><h3><span class="num">4</span>Number of questions: <b id="nVal" style="margin-left:4px">10</b></h3>
    <div class="chips" style="margin-bottom:8px"><button class="chip" data-n="5" type="button">5</button><button class="chip on" data-n="10" type="button">10</button><button class="chip" data-n="15" type="button">15</button><button class="chip" data-n="20" type="button">20</button></div>
    <input type="range" id="nRange" min="1" max="20" value="10">
    <div class="muted" id="avail"></div>
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="big" id="startBtn" type="button">Start ▶</button></div>
 </div></section>

 <!-- QUESTION -->
 <section class="screen" id="quiz">
  <div class="qhead"><div class="muted" id="qCount"></div><div class="prog"><i id="progBar"></i></div></div>
  <div class="card" style="padding:12px 14px;margin-bottom:12px"><div class="turn" id="turn"></div></div>
  <div class="qwrap">
   <div class="timer card">
     <div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" stroke="#edf1f8" stroke-width="14" fill="none"/><circle id="ringFg" cx="85" cy="85" r="74" stroke="#7fb2ff" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="0"/></svg>
       <div class="t"><b id="tNum">30</b><small id="tLab">seconds</small></div></div>
     <div class="pts"><small class="muted">Points now</small><br><b id="ptsNow">1000</b></div>
     <button class="small" id="skipBtn" type="button">No answer (0)</button>
   </div>
   <div class="card qcard">
     <div><span class="qtype" id="qType"></span><span class="lv" id="qLv"></span></div>
     <div class="qemoji" id="qEmoji"></div>
     <div class="qtext" id="qText"></div>
     <div id="answers"></div>
     <div class="feedback" id="fb"><div class="msg" id="fbMsg"></div><div class="plus" id="fbPts"></div><button class="big" id="toScores" type="button">See scores ▶</button></div>
   </div>
  </div>
 </section>

 <!-- RESULTS -->
 <section class="screen" id="scores"><div class="card">
  <div class="banner" id="sBanner"></div>
  <div class="chart" id="chart"></div>
  <div class="names" id="names"></div>
  <div class="ranklist" id="rankList"></div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="big" id="nextBtn" type="button">Next question ▶</button></div>
 </div></section>

 <!-- FINAL -->
 <section class="screen" id="final"><div class="card" style="text-align:center">
  <h1>🏆 Well done, everyone!</h1>
  <div class="podium" id="podium"></div>
  <div class="ranklist" id="finalList"></div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="big" id="againBtn" type="button">Play again ↺</button><button class="big ghost" id="newBtn" type="button">New game</button></div>
 </div></section>
</div>

<script>
const LESSONS=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const GCOL=['#7cb8f7','#f6a5c0','#93d3a2','#ffc976','#b9a4f2','#84d0cc'];
const GEMO=['🦊','🐢','🦉','🐬','🦁','🐝'];
const GDEF=['Foxes','Turtles','Owls','Dolphins','Lions','Bees'];
const TYPE={mcq:'Choose the answer',pic:'Which picture?',tf:'True or false?',fill:'Fill the gap',order:'Put in order',odd:'Odd one out'};

let S={lesson:0,period:0,g:4,names:GDEF.slice(),mode:'rot',n:10};
let G={qs:[],i:0,scores:[],cur:0,t0:0,timer:null,answered:false,last:null};
// background
(function(){const b=$('bgdots');const c=['#cfe0ff','#ffd9e8','#d6f2e0','#fff0c9','#e6dcff'];for(let i=0;i<14;i++){const s=document.createElement('span');const z=40+Math.random()*120;s.style.width=s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.background=c[i%c.length];s.style.animationDelay=(-Math.random()*18)+'s';b.appendChild(s);}})();
// ---------- audio ----------
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type,vol,when){ if(muted) return; const a=ac(); if(!a) return; const t=a.currentTime+(when||0); const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.05); }
const SND={ ok(){tone(660,.25,'sine',.12);tone(880,.3,'sine',.1,.12);tone(1320,.4,'triangle',.06,.24);},
  no(){tone(330,.3,'sine',.1);tone(262,.45,'sine',.08,.18);},
  tick(){tone(1000,.05,'sine',.03);},
  click(){tone(520,.06,'triangle',.05);},
  bars(){[523,659,784].forEach((f,i)=>tone(f,.25,'sine',.07,i*.12));},
  fan(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.07,i*.16));} };
$('muteBtn').onclick=()=>{ muted=!muted; $('muteBtn').textContent= muted?'🔕 Sound off':'🔔 Sound on'; };
// speech
const canSpeak='speechSynthesis' in window;
function speak(txt){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt.replace(/___/g,'blank').replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,'')); u.lang='en-GB'; u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
$('sayBtn').onclick=()=>{ const q=G.qs[G.i]; if(q) speak(q.q+(q.o&&q.t!=='pic'?'. '+q.o.join(', '):'')); };
// ---------- setup ----------
function fillLessons(){ let h='',cur=''; LESSONS.forEach((L,i)=>{ if(L.unit!==cur){ if(cur) h+='</optgroup>'; h+='<optgroup label="'+esc(L.unit)+'">'; cur=L.unit; } h+='<option value="'+i+'">'+esc(L.title)+'</option>'; }); $('lesson').innerHTML=h+'</optgroup>'; $('lesson').onchange=()=>{S.lesson=+$('lesson').value;S.period=0;renderPeriods();}; renderPeriods(); }
function renderPeriods(){ const L=LESSONS[S.lesson]; const w=$('periods'); w.innerHTML=''; L.periods.forEach((f,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'+(i===S.period?' on':''); b.textContent='Period '+(i+1)+': '+f; b.onclick=()=>{S.period=i;renderPeriods();}; w.appendChild(b); });
  const c=L.qs.filter(q=>q.p===S.period+1).length; $('avail').textContent='This lesson has '+L.qs.length+' questions ('+c+' for the chosen period). Questions from the chosen period come first.'; }
function renderNames(){ $('gCount').textContent=S.g; const w=$('gNames'); w.innerHTML=''; for(let i=0;i<S.g;i++){ const d=document.createElement('div'); d.className='gname'; d.innerHTML='<span class="sw" style="background:'+GCOL[i]+'">'+GEMO[i]+'</span>'; const inp=document.createElement('input'); inp.type='text'; inp.value=S.names[i]; inp.maxLength=18; inp.oninput=()=>{S.names[i]=inp.value||GDEF[i];}; d.appendChild(inp); w.appendChild(d);} }
$('gMinus').onclick=()=>{ if(S.g>2){S.g--;renderNames();} }; $('gPlus').onclick=()=>{ if(S.g<6){S.g++;renderNames();} };
$('modeRot').onclick=()=>{S.mode='rot';$('modeRot').classList.add('on');$('modePick').classList.remove('on');};
$('modePick').onclick=()=>{S.mode='pick';$('modePick').classList.add('on');$('modeRot').classList.remove('on');};
function setN(n){ S.n=Math.max(1,Math.min(20,n)); $('nVal').textContent=S.n; $('nRange').value=S.n; document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.n)); }
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>setN(+b.dataset.n)); $('nRange').oninput=()=>setN(+$('nRange').value);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pickQuestions(){ const L=LESSONS[S.lesson]; const p=S.period+1;
  const sel=shuffle(L.qs.filter(q=>q.p===p)), rest=shuffle(L.qs.filter(q=>q.p!==p));
  let chosen=sel.slice(0,S.n); if(chosen.length<S.n) chosen=chosen.concat(rest.slice(0,S.n-chosen.length));
  return chosen.map((q,i)=>({q,i})).sort((a,b)=>a.q.lv-b.q.lv||a.i-b.i).map(x=>x.q); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); $('homeBtn').classList.toggle('hidden',id==='setup'); $('sayBtn').style.display=(id==='quiz'&&canSpeak)?'':'none'; window.scrollTo(0,0); }
function startGame(){ ac(); G.qs=pickQuestions(); G.i=0; G.scores=new Array(S.g).fill(0); G.cur=0; G.history=[]; nextQuestion(true); }
$('startBtn').onclick=startGame;
$('againBtn').onclick=startGame; $('newBtn').onclick=()=>{ stopTimer(); stopFx(); show('setup'); };
$('homeBtn').onclick=()=>{ if(confirm('Start a new game? Scores will be lost.')){ stopTimer(); stopFx(); show('setup'); } };
// ---------- question ----------
function renderTurn(){ const w=$('turn'); w.innerHTML='<span class="muted" style="margin-right:4px">Answering now:</span>'; for(let i=0;i<S.g;i++){ const b=document.createElement('button'); b.type='button'; b.className='gchip'+(i===G.cur?' on':''); b.style.borderColor= i===G.cur? GCOL[i]:'transparent'; b.innerHTML='<span class="dot" style="background:'+GCOL[i]+'">'+GEMO[i]+'</span>'+esc(S.names[i]); b.onclick=()=>{ if(G.answered) return; G.cur=i; renderTurn(); SND.click(); }; w.appendChild(b);} }
function nextQuestion(first){
  if(!first){ G.i++; }
  if(G.i>=G.qs.length){ finish(); return; }
  if(!first && S.mode==='rot'){ G.cur=(G.cur+1)%S.g; }
  if(first) G.cur=0;
  const q=G.qs[G.i]; G.answered=false;
  $('qCount').textContent='Question '+(G.i+1)+' of '+G.qs.length; $('progBar').style.width=((G.i)/G.qs.length*100)+'%';
  renderTurn();
  $('qType').textContent=TYPE[q.t]; $('qLv').textContent=LVN[q.lv]||'';
  const em=$('qEmoji'); em.innerHTML='';
  if(q.e){ if(String(q.e).startsWith('swatch:')){ const s=document.createElement('span'); s.className='swatch'; s.style.background=q.e.slice(7); em.appendChild(s);} else em.textContent=q.e; em.style.display=''; } else em.style.display='none';
  $('qText').textContent=q.q;
  $('fb').className='feedback'; const A=$('answers'); A.innerHTML='';
  if(q.t==='tf'){ const r=document.createElement('div'); r.className='tfrow'; [[true,'✔ True'],[false,'✘ False']].forEach(([v,l])=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=l; b.onclick=()=>answer(v===q.a,b,v===q.a?null:(q.a?'True':'False')); b.dataset.v=v; r.appendChild(b);}); A.appendChild(r); }
  else if(q.t==='order'){ buildOrder(q,A); }
  else { const correct=q.o[0]; const opts=shuffle(q.o); const g=document.createElement('div'); g.className='opts'; const KC=['#7cb8f7','#f6a5c0','#93d3a2','#ffc976'];
    opts.forEach((o,k)=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'+(q.t==='pic'?' picopt':''); if(q.t!=='pic'){ const s=document.createElement('span'); s.className='k'; s.style.background=KC[k%4]; s.textContent='ABCD'[k]; b.appendChild(s); const t=document.createElement('span'); t.textContent=o; b.appendChild(t);} else b.textContent=o; b.dataset.correct=(o===correct)?'1':'0'; b.onclick=()=>answer(o===correct,b,correct); g.appendChild(b); }); A.appendChild(g); }
  show('quiz'); startTimer();
}
function buildOrder(q,A){
  const slots=document.createElement('div'); slots.className='slots'; const bank=document.createElement('div'); bank.className='tiles';
  let order=shuffle(q.tiles.map((t,i)=>i)); let tries=0; while(q.tiles.length>1 && order.map(i=>q.tiles[i]).join('|')===q.tiles.join('|') && tries<20){order=shuffle(order);tries++;}
  const picked=[];
  order.forEach(i=>{ const b=document.createElement('button'); b.type='button'; b.className='tile'; b.textContent=q.tiles[i]; b.onclick=()=>{ if(G.answered||b.classList.contains('used')) return; b.classList.add('used'); const s=document.createElement('button'); s.type='button'; s.className='tile'; s.textContent=q.tiles[i]; picked.push({i,s,b}); s.onclick=()=>{ if(G.answered) return; const k=picked.findIndex(x=>x.s===s); if(k>-1){ picked[k].b.classList.remove('used'); picked.splice(k,1); s.remove(); } }; slots.appendChild(s); SND.click(); if(picked.length===q.tiles.length) check(); }; bank.appendChild(b); });
  const ctr=document.createElement('div'); ctr.className='ctrls'; const clr=document.createElement('button'); clr.type='button'; clr.className='small'; clr.textContent='Clear ↺'; clr.onclick=()=>{ if(G.answered) return; picked.splice(0).forEach(x=>{x.b.classList.remove('used'); x.s.remove();}); };
  const chk=document.createElement('button'); chk.type='button'; chk.className='small'; chk.textContent='Check ✔'; chk.onclick=()=>{ if(picked.length) check(); };
  ctr.appendChild(clr); ctr.appendChild(chk);
  function check(){ const got=picked.map(x=>q.tiles[x.i]).join(q.j); const want=q.tiles.join(q.j); answer(got===want, slots, want); }
  A.appendChild(slots); A.appendChild(bank); A.appendChild(ctr);
}
function pointsAt(t){ if(t<=30) return Math.round(1000-500*(t/30)); return Math.max(100, Math.round(500-400*((t-30)/30))); }
function startTimer(){ stopTimer(); G.t0=performance.now(); let lastTick=-1; const C=465;
  const step=()=>{ const t=(performance.now()-G.t0)/1000; const left=Math.max(0,30-t);
    $('tNum').textContent= t<=30? Math.ceil(left) : '+'+Math.floor(t-30); $('tLab').textContent= t<=30? 'seconds':'bonus time';
    const fg=$('ringFg'); if(t<=30){ fg.setAttribute('stroke-dashoffset', String(C*(t/30))); fg.setAttribute('stroke', left>10?'#7fb2ff':(left>5?'#ffc06b':'#f28b8b')); } else { fg.setAttribute('stroke-dashoffset', String(C)); }
    $('ptsNow').textContent=pointsAt(t);
    if(t<=30 && left<=5 && Math.ceil(left)!==lastTick){ lastTick=Math.ceil(left); if(lastTick>0) SND.tick(); }
    G.timer=requestAnimationFrame(step); };
  G.timer=requestAnimationFrame(step); }
function stopTimer(){ if(G.timer) cancelAnimationFrame(G.timer); G.timer=null; }
function answer(ok, el, correctText){
  if(G.answered) return; G.answered=true; const t=(performance.now()-G.t0)/1000; stopTimer();
  const pts= ok? pointsAt(t):0; G.scores[G.cur]+=pts; G.last={g:G.cur,pts,ok};
  const q=G.qs[G.i];
  document.querySelectorAll('#answers .opt').forEach(b=>{ if(b.dataset.correct==='1') b.classList.add('ok'); else if(b.dataset.correct==='0') b.classList.add('dim'); if(q.t==='tf'){ if(String(q.a)===b.dataset.v) b.classList.add('ok'); else b.classList.add('dim'); } });
  if(!ok && el && el.classList && el.classList.contains('opt')){ el.classList.remove('dim'); el.classList.add('no'); }
  const fb=$('fb'); fb.className='feedback show '+(ok?'ok':'no');
  let full=''; if(q.t==='fill'){ full=' “'+(q.full? q.full : q.q.split(' (')[0].replace('___',q.o[0]))+'”'; }
  if(q.t==='order'){ full=' “'+q.tiles.join(q.j)+'”'; }
  $('fbMsg').textContent= ok? ('Great job, '+S.names[G.cur]+'!'+full) : (correctText!==null&&correctText!==undefined? ('Good try! The answer is: '+(q.t==='fill'?q.o[0]:correctText)+'.'+(q.t==='fill'?full:'')) : 'Good try!');
  $('fbPts').textContent= ok? '+'+pts : '+0';
  ok? SND.ok():SND.no();
  $('progBar').style.width=((G.i+1)/G.qs.length*100)+'%';
}
$('skipBtn').onclick=()=>{ if(G.answered) return; const q=G.qs[G.i]; let c= q.t==='tf'? (q.a?'True':'False') : q.t==='order'? q.tiles.join(q.j) : q.o[0]; answer(false,null,c); };
$('toScores').onclick=()=>showScores();
function showScores(){
  const max=Math.max(1,...G.scores); const order=G.scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s); const rank={}; order.forEach((x,k)=>{ rank[x.i]= (k>0 && x.s===order[k-1].s)? rank[order[k-1].i] : k+1; });
  const ch=$('chart'), nm=$('names'); ch.innerHTML=''; nm.innerHTML='';
  for(let i=0;i<S.g;i++){ const b=document.createElement('div'); b.className='bar'+(G.last&&G.last.ok&&G.last.g===i?' win':''); b.innerHTML='<div class="val" id="v'+i+'">0</div><div class="col" style="background:linear-gradient(180deg,'+GCOL[i]+','+GCOL[i]+'99)"></div>'; ch.appendChild(b);
    const n=document.createElement('div'); n.innerHTML='<span class="em">'+GEMO[i]+'</span>'+esc(S.names[i])+'<div class="muted">#'+rank[i]+'</div>'; nm.appendChild(n); }
  const L=G.last; $('sBanner').innerHTML= L&&L.ok? ('<b>'+esc(S.names[L.g])+'</b> won this question: +'+L.pts+' points ✨') : ('No points this time for <b>'+esc(S.names[L?L.g:0])+'</b>. Keep going! 💪');
  $('rankList').innerHTML=order.map((x,k)=>'<span>'+(rank[x.i])+'. '+GEMO[x.i]+' '+esc(S.names[x.i])+' — <b>'+x.s+'</b></span>').join('');
  $('nextBtn').textContent= G.i+1>=G.qs.length? 'See the winners 🏆' : 'Next question ▶';
  show('scores');
  requestAnimationFrame(()=>{ setTimeout(()=>{ ch.querySelectorAll('.bar').forEach((b,i)=>{ const h=Math.max(4, Math.round(G.scores[i]/max*260)); b.querySelector('.col').style.height=h+'px'; countUp($('v'+i), G.scores[i]); }); SND.bars(); },60); });
}
function countUp(el,to){ const t0=performance.now(), d=1000; const f=()=>{ const k=Math.min(1,(performance.now()-t0)/d); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
$('nextBtn').onclick=()=>nextQuestion(false);
// ---------- final ----------
function finish(){ stopTimer(); const order=G.scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
  const pod=$('podium'); pod.innerHTML=''; const places=[1,0,2].filter(k=>k<order.length); const H={0:230,1:170,2:120}; const M={0:'🥇',1:'🥈',2:'🥉'};
  places.forEach(k=>{ const x=order[k]; const d=document.createElement('div'); d.className='pod'; d.innerHTML='<div class="who"><span class="em">'+GEMO[x.i]+'</span>'+esc(S.names[x.i])+'<div class="muted">'+x.s+' points</div></div><div class="blk" style="background:linear-gradient(180deg,'+GCOL[x.i]+','+GCOL[x.i]+'99)">'+M[k]+'</div>'; pod.appendChild(d); setTimeout(()=>{ d.classList.add('show'); d.querySelector('.blk').style.height=H[k]+'px'; }, 200+k*250); });
  $('finalList').innerHTML=order.map((x,k)=>'<span>'+(k+1)+'. '+GEMO[x.i]+' '+esc(S.names[x.i])+' — <b>'+x.s+'</b></span>').join('');
  show('final'); setTimeout(()=>{SND.fan(); startFx();},700); }
// gentle confetti
let FX=null;
function startFx(){ const c=$('fx'); const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; const cols=['#ffd27f','#a5c8ff','#f7b3cf','#b9e6c9','#cdb8f7']; const P=[]; for(let i=0;i<90;i++) P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:3+Math.random()*5,vy:.6+Math.random()*1.2,vx:-.4+Math.random()*.8,a:Math.random()*6,c:cols[i%cols.length]});
  const t0=performance.now(); const f=()=>{ x.clearRect(0,0,c.width,c.height); const el=(performance.now()-t0)/1000; P.forEach(p=>{ p.y+=p.vy; p.x+=p.vx+Math.sin((p.a+=.03))*.4; x.globalAlpha=Math.max(0,1-el/9); x.fillStyle=p.c; x.beginPath(); x.ellipse(p.x,p.y,p.r,p.r*.6,p.a,0,6.28); x.fill(); }); if(el<9) FX=requestAnimationFrame(f); else stopFx(); }; FX=requestAnimationFrame(f); }
function stopFx(){ if(FX) cancelAnimationFrame(FX); FX=null; const c=$('fx'); c.getContext('2d').clearRect(0,0,c.width,c.height); }
// init
fillLessons(); renderNames(); setN(10);
window.__T={S,G,LESSONS,pointsAt};
</script>
