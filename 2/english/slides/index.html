<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Team Together 2A · Interactive Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --sky1:#E0F2FE;--sky2:#FEF9C3;--ink:#1E293B;--ink2:#475569;--card:#FFFFFF;--line:#E2E8F0;
 --warm:#F97316;--present:#3B82F6;--practice:#16A34A;--produce:#9333EA;--assess:#E11D48;--close:#0891B2;
 --ok:#16A34A;--bad:#E11D48;--gold:#F59E0B;--acc:#3B82F6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#BAE6FD 0%,#E0F2FE 45%,#FEF3C7 100%);font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;}
.clouds{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.clouds i{position:absolute;background:#fff;border-radius:999px;opacity:.75;filter:blur(1px);animation:drift linear infinite}
.clouds i:before,.clouds i:after{content:"";position:absolute;background:#fff;border-radius:999px}
.clouds i:before{width:55%;height:140%;left:15%;top:-60%}.clouds i:after{width:40%;height:120%;left:50%;top:-40%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* ---------- HOME ---------- */
#home{position:absolute;inset:0;padding:34px 46px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:22px}
.brand .logo{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,#F97316,#EC4899);display:grid;place-items:center;font-size:54px;box-shadow:0 10px 0 #be185d33,0 14px 30px #0002;transform:rotate(-6deg)}
.brand h1{font-family:Fredoka;font-size:54px;margin:0;line-height:1;color:#0F172A}
.brand h1 span{color:#E11D48}
.brand p{margin:6px 0 0;font-size:22px;color:var(--ink2);font-weight:800}
.brand .right{margin-left:auto;display:flex;gap:12px}
.units{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:26px;min-height:0}
.unit{background:#fff;border-radius:28px;padding:16px 16px 14px;box-shadow:0 8px 0 #0f172a12,0 18px 40px #0f172a14;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;border:4px solid transparent}
.unit .uh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.unit .ub{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:30px;color:#fff;flex:none}
.unit .ut{font-family:Fredoka;font-weight:600;font-size:23px;line-height:1.05}
.unit .us{font-size:14px;color:var(--ink2);font-weight:800}
.unit .ls{display:flex;flex-direction:column;gap:6px;overflow:auto;padding-right:2px}
.lbtn{display:flex;align-items:center;gap:10px;text-align:left;background:#F8FAFC;border-radius:14px;padding:7px 10px;font-weight:800;font-size:16px;border:2px solid #EEF2F7;transition:.15s}
.lbtn:hover{transform:translateX(4px);background:#fff;border-color:currentColor}
.lbtn .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:Fredoka;font-size:16px;flex:none}
.lbtn .k{font-size:12px;color:#64748B;display:block;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.lbtn .done{margin-left:auto;font-size:16px}
.unit .deco{position:absolute;right:-8px;bottom:-14px;font-size:84px;opacity:.13;pointer-events:none}

/* ---------- PLAYER ---------- */
#player{position:absolute;inset:0;display:none}
#topbar{position:absolute;left:0;right:0;top:0;height:74px;display:flex;align-items:center;gap:12px;padding:0 22px}
.tb-btn{height:52px;min-width:52px;padding:0 16px;border-radius:16px;background:#fff;font-weight:900;font-size:20px;box-shadow:0 4px 0 #0f172a1f;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.12s}
.tb-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f172a1f}
.tb-btn.on{background:#0F172A;color:#fff}
.lesson-tag{display:flex;flex-direction:column;line-height:1.1;margin-left:4px}
.lesson-tag b{font-family:Fredoka;font-size:24px;font-weight:600}
.lesson-tag span{font-size:15px;color:var(--ink2);font-weight:800}
#teams{margin-left:auto;display:flex;gap:10px;align-items:center}
.team{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:5px 8px 5px 12px;box-shadow:0 4px 0 #0f172a1f;border:3px solid transparent;transition:.2s;cursor:pointer;user-select:none}
.team.active{border-color:var(--tc);transform:translateY(-3px) scale(1.04);box-shadow:0 8px 0 #0f172a1f}
.team .tn{font-weight:900;font-size:17px;color:var(--tc)}
.team .ts{font-family:Fredoka;font-weight:700;font-size:28px;min-width:36px;text-align:center}
.team .tp{width:30px;height:30px;border-radius:10px;background:var(--tc);color:#fff;font-weight:900;font-size:20px;display:grid;place-items:center}
.team .tm{background:#E2E8F0;color:#334155}
.team .turn{font-size:12px;font-weight:900;background:var(--tc);color:#fff;border-radius:8px;padding:2px 6px;display:none}
.team.active .turn{display:inline-block}
#slidebox{position:absolute;left:22px;right:22px;top:82px;bottom:92px}
.slide{position:absolute;inset:0;background:var(--card);border-radius:34px;box-shadow:0 10px 0 #0f172a14,0 30px 60px #0f172a1f;overflow:hidden;display:flex;flex-direction:column;animation:slideIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.shead{display:flex;align-items:center;gap:16px;padding:18px 28px 12px;border-bottom:3px dashed #EEF2F7;min-height:84px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;color:#fff;font-weight:900;font-size:18px;white-space:nowrap;background:var(--sc)}
.shead h2{font-family:Fredoka;font-weight:600;font-size:36px;margin:0;line-height:1.05}
.shead .inst{font-size:20px;color:var(--ink2);font-weight:800;margin-top:2px}
.shead .ref{margin-left:auto;background:#F1F5F9;border-radius:12px;padding:6px 12px;font-weight:900;color:#334155;font-size:16px;white-space:nowrap}
.sbody{flex:1;position:relative;padding:20px 30px;min-height:0;display:flex;flex-direction:column}
.st-warm{--sc:var(--warm)}.st-present{--sc:var(--present)}.st-practice{--sc:var(--practice)}.st-produce{--sc:var(--produce)}.st-assess{--sc:var(--assess)}.st-close{--sc:var(--close)}.st-intro{--sc:#0F172A}
.slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--sc)}

#botbar{position:absolute;left:22px;right:22px;bottom:12px;height:68px;display:flex;align-items:center;gap:12px}
.nav-btn{height:60px;min-width:84px;border-radius:20px;font-size:30px;font-weight:900;background:#fff;box-shadow:0 5px 0 #0f172a22}
.nav-btn.next{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;min-width:150px;font-family:Fredoka;font-size:28px;box-shadow:0 5px 0 #166534}
.nav-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
#stagebar{flex:1;display:flex;gap:6px;align-items:center;background:#ffffffcc;border-radius:20px;padding:8px;height:60px;overflow:hidden}
.sg{flex:var(--n);height:44px;border-radius:13px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:15px;position:relative;overflow:hidden;cursor:pointer;color:#475569;white-space:nowrap;padding:0 6px;min-width:0}
.sg .fill{position:absolute;left:0;top:0;bottom:0;background:var(--sc);opacity:.22;width:0;transition:.3s}
.sg.cur{color:#fff;background:var(--sc)}
.sg.cur .fill{display:none}
.sg span{position:relative;overflow:hidden;text-overflow:ellipsis}
#counter{font-family:Fredoka;font-size:22px;font-weight:600;min-width:84px;text-align:center;background:#fff;border-radius:16px;height:60px;display:grid;place-items:center;box-shadow:0 5px 0 #0f172a22}

/* notes */
#notes{position:absolute;right:30px;bottom:96px;width:520px;max-height:420px;overflow:auto;background:#FFFBEB;border:3px solid #FCD34D;border-radius:22px;padding:16px 20px;font-size:19px;box-shadow:0 20px 40px #0003;display:none;z-index:40}
#notes h4{margin:0 0 6px;font-family:Fredoka;font-size:22px;color:#92400E}
#notes .nt{line-height:1.45;font-weight:700}
#notes ul{margin:6px 0 0;padding-left:22px}
/* timer */
#timerPop{position:absolute;right:30px;top:86px;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 20px 40px #0003;display:none;z-index:45;text-align:center;width:300px}
#timerPop .tv{font-family:Fredoka;font-size:64px;font-weight:700;line-height:1}
#timerPop .tr{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
#timerPop .tr button{background:#F1F5F9;border-radius:10px;padding:6px 10px;font-weight:900;font-size:16px}
#timerPop.alarm{animation:shake .4s 4}

/* ---------- generic widgets ---------- */
.row{display:flex;gap:18px;align-items:center}
.col{display:flex;flex-direction:column;gap:14px}
.center{display:flex;align-items:center;justify-content:center}
.grow{flex:1;min-height:0}
.btn{background:var(--b,#3B82F6);color:#fff;border-radius:18px;padding:12px 22px;font-weight:900;font-size:22px;box-shadow:0 5px 0 #0003;display:inline-flex;align-items:center;gap:10px;transition:.12s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
.btn.sm{font-size:18px;padding:9px 16px;border-radius:14px}
.btn.ghost{background:#F1F5F9;color:#0F172A;box-shadow:0 4px 0 #CBD5E1}
.btn.g{--b:#16A34A}.btn.o{--b:#F97316}.btn.p{--b:#9333EA}.btn.r{--b:#E11D48}.btn.t{--b:#0891B2}.btn.y{--b:#F59E0B}.btn.k{--b:#0F172A}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.emo{display:inline-block;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.svgi{display:inline-flex;align-items:center;justify-content:center}
.svgi svg{width:100%;height:100%}
.svgi .person,.svgi .bodyfig,.svgi .stick,.svgi .robot{width:auto;height:100%}
.swatch{display:inline-block;border-radius:50% 46% 52% 44%;border:4px solid #0f172a22;box-shadow:inset -8px -8px 0 #0000001a}
.numb{font-family:Fredoka;font-weight:700;color:#0F172A;line-height:1}
.txtic{font-family:Fredoka;font-weight:600}
.hl{background:linear-gradient(transparent 55%,#FDE68A 55%);padding:0 3px;border-radius:4px}
.hb{color:#2563EB;font-weight:900}.hr{color:#E11D48;font-weight:900}.hg{color:#16A34A;font-weight:900}.hp{color:#9333EA;font-weight:900}
.big{font-family:Fredoka;font-weight:600}
.speak-btn{width:56px;height:56px;border-radius:50%;background:#FDE68A;font-size:28px;display:inline-grid;place-items:center;box-shadow:0 4px 0 #D97706;flex:none}
.speak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D97706}
.badge{display:inline-block;background:#F1F5F9;border-radius:10px;padding:3px 10px;font-weight:900;font-size:15px;color:#334155}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.pop{animation:popIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.bounce{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.wiggle{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.float{animation:flt 4s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
.glow{box-shadow:0 0 0 6px #FDE68A,0 0 30px #F59E0B !important}
.dim{opacity:.35}
.okc{background:#DCFCE7 !important;border-color:#16A34A !important}
.badc{background:#FFE4E6 !important;border-color:#E11D48 !important}
.fb{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:Fredoka;font-size:120px;font-weight:700;pointer-events:none;z-index:30;text-shadow:0 6px 0 #0002;animation:fbA 1s forwards}
@keyframes fbA{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.confetti{position:absolute;width:14px;height:20px;top:-20px;z-index:50;pointer-events:none;animation:conf linear forwards;border-radius:3px}
@keyframes conf{to{transform:translateY(980px) rotate(720deg)}}
.starfly{position:fixed;font-size:46px;z-index:99;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.7,1)}

/* cover */
.cover{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;height:100%}
.cover .hero{border-radius:30px;padding:34px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cover .hero .u{font-weight:900;font-size:22px;opacity:.95;letter-spacing:.05em;text-transform:uppercase}
.cover .hero h1{font-family:Fredoka;font-size:72px;line-height:1;margin:10px 0 8px}
.cover .hero .k{font-size:26px;font-weight:800;opacity:.95}
.cover .hero .pages{margin-top:auto;background:#ffffff33;border-radius:16px;padding:10px 16px;font-weight:900;font-size:20px;align-self:flex-start}
.cover .hero .flo{position:absolute;opacity:.9}
.cover .side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.cover .side .box{padding:12px 18px}.cover .side .box ul{font-size:20px;line-height:1.3}.cover .side .langline{font-size:22px;padding:2px 0}.cover .side .chip{font-size:17px}.cover .side .chip .emo{font-size:24px}
.box{background:#F8FAFC;border:3px solid #EEF2F7;border-radius:24px;padding:16px 20px}
.box h3{margin:0 0 8px;font-family:Fredoka;font-weight:600;font-size:26px;display:flex;align-items:center;gap:10px}
.box ul{margin:0;padding-left:26px;font-size:21px;font-weight:700;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #E2E8F0;border-radius:14px;padding:4px 12px 4px 6px;font-weight:900;font-size:19px;cursor:pointer}
.chip .emo{font-size:28px}
.chip .svgi{width:32px;height:32px}
.langline{font-size:24px;font-weight:800;padding:4px 0}

/* plan */
.plan{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;height:100%}
.pcol{border-radius:24px;padding:14px;background:color-mix(in srgb,var(--sc) 10%,#fff);border:3px solid color-mix(in srgb,var(--sc) 35%,#fff);display:flex;flex-direction:column;gap:8px;min-height:0}
.pcol h4{margin:0;font-family:Fredoka;font-size:24px;color:var(--sc);display:flex;align-items:center;gap:8px}
.pcol .min{font-weight:900;color:#334155;font-size:16px}
.pcol .pi{background:#fff;border-radius:12px;padding:8px 10px;font-weight:800;font-size:16px;cursor:pointer;border:2px solid transparent;line-height:1.2}
.pcol .pi:hover{border-color:var(--sc)}
.pcol .pd{font-size:15px;color:#475569;font-weight:700;line-height:1.3}

/* vocab cards */
.vgrid{display:grid;gap:16px;flex:1;min-height:0;align-content:center}
.vcard{background:#fff;border:4px solid #E2E8F0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;transition:transform .2s,border-color .2s;box-shadow:0 6px 0 #E2E8F0;padding:8px;min-height:0}
.vcard:hover{transform:translateY(-4px)}
.vcard .w{font-family:Fredoka;font-weight:600;font-size:30px;text-align:center;line-height:1.05}
.vcard .no{position:absolute;left:10px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--sc);color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px}
.vcard.hide .w{visibility:hidden}
.vcard.on{border-color:var(--sc);transform:scale(1.06);box-shadow:0 10px 0 color-mix(in srgb,var(--sc) 40%,#fff)}
.vcard.flip{animation:flip .5s}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.vcard .ex{font-size:18px;font-weight:800;color:#475569;text-align:center;display:none}
.vcard.on .ex{display:block}

/* grammar */
.gram{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;flex:1;min-height:0}
.lbox{background:linear-gradient(180deg,#EFF6FF,#fff);border:4px solid #BFDBFE;border-radius:28px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.lbox h3{margin:0;font-family:Fredoka;font-size:28px;color:#1D4ED8;display:flex;gap:10px;align-items:center}
.qa{background:#fff;border-radius:18px;padding:12px 16px;border:2px solid #DBEAFE;font-size:30px;font-weight:800;line-height:1.3}
.qa .q{color:#0F172A}.qa .a{color:#16A34A}
.rule{background:#FEF3C7;border-radius:16px;padding:10px 14px;font-weight:800;font-size:21px;border:2px dashed #F59E0B}
.exa{border-radius:28px;background:#F8FAFC;border:3px solid #EEF2F7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;padding:18px}
.exa .pic{height:240px;display:flex;align-items:center;justify-content:center}
.bub{background:#fff;border:3px solid #0F172A;border-radius:24px;padding:10px 20px;font-size:32px;font-weight:800;position:relative;max-width:620px;text-align:center}
.bub.a{border-color:#16A34A;color:#166534}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmp>div{background:#fff;border:3px solid #E2E8F0;border-radius:22px;padding:14px;text-align:center}
.cmp h4{margin:0;font-family:Fredoka;font-size:24px}

/* chant */
.chant{display:grid;grid-template-columns:1fr 330px;gap:22px;flex:1;min-height:0}
.lyr{background:#FFF7ED;border:4px solid #FED7AA;border-radius:28px;padding:16px 26px;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:3px}
.lyr .ln{font-size:29px;font-weight:800;padding:4px 12px;border-radius:14px;transition:.2s;display:flex;align-items:center;gap:12px;cursor:pointer}
.lyr .ln.on{background:#F97316;color:#fff;transform:scale(1.03)}
.lyr .ln.echo{background:#16A34A;color:#fff}
.lyr .ln .emo{font-size:34px}
.lyr .gap{height:12px}
.dance{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F0F9FF;border-radius:28px;border:4px solid #BAE6FD}
.dance .big{font-size:26px;text-align:center}

/* story */
.story{flex:1;display:flex;flex-direction:column;min-height:0;gap:10px}
.panel{flex:1;border-radius:28px;position:relative;overflow:hidden;border:5px solid #0F172A;min-height:0}
.panel .bgp{position:absolute;inset:0}
.panel .props{position:absolute;inset:0}
.panel .props span{position:absolute}
.panel .cast{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 40px}
.panel .who{display:flex;flex-direction:column;align-items:center;position:relative;transition:.3s}
.panel .who.talk{transform:translateY(-10px) scale(1.06)}
.panel .who .nm{background:#0F172A;color:#fff;border-radius:10px;padding:2px 10px;font-weight:900;font-size:16px;margin-top:-6px;position:relative;z-index:2}
.panel .sb{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:10px;background:#fff;border:4px solid #0F172A;border-radius:26px;padding:10px 18px;font-size:27px;font-weight:800;min-width:150px;max-width:420px;text-align:center;box-shadow:0 6px 0 #0002;animation:popIn .35s cubic-bezier(.2,1.6,.4,1);line-height:1.15;z-index:3}
.panel .sb:after{content:"";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);border:12px solid transparent;border-top-color:#0F172A}
.panel .sbs{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:470px;display:flex;flex-direction:column-reverse;gap:10px;align-items:center;margin-bottom:12px;z-index:3}
.panel .sbs .sb{position:relative;left:auto;bottom:auto;transform:none;margin:0;width:max-content;max-width:460px}
.panel .sbs .sb.old{opacity:.6;font-size:22px}
.panel .pno{position:absolute;left:14px;top:12px;background:#0F172A;color:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;font-family:Fredoka;font-size:26px;z-index:4}
.panel .cap{position:absolute;right:14px;top:12px;background:#FEF3C7;border:3px solid #0F172A;border-radius:12px;padding:4px 12px;font-weight:900;font-size:20px;z-index:4}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:#CBD5E1;cursor:pointer}
.dots i.on{background:var(--sc);transform:scale(1.25)}

/* dialogue */
.dlg{display:grid;grid-template-columns:240px 1fr 240px;gap:20px;flex:1;min-height:0;align-items:center}
.dlg .ch{display:flex;flex-direction:column;align-items:center;gap:8px}
.dlg .ch .nm{font-family:Fredoka;font-size:28px;font-weight:600}
.dlines{display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:100%;padding:6px}
.dl{max-width:78%;padding:12px 20px;border-radius:24px;font-size:29px;font-weight:800;cursor:pointer;border:3px solid;transition:.2s;line-height:1.2}
.dl.L{align-self:flex-start;background:#EFF6FF;border-color:#93C5FD;border-bottom-left-radius:6px}
.dl.R{align-self:flex-end;background:#F0FDF4;border-color:#86EFAC;border-bottom-right-radius:6px}
.dl.on{transform:scale(1.04);box-shadow:0 0 0 5px #FDE68A}
.dl.masked .tx{filter:blur(9px)}
.swapchips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.swapchips .chip.sel{border-color:#9333EA;background:#F3E8FF}

/* mcq */
.quiz{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:0}
.qtop{display:flex;align-items:center;gap:16px;justify-content:center;width:100%}
.qtext{font-family:Fredoka;font-size:44px;font-weight:600;text-align:center;line-height:1.15}
.qpic{display:flex;align-items:center;justify-content:center;min-height:0}
.opts{display:grid;gap:16px;width:100%}
.opt{background:#fff;border:4px solid #E2E8F0;border-radius:24px;padding:14px;font-size:32px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 #E2E8F0;transition:.15s;min-height:90px}
.opt:hover{transform:translateY(-3px);border-color:#94A3B8}
.opt .lt{position:absolute}
.qdots{display:flex;gap:6px}
.qdots i{width:14px;height:14px;border-radius:50%;background:#E2E8F0}
.qdots i.ok{background:#16A34A}.qdots i.cur{background:var(--sc);transform:scale(1.3)}
.explain{background:#F0FDF4;border:3px solid #86EFAC;border-radius:18px;padding:8px 16px;font-size:24px;font-weight:800}

/* yes/no */
.yn{display:flex;gap:24px}
.ynb{font-size:34px;font-weight:900;border-radius:24px;padding:16px 30px;min-width:300px;color:#fff;box-shadow:0 6px 0 #0003}
.ynb.y{background:#16A34A}.ynb.n{background:#E11D48}

/* match */
.match{flex:1;display:grid;grid-template-columns:1fr 160px 1fr;min-height:0;position:relative}
.mcol{display:flex;flex-direction:column;gap:12px;justify-content:center}
.mi{background:#fff;border:4px solid #E2E8F0;border-radius:20px;padding:6px 14px;font-size:28px;font-weight:900;display:flex;align-items:center;gap:12px;min-height:72px;cursor:pointer;box-shadow:0 5px 0 #E2E8F0;transition:.15s;position:relative;z-index:2}
.mi.sel{border-color:#F59E0B;box-shadow:0 0 0 5px #FDE68A}
.mi.done{border-color:#16A34A;background:#F0FDF4;cursor:default}
.mcol.r .mi{justify-content:flex-start}
.match svg.lines{position:absolute;inset:0;pointer-events:none;z-index:1;width:100%;height:100%}

/* order / spell */
.slots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:86px;padding:12px;border:4px dashed #CBD5E1;border-radius:24px;width:100%;align-items:center}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border:4px solid #CBD5E1;border-radius:18px;padding:10px 20px;font-size:34px;font-weight:900;box-shadow:0 5px 0 #CBD5E1;font-family:Fredoka}
.tile.used{visibility:hidden}
.slot{width:74px;height:84px;border-radius:16px;border:4px solid #CBD5E1;background:#F8FAFC;font-family:Fredoka;font-size:46px;font-weight:700;display:grid;place-items:center}
.slot.f{background:#fff;border-color:#3B82F6}

/* count */
.cfield{position:relative;flex:1;border-radius:28px;background:linear-gradient(180deg,#F0F9FF,#ECFEFF);border:4px solid #BAE6FD;min-height:0}
.cfield .it{position:absolute;transition:.3s}
.cfield .it .cn{position:absolute;right:-6px;top:-10px;background:#F97316;color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:900;font-size:20px;animation:popIn .3s}

/* position scene */
.scene{position:relative;border-radius:28px;background:linear-gradient(180deg,#FEFCE8 0 72%,#FDE68A 72%);border:4px solid #FDE68A;overflow:hidden}
.hot{position:absolute;border:4px dashed transparent;border-radius:20px;cursor:pointer}
.hot:hover{border-color:#F59E0B;background:#FDE68A55}

/* colour */
.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:360px}
.pc{width:64px;height:64px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px #CBD5E1;cursor:pointer}
.pc.sel{box-shadow:0 0 0 6px #0F172A;transform:scale(1.12)}
.robot .part{cursor:pointer;transition:.2s}
.robot .part:hover>*{stroke:#F59E0B !important;stroke-width:6 !important}

/* faces */
.faces{display:grid;gap:18px;width:100%}
.fcard{background:#fff;border:4px solid #E2E8F0;border-radius:26px;display:flex;flex-direction:column;align-items:center;padding:10px;cursor:pointer;box-shadow:0 6px 0 #E2E8F0;transition:.15s}
.fcard:hover{transform:translateY(-4px)}
.fcard .nm{font-family:Fredoka;font-size:26px;font-weight:600}

/* sort */
.bins{display:grid;gap:18px}
.bin{border:4px dashed #94A3B8;border-radius:26px;padding:12px;min-height:200px;background:#F8FAFC;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.bin h4{margin:0;font-family:Fredoka;font-size:30px;text-align:center}
.bin .in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sitem{background:#fff;border:4px solid #E2E8F0;border-radius:18px;padding:6px 14px;font-weight:900;font-size:24px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;box-shadow:0 4px 0 #E2E8F0}
.sitem.sel{border-color:#F59E0B;box-shadow:0 0 0 5px #FDE68A}

/* task */
.task{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;flex:1;min-height:0}
.exl{display:flex;flex-direction:column;gap:12px;overflow:auto}
.ex{background:#F8FAFC;border:3px solid #E2E8F0;border-radius:22px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.ex .n{width:44px;height:44px;border-radius:50%;background:var(--sc);color:#fff;display:grid;place-items:center;font-family:Fredoka;font-size:24px;flex:none}
.ex .t{font-size:25px;font-weight:900}
.ex .tip{font-size:19px;font-weight:700;color:#475569;margin-top:2px}
.ex .ans{margin-top:6px;font-size:20px;font-weight:800;color:#166534;background:#DCFCE7;border-radius:12px;padding:6px 10px;display:none}
.ex.show .ans{display:block}
.tside{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#F0F9FF;border-radius:28px;border:4px solid #BAE6FD;padding:16px}
.bigtimer{font-family:Fredoka;font-size:90px;font-weight:700;line-height:1}
.mode{font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 16px}

/* games */
.wheelwrap{position:relative;width:520px;height:520px}
.wheel{width:100%;height:100%;border-radius:50%;transition:transform 4s cubic-bezier(.15,.9,.2,1);box-shadow:0 0 0 10px #0F172A,0 20px 40px #0003}
.pointer{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:60px;z-index:3;filter:drop-shadow(0 4px 0 #0003)}
.gtile{position:absolute;background:linear-gradient(135deg,#F97316,#EC4899);border:3px solid #fff;display:grid;place-items:center;color:#fff;font-family:Fredoka;font-size:40px;font-weight:700;cursor:pointer;transition:.35s}
.gtile.gone{transform:scale(0) rotate(90deg);opacity:0;pointer-events:none}
.mem{display:grid;gap:14px;flex:1;min-height:0}
.mc{perspective:800px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mc.up .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.mc .f{background:linear-gradient(135deg,#6366F1,#06B6D4);color:#fff;font-family:Fredoka;font-size:52px;border:4px solid #fff;box-shadow:0 6px 0 #4338CA55}
.mc .b{background:#fff;border:4px solid #E2E8F0;transform:rotateY(180deg);font-family:Fredoka;font-size:30px;font-weight:600;text-align:center}
.mc.got .b{border-color:#16A34A;background:#F0FDF4}
.bubfield{position:relative;flex:1;border-radius:28px;background:linear-gradient(180deg,#0EA5E9,#38BDF8 60%,#7DD3FC);overflow:hidden;min-height:0}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffffee,#ffffff55 40%,#ffffff22 70%);border:3px solid #ffffffcc;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;color:#0F172A;font-family:Fredoka;font-weight:600;font-size:24px;text-align:center}
.bubble.popd{animation:popOut .35s forwards}
@keyframes popOut{to{transform:scale(1.6);opacity:0}}
.track{display:flex;flex-direction:column;gap:14px;width:100%}
.lane{position:relative;height:84px;border-radius:20px;background:repeating-linear-gradient(90deg,#E2E8F0 0 40px,#F1F5F9 40px 80px);border:3px solid #CBD5E1}
.lane .car{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1);font-size:58px;display:flex;align-items:center}
.lane .flag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:46px}
.lane .ln{position:absolute;left:10px;top:4px;font-weight:900;font-size:16px;color:var(--tc)}
.gboxes{display:grid;gap:16px;flex:1;min-height:0}
.gbox{border-radius:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;font-family:Fredoka;font-size:44px;font-weight:700;color:#fff;box-shadow:0 8px 0 #0002;transition:.2s}
.gbox:hover{transform:translateY(-4px) rotate(-2deg)}
.gbox.open{background:#F1F5F9 !important;color:#94A3B8;cursor:default;transform:none}
.modal{position:absolute;inset:0;background:#0F172Acc;z-index:60;display:flex;align-items:center;justify-content:center;border-radius:34px}
.modal .mbox{background:#fff;border-radius:32px;padding:26px 30px;width:88%;max-height:92%;display:flex;flex-direction:column;align-items:center;gap:14px;animation:popIn .35s}
.flashbox{flex:1;border-radius:28px;background:#0F172A;position:relative;overflow:hidden;min-height:0}
.flashbox .fi{position:absolute;transition:none}
.simon{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;flex:1;min-height:0;align-items:center}
.simon .cmd{font-family:Fredoka;font-size:58px;font-weight:700;text-align:center;line-height:1.1}
.simon .ss{font-size:34px;color:#16A34A;font-weight:900}
.simon .ns{font-size:34px;color:#E11D48;font-weight:900}
/* stick animations */
.stick .armL,.stick .armR{transform-box:view-box}
.stick .armL{transform-origin:100px 78px}.stick .armR{transform-origin:100px 78px}
.stick .legL,.stick .legR{transform-origin:100px 140px}
.stick .upper{transform-origin:100px 140px}
.v-stretch .armL{animation:strL 1.4s ease-in-out infinite}.v-stretch .armR{animation:strR 1.4s ease-in-out infinite}
@keyframes strL{50%{transform:rotate(130deg)}}@keyframes strR{50%{transform:rotate(-130deg)}}
.v-clap .armL{animation:clL .6s ease-in-out infinite}.v-clap .armR{animation:clR .6s ease-in-out infinite}
@keyframes clL{50%{transform:rotate(-70deg)}}@keyframes clR{50%{transform:rotate(70deg)}}
.v-stamp .legR{animation:stp .7s ease-in-out infinite}
@keyframes stp{40%{transform:rotate(-30deg) translateY(-10px)}60%{transform:none}}
.v-bend .fig{animation:bnd 1.2s ease-in-out infinite;transform-origin:100px 216px}
@keyframes bnd{50%{transform:scaleY(.8)}}
.v-bend .legL{animation:kL 1.2s ease-in-out infinite}.v-bend .legR{animation:kR 1.2s ease-in-out infinite}
@keyframes kL{50%{transform:rotate(18deg)}}@keyframes kR{50%{transform:rotate(-18deg)}}
.v-touch .upper{animation:tch 1.6s ease-in-out infinite}
@keyframes tch{50%{transform:rotate(-80deg) translateX(6px)}}
.v-touch .armL,.v-touch .armR{animation:tchA 1.6s ease-in-out infinite}
@keyframes tchA{50%{transform:rotate(-30deg)}}
.v-move .fig{animation:mv 1s ease-in-out infinite;transform-origin:100px 216px}
@keyframes mv{25%{transform:rotate(-8deg) translateX(-8px)}75%{transform:rotate(8deg) translateX(8px)}}
.v-move .armL{animation:strL 1s ease-in-out infinite}.v-move .armR{animation:clR 1s ease-in-out infinite}

/* reading */
.read{display:grid;grid-template-columns:300px 1fr;gap:22px;flex:1;min-height:0}
.gloss{display:flex;flex-direction:column;gap:10px;overflow:auto}
.gl{background:#fff;border:3px solid #E2E8F0;border-radius:18px;padding:6px 12px;display:flex;align-items:center;gap:12px;font-weight:900;font-size:24px;cursor:pointer;box-shadow:0 4px 0 #E2E8F0}
.gl .svgi{width:56px;height:56px}
.ptext{background:#FFFBEB;border:4px solid #FDE68A;border-radius:28px;padding:18px 24px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.para{font-size:28px;font-weight:700;line-height:1.4;padding:6px 12px;border-radius:14px;cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.para .emo{font-size:40px}
.para.on{background:#FDE68A}

/* cards (CLIL) */
.icards{display:grid;gap:16px;flex:1;min-height:0}
.icard{border-radius:26px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center;border:4px solid;transition:.2s}
.icard h4{margin:0;font-family:Fredoka;font-size:32px}
.icard p{margin:0;font-size:22px;font-weight:800;opacity:0;transition:.3s;min-height:56px}
.icard.open p{opacity:1}

/* draw */
.drawwrap{display:grid;grid-template-columns:1fr 250px;gap:18px;flex:1;min-height:0}
.drawwrap canvas{background:#fff;border:4px solid #E2E8F0;border-radius:24px;width:100%;height:100%;touch-action:none;cursor:crosshair}
.dtools{display:flex;flex-direction:column;gap:12px;align-items:center}

/* wrap */
.wrapg{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;min-height:0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .bar{width:130px;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:8px;color:#fff;font-family:Fredoka;font-size:40px;font-weight:700}
.can{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #E2E8F0;border-radius:18px;padding:8px 12px;font-size:22px;font-weight:800}
.can .fc{margin-left:auto;display:flex;gap:6px}
.can .fc button{font-size:34px;background:none;opacity:.35;transition:.15s}
.can .fc button.sel{opacity:1;transform:scale(1.25)}
.hw{background:#FEF3C7;border:3px dashed #F59E0B;border-radius:20px;padding:12px 16px;font-size:22px;font-weight:800}

/* settings modal */
#settings{position:absolute;inset:0;background:#0F172Aaa;display:none;align-items:center;justify-content:center;z-index:80}
#settings .sbx{background:#fff;border-radius:30px;padding:26px 30px;width:760px;display:flex;flex-direction:column;gap:14px}
#settings h3{margin:0;font-family:Fredoka;font-size:34px}
#settings .trow{display:flex;gap:10px;align-items:center}
#settings input{font:inherit;font-size:22px;font-weight:800;border:3px solid #E2E8F0;border-radius:14px;padding:8px 12px;width:220px}
#settings .sw{width:40px;height:40px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;transition-duration:.01s !important}}
</style>
</head>
<body>
<div class="clouds"><i style="width:220px;height:60px;top:8%;animation-duration:90s"></i><i style="width:160px;height:46px;top:22%;animation-duration:70s;animation-delay:-30s"></i><i style="width:260px;height:70px;top:60%;animation-duration:120s;animation-delay:-60s"></i></div>
<div id="app"><div id="stage">
 <div id="home"></div>
 <div id="player">
  <div id="topbar"></div>
  <div id="slidebox"></div>
  <div id="botbar">
   <button class="nav-btn" id="bHome" title="Lessons (M)">🏠</button>
   <button class="nav-btn" id="bPrev" title="Back (←)">◀</button>
   <div id="stagebar"></div>
   <div id="counter"></div>
   <button class="nav-btn next" id="bNext" title="Next (→)">Next ▶</button>
  </div>
  <div id="notes"></div>
  <div id="timerPop"></div>
 </div>
 <div id="settings"></div>
</div></div>
<script>
/* ================= ART: icons, characters, figures ================= */
const SKIN={l:'#F7D5BC',m:'#E3AE86',t:'#C68A62',d:'#9A6646'};
const HAIRC={fair:'#F2CF6B',blond:'#F2CF6B',brown:'#7B4A2A',red:'#D9531E',black:'#231815',grey:'#BFC5CC',white:'#ECECEC',orange:'#E8742A'};
const EYEC={blue:'#2F7DE1',green:'#2E9E4F',brown:'#6B3F1F',black:'#1d1d1d'};

/* ---------- Kid / person avatar ---------- */
function person(o={},size=120){
  const skin=o.skin||SKIN.l, hair=HAIRC[o.hair]||o.hair||HAIRC.brown, eye=EYEC[o.eyes]||o.eyes||'#2b2b2b';
  const shirt=o.shirt||'#4F8EF7';
  const bigE=o.eyeSize==='big', bigM=o.mouth==='big', bigN=o.nose==='big', bigEar=o.ears==='big';

/* ---------- Creature / monster ---------- */
function creature(o={},size=260){
  const heads=o.heads??1, arms=o.arms??2, legs=o.legs??2, eyes=o.eyes??2, col=o.color||'#7C3AED', hands=o.hands, feet=o.feet;
  let s=`<svg viewBox="0 0 300 300" width="${size}" height="${size}">`;
  // legs
  const lx=i=>legs===1?150:110+i*(80/(legs-1));
  for(let i=0;i<legs;i++){const x=lx(i);s+=`<rect x="${x-9}" y="200" width="18" height="70" rx="8" fill="${col}"/><ellipse cx="${x}" cy="272" rx="17" ry="9" fill="#1f2937"/>`}
  // arms
  for(let i=0;i<arms;i++){const left=i%2===0, k=Math.floor(i/2);const y=150+k*26;const x1=left?100:200,x2=left?40:260;
    s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y-30+k*8}" stroke="${col}" stroke-width="14" stroke-linecap="round"/><circle cx="${x2}" cy="${y-30+k*8}" r="11" fill="#FBBF24"/>`}
  s+=`<ellipse cx="150" cy="170" rx="62" ry="55" fill="${col}"/><ellipse cx="150" cy="185" rx="34" ry="28" fill="#ffffff44"/>`;
  // heads
  const hx=i=>heads===1?150:(heads===2?[115,185][i]:[95,150,205][i]);
  for(let i=0;i<heads;i++){const x=hx(i),y=95;s+=`<circle cx="${x}" cy="${y}" r="${heads>2?30:38}" fill="${col}"/>`;
    const r=heads>2?30:38; const ne=Math.max(1,Math.round(eyes/heads));
    for(let e=0;e<ne;e++){const ex=ne===1?x:x-r*.45+e*(r*.9/(ne-1));s+=`<circle cx="${ex}" cy="${y-4}" r="${r*.22}" fill="#fff"/><circle cx="${ex}" cy="${y-3}" r="${r*.11}" fill="#111"/>`}
    s+=`<path d="M${x-r*.35} ${y+r*.38} Q${x} ${y+r*.7} ${x+r*.35} ${y+r*.38}" stroke="#111" stroke-width="3" fill="#fff"/>`}
  return s+'</svg>';
}

/* render an icon spec → html. spec: emoji | @svg | body:x | face:x | stick:x | col:x | num:n | person:Name | word-key */
function ic(spec,size=90){
  if(spec==null) return '';
  spec=String(spec);
  if(!EMOJI_RE.test(spec) && ICON[spec]!==undefined) spec=ICON[spec];
  if(spec.startsWith('@')) return svgIcon(spec.slice(1),size);
  if(spec.startsWith('body:')) return `<span class="svgi" style="height:${size}px">${bodyFig(spec.slice(5),size)}</span>`;
  if(spec.startsWith('face:')) return `<span class="svgi" style="height:${size}px">${faceFig(spec.slice(5),size)}</span>`;
  if(spec.startsWith('hair:')) return `<span class="svgi" style="height:${size}px">${faceFig('hair',size,spec.slice(5))}</span>`;
  if(spec.startsWith('stick:')) return `<span class="svgi" style="height:${size}px">${stick(spec.slice(6),size)}</span>`;
  if(spec.startsWith('col:')) {const c=COLOURS[spec.slice(4)]||spec.slice(4);return `<span class="swatch" style="width:${size}px;height:${size}px;background:${c}"></span>`}
  if(spec.startsWith('num:')) return `<span class="numb" style="font-size:${size*.8}px">${spec.slice(4)}</span>`;
  if(spec.startsWith('person:')) return `<span class="svgi" style="height:${size}px">${avatar(spec.slice(7),size)}</span>`;
  if(spec.startsWith('robot:')) return `<span class="svgi" style="height:${size}px">${robotSVG(size)}</span>`;
  if(spec.startsWith('creature:')) {let o={};try{o=JSON.parse(spec.slice(9))}catch(e){};return `<span class="svgi" style="height:${size}px;width:${size}px">${creature(o,size)}</span>`}
  if(EMOJI_RE.test(spec)||spec.length<=3) return `<span class="emo" style="font-size:${size*.82}px">${spec}</span>`;
  return `<span class="txtic" style="font-size:${Math.max(18,size*.28)}px">${spec}</span>`;
}
function hasIcon(w){return ICON[w]!==undefined}
function iconOf(w){return ICON[w]??(COLOURS[w]?'col:'+w:(NUMW.indexOf(w)>0?'num:'+NUMW.indexOf(w):null))}

  ${bar(`<button class="btn" data-a="all">▶ Listen &amp; repeat</button><button class="btn o" data-a="hide">👁 Hide / show words</button><button class="btn p" data-a="quiz">🎯 What’s this?</button>${s.sentence?`<button class="btn t" data-a="sent">💬 Say sentences</button>`:''}`)}`;
  let stop=false;
  const sentence=it=>it.s||(s.sentence?s.sentence.replace('{a}',art(it.w)+' '+it.w).replace('{w}',it.w):'');
  const show=async(k,withS)=>{$$('.vcard',b).forEach(c=>c.classList.remove('on'));const c=$(`.vcard[data-k="${k}"]`,b);c.classList.add('on','flip');setTimeout(()=>c.classList.remove('flip'),500);SFX.flip();await say(items[k].say||items[k].w);if(withS&&sentence(items[k]))await say(sentence(items[k]))};
  b.onclick=async e=>{
    const c=e.target.closest('.vcard');if(c){if(c.classList.contains('hide')&&c.classList.contains('q')){c.classList.remove('hide','q');}show(+c.dataset.k,true);return}
    const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
    if(act==='all'||act==='sent'){stop=false;for(let k=0;k<n&&!stop;k++){await show(k,act==='sent');await sleep(act==='all'?1300:700)}}
    if(act==='hide'){$$('.vcard',b).forEach(c=>c.classList.toggle('hide'))}
    if(act==='quiz'){const k=rnd(n);$$('.vcard',b).forEach(c=>c.classList.remove('on'));const c=$(`.vcard[data-k="${k}"]`,b);c.classList.add('on','hide','q');SFX.whoosh();say(s.ask||'What’s this?')}
  };

};

  const draw=()=>{if(!ex.length)return;const e=ex[k];$('.kk',b).textContent=k+1;$('.pic',b).innerHTML=`<span class="pop">${String(e.i).split(' ').map(x=>ic(x,e.size||200)).join('')}</span>`;

   if(a.dataset.a==='ans'){const an=$('.bub.a',b);an.style.visibility='visible';an.classList.add('pop');SFX.pop();await say(x.a)}};
  S.primary=async()=>{const x=ex[k];if(!x)return;const q=$('.bub.q',b);if(q.style.visibility==='hidden'&&x.q){$('[data-a="ask"]',b).click()}else if($('.bub.a',b).style.visibility==='hidden'){$('[data-a="ans"]',b).click()}else $('[data-a="next"]',b).click()};

/* ---- Chant / song ---- */
T.chant=(b,s)=>{
  const lines=s.lines.map(l=>typeof l==='string'?{t:l}:l);
  const side=s.side||[];
  b.innerHTML=`<div class="chant"><div class="lyr">${lines.map((l,k)=>l.t===''?'<div class="gap"></div>':`<div class="ln" data-k="${k}">${l.i?ic(l.i,40):'🎵'}<span>${fmt(l.t)}</span></div>`).join('')}</div>
   <div class="dance"><div class="dn" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${side.map((x,i)=>`<span class="bounce" style="animation-delay:${-i*.2}s">${ic(x,side.length>4?70:100)}</span>`).join('')}</div>
   <div class="big st">${esc(s.tip||'Listen, then chant along!')}</div>
   <div class="col" style="width:85%"><button class="btn o" data-a="play">▶ Listen</button><button class="btn g" data-a="echo">🔁 Echo: repeat after me</button><button class="btn p" data-a="all">🎤 All together</button><button class="btn ghost sm" data-a="stop">⏹ Stop</button></div></div></div>`;
  let run=0;
  const play=async mode=>{const my=++run;const st=$('.st',b);
    for(let k=0;k<lines.length;k++){if(my!==run)return;const l=lines[k];if(!l.t)continue;const el=$(`.ln[data-k="${k}"]`,b);$$('.ln',b).forEach(x=>x.classList.remove('on','echo'));el.classList.add('on');el.scrollIntoView({block:'nearest'});SFX.drum();
      if(mode==='all'){st.textContent='🎤 Everybody!';await say(l.t,{rate:TTS.rate*1.02});}
      else{st.textContent='👂 Listen…';await say(l.t);}
      if(my!==run)return;
      if(mode==='echo'){el.classList.remove('on');el.classList.add('echo');st.textContent='🗣️ Your turn!';await sleep(900+plain(l.t).split(' ').length*420)}
      else await sleep(250)}
    $$('.ln',b).forEach(x=>x.classList.remove('on','echo'));st.textContent='👏 Great chanting!';SFX.ok()};
  b.onclick=e=>{const ln=e.target.closest('.ln');if(ln){run++;$$('.ln',b).forEach(x=>x.classList.remove('on'));ln.classList.add('on');say(lines[+ln.dataset.k].t);return}
    const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a==='stop'){run++;TTS.stop();$$('.ln',b).forEach(x=>x.classList.remove('on','echo'));return}play(a.dataset.a)};
  S.primary=()=>play('play');
  return ()=>{run++};
};

/* ---- Story (comic panels) ---- */
T.story=(b,s)=>{
  let p=0,k=0,hide=false,run=0;
  b.innerHTML=`<div class="story"><div class="panel"></div><div class="row" style="justify-content:center;gap:12px">
   <button class="btn ghost" data-a="pp">◀ Panel</button><div class="dots">${s.panels.map((_,i)=>`<i data-p="${i}"></i>`).join('')}</div>
   <button class="btn" data-a="line">💬 Next line</button><button class="btn o" data-a="read">🔊 Read panel</button><button class="btn p" data-a="auto">📖 Read all</button><button class="btn ghost" data-a="hide">🙈 Hide text</button><button class="btn ghost" data-a="np">Panel ▶</button></div></div>`;
  const pan=$('.panel',b);
  const draw=()=>{const P=s.panels[p];const cast=P.cast||[];const big=cast.length<=2?190:cast.length===3?165:135;
    const props=(P.props||[]).map((x,i)=>{const sp=String(x).split('|');const pos=sp[1]?sp[1].split(','):[ [6,10],[80,12],[30,6],[62,20],[88,40],[12,40],[45,30],[70,4] ][i%8];const sz=+(sp[2]||76);return `<span class="float" style="left:${pos[0]}%;top:${pos[1]}%;animation-delay:${-i}s">${ic(sp[0],sz)}</span>`}).join('');
    pan.innerHTML=`<div class="bgp" style="background:${BG[P.bg]||BG.park}"></div><div class="props">${props}</div><div class="pno">${p+1}</div>${P.cap?`<div class="cap">${esc(P.cap)}</div>`:''}
     <div class="cast">${cast.map(c=>`<div class="who" data-c="${esc(c)}"><div class="sbs"></div>${avatar(c,big)}<div class="nm">${esc(c)}</div></div>`).join('')}</div>`;
    $$('.dots i',b).forEach((d,i)=>d.classList.toggle('on',i===p));for(let j=0;j<k;j++)bubble(j,false)};
  const bubble=(j,anim=true)=>{const [who,txt]=s.panels[p].lines[j];let w=$(`.who[data-c="${who}"]`,pan);
    if(!w){const c=$('.cap',pan)||(()=>{const d=document.createElement('div');d.className='cap';pan.appendChild(d);return d})();c.innerHTML=`${esc(who)}: ${fmt(txt)}`;return}
    $$('.who',pan).forEach(x=>x.classList.remove('talk'));w.classList.add('talk');
    const sbs=$('.sbs',w);$$('.sb',sbs).forEach(x=>x.classList.add('old'));const d=document.createElement('div');d.className='sb';d.innerHTML=hide?'💭 …':fmt(txt);if(!anim)d.style.animation='none';sbs.insertBefore(d,sbs.firstChild);
    while(sbs.children.length>1)sbs.lastChild.remove();
    sbs.style.transform='translateX(-50%)';const pr=rect(pan),r=rect(sbs);let dx=0;if(r.x<pr.x+10)dx=pr.x+10-r.x;else if(r.x+r.w>pr.x+pr.w-10)dx=pr.x+pr.w-10-(r.x+r.w);if(dx)sbs.style.transform=`translateX(calc(-50% + ${dx}px))`};
  const line=async()=>{const P=s.panels[p];if(k>=P.lines.length){if(p<s.panels.length-1){p++;k=0;draw();SFX.whoosh()}return}
    const [who,txt]=P.lines[k];bubble(k);k++;SFX.pop();await say(txt,{pitch:charPitch(who)})};
  const readPanel=async(my)=>{k=0;draw();for(const _ of s.panels[p].lines){if(my!==run)return;await line();await sleep(250)}};
  draw();
  b.onclick=async e=>{const d=e.target.closest('.dots i');if(d){run++;p=+d.dataset.p;k=0;draw();return}
   const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
   if(act==='np'){run++;if(p<s.panels.length-1){p++;k=0;draw();SFX.whoosh()}}
   if(act==='pp'){run++;if(p>0){p--;k=0;draw();SFX.whoosh()}}
   if(act==='line'){run++;line()}
   if(act==='read'){const my=++run;readPanel(my)}
   if(act==='auto'){const my=++run;for(p=0;p<s.panels.length;p++){if(my!==run)return;await readPanel(my);await sleep(600)}p=s.panels.length-1}
   if(act==='hide'){hide=!hide;a.classList.toggle('on');draw()}};
  S.primary=()=>{run++;line()};
  return ()=>{run++};
};

/* ---- Dialogue / role-play ---- */
T.dialogue=(b,s)=>{
  const sw=s.swaps||(s.swap?[s.swap]:[]);const cur={};sw.forEach(x=>cur[x.key]=x.opts[0]);let mask=-1,run=0;
  const fill=t=>t.replace(/\{(\w+)\}/g,(m,key)=>cur[key]!=null?`**${cur[key]}**`:m);
  b.innerHTML=`<div class="dlg"><div class="ch">${avatar(s.cast[0],200)}<div class="nm">${esc(s.cast[0])}</div><button class="btn ghost sm" data-a="mask0">🙈 Hide</button></div>
   <div class="col" style="height:100%;justify-content:center"><div class="dlines"></div>
   ${sw.map(x=>`<div class="swapchips" data-key="${x.key}"><b style="align-self:center;font-size:20px">${esc(x.label||'Change:')}</b>${x.opts.map(o=>`<span class="chip ${o===cur[x.key]?'sel':''}" data-o="${esc(o)}">${iconOf(o)?ic(iconOf(o),30):''}${esc(o)}</span>`).join('')}</div>`).join('')}
   </div><div class="ch">${avatar(s.cast[1],200)}<div class="nm">${esc(s.cast[1])}</div><button class="btn ghost sm" data-a="mask1">🙈 Hide</button></div></div>

  const draw=()=>{$('.dlines',b).innerHTML=s.lines.map(([w,t],i)=>`<div class="dl ${w?'R':'L'} ${mask===w?'masked':''}" data-i="${i}"><span class="tx">${fmt(fill(t))}</span></div>`).join('')};
  draw();
  const play=async()=>{const my=++run;for(let i=0;i<s.lines.length;i++){if(my!==run)return;const el=$(`.dl[data-i="${i}"]`,b);$$('.dl',b).forEach(x=>x.classList.remove('on'));el.classList.add('on');await say(fill(s.lines[i][1]),{pitch:charPitch(s.cast[s.lines[i][0]])});await sleep(300)}$$('.dl',b).forEach(x=>x.classList.remove('on'))};
  b.onclick=e=>{const c=e.target.closest('.swapchips .chip');if(c){const key=c.parentNode.dataset.key;cur[key]=c.dataset.o;$$('.chip',c.parentNode).forEach(x=>x.classList.toggle('sel',x===c));draw();SFX.click();return}
   const dl=e.target.closest('.dl');if(dl){const i=+dl.dataset.i;say(fill(s.lines[i][1]),{pitch:charPitch(s.cast[s.lines[i][0]])});return}
   const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
   if(act==='play')play();
   if(act==='mask0'){mask=mask===0?-1:0;draw()}if(act==='mask1'){mask=mask===1?-1:1;draw()}
   if(act==='rand'){sw.forEach(x=>{cur[x.key]=x.opts[rnd(x.opts.length)]});$$('.swapchips',b).forEach(g=>$$('.chip',g).forEach(c=>c.classList.toggle('sel',c.dataset.o===cur[g.dataset.key])));draw();SFX.whoosh()}
   if(act==='act'){const n1=1+rnd(S.classSize),n2=1+rnd(S.classSize);a.innerHTML=`🎭 Students #${n1} &amp; #${n2===n1?(n1%S.classSize)+1:n2}`;SFX.drum()}};
  S.primary=play;return ()=>{run++};

/* ---- Multiple choice (also listening / odd one out) ---- */
function mcqEngine(b,qs,o={}){
  // returns controller; renders into b
  let qi=0,got=0,locked=false;
  const prep=qs.map(q=>{const opts=q.o.map((x,i)=>({x,ok:i===q.a}));return {...q,opts:(o.keep||q.keep)?opts:shuffle(opts)}});
  const draw=()=>{const q=prep[qi];locked=false;const n=q.opts.length;const cols=o.cols||(n===4&&q.opts.some(x=>cellText(x.x).length>14)?2:Math.min(n,4));
    const pic=q.i?`<div class="qpic">${String(q.i).split(' ').map(x=>ic(x,q.size||(n>3?170:220))).join('')}</div>`:'';
    b.innerHTML=`<div class="quiz"><div class="qdots">${prep.map((_,i)=>`<i class="${i<qi?'ok':i===qi?'cur':''}"></i>`).join('')}</div>
     <div class="qtop">${q.say?`<button class="speak-btn" data-a="say">🔊</button>`:''}<div class="qtext">${q.q?fmt(q.q):(q.say?'Listen and choose!':'')}</div></div>
     ${pic}<div class="opts" style="grid-template-columns:repeat(${cols},1fr)">${q.opts.map((x,i)=>`<button class="opt" data-i="${i}">${cell(x.x,o.osize||(cellText(x.x)?60:100))}</button>`).join('')}</div>
     <div class="explain" style="visibility:hidden"></div></div>`;
    if(q.say)setTimeout(()=>say(q.say),350)};
  const done=()=>{b.innerHTML=`<div class="quiz center" style="justify-content:center"><div style="font-size:140px" class="bounce">🏆</div><div class="qtext">Great job! ${got} / ${prep.length} first try</div>${bar(`<button class="btn g" data-a="again">🔁 Play again</button>`)}</div>`;confetti();SFX.win()};
  let first=true;
  b.onclick=async e=>{
    const a=e.target.closest('[data-a]');if(a){if(a.dataset.a==='say')say(prep[qi].say);if(a.dataset.a==='again'){qi=0;got=0;draw()}if(a.dataset.a==='nextq'){qi++;first=true;if(qi>=prep.length)done();else draw()}return}
    const btn=e.target.closest('.opt');if(!btn||locked)return;const q=prep[qi];const x=q.opts[+btn.dataset.i];
    if(x.ok){locked=true;btn.classList.add('okc');fb(btn,true);if(first){got++;if(o.team!==false)award(1,btn)}
      const exp=$('.explain',b);const said=q.ex||(cellText(x.x)?cellText(x.x):'');if(q.ex){exp.innerHTML='✔ '+fmt(q.ex);exp.style.visibility='visible'}
      if(said)say(said);if(o.team!==false&&S.teams.length>1)setTimeout(nextTeam,700);
      const nb=document.createElement('div');nb.className='toolbar';nb.innerHTML=`<button class="btn g" data-a="nextq">${qi<prep.length-1?'Next question ▶':'Finish 🏁'}</button>`;$('.quiz',b).appendChild(nb);
    } else {btn.classList.add('badc');fb(btn,false);first=false;if(o.team!==false&&S.teams.length>1&&o.steal)nextTeam()}
  };
  draw();
  return {next:()=>{const nb=$('[data-a="nextq"]',b);if(nb)nb.click();else if(prep[qi].say)say(prep[qi].say)}};
}
T.mcq=(b,s)=>{const c=mcqEngine(b,s.qs,s);S.primary=c.next};

  const ask=()=>{if(ti>=order.length){$('.tq',b).textContent='🎉 You found them all!';confetti();SFX.win();return}const t=order[ti];$('.rd',b).textContent=`${ti+1}/${order.length}`;const q=(s.q||'Find the {w}!').replace('{w}',t.w);$('.tq',b).innerHTML=fmt(q.replace(t.w,'**'+t.w+'**'));say(q)};
  b.onclick=e=>{const a=e.target.closest('[data-a]');if(a){const t=order[ti];if(t)say((s.q||'Find the {w}!').replace('{w}',t.w));return}

   if(it.dataset.w===t.w){it.style.outline='6px solid #16A34A';it.style.borderRadius='50%';it.style.background='#DCFCE7aa';it.classList.remove('hi');fb(it,true);award(1,it);say(s.ans?s.ans.replace('{a}',art(t.w)+' '+t.w).replace('{w}',t.w):`Here it is! The ${t.w}!`);ti++;if(S.teams.length>1)setTimeout(nextTeam,600);setTimeout(ask,1600)}
   else{fb(it,false);say(`That’s ${art(it.dataset.w)} ${it.dataset.w}.`)}};

}

function go(i){
  if(i<0||i>=S.slides.length)return;
  if(S.cleanup){try{S.cleanup()}catch(e){}S.cleanup=null}S.primary=null;TTS.stop();

  $('#stagebar').innerHTML=groups.map(g=>{const cur=i>=g.first&&i<g.first+g.n;const pct=i>=g.first+g.n?100:cur?((i-g.first+1)/g.n*100):0;return `<div class="sg st-${g.st} ${cur?'cur':''}" style="--n:${g.n+1}" data-go="${g.first}" title="${STAGES[g.st].n}"><div class="fill" style="width:${pct}%"></div><span>${STAGES[g.st].i} ${STAGES[g.st].n}</span></div>`}).join('');
