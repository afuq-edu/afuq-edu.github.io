{stage:'present',type:'story',title:'أَسْتَمِعُ وَأُجِيبُ',p:19,art:'🕋<br>🏘️⛰️',bg:'desert',lines:[{nar:'كَانَ رَسُولُ اللَّهِ ﷺ ذَاهِبًا لِلصَّلاةِ عِنْدَ الْكَعْبَةِ فَرَآهُ أَبُو جَهْلٍ فَأَرَادَ أَنْ يَمْنَعَهُ مِنْ ذَلِكَ،'},{nar:'وَقَالَ: إِنْ رَأَيْتُ مُحَمَّدًا يُصَلِّي عِنْدَ الْكَعْبَةِ فَسَوْفَ أَطَأُ بِقَدَمِي عَلَى رَقَبَتِهِ،'},{nar:'لَكِنَّ رَسُولَ اللَّهِ ﷺ اسْتَمَرَّ فِي سَيْرِهِ إِلَى الْكَعْبَةِ لِيُصَلِّيَ، وَبَدَأَ بِالصَّلاةِ'},{nar:'فَدَعَا أَبُو جَهْلٍ قَوْمَهُ مِنْ أَهْلِ قُرَيْشٍ لِيُشَاهِدُوا كَيْفَ يَطَأُ عَلَى رَقَبَةِ الرَّسُولِ ﷺ،'},{nar:'وَعِنْدَمَا سَجَدَ الرَّسُولُ ﷺ لَمْ يَسْتَطِعْ أَبُو جَهْلٍ الْوُصُولَ إِلَيْهِ،'},{nar:'فَرَجَعَ إِلَى قَوْمِهِ خَائِبًا مُوقِنًا بِأَنَّ اللَّهَ تَعَالَى يَحْمِي رَسُولَهُ مُحَمَّدًا ﷺ.'}],note:'اقرأ القصة بأسلوب مشوّق (كل ضغطة تُظهر جزءًا)، ثم انتقل إلى الأسئلة.'},
{stage:'practice',type:'discuss',title:'أُجِيبُ شَفَوِيًّا',p:20,art:'🕋🤔',bg:'desert',qs:[{q:'عَنْ أَيِّ شَيْءٍ أَرَادَ أَبُو جَهْلٍ مَنْعَ الرَّسُولِ مُحَمَّدٍ ﷺ؟',a:'عَنِ الصَّلاةِ عِنْدَ الْكَعْبَةِ.'},{q:'هَلْ تَحَقَّقَتْ رَغْبَةُ أَبِي جَهْلٍ؟ وَلِمَاذَا؟',a:'لَا؛ لِأَنَّ اللَّهَ تَعَالَى حَمَى رَسُولَهُ ﷺ فَلَمْ يَسْتَطِعِ الْوُصُولَ إِلَيْهِ.'},{q:'مَنِ الَّذِي حَمَى الرَّسُولَ ﷺ مِنْ أَبِي جَهْلٍ؟',a:'اللَّهُ تَعَالَى.'}]},
{stage:'present',type:'explain',title:'الْقِصَّةُ فِي آيَاتِ السُّورَةِ',text:'نَزَلَتْ آيَاتٌ مِنْ سُورَةِ الْعَلَقِ فِي هَذِهِ الْقِصَّةِ:',points:[{i:'🚫',t:'﴿أَرَأَيْتَ الَّذِي يَنْهَىٰ﴾ ← أَبُو جَهْلٍ يَنْهَى عَنِ الصَّلاةِ.'},{i:'🕋',t:'﴿عَبْدًا إِذَا صَلَّىٰ﴾ ← رَسُولُ اللَّهِ ﷺ يُصَلِّي عِنْدَ الْكَعْبَةِ.'},{i:'👥',t:'﴿فَلْيَدْعُ نَادِيَهُ﴾ ← دَعَا أَبُو جَهْلٍ قَوْمَهُ.'},{i:'✨',t:'﴿سَنَدْعُ الزَّبَانِيَةَ﴾ ← اللَّهُ يَدْعُو مَلَائِكَةَ الْعَذَابِ.'},{i:'🤲',t:'﴿كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب﴾ ← وَاصِلْ صَلاتَكَ.'}],box:'اللَّهُ تَعَالَى يَحْمِي رَسُولَهُ ﷺ، وَلَا نُطِيعُ مَنْ يَنْهَانَا عَنِ الصَّلاةِ.',note:'أظهر النقاط واحدة واحدة، واطلب من الطلاب تلاوة الآية قبل قراءة معناها.'},
{stage:'practice',type:'check',title:'أَتَأَمَّلُ وَأَسْتَنْتِجُ',p:20,text:'أَتَأَمَّلُ الرُّسُومَاتِ: 👧🏻📗 بِنْتٌ تَقْرَأُ – 👦🏻✏️ وَلَدٌ يَكْتُبُ – 👩🏻‍🔬🧪 بِنْتٌ تُجْرِي تَجْرِبَةً. أَسْتَنْتِجُ: مِنْ طُرُقِ تَعَلُّمِ الْعِلْمِ:',items:[{t:'الْقِرَاءَةُ',i:'📗',ok:true},{t:'النَّوْمُ فِي الصَّفِّ',i:'😴',ok:false},{t:'الْكِتَابَةُ',i:'✏️',ok:true},{t:'التَّجْرِبَةُ',i:'🧪',ok:true},{t:'اللَّعِبُ طُولَ الْيَوْمِ',i:'🎮',ok:false}],note:'إجابة الكتاب: القراءة، والكتابة، والتجربة. اطلب من الطلاب كتابتها في الفراغات ص ٢٠.'},
{stage:'present',type:'scene',title:'أَفْهَمُ وَأَتَعَلَّمُ',p:20,art:'🌍🌙⭐<br>🏠🌳🐦',bg:'night',size:100,q:['مَاذَا تَفْهَمُ مِنْ قَوْلِ اللَّهِ تَعَالَى: ﴿أَرَأَيْتَ إِن كَذَّبَ وَتَوَلَّىٰ﴾ ﴿أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ﴾؟'],ans:'أَنَّ اللَّهَ سُبْحَانَهُ وَتَعَالَى يَرَى كُلَّ شَيْءٍ، وَيَطَّلِعُ عَلَى جَمِيعِ أَعْمَالِنَا.',note:'استمع لإجابات الطلاب ثم أظهر الإجابة. اسأل: «إذا كان الله يرانا، كيف نتصرف حين لا يرانا أحد؟»'},
{stage:'present',type:'explain',title:'أَتَعَلَّمُ وَأُطَبِّقُ: سُجُودُ التِّلَاوَةِ',p:21,text:'أَتَعَلَّمُ مَعْنَى سُجُودِ التِّلاوَةِ وَأُطَبِّقُهُ أَثْنَاءَ تِلاوَتِي لِلْقُرْآنِ الْكَرِيمِ: ﴿كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب ۩﴾',points:[{i:'👈',t:'۩ هَذِهِ عَلامَةُ سُجُودِ التِّلاوَةِ فِي الْقُرْآنِ الْكَرِيمِ.'},{i:'📖',t:'عِنْدَمَا أَتْلُو آيَةً فِي آخِرِهَا هَذِهِ الْعَلامَةُ أَسْجُدُ لِلَّهِ تَعَالَى.'},{i:'🤲',t:'وَأَقُولُ فِي سُجُودِي: «سُبْحَانَ رَبِّيَ الأَعْلَى».'}],box:'سُجُودُ التِّلاوَةِ: سَجْدَةٌ أَسْجُدُهَا عِنْدَ تِلاوَةِ آيَةِ السَّجْدَةِ ۩',art:'۩',bg:'mosque',artW:300,note:'اعرض علامة ۩ في مصحف حقيقي، وبيّن أن السجدة تكون أثناء قراءة القرآن.'},
{stage:'practice',type:'perform',title:'أُطَبِّقُ: أَتْلُو وَأَسْجُدُ',i:'۩',text:'أَتْلُو سُورَةَ الْعَلَقِ، وَعِنْدَمَا أَصِلُ إِلَى ﴿وَاسْجُدْ وَاقْتَرِب ۩﴾ أَسْجُدُ سُجُودَ التِّلاوَةِ وَأَقُولُ: «سُبْحَانَ رَبِّيَ الأَعْلَى».',secs:90,note:'اختر طالبًا أو طالبين للتلاوة، ثم يطبّق الجميع سجدة التلاوة عند الآية الأخيرة. قيّم بالنجوم.'},
{stage:'present',type:'cards',title:'تَعَلَّمْتُ مِنْ سُورَةِ الْعَلَقِ',p:21,text:'اضْغَطْ عَلَى كُلِّ بِطَاقَةٍ: تَعَلَّمْتُ مِنْ سُورَةِ الْعَلَقِ…',cols:4,items:[{i:'📖✏️',t:'الْقِرَاءَةُ وَالْكِتَابَةُ',d:'أَهَمِّيَّةَ الْقِرَاءَةِ وَالْكِتَابَةِ.'},{i:'🔁',t:'تَكْرَارُ (اقْرَأْ)',d:'أَنَّ تَكْرَارَ كَلِمَةِ (اقْرَأْ) دَلِيلٌ عَلَى أَهَمِّيَّةِ طَلَبِ الْعِلْمِ.'},{i:'🤝',t:'الْغَنِيُّ الْمُتَوَاضِعُ',d:'أَنَّهُ يَنْبَغِي لِلْغَنِيِّ أَنْ يَتَوَاضَعَ لِلنَّاسِ وَلَا يَتَكَبَّرَ.'},{i:'🌍',t:'اللَّهُ يَرَى',d:'أَنَّ اللَّهَ سُبْحَانَهُ وَتَعَالَى يَطَّلِعُ عَلَى جَمِيعِ أَعْمَالِنَا.'}],note:'بعد قلب كل بطاقة اسأل: «مِن أيّ آية تعلّمنا ذلك؟»'},
{stage:'assess',type:'fill',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:22,items:[{t:'﴿أَرَأَيْتَ الَّذِي يَنْهَىٰ﴾ الَّذِي كَانَ يَنْهَى النَّبِيَّ ﷺ عَنِ الصَّلاةِ عِنْدَ الْكَعْبَةِ هُوَ ___ .',a:'أَبُو جَهْلٍ',o:['أَبُو جَهْلٍ','أَحَدُ الصِّغَارِ']},{t:'﴿فَلْيَدْعُ نَادِيَهُ﴾ كَلِمَةُ نَادِيَهِ فِي الآيَةِ الْكَرِيمَةِ يُقْصَدُ بِهَا ___ .',a:'قَوْمُهُ وَأَهْلُ مَجْلِسِهِ',o:['النَّادِي الرِّيَاضِيُّ','قَوْمُهُ وَأَهْلُ مَجْلِسِهِ','مُقَدَّمَةُ الرَّأْسِ']},{t:'﴿سَنَدْعُ الزَّبَانِيَةَ﴾ الْمُرَادُ بِالزَّبَانِيَةِ فِي الآيَةِ الْكَرِيمَةِ ___ .',a:'مَلَائِكَةُ الْعَذَابِ',o:['مَلَائِكَةُ الْعَذَابِ','أَصْحَابُ أَبِي جَهْلٍ','الطُّيُورُ']}],note:'نشاط الكتاب ص ٢٢: أُكمل الفراغ بما يناسبه.'},
{stage:'assess',type:'mcq',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الثَّانِي',p:22,qs:[{q:'تَكْرَارُ كَلِمَةِ ﴿اقْرَأْ﴾ فِي السُّورَةِ الْكَرِيمَةِ يَدُلُّ عَلَى أَهَمِّيَّةِ:',o:['الْكِتَابَةِ','الْقَلَمِ','الْعِلْمِ'],a:2,i:'📚'},{q:'يُرَادُ بِالنَّاصِيَةِ فِي قَوْلِهِ تَعَالَى ﴿لَنَسْفَعًا بِالنَّاصِيَةِ﴾:',o:['مُؤَخِّرَةُ الرَّأْسِ','مُقَدَّمَةُ الرَّأْسِ','وَسَطُ الرَّأْسِ'],a:1,i:'🙂'},{q:'سَجْدَةُ التِّلاوَةِ عَادَةً مَا تَكُونُ فِي أَثْنَاءِ:',o:['سَمَاعِ الأَذَانِ','قِرَاءَةِ الْقُرْآنِ','الدُّعَاءِ'],a:1,i:'۩'}],note:'نشاط الكتاب ص ٢٢–٢٣: أختار الإجابة الصحيحة.'},
{stage:'assess',type:'match',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الثَّالِثُ',p:24,pairs:[['قَدْ يَدْفَعُ بِالإِنْسَانِ إِلَى التَّكَبُّرِ','💰 الْغِنَى'],['يَكُونُ الرُّجُوعُ إِلَى اللَّهِ تَعَالَى','⚖️ يَوْمَ الْقِيَامَةِ'],['مِنْ أَدَوَاتِ تَوْثِيقِ الْعِلْمِ','✏️ الْقَلَمُ']],note:'نشاط الكتاب ص ٢٤: أصل بخط بين العمود الأول وما يناسبه في العمود الثاني.'},
{stage:'assess',type:'tf',title:'صَحٌّ أَمْ خَطَأٌ؟',items:[{t:'تَرْتِيبُ سُورَةِ الْعَلَقِ فِي الْمُصْحَفِ (٩٦)، وَعَدَدُ آيَاتِهَا (١٩).',a:true},{t:'الآيَاتُ الْخَمْسُ الأُولَى مِنْ سُورَةِ الْعَلَقِ أَوَّلُ مَا نَزَلَ مِنَ الْقُرْآنِ.',a:true},{t:'اسْتَطَاعَ أَبُو جَهْلٍ أَنْ يَمْنَعَ الرَّسُولَ ﷺ مِنَ الصَّلاةِ.',a:false,why:'لَمْ يَسْتَطِعْ؛ لِأَنَّ اللَّهَ تَعَالَى حَمَى رَسُولَهُ ﷺ.'},{t:'الْغَنِيُّ يَتَكَبَّرُ عَلَى النَّاسِ.',a:false,why:'يَنْبَغِي لِلْغَنِيِّ أَنْ يَتَوَاضَعَ لِلنَّاسِ وَلَا يَتَكَبَّرَ.'}]},

{stage:'assess',type:'tf',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:28,items:[{t:'بَادَرَتْ فَاطِمَةُ بِإِلْقَاءِ تَحِيَّةِ الإِسْلامِ عَلَى مُدِيرَةِ الْمَدْرَسَةِ.',a:true},{t:'رَفَعَتْ أَمَلُ صَوْتَهَا أَثْنَاءَ حَدِيثِهَا مَعَ خَالَتِهَا.',a:false,why:'نَخْفِضُ أَصْوَاتَنَا عِنْدَ الْحَدِيثِ مَعَ الْكَبِيرِ تَوْقِيرًا لَهُ.'},{t:'قَدَّمَ سَعِيدٌ تِلْمِيذًا أَصْغَرَ مِنْهُ عِنْدَ الشِّرَاءِ مِنَ الْجَمْعِيَّةِ التَّعَاوُنِيَّةِ.',a:true},{t:'ضَرَبَ خَالِدٌ أَخَاهُ الصَّغِيرَ بِشِدَّةٍ لِأَنَّهُ اسْتَخْدَمَ دَرَّاجَتَهُ.',a:false,why:'نَرْحَمُ الصَّغِيرَ وَنَتَلَطَّفُ بِهِ وَلَا نَضْرِبُهُ.'}],note:'نشاط الكتاب ص ٢٨: (✓) للسلوك الصحيح و(×) للسلوك الخطأ.'},
{stage:'assess',type:'write',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الثَّانِي',p:28,i:'✍️',prompt:'أَكْتُبُ الْعِبَارَةَ الآتِيَةَ: «الرَّاحِمُونَ يَرْحَمُهُمُ الرَّحْمَنُ»',model:'الرَّاحِمُونَ يَرْحَمُهُمُ الرَّحْمَنُ',note:'اكتب العبارة على السبورة بخط واضح، ثم يكتبها الطلاب في الكتاب ص ٢٨. وضّح: من يرحم الناس يرحمه الله.'},

{stage:'present',type:'story',title:'أَسْتَمِعُ وَأَسْتَنْتِجُ (٢)',p:31,art:'🎁❓<br>📖💚',bg:'garden',chars:{'أَحْمَدُ':{e:'👦🏻',c:'#e3f2ff'},'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'}},lines:[{who:'أَحْمَدُ',t:'وَأَنَا أَيْضًا أُرِيدُ الْمُشَارَكَةَ فِي الْمُسَابَقَةِ لِأَفُوزَ وَأَحْصُلَ عَلَى هَدِيَّةٍ مِثْلَ مَرْيَمَ.'},{who:'مَرْيَمُ',t:'وَلَكِنِّي لَمْ أَحْفَظْهُ طَمَعًا فِي الْهَدِيَّةِ يَا أَحْمَدُ، بَلْ حَفِظْتُهُ حُبًّا فِيهِ وَطَمَعًا فِي الثَّوَابِ مِنَ اللَّهِ تَعَالَى.'}],note:'توقف عند جواب مريم واسأل: «لماذا حفظت مريم القرآن؟»'},

{stage:'present',type:'cards',title:'أَتَأَمَّلُ وَأُعَبِّرُ: لِمَاذَا أُحِبُّ الْقُرْآنَ؟',p:32,text:'أُعَبِّرُ شَفَوِيًّا عَنْ أَسْبَابِ حُبِّي لِلْقُرْآنِ الْكَرِيمِ: أُحِبُّهُ لِأَنَّهُ…',cols:4,items:[{i:'📖',t:'كَلَامُ اللَّهِ',d:'وَرِسَالَةُ اللَّهِ إِلَى النَّاسِ'},{i:'💡',t:'نُورٌ',d:'يُنِيرُ قَلْبِي وَطَرِيقِي'},{i:'🧭',t:'هِدَايَةٌ',d:'يَدُلُّنِي عَلَى الطَّرِيقِ الصَّحِيحِ'},{i:'😊',t:'سَعَادَةٌ',d:'يَمْلَأُ قَلْبِي فَرَحًا وَطُمَأْنِينَةً'},{i:'🌧️',t:'بَرَكَةٌ',d:'يَجْلِبُ الْخَيْرَ لِبَيْتِي وَأُسْرَتِي'},{i:'🌸',t:'خَيْرٌ',d:'يَأْمُرُنِي بِكُلِّ خَيْرٍ'},{i:'🩺',t:'شِفَاءٌ',d:'شِفَاءٌ لِمَا فِي الصُّدُورِ'},{i:'⭐',t:'حَسَنَاتٌ',d:'لِي بِكُلِّ حَرْفٍ أَقْرَؤُهُ حَسَنَةٌ'}],note:'كلمات الرسمة ص ٣٢: كلام الله – نور – هداية – سعادة – بركة – خير – شفاء – حسنات – رسالة الله. اطلب من كل طالب جملة: «أُحِبُّ القرآنَ لأنّه…».'},
{stage:'practice',type:'match',title:'أَتَعَلَّمُ وَأُطَبِّقُ: أُحِبُّ الْقُرْآنَ الْكَرِيمَ فَـ…',p:33,pairs:[['أَسْتَمِعُ لَهُ.','🎧📱 بِنْتٌ تَسْتَمِعُ لِلْقُرْآنِ'],['أَتْلُوهُ دَائِمًا.','📖 وَلَدٌ يَقْرَأُ فِي الْمُصْحَفِ'],['أَتَدَبَّرُ مَعَانِيَهُ.','❓ «مَا مَعْنَى هَذِهِ الآيَةِ يَا أُمِّي؟»'],['أَحْفَظُهُ.','🤲 «اللَّهُمَّ أَعِنِّي عَلَى حِفْظِ الْقُرْآنِ»']],note:'نشاط التوصيل ص ٣٣: أصل بخط بين العبارة وما يناسبها.'},
{stage:'present',type:'explain',title:'آدَابُ تِلَاوَةِ الْقُرْآنِ الْكَرِيمِ',text:'أُحِبُّ الْقُرْآنَ الْكَرِيمَ فَأُعَظِّمُهُ وَأَتَأَدَّبُ مَعَهُ:',points:[{i:'💧',t:'أَتَوَضَّأُ قَبْلَ أَنْ أَمَسَّ الْمُصْحَفَ الشَّرِيفَ.'},{i:'🛡️',t:'أَسْتَعِيذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ قَبْلَ التِّلاوَةِ.'},{i:'🐢',t:'أَقْرَأُ بِتَأَنٍّ وَلَا أَتَعَجَّلُ.'},{i:'🤫',t:'أُنْصِتُ عِنْدَمَا أَسْمَعُ الْقُرْآنَ.'},{i:'⬆️',t:'أَضَعُ الْمُصْحَفَ فِي مَكَانٍ عَالٍ نَظِيفٍ، وَلَا أَضَعُهُ عَلَى الأَرْضِ.'}],art:'📖',bg:'mosque',artW:300,note:'أظهر الآداب واحدًا واحدًا، واطلب من طالب أن يمثّل الأدب أمام زملائه.'},
{stage:'practice',type:'mcq',title:'أَتَحَقَّقُ مِنْ فَهْمِي',qs:[{q:'انْتَهَيْتَ مِنْ قِرَاءَةِ الْقُرْآنِ، أَيْنَ تَضَعُ الْمُصْحَفَ؟',o:['عَلَى الأَرْضِ','فِي مَكَانٍ عَالٍ نَظِيفٍ','تَحْتَ الْوِسَادَةِ'],a:1,i:'📖'},{q:'سَمِعْتَ الْقُرْآنَ يُتْلَى فِي الْمَسْجِدِ، مَاذَا تَفْعَلُ؟',o:['أَتَكَلَّمُ مَعَ صَدِيقِي','أَسْتَمِعُ وَأُنْصِتُ','أَلْعَبُ'],a:1,i:'🕌'},{q:'حَفِظَتْ مَرْيَمُ الْقُرْآنَ:',o:['طَمَعًا فِي الْهَدِيَّةِ','حُبًّا فِيهِ وَطَمَعًا فِي الثَّوَابِ','لِتَتَفَاخَرَ عَلَى أَخِيهَا'],a:1,i:'🧕🏻'}]},
{stage:'assess',type:'discuss',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:34,art:'📖🎧',bg:'mosque',qs:[{q:'أَتْلُو الآيَةَ الْكَرِيمَةَ ثُمَّ أُعَبِّرُ عَمَّا أَسْتَنْتِجُهُ مِنْهَا شَفَوِيًّا: قَالَ اللَّهُ تَعَالَى: ﴿وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنصِتُوا لَعَلَّكُمْ تُرْحَمُونَ﴾ (الأعراف: ٢٠٤)',a:'إِذَا قُرِئَ الْقُرْآنُ أَسْتَمِعُ لَهُ وَأُنْصِتُ وَلَا أَتَكَلَّمُ، وَبِذَلِكَ يَرْحَمُنِي اللَّهُ تَعَالَى.'}],note:'اتلُ الآية تلاوة نموذجية، ويرددها الطلاب، ثم استمع لاستنتاجاتهم قبل إظهار الإجابة.'},
{stage:'assess',type:'classify',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الثَّانِي',p:34,text:'أُقَيِّمُ الأَفْعَالَ الآتِيَةَ بِوَضْعِهَا فِي الْمَكَانِ الْمُنَاسِبِ:',bins:[{t:'أَفْعَلُ',i:'✅',c:'#22a559'},{t:'لَا أَفْعَلُ',i:'❌',c:'#e5484d'}],items:[{t:'أَتَعَجَّلُ أَثْنَاءَ قِرَاءَةِ الْقُرْآنِ الْكَرِيمِ.',i:'⏩',b:1},{t:'أَضَعُ الْمُصْحَفَ الشَّرِيفَ عَلَى الأَرْضِ بَعْدَ الْقِرَاءَةِ.',i:'⬇️',b:1},{t:'أَقْرَأُ الْقُرْآنَ الْكَرِيمَ وَأَتَدَبَّرُ مَعَانِيَهُ.',i:'📖',b:0},{t:'أَتَكَاسَلُ عَنْ حِفْظِ السُّوَرِ الْكَرِيمَةِ الْمُقَرَّرَةِ لِلْحِفْظِ.',i:'😴',b:1}],note:'نشاط الكتاب ص ٣٤: يضع الطالب (✓) في عمود «أفعل» أو «لا أفعل».'},
{stage:'assess',type:'write',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الثَّالِثُ',p:35,i:'💌',prompt:'مَا نَصِيحَتُكَ لِمَنْ يَهْجُرُ الْقُرْآنَ الْكَرِيمَ؟',model:'أَنْصَحُهُ أَنْ يَتْلُوَ الْقُرْآنَ كُلَّ يَوْمٍ وَيَسْتَمِعَ إِلَيْهِ وَيَحْفَظَهُ؛ لِأَنَّهُ كَلَامُ اللَّهِ وَفِيهِ الأَجْرُ وَالْحَسَنَاتُ.',note:'في الكتاب بنت تدعو: «اللَّهُمَّ اجْعَلِ الْقُرْآنَ الْعَظِيمَ رَبِيعَ قَلْبِي». ردّد الدعاء مع الطلاب بعد كتابة النصيحة.'},
{stage:'assess',type:'tf',title:'صَحٌّ أَمْ خَطَأٌ؟',items:[{t:'الْقُرْآنُ الْكَرِيمُ كَلَامُ اللَّهِ تَعَالَى.',a:true},{t:'أَقْرَأُ الْقُرْآنَ فِي رَمَضَانَ فَقَطْ.',a:false,why:'أَتْلُو الْقُرْآنَ كُلَّ يَوْمٍ وَلَا أَهْجُرُهُ.'},{t:'لِي بِكُلِّ حَرْفٍ أَقْرَؤُهُ مِنَ الْقُرْآنِ حَسَنَةٌ.',a:true},{t:'إِذَا قُرِئَ الْقُرْآنُ أَتَحَدَّثُ مَعَ أَصْدِقَائِي.',a:false,why:'أَسْتَمِعُ لَهُ وَأُنْصِتُ لَعَلِّي أُرْحَمُ.'}]},
{stage:'game',type:'treasure',title:'اللُّعْبَةُ الْخِتَامِيَّةُ: كَنْزُ الْقُرْآنِ',text:'رِحْلَةُ الْكَنْزِ: أَجِبْ عِنْدَ كُلِّ مَحَطَّةٍ لِتَصِلَ إِلَى الْكَنْزِ!',qs:[{q:'اذْكُرْ مَظْهَرًا مِنْ مَظَاهِرِ حُبِّ الْقُرْآنِ الْكَرِيمِ.',ans:'أَتْلُوهُ – أَحْفَظُهُ – أَسْتَمِعُ لَهُ – أَتَدَبَّرُ مَعَانِيَهُ.'},{q:'الْقُرْآنُ الْكَرِيمُ هُوَ:',o:['كَلَامُ اللَّهِ تَعَالَى','قِصَّةٌ لِلْأَطْفَالِ','كِتَابُ الْعُلُومِ'],a:0},{q:'أَكْمِلِ الآيَةَ: ﴿وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ ___﴾',ans:'وَأَنصِتُوا لَعَلَّكُمْ تُرْحَمُونَ'},{q:'«أَتَدَبَّرُ مَعَانِيَهُ» يَعْنِي:',o:['أَفْهَمُ مَعَانِيَ الآيَاتِ وَأَعْمَلُ بِهَا','أَقْرَأُ بِسُرْعَةٍ','أَضَعُ الْمُصْحَفَ جَانِبًا'],a:0},{q:'اذْكُرْ سَبَبَيْنِ لِحُبِّكَ الْقُرْآنَ الْكَرِيمَ.',ans:'لِأَنَّهُ كَلَامُ اللَّهِ، وَنُورٌ وَهِدَايَةٌ وَشِفَاءٌ وَبَرَكَةٌ وَحَسَنَاتٌ.'},{q:'أَكْمِلِ النَّشِيدَ: أَوْ سَأَلْتُمْ عَنْ كِتَابِي ... فَهُوَ ___',ans:'قُرْآنٌ كَرِيمْ'}],prize:'أُحِبُّ الْقُرْآنَ الْكَرِيمَ فَأَتْلُوهُ وَلَا أَهْجُرُهُ 📖💚',note:'الفرق تتقدم على الخريطة بالإجابة الصحيحة. السؤال الأخير يمهّد للنشيد.'},

goals:['أَحْفَظَ دُعَاءَ الاسْتِفْتَاحِ فِي الصَّلاةِ.','أَنْطِقَ كَلِمَاتِ الدُّعَاءِ نُطْقًا صَحِيحًا.','أَفْهَمَ مَعَانِيَ بَعْضِ كَلِمَاتِ دُعَاءِ الاسْتِفْتَاحِ.','أُحَدِّدَ مَوْضِعَ دُعَاءِ الاسْتِفْتَاحِ وَهَيْئَتَهُ فِي الصَّلاةِ.'],

{stage:'warm',type:'dice',title:'لُعْبَةُ التَّهْيِئَةِ: نَرْدُ الصَّلاةِ',text:'ارْمِ حَجَرَ النَّرْدِ وَأَجِبْ عَنْ سُؤَالٍ عَنِ الصَّلاةِ!',qs:[{q:'كَمْ صَلاةً فَرَضَهَا اللَّهُ عَلَيْنَا فِي الْيَوْمِ وَاللَّيْلَةِ؟',o:['ثَلَاثَ صَلَوَاتٍ','خَمْسَ صَلَوَاتٍ','عَشْرَ صَلَوَاتٍ'],a:1},{q:'مَاذَا نَفْعَلُ قَبْلَ الصَّلاةِ لِنَكُونَ طَاهِرِينَ؟',ans:'نَتَوَضَّأُ.'},{q:'إِلَى أَيِّ جِهَةٍ نَتَّجِهُ فِي الصَّلاةِ؟',o:['الْقِبْلَةِ (الْكَعْبَةِ)','النَّافِذَةِ','أَيِّ جِهَةٍ'],a:0},{q:'مَا السُّورَةُ الَّتِي نَقْرَؤُهَا فِي كُلِّ رَكْعَةٍ؟',ans:'سُورَةُ الْفَاتِحَةِ.'},{q:'مَاذَا نَقُولُ فِي السُّجُودِ؟',o:['سُبْحَانَ رَبِّيَ الأَعْلَى','صَبَاحَ الْخَيْرِ','اللَّهُ أَكْبَرُ فَقَطْ'],a:0},{q:'سَمِّ صَلاةً مِنَ الصَّلَوَاتِ الْخَمْسِ.',ans:'الْفَجْرُ – الظُّهْرُ – الْعَصْرُ – الْمَغْرِبُ – الْعِشَاءُ.'}],note:'كل فريق يرمي النرد ويجيب. الهدف تذكير الطلاب بالصلاة تمهيدًا لدعاء الاستفتاح.'},
{stage:'warm',type:'scene',title:'سُؤَالُ التَّهْيِئَةِ',art:'🕌<br>🧕🏻👦🏻',bg:'mosque',q:['بِمَاذَا نَبْدَأُ صَلاتَنَا؟','هَلْ تَعْرِفُ دُعَاءً نَقُولُهُ فِي بِدَايَةِ الصَّلاةِ؟'],ans:'نَسْتَفْتِحُ الصَّلاةَ بِدُعَاءٍ عَظِيمٍ اسْمُهُ: دُعَاءُ الاسْتِفْتَاحِ (التَّوْجِيهُ). ← دَرْسُنَا الْيَوْمَ'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأَتَعَلَّمُ',p:37,art:'🧕🏽🧕🏻👦🏻<br>🕌',bg:'home',chars:{'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'},'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'}},lines:[{nar:'الأُمُّ تَحْتَضِنُ مَرْيَمَ وَأَحْمَدَ فِي غُرْفَةِ الْمَعِيشَةِ.'},{who:'الأُمُّ',t:'تَعَالَا أُعَلِّمْكُمَا الصَّلاةَ فَقَدْ أَصْبَحْتُمَا كَبِيرَيْنِ.'},{who:'مَرْيَمُ',t:'حَسَنًا يَا أُمِّي، إِنَّنِي مُتَشَوِّقَةٌ جِدًّا لِأَتَعَلَّمَ الصَّلاةَ.'},{nar:'وَقَفَتْ مَرْيَمُ وَأَحْمَدُ عَلَى سَجَّادَتَيِ الصَّلاةِ، وَالأُمُّ تَشْرَحُ.'},{who:'الأُمُّ',t:'سَأَبْدَأُ الْيَوْمَ بِتَعْلِيمِكُمَا دُعَاءَ الاسْتِفْتَاحِ فَقَطْ، وَهُوَ دُعَاءٌ عَظِيمٌ تُسْتَفْتَحُ بِهِ الصَّلاةُ.'}],note:'اقرأ الحوار، ثم اسأل: «ماذا ستعلّم الأم مريم وأحمد؟ ولماذا سُمّي دعاء الاستفتاح؟» (لأن الصلاة تُستفتح به).'},
{stage:'present',type:'hadith',title:'دُعَاءُ الاسْتِفْتَاحِ (التَّوْجِيهُ)',p:38,intro:'دُعَاءُ الاسْتِفْتَاحِ:',text:'سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، تَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ إِنِّي وَجَّهْتُ وَجْهِي لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ.',art:'🤲',note:'اقرأ الدعاء قراءة نموذجية بخشوع، ثم يردده الطلاب مقطعًا مقطعًا، ثم استخدم أداة الحفظ لإخفاء الكلمات تدريجيًا.'},
{stage:'practice',type:'perform',title:'أُرَدِّدُ الْكَلِمَاتِ',p:38,i:'🗣️',text:'أُرَدِّدُ الْكَلِمَاتِ الآتِيَةَ حَتَّى أُتْقِنَ نُطْقَهَا: جَدُّكَ – وَجْهِي – غَيْرُكَ',secs:60,note:'هذه الكلمات ملوّنة بالوردي في الكتاب ص ٣٨. ركّز على تشديد الدال في «جَدُّكَ» والهاء في «وَجْهِي» والغين في «غَيْرُكَ».'},
{stage:'present',type:'cards',title:'أَفْهَمُ مَعْنَى دُعَاءِ الاسْتِفْتَاحِ',p:38,text:'اضْغَطْ عَلَى الْبِطَاقَةِ لِتَعْرِفَ الْمَعْنَى:',cols:4,items:[{i:'🌟',t:'سُبْحَانَكَ',d:'أُنَزِّهُكَ يَا رَبِّ عَنْ كُلِّ نَقْصٍ'},{i:'💚',t:'تَبَارَكَ اسْمُكَ',d:'كَثُرَتْ بَرَكَةُ اسْمِكَ'},{i:'⬆️',t:'تَعَالَى جَدُّكَ',d:'ارْتَفَعَتْ عَظَمَتُكَ.'},{i:'☝️',t:'لَا إِلَهَ غَيْرُكَ',d:'لَا مَعْبُودَ بِحَقٍّ سِوَاكَ'},{i:'🧭',t:'وَجَّهْتُ وَجْهِي',d:'أَقْبَلْتُ بِقَلْبِي وَعِبَادَتِي إِلَى اللَّهِ'},{i:'🌍',t:'فَطَرَ',d:'خَلَقَ.'},{i:'➡️',t:'حَنِيفًا',d:'مَائِلًا عَنِ الْبَاطِلِ إِلَى الْحَقِّ.'},{i:'🚫',t:'الْمُشْرِكِينَ',d:'الَّذِينَ يَعْبُدُونَ مَعَ اللَّهِ غَيْرَهُ'}],note:'معاني الكتاب ص ٣٨: «تعالى جدك، فطر، حنيفًا». بقية البطاقات إثراء لفهم الدعاء.'},
{stage:'practice',type:'match',title:'أَصِلُ الْكَلِمَةَ بِمَعْنَاهَا',pairs:[['حَنِيفًا','مَائِلًا عَنِ الْبَاطِلِ إِلَى الْحَقِّ'],['تَعَالَى جَدُّكَ','ارْتَفَعَتْ عَظَمَتُكَ'],['فَطَرَ','خَلَقَ'],['سُبْحَانَكَ','أُنَزِّهُكَ عَنْ كُلِّ نَقْصٍ']],note:'تدريب سريع: يتناوب طلاب الفرق على التوصيل.'},
{stage:'present',type:'explain',title:'مَتَى أَقُولُ دُعَاءَ الاسْتِفْتَاحِ؟',text:'دُعَاءُ الاسْتِفْتَاحِ دُعَاءٌ عَظِيمٌ تُسْتَفْتَحُ بِهِ الصَّلاةُ:',points:[{i:'🕌',t:'أَقْرَؤُهُ فِي بِدَايَةِ الصَّلاةِ.'},{i:'🧍',t:'وَأَنَا وَاقِفٌ (الْقِيَامُ) مُتَّجِهٌ إِلَى الْقِبْلَةِ.'},{i:'🤍',t:'أَقْرَؤُهُ بِخُشُوعٍ وَهُدُوءٍ، وَأَسْتَحْضِرُ مَعَانِيَهُ.'}],box:'أَسْتَفْتِحُ صَلاتِي بِدُعَاءِ الاسْتِفْتَاحِ.',art:'🧍<br>🕋',bg:'mosque',artW:300,note:'مثّل أمام الطلاب وضعية القيام ثم اقرأ الدعاء، واطلب منهم تقليدك.'},
{stage:'practice',type:'scene',title:'أَتَعَاوَنُ مَعَ زُمَلَائِي',p:39,art:'📖🔍<br>⭐🌙☀️',bg:'night',size:100,q:['نَفْتَحُ الْمُصْحَفَ الشَّرِيفَ وَنَبْحَثُ فِي الآيَاتِ (٧٤ – ٧٩) مِنْ سُورَةِ الأَنْعَامِ.','عَلَى لِسَانِ أَيِّ نَبِيٍّ وَرَدَتِ الآيَةُ الْكَرِيمَةُ: ﴿إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا ۖ وَمَا أَنَا مِنَ الْمُشْرِكِينَ﴾ (الأنعام: ٧٩)'],ans:'عَلَى لِسَانِ سَيِّدِنَا إِبْرَاهِيمَ عَلَيْهِ السَّلامُ.',note:'وزّع مصاحف على المجموعات لتبحث في الآيات (٧٤–٧٩) من سورة الأنعام، ثم أظهر الإجابة. لاحظ أن جزءًا من الدعاء آية من القرآن.'},
{stage:'practice',type:'fill',title:'أَتَعَلَّمُ وَأُطَبِّقُ',p:39,items:[{t:'سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، ___ اسْمُكَ،',a:'تَبَارَكَ',o:['تَبَارَكَ','فَطَرَ','أَنَا']},{t:'وَتَعَالَى جَدُّكَ، وَلَا ___ غَيْرُكَ',a:'إِلَهَ',o:['أَنَا','إِلَهَ','تَبَارَكَ']},{t:'إِنِّي وَجَّهْتُ وَجْهِي لِلَّذِي ___ السَّمَاوَاتِ وَالأَرْضَ حَنِيفًا',a:'فَطَرَ',o:['إِلَهَ','فَطَرَ','تَبَارَكَ']},{t:'وَمَا ___ مِنَ الْمُشْرِكِينَ.',a:'أَنَا',o:['فَطَرَ','إِلَهَ','أَنَا']}],note:'أساعد مريم في تذكّر كلمات دعاء الاستفتاح (ص ٣٩). الإجابات: تبارك – إله – فطر – أنا.'},
{stage:'assess',type:'mcq',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:40,qs:[{q:'أَقْرَأُ دُعَاءَ الاسْتِفْتَاحِ فِي:',o:['بِدَايَةِ الصَّلاةِ','وَسَطِ الصَّلاةِ','نِهَايَةِ الصَّلاةِ'],a:0,i:'🕌'},{q:'الْهَيْئَةُ الصَّحِيحَةُ الَّتِي أَكُونُ عَلَيْهَا عِنْدَ قِرَاءَةِ دُعَاءِ الاسْتِفْتَاحِ فِي الصَّلاةِ:',o:['جَالِسٌ (جِلْسَةُ التَّشَهُّدِ)','وَاقِفٌ (الْقِيَامُ)','سَاجِدٌ'],a:1,i:'🧍'},{q:'مَعْنَى «فَطَرَ» فِي الدُّعَاءِ:',o:['خَلَقَ','أَفْطَرَ','كَسَرَ'],a:0,i:'🌍'},{q:'مَعْنَى «حَنِيفًا»:',o:['مَائِلًا عَنِ الْبَاطِلِ إِلَى الْحَقِّ','غَاضِبًا','مُسْرِعًا'],a:0,i:'➡️'}],note:'السؤالان الأول والثاني من الكتاب ص ٤٠ (في الكتاب صور ظلية: جالس – واقف – ساجد).'},
{stage:'assess',type:'fill',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الثَّانِي',p:41,items:[{t:'سُبْحَانَكَ اللَّهُمَّ ___ ، تَبَارَكَ اسْمُكَ،',a:'وَبِحَمْدِكَ',o:['وَبِحَمْدِكَ','جَدُّكَ','وَجْهِي','الأَرْضَ']},{t:'وَتَعَالَى ___ ، وَلَا إِلَهَ غَيْرُكَ،',a:'جَدُّكَ',o:['وَجْهِي','جَدُّكَ','وَبِحَمْدِكَ','الأَرْضَ']},{t:'إِنِّي وَجَّهْتُ ___ لِلَّذِي فَطَرَ السَّمَاوَاتِ',a:'وَجْهِي',o:['الأَرْضَ','جَدُّكَ','وَجْهِي','وَبِحَمْدِكَ']},{t:'فَطَرَ السَّمَاوَاتِ وَ___ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ.',a:'الأَرْضَ',o:['جَدُّكَ','الأَرْضَ','وَجْهِي','وَبِحَمْدِكَ']}],note:'نشاط الكتاب ص ٤١. بعد الإكمال يقرأ الطلاب الدعاء كاملًا غيبًا.'},
{stage:'assess',type:'perform',title:'أَدْعُو كَمَا دَعَا الأَبُ',p:41,i:'🤲',text:'أَتْلُو دُعَاءَ الأَبِ فِي الرَّسْمَةِ: ﴿رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ﴾ (إبراهيم: ٤٠)',secs:45,note:'هذه الآية في رسمة الأب ص ٤١. بيّن أنها دعاء سيدنا إبراهيم عليه السلام أيضًا، ثم يرددها الطلاب.'},
{stage:'assess',type:'tf',title:'صَحٌّ أَمْ خَطَأٌ؟',items:[{t:'دُعَاءُ الاسْتِفْتَاحِ يُسَمَّى أَيْضًا: التَّوْجِيهَ.',a:true},{t:'أَقْرَأُ دُعَاءَ الاسْتِفْتَاحِ وَأَنَا سَاجِدٌ.',a:false,why:'أَقْرَؤُهُ وَأَنَا وَاقِفٌ فِي بِدَايَةِ الصَّلاةِ.'},{t:'مَعْنَى «تَعَالَى جَدُّكَ»: ارْتَفَعَتْ عَظَمَتُكَ.',a:true},{t:'﴿إِنِّي وَجَّهْتُ وَجْهِيَ﴾ قَالَهَا سَيِّدُنَا إِبْرَاهِيمُ عَلَيْهِ السَّلامُ.',a:true}]},

{stage:'present',type:'scene',title:'أَتَأَمَّلُ وَأَسْتَنْتِجُ',p:58,art:'📜<br>🧕🏻👦🏻👦🏾👦🏻',bg:'garden',size:110,q:['مَاذَا كُتِبَ عَلَى اللَّافِتَةِ الَّتِي يَحْمِلُهَا الأَطْفَالُ؟','كَيْفَ خَلَقَ اللَّهُ تَعَالَى الإِنْسَانَ؟'],ans:'﴿لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ﴾: خَلَقَنَا اللَّهُ فِي أَحْسَنِ صُورَةٍ وَهَيْئَةٍ.',note:'وجّه الطلاب إلى تأمل أجسامهم: يدان، عينان، يمشي الإنسان مستقيمًا… كلها من حُسن خلق الله.'},
{stage:'practice',type:'fill',title:'أَسْتَنْتِجُ',p:58,items:[{t:'خَلَقَ اللَّهُ تَعَالَى النَّاسَ فِي أَحْسَنِ صُورَةٍ تَسْتَوْجِبُ مِنْهُمُ ___ .',a:'الشُّكْرَ',o:['الشُّكْرَ','الغُرُورَ','الكَسَلَ']},{t:'أَشْكُرُ اللَّهَ تَعَالَى الَّذِي خَلَقَنِي فِي أَحْسَنِ ___ .',a:'تَقْوِيمٍ',o:['تَقْوِيمٍ','مَكَانٍ','طَعَامٍ']}],note:'العبارة الأولى نشاط الكتاب ص ٥٨ (الإجابة: الشكر). اسأل: كيف نشكر الله؟ بالحمد والطاعة.'},
{stage:'present',type:'explain',title:'مَاذَا تُعَلِّمُنَا السُّورَةُ؟',text:'نَفْهَمُ سُورَةَ التِّينِ:',points:[{i:'🫒',t:'أَقْسَمَ اللَّهُ بِالتِّينِ وَالزَّيْتُونِ، وَطُورِ سِينِينَ، وَمَكَّةَ المُكَرَّمَةِ.'},{i:'✨',t:'خَلَقَ اللَّهُ الإِنْسَانَ فِي أَحْسَنِ صُورَةٍ وَهَيْئَةٍ.'},{i:'⬇️',t:'مَنْ كَفَرَ وَعَصَى رَبَّهُ يَكُونُ مَصِيرُهُ أَسْفَلَ مَكَانٍ.'},{i:'🌳',t:'المُؤْمِنُونَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ لَهُمْ أَجْرٌ دَائِمٌ.'},{i:'⚖️',t:'اللَّهُ أَحْكَمُ الحَاكِمِينَ؛ يَحْكُمُ بِالعَدْلِ يَوْمَ القِيَامَةِ.'}],art:'🫒⛰️🕋',bg:'desert',artW:300,note:'اشرح كل فكرة مع تلاوة الآية التي تدل عليها، واطلب من الطلاب الإشارة إليها في المصحف.'},
{stage:'practice',type:'check',title:'أَتَدَبَّرُ وَأَتَعَلَّمُ',p:59,text:'أُلَوِّنُ الشَّكْلَ الَّذِي يُوَضِّحُ سَبَبَ دُخُولِ الْمُؤْمِنِ الْجَنَّةَ كَمَا وَرَدَ فِي الْآيَةِ: ﴿إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ﴾',items:[{t:'عَمَلُهُ الصَّالِحُ',i:'🌿',ok:true},{t:'شَكْلُهُ الجَمِيلُ',i:'🍂',ok:false}],note:'نشاط الكتاب ص ٥٩: الإجابة «عمله الصالح». أكّد أن الله لا ينظر إلى أشكالنا بل إلى قلوبنا وأعمالنا.'},
{stage:'present',type:'explain',title:'تَعَلَّمْتُ مِنْ سُورَةِ التِّينِ أَنْ',p:59,text:'تَعَلَّمْتُ مِنْ سُورَةِ التِّينِ أَنْ:',points:[{i:'⚖️',t:'أُوقِنَ بِعَدْلِ اللَّهِ تَعَالَى بَيْنَ عِبَادِهِ.'},{i:'🌳',t:'أَلْتَزِمَ بِعَمَلِ الْأَعْمَالِ الصَّالِحَةِ لِأَنَالَ الْأَجْرَ الدَّائِمَ مِنَ اللَّهِ تَعَالَى.'},{i:'🤲',t:'أَشْكُرَ اللَّهَ تَعَالَى الَّذِي خَلَقَنِي فِي أَحْسَنِ تَقْوِيمٍ.'}],art:'📖',bg:'soft',artW:220,note:'اطلب من ثلاثة طلاب قراءة الدروس الثلاثة، ثم اسأل: ما عمل صالح ستفعله اليوم؟'},
{stage:'practice',type:'order',title:'أَحْفَظُ: أُرَتِّبُ الآيَاتِ',text:'بَعْدَ ﴿وَالتِّينِ وَالزَّيْتُونِ﴾ أُرَتِّبُ بَقِيَّةَ الآيَاتِ كَمَا فِي السُّورَةِ:',items:['وَطُورِ سِينِينَ','وَهَٰذَا الْبَلَدِ الْأَمِينِ','لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ','ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ','إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ','فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ','أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ'],note:'يتناوب الطلاب على اختيار الآية التالية وهم يتلونها. بعد الترتيب ارجع إلى شريحة السورة واستخدم أداة «تحدي الحفظ».'},
{stage:'practice',type:'perform',title:'أَتْلُو سُورَةَ التِّينِ',i:'📖',text:'أَتْلُو سُورَةَ التِّينِ غَيْبًا تِلَاوَةً صَحِيحَةً.',secs:60,note:'يتلو طالب أو طالبان السورة، ويقيّم الزملاء التلاوة بالنجوم (النطق الصحيح للكلمات التي تدربنا عليها).'},
{stage:'assess',type:'mcq',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:60,qs:[{q:'أَسْتَخْرِجُ مِنْ سُورَةِ التِّينِ مَا يُشِيرُ لِمَعْنَى قَوْلِهِ تَعَالَى: ﴿الَّذِي خَلَقَكَ فَسَوَّاكَ فَعَدَلَكَ﴾ (الانفطار: ٧)',o:['﴿لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ﴾','﴿وَطُورِ سِينِينَ﴾','﴿فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ﴾'],a:0,i:'✨'},{q:'أَسْتَخْرِجُ مِنْ سُورَةِ التِّينِ مَا يُشِيرُ لِمَعْنَى قَوْلِهِ تَعَالَى: ﴿رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا﴾ (إبراهيم: ٣٥)',o:['﴿وَالتِّينِ وَالزَّيْتُونِ﴾','﴿وَهَٰذَا الْبَلَدِ الْأَمِينِ﴾','﴿ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ﴾'],a:1,i:'🕋'},{q:'تَرْتِيبُ سُورَةِ التِّينِ فِي المُصْحَفِ الشَّرِيفِ:',o:['٨','٣٠','٩٥'],a:2,i:'📖',ex:'تَرْتِيبُهَا (٩٥) وَعَدَدُ آيَاتِهَا (٨) وَهِيَ فِي الجُزْءِ الثَّلَاثِينَ.'}],note:'السؤالان الأول والثاني من الكتاب ص ٦٠؛ بعد الإجابة يكتب الطلاب الآية في الكتاب.'},
{stage:'assess',type:'tf',title:'النَّشَاطُ الثَّانِي: أُلَوِّنُ بِالأَخْضَرِ أَوِ الأَحْمَرِ',p:60,items:[{t:'يَوْمُ الدِّينِ يَعْنِي يَوْمَ الْقِيَامَةِ.',a:true},{t:'غَيْرُ مَمْنُونٍ تَعْنِي ثَوَابًا دَائِمًا.',a:true},{t:'الْبَلَدُ الْأَمِينُ هِيَ الْمَدِينَةُ الْمُنَوَّرَةُ.',a:false,why:'الْبَلَدُ الأَمِينُ هِيَ مَكَّةُ المُكَرَّمَةُ.'},{t:'نَالَ المُؤْمِنُ الجَنَّةَ بِشَكْلِهِ الجَمِيلِ.',a:false,why:'يَنَالُ المُؤْمِنُ الجَنَّةَ بِإِيمَانِهِ وَعَمَلِهِ الصَّالِحِ.'}],note:'العبارات الثلاث الأولى من الكتاب ص ٦٠: الصحيحة تُلوَّن بالأخضر والخاطئة بالأحمر.'},
{stage:'assess',type:'check',title:'النَّشَاطُ الثَّالِثُ: الطَّعَامُ الأَفْضَلُ لِصِحَّتِي',p:61,text:'أَخْتَارُ التَّصَرُّفَ الصَّحِيحَ: الطَّعَامُ الْأَفْضَلُ لِلْحِفَاظِ عَلَى صِحَّتِي',items:[{t:'طَبَقُ وَجَبَاتٍ سَرِيعَةٍ',i:'🍔🍟🍕',ok:false},{t:'طَبَقُ حَلْوَيَاتٍ',i:'🍩🍪🎂',ok:false},{t:'طَبَقُ تِينٍ وَزَيْتُونٍ',i:'🫒🍇',ok:true}],note:'نشاط الكتاب ص ٦١. اربطه بالسورة: أقسم الله بالتين والزيتون لعظيم نفعهما.'},
{stage:'game',type:'puzzle',title:'اللعبة الختامية: اللُّغْزُ المَخْفِيُّ',text:'أجب عن الأسئلة لتكشف الصورة المخفية 🧩',hidden:{e:'🕋',t:'الْبَلَدُ الْأَمِينُ',say:'مَكَّةُ المُكَرَّمَةُ: البَلَدُ الأَمِينُ الَّذِي أَقْسَمَ اللَّهُ تَعَالَى بِهِ فِي سُورَةِ التِّينِ.'},qs:[{q:'كَمْ عَدَدُ آيَاتِ سُورَةِ التِّينِ؟',o:['٨','٥','١٢'],a:0},{q:'مَا مَعْنَى «البَلَدِ الأَمِينِ»؟',o:['مَكَّةُ المُكَرَّمَةُ','المَدِينَةُ المُنَوَّرَةُ','مَسْقَطُ'],a:0},{q:'أَيْنَ يَقَعُ جَبَلُ الطُّورِ ﴿وَطُورِ سِينِينَ﴾؟',o:['فِي سَيْنَاءَ','فِي مَكَّةَ','فِي عُمَانَ'],a:0},{q:'أَكْمِلْ: ﴿لَقَدْ خَلَقْنَا الْإِنسَانَ فِي ___﴾',ans:'أَحْسَنِ تَقْوِيمٍ'},{q:'مَا مَعْنَى ﴿غَيْرُ مَمْنُونٍ﴾؟',o:['ثَوَابٌ دَائِمٌ','ثَوَابٌ قَلِيلٌ','عِقَابٌ'],a:0},{q:'مَنِ الَّذِينَ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ؟',ans:'الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ.'},{q:'اتْلُ الآيَةَ الأَخِيرَةَ مِنْ سُورَةِ التِّينِ.',ans:'أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ'},{q:'مَا مَعْنَى «يَوْمِ الدِّينِ»؟',o:['يَوْمُ القِيَامَةِ','يَوْمُ الجُمُعَةِ','يَوْمُ العِيدِ'],a:0},{q:'كَيْفَ أَشْكُرُ اللَّهَ الَّذِي خَلَقَنِي فِي أَحْسَنِ تَقْوِيمٍ؟',ans:'أَحْمَدُهُ بِلِسَانِي، وَأُطِيعُهُ، وَأَعْمَلُ الصَّالِحَاتِ.'}],note:'كل فريق يختار مربعًا ويجيب؛ الإجابة الصحيحة تكشف جزءًا من الصورة. في الأسئلة المفتوحة أظهر الإجابة واحكم.'},
{stage:'close',type:'summary',title:'أُنَظِّمُ مَعَارِفِي',p:91,center:'سُورَةُ التِّينِ',nodes:[{i:'📖',t:'سُورَةُ التِّينِ',d:'تَرْتِيبُهَا ٩٥ وَآيَاتُهَا ٨'},{i:'🫒',t:'أَقْسَمَ اللَّهُ',d:'بِالتِّينِ وَالزَّيْتُونِ وَالطُّورِ وَمَكَّةَ'},{i:'✨',t:'أَحْسَنُ تَقْوِيمٍ',d:'أَحْمَدُ اللَّهَ الَّذِي خَلَقَنِي فِي أَحْسَنِ تَقْوِيمٍ'},{i:'🌳',t:'العَمَلُ الصَّالِحُ',d:'لِأَنَالَ الأَجْرَ الدَّائِمَ مِنَ اللَّهِ'},{i:'⚖️',t:'أَحْكَمُ الحَاكِمِينَ',d:'أُوقِنُ بِعَدْلِ اللَّهِ بَيْنَ عِبَادِهِ'}],note:'من «أنظم معارفي» ص ٩١: أحمد الله الذي خلقني في أحسن تقويم، وأحرص على العمل الصالح لأنال الأجر الدائم.'},

]});

goals:['أُوَضِّحَ مَفْهُومَ طَاعَةِ اللَّهِ تَعَالَى بِصُورَةٍ مُبَسَّطَةٍ.','أُمَيِّزَ بَيْنَ أَوَامِرِ اللَّهِ تَعَالَى وَنَوَاهِيهِ.','أَذْكُرَ ثَمَرَاتِ طَاعَةِ اللَّهِ تَعَالَى.','أُنْشِدَ نَشِيدَ «أُطِيعُ اللَّهَ» إِنْشَادًا صَحِيحًا.'],
slides:[
{stage:'warm',type:'wheel',title:'لعبة التهيئة: عَجَلَةُ الطَّاعَةِ',text:'أدِر العجلة وأجب عن السؤال 🎡',qs:[{q:'مَنْ أَمَرَنَا بِالصَّلَاةِ؟',o:['اللَّهُ تَعَالَى','الصَّدِيقُ','الجَارُ'],a:0},{q:'نَادَتْكَ أُمُّكَ وَأَنْتَ تَلْعَبُ. مَاذَا تَفْعَلُ؟',ans:'أُجِيبُهَا فَوْرًا وَأُطِيعُهَا.'},{q:'كَمْ صَلَاةً فَرَضَهَا اللَّهُ عَلَيْنَا فِي اليَوْمِ؟',o:['خَمْسَ صَلَوَاتٍ','ثَلَاثَ صَلَوَاتٍ','عَشْرَ صَلَوَاتٍ'],a:0},{q:'اذْكُرْ عَمَلًا أَمَرَنَا اللَّهُ تَعَالَى بِهِ.',ans:'الصَّلَاةُ، الصِّدْقُ، بِرُّ الوَالِدَيْنِ، الصَّدَقَةُ…'},{q:'اذْكُرْ عَمَلًا نَهَانَا اللَّهُ تَعَالَى عَنْهُ.',ans:'الكَذِبُ، السُّخْرِيَةُ مِنَ النَّاسِ، الإِسْرَافُ…'},{q:'أَيُّهُمَا يُحِبُّهُ اللَّهُ تَعَالَى؟',o:['الصِّدْقُ','الكَذِبُ'],a:0},{q:'أَعْطَيْتُ صَدِيقِي مِنْ طَعَامِي. هَذَا عَمَلٌ:',o:['يُحِبُّهُ اللَّهُ','يُغْضِبُ اللَّهَ'],a:0}],note:'تدير كل مجموعة العجلة وتجيب. بعد اللعبة اسأل: «لماذا نفعل ما أمر الله به ونترك ما نهى عنه؟».'},
{stage:'warm',type:'scene',title:'سؤال التهيئة',art:'🕌🤲<br>📖💚',bg:'sky',q:['إِذَا أَمَرَنَا اللَّهُ تَعَالَى بِشَيْءٍ فَمَاذَا نَفْعَلُ؟','وَإِذَا نَهَانَا عَنْ شَيْءٍ فَمَاذَا نَفْعَلُ؟'],ans:'نَفْعَلُ مَا أَمَرَنَا بِهِ، وَنَتْرُكُ مَا نَهَانَا عَنْهُ؛ وَهَذِهِ هِيَ الطَّاعَةُ. ← دَرْسُنَا: «أُطِيعُ اللَّهَ تَعَالَى»',note:'استمع لإجابات الطلاب ثم اضغط «التالي» لإظهار الإجابة وربطها بعنوان الدرس.'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأَفْهَمُ (١)',p:62,art:'🛒🧸<br>🏪',bg:'soft',chars:{'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'},'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'}},lines:[{nar:'فِي المَتْجَرِ، تَحْمِلُ مَرْيَمُ عُلْبَةَ دُمْيَةٍ، وَأُمُّهَا تَدْفَعُ عَرَبَةَ المُشْتَرَيَاتِ.'},{who:'مَرْيَمُ',t:'أُمِّي مِنْ فَضْلِكِ أُرِيدُ أَنْ أَشْتَرِيَ دُمْيَةً جَدِيدَةً.'},{who:'الأُمُّ',t:'دُمْيَةٌ جَدِيدَةٌ! هَذَا تَبْذِيرٌ يَا ابْنَتِي؛ بِالْأَمْسِ اشْتَرَيْتِ دُمْيَةً.'},{who:'مَرْيَمُ',t:'أَعْلَمُ، وَلَكِنَّ ابْنَةَ عَمَّتِي أَعْجَبَتْهَا دُمْيَتِي كَثِيرًا فَأَرَدْتُ أَنْ أُهْدِيَهَا مِثْلَهَا.'}],note:'اقرأ الحوار قراءة معبّرة، أو وزّع الأدوار على طالبتين. توقف واسأل: لماذا رأت الأم أن الشراء تبذير؟'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأَفْهَمُ (٢)',p:62,art:'🎁💚',bg:'soft',chars:{'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'},'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'}},lines:[{who:'الأُمُّ',t:'رَائِعٌ يَا مَرْيَمُ وَأَنَا فَخُورَةٌ بِكِ، فَعَطَاؤُكِ لِلْآخَرِينَ دَلِيلٌ عَلَى طَاعَتِكِ لِلَّهِ تَعَالَى.'},{who:'مَرْيَمُ',t:'طَاعَةُ اللَّهِ تَعَالَى!'},{who:'الأُمُّ',t:'نَعَمْ. فَبِعَطَائِكِ أَطَعْتِ اللَّهَ تَعَالَى الَّذِي أَمَرَنَا بِالْعَطَاءِ وَالْإِنْفَاقِ فِي وُجُوهِ الْخَيْرِ، وَنَهَانَا عَنِ الْإِسْرَافِ فِيمَا أَنْعَمَ بِهِ عَلَيْنَا.'},{who:'مَرْيَمُ',t:'الْحَمْدُ لِلَّهِ سَأَحْرِصُ عَلَى طَاعَةِ اللَّهِ تَعَالَى فِي كُلِّ أُمُورِي.'}],note:'أكمل الحوار، ثم أكّد: العطاء أمرٌ من الله، والإسراف نهى الله عنه.'},
{stage:'practice',type:'mcq',title:'أَفْهَمُ القِصَّةَ',qs:[{q:'لِمَاذَا أَرَادَتْ مَرْيَمُ شِرَاءَ دُمْيَةٍ جَدِيدَةٍ؟',o:['لِتُهْدِيَهَا لِابْنَةِ عَمَّتِهَا','لِأَنَّهَا مَلَّتْ دُمْيَتَهَا','لِتَلْعَبَ بِدُمْيَتَيْنِ'],a:0,i:'🎁'},{q:'بِمَاذَا أَمَرَنَا اللَّهُ تَعَالَى كَمَا قَالَتِ الأُمُّ؟',o:['بِشِرَاءِ كُلِّ مَا نُرِيدُ','بِالعَطَاءِ وَالإِنْفَاقِ فِي الخَيْرِ','بِالبُخْلِ عَلَى النَّاسِ'],a:1,i:'💚'},{q:'وَعَنْ أَيِّ شَيْءٍ نَهَانَا اللَّهُ تَعَالَى؟',o:['عَنِ العَطَاءِ','عَنِ الصَّدَقَةِ','عَنِ الإِسْرَافِ'],a:2,i:'⛔',ex:'الإِسْرَافُ: أَنْ نُنْفِقَ المَالَ أَوْ نَسْتَعْمِلَ النِّعَمَ أَكْثَرَ مِنْ حَاجَتِنَا.'}],note:'أسئلة فهم سريعة للحوار؛ اطلب من الطالب تعليل إجابته من القصة.'},
{stage:'present',type:'cards',title:'أَتَعَلَّمُ وَأُطَبِّقُ',p:63,text:'أُطِيعُ اللَّهَ تَعَالَى فَـ… (اضغط على كل صورة)',items:[{i:'👦🏻🤲',t:'وَلَدٌ عَلَى سَجَّادَةِ الصَّلَاةِ يَرْفَعُ يَدَيْهِ',d:'أُصَلِّي وَأَدْعُو اللَّهَ 🕌'},{i:'🧕🏽📄👧🏻',t:'الأُمُّ: «كَيْفَ نَتِيجَتُكِ؟» البِنْتُ: «لَيْسَتْ جَيِّدَةً يَا أُمِّي»',d:'أَقُولُ الصِّدْقَ وَلَا أَكْذِبُ 🗣️'},{i:'😆👉😢',t:'«لَا تَسْخَرْ مِنَ الْآخَرِينَ»',d:'لَا أَسْخَرُ مِنَ الآخَرِينَ 🤝'},{i:'👵🏽👧🏻',t:'بِنْتٌ صَغِيرَةٌ مَعَ جَدَّتِهَا',d:'أَبَرُّ وَالِدَيَّ وَأَحْتَرِمُ الكَبِيرَ وَأُسَاعِدُ جَدَّتِي 💐'}],cols:4,note:'نشاط الكتاب ص ٦٣: صِف كل صورة، واطلب من الطلاب إكمال العبارة قبل قلب البطاقة. الصورتان ١ و٤ إجابتهما مقترحة.'},
{stage:'practice',type:'fill',title:'أُكْمِلُ العِبَارَاتِ',p:63,items:[{t:'أُطِيعُ اللَّهَ تَعَالَى فَأَقُولُ الصِّدْقَ وَلَا ___ .',a:'أَكْذِبُ',o:['أَكْذِبُ','أُصَلِّي','أَتَعَلَّمُ']},{t:'أُطِيعُ اللَّهَ تَعَالَى فَلَا ___ مِنَ الْآخَرِينَ.',a:'أَسْخَرُ',o:['أَسْخَرُ','أَتَعَلَّمُ','أَطْلُبُ']},{t:'أُطِيعُ اللَّهَ تَعَالَى فَأَتَّبِعُ ___ .',a:'أَوَامِرَهُ',o:['أَوَامِرَهُ','نَوَاهِيَهُ','هَوَايَ']},{t:'أُطِيعُ اللَّهَ تَعَالَى وَأَجْتَنِبُ ___ .',a:'نَوَاهِيَهُ',o:['نَوَاهِيَهُ','أَوَامِرَهُ','صَلَاتِي']}],note:'العبارتان الأخيرتان هما خلاصة الكتاب ص ٦٣: «أطيع الله تعالى فأتبع أوامره وأجتنب نواهيه». يكتبها الطلاب في الكتاب.'},
{stage:'present',type:'compare',title:'مَا طَاعَةُ اللَّهِ تَعَالَى؟',cols:[{h:'أَوَامِرُ اللَّهِ: أَفْعَلُهَا',i:'✅',lines:['أُصَلِّي وَأَدْعُو اللَّهَ','أَقُولُ الصِّدْقَ','أَبَرُّ وَالِدَيَّ وَأَحْتَرِمُ الكَبِيرَ','أُعْطِي وَأُنْفِقُ فِي الخَيْرِ']},{h:'نَوَاهِي اللَّهِ: أَجْتَنِبُهَا',i:'⛔',lines:['الكَذِبُ','السُّخْرِيَةُ مِنَ الآخَرِينَ','عُقُوقُ الوَالِدَيْنِ','الإِسْرَافُ وَالتَّبْذِيرُ']}],box:'طَاعَةُ اللَّهِ تَعَالَى: أَنْ أَفْعَلَ مَا أَمَرَنِي بِهِ، وَأَتْرُكَ مَا نَهَانِي عَنْهُ.',reveal:true,note:'اعرض العمودين، واطلب من الطلاب إضافة أمثلة أخرى لكل عمود من حياتهم اليومية.'},
{stage:'practice',type:'classify',title:'أَمْرٌ أَمْ نَهْيٌ؟',text:'أَضَعُ كُلَّ عَمَلٍ فِي مَكَانِهِ:',bins:[{t:'أَمَرَنَا اللَّهُ بِهِ',i:'✅',c:'#22a559'},{t:'نَهَانَا اللَّهُ عَنْهُ',i:'⛔',c:'#e5484d'}],items:[{t:'الصَّلَاةُ',i:'🕌',b:0},{t:'الصِّدْقُ',i:'🗣️',b:0},{t:'الصَّدَقَةُ',i:'🎁',b:0},{t:'بِرُّ الوَالِدَيْنِ',i:'💐',b:0},{t:'الكَذِبُ',i:'🤥',b:1},{t:'السُّخْرِيَةُ',i:'😆',b:1},{t:'الإِسْرَافُ',i:'🗑️',b:1},{t:'قَطْعُ الرَّحِمِ',i:'💔',b:1}],note:'يختار الطالب البطاقة ثم يضغط على الصندوق المناسب، ويقول: «أطيع الله فأفعل…/فأترك…».'},
{stage:'present',type:'scene',title:'أُفَكِّرُ وَأُعَبِّرُ',p:64,art:'💬<br>🙅🏻‍♂️<br>❌🕌 ❌💰',bg:'night',size:80,q:['شَابٌّ يَقُولُ: «أَنَا أُحِبُّ اللَّهَ كَثِيرًا»، وَلَكِنَّهُ: لَا يُصَلِّي، يَكْذِبُ، لَا يُزَكِّي، قَاطِعٌ لِرَحِمِهِ.','مَاذَا تَقُولُ لِمَنْ يَدَّعِي بِلِسَانِهِ مَحَبَّتَهُ لِلَّهِ تَعَالَى وَلَكِنَّهُ يَعْصِيهِ بِأَفْعَالِهِ؟'],ans:'أَقُولُ لَهُ: مَحَبَّةُ اللَّهِ تَكُونُ بِطَاعَتِهِ، لَا بِالكَلَامِ فَقَطْ؛ فَصَلِّ، وَاصْدُقْ، وَزَكِّ، وَصِلْ رَحِمَكَ.',note:'نشاط الكتاب ص ٦٤ (إجابة مفتوحة). اقبل تعبيرات الطلاب المختلفة، وركّز على أن المحبة الصادقة تظهر في الأفعال.'},
{stage:'present',type:'explain',title:'مَاذَا أَنَالُ بِطَاعَةِ اللَّهِ؟',text:'إِذَا أَطَعْتُ اللَّهَ تَعَالَى نِلْتُ:',points:[{i:'💚',t:'رِضَا اللَّهِ تَعَالَى وَمَحَبَّتَهُ وَثَوَابَهُ.'},{i:'🤝',t:'مَحَبَّةَ النَّاسِ؛ فَالنَّاسُ يُحِبُّونَ الصَّادِقَ المُحْسِنَ.'},{i:'🌸',t:'الحَيَاةَ الطَّيِّبَةَ السَّعِيدَةَ.'},{i:'🏡',t:'الجَنَّةَ: «مَنْ يُطِعِ اللَّهَ فَإِنَّ لَهُ جَنَّاتٍ عُلْيَا وَخُلُودَا»'}],art:'🌳🏞️',bg:'garden',artW:280,note:'اربط كل ثمرة بمثال: مريم أطاعت الله فرضي عنها، وفرحت أمها بها، وفرحت ابنة عمتها.'},
{stage:'present',type:'nasheed',title:'أُنْشِدُ وَأَتَعَلَّمُ: «أُطِيعُ اللَّهَ» (١)',p:67,lines:[['أَحْيَا بِالْإِسْلَامِ سَعِيدَا','وَأُطِيعُ إِلَهِي الْمَعْبُودَا'],['مَنْ يُطِعِ اللَّهَ فَإِنَّ لَهُ','جَنَّاتٍ عُلْيَا وَخُلُودَا'],['حِينَ أُصَلِّي أَعْبُدُ رَبِّي','حِينَ أَبَرُّ بِأُمِّي وَأَبِي']],note:'أنشد الأبيات إنشادًا نموذجيًا، ثم يرددها الطلاب جماعيًا. اسأل: متى أعبد ربي؟ (حين أصلي، حين أبرّ والديّ).'},
{stage:'present',type:'nasheed',title:'أُنْشِدُ وَأَتَعَلَّمُ: «أُطِيعُ اللَّهَ» (٢)',p:67,by:'شِعْرُ: عَائِشَةَ بِنْتِ حُمَيْدٍ الْجَامِعِيَّةِ',lines:[['أَعْبُدُ رَبِّي وَأَنَا أَمْضِي','لِلْعِلْمِ فَأَقْرَأُ فِي الْكُتُبِ'],['أَعْبُدُ رَبِّي قَوْلًا فِعْلًا','فِيمَا وَصَّى فَهُوَ الْأَعْلَى'],['فَعِبَادَةُ رَبِّي طَاعَتُهُ','فَهُوَ نَصِيرِي نِعْمَ الْمَوْلَى']],note:'أكمل النشيد، ثم أنشده الطلاب كاملًا في مجموعات. البيت الأخير خلاصة الدرس: «فعبادة ربي طاعته».'},
{stage:'assess',type:'fill',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:65,items:[{t:'أَنَا أُطِيعُ اللَّهَ تَعَالَى لِأَنَالَ رِضَا ___ .',a:'اللَّهِ تَعَالَى',o:['اللَّهِ تَعَالَى','النَّاسِ','الطَّيِّبَةَ']},{t:'أَنَا أُطِيعُ اللَّهَ تَعَالَى لِأَنَالَ مَحَبَّةَ ___ .',a:'النَّاسِ',o:['اللَّهِ تَعَالَى','النَّاسِ','الطَّيِّبَةَ']},{t:'أَنَا أُطِيعُ اللَّهَ تَعَالَى لِأَنَالَ الْحَيَاةَ ___ .',a:'الطَّيِّبَةَ',o:['اللَّهِ تَعَالَى','النَّاسِ','الطَّيِّبَةَ']}],note:'بنك الكلمات في الكتاب: النّاس – الله تعالى – الطيبة.'},
{stage:'assess',type:'check',title:'النَّشَاطُ الثَّانِي: أَضَعُ خَطًّا تَحْتَ كَلِمَاتِ الطَّاعَةِ',p:65,text:'أَتَدَبَّرُ: ﴿فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ﴾ (النصر: ٣) • ﴿فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ﴾ (قريش: ٣) • ﴿فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ﴾ (الضحى: ٩) — أَخْتَارُ الكَلِمَاتِ الدَّالَّةَ عَلَى طَاعَةِ اللَّهِ تَعَالَى:',items:[{t:'فَسَبِّحْ',ok:true},{t:'وَاسْتَغْفِرْهُ',ok:true},{t:'الْبَيْتِ',ok:false},{t:'فَلْيَعْبُدُوا',ok:true},{t:'الْيَتِيمَ',ok:false},{t:'فَلَا تَقْهَرْ',ok:true}],note:'اتلُ الآيات أولًا، ثم يختار الطلاب الكلمات ويضعون تحتها خطًا في الكتاب. الإجابة: فسبّح، واستغفره، فليعبدوا، فلا تقهر.'},
{stage:'assess',type:'tf',title:'صَحٌّ أَمْ خَطَأٌ؟',items:[{t:'مَنْ يُحِبُّ اللَّهَ تَعَالَى يُطِيعُهُ بِأَفْعَالِهِ.',a:true},{t:'شِرَاءُ أَشْيَاءَ لَا نَحْتَاجُهَا مِنَ الإِسْرَافِ.',a:true},{t:'السُّخْرِيَةُ مِنَ الآخَرِينَ طَاعَةٌ لِلَّهِ.',a:false,why:'نَهَانَا اللَّهُ تَعَالَى عَنِ السُّخْرِيَةِ مِنَ الآخَرِينَ.'},{t:'طَاعَةُ اللَّهِ تَكُونُ فِي الصَّلَاةِ فَقَطْ.',a:false,why:'نُطِيعُ اللَّهَ فِي كُلِّ أُمُورِنَا: الصِّدْقِ وَالبِرِّ وَالعَطَاءِ…'}],note:'أسئلة تقويم إضافية. اطلب تصحيح العبارة الخاطئة شفويًا.'},
{stage:'assess',type:'write',title:'النَّشَاطُ الثَّالِثُ',p:66,i:'✍️',prompt:'أَكْتُبُ ثَلَاثَةَ أَعْمَالٍ أَقُومُ بِهَا طَاعَةً لِلَّهِ تَعَالَى.',model:'١- أُصَلِّي فِي وَقْتِهَا. ٢- أَبَرُّ وَالِدَيَّ. ٣- أَصْدُقُ فِي قَوْلِي.',note:'يكتب كل طالب ثلاثة أعمال في الكتاب، ثم يقرأ بعضهم ما كتبوا. تقبّل كل الأعمال الصحيحة (الصدقة، طلب العلم…).'},
{stage:'assess',type:'hadith',title:'أَدْعُو اللَّهَ تَعَالَى',p:66,intro:'أَدْعُو رَبِّي:',text:'«اللَّهُمَّ أَعِنَّا عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ».',art:'🧕🏻🤲',note:'دعاء ختام الدرس ص ٦٦. يردده الطلاب حتى يحفظوه، واستخدم أداة إخفاء الكلمات للتسميع.'},
{stage:'game',type:'balloons',title:'اللعبة الختامية: بَالُونَاتُ الطَّاعَةِ',text:'فرقِع البالونات التي فيها طاعة لله تعالى 🎈',good:['أُصَلِّي فِي وَقْتِهَا','أَقُولُ الصِّدْقَ','أَبَرُّ وَالِدَيَّ','أُعْطِي المُحْتَاجَ','أَحْتَرِمُ الكَبِيرَ','أَطْلُبُ العِلْمَ'],bad:['أَسْخَرُ مِنَ الآخَرِينَ','أَكْذِبُ عَلَى أُمِّي','أُسْرِفُ فِي الشِّرَاءِ'],note:'يتناوب الطلاب على الضغط على البالونات. البالون الخاطئ يهتز ولا يُفرقع — اسأل: لماذا ليس طاعة؟'},
{stage:'close',type:'summary',title:'أُنَظِّمُ مَعَارِفِي',p:91,center:'أُطِيعُ اللَّهَ تَعَالَى',nodes:[{i:'✅',t:'أَتَّبِعُ أَوَامِرَهُ',d:'الصَّلَاةُ وَالصِّدْقُ وَالبِرُّ وَالعَطَاءُ'},{i:'⛔',t:'أَجْتَنِبُ نَوَاهِيَهُ',d:'الكَذِبُ وَالسُّخْرِيَةُ وَالإِسْرَافُ'},{i:'💚',t:'رِضَا اللَّهِ',d:'رِضَاهُ وَمَحَبَّتُهُ وَثَوَابُهُ'},{i:'🤝',t:'مَحَبَّةُ النَّاسِ',d:'يُحِبُّنِي النَّاسُ وَيَثِقُونَ بِي'},{i:'🌸',t:'الحَيَاةُ الطَّيِّبَةُ',d:'حَيَاةٌ سَعِيدَةٌ مُطْمَئِنَّةٌ'}],note:'من «أنظم معارفي» ص ٩١: طاعتي لله تعالى تكسبني رضاه ومحبته وثوابه، ومحبة الناس، والحياة الطيبة.'},

L({id:'u4l3',unit:4,unitName:'الوحدة الرابعة',n:3,nName:'الثالث',title:'أَتَعَلَّمُ الْعِلْمَ',pages:'68–73',icon:'📚',
goals:['أَقْرَأَ حَدِيثَ «تَعَلَّمُوا الْعِلْمَ» قِرَاءَةً صَحِيحَةً وَأَحْفَظَهُ.','أُبَيِّنَ فَضْلَ الْعِلْمِ مِنْ خِلَالِ الْحَدِيثِ الشَّرِيفِ.','أَذْكُرَ فَوَائِدَ طَلَبِ الْعِلْمِ.','أَحْرِصَ عَلَى تَعَلُّمِ الْعِلْمِ وَتَعْلِيمِهِ لِغَيْرِي.'],
slides:[
{stage:'warm',type:'quicktf',title:'لعبة التهيئة: صَحٌّ أَمْ خَطَأٌ بِسُرْعَةٍ',text:'صح أم خطأ؟ أسرع قبل انتهاء الوقت ⏱️',secs:10,items:[{t:'نَذْهَبُ إِلَى المَدْرَسَةِ لِنَتَعَلَّمَ.',a:true},{t:'القِرَاءَةُ تَزِيدُنَا عِلْمًا وَمَعْرِفَةً.',a:true},{t:'الكَسَلُ يُسَاعِدُنَا عَلَى التَّفَوُّقِ.',a:false,why:'الاجْتِهَادُ هُوَ الَّذِي يُسَاعِدُنَا عَلَى التَّفَوُّقِ.'},{t:'المُعَلِّمُ يُعَلِّمُنَا الخَيْرَ.',a:true},{t:'نَتَعَلَّمُ مِنَ الكُتُبِ فَقَطْ.',a:false,why:'نَتَعَلَّمُ مِنَ المُعَلِّمِ وَالكُتُبِ وَالحَاسُوبِ وَالتَّجْرِبَةِ.'},{t:'تَعَلَّمَ الطَّبِيبُ كَثِيرًا لِيُعَالِجَ المَرْضَى.',a:true},{t:'نَحْتَاجُ إِلَى العِلْمِ لِنَعْرِفَ كَيْفَ نُصَلِّي.',a:true},{t:'مَنْ يَعْرِفُ مَعْلُومَةً يُخْفِيهَا عَنْ زُمَلَائِهِ.',a:false,why:'نُشَارِكُ زُمَلَاءَنَا مَا تَعَلَّمْنَاهُ؛ فَتَعْلِيمُ العِلْمِ صَدَقَةٌ.'}],note:'تُعرض العبارة ويجيب الفريق قبل انتهاء الوقت. ناقش العبارات الخاطئة باختصار.'},
{stage:'warm',type:'scene',title:'سؤال التهيئة',art:'🎒📚✏️<br>🏫',bg:'class',q:['لِمَاذَا نَذْهَبُ إِلَى المَدْرَسَةِ كُلَّ صَبَاحٍ؟','مَاذَا تُحِبُّ أَنْ تَتَعَلَّمَ؟'],ans:'نَذْهَبُ لِنَتَعَلَّمَ العِلْمَ النَّافِعَ؛ فَاللَّهُ تَعَالَى وَرَسُولُهُ ﷺ أَمَرَانَا بِطَلَبِ العِلْمِ. ← دَرْسُنَا: «أَتَعَلَّمُ الْعِلْمَ»',note:'استمع لإجابات الطلاب ثم اضغط «التالي» لإظهار الإجابة وربطها بعنوان الدرس.'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأَسْتَنْتِجُ (١)',p:68,art:'🛏️😴<br>⏰🚌',bg:'home',chars:{'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'},'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'}},lines:[{nar:'فِي غُرْفَةِ النَّوْمِ، مَرْيَمُ نَائِمَةٌ فِي سَرِيرِهَا، وَأُمُّهَا تُوقِظُهَا.'},{who:'الأُمُّ',t:'اسْتَيْقِظِي يَا مَرْيَمُ سَتَتَأَخَّرِينَ عَنْ حَافِلَةِ الْمَدْرَسَةِ وَعَنْ دُرُوسِكِ أَيْضًا.'},{who:'مَرْيَمُ',t:'(بِتَكَاسُلٍ): لَا أُرِيدُ الذَّهَابَ إِلَى الْمَدْرَسَةِ الْيَوْمَ يَا أُمِّي.'},{who:'الأُمُّ',t:'لَا يَا مَرْيَمُ هَذَا تَصَرُّفٌ غَيْرُ مَقْبُولٍ، فَقَدْ أَمَرَنَا اللَّهُ تَعَالَى وَرَسُولُهُ الْكَرِيمُ بِطَلَبِ الْعِلْمِ.'}],note:'اقرأ الحوار بتعبير: صوت متكاسل لمريم، وصوت حانٍ حازم للأم.'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأَسْتَنْتِجُ (٢)',p:68,art:'📚☀️',bg:'home',chars:{'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'},'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'}},lines:[{who:'مَرْيَمُ',t:'(بِاهْتِمَامٍ): أَمْرٌ مِنَ اللَّهِ تَعَالَى وَرَسُولِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟!'},{who:'الأُمُّ',t:'نَعَمْ يَا مَرْيَمُ فَتَعَلُّمُ الْعِلْمِ قُرْبَةٌ إِلَى اللَّهِ، وَمَنْفَعَةٌ لِلنَّاسِ، وَتَعْلِيمُهُ لِغَيْرِكِ يُكْسِبُكِ الْأَجْرَ وَالثَّوَابَ.'},{who:'مَرْيَمُ',t:'شُكْرًا لَكِ يَا أُمِّي، سَأَنْهَضُ حَالًا.'}],note:'بعد الحوار اسأل: ما الذي غيّر رأي مريم؟'},
{stage:'practice',type:'discuss',title:'أُجِيبُ شَفَوِيًّا',p:69,art:'🤔💭',bg:'soft',qs:[{q:'لِمَاذَا لَا تُرِيدُ مَرْيَمُ الذَّهَابَ إِلَى الْمَدْرَسَةِ؟',a:'بِسَبَبِ الكَسَلِ وَالتَّكَاسُلِ.'},{q:'بِمَ نَصَحَتِ الْأُمُّ مَرْيَمَ؟',a:'بِطَلَبِ العِلْمِ وَالذَّهَابِ إِلَى المَدْرَسَةِ؛ لِأَنَّ اللَّهَ تَعَالَى وَرَسُولَهُ ﷺ أَمَرَا بِهِ.'},{q:'مَا رَأْيُكَ فِي رَفْضِ مَرْيَمَ الذَّهَابَ إِلَى الْمَدْرَسَةِ؟',a:'تَصَرُّفٌ غَيْرُ مَقْبُولٍ.'},{q:'مَا فَوَائِدُ طَلَبِ الْعِلْمِ؟',a:'قُرْبَةٌ إِلَى اللَّهِ، وَمَنْفَعَةٌ لِلنَّاسِ، وَتَعْلِيمُهُ لِلْغَيْرِ يُكْسِبُ الأَجْرَ وَالثَّوَابَ.'}],note:'أسئلة الكتاب ص ٦٩. اطرح السؤال، واستمع لأكثر من إجابة، ثم أظهر الإجابة.'},
{stage:'present',type:'hadith',title:'أَفْهَمُ قَوْلَ رَسُولِي مُحَمَّدٍ ﷺ وَأَحْفَظُهُ',p:70,text:'«تَعَلَّمُوا الْعِلْمَ، فَإِنَّ تَعَلُّمَهُ قُرْبَةٌ إِلَى اللَّهِ عَزَّ وَجَلَّ، وَتَعْلِيمَهُ لِمَنْ لَا يَعْلَمُهُ صَدَقَةٌ».',src:'الربيع، المسند، باب طلب العلم وفضله، رقم الحديث ٢٤.',art:'📖✨',note:'اقرأ الحديث قراءة نموذجية، ثم يردده الطلاب. استخدم أداة إخفاء الكلمات للحفظ التدريجي.'},
{stage:'present',type:'meanings',title:'أَكْتَشِفُ الْمَعْنَى',p:70,items:[{w:'قُرْبَةٌ',m:'تَقَرُّبٌ إِلَى اللَّهِ تَعَالَى.',i:'💚'},{w:'صَدَقَةٌ',m:'أَجْرٌ وَثَوَابٌ.',i:'🎁'},{w:'تَعْلِيمَهُ لِمَنْ لَا يَعْلَمُهُ',m:'أَنْ أُعَلِّمَ غَيْرِي مَا تَعَلَّمْتُهُ.',i:'👨🏻‍🏫'}],note:'الكلمتان الأوليان من جدول الكتاب ص ٧٠. اطلب من الطلاب استعمال كل كلمة في جملة.'},
{stage:'practice',type:'scramble',title:'أَحْفَظُ الحَدِيثَ',text:'رتّب كلمات الحديث',items:[{t:'تَعَلَّمُوا الْعِلْمَ، فَإِنَّ تَعَلُّمَهُ قُرْبَةٌ إِلَى اللَّهِ عَزَّ وَجَلَّ،',hint:'الجُزْءُ الأَوَّلُ مِنَ الحَدِيثِ'},{t:'وَتَعْلِيمَهُ لِمَنْ لَا يَعْلَمُهُ صَدَقَةٌ.',hint:'الجُزْءُ الثَّانِي مِنَ الحَدِيثِ'}],note:'يتناوب الطلاب على ترتيب الكلمات وهم يرددون الحديث، ثم يُسمّعه طالب كاملًا.'},

{stage:'warm',type:'scene',title:'سؤال التهيئة',art:'🕌<br>🧎',bg:'mosque',q:['فِي الصَّلَاةِ نَقِفُ وَنَرْكَعُ وَنَسْجُدُ… ثُمَّ نَجْلِسُ. مَاذَا نَقُولُ وَنَحْنُ جَالِسُونَ؟'],ans:'نَقُولُ التَّشَهُّدَ (التَّحِيَّاتِ). ← دَرْسُنَا: «التَّشَهُّدُ (التَّحِيَّاتُ)»',note:'استمع لإجابات الطلاب، ثم اضغط «التالي» لإظهار الإجابة.'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأُجِيبُ',p:74,art:'🛋️<br>📖🕌',bg:'home',chars:{'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'},'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'}},lines:[{nar:'جَلَسَتْ مَرْيَمُ وَأُمُّهَا عَلَى الأَرِيكَةِ فِي غُرْفَةِ الجُلُوسِ.'},{who:'مَرْيَمُ',t:'أُمِّي لَقَدْ أَتْقَنْتُ حِفْظَ دُعَاءِ الِاسْتِفْتَاحِ لِلصَّلَاةِ، فَمَاذَا سَتُعَلِّمِينَنِي مِنْهَا الْيَوْمَ؟'},{who:'الأُمُّ',t:'أَنْتِ رَائِعَةٌ يَا مَرْيَمُ وَأَشْكُرُ لَكِ اهْتِمَامَكِ بِتَعَلُّمِ الصَّلَاةِ، وَسَتَكُونُ خُطْوَةُ الْيَوْمِ هِيَ تَعَلُّمُ أَلْفَاظِ التَّشَهُّدِ.'},{who:'مَرْيَمُ',t:'التَّشَهُّدُ؟! وَلِمَاذَا سُمِّيَ كَذَلِكَ؟'},{who:'الأُمُّ',t:'لِاشْتِمَالِهِ عَلَى نُطْقِ الشَّهَادَتَيْنِ يَا ابْنَتِي.'}],note:'اقرأ الحوار (لقطتان في الكتاب ص ٧٤) أو وزّع الأدوار على طالبتين.'},
{stage:'present',type:'hadith',title:'التَّشَهُّدُ (التَّحِيَّاتُ)',p:75,intro:'التَّشَهُّدُ:',text:'التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.',note:'اقرأ التشهد قراءة نموذجية جملةً جملة، ويردد الطلاب خلفك. ثم استخدم أداة إخفاء الكلمات للحفظ التدريجي.'},
{stage:'practice',type:'discuss',title:'أُجِيبُ شَفَوِيًّا',p:75,art:'🤔💭',bg:'soft',qs:[{q:'مَا الْخُطْوَةُ الَّتِي تَعَلَّمَتْهَا مَرْيَمُ الْيَوْمَ مَعَ أُمِّهَا؟',a:'تَعَلُّمُ أَلْفَاظِ التَّشَهُّدِ (التَّحِيَّاتِ).'},{q:'لِمَاذَا سُمِّيَ التَّشَهُّدُ بِهَذَا الِاسْمِ؟',a:'لِاشْتِمَالِهِ عَلَى نُطْقِ الشَّهَادَتَيْنِ.'},{q:'اقْرَأِ الشَّهَادَتَيْنِ مِنْ نَصِّ التَّشَهُّدِ.',a:'أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.'}],note:'السؤالان الأولان من الكتاب ص ٧٥، والثالث إضافي لربط الاسم بالنص.'},
{stage:'present',type:'meanings',title:'أَفْهَمُ مَعَانِيَ كَلِمَاتِ التَّشَهُّدِ',p:75,items:[{w:'التَّحِيَّاتُ',m:'تَعْظِيمُ اللَّهِ عَزَّ وَجَلَّ وَالثَّنَاءُ عَلَيْهِ.',i:'🌟'},{w:'الطَّيِّبَاتُ',m:'مَا طَابَ مِنْ نِيَّةٍ أَوْ قَوْلٍ أَوْ فِعْلٍ.',i:'💐'},{w:'الصَّلَوَاتُ',m:'الْأَذْكَارُ وَالْأَدْعِيَةُ الَّتِي يُتَقَرَّبُ بِهَا إِلَى اللَّهِ تَعَالَى.',i:'🤲'}],note:'اقلب كل بطاقة، واطلب من الطلاب قراءة الجملة التي وردت فيها الكلمة من التشهد.'},
{stage:'practice',type:'match',title:'أَصِلُ الكَلِمَةَ بِمَعْنَاهَا',pairs:[['التَّحِيَّاتُ','تَعْظِيمُ اللَّهِ وَالثَّنَاءُ عَلَيْهِ'],['الطَّيِّبَاتُ','مَا طَابَ مِنْ نِيَّةٍ أَوْ قَوْلٍ أَوْ فِعْلٍ'],['الصَّلَوَاتُ','الأَذْكَارُ وَالأَدْعِيَةُ'],['أَشْهَدُ','أُقِرُّ وَأَعْتَرِفُ بِقَلْبِي وَلِسَانِي']],note:'نشاط تثبيت للمعاني. الكلمة الرابعة إضافية لتوضيح معنى الشهادة.'},
{stage:'present',type:'explain',title:'مَتَى أَقُولُ التَّشَهُّدَ؟',text:'التَّشَهُّدُ جُزْءٌ مِنْ صَلَاتِي:',points:[{i:'🧎',t:'أَقُولُهُ وَأَنَا جَالِسٌ فِي الصَّلَاةِ، لَا وَأَنَا وَاقِفٌ.'},{i:'2️⃣',t:'فِي الجُلُوسِ بَعْدَ الرَّكْعَةِ الثَّانِيَةِ.'},{i:'🏁',t:'وَفِي الجُلُوسِ الأَخِيرِ قَبْلَ السَّلَامِ.'},{i:'☝️',t:'سُمِّيَ التَّشَهُّدَ لِأَنَّ فِيهِ الشَّهَادَتَيْنِ، وَيُسَمَّى أَيْضًا: التَّحِيَّاتِ.'}],art:'🕌',bg:'mosque',artW:260,note:'وضّح جلسة التشهد عمليًا أمام الطلاب، ثم اطلب من طالب أن يجلس جلسة التشهد ويقرأ التشهد.'},
{stage:'practice',type:'fill',title:'أَتَعَلَّمُ وَأُطَبِّقُ: أُسَاعِدُ سَالِمًا (١)',p:76,items:[{t:'التَّحِيَّاتُ ___ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ،',a:'لِلَّهِ',o:['لِلَّهِ','لَنَا','لَكُمْ']},{t:'التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَ ___ ،',a:'الطَّيِّبَاتُ',o:['الطَّيِّبَاتُ','الحَسَنَاتُ','البَرَكَاتُ']},{t:'السَّلَامُ عَلَيْكَ أَيُّهَا ___ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ.',a:'النَّبِيُّ',o:['النَّبِيُّ','الإِمَامُ','المُعَلِّمُ']},{t:'___ وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ،',a:'السَّلَامُ عَلَيْنَا',o:['السَّلَامُ عَلَيْنَا','السَّلَامُ عَلَيْكُمْ','الحَمْدُ لِلَّهِ']}],note:'سالم جالس جلسة التشهد ويحتاج مساعدتنا (الكتاب ص ٧٦). يقرأ الطالب السطر كاملًا بعد اختيار الكلمة.'},
{stage:'practice',type:'fill',title:'أَتَعَلَّمُ وَأُطَبِّقُ: أُسَاعِدُ سَالِمًا (٢)',p:76,items:[{t:'السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ ___ ،',a:'الصَّالِحِينَ',o:['الصَّالِحِينَ','المُسَافِرِينَ','الصَّائِمِينَ']},{t:'أَشْهَدُ أَنْ لَا ___ إِلَّا اللَّهُ،',a:'إِلَهَ',o:['إِلَهَ','رَبَّ','نَبِيَّ']},{t:'وَ ___ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.',a:'أَشْهَدُ',o:['أَشْهَدُ','أَقُولُ','أَعْلَمُ']},{t:'وَأَشْهَدُ أَنَّ ___ عَبْدُهُ وَرَسُولُهُ.',a:'مُحَمَّدًا',o:['مُحَمَّدًا','إِبْرَاهِيمَ','عِيسَى']}],note:'إجابات الكتاب بالترتيب: لله – الطيبات – النبي – السلام علينا – الصالحين – إله – أشهد – محمدًا. بعد الإكمال يقرأ طالب التشهد كاملًا.'},
{stage:'practice',type:'classify',title:'أَتَعَاوَنُ مَعَ زُمَلَائِي: أُرْشِدُ خَدِيجَةَ',p:77,text:'نُرْشِدُ خَدِيجَةَ إِلَى الوَضْعِيَّةِ وَالأَلْفَاظِ المُنَاسِبَةِ لِلتَّشَهُّدِ: أَيَّ مُلْصَقٍ تَخْتَارُ؟',bins:[{t:'مُلْصَقٌ مُنَاسِبٌ لِلتَّشَهُّدِ',i:'✅',c:'#22a559'},{t:'غَيْرُ مُنَاسِبٍ',i:'❌',c:'#e5484d'}],items:[{t:'خَدِيجَةُ جَالِسَةٌ عَلَى سَجَّادَةِ الصَّلَاةِ',i:'🧎‍♀️',b:0},{t:'خَدِيجَةُ وَاقِفَةٌ عَلَى سَجَّادَةِ الصَّلَاةِ',i:'🧍‍♀️',b:1},{t:'التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ…',i:'📜',b:0},{t:'سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، تَبَارَكَ اسْمُكَ…',i:'📜',b:1}],note:'نشاط الملصقات ص ٧٧: الوضعية الصحيحة هي الجلوس، والألفاظ هي «التحيات لله…»، أما «سبحانك اللهم…» فهو دعاء الاستفتاح ويُقال ونحن واقفون في أول الصلاة.'},
{stage:'practice',type:'scramble',title:'أَحْفَظُ التَّشَهُّدَ',text:'رتّب كلمات التشهد',items:[{t:'السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ',hint:'بَعْدَ: التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ'},{t:'السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ',hint:'نُسَلِّمُ عَلَى أَنْفُسِنَا وَعَلَى الصَّالِحِينَ'},{t:'أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ',hint:'الشَّهَادَةُ الأُولَى'},{t:'وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ',hint:'الشَّهَادَةُ الثَّانِيَةُ'}],note:'يتناوب الطلاب على ترتيب العبارات وهم يرددونها، ثم يُسمّع طالب التشهد كاملًا.'},
{stage:'assess',type:'perform',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:78,i:'🧎',text:'أَحْفَظُ التَّشَهُّدَ، ثُمَّ أُقَيِّمُ حِفْظِي: مُتْقِنٌ ⭐⭐⭐ – مُتَوَسِّطٌ ⭐⭐ – يَحْتَاجُ إِلَى مُتَابَعَةٍ ⭐',secs:60,note:'يجلس الطالب جلسة التشهد ويُسمّعه غيبًا، ثم يقيّم حفظه بالنجوم ويضع علامة في جدول الكتاب ص ٧٨.'},
{stage:'assess',type:'tf',title:'النَّشَاطُ الثَّانِي: ✓ أَمْ ✗',p:78,items:[{t:'أَدَّتْ سَلْمَى التَّشَهُّدَ وَهِيَ فِي وَضْعِيَّةِ الْجُلُوسِ.',a:true},{t:'يُسَمَّى التَّشَهُّدُ أَيْضًا بِالتَّوْجِيهِ.',a:false,why:'يُسَمَّى التَّشَهُّدُ أَيْضًا: التَّحِيَّاتِ.'},{t:'سُمِّيَ التَّشَهُّدُ بِهَذَا الاسْمِ لِأَنَّ فِيهِ الشَّهَادَتَيْنِ.',a:true},{t:'نَقُولُ التَّشَهُّدَ وَنَحْنُ وَاقِفُونَ فِي أَوَّلِ الصَّلَاةِ.',a:false,why:'نَقُولُهُ وَنَحْنُ جَالِسُونَ؛ وَفِي أَوَّلِ الصَّلَاةِ نَقُولُ دُعَاءَ الاسْتِفْتَاحِ.'}],note:'العبارتان الأوليان من الكتاب ص ٧٨، والباقي إضافي.'},
{stage:'game',type:'ladder',title:'اللعبة الختامية: سُلَّمُ التَّشَهُّدِ',text:'أجب لتصعد السلّم إلى القمة 🪜',me:'🧕🏻',qs:[{q:'أَكْمِلْ: التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَ ___',o:['الطَّيِّبَاتُ','البَرَكَاتُ','الحَسَنَاتُ'],a:0},{q:'أَكْمِلْ: السَّلَامُ عَلَيْكَ أَيُّهَا ___',o:['النَّبِيُّ','الإِمَامُ','الصَّدِيقُ'],a:0},{q:'نَقُولُ التَّشَهُّدَ وَنَحْنُ:',o:['جَالِسُونَ','وَاقِفُونَ','رَاكِعُونَ'],a:0},{q:'مَعْنَى «التَّحِيَّاتُ»:',o:['تَعْظِيمُ اللَّهِ وَالثَّنَاءُ عَلَيْهِ','الطَّعَامُ الطَّيِّبُ','السَّلَامُ عَلَى الأَصْدِقَاءِ'],a:0},{q:'سُمِّيَ التَّشَهُّدُ بِهَذَا الاسْمِ لِأَنَّ فِيهِ:',o:['الشَّهَادَتَيْنِ','سُورَةَ الفَاتِحَةِ','التَّكْبِيرَ'],a:0},{q:'الاسْمُ الآخَرُ لِلتَّشَهُّدِ:',o:['التَّحِيَّاتُ','التَّوْجِيهُ','الاسْتِفْتَاحُ'],a:0},{q:'أَكْمِلْ: وَأَشْهَدُ أَنَّ مُحَمَّدًا ___',o:['عَبْدُهُ وَرَسُولُهُ','نَبِيٌّ كَرِيمٌ','خَيْرُ النَّاسِ'],a:0}],note:'يجيب الفريق صاحب الدور؛ كل إجابة صحيحة ترفعه درجة. الفريق الذي يصل للقمة يقرأ التشهد كاملًا.'},

goals:['أُعَلِّلَ وَصْفَ أَهْلِ مَكَّةَ لِلرَّسُولِ ﷺ بِالصَّادِقِ الْأَمِينِ.','أَذْكُرَ مَوَاقِفَ مِنْ أَمَانَةِ النَّبِيِّ ﷺ وَحِرْصِهِ عَلَيْهَا.','أُقَارِنَ بَيْنَ صِفَاتِ الأَمِينِ وَالخَائِنِ.','أَقْتَدِيَ بِرَسُولِي ﷺ فَأُؤَدِّيَ الأَمَانَاتِ إِلَى أَهْلِهَا.'],
slides:[
{stage:'warm',type:'memory',title:'لعبة التهيئة: بِطَاقَاتُ الأَمَانَةِ',text:'اقلب بطاقتين: الكلمة ومعناها',pairs:[['🤝 الأَمَانَةُ','أَحْفَظُ مَا أُؤْتَمَنُ عَلَيْهِ'],['🗣️ الصِّدْقُ','أَقُولُ الحَقَّ دَائِمًا'],['🤐 السِّرُّ','لَا أُخْبِرُ بِهِ أَحَدًا'],['💰 الوَدِيعَةُ','شَيْءٌ ثَمِينٌ نَحْفَظُهُ لِغَيْرِنَا'],['🕋 مَكَّةُ المُكَرَّمَةُ','بَلَدُ النَّبِيِّ ﷺ وَمَوْلِدُهُ'],['🐪 الهِجْرَةُ','مِنْ مَكَّةَ إِلَى المَدِينَةِ']],note:'يقلب كل فريق بطاقتين في دوره. بعد اللعبة اسأل: «من أشهر من اتصف بالأمانة؟».'},
{stage:'warm',type:'scene',title:'سؤال التهيئة',art:'💍📦<br>🔐',bg:'gold',q:['لَوْ أَرَدْتَ أَنْ تَتْرُكَ شَيْئًا ثَمِينًا عِنْدَ أَحَدٍ، فَعِنْدَ مَنْ تَتْرُكُهُ؟ وَلِمَاذَا؟'],ans:'عِنْدَ الأَمِينِ الَّذِي نَثِقُ بِهِ؛ وَأَشْهَرُ مَنِ اتَّصَفَ بِالأَمَانَةِ نَبِيُّنَا مُحَمَّدٌ ﷺ الَّذِي لَقَّبَهُ قَوْمُهُ بِالأَمِينِ. ← دَرْسُنَا: «مُحَمَّدٌ ﷺ النَّبِيُّ الأَمِينُ»',note:'استمع لإجابات الطلاب ثم اضغط «التالي» لإظهار الإجابة.'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأُجِيبُ (١)',p:79,art:'🚗🏙️',bg:'sky',chars:{'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'},'أَحْمَدُ':{e:'👦🏻',c:'#e3f2ff'},'الأَبُ':{e:'👳🏻‍♂️',c:'#e2f7e9'}},lines:[{nar:'فِي السَّيَّارَةِ، يَقُودُ الأَبُ وَمَعَهُ مَرْيَمُ وَأَحْمَدُ.'},{who:'مَرْيَمُ',t:'مَاذَا قَالَ لَكَ صَدِيقُكَ خَالِدٌ فِي الْحَافِلَةِ صَبَاحًا يَا أَحْمَدُ؟'},{who:'أَحْمَدُ',t:'أَعْتَذِرُ عَنْ إِخْبَارِكِ، فَهُوَ سِرٌّ لَا يُرِيدُ أَنْ يَعْرِفَهُ أَحَدٌ.'},{who:'الأَبُ',t:'بُورِكْتَ يَا أَحْمَدُ، إِنِّي فَخُورٌ بِكَ يَا بُنَيَّ لِحِفْظِكَ الْأَمَانَةَ فَأَنْتَ تَقْتَدِي بِرَسُولِنَا مُحَمَّدٍ ﷺ فِي التَّحَلِّي بِخُلُقِ الْأَمَانَةِ،'}],note:'اقرأ الحوار أو وزّع الأدوار. توقف واسأل: لماذا لم يُخبر أحمدُ مريمَ بالسرّ؟'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأُجِيبُ (٢)',p:79,art:'🕋<br>💰📦',bg:'desert',chars:{'الأَبُ':{e:'👳🏻‍♂️',c:'#e2f7e9'}},lines:[{who:'الأَبُ',t:'فَهُوَ أَشْهَرُ مَنِ اتَّصَفَ بِالْأَمَانَةِ فِي كُلِّ أُمُورِ حَيَاتِهِ، قَبْلَ الْبِعْثَةِ وَبَعْدَهَا، وَقَدْ لَقَّبَهُ قَوْمُهُ بِالْأَمِينِ؛'},{who:'الأَبُ',t:'فَكَانُوا يَثِقُونَ بِهِ كُلَّ الثِّقَةِ فَيَسْتَوْدِعُونَهُ أَمَانَاتِهِمْ،'},{who:'الأَبُ',t:'فَكُلُّ مَنْ يَمْلِكُ شَيْئًا ثَمِينًا يَخَافُ عَلَيْهِ كَانَ يُودِعُهُ عِنْدَهُ ﷺ، فَيُحَافِظُ عَلَيْهِ وَيَرُدُّهُ لِصَاحِبِهِ كَامِلًا عِنْدَ طَلَبِهِ.'}],note:'وضّح معنى «يستودعونه أماناتهم»: يتركون عنده أشياءهم الثمينة ليحفظها لهم.'},
{stage:'present',type:'story',title:'أَسْتَمِعُ وَأُجِيبُ (٣)',p:79,art:'🌙🐪<br>🏜️',bg:'night',chars:{'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'},'الأَبُ':{e:'👳🏻‍♂️',c:'#e2f7e9'}},lines:[{who:'الأَبُ',t:'وَكَانَ مِنْ حِرْصِهِ ﷺ عَلَى أَدَاءِ الْأَمَانَةِ أَنَّهُ لَمَّا خَرَجَ مُهَاجِرًا مِنْ مَكَّةَ الْمُكَرَّمَةِ إِلَى الْمَدِينَةِ الْمُنَوَّرَةِ'},{who:'الأَبُ',t:'تَرَكَ ابْنَ عَمِّهِ عَلِيَّ بْنَ أَبِي طَالِبٍ كَرَّمَ اللَّهُ وَجْهَهُ فِي مَكَّةَ؛ لِيَرُدَّ وَدَائِعَ النَّاسِ الَّتِي كَانَتْ عِنْدَهُ.'},{who:'مَرْيَمُ',t:'مَا أَرْوَعَ ذَلِكَ!'},{who:'الأَبُ',t:'نَعَمْ فَالْأَمَانَةُ خُلُقٌ عَظِيمٌ، وَقَدِ اتَّصَفَ بِهَا جَمِيعُ الرُّسُلِ الَّذِينَ بَلَّغُوا رِسَالَةَ اللَّهِ تَعَالَى إِلَى النَّاسِ.'}],note:'أكّد أن النبي ﷺ ردّ الأمانات حتى لمن آذوه، فلم يأخذ منها شيئًا.'},
{stage:'practice',type:'discuss',title:'أُجِيبُ شَفَوِيًّا',p:80,art:'🤔💭',bg:'soft',qs:[{q:'مَا رَأْيُكَ فِي تَصَرُّفِ أَحْمَدَ؟ وَلِمَاذَا؟',a:'تَصَرُّفٌ صَحِيحٌ؛ لِأَنَّهُ حَفِظَ الأَمَانَةَ (السِّرَّ) اقْتِدَاءً بِالنَّبِيِّ ﷺ فِي الأَمَانَةِ.'},{q:'لِمَاذَا كَانَ أَهْلُ مَكَّةَ يَسْتَوْدِعُونَ أَمْوَالَهُمْ عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟',a:'لِأَنَّهُمْ كَانُوا يَثِقُونَ بِهِ كُلَّ الثِّقَةِ؛ فَهُوَ الأَمِينُ يُحَافِظُ عَلَيْهَا وَيَرُدُّهَا كَامِلَةً.'},{q:'لِمَاذَا تَرَكَ النَّبِيُّ ﷺ عَلِيًّا كَرَّمَ اللَّهُ وَجْهَهُ فِي مَكَّةَ عِنْدَ هِجْرَتِهِ إِلَى الْمَدِينَةِ؟',a:'لِيَرُدَّ وَدَائِعَ النَّاسِ الَّتِي كَانَتْ عِنْدَ النَّبِيِّ ﷺ فِي مَكَّةَ.'}],note:'أسئلة الكتاب ص ٨٠. استمع لأكثر من إجابة قبل إظهار الإجابة.'},
{stage:'present',type:'story',title:'قِصَّةٌ: الأَمِينُ وَالحَجَرُ الأَسْوَدُ',art:'🕋🧱<br>⛰️🌧️',bg:'desert',lines:[{nar:'قَبْلَ البِعْثَةِ، نَزَلَ مَطَرٌ شَدِيدٌ وَسَيْلٌ أَصَابَ الكَعْبَةَ، فَأَعَادَتْ قُرَيْشٌ بِنَاءَهَا.'},{nar:'وَلَمَّا وَصَلُوا إِلَى مَكَانِ الحَجَرِ الأَسْوَدِ اخْتَلَفُوا: كُلُّ قَبِيلَةٍ تُرِيدُ أَنْ تَضَعَهُ بِنَفْسِهَا.'},{nar:'فَاتَّفَقُوا أَنْ يَحْكُمَ بَيْنَهُمْ أَوَّلُ مَنْ يَدْخُلُ المَسْجِدَ، فَكَانَ مُحَمَّدٌ ﷺ أَوَّلَ الدَّاخِلِينَ.'},{nar:'فَفَرِحُوا وَقَالُوا: «هَذَا الأَمِينُ، رَضِينَا بِهِ».'},{nar:'فَوَضَعَ ﷺ الحَجَرَ عَلَى ثَوْبٍ، وَأَمْسَكَتْ كُلُّ قَبِيلَةٍ بِطَرَفٍ، ثُمَّ وَضَعَهُ بِيَدِهِ الشَّرِيفَةِ فِي مَكَانِهِ.'}],note:'قصة إثرائية من السيرة (ليست في الكتاب) تبيّن أن قريشًا لقّبته بالأمين قبل البعثة ورضيت بحكمه. اسأل: لماذا رضيت كل القبائل بحكمه؟'},
{stage:'practice',type:'fill',title:'أَسْتَنْتِجُ وَأَتَعَلَّمُ: الأَمِينُ وَالخَائِنُ',p:81,items:[{t:'الأَمِينُ: ___ اللَّهُ تَعَالَى وَرَسُولُهُ عَنْهُ.',a:'يَرْضَى',o:['يَرْضَى','يَغْضَبُ']},{t:'الأَمِينُ: يَثِقُ بِهِ ___ وَيَتَعَامَلُونَ مَعَهُ.',a:'النَّاسُ',o:['النَّاسُ','اللُّصُوصُ']},{t:'الخَائِنُ: ___ الْحُقُوقَ إِلَى أَصْحَابِهَا.',a:'لَا يُؤَدِّي',o:['لَا يُؤَدِّي','يُؤَدِّي']},{t:'الخَائِنُ: يَبْتَعِدُ عَنْهُ النَّاسُ وَلَا ___ مَعَهُ.',a:'يَتَعَامَلُونَ',o:['يَتَعَامَلُونَ','يَبْتَعِدُونَ']}],note:'أكمل الخريطة المعرفية ص ٨١. عنوان النصف الفارغ في الكتاب: «الأمين».'},
{stage:'present',type:'compare',title:'الخَرِيطَةُ المَعْرِفِيَّةُ كَامِلَةً',p:81,cols:[{h:'الأَمِينُ',i:'💚',lines:['يَرْضَى اللَّهُ تَعَالَى وَرَسُولُهُ عَنْهُ.','يُؤَدِّي الْحُقُوقَ إِلَى أَصْحَابِهَا.','يَثِقُ بِهِ النَّاسُ وَيَتَعَامَلُونَ مَعَهُ.']},{h:'الخَائِنُ',i:'💔',lines:['يَغْضَبُ اللَّهُ تَعَالَى وَرَسُولُهُ عَلَيْهِ.','لَا يُؤَدِّي الْحُقُوقَ إِلَى أَصْحَابِهَا.','يَبْتَعِدُ عَنْهُ النَّاسُ وَلَا يَتَعَامَلُونَ مَعَهُ.']}],box:'أَكُونُ أَمِينًا لِأَنَالَ رِضَا اللَّهِ تَعَالَى وَثِقَةَ النَّاسِ.',reveal:true,note:'اقرأ كل سطر وقابله بالسطر المقابل، ثم يكتب الطلاب الإجابات في الكتاب.'},
{stage:'present',type:'explain',title:'كَيْفَ أَكُونُ أَمِينًا؟',text:'أَقْتَدِي بِرَسُولِي ﷺ فَأَكُونُ أَمِينًا:',points:[{i:'🤐',t:'أَحْفَظُ السِّرَّ كَمَا فَعَلَ أَحْمَدُ.'},{i:'📦',t:'أَرُدُّ الأَشْيَاءَ الَّتِي أَسْتَعِيرُهَا سَلِيمَةً.'},{i:'🪙',t:'أُعِيدُ المَالَ الزَّائِدَ إِلَى صَاحِبِهِ.'},{i:'✋',t:'لَا آخُذُ شَيْئًا لِغَيْرِي دُونَ إِذْنِهِ.'},{i:'📚',t:'أُؤَدِّي وَاجِبَاتِي فِي البَيْتِ وَالمَدْرَسَةِ.'}],box:'الأَمَانَةُ خُلُقٌ عَظِيمٌ اتَّصَفَ بِهِ جَمِيعُ الرُّسُلِ.',art:'🤝',bg:'soft',artW:220,note:'اطلب من الطلاب أمثلة من حياتهم على كل نقطة.'},
{stage:'practice',type:'scene',title:'أَتَأَمَّلُ وَأُعَبِّرُ: المَوْقِفُ الأَوَّلُ',p:82,art:'🏪🧾<br>👦🏻💵',bg:'soft',size:110,q:['اشْتَرَيْتَ بِضَاعَةً بِتِسْعِمِائَةِ بَيْسَةٍ، وَدَفَعْتَ رِيَالًا لِلْمُحَاسِبِ، وَأَعَادَ لَكَ مِائَتَيْ بَيْسَةٍ.','كَيْفَ تَقْتَدِي بِرَسُولِكَ ﷺ فِي الأَمَانَةِ؟'],ans:'البَاقِي الصَّحِيحُ مِائَةُ بَيْسَةٍ فَقَطْ؛ فَأُعِيدُ المِائَةَ الزَّائِدَةَ إِلَى المُحَاسِبِ أَمَانَةً.',note:'احسب مع الطلاب: الريال = ١٠٠٠ بيسة، ١٠٠٠ − ٩٠٠ = ١٠٠ بيسة. التعبير شفوي.'},
{stage:'practice',type:'scene',title:'أَتَأَمَّلُ وَأُعَبِّرُ: المَوْقِفُ الثَّانِي',p:82,art:'👧🏽🖍️<br>👧🏻❓',bg:'class',size:110,q:['أَعَارَتْكِ زَمِيلَتُكِ عُلْبَةَ أَلْوَانِهَا، ثُمَّ طَلَبَتْ مِنْكِ زَمِيلَةٌ أُخْرَى إِعَارَتَهَا قَلَمًا مِنْ تِلْكَ الْعُلْبَةِ لِحَاجَتِهَا إِلَيْهَا.','مَاذَا تَفْعَلِينَ؟'],ans:'لَا أُعِيرُ مِنَ العُلْبَةِ دُونَ إِذْنِ صَاحِبَتِهَا؛ لِأَنَّهَا أَمَانَةٌ عِنْدِي، فَأَسْتَأْذِنُ صَاحِبَتَهَا أَوْ أَعْتَذِرُ بِلُطْفٍ.',note:'تعبير شفوي. ناقش: هل العلبة ملكي؟ لمن أرجع قبل أن أعطي منها؟'},
{stage:'assess',type:'tf',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:83,items:[{t:'لَقَّبَ أَهْلُ مَكَّةَ النَّبِيَّ مُحَمَّدًا ﷺ بِالصَّادِقِ الْأَمِينِ.',a:true},{t:'تَوَقَّفَ أَهْلُ مَكَّةَ عَنْ إِيدَاعِ أَمَانَاتِهِمْ عِنْدَ النَّبِيِّ ﷺ بَعْدَ الْبِعْثَةِ.',a:false,why:'اسْتَمَرُّوا فِي إِيدَاعِ أَمَانَاتِهِمْ عِنْدَهُ ﷺ حَتَّى الهِجْرَةِ.'},{t:'الْأَمَانَةُ مِنْ صِفَاتِ الرُّسُلِ؛ لِأَنَّهُمْ يَنْقُلُونَ رِسَالَةَ اللَّهِ تَعَالَى إِلَى النَّاسِ.',a:true}],note:'عبارات الكتاب ص ٨٣: ✓ للصحيحة و✗ للخاطئة.'},
{stage:'assess',type:'fill',title:'النَّشَاطُ الثَّانِي: أَتْلُو وَأَتَدَبَّرُ',p:83,items:[{t:'قَالَ اللَّهُ تَعَالَى: ﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾ (النساء: ٥٨) — يَأْمُرُنَا اللَّهُ تَعَالَى فِي الْآيَةِ الْكَرِيمَةِ بِأَدَاءِ ___ .',a:'الْأَمَانَاتِ إِلَى أَهْلِهَا',o:['الْأَمَانَاتِ إِلَى أَهْلِهَا','الأَسْرَارِ إِلَى النَّاسِ','الأَمْوَالِ إِلَى الغُرَبَاءِ']}],note:'اتلُ الآية تلاوة صحيحة ويرددها الطلاب، ثم يكملون الجملة في الكتاب.'},
{stage:'assess',type:'check',title:'النَّشَاطُ الثَّالِثُ: سُلَّمُ الأَخْلَاقِ',p:84,text:'أَكْتُبُ فِي دَرَجَاتِ السُّلَّمِ (بَيْنَ الإِخْلَاصِ وَالصَّفْحِ) الْأَخْلَاقَ الَّتِي أَلْتَزِمُ بِهَا اقْتِدَاءً بِرَسُولِي مُحَمَّدٍ ﷺ: أَخْتَارُهَا ثُمَّ أَكْتُبُهَا.',items:[{t:'الأَمَانَةُ',i:'🤝',ok:true},{t:'الخِيَانَةُ',i:'💔',ok:false},{t:'الصِّدْقُ',i:'🗣️',ok:true},{t:'الكَذِبُ',i:'🤥',ok:false},{t:'الرَّحْمَةُ',i:'💚',ok:true},{t:'التَّوَاضُعُ',i:'🌾',ok:true}],note:'«نقتدي برسولنا محمد ﷺ لنرتقي». الدرجة السفلى في الكتاب: الإخلاص، والعليا: الصفح؛ يكتب الطلاب ثلاثة أخلاق في الدرجات الوسطى.'},
{stage:'game',type:'dice',title:'اللعبة الختامية: نَرْدُ الأَمَانَةِ',text:'ارمِ النرد وأجب عن السؤال 🎲',qs:[{q:'بِمَاذَا لَقَّبَ أَهْلُ مَكَّةَ النَّبِيَّ ﷺ قَبْلَ البِعْثَةِ؟',o:['الصَّادِقِ الأَمِينِ','الشُّجَاعِ','الكَرِيمِ'],a:0},{q:'لِمَاذَا تَرَكَ النَّبِيُّ ﷺ عَلِيًّا فِي مَكَّةَ عِنْدَ الهِجْرَةِ؟',ans:'لِيَرُدَّ وَدَائِعَ النَّاسِ إِلَى أَصْحَابِهَا.'},{q:'أَعْطَاكَ صَدِيقُكَ سِرًّا. مَاذَا تَفْعَلُ؟',ans:'أَحْفَظُهُ وَلَا أُخْبِرُ بِهِ أَحَدًا.'},{q:'الأَمِينُ يَثِقُ بِهِ:',o:['النَّاسُ','لَا أَحَدَ'],a:0},{q:'أَكْمِلْ: ﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا ___ إِلَىٰ أَهْلِهَا﴾',ans:'الْأَمَانَاتِ'},{q:'وَجَدْتَ قَلَمًا لِزَمِيلِكَ فِي الفَصْلِ. مَاذَا تَفْعَلُ؟',ans:'أَرُدُّهُ إِلَيْهِ أَوْ أُسَلِّمُهُ لِلْمُعَلِّمِ.'},{q:'الخَائِنُ يَغْضَبُ عَلَيْهِ:',o:['اللَّهُ تَعَالَى وَرَسُولُهُ','لَا أَحَدَ'],a:0},{q:'اذْكُرْ صِفَةً اتَّصَفَ بِهَا جَمِيعُ الرُّسُلِ.',ans:'الأَمَانَةُ (وَالصِّدْقُ).'}],note:'يرمي الفريق النرد ويجيب عن السؤال الذي يظهر. في الأسئلة المفتوحة أظهر الإجابة واحكم.'},
{stage:'close',type:'summary',title:'أُنَظِّمُ مَعَارِفِي',p:91,center:'مُحَمَّدٌ ﷺ الأَمِينُ',nodes:[{i:'🕋',t:'لَقَّبَهُ قَوْمُهُ',d:'بِالصَّادِقِ الأَمِينِ'},{i:'🐪',t:'فِي الهِجْرَةِ',d:'تَرَكَ عَلِيًّا لِيَرُدَّ الوَدَائِعَ'},{i:'🤝',t:'أَقْتَدِي بِهِ',d:'فَأُعِيدُ الحُقُوقَ إِلَى أَصْحَابِهَا'},{i:'💚',t:'رِضَا اللَّهِ تَعَالَى',d:'تُكْسِبُنِيهِ الأَمَانَةُ'},{i:'👥',t:'ثِقَةُ النَّاسِ',d:'يَثِقُونَ بِي وَيَتَعَامَلُونَ مَعِي'}],note:'من «أنظم معارفي» ص ٩١: أقتدي برسولي ﷺ في أداء الأمانة فأعيد الحقوق إلى أصحابها؛ والتزامي الأمانة يكسبني رضا الله وثقة الناس.'},

{stage:'present',type:'scene',title:'أَسْتَمِعُ وَأُجِيبُ: زِيَارَاتُ العِيدِ',p:85,art:'👳🏽‍♂️👳🏻‍♂️☕👦🏻<br>🧕🏽🍬🧕🏻<br>👨‍👩‍👧‍👧🛋️',bg:'home',size:90,q:['مَاذَا يَفْعَلُ أَحْمَدُ فِي مَجْلِسِ الرِّجَالِ؟','مَاذَا تُقَدِّمُ الأُمُّ وَمَرْيَمُ لِلضُّيُوفِ؟','فِي أَيِّ مُنَاسَبَةٍ كَانَتْ هَذِهِ الزِّيَارَاتُ؟'],ans:'يَصُبُّ أَحْمَدُ القَهْوَةَ لِلضُّيُوفِ وَهُمْ يَقُولُونَ: «هُنِّئْتُمْ بِالْعِيدِ»، وَتُقَدِّمُ الأُمُّ وَمَرْيَمُ الحَلْوَى وَالفَوَاكِهَ؛ إِنَّهَا زِيَارَاتُ العِيدِ.',note:'صف اللقطات الثلاث في الكتاب ص ٨٥: مجلس الرجال، مجلس النساء، ثم الأسرة بعد انصراف الضيوف.'},
{stage:'present',type:'story',title:'الحِوَارُ (١)',p:86,art:'🏠🌙',bg:'home',chars:{'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'},'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'},'أَحْمَدُ':{e:'👦🏻',c:'#e3f2ff'},'الأَبُ':{e:'👳🏻‍♂️',c:'#fff3d6'}},lines:[{who:'مَرْيَمُ',t:'مَا أَجْمَلَ مَنْزِلَنَا الْيَوْمَ! يَخْرُجُ أُنَاسٌ وَيَدْخُلُ آخَرُونَ.'},{who:'الأُمُّ',t:'نَعَمْ يَا مَرْيَمُ فَهَؤُلَاءِ أَهْلُنَا وَأَحْبَابُنَا يَزُورُونَنَا وَنَزُورُهُمْ لِتَبْقَى صِلَتُنَا بِهِمْ قَوِيَّةً.'},{who:'أَحْمَدُ',t:'(مُتْعَبًا): لَقَدْ تَعِبْتُ مِنِ اسْتِقْبَالِ الضُّيُوفِ يَا أَبِي، أُرِيدُ أَنْ أَلْعَبَ بِأَلْعَابِي الْجَدِيدَةِ.'},{who:'الأَبُ',t:'أُقَدِّرُ تَعَبَكَ يَا بُنَيَّ وَلَكِنَّهُمْ أَرْحَامُنَا يَصِلُونَنَا وَيَجِبُ عَلَيْنَا أَنْ نَصِلَهُمْ.'}],note:'اقرأ الحوار بتعبير، أو وزّع الأدوار الأربعة على الطلاب.'},
{stage:'present',type:'story',title:'الحِوَارُ (٢)',p:86,art:'👴🏽👵🏽💞',bg:'home',chars:{'مَرْيَمُ':{e:'🧕🏻',c:'#ffe1ef'},'الأُمُّ':{e:'🧕🏽',c:'#e2f7e9'},'أَحْمَدُ':{e:'👦🏻',c:'#e3f2ff'},'الأَبُ':{e:'👳🏻‍♂️',c:'#fff3d6'}},lines:[{who:'أَحْمَدُ',t:'مَاذَا تَقْصِدُ بِأَرْحَامِنَا يَا أَبِي؟'},{who:'الأَبُ',t:'أَرْحَامُنَا هُمْ أَقَارِبُنَا الَّذِينَ تَرْبُطُنَا بِهِمْ صِلَةُ قَرَابَةٍ.'},{who:'الأُمُّ',t:'وَصِلَتُهُمْ تُعَمِّقُ عَلَاقَتَنَا بِهِمْ، وَتُبَارِكُ فِي أَعْمَارِنَا وَتُكْسِبُنَا الْأَجْرَ وَالثَّوَابَ مِنَ اللَّهِ تَعَالَى.'},{who:'أَحْمَدُ',t:'(مُتَحَمِّسًا): هَيَّا بِنَا إِذَنْ لِزِيَارَةِ جَدِّي وَجَدَّتِي وَكُلِّ أَقَارِبِي.'},{who:'الأَبُ',t:'(وَهُوَ يَضْحَكُ): يَبْدُو أَنَّ التَّعَبَ وَالْمَلَلَ قَدْ زَالَا مِنْ أَحْمَدَ.'}],note:'بعد الحوار اسأل: ما الذي جعل أحمد متحمسًا بعد أن كان متعبًا؟'},
{stage:'practice',type:'discuss',title:'أُجِيبُ شَفَوِيًّا',p:86,art:'🤔💭',bg:'soft',qs:[{q:'مَا سَبَبُ سَعَادَةِ مَرْيَمَ؟',a:'كَثْرَةُ زِيَارَةِ الأَهْلِ وَالأَحْبَابِ (الأَرْحَامِ) لِمَنْزِلِهِمْ فِي العِيدِ.'},{q:'مَنْ هُمْ أَرْحَامُنَا؟',a:'أَقَارِبُنَا الَّذِينَ تَرْبُطُنَا بِهِمْ صِلَةُ قَرَابَةٍ.'},{q:'مَا مَعْنَى أَصِلُ أَرْحَامِي؟',a:'أَزُورُهُمْ وَأَتَوَاصَلُ مَعَهُمْ وَأُحْسِنُ إِلَيْهِمْ وَلَا أَقْطَعُهُمْ.'},{q:'لِمَاذَا أَصِلُ أَرْحَامِي؟',a:'لِأَنَّ صِلَتَهُمْ وَاجِبَةٌ، وَتُعَمِّقُ العَلَاقَةَ، وَتُبَارِكُ فِي العُمُرِ، وَتُكْسِبُنَا الأَجْرَ.'}],note:'أسئلة الكتاب ص ٨٦. استمع لأكثر من إجابة قبل إظهار الإجابة.'},
{stage:'present',type:'explain',title:'صِلَةُ الرَّحِمِ',text:'أَرْحَامِي: أَقَارِبِي الَّذِينَ تَرْبُطُنِي بِهِمْ صِلَةُ قَرَابَةٍ، مِثْلُ:',points:[{i:'👴🏽',t:'الجَدُّ وَالجَدَّةُ.'},{i:'👨‍👩‍👧',t:'الإِخْوَةُ وَالأَخَوَاتُ.'},{i:'🏠',t:'الأَعْمَامُ وَالعَمَّاتُ، وَالأَخْوَالُ وَالخَالَاتُ وَأَبْنَاؤُهُمْ.'},{i:'🔗',t:'صِلَتُهُمْ وَاجِبَةٌ، وَتُعَمِّقُ عَلَاقَتَنَا بِهِمْ.'},{i:'⏳',t:'تُبَارِكُ فِي أَعْمَارِنَا، وَتُكْسِبُنَا الأَجْرَ وَالثَّوَابَ.'}],box:'أَصِلُ أَرْحَامِي: أَزُورُهُمْ، وَأَتَوَاصَلُ مَعَهُمْ، وَأُحْسِنُ إِلَيْهِمْ، وَلَا أَقْطَعُهُمْ.',art:'💞',bg:'soft',artW:200,note:'اطلب من كل طالب أن يذكر اسم أحد أرحامه وصلة قرابته به.'},
{stage:'present',type:'cards',title:'أَتَعَاوَنُ مَعَ زُمَلَائِي: مَظَاهِرُ صِلَةِ الرَّحِمِ',p:87,text:'نَتَأَمَّلُ الرُّسُومَاتِ، وَنُوَضِّحُ مَظَاهِرَ أُخْرَى لِصِلَةِ الرَّحِمِ:',items:[{i:'🏥🤲',t:'«عَافَاكِ اللَّهُ وَشَفَاكِ»',d:'زِيَارَةُ المَرِيضِ مِنَ الأَقَارِبِ وَالدُّعَاءُ لَهُ 🏥'},{i:'🧣🏖️',t:'«خُذْ هَذَا الْمَصَرَّ لِيَقِيَكَ مِنَ الْبَرْدِ يَا ابْنَ أَخِي.»',d:'الإِحْسَانُ إِلَى الأَقَارِبِ وَالإِهْدَاءُ إِلَيْهِمْ 🎁'},{i:'🕌🤲',t:'«اللَّهُمَّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِأَقَارِبِي…»',d:'الدُّعَاءُ لِلأَقَارِبِ 🤲'},{i:'📞',t:'«هَلْ تَحْتَاجُونَ لِأَيِّ غَرَضٍ؟ هَلْ يَنْقُصُكُمْ شَيْءٌ؟»',d:'تَفَقُّدُ أَحْوَالِ الأَقَارِبِ وَقَضَاءُ حَاجَاتِهِمْ 📞'}],cols:4,note:'قسّم الطلاب إلى أربع مجموعات؛ كل مجموعة تصف رسمة وتستنتج المظهر قبل قلب البطاقة (الكتاب ص ٨٧).'},
{stage:'present',type:'hadith',title:'أَدْعُو لِأَقَارِبِي',p:87,intro:'أَدْعُو رَبِّي:',text:'«اللَّهُمَّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِأَقَارِبِي وَلِجَمِيعِ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ الْأَحْيَاءِ مِنْهُمْ وَالْأَمْوَاتِ».',art:'🤲💞',note:'هذا الدعاء من رسمة الكتاب ص ٨٧. يردده الطلاب حتى يحفظوه، وشجّعهم على قوله بعد صلواتهم.'},
{stage:'practice',type:'classify',title:'صِلَةٌ أَمْ قَطِيعَةٌ؟',text:'أَضَعُ كُلَّ تَصَرُّفٍ فِي مَكَانِهِ:',bins:[{t:'صِلَةُ رَحِمٍ',i:'💞',c:'#22a559'},{t:'قَطِيعَةُ رَحِمٍ',i:'💔',c:'#e5484d'}],items:[{t:'أَزُورُ جَدَّتِي',i:'👵🏽',b:0},{t:'أَتَّصِلُ بِخَالِي المُسَافِرِ',i:'📞',b:0},{t:'أُهْدِي ابْنَ عَمِّي هَدِيَّةً',i:'🎁',b:0},{t:'أَدْعُو لِأَقَارِبِي',i:'🤲',b:0},{t:'أُخَاصِمُ ابْنَ عَمِّي',i:'😠',b:1},{t:'لَا أَزُورُ عَمَّتِي المَرِيضَةَ',i:'🚫',b:1},{t:'أَرْفُضُ اسْتِقْبَالَ أَقَارِبِي',i:'🚪',b:1}],note:'يختار الطالب البطاقة ثم الصندوق المناسب. اطلب تصحيح كل تصرف خاطئ شفويًا.'},
{stage:'present',type:'story',title:'أَتَعَلَّمُ وَأُطَبِّقُ: أَصِلُ رَحِمِيَ المُسَافِرَ',p:88,art:'💻<br>❄️🪟',bg:'home',chars:{'الوَلَدُ':{e:'👦🏻',c:'#e3f2ff'},'القَرِيبُ المُسَافِرُ':{e:'👦🏼',c:'#eef0ff'}},lines:[{nar:'وَلَدٌ وَأُخْتُهُ يُجْرِيَانِ مُكَالَمَةَ فِيدْيُو عَبْرَ الحَاسُوبِ مَعَ قَرِيبِهِمَا المُسَافِرِ، وَخَلْفَهُ نَافِذَةٌ يَتَسَاقَطُ مِنْهَا الثَّلْجُ.'},{who:'الوَلَدُ',t:'كَيْفَ حَالُكَ؟ وَكَيْفَ الْأَجْوَاءُ عِنْدَكُمْ؟ لَقَدِ اشْتَقْنَا لَكَ.'},{who:'القَرِيبُ المُسَافِرُ',t:'الْحَمْدُ لِلَّهِ، لَقَدْ بَدَأَتِ الثُّلُوجُ تَتَسَاقَطُ بِالْخَارِجِ.'}],note:'اطلب من الطلاب التعبير عن المشهد: بماذا يصل الطفلان قريبهما المسافر؟ (مكالمة فيديو).'},
{stage:'practice',type:'check',title:'وَسَائِلُ أُخْرَى أَصِلُ بِهَا رَحِمِيَ المُسَافِرَ',p:88,text:'أَقْتَرِحُ وَسَائِلَ أُخْرَى أَصِلُ بِهَا رَحِمِيَ المُسَافِرَ: أَخْتَارُ الصَّحِيحَ',items:[{t:'الاتِّصَالُ الهَاتِفِيُّ',i:'📞',ok:true},{t:'الرَّسَائِلُ النَّصِّيَّةُ',i:'✉️',ok:true},{t:'نِسْيَانُهُ حَتَّى يَعُودَ',i:'🙈',ok:false},{t:'إِرْسَالُ الهَدَايَا',i:'🎁',ok:true},{t:'الدُّعَاءُ لَهُ',i:'🤲',ok:true},{t:'اسْتِقْبَالُهُ عِنْدَ عَوْدَتِهِ',i:'✈️',ok:true}],note:'إجابات مقترحة؛ اقبل وسائل أخرى صحيحة يقترحها الطلاب.'},
{stage:'assess',type:'mcq',title:'أَخْتَبِرُ تَعَلُّمِي: النَّشَاطُ الأَوَّلُ',p:89,qs:[{q:'أَصِلُ رَحِمِي تَعْنِي:',o:['أُقَاطِعُ أَهْلِي وَأَقَارِبِي.','أَزُورُ أَهْلِي وَأَقَارِبِي.','أُخَاصِمُ أَهْلِي وَأَقَارِبِي.'],a:1,i:'💞'},{q:'صِلَةُ الرَّحِمِ:',o:['مُسْتَحَبَّةٌ','مَكْرُوهَةٌ','وَاجِبَةٌ'],a:2,i:'🔗',ex:'صِلَةُ الرَّحِمِ وَاجِبَةٌ، وَقَطِيعَتُهَا مَعْصِيَةٌ.'},{q:'أَرْحَامِي هُمْ:',o:['جِيرَانِي','أَقَارِبِي','زُمَلَائِي فِي الفَصْلِ'],a:1,i:'👨‍👩‍👧‍👦'}],note:'السؤالان الأولان من الكتاب ص ٨٩، والثالث إضافي.'},
{stage:'assess',type:'tf',title:'النَّشَاطُ الثَّانِي: صَحِيحٌ أَمْ خَطَأٌ؟',p:90,items:[{t:'أَزُورُ أَقَارِبِي الَّذِينَ يَزُورُونَنِي فَقَطْ.',a:false,why:'أَصِلُ جَمِيعَ أَقَارِبِي وَلَوْ لَمْ يَزُورُونِي.'},{t:'صِلَةُ الرَّحِمِ تَكُونُ بِزِيَارَةِ الْأَقَارِبِ وَالسُّؤَالِ عَنْهُمْ.',a:true},{t:'أَتَوَاصَلُ مَعَ أَرْحَامِي عَبْرَ وَسَائِلِ التَّوَاصُلِ الِاجْتِمَاعِيِّ فَقَطْ.',a:false,why:'أَزُورُهُمْ أَيْضًا، وَأَتَوَاصَلُ مَعَهُمْ بِكُلِّ الوَسَائِلِ.'},{t:'أَصِلُ أَرْحَامِي لِأَنَالَ الثَّوَابَ الْعَظِيمَ مِنَ اللَّهِ تَعَالَى.',a:true},{t:'أَصِلُ أَرْحَامِي فِي الْمُنَاسَبَاتِ وَالْأَعْيَادِ فَقَطْ.',a:false,why:'أَصِلُهُمْ فِي كُلِّ وَقْتٍ، وَلَيْسَ فِي الأَعْيَادِ فَقَطْ.'}],note:'جدول الكتاب ص ٩٠. بعد كل عبارة خاطئة اسأل: كيف نصححها؟'},
{stage:'assess',type:'write',title:'النَّشَاطُ الثَّالِثُ',p:90,i:'✍️',prompt:'أَكْتُبُ طَرِيقَتَيْنِ أَتَوَاصَلُ بِهِمَا مَعَ أَرْحَامِي.',model:'١- أَزُورُهُمْ فِي بُيُوتِهِمْ. ٢- أَتَّصِلُ بِهِمْ هَاتِفِيًّا وَأَسْأَلُ عَنْ أَحْوَالِهِمْ.',note:'إجابات مقترحة: عيادة مريضهم، الدعاء لهم، تفقّد احتياجاتهم، الإهداء إليهم…'},
{stage:'game',type:'boxes',title:'اللعبة الختامية: صَنَادِيقُ الصِّلَةِ',text:'اختر صندوقًا واكتشف ما بداخله 🎁',qs:[{q:'مَنْ هُمْ أَرْحَامُنَا؟',ans:'أَقَارِبُنَا الَّذِينَ تَرْبُطُنَا بِهِمْ صِلَةُ قَرَابَةٍ.'},{q:'صِلَةُ الرَّحِمِ:',o:['وَاجِبَةٌ','مَكْرُوهَةٌ','لَا فَائِدَةَ مِنْهَا'],a:0},{q:'اذْكُرْ فَائِدَتَيْنِ لِصِلَةِ الرَّحِمِ.',ans:'تُعَمِّقُ العَلَاقَةَ، وَتُبَارِكُ فِي العُمُرِ، وَتُكْسِبُ الأَجْرَ.'},{q:'عَمَّتُكَ مَرِيضَةٌ. مَاذَا تَفْعَلُ؟',ans:'أَزُورُهَا وَأَدْعُو لَهَا: «عَافَاكِ اللَّهُ وَشَفَاكِ».'},{q:'خَالُكَ مُسَافِرٌ. كَيْفَ تَصِلُهُ؟',o:['بِالاتِّصَالِ وَالسُّؤَالِ عَنْهُ','بِنِسْيَانِهِ'],a:0},{q:'أَخُو أَبِي هُوَ:',o:['عَمِّي','خَالِي','جَدِّي'],a:0},{q:'أَكْمِلِ الدُّعَاءَ: «اللَّهُمَّ اغْفِرْ لِي وَلِوَالِدَيَّ وَ…»',ans:'وَلِأَقَارِبِي وَلِجَمِيعِ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ الْأَحْيَاءِ مِنْهُمْ وَالْأَمْوَاتِ.'},{q:'هَلْ أَصِلُ أَرْحَامِي فِي العِيدِ فَقَطْ؟',o:['لَا، فِي كُلِّ وَقْتٍ','نَعَمْ، فِي العِيدِ فَقَطْ'],a:0}],note:'كل فريق يختار صندوقًا ويجيب؛ بعض الصناديق مضاعفة النقاط.'},
{stage:'close',type:'summary',title:'أُنَظِّمُ مَعَارِفِي',p:91,center:'أَصِلُ أَرْحَامِي',nodes:[{i:'🏠',t:'أَزُورُ أَهْلِي وَأَقَارِبِي',d:'وَلَا أَقْطَعُهُمْ'},{i:'🎁',t:'أَتَفَقَّدُ احْتِيَاجَاتِهِمْ',d:'وَأُحْسِنُ إِلَيْهِمْ'},{i:'🏥',t:'أَزُورُ مَرِيضَهُمْ',d:'وَأَقُولُ: عَافَاكَ اللَّهُ وَشَفَاكَ'},{i:'🤲',t:'أَدْعُو لَهُمْ',d:'بِالخَيْرِ'},{i:'🔗',t:'أَرْحَامِي',d:'أَقَارِبِي الَّذِينَ تَرْبُطُنِي بِهِمْ قَرَابَةٌ'}],note:'من «أنظم معارفي» ص ٩١: أصل أرحامي فأزورهم ولا أقطعهم، وأتفقد احتياجاتهم وأحسن إليهم، وأزور مريضهم، وأدعو لهم بالخير.'},
{stage:'close',type:'value',title:'قِيمَةُ الدَّرْسِ',i:'💞',text:'أَصِلُ أَرْحَامِي، فَأَزُورُهُمْ وَأُحْسِنُ إِلَيْهِمْ وَأَدْعُو لَهُمْ.',sub:'وَاجِبِي اليَوْمَ: أَتَّصِلُ بِأَحَدِ أَقَارِبِي وَأَسْأَلُ عَنْ حَالِهِ 📞'}
]});
