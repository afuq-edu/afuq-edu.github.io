:root{
 --bg:#f2f7fb; --ink:#26364a; --muted:#6b7d90; --card:#ffffff; --line:#dfe8f0;
 --sky:#5aa9d6; --sky-50:#e8f4fb; --mint:#5cbf95; --mint-50:#e6f6ee; --peach:#f39a6b; --rose:#e9879f; --rose-50:#fdeef2;
 --sun:#f2c14e; --lil:#9a85d9; --amber:#e8a33b;
 --r:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Baloo',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
 background:radial-gradient(600px 380px at 92% -8%, #dff0fa 0%, transparent 70%),radial-gradient(520px 360px at -6% 105%, #e7f5ee 0%, transparent 70%),radial-gradient(380px 260px at 50% 110%, #f6eefb 0%, transparent 70%)}
button{font-family:inherit}
:focus-visible{outline:3px solid #9cd0ec;outline-offset:3px}
.screen{display:none;min-height:100vh;padding:clamp(12px,2.2vw,28px)}
.screen.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--sky-50);display:grid;place-items:center;border:2px solid #cfe6f4}
.brand h1{margin:0;font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:800;line-height:1.1}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:.85rem}
.iconbtn{border:2px solid var(--line);background:#fff;border-radius:14px;min-width:46px;height:46px;padding:0 12px;cursor:pointer;color:var(--ink);font-size:1rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:22px;height:22px}
/* setup */
.setup{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h2{margin:0 0 10px;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sky-50);color:#2f7fae;font-size:.95rem;border:2px solid #cfe6f4}
.unit{margin:6px 0 4px;color:var(--muted);font-weight:700;font-size:.92rem}
.lessons{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.98rem;color:var(--ink);font-weight:600;transition:transform .15s,border-color .15s,background .15s}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--sky-50);border-color:var(--sky);color:#1f6b98}
.chip .no{color:var(--muted);font-weight:700;margin-left:4px}
.periods{display:flex;flex-direction:column;gap:8px}
.periods .chip{border-radius:14px;text-align:right;line-height:1.5}
.groups-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.stepper button{border:0;background:#fff;width:42px;height:40px;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.stepper output{min-width:44px;text-align:center;font-size:1.3rem;font-weight:800}
.gname{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gname .dot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.gname input{flex:1;font:inherit;font-size:1.05rem;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#fff;color:var(--ink);min-width:0}
.qcount{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qcount input[type=range]{flex:1;min-width:160px;-webkit-appearance:none;appearance:none;height:10px;border-radius:99px;background:#e3ecf3;outline-offset:6px}
.qcount input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--sky);border:4px solid #fff;box-shadow:0 1px 4px rgba(38,54,74,.25);cursor:pointer}
.qcount input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--sky);border:4px solid #fff;box-shadow:0 1px 4px rgba(38,54,74,.25);cursor:pointer}
.qcount output{font-size:1.6rem;font-weight:800;min-width:42px;text-align:center;color:#2f7fae}
.quick{display:flex;gap:6px}
.quick .chip{padding:4px 14px}
.start{margin-top:16px;width:100%;border:0;border-radius:18px;background:var(--mint);color:#fff;font-size:1.45rem;font-weight:800;padding:14px;cursor:pointer;box-shadow:0 6px 0 #45a47d;transition:transform .12s, box-shadow .12s}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #45a47d}
.start:disabled{background:#b9cfc5;box-shadow:0 6px 0 #a3b8ae;cursor:not-allowed}
.hint{color:var(--muted);font-size:.9rem;margin-top:6px}
/* question */
.qtop{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.progress{height:10px;background:#e3ecf3;border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),#7cc4ea);border-radius:99px;transition:width .5s ease}
.qmeta{font-weight:700;color:var(--muted)}
.turns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.turn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px 5px 8px;cursor:pointer;font-weight:700;font-size:1rem;color:var(--ink);transition:all .2s}
.turn .dot{width:22px;height:22px;border-radius:50%}
.turn .pts{color:var(--muted);font-weight:600;font-size:.9rem}
.turn.now{border-color:var(--gc);box-shadow:0 0 0 4px color-mix(in srgb, var(--gc) 25%, transparent);transform:scale(1.04)}
.stage{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.timerbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{position:relative;width:clamp(120px,15vw,170px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:#e5edf4;stroke-width:12}
.ring .fg{fill:none;stroke:var(--sky);stroke-width:12;stroke-linecap:round;transition:stroke .4s}
.ring.over .fg{stroke:var(--amber)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:clamp(2.2rem,4vw,3.2rem);line-height:1}
.ring .num small{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-top:4px}
.ring.over .num{color:#b7791f}
.avail{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 14px;text-align:center;font-weight:700;color:var(--muted);font-size:.9rem}
.avail b{display:block;font-size:1.5rem;color:var(--ink)}
.qcard{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:clamp(14px,2vw,24px)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:700}
.b-type{background:var(--sky-50);color:#2f7fae}
.b-l1{background:var(--mint-50);color:#2f8a63}
.b-l2{background:#fff5df;color:#a77a12}
.b-l3{background:var(--rose-50);color:#b8506b}
.qtext{font-size:clamp(1.45rem,2.9vw,2.35rem);font-weight:700;line-height:1.55;margin:0 0 16px}
.blank{display:inline-block;min-width:4.5em;border-bottom:4px dashed #b9cfdf;margin:0 .25em;text-align:center;color:transparent;transition:color .25s}
.blank.filled{color:var(--ink);border-bottom-style:solid}
.blank.filled.ok{border-color:var(--mint)}
.blank.filled.no{border-color:var(--rose)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.fill{display:flex;flex-wrap:wrap;justify-content:center}
.opt{position:relative;border:3px solid var(--line);background:#fff;border-radius:18px;padding:14px 18px 14px 56px;text-align:right;font-size:clamp(1.15rem,2.1vw,1.6rem);font-weight:700;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .2s,background .2s;min-height:68px}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#b9d6ea}
.opt .k{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:1rem;background:var(--sky-50);color:#2f7fae}
.opts.fill .opt{padding:10px 22px;border-radius:999px;min-height:auto}
.opts.fill .opt .k{display:none}
.opts.tf .opt{text-align:center;padding:18px;font-size:clamp(1.4rem,2.6vw,2rem);display:flex;align-items:center;justify-content:center;gap:12px}
.opts.tf .opt .k{display:none}
.opts.tf .opt .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.5rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--mint);background:var(--mint-50)}
.opt.wrong{border-color:var(--rose);background:var(--rose-50)}
.opt.dim{opacity:.45}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:11px 22px;font-size:1.15rem;font-weight:800;cursor:pointer;transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.main{background:var(--sky);color:#fff;box-shadow:0 5px 0 #3f8bb6}
.btn.soft{background:#fff;border:2px solid var(--line);color:var(--muted)}
.btn.green{background:var(--mint);color:#fff;box-shadow:0 5px 0 #45a47d}
.feedback{min-height:50px;font-size:clamp(1.15rem,2vw,1.5rem);font-weight:800;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(6px);transition:all .3s}
.feedback.show{opacity:1;transform:none}
.feedback.ok{color:#2f8a63}
.feedback.no{color:#b8506b}
.feedback .plus{background:var(--mint-50);border-radius:12px;padding:2px 12px}
/* scoreboard */
.board{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:18px}
.board h2{margin:0 0 4px;font-size:clamp(1.4rem,2.6vw,2rem)}
.board .sub{color:var(--muted);font-weight:600;margin-bottom:10px}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px);height:min(52vh,420px);padding:30px 10px 0;border-bottom:3px solid #e3ecf3}
.bar{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar .col{width:100%;border-radius:16px 16px 6px 6px;height:4%;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative;box-shadow:inset 0 -8px 0 rgba(0,0,0,.06)}
.bar .val{font-weight:800;font-size:clamp(1rem,1.8vw,1.35rem);margin-bottom:6px}
.bar .rank{position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-weight:800;font-size:.9rem}
.bar .gain{position:absolute;top:-34px;background:var(--mint-50);color:#2f8a63;border-radius:10px;padding:0 10px;font-weight:800;opacity:0;transition:opacity .4s .9s}
.bar.win .gain{opacity:1}
.bar.win .col{animation:glow 1.6s ease-in-out .9s 2}
@keyframes glow{50%{filter:brightness(1.08) saturate(1.15)}}
.names{display:flex;justify-content:center;gap:clamp(10px,3vw,40px);padding:8px 10px 0}
.names div{flex:1;max-width:150px;text-align:center;font-weight:800;font-size:clamp(.95rem,1.7vw,1.2rem)}
/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2.5vw,28px);margin:20px auto 10px;max-width:760px}
.pod{flex:1;text-align:center}
.pod .who{font-weight:800;font-size:clamp(1.1rem,2.2vw,1.6rem);margin-bottom:4px}
.pod .score{color:var(--muted);font-weight:700;margin-bottom:6px}
.pod .block{border-radius:18px 18px 8px 8px;display:grid;place-items:center;font-size:clamp(2rem,4vw,3rem);font-weight:800;color:#fff;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.pod.p1 .block{height:clamp(150px,26vh,230px);animation-delay:.6s}
.pod.p2 .block{height:clamp(110px,19vh,170px);animation-delay:.3s}
.pod.p3 .block{height:clamp(80px,14vh,125px)}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.crown{font-size:2rem;line-height:1}
.ranklist{max-width:560px;margin:14px auto 0;display:flex;flex-direction:column;gap:6px}
.ranklist div{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (max-width:860px){.setup{grid-template-columns:1fr}.stage{grid-template-columns:1fr}.timerbox{flex-direction:row;justify-content:center}.opts{grid-template-columns:1fr}.opts.tf{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<canvas id="confetti"></canvas>

<!-- شاشة الإعداد -->
<section class="screen on" id="sSetup"><div class="wrap">
 <div class="topbar">
  <div class="brand"><div class="logo" aria-hidden="true">
   <svg viewBox="0 0 40 40" width="30" height="30"><rect x="6" y="8" width="28" height="18" rx="3" fill="#5aa9d6"/><rect x="9" y="11" width="22" height="12" rx="1.5" fill="#e8f4fb"/><rect x="16" y="27" width="8" height="3" fill="#9ab"/><rect x="11" y="30" width="18" height="3" rx="1.5" fill="#5cbf95"/><circle cx="15" cy="17" r="2" fill="#f39a6b"/><circle cx="20" cy="17" r="2" fill="#f2c14e"/><circle cx="25" cy="17" r="2" fill="#9a85d9"/></svg>
  </div><div><h1>مسابقات كاهوت</h1><small>تقنية المعلومات | الصف الثاني | الفصل الدراسي الأول</small></div></div>

 </div>
 <div class="setup">

   <h2><span class="step">1</span>اختر الدرس</h2>

   <h2 style="margin-top:16px"><span class="step">2</span>عنوان الحصة</h2>
   <div class="periods" id="periodList"></div>
  </div>
  <div>
   <div class="panel">
    <div class="groups-head"><h2 style="margin:0"><span class="step">3</span>المجموعات</h2>
     <div class="stepper"><button type="button" id="gMinus" aria-label="إنقاص">−</button><output id="gCount">4</output><button type="button" id="gPlus" aria-label="زيادة">+</button></div></div>
    <div id="groupNames"></div>
   </div>
   <div class="panel" style="margin-top:16px">
    <h2><span class="step">4</span>عدد الأسئلة</h2>
    <div class="qcount"><input type="range" id="qRange" min="1" max="20" value="10" aria-label="عدد الأسئلة"><output id="qOut">10</output></div>
    <div class="quick" id="quick"></div>
    <div class="hint">تُرتَّب الأسئلة من الأسهل إلى الأصعب، وتجيب مجموعة واحدة عن كل سؤال بالتناوب.</div>
   </div>
   <button class="start" id="startBtn" type="button">ابدأ المسابقة</button>
  </div>
 </div>
</div></section>

<!-- شاشة السؤال -->
<section class="screen" id="sQuestion"><div class="wrap">
 <div class="qtop">
  <div><div class="qmeta" id="qMeta"></div><div class="progress"><i id="qBar" style="width:0"></i></div></div>
  <div style="display:flex;gap:8px"><button class="iconbtn mute" type="button" aria-label="كتم الصوت"></button><button class="iconbtn" type="button" id="exitBtn" aria-label="إنهاء المسابقة">إنهاء</button></div>
 </div>
 <div class="turns" id="turns" aria-label="دور المجموعة"></div>
 <div class="stage">
  <div class="timerbox">
   <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg><div class="num" id="tNum">30</div></div>
   <div class="avail">النقاط المتاحة<b id="availPts">1000</b></div>
  </div>
  <div class="qcard">
   <div class="badges" id="badges"></div>
   <p class="qtext" id="qText"></p>
   <div class="opts" id="opts"></div>
   <div class="actions">
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div style="display:flex;gap:8px"><button class="btn soft" id="skipBtn" type="button">لا إجابة</button><button class="btn main" id="toBoard" type="button" hidden>عرض النتائج</button></div>
   </div>
  </div>
 </div>
</div></section>

<!-- شاشة النتائج بعد كل سؤال -->
<section class="screen" id="sBoard"><div class="wrap">
 <div class="board">
  <div class="topbar" style="margin:0"><div><h2>ترتيب المجموعات</h2><div class="sub" id="boardSub"></div></div><button class="iconbtn mute" type="button" aria-label="كتم الصوت"></button></div>
  <div class="chart" id="chart"></div>
  <div class="names" id="names"></div>
  <div class="actions" style="justify-content:flex-end"><button class="btn main" id="nextBtn" type="button">السؤال التالي</button></div>
 </div>
</div></section>

<!-- شاشة التتويج -->
<section class="screen" id="sFinal"><div class="wrap">
 <div class="board" style="text-align:center">
  <h2>منصة التتويج</h2><div class="sub" id="finalSub"></div>
  <div class="podium" id="podium"></div>
  <div class="ranklist" id="rankList"></div>
  <div class="actions" style="justify-content:center;margin-top:18px"><button class="btn green" id="againBtn" type="button">إعادة الدرس نفسه</button><button class="btn soft" id="newBtn" type="button">مسابقة جديدة</button></div>
 </div>
</div></section>

const COLORS = ['#6fb7e9','#f7a072','#76c9a0','#ae96ea','#f08eac','#efbd4a'];
const DEF_NAMES = ['النجوم','الصقور','الأقمار','الأمواج','النخيل','اللؤلؤ'];
const TYPE_LABEL = {mcq:'اختيار من متعدد', tf:'صواب أم خطأ', fill:'أكمل الفراغ'};
const LEVEL_LABEL = {1:'سهل', 2:'متوسط', 3:'متقدم'};
const BASE = 30, MAXP = 1000, MIDP = 500, MINP = 100, DECAY = 20;
const $ = s => document.querySelector(s);
const state = {lesson:0, period:1, gCount:4, names:DEF_NAMES.slice(), qN:10, groups:[], qs:[], qi:0, turn:0, t0:0, raf:0, answered:false, lastGain:null, muted:false};

/* ───── الصوت (Web Audio) ───── */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, start, dur, type='sine', vol=.12){
  const c = ac(); if(!c || state.muted) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const SND = {
  ok(){ [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.09,.35,'sine',.11)); tone(1046.5,.27,.5,'sine',.07); },
  no(){ tone(330,0,.28,'triangle',.09); tone(262,.16,.4,'triangle',.08); },
  tick(){ tone(880,0,.06,'sine',.04); },
  board(){ [392,494,587].forEach((f,i)=>tone(f,i*.12,.3,'sine',.07)); },
  win(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.13,.45,'sine',.1)); [523.25,659.25,783.99].forEach(f=>tone(f,.6,1.2,'sine',.05)); },
  tap(){ tone(660,0,.05,'sine',.04); }
};
function muteIcon(){ return state.muted
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>'; }
function syncMute(){ document.querySelectorAll('.mute').forEach(b=>{ b.innerHTML = muteIcon(); b.setAttribute('aria-label', state.muted?'تشغيل الصوت':'كتم الصوت'); }); }
document.querySelectorAll('.mute').forEach(b=> b.onclick = ()=>{ state.muted = !state.muted; syncMute(); if(!state.muted){ ac(); SND.tap(); } });

/* ───── شاشات ───── */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); }

/* ───── الإعداد ───── */
function renderLessons(){
  const box = $('#lessonList'); box.innerHTML = ''; let cur = '', wrap = null;
  DATA.forEach((L,i)=>{
    if(L.unit!==cur){ cur = L.unit; const u = document.createElement('div'); u.className='unit'; u.textContent = L.unit; box.appendChild(u); wrap = document.createElement('div'); wrap.className='lessons'; box.appendChild(wrap); }
    const b = document.createElement('button'); b.type='button'; b.className='chip'; b.setAttribute('aria-pressed', i===state.lesson);
    b.innerHTML = '<span class="no"></span><span class="tt"></span>'; b.querySelector('.no').textContent = L.n + '.'; b.querySelector('.tt').textContent = L.title;
    b.onclick = ()=>{ state.lesson = i; state.period = DATA[i].periods[0].i; SND.tap(); renderLessons(); renderPeriods(); };
    wrap.appendChild(b);
  });
}
function renderPeriods(){
  const box = $('#periodList'); box.innerHTML = '';
  DATA[state.lesson].periods.forEach(P=>{
    const b = document.createElement('button'); b.type='button'; b.className='chip'; b.setAttribute('aria-pressed', P.i===state.period);
    b.textContent = P.label; b.onclick = ()=>{ state.period = P.i; renderPeriods(); }; box.appendChild(b);
  });
}
function renderGroups(){
  $('#gCount').textContent = state.gCount;
  const box = $('#groupNames'); box.innerHTML = '';
  for(let i=0;i<state.gCount;i++){
    const r = document.createElement('div'); r.className='gname';
    r.innerHTML = '<span class="dot"></span><input type="text" maxlength="18">';
    r.querySelector('.dot').style.background = COLORS[i];
    const inp = r.querySelector('input'); inp.value = state.names[i]; inp.setAttribute('aria-label','اسم المجموعة ' + (i+1));
    inp.oninput = ()=> state.names[i] = inp.value;
    box.appendChild(r);
  }
}
$('#gMinus').onclick = ()=>{ if(state.gCount>2){ state.gCount--; renderGroups(); SND.tap(); } };
$('#gPlus').onclick = ()=>{ if(state.gCount<6){ state.gCount++; renderGroups(); SND.tap(); } };
function setQN(n){ state.qN = Math.max(1, Math.min(20, n)); $('#qRange').value = state.qN; $('#qOut').textContent = state.qN;
  document.querySelectorAll('#quick .chip').forEach(c=>c.setAttribute('aria-pressed', +c.dataset.n===state.qN)); }
$('#qRange').oninput = e => setQN(+e.target.value);
[5,10,15,20].forEach(n=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.n=n; b.textContent=n; b.onclick=()=>{ setQN(n); SND.tap(); }; $('#quick').appendChild(b); });

/* ───── اختيار الأسئلة: الحصة المختارة أولًا ثم بقية حصص الدرس، من الأسهل إلى الأصعب ───── */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickBalanced(pool, n){
  if(n>=pool.length) return pool.slice();
  const by = {1:[],2:[],3:[]}; pool.forEach(q=>by[q.l].push(q));
  const want = {}; let tot = 0;
  [1,2,3].forEach(l=>{ want[l] = Math.floor(n*by[l].length/pool.length); tot += want[l]; });
  const order = [1,2,3].sort((a,b)=> (n*by[b].length/pool.length - want[b]) - (n*by[a].length/pool.length - want[a]));
  let k=0; while(tot<n){ const l = order[k%3]; if(want[l]<by[l].length){ want[l]++; tot++; } k++; }
  let out = []; [1,2,3].forEach(l=> out = out.concat(shuffle(by[l].slice()).slice(0,want[l])) );
  return out;
}
function buildQuestions(){
  const L = DATA[state.lesson], n = state.qN;
  const own = L.q.filter(q=>q.p===state.period), rest = L.q.filter(q=>q.p!==state.period);
  let chosen = pickBalanced(own, n);
  if(chosen.length<n) chosen = chosen.concat(pickBalanced(rest, n-chosen.length));
  chosen.sort((a,b)=>a.l-b.l);
  return chosen.map(q=>{
    const c = Object.assign({}, q);
    if(q.t==='tf'){ c.opts = ['صواب','خطأ']; c.ans = q.a ? 0 : 1; }
    else { const idx = shuffle(q.o.map((_,i)=>i)); c.opts = idx.map(i=>q.o[i]); c.ans = idx.indexOf(0); }
    return c;
  });
}

$('#startBtn').onclick = ()=>{
  ac();
  state.groups = Array.from({length:state.gCount},(_,i)=>({name:(state.names[i]||'').trim()||DEF_NAMES[i], color:COLORS[i], score:0}));
  state.qs = buildQuestions(); state.qi = 0; state.turn = 0;
  SND.tap(); startQuestion();
};

/* ───── السؤال ───── */
const C = 2*Math.PI*52;
function pointsAt(t){ return t<=BASE ? Math.round(MAXP - (MAXP-MIDP)*t/BASE) : Math.max(MINP, Math.round(MIDP - DECAY*(t-BASE))); }
function renderTurns(){
  const box = $('#turns'); box.innerHTML='';
  state.groups.forEach((g,i)=>{
    const b = document.createElement('button'); b.type='button'; b.className = 'turn' + (i===state.turn?' now':'');
    b.style.setProperty('--gc', g.color);
    b.innerHTML = '<span class="dot"></span><span class="nm"></span><span class="pts"></span>';
    b.querySelector('.dot').style.background = g.color; b.querySelector('.nm').textContent = g.name; b.querySelector('.pts').textContent = g.score;
    b.setAttribute('aria-label', 'دور مجموعة ' + g.name);
    b.onclick = ()=>{ if(!state.answered){ state.turn = i; renderTurns(); SND.tap(); } };
    box.appendChild(b);
  });
}
function startQuestion(){
  const q = state.qs[state.qi], L = DATA[state.lesson];
  state.answered = false; state.lastGain = null;
  show('#sQuestion');
  $('#qMeta').textContent = 'الدرس ' + L.n + ': ' + L.title + ' | السؤال ' + (state.qi+1) + ' من ' + state.qs.length;
  $('#qBar').style.width = (state.qi/state.qs.length*100) + '%';
  renderTurns();
  $('#badges').innerHTML = '';
  [['b-type',TYPE_LABEL[q.t]],['b-l'+q.l,LEVEL_LABEL[q.l]]].forEach(([c,t])=>{ const s=document.createElement('span'); s.className='badge '+c; s.textContent=t; $('#badges').appendChild(s); });
  const qt = $('#qText'); qt.innerHTML = '';
  if(q.t==='fill'){ const parts = q.q.split('____'); qt.append(parts[0]); const bl=document.createElement('span'); bl.className='blank'; bl.id='blank'; bl.textContent='؟'; qt.append(bl); qt.append(parts[1]||''); }
  else qt.textContent = q.q;
  const box = $('#opts'); box.className = 'opts ' + q.t; box.innerHTML = '';
  q.opts.forEach((o,i)=>{
    const b = document.createElement('button'); b.type='button'; b.className='opt';
    if(q.t==='tf'){ b.innerHTML = '<span class="ic"></span><span class="tx"></span>'; b.querySelector('.ic').textContent = i===0?'✓':'✗'; b.querySelector('.ic').style.background = i===0?'var(--mint)':'var(--rose)'; b.querySelector('.tx').textContent = o; }
    else { b.innerHTML = '<span class="k"></span><span class="tx"></span>'; b.querySelector('.k').textContent = i+1; b.querySelector('.tx').textContent = o; }
    b.onclick = ()=> answer(i);
    box.appendChild(b);
  });
  const fb = $('#feedback'); fb.className='feedback'; fb.textContent='';
  $('#toBoard').hidden = true; $('#skipBtn').hidden = false;
  $('#ring').classList.remove('over');
  state.t0 = performance.now(); state.lastTick = -1;
  cancelAnimationFrame(state.raf); tick();
}
function tick(){
  const t = (performance.now()-state.t0)/1000;
  const fg = $('#ringFg'); fg.style.strokeDasharray = C;
  const ring = $('#ring'), num = $('#tNum');
  if(t<=BASE){ fg.style.strokeDashoffset = C*(t/BASE); const left = Math.ceil(BASE-t); num.innerHTML = '<span><span dir="ltr">' + left + '</span><small>ثانية</small></span>';
    if(left<=5 && left!==state.lastTick && left>0){ state.lastTick = left; SND.tick(); } }
  else { ring.classList.add('over'); fg.style.strokeDashoffset = 0; num.innerHTML = '<span><span dir="ltr">+' + Math.floor(t-BASE) + '</span><small>وقت إضافي</small></span>'; }
  $('#availPts').textContent = pointsAt(t);
  if(!state.answered) state.raf = requestAnimationFrame(tick);
}
function answer(i){
  if(state.answered) return;
  state.answered = true; cancelAnimationFrame(state.raf);
  const t = (performance.now()-state.t0)/1000, q = state.qs[state.qi], g = state.groups[state.turn];
  const ok = i===q.ans, pts = ok ? pointsAt(t) : 0;
  g.score += pts; state.lastGain = {g:state.turn, pts};
  const btns = [...document.querySelectorAll('#opts .opt')];
  btns.forEach((b,k)=>{ b.disabled = true; if(k===q.ans) b.classList.add('right'); else if(k===i) b.classList.add('wrong'); else b.classList.add('dim'); });
  if(q.t==='fill'){ const bl=$('#blank'); bl.textContent = q.opts[i>=0?i:q.ans]; bl.classList.add('filled', (ok||i<0)?'ok':'no'); if(!ok && i>=0){ setTimeout(()=>{ bl.textContent = q.opts[q.ans]; bl.classList.remove('no'); bl.classList.add('ok'); }, 1100); } }
  const fb = $('#feedback'); fb.innerHTML = '';
  if(ok){ fb.className='feedback ok show'; fb.append('إجابة صحيحة لمجموعة ' + g.name + ' '); const s=document.createElement('span'); s.className='plus'; s.dir='ltr'; s.textContent='+'+pts; fb.append(s); SND.ok(); }
  else { fb.className='feedback no show'; fb.textContent = (i<0?'لا إجابة. ':'إجابة غير صحيحة. ') + 'الصحيح: ' + q.opts[q.ans]; SND.no(); }
  renderTurns();
  $('#skipBtn').hidden = true; $('#toBoard').hidden = false; $('#toBoard').focus();
}
$('#skipBtn').onclick = ()=> answer(-1);
$('#toBoard').onclick = showBoard;
$('#exitBtn').onclick = ()=>{ if(confirm('إنهاء المسابقة وعرض منصة التتويج؟')){ cancelAnimationFrame(state.raf); showFinal(); } };

/* ───── المخطط ───── */
function ranks(){ const s = state.groups.map(g=>g.score); return s.map(v=> 1 + s.filter(x=>x>v).length); }
function showBoard(){
  show('#sBoard');
  const last = state.qi === state.qs.length-1;
  $('#boardSub').textContent = 'بعد السؤال ' + (state.qi+1) + ' من ' + state.qs.length;
  $('#nextBtn').textContent = last ? 'منصة التتويج' : 'السؤال التالي';
  const chart = $('#chart'), names = $('#names'); chart.innerHTML=''; names.innerHTML='';
  const max = Math.max(1000, ...state.groups.map(g=>g.score)), R = ranks();
  state.groups.forEach((g,i)=>{
    const bar = document.createElement('div'); bar.className='bar' + (state.lastGain && state.lastGain.g===i && state.lastGain.pts>0 ? ' win':'');
    bar.innerHTML = '<span class="gain"></span><span class="val">0</span><div class="col"><span class="rank"></span></div>';
    bar.querySelector('.col').style.background = g.color;
    bar.querySelector('.rank').textContent = R[i]===1 ? 'الأول' : (R[i]===2 ? 'الثاني' : (R[i]===3 ? 'الثالث' : R[i]));
    if(state.lastGain && state.lastGain.g===i) { const gEl = bar.querySelector('.gain'); gEl.dir='ltr'; gEl.textContent = '+' + state.lastGain.pts; }
    chart.appendChild(bar);
    const nm = document.createElement('div'); nm.textContent = g.name; nm.style.color = 'var(--ink)'; names.appendChild(nm);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.querySelector('.col').style.height = Math.max(4, g.score/max*86) + '%'; }));
    countUp(bar.querySelector('.val'), g.score);
  });
  SND.board();
  $('#nextBtn').focus();
}
function countUp(el, to){ const t0 = performance.now(), d = 1000; function f(n){ const k = Math.min(1,(n-t0)/d); el.textContent = Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); } requestAnimationFrame(f); }
$('#nextBtn').onclick = ()=>{
  if(state.qi >= state.qs.length-1){ showFinal(); return; }
  state.qi++; state.turn = (state.turn+1) % state.groups.length; startQuestion();
};

/* ───── التتويج ───── */
function showFinal(){
  show('#sFinal');
  const L = DATA[state.lesson];
  $('#finalSub').textContent = 'الدرس ' + L.n + ': ' + L.title;
  const sorted = state.groups.map((g,i)=>({...g,i})).sort((a,b)=>b.score-a.score);
  const R = sorted.map(g=> 1 + sorted.filter(x=>x.score>g.score).length);
  const pod = $('#podium'); pod.innerHTML='';
  [1,0,2].forEach(k=>{
    if(!sorted[k]) return; const g = sorted[k];
    const d = document.createElement('div'); d.className = 'pod p' + (k+1);
    d.innerHTML = (k===0?'<div class="crown" aria-hidden="true"><svg viewBox="0 0 48 32" width="54" height="36"><path d="M4 28 L8 8 L18 18 L24 4 L30 18 L40 8 L44 28 Z" fill="#f2c14e" stroke="#d9a62e" stroke-width="2" stroke-linejoin="round"/><circle cx="8" cy="8" r="3" fill="#f39a6b"/><circle cx="24" cy="4" r="3" fill="#9a85d9"/><circle cx="40" cy="8" r="3" fill="#5cbf95"/></svg></div>':'') + '<div class="who"></div><div class="score"></div><div class="block"></div>';
    d.querySelector('.who').textContent = g.name; d.querySelector('.score').textContent = g.score + ' نقطة';
    d.querySelector('.block').textContent = R[k]; d.querySelector('.block').style.background = g.color;
    pod.appendChild(d);
  });
  const rl = $('#rankList'); rl.innerHTML='';
  sorted.forEach((g,k)=>{ const r=document.createElement('div'); const a=document.createElement('span'); a.textContent = R[k] + '. ' + g.name; a.style.color=g.color==='#efbd4a'?'#a77a12':'var(--ink)'; const b=document.createElement('span'); b.textContent = g.score + ' نقطة'; r.append(a,b); rl.appendChild(r); });
  SND.win(); confetti();
}
$('#againBtn').onclick = ()=>{ state.groups.forEach(g=>g.score=0); state.qs = buildQuestions(); state.qi=0; state.turn=0; startQuestion(); };
$('#newBtn').onclick = ()=>{ show('#sSetup'); };

/* ───── احتفال هادئ ───── */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), cx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#9fd3f0','#ffc9a8','#a9e2c6','#d2c3f5','#f7c2d2','#f7dd92'];
  const P = Array.from({length:90},()=>({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.6, r:4+Math.random()*5, vy:.8+Math.random()*1.4, vx:-.5+Math.random(), a:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function draw(n){ cx.clearRect(0,0,cv.width,cv.height); const life = (n-t0)/1000;
    P.forEach(p=>{ p.y+=p.vy; p.x+=p.vx+Math.sin(p.a+life)*.4; p.a+=.03; cx.globalAlpha = Math.max(0, 1 - Math.max(0,life-4)/1.5); cx.fillStyle=p.c; cx.beginPath(); cx.ellipse(p.x,p.y,p.r,p.r*.6,p.a,0,Math.PI*2); cx.fill(); });
    if(life<5.5) requestAnimationFrame(draw); else cx.clearRect(0,0,cv.width,cv.height); })(t0);
}

/* ───── لوحة المفاتيح ───── */
document.addEventListener('keydown', e=>{
  if($('#sQuestion').classList.contains('on') && !state.answered){
    const n = parseInt(e.key,10); const btns = document.querySelectorAll('#opts .opt');
    if(n>=1 && n<=btns.length){ answer(n-1); }
  }
});

renderLessons(); renderPeriods(); renderGroups(); setQN(10); syncMute();
</script>
