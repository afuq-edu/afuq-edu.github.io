<title>مسابقات كاهوت – الدراسات الاجتماعية – الصف الخامس</title>
<style>
@font-face{font-family:'Tajawal';font-weight:400;font-style:normal;src:url(/assets/f/a709df4f255dc29e.woff) format('woff');}
@font-face{font-family:'Tajawal';font-weight:500;font-style:normal;src:url(/assets/f/18a097ac9312a736.woff) format('woff');}
@font-face{font-family:'Tajawal';font-weight:700;font-style:normal;src:url(/assets/f/08380a2e6841fd41.woff) format('woff');}

:root{--ink:#26343f;--soft:#5d727a;--teal:#2d6f74;--teal2:#7fb4b8;--sea:#eaf4f4;--sand:#f7f1e3;--sandink:#6b5a2e;--line:#d8e6e7;--ok:#4f9a6a;--okbg:#e5f3e8;--no:#c46a6a;--nobg:#f8e7e7;--amber:#d99a45;--paper:#f9fcfc}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:var(--paper);
 background-image:radial-gradient(circle at 15% 10%,rgba(127,180,184,.16),transparent 40%),radial-gradient(circle at 90% 90%,rgba(227,169,107,.12),transparent 45%);
 line-height:1.55;font-size:clamp(15px,1.15vw + 8px,22px);overflow-x:hidden;background-attachment:fixed}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #f0c36a;outline-offset:2px}
.screen{display:none;min-height:100vh;padding:clamp(12px,2.2vw,32px)}
.screen.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- setup */
.hero{max-width:1100px;margin:0 auto 18px;display:flex;align-items:center;gap:18px}
.compass{width:clamp(56px,6vw,84px);height:clamp(56px,6vw,84px);flex:0 0 auto}
.hero h1{margin:0;font-size:clamp(1.6rem,2.6vw,2.6rem);font-weight:800;color:var(--teal);letter-spacing:0}
.hero p{margin:2px 0 0;color:var(--soft)}
.setup{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.step h2{margin:0 0 10px;font-size:1.05em;font-weight:800;color:var(--teal);display:flex;align-items:center;gap:9px}
.step h2 .n{width:1.7em;height:1.7em;border-radius:50%;background:var(--sea);display:inline-flex;align-items:center;justify-content:center;font-size:.85em}
.step.off{opacity:.45;pointer-events:none}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.lbtn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:right;transition:border-color .2s,background .2s}
.lbtn small{display:block;color:var(--soft);font-size:.78em}
.lbtn b{font-weight:700}
.lbtn[aria-pressed="true"]{border-color:var(--teal2);background:var(--sea)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{border-color:var(--teal2);background:var(--sea);color:var(--teal);font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:#fff;width:2.4em;height:2.2em;font-size:1.1em;font-weight:800;color:var(--teal)}
.stepper span{min-width:2.2em;text-align:center;font-weight:800;font-size:1.2em}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px;width:100%}
.names label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:4px 10px;background:#fff}
.names .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
.names input{border:0;font:inherit;width:100%;padding:4px 0;background:transparent;color:var(--ink)}
input[type=range]{accent-color:var(--teal2);width:min(320px,70vw)}
.qn{font-weight:800;font-size:1.3em;color:var(--teal);min-width:2em;display:inline-block;text-align:center}
.start{justify-self:center;border:0;background:var(--teal2);color:#fff;font-weight:800;font-size:1.25em;padding:12px 46px;border-radius:14px;box-shadow:0 6px 18px rgba(45,111,116,.18);transition:transform .15s}
.start:disabled{background:#b9cfd1;box-shadow:none;cursor:not-allowed}
.start:not(:disabled):hover{transform:translateY(-2px)}
.hint{color:var(--soft);font-size:.85em;margin:6px 0 0}
/* ---------- game */
.bar{max-width:1250px;margin:0 auto 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .meta{flex:1;min-width:200px;color:var(--soft);font-size:.85em}
.bar .meta b{color:var(--ink)}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:700}
.icon{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:5px 12px}
.progress{max-width:1250px;margin:0 auto 14px;height:6px;background:#e5eeef;border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal2);width:0;transition:width .5s}
.stage{max-width:1250px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) clamp(170px,17vw,250px);gap:16px;align-items:start}
.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2vw,28px)}
.turn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.turn .who{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 16px;font-weight:800;background:var(--sea)}
.turn .who i{width:.9em;height:.9em;border-radius:50%;display:inline-block}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:700}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:8px;color:var(--soft);font-size:.8em}
.tags .t{background:var(--sand);color:var(--sandink);border-radius:8px;padding:2px 10px;font-weight:700}
.diff{display:inline-flex;gap:3px}.diff i{width:8px;height:8px;border-radius:50%;background:#d9e4e5}.diff i.on{background:var(--amber)}
.qtext{font-size:clamp(1.25em,2.1vw,1.85em);font-weight:800;margin:4px 0 16px;line-height:1.45}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px dashed var(--teal2);text-align:center;color:var(--teal);padding:0 6px;transition:all .3s}
.blank.filled{border-bottom-style:solid}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;text-align:right;font-weight:700;font-size:1.05em;display:flex;align-items:center;gap:12px;transition:transform .15s,border-color .2s,background .25s}
.opt .k{width:1.9em;height:1.9em;border-radius:10px;background:var(--sea);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:.9em}
.opt:not(:disabled):hover{border-color:var(--teal2);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt.dim{opacity:.55}
.tf .opt{justify-content:center;font-size:1.35em;padding:22px}
.chipsq{display:flex;flex-wrap:wrap;gap:10px}
.chipsq .opt{border-radius:999px;padding:10px 22px}
.order{display:grid;gap:10px}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:8px 12px;min-height:2.8em;background:#fbfdfd}
.slot .num{width:1.8em;height:1.8em;border-radius:50%;background:var(--sea);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.slot.full{border-style:solid;border-color:var(--teal2);background:#fff;font-weight:700}
.slot.right{border-color:var(--ok);background:var(--okbg)}.slot.wrong{border-color:var(--no);background:var(--nobg)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700}
.pool button:disabled{opacity:.3}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:2px solid var(--teal2);background:#fff;color:var(--teal);border-radius:12px;padding:8px 20px;font-weight:800}
.btn.main{background:var(--teal2);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.feedback{margin-top:16px;border-radius:14px;padding:12px 16px;font-weight:800;display:none;align-items:center;gap:12px;flex-wrap:wrap}
.feedback.on{display:flex;animation:fade .35s ease}
.feedback.good{background:var(--okbg);color:#2f6b40}
.feedback.bad{background:var(--nobg);color:#8a3d3d}
.feedback .gain{font-size:1.35em}
.feedback .sp{flex:1}
.side{display:grid;gap:12px;justify-items:center;position:sticky;top:12px}
.ring{position:relative;width:100%;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:#e5eeef}
.ring .fg{stroke:var(--teal2);transition:stroke .4s}
.ring.over .fg{stroke:var(--amber)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .s{font-size:2.6em;font-weight:800;color:var(--teal);line-height:1}
.ring.over .s{color:var(--amber)}
.ring .u{font-size:.75em;color:var(--soft)}
.pts{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;width:100%}
.pts small{display:block;color:var(--soft);font-size:.75em}
.pts b{font-size:1.5em;color:var(--sandink)}
.mini{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.8em}
.mini div{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
.mini i{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-left:5px}
/* ---------- board */
.board{max-width:1150px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2vw,28px)}
.board h2{margin:0;color:var(--teal);font-weight:800;font-size:1.35em}
.board .sub{color:var(--soft);margin:2px 0 10px}
.chart{height:min(52vh,430px);display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,46px);padding:46px 10px 0;border-bottom:2px solid var(--line);position:relative}
.col{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.colbar{width:100%;border-radius:14px 14px 4px 4px;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1);position:relative;min-height:6px}
.colbar .val{position:absolute;top:-1.9em;left:0;right:0;text-align:center;font-weight:800;color:var(--ink)}
.names2 .rk{display:block;width:max-content;margin:4px auto 0;background:var(--sea);border-radius:999px;padding:1px 12px;font-weight:800;font-size:.8em;color:var(--teal);white-space:nowrap}
.col.win .colbar{box-shadow:0 0 0 4px rgba(79,154,106,.25),0 8px 24px rgba(79,154,106,.25)}
.bubble{position:absolute;top:-3.9em;left:50%;transform:translateX(-50%) scale(.6);opacity:0;background:var(--okbg);color:#2f6b40;border-radius:999px;padding:2px 12px;font-weight:800;white-space:nowrap;transition:all .5s .9s}
.col.win .bubble{opacity:1;transform:translateX(-50%) scale(1)}
.names2{display:flex;justify-content:center;gap:clamp(10px,3vw,46px);padding:8px 10px 0}
.names2 div{flex:1;max-width:150px;text-align:center;font-weight:800;font-size:.95em}
.bact{display:flex;justify-content:center;gap:10px;margin-top:16px}
/* ---------- final */
.final{max-width:1100px;margin:0 auto;text-align:center}
.final h2{color:var(--teal);font-size:clamp(1.6em,3vw,2.4em);margin:6px 0 2px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);margin:26px auto 10px;height:min(48vh,380px)}
.pod{width:clamp(110px,16vw,210px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pod .nm{font-weight:800;font-size:1.1em;margin-bottom:4px}
.pod .sc{color:var(--soft);margin-bottom:6px}
.pod .blk{width:100%;border-radius:16px 16px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:2.2em;font-weight:800;color:#fff;height:0;transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.medal{width:2.4em;height:2.4em;margin-bottom:6px;opacity:0;transform:scale(.5);transition:all .6s 1.3s}
.pod.show .medal{opacity:1;transform:none}
.rest{display:inline-grid;gap:6px;margin:8px auto;min-width:min(420px,90vw)}
.rest div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
.end{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
@media (max-width:820px){.stage{grid-template-columns:1fr}.side{position:static;order:-1;grid-template-columns:96px 1fr;align-items:center}.side .mini{grid-column:1/-1}.ring{width:96px}.ring .s{font-size:2em}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>

 في سلطنة عُمان:","o":["مؤسسة عهد","منظمة الفيفا","هيئة الطيران","شركة النفط"],"a":0},{"p":2,"d":1,"t":"t","q":"العمل التطوعي عمل يقوم به الفرد دون مقابل.","a":true},{"p":2,"d":2,"t":"f","q":"فمن تطوع ........ فهو خير له.","o":["خيرًا","مالًا","عملًا","سرًا"],"a":0},{"p":2,"d":2,"t":"m","q":"تخدم مؤسسة عهد فئة:","o":["المسنين والأيتام","التجار","السياح","الرياضيين فقط"],"a":0},{"p":2,"d":3,"t":"m","q":"أشاد جلالة السلطان في إضاءته عن إعصار شاهين بأدوار:","o":["الجهات الحكومية والخاصة والأهلية","الدول الأجنبية فقط","الجهات الحكومية فقط","لا أحد"],"a":0},{"p":2,"d":3,"t":"t","q":"لا يستطيع الطلبة المشاركة في الأعمال التطوعية.","a":false},{"p":3,"d":1,"t":"m","q":"افتتح متحف عُمان عبر الزمان عام:","o":["2023م","1973م","2000م","2010م"],"a":0},{"p":3,"d":1,"t":"t","q":"الاجتهاد في طلب العلم يسهم في خدمة الوطن.","a":true},{"p":3,"d":2,"t":"f","q":"يوضح الجدول الزمني أوقات المذاكرة والراحة و........","o":["الترفيه","السهر","الإهمال","التأخير"],"a":0},{"p":3,"d":2,"t":"m","q":"من طرق الحفاظ على الأماكن التراثية:","o":["صيانتها وعدم العبث بها","الكتابة على جدرانها","هدمها","إهمالها"],"a":0},{"p":3,"d":3,"t":"m","q":"تعد المنجزات ثروة وطنية لأنها:","o":["تعبر عن ثقافة الوطن وتاريخه","قديمة فقط","غالية الثمن فقط","للسياح فقط"],"a":0},{"p":3,"d":3,"t":"t","q":"المحافظة على منجزات الوطن مسؤولية الحكومة وحدها.","a":false},{"p":4,"d":1,"t":"m","q":"يؤدي التزام الأفراد بالأنظمة والقوانين إلى:","o":["حصولهم على حقوقهم كاملة","الفوضى","ضياع الحقوق","الإهمال"],"a":0},{"p":4,"d":1,"t":"t","q":"نلتزم دائمًا بالقانون والنظام.","a":true},{"p":4,"d":2,"t":"f","q":"من مظاهر الانتماء والولاء للوطن المشاركة في الأعمال ........","o":["التطوعية","التخريبية","الفوضوية","الأنانية"],"a":0},{"p":4,"d":2,"t":"m","q":"من قوانين تنظيم سلوك الطلبة في الصف:","o":["الاستئذان قبل الحديث","الحديث في وقت واحد","رمي النفايات","التأخر الدائم"],"a":0},{"p":4,"d":3,"t":"o","q":"رتب مظاهر الانتماء والولاء كما وردت في الدرس:","o":["الدفاع عن الوطن","المشاركة في الأعمال التطوعية","الاجتهاد في طلب العلم","الاهتمام <script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const COLORS=['#7fb4b8','#e3a96b','#a59ad6','#8cc29a','#e59a9a','#d4bd5f'];
const DEFN=['الإدريسي','ابن ماجد','سمهرم','قلهات','دبا','صحار'];
const TYPE={m:'اختيار من متعدد',t:'صواب أم خطأ',f:'أكمل الفراغ',o:'رتّب'};
const S={li:null,pk:null,g:4,names:DEFN.slice(),mode:'rot',n:10,qs:[],qi:0,groups:[],cur:-1,t0:0,raf:0,running:false,answered:false,prev:[],muted:false,lastWin:-1,lastGain:0};
try{S.muted=localStorage.getItem('ss5_mute')==='1'}catch(e){}
/* ---------- audio */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,dur,type,vol,delay){if(S.muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05)}
const SND={
 click:()=>tone(660,.08,'sine',.04),
 tick:()=>tone(880,.05,'sine',.03),
 right:()=>{tone(523.25,.25,'triangle',.07);tone(659.25,.25,'triangle',.07,.11);tone(783.99,.45,'triangle',.07,.22)},
 wrong:()=>{tone(330,.28,'sine',.06);tone(247,.4,'sine',.06,.18)},
 board:()=>{[392,494,587].forEach((f,i)=>tone(f,.7,'sine',.035,i*.06))},
 final:()=>{[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.5,'triangle',.06,i*.16));tone(1046.5,1.2,'sine',.04,.7)}
};
function setMute(){$('mute').textContent=S.muted?'🔇':'🔊';$('mute').setAttribute('aria-label',S.muted?'تشغيل الصوت':'كتم الصوت');try{localStorage.setItem('ss5_mute',S.muted?'1':'0')}catch(e){}}
$('mute').onclick=()=>{S.muted=!S.muted;setMute();};setMute();
/* ---------- helpers */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pointsAt(t){let p=t<=30?1000-500*t/30:Math.max(100,500-20*(t-30));return Math.round(p/10)*10}
/* ---------- setup */
function buildLessons(){const g=$('lgrid');g.innerHTML='';D.forEach((L,i)=>{const b=el('button','lbtn');b.setAttribute('aria-pressed',S.li===i);const sm=el('small',null,L.unit);const bb=el('b',null,L.title);b.append(sm,bb);b.onclick=()=>{SND.click();S.li=i;S.pk=null;buildLessons();buildPeriods();check()};g.appendChild(b)})}
function buildPeriods(){const c=$('pchips');c.innerHTML='';if(S.li==null)return;$('st2').classList.remove('off');D[S.li].periods.forEach(p=>{const b=el('button','chip','الحصة '+p.k+': '+p.f);b.setAttribute('aria-pressed',S.pk===p.k);b.onclick=()=>{SND.click();S.pk=p.k;buildPeriods();check()};c.appendChild(b)})}
function buildNames(){$('gc').textContent=S.g;const n=$('names');n.innerHTML='';for(let i=0;i<S.g;i++){const l=el('label');const d=el('span','dot');d.style.background=COLORS[i];const inp=el('input');inp.value=S.names[i];inp.maxLength=22;inp.setAttribute('aria-label','اسم المجموعة '+(i+1));inp.oninput=()=>{S.names[i]=inp.value};l.append(d,inp);n.appendChild(l)}}
$('gm').onclick=()=>{if(S.g>2){S.g--;SND.click();buildNames()}};$('gp').onclick=()=>{if(S.g<6){S.g++;SND.click();buildNames()}};
function setMode(m){S.mode=m;$('mRot').setAttribute('aria-pressed',m==='rot');$('mPick').setAttribute('aria-pressed',m==='pick')}
$('mRot').onclick=()=>{SND.click();setMode('rot')};$('mPick').onclick=()=>{SND.click();setMode('pick')};
function buildQuick(){const q=$('quick');q.innerHTML='';[5,10,15,20].forEach(v=>{const b=el('button','chip',v+' أسئلة');if(v>10)b.textContent=v+' سؤالًا';b.setAttribute('aria-pressed',S.n===v);b.onclick=()=>{SND.click();setN(v)};q.appendChild(b)})}
function setN(v){S.n=v;$('qr').value=v;$('qv').textContent=v;buildQuick()}
$('qr').oninput=e=>setN(+e.target.value);
function check(){const ok=S.li!=null&&S.pk!=null;['st3','st4'].forEach(id=>$(id).classList.toggle('off',!ok));$('go').disabled=!ok}
/* ---------- question selection */
function pickQuestions(){const L=D[S.li];const by={};L.q.forEach(q=>{(by[q.p]=by[q.p]||[]).push(q)});
 const order=L.periods.map(p=>p.k).sort((a,b)=>(Math.abs(a-S.pk)-Math.abs(b-S.pk))||(a-b));
 let pool=[];order.forEach((k,rank)=>{shuffle(by[k]||[]).sort((a,b)=>a.d-b.d).forEach(q=>pool.push({q,rank}))});
 const chosen=pool.slice(0,Math.min(S.n,pool.length));
 chosen.sort((a,b)=>(a.q.d-b.q.d)||(a.rank-b.rank));
 return chosen.map(x=>prep(x.q))}
function prep(q){const o={...q};
 if(q.t==='m'||q.t==='f'){const idx=shuffle(q.o.map((_,i)=>i));o.opts=idx.map(i=>q.o[i]);o.ans=idx.indexOf(q.a)}
 else if(q.t==='t'){o.opts=['صواب','خطأ'];o.ans=q.a?0:1}
 else{let s;do{s=shuffle(q.o)}while(s.join('|')===q.o.join('|')&&q.o.length>1);o.pool=s;o.ans=q.o}
 return o}
$('go').onclick=()=>{ac();start()};
function start(){S.groups=[];for(let i=0;i<S.g;i++)S.groups.push({name:(S.names[i]||'').trim()||DEFN[i],color:COLORS[i],score:0});
 S.prev=S.groups.map(()=>0);S.qs=pickQuestions();S.qi=0;show('sGame');ask()}
/* ---------- game */
function meta(){const L=D[S.li];const p=L.periods.find(x=>x.k===S.pk);$('gmeta').innerHTML='';const b=el('b',null,L.title);$('gmeta').append(b,document.createTextNode(' – الحصة '+p.k+': '+p.f))}
function mini(){const m=$('mini');m.innerHTML='';S.groups.forEach(g=>{const d=el('div');const s=el('span');const i=el('i');i.style.background=g.color;s.append(i,document.createTextNode(g.name));d.append(s,el('b',null,g.score));m.appendChild(d)})}
function ask(){const q=S.qs[S.qi];S.answered=false;S.running=false;cancelAnimationFrame(S.raf);meta();mini();
 $('qcount').textContent='السؤال '+(S.qi+1)+' من '+S.qs.length;$('prog').style.width=(S.qi/S.qs.length*100)+'%';
 const tg=$('tags');tg.innerHTML='';tg.append(el('span','t',TYPE[q.t]));const df=el('span','diff');for(let i=1;i<=3;i++){const d=el('i',i<=q.d?'on':'');df.appendChild(d)}tg.append(df,el('span',null,['','سهل','متوسط','متقدم'][q.d]));
 const qt=$('qtext');qt.innerHTML='';
 if(q.t==='f'){const parts=q.q.split(/\.{3,}/);qt.append(document.createTextNode(parts[0]));const bl=el('span','blank','؟');bl.id='blank';qt.append(bl);if(parts[1])qt.append(document.createTextNode(parts[1]))}
 else qt.textContent=q.q;
 $('fb').className='feedback';$('fb').innerHTML='';resetRing();
 if(S.mode==='rot'){S.cur=S.qi%S.groups.length;renderTurn();renderAnswers(false);setTimeout(()=>{renderAnswers(true);startTimer()},450)}
 else{S.cur=-1;renderTurn();renderAnswers(false)}}
function renderTurn(){const t=$('turn');t.innerHTML='';
 if(S.cur>=0){const g=S.groups[S.cur];const w=el('span','who');const i=el('i');i.style.background=g.color;w.style.background=g.color+'33';w.append(i,document.createTextNode('دور مجموعة: '+g.name));t.appendChild(w)}
 else{const p=el('div','pick');p.append(el('span',null,'اختر المجموعة التي ستجيب:'));S.groups.forEach((g,i)=>{const b=el('button',null,g.name);b.style.borderColor=g.color;b.onclick=()=>{SND.click();S.cur=i;renderTurn();renderAnswers(true);startTimer()};p.appendChild(b)});t.appendChild(p)}}
function renderAnswers(on){const q=S.qs[S.qi];const box=$('answers');box.innerHTML='';
 if(q.t==='o'){S.seq=[];const wrap=el('div','order');const slots=el('div','slots');q.ans.forEach((_,i)=>{const s=el('div','slot');s.append(el('span','num',i+1),el('span'));slots.appendChild(s)});
  const pool=el('div','pool');q.pool.forEach(it=>{const b=el('button',null,it);b.disabled=!on;b.onclick=()=>{if(S.answered)return;SND.click();S.seq.push(it);b.disabled=true;fillSlots();$('ok').disabled=S.seq.length!==q.ans.length};pool.appendChild(b)});
  const acts=el('div','acts');const ok=el('button','btn main','تأكيد الترتيب');ok.id='ok';ok.disabled=true;ok.onclick=()=>answer(null);const rs=el('button','btn','إعادة الترتيب');rs.disabled=!on;rs.onclick=()=>{if(S.answered)return;S.seq=[];pool.querySelectorAll('button').forEach(b=>b.disabled=false);fillSlots();$('ok').disabled=true};
  const sk=el('button','btn','تخطي');sk.disabled=!on;sk.onclick=()=>answer(-1);acts.append(ok,rs,sk);wrap.append(slots,pool,acts);box.appendChild(wrap);return}
 const cls=q.t==='t'?'opts tf':(q.t==='f'?'chipsq':'opts');const g=el('div',cls);
 q.opts.forEach((o,i)=>{const b=el('button','opt');b.dataset.i=i;if(q.t!=='f'&&q.t!=='t')b.append(el('span','k',i+1));b.append(el('span',null,o));b.disabled=!on;b.onclick=()=>answer(i);g.appendChild(b)});
 box.appendChild(g);const acts=el('div','acts');const sk=el('button','btn','تخطي السؤال');sk.disabled=!on;sk.onclick=()=>answer(-1);acts.appendChild(sk);box.appendChild(acts)}
function fillSlots(){document.querySelectorAll('.slot').forEach((s,i)=>{s.lastChild.textContent=S.seq[i]||'';s.classList.toggle('full',!!S.seq[i])})}
/* ---------- timer */
const CIRC=2*Math.PI*52;
function resetRing(){const a=$('arc');a.style.strokeDasharray=CIRC;a.style.strokeDashoffset=0;$('ring').classList.remove('over');$('sec').textContent='30';$('secu').textContent='ثانية';$('avail').textContent='1000'}
function startTimer(){S.t0=performance.now();S.running=true;let lastTick=-1;
 const step=()=>{if(!S.running)return;const t=(performance.now()-S.t0)/1000;
  if(t<=30){const left=Math.ceil(30-t);$('sec').textContent=left;$('arc').style.strokeDashoffset=CIRC*(t/30);if(left<=5&&left!==lastTick&&left>0){lastTick=left;SND.tick()}}
  else{$('ring').classList.add('over');$('sec').textContent='+'+Math.floor(t-30);$('secu').textContent='وقت إضافي';$('arc').style.strokeDashoffset=CIRC*Math.min(1,(t-30)/20)}
  $('avail').textContent=pointsAt(t);S.raf=requestAnimationFrame(step)};S.raf=requestAnimationFrame(step)}
/* ---------- answer */
function answer(i){if(S.answered||S.cur<0)return;S.answered=true;S.running=false;cancelAnimationFrame(S.raf);
 const q=S.qs[S.qi];const t=(performance.now()-S.t0)/1000;let right=false;
 if(q.t==='o'){right=i!==-1&&S.seq.join('|')===q.ans.join('|');
  document.querySelectorAll('.slot').forEach((s,k)=>{if(i===-1){s.lastChild.textContent=q.ans[k];s.classList.add('full')}else s.classList.add(S.seq[k]===q.ans[k]?'right':'wrong')});
  document.querySelectorAll('.pool button,.acts button').forEach(b=>b.disabled=true)}
 else{document.querySelectorAll('#answers .opt').forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k===q.ans)b.classList.add('right');else if(k===i)b.classList.add('wrong');else b.classList.add('dim')});
  document.querySelectorAll('#answers .acts button').forEach(b=>b.disabled=true);right=i===q.ans;
  if(q.t==='f'){const bl=$('blank');bl.textContent=q.opts[q.ans];bl.classList.add('filled')}}
 const gain=right?pointsAt(t):0;S.prev=S.groups.map(g=>g.score);S.groups[S.cur].score+=gain;S.lastWin=right?S.cur:-1;S.lastGain=gain;
 const fb=$('fb');fb.innerHTML='';
 if(right){fb.className='feedback on good';const gn=el('span','gain','+'+gain);gn.dir='ltr';fb.append(el('span',null,'إجابة صحيحة لمجموعة '+S.groups[S.cur].name),gn);SND.right()}
 else{fb.className='feedback on bad';let txt=i===-1?'تم تخطي السؤال':'إجابة غير صحيحة';
  if(q.t==='o')txt+=' – الترتيب الصحيح: '+q.ans.join(' ← ');else txt+=' – الصحيح: '+q.opts[q.ans];fb.append(el('span',null,txt));SND.wrong()}
 fb.append(el('span','sp'));const b=el('button','btn main','عرض الترتيب');b.onclick=board;fb.appendChild(b);mini()}
/* ---------- board */
function ranks(){const s=[...new Set(S.groups.map(g=>g.score))].sort((a,b)=>b-a);return S.groups.map(g=>s.indexOf(g.score)+1)}
function board(){show('sBoard');SND.board();const last=S.qi===S.qs.length-1;
 $('btitle').textContent='الترتيب بعد السؤال '+(S.qi+1)+' من '+S.qs.length;
 $('bsub').textContent=S.lastWin>=0?('أحسنت مجموعة '+S.groups[S.lastWin].name+'! أضيفت '+S.lastGain+' نقطة'):'لم تُضَف نقاط في هذا السؤال';
 const ch=$('chart'),nm=$('bnames');ch.innerHTML='';nm.innerHTML='';const max=Math.max(1000,...S.groups.map(g=>g.score));const rk=ranks();
 S.groups.forEach((g,i)=>{const c=el('div','col'+(i===S.lastWin?' win':''));const bar=el('div','colbar');bar.style.background='linear-gradient(180deg,'+g.color+','+g.color+'cc)';
  const v=el('span','val',S.prev[i]);bar.appendChild(v);bar.style.height=(S.prev[i]/max*100)+'%';c.appendChild(bar);
  const bub=el('span','bubble','+'+S.lastGain);bub.dir='ltr';c.appendChild(bub);ch.appendChild(c);const n=el('div',null,g.name);n.style.borderTop='4px solid '+g.color;n.style.paddingTop='4px';n.appendChild(el('span','rk','المركز '+rk[i]));nm.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.height=Math.max(1.5,g.score/max*100)+'%';countUp(v,S.prev[i],g.score)}))});
 $('next').textContent=last?'النتيجة النهائية':'السؤال التالي';$('next').onclick=()=>{SND.click();if(last)final();else{S.qi++;show('sGame');ask()}}}
function countUp(node,a,b){const t0=performance.now(),d=1100;const f=()=>{const k=Math.min(1,(performance.now()-t0)/d);node.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
/* ---------- final */
function medal(n){const c=['#d9b44a','#b9c3c8','#d49a6a'][n-1];return '<svg class="medal" viewBox="0 0 40 40"><path d="M12 2h6l2 8-5 3zM28 2h-6l-2 8 5 3z" fill="#7fb4b8"/><circle cx="20" cy="25" r="12" fill="'+c+'"/><circle cx="20" cy="25" r="8" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/><text x="20" y="29.5" font-size="12" text-anchor="middle" fill="#fff" font-family="Tajawal" font-weight="800">'+n+'</text></svg>'}
function final(){show('sFinal');$('prog').style.width='100%';const L=D[S.li];$('fsub').textContent=L.title;
 const sorted=S.groups.map((g,i)=>({...g,i})).sort((a,b)=>b.score-a.score);const rk=[...new Set(sorted.map(g=>g.score))];
 const pod=$('podium');pod.innerHTML='';const top=sorted.slice(0,3);const order=top.length===3?[1,0,2]:(top.length===2?[1,0]:[0]);
 const hmax=[100,74,56];
 order.forEach(idx=>{const g=top[idx];const r=rk.indexOf(g.score)+1;const p=el('div','pod');p.innerHTML=medal(Math.min(r,3));p.append(el('div','nm',g.name),el('div','sc',g.score+' نقطة'));const b=el('div','blk',r);b.style.background='linear-gradient(180deg,'+g.color+','+g.color+'bb)';p.appendChild(b);pod.appendChild(p);
  setTimeout(()=>{b.style.height=hmax[idx]*0.62+'%';p.classList.add('show')},120+idx*260)});
 const rest=$('rest');rest.innerHTML='';sorted.slice(3).forEach(g=>{const d=el('div');d.append(el('span',null,'المركز '+(rk.indexOf(g.score)+1)+': '+g.name),el('b',null,g.score));rest.appendChild(d)});
 SND.final();confetti()}
$('again').onclick=()=>{SND.click();start()};$('newc').onclick=()=>{SND.click();show('sSetup')};
$('quit').onclick=()=>{if(confirm('إنهاء المسابقة وعرض النتيجة الحالية؟')){S.running=false;cancelAnimationFrame(S.raf);final()}};
/* ---------- gentle confetti */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#7fb4b8','#e3a96b','#a59ad6','#8cc29a','#e59a9a','#d4bd5f'];const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,c:cols[Math.floor(Math.random()*6)],vy:.9+Math.random()*1.4,vx:-.5+Math.random(),a:Math.random()*6,va:-.05+Math.random()*.1}));
 const t0=performance.now();const f=()=>{const el=performance.now()-t0;x.clearRect(0,0,c.width,c.height);x.globalAlpha=Math.max(0,1-Math.max(0,el-3200)/1200);
  P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((el/600)+p.a)*.4;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  if(el<4400)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)};requestAnimationFrame(f)}
/* ---------- keyboard */
document.addEventListener('keydown',e=>{if(!$('sGame').classList.contains('on'))return;const k=e.key;if(/^[1-4]$/.test(k)&&!S.answered&&S.cur>=0){const b=document.querySelector('#answers .opt[data-i="'+(+k-1)+'"]');if(b&&!b.disabled)b.click()}});
buildLessons();buildNames();buildQuick();check();
</script></body></html>
