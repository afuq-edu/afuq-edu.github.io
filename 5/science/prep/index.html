اء وحده يتبخر ويترك الملح، ثم يتكثف على الكيس ويقطر في العلبة.", "الحصة 1: مراحل دورة الماء في الطبيعة\n1. (مستوى المعرفة) صح أم خطأ: تطلق النباتات بخار الماء من أوراقها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) رتب: التكثيف، الهطول، التبخر.\n   الإجابة النموذجية: التبخر ← التكثيف ← الهطول.\n3. (مستوى الاستدلال) لماذا تُعد دورة الماء مهمة لنا؟\n   الإجابة النموذجية: لأنها تعيد الماء العذب إلى الأرض باستمرار فنحصل على ماء الشرب والزراعة.\n\nالحصة 2: أسئلة دورة الماء وورقة العمل 3-6: استخلاص الماء العذب\n1. (مستوى المعرفة) أكمل: الماء الموجود على سطح الأرض …… ويتحرك لأعلى في صورة بخار ماء.\n   الإجابة النموذجية: يتبخر.\n2. (مستوى التطبيق) أكمل: يبرد بخار الماء و…… نظرًا لارتفاعه في الهواء.\n   الإجابة النموذجية: يتكثف.\n3. (مستوى الاستدلال) لماذا نضع حجرًا صغيرًا فوق الكيس في وسطه؟\n   الإجابة النموذجية: ليتجه الكيس إلى أسفل فوق العلبة فتتجمع قطرات الماء المتكثفة وتسقط فيها.", "الحصة 1: مراحل دورة الماء في الطبيعة\nللطالب: قراءة كتاب الطالب ص54، ورسم دورة الماء في الطبيعة. لولي الأمر: مناقشة الابن في مصادر المياه في المنطقة (الأفلاج، الآبار، محطات التحلية).\n\nالحصة 2: أسئلة دورة الماء وورقة العمل 3-6: استخلاص الماء العذب\nللطالب: حل تمرين 3-6 بكتاب النشاط ص36، وإكمال ورقة العمل 3-6 ص79. لولي الأمر: تنفيذ النظام في المنزل تحت الشمس مع الابن (بإشراف) وملاحظة النتيجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=20"]}, {"code": "3-7", "title": "الغليان", "unit": 3, "dates": "الأسبوع الرابع عشر (6–10/12/2026م)", "sb": "56–57", "tb": "73–75", "ab": "تمرين 3-7 ص37، ورقة العمل 3-7 ص81", "periods": [{"n": 1, "topic": "مفهوم الغليان وقواعد السلامة", "f": ["1. يعرّف الغليان ويصف ما يحدث للسائل عند غليانه\n2. يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي\nمخرج تعليمي آخر: يحدد قواعد السلامة عند التعامل مع الماء المغلي", "المخرج 1 (يعرّف الغليان ويصف ما يحدث للسائل عند غليانه): فهم\nالمخرج 2 (يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي): تحليل\nالمخرج الآخر (يحدد قواعد السلامة عند التعامل مع الماء المغلي): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: صورة إناء يغلي", "الغليان، يغلي، البخار، درجة الغليان.", "يعرض المعلم صورة الطالبين ص56 ويقرأ حوارهما: «الهواء فوق الإناء ساخن للغاية… لقد احترقت يدي ولم ألمس الإناء!»، ويسأل: «لماذا احترقت يد خالد دون أن يلمس الإناء؟».", "1. • التهيئة: يعرض المعلم الصورة ويقرأ الحوار، والطلبة يقترحون: البخار الساخن (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الغليان: يشرح المعلم ص56: عند تسخين الماء بدرجة كافية يغلي؛ تكتسب الجزيئات طاقة كبيرة فتتحرك بسرعة وتنفصل ويتحول الماء إلى بخار. سائل + حرارة ← غاز، والطلبة يكتبون التعريف والمعادلة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • البخار والسحابة: يوضح المعلم أن البخار غاز غير مرئي، والسحابة البيضاء فوق الإناء قطرات تكثفت عند ملامسة الهواء الأبرد، والطلبة يرسمون إناءً يغلي ويحددون المنطقة غير المرئية والسحابة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • السلامة: يناقش المعلم تحذير الأمن والسلامة ص56: الماء المغلي والبخار يسببان حروقًا، والطلبة يكتبون ثلاث قواعد سلامة عند الغليان (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يقدم المعلم مفهوم درجة الغليان ويسأل عن توقعاتهم لدرجة غليان الماء، والطلبة يتوقعون أرقامًا ويكتبونها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1. (مستوى المعرفة) ماذا يحدث للماء عندما يغلي؟\n   الإجابة النموذجية: يتحول من سائل إلى غاز (بخار).\n2. (مستوى التطبيق) لماذا احترقت يد خالد دون أن يلمس الإناء؟\n   الإجابة النموذجية: لأن البخار الساخن فوق الإناء يسبب الحروق.\n3. (مستوى الاستدلال) هل السحابة البيضاء فوق الماء المغلي هي البخار؟ وضّح.\n   الإجابة النموذجية: لا؛ البخار غير مرئي، والسحابة قطرات ماء صغيرة تكثفت عندما برد البخار في الهواء.", "1. (مستوى المعرفة) صح أم خطأ: البخار غاز غير مرئي.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر قاعدتين للسلامة عند غلي الماء.\n   الإجابة النموذجية: عدم تمرير اليد فوق الإناء، وعدم لمس الإناء الساخن، والابتعاد عن البخار (أي اثنتين).\n3. (مستوى الاستدلال) ما الفرق بين الهواء فوق الماء البارد والهواء فوق الماء المغلي؟\n   الإجابة النموذجية: فوق الماء المغلي يوجد بخار ساخن جدًا يسبب الحروق، أما فوق الماء البارد فالهواء غير ساخن.", "للطالب: قراءة كتاب الطالب ص56، وكتابة قواعد السلامة في المطبخ. لولي الأمر: تعريف الابن بأماكن الخطر في المطبخ ومناقشة قواعد السلامة عند غلي الماء.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"n": 2, "topic": "نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟", "f": ["1. يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان\n2. يصف مظهر الماء المغلي والفقاعات المتكونة\nمخرج تعليمي آخر: يفسر تكون الفقاعات داخل الماء المغلي", "المخرج 1 (يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان): فهم\nالمخرج 2 (يصف مظهر الماء المغلي والفقاعات المتكونة): فهم\nالمخرج الآخر (يفسر تكون الفقاعات داخل الماء المغلي): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: دورق أو إناء، لوح تسخين أو موقد بنزن، ماء، حامل (عرض المعلم)", "الغليان، البخار، الفقاعات.", "يضع المعلم إناء الماء على لوح التسخين أمام الطلاب ويطلب منهم الجلوس على مسافة آمنة، ويسأل: «ماذا تتوقعون أن نرى؟».", "1. • التهيئة: يجهز المعلم العرض ويحدد مسافة الأمان، والطلبة يتنبؤون ويكتبون (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • عرض نشاط 3-7أ: يسخن المعلم الماء ويطلب وصف ما يحدث على مراحل، والطلبة يلاحظون فقاعات صغيرة ثم كبيرة ترتفع وتنفجر عند السطح، وتصاعد سحابة بيضاء (16 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • الوصف: يسأل المعلم: كيف يبدو الماء المغلي؟ والطلبة يصفون: فقاعات كثيرة، حركة شديدة، صوت، سحابة فوقه (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تفسير الفقاعات: يوضح المعلم أن الفقاعات تحتوي على بخار الماء الذي تكون داخل السائل، والطلبة يفسرون الفقاعات (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يذكّر المعلم: لماذا لم نمرر أيدينا فوق الإناء؟ والطلبة يجيبون: خطر الحروق من البخار (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (مستوى المعرفة) ماذا ظهر داخل الماء عند غليانه؟\n   الإجابة النموذجية: فقاعات كبيرة ترتفع وتنفجر عند السطح.\n2. (مستوى التطبيق) ما الذي يحدث للماء بعد أن ترتفع درجة حرارته كثيرًا؟\n   الإجابة النموذجية: يغلي ويتحول إلى بخار.\n3. (مستوى الاستدلال) ماذا تحتوي الفقاعات في الماء المغلي؟\n   الإجابة النموذجية: بخار الماء.", "1. (مستوى المعرفة) صح أم خطأ: يجب أن يقترب الطلاب من الماء المغلي لملاحظته جيدًا.\n   الإجابة النموذجية: خطأ؛ نلاحظ من مسافة آمنة.\n2. (مستوى التطبيق) صف كيف يبدو الماء المغلي.\n   الإجابة النموذجية: تظهر فقاعات كثيرة كبيرة تتحرك بسرعة إلى السطح وتنفجر، وتتصاعد سحابة بيضاء.\n3. (مستوى الاستدلال) لماذا تتكون الفقاعات داخل الماء وليس على سطحه فقط؟\n   الإجابة النموذجية: لأن الماء كله يسخن ويتحول إلى بخار داخل السائل نفسه فيكوّن فقاعات ترتفع.", "للطالب: كتابة وصف لمراحل غليان الماء كما شاهدها. لولي الأمر: ملاحظة غليان الماء في المطبخ مع الابن من مسافة آمنة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"n": 3, "topic": "نشاط 3-7ب: استقصاء درجة غليان الماء", "f": ["1. يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده\n2. يحدد درجة غليان الماء النقي 100°C\nمخرج تعليمي آخر: يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان", "المخرج 1 (يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده): تطبيق\nالمخرج 2 (يحدد درجة غليان الماء النقي 100°C): تذكر\nالمخرج الآخر (يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: دورق زجاجي، لوح تسخين، ميزان حرارة، ساعة إيقاف، سدادة بثقب واحد (عرض المعلم)", "درجة الغليان، ميزان الحرارة، القياس.", "يسأل المعلم: «درجة حرارة ماء الصنبور البارد بين 20 و25°C، والساخن بين 50 و60°C. كم تتوقعون أن تكون درجة الحرارة عندما يغلي الماء؟».", "1. • التهيئة: يطرح المعلم السؤال، والطلبة يكتبون توقعاتهم (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • تجهيز الجدول: يعرض المعلم جدول ص57 (الزمن بالدقائق، درجة حرارة الماء)، والطلبة ينسخون الجدول (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • عرض نشاط 3-7ب: يسخن المعلم الماء ويقرأ ميزان الحرارة كل دقيقتين بصوت عالٍ، ويستمر أربع دقائق بعد بدء الغليان، والطلبة يسجلون القراءات ويلاحظون لحظة بدء الغليان (20 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • تحليل أولي: يسأل المعلم: ما درجة الحرارة عند بدء الغليان؟ هل ارتفعت بعد ذلك؟ والطلبة يلاحظون أنها وصلت إلى نحو 100°C وبقيت ثابتة تقريبًا (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يلخص المعلم: درجة غليان الماء النقي 100°C، والطلبة يكتبون المعلومة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (مستوى المعرفة) كل كم دقيقة سجلنا درجة الحرارة؟\n   الإجابة النموذجية: كل دقيقتين.\n2. (مستوى التطبيق) ما درجة الحرارة التي بدأ عندها الماء الغليان؟\n   الإجابة النموذجية: نحو 100°C.\n3. (مستوى الاستدلال) ماذا حدث لدرجة الحرارة بعد أن بدأ الماء يغلي؟\n   الإجابة النموذجية: بقيت ثابتة تقريبًا.", "1. (مستوى المعرفة) صح أم خطأ: درجة غليان الماء النقي 100°C.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الأدوات التي استخدمناها لقياس درجة الحرارة والزمن؟\n   الإجابة النموذجية: ميزان الحرارة وساعة الإيقاف.\n3. (مستوى الاستدلال) لماذا لم ترتفع درجة الحرارة رغم استمرار التسخين أثناء الغليان؟\n   الإجابة النموذجية: لأن الطاقة الحرارية تُستخدم في تحويل الماء إلى بخار.", "للطالب: الاحتفاظ بجدول القراءات لرسم التمثيل الخطي في الحصة القادمة. لولي الأمر: مراجعة قراءة ميزان الحرارة مع الابن (ميزان حرارة الجسم مثلًا).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"n": 4, "topic": "تمثيل نتائج الغليان خطيًا وأسئلة الدرس", "f": ["1. يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي\n2. يفسر النمط في النتائج (ارتفاع ثم ثبات عند 100°C)\nمخرج تعليمي آخر: يفسر لماذا لا يغلي الماء دائمًا عند 100°C", "المخرج 1 (يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي): تطبيق\nالمخرج 2 (يفسر النمط في النتائج (ارتفاع ثم ثبات عند 100°C)): تحليل\nالمخرج الآخر (يفسر لماذا لا يغلي الماء دائمًا عند 100°C): تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مربعات، جداول القراءات", "درجة الغليان، التمثيل الخطي، النمط.", "يعرض المعلم جدول القراءات ويسأل: «كيف نرى بلمحة واحدة كيف تغيرت درجة الحرارة مع الزمن؟».", "1. • التهيئة: يعرض المعلم الجدول، والطلبة يقترحون التمثيل الخطي (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • رسم التمثيل الخطي: يراجع المعلم الخطوات (محاور، مقياس، نقاط، توصيل)، والطلبة يرسمون الزمن على المحور الأفقي ودرجة الحرارة على الرأسي (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • أسئلة ص57: يناقش المعلم الأسئلة (1–4)، والطلبة يحددون النمط، نوع التمثيل، درجة الغليان، وأن الماء يغلي عند 100°C إذا كان نقيًا، ثبات درجة الحرارة أثناء الغليان، والفقاعات بخار ماء (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • التحدي: يطرح المعلم تحدي ص57: لماذا لا يغلي الماء دائمًا عند 100°C؟ والطلبة يستنتجون أن الماء غير النقي (كالماء المالح) يغلي عند درجة أعلى، وأن الماء على قمم الجبال العالية يغلي عند درجة أقل (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يلخص المعلم النمط، والطلبة يكتبون الاستنتاج (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما نوع التمثيل المناسب لنتائج نشاط 3-7ب؟ ولماذا؟\n   الإجابة النموذجية: التمثيل الخطي؛ لأن درجة الحرارة تتغير بمرور الزمن.\n2. (مستوى التطبيق) صف النمط في التمثيل البياني.\n   الإجابة النموذجية: ترتفع درجة الحرارة تدريجيًا حتى نحو 100°C ثم تبقى ثابتة أثناء الغليان.\n3. (مستوى الاستدلال) ما الفقاعات الموجودة في الماء المغلي؟\n   الإجابة النموذجية: فقاعات بخار الماء.", "1. (مستوى المعرفة) صح أم خطأ: ارتفعت درجة الحرارة كثيرًا بعد بدء الغليان.\n   الإجابة النموذجية: خطأ؛ بقيت ثابتة تقريبًا.\n2. (مستوى التطبيق) هل يغلي الماء المالح عند 100°C؟\n   الإجابة النموذجية: لا؛ يغلي عند درجة أعلى قليلًا لأنه غير نقي.\n3. (مستوى الاستدلال) لماذا قد يغلي الماء عند درجة أقل من 100°C على قمة جبل عالٍ؟\n   الإجابة النموذجية: لأن ضغط الهواء أقل في الأماكن المرتفعة فيغلي الماء عند درجة أقل.", "للطالب: إكمال التمثيل الخطي ومراجعة إجابات أسئلة ص57. لولي الأمر: مناقشة الابن في الفرق بين غليان الماء العادي والماء المالح أثناء الطبخ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"n": 5, "topic": "ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر و العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة العمل 3-7 ص81", "الحصة 1: مفهوم الغليان وقواعد السلامة\nالغليان، يغلي، البخار، درجة الغليان.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\nالغليان، البخار، الفقاعات.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\nدرجة الغليان، ميزان الحرارة، القياس.\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\nدرجة الغليان، التمثيل الخطي، النمط.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\nالتبخر، الغليان، درجة الغليان، الاختبار العادل.", "الحصة 1: مفهوم الغليان وقواعد السلامة\nيعرض المعلم صورة الطالبين ص56 ويقرأ حوارهما: «الهواء فوق الإناء ساخن للغاية… لقد احترقت يدي ولم ألمس الإناء!»، ويسأل: «لماذا احترقت يد خالد دون أن يلمس الإناء؟».\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\nيضع المعلم إناء الماء على لوح التسخين أمام الطلاب ويطلب منهم الجلوس على مسافة آمنة، ويسأل: «ماذا تتوقعون أن نرى؟».\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\nيسأل المعلم: «درجة حرارة ماء الصنبور البارد بين 20 و25°C، والساخن بين 50 و60°C. كم تتوقعون أن تكون درجة الحرارة عندما يغلي الماء؟».\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\nيعرض المعلم جدول القراءات ويسأل: «كيف نرى بلمحة واحدة كيف تغيرت درجة الحرارة مع الزمن؟».\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\nيطرح المعلم سؤال «تحدّث عن!» ص57: «ما الفرق بين التبخر والغليان؟ كلاهما يحول الماء إلى غاز!».", "الحصة 1: مفهوم الغليان وقواعد السلامة — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويقرأ الحوار، والطلبة يقترحون: البخار الساخن (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الغليان: يشرح المعلم ص56: عند تسخين الماء بدرجة كافية يغلي؛ تكتسب الجزيئات طاقة كبيرة فتتحرك بسرعة وتنفصل ويتحول الماء إلى بخار. سائل + حرارة ← غاز، والطلبة يكتبون التعريف والمعادلة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • البخار والسحابة: يوضح المعلم أن البخار غاز غير مرئي، والسحابة البيضاء فوق الإناء قطرات تكثفت عند ملامسة الهواء الأبرد، والطلبة يرسمون إناءً يغلي ويحددون المنطقة غير المرئية والسحابة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • السلامة: يناقش المعلم تحذير الأمن والسلامة ص56: الماء المغلي والبخار يسببان حروقًا، والطلبة يكتبون ثلاث قواعد سلامة عند الغليان (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يقدم المعلم مفهوم درجة الغليان ويسأل عن توقعاتهم لدرجة غليان الماء، والطلبة يتوقعون أرقامًا ويكتبونها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يجهز المعلم العرض ويحدد مسافة الأمان، والطلبة يتنبؤون ويكتبون (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • عرض نشاط 3-7أ: يسخن المعلم الماء ويطلب وصف ما يحدث على مراحل، والطلبة يلاحظون فقاعات صغيرة ثم كبيرة ترتفع وتنفجر عند السطح، وتصاعد سحابة بيضاء (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. • الوصف: يسأل المعلم: كيف يبدو الماء المغلي؟ والطلبة يصفون: فقاعات كثيرة، حركة شديدة، صوت، سحابة فوقه (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • تفسير الفقاعات: يوضح المعلم أن الفقاعات تحتوي على بخار الماء الذي تكون داخل السائل، والطلبة يفسرون الفقاعات (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يذكّر المعلم: لماذا لم نمرر أيدينا فوق الإناء؟ والطلبة يجيبون: خطر الحروق من البخار (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يكتبون توقعاتهم (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • تجهيز الجدول: يعرض المعلم جدول ص57 (الزمن بالدقائق، درجة حرارة الماء)، والطلبة ينسخون الجدول (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عرض نشاط 3-7ب: يسخن المعلم الماء ويقرأ ميزان الحرارة كل دقيقتين بصوت عالٍ، ويستمر أربع دقائق بعد بدء الغليان، والطلبة يسجلون القراءات ويلاحظون لحظة بدء الغليان (20 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • تحليل أولي: يسأل المعلم: ما درجة الحرارة عند بدء الغليان؟ هل ارتفعت بعد ذلك؟ والطلبة يلاحظون أنها وصلت إلى نحو 100°C وبقيت ثابتة تقريبًا (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. • الغلق: يلخص المعلم: درجة غليان الماء النقي 100°C، والطلبة يكتبون المعلومة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الجدول، والطلبة يقترحون التمثيل الخطي (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • رسم التمثيل الخطي: يراجع المعلم الخطوات (محاور، مقياس، نقاط، توصيل)، والطلبة يرسمون الزمن على المحور الأفقي ودرجة الحرارة على الرأسي (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة ص57: يناقش المعلم الأسئلة (1–4)، والطلبة يحددون النمط، نوع التمثيل، درجة الغليان، وأن الماء يغلي عند 100°C إذا كان نقيًا، ثبات درجة الحرارة أثناء الغليان، والفقاعات بخار ماء (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • التحدي: يطرح المعلم تحدي ص57: لماذا لا يغلي الماء دائمًا عند 100°C؟ والطلبة يستنتجون أن الماء غير النقي (كالماء المالح) يغلي عند درجة أعلى، وأن الماء على قمم الجبال العالية يغلي عند درجة أقل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • الغلق: يلخص المعلم النمط، والطلبة يكتبون الاستنتاج (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقدمون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • التبخر والغليان: يرسم المعلم جدول مقارنة (درجة الحرارة، المكان في السائل، السرعة، الفقاعات)، والطلبة يكملون: التبخر يحدث عند أي درجة ومن السطح فقط ببطء، والغليان عند درجة الغليان ومن داخل السائل كله بسرعة مع فقاعات (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • ورقة العمل 3-7: يقدم المعلم ورقة العمل ص81: كيف يغلي الماء بسرعة؟ والطلبة يقترحون: كمية أقل، غطاء للإناء، حرارة أعلى، ويخططون اختبارًا عادلًا لكميتين مختلفتين (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • تمرين 3-7: يقدم المعلم تمرين 3-7 بكتاب النشاط ص37 كواجب ويحل أول سؤال جماعيًا، والطلبة يشاركون (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "الحصة 1: مفهوم الغليان وقواعد السلامة\n1. (مستوى المعرفة) ماذا يحدث للماء عندما يغلي؟\n   الإجابة النموذجية: يتحول من سائل إلى غاز (بخار).\n2. (مستوى التطبيق) لماذا احترقت يد خالد دون أن يلمس الإناء؟\n   الإجابة النموذجية: لأن البخار الساخن فوق الإناء يسبب الحروق.\n3. (مستوى الاستدلال) هل السحابة البيضاء فوق الماء المغلي هي البخار؟ وضّح.\n   الإجابة النموذجية: لا؛ البخار غير مرئي، والسحابة قطرات ماء صغيرة تكثفت عندما برد البخار في الهواء.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\n1. (مستوى المعرفة) ماذا ظهر داخل الماء عند غليانه؟\n   الإجابة النموذجية: فقاعات كبيرة ترتفع وتنفجر عند السطح.\n2. (مستوى التطبيق) ما الذي يحدث للماء بعد أن ترتفع درجة حرارته كثيرًا؟\n   الإجابة النموذجية: يغلي ويتحول إلى بخار.\n3. (مستوى الاستدلال) ماذا تحتوي الفقاعات في الماء المغلي؟\n   الإجابة النموذجية: بخار الماء.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\n1. (مستوى المعرفة) كل كم دقيقة سجلنا درجة الحرارة؟\n   الإجابة النموذجية: كل دقيقتين.\n2. (مستوى التطبيق) ما درجة الحرارة التي بدأ عندها الماء الغليان؟\n   الإجابة النموذجية: نحو 100°C.\n3. (مستوى الاستدلال) ماذا حدث لدرجة الحرارة بعد أن بدأ الماء يغلي؟\n   الإجابة النموذجية: بقيت ثابتة تقريبًا.\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n1. (مستوى المعرفة) ما نوع التمثيل المناسب لنتائج نشاط 3-7ب؟ ولماذا؟\n   الإجابة النموذجية: التمثيل الخطي؛ لأن درجة الحرارة تتغير بمرور الزمن.\n2. (مستوى التطبيق) صف النمط في التمثيل البياني.\n   الإجابة النموذجية: ترتفع درجة الحرارة تدريجيًا حتى نحو 100°C ثم تبقى ثابتة أثناء الغليان.\n3. (مستوى الاستدلال) ما الفقاعات الموجودة في الماء المغلي؟\n   الإجابة النموذجية: فقاعات بخار الماء.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n1. (مستوى المعرفة) ما الفرق بين التبخر والغليان من حيث درجة الحرارة؟\n   الإجابة النموذجية: التبخر يحدث عند أي درجة حرارة، والغليان يحدث عند درجة الغليان فقط.\n2. (مستوى التطبيق) أين يحدث التبخر في السائل؟ وأين يحدث الغليان؟\n   الإجابة النموذجية: التبخر من السطح فقط، والغليان في السائل كله.\n3. (مستوى الاستدلال) اقترح طريقة تجعل الماء يغلي أسرع وفسّرها.\n   الإجابة النموذجية: استخدام كمية أقل من الماء أو تغطية الإناء؛ لأن الكمية الأقل تحتاج طاقة أقل والغطاء يقلل فقد الحرارة.", "الحصة 1: مفهوم الغليان وقواعد السلامة\n1. (مستوى المعرفة) صح أم خطأ: البخار غاز غير مرئي.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر قاعدتين للسلامة عند غلي الماء.\n   الإجابة النموذجية: عدم تمرير اليد فوق الإناء، وعدم لمس الإناء الساخن، والابتعاد عن البخار (أي اثنتين).\n3. (مستوى الاستدلال) ما الفرق بين الهواء فوق الماء البارد والهواء فوق الماء المغلي؟\n   الإجابة النموذجية: فوق الماء المغلي يوجد بخار ساخن جدًا يسبب الحروق، أما فوق الماء البارد فالهواء غير ساخن.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\n1. (مستوى المعرفة) صح أم خطأ: يجب أن يقترب الطلاب من الماء المغلي لملاحظته جيدًا.\n   الإجابة النموذجية: خطأ؛ نلاحظ من مسافة آمنة.\n2. (مستوى التطبيق) صف كيف يبدو الماء المغلي.\n   الإجابة النموذجية: تظهر فقاعات كثيرة كبيرة تتحرك بسرعة إلى السطح وتنفجر، وتتصاعد سحابة بيضاء.\n3. (مستوى الاستدلال) لماذا تتكون الفقاعات داخل الماء وليس على سطحه فقط؟\n   الإجابة النموذجية: لأن الماء كله يسخن ويتحول إلى بخار داخل السائل نفسه فيكوّن فقاعات ترتفع.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\n1. (مستوى المعرفة) صح أم خطأ: درجة غليان الماء النقي 100°C.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الأدوات التي استخدمناها لقياس درجة الحرارة والزمن؟\n   الإجابة النموذجية: ميزان الحرارة وساعة الإيقاف.\n3. (مستوى الاستدلال) لماذا لم ترتفع درجة الحرارة رغم استمرار التسخين أثناء الغليان؟\n   الإجابة النموذجية: لأن الطاقة الحرارية تُستخدم في تحويل الماء إلى بخار.\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: ارتفعت درجة الحرارة كثيرًا بعد بدء الغليان.\n   الإجابة النموذجية: خطأ؛ بقيت ثابتة تقريبًا.\n2. (مستوى التطبيق) هل يغلي الماء المالح عند 100°C؟\n   الإجابة النموذجية: لا؛ يغلي عند درجة أعلى قليلًا لأنه غير نقي.\n3. (مستوى الاستدلال) لماذا قد يغلي الماء عند درجة أقل من 100°C على قمة جبل عالٍ؟\n   الإجابة النموذجية: لأن ضغط الهواء أقل في الأماكن المرتفعة فيغلي الماء عند درجة أقل.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n1. (مستوى المعرفة) صح أم خطأ: الغليان يحدث بسرعة أكبر من التبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما العامل الذي تغيره عند مقارنة زمن غليان كميتين من الماء؟\n   الإجابة النموذجية: كمية الماء.\n3. (مستوى الاستدلال) اذكر عاملين يجب تثبيتهما في هذا الاختبار.\n   الإجابة النموذجية: نوع الإناء، ومصدر الحرارة وقوته، ودرجة حرارة الماء الابتدائية (أي اثنين).", "الحصة 1: مفهوم الغليان وقواعد السلامة\nللطالب: قراءة كتاب الطالب ص56، وكتابة قواعد السلامة في المطبخ. لولي الأمر: تعريف الابن بأماكن الخطر في المطبخ ومناقشة قواعد السلامة عند غلي الماء.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\nللطالب: كتابة وصف لمراحل غليان الماء كما شاهدها. لولي الأمر: ملاحظة غليان الماء في المطبخ مع الابن من مسافة آمنة.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\nللطالب: الاحتفاظ بجدول القراءات لرسم التمثيل الخطي في الحصة القادمة. لولي الأمر: مراجعة قراءة ميزان الحرارة مع الابن (ميزان حرارة الجسم مثلًا).\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\nللطالب: إكمال التمثيل الخطي ومراجعة إجابات أسئلة ص57. لولي الأمر: مناقشة الابن في الفرق بين غليان الماء العادي والماء المالح أثناء الطبخ.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\nللطالب: حل تمرين 3-7 بكتاب النشاط ص37، وإكمال ورقة العمل 3-7 ص81. لولي الأمر: إحضار مكعبات ثلج وقطعة زبدة صغيرة مع الابن لدرس الانصهار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"code": "3-8", "title": "الانصهار", "unit": 3, "dates": "الأسبوع الخامس عشر (13–17/12/2026م)", "sb": "58–59", "tb": "76–79", "ab": "تمرين 3-8 ص38، ورقتا العمل 3-8أ ص83 و3-8ب ص85", "periods": [{"n": 1, "topic": "مفهوم الانصهار ودرجة الانصهار", "f": ["1. يعرّف الانصهار ودرجة الانصهار\n2. يفسر الانصهار باكتساب جزيئات المادة الصلبة طاقة حرارية\nمخرج تعليمي آخر: يقارن بين درجات انصهار مواد مختلفة", "المخرج 1 (يعرّف الانصهار ودرجة الانصهار): تذكر\nالمخرج 2 (يفسر الانصهار باكتساب جزيئات المادة الصلبة طاقة حرارية): فهم\nالمخرج الآخر (يقارن بين درجات انصهار مواد مختلفة): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: مكعبات ثلج، قطعة زبدة، طبقان", "الانصهار، ينصهر، درجة الانصهار.", "يضع المعلم مكعب ثلج وقطعة زبدة متساويين في الحجم على طبقين في المكان نفسه، ويسأل: «أيهما سينصهر أولًا؟ ولماذا؟».", "1. • التهيئة: يعرض المعلم الثلج والزبدة، والطلبة يتنبؤون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الانصهار: يشرح المعلم ص58: عند تسخين المواد الصلبة تكتسب جزيئاتها طاقة فتتحرك أسرع وتتباعد فتتحول إلى سائل. صلب + حرارة ← سائل، والطلبة يكتبون التعريف والمعادلة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • درجة الانصهار: يعرّف المعلم درجة الانصهار ويعرض صور ص58: الثلج، الزبدة، الفلزات، فتيل التنجستن (3380°C)، والطلبة يرتبون المواد حسب درجة انصهارها من الأقل إلى الأعلى (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يمثل المعلم بطلاب «جزيئات صلبة» متراصة تهتز، ثم تكتسب طاقة فتتحرك وتتباعد، والطلبة يصفون الفرق بين ترتيب جزيئات الصلب والسائل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يعود المعلم إلى الطبقين، والطلبة يلاحظون أن الثلج انصهر أولًا ويفسرون (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1. (مستوى المعرفة) ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى الحالة السائلة.\n2. (مستوى التطبيق) ما درجة الانصهار؟\n   الإجابة النموذجية: درجة الحرارة التي تنصهر عندها المادة الصلبة.\n3. (مستوى الاستدلال) لماذا اختير التنجستن لصنع فتيل المصباح؟\n   الإجابة النموذجية: لأن درجة انصهاره عالية جدًا (3380°C) فلا ينصهر بحرارة المصباح.", "1. (مستوى المعرفة) أكمل: صلب + …… ← سائل.\n   الإجابة النموذجية: حرارة.\n2. (مستوى التطبيق) ماذا يحدث لجزيئات المادة الصلبة عند تسخينها؟\n   الإجابة النموذجية: تكتسب طاقة حرارية فتتحرك أسرع وتتباعد عن بعضها.\n3. (مستوى الاستدلال) انصهر الثلج قبل الزبدة في المكان نفسه، ماذا تستنتج؟\n   الإجابة النموذجية: أن درجة انصهار الثلج أقل من درجة انصهار الزبدة.", "للطالب: قراءة كتاب الطالب ص58، وتسجيل أمثلة ع ار ودرجة الانصهار — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الثلج والزبدة، والطلبة يتنبؤون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الانصهار: يشرح المعلم ص58: عند تسخين المواد الصلبة تكتسب جزيئاتها طاقة فتتحرك أسرع وتتباعد فتتحول إلى سائل. صلب + حرارة ← سائل، والطلبة يكتبون التعريف والمعادلة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • درجة الانصهار: يعرّف المعلم درجة الانصهار ويعرض صور ص58: الثلج، الزبدة، الفلزات، فتيل التنجستن (3380°C)، والطلبة يرتبون المواد حسب درجة انصهارها من الأقل إلى الأعلى (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يمثل المعلم بطلاب «جزيئات صلبة» متراصة تهتز، ثم تكتسب طاقة فتتحرك وتتباعد، والطلبة يصفون الفرق بين ترتيب جزيئات الصلب والسائل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • الغلق: يعود المعلم إلى الطبقين، والطلبة يلاحظون أن الثلج انصهر أولًا ويفسرون (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: نشاط 3-8: استقصاء درجة انصهار الثلج — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم الأسئلة، والطلبة يكتبون تنبؤهم لدرجة انصهار الثلج (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • تجهيز الجدول: يعرض المعلم جدول ص59 ويقدم ورقة العمل 3-8ب ص85، والطلبة ينسخون الجدول (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. 8: يتابع المعلم وفق ص59، والطلبة يضعون الثلج في الدورق، ويقيسون درجة الحرارة كل دقيقة حتى ينصهر، ثم كل دقيقة لعشر دقائق أخرى، ويسجلون (20 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • تحليل أولي: يسأل المعلم: ماذا لاحظتم على درجة الحرارة أثناء الانصهار؟ والطلبة يلاحظون بقاءها عند 0°C تقريبًا حتى ينصهر الثلج كله، ثم ترتفع (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يلخص المعلم: درجة انصهار الثلج 0°C، والطلبة يكتبون المعلومة (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: التمثيل الخطي للانصهار وأسئلة الدرس — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقترحون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • ورقة العمل 3-8أ: يقدم المعلم ورقة العمل 3-8أ (ارسم تمثيلًا بيانيًا خطيًا يوضح الانصهار) ص83، والطلبة يرسمون التمثيل الخطي لقراءاتهم ويحددون الجزء الثابت عند 0°C (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • أسئلة ص59: يناقش المعلم الأسئلة (1–4)، والطلبة يجيبون عن النمط ونوع التمثيل ودرجة الانصهار وطرق تسريعه والتنبؤ بعد عشرين دقيقة، وأن 0°C هي درجة تجمد الماء أيضًا (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • الملح والثلج: يوضح المعلم أن الملح يخفض درجة انصهار الثلج فينصهر في درجات حرارة أقل من 0°C، والطلبة يربطون ذلك بتنظيف الطرق في البلاد الباردة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مفهوم الانصهار ودرجة الانصهار\n1. (مستوى المعرفة) ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى الحالة السائلة.\n2. (مستوى التطبيق) ما درجة الانصهار؟\n   الإجابة النموذجية: درجة الحرارة التي تنصهر عندها المادة الصلبة.\n3. (مستوى الاستدلال) لماذا اختير التنجستن لصنع فتيل المصباح؟\n   الإجابة النموذجية: لأن درجة انصهاره عالية جدًا (3380°C) فلا ينصهر بحرارة المصباح.\n\nالحصة 2: نشاط 3-8: استقصاء درجة انصهار الثلج\n1. (مستوى المعرفة) كل كم دقيقة قسنا درجة حرارة الثلج؟\n   الإجابة النموذجية: كل دقيقة.\n2. (مستوى التطبيق) عند أي درجة انصهر الثلج؟\n   الإجابة النموذجية: 0°C.\n3. (مستوى الاستدلال) ماذا حدث لدرجة الحرارة بعد انصهار الثلج كله؟\n   الإجابة النموذجية: بدأت ترتفع تدريجيًا.\n\nالحصة 3: التمثيل الخطي للانصهار وأسئلة الدرس\n1. (مستوى المعرفة) ما النمط الذي تراه في نتائجك؟\n   الإجابة النموذجية: تبقى درجة الحرارة عند 0°C حتى ينصهر الثلج كله ثم ترتفع.\n2. (مستوى التطبيق) ما نوع التمثيل المناسب لنتائج الانصهار؟\n   الإجابة النموذجية: التمثيل الخطي.\n3. (مستوى الاستدلال) اقترح طريقة لجعل الثلج ينصهر أسرع.\n   الإجابة النموذجية: تكسيره قطعًا صغيرة، أو تسخينه، أو وضعه في مكان دافئ، أو إضافة الملح.", "الحصة 1: مفهوم الانصهار ودرجة الانصهار\n1. (مستوى المعرفة) أكمل: صلب + …… ← سائل.\n   الإجابة النموذجية: حرارة.\n2. (مستوى التطبيق) ماذا يحدث لجزيئات المادة الصلبة عند تسخينها؟\n   الإجابة النموذجية: تكتسب طاقة حرارية فتتحرك أسرع وتتباعد عن بعضها.\n3. (مستوى الاستدلال) انصهر الثلج قبل الزبدة في المك وس بالمئوي؟\n   الإجابة النموذجية: لأن المسافة بين تجمد الماء (0) وغليانه (100) مقسمة إلى 100 درجة.\n2. (مستوى التطبيق) اذكر وجه شبه بين تدريجي سيلزيوس وكلفن.\n   الإجابة النموذجية: الفرق بين تجمد الماء وغليانه 100 درجة في كليهما.\n3. (مستوى الاستدلال) أي التدريجات أسهل في الاستخدام في رأيك؟ ولماذا؟\n   الإجابة النموذجية: سيلزيوس؛ لأنه مبني على القيمتين صفر ومئة (تقبل الإجابات المبررة).", "الحصة 1: تدريجات درجة الحرارة: فهرنهايت وسيلزيوس وكلفن\n1. (مستوى المعرفة) صح أم خطأ: يتجمد الماء عند 0°C على تدريج سيلزيوس.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) عند أي درجة يتجمد الماء على تدريج كلفن؟\n   الإجابة النموذجية: 273 K.\n3. (مستوى الاستدلال) لماذا كان العلماء بحاجة إلى اختراع تدريج لدرجة الحرارة؟\n   الإجابة النموذجية: لقياس درجة الحرارة بدقة ومقارنة القياسات بدل الاكتفاء بوصف ساخن أو بارد.\n\nالحصة 2: نشاط 3-9: ملصق تدريج درجة الحرارة والمراجعة\n1. (مستوى المعرفة) صح أم خطأ: يغلي الماء عند 373 K على تدريج كلفن.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما وجه الاختلاف بين تدريجي سيلزيوس وكلفن؟\n   الإجابة النموذجية: نقطة البداية؛ صفر كلفن هو الصفر المطلق (−273°C)، وصفر سيلزيوس هو درجة تجمد الماء.\n3. (مستوى الاستدلال) لماذا اخترع كلفن تدريجه الخاص؟\n   الإجابة النموذجية: لقياس درجات الحرارة الباردة جدًا حتى أقل درجة ممكنة (الصفر المطلق).", "الحصة 1: تدريجات درجة الحرارة: فهرنهايت وسيلزيوس وكلفن\nللطالب: قراءة كتاب الطالب ص60، واختيار أحد التدريجات الثلاثة لعمل ملصق عنه. لولي الأمر: تجهيز ورق A3 وأقلام تلوين للابن، ومساعدته في البحث عن درجات انصهار وغليان بعض المواد.\n\nالحصة 2: نشاط 3-9: ملصق تدريج درجة الحرارة والمراجعة\nللطالب: إكمال الملصق، وحل تمرين 3-9 بكتاب النشاط ص39، والمراجعة اللغوية للوحدة الثالثة ص40، ومراجعة الوحدة كاملة. لولي الأمر: مراجعة مفردات الوحدة الثالثة مع الابن (التبخر، التكثيف، الغليان، الانصهار، المحلول، دورة الماء).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=23"]}],[{"code": "1-1", "title": "البذور", "unit": 1, "dates": "الأسبوع الأول (6–10/9/2026م)", "sb": "16–17", "tb": "18–20", "ab": "تمرين 1-1 ص16، أوراق العمل 1-1أ ص50، 1-1ب ص52، 1-1ج ص53", "periods": [{"n": 1, "topic": "البذور والثمار: أين توجد البذور؟", "f": ["1. يحدد أن البذور توجد داخل الثمار\n2. يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها\nمخرج تعليمي آخر: يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات", "المخرج 1 (يحدد أن البذور توجد داخل الثمار): فهم\nالمخرج 2 (يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها): تحليل\nالمخرج الآخر (يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات): تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: ثمار حقيقية مقطوعة (تفاح، طماطم، خيار، بازلاء، أفوكادو)، سكين بلاستيكية، أطباق", "البذرة، الثمرة.", "يعرض المعلم تفاحة مقطوعة نصفين ويطرح سؤال الكتاب ص16: «هل سبق لك أن ابتلعت بذرة عند تناول التفاح أو البرتقال؟»، ثم يسأل: من أين تأتي البذور؟ وما فائدتها؟ ويدوّن إجابات الطلاب على السبورة لاستثمارها في الحصة.", "1. • التهيئة: يعرض المعلم التفاحة المقطوعة ويطرح سؤال الكتاب ص16 ويسجل الأفكار، والطلبة يجيبون ويذكرون ثمارًا تناولوها ووجدوا فيها بذورًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • استكشاف أماكن البذور: يوزع المعلم على المجموعات ثمارًا مقطوعة ويوجههم إلى تحديد موقع البذور في كل ثمرة، والطلبة يفحصون الثمار ويحددون موقع البذور ويقارنونها بصور الكتاب ص16 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عدد البذور وأحجامها: يطلب المعلم عدّ البذور في كل ثمرة وتسجيلها في جدول، ويقدّم ورقة العمل 1-1ب (إيجاد الأنماط ووضع التنبؤات) ص52، والطلبة يعدّون البذور ويملؤون الجدول ويستنتجون نمطًا: الثمرة ذات البذرة الواحدة تكون بذرتها كبيرة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تصحيح مفهوم الثمرة: يوضح المعلم أن الثمرة هي الجزء الذي يحمل البذور حتى لو لم تكن حلوة (اليقطين، الخيار، الطماطم)، وينبّه إلى عدم تناول الثمار البرية المجهولة، والطلبة يصنفون صورًا معروضة على السبورة الذكية إلى: ثمرة / ليست ثمرة، مع التعليل (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تطبيق من الكتاب: يوجه الطلاب إلى صور الصفحة 16 (التفاح، الأفوكادو، البازلاء، الجوز)، ويصف كل طالب موقع البذور وعددها في ثمرة من الصور (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يوزع المعلم بطاقة خروج: «سمِّ ثمرتين بهما بذور كثيرة وثمرة بها بذرة واحدة»، والطلبة يكتبون الإجابة ويسلمونها (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرفة) أين توجد البذور في النبات؟\n   الإجابة النموذجية: داخل الثمار.\n2. (مستوى التطبيق) كيف تختلف بذور التفاح عن بذرة الأفوكادو؟\n   الإجابة النموذجية: التفاح يحتوي على عدة بذور صغيرة في منتصف الثمرة، والأفوكادو يحتوي على بذرة واحدة كبيرة.\n3. (مستوى الاستدلال) هل الخيار ثمرة؟ فسّر إجابتك.\n   الإجابة النموذجية: نعم، لأنه يحتوي على بذور في داخله.", "1. (مستوى المعرفة) سمِّ ثمرة تحتوي على بذرة واحدة كبيرة.\n   الإجابة النموذجية: الأفوكادو (أو المانجو).\n2. (مستوى التطبيق) اذكر ثلاث ثمار تحتوي على عدد كبير من البذور.\n   الإجابة النموذجية: الطماطم، الخيار، البطيخ (أو أي أمثلة صحيحة).\n3. (مستوى الاستدلال) أردتَ معرفة عدد البذور في ثمار البرتقال، فهل يكفي فتح برتقالة واحدة؟ وضّح.\n   الإجابة النموذجية: لا يكفي؛ يجب فتح عدة ثمار من النوع نفسه وعدّ بذورها لأن العدد يختلف من ثمرة لأخرى، فالقياسات المتكررة تعطي نتيجة أدق.", "للطالب: قراءة كتاب الطالب ص16، وإكمال ورقة العمل 1-1ب ص52 في كتاب النشاط إن لم تُنجز في الصف. لولي الأمر: مشاركة الابن عدّ بذور ثمرتين من المنزل (مثل الطماطم والخيار) وتسجيل العدد لمناقشته في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=1"]}, {"n": 2, "topic": "تركيب البذرة", "f": ["1. يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء\n2. يوضح وظيفة كل جزء من أجزاء البذرة\nمخرج تعليمي آخر: يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا", "المخرج 1 (يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء): تذكر\nالمخرج 2 (يوضح وظيفة كل جزء من أجزاء البذرة): فهم\nالمخرج الآخر (يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: بذور فول كبيرة منقوعة، عدسات مكبرة", "غلاف البذرة، الجنين، مخزون الغذاء، الندبة.", "يسأل المعلم: أين توجد البذور؟ ثم يعرض بذرة فول جافة وشتلة فول صغيرة ويطرح سؤالًا مثيرًا: «كيف تستطيع هذه البذرة الصغيرة أن تصبح نباتًا كاملًا؟ ماذا تخبئ في داخلها؟».", "1. • التهيئة: يعرض المعلم البذرة والشتلة ويطرح السؤال المثير، والطلبة يتوقعون ما في داخل البذرة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • نمذجة الملاحظة والرسم: يعرض المعلم رسم بذرة الفول ص17 ويشرح الأجزاء، ويوضح طريقة استخدام العدسة المكبرة وقواعد الرسم العلمي (قلم رصاص، خطوط تسمية بالمسطرة)، والطلبة يتابعون ويحددون الأجزاء على الرسم (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تنفيذ نشاط 1-1: يوزع المعلم البذور المنقوعة والعدسات ويتابع المجموعات، والطلبة يفحصون البذرة، ويحددون الغلاف والندبة، وينزعون الغلاف بأظافرهم، ويفصلون الفلقتين، ويحددون الجنين ومخزون الغذاء (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • الرسم والتسمية: يتابع المعلم الرسومات ويقدم الدعم للطلاب الذين يواجهون صعوبة، والطلبة يرسمون البذرة ويسمون أجزاءها، ثم يتبادلون الرسومات لتقييم الأقران (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • أسئلة الكتاب ص17: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون: مخزون الغذاء يمد الجنين بالطاقة، والغلاف يحمي البذرة، وتحتاج للماء والدفء لتبدأ النمو (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. • الغلق: يلخص المعلم من خلال «ماذا تعلمت؟»، والطلبة يذكرون الأجزاء الثلاثة ووظائفها (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما الجزء الذي ينمو ليصبح نباتًا جديدًا؟\n   الإجابة النموذجية: الجنين.\n2. (مستوى التطبيق) لماذا تحتاج البذرة إلى غلاف؟\n   الإجابة النموذجية: لحماية ما بداخل البذرة.\n3. (مستوى الاستدلال) لماذا تحتاج البذرة إلى مخزون الغذاء؟\n   الإجابة النموذجية: ليحصل الجنين على الطاقة اللازمة للنمو قبل أن تتكون أوراق تصنع الغذاء.", "1. (مستوى المعرفة) أكمل: الغطاء الخارجي الذي يحمي البذرة يسمى ……\n   الإجابة النموذجية: غلاف البذرة.\n2. (مستوى التطبيق) سمِّ أجزاء بذرة الفول الثلاثة، واذكر وظيفة كل منها.\n   الإجابة النموذجية: الغلاف: يحمي البذرة. الجنين: ينمو إلى نبات جديد. مخزون الغذاء: يمد الجنين بالطاقة.\n3. (مستوى الاستدلال) بذرة تلف مخزون غذائها، ماذا تتوقع أن يحدث لجنينها عند زراعتها؟ فسّر.\n   الإجابة النموذجية: لن ينمو الجنين أو ينمو ضعيفًا؛ لأنه لا يجد الطاقة اللازمة للنمو في بدايته.", "للطالب: حل تمرين 1-1 بكتاب النشاط ص16، وورقة العمل 1-1أ (ملاحظة ثمرة وبذورها ورسمها) ص50؛ والطلاب المتميزون: ورقة العمل 1-1ج (كم عدد البذور؟) ص53. لولي الأمر: متابعة رسم الابن لبذرة وتسمية أجزائها، ومساعدته في نقع بذرة فول ليلة كاملة لإحضارها في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=1"]}], "combined": ["الحصة 1: البذور والثمار: أين توجد البذور؟\n1. يحدد أن البذور توجد داخل الثمار\n2. يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها\nمخرج تعليمي آخر: يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات\n\nالحصة 2: تركيب البذرة\n1. يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء\n2. يوضح وظيفة كل جزء من أجزاء البذرة\nمخرج تعليمي آخر: يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا", "الحصة 1: البذور والثمار: أين توجد البذور؟\nالمخرج 1 (يحدد أن البذور توجد داخل الثمار): فهم\nالمخرج 2 (يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها): تحليل\nالمخرج الآخر (يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات): تطبيق\n\nالحصة 2: تركيب البذرة\nالمخرج 1 (يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء): تذكر\nالمخرج 2 (يوضح وظيفة كل جزء من أجزاء البذرة): فهم\nالمخرج الآخر (يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا): تطبيق", "الحصة 1: البذور والثمار: أين توجد البذور؟\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي\n\nالحصة 2: تركيب البذرة\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الحصة 1: البذور والثمار: أين توجد البذور؟\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: ثمار حقيقية مقطوعة (تفاح، طماطم، خيار، بازلاء، أفوكادو)، سكين بلاستيكية، أطباق\n\nالحصة 2: تركيب البذرة\nالكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: بذور فول كبيرة منقوعة، عدسات مكبرة", "الحصة 1: البذور والثمار: أين توجد البذور؟\nالبذرة، الثمرة.\n\nالحصة 2: تركيب البذرة\nغلاف البذرة، الجنين، مخزون الغذاء، الندبة.", "الحصة 1: البذور والثمار: أين توجد البذور؟\nيعرض المعلم تفاحة مقطوعة نصفين ويطرح سؤال الكتاب ص16: «هل سبق لك أن ابتلعت بذرة عند تناول التفاح أو البرتقال؟»، ثم يسأل: من أين تأتي البذور؟ وما فائدتها؟ ويدوّن إجابات الطلاب على السبورة لاستثمارها في الحصة.\n\nالحصة 2: تركيب البذرة\nيسأل المعلم: أين توجد البذور؟ ثم يعرض بذرة فول جافة وشتلة فول صغيرة ويطرح سؤالًا مثيرًا: «كيف تستطيع هذه البذرة الصغيرة أن تصبح نباتًا كاملًا؟ ماذا تخبئ في داخلها؟».", "الحصة 1: البذور والثمار: أين توجد البذور؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم التفاحة المقطوعة ويطرح سؤال الكتاب ص16 ويسجل الأفكار، والطلبة يجيبون ويذكرون ثمارًا تناولوها ووجدوا فيها بذورًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • استكشاف أماكن البذور: يوزع المعلم على المجموعات ثمارًا مقطوعة ويوجههم إلى تحديد موقع البذور في كل ثمرة، والطلبة يفحصون الثمار ويحددون موقع البذور ويقارنونها بصور الكتاب ص16 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عدد البذور وأحجامها: يطلب المعلم عدّ البذور في كل ثمرة وتسجيلها في جدول، ويقدّم ورقة العمل 1-1ب (إيجاد الأنماط ووضع التنبؤات) ص52، والطلبة يعدّون البذور ويملؤون الجدول ويستنتجون نمطًا: الثمرة ذات البذرة الواحدة تكون بذرتها كبيرة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تصحيح مفهوم الثمرة: يوضح المعلم أن الثمرة هي الجزء الذي يحمل البذور حتى لو لم تكن حلوة (اليقطين، الخيار، الطماطم)، وينبّه إلى عدم تناول الثمار البرية المجهولة، والطلبة يصنفون صورًا معروضة على السبورة الذكية إلى: ثمرة / ليست ثمرة، مع التعليل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • تطبيق من الكتاب: يوجه الطلاب إلى صور الصفحة 16 (التفاح، الأفوكادو، البازلاء، الجوز)، ويصف كل طالب موقع البذور وعددها في ثمرة من الصور (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. • الغلق: يوزع المعلم بطاقة خروج: «سمِّ ثمرتين بهما بذور كثيرة وثمرة بها بذرة واحدة»، والطلبة يكتبون الإجابة ويسلمونها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: تركيب البذرة — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم البذرة والشتلة ويطرح السؤال المثير، والطلبة يتوقعون ما في داخل البذرة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. • نمذجة الملاحظة والرسم: يعرض المعلم رسم بذرة الفول ص17 ويشرح الأجزاء، ويوضح طريقة استخدام العدسة المكبرة وقواعد الرسم العلمي (قلم رصاص، خطوط تسمية بالمسطرة)، والطلبة يتابعون ويحددون الأجزاء على الرسم (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تنفيذ نشاط 1-1: يوزع المعلم البذور المنقوعة والعدسات ويتابع المجموعات، والطلبة يفحصون البذرة، ويحددون الغلاف والندبة، وينزعون الغلاف بأظافرهم، ويفصلون الفلقتين، ويحددون الجنين ومخزون الغذاء (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • الرسم والتسمية: يتابع المعلم الرسومات ويقدم الدعم للطلاب الذين يواجهون صعوبة، والطلبة يرسمون البذرة ويسمون أجزاءها، ثم يتبادلون الرسومات لتقييم الأقران (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • أسئلة الكتاب ص17: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون: مخزون الغذاء يمد الجنين بالطاقة، والغلاف يحمي البذرة، وتحتاج للماء والدفء لتبدأ النمو (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. • الغلق: يلخص المعلم من خلال «ماذا تعلمت؟»، والطلبة يذكرون الأجزاء الثلاثة ووظائفها (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "الحصة 1: البذور والثمار: أين توجد البذور؟\n1. (مستوى المعرفة) أين توجد البذور في النبات؟\n   الإجابة النموذجية: داخل الثمار.\n2. (مستوى التطبيق) كيف تختلف بذور التفاح عن بذرة الأفوكادو؟\n   الإجابة النموذجية: التفاح يحتوي على عدة بذور صغيرة في منتصف الثمرة، والأفوكادو يحتوي على بذرة واحدة كبيرة.\n3. (مستوى الاستدلال) هل الخيار ثمرة؟ فسّر إجابتك.\n   الإجابة النموذجية: نعم، لأنه يحتوي على بذور في داخله.\n\nالحصة 2: تركيب البذرة\n1. (مستوى المعرفة) ما الجزء الذي ينمو ليصبح نباتًا جديدًا؟\n   الإجابة النموذجية: الجنين.\n2. (مستوى التطبيق) لماذا تحتاج البذرة إلى غلاف؟\n   الإجابة النموذجية: لحماية ما بداخل البذرة.\n3. (مستوى الاستدلال) لماذا تحتاج البذرة إلى مخزون الغذاء؟\n   الإجابة النموذجية: ليحصل الجنين على الطاقة اللازمة للنمو قبل أن تتكون أوراق تصنع الغذاء.", "الحصة 1: البذور والثمار: أين توجد البذور؟\n1. (مستوى المعرفة) سمِّ ثمرة تحتوي على بذرة واحدة كبيرة.\n   الإجابة النموذجية: الأفوكادو (أو المانجو).\n2. (مستوى التطبيق) اذكر ثلاث ثمار تحتوي على عدد كبير من البذور.\n   الإجابة النموذجية: الطماطم، الخيار، البطيخ (أو أي أمثلة صحيحة).\n3. (مستوى الاستدلال) أردتَ معرفة عدد البذور في ثمار البرتقال، فهل يكفي فتح برتقالة واحدة؟ وضّح.\n   الإجابة النموذجية: لا يكفي؛ يجب فتح عدة ثمار من النوع نفسه وعدّ بذورها لأن العدد يختلف من ثمرة لأخرى، فالقياسات المتكررة تعطي نتيجة أدق.\n\nالحصة 2: تركيب البذرة\n1. (مستوى المعرفة) أكمل: الغطاء الخارجي الذي يحمي البذرة يسمى ……\n   الإجابة النموذجية: غلاف البذرة.\n2. (مستوى التطبيق) سمِّ أجزاء بذرة الفول الثلاثة، واذكر وظيفة كل منها.\n   الإجابة النموذجية: الغلاف: يحمي البذرة. الجنين: ينمو إلى نبات جديد. مخزون الغذاء: يمد الجنين بالطاقة.\n3. (مستوى الاستدلال) بذرة تلف مخزون غذائها، ماذا تتوقع أن يحدث لجنينها عند زراعتها؟ فسّر.\n   الإجابة النموذجية: لن ينمو الجنين أو ينمو ضعيفًا؛ لأنه لا يجد الطاقة اللازمة للنمو في بدايته.", "الحصة 1: البذور والثمار: أين توجد البذور؟\nللطالب: قراءة كتاب الطالب ص16، وإكمال ورقة العمل 1-1ب ص52 في كتاب النشاط إن لم تُنجز في الصف. لولي الأمر: مشاركة الابن عدّ بذور ثمرتين من المنزل (مثل الطماطم والخيار) وتسجيل العدد لمناقشته في الحصة القادمة.\n\nالحصة 2: تركيب البذرة\nللطالب: حل تمرين 1-1 بكتاب النشاط ص16، وورقة العمل 1-1أ (ملاحظة ثمرة وبذورها ورسمها) ص50؛ والطلاب المتميزون: ورقة العمل 1-1ج (كم عدد البذور؟) ص53. لولي الأمر: متابعة رسم الابن لبذرة وتسمية أجزائها، ومساعدته في نقع بذرة فول ليلة كاملة لإحضارها في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=1"]}, {"code": "1-2", "title": "كيف تنمو البذور؟", "unit": 1, "dates": "الأسبوع الأول (6–10/9/2026م)", "sb": "18–19", "tb": "21–22", "ab": "تمرين 1-2 ص17", "periods": [{"n": 1, "topic": "الإنبات ومراحله + نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)", "f": ["1. يعرّف الإنبات\n2. يرتب مراحل إنبات بذرة الفول ترتيبًا صحيحًا\n3. يتنبأ بالتغيرات التي ستحدث لبذرة الفول عند نقعها في الماء\n4. يسجل ملاحظات أولية دقيقة عن البذرة الجافة (الطول، الملمس، الشكل)\n\nمخرج تعليمي آخر:\nيفسر سبب ذبول البذرة وصغر حجمها بعد الإنبات\nيقترح طريقة يتحقق بها من صحة تنبؤه", "المخرج 1 (يعرّف الإنبات): تذكر\nالمخرج 2 (يرتب مراحل إنبات بذرة الفول ترتيبًا صحيحًا): فهم\nالمخرج 3 (يتنبأ بالتغيرات التي ستحدث لبذرة الفول عند نقعها في الماء): تطبيق\nالمخرج 4 (يسجل ملاحظات أولية دقيقة عن البذرة الجافة (الطول، الملمس، الشكل)): فهم\nالمخرج الآخر (يفسر سبب ذبول البذرة وصغر حجمها بعد الإنبات): تحليل\nالمخرج الآخر (يقترح طريقة يتحقق بها من صحة تنبؤه): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني، التعلم الذاتي", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، صورة توضيحية، أخرى: بطاقات مصورة لمراحل الإنبات\nالكتاب، السبورة الذكية، الأقلام، أخرى: بذور فول جافة، أطباق بها ماء، مسطرة، ملصقات أسماء", "الإنبات، الجذر الأول، الساق الأول، الأوراق الأولية، يمتص، يذبل.، التنبؤ.", "يعرض المعلم بذرة فول جافة وصورة شتلة فول ويسأل: «ما الذي حدث للبذرة حتى أصبحت هكذا؟ وما الذي يجعلها تبدأ في النمو؟»، ويدوّن أفكار الطلاب في مخطط ذهني.", "1. • التهيئة: يعرض المعلم البذرة والشتلة ويبني مخططًا ذهنيًا بأفكار الطلاب، والطلبة يقترحون ما يحدث للبذرة لتنمو (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الإنبات: يقرأ المعلم مع الطلاب ص18 ويوضح أن البذرة تبدأ النمو عندما تتوافر الظروف الملائمة، وتستخدم مخزون الغذاء للطاقة، والطلبة يستخلصون تعريف الإنبات ويكتبونه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عرض مراحل الإنبات: يعرض المعلم مقطعًا مرئيًا لإنبات بذرة ويناقش رسم ص18: امتصاص الماء والانتفاخ، انفلاق الغلاف، الجذر الأول، الساق الأول، الأوراق الأولية، الجذور الجانبية، والطلبة يشاهدون ويصفون كل مرحلة واتجاه نمو الجذر والساق (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. • ترتيب البطاقات: يوزع المعلم بطاقات مراحل الإنبات مبعثرة على المجموعات، والطلبة يرتبون البطاقات ويعرضون ترتيبهم ويبررونه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • بذور تنتظر سنوات: يناقش المعلم مثال بذور اللوتس ص18 (بذور عمرها 1300 عام نبتت)، والطلبة يستنتجون أن البذور تبقى حية حتى تتهيأ لها الظروف (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • ملاحظة البذرة الجافة: يوزع المعلم البذور والمساطر ويطلب وصفًا دقيقًا، والطلبة يقيسون طول البذرة ويصفون لونها وملمسها ويرسمونها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. • كتابة التنبؤ: يرسم المعلم على السبورة جدولًا (قبل النقع / التنبؤ / بعد النقع)، والطلبة ينقلون الجدول ويكتب كل طالب تنبؤه مع سببه (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. • إعداد النقع: يوجه المجموعات وفق خطوات نشاط 1-2 ص19، والطلبة يضعون البذرة في طبق به ماء ويكتبون اسم المجموعة عليه (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. • مناقشة: يسأل المعلم: من أين سيدخل الماء إلى البذرة؟ كيف سنعرف أن تنبؤنا صحيح؟ والطلبة يقترحون الندبة ويقترحون القياس والمقارنة غدًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. • الغلق: يذكّر المعلم بموعد الملاحظة في الحصة القادمة، والطلبة يرتبون الأدوات ويحفظون الأطباق في مكان آمن (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1. (مستوى المعرفة) ما أول جزء يظهر من البذرة عند الإنبات؟\n   الإجابة النموذجية: الجذر الأول.\n2. (مستوى التطبيق) رتّب: ينمو الساق الأول – تمتص البذرة الماء – تبدأ الأوراق الأولية – يظهر الجذر الأول.\n   الإجابة النموذجية: تمتص البذرة الماء ← يظهر الجذر الأول ← ينمو الساق الأول ← تبدأ الأوراق الأولية.\n3. (مستوى الاستدلال) لماذا تذبل البذرة ويصغر حجمها بعد الإنبات؟\n   الإجابة النموذجية: لأن مخزون الغذاء فيها يُستهلك أثناء الإنبات.\n\n4. (مستوى المعرفة) ماذا وضعنا مع بذرة الفول في الطبق؟\n   الإجابة النموذجية: ماءً.\n5. (مستوى التطبيق) اذكر تنبؤًا واحدًا لما سيحدث للبذرة بعد نقعها.\n   الإجابة النموذجية: تكبر/تنتفخ، أو تصبح لينة، أو يتجعد غلافها.\n6. (مستوى الاستدلال) كيف نتحقق من صحة تنبؤنا؟\n   الإجابة النموذجية: نقيس البذرة ونصفها بعد النقع ونقارن بالقياس قبل النقع.", "1. (مستوى المعرفة) صح أم خطأ: ينمو الجذر الأول متجهًا إلى أعلى.\n   الإجابة النموذجية: خطأ؛ ينمو إلى الأسفل.\n2. (مستوى التطبيق) عرّف الإنبات.\n   الإجابة النموذجية: بدء البذرة في النمو عندما تتوافر لها الظروف الملائمة.\n3. (مستوى الاستدلال) نبتت بذور لوتس عمرها 1300 عام، ماذا يدل ذلك؟\n   الإجابة النموذجية: أن البذور يمكن أن تبقى حية دون إنبات مدة طويلة حتى تتهيأ لها الظروف الملائمة.\n\n4. (مستوى المعرفة) ما الأداة التي نقيس بها طول البذرة؟\n   الإجابة النموذجية: المسطرة.\n5. (مستوى التطبيق) لماذا قسنا البذرة قبل نقعها؟\n   الإجابة النموذجية: لنقارن قياسها بعد النقع ونعرف التغير الذي حدث.\n6. (مستوى الاستدلال) كيف تجعل نتيجة هذا النشاط أكثر موثوقية؟\n   الإجابة النموذجية: بنقع عدد من البذور بدل بذرة واحدة وقياسها جميعًا.", "للطالب: قراءة كتاب الطالب ص18 ومراجعة مفردات (الإنبات، يذبل، يمتص)، وإحضار بذرة فول جافة للحصة القادمة. لولي الأمر: مشاهدة إنبات بذرة مع الابن (مقطع مرئي أو بذرة في قطن مبلل) ومساعدته على وصف المراحل.\nللطالب: الاحتفاظ بجدول التنبؤ، وقراءة نشاط 1-2 ص19 في كتاب الطالب. لولي الأمر: تكرار التجربة في المنزل بنقع بذرتي فول أو حمص ليلة كاملة وملاحظتهما مع الابن صباحًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=2"]}, {"n": 2, "topic": "نتائج نشاط 1-2 وتفسيرها", "f": ["1. يصف التغيرات التي حدثت لبذرة الفول بعد نقعها\n2. يقرر ما إذا كانت ملاحظاته تدعم تنبؤه\n\nمخرج تعليمي آخر: يفسر سبب انتفاخ البذرة وليونتها ودور الماء في بدء الإنبات", "المخرج 1 (يصف التغيرات التي حدثت لبذرة الفول بعد نقعها): فهم\nالمخرج 2 (يقرر ما إذا كانت ملاحظاته تدعم تنبؤه): تقييم\nالمخرج الآخر (يفسر سبب انتفاخ البذرة وليونتها ودور الماء في بدء الإنبات): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: أطباق البذور المنقوعة، مسطرة", "الإنبات، يمتص، الجذر الأول، الساق الأول.", "يطلب المعلم من كل مجموعة قراءة تنبؤها المكتوب أمس، ثم يسأل: «هل تظن أن تنبؤك سيتحقق؟ لنرى!».", "1. • التهيئة: يستعرض المعلم التنبؤات المكتوبة، والطلبة يقرؤون تنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الملاحظة والقياس: يوجه المعلم إلى إخراج البذور وقياسها ولمسها، والطلبة يقيسون الطول ويصفون الملمس والشكل ويكملون عمود «بعد النقع» (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • المقارنة والتفسير: يسأل المعلم: هل دعمت الملاحظات تنبؤاتكم؟ لماذا انتفخت البذرة؟ والطلبة يقارنون ويفسرون: دخل الماء إلى البذرة فانتفخت ولانت (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة الكتاب ص19: ين لأولية، الجذور الجانبية، والطلبة يشاهدون ويصفون كل مرحلة واتجاه نمو الجذر والساق (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. • ترتيب البطاقات: يوزع المعلم بطاقات مراحل الإنبات مبعثرة على المجموعات، والطلبة يرتبون البطاقات ويعرضون ترتيبهم ويبررونه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • بذور تنتظر سنوات: يناقش المعلم مثال بذور اللوتس ص18 (بذور عمرها 1300 عام نبتت)، والطلبة يستنتجون أن البذور تبقى حية حتى تتهيأ لها الظروف (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • ملاحظة البذرة الجافة: يوزع المعلم البذور والمساطر ويطلب وصفًا دقيقًا، والطلبة يقيسون طول البذرة ويصفون لونها وملمسها ويرسمونها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. • كتابة التنبؤ: يرسم المعلم على السبورة جدولًا (قبل النقع / التنبؤ / بعد النقع)، والطلبة ينقلون الجدول ويكتب كل طالب تنبؤه مع سببه (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. • إعداد النقع: يوجه المجموعات وفق خطوات نشاط 1-2 ص19، والطلبة يضعون البذرة في طبق به ماء ويكتبون اسم المجموعة عليه (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. • مناقشة: يسأل المعلم: من أين سيدخل الماء إلى البذرة؟ كيف سنعرف أن تنبؤنا صحيح؟ والطلبة يقترحون الندبة ويقترحون القياس والمقارنة غدًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. • الغلق: يذكّر المعلم بموعد الملاحظة في الحصة القادمة، والطلبة يرتبون الأدوات ويحفظون الأطباق في مكان آمن (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: نتائج نشاط 1-2 وتفسيرها — زمن الحصة 40 دقيقة\n1. • التهيئة: يستعرض المعلم التنبؤات المكتوبة، والطلبة يقرؤون تنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الملاحظة والقياس: يوجه المعلم إلى إخراج البذور وقياسها ولمسها، والطلبة يقيسون الطول ويصفون الملمس والشكل ويكملون عمود «بعد النقع» (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • المقارنة والتفسير: يسأل المعلم: هل دعمت الملاحظات تنبؤاتكم؟ لماذا انتفخت البذرة؟ والطلبة يقارنون ويفسرون: دخل الماء إلى البذرة فانتفخت ولانت (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة الكتاب ص19: يناقش المعلم الأسئلة (1–5)، والطلبة يجيبون: تمتص الماء لبدء الإنبات، الجذر الأول ينمو أولًا للأسفل لتثبيت النبات والحصول على الماء، الساق للأعلى نحو الضوء (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: الإنبات ومراحله\n1. (مستوى المعرفة) ما أول جزء يظهر من البذرة عند الإنبات؟\n   الإجابة النموذجية: الجذر الأول.\n2. (مستوى التطبيق) رتّب: ينمو الساق الأول – تمتص البذرة الماء – تبدأ الأوراق الأولية – يظهر الجذر الأول.\n   الإجابة النموذجية: تمتص البذرة الماء ← يظهر الجذر الأول ← ينمو الساق الأول ← تبدأ الأوراق الأولية.\n3. (مستوى الاستدلال) لماذا تذبل البذرة ويصغر حجمها بعد الإنبات؟\n   الإجابة النموذجية: لأن مخزون الغذاء فيها يُستهلك أثناء الإنبات.\n\n4. (مستوى المعرفة) ماذا وضعنا مع بذرة الفول في الطبق؟\n   الإجابة النموذجية: ماءً.\n5. (مستوى التطبيق) اذكر تنبؤًا واحدًا لما سيحدث للبذرة بعد نقعها.\n   الإجابة النموذجية: تكبر/تنتفخ، أو تصبح لينة، أو يتجعد غلافها.\n6. (مستوى الاستدلال) كيف نتحقق من صحة تنبؤنا؟\n   الإجابة النموذجية: نقيس البذرة ونصفها بعد النقع ونقارن بالقياس قبل النقع.\n\nالحصة 2: نتائج نشاط 1-2 وتفسيرها\n1. (مستوى المعرفة) كيف أصبح ملمس البذرة بعد نقعها؟\n   الإجابة النموذجية: لينة (أكثر ليونة).\n2. (مستوى التطبيق) لماذا تحتاج البذور إلى امتصاص الماء؟\n   الإجابة النموذجية: لكي تبدأ عملية الإنبات.\n3. (مستوى الاستدلال) هل دعمت ملاحظاتك تنبؤك؟ وضّح كيف قررت ذلك.\n   الإجابة النموذجية: تقبل إجابة تقارن التنبؤ بالقياس الفعلي (مثل: تنبأت أنها ستكبر وزاد طولها من … إلى …).", "الحصة 1: الإنبات ومراحله\n1. (مستوى المعرفة) صح أم خطأ: ينمو الجذر الأول متجهًا إلى أعلى.\n   الإجابة النموذجية: خطأ؛ ينمو إلى الأسفل.\n2. (مستوى التطبيق) عرّف الإنبات.\n   الإجابة النموذجية: بدء البذرة في النمو عندما تتوافر لها الظروف الملائمة.\n3. (مستوى الاستدلال) نبتت بذور لوتس عمرها 1300 عام، ماذا يدل ذلك؟\n   الإجابة النموذجية: أن البذور يمكن أن تبقى حية دون إنبات مدة طويلة حتى تتهيأ لها الظروف الملائمة.\n\n4. (مستوى المعرفة) ما الأداة التي نقيس بها طول البذرة؟\n   الإجابة النموذجية: المسطرة.\n5. (مستوى التطبيق) لماذا قسنا البذرة قبل نقعها؟\n   الإجابة النموذجية: لنقارن قياسها بعد النقع ونعرف التغير الذي حدث.\n6. (مستوى الاستدلال) كيف تجعل نتيجة هذا النشاط أكثر موثوقية؟\n   الإجابة النموذجية: بنقع عدد من البذور بدل بذرة واحدة وقياسها جميعًا.\n\nالحصة 2: نتائج نشاط 1-2 وتفسيرها\n1. (مستوى المعرفة) صح أم خطأ: يزداد حجم البذرة بعد نقعها في الماء.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) إلى أي اتجاه ينمو الساق الأول؟ ولماذا؟\n   الإجابة النموذجية: إلى أعلى؛ ليشق التربة ويصل إلى الضوء.\n3. (مستوى الاستدلال) لماذا تبدأ الأوراق الجديدة النمو فوق سطح التربة؟\n   الإجابة النموذجية: لأنها تحتاج إلى الضوء لتصنع غذاء النبات.", "الحصة 1: الإنبات ومراحله\nللطالب: قراءة كتاب الطالب ص18 ومراجعة مفردات (الإنبات، يذبل، يمتص)، وإحضار بذرة فول جافة للحصة القادمة. لولي الأمر: مشاهدة إنبات بذرة مع الابن (مقطع مرئي أو بذرة في قطن مبلل) ومساعدته على وصف المراحل.\nللطالب: الاحتفاظ بجدول التنبؤ، وقراءة نشاط 1-2 ص19 في كتاب الطالب. لولي الأمر: تكرار التجربة في المنزل بنقع بذرتي فول أو حمص ليلة كاملة وملاحظتهما مع الابن صباحًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=2\n\nالحصة 2: نتائج نشاط 1-2 وتفسيرها\nللطالب: حل تمرين 1-2 بكتاب النشاط ص17 (ترتيب صور مراحل الإنبات)، ومراجعة إجابات أسئلة ص19. لولي الأمر: مناقشة الابن في سبب انتفاخ البقوليات عند نقعها قبل الطهي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=2"]}, {"code": "1-3", "title": "استقصاء عملية الإنبات", "unit": 1, "dates": "الأسبوع الثاني (13–17/9/2026م)", "sb": "20–21", "tb": "22–24", "ab": "تمرين 1-3 ص18، ورقة العمل 1-3 ص55", "periods": [{"n": 1, "topic": "نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟ + نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)", "f": ["1. يذكر ما تحتاجه البذور لكي تنبت\n2. ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات\n3. يخطط لاستقصاء أثر الماء والدفء في إنبات البذور\n4. يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل\n\nمخرج تعليمي آخر:\nيحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء\nيصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام", "المخرج 1 (يذكر ما تحتاجه البذور لكي تنبت): تذكر\nالمخرج 2 (ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات): تطبيق\nالمخرج 3 (يخطط لاستقصاء أثر الماء والدفء في إنبات البذور): تطبيق\nالمخرج 4 (يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل): تحليل\nالمخرج الآخر (يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء): تحليل\nالمخرج الآخر (يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام): إبداع", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: 20 بذرة صغيرة (عدس أو ماش)، مناديل ورقية، طبقان، كيسان بلاستيكيان، ماصة، رباط مطاطي، ماء\nالكتاب، السبورة الذكية، الأقلام، أخرى: 4 علب زجاجية، 20 بذرة، تربة جافة، مخبار مدرج، ماء، ملصقات أرقام", "الظروف الملائمة، الإنبات، الاختبار العادل.، الاختبار العادل، المتغير.", "يعرض المعلم صورة الطالبات ص20 ويقرأ تساؤلاتهن: «هل يمكن أن تنبت البذور بدون ماء أو ضوء؟ هل تنبت في جو حار جدًا أو بارد جدًا؟»، ثم يبني مع الطلاب مخططًا ذهنيًا لما تحتاجه البذور.", "1. • التهيئة: يعرض المعلم الصورة ويطرح التساؤلات، والطلبة يقدمون أفكارهم حول احتياجات البذور (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مخطط ذهني: يناقش المعلم العوامل اللازمة لنمو الإنسان والحيوان ثم البذور، ويدوّنها في مخطط ذهني، والطلبة يقترحون: ماء، دفء، هواء، ضوء… ويصنفونها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تنفيذ نشاط 1-3أ: يوجه المجموعات خطوة بخطوة وفق ص20، ويوضح طريقة شفط الهواء بالماصة وإحكام الكيس، والطلبة يضعون 10 بذور على منديل رطب في كل طبق، ويغطونهما، ويضعونهما في كيسين، ويشفطون الهواء من أحدهما ويغلقون الآخر وفيه الهواء (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. • التنبؤ وضبط المتغيرات: يسأل المعلم: ما الشيء الوحيد المختلف بين الكيسين؟ وما الأشياء المتساوية؟ والطلبة يسجلون تنبؤهم ويحددون المتغير (الهواء) والثوابت (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • حفظ الأدوات: يحدد المعلم مكانًا دافئًا واحدًا للكيسين، ويذكّر بقواعد السلامة، والطلبة يضعون الكيسين في المكان المحدد وينظفون أماكنهم (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • قراءة النشاط: يقرأ المعلم خطوات نشاط 1-3ب ص21 ويحدد الهدف، والطلبة يحددون ما سيختبرونه: الماء والدفء (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. • إعداد العلب الأربع: يتابع المعلم الترقيم وتساوي كمية التربة، ويقيس الماء بالمخبار، والطلبة يرقمون العلب 1–4، ويملؤونها بتربة متساوية، ويضعون 5 بذور ظاهرة على جوانب كل علبة، ويرطبون 1 و2، ويضعون 1 و3 في مكان دافئ و2 و4 في مكان بارد (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. • تصميم جدول التسجيل: يناقش المعلم أعمدة الجدول (رقم العلبة، الظروف، عدد البذور النابتة في كل يوم ملاحظة)، والطلبة يرسمون الجدول في دفاترهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. • مناقشة الاختبار العادل: يناقش المعلم السؤالين (1) و(2ج) ص21، والطلبة يذكرون كيف يكون الاختبار عادلًا ولماذا 40 بذرة أفضل من 20 (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. • الغلق: يوزع المعلم أدوار الترطيب والملاحظة كل يومين، والطلبة يسجلون أدوارهم (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما الشيء الذي أزلناه من أحد الكيسين؟\n   الإجابة النموذجية: الهواء.\n2. (مستوى التطبيق) ما الأشياء التي جعلناها متساوية في الكيسين؟\n   الإجابة النموذجية: عدد البذور، ونوعها، والمناديل الرطبة، والمكان الدافئ.\n3. (مستوى الاستدلال) لماذا وضعنا كيسًا ثانيًا فيه هواء؟\n   الإجابة النموذجية: للمقارنة؛ حتى نعرف أن الفرق في النتائج سببه الهواء فقط (اختبار عادل).\n\n4. (مستوى المعرفة) ما رقما العلبتين اللتين رطّبنا تربتهما؟\n   الإجابة النموذجية: العلبتان 1 و2.\n5. (مستوى التطبيق) ما العاملان اللذان نختبرهما في هذا الاستقصاء؟\n   الإجابة النموذجية: الماء والدفء.\n6. (مستوى الاستدلال) لماذا تكون النتائج أفضل إذا استخدمنا 40 بذرة بدلًا من 20؟\n   الإجابة النموذجية: لأن العدد الأكبر يعطي أدلة أكثر ونتائج أكثر موثوقية.", "1. (مستوى المعرفة) صح أم خطأ: نستخدم الماصة لشفط الهواء من الكيس.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ: في أي الكيسين ستنبت البذور؟\n   الإجابة النموذجية: في الكيس الذي يحتوي على الهواء.\n3. (مستوى الاستدلال) لماذا وضعنا الكيسين في المكان الدافئ نفسه؟\n   الإجابة النموذجية: حتى يكون الاختبار عادلًا ولا يؤثر اختلاف الدفء في النتيجة.\n\n4. (مستوى المعرفة) أين وضعنا العلبتين 2 و4؟\n   الإجابة النموذجية: في مكان بارد.\n5. (مستوى التطبيق) كيف نتأكد أن اختبارنا عادل؟\n   الإجابة النموذجية: نستخدم الكمية نفسها من التربة، والعدد والنوع نفسيهما من البذور، والكمية نفسها من الماء للعلب المرطبة، ونغير عاملًا واحدًا فقط في كل مقارنة.\n6. (مستوى الاستدلال) هل يوضح هذا الاستقصاء ما إذا كانت البذور تحتاج إلى الهواء؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن جميع العلب تحتوي على الهواء، فلا توجد علبة بلا هواء للمقارنة.", "للطالب: قراءة كتاب الطالب ص20، وكتابة ثلاثة أسئلة يريد معرفة إجابتها عن إنبات البذور. لولي الأمر: تذكير الابن بإحضار تربة جافة وعلب زجاجية فارغة (إن أمكن) لنشاط الحصة القادمة.\nللطالب: متابعة ترطيب العلبتين 1 و2 حسب الجدول، وتسجيل الملاحظات كل يومين مدة ثمانية أيام. لولي الأمر: سؤال الابن يوميًا عن ملاحظاته على البذور وتشجيعه على الدقة في التسجيل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=3"]}, {"n": 2, "topic": "تحليل نتائج الإنبات والاستنتاج", "f": ["1. يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء\n2. يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء\n\nمخرج تعليمي آخر: يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات", "المخرج 1 (يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء): تحليل\nالمخرج 2 (يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء): فهم\nالمخرج الآخر (يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات): إبداع", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: كيسا نشاط 1-3أ، عدسة مكبرة", "الإنبات، الظروف الملائمة، الاستنتاج.", "يحضر المعلم كيسي نشاط 1-3أ مغلقين ويطلب من الطلاب تذكّر تنبؤاتهم قبل فتحهما وملاحظة البذور.", "1. • التهيئة: يعرض المعلم الكيسين ويستدعي التنبؤات، والطلبة يتذكرون تنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • نتائج نشاط 1-3أ: يوجه المعلم إلى ملاحظة البذور في الكيسين بالعدسة، والطلبة يلاحظون إنبات البذور في الكيس الذي به هواء وعدم إنباتها في الكيس الخالي، ويستنتجون حاجتها للهواء (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • تحليل بيانات: يقدم المعلم تمرين 1-3 بكتاب النشاط ص18 (بذور وُضعت في أماكن مختلفة)، والطلبة يحللون البيانات ويحددون الأماكن التي توافرت فيها ظروف الإنبات (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة الكتاب ص21: يناقش المعلم الأسئلة (3، 4، 5أ)، والطلبة يستنتجون: البذور تحتاج إلى ماء ودفء وهواء ولا تحتاج إلى ضوء (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تخطيط اختبار الضوء: يطلب المعلم تخطيطًا مختصرًا للسؤال (5ب)، والطلبة يقترحون علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء بالدفء نفسه (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) هل نبتت البذور في الكيس الخالي من الهواء؟\n   الإجابة النموذجية: لا.\n2. (مستوى التطبيق) اذكر ثلاثة أشياء تحتاجها البذور لتنبت.\n   الإجابة النموذجية: الماء، والدفء، والهواء.\n3. (مستوى الاستدلال) هل تحتاج البذور إلى الضوء لتنبت؟ كيف تتحقق من ذلك؟\n   الإجابة النموذجية: لا تحتاج؛ نتحقق بوضع علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء مع تثبيت الماء والدفء ونقارن الإنبات.", "1. (مستوى المعرفة) أكمل: تنبت البذور عندما تتوافر لها الظروف ……\n   الإجابة النموذجية: الملائمة.\n2. (مستوى التطبيق) لماذا تنبت معظم البذور في فصل الربيع؟\n   الإجابة النموذجية: لتوافر الدفء والرطوبة (الماء) والهواء.\n3. (مستوى الاستدلال) نبتت بذور في درج مظلم دافئ ولم تنبت بذور في المجمّد، ماذا تستنتج؟\n   الإجابة النموذجية: الضوء غير لازم للإنبات، بينما الدفء لازم.", "للطالب: حل تمرين 1-3 بكتاب النشاط ص18، والطلاب المتميزون: ورقة العمل 1-3 (تخطيط استقصاء حول نمو البذور) ص55، مع الاستمرار في متابعة علب نشاط 1-3ب. لولي الأمر: مناقشة الابن في سبب زراعة المحاصيل في مواسم محددة من السنة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=3"]}], "combined": ["الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. يذكر ما تحتاجه البذور لكي تنبت\n2. ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات\n3. يخطط لاستقصاء أثر الماء والدفء في إنبات البذور\n4. يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل\n\nمخرج تعليمي آخر:\nيحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء\nيصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\n1. يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء\n2. يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء\n\nمخرج تعليمي آخر: يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالمخرج 1 (يذكر ما تحتاجه البذور لكي تنبت): تذكر\nالمخرج 2 (ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات): تطبيق\nالمخرج 3 (يخطط لاستقصاء أثر الماء والدفء في إنبات البذور): تطبيق\nالمخرج 4 (يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل): تحليل\nالمخرج الآخر (يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء): تحليل\nالمخرج الآخر (يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام): إبداع\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\nالمخرج 1 (يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء): تحليل\nالمخرج 2 (يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء): فهم\nالمخرج الآخر (يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات): إبداع", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالتعلم بالاكتشاف، التعلم التعاوني، العصف الذهني، التعلم المبني على حل المشكلات\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\nالتعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: 20 بذرة صغيرة (عدس أو ماش)، مناديل ورقية، طبقان، كيسان بلاستيكيان، ماصة، رباط مطاطي، ماء\nالكتاب، السبورة الذكية، الأقلام، أخرى: 4 علب زجاجية، 20 بذرة، تربة جافة، مخبار مدرج، ماء، ملصقات أرقام\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: كيسا نشاط 1-3أ، عدسة مكبرة", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالظروف الملائمة، الإنبات، الاختبار العادل.، الاختبار العادل، المتغير.\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\nالإنبات، الظروف الملائمة، الاستنتاج.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nيعرض المعلم صورة الطالبات ص20 ويقرأ تساؤلاتهن: «هل يمكن أن تنبت البذور بدون ماء أو ضوء؟ هل تنبت في جو حار جدًا أو بارد جدًا؟»، ثم يبني مع الطلاب مخططًا ذهنيًا لما تحتاجه البذور.\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\nيحضر المعلم كيسي نشاط 1-3أ مغلقين ويطلب من الطلاب تذكّر تنبؤاتهم قبل فتحهما وملاحظة البذور.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟ — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصورة ويطرح التساؤلات، والطلبة يقدمون أفكارهم حول احتياجات البذور (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مخطط ذهني: يناقش المعلم العوامل اللازمة لنمو الإنسان والحيوان ثم البذور، ويدوّنها في مخطط ذهني، والطلبة يقترحون: ماء، دفء، هواء، ضوء… ويصنفونها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تنفيذ نشاط 1-3أ: يوجه المجموعات خطوة بخطوة وفق ص20، ويوضح طريقة شفط الهواء بالماصة وإحكام الكيس، والطلبة يضعون 10 بذور على منديل رطب في كل طبق، ويغطونهما، ويضعونهما في كيسين، ويشفطون الهواء من أحدهما ويغلقون الآخر وفيه الهواء (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. • التنبؤ وضبط المتغيرات: يسأل المعلم: ما الشيء الوحيد المختلف بين الكيسين؟ وما الأشياء المتساوية؟ والطلبة يسجلون تنبؤهم ويحددون المتغير (الهواء) والثوابت (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • حفظ الأدوات: يحدد المعلم مكانًا دافئًا واحدًا للكيسين، ويذكّر بقواعد السلامة، والطلبة يضعون الكيسين في المكان المحدد وينظفون أماكنهم (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • قراءة النشاط: يقرأ المعلم خطوات نشاط 1-3ب ص21 ويحدد الهدف، والطلبة يحددون ما سيختبرونه: الماء والدفء (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. • إعداد العلب الأربع: يتابع المعلم الترقيم وتساوي كمية التربة، ويقيس الماء بالمخبار، والطلبة يرقمون العلب 1–4، ويملؤونها بتربة متساوية، ويضعون 5 بذور ظاهرة على جوانب كل علبة، ويرطبون 1 و2، ويضعون 1 و3 في مكان دافئ و2 و4 في مكان بارد (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. • تصميم جدول التسجيل: يناقش المعلم أعمدة الجدول (رقم العلبة، الظروف، عدد البذور النابتة في كل يوم ملاحظة)، والطلبة يرسمون الجدول في دفاترهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. • مناقشة الاختبار العادل: يناقش المعلم السؤالين (1) و(2ج) ص21، والطلبة يذكرون كيف يكون الاختبار عادلًا ولماذا 40 بذرة أفضل من 20 (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. • الغلق: يوزع المعلم أدوار الترطيب والملاحظة كل يومين، والطلبة يسجلون أدوارهم (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الكيسين ويستدعي التنبؤات، والطلبة يتذكرون تنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • نتائج نشاط 1-3أ: يوجه المعلم إلى ملاحظة البذور في الكيسين بالعدسة، والطلبة يلاحظون إنبات البذور في الكيس الذي به هواء وعدم إنباتها في الكيس الخالي، ويستنتجون حاجتها للهواء (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • تحليل بيانات: يقدم المعلم تمرين 1-3 بكتاب النشاط ص18 (بذور وُضعت في أماكن مختلفة)، والطلبة يحللون البيانات ويحددون الأماكن التي توافرت فيها ظروف الإنبات (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة الكتاب ص21: يناقش المعلم الأسئلة (3، 4، 5أ)، والطلبة يستنتجون: البذور تحتاج إلى ماء ودفء وهواء ولا تحتاج إلى ضوء (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تخطيط اختبار الضوء: يطلب المعلم تخطيطًا مختصرًا للسؤال (5ب)، والطلبة يقترحون علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء بالدفء نفسه (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. (مستوى المعرفة) ما الشيء الذي أزلناه من أحد الكيسين؟\n   الإجابة النموذجية: الهواء.\n2. (مستوى التطبيق) ما الأشياء التي جعلناها متساوية في الكيسين؟\n   الإجابة النموذجية: عدد البذور، ونوعها، والمناديل الرطبة، والمكان الدافئ.\n3. (مستوى الاستدلال) لماذا وضعنا كيسًا ثانيًا فيه هواء؟\n   الإجابة النموذجية: للمقارنة؛ حتى نعرف أن الفرق في النتائج سببه الهواء فقط (اختبار عادل).\n\n4. (مستوى المعرفة) ما رقما العلبتين اللتين رطّبنا تربتهما؟\n   الإجابة النموذجية: العلبتان 1 و2.\n5. (مستوى التطبيق) ما العاملان اللذان نختبرهما في هذا الاستقصاء؟\n   الإجابة النموذجية: الماء والدفء.\n6. (مستوى الاستدلال) لماذا تكون النتائج أفضل إذا استخدمنا 40 بذرة بدلًا من 20؟\n   الإجابة النموذجية: لأن العدد الأكبر يعطي أدلة أكثر ونتائج أكثر موثوقية.\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\n1. (مستوى المعرفة) هل نبتت البذور في الكيس الخالي من الهواء؟\n   الإجابة النموذجية: لا.\n2. (مستوى التطبيق) اذكر ثلاثة أشياء تحتاجها البذور لتنبت.\n   الإجابة النموذجية: الماء، والدفء، والهواء.\n3. (مستوى الاستدلال) هل تحتاج البذور إلى الضوء لتنبت؟ كيف تتحقق من ذلك؟\n   الإجابة النموذجية: لا تحتاج؛ نتحقق بوضع علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء مع تثبيت الماء والدفء ونقارن الإنبات.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. (مستوى المعرفة) صح أم خطأ: نستخدم الماصة لشفط الهواء من الكيس.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ: في أي الكيسين ستنبت البذور؟\n   الإجابة النموذجية: في الكيس الذي يحتوي على الهواء.\n3. (مستوى الاستدلال) لماذا وضعنا الكيسين في المكان الدافئ نفسه؟\n   الإجابة النموذجية: حتى يكون الاختبار عادلًا ولا يؤثر اختلاف الدفء في النتيجة.\n\n4. (مستوى المعرفة) أين وضعنا العلبتين 2 و4؟\n   الإجابة النموذجية: في مكان بارد.\n5. (مستوى التطبيق) كيف نتأكد أن اختبارنا عادل؟\n   الإجابة النموذجية: نستخدم الكمية نفسها من التربة، والعدد والنوع نفسيهما من البذور، والكمية نفسها من الماء للعلب المرطبة، ونغير عاملًا واحدًا فقط في كل مقارنة.\n6. (مستوى الاستدلال) هل يوضح هذا الاستقصاء ما إذا كانت البذور تحتاج إلى الهواء؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن جميع العلب تحتوي على الهواء، فلا توجد علبة بلا هواء للمقارنة.\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\n1. (مستوى المعرفة) أكمل: تنبت البذور عندما تتوافر لها الظروف ……\n   الإجابة النموذجية: الملائمة.\n2. (مستوى التطبيق) لماذا تنبت معظم البذور في فصل الربيع؟\n   الإجابة النموذجية: لتوافر الدفء والرطوبة (الماء) والهواء.\n3. (مستوى الاستدلال) نبتت بذور في درج مظلم دافئ ولم تنبت بذور في المجمّد، ماذا تستنتج؟\n   الإجابة النموذجية: الضوء غير لازم للإنبات، بينما الدفء لازم.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nللطالب: قراءة كتاب الطالب ص20، وكتابة ثلاثة أسئلة يريد معرفة إجابتها عن إنبات البذور. لولي الأمر: تذكير الابن بإحضار تربة جافة وعلب زجاجية فارغة (إن أمكن) لنشاط الحصة القادمة.\nللطالب: متابعة ترطيب العلبتين 1 و2 حسب الجدول، وتسجيل الملاحظات كل يومين مدة ثمانية أيام. لولي الأمر: سؤال الابن يوميًا عن ملاحظاته على البذور وتشجيعه على الدقة في التسجيل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=3\n\nالحصة 2: تحليل نتائج الإنبات والاستنتاج\nللطالب: حل تمرين 1-3 بكتاب النشاط ص18، والطلاب المتميزون: ورقة العمل 1-3 (تخطيط استقصاء حول نمو البذور) ص55، مع الاستمرار في متابعة علب نشاط 1-3ب. لولي الأمر: مناقشة الابن في سبب زراعة المحاصيل في مواسم محددة من السنة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=3"]}, {"code": "1-4", "title": "ماذا يحتاج النبات كي ينمو؟", "unit": 1, "dates": "الأسبوع الثاني (13–17/9/2026م)", "sb": "22–23", "tb": "25–26", "ab": "تمرين 1-4 ص20، ورقة العمل 1-4 ص57", "periods": [{"n": 1, "topic": "العوامل اللازمة لنمو النبات", "f": ["1. يذكر العوامل التي يحتاجها النبات لينمو: الطاقة الضوئية والهواء والماء والدفء\n2. يوضح أهمية كل عامل من عوامل نمو النبات\nمخرج تعليمي آخر: يقارن بين نبات صحي ونبات ذابل ويحدد العامل الناقص", "المخرج 1 (يذكر العوامل التي يحتاجها النبات لينمو: الطاقة الضوئية والهواء والماء والدفء): تذكر\nالمخرج 2 (يوضح أهمية كل عامل من عوامل نمو النبات): فهم\nالمخرج الآخر (يقارن بين نبات صحي ونبات ذابل ويحدد العامل الناقص): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: أصيص نبات صحي وأصيص نبات ذابل، بطاقات حالات نباتات", "العوامل، الطاقة الضوئية.", "يعرض المعلم صورة النباتين (1) و(2) ص22 أو أصيصين حقيقيين، ويسأل: «أي النباتين ينمو جيدًا؟ ماذا ينقص الآخر في رأيك؟».", "1. • التهيئة: يعرض المعلم النباتين ويطرح السؤال، والطلبة يقارنون ويقترحون العامل الناقص (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • العوامل الأربعة: يقدم المعلم مفهوم العوامل ويعلّم اختصار «ضهمد» (ضوء، هواء، ماء، دفء)، والطلبة يرددون الاختصار ويربطونه بإنبات البذور في الدرس السابق (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • أهمية كل عامل: يقرأ المعلم مع الطلاب ص22: الماء يقوي الساق والأوراق وينقل الغذاء، والدفء يناسب النمو، والضوء طاقة لصنع الغذاء في الأوراق، والهواء ضروري للنبات الحي، والطلبة يكملون جدولًا: العامل – أهميته للنبات (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • بطاقات الحالات: يوزع المعلم بطاقات (نبات في خزانة مظلمة، نبات لم يُروَ أسبوعًا، نبات في ثلاجة…)، وتحدد كل مجموعة العامل الناقص وتتوقع شكل النبات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تحدث عن: يطرح المعلم سؤال ص23: هل تحتاج النباتات إلى تربة؟ والطلبة يناقشون أمثلة كاللوتس وزنبق الماء والزراعة المائية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يطرح المعلم سؤالًا ختاميًا، والطلبة يذكرون العوامل الأربعة ومثالًا لأهمية كل منها (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرفة) ما الاختصار الذي يساعدنا على تذكر عوامل نمو النبات؟\n   الإجابة النموذجية: «ضهمد»: ضوء، هواء، ماء، دفء.\n2. (مستوى التطبيق) لماذا يحتاج النبات إلى الماء؟\n   الإجابة النموذجية: ليكون له ساق قوية وأوراق ثابتة، ولنقل المواد مثل الغذاء إلى أجزائه.\n3. (مستوى الاستدلال) نبات طويل نحيف أصفر الأوراق، ما العامل الناقص على الأرجح؟\n   الإجابة النموذجية: الطاقة الضوئية.", "1. (مستوى المعرفة) صح أم خطأ: تصنع النباتات غذاءها بنفسها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) من أين يحصل النبات على الطاقة اللازمة لصنع غذائه؟\n   الإجابة النموذجية: من ضوء الشمس (الطاقة الضوئية) في أوراقه.\n3. (مستوى الاستدلال) هل تحتاج كل النباتات إلى تربة لتنمو؟ أعطِ مثالًا.\n   الإجابة النموذجية: لا؛ فاللوتس وزنبق الماء تنمو في الماء.", "للطالب: قراءة كتاب الطالب ص22، ومراجعة جدول نشاط 1-4 ص23 استعدادًا لرسم التمثيل البياني. لولي الأمر: إحضار ورقة مربعات ومسطرة، وملاحظة نبات في المنزل أو الحي مع الابن ووصف حالته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.gith
