 «هذه الزهرة ليست ملونة ولا رائحة لها، فكيف تُلقّح؟».\n\nالحصة 3: الإخصاب وتكوين الثمار والبذور\nيعرض المعلم الصور الثلاث لنبات الطماطم ص37 (زهرة ← ثمرة صغيرة ← ثمرة ناضجة) ويسأل: «بعد التلقيح، ماذا يحدث داخل الزهرة حتى تظهر هذه الثمرة؟».\n\nالحصة 4: محاكاة التلقيح وأسئلة الدرس\nيوزع المعلم «أزهارًا ورقية» في وسط بعضها مسحوق طباشير ملون، ويخبر الطلاب أنهم سيكونون «نحلًا» يبحث عن الرحيق.", "الحصة 1: مفهوم التلقيح — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم السؤال ويعرض المقطع، والطلبة يصفون ما يفعله المزارع (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعريف التلقيح: يقرأ المعلم مع الطلاب ص36 ويوضح: التلقيح نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه، والطلبة يكتبون التعريف ويحددون على نموذج الزهرة مسار حبوب اللقاح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • نمذجة المسار: يرسم المعلم زهرتين على السبورة ويرسم سهمًا من متك الأولى إلى ميسم الثانية، والطلبة يرسمون المخطط ويسمّون الجزء المرسل والجزء المستقبل (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • الربط بالنخيل: يوضح المعلم أن المزارع ينقل حبوب اللقاح من النخلة الذكر (الفحل) إلى أزهار النخلة الأنثى، والطلبة يناقشون: لماذا يحتاج المزارع لفعل ذلك؟ (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • التلقيح بالحشرات: يشرح المعلم ص36: تتغذى الحشرات على الرحيق (سائل حلو المذاق)، فتعلق بها حبوب اللقاح وتنقلها إلى ميسم زهرة أخرى، والطلبة يرسمون مخطط تسلسل لرحلة النحلة بين زهرتين (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • صفات الأزهار: يعرض المعلم صورًا لأزهار تلقحها الحشرات، والطلبة يستنتجون الصفات: بتلات زاهية الألوان، رائحة، رحيق (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. • تأمل الآية: يناقش المعلم معنى الآية: النحل يأكل من الثمرات ويخرج العسل الذي فيه شفاء، والطلبة يربطون بين تغذي النحل على الرحيق وإنتاج العسل وتلقيح الأزهار (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • الغلق: يسأل المعلم: لماذا تحتاج الزهرة إلى ألوان ورائحة؟ والطلبة يجيبون: لجذب الحشرات (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟ — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون الرياح (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • صفات أزهار الرياح: يشرح المعلم ص36: غير زاهية، لا بتلات أو رائحة، تنتج كثيرًا من حبوب اللقاح الخفيفة، والطلبة يكتبون الصفات ويقارنونها بأزهار الحشرات (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 5: يصطحب الطلاب إلى فناء المدرسة ويوجههم وفق ص36، والطلبة ينظرون إلى الأزهار المختلفة، ويرسمون صورًا لها ويسمون أجزاءها، ويحددون كيف يتم تلقيح كل زهرة ولماذا (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • جدول مقارنة: يرسم المعلم جدولًا للمقارنة، والطلبة يكملون: الحشرات (زاهية، رائحة، رحيق) – الرياح (غير زاهية، بلا رائحة، حبوب لقاح كثيرة) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يحددون نوع تلقيح زهرة معروضة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: الإخصاب وتكوين الثمار والبذور — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصور ويطرح السؤال، والطلبة يتوقعون أن الزهرة تتحول إلى ثمرة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • الإخصاب: يشرح المعلم ص37: تنتقل حبوب اللقاح من الميسم إلى المبيض، وتتحد مع البويضات (الإخصاب)، والطلبة يحددون موقع الإخصاب على رسم الزهرة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • من المبيض إلى الثمرة: يوضح المعلم: بعد الإخصاب تموت البتلات والأسدية، وينمو المبيض ليكوّن الثمرة، وتتحول البويضات المخصبة إلى بذور، والطلبة يرتبون بطاقات: تلقيح ← إخصاب ← ذبول البتلات ← نمو المبيض ← ثمرة بها بذور (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • التلقيح والإخصاب: يكتب المعلم على السبورة جدول مقارنة (أين؟ ماذا يحدث؟)، والطلبة يكملون المقارنة: التلقيح نقل حبوب اللقاح إلى الميسم، والإخصاب اتحادها بالبويضات داخل المبيض (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يسأل المعلم: أي جزء في الزهرة يصبح ثمرة؟ والطلبة يجيبون: المبيض (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: محاكاة التلقيح وأسئلة الدرس — زمن الحصة 40 دقيقة\n1. • التهيئة: يشرح المعلم قواعد المحاكاة، والطلبة يستعدون للعب دور النحل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • المحاكاة: يطلب المعلم من «النحل» زيارة الأزهار بالعود القطني بالترتيب، والطلبة ينقلون المسحوق من زهرة إلى أخرى ويلاحظون انتقال «حبوب اللقاح» إلى الأزهار (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تحليل المحاكاة: يسأل المعلم: ماذا يمثل المسحوق؟ والعود القطني؟ وما حدود هذا النموذج؟ والطلبة يربطون عناصر النموذج بالواقع (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • أسئلة ص37 والتحدي: يناقش المعلم الأسئلة (1–4) والتحدي، والطلبة يجيبون عن تلقيح الحشرات والرياح وكثرة حبوب اللقاح ودور التلقيح والفرق بينه وبين الإخصاب (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مفهوم التلقيح\n1. (مستوى المعرفة) ما التلقيح؟\n   الإجابة النموذجية: نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) إلى أي جزء من الزهرة تنتقل حبوب اللقاح؟\n   الإجابة النموذجية: إلى الميسم.\n3. (مستوى الاستدلال) لماذا يلقح المزارعون النخيل يدويًا؟\n   الإجابة النموذجية: لضمان وصول حبوب اللقاح من الفحل إلى أزهار النخلة الأنثى فتتكون الثمار.\n\n4. (مستوى المعرفة) ما الرحيق؟\n   الإجابة النموذجية: سائل حلو المذاق تصنعه الأزهار وتتغذى عليه الحشرات.\n5. (مستوى التطبيق) اذكر صفتين لأزهار تلقحها الحشرات.\n   الإجابة النموذجية: بتلات زاهية الألوان، رائحة، رحيق (أي اثنتين).\n6. (مستوى الاستدلال) كيف تنتقل حبوب اللقاح من زهرة إلى أخرى بواسطة النحلة؟\n   الإجابة النموذجية: تعلق حبوب اللقاح بجسم النحلة أثناء تغذيها على الرحيق، ثم تسقط على ميسم الزهرة التالية التي تزورها.\n\nالحصة 2: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n1. (مستوى المعرفة) اذكر صفة لزهرة تلقحها الرياح.\n   الإجابة النموذجية: غير زاهية أو بلا رائحة أو تنتج كثيرًا من حبوب اللقاح.\n2. (مستوى التطبيق) زهرة صغيرة خضراء بلا رائحة، كيف تلقح غالبًا؟\n   الإجابة النموذجية: بواسطة الرياح.\n3. (مستوى الاستدلال) لماذا تنتج الأزهار التي تلقحها الرياح كثيرًا من حبوب اللقاح؟\n   الإجابة النموذجية: لأن معظم حبوب اللقاح تضيع في الهواء، فتزيد الكثرة فرصة وصول بعضها إلى ميسم زهرة من النوع نفسه.\n\nالحصة 3: الإخصاب وتكوين الثمار والبذور\n1. (مستوى المعرفة) أين يحدث الإخصاب؟\n   الإجابة النموذجية: داخل المبيض.\n2. (مستوى التطبيق) إلامَ تتحول البويضات المخصبة؟\n   الإجابة النموذجية: إلى بذور.\n3. (مستوى الاستدلال) ما الفرق بين التلقيح والإخصاب؟\n   الإجابة النموذجية: التلقيح نقل حبوب اللقاح من السداة إلى الميسم، والإخصاب اتحاد حبوب اللقاح مع البويضات داخل المبيض.\n\nالحصة 4: محاكاة التلقيح وأسئلة الدرس\n1. (مستوى المعرفة) ماذا يمثل المسحوق الملون في المحاكاة؟\n   الإجابة النموذجية: حبوب اللقاح.\n2. (مستوى التطبيق) لماذا تنتج الأزهار التي تلقحها الرياح كمية كبيرة من حبوب اللقاح الجافة؟\n   الإجابة النموذجية: لأن كثيرًا منها يضيع في الهواء ولا يصل إلى الميسم.\n3. (مستوى الاستدلال) كيف يساعد التلقيح في تكاثر النباتات؟\n   الإجابة النموذجية: يوصل حبوب اللقاح إلى الميسم فتنتقل إلى المبيض وتخصب البويضات فتتكون البذور التي تنمو إلى نباتات جديدة.", "الحصة 1: مفهوم التلقيح\n1. (مستوى المعرفة) أكمل: تنتقل حبوب اللقاح في التلقيح من …… إلى ……\n   الإجابة النموذجية: السداة (المتك)؛ ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) هل يمكن تلقيح زهرة طماطم بحبوب لقاح من زهرة ورد؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن التلقيح يكون بين أزهار من النوع نفسه.\n3. (مستوى الاستدلال) اقترح ما يحدث لمحصول التمر إذا لم يتم تلقيح النخيل.\n   الإجابة النموذجية: يقل المحصول كثيرًا أو لا تتكون الثمار جيدًا.\n\n4. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الحشرات تكون زاهية الألوان غالبًا.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) لماذا تزور الحشرات الأزهار؟\n   الإجابة النموذجية: لتتغذى على الرحيق.\n6. (مستوى الاستدلال) ماذا يحدث للأزهار لو قلّت أعداد النحل في منطقة ما؟\n   الإجابة النموذجية: يقل تلقيح الأزهار فتقل الثمار والبذور.\n\nالحصة 2: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n1. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الرياح لها رحيق كثير.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) قارن بين زهرة تلقحها الحشرات وزهرة تلقحها الرياح من حيث اللون والرائحة.\n   الإجابة النموذجية: الحشرات: زاهية الألوان ذات رائحة. الرياح: غير زاهية بلا رائحة.\n3. (مستوى الاستدلال) لماذا لا تحتاج الأزهار التي تلقحها الرياح إلى بتلات زاهية؟\n   الإجابة النموذجية: لأنها لا تحتاج إلى جذب الحشرات؛ فالرياح تنقل حبوب لقاحها.\n\nالحصة 3: الإخصاب وتكوين الثمار والبذور\n1. (مستوى المعرفة) أكمل: بعد الإخصاب ينمو …… ليكوّن الثمرة.\n   الإجابة النموذجية: المبيض.\n2. (مستوى التطبيق) ماذا يحدث للبتلات والأسدية بعد الإخصاب؟\n   الإجابة النموذجية: تموت (تذبل وتسقط).\n3. (مستوى الاستدلال) هل يمكن أن يحدث الإخصاب دون تلقيح؟ فسّر.\n   الإجابة النموذجية: لا؛ لأن حبوب اللقاح يجب أن تصل أولًا إلى الميسم بالتلقيح ثم تنتقل إلى المبيض لتخصب البويضات.\n\nالحصة 4: محاكاة التلقيح وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: التلقيح والإخصاب عملية واحدة.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا تلقح الحشرات الأزهار الملونة ذات الرحيق والرائحة؟\n   الإجابة النموذجية: لأن الألوان والرائحة تجذبها، والرحيق غذاء لها.\n3. (مستوى الاستدلال) وضّح كيف تنتقل حبوب اللقاح إلى مبيض الزهرة.\n   الإجابة النموذجية: تصل حبوب اللقاح إلى الميسم بالتلقيح، ثم تنتقل عبر القلم إلى المبيض حيث تتحد مع البويضات.", "الحصة 1: مفهوم التلقيح\nللطالب: قراءة كتاب الطالب ص36، وسؤال أحد كبار العائلة عن طريقة تلقيح النخيل. لولي الأمر: التحدث مع الابن عن تلقيح النخيل وموسمه في عُمان.\nللطالب: حفظ الآيتين 68–69 من سورة النحل، وملاحظة حشرات تزور الأزهار في الحديقة. لولي الأمر: مناقشة الابن في فوائد النحل للإنسان والنبات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11\n\nالحصة 2: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nللطالب: إكمال رسومات نشاط 2-5 وتسمية الأجزاء. لولي الأمر: ملاحظة أزهار في الحي مع الابن وتحديد نوع تلقيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11\n\nالحصة 3: الإخصاب وتكوين الثمار والبذور\nللطالب: قراءة كتاب الطالب ص37، ورسم مخطط من التلقيح إلى تكوين البذور. لولي الأمر: فتح ثمرة طماطم مع الابن وملاحظة البذور وربطها بالبويضات المخصبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11\n\nالحصة 4: محاكاة التلقيح وأسئلة الدرس\nللطالب: حل تمرين 2-5 بكتاب النشاط ص27، ومراجعة الفرق بين التلقيح والإخصاب. لولي الأمر: لسبورة ويسأل: «ما أسرع طريقة لنعرف بنظرة واحدة أي الأزهار زارتها الحشرات أكثر؟».", "1. • التهيئة: يعرض المعلم الجدول ويطرح السؤال، والطلبة يقترحون التمثيل البياني (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • رسم التمثيل: يراجع المعلم خطوات رسم الأعمدة، والطلبة يمثلون عدد زيارات الحشرات لكل زهرة بالأعمدة (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة ص39: يناقش المعلم الأسئلة (1–4)، والطلبة يجيبون: الأزهار الأكثر زيارة، الحشرات المترددة، صحة التنبؤات، النمط (الأزهار الزاهية ذات الرائحة أكثر زيارة) وسببه (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • مقارنة: يطلب المعلم من المجموعات مقارنة تمثيلاتها، والطلبة يكتشفون أوجه التشابه والاختلاف (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يلخص المعلم النمط العام، والطلبة يكتبون الاستنتاج (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرفة) ما نوع التمثيل المناسب لعرض عدد زيارات الحشرات لكل زهرة؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة.\n2. (مستوى التطبيق) ما الأزهار التي زارتها الحشرات أكثر في نتائجك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (غالبًا الزاهية ذات الرائحة).\n3. (مستوى الاستدلال) اقترح سببًا للنمط الذي لاحظته.\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق تجذب الحشرات.", "1. (مستوى المعرفة) صح أم خطأ: يجب أن تكون أعمدة التمثيل متساوية العرض.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الحشرات التي تزور الأزهار باستمرار في ملاحظتك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (مثل النحل).\n3. (مستوى الاستدلال) لماذا قد تختلف نتائج مجموعتين لاحظتا الأزهار نفسها؟\n   الإجابة النموذجية: لاختلاف وقت الملاحظة أو أخطاء العدّ أو الطقس؛ لذا نكرر الملاحظة.", "للطالب: إكمال التمثيل البياني وكتابة الاستنتاج، وحل تمرين 2-6 بكتاب النشاط ص28. لولي الأمر: متابعة إنجاز التمرين ومناقشة الاستنتاج مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12"]}, {"n": 4, "topic": "التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6", "f": ["1. يفسر لماذا تلقح الطيور معظم الأزهار الحمراء\n2. يتعرف الأنماط في بيانات ألوان الأزهار والملقحات (ورقة العمل 2-6)\n\nمخرج تعليمي آخر: يتنبأ بالملقح المناسب لزهرة جديدة اعتمادًا على النمط", "المخرج 1 (يفسر لماذا تلقح الطيور معظم الأزهار الحمراء): تحليل\nالمخرج 2 (يتعرف الأنماط في بيانات ألوان الأزهار والملقحات (ورقة العمل 2-6)): تحليل\nالمخرج الآخر (يتنبأ بالملقح المناسب لزهرة جديدة اعتمادًا على النمط): تطبيق", "التعلم المبني على حل المشكلات، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة العمل 2-6 ص71", "الملقحات، النمط، التنبؤ.", "يعرض المعلم صورة الطائر الطنان ص39 يمد منقاره الطويل داخل زهرة حمراء أنبوبية، ويسأل: «لماذا لا تزور الحشرات هذه الزهرة كثيرًا ويزورها الطائر؟».", "1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التحدي ص39: يوجه المعلم للبحث في المصادر عن سبب تلقيح الطيور للأزهار الحمراء، والطلبة يستنتجون أن الطيور ترى اللون الأحمر جيدًا، وأن الزهرة الأنبوبية العميقة يصل منقار الطائر الطويل إلى رحيقها (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • ورقة العمل 2-6: يقدم المعلم ورقة العمل ص71: أي ألوان الأزهار تجذب عددًا أكبر من الملقحات؟ والطلبة يحللون البيانات ويحددون النمط ويضعون تنبؤات (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تحدث عن: يطرح المعلم سؤال العث والأزهار الليلية، والطلبة يناقشون (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) أي الكائنات تلقح معظم الأزهار الحمراء؟\n   الإجابة النموذجية: الطيور (كطائر الطنان).\n2. (مستوى التطبيق) لماذا يناسب منقار الطائر الطويل الأزهار الأنبوبية؟\n   الإجابة النموذجية: لأنه يصل إلى الرحيق في عمق الزهرة.\n3. (مستوى الاستدلال) تنبأ بالملقح المناسب لزهرة بيضاء معطرة تتفتح ليلًا.\n   الإجابة النموذجية: العث.", "1. (مستوى المعرفة) صح أم خطأ: تلقح الطيور بعض الأزهار.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الأزهار حسب ورقة العمل؟\n   الإجابة النموذجية: لون الزهرة ورائحتها ورحيقها.\n3. (مستوى الاستدلال) لماذا تستفيد الزهرة من زيارة ملقح محدد؟\n   الإجابة النموذجية: لأن الملقح ينقل حبوب لقاحها إلى أزهار من النوع نفسه فيزيد فرصة التلقيح.", "للطالب: إكمال ورقة العمل 2-6 ص71، ومراجعة دروس التلقيح استعدادًا لدرس دورة حياة النبات. لولي الأمر: إحضار بذور فول أو عدس لزراعتها ومتابعة دورة حياة النبات في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12"]}], "combined": ["الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n1. يذكر أمثلة لحشرات تلقح الأزهار\n2. يربط بين صفات الزهرة ونوع الحشرة التي تنجذب إليها\n3. يخطط لاستقصاء ميداني لملاحظة الحشرات الملقحة\n4. يصمم جدولًا لتسجيل الملاحظات (اسم الزهرة، وصفها، التنبؤ، الحشرات، عدد المرات)\n\nمخرج تعليمي آخر:\nيتنبأ بالحشرة التي يمكن أن تزور زهرة ما من خلال صفاتها\nيتنبأ بكيفية تلقيح كل زهرة اعتمادًا على صفاتها\n\nالحصة 2: نشاط 2-6: الملاحظة الميدانية للملقحات\n1. يلاحظ الحشرات التي تقف على الأزهار ويعدّ مرات زيارتها\n2. يسجل البيانات بدقة في الجدول\n\nمخرج تعليمي آخر: يقارن ملاحظاته بتنبؤاته\n\nالحصة 3: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n1. يعرض نتائج الملاحظة بتمثيل بياني بالأعمدة\n2. يفسر النمط في الأزهار التي تزورها الحشرات\n\nمخرج تعليمي آخر: يقترح سببًا للنمط الملاحظ\n\nالحصة 4: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n1. يفسر لماذا تلقح الطيور معظم الأزهار الحمراء\n2. يتعرف الأنماط في بيانات ألوان الأزهار والملقحات (ورقة العمل 2-6)\n\nمخرج تعليمي آخر: يتنبأ بالملقح المناسب لزهرة جديدة اعتمادًا على النمط", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\nالمخرج 1 (يذكر أمثلة لحشرات تلقح الأزهار): تذكر\nالمخرج 2 (يربط بين صفات الزهرة ونوع الحشرة التي تنجذب إليها): تحليل\nالمخرج 3 (يخطط لاستقصاء ميداني لملاحظة الحشرات الملقحة): تطبيق\nالمخرج 4 (يصمم جدولًا لتسجيل الملاحظات (اسم الزهرة، وصفها، التنبؤ، الحشرات، عدد المرات)): إبداع\nالمخرج الآخر (يتنبأ بالحشرة التي يمكن أن تزور زهرة ما من خلال صفاتها): تطبيق\nالمخرج الآخر (يتنبأ بكيفية تلقيح كل زهرة اعتمادًا على صفاتها): تطبيق\n\nالحصة 2: نشاط 2-6: الملاحظة الميدانية للملقحات\nالمخرج 1 (يلاحظ الحشرات التي تقف على الأزهار ويعدّ مرات زيارتها): تطبيق\nالمخرج ور والأزهار الحمراء وورقة العمل 2-6\nالملقحات، النمط، التنبؤ.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\nيعرض المعلم الصور الثلاث ص38 (فراشة، خنفساء، نحلة على أزهار مختلفة) ويسأل: «هل تزور كل حشرة أي زهرة؟ لماذا تفضل الفراشة هذه الزهرة؟».\n\nالحصة 2: نشاط 2-6: الملاحظة الميدانية للملقحات\nيجمع المعلم المجموعات عند مدخل الحديقة ويذكّر بقواعد السلامة والأدوار، ويطرح سؤال الملاحظة: «أي الحشرات تزور أزهارنا؟ وكم مرة؟».\n\nالحصة 3: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\nيعرض المعلم جدول بيانات إحدى المجموعات على السبورة ويسأل: «ما أسرع طريقة لنعرف بنظرة واحدة أي الأزهار زارتها الحشرات أكثر؟».\n\nالحصة 4: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\nيعرض المعلم صورة الطائر الطنان ص39 يمد منقاره الطويل داخل زهرة حمراء أنبوبية، ويسأل: «لماذا لا تزور الحشرات هذه الزهرة كثيرًا ويزورها الطائر؟».", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصور ويطرح السؤال، والطلبة يتوقعون أسبابًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الحشرات الملقحة: يقرأ المعلم مع الطلاب ص38: تهوى الفراشات الأزهار الغنية بالرحيق، ويلقح النحل والخنافس والدبابير والنمل والعث الأزهار، والطلبة يكتبون قائمة بالحشرات الملقحة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • مطابقة زهرة وحشرة: يوزع المعلم بطاقات صفات أزهار (أنبوبية طويلة غنية بالرحيق، صفراء صغيرة كثيرة حبوب اللقاح، كبيرة بيضاء معطرة ليلًا…)، والطلبة يطابقون كل زهرة بالحشرة الأنسب ويبررون (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تحدث عن: يطرح المعلم سؤال ص39: العث يلقح الأزهار ليلًا، فما أنواع الأزهار التي يلقحها؟ والطلبة يستنتجون: أزهار فاتحة اللون (بيضاء) قوية الرائحة تُرى في المساء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • قراءة النشاط: يقرأ المعلم خطوات نشاط 2-6 ص38 ويوضح المطلوب، والطلبة يحددون: أربعة أنواع أزهار، ألوان زاهية وغير زاهية، الملاحظة نصف ساعة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • تصميم الجدول: يعرض المعلم نموذج جدول ص39، والطلبة يرسمون الجدول: اسم الزهرة، وصفها، تنبأ كيف يتم تلقيحها، الحشرات التي تقف عليها، عدد المرات (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. • التنبؤ: يعرض المعلم صور أزهار الحديقة، والطلبة يكتبون وصف كل زهرة وتنبؤهم بطريقة تلقيحها (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. • السلامة وتوزيع الأدوار: يوضح المعلم قواعد السلامة (عدم لمس الحشرات، الابتعاد عن خلايا النحل) ويوزع أدوار المراقبة والتوقيت والتسجيل؛ الغلق (دقيقتان) يحدد موعد الملاحظة الميدانية، والطلبة يدونون أدوارهم. يستعدون (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: نشاط 2-6: الملاحظة الميدانية للملقحات — زمن الحصة 40 دقيقة\n1. • التهيئة: يذكّر المعلم بالقواعد والأدوار، والطلبة يستعدون في مواقعهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الملاحظة والعدّ: يتنقل المعلم بين المجموعات ويضبط الوقت ويساعد في تمييز الحشرات، والطلبة يلاحظون الأزهار الأربع، ويسجلون الحشرات التي تقف عليها وعدد المرات (25 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تجميع البيانات: يعود المعلم بالطلاب إلى الصف ويطلب مجموع كل حشرة، والطلبة يجمعون الأعداد ويراجعون الجدول (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • الغلق: يسأل المعلم: هل تحققت تنبؤاتكم؟ والطلبة يقارنون مبدئيًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الجدول ويطرح السؤال، والطلبة يقترحون التمثيل البياني (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • رسم التمثيل: يراجع المعلم خطوات رسم الأعمدة، والطلبة يمثلون عدد زيارات الحشرات لكل زهرة بالأعمدة (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة ص39: يناقش المعلم الأسئلة (1–4)، والطلبة يجيبون: الأزهار الأكثر زيارة، الحشرات المترددة، صحة التنبؤات، النمط (الأزهار الزاهية ذات الرائحة أكثر زيارة) وسببه (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • مقارنة: يطلب المعلم من المجموعات مقارنة تمثيلاتها، والطلبة يكتشفون أوجه التشابه والاختلاف (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يلخص المعلم النمط العام، والطلبة يكتبون الاستنتاج (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6 — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التحدي ص39: يوجه المعلم للبحث في المصادر عن سبب تلقيح الطيور للأزهار الحمراء، والطلبة يستنتجون أن الطيور ترى اللون الأحمر جيدًا، وأن الزهرة الأنبوبية العميقة يصل منقار الطائر الطويل إلى رحيقها (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • ورقة العمل 2-6: يقدم المعلم ورقة العمل ص71: أي ألوان الأزهار تجذب عددًا أكبر من الملقحات؟ والطلبة يحللون البيانات ويحددون النمط ويضعون تنبؤات (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تحدث عن: يطرح المعلم سؤال العث والأزهار الليلية، والطلبة يناقشون (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n1. (مستوى المعرفة) اذكر ثلاث حشرات تلقح الأزهار.\n   الإجابة النموذجية: النحل، الفراشات، الخنافس (أو الدبابير، النمل، العث).\n2. (مستوى التطبيق) لماذا تهوى الفراشات الأزهار الغنية بالرحيق؟\n   الإجابة النموذجية: لأنها تتغذى على الرحيق.\n3. (مستوى الاستدلال) زهرة بيضاء كبيرة قوية الرائحة تتفتح مساءً، أي حشرة تلقحها غالبًا؟\n   الإجابة النموذجية: العث؛ لأنه ينشط ليلًا ويرى الأزهار الفاتحة ويجذبه العطر.\n\n4. (مستوى المعرفة) ما الأداة التي نستخدمها لضبط زمن الملاحظة؟\n   الإجابة النموذجية: ساعة الإيقاف.\n5. (مستوى التطبيق) اذكر ثلاثة أعمدة في جدول الملاحظة.\n   الإجابة النموذجية: اسم الزهرة، الحشرات التي تقف عليها، عدد المرات (أو الوصف والتنبؤ).\n6. (مستوى الاستدلال) لماذا نختار أزهارًا زاهية وأخرى غير زاهية؟\n   الإجابة النموذجية: لنقارن عدد الحشرات التي تزور كل نوع ونختبر تنبؤاتنا.\n\nالحصة 2: نشاط 2-6: الملاحظة الميدانية للملقحات\n1. (مستوى المعرفة) ما الحشرة التي لاحظتها أكثر من غيرها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الملاحظة.\n2. (مستوى التطبيق) كم مرة زارت الحشرات الزهرة الأكثر زيارة؟\n   الإجابة النموذجية: تقبل الإجابة من الجدول.\n3. (مستوى الاستدلال) هل دعمت ملاحظاتك تنبؤك؟ وضّح.\n   الإجابة النموذجية: تقبل إجابة تقارن التنبؤ بالأعداد المسجلة.\n\nالحصة 3: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n1. (مستوى المعرفة) ما نوع التمثيل المناسب لعرض عدد زيارات الحشرات لكل زهرة؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة.\n2. (مستوى التطبيق) ما الأزهار التي زارتها الحشرات أكثر في نتائجك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (غالبًا الزاهية ذات الرائحة).\n3. (مستوى الاستدلال) اقترح سببًا للنمط الذي لاحظته.\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق تجذب الحشرات.\n\nالحصة 4: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n1. (مستوى المعرفة) أي الكائنات تلقح معظم الأزهار الحمراء؟\n   الإجابة النموذجية: الطيور (كطائر الطنان).\n2. (مستوى التطبيق) لماذا يناسب منقار الطائر الطويل الأزهار الأنبوبية؟\n   الإجابة النموذجية: لأنه يصل إلى الرحيق في عمق الزهرة.\n3. (مستوى الاستدلال) تنبأ بالملقح المناسب لزهرة بيضاء معطرة تتفتح ليلًا.\n   الإجابة النموذجية: العث.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n1. (مستوى المعرفة) صح أم خطأ: تفضل الحشرات المختلفة أنواعًا محددة من الأزهار.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الأزهار؟\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق.\n3. (مستوى الاستدلال) تنبأ بصفات زهرة تلقحها الخنافس.\n   الإجابة النموذجية: كبيرة الحجم، بها كثير من حبوب اللقاح والرحيق، وغالبًا فاتحة أو مخضرة اللون.\n\n4. (مستوى المعرفة) صح أم خطأ: يجب لمس النحلة لمعرفة نوعها.\n   الإجابة النموذجية: خطأ؛ نلاحظ من بعيد دون لمس.\n5. (مستوى التطبيق) ما مدة الملاحظة المقترحة في النشاط؟\n   الإجابة النموذجية: نصف ساعة.\n6. (مستوى الاستدلال) تنبأ: أي الأزهار سيزورها عدد أكبر من الحشرات؟ ولماذا؟\n   الإجابة النموذجية: الأزهار الزاهية ذات الرائحة والرحيق؛ لأنها تجذب الحشرات.\n\nالحصة 2: نشاط 2-6: الملاحظة الميدانية للملقحات\n1. (مستوى المعرفة) صح أم خطأ: سجلنا عدد مرات وقوف الحشرات على كل زهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا نلاحظ مدة زمنية محددة لكل زهرة؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة بين الأزهار صحيحة.\n3. (مستوى الاستدلال) لو أعدت الملاحظة في يوم ممطر، هل تتوقع النتائج نفسها؟ لماذا؟\n   الإجابة النموذجية: لا غالبًا؛ لأن الحشرات تقل في المطر، فيجب تكرار الملاحظة في أيام مختلفة.\n\nالحصة 3: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n1. (مستوى المعرفة) صح أم خطأ: يجب أن تكون أعمدة التمثيل متساوية العرض.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الحشرات التي تزور الأزهار باستمرار في ملاحظتك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (مثل النحل).\n3. (مستوى الاستدلال) لماذا قد تختلف نتائج مجموعتين لاحظتا الأزهار نفسها؟\n   الإجابة النموذجية: لاختلاف وقت الملاحظة أو أخطاء العدّ أو الطقس؛ لذا نكرر الملاحظة.\n\nالحصة 4: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n1. (مستوى المعرفة) صح أم خطأ: تلقح الطيور بعض الأزهار.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الأزهار حسب ورقة العمل؟\n   الإجابة النموذجية: لون الزهرة ورائحتها ورحيقها.\n3. (مستوى الاستدلال) لماذا تستفيد الزهرة من زيارة ملقح محدد؟\n   الإجابة النموذجية: لأن الملقح ينقل حبوب لقاحها إلى أزهار من النوع نفسه فيزيد فرصة التلقيح.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\nللطالب: قراءة كتاب الطالب ص38، وملاحظة حشرات في حديقة المنزل. لولي الأمر: تنبيه الابن إلى عدم الاقتراب من النحل والدبابير أو لمسها أثناء الملاحظة.\nللطالب: مراجعة الجدول والتنبؤات، وارتداء ملابس مناسبة للعمل الميداني. لولي الأمر: التأكد من خلو الابن من حساسية لسع النحل وإبلاغ المعلم إن وجدت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12\n\nالحصة 2: نشاط 2-6: الملاحظة الميدانية للملقحات\nللطالب: الاحتفاظ بجدول البيانات لرسم التمثيل البياني في الحصة القادمة. لولي الأمر: تشجيع الابن على تكرار الملاحظة في حديقة المنزل أو الحي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12\n\nالحصة 3: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\nللطالب: إكمال التمثيل البياني وكتابة الاستنتاج، وحل تمرين 2-6 بكتاب النشاط ص28. لولي الأمر: متابعة إنجاز التمرين ومناقشة الاستنتاج مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12\n\nالحصة 4: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\nللطالب: إكمال ورقة العمل 2-6 ص71، ومراجعة دروس التلقيح استع  ما المرحلة التي تأتي بعد التلقيح والإخصاب؟\n   الإجابة النموذجية: إنتاج البذور (تكوّن الثمرة).\n3. (مستوى الاستدلال) ماذا يحدث لدورة الحياة إذا لم تنتشر البذور أبدًا؟\n   الإجابة النموذجية: تتزاحم الشتلات ولا تجد ما يكفيها فتضعف، وقد لا تكتمل الدورة جيدًا.\n\n4. (مستوى المعرفة) صح أم خطأ: الشتلة نبات صغير نما من بذرة.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) ما العملية التي تحدث عندما يتحول النبات الناضج إلى نبات مزهر يكوّن البذور؟\n   الإجابة النموذجية: التلقيح والإخصاب.\n6. (مستوى الاستدلال) لماذا نحتاج إلى ترتيب دقيق لمراحل دورة الحياة؟\n   الإجابة النموذجية: لأن كل مرحلة تعتمد على ما قبلها؛ فلا ثمرة دون زهرة ملقحة، ولا نبات دون إنبات.", "للطالب: قراءة كتاب الطالب ص40، ورسم دورة حياة النبات في الدفتر. لولي الأمر: زراعة بذرة فول مع الابن ومتابعة مراحل نموها وتصويرها.\nللطالب: الاحتفاظ ببطاقات دورة الحياة ومراجعتها، وقراءة السؤال الثاني ص41. لولي الأمر: مراجعة ترتيب المراحل مع الابن باستخدام البطاقات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=13"]}, {"n": 2, "topic": "دورة حياة نبات الفول والنباتات الحولية والمعمرة", "f": ["1. يرسم دورة حياة نبات الفول مرتبًا مراحلها ومسميًا كل مرحلة\n2. يميز بين نبات يموت بعد إنتاج البذور ونبات يزهر وينتج البذور كل عام\n\nمخرج تعليمي آخر: يعطي أمثلة لنباتات حولية وأخرى معمرة من البيئة العُمانية", "المخرج 1 (يرسم دورة حياة نبات الفول مرتبًا مراحلها ومسميًا كل مرحلة): تطبيق\nالمخرج 2 (يميز بين نبات يموت بعد إنتاج البذور ونبات يزهر وينتج البذور كل عام): فهم\nالمخرج الآخر (يعطي أمثلة لنباتات حولية وأخرى معمرة من البيئة العُمانية): تطبيق", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "دورة حياة، النباتات الحولية، النباتات المعمرة.", "يعرض المعلم صورة لنخلة وصورة لنبات فول، ويسأل: «النخلة تثمر كل عام لسنوات طويلة، فهل يفعل نبات الفول ذلك؟».", "1. • التهيئة: يعرض المعلم الصورتين ويطرح السؤال، والطلبة يتوقعون (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • دورة حياة الفول (س2): يعر ل ما درسناه: البذور، الإنبات، الأزهار، التلقيح، انتشار البذور. هل يمكننا ترتيبها في قصة واحدة لحياة نبات؟».\n\nالحصة 2: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nيعرض المعلم صورة لنخلة وصورة لنبات فول، ويسأل: «النخلة تثمر كل عام لسنوات طويلة، فهل يفعل نبات الفول ذلك؟».", "الحصة 1: مراحل دورة حياة النبات الزهري — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم السؤال ويكتب المفاهيم السابقة مبعثرة، والطلبة يقترحون ترتيبًا أوليًا (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • مخطط دورة الحياة: يشرح المعلم مخطط ص40: الإنبات ← النمو ← التلقيح والإخصاب (الإزهار) ← إنتاج البذور (ثمرة) ← انتشار البذور ← إنبات من جديد، والطلبة يرسمون المخطط الدائري ويكتبون ما يحدث في كل مرحلة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • ربط المراحل بالدروس: يربط كل مرحلة بالدرس الذي درسوه، والطلبة يذكرون معلومة رئيسية عن كل مرحلة (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • لماذا دائرة؟: يسأل المعلم: لماذا رسمنا الدورة على شكل دائرة؟ والطلبة يستنتجون أنها تتكرر باستمرار ولا تتوقف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • بطاقات دورة الحياة: يوزع المعلم ورقة المصادر 2-7 ص47 على الثنائيات، والطلبة يقصون البطاقات ويرتبونها في دائرة ويشرح كل طالب لزميله مرحلة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • دورة حياة الطماطم (س1): يعرض المعلم مخطط ص41 وجدول السؤال الأول، والطلبة يكتبون مرحلة حياة الطماطم والعملية التي تحدث فيها (ثمرة ← بذرة: انتشار، بذرة ← شتلة: إنبات، شتلة ← نبات ناضج: نمو، نبات ← زهرة: تلقيح وإخصاب) (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. • تقييم الأقران: يطلب المعلم من الثنائيات تبادل الجداول، والطلبة يتحققون من إجابات زملائهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يذكرون مرحلتين متتاليتين (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: دورة حياة نبات الفول والنباتات الحولية والمعمرة — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصورتين ويطرح السؤال، والطلبة يتوقعون (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • دورة حياة الفول (س2): يعرض المعلم المراحل المبعثرة: زهرة، شتلة، قرن فول، نبات ناضج، بذرة، ويرتبونها الطالب: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول، ويرسمون الدورة ويسمون المراحل (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • س3 وس4: يناقش المعلم: لماذا نرسم الدورة في دائرة؟ وأمثلة لنبات يموت بعد إنتاج البذور وآخر يزهر كل عام، والطلبة يجيبون: الفول/الطماطم/الذرة تموت، والخوخ/البرتقال/الصبار تزهر كل عام (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تحدث عن: يقدم المعلم مفهومي النباتات الحولية والمعمرة، والطلبة يصنفون أمثلة من البيئة العُمانية (النخلة، السدر: معمرة؛ القمح، الطماطم: حولية) (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مراحل دورة حياة النبات الزهري\n1. (مستوى المعرفة) ما المرحلة الأولى في دورة حياة النبات؟\n   الإجابة النموذجية: الإنبات.\n2. (مستوى التطبيق) ماذا يحدث في مرحلة انتشار البذور؟\n   الإجابة النموذجية: تنتقل البذور بعيدًا عن النبات الأصلي.\n3. (مستوى الاستدلال) لماذا نرسم دورة الحياة على شكل دائرة؟\n   الإجابة النموذجية: لأن مراحلها تتكرر باستمرار؛ فالبذور تنبت وتكوّن نباتات جديدة تنتج بذورًا وهكذا.\n\n4. (مستوى المعرفة) ما المرحلة التي تأتي بعد الشتلة؟\n   الإجابة النموذجية: النبات الناضج.\n5. (مستوى التطبيق) ما العملية التي تحول البذرة إلى شتلة؟\n   الإجابة النموذجية: الإنبات.\n6. (مستوى الاستدلال) اشرح ما يحدث بين مرحلتي الزهرة والثمرة.\n   الإجابة النموذجية: تُلقّح الزهرة وتُخصب البويضات، فينمو المبيض ليكوّن ثمرة بداخلها بذور.\n\nالحصة 2: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n1. (مستوى المعرفة) رتب مراحل دورة حياة الفول.\n   الإجابة النموذجية: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول (به بذور).\n2. (مستوى التطبيق) اذكر نباتًا يموت بعد إنتاج البذور.\n   الإجابة النموذجية: الفول أو الطماطم أو الذرة.\n3. (مستوى الاستدلال) ما الفرق بين النبات الحولي والنبات المعمر؟\n   الإجابة النموذجية: الحولي يكمل دورة حياته في موسم واحد ثم يموت، والمعمر يعيش سنوات ويزهر وينتج البذور كل عام.", "الحصة 1: مراحل دورة حياة النبات الزهري\n1. (مستوى المعرفة) رتب: انتشار البذور – الإنبات – التلقيح – النمو.\n   الإجابة النموذجية: الإنبات ← النمو ← التلقيح ← انتشار البذور.\n2. (مستوى التطبيق) ما المرحلة التي تأتي بعد التلقيح والإخصاب؟\n   الإجابة النموذجية: إنتاج البذور (تكوّن الثمرة).\n3. (مستوى الاستدلال) ماذا يحدث لدورة الحياة إذا لم تنتشر البذور أبدًا؟\n   الإجابة النموذجية: تتزاحم الشتلات ولا تجد ما يكفيها فتضعف، وقد لا تكتمل الدورة جيدًا.\n\n4. (مستوى المعرفة) صح أم خطأ: الشتلة نبات صغير نما من بذرة.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) ما العملية التي تحدث عندما يتحول النبات الناضج إلى نبات مزهر يكوّن البذور؟\n   الإجابة النموذجية: التلقيح والإخصاب.\n6. (مستوى الاستدلال) لماذا نحتاج إلى ترتيب دقيق لمراحل دورة الحياة؟\n   الإجابة النموذجية: لأن كل مرحلة تعتمد على ما قبلها؛ فلا ثمرة دون زهرة ملقحة، ولا نبات دون إنبات.\n\nالحصة 2: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n1. (مستوى المعرفة) صح أم خطأ: النخلة نبات معمر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر نباتًا يزهر وينتج البذور كل عام.\n   الإجابة النموذجية: الخوخ أو البرتقال أو النخيل.\n3. (مستوى الاستدلال) لماذا ترسم دورة حياة النبات في دائرة لا في خط مستقيم؟\n   الإجابة النموذجية: لأن المراحل تتكرر بلا توقف؛ فبذور النبات تبدأ دورة جديدة.", "الحصة 1: مراحل دورة حياة النبات الزهري\nللطالب: قراءة كتاب الطالب ص40، ورسم دورة حياة النبات في الدفتر. لولي الأمر: زراعة بذرة فول مع الابن ومتابعة مراحل نموها وتصويرها.\nللطالب: الاحتفاظ ببطاقات دورة الحياة ومراجعتها، وقراءة السؤال الثاني ص41. لولي الأمر: مراجعة ترتيب المراحل مع الابن باستخدام البطاقات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=13\n\nالحصة 2: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nللطالب: حل تمرين 2-7 بكتاب النشاط ص29، ومراجعة الوحدة الثانية استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة الثانية مع الابن (التلقيح، الإخصاب، الرحيق، السداة، الكربلة، انتشار البذور).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=13"]}, {"code": "2-8", "title": "تحقق من تقدمك", "unit": 2, "dates": "الأسبوع التاسع (1–5/11/2026م)", "sb": "42–43", "tb": "54–57", "ab": "المراجعة اللغوية ص30", "periods": [{"n": 1, "topic": "مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)", "f": ["1. يشرح عملية انتشار البذور وأهميتها وطرقها\n2. يسمي أجزاء الزهرة ويحدد الأجزاء التي تكوّن البذور\nمخرج تعليمي آخر: يفسر طريقة انتشار بذرتين من شكليهما مع التعليل", "المخرج 1 (يشرح عملية انتشار البذور وأهميتها وطرقها): فهم\nالمخرج 2 (يسمي أجزاء الزهرة ويحدد الأجزاء التي تكوّن البذور): تذكر\nالمخرج الآخر (يفسر طريقة انتشار بذرتين من شكليهما مع التعليل): تحليل", "التعلم التعاوني، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام", "انتشار البذور، المتك، الميسم، المبيض، البويضات، الإخصاب.", "ينفذ المعلم لعبة «أكمل الدائرة»: يقول مرحلة من دورة حياة النبات، ويقول الطالب التالي المرحلة التي تليها، حتى تكتمل الدورة.", "1. • التهيئة: ينفذ المعلم لعبة «أكمل الدائرة»، والطلبة يكملون المراحل بالتتابع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • السؤال 1 ص42: يناقش المعلم أجزاء السؤال (أ–هـ)، والطلبة يجيبون: انتشار البذور، أهميته، ثلاث طرق للحيوانات، (أ) بالرياح لجناحيها و(ب) بالانفجار لتشقق القرن، وطريقة أخرى (الماء) مع مثال (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • السؤال 2 ص42: يوجه المعلم لرسم الزهرة وإضافة الأجزاء الناقصة من الصندوق، والطلبة يرسمون ويسمون الأجزاء، ويحددون أن المبيض والبويضات تكوّن البذور بعد الإخصاب الذي يحدث في المبيض (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • التصحيح الذاتي: يعرض المعلم الإجابات النموذجية، والطلبة يصححون ويحددون نقاط المراجعة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما اسم العملية التي تنشر فيها النباتات بذورها؟\n   الإجابة النموذجية: انتشار البذور.\n2. (مستوى التطبيق) اذكر ثلاث طرق تنشر بها الحيوانات البذور.\n   الإجابة النموذجية: أكل الثمار وإخراج البذور مع الفضلات، التصاق البذور بالفراء، دفن البذور وحملها (أو أكل الثمار وترك البذرة).\n3. (مستوى الاستدلال) كيف تنتشر البذرة (أ) المجنحة؟ أعطِ سببًا.\n   الإجابة النموذجية: بالرياح؛ لأن لها جناحين يساعدانها على الطفو في الهواء.", "1. (مستوى المعرفة) سمِّ جزأي الزهرة اللذين يكوّنان البذور.\n   الإجابة النموذجية: المبيض والبويضات.\n2. (م رح السؤال، والطلبة يتوقعون (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • السؤال 3: يناقش المعلم أجزاء السؤال (أ–ج)، والطلبة يجيبون: (ب) تلقحها الحشرات لبتلاتها الزاهية ورائحتها، والحشرة نحلة أو فراشة، و(أ) تلقحها الرياح لأنها غير زاهية وصغيرة وحبوب لقاحها كثيرة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • السؤال 4: يوجه المعلم لترتيب العمليات ورسم المخطط، والطلبة يرتبون: الإنبات ← النمو ← التلقيح ← الإخصاب ← إنتاج البذور ← انتشار البذور، ويرسمون الدورة (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • المراجعة اللغوية: يقدم المعلم المراجعة اللغوية للوحدة الثانية ص30 بكتاب النشاط، والطلبة يحلون جزءًا منها في الصف (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "الحصة 1: مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)\n1. (مستوى المعرفة) ما اسم العملية التي تنشر فيها النباتات بذورها؟\n   الإجابة النموذجية: انتشار البذور.\n2. (مستوى التطبيق) اذكر ثلاث طرق تنشر بها الحيوانات البذور.\n   الإجابة النموذجية: أكل الثمار وإخراج البذور مع الفضلات، التصاق البذور بالفراء، دفن البذور وحملها (أو أكل الثمار وترك البذرة).\n3. (مستوى الاستدلال) كيف تنتشر البذرة (أ) المجنحة؟ أعطِ سببًا.\n   الإجابة النموذجية: بالرياح؛ لأن لها جناحين يساعدانها على الطفو في الهواء.\n\nالحصة 2: مراجعة: التلقيح ودورة الحياة (س3–س4) والمراجعة اللغوية\n1. (مستوى المعرفة) أي الزهرتين تُلقح بالحشرات؟\n   الإجابة النموذجية: الزهرة (ب).\n2. (مستوى التطبيق) أعطِ سببين لإجابتك.\n   الإجابة النموذجية: بتلاتها زاهية الألوان، ولها رائحة.\n3. (مستوى الاستدلال) لماذا تُلقح الزهرة (أ) بالرياح؟\n   الإجابة النموذجية: لأنها غير زاهية الألوان وصغيرة، وتنتج حبوب لقاح كثيرة.", "الحصة 1: مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)\n1. (مستوى المعرفة) سمِّ جزأي الزهرة اللذين يكوّنان البذور.\n   الإجابة النموذجية: المبيض والبويضات.\n2. (مستوى التطبيق) ما اسم العملية التي تتكون فيها البذور؟ وأين تحدث؟\n   الإجابة النموذجية: الإخصاب؛ داخل المبيض.\n3. (مستوى الاستدلال) لماذا تعد عملية انتشار البذور مهمة؟\n   الإجابة النموذجية: لكي تبتعد البذور عن النبات الأصلي فتجد مساحة وماءً وضوءًا كافية للنمو.\n\nالحصة 2: مراجعة: التلقيح ودورة الحياة (س3–س4) والمراجعة اللغوية\n1. (مستوى المعرفة) صح أم خطأ: يأتي الإخصاب قبل التلقيح.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) اقترح حشرة يمكنها تلقيح الزهرة (ب).\n   الإجابة النموذجية: نحلة أو فراشة أو خنفساء.\n3. (مستوى الاستدلال) رتب: انتشار البذور، الإخصاب، الإنبات، التلقيح، النمو، إنتاج البذور.\n   الإجابة النموذجية: الإنبات ← النمو ← التلقيح ← الإخصاب ← إنتاج البذور ← انتشار البذور.", "الحصة 1: مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)\nللطالب: مراجعة إجابات السؤالين 1 و2 ص42، وقراءة السؤالين 3 و4 ص43. لولي الأمر: مراجعة أجزاء الزهرة مع الابن باستخدام رسم أو زهرة حقيقية.\n\nالحصة 2: مراجعة: التلقيح ودورة الحياة (س3–س4) والمراجعة اللغوية\nللطالب: إكمال المراجعة اللغوية للوحدة الثانية بكتاب النشاط ص30. لولي الأمر: إحضار منشفة صغيرة وكوب بلاستيكي شفاف للابن لأنشطة وحدة حالات المادة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=14"]}, {"code": "3-1", "title": "التبخر", "unit": 3, "dates": "الأسبوع العاشر (8–12/11/2026م)", "sb": "44–45", "tb": "59–61", "ab": "تمرين 3-1 ص31، ورقة العمل 3-1 ص73", "periods": [{"n": 1, "topic": "مفهوم التبخر وبخار الماء + نشاط 3-1أ: أين يذهب الماء؟", "f": ["1. يعرّف التبخر بأنه تحول المادة من الحالة السائلة إلى الحالة الغازية\n2. يفسر حدوث التبخر باكتساب جزيئات السائل طاقة حرارية\n3. ينفذ نشاطًا يلاحظ فيه تبخر الماء من سطح الورقة\n4. يفسر اختفاء البقعة المبتلة بحدوث التبخر\n\nمخرج تعليمي آخر:\nيعطي أمثلة على التبخر من الحياة اليومية\nيتنبأ بالعوامل التي قد تسرّع جفاف البقعة", "المخرج 1 (يعرّف التبخر بأنه تحول المادة من الحالة السائلة إلى الحالة الغازية): تذكر\nالمخرج 2 (يفسر حدوث التبخر باكتساب جزيئات السائل طاقة حرارية): فهم\nالمخرج 3 (ينفذ نشاطًا يلاحظ فيه تبخر الماء من سطح الورقة): تطبيق\nالمخرج 4 (يفسر اختفاء البقعة المبتلة بحدوث التبخر): فهم\nالمخرج الآخر (يعطي أمثلة على التبخر من الحياة اليومية): تطبيق\nالمخرج الآخر (يتنبأ بالعوامل التي قد تسرّع جفاف البقعة): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة بركة ماء قبل الجفاف وبعده\nالكتاب، السبورة الذكية، أخرى: كؤوس زجاجية بها ماء، أوراق ملونة، طباشير", "التبخر، بخار الماء، الطاقة، الحالة السائلة، الحالة الغازية.، بخار الماء.", "يعرض المعلم صورة الطفل والمظلة ص44 ويسأل: «لماذا تجف البركة بعد توقف المطر؟ ماذا يحدث للماء؟ هل يختفي؟».", "1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون: يجف، تشربه الأرض، يصعد للهواء (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • حالات المادة: يراجع المعلم حالات المادة الثلاث (صلبة، سائلة، غازية) بأمثلة، والطلبة يصنفون أمثلة معروضة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • مفهوم التبخر: يشرح المعلم من ص44: عند تسخين السائل بشكل كافٍ يتحول إلى غاز، وبخار الماء هو الماء في الحالة الغازية. ويكتب: سائل + حرارة ← غاز، والطلبة يكتبون التعريف والمعادلة اللفظية (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يعرض المعلم رسم الوعاء ص44 ويمثّل بطلاب «جزيئات» تتحرك ببطء ثم تكتسب طاقة فتتحرك أسرع وتتباعد ويغادر بعضها «سطح السائل»، والطلبة يمثلون حركة الجزيئات ويصفونها (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • أمثلة يومية: يطلب المعلم أمثلة على التبخر، والطلبة يذكرون: جفاف الملابس، الطرق بعد المطر، الأطباق بعد الغسل (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. 1أ: يوجه المجموعات وفق ص44، والطلبة يغمسون أصابعهم في الماء، ويضعونها على الورقة لتحدث بقعة مبتلة، ثم يتركونها دقائق ويلمسونها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. • التفسير: يسأل المعلم: هل البقعة مبتلة أم جافة؟ أين ذهب الماء؟ والطلبة يستنتجون أن الماء تبخر وانتقل إلى الهواء (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. • المقارنة: يقارن المعلم بين بقعة السبورة وبقع الأوراق، والطلبة يقترحون عوامل قد تسرع الجفاف: الدفء، تحريك الهواء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. • الغلق: يعرض المعلم فكرة رسم محيط بركة بالطباشير ومتابعتها، والطلبة يخططون لمتابعة بركة أو بقعة ماء في الفناء (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما التبخر؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الحالة الغازية.\n2. (مستوى التطبيق) ماذا نسمي الماء في الحالة الغازية؟\n   الإجابة النموذجية: بخار الماء.\n3. (مستوى الاستدلال) لماذا تتحرك جزيئات الماء أسرع عند تسخينه؟\n   الإجابة النموذجية: لأنها تكتسب طاقة حرارية.\n\n4. (مستوى المعرفة) هل بقيت البقعة على الورقة مبتلة بعد دقائق؟\n   الإجابة النموذجية: لا، جفت.\n5. (مستوى التطبيق) أين ذهب الماء من الورقة؟\n   الإجابة النموذجية: تبخر وانتقل إلى الهواء على شكل بخار ماء.\n6. (مستوى الاستدلال) تنبأ: هل تجف البقعة أسرع تحت أشعة الشمس أم في الظل؟ لماذا؟\n   الإجابة النموذجية: تحت الشمس؛ لأن الحرارة تسرع التبخر.", "1. (مستوى المعرفة) أكمل: سائل + …… ← غاز.\n   الإجابة النموذجية: حرارة.\n2. (مستوى التطبيق) اذكر مثالين على التبخر من حياتك اليومية.\n   الإجابة النموذجية: جفاف الملابس المبللة، جفاف بركة الماء (أو جفاف الأطباق).\n3. (مستوى الاستدلال) فسّر بلغة الجزيئات كيف يغادر الماء سطح البركة.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة حرارية فتتحرك أسرع وتتباعد حتى تنفصل عن سطح السائل وتنتقل إلى الهواء.\n\n4. (مستوى المعرفة) صح أم خطأ: يختفي الماء من الورقة لأنه يتبخر.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) ما الحالة التي تحول إليها الماء؟\n   الإجابة النموذجية: الحالة الغازية (بخار الماء).\n6. (مستوى الاستدلال) اقترح طريقة لجعل البقعة تجف أسرع، وفسّر.\n   الإجابة النموذجية: تحريك الهواء فوقها أو تدفئتها؛ لأن ذلك يسرع التبخر.", "للطالب: قراءة كتاب الطالب ص44، وملاحظة أمثلة على التبخر في المنزل. لولي الأمر: إحضار ورقة ملونة (أو منديل ملون) لنشاط الحصة القادمة.\nللطالب: رسم محيط بقعة ماء بالطباشير في فناء المنزل وملاحظتها بعد ساعة. لولي الأمر: مساعدة الابن في التجربة ومناقشة النتيجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}, {"n": 2, "topic": "نشاط 3-1ب: مقارنة التبخر (الإعداد)", "f": ["1. يخطط لمقارنة سرعة تبخر الماء في مكان دافئ ومكان بارد\n2. يقيس حجم الماء باستخدام المخبار المدرج بدقة\n\nمخرج تعليمي آخر: يحدد العامل المتغير والعوامل الثابتة في الاستقصاء", "المخرج 1 (يخطط لمقارنة سرعة تبخر الماء في مكان دافئ ومكان بارد): تطبيق\nالمخ اتيجيات: التعلم بالاكتشاف.\n\n2. • حالات المادة: يراجع المعلم حالات المادة الثلاث (صلبة، سائلة، غازية) بأمثلة، والطلبة يصنفون أمثلة معروضة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • مفهوم التبخر: يشرح المعلم من ص44: عند تسخين السائل بشكل كافٍ يتحول إلى غاز، وبخار الماء هو الماء في الحالة الغازية. ويكتب: سائل + حرارة ← غاز، والطلبة يكتبون التعريف والمعادلة اللفظية (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يعرض المعلم رسم الوعاء ص44 ويمثّل بطلاب «جزيئات» تتحرك ببطء ثم تكتسب طاقة فتتحرك أسرع وتتباعد ويغادر بعضها «سطح السائل»، والطلبة يمثلون حركة الجزيئات ويصفونها (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • أمثلة يومية: يطلب المعلم أمثلة على التبخر، والطلبة يذكرون: جفاف الملابس، الطرق بعد المطر، الأطباق بعد الغسل (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. 1أ: يوجه المجموعات وفق ص44، والطلبة يغمسون أصابعهم في الماء، ويضعونها على الورقة لتحدث بقعة مبتلة، ثم يتركونها دقائق ويلمسونها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. • التفسير: يسأل المعلم: هل البقعة مبتلة أم جافة؟ أين ذهب الماء؟ والطلبة يستنتجون أن الماء تبخر وانتقل إلى الهواء (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. • المقارنة: يقارن المعلم بين بقعة السبورة وبقع الأوراق، والطلبة يقترحون عوامل قد تسرع الجفاف: الدفء، تحريك الهواء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. • الغلق: يعرض المعلم فكرة رسم محيط بركة بالطباشير ومتابعتها، والطلبة يخططون لمتابعة بركة أو بقعة ماء في الفناء (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: نشاط 3-1ب: مقارنة التبخر (الإعداد) — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقترحون أن الحرارة تسرع الجفاف (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • قراءة الخطوات: يقرأ المعلم نشاط 3-1ب ص45، والطلبة يحددون الأدوات والخطوات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • قياس الحجم: يوضح المعلم طريقة قراءة المخبار المدرج من مستوى النظر وقراءة أسفل التقعر (مهارات ص64)، والطلبة يتدربون على قراءة المخبار (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • الإعداد: يتابع المجموعات، والطلبة يضعون 100 ml في كل كأس، ويضعون علامة عند مستوى الماء، ويضعون إحدى الكأسين في مكان دافئ والأخرى في مكان بارد (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الاختبار العادل: يسأل المعلم: ما الذي غيرناه؟ وما الذي أبقيناه ثابتًا؟ والطلبة يحددون: المتغير هو المكان (الدفء)، والثابت كمية الماء ونوع الكأس (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يحدد المعلم موعد الملاحظة بعد يومين، والطلبة يكتبون تنبؤهم (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: نتائج نشاط 3-1ب وأسئلة الدرس — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الكأسين، والطلبة يصفون الفرق (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • القياس والمقارنة: يوجه المعلم إلى وضع علامة جديدة وقياس الماء المتبقي بالمخبار، والطلبة يقيسون ويسجلون ويحسبون كمية الماء المتبخرة من كل كأس (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • الاستنتاج: يناقش المعلم: لماذا تبخر ماء أكثر من الكأس الدافئة؟ والطلبة يستنتجون أن الحرارة تكسب الجزيئات طاقة فيسرع التبخر (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • أسئلة ص45: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن تغير المستوى والكأس الأقل ماءً وجفاف الملابس في الأيام الحارة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تمرين 3-1: يقدم المعلم تمرين 3-1 بكتاب النشاط ص31، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الأطباق ويطرح السؤال، والطلبة يتنبؤون (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التخطيط بورقة العمل: يقدم المعلم ورقة العمل 3-1 ص73 ويناقش: ما الذي نغيره؟ ما الذي نقيسه؟ ما الذي نثبته؟ والطلبة يكتبون: نغير نوع السائل، نقيس الحجم المتبقي بعد مدة، نثبت الحجم الأولي والأطباق والمكان (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • الإعداد: يتابع المجموعات، والطلبة يضعون الحجم نفسه من كل سائل في أطباق متماثلة في المكان نفسه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • كفاية الأدلة: يسأل المعلم: هل تكفي تجربة واحدة؟ لماذا يكرر العلماء تجاربهم؟ والطلبة يستنتجون أهمية التكرار (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة 1: مفهوم التبخر وبخار الماء\n1. (مستوى المعرفة) ما التبخر؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الحالة الغازية.\n2. (مستوى التطبيق) ماذا نسمي الماء في الحالة الغازية؟\n   الإجابة النموذجية: بخار الماء.\n3. (مستوى الاستدلال) لماذا تتحرك جزيئات الماء أسرع عند تسخينه؟\n   الإجابة النموذجية: لأنها تكتسب طاقة حرارية.\n\n4. (مستوى المعرفة) هل بقيت البقعة على الورقة مبتلة بعد دقائق؟\n   الإجابة النموذجية: لا، جفت.\n5. (مستوى التطبيق) أين ذهب الماء من الورقة؟\n   الإجابة النموذجية: تبخر وانتقل إلى الهواء على شكل بخار ماء.\n6. (مستوى الاستدلال) تنبأ: هل تجف البقعة أسرع تحت أشعة الشمس أم في الظل؟ لماذا؟\n   الإجابة النموذجية: تحت الشمس؛ لأن الحرارة تسرع التبخر.\n\nالحصة 2: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n1. (مستوى المعرفة) كم مليلترًا من الماء وضعنا في كل كأس؟\n   الإجابة النموذجية: 100 ml.\n2. (مستوى التطبيق) كيف نقرأ حجم الماء في المخبار المدرج بدقة؟\n   الإجابة النموذجية: نضع المخبار على سطح مستوٍ، وننظر في مستوى سطح السائل، ونقرأ عند قاع التقعر.\n3. (مستوى الاستدلال) ما العامل الذي غيرناه في هذا النشاط؟\n   الإجابة النموذجية: مكان الكأس (دافئ أو بارد).\n\nالحصة 3: نتائج نشاط 3-1ب وأسئلة الدرس\n1. (مستوى المعرفة) في أي الكأسين قلّ الماء أكثر؟\n   الإجابة النموذجية: الكأس الموضوعة في المكان الدافئ.\n2. (مستوى التطبيق) كم مليلترًا تبخر من كأس بقي فيها 85 ml من أصل 100 ml؟\n   الإجابة النموذجية: 15 ml.\n3. (مستوى الاستدلال) لماذا تبخر الماء أسرع في الكأس الدافئة؟\n   الإجابة النموذجية: لأن الحرارة تكسب جزيئات الماء طاقة فتتحرك أسرع وتنفصل عن السطح.\n\nالحصة 4: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\n1. (مستوى المعرفة) ما العامل الذي نغيره في هذا الاستقصاء؟\n   الإجابة النموذجية: نوع السائل.\n2. (مستوى التطبيق) ما الذي يجب أن نثبته ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: الحجم الأولي للسوائل، ونوع الأطباق وحجمها، والمكان، والمدة.\n3. (مستوى الاستدلال) لماذا يكرر العلماء التجربة عدة مرات؟\n   الإجابة النموذجية: للتأكد من صحة النتائج وأنهم لم يرتكبوا أخطاء في التنفيذ أو القياس.", "الحصة 1: مفهوم التبخر وبخار الماء\n1. (مستوى المعرفة) أكمل: سائل + …… ← غاز.\n   الإجابة النموذجية: حرارة.\n2. (مستوى التطبيق) اذكر مثالين على التبخر من حياتك اليومية.\n   الإجابة النموذجية: جفاف الملابس المبللة، جفاف بركة الماء (أو جفاف الأطباق).\n3. (مستوى الاستدلال) فسّر بلغة الجزيئات كيف يغادر الماء سطح البركة.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة حرارية فتتحرك أسرع وتتباعد حتى تنفصل عن سطح السائل وتنتقل إلى الهواء.\n\n4. (مستوى المعرفة) صح أم خطأ: يختفي الماء من الورقة لأنه يتبخر.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) ما الحالة التي تحول إليها الماء؟\n   الإجابة النموذجية: الحالة الغازية (بخار الماء).\n6. (مستوى الاستدلال) اقترح طريقة لجعل البقعة تجف أسرع، وفسّر.\n   الإجابة النموذجية: تحريك الهواء فوقها أو تدفئتها؛ لأن ذلك يسرع التبخر.\n\nالحصة 2: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n1. (مستوى المعرفة) صح أم خطأ: استخدمنا كأسين مختلفتين في الحجم.\n   الإجابة النموذجية: خطأ؛ كأسان متماثلتان.\n2. (مستوى التطبيق) لماذا وضعنا علامة عند مستوى الماء؟\n   الإجابة النموذجية: لنقارن مستوى الماء بعد يومين ونعرف كم تبخر.\n3. (مستوى الاستدلال) تنبأ: أي الكأسين سيقل فيها الماء أكثر؟ ولماذا؟\n   الإجابة النموذجية: الكأس في المكان الدافئ؛ لأن الحرارة تسرع التبخر.\n\nالحصة 3: نتائج نشاط 3-1ب وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: بقي مستوى الماء في الكأسين كما هو.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا تجف الملابس أسرع في الأيام الحارة؟\n   الإجابة النموذجية: لأن الحرارة تزيد سرعة تبخر الماء منها.\n3. (مستوى الاستدلال) كأس فيها 100 ml بقي فيها بعد يومين 70 ml في مكان دافئ و90 ml في مكان بارد. كم الفرق في الماء المتبخر بين الكأسين؟\n   الإجابة النموذجية: المتبخر في الدافئ 30 ml، وفي البارد 10 ml، والفرق 20 ml.\n\nالحصة 4: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\n1. (مستوى المعرفة) صح أم خطأ: نضع كميات مختلفة من السوائل في الأطباق.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) ما الأداة التي نقيس بها حجم السائل المتبقي؟\n   الإجابة النموذجية: المخبار المدرج.\n3. (مستوى الاستدلال) إذا أجريت التجربة مرة واحدة وتبخر العصير أسرع، هل يمكنك تعميم النتيجة؟ وضّح.\n   الإجابة النموذجية: لا؛ يجب تكرار التجربة للتأكد قبل وضع الاستنتاج.", "الحصة 1: مفهوم التبخر وبخار الماء\nللطالب: قراءة كتاب الطالب ص44، وملاحظة أمثلة على التبخر في المنزل. لولي الأمر: إحضار ورقة ملونة (أو منديل ملون) لنشاط الحصة القادمة.\nللطالب: رسم محيط بقعة ماء بالطباشير في فناء المنزل وملاحظتها بعد ساعة. لولي الأمر: مساعدة الابن في التجربة ومناقشة النتيجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15\n\nالحصة 2: نشاط 3-1ب: مقارنة التبخر (الإعداد)\nللطالب: قراءة صفحة مهارات قياس حجم السائل ص64 في كتاب الطالب. لولي الأمر: تنفيذ تجربة مشابهة بكوبين في المنزل (نافذة مشمسة / مكان بارد) ومتابعتها مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15\n\nالحصة 3: نتائج نشاط 3-1ب وأسئلة الدرس\nللطالب: إكمال تمرين 3-1 بكتاب النشاط ص31. لولي الأمر: إحضار عينات صغيرة من سوائل آمنة (ماء، عصير، زيت طبخ) في علب صغيرة لاستقصاء الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15\n\nالحصة 4: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nللطالب: متابعة أطباق السوائل يوميًا وتسجيل الحجم المتبقي في ورقة العمل 3-1 ص73. لولي الأمر: مناقشة الابن في نتائج الاستقصاء ومساعدته على كتابة الاستنتاج.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}, {"code": "3-2", "title": "لماذا يُعدّ التبخر مفيدًا؟", "unit": 3, "dates": "الأسبوع الحادي عشر (15–19/11/2026م)", "sb": "46–47", "tb": "62", "ab": "تمرين 3-2 ص32", "periods": [{"n": 1, "topic": "استخدامات التبخر ودوره في تبريد الأجسام", "f": ["1. يذكر استخدامات مفيدة للتبخر في الحياة اليومية\n2. يوضح دور التبخر في تبريد الأجسام\nمخرج تعليمي آخر: يفسر شعوره بالبرودة بعد استخدام معقم اليدين أو بعد التعرق", "المخرج 1 (يذكر استخدامات مفيدة للتبخر في الحياة اليومية): تذكر\nالمخرج 2 (يوضح دور التبخر في تبريد الأجسام): فهم\nالمخرج الآخر (يفسر شعوره بالبرودة بعد استخدام معقم اليدي ليد (زفير دافئ)، ثم ينفخون (أبرد)، ثم يرشون رذاذ الماء وينفخون برفق ثم بقوة، ويسجلون الإحساس (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • التفسير: يسأل المعلم: لماذا كان الإحساس بالبرودة أكبر مع الرذاذ والنفخ؟ والطلبة يستنتجون أن الماء يتبخر آخذًا الحرارة، والنفخ يسرع التبخر (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة ص47: يناقش المعلم الأسئلة (1–3)، والطلبة يشرحون عمل مجفف الشعر، ويذكرون أطعمة مجففة (الزبيب، المشمش، التمر)، ويفسرون جفاف التربة في الأيام الحارة العاصفة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\n1. (مستوى المعرفة) اذكر استخدامين مفيدين للتبخر.\n   الإجابة النموذجية: تجفيف الملابس، تجفيف الرطب، تجفيف اليدين (أي اثنين).\n2. (مستوى التطبيق) لماذا نشعر بالبرودة بعد التعرق؟\n   الإجابة النموذجية: لأن العرق يتبخر آخذًا الطاقة الحرارية من الجلد فيبرد.\n3. (مستوى الاستدلال) لماذا تبرد اليدان عند استخدام المعقم؟\n   الإجابة النموذجية: لأن المعقم يتبخر بسرعة آخذًا الحرارة من اليدين.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\n1. (مستوى المعرفة) ما الذي شعرت به عند الزفير على يدك؟\n   الإجابة النموذجية: شعور بالدفء.\n2. (مستوى التطبيق) لماذا شعرت ببرودة أكبر عند النفخ على يد مبللة؟\n   الإجابة النموذجية: لأن الماء يتبخر آخذًا الحرارة من اليد، والنفخ يسرع التبخر.\n3. (مستوى الاستدلال) كيف يجفف مجفف الشعر الشعر؟\n   الإجابة النموذجية: يدفع هواءً ساخنًا متحركًا يسرّع تبخر الماء من الشعر.", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\n1. (مستوى المعرفة) صح أم خطأ: التبخر يساعد على تبريد أجسامنا.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) كيف يستخدم المزارعون التبخر لحفظ الرطب؟\n   الإجابة النموذجية: ينشرونه في الشمس فيتبخر الماء منه فيجف ويُحفظ مدة أطول.\n3. (مستوى الاستدلال) لماذا يبقى الماء في الجرة الفخارية باردًا في الصيف؟\n   الإجابة النموذجية: لأن جزءًا من الماء يتسرب عبر مسام الفخار ويتبخر من سطحه الخارجي آخذًا الحرارة فيبرد الماء داخلها.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: تتبخر السوائل أسرع عندما يتحرك الهواء.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر طعامين يُعدّان باستخدام التبخر.\n   الإجابة النموذجية: الزبيب والمشمش المجفف (أو التمر، السمك المجفف).\n3. (مستوى الاستدلال) لماذا تجف التربة في الحديقة أسرع في الأيام الحارة العاصفة؟\n   الإجابة النموذجية: لأن الحرارة والرياح معًا تزيدان سرعة تبخر الماء من التربة.", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\nللطالب: قراءة كتاب الطالب ص46، وتسجيل ثلاث استخدامات للتبخر يلاحظها في المنزل. لولي الأمر: الحديث مع الابن عن طرق تجفيف الأطعمة في البيت العُماني.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\nللطالب: حل تمرين 3-2 بكتاب النشاط ص32. لولي الأمر: تذكير الابن بإحضار وعاءين متماثلين للاستقصاء القادم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=16"]}, {"code": "3-3", "title": "استقصاء التبخر", "unit": 3, "dates": "الأسبوع الحادي عشر (15–19/11/2026م)", "sb": "48–49", "tb": "63–65", "ab": "تمرين 3-3 ص33، ورقة العمل 3-3 ص75", "periods": [{"n": 1, "topic": "نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس) + نشاط 3-3ب: أثر المساحة السطحية في التبخر", "f": ["1. يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج\n2. يخطط لمقارنة التبخر في مكان دافئ ومكان بارد\n3. يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر\n4. يستنتج أن زيادة المساحة السطحية تزيد التبخر\n\nمخرج تعليمي آخر:\nيتنبأ بالنمط الذي سيظهر في النتائج\nيربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية", "المخرج 1 (يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج): تطبيق\nالمخرج 2 (يخطط لمقارنة التبخر في مكان دافئ ومكان بارد): تطبيق\nالمخرج 3 (يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر): تطبيق\nالمخرج 4 (يستنتج أن زيادة المساحة السطحية تزيد التبخر): فهم\nالمخرج الآخر (يتنبأ بالنمط الذي سيظهر في النتائج): تحليل\nالمخرج الآخر (يربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: وعاءان متماثلان في الحجم والشكل، مخبار مدرج، ماء، علبة وزبدية وصينية وكأس، ورقتان مبللتان", "الحجم، التبخر، المخبار المدرج.، المساحة السطحية، الحجم.", "يسأل المعلم: «عرفنا أن الدفء يسرع التبخر، فكم مليلترًا من الماء يمكن أن يتبخر من وعاء في خمسة أيام؟ هل يمكننا قياس ذلك؟».", "1. • التهيئة: يطرح المعلم السؤال، والطلبة يقدمون تقديرات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مهارة قياس الحجم: يراجع المعلم قراءة المخبار المدرج (ص64): اختيار المخبار المناسب، مستوى النظر، قاع التقعر، والطلبة يقرؤون أحجامًا معروضة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد نشاط 3-3أ: يتابع المعلم وفق ص48، والطلبة يضعون 200 ml في كل وعاء، ويضعون أحدهما في مكان بارد (كالخزانة) والآخر في مكان دافئ (حافة نافذة مشمسة) (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول التسجيل: يعرض المعلم جدول ص48 (اليوم، حجم الماء في الدافئ والبارد)، والطلبة ينسخون الجدول ويكتبون تنبؤهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • المساحة السطحية: يوضح المعلم مفهوم مساحة السطح المكشوف للهواء ويقارن الورقتين بعد دقائق، والطلبة يلاحظون أن الورقة المفرودة أكثر جفافًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • إعداد نشاط 3-3ب: يتابع المعلم وفق ص49، والطلبة يصبون 100 ml في كل من العلبة والزبدية والصينية والكأس، ويضعونها في المكان الدافئ نفسه (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. • الاختبار العادل: يسأل المعلم: ما الذي غيرناه؟ وما الذي ثبتناه؟ والطلبة يحددون: المتغير مساحة الفتحة، والثوابت الحجم الأولي والمكان والمدة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • جدول وتنبؤ: يعرض المعلم جدول ص49، والطلبة يكتبون تنبؤاتهم: الصينية تفقد أكثر (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n9. • الغلق: يحدد المعلم موعد القياس بعد ثلاثة أيام، والطلبة يستعدون (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) كم مليلترًا وضعنا في كل وعاء؟\n   الإجابة النموذجية: 200 ml.\n2. (مستوى التطبيق) أين وضعنا الوعاءين؟\n   الإجابة النموذجية: أحدهما في مكان بارد والآخر في مكان دافئ.\n3. (مستوى الاستدلال) ما النمط الذي تتنبأ به في النتائج؟\n   الإجابة النموذجية: سيقل حجم الماء في الوعاء الدافئ أسرع من البارد يومًا بعد يوم.\n\n4. (مستوى المعرفة) ما العامل الذي غيرناه في نشاط 3-3ب؟\n   الإجابة النموذجية: مساحة سطح فتحة الوعاء.\n5. (مستوى التطبيق) أي الورقتين جفت أسرع: المطوية أم المفرودة؟\n   الإجابة النموذجية: المفرودة.\n6. (مستوى الاستدلال) لماذا جفت الورقة المفرودة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها المكشوفة للهواء أكبر فيتبخر الماء منها أسرع.", "1. (مستوى المعرفة) صح أم خطأ: يجب أن يكون الوعاءان متماثلين في الحجم والشكل.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) كيف نقيس حجم الماء المتبقي في الوعاء؟\n   الإجابة النموذجية: نسكبه في المخبار المدرج ونقرأ الحجم ثم نعيده إلى الوعاء.\n3. (مستوى الاستدلال) لماذا نقيس الحجم كل يوم وليس في اليوم الأخير فقط؟\n   الإجابة النموذجية: لنرى النمط والتغير يومًا بعد يوم ونحصل على بيانات أكثر.\n\n4. (مستوى المعرفة) صح أم خطأ: وضعنا كميات مختلفة من الماء في الأوعية.\n   الإجابة النموذجية: خطأ؛ 100 ml في كل وعاء.\n5. (مستوى التطبيق) تنبأ: أي وعاء سيفقد أكبر كمية من الماء؟\n   الإجابة النموذجية: الصينية لأن مساحة سطحها أكبر.\n6. (مستوى الاستدلال) لماذا تُفرد الملابس المغسولة على الحبل بدل تركها مكومة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية المعرضة للهواء فتجف أسرع.", "للطالب: المشاركة في القياس اليومي وتسجيل الحجم في الجدول. لولي الأمر: تذكير الابن بإحضار أوعية مختلفة الفتحات (صحن، كوب، علبة) للحصة القادمة.\nللطالب: متابعة الأوعية وتسجيل الحجم بعد ثلاثة أيام. لولي الأمر: مناقشة الابن في سبب نشر الملابس مفرودة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=17"]}, {"n": 2, "topic": "تحليل نتائج استقصاء التبخر", "f": ["1. يحلل بيانات التبخر ويحدد النمط\n2. يمثل نتائج التبخر بتمثيل بياني مناسب\n\nمخرج تعليمي آخر: يقترح تعديلًا على الاستقصاء لدراسة أثر الرياح في التبخر", "المخرج 1 (يحلل بيانات التبخر ويحدد النمط): تحليل\nالمخرج 2 (يمثل نتائج التبخر بتمثيل بياني مناسب): تطبيق\nالمخرج الآخر (يقترح تعديلًا على الاستقصاء لدراسة أثر الرياح في التبخر): إبداع", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات  مقدار الماء المتبخر؟ (الإعداد والقياس)\n1. يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج\n2. يخطط لمقارنة التبخر في مكان دافئ ومكان بارد\n3. يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر\n4. يستنتج أن زيادة المساحة السطحية تزيد التبخر\n\nمخرج تعليمي آخر:\nيتنبأ بالنمط الذي سيظهر في النتائج\nيربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية\n\nالحصة 2: تحليل نتائج استقصاء التبخر\n1. يحلل بيانات التبخر ويحدد النمط\n2. يمثل نتائج التبخر بتمثيل بياني مناسب\n\nمخرج تعليمي آخر: يقترح تعديلًا على الاستقصاء لدراسة أثر الرياح في التبخر", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nالمخرج 1 (يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج): تطبيق\nالمخرج 2 (يخطط لمقارنة التبخر في مكان دافئ ومكان بارد): تطبيق\nالمخرج 3 (يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر): تطبيق\nالمخرج 4 (يستنتج أن زيادة المساحة السطحية تزيد التبخر): فهم\nالمخرج الآخر (يتنبأ بالنمط الذي سيظهر في النتائج): تحليل\nالمخرج الآخر (يربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية): تحليل\n\nالحصة 2: تحليل نتائج استقصاء التبخر\nالمخرج 1 (يحلل بيانات التبخر ويحدد النمط): تحليل\nالمخرج 2 (يمثل نتائج التبخر بتمثيل بياني مناسب): تطبيق\nالمخرج الآخر (يقترح تعديلًا على الاستقصاء لدراسة أثر الرياح في التبخر): إبداع", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 2: تحليل نتائج استقصاء التبخر\nالتعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nالكتاب، السبورة الذكية، أخرى: وعاءان متماثلان في الحجم والشكل، مخبار مدرج، ماء، علبة وزبدية وصينية وكأس، ورقتان مبللتان\n\nالحصة 2: تحليل نتائج استقصاء التبخر\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام، أخرى: ورقة العمل 3-3 ص75، ورق مربعات", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nالحجم، التبخر، المخبار المدرج.، المساحة السطحية، الحجم.\n\nالحصة 2: تحليل نتائج استقصاء التبخر\nالتبخر، النمط، التمثيل البياني.", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nيسأل المعلم: «عرفنا أن الدفء يسرع التبخر، فكم مليلترًا من الماء يمكن أن يتبخر من وعاء في خمسة أيام؟ هل يمكننا قياس ذلك؟».\n\nالحصة 2: تحليل نتائج استقصاء التبخر\nيعرض المعلم الوعاءين (الدافئ والبارد) وجداول الطلاب حتى اليوم، ويسأل: «ماذا تخبرنا الأرقام حتى الآن؟».", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس) — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقدمون تقديرات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مهارة قياس الحجم: يراجع المعلم قراءة المخبار المدرج (ص64): اختيار المخبار المناسب، مستوى النظر، قاع التقعر، والطلبة يقرؤون أحجامًا معروضة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد نشاط 3-3أ: يتابع المعلم وفق ص48، والطلبة يضعون 200 ml في كل وعاء، ويضعون أحدهما في مكان بارد (كالخزانة) والآخر في مكان دافئ (حافة نافذة مشمسة) (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول التسجيل: يعرض المعلم جدول ص48 (اليوم، حجم الماء في الدافئ والبارد)، والطلبة ينسخون الجدول ويكتبون تنبؤهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • المساحة السطحية: يوضح المعلم مفهوم مساحة السطح المكشوف للهواء ويقارن الورقتين بعد دقائق، والطلبة يلاحظون أن الورقة المفرودة أكثر جفافًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • إعداد نشاط 3-3ب: يتابع المعلم وفق ص49، والطلبة يصبون 100 ml في كل من العلبة والزبدية والصينية والكأس، ويضعونها في المكان الدافئ نفسه (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. • الاختبار العادل: يسأل المعلم: ما الذي غيرناه؟ وما الذي ثبتناه؟ والطلبة يحددون: المتغير مساحة الفتحة، والثوابت الحجم الأولي والمكان والمدة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • جدول وتنبؤ: يعرض المعلم جدول ص49، والطلبة يكتبون تنبؤاتهم: الصينية تفقد أكثر (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n9. • الغلق: يحدد المعلم موعد القياس بعد ثلاثة أيام، والطلبة يستعدون (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: تحليل نتائج استقصاء التبخر — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الجداول، والطلبة يقرؤون الأرقام (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • تحليل النتائج: يعرض المعلم بيانات نموذجية كاملة لخمسة أيام إلى جانب بيانات الطلاب، والطلبة يحددون النمط: الماء في المكان الدافئ يقل أسرع (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • ورقة العمل 3-3: يقدم المعلم ورقة العمل 3-3 (ارسم تمثيلًا بيانيًا يوضح عملية التبخر) ص75، والطلبة يرسمون التمثيل البياني ويحددون نوعه المناسب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة ص48–49: يناقش المعلم أسئلة النشاطين، والطلبة يجيبون: النمط، نوع التمثيل، الدلائل الكافية، أثر الرياح، الفرق بين الأوعية، عدالة الاختبار (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\n1. (مستوى المعرفة) كم مليلترًا وضعنا في كل وعاء؟\n   الإجابة النموذجية: 200 ml.\n2. (مستوى التطبيق) أين وضعنا الوعاءين؟\n   الإجابة النموذجية: أحدهما في مكان بارد والآخر في مكان دافئ.\n3. (مستوى الاستدلال) ما النمط الذي تتنبأ به في النتائج؟\n   الإجابة النموذجية: سيقل حجم الماء في الوعاء الدافئ أسرع من البارد يومًا بعد يوم.\n\n4. (مستوى المعرفة) ما العامل الذي غيرناه في نشاط 3-3ب؟\n   الإجابة النموذجية: مساحة سطح فتحة الوعاء.\n5. (مستوى التطبيق) أي الورقتين جفت أسرع: المطوية أم المفرودة؟\n   الإجابة النموذجية: المفرودة.\n6. (مستوى الاستدلال) لماذا جفت الورقة المفرودة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها المكشوفة للهواء أكبر فيتبخر الماء منها أسرع.\n\nالحصة 2: تحليل نتائج استقصاء التبخر\n1. (مستوى المعرفة) ما النمط الذي تلاحظه في نتائج نشاط 3-3أ؟\n   الإجابة النموذجية: يقل حجم الماء في الوعاء الدافئ أسرع من البارد.\n2. (مستوى التطبيق) ما نوع التمثيل المناسب لتغير حجم الماء يومًا بعد يوم؟\n   الإجابة النموذجية: التمثيل الخطي.\n3. (مستوى الاستدلال) كيف تعدّل الاستقصاء لمعرفة أثر الرياح في التبخر؟\n   الإجابة النموذجية: نضع وعاءين متماثلين في المكان نفسه، ونوجه مروحة نحو أحدهما فقط، ونقارن الحجم المتبقي.", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\n1. (مستوى المعرفة) صح أم خطأ: يجب أن يكون الوعاءان متماثلين في الحجم والشكل.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) كيف نقيس حجم الماء المتبقي في الوعاء؟\n   الإجابة النموذجية: نسكبه في المخبار المدرج ونقرأ الحجم ثم نعيده إلى الوعاء.\n3. (مستوى الاستدلال) لماذا نقيس الحجم كل يوم وليس في اليوم الأخير فقط؟\n   الإجابة النموذجية: لنرى النمط والتغير يومًا بعد يوم ونحصل على بيانات أكثر.\n\n4. (مستوى المعرفة) صح أم خطأ: وضعنا كميات مختلفة من الماء في الأوعية.\n   الإجابة النموذجية: خطأ؛ 100 ml في كل وعاء.\n5. (مستوى التطبيق) تنبأ: أي وعاء سيفقد أكبر كمية من الماء؟\n   الإجابة النموذجية: الصينية لأن مساحة سطحها أكبر.\n6. (مستوى الاستدلال) لماذا تُفرد الملابس المغسولة على الحبل بدل تركها مكومة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية المعرضة للهواء فتجف أسرع.\n\nالحصة 2: تحليل نتائج استقصاء التبخر\n1. (مستوى المعرفة) صح أم خطأ: الوعاء ذو الفتحة الأوسع يفقد ماءً أكثر بالتبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) كيف تتأكد من صحة استنتاجك عن التبخر؟\n   الإجابة النموذجية: بتكرار الاستقصاء عدة مرات وجمع دلائل كافية.\n3. (مستوى الاستدلال) لماذا تفقد البرك الضحلة ماءً أكثر بالتبخر من البرك العميقة (بالكمية نفسها)؟\n   الإجابة النموذجية: لأن مساحة سطحها المكشوفة للهواء أكبر.", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nللطالب: المشاركة في القياس اليومي وتسجيل الحجم في الجدول. لولي الأمر: تذكير الابن بإحضار أوعية مختلفة الفتحات (صحن، كوب، علبة) للحصة القادمة.\nللطالب: متابعة الأوعية وتسجيل الحجم بعد ثلاثة أيام. لولي الأمر: مناقشة الابن في سبب نشر الملابس مفرودة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=17\n\nالحصة 2: تحليل نتائج استقصاء التبخر\nللطالب: حل تمرين 3-3 بكتاب النشاط ص33، وإكمال ورقة العمل 3-3 ص75. لولي الأمر: تحضير ملعقة سكر وكوب ماء مع الابن لملاحظة الذوبان قبل الدرس القادم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=17"]}, {"code": "3-4", "title": "استقصاء التبخر من المحلول", "unit": 3, "dates": "الأسبوع الثاني عشر (22–26/11/2026م)", "sb": "50–51", "tb": "66–68", "ab": "تمرين 3-4 ص34، ورقة العمل 3-4 ص77", "periods": [{"n": 1, "topic": "المحاليل: المادة المذابة والمادة المذيبة + نشاط 3-4أ: تحضير محلول", "f": ["1. يعرّف المحلول والمادة المذابة والمادة المذيبة\n2. يحدد المادة المذابة والمادة المذيبة في محاليل مألوفة\n3. يحضر محلولًا من بلورات كبريتات النحاس والماء\n4. يصف ما يحدث للبلورات عند ذوبانها\n\nمخرج تعليمي آخر:\nيفسر سبب عدم رؤية المادة المذابة بعد ذوبانها\nيحدد المادة المذابة والمادة المذيبة في المحلول الذي حضّره", "المخرج 1 (يعرّف المحلول والمادة المذابة والمادة المذيبة): تذكر\nالمخرج 2 (يحدد المادة المذابة والمادة المذيبة في محاليل مألوفة): تطبيق\nالمخرج 3 (يحضر محلولًا من بلورات كبريتات النحاس والماء): تطبيق\nالمخرج 4 (يصف ما يحدث للبلورات عند ذوبانها): فهم\nالمخرج الآخر (يفسر سبب عدم رؤية المادة المذابة بعد ذوبانها): فهم\nالمخرج الآخر (يحدد المادة المذابة والمادة المذيبة في المحلول الذي حضّره): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: كأس شاي أو ماء، سكر، ملح، ملعقة\nالكتاب، السبورة الذكية، أخرى: بلورات كبريتات النحاس، كأس زجاجية، ملعقة صغيرة، ماء، قفازات", "المحلول، المادة المذابة، المادة المذيبة، تذوب.، البلورات، المادة المذيبة.", "يضع المعلم ملعقة سكر في كأس ماء ويحركها حتى تختفي، ويسأل: «أين ذهب السكر؟ هل اختفى أم ما زال موجودًا؟ كيف نتأكد؟».", "1. • التهيئة: ينفذ المعلم العرض ويطرح السؤال، والطلبة يتوقعون أنه موجود لأن الماء أصبح حلوًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم المحلول: يشرح المعلم من ص50: المحلول يتكون من مادة مذابة (تذوب) ومادة مذيبة (السائل الذي تذوب فيه)، والطلبة يكتبون التعريفات ويحددون المذاب والمذيب في محلول السكر (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تصنيف محاليل: يعرض المعلم أمثلة: شاي بسكر، ماء البحر، عصير مركز مع ماء، والطلبة يحددون المادة المذابة والمادة المذيبة في كل محلول (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يرسم المعلم على السبورة جزيئات المذاب تتوزع بالتساوي بين جزيئات المذيب، والطلبة يفسرون سبب عدم رؤية المادة المذابة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • السلامة: يوضح المعلم أن كبريتات النحاس ضارة إذا ابتُلعت، ويُلزم بلبس القفازات وعدم لمس العين وغسل اليدين، والطلبة يلتزمون بالتعليمات (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. 4أ: يتابع المعلم وفق ص50، والطلبة يملؤون ثلاثة أرباع الكأس بالماء، ويضيفون ملعقة صغيرة من البلورات، ويلاحظون ويرسمون ما يحدث ويسمونه (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. • أسئلة النشاط: يناقش المعلم أسئلة النشاط (3–6)، والطلبة يصفون: تختفي البلورات ويتلون الماء بالأزرق، لا نرى أجزاء صلبة، المذابة كبريتات النحاس والمذيبة الماء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • الغلق: يربط المعلم بنموذج الجزيئات، والطلبة يفسرون انتشار اللون بتوزع جزيئات المذاب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. (مستوى التطبيق) في محلول السكر والماء، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n3. (مستوى الاستدلال) لماذا لا نرى السكر بعد ذوبانه؟\n   الإجابة النموذجية: لأن جزيئاته توزعت بالتساوي بين جزيئات الماء.\n\n4. (مستوى المعرفة) ماذا حدث للبلورات في الماء؟\n   الإجابة النموذجية: ذابت واختفت وأصبح لون الماء أزرق.\n5. (مستوى التطبيق) هل يمكنك رؤية بلورات صلبة في المحلول؟\n   الإجابة النموذجية: لا.\n6. (مستوى الاستدلال) ما المادة المذابة وما المادة المذيبة في هذا النشاط؟\n   الإجابة النموذجية: المذابة: كبريتات النحاس، المذيبة: الماء.", "1. (مستوى المعرفة) أكمل: المادة التي تذوب تسمى …… والسائل الذي تذوب فيه يسمى ……\n   الإجابة النموذجية: المادة المذابة؛ المادة المذيبة.\n2. (مستوى التطبيق) حدد المادة المذابة والمذيبة في ماء البحر.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (مستوى الاستدلال) كيف تثبت أن الملح ما زال موجودًا في الماء رغم أنك لا تراه؟\n   الإجابة النموذجية: بتذوق الماء (بإشراف المعلم) أو بتبخير الماء فيبقى الملح.\n\n4. (مستوى المعرفة) صح أم خطأ: يمكن رؤية المادة المذابة في المحلول بعد ذوبانها.\n   الإجابة النموذجية: خطأ.\n5. (مستوى التطبيق) لماذا نلبس القفازات عند استخدام كبريتات النحاس؟\n   الإجابة النموذجية: لأنها مادة ضارة يجب عدم لمسها أو ابتلاعها.\n6. (مستوى الاستدلال) لماذا انتشر اللون الأزرق في الماء كله؟\n   الإجابة النموذجية: لأن جزيئات كبريتات النحاس توزعت بالتساوي بين جزيئات الماء.", "للطالب: قراءة كتاب الطالب ص50، وكتابة مثالين لمحاليل في المطبخ. لولي الأمر: مساعدة الابن في تحديد المذاب والمذيب في محاليل منزلية (شاي، قهوة، عصير).\nللطالب: رسم الكأس قبل الذوبان وبعده وتسمية المذاب والمذيب. لولي الأمر: مناقشة الابن في سبب عدم رؤية السكر في الشاي رغم وجوده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=18"]}, {"n": 2, "topic": "نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)", "f": ["1. يخطط لاستقصاء استعادة الملح الصلب من محلول ملحي بالتبخر\n2. يحضر محلولًا ملحيًا بقياس الكتلة والحجم بدقة\n\nمخرج تعليمي آخر: يتنبأ بما سيحدث عند تبخير المحلول ويعلل تنبؤه", "المخرج 1 (يخطط لاستقصاء استعادة الملح الصلب من محلول ملحي بالتبخر): تطبيق\nالمخرج 2 (يحضر محلولًا ملحيًا بقياس الكتلة والحجم بدقة): تطبيق\nالمخرج الآخر (يتنبأ بما سيحدث عند تبخير المحلول ويعلل تنبؤه): تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالاكتشاف", "الكتاب، السبورة الذكية، أخرى: ملح، ماء، مخبار مدرج، ميزان إلكتروني، وعاء صغير، ملعقة صغيرة", "المحلول، التبخر، المادة المذابة، المادة المذيبة.", "يطرح المعلم مشكلة: «سقط ملح في ماء فذاب، وأنت تحتاج إلى الملح! كيف تستعيده؟ تذكّر ما تعلمته عن التبخر».", "1. • التهيئة: يطرح المعلم المشكلة، والطلبة يقترحون تبخير الماء (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التخطيط: يناقش المعلم خطوات نشاط 3-4ب ص51 (أين نضع الوعاء؟ كم نحتاج من الوقت؟)، والطلبة يكتبون خطة مختصرة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تحضير المحلول: يوضح المعلم استخدام الميزان الإلكتروني والمخبار، والطلبة يزنون 5 g من الملح ويذيبونها في 50 ml من الماء (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • التنبؤ والرسم: يطلب المعلم كتابة التنبؤ ورسم الأدوات والخطوات، والطلبة يتنبؤون ببقاء الملح بعد تبخر الماء ويرسمون الخطوات (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. • الإعداد: يحدد المعلم مكانًا دافئًا مشمس
