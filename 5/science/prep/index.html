قط ملح في ماء فذاب، وأنت تحتاج إلى الملح! كيف تستعيده؟ تذكّر ما تعلمته عن التبخر».\n\nالحصة 3: نتائج استعادة الملح والأسئلة\nيعرض المعلم أوعية المحلول الملحي بعد التبخر ويطلب من الطلاب فحص ما تبقى فيها بالعدسة المكبرة.\n\nالحصة 4: ورقة العمل 3-4: فصل الملح عن الرمل\nيخلط المعلم ملعقة ملح بملعقة رمل أمام الطلاب ويسأل: «كيف نفصل الملح عن الرمل؟ لا يمكننا التقاط حبات الملح واحدة واحدة!».", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة — زمن الحصة 40 دقيقة\n1. • التهيئة: ينفذ المعلم العرض ويطرح السؤال، والطلبة يتوقعون أنه موجود لأن الماء أصبح حلوًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم المحلول: يشرح المعلم من ص50: المحلول يتكون من مادة مذابة (تذوب) ومادة مذيبة (السائل الذي تذوب فيه)، والطلبة يكتبون التعريفات ويحددون المذاب والمذيب في محلول السكر (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تصنيف محاليل: يعرض المعلم أمثلة: شاي بسكر، ماء البحر، عصير مركز مع ماء، والطلبة يحددون المادة المذابة والمادة المذيبة في كل محلول (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يرسم المعلم على السبورة جزيئات المذاب تتوزع بالتساوي بين جزيئات المذيب، والطلبة يفسرون سبب عدم رؤية المادة المذابة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • السلامة: يوضح المعلم أن كبريتات النحاس ضارة إذا ابتُلعت، ويُلزم بلبس القفازات وعدم لمس العين وغسل اليدين، والطلبة يلتزمون بالتعليمات (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. 4أ: يتابع المعلم وفق ص50، والطلبة يملؤون ثلاثة أرباع الكأس بالماء، ويضيفون ملعقة صغيرة من البلورات، ويلاحظون ويرسمون ما يحدث ويسمونه (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. • أسئلة النشاط: يناقش المعلم أسئلة النشاط (3–6)، والطلبة يصفون: تختفي البلورات ويتلون الماء بالأزرق، لا نرى أجزاء صلبة، المذابة كبريتات النحاس والمذيبة الماء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • الغلق: يربط المعلم بنموذج الجزيئات، والطلبة يفسرون انتشار اللون بتوزع جزيئات المذاب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد) — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم المشكلة، والطلبة يقترحون تبخير الماء (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التخطيط: يناقش المعلم خطوات نشاط 3-4ب ص51 (أين نضع الوعاء؟ كم نحتاج من الوقت؟)، والطلبة يكتبون خطة مختصرة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تحضير المحلول: يوضح المعلم استخدام الميزان الإلكتروني والمخبار، والطلبة يزنون 5 g من الملح ويذيبونها في 50 ml من الماء (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • التنبؤ والرسم: يطلب المعلم كتابة التنبؤ ورسم الأدوات والخطوات، والطلبة يتنبؤون ببقاء الملح بعد تبخر الماء ويرسمون الخطوات (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. • الإعداد: يحدد المعلم مكانًا دافئًا مشمسًا للأوعية، والطلبة يضعون الوعاء في المكان المحدد (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يسأل المعلم: كم يومًا نحتاج؟ والطلبة يقدرون المدة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: نتائج استعادة الملح والأسئلة — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الأوعية، والطلبة يفحصون البلورات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الملاحظة: يسأل المعلم: ماذا بقي؟ أين ذهب الماء؟ والطلبة يصفون بلورات الملح البيضاء ويستنتجون أن الماء تبخر (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة ص51: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن صحة التنبؤ، وطريقتين لتسريع النتائج، ويختارون «من الممكن» فصل الصلبة عن السائلة بالتبخر (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • الملاحات: يعرض المعلم صورة الملاحات ص50 ويشرح كيف يستخلص الملح من ماء البحر بالتبخر، والطلبة يربطون النشاط بالملاحات (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تحدث عن: يطرح المعلم سؤال ص51: عصير التفاح مع الماء، هل هو محلول؟ والطلبة يناقشون: نعم، مواد العصير تذوب في الماء ولا نراها منفصلة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: ورقة العمل 3-4: فصل الملح عن الرمل — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم المخلوط ويطرح السؤال، والطلبة يقترحون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التخطيط: يقدم المعلم ورقة العمل 3-4 ص77 ويوجه إلى التفكير: ماذا يذوب؟ ماذا لا يذوب؟ والطلبة يخططون: إضافة الماء لإذابة الملح، الترشيح لفصل الرمل، تبخير الماء لاستعادة الملح (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • التنفيذ: يعرض المعلم طريقة طي ورق الترشيح ويتابع، والطلبة يذيبون المخلوط في الماء ويرشحونه، ويضعون المحلول الراشح في طبق للتبخير (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تمرين 3-4: يقدم المعلم تمرين 3-4 بكتاب النشاط ص34، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\n1. (مستوى المعرفة) ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. (مستوى التطبيق) في محلول السكر والماء، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n3. (مستوى الاستدلال) لماذا لا نرى السكر بعد ذوبانه؟\n   الإجابة النموذجية: لأن جزيئاته توزعت بالتساوي بين جزيئات الماء.\n\n4. (مستوى المعرفة) ماذا حدث للبلورات في الماء؟\n   الإجابة النموذجية: ذابت واختفت وأصبح لون الماء أزرق.\n5. (مستوى التطبيق) هل يمكنك رؤية بلورات صلبة في المحلول؟\n   الإجابة النموذجية: لا.\n6. (مستوى الاستدلال) ما المادة المذابة وما المادة المذيبة في هذا النشاط؟\n   الإجابة النموذجية: المذابة: كبريتات النحاس، المذيبة: الماء.\n\nالحصة 2: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\n1. (مستوى المعرفة) كم غرامًا من الملح أذبنا في 50 ml من الماء؟\n   الإجابة النموذجية: 5 g.\n2. (مستوى التطبيق) ما الأداة التي استخدمناها لقياس كتلة الملح؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. (مستوى الاستدلال) تنبأ بما سيبقى في الوعاء بعد تبخر الماء.\n   الإجابة النموذجية: سيبقى الملح الصلب (بلورات الملح).\n\nالحصة 3: نتائج استعادة الملح والأسئلة\n1. (مستوى المعرفة) ماذا بقي في الوعاء بعد تبخر الماء؟\n   الإجابة النموذجية: بلورات الملح.\n2. (مستوى التطبيق) أين ذهب الماء؟\n   الإجابة النموذجية: تبخر إلى الهواء.\n3. (مستوى الاستدلال) هل كان تنبؤك صحيحًا؟ وضّح.\n   الإجابة النموذجية: تقبل الإجابة المبررة بمقارنة التنبؤ بالملاحظة.\n\nالحصة 4: ورقة العمل 3-4: فصل الملح عن الرمل\n1. (مستوى المعرفة) لماذا أضفنا الماء إلى مخلوط الملح والرمل؟\n   الإجابة النموذجية: لإذابة الملح.\n2. (مستوى التطبيق) ماذا بقي على ورق الترشيح؟\n   الإجابة النموذجية: الرمل.\n3. (مستوى الاستدلال) ماذا نفعل بالمحلول الراشح لاستعادة الملح؟\n   الإجابة النموذجية: نبخر الماء منه فيبقى الملح.", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\n1. (مستوى المعرفة) أكمل: المادة التي تذوب تسمى …… والسائل الذي تذوب فيه يسمى ……\n   الإجابة النموذجية: المادة المذابة؛ المادة المذيبة.\n2. (مستوى التطبيق) حدد المادة المذابة والمذيبة في ماء البحر.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (مستوى الاستدلال) كيف تثبت أن الملح ما زال موجودًا في الماء رغم أنك لا تراه؟\n   الإجابة النموذجية: بتذوق الماء (بإشراف المعلم) أو بتبخير الماء فيبقى الملح.\n\n4. (مستوى المعرفة) صح أم خطأ: يمكن رؤية المادة المذابة في المحلول بعد ذوبانها.\n   الإجابة النموذجية: خطأ.\n5. (مستوى التطبيق) لماذا نلبس القفازات عند استخدام كبريتات النحاس؟\n   الإجابة النموذجية: لأنها مادة ضارة يجب عدم لمسها أو ابتلاعها.\n6. (مستوى الاستدلال) لماذا انتشر اللون الأزرق في الماء كله؟\n   الإجابة النموذجية: لأن جزيئات كبريتات النحاس توزعت بالتساوي بين جزيئات الماء.\n\nالحصة 2: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\n1. (مستوى المعرفة) صح أم خطأ: يتبخر الملح مع الماء.\n   الإجابة النموذجية: خطأ؛ يتبخر الماء ويبقى الملح.\n2. (مستوى التطبيق) أين يجب وضع الوعاء ليتبخر الماء أسرع؟\n   الإجابة النموذجية: في مكان دافئ مشمس.\n3. (مستوى الاستدلال) اقترح طريقتين لتسريع الحصول على الملح.\n   الإجابة النموذجية: استخدام وعاء واسع (مساحة سطح أكبر)، وضعه في مكان أدفأ أو توجيه مروحة نحوه، أو استخدام كمية أقل من الماء.\n\nالحصة 3: نتائج استعادة الملح والأسئلة\n1. (مستوى المعرفة) أكمل: لقد اكتشفت أنه من …… فصل المادة الصلبة عن السائلة باستخدام التبخر.\n   الإجابة النموذجية: الممكن.\n2. (مستوى التطبيق) كيف يُستخلص الملح من ماء البحر في الملاحات؟\n   الإجابة النموذجية: يوضع ماء البحر في أحواض واسعة ضحلة تحت الشمس فيتبخر الماء ويبقى الملح.\n3. (مستوى الاستدلال) لماذا تُصنع أحواض الملاحات واسعة وضحلة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية فيتبخر الماء أسرع.\n\n مثّل المعلم بطلاب «جزيئات غاز» تتحرك بسرعة ثم تفقد طاقة فتبطؤ وتقترب، والطلبة يصفون ما يحدث لجزيئات الغاز عند التبريد (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • علبة المشروب: يعرض المعلم صورة العلبة الباردة ص52، والطلبة يفسرون القطرات على سطحها الخارجي (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. • التخطيط: يقرأ المعلم خطوات نشاط 3-5أ ص52، والطلبة يحددون: كأس بها ثلج وأخرى بها ماء، ومدة 10 دقائق (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. 5أ: يتابع المعلم وفق ص52، والطلبة يمسحون الكأسين، ويضعون الثلج في إحداهما والماء في الأخرى، ويتركونهما 10 دقائق، ويلاحظون ويرسمون (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. • أسئلة النشاط: يناقش المعلم الأسئلة (1–3) ص52، والطلبة يستنتجون أن البلل ظهر على كأس الثلج من الخارج، وأن الماء جاء من بخار الهواء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. • إعداد نشاط 3-5ب: يوجه المعلم وفق ص53، والطلبة يسكبون 100 ml في كأسين، ويحددون المستوى بالقلم، ويغطون إحداهما بإحكام بالبلاستيك، ويتركونهما في مكان دافئ حتى الغد (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: نشاط 3-5ب: ملاحظة التبخر والتكثيف — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الكأسين، والطلبة يلاحظون القطرات تحت البلاستيك (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الملاحظة والمقارنة: يوجه المعلم إلى مقارنة المستويين، والطلبة يلاحظون أن الماء في المكشوفة قل أكثر، وأن قطرات تكونت تحت البلاستيك في المغطاة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • أسئلة ص53: يناقش المعلم الأسئلة (1–4)، والطلبة يكملون: اكتسب الماء حرارة وتبخر ليكوّن بخار الماء، وفي المغطاة برد البخار وتكثف ليكوّن قطرات الماء على البلاستيك (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تمرين 3-5: يقدم المعلم تمرين 3-5 بكتاب النشاط ص35، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: مفهوم التكثيف\n1. (مستوى المعرفة) ما التكثيف؟\n   الإجابة النموذجية: تحول المادة من الحالة الغازية إلى الحالة السائلة.\n2. (مستوى التطبيق) لماذا تكوّن الضباب على المرآة عند التنفس عليها؟\n   الإجابة النموذجية: لأن بخار الماء في هواء الزفير برد عند ملامسة المرآة الباردة فتكثف.\n3. (مستوى الاستدلال) ماذا يحدث لجزيئات الغاز عندما يبرد؟\n   الإجابة النموذجية: تفقد بعض طاقتها فتبطؤ حركتها وتقترب من بعضها فيتكون السائل.\n\n4. (مستوى المعرفة) على أي الكأسين ظهر البلل من الخارج؟\n   الإجابة النموذجية: على الكأس التي بها ثلج.\n5. (مستوى التطبيق) من أين جاء الماء على السطح الخارجي للكأس؟\n   الإجابة النموذجية: من بخار الماء في الهواء الذي تكثف عند ملامسة الكأس الباردة.\n6. (مستوى الاستدلال) لماذا مسحنا الكأسين في بداية النشاط؟\n   الإجابة النموذجية: لنتأكد أنهما جافتان فيكون أي بلل لاحق ناتجًا عن التكثيف.\n\nالحصة 2: نشاط 3-5ب: ملاحظة التبخر والتكثيف\n1. (مستوى المعرفة) في أي الكأسين قل الماء أكثر؟\n   الإجابة النموذجية: الكأس المكشوفة.\n2. (مستوى التطبيق) ماذا تكون على البلاستيك في الكأس المغطاة؟\n   الإجابة النموذجية: قطرات ماء.\n3. (مستوى الاستدلال) لماذا بقي الماء في الكأس المغطاة تقريبًا كما هو؟\n   الإجابة النموذجية: لأن بخار الماء لم يخرج؛ تكثف على البلاستيك وعاد إلى الكأس.", "الحصة 1: مفهوم التكثيف\n1. (مستوى المعرفة) صح أم خطأ: التكثيف عكس التبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) من أين تأتي القطرات على السطح الخارجي لعلبة مشروب باردة؟\n   الإجابة النموذجية: من بخار الماء الموجود في الهواء الذي يتكثف عند ملامسة العلبة الباردة.\n3. (مستوى الاستدلال) لماذا لا تتكون قطرات على علبة في درجة حرارة الغرفة؟\n   الإجابة النموذجية: لأن سطحها ليس باردًا بدرجة كافية لتكثيف بخار الماء.\n\n4. (مستوى المعرفة) صح أم خطأ: تسرّب الماء من داخل الكأس إلى خارجها.\n   الإجابة النموذجية: خطأ؛ الماء جاء من الهواء.\n5. (مستوى التطبيق) لماذا لم يظهر بلل على كأس الماء العادي؟\n   الإجابة النموذجية: لأنها ليست باردة بما يكفي لتكثيف بخار الماء.\n6. (مستوى الاستدلال) لماذا تتسم هذه العملية بأنها عكس عملية التبخر؟\n   الإجابة النموذجية: لأن التبخر يحول السائل إلى غاز، والتكثيف يحول الغاز إلى سائل.\n\nالحصة 2: نشاط 3-5ب: ملاحظة التبخر والتكثيف\n1. (مستوى المعرفة) أكمل: اكتسب الماء في الكأس المكشوفة …… و…… ليكوّن بخار الماء.\n   الإجابة النموذجية: حرارة؛ تبخر.\n2. (مستوى التطبيق) في الكأس المغطاة، برد بخار الماء و…… ليكوّن …… على بلاستيك التغليف.\n   الإجابة النموذجية: تكثف؛ قطرات الماء.\n3. (مستوى الاستدلال) كيف يمكن استخدام التبخر والتكثيف لتنظيف ماء الشرب؟\n   الإجابة النموذجية: بتبخير الماء الملوث ثم تكثيف بخاره على سطح بارد وجمع القطرات النقية.", "الحصة 1: مفهوم التكثيف\nللطالب: قراءة كتاب الطالب ص52، وملاحظة أمثلة على التكثيف في المنزل (زجاج الحمام، غطاء القدر). لولي الأمر: إحضار مكعبات ثلج في وعاء محكم للنشاط القادم.\nللطالب: عدم تحريك كأسي نشاط 3-5ب حتى الحصة القادمة، وقراءة كتاب الطالب ص53. لولي الأمر: ملاحظة غطاء قدر الطبخ مع الابن وتفسير القطرات المتكونة عليه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=19\n\nالحصة 2: نشاط 3-5ب: ملاحظة التبخر والتكثيف\nللطالب: حل تمرين 3-5 بكتاب النشاط ص35 إن لم يكتمل. لولي الأمر: مشاهدة مقطع عن دورة الماء في الطبيعة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=19"]}, {"code": "3-6", "title": "دورة الماء في الطبيعة", "unit": 3, "dates": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "sb": "54–55", "tb": "71–72", "ab": "تمرين 3-6 ص36، ورقة العمل 3-6 ص79", "periods": [{"n": 1, "topic": "مراحل دورة الماء في الطبيعة", "f": ["1. يصف مراحل دورة الماء في الطبيعة\n2. يوضح دور التبخر والتكثيف في دورة الماء\nمخرج تعليمي آخر: يربط بين دورة الماء والهطول (الأمطار والثلوج والبرد)", "المخرج 1 (يصف مراحل دورة الماء في الطبيعة): فهم\nالمخرج 2 (يوضح دور التبخر والتكثيف في دورة الماء): فهم\nالمخرج الآخر (يربط بين دورة الماء والهطول (الأمطار والثلوج والبرد)): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، صورة توضيحية، أخرى: نموذج لدورة الماء (وعاء ماء دافئ مغطى بطبق عليه ثلج)", "دورة الماء، التبخر، التكثيف، الهطول، السحب.", "يسأل المعلم: «هل تصدقون أن الماء الذي تشربونه اليوم ربما شربه أجدادكم قبل مئات السنين؟ كيف يمكن ذلك؟»، ثم يكتب كلمة «دورة» على السبورة.", "1. • التهيئة: يطرح المعلم السؤال ويناقش معنى «دورة»، والطلبة يقترحون أن الماء يتكرر استخدامه (5 دقائق)\nالاسترات  التطبيق) أكمل: يبرد بخار الماء و…… نظرًا لارتفاعه في الهواء.\n   الإجابة النموذجية: يتكثف.\n3. (مستوى الاستدلال) لماذا نضع حجرًا صغيرًا فوق الكيس في وسطه؟\n   الإجابة النموذجية: ليتجه الكيس إلى أسفل فوق العلبة فتتجمع قطرات الماء المتكثفة وتسقط فيها.", "الحصة 1: مراحل دورة الماء في الطبيعة\nللطالب: قراءة كتاب الطالب ص54، ورسم دورة الماء في الطبيعة. لولي الأمر: مناقشة الابن في مصادر المياه في المنطقة (الأفلاج، الآبار، محطات التحلية).\n\nالحصة 2: أسئلة دورة الماء وورقة العمل 3-6: استخلاص الماء العذب\nللطالب: حل تمرين 3-6 بكتاب النشاط ص36، وإكمال ورقة العمل 3-6 ص79. لولي الأمر: تنفيذ النظام في المنزل تحت الشمس مع الابن (بإشراف) وملاحظة النتيجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=20"]}, {"code": "3-7", "title": "الغليان", "unit": 3, "dates": "الأسبوع الرابع عشر (6–10/12/2026م)", "sb": "56–57", "tb": "73–75", "ab": "تمرين 3-7 ص37، ورقة العمل 3-7 ص81", "periods": [{"n": 1, "topic": "مفهوم الغليان وقواعد السلامة + نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟", "f": ["1. يعرّف الغليان ويصف ما يحدث للسائل عند غليانه\n2. يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي\n3. يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان\n4. يصف مظهر الماء المغلي والفقاعات المتكونة\n\nمخرج تعليمي آخر:\nيحدد قواعد السلامة عند التعامل مع الماء المغلي\nيفسر تكون الفقاعات داخل الماء المغلي", "المخرج 1 (يعرّف الغليان ويصف ما يحدث للسائل عند غليانه): فهم\nالمخرج 2 (يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي): تحليل\nالمخرج 3 (يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان): فهم\nالمخرج 4 (يصف مظهر الماء المغلي والفقاعات المتكونة): فهم\nالمخرج الآخر (يحدد قواعد السلامة عند التعامل مع الماء المغلي): تطبيق\nالمخرج الآخر (يفسر تكون الفقاعات داخل الماء المغلي): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: صورة إناء يغلي\nالكتاب، السبورة الذكية، أخرى: دورق أو إناء، لوح تسخين أو موقد بنزن، ماء، حامل (عرض المعلم)", "الغليان، يغلي، البخار، درجة الغليان.، الفقاعات.", "يعرض المعلم صورة الطالبين ص56 ويقرأ حوارهما: «الهواء فوق الإناء ساخن للغاية… لقد احترقت يدي ولم ألمس الإناء!»، ويسأل: «لماذا احترقت يد خالد دون أن يلمس الإناء؟».", "1. • التهيئة: يعرض المعلم الصورة ويقرأ الحوار، والطلبة يقترحون: البخار الساخن (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الغليان: يشرح المعلم ص56: عند تسخين الماء بدرجة كافية يغلي؛ تكتسب الجزيئات طاقة كبيرة فتتحرك بسرعة وتنفصل ويتحول الماء إلى بخار. سائل + حرارة ← غاز، والطلبة يكتبون التعريف والمعادلة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • البخار والسحابة: يوضح المعلم أن البخار غاز غير مرئي، والسحابة البيضاء فوق الإناء قطرات تكثفت عند ملامسة الهواء الأبرد، والطلبة يرسمون إناءً يغلي ويحددون المنطقة غير المرئية والسحابة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • السلامة: يناقش المعلم تحذير الأمن والسلامة ص56: الماء المغلي والبخار يسببان حروقًا، والطلبة يكتبون ثلاث قواعد سلامة عند الغليان (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • عرض نشاط 3-7أ: يسخن المعلم الماء ويطلب وصف ما يحدث على مراحل، والطلبة يلاحظون فقاعات صغيرة ثم كبيرة ترتفع وتنفجر عند السطح، وتصاعد سحابة بيضاء (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. • الوصف: يسأل المعلم: كيف يبدو الماء المغلي؟ والطلبة يصفون: فقاعات كثيرة، حركة شديدة، صوت، سحابة فوقه (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. • تفسير الفقاعات: يوضح المعلم أن الفقاعات تحتوي على بخار الماء الذي تكون داخل السائل، والطلبة يفسرون الفقاعات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. • الغلق: يذكّر المعلم: لماذا لم نمرر أيدينا فوق الإناء؟ والطلبة يجيبون: خطر الحروق من البخار (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (مستوى المعرفة) ماذا يحدث للماء عندما يغلي؟\n   الإجابة النموذجية: يتحول من سائل إلى غاز (بخار).\n2. (مستوى التطبيق) لماذا احترقت يد خالد دون أن يلمس الإناء؟\n   الإجابة النموذجية: لأن البخار الساخن فوق الإناء يسبب الحروق.\n3. (مستوى الاستدلال) هل السحابة البيضاء فوق الماء المغلي هي البخار؟ وضّح.\n   الإجابة النموذجية: لا؛ البخار غير مرئي، والسحابة قطرات ماء صغيرة تكثفت عندما برد البخار في الهواء.\n\n4. (مستوى المعرفة) ماذا ظهر داخل الماء عند غليانه؟\n   الإجابة النموذجية: فقاعات كبيرة ترتفع وتنفجر عند السطح.\n5. (مستوى التطبيق) ما الذي يحدث للماء بعد أن ترتفع درجة حرارته كثيرًا؟\n   الإجابة النموذجية: يغلي ويتحول إلى بخار.\n6. (مستوى الاستدلال) ماذا تحتوي الفقاعات في الماء المغلي؟\n   الإجابة النموذجية: بخار الماء.", "1. (مستوى المعرفة) صح أم خطأ: البخار غاز غير مرئي.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر قاعدتين للسلامة عند غلي الماء.\n   الإجابة النموذجية: عدم تمرير اليد فوق الإناء، وعدم لمس الإناء الساخن، والابتعاد عن البخار (أي اثنتين).\n3. (مستوى الاستدلال) ما الفرق بين الهواء فوق الماء البارد والهواء فوق الماء المغلي؟\n   الإجابة النموذجية: فوق الماء المغلي يوجد بخار ساخن جدًا يسبب الحروق، أما فوق الماء البارد فالهواء غير ساخن.\n\n4. (مستوى المعرفة) صح أم خطأ: يجب أن يقترب الطلاب من الماء المغلي لملاحظته جيدًا.\n   الإجابة النموذجية: خطأ؛ نلاحظ من مسافة آمنة.\n5. (مستوى التطبيق) صف كيف يبدو الماء المغلي.\n   الإجابة النموذجية: تظهر فقاعات كثيرة كبيرة تتحرك بسرعة إلى السطح وتنفجر، وتتصاعد سحابة بيضاء.\n6. (مستوى الاستدلال) لماذا تتكون الفقاعات داخل الماء وليس على سطحه فقط؟\n   الإجابة النموذجية: لأن الماء كله يسخن ويتحول إلى بخار داخل السائل نفسه فيكوّن فقاعات ترتفع.", "للطالب: قراءة كتاب الطالب ص56، وكتابة قواعد السلامة في المطبخ. لولي الأمر: تعريف الابن بأماكن الخطر في المطبخ ومناقشة قواعد السلامة عند غلي الماء.\nللطالب: كتابة وصف لمراحل غليان الماء كما شاهدها. لولي الأمر: ملاحظة غليان الماء في المطبخ مع الابن من مسافة آمنة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"n": 2, "topic": "نشاط 3-7ب: استقصاء درجة غليان الماء", "f": ["1. يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده\n2. يحدد درجة غليان الماء النقي 100°C\n\nمخرج تعليمي آخر: يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان", "المخرج 1 (يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده): تطبيق\nالمخرج 2 (يحدد درجة غليان الماء النقي 100°C): تذكر\nالمخرج الآخر (يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: دورق زجاجي، لوح تسخين، ميزان حرارة، ساعة إيقاف، سدادة بثقب واحد (عرض المعلم)", "درجة الغليان، ميزان الحرارة، القياس.", "يسأل المعلم: «درجة حرارة ماء الصنبور البارد بين 20 و25°C، والساخن بين 50 و60°C. كم تتوقعون أن تكون درجة الحرارة عندما يغلي الماء؟».", "1. • التهيئة: يطرح المعلم السؤال، والطلبة يكتبون توقعاتهم (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • تجهيز الجدول: يعرض المعلم جدول ص57 (الزمن بالدقائق، درجة حرارة الماء)، والطلبة ينسخون الجدول (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • عرض نشاط 3-7ب: يسخن المعلم الماء ويقرأ ميزان الحرارة كل دقيقتين بصوت عالٍ، ويستمر أربع دقائق بعد بدء الغليان، والطلبة يسجلون القراءات ويلاحظون لحظة بدء الغليان (20 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • تحليل أولي: يسأل المعلم: ما درجة الحرارة عند بدء الغليان؟ هل ارتفعت بعد ذلك؟ والطلبة يلاحظون أنها وصلت إلى نحو 100°C وبقيت ثابتة تقريبًا (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يلخص المعلم: درجة غليان الماء النقي 100°C، والطلبة يكتبون المعلومة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (مستوى المعرفة) كل كم دقيقة سجلنا درجة الحرارة؟\n   الإجابة النموذجية: كل دقيقتين.\n2. (مستوى التطبيق) ما درجة الحرارة التي بدأ عندها الماء الغليان؟\n   الإجابة النموذجية: نحو 100°C.\n3. (مستوى الاستدلال) ماذا حدث لدرجة الحرارة بعد أن بدأ الماء يغلي؟\n   الإجابة النموذجية: بقيت ثابتة تقريبًا.", "1. (مستوى المعرفة) صح أم خطأ: درجة غليان الماء النقي 100°C.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الأدوات التي استخدمناها لقياس درجة الحرارة والزمن؟\n   الإجابة النموذجية: ميزان الحرارة وساعة الإيقاف.\n3. (مستوى الاستدلال) لماذا لم ترتفع درجة الحرارة رغم استمرار التسخين أثناء الغليان؟\n   الإجابة النموذجية: لأن الطاقة الحرارية تُستخدم في تحويل الماء إلى بخار.", "للطالب: الاحتفاظ بجدول القراءات لرسم التمثيل الخطي في الحصة القادمة. لولي الأمر: مراجعة قراءة ميزان الحرارة مع الابن (ميزان حرارة الجسم مثلًا).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"n": 3, "topic": "تمثيل نتائج الغليان خطيًا وأسئلة الدرس", "f": ["1. يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي\n2. يفسر النمط في النتائج (ارتفاع ثم ثبات عند 100°C)\n\nمخرج تعليمي آخر: يفسر لماذا لا يغلي الماء دائمًا عند 100°C", "المخرج 1 (يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي): تطبيق\nالمخرج 2 (يفسر النمط في النتائج (ارتفاع ثم ثبات عند 100°C)): تحليل\nالمخرج الآخر (يفسر لماذا لا يغلي الماء دائمًا عند 100°C): تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مربعات، جداول القراءات", "درجة الغليان، التمثيل الخطي، النمط.", "يعرض المعلم جدول القراءات ويسأل: «كيف نرى بلمحة واحدة كيف تغيرت درجة الحرارة مع الزمن؟».", "1. • التهيئة: يعرض المعلم الجدول، والطلبة يقترحون التمثيل الخطي (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • رسم التمثيل الخطي: يراجع المعلم الخطوات (محاور، مقياس، نقاط، توصيل)، والطلبة يرسمون الزمن على المحور الأفقي ودرجة الحرارة على الرأسي (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • أسئلة ص57: يناقش المعلم الأسئلة (1–4)، والطلبة يحددون النمط، نوع التمثيل، درجة الغليان، وأن الماء يغلي عند 100°C إذا كان نقيًا، ثبات درجة الحرارة أثناء الغليان، والفقاعات بخار ماء (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • التحدي: يطرح المعلم تحدي ص57: لماذا لا يغلي الماء دائمًا عند 100°C؟ والطلبة يستنتجون أن الماء غير النقي (كالماء المالح) يغلي عند درجة أعلى، وأن الماء على قمم الجبال العالية يغلي عند درجة أقل (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يلخص المعلم النمط، والطلبة يكتبون الاستنتاج (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما نوع التمثيل المناسب لنتائج نشاط 3-7ب؟ ولماذا؟\n   الإجابة النموذجية: التمثيل الخطي؛ لأن درجة الحرارة تتغير بمرور الزمن.\n2. (مستوى التطبيق) صف النمط في التمثيل البياني.\n   الإجابة النموذجية: ترتفع درجة الحرارة تدريجيًا حتى نحو 100°C ثم تبقى ثابتة أثناء الغليان.\n3. (مستوى الاستدلال) ما الفقاعات الموجودة في الماء المغلي؟\n   الإجابة النموذجية: فقاعات بخار الماء.", "1. (مستوى المعرفة) صح أم خطأ: ارتفعت درجة الحرارة كثيرًا بعد بدء الغليان.\n   الإجابة النموذجية: خطأ؛ بقيت ثابتة تقريبًا.\n2. (مستوى التطبيق) هل يغلي الماء المالح عند 100°C؟\n   الإجابة النموذجية: لا؛ يغلي عند درجة أعلى قليلًا لأنه غير نقي.\n3. (مستوى الاستدلال) لماذا قد يغلي الماء عند درجة أقل من 100°C على قمة جبل عالٍ؟\n   الإجابة النموذجية: لأن ضغط الهواء أقل في الأماكن المرتفعة فيغلي الماء عند درجة أقل.", "للطالب: إكمال التمثيل الخطي ومراجعة إجابات أسئلة ص57. لولي الأمر: مناقشة الابن في الفرق بين غليان الماء العادي والماء المالح أثناء الطبخ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"n": 4, "topic": "ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان", "f": ["1. يقارن بين التبخر والغليان\n2. يقترح طرقًا تجعل الماء يغلي أسرع ويبررها\n\nمخرج تعليمي آخر: يخطط لاختبار عادل يقارن فيه زمن غليان كميتين مختلفتين من الماء", "المخرج 1 (يقارن بين التبخر والغليان): تحليل\nالمخرج 2 (يقترح طرقًا تجعل الماء يغلي أسرع ويبررها): تطبيق\nالمخرج الآخر (يخطط لاختبار عادل يقارن فيه زمن غليان كميتين مختلفتين من الماء): إبداع", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة العمل 3-7 ص81", "التبخر، الغليان، درجة الغليان، الاختبار العادل.", "يطرح المعلم سؤال «تحدّث عن!» ص57: «ما الفرق بين التبخر والغليان؟ كلاهما يحول الماء إلى غاز!».", "1. • التهيئة: يطرح المعلم السؤال، والطلبة يقدمون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التبخر والغليان: يرسم المعلم جدول مقارنة (درجة الحرارة، المكان في السائل، السرعة، الفقاعات)، والطلبة يكملون: التبخر يحدث عند أي درجة ومن السطح فقط ببطء، والغليان عند درجة الغليان ومن داخل السائل كله بسرعة مع فقاعات (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • ورقة العمل 3-7: يقدم المعلم ورقة العمل ص81: كيف يغلي الماء بسرعة؟ والطلبة يقترحون: كمية أقل، غطاء للإناء، حرارة أعلى، ويخططون اختبارًا عادلًا لكميتين مختلفتين (15 دقيقة)\n يئات طاقة كبيرة فتتحرك بسرعة وتنفصل ويتحول الماء إلى بخار. سائل + حرارة ← غاز، والطلبة يكتبون التعريف والمعادلة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • البخار والسحابة: يوضح المعلم أن البخار غاز غير مرئي، والسحابة البيضاء فوق الإناء قطرات تكثفت عند ملامسة الهواء الأبرد، والطلبة يرسمون إناءً يغلي ويحددون المنطقة غير المرئية والسحابة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • السلامة: يناقش المعلم تحذير الأمن والسلامة ص56: الماء المغلي والبخار يسببان حروقًا، والطلبة يكتبون ثلاث قواعد سلامة عند الغليان (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • عرض نشاط 3-7أ: يسخن المعلم الماء ويطلب وصف ما يحدث على مراحل، والطلبة يلاحظون فقاعات صغيرة ثم كبيرة ترتفع وتنفجر عند السطح، وتصاعد سحابة بيضاء (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. • الوصف: يسأل المعلم: كيف يبدو الماء المغلي؟ والطلبة يصفون: فقاعات كثيرة، حركة شديدة، صوت، سحابة فوقه (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. • تفسير الفقاعات: يوضح المعلم أن الفقاعات تحتوي على بخار الماء الذي تكون داخل السائل، والطلبة يفسرون الفقاعات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. • الغلق: يذكّر المعلم: لماذا لم نمرر أيدينا فوق الإناء؟ والطلبة يجيبون: خطر الحروق من البخار (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: نشاط 3-7ب: استقصاء درجة غليان الماء — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يكتبون توقعاتهم (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • تجهيز الجدول: يعرض المعلم جدول ص57 (الزمن بالدقائق، درجة حرارة الماء)، والطلبة ينسخون الجدول (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • عرض نشاط 3-7ب: يسخن المعلم الماء ويقرأ ميزان الحرارة كل دقيقتين بصوت عالٍ، ويستمر أربع دقائق بعد بدء الغليان، والطلبة يسجلون القراءات ويلاحظون لحظة بدء الغليان (20 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • تحليل أولي: يسأل المعلم: ما درجة الحرارة عند بدء الغليان؟ هل ارتفعت بعد ذلك؟ والطلبة يلاحظون أنها وصلت إلى نحو 100°C وبقيت ثابتة تقريبًا (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يلخص المعلم: درجة غليان الماء النقي 100°C، والطلبة يكتبون المعلومة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: تمثيل نتائج الغليان خطيًا وأسئلة الدرس — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الجدول، والطلبة يقترحون التمثيل الخطي (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • رسم التمثيل الخطي: يراجع المعلم الخطوات (محاور، مقياس، نقاط، توصيل)، والطلبة يرسمون الزمن على المحور الأفقي ودرجة الحرارة على الرأسي (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • أسئلة ص57: يناقش المعلم الأسئلة (1–4)، والطلبة يحددون النمط، نوع التمثيل، درجة الغليان، وأن الماء يغلي عند 100°C إذا كان نقيًا، ثبات درجة الحرارة أثناء الغليان، والفقاعات بخار ماء (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • التحدي: يطرح المعلم تحدي ص57: لماذا لا يغلي الماء دائمًا عند 100°C؟ والطلبة يستنتجون أن الماء غير النقي (كالماء المالح) يغلي عند درجة أعلى، وأن الماء على قمم الجبال العالية يغلي عند درجة أقل (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يلخص المعلم النمط، والطلبة يكتبون الاستنتاج (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقدمون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التبخر والغليان: يرسم المعلم جدول مقارنة (درجة الحرارة، المكان في السائل، السرعة، الفقاعات)، والطلبة يكملون: التبخر يحدث عند أي درجة ومن السطح فقط ببطء، والغليان عند درجة الغليان ومن داخل السائل كله بسرعة مع فقاعات (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • ورقة العمل 3-7: يقدم المعلم ورقة العمل ص81: كيف يغلي الماء بسرعة؟ والطلبة يقترحون: كمية أقل، غطاء للإناء، حرارة أعلى، ويخططون اختبارًا عادلًا لكميتين مختلفتين (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تمرين 3-7: يقدم المعلم تمرين 3-7 بكتاب النشاط ص37 كواجب ويحل أول سؤال جماعيًا، والطلبة يشاركون (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة 1: مفهوم الغليان وقواعد السلامة\n1. (مستوى المعرفة) ماذا يحدث للماء عندما يغلي؟\n   الإجابة النموذجية: يتحول من سائل إلى غاز (بخار).\n2. (مستوى التطبيق) لماذا احترقت يد خالد دون أن يلمس الإناء؟\n   الإجابة النموذجية: لأن البخار الساخن فوق الإناء يسبب الحروق.\n3. (مستوى الاستدلال) هل السحابة البيضاء فوق الماء المغلي هي البخار؟ وضّح.\n   الإجابة النموذجية: لا؛ البخار غير مرئي، والسحابة قطرات ماء صغيرة تكثفت عندما برد البخار في الهواء.\n\n4. (مستوى المعرفة) ماذا ظهر داخل الماء عند غليانه؟\n   الإجابة النموذجية: فقاعات كبيرة ترتفع وتنفجر عند السطح.\n5. (مستوى التطبيق) ما الذي يحدث للماء بعد أن ترتفع درجة حرارته كثيرًا؟\n   الإجابة النموذجية: يغلي ويتحول إلى بخار.\n6. (مستوى الاستدلال) ماذا تحتوي الفقاعات في الماء المغلي؟\n   الإجابة النموذجية: بخار الماء.\n\nالحصة 2: نشاط 3-7ب: استقصاء درجة غليان الماء\n1. (مستوى المعرفة) كل كم دقيقة سجلنا درجة الحرارة؟\n   الإجابة النموذجية: كل دقيقتين.\n2. (مستوى التطبيق) ما درجة الحرارة التي بدأ عندها الماء الغليان؟\n   الإجابة النموذجية: نحو 100°C.\n3. (مستوى الاستدلال) ماذا حدث لدرجة الحرارة بعد أن بدأ الماء يغلي؟\n   الإجابة النموذجية: بقيت ثابتة تقريبًا.\n\nالحصة 3: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n1. (مستوى المعرفة) ما نوع التمثيل المناسب لنتائج نشاط 3-7ب؟ ولماذا؟\n   الإجابة النموذجية: التمثيل الخطي؛ لأن درجة الحرارة تتغير بمرور الزمن.\n2. (مستوى التطبيق) صف النمط في التمثيل البياني.\n   الإجابة النموذجية: ترتفع درجة الحرارة تدريجيًا حتى نحو 100°C ثم تبقى ثابتة أثناء الغليان.\n3. (مستوى الاستدلال) ما الفقاعات الموجودة في الماء المغلي؟\n   الإجابة النموذجية: فقاعات بخار الماء.\n\nالحصة 4: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n1. (مستوى المعرفة) ما الفرق بين التبخر والغليان من حيث درجة الحرارة؟\n   الإجابة النموذجية: التبخر يحدث عند أي درجة حرارة، والغليان يحدث عند درجة الغليان فقط.\n2. (مستوى التطبيق) أين يحدث التبخر في السائل؟ وأين يحدث الغليان؟\n   الإجابة النموذجية: التبخر من السطح فقط، والغليان في السائل كله.\n3. (مستوى الاستدلال) اقترح طريقة تجعل الماء يغلي أسرع وفسّرها.\n   الإجابة النموذجية: استخدام كمية أقل من الماء أو تغطية الإناء؛ لأن الكمية الأقل تحتاج طاقة أقل والغطاء يقلل فقد الحرارة.", "الحصة 1: مفهوم الغليان وقواعد السلامة\n1. (مستوى المعرفة) صح أم خطأ: البخار غاز غير مرئي.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر قاعدتين للسلامة عند غلي الماء.\n   الإجابة النموذجية: عدم تمرير اليد فوق الإناء، وعدم لمس الإناء الساخن، والابتعاد عن البخار (أي اثنتين).\n3. (مستوى الاستدلال) ما الفرق بين الهواء فوق الماء البارد والهواء فوق الماء المغلي؟\n   الإجابة النموذجية: فوق الماء المغلي يوجد بخار ساخن جدًا يسبب الحروق، أما فوق الماء البارد فالهواء غير ساخن.\n\n4. (مستوى المعرفة) صح أم خطأ: يجب أن يقترب الطلاب من الماء المغلي لملاحظته جيدًا.\n   الإجابة النموذجية: خطأ؛ نلاحظ من مسافة آمنة.\n5. (مستوى التطبيق) صف كيف يبدو الماء المغلي.\n   الإجابة النموذجية: تظهر فقاعات كثيرة كبيرة تتحرك بسرعة إلى السطح وتنفجر، وتتصاعد سحابة بيضاء.\n6. (مستوى الاستدلال) لماذا تتكون الفقاعات داخل الماء وليس على سطحه فقط؟\n   الإجابة النموذجية: لأن الماء كله يسخن ويتحول إلى بخار داخل السائل نفسه فيكوّن فقاعات ترتفع.\n\nالحصة 2: نشاط 3-7ب: استقصاء درجة غليان الماء\n1. (مستوى المعرفة) صح أم خطأ: درجة غليان الماء النقي 100°C.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الأدوات التي استخدمناها لقياس درجة الحرارة والزمن؟\n   الإجابة النموذجية: ميزان الحرارة وساعة الإيقاف.\n3. (مستوى الاستدلال) لماذا لم ترتفع درجة الحرارة رغم استمرار التسخين أثناء الغليان؟\n   الإجابة النموذجية: لأن الطاقة الحرارية تُستخدم في تحويل الماء إلى بخار.\n\nالحصة 3: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: ارتفعت درجة الحرارة كثيرًا بعد بدء الغليان.\n   الإجابة النموذجية: خطأ؛ بقيت ثابتة تقريبًا.\n2. (مستوى التطبيق) هل يغلي الماء المالح عند 100°C؟\n   الإجابة النموذجية: لا؛ يغلي عند درجة أعلى قليلًا لأنه غير نقي.\n3. (مستوى الاستدلال) لماذا قد يغلي الماء عند درجة أقل من 100°C على قمة جبل عالٍ؟\n   الإجابة النموذجية: لأن ضغط الهواء أقل في الأماكن المرتفعة فيغلي الماء عند درجة أقل.\n\nالحصة 4: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n1. (مستوى المعرفة) صح أم خطأ: الغليان يحدث بسرعة أكبر من التبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما العامل الذي تغيره عند مقارنة زمن غليان كميتين من الماء؟\n   الإجابة النموذجية: كمية الماء.\n3. (مستوى الاستدلال) اذكر عاملين يجب تثبيتهما في هذا الاختبار.\n   الإجابة النموذجية: نوع الإناء، ومصدر الحرارة وقوته، ودرجة حرارة الماء الابتدائية (أي اثنين).", "الحصة 1: مفهوم الغليان وقواعد السلامة\nللطالب: قراءة كتاب الطالب ص56، وكتابة قواعد السلامة في المطبخ. لولي الأمر: تعريف الابن بأماكن الخطر في المطبخ ومناقشة قواعد السلامة عند غلي الماء.\nللطالب: كتابة وصف لمراحل غليان الماء كما شاهدها. لولي الأمر: ملاحظة غليان الماء في المطبخ مع الابن من مسافة آمنة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21\n\nالحصة 2: نشاط 3-7ب: استقصاء درجة غليان الماء\nللطالب: الاحتفاظ بجدول القراءات لرسم التمثيل الخطي في الحصة القادمة. لولي الأمر: مراجعة قراءة ميزان الحرارة مع الابن (ميزان حرارة الجسم مثلًا).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21\n\nالحصة 3: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\nللطالب: إكمال التمثيل الخطي ومراجعة إجابات أسئلة ص57. لولي الأمر: مناقشة الابن في الفرق بين غليان الماء العادي والماء المالح أثناء الطبخ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21\n\nالحصة 4: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\nللطالب: حل تمرين 3-7 بكتاب النشاط ص37، وإكمال ورقة العمل 3-7 ص81. لولي الأمر: إحضار مكعبات ثلج وقطعة زبدة صغيرة مع الابن لدرس الانصهار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=21"]}, {"code": "3-8", "title": "الانصهار", "unit": 3, "dates": "الأسبوع الخامس عشر (13–17/12/2026م)", "sb": "58–59", "tb": "76–79", "ab": "تمرين 3-8 ص38، ورقتا العمل 3-8أ ص83 و3-8ب ص85", "periods": [{"n": 1, "topic": "مفهوم الانصهار ودرجة الانصهار + نشاط 3-8: استقصاء درجة انصهار الثلج", "f": ["1. يعرّف الانصهار ودرجة الانصهار\n2. يفسر الانصهار باكتساب جزيئات المادة الصلبة طاقة حرارية\n3. يقيس درجة حرارة الثلج كل دقيقة حتى ينصهر وبعده\n4. يحدد درجة انصهار الثلج 0°C\n\nمخرج تعليمي آخر:\nيقارن بين درجات انصهار مواد مختلفة\nيلاحظ ثبات درجة الحرارة أثناء الانصهار ويفسره", "المخرج 1 (يعرّف الانصهار ودرجة الانصهار): تذكر\nالمخرج 2 (يفسر الانصهار باكتساب جزيئات المادة الصلبة طاقة حرارية): فهم\nالمخرج 3 (يقيس درجة حرارة الثلج كل دقيقة حتى ينصهر وبعده): تطبيق\nالمخرج 4 (يحدد درجة انصهار الثلج 0°C): تذكر\nالمخرج الآخر (يقارن بين درجات انصهار مواد مختلفة): تحليل\nالمخرج الآخر (يلاحظ ثبات درجة الحرارة أثناء الانصهار ويفسره): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: مكعبات ثلج، قطعة زبدة، طبقان\nالكتاب، السبورة الذكية، أخرى: مكعبات ثلج، دورق زجاجي، ميزان حرارة، ساعة إيقاف، ورقة العمل 3-8ب ص85", "الانصهار، ينصهر، درجة الانصهار.، درجة الانصهار، ميزان الحرارة.", "يضع المعلم مكعب ثلج وقطعة زبدة متساويين في الحجم على طبقين في المكان نفسه، ويسأل: «أيهما سينصهر أولًا؟ ولماذا؟».", "1. • التهيئة: يعرض المعلم الثلج والزبدة، والطلبة يتنبؤون (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الانصهار: يشرح المعلم ص58: عند تسخين المواد الصلبة تكتسب جزيئاتها طاقة فتتحرك أسرع وتتباعد فتتحول إلى سائل. صلب + حرارة ← سائل، والطلبة يكتبون التعريف والمعادلة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • درجة الانصهار: يعرّف المعلم درجة الانصهار ويعرض صور ص58: الثلج، الزبدة، الفلزات، فتيل التنجستن (3380°C)، والطلبة يرتبون المواد حسب درجة انصهارها من الأقل إلى الأعلى (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يمثل المعلم بطلاب «جزيئات صلبة» متراصة تهتز، ثم تكتسب طاقة فتتحرك وتتباعد، والطلبة يصفون الفرق بين ترتيب جزيئات الصلب والسائل (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تجهيز الجدول: يعرض المعلم جدول ص59 ويقدم ورقة العمل 3-8ب ص85، والطلبة ينسخون الجدول (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. 8: يتابع المعلم وفق ص59، والطلبة يضعون الثلج في الدورق، ويقيسون درجة الحرارة كل دقيقة حتى ينصهر، ثم كل دقيقة لعشر دقائق أخرى، ويسجلون (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n7. • تحليل أولي: يسأل المعلم: ماذا لاحظتم على درجة الحرارة أ ل دقيقة لعشر دقائق أخرى، ويسجلون (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n7. • تحليل أولي: يسأل المعلم: ماذا لاحظتم على درجة الحرارة أثناء الانصهار؟ والطلبة يلاحظون بقاءها عند 0°C تقريبًا حتى ينصهر الثلج كله، ثم ترتفع (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • الغلق: يلخص المعلم: درجة انصهار الثلج 0°C، والطلبة يكتبون المعلومة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: التمثيل الخطي للانصهار وأسئلة الدرس — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقترحون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • ورقة العمل 3-8أ: يقدم المعلم ورقة العمل 3-8أ (ارسم تمثيلًا بيانيًا خطيًا يوضح الانصهار) ص83، والطلبة يرسمون التمثيل الخطي لقراءاتهم ويحددون الجزء الثابت عند 0°C (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • أسئلة ص59: يناقش المعلم الأسئلة (1–4)، والطلبة يجيبون عن النمط ونوع التمثيل ودرجة الانصهار وطرق تسريعه والتنبؤ بعد عشرين دقيقة، وأن 0°C هي درجة تجمد الماء أيضًا (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • الملح والثلج: يوضح المعلم أن الملح يخفض درجة انصهار الثلج فينصهر في درجات حرارة أقل من 0°C، والطلبة يربطون ذلك بتنظيف الطرق في البلاد الباردة (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "الحصة 1: مفهوم الانصهار ودرجة الانصهار\n1. (مستوى المعرفة) ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى الحالة السائلة.\n2. (مستوى التطبيق) ما درجة الانصهار؟\n   الإجابة النموذجية: درجة الحرارة التي تنصهر عندها المادة الصلبة.\n3. (مستوى الاستدلال) لماذا اختير التنجستن لصنع فتيل المصباح؟\n   الإجابة النموذجية: لأن درجة انصهاره عالية جدًا (3380°C) فلا ينصهر بحرارة المصباح.\n\n4. (مستوى المعرفة) كل كم دقيقة قسنا درجة حرارة الثلج؟\n   الإجابة النموذجية: كل دقيقة.\n5. (مستوى التطبيق) عند أي درجة انصهر الثلج؟\n   الإجابة النموذجية: 0°C.\n6. (مستوى الاستدلال) ماذا حدث لدرجة الحرارة بعد انصهار الثلج كله؟\n   الإجابة النموذجية: بدأت ترتفع تدريجيًا.\n\nالحصة 2: التمثيل الخطي للانصهار وأسئلة الدرس\n1. (مستوى المعرفة) ما النمط الذي تراه في نتائجك؟\n   الإجابة النموذجية: تبقى درجة function render(){
  const l=D[li]; document.body.className='u'+l.unit;
  $('#state').textContent = mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة (اختر الحصة ثم انسخ بنودها بندًا بندًا).' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله يضم حصصه ('+cnt(l.periods.length)+') داخل كل بند.';
  const tabs=$('#tabs'); tabs.innerHTML='';
  $('#tabsWrap').style.display = mode==='sep'?'block':'none';
  l.periods.forEach((p,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===pi);b.textContent='الحصة '+p.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});
  const p=l.periods[pi];
  $('#info').innerHTML='<h2>الدرس '+l.code+': '+l.title+'</h2>'+
    (mode==='sep'?'<div class="tp">الحصة '+p.n+' من '+l.periods.length+' — محور الحصة: '+p.topic+'</div>':'<div class="tp">نموذج مدمج للدرس: '+l.periods.map(x=>'الحصة '+x.n+': '+x.topic).join(' | ')+'</div>')+
    '<div class="grid"><div><b>الوحدة</b>'+UN[l.unit]+'</div><div><b>الأسبوع والتاريخ</b>'+l.dates+'</div><div><b>كتاب الطالب</b>ص '+l.sb+'</div><div><b>كتاب النشاط</b>'+l.ab+'</div><div><b>دليل المعلم</b>ص '+l.tb+'</div></div>';
  const fields = mode==='sep'? p.f : l.combined;
  const box=$('#cards'); box.innerHTML='';
  NAMES.forEach((nm,k)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="ch"><span class="num">'+(k+1)+'</span><span class="cn">'+nm+'</span><button class="copy" type="button">نسخ</button></div><div class="cb"></div><div class="hint">لم يسمح المتصفح بالنسخ التلقائي؛ تم تحديد النص — اضغط نسخ من قائمة المتصفح أو Ctrl+C.</div>';
    c.querySelector('.cb').textContent=fields[k];
    c.querySelector('.copy').onclick=e=>copyText(fields[k],e.currentTarget,c);
    box.appendChild(c);});
}
function flash(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
function fallback(text){
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
  document.body.removeChild(ta);return ok;}
function selectCard(card){const r=document.createRange();r.selectNodeContents(card.querySelector('.cb'));const s=getSelection();s.removeAllRanges();s.addRange(r);card.querySelector('.hint').classList.add('on');}
function copyText(text,btn,card){
  card.querySelector('.hint').classList.remove('on');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>flash(btn)).catch(()=>{fallback(text)?flash(btn):selectCard(card);});
  } else { fallback(text)?flash(btn):selectCard(card); }
}
$('#mSep').onclick=()=>setMode('sep');$('#mCom').onclick=()=>setMode('com');
buildSelect(); render();
</script><script src="/assets/qlink.js" defer></script>
