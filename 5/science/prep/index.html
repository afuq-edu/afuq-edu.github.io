لإخصاب): تحليل\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالمخرج 1 (يحاكي عملية التلقيح بالحشرات بنموذج بسيط): تطبيق\nالمخرج 2 (يجيب عن أسئلة الدرس ويوضح كيف يساعد التلقيح في تكاثر النبات): فهم\nالمخرج الآخر (يوضح كيف تنتقل حبوب اللقاح من الميسم إلى المبيض (التحدي)): تحليل", "الحصة 1: مفهوم التلقيح\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي\n\nالحصة 2: التلقيح بواسطة الحشرات\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم بالنمذجة", "الحصة 1: مفهوم التلقيح\nالكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة أو مقطع لتلقيح النخيل، نموذج زهرة\n\nالحصة 2: التلقيح بواسطة الحشرات\nالكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: أزهار زاهية، عدسة مكبرة\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nالكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: أزهار عشبية وأزهار زاهية من فناء المدرسة، عدسات مكبرة، ورق\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nالكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية، أخرى: صور مراحل تكون ثمرة الطماطم\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: أزهار ورقية، مسحوق طباشير ملون يمثل حبوب اللقاح، أعواد قطنية", "الحصة 1: مفهوم التلقيح\nالتلقيح، حبوب اللقاح، السداة، الميسم.\n\nالحصة 2: التلقيح بواسطة الحشرات\nالرحيق، التلقيح، الحشرات، حبوب اللقاح.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nالتلقيح بالرياح، حبوب اللقاح.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nالإخصاب، المبيض، البويضات، الثمرة، البذور.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالتلقيح، الإخصاب، حبوب اللقاح، الرحيق.", "الحصة 1: مفهوم التلقيح\nيسأل المعلم: «هل شاهدت مزارعًا يصعد النخلة في موسم معين ويضع فيها شيئًا؟ ماذا يفعل؟»، ثم يعرض مقطعًا قصيرًا لعملية «التنبيت» (تلقيح النخيل) في عُمان.\n\nالحصة 2: التلقيح بواسطة الحشرات\nيتلو المعلم قوله تعالى: «وأوحى ربك إلى النحل…» (سورة النحل 68–69) كما في ص36، ويسأل: «من أين يجمع النحل غذاءه؟ وماذا يحمل على جسمه دون أن يقصد؟».\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nيعرض المعلم صورة الزهرة العشبية ص36 والرياح تنثر منها سحابة من حبوب اللقاح، ويسأل: «هذه الزهرة ليست ملونة ولا رائحة لها، فكيف تُلقّح؟».\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nيعرض المعلم الصور الثلاث لنبات الطماطم ص37 (زهرة ← ثمرة صغيرة ← ثمرة ناضجة) ويسأل: «بعد التلقيح، ماذا يحدث داخل الزهرة حتى تظهر هذه الثمرة؟».\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nيوزع المعلم «أزهارًا ورقية» في وسط بعضها مسحوق طباشير ملون، ويخبر الطلاب أنهم سيكونون «نحلًا» يبحث عن الرحيق.", "الحصة 1: مفهوم التلقيح\n• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال ويعرض المقطع.\n  الطالب: يصفون ما يفعله المزارع.\n• تعريف التلقيح (10 دقائق):\n  المعلم: يقرأ مع الطلاب ص36 ويوضح: التلقيح نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n  الطالب: يكتبون التعريف ويحددون على نموذج الزهرة مسار حبوب اللقاح.\n• نمذجة المسار (10 دقائق):\n  المعلم: يرسم زهرتين على السبورة ويرسم سهمًا من متك الأولى إلى ميسم الثانية.\n  الطالب: يرسمون المخطط ويسمّون الجزء المرسل والجزء المستقبل.\n• الربط بالنخيل (9 دقائق):\n  المعلم: يوضح أن المزارع ينقل حبوب اللقاح من النخلة الذكر (الفحل) إلى أزهار النخلة الأنثى.\n  الطالب: يناقشون: لماذا يحتاج المزارع لفعل ذلك؟\n• الغلق (6 دقائق):\n  المعلم: يطرح سؤال: من ينقل حبوب اللقاح في الطبيعة؟\n  الطالب: يتوقعون: الحشرات والرياح.\nالمجموع: 40 دقيقة\n\nالحصة 2: التلقيح بواسطة الحشرات\n• التهيئة (5 دقائق):\n  المعلم: يتلو الآية ويطرح السؤال.\n  الطالب: يجيبون: من الأزهار؛ يحمل حبوب اللقاح.\n• التلقيح بالحشرات (10 دقائق):\n  المعلم: يشرح ص36: تتغذى الحشرات على الرحيق (سائل حلو المذاق)، فتعلق بها حبوب اللقاح وتنقلها إلى ميسم زهرة أخرى.\n  الطالب: يرسمون مخطط تسلسل لرحلة النحلة بين زهرتين.\n• صفات الأزهار (10 دقائق):\n  المعلم: يعرض صورًا لأزهار تلقحها الحشرات.\n  الطالب: يستنتجون الصفات: بتلات زاهية الألوان، رائحة، رحيق.\n• تأمل الآية (10 دقائق):\n  المعلم: يناقش معنى الآية: النحل يأكل من الثمرات ويخرج العسل الذي فيه شفاء.\n  الطالب: يربطون بين تغذي النحل على الرحيق وإنتاج العسل وتلقيح الأزهار.\n• الغلق (5 دقائق):\n  المعلم: يسأل: لماذا تحتاج الزهرة إلى ألوان ورائحة؟\n  الطالب: يجيبون: لجذب الحشرات.\nالمجموع: 40 دقيقة\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون الرياح.\n• صفات أزهار الرياح (8 دقائق):\n  المعلم: يشرح ص36: غير زاهية، لا بتلات أو رائحة، تنتج كثيرًا من حبوب اللقاح الخفيفة.\n  الطالب: يكتبون الصفات ويقارنونها بأزهار الحشرات.\n• نشاط 2-5 (16 دقيقة):\n  المعلم: يصطحب الطلاب إلى فناء المدرسة ويوجههم وفق ص36.\n  الطالب: ينظرون إلى الأزهار المختلفة، ويرسمون صورًا لها ويسمون أجزاءها، ويحددون كيف يتم تلقيح كل زهرة ولماذا.\n• جدول مقارنة (8 دقائق):\n  المعلم: يرسم جدولًا للمقارنة.\n  الطالب: يكملون: الحشرات (زاهية، رائحة، رحيق) – الرياح (غير زاهية، بلا رائحة، حبوب لقاح كثيرة).\n• الغلق (3 دقائق):\n  المعلم: يسأل سؤالًا ختاميًا.\n  الطالب: يحددون نوع تلقيح زهرة معروضة.\nالمجموع: 40 دقيقة\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصور ويطرح السؤال.\n  الطالب: يتوقعون أن الزهرة تتحول إلى ثمرة.\n• الإخصاب (10 دقائق):\n  المعلم: يشرح ص37: تنتقل حبوب اللقاح من الميسم إلى المبيض، وتتحد مع البويضات (الإخصاب).\n  الطالب: يحددون موقع الإخصاب على رسم الزهرة.\n• من المبيض إلى الثمرة (10 دقائق):\n  المعلم: يوضح: بعد الإخصاب تموت البتلات والأسدية، وينمو المبيض ليكوّن الثمرة، وتتحول البويضات المخصبة إلى بذور.\n  الطالب: يرتبون بطاقات: تلقيح ← إخصاب ← ذبول البتلات ← نمو المبيض ← ثمرة بها بذور.\n• التلقيح والإخصاب (10 دقائق):\n  المعلم: يكتب على السبورة جدول مقارنة (أين؟ ماذا يحدث؟).\n  الطالب: يكملون المقارنة: التلقيح نقل حبوب اللقاح إلى الميسم، والإخصاب اتحادها بالبويضات داخل المبيض.\n• الغلق (5 دقائق):\n  المعلم: يسأل: أي جزء في الزهرة يصبح ثمرة؟\n  الطالب: يجيبون: المبيض.\nالمجموع: 40 دقيقة\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\n• التهيئة (4 دقائق):\n  المعلم: يشرح قواعد المحاكاة.\n  الطالب: يستعدون للعب دور النحل.\n• المحاكاة (10 دقائق):\n  المعلم: يطلب من «النحل» زيارة الأزهار بالعود القطني بالترتيب.\n  الطالب: ينقلون المسحوق من زهرة إلى أخرى ويلاحظون انتقال «حبوب اللقاح» إلى الأزهار.\n• تحليل المحاكاة (6 دقائق):\n  المعلم: يسأل: ماذا يمثل المسحوق؟ والعود القطني؟ وما حدود هذا النموذج؟\n  الطالب: يربطون عناصر النموذج بالواقع.\n• أسئلة ص37 والتحدي (10 دقائق):\n  المعلم: يناقش الأسئلة (1–4) والتحدي.\n  الطالب: يجيبون عن تلقيح الحشرات والرياح وكثرة حبوب اللقاح ودور التلقيح والفرق بينه وبين الإخصاب.\n• مسابقة المجموعات (10 دقائق):\n  المعلم: يشغّل مسابقة درس 2-5.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: مفهوم التلقيح\n1. (مستوى الدعم) ما التلقيح؟\n   الإجابة النموذجية: نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n2. (المستوى المتوقع) إلى أي جزء من الزهرة تنتقل حبوب اللقاح؟\n   الإجابة النموذجية: إلى الميسم.\n3. (المستوى المتقدم) لماذا يلقح المزارعون النخيل يدويًا؟\n   الإجابة النموذجية: لضمان وصول حبوب اللقاح من الفحل إلى أزهار النخلة الأنثى فتتكون الثمار.\n\nالحصة 2: التلقيح بواسطة الحشرات\n1. (مستوى الدعم) ما الرحيق؟\n   الإجابة النموذجية: سائل حلو المذاق تصنعه الأزهار وتتغذى عليه الحشرات.\n2. (المستوى المتوقع) اذكر صفتين لأزهار تلقحها الحشرات.\n   الإجابة النموذجية: بتلات زاهية الألوان، رائحة، رحيق (أي اثنتين).\n3. (المستوى المتقدم) كيف تنتقل حبوب اللقاح من زهرة إلى أخرى بواسطة النحلة؟\n   الإجابة النموذجية: تعلق حبوب اللقاح بجسم النحلة أثناء تغذيها على الرحيق، ثم تسقط على ميسم الزهرة التالية التي تزورها.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n1. (مستوى الدعم) اذكر صفة لزهرة تلقحها الرياح.\n   الإجابة النموذجية: غير زاهية أو بلا رائحة أو تنتج كثيرًا من حبوب اللقاح.\n2. (المستوى المتوقع) زهرة صغيرة خضراء بلا رائحة، كيف تلقح غالبًا؟\n   الإجابة النموذجية: بواسطة الرياح.\n3. (المستوى المتقدم) لماذا تنتج الأزهار التي تلقحها الرياح كثيرًا من حبوب اللقاح؟\n   الإجابة النموذجية: لأن معظم حبوب اللقاح تضيع في الهواء، فتزيد الكثرة فرصة وصول بعضها إلى ميسم زهرة من النوع نفسه.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\n1. (مستوى الدعم) أين يحدث الإخصاب؟\n   الإجابة النموذجية: داخل المبيض.\n2. (المستوى المتوقع) إلامَ تتحول البويضات المخصبة؟\n   الإجابة النموذجية: إلى بذور.\n3. (المستوى المتقدم) ما الفرق بين التلقيح والإخصاب؟\n   الإجابة النموذجية: التلقيح نقل حبوب اللقاح من السداة إلى الميسم، والإخصاب اتحاد حبوب اللقاح مع البويضات داخل المبيض.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\n1. (مستوى الدعم) ماذا يمثل المسحوق الملون في المحاكاة؟\n   الإجابة النموذجية: حبوب اللقاح.\n2. (المستوى المتوقع) لماذا تنتج الأزهار التي تلقحها الرياح كمية كبيرة من حبوب اللقاح الجافة؟\n   الإجابة النموذجية: لأن كثيرًا منها يضيع في الهواء ولا يصل إلى الميسم.\n3. (المستوى المتقدم) كيف يساعد التلقيح في تكاثر النباتات؟\n   الإجابة النموذجية: يوصل حبوب اللقاح إلى الميسم فتنتقل إلى المبيض وتخصب البويضات فتتكون البذور التي تنمو إلى نباتات جديدة.", "الحصة 1: مفهوم التلقيح\n1. (مستوى الدعم) أكمل: تنتقل حبوب اللقاح في التلقيح من …… إلى ……\n   الإجابة النموذجية: السداة (المتك)؛ ميسم زهرة من النوع نفسه.\n2. (المستوى المتوقع) هل يمكن تلقيح زهرة طماطم بحبوب لقاح من زهرة ورد؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن التلقيح يكون بين أزهار من النوع نفسه.\n3. (المستوى المتقدم) اقترح ما يحدث لمحصول التمر إذا لم يتم تلقيح النخيل.\n   الإجابة النموذجية: يقل المحصول كثيرًا أو لا تتكون الثمار جيدًا.\n\nالحصة 2: التلقيح بواسطة الحشرات\n1. (مستوى الدعم) صح أم خطأ: الأزهار التي تلقحها الحشرات تكون زاهية الألوان غالبًا.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) لماذا تزور الحشرات الأزهار؟\n   الإجابة النموذجية: لتتغذى على الرحيق.\n3. (المستوى المتقدم) ماذا يحدث للأزهار لو قلّت أعداد النحل في منطقة ما؟\n   الإجابة النموذجية: يقل تلقيح الأزهار فتقل الثمار والبذور.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n1. (مستوى الدعم) صح أم خطأ: الأزهار التي تلقحها الرياح لها رحيق كثير.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) قارن بين زهرة تلقحها الحشرات وزهرة تلقحها الرياح من حيث اللون والرائحة.\n   الإجابة النموذجية: الحشرات: زاهية الألوان ذات رائحة. الرياح: غير زاهية بلا رائحة.\n3. (المستوى المتقدم) لماذا لا تحتاج الأزهار التي تلقحها الرياح إلى بتلات زاهية؟\n   الإجابة النموذجية: لأنها لا تحتاج إلى جذب الحشرات؛ فالرياح تنقل حبوب لقاحها.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\n1. (مستوى الدعم) أكمل: بعد الإخصاب ينمو …… ليكوّن الثمرة.\n   الإجابة النموذجية: المبيض.\n2. (المستوى المتوقع) ماذا يحدث للبتلات والأسدية بعد الإخصاب؟\n   الإجابة النموذجية: تموت (تذبل وتسقط).\n3. (المستوى المتقدم) هل يمكن أن يحدث الإخصاب دون تلقيح؟ فسّر.\n   الإجابة النموذجية: لا؛ لأن حبوب اللقاح يجب أن تصل أولًا إلى الميسم بالتلقيح ثم تنتقل إلى المبيض لتخصب البويضات.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\n1. (مستوى الدعم) صح أم خطأ: التلقيح والإخصاب عملية واحدة.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) لماذا تلقح الحشرات الأزهار الملونة ذات الرحيق والرائحة؟\n   الإجابة النموذجية: لأن الألوان والرائحة تجذبها، والرحيق غذاء لها.\n3. (المستوى المتقدم) وضّح كيف تنتقل حبوب اللقاح إلى مبيض الزهرة.\n   الإجابة النموذجية: تصل حبوب اللقاح إلى الميسم بالتلقيح، ثم تنتقل عبر القلم إلى المبيض حيث تتحد مع البويضات.", "الحصة 1: مفهوم التلقيح\nللطالب: قراءة كتاب الطالب ص36، وسؤال أحد كبار العائلة عن طريقة تلقيح النخيل. لولي الأمر: التحدث مع الابن عن تلقيح النخيل وموسمه في عُمان.\n\nالحصة 2: التلقيح بواسطة الحشرات\nللطالب: حفظ الآيتين 68–69 من سورة النحل، وملاحظة حشرات تزور الأزهار في الحديقة. لولي الأمر: مناقشة الابن في فوائد النحل للإنسان والنبات.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nللطالب: إكمال رسومات نشاط 2-5 وتسمية الأجزاء. لولي الأمر: ملاحظة أزهار في الحي مع الابن وتحديد نوع تلقيحها.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nللطالب: قراءة كتاب الطالب ص37، ورسم مخطط من التلقيح إلى تكوين البذور. لولي الأمر: فتح ثمرة طماطم مع الابن وملاحظة البذور وربطها بالبويضات المخصبة.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nللطالب: حل تمرين 2-5 بكتاب النشاط ص27، ومراجعة الفرق بين التلقيح والإخصاب. لولي الأمر: مشاهدة مقطع عن النحل والتلقيح مع الابن."]}, {"code": "2-6", "title": "استقصاء التلقيح", "unit": 2, "dates": "الأسبوع الثامن (25–29/10/2026م)", "sb": "38–39", "tb": "50–51", "ab": "تمرين 2-6 ص28، ورقة العمل 2-6 ص71", "periods": [{"n": 1, "topic": "الحشرات الملقِّحة وتفضيلاتها", "f": ["1. يذكر أمثلة لحشرات تلقح الأزهار\n2. يربط بين صفات الزهرة ونوع الحشرة التي تنجذب إليها\nمخرج تعليمي آخر: يتنبأ بالحشرة التي يمكن أن تزور زهرة ما من خلال صفاتها", "المخرج 1 (يذكر أمثلة لحشرات تلقح الأزهار): تذكر\nالمخرج 2 (يربط بين صفات الزهرة ونوع الحشرة التي تنجذب إليها): تحليل\nالمخرج الآخر (يتنبأ بالحشرة التي يمكن أن تزور زهرة ما من خلال صفاتها): تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)", "الملقحات، الرحيق، حبوب اللقاح.", "يعرض المعلم الصور الثلاث ص38 (فراشة، خنفساء، نحلة على أزهار مختلفة) ويسأل: «هل تزور كل حشرة أي زهرة؟ لماذا تفضل الفراشة هذه الزهرة؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصور ويطرح السؤال.\n  الطالب: يتوقعون أسبابًا.\n• الحشرات الملقحة (10 دقائق):\n  المعلم: يقرأ مع الطلاب ص38: تهوى الفراشات الأزهار الغنية بالرحيق، ويلقح النحل والخنافس والدبابير والنمل والعث الأزهار.\n  الطالب: يكتبون قائمة بالحشرات الملقحة.\n• مطابقة زهرة وحشرة (12 دقيقة):\n  المعلم: يوزع بطاقات صفات أزهار (أنبوبية طويلة غنية بالرحيق، صفراء صغيرة كثيرة حبوب اللقاح، كبيرة بيضاء معطرة ليلًا…).\n  الطالب: يطابقون كل زهرة بالحشرة الأنسب ويبررون.\n• تحدث عن (8 دقائق):\n  المعلم: يطرح سؤال ص39: العث يلقح الأزهار ليلًا، فما أنواع الأزهار التي يلقحها؟\n  الطالب: يستنتجون: أزهار فاتحة اللون (بيضاء) قوية الرائحة تُرى في المساء.\n• الغلق (5 دقائق):\n  المعلم: يلخص: صفات الزهرة تدل على ملقّحها.\n  الطالب: يذكرون مثالًا.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) اذكر ثلاث حشرات تلقح الأزهار.\n   الإجابة النموذجية: النحل، الفراشات، الخنافس (أو الدبابير، النمل، العث).\n2. (المستوى المتوقع) لماذا تهوى الفراشات الأزهار الغنية بالرحيق؟\n   الإجابة النموذجية: لأنها تتغذى على الرحيق.\n3. (المستوى المتقدم) زهرة بيضاء كبيرة قوية الرائحة تتفتح مساءً، أي حشرة تلقحها غالبًا؟\n   الإجابة النموذجية: العث؛ لأنه ينشط ليلًا ويرى الأزهار الفاتحة ويجذبه العطر.", "1. (مستوى الدعم) صح أم خطأ: تفضل الحشرات المختلفة أنواعًا محددة من الأزهار.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الذي يجذب الحشرات إلى الأزهار؟\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق.\n3. (المستوى المتقدم) تنبأ بصفات زهرة تلقحها الخنافس.\n   الإجابة النموذجية: كبيرة الحجم، بها كثير من حبوب اللقاح والرحيق، وغالبًا فاتحة أو مخضرة اللون.", "للطالب: قراءة كتاب الطالب ص38، وملاحظة حشرات في حديقة المنزل. لولي الأمر: تنبيه الابن إلى عدم الاقتراب من النحل والدبابير أو لمسها أثناء الملاحظة."]}, {"n": 2, "topic": "نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية", "f": ["1. يخطط لاستقصاء ميداني لملاحظة الحشرات الملقحة\n2. يصمم جدولًا لتسجيل الملاحظات (اسم الزهرة، وصفها، التنبؤ، الحشرات، عدد المرات)\nمخرج تعليمي آخر: يتنبأ بكيفية تلقيح كل زهرة اعتمادًا على صفاتها", "المخرج 1 (يخطط لاستقصاء ميداني لملاحظة الحشرات الملقحة): تطبيق\nالمخرج 2 (يصمم جدولًا لتسجيل الملاحظات (اسم الزهرة، وصفها، التنبؤ، الحشرات، عدد المرات)): إبداع\nالمخرج الآخر (يتنبأ بكيفية تلقيح كل زهرة اعتمادًا على صفاتها): تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: ساعة إيقاف، لوح كتابة، صور أزهار حديقة المدرسة", "الملقحات، التنبؤ، التسجيل.", "يسأل المعلم: «لو أردنا أن نعرف أي الحشرات تزور أزهار حديقة مدرستنا أكثر، كيف نخطط لذلك بطريقة علمية؟».", "• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقترحون الملاحظة والعدّ.\n• قراءة النشاط (10 دقائق):\n  المعلم: يقرأ خطوات نشاط 2-6 ص38 ويوضح المطلوب.\n  الطالب: يحددون: أربعة أنواع أزهار، ألوان زاهية وغير زاهية، الملاحظة نصف ساعة.\n• تصميم الجدول (10 دقائق):\n  المعلم: يعرض نموذج جدول ص39.\n  الطالب: يرسمون الجدول: اسم الزهرة، وصفها، تنبأ كيف يتم تلقيحها، الحشرات التي تقف عليها، عدد المرات.\n• التنبؤ (8 دقائق):\n  المعلم: يعرض صور أزهار الحديقة.\n  الطالب: يكتبون وصف كل زهرة وتنبؤهم بطريقة تلقيحها.\n• السلامة وتوزيع الأدوار (5 دقائق):\n  المعلم: يوضح قواعد السلامة (عدم لمس الحشرات، الابتعاد عن خلايا النحل) ويوزع أدوار المراقبة والتوقيت والتسجيل.\n  الطالب: يدونون أدوارهم.\n• الغلق (دقيقتان):\n  المعلم: يحدد موعد الملاحظة الميدانية.\n  الطالب: يستعدون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الأداة التي نستخدمها لضبط زمن الملاحظة؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (المستوى المتوقع) اذكر ثلاثة أعمدة في جدول الملاحظة.\n   الإجابة النموذجية: اسم الزهرة، الحشرات التي تقف عليها، عدد المرات (أو الوصف والتنبؤ).\n3. (المستوى المتقدم) لماذا نختار أزهارًا زاهية وأخرى غير زاهية؟\n   الإجابة النموذجية: لنقارن عدد الحشرات التي تزور كل نوع ونختبر تنبؤاتنا.", "1. (مستوى الدعم) صح أم خطأ: يجب لمس النحلة لمعرفة نوعها.\n   الإجابة النموذجية: خطأ؛ نلاحظ من بعيد دون لمس.\n2. (المستوى المتوقع) ما مدة الملاحظة المقترحة في النشاط؟\n   الإجابة النموذجية: نصف ساعة.\n3. (المستوى المتقدم) تنبأ: أي الأزهار سيزورها عدد أكبر من الحشرات؟ ولماذا؟\n   الإجابة النموذجية: الأزهار الزاهية ذات الرائحة والرحيق؛ لأنها تجذب الحشرات.", "للطالب: مراجعة الجدول والتنبؤات، وارتداء ملابس مناسبة للعمل الميداني. لولي الأمر: التأكد من خلو الابن من حساسية لسع النحل وإبلاغ المعلم إن وجدت."]}, {"n": 3, "topic": "نشاط 2-6: الملاحظة الميدانية للملقحات", "f": ["1. يلاحظ الحشرات التي تقف على الأزهار ويعدّ مرات زيارتها\n2. يسجل البيانات بدقة في الجدول\nمخرج تعليمي آخر: يقارن ملاحظاته بتنبؤاته", "المخرج 1 (يلاحظ الحشرات التي تقف على الأزهار ويعدّ مرات زيارتها): تطبيق\nالمخرج 2 (يسجل البيانات بدقة في الجدول): تطبيق\nالمخرج الآخر (يقارن ملاحظاته بتنبؤاته): تقييم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، الأقلام، أخرى: حديقة المدرسة، ساعة إيقاف، لوح كتابة، جداول التسجيل", "الملقحات، الملاحظة، البيانات.", "يجمع المعلم المجموعات عند مدخل الحديقة ويذكّر بقواعد السلامة والأدوار، ويطرح سؤال الملاحظة: «أي الحشرات تزور أزهارنا؟ وكم مرة؟».", "• التهيئة (4 دقائق):\n  المعلم: يذكّر بالقواعد والأدوار.\n  الطالب: يستعدون في مواقعهم.\n• الملاحظة والعدّ (25 دقيقة):\n  المعلم: يتنقل بين المجموعات ويضبط الوقت ويساعد في تمييز الحشرات.\n  الطالب: يلاحظون الأزهار الأربع، ويسجلون الحشرات التي تقف عليها وعدد المرات.\n• تجم  نعرف أي الحشرات تزور أزهار حديقة مدرستنا أكثر، كيف نخطط لذلك بطريقة علمية؟».\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\nيجمع المعلم المجموعات عند مدخل الحديقة ويذكّر بقواعد السلامة والأدوار، ويطرح سؤال الملاحظة: «أي الحشرات تزور أزهارنا؟ وكم مرة؟».\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\nيعرض المعلم جدول بيانات إحدى المجموعات على السبورة ويسأل: «ما أسرع طريقة لنعرف بنظرة واحدة أي الأزهار زارتها الحشرات أكثر؟».\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\nيعرض المعلم صورة الطائر الطنان ص39 يمد منقاره الطويل داخل زهرة حمراء أنبوبية، ويسأل: «لماذا لا تزور الحشرات هذه الزهرة كثيرًا ويزورها الطائر؟».", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصور ويطرح السؤال.\n  الطالب: يتوقعون أسبابًا.\n• الحشرات الملقحة (10 دقائق):\n  المعلم: يقرأ مع الطلاب ص38: تهوى الفراشات الأزهار الغنية بالرحيق، ويلقح النحل والخنافس والدبابير والنمل والعث الأزهار.\n  الطالب: يكتبون قائمة بالحشرات الملقحة.\n• مطابقة زهرة وحشرة (12 دقيقة):\n  المعلم: يوزع بطاقات صفات أزهار (أنبوبية طويلة غنية بالرحيق، صفراء صغيرة كثيرة حبوب اللقاح، كبيرة بيضاء معطرة ليلًا…).\n  الطالب: يطابقون كل زهرة بالحشرة الأنسب ويبررون.\n• تحدث عن (8 دقائق):\n  المعلم: يطرح سؤال ص39: العث يلقح الأزهار ليلًا، فما أنواع الأزهار التي يلقحها؟\n  الطالب: يستنتجون: أزهار فاتحة اللون (بيضاء) قوية الرائحة تُرى في المساء.\n• الغلق (5 دقائق):\n  المعلم: يلخص: صفات الزهرة تدل على ملقّحها.\n  الطالب: يذكرون مثالًا.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية\n• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقترحون الملاحظة والعدّ.\n• قراءة النشاط (10 دقائق):\n  المعلم: يقرأ خطوات نشاط 2-6 ص38 ويوضح المطلوب.\n  الطالب: يحددون: أربعة أنواع أزهار، ألوان زاهية وغير زاهية، الملاحظة نصف ساعة.\n• تصميم الجدول (10 دقائق):\n  المعلم: يعرض نموذج جدول ص39.\n  الطالب: يرسمون الجدول: اسم الزهرة، وصفها، تنبأ كيف يتم تلقيحها، الحشرات التي تقف عليها، عدد المرات.\n• التنبؤ (8 دقائق):\n  المعلم: يعرض صور أزهار الحديقة.\n  الطالب: يكتبون وصف كل زهرة وتنبؤهم بطريقة تلقيحها.\n• السلامة وتوزيع الأدوار (5 دقائق):\n  المعلم: يوضح قواعد السلامة (عدم لمس الحشرات، الابتعاد عن خلايا النحل) ويوزع أدوار المراقبة والتوقيت والتسجيل.\n  الطالب: يدونون أدوارهم.\n• الغلق (دقيقتان):\n  المعلم: يحدد موعد الملاحظة الميدانية.\n  الطالب: يستعدون.\nالمجموع: 40 دقيقة\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\n• التهيئة (4 دقائق):\n  المعلم: يذكّر بالقواعد والأدوار.\n  الطالب: يستعدون في مواقعهم.\n• الملاحظة والعدّ (25 دقيقة):\n  المعلم: يتنقل بين المجموعات ويضبط الوقت ويساعد في تمييز الحشرات.\n  الطالب: يلاحظون الأزهار الأربع، ويسجلون الحشرات التي تقف عليها وعدد المرات.\n• تجميع البيانات (6 دقائق):\n  المعلم: يعود بالطلاب إلى الصف ويطلب مجموع كل حشرة.\n  الطالب: يجمعون الأعداد ويراجعون الجدول.\n• الغلق (5 دقائق):\n  المعلم: يسأل: هل تحققت تنبؤاتكم؟\n  الطالب: يقارنون مبدئيًا.\nالمجموع: 40 دقيقة\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n• التهيئة (4 دقائق):\n  المعلم: يعرض الجدول ويطرح السؤال.\n  الطالب: يقترحون التمثيل البياني.\n• رسم التمثيل (14 دقيقة):\n  المعلم: يراجع خطوات رسم الأعمدة.\n  الطالب: يمثلون عدد زيارات الحشرات لكل زهرة بالأعمدة.\n• أسئلة ص39 (12 دقيقة):\n  المعلم: يناقش الأسئلة (1–4).\n  الطالب: يجيبون: الأزهار الأكثر زيارة، الحشرات المترددة، صحة التنبؤات، النمط (الأزهار الزاهية ذات الرائحة أكثر زيارة) وسببه.\n• مقارنة المجموعات (7 دقائق):\n  المعلم: يطلب من المجموعات مقارنة تمثيلاتها.\n  الطالب: يكتشفون أوجه التشابه والاختلاف.\n• الغلق (3 دقائق):\n  المعلم: يلخص النمط العام.\n  الطالب: يكتبون الاستنتاج.\nالمجموع: 40 دقيقة\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n• التهيئة (4 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون أفكارًا.\n• التحدي ص39 (10 دقائق):\n  المعلم: يوجه للبحث في المصادر عن سبب تلقيح الطيور للأزهار الحمراء.\n  الطالب: يستنتجون أن الطيور ترى اللون الأحمر جيدًا، وأن الزهرة الأنبوبية العميقة يصل منقار الطائر الطويل إلى رحيقها.\n• ورقة العمل 2-6 (13 دقيقة):\n  المعلم: يقدم ورقة العمل ص71: أي ألوان الأزهار تجذب عددًا أكبر من الملقحات؟\n  الطالب: يحللون البيانات ويحددون النمط ويضعون تنبؤات.\n• تحدث عن (5 دقائق):\n  المعلم: يطرح سؤال العث والأزهار الليلية.\n  الطالب: يناقشون.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-6.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n1. (مستوى الدعم) اذكر ثلاث حشرات تلقح الأزهار.\n   الإجابة النموذجية: النحل، الفراشات، الخنافس (أو الدبابير، النمل، العث).\n2. (المستوى المتوقع) لماذا تهوى الفراشات الأزهار الغنية بالرحيق؟\n   الإجابة النموذجية: لأنها تتغذى على الرحيق.\n3. (المستوى المتقدم) زهرة بيضاء كبيرة قوية الرائحة تتفتح مساءً، أي حشرة تلقحها غالبًا؟\n   الإجابة النموذجية: العث؛ لأنه ينشط ليلًا ويرى الأزهار الفاتحة ويجذبه العطر.\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية\n1. (مستوى الدعم) ما الأداة التي نستخدمها لضبط زمن الملاحظة؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (المستوى المتوقع) اذكر ثلاثة أعمدة في جدول الملاحظة.\n   الإجابة النموذجية: اسم الزهرة، الحشرات التي تقف عليها، عدد المرات (أو الوصف والتنبؤ).\n3. (المستوى المتقدم) لماذا نختار أزهارًا زاهية وأخرى غير زاهية؟\n   الإجابة النموذجية: لنقارن عدد الحشرات التي تزور كل نوع ونختبر تنبؤاتنا.\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\n1. (مستوى الدعم) ما الحشرة التي لاحظتها أكثر من غيرها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الملاحظة.\n2. (المستوى المتوقع) كم مرة زارت الحشرات الزهرة الأكثر زيارة؟\n   الإجابة النموذجية: تقبل الإجابة من الجدول.\n3. (المستوى المتقدم) هل دعمت ملاحظاتك تنبؤك؟ وضّح.\n   الإجابة النموذجية: تقبل إجابة تقارن التنبؤ بالأعداد المسجلة.\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n1. (مستوى الدعم) ما نوع التمثيل المناسب لعرض عدد زيارات الحشرات لكل زهرة؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة.\n2. (المستوى المتوقع) ما الأزهار التي زارتها الحشرات أكثر في نتائجك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (غالبًا الزاهية ذات الرائحة).\n3. (المستوى المتقدم) اقترح سببًا للنمط الذي لاحظته.\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق تجذب الحشرات.\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n1. (مستوى الدعم) أي الكائنات تلقح معظم الأزهار الحمراء؟\n   الإجابة النموذجية: الطيور (كطائر الطنان).\n2. (المستوى المتوقع) لماذا يناسب منقار الطائر الطويل الأزهار الأنبوبية؟\n   الإجابة النموذجية: لأنه يصل إلى الرحيق في عمق الزهرة.\n3. (المستوى المتقدم) تنبأ بالملقح المناسب لزهرة بيضاء معطرة تتفتح ليلًا.\n   الإجابة النموذجية: العث.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n1. (مستوى الدعم) صح أم خطأ: تفضل الحشرات المختلفة أنواعًا محددة من الأزهار.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الذي يجذب الحشرات إلى الأزهار؟\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق.\n3. (المستوى المتقدم) تنبأ بصفات زهرة تلقحها الخنافس.\n   الإجابة النموذجية: كبيرة الحجم، بها كثير من حبوب اللقاح والرحيق، وغالبًا فاتحة أو مخضرة اللون.\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية\n1. (مستوى الدعم) صح أم خطأ: يجب لمس النحلة لمعرفة نوعها.\n   الإجابة النموذجية: خطأ؛ نلاحظ من بعيد دون لمس.\n2. (المستوى المتوقع) ما مدة الملاحظة المقترحة في النشاط؟\n   الإجابة النموذجية: نصف ساعة.\n3. (المستوى المتقدم) تنبأ: أي الأزهار سيزورها عدد أكبر من الحشرات؟ ولماذا؟\n   الإجابة النموذجية: الأزهار الزاهية ذات الرائحة والرحيق؛ لأنها تجذب الحشرات.\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\n1. (مستوى الدعم) صح أم خطأ: سجلنا عدد مرات وقوف الحشرات على كل زهرة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) لماذا نلاحظ مدة زمنية محددة لكل زهرة؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة بين الأزهار صحيحة.\n3. (المستوى المتقدم) لو أعدت الملاحظة في يوم ممطر، هل تتوقع النتائج نفسها؟ لماذا؟\n   الإجابة النموذجية: لا غالبًا؛ لأن الحشرات تقل في المطر، فيجب تكرار الملاحظة في أيام مختلفة.\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n1. (مستوى الدعم) صح أم خطأ: يجب أن تكون أعمدة التمثيل متساوية العرض.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الحشرات التي تزور الأزهار باستمرار في ملاحظتك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (مثل النحل).\n3. (المستوى المتقدم) لماذا قد تختلف نتائج مجموعتين لاحظتا الأزهار نفسها؟\n   الإجابة النموذجية: لاختلاف وقت الملاحظة أو أخطاء العدّ أو الطقس؛ لذا نكرر الملاحظة.\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n1. (مستوى الدعم) صح أم خطأ: تلقح الطيور بعض الأزهار.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الذي يجذب الحشرات إلى الأزهار حسب ورقة العمل؟\n   الإجابة النموذجية: لون الزهرة ورائحتها ورحيقها.\n3. (المستوى المتقدم) لماذا تستفيد الزهرة من زيارة ملقح محدد؟\n   الإجابة النموذجية: لأن الملقح ينقل حبوب لقاحها إلى أزهار من النوع نفسه فيزيد فرصة التلقيح.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\nللطالب: قراءة كتاب الطالب ص38، وملاحظة حشرات في حديقة المنزل. لولي الأمر: تنبيه الابن إلى عدم الاقتراب من النحل والدبابير أو لمسها أثناء الملاحظة.\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية\nللطالب: مراجعة الجدول والتنبؤات، وارتداء ملابس مناسبة للعمل الميداني. لولي الأمر: التأكد من خلو الابن من حساسية لسع النحل وإبلاغ المعلم إن وجدت.\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\nللطالب: الاحتفاظ بجدول البيانات لرسم التمثيل البياني في الحصة القادمة. لولي الأمر: تشجيع الابن على تكرار الملاحظة في حديقة المنزل أو الحي.\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\nللطالب: إكمال التمثيل البياني وكتابة الاستنتاج، وحل تمرين 2-6 بكتاب النشاط ص28. لولي الأمر: متابعة إنجاز التمرين ومناقشة الاستنتاج مع الابن.\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\nللطالب: إكمال ورقة العمل 2-6 ص71، ومراجعة دروس التلقيح استعدادًا لدرس دورة حياة النبات. لولي الأمر: إحضار بذور فول أو عدس لزراعتها ومتابعة دورة حياة النبات في المنزل."]}, {"code": "2-7", "title": "دورة حياة النبات", "unit": 2, "dates": "الأسبوع التاسع (1–5/11/2026م)", "sb": "40–41", "tb": "52–53", "ab": "تمرين 2-7 ص29، ورقة المصادر 2-7 ص47", "periods": [{"n": 1, "topic": "مراحل دورة حياة النبات الزهري", "f": ["1. يسمي مراحل دورة حياة النبات الزهري: الإنبات، النمو، التلقيح والإخصاب، إنتاج البذور، انتشار البذور\n2. يصف ما يحدث في كل مرحلة من مراحل دورة الحياة\nمخرج تعليمي آخر: يفسر لماذا تُرسم دورة الحياة على شكل دائرة", "المخرج 1 (يسمي مراحل دورة حياة النبات الزهري: الإنبات، النمو، التلقيح والإخصاب، إنتاج البذور، انتشار البذور): تذكر\nالمخرج 2 (يصف ما يحدث في كل مرحلة من مراحل دورة الحياة): فهم\nالمخرج الآخر (يفسر لماذا تُرسم دورة الحياة على شكل دائرة): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية", "دورة حياة، الإنبات، التلقيح، الإخصاب، انتشار البذور.", "يسأل المعلم: «تذكّروا كل ما درسناه: البذور، الإنبات، الأزهار، التلقيح، انتشار البذور. هل يمكننا ترتيبها في قصة واحدة لحياة نبات؟».", "• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال ويكتب المفاهيم السابقة مبعثرة.\n  الطالب: يقترحون ترتيبًا أوليًا.\n• مخطط دورة الحياة (12 دقيقة):\n  المعلم: يشرح مخطط ص40: الإنبات ← النمو ← التلقيح والإخصاب (الإزهار) ← إنتاج البذور (ثمرة) ← انتشار البذور ← إنبات من جديد.\n  الطالب: يرسمون المخطط الدائري ويكتبون ما يحدث في كل مرحلة.\n• ربط المراحل بالدروس (10 دقائق):\n  المعلم: يربط كل مرحلة بالدرس الذي درسوه.\n  الطالب: يذكرون معلومة رئيسية عن كل مرحلة.\n• لماذا دائرة؟ (8 دقائق):\n  المعلم: يسأل: لماذا رسمنا الدورة على شكل دائرة؟\n  الطالب: يستنتجون أنها تتكرر باستمرار ولا تتوقف.\n• الغلق (5 دقائق):\n  المعلم: يذكر أن بعض النباتات تموت بعد إنتاج البذور وبعضها يزهر كل عام.\n  الطالب: يذكرون مثالًا متوقعًا لكل نوع.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما المرحلة الأولى في دورة حياة النبات؟\n   الإجابة النموذجية: الإنبات.\n2. (المستوى المتوقع) ماذا يحدث في مرحلة انتشار البذور؟\n   الإجابة النموذجية: تنتقل البذور بعيدًا عن النبات الأصلي.\n3. (المستوى المتقدم) لماذا نرسم دورة الحياة على شكل دائرة؟\n   الإجابة النموذجية: لأن مراحلها تتكرر باستمرار؛ فالبذور تنبت وتكوّن نباتات جديدة تنتج بذورًا وهكذا.", "1. (مستوى الدعم) رتب: انتشار البذور – الإنبات – التلقيح – النمو.\n   الإجابة النموذجية: الإنبات ← النمو ← التلقيح ← انتشار البذور.\n2. (المستوى المتوقع) ما المرحلة التي تأتي بعد التلقيح والإخصاب؟\n   الإجابة النموذجية: إنتاج البذور (تكوّن الثمرة).\n3. (المستوى المتقدم) ماذا يحدث لدورة الحياة إذا لم تنتشر البذور أبدًا؟\n   الإجابة النموذجية: تتزاحم الشتلات ولا تجد ما يكفيها فتضعف، وقد لا تكتمل الدورة جيدًا.", "للطالب: قراءة كتاب الطالب ص40، ورسم دورة حياة النبات في الدفتر. لولي الأمر: زراعة بذرة فول مع الابن ومتابعة مراحل نموها وتصويرها."]}, {"n": 2, "topic": "بطاقات دورة الحياة ودورة حياة نبات الطماطم", "f": ["1. يرتب بطاقات مراحل دورة حياة النبات ترتيبًا صحيحًا\n2. يحدد العملية التي تحدث في كل مرحلة من دورة حياة نبات الطماطم\nمخرج تعليمي آخر: يشرح لزميله ما يحدث في كل مرحلة", "المخرج 1 (يرتب بطاقات مراحل دورة حياة النبات ترتيبًا صحيحًا): تطبيق\nالمخرج 2 (يحدد العملية التي تحدث في كل مرحلة من دورة حياة نبات الطماطم): فهم\nالمخرج الآخر (يشرح لزميله ما يحدث في كل مرحلة): فهم", "التعلم المبني على اللعب، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: ورقة المصادر 2-7 (بطاقات دورة الحياة) ص47، مقص", "دورة حياة، شتلة، نبات ناضج.", "يعرض المعلم صورًا مبعثرة لمراحل نبات الطماطم (ثمرة، بذرة، شتلة، نبات ناضج مزهر) ويطلب ترتيبها بسرعة.", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصور المبعثرة.\n  الطالب: يرتبونها شفهيًا.\n• بطاقات دورة الحياة (12 دقيقة):\n  المعلم: يوزع ورقة المصادر 2-7 ص47 على الثنائيات.\n  الطالب: يقصون البطاقات ويرتبونها في دائرة ويشرح كل طالب لزميله مرحلة.\n• دورة حياة الطماطم (س1) (13 دقيقة):\n  المعلم: يعرض مخطط ص41 وجدول السؤال الأول.\n  الطالب: يكتبون مرحلة حياة الطماطم والعملية التي تحدث فيها (ثمرة ← بذرة: انتشار، بذرة ← شتلة: إنبات، شتلة ← نبات ناضج: نمو، نبات ← زهرة: تلقيح وإخصاب).\n• تقييم الأقران (7 دقائق):\n  المعلم: يطلب من الثنائيات تبادل الجداول.\n  الطالب: يتحققون من إجابات زملائهم.\n• الغلق (3 دقائق):\n  المعلم: يسأل سؤالًا ختاميًا.\n  الطالب: يذكرون مرحلتين متتاليتين.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما المرحلة التي تأتي بعد الشتلة؟\n   الإجابة النموذجية: النبات الناضج.\n2. (المستوى المتوقع) ما العملية التي تحول البذرة إلى شتلة؟\n   الإجابة النموذجية: الإنبات.\n3. (المستوى المتقدم) اشرح ما يحدث بين مرحلتي الزهرة والثمرة.\n   الإجابة النموذجية: تُلقّح الزهرة وتُخصب البويضات، فينمو المبيض ليكوّن ثمرة بداخلها بذور.", "1. (مستوى الدعم) صح أم خطأ: الشتلة نبات صغير نما من بذرة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما العملية التي تحدث عندما يتحول النبات الناضج إلى نبات مزهر يكوّن البذور؟\n   الإجابة النموذجية: التلقيح والإخصاب.\n3. (المستوى المتقدم) لماذا نحتاج إلى ترتيب دقيق لمراحل دورة الحياة؟\n   الإجابة النموذجية: لأن كل مرحلة تعتمد على ما قبلها؛ فلا ثمرة دون زهرة ملقحة، ولا نبات دون إنبات.", "للطالب: الاحتفاظ ببطاقات دورة الحياة ومراجعتها، وقراءة السؤال الثاني ص41. لولي الأمر: مراجعة ترتيب المراحل مع الابن باستخدام البطاقات."]}, {"n": 3, "topic": "دورة حياة نبات الفول والنباتات الحولية والمعمرة", "f": ["1. يرسم دورة حياة نبات الفول مرتبًا مراحلها ومسميًا كل مرحلة\n2. يميز بين نبات يموت بعد إنتاج البذور ونبات يزهر وينتج البذور كل عام\nمخرج تعليمي آخر: يعطي أمثلة لنباتات حولية وأخرى معمرة من البيئة العُمانية", "المخرج 1 (يرسم دورة حياة نبات الفول مرتبًا مراحلها ومسميًا كل مرحلة): تطبيق\nالمخرج 2 (يميز بين نبات يموت بعد إنتاج البذور ونبات يزهر وينتج البذور كل عام): فهم\nالمخرج الآخر (يعطي أمثلة لنباتات حولية وأخرى معمرة من البيئة العُمانية): تطبيق", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "دورة حياة، النباتات الحولية، النباتات المعمرة.", "يعرض المعلم صورة لنخلة وصورة لنبات فول، ويسأل: «النخلة تثمر كل عام لسنوات طويلة، فهل يفعل نبات الفول ذلك؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورتين ويطرح السؤال.\n  الطالب: يتوقعون.\n• دورة حياة الفول (س2) (12 دقيقة):\n  المعلم: يعرض المراحل المبعثرة: زهرة، شتلة، قرن فول، نبات ناضج، بذرة.\n  الطالب: يرتبونها: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول، ويرسمون الدورة ويسمون المراحل.\n• س3 وس4 (8 دقائق):\n  المعلم: يناقش: لماذا نرسم الدورة في دائرة؟ وأمثلة لنبات يموت بعد إنتاج البذور وآخر يزهر كل عام.\n  الطالب: يجيبون: الفول/الطماطم/الذرة تموت، والخوخ/البرتقال/الصبار تزهر كل عام.\n• تحدث عن (7 دقائق):\n  المعلم: يقدم مفهومي النباتات الحولية والمعمرة.\n  الطالب: يصنفون أمثلة من البيئة العُمانية (النخلة، السدر: معمرة؛ القمح، الطماطم: حولية).\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-7.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) رتب مراحل دورة حياة الفول.\n   الإجابة النموذجية: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول (به بذور).\n2. (المستوى المتوقع) اذكر نباتًا يموت بعد إنتاج البذور.\n   الإجابة النموذجية: الفول أو الطماطم أو الذرة.\n3. (المستوى المتقدم) ما الفرق بين النبات الحولي والنبات المعمر؟\n   الإجابة النموذجية: الحولي يكمل دورة حياته في موسم واحد ثم يموت، والمعمر يعيش سنوات ويزهر وينتج البذور كل عام.", "1. (مستوى الدعم) صح أم خطأ: النخلة نبات معمر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر نباتًا يزهر وينتج البذور كل عام.\n   الإجابة النموذجية: الخوخ أو البرتقال أو النخيل.\n3. (المستوى المتقدم) لماذا ترسم دورة حياة النبات في دائرة لا في خط مستقيم؟\n   الإجابة النموذجية: لأن المراحل تتكرر بلا توقف؛ فبذور النبات تبدأ دورة جديدة.", "للطالب: حل تمرين 2-7 بكتاب النشاط ص29، ومراجعة الوحدة الثانية استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة الثانية مع الابن (التلقيح، الإخصاب، الرحيق، السداة، الكربلة، انتشار البذور)."]}], "combined": ["الحصة 1: مراحل دورة حياة النبات الزهري\n1. يسمي مراحل دورة حياة النبات الزهري: الإنبات، النمو، التلقيح والإخصاب، إنتاج البذور، انتشار البذور\n2. يصف ما يحدث في كل مرحلة من مراحل دورة الحياة\nمخرج تعليمي آخر: يفسر لماذا تُرسم دورة الحياة على شكل دائرة\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\n1. يرتب بطاقات مراحل دورة حياة النبات ترتيبًا صحيحًا\n2. يحدد العملية التي تحدث في كل مرحلة من دورة حياة نبات الطماطم\nمخرج تعليمي آخر: يشرح لزميله ما يحدث في كل مرحلة\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n1. يرسم دورة حياة نبات الفول مرتبًا مراحلها ومسميًا كل مرحلة\n2. يميز بين نبات يموت بعد إنتاج البذور ونبات يزهر وينتج البذور كل عام\nمخرج تعليمي آخر: يعطي أمثلة لنباتات حولية وأخرى معمرة من البيئة العُمانية", "الحصة 1: مراحل دورة حياة النبات الزهري\nالمخرج 1 (يسمي مراحل دورة حياة النبات الزهري: الإنبات، النمو، التلقيح والإخصاب، إنتاج البذور، انتشار البذور): تذكر\nالمخرج 2 (يصف ما يحدث في كل مرحلة من مراحل دورة الحياة): فهم\nالمخرج الآخر (يفسر لماذا تُرسم دورة الحياة على شكل دائرة): تحليل\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nالمخرج 1 (يرتب بطاقات مراحل دورة حياة النبات ترتيبًا صحيحًا): تطبيق\nالمخرج 2 (يحدد العملية التي تحدث في كل مرحلة من دورة حياة نبات الطماطم): فهم\nالمخرج الآخر (يشرح لزميله ما يحدث في كل مرحلة): فهم\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nالمخرج 1 (يرسم دورة حياة نبات الفول مرتبًا مراحلها ومسميًا كل مرحلة): تطبيق\nالمخرج 2 (يميز بين نبات يموت بعد إنتاج البذور ونبات يزهر وينتج البذور كل عام): فهم\nالمخرج الآخر (يعطي أمثلة لنباتات حولية وأخرى معمرة من البيئة العُمانية): تطبيق", "الحصة 1: مراحل دورة حياة النبات الزهري\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم التشاركي\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nالتعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب", "الحصة 1: مراحل دورة حياة النبات الزهري\nالكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: ورقة المصادر 2-7 (بطاقات دورة الحياة) ص47، مقص\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nالكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: مراحل دورة حياة النبات الزهري\nدورة حياة، الإنبات، التلقيح، الإخصاب، انتشار البذور.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nدورة حياة، شتلة، نبات ناضج.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nدورة حياة، النباتات الحولية، النباتات المعمرة.", "الحصة 1: مراحل دورة حياة النبات الزهري\nيسأل المعلم: «تذكّروا كل ما درسناه: البذور، الإنبات، الأزهار، التلقيح، انتشار البذور. هل يمكننا ترتيبها في قصة واحدة لحياة نبات؟».\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nيعرض المعلم صورًا مبعثرة لمراحل نبات الطماطم (ثمرة، بذرة، شتلة، نبات ناضج مزهر) ويطلب ترتيبها بسرعة.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nيعرض المعلم صورة لنخلة وصورة لنبات فول، ويسأل: «النخلة تثمر كل عام لسنوات طويلة، فهل يفعل نبات الفول ذلك؟».", "الحصة 1: مراحل دورة حياة النبات الزهري\n• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال ويكتب المفاهيم السابقة مبعثرة.\n  الطالب: يقترحون ترتيبًا أوليًا.\n• مخطط دورة الحياة (12 دقيقة):\n  المعلم: يشرح مخطط ص40: الإنبات ← النمو ← التلقيح والإخصاب (الإزهار) ← إنتاج البذور (ثمرة) ← انتشار البذور ← إنبات من جديد.\n  الطالب: يرسمون المخطط الدائري ويكتبون ما يحدث في كل مرحلة.\n• ربط المراحل بالدروس (10 دقائق):\n  المعلم: يربط كل مرحلة بالدرس الذي درسوه.\n  الطالب: يذكرون معلومة رئيسية عن كل مرحلة.\n• لماذا دائرة؟ (8 دقائق):\n  المعلم: يسأل: لماذا رسمنا الدورة على شكل دائرة؟\n  الطالب: يستنتجون أنها تتكرر باستمرار ولا تتوقف.\n• الغلق (5 دقائق):\n  المعلم: يذكر أن بعض النباتات تموت بعد إنتاج البذور وبعضها يزهر كل عام.\n  الطالب: يذكرون مثالًا متوقعًا لكل نوع.\nالمجموع: 40 دقيقة\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصور المبعثرة.\n  الطالب: يرتبونها شفهيًا.\n• بطاقات دورة الحياة (12 دقيقة):\n  المعلم: يوزع ورقة المصادر 2-7 ص47 على الثنائيات.\n  الطالب: يقصون البطاقات ويرتبونها في دائرة ويشرح كل طالب لزميله مرحلة.\n• دورة حياة الطماطم (س1) (13 دقيقة):\n  المعلم: يعرض مخطط ص41 وجدول السؤال الأول.\n  الطالب: يكتبون مرحلة حياة الطماطم والعملية التي تحدث فيها (ثمرة ← بذرة: انتشار، بذرة ← شتلة: إنبات، شتلة ← نبات ناضج: نمو، نبات ← زهرة: تلقيح وإخصاب).\n• تقييم الأقران (7 دقائق):\n  المعلم: يطلب من الثنائيات تبادل الجداول.\n  الطالب: يتحققون من إجابات زملائهم.\n• الغلق (3 دقائق):\n  المعلم: يسأل سؤالًا ختاميًا.\n  الطالب: يذكرون مرحلتين متتاليتين.\nالمجموع: 40 دقيقة\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورتين ويطرح السؤال.\n  الطالب: يتوقعون.\n• دورة حياة الفول (س2) (12 دقيقة):\n  المعلم: يعرض المراحل المبعثرة: زهرة، شتلة، قرن فول، نبات ناضج، بذرة.\n  الطالب: يرتبونها: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول، ويرسمون الدورة ويسمون المراحل.\n• س3 وس4 (8 دقائق):\n  المعلم: يناقش: لماذا نرسم الدورة في دائرة؟ وأمثلة لنبات يموت بعد إنتاج البذور وآخر يزهر كل عام.\n  الطالب: يجيبون: الفول/الطماطم/الذرة تموت، والخوخ/البرتقال/الصبار تزهر كل عام.\n• تحدث عن (7 دقائق):\n  المعلم: يقدم مفهومي النباتات الحولية والمعمرة.\n  الطالب: يصنفون أمثلة من البيئة العُمانية (النخلة، السدر: معمرة؛ القمح، الطماطم: حولية).\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-7.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: مراحل دورة حياة النبات الزهري\n1. (مستوى الدعم) ما المرحلة الأولى في دورة حياة النبات؟\n   الإجابة النموذجية: الإنبات.\n2. (المستوى المتوقع) ماذا يحدث في مرحلة انتشار البذور؟\n   الإجابة النموذجية: تنتقل البذور بعيدًا عن النبات الأصلي.\n3. (المستوى المتقدم) لماذا نرسم دورة الحياة على شكل دائرة؟\n   الإجابة النموذجية: لأن مراحلها تتكرر باستمرار؛ فالبذور تنبت وتكوّن نباتات جديدة تنتج بذورًا وهكذا.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\n1. (مستوى الدعم) ما المرحلة التي تأتي بعد الشتلة؟\n   الإجابة النموذجية: النبات الناضج.\n2. (المستوى المتوقع) ما العملية التي تحول البذرة إلى شتلة؟\n   الإجابة النموذجية: الإنبات.\n3. (المستوى المتقدم) اشرح ما يحدث بين مرحلتي الزهرة والثمرة.\n   الإجابة النموذجية: تُلقّح الزهرة وتُخصب البويضات، فينمو المبيض ليكوّن ثمرة بداخلها بذور.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n1. (مستوى الدعم) رتب مراحل دورة حياة الفول.\n   الإجابة النموذجية: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول (به بذور).\n2. (المستوى المتوقع) اذكر نباتًا يموت بعد إنتاج البذور.\n   الإجابة النموذجية: الفول أو الطماطم أو الذرة.\n3. (المستوى المتقدم) ما الفرق بين النبات الحولي والنبات المعمر؟\n   الإجابة النموذجية: الحولي يكمل دورة حياته في موسم واحد ثم يموت، والمعمر يعيش سنوات ويزهر وينتج البذور كل عام.", "الحصة 1: مراحل دورة حياة النبات الزهري\n1. (مستوى الدعم) رتب: انتشار البذور – الإنبات – التلقيح – النمو.\n   الإجابة النموذجية: الإنبات ← النمو ← التلقيح ← انتشار البذور.\n2. (المستوى المتوقع) ما المرحلة التي تأتي بعد التلقيح والإخصاب؟\n   الإجابة النموذجية: إنتاج البذور (تكوّن الثمرة).\n3. (المستوى المتقدم) ماذا يحدث لدورة الحياة إذا لم تنتشر البذور أبدًا؟\n   الإجابة النموذجية: تتزاحم الشتلات ولا تجد ما يكفيها فتضعف، وقد لا تكتمل الدورة جيدًا.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\n1. (مستوى الدعم) صح أم خطأ: الشتلة نبات صغير نما من بذرة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما العملية التي تحدث عندما يتحول النبات الناضج إلى نبات مزهر يكوّن البذور؟\n   الإجابة النموذجية: التلقيح والإخصاب.\n3. (المستوى المتقدم) لماذا نحتاج إلى ترتيب دقيق لمراحل دورة الحياة؟\n   الإجابة النموذجية: لأن كل مرحلة تعتمد على ما قبلها؛ فلا ثمرة دون زهرة ملقحة، ولا نبات دون إنبات.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n1. (مستوى الدعم) صح أم خطأ: النخلة نبات معمر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر نباتًا يزهر وينتج البذور كل عام.\n   الإجابة النموذجية: الخوخ أو البرتقال أو النخيل.\n3. (المستوى المتقدم) لماذا ترسم دورة حياة النبات في دائرة لا في خط مستقيم؟\n   الإجابة النموذجية: لأن المراحل تتكرر بلا توقف؛ فبذور النبات تبدأ دورة جديدة.", "الحصة 1: مراحل دورة حياة النبات الزهري\nللطالب: قراءة كتاب الطالب ص40، ورسم دورة حياة النبات في الدفتر. لولي الأمر: زراعة بذرة فول مع الابن ومتابعة مراحل نموها وتصويرها.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nللطالب: الاحتفاظ ببطاقات دورة الحياة ومراجعتها، وقراءة السؤال الثاني ص41. لولي الأمر: مراجعة ترتيب المراحل مع الابن باستخدام البطاقات.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nللطالب: حل تمرين 2-7 بكتاب النشاط ص29، ومراجعة الوحدة الثانية استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة الثانية مع الابن (التلقيح، الإخصاب، الرحيق، السداة، الكربلة، انتشار البذور)."]}, {"code": "2-8", "title": "تحقق من تقدمك", "unit": 2, "dates": "الأسبوع التاسع (1–5/11/2026م)", "sb": "42–43", "tb": "54–57", "ab": "المراجعة اللغوية ص30", "periods": [{"n": 1, "topic": "مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)", "f": ["1. يشرح عملية انتشار البذور وأهميتها وطرقها\n2. يسمي أجزاء الزه بقة الوحدة (درس 2-8).\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)\n1. (مستوى الدعم) ما اسم العملية التي تنشر فيها النباتات بذورها؟\n   الإجابة النموذجية: انتشار البذور.\n2. (المستوى المتوقع) اذكر ثلاث طرق تنشر بها الحيوانات البذور.\n   الإجابة النموذجية: أكل الثمار وإخراج البذور مع الفضلات، التصاق البذور بالفراء، دفن البذور وحملها (أو أكل الثمار وترك البذرة).\n3. (المستوى المتقدم) كيف تنتشر البذرة (أ) المجنحة؟ أعطِ سببًا.\n   الإجابة النموذجية: بالرياح؛ لأن لها جناحين يساعدانها على الطفو في الهواء.\n\nالحصة 2: مراجعة: التلقيح ودورة الحياة (س3–س4) والمراجعة اللغوية\n1. (مستوى الدعم) أي الزهرتين تُلقح بالحشرات؟\n   الإجابة النموذجية: الزهرة (ب).\n2. (المستوى المتوقع) أعطِ سببين لإجابتك.\n   الإجابة النموذجية: بتلاتها زاهية الألوان، ولها رائحة.\n3. (المستوى المتقدم) لماذا تُلقح الزهرة (أ) بالرياح؟\n   الإجابة النموذجية: لأنها غير زاهية الألوان وصغيرة، وتنتج حبوب لقاح كثيرة.", "الحصة 1: مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)\n1. (مستوى الدعم) سمِّ جزأي الزهرة اللذين يكوّنان البذور.\n   الإجابة النموذجية: المبيض والبويضات.\n2. (المستوى المتوقع) ما اسم العملية التي تتكون فيها البذور؟ وأين تحدث؟\n   الإجابة النموذجية: الإخصاب؛ داخل المبيض.\n3. (المستوى المتقدم) لماذا تعد عملية انتشار البذور مهمة؟\n   الإجابة النموذجية: لكي تبتعد البذور عن النبات الأصلي فتجد مساحة وماءً وضوءًا كافية للنمو.\n\nالحصة 2: مراجعة: التلقيح ودورة الحياة (س3–س4) والمراجعة اللغوية\n1. (مستوى الدعم) صح أم خطأ: يأتي الإخصاب قبل التلقيح.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) اقترح حشرة يمكنها تلقيح الزهرة (ب).\n   الإجابة النموذجية: نحلة أو فراشة أو خنفساء.\n3. (المستوى المتقدم) رتب: انتشار البذور، الإخصاب، الإنبات، التلقيح، النمو، إنتاج البذور.\n   الإجابة النموذجية: الإنبات ← النمو ← التلقيح ← الإخصاب ← إنتاج البذور ← انتشار البذور.", "الحصة 1: مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)\nللطالب: مراجعة إجابات السؤالين 1 و2 ص42، وقراءة السؤالين 3 و4 ص43. لولي الأمر: مراجعة أجزاء الزهرة مع الابن باستخدام رسم أو زهرة حقيقية.\n\nالحصة 2: مراجعة: التلقيح ودورة الحياة (س3–س4) والمراجعة اللغوية\nللطالب: إكمال المراجعة اللغوية للوحدة الثانية بكتاب النشاط ص30. لولي الأمر: إحضار منشفة صغيرة وكوب بلاستيكي شفاف للابن لأنشطة وحدة حالات المادة."]}, {"code": "3-1", "title": "التبخر", "unit": 3, "dates": "الأسبوع العاشر (8–12/11/2026م)", "sb": "44–45", "tb": "59–61", "ab": "تمرين 3-1 ص31، ورقة العمل 3-1 ص73", "periods": [{"n": 1, "topic": "مفهوم التبخر وبخار الماء", "f": ["1. يعرّف التبخر بأنه تحول المادة من الحالة السائلة إلى الحالة الغازية\n2. يفسر حدوث التبخر باكتساب جزيئات السائل طاقة حرارية\nمخرج تعليمي آخر: يعطي أمثلة على التبخر من الحياة اليومية", "المخرج 1 (يعرّف التبخر بأنه تحول المادة من الحالة السائلة إلى الحالة الغازية): تذكر\nالمخرج 2 (يفسر حدوث التبخر باكتساب جزيئات السائل طاقة حرارية): فهم\nالمخرج الآخر (يعطي أمثلة على التبخر من الحياة اليومية): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة بركة ماء قبل الجفاف وبعده", "التبخر، بخار الماء، الطاقة، الحالة السائلة، الحالة الغازية.", "يعرض المعلم صورة الطفل والمظلة ص44 ويسأل: «لماذا تجف البركة بعد توقف المطر؟ ماذا يحدث للماء؟ هل يختفي؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون: يجف، تشربه الأرض، يصعد للهواء.\n• حالات المادة (8 دقائق):\n  المعلم: يراجع حالات المادة الثلاث (صلبة، سائلة، غازية) بأمثلة.\n  الطالب: يصنفون أمثلة معروضة.\n• مفهوم التبخر (10 دقائق):\n  المعلم: يشرح من ص44: عند تسخين السائل بشكل كافٍ يتحول إلى غاز، وبخار الماء هو الماء في الحالة الغازية. ويكتب: سائل + حرارة ← غاز.\n  الطالب: يكتبون التعريف والمعادلة اللفظية.\n• نموذج الجزيئات (9 دقائق):\n  المعلم: يعرض رسم الوعاء ص44 ويمثّل بطلاب «جزيئات» تتحرك ببطء ثم تكتسب طاقة فتتحرك أسرع وتتباعد ويغادر بعضها «سطح السائل».\n  الطالب: يمثلون حركة الجزيئات ويصفونها.\n• أمثلة يومية (5 دقائق):\n  المعلم: يطلب أمثلة على التبخر.\n  الطالب: يذكرون: جفاف الملابس، الطرق بعد المطر، الأطباق بعد الغسل.\n• الغلق (3 دقائق):\n  المعلم: يسأل: أين ذهب ماء البركة؟\n  الطالب: يجيبون: تبخر وأصبح بخار ماء في الهواء.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما التبخر؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الحالة الغازية.\n2. (المستوى المتوقع) ماذا نسمي الماء في الحالة الغازية؟\n   الإجابة النموذجية: بخار الماء.\n3. (المستوى المتقدم) لماذا تتحرك جزيئات الماء أسرع عند تسخينه؟\n   الإجابة النموذجية: لأنها تكتسب طاقة حرارية.", "1. (مستوى الدعم) أكمل: سائل + …… ← غاز.\n   الإجابة النموذجية: حرارة.\n2. (المستوى المتوقع) اذكر مثالين على التبخر من حياتك اليومية.\n   الإجابة النموذجية: جفاف الملابس المبللة، جفاف بركة الماء (أو جفاف الأطباق).\n3. (المستوى المتقدم) فسّر بلغة الجزيئات كيف يغادر الماء سطح البركة.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة حرارية فتتحرك أسرع وتتباعد حتى تنفصل عن سطح السائل وتنتقل إلى الهواء.", "للطالب: قراءة كتاب الطالب ص44، وملاحظة أمثلة على التبخر في المنزل. لولي الأمر: إحضار ورقة ملونة (أو منديل ملون) لنشاط الحصة القادمة."]}, {"n": 2, "topic": "نشاط 3-1أ: أين يذهب الماء؟", "f": ["1. ينفذ نشاطًا يلاحظ فيه تبخر الماء من سطح الورقة\n2. يفسر اختفاء البقعة المبتلة بحدوث التبخر\nمخرج تعليمي آخر: يتنبأ بالعوامل التي قد تسرّع جفاف البقعة", "المخرج 1 (ينفذ نشاطًا يلاحظ فيه تبخر الماء من سطح الورقة): تطبيق\nالمخرج 2 (يفسر اختفاء البقعة المبتلة بحدوث التبخر): فهم\nالمخرج الآخر (يتنبأ بالعوامل التي قد تسرّع جفاف البقعة): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: كؤوس زجاجية بها ماء، أوراق ملونة، طباشير", "التبخر، بخار الماء.", "يرسم المعلم بقعة ماء على السبورة بإسفنجة مبللة، ويطلب من الطلاب مراقبتها طوال الحصة، ويسأل: «ماذا سيحدث لهذه البقعة؟».", "• التهيئة (4 دقائق):\n  المعلم: يرسم البقعة ويطرح السؤال.\n  الطالب: يتنبؤون.\n• نشاط 3-1أ (14 دقيقة):\n  المعلم: يوجه المجموعات وفق ص44.\n  الطالب: يغمسون أصابعهم في الماء، ويضعونها على الورقة لتحدث بقعة مبتلة، ثم يتركونها دقائق ويلمسونها.\n• التفسير (8 دقائق):\n  المعلم: يسأل: هل البقعة مبتلة أم جافة؟ أين ذهب الماء؟\n  الطالب: يستنتجون أن الماء تبخر وانتقل إلى الهواء.\n• المقارنة (8 دقائق):\n  المعلم: يقارن بين بقعة السبورة وبقع الأوراق.\n  الطالب: يقترحون عوامل قد تسرع الجفاف: الدفء، تحريك الهواء.\n• الغلق (6 دقائق):\n  المعلم: يعرض فكرة رسم محيط بركة بالطباشير ومتابعتها.\n  الطالب: يخططون لمتابعة بركة أو بقعة ماء في الفناء.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) هل بقيت البقعة على الورقة مبتلة بعد دقائق؟\n   الإجابة النموذجية: لا، جفت.\n2. (المستوى المتوقع) أين ذهب الماء من الورقة؟\n   الإجابة النموذجية: تبخر وانتقل إلى الهواء على شكل بخار ماء.\n3. (المستوى المتقدم) تنبأ: هل تجف البقعة أسرع تحت أشعة الشمس أم في الظل؟ لماذا؟\n   الإجابة النموذجية: تحت الشمس؛ لأن الحرارة تسرع التبخر.", "1. (مستوى الدعم) صح أم خطأ: يختفي الماء من الورقة لأنه يتبخر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الحالة التي تحول إليها الماء؟\n   الإجابة النموذجية: الحالة الغازية (بخار الماء).\n3. (المستوى المتقدم) اقترح طريقة لجعل البقعة تجف أسرع، وفسّر.\n   الإجابة النموذجية: تحريك الهواء فوقها أو تدفئتها؛ لأن ذلك يسرع التبخر.", "للطالب: رسم محيط بقعة ماء بالطباشير في فناء المنزل وملاحظتها بعد ساعة. لولي الأمر: مساعدة الابن في التجربة ومناقشة النتيجة."]}, {"n": 3, "topic": "نشاط 3-1ب: مقارنة التبخر (الإعداد)", "f": ["1. يخطط لمقارنة سرعة تبخر الماء في مكان دافئ ومكان بارد\n2. يقيس حجم الماء باستخدام المخبار المدرج بدقة\nمخرج تعليمي آخر: يحدد العامل المتغير والعوامل الثابتة في الاستقصاء", "المخرج 1 (يخطط لمقارنة سرعة تبخر الماء في مكان دافئ ومكان بارد): تطبيق\nالمخرج 2 (يقيس حجم الماء باستخدام المخبار المدرج بدقة): تطبيق\nالمخرج الآخر (يحدد العامل المتغير والعوامل الثابتة في الاستقصاء): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: كأسان زجاجيتان متماثلتان، مخبار مدرج، قلم تخطيط، ماء", "التبخر، الحجم، الاختبار العادل.", "يسأل المعلم: «لماذا تنشر أمك الملابس المغسولة في الشمس لا في الغرفة المظلمة الباردة؟»، ثم يطرح سؤال الاستقصاء: هل يؤثر الدفء في سرعة التبخر؟", "• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقترحون أن الحرارة تسرع الجفاف.\n• قراءة الخطوات (7 دقائق):\n  المعلم: يقرأ نشاط 3-1ب ص45.\n  الطالب: يحددون الأدوات والخطوات.\n• قياس الحجم (8 دقائق):\n  المعلم: يوضح طريقة قراءة المخبار المدرج من مستوى النظر وقراءة أسفل التقعر (مهارات ص64).\n  الطالب: يتدربون على قراءة المخبار.\n• الإعداد (12 دقيقة):\n  المعلم: يتابع المجموعات.\n  الطالب: يضعون 100 ml في كل كأس، ويضعون علامة عند مستوى الماء، ويضعون إحدى الكأسين في مكان دافئ والأخرى في مكان بارد.\n• الاختبار العادل (5 دقائق):\n  المعلم: يسأل: ما الذي غيرناه؟ وما الذي أبقيناه ثابتًا؟\n  الطالب: يحددون: المتغير هو المكان (الدفء)، والثابت كمية الماء ونوع الكأس.\n• الغلق (3 دقائق):\n  المعلم: يحدد موعد الملاحظة بعد يومين.\n  الطالب: يكتبون تنبؤهم.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) كم مليلترًا من الماء وضعنا في كل كأس؟\n   الإجابة النموذجية: 100 ml.\n2. (المستوى المتوقع) كيف نقرأ حجم الماء في المخبار المدرج بدقة؟\n   الإجابة النموذجية: نضع المخبار على سطح مستوٍ، وننظر في مستوى سطح السائل، ونقرأ عند قاع التقعر.\n3. (المستوى المتقدم) ما العامل الذي غيرناه في هذا النشاط؟\n   الإجابة النموذجية: مكان الكأس (دافئ أو بارد).", "1. (مستوى الدعم) صح أم خطأ: استخدمنا كأسين مختلفتين في الحجم.\n   الإجابة النموذجية: خطأ؛ كأسان متماثلتان.\n2. (المستوى المتوقع) لماذا وضعنا علامة عند مستوى الماء؟\n   الإجابة النموذجية: لنقارن مستوى الماء بعد يومين ونعرف كم تبخر.\n3. (المستوى المتقدم) تنبأ: أي الكأسين سيقل فيها الماء أكثر؟ ولماذا؟\n   الإجابة النموذجية: الكأس في المكان الدافئ؛ لأن الحرارة تسرع التبخر.", "للطالب: قراءة صفحة مهارات قياس حجم السائل ص64 في كتاب الطالب. لولي الأمر: تنفيذ تجربة مشابهة بكوبين في المنزل (نافذة مشمسة / مكان بارد) ومتابعتها مع الابن."]}, {"n": 4, "topic": "نتائج نشاط 3-1ب وأسئلة الدرس", "f": ["1. يقارن مستوى الماء في الكأسين بعد يومين ويستنتج أثر الدفء في التبخر\n2. يوضح أن التسخين يزيد سرعة التبخر\nمخرج تعليمي آخر: يفسر سبب جفاف الملابس أسرع في الأيام الحارة", "المخرج 1 (يقارن مستوى الماء في الكأسين بعد يومين ويستنتج أثر الدفء في التبخر): تحليل\nالمخرج 2 (يوضح أن التسخين يزيد سرعة التبخر): فهم\nالمخرج الآخر (يفسر سبب جفاف الملابس أسرع في الأيام الحارة): تطبيق", "التعلم بالاكتشاف، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: كأسا نشاط 3-1ب، مخبار مدرج", "التبخر، الطاقة الحرارية.", "يحضر المعلم الكأسين ويطلب من طالبين وصف مستوى الماء في كل منهما مقارنة بالعلامة دون قياس، ثم يسأل: «هل تحقق تنبؤكم؟».", "• التهيئة (4 دقائق):\n  المعلم: يعرض الكأسين.\n  الطالب: يصفون الفرق.\n• القياس والمقارنة (10 دقائق):\n  المعلم: يوجه إلى وضع علامة جديدة وقياس الماء المتبقي بالمخبار.\n  الطالب: يقيسون ويسجلون ويحسبون كمية الماء المتبخرة من كل كأس.\n• الاستنتاج (8 دقائق):\n  المعلم: يناقش: لماذا تبخر ماء أكثر من الكأس الدافئة؟\n  الطالب: يستنتجون أن الحرارة تكسب الجزيئات طاقة فيسرع التبخر.\n• أسئلة ص45 (8 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن تغير المستوى والكأس الأقل ماءً وجفاف الملابس في الأيام الحارة.\n• تمرين 3-1 (10 دقائق):\n  المعلم: يقدم تمرين 3-1 بكتاب النشاط ص31.\n  الطالب: يحلون التمرين.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) في أي الكأسين قلّ الماء أكثر؟\n   الإجابة النموذجية: الكأس الموضوعة في المكان الدافئ.\n2. (المستوى المتوقع) كم مليلترًا تبخر من كأس بقي فيها 85 ml من أصل 100 ml؟\n   الإجابة النموذجية: 15 ml.\n3. (المستوى المتقدم) لماذا تبخر الماء أسرع في الكأس الدافئة؟\n   الإجابة النموذجية: لأن الحرارة تكسب جزيئات الماء طاقة فتتحرك أسرع وتنفصل عن السطح.", "1. (مستوى الدعم) صح أم خطأ: بقي مستوى الماء في الكأسين كما هو.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) لماذا تجف الملابس أسرع في الأيام الحارة؟\n   الإجابة النموذجية: لأن الحرارة تزيد سرعة تبخر الماء منها.\n3. (المستوى المتقدم) كأس فيها 100 ml بقي فيها بعد يومين 70 ml في مكان دافئ و90 ml في مكان بارد. كم الفرق في الماء المتبخر بين الكأسين؟\n   الإجابة النموذجية: المتبخر في الدافئ 30 ml، وفي البارد 10 ml، والفرق 20 ml.", "للطالب: إكمال تمرين 3-1 بكتاب النشاط ص31. لولي الأمر: إحضار عينات صغيرة من سوائل آمنة (ماء، عصير، زيت طبخ) في علب صغيرة لاستقصاء الحصة القادمة."]}, {"n": 5, "topic": "ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى", "f": ["1. يخطط لاختبار عادل لمعرفة أي السوائل أسرع تبخرًا\n2. يحدد ما سيقيسه وما سيغيره وما سيثبته\nمخرج تعليمي آخر: يقيّم ما إذا كانت الأدلة كافية للتوصل إلى استنتاج", "المخرج 1 (يخطط لاختبار عادل لمعرفة أي السوائل أسرع تبخرًا): تطبيق\nالمخرج 2 (يحدد ما سيقيسه وما سيغيره وما سيثبته): تحليل\nالمخرج الآخر (يقيّم ما إذا كانت الأدلة كافية للتوصل إلى استنتاج): تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة العمل 3-1 ص73، سوائل آمنة (ماء، عصير، زيت)، أطباق متماثلة، مخبار مدرج", "التبخر، الاختبار العادل، المتغير.", "يعرض المعلم ثلاثة أطباق متماثلة بها ماء وعصير وزيت طبخ، ويسأل: «هل تتبخر كل السوائل بالسرعة نفسها؟ كيف نعرف؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الأطباق ويطرح السؤال.\n  الطالب: يتنبؤون.\n• التخطيط بورقة العمل (12 دقيقة):\n  المعلم: يقدم ورقة العمل 3-1 ص73 ويناقش: ما الذي نغيره؟ ما الذي نقيسه؟ ما الذي نثبته؟\n  الطالب: يكتبون: نغير نوع السائل، نقيس الحجم المتبقي بعد مدة، نثبت الحجم الأولي والأطباق والمكان.\n• الإعداد (10 دقائق):\n  المعلم: يتابع المجموعات.\n  الطالب: يضعون الحجم نفسه من كل سائل في أطباق متماثلة في المكان نفسه.\n• كفاية الأدلة (5 دقائق):\n  المعلم: يسأل: هل تكفي تجربة واحدة؟ لماذا يكرر العلماء تجاربهم؟\n  الطالب: يستنتجون أهمية التكرار.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 3-1.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما العامل الذي نغيره في هذا الاستقصاء؟\n   الإجابة النموذجية: نوع السائل.\n2. (المستوى المتوقع) ما الذي يجب أن نثبته ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: الحجم الأولي للسوائل، ونوع الأطباق وحجمها، والمكان، والمدة.\n3. (المستوى المتقدم) لماذا يكرر العلماء التجربة عدة مرات؟\n   الإجابة النموذجية: للتأكد من صحة النتائج وأنهم لم يرتكبوا أخطاء في التنفيذ أو القياس.", "1. (مستوى الدعم) صح أم خطأ: نضع كميات مختلفة من السوائل في الأطباق.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) ما الأداة التي نقيس بها حجم السائل المتبقي؟\n   الإجابة النموذجية: المخبار المدرج.\n3. (المستوى المتقدم) إذا أجريت التجربة مرة واحدة وتبخر العصير أسرع، هل يمكنك تعميم النتيجة؟ وضّح.\n   الإجابة النموذجية: لا؛ يجب تكرار التجر يل\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\nالمخرج 1 (يقارن مستوى الماء في الكأسين بعد يومين ويستنتج أثر الدفء في التبخر): تحليل\nالمخرج 2 (يوضح أن التسخين يزيد سرعة التبخر): فهم\nالمخرج الآخر (يفسر سبب جفاف الملابس أسرع في الأيام الحارة): تطبيق\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nالمخرج 1 (يخطط لاختبار عادل لمعرفة أي السوائل أسرع تبخرًا): تطبيق\nالمخرج 2 (يحدد ما سيقيسه وما سيغيره وما سيثبته): تحليل\nالمخرج الآخر (يقيّم ما إذا كانت الأدلة كافية للتوصل إلى استنتاج): تقييم", "الحصة 1: مفهوم التبخر وبخار الماء\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\nالتعلم بالاكتشاف، التعلم التشاركي، التعلم الذاتي\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الحصة 1: مفهوم التبخر وبخار الماء\nالكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة بركة ماء قبل الجفاف وبعده\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\nالكتاب، السبورة الذكية، أخرى: كؤوس زجاجية بها ماء، أوراق ملونة، طباشير\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\nالكتاب، السبورة الذكية، أخرى: كأسان زجاجيتان متماثلتان، مخبار مدرج، قلم تخطيط، ماء\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\nالكتاب، السبورة الذكية، أخرى: كأسا نشاط 3-1ب، مخبار مدرج\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة العمل 3-1 ص73، سوائل آمنة (ماء، عصير، زيت)، أطباق متماثلة، مخبار مدرج", "الحصة 1: مفهوم التبخر وبخار الماء\nالتبخر، بخار الماء، الطاقة، الحالة السائلة، الحالة الغازية.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\nالتبخر، بخار الماء.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\nالتبخر، الحجم، الاختبار العادل.\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\nالتبخر، الطاقة الحرارية.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nالتبخر، الاختبار العادل، المتغير.", "الحصة 1: مفهوم التبخر وبخار الماء\nيعرض المعلم صورة الطفل والمظلة ص44 ويسأل: «لماذا تجف البركة بعد توقف المطر؟ ماذا يحدث للماء؟ هل يختفي؟».\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\nيرسم المعلم بقعة ماء على السبورة بإسفنجة مبللة، ويطلب من الطلاب مراقبتها طوال الحصة، ويسأل: «ماذا سيحدث لهذه البقعة؟».\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\nيسأل المعلم: «لماذا تنشر أمك الملابس المغسولة في الشمس لا في الغرفة المظلمة الباردة؟»، ثم يطرح سؤال الاستقصاء: هل يؤثر الدفء في سرعة التبخر؟\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\nيحضر المعلم الكأسين ويطلب من طالبين وصف مستوى الماء في كل منهما مقارنة بالعلامة دون قياس، ثم يسأل: «هل تحقق تنبؤكم؟».\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nيعرض المعلم ثلاثة أطباق متماثلة بها ماء وعصير وزيت طبخ، ويسأل: «هل تتبخر كل السوائل بالسرعة نفسها؟ كيف نعرف؟».", "الحصة 1: مفهوم التبخر وبخار الماء\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون: يجف، تشربه الأرض، يصعد للهواء.\n• حالات المادة (8 دقائق):\n  المعلم: يراجع حالات المادة الثلاث (صلبة، سائلة، غازية) بأمثلة.\n  الطالب: يصنفون أمثلة معروضة.\n• مفهوم التبخر (10 دقائق):\n  المعلم: يشرح من ص44: عند تسخين السائل بشكل كافٍ يتحول إلى غاز، وبخار الماء هو الماء في الحالة الغازية. ويكتب: سائل + حرارة ← غاز.\n  الطالب: يكتبون التعريف والمعادلة اللفظية.\n• نموذج الجزيئات (9 دقائق):\n  المعلم: يعرض رسم الوعاء ص44 ويمثّل بطلاب «جزيئات» تتحرك ببطء ثم تكتسب طاقة فتتحرك أسرع وتتباعد ويغادر بعضها «سطح السائل».\n  الطالب: يمثلون حركة الجزيئات ويصفونها.\n• أمثلة يومية (5 دقائق):\n  المعلم: يطلب أمثلة على التبخر.\n  الطالب: يذكرون: جفاف الملابس، الطرق بعد المطر، الأطباق بعد الغسل.\n• الغلق (3 دقائق):\n  المعلم: يسأل: أين ذهب ماء البركة؟\n  الطالب: يجيبون: تبخر وأصبح بخار ماء في الهواء.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\n• التهيئة (4 دقائق):\n  المعلم: يرسم البقعة ويطرح السؤال.\n  الطالب: يتنبؤون.\n• نشاط 3-1أ (14 دقيقة):\n  المعلم: يوجه المجموعات وفق ص44.\n  الطالب: يغمسون أصابعهم في الماء، ويضعونها على الورقة لتحدث بقعة مبتلة، ثم يتركونها دقائق ويلمسونها.\n• التفسير (8 دقائق):\n  المعلم: يسأل: هل البقعة مبتلة أم جافة؟ أين ذهب الماء؟\n  الطالب: يستنتجون أن الماء تبخر وانتقل إلى الهواء.\n• المقارنة (8 دقائق):\n  المعلم: يقارن بين بقعة السبورة وبقع الأوراق.\n  الطالب: يقترحون عوامل قد تسرع الجفاف: الدفء، تحريك الهواء.\n• الغلق (6 دقائق):\n  المعلم: يعرض فكرة رسم محيط بركة بالطباشير ومتابعتها.\n  الطالب: يخططون لمتابعة بركة أو بقعة ماء في الفناء.\nالمجموع: 40 دقيقة\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقترحون أن الحرارة تسرع الجفاف.\n• قراءة الخطوات (7 دقائق):\n  المعلم: يقرأ نشاط 3-1ب ص45.\n  الطالب: يحددون الأدوات والخطوات.\n• قياس الحجم (8 دقائق):\n  المعلم: يوضح طريقة قراءة المخبار المدرج من مستوى النظر وقراءة أسفل التقعر (مهارات ص64).\n  الطالب: يتدربون على قراءة المخبار.\n• الإعداد (12 دقيقة):\n  المعلم: يتابع المجموعات.\n  الطالب: يضعون 100 ml في كل كأس، ويضعون علامة عند مستوى الماء، ويضعون إحدى الكأسين في مكان دافئ والأخرى في مكان بارد.\n• الاختبار العادل (5 دقائق):\n  المعلم: يسأل: ما الذي غيرناه؟ وما الذي أبقيناه ثابتًا؟\n  الطالب: يحددون: المتغير هو المكان (الدفء)، والثابت كمية الماء ونوع الكأس.\n• الغلق (3 دقائق):\n  المعلم: يحدد موعد الملاحظة بعد يومين.\n  الطالب: يكتبون تنبؤهم.\nالمجموع: 40 دقيقة\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\n• التهيئة (4 دقائق):\n  المعلم: يعرض الكأسين.\n  الطالب: يصفون الفرق.\n• القياس والمقارنة (10 دقائق):\n  المعلم: يوجه إلى وضع علامة جديدة وقياس الماء المتبقي بالمخبار.\n  الطالب: يقيسون ويسجلون ويحسبون كمية الماء المتبخرة من كل كأس.\n• الاستنتاج (8 دقائق):\n  المعلم: يناقش: لماذا تبخر ماء أكثر من الكأس الدافئة؟\n  الطالب: يستنتجون أن الحرارة تكسب الجزيئات طاقة فيسرع التبخر.\n• أسئلة ص45 (8 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن تغير المستوى والكأس الأقل ماءً وجفاف الملابس في الأيام الحارة.\n• تمرين 3-1 (10 دقائق):\n  المعلم: يقدم تمرين 3-1 بكتاب النشاط ص31.\n  الطالب: يحلون التمرين.\nالمجموع: 40 دقيقة\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\n• التهيئة (5 دقائق):\n  المعلم: يعرض الأطباق ويطرح السؤال.\n  الطالب: يتنبؤون.\n• التخطيط بورقة العمل (12 دقيقة):\n  المعلم: يقدم ورقة العمل 3-1 ص73 ويناقش: ما الذي نغيره؟ ما الذي نقيسه؟ ما الذي نثبته؟\n  الطالب: يكتبون: نغير نوع السائل، نقيس الحجم المتبقي بعد مدة، نثبت الحجم الأولي والأطباق والمكان.\n• الإعداد (10 دقائق):\n  المعلم: يتابع المجموعات.\n  الطالب: يضعون الحجم نفسه من كل سائل في أطباق متماثلة في المكان نفسه.\n• كفاية الأدلة (5 دقائق):\n  المعلم: يسأل: هل تكفي تجربة واحدة؟ لماذا يكرر العلماء تجاربهم؟\n  الطالب: يستنتجون أهمية التكرار.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 3-1.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: مفهوم التبخر وبخار الماء\n1. (مستوى الدعم) ما التبخر؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الحالة الغازية.\n2. (المستوى المتوقع) ماذا نسمي الماء في الحالة الغازية؟\n   الإجابة النموذجية: بخار الماء.\n3. (المستوى المتقدم) لماذا تتحرك جزيئات الماء أسرع عند تسخينه؟\n   الإجابة النموذجية: لأنها تكتسب طاقة حرارية.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\n1. (مستوى الدعم) هل بقيت البقعة على الورقة مبتلة بعد دقائق؟\n   الإجابة النموذجية: لا، جفت.\n2. (المستوى المتوقع) أين ذهب الماء من الورقة؟\n   الإجابة النموذجية: تبخر وانتقل إلى الهواء على شكل بخار ماء.\n3. (المستوى المتقدم) تنبأ: هل تجف البقعة أسرع تحت أشعة الشمس أم في الظل؟ لماذا؟\n   الإجابة النموذجية: تحت الشمس؛ لأن الحرارة تسرع التبخر.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n1. (مستوى الدعم) كم مليلترًا من الماء وضعنا في كل كأس؟\n   الإجابة النموذجية: 100 ml.\n2. (المستوى المتوقع) كيف نقرأ حجم الماء في المخبار المدرج بدقة؟\n   الإجابة النموذجية: نضع المخبار على سطح مستوٍ، وننظر في مستوى سطح السائل، ونقرأ عند قاع التقعر.\n3. (المستوى المتقدم) ما العامل الذي غيرناه في هذا النشاط؟\n   الإجابة النموذجية: مكان الكأس (دافئ أو بارد).\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\n1. (مستوى الدعم) في أي الكأسين قلّ الماء أكثر؟\n   الإجابة النموذجية: الكأس الموضوعة في المكان الدافئ.\n2. (المستوى المتوقع) كم مليلترًا تبخر من كأس بقي فيها 85 ml من أصل 100 ml؟\n   الإجابة النموذجية: 15 ml.\n3. (المستوى المتقدم) لماذا تبخر الماء أسرع في الكأس الدافئة؟\n   الإجابة النموذجية: لأن الحرارة تكسب جزيئات الماء طاقة فتتحرك أسرع وتنفصل عن السطح.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\n1. (مستوى الدعم) ما العامل الذي نغيره في هذا الاستقصاء؟\n   الإجابة النموذجية: نوع السائل.\n2. (المستوى المتوقع) ما الذي يجب أن نثبته ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: الحجم الأولي للسوائل، ونوع الأطباق وحجمها، والمكان، والمدة.\n3. (المستوى المتقدم) لماذا يكرر العلماء التجربة عدة مرات؟\n   الإجابة النموذجية: للتأكد من صحة النتائج وأنهم لم يرتكبوا أخطاء في التنفيذ أو القياس.", "الحصة 1: مفهوم التبخر وبخار الماء\n1. (مستوى الدعم) أكمل: سائل + …… ← غاز.\n   الإجابة النموذجية: حرارة.\n2. (المستوى المتوقع) اذكر مثالين على التبخر من حياتك اليومية.\n   الإجابة النموذجية: جفاف الملابس المبللة، جفاف بركة الماء (أو جفاف الأطباق).\n3. (المستوى المتقدم) فسّر بلغة الجزيئات كيف يغادر الماء سطح البركة.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة حرارية فتتحرك أسرع وتتباعد حتى تنفصل عن سطح السائل وتنتقل إلى الهواء.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\n1. (مستوى الدعم) صح أم خطأ: يختفي الماء من الورقة لأنه يتبخر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الحالة التي تحول إليها الماء؟\n   الإجابة النموذجية: الحالة الغازية (بخار الماء).\n3. (المستوى المتقدم) اقترح طريقة لجعل البقعة تجف أسرع، وفسّر.\n   الإجابة النموذجية: تحريك الهواء فوقها أو تدفئتها؛ لأن ذلك يسرع التبخر.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n1. (مستوى الدعم) صح أم خطأ: استخدمنا كأسين مختلفتين في الحجم.\n   الإجابة النموذجية: خطأ؛ كأسان متماثلتان.\n2. (المستوى المتوقع) لماذا وضعنا علامة عند مستوى الماء؟\n   الإجابة النموذجية: لنقارن مستوى الماء بعد يومين ونعرف كم تبخر.\n3. (المستوى المتقدم) تنبأ: أي الكأسين سيقل فيها الماء أكثر؟ ولماذا؟\n   الإجابة النموذجية: الكأس في المكان الدافئ؛ لأن الحرارة تسرع التبخر.\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\n1. (مستوى الدعم) صح أم خطأ: بقي مستوى الماء في الكأسين كما هو.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) لماذا تجف الملابس أسرع في الأيام الحارة؟\n   الإجابة النموذجية: لأن الحرارة تزيد سرعة تبخر الماء منها.\n3. (المستوى المتقدم) كأس فيها 100 ml بقي فيها بعد يومين 70 ml في مكان دافئ و90 ml في مكان بارد. كم الفرق في الماء المتبخر بين الكأسين؟\n   الإجابة النموذجية: المتبخر في الدافئ 30 ml، وفي البارد 10 ml، والفرق 20 ml.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\n1. (مستوى الدعم) صح أم خطأ: نضع كميات مختلفة من السوائل في الأطباق.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) ما الأداة التي نقيس بها حجم السائل المتبقي؟\n   الإجابة النموذجية: المخبار المدرج.\n3. (المستوى المتقدم) إذا أجريت التجربة مرة واحدة وتبخر العصير أسرع، هل يمكنك تعميم النتيجة؟ وضّح.\n   الإجابة النموذجية: لا؛ يجب تكرار التجربة للتأكد قبل وضع الاستنتاج.", "الحصة 1: مفهوم التبخر وبخار الماء\nللطالب: قراءة كتاب الطالب ص44، وملاحظة أمثلة على التبخر في المنزل. لولي الأمر: إحضار ورقة ملونة (أو منديل ملون) لنشاط الحصة القادمة.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\nللطالب: رسم محيط بقعة ماء بالطباشير في فناء المنزل وملاحظتها بعد ساعة. لولي الأمر: مساعدة الابن في التجربة ومناقشة النتيجة.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\nللطالب: قراءة صفحة مهارات قياس حجم السائل ص64 في كتاب الطالب. لولي الأمر: تنفيذ تجربة مشابهة بكوبين في المنزل (نافذة مشمسة / مكان بارد) ومتابعتها مع الابن.\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\nللطالب: إكمال تمرين 3-1 بكتاب النشاط ص31. لولي الأمر: إحضار عينات صغيرة من سوائل آمنة (ماء، عصير، زيت طبخ) في علب صغيرة لاستقصاء الحصة القادمة.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nللطالب: متابعة أطباق السوائل يوميًا وتسجيل الحجم المتبقي في ورقة العمل 3-1 ص73. لولي الأمر: مناقشة الابن في نتائج الاستقصاء ومساعدته على كتابة الاستنتاج."]}, {"code": "3-2", "title": "لماذا يُعدّ التبخر مفيدًا؟", "unit": 3, "dates": "الأسبوع الحادي عشر (15–19/11/2026م)", "sb": "46–47", "tb": "62", "ab": "تمرين 3-2 ص32", "periods": [{"n": 1, "topic": "استخدامات التبخر ودوره في تبريد الأجسام", "f": ["1. يذكر استخدامات مفيدة للتبخر في الحياة اليومية\n2. يوضح دور التبخر في تبريد الأجسام\nمخرج تعليمي آخر: يفسر شعوره بالبرودة بعد استخدام معقم اليدين أو بعد التعرق", "المخرج 1 (يذكر استخدامات مفيدة للتبخر في الحياة اليومية): تذكر\nالمخرج 2 (يوضح دور التبخر في تبريد الأجسام): فهم\nالمخرج الآخر (يفسر شعوره بالبرودة بعد استخدام معقم اليدين أو بعد التعرق): تحليل", "التعلم بالاكتشاف، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: معقم يدين، صور تجفيف الرطب والملابس", "التبخر، التبريد، العرق.", "يضع المعلم قليلًا من معقم اليدين على أيدي بعض الطلاب ويطلب منهم فرك أيديهم، ثم يسأل: «بماذا شعرتم؟ وأين ذهب المعقم؟».", "• التهيئة (5 دقائق):\n  المعلم: ينفذ تجربة المعقم.\n  الطالب: يصفون الشعور بالبرودة وجفاف اليدين.\n• استخدامات التبخر (10 دقائق):\n  المعلم: يناقش صور ص46: تجفيف اليدين بالمجفف، تجفيف الرطب في الشمس، تجفيف الملابس.\n  الطالب: يصفون كيف يحدث التبخر في كل صورة وفائدته.\n• التبخر والتبريد (10 دقائق):\n  المعلم: يشرح ص46: يخرج العرق عند الشعور بالحرارة، وتكتسب جزيئاته طاقة من سطح الجلد فتتبخر، فيبرد الجلد.\n  الطالب: يرسمون مخططًا: عرق على الجلد ← يأخذ حرارة الجلد ← يتبخر ← الجلد يبرد.\n• أمثلة عُمانية (10 دقائق):\n  المعلم: يسأل عن طرق تقليدية في عُمان تعتمد على التبخر (تجفيف السمك والتمور، حفظ الماء في القِرَب والجِرار الفخارية لتبقى باردة).\n  الطالب: يناقشون الأمثلة ويفسرونها.\n• الغلق (5 دقائق):\n  المعلم: يسأل: لماذا يعد التبخر مفيدًا؟\n  الطالب: يذكرون فائدتين.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) اذكر استخدامين مفيدين للتبخر.\n   الإجابة النموذجية: تجفيف الملابس، تجفيف الرطب، تجفيف اليدين (أي اثنين).\n2. (المستوى المتوقع) لماذا نشعر بالبرودة بعد التعرق؟\n   الإجابة النموذجية: لأن العرق يتبخر آخذًا الطاقة الحرارية من الجلد فيبرد.\n3. (المستوى المتقدم) لماذا تبرد اليدان عند استخدام المعقم؟\n   الإجابة النموذجية: لأن المعقم يتبخر بسرعة آخذًا الحرارة من اليدين.", "1. (مستوى الدعم) صح أم خطأ: التبخر يساعد على تبريد أجسامنا.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) كيف يستخدم المزارعون التبخر لحفظ الرطب؟\n   الإجابة النموذجية: ينشرونه في الشمس فيتبخر الماء منه فيجف ويُحفظ مدة أطول.\n3. (المستوى المتقدم) لماذا يبقى الماء في الجرة الفخارية باردًا في الصيف؟\n   الإجابة النموذجية: لأن جزءًا من الماء يتسرب عبر مسام الفخار ويتبخر من سطحه الخارجي آخذًا الحرارة فيبرد الماء داخلها.", "للطالب: قراءة كتاب الطالب ص46، وتسجيل ثلاث استخدامات للتبخر يلاحظها في المنزل. لولي الأمر: الحديث مع الابن عن طرق تجفيف الأطعمة في البيت العُماني."]}, {"n": 2, "topic": "نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس", "f": ["1. ينفذ نشاطًا يقارن فيه الإحساس بالبرودة عند الزفير والنفخ والنفخ على يد مبللة\n2. يوضح أن حركة الهواء تسرع التبخر\nمخرج تعليمي آخر: يفسر سبب جفاف التربة أسرع في الأيام الحارة العاصفة", "المخرج 1 (ينفذ نشاطًا يقارن فيه الإحساس بالبرودة عند الزفير والنفخ والنفخ على يد مبللة): تطبيق\nالمخرج 2 (يوضح أن حركة الهواء تسرع التبخر): فهم\nالمخرج الآخر (يفسر سبب جفاف التربة أسرع في الأيام الحارة العاصفة): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بخاخ ماء", "التبخر، حركة الهواء، التبريد.", "يعرض المعلم صورة الملابس المنشورة ص47 ويسأل: «لماذا تجف الملابس أسرع في اليوم الذي تهب فيه الرياح؟».", "• التهيئة (4 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون إجابات.\n• نشاط 3-2 (14 دقيقة):\n  المعلم: يوجه وفق ص47.\n  الطالب: يتنفسون على ظهر اليد (زفير دافئ)، ثم ينفخون (أبرد)، ثم يرشون رذاذ الماء وينفخون برفق ثم بقوة، ويسجلون الإحساس.\n• التفسير (7 دقائق):\n  المعلم: يسأل: لماذا كان الإحساس بالبرودة أكبر مع الرذاذ والنفخ؟\n  الطالب: يستنتجون أن الماء يتبخر آخذًا الحرارة، والنفخ يسرع التبخر.\n• أسئلة ص47 (8 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يشرحون عمل مجفف الشعر، ويذكرون أطعمة مجففة (الزبيب، المشمش، التمر)، ويفسرون جفاف التربة في الأيام الحارة العاصفة.\n• مسابقة المجموعات (7 دقائق):\n  المعلم: يشغّل مسابقة درس 3-2.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الذي شعرت به عند الزفير على يدك؟\n   الإجابة النموذجية: شعور بالدفء.\n2. (المستوى المتوقع) لماذا شعرت ببرودة أكبر عند النفخ على يد مبللة؟\n   الإجابة النموذجية: لأن الماء يتبخر آخذًا الحرارة من اليد، والنفخ يسرع التبخر.\n3. (المستوى المتقدم) كيف يجفف مجفف الشعر الشعر؟\n   الإجابة النموذجية: يدفع هواءً ساخنًا متحركًا يسرّع تبخر الماء من الشعر.", "1. (مستوى الدعم) صح أم خطأ: تتبخر السوائل أسرع عندما يتحرك الهواء.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر طعامين يُعدّان باستخدام التبخر.\n   الإجابة النموذجية: الزبيب والمشمش المجفف (أو التمر، السمك المجفف).\n3. (المستوى المتقدم) لماذا تجف التربة في الحديقة أسرع في الأيام الحارة العاصفة؟\n   الإجابة النموذجية: لأن الحرارة والرياح معًا تزيدان سرعة تبخر الماء من التربة.", "للطالب: حل تمرين 3-2 بكتاب النشاط ص32. لولي الأمر: تذكير الابن بإحضار وعاءين متماثلين للاستقصاء القادم."]}], "combined": ["الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\n1. يذكر استخدامات مفيدة للتبخر في الحياة اليومية\n2. يوضح دور التبخر في تبريد الأجسام\nمخرج تعليمي آخر: يفسر شعوره بالبرودة بعد استخدام معقم اليدين أو بعد التعرق\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\n1. ينفذ نشاطًا يقارن فيه الإحساس بالبرودة عند الزفير والنفخ والنفخ على يد مبللة\n2. يوضح أن حركة الهواء تسرع التبخر\nمخرج تعليمي آخر: يفسر سبب جفاف التربة أسرع في الأيام الحارة العاصفة", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\nالمخرج 1 (يذكر استخدامات مفيدة للتبخر في الحياة اليومية): تذكر\nالمخرج 2 (يوضح دور التبخر في تبريد الأجسام): فهم\nالمخرج الآخر (يفسر شعوره بالبرودة بعد استخدام معقم اليدين أو بعد التعرق): تحليل\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\nالمخرج 1 (ينفذ نشاطًا يقارن فيه الإحساس بالبرودة عند الزفير والنفخ والنفخ على يد مبللة): تطبيق\nالمخرج 2 (يوضح أن حركة الهواء تسرع التبخر): فهم\nالمخرج الآخر (يفسر سبب جفاف التربة أسرع في الأيام الحارة العاصفة): تحليل", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\nالتعلم بالاكتشاف، التعلم التشاركي، التعلم التعاوني\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة ا
