2-2: انتشار البذور بواسطة الحيوانات والإنسان\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون أن البذور تخرج مع فضلات الطائر.\n• طرق الحيوانات (10 دقائق):\n  المعلم: يشرح من ص30–31: أكل الثمار وخروج البذور مع الفضلات، التعلق بالفراء والملابس بالأشواك، حمل النمل للبذور، دفن الفئران والسناجب للبذور.\n  الطالب: يكملون جدولًا: الحيوان – طريقة نشر البذور.\n• نشاط 2-2: البحث (15 دقيقة):\n  المعلم: يوزع المصادر (كتب، أجهزة) ويحدد مهام البحث لكل مجموعة.\n  الطالب: يبحثون ويجمعون صورًا ومعلومات عن طريقة محددة.\n• إعداد الملصق (8 دقائق):\n  المعلم: يوجه إلى تصميم ملصق منظم بالرسوم والصور.\n  الطالب: يبدؤون تصميم الملصق ويوزعون الأدوار.\n• الغلق (دقيقتان):\n  المعلم: يحدد موعد عرض الملصقات.\n  الطالب: يرتبون أعمالهم.\nالمجموع: 40 دقيقة\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\n• التهيئة (4 دقائق):\n  المعلم: يعرض الملصقات والجورب.\n  الطالب: يتوقعون أن البذور ستلتصق بالجورب.\n• المشي بالجورب (12 دقيقة):\n  المعلم: يحدد منطقة عشبية لكل مجموعة ويوجه إلى لبس الجورب فوق الحذاء والمشي خمس دقائق.\n  الطالب: يمشون في المنطقة العشبية ثم يعودون ويخلعون الجوارب.\n• العدّ والتسجيل (8 دقائق):\n  المعلم: يقدم ورقة العمل 2-2 ص63 ويساعد في تسمية البذور.\n  الطالب: يفحصون البذور بالعدسة ويعدّونها حسب أنواعها ويسجلونها.\n• أسئلة ص31 (8 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن البذور المتروكة على النبات والخوخ ويرسمون بذورًا تنتشر بالفراء.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-2.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: لماذا يجب أن تنتشر البذور؟\n1. (مستوى الدعم) ما المقصود بانتشار البذور؟\n   الإجابة النموذجية: نقل البذور بعيدًا عن النبات الأصلي الذي تكونت فيه.\n2. (المستوى المتوقع) ما وظيفتا الثمرة؟\n   الإجابة النموذجية: حماية البذور الموجودة بداخلها، والمساعدة في انتشارها.\n3. (المستوى المتقدم) لماذا لا تنمو الشتلات جيدًا إذا نبتت كلها قرب النبات الأم؟\n   الإجابة النموذجية: لأنها تتشارك الماء والضوء في حيز صغير فلا تكفيها، فلا تكون نباتات صحية.\n\nالحصة 2: نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان\n1. (مستوى الدعم) كيف تنشر الطيور بذور التوت؟\n   الإجابة النموذجية: تأكل الثمار وتخرج البذور مع فضلاتها في مكان بعيد.\n2. (المستوى المتوقع) كيف تنتقل بعض البذور على فراء الحيوانات؟\n   الإجابة النموذجية: تحتوي على أشواك أو خطافات تلتصق بالفراء أو الملابس.\n3. (المستوى المتقدم) لماذا تنبت بعض البذور التي يدفنها الفأر؟\n   الإجابة النموذجية: لأنه قد لا يعود لأكلها فتجد في التربة الظروف الملائمة للإنبات.\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\n1. (مستوى الدعم) ما الذي التصق بالجورب؟\n   الإجابة النموذجية: بذور مختلفة.\n2. (المستوى المتوقع) ما صفة البذور التي التصقت بالجورب؟\n   الإجابة النموذجية: لها أشواك أو خطافات أو سطح لزج.\n3. (المستوى المتقدم) علامَ يدل عدد البذور الكبير على جوارب المجموعة التي مشت في العشب؟\n   الإجابة النموذجية: أن كثيرًا من النباتات تنشر بذورها بالتعلق بالفراء أو الملابس.", "الحصة 1: لماذا يجب أن تنتشر البذور؟\n1. (مستوى الدعم) صح أم خطأ: تحتاج الشتلات إلى مساحة كافية لتنمو.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر شيئين تتنافس عليهما الشتلات المتزاحمة.\n   الإجابة النموذجية: الماء والضوء (والمساحة).\n3. (المستوى المتقدم) تنبأ: نبات تسقط كل بذوره تحته مباشرة، كيف سيكون نمو شتلاته؟ فسّر.\n   الإجابة النموذجية: ضعيفًا؛ لأنها تتنافس فيما بينها ومع النبات الأم على الماء والضوء والمساحة.\n\nالحصة 2: نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان\n1. (مستوى الدعم) اذكر حيوانين ينشران البذور.\n   الإجابة النموذجية: الطيور، القرود، الفئران، النمل، السناجب (أي اثنين).\n2. (المستوى المتوقع) كيف يساعد الإنسان في نشر البذور دون قصد؟\n   الإجابة النموذجية: بالتصاق البذور بملابسه أو برمي بذور الثمار التي يأكلها.\n3. (المستوى المتقدم) بذرة مغطاة بأشواك صغيرة، تنبأ بطريقة انتشارها مع التعليل.\n   الإجابة النموذجية: تنتشر بالتصاقها بفراء الحيوانات أو ملابس الإنسان لأن الأشواك تساعدها على التعلق.\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\n1. (مستوى الدعم) صح أم خطأ: يعمل الجورب في هذا النشاط عمل فراء الحيوانات.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) أيهما ينمو أفضل: بذور طماطم متروكة على النبات، أم بذور طماطم أكلها طائر؟ ولماذا؟\n   الإجابة النموذجية: بذور الطماطم التي أكلها الطائر؛ لأنها تنتشر بعيدًا وتجد مساحة وماءً وضوءًا أكثر.\n3. (المستوى المتقدم) هل يمكن للحيوانات نشر بذور الخوخ؟ وضّح.\n   الإجابة النموذجية: نعم؛ تأكل الثمرة وترمي البذرة الكبيرة بعيدًا عن الشجرة أو تحملها.", "الحصة 1: لماذا يجب أن تنتشر البذور؟\nللطالب: قراءة كتاب الطالب ص30، والبحث (مع ولي الأمر) عن مثال لحيوان ينشر البذور. لولي الأمر: مساعدة الابن في البحث في الكتب أو الشبكة عن طرق نشر الحيوانات للبذور لاستخدامها في نشاط 2-2.\n\nالحصة 2: نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان\nللطالب: إكمال الملصق مع المجموعة، وقراءة كتاب الطالب ص31. لولي الأمر: إحضار جورب قديم (فردة واحدة) لنشاط المشي بالجورب في الحصة القادمة.\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\nللطالب: حل تمرين 2-2 بكتاب النشاط ص24، وإكمال التمثيل البياني في ورقة العمل 2-2 ص63. لولي الأمر: جمع بذور متنوعة (مجففة) من المطبخ أو الحديقة مع الابن لإحضارها لدرس طرق انتشار البذور."]}, {"code": "2-3", "title": "طرق أخرى لانتشار البذور", "unit": 2, "dates": "الأسبوع الخامس (4–8/10/2026م)", "sb": "32–33", "tb": "42–44", "ab": "تمرين 2-3 ص25، ورقة المصادر 2-3 ص43، ورقة العمل 2-3 ص65", "periods": [{"n": 1, "topic": "انتشار البذور بواسطة الرياح", "f": ["1. يصف كيف تنتشر بعض البذور بواسطة الرياح\n2. يحدد صفات البذور التي تنتشر بالرياح: جافة خفيفة الوزن لها أجنحة أو شعيرات\nمخرج تعليمي آخر: يتنبأ بطريقة انتشار بذرة من خلال شكلها", "المخرج 1 (يصف كيف تنتشر بعض البذور بواسطة الرياح): فهم\nالمخرج 2 (يحدد صفات البذور التي تنتشر بالرياح: جافة خفيفة الوزن لها أجنحة أو شعيرات): تحليل\nالمخرج الآخر (يتنبأ بطريقة انتشار بذرة من خلال شكلها): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور تنتشر بالرياح أو صورها، نماذج ورقية لبذرة مجنّحة، مروحة يدوية", "انتشار البذور، الرياح، خفة الوزن.", "ينفخ المعلم (أو يعرض مقطعًا لطفلة تنفخ) بذور نبات الهندباء كما في ص32، ويسأل: «لماذا طارت هذه البذور بعيدًا بنفخة واحدة؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة أو المقطع ويطرح السؤال.\n  الطالب: يقترحون أن البذور خفيفة ولها شعيرات.\n• صور الكتاب ص32 (10 دقائق):\n  المعلم: يناقش أربعة أمثلة: الهندباء (مظلة من الشعر)، الثريا (ثمار تجف وتسقط)، الخشخاش (وعاء مسامي تهزه الرياح)، القيقب (أجنحة كالمروحة).\n  الطالب: يصفون كيف تساعد صفة كل بذرة على الانتشار بالرياح.\n• تجربة الطيران (12 دقيقة):\n  المعلم: يوزع نموذجين: كرة ورقية صغيرة ونموذج «بذرة مجنحة» بالوزن نفسه، ويسقطهما أمام المروحة.\n  الطالب: يلاحظون أن النموذج المجنح يطير أبعد ويبقى في الهواء مدة أطول.\n• استنتاج الصفات (8 دقائق):\n  المعلم: يكتب على السبورة: «البذور التي تنتشر بالرياح تكون…».\n  الطالب: يكملون: جافة، خفيفة، لها أجنحة أو شعيرات.\n• الغلق (5 دقائق):\n  المعلم: يعرض صورًا لبذور ويطلب تحديد التي تنتشر بالرياح.\n  الطالب: يحددون ويعللون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) اذكر نباتًا تنتشر بذوره بالرياح.\n   الإجابة النموذجية: الهندباء أو القيقب أو الخشخاش أو الثريا.\n2. (المستوى المتوقع) ما صفات البذور التي تنتشر بالرياح؟\n   الإجابة النموذجية: جافة خفيفة الوزن، ولها أجنحة أو شعيرات.\n3. (المستوى المتقدم) لماذا بقي النموذج المجنح في الهواء مدة أطول من الكرة الورقية؟\n   الإجابة النموذجية: لأن الأجنحة تقاوم الهواء وتجعله يدور ويسقط ببطء فتحمله الرياح بعيدًا.", "1. (مستوى الدعم) صح أم خطأ: البذور الثقيلة الرطبة تنتشر بسهولة بالرياح.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) كيف تساعد الرياح بذور الخشخاش على الانتشار؟\n   الإجابة النموذجية: تهز الرياح الثمرة فتخرج البذور من فتحات الوعاء المسامي وتنتشر بعيدًا.\n3. (المستوى المتقدم) بذرة خفيفة لها شعيرات تشبه المظلة، تنبأ بطريقة انتشارها وفسّر.\n   الإجابة النموذجية: بالرياح؛ لأن الشعيرات تجعلها تطفو في الهواء وتحملها الرياح بعيدًا.", "للطالب: قراءة كتاب الطالب ص32 (الانتشار بالرياح)، وملاحظة نباتات في البيئة تنتشر بذورها بالرياح. لولي الأمر: مشاهدة مقطع مع الابن عن انتشار البذور بالرياح ومناقشته."]}, {"n": 2, "topic": "انتشار البذور بواسطة الماء", "f": ["1. يصف كيف تنتشر بعض البذور بواسطة الماء\n2. يفسر دور الطبقة الإسفنجية في طفو بعض الثمار والبذور\nمخرج تعليمي آخر: يختبر طفو ثمار أو بذور مختلفة ويستنتج أيها يمكن أن ينتشر بالماء", "المخرج 1 (يصف كيف تنتشر بعض البذور بواسطة الماء): فهم\nالمخرج 2 (يفسر دور الطبقة الإسفنجية في طفو بعض الثمار والبذور): فهم\nالمخرج الآخر (يختبر طفو ثمار أو بذور مختلفة ويستنتج أيها يمكن أن ينتشر بالماء): تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: حوض ماء، ثمرة جوز هند أو صورتها، بذور متنوعة (فول، فلين، بذور زهرة)", "إسفنجي، الطفو، انتشار البذور.", "يضع المعلم ثمرة جوز هند (أو قطعة فلين) وحجرًا صغيرًا في حوض ماء ويسأل: «لماذا طفت الثمرة وغاص الحجر؟ وكيف يفيد ذلك النبات؟».", "• التهيئة (5 دقائق):\n  المعلم: ينفذ العرض ويطرح السؤال.\n  الطالب: يتوقعون أن الثمرة خفيفة أو فيها هواء.\n• الانتشار بالماء (9 دقائق):\n  المعلم: يشرح من ص32: الطبقة الإسفنجية في جوز الهند مملوءة بالهواء تساعده على الطفو، وأشجار المانجروف تسقط «أقلام البحر» التي تطفو حتى تصل إلى اليابسة.\n  الطالب: يعرفون مفهوم «إسفنجي» ويرسمون مقطعًا لجوز الهند.\n• اختبار الطفو (14 دقيقة):\n  المعلم: يوزع على المجموعات بذورًا وثمارًا مختلفة وحوض ماء.\n  الطالب: يتنبؤون بما يطفو، ثم يختبرون ويسجلون النتائج في جدول.\n• المناقشة (7 دقائق):\n  المعلم: يسأل: أي البذور يمكن أن تنتشر بالماء؟ ولماذا تنمو بعض الأشجار قرب الشواطئ والأودية؟\n  الطالب: يستنتجون أن البذور الطافية تنتقل مع الماء بعيدًا.\n• الغلق (5 دقائق):\n  المعلم: يربط الدرس بالسؤال (1) ص33 عن زنبق الماء.\n  الطالب: يجيبون شفهيًا.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الثمرة التي تنتشر بذرتها بالماء في الكتاب؟\n   الإجابة النموذجية: جوز الهند (وأقلام بحر المانجروف).\n2. (المستوى المتوقع) ما المقصود بالطبقة الإسفنجية؟\n   الإجابة النموذجية: طبقة بها مسام كثيرة مملوءة بالهواء تساعد على الطفو.\n3. (المستوى المتقدم) أي البذور التي اختبرتها يمكن أن تنتشر بالماء؟ لماذا؟\n   الإجابة النموذجية: البذور التي طفت؛ لأنها تستطيع أن تنتقل مع تيار الماء.", "1. (مستوى الدعم) أكمل: تحتوي ثمرة جوز الهند على طبقة …… تساعدها على الطفو.\n   الإجابة النموذجية: إسفنجية.\n2. (المستوى المتوقع) كيف يساعد غلاف البذرة الإسفنجي زنبق الماء في نشر بذوره؟\n   الإجابة النموذجية: يجعلها تطفو على سطح الماء فتنتقل بعيدًا عن النبات الأصلي.\n3. (المستوى المتقدم) لماذا تنتشر أشجار المانجروف على طول الشواطئ؟\n   الإجابة النموذجية: لأن بذورها (أقلام البحر) تطفو في الماء المالح حتى يلقيها البحر على اليابسة فتنمو هناك.", "للطالب: قراءة كتاب الطالب ص32 (الانتشار بالماء)، ورسم ثمرة جوز الهند مبينًا الطبقة الإسفنجية. لولي الأمر: تجربة طفو بذور مختلفة في وعاء ماء بالمنزل مع الابن."]}, {"n": 3, "topic": "الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟", "f": ["1. يصف كيف تنشر بعض الثمار بذورها بالانفجار أو التشقق\n2. يصنف بذورًا مختلفة حسب صفاتها وطرق انتشارها المحتملة\nمخرج تعليمي آخر: يستخدم الصفات الملاحظة للبذرة لاقتراح تفسير لطريقة انتشارها", "المخرج 1 (يصف كيف تنشر بعض الثمار بذورها بالانفجار أو التشقق): فهم\nالمخرج 2 (يصنف بذورًا مختلفة حسب صفاتها وطرق انتشارها المحتملة): تحليل\nالمخرج الآخر (يستخدم الصفات الملاحظة للبذرة لاقتراح تفسير لطريقة انتشارها): تقييم", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور متنوعة جمعها الطلاب، عدسات مكبرة، قرون فول جافة", "تنفجر، تتشقق، انتشار البذور.", "يعرض المعلم مقطعًا قصيرًا لقرون تنفجر وتقذف بذورها، ويسأل: «هل تحتاج كل النباتات إلى حيوان أو رياح أو ماء لنشر بذورها؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض المقطع ويطرح السؤال.\n  الطالب: يصفون ما شاهدوه.\n• الانفجار والتشقق (7 دقائق):\n  المعلم: يشرح من ص33: تجف قرون الفول في الطقس الحار فتنفجر وتقذف بذورها.\n  الطالب: يفحصون قرنًا جافًا ويحددون خط التشقق.\n• نشاط 2-3 (18 دقيقة):\n  المعلم: يوجه المجموعات وفق ص33.\n  الطالب: يجمعون خمسة أنواع على الأقل من البذور، ويلاحظونها بالعدسة، ويحاولون معرفة نباتاتها، ويرسمونها ويسمونها، ويصنفونها حسب طريقة انتشارها المحتملة.\n• عرض التصنيف (7 دقائق):\n  المعلم: يطلب من كل مجموعة تبرير تصنيفها.\n  الطالب: يعرضون: أشواك ← حيوانات، أجنحة ← رياح، طبقة إسفنجية ← ماء، قرون ← انفجار.\n• الغلق (3 دقائق):\n  المعلم: يسأل سؤالًا ختاميًا.\n  الطالب: يذكرون أربع طرق لانتشار البذور.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ماذا يحدث لقرون الفول في الطقس الحار الجاف؟\n   الإجابة النموذجية: تجف وتنفجر (تتشقق) فتنطلق البذور خارجها.\n2. (المستوى المتوقع) بذرة لها جناحان، كيف صنفتها؟\n   الإجابة النموذجية: ضمن البذور التي تنتشر بالرياح.\n3. (المستوى المتقدم) كيف تساعد صفة البذرة على تحديد طريقة انتشارها؟\n   الإجابة النموذجية: الصفة تدل على الطريقة: الأشواك للتعلق بالحيوانات، والأجنحة للرياح، والطبقة الإسفنجية للماء.", "1. (مستوى الدعم) صح أم خطأ: يمكن لبعض الثمار نشر بذورها بنفسها.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) لماذا يقطف المزارعون قرون الفول قبل أن يشتد الحر؟\n   الإجابة النموذجية: لأن القرون تجف وتنفجر في الحر فتتناثر البذور وتضيع.\n3. (المستوى المتقدم) اقترح تفسيرًا لطريقة انتشار بذور الريحان مع التعليل.\n   الإجابة النموذجية: تقبل الإجابات المنطقية المعللة، مثل: تسقط بذوره الصغيرة الخفيفة من الثمار الجافة وتحملها الرياح أو تلتصق برطوبة أجسام الحيوانات.", "للطالب: الاحتفاظ بالبذور المصنفة، وقراءة ورقة المصادر 2-3 (طرق انتشار البذور) ص43 بكتاب النشاط. لولي الأمر: تجهيز ورق مقوى ومقص ومشبك ورق للابن لتصميم نموذج بذرة في الحصة القادمة."]}, {"n": 4, "topic": "ورقة العمل 2-3: صمم بذرة تنشرها الرياح", "f": ["1. يصمم نموذج بذرة تنتشر بالرياح\n2. يخطط لاختبار عادل لقياس زمن سقوط النموذج ويكرر القياس\nمخرج تعليمي آخر: يقيم تصميمه ويقترح تحسينات بناءً على النتائج", "المخرج 1 (يصمم نموذج بذرة تنتشر بالرياح): إبداع\nالمخرج 2 (يخطط لاختبار عادل لقياس زمن سقوط النموذج ويكرر القياس): تطبيق\nالمخرج الآخر (يقيم تصميمه ويقترح تحسينات بناءً على النتائج): تقييم", "التعلم المبني على المشاريع، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مقوى، مقص، مشابك ورق، ساعة إيقاف، شريط متري", "الاختبار العادل، القياس المتكرر، انتشار البذور.", "يطرح المعلم تحديًا: «أنت مهندس نباتات! صمم بذرة تبقى في الهواء أطول مدة لتحملها الرياح بعيدًا»، ويعرض ورقة المصادر 2-3 ص43 للإلهام.", "• التهيئة (4 دقائق):\n  المعلم: يطرح التحدي ويعرض ورقة المصادر.\n  الطالب: يقترحون أشكالًا (أجنحة، مظلة).\n• التخطيط (8 دقائق):\n  المعلم: يقدم ورقة العمل 2-3 ص65 ويناقش: ما الذي نقيسه؟ ما الذي نثبته؟\n  الطالب: يحددون: نقيس زمن السقوط، ونثبت الارتفاع والوزن (مشبك واحد).\n• التصميم والتصنيع (12 دقيقة):\n  المعلم: يتابع المجموعات.\n  الطالب: يصنعون نموذجين مختلفين أو أكثر.\n• الاختبار والتكرار (11 دقيقة):\n  المعلم: يحدد ارتفاع الإسقاط نفسه لجميع المجموعات، ويؤكد تكرار القياس ثلاث مرات.\n  الطالب: يسقطون النماذج ويقيسون الزمن بساعة الإيقاف ثلاث مرات ويسجلون.\n• التقييم (5 دقائق):\n  المعلم: يسأل: أي تصميم بقي في الهواء أطول؟ كيف تحسنه؟\n  الطالب: يقارنون النتائج ويقترحون تحسينات.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الذي قسناه في هذا النشاط؟\n   الإجابة النموذجية: الزمن الذي يستغرقه النموذج حتى يصل إلى الأرض.\n2. (المستوى المتوقع) ما العوامل التي ثبتناها ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: ارتفاع الإسقاط، ووزن النموذج (عدد المشابك)، ومكان الإسقاط.\n3. (المستوى المتقدم) لماذا كررنا القياس ثلاث مرات؟\n   الإجابة النموذجية: لأن القياس الواحد قد يكون خاطئًا، والتكرار يعطي نتائج أكثر دقة وموثوقية.", "1. (مستوى الدعم) ما الأداة التي قسنا بها زمن السقوط؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (المستوى المتوقع) أي التصميمين أفضل: الذي سقط في 2 ثانية أم في 4 ثوانٍ؟ ولماذا؟\n   الإجابة النموذجية: الذي سقط في 4 ثوانٍ؛ لأنه بقي في الهواء مدة أطول فتحمله الرياح أبعد.\n3. (المستوى المتقدم) اقترح تعديلًا يجعل نموذجك يبقى في الهواء مدة أطول، وفسّر.\n   الإجابة النموذجية: زيادة مساحة الأجنحة أو تخفيف الوزن؛ لأن ذلك يزيد مقاومة الهواء ويبطئ السقوط.", "للطالب: إكمال ورقة العمل 2-3 ص65 وكتابة تقرير قصير عن أفضل تصميم. لولي الأمر: مشاركة الابن في تحسين نموذجه بالمنزل واختباره من ارتفاع ثابت."]}, {"n": 5, "topic": "مراجعة طرق انتشار البذور وأسئلة الدرس", "f": ["1. يقارن بين طرق انتشار البذور: الحيوانات والرياح والماء والانفجار\n2. يطبق معرفته في الإجابة عن أسئلة الدرس وتمرين كتاب النشاط\nمخرج تعليمي آخر: يقترح الطريقة التي تساعد البذور على الانتشار لأبعد مسافة ويبرر رأيه", "المخرج 1 (يقارن بين طرق انتشار البذور: الحيوانات والرياح والماء والانفجار): تحليل\nالمخرج 2 (يطبق معرفته في الإجابة عن أسئلة الدرس وتمرين كتاب النشاط): تطبيق\nالمخرج الآخر (يقترح الطريقة التي تساعد البذور على الانتشار لأبعد مسافة ويبرر رأيه): تقييم", "التعلم التعاوني، التعلم التشاركي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات صور بذور وثمار", "انتشار البذور، إسفنجي، تنفجر/تتشقق.", "ينفذ المعلم لعبة «أين أذهب؟»: يرفع صورة بذرة، وتتسابق المجموعات في رفع بطاقة طريقة انتشارها (حيوان/رياح/ماء/انفجار).", "• التهيئة (5 دقائق):\n  المعلم: ينفذ اللعبة.\n  الطالب: يرفعون البطاقات المناسبة.\n• جدول مقارنة (10 دقائق):\n  المعلم: يرسم جدولًا: الطريقة – صفات البذرة – مثال.\n  الطالب: يكملون الجدول تعاونيًا.\n• أسئلة ص33 (9 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن زنبق الماء وقرون الفول والريحان.\n• تمرين 2-3 (8 دقائق):\n  المعلم: يقدم تمرين 2-3 بكتاب النشاط ص25.\n  الطالب: يحلون التمرين فرديًا ثم يصححون مع زملائهم.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-3.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) اذكر أربع طرق لانتشار البذور.\n   الإجابة النموذجية: الحيوانات، الرياح، الماء، الانفجار (التشقق).\n2. (المستوى المتوقع) قارن بين بذرة تنتشر بالرياح وبذرة تنتشر بالماء من حيث الصفات.\n   الإجابة النموذجية: التي تنتشر بالرياح خفيفة جافة لها أجنحة أو شعيرات، والتي تنتشر بالماء لها طبقة إسفنجية تساعدها على الطفو.\n3. (المستوى المتقدم) أي طرق الانتشار تنقل البذور لأبعد مسافة في رأيك؟ برر.\n   الإجابة النموذجية: تقبل الإجابات المبررة، مثل: الماء لأنه قد يحمل البذور عبر البحار مسافات طويلة.", "1. (مستوى الدعم) صل: أشواك ← …… ، أجنحة ← …… ، طبقة إسفنجية ← ……\n   الإجابة النموذجية: حيوانات؛ رياح؛ ماء.\n2. (المستوى المتوقع) لماذا تحتاج النباتات إلى طرق مختلفة لنشر بذورها؟\n   الإجابة النموذجية: لأنها تعيش في بيئات مختلفة، وكل طريقة تناسب بيئة النبات وشكل بذوره.\n3. (المستوى المتقدم) ما الطريقة التي تساعد البذور على الانتشار لأبعد مسافة عن النبات الأصلي؟ فسّر.\n   الإجابة النموذجية: تقبل الإجابة المبررة: الرياح أو الماء أو الطيور، مع التعليل.", "للطالب: حل تمرين 2-3 بكتاب النشاط ص25 إن لم يكتمل، ومراجعة طرق انتشار البذور. لولي الأمر: إحضار زهرة كبيرة (مثل  لاقتراح تفسير لطريقة انتشارها): تقييم\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالمخرج 1 (يصمم نموذج بذرة تنتشر بالرياح): إبداع\nالمخرج 2 (يخطط لاختبار عادل لقياس زمن سقوط النموذج ويكرر القياس): تطبيق\nالمخرج الآخر (يقيم تصميمه ويقترح تحسينات بناءً على النتائج): تقييم\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nالمخرج 1 (يقارن بين طرق انتشار البذور: الحيوانات والرياح والماء والانفجار): تحليل\nالمخرج 2 (يطبق معرفته في الإجابة عن أسئلة الدرس وتمرين كتاب النشاط): تطبيق\nالمخرج الآخر (يقترح الطريقة التي تساعد البذور على الانتشار لأبعد مسافة ويبرر رأيه): تقييم", "الحصة 1: انتشار البذور بواسطة الرياح\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني\n\nالحصة 2: انتشار البذور بواسطة الماء\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nالتعلم بالاكتشاف، التعلم التعاوني، العصف الذهني\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالتعلم المبني على المشاريع، التعلم المبني على حل المشكلات، التعلم التعاوني\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nالتعلم التعاوني، التعلم التشاركي، التعلم المبني على اللعب", "الحصة 1: انتشار البذور بواسطة الرياح\nالكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور تنتشر بالرياح أو صورها، نماذج ورقية لبذرة مجنّحة، مروحة يدوية\n\nالحصة 2: انتشار البذور بواسطة الماء\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: حوض ماء، ثمرة جوز هند أو صورتها، بذور متنوعة (فول، فلين، بذور زهرة)\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nالكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور متنوعة جمعها الطلاب، عدسات مكبرة، قرون فول جافة\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالكتاب، السبورة الذكية، الأقلام، أخرى: ورق مقوى، مقص، مشابك ورق، ساعة إيقاف، شريط متري\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات صور بذور وثمار", "الحصة 1: انتشار البذور بواسطة الرياح\nانتشار البذور، الرياح، خفة الوزن.\n\nالحصة 2: انتشار البذور بواسطة الماء\nإسفنجي، الطفو، انتشار البذور.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nتنفجر، تتشقق، انتشار البذور.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالاختبار العادل، القياس المتكرر، انتشار البذور.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nانتشار البذور، إسفنجي، تنفجر/تتشقق.", "الحصة 1: انتشار البذور بواسطة الرياح\nينفخ المعلم (أو يعرض مقطعًا لطفلة تنفخ) بذور نبات الهندباء كما في ص32، ويسأل: «لماذا طارت هذه البذور بعيدًا بنفخة واحدة؟».\n\nالحصة 2: انتشار البذور بواسطة الماء\nيضع المعلم ثمرة جوز هند (أو قطعة فلين) وحجرًا صغيرًا في حوض ماء ويسأل: «لماذا طفت الثمرة وغاص الحجر؟ وكيف يفيد ذلك النبات؟».\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nيعرض المعلم مقطعًا قصيرًا لقرون تنفجر وتقذف بذورها، ويسأل: «هل تحتاج كل النباتات إلى حيوان أو رياح أو ماء لنشر بذورها؟».\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nيطرح المعلم تحديًا: «أنت مهندس نباتات! صمم بذرة تبقى في الهواء أطول مدة لتحملها الرياح بعيدًا»، ويعرض ورقة المصادر 2-3 ص43 للإلهام.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nينفذ المعلم لعبة «أين أذهب؟»: يرفع صورة بذرة، وتتسابق المجموعات في رفع بطاقة طريقة انتشارها (حيوان/رياح/ماء/انفجار).", "الحصة 1: انتشار البذور بواسطة الرياح\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة أو المقطع ويطرح السؤال.\n  الطالب: يقترحون أن البذور خفيفة ولها شعيرات.\n• صور الكتاب ص32 (10 دقائق):\n  المعلم: يناقش أربعة أمثلة: الهندباء (مظلة من الشعر)، الثريا (ثمار تجف وتسقط)، الخشخاش (وعاء مسامي تهزه الرياح)، القيقب (أجنحة كالمروحة).\n  الطالب: يصفون كيف تساعد صفة كل بذرة على الانتشار بالرياح.\n• تجربة الطيران (12 دقيقة):\n  المعلم: يوزع نموذجين: كرة ورقية صغيرة ونموذج «بذرة مجنحة» بالوزن نفسه، ويسقطهما أمام المروحة.\n  الطالب: يلاحظون أن النموذج المجنح يطير أبعد ويبقى في الهواء مدة أطول.\n• استنتاج الصفات (8 دقائق):\n  المعلم: يكتب على السبورة: «البذور التي تنتشر بالرياح تكون…».\n  الطالب: يكملون: جافة، خفيفة، لها أجنحة أو شعيرات.\n• الغلق (5 دقائق):\n  المعلم: يعرض صورًا لبذور ويطلب تحديد التي تنتشر بالرياح.\n  الطالب: يحددون ويعللون.\nالمجموع: 40 دقيقة\n\nالحصة 2: انتشار البذور بواسطة الماء\n• التهيئة (5 دقائق):\n  المعلم: ينفذ العرض ويطرح السؤال.\n  الطالب: يتوقعون أن الثمرة خفيفة أو فيها هواء.\n• الانتشار بالماء (9 دقائق):\n  المعلم: يشرح من ص32: الطبقة الإسفنجية في جوز الهند مملوءة بالهواء تساعده على الطفو، وأشجار المانجروف تسقط «أقلام البحر» التي تطفو حتى تصل إلى اليابسة.\n  الطالب: يعرفون مفهوم «إسفنجي» ويرسمون مقطعًا لجوز الهند.\n• اختبار الطفو (14 دقيقة):\n  المعلم: يوزع على المجموعات بذورًا وثمارًا مختلفة وحوض ماء.\n  الطالب: يتنبؤون بما يطفو، ثم يختبرون ويسجلون النتائج في جدول.\n• المناقشة (7 دقائق):\n  المعلم: يسأل: أي البذور يمكن أن تنتشر بالماء؟ ولماذا تنمو بعض الأشجار قرب الشواطئ والأودية؟\n  الطالب: يستنتجون أن البذور الطافية تنتقل مع الماء بعيدًا.\n• الغلق (5 دقائق):\n  المعلم: يربط الدرس بالسؤال (1) ص33 عن زنبق الماء.\n  الطالب: يجيبون شفهيًا.\nالمجموع: 40 دقيقة\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\n• التهيئة (5 دقائق):\n  المعلم: يعرض المقطع ويطرح السؤال.\n  الطالب: يصفون ما شاهدوه.\n• الانفجار والتشقق (7 دقائق):\n  المعلم: يشرح من ص33: تجف قرون الفول في الطقس الحار فتنفجر وتقذف بذورها.\n  الطالب: يفحصون قرنًا جافًا ويحددون خط التشقق.\n• نشاط 2-3 (18 دقيقة):\n  المعلم: يوجه المجموعات وفق ص33.\n  الطالب: يجمعون خمسة أنواع على الأقل من البذور، ويلاحظونها بالعدسة، ويحاولون معرفة نباتاتها، ويرسمونها ويسمونها، ويصنفونها حسب طريقة انتشارها المحتملة.\n• عرض التصنيف (7 دقائق):\n  المعلم: يطلب من كل مجموعة تبرير تصنيفها.\n  الطالب: يعرضون: أشواك ← حيوانات، أجنحة ← رياح، طبقة إسفنجية ← ماء، قرون ← انفجار.\n• الغلق (3 دقائق):\n  المعلم: يسأل سؤالًا ختاميًا.\n  الطالب: يذكرون أربع طرق لانتشار البذور.\nالمجموع: 40 دقيقة\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\n• التهيئة (4 دقائق):\n  المعلم: يطرح التحدي ويعرض ورقة المصادر.\n  الطالب: يقترحون أشكالًا (أجنحة، مظلة).\n• التخطيط (8 دقائق):\n  المعلم: يقدم ورقة العمل 2-3 ص65 ويناقش: ما الذي نقيسه؟ ما الذي نثبته؟\n  الطالب: يحددون: نقيس زمن السقوط، ونثبت الارتفاع والوزن (مشبك واحد).\n• التصميم والتصنيع (12 دقيقة):\n  المعلم: يتابع المجموعات.\n  الطالب: يصنعون نموذجين مختلفين أو أكثر.\n• الاختبار والتكرار (11 دقيقة):\n  المعلم: يحدد ارتفاع الإسقاط نفسه لجميع المجموعات، ويؤكد تكرار القياس ثلاث مرات.\n  الطالب: يسقطون النماذج ويقيسون الزمن بساعة الإيقاف ثلاث مرات ويسجلون.\n• التقييم (5 دقائق):\n  المعلم: يسأل: أي تصميم بقي في الهواء أطول؟ كيف تحسنه؟\n  الطالب: يقارنون النتائج ويقترحون تحسينات.\nالمجموع: 40 دقيقة\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\n• التهيئة (5 دقائق):\n  المعلم: ينفذ اللعبة.\n  الطالب: يرفعون البطاقات المناسبة.\n• جدول مقارنة (10 دقائق):\n  المعلم: يرسم جدولًا: الطريقة – صفات البذرة – مثال.\n  الطالب: يكملون الجدول تعاونيًا.\n• أسئلة ص33 (9 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن زنبق الماء وقرون الفول والريحان.\n• تمرين 2-3 (8 دقائق):\n  المعلم: يقدم تمرين 2-3 بكتاب النشاط ص25.\n  الطالب: يحلون التمرين فرديًا ثم يصححون مع زملائهم.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-3.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: انتشار البذور بواسطة الرياح\n1. (مستوى الدعم) اذكر نباتًا تنتشر بذوره بالرياح.\n   الإجابة النموذجية: الهندباء أو القيقب أو الخشخاش أو الثريا.\n2. (المستوى المتوقع) ما صفات البذور التي تنتشر بالرياح؟\n   الإجابة النموذجية: جافة خفيفة الوزن، ولها أجنحة أو شعيرات.\n3. (المستوى المتقدم) لماذا بقي النموذج المجنح في الهواء مدة أطول من الكرة الورقية؟\n   الإجابة النموذجية: لأن الأجنحة تقاوم الهواء وتجعله يدور ويسقط ببطء فتحمله الرياح بعيدًا.\n\nالحصة 2: انتشار البذور بواسطة الماء\n1. (مستوى الدعم) ما الثمرة التي تنتشر بذرتها بالماء في الكتاب؟\n   الإجابة النموذجية: جوز الهند (وأقلام بحر المانجروف).\n2. (المستوى المتوقع) ما المقصود بالطبقة الإسفنجية؟\n   الإجابة النموذجية: طبقة بها مسام كثيرة مملوءة بالهواء تساعد على الطفو.\n3. (المستوى المتقدم) أي البذور التي اختبرتها يمكن أن تنتشر بالماء؟ لماذا؟\n   الإجابة النموذجية: البذور التي طفت؛ لأنها تستطيع أن تنتقل مع تيار الماء.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\n1. (مستوى الدعم) ماذا يحدث لقرون الفول في الطقس الحار الجاف؟\n   الإجابة النموذجية: تجف وتنفجر (تتشقق) فتنطلق البذور خارجها.\n2. (المستوى المتوقع) بذرة لها جناحان، كيف صنفتها؟\n   الإجابة النموذجية: ضمن البذور التي تنتشر بالرياح.\n3. (المستوى المتقدم) كيف تساعد صفة البذرة على تحديد طريقة انتشارها؟\n   الإجابة النموذجية: الصفة تدل على الطريقة: الأشواك للتعلق بالحيوانات، والأجنحة للرياح، والطبقة الإسفنجية للماء.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\n1. (مستوى الدعم) ما الذي قسناه في هذا النشاط؟\n   الإجابة النموذجية: الزمن الذي يستغرقه النموذج حتى يصل إلى الأرض.\n2. (المستوى المتوقع) ما العوامل التي ثبتناها ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: ارتفاع الإسقاط، ووزن النموذج (عدد المشابك)، ومكان الإسقاط.\n3. (المستوى المتقدم) لماذا كررنا القياس ثلاث مرات؟\n   الإجابة النموذجية: لأن القياس الواحد قد يكون خاطئًا، والتكرار يعطي نتائج أكثر دقة وموثوقية.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\n1. (مستوى الدعم) اذكر أربع طرق لانتشار البذور.\n   الإجابة النموذجية: الحيوانات، الرياح، الماء، الانفجار (التشقق).\n2. (المستوى المتوقع) قارن بين بذرة تنتشر بالرياح وبذرة تنتشر بالماء من حيث الصفات.\n   الإجابة النموذجية: التي تنتشر بالرياح خفيفة جافة لها أجنحة أو شعيرات، والتي تنتشر بالماء لها طبقة إسفنجية تساعدها على الطفو.\n3. (المستوى المتقدم) أي طرق الانتشار تنقل البذور لأبعد مسافة في رأيك؟ برر.\n   الإجابة النموذجية: تقبل الإجابات المبررة، مثل: الماء لأنه قد يحمل البذور عبر البحار مسافات طويلة.", "الحصة 1: انتشار البذور بواسطة الرياح\n1. (مستوى الدعم) صح أم خطأ: البذور الثقيلة الرطبة تنتشر بسهولة بالرياح.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) كيف تساعد الرياح بذور الخشخاش على الانتشار؟\n   الإجابة النموذجية: تهز الرياح الثمرة فتخرج البذور من فتحات الوعاء المسامي وتنتشر بعيدًا.\n3. (المستوى المتقدم) بذرة خفيفة لها شعيرات تشبه المظلة، تنبأ بطريقة انتشارها وفسّر.\n   الإجابة النموذجية: بالرياح؛ لأن الشعيرات تجعلها تطفو في الهواء وتحملها الرياح بعيدًا.\n\nالحصة 2: انتشار البذور بواسطة الماء\n1. (مستوى الدعم) أكمل: تحتوي ثمرة جوز الهند على طبقة …… تساعدها على الطفو.\n   الإجابة النموذجية: إسفنجية.\n2. (المستوى المتوقع) كيف يساعد غلاف البذرة الإسفنجي زنبق الماء في نشر بذوره؟\n   الإجابة النموذجية: يجعلها تطفو على سطح الماء فتنتقل بعيدًا عن النبات الأصلي.\n3. (المستوى المتقدم) لماذا تنتشر أشجار المانجروف على طول الشواطئ؟\n   الإجابة النموذجية: لأن بذورها (أقلام البحر) تطفو في الماء المالح حتى يلقيها البحر على اليابسة فتنمو هناك.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\n1. (مستوى الدعم) صح أم خطأ: يمكن لبعض الثمار نشر بذورها بنفسها.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) لماذا يقطف المزارعون قرون الفول قبل أن يشتد الحر؟\n   الإجابة النموذجية: لأن القرون تجف وتنفجر في الحر فتتناثر البذور وتضيع.\n3. (المستوى المتقدم) اقترح تفسيرًا لطريقة انتشار بذور الريحان مع التعليل.\n   الإجابة النموذجية: تقبل الإجابات المنطقية المعللة، مثل: تسقط بذوره الصغيرة الخفيفة من الثمار الجافة وتحملها الرياح أو تلتصق برطوبة أجسام الحيوانات.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\n1. (مستوى الدعم) ما الأداة التي قسنا بها زمن السقوط؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (المستوى المتوقع) أي التصميمين أفضل: الذي سقط في 2 ثانية أم في 4 ثوانٍ؟ ولماذا؟\n   الإجابة النموذجية: الذي سقط في 4 ثوانٍ؛ لأنه بقي في الهواء مدة أطول فتحمله الرياح أبعد.\n3. (المستوى المتقدم) اقترح تعديلًا يجعل نموذجك يبقى في الهواء مدة أطول، وفسّر.\n   الإجابة النموذجية: زيادة مساحة الأجنحة أو تخفيف الوزن؛ لأن ذلك يزيد مقاومة الهواء ويبطئ السقوط.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\n1. (مستوى الدعم) صل: أشواك ← …… ، أجنحة ← …… ، طبقة إسفنجية ← ……\n   الإجابة النموذجية: حيوانات؛ رياح؛ ماء.\n2. (المستوى المتوقع) لماذا تحتاج النباتات إلى طرق مختلفة لنشر بذورها؟\n   الإجابة النموذجية: لأنها تعيش في بيئات مختلفة، وكل طريقة تناسب بيئة النبات وشكل بذوره.\n3. (المستوى المتقدم) ما الطريقة التي تساعد البذور على الانتشار لأبعد مسافة عن النبات الأصلي؟ فسّر.\n   الإجابة النموذجية: تقبل الإجابة المبررة: الرياح أو الماء أو الطيور، مع التعليل.", "الحصة 1: انتشار البذور بواسطة الرياح\nللطالب: قراءة كتاب الطالب ص32 (الانتشار بالرياح)، وملاحظة نباتات في البيئة تنتشر بذورها بالرياح. لولي الأمر: مشاهدة مقطع مع الابن عن انتشار البذور بالرياح ومناقشته.\n\nالحصة 2: انتشار البذور بواسطة الماء\nللطالب: قراءة كتاب الطالب ص32 (الانتشار بالماء)، ورسم ثمرة جوز الهند مبينًا الطبقة الإسفنجية. لولي الأمر: تجربة طفو بذور مختلفة في وعاء ماء بالمنزل مع الابن.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nللطالب: الاحتفاظ بالبذور المصنفة، وقراءة ورقة المصادر 2-3 (طرق انتشار البذور) ص43 بكتاب النشاط. لولي الأمر: تجهيز ورق مقوى ومقص ومشبك ورق للابن لتصميم نموذج بذرة في الحصة القادمة.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nللطالب: إكمال ورقة العمل 2-3 ص65 وكتابة تقرير قصير عن أفضل تصميم. لولي الأمر: مشاركة الابن في تحسين نموذجه بالمنزل واختباره من ارتفاع ثابت.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nللطالب: حل تمرين 2-3 بكتاب النشاط ص25 إن لم يكتمل، ومراجعة طرق انتشار البذور. لولي الأمر: إحضار زهرة كبيرة (مثل الكركديه أو الزنبق) مع الابن لدرس أجزاء الزهرة، مع التأكد من أنها ليست سامة."]}, {"code": "2-4", "title": "أجزاء الزهرة", "unit": 2, "dates": "الأسبوع السادس (11–15/10/2026م)", "sb": "34–35", "tb": "45–47", "ab": "تمرين 2-4 ص26، ورقة المصادر 2-4 ص45، ورقتا العمل 2-4أ ص67 و2-4ب ص69", "periods": [{"n": 1, "topic": "نشاط 2-4أ: استقصاء أجزاء الزهرة", "f": ["1. يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها\n2. يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها\nمخرج تعليمي آخر: يميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة", "المخرج 1 (يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها): فهم\nالمخرج 2 (يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها): تطبيق\nالمخرج الآخر (يميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: أزهار حقيقية كبيرة (كالكركديه أو الرمان)، عدسات مكبرة", "البتلات، السبلات، الأسدية، الأجزاء الذكرية، الأجزاء الأنثوية.", "ينفذ المعلم عصفًا ذهنيًا سريعًا: يعرض زهرة كبيرة ويطلب من الطلاب تسمية أكبر عدد من أجزائها التي يعرفونها، ويكتبها على السبورة.", "• التهيئة (5 دقائق):\n  المعلم: يعرض الزهرة وينفذ العصف الذهني.\n  الطالب: يسمون ما يعرفونه من أجزاء.\n• تعليمات الأمان (5 دقائق):\n  المعلم: ينبّه إلى عدم قطف الأزهار دون إذن وتجنب النباتات الضارة كالدفلة، وغسل اليدين بعد العمل.\n  الطالب: يستمعون ويلتزمون.\n• نشاط 2-4أ (18 دقيقة):\n  المعلم: يوزع الأزهار والعدسات ويوجه وفق خطوات ص34.\n  الطالب: يحددون اللون، ويعدّون الأجزاء الملونة (البتلات) والخضراء (السبلات)، ويلاحظون الأجزاء الداخلية، ويعدّون السيقان الرفيعة (الأسدية) ويلمسون حوافها، ويلاحظون الساق الوسطى (الكربلة).\n• المشاركة (8 دقائق):\n  المعلم: يطلب من كل مجموعة عرض أعدادها.\n  الطالب: يقارنون الأعداد بين أنواع الأزهار.\n• الغلق (4 دقائق):\n  المعلم: يسأل: ماذا لاحظتم على أصابعكم بعد لمس الحواف الصفراء؟\n  الطالب: يذكرون مسحوقًا أصفر (حبوب اللقاح).\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما لون السبلات غالبًا؟\n   الإجابة النموذجية: أخضر.\n2. (المستوى المتوقع) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الزهرة (مع العدّ الصحيح).\n3. (المستوى المتقدم) ما المسحوق الأصفر الذي ظهر على أصابعك بعد لمس حواف السيقان الرفيعة؟ ومن أي جزء أتى؟\n   الإجابة النموذجية: حبوب اللقاح، من المتك (رأس السداة) وهو جزء ذكري.", "1. (مستوى الدعم) صح أم خطأ: البتلات هي الأجزاء الملونة في الزهرة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر جزأين لاحظتهما داخل الزهرة.\n   الإجابة النموذجية: الأسدية (السيقان الرفيعة) والكربلة (الساق الوسطى).\n3. (المستوى المتقدم) لماذا تكون الساق الوسطى في الزهرة مختلفة عن الأسدية؟\n   الإجابة النموذجية: لأنها الجزء الأنثوي (الكربلة)، بينما الأسدية أجزاء ذكرية.", "للطالب: قراءة كتاب الطالب ص34، ورسم الزهرة التي فحصها. لولي الأمر: مساعدة الابن في ملاحظة زهرة في المنزل وعدّ بتلاتها وسبلاتها."]}, {"n": 2, "topic": "أجزاء الزهرة ووظائفها", "f": ["1. يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)\n2. يوضح وظيفة كل جزء من أجزاء الزهرة\nمخرج تعليمي آخر: يصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية", "المخرج 1 (يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)): تذكر\nالمخرج 2 (يوضح وظيفة كل جزء من أجزاء الزهرة): فهم\nالمخرج الآخر (يصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية): تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، نماذج مجسمة، أخرى: ورقة المصادر 2-4 (نماذج أجزاء الزهرة) ص45، مقص، صمغ", "السبلات، البتلات، السداة (عضو التذكير)، المتك، الخيط، الكربلة (عضو التأنيث)، الميسم، القلم، المبيض، البويضات، حبوب اللقاح.", "يعرض المعلم نموذجًا مجسمًا (أو رسمًا مكبرًا) لزهرة ويسأل: «لكل جزء في الزهرة عمل. أي جزء في رأيك يصنع حبوب اللقاح؟ وأيها يحمي البرعم؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض النموذج ويطرح السؤال.\n  الطالب: يتوقعون.\n• شرح الأجزاء (12 دقيقة):\n  المعلم: يشرح رسم ص34: السبلات تحمي البرعم، البتلات زاهية تجذب الحشرات، السداة (متك + خيط) والمتك ينتج حبوب اللقاح، الكربلة (ميسم يستقبل حبوب اللقاح + قلم + مبيض يحتوي على البويضات).\n  الطالب: يكتبون كل جزء ووظيفته في جدول.\n• نموذج الزهرة (12 دقيقة):\n  المعلم: يوزع ورقة المصادر 2-4 ص45.\n  الطالب: يقصون أجزاء الزهرة ويلصقونها في مكانها الصحيح ويسمونها.\n• لعبة التصنيف (7 دقائق):\n  المعلم: يعرض بطاقات أسماء الأجزاء.\n  الطالب: يصنفونها: ذكرية (المتك، الخيط) – أنثوية (الميسم، القلم، المبيض، البويضات) – أجزاء أخرى (البتلات، السبلات).\n• الغلق (4 دقائق):\n  المعلم: يطرح سؤالًا ختاميًا.\n  الطالب: يسمّون عضو التذكير وعضو التأنيث.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الجزء الذي يصنع حبوب اللقاح؟\n   الإجابة النموذجية: المتك.\n2. (المستوى المتوقع) ما وظيفة السبلات؟\n   الإجابة النموذجية: حماية برعم الزهرة.\n3. (المستوى المتقدم) صنّف: الميسم، المتك، المبيض، الخيط إلى ذكرية وأنثوية.\n   الإجابة النموذجية: ذكرية: المتك، الخيط. أنثوية: الميسم، المبيض.", "1. (مستوى الدعم) أكمل: تتكون السداة من …… و……\n   الإجابة النموذجية: المتك والخيط.\n2. (المستوى المتوقع) ما وظيفة الميسم؟\n   الإجابة النموذجية: استقبال حبوب اللقاح في عملية التلقيح.\n3. (المستوى المتقدم) لماذا تكون بتلات بعض الأزهار زاهية الألوان؟\n   الإجابة النموذجية: لتجذب الحشرات إلى الزهرة.", "للطالب: مراجعة رسم أجزاء الزهرة ص34 وحفظ أسماء الأجزاء ووظائفها. لولي الأمر: إحضار زهرة للحصة القادمة وملاقط صغيرة إن أمكن."]}, {"n": 3, "topic": "نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها", "f": ["1. يفصل أجزاء الزهرة بعناية ويعدّها\n2. يرسم السداة والكربلة ويسمي أجزاءهما\nمخرج تعليمي آخر: يقارن بين أعداد أجزاء زهرتين مختلفتين", "المخرج 1 (يفصل أجزاء الزهرة بعناية ويعدّها): تطبيق\nالمخرج 2 (يرسم السداة والكربلة ويسمي أجزاءهما): تطبيق\nالمخرج الآخر (يقارن بين أعداد أجزاء زهرتين مختلفتين): تحليل", "التعلم بالاكتشاف، التعلم الذاتي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: أزهار، عدسات مكبرة، ملاقط صغيرة، ورق أبيض", "السداة، الكربلة، المتك، الخيط، الميسم، المبيض.", "يعرض المعلم رسمًا لزهرة دون أسماء ويطلب من الطلاب تسمية الأجزاء بسرعة شفهيًا كمراجعة.", "• التهيئة (4 دقائق):\n  المعلم: يعرض الرسم للمراجعة.\n  الطالب: يسمون الأجزاء.\n• نمذجة التشريح (6 دقائق):\n  المعلم: يوضح كيفية سحب البتلات والسبلات بالملقط برفق.\n  الطالب: يتابعون.\n• نشاط 2-4ب (16 دقيقة):\n  المعلم: يتابع المجموعات وفق خطوات ص35.\n  الطالب: يرسمون الزهرة ويسمون أجزاءها، ويعدّون البتلات والسبلات والأسدية، ويسحبون البتلات والسبلات، ويستخدمون العدسة لرؤية الأسدية والكرابل.\n• رسم السداة والكربلة (9 دقائق):\n  المعلم: يتابع دقة الرسم.\n  الطالب: يرسمون السداة والكربلة ويسمون أجزاءهما.\n• الغلق (5 دقائق):\n  المعلم: يسأل: هل تتساوى أعداد الأجزاء في الأزهار المختلفة؟\n  الطالب: يقارنون بين أزهار المجموعات.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الأداة التي استخدمناها لسحب البتلات؟\n   الإجابة النموذجية: الملقط.\n2. (المستوى المتوقع) سمِّ جزأي السداة.\n   الإجابة النموذجية: المتك والخيط.\n3. (المستوى المتقدم) قارن بين عدد البتلات في زهرتك وزهرة مجموعة أخرى.\n   الإجابة النموذجية: تقبل الإجابة الصحيحة حسب الأزهار مع ذكر الفرق.", "1. (مستوى الدعم) صح أم خطأ: الكربلة هي عضو التأنيث في الزهرة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) سمِّ ثلاثة أجزاء للكربلة.\n   الإجابة النموذجية: الميسم والقلم والمبيض.\n3. (المستوى المتقدم) لماذا نستخدم العدسة المكبرة عند فحص الأسدية والكرابل؟\n   الإجابة النموذجية: لأنها أجزاء صغيرة يصعب رؤية تفاصيلها بالعين المجردة.", "للطالب: إكمال رسم السداة والكربلة وتسمية الأجزاء. لولي الأمر: مساعدة الابن في اختيار زهرة صغيرة لضغطها وتجفيفها (ورقة العمل 2-4أ)."]}, {"n": 4, "topic": "أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار", "f": ["1. يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة\n2. يضع تنبؤات اعتمادًا على النمط المكتشف\nمخرج تعليمي آخر: يقرر ما إذا كانت البيانات كافية للتوصل إلى استنتاج عام", "المخرج 1 (يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة): تحليل\nالمخرج 2 (يضع تنبؤات اعتمادًا على النمط المكتشف): تطبيق\nالمخرج الآخر (يقرر ما إذا كانت البيانات كافية للتوصل إلى استنتاج عام): تقييم", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورقتا العمل 2-4أ ص67 و2-4ب ص69، أزهار صغيرة، أوراق جرائد، كتب ثقيلة", "النمط، التنبؤ، السبلات، البتلات، الأسدية.", "يكتب المعلم على السبورة: 4، 8، 12، … ويسأل عن العدد التالي، ثم يوضح أن النمط تغيّر منتظم في الأعداد يمكن أن نجده في الأزهار أيضًا.", "• التهيئة (5 دقائق):\n  المعلم: يعرض النمط العددي.\n  الطالب: يكتشفون العدد التالي ويعرفون النمط.\n• ورقة العمل 2-4أ (10 دقائق):\n  المعلم: يوضح طريقة ضغط الزهرة بين أوراق الجرائد تحت كتب ثقيلة لمدة أسبوعين إلى أربعة أسابيع.\n  الطالب: يضعون أزهارهم للضغط ويرسمونها قبل الضغط.\n• ورقة العمل 2-4ب (15 دقيقة):\n  المعلم: يقدم ورقة العمل ص69 ويطلب البحث عن النمط في أعداد السبلات والبتلات والأسدية.\n  الطالب: يحللون الجدول ويكتشفون أن أعداد البتلات والأسدية تساوي عدد السبلات أو مضاعفاته، ويتنبؤون بأجزاء زهرة لها ثماني سبلات.\n• كفاية الأدلة (6 دقائق):\n  المعلم: يسأل: هل تكفي هذه البيانات لنقول إن كل الأزهار هكذا؟\n  الطالب: يستنتجون أننا نحتاج أزهارًا أكثر لنتأكد.\n• الغلق (4 دقائق):\n  المعلم: يلخص مفهوم النمط والتنبؤ.\n  الطالب: يذكرون النمط الذي اكتشفوه.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما المقصود بالنمط؟\n   الإجابة النموذجية: تغير منتظم في الأعداد أو بيانات تتكرر بطريقة يمكن توقعها.\n2. (المستوى المتوقع) زهرة لها خمس سبلات، كم عدد بتلاتها المتوقع؟\n   الإجابة النموذجية: خمس بتلات غالبًا.\n3. (المستوى المتقدم) هل تكفي بيانات أربع أزهار لتعميم النمط على كل الأزهار؟ لماذا؟\n   الإجابة النموذجية: لا؛ نحتاج إلى فحص أزهار كثيرة مختلفة لأن بعض الأزهار قد لا تتبع النمط.", "1. (مستوى الدعم) صح أم خطأ: نضغط الزهرة لتجف وتحافظ على شكلها.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) تنبأ بعدد بتلات وأسدية زهرة لها ثماني سبلات.\n   الإجابة النموذجية: ثماني بتلات وثماني أسدية على الأرجح.\n3. (المستوى المتقدم) كيف تتحقق من صحة النمط الذي اكتشفته؟\n   الإجابة النموذجية: بفحص أزهار كثيرة مختلفة وعدّ أجزائها ومقارنتها بالنمط.", "للطالب: متابعة الزهرة المضغوطة أسبوعيًا، وإكمال ورقة العمل 2-4ب ص69. لولي الأمر: التأكد من وضع الزهرة في مكان جاف تحت كتب ثقيلة دون تحريكها."]}, {"n": 5, "topic": "أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات", "f": ["1. يجيب عن أسئلة أجزاء الزهرة ووظائفها\n2. يخطط لاستقصاء لمعرفة لون بتلات الأزهار الأكثر شيوعًا\nمخرج تعليمي آخر: يفسر سبب امتلاك بعض الأزهار رائحة كريهة ولونًا داكنًا", "المخرج 1 (يجيب عن أسئلة أجزاء الزهرة ووظائفها): تطبيق\nالمخرج 2 (يخطط لاستقصاء لمعرفة لون بتلات الأزهار الأكثر شيوعًا): إبداع\nالمخرج الآخر (يفسر سبب امتلاك بعض الأزهار رائحة كريهة ولونًا داكنًا): تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "البتلات، الرائحة، الحشرات، الاستقصاء.", "يعرض المعلم صورة زهرة الجثة (الرافليسيا) ص35 ويقرأ وصفها: «تبدو رائحتها مثل اللحم المتعفن»، ويسأل: «لماذا تحتاج زهرة إلى رائحة كهذه؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يتوقعون أنها تجذب حشرات معينة كالذباب.\n• أسئلة ص35 (10 دقائق):\n  المعلم: يناقش السؤالين (1، 2).\n  الطالب: يسمون: المتك يصنع حبوب اللقاح، السبلات تحمي البرعم، المبيض يحتوي البويضات، البتلات تجذب الحشرات والطيور، والبتلات مصدر الرائحة.\n• التخطيط للاستقصاء (س3) (9 دقائق):\n  المعلم: يوجه المجموعات لتخطيط استقصاء: ماذا نعدّ؟ أين؟ كيف نسجل؟ كم مرة نكرر؟\n  الطالب: يكتبون خطة: عدّ أزهار كل لون في عدة حدائق، تسجيل في جدول، تمثيل بالأعمدة.\n• تمرين 2-4 (8 دقائق):\n  المعلم: يقدم تمرين 2-4 بكتاب النشاط ص26.\n  الطالب: يحلون التمرين.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-4.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما جزء الزهرة الذي يحتوي على البويضات؟\n   الإجابة النموذجية: المبيض.\n2. (المستوى المتوقع) ما جزء الزهرة الذي يجذب الحشرات والطيور؟\n   الإجابة النموذجية: البتلات الزاهية (ورائحتها).\n3. (المستوى المتقدم) لماذا تمتلك بعض الأزهار لونًا بنيًا داكنًا ورائحة كريهة؟\n   الإجابة النموذجية: لتجذب حشرات معينة كالذباب الذي يتغذى على اللحوم المتعفنة فيلقحها.", "1. (مستوى الدعم) سمِّ جزء الزهرة الذي يحمي البرعم.\n   الإجابة النموذجية: السبلات.\n2. (المستوى المتوقع) اذكر خطوتين في خطة استقصاء اللون الأكثر شيوعًا لبتلات الأزهار.\n   الإجابة النموذجية: عدّ أزهار كل لون في أماكن مختلفة، تسجيل الأعداد في جدول وتمثيلها بالأعمدة.\n3. (المستوى المتقدم) لماذا يجب تكرار العدّ في أكثر من حديقة؟\n   الإجابة النموذجية: لأن حديقة واحدة قد لا تمثل جميع الأزهار، والتكرار يجعل الاستنتاج أكثر موثوقية.", "للطالب: حل تمرين 2-4 بكتاب النشاط ص26 إن لم يكتمل، وتنفيذ خطة عدّ الأزهار حسب ألوانها في حديقة الحي. لولي الأمر: مرافقة الابن عند عدّ الأزهار وتسجيل النتائج."]}], "combined": ["الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها\n2. يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها\nمخرج تعليمي آخر: يميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة\n\nالحصة 2: أجزاء الزهرة ووظائفها\n1. يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)\n2. يوضح وظيفة كل جزء من أجزاء الزهرة\nمخرج تعليمي آخر: يصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. يفصل أجزاء الزهرة بعناية ويعدّها\n2. يرسم السداة والكربلة ويسمي أجزاءهما\nمخرج تعليمي آخر: يقارن بين أعداد أجزاء زهرتين مختلفتين\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة\n2. يضع تنبؤات اعتمادًا على النمط المكتشف\nمخرج تعليمي آخر: يقرر ما إذا كانت ا طيط لاستقصاء ألوان البتلات\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: أزهار حقيقية كبيرة (كالكركديه أو الرمان)، عدسات مكبرة\n\nالحصة 2: أجزاء الزهرة ووظائفها\nالكتاب، السبورة الذكية، صورة توضيحية، نماذج مجسمة، أخرى: ورقة المصادر 2-4 (نماذج أجزاء الزهرة) ص45، مقص، صمغ\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nالكتاب، السبورة الذكية، الأقلام، أخرى: أزهار، عدسات مكبرة، ملاقط صغيرة، ورق أبيض\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nالكتاب، السبورة الذكية، الأقلام، أخرى: ورقتا العمل 2-4أ ص67 و2-4ب ص69، أزهار صغيرة، أوراق جرائد، كتب ثقيلة\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nالكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nالبتلات، السبلات، الأسدية، الأجزاء الذكرية، الأجزاء الأنثوية.\n\nالحصة 2: أجزاء الزهرة ووظائفها\nالسبلات، البتلات، السداة (عضو التذكير)، المتك، الخيط، الكربلة (عضو التأنيث)، الميسم، القلم، المبيض، البويضات، حبوب اللقاح.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nالسداة، الكربلة، المتك، الخيط، الميسم، المبيض.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nالنمط، التنبؤ، السبلات، البتلات، الأسدية.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nالبتلات، الرائحة، الحشرات، الاستقصاء.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nينفذ المعلم عصفًا ذهنيًا سريعًا: يعرض زهرة كبيرة ويطلب من الطلاب تسمية أكبر عدد من أجزائها التي يعرفونها، ويكتبها على السبورة.\n\nالحصة 2: أجزاء الزهرة ووظائفها\nيعرض المعلم نموذجًا مجسمًا (أو رسمًا مكبرًا) لزهرة ويسأل: «لكل جزء في الزهرة عمل. أي جزء في رأيك يصنع حبوب اللقاح؟ وأيها يحمي البرعم؟».\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nيعرض المعلم رسمًا لزهرة دون أسماء ويطلب من الطلاب تسمية الأجزاء بسرعة شفهيًا كمراجعة.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nيكتب المعلم على السبورة: 4، 8، 12، … ويسأل عن العدد التالي، ثم يوضح أن النمط تغيّر منتظم في الأعداد يمكن أن نجده في الأزهار أيضًا.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nيعرض المعلم صورة زهرة الجثة (الرافليسيا) ص35 ويقرأ وصفها: «تبدو رائحتها مثل اللحم المتعفن»، ويسأل: «لماذا تحتاج زهرة إلى رائحة كهذه؟».", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n• التهيئة (5 دقائق):\n  المعلم: يعرض الزهرة وينفذ العصف الذهني.\n  الطالب: يسمون ما يعرفونه من أجزاء.\n• تعليمات الأمان (5 دقائق):\n  المعلم: ينبّه إلى عدم قطف الأزهار دون إذن وتجنب النباتات الضارة كالدفلة، وغسل اليدين بعد العمل.\n  الطالب: يستمعون ويلتزمون.\n• نشاط 2-4أ (18 دقيقة):\n  المعلم: يوزع الأزهار والعدسات ويوجه وفق خطوات ص34.\n  الطالب: يحددون اللون، ويعدّون الأجزاء الملونة (البتلات) والخضراء (السبلات)، ويلاحظون الأجزاء الداخلية، ويعدّون السيقان الرفيعة (الأسدية) ويلمسون حوافها، ويلاحظون الساق الوسطى (الكربلة).\n• المشاركة (8 دقائق):\n  المعلم: يطلب من كل مجموعة عرض أعدادها.\n  الطالب: يقارنون الأعداد بين أنواع الأزهار.\n• الغلق (4 دقائق):\n  المعلم: يسأل: ماذا لاحظتم على أصابعكم بعد لمس الحواف الصفراء؟\n  الطالب: يذكرون مسحوقًا أصفر (حبوب اللقاح).\nالمجموع: 40 دقيقة\n\nالحصة 2: أجزاء الزهرة ووظائفها\n• التهيئة (5 دقائق):\n  المعلم: يعرض النموذج ويطرح السؤال.\n  الطالب: يتوقعون.\n• شرح الأجزاء (12 دقيقة):\n  المعلم: يشرح رسم ص34: السبلات تحمي البرعم، البتلات زاهية تجذب الحشرات، السداة (متك + خيط) والمتك ينتج حبوب اللقاح، الكربلة (ميسم يستقبل حبوب اللقاح + قلم + مبيض يحتوي على البويضات).\n  الطالب: يكتبون كل جزء ووظيفته في جدول.\n• نموذج الزهرة (12 دقيقة):\n  المعلم: يوزع ورقة المصادر 2-4 ص45.\n  الطالب: يقصون أجزاء الزهرة ويلصقونها في مكانها الصحيح ويسمونها.\n• لعبة التصنيف (7 دقائق):\n  المعلم: يعرض بطاقات أسماء الأجزاء.\n  الطالب: يصنفونها: ذكرية (المتك، الخيط) – أنثوية (الميسم، القلم، المبيض، البويضات) – أجزاء أخرى (البتلات، السبلات).\n• الغلق (4 دقائق):\n  المعلم: يطرح سؤالًا ختاميًا.\n  الطالب: يسمّون عضو التذكير وعضو التأنيث.\nالمجموع: 40 دقيقة\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n• التهيئة (4 دقائق):\n  المعلم: يعرض الرسم للمراجعة.\n  الطالب: يسمون الأجزاء.\n• نمذجة التشريح (6 دقائق):\n  المعلم: يوضح كيفية سحب البتلات والسبلات بالملقط برفق.\n  الطالب: يتابعون.\n• نشاط 2-4ب (16 دقيقة):\n  المعلم: يتابع المجموعات وفق خطوات ص35.\n  الطالب: يرسمون الزهرة ويسمون أجزاءها، ويعدّون البتلات والسبلات والأسدية، ويسحبون البتلات والسبلات، ويستخدمون العدسة لرؤية الأسدية والكرابل.\n• رسم السداة والكربلة (9 دقائق):\n  المعلم: يتابع دقة الرسم.\n  الطالب: يرسمون السداة والكربلة ويسمون أجزاءهما.\n• الغلق (5 دقائق):\n  المعلم: يسأل: هل تتساوى أعداد الأجزاء في الأزهار المختلفة؟\n  الطالب: يقارنون بين أزهار المجموعات.\nالمجموع: 40 دقيقة\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n• التهيئة (5 دقائق):\n  المعلم: يعرض النمط العددي.\n  الطالب: يكتشفون العدد التالي ويعرفون النمط.\n• ورقة العمل 2-4أ (10 دقائق):\n  المعلم: يوضح طريقة ضغط الزهرة بين أوراق الجرائد تحت كتب ثقيلة لمدة أسبوعين إلى أربعة أسابيع.\n  الطالب: يضعون أزهارهم للضغط ويرسمونها قبل الضغط.\n• ورقة العمل 2-4ب (15 دقيقة):\n  المعلم: يقدم ورقة العمل ص69 ويطلب البحث عن النمط في أعداد السبلات والبتلات والأسدية.\n  الطالب: يحللون الجدول ويكتشفون أن أعداد البتلات والأسدية تساوي عدد السبلات أو مضاعفاته، ويتنبؤون بأجزاء زهرة لها ثماني سبلات.\n• كفاية الأدلة (6 دقائق):\n  المعلم: يسأل: هل تكفي هذه البيانات لنقول إن كل الأزهار هكذا؟\n  الطالب: يستنتجون أننا نحتاج أزهارًا أكثر لنتأكد.\n• الغلق (4 دقائق):\n  المعلم: يلخص مفهوم النمط والتنبؤ.\n  الطالب: يذكرون النمط الذي اكتشفوه.\nالمجموع: 40 دقيقة\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يتوقعون أنها تجذب حشرات معينة كالذباب.\n• أسئلة ص35 (10 دقائق):\n  المعلم: يناقش السؤالين (1، 2).\n  الطالب: يسمون: المتك يصنع حبوب اللقاح، السبلات تحمي البرعم، المبيض يحتوي البويضات، البتلات تجذب الحشرات والطيور، والبتلات مصدر الرائحة.\n• التخطيط للاستقصاء (س3) (9 دقائق):\n  المعلم: يوجه المجموعات لتخطيط استقصاء: ماذا نعدّ؟ أين؟ كيف نسجل؟ كم مرة نكرر؟\n  الطالب: يكتبون خطة: عدّ أزهار كل لون في عدة حدائق، تسجيل في جدول، تمثيل بالأعمدة.\n• تمرين 2-4 (8 دقائق):\n  المعلم: يقدم تمرين 2-4 بكتاب النشاط ص26.\n  الطالب: يحلون التمرين.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-4.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. (مستوى الدعم) ما لون السبلات غالبًا؟\n   الإجابة النموذجية: أخضر.\n2. (المستوى المتوقع) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الزهرة (مع العدّ الصحيح).\n3. (المستوى المتقدم) ما المسحوق الأصفر الذي ظهر على أصابعك بعد لمس حواف السيقان الرفيعة؟ ومن أي جزء أتى؟\n   الإجابة النموذجية: حبوب اللقاح، من المتك (رأس السداة) وهو جزء ذكري.\n\nالحصة 2: أجزاء الزهرة ووظائفها\n1. (مستوى الدعم) ما الجزء الذي يصنع حبوب اللقاح؟\n   الإجابة النموذجية: المتك.\n2. (المستوى المتوقع) ما وظيفة السبلات؟\n   الإجابة النموذجية: حماية برعم الزهرة.\n3. (المستوى المتقدم) صنّف: الميسم، المتك، المبيض، الخيط إلى ذكرية وأنثوية.\n   الإجابة النموذجية: ذكرية: المتك، الخيط. أنثوية: الميسم، المبيض.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. (مستوى الدعم) ما الأداة التي استخدمناها لسحب البتلات؟\n   الإجابة النموذجية: الملقط.\n2. (المستوى المتوقع) سمِّ جزأي السداة.\n   الإجابة النموذجية: المتك والخيط.\n3. (المستوى المتقدم) قارن بين عدد البتلات في زهرتك وزهرة مجموعة أخرى.\n   الإجابة النموذجية: تقبل الإجابة الصحيحة حسب الأزهار مع ذكر الفرق.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. (مستوى الدعم) ما المقصود بالنمط؟\n   الإجابة النموذجية: تغير منتظم في الأعداد أو بيانات تتكرر بطريقة يمكن توقعها.\n2. (المستوى المتوقع) زهرة لها خمس سبلات، كم عدد بتلاتها المتوقع؟\n   الإجابة النموذجية: خمس بتلات غالبًا.\n3. (المستوى المتقدم) هل تكفي بيانات أربع أزهار لتعميم النمط على كل الأزهار؟ لماذا؟\n   الإجابة النموذجية: لا؛ نحتاج إلى فحص أزهار كثيرة مختلفة لأن بعض الأزهار قد لا تتبع النمط.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n1. (مستوى الدعم) ما جزء الزهرة الذي يحتوي على البويضات؟\n   الإجابة النموذجية: المبيض.\n2. (المستوى المتوقع) ما جزء الزهرة الذي يجذب الحشرات والطيور؟\n   الإجابة النموذجية: البتلات الزاهية (ورائحتها).\n3. (المستوى المتقدم) لماذا تمتلك بعض الأزهار لونًا بنيًا داكنًا ورائحة كريهة؟\n   الإجابة النموذجية: لتجذب حشرات معينة كالذباب الذي يتغذى على اللحوم المتعفنة فيلقحها.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. (مستوى الدعم) صح أم خطأ: البتلات هي الأجزاء الملونة في الزهرة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر جزأين لاحظتهما داخل الزهرة.\n   الإجابة النموذجية: الأسدية (السيقان الرفيعة) والكربلة (الساق الوسطى).\n3. (المستوى المتقدم) لماذا تكون الساق الوسطى في الزهرة مختلفة عن الأسدية؟\n   الإجابة النموذجية: لأنها الجزء الأنثوي (الكربلة)، بينما الأسدية أجزاء ذكرية.\n\nالحصة 2: أجزاء الزهرة ووظائفها\n1. (مستوى الدعم) أكمل: تتكون السداة من …… و……\n   الإجابة النموذجية: المتك والخيط.\n2. (المستوى المتوقع) ما وظيفة الميسم؟\n   الإجابة النموذجية: استقبال حبوب اللقاح في عملية التلقيح.\n3. (المستوى المتقدم) لماذا تكون بتلات بعض الأزهار زاهية الألوان؟\n   الإجابة النموذجية: لتجذب الحشرات إلى الزهرة.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. (مستوى الدعم) صح أم خطأ: الكربلة هي عضو التأنيث في الزهرة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) سمِّ ثلاثة أجزاء للكربلة.\n   الإجابة النموذجية: الميسم والقلم والمبيض.\n3. (المستوى المتقدم) لماذا نستخدم العدسة المكبرة عند فحص الأسدية والكرابل؟\n   الإجابة النموذجية: لأنها أجزاء صغيرة يصعب رؤية تفاصيلها بالعين المجردة.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. (مستوى الدعم) صح أم خطأ: نضغط الزهرة لتجف وتحافظ على شكلها.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) تنبأ بعدد بتلات وأسدية زهرة لها ثماني سبلات.\n   الإجابة النموذجية: ثماني بتلات وثماني أسدية على الأرجح.\n3. (المستوى المتقدم) كيف تتحقق من صحة النمط الذي اكتشفته؟\n   الإجابة النموذجية: بفحص أزهار كثيرة مختلفة وعدّ أجزائها ومقارنتها بالنمط.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n1. (مستوى الدعم) سمِّ جزء الزهرة الذي يحمي البرعم.\n   الإجابة النموذجية: السبلات.\n2. (المستوى المتوقع) اذكر خطوتين في خطة استقصاء اللون الأكثر شيوعًا لبتلات الأزهار.\n   الإجابة النموذجية: عدّ أزهار كل لون في أماكن مختلفة، تسجيل الأعداد في جدول وتمثيلها بالأعمدة.\n3. (المستوى المتقدم) لماذا يجب تكرار العدّ في أكثر من حديقة؟\n   الإجابة النموذجية: لأن حديقة واحدة قد لا تمثل جميع الأزهار، والتكرار يجعل الاستنتاج أكثر موثوقية.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nللطالب: قراءة كتاب الطالب ص34، ورسم الزهرة التي فحصها. لولي الأمر: مساعدة الابن في ملاحظة زهرة في المنزل وعدّ بتلاتها وسبلاتها.\n\nالحصة 2: أجزاء الزهرة ووظائفها\nللطالب: مراجعة رسم أجزاء الزهرة ص34 وحفظ أسماء الأجزاء ووظائفها. لولي الأمر: إحضار زهرة للحصة القادمة وملاقط صغيرة إن أمكن.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nللطالب: إكمال رسم السداة والكربلة وتسمية الأجزاء. لولي الأمر: مساعدة الابن في اختيار زهرة صغيرة لضغطها وتجفيفها (ورقة العمل 2-4أ).\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nللطالب: متابعة الزهرة المضغوطة أسبوعيًا، وإكمال ورقة العمل 2-4ب ص69. لولي الأمر: التأكد من وضع الزهرة في مكان جاف تحت كتب ثقيلة دون تحريكها.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nللطالب: حل تمرين 2-4 بكتاب النشاط ص26 إن لم يكتمل، وتنفيذ خطة عدّ الأزهار حسب ألوانها في حديقة الحي. لولي الأمر: مرافقة الابن عند عدّ الأزهار وتسجيل النتائج."]}, {"code": "2-5", "title": "التلقيح", "unit": 2, "dates": "الأسبوع السابع (18–22/10/2026م)", "sb": "36–37", "tb": "48–49", "ab": "تمرين 2-5 ص27", "periods": [{"n": 1, "topic": "مفهوم التلقيح", "f": ["1. يعرّف التلقيح بأنه نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه\n2. يحدد اتجاه انتقال حبوب اللقاح بين أجزاء الزهرة\nمخرج تعليمي آخر: يربط بين التلقيح اليدوي لأشجار النخيل وعملية التلقيح في الطبيعة", "المخرج 1 (يعرّف التلقيح بأنه نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه): تذكر\nالمخرج 2 (يحدد اتجاه انتقال حبوب اللقاح بين أجزاء الزهرة): فهم\nالمخرج الآخر (يربط بين التلقيح اليدوي لأشجار النخيل وعملية التلقيح في الطبيعة): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة أو مقطع لتلقيح النخيل، نموذج زهرة", "التلقيح، حبوب اللقاح، السداة، الميسم.", "يسأل المعلم: «هل شاهدت مزارعًا يصعد النخلة في موسم معين ويضع فيها شيئًا؟ ماذا يفعل؟»، ثم يعرض مقطعًا قصيرًا لعملية «التنبيت» (تلقيح النخيل) في عُمان.", "• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال ويعرض المقطع.\n  الطالب: يصفون ما يفعله المزارع.\n• تعريف التلقيح (10 دقائق):\n  المعلم: يقرأ مع الطلاب ص36 ويوضح: التلقيح نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n  الطالب: يكتبون التعريف ويحددون على نموذج الزهرة مسار حبوب اللقاح.\n• نمذجة المسار (10 دقائق):\n  المعلم: يرسم زهرتين على السبورة ويرسم سهمًا من متك الأولى إلى ميسم الثانية.\n  الطالب: يرسمون المخطط ويسمّون الجزء المرسل والجزء المستقبل.\n• الربط بالنخيل (9 دقائق):\n  المعلم: يوضح أن المزارع ينقل حبوب اللقاح من النخلة الذكر (الفحل) إلى أزهار النخلة الأنثى.\n  الطالب: يناقشون: لماذا يحتاج المزارع لفعل ذلك؟\n• الغلق (6 دقائق):\n  المعلم: يطرح سؤال: من ينقل حبوب اللقاح في الطبيعة؟\n  الطالب: يتوقعون: الحشرات والرياح.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما التلقيح؟\n   الإجابة النموذجية: نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n2. (المستوى المتوقع) إلى أي جزء من الزهرة تنتقل حبوب اللقاح؟\n   الإجابة النموذجية: إلى الميسم.\n3. (المستوى المتقدم) لماذا يلقح المزارعون النخيل يدويًا؟\n   الإجابة النموذجية: لضمان وصول حبوب اللقاح من الفحل إلى أزهار النخلة الأنثى فتتكون الثمار.", "1. (مستوى الدعم) أكمل: تنتقل حبوب اللقاح في التلقيح من …… إلى ……\n   الإجابة النموذجية: السداة (المتك)؛ ميسم زهرة من النوع نفسه.\n2. (المستوى المتوقع) هل يمكن تلقيح زهرة طماطم بحبوب لقاح من زهرة ورد؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن التلقيح يكون بين أزهار من النوع نفسه.\n3. (المستوى المتقدم) اقترح ما يحدث لمحصول التمر إذا لم يتم تلقيح النخيل.\n   الإجابة النموذجية: يقل المحصول كثيرًا أو لا تتكون الثمار جيدًا.", "للطالب: قراءة كتاب الطالب ص36، وسؤال أحد كبار العائلة عن طريقة تلقيح النخيل. لولي الأمر: التحدث مع الابن عن تلقيح النخيل وموسمه في عُمان."]}, {"n": 2, "topic": "التلقيح بواسطة الحشرات", "f": ["1. يصف كيف تلقح الحشرات الأزهار أثناء تغذيها على الرحيق\n2. يحدد صفات الأزهار التي تلقحها الحشرات\nمخرج تعليمي آخر: يستنتج من الآية الكريمة دور النحل في التلقيح وإنتاج العسل", "المخرج 1 (يصف كيف تلقح الحشرات الأزهار أثناء تغذيها على الرحيق): فهم\nالمخرج 2 (يحدد صفات الأزهار التي تلقحها الحشرات): تحليل\nالمخرج الآخر (يستنتج من الآية الكريمة دور النحل في التلقيح وإنتاج العسل): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: أزهار زاهية، عدسة مكبرة", "الرحيق، التلقيح، الحشرات، حبوب اللقاح.", "يتلو المعلم قوله تعالى: «وأوحى ربك إلى النحل…» (سورة النحل 68–69) كما في ص36، ويسأل: «من أين يجمع النحل غذاءه؟ وماذا يحمل على جسمه دون أن يقصد؟».", "• التهيئة (5 دقائق):\n  المعلم: يتلو الآية ويطرح السؤال.\n  الطالب: يجيبون: من الأزهار؛ يحمل حبوب اللقاح.\n• التلقيح بالحشرات (10 دقائق):\n  المعلم: يشرح ص36: تتغذى الحشرات على الرحيق (سائل حلو المذاق)، فتعلق بها حبوب اللقاح وتنقلها إلى ميسم زهرة أخرى.\n  الطالب: يرسمون مخطط تسلسل لرحلة النحلة بين زهرتين.\n• صفات الأزهار (10 دقائق):\n  المعلم: يعرض صورًا لأزهار تلقحها الحشرات.\n  الطالب: يستنتجون الصفات: بتلات زاهية الألوان، رائحة، رحيق.\n• تأمل الآية (10 دقائق):\n  المعلم: يناقش معنى الآية: النحل يأكل من الثمرات ويخرج العسل الذي فيه شفاء.\n  الطالب: يربطون بين تغذي النحل على الرحيق وإنتاج العسل وتلقيح الأزهار.\n• الغلق (5 دقائق):\n  المعلم: يسأل: لماذا تحتاج الزهرة إلى ألوان ورائحة؟\n  الطالب: يجيبون: لجذب الحشرات.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الرحيق؟\n   الإجابة النموذجية: سائل حلو المذاق تصنعه الأزهار وتتغذى عليه الحشرات.\n2. (المستوى المتوقع) اذكر صفتين لأزهار تلقحها الحشرات.\n   الإجابة النموذجية: بتلات زاهية الألوان، رائحة، رحيق (أي اثنتين).\n3. (المستوى المتقدم) كيف تنتقل حبوب اللقاح من زهرة إلى أخرى بواسطة النحلة؟\n   الإجابة النموذجية: تعلق حبوب اللقاح بجسم النحلة أثناء تغذيها على الرحيق، ثم تسقط على ميسم الزهرة التالية التي تزورها.", "1. (مستوى الدعم) صح أم خطأ: الأزهار التي تلقحها الحشرات تكون زاهية الألوان غالبًا.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) لماذا تزور الحشرات الأزهار؟\n   الإجابة النموذجية: لتتغذى على الرحيق.\n3. (المستوى المتقدم) ماذا يحدث للأزهار لو قلّت أعداد النحل في منطقة ما؟\n   الإجابة النموذجية: يقل تلقيح الأزهار فتقل الثمار والبذور.", "للطالب: حفظ الآيتين 68–69 من سورة النحل، وملاحظة حشرات تزور الأزهار في الحديقة. لولي الأمر: مناقشة الابن في فوائد النحل للإنسان والنبات."]}, {"n": 3, "topic": "التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟", "f": ["1. يصف صفات الأزهار التي تلقحها الرياح\n2. يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها\nمخرج تعليمي آخر: يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح", "المخرج 1 (يصف صفات الأزهار التي تلقحها الرياح): فهم\nالمخرج 2 (يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها): تطبيق\nالمخرج الآخر (يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: أزهار عشبية وأزهار زاهية من فناء المدرسة، عدسات مكبرة، ورق", "التلقيح بالرياح، حبوب اللقاح.", "يعرض المعلم صورة الزهرة العشبية ص36 والرياح تنثر منها سحابة من حبوب اللقاح، ويسأل: «هذه الزهرة ليست ملونة ولا رائحة لها، فكيف تُلقّح؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون الرياح.\n• صفات أزهار الرياح (8 دقائق):\n  المعلم: يشرح ص36: غير زاهية، لا بتلات أو رائحة، تنتج كثيرًا من حبوب اللقاح الخفيفة.\n  الطالب: يكتبون الصفات ويقارنونها بأزهار الحشرات.\n• نشاط 2-5 (16 دقيقة):\n  المعلم: يصطحب الطلاب إلى فناء المدرسة ويوجههم وفق ص36.\n  الطالب: ينظرون إلى الأزهار المختلفة، ويرسمون صورًا لها ويسمون أجزاءها، ويحددون كيف يتم تلقيح كل زهرة ولماذا.\n• جدول مقارنة (8 دقائق):\n  المعلم: يرسم جدولًا للمقارنة.\n  الطالب: يكملون: الحشرات (زاهية، رائحة، رحيق) – الرياح (غير زاهية، بلا رائحة، حبوب لقاح كثيرة).\n• الغلق (3 دقائق):\n  المعلم: يسأل سؤالًا ختاميًا.\n  الطالب: يحددون نوع تلقيح زهرة معروضة.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) اذكر صفة لزهرة تلقحها الرياح.\n   الإجابة النموذجية: غير زاهية أو بلا رائحة أو تنتج كثيرًا من حبوب اللقاح.\n2. (المستوى المتوقع) زهرة صغيرة خضراء بلا رائحة، كيف تلقح غالبًا؟\n   الإجابة النموذجية: بواسطة الرياح.\n3. (المستوى المتقدم) لماذا تنتج الأزهار التي تلقحها الرياح كثيرًا من حبوب اللقاح؟\n   الإجابة النموذجية: لأن معظم حبوب اللقاح تضيع في الهواء، فتزيد الكثرة فرصة وصول بعضها إلى ميسم زهرة من النوع نفسه.", "1. (مستوى الدعم) صح أم خطأ: الأزهار التي تلقحها الرياح لها رحيق كثير.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) قارن بين زهرة تلقحها الحشرات وزهرة تلقحها الرياح من حيث اللون والرائحة.\n   الإجابة النموذجية: الحشرات: زاهية الألوان ذات رائحة. الرياح: غير زاهية بلا رائحة.\n3. (المستوى المتقدم) لماذا لا تحتاج الأزهار التي تلقحها الرياح إلى بتلات زاهية؟\n   الإجابة النموذجية: لأنها لا تحتاج إلى جذب الحشرات؛ فالرياح تنقل حبوب لقاحها.", "للطالب: إكمال رسومات نشاط 2-5 وتسمية الأجزاء. لولي الأمر: ملاحظة أزهار في الحي مع الابن وتحديد نوع تلقيحها."]}, {"n": 4, "topic": "الإخصاب وتكوين الثمار والبذور", "f": ["1. يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض\n2. يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور\nمخرج تعليمي آخر: يميز بين التلقيح والإخصاب", "المخرج 1 (يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض): فهم\nالمخرج 2 (يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور): فهم\nالمخرج الآخر (يميز بين التلقيح والإخصاب): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية، أخرى: صور مراحل تكون ثمرة الطماطم", "الإخصاب، المبيض، البويضات، الثمرة، البذور.", "يعرض المعلم الصور الثلاث لنبات الطماطم ص37 (زهرة ← ثمرة صغيرة ← ثمرة ناضجة) ويسأل: «بعد التلقيح، ماذا يحدث داخل الزهرة حتى تظهر هذه الثمرة؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصور ويطرح السؤال.\n  الطالب: يتوقعون أن الزهرة تتحول إلى ثمرة.\n• الإخصاب (10 دقائق):\n  المعلم: يشرح ص37: تنتقل حبوب اللقاح من الميسم إلى المبيض، وتتحد مع البويضات (الإخصاب).\n  الطالب: يحددون موقع الإخصاب على رسم الزهرة.\n• من المبيض إلى الثمرة (10 دقائق):\n  المعلم: يوضح: بعد الإخصاب تموت البتلات والأسدية، وينمو المبيض ليكوّن الثمرة، وتتحول البويضات المخصبة إلى بذور.\n  الطالب: يرتبون بطاقات: تلقيح ← إخصاب ← ذبول البتلات ← نمو المبيض ← ثمرة بها بذور.\n• التلقيح والإخصاب (10 دقائق):\n  المعلم: يكتب على السبورة جدول مقارنة (أين؟ ماذا يحدث؟).\n  الطالب: يكملون المقارنة: التلقيح نقل حبوب اللقاح إلى الميسم، والإخصاب اتحادها بالبويضات داخل المبيض.\n• الغلق (5 دقائق):\n  المعلم: يسأل: أي جزء في الزهرة يصبح ثمرة؟\n  الطالب: يجيبون: المبيض.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) أين يحدث الإخصاب؟\n   الإجابة النموذجية: داخل المبيض.\n2. (المستوى المتوقع) إلامَ تتحول البويضات المخصبة؟\n   الإجابة النموذجية: إلى بذور.\n3. (المستوى المتقدم) ما الفرق بين التلقيح والإخصاب؟\n   الإجابة النموذجية: التلقيح نقل حبوب اللقاح من السداة إلى الميسم، والإخصاب اتحاد حبوب اللقاح مع البويضات داخل المبيض.", "1. (مستوى الدعم) أكمل: بعد الإخصاب ينمو …… ليكوّن الثمرة.\n   الإجابة النموذجية: المبيض.\n2. (المستوى المتوقع) ماذا يحدث للبتلات والأسدية بعد الإخصاب؟\n   الإجابة النموذجية: تموت (تذبل وتسقط).\n3. (المستوى المتقدم) هل يمكن أن يحدث الإخصاب دون تلقيح؟ فسّر.\n   الإجابة النموذجية: لا؛ لأن حبوب اللقاح يجب أن تصل أولًا إلى الميسم بالتلقيح ثم تنتقل إلى المبيض لتخصب البويضات.", "للطالب: قراءة كتاب الطالب ص37، ورسم مخطط من التلقيح إلى تكوين البذور. لولي الأمر: فتح ثمرة طماطم مع الابن وملاحظة البذور وربطها بالبويضات المخصبة."]}, {"n": 5, "topic": "محاكاة التلقيح وأسئلة الدرس", "f": ["1. يحاكي عملية التلقيح بالحشرات بنموذج بسيط\n2. يجيب عن أسئلة الدرس ويوضح كيف يساعد التلقيح في تكاثر النبات\nمخرج تعليمي آخر: يوضح كيف تنتقل حبوب اللقاح من الميسم إلى المبيض (التحدي)", "المخرج 1 (يحاكي عملية التلقيح بالحشرات بنموذج بسيط): تطبيق\nالمخرج 2 (يجيب عن أسئلة الدرس ويوضح كيف يساعد التلقيح في تكاثر النبات): فهم\nالمخرج الآخر (يوضح كيف تنتقل حبوب اللقاح من الميسم إلى المبيض (التحدي)): تحليل", "التعلم المبني على اللعب، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: أزهار ورقية، مسحوق طباشير ملون يمثل حبوب اللقاح، أعواد قطنية", "التلقيح، الإخصاب، حبوب اللقاح، الرحيق.", "يوزع المعلم «أزهارًا ورقية» في وسط بعضها مسحوق طباشير ملون، ويخبر الطلاب أنهم سيكونون «نحلًا» يبحث عن الرحيق.", "• التهيئة (4 دقائق):\n  المعلم: يشرح قواعد المحاكاة.\n  الطالب: يستعدون للعب دور النحل.\n• المحاكاة (10 دقائق):\n  المعلم: يطلب من «النحل» زيارة الأزهار بالعود القطني بالترتيب.\n  الطالب: ينقلون المسحوق من زهرة إلى أخرى ويلاحظون انتقال «حبوب اللقاح» إلى الأزهار.\n• تحليل المحاكاة (6 دقائق):\n  المعلم: يسأل: ماذا يمثل المسحوق؟ والعود القطني؟ وما حدود هذا النموذج؟\n  الطالب: يربطون عناصر النموذج بالواقع.\n• أسئلة ص37 والتحدي (10 دقائق):\n  المعلم: يناقش الأسئلة (1–4) والتحدي.\n  الطالب: يجيبون عن تلقيح الحشرات والرياح وكثرة حبوب اللقاح ودور التلقيح والفرق بينه وبين الإخصاب.\n• مسابقة المجموعات (10 دقائق):\n  المعلم: يشغّل مسابقة درس 2-5.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ماذا يمثل المسحوق الملون في المحاكاة؟\n   الإجابة النموذجية: حبوب اللقاح.\n2. (المستوى المتوقع) لماذا تنتج الأزهار التي تلقحها الرياح كمية كبيرة من حبوب اللقاح الجافة؟\n   الإجابة النموذجية: لأن كثيرًا منها يضيع في الهواء ولا يصل إلى الميسم.\n3. (المستوى المتقدم) كيف يساعد التلقيح في تكاثر النباتات؟\n   الإجابة النموذجية: يوصل حبوب اللقاح إلى الميسم فتنتقل إلى المبيض وتخصب البويضات فتتكون البذور التي تنمو إلى نباتات جديدة.", "1. (مستوى الدعم) صح أم خطأ: التلقيح والإخصاب عملية واحدة.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) لماذا تلقح الحشرات الأزهار الملونة ذات الرحيق والرائحة؟\n   الإجابة النموذجية: لأن الألوان والرائحة تجذبها، والرحيق غذاء لها.\n3. (المستوى المتقدم) وضّح كيف تنتقل حبوب اللقاح إلى مبيض الزهرة.\n   الإجابة النموذجية: تصل حبوب اللقاح إلى الميسم بالتلقيح، ثم تنتقل عبر القلم إلى المبيض حيث تتحد مع البويضات.", "للطالب: حل تمرين 2-5 بكتاب النشاط ص27، ومراجعة الفرق بين التلقيح والإخصاب. لولي الأمر: مشاهدة مقطع عن النحل والتلقيح مع الابن."]}], "combined": ["الحصة 1: مفهوم التلقيح\n1. يعرّف التلقيح بأنه نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه\n
