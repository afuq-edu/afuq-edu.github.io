const D = (window.AFUQ35||function(x){return x})([{"code": "1-1", "title": "البذور", "unit": 1, "dates": "الأسبوع الأول (6–10/9/2026م)", "sb": "16–17", "tb": "18–20", "ab": "تمرين 1-1 ص16، أوراق العمل 1-1أ ص50، 1-1ب ص52، 1-1ج ص53", "periods": [{"n": 1, "topic": "البذور والثمار: أين توجد البذور؟", "f": ["1. يحدد أن البذور توجد داخل الثمار\n2. يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها\nمخرج تعليمي آخر: يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات", "المخرج 1 (يحدد أن البذور توجد داخل الثمار): فهم\nالمخرج 2 (يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها): تحليل\nالمخرج الآخر (يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات): تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: ثمار حقيقية مقطوعة (تفاح، طماطم، خيار، بازلاء، أفوكادو)، سكين بلاستيكية، أطباق", "البذرة، الثمرة.", "يعرض المعلم تفاحة مقطوعة نصفين ويطرح سؤال الكتاب ص16: «هل سبق لك أن ابتلعت بذرة عند تناول التفاح أو البرتقال؟»، ثم يسأل: من أين تأتي البذور؟ وما فائدتها؟ ويدوّن إجابات الطلاب على السبورة لاستثمارها في الحصة.", "1. • التهيئة: يعرض المعلم التفاحة المقطوعة ويطرح سؤال الكتاب ص16 ويسجل الأفكار، والطلبة يجيبون ويذكرون ثمارًا تناولوها ووجدوا فيها بذورًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • استكشاف أماكن البذور: يوزع المعلم على المجموعات ثمارًا مقطوعة ويوجههم إلى تحديد موقع البذور في كل ثمرة، والطلبة يفحصون الثمار ويحددون موقع البذور ويقارنونها بصور الكتاب ص16 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عدد البذور وأحجامها: يطلب المعلم عدّ البذور في كل ثمرة وتسجيلها في جدول، ويقدّم ورقة العمل 1-1ب (إيجاد الأنماط ووضع التنبؤات) ص52، والطلبة يعدّون البذور ويملؤون الجدول ويستنتجون نمطًا: الثمرة ذات البذرة الواحدة تكون بذرتها كبيرة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تصحيح مفهوم الثمرة: يوضح المعلم أن الثمرة هي الجزء الذي يحمل البذور حتى لو لم تكن حلوة (اليقطين، الخيار، الطماطم)، وينبّه إلى عدم تناول الثمار البرية المجهولة، والطلبة يصنفون صورًا معروضة على السبورة الذكية إلى: ثمرة / ليست ثمرة، مع التعليل (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تطبيق من الكتاب: يوجه الطلاب إلى صور الصفحة 16 (التفاح، الأفوكادو، البازلاء، الجوز)، ويصف كل طالب موقع البذور وعددها في ثمرة من الصور (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يوزع المعلم بطاقة خروج: «سمِّ ثمرتين بهما بذور كثيرة وثمرة بها بذرة واحدة»، والطلبة يكتبون الإجابة ويسلمونها (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرفة) أين توجد البذور في النبات؟\n   الإجابة النموذجية: داخل الثمار.\n2. (مستوى التطبيق) كيف تختلف بذور التفاح عن بذرة الأفوكادو؟\n   الإجابة النموذجية: التفاح يحتوي على عدة بذور صغيرة في منتصف الثمرة، والأفوكادو يحتوي على بذرة واحدة كبيرة.\n3. (مستوى الاستدلال) هل الخيار ثمرة؟ فسّر إجابتك.\n   الإجابة النموذجية: نعم، لأنه يحتوي على بذور في داخله.", "1. (مستوى المعرفة) سمِّ ثمرة تحتوي على بذرة واحدة كبيرة.\n   الإجابة النموذجية: الأفوكادو (أو المانجو).\n2. (مستوى التطبيق) اذكر ثلاث ثمار تحتوي على عدد كبير من البذور.\n   الإجابة النموذجية: الطماطم، الخيار، البطيخ (أو أي أمثلة صحيحة).\n3. (مستوى الاستدلال) أردتَ معرفة عدد البذور في ثمار البرتقال، فهل يكفي فتح برتقالة واحدة؟ وضّح.\n   الإجابة النموذجية: لا يكفي؛ يجب فتح عدة ثمار من النوع نفسه وعدّ بذورها لأن العدد يختلف من ثمرة لأخرى، فالقياسات المتكررة تعطي نتيجة أدق.", "للطالب: قراءة كتاب الطالب ص16، وإكمال ورقة العمل 1-1ب ص52 في كتاب النشاط إن لم تُنجز في الصف. لولي الأمر: مشاركة الابن عدّ بذور ثمرتين من المنزل (مثل الطماطم والخيار) وتسجيل العدد لمناقشته في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=1"]}, {"n": 2, "topic": "تركيب البذرة", "f": ["1. يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء\n2. يوضح وظيفة كل جزء من أجزاء البذرة\nمخرج تعليمي آخر: يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا", "المخرج 1 (يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء): تذكر\nالمخرج 2 (يوضح وظيفة كل جزء من أجزاء البذرة): فهم\nالمخرج الآخر (يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذ ", "الحصة 1: البذور والثمار: أين توجد البذور؟\nالبذرة، الثمرة.\n\nالحصة 2: تركيب البذرة\nغلاف البذرة، الجنين، مخزون الغذاء، الندبة.", "الحصة 1: البذور والثمار: أين توجد البذور؟\nيعرض المعلم تفاحة مقطوعة نصفين ويطرح سؤال الكتاب ص16: «هل سبق لك أن ابتلعت بذرة عند تناول التفاح أو البرتقال؟»، ثم يسأل: من أين تأتي البذور؟ وما فائدتها؟ ويدوّن إجابات الطلاب على السبورة لاستثمارها في الحصة.\n\nالحصة 2: تركيب البذرة\nيسأل المعلم: أين توجد البذور؟ ثم يعرض بذرة فول جافة وشتلة فول صغيرة ويطرح سؤالًا مثيرًا: «كيف تستطيع هذه البذرة الصغيرة أن تصبح نباتًا كاملًا؟ ماذا تخبئ في داخلها؟».", "الحصة 1: البذور والثمار: أين توجد البذور؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم التفاحة المقطوعة ويطرح سؤال الكتاب ص16 ويسجل الأفكار، والطلبة يجيبون ويذكرون ثمارًا تناولوها ووجدوا فيها بذورًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • استكشاف أماكن البذور: يوزع المعلم على المجموعات ثمارًا مقطوعة ويوجههم إلى تحديد موقع البذور في كل ثمرة، والطلبة يفحصون الثمار ويحددون موقع البذور ويقارنونها بصور الكتاب ص16 (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عدد البذور وأحجامها: يطلب المعلم عدّ البذور في كل ثمرة وتسجيلها في جدول، ويقدّم ورقة العمل 1-1ب (إيجاد الأنماط ووضع التنبؤات) ص52، والطلبة يعدّون البذور ويملؤون الجدول ويستنتجون نمطًا: الثمرة ذات البذرة الواحدة تكون بذرتها كبيرة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تصحيح مفهوم الثمرة: يوضح المعلم أن الثمرة هي الجزء الذي يحمل البذور حتى لو لم تكن حلوة (اليقطين، الخيار، الطماطم)، وينبّه إلى عدم تناول الثمار البرية المجهولة، والطلبة يصنفون صورًا معروضة على السبورة الذكية إلى: ثمرة / ليست ثمرة، مع التعليل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • تطبيق من الكتاب: يوجه الطلاب إلى صور الصفحة 16 (التفاح، الأفوكادو، البازلاء، الجوز)، ويصف كل طالب موقع البذور وعددها في ثمرة من الصور (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. • الغلق: يوزع المعلم بطاقة خروج: «سمِّ ثمرتين بهما بذور كثيرة وثمرة بها بذرة واحدة»، والطلبة يكتبون الإجابة ويسلمونها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: تركيب البذرة — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم البذرة والشتلة ويطرح السؤال المثير، والطلبة يتوقعون ما في داخل البذرة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. • نمذجة الملاحظة والرسم: يعرض المعلم رسم بذرة الفول ص17 ويشرح الأجزاء، ويوضح طريقة استخدام العدسة المكبرة وقواعد الرسم العلمي (قلم رصاص، خطوط تسمية بالمسطرة)، والطلبة يتابعون ويحددون الأجزاء على الرسم (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تنفيذ نشاط 1-1: يوزع المعلم البذور المنقوعة والعدسات ويتابع المجموعات، والطلبة يفحصون البذرة، ويحددون الغلاف والندبة، وينزعون الغلاف بأظافرهم، ويفصلون الفلقتين، ويحددون الجنين ومخزون الغذاء (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • الرسم والتسمية: يتابع المعلم الرسومات ويقدم الدعم للطلاب الذين يواجهون صعوبة، والطلبة يرسمون البذرة ويسمون أجزاءها، ثم يتبادلون الرسومات لتقييم الأقران (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • أسئلة الكتاب ص17: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون: مخزون الغذاء يمد الجنين بالطاقة، والغلاف يحمي البذرة، وتحتاج للماء والدفء لتبدأ النمو (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. • الغلق: يلخص المعلم من خلال «ماذا تعلمت؟»، والطلبة يذكرون الأجزاء الثلاثة ووظائفها (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "الحصة 1: البذور والثمار: أين توجد البذور؟\n1. (مستوى المعرفة) أين توجد البذور في النبات؟\n   الإجابة النموذجية: داخل الثمار.\n2. (مستوى التطبيق) كيف تختلف بذور التفاح عن بذرة الأفوكادو؟\n   الإجابة النموذجية: التفاح يحتوي على عدة بذور صغيرة في منتصف الثمرة، والأفوكادو يحتوي على بذرة واحدة كبيرة.\n3. (مستوى الاستدلال) هل الخيار ثمرة؟ فسّر إجابتك.\n   الإجابة النموذجية: نعم، لأنه يحتوي على بذور في داخله.\n\nالحصة 2: تركيب البذرة\n1. (مستوى المعرفة) ما الجزء الذي ينمو ليصبح نباتًا جديدًا؟\n   الإجابة النموذجية: الجنين.\n2. (مستوى التطبيق) لماذا تحتاج البذرة إلى غلاف؟\n   الإجابة النموذجية: لحماية ما بداخل البذرة.\n3. (مستوى الاستدلال) لماذا تحتاج البذرة إلى مخزون الغذاء؟\n   الإجابة النموذجية: ليحصل الجنين على الطاقة اللازمة للنمو قبل أن تتكون أوراق تصنع الغذاء.", "الحصة 1: البذور والثمار: أين توجد البذور؟\n1. (مستوى المعرفة) سمِّ ثمرة تحتوي على بذرة واحدة كبيرة.\n   الإجابة النموذجية: الأفوكادو (أو المانجو).\n2. (مستوى التطبيق) اذكر ثلاث ثمار تحتوي على عدد كبير من البذور.\n   الإجابة النموذجية: الطماطم، الخيار، البطيخ (أو أي أمثلة صحيحة).\n3. (مستوى الاستدلال) أردتَ معرفة عدد البذور في ثمار البرتقال، فهل يكفي فتح برتقالة واحدة؟ وضّح.\n   الإجابة النموذجية: لا يكفي؛ يجب فتح عدة ثمار من النوع نفسه وعدّ بذورها لأن العدد يختلف من ثمرة لأخرى، فالقياسات المتكررة تعطي نتيجة أدق.\n\nالحصة 2: تركيب البذرة\n1. (مستوى المعرفة) أكمل: الغطاء الخارجي الذي يحمي البذرة يسمى ……\n   الإجابة النموذجية: غلاف البذرة.\n2. (مستوى التطبيق) سمِّ أجزاء بذرة الفول الثلاثة، واذكر وظيفة كل منها.\n   الإجابة النموذجية: الغلاف: يحمي البذرة. الجنين: ينمو إلى نبات جديد. مخزون الغذاء: يمد الجنين بالطاقة.\n3. (مستوى الاستدلال) بذرة تلف مخزون غذائها، ماذا تتوقع أن يحدث لجنينها عند زراعتها؟ فسّر.\n   الإجابة النموذجية: لن ينمو الجنين أو ينمو ضعيفًا؛ لأنه لا يجد الطاقة اللازمة للنمو في بدايته.", "الحصة 1: البذور والثمار: أين توجد البذور؟\nللطالب: قراءة كتاب الطالب ص16، وإكمال ورقة العمل 1-1ب ص52 في كتاب النشاط إن لم تُنجز في الصف. لولي الأمر: مشاركة الابن عدّ بذور ثمرتين من المنزل (مثل الطماطم والخيار) وتسجيل العدد لمناقشته في الحصة القادمة.\n\nالحصة 2: تركيب البذرة\nللطالب: حل تمرين 1-1 بكتاب النشاط ص16، وورقة العمل 1-1أ (ملاحظة ثمرة وبذورها ورسمها) ص50؛ والطلاب المتميزون: ورقة العمل 1-1ج (كم عدد البذور؟) ص53. لولي الأمر: متابعة رسم الابن لبذرة وتسمية أجزائها، ومساعدته في نقع بذرة فول ليلة كاملة لإحضارها في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=1"]}, {"code": "1-2", "title": "كيف تنمو البذور؟", "unit": 1, "dates": "الأسبوع الأول (6–10/9/2026م)", "sb": "18–19", "tb": "21–22", "ab": "تمرين 1-2 ص17", "periods": [{"n": 1, "topic": "الإنبات ومراحله", "f": ["1. يعرّف الإنبات\n2. يرتب مراحل إنبات بذرة الفول ترتيبًا صحيحًا\nمخرج تعليمي آخر: يفسر سبب ذبول البذرة وصغر حجمها بعد الإنبات", "المخرج 1 (يعرّف الإنبات): تذكر\nالمخرج 2 (يرتب مراحل إنبات بذرة الفول ترتيبًا صحيحًا): فهم\nالمخرج الآخر (يفسر سبب ذبول البذرة وصغر حجمها بعد الإنبات): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، صورة توضيحية، أخرى: بطاقات مصورة لمراحل الإنبات", "الإنبات، الجذر الأول، الساق الأول، الأوراق الأولية، يمتص، يذبل.", "يعرض المعلم بذرة فول جافة وصورة شتلة فول ويسأل: «ما الذي حدث للبذرة حتى أصبحت هكذا؟ وما الذي يجعلها تبدأ في النمو؟»، ويدوّن أفكار الطلاب في مخطط ذهني.", "1. • التهيئة: يعرض المعلم البذرة والشتلة ويبني مخططًا ذهنيًا بأفكار الطلاب، والطلبة يقترحون ما يحدث للبذرة لتنمو (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الإنبات: يقرأ المعلم مع الطلاب ص18 ويوضح أن البذرة تبدأ النمو عندما تتوافر الظروف الملائمة، وتستخدم مخزون الغذاء للطاقة، والطلبة يستخلصون تعريف الإنبات ويكتبونه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عرض مراحل الإنبات: يعرض المعلم مقطعًا مرئيًا لإنبات بذرة ويناقش رسم ص18: امتصاص الماء والانتفاخ، انفلاق الغلاف، الجذر الأول، الساق الأول، الأوراق الأولية، الجذور الجانبية، والطلبة يشاهدون ويصفون كل مرحلة واتجاه نمو الجذر والساق (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. • ترتيب البطاقات: يوزع المعلم بطاقات مراحل الإنبات مبعثرة على المجموعات، والطلبة يرتبون البطاقات ويعرضون ترتيبهم ويبررونه (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • بذور تنتظر سنوات: يناقش المعلم مثال بذور اللوتس ص18 (بذور عمرها 1300 عام نبتت)، والطلبة يستنتجون أن البذور تبقى حية حتى تتهيأ لها الظروف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يطرح المعلم سؤالًا ختاميًا: ما أول جزء يظهر من البذرة؟ والطلبة يجيبون ويرتبون المراحل شفهيًا (3 دقائق)\nالاستراتيجيات: العصف الذهني.", "1. (مستوى المعرفة) ما أول جزء يظهر من البذرة عند الإنبات؟\n   الإجابة النموذجية: الجذر الأول.\n2. (مستوى التطبيق) رتّب: ينمو الساق الأول – تمتص البذرة الماء – تبدأ الأوراق الأولية – يظهر الجذر الأول.\n   الإجابة النموذجية: تمتص البذرة الماء ← يظهر الجذر الأول ← ينمو الساق الأول ← تبدأ الأوراق الأولية.\n3. (مستوى الاستدلال) لماذا تذبل البذر ق البذور المنقوعة، مسطرة", "الحصة 1: الإنبات ومراحله\nالإنبات، الجذر الأول، الساق الأول، الأوراق الأولية، يمتص، يذبل.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\nالإنبات، يمتص، التنبؤ.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\nالإنبات، يمتص، الجذر الأول، الساق الأول.", "الحصة 1: الإنبات ومراحله\nيعرض المعلم بذرة فول جافة وصورة شتلة فول ويسأل: «ما الذي حدث للبذرة حتى أصبحت هكذا؟ وما الذي يجعلها تبدأ في النمو؟»، ويدوّن أفكار الطلاب في مخطط ذهني.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\nيراجع المعلم أجزاء البذرة سريعًا بلعبة «أشر إلى الجزء» على رسم البذرة ص17، ثم يسأل: «ماذا تتوقع أن يحدث لبذرة فول إذا تركناها في الماء طوال الليل؟».\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\nيطلب المعلم من كل مجموعة قراءة تنبؤها المكتوب أمس، ثم يسأل: «هل تظن أن تنبؤك سيتحقق؟ لنرى!».", "الحصة 1: الإنبات ومراحله — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم البذرة والشتلة ويبني مخططًا ذهنيًا بأفكار الطلاب، والطلبة يقترحون ما يحدث للبذرة لتنمو (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم الإنبات: يقرأ المعلم مع الطلاب ص18 ويوضح أن البذرة تبدأ النمو عندما تتوافر الظروف الملائمة، وتستخدم مخزون الغذاء للطاقة، والطلبة يستخلصون تعريف الإنبات ويكتبونه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • عرض مراحل الإنبات: يعرض المعلم مقطعًا مرئيًا لإنبات بذرة ويناقش رسم ص18: امتصاص الماء والانتفاخ، انفلاق الغلاف، الجذر الأول، الساق الأول، الأوراق الأولية، الجذور الجانبية، والطلبة يشاهدون ويصفون كل مرحلة واتجاه نمو الجذر والساق (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. • ترتيب البطاقات: يوزع المعلم بطاقات مراحل الإنبات مبعثرة على المجموعات، والطلبة يرتبون البطاقات ويعرضون ترتيبهم ويبررونه (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • بذور تنتظر سنوات: يناقش المعلم مثال بذور اللوتس ص18 (بذور عمرها 1300 عام نبتت)، والطلبة يستنتجون أن البذور تبقى حية حتى تتهيأ لها الظروف (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. • الغلق: يطرح المعلم سؤالًا ختاميًا: ما أول جزء يظهر من البذرة؟ والطلبة يجيبون ويرتبون المراحل شفهيًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد) — زمن الحصة 40 دقيقة\n\n1. • التهيئة: ينفذ المعلم لعبة «أشر إلى الجزء» ويطرح سؤال التنبؤ، والطلبة يشيرون إلى الأجزاء ويقدمون توقعات أولية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • ملاحظة البذرة الجافة: يوزع المعلم البذور والمساطر ويطلب وصفًا دقيقًا، والطلبة يقيسون طول البذرة ويصفون لونها وملمسها ويرسمونها (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. • كتابة التنبؤ: يرسم المعلم على السبورة جدولًا (قبل النقع / التنبؤ / بعد النقع)، والطلبة ينقلون الجدول ويكتب كل طالب تنبؤه مع سببه (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • إعداد النقع: يوجه المجموعات وفق خطوات نشاط 1-2 ص19، والطلبة يضعون البذرة في طبق به ماء ويكتبون اسم المجموعة عليه (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. • مناقشة: يسأل المعلم: من أين سيدخل الماء إلى البذرة؟ كيف سنعرف أن تنبؤنا صحيح؟ والطلبة يقترحون الندبة ويقترحون القياس والمقارنة غدًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. • الغلق: يذكّر المعلم بموعد الملاحظة في الحصة القادمة، والطلبة يرتبون الأدوات ويحفظون الأطباق في مكان آمن (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يستعرض المعلم التنبؤات المكتوبة، والطلبة يقرؤون تنبؤاتهم (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. • الملاحظة والقياس: يوجه المعلم إلى إخراج البذور وقياسها ولمسها، والطلبة يقيسون الطول ويصفون الملمس والشكل ويكملون عمود «بعد النقع» (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • المقارنة والتفسير: يسأل المعلم: هل دعمت الملاحظات تنبؤاتكم؟ لماذا انتفخت البذرة؟ والطلبة يقارنون ويفسرون: دخل الماء إلى البذرة فانتفخت ولانت (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة الكتاب ص19: يناقش المعلم الأسئلة (1–5)، والطلبة يجيبون: تمتص الماء لبدء الإنبات، الجذر الأول ينمو أولًا للأسفل لتثبيت النبات والحصول على الماء، الساق للأعلى نحو الضوء (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: الإنبات ومراحله\n1. (مستوى المعرفة) ما أول جزء يظهر من البذرة عند الإنبات؟\n   الإجابة النموذجية: الجذر الأول.\n2. (مستوى التطبيق) رتّب: ينمو الساق الأول – تمتص البذرة الماء – تبدأ الأوراق الأولية – يظهر الجذر الأول.\n   الإجابة النموذجية: تمتص البذرة الماء ← يظهر الجذر الأول ← ينمو الساق الأول ← تبدأ الأوراق الأولية.\n3. (مستوى الاستدلال) لماذا تذبل البذرة ويصغر حجمها بعد الإنبات؟\n   الإجابة النموذجية: لأن مخزون الغذاء فيها يُستهلك أثناء الإنبات.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\n1. (مستوى المعرفة) ماذا وضعنا مع بذرة الفول في الطبق؟\n   الإجابة النموذجية: ماءً.\n2. (مستوى التطبيق) اذكر تنبؤًا واحدًا لما سيحدث للبذرة بعد نقعها.\n   الإجابة النموذجية: تكبر/تنتفخ، أو تصبح لينة، أو يتجعد غلافها.\n3. (مستوى الاستدلال) كيف نتحقق من صحة تنبؤنا؟\n   الإجابة النموذجية: نقيس البذرة ونصفها بعد النقع ونقارن بالقياس قبل النقع.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\n1. (مستوى المعرفة) كيف أصبح ملمس البذرة بعد نقعها؟\n   الإجابة النموذجية: لينة (أكثر ليونة).\n2. (مستوى التطبيق) لماذا تحتاج البذور إلى امتصاص الماء؟\n   الإجابة النموذجية: لكي تبدأ عملية الإنبات.\n3. (مستوى الاستدلال) هل دعمت ملاحظاتك تنبؤك؟ وضّح كيف قررت ذلك.\n   الإجابة النموذجية: تقبل إجابة تقارن التنبؤ بالقياس الفعلي (مثل: تنبأت أنها ستكبر وزاد طولها من … إلى …).", "الحصة 1: الإنبات ومراحله\n1. (مستوى المعرفة) صح أم خطأ: ينمو الجذر الأول متجهًا إلى أعلى.\n   الإجابة النموذجية: خطأ؛ ينمو إلى الأسفل.\n2. (مستوى التطبيق) عرّف الإنبات.\n   الإجابة النموذجية: بدء البذرة في النمو عندما تتوافر لها الظروف الملائمة.\n3. (مستوى الاستدلال) نبتت بذور لوتس عمرها 1300 عام، ماذا يدل ذلك؟\n   الإجابة النموذجية: أن البذور يمكن أن تبقى حية دون إنبات مدة طويلة حتى تتهيأ لها الظروف الملائمة.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\n1. (مستوى المعرفة) ما الأداة التي نقيس بها طول البذرة؟\n   الإجابة النموذجية: المسطرة.\n2. (مستوى التطبيق) لماذا قسنا البذرة قبل نقعها؟\n   الإجابة النموذجية: لنقارن قياسها بعد النقع ونعرف التغير الذي حدث.\n3. (مستوى الاستدلال) كيف تجعل نتيجة هذا النشاط أكثر موثوقية؟\n   الإجابة النموذجية: بنقع عدد من البذور بدل بذرة واحدة وقياسها جميعًا.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\n1. (مستوى المعرفة) صح أم خطأ: يزداد حجم البذرة بعد نقعها في الماء.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) إلى أي اتجاه ينمو الساق الأول؟ ولماذا؟\n   الإجابة النموذجية: إلى أعلى؛ ليشق التربة ويصل إلى الضوء.\n3. (مستوى الاستدلال) لماذا تبدأ الأوراق الجديدة النمو فوق سطح التربة؟\n   الإجابة النموذجية: لأنها تحتاج إلى الضوء لتصنع غذاء النبات.", "الحصة 1: الإنبات ومراحله\nللطالب: قراءة كتاب الطالب ص18 ومراجعة مفردات (الإنبات، يذبل، يمتص)، وإحضار بذرة فول جافة للحصة القادمة. لولي الأمر: مشاهدة إنبات بذرة مع الابن (مقطع مرئي أو بذرة في قطن مبلل) ومساعدته على وصف المراحل.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\nللطالب: الاحتفاظ بجدول التنبؤ، وقراءة نشاط 1-2 ص19 في كتاب الطالب. لولي الأمر: تكرار التجربة في المنزل بنقع بذرتي فول أو حمص ليلة كاملة وملاحظتهما مع الابن صباحًا.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\nللطالب: حل تمرين 1-2 بكتاب النشاط ص17 (ترتيب صور مراحل الإنبات)، ومراجعة إجابات أسئلة ص19. لولي الأمر: مناقشة الابن في سبب انتفاخ البقوليات عند نقعها قبل الطهي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=2"]}, {"code": "1-3", "title": "استقصاء عملية الإنبات", "unit": 1, "dates": "الأسبوع الثاني (13–17/9/2026م)", "sb": "20–21", "tb": "22–24", "ab": "تمرين 1-3 ص18، ورقة العمل 1-3 ص55", "periods": [{"n": 1, "topic": "نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟", "f": ["1. يذكر ما تحتاجه البذور لكي تنبت\n2. ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات\nمخرج تعليمي آخر: يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء", "المخرج 1 (يذكر ما تحتاجه البذور لكي تنبت): تذكر\nالمخرج 2 (ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات): تطبيق\nالمخرج الآخر (يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: 20 بذرة صغيرة (عدس أو ماش)، مناديل ورقية، طبقان، كيسان بلاستيكيان، ماصة، رباط مطاطي، ماء", "الظروف الملائمة، الإنبات، الاختبار العادل.", "يعرض المعلم صورة الطالبات ص20 ويقرأ تساؤلاتهن: «هل يمكن أن تنبت البذور بدون ماء أو ضوء؟ هل تنبت في جو حار جدًا أو بارد جدًا؟»، ثم يبني مع الطلاب مخططًا ذهنيًا لما تحتاجه البذور.", "1. • التهيئة: يعرض المعلم الصورة ويطرح التساؤلات، والطلبة يقدمون أفكارهم حول احتياجات البذور (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مخطط ذهني: يناقش المعلم العوامل اللازمة لنمو الإنسان والحيوان ثم البذور، ويدوّنها في مخطط ذهني، والطلبة يقترحون: ماء، دفء، هواء، ضوء… ويصنفونها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تنفيذ نشاط 1-3أ: يوجه المجموعات خطوة بخطوة وفق ص20، ويوضح طريقة شفط الهواء بالماصة وإحكام الكيس، والطلبة يضعون 10 بذور على منديل رطب في كل طبق، ويغطونهما، ويضعونهما في كيسين، ويشفطون الهواء من أحدهما ويغلقون الآخر وفيه الهواء (15 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. • التنبؤ وضبط المتغيرات: يسأل المعلم: ما الشيء الوحيد المختلف بين الكيسين؟ وما الأشياء المتساوية؟ والطلبة يسجلون تنبؤهم ويحددون المتغير (الهواء) والثوابت (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • حفظ الأدوات: يحدد المعلم مكانًا دافئًا واحدًا للكيسين، ويذكّر بقواعد السلامة، والطلبة يضعون الكيسين في المكان المحدد وينظفون أماكنهم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يسأل المعلم: متى نتحقق من النتائج؟ والطلبة يذكرون أن الملاحظة بعد يومين (3 دقائق)\nالاستراتيجيات: العصف الذهني.", "1. (مستوى المعرفة) ما الشيء الذي أزلناه من أحد الكيسين؟\n   الإجابة النموذجية: الهواء.\n2. (مستوى التطبيق) ما الأشياء التي جعلناها متساوية في الكيسين؟\n   الإجابة النموذجية: عدد البذور، ونوعها، والمناديل الرطبة، والمكان الدافئ.\n3. (مستوى الاستدلال) لماذا وضعنا كيسًا ثانيًا فيه هواء؟\n   الإجابة النموذجية: للمقارنة؛ حتى نعرف أن الفرق في النتائج سببه الهواء فقط (اختبار عادل).", "1. (مستوى المعرفة) صح أم خطأ: نستخدم الماصة لشفط الهواء من الكيس.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ: في أي الكيسين ستنبت البذور؟\n   الإجابة النموذجية: في الكيس الذي يحتوي على الهواء.\n3. (مستوى الاستدلال) لماذا وضعنا الكيسين في المكان الدافئ نفسه؟\n   الإجابة النموذجية: حتى يكون الاختبار عادلًا ولا يؤثر اختلاف الدفء في النتيجة.", "للطالب: قراءة كتاب الطالب ص20، وكتابة ثلاثة أسئلة يريد معرفة إجابتها عن إنبات البذور. لولي الأمر: تذكير الابن بإحضار تربة جافة وعلب زجاجية فارغة (إن أمكن) لنشاط الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=3"]}, {"n": 2, "topic": "نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)", "f": ["1. يخطط لاستقصاء أثر الماء والدفء في إنبات البذور\n2. يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل\nمخرج تعليمي آخر: يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام", "المخرج 1 (يخطط لاستقصاء أثر الماء والدفء في إنبات البذور): تطبيق\nالمخرج 2 (يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل): تحليل\nالمخرج الآخر (يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام): إبداع", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: 4 علب زجاجية، 20 بذرة، تربة جافة، مخبار مدرج، ماء، ملصقات أرقام", "الاختبار العادل، الظروف الملائمة، المتغير.", "يسأل المعلم عن كيس البذور (1-3أ) وما يتوقعون رؤيته، ثم يطرح مشكلة: «مزارع زرع بذورًا في الشتاء البارد ولم تنبت، وزرعها جاره في تربة جافة ولم تنبت أيضًا. ما السبب؟ وكيف نتأكد؟».", "1. • التهيئة: يطرح المعلم مشكلة المزارع، والطلبة يقترحون أسبابًا: البرد، الجفاف (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • قراءة النشاط: يقرأ المعلم خطوات نشاط 1-3ب ص21 ويحدد الهدف، والطلبة يحددون ما سيختبرونه: الماء والدفء (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد العلب الأربع: يتابع المعلم الترقيم وتساوي كمية التربة، ويقيس الماء بالمخبار، والطلبة يرقمون العلب 1–4، ويملؤونها بتربة متساوية، ويضعون 5 بذور ظاهرة على جوانب كل علبة، ويرطبون 1 و2، ويضعون 1 و3 في مكان دافئ و2 و4 في مكان بارد (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • تصميم جدول التسجيل: يناقش المعلم أعمدة الجدول (رقم العلبة، الظروف، عدد البذور النابتة في كل يوم ملاحظة)، والطلبة يرسمون الجدول في دفاترهم (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • مناقشة الاختبار العادل: يناقش المعلم السؤالين (1) و(2ج) ص21، والطلبة يذكرون كيف يكون الاختبار عادلًا ولماذا 40 بذرة أفضل من 20 (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يوزع المعلم أدوار الترطيب والملاحظة كل يومين، والطلبة يسجلون أدوارهم (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما رقما العلبتين اللتين رطّبنا تربتهما؟\n   الإجابة النموذجية: العلبتان 1 و2.\n2. (مستوى التطبيق) ما العاملان اللذان نختبرهما في هذا الاستقصاء؟\n   الإجابة النموذجية: الماء والدفء.\n3. (مستوى الاستدلال) لماذا تكون النتائج أفضل إذا استخدمنا 40 بذرة بدلًا من 20؟\n   الإجابة النموذجية: لأن العدد الأكبر يعطي أدلة أكثر ونتائج أكثر موثوقية.", "1. (مستوى المعرفة) أين وضعنا العلبتين 2 و4؟\n   الإجابة النموذجية: في مكان بارد.\n2. (مستوى التطبيق) كيف نتأكد أن اختبارنا عادل؟\n   الإجابة النموذجية: نستخدم الكمية نفسها من التربة، والعدد والنوع نفسيهما من البذور، والكمية نفسها من الماء للعلب المرطبة، ونغير عاملًا واحدًا فقط في كل مقارنة.\n3. (مستوى الاستدلال) هل يوضح هذا الاستقصاء ما إذا كانت البذور تحتاج إلى الهواء؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن جميع العلب تحتوي على الهواء، فلا توجد علبة بلا هواء للمقارنة.", "للطالب: متابعة ترطيب العلبتين 1 و2 حسب الجدول، وتسجيل الملاحظات كل يومين مدة ثمانية أيام. لولي الأمر: سؤال الابن يوميًا عن ملاحظاته على البذور وتشجيعه على الدقة في التسجيل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=3"]}, {"n": 3, "topic": "تحليل نتائج الإنبات والاستنتاج", "f": ["1. يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء\n2. يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء\nمخرج تعليمي آخر: يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات", "المخرج 1 (يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء): تحليل\nالمخرج 2 (يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء): فهم\nالمخرج الآخر (يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات): إبداع", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، ب ة للإنبات (التخطيط والإعداد)\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nالتعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: 20 بذرة صغيرة (عدس أو ماش)، مناديل ورقية، طبقان، كيسان بلاستيكيان، ماصة، رباط مطاطي، ماء\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nالكتاب، السبورة الذكية، الأقلام، أخرى: 4 علب زجاجية، 20 بذرة، تربة جافة، مخبار مدرج، ماء، ملصقات أرقام\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: كيسا نشاط 1-3أ، عدسة مكبرة", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالظروف الملائمة، الإنبات، الاختبار العادل.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nالاختبار العادل، الظروف الملائمة، المتغير.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nالإنبات، الظروف الملائمة، الاستنتاج.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nيعرض المعلم صورة الطالبات ص20 ويقرأ تساؤلاتهن: «هل يمكن أن تنبت البذور بدون ماء أو ضوء؟ هل تنبت في جو حار جدًا أو بارد جدًا؟»، ثم يبني مع الطلاب مخططًا ذهنيًا لما تحتاجه البذور.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nيسأل المعلم عن كيس البذور (1-3أ) وما يتوقعون رؤيته، ثم يطرح مشكلة: «مزارع زرع بذورًا في الشتاء البارد ولم تنبت، وزرعها جاره في تربة جافة ولم تنبت أيضًا. ما السبب؟ وكيف نتأكد؟».\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nيحضر المعلم كيسي نشاط 1-3أ مغلقين ويطلب من الطلاب تذكّر تنبؤاتهم قبل فتحهما وملاحظة البذور.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويطرح التساؤلات، والطلبة يقدمون أفكارهم حول احتياجات البذور (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مخطط ذهني: يناقش المعلم العوامل اللازمة لنمو الإنسان والحيوان ثم البذور، ويدوّنها في مخطط ذهني، والطلبة يقترحون: ماء، دفء، هواء، ضوء… ويصنفونها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تنفيذ نشاط 1-3أ: يوجه المجموعات خطوة بخطوة وفق ص20، ويوضح طريقة شفط الهواء بالماصة وإحكام الكيس، والطلبة يضعون 10 بذور على منديل رطب في كل طبق، ويغطونهما، ويضعونهما في كيسين، ويشفطون الهواء من أحدهما ويغلقون الآخر وفيه الهواء (15 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. • التنبؤ وضبط المتغيرات: يسأل المعلم: ما الشيء الوحيد المختلف بين الكيسين؟ وما الأشياء المتساوية؟ والطلبة يسجلون تنبؤهم ويحددون المتغير (الهواء) والثوابت (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. • حفظ الأدوات: يحدد المعلم مكانًا دافئًا واحدًا للكيسين، ويذكّر بقواعد السلامة، والطلبة يضعون الكيسين في المكان المحدد وينظفون أماكنهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. • الغلق: يسأل المعلم: متى نتحقق من النتائج؟ والطلبة يذكرون أن الملاحظة بعد يومين (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد) — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم مشكلة المزارع، والطلبة يقترحون أسبابًا: البرد، الجفاف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • قراءة النشاط: يقرأ المعلم خطوات نشاط 1-3ب ص21 ويحدد الهدف، والطلبة يحددون ما سيختبرونه: الماء والدفء (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. • إعداد العلب الأربع: يتابع المعلم الترقيم وتساوي كمية التربة، ويقيس الماء بالمخبار، والطلبة يرقمون العلب 1–4، ويملؤونها بتربة متساوية، ويضعون 5 بذور ظاهرة على جوانب كل علبة، ويرطبون 1 و2، ويضعون 1 و3 في مكان دافئ و2 و4 في مكان بارد (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • تصميم جدول التسجيل: يناقش المعلم أعمدة الجدول (رقم العلبة، الظروف، عدد البذور النابتة في كل يوم ملاحظة)، والطلبة يرسمون الجدول في دفاترهم (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. • مناقشة الاختبار العادل: يناقش المعلم السؤالين (1) و(2ج) ص21، والطلبة يذكرون كيف يكون الاختبار عادلًا ولماذا 40 بذرة أفضل من 20 (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. • الغلق: يوزع المعلم أدوار الترطيب والملاحظة كل يومين، والطلبة يسجلون أدوارهم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الكيسين ويستدعي التنبؤات، والطلبة يتذكرون تنبؤاتهم (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. • نتائج نشاط 1-3أ: يوجه المعلم إلى ملاحظة البذور في الكيسين بالعدسة، والطلبة يلاحظون إنبات البذور في الكيس الذي به هواء وعدم إنباتها في الكيس الخالي، ويستنتجون حاجتها للهواء (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • تحليل بيانات: يقدم المعلم تمرين 1-3 بكتاب النشاط ص18 (بذور وُضعت في أماكن مختلفة)، والطلبة يحللون البيانات ويحددون الأماكن التي توافرت فيها ظروف الإنبات (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة الكتاب ص21: يناقش المعلم الأسئلة (3، 4، 5أ)، والطلبة يستنتجون: البذور تحتاج إلى ماء ودفء وهواء ولا تحتاج إلى ضوء (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تخطيط اختبار الضوء: يطلب المعلم تخطيطًا مختصرًا للسؤال (5ب)، والطلبة يقترحون علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء بالدفء نفسه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. (مستوى المعرفة) ما الشيء الذي أزلناه من أحد الكيسين؟\n   الإجابة النموذجية: الهواء.\n2. (مستوى التطبيق) ما الأشياء التي جعلناها متساوية في الكيسين؟\n   الإجابة النموذجية: عدد البذور، ونوعها، والمناديل الرطبة، والمكان الدافئ.\n3. (مستوى الاستدلال) لماذا وضعنا كيسًا ثانيًا فيه هواء؟\n   الإجابة النموذجية: للمقارنة؛ حتى نعرف أن الفرق في النتائج سببه الهواء فقط (اختبار عادل).\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\n1. (مستوى المعرفة) ما رقما العلبتين اللتين رطّبنا تربتهما؟\n   الإجابة النموذجية: العلبتان 1 و2.\n2. (مستوى التطبيق) ما العاملان اللذان نختبرهما في هذا الاستقصاء؟\n   الإجابة النموذجية: الماء والدفء.\n3. (مستوى الاستدلال) لماذا تكون النتائج أفضل إذا استخدمنا 40 بذرة بدلًا من 20؟\n   الإجابة النموذجية: لأن العدد الأكبر يعطي أدلة أكثر ونتائج أكثر موثوقية.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\n1. (مستوى المعرفة) هل نبتت البذور في الكيس الخالي من الهواء؟\n   الإجابة النموذجية: لا.\n2. (مستوى التطبيق) اذكر ثلاثة أشياء تحتاجها البذور لتنبت.\n   الإجابة النموذجية: الماء، والدفء، والهواء.\n3. (مستوى الاستدلال) هل تحتاج البذور إلى الضوء لتنبت؟ كيف تتحقق من ذلك؟\n   الإجابة النموذجية: لا تحتاج؛ نتحقق بوضع علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء مع تثبيت الماء والدفء ونقارن الإنبات.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. (مستوى المعرفة) صح أم خطأ: نستخدم الماصة لشفط الهواء من الكيس.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ: في أي الكيسين ستنبت البذور؟\n   الإجابة النموذجية: في الكيس الذي يحتوي على الهواء.\n3. (مستوى الاستدلال) لماذا وضعنا الكيسين في المكان الدافئ نفسه؟\n   الإجابة النموذجية: حتى يكون الاختبار عادلًا ولا يؤثر اختلاف الدفء في النتيجة.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\n1. (مستوى المعرفة) أين وضعنا العلبتين 2 و4؟\n   الإجابة النموذجية: في مكان بارد.\n2. (مستوى التطبيق) كيف نتأكد أن اختبارنا عادل؟\n   الإجابة النموذجية: نستخدم الكمية نفسها من التربة، والعدد والنوع نفسيهما من البذور، والكمية نفسها من الماء للعلب المرطبة، ونغير عاملًا واحدًا فقط في كل مقارنة.\n3. (مستوى الاستدلال) هل يوضح هذا الاستقصاء ما إذا كانت البذور تحتاج إلى الهواء؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن جميع العلب تحتوي على الهواء، فلا توجد علبة بلا هواء للمقارنة.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\n1. (مستوى المعرفة) أكمل: تنبت البذور عندما تتوافر لها الظروف ……\n   الإجابة النموذجية: الملائمة.\n2. (مستوى التطبيق) لماذا تنبت معظم البذور في فصل الربيع؟\n   الإجابة النموذجية: لتوافر الدفء والرطوبة (الماء) والهواء.\n3. (مستوى الاستدلال) نبتت بذور في درج مظلم دافئ ولم تنبت بذور في المجمّد، ماذا تستنتج؟\n   الإجابة النموذجية: الضوء غير لازم للإنبات، بينما الدفء لازم.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nللطالب: قراءة كتاب الطالب ص20، وكتابة ثلاثة أسئلة يريد معرفة إجابتها عن إنبات البذور. لولي الأمر: تذكير الابن بإحضار تربة جافة وعلب زجاجية فارغة (إن أمكن) لنشاط الحصة القادمة.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nللطالب: متابعة ترطيب العلبتين 1 و2 حسب الجدول، وتسجيل الملاحظات كل يومين مدة ثمانية أيام. لولي الأمر: سؤال الابن يوميًا عن ملاحظاته على البذور وتشجيعه على الدقة في التسجيل.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nللطالب: حل تمرين 1-3 بكتاب النشاط ص18، والطلاب المتميزون: ورقة العمل 1-3 (تخطيط استقصاء حول نمو البذور) ص55، مع الاستمرار في متابعة علب نشاط 1-3ب. لولي الأمر: مناقشة الابن في سبب زراعة المحاصيل في مواسم محددة من السنة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=3"]}, {"code": "1-4", "title": "ماذا يحتاج النبات كي ينمو؟", "unit": 1, "dates": "الأسبوع الثاني (13–17/9/2026م)", "sb": "22–23", "tb": "25–26", "ab": "تمرين 1-4 ص20، ورقة العمل 1-4 ص57", "periods": [{"n": 1, "topic": "العوامل اللازمة لنمو النبات", "f": ["1. يذكر العوامل التي يحتاجها النبات لينمو: الطاقة الضوئية والهواء والماء والدفء\n2. يوضح أهمية كل عامل من عوامل نمو النبات\nمخرج تعليمي آخر: يقارن بين نبات صحي ونبات ذابل ويحدد العامل الناقص", "المخرج 1 (يذكر العوامل التي يحتاجها النبات لينمو: الطاقة الضوئية والهواء والماء والدفء): تذكر\nالمخرج 2 (يوضح أهمية كل عامل من عوامل نمو النبات): فهم\nالمخرج الآخر (يقارن بين نبات صحي ونبات ذابل ويحدد العامل الناقص): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: أصيص نبات صحي وأصيص نبات ذابل، بطاقات حالات نباتات", "العوامل، الطاقة الضوئية.", "يعرض المعلم صورة النباتين (1) و(2) ص22 أو أصيصين حقيقيين، ويسأل: «أي النباتين ينمو جيدًا؟ ماذا ينقص الآخر في رأيك؟».", "1. • التهيئة: يعرض المعلم النباتين ويطرح السؤال، والطلبة يقارنون ويقترحون العامل الناقص (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • العوامل الأربعة: يقدم المعلم مفهوم العوامل ويعلّم اختصار «ضهمد» (ضوء، هواء، ماء، دفء)، والطلبة يرددون الاختصار ويربطونه بإنبات البذور في الدرس السابق (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • أهمية كل عامل: يقرأ المعلم مع الطلاب ص22: الماء يقوي الساق والأوراق وينقل الغذاء، والدفء يناسب النمو، والضوء طاقة لصنع نقارن نتائج أشياء (نباتات) مختلفة.\n3. (مستوى الاستدلال) تنبأ بطول نبات في بيت زجاجي يحصل على كمية كافية من الماء، وفسّر تنبؤك.\n   الإجابة النموذجية: أطول من 25 cm تقريبًا؛ لتوافر الضوء والدفء والماء والهواء.", "الحصة 1: العوامل اللازمة لنمو النبات\nللطالب: قراءة كتاب الطالب ص22، ومراجعة جدول نشاط 1-4 ص23 استعدادًا لرسم التمثيل البياني. لولي الأمر: إحضار ورقة مربعات ومسطرة، وملاحظة نبات في المنزل أو الحي مع الابن ووصف حالته.\n\nالحصة 2: نشاط 1-4: التمثيل البياني بالأعمدة لنمو النبات\nللطالب: حل تمرين 1-4 بكتاب النشاط ص20، وإكمال ورقة العمل 1-4 (ارسم تمثيلًا بيانيًا بالأعمدة وصورة عن نمو النبات) ص57. لولي الأمر: متابعة دقة الأعمدة واستخدام المسطرة في الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=4"]}, {"code": "1-5", "title": "النبات والضوء", "unit": 1, "dates": "الأسبوع الثالث (20–24/9/2026م)", "sb": "24–25", "tb": "27–30", "ab": "تمرين 1-5 ص21، ورقة العمل 1-5 ص59", "periods": [{"n": 1, "topic": "نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)", "f": ["1. يخطط لاستقصاء تأثير الضوء على نمو النبات مع تثبيت العوامل الأخرى\n2. يقيس طول النبتة ويعدّ أوراقها ويسجلها بدقة\nمخرج تعليمي آخر: يتنبأ بنمو كل نبتة ويعلل تنبؤه بالمعرفة العلمية", "المخرج 1 (يخطط لاستقصاء تأثير الضوء على نمو النبات مع تثبيت العوامل الأخرى): تطبيق\nالمخرج 2 (يقيس طول النبتة ويعدّ أوراقها ويسجلها بدقة): تطبيق\nالمخرج الآخر (يتنبأ بنمو كل نبتة ويعلل تنبؤه بالمعرفة العلمية): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: أصيصا زرع متشابهان، خزانة مظلمة، مخبار مدرج، مسطرة، قلم تخطيط، ماء", "الطاقة الضوئية، الاختبار العادل، التنبؤ.", "يسأل المعلم عن اختصار «ضهمد»، ثم يطرح سؤالًا: «إذا أردنا أن نثبت أن الضوء ضروري لنمو النبات، هل يكفي أن نضع نبتة واحدة في الضوء ونقيس نموها؟».", "1. • التهيئة: يراجع المعلم «ضهمد» ويطرح السؤال، والطلبة يناقشون ويقترحون الحاجة إلى نبتتين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • لماذا نبتتان؟: يوضح المعلم فكرة المقارنة: نبتة في الضوء وأخرى في الظلام، مع تثبيت الماء ونوع النبات وحجمه، والطلبة يحددون المتغير (الضوء) والعوامل الثابتة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد النشاط: يوجه المعلم وفق ص24: خط مرجعي عند قاعدة الساق، قياس الطول، عدّ الأوراق، الري بالكمية نفسها، والطلبة يقيسون ويسجلون، ويضعون النبتة (أ) عند النافذة و(ب) في الخزانة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول وتنبؤ: يعرض المعلم جدول ص24 (الطول، عدد الأوراق، لون الساق والأوراق، الشكل العام)، والطلبة ينسخون الجدول ويكتبون تنبؤاتهم (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • خطة المتابعة: يوزع المعلم مهام القياس والري كل أربعة أيام مدة ثلاثة أسابيع، والطلبة يسجلون مواعيد المتابعة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يسأل المعلم عن العامل المتغير، والطلبة يجيبون: الضوء (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) أين وضعنا النبتة (ب)؟\n   الإجابة النموذجية: في خزانة مظلمة.\n2. (مستوى التطبيق) ما العوامل التي جعلناها متساوية للنبتتين؟\n   الإجابة النموذجية: كمية الماء، ونوع النبات وحجمه، وحجم الأصيص.\n3. (مستوى الاستدلال) لماذا رسمنا خطًا عند قاعدة النبتة قبل القياس؟\n   الإجابة النموذجية: ليكون نقطة مرجعية ثابتة نقيس منها في كل مرة.", "1. (مستوى المعرفة) ما الأداة التي نقيس بها كمية ماء الري؟\n   الإجابة النموذجية: المخبار المدرج.\n2. (مستوى التطبيق) ما العامل الذي نغيّره في هذا الاستقصاء؟\n   الإجابة النموذجية: الضوء.\n3. (مستوى الاستدلال) لماذا نكرر القياس كل أربعة أيام بدل قياس واحد في النهاية؟\n   الإجابة النموذجية: لنتابع التغير بمرور الزمن ونحصل على نتائج أدق وأكثر موثوقية.", "للطالب: قراءة كتاب الطالب ص24، والمشاركة في متابعة القياس والري حسب الجدول. لولي الأمر: تنفيذ تجربة مماثلة في المنزل بنبتتين صغيرتين (إن أمكن) ومتابعة الفرق مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=5"]}, {"n": 2, "topic": "اختيار التمثيل البياني: الأعمدة أم الخطي؟", "f": ["1. يميز متى يستخدم التمثيل البياني بالأعمدة ومتى يستخدم التمثيل الخطي\n2. يمثل تغير طول النبتة بمرور الزمن بتمثيل خطي\nمخرج تعليمي آخر: يحلل نتائج نمو النبات من تمثيل بياني معطى", "المخرج 1 (يميز متى يستخدم التمثيل البياني بالأعمدة ومتى يستخدم التمثيل الخطي): فهم\nالمخرج 2 (يمثل تغير طول النبتة بمرور الزمن بتمثيل خطي): تطبيق\nالمخرج الآخر (يحلل نتائج نمو النبات من تمثيل بياني معطى): تحليل", "التعلم بالنمذجة، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مربعات، مسطرة، أصيصا النشاط 1-5", "التمثيل البياني بالأعمدة، التمثيل الخطي، الزمن.", "يبدأ المعلم بتسجيل قياسات اليوم للنبتتين (أ) و(ب) في الجدول، ثم يسأل: «كيف نعرض تغيّر طول النبتة يومًا بعد يوم في رسم واحد؟».", "1. • التهيئة: يشرف المعلم على تسجيل قياسات اليوم ويطرح السؤال، والطلبة يقيسون ويسجلون (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • الأعمدة أم الخطي: يعرض المعلم أمثلة مهارات الاستقصاء ص64–65: عدد بذور الثمار (أعمدة)، وتبريد الماء بمرور الزمن (خطي)، والطلبة يستنتجون قاعدة الاختيار (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • نمذجة التمثيل الخطي: يرسم المعلم بيانات تبريد الماء ص65 خطوة بخطوة (المحاور، المقياس، النقاط، التوصيل)، والطلبة يرسمون معه في دفاترهم (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • ورقة العمل 1-5: يقدم المعلم ورقة العمل 1-5 (تحليل النتائج حول نمو النبات) ص59، والطلبة يحللون البيانات ويجيبون عن الأسئلة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يسأل المعلم: أي تمثيل سنستخدم لنتائج نشاط 1-5؟ ولماذا؟ والطلبة يجيبون: الخطي لأن الطول يتغير بمرور الزمن (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "1. (مستوى المعرفة) أي تمثيل نستخدم لعرض تغير طول النبتة بمرور الزمن؟\n   الإجابة النموذجية: التمثيل الخطي.\n2. (مستوى التطبيق) في مثال ص65 كم أصبحت درجة حرارة الماء بعد 6 دقائق؟\n   الإجابة النموذجية: 20°C.\n3. (مستوى الاستدلال) لماذا نرسم خطي النبتتين (أ) و(ب) على المحورين نفسيهما؟\n   الإجابة النموذجية: لتسهل المقارنة بين نموهما.", "1. (مستوى المعرفة) صح أم خطأ: نستخدم الأعمدة لعرض عدد بذور ثمار مختلفة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ماذا نضع على المحور الأفقي عند تمثيل نمو النبتة؟\n   الإجابة النموذجية: الزمن (التاريخ أو الأيام).\n 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\nيسأل المعلم عن اختصار «ضهمد»، ثم يطرح سؤالًا: «إذا أردنا أن نثبت أن الضوء ضروري لنمو النبات، هل يكفي أن نضع نبتة واحدة في الضوء ونقيس نموها؟».\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\nيبدأ المعلم بتسجيل قياسات اليوم للنبتتين (أ) و(ب) في الجدول، ثم يسأل: «كيف نعرض تغيّر طول النبتة يومًا بعد يوم في رسم واحد؟».\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\nيضع المعلم الأصيصين (أ) و(ب) أمام الطلاب ويسأل: «ما الفرق الذي تلاحظونه الآن بعد المتابعة؟ هل تحقق تنبؤكم؟».", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد) — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يراجع المعلم «ضهمد» ويطرح السؤال، والطلبة يناقشون ويقترحون الحاجة إلى نبتتين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • لماذا نبتتان؟: يوضح المعلم فكرة المقارنة: نبتة في الضوء وأخرى في الظلام، مع تثبيت الماء ونوع النبات وحجمه، والطلبة يحددون المتغير (الضوء) والعوامل الثابتة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد النشاط: يوجه المعلم وفق ص24: خط مرجعي عند قاعدة الساق، قياس الطول، عدّ الأوراق، الري بالكمية نفسها، والطلبة يقيسون ويسجلون، ويضعون النبتة (أ) عند النافذة و(ب) في الخزانة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول وتنبؤ: يعرض المعلم جدول ص24 (الطول، عدد الأوراق، لون الساق والأوراق، الشكل العام)، والطلبة ينسخون الجدول ويكتبون تنبؤاتهم (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • خطة المتابعة: يوزع المعلم مهام القياس والري كل أربعة أيام مدة ثلاثة أسابيع، والطلبة يسجلون مواعيد المتابعة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. • الغلق: يسأل المعلم عن العامل المتغير، والطلبة يجيبون: الضوء (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يشرف المعلم على تسجيل قياسات اليوم ويطرح السؤال، والطلبة يقيسون ويسجلون (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • الأعمدة أم الخطي: يعرض المعلم أمثلة مهارات الاستقصاء ص64–65: عدد بذور الثمار (أعمدة)، وتبريد الماء بمرور الزمن (خطي)، والطلبة يستنتجون قاعدة الاختيار (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • نمذجة التمثيل الخطي: يرسم المعلم بيانات تبريد الماء ص65 خطوة بخطوة (المحاور، المقياس، النقاط، التوصيل)، والطلبة يرسمون معه في دفاترهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • ورقة العمل 1-5: يقدم المعلم ورقة العمل 1-5 (تحليل النتائج حول نمو النبات) ص59، والطلبة يحللون البيانات ويجيبون عن الأسئلة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. • الغلق: يسأل المعلم: أي تمثيل سنستخدم لنتائج نشاط 1-5؟ ولماذا؟ والطلبة يجيبون: الخطي لأن الطول يتغير بمرور الزمن (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الأصيصين، والطلبة يصفون الفروق في الطول واللون وعدد الأوراق (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • مقارنة النبتتين: يوجه المعلم لاستكمال الجدول وتمثيل الأطوال خطيًا، والطلبة يلاحظون أن (ب) طويلة نحيفة باهتة صفراء، و(أ) خضراء قوية (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة الكتاب ص25: يناقش المعلم الأسئلة (1–4)، والطلبة يجيبون: (أ) نمت أفضل، يقيسون بالمسطرة وعدّ الأوراق، الاختبار عادل لثبات العوامل عدا الضوء، ويكتبون استنتاجًا (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • التحدي: يطرح المعلم تحدي ص25: صمم اختبارًا عادلًا يوضح حاجة النبات إلى الهواء، والطلبة يقترحون نبتتين متماثلتين إحداهما في وعاء محكم تُزال منه الغازات والأخرى في الهواء، مع تثبيت بقية العوامل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\n1. (مستوى المعرفة) أين وضعنا النبتة (ب)؟\n   الإجابة النموذجية: في خزانة مظلمة.\n2. (مستوى التطبيق) ما العوامل التي جعلناها متساوية للنبتتين؟\n   الإجابة النموذجية: كمية الماء، ونوع النبات وحجمه، وحجم الأصيص.\n3. (مستوى الاستدلال) لماذا رسمنا خطًا عند قاعدة النبتة قبل القياس؟\n   الإجابة النموذجية: ليكون نقطة مرجعية ثابتة نقيس منها في كل مرة.\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\n1. (مستوى المعرفة) أي تمثيل نستخدم لعرض تغير طول النبتة بمرور الزمن؟\n   الإجابة النموذجية: التمثيل الخطي.\n2. (مستوى التطبيق) في مثال ص65 كم أصبحت درجة حرارة الماء بعد 6 دقائق؟\n   الإجابة النموذجية: 20°C.\n3. (مستوى الاستدلال) لماذا نرسم خطي النبتتين (أ) و(ب) على المحورين نفسيهما؟\n   الإجابة النموذجية: لتسهل المقارنة بين نموهما.\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\n1. (مستوى المعرفة) ما لون أوراق النبتة التي بقيت في الظلام؟\n   الإجابة النموذجية: صفراء باهتة.\n2. (مستوى التطبيق) لماذا نمت النبتة (ب) طويلة نحيفة؟\n   الإجابة النموذجية: لأنها استهلكت مخزون غذائها في محاولة النمو نحو الضوء دون أن تصنع غذاءً جديدًا.\n3. (مستوى الاستدلال) هل كان الاختبار عادلًا؟ وضّح.\n   الإجابة النموذجية: نعم؛ لأننا غيرنا عاملًا واحدًا هو الضوء وثبتنا الماء ونوع النبات وحجمه والأصيص.", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\n1. (مستوى المعرفة) ما الأداة التي نقيس بها كمية ماء الري؟\n   الإجابة النموذجية: المخبار المدرج.\n2. (مستوى التطبيق) ما العامل الذي نغيّره في هذا الاستقصاء؟\n   الإجابة النموذجية: الضوء.\n3. (مستوى الاستدلال) لماذا نكرر القياس كل أربعة أيام بدل قياس واحد في النهاية؟\n   الإجابة النموذجية: لنتابع التغير بمرور الزمن ونحصل على نتائج أدق وأكثر موثوقية.\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\n1. (مستوى المعرفة) صح أم خطأ: نستخدم الأعمدة لعرض عدد بذور ثمار مختلفة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ماذا نضع على المحور الأفقي عند تمثيل نمو النبتة؟\n   الإجابة النموذجية: الزمن (التاريخ أو الأيام).\n3. (مستوى الاستدلال) توقف ارتفاع خط النبتة (ب) ثم بدأ يقل عدد أوراقها، ماذا تستنتج؟\n   الإجابة النموذجية: أنها استهلكت مخزون غذائها ولا تستطيع صنع غذاء جديد دون ضوء فبدأت تضعف.\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\n1. (مستوى المعرفة) أكمل: تحتاج النباتات إلى طاقة …… لتصنع غذاءها.\n   الإجابة النموذجية: ضوئية.\n2. (مستوى التطبيق) لماذا تنمو بعض النباتات في الأماكن الظليلة إلى حجم كبير؟\n   الإجابة النموذجية: لأن لها أوراقًا كبيرة تمتص ضوءًا أكثر، وتكون التربة هناك رطبة غالبًا.\n3. (مستوى الاستدلال) لو أعدت الاستقصاء باستخدام نوع آخر من النباتات، هل تتوقع النتيجة نفسها؟ لماذا؟\n   الإجابة النموذجية: نعم غالبًا؛ لأن جميع النباتات تحتاج إلى الطاقة الضوئية لصنع غذائها، وتكرار التجربة بنباتات أخرى يقوي الاستنتاج.", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\nللطالب: قراءة كتاب الطالب ص24، والمشاركة في متابعة القياس والري حسب الجدول. لولي الأمر: تنفيذ تجربة مماثلة في المنزل بنبتتين صغيرتين (إن أمكن) ومتابعة الفرق مع الابن.\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\nللطالب: إكمال ورقة العمل 1-5 ص59، ومراجعة صفحتي مهارات الاستقصاء العلمي ص64–65 في كتاب الطالب. لولي الأمر: تدريب الابن على قراءة تمثيل خطي بسيط (مثل درجات الحرارة اليومية في نشرة الطقس).\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\nللطالب: حل تمرين 1-5 بكتاب النشاط ص21، ومراجعة الوحدة الأولى استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة مع الابن (بذرة، جنين، إنبات، عوامل، طاقة ضوئية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=5"]}, {"code": "1-6", "title": "تحقق من تقدمك", "unit": 1, "dates": "الأسبوع الثالث (20–24/9/2026م)", "sb": "26–27", "tb": "31–35", "ab": "المراجعة اللغوية ص22", "periods": [{"n": 1, "topic": "مراجعة: المفردات والإنبات (س1–س2) ونتائج نشاط 1-3ب", "f": ["1. يربط المصطلحات العلمية بمعانيها: البذرة، الجنين، غلاف البذرة، الإنبات، البيئة\n2. يكمل جملًا علمية عن الإنبات وعوامل نمو النبات\nمخرج تعليمي آخر: يحلل نتائج استقصاء الظروف الملائمة للإنبات (نشاط 1-3ب) بعد ثمانية أيام", "المخرج 1 (يربط المصطلحات العلمية بمعانيها: البذرة، الجنين، غلاف البذرة، الإنبات، البيئة): تذكر\nالمخرج 2 (يكمل جملًا علمية عن الإنبات وعوامل نمو النبات): فهم\nالمخرج الآخر (يحلل نتائج استقصاء الظروف الملائمة للإنبات (نشاط 1-3ب) بعد ثمانية أيام): تحليل", "التعلم التعاوني، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: علب نشاط 1-3ب، جداول التسجيل، بطاقات المصطلحات", "البذرة، الجنين، غلاف البذرة، الإنبات، البيئة، العوامل.", "ينفذ المعلم لعبة «من أنا؟» بقراءة تعريفات قصيرة (مثل: أنا الغطاء الذي يحمي البذرة) ليتسابق الطلاب في تسمية المصطل ة اللغوية", "f": ["1. يسمي أجزاء البذرة النابتة في شكل\n2. يحلل بيانات جدول عدد البذور المستنبتة في ظروف مختلفة\nمخرج تعليمي آخر: يحدد العامل الناقص لنبات من صورته ويوضح أهميته للنمو", "المخرج 1 (يسمي أجزاء البذرة النابتة في شكل): تذكر\nالمخرج 2 (يحلل بيانات جدول عدد البذور المستنبتة في ظروف مختلفة): تحليل\nالمخرج الآخر (يحدد العامل الناقص لنبات من صورته ويوضح أهميته للنمو): تقييم", "التعلم التعاوني، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الإنبات، العوامل، التمثيل البياني بالأعمدة.", "يعرض المعلم الجدول ص27 دون عنوان ويسأل: «ماذا تخبرنا هذه الأرقام؟ أي ظرف أنبت أكثر بذور؟».", "1. • التهيئة: يعرض المعلم الجدول ويطرح السؤال، والطلبة يقرؤون الأرقام ويقارنون (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • السؤال 3: يعرض المعلم الشكل ص27، والطلبة يسمون الأجزاء المرقمة 1–4 في البذرة النابتة (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • السؤال 4: يناقش المعلم أجزاء السؤال (أ–د)، والطلبة يستنتجون: أفضل ظروف الدفء والظلام (15 بذرة)، البذور لا تحتاج للضوء، حصلت على الماء لأنها نبتت، ونرسم تمثيلًا بالأعمدة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • السؤال 5: يعرض المعلم الصورتين (أ) و(ب)، والطلبة يحددون العامل الناقص: (أ) الضوء، (ب) الماء، ويذكرون عاملًا آخر (الهواء/الدفء) ويوضحون أهمية الضوء (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) في جدول ص27، أي الظروف أفضل للإنبات؟\n   الإجابة النموذجية: الدفء والظلام (15 بذرة).\n2. (مستوى التطبيق) هل تحتاج البذور للضوء لتنبت؟ استخدم الجدول.\n   الإجابة النموذجية: لا؛ فقد نبتت بذور أكثر في الظلام (15) مقارنة بالضوء (10) في الدفء.\n3. (مستوى الاستدلال) هل حصلت البذور على الماء؟ كيف عرفت؟\n   الإجابة النموذجية: نعم؛ لأنها نبتت، والبذور لا تنبت دون ماء.", "1. (مستوى المعرفة) ما نوع التمثيل البياني المناسب لنتائج محمود؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة؛ لأنها نتائج ظروف مختلفة.\n2. (مستوى التطبيق) ما العامل الناقص للنبات (أ) في السؤال 5؟\n   الإجابة النموذجية: الضوء.\n3. (مس توى المعرفة) أكمل: تكوّن النباتات …… التي تكوّن ثمارًا تحتوي على ……\n   الإجابة النموذجية: الأزهار؛ البذور.\n2. (مستوى التطبيق) ما التمثيل المناسب لعرض أعداد الأزهار حسب ألوانها؟ ولماذا؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة؛ لأننا نقارن مجموعات مختلفة (ألوانًا).\n3. (مستوى الاستدلال) اذكر نباتًا لا يحتوي على أزهار.\n   الإجابة النموذجية: السرخس أو الطحالب (تقبل الإجابات الصحيحة).", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\nللطالب: قراءة كتاب الطالب ص28، وتسجيل ألوان الأزهار التي يراها في الحي. لولي الأمر: مساعدة الابن في عدّ الأزهار حسب ألوانها في حديقة قريبة لاستخدامها في ورقة العمل 2-1.\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\nللطالب: حل تمرين 2-1 بكتاب النشاط ص23، وإكمال ورقة العمل 2-1 ص61. لولي الأمر: ملاحظة شجرة مثمرة في المنزل أو الحي مع الابن وتحديد هل تحمل أزهارًا أم ثمارًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=7"]}, {"code": "2-2", "title": "كيف تنتشر البذور؟", "unit": 2, "dates": "الأسبوع الرابع (27/9–1/10/2026م)", "sb": "30–31", "tb": "39–41", "ab": "تمرين 2-2 ص24، ورقة العمل 2-2 ص63", "periods": [{"n": 1, "topic": "لماذا يجب أن تنتشر البذور؟", "f": ["1. يشرح معنى انتشار البذور\n2. يفسر أهمية انتشار البذور بعيدًا عن النبات الأصلي\nمخرج تعليمي آخر: يتنبأ بما يحدث للشتلات إذا نمت جميعها قرب النبات الأم", "المخرج 1 (يشرح معنى انتشار البذور): فهم\nالمخرج 2 (يفسر أهمية انتشار البذور بعيدًا عن النبات الأصلي): فهم\nالمخرج الآخر (يتنبأ بما يحدث للشتلات إذا نمت جميعها قرب النبات الأم): تحليل", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية", "انتشار البذور، الشتلات، الثمرة.", "يسأل المعلم: «هل وجدت يومًا بذورًا عالقة في ملابسك؟»، ثم يعرض صورة ص30 لشتلات كثيرة متزاحمة تحت نبتة زهرية ويسأل: «ماذا سيحدث لهذه الشتلات؟».", "1. • التهيئة: يطرح المعلم السؤالين ويعرض الصورة، والطلبة يتوقعون مصير الشتلات المتزاحمة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • وظيفتا الثمرة: يقرأ المعلم مع الطلاب ص30: تحمي الثمرة البذور وتساعد في انتشارها، والطلبة يحددون الوظيفتين ويكتبونهما (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • محاكاة التزاحم: ينفذ المعلم محاكاة: يقف عدد من الطلاب «شتلات» في مساحة ضيقة يتقاسمون «ماءً وضوءًا» (بطاقات محدودة)، ثم في مساحة واسعة، والطلبة يلاحظون أن الشتلات المتزاحمة لا تحصل على حاجتها، ويستنتجون أهمية الانتشار (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • نقاش: يسأل المعلم: لماذا لا تنمو الشتلات جيدًا بجوار النبات الأصلي؟ هل لاحظتم نباتات تنمو في أماكن لم تُزرع فيها؟ والطلبة يربطون بين التزاحم ونقص الماء والضوء والمساحة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يكتب المعلم تعريف انتشار البذور على السبورة، والطلبة يكتبون التعريف ويذكرون سببين لأهميته (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما المقصود بانتشار البذور؟\n   الإجابة النموذجية: نقل البذور بعيدًا عن النبات الأصلي الذي تكونت فيه.\n2. (مستوى التطبيق) ما وظيفتا الثمرة؟\n   الإجابة النموذجية: حماية البذور الموجودة بداخلها، والمساعدة في انتشارها.\n3. (مستوى الاستدلال) لماذا لا تنمو الشتلات جيدًا إذا نبتت كلها قرب النبات الأم؟\n   الإجابة النموذجية: لأنها تتشارك الماء والضوء في حيز صغير فلا تكفيها، فلا تكون نباتات صحية.", "1. (مستوى المعرفة) صح أم خطأ: تحتاج الشتلات إلى مساحة كافية لتنمو.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر شيئين تتنافس عليهما الشتلات المتزاحمة.\n   الإجابة النموذجية: الماء والضوء (والمساحة).\n3. (مستوى الاستدلال) تنبأ: نبات تسقط كل بذوره تحته مباشرة، كيف سيكون نمو شتلاته؟ فسّر.\n   الإجابة النموذجية: ضعيفًا؛ لأنها تتنافس فيما بينها ومع النبات الأم على الماء والضوء والمساحة.", "للطالب: قراءة كتاب الطالب ص30، والبحث (مع ولي الأمر) عن مثال لحيوان ينشر البذور. لولي الأمر: مساعدة الابن في البحث في الكتب أو الشبكة عن طرق نشر الحيوانات للبذور لاستخدامها في نشاط 2-2.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=8"]}, {"n": 2, "topic": "نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان", "f": ["1. يصف طرق انتشار البذور بواسطة الحيوانات والإنسان\n2. يجمع معلومات من مصادر جزة سريعًا، ثم يرفع جوربًا ويسأل: «كيف يمكن لهذا الجورب أن يساعدنا على فهم انتشار البذور؟».", "الحصة 1: لماذا يجب أن تنتشر البذور؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤالين ويعرض الصورة، والطلبة يتوقعون مصير الشتلات المتزاحمة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • وظيفتا الثمرة: يقرأ المعلم مع الطلاب ص30: تحمي الثمرة البذور وتساعد في انتشارها، والطلبة يحددون الوظيفتين ويكتبونهما (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • محاكاة التزاحم: ينفذ المعلم محاكاة: يقف عدد من الطلاب «شتلات» في مساحة ضيقة يتقاسمون «ماءً وضوءًا» (بطاقات محدودة)، ثم في مساحة واسعة، والطلبة يلاحظون أن الشتلات المتزاحمة لا تحصل على حاجتها، ويستنتجون أهمية الانتشار (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • نقاش: يسأل المعلم: لماذا لا تنمو الشتلات جيدًا بجوار النبات الأصلي؟ هل لاحظتم نباتات تنمو في أماكن لم تُزرع فيها؟ والطلبة يربطون بين التزاحم ونقص الماء والضوء والمساحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. • الغلق: يكتب المعلم تعريف انتشار البذور على السبورة، والطلبة يكتبون التعريف ويذكرون سببين لأهميته (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون أن البذور تخرج مع فضلات الطائر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • طرق الحيوانات: يشرح المعلم من ص30–31: أكل الثمار وخروج البذور مع الفضلات، التعلق بالفراء والملابس بالأشواك، حمل النمل للبذور، دفن الفئران والسناجب للبذور، والطلبة يكملون جدولًا: الحيوان – طريقة نشر البذور (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. 2: البحث: يوزع المعلم المصادر (كتب، أجهزة) ويحدد مهام البحث لكل مجموعة، والطلبة يبحثون ويجمعون صورًا ومعلومات عن طريقة محددة (16 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • إعداد الملصق: يوجه المعلم إلى تصميم ملصق منظم بالرسوم والصور؛ الغلق (دقيقتان) يحدد موعد عرض الملصقات، والطلبة يبدؤون تصميم الملصق ويوزعون الأدوار. يرتبون أعمالهم (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الملصقات والجورب، والطلبة يتوقعون أن البذور ستلتصق بالجورب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. • المشي بالجورب: يحدد المعلم منطقة عشبية لكل مجموعة ويوجه إلى لبس الجورب فوق الحذاء والمشي خمس دقائق، والطلبة يمشون في المنطقة العشبية ثم يعودون ويخلعون الجوارب (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • العدّ والتسجيل: يقدم المعلم ورقة العمل 2-2 ص63 ويساعد في تسمية البذور، والطلبة يفحصون البذور بالعدسة ويعدّونها حسب أنواعها ويسجلونها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة ص31: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن البذور المتروكة على النبات والخوخ ويرسمون بذورًا تنتشر بالفراء (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: لماذا يجب أن تنتشر البذور؟\n1. (مستوى المعرفة) ما المقصود بانتشار البذور؟\n   الإجابة النموذجية: نقل البذور بعيدًا عن النبات الأصلي الذي تكونت فيه.\n2. (مستوى التطبيق) ما وظيفتا الثمرة؟\n   الإجابة النموذجية: حماية البذور الموجودة بداخلها، والمساعدة في انتشارها.\n3. (مستوى الاستدلال) لماذا لا تنمو الشتلات جيدًا إذا نبتت كلها قرب النبات الأم؟\n   الإجابة النموذجية: لأنها تتشارك الماء والضوء في حيز صغير فلا تكفيها، فلا تكون نباتات صحية.\n\nالحصة 2: نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان\n1. (مستوى المعرفة) كيف تنشر الطيور بذور التوت؟\n   الإجابة النموذجية: تأكل الثمار وتخرج البذور مع فضلاتها في مكان بعيد.\n2. (مستوى التطبيق) كيف تنتقل بعض البذور على فراء الحيوانات؟\n   الإجابة النموذجية: تحتوي على أشواك أو خطافات تلتصق بالفراء أو الملابس.\n3. (مستوى الاستدلال) لماذا تنبت بعض البذور التي يدفنها الفأر؟\n   الإجابة النموذجية: لأنه قد لا يعود لأكلها فتجد في التربة الظروف الملائمة للإنبات.\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\n1. (مستوى المعرفة) ما الذي التصق بالجورب؟\n   الإجابة النموذجية: بذور مختلفة.\n2. (مستوى التطبيق) ما صفة البذور التي التصقت بالجورب؟\n   الإجابة النموذجية: لها أشواك أو خطافات أو سطح لزج.\n3. (مستوى الاستدلال) علامَ يدل عدد البذور الكبير على جوارب المجموعة التي مشت في العشب؟\n   الإجابة النموذجية: أن كثيرًا من النباتات تنشر بذورها بالتعلق بالفراء أو الملابس.", "الحصة 1: لماذا يجب أن تنتشر البذور؟\n1. (مستوى المعرفة) صح أم خطأ: تحتاج الشتلات إلى مساحة كافية لتنمو.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر شيئين تتنافس عليهما الشتلات المتزاحمة.\n   الإجابة النموذجية: الماء والضوء (والمساحة).\n3. (مستوى الاستدلال) تنبأ: نبات تسقط كل بذوره تحته مباشرة، كيف سيكون نمو شتلاته؟ فسّر.\n   الإجابة النموذجية: ضعيفًا؛ لأنها تتنافس فيما بينها ومع النبات الأم على الماء والضوء والمساحة.\n\nالحصة 2: نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان\n1. (مستوى المعرفة) اذكر حيوانين ينشران البذور.\n   الإجابة النموذجية: الطيور، القرود، الفئران، النمل، السناجب (أي اثنين).\n2. (مستوى التطبيق) كيف يساعد الإنسان في نشر البذور دون قصد؟\n   الإجابة النموذجية: بالتصاق البذور بملابسه أو برمي بذور الثمار التي يأكلها.\n3. (مستوى الاستدلال) بذرة مغطاة بأشواك صغيرة، تنبأ بطريقة انتشارها مع التعليل.\n   الإجابة النموذجية: تنتشر بالتصاقها بفراء الحيوانات أو ملابس الإنسان لأن الأشواك تساعدها على التعلق.\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\n1. (مستوى المعرفة) صح أم خطأ: يعمل الجورب في هذا النشاط عمل فراء الحيوانات.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) أيهما ينمو أفضل: بذور طماطم متروكة على النبات، أم بذور طماطم أكلها طائر؟ ولماذا؟\n   الإجابة النموذجية: بذور الطماطم التي أكلها الطائر؛ لأنها تنتشر بعيدًا وتجد مساحة وماءً وضوءًا أكثر.\n3. (مستوى الاستدلال) هل يمكن للحيوانات نشر بذور الخوخ؟ وضّح.\n   الإجابة النموذجية: نعم؛ تأكل الثمرة وترمي البذرة الكبيرة بعيدًا عن الشجرة أو تحملها.", "الحصة 1: لماذا يجب أن تنتشر البذور؟\nللطالب: قراءة كتاب الطالب ص30، والبحث (مع ولي الأمر) عن مثال لحيوان ينشر البذور. لولي الأمر: مساعدة الابن في البحث في الكتب أو الشبكة عن طرق نشر الحيوانات للبذور لاستخدامها في نشاط 2-2.\n\nالحصة 2: نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان\nللطالب: إكمال الملصق مع المجموعة، وقراءة كتاب الطالب ص31. لولي الأمر: إحضار جورب قديم (فردة واحدة) لنشاط المشي بالجورب في الحصة القادمة.\n\nالحصة 3: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\nللطالب: حل تمرين 2-2 بكتاب النشاط ص24، وإكمال التمثيل البياني في ورقة العمل 2-2 ص63. لولي الأمر: جمع بذور متنوعة (مجففة) من المطبخ أو الحديقة مع الابن لإحضارها لدرس طرق انتشار البذور.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=8"]}, {"code": "2-3", "title": "طرق أخرى لانتشار البذور", "unit": 2, "dates": "الأسبوع الخامس (4–8/10/2026م)", "sb": "32–33", "tb": "42–44", "ab": "تمرين 2-3 ص25، ورقة المصادر 2-3 ص43، ورقة العمل 2-3 ص65", "periods": [{"n": 1, "topic": "انتشار البذور بواسطة الرياح", "f": ["1. يصف كيف تنتشر بعض البذور بواسطة الرياح\n2. يحدد صفات البذور التي تنتشر بالرياح: جافة خفيفة الوزن لها أجنحة أو شعيرات\nمخرج تعليمي آخر: يتنبأ بطريقة انتشار بذرة من خلال شكلها", "المخرج 1 (يصف كيف تنتشر بعض البذور بواسطة الرياح): فهم\nالمخرج 2 (يحدد صفات البذور التي تنتشر بالرياح: جافة خفيفة الوزن لها أجنحة أو شعيرات): تحليل\nالمخرج الآخر (يتنبأ بطريقة انتشار بذرة من خلال شكلها): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور تنتشر بالرياح أو صورها، نماذج ورقية لبذرة مجنّحة، مروحة يدوية", "انتشار البذور، الرياح، خفة الوزن.", "ينفخ المعلم (أو يعرض مقطعًا لطفلة تنفخ) بذور نبات الهندباء كما في ص32، ويسأل: «لماذا طارت هذه البذور بعيدًا بنفخة واحدة؟».", "1. • التهيئة: يعرض المعلم الصورة أو المقطع ويطرح السؤال، والطلبة يقترحون أن البذور خفيفة ولها شعيرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • صور الكتاب ص32: يناقش المعلم أربعة أمثلة: الهندباء (مظلة من الشعر)، الثريا (ثمار تجف وتسقط)، الخشخاش (وعاء مسامي تهزه الرياح)، القيقب (أجنحة كالمروحة)، والطلبة يصفون كيف تساعد صفة كل بذرة على الانتشار بالرياح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تجربة الطيران: يوزع المعلم نموذجين: كرة ورقية صغيرة ونموذج «بذرة مجنحة» بالوزن نفسه، ويسقطهما أمام المروحة، والطلبة يلاحظون أن النموذج المجنح يطير أبعد ويبقى في الهواء مدة أطول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • استنتاج الصفات: يكتب المعلم على السبورة: «البذور التي تنتشر بالرياح تكون…»، والطلبة يكملون: جافة، خفيفة، لها أجنحة أو شعيرات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يعرض المعلم صورًا لبذور ويطلب تحديد التي تنتشر بالرياح، والطلبة يحددون ويعللون (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1. (مستوى المعرفة) اذكر نباتًا تنتشر بذوره بالرياح.\n   الإجابة النموذجية: الهندباء أو القيقب أو الخشخاش أو الثريا.\n2. (مستوى التطبيق) ما صفات البذور التي تنتشر بالرياح؟\n   الإجابة النموذجية: جافة خفيفة الوزن، ولها أجنحة أو شعيرات.\n3. (مستوى الاستدلال) لماذا بقي النموذج المجنح في الهواء مدة أطول من الكرة الورقية؟\n   الإجابة النموذجية: لأن الأجنحة تقاوم الهواء وتجعله يدور ويسقط ببطء فتحمله الرياح بعيدًا.", "1. (مستوى المعرفة) صح أم خطأ: البذور الثقيلة الرطبة تنتشر بسهولة بالرياح.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) كيف تساعد الرياح بذور الخشخاش على الانتشار؟\n   الإجابة النموذجية: تهز الرياح الثمرة فتخرج البذور من فتحات الوعاء المسامي وتنتشر بعيدًا.\n3. (مستوى الاستدلال) بذرة خفيفة لها شعيرات تشبه المظلة، تنبأ بطريقة انتشارها وفسّر.\n   الإجابة النموذجية: بالرياح؛ لأن الشعيرات تجعلها تطفو في الهواء وتحملها الرياح بعيدًا.", "للطالب: قراءة كتاب الطالب ص32 (الانتشار بالرياح)، وملاحظة نباتات في البيئة تنتشر بذورها بالرياح. لولي الأمر: مشاهدة مقطع مع الابن عن انتشار البذور بالرياح ومناقشته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"n": 2, "topic": "انتشار البذور بواسطة الماء", "f": ["1. يصف كيف تنتشر بعض البذور بواسطة الماء\n2. يفسر دور الطبقة الإسفنجية في طفو بعض الثمار والبذور\nمخرج تعليمي آخر: يختبر طفو ثمار أو بذور مختلفة ويستنتج أيها يمكن أن ينتشر بالماء", "المخرج 1 (يصف كيف تنتشر بعض البذور بواسطة الماء): فهم\nالمخرج 2 (يفسر دور الطبقة الإسفنجية في طفو بعض الثمار والبذور): فهم\nالمخرج الآخر (يختبر طفو ثمار أو بذور مختلفة ويستنتج أيها يمكن أن ينتشر بالماء): تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: حوض ماء، ثمرة جوز هند أو صورتها، بذور متنوعة (فول، فلين، بذور زهرة)", "إسفنجي، الطفو، انتشار البذور.", "يضع المعلم ثمرة جوز هند (أو قطعة فلين) وحجرًا صغيرًا في حوض ماء ويسأل: «لماذا طفت الثمرة وغاص الحجر؟ وكيف يفيد ذلك النبات؟».", "1. • التهيئة: ينفذ المعلم العرض ويطرح السؤال، والطلبة يتوقعون أن الثمرة خفيفة أو فيها هواء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الانتشار بالماء: يشرح المعلم من ص32: الطبقة الإسفنجية في جوز الهند مملوءة بالهواء تساعده على الطفو، وأشجار المانجروف تسقط «أقلام البحر» التي تطفو حتى تصل إلى اليابسة، والطلبة يعرفون مفهوم «إسفنجي» ويرسمون مقطعًا لجوز الهند (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • اختبار الطفو: يوزع المعلم على المجموعات بذورًا وثمارًا مختلفة وحوض ماء، والطلبة يتنبؤون بما يطفو، ثم يختبرون ويسجلون النتائج في جدول (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • المناقشة: يسأل المعلم: أي البذور يمكن أن تنتشر بالماء؟ ولماذا تنمو بعض الأشجار قرب الشواطئ والأودية؟ والطلبة يستنتجون أن البذور الطافية تنتقل مع الماء بعيدًا (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يربط المعلم الدرس بالسؤال (1) ص33 عن زنبق الماء، والطلبة يجيبون شفهيًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما الثمرة التي تنتشر بذرتها بالماء في الكتاب؟\n   الإجابة النموذجية: جوز الهند (وأقلام بحر المانجروف).\n2. (مستوى التطبيق) ما المقصود بالطبقة الإسفنجية؟\n   الإجابة النموذجية: طبقة بها مسام كثيرة مملوءة بالهواء تساعد على الطفو.\n3. (مستوى الاستدلال) أي البذور التي اختبرتها يمكن أن تنتشر بالماء؟ لماذا؟\n   الإجابة النموذجية: البذور التي طفت؛ لأنها تستطيع أن تنتقل مع تيار الماء.", "1. (مستوى المعرفة) أكمل: تحتوي ثمرة جوز الهند على طبقة …… تساعدها على الطفو.\n   الإجابة النموذجية: إسفنجية.\n2. (مستوى التطبيق) كيف يساعد غلاف البذرة الإسفنجي زنبق الماء في نشر بذوره؟\n   الإجابة النموذجية: يجعلها تطفو على سطح الماء فتنتقل بعيدًا عن النبات الأصلي.\n3. (مستوى الاستدلال) لماذا تنتشر أشجار المانجروف على طول الشواطئ؟\n   الإجابة النموذجية: لأن بذورها (أقلام البحر) تطفو في الماء المالح حتى يلقيها البحر على اليابسة فتنمو هناك.", "للطالب: قراءة كتاب الطالب ص32 (الانتشار بالماء)، ورسم ثمرة جوز الهند مبينًا الطبقة الإسفنجية. لولي الأمر: تجربة طفو بذور مختلفة في وعاء ماء بالمنزل مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"n": 3, "topic": "الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟", "f": ["1. يصف كيف تنشر بعض الثمار بذورها بالانفجار أو التشقق\n2. يصنف بذورًا مختلفة حسب صفاتها وطرق انتشارها المحتملة\nمخرج تعليمي آخر: يستخدم الصفات الملاحظة للبذرة لاقتراح تفسير لطريقة انتشارها", "المخرج 1 (يصف كيف تنشر بعض الثمار بذورها بالانفجار أو التشقق): فهم\nالمخرج 2 (يصنف بذورًا مختلفة حسب صفاتها وطرق انتشارها المحتملة): تحليل\nالمخرج الآخر (يستخدم الصفات الملاحظة للبذرة لاقتراح تفسير لطريقة انتشارها): تقييم", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور متنوعة جمعها الطلاب، عدسات مكبرة، قرون فول جافة", "تنفجر، تتشقق، انتشار البذور.", "يعرض المعلم مقطعًا قصيرًا لقرون تنفجر وتقذف بذورها، ويسأل: «هل تحتاج كل النباتات إلى حيوان أو رياح أو ماء لنشر بذورها؟».", "1. • التهيئة: يعرض المعلم المقطع ويطرح السؤال، والطلبة يصفون ما شاهدوه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الانفجار والتشقق: يشرح المعلم من ص33: تجف قرون الفول في الطقس الحار فتنفجر وتقذف بذورها، والطلبة يفحصون قرنًا جافًا ويحددون خط التشقق (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 3: يوجه المجموعات وفق ص33، والطلبة يجمعون خمسة أنواع على الأقل من البذور، ويلاحظونها بالعدسة، ويحاولون معرفة نباتاتها، ويرسمونها ويسمونها، ويصنفونها حسب طريقة انتشارها المحتملة (18 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. • عرض التصنيف: يطلب المعلم من كل مجموعة تبرير تصنيفها، والطلبة يعرضون: أشواك ← حيوانات، أجنحة ← رياح، طبقة إسفنجية ← ماء، قرون ← انفجار (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يذكرون أربع طرق لانتشار البذور (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ماذا يحدث لقرون الفول في الطقس الحار الجاف؟\n   الإجابة النموذجية: تجف وتنفجر (تتشقق) فتنطلق البذور خارجها.\n2. (مستوى التطبيق) بذرة لها جناحان، كيف صنفتها؟\n   الإجابة النموذجية: ضمن البذور التي تنتشر بالرياح.\n3. (مستوى الاستدلال) كيف تساعد صفة البذرة على تحديد طريقة انتشارها؟\n   الإجابة النموذجية: الصفة تدل على الطريقة: الأشواك للتعلق بالحيوانات، والأجنحة للرياح، والطبقة الإسفنجية للماء.", "1. (مستوى المعرفة) صح أم خطأ: يمكن لبعض الثمار نشر بذورها بنفسها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا يقطف المزارعون قرون الفول قبل أن يشتد الحر؟\n   الإجابة النموذجية: لأن القرون تجف وتنفجر في الحر فتتناثر البذور وتضيع.\n3. (مستوى الاستدلال) اقترح تفسيرًا لطريقة انتشار بذور الريحان مع التعليل.\n   الإجابة النموذجية: تقبل الإجابات المنطقية المعللة، مثل: تسقط بذوره الصغيرة الخفيفة من الثمار الجافة وتحملها الرياح أو تلتصق برطوبة أجسام الحيوانات.", "للطالب: الاحتفاظ بالبذور المصنفة، وقراءة ورقة المصادر 2-3 (طرق انتشار البذور) ص43 بكتاب النشاط. لولي الأمر: تجهيز ورق مقوى ومقص ومشبك ورق للابن لتصميم نموذج بذرة في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"n": 4, "topic": "ورقة العمل 2-3: صمم بذرة تنشرها الرياح", "f": ["1. يصمم نموذج بذرة تنتشر بالرياح\n2. يخطط لاختبار عادل لقياس زمن سقوط النموذج ويكرر القياس\nمخرج تعليمي آخر: يقيم تصميمه ويقترح تحسينات بناءً على النتائج", "المخرج 1 (يصمم نموذج بذرة تنتشر بالرياح): إبداع\nالمخرج 2 (يخطط لاختبار عادل لقياس زمن سقوط النموذج ويكرر القياس): تطبيق\nالمخرج الآخر (يقيم تصميمه ويقترح تحسينات بناءً على النتائج): تقييم", "التعلم المبني على المشاريع، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مقوى، مقص، مشابك ورق، ساعة إيقاف، شريط متري", "الاختبار العادل، القياس المتكرر، انتشار البذور.", "يطرح المعلم تحديًا: «أنت مهندس نباتات! صمم بذرة تبقى في الهواء أطول مدة لتحملها الرياح بعيدًا»، ويعرض ورقة المصادر 2-3 ص43 للإلهام.", "1. • التهيئة: يطرح المعلم التحدي ويعرض ورقة المصادر، والطلبة يقترحون أشكالًا (أجنحة، مظلة) (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. • التخطيط: يقدم المعلم ورقة العمل 2-3 ص65 ويناقش: ما الذي نقيسه؟ ما الذي نثبته؟ والطلبة يحددون: نقيس زمن السقوط، ونثبت الارتفاع والوزن (مشبك واحد) (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • التصميم والتصنيع: يتابع المجموعات، والطلبة يصنعون نموذجين مختلفين أو أكثر (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • الاختبار والتكرار: يحدد المعلم ارتفاع الإسقاط نفسه لجميع المجموعات، ويؤكد تكرار القياس ثلاث مرات، والطلبة يسقطون النماذج ويقيسون الزمن بساعة الإيقاف ثلاث مرات ويسجلون (11 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. • التقييم: يسأل المعلم: أي تصميم بقي في الهواء أطول؟ كيف تحسنه؟ والطلبة يقارنون النتائج ويقترحون تحسينات (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما الذي قسناه في هذا النشاط؟\n   الإجابة النموذجية: الزمن الذي يستغرقه النموذج حتى يصل إلى الأرض.\n2. (مستوى التطبيق) ما العوامل التي ثبتناها ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: ارتفاع الإسقاط، ووزن النموذج (عدد المشابك)، ومكان الإسقاط.\n3. (مستوى الاستدلال) لماذا كررنا القياس ثلاث مرات؟\n   الإجابة النموذجية: لأن القياس الواحد قد يكون خاطئًا، والتكرار يعطي نتائج أكثر دقة وموثوقية.", "1. (مستوى المعرفة) ما الأداة التي قسنا بها زمن السقوط؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (مستوى التطبيق) أي التصميمين أفضل: الذي سقط في 2 ثانية أم في 4 ثوانٍ؟ ولماذا؟\n   الإجابة النموذجية: الذي سقط في 4 ثوانٍ؛ لأنه بقي في الهواء مدة أطول فتحمله الرياح أبعد.\n3. (مستوى الاستدلال) اقترح تعديلًا يجعل نموذجك يبقى في الهواء مدة أطول، وفسّر.\n   الإجابة النموذجية: زيادة مساحة الأجنحة أو تخفيف الوزن؛ لأن ذلك يزيد مقاومة الهواء ويبطئ السقوط.", "للطالب: إكمال ورقة العمل 2-3 ص65 وكتابة تقرير قصير عن أفضل تصميم. لولي الأمر: مشاركة الابن في تحسين نموذجه بالمنزل واختباره من ارتفاع ثابت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"n": 5, "topic": "مراجعة طرق انتشار البذور وأسئلة الدرس", "f": ["1. يقارن بين طرق انتشار البذور: الحيوانات والرياح والماء والانفجار\n2. يطبق معرفته في الإجابة عن أسئلة
