س.\n• التفسير (7 دقائق):\n  المعلم: يسأل: لماذا كان الإحساس بالبرودة أكبر مع الرذاذ والنفخ؟\n  الطالب: يستنتجون أن الماء يتبخر آخذًا الحرارة، والنفخ يسرع التبخر.\n• أسئلة ص47 (8 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يشرحون عمل مجفف الشعر، ويذكرون أطعمة مجففة (الزبيب، المشمش، التمر)، ويفسرون جفاف التربة في الأيام الحارة العاصفة.\n• مسابقة المجموعات (7 دقائق):\n  المعلم: يشغّل مسابقة درس 3-2.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\n1. (مستوى الدعم) اذكر استخدامين مفيدين للتبخر.\n   الإجابة النموذجية: تجفيف الملابس، تجفيف الرطب، تجفيف اليدين (أي اثنين).\n2. (المستوى المتوقع) لماذا نشعر بالبرودة بعد التعرق؟\n   الإجابة النموذجية: لأن العرق يتبخر آخذًا الطاقة الحرارية من الجلد فيبرد.\n3. (المستوى المتقدم) لماذا تبرد اليدان عند استخدام المعقم؟\n   الإجابة النموذجية: لأن المعقم يتبخر بسرعة آخذًا الحرارة من اليدين.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\n1. (مستوى الدعم) ما الذي شعرت به عند الزفير على يدك؟\n   الإجابة النموذجية: شعور بالدفء.\n2. (المستوى المتوقع) لماذا شعرت ببرودة أكبر عند النفخ على يد مبللة؟\n   الإجابة النموذجية: لأن الماء يتبخر آخذًا الحرارة من اليد، والنفخ يسرع التبخر.\n3. (المستوى المتقدم) كيف يجفف مجفف الشعر الشعر؟\n   الإجابة النموذجية: يدفع هواءً ساخنًا متحركًا يسرّع تبخر الماء من الشعر.", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\n1. (مستوى الدعم) صح أم خطأ: التبخر يساعد على تبريد أجسامنا.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) كيف يستخدم المزارعون التبخر لحفظ الرطب؟\n   الإجابة النموذجية: ينشرونه في الشمس فيتبخر الماء منه فيجف ويُحفظ مدة أطول.\n3. (المستوى المتقدم) لماذا يبقى الماء في الجرة الفخارية باردًا في الصيف؟\n   الإجابة النموذجية: لأن جزءًا من الماء يتسرب عبر مسام الفخار ويتبخر من سطحه الخارجي آخذًا الحرارة فيبرد الماء داخلها.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\n1. (مستوى الدعم) صح أم خطأ: تتبخر السوائل أسرع عندما يتحرك الهواء.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر طعامين يُعدّان باستخدام التبخر.\n   الإجابة النموذجية: الزبيب والمشمش المجفف (أو التمر، السمك المجفف).\n3. (المستوى المتقدم) لماذا تجف التربة في الحديقة أسرع في الأيام الحارة العاصفة؟\n   الإجابة النموذجية: لأن الحرارة والرياح معًا تزيدان سرعة تبخر الماء من التربة.", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\nللطالب: قراءة كتاب الطالب ص46، وتسجيل ثلاث استخدامات للتبخر يلاحظها في المنزل. لولي الأمر: الحديث مع الابن عن طرق تجفيف الأطعمة في البيت العُماني.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\nللطالب: حل تمرين 3-2 بكتاب النشاط ص32. لولي الأمر: تذكير الابن بإحضار وعاءين متماثلين للاستقصاء القادم."]}, {"code": "3-3", "title": "استقصاء التبخر", "unit": 3, "dates": "الأسبوع الحادي عشر (15–19/11/2026م)", "sb": "48–49", "tb": "63–65", "ab": "تمرين 3-3 ص33، ورقة العمل 3-3 ص75", "periods": [{"n": 1, "topic": "نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)", "f": ["1. يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج\n2. يخطط لمقارنة التبخر في مكان دافئ ومكان بارد\nمخرج تعليمي آخر: يتنبأ بالنمط الذي سيظهر في النتائج", "المخرج 1 (يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج): تطبيق\nالمخرج 2 (يخطط لمقارنة التبخر في مكان دافئ ومكان بارد): تطبيق\nالمخرج الآخر (يتنبأ بالنمط الذي سيظهر في النتائج): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: وعاءان متماثلان في الحجم والشكل، مخبار مدرج، ماء", "الحجم، التبخر، المخبار المدرج.", "يسأل المعلم: «عرفنا أن الدفء يسرع التبخر، فكم مليلترًا من الماء يمكن أن يتبخر من وعاء في خمسة أيام؟ هل يمكننا قياس ذلك؟».", "• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقدمون تقديرات.\n• مهارة قياس الحجم (8 دقائق):\n  المعلم: يراجع قراءة المخبار المدرج (ص64): اختيار المخبار المناسب، مستوى النظر، قاع التقعر.\n  الطالب: يقرؤون أحجامًا معروضة.\n• إعداد نشاط 3-3أ (15 دقيقة):\n  المعلم: يتابع وفق ص48.\n  الطالب: يضعون 200 ml في كل وعاء، ويضعون أحدهما في مكان بارد (كالخزانة) والآخر في مكان دافئ (حافة نافذة مشمسة).\n• جدول التسجيل (7 دقائق):\n  المعلم: يعرض جدول ص48 (اليوم، حجم الماء في الدافئ والبارد).\n  الطالب: ينسخون الجدول ويكتبون تنبؤهم.\n• الغلق (5 دقائق):\n  المعلم: يوزع أدوار القياس اليومي لمدة خمسة أيام.\n  الطالب: يحددون أدوارهم.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) كم مليلترًا وضعنا في كل وعاء؟\n   الإجابة النموذجية: 200 ml.\n2. (المستوى المتوقع) أين وضعنا الوعاءين؟\n   الإجابة النموذجية: أحدهما في مكان بارد والآخر في مكان دافئ.\n3. (المستوى المتقدم) ما النمط الذي تتنبأ به في النتائج؟\n   الإجابة النموذجية: سيقل حجم الماء في الوعاء الدافئ أسرع من البارد يومًا بعد يوم.", "1. (مستوى الدعم) صح أم خطأ: يجب أن يكون الوعاءان متماثلين في الحجم والشكل.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) كيف نقيس حجم الماء المتبقي في الوعاء؟\n   الإجابة النموذجية: نسكبه في المخبار المدرج ونقرأ الحجم ثم نعيده إلى الوعاء.\n3. (المستوى المتقدم) لماذا نقيس الحجم كل يوم وليس في اليوم الأخير فقط؟\n   الإجابة النموذجية: لنرى النمط والتغير يومًا بعد يوم ونحصل على بيانات أكثر.", "للطالب: المشاركة في القياس اليومي وتسجيل الحجم في الجدول. لولي الأمر: تذكير الابن بإحضار أوعية مختلفة الفتحات (صحن، كوب، علبة) للحصة القادمة."]}, {"n": 2, "topic": "نشاط 3-3ب: أثر المساحة السطحية في التبخر", "f": ["1. يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر\n2. يستنتج أن زيادة المساحة السطحية تزيد التبخر\nمخرج تعليمي آخر: يربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية", "المخرج 1 (يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر): تطبيق\nالمخرج 2 (يستنتج أن زيادة المساحة السطحية تزيد التبخر): فهم\nالمخرج الآخر (يربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: علبة وزبدية وصينية وكأس، مخبار مدرج، ورقتان مبللتان", "المساحة السطحية، التبخر، الحجم.", "يبلل المعلم ورقتين متماثلتين، ويطوي إحداهما مرتين ويترك الأخرى مفرودة، ويضعهما أمام الطلاب ويسأل: «أيهما ستجف أولًا؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الورقتين ويطرح السؤال.\n  الطالب: يتنبؤون.\n• المساحة السطحية (7 دقائق):\n  المعلم: يوضح مفهوم مساحة السطح المكشوف للهواء ويقارن الورقتين بعد دقائق.\n  الطالب: يلاحظون أن الورقة المفرودة أكثر جفافًا.\n• إعداد نشاط 3-3ب (14 دقيقة):\n  المعلم: يتابع وفق ص49.\n  الطالب: يصبون 100 ml في كل من العلبة والزبدية والصينية والكأس، ويضعونها في المكان الدافئ نفسه.\n• الاختبار العادل (7 دقائق):\n  المعلم: يسأل: ما الذي غيرناه؟ وما الذي ثبتناه؟\n  الطالب: يحددون: المتغير مساحة الفتحة، والثوابت الحجم الأولي والمكان والمدة.\n• جدول وتنبؤ (4 دقائق):\n  المعلم: يعرض جدول ص49.\n  الطالب: يكتبون تنبؤاتهم: الصينية تفقد أكثر.\n• الغلق (3 دقائق):\n  المعلم: يحدد موعد القياس بعد ثلاثة أيام.\n  الطالب: يستعدون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما العامل الذي غيرناه في نشاط 3-3ب؟\n   الإجابة النموذجية: مساحة سطح فتحة الوعاء.\n2. (المستوى المتوقع) أي الورقتين جفت أسرع: المطوية أم المفرودة؟\n   الإجابة النموذجية: المفرودة.\n3. (المستوى المتقدم) لماذا جفت الورقة المفرودة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها المكشوفة للهواء أكبر فيتبخر الماء منها أسرع.", "1. (مستوى الدعم) صح أم خطأ: وضعنا كميات مختلفة من الماء في الأوعية.\n   الإجابة النموذجية: خطأ؛ 100 ml في كل وعاء.\n2. (المستوى المتوقع) تنبأ: أي وعاء سيفقد أكبر كمية من الماء؟\n   الإجابة النموذجية: الصينية لأن مساحة سطحها أكبر.\n3. (المستوى المتقدم) لماذا تُفرد الملابس المغسولة على الحبل بدل تركها مكومة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية المعرضة للهواء فتجف أسرع.", "للطالب: متابعة الأوعية وتسجيل الحجم بعد ثلاثة أيام. لولي الأمر: مناقشة الابن في سبب نشر الملابس مفرودة."]}, {"n": 3, "topic": "تحليل نتائج استقصاء التبخر", "f": ["1. يحلل بيانات التبخر ويحدد النمط\n2. يمثل نتائج التبخر بتمثيل بياني مناسب\nمخرج تعليمي آخر: يقترح تعديلًا على الاستقصاء لدراسة أثر الرياح في التبخر", "المخرج 1 (يحلل بيانات التبخر ويحدد النمط): تحليل\nالمخرج 2 (يمثل نتائج التبخر بتمثيل بياني مناسب): تطبيق\nالمخرج الآخر (يقترح تعديلًا على الاستقصاء لدراسة أثر الرياح في التبخر): إبداع", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام، أخرى: ورقة العمل 3-3 ص75، ورق مربعات", "التبخر، النمط اد والقياس)\nالحجم، التبخر، المخبار المدرج.\n\nالحصة 2: نشاط 3-3ب: أثر المساحة السطحية في التبخر\nالمساحة السطحية، التبخر، الحجم.\n\nالحصة 3: تحليل نتائج استقصاء التبخر\nالتبخر، النمط، التمثيل البياني.", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nيسأل المعلم: «عرفنا أن الدفء يسرع التبخر، فكم مليلترًا من الماء يمكن أن يتبخر من وعاء في خمسة أيام؟ هل يمكننا قياس ذلك؟».\n\nالحصة 2: نشاط 3-3ب: أثر المساحة السطحية في التبخر\nيبلل المعلم ورقتين متماثلتين، ويطوي إحداهما مرتين ويترك الأخرى مفرودة، ويضعهما أمام الطلاب ويسأل: «أيهما ستجف أولًا؟».\n\nالحصة 3: تحليل نتائج استقصاء التبخر\nيعرض المعلم الوعاءين (الدافئ والبارد) وجداول الطلاب حتى اليوم، ويسأل: «ماذا تخبرنا الأرقام حتى الآن؟».", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\n• التهيئة (5 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقدمون تقديرات.\n• مهارة قياس الحجم (8 دقائق):\n  المعلم: يراجع قراءة المخبار المدرج (ص64): اختيار المخبار المناسب، مستوى النظر، قاع التقعر.\n  الطالب: يقرؤون أحجامًا معروضة.\n• إعداد نشاط 3-3أ (15 دقيقة):\n  المعلم: يتابع وفق ص48.\n  الطالب: يضعون 200 ml في كل وعاء، ويضعون أحدهما في مكان بارد (كالخزانة) والآخر في مكان دافئ (حافة نافذة مشمسة).\n• جدول التسجيل (7 دقائق):\n  المعلم: يعرض جدول ص48 (اليوم، حجم الماء في الدافئ والبارد).\n  الطالب: ينسخون الجدول ويكتبون تنبؤهم.\n• الغلق (5 دقائق):\n  المعلم: يوزع أدوار القياس اليومي لمدة خمسة أيام.\n  الطالب: يحددون أدوارهم.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 3-3ب: أثر المساحة السطحية في التبخر\n• التهيئة (5 دقائق):\n  المعلم: يعرض الورقتين ويطرح السؤال.\n  الطالب: يتنبؤون.\n• المساحة السطحية (7 دقائق):\n  المعلم: يوضح مفهوم مساحة السطح المكشوف للهواء ويقارن الورقتين بعد دقائق.\n  الطالب: يلاحظون أن الورقة المفرودة أكثر جفافًا.\n• إعداد نشاط 3-3ب (14 دقيقة):\n  المعلم: يتابع وفق ص49.\n  الطالب: يصبون 100 ml في كل من العلبة والزبدية والصينية والكأس، ويضعونها في المكان الدافئ نفسه.\n• الاختبار العادل (7 دقائق):\n  المعلم: يسأل: ما الذي غيرناه؟ وما الذي ثبتناه؟\n  الطالب: يحددون: المتغير مساحة الفتحة، والثوابت الحجم الأولي والمكان والمدة.\n• جدول وتنبؤ (4 دقائق):\n  المعلم: يعرض جدول ص49.\n  الطالب: يكتبون تنبؤاتهم: الصينية تفقد أكثر.\n• الغلق (3 دقائق):\n  المعلم: يحدد موعد القياس بعد ثلاثة أيام.\n  الطالب: يستعدون.\nالمجموع: 40 دقيقة\n\nالحصة 3: تحليل نتائج استقصاء التبخر\n• التهيئة (4 دقائق):\n  المعلم: يعرض الجداول.\n  الطالب: يقرؤون الأرقام.\n• تحليل النتائج (10 دقائق):\n  المعلم: يعرض بيانات نموذجية كاملة لخمسة أيام إلى جانب بيانات الطلاب.\n  الطالب: يحددون النمط: الماء في المكان الدافئ يقل أسرع.\n• ورقة العمل 3-3 (10 دقائق):\n  المعلم: يقدم ورقة العمل 3-3 (ارسم تمثيلًا بيانيًا يوضح عملية التبخر) ص75.\n  الطالب: يرسمون التمثيل البياني ويحددون نوعه المناسب.\n• أسئلة ص48–49 (8 دقائق):\n  المعلم: يناقش أسئلة النشاطين.\n  الطالب: يجيبون: النمط، نوع التمثيل، الدلائل الكافية، أثر الرياح، الفرق بين الأوعية، عدالة الاختبار.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 3-3.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\n1. (مستوى الدعم) كم مليلترًا وضعنا في كل وعاء؟\n   الإجابة النموذجية: 200 ml.\n2. (المستوى المتوقع) أين وضعنا الوعاءين؟\n   الإجابة النموذجية: أحدهما في مكان بارد والآخر في مكان دافئ.\n3. (المستوى المتقدم) ما النمط الذي تتنبأ به في النتائج؟\n   الإجابة النموذجية: سيقل حجم الماء في الوعاء الدافئ أسرع من البارد يومًا بعد يوم.\n\nالحصة 2: نشاط 3-3ب: أثر المساحة السطحية في التبخر\n1. (مستوى الدعم) ما العامل الذي غيرناه في نشاط 3-3ب؟\n   الإجابة النموذجية: مساحة سطح فتحة الوعاء.\n2. (المستوى المتوقع) أي الورقتين جفت أسرع: المطوية أم المفرودة؟\n   الإجابة النموذجية: المفرودة.\n3. (المستوى المتقدم) لماذا جفت الورقة المفرودة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها المكشوفة للهواء أكبر فيتبخر الماء منها أسرع.\n\nالحصة 3: تحليل نتائج استقصاء التبخر\n1. (مستوى الدعم) ما النمط الذي تلاحظه في نتائج نشاط 3-3أ؟\n   الإجابة النموذجية: يقل حجم الماء في الوعاء الدافئ أسرع من البارد.\n2. (المستوى المتوقع) ما نوع التمثيل المناسب لتغير حجم الماء يومًا بعد يوم؟\n   الإجابة النموذجية: التمثيل الخطي.\n3. (المستوى المتقدم) كيف تعدّل الاستقصاء لمعرفة أثر الرياح في التبخر؟\n   الإجابة النموذجية: نضع وعاءين متماثلين في المكان نفسه، ونوجه مروحة نحو أحدهما فقط، ونقارن الحجم المتبقي.", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\n1. (مستوى الدعم) صح أم خطأ: يجب أن يكون الوعاءان متماثلين في الحجم والشكل.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) كيف نقيس حجم الماء المتبقي في الوعاء؟\n   الإجابة النموذجية: نسكبه في المخبار المدرج ونقرأ الحجم ثم نعيده إلى الوعاء.\n3. (المستوى المتقدم) لماذا نقيس الحجم كل يوم وليس في اليوم الأخير فقط؟\n   الإجابة النموذجية: لنرى النمط والتغير يومًا بعد يوم ونحصل على بيانات أكثر.\n\nالحصة 2: نشاط 3-3ب: أثر المساحة السطحية في التبخر\n1. (مستوى الدعم) صح أم خطأ: وضعنا كميات مختلفة من الماء في الأوعية.\n   الإجابة النموذجية: خطأ؛ 100 ml في كل وعاء.\n2. (المستوى المتوقع) تنبأ: أي وعاء سيفقد أكبر كمية من الماء؟\n   الإجابة النموذجية: الصينية لأن مساحة سطحها أكبر.\n3. (المستوى المتقدم) لماذا تُفرد الملابس المغسولة على الحبل بدل تركها مكومة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية المعرضة للهواء فتجف أسرع.\n\nالحصة 3: تحليل نتائج استقصاء التبخر\n1. (مستوى الدعم) صح أم خطأ: الوعاء ذو الفتحة الأوسع يفقد ماءً أكثر بالتبخر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) كيف تتأكد من صحة استنتاجك عن التبخر؟\n   الإجابة النموذجية: بتكرار الاستقصاء عدة مرات وجمع دلائل كافية.\n3. (المستوى المتقدم) لماذا تفقد البرك الضحلة ماءً أكثر بالتبخر من البرك العميقة (بالكمية نفسها)؟\n   الإجابة النموذجية: لأن مساحة سطحها المكشوفة للهواء أكبر.", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)\nللطالب: المشاركة في القياس اليومي وتسجيل الحجم في الجدول. لولي الأمر: تذكير الابن بإحضار أوعية مختلفة الفتحات (صحن، كوب، علبة) للحصة القادمة.\n\nالحصة 2: نشاط 3-3ب: أثر المساحة السطحية في التبخر\nللطالب: متابعة الأوعية وتسجيل الحجم بعد ثلاثة أيام. لولي الأمر: مناقشة الابن في سبب نشر الملابس مفرودة.\n\nالحصة 3: تحليل نتائج استقصاء التبخر\nللطالب: حل تمرين 3-3 بكتاب النشاط ص33، وإكمال ورقة العمل 3-3 ص75. لولي الأمر: تحضير ملعقة سكر وكوب ماء مع الابن لملاحظة الذوبان قبل الدرس القادم."]}, {"code": "3-4", "title": "استقصاء التبخر من المحلول", "unit": 3, "dates": "الأسبوع الثاني عشر (22–26/11/2026م)", "sb": "50–51", "tb": "66–68", "ab": "تمرين 3-4 ص34، ورقة العمل 3-4 ص77", "periods": [{"n": 1, "topic": "المحاليل: المادة المذابة والمادة المذيبة", "f": ["1. يعرّف المحلول والمادة المذابة والمادة المذيبة\n2. يحدد المادة المذابة والمادة المذيبة في محاليل مألوفة\nمخرج تعليمي آخر: يفسر سبب عدم رؤية المادة المذابة بعد ذوبانها", "المخرج 1 (يعرّف المحلول والمادة المذابة والمادة المذيبة): تذكر\nالمخرج 2 (يحدد المادة المذابة والمادة المذيبة في محاليل مألوفة): تطبيق\nالمخرج الآخر (يفسر سبب عدم رؤية المادة المذابة بعد ذوبانها): فهم", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: كأس شاي أو ماء، سكر، ملح، ملعقة", "المحلول، المادة المذابة، المادة المذيبة، تذوب.", "يضع المعلم ملعقة سكر في كأس ماء ويحركها حتى تختفي، ويسأل: «أين ذهب السكر؟ هل اختفى أم ما زال موجودًا؟ كيف نتأكد؟».", "• التهيئة (5 دقائق):\n  المعلم: ينفذ العرض ويطرح السؤال.\n  الطالب: يتوقعون أنه موجود لأن الماء أصبح حلوًا.\n• مفهوم المحلول (10 دقائق):\n  المعلم: يشرح من ص50: المحلول يتكون من مادة مذابة (تذوب) ومادة مذيبة (السائل الذي تذوب فيه).\n  الطالب: يكتبون التعريفات ويحددون المذاب والمذيب في محلول السكر.\n• تصنيف محاليل (10 دقائق):\n  المعلم: يعرض أمثلة: شاي بسكر، ماء البحر، عصير مركز مع ماء.\n  الطالب: يحددون المادة المذابة والمادة المذيبة في كل محلول.\n• نموذج الجزيئات (10 دقائق):\n  المعلم: يرسم على السبورة جزيئات المذاب تتوزع بالتساوي بين جزيئات المذيب.\n  الطالب: يفسرون سبب عدم رؤية المادة المذابة.\n• الغلق (5 دقائق):\n  المعلم: يعرض صورة الملاحات ص50 ويسأل: من أين يأتي الملح؟\n  الطالب: يتوقعون: من ماء البحر.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. (المستوى المتوقع) في محلول السكر والماء، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n3. (المستوى المتقدم) لماذا لا نرى السكر بعد ذوبانه؟\n   الإجابة النموذجية: لأن جزيئاته توزعت بالتساوي بين جزيئات الماء.", "1. (مستوى الدعم) أكمل: المادة التي تذوب تسمى …… والسائل الذي تذوب فيه يسمى ……\n   الإجابة النموذجية: المادة المذابة؛ المادة المذيبة.\n2. (المستوى المتوقع) حدد المادة المذابة والمذيبة في ماء البحر.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (المستوى المتقدم) كيف تثبت أن الملح ما زال موجودًا في الماء رغم أنك لا تراه؟\n   الإجابة النموذجية: بتذوق الماء (بإشراف المعلم) أو بتبخير الماء فيبقى الملح.", "للطالب: قراءة كتاب الطالب ص50، وكتابة مثالين لمحاليل في المطبخ. لولي الأمر: مساعدة الابن في تحديد المذاب والمذيب في محاليل منزلية (شاي، قهوة، عصير)."]}, {"n": 2, "topic": "نشاط 3-4أ: تحضير محلول", "f": ["1. يحضر محلولًا من بلورات كبريتات النحاس والماء\n2. يصف ما يحدث للبلورات عند ذوبانها\nمخرج تعليمي آخر: يحدد المادة المذابة والمادة المذيبة في المحلول الذي حضّره", "المخرج 1 (يحضر محلولًا من بلورات كبريتات النحاس والماء): تطبيق\nالمخرج 2 (يصف ما يحدث للبلورات عند ذوبانها): فهم\nالمخرج الآخر (يحدد المادة المذابة والمادة المذيبة في المحلول الذي حضّره): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، أخرى: بلورات كبريتات النحاس، كأس زجاجية، ملعقة صغيرة، ماء، قفازات", "المحلول، البلورات، المادة المذابة، المادة المذيبة.", "يعرض المعلم بلورات زرقاء لامعة ويسأل: «ماذا تتوقعون أن يحدث لهذه البلورات إذا وضعناها في الماء؟ هل سيتغير لون الماء؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض البلورات ويطرح السؤال.\n  الطالب: يتنبؤون.\n• السلامة (5 دقائق):\n  المعلم: يوضح أن كبريتات النحاس ضارة إذا ابتُلعت، ويُلزم بلبس القفازات وعدم لمس العين وغسل اليدين.\n  الطالب: يلتزمون بالتعليمات.\n• نشاط 3-4أ (15 دقيقة):\n  المعلم: يتابع وفق ص50.\n  الطالب: يملؤون ثلاثة أرباع الكأس بالماء، ويضيفون ملعقة صغيرة من البلورات، ويلاحظون ويرسمون ما يحدث ويسمونه.\n• أسئلة النشاط (8 دقائق):\n  المعلم: يناقش أسئلة النشاط (3–6).\n  الطالب: يصفون: تختفي البلورات ويتلون الماء بالأزرق، لا نرى أجزاء صلبة، المذابة كبريتات النحاس والمذيبة الماء.\n• الغلق (7 دقائق):\n  المعلم: يربط بنموذج الجزيئات.\n  الطالب: يفسرون انتشار اللون بتوزع جزيئات المذاب.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ماذا حدث للبلورات في الماء؟\n   الإجابة النموذجية: ذابت واختفت وأصبح لون الماء أزرق.\n2. (المستوى المتوقع) هل يمكنك رؤية بلورات صلبة في المحلول؟\n   الإجابة النموذجية: لا.\n3. (المستوى المتقدم) ما المادة المذابة وما المادة المذيبة في هذا النشاط؟\n   الإجابة النموذجية: المذابة: كبريتات النحاس، المذيبة: الماء.", "1. (مستوى الدعم) صح أم خطأ: يمكن رؤية المادة المذابة في المحلول بعد ذوبانها.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) لماذا نلبس القفازات عند استخدام كبريتات النحاس؟\n   الإجابة النموذجية: لأنها مادة ضارة يجب عدم لمسها أو ابتلاعها.\n3. (المستوى المتقدم) لماذا انتشر اللون الأزرق في الماء كله؟\n   الإجابة النموذجية: لأن جزيئات كبريتات النحاس توزعت بالتساوي بين جزيئات الماء.", "للطالب: رسم الكأس قبل الذوبان وبعده وتسمية المذاب والمذيب. لولي الأمر: مناقشة الابن في سبب عدم رؤية السكر في الشاي رغم وجوده."]}, {"n": 3, "topic": "نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)", "f": ["1. يخطط لاستقصاء استعادة الملح الصلب من محلول ملحي بالتبخر\n2. يحضر محلولًا ملحيًا بقياس الكتلة والحجم بدقة\nمخرج تعليمي آخر: يتنبأ بما سيحدث عند تبخير المحلول ويعلل تنبؤه", "المخرج 1 (يخطط لاستقصاء استعادة الملح الصلب من محلول ملحي بالتبخر): تطبيق\nالمخرج 2 (يحضر محلولًا ملحيًا بقياس الكتلة والحجم بدقة): تطبيق\nالمخرج الآخر (يتنبأ بما سيحدث عند تبخير المحلول ويعلل تنبؤه): تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالاكتشاف", "الكتاب، السبورة الذكية، أخرى: ملح، ماء، مخبار مدرج، ميزان إلكتروني، وعاء صغير، ملعقة صغيرة", "المحلول، التبخر، المادة المذابة، المادة المذيبة.", "يطرح المعلم مشكلة: «سقط ملح في ماء فذاب، وأنت تحتاج إلى الملح! كيف تستعيده؟ تذكّر ما تعلمته عن التبخر».", "• التهيئة (5 دقائق):\n  المعلم: يطرح المشكلة.\n  الطالب: يقترحون تبخير الماء.\n• التخطيط (8 دقائق):\n  المعلم: يناقش خطوات نشاط 3-4ب ص51 (أين نضع الوعاء؟ كم نحتاج من الوقت؟).\n  الطالب: يكتبون خطة مختصرة.\n• تحضير المحلول (12 دقيقة):\n  المعلم: يوضح استخدام الميزان الإلكتروني والمخبار.\n  الطالب: يزنون 5 g من الملح ويذيبونها في 50 ml من الماء.\n• التنبؤ والرسم (7 دقائق):\n  المعلم: يطلب كتابة التنبؤ ورسم الأدوات والخطوات.\n  الطالب: يتنبؤون ببقاء الملح بعد تبخر الماء ويرسمون الخطوات.\n• الإعداد (5 دقائق):\n  المعلم: يحدد مكانًا دافئًا مشمسًا للأوعية.\n  الطالب: يضعون الوعاء في المكان المحدد.\n• الغلق (3 دقائق):\n  المعلم: يسأل: كم يومًا نحتاج؟\n  الطالب: يقدرون المدة.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) كم غرامًا من الملح أذبنا في 50 ml من الماء؟\n   الإجابة النموذجية: 5 g.\n2. (المستوى المتوقع) ما الأداة التي استخدمناها لقياس كتلة الملح؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. (المستوى المتقدم) تنبأ بما سيبقى في الوعاء بعد تبخر الماء.\n   الإجابة النموذجية: سيبقى الملح الصلب (بلورات الملح).", "1. (مستوى الدعم) صح أم خطأ: يتبخر الملح مع الماء.\n   الإجابة النموذجية: خطأ؛ يتبخر الماء ويبقى الملح.\n2. (المستوى المتوقع) أين يجب وضع الوعاء ليتبخر الماء أسرع؟\n   الإجابة النموذجية: في مكان دافئ مشمس.\n3. (المستوى المتقدم) اقترح طريقتين لتسريع الحصول على الملح.\n   الإجابة النموذجية: استخدام وعاء واسع (مساحة سطح أكبر)، وضعه في مكان أدفأ أو توجيه مروحة نحوه، أو استخدام كمية أقل من الماء.", "للطالب: متابعة الوعاء يوميًا ورسم ما يلاحظه. لولي الأمر: مناقشة الابن في مصدر ملح الطعام."]}, {"n": 4, "topic": "نتائج استعادة الملح والأسئلة", "f": ["1. يستنتج أنه يمكن استعادة المادة الصلبة المذابة بتبخر السائل\n2. يشرح أين يذهب السائل عندما يتبخر من المحلول\nمخرج تعليمي آخر: يقترح طريقتين للحصول على النتائج بسرعة أكبر", "المخرج 1 (يستنتج أنه يمكن استعادة المادة الصلبة المذابة بتبخر السائل): فهم\nالمخرج 2 (يشرح أين يذهب السائل عندما يتبخر من المحلول): فهم\nالمخرج الآخر (يقترح طريقتين للحصول على النتائج بسرعة أكبر): إبداع", "التعلم بالاكتشاف، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: أوعية نشاط 3-4ب، عدسة مكبرة", "المحلول، التبخر، البلورات.", "يعرض المعلم أوعية المحلول الملحي بعد التبخر ويطلب من الطلاب فحص ما تبقى فيها بالعدسة المكبرة.", "• التهيئة (4 دقائق):\n  المعلم: يعرض الأوعية.\n  الطالب: يفحصون البلورات.\n• الملاحظة (8 دقائق):\n  المعلم: يسأل: ماذا بقي؟ أين ذهب الماء؟\n  الطالب: يصفون بلورات الملح البيضاء ويستنتجون أن الماء تبخر.\n• أسئلة ص51 (10 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن صحة التنبؤ، وطريقتين لتسريع النتائج، ويختارون «من الممكن» فصل الصلبة عن السائلة بالتبخر.\n• الملاحات (10 دقائق):\n  المعلم: يعرض صورة الملاحات ص50 ويشرح كيف يستخلص الملح من ماء البحر بالتبخر.\n  الطالب: يربطون النشاط بالملاحات.\n• تحدث عن (8 دقائق):\n  المعلم: يطرح سؤال ص51: عصير التفاح مع الماء، هل هو محلول؟\n  الطالب: يناقشون: نعم، مواد العصير تذوب في الماء ولا نراها منفصلة.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ماذا بقي في الوعاء بعد تبخر الماء؟\n   الإجابة النموذجية: بلورات الملح.\n2. (المستوى المتوقع) أين ذهب الماء؟\n   الإجابة النموذجية: تبخر إلى الهواء.\n3. (المستوى المتقدم) هل كان تنبؤك صحيحًا؟ وضّح.\n   الإجابة النموذجية: تقبل الإجابة المبررة بمقارنة التنبؤ بالملاحظة.", "1. (مستوى الدعم) أكمل: لقد اكتشفت أنه من …… فصل المادة الصلبة عن السائلة باستخدام التبخر.\n   الإجابة النموذجية: الممكن.\n2. (المستوى المتوقع) كيف يُستخلص الملح من ماء البحر في الملاحات؟\n   الإجابة النموذجية: يوضع ماء البحر في أحواض واسعة ضحلة تحت الشمس فيتبخر الماء ويبقى الملح.\n3. (المستوى المتقدم) لماذا تُصنع أحواض الملاحات واسعة وضحلة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية فيتبخر الماء أسرع.", "للطالب: مراجعة كتاب الطالب ص50–51 وكتابة الاستنتاج. لولي الأمر: إحضار قليل من الرمل النظيف للنشاط القادم."]}, {"n": 5, "topic": "ورقة العمل 3-4: فصل الملح عن الرمل", "f": ["1. يخطط لفصل مخلوط من الملح والرمل باستخدام الإذابة والترشيح والتبخير\n2. يحدد المادة المذابة والمذيبة في محلول الملح\nمخرج تعليمي آخر: يقيّم أهمية ترتيب خطوات الفصل", "المخرج 1 (يخطط لفصل مخلوط من الملح والرمل باستخدام الإذابة والترشيح والتبخير): تطبيق\nالمخرج 2 (يحدد المادة المذابة والمذيبة في محلول الملح): تذكر\nالمخرج الآخر (يقيّم أهمية ترتيب خطوات الفصل): تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة العمل 3-4 ص77، ملح، رمل  الماء؟ هل سيتغير لون الماء؟».\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\nيطرح المعلم مشكلة: «سقط ملح في ماء فذاب، وأنت تحتاج إلى الملح! كيف تستعيده؟ تذكّر ما تعلمته عن التبخر».\n\nالحصة 4: نتائج استعادة الملح والأسئلة\nيعرض المعلم أوعية المحلول الملحي بعد التبخر ويطلب من الطلاب فحص ما تبقى فيها بالعدسة المكبرة.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\nيخلط المعلم ملعقة ملح بملعقة رمل أمام الطلاب ويسأل: «كيف نفصل الملح عن الرمل؟ لا يمكننا التقاط حبات الملح واحدة واحدة!».", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\n• التهيئة (5 دقائق):\n  المعلم: ينفذ العرض ويطرح السؤال.\n  الطالب: يتوقعون أنه موجود لأن الماء أصبح حلوًا.\n• مفهوم المحلول (10 دقائق):\n  المعلم: يشرح من ص50: المحلول يتكون من مادة مذابة (تذوب) ومادة مذيبة (السائل الذي تذوب فيه).\n  الطالب: يكتبون التعريفات ويحددون المذاب والمذيب في محلول السكر.\n• تصنيف محاليل (10 دقائق):\n  المعلم: يعرض أمثلة: شاي بسكر، ماء البحر، عصير مركز مع ماء.\n  الطالب: يحددون المادة المذابة والمادة المذيبة في كل محلول.\n• نموذج الجزيئات (10 دقائق):\n  المعلم: يرسم على السبورة جزيئات المذاب تتوزع بالتساوي بين جزيئات المذيب.\n  الطالب: يفسرون سبب عدم رؤية المادة المذابة.\n• الغلق (5 دقائق):\n  المعلم: يعرض صورة الملاحات ص50 ويسأل: من أين يأتي الملح؟\n  الطالب: يتوقعون: من ماء البحر.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 3-4أ: تحضير محلول\n• التهيئة (5 دقائق):\n  المعلم: يعرض البلورات ويطرح السؤال.\n  الطالب: يتنبؤون.\n• السلامة (5 دقائق):\n  المعلم: يوضح أن كبريتات النحاس ضارة إذا ابتُلعت، ويُلزم بلبس القفازات وعدم لمس العين وغسل اليدين.\n  الطالب: يلتزمون بالتعليمات.\n• نشاط 3-4أ (15 دقيقة):\n  المعلم: يتابع وفق ص50.\n  الطالب: يملؤون ثلاثة أرباع الكأس بالماء، ويضيفون ملعقة صغيرة من البلورات، ويلاحظون ويرسمون ما يحدث ويسمونه.\n• أسئلة النشاط (8 دقائق):\n  المعلم: يناقش أسئلة النشاط (3–6).\n  الطالب: يصفون: تختفي البلورات ويتلون الماء بالأزرق، لا نرى أجزاء صلبة، المذابة كبريتات النحاس والمذيبة الماء.\n• الغلق (7 دقائق):\n  المعلم: يربط بنموذج الجزيئات.\n  الطالب: يفسرون انتشار اللون بتوزع جزيئات المذاب.\nالمجموع: 40 دقيقة\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\n• التهيئة (5 دقائق):\n  المعلم: يطرح المشكلة.\n  الطالب: يقترحون تبخير الماء.\n• التخطيط (8 دقائق):\n  المعلم: يناقش خطوات نشاط 3-4ب ص51 (أين نضع الوعاء؟ كم نحتاج من الوقت؟).\n  الطالب: يكتبون خطة مختصرة.\n• تحضير المحلول (12 دقيقة):\n  المعلم: يوضح استخدام الميزان الإلكتروني والمخبار.\n  الطالب: يزنون 5 g من الملح ويذيبونها في 50 ml من الماء.\n• التنبؤ والرسم (7 دقائق):\n  المعلم: يطلب كتابة التنبؤ ورسم الأدوات والخطوات.\n  الطالب: يتنبؤون ببقاء الملح بعد تبخر الماء ويرسمون الخطوات.\n• الإعداد (5 دقائق):\n  المعلم: يحدد مكانًا دافئًا مشمسًا للأوعية.\n  الطالب: يضعون الوعاء في المكان المحدد.\n• الغلق (3 دقائق):\n  المعلم: يسأل: كم يومًا نحتاج؟\n  الطالب: يقدرون المدة.\nالمجموع: 40 دقيقة\n\nالحصة 4: نتائج استعادة الملح والأسئلة\n• التهيئة (4 دقائق):\n  المعلم: يعرض الأوعية.\n  الطالب: يفحصون البلورات.\n• الملاحظة (8 دقائق):\n  المعلم: يسأل: ماذا بقي؟ أين ذهب الماء؟\n  الطالب: يصفون بلورات الملح البيضاء ويستنتجون أن الماء تبخر.\n• أسئلة ص51 (10 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن صحة التنبؤ، وطريقتين لتسريع النتائج، ويختارون «من الممكن» فصل الصلبة عن السائلة بالتبخر.\n• الملاحات (10 دقائق):\n  المعلم: يعرض صورة الملاحات ص50 ويشرح كيف يستخلص الملح من ماء البحر بالتبخر.\n  الطالب: يربطون النشاط بالملاحات.\n• تحدث عن (8 دقائق):\n  المعلم: يطرح سؤال ص51: عصير التفاح مع الماء، هل هو محلول؟\n  الطالب: يناقشون: نعم، مواد العصير تذوب في الماء ولا نراها منفصلة.\nالمجموع: 40 دقيقة\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\n• التهيئة (4 دقائق):\n  المعلم: يعرض المخلوط ويطرح السؤال.\n  الطالب: يقترحون أفكارًا.\n• التخطيط (8 دقائق):\n  المعلم: يقدم ورقة العمل 3-4 ص77 ويوجه إلى التفكير: ماذا يذوب؟ ماذا لا يذوب؟\n  الطالب: يخططون: إضافة الماء لإذابة الملح، الترشيح لفصل الرمل، تبخير الماء لاستعادة الملح.\n• التنفيذ (12 دقيقة):\n  المعلم: يعرض طريقة طي ورق الترشيح ويتابع.\n  الطالب: يذيبون المخلوط في الماء ويرشحونه، ويضعون المحلول الراشح في طبق للتبخير.\n• تمرين 3-4 (8 دقائق):\n  المعلم: يقدم تمرين 3-4 بكتاب النشاط ص34.\n  الطالب: يحلون التمرين.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 3-4.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\n1. (مستوى الدعم) ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. (المستوى المتوقع) في محلول السكر والماء، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n3. (المستوى المتقدم) لماذا لا نرى السكر بعد ذوبانه؟\n   الإجابة النموذجية: لأن جزيئاته توزعت بالتساوي بين جزيئات الماء.\n\nالحصة 2: نشاط 3-4أ: تحضير محلول\n1. (مستوى الدعم) ماذا حدث للبلورات في الماء؟\n   الإجابة النموذجية: ذابت واختفت وأصبح لون الماء أزرق.\n2. (المستوى المتوقع) هل يمكنك رؤية بلورات صلبة في المحلول؟\n   الإجابة النموذجية: لا.\n3. (المستوى المتقدم) ما المادة المذابة وما المادة المذيبة في هذا النشاط؟\n   الإجابة النموذجية: المذابة: كبريتات النحاس، المذيبة: الماء.\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\n1. (مستوى الدعم) كم غرامًا من الملح أذبنا في 50 ml من الماء؟\n   الإجابة النموذجية: 5 g.\n2. (المستوى المتوقع) ما الأداة التي استخدمناها لقياس كتلة الملح؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. (المستوى المتقدم) تنبأ بما سيبقى في الوعاء بعد تبخر الماء.\n   الإجابة النموذجية: سيبقى الملح الصلب (بلورات الملح).\n\nالحصة 4: نتائج استعادة الملح والأسئلة\n1. (مستوى الدعم) ماذا بقي في الوعاء بعد تبخر الماء؟\n   الإجابة النموذجية: بلورات الملح.\n2. (المستوى المتوقع) أين ذهب الماء؟\n   الإجابة النموذجية: تبخر إلى الهواء.\n3. (المستوى المتقدم) هل كان تنبؤك صحيحًا؟ وضّح.\n   الإجابة النموذجية: تقبل الإجابة المبررة بمقارنة التنبؤ بالملاحظة.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\n1. (مستوى الدعم) لماذا أضفنا الماء إلى مخلوط الملح والرمل؟\n   الإجابة النموذجية: لإذابة الملح.\n2. (المستوى المتوقع) ماذا بقي على ورق الترشيح؟\n   الإجابة النموذجية: الرمل.\n3. (المستوى المتقدم) ماذا نفعل بالمحلول الراشح لاستعادة الملح؟\n   الإجابة النموذجية: نبخر الماء منه فيبقى الملح.", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\n1. (مستوى الدعم) أكمل: المادة التي تذوب تسمى …… والسائل الذي تذوب فيه يسمى ……\n   الإجابة النموذجية: المادة المذابة؛ المادة المذيبة.\n2. (المستوى المتوقع) حدد المادة المذابة والمذيبة في ماء البحر.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (المستوى المتقدم) كيف تثبت أن الملح ما زال موجودًا في الماء رغم أنك لا تراه؟\n   الإجابة النموذجية: بتذوق الماء (بإشراف المعلم) أو بتبخير الماء فيبقى الملح.\n\nالحصة 2: نشاط 3-4أ: تحضير محلول\n1. (مستوى الدعم) صح أم خطأ: يمكن رؤية المادة المذابة في المحلول بعد ذوبانها.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) لماذا نلبس القفازات عند استخدام كبريتات النحاس؟\n   الإجابة النموذجية: لأنها مادة ضارة يجب عدم لمسها أو ابتلاعها.\n3. (المستوى المتقدم) لماذا انتشر اللون الأزرق في الماء كله؟\n   الإجابة النموذجية: لأن جزيئات كبريتات النحاس توزعت بالتساوي بين جزيئات الماء.\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\n1. (مستوى الدعم) صح أم خطأ: يتبخر الملح مع الماء.\n   الإجابة النموذجية: خطأ؛ يتبخر الماء ويبقى الملح.\n2. (المستوى المتوقع) أين يجب وضع الوعاء ليتبخر الماء أسرع؟\n   الإجابة النموذجية: في مكان دافئ مشمس.\n3. (المستوى المتقدم) اقترح طريقتين لتسريع الحصول على الملح.\n   الإجابة النموذجية: استخدام وعاء واسع (مساحة سطح أكبر)، وضعه في مكان أدفأ أو توجيه مروحة نحوه، أو استخدام كمية أقل من الماء.\n\nالحصة 4: نتائج استعادة الملح والأسئلة\n1. (مستوى الدعم) أكمل: لقد اكتشفت أنه من …… فصل المادة الصلبة عن السائلة باستخدام التبخر.\n   الإجابة النموذجية: الممكن.\n2. (المستوى المتوقع) كيف يُستخلص الملح من ماء البحر في الملاحات؟\n   الإجابة النموذجية: يوضع ماء البحر في أحواض واسعة ضحلة تحت الشمس فيتبخر الماء ويبقى الملح.\n3. (المستوى المتقدم) لماذا تُصنع أحواض الملاحات واسعة وضحلة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية فيتبخر الماء أسرع.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\n1. (مستوى الدعم) صح أم خطأ: يذوب الرمل في الماء.\n   الإجابة النموذجية: خطأ.\n2. (المستوى المتوقع) حدد المادة المذابة والمذيبة في الماء المالح.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (المستوى المتقدم) لماذا يجب الترشيح قبل التبخير؟\n   الإجابة النموذجية: لنفصل الرمل أولًا؛ لو بخرنا قبل الترشيح لبقي الملح مخلوطًا بالرمل.", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\nللطالب: قراءة كتاب الطالب ص50، وكتابة مثالين لمحاليل في المطبخ. لولي الأمر: مساعدة الابن في تحديد المذاب والمذيب في محاليل منزلية (شاي، قهوة، عصير).\n\nالحصة 2: نشاط 3-4أ: تحضير محلول\nللطالب: رسم الكأس قبل الذوبان وبعده وتسمية المذاب والمذيب. لولي الأمر: مناقشة الابن في سبب عدم رؤية السكر في الشاي رغم وجوده.\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\nللطالب: متابعة الوعاء يوميًا ورسم ما يلاحظه. لولي الأمر: مناقشة الابن في مصدر ملح الطعام.\n\nالحصة 4: نتائج استعادة الملح والأسئلة\nللطالب: مراجعة كتاب الطالب ص50–51 وكتابة الاستنتاج. لولي الأمر: إحضار قليل من الرمل النظيف للنشاط القادم.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\nللطالب: حل تمرين 3-4 بكتاب النشاط ص34، وإكمال ورقة العمل 3-4 ص77. لولي الأمر: مناقشة الابن في خطوات فصل الملح عن الرمل وأهمية ترتيبها."]}, {"code": "3-5", "title": "التكثيف", "unit": 3, "dates": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "sb": "52–53", "tb": "69–70", "ab": "تمرين 3-5 ص35", "periods": [{"n": 1, "topic": "مفهوم التكثيف", "f": ["1. يعرّف التكثيف بأنه تحول المادة من الحالة الغازية إلى الحالة السائلة\n2. يوضح أن التكثيف عكس التبخر\nمخرج تعليمي آخر: يفسر تكوّن قطرات الماء على سطح بارد بلغة الجزيئات", "المخرج 1 (يعرّف التكثيف بأنه تحول المادة من الحالة الغازية إلى الحالة السائلة): تذكر\nالمخرج 2 (يوضح أن التكثيف عكس التبخر): فهم\nالمخرج الآخر (يفسر تكوّن قطرات الماء على سطح بارد بلغة الجزيئات): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: مرآة صغيرة، علبة مشروب باردة", "التكثيف، بخار الماء، عكس، يبرد.", "يطلب المعلم من الطلاب التنفس على مرآة صغيرة أو زجاج النافذة كما في ص52، ويسأل: «ماذا ترى؟ من أين جاءت هذه القطرات الصغيرة؟».", "• التهيئة (5 دقائق):\n  المعلم: ينفذ نشاط التنفس على المرآة.\n  الطالب: يلاحظون الضباب والقطرات الصغيرة.\n• مفهوم التكثيف (10 دقائق):\n  المعلم: يشرح ص52: هواء الزفير يحتوي على بخار ماء، وعندما يلامس سطحًا باردًا يبرد ويتحول إلى قطرات سائلة (التكثيف).\n  الطالب: يكتبون التعريف: غاز ← سائل.\n• عكس التبخر (8 دقائق):\n  المعلم: يرسم سهمين: سائل ⇄ غاز.\n  الطالب: يكتبون التبخر في اتجاه والتكثيف في الاتجاه المعاكس.\n• نموذج الجزيئات (9 دقائق):\n  المعلم: يمثّل بطلاب «جزيئات غاز» تتحرك بسرعة ثم تفقد طاقة فتبطؤ وتقترب.\n  الطالب: يصفون ما يحدث لجزيئات الغاز عند التبريد.\n• علبة المشروب (5 دقائق):\n  المعلم: يعرض صورة العلبة الباردة ص52.\n  الطالب: يفسرون القطرات على سطحها الخارجي.\n• الغلق (3 دقائق):\n  المعلم: يسأل: ما الفرق بين التبخر والتكثيف؟\n  الطالب: يجيبون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما التكثيف؟\n   الإجابة النموذجية: تحول المادة من الحالة الغازية إلى الحالة السائلة.\n2. (المستوى المتوقع) لماذا تكوّن الضباب على المرآة عند التنفس عليها؟\n   الإجابة النموذجية: لأن بخار الماء في هواء الزفير برد عند ملامسة المرآة الباردة فتكثف.\n3. (المستوى المتقدم) ماذا يحدث لجزيئات الغاز عندما يبرد؟\n   الإجابة النموذجية: تفقد بعض طاقتها فتبطؤ حركتها وتقترب من بعضها فيتكون السائل.", "1. (مستوى الدعم) صح أم خطأ: التكثيف عكس التبخر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) من أين تأتي القطرات على السطح الخارجي لعلبة مشروب باردة؟\n   الإجابة النموذجية: من بخار الماء الموجود في الهواء الذي يتكثف عند ملامسة العلبة الباردة.\n3. (المستوى المتقدم) لماذا لا تتكون قطرات على علبة في درجة حرارة الغرفة؟\n   الإجابة النموذجية: لأن سطحها ليس باردًا بدرجة كافية لتكثيف بخار الماء.", "للطالب: قراءة كتاب الطالب ص52، وملاحظة أمثلة على التكثيف في المنزل (زجاج الحمام، غطاء القدر). لولي الأمر: إحضار مكعبات ثلج في وعاء محكم للنشاط القادم."]}, {"n": 2, "topic": "نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب", "f": ["1. ينفذ نشاطًا يلاحظ فيه تكثف بخار الماء على سطح كأس باردة\n2. يستنتج أن الماء على السطح الخارجي جاء من بخار الماء في الهواء\nمخرج تعليمي آخر: يتأكد من عدالة الاختبار بالتحقق من جفاف الكأسين في البداية", "المخرج 1 (ينفذ نشاطًا يلاحظ فيه تكثف بخار الماء على سطح كأس باردة): تطبيق\nالمخرج ق (3 دقائق):\n  المعلم: يسأل: ما الفرق بين التبخر والتكثيف؟\n  الطالب: يجيبون.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب\n• التهيئة (4 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون: للتأكد من أنهما جافتان.\n• التخطيط (6 دقائق):\n  المعلم: يقرأ خطوات نشاط 3-5أ ص52.\n  الطالب: يحددون: كأس بها ثلج وأخرى بها ماء، ومدة 10 دقائق.\n• نشاط 3-5أ (13 دقيقة):\n  المعلم: يتابع وفق ص52.\n  الطالب: يمسحون الكأسين، ويضعون الثلج في إحداهما والماء في الأخرى، ويتركونهما 10 دقائق، ويلاحظون ويرسمون.\n• أسئلة النشاط (8 دقائق):\n  المعلم: يناقش الأسئلة (1–3) ص52.\n  الطالب: يستنتجون أن البلل ظهر على كأس الثلج من الخارج، وأن الماء جاء من بخار الهواء.\n• إعداد نشاط 3-5ب (9 دقائق):\n  المعلم: يوجه وفق ص53.\n  الطالب: يسكبون 100 ml في كأسين، ويحددون المستوى بالقلم، ويغطون إحداهما بإحكام بالبلاستيك، ويتركونهما في مكان دافئ حتى الغد.\nالمجموع: 40 دقيقة\n\nالحصة 3: نشاط 3-5ب: ملاحظة التبخر والتكثيف\n• التهيئة (4 دقائق):\n  المعلم: يعرض الكأسين.\n  الطالب: يلاحظون القطرات تحت البلاستيك.\n• الملاحظة والمقارنة (10 دقائق):\n  المعلم: يوجه إلى مقارنة المستويين.\n  الطالب: يلاحظون أن الماء في المكشوفة قل أكثر، وأن قطرات تكونت تحت البلاستيك في المغطاة.\n• أسئلة ص53 (10 دقائق):\n  المعلم: يناقش الأسئلة (1–4).\n  الطالب: يكملون: اكتسب الماء حرارة وتبخر ليكوّن بخار الماء، وفي المغطاة برد البخار وتكثف ليكوّن قطرات الماء على البلاستيك.\n• تمرين 3-5 (8 دقائق):\n  المعلم: يقدم تمرين 3-5 بكتاب النشاط ص35.\n  الطالب: يحلون التمرين.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 3-5.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: مفهوم التكثيف\n1. (مستوى الدعم) ما التكثيف؟\n   الإجابة النموذجية: تحول المادة من الحالة الغازية إلى الحالة السائلة.\n2. (المستوى المتوقع) لماذا تكوّن الضباب على المرآة عند التنفس عليها؟\n   الإجابة النموذجية: لأن بخار الماء في هواء الزفير برد عند ملامسة المرآة الباردة فتكثف.\n3. (المستوى المتقدم) ماذا يحدث لجزيئات الغاز عندما يبرد؟\n   الإجابة النموذجية: تفقد بعض طاقتها فتبطؤ حركتها وتقترب من بعضها فيتكون السائل.\n\nالحصة 2: نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب\n1. (مستوى الدعم) على أي الكأسين ظهر البلل من الخارج؟\n   الإجابة النموذجية: على الكأس التي بها ثلج.\n2. (المستوى المتوقع) من أين جاء الماء على السطح الخارجي للكأس؟\n   الإجابة النموذجية: من بخار الماء في الهواء الذي تكثف عند ملامسة الكأس الباردة.\n3. (المستوى المتقدم) لماذا مسحنا الكأسين في بداية النشاط؟\n   الإجابة النموذجية: لنتأكد أنهما جافتان فيكون أي بلل لاحق ناتجًا عن التكثيف.\n\nالحصة 3: نشاط 3-5ب: ملاحظة التبخر والتكثيف\n1. (مستوى الدعم) في أي الكأسين قل الماء أكثر؟\n   الإجابة النموذجية: الكأس المكشوفة.\n2. (المستوى المتوقع) ماذا تكون على البلاستيك في الكأس المغطاة؟\n   الإجابة النموذجية: قطرات ماء.\n3. (المستوى المتقدم) لماذا بقي الماء في الكأس المغطاة تقريبًا كما هو؟\n   الإجابة النموذجية: لأن بخار الماء لم يخرج؛ تكثف على البلاستيك وعاد إلى الكأس.", "الحصة 1: مفهوم التكثيف\n1. (مستوى الدعم) صح أم خطأ: التكثيف عكس التبخر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) من أين تأتي القطرات على السطح الخارجي لعلبة مشروب باردة؟\n   الإجابة النموذجية: من بخار الماء الموجود في الهواء الذي يتكثف عند ملامسة العلبة الباردة.\n3. (المستوى المتقدم) لماذا لا تتكون قطرات على علبة في درجة حرارة الغرفة؟\n   الإجابة النموذجية: لأن سطحها ليس باردًا بدرجة كافية لتكثيف بخار الماء.\n\nالحصة 2: نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب\n1. (مستوى الدعم) صح أم خطأ: تسرّب الماء من داخل الكأس إلى خارجها.\n   الإجابة النموذجية: خطأ؛ الماء جاء من الهواء.\n2. (المستوى المتوقع) لماذا لم يظهر بلل على كأس الماء العادي؟\n   الإجابة النموذجية: لأنها ليست باردة بما يكفي لتكثيف بخار الماء.\n3. (المستوى المتقدم) لماذا تتسم هذه العملية بأنها عكس عملية التبخر؟\n   الإجابة النموذجية: لأن التبخر يحول السائل إلى غاز، والتكثيف يحول الغاز إلى سائل.\n\nالحصة 3: نشاط 3-5ب: ملاحظة التبخر والتكثيف\n1. (مستوى الدعم) أكمل: اكتسب الماء في الكأس المكشوفة …… و…… ليكوّن بخار الماء.\n   الإجابة النموذجية: حرارة؛ تبخر.\n2. (المستوى المتوقع) في الكأس المغطاة، برد بخار الماء و…… ليكوّن …… على بلاستيك التغليف.\n   الإجابة النموذجية: تكثف؛ قطرات الم  الهواء؟\n   الإجابة النموذجية: يتكثف ليكوّن السحب.\n3. (المستوى المتقدم) كيف يعود الماء إلى الأرض؟\n   الإجابة النموذجية: بالهطول على شكل أمطار أو ثلوج أو برد.\n\nالحصة 2: أسئلة دورة الماء وورقة العمل 3-6: استخلاص الماء العذب\n1. (مستوى الدعم) أين يحدث التبخر في دورة الماء؟\n   الإجابة النموذجية: من سطح البحار والأنهار والبحيرات والتربة وأوراق النباتات.\n2. (المستوى المتوقع) أين يحدث التكثيف في دورة الماء؟\n   الإجابة النموذجية: في الهواء البارد أعلى لتكوين السحب.\n3. (المستوى المتقدم) في النظام الذي صممته، لماذا يكون الماء في العلبة عذبًا؟\n   الإجابة النموذجية: لأن الماء وحده يتبخر ويترك الملح، ثم يتكثف على الكيس ويقطر في العلبة.", "الحصة 1: مراحل دورة الماء في الطبيعة\n1. (مستوى الدعم) صح أم خطأ: تطلق النباتات بخار الماء من أوراقها.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) رتب: التكثيف، الهطول، التبخر.\n   الإجابة النموذجية: التبخر ← التكثيف ← الهطول.\n3. (المستوى المتقدم) لماذا تُعد دورة الماء مهمة لنا؟\n   الإجابة النموذجية: لأنها تعيد الماء العذب إلى الأرض باستمرار فنحصل على ماء الشرب والزراعة.\n\nالحصة 2: أسئلة دورة الماء وورقة العمل 3-6: استخلاص الماء العذب\n1. (مستوى الدعم) أكمل: الماء الموجود على سطح الأرض …… ويتحرك لأعلى في صورة بخار ماء.\n   الإجابة النموذجية: يتبخر.\n2. (المستوى المتوقع) أكمل: يبرد بخار الماء و…… نظرًا لارتفاعه في الهواء.\n   الإجابة النموذجية: يتكثف.\n3. (المستوى المتقدم) لماذا نضع حجرًا صغيرًا فوق الكيس في وسطه؟\n   الإجابة النموذجية: ليتجه الكيس إلى أسفل فوق العلبة فتتجمع قطرات الماء المتكثفة وتسقط فيها.", "الحصة 1: مراحل دورة الماء في الطبيعة\nللطالب: قراءة كتاب الطالب ص54، ورسم دورة الماء في الطبيعة. لولي الأمر: مناقشة الابن في مصادر المياه في المنطقة (الأفلاج، الآبار، محطات التحلية).\n\nالحصة 2: أسئلة دورة الماء وورقة العمل 3-6: استخلاص الماء العذب\nللطالب: حل تمرين 3-6 بكتاب النشاط ص36، وإكمال ورقة العمل 3-6 ص79. لولي الأمر: تنفيذ النظام في المنزل تحت الشمس مع الابن (بإشراف) وملاحظة النتيجة."]}, {"code": "3-7", "title": "الغليان", "unit": 3, "dates": "الأسبوع الرابع عشر (6–10/12/2026م)", "sb": "56–57", "tb": "73–75", "ab": "تمرين 3-7 ص37، ورقة العمل 3-7 ص81", "periods": [{"n": 1, "topic": "مفهوم الغليان وقواعد السلامة", "f": ["1. يعرّف الغليان ويصف ما يحدث للسائل عند غليانه\n2. يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي\nمخرج تعليمي آخر: يحدد قواعد السلامة عند التعامل مع الماء المغلي", "المخرج 1 (يعرّف الغليان ويصف ما يحدث للسائل عند غليانه): فهم\nالمخرج 2 (يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي): تحليل\nالمخرج الآخر (يحدد قواعد السلامة عند التعامل مع الماء المغلي): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: صورة إناء يغلي", "الغليان، يغلي، البخار، درجة الغليان.", "يعرض المعلم صورة الطالبين ص56 ويقرأ حوارهما: «الهواء فوق الإناء ساخن للغاية… لقد احترقت يدي ولم ألمس الإناء!»، ويسأل: «لماذا احترقت يد خالد دون أن يلمس الإناء؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويقرأ الحوار.\n  الطالب: يقترحون: البخار الساخن.\n• مفهوم الغليان (10 دقائق):\n  المعلم: يشرح ص56: عند تسخين الماء بدرجة كافية يغلي؛ تكتسب الجزيئات طاقة كبيرة فتتحرك بسرعة وتنفصل ويتحول الماء إلى بخار. سائل + حرارة ← غاز.\n  الطالب: يكتبون التعريف والمعادلة.\n• البخار والسحابة (8 دقائق):\n  المعلم: يوضح أن البخار غاز غير مرئي، والسحابة البيضاء فوق الإناء قطرات تكثفت عند ملامسة الهواء الأبرد.\n  الطالب: يرسمون إناءً يغلي ويحددون المنطقة غير المرئية والسحابة.\n• السلامة (10 دقائق):\n  المعلم: يناقش تحذير الأمن والسلامة ص56: الماء المغلي والبخار يسببان حروقًا.\n  الطالب: يكتبون ثلاث قواعد سلامة عند الغليان.\n• الغلق (7 دقائق):\n  المعلم: يقدم مفهوم درجة الغليان ويسأل عن توقعاتهم لدرجة غليان الماء.\n  الطالب: يتوقعون أرقامًا ويكتبونها.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ماذا يحدث للماء عندما يغلي؟\n   الإجابة النموذجية: يتحول من سائل إلى غاز (بخار).\n2. (المستوى المتوقع) لماذا احترقت يد خالد دون أن يلمس الإناء؟\n   الإجابة النموذجية: لأن البخار الساخن فوق الإناء يسبب الحروق.\n3. (المستوى المتقدم) هل السحابة البيضاء فوق الماء المغلي هي البخار؟ وضّح.\n   الإجابة النموذجية: لا؛ البخار غير مرئي، والسحابة قطرات ماء صغيرة تكثفت عندما برد البخار في الهواء.", "1. (مستوى الدعم) صح أم خطأ: البخار غاز غير مرئي.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر قاعدتين للسلامة عند غلي الماء.\n   الإجابة النموذجية: عدم تمرير اليد فوق الإناء، وعدم لمس الإناء الساخن، والابتعاد عن البخار (أي اثنتين).\n3. (المستوى المتقدم) ما الفرق بين الهواء فوق الماء البارد والهواء فوق الماء المغلي؟\n   الإجابة النموذجية: فوق الماء المغلي يوجد بخار ساخن جدًا يسبب الحروق، أما فوق الماء البارد فالهواء غير ساخن.", "للطالب: قراءة كتاب الطالب ص56، وكتابة قواعد السلامة في المطبخ. لولي الأمر: تعريف الابن بأماكن الخطر في المطبخ ومناقشة قواعد السلامة عند غلي الماء."]}, {"n": 2, "topic": "نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟", "f": ["1. يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان\n2. يصف مظهر الماء المغلي والفقاعات المتكونة\nمخرج تعليمي آخر: يفسر تكون الفقاعات داخل الماء المغلي", "المخرج 1 (يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان): فهم\nالمخرج 2 (يصف مظهر الماء المغلي والفقاعات المتكونة): فهم\nالمخرج الآخر (يفسر تكون الفقاعات داخل الماء المغلي): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: دورق أو إناء، لوح تسخين أو موقد بنزن، ماء، حامل (عرض المعلم)", "الغليان، البخار، الفقاعات.", "يضع المعلم إناء الماء على لوح التسخين أمام الطلاب ويطلب منهم الجلوس على مسافة آمنة، ويسأل: «ماذا تتوقعون أن نرى؟».", "• التهيئة (4 دقائق):\n  المعلم: يجهز العرض ويحدد مسافة الأمان.\n  الطالب: يتنبؤون ويكتبون.\n• عرض نشاط 3-7أ (16 دقيقة):\n  المعلم: يسخن الماء ويطلب وصف ما يحدث على مراحل.\n  الطالب: يلاحظون فقاعات صغيرة ثم كبيرة ترتفع وتنفجر عند السطح، وتصاعد سحابة بيضاء.\n• الوصف (8 دقائق):\n  المعلم: يسأل: كيف يبدو الماء المغلي؟\n  الطالب: يصفون: فقاعات كثيرة، حركة شديدة، صوت، سحابة فوقه.\n• تفسير الفقاعات (8 دقائق):\n  المعلم: يوضح أن الفقاعات تحتوي على بخار الماء الذي تكون داخل السائل.\n  الطالب: يفسرون الفقاعات.\n• الغلق (4 دقائق):\n  المعلم: يذكّر: لماذا لم نمرر أيدينا فوق الإناء؟\n  الطالب: يجيبون: خطر الحروق من البخار.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ماذا ظهر داخل الماء عند غليانه؟\n   الإجابة النموذجية: فقاعات كبيرة ترتفع وتنفجر عند السطح.\n2. (المستوى المتوقع) ما الذي يحدث للماء بعد أن ترتفع درجة حرارته كثيرًا؟\n   الإجابة النموذجية: يغلي ويتحول إلى بخار.\n3. (المستوى المتقدم) ماذا تحتوي الفقاعات في الماء المغلي؟\n   الإجابة النموذجية: بخار الماء.", "1. (مستوى الدعم) صح أم خطأ: يجب أن يقترب الطلاب من الماء المغلي لملاحظته جيدًا.\n   الإجابة النموذجية: خطأ؛ نلاحظ من مسافة آمنة.\n2. (المستوى المتوقع) صف كيف يبدو الماء المغلي.\n   الإجابة النموذجية: تظهر فقاعات كثيرة كبيرة تتحرك بسرعة إلى السطح وتنفجر، وتتصاعد سحابة بيضاء.\n3. (المستوى المتقدم) لماذا تتكون الفقاعات داخل الماء وليس على سطحه فقط؟\n   الإجابة النموذجية: لأن الماء كله يسخن ويتحول إلى بخار داخل السائل نفسه فيكوّن فقاعات ترتفع.", "للطالب: كتابة وصف لمراحل غليان الماء كما شاهدها. لولي الأمر: ملاحظة غليان الماء في المطبخ مع الابن من مسافة آمنة."]}, {"n": 3, "topic": "نشاط 3-7ب: استقصاء درجة غليان الماء", "f": ["1. يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده\n2. يحدد درجة غليان الماء النقي 100°C\nمخرج تعليمي آخر: يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان", "المخرج 1 (يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده): تطبيق\nالمخرج 2 (يحدد درجة غليان الماء النقي 100°C): تذكر\nالمخرج الآخر (يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: دورق زجاجي، لوح تسخين، ميزان حرارة، ساعة إيقاف، سدادة بثقب واحد (عرض المعلم)", "درجة الغليان، ميزان الحرارة، القياس.", "يسأل المعلم: «درجة حرارة ماء الصنبور البارد بين 20 و25°C، والساخن بين 50 و60°C. كم تتوقعون أن تكون درجة الحرارة عندما يغلي الماء؟».", "• التهيئة (4 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يكتبون توقعاتهم.\n• تجهيز الجدول (6 دقائق):\n  المعلم: يعرض جدول ص57 (الزمن بالدقائق، درجة حرارة الماء).\n  الطالب: ينسخون الجدول.\n• عرض نشاط 3-7ب (20 دقيقة):\n  المعلم: يسخن الماء ويقرأ ميزان الحرارة كل دقيقتين بصوت عالٍ، ويستمر أربع دقائق بعد بدء الغليان.\n  الطالب: يسجلون القراءات ويلاحظون لحظة بدء الغليان.\n• تحليل أولي (7 دقائق):\n  المعلم: يسأل: ما درجة الحرارة عند بدء الغليان؟ هل ارتفعت بعد ذلك؟\n  الطالب: يلاحظون أنها وصلت إلى نحو 100°C وبقيت ثابتة تقريبًا.\n• الغلق (3 دقائق):\n  المعلم: يلخص: درجة غليان الماء النقي 100°C.\n  الطالب: يكتبون المعلومة.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) كل كم دقيقة سجلنا درجة الحرارة؟\n   الإجابة النموذجية: كل دقيقتين.\n2. (المستوى المتوقع) ما درجة الحرارة التي بدأ عندها الماء الغليان؟\n   الإجابة النموذجية: نحو 100°C.\n3. (المستوى المتقدم) ماذا حدث لدرجة الحرارة بعد أن بدأ الماء يغلي؟\n   الإجابة النموذجية: بقيت ثابتة تقريبًا.", "1. (مستوى الدعم) صح أم خطأ: درجة غليان الماء النقي 100°C.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الأدوات التي استخدمناها لقياس درجة الحرارة والزمن؟\n   الإجابة النموذجية: ميزان الحرارة وساعة الإيقاف.\n3. (المستوى المتقدم) لماذا لم ترتفع درجة الحرارة رغم استمرار التسخين أثناء الغليان؟\n   الإجابة النموذجية: لأن الطاقة الحرارية تُستخدم في تحويل الماء إلى بخار.", "للطالب: الاحتفاظ بجدول القراءات لرسم التمثيل الخطي في الحصة القادمة. لولي الأمر: مراجعة قراءة ميزان الحرارة مع الابن (ميزان حرارة الجسم مثلًا)."]}, {"n": 4, "topic": "تمثيل نتائج الغليان خطيًا وأسئلة الدرس", "f": ["1. يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي\n2. يفسر النمط في النتائج (ارتفاع ثم ثبات عند 100°C)\nمخرج تعليمي آخر: يفسر لماذا لا يغلي الماء دائمًا عند 100°C", "المخرج 1 (يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي): تطبيق\nالمخرج 2 (يفسر النمط في النتائج (ارتفاع ثم ثبات عند 100°C)): تحليل\nالمخرج الآخر (يفسر لماذا لا يغلي الماء دائمًا عند 100°C): تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مربعات، جداول القراءات", "درجة الغليان، التمثيل الخطي، النمط.", "يعرض المعلم جدول القراءات ويسأل: «كيف نرى بلمحة واحدة كيف تغيرت درجة الحرارة مع الزمن؟».", "• التهيئة (4 دقائق):\n  المعلم: يعرض الجدول.\n  الطالب: يقترحون التمثيل الخطي.\n• رسم التمثيل الخطي (14 دقيقة):\n  المعلم: يراجع الخطوات (محاور، مقياس، نقاط، توصيل).\n  الطالب: يرسمون الزمن على المحور الأفقي ودرجة الحرارة على الرأسي.\n• أسئلة ص57 (10 دقائق):\n  المعلم: يناقش الأسئلة (1–4).\n  الطالب: يحددون النمط، نوع التمثيل، درجة الغليان، وأن الماء يغلي عند 100°C إذا كان نقيًا، ثبات درجة الحرارة أثناء الغليان، والفقاعات بخار ماء.\n• التحدي (8 دقائق):\n  المعلم: يطرح تحدي ص57: لماذا لا يغلي الماء دائمًا عند 100°C؟\n  الطالب: يستنتجون أن الماء غير النقي (كالماء المالح) يغلي عند درجة أعلى، وأن الماء على قمم الجبال العالية يغلي عند درجة أقل.\n• الغلق (4 دقائق):\n  المعلم: يلخص النمط.\n  الطالب: يكتبون الاستنتاج.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما نوع التمثيل المناسب لنتائج نشاط 3-7ب؟ ولماذا؟\n   الإجابة النموذجية: التمثيل الخطي؛ لأن درجة الحرارة تتغير بمرور الزمن.\n2. (المستوى المتوقع) صف النمط في التمثيل البياني.\n   الإجابة النموذجية: ترتفع درجة الحرارة تدريجيًا حتى نحو 100°C ثم تبقى ثابتة أثناء الغليان.\n3. (المستوى المتقدم) ما الفقاعات الموجودة في الماء المغلي؟\n   الإجابة النموذجية: فقاعات بخار الماء.", "1. (مستوى الدعم) صح أم خطأ: ارتفعت درجة الحرارة كثيرًا بعد بدء الغليان.\n   الإجابة النموذجية: خطأ؛ بقيت ثابتة تقريبًا.\n2. (المستوى المتوقع) هل يغلي الماء المالح عند 100°C؟\n   الإجابة النموذجية: لا؛ يغلي عند درجة أعلى قليلًا لأنه غير نقي.\n3. (المستوى المتقدم) لماذا قد يغلي الماء عند درجة أقل من 100°C على قمة جبل عالٍ؟\n   الإجابة النموذجية: لأن ضغط الهواء أقل في الأماكن المرتفعة فيغلي الماء عند درجة أقل.", "للطالب: إكمال التمثيل الخطي ومراجعة إجابات أسئلة ص57. لولي الأمر: مناقشة الابن في الفرق بين غليان الماء العادي والماء المالح أثناء الطبخ."]}, {"n": 5, "topic": "ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان", "f": ["1. يقارن بين التبخر والغليان\n2. يقترح طرقًا تجعل الماء يغلي أسرع ويبررها\nمخرج تعليمي آخر: يخطط لاختبار عادل يقارن فيه زمن غليان كميتين مختلفتين من الماء", "المخرج 1 (يقارن بين التبخر والغليان): تحليل\nالمخرج 2 (يقترح طرقًا تجعل الماء يغلي أسرع ويبررها): تطبيق\nالمخرج الآخر (يخطط لاختبار عادل يقارن فيه زمن غليان كميتين مختلفتين من الماء): إبداع", "التعلم المبني على حل المشكلات، التعلم التعاوني، ا ة 1: مفهوم الغليان وقواعد السلامة\n1. يعرّف الغليان ويصف ما يحدث للسائل عند غليانه\n2. يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي\nمخرج تعليمي آخر: يحدد قواعد السلامة عند التعامل مع الماء المغلي\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\n1. يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان\n2. يصف مظهر الماء المغلي والفقاعات المتكونة\nمخرج تعليمي آخر: يفسر تكون الفقاعات داخل الماء المغلي\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\n1. يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده\n2. يحدد درجة غليان الماء النقي 100°C\nمخرج تعليمي آخر: يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n1. يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي\n2. يفسر النمط في النتائج (ارتفاع ثم ثبات عند 100°C)\nمخرج تعليمي آخر: يفسر لماذا لا يغلي الماء دائمًا عند 100°C\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n1. يقارن بين التبخر والغليان\n2. يقترح طرقًا تجعل الماء يغلي أسرع ويبررها\nمخرج تعليمي آخر: يخطط لاختبار عادل يقارن فيه زمن غليان كميتين مختلفتين من الماء", "الحصة 1: مفهوم الغليان وقواعد السلامة\nالمخرج 1 (يعرّف الغليان ويصف ما يحدث للسائل عند غليانه): فهم\nالمخرج 2 (يميز بين البخار غير المرئي والسحابة البيضاء فوق الماء المغلي): تحليل\nالمخرج الآخر (يحدد قواعد السلامة عند التعامل مع الماء المغلي): تطبيق\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\nالمخرج 1 (يلاحظ التغيرات التي تحدث للماء عند تسخينه حتى الغليان): فهم\nالمخرج 2 (يصف مظهر الماء المغلي والفقاعات المتكونة): فهم\nالمخرج الآخر (يفسر تكون الفقاعات داخل الماء المغلي): تحليل\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\nالمخرج 1 (يسجل قراءات ميزان الحرارة كل دقيقتين حتى غليان الماء وبعده): تطبيق\nالمخرج 2 (يحدد درجة غليان الماء النقي 100°C): تذكر\nالمخرج الآخر (يلاحظ أن درجة الحرارة تبقى ثابتة أثناء الغليان): تحليل\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\nالمخرج 1 (يمثل قراءات درجة حرارة الماء مع الزمن بتمثيل خطي): تطبيق\nالمخرج 2 (يفسر النمط في النتائج (ارتفاع ثم ثبات عند 1 لغليان\nالتبخر، الغليان، درجة الغليان، الاختبار العادل.", "الحصة 1: مفهوم الغليان وقواعد السلامة\nيعرض المعلم صورة الطالبين ص56 ويقرأ حوارهما: «الهواء فوق الإناء ساخن للغاية… لقد احترقت يدي ولم ألمس الإناء!»، ويسأل: «لماذا احترقت يد خالد دون أن يلمس الإناء؟».\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\nيضع المعلم إناء الماء على لوح التسخين أمام الطلاب ويطلب منهم الجلوس على مسافة آمنة، ويسأل: «ماذا تتوقعون أن نرى؟».\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\nيسأل المعلم: «درجة حرارة ماء الصنبور البارد بين 20 و25°C، والساخن بين 50 و60°C. كم تتوقعون أن تكون درجة الحرارة عندما يغلي الماء؟».\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\nيعرض المعلم جدول القراءات ويسأل: «كيف نرى بلمحة واحدة كيف تغيرت درجة الحرارة مع الزمن؟».\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\nيطرح المعلم سؤال «تحدّث عن!» ص57: «ما الفرق بين التبخر والغليان؟ كلاهما يحول الماء إلى غاز!».", "الحصة 1: مفهوم الغليان وقواعد السلامة\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويقرأ الحوار.\n  الطالب: يقترحون: البخار الساخن.\n• مفهوم الغليان (10 دقائق):\n  المعلم: يشرح ص56: عند تسخين الماء بدرجة كافية يغلي؛ تكتسب الجزيئات طاقة كبيرة فتتحرك بسرعة وتنفصل ويتحول الماء إلى بخار. سائل + حرارة ← غاز.\n  الطالب: يكتبون التعريف والمعادلة.\n• البخار والسحابة (8 دقائق):\n  المعلم: يوضح أن البخار غاز غير مرئي، والسحابة البيضاء فوق الإناء قطرات تكثفت عند ملامسة الهواء الأبرد.\n  الطالب: يرسمون إناءً يغلي ويحددون المنطقة غير المرئية والسحابة.\n• السلامة (10 دقائق):\n  المعلم: يناقش تحذير الأمن والسلامة ص56: الماء المغلي والبخار يسببان حروقًا.\n  الطالب: يكتبون ثلاث قواعد سلامة عند الغليان.\n• الغلق (7 دقائق):\n  المعلم: يقدم مفهوم درجة الغليان ويسأل عن توقعاتهم لدرجة غليان الماء.\n  الطالب: يتوقعون أرقامًا ويكتبونها.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\n• التهيئة (4 دقائق):\n  المعلم: يجهز العرض ويحدد مسافة الأمان.\n  الطالب: يتنبؤون ويكتبون.\n• عرض نشاط 3-7أ (16 دقيقة):\n  المعلم: يسخن الماء ويطلب وصف ما يحدث على مراحل.\n  الطالب: يلاحظون فقاعات صغيرة ثم كبيرة ترتفع وتنفجر عند السطح، وتصاعد سحابة بيضاء.\n• الوصف (8 دقائق):\n  المعلم: يسأل: كيف يبدو الماء المغلي؟\n  الطالب: يصفون: فقاعات كثيرة، حركة شديدة، صوت، سحابة فوقه.\n• تفسير الفقاعات (8 دقائق):\n  المعلم: يوضح أن الفقاعات تحتوي على بخار الماء الذي تكون داخل السائل.\n  الطالب: يفسرون الفقاعات.\n• الغلق (4 دقائق):\n  المعلم: يذكّر: لماذا لم نمرر أيدينا فوق الإناء؟\n  الطالب: يجيبون: خطر الحروق من البخار.\nالمجموع: 40 دقيقة\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\n• التهيئة (4 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يكتبون توقعاتهم.\n• تجهيز الجدول (6 دقائق):\n  المعلم: يعرض جدول ص57 (الزمن بالدقائق، درجة حرارة الماء).\n  الطالب: ينسخون الجدول.\n• عرض نشاط 3-7ب (20 دقيقة):\n  المعلم: يسخن الماء ويقرأ ميزان الحرارة كل دقيقتين بصوت عالٍ، ويستمر أربع دقائق بعد بدء الغليان.\n  الطالب: يسجلون القراءات ويلاحظون لحظة بدء الغليان.\n• تحليل أولي (7 دقائق):\n  المعلم: يسأل: ما درجة الحرارة عند بدء الغليان؟ هل ارتفعت بعد ذلك؟\n  الطالب: يلاحظون أنها وصلت إلى نحو 100°C وبقيت ثابتة تقريبًا.\n• الغلق (3 دقائق):\n  المعلم: يلخص: درجة غليان الماء النقي 100°C.\n  الطالب: يكتبون المعلومة.\nالمجموع: 40 دقيقة\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n• التهيئة (4 دقائق):\n  المعلم: يعرض الجدول.\n  الطالب: يقترحون التمثيل الخطي.\n• رسم التمثيل الخطي (14 دقيقة):\n  المعلم: يراجع الخطوات (محاور، مقياس، نقاط، توصيل).\n  الطالب: يرسمون الزمن على المحور الأفقي ودرجة الحرارة على الرأسي.\n• أسئلة ص57 (10 دقائق):\n  المعلم: يناقش الأسئلة (1–4).\n  الطالب: يحددون النمط، نوع التمثيل، درجة الغليان، وأن الماء يغلي عند 100°C إذا كان نقيًا، ثبات درجة الحرارة أثناء الغليان، والفقاعات بخار ماء.\n• التحدي (8 دقائق):\n  المعلم: يطرح تحدي ص57: لماذا لا يغلي الماء دائمًا عند 100°C؟\n  الطالب: يستنتجون أن الماء غير النقي (كالماء المالح) يغلي عند درجة أعلى، وأن الماء على قمم الجبال العالية يغلي عند درجة أقل.\n• الغلق (4 دقائق):\n  المعلم: يلخص النمط.\n  الطالب: يكتبون الاستنتاج.\nالمجموع: 40 دقيقة\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n• التهيئة (4 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقدمون أفكارًا.\n• التبخر والغليان (10 دقائق):\n  المعلم: يرسم جدول مقارنة (درجة الحرارة، المكان في السائل، السرعة، الفقاعات).\n  الطالب: يكملون: التبخر يحدث عند أي درجة ومن السطح فقط ببطء، والغليان عند درجة الغليان ومن داخل السائل كله بسرعة مع فقاعات.\n• ورقة العمل 3-7 (12 دقيقة):\n  المعلم: يقدم ورقة العمل ص81: كيف يغلي الماء بسرعة؟\n  الطالب: يقترحون: كمية أقل، غطاء للإناء، حرارة أعلى، ويخططون اختبارًا عادلًا لكميتين مختلفتين.\n• تمرين 3-7 (6 دقائق):\n  المعلم: يقدم تمرين 3-7 بكتاب النشاط ص37 كواجب ويحل أول سؤال جماعيًا.\n  الطالب: يشاركون.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 3-7.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: مفهوم الغليان وقواعد السلامة\n1. (مستوى الدعم) ماذا يحدث للماء عندما يغلي؟\n   الإجابة النموذجية: يتحول من سائل إلى غاز (بخار).\n2. (المستوى المتوقع) لماذا احترقت يد خالد دون أن يلمس الإناء؟\n   الإجابة النموذجية: لأن البخار الساخن فوق الإناء يسبب الحروق.\n3. (المستوى المتقدم) هل السحابة البيضاء فوق الماء المغلي هي البخار؟ وضّح.\n   الإجابة النموذجية: لا؛ البخار غير مرئي، والسحابة قطرات ماء صغيرة تكثفت عندما برد البخار في الهواء.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\n1. (مستوى الدعم) ماذا ظهر داخل الماء عند غليانه؟\n   الإجابة النموذجية: فقاعات كبيرة ترتفع وتنفجر عند السطح.\n2. (المستوى المتوقع) ما الذي يحدث للماء بعد أن ترتفع درجة حرارته كثيرًا؟\n   الإجابة النموذجية: يغلي ويتحول إلى بخار.\n3. (المستوى المتقدم) ماذا تحتوي الفقاعات في الماء المغلي؟\n   الإجابة النموذجية: بخار الماء.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\n1. (مستوى الدعم) كل كم دقيقة سجلنا درجة الحرارة؟\n   الإجابة النموذجية: كل دقيقتين.\n2. (المستوى المتوقع) ما درجة الحرارة التي بدأ عندها الماء الغليان؟\n   الإجابة النموذجية: نحو 100°C.\n3. (المستوى المتقدم) ماذا حدث لدرجة الحرارة بعد أن بدأ الماء يغلي؟\n   الإجابة النموذجية: بقيت ثابتة تقريبًا.\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n1. (مستوى الدعم) ما نوع التمثيل المناسب لنتائج نشاط 3-7ب؟ ولماذا؟\n   الإجابة النموذجية: التمثيل الخطي؛ لأن درجة الحرارة تتغير بمرور الزمن.\n2. (المستوى المتوقع) صف النمط في التمثيل البياني.\n   الإجابة النموذجية: ترتفع درجة الحرارة تدريجيًا حتى نحو 100°C ثم تبقى ثابتة أثناء الغليان.\n3. (المستوى المتقدم) ما الفقاعات الموجودة في الماء المغلي؟\n   الإجابة النموذجية: فقاعات بخار الماء.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n1. (مستوى الدعم) ما الفرق بين التبخر والغليان من حيث درجة الحرارة؟\n   الإجابة النموذجية: التبخر يحدث عند أي درجة حرارة، والغليان يحدث عند درجة الغليان فقط.\n2. (المستوى المتوقع) أين يحدث التبخر في السائل؟ وأين يحدث الغليان؟\n   الإجابة النموذجية: التبخر من السطح فقط، والغليان في السائل كله.\n3. (المستوى المتقدم) اقترح طريقة تجعل الماء يغلي أسرع وفسّرها.\n   الإجابة النموذجية: استخدام كمية أقل من الماء أو تغطية الإناء؛ لأن الكمية الأقل تحتاج طاقة أقل والغطاء يقلل فقد الحرارة.", "الحصة 1: مفهوم الغليان وقواعد السلامة\n1. (مستوى الدعم) صح أم خطأ: البخار غاز غير مرئي.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر قاعدتين للسلامة عند غلي الماء.\n   الإجابة النموذجية: عدم تمرير اليد فوق الإناء، وعدم لمس الإناء الساخن، والابتعاد عن البخار (أي اثنتين).\n3. (المستوى المتقدم) ما الفرق بين الهواء فوق الماء البارد والهواء فوق الماء المغلي؟\n   الإجابة النموذجية: فوق الماء المغلي يوجد بخار ساخن جدًا يسبب الحروق، أما فوق الماء البارد فالهواء غير ساخن.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\n1. (مستوى الدعم) صح أم خطأ: يجب أن يقترب الطلاب من الماء المغلي لملاحظته جيدًا.\n   الإجابة النموذجية: خطأ؛ نلاحظ من مسافة آمنة.\n2. (المستوى المتوقع) صف كيف يبدو الماء المغلي.\n   الإجابة النموذجية: تظهر فقاعات كثيرة كبيرة تتحرك بسرعة إلى السطح وتنفجر، وتتصاعد سحابة بيضاء.\n3. (المستوى المتقدم) لماذا تتكون الفقاعات داخل الماء وليس على سطحه فقط؟\n   الإجابة النموذجية: لأن الماء كله يسخن ويتحول إلى بخار داخل السائل نفسه فيكوّن فقاعات ترتفع.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\n1. (مستوى الدعم) صح أم خطأ: درجة غليان الماء النقي 100°C.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما الأدوات التي استخدمناها لقياس درجة الحرارة والزمن؟\n   الإجابة النموذجية: ميزان الحرارة وساعة الإيقاف.\n3. (المستوى المتقدم) لماذا لم ترتفع درجة الحرارة رغم استمرار التسخين أثناء الغليان؟\n   الإجابة النموذجية: لأن الطاقة الحرارية تُستخدم في تحويل الماء إلى بخار.\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\n1. (مستوى الدعم) صح أم خطأ: ارتفعت درجة الحرارة كثيرًا بعد بدء الغليان.\n   الإجابة النموذجية: خطأ؛ بقيت ثابتة تقريبًا.\n2. (المستوى المتوقع) هل يغلي الماء المالح عند 100°C؟\n   الإجابة النموذجية: لا؛ يغلي عند درجة أعلى قليلًا لأنه غير نقي.\n3. (المستوى المتقدم) لماذا قد يغلي الماء عند درجة أقل من 100°C على قمة جبل عالٍ؟\n   الإجابة النموذجية: لأن ضغط الهواء أقل في الأماكن المرتفعة فيغلي الماء عند درجة أقل.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\n1. (مستوى الدعم) صح أم خطأ: الغليان يحدث بسرعة أكبر من التبخر.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ما العامل الذي تغيره عند مقارنة زمن غليان كميتين من الماء؟\n   الإجابة النموذجية: كمية الماء.\n3. (المستوى المتقدم) اذكر عاملين يجب تثبيتهما في هذا الاختبار.\n   الإجابة النموذجية: نوع الإناء، ومصدر الحرارة وقوته، ودرجة حرارة الماء الابتدائية (أي اثنين).", "الحصة 1: مفهوم الغليان وقواعد السلامة\nللطالب: قراءة كتاب الطالب ص56، وكتابة قواعد السلامة في المطبخ. لولي الأمر: تعريف الابن بأماكن الخطر في المطبخ ومناقشة قواعد السلامة عند غلي الماء.\n\nالحصة 2: نشاط 3-7أ: ماذا يحدث عندما يغلي الماء؟\nللطالب: كتابة وصف لمراحل غليان الماء كما شاهدها. لولي الأمر: ملاحظة غليان الماء في المطبخ مع الابن من مسافة آمنة.\n\nالحصة 3: نشاط 3-7ب: استقصاء درجة غليان الماء\nللطالب: الاحتفاظ بجدول القراءات لرسم التمثيل الخطي في الحصة القادمة. لولي الأمر: مراجعة قراءة ميزان الحرارة مع الابن (ميزان حرارة الجسم مثلًا).\n\nالحصة 4: تمثيل نتائج الغليان خطيًا وأسئلة الدرس\nللطالب: إكمال التمثيل الخطي ومراجعة إجابات أسئلة ص57. لولي الأمر: مناقشة الابن في الفرق بين غليان الماء العادي والماء المالح أثناء الطبخ.\n\nالحصة 5: ورقة العمل 3-7: كيف يغلي الماء بسرعة؟ والفرق بين التبخر والغليان\nللطالب: حل تمرين 3-7 بكتاب النشاط ص37، وإكمال ورقة العمل 3-7 ص81. لولي الأمر: إحضار مكعبات ثلج وقطعة زبدة صغيرة مع الابن لدرس الانصهار."]}, {"code": "3-8", "title": "الانصهار", "unit": 3, "dates": "الأسبوع الخامس عشر (13–17/12/2026م)", "sb": "58–59", "tb": "76–79", "ab": "تمرين 3-8 ص38، ورقتا العمل 3-8أ ص83 و3-8ب ص85", "periods": [{"n": 1, "topic": "مفهوم الانصهار ودرجة الانصهار", "f": ["1. يعرّف الانصهار ودرجة الانصهار\n2. يفسر الانصهار باكتساب جزيئات المادة الصلبة طاقة حرارية\nمخرج تعليمي آخر: يقارن بين درجات انصهار مواد مختلفة", "المخرج 1 (يعرّف الانصهار ودرجة الانصهار): تذكر\nالمخرج 2 (يفسر الانصهار باكتساب جزيئات المادة الصلبة طاقة حرارية): فهم\nالمخرج الآخر (يقارن بين درجات انصهار مواد مختلفة): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: مكعبات ثلج، قطعة زبدة، طبقان", "الانصهار، ينصهر، درجة الانصهار.", "يضع المعلم مكعب ثلج وقطعة زبدة متساويين في الحجم على طبقين في المكان نفسه، ويسأل: «أيهما سينصهر أولًا؟ ولماذا؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الثلج والزبدة.\n  الطالب: يتنبؤون.\n• مفهوم الانصهار (10 دقائق):\n  المعلم: يشرح ص58: عند تسخين المواد الصلبة تكتسب جزيئاتها طاقة فتتحرك أسرع وتتباعد فتتحول إلى سائل. صلب + حرارة ← سائل.\n  الطالب: يكتبون التعريف والمعادلة.\n• درجة الانصهار (10 دقائق):\n  المعلم: يعرّف درجة الانصهار ويعرض صور ص58: الثلج، الزبدة، الفلزات، فتيل التنجستن (3380°C).\n  الطالب: يرتبون المواد حسب درجة انصهارها من الأقل إلى الأعلى.\n• نموذج الجزيئات (10 دقائق):\n  المعلم: يمثل بطلاب «جزيئات صلبة» متراصة تهتز، ثم تكتسب طاقة فتتحرك وتتباعد.\n  الطالب: يصفون الفرق بين ترتيب جزيئات الصلب والسائل.\n• الغلق (5 دقائق):\n  المعلم: يعود إلى الطبقين.\n  الطالب: يلاحظون أن الثلج انصهر أولًا ويفسرون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى الحالة السائلة.\n2. (المستوى المتوقع) ما درجة الانصهار؟\n   الإجابة النموذجية: درجة الحرارة التي تنصهر عندها المادة الصلبة.\n3. (المستوى المتقدم) لماذا اختير التنجستن لص ع الملح على الطرق المتجمدة في تقليل الثلوج عليها؟».", "الحصة 1: مفهوم الانصهار ودرجة الانصهار\n• التهيئة (5 دقائق):\n  المعلم: يعرض الثلج والزبدة.\n  الطالب: يتنبؤون.\n• مفهوم الانصهار (10 دقائق):\n  المعلم: يشرح ص58: عند تسخين المواد الصلبة تكتسب جزيئاتها طاقة فتتحرك أسرع وتتباعد فتتحول إلى سائل. صلب + حرارة ← سائل.\n  الطالب: يكتبون التعريف والمعادلة.\n• درجة الانصهار (10 دقائق):\n  المعلم: يعرّف درجة الانصهار ويعرض صور ص58: الثلج، الزبدة، الفلزات، فتيل التنجستن (3380°C).\n  الطالب: يرتبون المواد حسب درجة انصهارها من الأقل إلى الأعلى.\n• نموذج الجزيئات (10 دقائق):\n  المعلم: يمثل بطلاب «جزيئات صلبة» متراصة تهتز، ثم تكتسب طاقة فتتحرك وتتباعد.\n  الطالب: يصفون الفرق بين ترتيب جزيئات الصلب والسائل.\n• الغلق (5 دقائق):\n  المعلم: يعود إلى الطبقين.\n  الطالب: يلاحظون أن الثلج انصهر أولًا ويفسرون.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 3-8: استقصاء درجة انصهار الثلج\n• التهيئة (4 دقائق):\n  المعلم: يطرح الأسئلة.\n  الطالب: يكتبون تنبؤهم لدرجة انصهار الثلج.\n• تجهيز الجدول (6 دقائق):\n  المعلم: يعرض جدول ص59 ويقدم ورقة العمل 3-8ب ص85.\n  الطالب: ينسخون الجدول.\n• نشاط 3-8 (20 دقيقة):\n  المعلم: يتابع وفق ص59.\n  الطالب: يضعون الثلج في الدورق، ويقيسون درجة الحرارة كل دقيقة حتى ينصهر، ثم كل دقيقة لعشر دقائق أخرى، ويسجلون.\n• تحليل أولي (7 دقائق):\n  المعلم: يسأل: ماذا لاحظتم على درجة الحرارة أثناء الانصهار؟\n  الطالب: يلاحظون بقاءها عند 0°C تقريبًا حتى ينصهر الثلج كله، ثم ترتفع.\n• الغلق (3 دقائق):\n  المعلم: يلخص: درجة انصهار الثلج 0°C.\n  الطالب: يكتبون المعلومة.\nالمجموع: 40 دقيقة\n\nالحصة 3: التمثيل الخطي للانصهار وأسئلة الدرس\n• التهيئة (4 دقائق):\n  المعلم: يطرح السؤال.\n  الطالب: يقترحون أفكارًا.\n• ورقة العمل 3-8أ (12 دقيقة):\n  المعلم: يقدم ورقة العمل 3-8أ (ارسم تمثيلًا بيانيًا خطيًا يوضح الانصهار) ص83.\n  الطالب: يرسمون التمثيل الخطي لقراءاتهم ويحددون الجزء الثابت عند 0°C.\n• أسئلة ص59 (10 دقائق):\n  المعلم: يناقش الأسئلة (1–4).\n  الطالب: يجيبون عن النمط ونوع التمثيل ودرجة الانصهار وطرق تسريعه والتنبؤ بعد عشرين دقيقة، وأن 0°C هي درجة تجمد الماء أيضًا.\n• الملح والثلج (6 دقائق):\n  المعلم: يوضح أن الملح يخفض درجة انصهار الثلج فينصهر في درجات حرارة أقل من 0°C.\n  الطالب: يربطون ذلك بتنظيف الطرق في البلاد الباردة.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 3-8.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: مفهوم الانصهار ودرجة الانصهار\n1. (مستوى الدعم) ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى الحالة السائلة.\n2. (المستوى المتوقع) ما درجة الانصهار؟\n   الإجابة النموذجية: درجة الحرارة التي تنصهر عندها المادة الصلبة.\n3. (المستوى المتقدم) لماذا اختير التنجستن لصنع فتيل المصباح؟\n   الإجابة النموذجية: لأن درجة انصهاره عالية جدًا (3380°C) فلا ينصهر بحرارة المصباح.\n\nالحصة 2: نشاط 3-8: استقصاء درجة انصهار الثلج\n1. (مستوى الدعم) كل كم دقيقة قسنا درجة حرارة الثلج؟\n   الإجابة النموذجية: كل دقيقة.\n2. (المستوى المتوقع) عند أي درجة انصهر الثلج؟\n   الإجابة النموذجية: 0°C.\n3. (المستوى المتقدم) ماذا حدث لدرجة الحرارة بعد انصهار الثلج كله؟\n   الإجابة النموذجية: بدأت ترتفع تدريجيًا.\n\nالحصة 3: التمثيل الخطي للانصهار وأسئلة الدرس\n1. (مستوى الدعم) ما النمط الذي تراه في نتائجك؟\n   الإجابة النموذجية: تبقى درجة الحرارة عند 0°C حتى ينصهر الثلج كله ثم ترتفع.\n2. (المستوى المتوقع) ما نوع التمثيل المناسب لنتائج الانصهار؟\n   الإجابة النموذجية: التمثيل الخطي.\n3. (المستوى المتقدم) اقترح طريقة لجعل الثلج ينصهر أسرع.\n   الإجابة النموذجية: تكسيره قطعًا صغيرة، أو تسخينه، أو وضعه في مكان دافئ، أو إضافة الملح.", "الحصة 1: مفهوم الانصهار ودرجة الانصهار\n1. (مستوى الدعم) أكمل: صلب + …… ← سائل.\n   الإجابة النموذجية: حرارة.\n2. (المستوى المتوقع) ماذا يحدث لجزيئات المادة الصلبة عند تسخينها؟\n   الإجابة النموذجية: تكتسب طاقة حرارية فتتحرك أسرع وتتباعد عن بعضها.\n3. (المستوى المتقدم) انصهر الثلج قبل الزبدة في المكان نفسه، ماذا تستنتج؟\n   الإجابة النموذجية: أن درجة انصهار الثلج أقل من درجة انصهار الزبدة.\n\nالحصة 2: نشاط 3-8: استقصاء درجة انصهار الثلج\n1. (مستوى الدعم) صح أم خطأ: درجة انصهار الثلج 0°C.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) لماذا بقيت درجة الحرارة عند 0°C أثناء الانصهار؟\n   الإجابة النموذجية: لأن الطاقة الحرارية تُستخدم في تحويل الثلج إلى ماء.\n3. (المستوى المتقدم) كيف تتأكد أن درجة انصهار الثلج هي 0°C دائمًا؟\n   الإجابة النموذجية: بتكرار القياس عدة مرات بثلج من مصادر مختلفة.\n\nالحصة 3: التمثيل الخطي للانصهار وأسئلة الدرس\n1. (مستوى الدعم) صح أم خطأ: درجة انصهار الثلج هي نفسها درجة تجمد الماء.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) تنبأ: هل ستكون درجة حرارة الماء الناتج بعد عشرين دقيقة من انصهار الثلج أعلى من 0°C؟ وضّح.\n   الإجابة النموذجية: نعم؛ لأن الماء يكتسب حرارة من الغرفة فترتفع درجة حرارته.\n3. (المستوى المتقدم) كيف يساعد الملح على تقليل الثلوج على الطرق؟\n   الإجابة النموذجية: يخفض درجة انصهار الثلج فينصهر في درجات حرارة أقل من 0°C.", "الحصة 1: مفهوم الانصهار ودرجة الانصهار\nللطالب: قراءة كتاب الطالب ص58، وتسجيل أمثلة على الانصهار في المنزل. لولي الأمر: تجهيز مكعبات ثلج للنشاط القادم.\n\nالحصة 2: نشاط 3-8: استقصاء درجة انصهار الثلج\nللطالب: الاحتفاظ بجدول القراءات، وإكمال ورقة العمل 3-8ب ص85. لولي الأمر: تجربة انصهار مكعب ثلج مع الابن وقياس الزمن.\n\nالحصة 3: التمثيل الخطي للانصهار وأسئلة الدرس\nللطالب: حل تمرين 3-8 بكتاب النشاط ص38، وإكمال ورقة العمل 3-8أ ص83. لولي الأمر: البحث مع الابن عن صورة ميزان حرارة يحتوي على تدريجين (°C و°F)."]}, {"code": "3-9", "title": "مَن مخترع تدريج درجة الحرارة؟", "unit": 3, "dates": "الأسبوع الخامس عشر (13–17/12/2026م)", "sb": "60–61", "tb": "80", "ab": "تمرين 3-9 ص39، المراجعة اللغوية ص40", "periods": [{"n": 1, "topic": "تدريجات درجة الحرارة: فهرنهايت وسيلزيوس وكلفن", "f": ["1. يذكر العلماء الذين اخترعوا تدريجات درجة الحرارة الثلاثة\n2. يقارن بين تدريجات فهرنهايت وسيلزيوس وكلفن من حيث درجتي تجمد الماء وغليانه\nمخرج تعليمي آخر: يفسر سبب حاجة العلماء إلى تدريج لدرجة الحرارة بدل وصف الأشياء بالساخنة والباردة", "المخرج 1 (يذكر العلماء الذين اخترعوا تدريجات درجة الحرارة الثلاثة): تذكر\nالمخرج 2 (يقارن بين تدريجات فهرنهايت وسيلزيوس وكلفن من حيث درجتي تجمد الماء وغليانه): تحليل\nالمخرج الآخر (يفسر سبب حاجة العلماء إلى تدريج لدرجة الحرارة بدل وصف الأشياء بالساخنة والباردة): تقييم", "التعلم الت const $=s=>document.querySelector(s);
const cnt=n=>n===2?'حصتان':n+' حصص';
function buildSelect(){
  const sel=$('#lesson'); sel.innerHTML='';
  [1,2,3].forEach(u=>{const g=document.createElement('optgroup'); g.label=UN[u];
    D.forEach((l,i)=>{if(l.unit===u){const o=document.createElement('option');o.value=i;o.textContent=l.code+' '+l.title+' ('+cnt(l.periods.length)+')';g.appendChild(o);}});
    sel.appendChild(g);});
  sel.onchange=()=>{li=+sel.value;pi=0;render();};
}
function setMode(m){mode=m;
  $('#mSep').setAttribute('aria-pressed',m==='sep');$('#mCom').setAttribute('aria-pressed',m==='com');
  render();}
function render(){
  const l=D[li]; document.body.className='u'+l.unit;
  $('#state').textContent = mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة (اختر الحصة ثم انسخ بنودها بندًا بندًا).' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله يضم حصصه ('+cnt(l.periods.length)+') داخل كل بند.';
  const tabs=$('#tabs'); tabs.innerHTML='';
  $('#tabsWrap').style.display = mode==='sep'?'block':'none';
  l.periods.forEach((p,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===pi);b.textContent='الحصة '+p.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});
  const p=l.periods[pi];
  $('#info').innerHTML='<h2>الدرس '+l.code+': '+l.title+'</h2>'+
    (mode==='sep'?'<div class="tp">الحصة '+p.n+' من '+l.periods.length+' — محور الحصة: '+p.topic+'</div>':'<div class="tp">نموذج مدمج للدرس: '+l.periods.map(x=>'الحصة '+x.n+': '+x.topic).join(' | ')+'</div>')+
    '<div class="grid"><div><b>الوحدة</b>'+UN[l.unit]+'</div><div><b>الأسبوع والتاريخ</b>'+l.dates+'</div><div><b>كتاب الطالب</b>ص '+l.sb+'</div><div><b>كتاب النشاط</b>'+l.ab+'</div><div><b>دليل المعلم</b>ص '+l.tb+'</div></div>';
  const fields = mode==='sep'? p.f : l.combined;
  const box=$('#cards'); box.innerHTML='';
  NAMES.forEach((nm,k)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="ch"><span class="num">'+(k+1)+'</span><span class="cn">'+nm+'</span><button class="copy" type="button">نسخ</button></div><div class="cb"></div><div class="hint">لم يسمح المتصفح بالنسخ التلقائي؛ تم تحديد النص — اضغط نسخ من قائمة المتصفح أو Ctrl+C.</div>';
    c.querySelector('.cb').textContent=fields[k];
    c.querySelector('.copy').onclick=e=>copyText(fields[k],e.currentTarget,c);
    box.appendChild(c);});
}
function flash(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
function fallback(text){
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
  document.body.removeChild(ta);return ok;}
function selectCard(card){const r=document.createRange();r.selectNodeContents(card.querySelector('.cb'));const s=getSelection();s.removeAllRanges();s.addRange(r);card.querySelector('.hint').classList.add('on');}
function copyText(text,btn,card){
  card.querySelector('.hint').classList.remove('on');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>flash(btn)).catch(()=>{fallback(text)?flash(btn):selectCard(card);});
  } else { fallback(text)?flash(btn):selectCard(card); }
}
$('#mSep').onclick=()=>setMode('sep');$('#mCom').onclick=()=>setMode('com');
buildSelect(); render();
</script></body></html>
