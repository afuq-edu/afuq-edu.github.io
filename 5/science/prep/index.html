</div><script>
const D = [{"code": "1-1", "title": "البذور", "unit": 1, "dates": "الأسبوع الأول (6–10/9/2026م)", "sb": "16–17", "tb": "18–20", "ab": "تمرين 1-1 ص16، أوراق العمل 1-1أ ص50، 1-1ب ص52، 1-1ج ص53", "periods": [{"n": 1, "topic": "البذور والثمار: أين توجد البذور؟", "f": ["1. يحدد أن البذور توجد داخل الثمار\n2. يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها\nمخرج تعليمي آخر: يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات", "المخرج 1 (يحدد أن البذور توجد داخل الثمار): فهم\nالمخرج 2 (يقارن بين ثمار مختلفة من حيث عدد بذورها وأحجامها): تحليل\nالمخرج الآخر (يتنبأ بعدد البذور في ثمرة اعتمادًا على نمط ملاحظ في البيانات): تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: ثمار حقيقية مقطوعة (تفاح، طماطم، خيار، بازلاء، أفوكادو)، سكين بلاستيكية، أطباق", "البذرة، الثمرة.", "يعرض المعلم تفاحة مقطوعة نصفين ويطرح سؤال الكتاب ص16: «هل سبق لك أن ابتلعت بذرة عند تناول التفاح أو البرتقال؟»، ثم يسأل: من أين تأتي البذور؟ وما فائدتها؟ ويدوّن إجابات الطلاب على السبورة لاستثمارها في الحصة.", "• التهيئة (5 دقائق):\n  المعلم: يعرض التفاحة المقطوعة ويطرح سؤال الكتاب ص16 ويسجل الأفكار.\n  الطالب: يجيبون ويذكرون ثمارًا تناولوها ووجدوا فيها بذورًا.\n• استكشاف أماكن البذور (8 دقائق):\n  المعلم: يوزع على المجموعات ثمارًا مقطوعة ويوجههم إلى تحديد موقع البذور في كل ثمرة.\n  الطالب: يفحصون الثمار ويحددون موقع البذور ويقارنونها بصور الكتاب ص16.\n• عدد البذور وأحجامها (10 دقائق):\n  المعلم: يطلب عدّ البذور في كل ثمرة وتسجيلها في جدول، ويقدّم ورقة العمل 1-1ب (إيجاد الأنماط ووضع التنبؤات) ص52.\n  الطالب: يعدّون البذور ويملؤون الجدول ويستنتجون نمطًا: الثمرة ذات البذرة الواحدة تكون بذرتها كبيرة.\n• تصحيح مفهوم الثمرة (7 دقائق):\n  المعلم: يوضح أن الثمرة هي الجزء الذي يحمل البذور حتى لو لم تكن حلوة (اليقطين، الخيار، الطماطم)، وينبّه إلى عدم تناول الثمار البرية المجهولة.\n  الطالب: يصنفون صورًا معروضة على السبورة الذكية إلى: ثمرة / ليست ثمرة، مع التعليل.\n• تطبيق من الكتاب (6 دقائق):\n  المعلم: يوجه الطلاب إلى صور الصفحة 16 (التفاح، الأفوكادو، البازلاء، الجوز).\n  الطالب: يصف كل طالب موقع البذور وعددها في ثمرة من الصور.\n• الغلق (4 دقائق):\n  المعلم: يوزع بطاقة خروج: «سمِّ ثمرتين بهما بذور كثيرة وثمرة بها بذرة واحدة».\n  الطالب: يكتبون الإجابة ويسلمونها.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) أين توجد البذور في النبات؟\n   الإجابة النموذجية: داخل الثمار.\n2. (المستوى المتوقع) كيف تختلف بذور التفاح عن بذرة الأفوكادو؟\n   الإجابة النموذجية: التفاح يحتوي على عدة بذور صغيرة في منتصف الثمرة، والأفوكادو يحتوي على بذرة واحدة كبيرة.\n3. (المستوى المتقدم) هل الخيار ثمرة؟ فسّر إجابتك.\n   الإجابة النموذجية: نعم، لأنه يحتوي على بذور في داخله.", "1. (مستوى الدعم) سمِّ ثمرة تحتوي على بذرة واحدة كبيرة.\n   الإجابة النموذجية: الأفوكادو (أو المانجو).\n2. (المستوى المتوقع) اذكر ثلاث ثمار تحتوي على عدد كبير من البذور.\n   الإجابة النموذجية: الطماطم، الخيار، البطيخ (أو أي أمثلة صحيحة).\n3. (المستوى المتقدم) أردتَ معرفة عدد البذور في ثمار البرتقال، فهل يكفي فتح برتقالة واحدة؟ وضّح.\n   الإجابة النموذجية: لا يكفي؛ يجب فتح عدة ثمار من النوع نفسه وعدّ بذورها لأن العدد يختلف من ثمرة لأخرى، فالقياسات المتكررة تعطي نتيجة أدق.", "للطالب: قراءة كتاب الطالب ص16، وإكمال ورقة العمل 1-1ب ص52 في كتاب النشاط إن لم تُنجز في الصف. لولي الأمر: مشاركة الابن عدّ بذور ثمرتين من المنزل (مثل الطماطم والخيار) وتسجيل العدد لمناقشته في الحصة القادمة."]}, {"n": 2, "topic": "تركيب البذرة", "f": ["1. يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء\n2. يوضح وظيفة كل جزء من أجزاء البذرة\nمخرج تعليمي آخر: يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا", "المخرج 1 (يسمي أجزاء البذرة: غلاف البذرة، الجنين، مخزون الغذاء): تذكر\nالمخرج 2 (يوضح وظيفة كل جزء من أجزاء البذرة): فهم\nالمخرج الآخر (يرسم بذرة فول ويسمي أجزاءها رسمًا علميًا دقيقًا): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: بذور فول كبيرة منقوعة، عدسات مكبرة", "غلاف البذرة، الجنين، مخزون الغذاء، الندبة.", "يسأل المعلم: أين توجد البذور؟ ثم يعرض بذرة فول جافة وشتلة فول صغيرة ويطرح سؤالًا مثيرًا: «كيف تستطيع هذه البذرة الصغير مات لتقييم الأقران.\n• أسئلة الكتاب ص17 (5 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون: مخزون الغذاء يمد الجنين بالطاقة، والغلاف يحمي البذرة، وتحتاج للماء والدفء لتبدأ النمو.\n• الغلق (3 دقائق):\n  المعلم: يلخص من خلال «ماذا تعلمت؟».\n  الطالب: يذكرون الأجزاء الثلاثة ووظائفها.\nالمجموع: 40 دقيقة", "الحصة 1: البذور والثمار: أين توجد البذور؟\n1. (مستوى الدعم) أين توجد البذور في النبات؟\n   الإجابة النموذجية: داخل الثمار.\n2. (المستوى المتوقع) كيف تختلف بذور التفاح عن بذرة الأفوكادو؟\n   الإجابة النموذجية: التفاح يحتوي على عدة بذور صغيرة في منتصف الثمرة، والأفوكادو يحتوي على بذرة واحدة كبيرة.\n3. (المستوى المتقدم) هل الخيار ثمرة؟ فسّر إجابتك.\n   الإجابة النموذجية: نعم، لأنه يحتوي على بذور في داخله.\n\nالحصة 2: تركيب البذرة\n1. (مستوى الدعم) ما الجزء الذي ينمو ليصبح نباتًا جديدًا؟\n   الإجابة النموذجية: الجنين.\n2. (المستوى المتوقع) لماذا تحتاج البذرة إلى غلاف؟\n   الإجابة النموذجية: لحماية ما بداخل البذرة.\n3. (المستوى المتقدم) لماذا تحتاج البذرة إلى مخزون الغذاء؟\n   الإجابة النموذجية: ليحصل الجنين على الطاقة اللازمة للنمو قبل أن تتكون أوراق تصنع الغذاء.", "الحصة 1: البذور والثمار: أين توجد البذور؟\n1. (مستوى الدعم) سمِّ ثمرة تحتوي على بذرة واحدة كبيرة.\n   الإجابة النموذجية: الأفوكادو (أو المانجو).\n2. (المستوى المتوقع) اذكر ثلاث ثمار تحتوي على عدد كبير من البذور.\n   الإجابة النموذجية: الطماطم، الخيار، البطيخ (أو أي أمثلة صحيحة).\n3. (المستوى المتقدم) أردتَ معرفة عدد البذور في ثمار البرتقال، فهل يكفي فتح برتقالة واحدة؟ وضّح.\n   الإجابة النموذجية: لا يكفي؛ يجب فتح عدة ثمار من النوع نفسه وعدّ بذورها لأن العدد يختلف من ثمرة لأخرى، فالقياسات المتكررة تعطي نتيجة أدق.\n\nالحصة 2: تركيب البذرة\n1. (مستوى الدعم) أكمل: الغطاء الخارجي الذي يحمي البذرة يسمى ……\n   الإجابة النموذجية: غلاف البذرة.\n2. (المستوى المتوقع) سمِّ أجزاء بذرة الفول الثلاثة، واذكر وظيفة كل منها.\n   الإجابة النموذجية: الغلاف: يحمي البذرة. الجنين: ينمو إلى نبات جديد. مخزون الغذاء: يمد الجنين بالطاقة.\n3. (المستوى المتقدم) بذرة تلف مخزون غذائها، ماذا تتوقع أن يحدث لجنينها عند زراعتها؟ فسّر.\n   الإجابة النموذجية: لن ينمو الجنين أو ينمو ضعيفًا؛ لأنه لا يجد الطاقة اللازمة للنمو في بدايته.", "الحصة 1: البذور والثمار: أين توجد البذور؟\nللطالب: قراءة كتاب الطالب ص16، وإكمال ورقة العمل 1-1ب ص52 في كتاب النشاط إن لم تُنجز في الصف. لولي الأمر: مشاركة الابن عدّ بذور ثمرتين من المنزل (مثل الطماطم والخيار) وتسجيل العدد لمناقشته في الحصة القادمة.\n\nالحصة 2: تركيب البذرة\nللطالب: حل تمرين 1-1 بكتاب النشاط ص16، وورقة العمل 1-1أ (ملاحظة ثمرة وبذورها ورسمها) ص50؛ والطلاب المتميزون: ورقة العمل 1-1ج (كم عدد البذور؟) ص53. لولي الأمر: متابعة رسم الابن لبذرة وتسمية أجزائها، ومساعدته في نقع بذرة فول ليلة كاملة لإحضارها في الحصة القادمة."]}, {"code": "1-2", "title": "كيف تنمو البذور؟", "unit": 1, "dates": "الأسبوع الأول (6–10/9/2026م)", "sb": "18–19", "tb": "21–22", "ab": "تمرين 1-2 ص17", "periods": [{"n": 1, "topic": "الإنبات ومراحله", "f": ["1. يعرّف الإنبات\n2. يرتب مراحل إنبات بذرة الفول ترتيبًا صحيحًا\nمخرج تعليمي آخر: يفسر سبب ذبول البذرة وصغر حجمها بعد الإنبات", "المخرج 1 (يعرّف الإنبات): تذكر\nالمخرج 2 (يرتب مراحل إنبات بذرة الفول ترتيبًا صحيحًا): فهم\nالمخرج الآخر (يفسر سبب ذبول البذرة وصغر حجمها بعد الإنبات): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، صورة توضيحية، أخرى: بطاقات مصورة لمراحل الإنبات", "الإنبات، الجذر الأول، الساق الأول، الأوراق الأولية، يمتص، يذبل.", "يعرض المعلم بذرة فول جافة وصورة شتلة فول ويسأل: «ما الذي حدث للبذرة حتى أصبحت هكذا؟ وما الذي يجعلها تبدأ في النمو؟»، ويدوّن أفكار الطلاب في مخطط ذهني.", "• التهيئة (5 دقائق):\n  المعلم: يعرض البذرة والشتلة ويبني مخططًا ذهنيًا بأفكار الطلاب.\n  الطالب: يقترحون ما يحدث للبذرة لتنمو.\n• مفهوم الإنبات (8 دقائق):\n  المعلم: يقرأ مع الطلاب ص18 ويوضح أن البذرة تبدأ النمو عندما تتوافر الظروف الملائمة، وتستخدم مخزون الغذاء للطاقة.\n  الطالب: يستخلصون تعريف الإنبات ويكتبونه.\n• عرض مراحل الإنبات (10 دقائق):\n  المعلم: يعرض مقطعًا مرئيًا لإنبات بذرة ويناقش رسم ص18: امتصاص الماء والانتفاخ، انفلاق الغلاف، الجذر الأول، الساق الأول، الأوراق الأولية، الجذور الجانبية.\n  الطالب: يشاهدون ويصفون كل مرحلة واتجاه نمو الجذر والساق.\n• ترتيب البطاقات (9 دقائق):\n  المعلم: يوزع بطاقات مراحل الإنبات مبعثرة على المجموعات.\n  الطالب: يرتبون البطاقات ويعرضون ترتيبهم ويبررونه.\n• بذور تنتظر سنوات (5 دقائق):\n  المعلم: يناقش مثال بذور اللوتس ص18 (بذور عمرها 1300 عام نبتت).\n  الطالب: يستنتجون أن البذور تبقى حية حتى تتهيأ لها الظروف.\n• الغلق (3 دقائق):\n  المعلم: يطرح سؤالًا ختاميًا: ما أول جزء يظهر من البذرة؟\n  الطالب: يجيبون ويرتبون المراحل شفهيًا.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما أول جزء يظهر من البذرة عند الإنبات؟\n   الإجابة النموذجية: الجذر الأول.\n2. (المستوى المتوقع) رتّب: ينمو الساق الأول – تمتص البذرة الماء – تبدأ الأوراق الأولية – يظهر الجذر الأول.\n   الإجابة النموذجية: تمتص البذرة الماء ← يظهر الجذر الأول ← ينمو الساق الأول ← تبدأ الأوراق الأولية.\n3. (المستوى المتقدم) لماذا تذبل البذرة ويصغر حجمها بعد الإنبات؟\n   الإجابة النموذجية: لأن مخزون الغذاء فيها يُستهلك أثناء الإنبات.", "1. (مستوى الدعم) صح أم خطأ: ينمو الجذر الأول متجهًا إلى أعلى.\n   الإجابة النموذجية: خطأ؛ ينمو إلى الأسفل.\n2. (المستوى المتوقع) عرّف الإنبات.\n   الإجابة النموذجية: بدء البذرة في النمو عندما تتوافر لها الظروف الملائمة.\n3. (المستوى المتقدم) نبتت بذور لوتس عمرها 1300 عام، ماذا يدل ذلك؟\n   الإجابة النموذجية: أن البذور يمكن أن تبقى حية دون إنبات مدة طويلة حتى تتهيأ لها الظروف الملائمة.", "للطالب: قراءة كتاب الطالب ص18 ومراجعة مفردات (الإنبات، يذبل، يمتص)، وإحضار بذرة فول جافة للحصة القادمة. لولي الأمر: مشاهدة إنبات بذرة مع الابن (مقطع مرئي أو بذرة في قطن مبلل) ومساعدته على وصف المراحل."]}, {"n": 2, "topic": "نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)", "f": ["1. يتنبأ بالتغيرات التي ستحدث لبذرة الفول عند نقعها في الماء\n2. يسجل ملاحظات أولية دقيقة عن البذرة الجافة (الطول، الملمس، الشكل)\nمخرج تعليمي آخر: يقترح طريقة يتحقق بها من صحة تنبؤه", "المخرج 1 (يتنبأ بالتغيرات التي ستحدث لبذرة الفول عند نقعها في الماء): تطبيق\nالمخرج 2 (يسجل ملاحظات أولية دقيقة عن البذرة الجافة (الطول، الملمس، الشكل)): فهم\nالمخرج الآخر (يقترح التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الحصة 1: الإنبات ومراحله\nالكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، صورة توضيحية، أخرى: بطاقات مصورة لمراحل الإنبات\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\nالكتاب، السبورة الذكية، الأقلام، أخرى: بذور فول جافة، أطباق بها ماء، مسطرة، ملصقات أسماء\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\nالكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: أطباق البذور المنقوعة، مسطرة", "الحصة 1: الإنبات ومراحله\nالإنبات، الجذر الأول، الساق الأول، الأوراق الأولية، يمتص، يذبل.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\nالإنبات، يمتص، التنبؤ.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\nالإنبات، يمتص، الجذر الأول، الساق الأول.", "الحصة 1: الإنبات ومراحله\nيعرض المعلم بذرة فول جافة وصورة شتلة فول ويسأل: «ما الذي حدث للبذرة حتى أصبحت هكذا؟ وما الذي يجعلها تبدأ في النمو؟»، ويدوّن أفكار الطلاب في مخطط ذهني.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\nيراجع المعلم أجزاء البذرة سريعًا بلعبة «أشر إلى الجزء» على رسم البذرة ص17، ثم يسأل: «ماذا تتوقع أن يحدث لبذرة فول إذا تركناها في الماء طوال الليل؟».\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\nيطلب المعلم من كل مجموعة قراءة تنبؤها المكتوب أمس، ثم يسأل: «هل تظن أن تنبؤك سيتحقق؟ لنرى!».", "الحصة 1: الإنبات ومراحله\n• التهيئة (5 دقائق):\n  المعلم: يعرض البذرة والشتلة ويبني مخططًا ذهنيًا بأفكار الطلاب.\n  الطالب: يقترحون ما يحدث للبذرة لتنمو.\n• مفهوم الإنبات (8 دقائق):\n  المعلم: يقرأ مع الطلاب ص18 ويوضح أن البذرة تبدأ النمو عندما تتوافر الظروف الملائمة، وتستخدم مخزون الغذاء للطاقة.\n  الطالب: يستخلصون تعريف الإنبات ويكتبونه.\n• عرض مراحل الإنبات (10 دقائق):\n  المعلم: يعرض مقطعًا مرئيًا لإنبات بذرة ويناقش رسم ص18: امتصاص الماء والانتفاخ، انفلاق الغلاف، الجذر الأول، الساق الأول، الأوراق الأولية، الجذور الجانبية.\n  الطالب: يشاهدون ويصفون كل مرحلة واتجاه نمو الجذر والساق.\n• ترتيب البطاقات (9 دقائق):\n  المعلم: يوزع بطاقات مراحل الإنبات مبعثرة على المجموعات.\n  الطالب: يرتبون البطاقات ويعرضون ترتيبهم ويبررونه.\n• بذور تنتظر سنوات (5 دقائق):\n  المعلم: يناقش مثال بذور اللوتس ص18 (بذور عمرها 1300 عام نبتت).\n  الطالب: يستنتجون أن البذور تبقى حية حتى تتهيأ لها الظروف.\n• الغلق (3 دقائق):\n  المعلم: يطرح سؤالًا ختاميًا: ما أول جزء يظهر من البذرة؟\n  الطالب: يجيبون ويرتبون المراحل شفهيًا.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\n• التهيئة (5 دقائق):\n  المعلم: ينفذ لعبة «أشر إلى الجزء» ويطرح سؤال التنبؤ.\n  الطالب: يشيرون إلى الأجزاء ويقدمون توقعات أولية.\n• ملاحظة البذرة الجافة (8 دقائق):\n  المعلم: يوزع البذور والمساطر ويطلب وصفًا دقيقًا.\n  الطالب: يقيسون طول البذرة ويصفون لونها وملمسها ويرسمونها.\n• كتابة التنبؤ (7 دقائق):\n  المعلم: يرسم على السبورة جدولًا (قبل النقع / التنبؤ / بعد النقع).\n  الطالب: ينقلون الجدول ويكتب كل طالب تنبؤه مع سببه.\n• إعداد النقع (8 دقائق):\n  المعلم: يوجه المجموعات وفق خطوات نشاط 1-2 ص19.\n  الطالب: يضعون البذرة في طبق به ماء ويكتبون اسم المجموعة عليه.\n• مناقشة (8 دقائق):\n  المعلم: يسأل: من أين سيدخل الماء إلى البذرة؟ كيف سنعرف أن تنبؤنا صحيح؟\n  الطالب: يقترحون الندبة ويقترحون القياس والمقارنة غدًا.\n• الغلق (4 دقائق):\n  المعلم: يذكّر بموعد الملاحظة في الحصة القادمة.\n  الطالب: يرتبون الأدوات ويحفظون الأطباق في مكان آمن.\nالمجموع: 40 دقيقة\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\n• التهيئة (5 دقائق):\n  المعلم: يستعرض التنبؤات المكتوبة.\n  الطالب: يقرؤون تنبؤاتهم.\n• الملاحظة والقياس (10 دقائق):\n  المعلم: يوجه إلى إخراج البذور وقياسها ولمسها.\n  الطالب: يقيسون الطول ويصفون الملمس والشكل ويكملون عمود «بعد النقع».\n• المقارنة والتفسير (8 دقائق):\n  المعلم: يسأل: هل دعمت الملاحظات تنبؤاتكم؟ لماذا انتفخت البذرة؟\n  الطالب: يقارنون ويفسرون: دخل الماء إلى البذرة فانتفخت ولانت.\n• أسئلة الكتاب ص19 (9 دقائق):\n  المعلم: يناقش الأسئلة (1–5).\n  الطالب: يجيبون: تمتص الماء لبدء الإنبات، الجذر الأول ينمو أولًا للأسفل لتثبيت النبات والحصول على الماء، الساق للأعلى نحو الضوء...\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة المجموعات (درس 1-2) على السبورة الذكية.\n  الطالب: تتنافس المجموعات في الإجابة.\nالمجموع: 40 دقيقة", "الحصة 1: الإنبات ومراحله\n1. (مستوى الدعم) ما أول جزء يظهر من البذرة عند الإنبات؟\n   الإجابة النموذجية: الجذر الأول.\n2. (المستوى المتوقع) رتّب: ينمو الساق الأول – تمتص البذرة الماء – تبدأ الأوراق الأولية – يظهر الجذر الأول.\n   الإجابة النموذجية: تمتص البذرة الماء ← يظهر الجذر الأول ← ينمو الساق الأول ← تبدأ الأوراق الأولية.\n3. (المستوى المتقدم) لماذا تذبل البذرة ويصغر حجمها بعد الإنبات؟\n   الإجابة النموذجية: لأن مخزون الغذاء فيها يُستهلك أثناء الإنبات.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\n1. (مستوى الدعم) ماذا وضعنا مع بذرة الفول في الطبق؟\n   الإجابة النموذجية: ماءً.\n2. (المستوى المتوقع) اذكر تنبؤًا واحدًا لما سيحدث للبذرة بعد نقعها.\n   الإجابة النموذجية: تكبر/تنتفخ، أو تصبح لينة، أو يتجعد غلافها.\n3. (المستوى المتقدم) كيف نتحقق من صحة تنبؤنا؟\n   الإجابة النموذجية: نقيس البذرة ونصفها بعد النقع ونقارن بالقياس قبل النقع.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\n1. (مستوى الدعم) كيف أصبح ملمس البذرة بعد نقعها؟\n   الإجابة النموذجية: لينة (أكثر ليونة).\n2. (المستوى المتوقع) لماذا تحتاج البذور إلى امتصاص الماء؟\n   الإجابة النموذجية: لكي تبدأ عملية الإنبات.\n3. (المستوى المتقدم) هل دعمت ملاحظاتك تنبؤك؟ وضّح كيف قررت ذلك.\n   الإجابة النموذجية: تقبل إجابة تقارن التنبؤ بالقياس الفعلي (مثل: تنبأت أنها ستكبر وزاد طولها من … إلى …).", "الحصة 1: الإنبات ومراحله\n1. (مستوى الدعم) صح أم خطأ: ينمو الجذر الأول متجهًا إلى أعلى.\n   الإجابة النموذجية: خطأ؛ ينمو إلى الأسفل.\n2. (المستوى المتوقع) عرّف الإنبات.\n   الإجابة النموذجية: بدء البذرة في النمو عندما تتوافر لها الظروف الملائمة.\n3. (المستوى المتقدم) نبتت بذور لوتس عمرها 1300 عام، ماذا يدل ذلك؟\n   الإجابة النموذجية: أن البذور يمكن أن تبقى حية دون إنبات مدة طويلة حتى تتهيأ لها الظروف الملائمة.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\n1. (مستوى الدعم) ما الأداة التي نقيس بها طول البذرة؟\n   الإجابة النموذجية: المسطرة.\n2. (المستوى المتوقع) لماذا قسنا البذرة قبل نقعها؟\n   الإجابة النموذجية: لنقارن قياسها بعد النقع ونعرف التغير الذي حدث.\n3. (المستوى المتقدم) كيف تجعل نتيجة هذا النشاط أكثر موثوقية؟\n   الإجابة النموذجية: بنقع عدد من البذور بدل بذرة واحدة وقياسها جميعًا.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\n1. (مستوى الدعم) صح أم خطأ: يزداد حجم البذرة بعد نقعها في الماء.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) إلى أي اتجاه ينمو الساق الأول؟ ولماذا؟\n   الإجابة النموذجية: إلى أعلى؛ ليشق التربة ويصل إلى الضوء.\n3. (المستوى المتقدم) لماذا تبدأ الأوراق الجديدة النمو فوق سطح التربة؟\n   الإجابة النموذجية: لأنها تحتاج إلى الضوء لتصنع غذاء النبات.", "الحصة 1: الإنبات ومراحله\nللطالب: قراءة كتاب الطالب ص18 ومراجعة مفردات (الإنبات، يذبل، يمتص)، وإحضار بذرة فول جافة للحصة القادمة. لولي الأمر: مشاهدة إنبات بذرة مع الابن (مقطع مرئي أو بذرة في قطن مبلل) ومساعدته على وصف المراحل.\n\nالحصة 2: نشاط 1-2: لاحظ إحدى البذور (التنبؤ والإعداد)\nللطالب: الاحتفاظ بجدول التنبؤ، وقراءة نشاط 1-2 ص19 في كتاب الطالب. لولي الأمر: تكرار التجربة في المنزل بنقع بذرتي فول أو حمص ليلة كاملة وملاحظتهما مع الابن صباحًا.\n\nالحصة 3: نتائج نشاط 1-2 وتفسيرها\nللطالب: حل تمرين 1-2 بكتاب النشاط ص17 (ترتيب صور مراحل الإنبات)، ومراجعة إجابات أسئلة ص19. لولي الأمر: مناقشة الابن في سبب انتفاخ البقوليات عند نقعها قبل الطهي."]}, {"code": "1-3", "title": "استقصاء عملية الإنبات", "unit": 1, "dates": "الأسبوع الثاني (13–17/9/2026م)", "sb": "20–21", "tb": "22–24", "ab": "تمرين 1-3 ص18، ورقة العمل 1-3 ص55", "periods": [{"n": 1, "topic": "نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟", "f": ["1. يذكر ما تحتاجه البذور لكي تنبت\n2. ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات\nمخرج تعليمي آخر: يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء", "المخرج 1 (يذكر ما تحتاجه البذور لكي تنبت): تذكر\nالمخرج 2 (ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات): تطبيق\nالمخرج الآخر (يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: 20 بذرة صغيرة (عدس أو ماش)، مناديل ورقية، طبقان، كيسان بلاستيكيان، ماصة، رباط مطاطي، ماء", "الظروف الملائمة، الإنبات، الاختبار العادل.", "يعرض المعلم صورة الطالبات ص20 ويقرأ تساؤلاتهن: «هل يمكن أن تنبت البذور بدون ماء أو ضوء؟ هل تنبت في جو حار جدًا أو بارد جدًا؟»، ثم يبني مع الطلاب مخططًا ذهنيًا لما تحتاجه البذور.", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح التساؤلات.\n  الطالب: يقدمون أفكارهم حول احتياجات البذور.\n• مخطط ذهني (7 دقائق):\n  المعلم: يناقش العوامل اللازمة لنمو الإنسان والحيوان ثم البذور، ويدوّنها في مخطط ذهني.\n  الطالب: يقترحون: ماء، دفء، هواء، ضوء… ويصنفونها.\n• تنفيذ نشاط 1-3أ (15 دقيقة):\n  المعلم: يوجه المجموعات خطوة بخطوة وفق ص20، ويوضح طريقة شفط الهواء بالماصة وإحكام الكيس.\n  الطالب: يضعون 10 بذور على منديل رطب في كل طبق، ويغطونهما، ويضعونهما في كيسين، ويشفطون الهواء من أحدهما ويغلقون الآخر وفيه الهواء.\n• التنبؤ وضبط المتغيرات (6 دقائق):\n  المعلم: يسأل: ما الشيء الوحيد المختلف بين الكيسين؟ وما الأشياء المتساوية؟\n  الطالب: يسجلون تنبؤهم ويحددون المتغير (الهواء) والثوابت.\n• حفظ الأدوات (4 دقائق):\n  المعلم: يحدد مكانًا دافئًا واحدًا للكيسين، ويذكّر بقواعد السلامة.\n  الطالب: يضعون الكيسين في المكان المحدد وينظفون أماكنهم.\n• الغلق (3 دقائق):\n  المعلم: يسأل: متى نتحقق من النتائج؟\n  الطالب: يذكرون أن الملاحظة بعد يومين.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الشيء الذي أزلناه من أحد الكيسين؟\n   الإجابة النموذجية: الهواء.\n2. (المستوى المتوقع) ما الأشياء التي جعلناها متساوية في الكيسين؟\n   الإجابة النموذجية: عدد البذور، ونوعها، والمناديل الرطبة، والمكان الدافئ.\n3. (المستوى المتقدم) لماذا وضعنا كيسًا ثانيًا فيه هواء؟\n   الإجابة النموذجية: للمقارنة؛ حتى نعرف أن الفرق في النتائج سببه الهواء فقط (اختبار عادل).", "1. (مستوى الدعم) صح أم خطأ: نستخدم الماصة لشفط الهواء من الكيس.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) تنبأ: في أي الكيسين ستنبت البذور؟\n   الإجابة النموذجية: في الكيس الذي يحتوي على الهواء.\n3. (المستوى المتقدم) لماذا وضعنا الكيسين في المكان الدافئ نفسه؟\n   الإجابة النموذجية: حتى يكون الاختبار عادلًا ولا يؤثر اختلاف الدفء في النتيجة.", "للطالب: قراءة كتاب الطالب ص20، وكتابة ثلاثة أسئلة يريد معرفة إجابتها عن إنبات البذور. لولي الأمر: تذكير الابن بإحضار تربة جافة وعلب زجاجية فارغة (إن أمكن) لنشاط الحصة القادمة."]}, {"n": 2, "topic": "نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)", "f": ["1. يخطط لاستقصاء أثر الماء والدفء في إنبات البذور\n2. يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل\nمخرج تعليمي آخر: يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام", "المخرج 1 (يخطط لاستقصاء أثر الماء والدفء في إنبات البذور): تطبيق\nالمخرج 2 (يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل): تحليل\nالمخرج الآخر (يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام): إبداع", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: 4 علب زجاجية، 20 بذرة، تربة جافة، مخبار مدرج، ماء، ملصقات أرقام", "الاختبار العادل، الظروف الملائمة، المتغير.", "يسأل المعلم عن كيس البذور (1-3أ) وما يتوقعون رؤيته، ثم يطرح مشكلة: «مزارع زرع بذورًا في الشتاء البارد ولم تنبت، وزرعها جاره في تربة جافة ولم تنبت أيضًا. ما السبب؟ وكيف نتأكد؟».", "• التهيئة (5 دقائق):\n  المعلم: يطرح مشكلة المزارع.\n  الطالب: يقترحون أسبابًا: البرد، الجفاف.\n• قراءة النشاط (7 دقائق):\n  المعلم: يقرأ خطوات نشاط 1-3ب ص21 ويحدد الهدف.\n  الطالب: يحددون ما سيختبرونه: الماء والدفء.\n• إعداد العلب الأربع (13 دقيقة):\n  المعلم: يتابع الترقيم وتساوي كمية التربة، ويقيس الماء بالمخبار.\n  الطالب: يرقمون العلب 1–4، ويملؤونها بتربة متساوية، ويضعون 5 بذور ظاهرة على جوانب كل علبة، ويرطبون 1 و2، ويضعون 1 و3 في مكان دافئ و2 و4 في مكان بارد.\n• تصميم جدول التسجيل (7 دقائق):\n  المعلم: يناقش أعمدة الجدول (رقم العلبة، الظروف، عدد البذور النابتة في كل يوم ملاحظة).\n  الطالب: يرسمون الجدول في دفاترهم.\n• مناقشة الاختبار العادل (5 دقائق):\n  المعلم: يناقش السؤالين (1) و(2ج) ص21.\n  الطالب: يذكرون كيف يكون الاختبار عادلًا ولماذا 40 بذرة أفضل من 20.\n• الغلق (3 دقائق):\n  المعلم: يوزع أدوار الترطيب والملاحظة كل يومين.\n  الطالب: يسجلون أدوارهم.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما رقما العلبتين اللتين رطّبنا تربتهما؟\n   الإجابة النموذجية: العلبتان 1 و2.\n2. (المستوى المتوقع) ما العاملان اللذان نختبرهما في هذا الاستقصاء؟\n   الإجابة النموذجية: الماء والدفء.\n3. (المستوى المتقدم) لماذا تكون النتائج أفضل إذا استخدمنا 40 بذرة بدلًا من 20؟\n   الإجابة النموذجية: لأن العدد الأكبر يعطي أدلة أكثر ونتائج أكثر موثوقية.", "1. (مستوى الدعم) أين وضعنا العلبتين 2 و4؟\n   الإجابة النموذجية: في مكان بارد.\n2. (المستوى المتوقع) كيف نتأكد أن اختبارنا عادل؟\n   الإجابة النموذجية: نستخدم الكمية نفسها من التربة، والعدد والنوع نفسيهما من البذور، والكمية نفسها من الماء للعلب المرطبة، ونغير عاملًا واحدًا فقط في كل مقارنة.\n3. (المستوى المتقدم) هل يوضح هذا الاستقصاء ما إذا كانت البذور تحتاج إلى الهواء؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن جميع العلب تحتوي على الهواء، فلا توجد علبة بلا هواء للمقارنة.", "للطالب: متابعة ترطيب العلبتين 1 و2 حسب الجدول، وتسجيل الملاحظات كل يومين مدة ثمانية أيام. لولي الأمر: سؤال الابن يوميًا عن ملاحظاته على البذور وتشجيعه على الدقة في التسجيل."]}, {"n": 3, "topic": "تحليل نتائج الإنبات والاستنتاج", "f": ["1. يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء\n2. يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء\nمخرج تعليمي آخر: يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات", "المخرج 1 (يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء): تحليل\nالمخرج 2 (يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء): فهم\nالمخرج الآخر (يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات): إبداع", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: كيسا نشاط 1-3أ، عدسة مكبرة", "الإنبات، الظروف الملائمة، الاستنتاج.", "يحضر المعلم كيسي نشاط 1-3أ مغلقين ويطلب من الطلاب تذكّر تنبؤاتهم قبل فتحهما وملاحظة البذور.", "• التهيئة (5 دقائق):\n  المعلم: يعرض الكيسين ويستدعي التنبؤات.\n  الطالب: يتذكرون تنبؤاتهم.\n• نتائج نشاط 1-3أ (8 دقائق):\n  المعلم: يوجه إلى ملاحظة البذور في الكيسين بالعدسة.\n  الطالب: يلاحظون إنبات البذور في الكيس الذي به هواء وعدم إنباتها في الكيس الخالي، ويستنتجون حاجتها للهواء.\n• تحليل بيانات (9 دقائق):\n  المعلم: يقدم تمرين 1-3 بكتاب النشاط ص18 (بذور وُضعت في أماكن مختلفة).\n  الطالب: يحللون البيانات ويحددون الأماكن التي توافرت فيها ظروف الإنبات.\n• أسئلة الكتاب ص21 (8 دقائق):\n  المعلم: يناقش الأسئلة (3، 4، 5أ).\n  الطالب: يستنتجون: البذور تحتاج إلى ماء ودفء وهواء ولا تحتاج إلى ضوء.\n• تخطيط اختبار الضوء (4 دقائق):\n  المعلم: يطلب تخطيطًا مختصرًا للسؤال (5ب).\n  الطالب: يقترحون علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء بالدفء نفسه.\n• مسابقة المجموعات (6 دقائق):\n  المعلم: يشغّل المسابقة (درس 1-3).\n  الطالب: تتنافس المجموعات.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) هل نبتت البذور في الكيس الخالي من الهواء؟\n   الإجابة النموذجية: لا.\n2. (المستوى المتوقع) اذكر ثلاثة أشياء تحتاجها البذور لتنبت.\n   الإجابة النموذجية: الماء، والدفء، والهواء.\n3. (المستوى المتقدم) هل تحتاج البذور إلى الضوء لتنبت؟ كيف تتحقق من ذلك؟\n   الإجابة النموذجية: لا تحتاج؛ نتحقق بوضع علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء مع تثبيت الماء والدفء ونقارن الإنبات.", "1. (مستوى الدعم) أكمل: تنبت البذور عندما تتوافر لها الظروف ……\n   الإجابة النموذجية: الملائمة.\n2. (المستوى المتوقع) لماذا تنبت معظم البذور في فصل الربيع؟\n   الإجابة النموذجية: لتوافر الدفء والرطوبة (الماء) والهواء.\n3. (المستوى المتقدم) نبتت بذور في درج مظلم دافئ ولم تنبت بذور في المجمّد، ماذا تستنتج؟\n   الإجابة النموذجية: الضوء غير لازم للإنبات، بينما الدفء لازم.", "للطالب: حل تمرين 1-3 بكتاب النشاط ص18، والطلاب المتميزون: ورقة العمل 1-3 (تخطيط استقصاء حول نمو البذور) ص55، مع الاستمرار في متابعة علب نشاط 1-3ب. لولي الأمر: مناقشة الابن في سبب زراعة المحاصيل في مواسم محددة من السنة."]}], "combined": ["الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. يذكر ما تحتاجه البذور لكي تنبت\n2. ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات\nمخرج تعليمي آخر: يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\n1. يخطط لاستقصاء أثر الماء والدفء في إنبات البذور\n2. يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل\nمخرج تعليمي آخر: يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\n1. يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء\n2. يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء\nمخرج تعليمي آخر: يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالمخرج 1 (يذكر ما تحتاجه البذور لكي تنبت): تذكر\nالمخرج 2 (ينفذ استقصاء لمعرفة حاجة البذور إلى الهواء للإنبات): تطبيق\nالمخرج الآخر (يحدد العامل الذي غيّره والعوامل التي ثبّتها في الاستقصاء): تحليل\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nالمخرج 1 (يخطط لاستقصاء أثر الماء والدفء في إنبات البذور): تطبيق\nالمخرج 2 (يحدد العوامل التي يغيرها والعوامل التي يثبتها لإجراء اختبار عادل): تحليل\nالمخرج الآخر (يصمم جدولًا لتسجيل ملاحظات الإنبات كل يومين مدة ثمانية أيام): إبداع\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nالمخرج 1 (يفسر نتائج نشاط 1-3أ عن حاجة البذور إلى الهواء): تحليل\nالمخرج 2 (يستنتج أن البذور تحتاج إلى الماء والدفء والهواء لتنبت ولا تحتاج إلى الضوء): فهم\nالمخرج الآخر (يخطط استقصاءً يختبر به حاجة البذور إلى الضوء للإنبات): إبداع", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالتعلم بالاكتشاف، التعلم التعاوني، العصف الذهني\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nالتعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: 20 بذرة صغيرة (عدس أو ماش)، مناديل ورقية، طبقان، كيسان بلاستيكيان، ماصة، رباط مطاطي، ماء\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nالكتاب، السبورة الذكية، الأقلام، أخرى: 4 علب زجاجية، 20 بذرة، تربة جافة، مخبار مدرج، ماء، ملصقات أرقام\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: كيسا نشاط 1-3أ، عدسة مكبرة", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nالظروف الملائمة، الإنبات، الاختبار العادل.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nالاختبار العادل، الظروف الملائمة، المتغير.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nالإنبات، الظروف الملائمة، الاستنتاج.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nيعرض المعلم صورة الطالبات ص20 ويقرأ تساؤلاتهن: «هل يمكن أن تنبت البذور بدون ماء أو ضوء؟ هل تنبت في جو حار جدًا أو بارد جدًا؟»، ثم يبني مع الطلاب مخططًا ذهنيًا لما تحتاجه البذور.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nيسأل المعلم عن كيس البذور (1-3أ) وما يتوقعون رؤيته، ثم يطرح مشكلة: «مزارع زرع بذورًا في الشتاء البارد ولم تنبت، وزرعها جاره في تربة جافة ولم تنبت أيضًا. ما السبب؟ وكيف نتأكد؟».\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nيحضر المعلم كيسي نشاط 1-3أ مغلقين ويطلب من الطلاب تذكّر تنبؤاتهم قبل فتحهما وملاحظة البذور.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح التساؤلات.\n  الطالب: يقدمون أفكارهم حول احتياجات البذور.\n• مخطط ذهني (7 دقائق):\n  المعلم: يناقش العوامل اللازمة لنمو الإنسان والحيوان ثم البذور، ويدوّنها في مخطط ذهني.\n  الطالب: يقترحون: ماء، دفء، هواء، ضوء… ويصنفونها.\n• تنفيذ نشاط 1-3أ (15 دقيقة):\n  المعلم: يوجه المجموعات خطوة بخطوة وفق ص20، ويوضح طريقة شفط الهواء بالماصة وإحكام الكيس.\n  الطالب: يضعون 10 بذور على منديل رطب في كل طبق، ويغطونهما، ويضعونهما في كيسين، ويشفطون الهواء من أحدهما ويغلقون الآخر وفيه الهواء.\n• التنبؤ وضبط المتغيرات (6 دقائق):\n  المعلم: يسأل: ما الشيء الوحيد المختلف بين الكيسين؟ وما الأشياء المتساوية؟\n  الطالب: يسجلون تنبؤهم ويحددون المتغير (الهواء) والثوابت.\n• حفظ الأدوات (4 دقائق):\n  المعلم: يحدد مكانًا دافئًا واحدًا للكيسين، ويذكّر بقواعد السلامة.\n  الطالب: يضعون الكيسين في المكان المحدد وينظفون أماكنهم.\n• الغلق (3 دقائق):\n  المعلم: يسأل: متى نتحقق من النتائج؟\n  الطالب: يذكرون أن الملاحظة بعد يومين.\nالمجموع: 40 دقيقة\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\n• التهيئة (5 دقائق):\n  المعلم: يطرح مشكلة المزارع.\n  الطالب: يقترحون أسبابًا: البرد، الجفاف.\n• قراءة النشاط (7 دقائق):\n  المعلم: يقرأ خطوات نشاط 1-3ب ص21 ويحدد الهدف.\n  الطالب: يحددون ما سيختبرونه: الماء والدفء.\n• إعداد العلب الأربع (13 دقيقة):\n  المعلم: يتابع الترقيم وتساوي كمية التربة، ويقيس الماء بالمخبار.\n  الطالب: يرقمون العلب 1–4، ويملؤونها بتربة متساوية، ويضعون 5 بذور ظاهرة على جوانب كل علبة، ويرطبون 1 و2، ويضعون 1 و3 في مكان دافئ و2 و4 في مكان بارد.\n• تصميم جدول التسجيل (7 دقائق):\n  المعلم: يناقش أعمدة الجدول (رقم العلبة، الظروف، عدد البذور النابتة في كل يوم ملاحظة).\n  الطالب: يرسمون الجدول في دفاترهم.\n• مناقشة الاختبار العادل (5 دقائق):\n  المعلم: يناقش السؤالين (1) و(2ج) ص21.\n  الطالب: يذكرون كيف يكون الاختبار عادلًا ولماذا 40 بذرة أفضل من 20.\n• الغلق (3 دقائق):\n  المعلم: يوزع أدوار الترطيب والملاحظة كل يومين.\n  الطالب: يسجلون أدوارهم.\nالمجموع: 40 دقيقة\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\n• التهيئة (5 دقائق):\n  المعلم: يعرض الكيسين ويستدعي التنبؤات.\n  الطالب: يتذكرون تنبؤاتهم.\n• نتائج نشاط 1-3أ (8 دقائق):\n  المعلم: يوجه إلى ملاحظة البذور في الكيسين بالعدسة.\n  الطالب: يلاحظون إنبات البذور في الكيس الذي به هواء وعدم إنباتها في الكيس الخالي، ويستنتجون حاجتها للهواء.\n• تحليل بيانات (9 دقائق):\n  المعلم: يقدم تمرين 1-3 بكتاب النشاط ص18 (بذور وُضعت في أماكن مختلفة).\n  الطالب: يحللون البيانات ويحددون الأماكن التي توافرت فيها ظروف الإنبات.\n• أسئلة الكتاب ص21 (8 دقائق):\n  المعلم: يناقش الأسئلة (3، 4، 5أ).\n  الطالب: يستنتجون: البذور تحتاج إلى ماء ودفء وهواء ولا تحتاج إلى ضوء.\n• تخطيط اختبار الضوء (4 دقائق):\n  المعلم: يطلب تخطيطًا مختصرًا للسؤال (5ب).\n  الطالب: يقترحون علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء بالدفء نفسه.\n• مسابقة المجموعات (6 دقائق):\n  المعلم: يشغّل المسابقة (درس 1-3).\n  الطالب: تتنافس المجموعات.\nالمجموع: 40 دقيقة", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. (مستوى الدعم) ما الشيء الذي أزلناه من أحد الكيسين؟\n   الإجابة النموذجية: الهواء.\n2. (المستوى المتوقع) ما الأشياء التي جعلناها متساوية في الكيسين؟\n   الإجابة النموذجية: عدد البذور، ونوعها، والمناديل الرطبة، والمكان الدافئ.\n3. (المستوى المتقدم) لماذا وضعنا كيسًا ثانيًا فيه هواء؟\n   الإجابة النموذجية: للمقارنة؛ حتى نعرف أن الفرق في النتائج سببه الهواء فقط (اختبار عادل).\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\n1. (مستوى الدعم) ما رقما العلبتين اللتين رطّبنا تربتهما؟\n   الإجابة النموذجية: العلبتان 1 و2.\n2. (المستوى المتوقع) ما العاملان اللذان نختبرهما في هذا الاستقصاء؟\n   الإجابة النموذجية: الماء والدفء.\n3. (المستوى المتقدم) لماذا تكون النتائج أفضل إذا استخدمنا 40 بذرة بدلًا من 20؟\n   الإجابة النموذجية: لأن العدد الأكبر يعطي أدلة أكثر ونتائج أكثر موثوقية.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\n1. (مستوى الدعم) هل نبتت البذور في الكيس الخالي من الهواء؟\n   الإجابة النموذجية: لا.\n2. (المستوى المتوقع) اذكر ثلاثة أشياء تحتاجها البذور لتنبت.\n   الإجابة النموذجية: الماء، والدفء، والهواء.\n3. (المستوى المتقدم) هل تحتاج البذور إلى الضوء لتنبت؟ كيف تتحقق من ذلك؟\n   الإجابة النموذجية: لا تحتاج؛ نتحقق بوضع علبتين متماثلتين إحداهما في الظلام والأخرى في الضوء مع تثبيت الماء والدفء ونقارن الإنبات.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\n1. (مستوى الدعم) صح أم خطأ: نستخدم الماصة لشفط الهواء من الكيس.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) تنبأ: في أي الكيسين ستنبت البذور؟\n   الإجابة النموذجية: في الكيس الذي يحتوي على الهواء.\n3. (المستوى المتقدم) لماذا وضعنا الكيسين في المكان الدافئ نفسه؟\n   الإجابة النموذجية: حتى يكون الاختبار عادلًا ولا يؤثر اختلاف الدفء في النتيجة.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\n1. (مستوى الدعم) أين وضعنا العلبتين 2 و4؟\n   الإجابة النموذجية: في مكان بارد.\n2. (المستوى المتوقع) كيف نتأكد أن اختبارنا عادل؟\n   الإجابة النموذجية: نستخدم الكمية نفسها من التربة، والعدد والنوع نفسيهما من البذور، والكمية نفسها من الماء للعلب المرطبة، ونغير عاملًا واحدًا فقط في كل مقارنة.\n3. (المستوى المتقدم) هل يوضح هذا الاستقصاء ما إذا كانت البذور تحتاج إلى الهواء؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن جميع العلب تحتوي على الهواء، فلا توجد علبة بلا هواء للمقارنة.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\n1. (مستوى الدعم) أكمل: تنبت البذور عندما تتوافر لها الظروف ……\n   الإجابة النموذجية: الملائمة.\n2. (المستوى المتوقع) لماذا تنبت معظم البذور في فصل الربيع؟\n   الإجابة النموذجية: لتوافر الدفء والرطوبة (الماء) والهواء.\n3. (المستوى المتقدم) نبتت بذور في درج مظلم دافئ ولم تنبت بذور في المجمّد، ماذا تستنتج؟\n   الإجابة النموذجية: الضوء غير لازم للإنبات، بينما الدفء لازم.", "الحصة 1: نشاط 1-3أ: هل تحتاج البذور إلى هواء للإنبات؟\nللطالب: قراءة كتاب الطالب ص20، وكتابة ثلاثة أسئلة يريد معرفة إجابتها عن إنبات البذور. لولي الأمر: تذكير الابن بإحضار تربة جافة وعلب زجاجية فارغة (إن أمكن) لنشاط الحصة القادمة.\n\nالحصة 2: نشاط 1-3ب: استقصاء الظروف الملائمة للإنبات (التخطيط والإعداد)\nللطالب: متابعة ترطيب العلبتين 1 و2 حسب الجدول، وتسجيل الملاحظات كل يومين مدة ثمانية أيام. لولي الأمر: سؤال الابن يوميًا عن ملاحظاته على البذور وتشجيعه على الدقة في التسجيل.\n\nالحصة 3: تحليل نتائج الإنبات والاستنتاج\nللطالب: حل تمرين 1-3 بكتاب النشاط ص18، والطلاب المتميزون: ورقة العمل 1-3 (تخطيط استقصاء حول نمو البذور) ص55، مع الاستمرار في متابعة علب نشاط 1-3ب. لولي الأمر: مناقشة الابن في سبب زراعة المحاصيل في مواسم محددة من السنة."]}, {"code": "1-4", "title": "ماذا يحتاج النبات كي ينمو؟", "unit": 1, "dates": "الأسبوع الثاني (13–17/9/2026م)", "sb": "22–23", "tb": "25–26", "ab": "تمرين 1-4 ص20، ورقة العمل 1-4 ص57", "periods": [{"n": 1, "topic": "العوامل اللازمة لنمو النبات", "f": ["1. يذكر العوامل التي يحتاجها النبات لينمو: الطاقة الضوئية والهواء والماء والدفء\n2. يوضح أهمية كل عامل من عوامل نمو النبات\nمخرج تعليمي آخر: يقارن بين نبات صحي ونبات ذابل ويحدد العامل الناقص", "المخرج 1 (يذكر العوامل التي يحتاجها النبات لينمو: الطاقة الضوئية والهواء والماء والدفء): تذكر\nالمخرج 2 (يوضح أهمية كل عامل من عوامل نمو النبات): فهم\nالمخرج الآخر (يقارن بين نبات صحي ونبات ذابل ويحدد العامل الناقص): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: أصيص نبات صحي وأصيص نبات ذابل، بطاقات حالات نباتات", "العوامل، الطاقة الضوئية.", "يعرض المعلم صورة النباتين (1) و(2) ص22 أو أصيصين حقيقيين، ويسأل: «أي النباتين ينمو جيدًا؟ ماذا ينقص الآخر في رأيك؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض النباتين ويطرح السؤال.\n  الطالب: يقارنون ويقترحون العامل الناقص.\n• العوامل الأربعة (8 دقائق):\n  المعلم: يقدم مفهوم العوامل ويعلّم اختصار «ضهمد» (ضوء، هواء، ماء، دفء).\n  الطالب: يرددون الاختصار ويربطونه بإنبات البذور في الدرس السابق.\n• أهمية كل عامل (10 دقائق):\n  المعلم: يقرأ مع الطلاب ص22: الماء يقوي الساق والأوراق وينقل الغذاء، والدفء يناسب النمو، والضوء طاقة لصنع الغذاء في الأوراق، والهواء ضروري للنبات الحي.\n  الطالب: يكملون جدولًا: العامل – أهميته للنبات.\n• بطاقات الحالات (8 دقائق):\n  المعلم: يوزع بطاقات (نبات في خزانة مظلمة، نبات لم يُروَ أسبوعًا، نبات في ثلاجة…).\n  الطالب: تحدد كل مجموعة العامل الناقص وتتوقع شكل النبات.\n• تحدث عن (5 دقائق):\n  المعلم: يطرح سؤال ص23: هل تحتاج النباتات إلى تربة؟\n  الطالب: يناقشون أمثلة كاللوتس وزنبق الماء والزراعة المائية.\n• الغلق (4 دقائق):\n  المعلم: يطرح سؤالًا ختاميًا.\n  الطالب: يذكرون العوامل الأربعة ومثالًا لأهمية كل منها.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الاختصار الذي يساعدنا على تذكر عوامل نمو النبات؟\n   الإجابة النموذجية: «ضهمد»: ضوء، هواء، ماء، دفء.\n2. (المستوى المتوقع) لماذا يحتاج النبات إلى الماء؟\n   الإجابة النموذجية: ليكون له ساق قوية وأوراق ثابتة، ولنقل المواد مثل الغذاء إلى أجزائه.\n3. (المستوى المتقدم) نبات طويل نحيف أصفر الأوراق، ما العامل الناقص على الأرجح؟\n   الإجابة النموذجية: الطاقة الضوئية.", "1. (مستوى الدعم) صح أم خطأ: تصنع النباتات غذاءها بنفسها.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) من أين يحصل النبات على الطاقة اللازمة لصنع غذائه؟\n   الإجابة النموذجية: من ضوء الشمس (الطاقة الضوئية) في أوراقه.\n3. (المستوى المتقدم) هل تحتاج كل النباتات إلى تربة لتنمو؟ أعطِ مثالًا.\n   الإجابة النموذجية: لا؛ فاللوتس وزنبق الماء تنمو في الماء مع الطلاب ظروف كل نبات في نشاط 1-4.\n  الطالب: يربطون كل نبات بظروفه (شمس/ظل، ري/بدون ري، تحت السرير).\n• نمذجة الرسم (5 دقائق):\n  المعلم: يرسم المحورين على السبورة ويختار مقياسًا (كل مربع = 1 cm أو 5 cm) ويعنون المحاور.\n  الطالب: يتابعون خطوات الرسم.\n• رسم التمثيل (10 دقائق):\n  المعلم: يتابع ويقدم الدعم الفردي.\n  الطالب: يرسمون أعمدة متباعدة متساوية العرض بارتفاعات صحيحة ويسمونها.\n• أسئلة النشاط (7 دقائق):\n  المعلم: يناقش الأسئلة (1–6) ص23.\n  الطالب: يفسرون: نبات عبدالله الأفضل، سعيد جاف لنقص الماء، طارق نحيف لنقص الضوء، محمد أقصر لقلة الضوء في الظل.\n• مسابقة المجموعات (7 دقائق):\n  المعلم: يشغّل المسابقة (درس 1-4).\n  الطالب: تتنافس المجموعات.\nالمجموع: 40 دقيقة", "الحصة 1: العوامل اللازمة لنمو النبات\n1. (مستوى الدعم) ما الاختصار الذي يساعدنا على تذكر عوامل نمو النبات؟\n   الإجابة النموذجية: «ضهمد»: ضوء، هواء، ماء، دفء.\n2. (المستوى المتوقع) لماذا يحتاج النبات إلى الماء؟\n   الإجابة النموذجية: ليكون له ساق قوية وأوراق ثابتة، ولنقل المواد مثل الغذاء إلى أجزائه.\n3. (المستوى المتقدم) نبات طويل نحيف أصفر الأوراق، ما العامل الناقص على الأرجح؟\n   الإجابة النموذجية: الطاقة الضوئية.\n\nالحصة 2: نشاط 1-4: التمثيل البياني بالأعمدة لنمو النبات\n1. (مستوى الدعم) أي النباتات نما بأفضل حال؟\n   الإجابة النموذجية: نبات عبدالله (25 cm).\n2. (المستوى المتوقع) لماذا كان نبات سعيد جافًا بني اللون؟\n   الإجابة النموذجية: لأنه لم يُروَ؛ فنقص الماء.\n3. (المستوى المتقدم) لماذا كان نبات طارق نحيفًا ضعيفًا رغم ريّه؟\n   الإجابة النموذجية: لأنه وُضع تحت السرير فلم يحصل على ضوء كافٍ.", "الحصة 1: العوامل اللازمة لنمو النبات\n1. (مستوى الدعم) صح أم خطأ: تصنع النباتات غذاءها بنفسها.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) من أين يحصل النبات على الطاقة اللازمة لصنع غذائه؟\n   الإجابة النموذجية: من ضوء الشمس (الطاقة الضوئية) في أوراقه.\n3. (المستوى المتقدم) هل تحتاج كل النباتات إلى تربة لتنمو؟ أعطِ مثالًا.\n   الإجابة النموذجية: لا؛ فاللوتس وزنبق الماء تنمو في الماء.\n\nالحصة 2: نشاط 1-4: التمثيل البياني بالأعمدة لنمو النبات\n1. (مستوى الدعم) كم يزيد طول نبات عبدالله على طول نبات محمد؟\n   الإجابة النموذجية: 25 − 18 = 7 cm.\n2. (المستوى المتوقع) لماذا نستخدم التمثيل البياني بالأعمدة لعرض هذه البيانات؟\n   الإجابة النموذجية: لأننا نقارن نتائج أشياء (نباتات) مختلفة.\n3. (المستوى المتقدم) تنبأ بطول نبات في بيت زجاجي يحصل على كمية كافية من الماء، وفسّر تنبؤك.\n   الإجابة النموذجية: أطول من 25 cm تقريبًا؛ لتوافر الضوء والدفء والماء والهواء.", "الحصة 1: العوامل اللازمة لنمو النبات\nللطالب: قراءة كتاب الطالب ص22، ومراجعة جدول نشاط 1-4 ص23 استعدادًا لرسم التمثيل البياني. لولي الأمر: إحضار ورقة مربعات ومسطرة، وملاحظة نبات في المنزل أو الحي مع الابن ووصف حالته.\n\nالحصة 2: نشاط 1-4: التمثيل البياني بالأعمدة لنمو النبات\nللطالب: حل تمرين 1-4 بكتاب النشاط ص20، وإكمال ورقة العمل 1-4 (ارسم تمثيلًا بيانيًا بالأعمدة وصورة عن نمو النبات) ص57. لولي الأمر: متابعة دقة الأعمدة واستخدام المسطرة في الرسم."]}, {"code": "1-5", "title": "النبات والضوء", "unit": 1, "dates": "الأسبوع الثالث (20–24/9/2026م)", "sb": "24–25", "tb": "27–30", "ab": "تمرين 1-5 ص21، ورقة العمل 1-5 ص59", "periods": [{"n": 1, "topic": "نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)", "f": ["1. يخطط لاستقصاء تأثير الضوء على نمو النبات مع تثبيت العوامل الأخرى\n2. يقيس طول النبتة ويعدّ أوراقها ويسجلها بدقة\nمخرج تعليمي آخر: يتنبأ بنمو كل نبتة ويعلل تنبؤه بالمعرفة العلمية", "المخرج 1 (يخطط لاستقصاء تأثير الضوء على نمو النبات مع تثبيت العوامل الأخرى): تطبيق\nالمخرج 2 (يقيس طول النبتة ويعدّ أوراقها ويسجلها بدقة): تطبيق\nالمخرج الآخر (يتنبأ بنمو كل نبتة ويعلل تنبؤه بالمعرفة العلمية): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: أصيصا زرع متشابهان، خزانة مظلمة، مخبار مدرج، مسطرة، قلم تخطيط، ماء", "الطاقة الضوئية، الاختبار العادل، التنبؤ.", "يسأل المعلم عن اختصار «ضهمد»، ثم يطرح سؤالًا: «إذا أردنا أن نثبت أن الضوء ضروري لنمو النبات، هل يكفي أن نضع نبتة واحدة في الضوء ونقيس نموها؟».", "• التهيئة (5 دقائق):\n  المعلم: يراجع «ضهمد» ويطرح السؤال.\n  الطالب: يناقشون ويقترحون الحاجة إلى نبتتين.\n• لماذا نبتتان؟ (8 دقائق):\n  المعلم: يوضح فكرة المقارنة: نبتة في الضوء وأخرى في الظلام، مع تثبيت الماء ونوع النبات وحجمه.\n  الطالب: يحددون المتغير (الضوء) والعوامل الثابتة.\n• إعداد النشاط (12 دقيقة):\n  المعلم: يوجه وفق ص24: خط مرجعي عند قاعدة الساق، قياس الطول، عدّ الأوراق، الري بالكمية نفسها.\n  الطالب: يقيسون ويسجلون، ويضعون النبتة (أ) عند النافذة و(ب) في الخزانة.\n• جدول وتنبؤ (7 دقائق):\n  المعلم: يعرض جدول ص24 (الطول، عدد الأوراق، لون الساق والأوراق، الشكل العام).\n  الطالب: ينسخون الجدول ويكتبون تنبؤاتهم.\n• خطة المتابعة (5 دقائق):\n  المعلم: يوزع مهام القياس والري كل أربعة أيام مدة ثلاثة أسابيع.\n  الطالب: يسجلون مواعيد المتابعة.\n• الغلق (3 دقائق):\n  المعلم: يسأل عن العامل المتغير.\n  الطالب: يجيبون: الضوء.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) أين وضعنا النبتة (ب)؟\n   الإجابة النموذجية: في خزانة مظلمة.\n2. (المستوى المتوقع) ما العوامل التي جعلناها متساوية للنبتتين؟\n   الإجابة النموذجية: كمية الماء، ونوع النبات وحجمه، وحجم الأصيص.\n3. (المستوى المتقدم) لماذا رسمنا خطًا عند قاعدة النبتة قبل القياس؟\n   الإجابة النموذجية: ليكون نقطة مرجعية ثابتة نقيس منها في كل مرة.", "1. (مستوى الدعم) ما الأداة التي نقيس بها كمية ماء الري؟\n   الإجابة النموذجية: المخبار المدرج.\n2. (المستوى المتوقع) ما العامل الذي نغيّره في هذا الاستقصاء؟\n   الإجابة النموذجية: الضوء.\n3. (المستوى المتقدم) لماذا نكرر القياس كل أربعة أيام بدل قياس واحد في النهاية؟\n   الإجابة النموذجية: لنتابع التغير بمرور الزمن ونحصل على نتائج أدق وأكثر موثوقية.", "للطالب: قراءة كتاب الطالب ص24، والمشاركة في متابعة القياس والري حسب الجدول. لولي الأمر: تنفيذ تجربة مماثلة في المنزل بنبتتين صغيرتين (إن أمكن) ومتابعة الفرق مع الابن."]}, {"n": 2, "topic": "اختيار التمثيل البياني: الأعمدة أم الخطي؟", "f": ["1. يميز متى يستخدم التمثيل البياني بالأعمدة ومتى يستخدم التمثيل الخطي\n2. يمثل تغير طول النبتة بمرور الزمن بتمثيل خطي\nمخرج تعليمي آخر: يحلل نتائج نمو النبات من تمثيل بياني معطى", "المخرج 1 (يميز متى يستخدم التمثيل البياني بالأعمدة ومتى يستخدم التمثيل الخطي): فهم\nالمخرج 2 (يمثل تغير طول النبتة بمرور الزمن بتمثيل خطي): تطبيق\nالمخرج الآخر (يحلل نتائج نمو النبات من تمثيل بياني معطى): تحليل", "التعلم بالنمذجة، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مربعات، مسطرة، أصيصا النشاط 1-5", "التمثيل البياني بالأعمدة، التمثيل الخطي، الزمن.", "يبدأ المعلم بتسجيل قياسات اليوم للنبتتين (أ) و(ب) في الجدول، ثم يسأل: «كيف نعرض تغيّر طول النبتة يومًا بعد يوم في رسم واحد؟».", "• التهيئة (5 دقائق):\n  المعلم: يشرف على تسجيل قياسات اليوم ويطرح السؤال.\n  الطالب: يقيسون ويسجلون.\n• الأعمدة أم الخطي (8 دقائق):\n  المعلم: يعرض أمثلة مهارات الاستقصاء ص64–65: عدد بذور الثمار (أعمدة)، وتبريد الماء بمرور الزمن (خطي).\n  الطالب: يستنتجون قاعدة الاختيار.\n• نمذجة التمثيل الخطي (10 دقائق):\n  المعلم: يرسم بيانات تبريد الماء ص65 خطوة بخطوة (المحاور، المقياس، النقاط، التوصيل).\n  الطالب: يرسمون معه في دفاترهم.\n• ورقة العمل 1-5 (12 دقيقة):\n  المعلم: يقدم ورقة العمل 1-5 (تحليل النتائج حول نمو النبات) ص59.\n  الطالب: يحللون البيانات ويجيبون عن الأسئلة.\n• الغلق (5 دقائق):\n  المعلم: يسأل: أي تمثيل سنستخدم لنتائج نشاط 1-5؟ ولماذا؟\n  الطالب: يجيبون: الخطي لأن الطول يتغير بمرور الزمن.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) أي تمثيل نستخدم لعرض تغير طول النبتة بمرور الزمن؟\n   الإجابة النموذجية: التمثيل الخطي.\n2. (المستوى المتوقع) في مثال ص65 كم أصبحت درجة حرارة الماء بعد 6 دقائق؟\n   الإجابة النموذجية: 20°C.\n3. (المستوى المتقدم) لماذا نرسم خطي النبتتين (أ) و(ب) على المحورين نفسيهما؟\n   الإجابة النموذجية: لتسهل المقارنة بين نموهما.", "1. (مستوى الدعم) صح أم خطأ: نستخدم الأعمدة لعرض عدد بذور ثمار مختلفة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ماذا نضع على المحور الأفقي عند تمثيل نمو النبتة؟\n   الإجابة النموذجية: الزمن (التاريخ أو الأيام).\n3. (المستوى المتقدم) توقف ارتفاع خط النبتة (ب) ثم بدأ يقل عدد أوراقها، ماذا تستنتج؟\n   الإجابة النموذجية: أنها استهلكت مخزون غذائها ولا تستطيع صنع غذاء جديد دون ضوء فبدأت تضعف.", "للطالب: إكمال ورقة العمل 1-5 ص59، ومراجعة صفحتي مهارات الاستقصاء العلمي ص64–65 في كتاب الطالب. لولي الأمر: تدريب الابن على قراءة تمثيل خطي بسيط (مثل درجات ال 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\n• التهيئة (5 دقائق):\n  المعلم: يراجع «ضهمد» ويطرح السؤال.\n  الطالب: يناقشون ويقترحون الحاجة إلى نبتتين.\n• لماذا نبتتان؟ (8 دقائق):\n  المعلم: يوضح فكرة المقارنة: نبتة في الضوء وأخرى في الظلام، مع تثبيت الماء ونوع النبات وحجمه.\n  الطالب: يحددون المتغير (الضوء) والعوامل الثابتة.\n• إعداد النشاط (12 دقيقة):\n  المعلم: يوجه وفق ص24: خط مرجعي عند قاعدة الساق، قياس الطول، عدّ الأوراق، الري بالكمية نفسها.\n  الطالب: يقيسون ويسجلون، ويضعون النبتة (أ) عند النافذة و(ب) في الخزانة.\n• جدول وتنبؤ (7 دقائق):\n  المعلم: يعرض جدول ص24 (الطول، عدد الأوراق، لون الساق والأوراق، الشكل العام).\n  الطالب: ينسخون الجدول ويكتبون تنبؤاتهم.\n• خطة المتابعة (5 دقائق):\n  المعلم: يوزع مهام القياس والري كل أربعة أيام مدة ثلاثة أسابيع.\n  الطالب: يسجلون مواعيد المتابعة.\n• الغلق (3 دقائق):\n  المعلم: يسأل عن العامل المتغير.\n  الطالب: يجيبون: الضوء.\nالمجموع: 40 دقيقة\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\n• التهيئة (5 دقائق):\n  المعلم: يشرف على تسجيل قياسات اليوم ويطرح السؤال.\n  الطالب: يقيسون ويسجلون.\n• الأعمدة أم الخطي (8 دقائق):\n  المعلم: يعرض أمثلة مهارات الاستقصاء ص64–65: عدد بذور الثمار (أعمدة)، وتبريد الماء بمرور الزمن (خطي).\n  الطالب: يستنتجون قاعدة الاختيار.\n• نمذجة التمثيل الخطي (10 دقائق):\n  المعلم: يرسم بيانات تبريد الماء ص65 خطوة بخطوة (المحاور، المقياس، النقاط، التوصيل).\n  الطالب: يرسمون معه في دفاترهم.\n• ورقة العمل 1-5 (12 دقيقة):\n  المعلم: يقدم ورقة العمل 1-5 (تحليل النتائج حول نمو النبات) ص59.\n  الطالب: يحللون البيانات ويجيبون عن الأسئلة.\n• الغلق (5 دقائق):\n  المعلم: يسأل: أي تمثيل سنستخدم لنتائج نشاط 1-5؟ ولماذا؟\n  الطالب: يجيبون: الخطي لأن الطول يتغير بمرور الزمن.\nالمجموع: 40 دقيقة\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\n• التهيئة (5 دقائق):\n  المعلم: يعرض الأصيصين.\n  الطالب: يصفون الفروق في الطول واللون وعدد الأوراق.\n• مقارنة النبتتين (8 دقائق):\n  المعلم: يوجه لاستكمال الجدول وتمثيل الأطوال خطيًا.\n  الطالب: يلاحظون أن (ب) طويلة نحيفة باهتة صفراء، و(أ) خضراء قوية.\n• أسئلة الكتاب ص25 (10 دقائق):\n  المعلم: يناقش الأسئلة (1–4).\n  الطالب: يجيبون: (أ) نمت أفضل، يقيسون بالمسطرة وعدّ الأوراق، الاختبار عادل لثبات العوامل عدا الضوء، ويكتبون استنتاجًا.\n• التحدي (8 دقائق):\n  المعلم: يطرح تحدي ص25: صمم اختبارًا عادلًا يوضح حاجة النبات إلى الهواء.\n  الطالب: يقترحون نبتتين متماثلتين إحداهما في وعاء محكم تُزال منه الغازات والأخرى في الهواء، مع تثبيت بقية العوامل.\n• مسابقة المجموعات (9 دقائق):\n  المعلم: يشغّل المسابقة (درس 1-5).\n  الطالب: تتنافس المجموعات.\nالمجموع: 40 دقيقة", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\n1. (مستوى الدعم) أين وضعنا النبتة (ب)؟\n   الإجابة النموذجية: في خزانة مظلمة.\n2. (المستوى المتوقع) ما العوامل التي جعلناها متساوية للنبتتين؟\n   الإجابة النموذجية: كمية الماء، ونوع النبات وحجمه، وحجم الأصيص.\n3. (المستوى المتقدم) لماذا رسمنا خطًا عند قاعدة النبتة قبل القياس؟\n   الإجابة النموذجية: ليكون نقطة مرجعية ثابتة نقيس منها في كل مرة.\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\n1. (مستوى الدعم) أي تمثيل نستخدم لعرض تغير طول النبتة بمرور الزمن؟\n   الإجابة النموذجية: التمثيل الخطي.\n2. (المستوى المتوقع) في مثال ص65 كم أصبحت درجة حرارة الماء بعد 6 دقائق؟\n   الإجابة النموذجية: 20°C.\n3. (المستوى المتقدم) لماذا نرسم خطي النبتتين (أ) و(ب) على المحورين نفسيهما؟\n   الإجابة النموذجية: لتسهل المقارنة بين نموهما.\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\n1. (مستوى الدعم) ما لون أوراق النبتة التي بقيت في الظلام؟\n   الإجابة النموذجية: صفراء باهتة.\n2. (المستوى المتوقع) لماذا نمت النبتة (ب) طويلة نحيفة؟\n   الإجابة النموذجية: لأنها استهلكت مخزون غذائها في محاولة النمو نحو الضوء دون أن تصنع غذاءً جديدًا.\n3. (المستوى المتقدم) هل كان الاختبار عادلًا؟ وضّح.\n   الإجابة النموذجية: نعم؛ لأننا غيرنا عاملًا واحدًا هو الضوء وثبتنا الماء ونوع النبات وحجمه والأصيص.", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\n1. (مستوى الدعم) ما الأداة التي نقيس بها كمية ماء الري؟\n   الإجابة النموذجية: المخبار المدرج.\n2. (المستوى المتوقع) ما العامل الذي نغيّره في هذا الاستقصاء؟\n   الإجابة النموذجية: الضوء.\n3. (المستوى المتقدم) لماذا نكرر القياس كل أربعة أيام بدل قياس واحد في النهاية؟\n   الإجابة النموذجية: لنتابع التغير بمرور الزمن ونحصل على نتائج أدق وأكثر موثوقية.\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\n1. (مستوى الدعم) صح أم خطأ: نستخدم الأعمدة لعرض عدد بذور ثمار مختلفة.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) ماذا نضع على المحور الأفقي عند تمثيل نمو النبتة؟\n   الإجابة النموذجية: الزمن (التاريخ أو الأيام).\n3. (المستوى المتقدم) توقف ارتفاع خط النبتة (ب) ثم بدأ يقل عدد أوراقها، ماذا تستنتج؟\n   الإجابة النموذجية: أنها استهلكت مخزون غذائها ولا تستطيع صنع غذاء جديد دون ضوء فبدأت تضعف.\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\n1. (مستوى الدعم) أكمل: تحتاج النباتات إلى طاقة …… لتصنع غذاءها.\n   الإجابة النموذجية: ضوئية.\n2. (المستوى المتوقع) لماذا تنمو بعض النباتات في الأماكن الظليلة إلى حجم كبير؟\n   الإجابة النموذجية: لأن لها أوراقًا كبيرة تمتص ضوءًا أكثر، وتكون التربة هناك رطبة غالبًا.\n3. (المستوى المتقدم) لو أعدت الاستقصاء باستخدام نوع آخر من النباتات، هل تتوقع النتيجة نفسها؟ لماذا؟\n   الإجابة النموذجية: نعم غالبًا؛ لأن جميع النباتات تحتاج إلى الطاقة الضوئية لصنع غذائها، وتكرار التجربة بنباتات أخرى يقوي الاستنتاج.", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\nللطالب: قراءة كتاب الطالب ص24، والمشاركة في متابعة القياس والري حسب الجدول. لولي الأمر: تنفيذ تجربة مماثلة في المنزل بنبتتين صغيرتين (إن أمكن) ومتابعة الفرق مع الابن.\n\nالحصة 2: اختيار التمثيل البياني: الأعمدة أم الخطي؟\nللطالب: إكمال ورقة العمل 1-5 ص59، ومراجعة صفحتي مهارات الاستقصاء العلمي ص64–65 في كتاب الطالب. لولي الأمر: تدريب الابن على قراءة تمثيل خطي بسيط (مثل درجات الحرارة اليومية في نشرة الطقس).\n\nالحصة 3: الاستنتاج: الضوء ضروري لنمو النبات\nللطالب: حل تمرين 1-5 بكتاب النشاط ص21، ومراجعة الوحدة الأولى استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة مع الابن (بذرة، جنين، إنبات، عوامل، طاقة ضوئية)."]}, {"code": "1-6", "title": "تحقق من تقدمك", "unit": 1, "dates": "الأسبوع ال  وينمو …… ، ثم ينمو الساق ……\n   الإجابة النموذجية: مخزون الغذاء؛ لأسفل؛ لأعلى.\n3. (المستوى المتقدم) لماذا لم تنبت البذور في العلبة الجافة الدافئة رغم توافر الدفء؟\n   الإجابة النموذجية: لأن البذور تحتاج أيضًا إلى الماء لتبدأ الإنبات؛ فوجود عامل واحد لا يكفي.\n\nالحصة 2: مراجعة: الشكل والجدول وعوامل النمو (س3–س5) والمراجعة اللغوية\n1. (مستوى الدعم) ما نوع التمثيل البياني المناسب لنتائج محمود؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة؛ لأنها نتائج ظروف مختلفة.\n2. (المستوى المتوقع) ما العامل الناقص للنبات (أ) في السؤال 5؟\n   الإجابة النموذجية: الضوء.\n3. (المستوى المتقدم) وضّح أهمية العامل المفقود في (أ) لنمو النبات.\n   الإجابة النموذجية: الضوء مصدر الطاقة التي يصنع بها النبات غذاءه في أوراقه، ودونه يصفرّ ويضعف ويموت.", "الحصة 1: مراجعة: المفردات والإنبات (س1–س2) ونتائج نشاط 1-3ب\nللطالب: مراجعة إجابات السؤالين 1 و2 ص26، وقراءة الأسئلة 3–5 ص27. لولي الأمر: مراجعة مفردات الوحدة الأولى مع الابن باستخدام بطاقات صغيرة (الكلمة/المعنى).\n\nالحصة 2: مراجعة: الشكل والجدول وعوامل النمو (س3–س5) والمراجعة اللغوية\nللطالب: حل المراجعة اللغوية للوحدة الأولى بكتاب النشاط ص22، وإحضار زهرة من الحديقة (بإذن) للدرس القادم. لولي الأمر: مساعدة الابن في اختيار زهرة آمنة غير سامة وإحضارها."]}, {"code": "2-1", "title": "لماذا يحتوي النبات على أزهار؟", "unit": 2, "dates": "الأسبوع الرابع (27/9–1/10/2026م)", "sb": "28–29", "tb": "37–38", "ab": "تمرين 2-1 ص23، ورقة العمل 2-1 ص61", "periods": [{"n": 1, "topic": "تنوع الأزهار: الحجم واللون والرائحة", "f": ["1. يصف الأزهار من حيث الحجم واللون والرائحة\n2. يصنف مجموعة من الأزهار وفق صفاتها\nمخرج تعليمي آخر: يطرح سؤالًا علميًا عن الأزهار يمكن استقصاؤه", "المخرج 1 (يصف الأزهار من حيث الحجم واللون والرائحة): فهم\nالمخرج 2 (يصنف مجموعة من الأزهار وفق صفاتها): تطبيق\nالمخرج الآخر (يطرح سؤالًا علميًا عن الأزهار يمكن استقصاؤه): إبداع", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: مجموعة أزهار متنوعة من البيئة المحلية، عدسات مكبرة", "الزهرة، الرائحة، النباتات الزهرية.", "يعرض المعلم باقة من ا ، أخرى: صور مراحل تحول الزهرة إلى ثمرة، ورق مربعات", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\nالزهرة، الرائحة، النباتات الزهرية.\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\nالزهرة، الثمرة، التكاثر، تذبل.", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\nيعرض المعلم باقة من الأزهار المحلية ويمررها بين المجموعات لتأملها وشم رائحتها، ثم يقرأ حوار الطالبتين ص28: «تتكون البذور داخل الثمار، ولكن من أين تأتي الثمار؟».\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\nيعرض المعلم صورة غصن طماطم يحمل أزهارًا وثمارًا صغيرة ويسأل: «ما العلاقة بين هذه الأزهار وهذه الثمار؟».", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\n• التهيئة (5 دقائق):\n  المعلم: يمرر الأزهار ويقرأ حوار ص28.\n  الطالب: يتأملون الأزهار ويقترحون إجابات.\n• صفات الأزهار (8 دقائق):\n  المعلم: يناقش صور ص28: أزهار كبيرة وصغيرة وملونة وغير زاهية، وأزهار لها رائحة وأخرى بلا رائحة.\n  الطالب: يصفون كل صورة ويضيفون أمثلة من بيئتهم.\n• نشاط 2-1: جمع الأزهار (14 دقيقة):\n  المعلم: يوزع الأزهار على المجموعات ويوجههم وفق خطوات ص29.\n  الطالب: يصنفون الأزهار حسب الحجم واللون والرائحة، ويعدّون المجموعات، ويرسمون بعضها ويحاولون تسميتها.\n• عرض التصنيفات (7 دقائق):\n  المعلم: يطلب من كل مجموعة عرض معيار تصنيفها.\n  الطالب: يعرضون ويقارنون تصنيفاتهم.\n• الغلق (6 دقائق):\n  المعلم: يسأل: ما ألوان الأزهار التي ترونها أكثر في بيئتكم؟ كيف نعرف اللون الأكثر شيوعًا؟\n  الطالب: يقترحون عدّ الأزهار في أكثر من حديقة.\nالمجموع: 40 دقيقة\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\n• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يتوقعون أن الثمار تأتي من الأزهار.\n• من الزهرة إلى الثمرة (9 دقائق):\n  المعلم: يقرأ مع الطلاب ص29: تذبل الزهرة بعد أيام ويبقى جزء منها يتحول إلى ثمرة تتكون بداخلها البذور.\n  الطالب: يرسمون مخطط تسلسل: زهرة ← ثمرة ← بذور ← نبات جديد.\n• مفهوم التكاثر (6 دقائق):\n  المعلم: يوضح أن الأزهار تساعد النبات على التكاثر لتكوين نباتات جديدة.\n  الطالب: يعرّفون التكاثر بلغتهم.\n• ورقة العمل 2-1 (12 دقيقة):\n  المعلم: يقدم ورقة العمل 2-1 (ارسم تمثيلًا بيانيًا بالأعمدة لألوان الأزهار) ص61.\n  الطالب: يرسمون التمثيل البياني ويحددون اللون الأكثر شيوعًا.\n• أسئلة ص29 ومسابقة (8 دقائق):\n  المعلم: يناقش السؤالين (1، 2) ثم يشغّل مسابقة درس 2-1.\n  الطالب: يكملون الجمل ويفسرون حالة شجرة الخوخ، ثم يتنافسون.\nالمجموع: 40 دقيقة", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\n1. (مستوى الدعم) اذكر صفتين نصف بهما الزهرة.\n   الإجابة النموذجية: الحجم واللون (أو الرائحة).\n2. (المستوى المتوقع) صنّف الأزهار الآتية حسب اللون: (زهرة صفراء، زهرة بيضاء، زهرة صفراء).\n   الإجابة النموذجية: مجموعة صفراء (زهرتان) ومجموعة بيضاء (زهرة).\n3. (المستوى المتقدم) هل يكفي عدّ الأزهار في حديقة واحدة لمعرفة اللون الأكثر شيوعًا؟ لماذا؟\n   الإجابة النموذجية: لا؛ يجب تكرار العدّ في حدائق عديدة لتكون النتيجة موثوقة.\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\n1. (مستوى الدعم) ماذا يحدث للزهرة بعد أيام قليلة من تفتحها؟\n   الإجابة النموذجية: تذبل وتسقط، ويبقى جزء منها يتحول إلى ثمرة.\n2. (المستوى المتوقع) كيف تساعد الأزهار النبات على التكاثر؟\n   الإجابة النموذجية: بتكوين الثمار التي تحتوي على البذور التي تنمو إلى نباتات جديدة.\n3. (المستوى المتقدم) لماذا لا نجد الأزهار والثمار على شجرة الخوخ عادة في الوقت نفسه؟\n   الإجابة النموذجية: لأن الثمار تتكون بعد ذبول الأزهار؛ فهي مرحلة تالية لها.", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\n1. (مستوى الدعم) صح أم خطأ: جميع الأزهار لها رائحة.\n   الإجابة النموذجية: خطأ؛ بعضها بلا رائحة.\n2. (المستوى المتوقع) اذكر معيارين يمكن تصنيف الأزهار وفقهما.\n   الإجابة النموذجية: الحجم، اللون، الرائحة (أي اثنين).\n3. (المستوى المتقدم) اكتب سؤالًا علميًا عن الأزهار يمكن الإجابة عنه بالاستقصاء.\n   الإجابة النموذجية: مثل: ما لون الأزهار الأكثر شيوعًا في حديقة المدرسة؟\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\n1. (مستوى الدعم) أكمل: تكوّن النباتات …… التي تكوّن ثمارًا تحتوي على ……\n   الإجابة النموذجية: الأزهار؛ البذور.\n2. (المستوى المتوقع) ما التمثيل المناسب لعرض أعداد الأزهار حسب ألوانها؟ ولماذا؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة؛ لأننا نقارن مجموعات مختلفة (ألوانًا).\n3. (المستوى المتقدم) اذكر نباتًا لا يحتوي على أزهار.\n   الإجابة النموذجية: السرخس أو الطحالب (تقبل الإجابات الصحيحة).", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\nللطالب: قراءة كتاب الطالب ص28، وتسجيل ألوان الأزهار التي يراها في الحي. لولي الأمر: مساعدة الابن في عدّ الأزهار حسب ألوانها في حديقة قريبة لاستخدامها في ورقة العمل 2-1.\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\nللطالب: حل تمرين 2-1 بكتاب النشاط ص23، وإكمال ورقة العمل 2-1 ص61. لولي الأمر: ملاحظة شجرة مثمرة في المنزل أو الحي مع الابن وتحديد هل تحمل أزهارًا أم ثمارًا."]}, {"code": "2-2", "title": "كيف تنتشر البذور؟", "unit": 2, "dates": "الأسبوع الرابع (27/9–1/10/2026م)", "sb": "30–31", "tb": "39–41", "ab": "تمرين 2-2 ص24، ورقة العمل 2-2 ص63", "periods": [{"n": 1, "topic": "لماذا يجب أن تنتشر البذور؟", "f": ["1. يشرح معنى انتشار البذور\n2. يفسر أهمية انتشار البذور بعيدًا عن النبات الأصلي\nمخرج تعليمي آخر: يتنبأ بما يحدث للشتلات إذا نمت جميعها قرب النبات الأم", "المخرج 1 (يشرح معنى انتشار البذور): فهم\nالمخرج 2 (يفسر أهمية انتشار البذور بعيدًا عن النبات الأصلي): فهم\nالمخرج الآخر (يتنبأ بما يحدث للشتلات إذا نمت جميعها قرب النبات الأم): تحليل", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية", "انتشار البذور، الشتلات، الثمرة.", "يسأل المعلم: «هل وجدت يومًا بذورًا عالقة في ملابسك؟»، ثم يعرض صورة ص30 لشتلات كثيرة متزاحمة تحت نبتة زهرية ويسأل: «ماذا سيحدث لهذه الشتلات؟».", "• التهيئة (5 دقائق):\n  المعلم: يطرح السؤالين ويعرض الصورة.\n  الطالب: يتوقعون مصير الشتلات المتزاحمة.\n• وظيفتا الثمرة (8 دقائق):\n  المعلم: يقرأ مع الطلاب ص30: تحمي الثمرة البذور وتساعد في انتشارها.\n  الطالب: يحددون الوظيفتين ويكتبونهما.\n• محاكاة التزاحم (12 دقيقة):\n  المعلم: ينفذ محاكاة: يقف عدد من الطلاب «شتلات» في مساحة ضيقة يتقاسمون «ماءً وضوءًا» (بطاقات محدودة)، ثم في مساحة واسعة.\n  الطالب: يلاحظون أن الشتلات المتزاحمة لا تحصل على حاجتها، ويستنتجون أهمية الانتشار.\n• نقاش (8 دقائق):\n  المعلم: يسأل: لماذا لا تنمو الشتلات جيدًا بجوار النبات الأصلي؟ هل لاحظتم نباتات تنمو في أماكن لم تُزرع فيها؟\n  الطالب: يربطون بين التزاحم ونقص الماء والضوء والمساحة.\n• الغلق (7 دقائق):\n  المعلم: يكتب تعريف انتشار البذور على السبورة.\n  الطالب: يكتبون التعريف ويذكرون سببين لأهميته.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما المقصود بانتشار البذور؟\n   الإجابة النموذجية: نقل البذور بعيدًا عن النبات الأصلي الذي تكونت فيه.\n2. (المستوى المتوقع) ما وظيفتا الثمرة؟\n   الإجابة النموذجية: حماية البذور الموجودة بداخلها، والمساعدة في انتشارها.\n3. (المستوى المتقدم) لماذا لا تنمو الشتلات جيدًا إذا نبتت كلها قرب النبات الأم؟\n   الإجابة النموذجية: لأنها تتشارك الماء والضوء في حيز صغير فلا تكفيها، فلا تكون نباتات صحية.", "1. (مستوى الدعم) صح أم خطأ: تحتاج الشتلات إلى مساحة كافية لتنمو.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) اذكر شيئين تتنافس عليهما الشتلات المتزاحمة.\n   الإجابة النموذجية: الماء والضوء (والمساحة).\n3. (المستوى المتقدم) تنبأ: نبات تسقط كل بذوره تحته مباشرة، كيف سيكون نمو شتلاته؟ فسّر.\n   الإجابة النموذجية: ضعيفًا؛ لأنها تتنافس فيما بينها ومع النبات الأم على الماء والضوء والمساحة.", "للطالب: قراءة كتاب الطالب ص30، والبحث (مع ولي الأمر) عن مثال لحيوان ينشر البذور. لولي الأمر: مساعدة الابن في البحث في الكتب أو الشبكة عن طرق نشر الحيوانات للبذور لاستخدامها في نشاط 2-2."]}, {"n": 2, "topic": "نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان", "f": ["1. يصف طرق انتشار البذور بواسطة الحيوانات والإنسان\n2. يجمع معلومات من مصادر مختلفة حول انتشار البذور بالحيوانات\nمخرج تعليمي آخر: يصمم ملصقًا يعرض نتائج بحثه عن انتشار البذور", "المخرج 1 (يصف طرق انتشار البذور بواسطة الحيوانات والإنسان): فهم\nالمخرج 2 (يجمع معلومات من مصادر مختلفة حول انتشار البذور بالحيوانات): تطبيق\nالمخرج الآخر (يصمم ملصقًا يعرض نتائج بحثه عن انتشار البذور): إبداع", "التعلم المبني على المشاريع، التعلم التعاوني، التعلم الذاتي", "الكتاب، جهاز الحاسب، كتب إلكترونية، صورة توضيحية، الأقلام، أخرى: ورق ملصقات، ألوان", "انتشار البذور، الفضلات، الفراء.", "يعرض المعلم صورة الطائر وهو يأكل ثمار التوت ص30 ويسأل: «كيف يمكن لهذا الطائر أن يزرع شجرة توت بعيدة دون أن يقصد ذلك؟».", "• التهيئة (5 دقائق):\n  المعلم: يعرض الصورة ويطرح السؤال.\n  الطالب: يقترحون أن البذور تخرج مع فضلات الطائر.\n• طرق الحيوانات (10 دقائق):\n  المعلم: يشرح من ص30–31: أكل الثمار وخروج البذور مع الفضلات، التعلق بالفراء والملابس بالأشواك، حمل النمل للبذور، دفن الفئران والسناجب للبذور.\n  الطالب: يكملون جدولًا: الحيوان – طريقة نشر البذور.\n• نشاط 2-2: البحث (15 دقيقة):\n  المعلم: يوزع المصادر (كتب، أجهزة) ويحدد مهام البحث لكل مجموعة.\n  الطالب: يبحثون ويجمعون صورًا ومعلومات عن طريقة محددة.\n• إعداد الملصق (8 دقائق):\n  المعلم: يوجه إلى تصميم ملصق منظم بالرسوم والصور.\n  الطالب: يبدؤون تصميم الملصق ويوزعون الأدوار.\n• الغلق (دقيقتان):\n  المعلم: يحدد موعد عرض الملصقات.\n  الطالب: يرتبون أعمالهم.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) كيف تنشر الطيور بذور التوت؟\n   الإجابة النموذجية: تأكل الثمار وتخرج البذور مع فضلاتها في مكان بعيد.\n2. (المستوى المتوقع) كيف تنتقل بعض البذور على فراء الحيوانات؟\n   الإجابة النموذجية: تحتوي على أشواك أو خطافات تلتصق بالفراء أو الملابس.\n3. (المستوى المتقدم) لماذا تنبت بعض البذور التي يدفنها الفأر؟\n   الإجابة النموذجية: لأنه قد لا يعود لأكلها فتجد في التربة الظروف الملائمة للإنبات.", "1. (مستوى الدعم) اذكر حيوانين ينشران البذور.\n   الإجابة النموذجية: الطيور، القرود، الفئران، النمل، السناجب (أي اثنين).\n2. (المستوى المتوقع) كيف يساعد الإنسان في نشر البذور دون قصد؟\n   الإجابة النموذجية: بالتصاق البذور بملابسه أو برمي بذور الثمار التي يأكلها.\n3. (المستوى المتقدم) بذرة مغطاة بأشواك صغيرة، تنبأ بطريقة انتشارها مع التعليل.\n   الإجابة النموذجية: تنتشر بالتصاقها بفراء الحيوانات أو ملابس الإنسان لأن الأشواك تساعدها على التعلق.", "للطالب: إكمال الملصق مع المجموعة، وقراءة كتاب الطالب ص31. لولي الأمر: إحضار جورب قديم (فردة واحدة) لنشاط المشي بالجورب في الحصة القادمة."]}, {"n": 3, "topic": "ورقة العمل 2-2: المشي بالجورب وحل الأسئلة", "f": ["1. ينفذ نشاط المشي بالجورب لجمع البذور ويسجل البيانات\n2. يمثل أعداد البذور المجمعة بتمثيل بياني بالأعمدة\nمخرج تعليمي آخر: يربط بين عمل الجورب وعمل فراء الحيوانات في نشر البذور", "المخرج 1 (ينفذ نشاط المشي بالجورب لجمع البذور ويسجل البيانات): تطبيق\nالمخرج 2 (يمثل أعداد البذور المجمعة بتمثيل بياني بالأعمدة): تطبيق\nالمخرج الآخر (يربط بين عمل الجورب وعمل فراء الحيوانات في نشر البذور): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: جوارب قديمة أو شريط لاصق، عدسات مكبرة، أطباق", "انتشار البذور، الفراء.", "يعرض المعلم الملصقات المنجزة سريعًا، ثم يرفع جوربًا ويسأل: «كيف يمكن لهذا الجورب أن يساعدنا على فهم انتشار البذور؟».", "• التهيئة (4 دقائق):\n  المعلم: يعرض الملصقات والجورب.\n  الطالب: يتوقعون أن البذور ستلتصق بالجورب.\n• المشي بالجورب (12 دقيقة):\n  المعلم: يحدد منطقة عشبية لكل مجموعة ويوجه إلى لبس الجورب فوق الحذاء والمشي خمس دقائق.\n  الطالب: يمشون في المنطقة العشبية ثم يعودون ويخلعون الجوارب.\n• العدّ والتسجيل (8 دقائق):\n  المعلم: يقدم ورقة العمل 2-2 ص63 ويساعد في تسمية البذور.\n  الطالب: يفحصون البذور بالعدسة ويعدّونها حسب أنواعها ويسجلونها.\n• أسئلة ص31 (8 دقائق):\n  المعلم: يناقش الأسئلة (1–3).\n  الطالب: يجيبون عن البذور المتروكة على النبات والخوخ ويرسمون بذورًا تنتشر بالفراء.\n• مسابقة المجموعات (8 دقائق):\n  المعلم: يشغّل مسابقة درس 2-2.\n  الطالب: يتنافسون.\nالمجموع: 40 دقيقة", "1. (مستوى الدعم) ما الذي التصق بالجورب؟\n   الإجابة النموذجية: بذور مختلفة.\n2. (المستوى المتوقع) ما صفة البذور التي التصقت بالجورب؟\n   الإجابة النموذجية: لها أشواك أو خطافات أو سطح لزج.\n3. (المستوى المتقدم) علامَ يدل عدد البذور الكبير على جوارب المجموعة التي مشت في العشب؟\n   الإجابة النموذجية: أن كثيرًا من النباتات تنشر بذورها بالتعلق بالفراء أو الملابس.", "1. (مستوى الدعم) صح أم خطأ: يعمل الجورب في هذا النشاط عمل فراء الحيوانات.\n   الإجابة النموذجية: صح.\n2. (المستوى المتوقع) أيهما ينمو أفضل: بذور طماطم متروكة على النبات، أم بذور طماطم أكلها طائر؟ ولماذا؟\n   الإجابة النموذجية: بذور الطماطم التي أكلها الطائر؛ لأنها تنتشر بعيدًا وتجد مساحة وماءً وضوءًا أكثر.\n3. (المستوى المتقدم) هل يمكن للحيوانات نشر بذور الخوخ؟ وضّح.\n   الإجابة النموذجية: نعم؛ تأكل الثمرة وترمي البذرة الكبيرة بعيدًا عن الشجرة أو تحملها.", "للطالب: حل تم
