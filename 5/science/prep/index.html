لنمو النبات — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال ويعرض جدول ص23، والطلبة يقترحون جدولًا أو رسمًا (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • قراءة البيانات: يقرأ المعلم مع الطلاب ظروف كل نبات في نشاط 1-4، والطلبة يربطون كل نبات بظروفه (شمس/ظل، ري/بدون ري، تحت السرير) (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • نمذجة الرسم: يرسم المعلم المحورين على السبورة ويختار مقياسًا (كل مربع = 1 cm أو 5 cm) ويعنون المحاور، والطلبة يتابعون خطوات الرسم (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • رسم التمثيل: يتابع المعلم ويقدم الدعم الفردي، والطلبة يرسمون أعمدة متباعدة متساوية العرض بارتفاعات صحيحة ويسمونها (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • أسئلة النشاط: يناقش المعلم الأسئلة (1–6) ص23، والطلبة يفسرون: نبات عبدالله الأفضل، سعيد جاف لنقص الماء، طارق نحيف لنقص الضوء، محمد أقصر لقلة الضوء في الظل (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "الحصة 1: العوامل اللازمة لنمو النبات\n1. (مستوى المعرفة) ما الاختصار الذي يساعدنا على تذكر عوامل نمو النبات؟\n   الإجابة النموذجية: «ضهمد»: ضوء، هواء، ماء، دفء.\n2. (مستوى التطبيق) لماذا يحتاج النبات إلى الماء؟\n   الإجابة النموذجية: ليكون له ساق قوية وأوراق ثابتة، ولنقل المواد مثل الغذاء إلى أجزائه.\n3. (مستوى الاستدلال) نبات طويل نحيف أصفر الأوراق، ما العامل الناقص على الأرجح؟\n   الإجابة النموذجية: الطاقة الضوئية.\n\nالحصة 2: نشاط 1-4: التمثيل البياني بالأعمدة لنمو النبات\n1. (مستوى المعرفة) أي النباتات نما بأفضل حال؟\n   الإجابة النموذجية: نبات عبدالله (25 cm).\n2. (مستوى التطبيق) لماذا كان نبات سعيد جافًا بني اللون؟\n   الإجابة النموذجية: لأنه لم يُروَ؛ فنقص الماء.\n3. (مستوى الاستدلال) لماذا كان نبات طارق نحيفًا ضعيفًا رغم ريّه؟\n   الإجابة النموذجية: لأنه وُضع تحت السرير فلم يحصل على ضوء كافٍ.", "الحصة 1: العوامل اللازمة لنمو النبات\n1. (مستوى المعرفة) صح أم خطأ: تصنع النباتات غذاءها بنفسها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) من أين يحصل النبات على الطاقة اللازمة لصنع غذائه؟\n   الإجابة النموذجية: من ضوء الشمس (الطاقة الضوئية) في أوراقه.\n3. (مستوى الاستدلال) هل تحتاج كل النباتات إلى تربة لتنمو؟ أعطِ مثالًا.\n   الإجابة النموذجية: لا؛ فاللوتس وزنبق الماء تنمو في الماء.\n\nالحصة 2: نشاط 1-4: التمثيل البياني بالأعمدة لنمو النبات\n1. (مستوى المعرفة) كم يزيد طول نبات عبدالله على طول نبات محمد؟\n   الإجابة النموذجية: 25 − 18 = 7 cm.\n2. (مستوى التطبيق) لماذا نستخدم التمثيل البياني بالأعمدة لعرض هذه البيانات؟\n   الإجابة النموذجية: لأننا نقارن نتائج أشياء (نباتات) مختلفة.\n3. (مستوى الاستدلال) تنبأ بطول نبات في بيت زجاجي يحصل على كمية كافية من الماء، وفسّر تنبؤك.\n   الإجابة النموذجية: أطول من 25 cm تقريبًا؛ لتوافر الضوء والدفء والماء والهواء.", "الحصة 1: العوامل اللازمة لنمو النبات\nللطالب: قراءة كتاب الطالب ص22، ومراجعة جدول نشاط 1-4 ص23 استعدادًا لرسم التمثيل البياني. لولي الأمر: إحضار ورقة مربعات ومسطرة، وملاحظة نبات في المنزل أو الحي مع الابن ووصف حالته.\n\nالحصة 2: نشاط 1-4: التمثيل البياني بالأعمدة لنمو النبات\nللطالب: حل تمرين 1-4 بكتاب النشاط ص20، وإكمال ورقة العمل 1-4 (ارسم تمثيلًا بيانيًا بالأعمدة وصورة عن نمو النبات) ص57. لولي الأمر: متابعة دقة الأعمدة واستخدام المسطرة في الرسم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=4"]}, {"code": "1-5", "title": "النبات والضوء", "unit": 1, "dates": "الأسبوع الثالث (20–24/9/2026م)", "sb": "24–25", "tb": "27–30", "ab": "تمرين 1-5 ص21، ورقة العمل 1-5 ص59", "periods": [{"n": 1, "topic": "نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد) + اختيار التمثيل البياني: الأعمدة أم الخطي؟", "f": ["1. يخطط لاستقصاء تأثير الضوء على نمو النبات مع تثبيت العوامل الأخرى\n2. يقيس طول النبتة ويعدّ أوراقها ويسجلها بدقة\n3. يميز متى يستخدم التمثيل البياني بالأعمدة ومتى يستخدم التمثيل الخطي\n4. يمثل تغير طول النبتة بمرور الزمن بتمثيل خطي\n\nمخرج تعليمي آخر:\nيتنبأ بنمو كل نبتة ويعلل تنبؤه بالمعرفة العلمية\nيحلل نتائج نمو النبات من تمثيل بياني معطى", "المخرج 1 (يخطط لاستقصاء تأثير الضوء على نمو النبات مع تثبيت العوامل الأخرى): تطبيق\nالمخرج 2 (يقيس طول النبتة ويعدّ أوراقها ويسجلها بدقة): تطبيق\nالمخرج 3 (يميز متى يستخدم التمثيل البياني بالأعمدة ومتى يستخدم التمثيل الخطي): فهم\nالمخرج 4 (يمثل تغير طول النبتة بمرور الزمن بتمثيل خطي): تطبيق\nالمخرج الآخر (يتنبأ بنمو كل نبتة ويعلل تنبؤه بالمعرفة العلمية): تحليل\nالمخرج الآخر (يحلل نتائج نمو النبات من تمثيل بياني معطى): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات، التعلم بالنمذجة، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، أخرى: أصيصا زرع متشابهان، خزانة مظلمة، مخبار مدرج، مسطرة، قلم تخطيط، ماء، ورق مربعات، أصيصا النشاط 1-5", "الطاقة الضوئية، الاختبار العادل، التنبؤ.، التمثيل البياني بالأعمدة، التمثيل الخطي، الزمن.", "يسأل المعلم عن اختصار «ضهمد»، ثم يطرح سؤالًا: «إذا أردنا أن نثبت أن الضوء ضروري لنمو النبات، هل يكفي أن نضع نبتة واحدة في الضوء ونقيس نموها؟».", "1. • التهيئة: يراجع المعلم «ضهمد» ويطرح السؤال، والطلبة يناقشون ويقترحون الحاجة إلى نبتتين (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • لماذا نبتتان؟: يوضح المعلم فكرة المقارنة: نبتة في الضوء وأخرى في الظلام، مع تثبيت الماء ونوع النبات وحجمه، والطلبة يحددون المتغير (الضوء) والعوامل الثابتة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد النشاط: يوجه المعلم وفق ص24: خط مرجعي عند قاعدة الساق، قياس الطول، عدّ الأوراق، الري بالكمية نفسها، والطلبة يقيسون ويسجلون، ويضعون النبتة (أ) عند النافذة و(ب) في الخزانة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول وتنبؤ: يعرض المعلم جدول ص24 (الطول، عدد الأوراق، لون الساق والأوراق، الشكل العام)، والطلبة ينسخون الجدول ويكتبون تنبؤاتهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • خطة المتابعة: يوزع المعلم مهام القياس والري كل أربعة أيام مدة ثلاثة أسابيع، والطلبة يسجلون مواعيد المتابعة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الأعمدة أم الخطي: يعرض المعلم أمثلة مهارات الاستقصاء ص64–65: عدد بذور الثمار (أعمدة)، وتبريد الماء بمرور الزمن (خطي)، والطلبة يستنتجون قاعدة الاختيار (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. • نمذجة التمثيل الخطي: يرسم المعلم بيانات تبريد الماء ص65 خطوة بخطوة (المحاور، المقياس، النقاط، التوصيل)، والطلبة يرسمون معه في دفاترهم (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. • ورقة العمل 1-5: يقدم المعلم ورقة العمل 1-5 (تحليل النتائج حول نمو النبات) ص59، والطلبة يحللون البيانات ويجيبون عن الأسئلة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. • الغلق: يسأل المعلم: أي تمثيل سنستخدم لنتائج نشاط 1-5؟ ولماذا؟ والطلبة يجيبون: الخطي لأن الطول يتغير بمرور الزمن (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "1. (مستوى المعرفة) أين وضعنا النبتة (ب)؟\n   الإجابة النموذجية: في خزانة مظلمة.\n2. (مستوى التطبيق) ما العوامل التي جعلناها متساوية للنبتتين؟\n   الإجابة النموذجية: كمية الماء، ونوع النبات وحجمه، وحجم الأصيص.\n3. (مستوى الاستدلال) لماذا رسمنا خطًا عند قاعدة النبتة قبل القياس؟\n   الإجابة النموذجية: ليكون نقطة مرجعية ثابتة نقيس منها في كل مرة.\n\n4. (مستوى المعرفة) أي تمثيل نستخدم لعرض تغير طول النبتة بمرور الزمن؟\n   الإجابة النموذجية: التمثيل الخطي.\n5. (مستوى التطبيق) في مثال ص65 كم أصبحت درجة حرارة الماء بعد 6 دقائق؟\n   الإجابة النموذجية: 20°C.\n6. (مستوى الاستدلال) لماذا نرسم خطي النبتتين (أ) و(ب) على المحورين نفسيهما؟\n   الإجابة النموذجية: لتسهل المقارنة بين نموهما.", "1. (مستوى المعرفة) ما الأداة التي نقيس بها كمية ماء الري؟\n   الإجابة النموذجية: المخبار المدرج.\n2. (مستوى التطبيق) ما العامل الذي نغيّره في هذا الاستقصاء؟\n   الإجابة النموذجية: الضوء.\n3. (مستوى الاستدلال) لماذا نكرر القياس كل أربعة أيام بدل قياس واحد في النهاية؟\n   الإجابة النموذجية: لنتابع التغير بمرور الزمن ونحصل على نتائج أدق وأكثر موثوقية.\n\n4. (مستوى المعرفة) صح أم خطأ: نستخدم الأعمدة لعرض عدد بذور ثمار مختلفة.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) ماذا نضع على المحور الأفقي عند تمثيل نمو النبتة؟\n   الإجابة النموذجية: الزمن (التاريخ أو الأيام).\n6. (مستوى الاستدلال) توقف ارتفاع خط النبتة (ب) ثم بدأ يقل عدد أوراقها، ماذا تستنتج؟\n   الإجابة النموذجية: أنها استهلكت مخزون غذائها ولا تستطيع صنع غذاء جديد دون ضوء فبدأت تضعف.", "للطالب: قراءة كتاب الطالب ص24، والمشاركة في متابعة القياس والري حسب الجدول. لولي الأمر: تنفيذ تجربة مماثلة في المنزل بنبتتين صغيرتين (إن أمكن) ومتابعة الفرق مع الابن.\nللطالب: إكمال ورقة العمل 1-5 ص5 إلى نبتتين (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • لماذا نبتتان؟: يوضح المعلم فكرة المقارنة: نبتة في الضوء وأخرى في الظلام، مع تثبيت الماء ونوع النبات وحجمه، والطلبة يحددون المتغير (الضوء) والعوامل الثابتة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد النشاط: يوجه المعلم وفق ص24: خط مرجعي عند قاعدة الساق، قياس الطول، عدّ الأوراق، الري بالكمية نفسها، والطلبة يقيسون ويسجلون، ويضعون النبتة (أ) عند النافذة و(ب) في الخزانة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول وتنبؤ: يعرض المعلم جدول ص24 (الطول، عدد الأوراق، لون الساق والأوراق، الشكل العام)، والطلبة ينسخون الجدول ويكتبون تنبؤاتهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • خطة المتابعة: يوزع المعلم مهام القياس والري كل أربعة أيام مدة ثلاثة أسابيع، والطلبة يسجلون مواعيد المتابعة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الأعمدة أم الخطي: يعرض المعلم أمثلة مهارات الاستقصاء ص64–65: عدد بذور الثمار (أعمدة)، وتبريد الماء بمرور الزمن (خطي)، والطلبة يستنتجون قاعدة الاختيار (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. • نمذجة التمثيل الخطي: يرسم المعلم بيانات تبريد الماء ص65 خطوة بخطوة (المحاور، المقياس، النقاط، التوصيل)، والطلبة يرسمون معه في دفاترهم (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. • ورقة العمل 1-5: يقدم المعلم ورقة العمل 1-5 (تحليل النتائج حول نمو النبات) ص59، والطلبة يحللون البيانات ويجيبون عن الأسئلة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. • الغلق: يسأل المعلم: أي تمثيل سنستخدم لنتائج نشاط 1-5؟ ولماذا؟ والطلبة يجيبون: الخطي لأن الطول يتغير بمرور الزمن (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: الاستنتاج: الضوء ضروري لنمو النبات — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الأصيصين، والطلبة يصفون الفروق في الطول واللون وعدد الأوراق (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مقارنة النبتتين: يوجه المعلم لاستكمال الجدول وتمثيل الأطوال خطيًا، والطلبة يلاحظون أن (ب) طويلة نحيفة باهتة صفراء، و(أ) خضراء قوية (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • أسئلة الكتاب ص25: يناقش المعلم الأسئلة : لنتابع التغير بمرور الزمن ونحصل على نتائج أدق وأكثر موثوقية.\n\n4. (مستوى المعرفة) صح أم خطأ: نستخدم الأعمدة لعرض عدد بذور ثمار مختلفة.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) ماذا نضع على المحور الأفقي عند تمثيل نمو النبتة؟\n   الإجابة النموذجية: الزمن (التاريخ أو الأيام).\n6. (مستوى الاستدلال) توقف ارتفاع خط النبتة (ب) ثم بدأ يقل عدد أوراقها، ماذا تستنتج؟\n   الإجابة النموذجية: أنها استهلكت مخزون غذائها ولا تستطيع صنع غذاء جديد دون ضوء فبدأت تضعف.\n\nالحصة 2: الاستنتاج: الضوء ضروري لنمو النبات\n1. (مستوى المعرفة) أكمل: تحتاج النباتات إلى طاقة …… لتصنع غذاءها.\n   الإجابة النموذجية: ضوئية.\n2. (مستوى التطبيق) لماذا تنمو بعض النباتات في الأماكن الظليلة إلى حجم كبير؟\n   الإجابة النموذجية: لأن لها أوراقًا كبيرة تمتص ضوءًا أكثر، وتكون التربة هناك رطبة غالبًا.\n3. (مستوى الاستدلال) لو أعدت الاستقصاء باستخدام نوع آخر من النباتات، هل تتوقع النتيجة نفسها؟ لماذا؟\n   الإجابة النموذجية: نعم غالبًا؛ لأن جميع النباتات تحتاج إلى الطاقة الضوئية لصنع غذائها، وتكرار التجربة بنباتات أخرى يقوي الاستنتاج.", "الحصة 1: نشاط 1-5: استقصاء تأثير الضوء على نمو النبات (التخطيط والإعداد)\nللطالب: قراءة كتاب الطالب ص24، والمشاركة في متابعة القياس والري حسب الجدول. لولي الأمر: تنفيذ تجربة مماثلة في المنزل بنبتتين صغيرتين (إن أمكن) ومتابعة الفرق مع الابن.\nللطالب: إكمال ورقة العمل 1-5 ص59، ومراجعة صفحتي مهارات الاستقصاء العلمي ص64–65 في كتاب الطالب. لولي الأمر: تدريب الابن على قراءة تمثيل خطي بسيط (مثل درجات الحرارة اليومية في نشرة الطقس).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=5\n\nالحصة 2: الاستنتاج: الضوء ضروري لنمو النبات\nللطالب: حل تمرين 1-5 بكتاب النشاط ص21، ومراجعة الوحدة الأولى استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة مع الابن (بذرة، جنين، إنبات، عوامل، طاقة ضوئية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=5"]}, {"code": "1-6", "title": "تحقق من تقدمك", "unit": 1, "dates": "الأسبوع الثالث (20–24/9/2026م)", "sb": "26–27", "tb": "31–35", "ab": "المراجعة ال .\n   الإجابة النموذجية: لا؛ فقد نبتت بذور أكثر في الظلام (15) مقارنة بالضوء (10) في الدفء.\n3. (مستوى الاستدلال) هل حصلت البذور على الماء؟ كيف عرفت؟\n   الإجابة النموذجية: نعم؛ لأنها نبتت، والبذور لا تنبت دون ماء.", "الحصة 1: مراجعة: المفردات والإنبات (س1–س2) ونتائج نشاط 1-3ب\n1. (مستوى المعرفة) صل: الجنين ← ……\n   الإجابة النموذجية: جزء من البذرة ينمو إلى نبات آخر.\n2. (مستوى التطبيق) أكمل: تحصل البذور على الطاقة من …… ، والجذر هو أول جزء ينمو وينمو …… ، ثم ينمو الساق ……\n   الإجابة النموذجية: مخزون الغذاء؛ لأسفل؛ لأعلى.\n3. (مستوى الاستدلال) لماذا لم تنبت البذور في العلبة الجافة الدافئة رغم توافر الدفء؟\n   الإجابة النموذجية: لأن البذور تحتاج أيضًا إلى الماء لتبدأ الإنبات؛ فوجود عامل واحد لا يكفي.\n\nالحصة 2: مراجعة: الشكل والجدول وعوامل النمو (س3–س5) والمراجعة اللغوية\n1. (مستوى المعرفة) ما نوع التمثيل البياني المناسب لنتائج محمود؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة؛ لأنها نتائج ظروف مختلفة.\n2. (مستوى التطبيق) ما العامل الناقص للنبات (أ) في السؤال 5؟\n   الإجابة النموذجية: الضوء.\n3. (مستوى الاستدلال) وضّح أهمية العامل المفقود في (أ) لنمو النبات.\n   الإجابة النموذجية: الضوء مصدر الطاقة التي يصنع بها النبات غذاءه في أوراقه، ودونه يصفرّ ويضعف ويموت.", "الحصة 1: مراجعة: المفردات والإنبات (س1–س2) ونتائج نشاط 1-3ب\nللطالب: مراجعة إجابات السؤالين 1 و2 ص26، وقراءة الأسئلة 3–5 ص27. لولي الأمر: مراجعة مفردات الوحدة الأولى مع الابن باستخدام بطاقات صغيرة (الكلمة/المعنى).\n\nالحصة 2: مراجعة: الشكل والجدول وعوامل النمو (س3–س5) والمراجعة اللغوية\nللطالب: حل المراجعة اللغوية للوحدة الأولى بكتاب النشاط ص22، وإحضار زهرة من الحديقة (بإذن) للدرس القادم. لولي الأمر: مساعدة الابن في اختيار زهرة آمنة غير سامة وإحضارها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=6"]}, {"code": "2-1", "title": "لماذا يحتوي النبات على أزهار؟", "unit": 2, "dates": "الأسبوع الرابع (27/9–1/10/2026م)", "sb": "28–29", "tb": "37–38", "ab": "تمرين 2-1 ص23، ورقة العمل 2-1 ص61", "periods": [{"n": 1, "topic": "تنوع الأزهار: الحجم واللون والرائحة", "f": ة موثوقة.", "1. (مستوى المعرفة) صح أم خطأ: جميع الأزهار لها رائحة.\n   الإجابة النموذجية: خطأ؛ بعضها بلا رائحة.\n2. (مستوى التطبيق) اذكر معيارين يمكن تصنيف الأزهار وفقهما.\n   الإجابة النموذجية: الحجم، اللون، الرائحة (أي اثنين).\n3. (مستوى الاستدلال) اكتب سؤالًا علميًا عن الأزهار يمكن الإجابة عنه بالاستقصاء.\n   الإجابة النموذجية: مثل: ما لون الأزهار الأكثر شيوعًا في حديقة المدرسة؟", "للطالب: قراءة كتاب الطالب ص28، وتسجيل ألوان الأزهار التي يراها في الحي. لولي الأمر: مساعدة الابن في عدّ الأزهار حسب ألوانها في حديقة قريبة لاستخدامها في ورقة العمل 2-1.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=7"]}, {"n": 2, "topic": "وظيفة الأزهار: تكوين الثمار والتكاثر", "f": ["1. يوضح أن الأزهار تساعد النبات على التكاثر بتكوين الثمار والبذور\n2. يمثل ألوان الأزهار بتمثيل بياني بالأعمدة\nمخرج تعليمي آخر: يستنتج سبب عدم وجود الأزهار والثمار معًا على شجرة الخوخ في الوقت نفسه", "المخرج 1 (يوضح أن الأزهار تساعد النبات على التكاثر بتكوين الثمار والبذور): فهم\nالمخرج 2 (يمثل ألوان الأزهار بتمثيل بياني بالأعمدة): تطبيق\nالمخرج الآخر (يستنتج سبب عدم وجود الأزهار والثمار معًا على شجرة الخوخ في الوقت نفسه): تحليل", "التعلم بالاكتشاف، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: صور مراحل تحول الزهرة إلى ثمرة، ورق مربعات", "الزهرة، الثمرة، التكاثر، تذبل.", "يعرض المعلم صورة غصن طماطم يحمل أزهارًا وثمارًا صغيرة ويسأل: «ما العلاقة بين هذه الأزهار وهذه الثمار؟».", "1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون أن الثمار تأتي من الأزهار (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • من الزهرة إلى الثمرة: يقرأ المعلم مع الطلاب ص29: تذبل الزهرة بعد أيام ويبقى جزء منها يتحول إلى ثمرة تتكون بداخلها البذور، والطلبة يرسمون مخطط تسلسل: زهرة ← ثمرة ← بذور ← نبات جديد (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • مفهوم التكاثر: يوضح المعلم أن الأزهار تساعد النبات على التكاثر لتكوين نباتات جديدة، والطلبة يعرّفون التكاثر بلغتهم (6 دقائق)\nا هرة بعد أيام قليلة من تفتحها؟\n   الإجابة النموذجية: تذبل وتسقط، ويبقى جزء منها يتحول إلى ثمرة.\n2. (مستوى التطبيق) كيف تساعد الأزهار النبات على التكاثر؟\n   الإجابة النموذجية: بتكوين الثمار التي تحتوي على البذور التي تنمو إلى نباتات جديدة.\n3. (مستوى الاستدلال) لماذا لا نجد الأزهار والثمار على شجرة الخوخ عادة في الوقت نفسه؟\n   الإجابة النموذجية: لأن الثمار تتكون بعد ذبول الأزهار؛ فهي مرحلة تالية لها.", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\n1. (مستوى المعرفة) صح أم خطأ: جميع الأزهار لها رائحة.\n   الإجابة النموذجية: خطأ؛ بعضها بلا رائحة.\n2. (مستوى التطبيق) اذكر معيارين يمكن تصنيف الأزهار وفقهما.\n   الإجابة النموذجية: الحجم، اللون، الرائحة (أي اثنين).\n3. (مستوى الاستدلال) اكتب سؤالًا علميًا عن الأزهار يمكن الإجابة عنه بالاستقصاء.\n   الإجابة النموذجية: مثل: ما لون الأزهار الأكثر شيوعًا في حديقة المدرسة؟\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\n1. (مستوى المعرفة) أكمل: تكوّن النباتات …… التي تكوّن ثمارًا تحتوي على ……\n   الإجابة النموذجية: الأزهار؛ البذور.\n2. (مستوى التطبيق) ما التمثيل المناسب لعرض أعداد الأزهار حسب ألوانها؟ ولماذا؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة؛ لأننا نقارن مجموعات مختلفة (ألوانًا).\n3. (مستوى الاستدلال) اذكر نباتًا لا يحتوي على أزهار.\n   الإجابة النموذجية: السرخس أو الطحالب (تقبل الإجابات الصحيحة).", "الحصة 1: تنوع الأزهار: الحجم واللون والرائحة\nللطالب: قراءة كتاب الطالب ص28، وتسجيل ألوان الأزهار التي يراها في الحي. لولي الأمر: مساعدة الابن في عدّ الأزهار حسب ألوانها في حديقة قريبة لاستخدامها في ورقة العمل 2-1.\n\nالحصة 2: وظيفة الأزهار: تكوين الثمار والتكاثر\nللطالب: حل تمرين 2-1 بكتاب النشاط ص23، وإكمال ورقة العمل 2-1 ص61. لولي الأمر: ملاحظة شجرة مثمرة في المنزل أو الحي مع الابن وتحديد هل تحمل أزهارًا أم ثمارًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=7"]}, {"code": "2-2", "title": "كيف تنتشر البذور؟", "unit": 2, "dates": "الأسبوع الرابع (27/9–1/10/2026م)", "sb": "30–31", "tb": "39–41", "ab": "تمرين 2-2 ص24، ورقة العمل 2-2 ص63", "periods": [{"n": 1, "topic": "لماذا يجب أن تنتشر البذور؟ + نشاط 2-2: انتشار البذور بواسطة الحيوانات والإنسان", "f": ["1. يشرح معنى انتشار البذور\n2. يفسر أهمية انتشار البذور بعيدًا عن النبات الأصلي\n3. يصف طرق انتشار البذور بواسطة الحيوانات والإنسان\n4. يجمع معلومات من مصادر مختلفة حول انتشار البذور بالحيوانات\n\nمخرج تعليمي آخر:\nيتنبأ بما يحدث للشتلات إذا نمت جميعها قرب النبات الأم\nيصمم ملصقًا يعرض نتائج بحثه عن انتشار البذور", "المخرج 1 (يشرح معنى انتشار البذور): فهم\nالمخرج 2 (يفسر أهمية انتشار البذور بعيدًا عن النبات الأصلي): فهم\nالمخرج 3 (يصف طرق انتشار البذور بواسطة الحيوانات والإنسان): فهم\nالمخرج 4 (يجمع معلومات من مصادر مختلفة حول انتشار البذور بالحيوانات): تطبيق\nالمخرج الآخر (يتنبأ بما يحدث للشتلات إذا نمت جميعها قرب النبات الأم): تحليل\nالمخرج الآخر (يصمم ملصقًا يعرض نتائج بحثه عن انتشار البذور): إبداع", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على المشاريع، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، جهاز الحاسب، كتب إلكترونية، الأقلام، أخرى: ورق ملصقات، ألوان", "انتشار البذور، الشتلات، الثمرة.، الفضلات، الفراء.", "يسأل المعلم: «هل وجدت يومًا بذورًا عالقة في ملابسك؟»، ثم يعرض صورة ص30 لشتلات كثيرة متزاحمة تحت نبتة زهرية ويسأل: «ماذا سيحدث لهذه الشتلات؟».", "1. • التهيئة: يطرح المعلم السؤالين ويعرض الصورة، والطلبة يتوقعون مصير الشتلات المتزاحمة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • وظيفتا الثمرة: يقرأ المعلم مع الطلاب ص30: تحمي الثمرة البذور وتساعد في انتشارها، والطلبة يحددون الوظيفتين ويكتبونهما (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • محاكاة التزاحم: ينفذ المعلم محاكاة: يقف عدد من الطلاب «شتلات» في مساحة ضيقة يتقاسمون «ماءً وضوءًا» (بطاقات محدودة)، ثم في مساحة واسعة، والطلبة يلاحظون أن الشتلات المتزاحمة لا تحصل على حاجتها، ويستنتجون أهمية الانتشار (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • نقاش: يسأل المعلم: لماذا لا تنمو الشتلات جيدًا بجوار النبات الأصلي؟ هل لاحظتم نباتات تنمو في أماكن لم تُزرع فيها؟ والطلبة يربطون بين التزاحم ونقص الماء والضوء والمساحة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • طرق الحيوانات: يشرح المعلم من ص30–31: أكل الثمار وخروج البذور مع الفضلات، التعلق بالفراء والملابس بالأشواك، حمل النمل للبذور، دفن الفئران والسناجب للبذور، والطلبة يكملون جدولًا: الحيوان – طريقة نشر البذور (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. 2: البحث: يوزع المعلم المصادر (كتب، أجهزة) ويحدد مهام البحث لكل مجموعة، والطلبة يبحثون ويجمعون صورًا ومعلومات عن طريقة محددة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. • إعداد الملصق: يوجه المعلم إلى تصميم ملصق منظم بالرسوم والصور؛ الغلق (دقيقتان) يحدد موعد عرض الملصقات، والطلبة يبدؤون تصميم الملصق ويوزعون الأدوار. يرتبون أعمالهم (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "1. (مستوى المعرفة) ما المقصود بانتشار البذور؟\n   الإجابة النموذجية: نقل البذور بعيدًا عن النبات الأصلي الذي تكونت فيه.\n2. (مستوى التطبيق) ما وظيفتا الثمرة؟\n   الإجابة النموذجية: حماية البذور الموجودة بداخلها، والمساعدة في انتشارها.\n3. (مستوى الاستدلال) لماذا لا تنمو الشتلات جيدًا إذا نبتت كلها قرب النبات الأم؟\n   الإجابة النموذجية: لأنها تتشارك الماء والضوء في حيز صغير فلا تكفيها، فلا تكون نباتات صحية.\n\n4. (مستوى المعرفة) كيف تنشر الطيور بذور التوت؟\n   الإجابة النموذجية: تأكل الثمار وتخرج البذور مع فضلاتها في مكان بعيد.\n5. (مستوى التطبيق) كيف تنتقل بعض البذور على فراء الحيوانات؟\n   الإجابة النموذجية: تحتوي على أشواك أو خطافات تلتصق بالفراء أو الملابس.\n6. (مستوى الاستدلال) لماذا تنبت بعض البذور التي يدفنها الفأر؟\n   الإجابة النموذجية: لأنه قد لا يعود لأكلها فتجد في التربة الظروف الملائمة للإنبات.", "1. (مستوى المعرفة) صح أم خطأ: تحتاج الشتلات إلى مساحة كافية لتنمو.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر شيئين تتنافس عليهما الشتلات المتزاحمة.\n   الإجابة النموذجية: الماء والضوء (والمساحة).\n3. (مستوى الاستدلال) تنبأ: نبات تسقط كل بذوره تحته مباشرة، كيف سيكون نمو شتلاته؟ فسّر.\n   الإجابة النموذجية: ضعيفًا؛ لأنها تتنافس فيما بينها ومع النبات الأم على الماء والضوء والمساحة.\n\n4. (مستوى المعرفة) اذكر حيوانين ينشران البذور.\n   الإجابة النموذجية: الطيور، القرود، الفئران، النمل، السناجب (أي اثنين).\n5. (مستوى التطبيق) كيف يساعد الإنسان في نشر البذور دون قصد؟\n   الإجابة النموذجية: بالتصاق البذور بملابسه أو برمي بذور الثمار التي يأكلها.\n6. (مستوى الاستدلال) بذرة مغطاة بأشواك صغيرة، تنبأ بطريقة انتشارها مع التعليل.\n   الإجابة النموذجية: تنتشر بالتصاقها بفراء الحيوانات أو ملابس الإنسان لأن الأشواك تساعدها على التعلق.", "للطالب: قراءة كتاب الطالب ص30، والبحث (مع ولي الأمر) عن مثال لحيوان ينشر البذور. لولي الأمر: مساعدة الابن في البحث في الكتب أو الشبكة عن طرق نشر الحيوانات للبذور لاستخدامها في نشاط 2-2.\nللطالب: إكمال الملصق مع المجموعة، وقراءة كتاب الطالب ص31. لولي الأمر: إحضار جورب قديم (فردة واحدة) لنشاط المشي بالجورب في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=8"]}, {"n": 2, "topic": "ورقة العمل 2-2: المشي بالجورب وحل الأسئلة", "f": ["1. ينفذ نشاط المشي بالجورب لجمع البذور ويسجل البيانات\n2. يمثل أعداد البذور المجمعة بتمثيل بياني بالأعمدة\n\nمخرج تعليمي آخر: يربط بين عمل الجورب وعمل فراء الحيوانات في نشر البذور", "المخرج 1 (ينفذ نشاط المشي بالجورب لجمع البذور ويسجل البيانات): تطبيق\nالمخرج 2 (يمثل أعداد البذور المجمعة بتمثيل بياني بالأعمدة): تطبيق\nالمخرج الآخر (يربط بين عمل الجورب وعمل فراء الحيوانات في نشر البذور): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: جوارب قديمة أو شريط لاصق، عدسات مكبرة، أطباق", "انتشار البذور، الفراء.", "يعرض المعلم الملصقات المنجزة سريعًا، ثم يرفع جوربًا ويسأل: «كيف يمكن لهذا الجورب أن يساعدنا على فهم انتشار البذور؟».", "1. • التهيئة: يعرض المعلم الملصقات والجورب، والطلبة يتوقعون أن البذور ستلتصق بالجورب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • المشي بالجورب: يحدد المعلم منطقة عشبية لكل مجموعة ويوجه إلى لبس الجورب فوق الحذاء والمشي خمس دقائق، والطلبة يمشون في المنطقة العشبية ثم يعودون ويخلعون الجوارب (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • العدّ والتسجيل: يقدم المعلم ورقة العمل 2-2 ص63 ويساعد في تسمية البذور، والطلبة يفحصون الب رأ المعلم مع الطلاب ص30: تحمي الثمرة البذور وتساعد في انتشارها، والطلبة يحددون الوظيفتين ويكتبونهما (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • محاكاة التزاحم: ينفذ المعلم محاكاة: يقف عدد من الطلاب «شتلات» في مساحة ضيقة يتقاسمون «ماءً وضوءًا» (بطاقات محدودة)، ثم في مساحة واسعة، والطلبة يلاحظون أن الشتلات المتزاحمة لا تحصل على حاجتها، ويستنتجون أهمية الانتشار (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • نقاش: يسأل المعلم: لماذا لا تنمو الشتلات جيدًا بجوار النبات الأصلي؟ هل لاحظتم نباتات تنمو في أماكن لم تُزرع فيها؟ والطلبة يربطون بين التزاحم ونقص الماء والضوء والمساحة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • طرق الحيوانات: يشرح المعلم من ص30–31: أكل الثمار وخروج البذور مع الفضلات، التعلق بالفراء والملابس بالأشواك، حمل النمل للبذور، دفن الفئران والسناجب للبذور، والطلبة يكملون جدولًا: الحيوان – طريقة نشر البذور (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. 2: البحث: يوزع المعلم المصادر (كتب، أجهزة) ويحدد مهام البحث لكل مجموعة، والطلبة يبحثون ويجمعون صورًا ومعلومات عن طريقة محددة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. • إعداد الملصق: يوجه المعلم إلى تصميم ملصق منظم بالرسوم والصور؛ الغلق (دقيقتان) يحدد موعد عرض الملصقات، والطلبة يبدؤون تصميم الملصق ويوزعون الأدوار. يرتبون أعمالهم (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 2: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الملصقات والجورب، والطلبة يتوقعون أن البذور ستلتصق بالجورب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • المشي بالجورب: يحدد المعلم منطقة عشبية لكل مجموعة ويوجه إلى لبس الجورب فوق الحذاء والمشي خمس دقائق، والطلبة يمشون في المنطقة العشبية ثم يعودون ويخلعون الجوارب (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • العدّ والتسجيل: يقدم المعلم ورقة العمل 2-2 ص63 ويساعد في تسمية البذور، والطلبة يفحصون البذور بالعدسة ويعدّونها حسب أنواعها ويسجلونها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • أسئلة ص31: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن البذور المتروكة على النبات وا اق البذور بملابسه أو برمي بذور الثمار التي يأكلها.\n6. (مستوى الاستدلال) بذرة مغطاة بأشواك صغيرة، تنبأ بطريقة انتشارها مع التعليل.\n   الإجابة النموذجية: تنتشر بالتصاقها بفراء الحيوانات أو ملابس الإنسان لأن الأشواك تساعدها على التعلق.\n\nالحصة 2: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\n1. (مستوى المعرفة) صح أم خطأ: يعمل الجورب في هذا النشاط عمل فراء الحيوانات.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) أيهما ينمو أفضل: بذور طماطم متروكة على النبات، أم بذور طماطم أكلها طائر؟ ولماذا؟\n   الإجابة النموذجية: بذور الطماطم التي أكلها الطائر؛ لأنها تنتشر بعيدًا وتجد مساحة وماءً وضوءًا أكثر.\n3. (مستوى الاستدلال) هل يمكن للحيوانات نشر بذور الخوخ؟ وضّح.\n   الإجابة النموذجية: نعم؛ تأكل الثمرة وترمي البذرة الكبيرة بعيدًا عن الشجرة أو تحملها.", "الحصة 1: لماذا يجب أن تنتشر البذور؟\nللطالب: قراءة كتاب الطالب ص30، والبحث (مع ولي الأمر) عن مثال لحيوان ينشر البذور. لولي الأمر: مساعدة الابن في البحث في الكتب أو الشبكة عن طرق نشر الحيوانات للبذور لاستخدامها في نشاط 2-2.\nللطالب: إكمال الملصق مع المجموعة، وقراءة كتاب الطالب ص31. لولي الأمر: إحضار جورب قديم (فردة واحدة) لنشاط المشي بالجورب في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=8\n\nالحصة 2: ورقة العمل 2-2: المشي بالجورب وحل الأسئلة\nللطالب: حل تمرين 2-2 بكتاب النشاط ص24، وإكمال التمثيل البياني في ورقة العمل 2-2 ص63. لولي الأمر: جمع بذور متنوعة (مجففة) من المطبخ أو الحديقة مع الابن لإحضارها لدرس طرق انتشار البذور.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=8"]}, {"code": "2-3", "title": "طرق أخرى لانتشار البذور", "unit": 2, "dates": "الأسبوع الخامس (4–8/10/2026م)", "sb": "32–33", "tb": "42–44", "ab": "تمرين 2-3 ص25، ورقة المصادر 2-3 ص43، ورقة العمل 2-3 ص65", "periods": [{"n": 1, "topic": "انتشار البذور بواسطة الرياح + انتشار البذور بواسطة الماء", "f": ["1. يصف كيف تنتشر بعض البذور بواسطة الرياح\n2. يحدد صفات البذور التي تنتشر بالرياح: جافة خفيفة الوزن لها أجنحة أو شعيرات\n3. يصف كيف تنتشر بعض البذور بواسطة الماء\n4. يفسر دور الطبقة الإسفنجية في طفو بعض الثمار والبذور\n\nمخرج تعليمي آخر:\nيتنبأ بطريقة انتشار بذرة من خلال شكلها\nيختبر طفو ثمار أو بذور مختلفة ويستنتج أيها يمكن أن ينتشر بالماء", "المخرج 1 (يصف كيف تنتشر بعض البذور بواسطة الرياح): فهم\nالمخرج 2 (يحدد صفات البذور التي تنتشر بالرياح: جافة خفيفة الوزن لها أجنحة أو شعيرات): تحليل\nالمخرج 3 (يصف كيف تنتشر بعض البذور بواسطة الماء): فهم\nالمخرج 4 (يفسر دور الطبقة الإسفنجية في طفو بعض الثمار والبذور): فهم\nالمخرج الآخر (يتنبأ بطريقة انتشار بذرة من خلال شكلها): تطبيق\nالمخرج الآخر (يختبر طفو ثمار أو بذور مختلفة ويستنتج أيها يمكن أن ينتشر بالماء): تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور تنتشر بالرياح أو صورها، نماذج ورقية لبذرة مجنّحة، مروحة يدوية، أخرى: حوض ماء، ثمرة جوز هند أو صورتها، بذور متنوعة (فول، فلين، بذور زهرة)", "انتشار البذور، الرياح، خفة الوزن.، إسفنجي، الطفو، انتشار البذور.", "ينفخ المعلم (أو يعرض مقطعًا لطفلة تنفخ) بذور نبات الهندباء كما في ص32، ويسأل: «لماذا طارت هذه البذور بعيدًا بنفخة واحدة؟».", "1. • التهيئة: يعرض المعلم الصورة أو المقطع ويطرح السؤال، والطلبة يقترحون أن البذور خفيفة ولها شعيرات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • صور الكتاب ص32: يناقش المعلم أربعة أمثلة: الهندباء (مظلة من الشعر)، الثريا (ثمار تجف وتسقط)، الخشخاش (وعاء مسامي تهزه الرياح)، القيقب (أجنحة كالمروحة)، والطلبة يصفون كيف تساعد صفة كل بذرة على الانتشار بالرياح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تجربة الطيران: يوزع المعلم نموذجين: كرة ورقية صغيرة ونموذج «بذرة مجنحة» بالوزن نفسه، ويسقطهما أمام المروحة، والطلبة يلاحظون أن النموذج المجنح يطير أبعد ويبقى في الهواء مدة أطول (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • استنتاج الصفات: يكتب المعلم على السبورة: «البذور التي تنتشر بالرياح تكون…»، والطلبة يكملون: جافة، خفيفة، لها أجنحة أو شعيرات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الانتشار بالماء: يشرح المعلم من ص32: الطبقة الإسفنجية في جوز الهند مملوءة بالهواء تساعده على الطفو، وأشجار المانجروف تسقط «أقلام البحر» التي تطفو حتى تصل إلى اليابسة، والطلبة يعرفون مفهوم «إسفنجي» ويرسمون مقطعًا لجوز الهند (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • اختبار الطفو: يوزع المعلم على المجموعات بذورًا وثمارًا مختلفة وحوض ماء، والطلبة يتنبؤون بما يطفو، ثم يختبرون ويسجلون النتائج في جدول (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. • المناقشة: يسأل المعلم: أي البذور يمكن أن تنتشر بالماء؟ ولماذا تنمو بعض الأشجار قرب الشواطئ والأودية؟ والطلبة يستنتجون أن البذور الطافية تنتقل مع الماء بعيدًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • الغلق: يربط المعلم الدرس بالسؤال (1) ص33 عن زنبق الماء، والطلبة يجيبون شفهيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) اذكر نباتًا تنتشر بذوره بالرياح.\n   الإجابة النموذجية: الهندباء أو القيقب أو الخشخاش أو الثريا.\n2. (مستوى التطبيق) ما صفات البذور التي تنتشر بالرياح؟\n   الإجابة النموذجية: جافة خفيفة الوزن، ولها أجنحة أو شعيرات.\n3. (مستوى الاستدلال) لماذا بقي النموذج المجنح في الهواء مدة أطول من الكرة الورقية؟\n   الإجابة النموذجية: لأن الأجنحة تقاوم الهواء وتجعله يدور ويسقط ببطء فتحمله الرياح بعيدًا.\n\n4. (مستوى المعرفة) ما الثمرة التي تنتشر بذرتها بالماء في الكتاب؟\n   الإجابة النموذجية: جوز الهند (وأقلام بحر المانجروف).\n5. (مستوى التطبيق) ما المقصود بالطبقة الإسفنجية؟\n   الإجابة النموذجية: طبقة بها مسام كثيرة مملوءة بالهواء تساعد على الطفو.\n6. (مستوى الاستدلال) أي البذور التي اختبرتها يمكن أن تنتشر بالماء؟ لماذا؟\n   الإجابة النموذجية: البذور التي طفت؛ لأنها تستطيع أن تنتقل مع تيار الماء.", "1. (مستوى المعرفة) صح أم خطأ: البذور الثقيلة الرطبة تنتشر بسهولة بالرياح.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) كيف تساعد الرياح بذور الخشخاش على الانتشار؟\n   الإجابة النموذجية: تهز الرياح الثمرة فتخرج البذور من فتحات الوعاء المسامي وتنتشر بعيدًا.\n3. (مستوى الاستدلال) بذرة خفيفة لها شعيرات تشبه المظلة، تنبأ بطريقة انتشارها وفسّر.\n   الإجابة النموذجية: بالرياح؛ لأن الشعيرات تجعلها تطفو في الهواء وتحملها الرياح بعيدًا.\n\n4. (مستوى المعرفة) أكمل: تحتوي ثمرة جوز الهند على طبقة …… تساعدها على الطفو.\n   الإجابة النموذجية: إسفنجية.\n5. (مستوى التطبيق) كيف يساعد غلاف البذرة الإسفنجي زنبق الماء في نشر بذوره؟\n   الإجابة النموذجية: يجعلها تطفو على سطح الماء فتنتقل بعيدًا عن النبات الأصلي.\n6. (مستوى الاستدلال) لماذا تنتشر أشجار المانجروف على طول الشواطئ؟\n   الإجابة النموذجية: لأن بذورها (أقلام البحر) تطفو في الماء المالح حتى يلقيها البحر على اليابسة فتنمو هناك.", "للطالب: قراءة كتاب الطالب ص32 (الانتشار بالرياح)، وملاحظة نباتات في البيئة تنتشر بذورها بالرياح. لولي الأمر: مشاهدة مقطع مع الابن عن انتشار البذور بالرياح ومناقشته.\nللطالب: قراءة كتاب الطالب ص32 (الانتشار بالماء)، ورسم ثمرة جوز الهند مبينًا الطبقة الإسفنجية. لولي الأمر: تجربة طفو بذور مختلفة في وعاء ماء بالمنزل مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"n": 2, "topic": "الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟", "f": ["1. يصف كيف تنشر بعض الثمار بذورها بالانفجار أو التشقق\n2. يصنف بذورًا مختلفة حسب صفاتها وطرق انتشارها المحتملة\n\nمخرج تعليمي آخر: يستخدم الصفات الملاحظة للبذرة لاقتراح تفسير لطريقة انتشارها", "المخرج 1 (يصف كيف تنشر بعض الثمار بذورها بالانفجار أو التشقق): فهم\nالمخرج 2 (يصنف بذورًا مختلفة حسب صفاتها وطرق انتشارها المحتملة): تحليل\nالمخرج الآخر (يستخدم الصفات الملاحظة للبذرة لاقتراح تفسير لطريقة انتشارها): تقييم", "التعلم بالاكتشاف، التعلم التعاوني، العصف الذهني", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور متنوعة جمعها الطلاب، عدسات مكبرة، قرون فول جافة", "تنفجر، تتشقق، انتشار البذور.", "يعرض المعلم مقطعًا قصيرًا لقرون تنفجر وتقذف بذورها، ويسأل: «هل تحتاج كل النباتات إلى حيوان أو رياح أو ماء لنشر بذورها؟».", "1. • التهيئة: يعرض المعلم المقطع ويطرح السؤال، والطلبة يصفون ما شاهدوه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الانفجار والتشقق: يشرح المعلم من ص33: تجف قرون الفول في الطقس الحار فتنفجر وتقذف بذورها، والطلبة يفحصون قرنًا جافًا ويحددون خط التشقق (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 3: يوجه المجموعات وفق ص33، والطلبة يجمعون خمسة أنواع على الأقل من البذور، ويلاحظونها بالعدسة، ويحاولون معرفة نباتاتها، ويرسمونها ويسمونها، ويصنفونها حسب طريقة انتشارها المحتملة (18 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. • عرض التصنيف: يطلب المعلم من كل مجموعة تبرير تصنيفها، والطلبة يعرضون: أشواك ← حيوانات، أجنحة ← رياح، طبقة إسفنجية ← ماء، قرون ← انفجار (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يذكرون أربع طرق لانتشار البذور (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ماذا يحدث لقرون الفول في الطقس الحار الجاف؟\n   الإجابة النموذجية: تجف وتنفجر (تتشقق) فتنطلق البذور خارجها.\n2. (مستوى التطبيق) بذرة لها جناحان، كيف صنفتها؟\n   الإجابة النموذجية: ضمن البذور التي تنتشر بالرياح.\n3. (مستوى الاستدلال) كيف تساعد صفة البذرة على تحديد طريقة انتشارها؟\n   الإجابة النموذجية: الصفة تدل على الطريقة: الأشواك للتعلق بالحيوانات، والأجنحة للرياح، والطبقة الإسفنجية للماء.", "1. (مستوى المعرفة) صح أم خطأ: يمكن لبعض الثمار نشر بذورها بنفسها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا يقطف المزارعون قرون الفول قبل أن يشتد الحر؟\n   الإجابة النموذجية: لأن القرون تجف وتنفجر في الحر فتتناثر البذور وتضيع.\n3. (مستوى الاستدلال) اقترح تفسيرًا لطريقة انتشار بذور الريحان مع التعليل.\n   الإجابة النموذجية: تقبل الإجابات المنطقية المعللة، مثل: تسقط بذوره الصغيرة الخفيفة من الثمار الجافة وتحملها الرياح أو تلتصق برطوبة أجسام الحيوانات.", "للطالب: الاحتفاظ بالبذور المصنفة، وقراءة ورقة المصادر 2-3 (طرق انتشار البذور) ص43 بكتاب النشاط. لولي الأمر: تجهيز ورق مقوى ومقص ومشبك ورق للابن لتصميم نموذج بذرة في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"n": 3, "topic": "ورقة العمل 2-3: صمم بذرة تنشرها الرياح", "f": ["1. يصمم نموذج بذرة تنتشر بالرياح\n2. يخطط لاختبار عادل لقياس زمن سقوط النموذج ويكرر القياس\n\nمخرج تعليمي آخر: يقيم تصميمه ويقترح تحسينات بناءً على النتائج", "المخرج 1 (يصمم نموذج بذرة تنتشر بالرياح): إبداع\nالمخرج 2 (يخطط لاختبار عادل لقياس زمن سقوط النموذج ويكرر القياس): تطبيق\nالمخر دلال) اقترح تعديلًا يجعل نموذجك يبقى في الهواء مدة أطول، وفسّر.\n   الإجابة النموذجية: زيادة مساحة الأجنحة أو تخفيف الوزن؛ لأن ذلك يزيد مقاومة الهواء ويبطئ السقوط.", "للطالب: إكمال ورقة العمل 2-3 ص65 وكتابة تقرير قصير عن أفضل تصميم. لولي الأمر: مشاركة الابن في تحسين نموذجه بالمنزل واختباره من ارتفاع ثابت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"n": 4, "topic": "مراجعة طرق انتشار البذور وأسئلة الدرس", "f": ["1. يقارن بين طرق انتشار البذور: الحيوانات والرياح والماء والانفجار\n2. يطبق معرفته في الإجابة عن أسئلة الدرس وتمرين كتاب النشاط\n\nمخرج تعليمي آخر: يقترح الطريقة التي تساعد البذور على الانتشار لأبعد مسافة ويبرر رأيه", "المخرج 1 (يقارن بين طرق انتشار البذور: الحيوانات والرياح والماء والانفجار): تحليل\nالمخرج 2 (يطبق معرفته في الإجابة عن أسئلة الدرس وتمرين كتاب النشاط): تطبيق\nالمخرج الآخر (يقترح الطريقة التي تساعد البذور على الانتشار لأبعد مسافة ويبرر رأيه): تقييم", "التعلم التعاوني، التعلم التشاركي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات صور بذور وثمار", "انتشار البذور، إسفنجي، تنفجر/تتشقق.", "ينفذ المعلم لعبة «أين أذهب؟»: يرفع صورة بذرة، وتتسابق المجموعات في رفع بطاقة طريقة انتشارها (حيوان/رياح/ماء/انفجار).", "1. • التهيئة: ينفذ المعلم اللعبة، والطلبة يرفعون البطاقات المناسبة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • جدول مقارنة: يرسم المعلم جدولًا: الطريقة – صفات البذرة – مثال، والطلبة يكملون الجدول تعاونيًا (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة ص33: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن زنبق الماء وقرون الفول والريحان (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تمرين 2-3: يقدم المعلم تمرين 2-3 بكتاب النشاط ص25، والطلبة يحلون التمرين فرديًا ثم يصححون مع زملائهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) اذكر أربع طرق لانتشار البذور.\n   الإجابة النموذجية: الحيوانات، الرياح، الماء، الانفجار (التشقق).\n2. (مستوى التطبيق) قارن بين بذرة تنتشر بالرياح وبذرة تنتشر  الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور تنتشر بالرياح أو صورها، نماذج ورقية لبذرة مجنّحة، مروحة يدوية، أخرى: حوض ماء، ثمرة جوز هند أو صورتها، بذور متنوعة (فول، فلين، بذور زهرة)\n\nالحصة 2: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nالكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، أخرى: بذور متنوعة جمعها الطلاب، عدسات مكبرة، قرون فول جافة\n\nالحصة 3: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالكتاب، السبورة الذكية، الأقلام، أخرى: ورق مقوى، مقص، مشابك ورق، ساعة إيقاف، شريط متري\n\nالحصة 4: مراجعة طرق انتشار البذور وأسئلة الدرس\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات صور بذور وثمار", "الحصة 1: انتشار البذور بواسطة الرياح\nانتشار البذور، الرياح، خفة الوزن.، إسفنجي، الطفو، انتشار البذور.\n\nالحصة 2: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nتنفجر، تتشقق، انتشار البذور.\n\nالحصة 3: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالاختبار العادل، القياس المتكرر، انتشار البذور.\n\nالحصة 4: مراجعة طرق انتشار البذور وأسئلة الدرس\nانتشار البذور، إسفنجي، تنفجر/تتشقق.", "الحصة 1: انتشار البذور بواسطة الرياح\nينفخ المعلم (أو يعرض مقطعًا لطفلة تنفخ) بذور نبات الهندباء كما في ص32، ويسأل: «لماذا طارت هذه البذور بعيدًا بنفخة واحدة؟».\n\nالحصة 2: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nيعرض المعلم مقطعًا قصيرًا لقرون تنفجر وتقذف بذورها، ويسأل: «هل تحتاج كل النباتات إلى حيوان أو رياح أو ماء لنشر بذورها؟».\n\nالحصة 3: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nيطرح المعلم تحديًا: «أنت مهندس نباتات! صمم بذرة تبقى في الهواء أطول مدة لتحملها الرياح بعيدًا»، ويعرض ورقة المصادر 2-3 ص43 للإلهام.\n\nالحصة 4: مراجعة طرق انتشار البذور وأسئلة الدرس\nينفذ المعلم لعبة «أين أذهب؟»: يرفع صورة بذرة، وتتسابق المجموعات في رفع بطاقة طريقة انتشارها (حيوان/رياح/ماء/انفجار).", "الحصة 1: انتشار البذور بواسطة الرياح — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصورة أو المقطع ويطرح السؤال، والطلبة يقترحون أن البذور خفيفة ولها شعيرات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • صور الكتاب ص32: يناقش المعلم أربعة أمثلة: الهندباء (مظلة من الشعر)، الثريا (ثمار تجف وتسقط)، الخشخاش (وعاء مسامي تهزه الرياح)، القيقب (أجنحة كالمروحة)، والطلبة يصفون كيف تساعد صفة كل بذرة على الانتشار بالرياح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تجربة الطيران: يوزع المعلم نموذجين: كرة ورقية صغيرة ونموذج «بذرة مجنحة» بالوزن نفسه، ويسقطهما أمام المروحة، والطلبة يلاحظون أن النموذج المجنح يطير أبعد ويبقى في الهواء مدة أطول (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • استنتاج الصفات: يكتب المعلم على السبورة: «البذور التي تنتشر بالرياح تكون…»، والطلبة يكملون: جافة، خفيفة، لها أجنحة أو شعيرات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الانتشار بالماء: يشرح المعلم من ص32: الطبقة الإسفنجية في جوز الهند مملوءة بالهواء تساعده على الطفو، وأشجار المانجروف تسقط «أقلام البحر» التي تطفو حتى تصل إلى اليابسة، والطلبة يعرفون مفهوم «إسفنجي» ويرسمون مقطعًا لجوز الهند (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • اختبار الطفو: يوزع المعلم على المجموعات بذورًا وثمارًا مختلفة وحوض ماء، والطلبة يتنبؤون بما يطفو، ثم يختبرون ويسجلون النتائج في جدول (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. • المناقشة: يسأل المعلم: أي البذور يمكن أن تنتشر بالماء؟ ولماذا تنمو بعض الأشجار قرب الشواطئ والأودية؟ والطلبة يستنتجون أن البذور الطافية تنتقل مع الماء بعيدًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • الغلق: يربط المعلم الدرس بالسؤال (1) ص33 عن زنبق الماء، والطلبة يجيبون شفهيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟ — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم المقطع ويطرح السؤال، والطلبة يصفون ما شاهدوه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الانفجار والتشقق: يشرح المعلم من ص33: تجف قرون الفول في الطقس الحار فتنفجر وتقذف بذورها، والطلبة يفحصون قرنًا جافًا ويحددون خط التشقق (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 3: يوجه المجموعات وفق ص33، والطلبة يجمعون خمسة أنواع على الأقل من البذور، ويلاحظونها بالعدسة، ويحاولون معرفة نباتاتها، ويرسمونها ويسمونها، ويصنفونها حسب طريقة انتشارها المحتملة (18 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. • عرض التصنيف: يطلب المعلم من كل مجموعة تبرير تصنيفها، والطلبة يعرضون: أشواك ← حيوانات، أجنحة ← رياح، طبقة إسفنجية ← ماء، قرون ← انفجار (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يذكرون أربع طرق لانتشار البذور (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: ورقة العمل 2-3: صمم بذرة تنشرها الرياح — زمن الحصة 40 دقيقة\n1. • التهيئة: يطرح المعلم التحدي ويعرض ورقة المصادر، والطلبة يقترحون أشكالًا (أجنحة، مظلة) (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. • التخطيط: يقدم المعلم ورقة العمل 2-3 ص65 ويناقش: ما الذي نقيسه؟ ما الذي نثبته؟ والطلبة يحددون: نقيس زمن السقوط، ونثبت الارتفاع والوزن (مشبك واحد) (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • التصميم والتصنيع: يتابع المجموعات، والطلبة يصنعون نموذجين مختلفين أو أكثر (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • الاختبار والتكرار: يحدد المعلم ارتفاع الإسقاط نفسه لجميع المجموعات، ويؤكد تكرار القياس ثلاث مرات، والطلبة يسقطون النماذج ويقيسون الزمن بساعة الإيقاف ثلاث مرات ويسجلون (11 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. • التقييم: يسأل المعلم: أي تصميم بقي في الهواء أطول؟ كيف تحسنه؟ والطلبة يقارنون النتائج ويقترحون تحسينات (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 4: مراجعة طرق انتشار البذور وأسئلة الدرس — زمن الحصة 40 دقيقة\n1. • التهيئة: ينفذ المعلم اللعبة، والطلبة يرفعون البطاقات المناسبة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • جدول مقارنة: يرسم المعلم جدولًا: الطريقة – صفات البذرة – مثال، والطلبة يكملون الجدول تعاونيًا (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة ص33: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن زنبق الماء وقرون الفول والريحان (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تمرين 2-3: يقدم المعلم تمرين 2-3 بكتاب النشاط ص25، والطلبة يحلون التمرين فرديًا ثم يصححون مع زملائهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: انتشار البذور بواسطة الرياح\n1. (مستوى المعرفة) اذكر نباتًا تنتشر بذوره بالرياح.\n   الإجابة النموذجية: الهندباء أو القيقب أو الخشخاش أو الثريا.\n2. (مستوى التطبيق) ما صفات البذور التي تنتشر بالرياح؟\n   الإجابة النموذجية: جافة خفيفة الوزن، ولها أجنحة أو شعيرات.\n3. (مستوى الاستدلال) لماذا بقي النموذج المجنح في الهواء مدة أطول من الكرة الورقية؟\n   الإجابة النموذجية: لأن الأجنحة تقاوم الهواء وتجعله يدور ويسقط ببطء فتحمله الرياح بعيدًا.\n\n4. (مستوى المعرفة) ما الثمرة التي تنتشر بذرتها بالماء في الكتاب؟\n   الإجابة النموذجية: جوز الهند (وأقلام بحر المانجروف).\n5. (مستوى التطبيق) ما المقصود بالطبقة الإسفنجية؟\n   الإجابة النموذجية: طبقة بها مسام كثيرة مملوءة بالهواء تساعد على الطفو.\n6. (مستوى الاستدلال) أي البذور التي اختبرتها يمكن أن تنتشر بالماء؟ لماذا؟\n   الإجابة النموذجية: البذور التي طفت؛ لأنها تستطيع أن تنتقل مع تيار الماء.\n\nالحصة 2: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\n1. (مستوى المعرفة) ماذا يحدث لقرون الفول في الطقس الحار الجاف؟\n   الإجابة النموذجية: تجف وتنفجر (تتشقق) فتنطلق البذور خارجها.\n2. (مستوى التطبيق) بذرة لها جناحان، كيف صنفتها؟\n   الإجابة النموذجية: ضمن البذور التي تنتشر بالرياح.\n3. (مستوى الاستدلال) كيف تساعد صفة البذرة على تحديد طريقة انتشارها؟\n   الإجابة النموذجية: الصفة تدل على الطريقة: الأشواك للتعلق بالحيوانات، والأجنحة للرياح، والطبقة الإسفنجية للماء.\n\nالحصة 3: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\n1. (مستوى المعرفة) ما الذي قسناه في هذا النشاط؟\n   الإجابة النموذجية: الزمن الذي يستغرقه النموذج حتى يصل إلى الأرض.\n2. (مستوى التطبيق) ما العوامل التي ثبتناها ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: ارتفاع الإسقاط، ووزن النموذج (عدد المشابك)، ومكان الإسقاط.\n3. (مستوى الاستدلال) لماذا كررنا القياس ثلاث مرات؟\n   الإجابة النموذجية: لأن القياس الواحد قد يكون خاطئًا، والتكرار يعطي نتائج أكثر دقة وموثوقية.\n\nالحصة 4: مراجعة طرق انتشار البذور وأسئلة الدرس\n1. (مستوى المعرفة) اذكر أربع طرق لانتشار البذور.\n   الإجابة النموذجية: الحيوانات، الرياح، الماء، الانفجار (التشقق).\n2. (مستوى التطبيق) قارن بين بذرة تنتشر بالرياح وبذرة تنتشر بالماء من حيث الصفات.\n   الإجابة النموذجية: التي تنتشر بالرياح خفيفة جافة لها أجنحة أو شعيرات، والتي تنتشر بالماء لها طبقة إسفنجية تساعدها على الطفو.\n3. (مستوى الاستدلال) أي طرق الانتشار تنقل البذور لأبعد مسافة في رأيك؟ برر.\n   الإجابة النموذجية: تقبل الإجابات المبررة، مثل: الماء لأنه قد يحمل البذور عبر البحار مسافات طويلة.", "الحصة 1: انتشار البذور بواسطة الرياح\n1. (مستوى المعرفة) صح أم خطأ: البذور الثقيلة الرطبة تنتشر بسهولة بالرياح.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) كيف تساعد الرياح بذور الخشخاش على الانتشار؟\n   الإجابة النموذجية: تهز الرياح الثمرة فتخرج البذور من فتحات الوعاء المسامي وتنتشر بعيدًا.\n3. (مستوى الاستدلال) بذرة خفيفة لها شعيرات تشبه المظلة، تنبأ بطريقة انتشارها وفسّر.\n   الإجابة النموذجية: بالرياح؛ لأن الشعيرات تجعلها تطفو في الهواء وتحملها الرياح بعيدًا.\n\n4. (مستوى المعرفة) أكمل: تحتوي ثمرة جوز الهند على طبقة …… تساعدها على الطفو.\n   الإجابة النموذجية: إسفنجية.\n5. (مستوى التطبيق) كيف يساعد غلاف البذرة الإسفنجي زنبق الماء في نشر بذوره؟\n   الإجابة النموذجية: يجعلها تطفو على سطح الماء فتنتقل بعيدًا عن النبات الأصلي.\n6. (مستوى الاستدلال) لماذا تنتشر أشجار المانجروف على طول الشواطئ؟\n   الإجابة النموذجية: لأن بذورها (أقلام البحر) تطفو في الماء المالح حتى يلقيها البحر على اليابسة فتنمو هناك.\n\nالحصة 2: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\n1. (مستوى المعرفة) صح أم خطأ: يمكن لبعض الثمار نشر بذورها بنفسها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا يقطف المزارعون قرون الفول قبل أن يشتد الحر؟\n   الإجابة النموذجية: لأن القرون تجف وتنفجر في الحر فتتناثر البذور وتضيع.\n3. (مستوى الاستدلال) اقترح تفسيرًا لطريقة انتشار بذور الريحان مع التعليل.\n   الإجابة النموذجية: تقبل الإجابات المنطقية المعللة، مثل: تسقط بذوره الصغيرة الخفيفة من الثمار الجافة وتحملها الرياح أو تلتصق برطوبة أجسام الحيوانات.\n\nالحصة 3: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\n1. (مستوى المعرفة) ما الأداة التي قسنا بها زمن السقوط؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (مستوى التطبيق) أي التصميمين أفضل: الذي سقط في 2 ثانية أم في 4 ثوانٍ؟ ولماذا؟\n   الإجابة النموذجية: الذي سقط في 4 ثوانٍ؛ لأنه بقي في الهواء مدة أطول فتحمله الرياح أبعد.\n3. (مستوى الاستدلال) اقترح تعديلًا يجعل نموذجك يبقى في الهواء مدة أطول، وفسّر.\n   الإجابة النموذجية: زيادة مساحة الأجنحة أو تخفيف الوزن؛ لأن ذلك يزيد مقاومة الهواء ويبطئ السقوط.\n\nالحصة 4: مراجعة طرق انتشار البذور وأسئلة الدرس\n1. (مستوى المعرفة) صل: أشواك ← …… ، أجنحة ← …… ، طبقة إسفنجية ← ……\n   الإجابة النموذجية: حيوانات؛ رياح؛ ماء.\n2. (مستوى التطبيق) لماذا تحتاج النباتات إلى طرق مختلفة لنشر بذورها؟\n   الإجابة النموذجية: لأنها تعيش في بيئات مختلفة، وكل طريقة تناسب بيئة النبات وشكل بذوره.\n3. (مستوى الاستدلال) ما الطريقة التي تساعد البذور على الانتشار لأبعد مسافة عن النبات الأصلي؟ فسّر.\n   الإجابة النموذجية: تقبل الإجابة المبررة: الرياح أو الماء أو الطيور، مع التعليل.", "الحصة 1: انتشار البذور بواسطة الرياح\nللطالب: قراءة كتاب الطالب ص32 (الانتشار بالرياح)، وملاحظة نباتات في البيئة تنتشر بذورها بالرياح. لولي الأمر: مشاهدة مقطع مع الابن عن انتشار البذور بالرياح ومناقشته.\nللطالب: قراءة كتاب الطالب ص32 (الانتشار بالماء)، ورسم ثمرة جوز الهند مبينًا الطبقة الإسفنجية. لولي الأمر: تجربة طفو بذور مختلفة في وعاء ماء بالمنزل مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9\n\nالحصة 2: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nللطالب: الاحتفاظ بالبذور المصنفة، وقراءة ورقة المصادر 2-3 (طرق انتشار البذور) ص43 بكتاب النشاط. لولي الأمر: تجهيز ورق مقوى ومقص ومشبك ورق للابن لتصميم نموذج بذرة في الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9\n\nالحصة 3: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nللطالب: إكمال ورقة العمل 2-3 ص65 وكتابة تقرير قصير عن أفضل تصميم. لولي الأمر: مشاركة الابن في تحسين نموذجه بالمنزل واختباره من ارتفاع ثابت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9\n\nالحصة 4: مراجعة طرق انتشار البذور وأسئلة الدرس\nللطالب: حل تمرين 2-3 بكتاب النشاط ص25 إن لم يكتمل، ومراجعة طرق انتشار البذور. لولي الأمر: إحضار زهرة كبيرة (مثل الكركديه أو الزنبق) مع الابن لدرس أجزاء الزهرة، مع التأكد من أنها ليست سامة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"code": "2-4", "title": "أجزاء الزهرة", "unit": 2, "dates": "الأسبوع السادس (11–15/10/2026م)", "sb": "34–35", "tb": "45–47", "ab": "تمرين 2-4 ص26، ورقة المصادر 2-4 ص45، ورقتا العمل 2-4أ ص67 و2-4ب ص69", "periods": [{"n": 1, "topic": "نشاط 2-4أ: استقصاء أجزاء الزهرة + أجزاء الزهرة ووظائفها", "f": ["1. يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها\n2. يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها\n3. يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)\n4. يوضح وظيفة كل جزء من أجزاء الزهرة\n\nمخرج تعليمي آخر:\nيميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة\nيصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية", "المخرج 1 (يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها): فهم\nالمخرج 2 (يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها): تطبيق\nالمخرج 3 (يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)): تذكر\nالمخرج 4 (يوضح وظيفة كل جزء من أجزاء الزهرة): فهم\nالمخرج الآخر (يميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة): تحليل\nالمخرج الآخر (يصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي، التعلم بالنمذجة، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: أزهار حقيقية كبيرة (كالكركديه أو الرمان)، عدسات مكبرة، نماذج مجسمة، أخرى: ورقة المصادر 2-4 (نماذج أجزاء الزهرة) ص45، مقص، صمغ", "البتلات، السبلات، الأسدية، الأجزاء الذكرية، الأجزاء الأنثوية.، السداة (عضو التذكير)، المتك، الخيط، الكربلة (عضو التأنيث)، الميسم، القلم، المبيض، البويضات، حبوب اللقاح.", "ينفذ المعلم عصفًا ذهنيًا سريعًا: يعرض زهرة كبيرة ويطلب من الطلاب تسمية أكبر عدد من أجزائها التي يعرفونها، ويكتبها على السبورة.", "1. • التهيئة: يعرض المعلم الزهرة وينفذ العصف الذهني، والطلبة يسمون ما يعرفونه من أجزاء (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعليمات الأمان: ينبّه المعلم إلى عدم قطف الأزهار دون إذن وتجنب النباتات الضارة كالدفلة، وغسل اليدين بعد العمل، والطلبة يستمعون ويلتزمون (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 4أ: يوزع المعلم الأزهار والعدسات ويوجه وفق خطوات ص34، والطلبة يحددون اللون، ويعدّون الأجزاء الملونة (البتلات) والخضراء (السبلات)، ويلاحظون الأجزاء الداخلية، ويعدّون السيقان الرفيعة (الأسدية) ويلمسون حوافها، ويلاحظون الساق الوسطى (الكربلة) (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • المشاركة: يطلب المعلم من كل مجموعة عرض أعدادها، والطلبة يقارنون الأعداد بين أنواع الأزهار (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • شرح الأجزاء: يشرح المعلم رسم ص34: السبلات تحمي البرعم، البتلات زاهية تجذب الحشرات، السداة (متك + خيط) والمتك ينتج حبوب اللقاح، الكربلة (ميسم يستقبل حبوب اللقاح + قلم + مبيض يحتوي على البويضات)، والطلبة يكتبون كل جزء ووظيفته في جدول (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • نموذج الزهرة: يوزع المعلم ورقة المصادر 2-4 ص45، والطلبة يقصون أجزاء الزهرة ويلصقونها في مكانها الصحيح ويسمونها (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. • لعبة التصنيف: يعرض المعلم بطاقات أسماء الأجزاء، ويصنفونها الطالب: ذكرية (المتك، الخيط) – أنثوية (الميسم، القلم، المبيض، البويضات) – أجزاء أخرى (البتلات، السبلات) (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. • الغلق: يطرح المعلم سؤالًا ختاميًا، والطلبة يسمّون عضو التذكير وعضو التأنيث (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما لون السبلات غالبًا؟\n   الإجابة النموذجية: أخضر.\n2. (مستوى التطبيق) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الزهرة (مع العدّ الصحيح).\n3. (مستوى الاستدلال) ما المسحوق الأصفر الذي ظهر على أصابعك بعد لمس حواف السيقان الرفيعة؟ ومن أي جزء أتى؟\n   الإجابة النموذجية: حبوب اللقاح، من المتك (رأس السداة) وهو جزء ذكري.\n\n4. (مستوى المعرفة) ما الجزء الذي يصنع حبوب اللقاح؟\n   الإجابة النموذجية: المتك.\n5. (مستوى التطبيق) ما وظيفة السبلات؟\n   الإجابة النموذجية: حماية برعم الزهرة.\n6. (مستوى الاستدلال) صنّف: الميسم، المتك، المبيض، الخيط إلى ذكرية وأنثوية.\n   الإجابة النموذجية: ذكرية: المتك، الخيط. أنثوية: الميسم، المبيض.", "1. (مستوى المعرفة) صح أم خطأ: البتلات هي الأجزاء الملونة في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر جزأين لاحظتهما داخل الزهرة.\n   الإجابة النموذجية: الأسدية (السيقان الرفيعة) والكربلة (الساق الوسطى).\n3. (مستوى الاستدلال) لماذا تكون الساق الوسطى في الزهرة مختلفة عن الأسدية؟\n   الإجابة النموذجية: لأنها الجزء الأنثوي (الكربلة)، بينما الأسدية أجزاء ذكرية.\n\n4. (مستوى المعرفة) أكمل: تتكون السداة من …… و……\n   الإجابة النموذجية: المتك والخيط.\n5. (مستوى التطبيق) ما وظيفة الميسم؟\n   الإجابة النموذجية: استقبال حبوب اللقاح في عملية التلقيح.\n6. (مستوى الاستدلال) لماذا تكون بتلات بعض الأزهار زاهية الألوان؟\n   الإجابة النموذجية: لتجذب الحشرات إلى الزهرة.", "للطالب: قراءة كتاب الطالب ص34، ورسم الزهرة التي فحصها. لولي الأمر: مساعدة الابن في ملاحظة زهرة في المنزل وعدّ بتلاتها وسبلاتها.\nللطالب: مراجعة رسم أجزاء الزهرة ص34 وحفظ أسماء الأجزاء ووظائفها. لولي الأمر: إحضار زهرة للحصة القادمة وملاقط صغيرة إن أمكن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}, {"n": 2, "topic": "نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها", "f": ["1. يفصل أجزاء الزهرة بعناية ويعدّها\n2. يرسم السداة والكربلة ويسمي أجزاءهما\n\nمخرج تعليمي آخر: يقارن بين أعداد أجزاء زهرتين مختلفتين", "المخرج 1 (يفصل أجزاء الزهرة بعناية ويعدّها): تطبيق\nالمخرج 2 (يرسم السداة والكربلة ويسمي أجزاءهما): تطبيق\nالمخرج الآخر (يقارن بين أعداد أجزاء زهرتين مختلفتين): تحليل", "التعلم بالاكتشاف، التعلم الذاتي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: أزهار، عدسات مكبرة، ملاقط صغيرة، ورق أبيض", "السداة، الكربلة، المتك، الخيط، الميسم، المبيض.", "يعرض المعلم رسمًا لزهرة دون أسماء ويطلب من الطلاب تسمية الأجزاء بسرعة شفهيًا كمراجعة.", "1. • التهيئة: يعرض المعلم الرسم للمراجعة، والطلبة يسمون الأجزاء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • نمذجة التشريح: يوضح المعلم كيفية سحب البتلات والسبلات بالملقط برفق، والطلبة يتابعون (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. 4ب: يتابع المجموعات وفق خطوات ص35، والطلبة يرسمون الزهرة ويسمون أجزاءها، ويعدّون البتلات والسبلات والأسدية، ويسحبون البتلات والسبلات، ويستخدمون العدسة لرؤية الأسدية والكرابل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • رسم السداة والكربلة: يتابع المعلم دقة الرسم، والطلبة يرسمون السداة والكربلة ويسمون أجزاءهما (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم: هل تتساوى أعداد الأجزاء في الأزهار المختلفة؟ والطلبة يقارنون بين أزهار المجموعات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "1. (مستوى المعرفة) ما الأداة التي استخدمناها لسحب البتلات؟\n   الإجابة النموذجية: الملقط.\n2. (مستوى التطبيق) سمِّ جزأي السداة.\n   الإجابة النموذجية: المتك والخيط.\n3. (مستوى الاستدلال) قارن بين عدد البتلات في زهرتك وزهرة مجموعة أخرى.\n   الإجابة النموذجية: تقبل الإجابة الصحيحة حسب الأزهار مع ذكر الفرق.", "1. (مستوى المعرفة) صح أم خطأ: الكربلة هي عضو التأنيث في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) سمِّ ثلاثة أجزاء للكربلة.\n   الإجابة النموذجية: الميسم والقلم والمبيض.\n3. (مستوى الاستدلال) لماذا نستخدم العدسة المكبرة عند فحص الأسدية والكرابل؟\n   الإجابة النموذجية: لأنها أجزاء صغيرة يصعب رؤية تفاصيلها بالعين المجردة.", "للطالب: إكمال رسم السداة والكربلة وتسمية الأجزاء. لولي الأمر: مساعدة الابن في اختيار زهرة صغيرة لضغطها وتجفيفها (ورقة العمل 2-4أ).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}, {"n": 3, "topic": "أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار", "f": ["1. يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة\n2. يضع تنبؤات اعتمادًا على النمط المكتشف\n\nمخرج تعليمي آخر: يقرر ما إذا كانت البيانات كافية للتوصل إلى استنتاج عام", "المخرج 1 (يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة): تحليل\nالمخرج 2 (يضع تنبؤات اعتمادًا على النمط المكتشف): تطبيق\nالمخرج الآخر (يقرر ما إذا كانت البيانات كافية للتوصل إلى استنتاج عام): تقييم", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورقتا العمل 2-4أ ص67 و2-4ب ص69، أزهار صغيرة، أوراق جرائد، كتب ثقيلة", "النمط، التنبؤ، السبلات، البتلات، الأسدية.", "يكتب المعلم على السبورة: 4، 8، 12، … ويسأل عن العدد التالي، ثم يوضح أن النمط تغيّر منتظم في الأعداد يمكن أن نجده في الأزهار أيضًا.", "1. • التهيئة: يعرض المعلم النمط العددي، والطلبة يكتشفون العدد التالي ويعرفون النمط (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • ورقة العمل 2-4أ: يوضح المعلم طريقة ضغط الزهرة بين أوراق الجرائد تحت كتب ثقيلة لمدة أسبوعين إلى أربعة أسابيع، والطلبة يضعون أزهارهم للضغط ويرسمونها قبل الضغط (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • ورقة العمل 2-4ب: يقدم المعلم ورقة العمل ص69 ويطلب البحث عن النمط في أعداد السبلات والبتلات والأسدية، والطلبة يحللون الجدول ويكتشفون أن أعداد البتلات والأسدية تساوي عدد السبلات أو مضاعفاته، ويتنبؤون بأجزاء زهرة لها ثماني سبلات (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • كفاية الأدلة: يسأل المعلم: هل تكفي هذه البيانات لنقول إن كل الأزهار هكذا؟ والطلبة يستنتجون أننا نحتاج أزهارًا أكثر لنتأكد (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يلخص المعلم مفهوم النمط والتنبؤ، والطلبة يذكرون النمط الذي اكتشفوه (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما المقصود بالنمط؟\n   الإجابة النموذجية: تغير منتظم في الأعداد أو بيانات تتكرر بطريقة يمكن توقعها.\n2. (مستوى التطبيق) زهرة لها خمس سبلات، كم عدد بتلاتها المتوقع؟\n   الإجابة النموذجية: خمس بتلات غالبًا.\n3. (مستوى الاستدلال) هل تكفي بيانات أربع أزهار لتعميم النمط على كل الأزهار؟ لماذا؟\n   الإجابة النموذجية: لا؛ نحتاج إلى فحص أزهار كثيرة مختلفة لأن بعض الأزهار قد لا تتبع النمط.", "1. (مستوى المعرفة) صح أم خطأ: نضغط الزهرة لتجف وتحافظ على شكلها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ بعدد بتلات وأسدية زهرة لها ثماني سبلات.\n   الإجابة النموذجية: ثماني بتلات وثماني أسدية على الأرجح.\n3. (مستوى الاستدلال) كيف تتحقق من صحة النمط الذي اكتشفته؟\n   الإجابة النموذجية: بفحص أزهار كثيرة مختلفة وعدّ أجزائها ومقارنتها بالنمط.", "للطالب: متابعة الزهرة المضغوطة أسبوعيًا، وإكمال ورقة العمل 2-4ب ص69. لولي الأمر: التأكد من وضع الزهرة في مكان جاف تحت كتب ثقيلة دون تحر ى على اللحوم المتعفنة فيلقحها.", "1. (مستوى المعرفة) سمِّ جزء الزهرة الذي يحمي البرعم.\n   الإجابة النموذجية: السبلات.\n2. (مستوى التطبيق) اذكر خطوتين في خطة استقصاء اللون الأكثر شيوعًا لبتلات الأزهار.\n   الإجابة النموذجية: عدّ أزهار كل لون في أماكن مختلفة، تسجيل الأعداد في جدول وتمثيلها بالأعمدة.\n3. (مستوى الاستدلال) لماذا يجب تكرار العدّ في أكثر من حديقة؟\n   الإجابة النموذجية: لأن حديقة واحدة قد لا تمثل جميع الأزهار، والتكرار يجعل الاستنتاج أكثر موثوقية.", "للطالب: حل تمرين 2-4 بكتاب النشاط ص26 إن لم يكتمل، وتنفيذ خطة عدّ الأزهار حسب ألوانها في حديقة الحي. لولي الأمر: مرافقة الابن عند عدّ الأزهار وتسجيل النتائج.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}], "combined": ["الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها\n2. يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها\n3. يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)\n4. يوضح وظيفة كل جزء من أجزاء الزهرة\n\nمخرج تعليمي آخر:\nيميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة\nيصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية\n\nالحصة 2: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. يفصل أجزاء الزهرة بعناية ويعدّها\n2. يرسم السداة والكربلة ويسمي أجزاءهما\n\nمخرج تعليمي آخر: يقارن بين أعداد أجزاء زهرتين مختلفتين\n\nالحصة 3: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة\n2. يضع تنبؤات اعتمادًا على النمط المكتشف\n\nمخرج تعليمي آخر: يقرر ما إذا كانت البيانات كافية للتوصل إلى استنتاج عام\n\nالحصة 4: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n1. يجيب عن أسئلة أجزاء الزهرة ووظائفها\n2. يخطط لاستقصاء لمعرفة لون بتلات الأزهار الأكثر شيوعًا\n\nمخرج تعليمي آخر: يفسر سبب امتلاك بعض الأزهار رائحة كريهة ولونًا داكنًا", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nالمخرج 1 (يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها): فهم\nالمخرج 2 (يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها): تطبيق\nالمخرج 3 (يسمي أجزاء الزهرة الرئيسية: -4أ ص67 و2-4ب ص69، أزهار صغيرة، أوراق جرائد، كتب ثقيلة\n\nالحصة 4: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nالكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nالبتلات، السبلات، الأسدية، الأجزاء الذكرية، الأجزاء الأنثوية.، السداة (عضو التذكير)، المتك، الخيط، الكربلة (عضو التأنيث)، الميسم، القلم، المبيض، البويضات، حبوب اللقاح.\n\nالحصة 2: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nالسداة، الكربلة، المتك، الخيط، الميسم، المبيض.\n\nالحصة 3: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nالنمط، التنبؤ، السبلات، البتلات، الأسدية.\n\nالحصة 4: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nالبتلات، الرائحة، الحشرات، الاستقصاء.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nينفذ المعلم عصفًا ذهنيًا سريعًا: يعرض زهرة كبيرة ويطلب من الطلاب تسمية أكبر عدد من أجزائها التي يعرفونها، ويكتبها على السبورة.\n\nالحصة 2: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nيعرض المعلم رسمًا لزهرة دون أسماء ويطلب من الطلاب تسمية الأجزاء بسرعة شفهيًا كمراجعة.\n\nالحصة 3: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nيكتب المعلم على السبورة: 4، 8، 12، … ويسأل عن العدد التالي، ثم يوضح أن النمط تغيّر منتظم في الأعداد يمكن أن نجده في الأزهار أيضًا.\n\nالحصة 4: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nيعرض المعلم صورة زهرة الجثة (الرافليسيا) ص35 ويقرأ وصفها: «تبدو رائحتها مثل اللحم المتعفن»، ويسأل: «لماذا تحتاج زهرة إلى رائحة كهذه؟».", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الزهرة وينفذ العصف الذهني، والطلبة يسمون ما يعرفونه من أجزاء (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعليمات الأمان: ينبّه المعلم إلى عدم قطف الأزهار دون إذن وتجنب النباتات الضارة كالدفلة، وغسل اليدين بعد العمل، والطلبة يستمعون ويلتزمون (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 4أ: يوزع المعلم الأزهار والعدسات ويوجه وفق خطوات ص34، والطلبة يحددون اللون، ويعدّون الأجزاء الملونة (البتلات) والخضراء (السبلات)، ويلاحظون الأجزاء الداخلية، ويعدّون السيقان الرفيعة (الأسدية) ويلمسون حوافها، ويلاحظون الساق الوسطى (الكربلة) (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • المشاركة: يطلب المعلم من كل مجموعة عرض أعدادها، والطلبة يقارنون الأعداد بين أنواع الأزهار (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • شرح الأجزاء: يشرح المعلم رسم ص34: السبلات تحمي البرعم، البتلات زاهية تجذب الحشرات، السداة (متك + خيط) والمتك ينتج حبوب اللقاح، الكربلة (ميسم يستقبل حبوب اللقاح + قلم + مبيض يحتوي على البويضات)، والطلبة يكتبون كل جزء ووظيفته في جدول (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • نموذج الزهرة: يوزع المعلم ورقة المصادر 2-4 ص45، والطلبة يقصون أجزاء الزهرة ويلصقونها في مكانها الصحيح ويسمونها (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. • لعبة التصنيف: يعرض المعلم بطاقات أسماء الأجزاء، ويصنفونها الطالب: ذكرية (المتك، الخيط) – أنثوية (الميسم، القلم، المبيض، البويضات) – أجزاء أخرى (البتلات، السبلات) (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. • الغلق: يطرح المعلم سؤالًا ختاميًا، والطلبة يسمّون عضو التذكير وعضو التأنيث (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الرسم للمراجعة، والطلبة يسمون الأجزاء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • نمذجة التشريح: يوضح المعلم كيفية سحب البتلات والسبلات بالملقط برفق، والطلبة يتابعون (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. 4ب: يتابع المجموعات وفق خطوات ص35، والطلبة يرسمون الزهرة ويسمون أجزاءها، ويعدّون البتلات والسبلات والأسدية، ويسحبون البتلات والسبلات، ويستخدمون العدسة لرؤية الأسدية والكرابل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • رسم السداة والكربلة: يتابع المعلم دقة الرسم، والطلبة يرسمون السداة والكربلة ويسمون أجزاءهما (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم: هل تتساوى أعداد الأجزاء في الأزهار المختلفة؟ والطلبة يقارنون بين أزهار المجموعات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 3: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم النمط العددي، والطلبة يكتشفون العدد التالي ويعرفون النمط (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • ورقة العمل 2-4أ: يوضح المعلم طريقة ضغط الزهرة بين أوراق الجرائد تحت كتب ثقيلة لمدة أسبوعين إلى أربعة أسابيع، والطلبة يضعون أزهارهم للضغط ويرسمونها قبل الضغط (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • ورقة العمل 2-4ب: يقدم المعلم ورقة العمل ص69 ويطلب البحث عن النمط في أعداد السبلات والبتلات والأسدية، والطلبة يحللون الجدول ويكتشفون أن أعداد البتلات والأسدية تساوي عدد السبلات أو مضاعفاته، ويتنبؤون بأجزاء زهرة لها ثماني سبلات (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • كفاية الأدلة: يسأل المعلم: هل تكفي هذه البيانات لنقول إن كل الأزهار هكذا؟ والطلبة يستنتجون أننا نحتاج أزهارًا أكثر لنتأكد (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يلخص المعلم مفهوم النمط والتنبؤ، والطلبة يذكرون النمط الذي اكتشفوه (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 4: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات — زمن الحصة 40 دقيقة\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون أنها تجذب حشرات معينة كالذباب (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • أسئلة ص35: يناقش المعلم السؤالين (1، 2)، والطلبة يسمون: المتك يصنع حبوب اللقاح، السبلات تحمي البرعم، المبيض يحتوي البويضات، البتلات تجذب الحشرات والطيور، والبتلات مصدر الرائحة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • التخطيط للاستقصاء (س3): يوجه المجموعات لتخطيط استقصاء: ماذا نعدّ؟ أين؟ كيف نسجل؟ كم مرة نكرر؟ والطلبة يكتبون خطة: عدّ أزهار كل لون في عدة حدائق، تسجيل في جدول، تمثيل بالأعمدة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تمرين 2-4: يقدم المعلم تمرين 2-4 بكتاب النشاط ص26، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. (مستوى المعرفة) ما لون السبلات غالبًا؟\n   الإجابة النموذجية: أخضر.\n2. (مستوى التطبيق) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الزهرة (مع العدّ الصحيح).\n3. (مستوى الاستدلال) ما المسحوق الأصفر الذي ظهر على أصابعك بعد لمس حواف السيقان الرفيعة؟ ومن أي جزء أتى؟\n   الإجابة النموذجية: حبوب اللقاح، من المتك (رأس السداة) وهو جزء ذكري.\n\n4. (مستوى المعرفة) ما الجزء الذي يصنع حبوب اللقاح؟\n   الإجابة النموذجية: المتك.\n5. (مستوى التطبيق) ما وظيفة السبلات؟\n   الإجابة النموذجية: حماية برعم الزهرة.\n6. (مستوى الاستدلال) صنّف: الميسم، المتك، المبيض، الخيط إلى ذكرية وأنثوية.\n   الإجابة النموذجية: ذكرية: المتك، الخيط. أنثوية: الميسم، المبيض.\n\nالحصة 2: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. (مستوى المعرفة) ما الأداة التي استخدمناها لسحب البتلات؟\n   الإجابة النموذجية: الملقط.\n2. (مستوى التطبيق) سمِّ جزأي السداة.\n   الإجابة النموذجية: المتك والخيط.\n3. (مستوى الاستدلال) قارن بين عدد البتلات في زهرتك وزهرة مجموعة أخرى.\n   الإجابة النموذجية: تقبل الإجابة الصحيحة حسب الأزهار مع ذكر الفرق.\n\nالحصة 3: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. (مستوى المعرفة) ما المقصود بالنمط؟\n   الإجابة النموذجية: تغير منتظم في الأعداد أو بيانات تتكرر بطريقة يمكن توقعها.\n2. (مستوى التطبيق) زهرة لها خمس سبلات، كم عدد بتلاتها المتوقع؟\n   الإجابة النموذجية: خمس بتلات غالبًا.\n3. (مستوى الاستدلال) هل تكفي بيانات أربع أزهار لتعميم النمط على كل الأزهار؟ لماذا؟\n   الإجابة النموذجية: لا؛ نحتاج إلى فحص أزهار كثيرة مختلفة لأن بعض الأزهار قد لا تتبع النمط.\n\nالحصة 4: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n1. (مستوى المعرفة) ما جزء الزهرة الذي يحتوي على البويضات؟\n   الإجابة النموذجية: المبيض.\n2. (مستوى التطبيق) ما جزء الزهرة الذي يجذب الحشرات والطيور؟\n   الإجابة النموذجية: البتلات الزاهية (ورائحتها).\n3. (مستوى الاستدلال) لماذا تمتلك بعض الأزهار لونًا بنيًا داكنًا ورائحة كريهة؟\n   الإجابة النموذجية: لتجذب حشرات معينة كالذباب الذي يتغذى على اللحوم المتعفنة فيلقحها.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. (مستوى المعرفة) صح أم خطأ: البتلات هي الأجزاء الملونة في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر جزأين لاحظتهما داخل الزهرة.\n   الإجابة النموذجية: الأسدية (السيقان الرفيعة) والكربلة (الساق الوسطى).\n3. (مستوى الاستدلال) لماذا تكون الساق الوسطى في الزهرة مختلفة عن الأسدية؟\n   الإجابة النموذجية: لأنها الجزء الأنثوي (الكربلة)، بينما الأسدية أجزاء ذكرية.\n\n4. (مستوى المعرفة) أكمل: تتكون السداة من …… و……\n   الإجابة النموذجية: المتك والخيط.\n5. (مستوى التطبيق) ما وظيفة الميسم؟\n   الإجابة النموذجية: استقبال حبوب اللقاح في عملية التلقيح.\n6. (مستوى الاستدلال) لماذا تكون بتلات بعض الأزهار زاهية الألوان؟\n   الإجابة النموذجية: لتجذب الحشرات إلى الزهرة.\n\nالحصة 2: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. (مستوى المعرفة) صح أم خطأ: الكربلة هي عضو التأنيث في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) سمِّ ثلاثة أجزاء للكربلة.\n   الإجابة النموذجية: الميسم والقلم والمبيض.\n3. (مستوى الاستدلال) لماذا نستخدم العدسة المكبرة عند فحص الأسدية والكرابل؟\n   الإجابة النموذجية: لأنها أجزاء صغيرة يصعب رؤية تفاصيلها بالعين المجردة.\n\nالحصة 3: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. (مستوى المعرفة) صح أم خطأ: نضغط الزهرة لتجف وتحافظ على شكلها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ بعدد بتلات وأسدية زهرة لها ثماني سبلات.\n   الإجابة النموذجية: ثماني بتلات وثماني أسدية على الأرجح.\n3. (مستوى الاستدلال) كيف تتحقق من صحة النمط الذي اكتشفته؟\n   الإجابة النموذجية: بفحص أزهار كثيرة مختلفة وعدّ أجزائها ومقارنتها بالنمط.\n\nالحصة 4: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n1. (مستوى المعرفة) سمِّ جزء الزهرة الذي يحمي البرعم.\n   الإجابة النموذجية: السبلات.\n2. (مستوى التطبيق) اذكر خطوتين في خطة استقصاء اللون الأكثر شيوعًا لبتلات الأزهار.\n   الإجابة النموذجية: عدّ أزهار كل لون في أماكن مختلفة، تسجيل الأعداد في جدول وتمثيلها بالأعمدة.\n3. (مستوى الاستدلال) لماذا يجب تكرار العدّ في أكثر من حديقة؟\n   الإجابة النموذجية: لأن حديقة واحدة قد لا تمثل جميع الأزهار، والتكرار يجعل الاستنتاج أكثر موثوقية.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nللطالب: قراءة كتاب الطالب ص34، ورسم الزهرة التي فحصها. لولي الأمر: مساعدة الابن في ملاحظة زهرة في المنزل وعدّ بتلاتها وسبلاتها.\nللطالب: مراجعة رسم أجزاء الزهرة ص34 وحفظ أسماء ا وعملية التلقيح في الطبيعة): تحليل\nالمخرج الآخر (يستنتج من الآية الكريمة دور النحل في التلقيح وإنتاج العسل): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة أو مقطع لتلقيح النخيل، نموذج زهرة، أخرى: أزهار زاهية، عدسة مكبرة", "التلقيح، حبوب اللقاح، السداة، الميسم.، الرحيق، الحشرات، حبوب اللقاح.", "يسأل المعلم: «هل شاهدت مزارعًا يصعد النخلة في موسم معين ويضع فيها شيئًا؟ ماذا يفعل؟»، ثم يعرض مقطعًا قصيرًا لعملية «التنبيت» (تلقيح النخيل) في عُمان.", "1. • التهيئة: يطرح المعلم السؤال ويعرض المقطع، والطلبة يصفون ما يفعله المزارع (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعريف التلقيح: يقرأ المعلم مع الطلاب ص36 ويوضح: التلقيح نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه، والطلبة يكتبون التعريف ويحددون على نموذج الزهرة مسار حبوب اللقاح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • نمذجة المسار: يرسم المعلم زهرتين على السبورة ويرسم سهمًا من متك الأولى إلى ميسم الثانية، والطلبة يرسمون المخطط ويسمّون الجزء المرسل والجزء المستقبل (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • الربط بالنخيل: يوضح المعلم أن المزارع ينقل حبوب اللقاح من النخلة الذكر (الفحل) إلى أزهار النخلة الأنثى، والطلبة يناقشون: لماذا يحتاج المزارع لفعل ذلك؟ (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • التلقيح بالحشرات: يشرح المعلم ص36: تتغذى الحشرات على الرحيق (سائل حلو المذاق)، فتعلق بها حبوب اللقاح وتنقلها إلى ميسم زهرة أخرى، والطلبة يرسمون مخطط تسلسل لرحلة النحلة بين زهرتين (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • صفات الأزهار: يعرض المعلم صورًا لأزهار تلقحها الحشرات، والطلبة يستنتجون الصفات: بتلات زاهية الألوان، رائحة، رحيق (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. • تأمل الآية: يناقش المعلم معنى الآية: النحل يأكل من الثمرات ويخرج العسل الذي فيه شفاء، والطلبة يربطون بين تغذي النحل على الرحيق وإنتاج العسل وتلقيح الأزهار (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. • الغلق: يسأل المعلم: لماذا تحتاج الزهرة إلى ألوان ورائحة؟ والطلبة يجيبون: لجذب الحشرات (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما التلقيح؟\n   الإجابة النموذجية: نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) إلى أي جزء من الزهرة تنتقل حبوب اللقاح؟\n   الإجابة النموذجية: إلى الميسم.\n3. (مستوى الاستدلال) لماذا يلقح المزارعون النخيل يدويًا؟\n   الإجابة النموذجية: لضمان وصول حبوب اللقاح من الفحل إلى أزهار النخلة الأنثى فتتكون الثمار.\n\n4. (مستوى المعرفة) ما الرحيق؟\n   الإجابة النموذجية: سائل حلو المذاق تصنعه الأزهار وتتغذى عليه الحشرات.\n5. (مستوى التطبيق) اذكر صفتين لأزهار تلقحها الحشرات.\n   الإجابة النموذجية: بتلات زاهية الألوان، رائحة، رحيق (أي اثنتين).\n6. (مستوى الاستدلال) كيف تنتقل حبوب اللقاح من زهرة إلى أخرى بواسطة النحلة؟\n   الإجابة النموذجية: تعلق حبوب اللقاح بجسم النحلة أثناء تغذيها على الرحيق، ثم تسقط على ميسم الزهرة التالية التي تزورها.", "1. (مستوى المعرفة) أكمل: تنتقل حبوب اللقاح في التلقيح من …… إلى ……\n   الإجابة النموذجية: السداة (المتك)؛ ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) هل يمكن تلقيح زهرة طماطم بحبوب لقاح من زهرة ورد؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن التلقيح يكون بين أزهار من النوع نفسه.\n3. (مستوى الاستدلال) اقترح ما يحدث لمحصول التمر إذا لم يتم تلقيح النخيل.\n   الإجابة النموذجية: يقل المحصول كثيرًا أو لا تتكون الثمار جيدًا.\n\n4. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الحشرات تكون زاهية الألوان غالبًا.\n   الإجابة النموذجية: صح.\n5. (مستوى التطبيق) لماذا تزور الحشرات الأزهار؟\n   الإجابة النموذجية: لتتغذى على الرحيق.\n6. (مستوى الاستدلال) ماذا يحدث للأزهار لو قلّت أعداد النحل في منطقة ما؟\n   الإجابة النموذجية: يقل تلقيح الأزهار فتقل الثمار والبذور.", "للطالب: قراءة كتاب الطالب ص36، وسؤال أحد كبار العائلة عن طريقة تلقيح النخيل. لولي الأمر: التحدث مع الابن عن تلقيح النخيل وموسمه في عُمان.\nللطالب: حفظ الآيتين 68–69 من سورة النحل، وملاحظة حشرات تزور الأزهار في الحديقة. لولي الأمر: مناقشة الابن في فوائد النحل للإنسان والنبات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}, {"n": 2, "topic": "التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟", "f": ["1. يصف صفات الأزهار التي تلقحها الرياح\n2. يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها\n\nمخرج تعليمي آخر: يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح", "المخرج 1 (يصف صفات الأزهار التي تلقحها الرياح): فهم\nالمخرج 2 (يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها): تطبيق\nالمخرج الآخر (يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: أزهار عشبية وأزهار زاهية من فناء المدرسة، عدسات مكبرة، ورق", "التلقيح بالرياح، حبوب اللقاح.", "يعرض المعلم صورة الزهرة العشبية ص36 والرياح تنثر منها سحابة من حبوب اللقاح، ويسأل: «هذه الزهرة ليست ملونة ولا رائحة لها، فكيف تُلقّح؟».", "1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون الرياح (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • صفات أزهار الرياح: يشرح المعلم ص36: غير زاهية، لا بتلات أو رائحة، تنتج كثيرًا من حبوب اللقاح الخفيفة، والطلبة يكتبون الصفات ويقارنونها بأزهار الحشرات (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 5: يصطحب الطلاب إلى فناء المدرسة ويوجههم وفق ص36، والطلبة ينظرون إلى الأزهار المختلفة، ويرسمون صورًا لها ويسمون أجزاءها، ويحددون كيف يتم تلقيح كل زهرة ولماذا (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • جدول مقارنة: يرسم المعلم جدولًا للمقارنة، والطلبة يكملون: الحشرات (زاهية، رائحة، رحيق) – الرياح (غير زاهية، بلا رائحة، حبوب لقاح كثيرة) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يحددون نوع تلقيح زهرة معروضة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) اذكر صفة لزهرة تلقحها الرياح.\n   الإجابة النموذجية: غير زاهية أو بلا رائحة أو تنتج كثيرًا من حبوب اللقاح.\n2. (مستوى التطبيق) زهرة صغيرة خضراء بلا رائحة، كيف تلقح غالبًا؟\n   الإجابة النموذجية: بواسطة الرياح.\n3. (مستوى الاستدلال) لماذا تنتج الأزهار التي تلقحها الرياح كثيرًا من حبوب اللقاح؟\n   الإجابة النموذجية: لأن معظم حبوب اللقاح تضيع في الهواء، فتزيد الكثرة فرصة وصول بعضها إلى ميسم زهرة من النوع نفسه.", "1. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الرياح لها رحيق كثير.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) قارن بين زهرة تلقحها الحشرات وزهرة تلقحها الرياح من حيث اللون والرائحة.\n   الإجابة النموذجية: الحشرات: زاهية الألوان ذات رائحة. الرياح: غير زاهية بلا رائحة.\n3. (مستوى الاستدلال) لماذا لا تحتاج الأزهار التي تلقحها الرياح إلى بتلات زاهية؟\n   الإجابة النموذجية: لأنها لا تحتاج إلى جذب الحشرات؛ فالرياح تنقل حبوب لقاحها.", "للطالب: إكمال رسومات نشاط 2-5 وتسمية الأجزاء. لولي الأمر: ملاحظة أزهار في الحي مع الابن وتحديد نوع تلقيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}, {"n": 3, "topic": "الإخصاب وتكوين الثمار والبذور", "f": ["1. يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض\n2. يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور\n\nمخرج تعليمي آخر: يميز بين التلقيح والإخصاب", "المخرج 1 (يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض): فهم\nالمخرج 2 (يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور): فهم\nالمخرج الآخر (يميز بين التلقيح والإخصاب): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية، أخرى: صور مراحل تكون ثمرة الطماطم", "الإخصاب، المبيض، البويضات، الثمرة، البذور.", "يعرض المعلم الصور الثلاث لنبات الطماطم ص37 (زهرة ← ثمرة صغيرة ← ثمرة ناضجة) ويسأل: «بعد التلقيح، ماذا يحدث داخل الزهرة حتى تظهر هذه الثمرة؟».", "1. • التهيئة: يعرض المعلم الصور ويطرح السؤال، والطلبة يتوقعون أن الزهرة تتحول إلى ثمرة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • الإخصاب: يشرح المعلم ص37: تنتقل حبوب اللقاح من الميسم إلى المبيض، وتتحد مع البويضات (الإخصاب)، والطلبة يحددون موقع الإخصاب على رسم الزهرة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • من المبيض إلى الثمرة: يوضح المعلم: بعد الإخصاب تموت البتلات والأسدية، وينمو المبيض ليكوّن الثمرة، وتتحول البويضات المخصبة إلى بذور، والطلبة يرتبون بطاقات: تلقيح ← إخصاب ← ذبول البتلات ← نمو المبيض ← ثمرة بها بذور (10 دقائق)\n
