متنوعة جمعها الطلاب، عدسات مكبرة، قرون فول جافة\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالكتاب، السبورة الذكية، الأقلام، أخرى: ورق مقوى، مقص، مشابك ورق، ساعة إيقاف، شريط متري\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات صور بذور وثمار", "الحصة 1: انتشار البذور بواسطة الرياح\nانتشار البذور، الرياح، خفة الوزن.\n\nالحصة 2: انتشار البذور بواسطة الماء\nإسفنجي، الطفو، انتشار البذور.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nتنفجر، تتشقق، انتشار البذور.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nالاختبار العادل، القياس المتكرر، انتشار البذور.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nانتشار البذور، إسفنجي، تنفجر/تتشقق.", "الحصة 1: انتشار البذور بواسطة الرياح\nينفخ المعلم (أو يعرض مقطعًا لطفلة تنفخ) بذور نبات الهندباء كما في ص32، ويسأل: «لماذا طارت هذه البذور بعيدًا بنفخة واحدة؟».\n\nالحصة 2: انتشار البذور بواسطة الماء\nيضع المعلم ثمرة جوز هند (أو قطعة فلين) وحجرًا صغيرًا في حوض ماء ويسأل: «لماذا طفت الثمرة وغاص الحجر؟ وكيف يفيد ذلك النبات؟».\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nيعرض المعلم مقطعًا قصيرًا لقرون تنفجر وتقذف بذورها، ويسأل: «هل تحتاج كل النباتات إلى حيوان أو رياح أو ماء لنشر بذورها؟».\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nيطرح المعلم تحديًا: «أنت مهندس نباتات! صمم بذرة تبقى في الهواء أطول مدة لتحملها الرياح بعيدًا»، ويعرض ورقة المصادر 2-3 ص43 للإلهام.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nينفذ المعلم لعبة «أين أذهب؟»: يرفع صورة بذرة، وتتسابق المجموعات في رفع بطاقة طريقة انتشارها (حيوان/رياح/ماء/انفجار).", "الحصة 1: انتشار البذور بواسطة الرياح — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة أو المقطع ويطرح السؤال، والطلبة يقترحون أن البذور خفيفة ولها شعيرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • صور الكتاب ص32: يناقش المعلم أربعة أمثلة: الهندباء (مظلة من الشعر)، الثريا (ثمار تجف وتسقط)، الخشخاش (وعاء مسامي تهزه الرياح)، القيقب (أجنحة كالمروحة)، والطلبة يصفون كيف تساعد صفة كل بذرة على الانتشار بالرياح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • تجربة الطيران: يوزع المعلم نموذجين: كرة ورقية صغيرة ونموذج «بذرة مجنحة» بالوزن نفسه، ويسقطهما أمام المروحة، والطلبة يلاحظون أن النموذج المجنح يطير أبعد ويبقى في الهواء مدة أطول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • استنتاج الصفات: يكتب المعلم على السبورة: «البذور التي تنتشر بالرياح تكون…»، والطلبة يكملون: جافة، خفيفة، لها أجنحة أو شعيرات (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. • الغلق: يعرض المعلم صورًا لبذور ويطلب تحديد التي تنتشر بالرياح، والطلبة يحددون ويعللون (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 2: انتشار البذور بواسطة الماء — زمن الحصة 40 دقيقة\n\n1. • التهيئة: ينفذ المعلم العرض ويطرح السؤال، والطلبة يتوقعون أن الثمرة خفيفة أو فيها هواء (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. • الانتشار بالماء: يشرح المعلم من ص32: الطبقة الإسفنجية في جوز الهند مملوءة بالهواء تساعده على الطفو، وأشجار المانجروف تسقط «أقلام البحر» التي تطفو حتى تصل إلى اليابسة، والطلبة يعرفون مفهوم «إسفنجي» ويرسمون مقطعًا لجوز الهند (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • اختبار الطفو: يوزع المعلم على المجموعات بذورًا وثمارًا مختلفة وحوض ماء، والطلبة يتنبؤون بما يطفو، ثم يختبرون ويسجلون النتائج في جدول (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • المناقشة: يسأل المعلم: أي البذور يمكن أن تنتشر بالماء؟ ولماذا تنمو بعض الأشجار قرب الشواطئ والأودية؟ والطلبة يستنتجون أن البذور الطافية تنتقل مع الماء بعيدًا (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يربط المعلم الدرس بالسؤال (1) ص33 عن زنبق الماء، والطلبة يجيبون شفهيًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم المقطع ويطرح السؤال، والطلبة يصفون ما شاهدوه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • الانفجار والتشقق: يشرح المعلم من ص33: تجف قرون الفول في الطقس الحار فتنفجر وتقذف بذورها، والطلبة يفحصون قرنًا جافًا ويحددون خط التشقق (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. 3: يوجه المجموعات وفق ص33، والطلبة يجمعون خمسة أنواع على الأقل من البذور، ويلاحظونها بالعدسة، ويحاولون معرفة نباتاتها، ويرسمونها ويسمونها، ويصنفونها حسب طريقة انتشارها المحتملة (18 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. • عرض التصنيف: يطلب المعلم من كل مجموعة تبرير تصنيفها، والطلبة يعرضون: أشواك ← حيوانات، أجنحة ← رياح، طبقة إسفنجية ← ماء، قرون ← انفجار (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يذكرون أربع طرق لانتشار البذور (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم التحدي ويعرض ورقة المصادر، والطلبة يقترحون أشكالًا (أجنحة، مظلة) (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • التخطيط: يقدم المعلم ورقة العمل 2-3 ص65 ويناقش: ما الذي نقيسه؟ ما الذي نثبته؟ والطلبة يحددون: نقيس زمن السقوط، ونثبت الارتفاع والوزن (مشبك واحد) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • التصميم والتصنيع: يتابع المجموعات، والطلبة يصنعون نموذجين مختلفين أو أكثر (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • الاختبار والتكرار: يحدد المعلم ارتفاع الإسقاط نفسه لجميع المجموعات، ويؤكد تكرار القياس ثلاث مرات، والطلبة يسقطون النماذج ويقيسون الزمن بساعة الإيقاف ثلاث مرات ويسجلون (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • التقييم: يسأل المعلم: أي تصميم بقي في الهواء أطول؟ كيف تحسنه؟ والطلبة يقارنون النتائج ويقترحون تحسينات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس — زمن الحصة 40 دقيقة\n\n1. • التهيئة: ينفذ المعلم اللعبة، والطلبة يرفعون البطاقات المناسبة (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. • جدول مقارنة: يرسم المعلم جدولًا: الطريقة – صفات البذرة – مثال، والطلبة يكملون الجدول تعاونيًا (13 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. • أسئلة ص33: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن زنبق الماء وقرون الفول والريحان (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • تمرين 2-3: يقدم المعلم تمرين 2-3 بكتاب النشاط ص25، والطلبة يحلون التمرين فرديًا ثم يصححون مع زملائهم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: انتشار البذور بواسطة الرياح\n1. (مستوى المعرفة) اذكر نباتًا تنتشر بذوره بالرياح.\n   الإجابة النموذجية: الهندباء أو القيقب أو الخشخاش أو الثريا.\n2. (مستوى التطبيق) ما صفات البذور التي تنتشر بالرياح؟\n   الإجابة النموذجية: جافة خفيفة الوزن، ولها أجنحة أو شعيرات.\n3. (مستوى الاستدلال) لماذا بقي النموذج المجنح في الهواء مدة أطول من الكرة الورقية؟\n   الإجابة النموذجية: لأن الأجنحة تقاوم الهواء وتجعله يدور ويسقط ببطء فتحمله الرياح بعيدًا.\n\nالحصة 2: انتشار البذور بواسطة الماء\n1. (مستوى المعرفة) ما الثمرة التي تنتشر بذرتها بالماء في الكتاب؟\n   الإجابة النموذجية: جوز الهند (وأقلام بحر المانجروف).\n2. (مستوى التطبيق) ما المقصود بالطبقة الإسفنجية؟\n   الإجابة النموذجية: طبقة بها مسام كثيرة مملوءة بالهواء تساعد على الطفو.\n3. (مستوى الاستدلال) أي البذور التي اختبرتها يمكن أن تنتشر بالماء؟ لماذا؟\n   الإجابة النموذجية: البذور التي طفت؛ لأنها تستطيع أن تنتقل مع تيار الماء.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\n1. (مستوى المعرفة) ماذا يحدث لقرون الفول في الطقس الحار الجاف؟\n   الإجابة النموذجية: تجف وتنفجر (تتشقق) فتنطلق البذور خارجها.\n2. (مستوى التطبيق) بذرة لها جناحان، كيف صنفتها؟\n   الإجابة النموذجية: ضمن البذور التي تنتشر بالرياح.\n3. (مستوى الاستدلال) كيف تساعد صفة البذرة على تحديد طريقة انتشارها؟\n   الإجابة النموذجية: الصفة تدل على الطريقة: الأشواك للتعلق بالحيوانات، والأجنحة للرياح، والطبقة الإسفنجية للماء.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\n1. (مستوى المعرفة) ما الذي قسناه في هذا النشاط؟\n   الإجابة النموذجية: الزمن الذي يستغرقه النموذج حتى يصل إلى الأرض.\n2. (مستوى التطبيق) ما العوامل التي ثبتناها ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: ارتفاع الإسقاط، ووزن النموذج (عدد المشابك)، ومكان الإسقاط.\n3. (مستوى الاستدلال) لماذا كررنا القياس ثلاث مرات؟\n   الإجابة النموذجية: لأن القياس الواحد قد يكون خاطئًا، والتكرار يعطي نتائج أكثر دقة وموثوقية.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\n1. (مستوى المعرفة) اذكر أربع طرق لانتشار البذور.\n   الإجابة النموذجية: الحيوانات، الرياح، الماء، الانفجار (التشقق).\n2. (مستوى التطبيق) قارن بين بذرة تنتشر بالرياح وبذرة تنتشر بالماء من حيث الصفات.\n   الإجابة النموذجية: التي تنتشر بالرياح خفيفة جافة لها أجنحة أو شعيرات، والتي تنتشر بالماء لها طبقة إسفنجية تساعدها على الطفو.\n3. (مستوى الاستدلال) أي طرق الانتشار تنقل البذور لأبعد مسافة في رأيك؟ برر.\n   الإجابة النموذجية: تقبل الإجابات المبررة، مثل: الماء لأنه قد يحمل البذور عبر البحار مسافات طويلة.", "الحصة 1: انتشار البذور بواسطة الرياح\n1. (مستوى المعرفة) صح أم خطأ: البذور الثقيلة الرطبة تنتشر بسهولة بالرياح.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) كيف تساعد الرياح بذور الخشخاش على الانتشار؟\n   الإجابة النموذجية: تهز الرياح الثمرة فتخرج البذور من فتحات الوعاء المسامي وتنتشر بعيدًا.\n3. (مستوى الاستدلال) بذرة خفيفة لها شعيرات تشبه المظلة، تنبأ بطريقة انتشارها وفسّر.\n   الإجابة النموذجية: بالرياح؛ لأن الشعيرات تجعلها تطفو في الهواء وتحملها الرياح بعيدًا.\n\nالحصة 2: انتشار البذور بواسطة الماء\n1. (مستوى المعرفة) أكمل: تحتوي ثمرة جوز الهند على طبقة …… تساعدها على الطفو.\n   الإجابة النموذجية: إسفنجية.\n2. (مستوى التطبيق) كيف يساعد غلاف البذرة الإسفنجي زنبق الماء في نشر بذوره؟\n   الإجابة النموذجية: يجعلها تطفو على سطح الماء فتنتقل بعيدًا عن النبات الأصلي.\n3. (مستوى الاستدلال) لماذا تنتشر أشجار المانجروف على طول الشواطئ؟\n   الإجابة النموذجية: لأن بذورها (أقلام البحر) تطفو في الماء المالح حتى يلقيها البحر على اليابسة فتنمو هناك.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\n1. (مستوى المعرفة) صح أم خطأ: يمكن لبعض الثمار نشر بذورها بنفسها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا يقطف المزارعون قرون الفول قبل أن يشتد الحر؟\n   الإجابة النموذجية: لأن القرون تجف وتنفجر في الحر فتتناثر البذور وتضيع.\n3. (مستوى الاستدلال) اقترح تفسيرًا لطريقة انتشار بذور الريحان مع التعليل.\n   الإجابة النموذجية: تقبل الإجابات المنطقية المعللة، مثل: تسقط بذوره الصغيرة الخفيفة من الثمار الجافة وتحملها الرياح أو تلتصق برطوبة أجسام الحيوانات.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\n1. (مستوى المعرفة) ما الأداة التي قسنا بها زمن السقوط؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (مستوى التطبيق) أي التصميمين أفضل: الذي سقط في 2 ثانية أم في 4 ثوانٍ؟ ولماذا؟\n   الإجابة النموذجية: الذي سقط في 4 ثوانٍ؛ لأنه بقي في الهواء مدة أطول فتحمله الرياح أبعد.\n3. (مستوى الاستدلال) اقترح تعديلًا يجعل نموذجك يبقى في الهواء مدة أطول، وفسّر.\n   الإجابة النموذجية: زيادة مساحة الأجنحة أو تخفيف الوزن؛ لأن ذلك يزيد مقاومة الهواء ويبطئ السقوط.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\n1. (مستوى المعرفة) صل: أشواك ← …… ، أجنحة ← …… ، طبقة إسفنجية ← ……\n   الإجابة النموذجية: حيوانات؛ رياح؛ ماء.\n2. (مستوى التطبيق) لماذا تحتاج النباتات إلى طرق مختلفة لنشر بذورها؟\n   الإجابة النموذجية: لأنها تعيش في بيئات مختلفة، وكل طريقة تناسب بيئة النبات وشكل بذوره.\n3. (مستوى الاستدلال) ما الطريقة التي تساعد البذور على الانتشار لأبعد مسافة عن النبات الأصلي؟ فسّر.\n   الإجابة النموذجية: تقبل الإجابة المبررة: الرياح أو الماء أو الطيور، مع التعليل.", "الحصة 1: انتشار البذور بواسطة الرياح\nللطالب: قراءة كتاب الطالب ص32 (الانتشار بالرياح)، وملاحظة نباتات في البيئة تنتشر بذورها بالرياح. لولي الأمر: مشاهدة مقطع مع الابن عن انتشار البذور بالرياح ومناقشته.\n\nالحصة 2: انتشار البذور بواسطة الماء\nللطالب: قراءة كتاب الطالب ص32 (الانتشار بالماء)، ورسم ثمرة جوز الهند مبينًا الطبقة الإسفنجية. لولي الأمر: تجربة طفو بذور مختلفة في وعاء ماء بالمنزل مع الابن.\n\nالحصة 3: الانتشار بالانفجار ونشاط 2-3: كيف يتم نشر البذور؟\nللطالب: الاحتفاظ بالبذور المصنفة، وقراءة ورقة المصادر 2-3 (طرق انتشار البذور) ص43 بكتاب النشاط. لولي الأمر: تجهيز ورق مقوى ومقص ومشبك ورق للابن لتصميم نموذج بذرة في الحصة القادمة.\n\nالحصة 4: ورقة العمل 2-3: صمم بذرة تنشرها الرياح\nللطالب: إكمال ورقة العمل 2-3 ص65 وكتابة تقرير قصير عن أفضل تصميم. لولي الأمر: مشاركة الابن في تحسين نموذجه بالمنزل واختباره من ارتفاع ثابت.\n\nالحصة 5: مراجعة طرق انتشار البذور وأسئلة الدرس\nللطالب: حل تمرين 2-3 بكتاب النشاط ص25 إن لم يكتمل، ومراجعة طرق انتشار البذور. لولي الأمر: إحضار زهرة كبيرة (مثل الكركديه أو الزنبق) مع الابن لدرس أجزاء الزهرة، مع التأكد من أنها ليست سامة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=9"]}, {"code": "2-4", "title": "أجزاء الزهرة", "unit": 2, "dates": "الأسبوع السادس (11–15/10/2026م)", "sb": "34–35", "tb": "45–47", "ab": "تمرين 2-4 ص26، ورقة المصادر 2-4 ص45، ورقتا العمل 2-4أ ص67 و2-4ب ص69", "periods": [{"n": 1, "topic": "نشاط 2-4أ: استقصاء أجزاء الزهرة", "f": ["1. يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها\n2. يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها\nمخرج تعليمي آخر: يميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة", "المخرج 1 (يلاحظ أجزاء الزهرة الخارجية والداخلية ويصفها): فهم\nالمخرج 2 (يعدّ البتلات والسبلات والأسدية في زهرة ويسجلها): تطبيق\nالمخرج الآخر (يميز الأجزاء الذكرية من الأجزاء الأنثوية في الزهرة): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: أزهار حقيقية كبيرة (كالكركديه أو الرمان)، عدسات مكبرة", "البتلات، السبلات، الأسدية، الأجزاء الذكرية، الأجزاء الأنثوية.", "ينفذ المعلم عصفًا ذهنيًا سريعًا: يعرض زهرة كبيرة ويطلب من الطلاب تسمية أكبر عدد من أجزائها التي يعرفونها، ويكتبها على السبورة.", "1. • التهيئة: يعرض المعلم الزهرة وينفذ العصف الذهني، والطلبة يسمون ما يعرفونه من أجزاء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعليمات الأمان: ينبّه المعلم إلى عدم قطف الأزهار دون إذن وتجنب النباتات الضارة كالدفلة، وغسل اليدين بعد العمل، والطلبة يستمعون ويلتزمون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 4أ: يوزع المعلم الأزهار والعدسات ويوجه وفق خطوات ص34، والطلبة يحددون اللون، ويعدّون الأجزاء الملونة (البتلات) والخضراء (السبلات)، ويلاحظون الأجزاء الداخلية، ويعدّون السيقان الرفيعة (الأسدية) ويلمسون حوافها، ويلاحظون الساق الوسطى (الكربلة) (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • المشاركة: يطلب المعلم من كل مجموعة عرض أعدادها، والطلبة يقارنون الأعداد بين أنواع الأزهار (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم: ماذا لاحظتم على أصابعكم بعد لمس الحواف الصفراء؟ والطلبة يذكرون مسحوقًا أصفر (حبوب اللقاح) (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما لون السبلات غالبًا؟\n   الإجابة النموذجية: أخضر.\n2. (مستوى التطبيق) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الزهرة (مع العدّ الصحيح).\n3. (مستوى الاستدلال) ما المسحوق الأصفر الذي ظهر على أصابعك بعد لمس حواف السيقان الرفيعة؟ ومن أي جزء أتى؟\n   الإجابة النموذجية: حبوب اللقاح، من المتك (رأس السداة) وهو جزء ذكري.", "1. (مستوى المعرفة) صح أم خطأ: البتلات هي الأجزاء الملونة في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر جزأين لاحظتهما داخل الزهرة.\n   الإجابة النموذجية: الأسدية (السيقان الرفيعة) والكربلة (الساق الوسطى).\n3. (مستوى الاستدلال) لماذا تكون الساق الوسطى في الزهرة مختلفة عن الأسدية؟\n   الإجابة النموذجية: لأنها الجزء الأنثوي (الكربلة)، بينما الأسدية أجزاء ذكرية.", "للطالب: قراءة كتاب الطالب ص34، ورسم الزهرة التي فحصها. لولي الأمر: مساعدة الابن في ملاحظة زهرة في المنزل وعدّ بتلاتها وسبلاتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}, {"n": 2, "topic": "أجزاء الزهرة ووظائفها", "f": ["1. يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)\n2. يوضح وظيفة كل جزء من أجزاء الزهرة\nمخرج تعليمي آخر: يصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية", "المخرج 1 (يسمي أجزاء الزهرة الرئيسية: السبلات، البتلات، السداة (متك وخيط)، الكربلة (ميسم وقلم ومبيض)): تذكر\nالمخرج 2 (يوضح وظيفة كل جزء من أجزاء الزهرة): فهم\nالمخرج الآخر (يصنف أجزاء الزهرة إلى أجزاء ذكرية وأجزاء أنثوية): تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، نماذج مجسمة، أخرى: ورقة المصادر 2-4 (نماذج أجزاء الزهرة) ص45، مقص، صمغ", "السبلات، البتلات، السداة (عضو التذكير)، المتك، الخيط، الكربلة (عضو التأنيث)، الميسم، القلم، المبيض، البويضات، حبوب اللقاح.", "يعرض المعلم نموذجًا مجسمًا (أو رسمًا مكبرًا) لزهرة ويسأل: «لكل جزء في الزهرة عمل. أي جزء في رأيك يصنع حبوب اللقاح؟ وأيها يحمي البرعم؟».", "1. • التهيئة: يعرض المعلم النموذج ويطرح السؤال، والطلبة يتوقعون (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • شرح الأجزاء: يشرح المعلم رسم ص34: السبلات تحمي البرعم، البتلات زاهية تجذب الحشرات، السداة (متك + خيط) والمتك ينتج حبوب اللقاح، الكربلة (ميسم يستقبل حبوب اللقاح + قلم + مبيض يحتوي على البويضات)، والطلبة يكتبون كل جزء ووظيفته في جدول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • نموذج الزهرة: يوزع المعلم ورقة المصادر 2-4 ص45، والطلبة يقصون أجزاء الزهرة ويلصقونها في مكانها الصحيح ويسمونها (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • لعبة التصنيف: يعرض المعلم بطاقات أسماء الأجزاء، ويصنفونها الطالب: ذكرية (المتك، الخيط) – أنثوية (الميسم، القلم، المبيض، البويضات) – أجزاء أخرى (البتلات، السبلات) (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يطرح المعلم سؤالًا ختاميًا، والطلبة يسمّون عضو التذكير وعضو التأنيث (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما الجزء الذي يصنع حبوب اللقاح؟\n   الإجابة النموذجية: المتك.\n2. (مستوى التطبيق) ما وظيفة السبلات؟\n   الإجابة النموذجية: حماية برعم الزهرة.\n3. (مستوى الاستدلال) صنّف: الميسم، المتك، المبيض، الخيط إلى ذكرية وأنثوية.\n   الإجابة النموذجية: ذكرية: المتك، الخيط. أنثوية: الميسم، المبيض.", "1. (مستوى المعرفة) أكمل: تتكون السداة من …… و……\n   الإجابة النموذجية: المتك والخيط.\n2. (مستوى التطبيق) ما وظيفة الميسم؟\n   الإجابة النموذجية: استقبال حبوب اللقاح في عملية التلقيح.\n3. (مستوى الاستدلال) لماذا تكون بتلات بعض الأزهار زاهية الألوان؟\n   الإجابة النموذجية: لتجذب الحشرات إلى الزهرة.", "للطالب: مراجعة رسم أجزاء الزهرة ص34 وحفظ أسماء الأجزاء ووظائفها. لولي الأمر: إحضار زهرة للحصة القادمة وملاقط صغيرة إن أمكن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}, {"n": 3, "topic": "نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها", "f": ["1. يفصل أجزاء الزهرة بعناية ويعدّها\n2. يرسم السداة والكربلة ويسمي أجزاءهما\nمخرج تعليمي آخر: يقارن بين أعداد أجزاء زهرتين مختلفتين", "المخرج 1 (يفصل أجزاء الزهرة بعناية ويعدّها): تطبيق\nالمخرج 2 (يرسم السداة والكربلة ويسمي أجزاءهما): تطبيق\nالمخرج الآخر (يقارن بين أعداد أجزاء زهرتين مختلفتين): تحليل", "التعلم بالاكتشاف، التعلم الذاتي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: أزهار، عدسات مكبرة، ملاقط صغيرة، ورق أبيض", "السداة، الكربلة، المتك، الخيط، الميسم، المبيض.", "يعرض المعلم رسمًا لزهرة دون أسماء ويطلب من الطلاب تسمية الأجزاء بسرعة شفهيًا كمراجعة.", "1. • التهيئة: يعرض المعلم الرسم للمراجعة، والطلبة يسمون الأجزاء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • نمذجة التشريح: يوضح المعلم كيفية سحب البتلات والسبلات بالملقط برفق، والطلبة يتابعون (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. 4ب: يتابع المجموعات وفق خطوات ص35، والطلبة يرسمون الزهرة ويسمون أجزاءها، ويعدّون البتلات والسبلات والأسدية، ويسحبون البتلات والسبلات، ويستخدمون العدسة لرؤية الأسدية والكرابل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • رسم السداة والكربلة: يتابع المعلم دقة الرسم، والطلبة يرسمون السداة والكربلة ويسمون أجزاءهما (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم: هل تتساوى أعداد الأجزاء في الأزهار المختلفة؟ والطلبة يقارنون بين أزهار المجموعات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "1. (مستوى المعرفة) ما الأداة التي استخدمناها لسحب البتلات؟\n   الإجابة النموذجية: الملقط.\n2. (مستوى التطبيق) سمِّ جزأي السداة.\n   الإجابة النموذجية: المتك والخيط.\n3. (مستوى الاستدلال) قارن بين عدد البتلات في زهرتك وزهرة مجموعة أخرى.\n   الإجابة النموذجية: تقبل الإجابة الصحيحة حسب الأزهار مع ذكر الفرق.", "1. (مستوى المعرفة) صح أم خطأ: الكربلة هي عضو التأنيث في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) سمِّ ثلاثة أجزاء للكربلة.\n   الإجابة النموذجية: الميسم والقلم والمبيض.\n3. (مستوى الاستدلال) لماذا نستخدم العدسة المكبرة عند فحص الأسدية والكرابل؟\n   الإجابة النموذجية: لأنها أجزاء صغيرة يصعب رؤية تفاصيلها بالعين المجردة.", "للطالب: إكمال رسم السداة والكربلة وتسمية الأجزاء. لولي الأمر: مساعدة الابن في اختيار زهرة صغيرة لضغطها وتجفيفها (ورقة العمل 2-4أ).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}, {"n": 4, "topic": "أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار", "f": ["1. يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة\n2. يضع تنبؤات اعتمادًا على النمط المكتشف\nمخرج تعليمي آخر: يقرر ما إذا كانت البيانات كافية للتوصل إلى استنتاج عام", "المخرج 1 (يتعرف الأنماط في أعداد أجزاء الأزهار المختلفة): تحليل\nالمخرج 2 (يضع تنبؤات اعتمادًا على النمط المكتشف): تطبيق\nالمخرج الآخر (يقرر ما إذا كانت البيانات كافية للتوصل إلى استنتاج عام): تقييم", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورقتا العمل 2-4أ ص67 و2-4ب ص69، أزهار صغيرة، أوراق جرائد، كتب ثقيلة", "النمط، التنبؤ، السبلات، البتلات، الأسدية.", "يكتب المعلم على السبورة: 4، 8، 12، … ويسأل عن العدد التالي، ثم يوضح أن النمط تغيّر منتظم في الأعداد يمكن أن نجده في الأزهار أيضًا.", "1. • التهيئة: يعرض المعلم النمط العددي، والطلبة يكتشفون العدد التالي ويعرفون النمط (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • ورقة العمل 2-4أ: يوضح المعلم طريقة ضغط الزهرة بين أوراق الجرائد تحت كتب ثقيلة لمدة أسبوعين إلى أربعة أسابيع، والطلبة يضعون أزهارهم للضغط ويرسمونها قبل الضغط (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • ورقة العمل 2-4ب: يقدم المعلم ورقة العمل ص69 ويطلب البحث عن النمط في أعداد السبلات والبتلات والأسدية، والطلبة يحللون الجدول ويكتشفون أن أعداد البتلات والأسدية تساوي عدد السبلات أو مضاعفاته، ويتنبؤون بأجزاء زهرة لها ثماني سبلات (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • كفاية الأدلة: يسأل المعلم: هل تكفي هذه البيانات لنقول إن كل الأزهار هكذا؟ والطلبة يستنتجون أننا نحتاج أزهارًا أكثر لنتأكد (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يلخص المعلم مفهوم النمط والتنبؤ، والطلبة يذكرون النمط الذي اكتشفوه (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما المقصود بالنمط؟\n   الإجابة النموذجية: تغير منتظم في الأعداد أو بيانات تتكرر بطريقة يمكن توقعها.\n2. (مستوى التطبيق) زهرة لها خمس سبلات، كم عدد بتلاتها المتوقع؟\n   الإجابة النموذجية: خمس بتلات غالبًا.\n3. (مستوى الاستدلال) هل تكفي بيانات أربع أزهار لتعميم النمط على كل الأزهار؟ لماذا؟\n   الإجابة النموذجية: لا؛ نحتاج إلى فحص أزهار كثيرة مختلفة لأن بعض الأزهار قد لا تتبع النمط.", "1. (مستوى المعرفة) صح أم خطأ: نضغط الزهرة لتجف وتحافظ على شكلها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ بعدد بتلات وأسدية زهرة لها ثماني سبلات.\n   الإجابة النموذجية: ثماني بتلات وثماني أسدية على الأرجح.\n3. (مستوى الاستدلال) كيف تتحقق من صحة النمط الذي اكتشفته؟\n   الإجابة النموذجية: بفحص أزهار كثيرة مختلفة وعدّ أجزائها ومقارنتها بالنمط.", "للطالب: متابعة الزهرة المضغوطة أسبوعيًا، وإكمال ورقة العمل 2-4ب ص69. لولي الأمر: التأكد من وضع الزهرة في مكان جاف تحت كتب ثقيلة دون تحريكها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}, {"n": 5, "topic": "أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات", "f": ["1. يجيب عن أسئلة أجزاء الزهرة ووظائفها\n2. يخطط لاستقصاء لمعرفة لون بتلات الأزهار الأكثر شيوعًا\nمخرج تعليمي آخر: يفسر سبب امتلاك بعض الأزهار رائحة كريهة ولونًا داكنًا", "المخرج 1 (يجيب عن أسئلة أجزاء الزهرة ووظائفها): تطبيق\nالمخرج 2 (يخطط لاستقصاء لمعرفة لون بتلات الأزهار الأكثر شيوعًا): إبداع\nالمخرج الآخر (يفسر سبب امتلاك بعض الأزهار رائحة كريهة ولونًا داكنًا): تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "البتلات، الرائحة، الحشرات، الاستقصاء.", "يعرض المعلم صورة زهرة الجثة (الرافليسيا) ص35 ويقرأ وصفها: «تبدو رائحتها مثل اللحم المتعفن»، ويسأل: «لماذا تحتاج زهرة إلى رائحة كهذه؟».", "1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون أنها تجذب حشرات معينة كالذباب (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • أسئلة ص35: يناقش المعلم السؤالين (1، 2)، والطلبة يسمون: المتك يصنع حبوب اللقاح، السبلات تحمي البرعم، المبيض يحتوي البويضات، البتلات تجذب الحشرات والطيور، والبتلات مصدر الرائحة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • ال  حبوب اللقاح؟ وأيها يحمي البرعم؟».\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nيعرض المعلم رسمًا لزهرة دون أسماء ويطلب من الطلاب تسمية الأجزاء بسرعة شفهيًا كمراجعة.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nيكتب المعلم على السبورة: 4، 8، 12، … ويسأل عن العدد التالي، ثم يوضح أن النمط تغيّر منتظم في الأعداد يمكن أن نجده في الأزهار أيضًا.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nيعرض المعلم صورة زهرة الجثة (الرافليسيا) ص35 ويقرأ وصفها: «تبدو رائحتها مثل اللحم المتعفن»، ويسأل: «لماذا تحتاج زهرة إلى رائحة كهذه؟».", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الزهرة وينفذ العصف الذهني، والطلبة يسمون ما يعرفونه من أجزاء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعليمات الأمان: ينبّه المعلم إلى عدم قطف الأزهار دون إذن وتجنب النباتات الضارة كالدفلة، وغسل اليدين بعد العمل، والطلبة يستمعون ويلتزمون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 4أ: يوزع المعلم الأزهار والعدسات ويوجه وفق خطوات ص34، والطلبة يحددون اللون، ويعدّون الأجزاء الملونة (البتلات) والخضراء (السبلات)، ويلاحظون الأجزاء الداخلية، ويعدّون السيقان الرفيعة (الأسدية) ويلمسون حوافها، ويلاحظون الساق الوسطى (الكربلة) (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • المشاركة: يطلب المعلم من كل مجموعة عرض أعدادها، والطلبة يقارنون الأعداد بين أنواع الأزهار (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يسأل المعلم: ماذا لاحظتم على أصابعكم بعد لمس الحواف الصفراء؟ والطلبة يذكرون مسحوقًا أصفر (حبوب اللقاح) (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: أجزاء الزهرة ووظائفها — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم النموذج ويطرح السؤال، والطلبة يتوقعون (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • شرح الأجزاء: يشرح المعلم رسم ص34: السبلات تحمي البرعم، البتلات زاهية تجذب الحشرات، السداة (متك + خيط) والمتك ينتج حبوب اللقاح، الكربلة (ميسم يستقبل حبوب اللقاح + قلم + مبيض يحتوي على البويضات)، والطلبة يكتبون كل جزء ووظيفته في جدول (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • نموذج الزهرة: يوزع المعلم ورقة المصادر 2-4 ص45، والطلبة يقصون أجزاء الزهرة ويلصقونها في مكانها الصحيح ويسمونها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • لعبة التصنيف: يعرض المعلم بطاقات أسماء الأجزاء، ويصنفونها الطالب: ذكرية (المتك، الخيط) – أنثوية (الميسم، القلم، المبيض، البويضات) – أجزاء أخرى (البتلات، السبلات) (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يطرح المعلم سؤالًا ختاميًا، والطلبة يسمّون عضو التذكير وعضو التأنيث (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الرسم للمراجعة، والطلبة يسمون الأجزاء (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • نمذجة التشريح: يوضح المعلم كيفية سحب البتلات والسبلات بالملقط برفق، والطلبة يتابعون (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. 4ب: يتابع المجموعات وفق خطوات ص35، والطلبة يرسمون الزهرة ويسمون أجزاءها، ويعدّون البتلات والسبلات والأسدية، ويسحبون البتلات والسبلات، ويستخدمون العدسة لرؤية الأسدية والكرابل (16 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • رسم السداة والكربلة: يتابع المعلم دقة الرسم، والطلبة يرسمون السداة والكربلة ويسمون أجزاءهما (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • الغلق: يسأل المعلم: هل تتساوى أعداد الأجزاء في الأزهار المختلفة؟ والطلبة يقارنون بين أزهار المجموعات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم النمط العددي، والطلبة يكتشفون العدد التالي ويعرفون النمط (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • ورقة العمل 2-4أ: يوضح المعلم طريقة ضغط الزهرة بين أوراق الجرائد تحت كتب ثقيلة لمدة أسبوعين إلى أربعة أسابيع، والطلبة يضعون أزهارهم للضغط ويرسمونها قبل الضغط (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. • ورقة العمل 2-4ب: يقدم المعلم ورقة العمل ص69 ويطلب البحث عن النمط في أعداد السبلات والبتلات والأسدية، والطلبة يحللون الجدول ويكتشفون أن أعداد البتلات والأسدية تساوي عدد السبلات أو مضاعفاته، ويتنبؤون بأجزاء زهرة لها ثماني سبلات (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • كفاية الأدلة: يسأل المعلم: هل تكفي هذه البيانات لنقول إن كل الأزهار هكذا؟ والطلبة يستنتجون أننا نحتاج أزهارًا أكثر لنتأكد (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يلخص المعلم مفهوم النمط والتنبؤ، والطلبة يذكرون النمط الذي اكتشفوه (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون أنها تجذب حشرات معينة كالذباب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • أسئلة ص35: يناقش المعلم السؤالين (1، 2)، والطلبة يسمون: المتك يصنع حبوب اللقاح، السبلات تحمي البرعم، المبيض يحتوي البويضات، البتلات تجذب الحشرات والطيور، والبتلات مصدر الرائحة (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • التخطيط للاستقصاء (س3): يوجه المجموعات لتخطيط استقصاء: ماذا نعدّ؟ أين؟ كيف نسجل؟ كم مرة نكرر؟ والطلبة يكتبون خطة: عدّ أزهار كل لون في عدة حدائق، تسجيل في جدول، تمثيل بالأعمدة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تمرين 2-4: يقدم المعلم تمرين 2-4 بكتاب النشاط ص26، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. (مستوى المعرفة) ما لون السبلات غالبًا؟\n   الإجابة النموذجية: أخضر.\n2. (مستوى التطبيق) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الزهرة (مع العدّ الصحيح).\n3. (مستوى الاستدلال) ما المسحوق الأصفر الذي ظهر على أصابعك بعد لمس حواف السيقان الرفيعة؟ ومن أي جزء أتى؟\n   الإجابة النموذجية: حبوب اللقاح، من المتك (رأس السداة) وهو جزء ذكري.\n\nالحصة 2: أجزاء الزهرة ووظائفها\n1. (مستوى المعرفة) ما الجزء الذي يصنع حبوب اللقاح؟\n   الإجابة النموذجية: المتك.\n2. (مستوى التطبيق) ما وظيفة السبلات؟\n   الإجابة النموذجية: حماية برعم الزهرة.\n3. (مستوى الاستدلال) صنّف: الميسم، المتك، المبيض، الخيط إلى ذكرية وأنثوية.\n   الإجابة النموذجية: ذكرية: المتك، الخيط. أنثوية: الميسم، المبيض.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. (مستوى المعرفة) ما الأداة التي استخدمناها لسحب البتلات؟\n   الإجابة النموذجية: الملقط.\n2. (مستوى التطبيق) سمِّ جزأي السداة.\n   الإجابة النموذجية: المتك والخيط.\n3. (مستوى الاستدلال) قارن بين عدد البتلات في زهرتك وزهرة مجموعة أخرى.\n   الإجابة النموذجية: تقبل الإجابة الصحيحة حسب الأزهار مع ذكر الفرق.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. (مستوى المعرفة) ما المقصود بالنمط؟\n   الإجابة النموذجية: تغير منتظم في الأعداد أو بيانات تتكرر بطريقة يمكن توقعها.\n2. (مستوى التطبيق) زهرة لها خمس سبلات، كم عدد بتلاتها المتوقع؟\n   الإجابة النموذجية: خمس بتلات غالبًا.\n3. (مستوى الاستدلال) هل تكفي بيانات أربع أزهار لتعميم النمط على كل الأزهار؟ لماذا؟\n   الإجابة النموذجية: لا؛ نحتاج إلى فحص أزهار كثيرة مختلفة لأن بعض الأزهار قد لا تتبع النمط.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n1. (مستوى المعرفة) ما جزء الزهرة الذي يحتوي على البويضات؟\n   الإجابة النموذجية: المبيض.\n2. (مستوى التطبيق) ما جزء الزهرة الذي يجذب الحشرات والطيور؟\n   الإجابة النموذجية: البتلات الزاهية (ورائحتها).\n3. (مستوى الاستدلال) لماذا تمتلك بعض الأزهار لونًا بنيًا داكنًا ورائحة كريهة؟\n   الإجابة النموذجية: لتجذب حشرات معينة كالذباب الذي يتغذى على اللحوم المتعفنة فيلقحها.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\n1. (مستوى المعرفة) صح أم خطأ: البتلات هي الأجزاء الملونة في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر جزأين لاحظتهما داخل الزهرة.\n   الإجابة النموذجية: الأسدية (السيقان الرفيعة) والكربلة (الساق الوسطى).\n3. (مستوى الاستدلال) لماذا تكون الساق الوسطى في الزهرة مختلفة عن الأسدية؟\n   الإجابة النموذجية: لأنها الجزء الأنثوي (الكربلة)، بينما الأسدية أجزاء ذكرية.\n\nالحصة 2: أجزاء الزهرة ووظائفها\n1. (مستوى المعرفة) أكمل: تتكون السداة من …… و……\n   الإجابة النموذجية: المتك والخيط.\n2. (مستوى التطبيق) ما وظيفة الميسم؟\n   الإجابة النموذجية: استقبال حبوب اللقاح في عملية التلقيح.\n3. (مستوى الاستدلال) لماذا تكون بتلات بعض الأزهار زاهية الألوان؟\n   الإجابة النموذجية: لتجذب الحشرات إلى الزهرة.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\n1. (مستوى المعرفة) صح أم خطأ: الكربلة هي عضو التأنيث في الزهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) سمِّ ثلاثة أجزاء للكربلة.\n   الإجابة النموذجية: الميسم والقلم والمبيض.\n3. (مستوى الاستدلال) لماذا نستخدم العدسة المكبرة عند فحص الأسدية والكرابل؟\n   الإجابة النموذجية: لأنها أجزاء صغيرة يصعب رؤية تفاصيلها بالعين المجردة.\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\n1. (مستوى المعرفة) صح أم خطأ: نضغط الزهرة لتجف وتحافظ على شكلها.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) تنبأ بعدد بتلات وأسدية زهرة لها ثماني سبلات.\n   الإجابة النموذجية: ثماني بتلات وثماني أسدية على الأرجح.\n3. (مستوى الاستدلال) كيف تتحقق من صحة النمط الذي اكتشفته؟\n   الإجابة النموذجية: بفحص أزهار كثيرة مختلفة وعدّ أجزائها ومقارنتها بالنمط.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\n1. (مستوى المعرفة) سمِّ جزء الزهرة الذي يحمي البرعم.\n   الإجابة النموذجية: السبلات.\n2. (مستوى التطبيق) اذكر خطوتين في خطة استقصاء اللون الأكثر شيوعًا لبتلات الأزهار.\n   الإجابة النموذجية: عدّ أزهار كل لون في أماكن مختلفة، تسجيل الأعداد في جدول وتمثيلها بالأعمدة.\n3. (مستوى الاستدلال) لماذا يجب تكرار العدّ في أكثر من حديقة؟\n   الإجابة النموذجية: لأن حديقة واحدة قد لا تمثل جميع الأزهار، والتكرار يجعل الاستنتاج أكثر موثوقية.", "الحصة 1: نشاط 2-4أ: استقصاء أجزاء الزهرة\nللطالب: قراءة كتاب الطالب ص34، ورسم الزهرة التي فحصها. لولي الأمر: مساعدة الابن في ملاحظة زهرة في المنزل وعدّ بتلاتها وسبلاتها.\n\nالحصة 2: أجزاء الزهرة ووظائفها\nللطالب: مراجعة رسم أجزاء الزهرة ص34 وحفظ أسماء الأجزاء ووظائفها. لولي الأمر: إحضار زهرة للحصة القادمة وملاقط صغيرة إن أمكن.\n\nالحصة 3: نشاط 2-4ب: لاحظ زهرة جيدًا وارسمها\nللطالب: إكمال رسم السداة والكربلة وتسمية الأجزاء. لولي الأمر: مساعدة الابن في اختيار زهرة صغيرة لضغطها وتجفيفها (ورقة العمل 2-4أ).\n\nالحصة 4: أوراق العمل 2-4أ و2-4ب: ضغط زهرة والأنماط في أجزاء الأزهار\nللطالب: متابعة الزهرة المضغوطة أسبوعيًا، وإكمال ورقة العمل 2-4ب ص69. لولي الأمر: التأكد من وضع الزهرة في مكان جاف تحت كتب ثقيلة دون تحريكها.\n\nالحصة 5: أسئلة الدرس وتمرين 2-4 والتخطيط لاستقصاء ألوان البتلات\nللطالب: حل تمرين 2-4 بكتاب النشاط ص26 إن لم يكتمل، وتنفيذ خطة عدّ الأزهار حسب ألوانها في حديقة الحي. لولي الأمر: مرافقة الابن عند عدّ الأزهار وتسجيل النتائج.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=10"]}, {"code": "2-5", "title": "التلقيح", "unit": 2, "dates": "الأسبوع السابع (18–22/10/2026م)", "sb": "36–37", "tb": "48–49", "ab": "تمرين 2-5 ص27", "periods": [{"n": 1, "topic": "مفهوم التلقيح", "f": ["1. يعرّف التلقيح بأنه نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه\n2. يحدد اتجاه انتقال حبوب اللقاح بين أجزاء الزهرة\nمخرج تعليمي آخر: يربط بين التلقيح اليدوي لأشجار النخيل وعملية التلقيح في الطبيعة", "المخرج 1 (يعرّف التلقيح بأنه نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه): تذكر\nالمخرج 2 (يحدد اتجاه انتقال حبوب اللقاح بين أجزاء الزهرة): فهم\nالمخرج الآخر (يربط بين التلقيح اليدوي لأشجار النخيل وعملية التلقيح في الطبيعة): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة أو مقطع لتلقيح النخيل، نموذج زهرة", "التلقيح، حبوب اللقاح، السداة، الميسم.", "يسأل المعلم: «هل شاهدت مزارعًا يصعد النخلة في موسم معين ويضع فيها شيئًا؟ ماذا يفعل؟»، ثم يعرض مقطعًا قصيرًا لعملية «التنبيت» (تلقيح النخيل) في عُمان.", "1. • التهيئة: يطرح المعلم السؤال ويعرض المقطع، والطلبة يصفون ما يفعله المزارع (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعريف التلقيح: يقرأ المعلم مع الطلاب ص36 ويوضح: التلقيح نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه، والطلبة يكتبون التعريف ويحددون على نموذج الزهرة مسار حبوب اللقاح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • نمذجة المسار: يرسم المعلم زهرتين على السبورة ويرسم سهمًا من متك الأولى إلى ميسم الثانية، والطلبة يرسمون المخطط ويسمّون الجزء المرسل والجزء المستقبل (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • الربط بالنخيل: يوضح المعلم أن المزارع ينقل حبوب اللقاح من النخلة الذكر (الفحل) إلى أزهار النخلة الأنثى، والطلبة يناقشون: لماذا يحتاج المزارع لفعل ذلك؟ (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يطرح المعلم سؤال: من ينقل حبوب اللقاح في الطبيعة؟ والطلبة يتوقعون: الحشرات والرياح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1. (مستوى المعرفة) ما التلقيح؟\n   الإجابة النموذجية: نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) إلى أي جزء من الزهرة تنتقل حبوب اللقاح؟\n   الإجابة النموذجية: إلى الميسم.\n3. (مستوى الاستدلال) لماذا يلقح المزارعون النخيل يدويًا؟\n   الإجابة النموذجية: لضمان وصول حبوب اللقاح من الفحل إلى أزهار النخلة الأنثى فتتكون الثمار.", "1. (مستوى المعرفة) أكمل: تنتقل حبوب اللقاح في التلقيح من …… إلى ……\n   الإجابة النموذجية: السداة (المتك)؛ ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) هل يمكن تلقيح زهرة طماطم بحبوب لقاح من زهرة ورد؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن التلقيح يكون بين أزهار من النوع نفسه.\n3. (مستوى الاستدلال) اقترح ما يحدث لمحصول التمر إذا لم يتم تلقيح النخيل.\n   الإجابة النموذجية: يقل المحصول كثيرًا أو لا تتكون الثمار جيدًا.", "للطالب: قراءة كتاب الطالب ص36، وسؤال أحد كبار العائلة عن طريقة تلقيح النخيل. لولي الأمر: التحدث مع الابن عن تلقيح النخيل وموسمه في عُمان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}, {"n": 2, "topic": "التلقيح بواسطة الحشرات", "f": ["1. يصف كيف تلقح الحشرات الأزهار أثناء تغذيها على الرحيق\n2. يحدد صفات الأزهار التي تلقحها الحشرات\nمخرج تعليمي آخر: يستنتج من الآية الكريمة دور النحل في التلقيح وإنتاج العسل", "المخرج 1 (يصف كيف تلقح الحشرات الأزهار أثناء تغذيها على الرحيق): فهم\nالمخرج 2 (يحدد صفات الأزهار التي تلقحها الحشرات): تحليل\nالمخرج الآخر (يستنتج من الآية الكريمة دور النحل في التلقيح وإنتاج العسل): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: أزهار زاهية، عدسة مكبرة", "الرحيق، التلقيح، الحشرات، حبوب اللقاح.", "يتلو المعلم قوله تعالى: «وأوحى ربك إلى النحل…» (سورة النحل 68–69) كما في ص36، ويسأل: «من أين يجمع النحل غذاءه؟ وماذا يحمل على جسمه دون أن يقصد؟».", "1. • التهيئة: يتلو المعلم الآية ويطرح السؤال، والطلبة يجيبون: من الأزهار؛ يحمل حبوب اللقاح (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • التلقيح بالحشرات: يشرح المعلم ص36: تتغذى الحشرات على الرحيق (سائل حلو المذاق)، فتعلق بها حبوب اللقاح وتنقلها إلى ميسم زهرة أخرى، والطلبة يرسمون مخطط تسلسل لرحلة النحلة بين زهرتين (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • صفات الأزهار: يعرض المعلم صورًا لأزهار تلقحها الحشرات، والطلبة يستنتجون الصفات: بتلات زاهية الألوان، رائحة، رحيق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تأمل الآية: يناقش المعلم معنى الآية: النحل يأكل من الثمرات ويخرج العسل الذي فيه شفاء، والطلبة يربطون بين تغذي النحل على الرحيق وإنتاج العسل وتلقيح الأزهار (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم: لماذا تحتاج الزهرة إلى ألوان ورائحة؟ والطلبة يجيبون: لجذب الحشرات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما الرحيق؟\n   الإجابة النموذجية: سائل حلو المذاق تصنعه الأزهار وتتغذى عليه الحشرات.\n2. (مستوى التطبيق) اذكر صفتين لأزهار تلقحها الحشرات.\n   الإجابة النموذجية: بتلات زاهية الألوان، رائحة، رحيق (أي اثنتين).\n3. (مستوى الاستدلال) كيف تنتقل حبوب اللقاح من زهرة إلى أخرى بواسطة النحلة؟\n   الإجابة النموذجية: تعلق حبوب اللقاح بجسم النحلة أثناء تغذيها على الرحيق، ثم تسقط على ميسم الزهرة التالية التي تزورها.", "1. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الحشرات تكون زاهية الألوان غالبًا.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا تزور الحشرات الأزهار؟\n   الإجابة النموذجية: لتتغذى على الرحيق.\n3. (مستوى الاستدلال) ماذا يحدث للأزهار لو قلّت أعداد النحل في منطقة ما؟\n   الإجابة النموذجية: يقل تلقيح الأزهار فتقل الثمار والبذور.", "للطالب: حفظ الآيتين 68–69 من سورة النحل، وملاحظة حشرات تزور الأزهار في الحديقة. لولي الأمر: مناقشة الابن في فوائد النحل للإنسان والنبات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}, {"n": 3, "topic": "التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟", "f": ["1. يصف صفات الأزهار التي تلقحها الرياح\n2. يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها\nمخرج تعليمي آخر: يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح", "المخرج 1 (يصف صفات الأزهار التي تلقحها الرياح): فهم\nالمخرج 2 (يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها): تطبيق\nالمخرج الآخر (يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: أزهار عشبية وأزهار زاهية من فناء المدرسة، عدسات مكبرة، ورق", "التلقيح بالرياح، حبوب اللقاح.", "يعرض المعلم صورة الزهرة العشبية ص36 والرياح تنثر منها سحابة من حبوب اللقاح، ويسأل: «هذه الزهرة ليست ملونة ولا رائحة لها، فكيف تُلقّح؟».", "1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون الرياح (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • صفات أزهار الرياح: يشرح المعلم ص36: غير زاهية، لا بتلات أو رائحة، تنتج كثيرًا من حبوب اللقاح الخفيفة، والطلبة يكتبون الصفات ويقارنونها بأزهار الحشرات (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 5: يصطحب الطلاب إلى فناء المدرسة ويوجههم وفق ص36، والطلبة ينظرون إلى الأزهار المختلفة، ويرسمون صورًا لها ويسمون أجزاءها، ويحددون كيف يتم تلقيح كل زهرة ولماذا (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • جدول مقارنة: يرسم المعلم جدولًا للمقارنة، والطلبة يكملون: الحشرات (زاهية، رائحة، رحيق) – الرياح (غير زاهية، بلا رائحة، حبوب لقاح كثيرة) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يحددون نوع تلقيح زهرة معروضة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) اذكر صفة لزهرة تلقحها الرياح.\n   الإجابة النموذجية: غير زاهية أو بلا رائحة أو تنتج كثيرًا من حبوب اللقاح.\n2. (مستوى التطبيق) زهرة صغيرة خضراء بلا رائحة، كيف تلقح غالبًا؟\n   الإجابة النموذجية: بواسطة الرياح.\n3. (مستوى الاستدلال) لماذا تنتج الأزهار التي تلقحها الرياح كثيرًا من حبوب اللقاح؟\n   الإجابة النموذجية: لأن معظم حبوب اللقاح تضيع في الهواء، فتزيد الكثرة فرصة وصول بعضها إلى ميسم زهرة من النوع نفسه.", "1. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الرياح لها رحيق كثير.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) قارن بين زهرة تلقحها الحشرات وزهرة تلقحها الرياح من حيث اللون والرائحة.\n   الإجابة النموذجية: الحشرات: زاهية الألوان ذات رائحة. الرياح: غير زاهية بلا رائحة.\n3. (مستوى الاستدلال) لماذا لا تحتاج الأزهار التي تلقحها الرياح إلى بتلات زاهية؟\n   الإجابة النموذجية: لأنها لا تحتاج إلى جذب الحشرات؛ فالرياح تنقل حبوب لقاحها.", "للطالب: إكمال رسومات نشاط 2-5 وتسمية الأجزاء. لولي الأمر: ملاحظة أزهار في الحي مع الابن وتحديد نوع تلقيحها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}, {"n": 4, "topic": "الإخصاب وتكوين الثمار والبذور", "f": ["1. يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض\n2. يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور\nمخرج تعليمي آخر: يميز بين التلقيح والإخصاب", "المخرج 1 (يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض): فهم\nالمخرج 2 (يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور): فهم\nالمخرج الآخر (يميز بين التلقيح والإخصاب): تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية، أخرى: صور مراحل تكون ثمرة الطماطم", "الإخصاب، المبيض، البويضات، الثمرة، البذور.", "يعرض المعلم الصور الثلاث لنبات الطماطم ص37 (زهرة ← ثمرة صغيرة ← ثمرة ناضجة) ويسأل: «بعد التلقيح، ماذا يحدث داخل الزهرة حتى تظهر هذه الثمرة؟».", "1. • التهيئة: يعرض المعلم الصور ويطرح السؤال، والطلبة يتوقعون أن الزهرة تتحول إلى ثمرة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • الإخصاب: يشرح المعلم ص37: تنتقل حبوب اللقاح من الميسم إلى المبيض، وتتحد مع البويضات (الإخصاب)، والطلبة يحددون موقع الإخصاب على رسم الزهرة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • من المبيض إلى الثمرة: يوضح المعلم: بعد الإخصاب تموت البتلات والأسدية، وينمو المبيض ليكوّن الثمرة، وتتحول البويضات المخصبة إلى بذور، والطلبة يرتبون بطاقات: تلقيح ← إخصاب ← ذبول البتلات ← نمو المبيض ← ثمرة بها بذور (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • التلقيح والإخصاب: يكتب المعلم على السبورة جدول مقارنة (أين؟ ماذا يحدث؟)، والطلبة يكملون المقارنة: التلقيح نقل حبوب اللقاح إلى الميسم، والإخصاب اتحادها بالبويضات داخل المبيض (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يسأل المعلم: أي جزء في الزهرة يصبح ثمرة؟ والطلبة يجيبون: المبيض (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (مستوى المعرفة) أين يحدث الإخصاب؟\n   الإجابة النموذجية: داخل المبيض.\n2. (مستوى التطبيق) إلامَ تتحول البويضات المخصبة؟\n   الإجابة النموذجية: إلى بذور.\n3. (مستوى الاستدلال) ما الفرق بين التلقيح والإخصاب؟\n   الإجابة النموذجية: التلقيح نقل حبوب اللقاح من السداة إلى الميسم، والإخصاب اتحاد حبوب اللقاح مع البويضات داخل المبيض.", "1. (مستوى المعرفة) أكمل: بعد الإخصاب ينمو …… ليكوّن الثمرة.\n   الإجابة النموذجية: المبيض.\n2. (مستوى التطبيق) ماذا يحدث للبتلات والأسدية بعد الإخصاب؟\n   الإجابة النموذجية: تموت (تذبل وتسقط).\n3. (مستوى الاستدلال) هل يمكن أن يحدث الإخصاب دون تلقيح؟ فسّر.\n   الإجابة النموذجية: لا؛ لأن حبوب اللقاح يجب أن تصل أولًا إلى الميسم بالتلقيح ثم تنتقل إلى المبيض لتخصب البويضات.", "للطالب: قراءة كتاب الطالب ص37، ورسم مخطط من التلقيح إلى تكوين البذور. لولي الأمر: فتح ثمرة طماطم مع الابن وملاحظة البذور وربطها بالبويضات المخصبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}, {"n": 5, "topic": "محاكاة التلقيح وأسئلة الدرس", "f": ["1. يحاكي عملية التلقيح بالحشرات بنموذج بسيط\n2. يجيب عن أسئلة الدرس ويوضح كيف يساعد التلقيح في تكاثر النبات\nمخرج تعليمي آخر: يوضح كيف تنتقل حبوب اللقاح من الميسم إلى المبيض (التحدي)", "المخرج 1 (يحاكي عملية التلقيح بالحشرات بنموذج بسيط): تطبيق\nالمخرج 2 (يجيب عن أسئلة الدرس ويوضح كيف يساعد التلقيح في تكاثر النبات): فهم\nالمخرج الآخر (يوضح كيف تنتقل حبوب اللقاح من الميسم إلى المبيض (التحدي)): تحليل", "التعلم المبني على اللعب، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: أزهار ورقية، مسحوق طباشير ملون يمثل حبوب اللقاح، أعواد قطنية", "التلقيح، الإخصاب، حبوب اللقاح، الرحيق.", "يوزع المعلم «أزهارًا ورقية» في وسط بعضها مسحوق طباشير ملون، ويخبر الطلاب أنهم سيكونون «نحلًا» يبحث عن الرحيق.", "1. • التهيئة: يشرح المعلم قواعد المحاكاة، والطلبة يستعدون للعب دور النحل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • المحاكاة: يطلب المعلم من «النحل» زيارة الأزهار بالعود القطني بالترتيب، والطلبة ينقلون المسحوق من زهرة إلى أخرى ويلاحظون انتقال «حبوب اللقاح» إلى الأزهار (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تحليل المحاكاة: يسأل المعلم: ماذا يمثل المسحوق؟ والعود القطني؟ وما حدود هذا النموذج؟ والطلبة يربطون عناصر النموذج بالواقع (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • أسئلة ص37 والتحدي: يناقش المعلم الأسئلة (1–4) والتحدي، والطلبة يجيبون عن تلقيح الحشرات والرياح وكثرة حبوب اللقاح ودور التلقيح والفرق بينه وبين الإخصاب (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.", "1. (مستوى المعرفة) ماذا يمثل المسحوق الملون في المحاكاة؟\n   الإجابة النموذجية: حبوب اللقاح.\n2. (مستوى التطبيق) لماذا تنتج الأزهار التي تلقحها الرياح كمية كبيرة من حبوب اللقاح الجافة؟\n   الإجابة النموذجية: لأن كثيرًا منها يضيع في الهواء ولا يصل إلى الميسم.\n3. (مستوى الاستدلال) كيف يساعد التلقيح في تكاثر النباتات؟\n   الإجابة النموذجية: يوصل حبوب اللقاح إلى الميسم فتنتقل إلى المبيض وتخصب البويضات فتتكون البذور التي تنمو إلى نباتات جديدة.", "1. (مستوى المعرفة) صح أم خطأ: التلقيح والإخصاب عملية واحدة.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا تلقح الحشرات الأزهار الملونة ذات الرحيق والرائحة؟\n   الإجابة النموذجية: لأن الألوان والرائحة تجذبها، والرحيق غذاء لها.\n3. (مستوى الاستدلال) وضّح كيف تنتقل حبوب اللقاح إلى مبيض الزهرة.\n   الإجابة النموذجية: تصل حبوب اللقاح إلى الميسم بالتلقيح، ثم تنتقل عبر القلم إلى المبيض حيث تتحد مع البويضات.", "للطالب: حل تمرين 2-5 بكتاب النشاط ص27، ومراجعة الفرق بين التلقيح والإخصاب. لولي الأمر: مشاهدة مقطع عن النحل والتلقيح مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}], "combined": ["الحصة 1: مفهوم التلقيح\n1. يعرّف التلقيح بأنه نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه\n2. يحدد اتجاه انتقال حبوب اللقاح بين أجزاء الزهرة\nمخرج تعليمي آخر: يربط بين التلقيح اليدوي لأشجار النخيل وعملية التلقيح في الطبيعة\n\nالحصة 2: التلقيح بواسطة الحشرات\n1. يصف كيف تلقح الحشرات الأزهار أثناء تغذيها على الرحيق\n2. يحدد صفات الأزهار التي تلقحها الحشرات\nمخرج تعليمي آخر: يستنتج من الآية الكريمة دور النحل في التلقيح وإنتاج العسل\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n1. يصف صفات الأزهار التي تلقحها الرياح\n2. يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها\nمخرج تعليمي آخر: يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\n1. يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض\n2. يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور\nمخرج تعليمي آخر: يميز بين التلقيح والإخصاب\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\n1. يحاكي عملية التلقيح بالحشرات بنموذج بسيط\n2. يجيب عن أسئلة الدرس ويوضح كيف يساعد التلقيح في تكاثر النبات\nمخرج تعليمي آخر: يوضح كيف تنتقل حبوب اللقاح من الميسم إلى المبيض (التحدي)", "الحصة 1: مفهوم التلقيح\nالمخرج 1 (يعرّف التلقيح بأنه نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه): تذكر\nالمخرج 2 (يحدد اتجاه انتقال حبوب اللقاح بين أجزاء الزهرة): فهم\nالمخرج الآخر (يربط بين التلقيح اليدوي لأشجار النخيل وعملية التلقيح في الطبيعة): تحليل\n\nالحصة 2: التلقيح بواسطة الحشرات\nالمخرج 1 (يصف كيف تلقح الحشرات الأزهار أثناء تغذيها على الرحيق): فهم\nالمخرج 2 (يحدد صفات الأزهار التي تلقحها الحشرات): تحليل\nالمخرج الآخر (يستنتج من الآية الكريمة دور النحل في التلقيح وإنتاج العسل): تحليل\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nالمخرج 1 (يصف صفات الأزهار التي تلقحها الرياح): فهم\nالمخرج 2 (يحدد نوع تلقيح زهرة من خلال ملاحظة صفاتها): تطبيق\nالمخرج الآخر (يقارن بين الأزهار التي تلقحها الحشرات والتي تلقحها الرياح): تحليل\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nالمخرج 1 (يوضح أن الإخصاب يحدث عندما تتحد حبوب اللقاح مع البويضات داخل المبيض): فهم\nالمخرج 2 (يصف تحول المبيض إلى ثمرة والبويضات المخصبة إلى بذور): فهم\nالمخرج الآخر (يميز بين التلقيح والإخصاب): تحليل\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالمخرج 1 (يحاكي عملية التلقيح بالحشرات بنموذج بسيط): تطبيق\nالمخرج 2 (يجيب عن أسئلة الدرس ويوضح كيف يساعد التلقيح في تكاثر النبات): فهم\nالمخرج الآخر (يوضح كيف تنتقل حبوب اللقاح من الميسم إلى المبيض (التحدي)): تحليل", "الحصة 1: مفهوم التلقيح\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي\n\nالحصة 2: التلقيح بواسطة الحشرات\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم بالنمذجة", "الحصة 1: مفهوم التلقيح\nالكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: صورة أو مقطع لتلقيح النخيل، نموذج زهرة\n\nالحصة 2: التلقيح بواسطة الحشرات\nالكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، أخرى: أزهار زاهية، عدسة مكبرة\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nالكتاب، السبورة الذكية، صورة توضيحية، الأقلام، أخرى: أزهار عشبية وأزهار زاهية من فناء المدرسة، عدسات مكبرة، ورق\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nالكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية، أخرى: صور مراحل تكون ثمرة الطماطم\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: أزهار ورقية، مسحوق طباشير ملون يمثل حبوب اللقاح، أعواد قطنية", "الحصة 1: مفهوم التلقيح\nالتلقيح، حبوب اللقاح، السداة، الميسم.\n\nالحصة 2: التلقيح بواسطة الحشرات\nالرحيق، التلقيح، الحشرات، حبوب اللقاح.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nالتلقيح بالرياح، حبوب اللقاح.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nالإخصاب، المبيض، البويضات، الثمرة، البذور.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nالتلقيح، الإخصاب، حبوب اللقاح، الرحيق.", "الحصة 1: مفهوم التلقيح\nيسأل المعلم: «هل شاهدت مزارعًا يصعد النخلة في موسم معين ويضع فيها شيئًا؟ ماذا يفعل؟»، ثم يعرض مقطعًا قصيرًا لعملية «التنبيت» (تلقيح النخيل) في عُمان.\n\nالحصة 2: التلقيح بواسطة الحشرات\nيتلو المعلم قوله تعالى: «وأوحى ربك إلى النحل…» (سورة النحل 68–69) كما في ص36، ويسأل: «من أين يجمع النحل غذاءه؟ وماذا يحمل على جسمه دون أن يقصد؟».\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nيعرض المعلم صورة الزهرة العشبية ص36 والرياح تنثر منها سحابة من حبوب اللقاح، ويسأل: «هذه الزهرة ليست ملونة ولا رائحة لها، فكيف تُلقّح؟».\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nيعرض المعلم الصور الثلاث لنبات الطماطم ص37 (زهرة ← ثمرة صغيرة ← ثمرة ناضجة) ويسأل: «بعد التلقيح، ماذا يحدث داخل الزهرة حتى تظهر هذه الثمرة؟».\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nيوزع المعلم «أزهارًا ورقية» في وسط بعضها مسحوق طباشير ملون، ويخبر الطلاب أنهم سيكونون «نحلًا» يبحث عن الرحيق.", "الحصة 1: مفهوم التلقيح — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال ويعرض المقطع، والطلبة يصفون ما يفعله المزارع (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • تعريف التلقيح: يقرأ المعلم مع الطلاب ص36 ويوضح: التلقيح نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه، والطلبة يكتبون التعريف ويحددون على نموذج الزهرة مسار حبوب اللقاح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • نمذجة المسار: يرسم المعلم زهرتين على السبورة ويرسم سهمًا من متك الأولى إلى ميسم الثانية، والطلبة يرسمون المخطط ويسمّون الجزء المرسل والجزء المستقبل (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • الربط بالنخيل: يوضح المعلم أن المزارع ينقل حبوب اللقاح من النخلة الذكر (الفحل) إلى أزهار النخلة الأنثى، والطلبة يناقشون: لماذا يحتاج المزارع لفعل ذلك؟ (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • الغلق: يطرح المعلم سؤال: من ينقل حبوب اللقاح في الطبيعة؟ والطلبة يتوقعون: الحشرات والرياح (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: التلقيح بواسطة الحشرات — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يتلو المعلم الآية ويطرح السؤال، والطلبة يجيبون: من الأزهار؛ يحمل حبوب اللقاح (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • التلقيح بالحشرات: يشرح المعلم ص36: تتغذى الحشرات على الرحيق (سائل حلو المذاق)، فتعلق بها حبوب اللقاح وتنقلها إلى ميسم زهرة أخرى، والطلبة يرسمون مخطط تسلسل لرحلة النحلة بين زهرتين (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • صفات الأزهار: يعرض المعلم صورًا لأزهار تلقحها الحشرات، والطلبة يستنتجون الصفات: بتلات زاهية الألوان، رائحة، رحيق (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • تأمل الآية: يناقش المعلم معنى الآية: النحل يأكل من الثمرات ويخرج العسل الذي فيه شفاء، والطلبة يربطون بين تغذي النحل على الرحيق وإنتاج العسل وتلقيح الأزهار (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. • الغلق: يسأل المعلم: لماذا تحتاج الزهرة إلى ألوان ورائحة؟ والطلبة يجيبون: لجذب الحشرات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون الرياح (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • صفات أزهار الرياح: يشرح المعلم ص36: غير زاهية، لا بتلات أو رائحة، تنتج كثيرًا من حبوب اللقاح الخفيفة، والطلبة يكتبون الصفات ويقارنونها بأزهار الحشرات (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. 5: يصطحب الطلاب إلى فناء المدرسة ويوجههم وفق ص36، والطلبة ينظرون إلى الأزهار المختلفة، ويرسمون صورًا لها ويسمون أجزاءها، ويحددون كيف يتم تلقيح كل زهرة ولماذا (16 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • جدول مقارنة: يرسم المعلم جدولًا للمقارنة، والطلبة يكملون: الحشرات (زاهية، رائحة، رحيق) – الرياح (غير زاهية، بلا رائحة، حبوب لقاح كثيرة) (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يحددون نوع تلقيح زهرة معروضة (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصور ويطرح السؤال، والطلبة يتوقعون أن الزهرة تتحول إلى ثمرة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • الإخصاب: يشرح المعلم ص37: تنتقل حبوب اللقاح من الميسم إلى المبيض، وتتحد مع البويضات (الإخصاب)، والطلبة يحددون موقع الإخصاب على رسم الزهرة (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • من المبيض إلى الثمرة: يوضح المعلم: بعد الإخصاب تموت البتلات والأسدية، وينمو المبيض ليكوّن الثمرة، وتتحول البويضات المخصبة إلى بذور، والطلبة يرتبون بطاقات: تلقيح ← إخصاب ← ذبول البتلات ← نمو المبيض ← ثمرة بها بذور (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • التلقيح والإخصاب: يكتب المعلم على السبورة جدول مقارنة (أين؟ ماذا يحدث؟)، والطلبة يكملون المقارنة: التلقيح نقل حبوب اللقاح إلى الميسم، والإخصاب اتحادها بالبويضات داخل المبيض (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يسأل المعلم: أي جزء في الزهرة يصبح ثمرة؟ والطلبة يجيبون: المبيض (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يشرح المعلم قواعد المحاكاة، والطلبة يستعدون للعب دور النحل (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. • المحاكاة: يطلب المعلم من «النحل» زيارة الأزهار بالعود القطني بالترتيب، والطلبة ينقلون المسحوق من زهرة إلى أخرى ويلاحظون انتقال «حبوب اللقاح» إلى الأزهار (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تحليل المحاكاة: يسأل المعلم: ماذا يمثل المسحوق؟ والعود القطني؟ وما حدود هذا النموذج؟ والطلبة يربطون عناصر النموذج بالواقع (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • أسئلة ص37 والتحدي: يناقش المعلم الأسئلة (1–4) والتحدي، والطلبة يجيبون عن تلقيح الحشرات والرياح وكثرة حبوب اللقاح ودور التلقيح والفرق بينه وبين الإخصاب (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مفهوم التلقيح\n1. (مستوى المعرفة) ما التلقيح؟\n   الإجابة النموذجية: نقل حبوب اللقاح من السداة إلى ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) إلى أي جزء من الزهرة تنتقل حبوب اللقاح؟\n   الإجابة النموذجية: إلى الميسم.\n3. (مستوى الاستدلال) لماذا يلقح المزارعون النخيل يدويًا؟\n   الإجابة النموذجية: لضمان وصول حبوب اللقاح من الفحل إلى أزهار النخلة الأنثى فتتكون الثمار.\n\nالحصة 2: التلقيح بواسطة الحشرات\n1. (مستوى المعرفة) ما الرحيق؟\n   الإجابة النموذجية: سائل حلو المذاق تصنعه الأزهار وتتغذى عليه الحشرات.\n2. (مستوى التطبيق) اذكر صفتين لأزهار تلقحها الحشرات.\n   الإجابة النموذجية: بتلات زاهية الألوان، رائحة، رحيق (أي اثنتين).\n3. (مستوى الاستدلال) كيف تنتقل حبوب اللقاح من زهرة إلى أخرى بواسطة النحلة؟\n   الإجابة النموذجية: تعلق حبوب اللقاح بجسم النحلة أثناء تغذيها على الرحيق، ثم تسقط على ميسم الزهرة التالية التي تزورها.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n1. (مستوى المعرفة) اذكر صفة لزهرة تلقحها الرياح.\n   الإجابة النموذجية: غير زاهية أو بلا رائحة أو تنتج كثيرًا من حبوب اللقاح.\n2. (مستوى التطبيق) زهرة صغيرة خضراء بلا رائحة، كيف تلقح غالبًا؟\n   الإجابة النموذجية: بواسطة الرياح.\n3. (مستوى الاستدلال) لماذا تنتج الأزهار التي تلقحها الرياح كثيرًا من حبوب اللقاح؟\n   الإجابة النموذجية: لأن معظم حبوب اللقاح تضيع في الهواء، فتزيد الكثرة فرصة وصول بعضها إلى ميسم زهرة من النوع نفسه.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\n1. (مستوى المعرفة) أين يحدث الإخصاب؟\n   الإجابة النموذجية: داخل المبيض.\n2. (مستوى التطبيق) إلامَ تتحول البويضات المخصبة؟\n   الإجابة النموذجية: إلى بذور.\n3. (مستوى الاستدلال) ما الفرق بين التلقيح والإخصاب؟\n   الإجابة النموذجية: التلقيح نقل حبوب اللقاح من السداة إلى الميسم، والإخصاب اتحاد حبوب اللقاح مع البويضات داخل المبيض.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\n1. (مستوى المعرفة) ماذا يمثل المسحوق الملون في المحاكاة؟\n   الإجابة النموذجية: حبوب اللقاح.\n2. (مستوى التطبيق) لماذا تنتج الأزهار التي تلقحها الرياح كمية كبيرة من حبوب اللقاح الجافة؟\n   الإجابة النموذجية: لأن كثيرًا منها يضيع في الهواء ولا يصل إلى الميسم.\n3. (مستوى الاستدلال) كيف يساعد التلقيح في تكاثر النباتات؟\n   الإجابة النموذجية: يوصل حبوب اللقاح إلى الميسم فتنتقل إلى المبيض وتخصب البويضات فتتكون البذور التي تنمو إلى نباتات جديدة.", "الحصة 1: مفهوم التلقيح\n1. (مستوى المعرفة) أكمل: تنتقل حبوب اللقاح في التلقيح من …… إلى ……\n   الإجابة النموذجية: السداة (المتك)؛ ميسم زهرة من النوع نفسه.\n2. (مستوى التطبيق) هل يمكن تلقيح زهرة طماطم بحبوب لقاح من زهرة ورد؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن التلقيح يكون بين أزهار من النوع نفسه.\n3. (مستوى الاستدلال) اقترح ما يحدث لمحصول التمر إذا لم يتم تلقيح النخيل.\n   الإجابة النموذجية: يقل المحصول كثيرًا أو لا تتكون الثمار جيدًا.\n\nالحصة 2: التلقيح بواسطة الحشرات\n1. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الحشرات تكون زاهية الألوان غالبًا.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا تزور الحشرات الأزهار؟\n   الإجابة النموذجية: لتتغذى على الرحيق.\n3. (مستوى الاستدلال) ماذا يحدث للأزهار لو قلّت أعداد النحل في منطقة ما؟\n   الإجابة النموذجية: يقل تلقيح الأزهار فتقل الثمار والبذور.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\n1. (مستوى المعرفة) صح أم خطأ: الأزهار التي تلقحها الرياح لها رحيق كثير.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) قارن بين زهرة تلقحها الحشرات وزهرة تلقحها الرياح من حيث اللون والرائحة.\n   الإجابة النموذجية: الحشرات: زاهية الألوان ذات رائحة. الرياح: غير زاهية بلا رائحة.\n3. (مستوى الاستدلال) لماذا لا تحتاج الأزهار التي تلقحها الرياح إلى بتلات زاهية؟\n   الإجابة النموذجية: لأنها لا تحتاج إلى جذب الحشرات؛ فالرياح تنقل حبوب لقاحها.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\n1. (مستوى المعرفة) أكمل: بعد الإخصاب ينمو …… ليكوّن الثمرة.\n   الإجابة النموذجية: المبيض.\n2. (مستوى التطبيق) ماذا يحدث للبتلات والأسدية بعد الإخصاب؟\n   الإجابة النموذجية: تموت (تذبل وتسقط).\n3. (مستوى الاستدلال) هل يمكن أن يحدث الإخصاب دون تلقيح؟ فسّر.\n   الإجابة النموذجية: لا؛ لأن حبوب اللقاح يجب أن تصل أولًا إلى الميسم بالتلقيح ثم تنتقل إلى المبيض لتخصب البويضات.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: التلقيح والإخصاب عملية واحدة.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا تلقح الحشرات الأزهار الملونة ذات الرحيق والرائحة؟\n   الإجابة النموذجية: لأن الألوان والرائحة تجذبها، والرحيق غذاء لها.\n3. (مستوى الاستدلال) وضّح كيف تنتقل حبوب اللقاح إلى مبيض الزهرة.\n   الإجابة النموذجية: تصل حبوب اللقاح إلى الميسم بالتلقيح، ثم تنتقل عبر القلم إلى المبيض حيث تتحد مع البويضات.", "الحصة 1: مفهوم التلقيح\nللطالب: قراءة كتاب الطالب ص36، وسؤال أحد كبار العائلة عن طريقة تلقيح النخيل. لولي الأمر: التحدث مع الابن عن تلقيح النخيل وموسمه في عُمان.\n\nالحصة 2: التلقيح بواسطة الحشرات\nللطالب: حفظ الآيتين 68–69 من سورة النحل، وملاحظة حشرات تزور الأزهار في الحديقة. لولي الأمر: مناقشة الابن في فوائد النحل للإنسان والنبات.\n\nالحصة 3: التلقيح بواسطة الرياح ونشاط 2-5: ما نوع التلقيح؟\nللطالب: إكمال رسومات نشاط 2-5 وتسمية الأجزاء. لولي الأمر: ملاحظة أزهار في الحي مع الابن وتحديد نوع تلقيحها.\n\nالحصة 4: الإخصاب وتكوين الثمار والبذور\nللطالب: قراءة كتاب الطالب ص37، ورسم مخطط من التلقيح إلى تكوين البذور. لولي الأمر: فتح ثمرة طماطم مع الابن وملاحظة البذور وربطها بالبويضات المخصبة.\n\nالحصة 5: محاكاة التلقيح وأسئلة الدرس\nللطالب: حل تمرين 2-5 بكتاب النشاط ص27، ومراجعة الفرق بين التلقيح والإخصاب. لولي الأمر: مشاهدة مقطع عن النحل والتلقيح مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=11"]}, {"code": "2-6", "title": "استقصاء التلقيح", "unit": 2, "dates": "الأسبوع الثامن (25–29/10/2026م)", "sb": "38–39", "tb": "50–51", "ab": "تمرين 2-6 ص28، ورقة العمل 2-6 ص71", "periods": [{"n": 1, "topic": "الحشرات الملقِّحة وتفضيلاتها", "f": ["1. يذكر أمثلة لحشرات تلقح الأزهار\n2. يربط بين صفات الزهرة ونوع الحشرة التي تنجذب إليها\nمخرج تعليمي آخر: يتنبأ بالحشرة التي يمكن أن تزور زهرة ما من خلال صفاتها", "المخرج 1 (يذكر أمثلة لحشرات تلقح الأزهار): تذكر\nالمخرج 2 (يربط بين صفات الزهرة ونوع الحشرة التي تنجذب إليها): تحليل\nالمخرج الآخر (يتنبأ بالحشرة التي يمكن أن تزور زهرة ما من خلال صفاتها): تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)", "الملقحات، الرحيق، حبوب اللقاح.", "يعرض المعلم الصور الثلاث ص38 (فراشة، خنفساء، نحلة على أزهار مختلفة) ويسأل: «هل تزور كل حشرة أي زهرة؟ لماذا تفضل الفراشة هذه الزهرة؟».", "1. • التهيئة: يعرض المعلم الصور ويطرح السؤال، والطلبة يتوقعون أسبابًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الحشرات الملقحة: يقرأ المعلم مع الطلاب ص38: تهوى الفراشات الأزهار الغنية بالرحيق، ويلقح النحل والخنافس والدبابير والنمل والعث الأزهار، والطلبة يكتبون قائمة بالحشرات الملقحة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • مطابقة زهرة وحشرة: يوزع المعلم بطاقات صفات أزهار (أنبوبية طويلة غنية بالرحيق، صفراء صغيرة كثيرة حبوب اللقاح، كبيرة بيضاء معطرة ليلًا…)، والطلبة يطابقون كل زهرة بالحشرة الأنسب ويبررون (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تحدث عن: يطرح المعلم سؤال ص39: العث يلقح الأزهار ليلًا، فما أنواع الأزهار التي يلقحها؟ والطلبة يستنتجون: أزهار فاتحة اللون (بيضاء) قوية الرائحة تُرى في المساء (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يلخص المعلم: صفات الزهرة تدل على ملقّحها، والطلبة يذكرون مثالًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) اذكر ثلاث حشرات تلقح الأزهار.\n   الإجابة النموذجية: النحل، الفراشات، الخنافس (أو الدبابير، النمل، العث).\n2. (مستوى التطبيق) لماذا تهوى الفراشات الأزهار الغنية بالرحيق؟\n   الإجابة النموذجية: لأنها تتغذى على الرحيق.\n3. (مستوى الاستدلال) زهرة بيضاء كبيرة قوية الرائحة تتفتح مساءً، أي حشرة تلقحها غالبًا؟\n   الإجابة النموذجية: العث؛ لأنه ينشط ليلًا ويرى الأزهار الفاتحة ويجذبه العطر.", "1. (مستوى المعرفة) صح أم خطأ: تفضل الحشرات المختلفة أنواعًا محددة من الأزهار.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الأزهار؟\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق.\n3. (مستوى الاستدلال) تنبأ بصفات زهرة تلقحها الخنافس.\n   الإجابة النموذجية: كبيرة الحجم، بها كثير من حبوب اللقاح والرحيق، وغالبًا فاتحة أو مخضرة اللون.", "للطالب: قراءة كتاب الطالب ص38، وملاحظة حشرات في حديقة المنزل. لولي الأمر: تنبيه الابن إلى عدم الاقتراب من النحل والدبابير أو لمسها أثناء الملاحظة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12"]}, {"n": 2, "topic": "نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية", "f": ["1. يخطط لاستقصاء ميداني لملاحظة الحشرات الملقحة\n2. يصمم جدولًا لتسجيل الملاحظات (اسم الزهرة، وصفها، التنبؤ، الحشرات، عدد المرات)\nمخرج تعليمي آخر: يتنبأ بكيفية تلقيح كل زهرة اعتمادًا على صفاتها", "المخرج 1 (يخطط لاستقصاء ميداني لملاحظة الحشرات الملقحة): تطبيق\nالمخرج 2 (يصمم جدولًا لتسجيل الملاحظات (اسم الزهرة، وصفها، التنبؤ، الحشرات، عدد المرات)): إبداع\nالمخرج الآخر (يتنبأ بكيفية تلقيح كل زهرة اعتمادًا على صفاتها): تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: ساعة إيقاف، لوح كتابة، صور أزهار حديقة المدرسة", "الملقحات، التنبؤ، التسجيل.", "يسأل المعلم: «لو أردنا أن نعرف أي الحشرات تزور أزهار حديقة مدرستنا أكثر، كيف نخطط لذلك بطريقة علمية؟».", "1. • التهيئة: يطرح المعلم السؤال، والطلبة يقترحون الملاحظة والعدّ (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • قراءة النشاط: يقرأ المعلم خطوات نشاط 2-6 ص38 ويوضح المطلوب، والطلبة يحددون: أربعة أنواع أزهار، ألوان زاهية وغير زاهية، الملاحظة نصف ساعة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تصميم الجدول: يعرض المعلم نموذج جدول ص39، والطلبة يرسمون الجدول: اسم الزهرة، وصفها، تنبأ كيف يتم تلقيحها، الحشرات التي تقف عليها، عدد المرات (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • التنبؤ: يعرض المعلم صور أزهار الحديقة، والطلبة يكتبون وصف كل زهرة وتنبؤهم بطريقة تلقيحها (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. • السلامة وتوزيع الأدوار: يوضح المعلم قواعد السلامة (عدم لمس الحشرات، الابتعاد عن خلايا النحل) ويوزع أدوار المراقبة والتوقيت والتسجيل؛ الغلق (دقيقتان) يحدد موعد الملاحظة الميدانية، والطلبة يدونون أدوارهم. يستعدون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ما الأداة التي نستخدمها لضبط زمن الملاحظة؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (مستوى التطبيق) اذكر ثلاثة أعمدة في جدول الملاحظة.\n   الإجابة النموذجية: اسم الزهرة، الحشرات التي تقف عليها، عدد المرات (أو الوصف والتنبؤ).\n3. (مستوى الاستدلال) لماذا نختار أزهارًا زاهية وأخرى غير زاهية؟\n   الإجابة النموذجية: لنقارن عدد الحشرات التي تزور كل نوع ونختبر تنبؤاتنا.", "1. (مستوى المعرفة) صح أم خطأ: يجب لمس النحلة لمعرفة نوعها.\n   الإجابة النموذجية: خطأ؛ نلاحظ من بعيد دون لمس.\n2. (مستوى التطبيق) ما مدة الملاحظة المقترحة في النشاط؟\n   الإجابة النموذجية: نصف ساعة.\n3. (مستوى الاستدلال) تنبأ: أي الأزهار سيزورها عدد أكبر من الحشرات؟ ولماذا؟\n   الإجابة النموذجية: الأزهار الزاهية ذات الرائحة والرحيق؛ لأنها تجذب الحشرات.", "للطالب: مراجعة الجدول والتنبؤات، وارتداء ملابس مناسبة للعمل الميداني. لولي الأمر: التأكد من خلو الابن من حساسية لسع النحل وإبلاغ المعلم إن وجدت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12"]}, {"n": 3, "topic": "نشاط 2-6: الملاحظة الميدانية للملقحات", "f": ["1. يلاحظ الحشرات التي تقف على الأزهار ويعدّ مرات زيارتها\n2. يسجل البيانات بدقة في الجدول\nمخرج تعليمي آخر: يقارن ملاحظاته بتنبؤاته", "المخرج 1 (يلاحظ الحشرات التي تقف على الأزهار ويعدّ مرات زيارتها): تطبيق\nالمخرج 2 (يسجل البيانات بدقة في الجدول): تطبيق\nالمخرج الآخر (يقارن ملاحظاته بتنبؤاته): تقييم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، الأقلام، أخرى: حديقة المدرسة، ساعة إيقاف، لوح كتابة، جداول التسجيل", "الملقحات، الملاحظة، البيانات.", "يجمع المعلم المجموعات عند مدخل الحديقة ويذكّر بقواعد السلامة والأدوار، ويطرح سؤال الملاحظة: «أي الحشرات تزور أزهارنا؟ وكم مرة؟».", "1. • التهيئة: يذكّر المعلم بالقواعد والأدوار، والطلبة يستعدون في مواقعهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الملاحظة والعدّ: يتنقل المعلم بين المجموعات ويضبط الوقت ويساعد في تمييز الحشرات، والطلبة يلاحظون الأزهار الأربع، ويسجلون الحشرات التي تقف عليها وعدد المرات (25 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تجميع البيانات: يعود المعلم بالطلاب إلى الصف ويطلب مجموع كل حشرة، والطلبة يجمعون الأعداد ويراجعون الجدول (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • الغلق: يسأل المعلم: هل تحققت تنبؤاتكم؟ والطلبة يقارنون مبدئيًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (مستوى المعرفة) ما الحشرة التي لاحظتها أكثر من غيرها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الملاحظة.\n2. (مستوى التطبيق) كم مرة زارت الحشرات الزهرة الأكثر زيارة؟\n   الإجابة النموذجية: تقبل الإجابة من الجدول.\n3. (مستوى الاستدلال) هل دعمت ملاحظاتك تنبؤك؟ وضّح.\n   الإجابة النموذجية: تقبل إجابة تقارن التنبؤ بالأعداد المسجلة.", "1. (مستوى المعرفة) صح أم خطأ: سجلنا عدد مرات وقوف الحشرات على كل زهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا نلاحظ مدة زمنية محددة لكل زهرة؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة بين الأزهار صحيحة.\n3. (مستوى الاستدلال) لو أعدت الملاحظة في يوم ممطر، هل تتوقع النتائج نفسها؟ لماذا؟\n   الإجابة النموذجية: لا غالبًا؛ لأن الحشرات تقل في المطر، فيجب تكرار الملاحظة في أيام مختلفة.", "للطالب: الاحتفاظ بجدول البيانات لرسم التمثيل البياني في الحصة القادمة. لولي الأمر: تشجيع الابن على تكرار الملاحظة في حديقة المنزل أو الحي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=12"]}, {"n": 4, "topic": "عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها", "f": ["1. يعرض نتائج الملاحظة بتمثيل بياني بالأعمدة\n2. يفسر النمط في الأزهار التي تزورها الحشرات\nمخرج تعليمي آخر: يقترح سببًا للنمط الملاحظ", "المخرج 1 (يعرض نتائج الملاحظة بتمثيل بياني بالأعمدة): تطبيق\nالمخرج 2 (يفسر النمط في الأزهار التي تزورها الحشرات): تحليل\nالمخرج الآخر (يقترح سببًا للنمط الملاحظ): تقييم", "التعلم الذاتي، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مربعات، جداول بيانات الملاحظة", "التمثيل البياني بالأعمدة، النمط، الملقحات.", "يعرض المعلم جدول بيانات إحدى المجموعات على السبورة ويسأل: «ما أسرع طريقة لنعرف بنظرة واحدة أي الأزهار زارتها الحشرات أكثر؟».", "1. • التهيئة: يعرض المعلم الجدول ويطرح السؤال، والطلبة يقترحون التمثيل البياني (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • رسم التمثيل: يراجع المعلم خطوات رسم الأعمدة، والطلبة يمثلون عدد زيارات الحشرات لكل زهرة بالأعمدة (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • أسئلة ص39: يناقش المعلم الأسئلة (1–4)، والطلبة يجيبون: الأزهار الأكثر زيارة، الحشرات المترددة، صحة التنبؤات، النمط (الأزهار الزاهية ذات الرائحة أكثر زيارة) وسببه (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • مقارنة: يطلب المعلم من المجموعات مقارنة تمثيلاتها، والطلبة يكتشفون أوجه التشابه والاختلاف (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يلخص المعلم النمط العام، والطلبة يكتبون الاستنتاج (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرف
