سؤال الملاحظة: «أي الحشرات تزور أزهارنا؟ وكم مرة؟».\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\nيعرض المعلم جدول بيانات إحدى المجموعات على السبورة ويسأل: «ما أسرع طريقة لنعرف بنظرة واحدة أي الأزهار زارتها الحشرات أكثر؟».\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\nيعرض المعلم صورة الطائر الطنان ص39 يمد منقاره الطويل داخل زهرة حمراء أنبوبية، ويسأل: «لماذا لا تزور الحشرات هذه الزهرة كثيرًا ويزورها الطائر؟».", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصور ويطرح السؤال، والطلبة يتوقعون أسبابًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • الحشرات الملقحة: يقرأ المعلم مع الطلاب ص38: تهوى الفراشات الأزهار الغنية بالرحيق، ويلقح النحل والخنافس والدبابير والنمل والعث الأزهار، والطلبة يكتبون قائمة بالحشرات الملقحة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • مطابقة زهرة وحشرة: يوزع المعلم بطاقات صفات أزهار (أنبوبية طويلة غنية بالرحيق، صفراء صغيرة كثيرة حبوب اللقاح، كبيرة بيضاء معطرة ليلًا…)، والطلبة يطابقون كل زهرة بالحشرة الأنسب ويبررون (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تحدث عن: يطرح المعلم سؤال ص39: العث يلقح الأزهار ليلًا، فما أنواع الأزهار التي يلقحها؟ والطلبة يستنتجون: أزهار فاتحة اللون (بيضاء) قوية الرائحة تُرى في المساء (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. • الغلق: يلخص المعلم: صفات الزهرة تدل على ملقّحها، والطلبة يذكرون مثالًا (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقترحون الملاحظة والعدّ (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • قراءة النشاط: يقرأ المعلم خطوات نشاط 2-6 ص38 ويوضح المطلوب، والطلبة يحددون: أربعة أنواع أزهار، ألوان زاهية وغير زاهية، الملاحظة نصف ساعة (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • تصميم الجدول: يعرض المعلم نموذج جدول ص39، والطلبة يرسمون الجدول: اسم الزهرة، وصفها، تنبأ كيف يتم تلقيحها، الحشرات التي تقف عليها، عدد المرات (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • التنبؤ: يعرض المعلم صور أزهار الحديقة، والطلبة يكتبون وصف كل زهرة وتنبؤهم بطريقة تلقيحها (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. • السلامة وتوزيع الأدوار: يوضح المعلم قواعد السلامة (عدم لمس الحشرات، الابتعاد عن خلايا النحل) ويوزع أدوار المراقبة والتوقيت والتسجيل؛ الغلق (دقيقتان) يحدد موعد الملاحظة الميدانية، والطلبة يدونون أدوارهم. يستعدون (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يذكّر المعلم بالقواعد والأدوار، والطلبة يستعدون في مواقعهم (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • الملاحظة والعدّ: يتنقل المعلم بين المجموعات ويضبط الوقت ويساعد في تمييز الحشرات، والطلبة يلاحظون الأزهار الأربع، ويسجلون الحشرات التي تقف عليها وعدد المرات (25 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. • تجميع البيانات: يعود المعلم بالطلاب إلى الصف ويطلب مجموع كل حشرة، والطلبة يجمعون الأعداد ويراجعون الجدول (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • الغلق: يسأل المعلم: هل تحققت تنبؤاتكم؟ والطلبة يقارنون مبدئيًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الجدول ويطرح السؤال، والطلبة يقترحون التمثيل البياني (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. • رسم التمثيل: يراجع المعلم خطوات رسم الأعمدة، والطلبة يمثلون عدد زيارات الحشرات لكل زهرة بالأعمدة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • أسئلة ص39: يناقش المعلم الأسئلة (1–4)، والطلبة يجيبون: الأزهار الأكثر زيارة، الحشرات المترددة، صحة التنبؤات، النمط (الأزهار الزاهية ذات الرائحة أكثر زيارة) وسببه (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • مقارنة: يطلب المعلم من المجموعات مقارنة تمثيلاتها، والطلبة يكتشفون أوجه التشابه والاختلاف (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. • الغلق: يلخص المعلم النمط العام، والطلبة يكتبون الاستنتاج (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6 — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • التحدي ص39: يوجه المعلم للبحث في المصادر عن سبب تلقيح الطيور للأزهار الحمراء، والطلبة يستنتجون أن الطيور ترى اللون الأحمر جيدًا، وأن الزهرة الأنبوبية العميقة يصل منقار الطائر الطويل إلى رحيقها (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • ورقة العمل 2-6: يقدم المعلم ورقة العمل ص71: أي ألوان الأزهار تجذب عددًا أكبر من الملقحات؟ والطلبة يحللون البيانات ويحددون النمط ويضعون تنبؤات (16 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • تحدث عن: يطرح المعلم سؤال العث والأزهار الليلية، والطلبة يناقشون (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n1. (مستوى المعرفة) اذكر ثلاث حشرات تلقح الأزهار.\n   الإجابة النموذجية: النحل، الفراشات، الخنافس (أو الدبابير، النمل، العث).\n2. (مستوى التطبيق) لماذا تهوى الفراشات الأزهار الغنية بالرحيق؟\n   الإجابة النموذجية: لأنها تتغذى على الرحيق.\n3. (مستوى الاستدلال) زهرة بيضاء كبيرة قوية الرائحة تتفتح مساءً، أي حشرة تلقحها غالبًا؟\n   الإجابة النموذجية: العث؛ لأنه ينشط ليلًا ويرى الأزهار الفاتحة ويجذبه العطر.\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية\n1. (مستوى المعرفة) ما الأداة التي نستخدمها لضبط زمن الملاحظة؟\n   الإجابة النموذجية: ساعة الإيقاف.\n2. (مستوى التطبيق) اذكر ثلاثة أعمدة في جدول الملاحظة.\n   الإجابة النموذجية: اسم الزهرة، الحشرات التي تقف عليها، عدد المرات (أو الوصف والتنبؤ).\n3. (مستوى الاستدلال) لماذا نختار أزهارًا زاهية وأخرى غير زاهية؟\n   الإجابة النموذجية: لنقارن عدد الحشرات التي تزور كل نوع ونختبر تنبؤاتنا.\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\n1. (مستوى المعرفة) ما الحشرة التي لاحظتها أكثر من غيرها؟\n   الإجابة النموذجية: تقبل الإجابة حسب الملاحظة.\n2. (مستوى التطبيق) كم مرة زارت الحشرات الزهرة الأكثر زيارة؟\n   الإجابة النموذجية: تقبل الإجابة من الجدول.\n3. (مستوى الاستدلال) هل دعمت ملاحظاتك تنبؤك؟ وضّح.\n   الإجابة النموذجية: تقبل إجابة تقارن التنبؤ بالأعداد المسجلة.\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n1. (مستوى المعرفة) ما نوع التمثيل المناسب لعرض عدد زيارات الحشرات لكل زهرة؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة.\n2. (مستوى التطبيق) ما الأزهار التي زارتها الحشرات أكثر في نتائجك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (غالبًا الزاهية ذات الرائحة).\n3. (مستوى الاستدلال) اقترح سببًا للنمط الذي لاحظته.\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق تجذب الحشرات.\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n1. (مستوى المعرفة) أي الكائنات تلقح معظم الأزهار الحمراء؟\n   الإجابة النموذجية: الطيور (كطائر الطنان).\n2. (مستوى التطبيق) لماذا يناسب منقار الطائر الطويل الأزهار الأنبوبية؟\n   الإجابة النموذجية: لأنه يصل إلى الرحيق في عمق الزهرة.\n3. (مستوى الاستدلال) تنبأ بالملقح المناسب لزهرة بيضاء معطرة تتفتح ليلًا.\n   الإجابة النموذجية: العث.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\n1. (مستوى المعرفة) صح أم خطأ: تفضل الحشرات المختلفة أنواعًا محددة من الأزهار.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الأزهار؟\n   الإجابة النموذجية: الألوان الزاهية والرائحة والرحيق.\n3. (مستوى الاستدلال) تنبأ بصفات زهرة تلقحها الخنافس.\n   الإجابة النموذجية: كبيرة الحجم، بها كثير من حبوب اللقاح والرحيق، وغالبًا فاتحة أو مخضرة اللون.\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية\n1. (مستوى المعرفة) صح أم خطأ: يجب لمس النحلة لمعرفة نوعها.\n   الإجابة النموذجية: خطأ؛ نلاحظ من بعيد دون لمس.\n2. (مستوى التطبيق) ما مدة الملاحظة المقترحة في النشاط؟\n   الإجابة النموذجية: نصف ساعة.\n3. (مستوى الاستدلال) تنبأ: أي الأزهار سيزورها عدد أكبر من الحشرات؟ ولماذا؟\n   الإجابة النموذجية: الأزهار الزاهية ذات الرائحة والرحيق؛ لأنها تجذب الحشرات.\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\n1. (مستوى المعرفة) صح أم خطأ: سجلنا عدد مرات وقوف الحشرات على كل زهرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) لماذا نلاحظ مدة زمنية محددة لكل زهرة؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة بين الأزهار صحيحة.\n3. (مستوى الاستدلال) لو أعدت الملاحظة في يوم ممطر، هل تتوقع النتائج نفسها؟ لماذا؟\n   الإجابة النموذجية: لا غالبًا؛ لأن الحشرات تقل في المطر، فيجب تكرار الملاحظة في أيام مختلفة.\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\n1. (مستوى المعرفة) صح أم خطأ: يجب أن تكون أعمدة التمثيل متساوية العرض.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الحشرات التي تزور الأزهار باستمرار في ملاحظتك؟\n   الإجابة النموذجية: تقبل الإجابة حسب البيانات (مثل النحل).\n3. (مستوى الاستدلال) لماذا قد تختلف نتائج مجموعتين لاحظتا الأزهار نفسها؟\n   الإجابة النموذجية: لاختلاف وقت الملاحظة أو أخطاء العدّ أو الطقس؛ لذا نكرر الملاحظة.\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\n1. (مستوى المعرفة) صح أم خطأ: تلقح الطيور بعض الأزهار.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الأزهار حسب ورقة العمل؟\n   الإجابة النموذجية: لون الزهرة ورائحتها ورحيقها.\n3. (مستوى الاستدلال) لماذا تستفيد الزهرة من زيارة ملقح محدد؟\n   الإجابة النموذجية: لأن الملقح ينقل حبوب لقاحها إلى أزهار من النوع نفسه فيزيد فرصة التلقيح.", "الحصة 1: الحشرات الملقِّحة وتفضيلاتها\nللطالب: قراءة كتاب الطالب ص38، وملاحظة حشرات في حديقة المنزل. لولي الأمر: تنبيه الابن إلى عدم الاقتراب من النحل والدبابير أو لمسها أثناء الملاحظة.\n\nالحصة 2: نشاط 2-6: التخطيط لملاحظة الملقحات الحشرية\nللطالب: مراجعة الجدول والتنبؤات، وارتداء ملابس مناسبة للعمل الميداني. لولي الأمر: التأكد من خلو الابن من حساسية لسع النحل وإبلاغ المعلم إن وجدت.\n\nالحصة 3: نشاط 2-6: الملاحظة الميدانية للملقحات\nللطالب: الاحتفاظ بجدول البيانات لرسم التمثيل البياني في الحصة القادمة. لولي الأمر: تشجيع الابن على تكرار الملاحظة في حديقة المنزل أو الحي.\n\nالحصة 4: عرض نتائج الملاحظة بالتمثيل البياني وتفسيرها\nللطالب: إكمال التمثيل البياني وكتابة الاستنتاج، وحل تمرين 2-6 بكتاب النشاط ص28. لولي الأمر: متابعة إنجاز التمرين ومناقشة الاستنتاج مع الابن.\n\nالحصة 5: التحدي: الطيور والأزهار الحمراء وورقة العمل 2-6\nللطالب: إكمال ورقة العمل 2-6 ص71، ومراجعة دروس التلقيح استعدادًا لدرس دورة حياة النبات. لولي الأمر: إحضار بذور فول أو عدس لزراعتها ومتابعة دورة حياة النبات في المنزل.\n🎮 رابط ألعاب ونشاط ال ئة العُمانية): تطبيق", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "دورة حياة، النباتات الحولية، النباتات المعمرة.", "يعرض المعلم صورة لنخلة وصورة لنبات فول، ويسأل: «النخلة تثمر كل عام لسنوات طويلة، فهل يفعل نبات الفول ذلك؟».", "1. • التهيئة: يعرض المعلم الصورتين ويطرح السؤال، والطلبة يتوقعون (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • دورة حياة الفول (س2): يعرض المعلم المراحل المبعثرة: زهرة، شتلة، قرن فول، نبات ناضج، بذرة، ويرتبونها الطالب: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول، ويرسمون الدورة ويسمون المراحل (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • س3 وس4: يناقش المعلم: لماذا نرسم الدورة في دائرة؟ وأمثلة لنبات يموت بعد إنتاج البذور وآخر يزهر كل عام، والطلبة يجيبون: الفول/الطماطم/الذرة تموت، والخوخ/البرتقال/الصبار تزهر كل عام (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • تحدث عن: يقدم المعلم مفهومي النباتات الحولية والمعمرة، والطلبة يصنفون أمثلة من البيئة العُمانية (النخلة، السدر: معمرة؛ القمح، الطماطم: حولية) (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) رتب مراحل دورة حياة الفول.\n   الإجابة النموذجية: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول (به بذور).\n2. (مستوى التطبيق) اذكر نباتًا يموت بعد إنتاج البذور.\n   الإجابة النموذجية: الفول أو الطماطم أو الذرة.\n3. (مستوى الاستدلال) ما الفرق بين النبات الحولي والنبات المعمر؟\n   الإجابة النموذجية: الحولي يكمل دورة حياته في موسم واحد ثم يموت، والمعمر يعيش سنوات ويزهر وينتج البذور كل عام.", "1. (مستوى المعرفة) صح أم خطأ: النخلة نبات معمر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر نباتًا يزهر وينتج البذور كل عام.\n   الإجابة النموذجية: الخوخ أو البرتقال أو النخيل.\n3. (مستوى الاستدلال) لماذا ترسم دورة حياة النبات في دائرة لا في خط مستقيم؟\n   الإجابة النموذجية: لأن المراحل تتكرر بلا توقف؛ فبذور النبات تبدأ دورة جديدة.", "للطالب: حل تمرين 2-7 بكتاب النشاط ص29، ومراجعة الوحدة الثانية استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة الثانية مع الا  والنباتات الحولية والمعمرة\nالتعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب", "الحصة 1: مراحل دورة حياة النبات الزهري\nالكتاب، السبورة الذكية، صورة توضيحية، عروض تقديمية\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nالكتاب، السبورة الذكية، صورة توضيحية، أخرى: ورقة المصادر 2-7 (بطاقات دورة الحياة) ص47، مقص\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nالكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: مراحل دورة حياة النبات الزهري\nدورة حياة، الإنبات، التلقيح، الإخصاب، انتشار البذور.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nدورة حياة، شتلة، نبات ناضج.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nدورة حياة، النباتات الحولية، النباتات المعمرة.", "الحصة 1: مراحل دورة حياة النبات الزهري\nيسأل المعلم: «تذكّروا كل ما درسناه: البذور، الإنبات، الأزهار، التلقيح، انتشار البذور. هل يمكننا ترتيبها في قصة واحدة لحياة نبات؟».\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nيعرض المعلم صورًا مبعثرة لمراحل نبات الطماطم (ثمرة، بذرة، شتلة، نبات ناضج مزهر) ويطلب ترتيبها بسرعة.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nيعرض المعلم صورة لنخلة وصورة لنبات فول، ويسأل: «النخلة تثمر كل عام لسنوات طويلة، فهل يفعل نبات الفول ذلك؟».", "الحصة 1: مراحل دورة حياة النبات الزهري — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال ويكتب المفاهيم السابقة مبعثرة، والطلبة يقترحون ترتيبًا أوليًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • مخطط دورة الحياة: يشرح المعلم مخطط ص40: الإنبات ← النمو ← التلقيح والإخصاب (الإزهار) ← إنتاج البذور (ثمرة) ← انتشار البذور ← إنبات من جديد، والطلبة يرسمون المخطط الدائري ويكتبون ما يحدث في كل مرحلة (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • ربط المراحل بالدروس: يربط كل مرحلة بالدرس الذي درسوه، والطلبة يذكرون معلومة رئيسية عن كل مرحلة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • لماذا دائرة؟: يسأل المعلم: لماذا رسمنا الدورة على شكل دائرة؟ والطلبة يستنتجون أنها تتكرر باستمرار ولا تتوقف (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. • الغلق: يذكر المعلم أن بعض النباتات تموت بعد إنتاج البذور وبعضها يزهر كل عام، والطلبة يذكرون مثالًا متوقعًا لكل نوع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصور المبعثرة، ويرتبونها الطالب شفهيًا (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • بطاقات دورة الحياة: يوزع المعلم ورقة المصادر 2-7 ص47 على الثنائيات، والطلبة يقصون البطاقات ويرتبونها في دائرة ويشرح كل طالب لزميله مرحلة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • دورة حياة الطماطم (س1): يعرض المعلم مخطط ص41 وجدول السؤال الأول، والطلبة يكتبون مرحلة حياة الطماطم والعملية التي تحدث فيها (ثمرة ← بذرة: انتشار، بذرة ← شتلة: إنبات، شتلة ← نبات ناضج: نمو، نبات ← زهرة: تلقيح وإخصاب) (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • تقييم الأقران: يطلب المعلم من الثنائيات تبادل الجداول، والطلبة يتحققون من إجابات زملائهم (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. • الغلق: يسأل المعلم سؤالًا ختاميًا، والطلبة يذكرون مرحلتين متتاليتين (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورتين ويطرح السؤال، والطلبة يتوقعون (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • دورة حياة الفول (س2): يعرض المعلم المراحل المبعثرة: زهرة، شتلة، قرن فول، نبات ناضج، بذرة، ويرتبونها الطالب: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول، ويرسمون الدورة ويسمون المراحل (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • س3 وس4: يناقش المعلم: لماذا نرسم الدورة في دائرة؟ وأمثلة لنبات يموت بعد إنتاج البذور وآخر يزهر كل عام، والطلبة يجيبون: الفول/الطماطم/الذرة تموت، والخوخ/البرتقال/الصبار تزهر كل عام (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • تحدث عن: يقدم المعلم مفهومي النباتات الحولية والمعمرة، والطلبة يصنفون أمثلة من البيئة العُمانية (النخلة، السدر: معمرة؛ القمح، الطماطم: حولية) (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: مراحل دورة حياة النبات الزهري\n1. (مستوى المعرفة) ما المرحلة الأولى في دورة حياة النبات؟\n   الإجابة النموذجية: الإنبات.\n2. (مستوى التطبيق) ماذا يحدث في مرحلة انتشار البذور؟\n   الإجابة النموذجية: تنتقل البذور بعيدًا عن النبات الأصلي.\n3. (مستوى الاستدلال) لماذا نرسم دورة الحياة على شكل دائرة؟\n   الإجابة النموذجية: لأن مراحلها تتكرر باستمرار؛ فالبذور تنبت وتكوّن نباتات جديدة تنتج بذورًا وهكذا.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\n1. (مستوى المعرفة) ما المرحلة التي تأتي بعد الشتلة؟\n   الإجابة النموذجية: النبات الناضج.\n2. (مستوى التطبيق) ما العملية التي تحول البذرة إلى شتلة؟\n   الإجابة النموذجية: الإنبات.\n3. (مستوى الاستدلال) اشرح ما يحدث بين مرحلتي الزهرة والثمرة.\n   الإجابة النموذجية: تُلقّح الزهرة وتُخصب البويضات، فينمو المبيض ليكوّن ثمرة بداخلها بذور.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n1. (مستوى المعرفة) رتب مراحل دورة حياة الفول.\n   الإجابة النموذجية: بذرة ← شتلة ← نبات ناضج ← زهرة ← قرن فول (به بذور).\n2. (مستوى التطبيق) اذكر نباتًا يموت بعد إنتاج البذور.\n   الإجابة النموذجية: الفول أو الطماطم أو الذرة.\n3. (مستوى الاستدلال) ما الفرق بين النبات الحولي والنبات المعمر؟\n   الإجابة النموذجية: الحولي يكمل دورة حياته في موسم واحد ثم يموت، والمعمر يعيش سنوات ويزهر وينتج البذور كل عام.", "الحصة 1: مراحل دورة حياة النبات الزهري\n1. (مستوى المعرفة) رتب: انتشار البذور – الإنبات – التلقيح – النمو.\n   الإجابة النموذجية: الإنبات ← النمو ← التلقيح ← انتشار البذور.\n2. (مستوى التطبيق) ما المرحلة التي تأتي بعد التلقيح والإخصاب؟\n   الإجابة النموذجية: إنتاج البذور (تكوّن الثمرة).\n3. (مستوى الاستدلال) ماذا يحدث لدورة الحياة إذا لم تنتشر البذور أبدًا؟\n   الإجابة النموذجية: تتزاحم الشتلات ولا تجد ما يكفيها فتضعف، وقد لا تكتمل الدورة جيدًا.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\n1. (مستوى المعرفة) صح أم خطأ: الشتلة نبات صغير نما من بذرة.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما العملية التي تحدث عندما يتحول النبات الناضج إلى نبات مزهر يكوّن البذور؟\n   الإجابة النموذجية: التلقيح والإخصاب.\n3. (مستوى الاستدلال) لماذا نحتاج إلى ترتيب دقيق لمراحل دورة الحياة؟\n   الإجابة النموذجية: لأن كل مرحلة تعتمد على ما قبلها؛ فلا ثمرة دون زهرة ملقحة، ولا نبات دون إنبات.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\n1. (مستوى المعرفة) صح أم خطأ: النخلة نبات معمر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر نباتًا يزهر وينتج البذور كل عام.\n   الإجابة النموذجية: الخوخ أو البرتقال أو النخيل.\n3. (مستوى الاستدلال) لماذا ترسم دورة حياة النبات في دائرة لا في خط مستقيم؟\n   الإجابة النموذجية: لأن المراحل تتكرر بلا توقف؛ فبذور النبات تبدأ دورة جديدة.", "الحصة 1: مراحل دورة حياة النبات الزهري\nللطالب: قراءة كتاب الطالب ص40، ورسم دورة حياة النبات في الدفتر. لولي الأمر: زراعة بذرة فول مع الابن ومتابعة مراحل نموها وتصويرها.\n\nالحصة 2: بطاقات دورة الحياة ودورة حياة نبات الطماطم\nللطالب: الاحتفاظ ببطاقات دورة الحياة ومراجعتها، وقراءة السؤال الثاني ص41. لولي الأمر: مراجعة ترتيب المراحل مع الابن باستخدام البطاقات.\n\nالحصة 3: دورة حياة نبات الفول والنباتات الحولية والمعمرة\nللطالب: حل تمرين 2-7 بكتاب النشاط ص29، ومراجعة الوحدة الثانية استعدادًا لدرس «تحقق من تقدمك». لولي الأمر: مراجعة مفردات الوحدة الثانية مع الابن (التلقيح، الإخصاب، الرحيق، السداة، الكربلة، انتشار البذور).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=13"]}, {"code": "2-8", "title": "تحقق من تقدمك", "unit": 2, "dates": "الأسبوع التاسع (1–5/11/2026م)", "sb": "42–43", "tb": "54–57", "ab": "المراجعة اللغوية ص30", "periods": [{"n": 1, "topic": "مراجعة: انتشار البذور وأجزاء الزهرة (س1–س2)", "f": ["1. يشرح عملية انتشار البذور وأهميتها وطرقها\n2. يسمي أجزاء الزهرة ويحدد الأجزاء التي تكوّن البذور\nمخرج تعليمي آخر: يفسر طريقة انتشار بذرتين من شكليهما مع التعليل", "المخرج 1 (يشرح عملية انتشار البذور وأهميتها وطرقها): فهم\nالمخرج 2 (يسمي أجزاء الزهرة ويحدد الأجزاء التي تكوّن البذور): تذكر\nالمخرج الآخر (يفسر طريقة انتشار بذرتين من شكليهما مع التعليل): تحليل", "التعلم التعاوني، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام", "انتشار البذور، المتك، الميسم، المبيض، البويضا ئات ويصفونها (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • أمثلة يومية: يطلب المعلم أمثلة على التبخر، والطلبة يذكرون: جفاف الملابس، الطرق بعد المطر، الأطباق بعد الغسل (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. • الغلق: يسأل المعلم: أين ذهب ماء البركة؟ والطلبة يجيبون: تبخر وأصبح بخار ماء في الهواء (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرفة) ما التبخر؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الحالة الغازية.\n2. (مستوى التطبيق) ماذا نسمي الماء في الحالة الغازية؟\n   الإجابة النموذجية: بخار الماء.\n3. (مستوى الاستدلال) لماذا تتحرك جزيئات الماء أسرع عند تسخينه؟\n   الإجابة النموذجية: لأنها تكتسب طاقة حرارية.", "1. (مستوى المعرفة) أكمل: سائل + …… ← غاز.\n   الإجابة النموذجية: حرارة.\n2. (مستوى التطبيق) اذكر مثالين على التبخر من حياتك اليومية.\n   الإجابة النموذجية: جفاف الملابس المبللة، جفاف بركة الماء (أو جفاف الأطباق).\n3. (مستوى الاستدلال) فسّر بلغة الجزيئات كيف يغادر الماء سطح البركة.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة حرارية فتتحرك أسرع وتتباعد حتى تنفصل عن سطح السائل وتنتقل إلى الهواء.", "للطالب: قراءة كتاب الطالب ص44، وملاحظة أمثلة على التبخر في المنزل. لولي الأمر: إحضار ورقة ملونة (أو منديل ملون) لنشاط الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}, {"n": 2, "topic": "نشاط 3-1أ: أين يذهب الماء؟", "f": ["1. ينفذ نشاطًا يلاحظ فيه تبخر الماء من سطح الورقة\n2. يفسر اختفاء البقعة المبتلة بحدوث التبخر\nمخرج تعليمي آخر: يتنبأ بالعوامل التي قد تسرّع جفاف البقعة", "المخرج 1 (ينفذ نشاطًا يلاحظ فيه تبخر الماء من سطح الورقة): تطبيق\nالمخرج 2 (يفسر اختفاء البقعة المبتلة بحدوث التبخر): فهم\nالمخرج الآخر (يتنبأ بالعوامل التي قد تسرّع جفاف البقعة): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: كؤوس زجاجية بها ماء، أوراق ملونة، طباشير", "التبخر، بخار الماء.", "يرسم المعلم بقعة ماء على السبورة بإسفنجة مبللة، ويطلب من الطلاب مراقبتها طوال الحصة، ويسأل: «ماذا سيحدث لهذه البقعة؟».", "1. • التهيئة: يرسم المعلم البقعة ويطرح السؤال، والطلبة يتنبؤون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. 1أ: يوجه المجموعات وفق ص44، والطلبة يغمسون أصابعهم في الماء، ويضعونها على الورقة لتحدث بقعة مبتلة، ثم يتركونها دقائق ويلمسونها (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • التفسير: يسأل المعلم: هل البقعة مبتلة أم جافة؟ أين ذهب الماء؟ والطلبة يستنتجون أن الماء تبخر وانتقل إلى الهواء (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • المقارنة: يقارن المعلم بين بقعة السبورة وبقع الأوراق، والطلبة يقترحون عوامل قد تسرع الجفاف: الدفء، تحريك الهواء (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يعرض المعلم فكرة رسم محيط بركة بالطباشير ومتابعتها، والطلبة يخططون لمتابعة بركة أو بقعة ماء في الفناء (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) هل بقيت البقعة على الورقة مبتلة بعد دقائق؟\n   الإجابة النموذجية: لا، جفت.\n2. (مستوى التطبيق) أين ذهب الماء من الورقة؟\n   الإجابة النموذجية: تبخر وانتقل إلى الهواء على شكل بخار ماء.\n3. (مستوى الاستدلال) تنبأ: هل تجف البقعة أسرع تحت أشعة الشمس أم في الظل؟ لماذا؟\n   الإجابة النموذجية: تحت الشمس؛ لأن الحرارة تسرع التبخر.", "1. (مستوى المعرفة) صح أم خطأ: يختفي الماء من الورقة لأنه يتبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الحالة التي تحول إليها الماء؟\n   الإجابة النموذجية: الحالة الغازية (بخار الماء).\n3. (مستوى الاستدلال) اقترح طريقة لجعل البقعة تجف أسرع، وفسّر.\n   الإجابة النموذجية: تحريك الهواء فوقها أو تدفئتها؛ لأن ذلك يسرع التبخر.", "للطالب: رسم محيط بقعة ماء بالطباشير في فناء المنزل وملاحظتها بعد ساعة. لولي الأمر: مساعدة الابن في التجربة ومناقشة النتيجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}, {"n": 3, "topic": "نشاط 3-1ب: مقارنة التبخر (الإعداد)", "f": ["1. يخطط لمقارنة سرعة تبخر الماء في مكان دافئ ومكان بارد\n2. يقيس حجم الماء باستخدام المخبار المدرج بدقة\nمخرج تعليمي آخر: يحدد العامل المتغير والعوامل الثابتة في الاستقصاء", "المخرج 1 (يخطط لمقارنة سرعة تبخر الماء في مكان دافئ ومكان بارد): تطبيق\nالمخرج 2 (يقيس حجم الماء باستخدام المخبار المدرج بدقة): تطبيق\nالمخرج الآخر (يحدد العامل المتغير والعوامل الثابتة في الاستقصاء): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: كأسان زجاجيتان متماثلتان، مخبار مدرج، قلم تخطيط، ماء", "التبخر، الحجم، الاختبار العادل.", "يسأل المعلم: «لماذا تنشر أمك الملابس المغسولة في الشمس لا في الغرفة المظلمة الباردة؟»، ثم يطرح سؤال الاستقصاء: هل يؤثر الدفء في سرعة التبخر؟", "1. • التهيئة: يطرح المعلم السؤال، والطلبة يقترحون أن الحرارة تسرع الجفاف (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • قراءة الخطوات: يقرأ المعلم نشاط 3-1ب ص45، والطلبة يحددون الأدوات والخطوات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • قياس الحجم: يوضح المعلم طريقة قراءة المخبار المدرج من مستوى النظر وقراءة أسفل التقعر (مهارات ص64)، والطلبة يتدربون على قراءة المخبار (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • الإعداد: يتابع المجموعات، والطلبة يضعون 100 ml في كل كأس، ويضعون علامة عند مستوى الماء، ويضعون إحدى الكأسين في مكان دافئ والأخرى في مكان بارد (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الاختبار العادل: يسأل المعلم: ما الذي غيرناه؟ وما الذي أبقيناه ثابتًا؟ والطلبة يحددون: المتغير هو المكان (الدفء)، والثابت كمية الماء ونوع الكأس (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يحدد المعلم موعد الملاحظة بعد يومين، والطلبة يكتبون تنبؤهم (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) كم مليلترًا من الماء وضعنا في كل كأس؟\n   الإجابة النموذجية: 100 ml.\n2. (مستوى التطبيق) كيف نقرأ حجم الماء في المخبار المدرج بدقة؟\n   الإجابة النموذجية: نضع المخبار على سطح مستوٍ، وننظر في مستوى سطح السائل، ونقرأ عند قاع التقعر.\n3. (مستوى الاستدلال) ما العامل الذي غيرناه في هذا النشاط؟\n   الإجابة النموذجية: مكان الكأس (دافئ أو بارد).", "1. (مستوى المعرفة) صح أم خطأ: استخدمنا كأسين مختلفتين في الحجم.\n   الإجابة النموذجية: خطأ؛ كأسان متماثلتان.\n2. (مستوى التطبيق) لماذا وضعنا علامة عند مستوى الماء؟\n   الإجابة النموذجية: لنقارن مستوى الماء بعد يومين ونعرف كم تبخر.\n3. (مستوى الاستدلال) تنبأ: أي الكأسين سيقل فيها الماء أكثر؟ ولماذا؟\n   الإجابة النموذجية: الكأس في المكان الدافئ؛ لأن الحرارة تسرع التبخر.", "للطالب: قراءة صفحة مهارات قياس حجم السائل ص64 في كتاب الطالب. لولي الأمر: تنفيذ تجربة مشابهة بكوبين في المنزل (نافذة مشمسة / مكان بارد) ومتابعتها مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}, {"n": 4, "topic": "نتائج نشاط 3-1ب وأسئلة الدرس", "f": ["1. يقارن مستوى الماء في الكأسين بعد يومين ويستنتج أثر الدفء في التبخر\n2. يوضح أن التسخين يزيد سرعة التبخر\nمخرج تعليمي آخر: يفسر سبب جفاف الملابس أسرع في الأيام الحارة", "المخرج 1 (يقارن مستوى الماء في الكأسين بعد يومين ويستنتج أثر الدفء في التبخر): تحليل\nالمخرج 2 (يوضح أن التسخين يزيد سرعة التبخر): فهم\nالمخرج الآخر (يفسر سبب جفاف الملابس أسرع في الأيام الحارة): تطبيق", "التعلم بالاكتشاف، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: كأسا نشاط 3-1ب، مخبار مدرج", "التبخر، الطاقة الحرارية.", "يحضر المعلم الكأسين ويطلب من طالبين وصف مستوى الماء في كل منهما مقارنة بالعلامة دون قياس، ثم يسأل: «هل تحقق تنبؤكم؟».", "1. • التهيئة: يعرض المعلم الكأسين، والطلبة يصفون الفرق (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • القياس والمقارنة: يوجه المعلم إلى وضع علامة جديدة وقياس الماء المتبقي بالمخبار، والطلبة يقيسون ويسجلون ويحسبون كمية الماء المتبخرة من كل كأس (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • الاستنتاج: يناقش المعلم: لماذا تبخر ماء أكثر من الكأس الدافئة؟ والطلبة يستنتجون أن الحرارة تكسب الجزيئات طاقة فيسرع التبخر (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • أسئلة ص45: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن تغير المستوى والكأس الأقل ماءً وجفاف الملابس في الأيام الحارة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • تمرين 3-1: يقدم المعلم تمرين 3-1 بكتاب النشاط ص31، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرفة) في أي الكأسين قلّ الماء أكثر؟\n   الإجابة النموذجية: الكأس الموضوعة في المكان الدافئ.\n2. (مستوى التطبيق) كم مليلترًا تبخر من كأس بقي فيها 85 ml من أصل 100 ml؟\n   الإجابة النموذجية: 15 ml.\n3. (مستوى الاستدلال) لماذا تبخر الماء أسرع في الكأس الدافئة؟\n   الإجابة النموذجية: لأن الحرارة تكسب جزيئات الماء طاقة فتتحرك أسرع وتنفصل عن السطح.", "1. (مستوى المعرفة) صح أم خطأ: بقي مستوى الماء في الكأسين كما هو.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا تجف الملابس أسرع في الأيام الحارة؟\n   الإجابة النموذجية: لأن الحرارة تزيد سرعة تبخر الماء منها.\n3. (مستوى الاستدلال) كأس فيها 100 ml بقي فيها بعد يومين 70 ml في مكان دافئ و90 ml في مكان بارد. كم الفرق في الماء المتبخر بين الكأسين؟\n   الإجابة النموذجية: المتبخر في الدافئ 30 ml، وفي البارد 10 ml، والفرق 20 ml.", "للطالب: إكمال تمرين 3-1 بكتاب النشاط ص31. لولي الأمر: إحضار عينات صغيرة من سوائل آمنة (ماء، عصير، زيت طبخ) في علب صغيرة لاستقصاء الحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}, {"n": 5, "topic": "ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى", "f": ["1. يخطط لاختبار عادل لمعرفة أي السوائل أسرع تبخرًا\n2. يحدد ما سيقيسه وما سيغيره وما سيثبته\nمخرج تعليمي آخر: يقيّم ما إذا كانت الأدلة كافية للتوصل إلى استنتاج", "المخرج 1 (يخطط لاختبار عادل لمعرفة أي السوائل أسرع تبخرًا): تطبيق\nالمخرج 2 (يحدد ما سيقيسه وما سيغيره وما سيثبته): تحليل\nالمخرج الآخر (يقيّم ما إذا كانت الأدلة كافية للتوصل إلى استنتاج): تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة العمل 3-1 ص73، سوائل آمنة (ماء، عصير، زيت)، أطباق متماثلة، مخبار مدرج", "التبخر، الاختبار العادل، المتغير.", "يعرض المعلم ثلاثة أطباق متماثلة بها ماء وعصير وزيت طبخ، ويسأل: «هل تتبخر كل السوائل بالسرعة نفسها؟ كيف نعرف؟».", "1. • التهيئة: يعرض المعلم الأطباق ويطرح السؤال، والطلبة يتنبؤون (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التخطيط بورقة العمل: يقدم المعلم ورقة العمل 3-1 ص73 ويناقش: ما الذي نغيره؟ ما الذي نقيسه؟ ما الذي نثبته؟ والطلبة يكتبون: نغير نوع السائل، نقيس الحجم المتبقي بعد مدة، نثبت الحجم الأولي والأطباق والمكان (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • الإعداد: يتابع المجموعات، والطلبة يضعون الحجم نفسه من كل سائل في أطباق متماثلة في المكان نفسه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • كفاية الأدلة: يسأل المعلم: هل تكفي تجربة واحدة؟ لماذا يكرر العلماء تجاربهم؟ والطلبة يستنتجون أهمية التكرار (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما العامل الذي نغيره في هذا الاستقصاء؟\n   الإجابة النموذجية: نوع السائل.\n2. (مستوى التطبيق) ما الذي يجب أن نثبته ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: الحجم الأولي للسوائل، ونوع الأطباق وحجمها، والمكان، والمدة.\n3. (مستوى الاستدلال) لماذا يكرر العلماء التجربة عدة مرات؟\n   الإجابة النموذجية: للتأكد من صحة النتائج وأنهم لم يرتكبوا أخطاء في التنفيذ أو القياس.", "1. (مستوى المعرفة) صح أم خطأ: نضع كميات مختلفة من السوائل في الأطباق.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) ما الأداة التي نقيس بها حجم السائل المتبقي؟\n   الإجابة النموذجية: المخبار المدرج.\n3. (مستوى الاستدلال) إذا أجريت التجربة مرة واحدة وتبخر العصير أسرع، هل يمكنك تعميم النتيجة؟ وضّح.\n   الإجابة النموذجية: لا؛ يجب تكرار التجربة للتأكد قبل وضع الاستنتاج.", "للطالب: متابعة أطباق السوائل يوميًا وتسجيل الحجم المتبقي في ورقة العمل 3-1 ص73. لولي الأمر: مناقشة الابن في نتائج الاستقصاء ومساعدته على كتابة الاستنتاج.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}], "combined": ["الحصة 1: مفهوم التبخر وبخار الماء\n1. يعرّف التبخر بأنه تحول المادة من الحالة السائلة إلى الحالة الغازية\n2. يفسر حدوث التبخر باكتساب جزيئات السائل طاقة حرارية\nمخرج تعليمي آخر: يعطي أمثلة على التبخر من الحياة اليومية\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\n1. ينفذ نشاطًا يلاحظ فيه تبخر الماء من سطح الورقة\n2. يفسر اختفاء البقعة المبتلة بحدوث التبخر\nمخرج تعليمي آخر: يتنبأ بالعوامل التي قد تسرّع جفاف البقعة\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n1. يخطط لمقارنة سرعة تبخر الماء في مكان دافئ ومكان بارد\n2. يقيس حجم الماء باستخدام المخبار المدرج بدقة\nمخرج تعليمي آ ة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nيعرض المعلم ثلاثة أطباق متماثلة بها ماء وعصير وزيت طبخ، ويسأل: «هل تتبخر كل السوائل بالسرعة نفسها؟ كيف نعرف؟».", "الحصة 1: مفهوم التبخر وبخار الماء — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون: يجف، تشربه الأرض، يصعد للهواء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • حالات المادة: يراجع المعلم حالات المادة الثلاث (صلبة، سائلة، غازية) بأمثلة، والطلبة يصنفون أمثلة معروضة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • مفهوم التبخر: يشرح المعلم من ص44: عند تسخين السائل بشكل كافٍ يتحول إلى غاز، وبخار الماء هو الماء في الحالة الغازية. ويكتب: سائل + حرارة ← غاز، والطلبة يكتبون التعريف والمعادلة اللفظية (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يعرض المعلم رسم الوعاء ص44 ويمثّل بطلاب «جزيئات» تتحرك ببطء ثم تكتسب طاقة فتتحرك أسرع وتتباعد ويغادر بعضها «سطح السائل»، والطلبة يمثلون حركة الجزيئات ويصفونها (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • أمثلة يومية: يطلب المعلم أمثلة على التبخر، والطلبة يذكرون: جفاف الملابس، الطرق بعد المطر، الأطباق بعد الغسل (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. • الغلق: يسأل المعلم: أين ذهب ماء البركة؟ والطلبة يجيبون: تبخر وأصبح بخار ماء في الهواء (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟ — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يرسم المعلم البقعة ويطرح السؤال، والطلبة يتنبؤون (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. 1أ: يوجه المجموعات وفق ص44، والطلبة يغمسون أصابعهم في الماء، ويضعونها على الورقة لتحدث بقعة مبتلة، ثم يتركونها دقائق ويلمسونها (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • التفسير: يسأل المعلم: هل البقعة مبتلة أم جافة؟ أين ذهب الماء؟ والطلبة يستنتجون أن الماء تبخر وانتقل إلى الهواء (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • المقارنة: يقارن المعلم بين بقعة السبورة وبقع الأوراق، والطلبة يقترحون عوامل قد تسرع الجفاف: الدفء، تحريك الهواء (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. • الغلق: يعرض المعلم فكرة رسم محيط بركة بالطباشير ومتابعتها، والطلبة يخططون لمتابعة بركة أو بقعة ماء في الفناء (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد) — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقترحون أن الحرارة تسرع الجفاف (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • قراءة الخطوات: يقرأ المعلم نشاط 3-1ب ص45، والطلبة يحددون الأدوات والخطوات (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • قياس الحجم: يوضح المعلم طريقة قراءة المخبار المدرج من مستوى النظر وقراءة أسفل التقعر (مهارات ص64)، والطلبة يتدربون على قراءة المخبار (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. • الإعداد: يتابع المجموعات، والطلبة يضعون 100 ml في كل كأس، ويضعون علامة عند مستوى الماء، ويضعون إحدى الكأسين في مكان دافئ والأخرى في مكان بارد (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الاختبار العادل: يسأل المعلم: ما الذي غيرناه؟ وما الذي أبقيناه ثابتًا؟ والطلبة يحددون: المتغير هو المكان (الدفء)، والثابت كمية الماء ونوع الكأس (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. • الغلق: يحدد المعلم موعد الملاحظة بعد يومين، والطلبة يكتبون تنبؤهم (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الكأسين، والطلبة يصفون الفرق (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • القياس والمقارنة: يوجه المعلم إلى وضع علامة جديدة وقياس الماء المتبقي بالمخبار، والطلبة يقيسون ويسجلون ويحسبون كمية الماء المتبخرة من كل كأس (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. • الاستنتاج: يناقش المعلم: لماذا تبخر ماء أكثر من الكأس الدافئة؟ والطلبة يستنتجون أن الحرارة تكسب الجزيئات طاقة فيسرع التبخر (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • أسئلة ص45: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن تغير المستوى والكأس الأقل ماءً وجفاف الملابس في الأيام الحارة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. • تمرين 3-1: يقدم المعلم تمرين 3-1 بكتاب النشاط ص31، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الأطباق ويطرح السؤال، والطلبة يتنبؤون (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. • التخطيط بورقة العمل: يقدم المعلم ورقة العمل 3-1 ص73 ويناقش: ما الذي نغيره؟ ما الذي نقيسه؟ ما الذي نثبته؟ والطلبة يكتبون: نغير نوع السائل، نقيس الحجم المتبقي بعد مدة، نثبت الحجم الأولي والأطباق والمكان (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. • الإعداد: يتابع المجموعات، والطلبة يضعون الحجم نفسه من كل سائل في أطباق متماثلة في المكان نفسه (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. • كفاية الأدلة: يسأل المعلم: هل تكفي تجربة واحدة؟ لماذا يكرر العلماء تجاربهم؟ والطلبة يستنتجون أهمية التكرار (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "الحصة 1: مفهوم التبخر وبخار الماء\n1. (مستوى المعرفة) ما التبخر؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الحالة الغازية.\n2. (مستوى التطبيق) ماذا نسمي الماء في الحالة الغازية؟\n   الإجابة النموذجية: بخار الماء.\n3. (مستوى الاستدلال) لماذا تتحرك جزيئات الماء أسرع عند تسخينه؟\n   الإجابة النموذجية: لأنها تكتسب طاقة حرارية.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\n1. (مستوى المعرفة) هل بقيت البقعة على الورقة مبتلة بعد دقائق؟\n   الإجابة النموذجية: لا، جفت.\n2. (مستوى التطبيق) أين ذهب الماء من الورقة؟\n   الإجابة النموذجية: تبخر وانتقل إلى الهواء على شكل بخار ماء.\n3. (مستوى الاستدلال) تنبأ: هل تجف البقعة أسرع تحت أشعة الشمس أم في الظل؟ لماذا؟\n   الإجابة النموذجية: تحت الشمس؛ لأن الحرارة تسرع التبخر.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n1. (مستوى المعرفة) كم مليلترًا من الماء وضعنا في كل كأس؟\n   الإجابة النموذجية: 100 ml.\n2. (مستوى التطبيق) كيف نقرأ حجم الماء في المخبار المدرج بدقة؟\n   الإجابة النموذجية: نضع المخبار على سطح مستوٍ، وننظر في مستوى سطح السائل، ونقرأ عند قاع التقعر.\n3. (مستوى الاستدلال) ما العامل الذي غيرناه في هذا النشاط؟\n   الإجابة النموذجية: مكان الكأس (دافئ أو بارد).\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\n1. (مستوى المعرفة) في أي الكأسين قلّ الماء أكثر؟\n   الإجابة النموذجية: الكأس الموضوعة في المكان الدافئ.\n2. (مستوى التطبيق) كم مليلترًا تبخر من كأس بقي فيها 85 ml من أصل 100 ml؟\n   الإجابة النموذجية: 15 ml.\n3. (مستوى الاستدلال) لماذا تبخر الماء أسرع في الكأس الدافئة؟\n   الإجابة النموذجية: لأن الحرارة تكسب جزيئات الماء طاقة فتتحرك أسرع وتنفصل عن السطح.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\n1. (مستوى المعرفة) ما العامل الذي نغيره في هذا الاستقصاء؟\n   الإجابة النموذجية: نوع السائل.\n2. (مستوى التطبيق) ما الذي يجب أن نثبته ليكون الاختبار عادلًا؟\n   الإجابة النموذجية: الحجم الأولي للسوائل، ونوع الأطباق وحجمها، والمكان، والمدة.\n3. (مستوى الاستدلال) لماذا يكرر العلماء التجربة عدة مرات؟\n   الإجابة النموذجية: للتأكد من صحة النتائج وأنهم لم يرتكبوا أخطاء في التنفيذ أو القياس.", "الحصة 1: مفهوم التبخر وبخار الماء\n1. (مستوى المعرفة) أكمل: سائل + …… ← غاز.\n   الإجابة النموذجية: حرارة.\n2. (مستوى التطبيق) اذكر مثالين على التبخر من حياتك اليومية.\n   الإجابة النموذجية: جفاف الملابس المبللة، جفاف بركة الماء (أو جفاف الأطباق).\n3. (مستوى الاستدلال) فسّر بلغة الجزيئات كيف يغادر الماء سطح البركة.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة حرارية فتتحرك أسرع وتتباعد حتى تنفصل عن سطح السائل وتنتقل إلى الهواء.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\n1. (مستوى المعرفة) صح أم خطأ: يختفي الماء من الورقة لأنه يتبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) ما الحالة التي تحول إليها الماء؟\n   الإجابة النموذجية: الحالة الغازية (بخار الماء).\n3. (مستوى الاستدلال) اقترح طريقة لجعل البقعة تجف أسرع، وفسّر.\n   الإجابة النموذجية: تحريك الهواء فوقها أو تدفئتها؛ لأن ذلك يسرع التبخر.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\n1. (مستوى المعرفة) صح أم خطأ: استخدمنا كأسين مختلفتين في الحجم.\n   الإجابة النموذجية: خطأ؛ كأسان متماثلتان.\n2. (مستوى التطبيق) لماذا وضعنا علامة عند مستوى الماء؟\n   الإجابة النموذجية: لنقارن مستوى الماء بعد يومين ونعرف كم تبخر.\n3. (مستوى الاستدلال) تنبأ: أي الكأسين سيقل فيها الماء أكثر؟ ولماذا؟\n   الإجابة النموذجية: الكأس في المكان الدافئ؛ لأن الحرارة تسرع التبخر.\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: بقي مستوى الماء في الكأسين كما هو.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا تجف الملابس أسرع في الأيام الحارة؟\n   الإجابة النموذجية: لأن الحرارة تزيد سرعة تبخر الماء منها.\n3. (مستوى الاستدلال) كأس فيها 100 ml بقي فيها بعد يومين 70 ml في مكان دافئ و90 ml في مكان بارد. كم الفرق في الماء المتبخر بين الكأسين؟\n   الإجابة النموذجية: المتبخر في الدافئ 30 ml، وفي البارد 10 ml، والفرق 20 ml.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\n1. (مستوى المعرفة) صح أم خطأ: نضع كميات مختلفة من السوائل في الأطباق.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) ما الأداة التي نقيس بها حجم السائل المتبقي؟\n   الإجابة النموذجية: المخبار المدرج.\n3. (مستوى الاستدلال) إذا أجريت التجربة مرة واحدة وتبخر العصير أسرع، هل يمكنك تعميم النتيجة؟ وضّح.\n   الإجابة النموذجية: لا؛ يجب تكرار التجربة للتأكد قبل وضع الاستنتاج.", "الحصة 1: مفهوم التبخر وبخار الماء\nللطالب: قراءة كتاب الطالب ص44، وملاحظة أمثلة على التبخر في المنزل. لولي الأمر: إحضار ورقة ملونة (أو منديل ملون) لنشاط الحصة القادمة.\n\nالحصة 2: نشاط 3-1أ: أين يذهب الماء؟\nللطالب: رسم محيط بقعة ماء بالطباشير في فناء المنزل وملاحظتها بعد ساعة. لولي الأمر: مساعدة الابن في التجربة ومناقشة النتيجة.\n\nالحصة 3: نشاط 3-1ب: مقارنة التبخر (الإعداد)\nللطالب: قراءة صفحة مهارات قياس حجم السائل ص64 في كتاب الطالب. لولي الأمر: تنفيذ تجربة مشابهة بكوبين في المنزل (نافذة مشمسة / مكان بارد) ومتابعتها مع الابن.\n\nالحصة 4: نتائج نشاط 3-1ب وأسئلة الدرس\nللطالب: إكمال تمرين 3-1 بكتاب النشاط ص31. لولي الأمر: إحضار عينات صغيرة من سوائل آمنة (ماء، عصير، زيت طبخ) في علب صغيرة لاستقصاء الحصة القادمة.\n\nالحصة 5: ورقة العمل 3-1: استقصاء التبخر في السوائل الأخرى\nللطالب: متابعة أطباق السوائل يوميًا وتسجيل الحجم المتبقي في ورقة العمل 3-1 ص73. لولي الأمر: مناقشة الابن في نتائج الاستقصاء ومساعدته على كتابة الاستنتاج.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=15"]}, {"code": "3-2", "title": "لماذا يُعدّ التبخر مفيدًا؟", "unit": 3, "dates": "الأسبوع الحادي عشر (15 منا.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) كيف يستخدم المزارعون التبخر لحفظ الرطب؟\n   الإجابة النموذجية: ينشرونه في الشمس فيتبخر الماء منه فيجف ويُحفظ مدة أطول.\n3. (مستوى الاستدلال) لماذا يبقى الماء في الجرة الفخارية باردًا في الصيف؟\n   الإجابة النموذجية: لأن جزءًا من الماء يتسرب عبر مسام الفخار ويتبخر من سطحه الخارجي آخذًا الحرارة فيبرد الماء داخلها.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\n1. (مستوى المعرفة) صح أم خطأ: تتبخر السوائل أسرع عندما يتحرك الهواء.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) اذكر طعامين يُعدّان باستخدام التبخر.\n   الإجابة النموذجية: الزبيب والمشمش المجفف (أو التمر، السمك المجفف).\n3. (مستوى الاستدلال) لماذا تجف التربة في الحديقة أسرع في الأيام الحارة العاصفة؟\n   الإجابة النموذجية: لأن الحرارة والرياح معًا تزيدان سرعة تبخر الماء من التربة.", "الحصة 1: استخدامات التبخر ودوره في تبريد الأجسام\nللطالب: قراءة كتاب الطالب ص46، وتسجيل ثلاث استخدامات للتبخر يلاحظها في المنزل. لولي الأمر: الحديث مع الابن عن طرق تجفيف الأطعمة في البيت العُماني.\n\nالحصة 2: نشاط 3-2: الشعور بالبرودة سريعًا وأسئلة الدرس\nللطالب: حل تمرين 3-2 بكتاب النشاط ص32. لولي الأمر: تذكير الابن بإحضار وعاءين متماثلين للاستقصاء القادم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=16"]}, {"code": "3-3", "title": "استقصاء التبخر", "unit": 3, "dates": "الأسبوع الحادي عشر (15–19/11/2026م)", "sb": "48–49", "tb": "63–65", "ab": "تمرين 3-3 ص33، ورقة العمل 3-3 ص75", "periods": [{"n": 1, "topic": "نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس)", "f": ["1. يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج\n2. يخطط لمقارنة التبخر في مكان دافئ ومكان بارد\nمخرج تعليمي آخر: يتنبأ بالنمط الذي سيظهر في النتائج", "المخرج 1 (يقيس حجم الماء في وعاءين يوميًا بالمخبار المدرج): تطبيق\nالمخرج 2 (يخطط لمقارنة التبخر في مكان دافئ ومكان بارد): تطبيق\nالمخرج الآخر (يتنبأ بالنمط الذي سيظهر في النتائج): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: وعاءان متماثلان في الحجم والشكل، مخبار مدرج، ماء", "الحجم، التبخر، المخبار المدرج.", "يسأل المعلم: «عرفنا أن الدفء يسرع التبخر، فكم مليلترًا من الماء يمكن أن يتبخر من وعاء في خمسة أيام؟ هل يمكننا قياس ذلك؟».", "1. • التهيئة: يطرح المعلم السؤال، والطلبة يقدمون تقديرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مهارة قياس الحجم: يراجع المعلم قراءة المخبار المدرج (ص64): اختيار المخبار المناسب، مستوى النظر، قاع التقعر، والطلبة يقرؤون أحجامًا معروضة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد نشاط 3-3أ: يتابع المعلم وفق ص48، والطلبة يضعون 200 ml في كل وعاء، ويضعون أحدهما في مكان بارد (كالخزانة) والآخر في مكان دافئ (حافة نافذة مشمسة) (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول التسجيل: يعرض المعلم جدول ص48 (اليوم، حجم الماء في الدافئ والبارد)، والطلبة ينسخون الجدول ويكتبون تنبؤهم (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يوزع المعلم أدوار القياس اليومي لمدة خمسة أيام، والطلبة يحددون أدوارهم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) كم مليلترًا وضعنا في كل وعاء؟\n   الإجابة النموذجية: 200 ml.\n2. (مستوى التطبيق) أين وضعنا الوعاءين؟\n   الإجابة النموذجية: أحدهما في مكان بارد والآخر في مكان دافئ.\n3. (مستوى الاستدلال) ما النمط الذي تتنبأ به في النتائج؟\n   الإجابة النموذجية: سيقل حجم الماء في الوعاء الدافئ أسرع من البارد يومًا بعد يوم.", "1. (مستوى المعرفة) صح أم خطأ: يجب أن يكون الوعاءان متماثلين في الحجم والشكل.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) كيف نقيس حجم الماء المتبقي في الوعاء؟\n   الإجابة النموذجية: نسكبه في المخبار المدرج ونقرأ الحجم ثم نعيده إلى الوعاء.\n3. (مستوى الاستدلال) لماذا نقيس الحجم كل يوم وليس في اليوم الأخير فقط؟\n   الإجابة النموذجية: لنرى النمط والتغير يومًا بعد يوم ونحصل على بيانات أكثر.", "للطالب: المشاركة في القياس اليومي وتسجيل الحجم في الجدول. لولي الأمر: تذكير الابن بإحضار أوعية مختلفة الفتحات (صحن، كوب، علبة) للحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=17"]}, {"n": 2, "topic": "نشاط 3-3ب: أثر المساحة السطحية في التبخر", "f": ["1. يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر\n2. يستنتج أن زيادة المساحة السطحية تزيد التبخر\nمخرج تعليمي آخر: يربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية", "المخرج 1 (يخطط لاستقصاء أثر المساحة السطحية لفتحة الوعاء في التبخر): تطبيق\nالمخرج 2 (يستنتج أن زيادة المساحة السطحية تزيد التبخر): فهم\nالمخرج الآخر (يربط بين مساحة السطح المكشوف وسرعة الجفاف في مواقف يومية): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: علبة وزبدية وصينية وكأس، مخبار مدرج، ورقتان مبللتان", "المساحة السطحية، التبخر، الحجم.", "يبلل المعلم ورقتين متماثلتين، ويطوي إحداهما مرتين ويترك الأخرى مفرودة، ويضعهما أمام الطلاب ويسأل: «أيهما ستجف أولًا؟».", "1. • التهيئة: يعرض المعلم الورقتين ويطرح السؤال، والطلبة يتنبؤون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • المساحة السطحية: يوضح المعلم مفهوم مساحة السطح المكشوف للهواء ويقارن الورقتين بعد دقائق، والطلبة يلاحظون أن الورقة المفرودة أكثر جفافًا (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد نشاط 3-3ب: يتابع المعلم وفق ص49، والطلبة يصبون 100 ml في كل من العلبة والزبدية والصينية والكأس، ويضعونها في المكان الدافئ نفسه (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • الاختبار العادل: يسأل المعلم: ما الذي غيرناه؟ وما الذي ثبتناه؟ والطلبة يحددون: المتغير مساحة الفتحة، والثوابت الحجم الأولي والمكان والمدة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • جدول وتنبؤ: يعرض المعلم جدول ص49، والطلبة يكتبون تنبؤاتهم: الصينية تفقد أكثر (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يحدد المعلم موعد القياس بعد ثلاثة أيام، والطلبة يستعدون (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. (مستوى المعرفة) ما العامل الذي غيرناه في نشاط 3-3ب؟\n   الإجابة النموذجية: مساحة سطح فتحة الوعاء.\n2. (مستوى التطبيق) أي الورقتين جفت أسرع: المطوية أم المفرودة؟\n   الإجابة النموذجية: المفرودة.\n3. (مستوى الاستدلال) لماذا جفت الورقة المفرودة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها المكشوفة للهواء أكبر فيتب حتى الآن؟».", "الحصة 1: نشاط 3-3أ: ما مقدار الماء المتبخر؟ (الإعداد والقياس) — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم السؤال، والطلبة يقدمون تقديرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مهارة قياس الحجم: يراجع المعلم قراءة المخبار المدرج (ص64): اختيار المخبار المناسب، مستوى النظر، قاع التقعر، والطلبة يقرؤون أحجامًا معروضة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد نشاط 3-3أ: يتابع المعلم وفق ص48، والطلبة يضعون 200 ml في كل وعاء، ويضعون أحدهما في مكان بارد (كالخزانة) والآخر في مكان دافئ (حافة نافذة مشمسة) (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • جدول التسجيل: يعرض المعلم جدول ص48 (اليوم، حجم الماء في الدافئ والبارد)، والطلبة ينسخون الجدول ويكتبون تنبؤهم (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • الغلق: يوزع المعلم أدوار القياس اليومي لمدة خمسة أيام، والطلبة يحددون أدوارهم (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: نشاط 3-3ب: أثر المساحة السطحية في التبخر — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الورقتين ويطرح السؤال، والطلبة يتنبؤون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • المساحة السطحية: يوضح المعلم مفهوم مساحة السطح المكشوف للهواء ويقارن الورقتين بعد دقائق، والطلبة يلاحظون أن الورقة المفرودة أكثر جفافًا (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • إعداد نشاط 3-3ب: يتابع المعلم وفق ص49، والطلبة يصبون 100 ml في كل من العلبة والزبدية والصينية والكأس، ويضعونها في المكان الدافئ نفسه (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • الاختبار العادل: يسأل المعلم: ما الذي غيرناه؟ وما الذي ثبتناه؟ والطلبة يحددون: المتغير مساحة الفتحة، والثوابت الحجم الأولي والمكان والمدة (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • جدول وتنبؤ: يعرض المعلم جدول ص49، والطلبة يكتبون تنبؤاتهم: الصينية تفقد أكثر (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. • الغلق: يحدد المعلم موعد القياس بعد ثلاثة أيام، والطلبة يستعدون (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: تحليل نتائج استقصاء التبخر — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم جزيئات الماء.", "1. (مستوى المعرفة) أكمل: المادة التي تذوب تسمى …… والسائل الذي تذوب فيه يسمى ……\n   الإجابة النموذجية: المادة المذابة؛ المادة المذيبة.\n2. (مستوى التطبيق) حدد المادة المذابة والمذيبة في ماء البحر.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (مستوى الاستدلال) كيف تثبت أن الملح ما زال موجودًا في الماء رغم أنك لا تراه؟\n   الإجابة النموذجية: بتذوق الماء (بإشراف المعلم) أو بتبخير الماء فيبقى الملح.", "للطالب: قراءة كتاب الطالب ص50، وكتابة مثالين لمحاليل في المطبخ. لولي الأمر: مساعدة الابن في تحديد المذاب والمذيب في محاليل منزلية (شاي، قهوة، عصير).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=18"]}, {"n": 2, "topic": "نشاط 3-4أ: تحضير محلول", "f": ["1. يحضر محلولًا من بلورات كبريتات النحاس والماء\n2. يصف ما يحدث للبلورات عند ذوبانها\nمخرج تعليمي آخر: يحدد المادة المذابة والمادة المذيبة في المحلول الذي حضّره", "المخرج 1 (يحضر محلولًا من بلورات كبريتات النحاس والماء): تطبيق\nالمخرج 2 (يصف ما يحدث للبلورات عند ذوبانها): فهم\nالمخرج الآخر (يحدد المادة المذابة والمادة المذيبة في المحلول الذي حضّره): تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، أخرى: بلورات كبريتات النحاس، كأس زجاجية، ملعقة صغيرة، ماء، قفازات", "المحلول، البلورات، المادة المذابة، المادة المذيبة.", "يعرض المعلم بلورات زرقاء لامعة ويسأل: «ماذا تتوقعون أن يحدث لهذه البلورات إذا وضعناها في الماء؟ هل سيتغير لون الماء؟».", "1. • التهيئة: يعرض المعلم البلورات ويطرح السؤال، والطلبة يتنبؤون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • السلامة: يوضح المعلم أن كبريتات النحاس ضارة إذا ابتُلعت، ويُلزم بلبس القفازات وعدم لمس العين وغسل اليدين، والطلبة يلتزمون بالتعليمات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 4أ: يتابع المعلم وفق ص50، والطلبة يملؤون ثلاثة أرباع الكأس بالماء، ويضيفون ملعقة صغيرة من البلورات، ويلاحظون ويرسمون ما يحدث ويسمونه (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • أسئلة النشاط: يناقش المعلم أسئلة النشاط (3–6)، والطلبة يصفون: تختفي البلورات ويتلون الماء بالأزرق، لا نرى أجزاء صلبة، المذابة كبريتات النحاس والمذيبة الماء (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • الغلق: يربط المعلم بنموذج الجزيئات، والطلبة يفسرون انتشار اللون بتوزع جزيئات المذاب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) ماذا حدث للبلورات في الماء؟\n   الإجابة النموذجية: ذابت واختفت وأصبح لون الماء أزرق.\n2. (مستوى التطبيق) هل يمكنك رؤية بلورات صلبة في المحلول؟\n   الإجابة النموذجية: لا.\n3. (مستوى الاستدلال) ما المادة المذابة وما المادة المذيبة في هذا النشاط؟\n   الإجابة النموذجية: المذابة: كبريتات النحاس، المذيبة: الماء.", "1. (مستوى المعرفة) صح أم خطأ: يمكن رؤية المادة المذابة في المحلول بعد ذوبانها.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا نلبس القفازات عند استخدام كبريتات النحاس؟\n   الإجابة النموذجية: لأنها مادة ضارة يجب عدم لمسها أو ابتلاعها.\n3. (مستوى الاستدلال) لماذا انتشر اللون الأزرق في الماء كله؟\n   الإجابة النموذجية: لأن جزيئات كبريتات النحاس توزعت بالتساوي بين جزيئات الماء.", "للطالب: رسم الكأس قبل الذوبان وبعده وتسمية المذاب والمذيب. لولي الأمر: مناقشة الابن في سبب عدم رؤية السكر في الشاي رغم وجوده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=18"]}, {"n": 3, "topic": "نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)", "f": ["1. يخطط لاستقصاء استعادة الملح الصلب من محلول ملحي بالتبخر\n2. يحضر محلولًا ملحيًا بقياس الكتلة والحجم بدقة\nمخرج تعليمي آخر: يتنبأ بما سيحدث عند تبخير المحلول ويعلل تنبؤه", "المخرج 1 (يخطط لاستقصاء استعادة الملح الصلب من محلول ملحي بالتبخر): تطبيق\nالمخرج 2 (يحضر محلولًا ملحيًا بقياس الكتلة والحجم بدقة): تطبيق\nالمخرج الآخر (يتنبأ بما سيحدث عند تبخير المحلول ويعلل تنبؤه): تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالاكتشاف", "الكتاب، السبورة الذكية، أخرى: ملح، ماء، مخبار مدرج، ميزان إلكتروني، وعاء صغير، ملعقة صغيرة", "المحلول، التبخر، المادة المذابة، المادة المذيبة.", "يطرح المعلم مشكلة: «سقط ملح في ماء فذاب، وأنت تحتاج إلى الملح! كيف تستعيده؟ تذكّر ما تعلمته عن التبخر».", "1. • التهيئة: يطرح المعلم المشكلة، والطلبة يقترحون تبخير الماء (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. • التخطيط: يناقش المعلم خطوات نشاط 3-4ب ص51 (أين نضع الوعاء؟ كم نحتاج من الوقت؟)، والطلبة يكتبون خطة مختصرة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • تحضير المحلول: يوضح المعلم استخدام الميزان الإلكتروني والمخبار، والطلبة يزنون 5 g من الملح ويذيبونها في 50 ml من الماء (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • التنبؤ والرسم: يطلب المعلم كتابة التنبؤ ورسم الأدوات والخطوات، والطلبة يتنبؤون ببقاء الملح بعد تبخر الماء ويرسمون الخطوات (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. • الإعداد: يحدد المعلم مكانًا دافئًا مشمسًا للأوعية، والطلبة يضعون الوعاء في المكان المحدد (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. • الغلق: يسأل المعلم: كم يومًا نحتاج؟ والطلبة يقدرون المدة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. (مستوى المعرفة) كم غرامًا من الملح أذبنا في 50 ml من الماء؟\n   الإجابة النموذجية: 5 g.\n2. (مستوى التطبيق) ما الأداة التي استخدمناها لقياس كتلة الملح؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. (مستوى الاستدلال) تنبأ بما سيبقى في الوعاء بعد تبخر الماء.\n   الإجابة النموذجية: سيبقى الملح الصلب (بلورات الملح).", "1. (مستوى المعرفة) صح أم خطأ: يتبخر الملح مع الماء.\n   الإجابة النموذجية: خطأ؛ يتبخر الماء ويبقى الملح.\n2. (مستوى التطبيق) أين يجب وضع الوعاء ليتبخر الماء أسرع؟\n   الإجابة النموذجية: في مكان دافئ مشمس.\n3. (مستوى الاستدلال) اقترح طريقتين لتسريع الحصول على الملح.\n   الإجابة النموذجية: استخدام وعاء واسع (مساحة سطح أكبر)، وضعه في مكان أدفأ أو توجيه مروحة نحوه، أو استخدام كمية أقل من الماء.", "للطالب: متابعة الوعاء يوميًا ورسم ما يلاحظه. لولي الأمر: مناقشة الابن في مصدر ملح الطعام.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=18"]}, {"n": 4, "topic": "نتائج استعادة الملح والأسئلة", "f": ["1. يستنتج أنه يمكن استعادة المادة الصلبة المذابة بتبخر السائل\n2. يشرح أين يذهب السائل عندما يتبخر من المحلول\nمخرج تعليمي آخر: يقترح طريقتين للحصول على النتائج بسرعة أكبر", "المخرج 1 (يس  (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يرسم المعلم على السبورة جزيئات المذاب تتوزع بالتساوي بين جزيئات المذيب، والطلبة يفسرون سبب عدم رؤية المادة المذابة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • الغلق: يعرض المعلم صورة الملاحات ص50 ويسأل: من أين يأتي الملح؟ والطلبة يتوقعون: من ماء البحر (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: نشاط 3-4أ: تحضير محلول — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم البلورات ويطرح السؤال، والطلبة يتنبؤون (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. • السلامة: يوضح المعلم أن كبريتات النحاس ضارة إذا ابتُلعت، ويُلزم بلبس القفازات وعدم لمس العين وغسل اليدين، والطلبة يلتزمون بالتعليمات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. 4أ: يتابع المعلم وفق ص50، والطلبة يملؤون ثلاثة أرباع الكأس بالماء، ويضيفون ملعقة صغيرة من البلورات، ويلاحظون ويرسمون ما يحدث ويسمونه (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. • أسئلة النشاط: يناقش المعلم أسئلة النشاط (3–6)، والطلبة يصفون: تختفي البلورات ويتلون الماء بالأزرق، لا نرى أجزاء صلبة، المذابة كبريتات النحاس والمذيبة الماء (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. • الغلق: يربط المعلم بنموذج الجزيئات، والطلبة يفسرون انتشار اللون بتوزع جزيئات المذاب (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد) — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يطرح المعلم المشكلة، والطلبة يقترحون تبخير الماء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. • التخطيط: يناقش المعلم خطوات نشاط 3-4ب ص51 (أين نضع الوعاء؟ كم نحتاج من الوقت؟)، والطلبة يكتبون خطة مختصرة (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. • تحضير المحلول: يوضح المعلم استخدام الميزان الإلكتروني والمخبار، والطلبة يزنون 5 g من الملح ويذيبونها في 50 ml من الماء (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. • التنبؤ والرسم: يطلب المعلم كتابة التنبؤ ورسم الأدوات والخطوات، والطلبة يتنبؤون ببقاء الملح بعد تبخر الماء ويرسمون الخطوات (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. • الإعداد: يحدد المعلم مكانًا دافئًا مشمسًا للأوعية، والطلبة يضعون الوعاء في المكان المحدد (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. • الغلق: يسأل المعلم: كم يومًا نحتاج؟ والطلبة يقدرون المدة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: نتائج استعادة الملح والأسئلة — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الأوعية، والطلبة يفحصون البلورات (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. • الملاحظة: يسأل المعلم: ماذا بقي؟ أين ذهب الماء؟ والطلبة يصفون بلورات الملح البيضاء ويستنتجون أن الماء تبخر (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. • أسئلة ص51: يناقش المعلم الأسئلة (1–3)، والطلبة يجيبون عن صحة التنبؤ، وطريقتين لتسريع النتائج، ويختارون «من الممكن» فصل الصلبة عن السائلة بالتبخر (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • الملاحات: يعرض المعلم صورة الملاحات ص50 ويشرح كيف يستخلص الملح من ماء البحر بالتبخر، والطلبة يربطون النشاط بالملاحات (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. • تحدث عن: يطرح المعلم سؤال ص51: عصير التفاح مع الماء، هل هو محلول؟ والطلبة يناقشون: نعم، مواد العصير تذوب في الماء ولا نراها منفصلة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم المخلوط ويطرح السؤال، والطلبة يقترحون أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • التخطيط: يقدم المعلم ورقة العمل 3-4 ص77 ويوجه إلى التفكير: ماذا يذوب؟ ماذا لا يذوب؟ والطلبة يخططون: إضافة الماء لإذابة الملح، الترشيح لفصل الرمل، تبخير الماء لاستعادة الملح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • التنفيذ: يعرض المعلم طريقة طي ورق الترشيح ويتابع، والطلبة يذيبون المخلوط في الماء ويرشحونه، ويضعون المحلول الراشح في طبق للتبخير (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • تمرين 3-4: يقدم المعلم تمرين 3-4 بكتاب النشاط ص34، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\n1. (مستوى المعرفة) ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. (مستوى التطبيق) في محلول السكر والماء، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n3. (مستوى الاستدلال) لماذا لا نرى السكر بعد ذوبانه؟\n   الإجابة النموذجية: لأن جزيئاته توزعت بالتساوي بين جزيئات الماء.\n\nالحصة 2: نشاط 3-4أ: تحضير محلول\n1. (مستوى المعرفة) ماذا حدث للبلورات في الماء؟\n   الإجابة النموذجية: ذابت واختفت وأصبح لون الماء أزرق.\n2. (مستوى التطبيق) هل يمكنك رؤية بلورات صلبة في المحلول؟\n   الإجابة النموذجية: لا.\n3. (مستوى الاستدلال) ما المادة المذابة وما المادة المذيبة في هذا النشاط؟\n   الإجابة النموذجية: المذابة: كبريتات النحاس، المذيبة: الماء.\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\n1. (مستوى المعرفة) كم غرامًا من الملح أذبنا في 50 ml من الماء؟\n   الإجابة النموذجية: 5 g.\n2. (مستوى التطبيق) ما الأداة التي استخدمناها لقياس كتلة الملح؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. (مستوى الاستدلال) تنبأ بما سيبقى في الوعاء بعد تبخر الماء.\n   الإجابة النموذجية: سيبقى الملح الصلب (بلورات الملح).\n\nالحصة 4: نتائج استعادة الملح والأسئلة\n1. (مستوى المعرفة) ماذا بقي في الوعاء بعد تبخر الماء؟\n   الإجابة النموذجية: بلورات الملح.\n2. (مستوى التطبيق) أين ذهب الماء؟\n   الإجابة النموذجية: تبخر إلى الهواء.\n3. (مستوى الاستدلال) هل كان تنبؤك صحيحًا؟ وضّح.\n   الإجابة النموذجية: تقبل الإجابة المبررة بمقارنة التنبؤ بالملاحظة.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\n1. (مستوى المعرفة) لماذا أضفنا الماء إلى مخلوط الملح والرمل؟\n   الإجابة النموذجية: لإذابة الملح.\n2. (مستوى التطبيق) ماذا بقي على ورق الترشيح؟\n   الإجابة النموذجية: الرمل.\n3. (مستوى الاستدلال) ماذا نفعل بالمحلول الراشح لاستعادة الملح؟\n   الإجابة النموذجية: نبخر الماء منه فيبقى الملح.", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\n1. (مستوى المعرفة) أكمل: المادة التي تذوب تسمى …… والسائل الذي تذوب فيه يسمى ……\n   الإجابة النموذجية: المادة المذابة؛ المادة المذيبة.\n2. (مستوى التطبيق) حدد المادة المذابة والمذيبة في ماء البحر.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (مستوى الاستدلال) كيف تثبت أن الملح ما زال موجودًا في الماء رغم أنك لا تراه؟\n   الإجابة النموذجية: بتذوق الماء (بإشراف المعلم) أو بتبخير الماء فيبقى الملح.\n\nالحصة 2: نشاط 3-4أ: تحضير محلول\n1. (مستوى المعرفة) صح أم خطأ: يمكن رؤية المادة المذابة في المحلول بعد ذوبانها.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) لماذا نلبس القفازات عند استخدام كبريتات النحاس؟\n   الإجابة النموذجية: لأنها مادة ضارة يجب عدم لمسها أو ابتلاعها.\n3. (مستوى الاستدلال) لماذا انتشر اللون الأزرق في الماء كله؟\n   الإجابة النموذجية: لأن جزيئات كبريتات النحاس توزعت بالتساوي بين جزيئات الماء.\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\n1. (مستوى المعرفة) صح أم خطأ: يتبخر الملح مع الماء.\n   الإجابة النموذجية: خطأ؛ يتبخر الماء ويبقى الملح.\n2. (مستوى التطبيق) أين يجب وضع الوعاء ليتبخر الماء أسرع؟\n   الإجابة النموذجية: في مكان دافئ مشمس.\n3. (مستوى الاستدلال) اقترح طريقتين لتسريع الحصول على الملح.\n   الإجابة النموذجية: استخدام وعاء واسع (مساحة سطح أكبر)، وضعه في مكان أدفأ أو توجيه مروحة نحوه، أو استخدام كمية أقل من الماء.\n\nالحصة 4: نتائج استعادة الملح والأسئلة\n1. (مستوى المعرفة) أكمل: لقد اكتشفت أنه من …… فصل المادة الصلبة عن السائلة باستخدام التبخر.\n   الإجابة النموذجية: الممكن.\n2. (مستوى التطبيق) كيف يُستخلص الملح من ماء البحر في الملاحات؟\n   الإجابة النموذجية: يوضع ماء البحر في أحواض واسعة ضحلة تحت الشمس فيتبخر الماء ويبقى الملح.\n3. (مستوى الاستدلال) لماذا تُصنع أحواض الملاحات واسعة وضحلة؟\n   الإجابة النموذجية: لزيادة المساحة السطحية فيتبخر الماء أسرع.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\n1. (مستوى المعرفة) صح أم خطأ: يذوب الرمل في الماء.\n   الإجابة النموذجية: خطأ.\n2. (مستوى التطبيق) حدد المادة المذابة والمذيبة في الماء المالح.\n   الإجابة النموذجية: المذابة: الملح، المذيبة: الماء.\n3. (مستوى الاستدلال) لماذا يجب الترشيح قبل التبخير؟\n   الإجابة النموذجية: لنفصل الرمل أولًا؛ لو بخرنا قبل الترشيح لبقي الملح مخلوطًا بالرمل.", "الحصة 1: المحاليل: المادة المذابة والمادة المذيبة\nللطالب: قراءة كتاب الطالب ص50، وكتابة مثالين لمحاليل في المطبخ. لولي الأمر: مساعدة الابن في تحديد المذاب والمذيب في محاليل منزلية (شاي، قهوة، عصير).\n\nالحصة 2: نشاط 3-4أ: تحضير محلول\nللطالب: رسم الكأس قبل الذوبان وبعده وتسمية المذاب والمذيب. لولي الأمر: مناقشة الابن في سبب عدم رؤية السكر في الشاي رغم وجوده.\n\nالحصة 3: نشاط 3-4ب: هل يمكن استعادة الملح؟ (التخطيط والإعداد)\nللطالب: متابعة الوعاء يوميًا ورسم ما يلاحظه. لولي الأمر: مناقشة الابن في مصدر ملح الطعام.\n\nالحصة 4: نتائج استعادة الملح والأسئلة\nللطالب: مراجعة كتاب الطالب ص50–51 وكتابة الاستنتاج. لولي الأمر: إحضار قليل من الرمل النظيف للنشاط القادم.\n\nالحصة 5: ورقة العمل 3-4: فصل الملح عن الرمل\nللطالب: حل تمرين 3-4 بكتاب النشاط ص34، وإكمال ورقة العمل 3-4 ص77. لولي الأمر: مناقشة الابن في خطوات فصل الملح عن الرمل وأهمية ترتيبها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=18"]}, {"code": "3-5", "title": "التكثيف", "unit": 3, "dates": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "sb": "52–53", "tb": "69–70", "ab": "تمرين 3-5 ص35", "periods": [{"n": 1, "topic": "مفهوم التكثيف", "f": ["1. يعرّف التكثيف بأنه تحول المادة من الحالة الغازية إلى الحالة السائلة\n2. يوضح أن التكثيف عكس التبخر\nمخرج تعليمي آخر: يفسر تكوّن قطرات الماء على سطح بارد بلغة الجزيئات", "المخرج 1 (يعرّف التكثيف بأنه تحول المادة من الحالة الغازية إلى الحالة السائلة): تذكر\nالمخرج 2 (يوضح أن التكثيف عكس التبخر): فهم\nالمخرج الآخر (يفسر تكوّن قطرات الماء على سطح بارد بلغة الجزيئات): تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: مرآة صغيرة، علبة مشروب باردة", "التكثيف، بخار الماء، عكس، يبرد.", "يطلب المعلم من الطلاب التنفس على مرآة صغيرة أو زجاج النافذة كما في ص52، ويسأل: «ماذا ترى؟ من أين جاءت هذه القطرات الصغيرة؟».", "1. • التهيئة: ينفذ المعلم نشاط التنفس على المرآة، والطلبة يلاحظون الضباب والقطرات الصغيرة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • مفهوم التكثيف: يشرح المعلم ص52: هواء الزفير يحتوي على بخار ماء، وعندما يلامس سطحًا باردًا يبرد ويتحول إلى قطرات سائلة (التكثيف)، والطلبة يكتبون التعريف: غاز ← سائل (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. • عكس التبخر: يرسم المعلم سهمين: سائل ⇄ غاز، والطلبة يكتبون التبخر في اتجاه والتكثيف في الاتجاه المعاكس (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يمثّل المعلم بطلاب «جزيئات غاز» تتحرك بسرعة ثم تفقد طاقة فتبطؤ وتقترب، والطلبة يصفون ما يحدث لجزيئات الغاز عند التبريد (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • علبة المشروب: يعرض المعلم صورة العلبة الباردة ص52، والطلبة يفسرون القطرات على سطحها الخارجي (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. • الغلق: يسأل المعلم: ما الفرق بين التبخر والتكثيف؟ والطلبة يجيبون (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1. (مستوى المعرفة) ما التكثيف؟\n   الإجابة النموذجية: تحول المادة من الحالة الغازية إلى الحالة السائلة.\n2. (مستوى التطبيق) لماذا تكوّن الضباب على المرآة عند التنفس عليها؟\n   الإجابة النموذجية: لأن بخار الماء في هواء الزفير برد عند ملامسة المرآة الباردة فتكثف.\n3. (مستوى الاستدلال) ماذا يحدث لجزيئات الغاز عندما يبرد؟\n   الإجابة النموذجية: تفقد بعض طاقتها فتبطؤ حركتها وتقترب من بعضها فيتكون السائل.", "1. (مستوى المعرفة) صح أم خطأ: التكثيف عكس التبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) من أين تأتي القطرات على السطح الخارجي لعلبة مشروب باردة؟\n   الإجابة النموذجية: من بخار الماء الموجود في الهواء الذي يتكثف عند ملامسة العلبة الباردة.\n3. (مستوى الاستدلال) لماذا لا تتكون قطرات على علبة في درجة حرارة الغرفة؟\n   الإجابة النموذجية: لأن سطحها ليس باردًا بدرجة كافية لتكثيف بخار الماء.", "للطالب: قراءة كتاب الطالب ص52، وملاحظة أمثلة على التكثيف في المنزل (زجاج الحمام، غطاء القدر). لولي الأمر: إحضار مكعبات ثلج في وعاء محكم للنشاط القادم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=19"]}, {"n": 2, "topic": "نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب", "f": ["1. ينفذ نشاطًا يلاحظ فيه تكثف بخار الماء على سطح كأس باردة\n2. يستنتج أن الماء على السطح الخارجي جاء من بخار الماء في الهواء\nمخرج تعليمي آخر: يتأكد من عدالة الاختبار بالتحقق من جفاف الكأسين في البداية", "المخرج 1 (ينفذ نشاطًا يلاحظ فيه تكثف بخار الماء على سطح كأس باردة): تطبيق\nالمخرج 2 (يستنتج أن الماء على السطح الخارجي جاء من بخار الماء في الهواء): تحليل\nالمخرج الآخر (يتأكد من عدالة الاختبار بالتحقق من جفاف الكأسين في البداية): تقييم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: كأسان زجاجيتان، ثلج، ماء، قطعة قماش، مخبار مدرج، بلاستيك تغليف شفاف، قلم تخطيط", "التكثيف، بخار الماء، الاختبار العادل.", "يعرض المعلم صورة الطالب ص52 الذي يمسح الكأس، ويسأل: «لماذا يمسح الكأسين جيدًا قبل البدء؟».", "1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون: للتأكد من أنهما جافتان (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • التخطيط: يقرأ المعلم خطوات نشاط 3-5أ ص52، والطلبة يحددون: كأس بها ثلج وأخرى بها ماء، ومدة 10 دقائق (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. 5أ: يتابع المعلم وفق ص52، والطلبة يمسحون الكأسين، ويضعون الثلج في إحداهما والماء في الأخرى، ويتركونهما 10 دقائق، ويلاحظون ويرسمون (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. • أسئلة النشاط: يناقش المعلم الأسئلة (1–3) ص52، والطلبة يستنتجون أن البلل ظهر على كأس الثلج من الخارج، وأن الماء جاء من بخار الهواء (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. • إعداد نشاط 3-5ب: يوجه المعلم وفق ص53، والطلبة يسكبون 100 ml في كأسين، ويحددون المستوى بالقلم، ويغطون إحداهما بإحكام بالبلاستيك، ويتركونهما في مكان دافئ حتى الغد (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. (مستوى المعرفة) على أي الكأسين ظهر البلل من الخارج؟\n   الإجابة النموذجية: على الكأس التي بها ثلج.\n2. (مستوى التطبيق) من أين جاء الماء على السطح الخارجي للكأس؟\n   الإجابة النموذجية: من بخار الماء في الهواء الذي تكثف عند ملامسة الكأس الباردة.\n3. (مستوى الاستدلال) لماذا مسحنا الكأسين في بداية النشاط؟\n   الإجابة النموذجية: لنتأكد أنهما جافتان فيكون أي بلل لاحق ناتجًا عن التكثيف.", "1. (مستوى المعرفة) صح أم خطأ: تسرّب الماء من داخل الكأس إلى خارجها.\n   الإجابة النموذجية: خطأ؛ الماء جاء من الهواء.\n2. (مستوى التطبيق) لماذا لم يظهر بلل على كأس الماء العادي؟\n   الإجابة النموذجية: لأنها ليست باردة بما يكفي لتكثيف بخار الماء.\n3. (مستوى الاستدلا لاستراتيجيات: التعلم بالنمذجة.\n\n3. • عكس التبخر: يرسم المعلم سهمين: سائل ⇄ غاز، والطلبة يكتبون التبخر في اتجاه والتكثيف في الاتجاه المعاكس (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • نموذج الجزيئات: يمثّل المعلم بطلاب «جزيئات غاز» تتحرك بسرعة ثم تفقد طاقة فتبطؤ وتقترب، والطلبة يصفون ما يحدث لجزيئات الغاز عند التبريد (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • علبة المشروب: يعرض المعلم صورة العلبة الباردة ص52، والطلبة يفسرون القطرات على سطحها الخارجي (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. • الغلق: يسأل المعلم: ما الفرق بين التبخر والتكثيف؟ والطلبة يجيبون (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون: للتأكد من أنهما جافتان (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. • التخطيط: يقرأ المعلم خطوات نشاط 3-5أ ص52، والطلبة يحددون: كأس بها ثلج وأخرى بها ماء، ومدة 10 دقائق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. 5أ: يتابع المعلم وفق ص52، والطلبة يمسحون الكأسين، ويضعون الثلج في إحداهما والماء في الأخرى، ويتركونهما 10 دقائق، ويلاحظون ويرسمون (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. • أسئلة النشاط: يناقش المعلم الأسئلة (1–3) ص52، والطلبة يستنتجون أن البلل ظهر على كأس الثلج من الخارج، وأن الماء جاء من بخار الهواء (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. • إعداد نشاط 3-5ب: يوجه المعلم وفق ص53، والطلبة يسكبون 100 ml في كأسين، ويحددون المستوى بالقلم، ويغطون إحداهما بإحكام بالبلاستيك، ويتركونهما في مكان دافئ حتى الغد (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: نشاط 3-5ب: ملاحظة التبخر والتكثيف — زمن الحصة 40 دقيقة\n\n1. • التهيئة: يعرض المعلم الكأسين، والطلبة يلاحظون القطرات تحت البلاستيك (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. • الملاحظة والمقارنة: يوجه المعلم إلى مقارنة المستويين، والطلبة يلاحظون أن الماء في المكشوفة قل أكثر، وأن قطرات تكونت تحت البلاستيك في المغطاة (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. • أسئلة ص53: يناقش المعلم الأسئلة (1–4)، والطلبة يكملون: اكتسب الماء حرارة وتبخر ليكوّن بخار الماء، وفي المغطاة برد البخار وتكثف ليكوّن قطرات الماء على البلاستيك (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. • تمرين 3-5: يقدم المعلم تمرين 3-5 بكتاب النشاط ص35، والطلبة يحلون التمرين (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "الحصة 1: مفهوم التكثيف\n1. (مستوى المعرفة) ما التكثيف؟\n   الإجابة النموذجية: تحول المادة من الحالة الغازية إلى الحالة السائلة.\n2. (مستوى التطبيق) لماذا تكوّن الضباب على المرآة عند التنفس عليها؟\n   الإجابة النموذجية: لأن بخار الماء في هواء الزفير برد عند ملامسة المرآة الباردة فتكثف.\n3. (مستوى الاستدلال) ماذا يحدث لجزيئات الغاز عندما يبرد؟\n   الإجابة النموذجية: تفقد بعض طاقتها فتبطؤ حركتها وتقترب من بعضها فيتكون السائل.\n\nالحصة 2: نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب\n1. (مستوى المعرفة) على أي الكأسين ظهر البلل من الخارج؟\n   الإجابة النموذجية: على الكأس التي بها ثلج.\n2. (مستوى التطبيق) من أين جاء الماء على السطح الخارجي للكأس؟\n   الإجابة النموذجية: من بخار الماء في الهواء الذي تكثف عند ملامسة الكأس الباردة.\n3. (مستوى الاستدلال) لماذا مسحنا الكأسين في بداية النشاط؟\n   الإجابة النموذجية: لنتأكد أنهما جافتان فيكون أي بلل لاحق ناتجًا عن التكثيف.\n\nالحصة 3: نشاط 3-5ب: ملاحظة التبخر والتكثيف\n1. (مستوى المعرفة) في أي الكأسين قل الماء أكثر؟\n   الإجابة النموذجية: الكأس المكشوفة.\n2. (مستوى التطبيق) ماذا تكون على البلاستيك في الكأس المغطاة؟\n   الإجابة النموذجية: قطرات ماء.\n3. (مستوى الاستدلال) لماذا بقي الماء في الكأس المغطاة تقريبًا كما هو؟\n   الإجابة النموذجية: لأن بخار الماء لم يخرج؛ تكثف على البلاستيك وعاد إلى الكأس.", "الحصة 1: مفهوم التكثيف\n1. (مستوى المعرفة) صح أم خطأ: التكثيف عكس التبخر.\n   الإجابة النموذجية: صح.\n2. (مستوى التطبيق) من أين تأتي القطرات على السطح الخارجي لعلبة مشروب باردة؟\n   الإجابة النموذجية: من بخار الماء الموجود في الهواء الذي يتكثف عند ملامسة العلبة الباردة.\n3. (مستوى الاستدلال) لماذا لا تتكون قطرات على علبة في درجة حرارة الغرفة؟\n   الإجابة النموذجية: لأن سطحها ليس باردًا بدرجة كافية لتكثيف بخار الماء.\n\nالحصة 2: نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب\n1. (مستوى المعرفة) صح أم خطأ: تسرّب الماء من داخل الكأس إلى خارجها.\n   الإجابة النموذجية: خطأ؛ الماء جاء من الهواء.\n2. (مستوى التطبيق) لماذا لم يظهر بلل على كأس الماء العادي؟\n   الإجابة النموذجية: لأنها ليست باردة بما يكفي لتكثيف بخار الماء.\n3. (مستوى الاستدلال) لماذا تتسم هذه العملية بأنها عكس عملية التبخر؟\n   الإجابة النموذجية: لأن التبخر يحول السائل إلى غاز، والتكثيف يحول الغاز إلى سائل.\n\nالحصة 3: نشاط 3-5ب: ملاحظة التبخر والتكثيف\n1. (مستوى المعرفة) أكمل: اكتسب الماء في الكأس المكشوفة …… و…… ليكوّن بخار الماء.\n   الإجابة النموذجية: حرارة؛ تبخر.\n2. (مستوى التطبيق) في الكأس المغطاة، برد بخار الماء و…… ليكوّن …… على بلاستيك التغليف.\n   الإجابة النموذجية: تكثف؛ قطرات الماء.\n3. (مستوى الاستدلال) كيف يمكن استخدام التبخر والتكثيف لتنظيف ماء الشرب؟\n   الإجابة النموذجية: بتبخير الماء الملوث ثم تكثيف بخاره على سطح بارد وجمع القطرات النقية.", "الحصة 1: مفهوم التكثيف\nللطالب: قراءة كتاب الطالب ص52، وملاحظة أمثلة على التكثيف في المنزل (زجاج الحمام، غطاء القدر). لولي الأمر: إحضار مكعبات ثلج في وعاء محكم للنشاط القادم.\n\nالحصة 2: نشاط 3-5أ: من أين يأتي الماء؟ وإعداد نشاط 3-5ب\nللطالب: عدم تحريك كأسي نشاط 3-5ب حتى الحصة القادمة، وقراءة كتاب الطالب ص53. لولي الأمر: ملاحظة غطاء قدر الطبخ مع الابن وتفسير القطرات المتكونة عليه.\n\nالحصة 3: نشاط 3-5ب: ملاحظة التبخر والتكثيف\nللطالب: حل تمرين 3-5 بكتاب النشاط ص35 إن لم يكتمل. لولي الأمر: مشاهدة مقطع عن دورة الماء في الطبيعة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/5/science/?l=19"]}, {"code": "3-6", "title": "دورة الماء في الطبيعة", "unit": 3, "dates": "الأسبوع الثالث عشر (29/11–3/12/2026م)", "sb": "54–55", "tb": "71–72", "ab": "تمرين 3-6 ص36، ورقة العمل 3-6 ص79", "periods": [{"n": 1, "topic": "مراحل دورة الماء في الطبيعة", "f": ["1. يصف مراحل دورة الماء في الطبيعة\n2. يوضح دور التبخر والتكثيف في دورة الماء\nمخرج تعليمي آخر: يربط بين دورة الماء والهطول (الأمطار والثلوج والبرد)", "المخرج 1 (يصف مراحل دورة الم
