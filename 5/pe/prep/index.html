: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يحدد كل طالب مهارة يحتاج إلى تطويرها ويخبر المعلم.\n- الطالب: يحدد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نهبط بعد الوثب؟\nالإجابة: على القدمين بثني الركبتين.\nس2 (المستوى المتوقع): أين تكون الذقن في الدحرجة الأمامية؟\nالإجابة: على الصدر.\nس3 (المستوى المتقدم): بأي جزء نستلم الكرة الصدرية؟\nالإجابة: باليدين والأصابع منتشرة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الدحرجة الأمامية.\nالإجابة: يؤديها بذقن مضمومة وظهر مستدير.\nس2 (المستوى المتوقع): اذكر محطتين من المراجعة.\nالإجابة: الدحرجة والرمي على الهدف.\nس3 (المستوى المتقدم): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها 10 دقائق يوميًا."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتذكر قواعد الأمن والسلامة ومراحل الإحماء.\n2. يؤدي تمرينات إعداد بدني عام للذراعين والجذع والرجلين بالعد.\n3. يقدر أهمية الإعداد البدني في الوقاية من الإصابات.\n\nالحصة 2:\n1. يؤدي الدحرجة الأمامية والوثب والرمي من مهارات الصف الرابع.\n2. يؤدي التمرير والاستلام في كرة السلة واليد للصغار.\n3. يقيم مستواه ويحدد المهارات التي يحتاج إلى تطويرها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم المبني على اللعب\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم الذاتي", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: بطاقات التمرينات\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: كرات\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات صغيرة", "المفاهيم": "الحصة 1:\n- الإعداد البدني\n- الإحماء\n- قواعد الحصة\n- الإصابة\n\nالحصة 2:\n- المراجعة\n- الدحرجة\n- الرمي\n- التمرير والاستلام", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرحب المعلم بالطلبة ويسأل: ما قواعد حصة التربية البدنية؟ ولماذا نبدأ بالإحماء؟ ويعرض بطاقات تمرينات.\n\nالحصة 2:\nيسأل المعلم: ما المهارات التي تعلمتموها في الصف الرابع؟ ويطلب من ثلاثة طلبة أداء الدحرجة والتمرير والرمي.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (النداء على التشكيل) ثم لعبة (الصياد والصقور) لإحماء عام ممتع.\n- الطالب: يلعب ويستجيب.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج الإعداد البدني ص 31-32: (وقوف. الذراعان جانبًا) دوران الذراعين، (وقوف فتحًا) لف الجذع، (انبطاح مائل) ثني الذراعين، (رقود) رفع الجذع، بالعد الثماني مع التفكير بصوت عالٍ.\n- الطالب: يقلد بالعد ويسمي العضلات العاملة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد تختار أربعة تمرينات من البطاقات (لكل جزء تمرين) وتعرضها بعد مشترك.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: ما الفرق بين إحماء اليوم في بدايته ونهايته؟ ليستنتج الطلبة التدرج من الخفيف إلى الأقوى.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة ومراجعة القواعد.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات مراجعة بأربع مجموعات: الدحرجة الأمامية على المرتبة، الوثب من الاقتراب داخل الأطواق، الرمي على هدف، التمرير الصدري والاستلام في أزواج، مع التبديل كل 4 دقائق.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك) بالتمرير والاستلام.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يحدد كل طالب مهارة يحتاج إلى تطويرها ويخبر المعلم.\n- الطالب: يحدد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا نبدأ الحصة بالإعداد البدني؟\nالإجابة: لرفع حرارة العضلات والاستعداد للجهد ومنع الإصابة.\nس2 (المستوى المتوقع): اذكر تمرينًا للجذع.\nالإجابة: لف الجذع من الوقوف فتحًا.\nس3 (المستوى المتقدم): ما ترتيب الإحماء الصحيح؟\nالإجابة: من الحركات الخفيفة إلى الأقوى تدريجيًا.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف نهبط بعد الوثب؟\nالإجابة: على القدمين بثني الركبتين.\nس2 (المستوى المتوقع): أين تكون الذقن في الدحرجة الأمامية؟\nالإجابة: على الصدر.\nس3 (المستوى المتقدم): بأي جزء نستلم الكرة الصدرية؟\nالإجابة: باليدين والأصابع منتشرة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاث قواعد للأمن والسلامة.\nالإجابة: الاستجابة للصافرة، عدم الدفع، الحذاء الرياضي.\nس2 (المستوى المتوقع): أدِّ تمرينًا للرجلين بالعد الثماني.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف تنظم مجموعتك عرض التمرينات؟\nالإجابة: يعد القائد ونؤدي معًا بتوافق.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الدحرجة الأمامية.\nالإجابة: يؤديها بذقن مضمومة وظهر مستدير.\nس2 (المستوى المتوقع): اذكر محطتين من المراجعة.\nالإجابة: الدحرجة والرمي على الهدف.\nس3 (المستوى المتقدم): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك نماذج الإعداد البدني في دليل المعلم ص 31-32.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها 10 دقائق يوميًا."}}, {"title": "تمرينات لتنمية عناصر اللياقة البدنية", "unit": "اللياقة البدنية", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 35-48", "n": 2, "periods": [{"focus": "مفهوم اللياقة البدنية وأهميتها وتمرينات تنمية المرونة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم اللياقة البدنية وأهميتها.\n2. يميز عنصر المرونة والعوامل المؤثرة فيه.\n3. يؤدي تمرينات حرة وبالأدوات لتنمية المرونة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: عصي\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- اللياقة البدنية\n- المرونة\n- المدى الحركي\n- المفصل", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب جمباز يؤدي شقلبة ولاعب كرة سلة يصوب ويسأل: ما الذي يمكّنهما من ذلك؟ ويقدم مفهوم اللياقة البدنية (ص 35-36).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع تحريك المفاصل بمدى واسع.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم مفهوم اللياقة وأهميتها (رفع كفاءة الأجهزة، القوام، الوزن) ثم يعرض عنصر المرونة (أداء الحركة بأوسع مدى تسمح به المفاصل) وعوامله، ويؤدي نماذج ص 37-38: (وقوف. مسك العصا أفقيًا خلف الكتفين) لف الجذع، (جلوس طويل مواجه. مسك العصا) الرجوع وسحب الزميل، (جلوس عالٍ جانبي على المقعد) ثني الجذع.\n- الطالب: يستمع ويقلد التمرينات.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات المرونة بأربع مجموعات: محطة العصا، محطة المقعد السويدي، محطة الإطالة الزوجية على المرتبة، محطة (جلوس فتحًا) ثني الجذع للجانبين، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: اختبار مبسط: يجلس كل طالب جلوسًا طويلًا ويمد يديه نحو أصابع القدمين، ويقارن قبل التمرين وبعده ليكتشف أثر التمرين في المدى الحركي.\n- الطالب: يقيس ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالإطالة البطيئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما اللياقة البدنية؟\nالإجابة: قدرة الفرد على أداء أنشطته بكفاءة دون إجهاد.\nس2 (المستوى المتوقع): ما المرونة؟\nالإجابة: أداء الحركات بأوسع مدى تسمح به المفاصل دون إصابة.\nس3 (المستوى المتقدم): اذكر مهارة رياضية تحتاج إلى المرونة.\nالإجابة: الدحرجات والشقلبات في الجمباز.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر فائدتين للياقة البدنية.\nالإجابة: تحسين القوام ورفع كفاءة الجهاز الدوري التنفسي.\nس2 (المستوى المتوقع): أدِّ تمرينًا للمرونة بالعصا.\nالإجابة: لف الجذع والعصا خلف الكتفين.\nس3 (المستوى المتقدم): ماذا لاحظت في اختبار مد اليدين بعد التمرين؟\nالإجابة: وصلت أبعد لأن المدى الحركي زاد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الإطالة اليومية (مد اليدين للقدمين من الجلوس 10 ثوانٍ) (دليل المعلم ص 36-38)."}}, {"focus": "تمرينات تنمية الرشاقة والتوافق", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز عنصري الرشاقة والتوافق.\n2. يؤدي تمرينات حرة وبالأدوات (سلم الرشاقة، لوحة مربعات الأرقام) لتنمية الرشاقة والتوافق.\n3. يوظف عنصري الرشاقة والتوافق في لعبة.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: لوحة مربعات الأرقام\n- أخرى: أقماع\n- أخرى: كرات\n- صورة توضيحية", "المفاهيم": "- الرشاقة\n- التوافق\n- تغيير الاتجاه\n- الجهاز العصبي العضلي", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المرونة، ثم يؤدي جريًا مكوكيًا سريعًا ويسأل: ما العنصر الذي يمكنني من تغيير الاتجاه بسرعة؟ ويقدم الرشاقة والتوافق (ص 40-44).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم نماذج الرشاقة ص 40: الجري الجانبي المتقاطع، الوثب مع الدوران نصف لفة، الجري المكوكي بين علامتين، الوثب على حدود مربعات سلم الرشاقة مع الدوران 90؛ ونماذج التوافق ص 44: الوثب بالقدمين على لوحة الأرقام (2،4) ثم (1،5)، تنطيط كرتين معًا.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: سلم الرشاقة، لوحة مربعات الأرقام، الجري المكوكي، تنطيط كرتين، بأربع مجموعات والتبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 6 (ألعاب التمرينات) ص 48: مجموعتان تجريان جريًا مكوكيًا لنقل الأقماع إلى منطقتهما في زمن محدد، والأكثر أقماعًا تفوز.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", " يها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع والأجهزة المستخدمة (لوح التأرجح، سلم التسلق، الكرة المطاطية الكبيرة).\n2. يؤدي حركات تخطي الموانع بأمان (التسلق والنزول، المشي على لوح التأرجح، المروق، الوثب).\n3. يختار الحركة المناسبة لكل مانع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: لوح التأرجح\n- أخرى: سلم التسلق\n- أخرى: كرات مطاطية كبيرة\n- أخرى: حواجز\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب", "المفاهيم": "- تمرينات الموانع\n- المانع\n- التسلق\n- التأرجح\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الأجهزة ويسأل: كيف نتخطى كل جهاز؟ ويذكر أن جمباز الموانع ينمي عناصر اللياقة كلها (ص 49-51).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج كل مانع ص 52-53: الجري والمشي والزحف فوق لوح التأرجح، التسلق والنزول والتعلق على سلم التسلق، الجري المتعرج بين الكرات الكبيرة والزحف بالكرة، المروق أسفل الحاجز، مع نقاط الأمان.\n- الطالب: يقلد كل حركة بعد النموذج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب الطالب تخطي المانع نفسه بطريقتين (المشي أم الزحف على لوح التأرجح) ويكتشف الأسرع والآمن.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تؤدي مسارًا قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الأداء الآمن.\n- الطالب: يؤدي المسار.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر جهازين من أجهزة الموانع.\nالإجابة: لوح التأرجح وسلم التسلق.\nس2 (المستوى المتوقع): ما الحركة المناسبة للكرة المطاطية الكبيرة؟\nالإجابة: الجري المتعرج بينها أو الزحف بها.\nس3 (المستوى المتقدم): لماذا تنمي تمرينات الموانع اللياقة؟\nالإجابة: لأنها تجمع الجري والوثب والتسلق والتوازن.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التسلق والنزول على سلم التسلق.\nالإجابة: يؤديه بأمان.\nس2 (المستوى المتوقع): اختر حركة لتخطي الحاجز وعلل.\nالإجابة: المروق لأن الحاجز مرتفع (أو الوثب لأنه منخفض).\nس3 (المستوى المتقدم): ما قاعدة الأمان على لوح التأرجح؟\nالإجابة: المشي بتوازن والنظر للأمام وعدم الدفع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في تمرينات الموانع (دليل المعلم ص 49-53)."}}, {"focus": "نماذج مسارات الموانع والمنافسات", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي نماذج مسارات الموانع بالتتابع (القفز على جانبي المقعد، الحجل داخل الأطواق، الجري في سلم الرشاقة، الدحرجة، التسلق، المروق).\n2. يوظف الحركات والمهارات في منافسات الموانع.\n3. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: أطواق\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: سلم التسلق\n- أخرى: حواجز\n- أخرى: أقماع", "المفاهيم": "- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- النموذج", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم حركات الموانع ويعرض النموذج الثالث ص 54: القفز على جانبي المقعد، الحجل داخل الأطواق، الجري في سلم الرشاقة، الدحرجة الأمامية، التسلق والنزول، المروق أسفل الحاجز.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: النموذجان الثالث والرابع ص 54-55: مجموعات في مسارات متماثلة تؤدي التمرينات على الموانع بالتتابع مرتين ويصحح القائد.\n- الطالب: يؤدي ويصحح.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة بين المجموعات في المسار مع احتساب الأداء الصحيح والزمن.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: أي المانع أخذ وقتًا أطول؟ ليستنتج الطلبة أن التسلق يحتاج إلى قوة وتوازن.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر ترتيب مسار اليوم.\nالإجابة: القفز على جانبي المقعد، الحجل داخل الأطواق، سلم الرشاقة، الدحرجة، التسلق، المروق.\nس2 (المستوى المتوقع): ما الحركة التي أديناها داخل الأطواق؟\nالإجابة: الحجل.\nس3 (المستوى المتقدم): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ المسار كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (المستوى المتوقع): اقترح مانعًا جديدًا والحركة المناسبة له.\nالإجابة: مثل: كرة كبيرة والزحف بها.\nس3 (المستوى المتقدم): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مسار موانع منزلي آمن وتسجيل زمنه (دليل المعلم ص 54-56)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع والأجهزة المستخدمة (لوح التأرجح، سلم التسلق، الكرة المطاطية الكبيرة).\n2. يؤدي حركات تخطي الموانع بأمان (التسلق والنزول، المشي على لوح التأرجح، المروق، الوثب).\n3. يختار الحركة المناسبة لكل مانع.\n\nالحصة 2:\n1. يؤدي نماذج مسارات الموانع بالتتابع (القفز على جانبي المقعد، الحجل داخل الأطواق، الجري في سلم الرشاقة، الدحرجة، التسلق، المروق).\n2. يوظف الحركات والمهارات في منافسات الموانع.\n3. يشعر بالثقة في النفس عند تخطي الموانع.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: لوح التأرجح\n- أخرى: سلم التسلق\n- أخرى: كرات مطاطية كبيرة\n- أخرى: حواجز\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: أطواق\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: سلم التسلق\n- أخرى: حواجز\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- تمرينات الموانع\n- المانع\n- التسلق\n- التأرجح\n- الأمان\n\nالحصة 2:\n- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- النموذج", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم الأجهزة ويسأل: كيف نتخطى كل جهاز؟ ويذكر أن جمباز الموانع ينمي عناصر اللياقة كلها (ص 49-51).\n\nالحصة 2:\nيراجع المعلم حركات الموانع ويعرض النموذج الثالث ص 54: القفز على جانبي المقعد، الحجل داخل الأطواق، الجري في سلم الرشاقة، الدحرجة الأمامية، التسلق والنزول، المروق أسفل الحاجز.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج كل مانع ص 52-53: الجري والمشي والزحف فوق لوح التأرجح، التسلق والنزول والتعلق على سلم التسلق، الجري المتعرج بين الكرات الكبيرة والزحف بالكرة، المروق أسفل الحاجز، مع نقاط الأمان.\n- الطالب: يقلد كل حركة بعد النموذج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب الطالب تخطي المانع نفسه بطريقتين (المشي أم الزحف على لوح التأرجح) ويكتشف الأسرع والآمن.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تؤدي مسارًا قصيرًا بثلاثة موانع بالتتابع ويسجل القائد الأداء الآمن.\n- الطالب: يؤدي المسار.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: النموذجان الثالث والرابع ص 54-55: مجموعات في مسارات متماثلة تؤدي التمرينات على الموانع بالتتابع مرتين ويصحح القائد.\n- الطالب: يؤدي ويصحح.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة بين المجموعات في المسار مع احتساب الأداء الصحيح والزمن.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: أي المانع أخذ وقتًا أطول؟ ليستنتج الطلبة أن التسلق يحتاج إلى قوة وتوازن.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): اذكر جهازين من أجهزة الموانع.\nالإجابة: لوح التأرجح وسلم التسلق.\nس2 (المستوى المتوقع): ما الحركة المناسبة للكرة المطاطية الكبيرة؟\nالإجابة: الجري المتعرج بينها أو الزحف بها.\nس3 (المستوى المتقدم): لماذا تنمي تمرينات الموانع اللياقة؟\nالإجابة: لأنها تجمع الجري والوثب والتسلق والتوازن.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر ترتيب مسار اليوم.\nالإجابة: القفز على جانبي المقعد، الحجل داخل الأطواق، سلم الرشاقة، الدحرجة، التسلق، المروق.\nس2 (المستوى المتوقع): ما الحركة التي أديناها داخل الأطواق؟\nالإجابة: الحجل.\nس3 (المستوى المتقدم): كيف تحسب النقاط في المنافسة؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ التسلق والنزول على سلم التسلق.\nالإجابة: يؤديه بأمان.\nس2 (المستوى المتوقع): اختر حركة لتخطي الحاجز وعلل.\nالإجابة: المروق لأن الحاجز مرتفع (أو الوثب لأنه منخفض).\nس3 (المستوى المتقدم): ما قاعدة الأمان على لوح التأرجح؟\nالإجابة: المشي بتوازن والنظر للأمام وعدم الدفع.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ المسار كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (المستوى المتوقع): اقترح مانعًا جديدًا والحركة المناسبة له.\nالإجابة: مثل: كرة كبيرة والزحف بها.\nس3 (المستوى المتقدم): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في تمرينات الموانع (دليل المعلم ص 49-53).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مسار موانع منزلي آمن وتسجيل زمنه (دليل المعلم ص 54-56)."}}, {"title": "سباقات الجري", "unit": "ألعاب القوى للصغار", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 59-67", "n": 2, "periods": [{"focus": "سباق تتابع العدو والحواجز", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد تتابع العدو والحواجز.\n2. يؤدي العدو وتعدية الحواجز وتسليم الحلق المطاطي.\n3. يطبق قواعد السباق (التسليم داخل المنطقة، تعدية جميع الحواجز).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز\n- أخرى: حلق مطاطية\n- أخرى: شريط قياس\n- أخرى: ساعة إيقاف\n- صورة توضيحية", "المفاهيم": "- عدو الحواجز\n- عدو التتابع\n- ضبط الإيقاع\n- التسليم", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور سباقات الحواجز ويسأل: كيف يتخطى العداء الحاجز دون أن يبطئ؟ ويقدم السباق (ص 59-61).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، رفع الركبتين، وثب فوق حواجز منخفضة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج العدو وتعدية الحاجز (الرجل القائدة ممدودة والجذع مائل للأمام ومتابعة الجري دون توقف) وتسليم الحلق المطاطي للزميل داخل المنطقة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط تتابع العدو والحواجز ص 63: فريقان في قطارين، يعدو الأول ويتخطى الحواجز ويسلم الحلق للتالي، ويراقب القائد التسليم.\n- الطالب: يؤدي السباق.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا نسلم للزميل في السباق؟\nالإجابة: الحلق المطاطي.\nس2 (المستوى المتوقع): كيف نتخطى الحاجز دون إبطاء؟\nالإجابة: بمد الرجل القائدة وميل الجذع ومتابعة الجري.\nس3 (المستوى المتقدم): ما الخطأ الذي يُحتسب على الفريق؟\nالإجابة: التسليم خارج المنطقة أو إسقاط الحاجز.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدتين لسباق تتابع العدو والحواجز.\nالإجابة: التسليم داخل المنطقة، وتعدية جميع الحواجز.\nس2 (المستوى المتوقع): أدِّ العدو وتعدية حاجزين.\nالإجابة: يؤديه دون توقف.\nس3  آخر طالب؟\nالإجابة: لمعرفة توقيت انتهاء السباق.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ دورة كاملة في مسار الفورميلا.\nالإجابة: يؤديها بتعدية الموانع.\nس2 (المستوى المتوقع): ما القدرات البدنية التي يحتاجها هذا السباق؟\nالإجابة: التوافق والرشاقة والسرعة.\nس3 (المستوى المتقدم): كيف شعرت بمشاركة فريقك؟\nالإجابة: يعبر عن الرضا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد سباقات الجري وشجعه على الجري اليومي (دليل المعلم ص 61-67)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد تتابع العدو والحواجز.\n2. يؤدي العدو وتعدية الحواجز وتسليم الحلق المطاطي.\n3. يطبق قواعد السباق (التسليم داخل المنطقة، تعدية جميع الحواجز).\n\nالحصة 2:\n1. يتعرف سباق التتابع المتنوع وقواعده.\n2. يؤدي العدو وتعدية الموانع المتنوعة (أطواق، أقماع، حواجز) في مسار دائري.\n3. يشعر بالسعادة والرضا بمشاركة زملائه سباقات الجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: حواجز\n- أخرى: حلق مطاطية\n- أخرى: شريط قياس\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: حواجز متنوعة\n- أخرى: حلق مطاطية\n- أخرى: أعلام", "المفاهيم": "الحصة 1:\n- عدو الحواجز\n- عدو التتابع\n- ضبط الإيقاع\n- التسليم\n\nالحصة 2:\n- التتابع المتنوع\n- المسار الدائري\n- الموانع\n- الرشاقة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور سباقات الحواجز ويسأل: كيف يتخطى العداء الحاجز دون أن يبطئ؟ ويقدم السباق (ص 59-61).\n\nالحصة 2:\nيراجع المعلم سباق الحواجز، ثم يعرض المسار الدائري (نصف قطره 8 م) بالموانع المتنوعة ويقدم الفورميلا (ص 61).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، رفع الركبتين، وثب فوق حواجز منخفضة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج العدو وتعدية الحاجز (الرجل القائدة ممدودة والجذع مائل للأمام ومتابعة الجري دون توقف) وتسليم الحلق المطاطي للزميل داخل المنطقة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط تتابع العدو والحواجز ص 63: فريقان في قطارين، يعدو الأول ويتخطى الحواجز ويسلم الحلق للتالي، ويراقب القائد التسليم.\n- الطالب: يؤدي السباق.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج المسار: العدو، الوثب داخل الأطواق، الجري المتعرج بين الأقماع، تعدية الحواجز، تسليم الحلق، مع علامة لآخر طالب.\n- الطالب: يقلد كل منطقة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط التتابع المتنوع ص 65-66: فريقان خارج المسار، ينطلق الأول بالحلق ويكمل الدورة ويسلم للتالي، حتى يكمل الجميع.\n- الطالب: يؤدي السباق.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق وتحديد الفائز.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ماذا نسلم للزميل في السباق؟\nالإجابة: الحلق المطاطي.\nس2 (المستوى المتوقع): كيف نتخطى الحاجز دون إبطاء؟\nالإجابة: بمد الرجل القائدة وميل الجذع ومتابعة الجري.\nس3 (المستوى المتقدم): ما الخطأ الذي يُحتسب على الفريق؟\nالإجابة: التسليم خارج المنطقة أو إسقاط الحاجز.\n\nالحصة 2:\nس1 (مستوى الدعم): ما شكل مسار الفورميلا؟\nالإجابة: دائري نصف قطره 8 م.\nس2 (المستوى المتوقع): اذكر ثلاثة موانع في المسار.\nالإجابة: أطواق وأقماع وحواجز.\nس3 (المستوى المتقدم): لماذا نضع علامة على آخر طالب؟\nالإجابة: لمعرفة توقيت انتهاء السباق.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر قاعدتين لسباق تتابع العدو والحواجز.\nالإجابة: التسليم داخل المنطقة، وتعدية جميع الحواجز.\nس2 (المستوى المتوقع): أدِّ العدو وتعدية حاجزين.\nالإجابة: يؤديه دون توقف.\nس3 (المستوى المتقدم): كيف يتم تحديد المجموعة الفائزة؟\nالإجابة: التي تنهي السباق أولًا دون أخطاء.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ دورة كاملة في مسار الفورميلا.\nالإجابة: يؤديها بتعدية الموانع.\nس2 (المستوى المتوقع): ما القدرات البدنية التي يحتاجها هذا السباق؟\nالإجابة: التوافق والرشاقة والسرعة.\nس3 (المستوى المتقدم): كيف شعرت بمشاركة فريقك؟\nالإجابة: يعبر عن الرضا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الجري مع تخطي حواجز منخفضة بأمان (دليل المعلم ص 60-63).\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد سباقات الجري وشجعه على الجري اليومي (دليل المعلم ص 61-67)."}}, {"title": "مسابقات الوثب", "unit": "ألعاب القوى للصغار", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 68-76", "n": 2, "periods": [{"focus": "مسابقة الوثب الطويل مع دقة الأداء", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الوثب وقواعد الوثب الطويل مع دقة الأداء.\n2. يؤدي الوثب الطويل من الاقتراب بمراحله (الاقتراب، الارتقاء، الطيران، الهبوط).\n3. يطبق قواعد المسابقة (الارتقاء قبل الخط، الهبوط في المنطقة المحددة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: مراتب\n- أخرى: أعلام\n- أخرى: حلق التتابع\n- صورة توضيحية", "المفاهيم": "- الوثب الطويل\n- الاقتراب\n- الارتقاء\n- الهبوط\n- دقة الأداء", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب الوثب الطويل في الهواء ويسأل: ما مراحل الوثبة؟ ويقدم المسابقة (ص 68-70).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب في المكان، وثب من خطوتين.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الوثب الطويل: اقتراب 5-7 خطوات، ارتقاء بقدم واحدة قبل الخط، طيران مع مرجحة الذراعين، هبوط على القدمين بثني الركبتين داخل منطقة الدقة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 73-74: فرق في قطارات، يؤدي كل طالب الوثب ويحتسب القائد النقاط حسب منطقة الهبوط (مناطق مرقمة) وصحة الأداء.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق بمجموع نقاط الدقة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما مراحل الوثب الطويل؟\nالإجابة: الاقتراب، الارتقاء، الطيران، الهبوط.\nس2 (المستوى المتوقع): بكم قدم نرتقي؟\nالإجابة: بقدم واحدة.\nس3 (المستوى المتقدم): كيف تحسب النقاط في مسابقة الدقة؟\nالإجابة: حسب منطقة الهبوط وصحة الأداء.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب الطويل من الاقتراب.\nالإجابة: يؤديه بالمراحل الأربع.\nس2 (المستوى المتوقع): ماذا يحدث لو تجاوزت القدم خط الارتقاء؟\nالإجابة: تحتسب المحاولة خاطئة.\nس3 (المستوى المتقدم): ما الفرق بين وثبة القرفصاء والوثب الطويل من الاقتراب؟\nالإجابة: القرفصاء من الثبات بالقدمين، والطويل من الجري والارتقاء بقدم واحدة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على الوثب من الاقتراب في مكان رملي أو آمن (دليل المعلم ص 69-74)."}}, {"focus": "مسابقة الوثب الثلاثي من الاقتراب القصير", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الوثب الثلاثي وتسلسله (الحجلة، الخطوة، الوثبة).\n2. يؤدي الوثب الثلاثي من اقتراب قصير بإيقاع صحيح.\n3. يستمتع بمشاركة زملائه مسابقات الوثب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أعلام", "المفاهيم": "- الوثب الثلاثي\n- الحجلة\n- الخطوة\n- الوثبة\n- خط الارتقاء", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الوثب الطويل ويسأل: ماذا لو وثبنا ثلاث مرات متتالية؟ ويعرض تسلسل الوثب الثلاثي (ص 70).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: حجل بالتبادل، تبادل الخطو والحجل.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب 5 م، حجلة على قدم الارتقاء، خطوة على القدم الأخرى، وثبة والهبوط على القدمين، بالعد (هوب، ستيب، جمب) وبإيقاع متساوٍ.\n- الطالب: يقلد بالتدرج داخل الأطواق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 75: قطارات، يؤدي كل طالب الوثب الثلاثي ويقيس القائد المسافة من خط الارتقاء إلى أقرب أثر، وتجمع مسافات الفريق.\n- الطالب: يؤدي ويقيس.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق بمجموع المسافات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما تسلسل الوثب الثلاثي؟\nالإجابة: حجلة، خطوة، وثبة.\nس2 (المستوى المتوقع): على أي قدم نهبط بعد الحجلة؟\nالإجابة: على قدم الارتقاء نفسها.\nس3 (المستوى المتقدم): من أين تقاس المسافة؟\nالإجابة: من خط الارتقاء إلى أقرب أثر للهبوط.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب الثلاثي من الاقتراب القصير.\nالإجابة: يؤديه بالتسلسل الصحيح.\nس2 (المستوى المتوقع): كم محاولة تمنح للطالب؟\nالإجابة: محاولتان أو ثلاث وتسجل الأفضل.\nس3 (المستوى المتقدم): كيف يفوز الفريق؟\nالإجابة: بأطول مجموع لمسافات أفراده.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على إيقاع (حجلة، خطوة، وثبة) في مكان آمن (دليل المعلم ص 70-76)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الوثب وقواعد الوثب الطويل مع دقة الأداء.\n2. يؤدي الوثب الطويل من الاقتراب بمراحله (الاقتراب، الارتقاء، الطيران، الهبوط).\n3. يطبق قواعد المسابقة (الارتقاء ستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الذراعين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس2 (المستوى المتوقع): أين يجب أن يسقط الرمح؟\nالإجابة: داخل مقطع الرمي.\nس3 (المستوى المتقدم): اذكر قاعدة أمان.\nالإجابة: الرمي بإشارة المعلم فقط.", "التقويم الختامي": "س1 (مستوى الدعم): ارمِ الرمح من الاقتراب.\nالإجابة: يرمي قبل الخط داخل المقطع.\nس2 (المستوى المتوقع): ماذا يحدث لو تجاوز الرامي خط الرمي؟\nالإجابة: تحتسب المحاولة خاطئة.\nس3 (المستوى المتقدم): كم محاولة تمنح وأيها تحتسب؟\nالإجابة: محاولتان أو ثلاث وتحتسب الأفضل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في الرمي ولا يرمي أدوات مدببة في الحي (دليل المعلم ص 78-83)."}}, {"focus": "مسابقة قذف القرص المطاطي", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقة قذف القرص المطاطي وقواعدها.\n2. يؤدي قذف القرص المطاطي من الوقوف مواجهًا بالكتف.\n3. يشعر بالسعادة والرضا بمشاركة زملائه مسابقات الرمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقراص مطاطية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: كرات طبية", "المفاهيم": "- قذف القرص\n- الدوران\n- زاوية الرمي\n- مقطع الرمي", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم رمي الرمح ويعرض القرص المطاطي ويسأل: كيف نمسكه وكيف نقذفه؟ (ص 79).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع لف الجذع.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف مواجهًا بالكتف في منطقة الاقتراب (3×3 م)، مسك القرص والأصابع على حافته، مرجحة الذراع خلفًا ولف الجذع ثم القذف للأمام بزاوية مناسبة، وقياس المسافة من خط الرمي إلى أقرب أثر.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 84: مجموعات، محاولتان لكل طالب، ويس ويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس2 (المستوى المتوقع): أين يجب أن يسقط الرمح؟\nالإجابة: داخل مقطع الرمي.\nس3 (المستوى المتقدم): اذكر قاعدة أمان.\nالإجابة: الرمي بإشارة المعلم فقط.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف نقف قبل قذف القرص؟\nالإجابة: مواجهين بالكتف لاتجاه الرمي.\nس2 (المستوى المتوقع): أين توضع الأصابع على القرص؟\nالإجابة: على حافته.\nس3 (المستوى المتقدم): ماذا يحدث لو سقط القرص بعد 30 م؟\nالإجابة: يمنح الطالب 10 م إضافية.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ارمِ الرمح من الاقتراب.\nالإجابة: يرمي قبل الخط داخل المقطع.\nس2 (المستوى المتوقع): ماذا يحدث لو تجاوز الرامي خط الرمي؟\nالإجابة: تحتسب المحاولة خاطئة.\nس3 (المستوى المتقدم): كم محاولة تمنح وأيها تحتسب؟\nالإجابة: محاولتان أو ثلاث وتحتسب الأفضل.\n\nالحصة 2:\nس1 (مستوى الدعم): اقذف القرص المطاطي من الوقوف.\nالإجابة: يقذفه بلف الجذع داخل المقطع.\nس2 (المستوى المتوقع): ما أبعاد منطقة الاقتراب؟\nالإجابة: 3 م × 3 م.\nس3 (المستوى المتقدم): كيف شعرت في مسابقات الرمي؟\nالإجابة: يعبر عن الرضا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في الرمي ولا يرمي أدوات مدببة في الحي (دليل المعلم ص 78-83).\n\nالحصة 2:\nإرشاد لولي الأمر: يمكن استخدام قرص بلاستيكي خفيف (فريزبي) في المنزل بأمان (دليل المعلم ص 79-85)."}}, {"title": "الاختبار العملي (1)", "unit": "تقويم", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 35-85 (اللياقة البدنية وألعاب القوى للصغار)", "n": 2, "periods": [{"focus": "اختبار عملي في عناصر اللياقة البدنية وتمرينات الموانع", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي اختبارًا مبسطًا للمرونة (ثني الجذع من الجلوس الطويل).\n2. يؤدي اختبارًا للرشاقة (الجري المكوكي) وللتوافق (لوحة الأرقام).\n3. يؤدي مسار موانع قصيرًا بالحركات الصحيحة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مسطرة قياس\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n-
