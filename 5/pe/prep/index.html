ي في ثلاث محطات مع تدريب ذاتي: محطة 1 عدو 20 م مع تعدية حاجزين والتسليم، محطة 2 الوثب الطويل من الاقتراب والوثب الثلاثي مع القياس، محطة 3 رمي الرمح وقذف القرص (محاولتان)؛ ويرصد المعلم.\n- الطالب: يؤدي عند دوره ويتدرب مستقلًا.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق ختامي قصير.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعزيز.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما العنصر الذي يقيسه ثني الجذع من الجلوس؟\nالإجابة: المرونة.\nس2 (المستوى المتوقع): ما العنصر الذي يقيسه الجري المكوكي؟\nالإجابة: الرشاقة.\nس3 (المستوى المتقدم): ما العنصر الذي يقيسه الوثب على لوحة الأرقام؟\nالإجابة: التوافق.\n\nالحصة 2:\nس1 (مستوى الدعم): ما مراحل الوثب الطويل؟\nالإجابة: الاقتراب، الارتقاء، الطيران، الهبوط.\nس2 (المستوى المتوقع): أين يجب أن يسقط الرمح؟\nالإجابة: داخل مقطع الرمي.\nس3 (المستوى المتقدم): ما تسلسل الوثب الثلاثي؟\nالإجابة: حجلة، خطوة، وثبة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الجري المكوكي 4×10 م.\nالإجابة: يؤديه بتغيير اتجاه سريع.\nس2 (المستوى المتوقع): اذكر تمرينًا لتنمية المرونة.\nالإجابة: مد اليدين للقدمين من الجلوس الطويل.\nس3 (المستوى المتقدم): كيف تحسن نتيجتك في اختبار المرونة؟\nالإجابة: بتمرينات الإطالة اليومية.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الوثب الثلاثي من الاقتراب القصير.\nالإجابة: يؤديه بالتسلسل.\nس2 (المستوى المتوقع): اقذف القرص من الوقوف مواجهًا بالكتف.\nالإجابة: يقذف داخل المقطع.\nس3 (المستوى المتقدم): ما المسابقة التي أتقنتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طالبك مهارات ألعاب القوى قبل الحصة الثانية من الاختبار (دليل المعلم ص 59-85).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على ممارسة الجري والوثب والرمي بأمان، والاطلاع على قواعد كرة القدم للصغار قبل الأسبوع القادم (دليل المعلم ص 89-93)."}}, {"title": "لعبة كرة القدم للصغار", "unit": "الألعاب الحركية (1)", "week": "الثامن – التاسع", "date": "25-29/10/2026 إلى 1-5/11/2026", "pages": "دليل المعلم ص 89-99", "n": 4, "periods": [{"focus": "التعريف باللعبة وقواعدها ومهارتا التمرير بباطن القدم والاستلام بأسفل القدم", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف بعض القواعد القانونية لكرة القدم للصغار (الملعب، الكرة، احتساب الهدف).\n2. يؤدي التمرير بباطن القدم والاستلام بأسفل القدم.\n3. يميز متى يستخدم التمرير القصير بباطن القدم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: قوائم\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة القدم للصغار\n- التمرير\n- باطن القدم\n- الاستلام بأسفل القدم\n- الملعب", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ملعب كرة القدم للصغار ويسأل: ما الفرق بينه وبين الملعب الرسمي؟ ويشرح القواعد المبسطة (ص 90-91).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 91-93: التمرير بباطن القدم (القدم المرتكزة بجانب الكرة، ركل الكرة بباطن القدم من منتصفها، متابعة الحركة)، والاستلام بأسفل القدم (ميل الجذع، تقديم الرجل، لمس الكرة بأسفل القدم وسحبها لامتصاص قوتها)، ثم تطبيق موجه في أزواج.\n- الطالب: يقلد ويتبادل مع زميله.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 95: صفوف متقابلة (ثنائيات) تبادل التمرير بباطن القدم والاستلام بأسفل القدم على مسافة 5 م ثم 8 م، ثم التمرير نحو المقعد السويدي والاستلام بعد ارتداده.\n- الطالب: يتدرب مع زميله.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (التمرير داخل المربع): مجموعات تمرر بباطن القدم ومدافع واحد يحاول قطع الكرة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء من القدم نمرر الكرة للمسافات القصيرة؟\nالإجابة: بباطن القدم.\nس2 (المستوى المتوقع): متى يُحتسب الهدف؟\nالإجابة: عندما تتجاوز الكرة بكاملها خط المرمى بين القائمين وتحت العارضة.\nس3 (المستوى المتقدم): كيف نستلم الكرة بأسفل القدم؟\nالإجابة: نضع أسفل القدم على الكرة ونسحبها قليلًا لامتصاص قوتها.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التمرير بباطن القدم لزميلك واستلم كرته بأسفل القدم.\nالإجابة: يؤديهما بالطريقة الصحيحة.\nس2 (المستوى المتوقع): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس3 (المستوى المتقدم): لماذا نستخدم باطن القدم في التمرير القصير؟\nالإجابة: لأنه يعطي دقة أكبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طالبك التمرير بباطن القدم والاستلام في الحديقة 10 دقائق (دليل المعلم ص 90-95)."}}, {"focus": "الجري بالكرة والتمرير بوجه القدم الداخلي والخارجي", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الجري بالكرة بدفعها بوجه القدم الخارجي مع النظر للأمام.\n2. يؤدي التمرير بوجه القدم الداخلي والخارجي.\n3. يميز بين أنواع التمرير حسب المسافة والاتجاه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مقاعد سويدية", "المفاهيم": "- الجري بالكرة\n- وجه القدم الداخلي\n- وجه القدم الخارجي\n- السيطرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمرير بباطن القدم ويسأل: كيف نتقدم بالكرة في مساحة خالية؟ ويعرض الجري بالكرة (ص 92).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الجري بالكرة بدفعها بوجه القدم الخارجي خطوة بخطوة والنظر للأمام والمحافظة على قربها، ثم التمرير بوجه القدم الداخلي (للتمريرات المتوسطة) والخارجي، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 95: قطارات متقابلة: الجري بالكرة 5 م ثم تمريرها للزميل المقابل، الجري بالكرة ثم التوقف داخل المربع ثم المتابعة، الجري بالكرة بين الأقماع بوجه القدم الخارجي والداخلي.\n- الطالب: يتدرب ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (من يصل أولًا): تتابع الجري بالكرة بين الأقماع والتمرير للتالي.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء ندفع الكرة في الجري بها؟\nالإجابة: بوجه القدم الخارجي.\nس2 (المستوى المتوقع): لماذا ننظر للأمام أثناء الجري بالكرة؟\nالإجابة: لرؤية الملعب والزملاء.\nس3 (المستوى المتقدم): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة.", "التقويم الختامي": "س1 (مستوى الدعم): اجرِ بالكرة بين الأقماع ثم مررها بوجه القدم الداخلي.\nالإجابة: يؤديه مع المحافظة على الكرة.\nس2 (المستوى المتوقع): ما الفرق بين التمرير بباطن القدم وبوجه القدم الخارجي؟\nالإجابة: باطن القدم للدقة القصيرة، والخارجي للتمرير الجانبي السريع.\nس3 (المستوى المتقدم): كيف نحافظ على الكرة أثناء الجري؟\nالإجابة: بإبقائها قريبة من القدم ودفعها برفق.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الجري بالكرة بين عوائق في الحديقة (دليل المعلم ص 92-95)."}}, {"focus": "محطات مهارات كرة القدم للصغار", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي مهارات التمرير والاستلام والجري بالكرة في محطات.\n2. يوظف المهارات في مواقف تنافسية بسيطة (مدافع واحد).\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مقاعد سويدية\n- أخرى: أطواق", "المفاهيم": "- المحطات\n- التمرير\n- الاستلام\n- المدافع", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات مهارات كرة القدم) ص 96: محطة 1 الجري بالكرة بين الأقماع دون لمسها، محطة 2 التمرير نحو المقعد السويدي والاستلام بعد الارتداد، محطة 3 صفان متقابلان تمرير مع التحرك للأمام، محطة 4 دائرة بمدافع يحاول قطع التمرير، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 2 ص 97: منافسة ثنائيات: تمرير مع التحرك للأمام ثم التصويب بين قمعين، والمجموعة الأكثر أهدافًا تفوز.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى قطع المدافع الكرة؟ ليستنتج الطلبة أهمية التمرير السريع والدقيق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما مهمة المدافع في محطة الدائرة؟\nالإجابة: قطع التمرير والاستحواذ على الكرة.\nس2 (المستوى المتوقع): في أي محطة استخدمنا المقعد السويدي؟\nالإجابة: محطة التمرير والاستلام بعد الارتداد.\nس3 (المستوى المتقدم): متى تنتهي المحاولة في منافسة الثنائيات؟\nالإجابة: عند فقد السيطرة على الكرة.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الجري بين الأقماع والدائرة بالمدافع.\nس2 (المستوى المتوقع): كيف تتجنب قطع المدافع لتمريرتك؟\nالإجابة: بتمرير سريع ودقيق وبعيدًا عن المدافع.\nس3 (المستوى المتقدم): كيف ساعدت مجموعتك اليوم؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يمرر مع زميل (دليل المعلم ص 96-97)."}}, {"focus": "منافسات ومباريات مصغرة في كرة القدم للصغار", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية لكرة القدم للصغار في مباراة مصغرة.\n2. يوظف المهارات الأساسية أثناء المباراة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: قوائم\n- أخرى: صدريات ملونة", "المفاهيم": "- المباراة المصغرة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد (الملعب، احتساب الهدف، الركلة الجانبية) ويقسم الفرق ويحدد حكامًا من الطلبة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 (ب) ص 97: ساحة 15×15 م بأربعة مرامٍ، مجموعتان تحاولان التسجيل في أي مرمى بالتمرير والتصويب.\n- الطالب: يلعب.\n\nالنشاط 3 (17 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 5 (مباريات مصغرة) ص 99: فرق من 5 لاعبين، مباريات 5 دقائق بالتبادل، يدير الطلبة التحكيم بأدوار (حكم، مسجل نقاط)، ويطبق المعلم القواعد.\n- الطالب: يلعب بدوره ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سجل الفريق الفائز أكثر؟ ليستنتج الطلبة أهمية التمرير والانتشار في الملعب.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة الفرق.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): كم لاعبًا في فريق اليوم؟\nالإجابة: 5 لاعبين.\nس2 (المستوى المتوقع): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس3 (المستوى المتقدم): لماذا ينتشر اللاعبون في الملعب؟\nالإجابة: لتسهيل التمرير وفتح المساحات.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: احتساب الهدف عند تجاوز الكرة خط المرمى بالكامل.\nس2 (المستوى المتوقع): ما المهارة التي استخدمتها أكثر في المباراة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تتصرف إذا خسر فريقك؟\nالإجابة: أصافح الفريق الآخر وأهنئه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على البحث عن قصة نجاح فريق أو لاعب عماني في كرة القدم (التعلم الذاتي، دليل المعلم ص 99) والاطلاع على قواعد كرة السلة للصغار (ص 100-103)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف بعض القواعد القانونية لكرة القدم للصغار (الملعب، الكرة، احتساب الهدف).\n2. يؤدي التمرير بباطن القدم والاستلام بأسفل القدم.\n3. يميز متى يستخدم التمرير القصير بباطن القدم.\n\nالحصة 2:\n1. يؤدي الجري بالكرة بدفعها بوجه القدم الخارجي مع النظر للأمام.\n2. يؤدي التمرير بوجه القدم الداخلي والخارجي.\n3. يميز بين أنواع التمرير حسب المسافة والاتجاه.\n\nالحصة 3:\n1. يؤدي مهارات التمرير والاستلام والجري بالكرة في محطات.\n2. يوظف المهارات في مواقف تنافسية بسيطة (مدافع واحد).\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات.\n\nالحصة 4:\n1. يطبق القواعد القانونية لكرة القدم للصغار في مباراة مصغرة.\n2. يوظف المهارات الأساسية أثناء المباراة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: قوائم\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مقاعد سويدية\n\nالحصة 3:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مقاعد سويدية\n- أخرى: أطواق\n\nالحصة 4:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: قوائم\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة القدم للصغار\n- التمرير\n- باطن القدم\n- الاستلام بأسفل القدم\n- الملعب\n\nالحصة 2:\n- الجري بالكرة\n- وجه القدم الداخلي\n- وجه القدم الخارجي\n- السيطرة\n\nالحصة 3:\n- المحطات\n- التمرير\n- الاستلام\n- المدافع\n\nالحصة 4:\n- المباراة المصغرة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة ملعب كرة القدم للصغار ويسأل: ما الفرق بينه وبين الملعب الرسمي؟ ويشرح القواعد المبسطة (ص 90-91).\n\nالحصة 2:\nيراجع المعلم التمرير بباطن القدم ويسأل: كيف نتقدم بالكرة في مساحة خالية؟ ويعرض الجري بالكرة (ص 92).\n\nالحصة 3:\nيراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.\n\nالحصة 4:\nيراجع المعلم القواعد (الملعب، احتساب الهدف، الركلة الجانبية) ويقسم الفرق ويحدد حكامًا من الطلبة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 91-93: التمرير بباطن القدم (القدم المرتكزة بجانب الكرة، ركل الكرة بباطن القدم من منتصفها، متابعة الحركة)، والاستلام بأسفل القدم (ميل الجذع، تقديم الرجل، لمس الكرة بأسفل القدم وسحبها لامتصاص قوتها)، ثم تطبيق موجه في أزواج.\n- الطالب: يقلد ويتبادل مع زميله.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 95: صفوف متقابلة (ثنائيات) تبادل التمرير بباطن القدم والاستلام بأسفل القدم على مسافة 5 م ثم 8 م، ثم التمرير نحو المقعد السويدي والاستلام بعد ارتداده.\n- الطالب: يتدرب مع زميله.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (التمرير داخل المربع): مجموعات تمرر بباطن القدم ومدافع واحد يحاول قطع الكرة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الجري بالكرة بدفعها بوجه القدم الخارجي خطوة بخطوة والنظر للأمام والمحافظة على قربها، ثم التمرير بوجه القدم الداخلي (للتمريرات المتوسطة) والخارجي، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 95: قطارات متقابلة: الجري بالكرة 5 م ثم تمريرها للزميل المقابل، الجري بالكرة ثم التوقف داخل المربع ثم المتابعة، الجري بالكرة بين الأقماع بوجه القدم الخارجي والداخلي.\n- الطالب: يتدرب ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (من يصل أولًا): تتابع الجري بالكرة بين الأقماع والتمرير للتالي.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات مهارات كرة القدم) ص 96: محطة 1 الجري بالكرة بين الأقماع دون لمسها، محطة 2 التمرير نحو المقعد السويدي والاستلام بعد الارتداد، محطة 3 صفان متقابلان تمرير مع التحرك للأمام، محطة 4 دائرة بمدافع يحاول قطع التمرير، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 2 ص 97: منافسة ثنائيات: تمرير مع التحرك للأمام ثم التصويب بين قمعين، والمجموعة الأكثر أهدافًا تفوز.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى قطع المدافع الكرة؟ ليستنتج الطلبة أهمية التمرير السريع والدقيق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 (ب) ص 97: ساحة 15×15 م بأربعة مرامٍ، مجموعتان تحاولان التسجيل في أي مرمى بالتمرير والتصويب.\n- الطالب: يلعب.\n\nالنشاط 3 (17 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 5 (مباريات مصغرة) ص 99: فرق من 5 لاعبين، مباريات 5 دقائق بالتبادل، يدير الطلبة التحكيم بأدوار (حكم، مسجل نقاط)، ويطبق المعلم القواعد.\n- الطالب: يلعب بدوره ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سجل الفريق الفائز أكثر؟ ليستنتج الطلبة أهمية التمرير والانتشار في الملعب.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة الفرق.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): بأي جزء من القدم نمرر الكرة للمسافات القصيرة؟\nالإجابة: بباطن القدم.\nس2 (المستوى المتوقع): متى يُحتسب الهدف؟\nالإجابة: عندما تتجاوز الكرة بكاملها خط المرمى بين القائمين وتحت العارضة.\nس3 (المستوى المتقدم): كيف نستلم الكرة بأسفل القدم؟\nالإجابة: نضع أسفل القدم على الكرة ونسحبها قليلًا لامتصاص قوتها.\n\nالحصة 2:\nس1 (مستوى الدعم): بأي جزء ندفع الكرة في الجري بها؟\nالإجابة: بوجه القدم الخارجي.\nس2 (المستوى المتوقع): لماذا ننظر للأمام أثناء الجري بالكرة؟\nالإجابة: لرؤية الملعب والزملاء.\nس3 (المستوى المتقدم): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما مهمة المدافع في محطة الدائرة؟\nالإجابة: قطع التمرير والاستحواذ على الكرة.\nس2 (المستوى المتوقع): في أي محطة استخدمنا المقعد السويدي؟\nالإجابة: محطة التمرير والاستلام بعد الارتداد.\nس3 (المستوى المتقدم): متى تنتهي المحاولة في منافسة الثنائيات؟\nالإجابة: عند فقد السيطرة على الكرة.\n\nالحصة 4:\nس1 (مستوى الدعم): كم لاعبًا في فريق اليوم؟\nالإجابة: 5 لاعبين.\nس2 (المستوى المتوقع): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس3 (المستوى المتقدم): لماذا ينتشر اللاعبون في الملعب؟\nالإجابة: لتسهيل التمرير وفتح المساحات.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ التمرير بباطن القدم لزميلك واستلم كرته بأسفل القدم.\nالإجابة: يؤديهما بالطريقة الصحيحة.\nس2 (المستوى المتوقع): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس3 (المستوى المتقدم): لماذا نستخدم باطن القدم في التمرير القصير؟\nالإجابة: لأنه يعطي دقة أكبر.\n\nالحصة 2:\nس1 (مستوى الدعم): اجرِ بالكرة بين الأقماع ثم مررها بوجه القدم الداخلي.\nالإجابة: يؤديه مع المحافظة على الكرة.\nس2 (المستوى المتوقع): ما الفرق بين التمرير بباطن القدم وبوجه القدم الخارجي؟\nالإجابة: باطن القدم للدقة القصيرة، والخارجي للتمرير الجانبي السريع.\nس3 (المستوى المتقدم): كيف نحافظ على الكرة أثناء الجري؟\nالإجابة: بإبقائها قريبة من القدم ودفعها برفق.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الجري بين الأقماع والدائرة بالمدافع.\nس2 (المستوى المتوقع): كيف تتجنب قطع المدافع لتمريرتك؟\nالإجابة: بتمرير سريع ودقيق وبعيدًا عن المدافع.\nس3 (المستوى المتقدم): كيف ساعدت مجموعتك اليوم؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: احتساب الهدف عند تجاوز الكرة خط المرمى بالكامل.\nس2 (المستوى المتوقع): ما المهارة التي استخدمتها أكثر في المباراة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تتصرف إذا خسر فريقك؟\nالإجابة: أصافح الفريق الآخر وأهنئه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طالبك التمرير بباطن القدم والاستلام في الحديقة 10 دقائق (دليل المعلم ص 90-95).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على الجري بالكرة بين عوائق في الحديقة (دليل المعلم ص 92-95).\n\nالحصة 3:\nإرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يمرر مع زميل (دليل المعلم ص 96-97).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على البحث عن قصة نجاح فريق أو لاعب عماني في كرة القدم (التعلم الذاتي، دليل المعلم ص 99) والاطلاع على قواعد كرة السلة للصغار (ص 100-103)."}}, {"title": "لعبة كرة السلة للصغار", "unit": "الألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 100-113", "n": 6, "periods": [{"focus": "التعريف باللعبة وقواعدها ومهارة مسك الكرة والتمريرة الصدرية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف بعض القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، فترات المباراة، احتساب النقاط).\n2. يؤدي مسك الكرة والتمريرة الصدرية واستلامها.\n3. يميز متى تستخدم التمريرة الصدرية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلال أو أطواق كأهداف بديلة\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة السلة للصغار\n- التمريرة الصدرية\n- مسك الكرة\n- الاستلام\n- القواعد القانونية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة مباراة كرة سلة للصغار ويسأل: كم لاعبًا؟ وكيف تحتسب النقاط؟ ويشرح القواعد المبسطة (ص 101-104).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة مع تمرينات الإحساس بالكرة (تمريرها حول الجسم).\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 105: مسك الكرة أمام الصدر والأصابع منتشرة، سحبها للصدر ثم مد الذراعين بالكامل مع لف اليدين للخارج ودفعها نحو الزميل مع تقديم رجل، والاستلام بمد الذراعين وسحب الكرة للصدر.\n- الطالب: يقلد ويتبادل مع زميل.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 1 ص 109: صفان متقابلان بينهما 2 م تبادل التمريرة الصدرية والاستلام مع العد، ثم زيادة المسافة إلى 4 م، ثم التمرير أثناء المشي.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك): مجموعتان، تحاول كل مجموعة إيصال الكرة لملكها بالتمريرات الصدرية دون تنطيط.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أي مستوى تؤدى التمريرة الصدرية؟\nالإجابة: من مستوى الصدر.\nس2 (المستوى المتوقع): متى نستخدم التمريرة الصدرية؟\nالإجابة: للتمرير السريع عند عدم وجود مدافع في مسار التمرير.\nس3 (المستوى المتقدم): كيف تكون الأصابع عند مسك الكرة؟\nالإجابة: منتشرة على الكرة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التمريرة الصدرية لزميلك.\nالإجابة: يؤديها بمد الذراعين ولف اليدين للخارج.\nس2 (المستوى المتوقع): كم لاعبًا في كرة السلة للصغار وكم فترة للمباراة؟\nالإجابة: يذكر ما ورد في القواعد المبسطة (دليل المعلم ص 102-103).\nس3 (المستوى المتقدم): ما الفرق بين كرة السلة للصغار وكرة السلة الرسمية في احتساب النقاط؟\nالإجابة: يذكر الفرق كما في الدليل ص 103.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طالبك التمريرة الصدرية 20 مرة يوميًا (دليل المعلم ص 101-105)."}}, {"focus": "التمرير من فوق الرأس", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف التمرير من فوق الرأس ومتى يستخدم.\n2. يؤدي التمرير من فوق الرأس واستلامه.\n3. يختار نوع التمريرة (صدرية أو من فوق الرأس) حسب موقف المدافع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "- التمرير من فوق الرأس\n- المدافع\n- المسافة المتوسطة\n- الاستلام", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمريرة الصدرية ثم يقف مدافع قصير بين طالبين ويسأل: كيف نمرر فوقه؟ (ص 105).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك الكرة فوق الرأس والذراعان منثنيتان قليلًا، مد الذراعين للأمام وثني الرسغين لدفع الكرة نحو الزميل في مستوى الصدر، مع تقديم رجل، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: صفان متقابلان تبادل التمرير من فوق الرأس، ثم ثلاثيات (ممرر، مدافع، مستلم) يختار الممرر الصدرية أو من فوق الرأس حسب وضع المدافع، مع التبديل.\n- الطالب: يتدرب ويختار.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (10 تمريرات): مجموعتان، تحاول كل مجموعة إكمال 10 تمريرات متتالية بالنوعين دون قطع.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير بين الزميلين.\nس2 (المستوى المتوقع): أين نمسك الكرة قبل التمرير من فوق الرأس؟\nالإجابة: فوق الرأس.\nس3 (المستوى المتقدم): إلى أي مستوى توجه الكرة؟\nالإجابة: إلى مستوى صدر الزميل.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه بثني الرسغين.\nس2 (المستوى المتوقع): المدافع يقف قريبًا ويرفع يديه، أي تمريرة تختار؟\nالإجابة: الصدرية بسرعة أو تغيير الاتجاه (أو من فوق الرأس إن كان قصيرًا).\nس3 (المستوى المتقدم): ما الفرق بين التمريرتين؟\nالإجابة: الصدرية من الصدر للتمرير السريع، ومن فوق الرأس للمسافات المتوسطة وتجاوز مدافع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105-109)."}}, {"focus": "التنطيط (المحاورة)", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف المحاورة وقواعدها القانونية (عدم المسك بعد التنطيط، عدم التنطيط باليدين معًا).\n2. يؤدي المحاورة في المكان ومن الحركة بتبديل اليدين والنظر للأمام.\n3. يوظف المحاورة لتجاوز المنافس بتغيير السرعة والاتجاه.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "- المحاورة\n- التنطيط\n- تبديل اليدين\n- تغيير السرعة\n- الخطأ القانوني", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمريرات ثم ينطط الكرة ويمسكها وينطط مرة أخرى ويسأل: هل هذا قانوني؟ ويقدم المحاورة وقواعدها (ص 106).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بالتنطيط في المكان.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: دفع الكرة بيد واحدة نحو الأرض بالأصابع، ثني الركبتين قليلًا، التحرك مع التنطيط والنظر للأمام، تجاوز المنافس بتبديل اليدين وتغيير السرعة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 2-4 ص 109: انتشار حر والتحرك بالتنطيط في اتجاهات مختلفة والوقوف بالإشارة، قطارات تنطيط متعرج بين الأقماع، قطارات متقابلة تنطيط لمنتصف المسافة ثم التوقف والتمرير للزميل.\n- الطالب: يتدرب ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (قطع الكرة) داخل مربع بالمحاورة والمحافظة على الكرة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء من اليد ننطط الكرة؟\nالإجابة: بالأصابع.\nس2 (المستوى المتوقع): ماذا يحدث لو مسكنا الكرة ثم نططنا مرة أخرى؟\nالإجابة: خطأ قانوني (التنطيط المزدوج).\nس3 (المستوى المتقدم): كيف نتجاوز المنافس بالمحاورة؟\nالإجابة: بتبديل اليدين وتغيير السرعة والاتجاه.", "التقويم الختامي": "س1 (مستوى الدعم): نطط الكرة بين الأقماع ذهابًا وإيابًا بتبديل اليدين.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (المستوى المتوقع): لماذا ننظر للأمام أثناء المحاورة؟\nالإجابة: لرؤية الزملاء والمنافسين.\nس3 (المستوى المتقدم): متى نستخدم المحاورة في المباراة؟\nالإجابة: للتحرك بالكرة وقطع مسافة نحو ملعب المنافس بطريقة قانونية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التنطيط باليدين بالتبادل أثناء المشي 5 دقائق يوميًا (دليل المعلم ص 106-109)."}}, {"focus": "التصويب من الثبات", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف التصويب من الثبات ومتى يستخدم (الرميات الحرة، المسافات القصيرة).\n2. يؤدي التصويب من الثبات نحو السلة أو هدف بديل.\n3. يميز النقاط الفنية الصحيحة في التصويب من صورة أو أداء زميل.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال أو أطواق كأهداف بديلة\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التصويب من الثبات\n- الرمية الحرة\n- النظر إلى الهدف\n- متابعة الحركة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المحاورة ثم يسأل: كيف نحرز النقاط؟ ويعرض صورة التصويب من الثبات (ص 106-107).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف مواجهًا للسلة وقدم متقدمة، رفع الكرة فوق الرأس واليد المصوبة خلفها والأخرى مساندة، ثني الركبتين ثم مدهما مع مد الذراع وثني الرسغ لدفع الكرة بقوس نحو السلة والنظر إلى الهدف، ثم تطبيق موجه من 2 م.\n- الطالب: يقلد ويصوب.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 5 ص 109: قطارات على بعد 3 م من السلة، التصويب من الثبات، ويعد القائد الإصابات، ثم في أزواج يراقب كل طالب النقاط الفنية لزميله ويصحح.\n- الطالب: يصوب ويصحح زميله.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (من يسجل أولًا): تصويب بالتتابع بين المجموعات.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم التصويب من الثبات؟\nالإجابة: في الرميات الحرة والمسافات القصيرة.\nس2 (المستوى المتوقع): أين تكون اليد المصوبة؟\nالإجابة: خلف الكرة والأخرى مساندة من الجانب.\nس3 (المستوى المتقدم): لماذا نثني الركبتين قبل التصويب؟\nالإجابة: لنعطي الكرة قوة من الرجلين.", "التقويم الختامي": "س1 (مستوى الدعم): صوب من الثبات 5 مرات من مسافة 3 م.\nالإجابة: يصوب بالطريقة الصحيحة.\nس2 (المستوى المتوقع): زميلك يصوب دون النظر إلى السلة، ماذا تقول له؟\nالإجابة: انظر إلى الهدف وتابع الحركة بالرسغ.\nس3 (المستوى المتقدم): اذكر مهارتين من مهارات كرة السلة تعلمتهما قبل التصويب.\nالإجابة: التمريرة الصدرية والمحاورة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: علّق طوقًا أو ضع سلة في المنزل وشجع طالبك على التصويب من الثبات (دليل المعلم ص 106-109)."}}, {"focus": "محطات مهارات كرة السلة للصغار ومنافساتها", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي التمرير والمحاورة والتصويب في محطات متكاملة.\n2. يوظف المهارات في منافسات بين المجموعات.\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلال أو أطواق\n- أخرى: شريط لاصق", "المفاهيم": "- المحطات\n- التمرير\n- المحاورة\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الأربع بنموذج طلبة ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات مهارات كرة السلة) ص 110: محطة 1 صفان متقابلان تمرير كرتين في مسار متعرج، محطة 2 تنطيط والدوران حول القمع ثم التصويب، محطة 3 مربع تمرير للزميل المجاور والانتقال لمكانه، محطة 4 قطاران تبادل التمرير ثم التصويب، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 (منافسات) ص 111: قطارات، تتابع تمرير الكرة من الأخير حتى الأول الذي ينطط ويصوب ثم يعود، لمدة 3-5 دقائق، والأكثر نقاطًا تفوز.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سقطت الكرة في بعض التمريرات؟ ليستنتج الطلبة أهمية الاستعداد والنظر إلى الممرر.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا نفعل في محطة المربع بعد التمرير؟\nالإجابة: ننتقل إلى مكان الزميل الذي مررنا له.\nس2 (المستوى المتوقع): ما ترتيب المهارات في منافسة القطار؟\nالإجابة: تمرير متتابع ثم تنطيط ثم تصويب.\nس3 (المستوى المتقدم): ماذا نفعل عند سقوط الكرة أثناء التمرير؟\nالإجابة: نعيدها للطالب في مؤخرة القطار ونستأنف.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التنطيط والدوران حول القمع ثم التصويب، والمربع.\nس2 (المستوى المتوقع): كيف تزيد مجموعتك سرعتها في منافسة التمرير؟\nالإجابة: بالاستعداد والنظر إلى الممرر والتمرير الدقيق.\nس3 (المستوى المتقدم): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف لديه (دليل المعلم ص 110-111)."}}, {"focus": "ألعاب ومباريات كرة السلة للصغار", "num": 6, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية لكرة السلة للصغار في مباراة مصغرة.\n2. يوظف المهارات الأساسية أثناء المباراة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلال\n- أخرى: صدريات ملونة", "المفاهيم": "- المباراة المصغرة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد (عدد اللاعبين، التنطيط المزدوج، المشي بالكرة، احتساب النقاط) ويقسم الفرق ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (أ) ص 112: مجموعة تنطط وتسقط الأقماع ومجموعة تنطط وترفعها في 3 دقائق.\n- الطالب: يلعب.\n\nالنشاط 3 (17 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 4 (ب) ومباريات ص 112-113: فرق من 4 لاعبين، مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل)، ويطبق المعلم القواعد ويقيّم الأداء.\n- الطالب: يلعب بدوره ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى تستخدم التمريرة الصدرية ومتى تستخدم المحاورة في المباراة؟ ليستنتج الطلبة توظيف المهارات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): كم لاعبًا في فريق اليوم؟\nالإجابة: 4 لاعبين.\nس2 (المستوى المتوقع): ما الخطأ عند المشي بالكرة دون تنطيط؟\nالإجابة: المشي بالكرة (خطوات) مخالفة.\nس3 (المستوى المتقدم): متى نستخدم المحاورة في المباراة؟\nالإجابة: للتحرك بالكرة عند عدم وجود زميل حر للتمرير.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويب من الثبات.\nس3 (المستوى المتقدم): كيف تصرفت عندما أخطأ الحكم الصغير في قرار؟\nالإجابة: احترمت قراره وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على البحث عن قصة نجاح لاعب كرة سلة وعرضها (التعلم الذاتي، دليل المعلم ص 113)، والاطلاع على قواعد الريشة الطائرة (ص 114-118)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف بعض القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، فترات المباراة، احتساب النقاط).\n2. يؤدي مسك الكرة والتمريرة الصدرية واستلامها.\n3. يميز متى تستخدم التمريرة الصدرية.\n\nالحصة 2:\n1. يتعرف التمرير من فوق الرأس ومتى يستخدم.\n2. يؤدي التمرير من فوق الرأس واستلامه.\n3. يختار نوع التمريرة (صدرية أو من فوق الرأس) حسب موقف المدافع.\n\nالحصة 3:\n1. يتعرف المحاورة وقواعدها القانونية (عدم المسك بعد التنطيط، عدم التنطيط باليدين معًا).\n2. يؤدي المحاورة في المكان ومن الحركة بتبديل اليدين والنظر للأمام.\n3. يوظف المحاورة لتجاوز المنافس بتغيير السرعة والاتجاه.\n\nالحصة 4:\n1. يتعرف التصويب من الثبات ومتى يستخدم (الرميات الحرة، المسافات القصيرة).\n2. يؤدي التصويب من الثبات نحو السلة أو هدف بديل.\n3. يميز النقاط الفنية الصحيحة في التصويب من صورة أو أداء زميل.\n\nالحصة 5:\n1. يؤدي التمرير والمحاورة والتصويب في محطات متكاملة.\n2. يوظف المهارات في منافسات بين المجموعات.\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات.\n\nالحصة 6:\n1. يطبق القواعد القانونية لكرة السلة للصغار في مباراة مصغرة.\n2. يوظف المهارات الأساسية أثناء المباراة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 6:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلال أو أطواق كأهداف بديلة\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n\nالحصة 3:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: أطواق\n\nالحصة 4:\n- أخرى: كرات سلة\n- أخرى: سلال أو أطواق كأهداف بديلة\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 5:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلال أو أطواق\n- أخرى: شريط لاصق\n\nالحصة 6:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلال\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة السلة للصغار\n- التمريرة الصدرية\n- مسك الكرة\n- الاستلام\n- القواعد القانونية\n\nالحصة 2:\n- التمرير من فوق الرأس\n- المدافع\n- المسافة المتوسطة\n- الاستلام\n\nالحصة 3:\n- المحاورة\n- التنطيط\n- تبديل اليدين\n- تغيير السرعة\n- الخطأ القانوني\n\nالحصة 4:\n- التصويب من الثبات\n- الرمية الحرة\n- النظر إلى الهدف\n- متابعة الحركة\n\nالحصة 5:\n- المحطات\n- التمرير\n- المحاورة\n- التصويب\n- المنافسة\n\nالحصة 6:\n- المباراة المصغرة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة مباراة كرة سلة للصغار ويسأل: كم لاعبًا؟ وكيف تحتسب النقاط؟ ويشرح القواعد المبسطة (ص 101-104).\n\nالحصة 2:\nيراجع المعلم التمريرة الصدرية ثم يقف مدافع قصير بين طالبين ويسأل: كيف نمرر فوقه؟ (ص 105).\n\nالحصة 3:\nيراجع المعلم التمريرات ثم ينطط الكرة ويمسكها وينطط مرة أخرى ويسأل: هل هذا قانوني؟ ويقدم المحاورة وقواعدها (ص 106).\n\nالحصة 4:\nيراجع المعلم المحاورة ثم يسأل: كيف نحرز النقاط؟ ويعرض صورة التصويب من الثبات (ص 106-107).\n\nالحصة 5:\nيراجع المعلم المهارات الأربع بنموذج طلبة ويعرض المحطات.\n\nالحصة 6:\nيراجع المعلم القواعد (عدد اللاعبين، التنطيط المزدوج، المشي بالكرة، احتساب النقاط) ويقسم الفرق ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة مع تمرينات الإحساس بالكرة (تمريرها حول الجسم).\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 105: مسك الكرة أمام الصدر والأصابع منتشرة، سحبها للصدر ثم مد الذراعين بالكامل مع لف اليدين للخارج ودفعها نحو الزميل مع تقديم رجل، والاستلام بمد الذراعين وسحب الكرة للصدر.\n- الطالب: يقلد ويتبادل مع زميل.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 1 ص 109: صفان متقابلان بينهما 2 م تبادل التمريرة الصدرية والاستلام مع العد، ثم زيادة المسافة إلى 4 م، ثم التمرير أثناء المشي.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك): مجموعتان، تحاول كل مجموعة إيصال الكرة لملكها بالتمريرات الصدرية دون تنطيط.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك الكرة فوق الرأس والذراعان منثنيتان قليلًا، مد الذراعين للأمام وثني الرسغين لدفع الكرة نحو الزميل في مستوى الصدر، مع تقديم رجل، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: صفان متقابلان تبادل التمرير من فوق الرأس، ثم ثلاثيات (ممرر، مدافع، مستلم) يختار الممرر الصدرية أو من فوق الرأس حسب وضع المدافع، مع التبديل.\n- الطالب: يتدرب ويختار.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (10 تمريرات): مجموعتان، تحاول كل مجموعة إكمال 10 تمريرات متتالية بالنوعين دون قطع.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بالتنطيط في المكان.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: دفع الكرة بيد واحدة نحو الأرض بالأصابع، ثني الركبتين قليلًا، التحرك مع التنطيط والنظر للأمام، تجاوز المنافس بتبديل اليدين وتغيير السرعة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 2-4 ص 109: انتشار حر والتحرك بالتنطيط في اتجاهات مختلفة والوقوف بالإشارة، قطارات تنطيط متعرج بين الأقماع، قطارات متقابلة تنطيط لمنتصف المسافة ثم التوقف والتمرير للزميل.\n- الطالب: يتدرب ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (قطع الكرة) داخل مربع بالمحاورة والمحافظة على الكرة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف مواجهًا للسلة وقدم متقدمة، رفع الكرة فوق الرأس واليد المصوبة خلفها والأخرى مساندة، ثني الركبتين ثم مدهما مع مد الذراع وثني الرسغ لدفع الكرة بقوس نحو السلة والنظر إلى الهدف، ثم تطبيق موجه من 2 م.\n- الطالب: يقلد ويصوب.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 5 ص 109: قطارات على بعد 3 م من السلة، التصويب من الثبات، ويعد القائد الإصابات، ثم في أزواج يراقب كل طالب النقاط الفنية لزميله ويصحح.\n- الطالب: يصوب ويصحح زميله.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (من يسجل أولًا): تصويب بالتتابع بين المجموعات.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات مهارات كرة السلة) ص 110: محطة 1 صفان متقابلان تمرير كرتين في مسار متعرج، محطة 2 تنطيط والدوران حول القمع ثم التصويب، محطة 3 مربع تمرير للزميل المجاور والانتقال لمكانه، محطة 4 قطاران تبادل التمرير ثم التصويب، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 (منافسات) ص 111: قطارات، تتابع تمرير الكرة من الأخير حتى الأول الذي ينطط ويصوب ثم يعود، لمدة 3-5 دقائق، والأكثر نقاطًا تفوز.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا سقطت الكرة في بعض التمريرات؟ ليستنتج الطلبة أهمية الاستعداد والنظر إلى الممرر.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 6:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (أ) ص 112: مجموعة تنطط وتسقط الأقماع ومجموعة تنطط وترفعها في 3 دقائق.\n- الطالب: يلعب.\n\nالنشاط 3 (17 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 4 (ب) ومباريات ص 112-113: فرق من 4 لاعبين، مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل)، ويطبق المعلم القواعد ويقيّم الأداء.\n- الطالب: يلعب بدوره ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى تستخدم التمريرة الصدرية ومتى تستخدم المحاورة في المباراة؟ ليستنتج الطلبة توظيف المهارات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): من أي مستوى تؤدى التمريرة الصدرية؟\nالإجابة: من مستوى الصدر.\nس2 (المستوى المتوقع): متى نستخدم التمريرة الصدرية؟\nالإجابة: للتمرير السريع عند عدم وجود مدافع في مسار التمرير.\nس3 (المستوى المتقدم): كيف تكون الأصابع عند مسك الكرة؟\nالإجابة: منتشرة على الكرة.\n\nالحصة 2:\nس1 (مستوى الدعم): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير بين الزميلين.\nس2 (المستوى المتوقع): أين نمسك الكرة قبل التمرير من فوق الرأس؟\nالإجابة: فوق الرأس.\nس3 (المستوى المتقدم): إلى أي مستوى توجه الكرة؟\nالإجابة: إلى مستوى صدر الزميل.\n\nالحصة 3:\nس1 (مستوى الدعم): بأي جزء من اليد ننطط الكرة؟\nالإجابة: بالأصابع.\nس2 (المستوى المتوقع): ماذا يحدث لو مسكنا الكرة ثم نططنا مرة أخرى؟\nالإجابة: خطأ قانوني (التنطيط المزدوج).\nس3 (المستوى المتقدم): كيف نتجاوز المنافس بالمحاورة؟\nالإجابة: بتبديل اليدين وتغيير السرعة والاتجاه.\n\nالحصة 4:\nس1 (مستوى الدعم): متى نستخدم التصويب من الثبات؟\nالإجابة: في الرميات الحرة والمسافات القصيرة.\nس2 (المستوى المتوقع): أين تكون اليد المصوبة؟\nالإجابة: خلف الكرة والأخرى مساندة من الجانب.\nس3 (المستوى المتقدم): لماذا نثني الركبتين قبل التصويب؟\nالإجابة: لنعطي الكرة قوة من الرجلين.\n\nالحصة 5:\nس1 (مستوى الدعم): ماذا نفعل في محطة المربع بعد التمرير؟\nالإجابة: ننتقل إلى مكان الزميل الذي مررنا له.\nس2 (المستوى المتوقع): ما ترتيب المهارات في منافسة القطار؟\nالإجابة: تمرير متتابع ثم تنطيط ثم تصويب.\nس3 (المستوى المتقدم): ماذا نفعل عند سقوط الكرة أثناء التمرير؟\nالإجابة: نعيدها للطالب في مؤخرة القطار ونستأنف.\n\nالحصة 6:\nس1 (مستوى الدعم): كم لاعبًا في فريق اليوم؟\nالإجابة: 4 لاعبين.\nس2 (المستوى المتوقع): ما الخطأ عند المشي بالكرة دون تنطيط؟\nالإجابة: المشي بالكرة (خطوات) مخالفة.\nس3 (المستوى المتقدم): متى نستخدم المحاورة في المباراة؟\nالإجابة: للتحرك بالكرة عند عدم وجود زميل حر للتمرير.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ التمريرة الصدرية لزميلك.\nالإجابة: يؤديها بمد الذراعين ولف اليدين للخارج.\nس2 (المستوى المتوقع): كم لاعبًا في كرة السلة للصغار وكم فترة للمباراة؟\nالإجابة: يذكر ما ورد في القواعد المبسطة (دليل المعلم ص 102-103).\nس3 (المستوى المتقدم): ما الفرق بين كرة السلة للصغار وكرة السلة الرسمية في احتساب النقاط؟\nالإجابة: يذكر الفرق كما في الدليل ص 103.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه بثني الرسغين.\nس2 (المستوى المتوقع): المدافع يقف قريبًا ويرفع يديه، أي تمريرة تختار؟\nالإجابة: الصدرية بسرعة أو تغيير الاتجاه (أو من فوق الرأس إن كان قصيرًا).\nس3 (المستوى المتقدم): ما الفرق بين التمريرتين؟\nالإجابة: الصدرية من الصدر للتمرير السريع، ومن فوق الرأس للمسافات المتوسطة وتجاوز مدافع.\n\nالحصة 3:\nس1 (مستوى الدعم): نطط الكرة بين الأقماع ذهابًا وإيابًا بتبديل اليدين.\nالإجابة: يؤديه دون فقد الكرة.\nس2 (المستوى المتوقع): لماذا ننظر للأمام أثناء المحاورة؟\nالإجابة: لرؤية الزملاء والمنافسين.\nس3 (المستوى المتقدم): متى نستخدم المحاورة في المباراة؟\nالإجابة: للتحرك بالكرة وقطع مسافة نحو ملعب المنافس بطريقة قانونية.\n\nالحصة 4:\nس1 (مستوى الدعم): صوب من الثبات 5 مرات من مسافة 3 م.\nالإجابة: يصوب بالطريقة الصحيحة.\nس2 (المستوى المتوقع): زميلك يصوب دون النظر إلى السلة، ماذا تقول له؟\nالإجابة: انظر إلى الهدف وتابع الحركة بالرسغ.\nس3 (المستوى المتقدم): اذكر مهارتين من مهارات كرة السلة تعلمتهما قبل التصويب.\nالإجابة: التمريرة الصدرية والمحاورة.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التنطيط والدوران حول القمع ثم التصويب، والمربع.\nس2 (المستوى المتوقع): كيف تزيد مجموعتك سرعتها في منافسة التمرير؟\nالإجابة: بالاستعداد والنظر إلى الممرر والتمرير الدقيق.\nس3 (المستوى المتقدم): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\n\nالحصة 6:\nس1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويب من الثبات.\nس3 (المستوى المتقدم): كيف تصرفت عندما أخطأ الحكم الصغير في قرار؟\nالإجابة: احترمت قراره وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طالبك التمريرة الصدرية 20 مرة يوميًا (دليل المعلم ص 101-105).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105-109).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التنطيط باليدين بالتبادل أثناء المشي 5 دقائق يوميًا (دليل المعلم ص 106-109).\n\nالحصة 4:\nإرشاد لولي الأمر: علّق طوقًا أو ضع سلة في المنزل وشجع طالبك على التصويب من الثبات (دليل المعلم ص 106-109).\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف لديه (دليل المعلم ص 110-111).\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على البحث عن قصة نجاح لاعب كرة سلة وعرضها (التعلم الذاتي، دليل المعلم ص 113)، والاطلاع على قواعد الريشة الطائرة (ص 114-118)."}}, {"title": "لعبة الريشة الطائرة", "unit": "الألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 114-125", "n": 4, "periods": [{"focus": "التعريف باللعبة وقواعدها ومهارتا مسك المضرب ووقفة الاستعداد", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف بعض القواعد القانونية للريشة الطائرة (الملعب، الشبكة، احتساب النقاط).\n2. يؤدي مسك المضرب (مسكة V) ووقفة الاستعداد.\n3. يميز بين وجه المضرب الأمامي والخلفي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: بالونات\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- الريشة الطائرة\n- مسكة المضرب (V)\n- وقفة الاستعداد\n- وجه المضرب الأمامي\n- وجه المضرب الخلفي", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم مضربًا وريشة ويسأل: من لعب الريشة الطائرة؟ ويشرح الملعب والقواعد المبسطة (ص 115-117).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، خطو جانبي، تحريك الرسغين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 118: مسكة V (الإبهام والسبابة يشكلان حرف V على المقبض) ووقفة الاستعداد (القدمان متباعدتان والركبتان منثنيتان والمضرب أمام الجسم)، ويميز وجهي المضرب، ثم تطبيق موجه بضرب البالون.\n- الطالب: يقلد ويمسك المضرب بالمسكة الصحيحة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات الإحساس: في أزواج، ضرب البالون ثم الريشة لأعلى بوجه المضرب الأمامي مع العد، ثم التبادل بين الزميلين دون شبكة.\n- الطالب: يتدرب مع زميله.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أطول سلسلة): من يضرب الريشة لأعلى أكبر عدد دون سقوطها.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نمسك المضرب بمسكة V؟\nالإجابة: يشكل الإبهام والسبابة حرف V على المقبض.\nس2 (المستوى المتوقع): ما وقفة الاستعداد؟\nالإجابة: القدمان متباعدتان والركبتان منثنيتان والمضرب أمام الجسم.\nس3 (المستوى المتقدم): ما الفرق بين وجه المضرب الأمامي والخلفي؟\nالإجابة: الأمامي من جهة راحة اليد، والخلفي من جهة ظهر اليد.", "التقويم الختامي": "س1 (مستوى الدعم): أمسك المضرب بمسكة V وخذ وقفة الاستعداد.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): اذكر قاعدة من قواعد الريشة الطائرة.\nالإجابة: مثل: تحتسب النقطة عند سقوط الريشة في ملعب المنافس.\nس3 (المستوى المتقدم): لماذا نثني الركبتين في وقفة الاستعداد؟\nالإجابة: للتحرك بسرعة في أي اتجاه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على ضرب بالون بمضرب لأعلى في المنزل (دليل المعلم ص 115-118)."}}, {"focus": "الإرسال بوجه المضرب الأمامي", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الإرسال وقواعده القانونية (أسفل الخصر، من منطقة الإرسال).\n2. يؤدي الإرسال بوجه المضرب الأمامي نحو مناطق محددة.\n3. يقدر أهمية دقة الإرسال في بدء اللعب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- أخرى: حبل أو شبكة", "المفاهيم": "- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال\n- الدقة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المسكة والوقفة ثم يسأل: كيف تبدأ النقطة في الريشة الطائرة؟ ويعرض الإرسال (ص 118-119).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف في منطقة الإرسال وقدم متقدمة، مسك الريشة باليد الأخرى أمام الجسم، إسقاطها ومرجحة المضرب من أسفل لضربها بوجه المضرب الأمامي أسفل الخصر لتعبر الشبكة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 1 ص 122: الإرسال نحو مناطق محددة (أطواق ومربعات) في الملعب المقابل، ويعد القائد الإصابات، ثم تدريب الإرسال فوق الحبل للزميل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 124 (أ): مجموعتان في قطارين، إرسال نحو الجهة المعاكسة، نقطة لكل ريشة تسقط داخل المنطقة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أين يؤدى الإرسال؟\nالإجابة: من منطقة الإرسال.\nس2 (المستوى المتوقع): في أي مستوى نضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.\nس3 (المستوى المتقدم): لماذا نوجه الإرسال نحو مناطق محددة؟\nالإجابة: لإحراز النقاط وإرباك المنافس.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الإرسال لتسقط الريشة داخل الطوق.\nالإجابة: يؤديه بوجه المضرب الأمامي.\nس2 (المستوى المتوقع): ماذا يحدث لو ضربنا الريشة فوق الخصر في الإرسال؟\nالإجابة: يحتسب خطأ.\nس3 (المستوى المتقدم): كيف تحسن دقة إرسالك؟\nالإجابة: بالنظر إلى الهدف والتدريب المتكرر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف (سلة) في المنزل (دليل المعلم ص 118-122)."}}, {"focus": "ضرب الريشة بوجه المضرب الأمامي وحركات القدمين", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي ضرب الريشة بوجه المضرب الأمامي من مستويات مختلفة.\n2. يؤدي حركات القدمين (الخطو والطعن) للوصول إلى الريشة.\n3. يربط بين حركات القدمين ودقة الضرب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: حبل أو شبكة\n- أخرى: أطواق", "المفاهيم": "- الضرب بوجه المضرب الأمامي\n- حركات القدمين\n- الطعن\n- المرجحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الإرسال ثم يرمي ريشة بعيدة عن طالب ويسأل: كيف يصل إليها؟ ويعرض الضرب وحركات القدمين (ص 119).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع الطعن للأمام.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: النظر إلى الريشة، رفع المضرب عاليًا والذراع الأخرى للأمام للاتزان، مرجحة المضرب للخلف ثم للأمام، مد اليد لضرب الريشة وتوجيهها بدقة؛ ثم حركات القدمين بالخطو والطعن للأمام لضرب الريشة المنخفضة.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 2-5 ص 122: أ) رمي الريشة للزميل وضربها نحوه، ب) إسقاط الريشة في منطقة والتحرك لضربها، ج) تبادل الضرب دون شبكة ثم بوجود قمعين، د) رمي الريشة نحو الركنين والضرب ثم العودة للمنتصف.\n- الطالب: يتدرب ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 124 (ب): ضرب الريشة لتسقط في دوائر مختلفة الأقطار خلف حبل على بعد 2 م ونقاط حسب الدائرة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا نفعل بالذراع الأخرى عند الضرب؟\nالإجابة: نرفعها للأمام ولأعلى لحفظ الاتزان.\nس2 (المستوى المتوقع): ما حركة القدمين للوصول إلى ريشة منخفضة أمامنا؟\nالإجابة: الخطو والطعن للأمام.\nس3 (المستوى المتقدم): لماذا نعود إلى منتصف الملعب بعد الضرب؟\nالإجابة: لنكون مستعدين للريشة التالية في أي اتجاه.", "التقويم الختامي": "س1 (مستوى الدعم): اضرب الريشة القادمة بوجه المضرب الأمامي نحو زميلك.\nالإجابة: يضربها بدقة.\nس2 (المستوى المتوقع): أدِّ الطعن للأمام لضرب ريشة منخفضة.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب فأضربها بتوازن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالمضرب في الحديقة (دليل المعلم ص 119-124)."}}, {"focus": "محطات ومباريات الريشة الطائرة", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي مهارات الريشة الطائرة في محطات متكاملة.\n2. يطبق القواعد القانونية في مباراة مصغرة.\n3. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "- المحطات\n- المباراة\n- احتساب النقاط\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات ويعرض المحطات وقواعد المباراة المصغرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات مهارات الريشة الطائرة) ص 123: محطة 1 قطاران متقابلان تبادل الضرب دون سقوط الريشة، محطة 2 الإرسال نحو المربعات، محطة 3 ضرب الريشة لأعلى باستمرار مع التقدم 5 م، محطة 4 رمي الريشة لمنطقة والتحرك لضربها، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (مباريات) ص 124: مباريات فردية وزوجية قصيرة حتى 7 نقاط مع حكام من الطلبة.\n- الطالب: يلعب بدوره.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى خسرت النقطة؟ ليستنتج الطلبة أهمية العودة للمنتصف ووقفة الاستعداد.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): متى تحتسب النقطة في المباراة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها منه بعد ضربه.\nس2 (المستوى المتوقع): في أي محطة تقدمنا 5 م؟\nالإجابة: محطة ضرب الريشة لأعلى باستمرار.\nس3 (المستوى المتقدم): ما دور الحكم في المباراة؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات، والتحرك لضرب الريشة.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على البحث عن قصة نجاح لاعب ريشة طائرة (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار العملي."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف بعض القواعد القانونية للريشة الطائرة (الملعب، الشبكة، احتساب النقاط).\n2. يؤدي مسك المضرب (مسكة V) ووقفة الاستعداد.\n3. يميز بين وجه المضرب الأمامي والخلفي.\n\nالحصة 2:\n1. يتعرف الإرسال وقواعده القانونية (أسفل الخصر، من منطقة الإرسال).\n2. يؤدي الإرسال بوجه المضرب الأمامي نحو مناطق محددة.\n3. يقدر أهمية دقة الإرسال في بدء اللعب.\n\nالحصة 3:\n1. يؤدي ضرب الريشة بوجه المضرب الأمامي من مستويات مختلفة.\n2. يؤدي حركات القدمين (الخطو والطعن) للوصول إلى الريشة.\n3. يربط بين حركات القدمين ودقة الضرب.\n\nالحصة 4:\n1. يؤدي مهارات الريشة الطائرة في محطات متكاملة.\n2. يطبق القواعد القانونية في مباراة مصغرة.\n3. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: بالونات\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أطواق\n- أخرى: شريط لاصق\n- أخرى: حبل أو شبكة\n\nالحصة 3:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: حبل أو شبكة\n- أخرى: أطواق\n\nالحصة 4:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الريشة الطائرة\n- مسكة المضرب (V)\n- وقفة الاستعداد\n- وجه المضرب الأمامي\n- وجه المضرب الخلفي\n\nالحصة 2:\n- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال\n- الدقة\n\nالحصة 3:\n- الضرب بوجه المضرب الأمامي\n- حركات القدمين\n- الطعن\n- المرجحة\n\nالحصة 4:\n- المحطات\n- المباراة\n- احتساب النقاط\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم مضربًا وريشة ويسأل: من لعب الريشة الطائرة؟ ويشرح الملعب والقواعد المبسطة (ص 115-117).\n\nالحصة 2:\nيراجع المعلم المسكة والوقفة ثم يسأل: كيف تبدأ النقطة في الريشة الطائرة؟ ويعرض الإرسال (ص 118-119).\n\nالحصة 3:\nيراجع المعلم الإرسال ثم يرمي ريشة بعيدة عن طالب ويسأل: كيف يصل إليها؟ ويعرض الضرب وحركات القدمين (ص 119).\n\nالحصة 4:\nيراجع المعلم المهارات ويعرض المحطات وقواعد المباراة المصغرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، خطو جانبي، تحريك الرسغين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 118: مسكة V (الإبهام والسبابة يشكلان حرف V على المقبض) ووقفة الاستعداد (القدمان متباعدتان والركبتان منثنيتان والمضرب أمام الجسم)، ويميز وجهي المضرب، ثم تطبيق موجه بضرب البالون.\n- الطالب: يقلد ويمسك المضرب بالمسكة الصحيحة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات الإحساس: في أزواج، ضرب البالون ثم الريشة لأعلى بوجه المضرب الأمامي مع العد، ثم التبادل بين الزميلين دون شبكة.\n- الطالب: يتدرب مع زميله.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أطول سلسلة): من يضرب الريشة لأعلى أكبر عدد دون سقوطها.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف في منطقة الإرسال وقدم متقدمة، مسك الريشة باليد الأخرى أمام الجسم، إسقاطها ومرجحة المضرب من أسفل لضربها بوجه المضرب الأمامي أسفل الخصر لتعبر الشبكة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 1 ص 122: الإرسال نحو مناطق محددة (أطواق ومربعات) في الملعب المقابل، ويعد القائد الإصابات، ثم تدريب الإرسال فوق الحبل للزميل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 124 (أ): مجموعتان في قطارين، إرسال نحو الجهة المعاكسة، نقطة لكل ريشة تسقط داخل المنطقة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع الطعن للأمام.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: النظر إلى الريشة، رفع المضرب عاليًا والذراع الأخرى للأمام للاتزان، مرجحة المضرب للخلف ثم للأمام، مد اليد لضرب الريشة وتوجيهها بدقة؛ ثم حركات القدمين بالخطو والطعن للأمام لضرب الريشة المنخفضة.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 2-5 ص 122: أ) رمي الريشة للزميل وضربها نحوه، ب) إسقاط الريشة في منطقة والتحرك لضربها، ج) تبادل الضرب دون شبكة ثم بوجود قمعين، د) رمي الريشة نحو الركنين والضرب ثم العودة للمنتصف.\n- الطالب: يتدرب ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 124 (ب): ضرب الريشة لتسقط في دوائر مختلفة الأقطار خلف حبل على بعد 2 م ونقاط حسب الدائرة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 (محطات مهارات الريشة الطائرة) ص 123: محطة 1 قطاران متقابلان تبادل الضرب دون سقوط الريشة، محطة 2 الإرسال نحو المربعات، محطة 3 ضرب الريشة لأعلى باستمرار مع التقدم 5 م، محطة 4 رمي الريشة لمنطقة والتحرك لضربها، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (مباريات) ص 124: مباريات فردية وزوجية قصيرة حتى 7 نقاط مع حكام من الطلبة.\n- الطالب: يلعب بدوره.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى خسرت النقطة؟ ليستنتج الطلبة أهمية العودة للمنتصف ووقفة الاستعداد.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كيف نمسك المضرب بمسكة V؟\nالإجابة: يشكل الإبهام والسبابة حرف V على المقبض.\nس2 (المستوى المتوقع): ما وقفة الاستعداد؟\nالإجابة: القدمان متباعدتان والركبتان منثنيتان والمضرب أمام الجسم.\nس3 (المستوى المتقدم): ما الفرق بين وجه المضرب الأمامي والخلفي؟\nالإجابة: الأمامي من جهة راحة اليد، والخلفي من جهة ظهر اليد.\n\nالحصة 2:\nس1 (مستوى الدعم): من أين يؤدى الإرسال؟\nالإجابة: من منطقة الإرسال.\nس2 (المستوى المتوقع): في أي مستوى نضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.\nس3 (المستوى المتقدم): لماذا نوجه الإرسال نحو مناطق محددة؟\nالإجابة: لإحراز النقاط وإرباك المنافس.\n\nالحصة 3:\nس1 (مستوى الدعم): ماذا نفعل بالذراع الأخرى عند الضرب؟\nالإجابة: نرفعها للأمام ولأعلى لحفظ الاتزان.\nس2 (المستوى المتوقع): ما حركة القدمين للوصول إلى ريشة منخفضة أمامنا؟\nالإجابة: الخطو والطعن للأمام.\nس3 (المستوى المتقدم): لماذا نعود إلى منتصف الملعب بعد الضرب؟\nالإجابة: لنكون مستعدين للريشة التالية في أي اتجاه.\n\nالحصة 4:\nس1 (مستوى الدعم): متى تحتسب النقطة في المباراة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها منه بعد ضربه.\nس2 (المستوى المتوقع): في أي محطة تقدمنا 5 م؟\nالإجابة: محطة ضرب الريشة لأعلى باستمرار.\nس3 (المستوى المتقدم): ما دور الحكم في المباراة؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أمسك المضرب بمسكة V وخذ وقفة الاستعداد.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): اذكر قاعدة من قواعد الريشة الطائرة.\nالإجابة: مثل: تحتسب النقطة عند سقوط الريشة في ملعب المنافس.\nس3 (المستوى المتقدم): لماذا نثني الركبتين في وقفة الاستعداد؟\nالإجابة: للتحرك بسرعة في أي اتجاه.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الإرسال لتسقط الريشة داخل الطوق.\nالإجابة: يؤديه بوجه المضرب الأمامي.\nس2 (المستوى المتوقع): ماذا يحدث لو ضربنا الريشة فوق الخصر في الإرسال؟\nالإجابة: يحتسب خطأ.\nس3 (المستوى المتقدم): كيف تحسن دقة إرسالك؟\nالإجابة: بالنظر إلى الهدف والتدريب المتكرر.\n\nالحصة 3:\nس1 (مستوى الدعم): اضرب الريشة القادمة بوجه المضرب الأمامي نحو زميلك.\nالإجابة: يضربها بدقة.\nس2 (المستوى المتوقع): أدِّ الطعن للأمام لضرب ريشة منخفضة.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب فأضربها بتوازن.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات، والتحرك لضرب الريشة.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على ضرب بالون بمضرب لأعلى في المنزل (دليل المعلم ص 115-118).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف (سلة) في المنزل (دليل المعلم ص 118-122).\n\nالحصة 3:\nإرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالمضرب في الحديقة (دليل المعلم ص 119-124).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على البحث عن قصة نجاح لاعب ريشة طائرة (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار العملي."}}, {"title": "الاختبار العملي (2)", "unit": "تقويم", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 89-125 (الألعاب الحركية 1)", "n": 2, "periods": [{"focus": "اختبار عملي في مهارات كرة القدم للصغار وكرة السلة للصغار", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي التمرير بباطن القدم والاستلام بأسفل القدم والجري بالكرة.\n2. يؤدي التمريرة الصدرية والتمرير من فوق الرأس والمحاورة.\n3. يؤدي التصويب من الثبات نحو السلة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلال\n- أخرى: استمارة تقويم الأداء", "المفاهيم أسئلة قواعد قصيرة (كرة القدم، السلة، الريشة) وموقف لعب قصير؛ ويرصد المعلم.\n- الطالب: يؤدي عند دوره ويتدرب مستقلًا.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة ختامية.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعزيز وإعلان الإجازة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): بأي جزء نمرر للمسافات القصيرة في كرة القدم؟\nالإجابة: باطن القدم.\nس2 (المستوى المتوقع): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو وجود مدافع قصير.\nس3 (المستوى المتقدم): أين تكون اليد المصوبة في التصويب من الثبات؟\nالإجابة: خلف الكرة.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف نمسك المضرب؟\nالإجابة: بمسكة V.\nس2 (المستوى المتوقع): أين نضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.\nس3 (المستوى المتقدم): متى تحتسب النقطة في الريشة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ المحاورة بين الأقماع بتبديل اليدين.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): صوب من الثبات 5 مرات.\nالإجابة: يصوب بالطريقة الصحيحة.\nس3 (المستوى المتقدم): ما المهارة التي أتقنتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الإرسال 5 مرات نحو الطوق.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما القاعدة المشتركة في احتساب الهدف في كرة القدم والنقطة في السلة؟\nالإجابة: تجاوز الكرة الخط أو دخولها السلة بالكامل.\nس3 (المستوى المتقدم): أي الألعاب الثلاث أحببتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طالبك مهارات الريشة الطائرة قبل الحصة الثانية من الاختبار (دليل المعلم ص 114-125).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على ممارسة اللعبة التي أحبها في العطلة، والاطلاع على الألعاب الحركية (2) في دليل المعلم ص 143 استعدادًا للفصل الثاني."}}];
const FIELDS = ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ في وحدة الألعاب الحركية (1) اختير: كرة القدم للصغار (4 حصص) + كرة السلة للصغار (6 حصص) + الريشة الطائرة (4 حصص) = 14 حصة.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
