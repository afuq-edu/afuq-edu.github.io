ة: تصمم كل مجموعة إحماءً خاصًا لرياضة يمارسها العمانيون كالتجديف أو ركوب الخيل أو المشي الجبلي، وتشرح لماذا اختارت تمريناتها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الإحماء الخاص؟\nالإجابة: تمرينات تشبه مهارات النشاط الذي سنمارسه.\nس2 (مستوى التطبيق): لماذا نرفع النبض تدريجيًا في الإحماء؟\nالإجابة: ليستعد القلب والرئتان للجهد.\nس3 (مستوى الاستدلال): اذكر تمرينًا للجذع.\nالإجابة: لف الجذع من الوقوف فتحًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الأوامر في البدء المنخفض؟\nالإجابة: خذ مكانك، استعد، انطلق.\nس2 (مستوى التطبيق): كم خطوة قبل الارتقاء في التصويبة السلمية؟\nالإجابة: خطوتان.\nس3 (مستوى الاستدلال): بأي جزء نستلم الكرة العالية من الصف السادس؟\nالإجابة: بأعلى الفخذ أو بوجه القدم الأمامي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر ثلاث قواعد للأمن والسلامة.\nالإجابة: الاستجابة للصافرة، الإحماء قبل اللعب، الحذاء الرياضي.\nس2 (مستوى التطبيق): صمم إحماءً خاصًا لكرة القدم بثلاث حركات.\nالإجابة: جري بالكرة، تمرير، مرجحة الرجلين.\nس3 (مستوى الاستدلال): كيف يحمي الإعداد البدني من الإصابة؟\nالإجابة: يرفع حرارة العضلات ومرونتها فتتحمل الجهد.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ البدء المنخفض وعدو 20 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): أدِّ التصويبة السلمية.\nالإجابة: يؤديها بخطوتين وارتقاء.\nس3 (مستوى الاستدلال): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك إرشادات المعلم في دليل المعلم ص 9-13.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها، والاطلاع على مفهوم اللياقة البدنية المرتبطة بالصحة (دليل المعلم ص 35-36).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=1"}}, {"title": "اللياقة البدنية المرتبطة بالصحة (المرونة، والتحمل الدوري التنفسي)", "unit": "اللياقة البدنية", "week": "الثاني – الثالث", "date": "13-17/9/2026 إلى 20-24/9/2026", "pages": "دليل المعلم ص 35-48", "n": 4, "periods": [{"focus": "مفهوم اللياقة البدنية المرتبطة بالصحة وعنصر المرونة (الثابتة والمتحركة) والعوامل المؤثرة فيها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم اللياقة البدنية المرتبطة بالصحة وعناصرها (10 دقائق)\n2. يميز بين المرونة الثابتة والمرونة المتحركة (15 دقيقة)\n3. يربط بين المرونة والعوامل المؤثرة فيها (العمر، نوع المفصل، النشاط الممارس) (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: عصي\n- أخرى: حبال\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- اللياقة البدنية المرتبطة بالصحة\n- المرونة الثابتة\n- المرونة المتحركة\n- المدى الحركي\n- المفصل", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورتين (لاعب جمباز في وضع إطالة ثابت، ولاعب يمرجح رجله عاليًا) ويسأل: ما الفرق بين الحركتين؟ ويقدم مفهوم اللياقة المرتبطة بالصحة (ص 35-37).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم والعناصر، ثم المرونة الثابتة (الثبات في وضع الإطالة) والمتحركة (المرجحات)، ويؤدي نماذج ص 39: (وقوف. الذراعان عاليًا) ثني الجذع أمامًا أسفل والثبات، تبادل الطعن جانبًا، (جلوس طويل فتحًا. مسك العصا) ثني الجذع للمس القدمين، مرجحة الرجلين أمامًا، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب الطلبة إطالة العضلة الخلفية للفخذ بالثبات 15 ثانية ثم بالمرجحة 10 مرات ويقارنون الشعور والمدى، ويستنتجون الفرق بين النوعين؛ ثم يناقش المعلم عوامل المرونة بأمثلة (مفصل الكتف مقابل المرفق)، ويجرب الطالب ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مجموعات بقائد تصنف بطاقات تمرينات إلى (ثابتة/متحركة) وتؤدي تمرينًا من كل نوع وتعرضه، ويصنف الطالب ويعرض (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بإطالة ثابتة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اللياقة البدنية المرتبطة بالصحة؟\nالإجابة: العناصر التي تحافظ على صحة الفرد مثل المرونة والتحمل الدوري التنفسي والقوة.\nس2 (مستوى التطبيق): ما الفرق بين المرونة الثابتة والمتحركة؟\nالإجابة: الثابتة ثبات في وضع الإطالة، والمتحركة إطالة بالحركة كالمرجحات.\nس3 (مستوى الاستدلال): أي المفصلين أكبر مدى: الكتف أم المرفق؟ ولماذا؟\nالإجابة: الكتف لأن بنيته التشريحية تسمح بمدى أوسع.", "التقويم الختامي": "س1 (مستوى المعرفة): صنف: (جلوس طويل) ثني الجذع والثبات 15 ثانية.\nالإجابة: مرونة ثابتة.\nس2 (مستوى التطبيق): اذكر عاملين يؤثران في المرونة.\nالإجابة: العمر ونوع المفصل (أو نوع النشاط).\nس3 (مستوى الاستدلال): لماذا يتميز لاعب الجمباز بمرونة عالية؟\nالإجابة: لأن نشاطه يتطلب إطالة مستمرة فتزداد مرونة مفاصله.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الإطالة الثابتة يوميًا (15 ثانية لكل وضع) (دليل المعلم ص 37-39).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=2"}}, {"focus": "قياس المرونة وتمرينات تنميتها بالأدوات ومنافساتها", "num": 2, "fields": {"المخرجات التعليمية": "1. يطبق اختبار قياس المرونة (ثني الجذع من الوقوف على المقعد) (15 دقيقة)\n2. يؤدي تمرينات بالأدوات لتنمية المرونة (العصا، الحزام، الحبل) (10 دقائق)\n3. يوظف المرونة في مواقف لعب (التصويب من أوضاع مختلفة) (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مساطر قياس\n- أخرى: عصي\n- أخرى: حبال\n- أخرى: كرات يد\n- أخرى: مرامي\n- أخرى: استمارة تسجيل", "المفاهيم": "- قياس المرونة\n- المؤشر\n- الإطالة بالأدوات\n- توظيف المرونة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم نوعي المرونة ويسأل: كيف نعرف من أكثر مرونة بيننا؟ ويعرض اختبار المرونة (ص 38).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع إطالات، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (قياس وتحدي المرونة) ص 45: مجموعات بقائد، يقف الطالب على المقعد ويثني جذعه دافعًا المؤشر بأطراف أصابعه، ويقيس القائد ويسجل، ثم التبادل، ثم نقاش العوامل، ويقيس الطالب ويسجل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يؤدي المعلم نماذج التمرينات بالأدوات ص 39: (جلوس طويل فتحًا. مسك العصا) ثني الجذع، (وقوف فتحًا. مسك طرفي الحزام) شد الحزام خلف الظهر، إطالة بالحبل، ثم تطبيق موجه، ويقلد الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. نشاط 5 و7 ص 46-47: منافسة تمرير الكرة من فوق الرأس وبين الرجلين في القطار، ثم التصويب على مرمى كرة اليد من أوضاع (جلوس، جثو، وقوف) ونقاش: كيف تساعد المرونة في قوة التصويب؟ ويتسابق الطالب ويناقش (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف يقاس عنصر المرونة في اختبار اليوم؟\nالإجابة: بثني الجذع من الوقوف على المقعد ودفع المؤشر لأبعد مسافة.\nس2 (مستوى التطبيق): اذكر أداة تستخدم في تمرينات المرونة.\nالإجابة: العصا أو الحزام.\nس3 (مستوى الاستدلال): كيف تساعد المرونة في التصويب؟\nالإجابة: تزيد مدى مرجحة الذراع فتزيد قوة التصويب.", "التقويم الختامي": "س1 (مستوى المعرفة): سجل نتيجتك في اختبار المرونة وقارنها بزميلك.\nالإجابة: يسجل ويقارن.\nس2 (مستوى التطبيق): أدِّ تمرين مرونة بالحزام.\nالإجابة: يشد الحزام خلف الظهر من الوقوف فتحًا.\nس3 (مستوى الاستدلال): اقترح طريقة لتحسين نتيجتك في الاختبار بعد شهر.\nالإجابة: الإطالة اليومية الثابتة والمتحركة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تعليم أفراد الأسرة مجموعة تمرينات المرونة وممارستها معهم يوميًا لمدة أسبوع (التعلم الذاتي، دليل المعلم ص 48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=2"}}, {"focus": "التحمل الدوري التنفسي: مفهومه وأنواعه وتمرينات تنميته", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم التحمل الدوري التنفسي وأهميته (10 دقائق)\n2. يميز بين التحمل الهوائي واللاهوائي (10 دقائق)\n3. يؤدي تمرينات لتنمية التحمل الدوري التنفسي (الجري المستمر، الوثب بالحبل) (20 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- التحمل الدوري التنفسي\n- التحمل الهوائي\n- التحمل اللاهوائي\n- الجهد المتوسط", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يستطيع الجري 10 دقائق دون توقف؟ وما الذي يمكّن لاعب كرة القدم من الاستمرار 90 دقيقة؟ ويقدم التحمل الدوري التنفسي (ص 41-42).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم (جهد متوسط الشدة لمدة طويلة) وأنواعه (هوائي، لاهوائي) وأهميته لكفاءة القلب والرئتين والوزن الصحي، ويؤدي نماذج ص 43: الجري في المكان مع رفع الركبتين 3 دقائق، الوثب بالحبل 1-3 دقائق، الوثب مع فتح وضم الرجلين ورفع الذراعين 2-3 دقائق، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التحمل بأربع مجموعات بزمن 3 دقائق لكل محطة: الجري الخفيف حول الملعب، الوثب بالحبل، الجري المكوكي البطيء، الوثب مع فتح وضم الرجلين، مع قياس النبض بعد كل محطة وتسجيله، ويؤدي الطالب ويقيس نبضه (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يقارن الطلبة النبض بعد المحطات ويستنتجون أن الجهد المستمر يرفع النبض، وأن المدرب المنتظم يعود نبضه للهدوء أسرع، ويستنتج الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي والتنفس، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما التحمل الدوري التنفسي؟\nالإجابة: قدرة الفرد على أداء جهد بدني متوسط الشدة لمدة طويلة.\nس2 (مستوى التطبيق): اذكر نشاطًا يحتاج إلى التحمل الهوائي.\nالإجابة: الجري أو السباحة أو ركوب الدراجة لمسافات طويلة.\nس3 (مستوى الاستدلال): لماذا يعود نبض الرياضي للهدوء أسرع؟\nالإجابة: لأن قلبه أكثر كفاءة بالتدريب.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر تمرينين لتنمية التحمل الدوري التنفسي.\nالإجابة: الجري المستمر والوثب بالحبل 3 دقائق.\nس2 (مستوى التطبيق): ما الفرق بين التحمل الهوائي واللاهوائي؟\nالإجابة: الهوائي جهد متوسط طويل بوجود الأكسجين، واللاهوائي جهد عالٍ قصير.\nس3 (مستوى الاستدلال): كيف يحسن التحمل صحتك؟\nالإجابة: يرفع كفاءة القلب والرئتين ويحافظ على الوزن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تسجيل الأنشطة التي يمارسها لمدة أسبوع (مشي سريع، دراجة، سباحة) ومدتها وشعوره بعدها (التعلم الذاتي، دليل المعلم ص 48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=2"}}, {"focus": "قياس التحمل الدوري التنفسي (اختبار التحمل الارتدادي) وتوظيف المرونة والتحمل في الألعاب", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق اختبار التحمل الارتدادي (20 م) بالإشارات الصوتية (20 دقيقة)\n2. يوظف عنصري المرونة والتحمل في ألعاب ومسابقات (10 دقائق)\n3. يقدر أهمية ممارسة تمرينات اللياقة للمحافظة على الصحة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: مصدر صوتي لملف الإشارات\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n- الوسائل المتعددة (سمعية - بصرية)", "المفاهيم": "- اختبار التحمل الارتدادي\n- اللفة\n- الإيقاع\n- الوزن الصحي", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم مفهوم التحمل ويعرض اختبار التحمل الارتدادي (ص 42) ويشرح الإشارات الصوتية.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار التحمل الارتدادي: خطان بينهما 20 م، يجري الطالب بين الخطين مع الإشارات الصوتية المتسارعة ويسجل القائد عدد اللفات المكتملة، في مجموعتين بالتبادل (مجموعة تجري ومجموعة تسجل)، ويؤدي الطالب الاختبار ويسجل لزميله (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة (كرة الملك المستمرة) 8 دقائق لتوظيف التحمل، مع تصويبات من أوضاع مختلفة توظف المرونة، ويلعب الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا خرج بعض الزملاء من الاختبار مبكرًا؟ ليستنتج الطلبة علاقة التدريب المنتظم بالتحمل، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي والتنفس، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تحدي ممشى الجبل: يناقش كل زوج أي عنصر يحتاجه متسلق ممرات الجبل الأخضر: التحمل أم المرونة، ويميزان المرونة الثابتة من المتحركة بمثال، ثم يشاركان الصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "التقويم التكويني": "س1 (مستوى المعرفة): ما المسافة بين الخطين في اختبار التحمل الارتدادي؟\nالإجابة: 20 م.\nس2 (مستوى التطبيق): ما الذي يحدد سرعة الجري في الاختبار؟\nالإجابة: الإشارات الصوتية.\nس3 (مستوى الاستدلال): ما العنصران اللذان وظفناهما في لعبة اليوم؟\nالإجابة: التحمل والمرونة.", "التقويم الختامي": "س1 (مستوى المعرفة): كم لفة أكملت في الاختبار؟ وكيف تحسنها؟\nالإجابة: يذكر العدد والتدريب المنتظم.\nس2 (مستوى التطبيق): متى يتوقف الطالب في اختبار التحمل الارتدادي؟\nالإجابة: عندما لا يصل إلى الخط قبل الإشارة مرتين.\nس3 (مستوى الاستدلال): اكتب نصيحة لزميل يريد تحسين تحمله.\nالإجابة: يمارس المشي السريع أو الجري 20 دقيقة ثلاث مرات أسبوعيًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على نشاط هوائي 20 دقيقة ثلاث مرات أسبوعيًا، والاطلاع على اللياقة المرتبطة بالمهارة (دليل المعلم ص 49-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم اللياقة البدنية المرتبطة بالصحة وعناصرها (10 دقائق)\n2. يميز بين المرونة الثابتة والمرونة المتحركة (15 دقيقة)\n3. يربط بين المرونة والعوامل المؤثرة فيها (العمر، نوع المفصل، النشاط الممارس) (15 دقيقة)\n\nالحصة 2:\n1. يطبق اختبار قياس المرونة (ثني الجذع من الوقوف على المقعد) (15 دقيقة)\n2. يؤدي تمرينات بالأدوات لتنمية المرونة (العصا، الحزام، الحبل) (10 دقائق)\n3. يوظف المرونة في مواقف لعب (التصويب من أوضاع مختلفة) (15 دقيقة)\n\nالحصة 3:\n1. يتعرف مفهوم التحمل الدوري التنفسي وأهميته (10 دقائق)\n2. يميز بين التحمل الهوائي واللاهوائي (10 دقائق)\n3. يؤدي تمرينات لتنمية التحمل الدوري التنفسي (الجري المستمر، الوثب بالحبل) (20 دقيقة)\n\nالحصة 4:\n1. يطبق اختبار التحمل الارتدادي (20 م) بالإشارات الصوتية (20 دقيقة)\n2. يوظف عنصري المرونة والتحمل في ألعاب ومسابقات (10 دقائق)\n3. يقدر أهمية ممارسة تمرينات اللياقة للمحافظة على الصحة (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: عصي\n- أخرى: حبال\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: مساطر قياس\n- أخرى: عصي\n- أخرى: حبال\n- أخرى: كرات يد\n- أخرى: مرامي\n- أخرى: استمارة تسجيل\n\nالحصة 3:\n- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 4:\n- أخرى: أقماع\n- أخرى: مصدر صوتي لملف الإشارات\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n- الوسائل المتعددة (سمعية - بصرية)", "المفاهيم": "الحصة 1:\n- اللياقة البدنية المرتبطة بالصحة\n- المرونة الثابتة\n- المرونة المتحركة\n- المدى الحركي\n- المفصل\n\nالحصة 2:\n- قياس المرونة\n- المؤشر\n- الإطالة بالأدوات\n- توظيف المرونة\n\nالحصة 3:\n- التحمل الدوري التنفسي\n- التحمل الهوائي\n- التحمل اللاهوائي\n- الجهد المتوسط\n\nالحصة 4:\n- اختبار التحمل الارتدادي\n- اللفة\n- الإيقاع\n- الوزن الصحي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورتين (لاعب جمباز في وضع إطالة ثابت، ولاعب يمرجح رجله عاليًا) ويسأل: ما الفرق بين الحركتين؟ ويقدم مفهوم اللياقة المرتبطة بالصحة (ص 35-37).\n\nالحصة 2:\nيراجع المعلم نوعي المرونة ويسأل: كيف نعرف من أكثر مرونة بيننا؟ ويعرض اختبار المرونة (ص 38).\n\nالحصة 3:\nيسأل المعلم: من يستطيع الجري 10 دقائق دون توقف؟ وما الذي يمكّن لاعب كرة القدم من الاستمرار 90 دقيقة؟ ويقدم التحمل الدوري التنفسي (ص 41-42).\n\nالحصة 4:\nيراجع المعلم مفهوم التحمل ويعرض اختبار التحمل الارتدادي (ص 42) ويشرح الإشارات الصوتية.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم والعناصر، ثم المرونة الثابتة (الثبات في وضع الإطالة) والمتحركة (المرجحات)، ويؤدي نماذج ص 39: (وقوف. الذراعان عاليًا) ثني الجذع أمامًا أسفل والثبات، تبادل الطعن جانبًا، (جلوس طويل فتحًا. مسك العصا) ثني الجذع للمس القدمين، مرجحة الرجلين أمامًا، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب الطلبة إطالة العضلة الخلفية للفخذ بالثبات 15 ثانية ثم بالمرجحة 10 مرات ويقارنون الشعور والمدى، ويستنتجون الفرق بين النوعين؛ ثم يناقش المعلم عوامل المرونة بأمثلة (مفصل الكتف مقابل المرفق)، ويجرب الطالب ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. مجموعات بقائد تصنف بطاقات تمرينات إلى (ثابتة/متحركة) وتؤدي تمرينًا من كل نوع وتعرضه، ويصنف الطالب ويعرض (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بإطالة ثابتة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم مع إطالات، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (قياس وتحدي المرونة) ص 45: مجموعات بقائد، يقف الطالب على المقعد ويثني جذعه دافعًا المؤشر بأطراف أصابعه، ويقيس القائد ويسجل، ثم التبادل، ثم نقاش العوامل، ويقيس الطالب ويسجل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يؤدي المعلم نماذج التمرينات بالأدوات ص 39: (جلوس طويل فتحًا. مسك العصا) ثني الجذع، (وقوف فتحًا. مسك طرفي الحزام) شد الحزام خلف الظهر، إطالة بالحبل، ثم تطبيق موجه، ويقلد الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. نشاط 5 و7 ص 46-47: منافسة تمرير الكرة من فوق الرأس وبين الرجلين في القطار، ثم التصويب على مرمى كرة اليد من أوضاع (جلوس، جثو، وقوف) ونقاش: كيف تساعد المرونة في قوة التصويب؟ ويتسابق الطالب ويناقش (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم (جهد متوسط الشدة لمدة طويلة) وأنواعه (هوائي، لاهوائي) وأهميته لكفاءة القلب والرئتين والوزن الصحي، ويؤدي نماذج ص 43: الجري في المكان مع رفع الركبتين 3 دقائق، الوثب بالحبل 1-3 دقائق، الوثب مع فتح وضم الرجلين ورفع الذراعين 2-3 دقائق، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التحمل بأربع مجموعات بزمن 3 دقائق لكل محطة: الجري الخفيف حول الملعب، الوثب بالحبل، الجري المكوكي البطيء، الوثب مع فتح وضم الرجلين، مع قياس النبض بعد كل محطة وتسجيله، ويؤدي الطالب ويقيس نبضه (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يقارن الطلبة النبض بعد المحطات ويستنتجون أن الجهد المستمر يرفع النبض، وأن المدرب المنتظم يعود نبضه للهدوء أسرع، ويستنتج الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي والتنفس، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار التحمل الارتدادي: خطان بينهما 20 م، يجري الطالب بين الخطين مع الإشارات الصوتية المتسارعة ويسجل القائد عدد اللفات المكتملة، في مجموعتين بالتبادل (مجموعة تجري ومجموعة تسجل)، ويؤدي الطالب الاختبار ويسجل لزميله (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة (كرة الملك المستمرة) 8 دقائق لتوظيف التحمل، مع تصويبات من أوضاع مختلفة توظف المرونة، ويلعب الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا خرج بعض الزملاء من الاختبار مبكرًا؟ ليستنتج الطلبة علاقة التدريب المنتظم بالتحمل، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي والتنفس، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تحدي ممشى الجبل: يناقش كل زوج أي عنصر يحتاجه متسلق ممرات الجبل الأخضر: التحمل أم المرونة، ويميزان المرونة الثابتة من المتحركة بمثال، ثم يشاركان الصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اللياقة البدنية المرتبطة بالصحة؟\nالإجابة: العناصر التي تحافظ على صحة الفرد مثل المرونة والتحمل الدوري التنفسي والقوة.\nس2 (مستوى التطبيق): ما الفرق بين المرونة الثابتة والمتحركة؟\nالإجابة: الثابتة ثبات في وضع الإطالة، والمتحركة إطالة بالحركة كالمرجحات.\nس3 (مستوى الاستدلال): أي المفصلين أكبر مدى: الكتف أم المرفق؟ ولماذا؟\nالإجابة: الكتف لأن بنيته التشريحية تسمح بمدى أوسع.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف يقاس عنصر المرونة في اختبار اليوم؟\nالإجابة: بثني الجذع من الوقوف على المقعد ودفع المؤشر لأبعد مسافة.\nس2 (مستوى التطبيق): اذكر أداة تستخدم في تمرينات المرونة.\nالإجابة: العصا أو الحزام.\nس3 (مستوى الاستدلال): كيف تساعد المرونة في التصويب؟\nالإجابة: تزيد مدى مرجحة الذراع فتزيد قوة التصويب.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما التحمل الدوري التنفسي؟\nالإجابة: قدرة الفرد على أداء جهد بدني متوسط الشدة لمدة طويلة.\nس2 (مستوى التطبيق): اذكر نشاطًا يحتاج إلى التحمل الهوائي.\nالإجابة: الجري أو السباحة أو ركوب الدراجة لمسافات طويلة.\nس3 (مستوى الاستدلال): لماذا يعود نبض الرياضي للهدوء أسرع؟\nالإجابة: لأن قلبه أكثر كفاءة بالتدريب.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما المسافة بين الخطين في اختبار التحمل الارتدادي؟\nالإجابة: 20 م.\nس2 (مستوى التطبيق): ما الذي يحدد سرعة الجري في الاختبار؟\nالإجابة: الإشارات الصوتية.\nس3 (مستوى الاستدلال): ما العنصران اللذان وظفناهما في لعبة اليوم؟\nالإجابة: التحمل والمرونة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): صنف: (جلوس طويل) ثني الجذع والثبات 15 ثانية.\nالإجابة: مرونة ثابتة.\nس2 (مستوى التطبيق): اذكر عاملين يؤثران في المرونة.\nالإجابة: العمر ونوع المفصل (أو نوع النشاط).\nس3 (مستوى الاستدلال): لماذا يتميز لاعب الجمباز بمرونة عالية؟\nالإجابة: لأن نشاطه يتطلب إطالة مستمرة فتزداد مرونة مفاصله.\n\nالحصة 2:\nس1 (مستوى المعرفة): سجل نتيجتك في اختبار المرونة وقارنها بزميلك.\nالإجابة: يسجل ويقارن.\nس2 (مستوى التطبيق): أدِّ تمرين مرونة بالحزام.\nالإجابة: يشد الحزام خلف الظهر من الوقوف فتحًا.\nس3 (مستوى الاستدلال): اقترح طريقة لتحسين نتيجتك في الاختبار بعد شهر.\nالإجابة: الإطالة اليومية الثابتة والمتحركة.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر تمرينين لتنمية التحمل الدوري التنفسي.\nالإجابة: الجري المستمر والوثب بالحبل 3 دقائق.\nس2 (مستوى التطبيق): ما الفرق بين التحمل الهوائي واللاهوائي؟\nالإجابة: الهوائي جهد متوسط طويل بوجود الأكسجين، واللاهوائي جهد عالٍ قصير.\nس3 (مستوى الاستدلال): كيف يحسن التحمل صحتك؟\nالإجابة: يرفع كفاءة القلب والرئتين ويحافظ على الوزن.\n\nالحصة 4:\nس1 (مستوى المعرفة): كم لفة أكملت في الاختبار؟ وكيف تحسنها؟\nالإجابة: يذكر العدد والتدريب المنتظم.\nس2 (مستوى التطبيق): متى يتوقف الطالب في اختبار التحمل الارتدادي؟\nالإجابة: عندما لا يصل إلى الخط قبل الإشارة مرتين.\nس3 (مستوى الاستدلال): اكتب نصيحة لزميل يريد تحسين تحمله.\nالإجابة: يمارس المشي السريع أو الجري 20 دقيقة ثلاث مرات أسبوعيًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات الإطالة الثابتة يوميًا (15 ثانية لكل وضع) (دليل المعلم ص 37-39).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تعليم أفراد الأسرة مجموعة تمرينات المرونة وممارستها معهم يوميًا لمدة أسبوع (التعلم الذاتي، دليل المعلم ص 48).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تسجيل الأنشطة التي يمارسها لمدة أسبوع (مشي سريع، دراجة، سباحة) ومدتها وشعوره بعدها (التعلم الذاتي، دليل المعلم ص 48).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على نشاط هوائي 20 دقيقة ثلاث مرات أسبوعيًا، والاطلاع على اللياقة المرتبطة بالمهارة (دليل المعلم ص 49-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=2"}}, {"title": "اللياقة البدنية المرتبطة بالمهارة (السرعة، والتوافق)", "unit": "اللياقة البدنية", "week": "الرابع – الخامس", "date": "27/9-1/10/2026 إلى 4-8/10/2026", "pages": "دليل المعلم ص 49-62", "n": 4, "periods": [{"focus": "مفهوم اللياقة البدنية المرتبطة بالمهارة وعنصر السرعة وعواملها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم اللياقة البدنية المرتبطة بالمهارة وعناصرها (15 دقيقة)\n2. يربط بين السرعة والعوامل المؤثرة فيها (10 دقائق)\n3. يؤدي تمرينات حرة وبالأدوات لتنمية السرعة (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: عصي\n- صورة توضيحية", "المفاهيم": "- اللياقة المرتبطة بالمهارة\n- السرعة\n- سرعة رد الفعل\n- تردد الخطوة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة عداء 100 م ويسأل: ما الذي يميز هذا الرياضي؟ ويقدم اللياقة المرتبطة بالمهارة والسرعة (ص 49-51).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع جري متدرج، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وعناصره (السرعة، التوافق، الرشاقة، التوازن) وعوامل السرعة (الوراثة، نوع الألياف، التدريب)، ويؤدي نماذج ص 52: الجري للخلف 5 خطوات ثم العدو 15 م، الجري بخطوات واسعة 10 م، الجري على الأمشاط مع رفع الركبتين، العدو لتعدية الحواجز، الجري الجانبي داخل السلم، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات السرعة بأربع مجموعات: الحواجز، سلم الرشاقة، العدو من الجري للخلف، رد الفعل (الانطلاق بالإشارة من أوضاع مختلفة)، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يجرب الطلبة الانطلاق بالإشارة الصوتية ثم البصرية ويكتشفون الفرق في زمن رد الفعل، ويجرب الطالب ويستنتج (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اللياقة البدنية المرتبطة بالمهارة؟\nالإجابة: عناصر تساعد على إتقان المهارات الرياضية مثل السرعة والتوافق.\nس2 (مستوى التطبيق): اذكر عاملًا يؤثر في السرعة.\nالإجابة: التدريب أو الوراثة.\nس3 (مستوى الاستدلال): ما سرعة رد الفعل؟\nالإجابة: سرعة الاستجابة للإشارة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تمرينًا لتنمية السرعة بالأدوات.\nالإجابة: العدو لتعدية الحواجز.\nس2 (مستوى التطبيق): ما الفرق بين اللياقة المرتبطة بالصحة والمرتبطة بالمهارة؟\nالإجابة: الأولى للصحة العامة، والثانية لرفع الأداء المهاري.\nس3 (مستوى الاستدلال): لماذا نجري على الأمشاط مع رفع الركبتين؟\nالإجابة: لزيادة تردد الخطوة وطولها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الجري في المكان بأقصى سرعة 10-15 ثانية وحساب خطواته (التعلم الذاتي، دليل المعلم ص 61).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=3"}}, {"focus": "قياس السرعة ومنافساتها وتوظيفها في الألعاب", "num": 2, "fields": {"المخرجات التعليمية": "1. يطبق اختبار قياس السرعة (عدو 30 م من بداية متحركة) (20 دقيقة)\n2. يوظف السرعة في منافسات وألعاب (10 دقائق)\n3. يقدر أهمية السرعة في رفع مستوى الأداء في الألعاب (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: كرات\n- أخرى: استمارات تسجيل", "المفاهيم": "- قياس السرعة\n- الزمن\n- البداية المتحركة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم عوامل السرعة ويعرض اختبار السرعة (ص 51): خطوط بينها 10 م ثم 30 م.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (قياس وتحدي السرعة) ص 58: مجموعات بقائد يحمل ساعة إيقاف، ينطلق الطالب بالعدو ويحتسب الزمن بين الخطين الثاني والثالث، ويسجل، ثم نقاش العوامل، ويعدو الطالب ويسجل لزميله (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 و7 ص 59-60: منافسة (التمرير ثم المطاردة حتى خط النهاية) ونقطة لكل لمس، ثم سباق مسارات 50 م بنقاط للمراكز، ويتسابق الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا كان الهارب يسبق المطارد غالبًا؟ ليستنتج الطلبة أثر البداية المتحركة ورد الفعل، ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين يبدأ احتساب الزمن في اختبار السرعة؟\nالإجابة: من الخط الثاني إلى الثالث (30 م).\nس2 (مستوى التطبيق): لماذا نبدأ الاختبار من مسافة 10 م قبل الخط الثاني؟\nالإجابة: لتكون البداية متحركة فنقيس السرعة القصوى.\nس3 (مستوى الاستدلال): كيف تحسب النقاط في سباق المسارات؟\nالإجابة: 5 للأول، 4 للثاني، 3 للثالث وهكذا.", "التقويم الختامي": "س1 (مستوى المعرفة): ما زمنك في اختبار 30 م؟ وما هدفك بعد شهر؟\nالإجابة: يذكر زمنه وهدفًا.\nس2 (مستوى التطبيق): اذكر لعبة تحتاج إلى السرعة.\nالإجابة: كرة القدم أو كرة السلة.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين سرعتك.\nالإجابة: العدو القصير المتكرر أو الجري على الأمشاط.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات العدو القصير في مكان آمن (دليل المعلم ص 51-60).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=3"}}, {"focus": "عنصر التوافق وتمرينات تنميته", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم التوافق والعوامل المؤثرة فيه (15 دقيقة)\n2. يؤدي تمرينات حرة وبالأدوات لتنمية التوافق (15 دقيقة)\n3. يربط بين التوافق والمهارات الرياضية التي تحتاجه (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات تنس\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: سلم الرشاقة\n- أخرى: حبال\n- صورة توضيحية", "المفاهيم": "- التوافق\n- الجهاز العصبي العضلي\n- الدمج الحركي\n- الإدراك الحسي الحركي", "التهيئة / التمهيد / التعلم القبلي": "يطلب المعلم من الطلبة الوثب بالقدمين للأمام مع تحريك الذراعين للخلف ويسأل: لماذا صعب؟ ويقدم التوافق (ص 53).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم (دمج أكثر من حركة) وعوامله (القدرات البدنية، الإدراك الحسي الحركي)، ويؤدي نماذج ص 55: الوثب للأمام والخلف مع حركة الذراعين عكس الرجلين، الوثب مع تقاطع القدمين، حركة دائرية للذراعين مع ثني الركبتين، الجري ثم الوثب بالحبل، رمي كرتين بالتبادل، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوافق: تنطيط كرتين، رمي كرة التنس ولقفها باليد الأخرى، سلم الرشاقة بنمط معقد، الوثب بالحبل مع التقاطع، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة في مجموعات مهارات (الضرب الساحق، التصويبة السلمية، المحاورة) ويحددون الحركات المدمجة فيها، ويحلل الطالب ويعرض (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما التوافق؟\nالإجابة: توظيف أجزاء الجسم المختلفة ودمج أكثر من حركة في وقت واحد.\nس2 (مستوى التطبيق): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: الضرب الساحق في الكرة الطائرة أو التصويبة السلمية.\nس3 (مستوى الاستدلال): بأي جهازين يرتبط التوافق؟\nالإجابة: الجهازين العصبي والعضلي.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الوثب للأمام مع تحريك الذراعين للخلف 5 مرات.\nالإجابة: يؤديه بتوافق.\nس2 (مستوى التطبيق): ما الحركات المدمجة في التصويبة السلمية؟\nالإجابة: خطوتان وارتقاء ورفع الركبة ومد الذراع للتصويب.\nس3 (مستوى الاستدلال): لماذا تحتاج ألعاب المضرب إلى التوافق؟\nالإجابة: لأن ضرب الكرة يجمع حركة القدمين والجذع والذراع في توقيت واحد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدوير الذراعين في اتجاهين مختلفين وحساب محاولاته الناجحة (التعلم الذاتي، دليل المعلم ص 61).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=3"}}, {"focus": "قياس التوافق (رمي الكرة على الحائط بالتناوب) ومنافسات التوافق", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق اختبار التوافق (رمي كرة التنس على الحائط باليدين بالتناوب) (15 دقيقة)\n2. يوظف التوافق في منافسات وألعاب (10 دقائق)\n3. يقدر أهمية اللياقة البدنية في رفع مستوى الأداء في الألعاب (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات تنس\n- أخرى: حائط\n- أخرى: ساعة إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: أقماع\n- أخرى: كرات", "المفاهيم": "- قياس التوافق\n- التناوب\n- الاستلام\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التوافق ويعرض الاختبار (ص 54): الوقوف على بعد 1.2 م من الحائط ورمي الكرة باليمنى واستلامها باليسرى بالتناوب.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار التوافق في مجموعات بقائد: 30 ثانية، عدد الرميات والاستلامات الصحيحة، ويسجل القائد، ثم نقاش، ويؤدي الطالب ويسجل لزميله (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسات التوافق ص 60-61: تتابع بالتنطيط بكرتين، ونقاط للمجموعات، ويتسابق الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: ماذا تعلمنا عن علاقة عناصر اللياقة ببعضها؟ ليستنتج الطلبة تكامل السرعة والتوافق والمرونة في الأداء، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – سرعة الصقر وتوافق الرزحة: تذكر المجموعات أنشطة تراثية عمانية تحتاج إلى السرعة أو التوافق كالصيد بالصقور وسباقات الهجن وفن الرزحة، وتصنفها حسب العنصر الأهم فيها (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "التقويم التكويني": "س1 (مستوى المعرفة): ما المسافة من الحائط في اختبار التوافق؟\nالإجابة: 1.2 م.\nس2 (مستوى التطبيق): كيف يؤدى الاختبار؟\nالإجابة: رمي الكرة باليمنى واستلامها باليسرى بالتناوب لمدة 30 ثانية.\nس3 (مستوى الاستدلال): ما العنصر الأهم في التنطيط بكرتين؟\nالإجابة: التوافق.", "التقويم الختامي": "س1 (مستوى المعرفة): كم رمية صحيحة حققت؟ وكيف تحسنها؟\nالإجابة: يذكر العدد والتدريب على اليد الأضعف.\nس2 (مستوى التطبيق): اذكر عنصرين من اللياقة المرتبطة بالمهارة وعنصرين من المرتبطة بالصحة.\nالإجابة: السرعة والتوافق؛ المرونة والتحمل.\nس3 (مستوى الاستدلال): كيف ترفع اللياقة البدنية مستوى أدائك في لعبتك المفضلة؟\nالإجابة: تجعلني أسرع وأكثر تحكمًا وأقل تعبًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرين رمي الكرة على الحائط بالتناوب يوميًا، والاطلاع على سباق التتابع 4×50 م (دليل المعلم ص 65-69).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم اللياقة البدنية المرتبطة بالمهارة وعناصرها (15 دقيقة)\n2. يربط بين السرعة والعوامل المؤثرة فيها (10 دقائق)\n3. يؤدي تمرينات حرة وبالأدوات لتنمية السرعة (15 دقيقة)\n\nالحصة 2:\n1. يطبق اختبار قياس السرعة (عدو 30 م من بداية متحركة) (20 دقيقة)\n2. يوظف السرعة في منافسات وألعاب (10 دقائق)\n3. يقدر أهمية السرعة في رفع مستوى الأداء في الألعاب (10 دقائق)\n\nالحصة 3:\n1. يتعرف مفهوم التوافق والعوامل المؤثرة فيه (15 دقيقة)\n2. يؤدي تمرينات حرة وبالأدوات لتنمية التوافق (15 دقيقة)\n3. يربط بين التوافق والمهارات الرياضية التي تحتاجه (10 دقائق)\n\nالحصة 4:\n1. يطبق اختبار التوافق (رمي كرة التنس على الحائط باليدين بالتناوب) (15 دقيقة)\n2. يوظف التوافق في منافسات وألعاب (10 دقائق)\n3. يقدر أهمية اللياقة البدنية في رفع مستوى الأداء في الألعاب (15 دقيقة)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: عصي\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: كرات\n- أخرى: استمارات تسجيل\n\nالحصة 3:\n- أخرى: كرات تنس\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: سلم الرشاقة\n- أخرى: حبال\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات تنس\n- أخرى: حائط\n- أخرى: ساعة إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: أقماع\n- أخرى: كرات", "المفاهيم": "الحصة 1:\n- اللياقة المرتبطة بالمهارة\n- السرعة\n- سرعة رد الفعل\n- تردد الخطوة\n\nالحصة 2:\n- قياس السرعة\n- الزمن\n- البداية المتحركة\n- المنافسة\n\nالحصة 3:\n- التوافق\n- الجهاز العصبي العضلي\n- الدمج الحركي\n- الإدراك الحسي الحركي\n\nالحصة 4:\n- قياس التوافق\n- التناوب\n- الاستلام\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة عداء 100 م ويسأل: ما الذي يميز هذا الرياضي؟ ويقدم اللياقة المرتبطة بالمهارة والسرعة (ص 49-51).\n\nالحصة 2:\nيراجع المعلم عوامل السرعة ويعرض اختبار السرعة (ص 51): خطوط بينها 10 م ثم 30 م.\n\nالحصة 3:\nيطلب المعلم من الطلبة الوثب بالقدمين للأمام مع تحريك الذراعين للخلف ويسأل: لماذا صعب؟ ويقدم التوافق (ص 53).\n\nالحصة 4:\nيراجع المعلم التوافق ويعرض الاختبار (ص 54): الوقوف على بعد 1.2 م من الحائط ورمي الكرة باليمنى واستلامها باليسرى بالتناوب.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم مع جري متدرج، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وعناصره (السرعة، التوافق، الرشاقة، التوازن) وعوامل السرعة (الوراثة، نوع الألياف، التدريب)، ويؤدي نماذج ص 52: الجري للخلف 5 خطوات ثم العدو 15 م، الجري بخطوات واسعة 10 م، الجري على الأمشاط مع رفع الركبتين، العدو لتعدية الحواجز، الجري الجانبي داخل السلم، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات السرعة بأربع مجموعات: الحواجز، سلم الرشاقة، العدو من الجري للخلف، رد الفعل (الانطلاق بالإشارة من أوضاع مختلفة)، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يجرب الطلبة الانطلاق بالإشارة الصوتية ثم البصرية ويكتشفون الفرق في زمن رد الفعل، ويجرب الطالب ويستنتج (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (قياس وتحدي السرعة) ص 58: مجموعات بقائد يحمل ساعة إيقاف، ينطلق الطالب بالعدو ويحتسب الزمن بين الخطين الثاني والثالث، ويسجل، ثم نقاش العوامل، ويعدو الطالب ويسجل لزميله (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 5 و7 ص 59-60: منافسة (التمرير ثم المطاردة حتى خط النهاية) ونقطة لكل لمس، ثم سباق مسارات 50 م بنقاط للمراكز، ويتسابق الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا كان الهارب يسبق المطارد غالبًا؟ ليستنتج الطلبة أثر البداية المتحركة ورد الفعل، ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم (دمج أكثر من حركة) وعوامله (القدرات البدنية، الإدراك الحسي الحركي)، ويؤدي نماذج ص 55: الوثب للأمام والخلف مع حركة الذراعين عكس الرجلين، الوثب مع تقاطع القدمين، حركة دائرية للذراعين مع ثني الركبتين، الجري ثم الوثب بالحبل، رمي كرتين بالتبادل، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوافق: تنطيط كرتين، رمي كرة التنس ولقفها باليد الأخرى، سلم الرشاقة بنمط معقد، الوثب بالحبل مع التقاطع، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة في مجموعات مهارات (الضرب الساحق، التصويبة السلمية، المحاورة) ويحددون الحركات المدمجة فيها، ويحلل الطالب ويعرض (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار التوافق في مجموعات بقائد: 30 ثانية، عدد الرميات والاستلامات الصحيحة، ويسجل القائد، ثم نقاش، ويؤدي الطالب ويسجل لزميله (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسات التوافق ص 60-61: تتابع بالتنطيط بكرتين، ونقاط للمجموعات، ويتسابق الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: ماذا تعلمنا عن علاقة عناصر اللياقة ببعضها؟ ليستنتج الطلبة تكامل السرعة والتوافق والمرونة في الأداء، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – سرعة الصقر وتوافق الرزحة: تذكر المجموعات أنشطة تراثية عمانية تحتاج إلى السرعة أو التوافق كالصيد بالصقور وسباقات الهجن وفن الرزحة، وتصنفها حسب العنصر الأهم فيها (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اللياقة البدنية المرتبطة بالمهارة؟\nالإجابة: عناصر تساعد على إتقان المهارات الرياضية مثل السرعة والتوافق.\nس2 (مستوى التطبيق): اذكر عاملًا يؤثر في السرعة.\nالإجابة: التدريب أو الوراثة.\nس3 (مستوى الاستدلال): ما سرعة رد الفعل؟\nالإجابة: سرعة الاستجابة للإشارة.\n\nالحصة 2:\nس1 (مستوى المعرفة): من أين يبدأ احتساب الزمن في اختبار السرعة؟\nالإجابة: من الخط الثاني إلى الثالث (30 م).\nس2 (مستوى التطبيق): لماذا نبدأ الاختبار من مسافة 10 م قبل الخط الثاني؟\nالإجابة: لتكون البداية متحركة فنقيس السرعة القصوى.\nس3 (مستوى الاستدلال): كيف تحسب النقاط في سباق المسارات؟\nالإجابة: 5 للأول، 4 للثاني، 3 للثالث وهكذا.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما التوافق؟\nالإجابة: توظيف أجزاء الجسم المختلفة ودمج أكثر من حركة في وقت واحد.\nس2 (مستوى التطبيق): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: الضرب الساحق في الكرة الطائرة أو التصويبة السلمية.\nس3 (مستوى الاستدلال): بأي جهازين يرتبط التوافق؟\nالإجابة: الجهازين العصبي والعضلي.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما المسافة من الحائط في اختبار التوافق؟\nالإجابة: 1.2 م.\nس2 (مستوى التطبيق): كيف يؤدى الاختبار؟\nالإجابة: رمي الكرة باليمنى واستلامها باليسرى بالتناوب لمدة 30 ثانية.\nس3 (مستوى الاستدلال): ما العنصر الأهم في التنطيط بكرتين؟\nالإجابة: التوافق.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ تمرينًا لتنمية السرعة بالأدوات.\nالإجابة: العدو لتعدية الحواجز.\nس2 (مستوى التطبيق): ما الفرق بين اللياقة المرتبطة بالصحة والمرتبطة بالمهارة؟\nالإجابة: الأولى للصحة العامة، والثانية لرفع الأداء المهاري.\nس3 (مستوى الاستدلال): لماذا نجري على الأمشاط مع رفع الركبتين؟\nالإجابة: لزيادة تردد الخطوة وطولها.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما زمنك في اختبار 30 م؟ وما هدفك بعد شهر؟\nالإجابة: يذكر زمنه وهدفًا.\nس2 (مستوى التطبيق): اذكر لعبة تحتاج إلى السرعة.\nالإجابة: كرة القدم أو كرة السلة.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين سرعتك.\nالإجابة: العدو القصير المتكرر أو الجري على الأمشاط.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ الوثب للأمام مع تحريك الذراعين للخلف 5 مرات.\nالإجابة: يؤديه بتوافق.\nس2 (مستوى التطبيق): ما الحركات المدمجة في التصويبة السلمية؟\nالإجابة: خطوتان وارتقاء ورفع الركبة ومد الذراع للتصويب.\nس3 (مستوى الاستدلال): لماذا تحتاج ألعاب المضرب إلى التوافق؟\nالإجابة: لأن ضرب الكرة يجمع حركة القدمين والجذع والذراع في توقيت واحد.\n\nالحصة 4:\nس1 (مستوى المعرفة): كم رمية صحيحة حققت؟ وكيف تحسنها؟\nالإجابة: يذكر العدد والتدريب على اليد الأضعف.\nس2 (مستوى التطبيق): اذكر عنصرين من اللياقة المرتبطة بالمهارة وعنصرين من المرتبطة بالصحة.\nالإجابة: السرعة والتوافق؛ المرونة والتحمل.\nس3 (مستوى الاستدلال): كيف ترفع اللياقة البدنية مستوى أدائك في لعبتك المفضلة؟\nالإجابة: تجعلني أسرع وأكثر تحكمًا وأقل تعبًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الجري في المكان بأقصى سرعة 10-15 ثانية وحساب خطواته (التعلم الذاتي، دليل المعلم ص 61).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تمرينات العدو القصير في مكان آمن (دليل المعلم ص 51-60).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تدوير الذراعين في اتجاهين مختلفين وحساب محاولاته الناجحة (التعلم الذاتي، دليل المعلم ص 61).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تمرين رمي الكرة على الحائط بالتناوب يوميًا، والاطلاع على سباق التتابع 4×50 م (دليل المعلم ص 65-69).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=3"}}, {"title": "ألعاب القوى (سباق التتابع 4×50 م، والوثب العالي بالطريقة الظهرية)", "unit": "الرياضات والألعاب الحركية (1)", "week": "السادس – السابع", "date": "11-15/10/2026 إلى 18-22/10/2026", "pages": "دليل المعلم ص 65-82", "n": 4, "periods": [{"focus": "سباق التتابع 4×50 م: القواعد ومسك العصا والبدء المنخفض", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء سباق التتابع 4×50 م وقواعده القانونية (10 دقائق)\n2. يؤدي مسك العصا بأوضاعها والبدء المنخفض بالعصا (20 دقيقة)\n3. يحدد النواحي الفنية لسباق التتابع (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: عصي التتابع\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- التتابع\n- العدو\n- الحارة\n- مسك العصا\n- البدء المنخفض", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم فيديو أو صورة سباق تتابع ويسأل: ما الذي يميز هذا السباق عن سباق 100 م؟ ويقدم قواعد السباق (ص 67-69).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، رفع الركبتين، لمس الرجلين خلفًا، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (4 متسابقين، البدء المنخفض، الحارة، منطقة التسليم 10 م، استعادة العصا الساقطة) ويؤدي نموذج مسك العصا (بين الإبهام والسبابة، أو بالخنصر والبنصر والوسطى والإبهام) والبدء المنخفض بالعصا دون لمسها الأرض، ويقلد الطالب المسك والبدء (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 73: تحريك الذراعين مع الثبات ومد اليد بالإشارة، لمس الحائط، الوقوف خلف الزميل ومد اليد للخلف، في أزواج، ويتدرب الطالب مع زميله (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 1 (أ) ص 74: تتابع نقل الكرات من الصندوق الأول إلى الثاني في المسار، ويلعب الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم متسابقًا في فريق التتابع؟\nالإجابة: أربعة.\nس2 (مستوى التطبيق): ما طول منطقة التسليم والتسلم؟\nالإجابة: 10 م.\nس3 (مستوى الاستدلال): ماذا يحدث لو سقطت العصا؟\nالإجابة: يستعيدها المتسابق نفسه ويكمل.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ البدء المنخفض وأنت تمسك العصا.\nالإجابة: يؤديه دون لمس العصا للأرض.\nس2 (مستوى التطبيق): اذكر قاعدتين من قواعد السباق.\nالإجابة: الجري في الحارة المخصصة والتسليم داخل المنطقة.\nس3 (مستوى الاستدلال): ما الفرق بين سباق التتابع وسباق 100 م؟\nالإجابة: التتابع جماعي بتسليم العصا بين أربعة متسابقين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد سباق التتابع (دليل المعلم ص 67-69).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=4"}}, {"focus": "التسليم والتسلم داخل المنطقة (طريقة التسليم من الخارج)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف طرق تسليم العصا وأنسبها للمبتدئين (10 دقائق)\n2. يؤدي التسليم والتسلم من الخارج داخل منطقة 10 م أثناء الجري (20 دقيقة)\n3. يطبق التوقيت الصحيح للانطلاق عند اقتراب المسلم (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: عصي التتابع\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "- التسليم\n- التسلم\n- المسلم\n- المستلم\n- منطقة التسليم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المسك والبدء ويسأل: متى ينطلق المستلم؟ ويعرض التسليم من الخارج (ص 68).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع طالب النموذج: يقف المستلم قبل المنطقة بـ5 م، وعند اقتراب المسلم ينطلق من البدء العالي ويمد يده للخلف بإشارة الزميل، ويمد المسلم العصا من الخارج داخل المنطقة، ثم تطبيق موجه من المشي ثم الجري البطيء، ويقلد الطالب مع زميله (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 73-74: أزواج يتبادلان التسليم من المشي ثم الجري، ثم مجموعات أربعة في مسار مع تعليم منطقة التسليم، ويراقب القائد التسليم داخل المنطقة، ويتدرب الطالب ويراقب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 1 (ب) ص 74: تتابع بالعصا في مسار قصير بين المجموعات، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما أنسب طريقة للتسليم للمبتدئين؟\nالإجابة: التسليم من الخارج.\nس2 (مستوى التطبيق): أين يقف المستلم قبل الانطلاق؟\nالإجابة: قبل منطقة التسليم بـ5 م.\nس3 (مستوى الاستدلال): ماذا يفعل المستلم عند اقتراب زميله؟\nالإجابة: ينطلق ويمد يده للخلف عند إشارة زميله.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التسليم والتسلم مع زميلك من الجري داخل المنطقة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ماذا يحدث لو تم التسليم خارج المنطقة؟\nالإجابة: يُستبعد الفريق.\nس3 (مستوى الاستدلال): لماذا ينطلق المستلم قبل وصول زميله؟\nالإجابة: حتى يتسلم العصا أثناء الجري دون فقد السرعة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على مد اليد للخلف واستلام شيء من زميل أثناء الجري (دليل المعلم ص 68-74).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=4"}}, {"focus": "أداء سباق التتابع 4×50 م كاملًا ومنافساته", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي سباق التتابع 4×50 م بتطبيق القواعد القانونية (15 دقيقة)\n2. يحلل الحالات التحكيمية (الخروج من الحارة، التسليم خارج المنطقة، سقوط العصا) (15 دقيقة)\n3. يشعر بالثقة أثناء مشاركته في سباق التتابع (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: عصي التتابع\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف", "المفاهيم": "- السباق\n- الحالات التحكيمية\n- الحارة\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم مراحل السباق ويوزع الفرق ويعين حكامًا للمناطق.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ترتيب الفريق: تحدد كل مجموعة ترتيب متسابقيها (الأسرع في البداية والنهاية) وتتدرب على التسليم مرتين، ويخطط الطالب ويتدرب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسات السباق ص 75-76: جولات بين الفرق مع حكام للمناطق وتسجيل الزمن، ويتسابق الطالب ويحكم (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط تقويمي ص 82: يعرض المعلم حالات (خروج عن الحارة، تمرير خارج المنطقة، سقوط العصا) ويناقش الطلبة القرار الصحيح، ويحلل الطالب ويقرر (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي الطالب التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما القرار عند تمرير العصا خارج المنطقة؟\nالإجابة: استبعاد الفريق.\nس2 (مستوى التطبيق): من يستعيد العصا الساقطة؟\nالإجابة: المتسابق نفسه الذي أسقطها.\nس3 (مستوى الاستدلال): لماذا نضع الأسرع في المرحلة الأخيرة؟\nالإجابة: لإنهاء السباق بأفضل سرعة.", "التقويم الختامي": "س1 (مستوى المعرفة): اشرح النواحي الفنية لسباق التتابع 4×50 م.\nالإجابة: بدء منخفض، عدو في الحارة، تسليم من الخارج داخل منطقة 10 م، استمرار الجري.\nس2 (مستوى التطبيق): ما قرار الحكم عند خروج المتسابق عن حارته؟\nالإجابة: استبعاد الفريق.\nس3 (مستوى الاستدلال): كيف شعرت بمشاركتك في السباق ولماذا؟\nالإجابة: يعبر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة سباق تتابع وتحديد منطقة التسليم فيه، والاطلاع على الوثب العالي الظهري (دليل المعلم ص 69-71).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=4"}}, {"focus": "الوثب العالي بالطريقة الظهرية: المراحل الفنية والتمرينات التمهيدية", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف المراحل الفنية للوثب العالي بالطريقة الظهرية (الاقتراب، الارتقاء، الطيران، الهبوط) (10 دقائق)\n2. يؤدي التمرينات التمهيدية للوثب العالي (الحجل، الجري في مسار 8، التقوس خلفًا) (20 دقيقة)\n3. يميز خصائص الاقتراب المنحني (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: حبل مطاطي\n- أخرى: جهاز الوثب العالي\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- الوثب العالي\n- الطريقة الظهرية\n- الاقتراب المنحني\n- الارتقاء\n- التقوس", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب يعبر العارضة بظهره ويسأل: لماذا يدور ليقابل العارضة بظهره؟ ويقدم المراحل الفنية (ص 70-71).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل: اقتراب 9-13 خطوة في مسار منحنٍ بسرعة متزايدة، ارتقاء بالقدم البعيدة مع أرجحة الركبة الحرة، طيران بالتقوس ورفع الذراع، هبوط على الظهر والكتفين، ويؤدي نماذج التمرينات التمهيدية ص 77: الحجل 5 م، الجري مع رفع الركبتين في مسار 8، تبادل الوثب الجانبي بقدم واحدة، التقوس خلفًا مع سند اليدين على الحائط، ويستمع الطالب ويقلد (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التمرينات التمهيدية بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 1 ص 79: لعبة المطاردة بالوثب فوق الحواجز المتنوعة على محيط المستطيل، ويلعب الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تسليم الأمانة: تتحاور المجموعات كيف يشبه تسليم العصا في سباق التتابع انتقال التراث العماني من جيل إلى جيل، وما الخطأ الذي يُسقط العصا أو يضيع التراث (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما المراحل الفنية للوثب العالي الظهري؟\nالإجابة: الاقتراب، الارتقاء، الطيران، الهبوط.\nس2 (مستوى التطبيق): بأي قدم نرتقي؟\nالإجابة: بالقدم البعيدة عن العارضة.\nس3 (مستوى الاستدلال): ما شكل مسار الاقتراب؟\nالإجابة: منحنٍ.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التقوس خلفًا مع سند اليدين على الحائط.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): لماذا يكون الاقتراب منحنيًا؟\nالإجابة: ليساعد الجسم على الدوران ومقابلة العارضة بالظهر.\nس3 (مستوى الاستدلال): اذكر تمرينين تمهيديين للوثب العالي.\nالإجابة: الحجل 5 م والجري في مسار 8.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات التقوس والحجل في المنزل بأمان (دليل المعلم ص 70-79).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء سباق التتابع 4×50 م وقواعده القانونية (10 دقائق)\n2. يؤدي مسك العصا بأوضاعها والبدء المنخفض بالعصا (20 دقيقة)\n3. يحدد النواحي الفنية لسباق التتابع (10 دقائق)\n\nالحصة 2:\n1. يتعرف طرق تسليم العصا وأنسبها للمبتدئين (10 دقائق)\n2. يؤدي التسليم والتسلم من الخارج داخل منطقة 10 م أثناء الجري (20 دقيقة)\n3. يطبق التوقيت الصحيح للانطلاق عند اقتراب المسلم (10 دقائق)\n\nالحصة 3:\n1. يؤدي سباق التتابع 4×50 م بتطبيق القواعد القانونية (15 دقيقة)\n2. يحلل الحالات التحكيمية (الخروج من الحارة، التسليم خارج المنطقة، سقوط العصا) (15 دقيقة)\n3. يشعر بالثقة أثناء مشاركته في سباق التتابع (10 دقائق)\n\nالحصة 4:\n1. يتعرف المراحل الفنية للوثب العالي بالطريقة الظهرية (الاقتراب، الارتقاء، الطيران، الهبوط) (10 دقائق)\n2. يؤدي التمرينات التمهيدية للوثب العالي (الحجل، الجري في مسار 8، التقوس خلفًا) (20 دقيقة)\n3. يميز خصائص الاقتراب المنحني (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: عصي التتابع\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: عصي التتابع\n- أخرى: أقماع\n- أخرى: شريط لاصق\n\nالحصة 3:\n- أخرى: عصي التتابع\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n\nالحصة 4:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: حبل مطاطي\n- أخرى: جهاز الوثب العالي\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "الحصة 1:\n- التتابع\n- العدو\n- الحارة\n- مسك العصا\n- البدء المنخفض\n\nالحصة 2:\n- التسليم\n- التسلم\n- المسلم\n- المستلم\n- منطقة التسليم\n\nالحصة 3:\n- السباق\n- الحالات التحكيمية\n- الحارة\n- الروح الرياضية\n\nالحصة 4:\n- الوثب العالي\n- الطريقة الظهرية\n- الاقتراب المنحني\n- الارتقاء\n- التقوس", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم فيديو أو صورة سباق تتابع ويسأل: ما الذي يميز هذا السباق عن سباق 100 م؟ ويقدم قواعد السباق (ص 67-69).\n\nالحصة 2:\nيراجع المعلم المسك والبدء ويسأل: متى ينطلق المستلم؟ ويعرض التسليم من الخارج (ص 68).\n\nالحصة 3:\nيراجع المعلم مراحل السباق ويوزع الفرق ويعين حكامًا للمناطق.\n\nالحصة 4:\nيعرض المعلم صورة لاعب يعبر العارضة بظهره ويسأل: لماذا يدور ليقابل العارضة بظهره؟ ويقدم المراحل الفنية (ص 70-71).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، رفع الركبتين، لمس الرجلين خلفًا، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (4 متسابقين، البدء المنخفض، الحارة، منطقة التسليم 10 م، استعادة العصا الساقطة) ويؤدي نموذج مسك العصا (بين الإبهام والسبابة، أو بالخنصر والبنصر والوسطى والإبهام) والبدء المنخفض بالعصا دون لمسها الأرض، ويقلد الطالب المسك والبدء (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 73: تحريك الذراعين مع الثبات ومد اليد بالإشارة، لمس الحائط، الوقوف خلف الزميل ومد اليد للخلف، في أزواج، ويتدرب الطالب مع زميله (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 1 (أ) ص 74: تتابع نقل الكرات من الصندوق الأول إلى الثاني في المسار، ويلعب الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم مع طالب النموذج: يقف المستلم قبل المنطقة بـ5 م، وعند اقتراب المسلم ينطلق من البدء العالي ويمد يده للخلف بإشارة الزميل، ويمد المسلم العصا من الخارج داخل المنطقة، ثم تطبيق موجه من المشي ثم الجري البطيء، ويقلد الطالب مع زميله (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 73-74: أزواج يتبادلان التسليم من المشي ثم الجري، ثم مجموعات أربعة في مسار مع تعليم منطقة التسليم، ويراقب القائد التسليم داخل المنطقة، ويتدرب الطالب ويراقب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 1 (ب) ص 74: تتابع بالعصا في مسار قصير بين المجموعات، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ترتيب الفريق: تحدد كل مجموعة ترتيب متسابقيها (الأسرع في البداية والنهاية) وتتدرب على التسليم مرتين، ويخطط الطالب ويتدرب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسات السباق ص 75-76: جولات بين الفرق مع حكام للمناطق وتسجيل الزمن، ويتسابق الطالب ويحكم (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط تقويمي ص 82: يعرض المعلم حالات (خروج عن الحارة، تمرير خارج المنطقة، سقوط العصا) ويناقش الطلبة القرار الصحيح، ويحلل الطالب ويقرر (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي الطالب التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل: اقتراب 9-13 خطوة في مسار منحنٍ بسرعة متزايدة، ارتقاء بالقدم البعيدة مع أرجحة الركبة الحرة، طيران بالتقوس ورفع الذراع، هبوط على الظهر والكتفين، ويؤدي نماذج التمرينات التمهيدية ص 77: الحجل 5 م، الجري مع رفع الركبتين في مسار 8، تبادل الوثب الجانبي بقدم واحدة، التقوس خلفًا مع سند اليدين على الحائط، ويستمع الطالب ويقلد (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التمرينات التمهيدية بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 1 ص 79: لعبة المطاردة بالوثب فوق الحواجز المتنوعة على محيط المستطيل، ويلعب الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تسليم الأمانة: تتحاور المجموعات كيف يشبه تسليم العصا في سباق التتابع انتقال التراث العماني من جيل إلى جيل، وما الخطأ الذي يُسقط العصا أو يضيع التراث (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كم متسابقًا في فريق التتابع؟\nالإجابة: أربعة.\nس2 (مستوى التطبيق): ما طول منطقة التسليم والتسلم؟\nالإجابة: 10 م.\nس3 (مستوى الاستدلال): ماذا يحدث لو سقطت العصا؟\nالإجابة: يستعيدها المتسابق نفسه ويكمل.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما أنسب طريقة للتسليم للمبتدئين؟\nالإجابة: التسليم من الخارج.\nس2 (مستوى التطبيق): أين يقف المستلم قبل الانطلاق؟\nالإجابة: قبل منطقة التسليم بـ5 م.\nس3 (مستوى الاستدلال): ماذا يفعل المستلم عند اقتراب زميله؟\nالإجابة: ينطلق ويمد يده للخلف عند إشارة زميله.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما القرار عند تمرير العصا خارج المنطقة؟\nالإجابة: استبعاد الفريق.\nس2 (مستوى التطبيق): من يستعيد العصا الساقطة؟\nالإجابة: المتسابق نفسه الذي أسقطها.\nس3 (مستوى الاستدلال): لماذا نضع الأسرع في المرحلة الأخيرة؟\nالإجابة: لإنهاء السباق بأفضل سرعة.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما المراحل الفنية للوثب العالي الظهري؟\nالإجابة: الاقتراب، الارتقاء، الطيران، الهبوط.\nس2 (مستوى التطبيق): بأي قدم نرتقي؟\nالإجابة: بالقدم البعيدة عن العارضة.\nس3 (مستوى الاستدلال): ما شكل مسار الاقتراب؟\nالإجابة: منحنٍ.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ البدء المنخفض وأنت تمسك العصا.\nالإجابة: يؤديه دون لمس العصا للأرض.\nس2 (مستوى التطبيق): اذكر قاعدتين من قواعد السباق.\nالإجابة: الجري في الحارة المخصصة والتسليم داخل المنطقة.\nس3 (مستوى الاستدلال): ما الفرق بين سباق التتابع وسباق 100 م؟\nالإجابة: التتابع جماعي بتسليم العصا بين أربعة متسابقين.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ التسليم والتسلم مع زميلك من الجري داخل المنطقة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ماذا يحدث لو تم التسليم خارج المنطقة؟\nالإجابة: يُستبعد الفريق.\nس3 (مستوى الاستدلال): لماذا ينطلق المستلم قبل وصول زميله؟\nالإجابة: حتى يتسلم العصا أثناء الجري دون فقد السرعة.\n\nالحصة 3:\nس1 (مستوى المعرفة): اشرح النواحي الفنية لسباق التتابع 4×50 م.\nالإجابة: بدء منخفض، عدو في الحارة، تسليم من الخارج داخل منطقة 10 م، استمرار الجري.\nس2 (مستوى التطبيق): ما قرار الحكم عند خروج المتسابق عن حارته؟\nالإجابة: استبعاد الفريق.\nس3 (مستوى الاستدلال): كيف شعرت بمشاركتك في السباق ولماذا؟\nالإجابة: يعبر ويعلل.\n\nالحصة 4:\nس1 (مستوى المعرفة): أدِّ التقوس خلفًا مع سند اليدين على الحائط.\nالإجاب
