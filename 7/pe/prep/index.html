 الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): كم محاولة لكل ارتفاع؟\nالإجابة: ثلاث محاولات.\nس2 (المستوى المتوقع): هل يجوز الارتقاء بالقدمين؟\nالإجابة: لا، بقدم واحدة.\nس3 (المستوى المتقدم): متى تحتسب المحاولة فاشلة؟\nالإجابة: عند إسقاط العارضة.", "التقويم الختامي": "س1 (مستوى الدعم): حدد المراحل الفنية لمسابقة الوثب العالي بالطريقة الظهرية.\nالإجابة: الاقتراب المنحني، الارتقاء بالقدم البعيدة، الطيران بالتقوس، الهبوط على الظهر.\nس2 (المستوى المتوقع): أدِّ وثبة ظهرية كاملة على ارتفاع مناسب.\nالإجابة: يؤديها.\nس3 (المستوى المتقدم): كيف شعرت عندما تجاوزت العارضة؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة وثب عالٍ وتحديد مراحلها، والاطلاع على قواعد كرة القدم (دليل المعلم ص 83-87)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يؤدي الاقتراب المنحني بالأقماع والارتقاء مع الدوران ربع لفة ثم نصف لفة.\n2. يؤدي الارتقاء بالطريقة الظهرية من الوقوف ثم من الصندوق والهبوط على المرتبة.\n3. يميز الأخطاء الشائعة في الارتقاء والهبوط.\n\nالحصة 2:\n1. يؤدي الوثب العالي بالطريقة الظهرية من الاقتراب الكامل على ارتفاع مناسب.\n2. يطبق القواعد القانونية (الارتقاء بقدم واحدة، ثلاث محاولات، الارتفاع)\n3. يشعر بالثقة أثناء مشاركته في مسابقة الوثب العالي.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب الوثب العالي\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- أخرى: حبل مطاطي\n- أخرى: جهاز الوثب العالي\n\nالحصة 2:\n- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: عارضة أو حبل مطاطي\n- أخرى: أقماع\n- أخرى: استمارة تسجيل", "المفاهيم": "الحصة 1:\n- الاقتراب المنحني\n- الارتقاء\n- الدوران\n- الهبوط على الظهر\n- الأمان\n\nالحصة 2:\n- المسابقة\n- المحاولة\n- الارتفاع\n- القواعد القانونية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم المراحل الفنية ويسأل: كيف نتدرج في تعلم الوثبة بأمان؟ ويعرض التدريبات التعليمية (ص 78-79).\n\nالحصة 2:\nيراجع المعلم التدريبات ويعرض قواعد المسابقة (ص 71-72) وينظم الطلبة في مجموعات حسب المستوى.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع التمرينات التمهيدية.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات 1-7: الاقتراب المستقيم والوثب المقصي، الجري في مسار منحنٍ بالأقماع، الاقتراب الدائري والوثب بقدم واحدة مع الدوران ربع ثم نصف لفة، الاقتراب المنحني والدوران ولمس الكرة المعلقة، الارتقاء الظهري من الوقوف ثم من الصندوق (مع الحبل المطاطي) والهبوط على المرتبة.\n- الطالب: يقلد كل تدريب بالتدرج.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد تؤدي التدريبات في محطتين (الاقتراب والدوران، الارتقاء من الصندوق) ويراقب القائد الهبوط على الظهر والكتفين.\n- الطالب: يؤدي ويراقب.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحلل الطلبة أخطاء شائعة يعرضها المعلم (الارتقاء بالقدم القريبة، النظر للأسفل) ويقترحون التصحيح.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 7 ص 79: اقتراب منحنٍ 5 خطوات ووثب ظهري على حبل مطاطي منخفض في مجموعات مع مراقبة القائد.\n- الطالب: يتدرب.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ص 80: ثلاث محاولات لكل طالب على ارتفاعات متدرجة، وحكم صغير يرفع العلم، وتسجيل أعلى ارتفاع.\n- الطالب: يتسابق.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط تقويمي ص 82: يناقش المعلم الحالات (الارتقاء بالقدمين، إسقاط العارضة) والقرار.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا نبدأ بالوثب المقصي قبل الظهري؟\nالإجابة: للتدرج والأمان وتعلم الارتقاء بقدم واحدة.\nس2 (المستوى المتوقع): ماذا نستخدم بدل العارضة في البداية؟\nالإجابة: الحبل المطاطي.\nس3 (المستوى المتقدم): كيف نهبط بأمان؟\nالإجابة: على الظهر والكتفين على المرتبة والذقن للصدر.\n\nالحصة 2:\nس1 (مستوى الدعم): كم محاولة لكل ارتفاع؟\nالإجابة: ثلاث محاولات.\nس2 (المستوى المتوقع): هل يجوز الارتقاء بالقدمين؟\nالإجابة: لا، بقدم واحدة.\nس3 (المستوى المتقدم): متى تحتسب المحاولة فاشلة؟\nالإجابة: عند إسقاط العارضة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الاقتراب المنحني من 3-5 خطوات والارتقاء الظهري من الصندوق.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): زميلك يرتقي بالقدم القريبة من العارضة، ما الخطأ وكيف يصحح؟\nالإجابة: يجب الارتقاء بالقدم البعيدة ليدور الجسم.\nس3 (المستوى المتقدم): لماذا نضع مراتب الوثب العالي خلف العارضة؟\nالإجابة: لامتصاص الهبوط على الظهر بأمان.\n\nالحصة 2:\nس1 (مستوى الدعم): حدد المراحل الفنية لمسابقة الوثب العالي بالطريقة الظهرية.\nالإجابة: الاقتراب المنحني، الارتقاء بالقدم البعيدة، الطيران بالتقوس، الهبوط على الظهر.\nس2 (المستوى المتوقع): أدِّ وثبة ظهرية كاملة على ارتفاع مناسب.\nالإجابة: يؤديها.\nس3 (المستوى المتقدم): كيف شعرت عندما تجاوزت العارضة؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في الوثب العالي (دليل المعلم ص 78-81).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة وثب عالٍ وتحديد مراحلها، والاطلاع على قواعد كرة القدم (دليل المعلم ص 83-87)."}}, {"title": "لعبة كرة القدم", "unit": "الرياضات والألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 83-95", "n": 6, "periods": [{"focus": "القواعد القانونية ومراكز اللاعبين وتمرينات الإحساس بالكرة", "num": 1, "fields": {"المخرجات التعليمية": "1. يحدد بعض القواعد القانونية للعبة كرة القدم.\n2. يميز بين مراكز اللعب (حارس، دفاع، وسط، هجوم) وواجباتها.\n3. يؤدي تمرينات الإحساس بالكرة (سحب الكرة، نقلها بين القدمين، تنطيطها بالقدم والفخذ).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة القدم\n- مراكز اللاعبين\n- طريقة اللعب 4-4-2\n- الإحساس بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ملعب بتوزيع 4-4-2 ويسأل: ما دور كل مركز؟ ويشرح القواعد الأساسية (ص 84-85).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد (الملعب، 11 لاعبًا، التسلل مبسطًا، الركلات) ومراكز اللاعبين (ص 88)، ثم يؤدي نماذج الإحساس بالكرة ص 89: سحب الكرة بأسفل القدم للخلف، نقلها بين القدمين بباطن القدم، ركلها بوجه القدم الأمامي ورفعها، تنطيطها بالقدم والفخذ، المشي بالكرة بين رأسي الزميلين.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الإحساس بالكرة بأربع مجموعات مع التبديل، وفي كل محطة بطاقة مركز يشرح القائد واجبه.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أين مركزي؟): ينادي المعلم مركزًا فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كم لاعبًا في فريق كرة القدم؟\nالإجابة: 11 لاعبًا.\nس2 (المستوى المتوقع): ما واجب لاعبي خط الدفاع؟\nالإجابة: منع المنافس من التسجيل بقطع التمريرات واستخلاص الكرة ثم بناء الهجوم.\nس3 (المستوى المتقدم): اذكر تمرينًا للإحساس بالكرة.\nالإجابة: نقل الكرة بين القدمين بباطن القدم.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر مراكز اللعب في طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (المستوى المتوقع): أدِّ تنطيط الكرة بالقدم 5 مرات.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): لماذا تهم تمرينات الإحساس بالكرة قبل المهارات؟\nالإجابة: لأنها تنمي التحكم في الكرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تنطيط الكرة بالقدم والفخذ يوميًا (دليل المعلم ص 84-89)."}}, {"focus": "ركل الكرة بوجه القدم الأمامي (التصويب)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية لركل الكرة بوجه القدم الأمامي.\n2. يؤدي ركل الكرة الثابتة والمتحركة بوجه القدم الأمامي نحو المرمى.\n3. يميز بين الركل بوجه القدم الأمامي وبباطن القدم من حيث الاستخدام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- صورة توضيحية", "المفاهيم": "- وجه القدم الأمامي\n- التصويب\n- القدم المرتكزة\n- متابعة الحركة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الإحساس بالكرة ويسأل: بأي جزء نصوب بقوة من مسافة بعيدة؟ ويعرض الركل بوجه القدم الأمامي (ص 86).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب مائل، القدم المرتكزة بجانب الكرة، مرجحة الرجل الراكلة من الورك، ضرب الكرة بوجه القدم الأمامي ومشط القدم مشدود لأسفل، متابعة الحركة، ثم تطبيق موجه من الثبات.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 1-2 ص 90: صفان متقابلان (ثنائيات) مسك الكرة ولمسها بوجه القدم الأمامي ثم الركل، ثم قطاران الجري بالكرة ثم ركلها بوجه القدم الأمامي للتصويب نحو المرمى.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويب: نقاط للأهداف من مسافة 12 م.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة.\nس2 (المستوى المتوقع): كيف يكون مشط القدم عند الركل بوجه القدم الأمامي؟\nالإجابة: مشدودًا لأسفل.\nس3 (المستوى المتقدم): متى نستخدم الركل بوجه القدم الأمامي؟\nالإجابة: للتصويب القوي والتمرير الطويل.", "التقويم الختامي": "س1 (مستوى الدعم): صوب بوجه القدم الأمامي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين الركل بوجه القدم الأمامي وبباطن القدم؟\nالإجابة: الأمامي للقوة والمسافة، والباطن للدقة القصيرة.\nس3 (المستوى المتقدم): لماذا نتابع الحركة بعد الركل؟\nالإجابة: لزيادة القوة والدقة والاتزان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التصويب على هدف بوجه القدم الأمامي في مكان آمن (دليل المعلم ص 86-90)."}}, {"focus": "السيطرة على الكرة العالية بالصدر", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للسيطرة على الكرة العالية بالصدر.\n2. يؤدي استلام الكرة العالية بالصدر وإسقاطها أمامه.\n3. يختار جزء الجسم المناسب للسيطرة على الكرة حسب ارتفاعها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- السيطرة على الكرة\n- الصدر\n- امتصاص الكرة\n- الكرة العالية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الاستلام بالفخذ وبوجه القدم من الصف السادس ويسأل: كيف نسيطر على كرة فوق مستوى الصدر؟ (ص 86).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف مواجه للكرة مع تباعد القدمين، ثني الركبتين قليلًا، ميل الجسم للخلف وتقديم الصدر، ثم سحب الصدر لحظة ملامسة الكرة لامتصاصها وإسقاطها أمام القدمين، ثم تطبيق موجه برمي الكرة باليدين.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 3 ص 90: ثنائيات، يرمي أحدهما الكرة عالية ويستلمها الآخر بالصدر ثم يمررها بباطن القدم، ثم ثلاثيات في مثلث.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (3 لمسات): مجموعات تمرر الكرة عالية ويجب السيطرة بالصدر قبل التمرير.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا نفعل بالصدر لحظة ملامسة الكرة؟\nالإجابة: نسحبه للخلف لامتصاص قوتها.\nس2 (المستوى المتوقع): أين تسقط الكرة بعد السيطرة بالصدر؟\nالإجابة: أمام القدمين.\nس3 (المستوى المتقدم): متى نستخدم الصدر في السيطرة؟\nالإجابة: للكرات العالية فوق مستوى الصدر.", "التقويم الختامي": "س1 (مستوى الدعم): استلم الكرة العالية بالصدر ومررها لزميلك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة قادمة في مستوى الفخذ، بأي جزء تسيطر عليها؟\nالإجابة: بأعلى الفخذ.\nس3 (المستوى المتقدم): ما سبب ارتداد الكرة بعيدًا عند السيطرة بالصدر؟\nالإجابة: عدم سحب الصدر للخلف لحظة الملامسة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالصدر (دليل المعلم ص 86-90)."}}, {"focus": "المحاورة من الأمام (بالتمويه للجانب)", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف أنواع المحاورة ونقاط المحاورة من الأمام.\n2. يؤدي المحاورة من الأمام بالتمويه للجانب لتجاوز مدافع.\n3. يختار توقيت المحاورة حسب استجابة المدافع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة", "المفاهيم": "- المحاورة\n- التمويه\n- المدافع\n- المهاجم\n- تغيير الاتجاه", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم السيطرة ويسأل: كيف نتخلص من مدافع يواجهنا؟ ويعرض المحاورة من الأمام (ص 87).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة مع تغيير الاتجاه.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الاقتراب من المدافع بالكرة، حركة خداعية للجانب بميل الجسم، وعند استجابة المدافع المرور بالكرة في الاتجاه الآخر بوجه القدم الخارجي وزيادة السرعة، ثم تطبيق موجه مع قمع ثم مدافع سلبي.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 4 ص 90: قطاران متقابلان بينهما 10 م، الجري بالكرة ومحاورة الزميل (مدافع سلبي ثم نشط) والتمرير للقطار المقابل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (1 ضد 1) في مربع صغير مع هدفين من الأقماع.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما هدف المحاورة؟\nالإجابة: التخلص من المنافس للوصول إلى مكان مناسب للتمرير أو التصويب.\nس2 (المستوى المتوقع): ماذا نفعل عند استجابة المدافع للخداع؟\nالإجابة: نمر بالكرة في الاتجاه الآخر بسرعة.\nس3 (المستوى المتقدم): اذكر أنواع المحاورة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.", "التقويم الختامي": "س1 (مستوى الدعم): راوغ المدافع بالتمويه للجانب واعبر بالكرة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): متى يفشل التمويه؟\nالإجابة: إذا لم يستجب المدافع أو كان بطيئًا في تغيير الاتجاه.\nس3 (المستوى المتقدم): لماذا نزيد السرعة بعد المرور من المدافع؟\nالإجابة: حتى لا يلحق بنا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يتدرب على التمويه (دليل المعلم ص 87-90)."}}, {"focus": "محطات مهارات كرة القدم ومنافساتها", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة في محطات.\n2. يوظف المهارات في منافسات مصغرة.\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "- المحطات\n- التصويب\n- السيطرة\n- المحاورة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 91-92: محطة التصويب بوجه القدم الأمامي بعد الجري بالكرة، محطة السيطرة بالصدر والتمرير، محطة المحاورة من الأمام ضد مدافع، محطة الإحساس بالكرة، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 93: 3 ضد 3 في مربع بمرميين صغيرين، شرط السيطرة قبل التصويب.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى نجحت المحاورة ومتى فشلت؟ ليستنتج الطلبة أهمية التوقيت.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما شرط التصويب في منافسة اليوم؟\nالإجابة: السيطرة على الكرة أولًا.\nس2 (المستوى المتوقع): في أي محطة استخدمنا الصدر؟\nالإجابة: محطة السيطرة بالصدر.\nس3 (المستوى المتقدم): ما أهمية التوقيت في المحاورة؟\nالإجابة: لتجاوز المدافع لحظة استجابته للخداع.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب والمحاورة.\nس2 (المستوى المتوقع): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 91-93)."}}, {"focus": "مباراة كرة القدم وتطبيق القواعد ومراكز اللاعبين", "num": 6, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية في مباراة كرة القدم.\n2. يلعب في مركز محدد ويؤدي واجباته.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المباراة\n- مراكز اللاعبين\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد والمراكز ويقسم الفرق (7 لاعبين) ويوزع المراكز ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يخطط كل فريق توزيع مراكزه وطريقة لعبه في مجموعة بأدوار (قائد، حارس، دفاع، وسط، هجوم).\n- الطالب: يخطط.\n\nالنشاط 3 (19 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 93-94: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تطبيق القواعد وتبديل المراكز في الشوط الثاني.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: كيف أثر الالتزام بالمراكز في الفريق؟ ليستنتج الطلبة أهمية التنظيم.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): ما واجب لاعب الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\nس2 (المستوى المتوقع): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس3 (المستوى المتقدم): لماذا نلتزم بمراكزنا؟\nالإجابة: لتنظيم الفريق وتغطية الملعب.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (المستوى المتوقع): ما المركز الذي لعبت فيه وما واجبك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عندما أخطأ زميلك في التمرير؟\nالإجابة: شجعته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، والاطلاع على قواعد كرة السلة (دليل المعلم ص 106-110)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يحدد بعض القواعد القانونية للعبة كرة القدم.\n2. يميز بين مراكز اللعب (حارس، دفاع، وسط، هجوم) وواجباتها.\n3. يؤدي تمرينات الإحساس بالكرة (سحب الكرة، نقلها بين القدمين، تنطيطها بالقدم والفخذ).\n\nالحصة 2:\n1. يتعرف النقاط الفنية لركل الكرة بوجه القدم الأمامي.\n2. يؤدي ركل الكرة الثابتة والمتحركة بوجه القدم الأمامي نحو المرمى.\n3. يميز بين الركل بوجه القدم الأمامي وبباطن القدم من حيث الاستخدام.\n\nالحصة 3:\n1. يتعرف النقاط الفنية للسيطرة على الكرة العالية بالصدر.\n2. يؤدي استلام الكرة العالية بالصدر وإسقاطها أمامه.\n3. يختار جزء الجسم المناسب للسيطرة على الكرة حسب ارتفاعها.\n\nالحصة 4:\n1. يتعرف أنواع المحاورة ونقاط المحاورة من الأمام.\n2. يؤدي المحاورة من الأمام بالتمويه للجانب لتجاوز مدافع.\n3. يختار توقيت المحاورة حسب استجابة المدافع.\n\nالحصة 5:\n1. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة في محطات.\n2. يوظف المهارات في منافسات مصغرة.\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات.\n\nالحصة 6:\n1. يطبق القواعد القانونية في مباراة كرة القدم.\n2. يلعب في مركز محدد ويؤدي واجباته.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 6:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n\nالحصة 5:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة\n\nالحصة 6:\n- أخرى: كرات قدم\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة القدم\n- مراكز اللاعبين\n- طريقة اللعب 4-4-2\n- الإحساس بالكرة\n\nالحصة 2:\n- وجه القدم الأمامي\n- التصويب\n- القدم المرتكزة\n- متابعة الحركة\n\nالحصة 3:\n- السيطرة على الكرة\n- الصدر\n- امتصاص الكرة\n- الكرة العالية\n\nالحصة 4:\n- المحاورة\n- التمويه\n- المدافع\n- المهاجم\n- تغيير الاتجاه\n\nالحصة 5:\n- المحطات\n- التصويب\n- السيطرة\n- المحاورة\n- المنافسة\n\nالحصة 6:\n- المباراة\n- مراكز اللاعبين\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة ملعب بتوزيع 4-4-2 ويسأل: ما دور كل مركز؟ ويشرح القواعد الأساسية (ص 84-85).\n\nالحصة 2:\nيراجع المعلم الإحساس بالكرة ويسأل: بأي جزء نصوب بقوة من مسافة بعيدة؟ ويعرض الركل بوجه القدم الأمامي (ص 86).\n\nالحصة 3:\nيراجع المعلم الاستلام بالفخذ وبوجه القدم من الصف السادس ويسأل: كيف نسيطر على كرة فوق مستوى الصدر؟ (ص 86).\n\nالحصة 4:\nيراجع المعلم السيطرة ويسأل: كيف نتخلص من مدافع يواجهنا؟ ويعرض المحاورة من الأمام (ص 87).\n\nالحصة 5:\nيراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.\n\nالحصة 6:\nيراجع المعلم القواعد والمراكز ويقسم الفرق (7 لاعبين) ويوزع المراكز ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد (الملعب، 11 لاعبًا، التسلل مبسطًا، الركلات) ومراكز اللاعبين (ص 88)، ثم يؤدي نماذج الإحساس بالكرة ص 89: سحب الكرة بأسفل القدم للخلف، نقلها بين القدمين بباطن القدم، ركلها بوجه القدم الأمامي ورفعها، تنطيطها بالقدم والفخذ، المشي بالكرة بين رأسي الزميلين.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الإحساس بالكرة بأربع مجموعات مع التبديل، وفي كل محطة بطاقة مركز يشرح القائد واجبه.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أين مركزي؟): ينادي المعلم مركزًا فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب مائل، القدم المرتكزة بجانب الكرة، مرجحة الرجل الراكلة من الورك، ضرب الكرة بوجه القدم الأمامي ومشط القدم مشدود لأسفل، متابعة الحركة، ثم تطبيق موجه من الثبات.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 1-2 ص 90: صفان متقابلان (ثنائيات) مسك الكرة ولمسها بوجه القدم الأمامي ثم الركل، ثم قطاران الجري بالكرة ثم ركلها بوجه القدم الأمامي للتصويب نحو المرمى.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويب: نقاط للأهداف من مسافة 12 م.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: وقوف مواجه للكرة مع تباعد القدمين، ثني الركبتين قليلًا، ميل الجسم للخلف وتقديم الصدر، ثم سحب الصدر لحظة ملامسة الكرة لامتصاصها وإسقاطها أمام القدمين، ثم تطبيق موجه برمي الكرة باليدين.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 3 ص 90: ثنائيات، يرمي أحدهما الكرة عالية ويستلمها الآخر بالصدر ثم يمررها بباطن القدم، ثم ثلاثيات في مثلث.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (3 لمسات): مجموعات تمرر الكرة عالية ويجب السيطرة بالصدر قبل التمرير.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة مع تغيير الاتجاه.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الاقتراب من المدافع بالكرة، حركة خداعية للجانب بميل الجسم، وعند استجابة المدافع المرور بالكرة في الاتجاه الآخر بوجه القدم الخارجي وزيادة السرعة، ثم تطبيق موجه مع قمع ثم مدافع سلبي.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 4 ص 90: قطاران متقابلان بينهما 10 م، الجري بالكرة ومحاورة الزميل (مدافع سلبي ثم نشط) والتمرير للقطار المقابل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (1 ضد 1) في مربع صغير مع هدفين من الأقماع.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 91-92: محطة التصويب بوجه القدم الأمامي بعد الجري بالكرة، محطة السيطرة بالصدر والتمرير، محطة المحاورة من الأمام ضد مدافع، محطة الإحساس بالكرة، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 93: 3 ضد 3 في مربع بمرميين صغيرين، شرط السيطرة قبل التصويب.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى نجحت المحاورة ومتى فشلت؟ ليستنتج الطلبة أهمية التوقيت.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 6:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يخطط كل فريق توزيع مراكزه وطريقة لعبه في مجموعة بأدوار (قائد، حارس، دفاع، وسط، هجوم).\n- الطالب: يخطط.\n\nالنشاط 3 (19 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 93-94: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تطبيق القواعد وتبديل المراكز في الشوط الثاني.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: كيف أثر الالتزام بالمراكز في الفريق؟ ليستنتج الطلبة أهمية التنظيم.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كم لاعبًا في فريق كرة القدم؟\nالإجابة: 11 لاعبًا.\nس2 (المستوى المتوقع): ما واجب لاعبي خط الدفاع؟\nالإجابة: منع المنافس من التسجيل بقطع التمريرات واستخلاص الكرة ثم بناء الهجوم.\nس3 (المستوى المتقدم): اذكر تمرينًا للإحساس بالكرة.\nالإجابة: نقل الكرة بين القدمين بباطن القدم.\n\nالحصة 2:\nس1 (مستوى الدعم): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة.\nس2 (المستوى المتوقع): كيف يكون مشط القدم عند الركل بوجه القدم الأمامي؟\nالإجابة: مشدودًا لأسفل.\nس3 (المستوى المتقدم): متى نستخدم الركل بوجه القدم الأمامي؟\nالإجابة: للتصويب القوي والتمرير الطويل.\n\nالحصة 3:\nس1 (مستوى الدعم): ماذا نفعل بالصدر لحظة ملامسة الكرة؟\nالإجابة: نسحبه للخلف لامتصاص قوتها.\nس2 (المستوى المتوقع): أين تسقط الكرة بعد السيطرة بالصدر؟\nالإجابة: أمام القدمين.\nس3 (المستوى المتقدم): متى نستخدم الصدر في السيطرة؟\nالإجابة: للكرات العالية فوق مستوى الصدر.\n\nالحصة 4:\nس1 (مستوى الدعم): ما هدف المحاورة؟\nالإجابة: التخلص من المنافس للوصول إلى مكان مناسب للتمرير أو التصويب.\nس2 (المستوى المتوقع): ماذا نفعل عند استجابة المدافع للخداع؟\nالإجابة: نمر بالكرة في الاتجاه الآخر بسرعة.\nس3 (المستوى المتقدم): اذكر أنواع المحاورة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.\n\nالحصة 5:\nس1 (مستوى الدعم): ما شرط التصويب في منافسة اليوم؟\nالإجابة: السيطرة على الكرة أولًا.\nس2 (المستوى المتوقع): في أي محطة استخدمنا الصدر؟\nالإجابة: محطة السيطرة بالصدر.\nس3 (المستوى المتقدم): ما أهمية التوقيت في المحاورة؟\nالإجابة: لتجاوز المدافع لحظة استجابته للخداع.\n\nالحصة 6:\nس1 (مستوى الدعم): ما واجب لاعب الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\nس2 (المستوى المتوقع): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس3 (المستوى المتقدم): لماذا نلتزم بمراكزنا؟\nالإجابة: لتنظيم الفريق وتغطية الملعب.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر مراكز اللعب في طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (المستوى المتوقع): أدِّ تنطيط الكرة بالقدم 5 مرات.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): لماذا تهم تمرينات الإحساس بالكرة قبل المهارات؟\nالإجابة: لأنها تنمي التحكم في الكرة.\n\nالحصة 2:\nس1 (مستوى الدعم): صوب بوجه القدم الأمامي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين الركل بوجه القدم الأمامي وبباطن القدم؟\nالإجابة: الأمامي للقوة والمسافة، والباطن للدقة القصيرة.\nس3 (المستوى المتقدم): لماذا نتابع الحركة بعد الركل؟\nالإجابة: لزيادة القوة والدقة والاتزان.\n\nالحصة 3:\nس1 (مستوى الدعم): استلم الكرة العالية بالصدر ومررها لزميلك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة قادمة في مستوى الفخذ، بأي جزء تسيطر عليها؟\nالإجابة: بأعلى الفخذ.\nس3 (المستوى المتقدم): ما سبب ارتداد الكرة بعيدًا عند السيطرة بالصدر؟\nالإجابة: عدم سحب الصدر للخلف لحظة الملامسة.\n\nالحصة 4:\nس1 (مستوى الدعم): راوغ المدافع بالتمويه للجانب واعبر بالكرة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): متى يفشل التمويه؟\nالإجابة: إذا لم يستجب المدافع أو كان بطيئًا في تغيير الاتجاه.\nس3 (المستوى المتقدم): لماذا نزيد السرعة بعد المرور من المدافع؟\nالإجابة: حتى لا يلحق بنا.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب والمحاورة.\nس2 (المستوى المتوقع): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nالحصة 6:\nس1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (المستوى المتوقع): ما المركز الذي لعبت فيه وما واجبك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عندما أخطأ زميلك في التمرير؟\nالإجابة: شجعته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تنطيط الكرة بالقدم والفخذ يوميًا (دليل المعلم ص 84-89).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التصويب على هدف بوجه القدم الأمامي في مكان آمن (دليل المعلم ص 86-90).\n\nالحصة 3:\nإرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالصدر (دليل المعلم ص 86-90).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يتدرب على التمويه (دليل المعلم ص 87-90).\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 91-93).\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، والاطلاع على قواعد كرة السلة (دليل المعلم ص 106-110)."}}, {"title": "لعبة كرة السلة", "unit": "الرياضات والألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 106-119", "n": 4, "periods": [{"focus": "القواعد القانونية ومراكز اللاعبين والتمرير بيد واحدة من مستوى الكتف", "num": 1, "fields": {"المخرجات التعليمية": "1. يحدد بعض القواعد القانونية لكرة السلة ومراكز اللاعبين الهجومية.\n2. يؤدي التمرير بيد واحدة من مستوى الكتف واستلامه.\n3. يميز متى يستخدم التمرير من الكتف (الهجوم الخاطف، المسافات المتوسطة والطويلة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة السلة\n- مراكز اللاعبين\n- صانع اللعب\n- التمرير من الكتف\n- الهجوم الخاطف", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة فريق كرة سلة ويسأل: ما دور صانع اللعب؟ ويشرح القواعد والمراكز الخمسة (ص 107-109، 112).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد المبسطة ومراكز اللاعبين (صانع اللعب، مساعده، الجناح، الجناح القوي، الارتكاز)، ثم يؤدي نموذج التمرير بيد واحدة من الكتف (قدم متقدمة، رفع الكرة لمستوى الكتف واليد خلفها، مد الذراع ودفع الكرة نحو الزميل)، فتطبيق موجه.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 1 ص 115: صفان متقابلان تبادل التمرير من الكتف، ثم زيادة المسافة إلى 6 م، ثم التمرير أثناء الجري.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الهجوم الخاطف): مجموعتان، إيصال الكرة إلى الطرف الآخر بأقل عدد من التمريرات من الكتف.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم التمرير بيد واحدة من الكتف؟\nالإجابة: للمسافات المتوسطة والطويلة وفي الهجوم الخاطف.\nس2 (المستوى المتوقع): ما واجب صانع اللعب؟\nالإجابة: يقود الهجوم ويمرر ويصوب من بعيد ويتخذ القرارات.\nس3 (المستوى المتقدم): كم مركزًا هجوميًا في كرة السلة؟\nالإجابة: خمسة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التمرير من الكتف لزميلك على بعد 6 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر مركزين من مراكز اللاعبين وواجبيهما.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الفرق بين التمرير من الكتف والتمريرة الصدرية؟\nالإجابة: من الكتف أقوى وأبعد بيد واحدة، والصدرية سريعة قصيرة باليدين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التمرير من الكتف نحو هدف على الحائط (دليل المعلم ص 107-115)."}}, {"focus": "المحاورة مع تغيير الاتجاه وحركات القدمين (الارتكاز)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للمحاورة مع تغيير الاتجاه والارتكاز.\n2. يؤدي المحاورة مع تغيير الاتجاه وتبديل اليدين والارتكاز الأمامي.\n3. يطبق قاعدة قدم الارتكاز (عدم تحريكها قبل التنطيط).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- المحاورة مع تغيير الاتجاه\n- الارتكاز\n- قدم الارتكاز\n- تبديل اليدين", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمرير ويسأل: كيف نتحرك بالكرة ونغير اتجاهنا دون مخالفة؟ ويعرض المحاورة والارتكاز (ص 110-111).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بالتنطيط.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: محاورة بدفع الكرة بالأصابع والنظر للأمام، تغيير الاتجاه بتبديل اليدين أو الارتكاز الخلفي، ثم الارتكاز الأمامي (ثبات قدم الارتكاز وتحريك القدم الأخرى للأمام للحماية)، مع قاعدة قدم الارتكاز، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 2-3 ص 115: قطارات المحاورة والدوران حول الأطواق مع تغيير اليدين، ثم قطاران متقابلان التحرك بالتنطيط وأداء الارتكاز الأمامي بقدم الارتكاز داخل الطوق ثم التمرير.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (قطع الكرة) بالمحاورة في مربع.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما قدم الارتكاز؟\nالإجابة: القدم الثابتة التي لا يجوز تحريكها قبل التنطيط أو التمرير.\nس2 (المستوى المتوقع): كيف نغير الاتجاه أثناء المحاورة؟\nالإجابة: بتبديل اليدين أو الارتكاز الخلفي.\nس3 (المستوى المتقدم): لماذا نؤدي الارتكاز الأمامي؟\nالإجابة: لحماية الكرة من المدافع والاستعداد للتمرير أو التصويب.", "التقويم الختامي": "س1 (مستوى الدعم): حاور حول ثلاثة أطواق مع تبديل اليدين ثم أدِّ الارتكاز الأمامي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما المخالفة عند تحريك قدم الارتكاز؟\nالإجابة: المشي بالكرة (خطوات).\nس3 (المستوى المتقدم): متى نستخدم الارتكاز الخلفي؟\nالإجابة: لتغيير الاتجاه والابتعاد عن المدافع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على المحاورة مع تغيير الاتجاه حول عوائق (دليل المعلم ص 110-115)."}}, {"focus": "التصويبة السلمية", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم.\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام.\n3. يميز الأخطاء الشائعة في التصويبة السلمية ويصححها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التصويبة السلمية من الصف السادس ويسأل: كم خطوة قبل الارتقاء؟ ويعرض النقاط الفنية (ص 111).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع الركبة اليمنى ورفع الكرة باليد اليمنى والتصويب على اللوحة، الهبوط بتوازن؛ ثم تطبيق موجه بالخطوات داخل الأطواق.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 4-5 ص 115-116: قطارات التصويبة السلمية بعد المحاورة من الجانب الأيمن ثم الأيسر، ثم بعد الاستلام من الزميل، ويعد القائد الإصابات.\n- الطالب: يتدرب ويعد.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: تتابع التصويبة السلمية بين المجموعات ونقاط للإصابات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كم خطوة قبل الارتقاء في التصويبة السلمية؟\nالإجابة: خطوتان.\nس2 (المستوى المتوقع): بأي ركبة نرتقي عند التصويب باليد اليمنى؟\nالإجابة: نرفع الركبة اليمنى ونرتقي باليسرى.\nس3 (المستوى المتقدم): متى نستخدم التصويبة السلمية؟\nالإجابة: بعد المحاورة نحو السلة أو الاستلام قرب السلة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التصويبة السلمية بعد المحاورة.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): زميلك يأخذ ثلاث خطوات قبل الارتقاء، ما الخطأ؟\nالإجابة: مخالفة المشي، الصحيح خطوتان.\nس3 (المستوى المتقدم): لماذا نصوب على اللوحة في التصويبة السلمية؟\nالإجابة: لأنها ترتد إلى السلة بدقة أكبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة في المنزل (دليل المعلم ص 111-116)."}}, {"focus": "محطات مهارات كرة السلة ومباراة تطبيقية", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي التمرير من الكتف والمحاورة والارتكاز والتصويبة السلمية في محطات.\n2. يطبق القواعد ومراكز اللاعبين في مباراة مصغرة.\n3. يستمتع بمشاركة زملائه ممارسة كرة السلة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: صدريات ملونة", "المفاهيم": "- المحطات\n- المباراة\n- المراكز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات والقواعد ويعرض المحطات ثم تنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط المحطات ص 117: التمرير من الكتف لأبعد مسافة، المحاورة حول الأطواق والارتكاز، التصويبة السلمية، التصويب من الثبات، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة ص 118: 5 ضد 5 بتوزيع المراكز وحكام من الطلبة، 5 دقائق لكل مباراة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى استخدمتم التمرير من الكتف في المباراة؟ ليستنتج الطلبة توظيف المهارات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر مركزًا لعبت فيه وواجبه.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): في أي محطة استخدمنا الأطواق؟\nالإجابة: المحاورة والارتكاز.\nس3 (المستوى المتقدم): متى استخدمت التصويبة السلمية في المباراة؟\nالإجابة: بعد المحاورة نحو السلة.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التمرير من الكتف والتصويبة السلمية.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عند قرار حكم لم يعجبك؟\nالإجابة: احترمته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يحدد بعض القواعد القانونية لكرة السلة ومراكز اللاعبين الهجومية.\n2. يؤدي التمرير بيد واحدة من مستوى الكتف واستلامه.\n3. يميز متى يستخدم التمرير من الكتف (الهجوم الخاطف، المسافات المتوسطة والطويلة).\n\nالحصة 2:\n1. يتعرف النقاط الفنية للمحاورة مع تغيير الاتجاه والارتكاز.\n2. يؤدي المحاورة مع تغيير الاتجاه وتبديل اليدين والارتكاز الأمامي.\n3. يطبق قاعدة قدم الارتكاز (عدم تحريكها قبل التنطيط).\n\nالحصة 3:\n1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم.\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام.\n3. يميز الأخطاء الشائعة في التصويبة السلمية ويصححها.\n\nالحصة 4:\n1. يؤدي التمرير من الكتف والمحاورة والارتكاز والتصويبة السلمية في محطات.\n2. يطبق القواعد ومراكز اللاعبين في مباراة مصغرة.\n3. يستمتع بمشاركة زملائه ممارسة كرة السلة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة السلة\n- مراكز اللاعبين\n- صانع اللعب\n- التمرير من الكتف\n- الهجوم الخاطف\n\nالحصة 2:\n- المحاورة مع تغيير الاتجاه\n- الارتكاز\n- قدم الارتكاز\n- تبديل اليدين\n\nالحصة 3:\n- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة\n\nالحصة 4:\n- المحطات\n- المباراة\n- المراكز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة فريق كرة سلة ويسأل: ما دور صانع اللعب؟ ويشرح القواعد والمراكز الخمسة (ص 107-109، 112).\n\nالحصة 2:\nيراجع المعلم التمرير ويسأل: كيف نتحرك بالكرة ونغير اتجاهنا دون مخالفة؟ ويعرض المحاورة والارتكاز (ص 110-111).\n\nالحصة 3:\nيراجع المعلم التصويبة السلمية من الصف السادس ويسأل: كم خطوة قبل الارتقاء؟ ويعرض النقاط الفنية (ص 111).\n\nالحصة 4:\nيراجع المعلم المهارات والقواعد ويعرض المحطات ثم تنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد المبسطة ومراكز اللاعبين (صانع اللعب، مساعده، الجناح، الجناح القوي، الارتكاز)، ثم يؤدي نموذج التمرير بيد واحدة من الكتف (قدم متقدمة، رفع الكرة لمستوى الكتف واليد خلفها، مد الذراع ودفع الكرة نحو الزميل)، فتطبيق موجه.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 1 ص 115: صفان متقابلان تبادل التمرير من الكتف، ثم زيادة المسافة إلى 6 م، ثم التمرير أثناء الجري.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الهجوم الخاطف): مجموعتان، إيصال الكرة إلى الطرف الآخر بأقل عدد من التمريرات من الكتف.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بالتنطيط.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: محاورة بدفع الكرة بالأصابع والنظر للأمام، تغيير الاتجاه بتبديل اليدين أو الارتكاز الخلفي، ثم الارتكاز الأمامي (ثبات قدم الارتكاز وتحريك القدم الأخرى للأمام للحماية)، مع قاعدة قدم الارتكاز، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 2-3 ص 115: قطارات المحاورة والدوران حول الأطواق مع تغيير اليدين، ثم قطاران متقابلان التحرك بالتنطيط وأداء الارتكاز الأمامي بقدم الارتكاز داخل الطوق ثم التمرير.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (قطع الكرة) بالمحاورة في مربع.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع الركبة اليمنى ورفع الكرة باليد اليمنى والتصويب على اللوحة، الهبوط بتوازن؛ ثم تطبيق موجه بالخطوات داخل الأطواق.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 4-5 ص 115-116: قطارات التصويبة السلمية بعد المحاورة من الجانب الأيمن ثم الأيسر، ثم بعد الاستلام من الزميل، ويعد القائد الإصابات.\n- الطالب: يتدرب ويعد.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: تتابع التصويبة السلمية بين المجموعات ونقاط للإصابات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط المحطات ص 117: التمرير من الكتف لأبعد مسافة، المحاورة حول الأطواق والارتكاز، التصويبة السلمية، التصويب من الثبات، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة ص 118: 5 ضد 5 بتوزيع المراكز وحكام من الطلبة، 5 دقائق لكل مباراة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى استخدمتم التمرير من الكتف في المباراة؟ ليستنتج الطلبة توظيف المهارات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): متى نستخدم التمرير بيد واحدة من الكتف؟\nالإجابة: للمسافات المتوسطة والطويلة وفي الهجوم الخاطف.\nس2 (المستوى المتوقع): ما واجب صانع اللعب؟\nالإجابة: يقود الهجوم ويمرر ويصوب من بعيد ويتخذ القرارات.\nس3 (المستوى المتقدم): كم مركزًا هجوميًا في كرة السلة؟\nالإجابة: خمسة.\n\nالحصة 2:\nس1 (مستوى الدعم): ما قدم الارتكاز؟\nالإجابة: القدم الثابتة التي لا يجوز تحريكها قبل التنطيط أو التمرير.\nس2 (المستوى المتوقع): كيف نغير الاتجاه أثناء المحاورة؟\nالإجابة: بتبديل اليدين أو الارتكاز الخلفي.\nس3 (المستوى المتقدم): لماذا نؤدي الارتكاز الأمامي؟\nالإجابة: لحماية الكرة من المدافع والاستعداد للتمرير أو التصويب.\n\nالحصة 3:\nس1 (مستوى الدعم): كم خطوة قبل الارتقاء في التصويبة السلمية؟\nالإجابة: خطوتان.\nس2 (المستوى المتوقع): بأي ركبة نرتقي عند التصويب باليد اليمنى؟\nالإجابة: نرفع الركبة اليمنى ونرتقي باليسرى.\nس3 (المستوى المتقدم): متى نستخدم التصويبة السلمية؟\nالإجابة: بعد المحاورة نحو السلة أو الاستلام قرب السلة.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر مركزًا لعبت فيه وواجبه.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): في أي محطة استخدمنا الأطواق؟\nالإجابة: المحاورة والارتكاز.\nس3 (المستوى المتقدم): متى استخدمت التصويبة السلمية في المباراة؟\nالإجابة: بعد المحاورة نحو السلة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ التمرير من الكتف لزميلك على بعد 6 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر مركزين من مراكز اللاعبين وواجبيهما.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الفرق بين التمرير من الكتف والتمريرة الصدرية؟\nالإجابة: من الكتف أقوى وأبعد بيد واحدة، والصدرية سريعة قصيرة باليدين.\n\nالحصة 2:\nس1 (مستوى الدعم): حاور حول ثلاثة أطواق مع تبديل اليدين ثم أدِّ الارتكاز الأمامي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما المخالفة عند تحريك قدم الارتكاز؟\nالإجابة: المشي بالكرة (خطوات).\nس3 (المستوى المتقدم): متى نستخدم الارتكاز الخلفي؟\nالإجابة: لتغيير الاتجاه والابتعاد عن المدافع.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ التصويبة السلمية بعد المحاورة.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): زميلك يأخذ ثلاث خطوات قبل الارتقاء، ما الخطأ؟\nالإجابة: مخالفة المشي، الصحيح خطوتان.\nس3 (المستوى المتقدم): لماذا نصوب على اللوحة في التصويبة السلمية؟\nالإجابة: لأنها ترتد إلى السلة بدقة أكبر.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التمرير من الكتف والتصويبة السلمية.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عند قرار حكم لم يعجبك؟\nالإجابة: احترمته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على التمرير من الكتف نحو هدف على الحائط (دليل المعلم ص 107-115).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على المحاورة مع تغيير الاتجاه حول عوائق (دليل المعلم ص 110-115).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة في المنزل (دليل المعلم ص 111-116).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2)."}}, {"title": "الاختبار العملي (2)", "unit": "تقويم", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 65-119 (الرياضات والألعاب الحركية 1)", "n": 2, "periods": [{"focus": "اختبار عملي في ألعاب القوى وكرة القدم", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الوثب العالي بالطريقة الظهرية من اقتراب منحنٍ قصير.\n2. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة من الأمام.\n3. يطبق القواعد القانونية في مواقف مصغرة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ في وحدة الرياضات والألعاب الحركية (1) اختير: ألعاب القوى (6 حصص) + كرة القدم (6 حصص) + كرة السلة (4 حصص) = 16 حصة، مع الاختبار العملي (1) في الأسبوع الثامن.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
