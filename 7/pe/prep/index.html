nس3 (مستوى الاستدلال): لماذا نضع مراتب الوثب العالي خلف العارضة؟\nالإجابة: لامتصاص الهبوط على الظهر بأمان.\n\nس4 (مستوى المعرفة): حدد المراحل الفنية لمسابقة الوثب العالي بالطريقة الظهرية.\nالإجابة: الاقتراب المنحني، الارتقاء بالقدم البعيدة، الطيران بالتقوس، الهبوط على الظهر.\nس5 (مستوى التطبيق): أدِّ وثبة ظهرية كاملة على ارتفاع مناسب.\nالإجابة: يؤديها.\nس6 (مستوى الاستدلال): كيف شعرت عندما تجاوزت العارضة؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في الوثب العالي (دليل المعلم ص 78-81).\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة وثب عالٍ وتحديد مراحلها، والاطلاع على قواعد كرة القدم (دليل المعلم ص 83-87).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=6"}}, {"title": "لعبة كرة القدم", "unit": "الرياضات والألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 83-95", "n": 3, "periods": [{"focus": "القواعد القانونية ومراكز اللاعبين وتمرينات الإحساس بالكرة + ركل الكرة بوجه القدم الأمامي (التصويب)", "num": 1, "fields": {"المخرجات التعليمية": "1. يحدد بعض القواعد القانونية للعبة كرة القدم (5 دقائق)\n2. يميز بين مراكز اللعب (حارس، دفاع، وسط، هجوم) وواجباتها (5 دقائق)\n3. يؤدي تمرينات الإحساس بالكرة (سحب الكرة، نقلها بين القدمين، تنطيطها بالقدم والفخذ) (10 دقائق)\n4. يتعرف النقاط الفنية لركل الكرة بوجه القدم الأمامي (5 دقائق)\n5. يؤدي ركل الكرة الثابتة والمتحركة بوجه القدم الأمامي نحو المرمى (10 دقائق)\n6. يميز بين الركل بوجه القدم الأمامي وبباطن القدم من حيث الاستخدام (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: مرمى", "المفاهيم": "- كرة القدم\n- مراكز اللاعبين\n- طريقة اللعب 4-4-2\n- الإحساس بالكرة\n- وجه القدم الأمامي\n- التصويب\n- القدم المرتكزة\n- متابعة الحركة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ملعب بتوزيع 4-4-2 ويسأل: ما دور كل مركز؟ ويشرح القواعد الأساسية (ص 84-85).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (الملعب، 11 لاعبًا، التسلل مبسطًا، الركلات) ومراكز اللاعبين (ص 88)، ثم يؤدي نماذج الإحساس بالكرة ص 89: سحب الكرة بأسفل القدم للخلف، نقلها بين القدمين بباطن القدم، ركلها بوجه القدم الأمامي ورفعها، تنطيطها بالقدم والفخذ، المشي بالكرة بين رأسي الزميلين، ويستمع الطالب ويقلد (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الإحساس بالكرة بأربع مجموعات مع التبديل، وفي كل محطة بطاقة مركز يشرح القائد واجبه، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أين مركزي؟): ينادي المعلم مركزًا فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر، ويلعب الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: اقتراب مائل، القدم المرتكزة بجانب الكرة، مرجحة الرجل الراكلة من الورك، ضرب الكرة بوجه القدم الأمامي ومشط القدم مشدود لأسفل، متابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات 1-2 ص 90: صفان متقابلان (ثنائيات) مسك الكرة ولمسها بوجه القدم الأمامي ثم الركل، ثم قطاران الجري بالكرة ثم ركلها بوجه القدم الأمامي للتصويب نحو المرمى، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويب: نقاط للأهداف من مسافة 12 م، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم لاعبًا في فريق كرة القدم؟\nالإجابة: 11 لاعبًا.\nس2 (مستوى التطبيق): ما واجب لاعبي خط الدفاع؟\nالإجابة: منع المنافس من التسجيل بقطع التمريرات واستخلاص الكرة ثم بناء الهجوم.\nس3 (مستوى الاستدلال): اذكر تمرينًا للإحساس بالكرة.\nالإجابة: نقل الكرة بين القدمين بباطن القدم.\n\nس4 (مستوى المعرفة): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة.\nس5 (مستوى التطبيق): كيف يكون مشط القدم عند الركل بوجه القدم الأمامي؟\nالإجابة: مشدودًا لأسفل.\nس6 (مستوى الاستدلال): متى نستخدم الركل بوجه القدم الأمامي؟\nالإجابة: للتصويب القوي والتمرير الطويل.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر مراكز اللعب في طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (مستوى التطبيق): أدِّ تنطيط الكرة بالقدم 5 مرات.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): لماذا تهم تمرينات الإحساس بالكرة قبل المهارات؟\nالإجابة: لأنها تنمي التحكم في الكرة.\n\nس4 (مستوى المعرفة): صوب بوجه القدم الأمامي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما الفرق بين الركل بوجه القدم الأمامي وبباطن القدم؟\nالإجابة: الأمامي للقوة والمسافة، والباطن للدقة القصيرة.\nس6 (مستوى الاستدلال): لماذا نتابع الحركة بعد الركل؟\nالإجابة: لزيادة القوة والدقة والاتزان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تنطيط الكرة بالقدم والفخذ يوميًا (دليل المعلم ص 84-89).\nإرشاد لولي الأمر: شجع طالبك على التصويب على هدف بوجه القدم الأمامي في مكان آمن (دليل المعلم ص 86-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"focus": "السيطرة على الكرة العالية بالصدر + المحاورة من الأمام (بالتمويه للجانب)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للسيطرة على الكرة العالية بالصدر (5 دقائق)\n2. يؤدي استلام الكرة العالية بالصدر وإسقاطها أمامه (10 دقائق)\n3. يختار جزء الجسم المناسب للسيطرة على الكرة حسب ارتفاعها (5 دقائق)\n4. يتعرف أنواع المحاورة ونقاط المحاورة من الأمام (5 دقائق)\n5. يؤدي المحاورة من الأمام بالتمويه للجانب لتجاوز مدافع (10 دقائق)\n6. يختار توقيت المحاورة حسب استجابة المدافع (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: صدريات ملونة", "المفاهيم": "- السيطرة على الكرة\n- الصدر\n- امتصاص الكرة\n- الكرة العالية\n- المحاورة\n- التمويه\n- المدافع\n- المهاجم\n- تغيير الاتجاه", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الاستلام بالفخذ وبوجه القدم من الصف السادس ويسأل: كيف نسيطر على كرة فوق مستوى الصدر؟ (ص 86).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف مواجه للكرة مع تباعد القدمين، ثني الركبتين قليلًا، ميل الجسم للخلف وتقديم الصدر، ثم سحب الصدر لحظة ملامسة الكرة لامتصاصها وإسقاطها أمام القدمين، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 90: ثنائيات، يرمي أحدهما الكرة عالية ويستلمها الآخر بالصدر ثم يمررها بباطن القدم، ثم ثلاثيات في مثلث، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (3 لمسات): مجموعات تمرر الكرة عالية ويجب السيطرة بالصدر قبل التمرير، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: الاقتراب من المدافع بالكرة، حركة خداعية للجانب بميل الجسم، وعند استجابة المدافع المرور بالكرة في الاتجاه الآخر بوجه القدم الخارجي وزيادة السرعة، ثم تطبيق موجه مع قمع ثم مدافع سلبي، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريب 4 ص 90: قطاران متقابلان بينهما 10 م، الجري بالكرة ومحاورة الزميل (مدافع سلبي ثم نشط) والتمرير للقطار المقابل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (1 ضد 1) في مربع صغير مع هدفين من الأقماع، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ماذا نفعل بالصدر لحظة ملامسة الكرة؟\nالإجابة: نسحبه للخلف لامتصاص قوتها.\nس2 (مستوى التطبيق): أين تسقط الكرة بعد السيطرة بالصدر؟\nالإجابة: أمام القدمين.\nس3 (مستوى الاستدلال): متى نستخدم الصدر في السيطرة؟\nالإجابة: للكرات العالية فوق مستوى الصدر.\n\nس4 (مستوى المعرفة): ما هدف المحاورة؟\nالإجابة: التخلص من المنافس للوصول إلى مكان مناسب للتمرير أو التصويب.\nس5 (مستوى التطبيق): ماذا نفعل عند استجابة المدافع للخداع؟\nالإجابة: نمر بالكرة في الاتجاه الآخر بسرعة.\nس6 (مستوى الاستدلال): اذكر أنواع المحاورة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.", "التقويم الختامي": "س1 (مستوى المعرفة): استلم الكرة العالية بالصدر ومررها لزميلك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الفخذ، بأي جزء تسيطر عليها؟\nالإجابة: بأعلى الفخذ.\nس3 (مستوى الاستدلال): ما سبب ارتداد الكرة بعيدًا عند السيطرة بالصدر؟\nالإجابة: عدم سحب الصدر للخلف لحظة الملامسة.\n\nس4 (مستوى المعرفة): راوغ المدافع بالتمويه للجانب واعبر بالكرة.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): متى يفشل التمويه؟\nالإجابة: إذا لم يستجب المدافع أو كان بطيئًا في تغيير الاتجاه.\nس6 (مستوى الاستدلال): لماذا نزيد السرعة بعد المرور من المدافع؟\nالإجابة: حتى لا يلحق بنا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالصدر (دليل المعلم ص 86-90).\nإرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يتدرب على التمويه (دليل المعلم ص 87-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"focus": "محطات مهارات كرة القدم ومنافساتها + مباراة كرة القدم وتطبيق القواعد ومراكز اللاعبين", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة في محطات (10 دقائق)\n2. يوظف المهارات في منافسات مصغرة (5 دقائق)\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات (5 دقائق)\n4. يطبق القواعد القانونية في مباراة كرة القدم (10 دقائق)\n5. يلعب في مركز محدد ويؤدي واجباته (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة\n- أخرى: مرامٍ\n- أخرى: صافرة", "المفاهيم": "- المحطات\n- التصويب\n- السيطرة\n- المحاورة\n- المنافسة\n- المباراة\n- مراكز اللاعبين\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 91-92: محطة التصويب بوجه القدم الأمامي بعد الجري بالكرة، محطة السيطرة بالصدر والتمرير، محطة المحاورة من الأمام ضد مدافع، محطة الإحساس بالكرة، مع التبديل، ويؤدي الطالب ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 93: 3 ضد 3 في مربع بمرميين صغيرين، شرط السيطرة قبل التصويب، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجحت المحاورة ومتى فشلت؟ ليستنتج الطلبة أهمية التوقيت، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. يخطط كل فريق توزيع مراكزه وطريقة لعبه في مجموعة بأدوار (قائد، حارس، دفاع، وسط، هجوم)، ويخطط الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 93-94: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تطبيق القواعد وتبديل المراكز في الشوط الثاني، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: كيف أثر الالتزام بالمراكز في الفريق؟ ليستنتج الطلبة أهمية التنظيم، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – فريق اسمه عمان: تربط المجموعات مراكز كرة القدم (حارس، دفاع، وسط، هجوم) بأدوار أفراد المجتمع العماني كالمعلم والطبيب والمزارع، وتشرح أن لكل دور واجبًا يخدم الفريق (3 دقائق)\nالاستراتيجيات: العصف الذهني.", "التقويم التكويني": "س1 (مستوى المعرفة): ما شرط التصويب في منافسة اليوم؟\nالإجابة: السيطرة على الكرة أولًا.\nس2 (مستوى التطبيق): في أي محطة استخدمنا الصدر؟\nالإجابة: محطة السيطرة بالصدر.\nس3 (مستوى الاستدلال): ما أهمية التوقيت في المحاورة؟\nالإجابة: لتجاوز المدافع لحظة استجابته للخداع.\n\nس4 (مستوى المعرفة): ما واجب لاعب الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\nس5 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس6 (مستوى الاستدلال): لماذا نلتزم بمراكزنا؟\nالإجابة: لتنظيم الفريق وتغطية الملعب.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب والمحاورة.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس5 (مستوى التطبيق): ما المركز الذي لعبت فيه وما واجبك؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عندما أخطأ زميلك في التمرير؟\nالإجابة: شجعته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 91-93).\nإرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، والاطلاع على قواعد كرة السلة (دليل المعلم ص 106-110).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يحدد بعض القواعد القانونية للعبة كرة القدم (5 دقائق)\n2. يميز بين مراكز اللعب (حارس، دفاع، وسط، هجوم) وواجباتها (5 دقائق)\n3. يؤدي تمرينات الإحساس بالكرة (سحب الكرة، نقلها بين القدمين، تنطيطها بالقدم والفخذ) (10 دقائق)\n4. يتعرف النقاط الفنية لركل الكرة بوجه القدم الأمامي (5 دقائق)\n5. يؤدي ركل الكرة الثابتة والمتحركة بوجه القدم الأمامي نحو المرمى (10 دقائق)\n6. يميز بين الركل بوجه القدم الأمامي وبباطن القدم من حيث الاستخدام (5 دقائق)\n\nالحصة 2:\n1. يتعرف النقاط الفنية للسيطرة على الكرة العالية بالصدر (5 دقائق)\n2. يؤدي استلام الكرة العالية بالصدر وإسقاطها أمامه (10 دقائق)\n3. يختار جزء الجسم المناسب للسيطرة على الكرة حسب ارتفاعها (5 دقائق)\n4. يتعرف أنواع المحاورة ونقاط المحاورة من الأمام (5 دقائق)\n5. يؤدي المحاورة من الأمام بالتمويه للجانب لتجاوز مدافع (10 دقائق)\n6. يختار توقيت المحاورة حسب استجابة المدافع (5 دقائق)\n\nالحصة 3:\n1. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة في محطات (10 دقائق)\n2. يوظف المهارات في منافسات مصغرة (5 دقائق)\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات (5 دقائق)\n4. يطبق القواعد القانونية في مباراة كرة القدم (10 دقائق)\n5. يلعب في مركز محدد ويؤدي واجباته (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: مرمى\n\nالحصة 2:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: صدريات ملونة\n\nالحصة 3:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة\n- أخرى: مرامٍ\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة القدم\n- مراكز اللاعبين\n- طريقة اللعب 4-4-2\n- الإحساس بالكرة\n- وجه القدم الأمامي\n- التصويب\n- القدم المرتكزة\n- متابعة الحركة\n\nالحصة 2:\n- السيطرة على الكرة\n- الصدر\n- امتصاص الكرة\n- الكرة العالية\n- المحاورة\n- التمويه\n- المدافع\n- المهاجم\n- تغيير الاتجاه\n\nالحصة 3:\n- المحطات\n- التصويب\n- السيطرة\n- المحاورة\n- المنافسة\n- المباراة\n- مراكز اللاعبين\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة ملعب بتوزيع 4-4-2 ويسأل: ما دور كل مركز؟ ويشرح القواعد الأساسية (ص 84-85).\n\nالحصة 2:\nيراجع المعلم الاستلام بالفخذ وبوجه القدم من الصف السادس ويسأل: كيف نسيطر على كرة فوق مستوى الصدر؟ (ص 86).\n\nالحصة 3:\nيراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (الملعب، 11 لاعبًا، التسلل مبسطًا، الركلات) ومراكز اللاعبين (ص 88)، ثم يؤدي نماذج الإحساس بالكرة ص 89: سحب الكرة بأسفل القدم للخلف، نقلها بين القدمين بباطن القدم، ركلها بوجه القدم الأمامي ورفعها، تنطيطها بالقدم والفخذ، المشي بالكرة بين رأسي الزميلين، ويستمع الطالب ويقلد (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الإحساس بالكرة بأربع مجموعات مع التبديل، وفي كل محطة بطاقة مركز يشرح القائد واجبه، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أين مركزي؟): ينادي المعلم مركزًا فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر، ويلعب الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: اقتراب مائل، القدم المرتكزة بجانب الكرة، مرجحة الرجل الراكلة من الورك، ضرب الكرة بوجه القدم الأمامي ومشط القدم مشدود لأسفل، متابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات 1-2 ص 90: صفان متقابلان (ثنائيات) مسك الكرة ولمسها بوجه القدم الأمامي ثم الركل، ثم قطاران الجري بالكرة ثم ركلها بوجه القدم الأمامي للتصويب نحو المرمى، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويب: نقاط للأهداف من مسافة 12 م، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف مواجه للكرة مع تباعد القدمين، ثني الركبتين قليلًا، ميل الجسم للخلف وتقديم الصدر، ثم سحب الصدر لحظة ملامسة الكرة لامتصاصها وإسقاطها أمام القدمين، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 90: ثنائيات، يرمي أحدهما الكرة عالية ويستلمها الآخر بالصدر ثم يمررها بباطن القدم، ثم ثلاثيات في مثلث، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (3 لمسات): مجموعات تمرر الكرة عالية ويجب السيطرة بالصدر قبل التمرير، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: الاقتراب من المدافع بالكرة، حركة خداعية للجانب بميل الجسم، وعند استجابة المدافع المرور بالكرة في الاتجاه الآخر بوجه القدم الخارجي وزيادة السرعة، ثم تطبيق موجه مع قمع ثم مدافع سلبي، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريب 4 ص 90: قطاران متقابلان بينهما 10 م، الجري بالكرة ومحاورة الزميل (مدافع سلبي ثم نشط) والتمرير للقطار المقابل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (1 ضد 1) في مربع صغير مع هدفين من الأقماع، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 91-92: محطة التصويب بوجه القدم الأمامي بعد الجري بالكرة، محطة السيطرة بالصدر والتمرير، محطة المحاورة من الأمام ضد مدافع، محطة الإحساس بالكرة، مع التبديل، ويؤدي الطالب ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 93: 3 ضد 3 في مربع بمرميين صغيرين، شرط السيطرة قبل التصويب، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجحت المحاورة ومتى فشلت؟ ليستنتج الطلبة أهمية التوقيت، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. يخطط كل فريق توزيع مراكزه وطريقة لعبه في مجموعة بأدوار (قائد، حارس، دفاع، وسط، هجوم)، ويخطط الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 93-94: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تطبيق القواعد وتبديل المراكز في الشوط الثاني، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: كيف أثر الالتزام بالمراكز في الفريق؟ ليستنتج الطلبة أهمية التنظيم، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – فريق اسمه عمان: تربط المجموعات مراكز كرة القدم (حارس، دفاع، وسط، هجوم) بأدوار أفراد المجتمع العماني كالمعلم والطبيب والمزارع، وتشرح أن لكل دور واجبًا يخدم الفريق (3 دقائق)\nالاستراتيجيات: العصف الذهني.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كم لاعبًا في فريق كرة القدم؟\nالإجابة: 11 لاعبًا.\nس2 (مستوى التطبيق): ما واجب لاعبي خط الدفاع؟\nالإجابة: منع المنافس من التسجيل بقطع التمريرات واستخلاص الكرة ثم بناء الهجوم.\nس3 (مستوى الاستدلال): اذكر تمرينًا للإحساس بالكرة.\nالإجابة: نقل الكرة بين القدمين بباطن القدم.\n\nس4 (مستوى المعرفة): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة.\nس5 (مستوى التطبيق): كيف يكون مشط القدم عند الركل بوجه القدم الأمامي؟\nالإجابة: مشدودًا لأسفل.\nس6 (مستوى الاستدلال): متى نستخدم الركل بوجه القدم الأمامي؟\nالإجابة: للتصويب القوي والتمرير الطويل.\n\nالحصة 2:\nس1 (مستوى المعرفة): ماذا نفعل بالصدر لحظة ملامسة الكرة؟\nالإجابة: نسحبه للخلف لامتصاص قوتها.\nس2 (مستوى التطبيق): أين تسقط الكرة بعد السيطرة بالصدر؟\nالإجابة: أمام القدمين.\nس3 (مستوى الاستدلال): متى نستخدم الصدر في السيطرة؟\nالإجابة: للكرات العالية فوق مستوى الصدر.\n\nس4 (مستوى المعرفة): ما هدف المحاورة؟\nالإجابة: التخلص من المنافس للوصول إلى مكان مناسب للتمرير أو التصويب.\nس5 (مستوى التطبيق): ماذا نفعل عند استجابة المدافع للخداع؟\nالإجابة: نمر بالكرة في الاتجاه الآخر بسرعة.\nس6 (مستوى الاستدلال): اذكر أنواع المحاورة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما شرط التصويب في منافسة اليوم؟\nالإجابة: السيطرة على الكرة أولًا.\nس2 (مستوى التطبيق): في أي محطة استخدمنا الصدر؟\nالإجابة: محطة السيطرة بالصدر.\nس3 (مستوى الاستدلال): ما أهمية التوقيت في المحاورة؟\nالإجابة: لتجاوز المدافع لحظة استجابته للخداع.\n\nس4 (مستوى المعرفة): ما واجب لاعب الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\nس5 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس6 (مستوى الاستدلال): لماذا نلتزم بمراكزنا؟\nالإجابة: لتنظيم الفريق وتغطية الملعب.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر مراكز اللعب في طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (مستوى التطبيق): أدِّ تنطيط الكرة بالقدم 5 مرات.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): لماذا تهم تمرينات الإحساس بالكرة قبل المهارات؟\nالإجابة: لأنها تنمي التحكم في الكرة.\n\nس4 (مستوى المعرفة): صوب بوجه القدم الأمامي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما الفرق بين الركل بوجه القدم الأمامي وبباطن القدم؟\nالإجابة: الأمامي للقوة والمسافة، والباطن للدقة القصيرة.\nس6 (مستوى الاستدلال): لماذا نتابع الحركة بعد الركل؟\nالإجابة: لزيادة القوة والدقة والاتزان.\n\nالحصة 2:\nس1 (مستوى المعرفة): استلم الكرة العالية بالصدر ومررها لزميلك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الفخذ، بأي جزء تسيطر عليها؟\nالإجابة: بأعلى الفخذ.\nس3 (مستوى الاستدلال): ما سبب ارتداد الكرة بعيدًا عند السيطرة بالصدر؟\nالإجابة: عدم سحب الصدر للخلف لحظة الملامسة.\n\nس4 (مستوى المعرفة): راوغ المدافع بالتمويه للجانب واعبر بالكرة.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): متى يفشل التمويه؟\nالإجابة: إذا لم يستجب المدافع أو كان بطيئًا في تغيير الاتجاه.\nس6 (مستوى الاستدلال): لماذا نزيد السرعة بعد المرور من المدافع؟\nالإجابة: حتى لا يلحق بنا.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب والمحاورة.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس5 (مستوى التطبيق): ما المركز الذي لعبت فيه وما واجبك؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عندما أخطأ زميلك في التمرير؟\nالإجابة: شجعته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تنطيط الكرة بالقدم والفخذ يوميًا (دليل المعلم ص 84-89).\nإرشاد لولي الأمر: شجع طالبك على التصويب على هدف بوجه القدم الأمامي في مكان آمن (دليل المعلم ص 86-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالصدر (دليل المعلم ص 86-90).\nإرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يتدرب على التمويه (دليل المعلم ص 87-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 91-93).\nإرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، والاطلاع على قواعد كرة السلة (دليل المعلم ص 106-110).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"title": "لعبة كرة السلة", "unit": "الرياضات والألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 106-119", "n": 2, "periods": [{"focus": "القواعد القانونية ومراكز اللاعبين والتمرير بيد واحدة من مستوى الكتف + المحاورة مع تغيير الاتجاه وحركات القدمين (الارتكاز)", "num": 1, "fields": {"المخرجات التعليمية": "1. يحدد بعض القواعد القانونية لكرة السلة ومراكز اللاعبين الهجومية (5 دقائق)\n2. يؤدي التمرير بيد واحدة من مستوى الكتف واستلامه (10 دقائق)\n3. يميز متى يستخدم التمرير من الكتف (الهجوم الخاطف، المسافات المتوسطة والطويلة) (5 دقائق)\n4. يتعرف النقاط الفنية للمحاورة مع تغيير الاتجاه والارتكاز (5 دقائق)\n5. يؤدي المحاورة مع تغيير الاتجاه وتبديل اليدين والارتكاز الأمامي (10 دقائق)\n6. يطبق قاعدة قدم الارتكاز (عدم تحريكها قبل التنطيط) (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: أطواق", "المفاهيم": "- كرة السلة\n- مراكز اللاعبين\n- صانع اللعب\n- التمرير من الكتف\n- الهجوم الخاطف\n- المحاورة مع تغيير الاتجاه\n- الارتكاز\n- قدم الارتكاز\n- تبديل اليدين", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة فريق كرة سلة ويسأل: ما دور صانع اللعب؟ ويشرح القواعد والمراكز الخمسة (ص 107-109، 112).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد المبسطة ومراكز اللاعبين (صانع اللعب، مساعده، الجناح، الجناح القوي، الارتكاز)، ثم يؤدي نموذج التمرير بيد واحدة من الكتف (قدم متقدمة، رفع الكرة لمستوى الكتف واليد خلفها، مد الذراع ودفع الكرة نحو الزميل)، فتطبيق موجه، ويستمع الطالب ويقلد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 1 ص 115: صفان متقابلان تبادل التمرير من الكتف، ثم زيادة المسافة إلى 6 م، ثم التمرير أثناء الجري، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الهجوم الخاطف): مجموعتان، إيصال الكرة إلى الطرف الآخر بأقل عدد من التمريرات من الكتف، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: محاورة بدفع الكرة بالأصابع والنظر للأمام، تغيير الاتجاه بتبديل اليدين أو الارتكاز الخلفي، ثم الارتكاز الأمامي (ثبات قدم الارتكاز وتحريك القدم الأخرى للأمام للحماية)، مع قاعدة قدم الارتكاز، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات 2-3 ص 115: قطارات المحاورة والدوران حول الأطواق مع تغيير اليدين، ثم قطاران متقابلان التحرك بالتنطيط وأداء الارتكاز الأمامي بقدم الارتكاز داخل الطوق ثم التمرير، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (قطع الكرة) بالمحاورة في مربع، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): متى نستخدم التمرير بيد واحدة من الكتف؟\nالإجابة: للمسافات المتوسطة والطويلة وفي الهجوم الخاطف.\nس2 (مستوى التطبيق): ما واجب صانع اللعب؟\nالإجابة: يقود الهجوم ويمرر ويصوب من بعيد ويتخذ القرارات.\nس3 (مستوى الاستدلال): كم مركزًا هجوميًا في كرة السلة؟\nالإجابة: خمسة.\n\nس4 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم الثابتة التي لا يجوز تحريكها قبل التنطيط أو التمرير.\nس5 (مستوى التطبيق): كيف نغير الاتجاه أثناء المحاورة؟\nالإجابة: بتبديل اليدين أو الارتكاز الخلفي.\nس6 (مستوى الاستدلال): لماذا نؤدي الارتكاز الأمامي؟\nالإجابة: لحماية الكرة من المدافع والاستعداد للتمرير أو التصويب.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التمرير من الكتف لزميلك على بعد 6 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر مركزين من مراكز اللاعبين وواجبيهما.\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): ما الفرق بين التمرير من الكتف والتمريرة الصدرية؟\nالإجابة: من الكتف أقوى وأبعد بيد واحدة، والصدرية سريعة قصيرة باليدين.\n\nس4 (مستوى المعرفة): حاور حول ثلاثة أطواق مع تبديل اليدين ثم أدِّ الارتكاز الأمامي.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما المخالفة عند تحريك قدم الارتكاز؟\nالإجابة: المشي بالكرة (خطوات).\nس6 (مستوى الاستدلال): متى نستخدم الارتكاز الخلفي؟\nالإجابة: لتغيير الاتجاه والابتعاد عن المدافع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التمرير من الكتف نحو هدف على الحائط (دليل المعلم ص 107-115).\nإرشاد لولي الأمر: شجع طالبك على المحاورة مع تغيير الاتجاه حول عوائق (دليل المعلم ص 110-115).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8"}}, {"focus": "التصويبة السلمية + محطات مهارات كرة السلة ومباراة تطبيقية", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (5 دقائق)\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام (10 دقائق)\n3. يميز الأخطاء الشائعة في التصويبة السلمية ويصححها (5 دقائق)\n4. يؤدي التمرير من الكتف والمحاورة والارتكاز والتصويبة السلمية في محطات (10 دقائق)\n5. يطبق القواعد ومراكز اللاعبين في مباراة مصغرة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة كرة السلة بروح رياضية (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: سلال\n- أخرى: صدريات ملونة", "المفاهيم": "- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة\n- المحطات\n- المباراة\n- المراكز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التصويبة السلمية من الصف السادس ويسأل: كم خطوة قبل الارتقاء؟ ويعرض النقاط الفنية (ص 111).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع الركبة اليمنى ورفع الكرة باليد اليمنى والتصويب على اللوحة، الهبوط بتوازن؛ ثم تطبيق موجه بالخطوات داخل الأطواق، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 4-5 ص 115-116: قطارات التصويبة السلمية بعد المحاورة من الجانب الأيمن ثم الأيسر، ثم بعد الاستلام من الزميل، ويعد القائد الإصابات، ويتدرب الطالب ويعد (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: تتابع التصويبة السلمية بين المجموعات ونقاط للإصابات، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط المحطات ص 117: التمرير من الكتف لأبعد مسافة، المحاورة حول الأطواق والارتكاز، التصويبة السلمية، التصويب من الثبات، مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباراة ص 118: 5 ضد 5 بتوزيع المراكز وحكام من الطلبة، 5 دقائق لكل مباراة، ويلعب الطالب ويحكم (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى استخدمتم التمرير من الكتف في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – تمريرات التكافل: يمرر الطلبة الكرة بيد واحدة من مستوى الكتف، ومع كل تمريرة ناجحة يذكرون صورة من التكافل في عمان كالمساعدة في الأعراس والحصاد ومواساة الجيران (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "س1 (مستوى المعرفة): كم خطوة قبل الارتقاء في التصويبة السلمية؟\nالإجابة: خطوتان.\nس2 (مستوى التطبيق): بأي ركبة نرتقي عند التصويب باليد اليمنى؟\nالإجابة: نرفع الركبة اليمنى ونرتقي باليسرى.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: بعد المحاورة نحو السلة أو الاستلام قرب السلة.\n\nس4 (مستوى المعرفة): اذكر مركزًا لعبت فيه وواجبه.\nالإجابة: يذكر.\nس5 (مستوى التطبيق): في أي محطة استخدمنا الأطواق؟\nالإجابة: المحاورة والارتكاز.\nس6 (مستوى الاستدلال): متى استخدمت التصويبة السلمية في المباراة؟\nالإجابة: بعد المحاورة نحو السلة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التصويبة السلمية بعد المحاورة.\nالإجابة: يؤديها.\nس2 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات قبل الارتقاء، ما الخطأ؟\nالإجابة: مخالفة المشي، الصحيح خطوتان.\nس3 (مستوى الاستدلال): لماذا نصوب على اللوحة في التصويبة السلمية؟\nالإجابة: لأنها ترتد إلى السلة بدقة أكبر.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التمرير من الكتف والتصويبة السلمية.\nس5 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عند قرار حكم لم يعجبك؟\nالإجابة: احترمته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة في المنزل (دليل المعلم ص 111-116).\nإرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يحدد بعض القواعد القانونية لكرة السلة ومراكز اللاعبين الهجومية (5 دقائق)\n2. يؤدي التمرير بيد واحدة من مستوى الكتف واستلامه (10 دقائق)\n3. يميز متى يستخدم التمرير من الكتف (الهجوم الخاطف، المسافات المتوسطة والطويلة) (5 دقائق)\n4. يتعرف النقاط الفنية للمحاورة مع تغيير الاتجاه والارتكاز (5 دقائق)\n5. يؤدي المحاورة مع تغيير الاتجاه وتبديل اليدين والارتكاز الأمامي (10 دقائق)\n6. يطبق قاعدة قدم الارتكاز (عدم تحريكها قبل التنطيط) (5 دقائق)\n\nالحصة 2:\n1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (5 دقائق)\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام (10 دقائق)\n3. يميز الأخطاء الشائعة في التصويبة السلمية ويصححها (5 دقائق)\n4. يؤدي التمرير من الكتف والمحاورة والارتكاز والتصويبة السلمية في محطات (10 دقائق)\n5. يطبق القواعد ومراكز اللاعبين في مباراة مصغرة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة كرة السلة بروح رياضية (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: أطواق\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: سلال\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة السلة\n- مراكز اللاعبين\n- صانع اللعب\n- التمرير من الكتف\n- الهجوم الخاطف\n- المحاورة مع تغيير الاتجاه\n- الارتكاز\n- قدم الارتكاز\n- تبديل اليدين\n\nالحصة 2:\n- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة\n- المحطات\n- المباراة\n- المراكز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة فريق كرة سلة ويسأل: ما دور صانع اللعب؟ ويشرح القواعد والمراكز الخمسة (ص 107-109، 112).\n\nالحصة 2:\nيراجع المعلم التصويبة السلمية من الصف السادس ويسأل: كم خطوة قبل الارتقاء؟ ويعرض النقاط الفنية (ص 111).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد المبسطة ومراكز اللاعبين (صانع اللعب، مساعده، الجناح، الجناح القوي، الارتكاز)، ثم يؤدي نموذج التمرير بيد واحدة من الكتف (قدم متقدمة، رفع الكرة لمستوى الكتف واليد خلفها، مد الذراع ودفع الكرة نحو الزميل)، فتطبيق موجه، ويستمع الطالب ويقلد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 1 ص 115: صفان متقابلان تبادل التمرير من الكتف، ثم زيادة المسافة إلى 6 م، ثم التمرير أثناء الجري، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الهجوم الخاطف): مجموعتان، إيصال الكرة إلى الطرف الآخر بأقل عدد من التمريرات من الكتف، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: محاورة بدفع الكرة بالأصابع والنظر للأمام، تغيير الاتجاه بتبديل اليدين أو الارتكاز الخلفي، ثم الارتكاز الأمامي (ثبات قدم الارتكاز وتحريك القدم الأخرى للأمام للحماية)، مع قاعدة قدم الارتكاز، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات 2-3 ص 115: قطارات المحاورة والدوران حول الأطواق مع تغيير اليدين، ثم قطاران متقابلان التحرك بالتنطيط وأداء الارتكاز الأمامي بقدم الارتكاز داخل الطوق ثم التمرير، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (قطع الكرة) بالمحاورة في مربع، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع الركبة اليمنى ورفع الكرة باليد اليمنى والتصويب على اللوحة، الهبوط بتوازن؛ ثم تطبيق موجه بالخطوات داخل الأطواق، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 4-5 ص 115-116: قطارات التصويبة السلمية بعد المحاورة من الجانب الأيمن ثم الأيسر، ثم بعد الاستلام من الزميل، ويعد القائد الإصابات، ويتدرب الطالب ويعد (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: تتابع التصويبة السلمية بين المجموعات ونقاط للإصابات، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط المحطات ص 117: التمرير من الكتف لأبعد مسافة، المحاورة حول الأطواق والارتكاز، التصويبة السلمية، التصويب من الثبات، مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباراة ص 118: 5 ضد 5 بتوزيع المراكز وحكام من الطلبة، 5 دقائق لكل مباراة، ويلعب الطالب ويحكم (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى استخدمتم التمرير من الكتف في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – تمريرات التكافل: يمرر الطلبة الكرة بيد واحدة من مستوى الكتف، ومع كل تمريرة ناجحة يذكرون صورة من التكافل في عمان كالمساعدة في الأعراس والحصاد ومواساة الجيران (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): متى نستخدم التمرير بيد واحدة من الكتف؟\nالإجابة: للمسافات المتوسطة والطويلة وفي الهجوم الخاطف.\nس2 (مستوى التطبيق): ما واجب صانع اللعب؟\nالإجابة: يقود الهجوم ويمرر ويصوب من بعيد ويتخذ القرارات.\nس3 (مستوى الاستدلال): كم مركزًا هجوميًا في كرة السلة؟\nالإجابة: خمسة.\n\nس4 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم الثابتة التي لا يجوز تحريكها قبل التنطيط أو التمرير.\nس5 (مستوى التطبيق): كيف نغير الاتجاه أثناء المحاورة؟\nالإجابة: بتبديل اليدين أو الارتكاز الخلفي.\nس6 (مستوى الاستدلال): لماذا نؤدي الارتكاز الأمامي؟\nالإجابة: لحماية الكرة من المدافع والاستعداد للتمرير أو التصويب.\n\nالحصة 2:\nس1 (مستوى المعرفة): كم خطوة قبل الارتقاء في التصويبة السلمية؟\nالإجابة: خطوتان.\nس2 (مستوى التطبيق): بأي ركبة نرتقي عند التصويب باليد اليمنى؟\nالإجابة: نرفع الركبة اليمنى ونرتقي باليسرى.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: بعد المحاورة نحو السلة أو الاستلام قرب السلة.\n\nس4 (مستوى المعرفة): اذكر مركزًا لعبت فيه وواجبه.\nالإجابة: يذكر.\nس5 (مستوى التطبيق): في أي محطة استخدمنا الأطواق؟\nالإجابة: المحاورة والارتكاز.\nس6 (مستوى الاستدلال): متى استخدمت التصويبة السلمية في المباراة؟\nالإجابة: بعد المحاورة نحو السلة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ التمرير من الكتف لزميلك على بعد 6 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر مركزين من مراكز اللاعبين وواجبيهما.\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): ما الفرق بين التمرير من الكتف والتمريرة الصدرية؟\nالإجابة: من الكتف أقوى وأبعد بيد واحدة، والصدرية سريعة قصيرة باليدين.\n\nس4 (مستوى المعرفة): حاور حول ثلاثة أطواق مع تبديل اليدين ثم أدِّ الارتكاز الأمامي.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما المخالفة عند تحريك قدم الارتكاز؟\nالإجابة: المشي بالكرة (خطوات).\nس6 (مستوى الاستدلال): متى نستخدم الارتكاز الخلفي؟\nالإجابة: لتغيير الاتجاه والابتعاد عن المدافع.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ التصويبة السلمية بعد المحاورة.\nالإجابة: يؤديها.\nس2 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات قبل الارتقاء، ما الخطأ؟\nالإجابة: مخالفة المشي، الصحيح خطوتان.\nس3 (مستوى الاستدلال): لماذا نصوب على اللوحة في التصويبة السلمية؟\nالإجابة: لأنها ترتد إلى السلة بدقة أكبر.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التمرير من الكتف والتصويبة السلمية.\nس5 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عند قرار حكم لم يعجبك؟\nالإجابة: احترمته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على التمرير من الكتف نحو هدف على الحائط (دليل المعلم ص 107-115).\nإرشاد لولي الأمر: شجع طالبك على المحاورة مع تغيير الاتجاه حول عوائق (دليل المعلم ص 110-115).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة في المنزل (دليل المعلم ص 111-116).\nإرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8"}}, {"title": "الاختبار العملي (2)", "unit": "تقويم", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 65-119 (الرياضات والألعاب الحركية 1)", "n": 1, "periods": [{"focus": "اختبار عملي في ألعاب القوى وكرة القدم + اختبار عملي في كرة السلة وسباق التتابع", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الوثب العالي بالطريقة الظهرية من اقتراب منحنٍ قصير (5 دقائق)\n2. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة من الأمام (10 دقائق)\n3. يطبق القواعد القانونية في مواقف مصغرة (5 دقائق)\n4. يؤدي التمرير من الكتف والمحاورة مع تغيير الاتجاه والارتكاز (10 دقائق)\n5. يؤدي التصويبة السلمية بعد المحاورة (5 دقائق)\n6. يؤدي التسليم والتسلم في سباق التتابع داخل المنطقة (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: جهاز الوثب العالي\n- أخرى: مراتب\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- أخرى: استمارة تقويم الأداء\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: عصي التتابع", "المفاهيم": "- الاختبار العملي\n- الوثب العالي\n- كرة القدم\n- كرة السلة\n- التتابع", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات الاختبار ومعاييره.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار فردي: محطة 1 الوثب العالي الظهري من 5 خطوات (3 محاولات)، محطة 2 الجري بالكرة والتصويب بوجه القدم الأمامي + السيطرة بالصدر على كرة مرمية، محطة 3 المحاورة من الأمام ضد مدافع + سؤال قواعد؛ ويرصد المعلم، ويؤدي الطالب عند دوره ويتدرب مستقلًا (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية، ويلعب الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. اختبار فردي: محطة 1 التمرير من الكتف 5 مرات + المحاورة حول الأطواق مع الارتكاز، محطة 2 التصويبة السلمية 5 محاولات، محطة 3 التسليم والتسلم داخل المنطقة في فريق رباعي؛ ويرصد المعلم، ويؤدي الطالب عند دوره ويتدرب مستقلًا (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. لعبة ختامية، ويلعب الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تهدئة وتعزيز وإعلان الإجازة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. غلق الدرس (نشاط ممتع مع المواطنة) – لجنة التحكيم العادلة: تقوم المجموعات بدور لجنة تحكيم في مهرجان رياضي مدرسي، فتقيّم أداء زملائها بالقواعد القانونية بعدل وأمانة، وتعلن النتيجة بروح رياضية (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "س1 (مستوى المعرفة): بأي قدم نرتقي في الوثب العالي الظهري؟\nالإجابة: بالقدم البعيدة عن العارضة.\nس2 (مستوى التطبيق): ماذا نفعل بالصدر لحظة ملامسة الكرة؟\nالإجابة: نسحبه للخلف.\nس3 (مستوى الاستدلال): ما هدف المحاورة؟\nالإجابة: التخلص من المدافع.\n\nس4 (مستوى المعرفة): كم خطوة في التصويبة ال let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
