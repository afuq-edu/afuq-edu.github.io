ية من الوقوف ثم من الصندوق والهبوط على المرتبة (15 دقيقة)\n3. يميز الأخطاء الشائعة في الارتقاء والهبوط (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب الوثب العالي\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- أخرى: حبل مطاطي\n- أخرى: جهاز الوثب العالي", "المفاهيم": "- الاقتراب المنحني\n- الارتقاء\n- الدوران\n- الهبوط على الظهر\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المراحل الفنية ويسأل: كيف نتدرج في تعلم الوثبة بأمان؟ ويعرض التدريبات التعليمية (ص 78-79).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع التمرينات التمهيدية، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات 1-7: الاقتراب المستقيم والوثب المقصي، الجري في مسار منحنٍ بالأقماع، الاقتراب الدائري والوثب بقدم واحدة مع الدوران ربع ثم نصف لفة، الاقتراب المنحني والدوران ولمس الكرة المعلقة، الارتقاء الظهري من الوقوف ثم من الصندوق (مع الحبل المطاطي) والهبوط على المرتبة، ويقلد كل تدريب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بقائد تؤدي التدريبات في محطتين (الاقتراب والدوران، الارتقاء من الصندوق) ويراقب القائد الهبوط على الظهر والكتفين، ويؤدي الطالب ويراقب (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة أخطاء شائعة يعرضها المعلم (الارتقاء بالقدم القريبة، النظر للأسفل) ويقترحون التصحيح، ويحلل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا نبدأ بالوثب المقصي قبل الظهري؟\nالإجابة: للتدرج والأمان وتعلم الارتقاء بقدم واحدة.\nس2 (مستوى التطبيق): ماذا نستخدم بدل العارضة في البداية؟\nالإجابة: الحبل المطاطي.\nس3 (مستوى الاستدلال): كيف نهبط بأمان؟\nالإجابة: على الظهر والكتفين على المرتبة والذقن للصدر.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الاقتراب المنحني من 3-5 خطوات والارتقاء الظهري من الصندوق.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): زميلك يرتقي بالقدم القريبة من العارضة، ما الخطأ وكيف يصحح؟\nالإجابة: يجب الارتقاء بالقدم البعيدة ليدور الجسم.\nس3 (مستوى الاستدلال): لماذا نضع مراتب الوثب العالي خلف العارضة؟\nالإجابة: لامتصاص الهبوط على الظهر بأمان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في الوثب العالي (دليل المعلم ص 78-81).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=6"}}, {"focus": "مسابقة الوثب العالي بالطريقة الظهرية والقواعد القانونية", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الوثب العالي بالطريقة الظهرية من الاقتراب الكامل على ارتفاع مناسب (15 دقيقة)\n2. يطبق القواعد القانونية (الارتقاء بقدم واحدة، ثلاث محاولات، الارتفاع) (15 دقيقة)\n3. يشعر بالثقة أثناء مشاركته في مسابقة الوثب العالي (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: عارضة أو حبل مطاطي\n- أخرى: أقماع\n- أخرى: استمارة تسجيل", "المفاهيم": "- المسابقة\n- المحاولة\n- الارتفاع\n- القواعد القانونية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التدريبات ويعرض قواعد المسابقة (ص 71-72) وينظم الطلبة في مجموعات حسب المستوى.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تدريب 7 ص 79: اقتراب منحنٍ 5 خطوات ووثب ظهري على حبل مطاطي منخفض في مجموعات مع مراقبة القائد، ويتدرب الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ص 80: ثلاث محاولات لكل طالب على ارتفاعات متدرجة، وحكم صغير يرفع العلم، وتسجيل أعلى ارتفاع، ويتسابق الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط تقويمي ص 82: يناقش المعلم الحالات (الارتقاء بالقدمين، إسقاط العارضة) والقرار، ويحلل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي الطالب التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قوس فوق العارضة: تقارن المجموعات بين تقوس الجسم فوق العارضة في الوثب الظهري وأقواس المساجد والقلاع العمانية، ثم تشرح مرحلة الارتقاء ونصف اللفة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم محاولة لكل ارتفاع؟\nالإجابة: ثلاث محاولات.\nس2 (مستوى التطبيق): هل يجوز الارتقاء بالقدمين؟\nالإجابة: لا، بقدم واحدة.\nس3 (مستوى الاستدلال): متى تحتسب المحاولة فاشلة؟\nالإجابة: عند إسقاط العارضة.", "التقويم الختامي": "س1 (مستوى المعرفة): حدد المراحل الفنية لمسابقة الوثب العالي بالطريقة الظهرية.\nالإجابة: الاقتراب المنحني، الارتقاء بالقدم البعيدة، الطيران بالتقوس، الهبوط على الظهر.\nس2 (مستوى التطبيق): أدِّ وثبة ظهرية كاملة على ارتفاع مناسب.\nالإجابة: يؤديها.\nس3 (مستوى الاستدلال): كيف شعرت عندما تجاوزت العارضة؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة وثب عالٍ وتحديد مراحلها، والاطلاع على قواعد كرة القدم (دليل المعلم ص 83-87).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يؤدي الاقتراب المنحني بالأقماع والارتقاء مع الدوران ربع لفة ثم نصف لفة (15 دقيقة)\n2. يؤدي الارتقاء بالطريقة الظهرية من الوقوف ثم من الصندوق والهبوط على المرتبة (15 دقيقة)\n3. يميز الأخطاء الشائعة في الارتقاء والهبوط (10 دقائق)\n\nالحصة 2:\n1. يؤدي الوثب العالي بالطريقة الظهرية من الاقتراب الكامل على ارتفاع مناسب (15 دقيقة)\n2. يطبق القواعد القانونية (الارتقاء بقدم واحدة، ثلاث محاولات، الارتفاع) (15 دقيقة)\n3. يشعر بالثقة أثناء مشاركته في مسابقة الوثب العالي (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب الوثب العالي\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- أخرى: حبل مطاطي\n- أخرى: جهاز الوثب العالي\n\nالحصة 2:\n- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: عارضة أو حبل مطاطي\n- أخرى: أقماع\n- أخرى: استمارة تسجيل", "المفاهيم": "الحصة 1:\n- الاقتراب المنحني\n- الارتقاء\n- الدوران\n- الهبوط على الظهر\n- الأمان\n\nالحصة 2:\n- المسابقة\n- المحاولة\n- الارتفاع\n- القواعد القانونية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم المراحل الفنية ويسأل: كيف نتدرج في تعلم الوثبة بأمان؟ ويعرض التدريبات التعليمية (ص 78-79).\n\nالحصة 2:\nيراجع المعلم التدريبات ويعرض قواعد المسابقة (ص 71-72) وينظم الطلبة في مجموعات حسب المستوى.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم مع التمرينات التمهيدية، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات 1-7: الاقتراب المستقيم والوثب المقصي، الجري في مسار منحنٍ بالأقماع، الاقتراب الدائري والوثب بقدم واحدة مع الدوران ربع ثم نصف لفة، الاقتراب المنحني والدوران ولمس الكرة المعلقة، الارتقاء الظهري من الوقوف ثم من الصندوق (مع الحبل المطاطي) والهبوط على المرتبة، ويقلد كل تدريب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بقائد تؤدي التدريبات في محطتين (الاقتراب والدوران، الارتقاء من الصندوق) ويراقب القائد الهبوط على الظهر والكتفين، ويؤدي الطالب ويراقب (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة أخطاء شائعة يعرضها المعلم (الارتقاء بالقدم القريبة، النظر للأسفل) ويقترحون التصحيح، ويحلل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تدريب 7 ص 79: اقتراب منحنٍ 5 خطوات ووثب ظهري على حبل مطاطي منخفض في مجموعات مع مراقبة القائد، ويتدرب الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ص 80: ثلاث محاولات لكل طالب على ارتفاعات متدرجة، وحكم صغير يرفع العلم، وتسجيل أعلى ارتفاع، ويتسابق الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط تقويمي ص 82: يناقش المعلم الحالات (الارتقاء بالقدمين، إسقاط العارضة) والقرار، ويحلل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي الطالب التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قوس فوق العارضة: تقارن المجموعات بين تقوس الجسم فوق العارضة في الوثب الظهري وأقواس المساجد والقلاع العمانية، ثم تشرح مرحلة الارتقاء ونصف اللفة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): لماذا نبدأ بالوثب المقصي قبل الظهري؟\nالإجابة: للتدرج والأمان وتعلم الارتقاء بقدم واحدة.\nس2 (مستوى التطبيق): ماذا نستخدم بدل العارضة في البداية؟\nالإجابة: الحبل المطاطي.\nس3 (مستوى الاستدلال): كيف نهبط بأمان؟\nالإجابة: على الظهر والكتفين على المرتبة والذقن للصدر.\n\nالحصة 2:\nس1 (مستوى المعرفة): كم محاولة لكل ارتفاع؟\nالإجابة: ثلاث محاولات.\nس2 (مستوى التطبيق): هل يجوز الارتقاء بالقدمين؟\nالإجابة: لا، بقدم واحدة.\nس3 (مستوى الاستدلال): متى تحتسب المحاولة فاشلة؟\nالإجابة: عند إسقاط العارضة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الاقتراب المنحني من 3-5 خطوات والارتقاء الظهري من الصندوق.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): زميلك يرتقي بالقدم القريبة من العارضة، ما الخطأ وكيف يصحح؟\nالإجابة: يجب الارتقاء بالقدم البعيدة ليدور الجسم.\nس3 (مستوى الاستدلال): لماذا نضع مراتب الوثب العالي خلف العارضة؟\nالإجابة: لامتصاص الهبوط على الظهر بأمان.\n\nالحصة 2:\nس1 (مستوى المعرفة): حدد المراحل الفنية لمسابقة الوثب العالي بالطريقة الظهرية.\nالإجابة: الاقتراب المنحني، الارتقاء بالقدم البعيدة، الطيران بالتقوس، الهبوط على الظهر.\nس2 (مستوى التطبيق): أدِّ وثبة ظهرية كاملة على ارتفاع مناسب.\nالإجابة: يؤديها.\nس3 (مستوى الاستدلال): كيف شعرت عندما تجاوزت العارضة؟\nالإجابة: يعبر عن الثقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في الوثب العالي (دليل المعلم ص 78-81).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة وثب عالٍ وتحديد مراحلها، والاطلاع على قواعد كرة القدم (دليل المعلم ص 83-87).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=6"}}, {"title": "لعبة كرة القدم", "unit": "الرياضات والألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 83-95", "n": 6, "periods": [{"focus": "القواعد القانونية ومراكز اللاعبين وتمرينات الإحساس بالكرة", "num": 1, "fields": {"المخرجات التعليمية": "1. يحدد بعض القواعد القانونية للعبة كرة القدم (10 دقائق)\n2. يميز بين مراكز اللعب (حارس، دفاع، وسط، هجوم) وواجباتها (10 دقائق)\n3. يؤدي تمرينات الإحساس بالكرة (سحب الكرة، نقلها بين القدمين، تنطيطها بالقدم والفخذ) (20 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة القدم\n- مراكز اللاعبين\n- طريقة اللعب 4-4-2\n- الإحساس بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ملعب بتوزيع 4-4-2 ويسأل: ما دور كل مركز؟ ويشرح القواعد الأساسية (ص 84-85).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (الملعب، 11 لاعبًا، التسلل مبسطًا، الركلات) ومراكز اللاعبين (ص 88)، ثم يؤدي نماذج الإحساس بالكرة ص 89: سحب الكرة بأسفل القدم للخلف، نقلها بين القدمين بباطن القدم، ركلها بوجه القدم الأمامي ورفعها، تنطيطها بالقدم والفخذ، المشي بالكرة بين رأسي الزميلين، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الإحساس بالكرة بأربع مجموعات مع التبديل، وفي كل محطة بطاقة مركز يشرح القائد واجبه، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أين مركزي؟): ينادي المعلم مركزًا فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر، ويلعب الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم لاعبًا في فريق كرة القدم؟\nالإجابة: 11 لاعبًا.\nس2 (مستوى التطبيق): ما واجب لاعبي خط الدفاع؟\nالإجابة: منع المنافس من التسجيل بقطع التمريرات واستخلاص الكرة ثم بناء الهجوم.\nس3 (مستوى الاستدلال): اذكر تمرينًا للإحساس بالكرة.\nالإجابة: نقل الكرة بين القدمين بباطن القدم.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر مراكز اللعب في طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (مستوى التطبيق): أدِّ تنطيط الكرة بالقدم 5 مرات.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): لماذا تهم تمرينات الإحساس بالكرة قبل المهارات؟\nالإجابة: لأنها تنمي التحكم في الكرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تنطيط الكرة بالقدم والفخذ يوميًا (دليل المعلم ص 84-89).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"focus": "ركل الكرة بوجه القدم الأمامي (التصويب)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية لركل الكرة بوجه القدم الأمامي (10 دقائق)\n2. يؤدي ركل الكرة الثابتة والمتحركة بوجه القدم الأمامي نحو المرمى (20 دقيقة)\n3. يميز بين الركل بوجه القدم الأمامي وبباطن القدم من حيث الاستخدام (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- صورة توضيحية", "المفاهيم": "- وجه القدم الأمامي\n- التصويب\n- القدم المرتكزة\n- متابعة الحركة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الإحساس بالكرة ويسأل: بأي جزء نصوب بقوة من مسافة بعيدة؟ ويعرض الركل بوجه القدم الأمامي (ص 86).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: اقتراب مائل، القدم المرتكزة بجانب الكرة، مرجحة الرجل الراكلة من الورك، ضرب الكرة بوجه القدم الأمامي ومشط القدم مشدود لأسفل، متابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 1-2 ص 90: صفان متقابلان (ثنائيات) مسك الكرة ولمسها بوجه القدم الأمامي ثم الركل، ثم قطاران الجري بالكرة ثم ركلها بوجه القدم الأمامي للتصويب نحو المرمى، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة التصويب: نقاط للأهداف من مسافة 12 م، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة.\nس2 (مستوى التطبيق): كيف يكون مشط القدم عند الركل بوجه القدم الأمامي؟\nالإجابة: مشدودًا لأسفل.\nس3 (مستوى الاستدلال): متى نستخدم الركل بوجه القدم الأمامي؟\nالإجابة: للتصويب القوي والتمرير الطويل.", "التقويم الختامي": "س1 (مستوى المعرفة): صوب بوجه القدم الأمامي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الركل بوجه القدم الأمامي وبباطن القدم؟\nالإجابة: الأمامي للقوة والمسافة، والباطن للدقة القصيرة.\nس3 (مستوى الاستدلال): لماذا نتابع الحركة بعد الركل؟\nالإجابة: لزيادة القوة والدقة والاتزان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التصويب على هدف بوجه القدم الأمامي في مكان آمن (دليل المعلم ص 86-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"focus": "السيطرة على الكرة العالية بالصدر", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للسيطرة على الكرة العالية بالصدر (10 دقائق)\n2. يؤدي استلام الكرة العالية بالصدر وإسقاطها أمامه (20 دقيقة)\n3. يختار جزء الجسم المناسب للسيطرة على الكرة حسب ارتفاعها (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- السيطرة على الكرة\n- الصدر\n- امتصاص الكرة\n- الكرة العالية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الاستلام بالفخذ وبوجه القدم من الصف السادس ويسأل: كيف نسيطر على كرة فوق مستوى الصدر؟ (ص 86).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف مواجه للكرة مع تباعد القدمين، ثني الركبتين قليلًا، ميل الجسم للخلف وتقديم الصدر، ثم سحب الصدر لحظة ملامسة الكرة لامتصاصها وإسقاطها أمام القدمين، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 90: ثنائيات، يرمي أحدهما الكرة عالية ويستلمها الآخر بالصدر ثم يمررها بباطن القدم، ثم ثلاثيات في مثلث، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (3 لمسات): مجموعات تمرر الكرة عالية ويجب السيطرة بالصدر قبل التمرير، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ماذا نفعل بالصدر لحظة ملامسة الكرة؟\nالإجابة: نسحبه للخلف لامتصاص قوتها.\nس2 (مستوى التطبيق): أين تسقط الكرة بعد السيطرة بالصدر؟\nالإجابة: أمام القدمين.\nس3 (مستوى الاستدلال): متى نستخدم الصدر في السيطرة؟\nالإجابة: للكرات العالية فوق مستوى الصدر.", "التقويم الختامي": "س1 (مستوى المعرفة): استلم الكرة العالية بالصدر ومررها لزميلك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الفخذ، بأي جزء تسيطر عليها؟\nالإجابة: بأعلى الفخذ.\nس3 (مستوى الاستدلال): ما سبب ارتداد الكرة بعيدًا عند السيطرة بالصدر؟\nالإجابة: عدم سحب الصدر للخلف لحظة الملامسة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالصدر (دليل المعلم ص 86-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"focus": "المحاورة من الأمام (بالتمويه للجانب)", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف أنواع المحاورة ونقاط المحاورة من الأمام (10 دقائق)\n2. يؤدي المحاورة من الأمام بالتمويه للجانب لتجاوز مدافع (20 دقيقة)\n3. يختار توقيت المحاورة حسب استجابة المدافع (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة", "المفاهيم": "- المحاورة\n- التمويه\n- المدافع\n- المهاجم\n- تغيير الاتجاه", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم السيطرة ويسأل: كيف نتخلص من مدافع يواجهنا؟ ويعرض المحاورة من الأمام (ص 87).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة مع تغيير الاتجاه، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاقتراب من المدافع بالكرة، حركة خداعية للجانب بميل الجسم، وعند استجابة المدافع المرور بالكرة في الاتجاه الآخر بوجه القدم الخارجي وزيادة السرعة، ثم تطبيق موجه مع قمع ثم مدافع سلبي، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 4 ص 90: قطاران متقابلان بينهما 10 م، الجري بالكرة ومحاورة الزميل (مدافع سلبي ثم نشط) والتمرير للقطار المقابل، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (1 ضد 1) في مربع صغير مع هدفين من الأقماع، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما هدف المحاورة؟\nالإجابة: التخلص من المنافس للوصول إلى مكان مناسب للتمرير أو التصويب.\nس2 (مستوى التطبيق): ماذا نفعل عند استجابة المدافع للخداع؟\nالإجابة: نمر بالكرة في الاتجاه الآخر بسرعة.\nس3 (مستوى الاستدلال): اذكر أنواع المحاورة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.", "التقويم الختامي": "س1 (مستوى المعرفة): راوغ المدافع بالتمويه للجانب واعبر بالكرة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): متى يفشل التمويه؟\nالإجابة: إذا لم يستجب المدافع أو كان بطيئًا في تغيير الاتجاه.\nس3 (مستوى الاستدلال): لماذا نزيد السرعة بعد المرور من المدافع؟\nالإجابة: حتى لا يلحق بنا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يتدرب على التمويه (دليل المعلم ص 87-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"focus": "محطات مهارات كرة القدم ومنافساتها", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة في محطات (20 دقيقة)\n2. يوظف المهارات في منافسات مصغرة (10 دقائق)\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "- المحطات\n- التصويب\n- السيطرة\n- المحاورة\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 91-92: محطة التصويب بوجه القدم الأمامي بعد الجري بالكرة، محطة السيطرة بالصدر والتمرير، محطة المحاورة من الأمام ضد مدافع، محطة الإحساس بالكرة، مع التبديل، ويؤدي الطالب ويبدل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 93: 3 ضد 3 في مربع بمرميين صغيرين، شرط السيطرة قبل التصويب، ويتسابق الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجحت المحاورة ومتى فشلت؟ ليستنتج الطلبة أهمية التوقيت، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما شرط التصويب في منافسة اليوم؟\nالإجابة: السيطرة على الكرة أولًا.\nس2 (مستوى التطبيق): في أي محطة استخدمنا الصدر؟\nالإجابة: محطة السيطرة بالصدر.\nس3 (مستوى الاستدلال): ما أهمية التوقيت في المحاورة؟\nالإجابة: لتجاوز المدافع لحظة استجابته للخداع.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب والمحاورة.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 91-93).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"focus": "مباراة كرة القدم وتطبيق القواعد ومراكز اللاعبين", "num": 6, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية في مباراة كرة القدم (15 دقيقة)\n2. يلعب في مركز محدد ويؤدي واجباته (15 دقيقة)\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المباراة\n- مراكز اللاعبين\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد والمراكز ويقسم الفرق (7 لاعبين) ويوزع المراكز ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يخطط كل فريق توزيع مراكزه وطريقة لعبه في مجموعة بأدوار (قائد، حارس، دفاع، وسط، هجوم)، ويخطط الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات ص 93-94: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تطبيق القواعد وتبديل المراكز في الشوط الثاني، ويلعب الطالب ويحكم (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: كيف أثر الالتزام بالمراكز في الفريق؟ ليستنتج الطلبة أهمية التنظيم، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – فريق اسمه عمان: تربط المجموعات مراكز كرة القدم (حارس، دفاع، وسط، هجوم) بأدوار أفراد المجتمع العماني كالمعلم والطبيب والمزارع، وتشرح أن لكل دور واجبًا يخدم الفريق (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "التقويم التكويني": "س1 (مستوى المعرفة): ما واجب لاعب الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\nس2 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس3 (مستوى الاستدلال): لماذا نلتزم بمراكزنا؟\nالإجابة: لتنظيم الفريق وتغطية الملعب.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (مستوى التطبيق): ما المركز الذي لعبت فيه وما واجبك؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تصرفت عندما أخطأ زميلك في التمرير؟\nالإجابة: شجعته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، والاطلاع على قواعد كرة السلة (دليل المعلم ص 106-110).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يحدد بعض القواعد القانونية للعبة كرة القدم (10 دقائق)\n2. يميز بين مراكز اللعب (حارس، دفاع، وسط، هجوم) وواجباتها (10 دقائق)\n3. يؤدي تمرينات الإحساس بالكرة (سحب الكرة، نقلها بين القدمين، تنطيطها بالقدم والفخذ) (20 دقيقة)\n\nالحصة 2:\n1. يتعرف النقاط الفنية لركل الكرة بوجه القدم الأمامي (10 دقائق)\n2. يؤدي ركل الكرة الثابتة والمتحركة بوجه القدم الأمامي نحو المرمى (20 دقيقة)\n3. يميز بين الركل بوجه القدم الأمامي وبباطن القدم من حيث الاستخدام (10 دقائق)\n\nالحصة 3:\n1. يتعرف النقاط الفنية للسيطرة على الكرة العالية بالصدر (10 دقائق)\n2. يؤدي استلام الكرة العالية بالصدر وإسقاطها أمامه (20 دقيقة)\n3. يختار جزء الجسم المناسب للسيطرة على الكرة حسب ارتفاعها (10 دقائق)\n\nالحصة 4:\n1. يتعرف أنواع المحاورة ونقاط المحاورة من الأمام (10 دقائق)\n2. يؤدي المحاورة من الأمام بالتمويه للجانب لتجاوز مدافع (20 دقيقة)\n3. يختار توقيت المحاورة حسب استجابة المدافع (10 دقائق)\n\nالحصة 5:\n1. يؤدي الركل بوجه القدم الأمامي والسيطرة بالصدر والمحاورة في محطات (20 دقيقة)\n2. يوظف المهارات في منافسات مصغرة (10 دقائق)\n3. يتعاون مع مجموعته ويلتزم بقواعد المحطات (10 دقائق)\n\nالحصة 6:\n1. يطبق القواعد القانونية في مباراة كرة القدم (15 دقيقة)\n2. يلعب في مركز محدد ويؤدي واجباته (15 دقيقة)\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخر ة 4:\nيراجع المعلم السيطرة ويسأل: كيف نتخلص من مدافع يواجهنا؟ ويعرض المحاورة من الأمام (ص 87).\n\nالحصة 5:\nيراجع المعلم المهارات الثلاث بنموذج طلبة ويعرض المحطات.\n\nالحصة 6:\nيراجع المعلم القواعد والمراكز ويقسم الفرق (7 لاعبين) ويوزع المراكز ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (الملعب، 11 لاعبًا، التسلل مبسطًا، الركلات) ومراكز اللاعبين (ص 88)، ثم يؤدي نماذج الإحساس بالكرة ص 89: سحب الكرة بأسفل القدم للخلف، نقلها بين القدمين بباطن القدم، ركلها بوجه القدم الأمامي ورفعها، تنطيطها بالقدم والفخذ، المشي بالكرة بين رأسي الزميلين، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الإحساس بالكرة بأربع مجموعات مع التبديل، وفي كل محطة بطاقة مركز يشرح القائد واجبه، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أين مركزي؟): ينادي المعلم مركزًا فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر، ويلعب الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: اقتراب مائل، القدم المرتكزة بجانب الكرة، مرجحة الرجل الراكلة من الورك، ضرب الكرة بوجه القدم الأمامي ومشط القدم مشدود لأسفل، متابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 1-2 ص 90: صفان متقابلان (ثنائيات) مسك الكرة ولمسها بوجه القدم الأمامي ثم الركل، ثم قطاران الجري بالكرة ثم ركلها بوجه القدم الأمامي للتصويب نحو المرمى، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة التصويب: نقاط للأهداف من مسافة 12 م، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: وقوف مواجه للكرة مع تباعد القدمين، ثني الركبتين قليلًا، ميل الجسم للخلف وتقديم الصدر، ثم سحب الصدر لحظة ملامسة الكرة لامتصاصها وإسقاطها أمام القدمين، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 90: ثنائيات، يرمي أحدهما الكرة عالية ويستلمها الآخر بالصدر ثم يمررها بباطن القدم، ثم ثلاثيات في مثلث، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (3 لمسات): مجموعات تمرر الكرة عالية ويجب السيطرة بالصدر قبل التمرير، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة مع تغيير الاتجاه، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاقتراب من المدافع بالكرة، حركة خداعية للجانب بميل الجسم، وعند استجابة المدافع المرور بالكرة في الاتجاه الآخر بوجه القدم الخارجي وزيادة السرعة، ثم تطبيق موجه مع قمع ثم مدافع سلبي، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 4 ص 90: قطاران متقابلان بينهما 10 م، الجري بالكرة ومحاورة الزميل (مدافع سلبي ثم نشط) والتمرير للقطار المقابل، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (1 ضد 1) في مربع صغير مع هدفين من الأقماع، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 5 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 91-92: محطة التصويب بوجه القدم الأمامي بعد الجري بالكرة، محطة السيطرة بالصدر والتمرير، محطة المحاورة من الأمام ضد مدافع، محطة الإحساس بالكرة، مع التبديل، ويؤدي الطالب ويبدل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 93: 3 ضد 3 في مربع بمرميين صغيرين، شرط السيطرة قبل التصويب، ويتسابق الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجحت المحاورة ومتى فشلت؟ ليستنتج الطلبة أهمية التوقيت، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 6 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يخطط كل فريق توزيع مراكزه وطريقة لعبه في مجموعة بأدوار (قائد، حارس، دفاع، وسط، هجوم)، ويخطط الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات ص 93-94: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تطبيق القواعد وتبديل المراكز في الشوط الثاني، ويلعب الطالب ويحكم (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: كيف أثر الالتزام بالمراكز في الفريق؟ ليستنتج الطلبة أهمية التنظيم، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – فريق اسمه عمان: تربط المجموعات مراكز كرة القدم (حارس، دفاع، وسط، هجوم) بأدوار أفراد المجتمع العماني كالمعلم والطبيب والمزارع، وتشرح أن لكل دور واجبًا يخدم الفريق (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كم لاعبًا في فريق كرة القدم؟\nالإجابة: 11 لاعبًا.\nس2 (مستوى التطبيق): ما واجب لاعبي خط الدفاع؟\nالإجابة: منع المنافس من التسجيل بقطع التمريرات واستخلاص الكرة ثم بناء الهجوم.\nس3 (مستوى الاستدلال): اذكر تمرينًا للإحساس بالكرة.\nالإجابة: نقل الكرة بين القدمين بباطن القدم.\n\nالحصة 2:\nس1 (مستوى المعرفة): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة.\nس2 (مستوى التطبيق): كيف يكون مشط القدم عند الركل بوجه القدم الأمامي؟\nالإجابة: مشدودًا لأسفل.\nس3 (مستوى الاستدلال): متى نستخدم الركل بوجه القدم الأمامي؟\nالإجابة: للتصويب القوي والتمرير الطويل.\n\nالحصة 3:\nس1 (مستوى المعرفة): ماذا نفعل بالصدر لحظة ملامسة الكرة؟\nالإجابة: نسحبه للخلف لامتصاص قوتها.\nس2 (مستوى التطبيق): أين تسقط الكرة بعد السيطرة بالصدر؟\nالإجابة: أمام القدمين.\nس3 (مستوى الاستدلال): متى نستخدم الصدر في السيطرة؟\nالإجابة: للكرات العالية فوق مستوى الصدر.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما هدف المحاورة؟\nالإجابة: التخلص من المنافس للوصول إلى مكان مناسب للتمرير أو التصويب.\nس2 (مستوى التطبيق): ماذا نفعل عند استجابة المدافع للخداع؟\nالإجابة: نمر بالكرة في الاتجاه الآخر بسرعة.\nس3 (مستوى الاستدلال): اذكر أنواع المحاورة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.\n\nالحصة 5:\nس1 (مستوى المعرفة): ما شرط التصويب في منافسة اليوم؟\nالإجابة: السيطرة على الكرة أولًا.\nس2 (مستوى التطبيق): في أي محطة استخدمنا الصدر؟\nالإجابة: محطة السيطرة بالصدر.\nس3 (مستوى الاستدلال): ما أهمية التوقيت في المحاورة؟\nالإجابة: لتجاوز المدافع لحظة استجابته للخداع.\n\nالحصة 6:\nس1 (مستوى المعرفة): ما واجب لاعب الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\nس2 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.\nس3 (مستوى الاستدلال): لماذا نلتزم بمراكزنا؟\nالإجابة: لتنظيم الفريق وتغطية الملعب.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر مراكز اللعب في طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (مستوى التطبيق): أدِّ تنطيط الكرة بالقدم 5 مرات.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): لماذا تهم تمرينات الإحساس بالكرة قبل المهارات؟\nالإجابة: لأنها تنمي التحكم في الكرة.\n\nالحصة 2:\nس1 (مستوى المعرفة): صوب بوجه القدم الأمامي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الركل بوجه القدم الأمامي وبباطن القدم؟\nالإجابة: الأمامي للقوة والمسافة، والباطن للدقة القصيرة.\nس3 (مستوى الاستدلال): لماذا نتابع الحركة بعد الركل؟\nالإجابة: لزيادة القوة والدقة والاتزان.\n\nالحصة 3:\nس1 (مستوى المعرفة): استلم الكرة العالية بالصدر ومررها لزميلك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الفخذ، بأي جزء تسيطر عليها؟\nالإجابة: بأعلى الفخذ.\nس3 (مستوى الاستدلال): ما سبب ارتداد الكرة بعيدًا عند السيطرة بالصدر؟\nالإجابة: عدم سحب الصدر للخلف لحظة الملامسة.\n\nالحصة 4:\nس1 (مستوى المعرفة): راوغ المدافع بالتمويه للجانب واعبر بالكرة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): متى يفشل التمويه؟\nالإجابة: إذا لم يستجب المدافع أو كان بطيئًا في تغيير الاتجاه.\nس3 (مستوى الاستدلال): لماذا نزيد السرعة بعد المرور من المدافع؟\nالإجابة: حتى لا يلحق بنا.\n\nالحصة 5:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب والمحاورة.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nالحصة 6:\nس1 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (مستوى التطبيق): ما المركز الذي لعبت فيه وما واجبك؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تصرفت عندما أخطأ زميلك في التمرير؟\nالإجابة: شجعته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تنطيط الكرة بالقدم والفخذ يوميًا (دليل المعلم ص 84-89).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التصويب على هدف بوجه القدم الأمامي في مكان آمن (دليل المعلم ص 86-90).\n\nالحصة 3:\nإرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالصدر (دليل المعلم ص 86-90).\n\nالحصة 4:\nإرشاد لولي الأمر: العب مع طالبك دور المدافع ودعه يتدرب على التمويه (دليل المعلم ص 87-90).\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 91-93).\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، والاطلاع على قواعد كرة السلة (دليل المعلم ص 106-110).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=7"}}, {"title": "لعبة كرة السلة", "unit": "الرياضات والألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 106-119", "n": 4, "periods": [{"focus": "القواعد القانونية ومراكز اللاعبين والتمرير بيد واحدة من مستوى الكتف", "num": 1, "fields": {"المخرجات التعليمية": "1. يحدد بعض القواعد القانونية لكرة السلة ومراكز اللاعبين الهجومية (10 دقائق)\n2. يؤدي التمرير بيد واحدة من مستوى الكتف واستلامه (15 دقيقة)\n3. يميز متى يستخدم التمرير من الكتف (الهجوم الخاطف، المسافات المتوسطة والطويلة) (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة السلة\n- مراكز اللاعبين\n- صانع اللعب\n- التمرير من الكتف\n- الهجوم الخاطف", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة فريق كرة سلة ويسأل: ما دور صانع اللعب؟ ويشرح القواعد والمراكز الخمسة (ص 107-109، 112).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد المبسطة ومراكز اللاعبين (صانع اللعب، مساعده، الجناح، الجناح القوي، الارتكاز)، ثم يؤدي نموذج التمرير بيد واحدة من الكتف (قدم متقدمة، رفع الكرة لمستوى الكتف واليد خلفها، مد الذراع ودفع الكرة نحو الزميل)، فتطبيق موجه، ويستمع الطالب ويقلد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 1 ص 115: صفان متقابلان تبادل التمرير من الكتف، ثم زيادة المسافة إلى 6 م، ثم التمرير أثناء الجري، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الهجوم الخاطف): مجموعتان، إيصال الكرة إلى الطرف الآخر بأقل عدد من التمريرات من الكتف، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): متى نستخدم التمرير بيد واحدة من الكتف؟\nالإجابة: للمسافات المتوسطة والطويلة وفي الهجوم الخاطف.\nس2 (مستوى التطبيق): ما واجب صانع اللعب؟\nالإجابة: يقود الهجوم ويمرر ويصوب من بعيد ويتخذ القرارات.\nس3 (مستوى الاستدلال): كم مركزًا هجوميًا في كرة السلة؟\nالإجابة: خمسة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التمرير من الكتف لزميلك على بعد 6 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر مركزين من مراكز اللاعبين وواجبيهما.\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): ما الفرق بين التمرير من الكتف والتمريرة الصدرية؟\nالإجابة: من الكتف أقوى وأبعد بيد واحدة، والصدرية سريعة قصيرة باليدين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التمرير من الكتف نحو هدف على الحائط (دليل المعلم ص 107-115).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8"}}, {"focus": "المحاورة مع تغيير الاتجاه وحركات القدمين (الارتكاز)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للمحاورة مع تغيير الاتجاه والارتكاز (10 دقائق)\n2. يؤدي المحاورة مع تغيير الاتجاه وتبديل اليدين والارتكاز الأمامي (20 دقيقة)\n3. يطبق قاعدة قدم الارتكاز (عدم تحريكها قبل التنطيط) (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- المحاورة مع تغيير الاتجاه\n- الارتكاز\n- قدم الارتكاز\n- تبديل اليدين", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمرير ويسأل: كيف نتحرك بالكرة ونغير اتجاهنا دون مخالفة؟ ويعرض المحاورة والارتكاز (ص 110-111).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة بالتنطيط، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: محاورة بدفع الكرة بالأصابع والنظر للأمام، تغيير الاتجاه بتبديل اليدين أو الارتكاز الخلفي، ثم الارتكاز الأمامي (ثبات قدم الارتكاز وتحريك القدم الأخرى للأمام للحماية)، مع قاعدة قدم الارتكاز، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 2-3 ص 115: قطارات المحاورة والدوران حول الأطواق مع تغيير اليدين، ثم قطاران متقابلان التحرك بالتنطيط وأداء الارتكاز الأمامي بقدم الارتكاز داخل الطوق ثم التمرير، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (قطع الكرة) بالمحاورة في مربع، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم الثابتة التي لا يجوز تحريكها قبل التنطيط أو التمرير.\nس2 (مستوى التطبيق): كيف نغير الاتجاه أثناء المحاورة؟\nالإجابة: بتبديل اليدين أو الارتكاز الخلفي.\nس3 (مستوى الاستدلال): لماذا نؤدي الارتكاز الأمامي؟\nالإجابة: لحماية الكرة من المدافع والاستعداد للتمرير أو التصويب.", "التقويم الختامي": "س1 (مستوى المعرفة): حاور حول ثلاثة أطواق مع تبديل اليدين ثم أدِّ الارتكاز الأمامي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما المخالفة عند تحريك قدم الارتكاز؟\nالإجابة: المشي بالكرة (خطوات).\nس3 (مستوى الاستدلال): متى نستخدم الارتكاز الخلفي؟\nالإجابة: لتغيير الاتجاه والابتعاد عن المدافع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على المحاورة مع تغيير الاتجاه حول عوائق (دليل المعلم ص 110-115).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8"}}, {"focus": "التصويبة السلمية", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (10 دقائق)\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام (20 دقيقة)\n3. يميز الأخطاء الشائعة في التصويبة السلمية ويصححها (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التصويبة السلمية من الصف السادس ويسأل: كم خطوة قبل الارتقاء؟ ويعرض النقاط الفنية (ص 111).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع الركبة اليمنى ورفع الكرة باليد اليمنى والتصويب على اللوحة، الهبوط بتوازن؛ ثم تطبيق موجه بالخطوات داخل الأطواق، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 4-5 ص 115-116: قطارات التصويبة السلمية بعد المحاورة من الجانب الأيمن ثم الأيسر، ثم بعد الاستلام من الزميل، ويعد القائد الإصابات، ويتدرب الطالب ويعد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: تتابع التصويبة السلمية بين المجموعات ونقاط للإصابات، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم خطوة قبل الارتقاء في التصويبة السلمية؟\nالإجابة: خطوتان.\nس2 (مستوى التطبيق): بأي ركبة نرتقي عند التصويب باليد اليمنى؟\nالإجابة: نرفع الركبة اليمنى ونرتقي باليسرى.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: بعد المحاورة نحو السلة أو الاستلام قرب السلة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التصويبة السلمية بعد المحاورة.\nالإجابة: يؤديها.\nس2 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات قبل الارتقاء، ما الخطأ؟\nالإجابة: مخالفة المشي، الصحيح خطوتان.\nس3 (مستوى الاستدلال): لماذا نصوب على اللوحة في التصويبة السلمية؟\nالإجابة: لأنها ترتد إلى السلة بدقة أكبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة في المنزل (دليل المعلم ص 111-116).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8"}}, {"focus": "محطات مهارات كرة السلة ومباراة تطبيقية", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي التمرير من الكتف والمحاورة والارتكاز والتصويبة السلمية في محطات (20 دقيقة)\n2. يطبق القواعد ومراكز اللاعبين في مباراة مصغرة (10 دقائق)\n3. يستمتع بمشاركة زملائه ممارسة كرة السلة بروح رياضية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: صدريات ملونة", "المفاهيم": "- المحطات\n- المباراة\n- المراكز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات والقواعد ويعرض المحطات ثم تنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط المحطات ص 117: التمرير من الكتف لأبعد مسافة، المحاورة حول الأطواق والارتكاز، التصويبة السلمية، التصويب من الثبات، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباراة ص 118: 5 ضد 5 بتوزيع المراكز وحكام من الطلبة، 5 دقائق لكل مباراة، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى استخدمتم التمرير من الكتف في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تمريرات التكافل: يمرر الطلبة الكرة بيد واحدة من مستوى الكتف، ومع كل تمريرة ناجحة يذكرون صورة من التكافل في عمان كالمساعدة في الأعراس والحصاد ومواساة الجيران (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر مركزًا لعبت فيه وواجبه.\nالإجابة: يذكر.\nس2 (مستوى التطبيق): في أي محطة استخدمنا الأطواق؟\nالإجابة: المحاورة والارتكاز.\nس3 (مستوى الاستدلال): متى استخدمت التصويبة السلمية في المباراة؟\nالإجابة: بعد المحاورة نحو السلة.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التمرير من الكتف والتصويبة السلمية.\nس2 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تصرفت عند قرار حكم لم يعجبك؟\nالإجابة: احترمته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يحدد بعض القواعد القانونية لكرة السلة ومراكز اللاعبين الهجومية (10 دقائق)\n2. يؤدي التمرير بيد واحدة من مستوى الكتف واستلامه (15 دقيقة)\n3. يميز متى يستخدم التمرير من الكتف (الهجوم الخاطف، المسافات المتوسطة والطويلة) (15 دقيقة)\n\nالحصة 2:\n1. يتعرف النقاط الفنية للمحاورة مع تغيير الاتجاه والارتكاز (10 دقائق)\n2. يؤدي المحاورة مع تغيير الاتجاه وتبديل اليدين والارتكاز الأمامي (20 دقيقة)\n3. يطبق قاعدة قدم الارتكاز (عدم تحريكها قبل التنطيط) (10 دقائق)\n\nالحصة 3:\n1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (10 دقائق)\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام (20 دقيقة)\n3. يميز الأخطاء الشائعة في التصويبة السلمية ويصححها (10 دقائق)\n\nالحصة 4:\n1. يؤدي التمرير من الكتف والمحاورة والارتكاز والتصويبة السلمية في محطات (20 دقيقة)\n2. يطبق القواعد ومراكز اللاعبين في مباراة مصغرة (10 دقائق)\n3. يستمتع بمشاركة زملائه ممارسة كرة السلة بروح رياضية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة السلة\n- مراكز اللاعبين\n- صانع اللعب\n- التمرير من الكتف\n- الهجوم الخاطف\n\nالحصة 2:\n- المحاورة مع تغيير الاتجاه\n- الارتكاز\n- قدم الارتكاز\n- تبديل اليدين\n\nالحصة 3:\n- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة\n\nالحصة 4:\n- المحطات\n- المباراة\n- المراكز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة فريق كرة سلة ويسأل: ما دور صانع اللعب؟ ويشرح القواعد والمراكز الخمسة (ص 107-109، 112).\n\nالحصة 2:\nيراجع المعلم التمرير ويسأل: كيف نتحرك بالكرة ونغير اتجاهنا دون مخالفة؟ ويعرض المحاورة والارتكاز (ص 110-111).\n\nالحصة 3:\nيراجع المعلم التصويبة السلمية من الصف السادس ويسأل: كم خطوة قبل الارتقاء؟ ويعرض النقاط الفنية (ص 111).\n\nالحصة 4:\nيراجع المعلم المهارات والقواعد ويعرض المحطات ثم تنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد المبسطة ومراكز اللاعبين (صانع اللعب، مساعده، الجناح، الجناح القوي، الارتكاز)، ثم يؤدي نموذج التمرير بيد واحدة من الكتف (قدم متقدمة، رفع الكرة لمستوى الكتف واليد خلفها، مد الذراع ودفع الكرة نحو الزميل)، فتطبيق موجه، ويستمع الطالب ويقلد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 1 ص 115: صفان متقابلان تبادل التمرير من الكتف، ثم زيادة المسافة إلى 6 م، ثم التمرير أثناء الجري، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الهجوم الخاطف): مجموعتان، إيصال الكرة إلى الطرف الآخر بأقل عدد من التمريرات من الكتف، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة بالتنطيط، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: محاورة بدفع الكرة بالأصابع والنظر للأمام، تغيير الاتجاه بتبديل اليدين أو الارتكاز الخلفي، ثم الارتكاز الأمامي (ثبات قدم الارتكاز وتحريك القدم الأخرى للأمام للحماية)، مع قاعدة قدم الارتكاز، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 2-3 ص 115: قطارات المحاورة والدوران حول الأطواق مع تغيير اليدين، ثم قطاران متقابلان التحرك بالتنطيط وأداء الارتكاز الأمامي بقدم الارتكاز داخل الطوق ثم التمرير، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (قطع الكرة) بالمحاورة في مربع، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع الركبة اليمنى ورفع الكرة باليد اليمنى والتصويب على اللوحة، الهبوط بتوازن؛ ثم تطبيق موجه بالخطوات داخل الأطواق، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 4-5 ص 115-116: قطارات التصويبة السلمية بعد المحاورة من الجانب الأيمن ثم الأيسر، ثم بعد الاستلام من الزميل، ويعد القائد الإصابات، ويتدرب الطالب ويعد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: تتابع التصويبة السلمية بين المجموعات ونقاط للإصابات، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط المحطات ص 117: التمرير من الكتف لأبعد مسافة، المحاورة حول الأطواق والارتكاز، التصويبة السلمية، التصويب من الثبات، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباراة ص 118: 5 ضد 5 بتوزيع المراكز وحكام من الطلبة، 5 دقائق لكل مباراة، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى استخدمتم التمرير من الكتف في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تمريرات التكافل: يمرر الطلبة الكرة بيد واحدة من مستوى الكتف، ومع كل تمريرة ناجحة يذكرون صورة من التكافل في عمان كالمساعدة في الأعراس والحصاد ومواساة الجيران (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): متى نستخدم التمرير بيد واحدة من الكتف؟\nالإجابة: للمسافات المتوسطة والطويلة وفي الهجوم الخاطف.\nس2 (مستوى التطبيق): ما واجب صانع اللعب؟\nالإجابة: يقود الهجوم ويمرر ويصوب من بعيد ويتخذ القرارات.\nس3 (مستوى الاستدلال): كم مركزًا هجوميًا في كرة السلة؟\nالإجابة: خمسة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم الثابتة التي لا يجوز تحريكها قبل التنطيط أو التمرير.\nس2 (مستوى التطبيق): كيف نغير الاتجاه أثناء المحاورة؟\nالإجابة: بتبديل اليدين أو الارتكاز الخلفي.\nس3 (مستوى الاستدلال): لماذا نؤدي الارتكاز الأمامي؟\nالإجابة: لحماية الكرة من المدافع والاستعداد للتمرير أو التصويب.\n\nالحصة 3:\nس1 (مستوى المعرفة): كم خطوة قبل الارتقاء في التصويبة السلمية؟\nالإجابة: خطوتان.\nس2 (مستوى التطبيق): بأي ركبة نرتقي عند التصويب باليد اليمنى؟\nالإجابة: نرفع الركبة اليمنى ونرتقي باليسرى.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: بعد المحاورة نحو السلة أو الاستلام قرب السلة.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر مركزًا لعبت فيه وواجبه.\nالإجابة: يذكر.\nس2 (مستوى التطبيق): في أي محطة استخدمنا الأطواق؟\nالإجابة: المحاورة والارتكاز.\nس3 (مستوى الاستدلال): متى استخدمت التصويبة السلمية في المباراة؟\nالإجابة: بعد المحاورة نحو السلة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ التمرير من الكتف لزميلك على بعد 6 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر مركزين من مراكز اللاعبين وواجبيهما.\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): ما الفرق بين التمرير من الكتف والتمريرة الصدرية؟\nالإجابة: من الكتف أقوى وأبعد بيد واحدة، والصدرية سريعة قصيرة باليدين.\n\nالحصة 2:\nس1 (مستوى المعرفة): حاور حول ثلاثة أطواق مع تبديل اليدين ثم أدِّ الارتكاز الأمامي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما المخالفة عند تحريك قدم الارتكاز؟\nالإجابة: المشي بالكرة (خطوات).\nس3 (مستوى الاستدلال): متى نستخدم الارتكاز الخلفي؟\nالإجابة: لتغيير الاتجاه والابتعاد عن المدافع.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ التصويبة السلمية بعد المحاورة.\nالإجابة: يؤديها.\nس2 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات قبل الارتقاء، ما الخطأ؟\nالإجابة: مخالفة المشي، الصحيح خطوتان.\nس3 (مستوى الاستدلال): لماذا نصوب على اللوحة في التصويبة السلمية؟\nالإجابة: لأنها ترتد إلى السلة بدقة أكبر.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التمرير من الكتف والتصويبة السلمية.\nس2 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تصرفت عند قرار حكم لم يعجبك؟\nالإجابة: احترمته وتابعت اللعب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على التمري
