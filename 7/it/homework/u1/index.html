:root{--bg:#F3F6FB;--card:#FFFFFF;--ink:#16213A;--muted:#5B6782;--line:#DCE3EE;--brand:#2F6FB3;--brand-ink:#FFFFFF;--ok:#1F9D55;--okbg:#E3F6EA;--bad:#D64545;--badbg:#FBE7E7;--gold:#E8A317}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#18223A;--ink:#E8EDF7;--muted:#9AA6C2;--line:#2B3756;--brand:#6EA8FF;--brand-ink:#0F1626;--ok:#3DD47F;--okbg:#12301F;--bad:#FF6B6B;--badbg:#3A1A1E;--gold:#F2B035}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2',system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.7;min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.top h1{margin:0;font-size:clamp(17px,4.5vw,22px);line-height:1.35}.top p{margin:0;color:var(--muted);font-size:14px}.top a{color:var(--brand);font-weight:700;text-decoration:none;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 16px}
.btn{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:16px;padding:12px 26px;background:var(--brand);color:var(--brand-ink);cursor:pointer;margin-top:12px}
.btn.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
h2{font-size:20px;margin:6px 0 14px;text-align:center}
.unit{font-size:15px;color:var(--muted);font-weight:700;margin:18px 0 8px}
.les{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 8px;cursor:pointer;text-decoration:none;color:inherit}
.les:hover{border-color:var(--brand)}.les .e{font-size:30px}.les b{flex:1;font-size:19px}.les small{color:var(--muted)}
.mode{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:0 0 6px;cursor:pointer}
.mode:hover{border-color:var(--brand)}
.mode .e{font-size:44px;line-height:1;flex:none}.mode b{display:block;font-size:22px}.mode small{color:var(--muted);font-size:15px}
.cp{font:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:4px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;margin:0 0 14px;display:block;margin-inline-start:auto}
.cp.done{color:var(--ok);border-color:var(--ok)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:14px;margin-top:10px}.note b{color:var(--ink)}
.q,.opt,.bub{direction:rtl}
.q{font-size:clamp(23px,6.2vw,32px);font-weight:800;line-height:1.6;margin:6px 0 16px}
.say{float:left;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 12px;font-size:22px;cursor:pointer;color:inherit}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-size:clamp(19px,5.3vw,25px);font-weight:700;text-align:start;padding:14px 18px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default}
.fb{margin:12px 0 0;font-size:21px;font-weight:800;min-height:34px}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.go{text-align:center;padding:26px 16px}.go h2{font-size:30px;margin:0 0 6px}.go p{font-size:19px;color:var(--muted);margin:0 0 6px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin:0 0 8px}.pts{color:var(--gold);font-size:22px}
/* race */
.track{position:relative;height:46px;background:linear-gradient(to left,#BFE8C9 calc(var(--p,0)*(100% - 22px) + 22px),var(--bg) 0);transition:background .6s;border:2px solid var(--line);border-radius:99px;margin:0 0 12px;overflow:hidden}
.ball{position:absolute;top:3px;inset-inline-start:calc(var(--p,0)*(100% - 44px));font-size:32px;line-height:38px;transition:inset-inline-start .6s ease}
.flag{position:absolute;top:4px;inset-inline-end:8px;font-size:30px;line-height:36px}
.tm{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 14px}.tm i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear,background .3s}
/* catch */
.stage{position:relative;height:min(58vh,440px);min-height:300px;overflow:hidden;border-radius:18px;border:2px solid var(--line);background:linear-gradient(#BFE3FF,#EAF6FF 70%,#CFEFC2 70%,#CFEFC2)}
@media (prefers-color-scheme:dark){.stage{background:linear-gradient(#1B2C52,#223966 70%,#1E4A2B 70%,#1E4A2B)}}
.cloud{position:absolute;font-size:44px;opacity:.7;top:8px}.cloud.a{inset-inline-start:8%}.cloud.b{inset-inline-start:62%;top:34px}
.bub{position:absolute;top:-96px;width:47%;min-height:66px;padding:10px 12px;border-radius:999px;border:3px solid #fff;background:#FFD166;color:#16213A;font:inherit;font-size:clamp(17px,4.6vw,23px);font-weight:800;text-align:center;cursor:pointer;box-shadow:0 6px 14px #0003;animation:fall linear forwards;line-height:1.35;display:grid;place-items:center}
.bub.l0{inset-inline-end:2%;background:#FFD166}.bub.l1{inset-inline-start:2%;background:#8ED1FC}
@keyframes fall{to{transform:translateY(var(--drop))}}
.bub.ok{background:#7BE0A0!important}.bub.no{background:#FF8A8A!important}
@keyframes pop{to{transform:translateY(var(--cur,0)) scale(1.35);opacity:0}}
/* activity */
.bar{display:flex;gap:6px;margin:0 0 14px}.bar i{flex:1;height:10px;border-radius:99px;background:var(--line)}.bar i.on{background:var(--brand)}.bar i.ok{background:var(--ok)}.bar i.no{background:var(--bad)}
.count{color:var(--muted);font-size:15px;margin:0 0 6px}
/* end + certificate */
.end{text-align:center}.stars{font-size:48px;letter-spacing:6px;margin:4px 0}.score{font-size:30px;font-weight:800;margin:0}
.name{margin:16px 0 4px;text-align:start}.name label{font-weight:700;display:block;margin-bottom:6px}
.name input{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.cert{display:none;margin:18px 0 0;padding:20px 16px;border:6px double var(--gold);border-radius:18px;text-align:center;background:var(--card)}
.cert.on{display:block}.cert .t{font-size:28px;font-weight:800;color:var(--gold);margin:0}.cert .n{font-size:30px;font-weight:800;margin:6px 0;word-break:break-word}.cert p{margin:4px 0;font-size:19px}.cert .s{font-size:44px;margin:0}.cert .f{font-size:14px;color:var(--muted);margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.hint{color:var(--muted);font-size:14px;margin:12px 0 0;text-align:center}
[hidden]{display:none!important}
bdi.en{unicode-bidi:isolate}
@media print{header,.row,.hint,.name,.end>.stars,.end>.score,.end>.msg,.end>.btn,#view>*:not(#end){display:none!important}body{background:#fff}.cert.on{display:block;border-color:#999;margin:0}}
</style>

  const v=$('view');const tf=q=>q.t==='tf';const optsOf=q=>q.o.map((t,k)=>({t,ok:k===q.a}));
  if(mode==='race'){const SEC=DATA.sec||20;
    v.innerHTML='<div class="card go" id="intro"><h2>هيا نتسابق!</h2><p>أجب عن '+N+' أسئلة قبل انتهاء الوقت.</p><p>كل إجابة صحيحة تدفع الكرة ⚽ نحو العلم 🏁</p><button class="btn" id="start" type="button">ابدأ السباق</button></div><div class="card" id="game" hidden><div class="track"><span class="ball" id="ball">⚽</span><span class="flag">🏁</span></div><div class="hud"><span id="cnt"></span><span class="pts" id="pts">0 نقطة</span></div><div class="tm"><i id="tm"></i></div>'+sayBtn()+'<div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb" aria-live="polite"></div></div><div id="end" hidden></div>';
    let i=0,correct=0,points=0,streak=0,left=SEC,busy=false;
    const tick=()=>{const f=$('tm');f.style.width=(left/SEC*100)+'%';f.style.background=left<5?'var(--bad)':left<9?'var(--gold)':'var(--ok)'};
    const show=()=>{busy=false;const q=BANK[i];$('cnt').textContent='السؤال '+(i+1)+' من '+N;$('q').innerHTML=disp(q.q);$('fb').textContent='';$('fb').className='fb';const box=$('opts');box.innerHTML='';let list=optsOf(q);if(!tf(q))list=shuffle(list);
      list.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=disp(o.t);b._ok=o.ok;b.onclick=()=>{if(!busy)finish(b,o.ok,false)};box.appendChild(b)});left=SEC;tick();clearInterval(timer);timer=setInterval(()=>{left-=.1;if(left<=0){left=0;tick();clearInterval(timer);if(!busy)finish(null,false,true)}else tick()},100)};
    const finish=(b,ok,to)=>{busy=true;clearInterval(timer);[...$('opts').children].forEach(x=>{x.disabled=true;if(x._ok)x.classList.add('ok')});if(b&&!ok)b.classList.add('no');
      if(ok){correct++;streak++;const gain=10+Math.ceil(left/SEC*10)+(streak%3===0?5:0);points+=gain;sound('ok');$('fb').textContent='أحسنت! +'+gain;$('fb').className='fb ok';$('ball').parentNode.style.setProperty('--p',correct/N);$('ball').style.setProperty('--p',correct/N)}
      else{streak=0;sound('no');$('fb').textContent=to?'انتهى الوقت! الإجابة الصحيحة باللون الأخضر':'الإجابة الصحيحة باللون الأخضر';$('fb').className='fb no'}
      $('pts').textContent=points+' نقطة';setTimeout(()=>{if(i+1<N){i++;show()}else end()},ok?900:1700)};
    const end=()=>{$('game').hidden=true;endScreen($('end'),{correct,total:N,points,title:L.title+' (سباق ضد الوقت)',onAgain:start})};
    const start=()=>{i=0;correct=0;points=0;streak=0;$('ball').style.setProperty('--p',0);$('ball').parentNode.style.setProperty('--p',0);$('pts').textContent='0 نقطة';$('intro').hidden=true;$('end').hidden=true;$('game').hidden=false;show();scrollTo(0,0)};
    if(canSpeak)$('say').onclick=()=>speak($('q').textContent);$('start').onclick=start}
  else if(mode==='catch'){const FALL=12;
    v.innerHTML='<div class="card go" id="intro"><h2>هيا نصطاد!</h2><p>اقرأ السؤال، ثم المس الإجابة الصحيحة وهي تنزل من السماء.</p><p>'+N+' أسئلة، لكل إجابة صحيحة 10 نقاط. لك محاولتان لكل سؤال، فإذا أخطأت مرتين تُحسب إجابتك خاطئة.</p><button class="btn" id="start" type="button">ابدأ اللعب</button></div><div class="card" id="game" hidden><div class="hud"><span id="cnt"></span><span class="pts" id="pts">0 نقطة</span></div>'+sayBtn()+'<div class="q" id="q"></div><div class="stage" id="stage"><span class="cloud a">☁️</span><span class="cloud b">☁️</span></div><div class="fb" id="fb" aria-live="polite" style="text-align:center"></div></div><div id="end" hidden></div>';
    const stage=$('stage');let wrong=0,i=0,correct=0,points=0,busy=false;
    const clear=()=>[...stage.querySelectorAll('.bub')].forEach(b=>b.remove());
    const show=()=>{busy=false;wrong=0;gen++;const my=gen,q=BANK[i];$('cnt').textContent='السؤال '+(i+1)+' من '+N;$('q').innerHTML=disp(q.q);$('fb').textContent='';$('fb').className='fb';clear();const list=shuffle(optsOf(q));const drop=stage.clientHeight+16;
      list.forEach((o,k)=>{const b=document.createElement('button');b.type='button';b.className='bub l'+(k%2);b.innerHTML=disp(o.t);b._ok=o.ok;b._t=o.t;if(o.t.length>26)b.style.fontSize='16px';b.style.setProperty('--drop',drop+'px');b.style.animationDuration=(FALL*.55).toFixed(1)+'s';b.style.animationDelay=(Math.floor(k/2)*1.1+(k%2)*.25)+'s';b.onclick=()=>hit(b);b.addEventListener('animationend',e=>{if(e.animationName==='fall')landed(b,my)});stage.appendChild(b)})};
    const pop=b=>{b.style.setProperty('--cur',(b.getBoundingClientRect().top-stage.getBoundingClientRect().top+96)+'px');b.style.animationName='pop';b.style.animationDuration='.45s';b.style.animationDelay='0s'};
    const hit=b=>{if(busy||b.disabled)return;b.disabled=true;if(b._ok){busy=true;correct++;points+=10;sound('ok');pop(b);b.classList.add('ok');$('fb').textContent='أحسنت! صيد موفق +10';$('fb').className='fb ok';$('pts').textContent=points+' نقطة';setTimeout(next,900)}
      else{sound('no');wrong++;pop(b);b.classList.add('no');setTimeout(()=>b.remove(),450);if(wrong>=2){busy=true;gen++;clear();const q=BANK[i];$('fb').innerHTML='أخطأت مرتين، الإجابة الصحيحة: '+disp(q.o[q.a]);$('fb').className='fb no';setTimeout(next,2200)}else{$('fb').textContent='حاول مرة أخرى (بقيت لك محاولة واحدة)';$('fb').className='fb no'}}};
    const landed=(b,my)=>{if(my!==gen||busy)return;if(b._ok){busy=true;sound('no');b.disabled=true;b.classList.add('ok');$('fb').innerHTML='فاتتك الإجابة الصحيحة: '+disp(b._t);$('fb').className='fb no';setTimeout(next,1800)}else b.remove()};
    const next=()=>{if(i+1<N){i++;show()}else end()};
    const end=()=>{gen++;clear();$('game').hidden=true;endScreen($('end'),{correct,total:N,points,title:L.title+' (صيد الإجابة)',onAgain:start})};
    const start=()=>{i=0;correct=0;points=0;$('pts').textContent='0 نقطة';$('intro').hidden=true;$('end').hidden=true;$('game').hidden=false;show();scrollTo(0,0)};
    if(canSpeak)$('say').onclick=()=>speak($('q').textContent);$('start').onclick=start}
  else{v.innerHTML='<div class="card" id="quiz"><p class="count" id="cnt"></p><div class="bar" id="bar"></div>'+sayBtn()+'<div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb" aria-live="polite"></div><button class="btn" id="next" type="button" hidden>التالي</button></div><div id="end" hidden></div>';
    let i=0,score=0,res=[],busy=false;
    const bar=()=>{const b=$('bar').children;for(let k=0;k<N;k++)b[k].className=res[k]===1?'ok':res[k]===0?'no':(k===i?'on':'')};
    const show=()=>{busy=false;const q=BANK[i];$('cnt').textContent='السؤال '+(i+1)+' من '+N;bar();$('q').innerHTML=disp(q.q);$('fb').textContent='';$('fb').className='fb';$('next').hidden=true;const box=$('opts');box.innerHTML='';let list=optsOf(q);if(!tf(q))list=shuffle(list);
      list.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=disp(o.t);b._ok=o.ok;b.onclick=()=>pick(b,o.ok);box.appendChild(b)})};
    const pick=(b,ok)=>{if(busy)return;busy=true;res[i]=ok?1:0;if(ok)score++;[...$('opts').children].forEach(x=>{x.disabled=true;if(x._ok)x.classList.add('ok');else if(x===b)x.classList.add('no')});
      $('fb').textContent=ok?'أحسنت! إجابة صحيحة ✔':'الإجابة الصحيحة باللون الأخضر';$('fb').className='fb '+(ok?'ok':'no');sound(ok?'ok':'no');bar();$('next').textContent=i+1<N?'التالي':'عرض النتيجة';$('next').hidden=false;$('next').focus()};
    const start=()=>{i=0;score=0;res=[];$('quiz').hidden=false;$('end').hidden=true;$('bar').innerHTML='';for(let k=0;k<N;k++)$('bar').appendChild(document.createElement('i'));show();scrollTo(0,0)};
    $('next').onclick=()=>{if(i+1<N){i++;show()}else{$('quiz').hidden=true;endScreen($('end'),{correct:score,total:N,points:null,title:L.title,onAgain:start})}};
    if(canSpeak)$('say').onclick=()=>speak($('q').textContent);start()}}
route();
})();
</script>
