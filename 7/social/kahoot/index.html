 t0=performance.now();$('timer').classList.remove('over');clearInterval(T);let lastS=-1;
 T=setInterval(()=>{const t=(performance.now()-t0)/1000;const left=Math.max(0,30-t);$('sec').textContent=t<=30?Math.ceil(left):'+'+Math.floor(t-30);
  $('arc').style.strokeDashoffset=t<=30?(326.7*(t/30)).toFixed(1):(326.7*Math.min(1,(t-30)/30)).toFixed(1);
  if(t>30)$('timer').classList.add('over');$('ptsNow').textContent=pointsAt(t)+' نقطة';
  const s=Math.ceil(left);if(t<=30&&s<=5&&s>0&&s!==lastS){lastS=s;SND.tick()}},100);
}
function choose(ok,btn,wrap,opts,typed){
 if(answered)return;answered=true;clearInterval(T);
 const t=(performance.now()-t0)/1000;const pts=ok?pointsAt(t):0;const g=G.groups[G.turn];g.s+=pts;g.last=pts;
 G.groups.forEach((x,i)=>{if(i!==G.turn)x.last=0});
 const Q=G.qs[G.k];
 if(wrap){[...wrap.children].forEach(b=>{b.disabled=true;let r=false;if(Q.k==='m'){r=opts[[...wrap.children].indexOf(b)].ok}else{r=(b.dataset.v==='true')===Q.a}if(r)b.classList.add('right');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')})}
 const fb=$('fb');if(ok){fb.textContent='إجابة صحيحة! +'+pts+' نقطة';fb.className='fb good';SND.good()}else{fb.textContent='إجابة غير صحيحة';fb.className='fb bad';SND.bad()}
 pend={ok,t,Q,typed};setTimeout(results,1300);
}
function correctText(Q){if(Q.k==='m')return Q.o[0];if(Q.k==='t')return Q.a?'صواب':'خطأ';return Q.a[0]}
function results(){
 show('sR');const g=G.groups[G.turn];
 $('rsum').textContent=pend.ok?('أحسنت يا '+g.name+'! +'+g.last+' نقطة'):('لم تُوفَّق '+g.name+' هذه المرة');
 $('ca').textContent='الإجابة الصحيحة: '+correctText(pend.Q)+(pend.typed?' — إجابة المجموعة: '+pend.typed:'');
 $('override').style.display=(!pend.ok&&pend.Q.k==='f')?'inline-block':'none';
 drawChart();SND.res();
 $('next').textContent=G.k+1<G.qs.length?'السؤال التالي':'عرض منصة التتويج';
}
function drawChart(){
 const ch=$('chart'),nm=$('names2');ch.innerHTML='';nm.innerHTML='';
 const max=Math.max(1000,...G.groups.map(x=>x.s));
 const order=G.groups.map((x,i)=>i).sort((a,b)=>G.groups[b].s-G.groups[a].s);const rank={};order.forEach((gi,r)=>rank[gi]=r+1);
 G.groups.forEach((x,i)=>{const bar=document.createElement('div');bar.className='bar'+(x.last>0?' win':'');const v=document.createElement('div');v.className='v';v.textContent='0';const b=document.createElement('div');b.className='b';b.style.background=x.c;const rk=document.createElement('div');rk.className='rk';rk.textContent=rank[i];b.appendChild(rk);bar.appendChild(v);bar.appendChild(b);ch.appendChild(bar);
  const n=document.createElement('div');n.textContent=x.name;if(x.last>0){const s=document.createElement('div');s.className='gain';s.textContent='+'+x.last;n.appendChild(s)}nm.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.height=Math.max(4,(x.s/max)*88)+'%'}));
  const start=performance.now(),from=x.s-x.last;(function step(){const k=Math.min(1,(performance.now()-start)/1100);v.textContent=Math.round(from+(x.s-from)*k);if(k<1)requestAnimationFrame(step)})()});
}
$('override').onclick=()=>{const g=G.groups[G.turn];const pts=pointsAt(pend.t);g.s+=pts;g.last=pts;pend.ok=true;$('override').style.display='none';$('rsum').textContent='تم الاحتساب: +'+pts+' نقطة لـ'+g.name;drawChart();SND.good()};
$('next').onclick=()=>{G.k++;G.turn=(G.turn+1)%G.groups.length;if(G.k<G.qs.length)ask();else end()};
$('quit').onclick=()=>{clearInterval(T);end()};
function end(){
 show('sEnd');const order=G.groups.slice().sort((a,b)=>b.s-a.s);$('endSub').textContent=D[S.l].t;
 const pod=$('pod');pod.innerHTML='';const pos=[1,0,2].filter(i=>i<order.length);const H={0:62,1:46,2:34};const M=['🥇','🥈','🥉'];
 pos.forEach(i=>{const g=order[i];const st=document.createElement('div');st.className='step3';st.innerHTML='';const md=document.createElement('div');md.className='medal';md.textContent=M[i];const nm=document.createElement('div');nm.className='nm';nm.textContent=g.name;const sc=document.createElement('div');sc.className='sc';sc.textContent=g.s+' نقطة';const blk=document.createElement('div');blk.className='blk';blk.style.background=g.c;blk.textContent=i+1;st.appendChild(md);st.appendChild(nm);st.appendChild(sc);st.appendChild(blk);pod.appendChild(st);requestAnimationFrame(()=>requestAnimationFrame(()=>{blk.style.height=H[i]+'%'}))});
 const rest=$('rest');rest.innerHTML='';order.slice(3).forEach((g,i)=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=(i+4)+'. '+g.name;const b=document.createElement('span');b.textContent=g.s+' نقطة';d.appendChild(a);d.appendChild(b);rest.appendChild(d)});
 SND.win();confetti();
}
$('again').onclick=()=>{drawSetup();show('sSetup')};
$('replay').onclick=()=>{G.groups.forEach(g=>{g.s=0;g.last=0});G.qs=pickQs();G.k=0;G.turn=0;ask()};
/* calm confetti */
function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[];for(let i=0;i<70;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*5,c:COLORS[i%6],vy:.6+Math.random()*1.1,vx:-.3+Math.random()*.6,a:Math.random()*6,va:.01+Math.random()*.03});
 const st=performance.now();(function f(){x.clearRect(0,0,c.width,c.height);const el=(performance.now()-st)/1000;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a)*.4;p.a+=p.va;x.globalAlpha=Math.max(0,1-el/7);x.fillStyle=p.c;x.beginPath();x.ellipse(p.x,p.y,p.r,p.r*.6,p.a,0,6.283);x.fill()});if(el<7)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
drawSetup();
</script></body></html>
