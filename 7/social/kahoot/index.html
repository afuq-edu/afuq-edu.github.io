:root{--bg:#F3F7F6;--card:#FFFFFF;--ink:#2A3B40;--soft:#6E8683;--teal:#3F8F89;--teal2:#A9D6D1;--sand:#F7EEDC;--sand2:#E7D3AB;--good:#4FA36B;--bad:#D27C72;--ring:#E2ECEA}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Tajawal',sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 10%,#E6F3F1 0,transparent 40%),radial-gradient(circle at 10% 90%,#F8EFDF 0,transparent 45%),var(--bg);overflow-x:hidden}
button{font:inherit;cursor:pointer}
.screen{display:none;min-height:100vh;padding:clamp(12px,2.4vw,28px);animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:700;color:var(--teal);font-size:clamp(1rem,2vw,1.25rem)}
.icon{border:1px solid var(--teal2);background:#fff;color:var(--teal);border-radius:12px;padding:8px 14px;font-weight:700}
.panel{max-width:1000px;margin:0 auto;background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(63,143,137,.10);padding:clamp(16px,3vw,32px)}
h1.title{margin:0 0 4px;font-size:clamp(1.5rem,3.4vw,2.4rem);color:var(--teal)}
.sub{color:var(--soft);margin:0 0 18px}
.step{border-top:1px dashed #D5E6E3;padding:14px 0}
.step h3{margin:0 0 10px;font-size:1.1rem;color:#4E7470;display:flex;align-items:center;gap:8px}
.step h3 .n{width:28px;height:28px;border-radius:50%;background:var(--sand);color:#8A6A35;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.opt{border:2px solid #E3EEEC;background:#FBFDFC;border-radius:14px;padding:10px 12px;text-align:right;color:var(--ink);transition:.2s}
.opt small{display:block;color:var(--soft);font-size:.8rem}
.opt.on{border-color:var(--teal);background:#EEF8F6;box-shadow:0 0 0 3px #D7EFEB}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #E3EEEC;background:#fff;border-radius:22px;padding:7px 14px;color:var(--ink)}
.chip.on{border-color:var(--teal);background:#EEF8F6;color:var(--teal);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid #DDEAE7;border-radius:14px;overflow:hidden}
.stepper button{border:0;background:#F2F8F7;width:46px;height:46px;font-size:1.4rem;color:var(--teal)}
.stepper span{min-width:56px;text-align:center;font-size:1.3rem;font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:10px}
.names input{font:inherit;border:2px solid #E3EEEC;border-radius:12px;padding:9px 12px;width:100%}
.go{display:block;margin:18px auto 0;border:0;background:linear-gradient(135deg,#4FA39C,#3F8F89);color:#fff;font-size:1.3rem;font-weight:700;border-radius:18px;padding:14px 46px;box-shadow:0 8px 20px rgba(63,143,137,.25);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.5}
/* question */
.qwrap{max-width:1150px;margin:0 auto}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.prog{color:var(--soft);font-weight:700}
.turn{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.turn .lbl{color:var(--soft);font-size:.9rem}
.gpill{border:2px solid transparent;border-radius:20px;padding:5px 12px;background:#fff;font-weight:700;opacity:.55;transition:.2s}
.gpill.on{opacity:1;box-shadow:0 0 0 3px rgba(63,143,137,.18)}
.stage{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,3vw,34px);align-items:center;margin-top:14px}
.timer{position:relative;width:clamp(120px,16vw,190px);height:clamp(120px,16vw,190px)}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .bgc{stroke:var(--ring)}
.timer .fg{stroke:var(--teal);transition:stroke .4s}
.timer.over .fg{stroke:#E1A65A}
.timer .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .sec{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:700;line-height:1}
.timer .pts{font-size:.9rem;color:var(--soft);margin-top:4px}
.qcard{background:#fff;border-radius:22px;padding:clamp(16px,2.6vw,30px);box-shadow:0 10px 26px rgba(63,143,137,.09)}
.qtype{display:inline-block;background:var(--sand);color:#8A6A35;border-radius:12px;padding:2px 12px;font-size:.85rem;font-weight:700;margin-bottom:8px}
.qtext{font-size:clamp(1.25rem,2.8vw,2.05rem);font-weight:700;line-height:1.55}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.ans{border:0;border-radius:18px;padding:clamp(14px,2.2vw,22px);font-size:clamp(1.05rem,2.2vw,1.45rem);font-weight:700;color:#2A3B40;text-align:right;display:flex;align-items:center;gap:12px;transition:transform .15s,opacity .3s,box-shadow .3s}
.ans:hover{transform:translateY(-2px)}
.ans .sh{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.75);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:1.1rem}
.a0{background:#D9EEF0}.a1{background:#F6E6C8}.a2{background:#E9DDF3}.a3{background:#DCEFD9}
.ans.dim{opacity:.35}
.ans.right{box-shadow:0 0 0 4px var(--good);opacity:1}
.ans.wrong{box-shadow:0 0 0 4px var(--bad)}
.fill{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.fill input{flex:1;min-width:200px;font:inherit;font-size:1.4rem;border:2px solid #DCEAE7;border-radius:16px;padding:12px 16px}
.fill button{border:0;background:var(--teal);color:#fff;border-radius:16px;padding:12px 26px;font-size:1.2rem;font-weight:700}
.fb{margin-top:14px;min-height:34px;font-size:1.25rem;font-weight:700}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
/* results */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px);height:min(46vh,380px);padding:10px 4px 0;border-bottom:2px solid #E3EEEC;margin-top:12px}
.bar{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .v{font-weight:700;margin-bottom:40px;font-size:1.1rem}
.bar .b{width:100%;border-radius:14px 14px 4px 4px;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.bar.win .b{box-shadow:0 0 0 4px #F3D48B,0 8px 22px rgba(225,166,90,.35)}
.bar .rk{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.names2{display:flex;justify-content:center;gap:clamp(10px,3vw,40px);margin-top:8px}
.names2 div{flex:1;max-width:140px;text-align:center;font-weight:700;font-size:clamp(.85rem,1.8vw,1.05rem)}
.gain{display:block;margin-top:2px;font-size:.85rem;color:var(--good)}

let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,vol){const a=ac();if(!a||S.muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05)}
const SND={good:()=>{tone(523,0,.35);tone(659,.12,.35);tone(784,.24,.55)},bad:()=>{tone(330,0,.35,'triangle',.09);tone(262,.18,.5,'triangle',.08)},tick:()=>tone(880,0,.08,'sine',.035),
 res:()=>{[392,494,587].forEach((f,i)=>tone(f,i*.1,.4,'sine',.07))},win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.16,.5,'sine',.08))},start:()=>{tone(440,0,.25,'sine',.07);tone(660,.15,.35,'sine',.07)}};
function setMute(){S.muted=!S.muted;['mute1','mute2'].forEach(id=>$(id).textContent=S.muted?'🔇 مكتوم':(id==='mute1'?'🔊 الصوت':'🔊'))}
$('mute1').onclick=setMute;$('mute2').onclick=setMute;
/* setup */
function drawSetup(){
 const lg=$('lesGrid');lg.innerHTML='';
 D.forEach((L,i)=>{const b=document.createElement('button');b.className='opt'+(i===S.l?' on':'');const sm=document.createElement('small');sm.textContent=L.u;b.appendChild(sm);b.appendChild(document.createTextNode(L.t));b.onclick=()=>{S.l=i;S.p=0;drawSetup()};lg.appendChild(b)});
 const pc=$('perChips');pc.innerHTML='';
 D[S.l].ax.forEach((a,i)=>{const b=document.createElement('button');b.className='chip'+(i===S.p?' on':'');b.textContent='الحصة '+(i+1)+': '+a;b.onclick=()=>{S.p=i;drawSetup()};pc.appendChild(b)});
 $('gCount').textContent=S.g;
 const nm=$('names');const cur=[...nm.querySelectorAll('input')].map(x=>x.value);cur.forEach((v,i)=>{if(v.trim())S.names[i]=v.trim()});nm.innerHTML='';
 for(let i=0;i<S.g;i++){const inp=document.createElement('input');inp.value=S.names[i]||('المجموعة '+(i+1));inp.style.borderColor=COLORS[i];inp.setAttribute('aria-label','اسم المجموعة '+(i+1));nm.appendChild(inp)}
 const qq=$('qQuick');qq.innerHTML='';[5,10,15,20].forEach(v=>{const b=document.createElement('button');b.className='chip'+(v===S.n?' on':'');b.textContent=v;b.onclick=()=>{S.n=v;drawSetup()};qq.appendChild(b)});
 $('qCount').textContent=S.n;
}
$('gMinus').onclick=()=>{if(S.g>2){S.g--;drawSetup()}};$('gPlus').onclick=()=>{if(S.g<6){S.g++;drawSetup()}};
$('qMinus').onclick=()=>{if(S.n>1){S.n--;drawSetup()}};$('qPlus').onclick=()=>{if(S.n<20){S.n++;drawSetup()}};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickQs(){
 const L=D[S.l],p=S.p+1;
 const own=shuffle(L.q.filter(q=>q.p===p));
 let sel=own.slice(0,S.n);
 if(sel.length<S.n){const others=L.q.filter(q=>q.p!==p).map(q=>({q,d:Math.abs(q.p-p)+Math.random()*0.9})).sort((a,b)=>a.d-b.d).map(x=>x.q);sel=sel.concat(others.slice(0,S.n-sel.length))}
 return sel.map((q,i)=>({q,i})).sort((a,b)=>a.q.l-b.q.l||a.i-b.i).map(x=>x.q);
}
$('start').onclick=()=>{
 const inps=[...$('names').querySelectorAll('input')];
 const groups=inps.map((x,i)=>({name:x.value.trim()||('المجموعة '+(i+1)),c:COLORS[i],s:0,last:0}));
 inps.forEach((x,i)=>S.names[i]=x.value.trim()||S.names[i]);
 G={groups,qs:pickQs(),k:0,turn:0};ac();SND.start();ask();
};
/* question */
let T=null,t0=0,answered=false,pend=null;
function pointsAt(t){if(t<=30)return Math.round(1000-500*t/30);return Math.max(100,Math.round(500-400*(t-30)/30))}
function drawTurn(){const tb=$('turn');tb.innerHTML='';G.groups.forEach((g,i)=>{const b=document.createElement('button');b.className='gpill'+(i===G.turn?' on':'');b.style.borderColor=g.c;b.style.background=i===G.turn?g.c+'40':'#fff';b.textContent=g.name;b.title='اختيار هذه المجموعة للإجابة';b.onclick=()=>{if(!answered){G.turn=i;drawTurn()}};tb.appendChild(b)})}
function norm(s){return s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^\u0621-\u064A0-9a-zA-Z ]/g,'').replace(/\s+/g,' ').trim()}
function strip(s){return s.split(' ').map(w=>w.startsWith('ال')&&w.length>3?w.slice(2):w).join(' ')}
function ask(){
 answered=false;pend=null;const Q=G.qs[G.k];show('sQ');
 $('prog').textContent='السؤال '+(G.k+1)+' من '+G.qs.length;drawTurn();
 $('qtype').textContent=KIND[Q.k];$('qtext').textContent=Q.q;$('fb').textContent='';$('fb').className='fb';
 const box=$('ansBox');box.innerHTML='';
 if(Q.k==='m'){const opts=shuffle(Q.o.map((t,i)=>({t,ok:i===0})));const w=document.createElement('div');w.className='answers';const shapes=['◆','●','▲','■'];
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='ans a'+i;const sh=document.createElement('span');sh.className='sh';sh.textContent=shapes[i];b.appendChild(sh);b.appendChild(document.createTextNode(o.t));b.onclick=()=>choose(o.ok,b,w,opts);w.appendChild(b)});box.appendChild(w)}
 else if(Q.k==='t'){const w=document.createElement('div');w.className='answers';[['صواب',true],['خطأ',false]].forEach(([t,v],i)=>{const b=document.createElement('button');b.className='ans a'+(i?2:0);const sh=document.createElement('span');sh.className='sh';sh.textContent=v?'✓':'✗';b.appendChild(sh);b.appendChild(document.createTextNode(t));b.dataset.v=v;b.onclick=()=>choose(v===Q.a,b,w,null);w.appendChild(b)});box.appendChild(w)}
 else{const w=document.createElement('div');w.className='fill';const inp=document.createElement('input');inp.placeholder='اكتب الإجابة هنا';const b=document.createElement('button');b.textContent='تأكيد';const go=()=>{if(!inp.value.trim())return;const v=norm(inp.value);const ok=Q.a.some(a=>{const n=norm(a);return n===v||strip(n)===strip(v)});choose(ok,null,null,null,inp.value.trim())};b.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};w.appendChild(inp);w.appendChild(b);box.appendChild(w);setTimeout(()=>inp.focus(),100)}
 t0=performance.now();$('timer').classList.remove('over');clearInterval(T);let lastS=-1;
 T=setInterval(()=>{const t=(performance.now()-t0)/1000;const left=Math.max(0,30-t);$('sec').textContent=t<=30?Math.ceil(left):'+'+Math.floor(t-30);
  $('arc').style.strokeDashoffset=t<=30?(326.7*(t/30)).toFixed(1):(326.7*Math.min(1,(t-30)/30)).toFixed(1);
  if(t>30)$('timer').classList.add('over');$('ptsNow').textContent=pointsAt(t)+' نقطة';
  const s=Math.ceil(left);if(t<=30&&s<=5&&s>0&&s!==lastS){lastS=s;SND.tick()}},100);
}
function choose(ok,btn,wrap,opts,typed){
 if(answered)return;answered=true;clearInterval(T);
 const t=(performance.now()-t0)/1000;const pts=ok?pointsAt(t):0;const g=G.groups[G.turn];g.s+=pts;g.last=pts;
 G.groups.forEach((x,i)=>{if(i!==G.turn)x.last=0});
 const Q=G.qs[G.k];
 if(wrap){[...wrap.children].forEach(b=>{b.disabled=true;let r=false;if(Q.k==='m'){r=opts[[...wrap.children].indexOf(b)].ok}else{r=(b.dataset.v==='true')===Q.a}if(r)b.classList.add('right');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')})}
 const fb=$('fb');if(ok){fb.textContent='إجابة صحيحة! +'+pts+' نقطة';fb.className='fb good';SND.good()}else{fb.textContent='إجابة غير صحيحة';fb.className='fb bad';SND.bad()}
 pend={ok,t,Q,typed};setTimeout(results,1300);
}
function correctText(Q){if(Q.k==='m')return Q.o[0];if(Q.k==='t')return Q.a?'صواب':'خطأ';return Q.a[0]}
function results(){
 show('sR');const g=G.groups[G.turn];
 $('rsum').textContent=pend.ok?('أحسنت يا '+g.name+'! +'+g.last+' نقطة'):('لم تُوفَّق '+g.name+' هذه المرة');
 $('ca').textContent='الإجابة الصحيحة: '+correctText(pend.Q)+(pend.typed?' — إجابة المجموعة: '+pend.typed:'');
 $('override').style.display=(!pend.ok&&pend.Q.k==='f')?'inline-block':'none';
 drawChart();SND.res();
 $('next').textContent=G.k+1<G.qs.length?'السؤال التالي':'عرض منصة التتويج';
}
function drawChart(){
 const ch=$('chart'),nm=$('names2');ch.innerHTML='';nm.innerHTML='';
 const max=Math.max(1000,...G.groups.map(x=>x.s));
 const order=G.groups.map((x,i)=>i).sort((a,b)=>G.groups[b].s-G.groups[a].s);const rank={};order.forEach((gi,r)=>rank[gi]=r+1);
 G.groups.forEach((x,i)=>{const bar=document.createElement('div');bar.className='bar'+(x.last>0?' win':'');const v=document.createElement('div');v.className='v';v.textContent='0';const b=document.createElement('div');b.className='b';b.style.background=x.c;const rk=document.createElement('div');rk.className='rk';rk.textContent=rank[i];b.appendChild(rk);bar.appendChild(v);bar.appendChild(b);ch.appendChild(bar);
  const n=document.createElement('div');n.textContent=x.name;if(x.last>0){const s=document.createElement('div');s.className='gain';s.textContent='+'+x.last;n.appendChild(s)}nm.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.height=Math.max(4,(x.s/max)*88)+'%'}));
  const start=performance.now(),from=x.s-x.last;(function step(){const k=Math.min(1,(performance.now()-start)/1100);v.textContent=Math.round(from+(x.s-from)*k);if(k<1)requestAnimationFrame(step)})()});
}
$('override').onclick=()=>{const g=G.groups[G.turn];const pts=pointsAt(pend.t);g.s+=pts;g.last=pts;pend.ok=true;$('override').style.display='none';$('rsum').textContent='تم الاحتساب: +'+pts+' نقطة لـ'+g.name;drawChart();SND.good()};
$('next').onclick=()=>{G.k++;G.turn=(G.turn+1)%G.groups.length;if(G.k<G.qs.length)ask();else end()};
$('quit').onclick=()=>{clearInterval(T);end()};
function end(){
 show('sEnd');const order=G.groups.slice().sort((a,b)=>b.s-a.s);$('endSub').textContent=D[S.l].t;
 const pod=$('pod');pod.innerHTML='';const pos=[1,0,2].filter(i=>i<order.length);const H={0:62,1:46,2:34};const M=['🥇','🥈','🥉'];
 pos.forEach(i=>{const g=order[i];const st=document.createElement('div');st.className='step3';st.innerHTML='';const md=document.createElement('div');md.className='medal';md.textContent=M[i];const nm=document.createElement('div');nm.className='nm';nm.textContent=g.name;const sc=document.createElement('div');sc.className='sc';sc.textContent=g.s+' نقطة';const blk=document.createElement('div');blk.className='blk';blk.style.background=g.c;blk.textContent=i+1;st.appendChild(md);st.appendChild(nm);st.appendChild(sc);st.appendChild(blk);pod.appendChild(st);requestAnimationFrame(()=>requestAnimationFrame(()=>{blk.style.height=H[i]+'%'}))});
 const rest=$('rest');rest.innerHTML='';order.slice(3).forEach((g,i)=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=(i+4)+'. '+g.name;const b=document.createElement('span');b.textContent=g.s+' نقطة';d.appendChild(a);d.appendChild(b);rest.appendChild(d)});
 SND.win();confetti();
}
$('again').onclick=()=>{drawSetup();show('sSetup')};
$('replay').onclick=()=>{G.groups.forEach(g=>{g.s=0;g.last=0});G.qs=pickQs();G.k=0;G.turn=0;ask()};
/* calm confetti */
function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[];for(let i=0;i<70;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*5,c:COLORS[i%6],vy:.6+Math.random()*1.1,vx:-.3+Math.random()*.6,a:Math.random()*6,va:.01+Math.random()*.03});
 const st=performance.now();(function f(){x.clearRect(0,0,c.width,c.height);const el=(performance.now()-st)/1000;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a)*.4;p.a+=p.va;x.globalAlpha=Math.max(0,1-el/7);x.fillStyle=p.c;x.beginPath();x.ellipse(p.x,p.y,p.r,p.r*.6,p.a,0,6.283);x.fill()});if(el<7)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
drawSetup();
</script></body></html>
