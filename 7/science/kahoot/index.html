body{margin:0;font-family:Taj,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 85% -10%,#e6f3f6 0,transparent 60%),radial-gradient(900px 500px at 0% 110%,#eef6ea 0,transparent 60%),var(--bg);min-height:100%}
button{font:inherit;cursor:pointer}
.app{max-width:1100px;margin:0 auto;padding:18px 18px 28px;min-height:100vh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:800;font-size:20px;color:var(--teal);letter-spacing:0}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.icon{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;color:var(--ink);font-weight:700}
.screen{display:none;flex:1;animation:fade .35s ease}
.screen.on{display:flex;flex-direction:column}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 #e9f0ee}
.step{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:17px;font-weight:700}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--tealS);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
select,input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc;color:var(--ink);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;color:#4b6764;transition:background .2s,border-color .2s}
.chip[aria-pressed=true]{background:var(--tealS);border-color:#a9d7c9;color:var(--teal)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.g-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:#fbfdfc}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.g-in input{border:0;background:transparent;padding:6px 2px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.range{display:flex;align-items:center;gap:12px;flex:1;min-width:240px}
input[type=range]{flex:1;accent-color:var(--teal);height:28px}
.big{font-size:28px;font-weight:800;color:var(--teal);min-width:48px;text-align:center}
.note{color:var(--mute);font-size:14px;margin-top:6px}
.start{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(180deg,#4fa290,#3f8f7f);box-shadow:0 6px 18px -8px #3f8f7f}
.start:disabled{opacity:.45}
/* question */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.prog{color:var(--mute);font-weight:700}
.turn{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px 6px 8px;background:#fff;border:1px solid var(--line);font-weight:800}
.turn .dot{width:22px;height:22px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:2px solid transparent;border-radius:999px;padding:5px 12px;font-weight:700;background:#fff}
.qwrap{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:40px;color:var(--teal)}
.ring .num small{font-size:13px;font-weight:700;color:var(--mute)}
.ring.over .num{color:#c08a2a}
.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 24px;font-size:clamp(20px,2.6vw,30px);font-weight:700;line-height:1.6;min-height:150px;display:flex;align-items:center}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--mute);background:#f3f7f6;border-radius:8px;padding:2px 10px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;font-size:clamp(17px,2.1vw,24px);font-weight:700;color:var(--ink);min-height:72px;transition:transform .15s,border-color .2s,background .2s}
.opt:hover{transform:translateY(-2px);border-color:#b7d8ce}
.opt .k{flex:none;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.opt.ok{background:var(--okS);border-color:var(--ok)}
.opt.no{background:var(--noS);border-color:var(--no)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default;transform:none}
.blank{display:inline-block;min-width:110px;min-height:1.2em;border-bottom:3px dashed #9cc7bb;margin:0 6px;padding:0 8px;line-height:1.3;vertical-align:baseline;color:var(--ok)}
.feedback{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb{font-size:22px;font-weight:800}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.next{border:0;border-radius:14px;padding:12px 26px;font-size:18px;font-weight:800;color:#fff;background:#3f8f7f}
.ghost{border:1px solid var(--line);border-radius:14px;padding:11px 18px;font-weight:700;background:#fff;color:var(--ink)}
/* chart */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:min(46vh,380px);padding:16px 10px 0;border-bottom:2px solid var(--line)}
.col{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-v{width:100%;border-radius:14px 14px 4px 4px;height:4%;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.bar-v .pts{position:absolute;top:-34px;left:0;right:0;text-align:center;font-weight:800;font-size:20px;color:var(--ink)}
.bar-v .gain{position:absolute;top:-58px;left:0;right:0;text-align:center;font-weight:800;font-size:15px;color:var(--ok);opacity:0;transition:opacity .4s .8s}
.col.win .bar-v .gain{opacity:1}
.col.win .bar-v{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gold)}
.names{display:flex;justify-content:center;gap:clamp(10px,3vw,34px);padding:8px 10px}
.names div{flex:1;max-width:130px;text-align:center;font-weight:800}
.names small{display:block;color:var(--mute);font-weight:700}
.rtitle{text-align:center;font-size:20px;font-weight:800;margin:4px 0 6px}
.rsub{text-align:center;color:var(--mute);margin-bottom:6px}
/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:min(52vh,420px);margin-top:20px}
.pod{width:min(26vw,190px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pod .blk{width:100%;border-radius:16px 16px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:44px;font-weight:800;color:#fff;transform:scaleY(0);transform-origin:bottom;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.pod.up .blk{transform:scaleY(1)}
.pod .nm{font-weight:800;font-size:20px;margin-bottom:4px;opacity:0;transition:opacity .5s .7s}
.pod .sc{color:var(--mute);font-weight:700;margin-bottom:8px;opacity:0;transition:opacity .5s .8s}
.pod.up .nm,.pod.up .sc{opacity:1}
.rest{text-align:center;color:var(--mute);margin-top:14px;font-weight:700}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (max-width:700px){.qwrap{grid-template-columns:1fr;justify-items:center}.ring{width:120px;height:120px}.ring svg{width:120px;height:120px}.opts{grid-template-columns:1fr}.qcard{min-height:110px;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="app">
  <div class="bar">
    <div class="brand">مسابقات كاهوت<small>العلوم · الصف السابع · الفصل الدراسي الأول</small></div>
    <div style="display:flex;gap:8px">
      <button class="icon" id="home" title="العودة للإعداد" style="display:none">⟲ إعداد جديد</button>
      <button class="icon" id="mute" aria-pressed="false">🔊 الصوت</button>
    </div>
  </div>

  <!-- SETUP -->
  <section class="screen on" id="sSetup">
    <div class="panel"><div class="step"><i>١</i>اختر الدرس</div><select id="lesson"></select></div>
    <div class="panel"><div class="step"><i>٢</i>عنوان الحصة</div><div class="chips" id="axes"></div>
      <div class="note">تُقدَّم أسئلة هذه الحصة أولًا، ويُكمَل العدد من حصص الدرس الأخرى عند الحاجة، مرتبة من الأسهل إلى الأصعب.</div></div>
    <div class="panel"><div class="step"><i>٣</i>المجموعات</div>
      <div class="chips" id="gcount"></div>
      <div class="groups" id="gnames"></div>
      <div class="row" style="margin-top:12px"><span style="font-weight:700">من يجيب؟</span><div class="chips" id="turnMode"></div></div>
    </div>
    <div class="panel"><div class="step"><i>٤</i>عدد الأسئلة</div>
      <div class="row"><div class="range"><input type="range" id="qn" min="1" max="20" value="10"><span class="big" id="qnv">١٠</span></div>
      <div class="chips" id="quick"></div></div>
      <div class="note" id="avail"></div></div>
    <button class="start" id="go">ابدأ المسابقة</button>
  </section>

  <!-- QUESTION -->
  <section class="screen" id="sQ">
    <div class="qtop"><div class="prog" id="prog"></div><div class="turn" id="turn"></div><div class="pick" id="pick"></div></div>
    <div class="qwrap">
      <div class="ring" id="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="#e7f0ed" stroke-width="12"/><circle id="arc" cx="75" cy="75" r="64" fill="none" stroke="#5bb5a2" stroke-width="12" stroke-linecap="round" stroke-dasharray="402.1" stroke-dashoffset="0"/></svg><div class="num"><span id="sec">٣٠</span><small id="secl">ثانية</small></div></div>
      <div><div class="tag" id="qtag"></div><div class="qcard" id="qtext"></div></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fbk" style="display:none"><div class="fb" id="fbt"></div><button class="next" id="toRes">عرض النتائج</button></div>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="sR">
    <div class="rtitle" id="rt"></div><div class="rsub" id="rs"></div>
    <div class="chart" id="chart"></div><div class="names" id="names"></div>
    <div style="display:flex;justify-content:center;margin-top:16px"><button class="next" id="nextQ">السؤال التالي</button></div>
  </section>

  <!-- FINAL -->
  <section class="screen" id="sF">
    <div class="rtitle" style="font-size:26px">منصة التتويج</div><div class="rsub" id="fsub"></div>
    <div class="podium" id="podium"></div><div class="rest" id="rest"></div>
    <div style="display:flex;justify-content:center;gap:10px;margin-top:18px"><button class="next" id="again">مسابقة جديدة</button></div>
  </section>
</div>

 opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="k" style="background:${COLORS[i%6]}">${q.y==='t'?(o.t==='صواب'?'✓':'✗'):keys[i]}</span><span></span>`;b.lastChild.textContent=o.t;b.onclick=()=>answer(o,b);b._o=o;box.appendChild(b)});
 $('fbk').style.display='none';
 const arc=$('arc'),ring=$('ring');ring.classList.remove('over');arc.style.stroke='#5bb5a2';let lastS=-1;
 clearInterval(timer);timer=setInterval(()=>{const t=(performance.now()-G.t0)/1000;
  if(t<=30){arc.style.strokeDashoffset=(402.1*t/30).toFixed(1);const s=Math.ceil(30-t);$('sec').textContent=toAr(s);$('secl').textContent='ثانية';if(s<=5&&s!==lastS){lastS=s;SND.tick()}}
  else{ring.classList.add('over');arc.style.stroke='#e3b45a';arc.style.strokeDashoffset=(402.1*Math.min(1,(t-30)/30)).toFixed(1);$('sec').textContent=toAr(points(t));$('secl').textContent='نقطة متاحة'}
 },100);}
function answer(o,btn){if(G.answered)return;G.answered=true;clearInterval(timer);const t=(performance.now()-G.t0)/1000;const g=G.gs[G.turn];
 const pts=o.c?points(t):0;G.gs.forEach(x=>x.last=0);g.last=pts;g.score+=pts;G.lastGroup=G.turn;G.lastOk=o.c;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b._o.c)b.classList.add('ok');else if(b===btn)b.classList.add('no');else b.classList.add('dim')});
 const q=G.qs[G.i];if(q.y==='f'){const cor=q.o[0];$('blank').textContent=cor;$('blank').style.borderBottomStyle='solid'}
 drawTurn();
 $('fbt').className='fb '+(o.c?'ok':'no');$('fbt').textContent=o.c?('إجابة صحيحة! '+toAr(pts)+' نقطة لمجموعة «'+g.name+'»'):'إجابة غير صحيحة، لا نقاط هذه المرة';
 o.c?SND.ok():SND.no();$('fbk').style.display='flex';$('toRes').focus();}
$('toRes').onclick=()=>{show('sR');results()};
function rankOf(i){return 1+G.gs.filter(x=>x.score>G.gs[i].score).length}
function results(){const max=Math.max(1,...G.gs.map(g=>g.score));const order=G.gs.map((g,i)=>i).sort((a,b)=>G.gs[b].score-G.gs[a].score);
 const g=G.gs[G.lastGroup];$('rt').textContent=G.lastOk?('فازت بالسؤال: '+g.name):'لم تحصل أي مجموعة على نقاط في هذا السؤال';
 $('rs').textContent='الترتيب الحالي بعد '+toAr(G.i+1)+' من '+toAr(G.qs.length);
 const ch=$('chart'),nm=$('names');ch.innerHTML='';nm.innerHTML='';
 G.gs.forEach((x,i)=>{const rank=rankOf(i);const c=document.createElement('div');c.className='col'+(G.lastOk&&i===G.lastGroup?' win':'');
  c.innerHTML=`<div class="bar-v" style="background:linear-gradient(180deg,${x.color},${x.color}cc)"><span class="gain">+${toAr(x.last)}</span><span class="pts">${toAr(x.score)}</span></div>`;ch.appendChild(c);
  const n=document.createElement('div');n.innerHTML=`${x.name}<small>المركز ${toAr(rank)}</small>`;nm.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{c.firstChild.style.height=Math.max(4,82*x.score/max)+'%'}))});
 SND.bars();$('nextQ').textContent=G.i+1<G.qs.length?'السؤال التالي':'إعلان النتائج';$('nextQ').focus();}
$('nextQ').onclick=()=>{G.i++;if(G.i<G.qs.length){show('sQ');ask()}else{show('sF');final()}};
function final(){const order=G.gs.map((g,i)=>i).sort((a,b)=>G.gs[b].score-G.gs[a].score);const pod=$('podium');pod.innerHTML='';
 const slots=[1,0,2].filter(k=>k<order.length);const H={1:100,2:72,3:52};
 slots.forEach((k,j)=>{const g=G.gs[order[k]];const rk=rankOf(order[k]);const d=document.createElement('div');d.className='pod';d.innerHTML=`<div class="nm">${g.name}</div><div class="sc">${toAr(g.score)} نقطة</div><div class="blk" style="height:${(H[rk]||40)*0.62}%;background:linear-gradient(180deg,${g.color},${g.color}bb)">${toAr(rk)}</div>`;d.style.height='100%';pod.appendChild(d);setTimeout(()=>d.classList.add('up'),250+[2,1,0].indexOf(k)*450)});
 const win=order.filter(i=>rankOf(i)===1).map(i=>G.gs[i].name);$('fsub').textContent=(win.length>1?'تعادل في المركز الأول: ':'مبارك للمجموعة الفائزة: ')+win.join(' و ');
 $('rest').textContent=order.slice(3).map((i,k)=>'المركز '+toAr(rankOf(i))+': '+G.gs[i].name+' ('+toAr(G.gs[i].score)+')').join('   ·   ');
 setTimeout(()=>{SND.win();confetti()},1300);}
$('again').onclick=()=>{show('sSetup');$('home').style.display='none'};
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('cf'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const P=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,r:4+Math.random()*5,c:COLORS[Math.floor(Math.random()*6)],vy:1+Math.random()*1.8,vx:-0.6+Math.random()*1.2,a:Math.random()*6,va:-0.05+Math.random()*0.1}));
 let f=0;(function loop(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((f+p.a*40)/40)*0.4;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-f/360);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<360)requestAnimationFrame(loop);else x.clearRect(0,0,cv.width,cv.height)})();}
</script>
