جيات: التعلم بالنمذجة.\n\n4. ٢ (بداية): يوزّع المعلم الأزهار ويوجّه إلى نزع السبلات ثم البتلات بالترتيب، ويذكّر بالسلامة عند استخدام المشرط وحساسية حبوب اللقاح، وتنزع المجموعة أجزاء الزهرة وترتبها على ورقة بيضاء وتلصقها مع عناوين (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب ويذكر جزءًا تعلمه لم يكن يعرفه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) أين توجد الأمشاج الذكرية في الزهرة؟\n   الإجابة: داخل حبوب اللقاح التي تُنتَج في المتك.\n٢. (مستوى التطبيق) ما الفرق بين النبات والزهرة؟\n   الإجابة: النبات كائن حي كامل له جذور وساق وأوراق، والزهرة عضو من أعضائه مختص بالتكاثر الجنسي.\n٣. (مستوى الاستدلال) لماذا تُعدّ الكربلة الجزء الأنثوي في الزهرة؟\n   الإجابة: لأنها تحتوي المبيض الذي تتكوّن فيه البويضات المحتوية على الأمشاج الأنثوية.", "١. (مستوى المعرفة) سمِّ جزأي السداة.\n   الإجابة: المتك والخيط.\n٢. (مستوى التطبيق) رتّب أجزاء الكربلة من الأعلى إلى الأسفل.\n   الإجابة: الميسم، القلم، المبيض.\n٣. (مستوى الاستدلال) ما وظيفة الرحيق في الزهرة؟\n   الإجابة: سائل سكري يجذب الحشرات والطيور إلى الزهرة فتنقل حبوب اللقاح.", "للطالب: قراءة كتاب الطالب ص١٦–١٧ وإحضار زهرتين مختلفتين (غير برية محمية) للحصة القادمة. لولي الأمر: متابعة الابن في رسم زهرة وتسمية أجزائها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=2"]}, {"n": 2, "axis": "استقصاء تركيب الأزهار والمقارنة بين زهرتين", "f": ["١. أن يقيس أبعاد أجزاء الزهرة ويدوّن ملاحظات دقيقة\n٢. أن يقارن بين زهرتين مختلفتين في عدد الأجزاء وشكلها وحجمها\nمخرج تعليمي آخر: أن يستنتج علاقة بين لون البتلات ورائحتها وطريقة جذب الحيوانات", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: زهرتان من نوعين مختلفين لكل مجموعة، عدسات مكبرة، مساطر", "السبلة، البتلة، السداة، الكربلة، الملاحظة الدقيقة، القياس، جدول المقارنة.", "مراجعة سريعة بلعبة «أنا جزء من الزهرة…»: يصف المعلم وظيفة ويسمّي الطلاب الجزء، تمهيدًا للمقارنة بين زهرتين.", "1. التهيئة: يدير المعلم لعبة الألغاز عن أجزاء الزهرة، ويجيب الطالب بسرعة باسم الجزء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. إكمال نشاط ١-٢: يتابع المجموعات أثناء فحص الزهرتين وقياس البتلات والأسدية، ويوجّه إلى الوصف الإيجابي الدقيق، ويعدّ الطالب الأجزاء ويقيسها بالمسطرة ويرسم الزهرتين (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تمرين ١-٢ مقارنة بين زهرتين: يعرض المعلم جدول المقارنة من كتاب النشاط ص٢٠ ويوضّح كتابة نقاط متقابلة، ويملأ الطالب الجدول بأوجه التشابه والاختلاف ويعرض مجموعة نتائجها (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. يدير المعلم نقاشًا: ما الذي يجعل الزهرة جاذبة للحشرات؟ ثم يطرح أسئلة التقويم الختامي، ويقارن الطالب نتائجه بنتائج المجموعات الأخرى ويجيب (8 دقائق)\nالاستراتيجيات: المناقشة والتقويم.", "١. (مستوى المعرفة) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة: إجابة حسب الزهرة مع عدّ صحيح يطابق العيّنة.\n٢. (مستوى التطبيق) اذكر وجه تشابه ووجه اختلاف بين الزهرتين.\n   الإجابة: مثال: التشابه: لكل منهما بتلات وأسدية؛ الاختلاف: لون البتلات أو عددها أو طول الأسدية.\n٣. (مستوى الاستدلال) لماذا يجب أن تكون نقاط المقارنة متقابلة في الجدول؟\n   الإجابة: حتى تقارن الخاصية نفسها في الزهرتين فتكون المقارنة دقيقة وواضحة.", "١. (مستوى المعرفة) أيّ أجزاء الزهرة تكون عادة أكبرها وأزهاها لونًا؟\n   الإجابة: البتلات.\n٢. (مستوى التطبيق) فسّر: الأزهار التي تلقحها الحشرات ذات ألوان زاهية.\n   الإجابة: لجذب الحشرات إليها فتنقل حبوب اللقاح بين الأزهار.\n٣. (مستوى الاستدلال) صمّم جدولًا لمقارنة زهرتين في أربع خصائص.\n   الإجابة: جدول بثلاثة أعمدة (الخاصية، الزهرة أ، الزهرة ب) وصفوف: عدد البتلات، لونها، عدد الأسدية، طول القلم.", "للطالب: حل تمرين ١-٢ «مقارنة بين زهرتين» في كتاب النشاط ص٢٠ إن لم يكتمل في الصف. لولي الأمر: تشجيع الابن على ملاحظة الأزهار في الحديقة دون قطف الأزهار البرية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=2"]}], "comb": ["الحصة ١: الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة\n١. أن يحدّد أجزاء الزهرة: السبلات والبتلات والأسدية (المتك والخيط) والكربلة (ا  ورائحتها، ويصحّح الخلط بين «النبات» و«الزهرة»، ويقترح الطالب تفسيرات ويتذكر أسماء أجزاء يعرفها (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التكاثر الجنسي والأمشاج: يشرح المعلم أن التكاثر الجنسي يتطلب اندماج مشيج ذكري بمشيج أنثوي (الإخصاب)، وأن حبوب اللقاح تحتوي الأمشاج الذكرية والبويضات تحتوي الأنثوية، ويدوّن الطالب المصطلحات في خريطة مفاهيم ويطرح أسئلة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تركيب الزهرة: يعرض المعلم مجسمًا أو رسمًا لمقطع زهرة على السبورة الذكية ويحدّد الأجزاء الذكرية والأنثوية، ويطابق الطالب الأجزاء على رسم كتاب الطالب ص١٧ ويصنّفها إلى ذكرية وأنثوية (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. ٢ (بداية): يوزّع المعلم الأزهار ويوجّه إلى نزع السبلات ثم البتلات بالترتيب، ويذكّر بالسلامة عند استخدام المشرط وحساسية حبوب اللقاح، وتنزع المجموعة أجزاء الزهرة وترتبها على ورقة بيضاء وتلصقها مع عناوين (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب ويذكر جزءًا تعلمه لم يكن يعرفه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: استقصاء تركيب الأزهار والمقارنة بين زهرتين — زمن الحصة 40 دقيقة\n\n1. التهيئة: يدير المعلم لعبة الألغاز عن أجزاء الزهرة، ويجيب الطالب بسرعة باسم الجزء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. إكمال نشاط ١-٢: يتابع المجموعات أثناء فحص الزهرتين وقياس البتلات والأسدية، ويوجّه إلى الوصف الإيجابي الدقيق، ويعدّ الطالب الأجزاء ويقيسها بالمسطرة ويرسم الزهرتين (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تمرين ١-٢ مقارنة بين زهرتين: يعرض المعلم جدول المقارنة من كتاب النشاط ص٢٠ ويوضّح كتابة نقاط متقابلة، ويملأ الطالب الجدول بأوجه التشابه والاختلاف ويعرض مجموعة نتائجها (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. يدير المعلم نقاشًا: ما الذي يجعل الزهرة جاذبة للحشرات؟ ثم يطرح أسئلة التقويم الختامي، ويقارن الطالب نتائجه بنتائج المجموعات الأخرى ويجيب (8 دقائق)\nالاستراتيجيات: المناقشة والتقويم.", "الحصة ١: الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة\n١. (مستوى المعرفة) أين توجد الأمشاج الذكرية في الزهرة؟\n   الإجابة: داخل حبوب اللقاح التي تُنتَج في المتك.\n٢. (مستوى التطبيق) ما الفرق بين النبات والزهرة؟\n   الإجابة: النبات كائن حي كامل له جذور وساق وأوراق، والزهرة عضو من أعضائه مختص بالتكاثر الجنسي.\n٣. (مستوى الاستدلال) لماذا تُعدّ الكربلة الجزء الأنثوي في الزهرة؟\n   الإجابة: لأنها تحتوي المبيض الذي تتكوّن فيه البويضات المحتوية على الأمشاج الأنثوية.\n\nالحصة ٢: استقصاء تركيب الأزهار والمقارنة بين زهرتين\n١. (مستوى المعرفة) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة: إجابة حسب الزهرة مع عدّ صحيح يطابق العيّنة.\n٢. (مستوى التطبيق) اذكر وجه تشابه ووجه اختلاف بين الزهرتين.\n   الإجابة: مثال: التشابه: لكل منهما بتلات وأسدية؛ الاختلاف: لون البتلات أو عددها أو طول الأسدية.\n٣. (مستوى الاستدلال) لماذا يجب أن تكون نقاط المقارنة متقابلة في الجدول؟\n   الإجابة: حتى تقارن الخاصية نفسها في الزهرتين فتكون المقارنة دقيقة وواضحة.", "الحصة ١: الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة\n١. (مستوى المعرفة) سمِّ جزأي السداة.\n   الإجابة: المتك والخيط.\n٢. (مستوى التطبيق) رتّب أجزاء الكربلة من الأعلى إلى الأسفل.\n   الإجابة: الميسم، القلم، المبيض.\n٣. (مستوى الاستدلال) ما وظيفة الرحيق في الزهرة؟\n   الإجابة: سائل سكري يجذب الحشرات والطيور إلى الزهرة فتنقل حبوب اللقاح.\n\nالحصة ٢: استقصاء تركيب الأزهار والمقارنة بين زهرتين\n١. (مستوى المعرفة) أيّ أجزاء الزهرة تكون عادة أكبرها وأزهاها لونًا؟\n   الإجابة: البتلات.\n٢. (مستوى التطبيق) فسّر: الأزهار التي تلقحها الحشرات ذات ألوان زاهية.\n   الإجابة: لجذب الحشرات إليها فتنقل حبوب اللقاح بين الأزهار.\n٣. (مستوى الاستدلال) صمّم جدولًا لمقارنة زهرتين في أربع خصائص.\n   الإجابة: جدول بثلاثة أعمدة (الخاصية، الزهرة أ، الزهرة ب) وصفوف: عدد البتلات، لونها، عدد الأسدية، طول القلم.", "الحصة ١: الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة\nللطالب: قراءة كتاب الطالب ص١٦–١٧ وإحضار زهرتين مختلفتين (غير برية محمية) للحصة القادمة. لولي الأمر: متابعة الابن في رسم زهرة وتسمية أجزائها.\n\nالحصة ٢: استقصاء تركيب الأزهار والمقارنة بين زهرتين\nللطالب: حل تمرين ١-٢ «مقارنة بين زهرتين» في كتاب النشاط ص٢٠ إن لم يكتمل في الصف. لولي الأمر: تشجيع الابن على ملاحظة الأزهار في الحديقة دون قطف الأزهار البرية.\n🎮 n   الإجابة: الحشرات، الطيور، الرياح.\n٣. (مستوى الاستدلال) لماذا تكون حبوب لقاح الأزهار التي تلقحها الرياح خفيفة وكثيرة؟\n   الإجابة: لتحملها الرياح بسهولة لمسافات بعيدة، ولأن احتمال وصول كل حبة إلى ميسم ضعيف فيلزم عدد كبير.", "١. (مستوى المعرفة) من أين تنتقل حبوب اللقاح وإلى أين؟\n   الإجابة: من المتك إلى الميسم.\n٢. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الزهرة؟\n   الإجابة: البتلات الزاهية والرائحة والرحيق.\n٣. (مستوى الاستدلال) هل الحشرة تقصد نقل حبوب اللقاح؟ فسّر.\n   الإجابة: لا؛ تأتي لتتغذى على الرحيق فتلتصق حبوب اللقاح بجسمها وتنتقل عرَضًا إلى زهرة أخرى.", "للطالب: قراءة كتاب الطالب ص١٨–١٩ وحل الأسئلة ١–٤. لولي الأمر: ملاحظة الحشرات التي تزور أزهار الحديقة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=3"]}, {"n": 2, "axis": "فحص حبوب اللقاح باستخدام المجهر", "f": ["١. أن يستخدم المجهر الضوئي استخدامًا صحيحًا آمنًا\n٢. أن يسمّي أجزاء المجهر ووظيفة كل منها\nمخرج تعليمي آخر: أن يقارن بين حبوب لقاح زهرتين من حيث الشكل والحجم", "المخرج ١: تطبيق\nالمخرج ٢: تذكر\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- أخرى: مجاهر، شرائح زجاجية، أزهار ناضجة المتك، ورقتا العمل ١-٣(أ) و١-٣(ب)", "المجهر، العدسة العينية، العدسة الشيئية، المسرح، الضابط الكبير، الضابط الصغير، الشريحة، حبوب اللقاح.", "سؤال: كيف نرى حبوب اللقاح وهي صغيرة جدًا؟ ثم عرض مجهر حقيقي وتسمية أجزائه بمشاركة الطلاب.", "1. التهيئة: يعرض المعلم المجهر ويسأل عن أجزائه المعروفة، ويسمّي الطالب الأجزاء التي يعرفها (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أجزاء المجهر واستخدامه: يشرح المعلم ورقة العمل ١-٣(أ) و١-٣(ب)، وينمذج ضبط التركيز: خفض العدسة الشيئية بالنظر من الجانب ثم رفعها أثناء النظر في العدسة العينية، ويسمّي الطالب الأجزاء على الرسم ويتدرّب على الضبط (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ٣ فحص حبوب اللقاح: يتابع المجموعات أثناء نقل حبوب اللقاح من المتك إلى الشريحة وفحصها، وينبّه إلى الحساسية، ويحضّر الطالب الشريحة ويرسم ما يراه لحبوب لقاح زهرتين ويقارن (17 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يناقش المعلم: لماذا تكون بعض حبوب اللقاح شائكة؟ ويطرح التقويم الختامي، ويعرض الطالب رسمه ويجيب (8 دقائق)\nالاستراتيجيات: المناقشة والتقويم.", "١. (مستوى المعرفة) ما العدسة التي ننظر من خلالها في المجهر؟\n   الإجابة: العدسة العينية.\n٢. (مستوى التطبيق) لماذا نحرّك العدسة الشيئية إلى أسفل ونحن ننظر من جانب المجهر؟\n   الإجابة: حتى لا تصطدم بالشريحة فتكسرها.\n٣. (مستوى الاستدلال) ما فائدة سطح حبة اللقاح الشائك؟\n   الإجابة: يزيد احتمال التصاقها بجسم الحشرة فتُنقل إلى زهرة أخرى.", "١. (مستوى المعرفة) سمِّ جزأين من أجزاء المجهر ووظيفتيهما.\n   الإجابة: العدسة الشيئية: تكبّر العيّنة؛ المسرح: توضع عليه الشريحة. (أو أي جزأين صحيحين)\n٢. (مستوى التطبيق) أيّ حبوب اللقاح أكبر غالبًا: لقاح الأزهار الحشرية أم الهوائية؟\n   الإجابة: لقاح الأزهار التي تلقحها الحشرات.\n٣. (مستوى الاستدلال) اقترح سببًا لكون لقاح الأزهار الهوائية أملس وخفيفًا.\n   الإجابة: ليُحمل بسهولة في الهواء ولا يحتاج إلى الالتصاق بحيوان.", "للطالب: حل ورقة العمل ١-٣(ب) «أجزاء المجهر» في كتاب النشاط ص٧٨. لولي الأمر: مراجعة أسماء أجزاء المجهر مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=3"]}], "comb": ["الحصة ١: مفهوم التلقيح وعوامله\n١. أن يعرّف التلقيح بأنه انتقال حبوب اللقاح من المتك إلى الميسم\n٢. أن يقارن بين التلقيح بالحشرات والطيور والتلقيح بالرياح\nمخرج تعليمي آخر: أن يميّز بين التلقيح وانتشار البذور\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\n١. أن يستخدم المجهر الضوئي استخدامًا صحيحًا آمنًا\n٢. أن يسمّي أجزاء المجهر ووظيفة كل منها\nمخرج تعليمي آخر: أن يقارن بين حبوب لقاح زهرتين من حيث الشكل والحجم", "الحصة ١: مفهوم التلقيح وعوامله\nالمخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\nالمخرج ١: تطبيق\nالمخرج ٢: تذكر\nالمخرج الآخر: تحليل", "الحصة ١: مفهوم التلقيح وعوامله\n- التعلم بالاكتشاف\n- التعلم التشاركي\n- التعلم المبني على اللعب\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة", "الحصة ١: مفهوم التلقيح وعوامله\ -٣(ب)، وينمذج ضبط التركيز: خفض العدسة الشيئية بالنظر من الجانب ثم رفعها أثناء النظر في العدسة العينية، ويسمّي الطالب الأجزاء على الرسم ويتدرّب على الضبط (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. ٣ فحص حبوب اللقاح: يتابع المجموعات أثناء نقل حبوب اللقاح من المتك إلى الشريحة وفحصها، وينبّه إلى الحساسية، ويحضّر الطالب الشريحة ويرسم ما يراه لحبوب لقاح زهرتين ويقارن (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يناقش المعلم: لماذا تكون بعض حبوب اللقاح شائكة؟ ويطرح التقويم الختامي، ويعرض الطالب رسمه ويجيب (8 دقائق)\nالاستراتيجيات: المناقشة والتقويم.", "الحصة ١: مفهوم التلقيح وعوامله\n١. (مستوى المعرفة) ما التلقيح؟\n   الإجابة: انتقال حبوب اللقاح من المتك إلى الميسم.\n٢. (مستوى التطبيق) اذكر ثلاثة عوامل تنقل حبوب اللقاح.\n   الإجابة: الحشرات، الطيور، الرياح.\n٣. (مستوى الاستدلال) لماذا تكون حبوب لقاح الأزهار التي تلقحها الرياح خفيفة وكثيرة؟\n   الإجابة: لتحملها الرياح بسهولة لمسافات بعيدة، ولأن احتمال وصول كل حبة إلى ميسم ضعيف فيلزم عدد كبير.\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\n١. (مستوى المعرفة) ما العدسة التي ننظر من خلالها في المجهر؟\n   الإجابة: العدسة العينية.\n٢. (مستوى التطبيق) لماذا نحرّك العدسة الشيئية إلى أسفل ونحن ننظر من جانب المجهر؟\n   الإجابة: حتى لا تصطدم بالشريحة فتكسرها.\n٣. (مستوى الاستدلال) ما فائدة سطح حبة اللقاح الشائك؟\n   الإجابة: يزيد احتمال التصاقها بجسم الحشرة فتُنقل إلى زهرة أخرى.", "الحصة ١: مفهوم التلقيح وعوامله\n١. (مستوى المعرفة) من أين تنتقل حبوب اللقاح وإلى أين؟\n   الإجابة: من المتك إلى الميسم.\n٢. (مستوى التطبيق) ما الذي يجذب الحشرات إلى الزهرة؟\n   الإجابة: البتلات الزاهية والرائحة والرحيق.\n٣. (مستوى الاستدلال) هل الحشرة تقصد نقل حبوب اللقاح؟ فسّر.\n   الإجابة: لا؛ تأتي لتتغذى على الرحيق فتلتصق حبوب اللقاح بجسمها وتنتقل عرَضًا إلى زهرة أخرى.\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\n١. (مستوى المعرفة) سمِّ جزأين من أجزاء المجهر ووظيفتيهما.\n   الإجابة: العدسة الشيئية: تكبّر العيّنة؛ المسرح: توضع عليه الشريحة. (أو أي جزأين صحيحين)\n٢. (مستوى التطبيق) أيّ حبوب اللقاح أكبر غالبًا: لقاح الأزهار الحشرية أم الهوائية؟\n   الإجابة: لقاح الأزهار التي تلقحها الحشرات.\n٣. (مستوى الاستدلال) اقترح سببًا لكون لقاح الأزهار الهوائية أملس وخفيفًا.\n   الإجابة: ليُحمل بسهولة في الهواء ولا يحتاج إلى الالتصاق بحيوان.", "الحصة ١: مفهوم التلقيح وعوامله\nللطالب: قراءة كتاب الطالب ص١٨–١٩ وحل الأسئلة ١–٤. لولي الأمر: ملاحظة الحشرات التي تزور أزهار الحديقة مع الابن.\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\nللطالب: حل ورقة العمل ١-٣(ب) «أجزاء المجهر» في كتاب النشاط ص٧٨. لولي الأمر: مراجعة أسماء أجزاء المجهر مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=3"]}, {"id": "1-4", "t": "١-٤ الإخصاب", "u": "١: النبات والإنسان ككائنات حيّة", "w": "الأول (٦–١٠/٩/٢٠٢٦)", "sp": "ص ٢٠–٢١", "tp": "ص ٤١", "ap": "—", "unit": 1, "np": 1, "sep": [{"n": 1, "axis": "الإخصاب وتكوين البذرة", "f": ["١. أن يصف انتقال المشيج الذكري عبر أنبوب اللقاح إلى البويضة\n٢. أن يعرّف الإخصاب والبويضة الملقحة (الزيجوت)\nمخرج تعليمي آخر: أن يحدّد أجزاء البذرة: الغلاف والفلقتين والجنين", "المخرج ١: فهم\nالمخرج ٢: تذكر\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بذور فول منقوعة، عدسات مكبرة، إبر تشريح", "الإخصاب، المشيج، أنبوب اللقاح، البويضة، الزيجوت (البويضة الملقحة)، الجنين، البذرة، الفلقة، غلاف البذرة.", "سؤال تذكيري: ماذا يحدث لحبة اللقاح بعد أن تصل إلى الميسم؟ واستدعاء أن حبوب اللقاح تحتوي الأمشاج الذكرية ولا تكون هي الأمشاج.", "1. التهيئة: يطرح المعلم السؤال التذكيري ويصحّح المفهوم الخاطئ أن حبة اللقاح كلها تنتقل إلى البويضة، ويتوقّع الطالب ما يحدث (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نمو أنبوب اللقاح والإخصاب: ينمذج المعلم بالرسم المتسلسل على السبورة الذكية نمو الأنبوب عبر القلم إلى المبيض واندماج النواتين، ويرسم الطالب المخطط في الدفتر ويكتب تعريف الإخصاب والزيجوت (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. من البويضة إلى البذرة: يوضّح المعلم أن الزيجوت ينمو جنينًا وأن البويضة تصبح بذرة، ويكمل الطالب سلسلة: تلقيح ← إخصاب ← زيجوت ← جنين ← بذرة (5 دقائق)\nالاست  تحسينًا يزيد دقة النتائج.\n   الإجابة: استخدام ارتفاع أكبر، أو تقليل تيارات الهواء، أو تكرار القياس عددًا أكبر من المرات.", "الحصة ١: تكوّن الثمار وانتشار البذور\nللطالب: قراءة كتاب الطالب ص٢٢–٢٣ وإحضار ثمرة منزلية مختلفة للحصة القادمة. لولي الأمر: مساعدة الابن في ملاحظة بذور الثمار أثناء تناول الطعام.\n\nالحصة ٢: استقصاء: أفضل أجنحة لإبقاء الثمرة في الهواء\nللطالب: حل تمرين ١-٥ «الأزهار والتكاثر» في كتاب النشاط ص٢٢. لولي الأمر: مساعدة الابن في مراجعة مصطلحات الوحدة: التلقيح، الإخصاب، الثمرة، الانتشار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=5"]}, {"id": "1-6", "t": "١-٦ أجهزة جسم الإنسان", "u": "١: النبات والإنسان ككائنات حيّة", "w": "الثاني (١٣–١٧/٩/٢٠٢٦)", "sp": "ص ٢٤–٢٥", "tp": "ص ٤٤–٤٥", "ap": "تمرين ١-٦ ص٢٤، ورقة العمل ١-٦ ص٧٩", "unit": 1, "np": 1, "sep": [{"n": 1, "axis": "الأجهزة الرئيسية في جسم الإنسان ووظائفها", "f": ["١. أن يحدّد مواضع الأعضاء الرئيسية في جسم الإنسان\n٢. أن يربط كل جهاز من أجهزة الجسم بأعضائه ووظيفته\nمخرج تعليمي آخر: أن يوضّح كيف تعمل الأجهزة معًا للحفاظ على حياة الإنسان", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل", "- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- صورة توضيحية\n- أخرى: مجسم الجذع البشري، بطاقات أعضاء وأجهزة", "العضو، الجهاز، الجهاز الهضمي، الجهاز التنفسي، جهاز الدوران، الجهاز العصبي، الجهاز الإخراجي، الجهاز التناسلي، الجهاز الهيكلي.", "تذكير بمفهوم «العضو» من درس النبات، ثم سؤال: ما العضو الذي يضخ الدم؟ وما العضو الذي يتحكم في الجسم؟", "1. التهيئة: يطرح المعلم أسئلة سريعة عن الأعضاء، ويجيب الطالب ويربط بمفهوم العضو (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الأجهزة الرئيسية: يعرض المعلم مجسم الجذع ويشرح مفهوم الجهاز (مجموعة أعضاء تعمل معًا) مع أمثلة من ص٢٤–٢٥، ويحدّد الطالب الأعضاء على المجسم ويدوّن الجهاز الذي ينتمي إليه كل عضو (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة بطاقات الأجهزة: يوزّع المعلم بطاقات (عضو، جهاز، وظيفة) ويطلب تكوين مجموعات صحيحة، ويطابق الطالب البطاقات ويعرض مجمو  الهيكل العظمي ووظائفه\n١. (مستوى المعرفة) ما العظم الذي يحمي الدماغ؟\n   الإجابة: الجمجمة.\n٢. (مستوى التطبيق) اذكر وظيفتين للهيكل العظمي.\n   الإجابة: دعم الجسم، حماية الأعضاء الداخلية (وأيضًا الحركة وإنتاج خلايا الدم).\n٣. (مستوى الاستدلال) لماذا يتكوّن العمود الفقري من فقرات كثيرة وليس عظمًا واحدًا؟\n   الإجابة: ليسمح بانحناء الظهر وحركته مع حماية الحبل الشوكي.\n\nالحصة ٢: استقصاء: هل تنكسر العظام الطويلة أسهل من القصيرة؟\n١. (مستوى المعرفة) ما المتغير المستقل في هذا الاستقصاء؟\n   الإجابة: طول عود السباغيتي (طول العظم).\n٢. (مستوى التطبيق) لماذا نستخدم سباغيتي بالسمك نفسه؟\n   الإجابة: لتثبيت متغير السمك فتكون المقارنة عادلة.\n٣. (مستوى الاستدلال) اذكر عيبًا لاستخدام السباغيتي نموذجًا للعظم.\n   الإجابة: العظم الحقيقي حي ومرن ومحاط بعضلات، وتركيبه يختلف عن السباغيتي.", "الحصة ١: تركيب الهيكل العظمي ووظائفه\n١. (مستوى المعرفة) ما الأعضاء التي يحميها القفص الصدري؟\n   الإجابة: القلب والرئتان.\n٢. (مستوى التطبيق) أين تُنتَج خلايا الدم؟\n   الإجابة: في نخاع العظام.\n٣. (مستوى الاستدلال) قارن بين وظيفة الجمجمة ووظيفة عظم الفخذ.\n   الإجابة: الجمجمة للحماية أساسًا، وعظم الفخذ للدعامة والحركة.\n\nالحصة ٢: استقصاء: هل تنكسر العظام الطويلة أسهل من القصيرة؟\n١. (مستوى المعرفة) ما المتغير التابع؟\n   الإجابة: الحمل (عدد الأوزان) اللازم لكسر العود.\n٢. (مستوى التطبيق) ماذا تستنتج من النتائج عادة؟\n   الإجابة: العود الأطول ينكسر بحمل أقل، أي أن العظام الطويلة أسهل كسرًا.\n٣. (مستوى الاستدلال) اقترح طريقة لجعل النتائج أكثر موثوقية.\n   الإجابة: تكرار الاختبار لكل طول عدة مرات وحساب المتوسط.", "الحصة ١: تركيب الهيكل العظمي ووظائفه\nللطالب: قراءة كتاب الطالب ص٢٦–٢٧. لولي الأمر: مناقشة أهمية الغذاء الغني بالكالسيوم لصحة العظام.\n\nالحصة ٢: استقصاء: هل تنكسر العظام الطويلة أسهل من القصيرة؟\nللطالب: حل تمرين ١-٧ «كسر العظام» في كتاب النشاط ص٢٥. لولي الأمر: التأكيد على سلوكيات السلامة لحماية العظام أثناء اللعب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=7"]}, {"id": "1-8", "t": "١-٨ المفاصل", "u": "١: النبات والإنسان ككائنات حيّة", "w نه يأخذ شكل الإناء ويحتفظ بحجمه وينساب وإن كان ببطء.", "للطالب: قراءة كتاب الطالب ص٣٦–٣٧ وحل الأسئلة ١–٣. لولي الأمر: البحث مع الابن عن أمثلة منزلية لكل حالة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=12"]}, {"n": 2, "axis": "تطبيق: تصنيف المواد وتمرين كتاب النشاط", "f": ["١. أن يطبّق خصائص الحالات في تصنيف مواد من الحياة اليومية\n٢. أن يمثّل خصائص الحالات في جدول منظّم\nمخرج تعليمي آخر: أن يقيّم صحة عبارات حول حالات المادة", "المخرج ١: تطبيق\nالمخرج ٢: تطبيق\nالمخرج الآخر: تقييم", "- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحالة الصلبة، السائلة، الغازية، الخاصية، التصنيف.", "لعبة «تحرّك كأنك…»: يتحرك الطلاب ككتلة متماسكة (صلب)، ثم ينزلقون متلاصقين (سائل)، ثم يتباعدون بسرعة (غاز).", "1. التهيئة: يدير المعلم لعبة الحركة، ويمثّل كل حالة بحركته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين ٢-١: يوجّه المعلم حل تمرين ٢-١ في كتاب النشاط ص٢٧، ويحل الطالب التمرين فرديًا ثم يقارن مع زميله (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. صواب أم خطأ؟: يعرض المعلم عبارات على السبورة الذكية حول الحالات، ويحكم الطالب على العبارة ويصحّح الخاطئ منها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الغلق: يطرح المعلم التقويم الختامي ويمهّد لنظرية الجزيئات، ويجيب الطالب ويطرح سؤالًا عن سبب اختلاف الحالات (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) هل للغاز شكل ثابت؟\n   الإجابة: لا، يأخذ شكل الوعاء.\n٢. (مستوى التطبيق) صنّف: زيت الطبخ، بخار الماء، الملح.\n   الإجابة: زيت: سائل؛ بخار الماء: غاز؛ الملح: صلب.\n٣. (مستوى الاستدلال) صحّح العبارة: «السوائل يسهل ضغطها مثل الغازات».\n   الإجابة: السوائل لا يمكن ضغطها تقريبًا، أما الغازات فيسهل ضغطها.", "١. (مستوى المعرفة) ما الحالة التي تنساب ولها حجم ثابت؟\n   الإجابة: السائلة.\n٢. (مستوى التطبيق) لماذا ينتشر الغاز ليملأ الغرفة كلها؟\n   الإجابة: لأن الغاز ليس له شكل ثابت ولا حجم ثابت فيملأ أي حيز يوضع فيه.\n٣. (مستوى الاستدلال) اقترح تجربة بسيطة تثبت شاط\n١. (مستوى المعرفة) هل للغاز شكل ثابت؟\n   الإجابة: لا، يأخذ شكل الوعاء.\n٢. (مستوى التطبيق) صنّف: زيت الطبخ، بخار الماء، الملح.\n   الإجابة: زيت: سائل؛ بخار الماء: غاز؛ الملح: صلب.\n٣. (مستوى الاستدلال) صحّح العبارة: «السوائل يسهل ضغطها مثل الغازات».\n   الإجابة: السوائل لا يمكن ضغطها تقريبًا، أما الغازات فيسهل ضغطها.", "الحصة ١: حالات المادة الثلاث وخصائص كل حالة\n١. (مستوى المعرفة) ما الحالة التي لها شكل ثابت وحجم ثابت؟\n   الإجابة: الحالة الصلبة.\n٢. (مستوى التطبيق) قارن بين السائل والغاز من حيث الحجم.\n   الإجابة: السائل حجمه ثابت، والغاز يملأ حجم الوعاء الذي يوضع فيه.\n٣. (مستوى الاستدلال) العسل ينساب ببطء. ما حالته؟ برّر.\n   الإجابة: سائل؛ لأنه يأخذ شكل الإناء ويحتفظ بحجمه وينساب وإن كان ببطء.\n\nالحصة ٢: تطبيق: تصنيف المواد وتمرين كتاب النشاط\n١. (مستوى المعرفة) ما الحالة التي تنساب ولها حجم ثابت؟\n   الإجابة: السائلة.\n٢. (مستوى التطبيق) لماذا ينتشر الغاز ليملأ الغرفة كلها؟\n   الإجابة: لأن الغاز ليس له شكل ثابت ولا حجم ثابت فيملأ أي حيز يوضع فيه.\n٣. (مستوى الاستدلال) اقترح تجربة بسيطة تثبت أن الغاز قابل للانضغاط والسائل غير قابل.\n   الإجابة: سد فوهة محقنة مملوءة هواءً والضغط على المكبس فيتحرك، ثم تكرار ذلك بمحقنة مملوءة ماءً فلا يتحرك تقريبًا.", "الحصة ١: حالات المادة الثلاث وخصائص كل حالة\nللطالب: قراءة كتاب الطالب ص٣٦–٣٧ وحل الأسئلة ١–٣. لولي الأمر: البحث مع الابن عن أمثلة منزلية لكل حالة.\n\nالحصة ٢: تطبيق: تصنيف المواد وتمرين كتاب النشاط\nللطالب: إكمال تمرين ٢-١ في كتاب النشاط ص٢٧. لولي الأمر: مراجعة جدول خصائص الحالات مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=12"]}, {"id": "2-2", "t": "٢-٢ نظرية الجزيئات", "u": "٢: حالات المادّة", "w": "الرابع (٢٧/٩–١/١٠/٢٠٢٦)", "sp": "ص ٣٨–٣٩", "tp": "ص ٦٣–٦٤", "ap": "تمرين ٢-٢ ص٢٩", "unit": 2, "np": 2, "sep": [{"n": 1, "axis": "نظرية الجزيئات وترتيب الجزيئات في الحالات الثلاث", "f": ["١. أن يذكر أن كل المواد تتكوّن من جزيئات صغيرة جدًا في حركة دائمة\n٢. أن يصف ترتيب الجزيئات وحركتها في المواد الصلبة والسائلة والغازية\nمخرج تعليمي آخر: أن يرسم نماذج لتو نصهار؟\n   الإجابة: لأن الطاقة تُستخدم في التغلب على قوى التجاذب بين الجزيئات لا في رفع الحرارة.\n\nالحصة ٢: مراجعة الوحدة الثانية: الانتشار وضغط الغاز ومسابقة ختامية\n١. (مستوى المعرفة) ما الانتشار؟\n   الإجابة: انتقال الجزيئات من منطقة تركيز مرتفع إلى منطقة تركيز منخفض.\n٢. (مستوى التطبيق) ما سبب ضغط الغاز؟\n   الإجابة: تصادم جزيئاته بجدران الوعاء.\n٣. (مستوى الاستدلال) لماذا يزداد معدل الانتشار بارتفاع درجة الحرارة؟\n   الإجابة: لأن الجزيئات تتحرك أسرع.", "الحصة ١: مراجعة الوحدة الثانية: الحالات ونظرية الجزيئات وتغيرات الحالة\n١. (مستوى المعرفة) أيّ الحالات جزيئاتها أكثر تباعدًا؟\n   الإجابة: الغازية.\n٢. (مستوى التطبيق) فسّر: يمكن ضغط الغاز ولا يمكن ضغط السائل.\n   الإجابة: بين جزيئات الغاز مسافات كبيرة، أما جزيئات السائل فمتقاربة.\n٣. (مستوى الاستدلال) ارسم مخططًا يوضح تغيرات الحالة الخمس بين الحالات الثلاث.\n   الإجابة: مخطط بالأسهم: صلب→سائل (انصهار)، سائل→صلب (تجمّد)، سائل→غاز (غليان/تبخّر)، غاز→سائل (تكثّف).\n\nالحصة ٢: مراجعة الوحدة الثانية: الانتشار وضغط الغاز ومسابقة ختامية\n١. (مستوى المعرفة) اذكر مثالًا على الانتشار.\n   الإجابة: انتشار رائحة العطر في الغرفة.\n٢. (مستوى التطبيق) ماذا يحدث لضغط الهواء في إطار عند تسخينه؟\n   الإجابة: يزداد.\n٣. (مستوى الاستدلال) لماذا ينتفخ كيس رقائق البطاطس المغلق في الأماكن المرتفعة؟\n   الإجابة: لأن الضغط الجوي خارجه يقل بينما يبقى ضغط الهواء داخله أكبر نسبيًا فيتمدد.", "الحصة ١: مراجعة الوحدة الثانية: الحالات ونظرية الجزيئات وتغيرات الحالة\nللطالب: مراجعة كتاب الطالب ص٣٦–٤٣. لولي الأمر: مساعدة الابن في مراجعة المخطط.\n\nالحصة ٢: مراجعة الوحدة الثانية: الانتشار وضغط الغاز ومسابقة ختامية\nللطالب: مراجعة كتاب الطالب ص٤٤–٥١ وقراءة ص٥٢ تمهيدًا لوحدة الطاقة. لولي الأمر: متابعة مراجعة الابن للوحدة الثانية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=19"]}, {"id": "3-1", "t": "٣-١ استخدام الطاقة", "u": "٣: الطاقة", "w": "السادس (١١–١٥/١٠/٢٠٢٦)", "sp": "ص ٥٢–٥٣", "tp": "ص ١٠٤–١٠٦", "ap": "تمرين ٣-١ ص٤١", "unit": 3, "np": 3, "sep": [{"n": 1, "axis": "الطاقة ضرورية لحدوث أي شيء", "f": ["١. أن يذكر أن أي نشاط يتطلب إمدادًا بالطاقة\n٢. أن يوضّح أن الإنسان يحصل على طاقته من الغذاء والآلات من الوقود والكهرباء\nمخرج تعليمي آخر: أن يربط بين بذل قوة لتحريك جسم واستهلاك مخزون الطاقة في الجسم", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بكرة وحبل وثقل، زنبرك قوي، بالونات", "الطاقة، إمدادات الطاقة، الغذاء، الوقود، الكهرباء، القوة.", "سؤال مفتوح: ماذا فعلت منذ استيقظت صباحًا؟ ومن أين جاءتك الطاقة لتفعله؟ وتسجيل الأنشطة على السبورة.", "1. التهيئة: يطرح المعلم السؤال ويسجّل الأنشطة، ويذكر الطالب أنشطته اليومية ومصدر طاقته (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. إمدادات الطاقة: يشرح المعلم أن الطاقة لازمة لجعل أي شيء يحدث، ويعرض صور الطائرة والسيارة وأبراج الكهرباء، ويصنّف الطالب الأمثلة حسب مصدر الطاقة: غذاء، وقود، كهرباء (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ١(أ) الأنشطة التي تتطلب طاقة: يجهّز المعلم محطات: رفع ثقل ببكرة، ضغط زنبرك وسحبه، نفخ بالون، ويتنقل الطالب بين المحطات ويحدّد القوة المبذولة ومن أين جاءت الطاقة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. يربط المعلم بين بذل القوة واستهلاك مخزون الطاقة في الجسم ويصحّح فكرة «اكتساب الطاقة بالرياضة»، ويجيب الطالب عن السؤال ١ في الكتاب (5 دقائق)\nالاستراتيجيات: المناقشة.\n\n5. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) من أين يحصل جسم الإنسان على الطاقة؟\n   الإجابة: من الغذاء.\n٢. (مستوى التطبيق) اذكر نشاطين يحتاجان إلى طاقة.\n   الإجابة: الجري، رفع حقيبة (أو أي نشاطين صحيحين).\n٣. (مستوى الاستدلال) يقول زميلك إن التمارين الرياضية تمنحه طاقة. صحّح العبارة.\n   الإجابة: التمارين تستهلك جزءًا من الطاقة المخزّنة في الجسم ولا تزيدها، وإن شعر بالنشاط.", "١. (مستوى المعرفة) من أين تحصل السيارة على الطاقة؟\n   الإجابة: من الوقود.\n٢. (مستوى التطبيق) عند رفع ثقل بالبكرة، ما مصدر الطاقة المستخدمة؟\n   الإجابة: الطاقة المخزّنة في جسم الطالب (من الغذاء).\n٣. (مستوى الاستدلال) فسّر: يمكن لحجر أن يبقى على الأرض مدة طويلة دون حاجة إلى طاقة، لكن رفعه يحتاج إلى طاقة.\n   الإجابة: لأن الطاقة تلزم عند حدوث تغيّر (تحريك الجسم ببذل قوة)، ولا تلزم ما دام الحجر ساكنًا.", "للطالب: قراءة كتاب الطالب ص٥٢–٥٣ وتسجيل ثلاثة أنشطة يومية تحتاج إلى طاقة. لولي الأمر: مناقشة مصادر الطاقة في المنزل (الكهرباء، الغاز) مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=20"]}, {"n": 2, "axis": "عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟", "f": ["١. أن يتتبّع وصول إمدادات الطاقة (الوقود والكهرباء) إلى المنزل والحي\n٢. أن يوضّح أن الكهرباء وسيلة لنقل الطاقة من محطات التوليد عبر الأسلاك\nمخرج تعليمي آخر: أن يقترح طرقًا لترشيد استهلاك الطاقة في المنزل والمدرسة", "المخرج ١: فهم\nالمخرج ٢: فهم\nالمخرج الآخر: إبداع", "- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "إمدادات الطاقة، محطة توليد الكهرباء، الكابلات، الوقود، الترشيد.", "عرض صورة أبراج نقل الكهرباء في ص٥٣ وسؤال: كيف تصل الكهرباء إلى منزلك؟", "1. التهيئة: يعرض المعلم الصورة ويطرح السؤال، ويتوقّع الطالب مسار الكهرباء (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. ١(ب) عالم الطاقة: يوزّع المعلم أسئلة النشاط على المجموعات: محطات الوقود، الوقود المنزلي، محطة الكهرباء، آبار النفط، وتناقش المجموعة وتنشئ قائمة بأفكارها على Padlet أو ورقة كبيرة (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض المجموعات: يدير المعلم العرض ويربط الأفكار بمفهوم نقل الطاقة، وتعرض المجموعة وتعلّق على أفكار غيرها (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. ترشيد الطاقة: يطرح المعلم: كيف نقلّل استهلاكنا للطاقة؟ ويقترح الطالب ثلاث أفكار عملية (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الغلق: يطرح المعلم سؤالًا ختاميًا، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) كيف تصل الكهرباء من محطة التوليد إلى المنازل؟\n   الإجابة: عبر كابلات (أسلاك) معدنية.\n٢. (مستوى التطبيق) اذكر نوعين من الوقود يستخدمان في المنازل.\n   الإجابة: الغاز، الكيروسين.\n٣. (مستوى الاستدلال) لماذا تُعدّ الكهرباء وسيلة جيدة لنقل الطاقة؟\n   الإجابة: لأنها تنقل الطاقة بسرعة لمسافات بعيدة إلى حيث نحتاجها.", "١. (مستوى المعرفة) أين تُنتَج الكهرباء عادة؟\n   الإجابة: في محطات توليد كبيرة.\n٢. (مستوى التطبيق) اذكر سببًا لزيادة استهلاك الطاقة كلما تطورت البلدان.\n   الإجابة: زيادة استخدام السيارات والأجهزة والمصانع.\n٣. (مستوى الاستدلال) اقترح طريقتين لترشيد استهلاك الكهرباء في المدرسة.\n   الإجابة: إطفاء الأنوار والمكيفات عند مغادرة الصف، واستخدام الإضاءة الطبيعية.", "للطالب: البحث عن أقرب محطة توليد كهرباء لمنطقتك. لولي الأمر: مشاركة الابن في متابعة فاتورة الكهرباء وطرق الترشيد.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=20"]}, {"n": 3, "axis": "طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط", "f": ["١. أن يقرأ بيانات عن الطاقة المستخدمة في أنشطة مختلفة من جدول\n٢. أن يمثّل البيانات في رسم بياني خطي أو بالأعمدة\nمخرج تعليمي آخر: أن يستنتج علاقة بين سرعة الركض والطاقة المستهلكة", "المخرج ١: تطبيق\nالمخرج ٢: تطبيق\nالمخرج الآخر: تحليل", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورق رسم بياني", "الطاقة المستهلكة، الجول، الكيلوجول، الرسم البياني، الاستنتاج.", "سؤال: أيهما يستهلك طاقة أكبر في الدقيقة: المشي أم الركض أم ركوب الدراجة؟ وتسجيل التوقعات.", "1. التهيئة: يطرح المعلم السؤال، ويرتّب الطالب الأنشطة حسب توقعه (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تمرين ٣-١ طاقة الجسم: يوجّه المعلم قراءة الجدول واختيار المقياس ورسم البيانات في كتاب النشاط ص٤١، ويرسم الطالب العلاقة بين سرعة الركض والطاقة المستخدمة ويجيب عن الأسئلة (20 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يناقش المعلم: لماذا يستهلك الركض طاقة أكثر من ركوب الدراجة؟ ويقارن الطالب ويبرّر (8 دقائق)\nالاستراتيجيات: المناقشة.\n\n4. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب فرديًا (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "١. (مستوى المعرفة) ما وحدة قياس الطاقة؟\n   الإجابة: الجول.\n٢. (مستوى التطبيق) ماذا يحدث للطاقة المستخدمة كلما زادت سرعة n- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بكرة وحبل وثقل، زنبرك قوي، بالونات\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورق رسم بياني", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\nالطاقة، إمدادات الطاقة، الغذاء، الوقود، الكهرباء، القوة.\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\nإمدادات الطاقة، محطة توليد الكهرباء، الكابلات، الوقود، الترشيد.\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\nالطاقة المستهلكة، الجول، الكيلوجول، الرسم البياني، الاستنتاج.", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\nسؤال مفتوح: ماذا فعلت منذ استيقظت صباحًا؟ ومن أين جاءتك الطاقة لتفعله؟ وتسجيل الأنشطة على السبورة.\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\nعرض صورة أبراج نقل الكهرباء في ص٥٣ وسؤال: كيف تصل الكهرباء إلى منزلك؟\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\nسؤال: أيهما يستهلك طاقة أكبر في الدقيقة: المشي أم الركض أم ركوب الدراجة؟ وتسجيل التوقعات.", "الحصة 1: الطاقة ضرورية لحدوث أي شيء — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال ويسجّل الأنشطة، ويذكر الطالب أنشطته اليومية ومصدر طاقته (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. إمدادات الطاقة: يشرح المعلم أن الطاقة لازمة لجعل أي شيء يحدث، ويعرض صور الطائرة والسيارة وأبراج الكهرباء، ويصنّف الطالب الأمثلة حسب مصدر الطاقة: غذاء، وقود، كهرباء (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ١(أ) الأنشطة التي تتطلب طاقة: يجهّز المعلم محطات: رفع ثقل ببكرة، ضغط زنبرك وسحبه، نفخ بالون، ويتنقل الطالب بين المحطات ويحدّد القوة المبذولة ومن أين جاءت الطاقة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. يربط المعلم بين بذل القوة واستهلاك مخزون الطاقة في الجسم ويصحّح فكرة «اكتساب الطاقة بالرياضة»، ويجيب الطالب عن السؤال ١ في الكتاب (5 دقائق)\nالاستراتيجيات: المناقشة.\n\n5. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟ — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الصورة ويطرح السؤال، ويتوقّع الطالب مسار الكهرباء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ١(ب) عالم الطاقة: يوزّع المعلم أسئلة النشاط على المجموعات: محطات الوقود، الوقود المنزلي، محطة الكهرباء، آبار النفط، وتناقش المجموعة وتنشئ قائمة بأفكارها على Padlet أو ورقة كبيرة (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض المجموعات: يدير المعلم العرض ويربط الأفكار بمفهوم نقل الطاقة، وتعرض المجموعة وتعلّق على أفكار غيرها (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. ترشيد الطاقة: يطرح المعلم: كيف نقلّل استهلاكنا للطاقة؟ ويقترح الطالب ثلاث أفكار عملية (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الغلق: يطرح المعلم سؤالًا ختاميًا، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 3: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويرتّب الطالب الأنشطة حسب توقعه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تمرين ٣-١ طاقة الجسم: يوجّه المعلم قراءة الجدول واختيار المقياس ورسم البيانات في كتاب النشاط ص٤١، ويرسم الطالب العلاقة بين سرعة الركض والطاقة المستخدمة ويجيب عن الأسئلة (20 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يناقش المعلم: لماذا يستهلك الركض طاقة أكثر من ركوب الدراجة؟ ويقارن الطالب ويبرّر (8 دقائق)\nالاستراتيجيات: المناقشة.\n\n4. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب فرديًا (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\n١. (مستوى المعرفة) من أين يحصل جسم الإنسان على الطاقة؟\n   الإجابة: من الغذاء.\n٢. (مستوى التطبيق) اذكر نشاطين يحتاجان إلى طاقة.\n   الإجابة: الجري، رفع حقيبة (أو أي نشاطين صحيحين).\n٣. (مستوى الاستدلال) يقول زميلك إن التمارين الرياضية تمنحه طاقة. صحّح العبارة.\n   الإجابة: التمارين تستهلك جزءًا من الطاقة المخزّنة في الجسم ولا تزيدها، وإن شعر بالنشاط.\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\n١. (مستوى المعرفة) كيف تصل الكهرباء من محطة التوليد إلى المنازل؟\n   الإجابة: عبر كابلات (أسلاك) معدنية.\n٢. (مستوى التطبيق) اذكر نوعين من الوقود يستخدمان في المنازل.\n   الإجابة: الغاز، الكيروسين.\n٣. (مستوى الاستدلال) لماذا تُعدّ الكهرباء وسيلة جيدة لنقل الطاقة؟\n   الإجابة: لأنها تنقل الطاقة بسرعة لمسافات بعيدة إلى حيث نحتاجها.\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\n١. (مستوى المعرفة) ما وحدة قياس الطاقة؟\n   الإجابة: الجول.\n٢. (مستوى التطبيق) ماذا يحدث للطاقة المستخدمة كلما زادت سرعة الركض؟\n   الإجابة: تزداد.\n٣. (مستوى الاستدلال) شخصان: الأول يستخدم ٦٠ كيلوجول في الدقيقة والثاني ٣٨. أيهما أكثر نشاطًا؟ وكم الفرق؟\n   الإجابة: الأول؛ والفرق ٢٢ كيلوجول في الدقيقة.", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\n١. (مستوى المعرفة) من أين تحصل السيارة على الطاقة؟\n   الإجابة: من الوقود.\n٢. (مستوى التطبيق) عند رفع ثقل بالبكرة، ما مصدر الطاقة المستخدمة؟\n   الإجابة: الطاقة المخزّنة في جسم الطالب (من الغذاء).\n٣. (مستوى الاستدلال) فسّر: يمكن لحجر أن يبقى على الأرض مدة طويلة دون حاجة إلى طاقة، لكن رفعه يحتاج إلى طاقة.\n   الإجابة: لأن الطاقة تلزم عند حدوث تغيّر (تحريك الجسم ببذل قوة)، ولا تلزم ما دام الحجر ساكنًا.\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\n١. (مستوى المعرفة) أين تُنتَج الكهرباء عادة؟\n   الإجابة: في محطات توليد كبيرة.\n٢. (مستوى التطبيق) اذكر سببًا لزيادة استهلاك الطاقة كلما تطورت البلدان.\n   الإجابة: زيادة استخدام السيارات والأجهزة والمصانع.\n٣. (مستوى الاستدلال) اقترح طريقتين لترشيد استهلاك الكهرباء في المدرسة.\n   الإجابة: إطفاء الأنوار والمكيفات عند مغادرة الصف، واستخدام الإضاءة الطبيعية.\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\n١. (مستوى المعرفة) على أي محور نضع سرعة الركض؟\n   الإجابة: المحور الأفقي.\n٢. (مستوى التطبيق) هل ركوب الدراجة أكفأ من الركض في استهلاك الطاقة؟ فسّر.\n   الإجابة: نعم، لأنه يستهلك طاقة أقل في الدقيقة لقطع مسافة مماثلة.\n٣. (مستوى الاستدلال) اقترح سببًا لاختلاف الطاقة المستهلكة بين شخصين يمارسان النشاط نفسه.\n   الإجابة: اختلاف الكتلة أو السرعة أو اللياقة البدنية.", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\nللطالب: قراءة كتاب الطالب ص٥٢–٥٣ وتسجيل ثلاثة أنشطة يومية تحتاج إلى طاقة. لولي الأمر: مناقشة مصادر الطاقة في المنزل (الكهرباء، الغاز) مع الابن.\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\nللطالب: البحث عن أقرب محطة توليد كهرباء لمنطقتك. لولي الأمر: مشاركة الابن في متابعة فاتورة الكهرباء وطرق الترشيد.\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\nللطالب: إكمال تمرين ٣-١ «طاقة الجسم» في كتاب النشاط ص٤١. لولي الأمر: الاطلاع مع الابن على ملصق القيم الغذائية لمعرفة طاقة الأطعمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=20"]}, {"id": "3-2", "t": "٣-٢ المخازن الكيميائية للطاقة", "u": "٣: الطاقة", "w": "السادس (١١–١٥/١٠/٢٠٢٦)", "sp": "ص ٥٤–٥٥", "tp": "ص ١٠٧–١٠٩", "ap": "تمرين ٣-٢ ص٤٤، ورقة العمل ٣-٢ ص٩٧", "unit": 3, "np": 3, "sep": [{"n": 1, "axis": "الغذاء والوقود والبطاريات مخازن كيميائية للطاقة", "f": ["١. أن يحدّد أمثلة على مخازن الطاقة الكيميائية: الغذاء والوقود والبطاريات\n٢. أن يوضّح أن الطاقة الكيميائية تتحرّر بحدوث تفاعل كيميائي\nمخرج تعليمي آخر: أن يقارن بين البطاريات العادية والقابلة لإعادة الشحن بيئيًا", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مصباح يدوي وبطاريات، عينات أغذية، صورة لوقود", "مخزن الطاقة الكيميائية، التفاعل الكيميائي، الاحتراق، البطارية، إعادة الشحن.", "تشغيل مصباح يدوي ثم نزع بطاريته، وسؤال: من أين جاءت الطاقة التي أضاءته؟", "1. التهيئة: يجري المعلم العرض ويطرح السؤال، ويقترح الطالب أن البطارية مخزن للطاقة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المخازن الكيميائية: يشرح المعلم ما يجمع الغذاء والوقود والبطاريات: مواد كيميائية تطلق طاقتها بتفاعل كيميائي، ويصنّف الطالب أمثلة ويكتب كيف تتحرّر طاقة كل منها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. البطاريات والبيئة: يناقش ا رية نفدت طاقتها؟\n   الإجابة: أصبحت فارغة (منتهية).\n٢. (مستوى التطبيق) كيف يحصل الجسم على الطاقة من الغذاء؟\n   الإجابة: بحدوث تفاعل كيميائي داخل الجسم.\n٣. (مستوى الاستدلال) لماذا لا يجوز فتح البطارية؟\n   الإجابة: لأن المواد الكيميائية داخلها قد تكون خطرة.\n\nالحصة ٢: نشاط ٣-٢ الطاقة من الوقود: تسخين الماء بشمعة\n١. (مستوى المعرفة) ما مخزن الطاقة في الشمعة؟\n   الإجابة: مخزن الطاقة الكيميائية.\n٢. (مستوى التطبيق) لماذا نستخدم ساعة إيقاف؟\n   الإجابة: لقياس الزمن بدقة على فترات منتظمة.\n٣. (مستوى الاستدلال) اقترح سببًا لعدم ارتفاع الحرارة بمعدل ثابت تمامًا.\n   الإجابة: فقدان جزء من الطاقة إلى الهواء المحيط، أو تغيّر حجم اللهب، أو تيارات الهواء.\n\nالحصة ٣: تطبيقات المخازن الكيميائية: تمرين كتاب النشاط وورقة البطاريات\n١. (مستوى المعرفة) ما الذي تشترك فيه مخازن الطاقة الكيميائية؟\n   الإجابة: أنها مواد كيميائية تطلق طاقتها بتفاعل كيميائي.\n٢. (مستوى التطبيق) اذكر مخزنًا كيميائيًا في جسمك.\n   الإجابة: الغذاء المهضوم أو الدهون المخزّنة.\n٣. (مستوى الاستدلال) قيّم: «البنزين أفضل من البطارية لكل الأجهزة».\n   الإجابة: عبارة غير صحيحة؛ البنزين مناسب للمحركات، والبطارية مناسبة للأجهزة الصغيرة المحمولة لأنها آمنة وسهلة الاستخدام.", "الحصة ١: الغذاء والوقود والبطاريات مخازن كيميائية للطاقة\nللطالب: قراءة كتاب الطالب ص٥٤–٥٥. لولي الأمر: تخصيص مكان آمن في المنزل لجمع البطاريات المستعملة للتخلص منها بطريقة صحيحة.\n\nالحصة ٢: نشاط ٣-٢ الطاقة من الوقود: تسخين الماء بشمعة\nللطالب: إكمال الرسم البياني والاستنتاج في الدفتر. لولي الأمر: التنبيه على السلامة عند التعامل مع اللهب في المنزل.\n\nالحصة ٣: تطبيقات المخازن الكيميائية: تمرين كتاب النشاط وورقة البطاريات\nللطالب: إكمال تمرين ٣-٢ ص٤٤ وورقة العمل ٣-٢ ص٩٧ في كتاب النشاط. لولي الأمر: متابعة إنجاز الواجب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=21"]}, {"id": "3-3", "t": "٣-٣ مخازن أخرى للطاقة", "u": "٣: الطاقة", "w": "السابع (١٨–٢٢/١٠/٢٠٢٦)", "sp": "ص ٥٦–٥٧", "tp": "ص ١١٠–١١١", "ap": "—", "unit": 3, "np": 2, "sep": [{"n": 1, "axis": "مخزن الطاقة المرنة ومخزن طاقة الجاذبية الأرضية ذج.", "الحصة ١: مخزن الطاقة المرنة ومخزن طاقة الجاذبية الأرضية\nشدّ رباط مطاطي ثم إفلاته (بأمان نحو الأعلى)، وسؤال: من أين جاءت الطاقة التي حرّكته؟\n\nالحصة ٢: نشاط ٣-٣(ب) مصمّم الألعاب\nعرض لعبة الطفل «البطة النطاطة» أو المنجنيق الصغير، وسؤال: أين تُخزّن الطاقة فيها؟", "الحصة 1: مخزن الطاقة المرنة ومخزن طاقة الجاذبية الأرضية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يجري المعلم العرض ويطرح السؤال، ويتوقّع الطالب مصدر الطاقة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المخزن المرن: يشرح المعلم أن الجسم المبسوط أو المضغوط يخزّن طاقة مرنة، مع مثال الساعة ذات النابض، ويجيب الطالب عن السؤال ١ (أ، ب) (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مخزن الجاذبية الأرضية: يرفع المعلم كرة ويتركها ويشرح أن الجسم المرفوع يخزّن طاقة جاذبية أرضية (مثال المطرقة والسد)، ويذكر الطالب أمثلة أخرى (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. ٣(أ) ألعاب تعمل بالطاقة: يوزّع المعلم الألعاب على المجموعات، وتحدّد المجموعة مخزن الطاقة في كل لعبة وتصنّفها في جدول (12 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: نشاط ٣-٣(ب) مصمّم الألعاب — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم اللعبة ويطرح السؤال، ويحدّد الطالب المخزن (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. معايير التصميم: يعرض المعلم معايير: آمنة لطفل، تستخدم المخزن المطلوب، رسم واضح بملاحظات، ويدوّن الطالب المعايير (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تنفيذ التصميم: يتابع المجموعات ويقدّم تغذية راجعة، وترسم المجموعة تصميمين بملاحظات توضح عملهما (18 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. المعرض والتقييم: يدير المعلم جولة معرض ونجمة إعجاب واقتراح تحسين، ويقيّم الطالب تصاميم الزملاء (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق: يلخّص المعلم الفرق بين المخزنين، ويجيب الطالب شفهيًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة ١: مخزن الطاقة المرنة ومخزن طاقة الجاذبية الأرضية\n١. (مستوى المعرفة) ما المخزن الذي يستخدمه نابض مضغوط؟\n   الإجابة: مخزن الطاقة المرنة.\n٢. (مستوى التطبيق) ما المخزن في ماء محجوز خلف سد؟\n   الإجابة: مخزن طاقة الجاذبية الأرضية.\n٣. (مستوى الاستدلال) على المنطة (الترامبولين): ما المخزن عند الضغط لأسفل؟ وعند الارتفاع في الهواء؟\n   الإجابة: عند الضغط: الطاقة المرنة في الطبقة المشدودة؛ عند الارتفاع: طاقة الجاذبية الأرضية.\n\nالحصة ٢: نشاط ٣-٣(ب) مصمّم الألعاب\n١. (مستوى المعرفة) ما مخزن الطاقة في لعبتك الأولى؟\n   الإجابة: مخزن الطاقة المرنة (إجابة حسب التصميم).\n٢. (مستوى التطبيق) كيف تتحرّر الطاقة في لعبة الجاذبية التي صمّمتها؟\n   الإجابة: عندما يسقط الجسم المرفوع أو ينزل على منحدر.\n٣. (مستوى الاستدلال) ما الذي يجعل اللعبة آمنة للطفل؟\n   الإجابة: قطع كبيرة لا تُبلع، حواف غير حادة، قوة إطلاق محدودة.", "الحصة ١: مخزن الطاقة المرنة ومخزن طاقة الجاذبية الأرضية\n١. (مستوى المعرفة) كيف نجعل الرباط المطاطي يخزّن طاقة؟\n   الإجابة: بشدّه (بسطه).\n٢. (مستوى التطبيق) لماذا يجب رفع المطرقة قبل الطرق؟\n   الإجابة: لتخزين طاقة جاذبية أرضية تُستخدم عند سقوطها لدق المسمار.\n٣. (مستوى الاستدلال) كيف تزود سيارة لعبة بطاقة جاذبية أرضية لتتحرك؟\n   الإجابة: بوضعها في أعلى منحدر ثم تركها تنزل.\n\nالحصة ٢: نشاط ٣-٣(ب) مصمّم الألعاب\n١. (مستوى المعرفة) صنّف: سيارة بزنبرك، أرجوحة مرفوعة.\n   الإجابة: الأولى: مخزن طاقة مرنة؛ الثانية: مخزن طاقة جاذبية أرضية.\n٢. (مستوى التطبيق) لماذا يعود النابض المضغوط إلى وضعه الأصلي؟\n   الإجابة: لأنه مرن ويحرّر الطاقة التي خزّنها.\n٣. (مستوى الاستدلال) اقترح تحسينًا لتصميم زميلك مع التبرير.\n   الإجابة: إجابة مفتوحة مبررة، مثل زيادة ارتفاع المنحدر لزيادة طاقة الجاذبية المخزّنة.", "الحصة ١: مخزن الطاقة المرنة ومخزن طاقة الجاذبية الأرضية\nللطالب: قراءة كتاب الطالب ص٥٦–٥٧. لولي الأمر: مساعدة الابن في تحديد مخازن الطاقة في ألعابه.\n\nالحصة ٢: نشاط ٣-٣(ب) مصمّم الألعاب\nللطالب: إكمال تصميم اللعبتين وتلوينه. لولي الأمر: تشجيع الابن على صنع نموذج بسيط لإحدى اللعبتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=22"]}, {"id": "3-4", "t": "٣-٤ طاقة الحركة", "u": "٣: الطاقة", "w": "السابع (١٨–٢٢/١٠/٢٠٢٦)", "sp": "ص ٥٨–٥٩", "tp": "ص ١١٢–١١٣", "ap": "—", "unit": 3, "np": 2, "sep": [{"n": 1, "axis": "طاقة الحركة والعوامل المؤثرة فيها", "f": ["١. أن يعرّف طاقة الحركة بأنها طاقة الجسم المتحرك\n٢. أن يوضّح أن طاقة الحركة تزداد بزيادة السرعة والكتلة\nمخرج تعليمي آخر: أن يستقصي أثر السرعة والكتلة على طاقة الحركة باستخدام كرات وصينية رمل", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- أخرى: صينية رمل رطب، كرات زجاجية بكتل مختلفة، مسطرة", "طاقة الحركة، السرعة، الكتلة، الكيلوغرام، الاستقصاء.", "عرض صورة لسائقي دراجات، وسؤال: من لديه طاقة حركة؟ ومن لديه طاقة حركة أكبر؟", "1. التهيئة: يعرض المعلم الصورة ويطرح السؤال، ويحدّد الطالب ويبرّر (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. طاقة الحركة: يشرح المعلم أن كل جسم متحرك له طاقة حركة، وأنها تزيد بالسرعة والكتلة، ويجيب الطالب عن السؤالين ١ و٢ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ٤(أ) مقارنات الطاقة الحركية: يوجّه المعلم المهمتين: إسقاط الكرة من ارتفاعين مختلفين، ثم إسقاط كرتين بكتلتين مختلفتين من الارتفاع نفسه، ويقيس الطالب عمق أو قطر العلامة في الرمل ويسجّل (17 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الاستنتاج: يناقش المعلم النتائج، ويكتب الطالب استنتاجين (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) ما طاقة الحركة؟\n   الإجابة: الطاقة التي يمتلكها الجسم المتحرك.\n٢. (مستوى التطبيق) أيهما له طاقة حركة أكبر: سيارة أم شاحنة تسيران بالسرعة نفسها؟\n   الإجابة: الشاحنة لأن كتلتها أكبر.\n٣. (مستوى الاستدلال) لماذا تكون العلامة في الرمل أكبر عند إسقاط الكرة من ارتفاع أعلى؟\n   الإجابة: لأن الكرة تصل بسرعة أكبر فتكون طاقة حركتها أكبر.", "١. (مستوى المعرفة) هل للجسم الساكن طاقة حركة؟\n   الإجابة: لا.\n٢. (مستوى التطبيق) ما المتغير الذي ثبّته عند مقارنة كتلتين؟\n   الإجابة: ارتفاع الإسقاط (السرعة).\n٣. (مستوى الاستدلال) اقترح طريقتين تجعل لنفسك طاقة حركة دون دراجة.\n   الإجابة: الجري، القفز (أو ماذا يحدث لطاقة حركة الدراجة عند الضغط على المكابح؟\n   الإجابة: تقل وتتحول إلى طاقة حرارية في المكابح.\n٢. (مستوى التطبيق) لماذا تسخن اليدان عند فركهما؟\n   الإجابة: بسبب الاحتكاك الذي يولّد حرارة.\n٣. (مستوى الاستدلال) لماذا تسخن مكابح السيارة أكثر من مكابح الدراجة؟\n   الإجابة: لأن طاقة حركة السيارة أكبر بكثير (كتلتها وسرعتها أكبر).", "الحصة ١: طاقة الحركة والعوامل المؤثرة فيها\n١. (مستوى المعرفة) هل للجسم الساكن طاقة حركة؟\n   الإجابة: لا.\n٢. (مستوى التطبيق) ما المتغير الذي ثبّته عند مقارنة كتلتين؟\n   الإجابة: ارتفاع الإسقاط (السرعة).\n٣. (مستوى الاستدلال) اقترح طريقتين تجعل لنفسك طاقة حركة دون دراجة.\n   الإجابة: الجري، القفز (أو السباحة).\n\nالحصة ٢: الاحتكاك يقلّل طاقة الحركة ويولّد حرارة\n١. (مستوى المعرفة) ما القوة التي تبطئ الأجسام المتحركة؟\n   الإجابة: قوة الاحتكاك.\n٢. (مستوى التطبيق) ماذا يحدث للهواء عند احتكاك السيارة به؟\n   الإجابة: يسخن قليلًا.\n٣. (مستوى الاستدلال) اقترح طريقة لتقليل الاحتكاك في آلة.\n   الإجابة: استخدام الزيوت أو التشحيم أو العجلات.", "الحصة ١: طاقة الحركة والعوامل المؤثرة فيها\nللطالب: قراءة كتاب الطالب ص٥٨. لولي الأمر: مناقشة سبب خطورة السرعة العالية على الطرق.\n\nالحصة ٢: الاحتكاك يقلّل طاقة الحركة ويولّد حرارة\nللطالب: قراءة كتاب الطالب ص٥٩ وحل أسئلته. لولي الأمر: ملاحظة سخونة إطارات السيارة بعد القيادة مع الابن بأمان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=23"]}, {"id": "3-5", "t": "٣-٥ الطاقة الحرارية", "u": "٣: الطاقة", "w": "السابع (١٨–٢٢/١٠/٢٠٢٦)", "sp": "ص ٦٠–٦١", "tp": "ص ١١٤–١١٦", "ap": "تمرين ٣-٥ ص٤٥، ورقتا العمل ٣-٥(أ) ص٩٨ و٣-٥(ب) ص١٠٠", "unit": 3, "np": 2, "sep": [{"n": 1, "axis": "الأجسام الساخنة مخازن للطاقة الحرارية", "f": ["١. أن يوضّح أن الجسم الساخن مخزن للطاقة الحرارية\n٢. أن يتنبأ بدرجة حرارة خليط كميتين متساويتين من الماء الساخن والبارد ثم يختبر تنبؤه\nمخرج تعليمي آخر: أن يفسّر أن الجسم الأكبر يخزّن طاقة حرارية أكبر عند الدرجة نفسها", "المخرج ١: فهم\nالمخرج ٢: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل الم ؟»: يرفع الطالب بطاقة خضراء للمخزن وزرقاء للنقل عند سماع كل مصطلح.", "الحصة 1: نقل الطاقة بالكهرباء والضوء والحرارة المنبعثة والصوت — زمن الحصة 40 دقيقة\n\n1. التهيئة: يجري المعلم العرض ويطرح السؤالين، ويتوقّع الطالب الإجابة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الكهرباء والإشعاع: يشرح المعلم نقل الطاقة بالكهرباء، وانبعاث الضوء والحرارة من الأجسام الساخنة، ويجيب الطالب عن السؤالين ١ و٢ (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الصوت ينقل الطاقة: يقرع المعلم طبلًا أو شوكة رنانة ويشرح أن الاهتزازات تنقل الطاقة عبر الهواء، ويلمس الطالب الشوكة المهتزة بحذر ويصف (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. ٦ انتقال الطاقة: يجهّز المعلم تجارب قصيرة ويطلب تحديد نوع الانتقال في كل منها، ويحدّد الطالب النوع ويذكر مثالًا آخر لكل نوع (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: تخزين الطاقة ونقلها: تمرين كتاب النشاط — زمن الحصة 40 دقيقة\n\n1. التهيئة: يدير المعلم لعبة البطاقات، ويرفع الطالب البطاقة المناسبة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين ٣-٦ تخزين الطاقة ونقلها: يوجّه المعلم حل التمرين في كتاب النشاط ص٤٧ مع الورقة الداعمة، ويحل الطالب فرديًا ثم يقارن مع زميله (18 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تحليل مواقف: يعرض المعلم: هاتف يرن وهو يشحن، شمس تدفئ الأرض، ويحدّد الطالب المخازن وطرق النقل في كل موقف (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الغلق: يطرح المعلم التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة ١: نقل الطاقة بالكهرباء والضوء والحرارة المنبعثة والصوت\n١. (مستوى المعرفة) ما نوع الطاقة التي تصل إلى المصباح؟\n   الإجابة: الطاقة الكهربائية.\n٢. (مستوى التطبيق) ما نوعا الطاقة اللذان ينبعثان من المصباح المضاء؟\n   الإجابة: الطاقة الضوئية والطاقة الحرارية المنبعثة.\n٣. (مستوى الاستدلال) كيف تصل طاقة صوت الطبل إلى أذنك؟\n   الإجابة: بالاهتزازات التي تنتقل عبر الهواء.\n\nالحصة ٢: تخزين الطاقة ونقلها: تمرين كتاب النشاط\n١. (مستوى المعرفة) صنّف: الطاقة الصوتية، مخزن الطاقة المرنة.\n   الإجابة: الصوتية: نقل؛ المرنة: مخزن.\n٢. (مستوى التطبيق) في الهاتف أثناء الشحن، كيف تنتقل الطاقة إليه؟\n   الإجابة: بالكهرباء.\n٣. (مستوى الاستدلال) حلّل: هاتف يرن وشاشته مضيئة. ما المخزن وما طرق النقل؟\n   الإجابة: المخزن: الكيميائي في البطارية؛ النقل: كهربائي داخله، وصوتي وضوئي منه، مع حرارة منبعثة.", "الحصة ١: نقل الطاقة بالكهرباء والضوء والحرارة المنبعثة والصوت\n١. (مستوى المعرفة) أي هذه الأجهزة يعمل بالكهرباء: مقص، حاسب آلي، دبّاسة؟\n   الإجابة: الحاسب الآلي.\n٢. (مستوى التطبيق) ما سبب انتقال الصوت؟\n   الإجابة: اهتزاز مصدر الصوت.\n٣. (مستوى الاستدلال) لماذا يبدأ الجسم الساخن جدًا في التوهج؟\n   الإجابة: لأنه يطلق طاقة ضوئية إلى جانب الطاقة الحرارية المنبعثة.\n\nالحصة ٢: تخزين الطاقة ونقلها: تمرين كتاب النشاط\n١. (مستوى المعرفة) ما الفرق بين مخزن الطاقة ونقل الطاقة؟\n   الإجابة: المخزن يحتفظ بالطاقة، والنقل ينقلها من مكان إلى آخر.\n٢. (مستوى التطبيق) كيف تنتقل طاقة الشمس إلى الأرض؟\n   الإجابة: بالإشعاع (الضوء والحرارة المنبعثة).\n٣. (مستوى الاستدلال) صمّم مثالًا من حياتك يتضمن مخزنين وطريقتي نقل.\n   الإجابة: إجابة مفتوحة صحيحة، مثل: موقد غاز (مخزن كيميائي) يسخن قدرًا (مخزن حراري) وينبعث منه ضوء وحرارة.", "الحصة ١: نقل الطاقة بالكهرباء والضوء والحرارة المنبعثة والصوت\nللطالب: قراءة كتاب الطالب ص٦٢–٦٣. لولي الأمر: مساعدة الابن في تصنيف أجهزة المنزل حسب الطاقة التي تنقلها.\n\nالحصة ٢: تخزين الطاقة ونقلها: تمرين كتاب النشاط\nللطالب: إكمال تمرين ٣-٦ في كتاب النشاط ص٤٧. لولي الأمر: مراجعة الفرق بين المخزن والنقل مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/science/?l=25"]}, {"id": "3-7", "t": "٣-٧ توصيل الحرارة", "u": "٣: الطاقة", "w": "الثامن (٢٥–٢٩/١٠/٢٠٢٦)", "sp": "ص ٦٤–٦٥", "tp": "ص ١١٩–١٢١", "ap": "ورقة العمل ٣-٧ ص١٠٢", "unit": 3, "np": 2, "sep": [{"n": 1, "axis": "التوصيل الحراري والمواد الموصلة والعازلة", "f": ["١. أن يعرّف التوصيل الحراري بانتقال الطاقة خلال المادة الصلبة من الساخن إلى البارد\n٢. أن يصنّف مواد إلى موصلة جيدة للحرارة وعازلة\nمخرج تعليمي آخر: أن يقارن بين فلزات مختلفة ف ي، ويجيب الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة ١: التوصيل الحراري والمواد الموصلة والعازلة\n١. (مستوى المعرفة) ما التوصيل الحراري؟\n   الإجابة: انتقال الطاقة الحرارية خلال المادة الصلبة من الطرف الساخن إلى البارد.\n٢. (مستوى التطبيق) صنّف: النحاس، الخشب، البلاستيك، الألومنيوم.\n   الإجابة: موصلة: النحاس والألومنيوم؛ عازلة: الخشب والبلاستيك.\n٣. (مستوى الاستدلال) كيف تعرف أي فلز أفضل توصيلًا في تجربة الدبابيس؟\n   الإجابة: الفلز الذي تسقط دبابيسه أسرع.\n\nالحصة ٢: تفسير التوصيل بالجزيئات ونشاط انصهار الثلج\n١. (مستوى المعرفة) ماذا يحدث لجزيئات الطرف الساخن من القضيب؟\n   الإجابة: تهتز أكثر لأن لديها طاقة أكبر.\n٢. (مستوى التطبيق) لماذا انصهر الثلج أسرع على اللوح الفلزي؟\n   الإجابة: لأن الفلز موصل جيد فينقل الطاقة من الغرفة إلى الثلج بسرعة.\n٣. (مستوى الاستدلال) فسّر: يبدو الفلز أبرد من الخشب مع أنهما في درجة الحرارة نفسها.\n   الإجابة: لأن الفلز ينقل الطاقة من اليد بسرعة فنشعر بالبرودة، بينما الخشب عازل ينقلها ببطء.", "الحصة ١: التوصيل الحراري والمواد الموصلة والعازلة\n١. (مستوى المعرفة) ما المواد العازلة للحرارة؟\n   الإجابة: مواد موصلة ضعيفة للحرارة.\n٢. (مستوى التطبيق) لماذا تُصنع أواني الطهي من الفلز؟\n   الإجابة: لأن الفلز موصل جيد ينقل الحرارة إلى الطعام بسرعة.\n٣. (مستوى الاستدلال) لماذا يسهل مسك كوب البوليسترين الساخن أكثر من الكوب الورقي؟\n   الإجابة: لأن البوليسترين عازل جيد للحرارة فلا تصل الحرارة إلى اليد.\n\nالحصة ٢: تفسير التوصيل بالجزيئات ونشاط انصهار الثلج\n١. (مستوى المعرفة) كيف تنتقل الطاقة بين الجزيئات في التوصيل؟\n   الإجابة: بتصادم الجزيئات المهتزة بالجزيئات المجاورة.\n٢. (مستوى التطبيق) هل يحدث التوصيل في الفراغ؟ فسّر.\n   الإجابة: لا، لأنه يحتاج إلى جزيئات تنقل الطاقة.\n٣. (مستوى الاستدلال) لماذا تُصنع مقابض القدور من البلاستيك؟\n   الإجابة: لأنه عازل يمنع وصول الحرارة إلى اليد.", "الحصة ١: التوصيل الحراري والمواد الموصلة والعازلة\nللطالب: قراءة كتاب الطالب ص٦٤–٦٥. لولي الأمر: البحث مع الابن عن مواد عازلة في المطبخ (مقابض، قفازات).\n\nالحصة ٢: تفسير التوصيل بالجزيئات ونشاط انصهار الثلج\nللطالب: حل ورقة العمل ٣-٧ «الشعور با اجة، ويجهّز الطالب ويحدد المتغيرات ويصمّم جدول الملاحظات (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحليل نتائج سابقة: يعرض المعلم صورًا لنتائج بعد أسبوع (من الكتاب أو تجربة جهزها المعلم)، ويحلل الطالب ويجيب عن السؤالين ١ و٢ (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تخطيط تجربة الرطوبة: يطلب المعلم تخطيط تجربة لأثر الرطوبة (السؤال ٤)، وتكتب المجموعة خطتها (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق: يكلّف المعلم بمتابعة القطعتين أسبوعًا وتمرين ٤-٣، ويدوّن الطالب مهامه (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "الحصة ١: دور الكائنات الدقيقة في تحلل المادة العضوية\n١. (مستوى المعرفة) ما المادة العضوية؟\n   الإجابة: مادة مصدرها كائنات حية أو كانت جزءًا منها.\n٢. (مستوى التطبيق) لماذا يُحفظ الطعام في الثلاجة؟\n   الإجابة: لأن البرودة تبطئ نمو الكائنات الدقيقة فيبطؤ التحلل.\n٣. (مستوى الاستدلال) فسّر: التحلل مفيد للغابة.\n   الإجابة: يعيد المواد الغذائية من النباتات والحيوانات الميتة إلى التربة لتستفيد منها النباتات.\n\nالحصة ٢: نشاط ٤-٣ استقصاء تأثير درجة الحرارة على التحلل\n١. (مستوى المعرفة) ما المتغير المستقل في استقصاء الخبز؟\n   الإجابة: درجة الحرارة.\n٢. (مستوى التطبيق) لماذا نضع الخبز في كيس مغلق؟\n   الإجابة: لمنع انتشار الأبواغ ولسلامتنا.\n٣. (مستوى الاستدلال) ما الاستنتاج المتوقع؟\n   الإجابة: يتحلل الخبز أسرع في المكان الدافئ لأن الكائنات الدقيقة تنمو أسرع.", "الحصة ١: دور الكائنات الدقيقة في تحلل المادة العضوية\n١. (مستوى المعرفة) ما الظروف التي تسرّع التحلل؟\n   الإجابة: الدفء والرطوبة ووفرة الأكسجين.\n٢. (مستوى التطبيق) هل يتحلل البلاستيك بالكائنات الدقيقة بسهولة؟\n   الإجابة: لا، لأنه ليس مادة عضوية طبيعية.\n٣. (مستوى الاستدلال) كيف يحفظ التجفيف التمور من التلف؟\n   الإجابة: يزيل الرطوبة اللازمة لنمو الكائنات الدقيقة.\n\nالحصة ٢: نشاط ٤-٣ استقصاء تأثير درجة الحرارة على التحلل\n١. (مستوى المعرفة) اذكر متغيرين يجب تثبيتهما.\n   الإجابة: نوع الخبز وحجمه، والرطوبة.\n٢. (مستوى التطبيق) إذا اختلفت نتائج زميلك، فما السبب المحتمل؟\n   الإجابة: اختلاف نوع الخبز أو رطوبته أو عدم ضبط درجات الحرارة.\n٣. (مستوى الاستدلال) ص const toAr=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let mode='sep', li=0, pi=0;
const lsel=document.getElementById('lsel');

D.forEach((L,i)=>{ if(cur!==L.unit){cur=L.unit; var g=document.createElement('optgroup'); g.label=U[L.unit]; lsel.appendChild(g);} 
  const o=document.createElement('option'); o.value=i; o.textContent=L.t+'  ('+toAr(L.np)+(L.np==1?' حصة':' حصص')+')'; lsel.lastChild.appendChild(o);});

let dur=40; try{ if(localStorage.getItem('afuq-sci7-dur')==='35') dur=35; }catch(e){}
function fit(t){
  if(dur==40||t.indexOf('من الدقيقة')<0) return t;
  const R=/^\(من الدقيقة ([٠-٩]+) إلى ([٠-٩]+)\) (.*) \[([٠-٩]+) (?:دقيقة|دقائق|دقيقتان)\]$/;
  const num=s=>+String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const lab=n=>n==2?'دقيقتان':(n>=3&&n<=10?toAr(n)+' دقائق':toAr(n)+' دقيقة');
  const L=t.split('\n'); let grp=[];
  const flush=()=>{
    if(!grp.length) return;
    const d=grp.map(g=>g.m[4]).map(num), tot=d.reduce((a,b)=>a+b,0);
    const raw=d.map(x=>x*dur/tot), nd=raw.map(x=>Math.max(2,Math.floor(x)));
    let diff=dur-nd.reduce((a,b)=>a+b,0);
    const ord=raw.map((x,i)=>i).sort((a,b)=>(raw[b]-Math.floor(raw[b]))-(raw[a]-Math.floor(raw[a])));
    for(let k=0;diff>0&&k<1000;k++){nd[ord[k%ord.length]]++;diff--;}
    for(let k=0;diff<0&&k<1000;k++){let mi=0;nd.forEach((v,i)=>{if(v>nd[mi])mi=i});if(nd[mi]<=2)break;nd[mi]--;diff++;}
    let c=0; grp.forEach((g,i)=>{L[g.i]='(من الدقيقة '+toAr(c)+' إلى '+toAr(c+nd[i])+') '+g.m[3]+' ['+lab(nd[i])+']'; c+=nd[i];});
    grp=[];
  };
  for(let i=0;i<L.length;i++){
    const m=R.exec(L[i]);
    if(m){ if(num(m[1])==0) flush(); grp.push({i,m}); }
    else if(L[i].indexOf('الزمن الكلي')==0){ flush(); L[i]='الزمن الكلي: '+toAr(dur)+' دقيقة'; }
  }
  flush(); return L.join('\n');
}
function setDur(v){ dur=v; try{localStorage.setItem('afuq-sci7-dur',String(v))}catch(e){} render(); }

    `<div><b>كتاب الطالب</b>${L.sp}</div><div><b>دليل المعلم</b>${L.tp}</div><div><b>كتاب النشاط</b>${L.ap}</div>`+
    `<div class="axis"><b>${mode=='sep'?'محور الحصة':'محاور حصص الدرس'}</b><span>${axis}</span></div>`;
  const texts = (mode=='sep' ? L.sep[pi].f : L.comb).map(fit);
  const box=document.getElementById('cards'); box.innerHTML='';

    const c=document.createElement('section'); c.className='card';
    c.innerHTML=`<div class="ch"><h2><span class="num">${toAr(k+1)}</span>${name}</h2><button class="copy" type="button">نسخ</button></div><div class="cb"></div><div class="fallback">لم يسمح المتصفح بالنسخ التلقائي؛ النص محدَّد الآن، اضغط مطولًا أو Ctrl+C لنسخه.</div>`;
    c.querySelector('.cb').textContent=texts[k];
    c.querySelector('.copy').onclick=e=>copyText(texts[k], e.currentTarget, c);
    box.appendChild(c);
  });
}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1600);}
function legacy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';ta.style.fontSize='16px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok;}
function copyText(t,btn,card){
  const fail=()=>{ if(legacy(t)) return done(btn); selectEl(card.querySelector('.cb')); card.querySelector('.fallback').classList.add('show'); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(()=>done(btn)).catch(fail); } else fail();
}
