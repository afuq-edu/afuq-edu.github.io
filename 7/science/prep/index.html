:root{--ink:#243b38;--sage:#ecf7f1;--sage2:#d3e7de;--teal:#2b6a5b;--sky:#eef5fb;--sky2:#d6e4f0;--sand:#fbf8f0;--bg:#f7faf8}
*{box-sizing:border-box}
body{margin:0;font-family:Taj,Tahoma,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
header{background:#fff;border-bottom:1px solid var(--sage2);padding:14px 16px 10px;position:sticky;top:0;z-index:5}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:19px;margin:0 0 8px;color:var(--teal)}
.mode{display:flex;gap:0;border:1px solid var(--sage2);border-radius:12px;overflow:hidden;width:max-content;max-width:100%}
.mode button{font:inherit;font-weight:700;border:0;background:#fff;color:#5b7a71;padding:8px 18px;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--sage);color:var(--teal)}
.help{font-size:13.5px;color:#5d726c;margin:8px 0 4px}
.now{display:inline-block;background:var(--sand);border:1px solid #efe4c8;color:#7a5b1e;border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
select{font:inherit;padding:7px 10px;border:1px solid var(--sky2);border-radius:9px;background:#fff;min-width:260px;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;border:1px solid var(--sage2);background:#fff;border-radius:20px;padding:4px 14px;cursor:pointer;color:#4a675f}
.tabs button[aria-selected=true]{background:var(--sage);color:var(--teal);font-weight:700;border-color:#b9dccb}
main{padding:14px 16px 40px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px;margin-bottom:12px}
.info div{background:#fff;border:1px solid var(--sky2);border-radius:9px;padding:6px 10px;font-size:14px}
.info b{color:#3c5d7a;display:block;font-size:12.5px}
.info .axis{grid-column:1/-1;background:#f5fbf8;border-color:var(--sage2)}
.info .axis span{color:var(--teal);font-weight:700}
.card{background:#fff;border:1px solid var(--sage2);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sage);padding:6px 10px}
.ch h2{margin:0;font-size:15.5px;color:#2d5f53;display:flex;align-items:center;gap:8px}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #b9dccb;align-items:center;justify-content:center;font-size:13px}
.copy{font:inherit;font-weight:700;border:1px solid #b9dccb;background:#fff;color:var(--teal);border-radius:8px;padding:5px 16px;cursor:pointer;min-width:96px}
.copy:hover{background:#f3faf6}
.copy.ok{background:#2b6a5b;color:#fff;border-color:#2b6a5b}
.copy:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #7fb9a8;outline-offset:2px}
.cb{padding:9px 12px;white-space:pre-wrap;font-size:15px;user-select:text}
.fallback{font-size:12.5px;color:#8a6420;padding:0 12px 8px;display:none}
.fallback.show{display:block}
@media (max-width:600px){h1{font-size:16px}select{min-width:0;width:100%}.cb{font-size:14px}}
</style>
</head>

<header><div class="wrap">
  <h1>نسخ حقول نور · العلوم · الصف السابع · الفصل الدراسي الأول</h1>
  <div class="mode" role="group" aria-label="نوع التحضير">
    <button id="mSep" aria-pressed="true">تحضير منفصل</button>
    <button id="mComb" aria-pressed="false">تحضير مدمج</button>

  <div class="now" id="now"></div>
  <div class="ctrl">

const D=[{"id": "1-1", "t": "١-١ أعضاء النبات", "u": "١: النبات والإنسان ككائنات حيّة", "w": "الأول (٦–١٠/٩/٢٠٢٦)", "sp": "ص ١٤–١٥", "tp": "ص ٣٤–٣٧", "ap": "تمرين ١-١ ص١٨، ورقة العمل ١-١ ص٧٦", "unit": 1, "np": 1, "sep": [{"n": 1, "axis": "أعضاء النبات الزهري الأربعة الرئيسية ووظائفها", "f": ["١. أن يحدّد مواضع أعضاء النبات الزهري الرئيسية: الجذر والساق والورقة والزهرة\n٢. أن يربط كل عضو من أعضاء النبات بوظيفته الرئيسية\nمخرج تعليمي آخر: أن يقارن بين ورقتين نباتيتين بملاحظات دقيقة يدوّنها في جدول", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- أخرى: نبات فول صغير كامل، أوراق صحف وثقل لضغط النبات، عدسة مكبرة", "الكائن الحي، العضو، الجذر، الساق، الورقة، الزهرة، اليخضور (الكلوروفيل)، البناء الضوئي، التكاثر الجنسي.", "عرض خريطة العالم في ص١٤ التي تبيّن انتشار النباتات، وسؤال الطلاب: لماذا تظهر بعض المناطق بالأخضر الغامق وأخرى بنية؟ ثم ربط الإجابة بحاجة النبات إلى الماء والضوء، واستدعاء ما يعرفه الطلاب عن أجزاء النبات من الصفوف السابقة.", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يعرض خريطة الغطاء النباتي ويطرح أسئلة كتاب الطالب ١–٤ شفهيًا.\n   دور الطالب: يفسّر ألوان الخريطة ويحدّد موقع سلطنة عُمان عليها.\n(من الدقيقة ٥ إلى ١٥) استكشاف النبات الكامل [١٠ دقائق]\n   دور المعلم: يوزّع نبات فول كاملًا على كل مجموعة ويطلب تحديد الأعضاء الأربعة، ويقدّم مصطلحي «الكائن الحي» و«العضو».\n   دور الطالب: يفحص النبات بالعدسة المكبرة ويسمّي الجذر والساق والورقة والزهرة ويرسمه في الدفتر.\n(من الدقيقة ١٥ إلى ٢٥) وظائف الأعضاء [١٠ دقائق]\n   دور المعلم: يشرح بالرسم على السبورة الذكية وظيفة كل عضو: التثبيت وامتصاص الماء، حمل الأوراق والأزهار، صنع الغذاء بامتصاص ضوء الشمس، التكاثر.\n   دور الطالب: تُكمل كل مجموعة جدول «العضو – الوظيفة» وتعرضه، وتجيب عن السؤالين ٥ و٦.\n(من الدقيقة ٢٥ إلى ٣٣) نشاط ١-١ ضغط نبات [٨ دقائق]\n   دور المعلم: يوضّح خطوات ضغط النبات بين أوراق الصحف ووضع الثقل عليه، وينبّه إلى السلامة.\n   دور الطالب: يرتّب النبات بين الصحف ويضع عليه الثقل، ويكتب على الورقة اسم العضو بجانب كل جزء.\n(من الدقيقة ٣٣ إلى ٤٠) التقويم والغلق [٧ دقائق]\n   دور المعلم: يطرح أسئلة التقويم الختامي ويكلّف بتمرين ١-١ في كتاب النشاط.\n   دور الطالب: يجيب فرديًا على البطاقة ثم يلخّص الدرس في جملتين.\nالزمن الكلي: ٤٠ دقيقة", "١. (مستوى الدعم) سمِّ الأعضاء الأربعة الرئيسية للنبات الزهري.\n   الإجابة: الجذر، الساق، الورقة، الزهرة.\n٢. (المستوى المتوقع) ما وظيفة الجذر؟\n   الإجابة: يثبّت النبات في التربة ويمتص منها الماء والأملاح المعدنية.\n٣. (المستوى المتقدم) لماذا تكون أوراق معظم النباتات عريضة ورقيقة؟\n   الإجابة: لأن اتساعها يوفّر مساحة كبيرة لامتصاص طاقة ضوء الشمس، ورقّتها تسمح بوصول الضوء إلى داخل الورقة حيث يُصنع الغذاء.", "١. (مستوى الدعم) أيّ أعضاء النبات مسؤول عن التكاثر؟\n   الإجابة: الزهرة.\n٢. (المستوى المتوقع) صل: الساق – ؟ ، الورقة – ؟\n   الإجابة: الساق: تحمل الأوراق والأزهار. الورقة: تصنع الغذاء بامتصاص الطاقة من ضوء الشمس.\n٣. (المستوى المتقدم) فسّر: تتفرع جذور النبات تفرعًا كبيرًا في التربة.\n   الإجابة: لتتشبث بالتربة بقوة ولتمتص الماء من مساحة أكبر.", "للطالب: مراجعة كتاب الطالب ص١٤–١٥ وحل تمرين ١-١ «مقارنة بين أوراق النبات» في كتاب النشاط ص١٨ وورقة العمل ١-١ ص٧٦. لولي الأمر: مساعدة الابن في جمع ورقتين مختلفتين من نباتات المنزل ومقارنتهما."]}], "comb": ["١. أن يحدّد مواضع أعضاء النبات الزهري الرئيسية: الجذر والساق والورقة والزهرة\n٢. أن يربط كل عضو من أعضاء النبات بوظيفته الرئيسية\nمخرج تعليمي آخر: أن يقارن بين ورقتين نباتيتين بملاحظات دقيقة يدوّنها في جدول", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- أخرى: نبات فول صغير كامل، أوراق صحف وثقل لضغط النبات، عدسة مكبرة", "الكائن الحي، العضو، الجذر، الساق، الورقة، الزهرة، اليخضور (الكلوروفيل)، البناء الضوئي، التكاثر الجنسي.", "عرض خريطة العالم في ص١٤ التي تبيّن انتشار النباتات، وسؤال الطلاب: لماذا تظهر بعض المناطق بالأخضر الغامق وأخرى بنية؟ ثم ربط الإجابة بحاجة النبات إلى الماء والضوء، واستدعاء ما يعرفه الطلاب ع : مراجعة كتاب الطالب ص١٤–١٥ وحل تمرين ١-١ «مقارنة بين أوراق النبات» في كتاب النشاط ص١٨ وورقة العمل ١-١ ص٧٦. لولي الأمر: مساعدة الابن في جمع ورقتين مختلفتين من نباتات المنزل ومقارنتهما."]}, {"id": "1-2", "t": "١-٢ الأزهار", "u": "١: النبات والإنسان ككائنات حيّة", "w": "الأول (٦–١٠/٩/٢٠٢٦)", "sp": "ص ١٦–١٧", "tp": "ص ٣٨", "ap": "تمرين ١-٢ ص٢٠، ورقتا العمل ١-٣(أ) ص٧٧ و١-٣(ب) ص٧٨", "unit": 1, "np": 2, "sep": [{"n": 1, "axis": "الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة", "f": ["١. أن يحدّد أجزاء الزهرة: السبلات والبتلات والأسدية (المتك والخيط) والكربلة (الميسم والقلم والمبيض)\n٢. أن يوضّح وظيفة كل جزء من أجزاء الزهرة في التكاثر الجنسي\nمخرج تعليمي آخر: أن يشرّح زهرة ويصنّف أجزاءها في رسم معنون", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: أزهار كبيرة متماثلة التركيب، عدسات مكبرة، مشارط", "الزهرة، السبلة، البتلة، السداة، المتك، الخيط، حبوب اللقاح، الكربلة، الميسم، القلم، المبيض، البويضة، الرحيق، المشيج، الإخصاب.", "سؤال مفتوح: لماذا تكون الأزهار ملوّنة بألوان زاهية وذات رائحة؟ مع استدعاء أسماء أجزاء الزهرة التي يعرفها الطلاب من الصف الرابع، وتوضيح أن الزهرة عضو وليست النبات كله.", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يعرض صورة زهرة زاهية ويسأل عن سبب ألوانها ورائحتها، ويصحّح الخلط بين «النبات» و«الزهرة».\n   دور الطالب: يقترح تفسيرات ويتذكر أسماء أجزاء يعرفها.\n(من الدقيقة ٥ إلى ١٣) التكاثر الجنسي والأمشاج [٨ دقائق]\n   دور المعلم: يشرح أن التكاثر الجنسي يتطلب اندماج مشيج ذكري بمشيج أنثوي (الإخصاب)، وأن حبوب اللقاح تحتوي الأمشاج الذكرية والبويضات تحتوي الأنثوية.\n   دور الطالب: يدوّن المصطلحات في خريطة مفاهيم ويطرح أسئلة.\n(من الدقيقة ١٣ إلى ٢٣) تركيب الزهرة [١٠ دقائق]\n   دور المعلم: يعرض مجسمًا أو رسمًا لمقطع زهرة على السبورة الذكية ويحدّد الأجزاء الذكرية والأنثوية.\n   دور الطالب: يطابق الأجزاء على رسم كتاب الطالب ص١٧ ويصنّفها إلى ذكرية وأنثوية.\n(من الدقيقة ٢٣ إلى ٣٥) نشاط ١-٢ (بداية) [١٢ دقيقة]\n   دور المعلم: يوزّع الأزهار ويوجّه إلى نزع السبلات ثم البتلات بالترتيب، ويذكّر بالسلامة عند استخدام المشرط وحساسية حبوب اللقاح.\n   دور الطالب: تنزع المجموعة أجزاء الزهرة وترتبها على ورقة بيضاء وتلصقها مع عناوين.\n(من الدقيقة ٣٥ إلى ٤٠) الغلق [٥ دقائق]\n   دور المعلم: يطرح أسئلة التقويم الختامي.\n   دور الطالب: يجيب ويذكر جزءًا تعلمه لم يكن يعرفه.\nالزمن الكلي: ٤٠ دقيقة", "١. (مستوى الدعم) أين توجد الأمشاج الذكرية في الزهرة؟\n   الإجابة: داخل حبوب اللقاح التي تُنتَج في المتك.\n٢. (المستوى المتوقع) ما الفرق بين النبات والزهرة؟\n   الإجابة: النبات كائن حي كامل له جذور وساق وأوراق، والزهرة عضو من أعضائه مختص بالتكاثر الجنسي.\n٣. (المستوى المتقدم) لماذا تُعدّ الكربلة الجزء الأنثوي في الزهرة؟\n   الإجابة: لأنها تحتوي المبيض الذي تتكوّن فيه البويضات المحتوية على الأمشاج الأنثوية.", "١. (مستوى الدعم) سمِّ جزأي السداة.\n   الإجابة: المتك والخيط.\n٢. (المستوى المتوقع) رتّب أجزاء الكربلة من الأعلى إلى الأسفل.\n   الإجابة: الميسم، القلم، المبيض.\n٣. (المستوى المتقدم) ما وظيفة الرحيق في الزهرة؟\n   الإجابة: سائل سكري يجذب الحشرات والطيور إلى الزهرة فتنقل حبوب اللقاح.", "للطالب: قراءة كتاب الطالب ص١٦–١٧ وإحضار زهرتين مختلفتين (غير برية محمية) للحصة القادمة. لولي الأمر: متابعة الابن في رسم زهرة وتسمية أجزائها."]}, {"n": 2, "axis": "استقصاء تركيب الأزهار والمقارنة بين زهرتين", "f": ["١. أن يقيس أبعاد أجزاء الزهرة ويدوّن ملاحظات دقيقة\n٢. أن يقارن بين زهرتين مختلفتين في عدد الأجزاء وشكلها وحجمها\nمخرج تعليمي آخر: أن يستنتج علاقة بين لون البتلات ورائحتها وطريقة جذب الحيوانات", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: زهرتان من نوعين مختلفين لكل مجموعة، عدسات مكبرة، مساطر", "السبلة، البتلة، السداة، الكربلة، الملاحظة الدقيقة، القياس، جدول المقارنة.", "مراجعة سريعة بلعبة «أنا جزء من الزهرة…»: يصف المعلم وظيفة ويسمّي الطلاب الجزء، تمهيدًا للمقارنة بين زهرتين.", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يدير لعبة الألغاز عن أجزاء الزهرة.\n   دور الطالب: يجيب بسرعة باسم الجزء.\n(من الدقيقة ٥ إلى ٢٠) إكمال نشاط ١-٢ [١٥ دقيقة]\n   دور المعلم: يتابع المجموعات أثناء فحص الزهرتين وقياس البتلات والأسدية، ويوجّه إلى الوصف الإيجابي الدقيق.\n   دور الطالب: يعدّ الأجزاء ويقيسها بالمسطرة ويرسم الزهرتين.\n(من الدقيقة ٢٠ إلى ٣٢) تمرين ١-٢ مقارنة بين زهرتين [١٢ دقيقة]\n   دور المعلم: يعرض جدول المقارنة من كتاب النشاط ص٢٠ ويوضّح كتابة نقاط متقابلة.\n   دور الطالب: يملأ الجدول بأوجه التشابه والاختلاف ويعرض مجموعة نتائجها.\n(من الدقيقة ٣٢ إلى ٤٠) المناقشة والتقويم [٨ دقائق]\n   دور المعلم: يدير نقاشًا: ما الذي يجعل الزهرة جاذبة للحشرات؟ ثم يطرح أسئلة التقويم الختامي.\n   دور الطالب: يقارن نتائجه بنتائج المجموعات الأخرى ويجيب.\nالزمن الكلي: ٤٠ دقيقة", "١. (مستوى الدعم) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة: إجابة حسب الزهرة مع عدّ صحيح يطابق العيّنة.\n٢. (المستوى المتوقع) اذكر وجه تشابه ووجه اختلاف بين الزهرتين.\n   الإجابة: مثال: التشابه: لكل منهما بتلات وأسدية؛ الاختلاف: لون البتلات أو عددها أو طول الأسدية.\n٣. (المستوى المتقدم) لماذا يجب أن تكون نقاط المقارنة متقابلة في الجدول؟\n   الإجابة: حتى تقارن الخاصية نفسها في الزهرتين فتكون المقارنة دقيقة وواضحة.", "١. (مستوى الدعم) أيّ أجزاء الزهرة تكون عادة أكبرها وأزهاها لونًا؟\n   الإجابة: البتلات.\n٢. (المستوى المتوقع) فسّر: الأزهار التي تلقحها الحشرات ذات ألوان زاهية.\n   الإجابة: لجذب الحشرات إليها فتنقل حبوب اللقاح بين الأزهار.\n٣. (المستوى المتقدم) صمّم جدولًا لمقارنة زهرتين في أربع خصائص.\n   الإجابة: جدول بثلاثة أعمدة (الخاصية، الزهرة أ، الزهرة ب) وصفوف: عدد البتلات، لونها، عدد الأسدية، طول القلم.", "للطالب: حل تمرين ١-٢ «مقارنة بين زهرتين» في كتاب النشاط ص٢٠ إن لم يكتمل في الصف. لولي الأمر: تشجيع الابن على ملاحظة الأزهار في الحديقة دون قطف الأزهار البرية."]}], "comb": ["الحصة ١: الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة\n١. أن يحدّد أجزاء الزهرة: السبلات والبتلات والأسدية (المتك والخيط) والكربلة (الميسم والقلم والمبيض)\n٢. أن يوضّح وظيفة كل جزء من أجزاء الزهرة في التكاثر الجنسي\nمخرج تعليمي آخر: أن يشرّح زهرة ويصنّف أجزاءها في رسم معنون\n\nالحصة ٢: استقصاء تركيب الأزهار والمقار  مختص بالتكاثر الجنسي.\n٣. (المستوى المتقدم) لماذا تُعدّ الكربلة الجزء الأنثوي في الزهرة؟\n   الإجابة: لأنها تحتوي المبيض الذي تتكوّن فيه البويضات المحتوية على الأمشاج الأنثوية.\n\nالحصة ٢: استقصاء تركيب الأزهار والمقارنة بين زهرتين\n١. (مستوى الدعم) كم عدد البتلات في الزهرة التي فحصتها؟\n   الإجابة: إجابة حسب الزهرة مع عدّ صحيح يطابق العيّنة.\n٢. (المستوى المتوقع) اذكر وجه تشابه ووجه اختلاف بين الزهرتين.\n   الإجابة: مثال: التشابه: لكل منهما بتلات وأسدية؛ الاختلاف: لون البتلات أو عددها أو طول الأسدية.\n٣. (المستوى المتقدم) لماذا يجب أن تكون نقاط المقارنة متقابلة في الجدول؟\n   الإجابة: حتى تقارن الخاصية نفسها في الزهرتين فتكون المقارنة دقيقة وواضحة.", "الحصة ١: الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة\n١. (مستوى الدعم) سمِّ جزأي السداة.\n   الإجابة: المتك والخيط.\n٢. (المستوى المتوقع) رتّب أجزاء الكربلة من الأعلى إلى الأسفل.\n   الإجابة: الميسم، القلم، المبيض.\n٣. (المستوى المتقدم) ما وظيفة الرحيق في الزهرة؟\n   الإجابة: سائل سكري يجذب الحشرات والطيور إلى الزهرة فتنقل حبوب اللقاح.\n\nالحصة ٢: استقصاء تركيب الأزهار والمقارنة بين زهرتين\n١. (مستوى الدعم) أيّ أجزاء الزهرة تكون عادة أكبرها وأزهاها لونًا؟\n   الإجابة: البتلات.\n٢. (المستوى المتوقع) فسّر: الأزهار التي تلقحها الحشرات ذات ألوان زاهية.\n   الإجابة: لجذب الحشرات إليها فتنقل حبوب اللقاح بين الأزهار.\n٣. (المستوى المتقدم) صمّم جدولًا لمقارنة زهرتين في أربع خصائص.\n   الإجابة: جدول بثلاثة أعمدة (الخاصية، الزهرة أ، الزهرة ب) وصفوف: عدد البتلات، لونها، عدد الأسدية، طول القلم.", "الحصة ١: الأزهار أعضاء التكاثر الجنسي وتركيب الزهرة\nللطالب: قراءة كتاب الطالب ص١٦–١٧ وإحضار زهرتين مختلفتين (غير برية محمية) للحصة القادمة. لولي الأمر: متابعة الابن في رسم زهرة وتسمية أجزائها.\n\nالحصة ٢: استقصاء تركيب الأزهار والمقارنة بين زهرتين\nللطالب: حل تمرين ١-٢ «مقارنة بين زهرتين» في كتاب النشاط ص٢٠ إن لم يكتمل في الصف. لولي الأمر: تشجيع الابن على ملاحظة الأزهار في الحديقة دون قطف الأزهار البرية."]}, {"id": "1-3", "t": "١-٣ التلقيح", "u": "١: النبات والإنسان ككائنات حيّة", "w": "الأول (٦–١٠/٩/٢٠٢٦)", "sp": "ص ١٨–١٩", "tp": "ص ٣٩–٤٠", "ap": "ورقتا العمل ١-٣(أ) ص٧٧ و١-٣(ب) ص٧٨ (استخدام المجهر)", "unit": 1, "np": 2, "sep": [{"n": 1, "axis": "مفهوم التلقيح وعوامله", "f": ["١. أن يعرّف التلقيح بأنه انتقال حبوب اللقاح من المتك إلى الميسم\n٢. أن يقارن بين التلقيح بالحشرات والطيور والتلقيح بالرياح\nمخرج تعليمي آخر: أن يميّز بين التلقيح وانتشار البذور", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- صورة توضيحية\n- أخرى: بطاقات عوامل التلقيح", "التلقيح، حبوب اللقاح، المتك، الميسم، الرحيق، الحشرات الملقِّحة، الطيور، الرياح، طائر الشمس.", "عرض مقطع قصير لنحلة تزور زهرة، وسؤال: ماذا تحمل النحلة على جسمها عند خروجها من الزهرة؟ ولماذا تزور الزهرة أصلًا؟", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يعرض المقطع المرئي ويطرح السؤالين.\n   دور الطالب: يلاحظ ويقترح إجابات.\n(من الدقيقة ٥ إلى ١٥) مفهوم التلقيح [١٠ دقائق]\n   دور المعلم: يشرح أن الأمشاج الذكرية لا تستطيع الحركة وحدها، فتُنقل حبوب اللقاح إلى الميسم، ويعرض رسم ص١٨.\n   دور الطالب: يكتب تعريف التلقيح ويحدّد على الرسم مسار حبوب اللقاح.\n(من الدقيقة ١٥ إلى ٢٧) عوامل التلقيح [١٢ دقيقة]\n   دور المعلم: يوزّع بطاقات (حشرات، طيور، رياح) ويطلب تحديد صفات الزهرة المناسبة لكل عامل.\n   دور الطالب: تتشارك المجموعات في جدول وتعرضه.\n(من الدقيقة ٢٧ إلى ٣٥) لعبة «تلقيح أم انتشار؟» [٨ دقائق]\n   دور المعلم: يقرأ عبارات ويطلب التصنيف، ويصحّح المفهوم الخاطئ أن الحشرة تنقل حبوب اللقاح عن قصد.\n   دور الطالب: يرفع بطاقة «تلقيح» أو «انتشار» ويبرّر.\n(من الدقيقة ٣٥ إلى ٤٠) الغلق [٥ دقائق]\n   دور المعلم: يطرح أسئلة التقويم الختامي.\n   دور الطالب: يجيب فرديًا.\nالزمن الكلي: ٤٠ دقيقة", "١. (مستوى الدعم) ما التلقيح؟\n   الإجابة: انتقال حبوب اللقاح من المتك إلى الميسم.\n٢. (المستوى المتوقع) اذكر ثلاثة عوامل تنقل حبوب اللقاح.\n   الإجابة: الحشرات، الطيور، الرياح.\n٣. (المستوى المتقدم) لماذا تكون حبوب لقاح الأزهار التي تلقحها الرياح خفيفة وكثيرة؟\n   الإجابة: لتحملها الرياح بسهولة لمسافات بعيدة، ولأن احتمال وصول كل حبة إلى ميسم ضعيف فيلزم عدد كبير.", "١. (مستوى الدعم) من أين تنتقل حبوب اللقاح وإلى أين؟\n   الإجابة: من المتك إلى الميسم.\n٢. (المستوى المتوقع) ما الذي يجذب الحشرات إلى الزهرة؟\n   الإجابة: البتلات الزاهية والرائحة والرحيق.\n٣. (المستوى المتقدم) هل الحشرة تقصد نقل حبوب اللقاح؟ فسّر.\n   الإجابة: لا؛ تأتي لتتغذى على الرحيق فتلتصق حبوب اللقاح بجسمها وتنتقل عرَضًا إلى زهرة أخرى.", "للطالب: قراءة كتاب الطالب ص١٨–١٩ وحل الأسئلة ١–٤. لولي الأمر: ملاحظة الحشرات التي تزور أزهار الحديقة مع الابن."]}, {"n": 2, "axis": "فحص حبوب اللقاح باستخدام المجهر", "f": ["١. أن يستخدم المجهر الضوئي استخدامًا صحيحًا آمنًا\n٢. أن يسمّي أجزاء المجهر ووظيفة كل منها\nمخرج تعليمي آخر: أن يقارن بين حبوب لقاح زهرتين من حيث الشكل والحجم", "المخرج ١: تطبيق\nالمخرج ٢: تذكر\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- أخرى: مجاهر، شرائح زجاجية، أزهار ناضجة المتك، ورقتا العمل ١-٣(أ) و١-٣(ب)", "المجهر، العدسة العينية، العدسة الشيئية، المسرح، الضابط الكبير، الضابط الصغير، الشريحة، حبوب اللقاح.", "سؤال: كيف نرى حبوب اللقاح وهي صغيرة جدًا؟ ثم عرض مجهر حقيقي وتسمية أجزائه بمشاركة الطلاب.", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يعرض المجهر ويسأل عن أجزائه المعروفة.\n   دور الطالب: يسمّي الأجزاء التي يعرفها.\n(من الدقيقة ٥ إلى ١٥) أجزاء المجهر واستخدامه [١٠ دقائق]\n   دور المعلم: يشرح ورقة العمل ١-٣(أ) و١-٣(ب)، وينمذج ضبط التركيز: خفض العدسة الشيئية بالنظر من الجانب ثم رفعها أثناء النظر في العدسة العينية.\n   دور الطالب: يسمّي الأجزاء على الرسم ويتدرّب على الضبط.\n(من الدقيقة ١٥ إلى ٣٢) نشاط ١-٣ فحص حبوب اللقاح [١٧ دقيقة]\n   دور المعلم: يتابع المجموعات أثناء نقل حبوب اللقاح من المتك إلى الشريحة وفحصها، وينبّه إلى الحساسية.\n   دور الطالب: يحضّر الشريحة ويرسم ما يراه لحبوب لقاح زهرتين ويقارن.\n(من الدقيقة ٣٢ إلى ٤٠) المناقشة والتقويم [٨ دقائق]\n   دور المعلم: يناقش: لماذا تكون بعض حبوب اللقاح شائكة؟ ويطرح التقويم الختامي.\n   دور الطالب: يعرض رسمه ويجيب.\nالزمن الكلي: ٤٠ دقيقة", "١. (مستوى الدعم) ما العدسة التي ننظر من خلالها في المجهر؟\n   الإجابة: العدسة العينية.\n٢. (المستوى المتوقع) لماذا نحرّك العدسة الشيئية إلى أسفل ونحن ننظر من جانب المجهر؟\n   الإجابة: حتى لا تصطدم بالشريحة فتكسرها.\n٣. (المستوى المتقدم) ما فائدة سطح حبة اللقاح الشائك؟\n   الإجابة: يزيد احتمال التصاقها بجسم الحشرة فتُنقل إلى زهرة أخرى.", "١. (مستوى الدعم) سمِّ جزأين من أجزاء المجهر ووظيفتيهما.\n   الإجابة: العدسة الشيئية: تكبّر العيّنة؛ المسرح: توضع عليه الشريحة. (أو أي جزأين صحيحين)\n٢. (المستوى المتوقع) أيّ حبوب اللقاح أكبر غالبًا: لقاح الأزهار الحشرية أم الهوائية؟\n   الإجابة: لقاح الأزهار التي تلقحها الحشرات.\n٣. (المستوى المتقدم) اقترح سببًا لكون لقاح الأزهار الهوائية أملس وخفيفًا.\n   الإجابة: ليُحمل بسهولة في الهواء ولا يحتاج إلى الالتصاق بحيوان.", "للطالب: حل ورقة العمل ١-٣(ب) «أجزاء المجهر» في كتاب النشاط ص٧٨. لولي الأمر: مراجعة أسماء أجزاء المجهر مع الابن."]}], "comb": ["الحصة ١: مفهوم التلقيح وعوامله\n١. أن يعرّف التلقيح بأنه انتقال حبوب اللقاح من المتك إلى الميسم\n٢. أن يقارن بين التلقيح بالحشرات والطيور والتلقيح بالرياح\nمخرج تعليمي آخر: أن يميّز بين التلقيح وانتشار البذور\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\n١. أن يستخدم المجهر الضوئي استخدامًا صحيحًا آمنًا\n٢. أن يسمّي أجزاء المجهر ووظيفة كل منها\nمخرج تعليمي آخر: أن يقارن بين حبوب لقاح زهرتين من حيث الشكل والحجم", "الحصة ١: مفهوم التلقيح وعوامله\nالمخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\nالمخرج ١: تطبيق\nالمخرج ٢: تذكر\nالمخرج الآخر: تحليل", "الحصة ١: مفهوم التلقيح وعوامله\n- التعلم بالاكتشاف\n- التعلم التشاركي\n- التعلم المبني على اللعب\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة", "الحصة ١: مفهوم التلقيح وعوامله\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- صورة توضيحية\n- أخرى: بطاقات عوامل التلقيح\n\nالحصة ٢: فحص حبوب اللقاح باستخدام المجهر\n- الكتاب\n- السبورة الذكية\n- أخرى: مجاهر، شرائح زجاجية، أزهار ناضجة المتك، ورقتا العمل ١-٣(أ) و١-٣(ب)", "الحصة ١: مفهوم التلقيح وعوامله\nالتلقيح، حبوب اللقاح، الم  المبيض، البذرة، انتشار البذور، التنافس، الثمار العصيرية، الخطافات، الأجنحة، الطفو.", "عرض طبق فيه طماطم وخيار وبطاطس وبرتقال، وسؤال: أيّها ثمار في نظر علم الأحياء؟ لتحدّي المعنى اليومي لكلمة «ثمرة».", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يعرض الطبق ويطرح السؤال.\n   دور الطالب: يصنّف ويبرّر.\n(من الدقيقة ٥ إلى ١٣) من المبيض إلى الثمرة [٨ دقائق]\n   دور المعلم: يشرح تحوّل المبيض بعد الإخصاب إلى ثمرة تحيط بالبذور، ويقطع طماطم ليُظهر البذور.\n   دور الطالب: يدوّن التعريف ويحدّد البذور داخل الثمرة.\n(من الدقيقة ١٣ إلى ٢١) لماذا تنتشر البذور؟ [٨ دقائق]\n   دور المعلم: يناقش التنافس على الماء والضوء والأملاح بين النبات الأم والنباتات الجديدة.\n   دور الطالب: يجيب عن السؤال ٢ (أ، ب) في كتاب الطالب.\n(من الدقيقة ٢١ إلى ٣٥) نشاط ١-٥(أ) تكيّف ثمار النباتات [١٤ دقيقة]\n   دور المعلم: يوزّع ثمرتين مختلفتين لكل مجموعة ويوجّه إلى رسم الثمرة كاملة ومقطوعة.\n   دور الطالب: ترسم المجموعة الثمرتين وتحدّد طريقة الانتشار وتكيّف كل منهما.\n(من الدقيقة ٣٥ إلى ٤٠) الغلق [٥ دقائق]\n   دور المعلم: يطرح أسئلة التقويم الختامي.\n   دور الطالب: يجيب.\nالزمن الكلي: ٤٠ دقيقة", "١. (مستوى الدعم) ما الثمرة؟\n   الإجابة: مبيض ناضج يحتوي البذور.\n٢. (المستوى المتوقع) لماذا تُعدّ الطماطم ثمرة؟\n   الإجابة: لأنها تكوّنت من مبيض الزهرة وتحتوي بذورًا.\n٣. (المستوى المتقدم) فسّر: نبات بذوره تسقط تحته مباشرة ينمو ضعيفًا.\n   الإجابة: لأن النباتات الجديدة تتنافس مع النبات الأم ومع بعضها على الماء والضوء والأملاح المعدنية.", "١. (مستوى الدعم) أيّها ليس ثمرة: الطماطم، البطاطس، الخيار؟\n   الإجابة: البطاطس.\n٢. (المستوى المتوقع) اذكر تكيّفًا لثمرة تنشرها الرياح.\n   الإجابة: أجنحة أو مظلات تجعلها تبقى في الهواء مدة أطول.\n٣. (المستوى المتقدم) كيف تساعد الثمار العصيرية على انتشار بذورها؟\n   الإجابة: تأكلها الحيوانات وتنتقل بعيدًا ثم تُخرج البذور في مكان جديد.", "للطالب: قراءة كتاب الطالب ص٢٢–٢٣ وإحضار ثمرة منزلية مختلفة للحصة القادمة. لولي الأمر: مساعدة الابن في ملاحظة بذور الثمار أثناء تناول الطعام."]}, {"n": 2, "axis": "استقصاء: أفضل أجنحة لإبقاء الثمرة في الهواء", "f": ["١. أن يخطّط استق د.", "الحصة ١: مراجعة الوحدة الثانية: الحالات ونظرية الجزيئات وتغيرات الحالة\nللطالب: مراجعة كتاب الطالب ص٣٦–٤٣. لولي الأمر: مساعدة الابن في مراجعة المخطط.\n\nالحصة ٢: مراجعة الوحدة الثانية: الانتشار وضغط الغاز ومسابقة ختامية\nللطالب: مراجعة كتاب الطالب ص٤٤–٥١ وقراءة ص٥٢ تمهيدًا لوحدة الطاقة. لولي الأمر: متابعة مراجعة الابن للوحدة الثانية."]}, {"id": "3-1", "t": "٣-١ استخدام الطاقة", "u": "٣: الطاقة", "w": "السادس (١١–١٥/١٠/٢٠٢٦)", "sp": "ص ٥٢–٥٣", "tp": "ص ١٠٤–١٠٦", "ap": "تمرين ٣-١ ص٤١", "unit": 3, "np": 3, "sep": [{"n": 1, "axis": "الطاقة ضرورية لحدوث أي شيء", "f": ["١. أن يذكر أن أي نشاط يتطلب إمدادًا بالطاقة\n٢. أن يوضّح أن الإنسان يحصل على طاقته من الغذاء والآلات من الوقود والكهرباء\nمخرج تعليمي آخر: أن يربط بين بذل قوة لتحريك جسم واستهلاك مخزون الطاقة في الجسم", "المخرج ١: تذكر\nالمخرج ٢: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بكرة وحبل وثقل، زنبرك قوي، بالونات", "الطاقة، إمدادات الطاقة، الغذاء، الوقود، الكهرباء، القوة.", "سؤال مفتوح: ماذا فعلت منذ استيقظت صباحًا؟ ومن أين جاءتك الطاقة لتفعله؟ وتسجيل الأنشطة على السبورة.", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يطرح السؤال ويسجّل الأنشطة.\n   دور الطالب: يذكر أنشطته اليومية ومصدر طاقته.\n(من الدقيقة ٥ إلى ١٥) إمدادات الطاقة [١٠ دقائق]\n   دور المعلم: يشرح أن الطاقة لازمة لجعل أي شيء يحدث، ويعرض صور الطائرة والسيارة وأبراج الكهرباء.\n   دور الطالب: يصنّف الأمثلة حسب مصدر الطاقة: غذاء، وقود، كهرباء.\n(من الدقيقة ١٥ إلى ٣٠) نشاط ٣-١(أ) الأنشطة التي تتطلب طاقة [١٥ دقيقة]\n   دور المعلم: يجهّز محطات: رفع ثقل ببكرة، ضغط زنبرك وسحبه، نفخ بالون.\n   دور الطالب: يتنقل بين المحطات ويحدّد القوة المبذولة ومن أين جاءت الطاقة.\n(من الدقيقة ٣٠ إلى ٣٥) المناقشة [٥ دقائق]\n   دور المعلم: يربط بين بذل القوة واستهلاك مخزون الطاقة في الجسم ويصحّح فكرة «اكتساب الطاقة بالرياضة».\n   دور الطالب: يجيب عن السؤال ١ في الكتاب.\n(من الدقيقة ٣٥ إلى ٤٠) الغلق [٥ دقائق]\n   دور المعلم: يطرح التقويم الختامي.\n   دور الطالب: يجيب.\nالزمن الكلي: ٤٠ دقيقة", "١. (مستوى الدعم) من أين يحصل جسم الإنسان على الطاقة؟\n   الإجابة: من الغذاء.\n٢. (المستوى المتوقع) اذكر نشاطين يحتاجان إلى طاقة.\n   الإجابة: الجري، رفع حقيبة (أو أي نشاطين صحيحين).\n٣. (المستوى المتقدم) يقول زميلك إن التمارين الرياضية تمنحه طاقة. صحّح العبارة.\n   الإجابة: التمارين تستهلك جزءًا من الطاقة المخزّنة في الجسم ولا تزيدها، وإن شعر بالنشاط.", "١. (مستوى الدعم) من أين تحصل السيارة على الطاقة؟\n   الإجابة: من الوقود.\n٢. (المستوى المتوقع) عند رفع ثقل بالبكرة، ما مصدر الطاقة المستخدمة؟\n   الإجابة: الطاقة المخزّنة في جسم الطالب (من الغذاء).\n٣. (المستوى المتقدم) فسّر: يمكن لحجر أن يبقى على الأرض مدة طويلة دون حاجة إلى طاقة، لكن رفعه يحتاج إلى طاقة.\n   الإجابة: لأن الطاقة تلزم عند حدوث تغيّر (تحريك الجسم ببذل قوة)، ولا تلزم ما دام الحجر ساكنًا.", "للطالب: قراءة كتاب الطالب ص٥٢–٥٣ وتسجيل ثلاثة أنشطة يومية تحتاج إلى طاقة. لولي الأمر: مناقشة مصادر الطاقة في المنزل (الكهرباء، الغاز) مع الابن."]}, {"n": 2, "axis": "عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟", "f": ["١. أن يتتبّع وصول إمدادات الطاقة (الوقود والكهرباء) إلى المنزل والحي\n٢. أن يوضّح أن الكهرباء وسيلة لنقل الطاقة من محطات التوليد عبر الأسلاك\nمخرج تعليمي آخر: أن يقترح طرقًا لترشيد استهلاك الطاقة في المنزل والمدرسة", "المخرج ١: فهم\nالمخرج ٢: فهم\nالمخرج الآخر: إبداع", "- التعلم التشاركي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "إمدادات الطاقة، محطة توليد الكهرباء، الكابلات، الوقود، الترشيد.", "عرض صورة أبراج نقل الكهرباء في ص٥٣ وسؤال: كيف تصل الكهرباء إلى منزلك؟", "(من الدقيقة ٠ إلى ٥) التهيئة [٥ دقائق]\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يتوقّع مسار الكهرباء.\n(من الدقيقة ٥ إلى ٢٢) نشاط ٣-١(ب) عالم الطاقة [١٧ دقيقة]\n   دور المعلم: يوزّع أسئلة النشاط على المجموعات: محطات الوقود، الوقود المنزلي، محطة الكهرباء، آبار النفط.\n   دور الطالب: تناقش المجموعة وتنشئ قائمة بأفكارها على Padlet أو ورقة كبيرة.\n(من الدقيقة ٢٢ إلى ٣٢) عرض المجموعات [١٠ د  الركض طاقة أكثر من ركوب الدراجة؟\n   دور الطالب: يقارن ويبرّر.\n(من الدقيقة ٣٣ إلى ٤٠) الغلق [٧ دقائق]\n   دور المعلم: يطرح التقويم الختامي.\n   دور الطالب: يجيب فرديًا.\nالزمن الكلي: ٤٠ دقيقة", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\n١. (مستوى الدعم) من أين يحصل جسم الإنسان على الطاقة؟\n   الإجابة: من الغذاء.\n٢. (المستوى المتوقع) اذكر نشاطين يحتاجان إلى طاقة.\n   الإجابة: الجري، رفع حقيبة (أو أي نشاطين صحيحين).\n٣. (المستوى المتقدم) يقول زميلك إن التمارين الرياضية تمنحه طاقة. صحّح العبارة.\n   الإجابة: التمارين تستهلك جزءًا من الطاقة المخزّنة في الجسم ولا تزيدها، وإن شعر بالنشاط.\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\n١. (مستوى الدعم) كيف تصل الكهرباء من محطة التوليد إلى المنازل؟\n   الإجابة: عبر كابلات (أسلاك) معدنية.\n٢. (المستوى المتوقع) اذكر نوعين من الوقود يستخدمان في المنازل.\n   الإجابة: الغاز، الكيروسين.\n٣. (المستوى المتقدم) لماذا تُعدّ الكهرباء وسيلة جيدة لنقل الطاقة؟\n   الإجابة: لأنها تنقل الطاقة بسرعة لمسافات بعيدة إلى حيث نحتاجها.\n\nالحصة ٣: طاقة الجسم: تحليل بيانات وتمرين كتاب النشاط\n١. (مستوى الدعم) ما وحدة قياس الطاقة؟\n   الإجابة: الجول.\n٢. (المستوى المتوقع) ماذا يحدث للطاقة المستخدمة كلما زادت سرعة الركض؟\n   الإجابة: تزداد.\n٣. (المستوى المتقدم) شخصان: الأول يستخدم ٦٠ كيلوجول في الدقيقة والثاني ٣٨. أيهما أكثر نشاطًا؟ وكم الفرق؟\n   الإجابة: الأول؛ والفرق ٢٢ كيلوجول في الدقيقة.", "الحصة ١: الطاقة ضرورية لحدوث أي شيء\n١. (مستوى الدعم) من أين تحصل السيارة على الطاقة؟\n   الإجابة: من الوقود.\n٢. (المستوى المتوقع) عند رفع ثقل بالبكرة، ما مصدر الطاقة المستخدمة؟\n   الإجابة: الطاقة المخزّنة في جسم الطالب (من الغذاء).\n٣. (المستوى المتقدم) فسّر: يمكن لحجر أن يبقى على الأرض مدة طويلة دون حاجة إلى طاقة، لكن رفعه يحتاج إلى طاقة.\n   الإجابة: لأن الطاقة تلزم عند حدوث تغيّر (تحريك الجسم ببذل قوة)، ولا تلزم ما دام الحجر ساكنًا.\n\nالحصة ٢: عالم الطاقة: كيف تصل إمدادات الطاقة إلينا؟\n١. (مستوى الدعم) أين تُنتَج الكهرباء عادة؟\n   الإجابة: في محطات توليد كبيرة.\n٢. (المستوى المتوقع) اذكر سببًا لزيادة استهلاك الطاقة كلما تطورت البلدان.\n   ال const toAr=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let mode='sep', li=0, pi=0;
const lsel=document.getElementById('lsel');
let cur=null;
D.forEach((L,i)=>{ if(cur!==L.unit){cur=L.unit; var g=document.createElement('optgroup'); g.label=U[L.unit]; lsel.appendChild(g);} 
  const o=document.createElement('option'); o.value=i; o.textContent=L.t+'  ('+toAr(L.np)+(L.np==1?' حصة':' حصص')+')'; lsel.lastChild.appendChild(o);});
lsel.onchange=()=>{li=+lsel.value;pi=0;render()};
document.getElementById('mSep').onclick=()=>{mode='sep';render()};
document.getElementById('mComb').onclick=()=>{mode='comb';render()};
function render(){
  const L=D[li];
  document.getElementById('mSep').setAttribute('aria-pressed',mode=='sep');
  document.getElementById('mComb').setAttribute('aria-pressed',mode=='comb');
  document.getElementById('now').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم '+toAr(L.np)+(L.np==1?' حصة':' حصص');
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  if(mode=='sep'){ L.sep.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i==pi);b.textContent='الحصة '+toAr(s.n)+' من '+toAr(L.np);b.onclick=()=>{pi=i;render()};tabs.appendChild(b);}); }
  const axis = mode=='sep' ? L.sep[pi].axis : L.sep.map(s=>'الحصة '+toAr(s.n)+': '+s.axis).join(' | ');
  document.getElementById('info').innerHTML=
    `<div><b>الدرس</b>${L.t}</div><div><b>الوحدة</b>${L.u}</div><div><b>الأسبوع والتاريخ</b>${L.w}</div>`+
    `<div><b>كتاب الطالب</b>${L.sp}</div><div><b>دليل المعلم</b>${L.tp}</div><div><b>كتاب النشاط</b>${L.ap}</div>`+
    `<div class="axis"><b>${mode=='sep'?'محور الحصة':'محاور حصص الدرس'}</b><span>${axis}</span></div>`;
  const texts = mode=='sep' ? L.sep[pi].f : L.comb;
  const box=document.getElementById('cards'); box.innerHTML='';
  F.forEach((name,k)=>{
    const c=document.createElement('section'); c.className='card';
    c.innerHTML=`<div class="ch"><h2><span class="num">${toAr(k+1)}</span>${name}</h2><button class="copy" type="button">نسخ</button></div><div class="cb"></div><div class="fallback">لم يسمح المتصفح بالنسخ التلقائي؛ النص محدَّد الآن، اضغط مطولًا أو Ctrl+C لنسخه.</div>`;
    c.querySelector('.cb').textContent=texts[k];
    c.querySelector('.copy').onclick=e=>copyText(texts[k], e.currentTarget, c);
    box.appendChild(c);
  });
}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1600);}
function legacy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';ta.style.fontSize='16px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok;}
function copyText(t,btn,card){
  const fail=()=>{ if(legacy(t)) return done(btn); selectEl(card.querySelector('.cb')); card.querySelector('.fallback').classList.add('show'); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(()=>done(btn)).catch(fail); } else fail();
}
render();
