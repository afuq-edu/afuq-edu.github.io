بيه على السلامة.\n- الطالب: يراقب النمذجة ويجرب ثنيات بسيطة على قطعة تدريبية.\n\nالتخطيط للعمل (12 دقيقة):\n- المعلم: يطلب رسم مخطط تمهيدي لشكل سيُنفذ بالسلك يحمل شعورًا محددًا.\n- الطالب: يرسم مخططه ويحدد الشعور المراد ونوع الخطوط التي تعبر عنه.\n\nالختام (5 دقائق):\n- المعلم: يراجع المخططات ويوجه إلى إحضار خامات مكملة (خرز، فوم، ورق شفاف).\n- الطالب: يعرض مخططه ويستمع للتغذية الراجعة.", "س1 (مستوى المعرفة): ما الخامة التي استخدمها الفنان جلال جمعة في أعماله المعروضة؟\nالإجابة: الأسلاك.\n\nس2 (مستوى التطبيق): كيف يتحول السلك إلى خط تعبيري؟\nالإجابة: بثنيه وتشكيله في الفراغ بخطوط منحنية أو منكسرة أو حلزونية تحمل دلالات تعبيرية.\n\nس3 (مستوى الاستدلال): اقترح شكلًا بالسلك يعبر عن «النمو» وعلّل اختيار خطوطه.\nالإجابة: شجرة أو نبتة صاعدة بخطوط عمودية ومنحنية؛ لأن العمودي يوحي بالسمو والنمو.", "س1 (مستوى المعرفة): اذكر قاعدة سلامة واحدة عند استخدام قاطع الأسلاك.\nالإجابة: توجيه طرف القاطع بعيدًا عن الجسم والوجه، وعدم ترك أطراف السلك حادة.\n\nس2 (مستوى التطبيق): ما الفرق بين الخط المرسوم على الورق والخط المشكّل بالسلك؟\nالإجابة: الخط المرسوم ثنائي الأبعاد، أما السلك فخط يتحرك في الفراغ بثلاثة أبعاد.\n\nس3 (مستوى الاستدلال): قيّم مخططك: هل تعبر خطوطه عن الشعور الذي حددته؟ وضّح.\nالإجابة: إجابة تقييمية تربط نوع الخطوط في المخطط بالشعور المحدد مع اقتراح تعديل إن لزم.", "إرشاد للطالب: يحتفظ بمخططه ويجهّز خامات بسيطة آمنة كالخرز أو الفوم بحسب توجيه المعلم.\nإرشاد لولي الأمر: يساعد ابنه في توفير خامات مستهلكة آمنة دون أدوات حادة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 22–23، 26–27.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=1"]}, {"ax": "تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية", "n": 4, "w": "الأسبوع الرابع: من 27/9/2026 إلى 1/10/2026", "pg": "23", "f": ["1. يشكّل عملًا فنيًا بالسلك قائمًا على توظيف دلالات الخطوط التعبيرية.\n2. ينوّع في أساليب التشكيل (الثني، اللف، التكرار) لتحقيق صياغة جمالية.\nمخرج آخر: يتعاون مع زملائه ويحافظ على نظافة مكان العمل.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج ي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nالتعلم القبلي: الدلالات التعبيرية لأنواع الخطوط ورسمها على سطح الورق.\n\nالتهيئة:\n- المعلم: يرفع قطعة سلك أمام الطلبة ويثنيها بأشكال مختلفة ويسأل: هل ما زال هذا خطًا؟\n- الطالب: يلاحظ أن السلك خط يتحرك في الفراغ ويذكر دلالة كل ثنية.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nالتعلم القبلي: المخطط التمهيدي ومهارات ثني السلك التي تعلمها في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض مخططًا لطالب ويسأل: ما أول خط يجب تشكيله ليصبح هيكلًا للعمل؟\n- الطالب: يحدد الخط الرئيس في مخططه الذي سيبدأ به.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nالتعلم القبلي: العمل الفني بالسلك الذي شكّله في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يسأل: ما الذي يجعل العمل الفني «جاهزًا للعرض»؟\n- الطالب: يقترح لمسات تكميلية مثل الألوان أو الخامات أو القاعدة.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nالتهيئة (5 دقائق):\n- المعلم: يعرض عملي كاندينسكي وبافيل بيسكاريف (الشكلان 1، 2 ص 13) ويسأل: هل يمكن للخطوط وحدها أن تشعرنا بالفرح أو الهدوء أو الغضب؟\n- الطالب: يتأمل العملين ويعبّر بكلمة واحدة عن الشعور الذي يثيره كل عمل.\n\nتنظيم المجموعات (5 دقائق):\n- المعلم: يوزع الطلبة على مجموعات تعاونية ويحدد الأدوار (قارئ، كاتب، متحدث).\n- الطالب: ينتظم في مجموعته ويستلم دوره.\n\nتحليل أعمال الفنانين (ورقة النشاط 1) (12 دقيقة):\n- المعلم: يوزع ورقة النشاط (1) مع عملي حسن مير وخوان ميرو (الشكلان 1، 2 ص 15) ويطلب تحديد نوع الخط وشكله والشعور الناتج من رؤيته.\n- الطالب: يحلل العملين مع مجموعته ويدوّن نوع الخط والشعور الذي يثيره في ورقة النشاط (1).\n\nالمقارنة بورقة النشاط (2) (10 دقائق):\n- المعلم: يعرض ورقة النشاط (2) التي تربط كل خط بدلالته: العمودي (السمو والنمو والقوة)، الأفقي (الراحة والاستقرار والسكون)، المائل (الحركة والتوتر)، المنحني (الانغلاق والانطواء)، المنكسر (التوتر والغضب والخطر)، الحلزوني (الغموض).\n- الطالب: يقارن ما استنتجه بما في ورقة النشاط (2) ويصحح استنتاجاته ويعرض المتحدث نتائج المجموعة.\n\nخريطة ذهنية للمفاهيم (8 دقائق):\n- المعلم: يرسم على السبورة خريطة ذهنية مركزها «الدلالات التعبيرية للخط» ويستكمل فروعها بمشاركة الطلبة (بديلًا عن جدول المفاهيم).\n- الطالب: يشارك في إكمال فروع الخريطة الذهنية بأنواع الخطوط ودلالاتها.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nالتهيئة (5 دقائق):\n- المعلم: يعرض عملًا من مصادر الإلهام (ص 21) ويسأل: لو كانت هذه الخطوط صوتًا، فهل ستكون هادئة أم صاخبة؟\n- الطالب: يجيب ويربط بين حركة الخطوط والإيقاع الصوتي.\n\nالتعريف بفن النيوروجراف (5 دقائق):\n- المعلم: يوضح أن النيوروجراف أسلوب يرسم فيه الفنان خطوطًا حرة متصلة تعبّر عن الشعور ثم تُنعَّم زواياها، ويوزع مساحات العمل وأدواته.\n- الطالب: يستلم ورقة الرسم والأقلام ويستمع للشرح.\n\nالرسم أثناء الاستماع (15 دقيقة):\n- المعلم: يشغّل المقطوعة الموسيقية للموسيقار فيصل الشبلي ويوجه الطلبة لترك اليد تتحرك وفق الإحساس، ويتجول للتوجيه.\n- الطالب: يرسم خطوطًا ذات دلالات تعبيرية (منحنية، منكسرة، حلزونية…) بحسب شعوره الناتج من الاستماع.\n\nالتحبير والتأكيد (7 دقائق):\n- المعلم: يوجه إلى تحبير الخطوط وتعميق بعضها لإبراز الشعور الغالب.\n- الطالب: يحبّر خطوطه ويؤكد الخطوط الأكثر تعبيرًا عن شعوره.\n\nالختام (8 دقائق):\n- المعلم: ينظم عرضًا سريعًا ويسأل: أي منتج يمكن أن يحمل هذه الخطوط (كوب، غلاف قصة)؟ وينسق مع الأخصائي النفسي للاطلاع على الأعمال.\n- الطالب: يتحدث عن الدلالات التعبيرية في عمله ويقترح منتجًا نفعيًا يوظفها.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nالتهيئة (5 دقائق):\n- المعلم: يرفع قطعة سلك أمام الطلبة ويثنيها بأشكال مختلفة ويسأل: هل ما زال هذا خطًا؟\n- الطالب: يلاحظ أن السلك خط يتحرك في الفراغ ويذكر دلالة كل ثنية.\n\nتحليل أعمال جلال جمعة (10 دقائق):\n- المعلم: يعرض أعمال الفنان جلال جمعة (الشكل 1 أ، ب، ج ص 22) ويسأل عن أنواع الخطوط التي شكّلها السلك ودلالتها.\n- الطالب: يحلل الأعمال ويحدد نوع الخط ودلالته في كل عمل.\n\nنمذجة مهارات السلك (8 دقائق):\n- المعلم: ينمذج طرق الثني واللف والتعقيد بالسلك وقطعه بالقاطع مع التنبيه على السلامة.\n- الطالب: يراقب النمذجة ويجرب ثنيات بسيطة على قطعة تدريبية.\n\nالتخطيط للعمل (12 دقيقة):\n- المعلم: يطلب رسم مخطط تمهيدي لشكل سيُنفذ بالسلك يحمل شعورًا محددًا.\n- الطالب: يرسم مخططه ويحدد الشعور المراد ونوع الخطوط التي تعبر عنه.\n\nالختام (5 دقائق):\n- المعلم: يراجع المخططات ويوجه إلى إحضار خامات مكملة (خرز، فوم، ورق شفاف).\n- الطالب: يعرض مخططه ويستمع للتغذية الراجعة.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nالتهيئة (5 دقائق):\n- المعلم: يعرض مخططًا لطالب ويسأل: ما أول خط يجب تشكيله ليصبح هيكلًا للعمل؟\n- الطالب: يحدد الخط الرئيس في مخططه الذي سيبدأ به.\n\nتوزيع الخامات (5 دقائق):\n- المعلم: يوزع الأسلاك والقواطع ويذكّر بقواعد السلامة.\n- الطالب: يستلم الخامات ويرتب مكان عمله.\n\nتنفيذ الهيكل الخطي (20 دقيقة):\n- المعلم: يتابع التنفيذ ويوجه إلى الاتزان وتنوع الخطوط وتقديم دعم فردي للمتعثرين.\n- الطالب: يشكل الهيكل الرئيس بالسلك ثم يضيف الخطوط الثانوية المعبرة عن الشعور.\n\nتقويم في منتصف العمل (5 دقائق):\n- المعلم: يطلب من كل طالبين تبادل الأعمال وإبداء ملاحظة واحدة.\n- الطالب: يتبادل العمل مع زميله ويقدم ملاحظة بنّاءة ويستفيد منها.\n\nالختام (5 دقائق):\n- المعلم: يوجه إلى حفظ الأعمال وتنظيف المكان وجمع بقايا الأسلاك.\n- الطالب: يحفظ عمله وينظف مكانه.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الذي يجعل العمل الفني «جاهزًا للعرض»؟\n- الطالب: يقترح لمسات تكميلية مثل الألوان أو الخامات أو القاعدة.\n\nإضافة الخامات المكملة (15 دقيقة):\n- المعلم: يوجه إلى إضافة الخرز والفوم والورق الشفاف بشكل يخدم الدلالة ولا يطغى على الخط.\n- الطالب: يضيف الخامات بعناية ويثبت العمل على قاعدة.\n\nالمعرض المصغر (10 دقائق):\n- المعلم: ينظم معرضًا مصغرًا ويطرح أسئلة نقدية: ما الشعور؟ ما الخطوط؟ هل نجحت الخامة؟\n- الطالب: يعرض عمله ويتحدث عن دلالاته ويستمع لآراء زملائه.\n\nالتقويم الذاتي (5 دقائق):\n- المعلم: يوزع بطاقة تقويم ذاتي بسيطة (الفكرة، التنفيذ، الإخراج).\n- الطالب: يقيّم عمله وفق البطاقة.\n\nالختام (5 دقائق):\n- المعلم: يقترح توظيف الأعمال في تجميل مرافق المدرسة.\n- الطالب: يقترح مكانًا مناسبًا لعرض عمله في المدرسة.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nس1 (مستوى المعرفة): سمِّ نوعين من الخطوط ظهرا في عملي حسن مير وخوان ميرو.\nالإجابة: الخط المنحني والخط المستقيم (أو أي نوعين صحيحين ظاهرين في العملين).\n\nس2 (مستوى التطبيق): ما الشعور الذي يوحي به الخط المستقيم الأفقي؟\nالإجابة: الراحة والاستقرار والسكون.\n\nس3 (مستوى الاستدلال): لماذا يختار الفنان الخطوط المنكسرة للتعبير عن مشهد عاصفة؟\nالإجابة: لأن الخط المنكسر يوحي بالتوتر والغضب والخطر فيناسب انفعال المشهد.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nس1 (مستوى المعرفة): ما المقصود بفن النيوروجراف؟\nالإجابة: أسلوب فني يرسم فيه الفنان خطوطًا حرة متصلة تعبّر عن مشاعره.\n\nس2 (مستوى التطبيق): ارسم خطًا يعبّر عن مقطع موسيقي سريع، وسمِّ نوعه.\nالإجابة: خط منكسر أو مائل متكرر يوحي بالحركة والتوتر.\n\nس3 (مستوى الاستدلال): كيف يمكن أن تختلف خطوط طالبين استمعا للمقطوعة نفسها؟ فسّر.\nالإجابة: تختلف لاختلاف الشعور الذاتي لكل منهما، فالتعبير الخطي شخصي يعكس إحساس صاحبه.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nس1 (مستوى المعرفة): ما الخامة التي استخدمها الفنان جلال جمعة في أعماله المعروضة؟\nالإجابة: الأسلاك.\n\nس2 (مستوى التطبيق): كيف يتحول السلك إلى خط تعبيري؟\nالإجابة: بثنيه وتشكيله في الفراغ بخطوط منحنية أو منكسرة أو حلزونية تحمل دلالات تعبيرية.\n\nس3 (مستوى الاستدلال): اقترح شكلًا بالسلك يعبر عن «النمو» وعلّل اختيار خطوطه.\nالإجابة: شجرة أو نبتة صاعدة بخطوط عمودية ومنحنية؛ لأن العمودي يوحي بالسمو والنمو.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nس1 (مستوى المعرفة): ما الخطوة الأولى في تشكيل العمل بالسلك؟\nالإجابة: تشكيل الهيكل أو الخط الرئيس للعمل.\n\nس2 (مستوى التطبيق): كيف تحقق الإيقاع في عمل منفذ بالسلك؟\nالإجابة: بتكرار الثنيات أو الحلقات بانتظام أو بتدرج.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يزيد من قوة التعبير في عمل زميلك.\nالإجابة: مثال: إضافة خطوط منكسرة لتعزيز التوتر أو تكثيف اللفات الحلزونية لتعزيز الغموض.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nس1 (مستوى المعرفة): اذكر خامتين يمكن إضافتها لإخراج العمل بالسلك.\nالإجابة: الخرز والفوم (أو الورق الشفاف).\n\nس2 (مستوى التطبيق): لماذا يجب ألا تطغى الخامات المضافة على الخطوط؟\nالإجابة: لأن الخط هو العنصر الأساسي الحامل للدلالة التعبيرية في العمل.\n\nس3 (مستوى الاستدلال): انقد عملًا معروضًا من حيث الفكرة والتنفيذ والإخراج.\nالإجابة: نقد متوازن يذكر نقاط القوة وملاحظة للتطوير في كل جانب.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nس1 (مستوى المعرفة): صِل: الخط العمودي ←؟\nالإجابة: السمو والنمو والقوة.\n\nس2 (مستوى التطبيق): بيّن الفرق بين دلالة الخط المائل ودلالة الخط الحلزوني.\nالإجابة: المائل يوحي بالحركة والتوتر، والحلزوني يوحي بالغموض.\n\nس3 (مستوى الاستدلال): اقترح نوع الخط المناسب للتعبير عن «الهدوء بعد التعب» مع التعليل.\nالإجابة: الخط الأفقي أو المنحني الهادئ؛ لأنهما يوحيان بالراحة والسكون والاستقرار.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nس1 (مستوى المعرفة): أكمل: يعبر الخط ……… عن الهدوء.\nالإجابة: الأفقي (أو المنحني الهادئ).\n\nس2 (مستوى التطبيق): وضّح الشعور الغالب في عملك واذكر نوع الخط الذي عبّر عنه.\nالإجابة: إجابة شخصية صحيحة تربط الشعور بنوع الخط، مثل: الفرح عبّر عنه الخط المنحني المتموج.\n\nس3 (مستوى الاستدلال): اقترح تصميمًا لغلاف قصة يوظف دلالات الخطوط، وبيّن سبب اختيارك.\nالإجابة: مثال: غلاف قصة مغامرة بخطوط منكسرة ومائلة توحي بالتوتر والحركة.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nس1 (مستوى المعرفة): اذكر قاعدة سلامة واحدة عند استخدام قاطع الأسلاك.\nالإجابة: توجيه طرف القاطع بعيدًا عن الجسم والوجه، وعدم ترك أطراف السلك حادة.\n\nس2 (مستوى التطبيق): ما الفرق بين الخط المرسوم على الورق والخط المشكّل بالسلك؟\nالإجابة: الخط المرسوم ثنائي الأبعاد، أما السلك فخط يتحرك في الفراغ بثلاثة أبعاد.\n\nس3 (مستوى الاستدلال): قيّم مخططك: هل تعبر خطوطه عن الشعور الذي حددته؟ وضّح.\nالإجابة: إجابة تقييمية تربط نوع الخطوط في المخطط بالشعور المحدد مع اقتراح تعديل إن لزم.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nس1 (مستوى المعرفة): سمِّ أسلوبين لتشكيل السلك.\nالإجابة: الثني واللف (أو التجديل والتكرار).\n\nس2 (مستوى التطبيق): لماذا نهتم بالاتزان في العمل المنفذ بالسلك؟\nالإجابة: ليثبت العمل ويبدو متوازن الأجزاء بصريًا وجماليًا.\n\nس3 (مستوى الاستدلال): قيّم مدى توظيفك لدلالات الخطوط في عملك حتى الآن.\nالإجابة: إجابة تقييمية تذكر نوع الخطوط المستخدمة ومدى تعبيرها عن الشعور المقصود.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nس1 (مستوى المعرفة): ما الهدف من إضافة الخامات في إخراج العمل؟\nالإجابة: تأكيد القيمة الجمالية للعمل.\n\nس2 (مستوى التطبيق): تحدث عن الشعور الذي عبّر عنه عملك ونوع الخطوط التي استخدمتها.\nالإجابة: إجابة شخصية تربط الشعور بنوع الخطوط ودلالتها.\n\nس3 (مستوى الاستدلال): كيف يمكن توظيف أعمال الصف في تجميل المدرسة؟ اقترح خطة مختصرة.\nالإجابة: مثال: تعليق الأعمال في ممر المدرسة مع بطاقات تشرح دلالات الخطوط.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nإرشاد للطالب: يلاحظ الخطوط في بيئته (أفق البحر، النخيل، الجبال) ويتأمل الشعور الذي تثيره دون تكليف بواجب منزلي.\nإرشاد لولي الأمر: يشجع ابنه على الحديث عن مشاعره تجاه الخطوط في الصور والمناظر من حوله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 12–18.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nإرشاد للطالب: يستمع لمقطوعة هادئة وأخرى سريعة ويلاحظ اختلاف إحساسه بهما.\nإرشاد لولي الأمر: يحاور ابنه حول عمله الفني ويثني على تعبيره عن مشاعره.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 16، 19–21.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nإرشاد للطالب: يحتفظ بمخططه ويجهّز خامات بسيطة آمنة كالخرز أو الفوم بحسب توجيه المعلم.\nإرشاد لولي الأمر: يساعد ابنه في توفير خامات مستهلكة آمنة دون أدوات حادة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 22–23، 26–27.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nإرشاد للطالب: يتأمل أعمال فنية من الأسلاك في مصادر الإلهام ص 26–27.\nإرشاد لولي الأمر: يتابع تقدم ابنه في العمل ويشجعه على إكماله صورة توضيحية\n4. أخرى: ورق مقوى، مقص، لاصق\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\n1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: أقلام تلوين، خيوط، بطاقة تقويم الوحدة", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\n1. الدلالات التعبيرية للخط\n2. التأمل الفني\n3. الهوية والمواطنة\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\n1. القيمة الجمالية\n2. القيمة التعبيرية\n3. الخامة والخط\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\n1. الكولاج\n2. الإعلان التوعوي\n3. الفكرة الأساسية\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\n1. الخطوط المنكسرة (التوتر)\n2. الخطوط العمودية (القوة)\n3. العبارة التوعوية\n4. الإخراج النهائي", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nالتعلم القبلي: دلالات أنواع الخطوط والخطوط التعبيرية في الدرس الأول.\n\nالتهيئة:\n- المعلم: يعرض صورتين للمصورة نوف السيابية (الشكل 1 أ، ب ص 29) ويسأل: ماذا تقول ملامح هذا الوجه؟\n- الطالب: يصف الشعور: السمو والشموخ في الأولى والغموض في الثانية.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nالتعلم القبلي: الصورة التي أضاف إليها الخطوط الدالة على المشاعر في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض عملًا من مصادر الإلهام (ص 34) ويسأل: ماذا أضاف الخيط إلى الصورة؟\n- الطالب: يلاحظ أن الخيط أبرز الخط وأعطاه ملمسًا وقيمة جمالية.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nالتعلم القبلي: الدلالات التعبيرية للخطوط وتوظيفها في الصورة الفوتوغرافية.\n\nالتهيئة:\n- المعلم: يعرض ملصقًا توعويًا ويسأل: كيف أوصل التصميم رسالته بسرعة؟\n- الطالب: يحدد عناصر الملصق (صورة، خط، عبارة) ودور كل منها.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nالتعلم القبلي: تكوين الكولاج الذي ركّبه في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض تصميمين لموضوع واحد: أحدهما بخطوط معبرة والآخر بلا خطوط، ويسأل: أيهما أقوى أثرًا؟\n- الطالب: يختار الأقوى ويعلل بدور الخطوط.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورتين للمصورة نوف السيابية (الشكل 1 أ، ب ص 29) ويسأل: ماذا تقول ملامح هذا الوجه؟\n- الطالب: يصف الشعور: السمو والشموخ في الأولى والغموض في الثانية.\n\nاختيار الصورة (8 دقائق):\n- المعلم: يوزع صورًا فوتوغرافية متنوعة ويوجه كل طالب لاختيار صورة شخصية.\n- الطالب: يختار صورة ويتأمل تفاصيلها.\n\nكتابة المشاعر (10 دقائق):\n- المعلم: يطلب كتابة المشاعر الناتجة عن التأمل (السمو، الغموض، الغضب…) حول الصورة.\n- الطالب: يكتب المشاعر التي تثيرها الصورة بجانبها.\n\nإضافة الخطوط الدالة (12 دقيقة):\n- المعلم: يوجه إلى رسم الخطوط الدالة على كل شعور مكتوب حول الصورة أو عليها.\n- الطالب: يرسم خطوطًا تعبّر عن المشاعر المكتوبة (عمودية للسمو، حلزونية للغموض…).\n\nالختام (5 دقائق):\n- المعلم: يطلب من طالبين عرض عمليهما ويوجه لإحضار خيوط ملونة للحصة القادمة.\n- الطالب: يعرض عمله ويستعد بالخامات المطلوبة.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nالتهيئة (5 دقائق):\n- المعلم: يعرض عملًا من مصادر الإلهام (ص 34) ويسأل: ماذا أضاف الخيط إلى الصورة؟\n- الطالب: يلاحظ أن الخيط أبرز الخط وأعطاه ملمسًا وقيمة جمالية.\n\nنمذجة الإبراز (5 دقائق):\n- المعلم: ينمذج تثبيت الخيط على خط مرسوم باستخدام الصمغ بخطوات قصيرة.\n- الطالب: يتابع ويحدد الخطوط التي سيبرزها.\n\nإبراز الخطوط بالخيوط (20 دقيقة):\n- المعلم: يتابع ويوجه إلى اختيار لون الخيط بما يناسب الشعور.\n- الطالب: يثبت الخيوط على الخطوط الدالة على المشاعر ليضيف قيمة جمالية وتعبيرية.\n\nالمناقشة (5 دقائق):\n- المعلم: يناقش قدرة كل طالب على التعبير عن مشاعره بالخامة.\n- الطالب: يوضح كيف جسّد الخيط شعورًا محددًا.\n\nالختام (5 دقائق):\n- المعلم: يطلب اقتراح طريقة لعرض الأعمال ويوجه لإحضار صور تناسب موضوعًا توعويًا للحصة القادمة.\n- الطالب: يقترح فكرة عرض ويستعد للنشاط القادم.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nالتهيئة (5 دقائق):\n- المعلم: يعرض ملصقًا توعويًا ويسأل: كيف أوصل التصميم رسالته بسرعة؟\n- الطالب: يحدد عناصر الملصق (صورة، خط، عبارة) ودور كل منها.\n\nالعصف الذهني للأفكار (8 دقائق):\n- المعلم: يدير عصفًا ذهنيًا لأفكار توعوية (أضرار الألعاب الإلكترونية، السيجارة الإلكترونية…).\n- الطالب: يقترح أفكارًا ويختار فكرة لتصميمه.\n\nاختيار الصور (7 دقائق):\n- المعلم: يوضح إمكانية الاستعانة بتطبيقات الذكاء الاصطناعي المرخصة (Copilot, Canva) لتوليد صور مناسبة.\n- الطالب: يختار صورًا تعبّر عن فكرته من المطبوعات أو التطبيق.\n\nالقص والتركيب (الكولاج) (15 دقيقة):\n- المعلم: يوجه إلى ترتيب الصور بحيث تتجه العين إلى الفكرة الأساسية.\n- الطالب: يقص الصور ويركبها بطريقة الكولاج على الورق المقوى.\n\nالختام (5 دقائق):\n- المعلم: يراجع التكوينات ويحدد ما ينقصها من خطوط تعبيرية للحصة القادمة.\n- الطالب: يعرض تكوينه ويدوّن ملاحظة المعلم.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nالتهيئة (5 دقائق):\n- المعلم: يعرض تصميمين لموضوع واحد: أحدهما بخطوط معبرة والآخر بلا خطوط، ويسأل: أيهما أقوى أثرًا؟\n- الطالب: يختار الأقوى ويعلل بدور الخطوط.\n\nرسم الخطوط التعبيرية (12 دقيقة):\n- المعلم: يوجه إلى رسم خطوط تضيف الدلالة: منكسرة للتوتر، عمودية للقوة.\n- الطالب: يرسم الخطوط المناسبة على تصميمه.\n\nالعبارة التوعوية (8 دقائق):\n- المعلم: يقدم أمثلة لعبارات قصيرة مؤثرة ويوجه لاختيار موضعها وحجمها.\n- الطالب: يضيف عبارة توعوية مختصرة ويُخرج التصميم.\n\nتقويم الوحدة (8 دقائق):\n- المعلم: يوزع بطاقة تقويم وحدة (رحلة الخط) ص 40.\n- الطالب: يجيب عن بطاقة تقويم الوحدة.\n\nالختام (7 دقائق):\n- المعلم: ينظم عرض الأعمال في مرافق المدرسة ويقترح نشرها في حسابات المدرسة كإسهام توعوي.\n- الطالب: يعرض تصميمه ويشرح مدى مناسبة خطوطه للفكرة.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nس1 (مستوى المعرفة): ما الشعور الذي أثارته صورة السمو والشموخ؟\nالإجابة: الفخر والاعتزاز والقوة.\n\nس2 (مستوى التطبيق): أي الخطوط تناسب التعبير عن الغموض؟ ولماذا؟\nالإجابة: الخط الحلزوني؛ لأنه يوحي بالغموض والدوران.\n\nس3 (مستوى الاستدلال): كيف تساعد الخطوط في تعميق المعنى الذي تحمله الصورة الفوتوغرافية؟\nالإجابة: تضيف بعدًا تعبيريًا بصريًا يبرز الشعور ويوجه عين المشاهد إليه.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nس1 (مستوى المعرفة): ما الخامة المستخدمة لإبراز الخطوط في هذا النشاط؟\nالإجابة: الخيوط الملونة (أو الريليف).\n\nس2 (مستوى التطبيق): كيف يعبر لون الخيط عن الشعور؟\nالإجابة: الألوان الحارة تقوي الانفعال والألوان الهادئة توحي بالسكون، فيدعم اللون دلالة الخط.\n\nس3 (مستوى الاستدلال): اقترح طريقة مبتكرة لعرض أعمال الصف تبرز التعبيرات الخطية.\nالإجابة: مثال: معرض «وجوه وخطوط» مع إضاءة جانبية تبرز بروز الخيوط.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nس1 (مستوى المعرفة): ما المقصود بالكولاج؟\nالإجابة: أسلوب فني يقوم على قص الصور والخامات وتركيبها ولصقها في تكوين واحد.\n\nس2 (مستوى التطبيق): لماذا نحدد الفكرة التوعوية قبل اختيار الصور؟\nالإجابة: لتخدم كل الصور الفكرة الأساسية وتصل الرسالة بوضوح.\n\nس3 (مستوى الاستدلال): كيف يمكن للذكاء الاصطناعي أن يدعم تصميمك التوعوي؟\nالإجابة: بتوليد صور وأفكار بصرية تناسب الموضوع يعدّلها الطالب بإبداعه.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nس1 (مستوى المعرفة): أي الخطوط استخدمت للتعبير عن التوتر في تصميمك؟\nالإجابة: الخطوط المنكسرة.\n\nس2 (مستوى التطبيق): ما مواصفات العبارة التوعوية الجيدة؟\nالإجابة: قصيرة، واضحة، مؤثرة، مناسبة لموضوع التصميم.\n\nس3 (مستوى الاستدلال): كيف يسهم تصميمك في نشر الوعي في المدرسة؟\nالإجابة: بعرضه في المرافق أو نشره رقميًا لإيصال الرسالة إلى عدد أكبر من الطلبة.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nس1 (مستوى المعرفة): ماذا كتبت حول صورتك من مشاعر؟\nالإجابة: إجابة شخصية بمشاعر مناسبة للصورة المختارة.\n\nس2 (مستوى التطبيق): اربط شعورًا كتبته بنوع الخط الذي رسمته.\nالإجابة: مثال: الغضب ← خطوط منكسرة؛ لأنها توحي بالتوتر.\n\nس3 (مستوى الاستدلال): اقترح خامة تبرز الخطوط التي رسمتها على الصورة.\nالإجابة: الخيوط الملونة أو الأسلاك الملونة أو الريليف.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nس1 (مستوى المعرفة): أكمل: يضيف الخيط إلى الصورة قيمة ……… و………\nالإجابة: جمالية وتعبيرية.\n\nس2 (مستوى التطبيق): وضّح الشعور الذي جسدته خيوطك في الصورة.\nالإجابة: إجابة شخصية تربط لون الخيط ونوع الخط بالشعور.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث مناسبة الخيوط للشعور المعبر عنه.\nالإجابة: نقد يذكر مدى التطابق بين الشعور ونوع الخط ولونه مع اقتراح تحسين.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nس1 (مستوى المعرفة): اذكر فكرة توعوية مناسبة للتصميم.\nالإجابة: أضرار الألعاب الإلكترونية أو التدخين الإلكتروني.\n\nس2 (مستوى التطبيق): كيف رتبت صورك لتخدم الفكرة الأساسية؟\nالإجابة: إجابة تذكر وضع الصورة الرئيسة في مركز الاهتمام وتوزيع الصور الثانوية حولها.\n\nس3 (مستوى الاستدلال): قيّم: هل تكفي الصور وحدها لإيصال الرسالة؟ وماذا تضيف الخطوط؟\nالإجابة: لا تكفي غالبًا؛ فالخطوط تضيف دلالات انفعالية (التوتر، القوة) تعمّق الرسالة.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nس1 (مستوى المعرفة): ماذا توحي الخطوط العمودية في التصميم التوعوي؟\nالإجابة: القوة.\n\nس2 (مستوى التطبيق): وضّح العلاقة بين الصورة والخط والعبارة في تصميمك.\nالإجابة: الصورة تعرض الموضوع، والخط يضيف الشعور، والعبارة توضح الرسالة.\n\nس3 (مستوى الاستدلال): قيّم تصميمك وتصميم زميل وفق معيار «وضوح الرسالة».\nالإجابة: تقييم يوازن بين التصميمين ويذكر سببًا واقتراح تحسين.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nإرشاد للطالب: يتأمل صور شخصيات عمانية ويلاحظ ملامحها التعبيرية.\nإرشاد لولي الأمر: يساعد ابنه في توفير خيوط ملونة آمنة للحصة القادمة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 28–30.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nإرشاد للطالب: يحضر صورًا تناسب موضوعًا توعويًا (مثل أضرار الألعاب الإلكترونية).\nإرشاد لولي الأمر: يناقش مع ابنه موضوعًا توعويًا يهم الأسرة والمجتمع.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 31–34.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nإرشاد للطالب: يلاحظ الإعلانات التوعوية في محيطه ويتأمل عناصرها.\nإرشاد لولي الأمر: يناقش مع ابنه مخاطر الموضوع التوعوي الذي اختاره.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 35–36.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nإرشاد للطالب: يشارك أسرته رسالة تصميمه التوعوي.\nإرشاد لولي الأمر: يتحاور مع ابنه حول الرسالة التوعوية ويدعم السلوك الصحيح المرتبط بها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 36–40.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=2"]}, {"title": "الدرس الأول: حكاية علم", "unit": "الوحدة الثانية: بين اللون والمعنى", "periods": [{"ax": "اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم", "n": 1, "w": "الأسبوع العاشر: من 8/11/2026 إلى 12/11/2026", "pg": "44–47", "f": ["1. يتعرف دلالات ألوان العلم العماني من خلال أعمال الفنانين.\n2. يختار منتجًا نفعيًا مناسبًا لنقل تصميمه إليه ويحدد مساحة التصميم.\nمخرج آخر: يعتز بالعلم العماني رمزًا للهوية والانتماء.", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: أكواب ورقية، أكياس ورقية، حقيبة قماش", "1. الدلالات اللونية\n2. العلم العماني\n3. المنتج النفعي", "التعلم القبلي: ألوان العلم العماني ومناسبة اليوم الوطني.\n\nالتهيئة:\n- المعلم: يعرض العلم العماني ويسأل: لو كان لكل لون من ألوانه حكاية، فماذا ستروي؟\n- الطالب: يقترح معاني للألوان ويربطها بتاريخ عمان.", "التهيئة (5 دقائق):\n- المعلم: يعرض العلم العماني ويسأل: لو كان لكل لون من ألوانه حكاية، فماذا ستروي؟\n- الطالب: يقترح معاني للألوان ويربطها بتاريخ عمان.\n\nدلالات ألوان العلم (10 دقائق):\n- المعلم: يعرض أعمال الفنانة مريم الحاتمية (الشكل 1 ص 47) ويوضح: الأبيض يدل على السلام، والأحمر على المعارك التي خاضها العمانيون لطرد الغزاة، والأخضر على خصوبة الأرض.\n- الطالب: يستنتج الدلالات من الأعمال ويدونها في خريطة ذهنية.\n\nاختيار المنتج (10 دقائق):\n- المعلم: يعرض نماذج منتجات (أكواب، حقائب، أكياس ورقية، قماش) ويناقش ملاءمة كل منها.\n- الطالب: يختار نوع المنتج الذي سينقل إليه تصميمه.\n\nتحد  3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\n1. ينقل التصميم بدلالاته اللونية الوطنية إلى المنتج قيمةً مضافة.\n2. يقترح طريقة لتسويق منتجه الفني (المعارض، المواقع الإلكترونية).\nمخرج آخر: يدرك مفهوم الصناعات الإبداعية من خلال المنتج الفني.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\n1. يتأمل مشاهد عمانية ويحدد عناصرها الجمالية.\n2. يرسم مشهدًا من عمان بتكوين واضح.\nمخرج آخر: يعتز بجمال الطبيعة والمعالم العمانية.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\n1. يحدد الدرجات اللونية لألوان العلم العماني باستخدام الشريط اللوني.\n2. ينفذ تدرجًا لونيًا من الفاتح إلى الداكن.\nمخرج آخر: يتحلى بالدقة والصبر في تنفيذ التدرج.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\n1. يلوّن المشهد العماني موظفًا دلالات ألوان العلم عن طريق الألوان المتدرجة.\n2. يبدي رأيه في مدى توظيف الدلالات اللونية للعلم في إبراز المعاني الوطنية.\nمخرج آخر: يلخص ما استفاده من الدرس.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nالمخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: فهم\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: فهم", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\n1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. التعلم بالممارسة العملي ن: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\n1. التدرج اللوني\n2. الدرجة اللونية\n3. الشريط اللوني\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\n1. الدلالات اللونية\n2. التدرج اللوني\n3. المعاني الوطنية", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nالتعلم القبلي: ألوان العلم العماني ومناسبة اليوم الوطني.\n\nالتهيئة:\n- المعلم: يعرض العلم العماني ويسأل: لو كان لكل لون من ألوانه حكاية، فماذا ستروي؟\n- الطالب: يقترح معاني للألوان ويربطها بتاريخ عمان.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nالتعلم القبلي: دلالات ألوان العلم العماني ومساحة التصميم المحددة.\n\nالتهيئة:\n- المعلم: يعرض تصميمين: أحدهما متزاحم العناصر والآخر متوازن، ويسأل: أيهما أجمل؟ ولماذا؟\n- الطالب: يختار المتوازن ويعلل بحسن توزيع العناصر.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nالتعلم القبلي: التصميم الملوّن بألوان العلم العماني.\n\nالتهيئة:\n- المعلم: يعرض منتجًا تجاريًا عليه تصميم وطني ويسأل: لماذا يُقبل الناس على شرائه في المناسبات الوطنية؟\n- الطالب: يذكر أن التصميم يضيف قيمة رمزية وجمالية.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nالتعلم القبلي: دلالات ألوان العلم العماني.\n\nالتهيئة:\n- المعلم: يعرض صورًا لمشاهد عمانية (قلعة، جبل، بحر، سوق) ويسأل: أي مشهد يمثلك أكثر؟\n- الطالب: يختار مشهدًا ويذكر سبب اختياره.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nالتعلم القبلي: المشهد العماني المرسوم في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض صورة لأوراق نخلة في ظل وضوء ويسأل: هل الأخضر فيها درجة واحدة؟\n- الطالب: يلاحظ تعدد درجات اللون الواحد.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nالتعلم القبلي: الشريط اللوني والدرجات المحددة لكل عنصر.\n\nالتهيئة:\n- المعلم: يعرض إحدى طرق تلوين المشهد (ص 55) ويسأل: كيف ظهر العلم في المشهد دون أن نرسمه؟\n- الطالب: يلاحظ أن ألوان العلم توزعت على عناصر المشهد.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nالتهيئة (5 دقائق):\n- المعلم: يعرض العلم العماني ويسأل: لو كان لكل لون من ألوانه حكاية، فماذا ستروي؟\n- الطالب: يقترح معاني للألوان ويربطها بتاريخ عمان.\n\nدلالات ألوان العلم (10 دقائق):\n- المعلم: يعرض أعمال الفنانة مريم الحاتمية (الشكل 1 ص 47) ويوضح: الأبيض يدل على السلام، والأحمر على المعارك التي خاضها العمانيون لطرد الغزاة، والأخضر على خصوبة الأرض.\n- الطالب: يستنتج الدلالات من الأعمال ويدونها في خريطة ذهنية.\n\nاختيار المنتج (10 دقائق):\n- المعلم: يعرض نماذج منتجات (أكواب، حقائب، أكياس ورقية، قماش) ويناقش ملاءمة كل منها.\n- الطالب: يختار نوع المنتج الذي سينقل إليه تصميمه.\n\nتحديد مساحة التصميم (10 دقائق):\n- المعلم: يوضح كيف تتحدد مساحة التصميم بحسب شكل المنتج وحجمه.\n- الطالب: يرسم حدود مساحة التصميم على ورقة وفق قياس منتجه.\n\nالختام (5 دقائق):\n- المعلم: يراجع اختيارات الطلبة ويمهد لرسم التصميم.\n- الطالب: يذكر منتجه ودلالة لون سيبرزها.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nالتهيئة (5 دقائق):\n- المعلم: يعرض تصميمين: أحدهما متزاحم العناصر والآخر متوازن، ويسأل: أيهما أجمل؟ ولماذا؟\n- الطالب: يختار المتوازن ويعلل بحسن توزيع العناصر.\n\nرموز التصميم (5 دقائق):\n- المعلم: يعرض رموزًا وطنية مقترحة (الخنجر، القلعة، العلم، الشعار) ويذكّر بمفهوم الإجادة.\n- الطالب: يختار رموز تصميمه.\n\nرسم التصميم (15 دقيقة):\n- المعلم: يتابع رسم العناصر وتوزيعها داخل المساحة المحددة.\n- الطالب: يرسم تصميمه ويوزع عناصره بتوازن.\n\nالتلوين بألوان العلم (12 دقيقة):\n- المعلم: يوجه إلى توظيف الأبيض والأحمر والأخضر بدلالاتها.\n- الطالب: يلوّن التصميم موظفًا ألوان العلم.\n\nالختام (3 دقائق):\n- المعلم: يذكّر بنقل التصميم إلى المنتج في الحصة القادمة.\n- الطالب: يحفظ تصميمه.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nالتهيئة (5 دقائق):\n- المعلم: يعرض منتجًا تجاريًا عليه تصميم وطني ويسأل: لماذا يُقبل الناس على شرائه في المناسبات الوطنية؟\n- الطالب: يذكر أن التصميم يضيف قيمة رمزية وجمالية.\n\nنقل التصميم إلى المنتج (18 دقيقة):\n- المعلم: يوضح طرق النقل (الشف، الرسم المباشر، اللصق) ويتابع التنفيذ.\n- الطالب: ينقل تصميمه إلى المنتج ويلونه بعناية.\n\nالنشاط التسويقي (10 دقائق):\n- المعلم: يقدم مفهوم الصناعات الإبداعية ويطلب إعداد بطاقة تسويق (اسم المنتج، الفئة المستهدفة، مكان العرض).\n- الطالب: يقترح طريقة لتسويق منتجه ويكتب بطاقة تسويقه.\n\nالختام (7 دقائق):\n- المعلم: يناقش طرق توظيف دلالات الألوان في التسويق ويوجه لإحضار صورة لمشهد من عمان.\n- الطالب: يتحدث عن كيفية توظيف دلالات ألوان العلم في منتجه.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورًا لمشاهد عمانية (قلعة، جبل، بحر، سوق) ويسأل: أي مشهد يمثلك أكثر؟\n- الطالب: يختار مشهدًا ويذكر سبب اختياره.\n\nعرض المشاهد العمانية (8 دقائق):\n- المعلم: يعرض صور مشاهد عمانية ويحلل عناصرها (مقدمة، وسط، خلفية).\n- الطالب: يحدد عناصر المشهد ومستوياته.\n\nرسم المشهد (20 دقيقة):\n- المعلم: يتابع رسم المشهد ويوجه إلى تبسيط العناصر وتوزيعها.\n- الطالب: يرسم مشهدًا من عمان من صورته أو من خياله.\n\nالختام (7 دقائق):\n- المعلم: يعرض نماذج ويمهد لاستخدام الشريط اللوني في الحصة القادمة.\n- الطالب: يعرض رسمه ويحدد العناصر التي سيلونها بدلالات العلم.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لأوراق نخلة في ظل وضوء ويسأل: هل الأخضر فيها درجة واحدة؟\n- الطالب: يلاحظ تعدد درجات اللون الواحد.\n\nنمذجة التدرج (8 دقائق):\n- المعلم: ينمذج على السبورة تدرج الأخضر من الفاتح إلى الداكن بإضافة الأبيض أو تعميق الضغط.\n- الطالب: يراقب ويحدد خطوات التدرج.\n\nتنفيذ الشريط اللوني (17 دقيقة):\n- المعلم: يوزع ورقة النشاط ويتابع تنفيذ تدرج الأحمر والأخضر والرمادي الفاتح للأبيض.\n- الطالب: ينفذ الشريط اللوني لكل لون من ألوان العلم.\n\nالختام (10 دقائق):\n- المعلم: يطلب تحديد الدرجات التي سيستخدمها لكل عنصر في مشهده.\n- الطالب: يعلّم على مشهده الدرجات المناسبة لكل عنصر.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يعرض إحدى طرق تلوين المشهد (ص 55) ويسأل: كيف ظهر العلم في المشهد دون أن نرسمه؟\n- الطالب: يلاحظ أن ألوان العلم توزعت على عناصر المشهد.\n\nتلوين المشهد (22 دقيقة):\n- المعلم: يتابع التلوين ويذكّر بالانتقال المتدرج وتوظيف دلالة كل لون.\n- الطالب: يلون مشهده بالدرجات المتدرجة لألوان العلم.\n\nالعرض والنقد (8 دقائق):\n- المعلم: ينظم عرضًا ويسأل: هل أبرزت الألوان المعاني الوطنية؟\n- الطالب: يبدي رأيه في عمله وأعمال زملائه.\n\nالختام (5 دقائق):\n- المعلم: يطلب تلخيص ما استفاده الطالب من الدرس في جملتين.\n- الطالب: يلخص استفادته من درس حكاية علم.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nس1 (مستوى المعرفة): علامَ يدل اللون الأبيض في العلم العماني؟\nالإجابة: السلام.\n\nس2 (مستوى التطبيق): ما دلالة اللون الأحمر في العلم العماني؟\nالإجابة: المعارك التي خاضها العمانيون لطرد الغزاة.\n\nس3 (مستوى الاستدلال): لماذا يختلف شكل مساحة التصميم من منتج إلى آخر؟\nالإجابة: لاختلاف شكل المنتج وحجمه وسطحه، فالكوب أسطواني والحقيبة مستطيلة مثلًا.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nس1 (مستوى المعرفة): ما المقصود بمفهوم الإجادة في التصميم؟\nالإجابة: إتقان العمل والعناية بتفاصيله وجودته.\n\nس2 (مستوى التطبيق): كيف توزع العناصر لتحقيق التوازن؟\nالإجابة: بتوزيعها حول مركز اهتمام دون تزاحم مع مراعاة المساحات.\n\nس3 (مستوى الاستدلال): اقترح رمزًا عمانيًا يدعم دلالة لون الأخضر في تصميمك.\nالإجابة: النخلة أو الجبل الأخضر.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nس1 (مستوى المعرفة): ما المقصود بالقيمة المضافة للمنتج؟\nالإجابة: زيادة قيمة المنتج بإضافة تصميم جمالي ورمزي إليه.\n\nس2 (مستوى التطبيق): اذكر طريقتين لتسويق المنتج الفني.\nالإجابة: المعارض والمواقع الإلكترونية.\n\nس3 (مستوى الاستدلال): كيف يرتبط منتجك بمفهوم الصناعات الإبداعية؟\nالإجابة: لأنه منتج قائم على فكرة وتصميم إبداعي يمكن تسويقه وتحقيق عائد منه.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nس1 (مستوى المعرفة): سمِّ ثلاثة عناصر من مشهد عماني.\nالإجابة: القلعة، النخيل، الجبال (أو البحر والسفن).\n\nس2 (مستوى التطبيق): ما مستويات المشهد التي تمنحه عمقًا؟\nالإجابة: المقدمة والوسط والخلفية.\n\nس3 (مستوى الاستدلال): كيف تربط عناصر مشهدك بدلالات ألوان العلم؟\nالإجابة: مثال: النخيل والمزارع بالأخضر، والقلعة رمز الدفاع بالأحمر، والسماء الصافية بالأبيض.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nس1 (مستوى المعرفة): ما المقصود بالتدرج اللوني؟\nالإجابة: انتقال اللون تدريجيًا من درجة فاتحة إلى درجة داكنة أو العكس.\n\nس2 (مستوى التطبيق): كيف نحصل على درجة أفتح من اللون الأحمر؟\nالإجابة: بإضافة الأبيض أو تخفيف الضغط على القلم.\n\nس3 (مستوى الاستدلال): لماذا يمنح التدرج المشهد إحساسًا بالعمق؟\nالإجابة: لأنه يحاكي الضوء والظل والبعد فيبدو المشهد مجسمًا وواقعيًا.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nس1 (مستوى المعرفة): أين وظفت اللون الأخضر في مشهدك؟ ولماذا؟\nالإجابة: إجابة تربطه بعناصر الخصوبة مثل النخيل والمزارع.\n\nس2 (مستوى التطبيق): كيف أبرز التدرج عناصر المشهد؟\nالإجابة: أعطاها عمقًا ووضوحًا بالفصل بين القريب والبعيد والضوء والظل.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا لعملك يعكس معناه الوطني وعلّل.\nالإجابة: إجابة إبداعية مع تعليل يربط العنوان بالدلالات اللونية.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nس1 (مستوى المعرفة): أكمل: اللون الأخضر في العلم العماني يدل على ………\nالإجابة: خصوبة الأرض.\n\nس2 (مستوى التطبيق): اذكر المنتج الذي اخترته ومساحة التصميم المناسبة له.\nالإجابة: إجابة شخصية صحيحة تربط المنتج بمساحة مناسبة.\n\nس3 (مستوى الاستدلال): كيف يحول التصميم الوطني منتجًا عاديًا إلى منتج ذي قيمة؟\nالإجابة: يضيف إليه قيمة جمالية ورمزية تعبر عن الهوية فيزيد جاذبيته وقيمته.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nس1 (مستوى المعرفة): اذكر ألوان العلم العماني.\nالإجابة: الأبيض والأحمر والأخضر.\n\nس2 (مستوى التطبيق): بيّن كيف وظفت لونًا من ألوان العلم بدلالته في تصميمك.\nالإجابة: إجابة شخصية تربط اللون بدلالته وموضعه في التصميم.\n\nس3 (مستوى الاستدلال): قيّم تصميمك من حيث التوازن وإبراز الدلالات.\nالإجابة: تقييم يحدد نقاط القوة وتعديلًا مقترحًا.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nس1 (مستوى المعرفة): أكمل: يُضاف التصميم إلى المنتج بوصفه ……… مضافة.\nالإجابة: قيمة.\n\nس2 (مستوى التطبيق): تحدث عن كيفية توظيف دلالات ألوان العلم في تصميم منتجك.\nالإجابة: إجابة تربط كل لون بدلالته وموضعه على المنتج.\n\nس3 (مستوى الاستدلال): صمم خطة تسويق مختصرة لمنتجك تتضمن الفئة المستهدفة ومكان البيع.\nالإجابة: مثال: أكواب لأسر الطلبة تُعرض في معرض المدرسة باليوم الوطني وعلى حساب المدرسة.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nس1 (مستوى المعرفة): ما المشهد الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): كيف وزعت عناصر المشهد في مساحة الرسم؟\nالإجابة: إجابة تذكر توزيع العناصر على المقدمة والوسط والخلفية.\n\nس3 (مستوى الاستدلال): اقترح عنصرًا يضيف إلى مشهدك هوية عمانية أوضح.\nالإجابة: مثال: الخنجر أو البرج أو السفينة التقليدية.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nس1 (مستوى المعرفة): كم درجة نفذت في كل شريط لوني؟\nالإجابة: إجابة بحسب ورقة النشاط (عادة من 3 إلى 5 درجات).\n\nس2 (مستوى التطبيق): حدد عنصرًا في مشهدك وبيّن الدرجة اللونية المناسبة له.\nالإجابة: مثال: الجبل البعيد بدرجة فاتحة والقريب بدرجة داكنة.\n\nس3 (مستوى الاستدلال): قيّم انتظام التدرج في شريطك واقترح طريقة لتحسينه.\nالإجابة: تقييم يذكر انسياب الانتقال بين الدرجات واقتراح زيادة المراحل.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nس1 (مستوى المعرفة): اذكر دلالة لون واحد من ألوان العلم وظفته في عملك.\nالإجابة: مثال: الأحمر يدل على المعارك لطرد الغزاة وظفته في القلعة.\n\nس2 (مستوى التطبيق): لخص في جملتين ما استفدته من درس حكاية علم.\nالإجابة: ألوان العلم تحمل دلالات وطنية، ويمكن توظيفها بالتدرج في تصميمات ومشاهد تعبر عن الهوية.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث توظيف الدلالات اللونية للعلم.\nالإجابة: نقد يحدد مواضع التوظيف الناجح واقتراحًا للتحسين.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nإرشاد للطالب: يتأمل حضور ألوان العلم في مظاهر الاحتفال باليوم الوطني.\nإرشاد لولي الأمر: يحدث ابنه عن معاني العلم والمناسبات الوطنية.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 44–47.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nإرشاد للطالب: يتأمل الرموز الوطنية في بيئته (القلاع، الخنجر).\nإرشاد لولي الأمر: يشجع ابنه على إتقان تصميمه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 48.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nإرشاد للطالب: يحضر صورة لمشهد من عمان للنشاط القادم.\nإرشاد لولي الأمر: يشارك ابنه التفكير في طرق عرض منتجه وتسويقه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 49–53.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nإرشاد للطالب: يتأمل مشهدًا عمانيًا من بيئته المحلية.\nإرشاد لولي الأمر: يصطحب ابنه في نزهة لمعلم عماني إن تيسر.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 53–54.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nإرشاد للطالب: يلاحظ تدرج ألوان السماء عند الغروب.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة الألوان المتدرجة في الطبيعة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 55.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nإرشاد للطالب: يحتفظ بعمله في ملف إنجازه ويعرضه على أسرته.\nإرشاد لولي الأمر: يتحاور مع ابنه حول معاني العلم والانتماء للوطن.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 55–58.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=3"]}]);
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
