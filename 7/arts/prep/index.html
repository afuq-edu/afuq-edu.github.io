const D=(window.AFUQ35||function(x){return x})([{"title": "الدرس الأول: الخط لغة المشاعر", "unit": "الوحدة الأولى: رحلة الخط", "periods": [{"ax": "البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين", "n": 1, "w": "الأسبوع الأول: من 6/9/2026 إلى 10/9/2026", "pg": "12–18", "f": ["1. يتعرف الخطوط التعبيرية وأنواعها من خلال تأمل أعمال الفنانين.\n2. يستنتج الدلالة التعبيرية (الشعور الناتج) لكل نوع من أنواع الخطوط.\nمخرج آخر: يقدّر قيمة الخط بوصفه لغة بصرية تنقل المشاعر دون كلمات.", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "1. التعلم التعاوني\n2. التعلم بالاكتشاف\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. السبورة التقليدية\n4. أخرى: ورقتا النشاط (1) و(2)", "1. الخط\n2. الدلالات التعبيرية للخط\n3. الخط المستقيم (العمودي، الأفقي، المائل)\n4. الخط المنحني والمنكسر والحلزوني", "التعلم القبلي: أنواع الخطوط التي درسها الطالب في الصفوف السابقة (مستقيم، منحن، منكسر).\n\nالتهيئة:\n- المعلم: يعرض عملي كاندينسكي وبافيل بيسكاريف (الشكلان 1، 2 ص 13) ويسأل: هل يمكن للخطوط وحدها أن تشعرنا بالفرح أو الهدوء أو الغضب؟\n- الطالب: يتأمل العملين ويعبّر بكلمة واحدة عن الشعور الذي يثيره كل عمل.", "1. التهيئة: يعرض المعلم عملي كاندينسكي وبافيل بيسكاريف (الشكلان 1، 2 ص 13) ويسأل: هل يمكن للخطوط وحدها أن تشعرنا بالفرح أو الهدوء أو الغضب؟ ويتأمل الطالب العملين ويعبّر بكلمة واحدة عن الشعور الذي يثيره كل عمل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تنظيم: يوزع الطلبة على مجموعات تعاونية ويحدد الأدوار (قارئ، كاتب، متحدث)، وينتظم الطالب في مجموعته ويستلم دوره (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحليل أعمال الفنانين (ورقة النشاط 1): يوزع المعلم ورقة النشاط (1) مع عملي حسن مير وخوان ميرو (الشكلان 1، 2 ص 15) ويطلب تحديد نوع الخط وشكله والشعور الناتج من رؤيته، ويحلل الطالب العملين مع مجموعته ويدوّن نوع الخط والشعور الذي يثيره في ورقة النشاط (1) (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. المقارنة بورقة النشاط (2): يعرض المعلم ورقة النشاط (2) التي تربط كل خط بدلالته: العمودي (السمو والنمو والقوة)، الأفقي (الراحة والاستقرار والسكون)، المائل (الحركة والتوتر)، المنحني (الانغلاق والانطواء)، المنكسر (التوتر والغضب والخطر)، الحلزوني (الغموض)، ويقارن الطالب ما استنتجه بما في ورقة النشاط (2) ويصحح استنتاجاته ويعرض المتحدث نتائج المجموعة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. خريطة ذهنية للمفاهيم: يرسم المعلم على السبورة خريطة ذهنية مركزها «الدلالات التعبيرية للخط» ويستكمل فروعها بمشاركة الطلبة (بديلًا عن جدول المفاهيم)، ويشارك الطالب في إكمال فروع الخريطة الذهنية بأنواع الخطوط ودلالاتها (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "س1 (مستوى المعرفة): سمِّ نوعين من الخطوط ظهرا في عملي حسن مير وخوان ميرو.\nالإجابة: الخط المنحني والخط المستقيم (أو أي نوعين صحيحين ظاهرين في العملين).\n\nس2 (مستوى التطبيق): ما الشعور الذي يوحي به الخط المستقيم الأفقي؟\nالإجابة: الراحة والاستقرار والسكون.\n\nس3 (مستوى الاستدلال): لماذا يختار الفنان الخطوط المنكسرة للتعبير عن مشهد عاصفة؟\nالإجابة: لأن الخط المنكسر يوحي بالتوتر والغضب والخطر فيناسب انفعال المشهد.", "س1 (مستوى المعرفة): صِل: الخط العمودي ←؟\nالإجابة: السمو والنمو والقوة.\n\nس2 (مستوى التطبيق): بيّن الفرق بين دلالة الخط المائل ودلالة الخط الحلزوني.\nالإجابة: المائل يوحي بالحركة والتوتر، والحلزوني يوحي بالغموض.\n\nس3 (مستوى الاستدلال): اقترح نوع الخط المناسب للتعبير عن «الهدوء بعد التعب» مع التعليل.\nالإجابة: الخط الأفقي أو المنحني الهادئ؛ لأنهما يوحيان بالراحة والسكون والاستقرار.", "إرشاد للطالب: يلاحظ الخطوط في بيئته (أفق البحر، النخيل، الجبال) ويتأمل الشعور الذي تثيره دون تكليف بواجب منزلي.\nإرشاد لولي الأمر: يشجع ابنه على الحديث عن مشاعره تجاه الخطوط في الصور والمناظر من حوله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 12–18.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=1"]}, {"ax": "فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية", "n": 2, "w": "الأسبوع الثاني: من 13/9/2026 إلى 17/9/2026", "pg": "16، 19–21", "f": ["1. يرسم خطوطًا ذات دلالات تعبيرية تعكس شعوره عند الاستماع لمقطوعة موسيقية.\n2. يتحدث عن الدلالات التعبيرية للخطوط في عمله الفني.\nمخرج آخر: يقترح منتجات فنية يمكن توظيف الدلالات التعبيرية للخط فيها.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: إبداع", "1. التعلم الذاتي\n2. التعلم بالاكتشاف\n3. التعلم بالممارسة العملية", "1. الوسائل المتعددة (سمعية - بصرية)\n2. جهاز عرض البيانات\n3. الأقلام\n4. أخرى: ورق رسم، أقلام حبر وتحبير", "1. فن النيوروجراف (Neurographica)\n2. الدلالات التعبيرية للخط\n3. الإيقاع الخطي", "التعلم القبلي: دلالات أنواع الخطوط التي استنتجها في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض عملًا من مصادر الإلهام (ص 21) ويسأل: لو كانت هذه الخطوط صوتًا، فهل ستكون هادئة أم صاخبة؟\n- الطالب: يجيب ويربط بين حركة الخطوط والإيقاع الصوتي.", "1. التهيئة: يعرض المعلم عملًا من مصادر الإلهام (ص 21) ويسأل: لو كانت هذه الخطوط صوتًا، فهل ستكون هادئة أم صاخبة؟ ويجيب الطالب ويربط بين حركة الخطوط والإيقاع الصوتي (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. التعريف بفن النيوروجراف: يوضح المعلم أن النيوروجراف أسلوب يرسم فيه الفنان خطوطًا حرة متصلة تعبّر عن الشعور ثم تُنعَّم زواياها، ويوزع مساحات العمل وأدواته، ويستلم الطالب ورقة الرسم والأقلام ويستمع للشرح (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. الرسم أثناء الاستماع: يشغّل المعلم المقطوعة الموسيقية للموسيقار فيصل الشبلي ويوجه الطلبة لترك اليد تتحرك وفق الإحساس، ويتجول للتوجيه، ويرسم الطالب خطوطًا ذات دلالات تعبيرية (منحنية، منكسرة، حلزونية…) بحسب شعوره الناتج من الاستماع (15 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. التحبير والتأكيد: يوجه المعلم إلى تحبير الخطوط وتعميق بعضها لإبراز الشعور الغالب، ويحبّر الطالب خطوطه ويؤكد الخطوط الأكثر تعبيرًا عن شعوره (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: ينظم المعلم عرضًا سريعًا ويسأل: أي منتج يمكن أن يحمل هذه الخطوط (كوب، غلاف قصة)؟ وينسق مع الأخصائي النفسي للاطلاع على الأعمال، ويتحدث الطالب عن الدلالات التعبيرية في عمله ويقترح منتجًا نفعيًا يوظفها (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "س1 (مستوى المعرفة): ما المقصود بفن النيوروجراف؟\nالإجابة: أسلوب فني يرسم فيه الفنان خطوطًا حرة متصلة تعبّر عن مشاعره.\n\nس2 (مستوى التطبيق): ارسم خطًا يعبّر عن مقطع موسيقي سريع، وسمِّ نوعه.\nالإجابة: خط منكسر أو مائل متكرر يوحي بالحركة والتوتر.\n\nس3 (مستوى الاستدلال): كيف يمكن أن تختلف خطوط طالبين استمعا للمقطوعة نفسها؟ فسّر.\nالإجابة: تختلف لاختلاف الشعور الذاتي لكل منهما، فالتعبير الخطي شخصي يعكس إحساس صاحبه.", "س1 (مستوى المعرفة): أكمل: يعبر الخط ……… عن الهدوء.\nالإجابة: الأفقي (أو المنحني الهادئ).\n\nس2 (مستوى التطبيق): وضّح الشعور الغالب في عملك واذكر نوع الخط الذي عبّر عنه.\nالإجابة: إجابة شخصية صحيحة تربط الشعور بنوع الخط، مثل: الفرح عبّر عنه الخط المنحني المتموج.\n\nس3 (مستوى الاستدلال): اقترح تصميمًا لغلاف قصة يوظف دلالات الخطوط، وبيّن سبب اختيارك.\nالإجابة: مثال: غلاف قصة مغامرة بخطوط منكسرة ومائلة توحي بالتوتر والحركة.", "إرشاد للطالب: يستمع لمقطوعة هادئة وأخرى سريعة ويلاحظ اختلاف إحساسه بهما.\nإرشاد لولي الأمر: يحاور ابنه حول عمله الفني ويثني على تعبيره عن مشاعره.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 16، 19–21.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=1"]}, {"ax": "أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل", "n": 3, "w": "الأسبوع الثالث: من 20/9/2026 إلى 24/9/2026", "pg": "22–23، 26–27", "f": ["1. يتعرف الدلالات الخطية في أعمال فنية منفذة بالأسلاك.\n2. يخطط لعمل فني بالسلك يوظف دلالات الخطوط التعبيرية.\nمخرج آخر: يلتزم بقواعد الأمن والسلامة عند استخدام الأسلاك وقاطع الأسلاك.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: أسلاك، قاطع أسلاك", "1. الخط في الفراغ\n2. الدلالات الخطية\n3. التشكيل بالسلك", "التعلم القبلي: الدلالات التعبيرية لأنواع الخطوط ورسمها على سطح الورق.\n\nالتهيئة:\n- المعلم: يرفع قطعة سلك أمام الطلبة ويثنيها بأشكال مختلفة ويسأل: هل ما زال هذا خطًا؟\n- الطالب: يلاحظ أن السلك خط يتحرك في الفراغ ويذكر دلالة كل ثنية.", "1. التهيئة: يرفع المعلم قطعة سلك أمام الطلبة ويثنيها بأشكال مختلفة ويسأل: هل ما زال هذا خطًا؟ ويلاحظ الطالب أن السلك خط يتحرك في الفراغ ويذكر دلالة كل ثنية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تحليل أعمال جلال جمعة: يعرض المعلم أعمال الفنان جلال جمعة (الشكل 1 أ، ب، ج ص 22) ويسأل عن أنواع الخطوط التي شكّلها السلك ودلالتها، ويحلل الطالب الأعمال ويحدد نوع الخط ودلالته في كل عمل (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نمذجة مهارات السلك: ينمذج المعلم طرق الثني واللف والتعقيد بالسلك وقطعه بالقاطع مع التنبيه على السلامة، ويراقب الطالب النمذجة ويجرب ثنيات بسيطة على قطعة تدريبية (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. التخطيط للعمل: يطلب المعلم رسم مخطط تمهيدي لشكل سيُنفذ بالسلك يحمل شعورًا محددًا، ويرسم الطالب مخططه ويحدد الشعور المراد ونوع الخطوط التي تعبر عنه (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: يراجع المعلم المخططات ويوجه إلى إحضار خامات مكملة (خرز، فوم، ورق شفاف)، ويعرض الطالب مخططه ويستمع للتغذية الراجعة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "س1 (مستوى المعرفة): ما الخامة التي استخدمها الفنان جلال جمعة في أعماله المعروضة؟\nالإجابة: الأسلاك.\n\nس2 (مستوى التطبيق): كيف يتحول السلك إلى خط تعبيري؟\nالإجابة: بثنيه وتشكيله في الفراغ بخطوط منحنية أو منكسرة أو حلزونية تحمل دلالات تعبيرية.\n\nس3 (مستوى الاستدلال): اقترح شكلًا بالسلك يعبر عن «النمو» وعلّل اختيار خطوطه.\nالإجابة: شجرة أو نبتة صاعدة بخطوط عمودية ومنحنية؛ لأن العمودي يوحي بالسمو والنمو.", "س1 (مستوى المعرفة): اذكر قاعدة سلامة واحدة عند استخدام قاطع الأسلاك.\nالإجابة: توجيه طرف القاطع بعيدًا عن الجسم والوجه، وعدم ترك أطراف السلك حادة.\n\nس2 (مستوى التطبيق): ما الفرق بين الخط المرسوم على الورق والخط المشكّل بالسلك؟\nالإجابة: الخط المرسوم ثنائي الأبعاد، أما السلك فخط يتحرك في الفراغ بثلاثة أبعاد.\n\nس3 (مستوى الاستدلال): قيّم مخططك: هل تعبر خطوطه عن الشعور الذي حددته؟ وضّح.\nالإجابة: إجابة تقييمية تربط نوع الخطوط في المخطط بالشعور المحدد مع اقتراح تعديل إن لزم.", "إرشاد للطالب: يحتفظ بمخططه ويجهّز خامات بسيطة آمنة كالخرز أو الفوم بحسب توجيه المعلم.\nإرشاد لولي الأمر: يساعد ابنه في توفير خامات مستهلكة آمنة دون أدوات حادة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 22–23، 26–27.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afu ديلًا يزيد من قوة التعبير في عمل زميلك.\nالإجابة: مثال: إضافة خطوط منكسرة لتعزيز التوتر أو تكثيف اللفات الحلزونية لتعزيز الغموض.", "س1 (مستوى المعرفة): سمِّ أسلوبين لتشكيل السلك.\nالإجابة: الثني واللف (أو التجديل والتكرار).\n\nس2 (مستوى التطبيق): لماذا نهتم بالاتزان في العمل المنفذ بالسلك؟\nالإجابة: ليثبت العمل ويبدو متوازن الأجزاء بصريًا وجماليًا.\n\nس3 (مستوى الاستدلال): قيّم مدى توظيفك لدلالات الخطوط في عملك حتى الآن.\nالإجابة: إجابة تقييمية تذكر نوع الخطوط المستخدمة ومدى تعبيرها عن الشعور المقصود.", "إرشاد للطالب: يتأمل أعمال فنية من الأسلاك في مصادر الإلهام ص 26–27.\nإرشاد لولي الأمر: يتابع تقدم ابنه في العمل ويشجعه على إكماله في الحصة القادمة داخل المدرسة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 23.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=1"]}, {"ax": "إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه", "n": 5, "w": "الأسبوع الخامس: من 4/10/2026 إلى 8/10/2026", "pg": "23، 26–27", "f": ["1. يُخرج عمله الفني بإضافة خامات مختلفة (خرز، فوم، ورق شفاف) لتأكيد القيمة الجمالية.\n2. يتحدث عن الدلالات التعبيرية للخطوط في عمله.\nمخرج آخر: يصدر حكمًا فنيًا على مدى توظيف الدلالات التعبيرية للخط في الأعمال المعروضة.", "المخرج 1: إبداع\nالمخرج 2: فهم\nالمخرج 3: تقييم", "1. التعلم الذاتي\n2. التعلم التشاركي\n3. التقويم الذاتي", "1. صورة توضيحية\n2. أخرى: خرز، فوم، ورق شفاف، قاعدة فلين", "1. الإخراج الفني\n2. القيمة الجمالية\n3. النقد الفني", "التعلم القبلي: العمل الفني بالسلك الذي شكّله في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يسأل: ما الذي يجعل العمل الفني «جاهزًا للعرض»؟\n- الطالب: يقترح لمسات تكميلية مثل الألوان أو الخامات أو القاعدة.", "1. التهيئة: يسأل المعلم: ما الذي يجعل العمل الفني «جاهزًا للعرض»؟ ويقترح الطالب لمسات تكميلية مثل الألوان أو الخامات أو القاعدة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. إضافة الخامات المكملة: يوجه المعلم إلى إضافة الخرز والفوم والورق الشفاف بشكل يخدم الدلالة ولا يطغى على الخط، ويضيف الطالب الخامات بعناية ويثبت العمل على قاعدة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. المعرض المصغر: ينظم المعلم معرضًا مصغرًا ويطرح أسئلة نقدية: ما الشعور؟ ما الخطوط؟ هل نجحت الخامة؟ ويعرض الطالب عمله ويتحدث عن دلالاته ويستمع لآراء زملائه (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n4. التقويم الذاتي: يوزع المعلم بطاقة تقويم ذاتي بسيطة (الفكرة، التنفيذ، الإخراج)، ويقيّم الطالب عمله وفق البطاقة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يقترح المعلم توظيف الأعمال في تجميل مرافق المدرسة، ويقترح الطالب مكانًا مناسبًا لعرض عمله في المدرسة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "س1 (مستوى المعرفة): اذكر خامتين يمكن إضافتها لإخراج العمل بالسلك.\nالإجابة: الخرز والفوم (أو الورق الشفاف).\n\nس2 (مستوى التطبيق): لماذا يجب ألا تطغى الخامات المضافة على الخطوط؟\nالإجابة: لأن الخط هو العنصر الأساسي الحامل للدلالة التعبيرية في العمل.\n\nس3 (مستوى الاستدلال): انقد عملًا معروضًا من حيث الفكرة والتنفيذ والإخراج.\nالإجابة: نقد متوازن يذكر نقاط القوة وملاحظة للتطوير في كل جانب.", "س1 (مستوى المعرفة): ما الهدف من إضافة الخامات في إخراج العمل؟\nالإجابة: تأكيد القيمة الجمالية للعمل.\n\nس2 (مستوى التطبيق): تحدث عن الشعور الذي عبّر عنه عملك ونوع الخطوط التي استخدمتها.\nالإجابة: إجابة شخصية تربط الشعور بنوع الخطوط ودلالتها.\n\nس3 (مستوى الاستدلال): كيف يمكن توظيف أعمال الصف في تجميل المدرسة؟ اقترح خطة مختصرة.\nالإجابة: مثال: تعليق الأعمال في ممر المدرسة مع بطاقات تشرح دلالات الخطوط.", "إرشاد للطالب: يصوّر عمله (إن أمكن) ويحتفظ به في ملف إنجازه الفني.\nإرشاد لولي الأمر: يشارك ابنه فرحة إنجاز عمله ويشجعه على عرضه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 23، 26–27.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=1"]}], "comb": ["الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\n1. يتعرف الخطوط التعبيرية وأنواعها من خلال تأمل أعمال الفنانين.\n2. يستنتج الدلالة التعبيرية (الشعور الناتج) لكل نوع من أنواع الخطوط.\nمخرج آخر: يقدّر قيمة الخط بوصفه لغة بصرية تنقل المشاعر دون كلمات.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\n1. يرسم خطوطًا ذات دلالات تعبيرية تعكس شعوره عند الاستماع لمقطوعة موسيقية.\n2. يتحدث عن الدلالات التعبيرية للخطوط في عمله الفني.\nمخرج آخر: يقترح منتجات فنية يمكن توظيف الدلالات التعبيرية للخط فيها.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\n1. يتعرف الدلالات الخطية في أعمال فنية منفذة بالأسلاك.\n2. يخطط لعمل فني بالسلك يوظف دلالات الخطوط التعبيرية.\nمخرج آخر: يلتزم بقواعد الأمن والسلامة عند استخدام الأسلاك وقاطع الأسلاك.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\n1. يشكّل عملًا فنيًا بالسلك قائمًا على توظيف دلالات الخطوط التعبيرية.\n2. ينوّع في أساليب التشكيل (الثني، اللف، التكرار) لتحقيق صياغة جمالية.\nمخرج آخر: يتعاون مع زملائه ويحافظ على نظافة مكان العمل.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\n1. يُخرج عمله الفني بإضافة خامات مختلفة (خرز، فوم، ورق شفاف) لتأكيد القيمة الجمالية.\n2. يتحدث عن الدلالات التعبيرية للخطوط في عمله.\nمخرج آخر: يصدر حكمًا فنيًا على مدى توظيف الدلالات التعبيرية للخط في الأعمال المعروضة.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: إبداع\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nالمخرج 1: إبداع\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\n1. التعلم التعاوني\n2. التعلم بالاكتشاف\n3. الحوار والمناقشة\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\n1. التعلم الذاتي\n2. التعلم بالاكتشاف\n3. التعلم بالممارسة العملية\n\nالحصة 3: أعبّر بخطي وأش يرية من أعمال الفنانين\nالتعلم القبلي: أنواع الخطوط التي درسها الطالب في الصفوف السابقة (مستقيم، منحن، منكسر).\n\nالتهيئة:\n- المعلم: يعرض عملي كاندينسكي وبافيل بيسكاريف (الشكلان 1، 2 ص 13) ويسأل: هل يمكن للخطوط وحدها أن تشعرنا بالفرح أو الهدوء أو الغضب؟\n- الطالب: يتأمل العملين ويعبّر بكلمة واحدة عن الشعور الذي يثيره كل عمل.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nالتعلم القبلي: دلالات أنواع الخطوط التي استنتجها في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض عملًا من مصادر الإلهام (ص 21) ويسأل: لو كانت هذه الخطوط صوتًا، فهل ستكون هادئة أم صاخبة؟\n- الطالب: يجيب ويربط بين حركة الخطوط والإيقاع الصوتي.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nالتعلم القبلي: الدلالات التعبيرية لأنواع الخطوط ورسمها على سطح الورق.\n\nالتهيئة:\n- المعلم: يرفع قطعة سلك أمام الطلبة ويثنيها بأشكال مختلفة ويسأل: هل ما زال هذا خطًا؟\n- الطالب: يلاحظ أن السلك خط يتحرك في الفراغ ويذكر دلالة كل ثنية.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nالتعلم القبلي: المخطط التمهيدي ومهارات ثني السلك التي تعلمها في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض مخططًا لطالب ويسأل: ما أول خط يجب تشكيله ليصبح هيكلًا للعمل؟\n- الطالب: يحدد الخط الرئيس في مخططه الذي سيبدأ به.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nالتعلم القبلي: العمل الفني بالسلك الذي شكّله في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يسأل: ما الذي يجعل العمل الفني «جاهزًا للعرض»؟\n- الطالب: يقترح لمسات تكميلية مثل الألوان أو الخامات أو القاعدة.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عملي كاندينسكي وبافيل بيسكاريف (الشكلان 1، 2 ص 13) ويسأل: هل يمكن للخطوط وحدها أن تشعرنا بالفرح أو الهدوء أو الغضب؟ ويتأمل الطالب العملين ويعبّر بكلمة واحدة عن الشعور الذي يثيره كل عمل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تنظيم: يوزع الطلبة على مجموعات تعاونية ويحدد الأدوار (قارئ، كاتب، متحدث)، وينتظم الطالب في مجموعته ويستلم دوره (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحليل أعمال الفنانين (ورقة النشاط 1): يوزع المعلم ورقة النشاط (1) مع عملي حسن مير وخوان ميرو (الشكلان 1، 2 ص 15) ويطلب تحديد نوع الخط وشكله والشعور الناتج من رؤيته، ويحلل الطالب العملين مع مجموعته ويدوّن نوع الخط والشعور الذي يثيره في ورقة النشاط (1) (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. المقارنة بورقة النشاط (2): يعرض المعلم ورقة النشاط (2) التي تربط كل خط بدلالته: العمودي (السمو والنمو والقوة)، الأفقي (الراحة والاستقرار والسكون)، المائل (الحركة والتوتر)، المنحني (الانغلاق والانطواء)، المنكسر (التوتر والغضب والخطر)، الحلزوني (الغموض)، ويقارن الطالب ما استنتجه بما في ورقة النشاط (2) ويصحح استنتاجاته ويعرض المتحدث نتائج المجموعة (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. خريطة ذهنية للمفاهيم: يرسم المعلم على السبورة خريطة ذهنية مركزها «الدلالات التعبيرية للخط» ويستكمل فروعها بمشاركة الطلبة (بديلًا عن جدول المفاهيم)، ويشارك الطالب في إكمال فروع الخريطة الذهنية بأنواع الخطوط ودلالاتها (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عملًا من مصادر الإلهام (ص 21) ويسأل: لو كانت هذه الخطوط صوتًا، فهل ستكون هادئة أم صاخبة؟ ويجيب الطالب ويربط بين حركة الخطوط والإيقاع الصوتي (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التعريف بفن النيوروجراف: يوضح المعلم أن النيوروجراف أسلوب يرسم فيه الفنان خطوطًا حرة متصلة تعبّر عن الشعور ثم تُنعَّم زواياها، ويوزع مساحات العمل وأدواته، ويستلم الطالب ورقة الرسم والأقلام ويستمع للشرح (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الرسم أثناء الاستماع: يشغّل المعلم المقطوعة الموسيقية للموسيقار فيصل الشبلي ويوجه الطلبة لترك اليد تتحرك وفق الإحساس، ويتجول للتوجيه، ويرسم الطالب خطوطًا ذات دلالات تعبيرية (منحنية، منكسرة، حلزونية…) بحسب شعوره الناتج من الاستماع (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. التحبير والتأكيد: يوجه المعلم إلى تحبير الخطوط وتعميق بعضها لإبراز الشعور الغالب، ويحبّر الطالب خطوطه ويؤكد الخطوط الأكثر تعبيرًا عن شعوره (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: ينظم المعلم عرضًا سريعًا ويسأل: أي منتج يمكن أن يحمل هذه الخطوط (كوب، غلاف قصة)؟ وينسق مع الأخصائي النفسي للاطلاع على الأعمال، ويتحدث الطالب عن الدلالات التعبيرية في عمله ويقترح منتجًا نفعيًا يوظفها (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل — زمن الحصة 40 دقيقة\n\n1. التهيئة: يرفع المعلم قطعة سلك أمام الطلبة ويثنيها بأشكال مختلفة ويسأل: هل ما زال هذا خطًا؟ ويلاحظ الطالب أن السلك خط يتحرك في الفراغ ويذكر دلالة كل ثنية (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. تحليل أعمال جلال جمعة: يعرض المعلم أعمال الفنان جلال جمعة (الشكل 1 أ، ب، ج ص 22) ويسأل عن أنواع الخطوط التي شكّلها السلك ودلالتها، ويحلل الطالب الأعمال ويحدد نوع الخط ودلالته في كل عمل (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. نمذجة مهارات السلك: ينمذج المعلم طرق الثني واللف والتعقيد بالسلك وقطعه بالقاطع مع التنبيه على السلامة، ويراقب الطالب النمذجة ويجرب ثنيات بسيطة على قطعة تدريبية (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. التخطيط للعمل: يطلب المعلم رسم مخطط تمهيدي لشكل سيُنفذ بالسلك يحمل شعورًا محددًا، ويرسم الطالب مخططه ويحدد الشعور المراد ونوع الخطوط التي تعبر عنه (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يراجع المعلم المخططات ويوجه إلى إحضار خامات مكملة (خرز، فوم، ورق شفاف)، ويعرض الطالب مخططه ويستمع للتغذية الراجعة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم مخططًا لطالب ويسأل: ما أول خط يجب تشكيله ليصبح هيكلًا للعمل؟ ويحدد الطالب الخط الرئيس في مخططه الذي سيبدأ به (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. توزيع الخامات: يوزع المعلم الأسلاك والقواطع ويذكّر بقواعد السلامة، ويستلم الطالب الخامات ويرتب مكان عمله (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تنفيذ الهيكل الخطي: يتابع المعلم التنفيذ ويوجه إلى الاتزان وتنوع الخطوط وتقديم دعم فردي للمتعثرين، ويشكل الطالب الهيكل الرئيس بالسلك ثم يضيف الخطوط الثانوية المعبرة عن الشعور (20 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تقويم في منتصف العمل: يطلب المعلم من كل طالبين تبادل الأعمال وإبداء ملاحظة واحدة، ويتبادل الطالب العمل مع زميله ويقدم ملاحظة بنّاءة ويستفيد منها (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. الختام: يوجه المعلم إلى حفظ الأعمال وتنظيف المكان وجمع بقايا الأسلاك، ويحفظ الطالب عمله وينظف مكانه (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الذي يجعل العمل الفني «جاهزًا للعرض»؟ ويقترح الطالب لمسات تكميلية مثل الألوان أو الخامات أو القاعدة (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. إضافة الخامات المكملة: يوجه المعلم إلى إضافة الخرز والفوم والورق الشفاف بشكل يخدم الدلالة ولا يطغى على الخط، ويضيف الطالب الخامات بعناية ويثبت العمل على قاعدة (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. المعرض المصغر: ينظم المعلم معرضًا مصغرًا ويطرح أسئلة نقدية: ما الشعور؟ ما الخطوط؟ هل نجحت الخامة؟ ويعرض الطالب عمله ويتحدث عن دلالاته ويستمع لآراء زملائه (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. التقويم الذاتي: يوزع المعلم بطاقة تقويم ذاتي بسيطة (الفكرة، التنفيذ، الإخراج)، ويقيّم الطالب عمله وفق البطاقة (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n5. الختام: يقترح المعلم توظيف الأعمال في تجميل مرافق المدرسة، ويقترح الطالب مكانًا مناسبًا لعرض عمله في المدرسة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nس1 (مستوى المعرفة): سمِّ نوعين من الخطوط ظهرا في عملي حسن مير وخوان ميرو.\nالإجابة: الخط المنحني والخط المستقيم (أو أي نوعين صحيحين ظاهرين في العملين).\n\nس2 (مستوى التطبيق): ما الشعور الذي يوحي به الخط المستقيم الأفقي؟\nالإجابة: الراحة والاستقرار والسكون.\n\nس3 (مستوى الاستدلال): لماذا يختار الفنان الخطوط المنكسرة للتعبير عن مشهد عاصفة؟\nالإجابة: لأن الخط المنكسر يوحي بالتوتر والغضب والخطر فيناسب انفعال المشهد.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nس1 (مستوى المعرفة): ما المقصود بفن النيوروجراف؟\nالإجابة: أسلوب فني يرسم فيه الفنان خطوطًا حرة متصلة تعبّر عن مشاعره.\n\nس2 (مستوى التطبيق): ارسم خطًا يعبّر عن مقطع موسيقي سريع، وسمِّ نوعه.\nالإجابة: خط منكسر أو مائل متكرر يوحي بالحركة والتوتر.\n\nس3 (مستوى الاستدلال): كيف يمكن أن تختلف خطوط طالبين استمعا للمقطوعة نفسها؟ فسّر.\nالإجابة: تختلف لاختلاف الشعور الذاتي لكل منهما، فالتعبير الخطي شخصي يعكس إحساس صاحبه.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nس1 (مستوى المعرفة): ما الخامة التي استخدمها الفنان جلال جمعة في أعماله المعروضة؟\nالإجابة: الأسلاك.\n\nس2 (مستوى التطبيق): كيف يتحول السلك إلى خط تعبيري؟\nالإجابة: بثنيه وتشكيله في الفراغ بخطوط منحنية أو منكسرة أو حلزونية تحمل دلالات تعبيرية.\n\nس3 (مستوى الاستدلال): اقترح شكلًا بالسلك يعبر عن «النمو» وعلّل اختيار خطوطه.\nالإجابة: شجرة أو نبتة صاعدة بخطوط عمودية ومنحنية؛ لأن العمودي يوحي بالسمو والنمو.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nس1 (مستوى المعرفة): ما الخطوة الأولى في تشكيل العمل بالسلك؟\nالإجابة: تشكيل الهيكل أو الخط الرئيس للعمل.\n\nس2 (مستوى التطبيق): كيف تحقق الإيقاع في عمل منفذ بالسلك؟\nالإجابة: بتكرار الثنيات أو الحلقات بانتظام أو بتدرج.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يزيد من قوة التعبير في عمل زميلك.\nالإجابة: مثال: إضافة خطوط منكسرة لتعزيز التوتر أو تكثيف اللفات الحلزونية لتعزيز الغموض.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nس1 (مستوى المعرفة): اذكر خامتين يمكن إضافتها لإخراج العمل بالسلك.\nالإجابة: الخرز والفوم (أو الورق الشفاف).\n\nس2 (مستوى التطبيق): لماذا يجب ألا تطغى الخامات المضافة على الخطوط؟\nالإجابة: لأن الخط هو العنصر الأساسي الحامل للدلالة التعبيرية في العمل.\n\nس3 (مستوى الاستدلال): انقد عملًا معروضًا من حيث الفكرة والتنفيذ والإخراج.\nالإجابة: نقد متوازن يذكر نقاط القوة وملاحظة للتطوير في كل جانب.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nس1 (مستوى المعرفة): صِل: الخط العمودي ←؟\nالإجابة: السمو والنمو والقوة.\n\nس2 (مستوى التطبيق): بيّن الفرق بين دلالة الخط المائل ودلالة الخط الحلزوني.\nالإجابة: المائل يوحي بالحركة والتوتر، والحلزوني يوحي بالغموض.\n\nس3 (مستوى الاستدلال): اقترح نوع الخط المناسب للتعبير عن «الهدوء بعد التعب» مع التعليل.\nالإجابة: الخط الأفقي أو المنحني الهادئ؛ لأنهما يوحيان بالراحة والسكون والاستقرار.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nس1 (مستوى المعرفة): أكمل: يعبر الخط ……… عن الهدوء.\nالإجابة: الأفقي (أو المنحني الهادئ).\n\nس2 (مستوى التطبيق): وضّح الشعور الغالب في عملك واذكر نوع الخط الذي عبّر عنه.\nالإجابة: إجابة شخصية صحيحة تربط الشعور بنوع الخط، مثل: الفرح عبّر عنه الخط المنحني المتموج.\n\nس3 (مستوى الاستدلال): اقترح تصميمًا لغلاف قصة يوظف دلالات الخطوط، وبيّن سبب اختيارك.\nالإجابة: مثال: غلاف قصة مغامرة بخطوط منكسرة ومائلة توحي بالتوتر والحركة.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nس1 (مستوى المعرفة): اذكر قاعدة سلامة واحدة عند استخدام قاطع الأسلاك.\nالإجابة: توجيه طرف القاطع بعيدًا عن الجسم والوجه، وعدم ترك أطراف السلك حادة.\n\nس2 (مستوى التطبيق): ما الفرق بين الخط المرسوم على الورق والخط المشكّل بالسلك؟\nالإجابة: الخط المرسوم ثنائي الأبعاد، أما السلك فخط يتحرك في الفراغ بثلاثة أبعاد.\n\nس3 (مستوى الاستدلال): قيّم مخططك: هل تعبر خطوطه عن الشعور الذي حددته؟ وضّح.\nالإجابة: إجابة تقييمية تربط نوع الخطوط في المخطط بالشعور المحدد مع اقتراح تعديل إن لزم.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nس1 (مستوى المعرفة): سمِّ أسلوبين لتشكيل السلك.\nالإجابة: الثني واللف (أو التجديل والتكرار).\n\nس2 (مستوى التطبيق): لماذا نهتم بالاتزان في العمل المنفذ بالسلك؟\nالإجابة: ليثبت العمل ويبدو متوازن الأجزاء بصريًا وجماليًا.\n\nس3 (مستوى الاستدلال): قيّم مدى توظيفك لدلالات الخطوط في عملك حتى الآن.\nالإجابة: إجابة تقييمية تذكر نوع الخطوط المستخدمة ومدى تعبيرها عن الشعور المقصود.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nس1 (مستوى المعرفة): ما الهدف من إضافة الخامات في إخراج العمل؟\nالإجابة: تأكيد القيمة الجمالية للعمل.\n\nس2 (مستوى التطبيق): تحدث عن الشعور الذي عبّر عنه عملك ونوع الخطوط التي استخدمتها.\nالإجابة: إجابة شخصية تربط الشعور بنوع الخطوط ودلالتها.\n\nس3 (مستوى الاستدلال): كيف يمكن توظيف أعمال الصف في تجميل المدرسة؟ اقترح خطة مختصرة.\nالإجابة: مثال: تعليق الأعمال في ممر المدرسة مع بطاقات تشرح دلالات الخطوط.", "الحصة 1: البعد التعبيري للخط: استنتاج الدلالات التعبيرية من أعمال الفنانين\nإرشاد للطالب: يلاحظ الخطوط في بيئته (أفق البحر، النخيل، الجبال) ويتأمل الشعور الذي تثيره دون تكليف بواجب منزلي.\nإرشاد لولي الأمر: يشجع ابنه على الحديث عن مشاعره تجاه الخطوط في الصور والمناظر من حوله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 12–18.\n\nالحصة 2: فن النيوروجراف: رسم خطوط تعبيرية بحسب الشعور الناتج من الاستماع لمقطوعة موسيقية\nإرشاد للطالب: يستمع لمقطوعة هادئة وأخرى سريعة ويلاحظ اختلاف إحساسه بهما.\nإرشاد لولي الأمر: يحاور ابنه حول عمله الفني ويثني على تعبيره عن مشاعره.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 16، 19–21.\n\nالحصة 3: أعبّر بخطي وأشكّل بأسلاكي: الدلالات الخطية في أعمال جلال جمعة وتخطيط العمل\nإرشاد للطالب: يحتفظ بمخططه ويجهّز خامات بسيطة آمنة كالخرز أو الفوم بحسب توجيه المعلم.\nإرشاد لولي الأمر: يساعد ابنه في توفير خامات مستهلكة آمنة دون أدوات حادة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 22–23، 26–27.\n\nالحصة 4: تشكيل عمل فني بالسلك يوظف دلالات الخطوط التعبيرية في صياغة جمالية\nإرشاد للطالب: يتأمل أعمال فنية من الأسلاك في مصادر الإلهام ص 26–27.\nإرشاد لولي الأمر: يتابع تقدم ابنه في العمل ويشجعه على إكماله في الحصة القادمة داخل المدرسة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 23.\n\nالحصة 5: إخراج العمل الفني بالسلك بإضافة الخامات وعرضه وتقويمه\nإرشاد للطالب: يصوّر عمله (إن أمكن) ويحتفظ به في ملف إنجازه الفني.\nإرشاد لولي الأمر: يشارك ابنه فرحة إنجاز عمله ويشجعه على عرضه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 23، 26–27.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=1"]}, {"title": "الدرس الثاني: ما بين الخط و 2 (مستوى التطبيق): أي الخطوط تناسب التعبير عن الغموض؟ ولماذا؟\nالإجابة: الخط الحلزوني؛ لأنه يوحي بالغموض والدوران.\n\nس3 (مستوى الاستدلال): كيف تساعد الخطوط في تعميق المعنى الذي تحمله الصورة الفوتوغرافية؟\nالإجابة: تضيف بعدًا تعبيريًا بصريًا يبرز الشعور ويوجه عين المشاهد إليه.", "س1 (مستوى المعرفة): ماذا كتبت حول صورتك من مشاعر؟\nالإجابة: إجابة شخصية بمشاعر مناسبة للصورة المختارة.\n\nس2 (مستوى التطبيق): اربط شعورًا كتبته بنوع الخط الذي رسمته.\nالإجابة: مثال: الغضب ← خطوط منكسرة؛ لأنها توحي بالتوتر.\n\nس3 (مستوى الاستدلال): اقترح خامة تبرز الخطوط التي رسمتها على الصورة.\nالإجابة: الخيوط الملونة أو الأسلاك الملونة أو الريليف.", "إرشاد للطالب: يتأمل صور شخصيات عمانية ويلاحظ ملامحها التعبيرية.\nإرشاد لولي الأمر: يساعد ابنه في توفير خيوط ملونة آمنة للحصة القادمة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 28–30.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=2"]}, {"ax": "هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط", "n": 2, "w": "الأسبوع السابع: من 18/10/2026 إلى 22/10/2026", "pg": "31–34", "f": ["1. يبرز الخطوط التعبيرية الدالة على المشاعر باستخدام الخيوط أو الريليف.\n2. يعبّر عن مشاعره بتوظيف خامة تجسد الدلالات التعبيرية للخط.\nمخرج آخر: يقترح أفكارًا إبداعية لتوظيف التعبيرات الخطية في عرض الأعمال.", "المخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: إبداع", "1. التعلم الذاتي\n2. التعلم التشاركي\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. أخرى: خيوط ملونة، ريليف، صمغ", "1. القيمة الجمالية\n2. القيمة التعبيرية\n3. الخامة والخط", "التعلم القبلي: الصورة التي أضاف إليها الخطوط الدالة على المشاعر في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض عملًا من مصادر الإلهام (ص 34) ويسأل: ماذا أضاف الخيط إلى الصورة؟\n- الطالب: يلاحظ أن الخيط أبرز الخط وأعطاه ملمسًا وقيمة جمالية.", "1. التهيئة: يعرض المعلم عملًا من مصادر الإلهام (ص 34) ويسأل: ماذا أضاف الخيط إلى الصورة؟ ويلاحظ الطالب أن الخيط أبرز الخط وأعطاه ملمسًا وقيمة جمالية (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. نمذجة الإبراز: ينمذج المعلم تثبيت الخيط على خط مرسوم باستخدام الصمغ بخطوات قصيرة، ويتابع الطالب ويحدد الخطوط التي سيبرزها (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. إبراز الخطوط بالخيوط: يتابع المعلم ويوجه إلى اختيار لون الخيط بما يناسب الشعور، ويثبت الطالب الخيوط على الخطوط الدالة على المشاعر ليضيف قيمة جمالية وتعبيرية (20 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. يناقش المعلم قدرة كل طالب على التعبير عن مشاعره بالخامة، ويوضح الطالب كيف جسّد الخيط شعورًا محددًا (5 دقائق)\nالاستراتيجيات: المناقشة.\n\n5. الختام: يطلب المعلم اقتراح طريقة لعرض الأعمال ويوجه لإحضار صور تناسب موضوعًا توعويًا للحصة القادمة، ويقترح الطالب فكرة عرض ويستعد للنشاط القادم (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "س1 (مستوى المعرفة): ما الخامة المستخدمة لإبراز الخطوط في هذا النشاط؟\nالإجابة: الخيوط الملونة (أو الريليف).\n\nس2 (مستوى التطبيق): كيف يعبر لون الخيط عن الشعور؟\nالإجابة: الألوان الحارة تقوي الانفعال والألوان الهادئة توحي بالسكون، فيدعم اللون دلالة الخط.\n\nس3 (مستوى الاستدلال): اقترح طريقة مبتكرة لعرض أعمال الصف تبرز التعبيرات الخطية.\nالإجابة: مثال: معرض «وجوه وخطوط» مع إضاءة جانبية تبرز بروز الخيوط.", "س1 (مستوى المعرفة): أكمل: يضيف الخيط إلى الصورة قيمة ……… و………\nالإجابة: جمالية وتعبيرية.\n\nس2 (مستوى التطبيق): وضّح الشعور الذي جسدته خيوطك في الصورة.\nالإجابة: إجابة شخصية تربط لون الخيط ونوع الخط بالشعور.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث مناسبة الخيوط للشعور المعبر عنه.\nالإجابة: نقد يذكر مدى التطابق بين الشعور ونوع الخط ولونه مع اقتراح تحسين.", "إرشاد للطالب: يحضر صورًا تناسب موضوعًا توعويًا (مثل أضرار الألعاب الإلكترونية).\nإرشاد لولي الأمر: يناقش مع ابنه موضوعًا توعويًا يهم الأسرة والمجتمع.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 31–34.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=2"]}, {"ax": "خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج", "n": 3, "w": "الأسبوع الثامن: من 25/10/2026 إلى 29/10/2026", "pg": "35–36", "f": ["1. يحدد فكرة توعوية ويختار صورًا تعبّر عنها.\n2. يركّب الصور بطريقة الكولاج بما يخدم الفكرة الأساسية.\nمخرج آخر: يدرك دور الفن في نشر الوعي المجتمعي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم المبني على حل المشكلات\n2. التعلم التعاوني\n3. العصف الذهني", "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. صورة توضيحية\n4. أخرى: ورق مقوى، مقص، لاصق", "1. الكولاج\n2. الإعلان التوعوي\n3. الفكرة الأساسية", "التعلم القبلي: الدلالات التعبيرية للخطوط وتوظيفها في الصورة الفوتوغرافية.\n\nالتهيئة:\n- المعلم: يعرض ملصقًا توعويًا ويسأل: كيف أوصل التصميم رسالته بسرعة؟\n- الطالب: يحدد عناصر الملصق (صورة، خط، عبارة) ودور كل منها.", "1. التهيئة: يعرض المعلم ملصقًا توعويًا ويسأل: كيف أوصل التصميم رسالته بسرعة؟ ويحدد الطالب عناصر الملصق (صورة، خط، عبارة) ودور كل منها (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يدير المعلم عصفًا ذهنيًا لأفكار توعوية (أضرار الألعاب الإلكترونية، السيجارة الإلكترونية…)، ويقترح الطالب أفكارًا ويختار فكرة لتصميمه (8 دقائق)\nالاستراتيجيات: العصف الذهني للأفكار.\n\n3. اختيار الصور: يوضح المعلم إمكانية الاستعانة بتطبيقات الذكاء الاصطناعي المرخصة (Copilot, Canva) لتوليد صور مناسبة، ويختار الطالب صورًا تعبّر عن فكرته من المطبوعات أو التطبيق (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. القص والتركيب (الكولاج): يوجه المعلم إلى ترتيب الصور بحيث تتجه العين إلى الفكرة الأساسية، ويقص الطالب الصور ويركبها بطريقة الكولاج على الورق المقوى (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: يراجع المعلم التكوينات ويحدد ما ينقصها من خطوط تعبيرية للحصة القادمة، ويعرض الطالب تكوينه ويدوّن ملاحظة المعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "س1 (مستوى المعرفة): ما المقصود بالكولاج؟\nالإجابة: أسلوب فني يقوم على قص الصور والخامات وتركيبها ولصقها في تكوين واحد.\n\nس2 (مستوى التطبيق): لماذا نحدد الفكرة التوعوية قبل اختيار الصور؟\nالإجابة: لتخدم كل الصور الفكرة الأساسية وتصل الرسالة بوضوح.\n\nس3 (مستوى الاستدلال): كيف يمكن للذكاء الاصطناعي أن يدعم تصميمك التوعوي؟\nالإجابة: بتوليد صور وأفكار بصرية تناسب الموضوع يعدّلها الطالب بإبداعه.", "س1 (مستوى المعرفة): اذكر فكرة توعوية مناسبة للتصميم.\nالإجابة: أضرار الألعاب الإلكترونية أو التدخين الإلكتروني.\n\nس2 (مستوى التطبيق): كيف رتبت صورك لتخدم الفكرة الأساسية؟\nالإجابة: إجابة تذكر وضع الصورة الرئيسة في مركز الاهتمام وتوزيع الصور الثانوية حولها.\n\nس3 (مستوى الاستدلال): قيّم: هل تكفي الصور وحدها لإيصال الرسالة؟ وماذا تضيف الخطوط؟\nالإجابة: لا تكفي غالبًا؛ فالخطوط تضيف دلالات انفعالية (التوتر، القوة) تعمّق الرسالة.", "إرشاد للطالب: يلاحظ الإعلانات التوعوية في محيطه ويتأمل عناصرها.\nإرشاد لولي الأمر: يناقش مع ابنه مخاطر الموضوع التوعوي الذي اختاره.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 35–36.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=2"]}, {"ax": "خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة", "n": 4, "w": "الأسبوع التاسع: من 1/11/2026 إلى 5/11/2026", "pg": "36–40", "f": ["1. يرسم الخطوط المناسبة لإضافة الدلالات التعبيرية إلى الموضوع التوعوي.\n2. يُخرج التصميم الإعلاني بعبارة توعوية في صورته النهائية.\nمخرج آخر: يوضح مدى مناسبة الخطوط في إبراز الفكرة التوعوية ويقيّم تعلمه في الوحدة.", "المخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: تقييم", "1. التعلم الذاتي\n2. التعلم التشاركي\n3. التقويم الذاتي", "1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: أقلام تلوين، خيوط، بطاقة تقويم الوحدة", "1. الخطوط المنكسرة (التوتر)\n2. الخطوط العمودية (القوة)\n3. العبارة التوعوية\n4. الإخراج النهائي", "التعلم القبلي: تكوين الكولاج الذي ركّبه في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض تصميمين لموضوع واحد: أحدهما بخطوط معبرة والآخر بلا خطوط، ويسأل: أيهما أقوى أثرًا؟\n- الطالب: يختار الأقوى ويعلل بدور الخطوط.", "1. التهيئة: يعرض المعلم تصميمين لموضوع واحد: أحدهما بخطوط معبرة والآخر بلا خطوط، ويسأل: أيهما أقوى أثرًا؟ ويختار الطالب الأقوى ويعلل بدور الخطوط (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. رسم الخطوط التعبيرية: يوجه المعلم إلى رسم خطوط تضيف الدلالة: منكسرة للتوتر، عمودية للقوة، ويرسم الطالب الخطوط المناسبة على تصميمه (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. العبارة التوعوية: يقدم المعلم أمثلة لعبارات قصيرة مؤثرة ويوجه لاختيار موض يعرض تصميمين لموضوع واحد: أحدهما بخطوط معبرة والآخر بلا خطوط، ويسأل: أيهما أقوى أثرًا؟\n- الطالب: يختار الأقوى ويعلل بدور الخطوط.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورتين للمصورة نوف السيابية (الشكل 1 أ، ب ص 29) ويسأل: ماذا تقول ملامح هذا الوجه؟ ويصف الطالب الشعور: السمو والشموخ في الأولى والغموض في الثانية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اختيار الصورة: يوزع المعلم صورًا فوتوغرافية متنوعة ويوجه كل طالب لاختيار صورة شخصية، ويختار الطالب صورة ويتأمل تفاصيلها (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. كتابة المشاعر: يطلب المعلم كتابة المشاعر الناتجة عن التأمل (السمو، الغموض، الغضب…) حول الصورة، ويكتب الطالب المشاعر التي تثيرها الصورة بجانبها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. إضافة الخطوط الدالة: يوجه المعلم إلى رسم الخطوط الدالة على كل شعور مكتوب حول الصورة أو عليها، ويرسم الطالب خطوطًا تعبّر عن المشاعر المكتوبة (عمودية للسمو، حلزونية للغموض…) (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: يطلب المعلم من طالبين عرض عمليهما ويوجه لإحضار خيوط ملونة للحصة القادمة، ويعرض الطالب عمله ويستعد بالخامات المطلوبة (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عملًا من مصادر الإلهام (ص 34) ويسأل: ماذا أضاف الخيط إلى الصورة؟ ويلاحظ الطالب أن الخيط أبرز الخط وأعطاه ملمسًا وقيمة جمالية (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. نمذجة الإبراز: ينمذج المعلم تثبيت الخيط على خط مرسوم باستخدام الصمغ بخطوات قصيرة، ويتابع الطالب ويحدد الخطوط التي سيبرزها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. إبراز الخطوط بالخيوط: يتابع المعلم ويوجه إلى اختيار لون الخيط بما يناسب الشعور، ويثبت الطالب الخيوط على الخطوط الدالة على المشاعر ليضيف قيمة جمالية وتعبيرية (20 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. يناقش المعلم قدرة كل طالب على التعبير عن مشاعره بالخامة، ويوضح الطالب كيف جسّد الخيط شعورًا محددًا (5 دقائق)\nالاستراتيجيات: المناقشة.\n\n5. الختام: يطلب المعلم اقتراح طريقة لعرض الأعمال ويوجه لإحضار صور تناسب موضوعًا توعويًا للحصة القادمة، ويقترح الطالب فكرة عرض ويستعد للنشاط القادم (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم ملصقًا توعويًا ويسأل: كيف أوصل التصميم رسالته بسرعة؟ ويحدد الطالب عناصر الملصق (صورة، خط، عبارة) ودور كل منها (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. يدير المعلم عصفًا ذهنيًا لأفكار توعوية (أضرار الألعاب الإلكترونية، السيجارة الإلكترونية…)، ويقترح الطالب أفكارًا ويختار فكرة لتصميمه (8 دقائق)\nالاستراتيجيات: العصف الذهني للأفكار.\n\n3. اختيار الصور: يوضح المعلم إمكانية الاستعانة بتطبيقات الذكاء الاصطناعي المرخصة (Copilot, Canva) لتوليد صور مناسبة، ويختار الطالب صورًا تعبّر عن فكرته من المطبوعات أو التطبيق (7 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. القص والتركيب (الكولاج): يوجه المعلم إلى ترتيب الصور بحيث تتجه العين إلى الفكرة الأساسية، ويقص الطالب الصور ويركبها بطريقة الكولاج على الورق المقوى (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: يراجع المعلم التكوينات ويحدد ما ينقصها من خطوط تعبيرية للحصة القادمة، ويعرض الطالب تكوينه ويدوّن ملاحظة المعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم تصميمين لموضوع واحد: أحدهما بخطوط معبرة والآخر بلا خطوط، ويسأل: أيهما أقوى أثرًا؟ ويختار الطالب الأقوى ويعلل بدور الخطوط (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. رسم الخطوط التعبيرية: يوجه المعلم إلى رسم خطوط تضيف الدلالة: منكسرة للتوتر، عمودية للقوة، ويرسم الطالب الخطوط المناسبة على تصميمه (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. العبارة التوعوية: يقدم المعلم أمثلة لعبارات قصيرة مؤثرة ويوجه لاختيار موضعها وحجمها، ويضيف الطالب عبارة توعوية مختصرة ويُخرج التصميم (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تقويم الوحدة: يوزع المعلم بطاقة تقويم وحدة (رحلة الخط) ص 40، ويجيب الطالب عن بطاقة تقويم الوحدة (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. الختام: ينظم المعلم عرض الأعمال في مرافق المدرسة ويقترح نشرها في حسابات المدرسة كإسهام توعوي، ويعرض الطالب تصميمه ويشرح مدى مناسبة خطوطه للفكرة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nس1 (مستوى المعرفة): ما الشعور الذي أثارته صورة السمو والشموخ؟\nالإجابة: الفخر والاعتزاز والقوة.\n\nس2 (مستوى التطبيق): أي الخطوط تناسب التعبير عن الغموض؟ ولماذا؟\nالإجابة: الخط الحلزوني؛ لأنه يوحي بالغموض والدوران.\n\nس3 (مستوى الاستدلال): كيف تساعد الخطوط في تعميق المعنى الذي تحمله الصورة الفوتوغرافية؟\nالإجابة: تضيف بعدًا تعبيريًا بصريًا يبرز الشعور ويوجه عين المشاهد إليه.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nس1 (مستوى المعرفة): ما الخامة المستخدمة لإبراز الخطوط في هذا النشاط؟\nالإجابة: الخيوط الملونة (أو الريليف).\n\nس2 (مستوى التطبيق): كيف يعبر لون الخيط عن الشعور؟\nالإجابة: الألوان الحارة تقوي الانفعال والألوان الهادئة توحي بالسكون، فيدعم اللون دلالة الخط.\n\nس3 (مستوى الاستدلال): اقترح طريقة مبتكرة لعرض أعمال الصف تبرز التعبيرات الخطية.\nالإجابة: مثال: معرض «وجوه وخطوط» مع إضاءة جانبية تبرز بروز الخيوط.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nس1 (مستوى المعرفة): ما المقصود بالكولاج؟\nالإجابة: أسلوب فني يقوم على قص الصور والخامات وتركيبها ولصقها في تكوين واحد.\n\nس2 (مستوى التطبيق): لماذا نحدد الفكرة التوعوية قبل اختيار الصور؟\nالإجابة: لتخدم كل الصور الفكرة الأساسية وتصل الرسالة بوضوح.\n\nس3 (مستوى الاستدلال): كيف يمكن للذكاء الاصطناعي أن يدعم تصميمك التوعوي؟\nالإجابة: بتوليد صور وأفكار بصرية تناسب الموضوع يعدّلها الطالب بإبداعه.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nس1 (مستوى المعرفة): أي الخطوط استخدمت للتعبير عن التوتر في تصميمك؟\nالإجابة: الخطوط المنكسرة.\n\nس2 (مستوى التطبيق): ما مواصفات العبارة التوعوية الجيدة؟\nالإجابة: قصيرة، واضحة، مؤثرة، مناسبة لموضوع التصميم.\n\nس3 (مستوى الاستدلال): كيف يسهم تصميمك في نشر الوعي في المدرسة؟\nالإجابة: بعرضه في المرافق أو نشره رقميًا لإيصال الرسالة إلى عدد أكبر من الطلبة.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nس1 (مستوى المعرفة): ماذا كتبت حول صورتك من مشاعر؟\nالإجابة: إجابة شخصية بمشاعر مناسبة للصورة المختارة.\n\nس2 (مستوى التطبيق): اربط شعورًا كتبته بنوع الخط الذي رسمته.\nالإجابة: مثال: الغضب ← خطوط منكسرة؛ لأنها توحي بالتوتر.\n\nس3 (مستوى الاستدلال): اقترح خامة تبرز الخطوط التي رسمتها على الصورة.\nالإجابة: الخيوط الملونة أو الأسلاك الملونة أو الريليف.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nس1 (مستوى المعرفة): أكمل: يضيف الخيط إلى الصورة قيمة ……… و………\nالإجابة: جمالية وتعبيرية.\n\nس2 (مستوى التطبيق): وضّح الشعور الذي جسدته خيوطك في الصورة.\nالإجابة: إجابة شخصية تربط لون الخيط ونوع الخط بالشعور.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث مناسبة الخيوط للشعور المعبر عنه.\nالإجابة: نقد يذكر مدى التطابق بين الشعور ونوع الخط ولونه مع اقتراح تحسين.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nس1 (مستوى المعرفة): اذكر فكرة توعوية مناسبة للتصميم.\nالإجابة: أضرار الألعاب الإلكترونية أو التدخين الإلكتروني.\n\nس2 (مستوى التطبيق): كيف رتبت صورك لتخدم الفكرة الأساسية؟\nالإجابة: إجابة تذكر وضع الصورة الرئيسة في مركز الاهتمام وتوزيع الصور الثانوية حولها.\n\nس3 (مستوى الاستدلال): قيّم: هل تكفي الصور وحدها لإيصال الرسالة؟ وماذا تضيف الخطوط؟\nالإجابة: لا تكفي غالبًا؛ فالخطوط تضيف دلالات انفعالية (التوتر، القوة) تعمّق الرسالة.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nس1 (مستوى المعرفة): ماذا توحي الخطوط العمودية في التصميم التوعوي؟\nالإجابة: القوة.\n\nس2 (مستوى التطبيق): وضّح العلاقة بين الصورة والخط والعبارة في تصميمك.\nالإجابة: الصورة تعرض الموضوع، والخط يضيف الشعور، والعبارة توضح الرسالة.\n\nس3 (مستوى الاستدلال): قيّم تصميمك وتصميم زميل وفق معيار «وضوح الرسالة».\nالإجابة: تقييم يوازن بين التصميمين ويذكر سببًا واقتراح تحسين.", "الحصة 1: هوية وخط: كتابة المشاعر في صورة شخصية وإضافة الخطوط الدالة عليها\nإرشاد للطالب: يتأمل صور شخصيات عمانية ويلاحظ ملامحها التعبيرية.\nإرشاد لولي الأمر: يساعد ابنه في توفير خيوط ملونة آمنة للحصة القادمة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 28–30.\n\nالحصة 2: هوية وخط: إبراز الخطوط التعبيرية على الصورة باستخدام الخيوط\nإرشاد للطالب: يحضر صورًا تناسب موضوعًا توعويًا (مثل أضرار الألعاب الإلكترونية).\nإرشاد لولي الأمر: يناقش مع ابنه موضوعًا توعويًا يهم الأسرة والمجتمع.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 31–34.\n\nالحصة 3: خط يصنع وعيًا: تحديد الفكرة التوعوية وتركيب الصور بطريقة الكولاج\nإرشاد للطالب: يلاحظ الإعلانات التوعوية في محيطه ويتأمل عناصرها.\nإرشاد لولي الأمر: يناقش مع ابنه مخاطر الموضوع التوعوي الذي اختاره.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 35–36.\n\nالحصة 4: خط يصنع وعيًا: إضافة الخطوط التعبيرية والعبارة التوعوية وإخراج التصميم وتقويم الوحدة\nإرشاد للطالب: يشارك أسرته رسالة تصميمه التوعوي.\nإرشاد لولي الأمر: يتحاور مع ابنه حول الرسالة التوعوية ويدعم السلوك الصحيح المرتبط بها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 36–40.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=2"]}, {"title": "الدرس الأول: حكاية علم", "unit": "الوحدة الثانية: بين اللون والمعنى", "periods": [{"ax": "اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم", "n": 1, "w": "الأسبوع العاشر: من 8/11/2026 إلى 12/11/2026", "pg": "44–47", "f": ["1. يتعرف دلالات ألوان العلم العماني من خلال أعمال الفنانين.\n2. يختار منتجًا نفعيًا مناسبًا لنقل تصميمه إليه ويحدد مساحة التصميم.\nمخرج آخر: يعتز بالعلم العماني رمزًا للهوية والانتماء.", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: أكواب ورقية، أكياس ورقية، حقيبة قماش", "1. الدلالات اللونية\n2. العلم العماني\n3. المنتج النفعي", "التعلم القبلي: ألوان العلم العماني ومناسبة اليوم الوطني.\n\nالتهيئة:\n- المعلم: يعرض العلم العماني ويسأل: لو كان لكل لون من ألوانه حكاية، فماذا ستروي؟\n- الطالب: يقترح معاني للألوان ويربطها بتاريخ عمان.", "1. التهيئة: يعرض المعلم العلم العماني ويسأل: لو كان لكل لون من ألوانه حكاية، فماذا ستروي؟ ويقترح الطالب معاني للألوان ويربطها بتاريخ عمان (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. دلالات ألوان العلم: يعرض المعلم أعمال الفنانة مريم الحاتمية (الشكل 1 ص 47) ويوضح: الأبيض يدل على السلام، والأحمر على المعارك التي خاضها العمانيون لطرد الغزاة، والأخضر على خصوبة الأرض، ويستنتج الطالب الدلالات من الأعمال ويدونها في خريطة ذهنية (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. اختيار المنتج: يعرض المعلم نماذج منتجات (أكواب، حقائب، أكياس ورقية، قماش) ويناقش ملاءمة كل منها، ويختار الطالب نوع المنتج الذي سينقل إليه تصميمه (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. تحديد مساحة التصميم: يوضح المعلم كيف تتحدد مساحة التصميم بحسب شكل المنتج وحجمه، ويرسم الطالب حدود مساحة التصميم على ورقة وفق قياس منتجه (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: يراجع المعلم اختيارات الطلبة ويمهد لرسم التصميم، ويذكر الطالب منتجه ودلالة لون سيبرزها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "س1 (مستوى المعرفة): علامَ يدل اللون الأبيض في العلم العماني؟\nالإجابة: السلام.\n\nس2 (مستوى التطبيق): ما دلالة اللون الأحمر في العلم العماني؟\nالإجابة: المعارك التي خاضها العمانيون لطرد الغزاة.\n\nس3 (مستوى الاستدلال): لماذا يختلف شكل مساحة التصميم من منتج إلى آخر؟\nالإجابة: لاختلاف شكل المنتج وحجمه وسطحه، فالكوب أسطواني والحقيبة مستطيلة مثلًا.", "س1 (مستوى المعرفة): أكمل: اللون الأخضر في العلم العماني يدل على ………\nالإجابة: خصوبة الأرض.\n\nس2 (مستوى التطبيق): اذكر المنتج الذي اخترته ومساحة التصميم المناسبة له.\nالإجابة: إجابة شخصية صحيحة تربط المنتج بمساحة مناسبة.\n\nس3 (مستوى الاستدلال): كيف يحول التصميم الوطني منتجًا عاديًا إلى منتج ذي قيمة؟\nالإجابة: يضيف إليه قيمة جمالية ورمزية تعبر عن الهوية فيزيد جاذبيته وقيمته.", "إرشاد للطالب: يتأمل حضور ألوان العلم في مظاهر الاحتفال باليوم الوطني.\nإرشاد لولي الأمر: يحدث ابنه عن معاني العلم والمناسبات الوطنية.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 44–47.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=3"]}, {"ax": "اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم", "n": 2, "w": "الأسبوع الحادي عشر: من 15/11/2026 إلى 19/11/2026", "pg": "48", "f": ["1. يرسم تصميمًا يعبر عن اليوم الوطني ويوزع عناصره محققًا مفهوم الإجادة.\n2. يلوّن التصميم موظفًا ألوان العلم العماني لإبراز دلالاتها.\nمخرج آخر: يتقن عمله ويهتم بجودة التفاصيل.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. الأقلام\n3. أخرى: أقلام تلوين، أوراق رسم", "1. التصميم\n2. توزيع العناصر\n3. الإجادة", "التعلم القبلي: دلالات ألوان العلم العماني ومساحة التصميم المحددة.\n\nالتهيئة:\n- المعلم: يعرض تصميمين: أحدهما متزاحم العناصر والآخر متوازن، ويسأل: أيهما أجمل؟ ولماذا؟\n- الطالب: يختار المتوازن ويعلل بحسن توزيع العناصر.", "1. التهيئة: يعرض المعلم تصميمين: أحدهما متزاحم العناصر والآخر متوازن، ويسأل: أيهما أجمل؟ ولماذا؟ ويختار الطالب المتوازن ويعلل بحسن توزيع العناصر (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. رموز التصميم: يعرض المعلم رموزًا وطنية مقترحة (الخنجر، القلعة، العلم، الشعار) ويذكّر بمفهوم الإجادة، ويختار الطالب رموز تصميمه (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. رسم التصميم: يتابع المعلم رسم العناصر وتوزيعها داخل المساحة المحددة، ويرسم الطالب تصميمه ويوزع عناصره بتوازن (15 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. التلوين بألوان العلم: يوجه المعلم إلى توظيف الأبيض والأحمر والأخضر بدلالاتها، ويلوّن الطالب التصميم موظفًا ألوان العلم (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يذكّر المعلم بنقل التصميم إلى المنتج في الحصة القادمة، ويحفظ الطالب تصميمه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "س1 (مستوى المعرفة): ما المقصود بمفهوم الإجادة في التصميم؟\nالإجابة: إتقان العمل والعناية بتفاصيله وجودته.\n\nس2 (مستوى التطبيق): كيف توزع العناصر لتحقيق التوازن؟\nالإجابة: بتوزيعها حول مركز اهتمام دون تزاحم مع مراعاة المساحات.\n\nس3 (مستوى الاستدلال): اقترح رمزًا عمانيًا يدعم دلالة لون الأخضر في تصميمك.\nالإجابة: النخلة أو الجبل الأخضر.", "س1 (مستوى المعرفة): اذكر ألوان العلم العماني.\nالإجابة: الأبيض والأحمر والأخضر.\n\nس2 (مستوى التطبيق): بيّن كيف وظفت لونًا من ألوان العلم بدلالته في تصميمك.\nالإجابة: إجابة شخصية تربط اللون بدلالته وموضعه في التصميم.\n\nس3 (مستوى الاستدلال): قيّم تصميمك من حيث التوازن وإبراز الدلالات.\nالإجابة: تقييم يحدد نقاط القوة وتعديلًا مقترحًا.", "إرشاد للطالب: يتأمل الرموز الوطنية في بيئته (القلاع، الخنجر).\nإرشاد لولي الأمر: يشجع ابنه على إتقان تصميمه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 48.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=3"]}, {"ax": "اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه", "n": 3, "w": "الأسبوع الثاني عشر: من 22/11/2026 إلى 26/11/2026", "pg": "49–53", "f": ["1. ينقل التصميم بدلالاته اللونية الوطنية إلى المنتج قيمةً مضافة.\n2. يقترح طريقة لتسويق منتجه الفني (المعارض، المواقع الإلكترونية).\nمخرج آخر: يدرك مفهوم الصناعات الإبداعية من خلال المنتج الفني.", "المخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: فهم", "1. التعلم المبني على المشاريع\n2. التعلم التشاركي\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: المنتجات (أكواب، حقائب، أكياس)، ألوان مناسبة للخامة", "1. القيمة المضافة\n2. التسويق\n3. الصناعات الإبداعية", "التعلم القبلي: التصميم الملوّن بألوان العلم العماني.\n\nالتهيئة:\n- المعلم: يعرض منتجًا تجاريًا عليه تصميم وطني ويسأل: لماذا يُقبل الناس على شرائه في المناسبات الوطنية؟\n- الطالب: يذكر أن التصميم يضيف قيمة رمزية وجمالية.", "1. التهيئة: يعرض المعلم منتجًا تجاريًا عليه تصميم وطني ويسأل: لماذا يُقبل الناس على شرائه في المناسبات الوطنية؟ ويذكر الطالب أن التصميم يضيف قيمة رمزية وجمالية (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. نقل التصميم إلى المنتج: يوضح المعلم طرق النقل (الشف، الرسم المباشر، اللصق) ويتابع التنفيذ، وينقل الطالب تصميمه إلى المنتج ويلونه بعناية (18 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النشاط التسويقي: يقدم المعلم مفهوم الصناعات الإبداعية ويطلب إعداد بطاقة تسويق (اسم المنتج، الفئة المستهدفة، مكان العرض)، ويقترح الطالب طريقة لتسويق منتجه ويكتب بطاقة تسويقه (10 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يناقش المعلم طرق توظيف دلالات الألوان في التسويق ويوجه لإحضار صورة لمشهد من عمان، ويتحدث الطالب عن كيفية توظيف دلالات ألوان العلم في منتجه (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "س1 (مستوى المعرفة): ما المقصود بالقيمة المضافة للمنتج؟\nالإجابة: زيادة قيمة المنتج بإضافة تصميم جمالي ورمزي إليه.\n\nس2 (مستوى التطبيق): اذكر طريقتين لتسويق المنتج الفني.\nالإجابة: المعارض والمواقع الإلكترونية.\n\nس3 (مستوى الاستدلال): كيف يرتبط منتجك بمفهوم الصناعات الإبداعية؟\nالإجابة: لأنه منتج قائم على فكرة وتصميم إبداعي يمكن تسويقه وتحقيق عائد منه.", "س1 (مستوى المعرفة): أكمل: يُضاف التصميم إلى المنتج بوصفه ……… مضافة.\nالإجابة: قيمة.\n\nس2 (مستوى التطبيق): تحدث عن كيفية توظيف دلالات ألوان العلم في تصميم منتجك.\nالإجابة: إجابة تربط كل لون بدلالته وموضعه على المنتج.\n\nس3 (مستوى الاستدلال): صمم خطة تسويق مختصرة لمنتجك تتضمن الفئة المستهدفة ومكان البيع.\nالإجابة: مثال: أكواب لأسر الطلبة تُعرض في معرض المدرسة باليوم الوطني وعلى حساب المدرسة.", "إرشاد للطالب: يحضر صورة لمشهد من عمان للنشاط القادم.\nإرشاد لولي الأمر: يشارك ابنه التفكير في طرق عرض منتجه وتسويقه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 49–53.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=3"]}, {"ax": "ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان", "n": 4, "w": "الأسبوع الثالث عشر: من 29/11/2026 إلى 3/12/2026", "pg": "53–54", "f": ["1. يتأمل مشاهد عمانية ويحدد عناصرها الجمالية.\n2. يرسم مشهدًا من عمان بتكوين واضح.\nمخرج آخر: يعتز بجمال الطبيعة والمعالم العمانية.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم الذاتي\n3. التعلم بالملاحظة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: أوراق رسم، أقلام رصاص", "1. المشهد\n2. التكوين\n3. عناصر البيئة العمانية", "التعلم القبلي: دلالات  بتاريخ عمان.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nالتعلم القبلي: دلالات ألوان العلم العماني ومساحة التصميم المحددة.\n\nالتهيئة:\n- المعلم: يعرض تصميمين: أحدهما متزاحم العناصر والآخر متوازن، ويسأل: أيهما أجمل؟ ولماذا؟\n- الطالب: يختار المتوازن ويعلل بحسن توزيع العناصر.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nالتعلم القبلي: التصميم الملوّن بألوان العلم العماني.\n\nالتهيئة:\n- المعلم: يعرض منتجًا تجاريًا عليه تصميم وطني ويسأل: لماذا يُقبل الناس على شرائه في المناسبات الوطنية؟\n- الطالب: يذكر أن التصميم يضيف قيمة رمزية وجمالية.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nالتعلم القبلي: دلالات ألوان العلم العماني.\n\nالتهيئة:\n- المعلم: يعرض صورًا لمشاهد عمانية (قلعة، جبل، بحر، سوق) ويسأل: أي مشهد يمثلك أكثر؟\n- الطالب: يختار مشهدًا ويذكر سبب اختياره.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nالتعلم القبلي: المشهد العماني المرسوم في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض صورة لأوراق نخلة في ظل وضوء ويسأل: هل الأخضر فيها درجة واحدة؟\n- الطالب: يلاحظ تعدد درجات اللون الواحد.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nالتعلم القبلي: الشريط اللوني والدرجات المحددة لكل عنصر.\n\nالتهيئة:\n- المعلم: يعرض إحدى طرق تلوين المشهد (ص 55) ويسأل: كيف ظهر العلم في المشهد دون أن نرسمه؟\n- الطالب: يلاحظ أن ألوان العلم توزعت على عناصر المشهد.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم العلم العماني ويسأل: لو كان لكل لون من ألوانه حكاية، فماذا ستروي؟ ويقترح الطالب معاني للألوان ويربطها بتاريخ عمان (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. دلالات ألوان العلم: يعرض المعلم أعمال الفنانة مريم الحاتمية (الشكل 1 ص 47) ويوضح: الأبيض يدل على السلام، والأحمر على المعارك التي خاضها العمانيون لطرد الغزاة، والأخضر على خصوبة الأرض، ويستنتج الطالب الدلالات من الأعمال ويدونها في خريطة ذهنية (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. اختيار المنتج: يعرض المعلم نماذج منتجات (أكواب، حقائب، أكياس ورقية، قماش) ويناقش ملاءمة كل منها، ويختار الطالب نوع المنتج الذي سينقل إليه تصميمه (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. تحديد مساحة التصميم: يوضح المعلم كيف تتحدد مساحة التصميم بحسب شكل المنتج وحجمه، ويرسم الطالب حدود مساحة التصميم على ورقة وفق قياس منتجه (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يراجع المعلم اختيارات الطلبة ويمهد لرسم التصميم، ويذكر الطالب منتجه ودلالة لون سيبرزها (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم تصميمين: أحدهما متزاحم العناصر والآخر متوازن، ويسأل: أيهما أجمل؟ ولماذا؟ ويختار الطالب المتوازن ويعلل بحسن توزيع العناصر (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. رموز التصميم: يعرض المعلم رموزًا وطنية مقترحة (الخنجر، القلعة، العلم، الشعار) ويذكّر بمفهوم الإجادة، ويختار الطالب رموز تصميمه (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. رسم التصميم: يتابع المعلم رسم العناصر وتوزيعها داخل المساحة المحددة، ويرسم الطالب تصميمه ويوزع عناصره بتوازن (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. التلوين بألوان العلم: يوجه المعلم إلى توظيف الأبيض والأحمر والأخضر بدلالاتها، ويلوّن الطالب التصميم موظفًا ألوان العلم (12 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n5. الختام: يذكّر المعلم بنقل التصميم إلى المنتج في الحصة القادمة، ويحفظ الطالب تصميمه (3 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم منتجًا تجاريًا عليه تصميم وطني ويسأل: لماذا يُقبل الناس على شرائه في المناسبات الوطنية؟ ويذكر الطالب أن التصميم يضيف قيمة رمزية وجمالية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نقل التصميم إلى المنتج: يوضح المعلم طرق النقل (الشف، الرسم المباشر، اللصق) ويتابع التنفيذ، وينقل الطالب تصميمه إلى المنتج ويلونه بعناية (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النشاط التسويقي: يقدم المعلم مفهوم الصناعات الإبداعية ويطلب إعداد بطاقة تسويق (اسم المنتج، الفئة المستهدفة، مكان العرض)، ويقترح الطالب طريقة لتسويق منتجه ويكتب بطاقة تسويقه (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الختام: يناقش المعلم طرق توظيف دلالات الألوان في التسويق ويوجه لإحضار صورة لمشهد من عمان، ويتحدث الطالب عن كيفية توظيف دلالات ألوان العلم في منتجه (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورًا لمشاهد عمانية (قلعة، جبل، بحر، سوق) ويسأل: أي مشهد يمثلك أكثر؟ ويختار الطالب مشهدًا ويذكر سبب اختياره (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض المشاهد العمانية: يعرض المعلم صور مشاهد عمانية ويحلل عناصرها (مقدمة، وسط، خلفية)، ويحدد الطالب عناصر المشهد ومستوياته (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. رسم المشهد: يتابع المعلم رسم المشهد ويوجه إلى تبسيط العناصر وتوزيعها، ويرسم الطالب مشهدًا من عمان من صورته أو من خياله (20 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يعرض المعلم نماذج ويمهد لاستخدام الشريط اللوني في الحصة القادمة، ويعرض الطالب رسمه ويحدد العناصر التي سيلونها بدلالات العلم (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة لأوراق نخلة في ظل وضوء ويسأل: هل الأخضر فيها درجة واحدة؟ ويلاحظ الطالب تعدد درجات اللون الواحد (5 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\n2. نمذجة التدرج: ينمذج المعلم على السبورة تدرج الأخضر من الفاتح إلى الداكن بإضافة الأبيض أو تعميق الضغط، ويراقب الطالب ويحدد خطوات التدرج (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. تنفيذ الشريط اللوني: يوزع المعلم ورقة النشاط ويتابع تنفيذ تدرج الأحمر والأخضر والرمادي الفاتح للأبيض، وينفذ الطالب الشريط اللوني لكل لون من ألوان العلم (17 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطلب المعلم تحديد الدرجات التي سيستخدمها لكل عنصر في مشهده، ويعلّم الطالب على مشهده الدرجات المناسبة لكل عنصر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم إحدى طرق تلوين المشهد (ص 55) ويسأل: كيف ظهر العلم في المشهد دون أن نرسمه؟ ويلاحظ الطالب أن ألوان العلم توزعت على عناصر المشهد (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. تلوين المشهد: يتابع المعلم التلوين ويذكّر بالانتقال المتدرج وتوظيف دلالة كل لون، والطلبة يلون مشهده بالدرجات المتدرجة لألوان العلم (22 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. العرض والنقد: ينظم المعلم عرضًا ويسأل: هل أبرزت الألوان المعاني الوطنية؟ ويبدي الطالب رأيه في عمله وأعمال زملائه (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطلب المعلم تلخيص ما استفاده الطالب من الدرس في جملتين، ويلخص الطالب استفادته من درس حكاية علم (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nس1 (مستوى المعرفة): علامَ يدل اللون الأبيض في العلم العماني؟\nالإجابة: السلام.\n\nس2 (مستوى التطبيق): ما دلالة اللون الأحمر في العلم العماني؟\nالإجابة: المعارك التي خاضها العمانيون لطرد الغزاة.\n\nس3 (مستوى الاستدلال): لماذا يختلف شكل مساحة التصميم من منتج إلى آخر؟\nالإجابة: لاختلاف شكل المنتج وحجمه وسطحه، فالكوب أسطواني والحقيبة مستطيلة مثلًا.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nس1 (مستوى المعرفة): ما المقصود بمفهوم الإجادة في التصميم؟\nالإجابة: إتقان العمل والعناية بتفاصيله وجودته.\n\nس2 (مستوى التطبيق): كيف توزع العناصر لتحقيق التوازن؟\nالإجابة: بتوزيعها حول مركز اهتمام دون تزاحم مع مراعاة المساحات.\n\nس3 (مستوى الاستدلال): اقترح رمزًا عمانيًا يدعم دلالة لون الأخضر في تصميمك.\nالإجابة: النخلة أو الجبل الأخضر.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nس1 (مستوى المعرفة): ما المقصود بالقيمة المضافة للمنتج؟\nالإجابة: زيادة قيمة المنتج بإضافة تصميم جمالي ورمزي إليه.\n\nس2 (مستوى التطبيق): اذكر طريقتين لتسويق المنتج الفني.\nالإجابة: المعارض والمواقع الإلكترونية.\n\nس3 (مستوى الاستدلال): كيف يرتبط منتجك بمفهوم الصناعات الإبداعية؟\nالإجابة: لأنه منتج قائم على فكرة وتصميم إبداعي يمكن تسويقه وتحقيق عائد منه.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nس1 (مستوى المعرفة): سمِّ ثلاثة عناصر من مشهد عماني.\nالإجابة: القلعة، النخيل، الجبال (أو البحر والسفن).\n\nس2 (مستوى التطبيق): ما مستويات المشهد التي تمنحه عمقًا؟\nالإجابة: المقدمة والوسط والخلفية.\n\nس3 (مستوى الاستدلال): كيف تربط عناصر مشهدك بدلالات ألوان العلم؟\nالإجابة: مثال: النخيل والمزارع بالأخضر، والقلعة رمز الدفاع بالأحمر، والسماء الصافية بالأبيض.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nس1 (مستوى المعرفة): ما المقصود بالتدرج اللوني؟\nالإجابة: انتقال اللون تدريجيًا من درجة فاتحة إلى درجة داكنة أو العكس.\n\nس2 (مستوى التطبيق): كيف نحصل على درجة أفتح من اللون الأحمر؟\nالإجابة: بإضافة الأبيض أو تخفيف الضغط على القلم.\n\nس3 (مستوى الاستدلال): لماذا يمنح التدرج المشهد إحساسًا بالعمق؟\nالإجابة: لأنه يحاكي الضوء والظل والبعد فيبدو المشهد مجسمًا وواقعيًا.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nس1 (مستوى المعرفة): أين وظفت اللون الأخضر في مشهدك؟ ولماذا؟\nالإجابة: إجابة تربطه بعناصر الخصوبة مثل النخيل والمزارع.\n\nس2 (مستوى التطبيق): كيف أبرز التدرج عناصر المشهد؟\nالإجابة: أعطاها عمقًا ووضوحًا بالفصل بين القريب والبعيد والضوء والظل.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا لعملك يعكس معناه الوطني وعلّل.\nالإجابة: إجابة إبداعية مع تعليل يربط العنوان بالدلالات اللونية.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nس1 (مستوى المعرفة): أكمل: اللون الأخضر في العلم العماني يدل على ………\nالإجابة: خصوبة الأرض.\n\nس2 (مستوى التطبيق): اذكر المنتج الذي اخترته ومساحة التصميم المناسبة له.\nالإجابة: إجابة شخصية صحيحة تربط المنتج بمساحة مناسبة.\n\nس3 (مستوى الاستدلال): كيف يحول التصميم الوطني منتجًا عاديًا إلى منتج ذي قيمة؟\nالإجابة: يضيف إليه قيمة جمالية ورمزية تعبر عن الهوية فيزيد جاذبيته وقيمته.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nس1 (مستوى المعرفة): اذكر ألوان العلم العماني.\nالإجابة: الأبيض والأحمر والأخضر.\n\nس2 (مستوى التطبيق): بيّن كيف وظفت لونًا من ألوان العلم بدلالته في تصميمك.\nالإجابة: إجابة شخصية تربط اللون بدلالته وموضعه في التصميم.\n\nس3 (مستوى الاستدلال): قيّم تصميمك من حيث التوازن وإبراز الدلالات.\nالإجابة: تقييم يحدد نقاط القوة وتعديلًا مقترحًا.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nس1 (مستوى المعرفة): أكمل: يُضاف التصميم إلى المنتج بوصفه ……… مضافة.\nالإجابة: قيمة.\n\nس2 (مستوى التطبيق): تحدث عن كيفية توظيف دلالات ألوان العلم في تصميم منتجك.\nالإجابة: إجابة تربط كل لون بدلالته وموضعه على المنتج.\n\nس3 (مستوى الاستدلال): صمم خطة تسويق مختصرة لمنتجك تتضمن الفئة المستهدفة ومكان البيع.\nالإجابة: مثال: أكواب لأسر الطلبة تُعرض في معرض المدرسة باليوم الوطني وعلى حساب المدرسة.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nس1 (مستوى المعرفة): ما المشهد الذي رسمته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): كيف وزعت عناصر المشهد في مساحة الرسم؟\nالإجابة: إجابة تذكر توزيع العناصر على المقدمة والوسط والخلفية.\n\nس3 (مستوى الاستدلال): اقترح عنصرًا يضيف إلى مشهدك هوية عمانية أوضح.\nالإجابة: مثال: الخنجر أو البرج أو السفينة التقليدية.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nس1 (مستوى المعرفة): كم درجة نفذت في كل شريط لوني؟\nالإجابة: إجابة بحسب ورقة النشاط (عادة من 3 إلى 5 درجات).\n\nس2 (مستوى التطبيق): حدد عنصرًا في مشهدك وبيّن الدرجة اللونية المناسبة له.\nالإجابة: مثال: الجبل البعيد بدرجة فاتحة والقريب بدرجة داكنة.\n\nس3 (مستوى الاستدلال): قيّم انتظام التدرج في شريطك واقترح طريقة لتحسينه.\nالإجابة: تقييم يذكر انسياب الانتقال بين الدرجات واقتراح زيادة المراحل.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nس1 (مستوى المعرفة): اذكر دلالة لون واحد من ألوان العلم وظفته في عملك.\nالإجابة: مثال: الأحمر يدل على المعارك لطرد الغزاة وظفته في القلعة.\n\nس2 (مستوى التطبيق): لخص في جملتين ما استفدته من درس حكاية علم.\nالإجابة: ألوان العلم تحمل دلالات وطنية، ويمكن توظيفها بالتدرج في تصميمات ومشاهد تعبر عن الهوية.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث توظيف الدلالات اللونية للعلم.\nالإجابة: نقد يحدد مواضع التوظيف الناجح واقتراحًا للتحسين.", "الحصة 1: اليوم الوطني: دلالات ألوان العلم العماني واختيار المنتج وتحديد مساحة التصميم\nإرشاد للطالب: يتأمل حضور ألوان العلم في مظاهر الاحتفال باليوم الوطني.\nإرشاد لولي الأمر: يحدث ابنه عن معاني العلم والمناسبات الوطنية.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 44–47.\n\nالحصة 2: اليوم الوطني: رسم تصميم يعبّر عن اليوم الوطني وتلوينه بألوان العلم\nإرشاد للطالب: يتأمل الرموز الوطنية في بيئته (القلاع، الخنجر).\nإرشاد لولي الأمر: يشجع ابنه على إتقان تصميمه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 48.\n\nالحصة 3: اليوم الوطني: نقل التصميم إلى المنتج النفعي واقتراح طريقة لتسويقه\nإرشاد للطالب: يحضر صورة لمشهد من عمان للنشاط القادم.\nإرشاد لولي الأمر: يشارك ابنه التفكير في طرق عرض منتجه وتسويقه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 49–53.\n\nالحصة 4: ألوان عُمان: تأمل مشاهد عمانية ورسم مشهد من عمان\nإرشاد للطالب: يتأمل مشهدًا عمانيًا من بيئته المحلية.\nإرشاد لولي الأمر: يصطحب ابنه في نزهة لمعلم عماني إن تيسر.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 53–54.\n\nالحصة 5: ألوان عُمان: الشريط اللوني وتحديد الدرجات اللونية لألوان العلم\nإرشاد للطالب: يلاحظ تدرج ألوان السماء عند الغروب.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة الألوان المتدرجة في الطبيعة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 55.\n\nالحصة 6: ألوان عُمان: تلوين المشهد بالألوان المتدرجة وتقويم الدرس\nإرشاد للطالب: يحتفظ بعمله في ملف إنجازه ويعرضه على أسرته.\nإرشاد لولي الأمر: يتحاور مع ابنه حول معاني العلم والانتماء للوطن.\nالمرجع: دليل المعلم (الفنون البصرية – الصف السابع) ص 55–58.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arts/?l=3"]}]);
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
