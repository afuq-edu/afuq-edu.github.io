<script>
const D={"F": ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"], "L": [{"id": "qarun", "t": "الدرس الأول: النص القرآني (قصة قارون)", "u": "الوحدة الأولى - مهاراتي في القراءة", "ps": [{"n": 1, "ax": "الفهم العام للنص القرآني", "h": [["الدرس", "الدرس الأول: النص القرآني (قصة قارون)"], ["الوحدة", "الوحدة الأولى - مهاراتي في القراءة"], ["الأسبوع والتاريخ", "الأسبوع الأول: 6–10/9/2026م"], ["صفحات كتاب الطالب", "18–19"], ["صفحات دليل المعلم", "26–31"], ["رقم الحصة", "1 من 3"], ["محور الحصة", "الفهم العام للنص القرآني"]], "f": ["1. يقرأ الآيات (76–83) من سورة القصص قراءة جهرية صحيحة معبرة\n2. يحدد الفكرة العامة لقصة قارون وأحداثها الرئيسة\n\nمخرج تعليمي آخر:\n3. يقدر نعم الله ويشكرها", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. القراءة الصامتة الموجهة", "1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)", "- قارون: رجل من قوم موسى عليه السلام آتاه الله كنوزًا عظيمة فبغى\n- البغي: التكبر والظلم\n- الفكرة العامة: عاقبة الغرور بالمال", "- المعلم: يعرض على السبورة الذكية صورة مفاتيح كثيرة ثقيلة ويسأل: لو كانت مفاتيح خزائنك يعجز عن حملها رجال أقوياء، فكم تكون ثروتك؟\n- الطالب: يتوقع ويربط بعنوان الدرس", "التهيئة (5 دقائق):\n- المعلم: يعرض على السبورة الذكية صورة مفاتيح كثيرة ثقيلة ويسأل: لو كانت مفاتيح خزائنك يعجز عن حملها رجال أقوياء، فكم تكون ثروتك؟\n- الطالب: يتوقع ويربط بعنوان الدرس\n\nالقراءة الصامتة (7 دقائق):\n- المعلم: يوجه لقراءة الآيات صامتًا في دقيقتين مع سؤال: من قارون؟ وماذا حدث له؟\n- الطالب: يقرأ صامتًا ويجيب عن السؤالين\n\nالقراءة النموذجية والجهرية (10 دقائق):\n- المعلم: يُسمع تلاوة الآيات ثم يقرأ قراءة معبرة ويطلب قراءات فردية مع مراعاة الوقف\n- الطالب: يستمع ويقرأ قراءة جهرية معبرة\n\nالفهم العام (13 دقيقة):\n- المعلم: يطرح أسئلة الكتاب ص 19: في أي زمن حدثت القصة؟ بم أنعم الله على قارون؟ ما موقفه من النعم؟ كيف كانت نهايته؟ ويوزعها على المجموعات\n- الطالب: يجيب مع مجموعته ويعرض الإجابات\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويكلف بالواجب\n- الطالب: يجيب ويدون الواجب", "س1 (مستوى الدعم): من قارون؟\nالإجابة: رجل من قوم موسى عليه السلام آتاه الله كنوزًا عظيمة.\n\nس2 (المستوى المتوقع): ما الفكرة العامة للآيات؟\nالإجابة: عاقبة الغرور والتكبر بالمال.\n\nس3 (المستوى المتقدم): ما موقف قارون من نعم الله عليه؟\nالإجابة: تكبر بها ونسبها إلى علمه وقال: «إنما أوتيته على علم عندي».", "س1 (مستوى الدعم): في زمن أي نبي عاش قارون؟\nالإجابة: في زمن موسى عليه السلام.\n\nس2 (المستوى المتوقع): كيف كانت نهاية قارون؟\nالإجابة: خسف الله به وبداره الأرض.\n\nس3 (المستوى المتقدم): اقترح عنوانًا آخر للنص يعبر عن فكرته العامة.\nالإجابة: مثل: «عاقبة الغرور بالمال».", "- للطالب: يقرأ الآيات (76–83) قراءة جهرية ويبدأ حفظ الآيات (76–80)\n- لولي الأمر: يستمع لقراءة ابنه ويناقشه في عاقبة الغرور"]}, {"n": 2, "ax": "المعجم والدلالة والمناقشة والتحليل", "h": [["الدرس", "الدرس الأول: النص القرآني (قصة قارون)"], ["الوحدة", "الوحدة الأولى - مهاراتي في القراءة"], ["الأسبوع والتاريخ", "الأسبوع الأول: 6–10/9/2026م"], ["صفحات كتاب الطالب", "20–22"], ["صفحات دليل المعلم", "26–31"], ["رقم الحصة", "2 من 3"], ["محور الحصة", "المعجم والدلالة والمناقشة والتحليل"]], "f": ["1. يوضح معاني المفردات والتراكيب في سياقها القرآني\n2. يحلل مواقف الشخصيات في القصة: قارون، وقومه الناصحين، والذين يريدون الحياة الدنيا، والذين أوتوا العلم\n\nمخرج تعليمي آخر:\n3. يتجنب الغرور والبطر", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم التعاوني\n2. التعلم بالاكتشاف\n3. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات المفردات", "- تنوء بالعصبة: تثقل على الجماعة القوية\n- الفرحين: البطرين المتكبرين\n- القرون: الأمم\n- ويكأن: كلمة تعجب وتنبه", "- المعلم: يوزع بطاقات مفردات على الطلبة ويطلب من كل طالب البحث عن زميله الذي يحمل معنى كلمته\n- الطالب: يتحرك ويطابق الكلمة بمعناها", "التهيئة (5 دقائق):\n- المعلم: يوزع بطاقات مفردات على الطلبة ويطلب من كل طالب البحث عن زميله let mode='sep',li=0,pi=0;
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fill(){const s=$('ls');D.L.forEach((l,i)=>{const o=el('option',null,(i+1)+'. '+l.t);o.value=i;s.appendChild(o)});s.onchange=()=>{li=+s.value;pi=0;render()}}
function render(){
 const l=D.L[li];
 $('mSep').classList.toggle('on',mode==='sep');$('mCom').classList.toggle('on',mode==='com');
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
 const tb=$('tabs');tb.innerHTML='';
 if(mode==='sep'){l.ps.forEach((p,i)=>{const b=el('button',i===pi?'on':'','الحصة '+p.n+': '+p.ax);b.onclick=()=>{pi=i;render()};tb.appendChild(b)})}
 const inf=$('info');inf.innerHTML='';
 const H=mode==='sep'?l.ps[pi].h:l.h;
 H.forEach(([k,v])=>{const d=el('div');const b=el('b',null,k+': ');d.appendChild(b);d.appendChild(document.createTextNode(v));inf.appendChild(d)});
 const F=mode==='sep'?l.ps[pi].f:l.c;

  const b=el('button','cp','نسخ');b.onclick=()=>copy(F[i],b);h.appendChild(b);c.appendChild(h);c.appendChild(el('div','txt',F[i]));cs.appendChild(c)});
}
function done(b){b.textContent='تم النسخ ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1600)}
function legacy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function copy(t,b){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(b),()=>{legacy(t)?done(b):manual(t)})}
 else{legacy(t)?done(b):manual(t)}
}
function manual(t){const ta=$('ta');ta.value=t;$('modal').classList.add('show');ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
$('close').onclick=()=>$('modal').classList.remove('show');
