 الموجهة.\n\n4. الفهم العام: يطرح المعلم أسئلة الكتاب ص 19: في أي زمن حدثت القصة؟ بم أنعم الله على قارون؟ ما موقفه من النعم؟ كيف كانت نهايته؟ ويوزعها على المجموعات، ويجيب الطالب مع مجموعته ويعرض الإجابات (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويكلف بالواجب، ويجيب الطالب ويدون الواجب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "س1 (مستوى المعرفة): من قارون؟\nالإجابة: رجل من قوم موسى عليه السلام آتاه الله كنوزًا عظيمة.\n\nس2 (مستوى التطبيق): ما الفكرة العامة للآيات؟\nالإجابة: عاقبة الغرور والتكبر بالمال.\n\nس3 (مستوى الاستدلال): ما موقف قارون من نعم الله عليه؟\nالإجابة: تكبر بها ونسبها إلى علمه وقال: «إنما أوتيته على علم عندي».", "س1 (مستوى المعرفة): في زمن أي نبي عاش قارون؟\nالإجابة: في زمن موسى عليه السلام.\n\nس2 (مستوى التطبيق): كيف كانت نهاية قارون؟\nالإجابة: خسف الله به وبداره الأرض.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا آخر للنص يعبر عن فكرته العامة.\nالإجابة: مثل: «عاقبة الغرور بالمال».", "- للطالب: يقرأ الآيات (76–83) قراءة جهرية ويبدأ حفظ الآيات (76–80)\n- لولي الأمر: يستمع لقراءة ابنه ويناقشه في عاقبة الغرور\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arabic/?l=1"]}, {"n": 2, "ax": "المعجم والدلالة والمناقشة والتحليل", "h": [["الدرس", "الدرس الأول: النص القرآني (قصة قارون)"], ["الوحدة", "الوحدة الأولى - مهاراتي في القراءة"], ["الأسبوع والتاريخ", "الأسبوع الأول: 6–10/9/2026م"], ["صفحات كتاب الطالب", "20–22"], ["صفحات دليل المعلم", "26–31"], ["رقم الحصة", "2 من 3"], ["محور الحصة", "المعجم والدلالة والمناقشة والتحليل"]], "f": ["1. يوضح معاني المفردات والتراكيب في سياقها القرآني\n2. يحلل مواقف الشخصيات في القصة: قارون، وقومه الناصحين، والذين يريدون الحياة الدنيا، والذين أوتوا العلم\n\nمخرج تعليمي آخر:\n3. يتجنب الغرور والبطر", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم التعاوني\n2. التعلم بالاكتشاف\n3. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات المفردات", "- تنوء بالعصبة: تثقل على الجماعة القوية\n- الفرحين: البطرين ا n\n1. التهيئة: يوزع المعلم بطاقات مفردات على الطلبة ويطلب من كل طالب البحث عن زميله الذي يحمل معنى كلمته، ويتحرك الطالب ويطابق الكلمة بمعناها (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. المعجم والدلالة: يناقش المعلم معاني المفردات في سياقها ويطلب استخدام بعضها في جمل جديدة، ويوضح الطالب المعنى ويوظف الكلمة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. مواقف الشخصيات: يعرض المعلم على السبورة الذكية جدولًا بأربع فئات ويطلب من المجموعات استخراج قول كل فئة وموقفها من الآيات، ويكمل الطالب الجدول بالأدلة: الناصحون «لا تفرح»، المتمنون «يا ليت لنا مثل ما أوتي قارون»، أهل العلم «ثواب الله خير» (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. أحلل: يناقش المعلم نصائح قوم قارون الخمس في الآية 77 وتوازنها بين الدنيا والآخرة، ويستخرج الطالب النصائح ويبين التوازن فيها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: لو أعطيت ثروة كبيرة، ما أول ثلاثة أشياء تفعلها بها؟ ويجيب الطالب ويقارن إجابته بنصائح قوم قارون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تسميع الحفظ: يسمع المعلم الآيات (76–80) من الطلبة بطريقة السلسلة، ويتلو الطالب الآية التي يأتي دوره فيها (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. استثمار النص: يوجه المجموعات لاستنتاج ثلاث عبر من القصة وكتابة رأيهم في سلوك قارون، ويستنتج الطالب العبر ويبدي رأيه معللًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «ماذا قال الذين يريدون الحياة الدنيا عند خروج قارون في زينته»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "الحصة 1:\nس1 (مستوى المعرفة): من قارون؟\nالإجابة: رجل من قوم موسى عليه السلام آتاه الله كنوزًا عظيمة.\n\nس2 (مستوى التطبيق): ما الفكرة العامة للآيات؟\nالإجابة: عاقبة الغرور والتكبر بالمال.\n\nس3 (مستوى الاستدلال): ما موقف قارون من نعم الله عليه؟\nالإجابة: تكبر بها ونسبها إلى علمه وقال: «إنما أوتيته على علم عندي».\n\nالحصة 2:\nس1 (مستوى المعرفة): ما معنى «لتنوء بالعصبة»؟\nالإجابة: تثقل على الجماعة القوية.\n\nس2 (مستوى التطبيق): ماذا قال الذين يريدون الحياة الدنيا عند خروج قارون في زينته؟\nالإجابة: «يا ليت لنا مثل ما أوتي قارون إنه لذو حظ عظيم».\n\nس3 (مستوى الاستدلال): كيف تحقق الآية 77 التوازن بين الدنيا والآخرة؟\nالإجابة: تأمر بطلب الآخرة بالمال مع عدم نسيان النصيب المباح من الدنيا.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر عبرة من قصة قارون.\nالإجابة: أن الغرور بالمال يؤدي إلى الهلاك.\n\nس2 (مستوى التطبيق): اتلُ الآيتين (79–80) من حفظك.\nالإجابة: يتلوهما الطالب تلاوة صحيحة.\n\nس3 (مستوى الاستدلال): ما رأيك في قول قارون: «إنما أوتيته على علم عندي»؟\nالإجابة: رأي خاطئ لأنه نسب النعمة إلى نفسه ونسي فضل الله.", "الحصة 1:\nس1 (مستوى المعرفة): في زمن أي نبي عاش قارون؟\nالإجابة: في زمن موسى عليه السلام.\n\nس2 (مستوى التطبيق): كيف كانت نهاية قارون؟\nالإجابة: خسف الله به وبداره الأرض.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا آخر للنص يعبر عن فكرته العامة.\nالإجابة: مثل: «عاقبة الغرور بالمال».\n\nالحصة 2:\nس1 (مستوى المعرفة): ما معنى «الفرحين» في الآية؟\nالإجابة: البطرين المتكبرين.\n\nس2 (مستوى التطبيق): اذكر نصيحتين قدمهما قوم قارون له.\nالإجابة: لا تفرح، وأحسن كما أحسن الله إليك.\n\nس3 (مستوى الاستدلال): قارن بين موقف المتمنين قبل الخسف وبعده.\nالإجابة: قبل الخسف تمنوا مكانه، وبعده حمدوا الله أن لم يخسف بهم.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما الآية التي ختم بها النص؟ وما مضمونها؟\nالإجابة: «تلك الدار الآخرة نجعلها للذين لا يريدون علوا في الأرض ولا فسادا والعاقبة للمتقين»، ومضمونها أن الجنة لمن ترك الكبر والفساد.\n\nس2 (مستوى التطبيق): أكمل: «وقال الذين أوتوا العلم ويلكم ثواب الله خير ...».\nالإجابة: «لمن آمن وعمل صالحا ولا يلقاها إلا الصابرون».\n\nس3 (مستوى الاستدلال): اكتب نصيحة قصيرة لزميل يتفاخر بما يملك.\nالإجابة: مثل: نعم الله تدوم بالشكر لا بالتفاخر، فأحسن كما أحسن الله إليك.", "الحصة 1:\n  دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الخرائط الذهنية.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الحيوانات الأخرى التي تستخدم الصدى؟ ويذكر الطالب الدلفين ويتوقع غيره (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. استثمار النص: يوجه المعلم لحل أسئلة استثمار النص في الكتاب ص 31–32، ويحل الطالب الأسئلة ويناقشها (10 دقائق)\nالاستراتيجيات: البحث العلمي.\n\n3. أكتب فقرة: يكلف كل طالب بكتابة فقرة تفسيرية من أربع جمل عن «كيف يصطاد الخفاش في الظلام؟» مستخدمًا أدوات ربط سببية، ويكتب الطالب الفقرة ويقرؤها (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن الثاني: الخفاش يبصر بأذنيه، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة.", "الحصة 1:\nس1 (مستوى المعرفة): أين يعيش الخفاش؟\nالإجابة: في الكهوف والأماكن المظلمة.\n\nس2 (مستوى التطبيق): ما الفكرة العامة للنص؟\nالإجابة: قدرة الخفاش على تحديد الأشياء ومواقعها بالسمع.\n\nس3 (مستوى الاستدلال): لماذا جاء عنوان النص «الخفاش يبصر بأذنيه»؟\nالإجابة: لأن الخفاش يعتمد على السمع في تحديد الأشياء كما يعتمد غيره على البصر.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما معنى «ترتد»؟\nالإجابة: ترجع.\n\nس2 (مستوى التطبيق): رتب: يلتقط الخفاش الصدى، يصدر صوتًا، يحدد الموقع، يرتد الصوت.\nالإجابة: يصدر صوتًا، يرتد الصوت، يلتقط الصدى، يحدد الموقع.\n\nس3 (مستوى الاستدلال): ما وجه الشبه بين الخفاش والرادار؟\nالإجابة: كلاهما يرسل موجات ترتد عن الأجسام ليحدد مواقعها.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما خصائص لغة النص العلمي؟\nالإجابة: الدقة والموضوعية واستخدام المصطلحات العلمية.\n\nس2 (مستوى التطبيق): اكتب جملة سببية عن الخفاش.\nالإجابة: يطير الخفاش في الظلام دون اصطدام لأنه يعتمد على الصدى.\n\nس3 (مستوى الاستدلال): ما رأيك في دراسة العلماء للحيوانات لتطوير التقنيات؟ ولماذا؟\nالإجابة: مفيدة لأنها تقدم أ السفن والملاحة", "الحصة 1:\nيعرض المعلم صورة السفينة «جوهرة مسقط» ويسأل: ماذا تعرف عن تاريخ عمان البحري؟ ويذكر الطالب معلوماته عن الملاحة العمانية.\n\nالحصة 2:\nيعرض المعلم صورة سفينة شراعية بأسماء أجزائها مخفية ويسأل عن أسمائها، ويتوقع الطالب أسماء الأجزاء.\n\nالحصة 3:\nيطرح المعلم مشكلة: سفينة تواجه رياحًا شديدة وشراعها مرفوع، ماذا يفعل القبطان؟ ويقترح الطالب حلولًا.\n\nالحصة 4:\nيعرض المعلم نموذجًا قصيرًا لصفحة يوميات ويسأل: ما عناصرها؟ ويستخرج الطالب: التاريخ، الأحداث، المشاعر.", "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة السفينة «جوهرة مسقط» ويسأل: ماذا تعرف عن تاريخ عمان البحري؟ ويذكر الطالب معلوماته عن الملاحة العمانية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. القراءة الصامتة: يوجه المعلم لقراءة النص صامتًا مع سؤال: ما الخطر الذي واجه السفينة؟ ويقرأ الطالب ويجيب: العاصفة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. القراءة الجهرية: يقرأ المعلم قراءة نموذجية معبرة ثم يستمع لقراءات فردية، ويقرأ الطالب جهريًا معبرًا عن التوتر في المشهد (12 دقيقة)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\n4. الفهم العام: يوجه المعلم لتحديد تاريخ اليوميات والمكان والشخصيات: القبطان صالح، يحيى، طاقم السفينة، ويحدد الطالب العناصر ويجيب عن أسئلة الفهم العام (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة سفينة شراعية بأسماء أجزائها مخفية ويسأل عن أسمائها، ويتوقع الطالب أسماء الأجزاء (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. أجزاء السفينة: يوزع المعلم بطاقات المصطلحات ويطلب من المجموعات لصقها على أجزاء السفينة في الصورة، ويطابق الطالب المصطلح بالجزء (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. المعجم والدلالة: يناقش المعلم معاني المفردات في سياقها ويوجه لحل أسئلة المعجم ص 46، ويستخرج الطالب المعاني ويحل الأسئلة (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أوظف: يطلب المعلم كتابة جمل تتضمن ثلاثة مصطلحات بحرية، ويكتب الطالب الجمل ويقرؤها (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الكتابة الإبداعية.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم مشكلة: سفينة تواجه رياحًا شديدة وشراعها مرفوع، ماذا يفعل القبطان؟ ويقترح الطالب حلولًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تسلسل الأحداث: يوزع المعلم بطاقات الأحداث ويطلب ترتيبها: هبوب العاصفة، صوت غير معتاد من الدفة، الانفجار في الجزء العلوي، الأمر بإنزال الشراع الرئيسي، محاولة فهد السيطرة على الحبل، ويرتب الطالب الأحداث ويرويها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحليل الشخصيات: يوجه المجموعات لاستنتاج صفات القبطان صالح ويحيى والطاقم من أفعالهم، ويستنتج الطالب: الخبرة، سرعة البديهة، الشجاعة، التعاون (10 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\n4. أناقش: يعرض المعلم على السبورة الذكية سؤال: لماذا عدّ إنزال الشراع الرئيسي هو الأفضل رغم خطورته؟ ويعلل الطالب: لحماية السفينة والطاقم (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نموذجًا قصيرًا لصفحة يوميات ويسأل: ما عناصرها؟ ويستخرج الطالب: التاريخ، الأحداث، المشاعر (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. استثمار النص: يوجه المعلم لحل أسئلة استثمار النص ص 51، ويحل الطالب الأسئلة ويناقشها (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. أكتب يومياتي: يكلف كل طالب بكتابة صفحة يوميات عن يوم مميز بالتاريخ والأحداث والمشاعر، ويكتب الطالب يومياته (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «من قائد السفينة في النص»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الكتابة الإبداعية.", "الحصة 1:\nس1 (مستوى المعرفة): ما اسم السفينة في النص؟\nالإجابة: جوهرة مسقط.\n\nس2 (مستوى التطبيق): ما تاريخ اليوميات المذكور في بداية النص؟\nالإجابة: الخميس الرابع عشر من إبريل عام 2011.\n\nس3 (مستوى الاستدلال): ما الذي يجعل النص من نوع اليوميات؟\nالإجابة: تسجيل الأحداث بتاريخ اليوم وبصيغة المشاهدة المباشرة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الصاري؟\nالإجابة: عمود رأسي طويل يشد عليه الشراع.\n\nس2 (مستوى التطبيق): ما وظيفة الدفة؟\nالإجابة: توجيه السفينة.\n\nس3 (مستوى الاستدلال): ما دلالة استخدام الكاتب مصطلحات بحرية كثيرة؟\nالإجابة: تدل على خبرته البحرية وتنقل القارئ إلى أجواء السفينة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ماذا أمر القبطان صالح الطاقم بعد أن أخبره يحيى بازدياد سرعة الرياح؟\nالإجابة: أمرهم بإنزال الشراع الرئيسي.\n\nس2 (مستوى التطبيق): استنتج صفة للقبطان صالح ودليلها.\nالإجابة: الخبرة، فقد كان يستشعر أي تغير في حركة السفينة.\n\nس3 (مستوى الاستدلال): لماذا كان إنزال الشراع إجراءً ضروريًا رغم صعوبته؟\nالإجابة: لأنه الأفضل لسلامة السفينة والطاقم في العاصفة.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما عناصر صفحة اليوميات؟\nالإجابة: التاريخ، والأحداث، ومشاعر الكاتب.\n\nس2 (مستوى التطبيق): لماذا بنيت «جوهرة مسقط» على طراز السفن القديمة في رأيك؟\nالإجابة: لإحياء التراث البحري العماني وإبراز خبرة الأجداد.\n\nس3 (مستوى الاستدلال): ما رأيك في المحافظة على الصناعات البحرية التقليدية؟\nالإجابة: مهمة لأنها تحفظ الهوية وتنقل الخبرات للأجيال.", "الحصة 1:\nس1 (مستوى المعرفة): من قائد السفينة في النص؟\nالإجابة: القبطان صالح.\n\nس2 (مستوى التطبيق): ما الخطر الذي واجهته السفينة؟\nالإجابة: عاصفة شديدة.\n\nس3 (مستوى الاستدلال): ما الفكرة العامة للنص؟\nالإجابة: مواجهة طاقم «جوهرة مسقط» عاصفة بحرية بالخبرة والتعاون.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما العقدة في لغة البحارة؟\nالإجابة: وحدة لقياس سرعة السفن والرياح.\n\nس2 (مستوى التطبيق): وظف كلمة «الشراع» في جملة من إنشائك.\nالإجابة: مثل: رفع البحارة الشراع مع هبوب الرياح.\n\nس3 (مستوى الاستدلال): صنف: الدفة، الصاري، الملاحة، العاصفة إلى أجزاء سفينة وغيرها.\nالإجابة: أجزاء السفينة: الدفة، الصاري. غيرها: الملاحة، العاصفة.\n\nالحصة 3:\nس1 (مستوى المعرفة): رتب: الانفجار في الجزء العلوي، ند الكاتب؟\nالإجابة: لا، العيب في الجمود ورفض التغيير.\n\nس2 (مستوى التطبيق): اذكر فكرة رئيسة من النص.\nالإجابة: الإنسان نتاج عصره ومجتمعه.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا آخر للنص.\nالإجابة: مثل: «لا تحتكر الصواب».\n\nالحصة 2:\nس1 (مستوى المعرفة): ما المقصود بالمسلمات؟\nالإجابة: أفكار يقبلها الناس دون نقاش.\n\nس2 (مستوى التطبيق): هل الكاتب يدعو إلى رفض كل رأي قديم؟ وضح.\nالإجابة: لا، يدعو إلى مراجعة الآراء وتأملها قبل قبولها أو رفضها.\n\nس3 (مستوى الاستدلال): صغ رأيًا مخالفًا لزميلك بأسلوب مهذب.\nالإجابة: مثل: أحترم رأيك، لكنني أرى الأمر من زاوية أخرى.\n\nالحصة 3:\nس1 (مستوى المعرفة): لماذا يحتاج الرأي إلى دليل؟\nالإجابة: ليكون مقنعًا ومبنيًا على حقائق.\n\nس2 (مستوى التطبيق): اذكر قيمة مستفادة من النص.\nالإجابة: احترام الرأي الآخر ومراجعة الآراء.\n\nس3 (مستوى الاستدلال): قيم فقرة الرأي التي كتبتها من حيث وضوح الرأي وقوة الدليل.\nالإجابة: يقيم الطالب فقرته ويقترح تحسينًا.", "الحصة 1:\n- للطالب: يقرأ النص ص 53–54\n- لولي الأمر: يحاور ابنه في موقف اختلفت فيه الآراء\n\nالحصة 2:\n- للطالب: يحل أسئلة المعجم والمناقشة ص 56–57\n- لولي الأمر: يناقش ابنه في آداب الحوار\n\nالحصة 3:\n- للطالب: يحل أسئلة استثمار النص ص 58–59\n- لولي الأمر: يحاور ابنه في قضية بهدوء واحترام\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arabic/?l=16"], "h": [["الدرس", "الدرس الثاني: نسبية الآراء"], ["الوحدة", "الوحدة الثانية - مهاراتي في القراءة"], ["صفحات كتاب الطالب", "53–59"], ["صفحات دليل المعلم", "81–88"], ["عدد الحصص", "3"]]}, {"id": "majzum", "t": "الأنشطة النحوية: الفعل المضارع المجزوم (الصحيح والمعتل)", "u": "الوحدة الثانية - مهاراتي في الكتابة", "ps": [{"n": 1, "ax": "أدوات الجزم والجزم بالسكون", "h": [["الدرس", "الأنشطة النحوية: الفعل المضارع المجزوم (الصحيح والمعتل)"], ["الوحدة", "الوحدة الثانية - مهاراتي في الكتابة"], ["الأسبوع والتاريخ", "الأسبوع السادس: 11–15/10/2026م"], ["صفحات كتاب الطالب", "151–152"], ["صفحات دليل المعلم", "100–104"], ["رقم الحصة", "1 من 3"], ["محور الحصة", "أدوات الجزم والجزم بالسكون"]], "f": ["1. يتعرف أدوات جزم الفعل الم  الأفعال الخمسة: يعرض المعلم أمثلة الأفعال الخمسة مجزومة ويقارنها بالمنصوبة، ويستنتج الطالب تشابه علامة النصب والجزم في الأفعال الخمسة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أطبق: يوزع المعلم بطاقات أفعال ويطلب جزمها كتابة وتصحيح الأقران، ويجزم الطالب ويصحح (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم لافتة إرشادية «لا تلقِ النفايات» ويسأل: ما الأسلوب المستخدم؟ ويحدد الطالب أسلوب النهي والفعل المجزوم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نمذجة الإعراب: يعرب المعلم: «لم يتأخرْ»: لم حرف نفي وجزم وقلب، يتأخر فعل مضارع مجزوم وعلامة جزمه السكون، ويعرب الطالب أمثلة مشابهة (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n3. لافتات إرشادية: يكلف المجموعات بكتابة ثلاث لافتات لمرافق المدرسة بأدوات الجزم، ويكتب الطالب اللافتات ويعرب فعلًا منها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «أعرب «تهملوا» في: لا تهملوا»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1:\nس1 (مستوى المعرفة): اذكر أدوات جزم المضارع التي درستها.\nالإجابة: لم، لا الناهية، لام الأمر.\n\nس2 (مستوى التطبيق): ما علامة جزم «لم يكتبْ»؟\nالإجابة: السكون.\n\nس3 (مستوى الاستدلال): ما الفرق في المعنى بين «لا تكتبُ» و«لا تكتبْ»؟\nالإجابة: الأولى نفي والفعل مرفوع، والثانية نهي والفعل مجزوم.\n\nالحصة 2:\nس1 (مستوى المعرفة): اجزم الفعل «يرمي» بلم.\nالإجابة: لم يرمِ.\n\nس2 (مستوى التطبيق): ما علامة جزم «لم يسعَ»؟\nالإجابة: حذف حرف العلة.\n\nس3 (مستوى الاستدلال): صوب: «لا تنسون واجباتكم».\nالإجابة: لا تنسوا واجباتكم.\n\nالحصة 3:\nس1 (مستوى المعرفة): أعرب «تتأخرْ» في: لا تتأخرْ.\nالإجابة: فعل مضارع مجزوم بلا الناهية وعلامة جزمه السكون.\n\nس2 (مستوى التطبيق): أعرب «يرمِ» في: لم يرمِ الطفل الكرة.\nالإجابة: فعل مضارع مجزوم بلم وعلامة جزمه حذف حرف العلة.\n\nس3 (مستوى الاستدلال): اكتب لافتة لمكتبة المدرسة بلام الأمر.\nالإجابة: مثل: لتحافظْ على هدوء المكتبة.", "الحصة 1:\nس1 (مستوى المعرفة): استخرج الفعل المجزوم: «لم يتأخرْ خالد».\nالإجابة: يتأخر.\n\nس2 (مستوى التطبيق): ما معنى لام الأمر؟\nالإجابة: طلب الفعل.\n\nس3 (مستوى الاستدلال): حول الجملة إلى نهي: «تهملُ واجبك».\nالإجابة: لا تهملْ واجبك.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما علامة جزم «لم يكتبوا»؟\nالإجابة: حذف النون.\n\nس2 (مستوى التطبيق): اجزم الفعل «يدعو» بلام الأمر.\nالإجابة: ليدعُ.\n\nس3 (مستوى الاستدلال): لماذا كتبت الألف بعد «لم يكتبوا»؟\nالإجابة: لأنها ألف التفريق بعد واو الجماعة في المضارع المجزوم.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما معنى «لم» في: لم يحضرْ؟\nالإجابة: نفي الفعل في الزمن الماضي.\n\nس2 (مستوى التطبيق): أعرب «تهملوا» في: لا تهملوا.\nالإجابة: فعل مضارع مجزوم بلا الناهية وعلامة جزمه حذف النون، والواو في محل رفع فاعل.\n\nس3 (مستوى الاستدلال): صحح لافتة زميلك إن وجد فيها خطأ في الجزم.\nالإجابة: يحدد الطالب الخطأ ويصوبه.", "الحصة 1:\n- للطالب: يحل تدريبات ص 152\n- لولي الأمر: يطلب من ابنه نصائح بصيغة لا الناهية\n\nالحصة 2:\n- للطالب: يحل تدريبات ص 153–155\n- لولي الأمر: يراجع مع ابنه جزم الأفعال المعتلة\n\nالحصة 3:\n- للطالب: يحل تدريبات ص 156–157\n- لولي الأمر: يكتب مع ابنه لافتات إرشادية للمنزل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arabic/?l=17"], "h": [["الدرس", "الأنشطة النحوية: الفعل المضارع المجزوم (الصحيح والمعتل)"], ["الوحدة", "الوحدة الثانية - مهاراتي في الكتابة"], ["صفحات كتاب الطالب", "151–157"], ["صفحات دليل المعلم", "100–104"], ["عدد الحصص", "3"]]}, {"id": "imla2", "t": "الأنشطة الإملائية: إملاء اختباري (2)", "u": "الوحدة الثانية - مهاراتي في الكتابة", "ps": [{"n": 1, "ax": "إملاء اختباري في ألف التفريق والنون الساكنة والتنوين", "h": [["الدرس", "الأنشطة الإملائية: إملاء اختباري (2)"], ["الوحدة", "الوحدة الثانية - مهاراتي في الكتابة"], ["الأسبوع والتاريخ", "الأسبوع السابع: 18–22/10/2026م" س2 (مستوى التطبيق): اكتب جملة فيها هاء أصلية وهاء زائدة.\nالإجابة: مثل: غسل الطفل وجهه.\n\nس3 (مستوى الاستدلال): علل: الهاء في «وجه» أصلية والهاء الثانية في «وجهه» زائدة.\nالإجابة: الأولى من بنية الكلمة، والثانية ضمير يمكن حذفه فيبقى «وجه».", "الحصة 1:\n- للطالب: يحل تدريبات ص 178\n- لولي الأمر: يملي على ابنه كلمات منتهية بالهاء والتاء المربوطة\n\nالحصة 2:\n- للطالب: يحل تدريبات ص 180 ويستعد للإملاء الاختباري\n- لولي الأمر: يراجع مع ابنه الهاء الأصلية والزائدة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/arabic/?l=24"], "h": [["الدرس", "الأنشطة الإملائية: الهاء في آخر الكلمة"], ["الوحدة", "الوحدة الثالثة - مهاراتي في الكتابة"], ["صفحات كتاب الطالب", "177–180"], ["صفحات دليل المعلم", "147–149"], ["عدد الحصص", "2"]]}, {"id": "talkhis", "t": "التعبير: التلخيص", "u": "الوحدة الثالثة - مهاراتي في الكتابة", "ps": [{"n": 1, "ax": "مفهوم التلخيص وخطواته", "h": [["الدرس", "التعبير: التلخيص"], ["الوحدة", "الوحدة الثالثة - مهاراتي في الكتابة"], ["الأسبوع والتاريخ", "الأسبوع التاسع: 1–5/11/2026م"], ["صفحات كتاب الطالب", "182–183"], ["صفحات دليل المعلم", "152–154"], ["رقم الحصة", "1 من 2"], ["محور الحصة", "مفهوم التلخيص وخطواته"]], "f": ["1. يتعرف مفهوم التلخيص وخطواته\n2. يحدد الأفكار الرئيسة والتفاصيل الثانوية في نص علمي\n\nمخرج تعليمي آخر:\n3. يقدر قيمة الإيجاز في التعبير", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. المنظمات التخطيطية", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: مخطط الأفكار", "- التلخيص: إعادة صياغة النص بإيجاز مع المحافظة على أفكاره الرئيسة\n- التفاصيل الثانوية: الأمثلة والشروح والتكرار التي تحذف عند التلخيص", "يسأل المعلم: لو طلب منك أن تحكي فيلمًا مدته ساعتان في دقيقة واحدة، ماذا تفعل؟ ويستنتج الطالب ضرورة اختيار الأحداث الرئيسة.", "1. التهيئة: يسأل المعلم: لو طلب منك أن تحكي فيلمًا مدته ساعتان في دقيقة واحدة، ماذا تفعل؟ ويستنتج الطالب ضرورة اختيار الأحداث الرئيسة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. خطوات التلخيص: يعرض المعلم خطوات الكتاب ص 182: القراءة الواعية وى المعرفة): ما المقصود بإنترنت الأشياء؟\nالإجابة: ربط الأجهزة بالشبكة لتتبادل البيانات.\n\nس2 (مستوى التطبيق): كيف يمكن أن تسهم التقنيات الحديثة في الأمن الغذائي؟\nالإجابة: بالزراعة الذكية ومراقبة المحاصيل بالأجهزة لزيادة الإنتاج.\n\nس3 (مستوى الاستدلال): اذكر تحديًا تفرضه التقنيات الحديثة وطريقة مواجهته.\nالإجابة: تغير طبيعة الوظائف، ومواجهته بتعلم مهارات جديدة.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر مهارتين من مهارات المستقبل.\nالإجابة: البرمجة، والتفكير الناقد.\n\nس2 (مستوى التطبيق): ما الفكرة التي اقترحتها مجموعتك؟ وما المشكلة التي تعالجها؟\nالإجابة: يذكر الطالب الفكرة والمشكلة.\n\nس3 (مستوى الاستدلال): كيف يستعد الطالب العماني لمهارات المستقبل؟\nالإجابة: بالتعلم الذاتي والمشاركة في مسابقات الابتكار والبرمجة.", "الحصة 1:\nس1 (مستوى المعرفة): ما الثورة الصناعية الرابعة؟\nالإجابة: مرحلة صناعية تعتمد على التقنيات الذكية والرقمية.\n\nس2 (مستوى التطبيق): اذكر مشكلة عالمية ورد ذكرها في النص.\nالإجابة: الأمن الغذائي أو تغير المناخ أو نقص الوظائف.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا آخر للنص.\nالإجابة: مثل: «تقنيات تصنع المستقبل».\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الذكاء الاصطناعي؟\nالإجابة: قدرة الأنظمة الحاسوبية على محاكاة التفكير البشري.\n\nس2 (مستوى التطبيق): اذكر فائدة للطباعة ثلاثية الأبعاد.\nالإجابة: صنع قطع ومجسمات بسرعة ودقة.\n\nس3 (مستوى الاستدلال): هل ترى أن فوائد التقنيات أكبر من تحدياتها؟ علل.\nالإجابة: يبدي الطالب رأيه مدعمًا بالأدلة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما المقصود بالابتكار؟\nالإجابة: تقديم فكرة جديدة نافعة.\n\nس2 (مستوى التطبيق): اذكر تقنية يمكن أن تقلل استهلاك المياه.\nالإجابة: أنظمة الري الذكي.\n\nس3 (مستوى الاستدلال): قيم فكرة مجموعة أخرى من حيث الجدوى والإبداع.\nالإجابة: يقيم الطالب الفكرة ويقترح تطويرها.", "الحصة 1:\n- للطالب: يقرأ النص ص 74–76\n- لولي الأمر: يحاور ابنه في التقنيات الحديثة في المنزل\n\nالحصة 2:\n- للطالب: يحل أسئلة المعجم والمناقشة ص 78–80\n- لولي الأمر: يناقش ابنه في الاستخدام المسؤول للتقنية\n\nالحصة 3:\n- للطالب: يحل أسئلة استثمار النص ص 83\n- لولي الأمر: يشجع ابنه على تعلم مهارة رقمية جديدة\n🎮 رابط ألعاب ونشاط ق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المعجم والدلالة: يوجه المعلم لاستخراج معاني المفردات ويناقش دلالة التعبيرات الوصفية في مشهد الغروب، ويوضح الطالب المعاني والدلالات (10 دقائق)\nالاستراتيجيات: الكتابة الإبداعية.\n\n3. تحول الموقف: يوزع المعلم بطاقات الأحداث ويطلب ترتيبها: قلق سعد، حواره مع أسيد، ذهاب سعد غاضبًا، دعوة مصعب له إلى الاستماع، إسلامه، دعوته قومه، ويرتب الطالب الأحداث ويحلل التحول (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. أساليب الإقناع: يناقش المعلم قول مصعب لسعد: أوتجلس فتسمع، فإن رضيت أمرًا قبلته وإن كرهته عزلنا عنك ما تكره، ويستنتج الطالب: الهدوء، وترك حرية الاختيار، وعرض الحجة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: من كتب هذا النص؟ هل هو سعد نفسه؟ ويستنتج الطالب أن الكاتب يروي سيرة غيره (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. خصائص السيرة الغيرية: يوجه المعلم لاستخراج خصائص النص: الحديث عن شخص آخر، الوصف، الحوار، الأحداث الحقيقية، ويستخرج الطالب الخصائص بشواهدها (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. أكتب سيرة مصغرة: يكلف المعلم بكتابة فقرة عن موقف مؤثر من حياة شخصية يعجب بها، ويكتب الطالب الفقرة (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «ما السيرة الغيرية»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "الحصة 1:\nس1 (مستوى المعرفة): من الشخصية الرئيسة في النص؟\nالإجابة: سعد بن معاذ.\n\nس2 (مستوى التطبيق): من الرجلان اللذان بعثهما النبي صلى الله عليه وسلم إلى يثرب كما في النص؟\nالإجابة: مصعب بن عمير وعبد الله بن أم مكتوم.\n\nس3 (مستوى الاستدلال): لماذا كان سعد قلقًا في بداية النص؟\nالإجابة: لأن أهل المدينة بدؤوا يدخلون في الدين الجديد وكان يخشى على قوم ؟ ويستنتج الطالب نظام النمل وتنظيمه.", "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة صف من النمل يحمل طعامًا ويسأل: هل النمل ذكي؟ ما الدليل؟ ويعبر الطالب عن رأيه ويتشوق (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. القراءة الصامتة: يوجه المعلم لقراءة النص صامتًا مع سؤال: أين وضع الضابط الحلوى؟ ويقرأ الطالب ويجيب: في صندوق محكم فوق عمود وسط إناء ماء (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. القراءة الجهرية: يقرأ المعلم قراءة نموذجية ويستمع لقراءات فردية، ويقرأ الطالب جهريًا (12 دقيقة)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\n4. الفهم العام: يوجه المعلم لتحديد الفكرة العامة وترتيب خطوات الضابط وما فعله النمل، ويحدد الطالب ويرتب (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم مشكلة: كيف يمكن للنمل أن يصل إلى صندوق يحيطه الماء؟ ويستمع لحلول الطلبة، ويقترح الطالب حلولًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. المعجم والدلالة: يوجه المعلم لاستخراج معاني المفردات ويناقش التعبيرات في النص، ويوضح الطالب المعاني (10 دقائق)\nالاستراتيجيات: البحث العلمي.\n\n3. تحليل الحيلة: يعرض المعلم صورة الكتاب ص 110 ويناقش كيف وصل النمل إلى الصندوق من أعلى عبر الخيمة متجاوزًا الماء، ويحلل الطالب الحيلة ويستنتج صفات النمل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. أقارن: يقارن المعلم مع الطلبة بين تفكير الضابط وتفكير النمل، ويقارن الطالب ويستنتج أن النمل فكر في طريق لم يتوقعه الضابط (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يقرأ المعلم قوله تعالى «حتى إذا أتوا على وادي النمل قالت نملة يا أيها النمل ادخلوا مساكنكم» ويسأل: ماذا تدل الآية على حياة النمل؟ ويستنتج الطالب نظام النمل وتنظيمه (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. استثمار النص: يوجه المعلم لحل  $('mSep').classList.toggle('on',mode==='sep');$('mCom').classList.toggle('on',mode==='com');
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
 const tb=$('tabs');tb.innerHTML='';
 if(mode==='sep'){l.ps.forEach((p,i)=>{const b=el('button',i===pi?'on':'','الحصة '+p.n+': '+p.ax);b.onclick=()=>{pi=i;render()};tb.appendChild(b)})}
 const inf=$('info');inf.innerHTML='';
 const H=mode==='sep'?l.ps[pi].h:l.h;
 H.forEach(([k,v])=>{const d=el('div');const b=el('b',null,k+': ');d.appendChild(b);d.appendChild(document.createTextNode(v));inf.appendChild(d)});
 const F=mode==='sep'?l.ps[pi].f:l.c;
 const cs=$('cards');cs.innerHTML='';
 D.F.forEach((name,i)=>{const c=el('section','card');const h=el('h2');h.appendChild(el('span',null,(i+1)+'. '+name));
  const b=el('button','cp','نسخ');b.onclick=()=>copy(F[i],b);h.appendChild(b);c.appendChild(h);c.appendChild(el('div','txt',F[i]));cs.appendChild(c)});
}
function done(b){b.textContent='تم النسخ ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1600)}
function legacy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function copy(t,b){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(b),()=>{legacy(t)?done(b):manual(t)})}
 else{legacy(t)?done(b):manual(t)}
}
function manual(t){const ta=$('ta');ta.value=t;$('modal').classList.add('show');ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
$('close').onclick=()=>$('modal').classList.remove('show');
$('mSep').onclick=()=>{mode='sep';render()};$('mCom').onclick=()=>{mode='com';render()};
fill();render();
</script>
<script src="/assets/qlink.js" defer></script>
