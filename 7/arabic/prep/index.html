:root{--ink:#3b5688;--tint:#e8eef9;--tint2:#f2f5fc;--line:#c3d0ea;--acc:#6a8cc4;--bg:#f7f9fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#22303a;font-family:T,sans-serif;line-height:1.6}
header{background:#fff;border-bottom:2px solid var(--line);padding:14px 16px 10px;position:sticky;top:0;z-index:5}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 8px;color:var(--ink)}
.mode{display:flex;gap:0;border:2px solid var(--acc);border-radius:12px;overflow:hidden;width:max-content;max-width:100%}
.mode button{font:inherit;font-weight:700;border:0;background:#fff;color:var(--ink);padding:8px 18px;cursor:pointer;font-size:1rem}
.mode button.on{background:var(--acc);color:#fff}
.explain{font-size:.88rem;color:#4a5963;margin:8px 0 2px}
.now{margin-top:6px;font-weight:700;color:var(--ink);background:var(--tint);border-radius:8px;padding:5px 10px;display:inline-block}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px}
select{font:inherit;font-size:1rem;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tabs button{font:inherit;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--tint);border-color:var(--acc);font-weight:700}
.info{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0 12px;font-size:.92rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 16px}
.info b{color:var(--ink)}
main{padding:0 16px 40px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card h2{margin:0;font-size:1.02rem;background:var(--tint);color:var(--ink);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cp{font:inherit;font-weight:700;font-size:.95rem;border:1.5px solid var(--acc);background:#fff;color:var(--ink);border-radius:10px;padding:5px 16px;cursor:pointer;min-width:96px}
.cp.ok{background:var(--acc);color:#fff}
.txt{white-space:pre-wrap;font-family:N,serif;font-size:1.02rem;padding:10px 14px;line-height:1.85;user-select:text}
.modal{position:fixed;inset:0;background:rgba(40,55,65,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}
.box{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:14px}
.box textarea{width:100%;height:50vh;font-family:N,serif;font-size:1rem;direction:rtl;border:1.5px solid var(--line);border-radius:10px;padding:8px}
.box p{margin:0 0 8px;color:var(--ink);font-weight:700}
.box button{font:inherit;margin-top:8px;border:1.5px solid var(--acc);background:#fff;border-radius:10px;padding:6px 16px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

  const b=el('button','cp','نسخ');b.onclick=()=>copy(F[i],b);h.appendChild(b);c.appendChild(h);c.appendChild(el('div','txt',F[i]));cs.appendChild(c)});
}
function done(b){b.textContent='تم النسخ ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1600)}
function legacy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function copy(t,b){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(b),()=>{legacy(t)?done(b):manual(t)})}
 else{legacy(t)?done(b):manual(t)}
}
function manual(t){const ta=$('ta');ta.value=t;$('modal').classList.add('show');ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
$('close').onclick=()=>$('modal').classList.remove('show');
$('mSep').onclick=()=>{mode='sep';render()};$('mCom').onclick=()=>{mode='com';render()};
fill();render();
</script>
