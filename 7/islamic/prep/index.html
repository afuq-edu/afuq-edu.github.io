د آياتها (44 آية)، ويتأمل الطالب الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها.\n\nالحصة 2:\nيعرض المعلم على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة، ويذكر الطالب أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة.\n\nالحصة 3:\nيعرض المعلم موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟ ويقارن الطالب بين الموقفين ويعلل.\n\nالحصة 4:\nيعرض المعلم موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة، ويجيب الطالب ويتوقع موضوع الآيات.\n\nالحصة 5:\nيعرض المعلم صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟ ويلاحظ الطالب ويربط بقوله «برب المشارق والمغارب».\n\nالحصة 6:\nيعرض المعلم على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه، ويربط الطالب المقاطع بآياتها.", "الحصة 1 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)، ويتأمل الطالب الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع الطلبة التلاوة النموذجية للآيات (1–5) من الوسائل المتعددة ثم يقرأ بنفسه بتأنٍّ مبرزًا المد في «سائل» و«واقع»، ويستمع الطالب منصتًا ويتابع في المصحف ويضع إصبعه على موضع القراءة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الجماعية والفردية: يقرأ المعلم الآيات مع الطلبة جماعيًا ثم يستمع لقراءات فردية ويكلف القارئ المتقن بتصويب زميله (تعلم بالأقران)، ويقرأ الطالب جماعيًا ثم فرديًا ويصحح لزميله بأدب (6 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n4. أتعرف المعنى: يناقش المعلم معاني: سأل سائل، دافع، المعارج، تعرج، والروح (جبريل عليه السلام)، ويستخرج الطالب معنى كل كلمة ويدونها في كراسته (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ بالتكرار: يقسم المعلم الآيات إلى مقطعين (1–3) و(4–5) ويوجه للتكرار المتدرج ثم يجري تسميعًا ثنائيًا، ويكرر الطالب المقطع ويسمّعه لزميله ثم يسمع الآيات كاملة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. التلاوة النموذجية: يُسمع المعلم التلاوة النموذجية للآيات (6–10) ويقف على مواضع التفخيم مثل «قريبا» و«الجبال»، ويستمع الطالب ويتابع ويحدد حروف الاستعلاء في الآيات (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. التلاوة الجماعية والفردية: يوجه المعلم لقراءة جماعية ثم فردية ويصحح الأخطاء فورًا مع بيان سببها، ويقرأ الطالب ويصحح نطقه للكلمات مثل «كالمهل» و«كالعهن» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. لعبة ترتيب الآيات: يوزع المعلم بطاقات كلمات الآيات المبعثرة على المجموعات ويطلب ترتيبها حسب المصحف في زمن محدد، ويرتب الطالب البطاقات مع مجموعته ويقرأ الآيات بعد ترتيبها (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. الحفظ والتسميع: يوجه المعلم لحفظ الآيات بالتكرار ثم يسمعها من الطلبة بالتناوب، ويحفظ الطالب الآيات ويسمّعها (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويختم بسؤال: كيف أستعد ليوم الحساب؟ ويجيب الطالب عن الأسئلة ويذكر عملًا صالحًا يستعد به (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة، ويذكر الطالب أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يعرض المعلم التلاوة النموذجية للآيات (11–14) مع إبراز الإظهار في «من عذاب»، ويستمع الطالب ويحدد مواضع الوقف والابتداء (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التلاوة الفردية والتصحيح: يستمع المعلم لتلاوات فردية ويوجه الطلبة لتصويب بعضهم مستخدمًا قائمة رصد للأخطاء، ويتلو الطالب ويصوّب ويسجل أخطاءه ليعالجها (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. أفهم وأتدبر: يناقش المعلم مع الطلبة ترتيب من يفتدي بهم المجرم (البنون، الصاحبة، الأخ، الفصيلة، من في الأرض) ودلالته، ويستخرج الطالب ترتيب المفتدى بهم ويستنتج شدة الهول (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات بطريقة التكرار والربط بالمعنى، ويحفظ الطالب الآيات ويسمعها لزميله (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. التلاوة النموذجية: يُسمع المعلم الآيات (15–18) ويركز على مد «إنها» ونطق «لظى» و«للشوى»، ويستمع الطالب ويكرر الكلمات الصعبة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. التلاوة الجماعية والفردية: ينظم المعلم قراءة تبادلية بين صفوف الطلبة ثم قراءات فردية، ويقرأ الطالب بالتبادل ثم فرديًا (6 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n8. خريطة صفات أهل النار: يرسم المعلم على السبورة خريطة مفاهيمية: من أدبر، تولى، جمع، أوعى، ويطلب من المجموعات إكمالها بمعنى كل صفة، ويكمل الطالب الخريطة مع مجموعته ويشرح معنى كل صفة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. الحفظ والتسميع: يسمع المعلم الآيات من الطلبة ويعزز المتقنين، ويسمع الطالب الآيات (15–18) (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويختم بدعاء النجاة من النار، ويجيب الطالب ويردد الدعاء (3 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟ ويقارن الطالب بين الموقفين ويعلل (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم التلاوة ويبين الوقف على «هلوعا» و«جزوعا» و«منوعا» بإبدال التنوين ألفًا، ويستمع الطالب ويطبق الوقف الصحيح (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التلاوة والتصحيح: يستمع المعلم لقراءات فردية ويصحح ويثني على المتقن، ويقرأ الطالب ويصحح (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتدبر الصفات: يناقش المعلم صفات الإنسان (هلوع، جزوع، منوع) ثم يستخرج مع الطلبة أول صفتين للمصلين: الدوام على الصلاة والحق المعلوم في المال، ويستخرج الطالب الصفات من الآيات ويمثل لكل منها (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ: يقسم المعلم الآيات (19–21) و(22–25) ويوجه للتكرار، ويحفظ الطالب ويسمع لزميله (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. التلاوة النموذجية: يُسمع المعلم التلاوة ويحدد مواضع الألف المدية المرققة كما في «يصدقون» و«ربهم» والمفخمة في «حافظون»، ويستمع الطالب ويضع خطًا تحت الألف المدية في كراسته (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. التلاوة الثنائية: يوزع الطلبة أزواجًا يقرأ أحدهما ويصحح الآخر ثم يتبادلان، ويقرأ الطالب ويصحح لزميله (6 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n8. أستخرج الصفات: يناقش المعلم صفات: التصديق بيوم الدين، الخوف من عذاب الله، حفظ الفروج، ويوضح معنى العفة بأسلوب مناسب، ويستخرج الطالب الصفات ويبين أثر كل صفة في السلوك (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. الحفظ: يوجه المعلم لحفظ الآيات بالربط بين الصفات وتسلسلها، ويحفظ الطالب ويسمع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويثني على المتقنين، ويجيب الطالب عن الأسئلة (3 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة، ويجيب الطالب ويتوقع موضوع الآيات (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات (32–35) ويبرز المد في «لأماناتهم» و«بشهاداتهم»، ويستمع الطالب ويتابع (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. التلاوة والتصحيح: يستمع المعلم لقراءات فردية ويتابع تطبيق الغنة في «إنما» إن وجدت وأحكام المد، ويقرأ الطالب ويصحح (6 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n4. لعب أدوار: يكلف مجموعات بتمثيل مواقف قصيرة: أداء الأمانة، الوفاء بالوعد، أداء الشهادة بالحق، ويمثل الطالب الموقف ويربطه بالآية المناسبة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات ثم يسمعها، ويحفظ الطالب ويسمع (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. التلاوة النموذجية: يُسمع المعلم الآيات ويوضح نطق «مهطعين» و«عزين»، ويستمع الطالب ويكرر (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. التلاوة الجماعية والفردية: يقرأ المعلم مع الطلبة ثم يوزع التلاوة على المجموعات، ويقرأ الطالب مع مجموعته وفرديًا (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n8. أتدبر وأناقش: يناقش المعلم سؤال: «أيطمع كل امرئ منهم أن يدخل جنة نعيم»: لماذا ردت الآية بـ«كلا»؟ ويحلل الطالب الآية ويستنتج أن الجنة لا تنال بالتمني (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. الحفظ: يوجه المعلم لحفظ الآيات ويسمع، ويحفظ الطالب ويسمع (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n10. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 5 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟ ويلاحظ الطالب ويربط بقوله «برب المشارق والمغارب» (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويبين الإخفاء في «من الأجداث» والإظهار في «من عذاب» عند مراجعتها، ويستمع الطالب ويحدد المواضع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الفردية: يستمع المعلم لقراءات فردية متقنة ويعالج الأخطاء الشائعة، ويقرأ الطالب فرديًا (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. صورة يوم الخروج: يناقش المعلم مع الطلبة مشهد الخروج من القبور: سراعًا، خاشعة أبصارهم، ترهقهم ذلة، ويستخرج الطالب عناصر المشهد ويعبر عنه بأسلوبه (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات ويسمع، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويعلن موعد التسميع الشامل للسورة، ويجيب الطالب ويستعد للتسميع (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 6 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه، ويربط الطالب المقاطع بآياتها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التسميع الشامل: يسمع المعلم السورة من الطلبة على مقاطع مستخدمًا بطاقة معايير التلاوة ويرصد الدرجات، ويسمع الطالب المقطع المطلوب منه ويقيّم نفسه بالبطاقة (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق ترقيق الراء: يوجه المجموعات لاستخراج راءات مرققة من السورة مثل «الكافرين» و«الشر» ثم يعللها، ويستخرج الطالب المواضع ويعلل الترقيق (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات بأسئلة السورة كاملة على السبورة الذكية، ويشارك مجموعته في الإجابة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويعلن المتميزين في الحفظ، ويجيب الطالب ويحتفي بزملائه المتميزين (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1:\nس1 (مستوى المعرفة): ما عدد آيات سورة المعارج؟\nالإجابة: 44 آية.\n\nس2 (مستوى التطبيق): ما المقصود بقوله تعالى: «من الله ذي المعارج»؟\nالإجابة: من الله صاحب المصاعد والدرجات العلا التي تصعد فيها الملائكة إليه.\n\nس3 (مستوى الاستدلال): لماذا وُصف الصبر في الآية الخامسة بأنه جميل؟\nالإجابة: لأنه صبر لا جزع فيه ولا شكوى إلا إلى الله تعالى.\n\nس4 (مستوى المعرفة): ما معنى كلمة «العهن» في قوله تعالى: «وتكون الجبال كالعهن»؟\nالإجابة: الصوف المصبوغ المنفوش.\n\nس5 (مستوى التطبيق): بمَ شبهت الآيات السماء يوم القيامة؟\nالإجابة: بالمهل وهو المعدن المذاب.\n\nس6 (مستوى الاستدلال): علل: لا يسأل القريب قريبه يوم القيامة.\nالإجابة: لانشغال كل إنسان بنفسه من شدة الهول.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما معنى «فصيلته»؟\nالإجابة: عشيرته الأقربون.\n\nس2 (مستوى التطبيق): بمن يود المجرم أن يفتدي من عذاب يوم القيامة؟\nالإجابة: ببنيه وصاحبته وأخيه وفصيلته ومن في الأرض جميعًا.\n\nس3 (مستوى الاستدلال): ماذا تدل عليه رغبة المجرم في الافتداء بأحب الناس إليه؟\nالإجابة: تدل على شدة العذاب وهول الموقف حتى يتخلى الإنسان عن أحبابه لينجو بنفسه.\n\nس4 (مستوى المعرفة): ما معنى «لظى»؟\nالإجابة: اسم من أسماء النار.\n\nس5 (مستوى التطبيق): من الذين تدعوهم النار كما في الآية 17؟\nالإجابة: من أدبر عن الحق وتولى عن الطاعة.\n\nس6 (مستوى الاستدلال): ما العلاقة بين قوله تعالى «وجمع فأوعى» وخلق البخل؟\nالإجابة: أن من جمع المال ومنع حق الله فيه بخلًا كان من أهل النار.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما معنى «هلوعا»؟\nالإجابة: شديد الحرص قليل الصبر.\n\nس2 (مستوى التطبيق): من المستثنون من صفة الهلع كما في الآية 22؟\nالإجابة: المصلون.\n\nس3 (مستوى الاستدلال): ما الفرق بين السائل والمحروم؟\nالإجابة: السائل الذي يطلب العطاء، والمحروم المتعفف الذي لا يسأل.\n\nس4 (مستوى المعرفة): ما معنى «مشفقون»؟\nالإجابة: خائفون.\n\nس5 (مستوى التطبيق): اذكر صفة من صفات المؤمنين وردت في الآية 26.\nالإجابة: يصدقون بيوم الدين.\n\nس6 (مستوى الاستدلال): لماذا وصف عذاب الله بأنه «غير مأمون»؟\nالإجابة: لأنه لا يأمن أحد أن يقع فيه، فيبقى المؤمن خائفًا راجيًا.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما معنى «راعون»؟\nالإجابة: حافظون مؤدون لها.\n\nس2 (مستوى التطبيق): ما جزاء أصحاب الصفات المذكورة كما في الآية 35؟\nالإجابة: في جنات مكرمون.\n\nس3 (مستوى الاستدلال): لماذا ختمت صفات المؤمنين بالمحافظة على الصلاة كما بدأت بالدوام عليها؟\nالإجابة: لبيان عظيم منزلة الصلاة وأنها أساس الصفات كلها.\n\nس4 (مستوى المعرفة): ما معنى «عزين»؟\nالإجابة: جماعات متفرقة.\n\nس5 (مستوى التطبيق): كيف كان الكافرون يقبلون نحو النبي صلى الله عليه وسلم؟\nالإجابة: مسرعين جماعات عن اليمين وعن الشمال.\n\nس6 (مستوى الاستدلال): ما الذي ردت عليه كلمة «كلا» في الآية 39؟\nالإجابة: ردت على طمعهم في دخول الجنة دون إيمان وعمل.\n\nالحصة 5:\nس1 (مستوى المعرفة): ما معنى «الأجداث»؟\nالإجابة: القبور.\n\nس2 (مستوى التطبيق): كيف يخرج الناس من القبور كما وصفت الآية 43؟\nالإجابة: سراعًا كأنهم إلى نصب يوفضون.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (40–41) على قدرة الله تعالى؟\nالإجابة: أنه سبحانه قادر على أن يبدل خيرًا منهم وما هو بمسبوق.\n\nالحصة 6:\nس1 (مستوى المعرفة): كم عدد آيات سورة المعارج؟ وما الآية التي تبدأ بها صفات المصلين؟\nالإجابة: 44 آية، وتبدأ الصفات من الآية 22 «إلا المصلين».\n\nس2 (مستوى التطبيق): لماذا رققت الراء في كلمة «الكافرين»؟\nالإجابة: لأنها مكسورة.\n\nس3 (مستوى الاستدلال): صنف آيات السورة إلى مقطعين: ترهيب وترغيب، مع مثال لكل منهما.\nالإجابة: ترهيب: «كلا إنها لظى»، ترغيب: «أولئك في جنات مكرمون».", "الحصة 1:\nس1 (مستوى المعرفة): اتلُ الآيات (1–3) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة متقنة.\n\nس2 (مستوى التطبيق): كم مقدار اليوم الذي تعرج فيه الملائكة والروح إليه؟\nالإجابة: خمسون ألف سنة.\n\nس3 (مستوى الاستدلال): اقترح موقفًا من حياتك تطبق فيه الصبر الجميل.\nالإجابة: مثل: الصبر على المرض أو على تأخر النتيجة دون تذمر مع الدعاء والأخذ بالأسباب.\n\nس4 (مستوى المعرفة): أكمل: «إنهم يرونه بعيدا ...».\nالإجابة: «ونراه قريبا».\n\nس5 (مستوى التطبيق): اذكر صورتين من أهوال يوم القيامة وردتا في الآيات (8–10).\nالإجابة: السماء كالمهل، والجبال كالعهن، ولا يسأل حميم حميما.\n\nس6 (مستوى الاستدلال): «يرونه بعيدا ونراه قريبا»: ما الدرس المستفاد لك من هذه المقابلة؟\nالإجابة: أن يوم القيامة قريب مهما ظنه الناس بعيدًا، فأبادر بالتوبة والعمل الصالح.\n\nالحصة 2:\nس1 (مستوى المعرفة): اتلُ الآيات (11–14) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): أكمل: «وفصيلته التي ...».\nالإجابة: «تؤويه».\n\nس3 (مستوى الاستدلال): هل تنفع القرابة الإنسان يوم القيامة إن لم يعمل صالحًا؟ علل.\nالإجابة: لا تنفعه، لأن كل نفس بما كسبت رهينة والنجاة بالإيمان والعمل الصالح.\n\nس4 (مستوى المعرفة): أكمل: «كلا إنها لظى ...».\nالإجابة: «نزاعة للشوى».\n\nس5 (مستوى التطبيق): اذكر صفتين لمن تدعوهم النار.\nالإجابة: أدبر وتولى، وجمع فأوعى.\n\nس6 (مستوى الاستدلال): كيف يحمي المسلم نفسه من صفة «جمع فأوعى»؟\nالإجابة: بإخراج الزكاة والصدقة وأداء حق المال.\n\nالحصة 3:\nس1 (مستوى المعرفة): أكمل: «إذا مسه الشر جزوعا ...».\nالإجابة: «وإذا مسه الخير منوعا».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المصلين وردتا في الآيات (23–25).\nالإجابة: الدوام على الصلاة، وفي أموالهم حق معلوم للسائل والمحروم.\n\nس3 (مستوى الاستدلال): كيف تعالج الصلاة الدائمة صفة الهلع في الإنسان؟\nالإجابة: تربطه بالله فيطمئن قلبه، فيصبر عند الشر ويجود عند الخير.\n\nس4 (مستوى المعرفة): أكمل: «والذين هم من عذاب ربهم ...».\nالإجابة: «مشفقون».\n\nس5 (مستوى التطبيق): حدد كلمة فيها ألف مدية مفخمة من الآية 29.\nالإجابة: «حافظون».\n\nس6 (مستوى الاستدلال): ما أثر التصديق بيوم الدين في سلوك المسلم؟\nالإجابة: يجعله يراقب الله في أقواله وأفعاله ويستعد للحساب.\n\nالحصة 4:\nس1 (مستوى المعرفة): أكمل: «والذين هم بشهاداتهم ...».\nالإجابة: «قائمون».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المؤمنين في الآيتين (32–33).\nالإجابة: رعاية الأمانة والعهد، والقيام بالشهادة.\n\nس3 (مستوى الاستدلال): صديقك وعدك بموعد ثم تأخر دون عذر، كيف تنصحه في ضوء الآية 32؟\nالإجابة: أذكره بأن الوفاء بالعهد من صفات المؤمنين وأن رعايته من الإيمان.\n\nس4 (مستوى المعرفة): أكمل: «أيطمع كل امرئ منهم ...».\nالإجابة: «أن يدخل جنة نعيم».\n\nس5 (مستوى التطبيق): ما معنى «مهطعين»؟\nالإجابة: مسرعين مادين أعناقهم.\n\nس6 (مستوى الاستدلال): زميلك يقول: سأدخل الجنة لأني من أسرة صالحة، بمَ ترد عليه من الآيات؟\nالإجابة: أرد بقوله تعالى «أيطمع كل امرئ منهم أن يدخل جنة نعيم كلا»، فالجنة بالإيمان والعمل.\n\nالحصة 5:\nس1 (مستوى المعرفة): أكمل: «خاشعة أبصارهم ترهقهم ذلة ...».\nالإجابة: «ذلك اليوم الذي كانوا يوعدون».\n\nس2 (مستوى التطبيق): ما معنى «يوفضون»؟\nالإجابة: يسرعون.\n\nس3 (مستوى الاستدلال): لماذا ختمت السورة بذكر اليوم الموعود وقد بدأت بالسؤال عن العذاب الواقع؟\nالإجابة: للتأكيد أن العذاب الذي استبعدوه واقع لا محالة في اليوم الذي وعدوا به.\n\nالحصة 6:\nس1 (مستوى المعرفة): اتلُ الآيات (22–35) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): اذكر ثلاث صفات من صفات المصلين.\nالإجابة: الدوام على الصلاة، أداء حق المال، التصديق بيوم الدين.\n\nس3 (مستوى الاستدلال): اختر صفة من صفات المصلين وضع خطة أسبوعية لتطبيقها.\nالإجابة: مثل المحافظة على الصلاة: أداؤها في أول وقتها ومتابعة ذلك في جدول يومي.", "الحصة 1:\n- للطالب: يكرر تلاوة الآيات (1–5) في المنزل ويحفظها لتسميعها في الحصة القادمة\n- لولي الأمر: يستمع لتلاوة ابنه للآيات (1–5) ويشجعه على الحفظ بالاستماع لتلاوة مجودة\n- للطالب: يراجع الآيات (1–10) ويكتب معاني كلمتي المهل والعهن\n- لولي الأمر: يتابع حفظ ابنه للآيات (1–10) ويستمع إليه مرة يوميًا\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=1\n\nالحصة 2:\n- للطالب: يحفظ الآيات (11–14) ويربطها بما سبقها ويسمع الآيات (1–14)\n- لولي الأمر: يسمع من ابنه الآيات (1–14) ويحاوره في معنى الافتداء\n- للطالب: يحفظ الآيات (15–18) ويكتب صفات من تدعوهم النار\n- لولي الأمر: يتابع حفظ ابنه ويذكره بأهمية الإنفاق\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=1\n\nالحصة 3:\n- للطالب: يحفظ الآيات (19–25) ويراجع ما قبلها\n- لولي الأمر: يشجع ابنه على المحافظة على الصلاة في وقتها ويسمع منه الآيات\n- للطالب: يحفظ الآيات (26–31) ويطبق تفخيم الألف بعد الحرف المفخم\n- لولي الأمر: يسمع من ابنه الآيات (19–31)\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=1\n\nالحصة 4:\n- للطالب: يحفظ الآيا ot\n5. السبورة التقليدية\n\nالحصة 3:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 4:\n1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقة معايير التلاوة", "الحصة 1:\n- الحاقة: اسم من أسماء يوم القيامة لأنه يحق فيه الحق\n- الطاغية: الصيحة المجاوزة للحد\n- صرصر: شديدة البرد والصوت\n- حسومًا: متتابعة\n- أخذة رابية: أخذة شديدة زائدة\n- الجارية: السفينة\n- واعية: حافظة لما تسمع\n- دكتا: سحقتا وسويتا بالأرض\n- واهية: ضعيفة ممزقة\n- أرجائها: جوانبها\n\nالحصة 2:\n- هاؤم: خذوا\n- قطوفها دانية: ثمارها قريبة\n- أسلفتم: قدمتم\n- القاضية: الموتة التي لا بعث بعدها\n- سلطانيه: حجتي وقوتي\n- فغلوه: اجمعوا يديه إلى عنقه بالأغلال\n- صلوه: أدخلوه\n- فاسلكوه: أدخلوه\n- حميم: قريب ينفعه\n- غسلين: صديد أهل النار\n\nالحصة 3:\n- رسول كريم: النبي محمد صلى الله عليه وسلم المبلغ عن ربه\n- تقوّل: افترى\n- الوتين: عرق متصل بالقلب\n- حاجزين: مانعين\n\nالحصة 4:\n- حق اليقين: اليقين الثابت الذي لا شك فيه\n- حسرة: ندم شديد\n- فسبح: نزّه الله تعالى عما لا يليق به", "الحصة 1:\nيعرض المعلم على السبورة الذكية أسماء ثلاث أمم (ثمود، عاد، قوم فرعون) ويسأل: ماذا تعرف عنها؟ ويذكر الطالب ما يعرفه عن هذه الأمم.\n\nالحصة 2:\nيعرض المعلم جدولًا فارغًا بعمودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق، ويتوقع الطالب ويدون.\n\nالحصة 3:\nيعرض المعلم على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟ ويعصف الطالب ذهنيًا بالإجابات.\n\nالحصة 4:\nيتلو المعلم الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟ ويجيب الطالب ويتوقع سبب الختم بالتسبيح.", "الحصة 1 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم على السبورة الذكية أسماء ثلاث أمم (ثمود، عاد، قوم فرعون) ويسأل: ماذا تعرف عنها؟ ويذكر الطالب ما يعرفه عن هذه الأمم (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات (1–10) ويبرز تفخيم الراء في «صرصر» الأولى وترقيقها في الثانية المكسورة، ويستمع الطالب ويحدد موضع الراءين (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الجماعية والفردية: يقرأ المعلم مع الطلبة ثم يستمع لقراءات فردية ويصحح، ويقرأ الطالب ويصحح (6 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n4. خريطة الأمم المكذبة: يرسم المعلم جدولًا: الأمة، نوع العذاب، ويطلب من المجموعات إكماله من الآيات، ويكمل الطالب الجدول: ثمود بالطاغية، عاد بالريح، فرعون بالأخذة الرابية (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ: يقسم المعلم الآيات (1–5) و(6–10) ويوجه للحفظ، ويحفظ الطالب ويسمع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. التلاوة النموذجية: يُسمع المعلم الآيات (11–18) ويبين تفخيم الراء المفتوحة في «ربك» و«تذكرة»، والساكنة بعد فتح في «عرش» و«الأرض»، ويستمع الطالب ويحدد حكم الراء في «ربك» و«عرش» (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. التلاوة الفردية: يستمع المعلم لقراءات فردية ويصحح النطق في «نفخة» و«دكتا»، ويقرأ الطالب ويصحح (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. ترتيب الأحداث: يوزع المعلم بطاقات أحداث يوم القيامة (النفخ، دك الأرض والجبال، انشقاق السماء، العرض) ويطلب ترتيبها حسب الآيات، ويرتب الطالب البطاقات ويقرأ الآية الدالة على كل حدث (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. الحفظ: يوجه المعلم لحفظ الآيات ويسمع، ويحفظ الطالب ويسمع (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n10. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم جدولًا فارغًا بعمودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق، ويتوقع الطالب ويدون (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويبين الوقف بهاء السكت في «كتابيه» و«حسابيه» و«ماليه» و«سلطانيه»، ويستمع الطالب ويطبق الوقف بالهاء (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الثنائية: يوزع الطلبة أزواجًا: أحدهما يقرأ آيات أصحاب اليمين والآخر آيات أصحاب الشمال، ويقرأ الطالب ويصحح لزميله (6 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n4. أقارن: يوجه المجموعات لإكمال جدول المقارنة: القول، المكان، الحال، ويكمل الطالب الجدول من الآيات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ: يقسم المعلم المقطع إلى (19–24) و(25–29) ويوجه للحفظ، ويحفظ الطالب ويسمع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. التلاوة النموذجية: يُسمع المعلم الآيات ويبين تفخيم الراء المفتوحة في «ذرعها» وإخفاء التنوين في «سلسلة ذرعها»، ويستمع الطالب ويحدد حكم الراء في «ذرعها» (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. التلاوة الجماعية والفردية: يقرأ المعلم مع الطلبة ثم يستمع لقراءات فردية، ويقرأ الطالب ويصحح (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. أسباب العذاب: يطرح المعلم مشكلة: لماذا استحق الكافر هذا العذاب؟ ويوجه لاستخراج السببين من الآيتين (33–34)، ويستخرج الطالب: عدم الإيمان بالله العظيم، وعدم الحض على طعام المسكين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. الحفظ: يوجه المعلم للحفظ ويسمع، ويحفظ الطالب ويسمع (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n10. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويقترح مبادرة صفية لإطعام المحتاجين، ويجيب الطالب ويشارك في الاقتراح (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟ ويعصف الطالب ذهنيًا بالإجابات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويبين تفخيم الراء في «رسول» لأنها مفتوحة وترقيقها في «شاعر» عند الوصل لأنها مكسورة، ويستمع الطالب ويطبق (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التلاوة الفردية: يستمع المعلم لقراءات فردية ويتابع تطبيق أحكام الراء، ويقرأ الطالب ويصحح (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. أدلة صدق القرآن: يناقش المعلم مع الطلبة نفي الشعر والكهانة والتقول، ويستخرج معهم أن القرآن تنزيل من رب العالمين، ويستخرج الطالب الأدلة ويكتبها في خريطة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ: يوجه المعلم للحفظ ويسمع، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n1. التهيئة: يتلو المعلم الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟ ويجيب الطالب ويتوقع سبب الختم بالتسبيح (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التلاوة والحفظ: يُسمع المعلم الآيات (48–52) ويوجه لحفظها سريعًا لقصرها، ويستمع الطالب ويحفظ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التسميع الشامل: يسمع المعلم السورة كاملة من الطلبة على مقاطع باستخدام بطاقة معايير التلاوة، ويسمع الطالب ويقيم نفسه (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات بأسئلة السورة على السبورة الذكية، ويشارك الطالب مع مجموعته (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويكرم المتقنين، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1:\nس1 (مستوى المعرفة): كم عدد آيات سورة الحاقة؟\nالإجابة: 52 آية.\n\nس2 (مستوى التطبيق): بمَ أهلكت ثمود؟\nالإجابة: بالطاغية وهي الصيحة الشديدة.\n\nس3 (مستوى الاستدلال): كيف صورت الآية 7 حال قوم عاد بعد هلاكهم؟\nالإجابة: صرعى كأنهم أعجاز نخل خاوية.\n\nس4 (مستوى المعرفة): ما المقصود بـ«الجارية» في الآية 11؟\nالإجابة: السفينة.\n\nس5 (مستوى التطبيق): ما أول أحداث يوم القيامة المذكورة في الآيات (13–18)؟\nالإجابة: النفخ في الصور نفخة واحدة.\n\nس6 (مستوى الاستدلال): ما دلالة قوله تعالى: «لا تخفى منكم خافية»؟\nالإجابة: أن الله يعلم كل شيء فلا يخفى عليه من أعمال العباد شيء.\n\nالحصة 2:\nس1 (مستوى المعرفة): ماذا يقول من أوتي كتابه بيمينه؟\nالإجابة: «هاؤم اقرءوا كتابيه».\n\nس2 (مستوى التطبيق): ما معنى «قطوفها دانية»؟\nالإجابة: ثمارها قريبة سهلة التناول.\n\nس3 (مستوى الاستدلال): ما الذي ندم عليه صاحب الشمال كما في الآيتين (28–29)؟\nالإجابة: أن ماله وسلطانه لم يغنيا عنه شيئًا.\n\nس4 (مستوى المعرفة): ما معنى «غسلين»؟\nالإجابة: صديد أهل النار.\n\nس5 (مستوى التطبيق): اذكر سببي عذاب الكافر كما في الآيتين (33–34).\nالإجابة: لا يؤمن بالله العظيم، ولا يحض على طعام المسكين.\n\nس6 (مستوى الاستدلال): لماذا قرن الله ترك الحض على إطعام المسكين بعدم الإيمان؟\nالإجابة: لعظم حق المسكين ولأن الرحمة بالفقراء من ثمار الإيمان.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما معنى «الوتين»؟\nالإجابة: عرق متصل بالقلب إذا قطع مات صاحبه.\n\nس2 (مستوى التطبيق): ما التهمتان اللتان نفتهما الآيتان (41–42) عن القرآن؟\nالإجابة: أنه قول شاعر، وأنه قول كاهن.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (44–47) على أن النبي صلى الله عليه وسلم لم يفترِ القرآن؟\nالإجابة: أنه لو تقول على الله لعاقبه الله وقطع منه الوتين ولم يمنعه أحد.\n\nالحصة 4:\nس1 (مستوى المعرفة): بمَ وصف القرآن في الآية 48؟\nالإجابة: بأنه تذكرة للمتقين.\n\nس2 (مستوى التطبيق): بمَ ختمت سورة الحاقة؟\nالإجابة: بالأمر بتسبيح الله: «فسبح باسم ربك العظيم».\n\nس3 (مستوى الاستدلال): لخص موضوعات سورة الحاقة في ثلاث نقاط.\nالإجابة: مصير الأمم المكذبة، أحداث القيامة وحال الفريقين، صدق القرآن الكريم.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: «وأما عاد فأهلكوا ...».\nالإجابة: «بريح صرصر عاتية».\n\nس2 (مستوى التطبيق): كم مدة الريح التي سخرت على عاد؟\nالإجابة: سبع ليال وثمانية أيام متتابعة.\n\nس3 (مستوى الاستدلال): ما العبرة التي تستفيدها من ذكر مصير الأمم المكذبة؟\nالإجابة: أن عاقبة التكذيب والمعصية الهلاك فأطيع الله ورسوله.\n\nس4 (مستوى المعرفة): أكمل: «يومئذ تعرضون ...».\nالإجابة: «لا تخفى منكم خافية».\n\nس5 (مستوى التطبيق): ما حكم الراء في كلمة «عرش»؟\nالإجابة: تفخيم، لأنها ساكنة بعد فتح.\n\nس6 (مستوى الاستدلال): كيف يؤثر الإيمان بالعرض على الله في سلوك الطالب أثناء الاختبار؟\nالإجابة: يجعله أمينًا لا يغش لعلمه أن الله مطلع عليه.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «فهو في عيشة ...».\nالإجابة: «راضية».\n\nس2 (مستوى التطبيق): اذكر نعمتين لأصحاب اليمين.\nالإجابة: جنة عالية، وقطوفها دانية.\n\nس3 (مستوى الاستدلال): ما الأعمال التي «أسلفتها» هذا الأسبوع وتتمنى أن تجدها في كتابك؟\nالإجابة: مثل: المحافظة على الصلاة وبر الوالدين ومساعدة زميل.\n\nس4 (مستوى المعرفة): أكمل: «إنه كان لا يؤمن ...».\nالإجابة: «بالله العظيم».\n\nس5 (مستوى التطبيق): كم ذراعًا طول السلسلة المذكورة في الآية 32؟\nالإجابة: سبعون ذراعًا.\n\nس6 (مستوى الاستدلال): اقترح عملًا تحض به غيرك على إطعام المسكين.\nالإجابة: مثل: الدعوة إلى حملة إفطار صائم أو التبرع بسلة غذائية.\n\nالحصة 3:\nس1 (مستوى المعرفة): أكمل: «تنزيل من ...».\nالإجابة: «رب العالمين».\n\nس2 (مستوى التطبيق): ما حكم الراء في كلمة «رسول»؟\nالإجابة: تفخيم لأنها مفتوحة.\n\nس3 (مستوى الاستدلال): كيف تدافع عن القرآن الكريم إذا سمعت من يشكك فيه؟\nالإجابة: أبين أنه تنزيل من رب العالمين وليس شعرًا ولا كهانة، وأستدل بالآيات.\n\nالحصة 4:\nس1 (مستوى المعرفة): اتلُ الآيات (48–52) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): ما معنى «حق اليقين»؟\nالإجابة: اليقين الثابت الذي لا شك فيه.\n\nس3 (مستوى الاستدلال): قيم تلاوتك للسورة وفق معايير الإتقان، واذكر ما تحتاج إلى تحسينه.\nالإجابة: يذكر الطالب مثلًا: إتقان الحفظ مع حاجة إلى ضبط الوقف بهاء السكت.", "الحصة 1:\n- للطالب: يحفظ الآيات (1–10) من سورة الحاقة\n- لولي الأمر: يستمع لتلاوة ابنه ويناقشه في قصص الأمم المذكورة\n- للطالب: يحفظ الآيات (11–18) ويراجع ما قبلها\n- لولي الأمر: يسمع من ابنه الآيات (1–18)\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2\n\nالحصة 2:\n- للطالب: يحفظ الآيات (19–29) ويطبق الوقف بهاء السكت\n- لولي الأمر: يناقش ابنه في الأعمال التي يحب أن يجدها في صحيفته\n- للطالب: يحفظ الآيات (30–37)\n- لولي الأمر: يشجع ابنه على المشاركة في عمل خيري لإطعام المحتاجين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2\n\nالحصة 3:\n- للطالب: يحفظ الآيات (38–47)\n- لولي الأمر: يستمع لتلاوة ابنه ويحاوره في عظمة القرآن\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2\n\nالحصة 4:\n- للطالب: يراجع سورة الحاقة كاملة وسورة المعارج\n- لولي الأمر: يستمع لتلاوة ابنه للسورتين ويشجعه على المراجعة الدورية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2"], "h": [["الدرس", "سورة الحاقة (تلاوة وحفظ)"], ["الوحدة", "مقرر التلاوة والحفظ"], ["صفحات كتاب الطالب", "15–21"], ["صفحات دليل المعلم", "26–28"], ["عدد الحصص", "6"]]}, {"id": "tafkhim", "t": "مقدمة في التفخيم والترقيق (تجويد)", "u": "الوحدة الأولى", "ps": [{"n": 1, "ax": "مفهوم التفخيم والترقيق + تصنيف الحروف من حيث التفخيم والترقيق", "h": [["الدرس", "مقدمة في التفخيم والترقيق (تجويد)"], ["الوحدة", "الوحدة الأولى"], ["الأسبوع والتاريخ", "الأسبوع الأول: 6–10/9/2026م"], ["صفحات كتاب الطالب", "22–23"], ["صفحات دليل المعلم", "29–33"], ["رقم الحصة", "1 من 3"], ["محور الحصة", "مفهوم التفخيم والترقيق"]], "f": ["1. يعرف التفخيم والترقيق لغة واصطلاحًا\n2. يميز بين الحرف المفخم والحرف المرقق عند السماع\n3. يعدد حروف الاستعلاء المفخمة دائمًا\n4. يصنف حروف اللغة العربية من حيث التفخيم والترقيق\n\nمخرج تعليمي آخر:\n5. يهتم بإتقان النطق الصحيح لحروف القرآن الكريم\n6. يحرص على تطبيق حكمي التفخيم والترقيق في أثناء التلاوة", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تذكر\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. الحوار والمناقشة\n4. التعلم التعاوني\n5. الخرائط المفاهيمية", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية\n4. السبورة الذكية\n5. أخرى: بطاقات الحروف", "- التفخيم: سمن يدخل على صوت الحرف فيمتلئ الفم بصداه\n- الترقيق: نحول يدخل على صوت الحرف فلا يمتلئ الفم بصداه\n- حروف الاستعلاء: خص ضغط قظ وهي مفخمة دائمًا\n- حروف الاستفال: باقي الحروف وهي مرققة\n- حروف تفخم أحيانًا وترقق أحيانًا: الراء ولام لفظ الجلالة والألف المدية والغنة", "ينطق المعلم أمام الطلبة كلمتي «سار» و«صار» ويسأل: ما الفرق بين الصوتين؟ وهل يتغير المعنى؟ ويستمع الطالب ويلاحظ امتلاء الفم بصوت الصاد ويذكر اختلاف المعنى.", "1. التهيئة: ينطق المعلم أمام الطلبة كلمتي «سار» و«صار» ويسأل: ما الفرق بين الصوتين؟ وهل يتغير المعنى؟ ويستمع الطالب ويلاحظ امتلاء الفم بصوت الصاد ويذكر اختلاف المعنى (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أكتشف المفهوم: يعرض أزواجًا من الكلمات (سيف وصيف، تين وطين، دليل وضليل) ويطلب من الطلبة نطقها وملاحظة حركة اللسان وامتلاء الفم، وينطق الطالب الكلمات ويستنتج الفرق بين الصوتين (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أصوغ التعريف: يوجه الطلبة لصياغة تعريف التفخيم والترقيق ثم يقارنه بتعريف الكتاب ص 22، ويصوغ الطالب التعريف بأسلوبه ثم يقرؤه من الكتاب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أستمع وأميز: يُسمع المعلم مقط  الحرف المفخم (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. أصنف الحروف: يوزع المعلم بطاقات الحروف على المجموعات ويطلب تصنيفها في ثلاث سلال: مفخمة دائمًا، مرققة دائمًا، تفخم وترقق، ويصنف الطالب الحروف مع مجموعته ويبرر التصنيف (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أتعاون مع زملائي: يعرض كلمات قرآنية من نشاط الكتاب ص 24 ويطلب استخراج الحروف المفخمة والمرققة منها في جدول، ويستخرج الطالب الحروف ويكمل الجدول (6 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n7. خريطة مفاهيمية: يبني المعلم مع الطلبة خريطة للأقسام الثلاثة مع أمثلة من سورة المعارج، ويكمل الطالب الخريطة بأمثلة من حفظه (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. التهيئة: ينطق المعلم «قال» ثم «قِيل» ويسأل: في أي الكلمتين كان التفخيم أقوى؟ ويقارن الطالب ويستنتج أن التفخيم يتفاوت بحسب الحركة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أقرأ وأستخرج: يقرأ المعلم بيتي النشاط في الكتاب ص 25 ويناقش ترتيب المراتب الخمس بأمثلة: طائفة، صبر، قتل، أقرب، قيل، ويستخرج الطالب المراتب ويرتبها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. سلم المراتب: يرسم المعلم سلمًا من خمس درجات ويطلب من الطلبة وضع بطاقات الكلمات القرآنية على الدرجة المناسبة، ويضع الطالب الكلمة في مرتبتها ويعلل (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية بأسئلة الدرس، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1:\nس1 (مستوى المعرفة): ما التفخيم؟\nالإجابة: سمن يدخل على صوت الحرف فيمتلئ الفم بصداه.\n\nس2 (مستوى التطبيق): أي الحرفين مفخم: السين أم الصاد؟\nالإجابة: الصاد.\n\nس3 (مستوى الاستدلال): علل: تغير معنى كلمة «سار» عند نطقها «صار».\nالإجابة: لأن الصاد حرف مفخم يختلف عن السين المرققة، فإبدال أحدهما بالآخر يغير الكلمة ومعناها.\n\nس4 (مستوى المعرفة): عدد حروف الاستعلاء.\nالإجابة: خ، ص، ض، غ، ط، ق، ظ ويجمعها قولنا: خص ضغط قظ.\n\nس5 (مستوى التطبيق): صنف الحروف الآتية إلى مفخمة ومرققة: ق، س، ط، ب.\nالإجابة: مفخمة: ق، ط. مرققة: س، ب.\n\nس6 (مستوى الاستدلال): اذكر الحروف التي تفخم أحيانًا وترقق أحيانًا.\nالإجابة: الراء، ولام لفظ الجلالة، والألف المدية، والغنة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما أعلى مراتب التفخيم؟\nالإجابة: الحرف المفتوح الذي بعده ألف مثل «قال».\n\nس2 (مستوى التطبيق): رتب الكلمات الآتية حسب قوة التفخيم: قِيل، قَال، قُتل.\nالإجابة: قال، ثم قتل، ثم قيل.\n\nس3 (مستوى الاستدلال): لماذا كان المكسور أدنى مراتب التفخيم؟\nالإجابة: لأن الكسرة تنزل باللسان فيضعف امتلاء الفم بالصوت.", "الحصة 1:\nس1 (مستوى المعرفة): ما الترقيق؟\nالإجابة: نحول يدخل على صوت الحرف فلا يمتلئ الفم بصداه.\n\nس2 (مستوى التطبيق): انطق كلمتي «تين» و«طين» وبين الحرف المفخم.\nالإجابة: الطاء في «طين» مفخمة والتاء في «تين» مرققة.\n\nس3 (مستوى الاستدلال): ما أثر الخطأ في التفخيم والترقيق على قراءة القرآن الكريم؟\nالإجابة: قد يغير المعنى ويخل بصحة التلاوة، لذا يجب الحرص على إتقانه.\n\nس4 (مستوى المعرفة): هل الخاء حرف مفخم أم مرقق؟\nالإجابة: مفخم دائمًا لأنه من حروف الاستعلاء.\n\nس5 (مستوى التطبيق): استخرج حرفًا مفخمًا وآخر مرققًا من كلمة «قريبا».\nالإجابة: القاف مفخمة، والباء مرققة.\n\nس6 (مستوى الاستدلال): صمم بطاقة تعليمية تساعد زملاءك على حفظ أقسام الحروف من حيث التفخيم والترقيق.\nالإجابة: بطاقة تتضمن «خص ضغط قظ» للمفخمة، والحروف المتغيرة الأربعة، وأمثلة لكل قسم.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر مراتب التفخيم الخمس مرتبة.\nالإجابة: المفتوح بعده ألف، المفتوح ليس بعده ألف، المضموم، الساكن، المكسور.\n\nس2 (مستوى التطبيق): في أي مرتبة تفخم الصاد في كلمة «صبرا»؟\nالإجابة: المرتبة الثانية: مفتوح ليس بعده ألف.\n\nس3 (مستوى الاستدلال): استخرج من سورة المعارج كلمتين تمثلان مرتبتين مختلفتين وحدد مرتبتيهما.\nالإجابة: مثل: «واقع» القاف مكسورة في المرتبة الخامسة، «قريبا» القاف مفتوحة ليس بعدها ألف في المرتبة الثانية.", "الحصة 1:\n- للطالب: يراجع تعريفي التفخيم والترقيق ص 22 ويكتب أزواج كلمات يتغير معناها بالتفخيم\n- لولي الأمر: يساعد ابنه على نطق  بهما", "يعرض المعلم صورة لابن يقبّل يد أمه ويسأل: ماذا يعبر هذا الموقف؟ وما الحقوق التي نعرفها للوالدين؟ ويصف الطالب الموقف ويذكر بعض حقوق الوالدين.", "1. التهيئة: يعرض المعلم صورة لابن يقبّل يد أمه ويسأل: ماذا يعبر هذا الموقف؟ وما الحقوق التي نعرفها للوالدين؟ ويصف الطالب الموقف ويذكر بعض حقوق الوالدين (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم التلاوة النموذجية للآيات (23–30) ثم يقرأ بنفسه، ويستمع الطالب ويتابع في الكتاب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الجماعية والفردية: ينظم المعلم القراءة الجماعية ثم الفردية ويصحح الأخطاء، ويقرأ الطالب ويصحح لنفسه ولزملائه (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتعرف المعنى: يوزع المعلم المفردات على المجموعات لاستخراج معانيها من الكتاب ص 28 ثم تعرضها كل مجموعة، ويستخرج الطالب المعاني ويعرضها (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أستخلص الصور: يوجه المجموعات لاستخراج صور الإحسان من الآيتين في خريطة: النهي عن «أف»، عدم النهر، القول الكريم، خفض الجناح، الدعاء، ويستخرج الطالب الصور ويعرضها (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. أعلل: يطرح المعلم سؤال الكتاب: علل تخصيص الكبر بالذكر، ويدير نقاشًا حول ضعف الوالدين وحاجتهما، ويعلل الطالب ويناقش (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n7. بطاقات المواقف: يوزع المعلم مواقف (أب يطلب مساعدة، أم مريضة...) ويطلب تحديد السلوك البار في كل موقف، ويحدد الطالب السلوك المناسب ويستدل بالآية (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "س1 (مستوى المعرفة): ما معنى «أف»؟\nالإجابة: كلمة تدل على التضجر.\n\nس2 (مستوى التطبيق): ما معنى «ولا تبسطها كل البسط»؟\nالإجابة: لا تسرف في الإنفاق.\n\nس3 (مستوى الاستدلال): «ولا تجعل يدك مغلولة إلى عنقك»: إلامَ ترمز اليد المغلولة؟\nالإجابة: ترمز إلى البخل والإمساك عن الإنفاق.\n\nس4 (مستوى المعرفة): ما الدعاء الذي علمنا الله إياه للوالدين في الآية 24؟\nالإجابة: «رب ارحمهما كما ربياني صغيرا».\n\nس5 (مستوى التطبيق): اذكر صورتين قبّل يد أمه ويسأل: ماذا يعبر هذا الموقف؟ وما الحقوق التي نعرفها للوالدين؟ ويصف الطالب الموقف ويذكر بعض حقوق الوالدين (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم التلاوة النموذجية للآيات (23–30) ثم يقرأ بنفسه، ويستمع الطالب ويتابع في الكتاب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الجماعية والفردية: ينظم المعلم القراءة الجماعية ثم الفردية ويصحح الأخطاء، ويقرأ الطالب ويصحح لنفسه ولزملائه (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتعرف المعنى: يوزع المعلم المفردات على المجموعات لاستخراج معانيها من الكتاب ص 28 ثم تعرضها كل مجموعة، ويستخرج الطالب المعاني ويعرضها (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أستخلص الصور: يوجه المجموعات لاستخراج صور الإحسان من الآيتين في خريطة: النهي عن «أف»، عدم النهر، القول الكريم، خفض الجناح، الدعاء، ويستخرج الطالب الصور ويعرضها (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. أعلل: يطرح المعلم سؤال الكتاب: علل تخصيص الكبر بالذكر، ويدير نقاشًا حول ضعف الوالدين وحاجتهما، ويعلل الطالب ويناقش (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n7. بطاقات المواقف: يوزع المعلم مواقف (أب يطلب مساعدة، أم مريضة...) ويطلب تحديد السلوك البار في كل موقف، ويحدد الطالب السلوك المناسب ويستدل بالآية (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم الرسم الإحصائي لميزانية أسرة خالد من نشاط الكتاب ص 31 ويسأل: ما الذي يلفت نظرك؟ ويلاحظ الطالب ارتفاع نسبة الكماليات وانعدام الادخار (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل المشكلة: يوجه المجموعات لتحديد مشكلة أسرة خالد وتخيل أثرها في المجتمع واقتراح حلول، ويحدد الطالب المشكلة: الإسراف وعدم الادخار، ويقترح حلولًا كوضع ميزانية والادخار (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستخلص الوصايا: يناقش المعلم الآيات (26–30): حق ذي القربى والمسكين وابن السبيل، النهي عن التبذير، القول الميسور، التوسط في الإنفاق، ويستخلص الطالب الوصا \n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. التعلم بالاكتشاف\n5. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. أخرى: بطاقات المواقف", "- النيات: جمع نية وهي قصد الإنسان المقترن بفعله\n- الراوي: الصحابي الذي نقل الحديث عن النبي صلى الله عليه وسلم\n- النية الصالحة: قصد وجه الله تعالى بالعمل\n- ثواب العمل: يكون بحسب نية صاحبه", "يعرض المعلم صورة نشاط «أتأمل وأناقش»: رجل يشتري سلال الرطب كلها، ويسأل: لماذا اشترى الرجل السلال كلها؟ ويتأمل الطالب ويجيب: رغبة في مساعدة البائع وجبر خاطره وطلب الأجر.", "1. التهيئة: يعرض المعلم صورة نشاط «أتأمل وأناقش»: رجل يشتري سلال الرطب كلها، ويسأل: لماذا اشترى الرجل السلال كلها؟ ويتأمل الطالب ويجيب: رغبة في مساعدة البائع وجبر خاطره وطلب الأجر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أفهم وأحفظ: يعرض المعلم الحديث الشريف مضبوطًا ويقرؤه قراءة نموذجية: «الأعمال بالنيات، ولكل امرئ ما نوى»، ويستمع الطالب ويتابع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. القراءة الفردية: يطلب المعلم قراءات فردية ويصحح بأسلوب التعلم بالأقران، ويقرأ الطالب ويصحح لزميله (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتعرف الراوي: يوجه المعلم لقراءة الإضاءة عن الصحابي عبد الله بن عباس رضي الله عنهما وسند الحديث في مسند الإمام الربيع بن حبيب ثم يطرح أسئلة، ويقرأ الطالب الإضاءة ويستخرج معلومات عن الراوي (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أقرأ وأفهم: يوجه المعلم لقراءة فقرة المعنى الإجمالي في الكتاب ص 34 ويناقشها، ويقرأ الطالب ويلخص المعنى الإجمالي (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أكتشف أثر النية: يوزع المعلم بطاقات مواقف (عمل واحد بنيتين مختلفتين) ويطلب من المجموعات بيان أثر النية في الحكم والثواب، ويحلل الطالب المواقف ويستنتج أثر النية (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n7. أربط: يعرض المعلم على السبورة الذكية مخططًا: نية صالحة + عمل صالح = عمل مقبول، ويناقش العلاقة، ويكمل الطالب المخطط بأمثلة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "س1 (مستوى ال ار النية قبل أعماله اليومية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=5"]}], "c": ["الحصة 1:\n1. يقرأ الحديث الشريف قراءة صحيحة\n2. يتعرف راوي الحديث الشريف\n3. يفهم المعنى الإجمالي للحديث الشريف\n4. يبين العلاقة بين النية والعمل\n5. يستنتج أثر النية في العمل\n\nمخرج تعليمي آخر:\n6. يحب الصحابة الكرام ويقتدي بهم\n7. يراجع نيته قبل أعماله\n\nالحصة 2:\n1. يبين كيفية تحويل العادات إلى عبادات\n2. يحفظ الحديث الشريف حفظًا متقنًا\n\nمخرج تعليمي آخر:\n3. يخلص النية لله تعالى في أعماله", "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تقييم\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج 7: تقييم\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "الحصة 1:\n1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. التعلم بالاكتشاف\n5. العصف الذهني\n\nالحصة 2:\n1. التعلم الذاتي\n2. التعلم المبني على اللعب\n3. التعلم التعاوني", "الحصة 1:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. أخرى: بطاقات المواقف\n\nالحصة 2:\n1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1:\n- النيات: جمع نية وهي قصد الإنسان المقترن بفعله\n- الراوي: الصحابي الذي نقل الحديث عن النبي صلى الله عليه وسلم\n- النية الصالحة: قصد وجه الله تعالى بالعمل\n- ثواب العمل: يكون بحسب نية صاحبه\n\nالحصة 2:\n- العادة: عمل يومي مباح كالأكل والنوم\n- العبادة: كل ما يحبه الله من الأقوال والأفعال\n- الإخلاص: إفراد الله بالقصد في الطاعة", "الحصة 1:\nيعرض المعلم صورة نشاط «أتأمل وأناقش»: رجل يشتري سلال الرطب كلها، ويسأل: لماذا اشترى الرجل السلال كلها؟ ويتأمل الطالب ويجيب: رغبة في مساعدة البائع وجبر خاطره وطلب الأجر.\n\nالحصة 2:\nيسأل المعلم: هل يمكن أن يؤجر الإنسان على نومه وأكله؟ وكيف؟ ويعصف الطالب ذهنيًا ويقترح.", "الحصة 1 — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم صورة نشاط «أتأمل وأناقش»: رجل يشتري سلال الرطب كلها، ويسأل: لماذا اشترى الرجل السلال كلها؟ ويتأمل الطالب ويجيب: رغبة في مساعدة البائع وجبر خاطره وطلب الأجر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أفهم وأحفظ: يعرض المعلم الحديث الشريف مضبوطًا ويقرؤه قراءة نموذجية: «الأعمال بالنيات، ولكل امرئ ما نوى»، ويستمع الطالب ويتابع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. القراءة الفردية: يطلب المعلم قراءات فردية ويصحح بأسلوب التعلم بالأقران، ويقرأ الطالب ويصحح لزميله (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتعرف الراوي: يوجه المعلم لقراءة الإضاءة عن الصحابي عبد الله بن عباس رضي الله عنهما وسند الحديث في مسند الإمام الربيع بن حبيب ثم يطرح أسئلة، ويقرأ الطالب الإضاءة ويستخرج معلومات عن الراوي (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أقرأ وأفهم: يوجه المعلم لقراءة فقرة المعنى الإجمالي في الكتاب ص 34 ويناقشها، ويقرأ الطالب ويلخص المعنى الإجمالي (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أكتشف أثر النية: يوزع المعلم بطاقات مواقف (عمل واحد بنيتين مختلفتين) ويطلب من المجموعات بيان أثر النية في الحكم والثواب، ويحلل الطالب المواقف ويستنتج أثر النية (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n7. أربط: يعرض المعلم على السبورة الذكية مخططًا: نية صالحة + عمل صالح = عمل مقبول، ويناقش العلاقة، ويكمل الطالب المخطط بأمثلة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. التهيئة: يسأل المعلم: هل يمكن أن يؤجر الإنسان على نومه وأكله؟ وكيف؟ ويعصف الطالب ذهنيًا ويقترح (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أحول العادة: يعرض المعلم قائمة عادات (النوم، الأكل، ممارسة الرياضة، الدراسة) ويطلب كتابة نية تحول كل منها إلى عبادة، ويكتب الطالب نية لكل عادة ويعرضها (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. أحفظ الحديث: يوجه المعلم لحفظ الحديث ثم يسمعه من الطلبة، ويحفظ الطالب ويسمع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية بأسئلة الدرس، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1:\nس1 (مس ل بنية التقوي، مساعدة الأم بنية البر.", "الحصة 1:\n- للطالب: يقرأ الحديث ص 33 ويبدأ حفظه\n- لولي الأمر: يستمع لقراءة ابنه للحديث\n- للطالب: يكمل حفظ الحديث ويحل نشاط ص 35\n- لولي الأمر: يحاور ابنه في نيته عند أداء واجباته\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=5\n\nالحصة 2:\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 37 ويطبق خطة النية\n- لولي الأمر: يذكر ابنه باستحضار النية قبل أعماله اليومية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=5"], "h": [["الدرس", "الأعمال بالنيات (حديث شريف)"], ["الوحدة", "الوحدة الأولى"], ["صفحات كتاب الطالب", "33–37"], ["صفحات دليل المعلم", "42–47"], ["عدد الحصص", "3"]]}, {"id": "wahhab", "t": "الله «الوهاب» (عقيدة)", "u": "الوحدة الأولى", "ps": [{"n": 1, "ax": "معنى اسم الله الوهاب والاستدلال عليه + هبات الله تعالى والتمثل بالاسم وشكره", "h": [["الدرس", "الله «الوهاب» (عقيدة)"], ["الوحدة", "الوحدة الأولى"], ["الأسبوع والتاريخ", "الأسبوع الثالث: 20–24/9/2026م"], ["صفحات كتاب الطالب", "38–39"], ["صفحات دليل المعلم", "48–51"], ["رقم الحصة", "1 من 2"], ["محور الحصة", "معنى اسم الله الوهاب والاستدلال عليه"]], "f": ["1. يتعرف معنى اسم الله الوهاب\n2. يستدل من القرآن الكريم على اسم الله الوهاب\n3. يعدد بعض هبات الله تعالى\n4. يتمثل اسم الله الوهاب في واقع حياته\n\nمخرج تعليمي آخر:\n5. يحب الله تعالى لكثرة هباته\n6. يشكر الله تعالى على هباته", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. التعلم المبني على المشاريع\n5. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. عروض تقديمية\n4. صورة توضيحية\n5. أخرى: أوراق ملاحظات لاصقة", "- الوهاب: كثير الهبات الذي يعطي بلا عوض ولا غرض\n- الهبة: العطية بلا مقابل\n- هبات الله: الهداية والعقل والصحة والذرية والرزق\n- التمثل بالاسم: أن يكون المسلم كريمًا معطاءً\n- الشكر: الاعتراف بالنعمة واستعمالها في طاعة الله", "يسأل المعلم: ما أجمل هدية تلقيتها؟ ومن أعطاك إياها؟ ثم يسأل: من أعطاك السمع والبصر والعقل؟ ويجيب الطالب ويستنتج أن الله هو المعطي الأعظم.", "1. التهيئة: يسأل المعلم: ما أجمل هدية تلقيتها؟ ومن أعطاك إياها؟ ثم يسأل: من أعطاك السمع والبصر والعقل؟ ويجيب الطالب ويستنتج أن الله هو المعطي الأعظم (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أفهم المعنى: يعرض المعلم المعنى اللغوي والاصطلاحي لاسم الوهاب ويقارن بين هبة الله وهبة البشر، ويقارن الطالب ويستنتج أن هبة الله بلا مقابل ولا حاجة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستدل: يوزع المعلم على المجموعات آيات: آل عمران 8، ص 9، ص 35، ويطلب استخراج موضع اسم الوهاب ومن الداعي به، ويستخرج الطالب الدليل ويعرضه (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتأمل الدعاء: يناقش المعلم دعاء الراسخين في العلم: «ربنا لا تزغ قلوبنا بعد إذ هديتنا وهب لنا من لدنك رحمة إنك أنت الوهاب»، ويحفظ الطالب الدعاء ويبين ما طلبوه (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. شجرة الهبات: يرسم المعلم شجرة على السبورة ويطلب من كل طالب كتابة هبة على ورقة لاصقة وتعليقها، ويكتب الطالب هبة ويعلقها ويقرأ ما كتبه زملاؤه (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n6. أتمثل الاسم: يناقش المعلم كيف يتمثل المسلم اسم الوهاب: الكرم، الهدية، التعليم، العطاء للمحتاج، ويقترح الطالب سلوكيات للتمثل بالاسم (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n7. مشروع صغير: يكلف المجموعات بتصميم مبادرة عطاء صفية (هدية لعامل المدرسة، مكتبة متبادلة)، ويخطط الطالب المبادرة مع مجموعته ويعرضها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "س1 (مستوى المعرفة): ما معنى اسم الله الوهاب؟\nالإجابة: كثير الهبات الذي يعطي بلا عوض ولا غرض.\n\nس2 (مستوى التطبيق): اذكر آية ورد فيها اسم الله الوهاب.\nالإجابة: «وهب لنا من لدنك رحمة إنك أنت الوهاب» آل عمران 8.\n\nس3 (مستوى الاستدلال): ما الفرق بين هبة الله وهبة البشر؟\nالإجابة: هبة الله دائمة بلا عوض ولا حاجة، وهبة البشر محدودة وقد ترجو مقابلًا.\n\nس4 (مستوى المعرفة): عدد ثلاثًا من هبات الله تعالى.\nالإجابة: الهداية، العقل، الصحة.\n\nس5 (مستوى التطبيق): كيف تشكر الله على نعمة البصر؟\nالإجابة: باستعماله في طاعة الله وغضه عن الحرام.\n\nس6 (مستوى الاستدلال): ما الفرق بين التمثل باسم الوهاب والاتصاف به على الكمال؟\nالإجابة: الكمال لله وحده، والمسلم يتمثل الاسم بالكرم والعطاء قدر استطاعته.", "س1 (مستوى المعرفة): أكمل: «ربنا لا تزغ قلوبنا بعد إذ هديتنا وهب لنا ...».\nالإجابة: «من لدنك رحمة إنك أنت الوهاب».\n\nس2 (مستوى التطبيق): ماذا طلب الراسخون في العلم من الله الوهاب؟\nالإجابة: الثبات على الهداية والرحمة.\n\nس3 (مستوى الاستدلال): لماذا يناسب التوسل باسم الوهاب عند طلب الهداية؟\nالإجابة: لأن الهداية هبة من الله لا يملكها غيره.\n\nس4 (مستوى المعرفة): اذكر هبة من هبات الله ورد ذكرها في الدرس.\nالإجابة: الذرية، والرحمة، والهداية.\n\nس5 (مستوى التطبيق): كيف تتمثل اسم الله الوهاب مع زملائك؟\nالإجابة: بمساعدتهم وإهدائهم ومشاركتهم ما أعرف.\n\nس6 (مستوى الاستدلال): اقترح مبادرة تتمثل فيها اسم الوهاب في حيك.\nالإجابة: مثل: جمع الملابس والكتب المستعملة وإهداؤها للمحتاجين.", "- للطالب: يحفظ دعاء آل عمران 8 ويقرأ ص 38–39\n- لولي الأمر: يردد مع ابنه دعاء الثبات على الهداية\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 41 وينفذ مبادرة العطاء\n- لولي الأمر: يشارك ابنه تنفيذ مبادرة عطاء أسرية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=6"]}], "c": ["الحصة 1:\n1. يتعرف معنى اسم الله الوهاب\n2. يستدل من القرآن الكريم على اسم الله الوهاب\n3. يعدد بعض هبات الله تعالى\n4. يتمثل اسم الله الوهاب في واقع حياته\n\nمخرج تعليمي آخر:\n5. يحب الله تعالى لكثرة هباته\n6. يشكر الله تعالى على هباته", "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الحصة 1:\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الحوار والمناقشة\n4. التعلم المبني على المشاريع\n5. العصف الذهني", "الحصة 1:\n1. الكتاب\n2. السبورة الذكية\n3. عروض تقديمية\n4. صورة توضيحية\n5. أخرى: أوراق ملاحظات لاصقة", "الحصة 1:\n- الوهاب: كثير الهبات الذي يعطي بلا عوض ولا غرض\n- الهبة: العطية بلا مقابل\n- هبات الله: الهداية والعقل والصحة والذرية والرزق\n- التمثل بالاسم: أن يكون المسلم كريمًا معطاءً\n- الشكر: الاعت ك»، «نظافة الحافلة مسؤوليتك»، «ردد دعاء السفر».", "الحصة 1:\n- للطالب: يحفظ دعاء السفر ويقرأ ص 51–53\n- لولي الأمر: يذكر ابنه بدعاء السفر عند الخروج مع الأسرة\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 56–57\n- لولي الأمر: يناقش مع ابنه آداب السفر قبل رحلة الأسرة القادمة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=9"], "h": [["الدرس", "آداب السفر (قيم وأخلاق)"], ["الوحدة", "الوحدة الأولى"], ["صفحات كتاب الطالب", "51–57"], ["صفحات دليل المعلم", "63–68"], ["عدد الحصص", "2"]]}, {"id": "alif", "t": "الألف المدية والغنة (تجويد)", "u": "الوحدة الثانية", "ps": [{"n": 1, "ax": "الألف المدية: حكمها من حيث التفخيم والترقيق + الغنة: حكمها من حيث التفخيم والترقيق", "h": [["الدرس", "الألف المدية والغنة (تجويد)"], ["الوحدة", "الوحدة الثانية"], ["الأسبوع والتاريخ", "الأسبوع الخامس: 4–8/10/2026م"], ["صفحات كتاب الطالب", "58–59"], ["صفحات دليل المعلم", "69–73"], ["رقم الحصة", "1 من 4"], ["محور الحصة", "الألف المدية: حكمها من حيث التفخيم والترقيق"]], "f": ["1. يتعرف الألف المدية\n2. يستنتج حكم الألف المدية من حيث التفخيم والترقيق\n3. يتعرف الغنة\n4. يستنتج حكم الغنة من حيث التفخيم والترقيق\n\nمخرج تعليمي آخر:\n5. يهتم بالنطق الصحيح للمد في تلاوته\n6. يقدر دقة أحكام التجويد في حفظ القرآن", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تذكر\nالمخرج 5: فهم\nالمخرج 6: تقييم", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. الحوار والمناقشة\n4. التعلم التعاوني\n5. الخرائط المفاهيمية", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية", "- الألف المدية: ألف ساكنة قبلها حرف مفتوح\n- حكمها: تتبع ما قبلها تفخيمًا وترقيقًا\n- الغنة: صوت أغن يخرج من الخيشوم\n- حكمها في الإخفاء: تفخم إذا جاء بعدها حرف مفخم، وترقق إذا جاء بعدها حرف مرقق", "ينطق كلمتي «قال» و«كان» ويسأل: هل نطقت الألف فيهما بالطريقة نفسها؟ ويقارن الطالب ويلاحظ امتلاء الفم في «قال».", "1. التهيئة: ينطق كلمتي «قال» و«كان» ويسأل: هل نطقت الألف فيهما بالطريقة نفسها؟ ويقارن الطالب ويلاحظ امتلاء الفم في «قال» (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أكتشف الحكم: يعرض كلمات: طائفة، خاوية، صرعى، سائل، كانوا، الناس، ويطلب ملاحظة الحرف الذي قبل الألف، ويلاحظ الطالب أن الألف تفخم بعد الحرف المفخم وترقق بعد المرقق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أصوغ القاعدة: يقود الطلبة لصياغة القاعدة: الألف المدية تتبع ما قبلها، ويصوغ الطالب القاعدة ويقرؤها من الكتاب ص 58 (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أستخرج من المصحف: يوجه المجموعات لاستخراج ثلاث ألفات مفخمة وثلاث مرققة من سورة المعارج، ويستخرج الطالب الكلمات ويعلل الحكم (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. أكتشف: يُسمع كلمات: ينصرون، منضود، انطلقوا، منكم، أنتم، ويطلب ملاحظة الحرف بعد النون، ويلاحظ الطالب تفخيم الغنة قبل حروف الاستعلاء وترقيقها قبل غيرها (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. خريطة الحكم: يبني المعلم مع الطلبة خريطة مقارنة: الألف المدية تتبع ما قبلها، والغنة في الإخفاء تتبع ما بعدها، ويكمل الطالب الخريطة بأمثلة (6 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n7. أطبق: يوزع كلمات قرآنية على المجموعات لتحديد حكم الغنة فيها مع التعليل، ويحدد الطالب الحكم ويعلل (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "س1 (مستوى المعرفة): متى تكون الألف مدية؟\nالإجابة: إذا كانت ساكنة وقبلها حرف مفتوح.\n\nس2 (مستوى التطبيق): ما حكم الألف في كلمة «الطاغية»؟ ولماذا؟\nالإجابة: مفخمة لأنها جاءت بعد الطاء المفخمة.\n\nس3 (مستوى الاستدلال): لماذا رققت الألف في «سائل» وفخمت في «طائفة»؟\nالإجابة: لأنها في «سائل» بعد السين المرققة، وفي «طائفة» بعد الطاء المفخمة، والألف المدية تتبع ما قبلها.\n\nس4 (مستوى المعرفة): ما الغنة؟\nالإجابة: صوت أغن يخرج من الخيشوم.\n\nس5 (مستوى التطبيق): ما حكم الغنة في كلمة «ينصرون»؟\nالإجابة: مفخمة لأن بعدها الصاد المفخمة.\n\nس6 (مستوى الاستدلال): ما الفرق بين حكم الألف المدية وحكم الغنة من حيث التبعية؟\nالإجابة: الألف تتبع ما قبلها، والغنة تتبع ما بعدها.", "س1 (مستوى المعرفة): ما حكم الألف المدية؟\nالإجابة: تتبع ما قبلها تفخيمًا وترقيقًا.\n\nس2 (مستوى التطبيق): حدد حكم الألف في كلمة «خاوية».\nا برب المشارق والمغارب إنا لقادرون» ويسأل: أين الألف المدية؟ وما حكمها؟ ويستخرج الطالب «المشارق» و«المغارب» و«لقادرون» ويحدد الحكم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أقرأ وأطبق: يقرأ المعلم آيات من الكتاب ص 60 قراءة نموذجية مبرزًا الحكمين، ويكرر الطالب القراءة مطبقًا الحكمين (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. صيد الكلمات: يوزع المعلم على كل مجموعة آيات ويطلب صيد أكبر عدد من الكلمات فيها ألف مدية أو غنة وتحديد الحكم، ويصيد الطالب الكلمات مع مجموعته ويعلل (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n1. التهيئة: يُسمع المعلم تسجيلين لقارئين أحدهما يطبق الحكمين والآخر يخطئ، ويسأل: أيهما أصح؟ ولماذا؟ ويقارن الطالب ويحدد مواضع الخطأ (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أقيم تعلمي: يوجه المعلم لحل أسئلة «أقيم تعلمي» ص 62 فرديًا ثم يناقش الإجابات، ويحل الطالب الأسئلة ويصحح ذاتيًا (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تسجيل وتقييم: يطلب المعلم من الطلبة أزواجًا قراءة آيتين وتقييم بعضهم ببطاقة التقييم، ويقرأ الطالب ويقيم زميله بالبطاقة (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n4. معالجة الأخطاء: يعالج المعلم الأخطاء الشائعة الملحوظة بتكرار النطق الصحيح جماعيًا، ويكرر الطالب النطق الصحيح (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "الحصة 1:\nس1 (مستوى المعرفة): متى تكون الألف مدية؟\nالإجابة: إذا كانت ساكنة وقبلها حرف مفتوح.\n\nس2 (مستوى التطبيق): ما حكم الألف في كلمة «الطاغية»؟ ولماذا؟\nالإجابة: مفخمة لأنها جاءت بعد الطاء المفخمة.\n\nس3 (مستوى الاستدلال): لماذا رققت الألف في «سائل» وفخمت في «طائفة»؟\nالإجابة: لأنها في «سائل» بعد السين المرققة، وفي «طائفة» بعد الطاء المفخمة، والألف المدية تتبع ما قبلها.\n\nس4 (مستوى المعرفة): ما الغنة؟\nالإجابة: صوت أغن يخرج من الخيشوم.\n\nس5 (مستوى التطبيق): ما حكم الغنة في كلمة «ينصرون»؟\nالإجابة: مفخمة لأن بعدها الصاد المفخمة.\n\nس6 (مستوى الاستدلال): ما الفرق بين حكم الألف المدية وحكم الغنة من حيث التبعية؟\nالإجابة: الألف تتبع ما قبلها، والغنة تتبع ما بعدها.\n\nالحصة 2:\nس1 (مستوى المعرفة): حدد حكم الألف في «لقادرون».\nالإجابة: مفخمة لأنها بعد القاف.\n\nس2 (مستوى التطبيق): اقرأ «إنهم يرونه بعيدا ونراه قريبا» مطبقًا حكم الألف في «ونراه».\nالإجابة: تفخم الألف بعد الراء المفتوحة.\n\nس3 (مستوى الاستدلال): كلمة «انطلقوا»: حدد حكم الغنة فيها وعلله.\nالإجابة: مفخمة لأن بعد النون الساكنة حرف الطاء المفخم.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما حكم الألف المدية في «الصالحات»؟\nالإجابة: مفخمة في «الصا» لأنها بعد الصاد، ومرققة في «حات» لأنها بعد الحاء.\n\nس2 (مستوى التطبيق): ما حكم الغنة في «من ضيق»؟\nالإجابة: مفخمة لأن بعدها الضاد المفخمة.\n\nس3 (مستوى الاستدلال): قيم قراءة زميلك لكلمة «فانطلقوا» إذا رقق الغنة.\nالإجابة: قراءة خاطئة، والصواب تفخيم الغنة لأن بعدها الطاء.", "الحصة 1:\nس1 (مستوى المعرفة): ما حكم الألف المدية؟\nالإجابة: تتبع ما قبلها تفخيمًا وترقيقًا.\n\nس2 (مستوى التطبيق): حدد حكم الألف في كلمة «خاوية».\nالإجابة: مفخمة لأنها بعد الخاء.\n\nس3 (مستوى الاستدلال): صنف الكلمات: قال، الناس، طال، كانوا.\nالإجابة: مفخمة: قال، طال. مرققة: الناس، كانوا.\n\nس4 (مستوى المعرفة): من أين تخرج الغنة؟\nالإجابة: من الخيشوم.\n\nس5 (مستوى التطبيق): حدد حكم الغنة في «منكم».\nالإجابة: مرققة لأن بعدها الكاف المرققة.\n\nس6 (مستوى الاستدلال): هات مثالًا من القرآن لغنة مفخمة وآخر لغنة مرققة.\nالإجابة: مفخمة: «انطلقوا»، مرققة: «أنتم».\n\nالحصة 2:\nس1 (مستوى المعرفة): ما حكم الألف في «الأجداث»؟\nالإجابة: مرققة لأنها بعد الدال المرققة.\n\nس2 (مستوى التطبيق): اقرأ «ينصرون» مطبقًا حكم الغنة.\nالإجابة: يقرؤها بغنة مفخمة.\n\nس3 (مستوى الاستدلال): استخرج من سورة يس (20–30) كلمة فيها ألف مدية مفخمة وأخرى مرققة.\nالإجابة: مفخمة: «خامدون» لأنها بعد الخاء المفخمة، ومرققة: «آلهة» لأنها بعد اللام المرققة.\n\nالحصة 3:\nس1 (مستوى المعرفة): علل: فخمت الألف في «طاعة».\nالإجابة: بآيتها، ويربط الطالب الحجة بالآية ويشرحها (6 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n7. لعب أدوار: يكلف طالبين بتمثيل حوار دعوي هادئ مستفيدين من أسلوب الرجل المؤمن، ويمثل الطالب الحوار ويقيمه زملاؤه (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. التهيئة: يقرأ المعلم قوله تعالى «قيل ادخل الجنة قال يا ليت قومي يعلمون» ويسأل: ماذا تمنى الرجل بعد دخوله الجنة؟ ويجيب الطالب ويستنتج حبه الخير لقومه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. جدول المقارنة: يعرض المعلم على السبورة الذكية جدولًا للمقارنة بين الفريقين: الموقف، الجزاء، الآية الدالة، ويوجه المجموعات لإكماله، ويكمل الطالب الجدول من الآيات (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. أتدبر: يناقش المعلم دلالة تمني الرجل أن يعلم قومه رغم أنهم قتلوه، ودلالة «إن كانت إلا صيحة واحدة» على قدرة الله، ويستنتج الطالب دلالات الآيات (10 دقائق)\nالاستراتيجيات: المنظمات التخطيطية.\n\n4. أعبر: يطلب المعلم كتابة رسالة قصيرة من الرجل المؤمن إلى قومه بعد دخوله الجنة، ويكتب الطالب الرسالة ويقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n1. التهيئة: يسأل المعلم: لماذا لم يذكر القرآن اسم الرجل المؤمن في رأيك؟ ويقترح الطالب أن العبرة بالموقف لا بالاسم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أستخلص العبر: يوجه المجموعات لاستخلاص ثلاث عبر من القصة وكتابتها على لوحة، ويستخلص الطالب: الشجاعة في الحق، النصح، العاقبة للمتقين (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. مشروع نصيحة: يكلف كل مجموعة بتصميم بطاقة نصح لزملاء المدرسة في موضوع (الصلاة، النظافة، الصدق) مستفيدة من أسلوب الرجل المؤمن، ويصمم الطالب البطاقة ويعرضها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية بأسئلة الدرس، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "الحصة 1:\nس1 (مستوى المعرفة): ما معنى «يسعى»؟\nالإجابة: يسرع.\n\nس2 (مستوى التطبيق): ما معنى «فطرني»؟\nالإجابة: خلقني.\n\nس3 (مستوى الاستدلال): ما دلالة لفظة «يسعى» في الآية 20؟\nالإجابة: تدل على حرص الرجل المؤمن واهتمامه بنصح قومه.\n\nس4 (مستوى المعرفة): بمَ أمر الرجل المؤمن قومه في الآية 20؟\nالإجابة: أمرهم باتباع المرسلين.\n\nس5 (مستوى التطبيق): اذكر حجتين ساقهما الرجل المؤمن لإقناع قومه.\nالإجابة: أن المرسلين لا يسألون أجرًا وهم مهتدون، وأن العبادة للخالق الذي إليه المرجع.\n\nس6 (مستوى الاستدلال): كيف استدل الرجل المؤمن على بطلان عبادة الآلهة؟\nالإجابة: بأنها لا تغني شفاعتها شيئًا ولا تنقذ أحدًا إن أراد الله به ضرًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما جزاء الرجل المؤمن؟\nالإجابة: دخول الجنة والتكريم.\n\nس2 (مستوى التطبيق): كيف أهلك الله أصحاب القرية؟\nالإجابة: بصيحة واحدة فإذا هم خامدون.\n\nس3 (مستوى الاستدلال): علل: تمنى الرجل المؤمن أن يعلم قومه ما أكرمه الله به.\nالإجابة: لحبه الخير لهم ورغبته في أن يؤمنوا فينالوا ما ناله.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر عبرة من قصة الرجل المؤمن.\nالإجابة: الشجاعة في قول الحق ونصح الناس.\n\nس2 (مستوى التطبيق): ما دلالة إخفاء اسم الرجل المؤمن في القرآن؟\nالإجابة: أن العبرة بموقفه وعمله لا باسمه.\n\nس3 (مستوى الاستدلال): كيف تقتدي بالرجل المؤمن في المدرسة؟\nالإجابة: أنصح زملائي بلطف وأدعوهم إلى الخير دون انتظار مقابل.", "الحصة 1:\nس1 (مستوى المعرفة): اتلُ الآيات (20–25) تلاوة صحيحة.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): ما معنى «خامدون»؟\nالإجابة: ميتون هامدون لا حراك بهم.\n\nس3 (مستوى الاستدلال): لماذا جاء الرجل من أقصى المدينة ولم ينتظر أن يأتيه الخبر؟\nالإجابة: لحرصه على هداية قومه ونصرة المرسلين.\n\nس4 (مستوى المعرفة): أكمل: «اتبعوا من لا يسألكم أجرا ...».\nالإجابة: «وهم مهتدون».\n\nس5 (مستوى التطبيق): ماذا أعلن الرجل المؤمن في الآية 25؟\nالإجابة: «إني آمنت بربكم فاسمعون».\n\nس6 (مستوى الاستدلال): اختر حجة من حجج الرجل المؤمن وبين كيف تستفيد منها في نصح صديق.\nالإجابة: مثل: أنصحه دون مقابل وأبين له أن النصح لمصلحته.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «إن كانت إلا صيحة واحدة ...».\nالإجابة: «فإذا هم خامدون».\n\nس2 (مستوى التطبيق): قارن بين عاقبة الرجل المؤمن وعاقبة قومه.\nالإجابة: المؤمن في الجنة مكرم، وقومه هلكوا بصيحة واحدة.\n\nس3 (مستوى الاستدلال): ماذا تتعلم من حرص الرجل المؤمن على قومه بعد موته؟\nالإجابة: أن المؤمن يحب الخير لغيره ولا يحمل الحقد.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما الصفة التي دلت عليها كلمة «يسعى»؟\nالإجابة: الحرص والمبادرة إلى الخير.\n\nس2 (مستوى التطبيق): اذكر عبرتين من القصة.\nالإجابة: الصبر على الدعوة، وعاقبة المكذبين الهلاك.\n\nس3 (مستوى الاستدلال): اقترح طريقة حديثة تنشر بها الخير مقتديًا بالرجل المؤمن.\nالإجابة: مثل: إعداد مقطع توعوي قصير في الإذاعة المدرسية.", "الحصة 1:\n- للطالب: يتلو الآيات (20–30) ويحفظ معاني المفردات ص 64\n- لولي الأمر: يستمع لتلاوة ابنه ويناقشه في معنى «يسعى»\n- للطالب: يقرأ ص 64–65 ويسرد القصة لأسرته\n- لولي الأمر: يستمع لسرد ابنه للقصة ويسأله عن حجج الرجل المؤمن\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=11\n\nالحصة 2:\n- للطالب: يقرأ ص 65 ويكمل جدول المقارنة\n- لولي الأمر: يحاور ابنه في عاقبة المؤمن والمكذبين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=11\n\nالحصة 3:\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 66\n- لولي الأمر: يشجع ابنه على مبادرة نصح نافعة في محيطه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=11"], "h": [["الدرس", "سورة يس (20–30) (تفسير)"], ["الوحدة", "الوحدة الثانية"], ["صفحات كتاب الطالب", "63–66"], ["صفحات دليل المعلم", "74–79"], ["عدد الحصص", "4"]]}, {"id": "akh", "t": "المسلم أخو المسلم (حديث شريف)", "u": "الوحدة الثانية", "ps": [{"n": 1, "ax": "قراءة الحديث ومعاني المفردات والراوي + المعنى الإجمالي وحقوق الأخوة الإسلامية", "h": [["الدرس", "المسلم أخو المسلم (حديث شريف)"], ["الوحدة", "الوحدة الثانية"], ["الأسبوع والتاريخ", "الأسبوع السابع: 18–22/10/2026م"], ["صفحات كتاب الطالب", "67–68" وت شهر رمضان\n2. يعدد شروط صيام شهر رمضان\n3. يستدل على شروط الصيام من النصوص الشرعية\n4. يفرق بين أركان الصيام وسننه\n5. يعطي أمثلة على مفسدات الصيام\n\nمخرج تعليمي آخر:\n6. يعظم شهر رمضان ويستعد له\n7. يدرك أهمية التفقه في أحكام الصيام", "المخرج 1: تذكر\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج 4: تقييم\nالمخرج 5: فهم\nالمخرج 6: تطبيق\nالمخرج 7: تقييم", "1. التعلم التعاوني\n2. التعلم بالاكتشاف\n3. الحوار والمناقشة\n4. التعلم المبني على حل المشكلات\n5. التعلم بالأقران", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- رؤية الهلال: مشاهدته بعد غروب شمس التاسع والعشرين من شعبان\n- إكمال العدة: إتمام شعبان ثلاثين يومًا\n- شروط الصيام: الإسلام والبلوغ والعقل والقدرة\n- أركان الصيام: النية، والإمساك عن الطعام والشراب وسائر المفطرات من طلوع الفجر إلى غروب الشمس\n- سنن الصيام: تعجيل الفطور وتأخير السحور والدعاء عند الإفطار\n- المفسد: ما يبطل الصيام كتعمد إدخال شيء إلى الجوف", "يعرض المعلم صورة لمراقبي الهلال ويسأل: ماذا يفعل هؤلاء؟ ولماذا؟ ويجيب الطالب: يتحرون رؤية هلال رمضان.", "1. التهيئة: يعرض المعلم صورة لمراقبي الهلال ويسأل: ماذا يفعل هؤلاء؟ ولماذا؟ ويجيب الطالب: يتحرون رؤية هلال رمضان (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أتأمل وأستنتج: يعرض المعلم حديث «صوموا لرؤيته وأفطروا لرؤيته، فإن غم عليكم فأكملوا العدة ثلاثين» ويناقش رسومات الكتاب ص 76، ويستنتج الطالب طريقتي الثبوت: رؤية الهلال، وإكمال شعبان ثلاثين (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. أتعاون مع زملائي: يعرض المعلم النصوص الشرعية في نشاط ص 77 ويطلب من المجموعات استخراج الشرط من كل نص، ويستخرج الطالب: الإسلام من آية «إن الدين عند الله الإسلام»، والبلوغ والعقل من حديث «رفع القلم عن ثلاثة»، والقدرة من آية الرخصة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أطبق: يعرض المعلم حالات (طفل صغير، مريض، مسافر، كبير السن) ويسأل: من يجب عليه الصيام؟ ويحدد الطالب الحكم ويعلل (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أقرأ وأستنتج: يوجه المعلم لقراءة حوار نشاط ص 79 واستخراج الأركان والسنن في جدول، ويكمل الطالب الجدول: الأركان (النية، الإ ن بسبب الغيم.\n\nس2 (مستوى التطبيق): هل يجب الصيام على المجنون؟ ولماذا؟\nالإجابة: لا يجب، لأن العقل شرط للتكليف.\n\nس3 (مستوى الاستدلال): لماذا يحتاج ثبوت شهر شوال إلى عناية كما يحتاج رمضان؟\nالإجابة: لأن الفطر يوم الشك خطأ في عبادة عظيمة، فلابد من التثبت والشهادة الموثوقة.\n\nس4 (مستوى المعرفة): اذكر سنتين من سنن الصيام.\nالإجابة: تعجيل الفطور، وتأخير السحور.\n\nس5 (مستوى التطبيق): صنف: تعمد إدخال شيء في الجوف، خروج دم من الأنف.\nالإجابة: الأول يبطل الصيام، والثاني لا يبطله.\n\nس6 (مستوى الاستدلال): صائم يقضي نهاره في النوم والألعاب الإلكترونية: قيم تصرفه واقترح بديلًا.\nالإجابة: تصرف خاطئ، والأفضل أن يستغل وقته في الذكر وقراءة القرآن والعمل النافع.", "الحصة 1:\n- للطالب: يقرأ ص 76–78 ويكتب شروط الصيام\n- لولي الأمر: يحاور ابنه في استعداد الأسرة لرمضان\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 81–82\n- لولي الأمر: يناقش ابنه في سنن الصيام ويطبقها معه في رمضان\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=14"], "h": [["الدرس", "أحكام الصيام (فقه)"], ["الوحدة", "الوحدة الثانية"], ["صفحات كتاب الطالب", "76–82"], ["صفحات دليل المعلم", "91–95"], ["عدد الحصص", "2"]]}, {"id": "ahd", "t": "عاقبة نقض العهد (سيرة)", "u": "الوحدة الثانية", "ps": [{"n": 1, "ax": "إجلاء بني قينقاع وعاقبة نقض العهد", "h": [["الدرس", "عاقبة نقض العهد (سيرة)"], ["الوحدة", "الوحدة الثانية"], ["الأسبوع والتاريخ", "الأسبوع الثامن: 25–29/10/2026م"], ["صفحات كتاب الطالب", "83–87"], ["صفحات دليل المعلم", "96–101"], ["رقم الحصة", "1 من 1"], ["محور الحصة", "إجلاء بني قينقاع وعاقبة نقض العهد"]], "f": ["1. يسرد سبب إجلاء بني قينقاع عن المدينة\n2. يقارن بين موقف المؤمنين والمنافقين من بني قينقاع\n3. يستخلص الدروس والعبر من إجلاء بني قينقاع\n\nمخرج تعليمي آخر:\n4. يحرص على الالتزام بالعهود والمواثيق", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تحليل\nالمخرج 4: تقييم", "1. التعلم التعاوني\n2. التعلم التشاركي\n3. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- العهد: الاتفاق الملزم بين طرفين\n- نقض ال , "t": "الرجاء والخوف (عقيدة)", "u": "الوحدة الثالثة", "ps": [{"n": 1, "ax": "مفهوم الرجاء والخوف والتوازن بينهما + تطبيق الرجاء والخوف وثمراتهما", "h": [["الدرس", "الرجاء والخوف (عقيدة)"], ["الوحدة", "الوحدة الثالثة"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر: 15–19/11/2026م"], ["صفحات كتاب الطالب", "109–110"], ["صفحات دليل المعلم", "126–130"], ["رقم الحصة", "1 من 2"], ["محور الحصة", "مفهوم الرجاء والخوف والتوازن بينهما"]], "f": ["1. يتعرف مفهوم الرجاء والخوف\n2. يستدل من القرآن الكريم على الجمع بين الرجاء والخوف\n3. يطبق الرجاء والخوف في حياته\n4. يستنتج ثمرات الرجاء والخوف في حياة المسلم\n\nمخرج تعليمي آخر:\n5. يرجو رحمة الله ويخاف عذابه\n6. يرجو الله تعالى ويخافه", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الخرائط المفاهيمية\n4. التعلم المبني على حل المشكلات\n5. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات المواقف", "- الرجاء: الطمع في رحمة الله مع الأخذ بالأسباب\n- الخوف: خشية عذاب الله التي تحمل على الطاعة وترك المعصية\n- التوازن: الجمع بين الرجاء والخوف كجناحي الطائر\n- ثمرات الرجاء: الإقبال على الطاعة وعدم اليأس\n- ثمرات الخوف: ترك المعصية والمسارعة إلى التوبة", "يعرض المعلم صورة طائر يطير بجناحين ويسأل: هل يطير بجناح واحد؟ ثم يربطه بالرجاء والخوف، ويستنتج الطالب ضرورة التوازن.", "1. التهيئة: يعرض المعلم صورة طائر يطير بجناحين ويسأل: هل يطير بجناح واحد؟ ثم يربطه بالرجاء والخوف، ويستنتج الطالب ضرورة التوازن (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أتعرف المفهوم: يوجه المعلم لقراءة الكتاب ص 109 وصياغة مفهومي الرجاء والخوف، ويصوغ الطالب المفهومين ويكتبهما (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستدل: يوزع المعلم آيات: «ويرجون رحمته ويخافون عذابه» (الإسراء 57)، «يدعون ربهم خوفا وطمعا» (السجدة 16)، «نبئ عبادي أني أنا الغفور الرحيم وأن عذابي هو العذاب الأليم» (الحجر 49–50)، ويستخرج الطالب موضع الرجاء والخوف في كل آية (7 دقائق)\nالاستراتيجيات: الخرائط المفاهيم function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fill(){const s=$('ls');D.L.forEach((l,i)=>{const o=el('option',null,(i+1)+'. '+l.t);o.value=i;s.appendChild(o)});s.onchange=()=>{li=+s.value;pi=0;render()}}
function render(){
 const l=D.L[li];
 $('mSep').classList.toggle('on',mode==='sep');$('mCom').classList.toggle('on',mode==='com');
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
 const tb=$('tabs');tb.innerHTML='';
 if(mode==='sep'){l.ps.forEach((p,i)=>{const b=el('button',i===pi?'on':'','الحصة '+p.n+': '+p.ax);b.onclick=()=>{pi=i;render()};tb.appendChild(b)})}
 const inf=$('info');inf.innerHTML='';
 const H=mode==='sep'?l.ps[pi].h:l.h;
 H.forEach(([k,v])=>{const d=el('div');const b=el('b',null,k+': ');d.appendChild(b);d.appendChild(document.createTextNode(v));inf.appendChild(d)});
 const F=mode==='sep'?l.ps[pi].f:l.c;
 const cs=$('cards');cs.innerHTML='';
 D.F.forEach((name,i)=>{const c=el('section','card');const h=el('h2');h.appendChild(el('span',null,(i+1)+'. '+name));
  const b=el('button','cp','نسخ');b.onclick=()=>copy(F[i],b);h.appendChild(b);c.appendChild(h);c.appendChild(el('div','txt',F[i]));cs.appendChild(c)});
}
function done(b){b.textContent='تم النسخ ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1600)}
function legacy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function copy(t,b){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(b),()=>{legacy(t)?done(b):manual(t)})}
 else{legacy(t)?done(b):manual(t)}
}
function manual(t){const ta=$('ta');ta.value=t;$('modal').classList.add('show');ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
$('close').onclick=()=>$('modal').classList.remove('show');
$('mSep').onclick=()=>{mode='sep';render()};$('mCom').onclick=()=>{mode='com';render()};
fill();render();
</script>
<script src="/assets/qlink.js" defer></script>
</body>
</html>
