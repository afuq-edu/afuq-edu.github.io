كتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية\n\nالحصة 7:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة 8:\n1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية\n\nالحصة 9:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 10:\n1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقة معايير التلاوة", "الحصة 1:\n- المعارج: المصاعد والدرجات التي تصعد بها الملائكة إلى الله تعالى\n- الصبر الجميل: الصبر الذي لا شكوى فيه لغير الله\n- مقدار يوم القيامة: خمسون ألف سنة\n\nالحصة 2:\n- المهل: المعدن المذاب أو عكر الزيت\n- العهن: الصوف المصبوغ المنفوش\n- الحميم: القريب الصديق\n\nالحصة 3:\n- يفتدي: يقدم فداءً ليخلص نفسه\n- صاحبته: زوجته\n- فصيلته: عشيرته الأقربون\n- تؤويه: تضمه وتحميه\n\nالحصة 4:\n- لظى: اسم من أسماء النار\n- الشوى: جلدة الرأس والأطراف\n- فأوعى: جمع المال في وعاء ومنع حق الله فيه\n\nالحصة 5:\n- هلوعًا: شديد الحرص قليل الصبر\n- جزوعًا: كثير الجزع\n- منوعًا: كثير المنع للخير\n- المحروم: المتعفف الذي لا يسأل\n\nالحصة 6:\n- يصدقون بيوم الدين: يؤمنون بيوم الحساب\n- مشفقون: خائفون\n- العادون: المتجاوزون حدود الله\n\nالحصة 7:\n- راعون: حافظون مؤدون\n- قائمون: يؤدونها بالحق دون كتمان\n- مكرمون: منعمون بالتكريم\n\nالحصة 8:\n- مهطعين: مسرعين مادين أعناقهم\n- عزين: جماعات متفرقة\n- جنة نعيم: جنة يتنعم فيها\n\nالحصة 9:\n- المشارق والمغارب: مشارق الشمس ومغاربها طوال العام\n- الأجداث: القبور\n- يوفضون: يسرعون\n- ترهقهم: تغشاهم\n\nالحصة 10:\n- مقاطع السورة: العذاب الواقع، أهوال القيامة، طبيعة الإنسان، صفات المصلين، موقف الكافرين\n- معايير الإتقان: صحة الحفظ، سلامة النطق، تطبيق الأحكام", "الحصة 1:\n- المعلم: يعرض صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)\n- الطالب: يتأمل الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها\n\nالحصة 2:\n- المعلم: يسمّع الآيات (1–5) من بعض الطلبة بطريقة سلسلة الحفظ: كل طالب يكمل آية\n- الطالب: يتلو الآية التي يأتي دوره فيها ويصوب لزميله\n\nالحصة 3:\n- المعلم: يعرض على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة\n- الطالب: يذكر أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة\n\nالحصة 4:\n- المعلم: يسأل: ما الصفات التي تجعل الإنسان من أهل النار؟ ويستمع للإجابات ثم يقرأ الآية 17\n- الطالب: يعصف ذهنيًا ويذكر صفات ثم يقارنها بالآية\n\nالحصة 5:\n- المعلم: يعرض موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟\n- الطالب: يقارن بين الموقفين ويعلل\n\nالحصة 6:\n- المعلم: يسمع الآيات (19–25) تسميعًا عشوائيًا بالبطاقات المرقمة\n- الطالب: يسحب بطاقة ويتلو الآية المكتوب رقمها\n\nالحصة 7:\n- المعلم: يعرض موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة\n- الطالب: يجيب ويتوقع موضوع الآيات\n\nالحصة 8:\n- المعلم: يسمع الآيات (26–35) بطريقة الكرة الدوارة\n- الطالب: يتلو الآية عند وصول الكرة إليه\n\nالحصة 9:\n- المعلم: يعرض صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟\n- الطالب: يلاحظ ويربط بقوله «برب المشارق والمغارب»\n\nالحصة 10:\n- المعلم: يعرض على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه\n- الطالب: يربط المقاطع بآياتها", "الحصة 1:\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)\n- الطالب: يتأمل الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الطلبة التلاوة النموذجية للآيات (1–5) من الوسائل المتعددة ثم يقرأ بنفسه بتأنٍّ مبرزًا المد في «سائل» و«واقع»\n- الطالب: يستمع منصتًا ويتابع في المصحف ويضع إصبعه على موضع القراءة\n\nالتلاوة الجماعية والفردية (10 دقائق):\n- المعلم: يقرأ الآيات مع الطلبة جماعيًا ثم يستمع لقراءات فردية ويكلف القارئ المتقن بتصويب زميله (تعلم بالأقران)\n- الطالب: يقرأ جماعيًا ثم فرديًا ويصحح لزميله بأدب\n\nأتعرف المعنى (5 دقائق):\n- المعلم: يناقش معاني: سأل سائل، دافع، المعارج، تعرج، والروح (جبريل عليه السلام)\n- الطالب: يستخرج معنى كل كلمة ويدونها في كراسته\n\nالحفظ بالتكرار (7 دقائق):\n- المعلم: يقسم الآيات إلى مقطعين (1–3) و(4–5) ويوجه للتكرار المتدرج ثم يجري تسميعًا ثنائيًا\n- الطالب: يكرر المقطع ويسمّعه لزميله ثم يسمع الآيات كاملة\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ثم ينفذ جولة قصيرة من مسابقة المجموعات على السبورة الذكية\n- الطالب: يجيب عن الأسئلة ويشارك مجموعته في المسابقة\n\nالحصة 2:\nالتهيئة (5 دقائق):\n- المعلم: يسمّع الآيات (1–5) من بعض الطلبة بطريقة سلسلة الحفظ: كل طالب يكمل آية\n- الطالب: يتلو الآية التي يأتي دوره فيها ويصوب لزميله\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع التلاوة النموذجية للآيات (6–10) ويقف على مواضع التفخيم مثل «قريبا» و«الجبال»\n- الطالب: يستمع ويتابع ويحدد حروف الاستعلاء في الآيات\n\nالتلاوة الجماعية والفردية (10 دقائق):\n- المعلم: يوجه لقراءة جماعية ثم فردية ويصحح الأخطاء فورًا مع بيان سببها\n- الطالب: يقرأ ويصحح نطقه للكلمات مثل «كالمهل» و«كالعهن»\n\nلعبة ترتيب الآيات (7 دقائق):\n- المعلم: يوزع بطاقات كلمات الآيات المبعثرة على المجموعات ويطلب ترتيبها حسب المصحف في زمن محدد\n- الطالب: يرتب البطاقات مع مجموعته ويقرأ الآيات بعد ترتيبها\n\nالحفظ والتسميع (5 دقائق):\n- المعلم: يوجه لحفظ الآيات بالتكرار ثم يسمعها من الطلبة بالتناوب\n- الطالب: يحفظ الآيات ويسمّعها\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويختم بسؤال: كيف أستعد ليوم الحساب؟\n- الطالب: يجيب عن الأسئلة ويذكر عملًا صالحًا يستعد به\n\nالحصة 3:\nالتهيئة (5 دقائق):\n- المعلم: يعرض على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة\n- الطالب: يذكر أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يعرض التلاوة النموذجية للآيات (11–14) مع إبراز الإظهار في «من عذاب»\n- الطالب: يستمع ويحدد مواضع الوقف والابتداء\n\nالتلاوة الفردية والتصحيح (10 دقائق):\n- المعلم: يستمع لتلاوات فردية ويوجه الطلبة لتصويب بعضهم مستخدمًا قائمة رصد للأخطاء\n- الطالب: يتلو ويصوّب ويسجل أخطاءه ليعالجها\n\nأفهم وأتدبر (7 دقائق):\n- المعلم: يناقش مع الطلبة ترتيب من يفتدي بهم المجرم (البنون، الصاحبة، الأخ، الفصيلة، من في الأرض) ودلالته\n- الطالب: يستخرج ترتيب المفتدى بهم ويستنتج شدة الهول\n\nالحفظ (5 دقائق):\n- المعلم: يوجه لحفظ الآيات بطريقة التكرار والربط بالمعنى\n- الطالب: يحفظ الآيات ويسمعها لزميله\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ثم يكلف بتسميع منزلي\n- الطالب: يجيب ويدون الواجب\n\nالحصة 4:\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الصفات التي تجعل الإنسان من أهل النار؟ ويستمع للإجابات ثم يقرأ الآية 17\n- الطالب: يعصف ذهنيًا ويذكر صفات ثم يقارنها بالآية\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات (15–18) ويركز على مد «إنها» ونطق «لظى» و«للشوى»\n- الطالب: يستمع ويكرر الكلمات الصعبة\n\nالتلاوة الجماعية والفردية (10 دقائق):\n- المعلم: ينظم قراءة تبادلية بين صفوف الطلبة ثم قراءات فردية\n- الطالب: يقرأ بالتبادل ثم فرديًا\n\nخريطة صفات أهل النار (7 دقائق):\n- المعلم: يرسم على السبورة خريطة مفاهيمية: من أدبر، تولى، جمع، أوعى، ويطلب من المجموعات إكمالها بمعنى كل صفة\n- الطالب: يكمل الخريطة مع مجموعته ويشرح معنى كل صفة\n\nالحفظ والتسميع (5 دقائق):\n- المعلم: يسمع الآيات من الطلبة ويعزز المتقنين\n- الطالب: يسمع الآيات (15–18)\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويختم بدعاء النجاة من النار\n- الطالب: يجيب ويردد الدعاء\n\nالحصة 5:\nالتهيئة (5 دقائق):\n- المعلم: يعرض موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟\n- الطالب: يقارن بين الموقفين ويعلل\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع التلاوة ويبين الوقف على «هلوعا» و«جزوعا» و«منوعا» بإبدال التنوين ألفًا\n- الطالب: يستمع ويطبق الوقف الصحيح\n\nالتلاوة والتصحيح (10 دقائق):\n- المعلم: يستمع لقراءات فردية ويصحح ويثني على المتقن\n- الطالب: يقرأ ويصحح\n\nأتدبر الصفات (7 دقائق):\n- المعلم: يناقش صفات الإنسان (هلوع، جزوع، منوع) ثم يستخرج مع الطلبة أول صفتين للمصلين: الدوام على الصلاة والحق المعلوم في المال\n- الطالب: يستخرج الصفات من الآيات ويمثل لكل منها\n\nالحفظ (5 دقائق):\n- المعلم: يقسم الآيات (19–21) و(22–25) ويوجه للتكرار\n- الطالب: يحفظ ويسمع لزميله\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: ينفذ مسابقة المجموعات بأسئلة المقطع ثم يطرح أسئلة التقويم الختامي\n- الطالب: يشارك في المسابقة ويجيب\n\nالحصة 6:\nالتهيئة (5 دقائق):\n- المعلم: يسمع الآيات (19–25) تسميعًا عشوائيًا بالبطاقات المرقمة\n- الطالب: يسحب بطاقة ويتلو الآية المكتوب رقمها\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع التلاوة ويحدد مواضع الألف المدية المرققة كما في «يصدقون» و«ربهم» والمفخمة في «حافظون»\n- الطالب: يستمع ويضع خطًا تحت الألف المدية في كراسته\n\nالتلاوة الثنائية (10 دقائق):\n- المعلم: يوزع الطلبة أزواجًا يقرأ أحدهما ويصحح الآخر ثم يتبادلان\n- الطالب: يقرأ ويصحح لزميله\n\nأستخرج الصفات (7 دقائق):\n- المعلم: يناقش صفات: التصديق بيوم الدين، الخوف من عذاب الله، حفظ الفروج، ويوضح معنى العفة بأسلوب مناسب\n- الطالب: يستخرج الصفات ويبين أثر كل صفة في السلوك\n\nالحفظ (5 دقائق):\n- المعلم: يوجه لحفظ الآيات بالربط بين الصفات وتسلسلها\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويثني على المتقنين\n- الطالب: يجيب عن الأسئلة\n\nالحصة 7:\nالتهيئة (5 دقائق):\n- المعلم: يعرض موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة\n- الطالب: يجيب ويتوقع موضوع الآيات\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات (32–35) ويبرز المد في «لأماناتهم» و«بشهاداتهم»\n- الطالب: يستمع ويتابع\n\nالتلاوة والتصحيح (10 دقائق):\n- المعلم: يستمع لقراءات فردية ويتابع تطبيق الغنة في «إنما» إن وجدت وأحكام المد\n- الطالب: يقرأ ويصحح\n\nلعب أدوار (7 دقائق):\n- المعلم: يكلف مجموعات بتمثيل مواقف قصيرة: أداء الأمانة، الوفاء بالوعد، أداء الشهادة بالحق\n- الطالب: يمثل الموقف ويربطه بالآية المناسبة\n\nالحفظ (5 دقائق):\n- المعلم: يوجه لحفظ الآيات ثم يسمعها\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: ينفذ مسابقة المجموعات على صفات المؤمنين ثم يطرح التقويم الختامي\n- الطالب: يشارك ويجيب\n\nالحصة 8:\nالتهيئة (5 دقائق):\n- المعلم: يسمع الآيات (26–35) بطريقة الكرة الدوارة\n- الطالب: يتلو الآية عند وصول الكرة إليه\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات ويوضح نطق «مهطعين» و«عزين»\n- الطالب: يستمع ويكرر\n\nالتلاوة الجماعية والفردية (10 دقائق):\n- المعلم: يقرأ مع الطلبة ثم يوزع التلاوة على المجموعات\n- الطالب: يقرأ مع مجموعته وفرديًا\n\nأتدبر وأناقش (7 دقائق):\n- المعلم: يناقش سؤال: «أيطمع كل امرئ منهم أن يدخل جنة نعيم»: لماذا ردت الآية بـ«كلا»؟\n- الطالب: يحلل الآية ويستنتج أن الجنة لا تنال بالتمني\n\nالحفظ (5 دقائق):\n- المعلم: يوجه لحفظ الآيات ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب\n\nالحصة 9:\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟\n- الطالب: يلاحظ ويربط بقوله «برب المشارق والمغارب»\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات ويبين الإخفاء في «من الأجداث» والإظهار في «من عذاب» عند مراجعتها\n- الطالب: يستمع ويحدد المواضع\n\nالتلاوة الفردية (10 دقائق):\n- المعلم: يستمع لقراءات فردية متقنة ويعالج الأخطاء الشائعة\n- الطالب: يقرأ فرديًا\n\nصورة يوم الخروج (7 دقائق):\n- المعلم: يناقش مع الطلبة مشهد الخروج من القبور: سراعًا، خاشعة أبصارهم، ترهقهم ذلة\n- الطالب: يستخرج عناصر المشهد ويعبر عنه بأسلوبه\n\nالحفظ (5 دقائق):\n- المعلم: يوجه لحفظ الآيات ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويعلن موعد التسميع الشامل للسورة\n- الطالب: يجيب ويستعد للتسميع\n\nالحصة 10:\nالتهيئة (5 دقائق):\n- المعلم: يعرض على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه\n- الطالب: يربط المقاطع بآياتها\n\nالتسميع الشامل (15 دقيقة):\n- المعلم: يسمع السورة من الطلبة على مقاطع مستخدمًا بطاقة معايير التلاوة ويرصد الدرجات\n- الطالب: يسمع المقطع المطلوب منه ويقيّم نفسه بالبطاقة\n\nتطبيق ترقيق الراء (8 دقائق):\n- المعلم: يوجه المجموعات لاستخراج راءات مرققة من السورة مثل «الكافرين» و«الشر» ثم يعللها\n- الطالب: يستخرج المواضع ويعلل الترقيق\n\nمسابقة المجموعات (7 دقائق):\n- المعلم: ينفذ مسابقة المجموعات بأسئلة السورة كاملة على السبورة الذكية\n- الطالب: يشارك مجموعته في الإجابة\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويعلن المتميزين في الحفظ\n- الطالب: يجيب ويحتفي بزملائه المتميزين", "الحصة 1:\nس1 (مستوى المعرفة): ما عدد آيات سورة المعارج؟\nالإجابة: 44 آية.\n\nس2 (مستوى التطبيق): ما المقصود بقوله تعالى: «من الله ذي المعارج»؟\nالإجابة: من الله صاحب المصاعد والدرجات العلا التي تصعد فيها الملائكة إليه.\n\nس3 (مستوى الاستدلال): لماذا وُصف الصبر في الآية الخامسة بأنه جميل؟\nالإجابة: لأنه صبر لا جزع فيه ولا شكوى إلا إلى الله تعالى.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما معنى كلمة «العهن» في قوله تعالى: «وتكون الجبال كالعهن»؟\nالإجابة: الصوف المصبوغ المنفوش.\n\nس2 (مستوى التطبيق): بمَ شبهت الآيات السماء يوم القيامة؟\nالإجابة: بالمهل وهو المعدن المذاب.\n\nس3 (مستوى الاستدلال): علل: لا يسأل القريب قريبه يوم القيامة.\nالإجابة: لانشغال كل إنسان بنفسه من شدة الهول.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما معنى «فصيلته»؟\nالإجابة: عشيرته الأقربون.\n\nس2 (مستوى التطبيق): بمن يود المجرم أن يفتدي من عذاب يوم القيامة؟\nالإجابة: ببنيه وصاحبته وأخيه وفصيلته ومن في الأرض جميعًا.\n\nس3 (مستوى الاستدلال): ماذا تدل عليه رغبة المجرم في الافتداء بأحب الناس إليه؟\nالإجابة: تدل على شدة العذاب وهول الموقف حتى يتخلى الإنسان عن أحبابه لينجو بنفسه.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما معنى «لظى»؟\nالإجابة: اسم من أسماء النار.\n\nس2 (مستوى التطبيق): من الذين تدعوهم النار كما في الآية 17؟\nالإجابة: من أدبر عن الحق وتولى عن الطاعة.\n\nس3 (مستوى الاستدلال): ما العلاقة بين قوله تعالى «وجمع فأوعى» وخلق البخل؟\nالإجابة: أن من جمع المال ومنع حق الله فيه بخلًا كان من أهل النار.\n\nالحصة 5:\nس1 (مستوى المعرفة): ما معنى «هلوعا»؟\nالإجابة: شديد الحرص قليل الصبر.\n\nس2 (مستوى التطبيق): من المستثنون من صفة الهلع كما في الآية 22؟\nالإجابة: المصلون.\n\nس3 (مستوى الاستدلال): ما الفرق بين السائل والمحروم؟\nالإجابة: السائل الذي يطلب العطاء، والمحروم المتعفف الذي لا يسأل.\n\nالحصة 6:\nس1 (مستوى المعرفة): ما معنى «مشفقون»؟\nالإجابة: خائفون.\n\nس2 (مستوى التطبيق): اذكر صفة من صفات المؤمنين وردت في الآية 26.\nالإجابة: يصدقون بيوم الدين.\n\nس3 (مستوى الاستدلال): لماذا وصف عذاب الله بأنه «غير مأمون»؟\nالإجابة: لأنه لا يأمن أحد أن يقع فيه، فيبقى المؤمن خائفًا راجيًا.\n\nالحصة 7:\nس1 (مستوى المعرفة): ما معنى «راعون»؟\nالإجابة: حافظون مؤدون لها.\n\nس2 (مستوى التطبيق): ما جزاء أصحاب الصفات المذكورة كما في الآية 35؟\nالإجابة: في جنات مكرمون.\n\nس3 (مستوى الاستدلال): لماذا ختمت صفات المؤمنين بالمحافظة على الصلاة كما بدأت بالدوام عليها؟\nالإجابة: لبيان عظيم منزلة الصلاة وأنها أساس الصفات كلها.\n\nالحصة 8:\nس1 (مستوى المعرفة): ما معنى «عزين»؟\nالإجابة: جماعات متفرقة.\n\nس2 (مستوى التطبيق): كيف كان الكافرون يقبلون نحو النبي صلى الله عليه وسلم؟\nالإجابة: مسرعين جماعات عن اليمين وعن الشمال.\n\nس3 (مستوى الاستدلال): ما الذي ردت عليه كلمة «كلا» في الآية 39؟\nالإجابة: ردت على طمعهم في دخول الجنة دون إيمان وعمل.\n\nالحصة 9:\nس1 (مستوى المعرفة): ما معنى «الأجداث»؟\nالإجابة: القبور.\n\nس2 (مستوى التطبيق): كيف يخرج الناس من القبور كما وصفت الآية 43؟\nالإجابة: سراعًا كأنهم إلى نصب يوفضون.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (40–41) على قدرة الله تعالى؟\nالإجابة: أنه سبحانه قادر على أن يبدل خيرًا منهم وما هو بمسبوق.\n\nالحصة 10:\nس1 (مستوى المعرفة): كم عدد آيات سورة المعارج؟ وما الآية التي تبدأ بها صفات المصلين؟\nالإجابة: 44 آية، وتبدأ الصفات من الآية 22 «إلا المصلين».\n\nس2 (مستوى التطبيق): لماذا رققت الراء في كلمة «الكافرين»؟\nالإجابة: لأنها مكسورة.\n\nس3 (مستوى الاستدلال): صنف آيات السورة إلى مقطعين: ترهيب وترغيب، مع مثال لكل منهما.\nالإجابة: ترهيب: «كلا إنها لظى»، ترغيب: «أولئك في جنات مكرمون».", "الحصة 1:\nس1 (مستوى المعرفة): اتلُ الآيات (1–3) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة متقنة.\n\nس2 (مستوى التطبيق): كم مقدار اليوم الذي تعرج فيه الملائكة والروح إليه؟\nالإجابة: خمسون ألف سنة.\n\nس3 (مستوى الاستدلال): اقترح موقفًا من حياتك تطبق فيه الصبر الجميل.\nالإجابة: مثل: الصبر على المرض أو على تأخر النتيجة دون تذمر مع الدعاء والأخذ بالأسباب.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «إنهم يرونه بعيدا ...».\nالإجابة: «ونراه قريبا».\n\nس2 (مستوى التطبيق): اذكر صورتين من أهوال يوم القيامة وردتا في الآيات (8–10).\nالإجابة: السماء كالمهل، والجبال كالعهن، ولا يسأل حميم حميما.\n\nس3 (مستوى الاستدلال): «يرونه بعيدا ونراه قريبا»: ما الدرس المستفاد لك من هذه المقابلة؟\nالإجابة: أن يوم القيامة قريب مهما ظنه الناس بعيدًا، فأبادر بالتوبة والعمل الصالح.\n\nالحصة 3:\nس1 (مستوى المعرفة): اتلُ الآيات (11–14) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): أكمل: «وفصيلته التي ...».\nالإجابة: «تؤويه».\n\nس3 (مستوى الاستدلال): هل تنفع القرابة الإنسان يوم القيامة إن لم يعمل صالحًا؟ علل.\nالإجابة: لا تنفعه، لأن كل نفس بما كسبت رهينة والنجاة بالإيمان والعمل الصالح.\n\nالحصة 4:\nس1 (مستوى المعرفة): أكمل: «كلا إنها لظى ...».\nالإجابة: «نزاعة للشوى».\n\nس2 (مستوى التطبيق): اذكر صفتين لمن تدعوهم النار.\nالإجابة: أدبر وتولى، وجمع فأوعى.\n\nس3 (مستوى الاستدلال): كيف يحمي المسلم نفسه من صفة «جمع فأوعى»؟\nالإجابة: بإخراج الزكاة والصدقة وأداء حق المال.\n\nالحصة 5:\nس1 (مستوى المعرفة): أكمل: «إذا مسه الشر جزوعا ...».\nالإجابة: «وإذا مسه الخير منوعا».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المصلين وردتا في الآيات (23–25).\nالإجابة: الدوام على الصلاة، وفي أموالهم حق معلوم للسائل والمحروم.\n\nس3 (مستوى الاستدلال): كيف تعالج الصلاة الدائمة صفة الهلع في الإنسان؟\nالإجابة: تربطه بالله فيطمئن قلبه، فيصبر عند الشر ويجود عند الخير.\n\nالحصة 6:\nس1 (مستوى المعرفة): أكمل: «والذين هم من عذاب ربهم ...».\nالإجابة: «مشفقون».\n\nس2 (مستوى التطبيق): حدد كلمة فيها ألف مدية مفخمة من الآية 29.\nالإجابة: «حافظون».\n\nس3 (مستوى الاستدلال): ما أثر التصديق بيوم الدين في سلوك المسلم؟\nالإجابة: يجعله يراقب الله في أقواله وأفعاله ويستعد للحساب.\n\nالحصة 7:\nس1 (مستوى المعرفة): أكمل: «والذين هم بشهاداتهم ...».\nالإجابة: «قائمون».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المؤمنين في الآيتين (32–33).\nالإجابة: رعاية الأمانة والعهد، والقيام بالشهادة.\n\nس3 (مستوى الاستدلال): صديقك وعدك بموعد ثم تأخر دون عذر، كيف تنصحه في ضوء الآية 32؟\nالإجابة: أذكره بأن الوفاء بالعهد من صفات المؤمنين وأن رعايته من الإيمان.\n\nالحصة 8:\nس1 (مستوى المعرفة): أكمل: «أيطمع كل امرئ منهم ...».\nالإجابة: «أن يدخل جنة نعيم».\n\nس2 (مستوى التطبيق): ما معنى «مهطعين»؟\nالإجابة: مسرعين مادين أعناقهم.\n\nس3 (مستوى الاستدلال): زميلك يقول: سأدخل الجنة لأني من أسرة صالحة، بمَ ترد عليه من الآيات؟\nالإجابة: أرد بقوله تعالى «أيطمع كل امرئ منهم أن يدخل جنة نعيم كلا»، فالجنة بالإيمان والعمل.\n\nالحصة 9:\nس1 (مستوى المعرفة): أكمل: «خاشعة أبصارهم ترهقهم ذلة ...».\nالإجابة: «ذلك اليوم الذي كانوا يوعدون».\n\nس2 (مستوى التطبيق): ما معنى «يوفضون»؟\nالإجابة: يسرعون.\n\nس3 (مستوى الاستدلال): لماذا ختمت السورة بذكر اليوم الموعود وقد بدأت بالسؤال عن العذاب الواقع؟\nالإجابة: للتأكيد أن العذاب الذي استبعدوه واقع لا محالة في اليوم الذي وعدوا به.\n\nالحصة 10:\nس1 (مستوى المعرفة): اتلُ الآيات (22–35) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): اذكر ثلاث صفات من صفات المصلين.\nالإجابة: الدوام على الصلاة، أداء حق المال، التصديق بيوم الدين.\n\nس3 (مستوى الاستدلال): اختر صفة من صفات المصلين وضع خطة أسبوعية لتطبيقها.\nالإجابة: مثل المحافظة على الصلاة: أداؤها في أول وقتها ومتابعة ذلك في جدول يومي.", "الحصة 1:\n- للطالب: يكرر تلاوة الآيات (1–5) في المنزل ويحفظها لتسميعها في الحصة القادمة\n- لولي الأمر: يستمع لتلاوة ابنه للآيات (1–5) ويشجعه على الحفظ بالاستماع لتلاوة مجودة\n\nالحصة 2:\n- للطالب: يراجع الآيات (1–10) ويكتب معاني كلمتي المهل والعهن\n- لولي الأمر: يتابع حفظ ابنه للآيات (1–10) ويستمع إليه مرة يوميًا\n\nالحصة 3:\n- للطالب: يحفظ الآيات (11–14) ويربطها بما سبقها ويسمع الآيات (1–14)\n- لولي الأمر: يسمع من ابنه الآيات (1–14) ويحاوره في معنى الافتداء\n\nالحصة 4:\n- للطالب: يحفظ الآيات (15–18) ويكتب صفات من تدعوهم النار\n- لولي الأمر: يتابع حفظ ابنه ويذكره بأهمية الإنفاق\n\nالحصة 5:\n- للطالب: يحفظ الآيات (19–25) ويراجع ما قبلها\n- لولي الأمر: يشجع ابنه على المحافظة على الصلاة في وقتها ويسمع منه الآيات\n\nالحصة 6:\n- للطالب: يحفظ الآيات (26–31) ويطبق تفخيم الألف بعد الحرف المفخم\n- لولي الأمر: يسمع من ابنه الآيات (19–31)\n\nالحصة 7:\n- للطالب: يحفظ الآيات (32–35) ويحصي صفات المؤمنين في السورة\n- لولي الأمر: يذكر ابنه بأداء الأمانات والوفاء بالوعود\n\nالحصة 8:\n- للطالب: يحفظ الآيات (36–39) ويراجع السورة من أولها\n- لولي الأمر: يسمع من ابنه الآيات (1–39) على مرحلتين\n\nالحصة 9:\n- للطال ودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق\n- الطالب: يتوقع ويدون\n\nالحصة 4:\n- المعلم: يسمع الآيات (19–29) بطريقة «أكمل الآية»\n- الطالب: يكمل الآية التي يبدأ بها المعلم\n\nالحصة 5:\n- المعلم: يعرض على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟\n- الطالب: يعصف ذهنيًا بالإجابات\n\nالحصة 6:\n- المعلم: يتلو الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟\n- الطالب: يجيب ويتوقع سبب الختم بالتسبيح", "الحصة 1:\nالتهيئة (5 دقائق):\n- المعلم: يعرض على السبورة الذكية أسماء ثلاث أمم (ثمود، عاد، قوم فرعون) ويسأل: ماذا تعرف عنها؟\n- الطالب: يذكر ما يعرفه عن هذه الأمم\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات (1–10) ويبرز تفخيم الراء في «صرصر» الأولى وترقيقها في الثانية المكسورة\n- الطالب: يستمع ويحدد موضع الراءين\n\nالتلاوة الجماعية والفردية (10 دقائق):\n- المعلم: يقرأ مع الطلبة ثم يستمع لقراءات فردية ويصحح\n- الطالب: يقرأ ويصحح\n\nخريطة الأمم المكذبة (7 دقائق):\n- المعلم: يرسم جدولًا: الأمة، نوع العذاب، ويطلب من المجموعات إكماله من الآيات\n- الطالب: يكمل الجدول: ثمود بالطاغية، عاد بالريح، فرعون بالأخذة الرابية\n\nالحفظ (5 دقائق):\n- المعلم: يقسم الآيات (1–5) و(6–10) ويوجه للحفظ\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب\n\nالحصة 2:\nالتهيئة (5 دقائق):\n- المعلم: يسمع الآيات (1–10) ثم يسأل: ما النعمة التي ذكرنا الله بها في قصة الطوفان؟\n- الطالب: يسمع الآيات ويتوقع الإجابة\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات (11–18) ويبين تفخيم الراء المفتوحة في «ربك» و«تذكرة»، والساكنة بعد فتح في «عرش» و«الأرض»\n- الطالب: يستمع ويحدد حكم الراء في «ربك» و«عرش»\n\nالتلاوة الفردية (10 دقائق):\n- المعلم: يستمع لقراءات فردية ويصحح النطق في «نفخة» و«دكتا»\n- الطالب: يقرأ ويصحح\n\nترتيب الأحداث (7 دقائق):\n- المعلم: يوزع بطاقات أحداث يوم القيامة (النفخ، دك الأرض والجبال، انشقاق السماء، العرض) ويطلب ترتيبها حسب الآيات\n- الطالب: يرتب البطاقات ويقرأ الآية الدالة على كل حدث\n\nالحفظ (5 دقائق):\n- المعلم: يوجه لحفظ الآيات ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب\n\nالحصة 3:\nالتهيئة (5 دقائق):\n- المعلم: يعرض جدولًا فارغًا بعمودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق\n- الطالب: يتوقع ويدون\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات ويبين الوقف بهاء السكت في «كتابيه» و«حسابيه» و«ماليه» و«سلطانيه»\n- الطالب: يستمع ويطبق الوقف بالهاء\n\nالتلاوة الثنائية (10 دقائق):\n- المعلم: يوزع الطلبة أزواجًا: أحدهما يقرأ آيات أصحاب اليمين والآخر آيات أصحاب الشمال\n- الطالب: يقرأ ويصحح لزميله\n\nأقارن (7 دقائق):\n- المعلم: يوجه المجموعات لإكمال جدول المقارنة: القول، المكان، الحال\n- الطالب: يكمل الجدول من الآيات\n\nالحفظ (5 دقائق):\n- المعلم: يقسم المقطع إلى (19–24) و(25–29) ويوجه للحفظ\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: ينفذ جولة من مسابقة المجموعات ثم يطرح أسئلة التقويم الختامي\n- الطالب: يشارك ويجيب\n\nالحصة 4:\nالتهيئة (5 دقائق):\n- المعلم: يسمع الآيات (19–29) بطريقة «أكمل الآية»\n- الطالب: يكمل الآية التي يبدأ بها المعلم\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات ويبين تفخيم الراء المفتوحة في «ذرعها» وإخفاء التنوين في «سلسلة ذرعها»\n- الطالب: يستمع ويحدد حكم الراء في «ذرعها»\n\nالتلاوة الجماعية والفردية (10 دقائق):\n- المعلم: يقرأ مع الطلبة ثم يستمع لقراءات فردية\n- الطالب: يقرأ ويصحح\n\nأسباب العذاب (7 دقائق):\n- المعلم: يطرح مشكلة: لماذا استحق الكافر هذا العذاب؟ ويوجه لاستخراج السببين من الآيتين (33–34)\n- الطالب: يستخرج: عدم الإيمان بالله العظيم، وعدم الحض على طعام المسكين\n\nالحفظ (5 دقائق):\n- المعلم: يوجه للحفظ ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويقترح مبادرة صفية لإطعام المحتاجين\n- الطالب: يجيب ويشارك في الاقتراح\n\nالحصة 5:\nالتهيئة (5 دقائق):\n- المعلم: يعرض على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟\n- الطالب: يعصف ذهنيًا بالإجابات\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات ويبين تفخيم الراء في «رسول» لأنها مفتوحة وترقيقها في «شاعر» عند الوصل لأنها مكسورة\n- الطالب: يستمع ويطبق\n\nالتلاوة الفردية (10 دقائق):\n- المعلم: يستمع لقراءات فردية ويتابع تطبيق أحكام الراء\n- الطالب: يقرأ ويصحح\n\nأدلة صدق القرآن (7 دقائق):\n- المعلم: يناقش مع الطلبة نفي الشعر والكهانة والتقول، ويستخرج معهم أن القرآن تنزيل من رب العالمين\n- الطالب: يستخرج الأدلة ويكتبها في خريطة\n\nالحفظ (5 دقائق):\n- المعلم: يوجه للحفظ ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب\n\nالحصة 6:\nالتهيئة (5 دقائق):\n- المعلم: يتلو الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟\n- الطالب: يجيب ويتوقع سبب الختم بالتسبيح\n\nالتلاوة والحفظ (8 دقائق):\n- المعلم: يُسمع الآيات (48–52) ويوجه لحفظها سريعًا لقصرها\n- الطالب: يستمع ويحفظ\n\nالتسميع الشامل (15 دقيقة):\n- المعلم: يسمع السورة كاملة من الطلبة على مقاطع باستخدام بطاقة معايير التلاوة\n- الطالب: يسمع ويقيم نفسه\n\nمسابقة المجموعات (7 دقائق):\n- المعلم: ينفذ مسابقة المجموعات بأسئلة السورة على السبورة الذكية\n- الطالب: يشارك مع مجموعته\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويكرم المتقنين\n- الطالب: يجيب", "الحصة 1:\nس1 (مستوى المعرفة): كم عدد آيات سورة الحاقة؟\nالإجابة: 52 آية.\n\nس2 (مستوى التطبيق): بمَ أهلكت ثمود؟\nالإجابة: بالطاغية وهي الصيحة الشديدة.\n\nس3 (مستوى الاستدلال): كيف صورت الآية 7 حال قوم عاد بعد هلاكهم؟\nالإجابة: صرعى كأنهم أعجاز نخل خاوية.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما المقصود بـ«الجارية» في الآية 11؟\nالإجابة: السفينة.\n\nس2 (مستوى التطبيق): ما أول أحداث يوم القيامة المذكورة في الآيات (13–18)؟\nالإجابة: النفخ في الصور نفخة واحدة.\n\nس3 (مستوى الاستدلال): ما دلالة قوله تعالى: «لا تخفى منكم خافية»؟\nالإجابة: أن الله يعلم كل شيء فلا يخفى عليه من أعمال العباد شيء.\n\nالحصة 3:\nس1 (مستوى المعرفة): ماذا يقول من أوتي كتابه بيمينه؟\nالإجابة: «هاؤم اقرءوا كتابيه».\n\nس2 (مستوى التطبيق): ما معنى «قطوفها دانية»؟\nالإجابة: ثمارها قريبة سهلة التناول.\n\nس3 (مستوى الاستدلال): ما الذي ندم عليه صاحب الشمال كما في الآيتين (28–29)؟\nالإجابة: أن ماله وسلطانه لم يغنيا عنه شيئًا.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما معنى «غسلين»؟\nالإجابة: صديد أهل النار.\n\nس2 (مستوى التطبيق): اذكر سببي عذاب الكافر كما في الآيتين (33–34).\nالإجابة: لا يؤمن بالله العظيم، ولا يحض على طعام المسكين.\n\nس3 (مستوى الاستدلال): لماذا قرن الله ترك الحض على إطعام المسكين بعدم الإيمان؟\nالإجابة: لعظم حق المسكين ولأن الرحمة بالفقراء من ثمار الإيمان.\n\nالحصة 5:\nس1 (مستوى المعرفة): ما معنى «الوتين»؟\nالإجابة: عرق متصل بالقلب إذا قطع مات صاحبه.\n\nس2 (مستوى التطبيق): ما التهمتان اللتان نفتهما الآيتان (41–42) عن القرآن؟\nالإجابة: أنه قول شاعر، وأنه قول كاهن.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (44–47) على أن النبي صلى الله عليه وسلم لم يفترِ القرآن؟\nالإجابة: أنه لو تقول على الله لعاقبه الله وقطع منه الوتين ولم يمنعه أحد.\n\nالحصة 6:\nس1 (مستوى المعرفة): بمَ وصف القرآن في الآية 48؟\nالإجابة: بأنه تذكرة للمتقين.\n\nس2 (مستوى التطبيق): بمَ ختمت سورة الحاقة؟\nالإجابة: بالأمر بتسبيح الله: «فسبح باسم ربك العظيم».\n\nس3 (مستوى الاستدلال): لخص موضوعات سورة الحاقة في ثلاث نقاط.\nالإجابة: مصير الأمم المكذبة، أحداث القيامة وحال الفريقين، صدق القرآن الكريم.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: «وأما عاد فأهلكوا ...».\nالإجابة: «بريح صرصر عاتية».\n\nس2 (مستوى التطبيق): كم مدة الريح التي سخرت على عاد؟\nالإجابة: سبع ليال وثمانية أيام متتابعة.\n\nس3 (مستوى الاستدلال): ما العبرة التي تستفيدها من ذكر مصير الأمم المكذبة؟\nالإجابة: أن عاقبة التكذيب والمعصية الهلاك فأطيع الله ورسوله.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «يومئذ تعرضون ...».\nالإجابة: «لا تخفى منكم خافية».\n\nس2 (مستوى التطبيق): ما حكم الراء في كلمة «عرش»؟\nالإجابة: تفخيم، لأنها ساكنة بعد فتح.\n\nس3 (مستوى الاستدلال): كيف يؤثر الإيمان بالعرض على الله في سلوك الطالب أثناء الاختبار؟\nالإجابة: يجعله أمينًا لا يغش لعلمه أن الله مطلع عليه.\n\nالحصة 3:\nس1 (مستوى المعرفة): أكمل: «فهو في عيشة ...».\nالإجابة: «راضية».\n\nس2 (مستوى التطبيق): اذكر نعمتين لأصحاب اليمين.\nالإجابة: جنة عالية، وقطوفها دانية.\n\nس3 (مستوى الاستدلال): ما الأعمال التي «أسلفتها» هذا الأسبوع وتتمنى أن تجدها في كتابك؟\nالإجابة: مثل: المحافظة على الصلاة وبر الوالدين ومساعدة زميل.\n\nالحصة 4:\nس1 (مستوى المعرفة): أكمل: «إنه كان لا يؤمن ...».\nالإجابة: «بالله العظيم».\n\nس2 (مستوى التطبيق): كم ذراعًا طول السلسلة المذكورة في الآية 32؟\nالإجابة: سبعون ذراعًا.\n\nس3 (مستوى الاستدلال): اقترح عملًا تحض به غيرك على إطعام المسكين.\nالإجابة: مثل: الدعوة إلى حملة إفطار صائم أو التبرع بسلة غذائية.\n\nالحصة 5:\nس1 (مستوى المعرفة): أكمل: «تنزيل من ...».\nالإجابة: «رب العالمين».\n\nس2 (مستوى التطبيق): ما حكم الراء في كلمة «رسول»؟\nالإجابة: تفخيم لأنها مفتوحة.\n\nس3 (مستوى الاستدلال): كيف تدافع عن القرآن الكريم إذا سمعت من يشكك فيه؟\nالإجابة: أبين أنه تنزيل من رب العالمين وليس شعرًا ولا كهانة، وأستدل بالآيات.\n\nالحصة 6:\nس1 (مستوى المعرفة): اتلُ الآيات (48–52) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): ما معنى «حق اليقين»؟\nالإجابة: اليقين الثابت الذي لا شك فيه.\n\nس3 (مستوى الاستدلال): قيم تلاوتك للسورة وفق معايير الإتقان، واذكر ما تحتاج إلى تحسينه.\nالإجابة: يذكر الطالب مثلًا: إتقان الحفظ مع حاجة إلى ضبط الوقف بهاء السكت.", "الحصة 1:\n- للطالب: يحفظ الآيات (1–10) من سورة الحاقة\n- لولي الأمر: يستمع لتلاوة ابنه ويناقشه في قصص الأمم المذكورة\n\nالحصة 2:\n- للطالب: يحفظ الآيات (11–18) ويراجع ما قبلها\n- لولي الأمر: يسمع من ابنه الآيات (1–18)\n\nالحصة 3:\n- للطالب: يحفظ الآيات (19–29) ويطبق الوقف بهاء السكت\n- لولي الأمر: يناقش ابنه في الأعمال التي يحب أن يجدها في صحيفته\n\nالحصة 4:\n- للطالب: يحفظ الآيات (30–37)\n- لولي الأمر: يشجع ابنه على المشاركة في عمل خيري لإطعام المحتاجين\n\nالحصة 5:\n- للطالب: يحفظ الآيات (38–47)\n- لولي الأمر: يستمع لتلاوة ابنه ويحاوره في عظمة القرآن\n\nالحصة 6:\n- للطالب: يراجع سورة الحاقة كاملة وسورة المعارج\n- لولي الأمر: يستمع لتلاوة ابنه للسورتين ويشجعه على المراجعة الدورية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2"], "h": [["الدرس", "سورة الحاقة (تلاوة وحفظ)"], ["الوحدة", "مقرر التلاوة والحفظ"], ["صفحات كتاب الطالب", "15–21"], ["صفحات دليل المعلم", "26–28"], ["عدد ا اء.\n\nس2 (مستوى التطبيق): استخرج حرفًا مفخمًا وآخر مرققًا من كلمة «قريبا».\nالإجابة: القاف مفخمة، والباء مرققة.\n\nس3 (مستوى الاستدلال): صمم بطاقة تعليمية تساعد زملاءك على حفظ أقسام الحروف من حيث التفخيم والترقيق.\nالإجابة: بطاقة تتضمن «خص ضغط قظ» للمفخمة، والحروف المتغيرة الأربعة، وأمثلة لكل قسم.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر مراتب التفخيم الخمس مرتبة.\nالإجابة: المفتوح بعده ألف، المفتوح ليس بعده ألف، المضموم، الساكن، المكسور.\n\nس2 (مستوى التطبيق): في أي مرتبة تفخم الصاد في كلمة «صبرا»؟\nالإجابة: المرتبة الثانية: مفتوح ليس بعده ألف.\n\nس3 (مستوى الاستدلال): استخرج من سورة المعارج كلمتين تمثلان مرتبتين مختلفتين وحدد مرتبتيهما.\nالإجابة: مثل: «واقع» القاف مكسورة في المرتبة الخامسة، «قريبا» القاف مفتوحة ليس بعدها ألف في المرتبة الثانية.", "الحصة 1:\n- للطالب: يراجع تعريفي التفخيم والترقيق ص 22 ويكتب أزواج كلمات يتغير معناها بالتفخيم\n- لولي الأمر: يساعد ابنه على نطق أزواج الكلمات نطقًا صحيحًا\n\nالحصة 2:\n- للطالب: يحفظ عبارة «خص ضغط قظ» ويحل نشاط ص 24\n- لولي الأمر: يسمع من ابنه حروف الاستعلاء السبعة\n\nالحصة 3:\n- للطالب: يراجع مراتب التفخيم ص 25 ويطبقها في تلاوة سورة المعارج\n- لولي الأمر: يستمع لتلاوة ابنه وينبهه إلى نطق حروف الاستعلاء\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=3"], "h": [["الدرس", "مقدمة في التفخيم والترقيق (تجويد)"], ["الوحدة", "الوحدة الأولى"], ["صفحات كتاب الطالب", "22–26"], ["صفحات دليل المعلم", "29–33"], ["عدد الحصص", "3"]]}, {"id": "isra", "t": "سورة الإسراء (23–30) (تفسير)", "u": "الوحدة الأولى", "ps": [{"n": 1, "ax": "تلاوة الآيات (23–30) ومعاني المفردات", "h": [["الدرس", "سورة الإسراء (23–30) (تفسير)"], ["الوحدة", "الوحدة الأولى"], ["الأسبوع والتاريخ", "الأسبوع الأول: 6–10/9/2026م"], ["صفحات كتاب الطالب", "27–28"], ["صفحات دليل المعلم", "34–41"], ["رقم الحصة", "1 من 3"], ["محور الحصة", "تلاوة الآيات (23–30) ومعاني المفردات"]], "f": ["1. يتلو الآيات (23–30) من سورة الإسراء مراعيًا أحكام التجويد\n2. يذكر معاني بعض المفردات والتراكيب الواردة في الآيات\n\nمخرج تعليمي آخر:\n3. يتأدب في nمخرج تعليمي آخر:\n7. يداوم على الصلاة ويؤدي حق المال\n8. يحرص على العفة والخوف من عذاب الله\n\nالحصة 4:\n1. يتلو الآيات (32–35) تلاوة صحيحة\n2. يبين صفات المؤمنين في الأمانة والعهد والشهادة والصلاة\n3. يحفظ الآيات (32–35) حفظًا متقنًا\n4. يتلو الآيات (36–39) تلاوة صحيحة\n5. يصف موقف الكافرين من النبي صلى الله عليه وسلم\n6. يحفظ الآيات (36–39) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n7. يلتزم بأداء الأمانات والوفاء بالعهود\n8. يدرك أن الجنة بالإيمان والعمل لا بالأماني\n\nالحصة 5:\n1. يتلو الآيات (40–44) تلاوة صحيحة\n2. يصف حال الكافرين عند خروجهم من القبور\n3. يحفظ الآيات (40–44) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يستشعر قدرة الله تعالى على البعث\n\nالحصة 6:\n1. يتلو سورة المعارج كاملة من حفظه تلاوة صحيحة\n2. يربط بين مقاطع السورة وموضوعاتها\n3. يطبق ترقيق الراء في مواضعه من السورة\n\nمخرج تعليمي آخر:\n4. يقيّم تلاوته وتلاوة زملائه وفق معايير الإتقان", "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: تذكر\nالمخرج 8: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تذكر\nالمخرج 4: تقييم\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: تذكر\nالمخرج 8: تقييم\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: تذكر\nالمخرج 8: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: تذكر\nالمخرج 8: تقييم\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تقييم", "الحصة 1:\n1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. التعلم بالأقران\n4. التعلم المبني على اللعب\n5. الحوار والمناقشة\n\nالحصة 2:\n1. التعلم بالنمذجة\n2. التعلم التشاركي\n3. العصف الذهني\n4. التعلم التعاوني\n5. الخرائط المفاهيمية\n\nالحصة 3:\n1. التعلم بالنمذجة\n2. التعلم التشاركي\n3. الحوار والمناقشة\n4. التعلم التعاوني\n5. التعلم بالأقران\n\nالحصة 4:\n1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. لعب الأدوار\n4. التعلم التشاركي\n5. العصف الذهني\n\nالحصة 5:\n1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. الحوار والمناقشة\n\nالحصة 6:\n1. التعلم المبني على اللعب\n2. التعلم التعاوني\n3. التقويم الذاتي", "الحصة 1:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. السبورة التقليدية\n6. أخرى: بطاقات كلمات الآيات\n\nالحصة 2:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. السبورة التقليدية\n\nالحصة 3:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. السبورة التقليدية\n\nالحصة 4:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. السبورة التقليدية\n\nالحصة 5:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 6:\n1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقة معايير التلاوة", "الحصة 1:\n- المعارج: المصاعد والدرجات التي تصعد بها الملائكة إلى الله تعالى\n- الصبر الجميل: الصبر الذي لا شكوى فيه لغير الله\n- مقدار يوم القيامة: خمسون ألف سنة\n- المهل: المعدن المذاب أو عكر الزيت\n- العهن: الصوف المصبوغ المنفوش\n- الحميم: القريب الصديق\n\nالحصة 2:\n- يفتدي: يقدم فداءً ليخلص نفسه\n- صاحبته: زوجته\n- فصيلته: عشيرته الأقربون\n- تؤويه: تضمه وتحميه\n- لظى: اسم من أسماء النار\n- الشوى: جلدة الرأس والأطراف\n- فأوعى: جمع المال في وعاء ومنع حق الله فيه\n\nالحصة 3:\n- هلوعًا: شديد الحرص قليل الصبر\n- جزوعًا: كثير الجزع\n- منوعًا: كثير المنع للخير\n- المحروم: المتعفف الذي لا يسأل\n- يصدقون بيوم الدين: يؤمنون بيوم الحساب\n- مشفقون: خائفون\n- العادون: المتجاوزون حدود الله\n\nالحصة 4:\n- راعون: حافظون مؤدون\n- قائمون: يؤدونها بالحق دون كتمان\n- مكرمون: منعمون بالتكريم\n- مهطعين: مسرعين مادين أعناقهم\n- عزين: جماعات متفرقة\n- جنة نعيم: جنة يتنعم فيها\n\nالحصة 5:\n- المشارق والمغارب: مشارق الشمس ومغاربها طوال العام\n- الأجداث: القبور\n- يوفضون: يسرعون\n- ترهقهم: تغشاهم\n\nالحصة 6:\n- مقاطع السورة: العذاب الواقع، أهوال القيامة، طبيعة الإنسان، صفات المصلين، موقف الكافرين\n- معايير الإتقان: صحة الحفظ، سلامة النطق، تطبيق الأحكام", "الحصة 1:\n- المعلم: يعرض صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)\n- الطالب: يتأمل الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها\n\nالحصة 2:\n- المعلم: يعرض على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة\n- الطالب: يذكر أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة\n\nالحصة 3:\n- المعلم: يعرض موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟\n- الطالب: يقارن بين الموقفين ويعلل\n\nالحصة 4:\n- المعلم: يعرض موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة\n- الطالب: يجيب ويتوقع موضوع الآيات\n\nالحصة 5:\n- المعلم: يعرض صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟\n- الطالب: يلاحظ ويربط بقوله «برب المشارق والمغارب»\n\nالحصة 6:\n- المعلم: يعرض على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه\n- الطالب: يربط المقاطع بآياتها", "الحصة 1:\nالتهيئة (3 دقائق):\n- المعلم: يعرض صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)\n- الطالب: يتأمل الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الطلبة التلاوة النموذجية للآيات (1–5) من الوسائل المتعددة ثم يقرأ بنفسه بتأنٍّ مبرزًا المد في «سائل» و«واقع»\n- الطالب: يستمع منصتًا ويتابع في المصحف ويضع إصبعه على موضع القراءة\n\nالتلاوة الجماعية والفردية (6 دقائق):\n- المعلم: يقرأ الآيات مع الطلبة جماعيًا ثم يستمع لقراءات فردية ويكلف القارئ المتقن بتصويب زميله (تعلم بالأقران)\n- الطالب: يقرأ جماعيًا ثم فرديًا ويصحح لزميله بأدب\n\nأتعرف المعنى (3 دقائق):\n- المعلم: يناقش معاني: سأل سائل، دافع، المعارج، تعرج، والروح (جبريل عليه السلام)\n- الطالب: يستخرج معنى كل كلمة ويدونها في كراسته\n\nالحفظ بالتكرار (4 دقائق):\n- المعلم: يقسم الآيات إلى مقطعين (1–3) و(4–5) ويوجه للتكرار المتدرج ثم يجري تسميعًا ثنائيًا\n- الطالب: يكرر المقطع ويسمّعه لزميله ثم يسمع الآيات كاملة\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع التلاوة النموذجية للآيات (6–10) ويقف على مواضع التفخيم مثل «قريبا» و«الجبال»\n- الطالب: يستمع ويتابع ويحدد حروف الاستعلاء في الآيات\n\nالتلاوة الجماعية والفردية (6 دقائق):\n- المعلم: يوجه لقراءة جماعية ثم فردية ويصحح الأخطاء فورًا مع بيان سببها\n- الطالب: يقرأ ويصحح نطقه للكلمات مثل «كالمهل» و«كالعهن»\n\nلعبة ترتيب الآيات (4 دقائق):\n- المعلم: يوزع بطاقات كلمات الآيات المبعثرة على المجموعات ويطلب ترتيبها حسب المصحف في زمن محدد\n- الطالب: يرتب البطاقات مع مجموعته ويقرأ الآيات بعد ترتيبها\n\nالحفظ والتسميع (3 دقائق):\n- المعلم: يوجه لحفظ الآيات بالتكرار ثم يسمعها من الطلبة بالتناوب\n- الطالب: يحفظ الآيات ويسمّعها\n\nالتقويم الختامي والغلق (3 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويختم بسؤال: كيف أستعد ليوم الحساب؟\n- الطالب: يجيب عن الأسئلة ويذكر عملًا صالحًا يستعد به\n\nالحصة 2:\nالتهيئة (3 دقائق):\n- المعلم: يعرض على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة\n- الطالب: يذكر أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يعرض التلاوة النموذجية للآيات (11–14) مع إبراز الإظهار في «من عذاب»\n- الطالب: يستمع ويحدد مواضع الوقف والابتداء\n\nالتلاوة الفردية والتصحيح (6 دقائق):\n- المعلم: يستمع لتلاوات فردية ويوجه الطلبة لتصويب بعضهم مستخدمًا قائمة رصد للأخطاء\n- الطالب: يتلو ويصوّب ويسجل أخطاءه ليعالجها\n\nأفهم وأتدبر (4 دقائق):\n- المعلم: يناقش مع الطلبة ترتيب من يفتدي بهم المجرم (البنون، الصاحبة، الأخ، الفصيلة، من في الأرض) ودلالته\n- الطالب: يستخرج ترتيب المفتدى بهم ويستنتج شدة الهول\n\nالحفظ (3 دقائق):\n- المعلم: يوجه لحفظ الآيات بطريقة التكرار والربط بالمعنى\n- الطالب: يحفظ الآيات ويسمعها لزميله\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الآيات (15–18) ويركز على مد «إنها» ونطق «لظى» و«للشوى»\n- الطالب: يستمع ويكرر الكلمات الصعبة\n\nالتلاوة الجماعية والفردية (6 دقائق):\n- المعلم: ينظم قراءة تبادلية بين صفوف الطلبة ثم قراءات فردية\n- الطالب: يقرأ بالتبادل ثم فرديًا\n\nخريطة صفات أهل النار (4 دقائق):\n- المعلم: يرسم على السبورة خريطة مفاهيمية: من أدبر، تولى، جمع، أوعى، ويطلب من المجموعات إكمالها بمعنى كل صفة\n- الطالب: يكمل الخريطة مع مجموعته ويشرح معنى كل صفة\n\nالحفظ والتسميع (3 دقائق):\n- المعلم: يسمع الآيات من الطلبة ويعزز المتقنين\n- الطالب: يسمع الآيات (15–18)\n\nالتقويم الختامي والغلق (3 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويختم بدعاء النجاة من النار\n- الطالب: يجيب ويردد الدعاء\n\nالحصة 3:\nالتهيئة (3 دقائق):\n- المعلم: يعرض موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟\n- الطالب: يقارن بين الموقفين ويعلل\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع التلاوة ويبين الوقف على «هلوعا» و«جزوعا» و«منوعا» بإبدال التنوين ألفًا\n- الطالب: يستمع ويطبق الوقف الصحيح\n\nالتلاوة والتصحيح (6 دقائق):\n- المعلم: يستمع لقراءات فردية ويصحح ويثني على المتقن\n- الطالب: يقرأ ويصحح\n\nأتدبر الصفات (4 دقائق):\n- المعلم: يناقش صفات الإنسان (هلوع، جزوع، منوع) ثم يستخرج مع الطلبة أول صفتين للمصلين: الدوام على الصلاة والحق المعلوم في المال\n- الطالب: يستخرج الصفات من الآيات ويمثل لكل منها\n\nالحفظ (3 دقائق):\n- المعلم: يقسم الآيات (19–21) و(22–25) ويوجه للتكرار\n- الطالب: يحفظ ويسمع لزميله\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع التلاوة ويحدد مواضع الألف المدية المرققة كما في «يصدقون» و«ربهم» والمفخمة في «حافظون»\n- الطالب: يستمع ويضع خطًا تحت الألف المدية في كراسته\n\nالتلاوة الثنائية (6 دقائق):\n- المعلم: يوزع الطلبة أزواجًا يقرأ أحدهما ويصحح الآخر ثم يتبادلان\n- الطالب: يقرأ ويصحح لزميله\n\nأستخرج الصفات (4 دقائق):\n- المعلم: يناقش صفات: التصديق بيوم الدين، الخوف من عذاب الله، حفظ الفروج، ويوضح معنى العفة بأسلوب مناسب\n- الطالب: يستخرج الصفات ويبين أثر كل صفة في السلوك\n\nالحفظ (3 دقائق):\n- المعلم: يوجه لحفظ الآيات بالربط بين الصفات وتسلسلها\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (3 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويثني على المتقنين\n- الطالب: يجيب عن الأسئلة\n\nالحصة 4:\nالتهيئة (3 دقائق):\n- المعلم: يعرض موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة\n- الطالب: يجيب ويتوقع موضوع الآيات\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الآيات (32–35) ويبرز المد في «لأماناتهم» و«بشهاداتهم»\n- الطالب: يستمع ويتابع\n\nالتلاوة والتصحيح (6 دقائق):\n- المعلم: يستمع لقراءات فردية ويتابع تطبيق الغنة في «إنما» إن وجدت وأحكام المد\n- الطالب: يقرأ ويصحح\n\nلعب أدوار (4 دقائق):\n- المعلم: يكلف مجموعات بتمثيل مواقف قصيرة: أداء الأمانة، الوفاء بالوعد، أداء الشهادة بالحق\n- الطالب: يمثل الموقف ويربطه بالآية المناسبة\n\nالحفظ (3 دقائق):\n- المعلم: يوجه لحفظ الآيات ثم يسمعها\n- الطالب: يحفظ ويسمع\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الآيات ويوضح نطق «مهطعين» و«عزين»\n- الطالب: يستمع ويكرر\n\nالتلاوة الجماعية والفردية (6 دقائق):\n- المعلم: يقرأ مع الطلبة ثم يوزع التلاوة على المجموعات\n- الطالب: يقرأ مع مجموعته وفرديًا\n\nأتدبر وأناقش (4 دقائق):\n- المعلم: يناقش سؤال: «أيطمع كل امرئ منهم أن يدخل جنة نعيم»: لماذا ردت الآية بـ«كلا»؟\n- الطالب: يحلل الآية ويستنتج أن الجنة لا تنال بالتمني\n\nالحفظ (3 دقائق):\n- المعلم: يوجه لحفظ الآيات ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (3 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب\n\nالحصة 5:\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟\n- الطالب: يلاحظ ويربط بقوله «برب المشارق والمغارب»\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات ويبين الإخفاء في «من الأجداث» والإظهار في «من عذاب» عند مراجعتها\n- الطالب: يستمع ويحدد المواضع\n\nالتلاوة الفردية (10 دقائق):\n- المعلم: يستمع لقراءات فردية متقنة ويعالج الأخطاء الشائعة\n- الطالب: يقرأ فرديًا\n\nصورة يوم الخروج (7 دقائق):\n- المعلم: يناقش مع الطلبة مشهد الخروج من القبور: سراعًا، خاشعة أبصارهم، ترهقهم ذلة\n- الطالب: يستخرج عناصر المشهد ويعبر عنه بأسلوبه\n\nالحفظ (5 دقائق):\n- المعلم: يوجه لحفظ الآيات ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويعلن موعد التسميع الشامل للسورة\n- الطالب: يجيب ويستعد للتسميع\n\nالحصة 6:\nالتهيئة (5 دقائق):\n- المعلم: يعرض على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه\n- الطالب: يربط المقاطع بآياتها\n\nالتسميع الشامل (15 دقيقة):\n- المعلم: يسمع السورة من الطلبة على مقاطع مستخدمًا بطاقة معايير التلاوة ويرصد الدرجات\n- الطالب: يسمع المقطع المطلوب منه ويقيّم نفسه بالبطاقة\n\nتطبيق ترقيق الراء (8 دقائق):\n- المعلم: يوجه المجموعات لاستخراج راءات مرققة من السورة مثل «الكافرين» و«الشر» ثم يعللها\n- الطالب: يستخرج المواضع ويعلل الترقيق\n\nمسابقة المجموعات (7 دقائق):\n- المعلم: ينفذ مسابقة المجموعات بأسئلة السورة كاملة على السبورة الذكية\n- الطالب: يشارك مجموعته في الإجابة\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويعلن المتميزين في الحفظ\n- الطالب: يجيب ويحتفي بزملائه المتميزين", "الحصة 1:\nس1 (مستوى المعرفة): ما عدد آيات سورة المعارج؟\nالإجابة: 44 آية.\n\nس2 (مستوى التطبيق): ما المقصود بقوله تعالى: «من الله ذي المعارج»؟\nالإجابة: من الله صاحب المصاعد والدرجات العلا التي تصعد فيها الملائكة إليه.\n\nس3 (مستوى الاستدلال): لماذا وُصف الصبر في الآية الخامسة بأنه جميل؟\nالإجابة: لأنه صبر لا جزع فيه ولا شكوى إلا إلى الله تعالى.\n\nس4 (مستوى المعرفة): ما معنى كلمة «العهن» في قوله تعالى: «وتكون الجبال كالعهن»؟\nالإجابة: الصوف المصبوغ المنفوش.\n\nس5 (مستوى التطبيق): بمَ شبهت الآيات السماء يوم القيامة؟\nالإجابة: بالمهل وهو المعدن المذاب.\n\nس6 (مستوى الاستدلال): علل: لا يسأل القريب قريبه يوم القيامة.\nالإجابة: لانشغال كل إنسان بنفسه من شدة الهول.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما معنى «فصيلته»؟\nالإجابة: عشيرته الأقربون.\n\nس2 (مستوى التطبيق): بمن يود المجرم أن يفتدي من عذاب يوم القيامة؟\nالإجابة: ببنيه وصاحبته وأخيه وفصيلته ومن في الأرض جميعًا.\n\nس3 (مستوى الاستدلال): ماذا تدل عليه رغبة المجرم في الافتداء بأحب الناس إليه؟\nالإجابة: تدل على شدة العذاب وهول الموقف حتى يتخلى الإنسان عن أحبابه لينجو بنفسه.\n\nس4 (مستوى المعرفة): ما معنى «لظى»؟\nالإجابة: اسم من أسماء النار.\n\nس5 (مستوى التطبيق): من الذين تدعوهم النار كما في الآية 17؟\nالإجابة: من أدبر عن الحق وتولى عن الطاعة.\n\nس6 (مستوى الاستدلال): ما العلاقة بين قوله تعالى «وجمع فأوعى» وخلق البخل؟\nالإجابة: أن من جمع المال ومنع حق الله فيه بخلًا كان من أهل النار.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما معنى «هلوعا»؟\nالإجابة: شديد الحرص قليل الصبر.\n\nس2 (مستوى التطبيق): من المستثنون من صفة الهلع كما في الآية 22؟\nالإجابة: المصلون.\n\nس3 (مستوى الاستدلال): ما الفرق بين السائل والمحروم؟\nالإجابة: السائل الذي يطلب العطاء، والمحروم المتعفف الذي لا يسأل.\n\nس4 (مستوى المعرفة): ما معنى «مشفقون»؟\nالإجابة: خائفون.\n\nس5 (مستوى التطبيق): اذكر صفة من صفات المؤمنين وردت في الآية 26.\nالإجابة: يصدقون بيوم الدين.\n\nس6 (مستوى الاستدلال): لماذا وصف عذاب الله بأنه «غير مأمون»؟\nالإجابة: لأنه لا يأمن أحد أن يقع فيه، فيبقى المؤمن خائفًا راجيًا.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما معنى «راعون»؟\nالإجابة: حافظون مؤدون لها.\n\nس2 (مستوى التطبيق): ما جزاء أصحاب الصفات المذكورة كما في الآية 35؟\nالإجابة: في جنات مكرمون.\n\nس3 (مستوى الاستدلال): لماذا ختمت صفات المؤمنين بالمحافظة على الصلاة كما بدأت بالدوام عليها؟\nالإجابة: لبيان عظيم منزلة الصلاة وأنها أساس الصفات كلها.\n\nس4 (مستوى المعرفة): ما معنى «عزين»؟\nالإجابة: جماعات متفرقة.\n\nس5 (مستوى التطبيق): كيف كان الكافرون يقبلون نحو النبي صلى الله عليه وسلم؟\nالإجابة: مسرعين جماعات عن اليمين وعن الشمال.\n\nس6 (مستوى الاستدلال): ما الذي ردت عليه كلمة «كلا» في الآية 39؟\nالإجابة: ردت على طمعهم في دخول الجنة دون إيمان وعمل.\n\nالحصة 5:\nس1 (مستوى المعرفة): ما معنى «الأجداث»؟\nالإجابة: القبور.\n\nس2 (مستوى التطبيق): كيف يخرج الناس من القبور كما وصفت الآية 43؟\nالإجابة: سراعًا كأنهم إلى نصب يوفضون.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (40–41) على قدرة الله تعالى؟\nالإجابة: أنه سبحانه قادر على أن يبدل خيرًا منهم وما هو بمسبوق.\n\nالحصة 6:\nس1 (مستوى المعرفة): كم عدد آيات سورة المعارج؟ وما الآية التي تبدأ بها صفات المصلين؟\nالإجابة: 44 آية، وتبدأ الصفات من الآية 22 «إلا المصلين».\n\nس2 (مستوى التطبيق): لماذا رققت الراء في كلمة «الكافرين»؟\nالإجابة: لأنها مكسورة.\n\nس3 (مستوى الاستدلال): صنف آيات السورة إلى مقطعين: ترهيب وترغيب، مع مثال لكل منهما.\nالإجابة: ترهيب: «كلا إنها لظى»، ترغيب: «أولئك في جنات مكرمون».", "الحصة 1:\nس1 (مستوى المعرفة): اتلُ الآيات (1–3) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة متقنة.\n\nس2 (مستوى التطبيق): كم مقدار اليوم الذي تعرج فيه الملائكة والروح إليه؟\nالإجابة: خمسون ألف سنة.\n\nس3 (مستوى الاستدلال): اقترح موقفًا من حياتك تطبق فيه الصبر الجميل.\nالإجابة: مثل: الصبر على المرض أو على تأخر النتيجة دون تذمر مع الدعاء والأخذ بالأسباب.\n\nس4 (مستوى المعرفة): أكمل: «إنهم يرونه بعيدا ...».\nالإجابة: «ونراه قريبا».\n\nس5 (مستوى التطبيق): اذكر صورتين من أهوال يوم القيامة وردتا في الآيات (8–10).\nالإجابة: السماء كالمهل، والجبال كالعهن، ولا يسأل حميم حميما.\n\nس6 (مستوى الاستدلال): «يرونه بعيدا ونراه قريبا»: ما الدرس المستفاد لك من هذه المقابلة؟\nالإجابة: أن يوم القيامة قريب مهما ظنه الناس بعيدًا، فأبادر بالتوبة والعمل الصالح.\n\nالحصة 2:\nس1 (مستوى المعرفة): اتلُ الآيات (11–14) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): أكمل: «وفصيلته التي ...».\nالإجابة: «تؤويه».\n\nس3 (مستوى الاستدلال): هل تنفع القرابة الإنسان يوم القيامة إن لم يعمل صالحًا؟ علل.\nالإجابة: لا تنفعه، لأن كل نفس بما كسبت رهينة والنجاة بالإيمان والعمل الصالح.\n\nس4 (مستوى المعرفة): أكمل: «كلا إنها لظى ...».\nالإجابة: «نزاعة للشوى».\n\nس5 (مستوى التطبيق): اذكر صفتين لمن تدعوهم النار.\nالإجابة: أدبر وتولى، وجمع فأوعى.\n\nس6 (مستوى الاستدلال): كيف يحمي المسلم نفسه من صفة «جمع فأوعى»؟\nالإجابة: بإخراج الزكاة والصدقة وأداء حق المال.\n\nالحصة 3:\nس1 (مستوى المعرفة): أكمل: «إذا مسه الشر جزوعا ...».\nالإجابة: «وإذا مسه الخير منوعا».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المصلين وردتا في الآيات (23–25).\nالإجابة: الدوام على الصلاة، وفي أموالهم حق معلوم للسائل والمحروم.\n\nس3 (مستوى الاستدلال): كيف تعالج الصلاة الدائمة صفة الهلع في الإنسان؟\nالإجابة: تربطه بالله فيطمئن قلبه، فيصبر عند الشر ويجود عند الخير.\n\nس4 (مستوى المعرفة): أكمل: «والذين هم من عذاب ربهم ...».\nالإجابة: «مشفقون».\n\nس5 (مستوى التطبيق): حدد كلمة فيها ألف مدية مفخمة من الآية 29.\nالإجابة: «حافظون».\n\nس6 (مستوى الاستدلال): ما أثر التصديق بيوم الدين في سلوك المسلم؟\nالإجابة: يجعله يراقب الله في أقواله وأفعاله ويستعد للحساب.\n\nالحصة 4:\nس1 (مستوى المعرفة): أكمل: «والذين هم بشهاداتهم ...».\nالإجابة: «قائمون».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المؤمنين في الآيتين (32–33).\nالإجابة: رعاية الأمانة والعهد، والقيام بالشهادة.\n\nس3 (مستوى الاستدلال): صديقك وعدك بموعد ثم تأخر دون عذر، كيف تنصحه في ضوء الآية 32؟\nالإجابة: أذكره بأن الوفاء بالعهد من صفات المؤمنين وأن رعايته من الإيمان.\n\nس4 (مستوى المعرفة): أكمل: «أيطمع كل امرئ منهم ...».\nالإجابة: «أن يدخل جنة نعيم».\n\nس5 (مستوى التطبيق): ما معنى «مهطعين»؟\nالإجابة: مسرعين مادين أعناقهم.\n\nس6 (مستوى الاستدلال): زميلك يقول: سأدخل الجنة لأني من أسرة صالحة، بمَ ترد عليه من الآيات؟\nالإجابة: أرد بقوله تعالى «أيطمع كل امرئ منهم أن يدخل جنة نعيم كلا»، فالجنة بالإيمان والعمل.\n\nالحصة 5:\nس1 (مستوى المعرفة): أكمل: «خاشعة أبصارهم ترهقهم ذلة ...».\nالإجابة: «ذلك اليوم الذي كانوا يوعدون».\n\nس2 (مستوى التطبيق): ما معنى «يوفضون»؟\nالإجابة: يسرعون.\n\nس3 (مستوى الاستدلال): لماذا ختمت السورة بذكر اليوم الموعود وقد بدأت بالسؤال عن العذاب الواقع؟\nالإجابة: للتأكيد أن العذاب الذي استبعدوه واقع لا محالة في اليوم الذي وعدوا به.\n\nالحصة 6:\nس1 (مستوى المعرفة): اتلُ الآيات (22–35) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): اذكر ثلاث صفات من صفات المصلين.\nالإجابة: الدوام على الصلاة، أداء حق المال، التصديق بيوم الدين.\n\nس3 (مستوى الاستدلال): اختر صفة من صفات المصلين وضع خطة أسبوعية لتطبيقها.\nالإجابة: مثل المحافظة على الصلاة: أداؤها في أول وقتها ومتابعة ذلك في جدول يومي.", "الحصة 1:\n- للطالب: يكرر تلاوة الآيات (1–5) في المنزل ويحفظها لتسميعها في الحصة القادمة\n- لولي الأمر: يستمع لتلاوة ابنه للآيات (1–5) ويشجعه على الحفظ بالاستماع لتلاوة مجودة\n- للطالب: يراجع الآيات (1–10) ويكتب معاني كلمتي المهل والعهن\n- لولي الأمر: يتابع حفظ ابنه للآيات (1–10) ويستمع إليه مرة يوميًا\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=1\n\nالحصة 2:\n- للطالب: يحفظ الآيات (11–14) ويربطها بما سبقها ويسمع الآيات (1–14)\n- لولي الأمر: ي يحة المجاوزة للحد\n- صرصر: شديدة البرد والصوت\n- حسومًا: متتابعة\n- أخذة رابية: أخذة شديدة زائدة\n- الجارية: السفينة\n- واعية: حافظة لما تسمع\n- دكتا: سحقتا وسويتا بالأرض\n- واهية: ضعيفة ممزقة\n- أرجائها: جوانبها\n\nالحصة 2:\n- هاؤم: خذوا\n- قطوفها دانية: ثمارها قريبة\n- أسلفتم: قدمتم\n- القاضية: الموتة التي لا بعث بعدها\n- سلطانيه: حجتي وقوتي\n- فغلوه: اجمعوا يديه إلى عنقه بالأغلال\n- صلوه: أدخلوه\n- فاسلكوه: أدخلوه\n- حميم: قريب ينفعه\n- غسلين: صديد أهل النار\n\nالحصة 3:\n- رسول كريم: النبي محمد صلى الله عليه وسلم المبلغ عن ربه\n- تقوّل: افترى\n- الوتين: عرق متصل بالقلب\n- حاجزين: مانعين\n\nالحصة 4:\n- حق اليقين: اليقين الثابت الذي لا شك فيه\n- حسرة: ندم شديد\n- فسبح: نزّه الله تعالى عما لا يليق به", "الحصة 1:\n- المعلم: يعرض على السبورة الذكية أسماء ثلاث أمم (ثمود، عاد، قوم فرعون) ويسأل: ماذا تعرف عنها؟\n- الطالب: يذكر ما يعرفه عن هذه الأمم\n\nالحصة 2:\n- المعلم: يعرض جدولًا فارغًا بعمودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق\n- الطالب: يتوقع ويدون\n\nالحصة 3:\n- المعلم: يعرض على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟\n- الطالب: يعصف ذهنيًا بالإجابات\n\nالحصة 4:\n- المعلم: يتلو الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟\n- الطالب: يجيب ويتوقع سبب الختم بالتسبيح", "الحصة 1:\nالتهيئة (3 دقائق):\n- المعلم: يعرض على السبورة الذكية أسماء ثلاث أمم (ثمود، عاد، قوم فرعون) ويسأل: ماذا تعرف عنها؟\n- الطالب: يذكر ما يعرفه عن هذه الأمم\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الآيات (1–10) ويبرز تفخيم الراء في «صرصر» الأولى وترقيقها في الثانية المكسورة\n- الطالب: يستمع ويحدد موضع الراءين\n\nالتلاوة الجماعية والفردية (6 دقائق):\n- المعلم: يقرأ مع الطلبة ثم يستمع لقراءات فردية ويصحح\n- الطالب: يقرأ ويصحح\n\nخريطة الأمم المكذبة (4 دقائق):\n- المعلم: يرسم جدولًا: الأمة، نوع العذاب، ويطلب من المجموعات إكماله من الآيات\n- الطالب: يكمل الجدول: ثمود بالطاغية، عاد بالريح، فرعون بالأخذة الرابية\n\nالحفظ (3 دقائق):\n- المعلم: يقسم الآيات (1–5) و(6–10) ويوجه للحفظ\n- الطالب: يحفظ ويسمع\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الآيات (11–18) ويبين تفخيم الراء المفتوحة في «ربك» و«تذكرة»، والساكنة بعد فتح في «عرش» و«الأرض»\n- الطالب: يستمع ويحدد حكم الراء في «ربك» و«عرش»\n\nالتلاوة الفردية (6 دقائق):\n- المعلم: يستمع لقراءات فردية ويصحح النطق في «نفخة» و«دكتا»\n- الطالب: يقرأ ويصحح\n\nترتيب الأحداث (4 دقائق):\n- المعلم: يوزع بطاقات أحداث يوم القيامة (النفخ، دك الأرض والجبال، انشقاق السماء، العرض) ويطلب ترتيبها حسب الآيات\n- الطالب: يرتب البطاقات ويقرأ الآية الدالة على كل حدث\n\nالحفظ (3 دقائق):\n- المعلم: يوجه لحفظ الآيات ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (3 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب\n\nالحصة 2:\nالتهيئة (3 دقائق):\n- المعلم: يعرض جدولًا فارغًا بعمودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق\n- الطالب: يتوقع ويدون\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الآيات ويبين الوقف بهاء السكت في «كتابيه» و«حسابيه» و«ماليه» و«سلطانيه»\n- الطالب: يستمع ويطبق الوقف بالهاء\n\nالتلاوة الثنائية (6 دقائق):\n- المعلم: يوزع الطلبة أزواجًا: أحدهما يقرأ آيات أصحاب اليمين والآخر آيات أصحاب الشمال\n- الطالب: يقرأ ويصحح لزميله\n\nأقارن (4 دقائق):\n- المعلم: يوجه المجموعات لإكمال جدول المقارنة: القول، المكان، الحال\n- الطالب: يكمل الجدول من الآيات\n\nالحفظ (3 دقائق):\n- المعلم: يقسم المقطع إلى (19–24) و(25–29) ويوجه للحفظ\n- الطالب: يحفظ ويسمع\n\nالتلاوة النموذجية (4 دقائق):\n- المعلم: يُسمع الآيات ويبين تفخيم الراء المفتوحة في «ذرعها» وإخفاء التنوين في «سلسلة ذرعها»\n- الطالب: يستمع ويحدد حكم الراء في «ذرعها»\n\nالتلاوة الجماعية والفردية (6 دقائق):\n- المعلم: يقرأ مع الطلبة ثم يستمع لقراءات فردية\n- الطالب: يقرأ ويصحح\n\nأسباب العذاب (4 دقائق):\n- المعلم: يطرح مشكلة: لماذا استحق الكافر هذا العذاب؟ ويوجه لاستخراج السببين من الآيتين (33–34)\n- الطالب: يستخرج: عدم الإيمان بالله العظيم، وعدم الحض على طعام المسكين\n\nالحفظ (3 دقائق):\n- المعلم: يوجه للحفظ ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (3 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويقترح مبادرة صفية لإطعام المحتاجين\n- الطالب: يجيب ويشارك في الاقتراح\n\nالحصة 3:\nالتهيئة (5 دقائق):\n- المعلم: يعرض على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟\n- الطالب: يعصف ذهنيًا بالإجابات\n\nالتلاوة النموذجية (8 دقائق):\n- المعلم: يُسمع الآيات ويبين تفخيم الراء في «رسول» لأنها مفتوحة وترقيقها في «شاعر» عند الوصل لأنها مكسورة\n- الطالب: يستمع ويطبق\n\nالتلاوة الفردية (10 دقائق):\n- المعلم: يستمع لقراءات فردية ويتابع تطبيق أحكام الراء\n- الطالب: يقرأ ويصحح\n\nأدلة صدق القرآن (7 دقائق):\n- المعلم: يناقش مع الطلبة نفي الشعر والكهانة والتقول، ويستخرج معهم أن القرآن تنزيل من رب العالمين\n- الطالب: يستخرج الأدلة ويكتبها في خريطة\n\nالحفظ (5 دقائق):\n- المعلم: يوجه للحفظ ويسمع\n- الطالب: يحفظ ويسمع\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب\n\nالحصة 4:\nالتهيئة (5 دقائق):\n- المعلم: يتلو الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟\n- الطالب: يجيب ويتوقع سبب الختم بالتسبيح\n\nالتلاوة والحفظ (8 دقائق):\n- المعلم: يُسمع الآيات (48–52) ويوجه لحفظها سريعًا لقصرها\n- الطالب: يستمع ويحفظ\n\nالتسميع الشامل (15 دقيقة):\n- المعلم: يسمع السورة كاملة من الطلبة على مقاطع باستخدام بطاقة معايير التلاوة\n- الطالب: يسمع ويقيم نفسه\n\nمسابقة المجموعات (7 دقائق):\n- المعلم: ينفذ مسابقة المجموعات بأسئلة السورة على السبورة الذكية\n- الطالب: يشارك مع مجموعته\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي ويكرم المتقنين\n- الطالب: يجيب", "الحصة 1:\nس1 (مستوى المعرفة): كم عدد آيات سورة الحاقة؟\nالإجابة: 52 آية.\n\nس2 (مستوى التطبيق): بمَ أهلكت ثمود؟\nالإجابة: بالطاغية وهي الصيحة الشديدة.\n\nس3 (مستوى الاستدلال): كيف صورت الآية 7 حال قوم عاد بعد هلاكهم؟\nالإجابة: صرعى كأنهم أعجاز نخل خاوية.\n\nس4 (مستوى المعرفة): ما المقصود بـ«الجارية» في الآية 11؟\nالإجابة: السفينة.\n\nس5 (مستوى التطبيق): ما أول أحداث يوم القيامة المذكورة في الآيات (13–18)؟\nالإجابة: النفخ في الصور نفخة واحدة.\n\nس6 (مستوى الاستدلال): ما دلالة قوله تعالى: «لا تخفى منكم خافية»؟\nالإجابة: أن الله يعلم كل شيء فلا يخفى عليه من أعمال العباد شيء.\n\nالحصة 2:\nس1 (مستوى المعرفة): ماذا يقول من أوتي كتابه بيمينه؟\nالإجابة: «هاؤم اقرءوا كتابيه».\n\nس2 (مستوى التطبيق): ما معنى «قطوفها دانية»؟\nالإجابة: ثمارها قريبة سهلة التناول.\n\nس3 (مستوى الاستدلال): ما الذي ندم عليه صاحب الشمال كما في الآيتين (28–29)؟\nالإجابة: أن ماله وسلطانه لم يغنيا عنه شيئًا.\n\nس4 (مستوى المعرفة): ما معنى «غسلين»؟\nالإجابة: صديد أهل النار.\n\nس5 (مستوى التطبيق): اذكر سببي عذاب الكافر كما في الآيتين (33–34).\nالإجابة: لا يؤمن بالله العظيم، ولا يحض على طعام المسكين.\n\nس6 (مستوى الاستدلال): لماذا قرن الله ترك الحض على إطعام المسكين بعدم الإيمان؟\nالإجابة: لعظم حق المسكين ولأن الرحمة بالفقراء من ثمار الإيمان.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما معنى «الوتين»؟\nالإجابة: عرق متصل بالقلب إذا قطع مات صاحبه.\n\nس2 (مستوى التطبيق): ما التهمتان اللتان نفتهما الآيتان (41–42) عن القرآن؟\nالإجابة: أنه قول شاعر، وأنه قول كاهن.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (44–47) على أن النبي صلى الله عليه وسلم لم يفترِ القرآن؟\nالإجابة: أنه لو تقول على الله لعاقبه الله وقطع منه الوتين ولم يمنعه أحد.\n\nالحصة 4:\nس1 (مستوى المعرفة): بمَ وصف القرآن في الآية 48؟\nالإجابة: بأنه تذكرة للمتقين.\n\nس2 (مستوى التطبيق): بمَ ختمت سورة الحاقة؟\nالإجابة: بالأمر بتسبيح الله: «فسبح باسم ربك العظيم».\n\nس3 (مستوى الاستدلال): لخص موضوعات سورة الحاقة في ثلاث نقاط.\nالإجابة: مصير الأمم المكذبة، أحداث القيامة وحال الفريقين، صدق القرآن الكريم.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: «وأما عاد فأهلكوا ...».\nالإجابة: «بريح صرصر عاتية».\n\nس2 (مستوى التطبيق): كم مدة الريح التي سخرت على عاد؟\nالإجابة: سبع ليال وثمانية أيام متتابعة.\n\nس3 (مستوى الاستدلال): ما العبرة التي تستفيدها من ذكر مصير الأمم المكذبة؟\nالإجابة: أن عاقبة التكذيب والمعصية الهلاك فأطيع الله ورسوله.\n\nس4 (مستوى المعرفة): أكمل: «يومئذ تعرضون ...».\nالإجابة: «لا تخفى منكم خافية».\n\nس5 (مستوى التطبيق): ما حكم الراء في كلمة «عرش»؟\nالإجابة: تفخيم، لأنها ساكنة بعد فتح.\n\nس6 (مستوى الاستدلال): كيف يؤثر الإيمان بالعرض على الله في سلوك الطالب أثناء الاختبار؟\nالإجابة: يجعله أمينًا لا يغش لعلمه أن الله مطلع عليه.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «فهو في عيشة ...».\nالإجابة: «راضية».\n\nس2 (مستوى التطبيق): اذكر نعمتين لأصحاب اليمين.\nالإجابة: جنة عالية، وقطوفها دانية.\n\nس3 (مستوى الاستدلال): ما الأعمال التي «أسلفتها» هذا الأسبوع وتتمنى أن تجدها في كتابك؟\nالإجابة: مثل: المحافظة على الصلاة وبر الوالدين ومساعدة زميل.\n\nس4 (مستوى المعرفة): أكمل: «إنه كان لا يؤمن ...».\nالإجابة: «بالله العظيم».\n\nس5 (مستوى التطبيق): كم ذراعًا طول السلسلة المذكورة في الآية 32؟\nالإجابة: سبعون ذراعًا.\n\nس6 (مستوى الاستدلال): اقترح عملًا تحض به غيرك على إطعام المسكين.\nالإجابة: مثل: الدعوة إلى حملة إفطار صائم أو التبرع بسلة غذائية.\n\nالحصة 3:\nس1 (مستوى المعرفة): أكمل: «تنزيل من ...».\nالإجابة: «رب العالمين».\n\nس2 (مستوى التطبيق): ما حكم الراء في كلمة «رسول»؟\nالإجابة: تفخيم لأنها مفتوحة.\n\nس3 (مستوى الاستدلال): كيف تدافع عن القرآن الكريم إذا سمعت من يشكك فيه؟\nالإجابة: أبين أنه تنزيل من رب العالمين وليس شعرًا ولا كهانة، وأستدل بالآيات.\n\nالحصة 4:\nس1 (مستوى المعرفة): اتلُ الآيات (48–52) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): ما معنى «حق اليقين»؟\nالإجابة: اليقين الثابت الذي لا شك فيه.\n\nس3 (مستوى الاستدلال): قيم تلاوتك للسورة وفق معايير الإتقان، واذكر ما تحتاج إلى تحسينه.\nالإجابة: يذكر الطالب مثلًا: إتقان الحفظ مع حاجة إلى ضبط الوقف بهاء السكت.", "الحصة 1:\n- للطالب: يحفظ الآيات (1–10) من سورة الحاقة\n- لولي الأمر: يستمع لتلاوة ابنه ويناقشه في قصص الأمم المذكورة\n- للطالب: يحفظ الآيات (11–18) ويراجع ما قبلها\n- لولي الأمر: يسمع من ابنه الآيات (1–18)\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2\n\nالحصة 2:\n- للطالب: يحفظ الآيات (19–29) ويطبق الوقف بهاء السكت\n- لولي الأمر: يناقش ابنه في الأعمال التي يحب أن يجدها في صحيفته\n- للطالب: يحفظ الآيات (30–37)\n- لولي الأمر: يشجع ابنه على المشاركة في عمل خيري لإطعام المحتاجين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2\n\nالحصة 3:\n- للطالب: يحفظ الآيات (38–47)\n- لولي الأمر: يستمع لتلا ف الحروف الآتية إلى مفخمة ومرققة: ق، س، ط، ب.\nالإجابة: مفخمة: ق، ط. مرققة: س، ب.\n\nس6 (مستوى الاستدلال): اذكر الحروف التي تفخم أحيانًا وترقق أحيانًا.\nالإجابة: الراء، ولام لفظ الجلالة، والألف المدية، والغنة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما أعلى مراتب التفخيم؟\nالإجابة: الحرف المفتوح الذي بعده ألف مثل «قال».\n\nس2 (مستوى التطبيق): رتب الكلمات الآتية حسب قوة التفخيم: قِيل، قَال، قُتل.\nالإجابة: قال، ثم قتل، ثم قيل.\n\nس3 (مستوى الاستدلال): لماذا كان المكسور أدنى مراتب التفخيم؟\nالإجابة: لأن الكسرة تنزل باللسان فيضعف امتلاء الفم بالصوت.", "الحصة 1:\nس1 (مستوى المعرفة): ما الترقيق؟\nالإجابة: نحول يدخل على صوت الحرف فلا يمتلئ الفم بصداه.\n\nس2 (مستوى التطبيق): انطق كلمتي «تين» و«طين» وبين الحرف المفخم.\nالإجابة: الطاء في «طين» مفخمة والتاء في «تين» مرققة.\n\nس3 (مستوى الاستدلال): ما أثر الخطأ في التفخيم والترقيق على قراءة القرآن الكريم؟\nالإجابة: قد يغير المعنى ويخل بصحة التلاوة، لذا يجب الحرص على إتقانه.\n\nس4 (مستوى المعرفة): هل الخاء حرف مفخم أم مرقق؟\nالإجابة: مفخم دائمًا لأنه من حروف الاستعلاء.\n\nس5 (مستوى التطبيق): استخرج حرفًا مفخمًا وآخر مرققًا من كلمة «قريبا».\nالإجابة: القاف مفخمة، والباء مرققة.\n\nس6 (مستوى الاستدلال): صمم بطاقة تعليمية تساعد زملاءك على حفظ أقسام الحروف من حيث التفخيم والترقيق.\nالإجابة: بطاقة تتضمن «خص ضغط قظ» للمفخمة، والحروف المتغيرة الأربعة، وأمثلة لكل قسم.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر مراتب التفخيم الخمس مرتبة.\nالإجابة: المفتوح بعده ألف، المفتوح ليس بعده ألف، المضموم، الساكن، المكسور.\n\nس2 (مستوى التطبيق): في أي مرتبة تفخم الصاد في كلمة «صبرا»؟\nالإجابة: المرتبة الثانية: مفتوح ليس بعده ألف.\n\nس3 (مستوى الاستدلال): استخرج من سورة المعارج كلمتين تمثلان مرتبتين مختلفتين وحدد مرتبتيهما.\nالإجابة: مثل: «واقع» القاف مكسورة في المرتبة الخامسة، «قريبا» القاف مفتوحة ليس بعدها ألف في المرتبة الثانية.", "الحصة 1:\n- للطالب: يراجع تعريفي التفخيم والترقيق ص 22 ويكتب أزواج كلمات يتغير معناها بالتفخيم\n- لولي الأمر: يساعد ابنه على نطق أزواج الكلمات نطقًا صحيحًا\n- للطالب: يحفظ عبارة «خص ضغط قظ» ويحل نشاط ص 24\n- لولي الأمر: يسمع من اب ة والرضا بقضاء الله\n\nأستخلص الدروس (10 دقائق):\n- المعلم: يوجه المجموعات لكتابة ثلاثة دروس من سيرته على لوحة الدروس\n- الطالب: يكتب الدروس ويعرضها\n\nمسابقة المجموعات (10 دقائق):\n- المعلم: ينفذ مسابقة المجموعات على السبورة الذكية بأسئلة الدرس كاملًا\n- الطالب: يشارك مع مجموعته\n\nالتقويم الختامي والغلق (5 دقائق):\n- المعلم: يطرح أسئلة التقويم الختامي\n- الطالب: يجيب", "الحصة 1:\nس1 (مستوى المعرفة): ما اسم أبي عبيدة بن الجراح؟\nالإجابة: عامر بن عبد الله بن الجراح.\n\nس2 (مستوى التطبيق): بمَ لقب النبي صلى الله عليه وسلم أبا عبيدة؟\nالإجابة: أمين هذه الأمة.\n\nس3 (مستوى الاستدلال): ما دلالة أن يكون أبو عبيدة من العشرة المبشرين بالجنة؟\nالإجابة: تدل على صدق إيمانه وعظيم منزلته عند الله.\n\nس4 (مستوى المعرفة): اذكر صفتين من صفات أبي عبيدة.\nالإجابة: الأمانة، والزهد.\n\nس5 (مستوى التطبيق): ماذا وجد عمر بن الخطاب في بيت أبي عبيدة بالشام؟\nالإجابة: سيفه وترسه ورحله.\n\nس6 (مستوى الاستدلال): ما الصفة التي يدل عليها موقفه يوم أحد؟ وعلل.\nالإجابة: الشجاعة وحب النبي صلى الله عليه وسلم، لأنه ضحى بأسنانه لإنقاذه.\n\nالحصة 2:\nس1 (مستوى المعرفة): في أي وباء توفي أبو عبيدة؟\nالإجابة: طاعون عمواس.\n\nس2 (مستوى التطبيق): اذكر درسًا مستفادًا من سيرته.\nالإجابة: الأمانة في أداء المسؤولية.\n\nس3 (مستوى الاستدلال): ما دلالة بقائه مع جنده في الطاعون؟\nالإجابة: تحمله المسؤولية ووفاؤه لجنده ورضاه بقضاء الله.", "الحصة 1:\nس1 (مستوى المعرفة): من أي قبيلة أبو عبيدة؟\nالإجابة: من قريش.\n\nس2 (مستوى التطبيق): اذكر محطة من محطات حياته.\nالإجابة: شهوده غزوة بدر وأحد، أو قيادته جيوش الشام.\n\nس3 (مستوى الاستدلال): صف بكلماتك صفات الشخص الأمين مستفيدًا من سيرة أبي عبيدة.\nالإجابة: يحفظ الحقوق ويؤدي ما اؤتمن عليه ولا يخون ولا يستغل منصبه.\n\nس4 (مستوى المعرفة): ما الصفة التي دل عليها خلو بيته من متاع الدنيا وهو أمير الشام؟\nالإجابة: الزهد.\n\nس5 (مستوى التطبيق): اذكر موقفًا يدل على تواضعه.\nالإجابة: عيشه البسيط مع أنه قائد الجيوش وأمير الشام.\n\nس6 (مستوى الاستدلال): كيف تقتدي بزهد أبي عبيدة في حياتك؟\nالإجابة: بالاعتدال في الشراء وعدم التفاخر بالمقتنيات.\n\nالحصة 2:\nس1 (مستوى المعرفة): في أي بلاد توفي أبو عبيدة؟\nالإجابة: في الشام.\n\nس2 (مستوى التطبيق): اذكر درسين من سيرة أبي عبيدة.\nالإجابة: الأمانة، والتواضع.\n\nس3 (مستوى الاستدلال): اكتب رسالة قصيرة إلى قائد فريقك المدرسي تستلهم فيها قيمة من سيرة أبي عبيدة.\nالإجابة: مثل: «كن أمينًا على وقت فريقك ومهامه كما كان أبو عبيدة أمينًا على الأمة».", "الحصة 1:\n- للطالب: يقرأ ص 153–154 ويكمل بطاقة التعريف\n- لولي الأمر: يحكي لابنه عن أمانة أبي عبيدة\n- للطالب: يقرأ ص 155–156 ويكتب موقفًا أعجبه من حياة أبي عبيدة\n- لولي الأمر: يحاور ابنه في التواضع والزهد\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=29\n\nالحصة 2:\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 157–158\n- لولي الأمر: يحاور ابنه في قيمة الأمانة وتحمل المسؤولية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=29"], "h": [["الدرس", "أبو عبيدة بن الجراح رضي الله عنه (سيرة)"], ["الوحدة", "الوحدة الرابعة"], ["صفحات كتاب الطالب", "153–158"], ["صفحات دليل المعلم", "173–178"], ["عدد الحصص", "3"]]}]});
let mode='sep',li=0,pi=0;
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fill(){const s=$('ls');D.L.forEach((l,i)=>{const o=el('option',null,(i+1)+'. '+l.t);o.value=i;s.appendChild(o)});s.onchange=()=>{li=+s.value;pi=0;render()}}
function render(){
 const l=D.L[li];
 $('mSep').classList.toggle('on',mode==='sep');$('mCom').classList.toggle('on',mode==='com');
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
 const tb=$('tabs');tb.innerHTML='';
 if(mode==='sep'){l.ps.forEach((p,i)=>{const b=el('button',i===pi?'on':'','الحصة '+p.n+': '+p.ax);b.onclick=()=>{pi=i;render()};tb.appendChild(b)})}
 const inf=$('info');inf.innerHTML='';
 const H=mode==='sep'?l.ps[pi].h:l.h;
 H.forEach(([k,v])=>{const d=el('div');const b=el('b',null,k+': ');d.appendChild(b);d.appendChild(document.createTextNode(v));inf.appendChild(d)});
 const F=mode==='sep'?l.ps[pi].f:l.c;
 const cs=$('cards');cs.innerHTML='';
 D.F.forEach((name,i)=>{const c=el('section','card');const h=el('h2');h.appendChild(el('span',null,(i+1)+'. '+name));
  const b=el('button','cp','نسخ');b.onclick=()=>copy(F[i],b);h.appendChild(b);c.appendChild(h);c.appendChild(el('div','txt',F[i]));cs.appendChild(c)});
}
function done(b){b.textContent='تم النسخ ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1600)}
function legacy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function copy(t,b){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(b),()=>{legacy(t)?done(b):manual(t)})}
 else{legacy(t)?done(b):manual(t)}
}
function manual(t){const ta=$('ta');ta.value=t;$('modal').classList.add('show');ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
$('close').onclick=()=>$('modal').classList.remove('show');
$('mSep').onclick=()=>{mode='sep';render()};$('mCom').onclick=()=>{mode='com';render()};
fill();render();
</script>
