–10) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يستعد ليوم القيامة بالعمل الصالح\n\nالحصة 3:\n1. يتلو الآيات (11–14) تلاوة صحيحة\n2. يستنتج حال المجرم يوم القيامة من الآيات\n3. يحفظ الآيات (11–14) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يحرص على النجاة بالإيمان والعمل لا بالأقارب\n\nالحصة 4:\n1. يتلو الآيات (15–18) تلاوة صحيحة\n2. يذكر صفات النار ومن تدعوهم\n3. يحفظ الآيات (15–18) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يحذر من الإعراض عن الحق ومن البخل\n\nالحصة 5:\n1. يتلو الآيات (19–25) تلاوة صحيحة\n2. يوضح طبيعة الإنسان الهلوع وصفات المصلين المستثنين منها\n3. يحفظ الآيات (19–25) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يداوم على الصلاة ويؤدي حق المال\n\nالحصة 6:\n1. يتلو الآيات (26–31) تلاوة صحيحة مراعيًا الألف المدية والغنة\n2. يستخرج صفات المؤمنين في الآيات\n3. يحفظ الآيات (26–31) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يحرص على العفة والخوف من عذاب الله\n\nالحصة 7:\n1. يتلو الآيات (32–35) تلاوة صحيحة\n2. يبين صفات المؤمنين في الأمانة والعهد والشهادة والصلاة\n3. يحفظ الآيات (32–35) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يلتزم بأداء الأمانات والوفاء بالعهود\n\nالحصة 8:\n1. يتلو الآيات (36–39) تلاوة صحيحة\n2. يصف موقف الكافرين من النبي صلى الله عليه وسلم\n3. يحفظ الآيات (36–39) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يدرك أن الجنة بالإيمان والعمل لا بالأماني\n\nالحصة 9:\n1. يتلو الآيات (40–44) تلاوة صحيحة\n2. يصف حال الكافرين عند خروجهم من القبور\n3. يحفظ الآيات (40–44) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n4. يستشعر قدرة الله تعالى على البعث\n\nالحصة 10:\n1. يتلو سورة المعارج كاملة من حفظه تلاوة صحيحة\n2. يربط بين مقاطع السورة وموضوعاتها\n3. يطبق ترقيق الراء في مواضعه من السورة\n\nمخرج تعليمي آخر:\n4. يقيّم تلاوته وتلاوة زملائه وفق معايير الإتقان", "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: صة 9:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 10:\n1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقة معايير التلاوة", "الحصة 1:\n- المعارج: المصاعد والدرجات التي تصعد بها الملائكة إلى الله تعالى\n- الصبر الجميل: الصبر الذي لا شكوى فيه لغير الله\n- مقدار يوم القيامة: خمسون ألف سنة\n\nالحصة 2:\n- المهل: المعدن المذاب أو عكر الزيت\n- العهن: الصوف المصبوغ المنفوش\n- الحميم: القريب الصديق\n\nالحصة 3:\n- يفتدي: يقدم فداءً ليخلص نفسه\n- صاحبته: زوجته\n- فصيلته: عشيرته الأقربون\n- تؤويه: تضمه وتحميه\n\nالحصة 4:\n- لظى: اسم من أسماء النار\n- الشوى: جلدة الرأس والأطراف\n- فأوعى: جمع المال في وعاء ومنع حق الله فيه\n\nالحصة 5:\n- هلوعًا: شديد الحرص قليل الصبر\n- جزوعًا: كثير الجزع\n- منوعًا: كثير المنع للخير\n- المحروم: المتعفف الذي لا يسأل\n\nالحصة 6:\n- يصدقون بيوم الدين: يؤمنون بيوم الحساب\n- مشفقون: خائفون\n- العادون: المتجاوزون حدود الله\n\nالحصة 7:\n- راعون: حافظون مؤدون\n- قائمون: يؤدونها بالحق دون كتمان\n- مكرمون: منعمون بالتكريم\n\nالحصة 8:\n- مهطعين: مسرعين مادين أعناقهم\n- عزين: جماعات متفرقة\n- جنة نعيم: جنة يتنعم فيها\n\nالحصة 9:\n- المشارق والمغارب: مشارق الشمس ومغاربها طوال العام\n- الأجداث: القبور\n- يوفضون: يسرعون\n- ترهقهم: تغشاهم\n\nالحصة 10:\n- مقاطع السورة: العذاب الواقع، أهوال القيامة، طبيعة الإنسان، صفات المصلين، موقف الكافرين\n- معايير الإتقان: صحة الحفظ، سلامة النطق، تطبيق الأحكام", "الحصة 1:\nيعرض المعلم صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)، ويتأمل الطالب الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها.\n\nالحصة 2:\nيسمّع المعلم الآيات (1–5) من بعض الطلبة بطريقة سلسلة الحفظ: كل طالب يكمل آية، ويتلو الطالب الآية التي يأتي دوره فيها ويصوب لزميله.\n\nالحصة 3:\nيعرض المعلم على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة، ويذكر الطالب أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة.\n\nالحصة 4:\nيسأل المعلم: ما الصفات التي تجعل الإنسان من أهل النار؟ ويستمع للإجابات ثم يقرأ الآية 17، ويعصف الطالب ذهنيًا ويذكر صفات ثم يقارنها بالآية.\n\nالحصة 5:\nيعرض المعلم موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟ ويقارن الطالب بين الموقفين ويعلل.\n\nالحصة 6:\nيسمع المعلم الآيات (19–25) تسميعًا عشوائيًا بالبطاقات المرقمة، ويسحب الطالب بطاقة ويتلو الآية المكتوب رقمها.\n\nالحصة 7:\nيعرض المعلم موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة، ويجيب الطالب ويتوقع موضوع الآيات.\n\nالحصة 8:\nيسمع المعلم الآيات (26–35) بطريقة الكرة الدوارة، ويتلو الطالب الآية عند وصول الكرة إليه.\n\nالحصة 9:\nيعرض المعلم صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟ ويلاحظ الطالب ويربط بقوله «برب المشارق والمغارب».\n\nالحصة 10:\nيعرض المعلم على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه، ويربط الطالب المقاطع بآياتها.", "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)، ويتأمل الطالب الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع الطلبة التلاوة النموذجية للآيات (1–5) من الوسائل المتعددة ثم يقرأ بنفسه بتأنٍّ مبرزًا المد في «سائل» و«واقع»، ويستمع الطالب منصتًا ويتابع في المصحف ويضع إصبعه على موضع القراءة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الجماعية والفردية: يقرأ المعلم الآيات مع الطلبة جماعيًا ثم يستمع لقراءات فردية ويكلف القارئ المتقن بتصويب زميله (تعلم بالأقران)، ويقرأ الطالب جماعيًا ثم فرديًا ويصحح لزميله بأدب (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n4. أتعرف المعنى: يناقش المعلم معاني: سأل سائل، دافع، المعارج، تعرج، والروح (جبريل عليه السلام)، ويستخرج الطالب معنى كل كلمة ويدونها في كراسته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الحفظ بالتكرار: يقسم المعلم الآيات إلى مقطعين (1–3) و(4–5) ويوجه للتكرار المتدرج ثم يجري تسميعًا ثنائيًا، ويكرر الطالب المقطع ويسمّعه لزميله ثم يسمع الآيات كاملة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ثم ينفذ جولة قصيرة من مسابقة المجموعات على السبورة الذكية، ويجيب الطالب عن الأسئلة ويشارك مجموعته في المسابقة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسمّع المعلم الآيات (1–5) من بعض الطلبة بطريقة سلسلة الحفظ: كل طالب يكمل آية، ويتلو الطالب الآية التي يأتي دوره فيها ويصوب لزميله (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. التلاوة النموذجية: يُسمع المعلم التلاوة النموذجية للآيات (6–10) ويقف على مواضع التفخيم مثل «قريبا» و«الجبال»، ويستمع الطالب ويتابع ويحدد حروف الاستعلاء في الآيات (8 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n3. التلاوة الجماعية والفردية: يوجه المعلم لقراءة جماعية ثم فردية ويصحح الأخطاء فورًا مع بيان سببها، ويقرأ الطالب ويصحح نطقه للكلمات مثل «كالمهل» و«كالعهن» (10 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n4. لعبة ترتيب الآيات: يوزع المعلم بطاقات كلمات الآيات المبعثرة على المجموعات ويطلب ترتيبها حسب المصحف في زمن محدد، ويرتب الطالب البطاقات مع مجموعته ويقرأ الآيات بعد ترتيبها (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n5. الحفظ والتسميع: يوجه المعلم لحفظ الآيات بالتكرار ثم يسمعها من الطلبة بالتناوب، ويحفظ الطالب الآيات ويسمّعها (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويختم بسؤال: كيف أستعد ليوم الحساب؟ ويجيب الطالب عن الأسئلة ويذكر عملًا صالحًا يستعد به (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم على السبورة الذكية سؤالًا: لو كنت في خطر من تطلب أن ينقذك؟ ثم يربط ذلك بحال المجرم يوم القيامة، ويذكر الطالب أقرب الناس إليه ويتوقع ما سيحدث يوم القيامة (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n2. التلاوة النموذجية: يعرض المعلم التلاوة النموذجية للآيات (11–14) مع إبراز الإظهار في «من عذاب»، ويستمع الطالب ويحدد مواضع الوقف والابتداء (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. التلاوة الفردية والتصحيح: يستمع المعلم لتلاوات فردية ويوجه الطلبة لتصويب بعضهم مستخدمًا قائمة رصد للأخطاء، ويتلو الطالب ويصوّب ويسجل أخطاءه ليعالجها (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أفهم وأتدبر: يناقش المعلم مع الطلبة ترتيب من يفتدي بهم المجرم (البنون، الصاحبة، الأخ، الفصيلة، من في الأرض) ودلالته، ويستخرج الطالب ترتيب المفتدى بهم ويستنتج شدة الهول (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات بطريقة التكرار والربط بالمعنى، ويحفظ الطالب الآيات ويسمعها لزميله (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ثم يكلف بتسميع منزلي، ويجيب الطالب ويدون الواجب (5 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الصفات التي تجعل الإنسان من أهل النار؟ ويستمع للإجابات ثم يقرأ الآية 17، ويعصف الطالب ذهنيًا ويذكر صفات ثم يقارنها بالآية (5 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات (15–18) ويركز على مد «إنها» ونطق «لظى» و«للشوى»، ويستمع الطالب ويكرر الكلمات الصعبة (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. التلاوة الجماعية والفردية: ينظم المعلم قراءة تبادلية بين صفوف الطلبة ثم قراءات فردية، ويقرأ الطالب بالتبادل ثم فرديًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. خريطة صفات أهل النار: يرسم المعلم على السبورة خريطة مفاهيمية: من أدبر، تولى، جمع، أوعى، ويطلب من المجموعات إكمالها بمعنى كل صفة، ويكمل الطالب الخريطة مع مجموعته ويشرح معنى كل صفة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الحفظ والتسميع: يسمع المعلم الآيات من الطلبة ويعزز المتقنين، ويسمع الطالب الآيات (15–18) (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويختم بدعاء النجاة من النار، ويجيب الطالب ويردد الدعاء (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 5 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم موقفين لطالبين: أحدهما يغضب ويجزع عند الخسارة والآخر يصبر، ويسأل: أيهما أقرب إلى صفات المصلين؟ ويقارن الطالب بين الموقفين ويعلل (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التلاوة النموذجية: يُسمع المعلم التلاوة ويبين الوقف على «هلوعا» و«جزوعا» و«منوعا» بإبدال التنوين ألفًا، ويستمع الطالب ويطبق الوقف الصحيح (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التلاوة والتصحيح: يستمع المعلم لقراءات فردية ويصحح ويثني على المتقن، ويقرأ الطالب ويصحح (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. أتدبر الصفات: يناقش المعلم صفات الإنسان (هلوع، جزوع، منوع) ثم يستخرج مع الطلبة أول صفتين للمصلين: الدوام على الصلاة والحق المعلوم في المال، ويستخرج الطالب الصفات من الآيات ويمثل لكل منها (7 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n5. الحفظ: يقسم المعلم الآيات (19–21) و(22–25) ويوجه للتكرار، ويحفظ الطالب ويسمع لزميله (5 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n6. التقويم الختامي والغلق: ينفذ المعلم مسابقة المجموعات بأسئلة المقطع ثم يطرح أسئلة التقويم الختامي، ويشارك الطالب في المسابقة ويجيب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 6 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسمع المعلم الآيات (19–25) تسميعًا عشوائيًا بالبطاقات المرقمة، ويسحب الطالب بطاقة ويتلو الآية المكتوب رقمها (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم التلاوة ويحدد مواضع الألف المدية المرققة كما في «يصدقون» و«ربهم» والمفخمة في «حافظون»، ويستمع الطالب ويضع خطًا تحت الألف المدية في كراسته (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الثنائية: يوزع الطلبة أزواجًا يقرأ أحدهما ويصحح الآخر ثم يتبادلان، ويقرأ الطالب ويصحح لزميله (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n4. أستخرج الصفات: يناقش المعلم صفات: التصديق بيوم الدين، الخوف من عذاب الله، حفظ الفروج، ويوضح معنى العفة بأسلوب مناسب، ويستخرج الطالب الصفات ويبين أثر كل صفة في السلوك (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات بالربط بين الصفات وتسلسلها، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويثني على المتقنين، ويجيب الطالب عن الأسئلة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 7 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم موقفًا: صديق أودع عندك هاتفه، ماذا تفعل؟ ثم يربط بالأمانة، ويجيب الطالب ويتوقع موضوع الآيات (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات (32–35) ويبرز المد في «لأماناتهم» و«بشهاداتهم»، ويستمع الطالب ويتابع (8 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n3. التلاوة والتصحيح: يستمع المعلم لقراءات فردية ويتابع تطبيق الغنة في «إنما» إن وجدت وأحكام المد، ويقرأ الطالب ويصحح (10 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n4. لعب أدوار: يكلف مجموعات بتمثيل مواقف قصيرة: أداء الأمانة، الوفاء بالوعد، أداء الشهادة بالحق، ويمثل الطالب الموقف ويربطه بالآية المناسبة (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات ثم يسمعها، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. التقويم الختامي والغلق: ينفذ المعلم مسابقة المجموعات على صفات المؤمنين ثم يطرح التقويم الختامي، ويشارك الطالب ويجيب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 8 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسمع المعلم الآيات (26–35) بطريقة الكرة الدوارة، ويتلو الطالب الآية عند وصول الكرة إليه (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويوضح نطق «مهطعين» و«عزين»، ويستمع الطالب ويكرر (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. التلاوة الجماعية والفردية: يقرأ المعلم مع الطلبة ثم يوزع التلاوة على المجموعات، ويقرأ الطالب مع مجموعته وفرديًا (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتدبر وأناقش: يناقش المعلم سؤال: «أيطمع كل امرئ منهم أن يدخل جنة نعيم»: لماذا ردت الآية بـ«كلا»؟ ويحلل الطالب الآية ويستنتج أن الجنة لا تنال بالتمني (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات ويسمع، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\nالحصة 9 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة لشروق الشمس في مكانين مختلفين خلال العام ويسأل: هل تشرق الشمس من النقطة نفسها كل يوم؟ ويلاحظ الطالب ويربط بقوله «برب المشارق والمغارب» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويبين الإخفاء في «من الأجداث» والإظهار في «من عذاب» عند مراجعتها، ويستمع الطالب ويحدد المواضع (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. التلاوة الفردية: يستمع المعلم لقراءات فردية متقنة ويعالج الأخطاء الشائعة، ويقرأ الطالب فرديًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. صورة يوم الخروج: يناقش المعلم مع الطلبة مشهد الخروج من القبور: سراعًا، خاشعة أبصارهم، ترهقهم ذلة، ويستخرج الطالب عناصر المشهد ويعبر عنه بأسلوبه (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات ويسمع، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويعلن موعد التسميع الشامل للسورة، ويجيب الطالب ويستعد للتسميع (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 10 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم على السبورة الذكية خريطة لمقاطع السورة الخمسة ويطلب ربط كل مقطع بأول آية فيه، ويربط الطالب المقاطع بآياتها (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التسميع الشامل: يسمع المعلم السورة من الطلبة على مقاطع مستخدمًا بطاقة معايير التلاوة ويرصد الدرجات، ويسمع الطالب المقطع المطلوب منه ويقيّم نفسه بالبطاقة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تطبيق ترقيق الراء: يوجه المجموعات لاستخراج راءات مرققة من السورة مثل «الكافرين» و«الشر» ثم يعللها، ويستخرج الطالب المواضع ويعلل الترقيق (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات بأسئلة السورة كاملة على السبورة الذكية، ويشارك مجموعته في الإجابة (7 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويعلن المتميزين في الحفظ، ويجيب الطالب ويحتفي بزملائه المتميزين (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1:\nس1 (مستوى المعرفة): ما عدد آيات سورة المعارج؟\nالإجابة: 44 آية.\n\nس2 (مستوى التطبيق): ما المقصود بقوله تعالى: «من الله ذي المعارج»؟\nالإجابة: من الله صاحب المصاعد والدرجات العلا التي تصعد فيها الملائكة إليه.\n\nس3 (مستوى الاستدلال): لماذا وُصف الصبر في الآية الخامسة بأنه جميل؟\nالإجابة: لأنه صبر لا جزع فيه ولا شكوى إلا إلى الله تعالى.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما معنى كلمة «العهن» في قوله تعالى: «وتكون الجبال كالعهن»؟\nالإجابة: الصوف المصبوغ المنفوش.\n\nس2 (مستوى التطبيق): بمَ شبهت الآيات السماء يوم القيامة؟\nالإجابة: بالمهل وهو المعدن المذاب.\n\nس3 (مستوى الاستدلال): علل: لا يسأل القريب قريبه يوم القيامة.\nالإجابة: لانشغال كل إنسان بنفسه من شدة الهول.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما معنى «فصيلته»؟\nالإجابة: عشيرته الأقربون.\n\nس2 (مستوى التطبيق): بمن يود المجرم أن يفتدي من عذاب يوم القيامة؟\nالإجابة: ببنيه وصاحبته وأخيه وفصيلته ومن في الأرض جميعًا.\n\nس3 (مستوى الاستدلال): ماذا تدل عليه رغبة المجرم في الافتداء بأحب الناس إليه؟\nالإجابة: تدل على شدة العذاب وهول الموقف حتى يتخلى الإنسان عن أحبابه لينجو بنفسه.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما معنى «لظى»؟\nالإجابة: اسم من أسماء النار.\n\nس2 (مستوى التطبيق): من الذين تدعوهم النار كما في الآية 17؟\nالإجابة: من أدبر عن الحق وتولى عن الطاعة.\n\nس3 (مستوى الاستدلال): ما العلاقة بين قوله تعالى «وجمع فأوعى» وخلق البخل؟\nالإجابة: أن من جمع المال ومنع حق الله فيه بخلًا كان من أهل النار.\n\nالحصة 5:\nس1 (مستوى المعرفة): ما معنى «هلوعا»؟\nالإجابة: شديد الحرص قليل الصبر.\n\nس2 (مستوى التطبيق): من المستثنون من صفة الهلع كما في الآية 22؟\nالإجابة: المصلون.\n\nس3 (مستوى الاستدلال): ما الفرق بين السائل والمحروم؟\nالإجابة: السائل الذي يطلب العطاء، والمحروم المتعفف الذي لا يسأل.\n\nالحصة 6:\nس1 (مستوى المعرفة): ما معنى «مشفقون»؟\nالإجابة: خائفون.\n\nس2 (مستوى التطبيق): اذكر صفة من صفات المؤمنين وردت في الآية 26.\nالإجابة: يصدقون بيوم الدين.\n\nس3 (مستوى الاستدلال): لماذا وصف عذاب الله بأنه «غير مأمون»؟\nالإجابة: لأنه لا يأمن أحد أن يقع فيه، فيبقى المؤمن خائفًا راجيًا.\n\nالحصة 7:\nس1 (مستوى المعرفة): ما معنى «راعون»؟\nالإجابة: حافظون مؤدون لها.\n\nس2 (مستوى التطبيق): ما جزاء أصحاب الصفات المذكورة كما في الآية 35؟\nالإجابة: في جنات مكرمون.\n\nس3 (مستوى الاستدلال): لماذا ختمت صفات المؤمنين بالمحافظة على الصلاة كما بدأت بالدوام عليها؟\nالإجابة: لبيان عظيم منزلة الصلاة وأنها أساس الصفات كلها.\n\nالحصة 8:\nس1 (مستوى المعرفة): ما معنى «عزين»؟\nالإجابة: جماعات متفرقة.\n\nس2 (مستوى التطبيق): كيف كان الكافرون يقبلون نحو النبي صلى الله عليه وسلم؟\nالإجابة: مسرعين جماعات عن اليمين وعن الشمال.\n\nس3 (مستوى الاستدلال): ما الذي ردت عليه كلمة «كلا» في الآية 39؟\nالإجابة: ردت على طمعهم في دخول الجنة دون إيمان وعمل.\n\nالحصة 9:\nس1 (مستوى المعرفة): ما معنى «الأجداث»؟\nالإجابة: القبور.\n\nس2 (مستوى التطبيق): كيف يخرج الناس من القبور كما وصفت الآية 43؟\nالإجابة: سراعًا كأنهم إلى نصب يوفضون.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (40–41) على قدرة الله تعالى؟\nالإجابة: أنه سبحانه قادر على أن يبدل خيرًا منهم وما هو بمسبوق.\n\nالحصة 10:\nس1 (مستوى المعرفة): كم عدد آيات سورة المعارج؟ وما الآية التي تبدأ بها صفات المصلين؟\nالإجابة: 44 آية، وتبدأ الصفات من الآية 22 «إلا المصلين».\n\nس2 (مستوى التطبيق): لماذا رققت الراء في كلمة «الكافرين»؟\nالإجابة: لأنها مكسورة.\n\nس3 (مستوى الاستدلال): صنف آيات السورة إلى مقطعين: ترهيب وترغيب، مع مثال لكل منهما.\nالإجابة: ترهيب: «كلا إنها لظى»، ترغيب: «أولئك في جنات مكرمون».", "الحصة 1:\nس1 (مستوى المعرفة): اتلُ الآيات (1–3) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة متقنة.\n\nس2 (مستوى التطبيق): كم مقدار اليوم الذي تعرج فيه الملائكة والروح إليه؟\nالإجابة: خمسون ألف سنة.\n\nس3 (مستوى الاستدلال): اقترح موقفًا من حياتك تطبق فيه الصبر الجميل.\nالإجابة: مثل: الصبر على المرض أو على تأخر النتيجة دون تذمر مع الدعاء والأخذ بالأسباب.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «إنهم يرونه بعيدا ...».\nالإجابة: «ونراه قريبا».\n\nس2 (مستوى التطبيق): اذكر صورتين من أهوال يوم القيامة وردتا في الآيات (8–10).\nالإجابة: السماء كالمهل، والجبال كالعهن، ولا يسأل حميم حميما.\n\nس3 (مستوى الاستدلال): «يرونه بعيدا ونراه قريبا»: ما الدرس المستفاد لك من هذه المقابلة؟\nالإجابة: أن يوم القيامة قريب مهما ظنه الناس بعيدًا، فأبادر بالتوبة والعمل الصالح.\n\nالحصة 3:\nس1 (مستوى المعرفة): اتلُ الآيات (11–14) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): أكمل: «وفصيلته التي ...».\nالإجابة: «تؤويه».\n\nس3 (مستوى الاستدلال): هل تنفع القرابة الإنسان يوم القيامة إن لم يعمل صالحًا؟ علل.\nالإجابة: لا تنفعه، لأن كل نفس بما كسبت رهينة والنجاة بالإيمان والعمل الصالح.\n\nالحصة 4:\nس1 (مستوى المعرفة): أكمل: «كلا إنها لظى ...».\nالإجابة: «نزاعة للشوى».\n\nس2 (مستوى التطبيق): اذكر صفتين لمن تدعوهم النار.\nالإجابة: أدبر وتولى، وجمع فأوعى.\n\nس3 (مستوى الاستدلال): كيف يحمي المسلم نفسه من صفة «جمع فأوعى»؟\nالإجابة: بإخراج الزكاة والصدقة وأداء حق المال.\n\nالحصة 5:\nس1 (مستوى المعرفة): أكمل: «إذا مسه الشر جزوعا ...».\nالإجابة: «وإذا مسه الخير منوعا».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المصلين وردتا في الآيات (23–25).\nالإجابة: الدوام على الصلاة، وفي أموالهم حق معلوم للسائل والمحروم.\n\nس3 (مستوى الاستدلال): كيف تعالج الصلاة الدائمة صفة الهلع في الإنسان؟\nالإجابة: تربطه بالله فيطمئن قلبه، فيصبر عند الشر ويجود عند الخير.\n\nالحصة 6:\nس1 (مستوى المعرفة): أكمل: «والذين هم من عذاب ربهم ...».\nالإجابة: «مشفقون».\n\nس2 (مستوى التطبيق): حدد كلمة فيها ألف مدية مفخمة من الآية 29.\nالإجابة: «حافظون».\n\nس3 (مستوى الاستدلال): ما أثر التصديق بيوم الدين في سلوك المسلم؟\nالإجابة: يجعله يراقب الله في أقواله وأفعاله ويستعد للحساب.\n\nالحصة 7:\nس1 (مستوى المعرفة): أكمل: «والذين هم بشهاداتهم ...».\nالإجابة: «قائمون».\n\nس2 (مستوى التطبيق): اذكر صفتين من صفات المؤمنين في الآيتين (32–33).\nالإجابة: رعاية الأمانة والعهد، والقيام بالشهادة.\n\nس3 (مستوى الاستدلال): صديقك وعدك بموعد ثم تأخر دون عذر، كيف تنصحه في ضوء الآية 32؟\nالإجابة: أذكره بأن الوفاء بالعهد من صفات المؤمنين وأن رعايته من الإيمان.\n\nالحصة 8:\nس1 (مستوى المعرفة): أكمل: «أيطمع كل امرئ منهم ...».\nالإجابة: «أن يدخل جنة نعيم».\n\nس2 (مستوى التطبيق): ما معنى «مهطعين»؟\nالإجابة: مسرعين مادين أعناقهم.\n\nس3 (مستوى الاستدلال): زميلك يقول: سأدخل الجنة لأني من أسرة صالحة، بمَ ترد عليه من الآيات؟\nالإجابة: أرد بقوله تعالى «أيطمع كل امرئ منهم أن يدخل جنة نعيم كلا»، فالجنة بالإيمان والعمل.\n\nالحصة 9:\nس1 (مستوى المعرفة): أكمل: «خاشعة أبصارهم ترهقهم ذلة ...».\nالإجابة: «ذلك اليوم الذي كانوا يوعدون».\n\nس2 (مستوى التطبيق): ما معنى «يوفضون»؟\nالإجابة: يسرعون.\n\nس3 (مستوى الاستدلال): لماذا ختمت السورة بذكر اليوم الموعود وقد بدأت بالسؤال عن العذاب الواقع؟\nالإجابة: للتأكيد أن العذاب الذي استبعدوه واقع لا محالة في اليوم الذي وعدوا به.\n\nالحصة 10:\nس1 (مستوى المعرفة): اتلُ الآيات (22–35) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): اذكر ثلاث صفات من صفات المصلين.\nالإجابة: الدوام على الصلاة، أداء حق المال، التصديق بيوم الدين.\n\nس3 (مستوى الاستدلال): اختر صفة من صفات المصلين وضع خطة أسبوعية لتطبيقها.\nالإجابة: مثل المحافظة على الصلاة: أداؤها في أول وقتها ومتابعة ذلك في جدول يومي.", "الحصة 1:\n- للطالب: يكرر تلاوة الآيات (1–5) في المنزل ويحفظها لتسميعها في الحصة القادمة\n- لولي الأمر: يستمع لتلاوة ابنه للآيات (1–5) ويشجعه على الحفظ بالاستماع لتلاوة مجودة\n\nالحصة 2:\n- للطالب: يراجع الآيات (1–10) ويكتب معاني كلمتي المهل والعهن\n- لولي الأمر: يتابع حفظ ابنه للآيات (1–10) ويستمع إليه مرة يوميًا\n\nالحصة 3:\n- للطالب: يحفظ الآيات (11–14) ويربطها بما سبقها ويسمع الآيات (1–14)\n- لولي الأمر: يسمع من ابنه الآيات (1–14) ويحاوره في معنى الافتداء\n\nالحصة 4:\n- للطالب: يحفظ الآيات (15–18) ويكتب صفات من تدعوهم النار\n- لولي الأمر: يتابع حفظ ابنه ويذكره بأهمية الإنفاق\n\nالحصة 5:\n- للطالب: يحفظ الآيات (19–25) ويراجع ما قبلها\n- لولي الأمر: يشجع ابنه على المحافظة على الصلاة في وقتها ويسمع منه الآيات\n\nالحصة 6:\n- للطالب: يحفظ الآيات (26–31) ويطبق تفخيم الألف بعد الحرف المفخم\n- لولي الأمر: يسمع من ابنه الآيات (19–31)\n\nالحصة 7:\n- للطالب: يحفظ الآيات (32–35) ويحصي صفات المؤمنين في السورة\n- لولي الأمر: يذكر ابنه بأداء الأمانات والوفاء بالوعود\n\nالحصة 8:\n- للطالب: يحفظ الآيات (36–39) ويراجع السورة من أولها\n- لولي الأمر: يسمع من ابنه الآيات (1–39) على مرحلتين\n\nالحصة 9:\n- للطالب: يحفظ الآيات (40–44) ويستعد لتسميع السورة كاملة\n- لولي الأمر: يسمع من ابنه السورة كاملة استعدادًا للتسميع الشامل\n\nالحصة 10:\n- للطالب: يراجع سورة المعارج كاملة مرة يوميًا لتثبيت الحفظ\n- لولي الأمر: يستمع لتلاوة ابنه للسورة كاملة ويثني على إتقانه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=1"], "h": [["الد لله تعالى ويعظمه", "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تقييم", "الحصة 1:\n1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. الخرائط المفاهيمية\n\nالحصة 2:\n1. التعلم بالنمذجة\n2. التعلم التشاركي\n3. الحوار والمناقشة\n\nالحصة 3:\n1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. التعلم بالأقران\n\nالحصة 4:\n1. التعلم بالنمذجة\n2. التعلم المبني على حل المشكلات\n3. الحوار والمناقشة\n\nالحصة 5:\n1. التعلم بالنمذجة\n2. التعلم التشاركي\n3. العصف الذهني\n\nالحصة 6:\n1. التعلم المبني على اللعب\n2. التعلم التعاوني\n3. التقويم الذاتي", "الحصة 1:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 2:\n1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية\n4. أخرى: بطاقات الأحداث\n\nالحصة 3:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة 4:\n1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية\n\nالحصة 5:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 6:\n1. الكتاب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n4. أخرى: بطاقة معايير التلاوة", "الحصة 1:\n- الحاقة: اسم من أسماء يوم القيامة لأنه يحق فيه الحق\n- الطاغية: الصيحة المجاوزة للحد\n- صرصر: شديدة البرد والصوت\n- حسومًا: متتابعة\n- أخذة رابية: أخذة شديدة زائدة\n\nالحصة 2:\n- الجارية: السفينة\n- واعية: حافظة لما تسمع\n- دكتا: سحقتا وسويتا بالأرض\n- واهية: ضعيفة ممزقة\n- أرجائها: جوانبها\n\nالحصة 3:\n- هاؤم: خذوا\n- قطوفها دانية: ثمارها قريبة\n- أسلفتم: قدمتم\n- القاضية: الموتة التي لا بعث بعدها\n- سلطانيه: حجتي وقوتي\n\nالحصة 4:\n- فغلوه: اجمعوا يديه إلى عنقه بالأغلال\n- صلوه: أدخلوه\n- فاسلكوه: أدخلوه\n- حميم: قريب ينفعه\n- غسلين: صديد أهل النار\n\nالحصة 5:\n- رسول كريم: النبي محمد صلى الله عليه وسلم المبلغ عن ربه\n- تقوّل: افترى\n- الوتين: عرق متصل بالقلب\n- حاجزين: مانعين\n\nالحصة 6:\n- حق اليقين: اليقين الثابت الذي لا شك فيه\n- حسرة: ندم شديد\n- فسبح: نزّه الله تعالى عما لا يليق به", "الحصة 1:\nيعرض المعلم على السبورة الذكية أسماء ثلاث أمم (ثمود، عاد، قوم فرعون) ويسأل: ماذا تعرف عنها؟ ويذكر الطالب ما يعرفه عن هذه الأمم.\n\nالحصة 2:\nيسمع المعلم الآيات (1–10) ثم يسأل: ما النعمة التي ذكرنا الله بها في قصة الطوفان؟ ويسمع الطالب الآيات ويتوقع الإجابة.\n\nالحصة 3:\nيعرض المعلم جدولًا فارغًا بعمودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق، ويتوقع الطالب ويدون.\n\nالحصة 4:\nيسمع المعلم الآيات (19–29) بطريقة «أكمل الآية»، ويكمل الطالب الآية التي يبدأ بها المعلم.\n\nالحصة 5:\nيعرض المعلم على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟ ويعصف الطالب ذهنيًا بالإجابات.\n\nالحصة 6:\nيتلو المعلم الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟ ويجيب الطالب ويتوقع سبب الختم بالتسبيح.", "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم على السبورة الذكية أسماء ثلاث أمم (ثمود، عاد، قوم فرعون) ويسأل: ماذا تعرف عنها؟ ويذكر الطالب ما يعرفه عن هذه الأمم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات (1–10) ويبرز تفخيم الراء في «صرصر» الأولى وترقيقها في الثانية المكسورة، ويستمع الطالب ويحدد موضع الراءين (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الجماعية والفردية: يقرأ المعلم مع الطلبة ثم يستمع لقراءات فردية ويصحح، ويقرأ الطالب ويصحح (10 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n4. خريطة الأمم المكذبة: يرسم المعلم جدولًا: الأمة، نوع العذاب، ويطلب من المجموعات إكماله من الآيات، ويكمل الطالب الجدول: ثمود بالطاغية، عاد بالريح، فرعون بالأخذة الرابية (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الحفظ: يقسم المعلم الآيات (1–5) و(6–10) ويوجه للحفظ، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسمع المعلم الآيات (1–10) ثم يسأل: ما النعمة التي ذكرنا الله بها في قصة الطوفان؟ ويسمع الطالب الآيات ويتوقع الإجابة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات (11–18) ويبين تفخيم الراء المفتوحة في «ربك» و«تذكرة»، والساكنة بعد فتح في «عرش» و«الأرض»، ويستمع الطالب ويحدد حكم الراء في «ربك» و«عرش» (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. التلاوة الفردية: يستمع المعلم لقراءات فردية ويصحح النطق في «نفخة» و«دكتا»، ويقرأ الطالب ويصحح (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. ترتيب الأحداث: يوزع المعلم بطاقات أحداث يوم القيامة (النفخ، دك الأرض والجبال، انشقاق السماء، العرض) ويطلب ترتيبها حسب الآيات، ويرتب الطالب البطاقات ويقرأ الآية الدالة على كل حدث (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n5. الحفظ: يوجه المعلم لحفظ الآيات ويسمع، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم جدولًا فارغًا بعمودين: أصحاب اليمين، أصحاب الشمال، ويسأل عن توقعاتهم لحال كل فريق، ويتوقع الطالب ويدون (5 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويبين الوقف بهاء السكت في «كتابيه» و«حسابيه» و«ماليه» و«سلطانيه»، ويستمع الطالب ويطبق الوقف بالهاء (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التلاوة الثنائية: يوزع الطلبة أزواجًا: أحدهما يقرأ آيات أصحاب اليمين والآخر آيات أصحاب الشمال، ويقرأ الطالب ويصحح لزميله (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أقارن: يوجه المجموعات لإكمال جدول المقارنة: القول، المكان، الحال، ويكمل الطالب الجدول من الآيات (7 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n5. الحفظ: يقسم المعلم المقطع إلى (19–24) و(25–29) ويوجه للحفظ، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. التقويم الختامي والغلق: ينفذ المعلم جولة من مسابقة المجموعات ثم يطرح أسئلة التقويم الختامي، ويشارك الطالب ويجيب (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسمع المعلم الآيات (19–29) بطريقة «أكمل الآية»، ويكمل الطالب الآية التي يبدأ بها المعلم (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويبين تفخيم الراء المفتوحة في «ذرعها» وإخفاء التنوين في «سلسلة ذرعها»، ويستمع الطالب ويحدد حكم الراء في «ذرعها» (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. التلاوة الجماعية والفردية: يقرأ المعلم مع الطلبة ثم يستمع لقراءات فردية، ويقرأ الطالب ويصحح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. أسباب العذاب: يطرح المعلم مشكلة: لماذا استحق الكافر هذا العذاب؟ ويوجه لاستخراج السببين من الآيتين (33–34)، ويستخرج الطالب: عدم الإيمان بالله العظيم، وعدم الحض على طعام المسكين (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الحفظ: يوجه المعلم للحفظ ويسمع، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويقترح مبادرة صفية لإطعام المحتاجين، ويجيب الطالب ويشارك في الاقتراح (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم على السبورة الذكية عبارتين: «القرآن شعر»، «القرآن كهانة»، ويسأل: كيف نرد على هذه التهم؟ ويعصف الطالب ذهنيًا بالإجابات (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التلاوة النموذجية: يُسمع المعلم الآيات ويبين تفخيم الراء في «رسول» لأنها مفتوحة وترقيقها في «شاعر» عند الوصل لأنها مكسورة، ويستمع الطالب ويطبق (8 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n3. التلاوة الفردية: يستمع المعلم لقراءات فردية ويتابع تطبيق أحكام الراء، ويقرأ الطالب ويصحح (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. أدلة صدق القرآن: يناقش المعلم مع الطلبة نفي الشعر والكهانة والتقول، ويستخرج معهم أن القرآن تنزيل من رب العالمين، ويستخرج الطالب الأدلة ويكتبها في خريطة (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. الحفظ: يوجه المعلم للحفظ ويسمع، ويحفظ الطالب ويسمع (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 6 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يتلو المعلم الآية الأخيرة «فسبح باسم ربك العظيم» ويسأل: بمَ ختمت السورة؟ ولماذا؟ ويجيب الطالب ويتوقع سبب الختم بالتسبيح (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة والحفظ: يُسمع المعلم الآيات (48–52) ويوجه لحفظها سريعًا لقصرها، ويستمع الطالب ويحفظ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التسميع الشامل: يسمع المعلم السورة كاملة من الطلبة على مقاطع باستخدام بطاقة معايير التلاوة، ويسمع الطالب ويقيم نفسه (15 دقيقة)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات بأسئلة السورة على السبورة الذكية، ويشارك الطالب مع مجموعته (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويكرم المتقنين، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1:\nس1 (مستوى المعرفة): كم عدد آيات سورة الحاقة؟\nالإجابة: 52 آية.\n\nس2 (مستوى التطبيق): بمَ أهلكت ثمود؟\nالإجابة: بالطاغية وهي الصيحة الشديدة.\n\nس3 (مستوى الاستدلال): كيف صورت الآية 7 حال قوم عاد بعد هلاكهم؟\nالإجابة: صرعى كأنهم أعجاز نخل خاوية.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما المقصود بـ«الجارية» في الآية 11؟\nالإجابة: السفينة.\n\nس2 (مستوى التطبيق): ما أول أحداث يوم القيامة المذكورة في الآيات (13–18)؟\nالإجابة: النفخ في الصور نفخة واحدة.\n\nس3 (مستوى الاستدلال): ما دلالة قوله تعالى: «لا تخفى منكم خافية»؟\nالإجابة: أن الله يعلم كل شيء فلا يخفى عليه من أعمال العباد شيء.\n\nالحصة 3:\nس1 (مستوى المعرفة): ماذا يقول من أوتي كتابه بيمينه؟\nالإجابة: «هاؤم اقرءوا كتابيه».\n\nس2 (مستوى التطبيق): ما معنى «قطوفها دانية»؟\nالإجابة: ثمارها قريبة سهلة التناول.\n\nس3 (مستوى الاستدلال): ما الذي ندم عليه صاحب الشمال كما في الآيتين (28–29)؟\nالإجابة: أن ماله وسلطانه لم يغنيا عنه شيئًا.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما معنى «غسلين»؟\nالإجابة: صديد أهل النار.\n\nس2 (مستوى التطبيق): اذكر سببي عذاب الكافر كما في الآيتين (33–34).\nالإجابة: لا يؤمن بالله العظيم، ولا يحض على طعام المسكين.\n\nس3 (مستوى الاستدلال): لماذا قرن الله ترك الحض على إطعام المسكين بعدم الإيمان؟\nالإجابة: لعظم حق المسكين ولأن الرحمة بالفقراء من ثمار الإيمان.\n\nالحصة 5:\nس1 (مستوى المعرفة): ما معنى «الوتين»؟\nالإجابة: عرق متصل بالقلب إذا قطع مات صاحبه.\n\nس2 (مستوى التطبيق): ما التهمتان اللتان نفتهما الآيتان (41–42) عن القرآن؟\nالإجابة: أنه قول شاعر، وأنه قول كاهن.\n\nس3 (مستوى الاستدلال): ما الدليل في الآيات (44–47) على أن النبي صلى الله عليه وسلم لم يفترِ القرآن؟\nالإجابة: أنه لو تقول على الله لعاقبه الله وقطع منه الوتين ولم يمنعه أحد.\n\nالحصة 6:\nس1 (مستوى المعرفة): بمَ وصف القرآن في الآية 48؟\nالإجابة: بأنه تذكرة للمتقين.\n\nس2 (مستوى التطبيق): بمَ ختمت سورة الحاقة؟\nالإجابة: بالأمر بتسبيح الله: «فسبح باسم ربك العظيم».\n\nس3 (مستوى الاستدلال): لخص موضوعات سورة الحاقة في ثلاث نقاط.\nالإجابة: مصير الأمم المكذبة، أحداث القيامة وحال الفريقين، صدق القرآن الكريم.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: «وأما عاد فأهلكوا ...».\nالإجابة: «بريح صرصر عاتية».\n\nس2 (مستوى التطبيق): كم مدة الريح التي سخرت على عاد؟\nالإجابة: سبع ليال وثمانية أيام متتابعة.\n\nس3 (مستوى الاستدلال): ما العبرة التي تستفيدها من ذكر مصير الأمم المكذبة؟\nالإجابة: أن عاقبة التكذيب والمعصية الهلاك فأطيع الله ورسوله.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «يومئذ تعرضون ...».\nالإجابة: «لا تخفى منكم خافية».\n\nس2 (مستوى التطبيق): ما حكم الراء في كلمة «عرش»؟\nالإجابة: تفخيم، لأنها ساكنة بعد فتح.\n\nس3 (مستوى الاستدلال): كيف يؤثر الإيمان بالعرض على الله في سلوك الطالب أثناء الاختبار؟\nالإجابة: يجعله أمينًا لا يغش لعلمه أن الله مطلع عليه.\n\nالحصة 3:\nس1 (مستوى المعرفة): أكمل: «فهو في عيشة ...».\nالإجابة: «راضية».\n\nس2 (مستوى التطبيق): اذكر نعمتين لأصحاب اليمين.\nالإجابة: جنة عالية، وقطوفها دانية.\n\nس3 (مستوى الاستدلال): ما الأعمال التي «أسلفتها» هذا الأسبوع وتتمنى أن تجدها في كتابك؟\nالإجابة: مثل: المحافظة على الصلاة وبر الوالدين ومساعدة زميل.\n\nالحصة 4:\nس1 (مستوى المعرفة): أكمل: «إنه كان لا يؤمن ...».\nالإجابة: «بالله العظيم».\n\nس2 (مستوى التطبيق): كم ذراعًا طول السلسلة المذكورة في الآية 32؟\nالإجابة: سبعون ذراعًا.\n\nس3 (مستوى الاستدلال): اقترح عملًا تحض به غيرك على إطعام المسكين.\nالإجابة: مثل: الدعوة إلى حملة إفطار صائم أو التبرع بسلة غذائية.\n\nالحصة 5:\nس1 (مستوى المعرفة): أكمل: «تنزيل من ...».\nالإجابة: «رب العالمين».\n\nس2 (مستوى التطبيق): ما حكم الراء في كلمة «رسول»؟\nالإجابة: تفخيم لأنها مفتوحة.\n\nس3 (مستوى الاستدلال): كيف تدافع عن القرآن الكريم إذا سمعت من يشكك فيه؟\nالإجابة: أبين أنه تنزيل من رب العالمين وليس شعرًا ولا كهانة، وأستدل بالآيات.\n\nالحصة 6:\nس1 (مستوى المعرفة): اتلُ الآيات (48–52) من حفظك.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): ما معنى «حق اليقين»؟\nالإجابة: اليقين الثابت الذي لا شك فيه.\n\nس3 (مستوى الاستدلال): قيم تلاوتك للسورة وفق معايير الإتقان، واذكر ما تحتاج إلى تحسينه.\nالإجابة: يذكر الطالب مثلًا: إتقان الحفظ مع حاجة إلى ضبط الوقف بهاء السكت.", "الحصة 1:\n- للطالب: يحفظ الآيات (1–10) من سورة الحاقة\n- لولي الأمر: يستمع لتلاوة ابنه ويناقشه في قصص الأمم المذكورة\n\nالحصة 2:\n- للطالب: يحفظ الآيات (11–18) ويراجع ما قبلها\n- لولي الأمر: يسمع من ابنه الآيات (1–18)\n\nالحصة 3:\n- للطالب: يحفظ الآيات (19–29) ويطبق الوقف بهاء السكت\n- لولي الأمر: يناقش ابنه في الأعمال التي يحب أن يجدها في صحيفته\n\nالحصة 4:\n- للطالب: يحفظ الآيات (30–37)\n- لولي الأمر: يشجع ابنه على المشاركة في عمل خيري لإطعام المحتاجين\n\nالحصة 5:\n- للطالب: يحفظ الآيات (38–47)\n- لولي الأمر: يستمع لتلاوة ابنه ويحاوره في عظمة القرآن\n\nالحصة 6:\n- للطالب: يراجع سورة الحاقة كاملة وسورة المعارج\n- لولي الأمر: يستمع لتلاوة ابنه للسورتين ويشجعه على المراجعة الدورية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=2"], "h": [["الدرس", "سورة الحاقة (تلاوة وحفظ)"], ["الوحدة", "مقرر التلاوة والحفظ"], ["صفحات كتاب الطالب", "15–21"], ["صفحات دليل المعلم", "26–28"], ["عدد الحصص", "6"]]}, {"id": "tafkhim", "t": "مقدمة في التفخيم والترقيق (تجويد)", "u": "الوحدة الأولى", "ps": [{"n": 1, "ax": "م ده ألف، ثم المضموم، ثم الساكن، ثم المكسور", "الحصة 1:\nينطق المعلم أمام الطلبة كلمتي «سار» و«صار» ويسأل: ما الفرق بين الصوتين؟ وهل يتغير المعنى؟ ويستمع الطالب ويلاحظ امتلاء الفم بصوت الصاد ويذكر اختلاف المعنى.\n\nالحصة 2:\nيعرض المعلم على السبورة الذكية عبارة «خص ضغط قظ» ويسأل: ماذا تجمع هذه العبارة؟ ويحاول الطالب استخراج الحروف السبعة.\n\nالحصة 3:\nينطق المعلم «قال» ثم «قِيل» ويسأل: في أي الكلمتين كان التفخيم أقوى؟ ويقارن الطالب ويستنتج أن التفخيم يتفاوت بحسب الحركة.", "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينطق المعلم أمام الطلبة كلمتي «سار» و«صار» ويسأل: ما الفرق بين الصوتين؟ وهل يتغير المعنى؟ ويستمع الطالب ويلاحظ امتلاء الفم بصوت الصاد ويذكر اختلاف المعنى (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أكتشف المفهوم: يعرض أزواجًا من الكلمات (سيف وصيف، تين وطين، دليل وضليل) ويطلب من الطلبة نطقها وملاحظة حركة اللسان وامتلاء الفم، وينطق الطالب الكلمات ويستنتج الفرق بين الصوتين (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أصوغ التعريف: يوجه الطلبة لصياغة تعريف التفخيم والترقيق ثم يقارنه بتعريف الكتاب ص 22، ويصوغ الطالب التعريف بأسلوبه ثم يقرؤه من الكتاب (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أستمع وأميز: يُسمع المعلم مقطعًا من تلاوة مجودة ويطلب رفع البطاقة الخضراء عند سماع حرف مفخم، ويستمع الطالب ويرفع البطاقة عند الحرف المفخم (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي ويكلف كل طالب بكتابة ثلاثة أزواج من الكلمات تتغير بالتفخيم، ويجيب الطالب ويكتب الأزواج (10 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم على السبورة الذكية عبارة «خص ضغط قظ» ويسأل: ماذا تجمع هذه العبارة؟ ويحاول الطالب استخراج الحروف السبعة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أصنف الحروف: يوزع المعلم بطاقات الحروف على المجموعات ويطلب تصنيفها في ثلاث سلال: مفخمة دائمًا، مرققة دائمًا، تفخم وترقق، ويصنف الطالب الحروف مع مجموعته ويبرر التصنيف (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n3. أتعاون مع زملائي: يعرض كلمات قرآنية من نشاط الكتاب ص 24 ويطلب استخراج الحروف المفخمة والمرققة منها في جدول، ويستخرج الطالب الحروف ويكمل الجدول (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. خريطة مفاهيمية: يبني المعلم مع الطلبة خريطة للأقسام الثلاثة مع أمثلة من سورة المعارج، ويكمل الطالب الخريطة بأمثلة من حفظه (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينطق المعلم «قال» ثم «قِيل» ويسأل: في أي الكلمتين كان التفخيم أقوى؟ ويقارن الطالب ويستنتج أن التفخيم يتفاوت بحسب الحركة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أقرأ وأستخرج: يقرأ المعلم بيتي النشاط في الكتاب ص 25 ويناقش ترتيب المراتب الخمس بأمثلة: طائفة، صبر، قتل، أقرب، قيل، ويستخرج الطالب المراتب ويرتبها (10 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n3. سلم المراتب: يرسم المعلم سلمًا من خمس درجات ويطلب من الطلبة وضع بطاقات الكلمات القرآنية على الدرجة المناسبة، ويضع الطالب الكلمة في مرتبتها ويعلل (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية بأسئلة الدرس، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1:\nس1 (مستوى المعرفة): ما التفخيم؟\nالإجابة: سمن يدخل على صوت الحرف فيمتلئ الفم بصداه.\n\nس2 (مستوى التطبيق): أي الحرفين مفخم: السين أم الصاد؟\nالإجابة: الصاد.\n\nس3 (مستوى الاستدلال): علل: تغير معنى كلمة «سار» عند نطقها «صار».\nالإجابة: لأن الصاد حرف مفخم يختلف عن السين المرققة، فإبدال أحدهما بالآخر يغير الكلمة ومعناها.\n\nالحصة 2:\nس1 (مستوى المعرفة): عدد حروف الاستعلاء.\nالإجابة: خ، ص، ض، غ، ط، ق، ظ ويجمعها قولنا: خص ضغط قظ.\n\nس2 (مستوى التطبيق): صنف الحروف الآتية إلى مفخمة ومرققة: ق، س، ط، ب.\nالإجابة: مفخمة: ق، ط. مرققة: س، ب.\n\nس3 (مستوى الاستدلال): اذكر الحروف التي تفخم أحيانًا وترقق أحيانًا.\nالإجابة: الراء، ولام لفظ الجلالة، والألف المدية، والغنة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما أعلى مراتب التفخيم؟\nالإجابة: الحرف المفتوح الذي بعده ألف مثل «قال».\n\nس2 (مستوى التطبيق): رتب الكلمات الآتية حسب قوة التفخيم: قِيل، قَال، قُتل.\nالإجابة: قال، ثم قتل، ثم قيل.\n\nس3 (مستوى الاستدلال): لماذا كان المكسور أدنى مراتب التفخيم؟\nالإجابة: لأن الكسرة تنزل باللسان فيضعف امتلاء الفم بالصوت.", "الحصة 1:\nس1 (مستوى المعرفة): ما الترقيق؟\nالإجابة: نحول يدخل على صوت الحرف فلا يمتلئ الفم بصداه.\n\nس2 (مستوى التطبيق): انطق كلمتي «تين» و«طين» وبين الحرف المفخم.\nالإجابة: الطاء في «طين» مفخمة والتاء في «تين» مرققة.\n\nس3 (مستوى الاستدلال): ما أثر الخطأ في التفخيم والترقيق على قراءة القرآن الكريم؟\nالإجابة: قد يغير المعنى ويخل بصحة التلاوة، لذا يجب الحرص على إتقانه.\n\nالحصة 2:\nس1 (مستوى المعرفة): هل الخاء حرف مفخم أم مرقق؟\nالإجابة: مفخم دائمًا لأنه من حروف الاستعلاء.\n\nس2 (مستوى التطبيق): استخرج حرفًا مفخمًا وآخر مرققًا من كلمة «قريبا».\nالإجابة: القاف مفخمة، والباء مرققة.\n\nس3 (مستوى الاستدلال): صمم بطاقة تعليمية تساعد زملاءك على حفظ أقسام الحروف من حيث التفخيم والترقيق.\nالإجابة: بطاقة تتضمن «خص ضغط قظ» للمفخمة، والحروف المتغيرة الأربعة، وأمثلة لكل قسم.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر مراتب التفخيم الخمس مرتبة.\nالإجابة: المفتوح بعده ألف، المفتوح ليس بعده ألف، المضموم، الساكن، المكسور.\n\nس2 (مستوى التطبيق): في أي مرتبة تفخم الصاد في كلمة «صبرا»؟\nالإجابة: المرتبة الثانية: مفتوح ليس بعده ألف.\n\nس3 (مستوى الاستدلال): استخرج من سورة المعارج كلمتين تمثلان مرتبتين مختلفتين وحدد مرتبتيهما.\nالإجابة: مثل: «واقع» القاف مكسورة في المرتبة الخامسة، «قريبا» القاف مفتوحة ليس بعدها ألف في المرتبة الثانية.", "الحصة 1:\n- للطالب: يراجع تعريفي التفخيم والترقيق ص 22 ويكتب أزواج كلمات يتغير معناها بالتفخيم\n- لولي الأمر: يساعد ابنه على نطق أزواج الكلمات نطقًا صحيحًا\n\nالحصة 2:\n- للطالب: يحفظ عبارة «خص ضغط قظ» ويحل نشاط ص 24\n- لولي الأمر: يسمع من ابنه حروف الاستعلاء السبعة\n\nالحصة 3:\n- للطالب: يراجع مراتب التفخيم ص 25 ويطبقها في تلاوة سورة المعارج\n- لولي الأمر: يستمع لتلاوة ابنه وينبهه إلى نطق حروف الاستعلاء\n🎮 رابط ألعاب ونشاط الدرس التفاعلي ل ة: النهي عن «أف»، عدم النهر، القول الكريم، خفض الجناح، الدعاء، ويستخرج الطالب الصور ويعرضها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أعلل: يطرح المعلم سؤال الكتاب: علل تخصيص الكبر بالذكر، ويدير نقاشًا حول ضعف الوالدين وحاجتهما، ويعلل الطالب ويناقش (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. بطاقات المواقف: يوزع المعلم مواقف (أب يطلب مساعدة، أم مريضة...) ويطلب تحديد السلوك البار في كل موقف، ويحدد الطالب السلوك المناسب ويستدل بالآية (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الرسم الإحصائي لميزانية أسرة خالد من نشاط الكتاب ص 31 ويسأل: ما الذي يلفت نظرك؟ ويلاحظ الطالب ارتفاع نسبة الكماليات وانعدام الادخار (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. حل المشكلة: يوجه المجموعات لتحديد مشكلة أسرة خالد وتخيل أثرها في المجتمع واقتراح حلول، ويحدد الطالب المشكلة: الإسراف وعدم الادخار، ويقترح حلولًا كوضع ميزانية والادخار (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستخلص الوصايا: يناقش المعلم الآيات (26–30): حق ذي القربى والمسكين وابن السبيل، النهي عن التبذير، القول الميسور، التوسط في الإنفاق، ويستخلص الطالب الوصايا ويدونها (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أطبق: يطلب المعلم من كل طالب إعداد ميزانية بسيطة لمصروفه الأسبوعي تحقق الاعتدال، ويعد الطالب ميزانيته ويعرضها (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1:\nس1 (مستوى المعرفة): ما معنى «أف»؟\nالإجابة: كلمة تدل على التضجر.\n\nس2 (مستوى التطبيق): ما معنى «ولا تبسطها كل البسط»؟\nالإجابة: لا تسرف في الإنفاق.\n\nس3 (مستوى الاستدلال): «ولا تجعل يدك مغلولة إلى عنقك»: إلامَ ترمز اليد المغلولة؟\nالإجابة: ترمز إلى البخل والإمساك عن الإنفاق.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الدعاء الذي علمنا الله إياه للوالدين في الآية 24؟\nالإجابة: «رب ارحمهما كما ربياني صغيرا».\ حد؟ ويناقش الطالب ويتوقع الإجابة.\n\nالحصة 3:\nيسأل المعلم: هل يمكن أن يؤجر الإنسان على نومه وأكله؟ وكيف؟ ويعصف الطالب ذهنيًا ويقترح.", "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة نشاط «أتأمل وأناقش»: رجل يشتري سلال الرطب كلها، ويسأل: لماذا اشترى الرجل السلال كلها؟ ويتأمل الطالب ويجيب: رغبة في مساعدة البائع وجبر خاطره وطلب الأجر (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أفهم وأحفظ: يعرض المعلم الحديث الشريف مضبوطًا ويقرؤه قراءة نموذجية: «الأعمال بالنيات، ولكل امرئ ما نوى»، ويستمع الطالب ويتابع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. القراءة الفردية: يطلب المعلم قراءات فردية ويصحح بأسلوب التعلم بالأقران، ويقرأ الطالب ويصحح لزميله (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتعرف الراوي: يوجه المعلم لقراءة الإضاءة عن الصحابي عبد الله بن عباس رضي الله عنهما وسند الحديث في مسند الإمام الربيع بن حبيب ثم يطرح أسئلة، ويقرأ الطالب الإضاءة ويستخرج معلومات عن الراوي (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل: طالبان يذاكران دروسهما، أحدهما ينوي النجاح فقط والآخر ينوي النجاح ونفع وطنه وطاعة الله، هل أجرهما واحد؟ ويناقش الطالب ويتوقع الإجابة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أقرأ وأفهم: يوجه المعلم لقراءة فقرة المعنى الإجمالي في الكتاب ص 34 ويناقشها، ويقرأ الطالب ويلخص المعنى الإجمالي (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. أكتشف أثر النية: يوزع المعلم بطاقات مواقف (عمل واحد بنيتين مختلفتين) ويطلب من المجموعات بيان أثر النية في الحكم والثواب، ويحلل الطالب المواقف ويستنتج أثر النية (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. أربط: يعرض المعلم على السبورة الذكية مخططًا: نية صالحة + عمل صالح = عمل مقبول، ويناقش العلاقة، ويكمل الطالب المخطط بأمثلة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل يمكن أن يؤجر الإنسان على نومه وأكله؟ وكيف؟ ويعصف الطالب ذهنيًا ويقترح (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أحول العادة: يعرض المعلم قائمة عادات (النوم، الأكل، ممارسة الرياضة، الدراسة) ويطلب كتابة نية تحول كل منها إلى عبادة، ويكتب الطالب نية لكل عادة ويعرضها (12 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n3. أحفظ الحديث: يوجه المعلم لحفظ الحديث ثم يسمعه من الطلبة، ويحفظ الطالب ويسمع (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية بأسئلة الدرس، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "الحصة 1:\nس1 (مستوى المعرفة): من راوي حديث «الأعمال بالنيات»؟\nالإجابة: الصحابي عبد الله بن عباس رضي الله عنهما.\n\nس2 (مستوى التطبيق): ما معنى «النيات»؟\nالإجابة: جمع نية، وهي قصد الإنسان المقترن بفعله.\n\nس3 (مستوى الاستدلال): لماذا اشترى الرجل في نشاط «أتأمل وأناقش» السلال كلها؟\nالإجابة: رغبة في مساعدة البائع وإدخال السرور إلى قلبه وطلبًا للأجر.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما المعنى الإجمالي لقوله صلى الله عليه وسلم «ولكل امرئ ما نوى»؟\nالإجابة: أن الإنسان يجازى على عمله بحسب نيته.\n\nس2 (مستوى التطبيق): ما العلاقة بين النية والعمل؟\nالإجابة: النية أساس العمل، وبها يقبل ويثاب عليه.\n\nس3 (مستوى الاستدلال): عملان متشابهان في الظاهر، فلماذا يختلف ثوابهما؟\nالإجابة: لاختلاف نية صاحبيهما.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر عادة يومية ونية تجعلها عبادة.\nالإجابة: النوم بنية التقوي على صلاة الفجر والدراسة.\n\nس2 (مستوى التطبيق): سمّع الحديث الشريف.\nالإجابة: «الأعمال بالنيات، ولكل امرئ ما نوى».\n\nس3 (مستوى الاستدلال): لماذا يعد الإخلاص شرطًا لقبول العمل؟\nالإجابة: لأن الله لا يقبل من العمل إلا ما كان خالصًا لوجهه.", "الحصة 1:\nس1 (مستوى المعرفة): اقرأ الحديث الشريف قراءة صحيحة.\nالإجابة: يقرؤه الطالب قراءة صحيحة.\n\nس2 (مستوى التطبيق): في أي كتاب ورد الحديث كما في الكتاب؟\nالإجابة: في مسند الإمام الربيع بن حبيب.\n\nس3 (مستوى الاستدلال): ماذا تقترح على والدك إذا كنت معه وشاهدت بائعًا محتاجًا؟\nالإجابة: أن يشتري منه ليدخل السرور إلى قلبه، وأن يخبر الناس عن بضاعته.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «الأعمال بالنيات ...».\nالإجابة: «ولكل امرئ ما نوى».\n\nس2 (مستوى التطبيق): اذكر أثرًا واحدًا للنية الصالحة في العمل.\nالإجابة: تجعل العمل مقبولًا ومثابًا عليه.\n\nس3 (مستوى الاستدلال): صحح نية من يتصدق ليمدحه الناس.\nالإجابة: يتصدق ابتغاء وجه الله وحده لا طلبًا لمدح الناس.\n\nالحصة 3:\nس1 (مستوى المعرفة): كيف تجعل ممارستك للرياضة عبادة؟\nالإجابة: أنوي بها تقوية جسمي لطاعة الله وخدمة وطني.\n\nس2 (مستوى التطبيق): ما معنى الإخلاص؟\nالإجابة: إفراد الله بالقصد في الطاعة.\n\nس3 (مستوى الاستدلال): ضع لنفسك خطة يومية لاستحضار النية الصالحة في ثلاثة أعمال.\nالإجابة: مثل: الذهاب للمدرسة بنية طلب العلم، الأكل بنية التقوي، مساعدة الأم بنية البر.", "الحصة 1:\n- للطالب: يقرأ الحديث ص 33 ويبدأ حفظه\n- لولي الأمر: يستمع لقراءة ابنه للحديث\n\nالحصة 2:\n- للطالب: يكمل حفظ الحديث ويحل نشاط ص 35\n- لولي الأمر: يحاور ابنه في نيته عند أداء واجباته\n\nالحصة 3:\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 37 ويطبق خطة النية\n- لولي الأمر: يذكر ابنه باستحضار النية قبل أعماله اليومية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=5"], "h": [["الدرس", "الأعمال بالنيات (حديث شريف)"], ["الوحدة", "الوحدة الأولى"], ["صفحات كتاب الطالب", "33–37"], ["صفحات دليل المعلم", "42–47"], ["عدد الحصص", "3"]]}, {"id": "wahhab", "t": "الله «الوهاب» (عقيدة)", "u": "الوحدة الأولى", "ps": [{"n": 1, "ax": "معنى اسم الله الوهاب والاستدلال عليه", "h": [["الدرس", "الله «الوهاب» (عقيدة)"], ["الوحدة", "الوحدة الأولى"], ["الأسبوع والتاريخ", "الأسبوع الثالث: 20–24/9/2026م"], ["صفحات كتاب الطالب", "38–39"], ["صفحات دليل المعلم", "48–51"], ["رقم الحصة", "1 من 2"], ["محور الحصة", "معنى اسم الله الوهاب والاستدلال عليه"]], "f": ["1. يتعرف معنى اسم الله الوهاب\n2. يستدل من القرآن الكريم على اسم الله الوهاب\n\nمخرج تعليمي آخر:\n3. يحب الله تعالى لكثرة هباته", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. الت ء وترقيقها قبل غيرها (10 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n3. خريطة الحكم: يبني المعلم مع الطلبة خريطة مقارنة: الألف المدية تتبع ما قبلها، والغنة في الإخفاء تتبع ما بعدها، ويكمل الطالب الخريطة بأمثلة (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أطبق: يوزع كلمات قرآنية على المجموعات لتحديد حكم الغنة فيها مع التعليل، ويحدد الطالب الحكم ويعلل (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم على السبورة الذكية الآية «فلا أقسم برب المشارق والمغارب إنا لقادرون» ويسأل: أين الألف المدية؟ وما حكمها؟ ويستخرج الطالب «المشارق» و«المغارب» و«لقادرون» ويحدد الحكم (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أقرأ وأطبق: يقرأ المعلم آيات من الكتاب ص 60 قراءة نموذجية مبرزًا الحكمين، ويكرر الطالب القراءة مطبقًا الحكمين (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. صيد الكلمات: يوزع المعلم على كل مجموعة آيات ويطلب صيد أكبر عدد من الكلمات فيها ألف مدية أو غنة وتحديد الحكم، ويصيد الطالب الكلمات مع مجموعته ويعلل (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يُسمع المعلم تسجيلين لقارئين أحدهما يطبق الحكمين والآخر يخطئ، ويسأل: أيهما أصح؟ ولماذا؟ ويقارن الطالب ويحدد مواضع الخطأ (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أقيم تعلمي: يوجه المعلم لحل أسئلة «أقيم تعلمي» ص 62 فرديًا ثم يناقش الإجابات، ويحل الطالب الأسئلة ويصحح ذاتيًا (12 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n3. تسجيل وتقييم: يطلب المعلم من الطلبة أزواجًا قراءة آيتين وتقييم بعضهم ببطاقة التقييم، ويقرأ الطالب ويقيم زميله بالبطاقة (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. معالجة الأخطاء: يعالج المعلم الأخطاء الشائعة الملحوظة بتكرار النطق الصحيح جماعيًا، ويكرر الطالب النطق الصحيح (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.", "الحصة 1:\nس1 (مستوى المعرفة): متى تكون الألف مدية؟\nالإجابة: إذا كانت ساكنة وقبلها حرف مفتوح.\n\nس2 (مستوى التطبيق): ما حكم الألف في كلمة «الطاغية»؟ ولماذا؟\nالإجابة: مفخمة لأنها جاءت بعد الطاء المفخمة.\n\nس3 (مستوى الاستدلال): لماذا رققت الألف في «سائل» وفخمت في «طائفة»؟\nالإجابة: لأنها في «سائل» بعد السين المرققة، وفي «طائفة» بعد الطاء المفخمة، والألف المدية تتبع ما قبلها.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الغنة؟\nالإجابة: صوت أغن يخرج من الخيشوم.\n\nس2 (مستوى التطبيق): ما حكم الغنة في كلمة «ينصرون»؟\nالإجابة: مفخمة لأن بعدها الصاد المفخمة.\n\nس3 (مستوى الاستدلال): ما الفرق بين حكم الألف المدية وحكم الغنة من حيث التبعية؟\nالإجابة: الألف تتبع ما قبلها، والغنة تتبع ما بعدها.\n\nالحصة 3:\nس1 (مستوى المعرفة): حدد حكم الألف في «لقادرون».\nالإجابة: مفخمة لأنها بعد القاف.\n\nس2 (مستوى التطبيق): اقرأ «إنهم يرونه بعيدا ونراه قريبا» مطبقًا حكم الألف في «ونراه».\nالإجابة: تفخم الألف بعد الراء المفتوحة.\n\nس3 (مستوى الاستدلال): كلمة «انطلقوا»: حدد حكم الغنة فيها وعلله.\nالإجابة: مفخمة لأن بعد النون الساكنة حرف الطاء المفخم.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما حكم الألف المدية في «الصالحات»؟\nالإجابة: مفخمة في «الصا» لأنها بعد الصاد، ومرققة في «حات» لأنها بعد الحاء.\n\nس2 (مستوى التطبيق): ما حكم الغنة في «من ضيق»؟\nالإجابة: مفخمة لأن بعدها الضاد المفخمة.\n\nس3 (مستوى الاستدلال): قيم قراءة زميلك لكلمة «فانطلقوا» إذا رقق الغنة.\nالإجابة: قراءة خاطئة، والصواب تفخيم الغنة لأن بعدها الطاء.", "الحصة 1:\nس1 (مستوى المعرفة): ما حكم الألف المدية؟\nالإجابة: تتبع ما قبلها تفخيمًا وترقيقًا.\n\nس2 (مستوى التطبيق): حدد حكم الألف في كلمة «خاوية».\nالإجابة: مفخمة لأنها بعد الخاء.\n\nس3 (مستوى الاستدلال): صنف الكلمات: قال، الناس، طال، كانوا.\nالإجابة: مفخمة: قال، طال. مرققة: الناس، كانوا.\n\nالحصة 2:\nس1 (مستوى المعرفة): من أين تخرج الغنة؟\nالإجابة: من الخيشوم.\n\nس2 (م لخير للمنصوح", "الحصة 1:\nيعرض المعلم صورة لرجل يسرع من طرف مدينة ويسأل: لماذا قد يسرع إنسان من مكان بعيد؟ ويتوقع الطالب أسبابًا ويربطها بعنوان الدرس.\n\nالحصة 2:\nيسأل المعلم: إذا أردت أن تقنع زميلك بأمر نافع، ماذا تستخدم؟ ويذكر الطالب الأدلة والكلام الطيب.\n\nالحصة 3:\nيقرأ المعلم قوله تعالى «قيل ادخل الجنة قال يا ليت قومي يعلمون» ويسأل: ماذا تمنى الرجل بعد دخوله الجنة؟ ويجيب الطالب ويستنتج حبه الخير لقومه.\n\nالحصة 4:\nيسأل المعلم: لماذا لم يذكر القرآن اسم الرجل المؤمن في رأيك؟ ويقترح الطالب أن العبرة بالموقف لا بالاسم.", "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة لرجل يسرع من طرف مدينة ويسأل: لماذا قد يسرع إنسان من مكان بعيد؟ ويتوقع الطالب أسبابًا ويربطها بعنوان الدرس (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع المعلم التلاوة النموذجية للآيات ويبرز تفخيم الألف في «خامدون» وترقيقها في «آلهة»، ويستمع الطالب ويتابع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الفردية: يستمع المعلم لقراءات فردية ويصحح، ويقرأ الطالب ويصحح لزميله (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. أتعرف المعنى: يوجه المجموعات لاستخراج معاني المفردات من الكتاب ص 64، ويستخرج الطالب المعاني ويعرضها (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: إذا أردت أن تقنع زميلك بأمر نافع، ماذا تستخدم؟ ويذكر الطالب الأدلة والكلام الطيب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. أسرد القصة: يوجه المعلم لقراءة المعنى الإجمالي ص 64–65 ثم يطلب من طالب سرد القصة بأسلوبه، ويقرأ الطالب ويسرد القصة بتسلسل (12 دقيقة)\nالاستراتيجيات: المنظمات التخطيطية.\n\n3. أستخرج الحجج: يعرض المعلم الآيات (20–25) على السبورة الذكية ويوزع بطاقات الحجج على المجموعات: الرسل لا يسألون أجرًا، عبادة الخالق، عجز الآلهة، إعلان الإيمان، ويطلب ربط كل حجة بآيتها، ويربط الطالب الحجة بالآية ويشرحها (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. لعب أدوار: يكلف طالبين بتمثيل حوار دعوي هادئ مستفيدين من أسلوب الرجل المؤمن، ويمثل الطالب الحوار ويقيمه زملاؤه (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يقرأ المعلم قوله تعالى «قيل ادخل الجنة قال يا ليت قومي يعلمون» ويسأل: ماذا تمنى الرجل بعد دخوله الجنة؟ ويجيب الطالب ويستنتج حبه الخير لقومه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. جدول المقارنة: يعرض المعلم على السبورة الذكية جدولًا للمقارنة بين الفريقين: الموقف، الجزاء، الآية الدالة، ويوجه المجموعات لإكماله، ويكمل الطالب الجدول من الآيات (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. أتدبر: يناقش المعلم دلالة تمني الرجل أن يعلم قومه رغم أنهم قتلوه، ودلالة «إن كانت إلا صيحة واحدة» على قدرة الله، ويستنتج الطالب دلالات الآيات (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. أعبر: يطلب المعلم كتابة رسالة قصيرة من الرجل المؤمن إلى قومه بعد دخوله الجنة، ويكتب الطالب الرسالة ويقرؤها (8 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: لماذا لم يذكر القرآن اسم الرجل المؤمن في رأيك؟ ويقترح الطالب أن العبرة بالموقف لا بالاسم (5 دقائق)\nالاستراتيجيات: المنظمات التخطيطية.\n\n2. أستخلص العبر: يوجه المجموعات لاستخلاص ثلاث عبر من القصة وكتابتها على لوحة، ويستخلص الطالب: الشجاعة في الحق، النصح، العاقبة للمتقين (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. مشروع نصيحة: يكلف كل مجموعة بتصميم بطاقة نصح لزملاء المدرسة في موضوع (الصلاة، النظافة، الصدق) مستفيدة من أسلوب الرجل المؤمن، ويصمم الطالب البطاقة ويعرضها (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية بأسئلة الدرس، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1:\nس1 (مستوى المعرفة): ما معنى «يسعى»؟\nالإجابة: يسرع.\n\nس2 (مستوى التطبيق): ما معنى «فطرني»؟\nالإجابة: خلقني.\n\nس3 (مستوى الاستدلال): ما دلالة لفظة «يسعى» في الآية 20؟\nالإجابة: تدل على حرص الرجل المؤمن واهتمامه بنصح قومه.\n\nالحصة 2:\nس1 (مستوى المعرفة): بمَ أمر الرجل المؤمن قومه في الآية 20؟\nالإجابة: أمرهم باتباع المرسلين.\n\nس2 (مستوى التطبيق): اذكر حجتين ساقهما الرجل المؤمن لإقناع قومه.\nالإجابة: أن المرسلين لا يسألون أجرًا وهم مهتدون، وأن العبادة للخالق الذي إليه المرجع.\n\nس3 (مستوى الاستدلال): كيف استدل الرجل المؤمن على بطلان عبادة الآلهة؟\nالإجابة: بأنها لا تغني شفاعتها شيئًا ولا تنقذ أحدًا إن أراد الله به ضرًا.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما جزاء الرجل المؤمن؟\nالإجابة: دخول الجنة والتكريم.\n\nس2 (مستوى التطبيق): كيف أهلك الله أصحاب القرية؟\nالإجابة: بصيحة واحدة فإذا هم خامدون.\n\nس3 (مستوى الاستدلال): علل: تمنى الرجل المؤمن أن يعلم قومه ما أكرمه الله به.\nالإجابة: لحبه الخير لهم ورغبته في أن يؤمنوا فينالوا ما ناله.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر عبرة من قصة الرجل المؤمن.\nالإجابة: الشجاعة في قول الحق ونصح الناس.\n\nس2 (مستوى التطبيق): ما دلالة إخفاء اسم الرجل المؤمن في القرآن؟\nالإجابة: أن العبرة بموقفه وعمله لا باسمه.\n\nس3 (مستوى الاستدلال): كيف تقتدي بالرجل المؤمن في المدرسة؟\nالإجابة: أنصح زملائي بلطف وأدعوهم إلى الخير دون انتظار مقابل.", "الحصة 1:\nس1 (مستوى المعرفة): اتلُ الآيات (20–25) تلاوة صحيحة.\nالإجابة: يتلوها الطالب تلاوة صحيحة.\n\nس2 (مستوى التطبيق): ما معنى «خامدون»؟\nالإجابة: ميتون هامدون لا حراك بهم.\n\nس3 (مستوى الاستدلال): لماذا جاء الرجل من أقصى المدينة ولم ينتظر أن يأتيه الخبر؟\nالإجابة: لحرصه على هداية قومه ونصرة المرسلين.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: «اتبعوا من لا يسألكم أجرا ...».\nالإجابة: «وهم مهتدون».\n\nس2 (مستوى التطبيق): ماذا أعلن الرجل المؤمن في الآية 25؟\nالإجابة: «إني آمنت بربكم فاسمعون».\n\nس3 (مستوى الاستدلال): اختر حجة من حجج الرجل المؤمن وبين كيف تستفيد منها في نصح صديق.\nالإجابة: مثل: أنصحه دون مقابل وأبين له أن النصح لمصلحته.\n\nالحصة 3:\nس1 (مستوى المعرفة): أكمل: «إن كانت إلا صيحة واحدة ...».\nالإجابة: «فإذا هم خامدون».\n\nس2 (مستوى التطبيق): قارن بين عاقبة الرجل المؤمن وعاقبة قومه.\nالإجابة: المؤمن في الجنة مكرم، وقومه هلكوا بصيحة واحدة.\n\nس3 (مستوى الاستدلال): ماذا تتعلم من حرص الرجل المؤمن على قومه بعد موته؟\nالإجابة: أن المؤمن يحب الخير لغيره ولا يحمل الحقد.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما الصفة التي دلت عليها كلمة «يسعى»؟\nالإجابة: الحرص والمبادرة إلى الخير.\n\nس2 (مستوى التطبيق): اذكر عبرتين من القصة.\nالإجابة: الصبر على الدعوة، وعاقبة المكذبين الهلاك.\n\nس3 (مستوى الاستدلال): اقترح طريقة حديثة تنشر بها الخير مقتديًا بالرجل المؤمن.\nالإجابة: مثل: إعداد مقطع توعوي قصير في الإذاعة المدرسية.", "الحصة 1:\n- للطالب: يتلو الآيات (20–30) ويحفظ معاني المفردات ص 64\n- لولي الأمر: يستمع لتلاوة ابنه ويناقشه في معنى «يسعى»\n\nالحصة 2:\n- للطالب: يقرأ ص 64–65 ويسرد القصة لأسرته\n- لولي الأمر: يستمع لسرد ابنه للقصة ويسأله عن حجج الرجل المؤمن\n\nالحصة 3:\n- للطالب: يقرأ ص 65 ويكمل جدول المقارنة\n- لولي الأمر: يحاور ابنه في عاقبة المؤمن والمكذبين\n\nالحصة 4:\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 66\n- لولي الأمر: يشجع ابنه على مبادرة نصح نافعة في محيطه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=11"], "h": [["الدرس", "سورة يس (20–30) (تفسير)"], ["الوحدة", "الوحدة الثانية"], ["صفحات كتاب الطالب", "63–66"], ["صفحات دليل المعلم", "74–79"], ["عدد الحصص", "4"]]}, {"id": "akh", "t": "المسلم أخو المسلم (حديث شريف)", "u": "الوحدة الثانية", "ps": [{"n": 1, "ax": "قراءة الحديث ومعاني المفردات والراوي", "h": [["الدرس", "المسلم أخو المسلم (حديث شريف)"], ["الوحدة", "الوحدة الثانية"], ["الأسبوع والتاريخ", "الأسبوع السابع: 18–22/10/2026م"], ["صفحات كتاب الطالب", "67–68"], ["صفحات دليل المعلم", "80–85"], ["رقم الحصة", "1 من 2"], ["محور الحصة", "قراءة الحديث ومعاني المفردات والراوي"]], "f": ["1. يقرأ الحديث الشريف قراءة صحيحة\n2. يذكر معاني بعض المفردات والتراكيب الواردة في الحديث الشريف\n3. يتعرف راوي الحديث الشريف\n\nمخرج تعليمي آخر:\n4. يعتز بأخوة الإسلام", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3 ليمي آخر:\n4. يؤمن أن الإسلام هو الدين الحق", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الخرائط المفاهيمية", "1. الكتاب\n2. السبورة الذكية\n3. عروض تقديمية", "- الدين: ما شرعه الله لعباده من عقائد وعبادات وأحكام\n- الفطرة: الخلقة التي خلق الله الناس عليها\n- خصائص الإسلام: الربانية، الشمول، الوسطية، اليسر", "يسأل المعلم: لماذا وجدت الأديان عند الشعوب على مر التاريخ؟ ويعصف الطالب ذهنيًا ويستنتج حاجة الإنسان الفطرية إلى الدين.", "1. التهيئة: يسأل المعلم: لماذا وجدت الأديان عند الشعوب على مر التاريخ؟ ويعصف الطالب ذهنيًا ويستنتج حاجة الإنسان الفطرية إلى الدين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أتعرف المفهوم: يقرأ المعلم مع الطلبة قوله تعالى «فأقم وجهك للدين حنيفا فطرة الله التي فطر الناس عليها» (الروم 30) ويبين مفهوم الدين، ويستنتج الطالب أن الدين حاجة فطرية ويكتب المفهوم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أهمية الدين: يوجه المجموعات لاستخراج أهمية الدين من الكتاب ص 73: الطمأنينة، تنظيم الحياة، حفظ الحقوق، الإجابة عن أسئلة الوجود، ويستخرج الطالب ويعرض (10 دقائق)\nالاستراتيجيات: الخرائط المفاهيمية.\n\n4. خريطة الخصائص: يبني المعلم مع الطلبة خريطة لخصائص الدين الحق مع الاستدلال بقوله تعالى «إن الدين عند الله الإسلام» (آل عمران 19)، ويكمل الطالب الخريطة بالأمثلة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "س1 (مستوى المعرفة): ما المقصود بالدين؟\nالإجابة: ما شرعه الله لعباده من عقائد وعبادات وأحكام.\n\nس2 (مستوى التطبيق): اذكر أمرين يدلان على أهمية الدين في حياة الإنسان.\nالإجابة: يحقق الطمأنينة، وينظم حياة الناس.\n\nس3 (مستوى الاستدلال): كيف تدل كلمة «فطرة» في الآية على حاجة الإنسان إلى الدين؟\nالإجابة: لأن الله خلق الإنسان مهيأ للإيمان، فالتدين أصيل في نفسه.", "س1 (مستوى المعرفة): اذكر آية تدل على أن الإسلام هو الدين الحق.\nالإجابة: «إن الدين عند الله الإسلام» آل عمران 19.\n\nس2 (مستوى التطبيق): عدد خاصيتين من خصائص الإسلام.\nالإجابة: الشمول، والوسطية. راءة صحيحة.\nالإجابة: يقرؤه الطالب قراءة صحيحة.\n\nس2 (مستوى التطبيق): ما معنى «سراء»؟\nالإجابة: ما يسر الإنسان من نعمة.\n\nس3 (مستوى الاستدلال): ما الصفة التي تعجبك في صهيب رضي الله عنه؟ ولماذا؟\nالإجابة: مثل: سبقه إلى الإسلام وتضحيته، لأنها تدل على قوة إيمانه.\n\nالحصة 2:\nس1 (مستوى المعرفة): سمّع الحديث الشريف.\nالإجابة: يسمعه الطالب حفظًا متقنًا.\n\nس2 (مستوى التطبيق): اذكر صورة للشكر وأخرى للصبر.\nالإجابة: الشكر: حمد الله على النجاح، الصبر: الرضا عند المرض دون تسخط.\n\nس3 (مستوى الاستدلال): خسر فريقك المباراة فغضب زميلك وكسر الكرسي: قيم تصرفه في ضوء الحديث.\nالإجابة: تصرف خاطئ، والمؤمن يصبر ويستفيد من الخسارة ويحافظ على الممتلكات.", "الحصة 1:\n- للطالب: يقرأ الحديث ص 103 ويبدأ حفظه\n- لولي الأمر: يستمع لقراءة ابنه للحديث\n\nالحصة 2:\n- للطالب: يحفظ الحديث ويحل أسئلة «أقيم تعلمي» ص 107–108\n- لولي الأمر: يعين ابنه على الشكر والصبر في مواقف حياته\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=19"], "h": [["الدرس", "المؤمن شاكر صابر (حديث شريف)"], ["الوحدة", "الوحدة الثالثة"], ["صفحات كتاب الطالب", "103–108"], ["صفحات دليل المعلم", "120–125"], ["عدد الحصص", "2"]]}, {"id": "raja", "t": "الرجاء والخوف (عقيدة)", "u": "الوحدة الثالثة", "ps": [{"n": 1, "ax": "مفهوم الرجاء والخوف والتوازن بينهما", "h": [["الدرس", "الرجاء والخوف (عقيدة)"], ["الوحدة", "الوحدة الثالثة"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر: 15–19/11/2026م"], ["صفحات كتاب الطالب", "109–110"], ["صفحات دليل المعلم", "126–130"], ["رقم الحصة", "1 من 2"], ["محور الحصة", "مفهوم الرجاء والخوف والتوازن بينهما"]], "f": ["1. يتعرف مفهوم الرجاء والخوف\n2. يستدل من القرآن الكريم على الجمع بين الرجاء والخوف\n\nمخرج تعليمي آخر:\n3. يرجو رحمة الله ويخاف عذابه", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. الخرائط المفاهيمية", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية", "- الرجاء: الطمع في رحمة الله مع الأخذ بالأسباب\n- الخوف: خشية عذاب الله التي تحمل على الطاعة وترك المعصية\n- التوازن: الجمع بين الرجاء والخوف كجناحي ال بالاحترام والاجتهاد والدعاء له.\n\nس2 (مستوى التطبيق): اذكر نموذجًا من وفاء النبي صلى الله عليه وسلم لمن أحسن إليه.\nالإجابة: ثناؤه على الأنصار ووفاؤه لهم.\n\nس3 (مستوى الاستدلال): صمم مبادرة لشكر عمال النظافة في مدرستك.\nالإجابة: إعداد بطاقات شكر وتكريمهم في الطابور الصباحي.", "الحصة 1:\n- للطالب: يقرأ ص 124–126 ويكتب بطاقة شكر لمن أحسن إليه\n- لولي الأمر: يشجع ابنه على التعبير عن شكره لمن يحسن إليه\n\nالحصة 2:\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 128–129\n- لولي الأمر: يشارك ابنه في مبادرة شكر لأصحاب الفضل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=23"], "h": [["الدرس", "أعترف بالجميل (قيم وأخلاق)"], ["الوحدة", "الوحدة الثالثة"], ["صفحات كتاب الطالب", "124–129"], ["صفحات دليل المعلم", "143–149"], ["عدد الحصص", "2"]]}, {"id": "tafkhimr", "t": "تفخيم الراء (تجويد)", "u": "الوحدة الرابعة", "ps": [{"n": 1, "ax": "تفخيم الراء المتحركة والساكنة بعد فتح أو ضم", "h": [["الدرس", "تفخيم الراء (تجويد)"], ["الوحدة", "الوحدة الرابعة"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر: 29/11–3/12/2026م"], ["صفحات كتاب الطالب", "130–131"], ["صفحات دليل المعلم", "150–154"], ["رقم الحصة", "1 من 2"], ["محور الحصة", "تفخيم الراء المتحركة والساكنة بعد فتح أو ضم"]], "f": ["1. يتعرف تفخيم الراء\n2. يعدد حالات تفخيم الراء المفتوحة والمضمومة والساكنة بعد فتح أو ضم\n\nمخرج تعليمي آخر:\n3. يحرص على تطبيق تفخيم الراء في تلاوته", "المخرج 1: تذكر\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. الحوار والمناقشة", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية", "- تفخيم الراء: نطقها سمينة يمتلئ الفم بصداها\n- حالاته هنا: الراء المفتوحة مثل «ربنا»، والمضمومة مثل «رُزقوا»، والساكنة بعد فتح أو ضم مثل «الأرْض» و«القُرْآن»", "يذكر الطلبة بحالات ترقيق الراء ثم يقرأ «ربنا» و«رِزقا» ويسأل: ما الفرق؟ ويستنتج الطالب أن المفتوحة تفخم والمكسورة ترقق.", "1. التهيئة: يذكر الطلبة بحالات ترقيق الراء ثم يقرأ «ربنا» و«رِزقا» ويسأل: ما الفرق؟ ويستنتج الطالب أن المفتوحة تفخم والمكسورة ترقق (5 دقائق)\nالاستراتيجيات: التعلم اللعب.\n\n3. أستخلص الدروس: يوجه المجموعات لكتابة ثلاثة دروس من سيرته على لوحة الدروس، ويكتب الطالب الدروس ويعرضها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مسابقة: ينفذ المعلم مسابقة المجموعات على السبورة الذكية بأسئلة الدرس كاملًا، ويشارك الطالب مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. التقويم الختامي والغلق: يطرح المعلم أسئلة التقويم الختامي، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: القصة.", "الحصة 1:\nس1 (مستوى المعرفة): ما اسم أبي عبيدة بن الجراح؟\nالإجابة: عامر بن عبد الله بن الجراح.\n\nس2 (مستوى التطبيق): بمَ لقب النبي صلى الله عليه وسلم أبا عبيدة؟\nالإجابة: أمين هذه الأمة.\n\nس3 (مستوى الاستدلال): ما دلالة أن يكون أبو عبيدة من العشرة المبشرين بالجنة؟\nالإجابة: تدل على صدق إيمانه وعظيم منزلته عند الله.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر صفتين من صفات أبي عبيدة.\nالإجابة: الأمانة، والزهد.\n\nس2 (مستوى التطبيق): ماذا وجد عمر بن الخطاب في بيت أبي عبيدة بالشام؟\nالإجابة: سيفه وترسه ورحله.\n\nس3 (مستوى الاستدلال): ما الصفة التي يدل عليها موقفه يوم أحد؟ وعلل.\nالإجابة: الشجاعة وحب النبي صلى الله عليه وسلم، لأنه ضحى بأسنانه لإنقاذه.\n\nالحصة 3:\nس1 (مستوى المعرفة): في أي وباء توفي أبو عبيدة؟\nالإجابة: طاعون عمواس.\n\nس2 (مستوى التطبيق): اذكر درسًا مستفادًا من سيرته.\nالإجابة: الأمانة في أداء المسؤولية.\n\nس3 (مستوى الاستدلال): ما دلالة بقائه مع جنده في الطاعون؟\nالإجابة: تحمله المسؤولية ووفاؤه لجنده ورضاه بقضاء الله.", "الحصة 1:\nس1 (مستوى المعرفة): من أي قبيلة أبو عبيدة؟\nالإجابة: من قريش.\n\nس2 (مستوى التطبيق): اذكر محطة من محطات حياته.\nالإجابة: شهوده غزوة بدر وأحد، أو قيادته جيوش الشام.\n\nس3 (مستوى الاستدلال): صف بكلماتك صفات الشخص الأمين مستفيدًا من سيرة أبي عبيدة.\nالإجابة: يحفظ الحقوق ويؤدي ما اؤتمن عليه ولا يخون ولا يستغل منصبه.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الصفة التي دل عليها خلو بيته من متاع الدنيا وهو أمير الشام؟\nالإجابة: الزهد.\n\nس2 (مستوى التطبيق): اذكر موقفًا يدل على تواضعه.\nالإجابة: عيشه البسيط مع أنه قائد الجيوش وأمير الشام.\n\nس3 (مستوى الاستدلال): كيف تقتدي بزهد أبي عبيدة في حياتك؟\nالإجابة: بالاعتدال في الشراء وعدم التفاخر بالمقتنيات.\n\nالحصة 3:\nس1 (مستوى المعرفة): في أي بلاد توفي أبو عبيدة؟\nالإجابة: في الشام.\n\nس2 (مستوى التطبيق): اذكر درسين من سيرة أبي عبيدة.\nالإجابة: الأمانة، والتواضع.\n\nس3 (مستوى الاستدلال): اكتب رسالة قصيرة إلى قائد فريقك المدرسي تستلهم فيها قيمة من سيرة أبي عبيدة.\nالإجابة: مثل: «كن أمينًا على وقت فريقك ومهامه كما كان أبو عبيدة أمينًا على الأمة».", "الحصة 1:\n- للطالب: يقرأ ص 153–154 ويكمل بطاقة التعريف\n- لولي الأمر: يحكي لابنه عن أمانة أبي عبيدة\n\nالحصة 2:\n- للطالب: يقرأ ص 155–156 ويكتب موقفًا أعجبه من حياة أبي عبيدة\n- لولي الأمر: يحاور ابنه في التواضع والزهد\n\nالحصة 3:\n- للطالب: يحل أسئلة «أقيم تعلمي» ص 157–158\n- لولي الأمر: يحاور ابنه في قيمة الأمانة وتحمل المسؤولية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/7/islamic/?l=29"], "h": [["الدرس", "أبو عبيدة بن الجراح رضي الله عنه (سيرة)"], ["الوحدة", "الوحدة الرابعة"], ["صفحات كتاب الطالب", "153–158"], ["صفحات دليل المعلم", "173–178"], ["عدد الحصص", "3"]]}]},{"F": ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"], "L": [{"id": "maarij", "t": "سورة المعارج (تلاوة وحفظ)", "u": "مقرر التلاوة والحفظ", "ps": [{"n": 1, "ax": "تلاوة الآيات (1–5) وحفظها + تلاوة الآيات (6–10) وحفظها", "h": [["الدرس", "سورة المعارج (تلاوة وحفظ)"], ["الوحدة", "مقرر التلاوة والحفظ"], ["الأسبوع والتاريخ", "الأسبوع الأول: 6–10/9/2026م"], ["صفحات كتاب الطالب", "15–21"], ["صفحات دليل المعلم", "26–28"], ["رقم الحصة", "1 من 10"], ["محور الحصة", "تلاوة الآيات (1–5) وحفظها"]], "f": ["1. يتلو الآيات (1–5) من سورة المعارج تلاوة صحيحة مراعيًا أحكام التجويد\n2. يبين معنى «ذي المعارج» و«الصبر الجميل»\n3. يحفظ الآيات (1–5) حفظًا متقنًا\n4. يتلو الآيات (6–10) تلاوة صحيحة مراعيًا التفخيم والترقيق\n5. يصف أهوال يوم القيامة الواردة في الآيات\n6. يحفظ الآيات (6–10) حفظًا متقنًا\n\nمخرج تعليمي آخر:\n7. يتحلى بالصبر الجميل عند الشدائد\n8. يستعد ليوم القيامة بالعمل الصالح", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تذكر\nالمخرج 4: تقييم\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: تذكر\nالمخرج 8: تقييم", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. التعلم بالأقران\n4. التعلم المبني على اللعب\n5. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. السبورة التقليدية\n6. أخرى: بطاقات كلمات الآيات", "- المعارج: المصاعد والدرجات التي تصعد بها الملائكة إلى الله تعالى\n- الصبر الجميل: الصبر الذي لا شكوى فيه لغير الله\n- مقدار يوم القيامة: خمسون ألف سنة\n- المهل: المعدن المذاب أو عكر الزيت\n- العهن: الصوف المصبوغ المنفوش\n- الحميم: القريب الصديق", "يعرض المعلم صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)، ويتأمل الطالب الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها.", "1. التهيئة: يعرض المعلم صورة لسلم صاعد ويسأل: إلى أين يصعد السلم؟ ثم يربط بمعنى المعارج ويعرض اسم السورة وعدد آياتها (44 آية)، ويتأمل الطالب الصورة ويتوقع معنى الكلمة ويكتب اسم السورة وعدد آياتها (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: يُسمع الطلبة التلاوة النموذجية للآيات (1–5) من الوسائل المتعددة ثم يقرأ بنفسه بتأنٍّ مبرزًا المد في «سائل» و«واقع»، ويستمع الطالب منصتًا ويتابع في المصحف ويضع إصبعه على موضع القراءة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلاوة الجماعية والفردية: يقرأ المعلم الآيات مع الطلبة جماعيًا ثم يستمع لقراءات فردية ويكلف القارئ المتقن بتصويب زميله (تعلم بالأقران)، ويقرأ الطالب جماعيًا ثم فرديًا ويصحح لزميله بأدب (6 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n4. أتعرف المعنى: يناقش المعلم معاني: سأل سائل، دافع، المعارج، تعرج، والروح (جبريل عليه السلام)، ويستخرج الطالب معنى كل كلمة ويدونها في كراسته (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الحفظ بالتكرار: يقسم المعلم الآيات إلى مقطعين (1–3) و(4–5) ويوجه للتكرار المتدرج ثم يجري تسميعًا ثنائيًا، ويكرر الطالب المقطع ويسمّعه لزميله ثم يسمع الآيات كاملة
