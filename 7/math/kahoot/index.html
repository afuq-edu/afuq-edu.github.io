:root{--ink:#2a3a47;--soft:#6a7f8e;--paper:#f8faf8;--grid:#e3ece8;--line:#d9e4e0;--acc:#2f6c8f;--good:#3f9a6b;--bad:#c9705b;
 --g1:#6fbfb0;--g2:#f0a48f;--g3:#8db6e6;--g4:#efc46f;--g5:#b6a3df;--g6:#a6c98a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Plex,system-ui,sans-serif;color:var(--ink);background:var(--paper);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;overflow-x:hidden}
.screen{display:none;min-height:100vh;padding:clamp(12px,2.2vw,28px);animation:in .45s ease}
.screen.on{display:flex;flex-direction:column}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-family:Kufi,Plex;font-size:clamp(1.2rem,2.4vw,1.8rem);color:var(--acc);flex:1}
.icon{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2vw,24px);box-shadow:0 6px 24px rgba(42,58,71,.06)}
/* setup */
.setup{max-width:880px;width:100%;margin:0 auto;display:grid;gap:14px}
.setup h1{font-family:Kufi,Plex;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.6rem);margin:4px 0 0;color:var(--acc);text-align:center}
.setup .lead{text-align:center;color:var(--soft);margin:0 0 6px}
.row{display:grid;gap:8px}
.row>label{font-weight:700;color:var(--acc)}
select,input[type=text]{font:inherit;font-size:1.05rem;padding:10px 12px;border:1.5px solid #cddcd7;border-radius:12px;background:#fff;color:var(--ink);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;border:1.5px solid #cddcd7;background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700;color:var(--soft)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid #cddcd7;background:#fff;font-size:1.4rem;cursor:pointer;color:var(--acc)}
.stepper output{font-family:Plex;font-weight:700;font-size:1.6rem;min-width:2.2em;text-align:center}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.names div{display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.go{font:inherit;font-family:Kufi,Plex;font-size:1.35rem;border:0;border-radius:16px;background:var(--acc);color:#fff;padding:12px 30px;cursor:pointer;justify-self:center;box-shadow:0 6px 16px rgba(47,108,143,.25)}
.go:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--soft);font-size:.9rem}
/* question */
.qwrap{flex:1;display:grid;align-content:start;grid-template-columns:1fr minmax(150px,210px);gap:16px;max-width:1400px;width:100%;margin:0 auto;align-items:start}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.prog{font-weight:700;color:var(--soft)}
.lvl{font-size:.85rem;border-radius:999px;padding:2px 12px;border:1px solid}
.lv1{background:#eef7f0;color:#3b7a4c;border-color:#c8e3cf}.lv2{background:#eef4fb;color:#2f5f8a;border-color:#c9dbee}.lv3{background:#fbf2e6;color:#8a5a1f;border-color:#ecd5b3}
.turn{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.turn .lab{color:var(--soft);font-size:.9rem}
.gbtn{font:inherit;font-weight:700;border-radius:999px;padding:4px 14px;cursor:pointer;border:2px solid transparent;background:#fff;opacity:.55;transition:.2s}
.gbtn[aria-pressed=true]{opacity:1;transform:scale(1.06);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.qtext{font-size:clamp(1.35rem,2.9vw,2.4rem);line-height:1.65;margin:8px 0 18px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-size:clamp(1.1rem,2.2vw,1.8rem);text-align:right;display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;transition:transform .15s,border-color .2s,background .3s;min-height:72px;color:var(--ink)}
.opt:hover{transform:translateY(-2px);border-color:#b9cdc6}
.opt .k{font-family:Kufi,Plex;width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:1.1rem}
.opt.right{background:#e8f6ee;border-color:var(--good)}
.opt.wrong{background:#fbece7;border-color:var(--bad)}
.opt.dim{opacity:.45}
.fillbox{display:flex;gap:10px;flex-wrap:wrap}
.fillbox input{flex:1;min-width:200px;font-size:clamp(1.2rem,2.4vw,1.8rem);text-align:center}
.fillbox button,.judge button{font:inherit;font-weight:700;font-size:1.15rem;border:0;border-radius:14px;padding:10px 22px;cursor:pointer;background:var(--acc);color:#fff}
.judge{display:none;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.judge .no{background:#fff;color:var(--bad);border:1.5px solid #e6bdb1}
.judge .yes{background:#fff;color:var(--good);border:1.5px solid #b7dcc6}
.fb{margin-top:16px;border-radius:16px;padding:12px 16px;font-size:clamp(1.05rem,2vw,1.45rem);display:none;align-items:center;gap:14px;flex-wrap:wrap}
.fb.good{display:flex;background:#e8f6ee;border:1px solid #b7dcc6}
.fb.bad{display:flex;background:#fbf0ec;border:1px solid #edc9bd}
.fb .pts{font-family:Plex;font-weight:700;font-size:1.6em;color:var(--good)}
.fb .next{margin-inline-start:auto;font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 20px;background:var(--acc);color:#fff;cursor:pointer}
/* timer */
.side{display:grid;gap:12px;justify-items:center;position:sticky;top:12px}
.timer{position:relative;width:min(190px,30vw);aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .bg{stroke:#e6eeeb}
.timer .fg{stroke:var(--acc);transition:stroke .4s;stroke-linecap:round}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:Plex;font-weight:700;font-size:clamp(2rem,4.6vw,3.4rem);color:var(--acc)}
.timer .over{position:absolute;bottom:18%;left:0;right:0;text-align:center;font-size:.8rem;color:var(--bad);font-weight:700}
.live{font-size:.95rem;color:var(--soft);text-align:center}
.live b{font-family:Plex;font-size:1.5rem;color:var(--ink);display:block}
.mini{width:100%;display:grid;gap:5px}
.mini div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:.92rem}

.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px);height:min(52vh,460px);padding:20px 10px 0;border-bottom:2px solid var(--line)}

.names2 div{width:clamp(60px,10vw,130px);text-align:center;font-weight:700;font-size:clamp(.9rem,1.6vw,1.15rem)}
.rank{font-family:Kufi,Plex;color:var(--soft);font-size:.9em}
.center{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}

.sec-title{font-family:Kufi,Plex;font-size:clamp(1.3rem,2.6vw,2rem);text-align:center;color:var(--acc);margin:4px 0 0}
.qwin{text-align:center;color:var(--soft);margin:4px 0 0}

/* ---------- sound (Web Audio, no files) ---------- */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f, start, dur, type='sine', vol=.12){
  const a = ac(); if(!a || S.muted) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
  const t = a.currentTime + start; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.03); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}

/* ---------- question selection ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickQuestions(){
  const L = LES[S.li], p = S.per+1;
  const own = shuffle(L.qs.filter(q => q.p===p));

}

  ac();
  S.qs = pickQuestions(); S.i = 0; S.scores = Array(S.gN).fill(0); S.turn = 0; S.last = Array(S.gN).fill(0);
  $('qBrand').textContent = `${LES[S.li].idA} ${LES[S.li].title}`;
  showQuestion();
};

/* ---------- scoring ---------- */
const LIMIT = 30, OVER = 30, MAXP = 1000, MIDP = 500, MINP = 100;
function pointsAt(sec){
  if (sec <= LIMIT) return Math.round(MIDP + (MAXP-MIDP) * (LIMIT - sec) / LIMIT);
  return Math.max(MINP, Math.round(MIDP - (MIDP-MINP) * (sec - LIMIT) / OVER));
}

/* ---------- question screen ---------- */
const LET = ['أ','ب','ج','د'];
function renderTurn(){
  $('turn').innerHTML = '<span class="lab">تجيب الآن:</span>' + Array.from({length:S.gN}, (_,i) =>
    `<button class="gbtn" style="border-color:${HEX[i]};color:#2a3a47;background:${i===S.turn?HEX[i]+'33':'#fff'}" aria-pressed="${i===S.turn}" data-i="${i}">${S.names[i]}</button>`).join('');
  $('turn').querySelectorAll('button').forEach(b => b.onclick = () => { if(!S.answered){ S.turn = +b.dataset.i; renderTurn(); } });
}
function renderMini(){
  $('mini').innerHTML = S.scores.map((s,i) => `<div><span><span class="dot" style="display:inline-block;width:10px;height:10px;background:${HEX[i]};margin-left:6px"></span>${S.names[i]}</span><b>${AD(s)}</b></div>`).join('');
}
function showQuestion(){
  const q = S.qs[S.i]; S.answered = false;
  show('sQ');
  $('prog').textContent = `السؤال ${AD(S.i+1)} من ${AD(S.qs.length)}`;
  const lv = ['سهل','متوسط','متقدم'][q.d-1]; $('lvl').className = 'lvl lv'+q.d; $('lvl').textContent = lv;
  renderTurn(); renderMini();
  $('qtext').innerHTML = q.q;
  $('fb').className = 'fb'; $('fb').innerHTML = ''; $('judge').style.display = 'none';
  const A = $('answers');
  if (q.t === 'mc'){
    const order = shuffle(q.o.map((o,i) => i));
    A.innerHTML = '<div class="opts">' + order.map((oi,k) => `<button class="opt" data-oi="${oi}"><span class="k" style="background:${HEX[k%6]}">${LET[k]||AD(k+1)}</span><span>${q.o[oi]}</span></button>`).join('') + '</div>';
    A.querySelectorAll('.opt').forEach(b => b.onclick = () => answerMC(b, +b.dataset.oi));
  } else if (q.t === 'tf'){
    A.innerHTML = '<div class="opts"><button class="opt" data-v="1"><span class="k" style="background:var(--g1)">✓</span><span>صواب</span></button><button class="opt" data-v="0"><span class="k" style="background:var(--g2)">✗</span><span>خطأ</span></button></div>';
    A.querySelectorAll('.opt').forEach(b => b.onclick = () => answerTF(b, b.dataset.v==='1'));
  } else {
    A.innerHTML = '<div class="fillbox"><input type="text" id="fillIn" inputmode="text" autocomplete="off" placeholder="اكتب إجابة المجموعة"><button id="fillGo">تحقّق</button></div>';
    $('fillGo').onclick = answerFill; $('fillIn').onkeydown = e => { if(e.key==='Enter') answerFill(); };
  }
  startTimer();
}
function startTimer(){
  cancelAnimationFrame(S.raf); S.t0 = performance.now(); let lastSec = -1;
  const C = 326.73, arc = $('arc');
  const loop = now => {
    const sec = (now - S.t0)/1000;
    const rem = Math.max(0, LIMIT - sec);
    arc.style.strokeDashoffset = C * (1 - rem/LIMIT);
    arc.style.stroke = rem > 10 ? 'var(--acc)' : rem > 0 ? '#d79a4a' : 'var(--bad)';
    $('tnum').textContent = AD(Math.ceil(rem));
    $('tover').textContent = sec > LIMIT ? 'وقت إضافي' : '';
    $('avail').textContent = AD(pointsAt(sec));
    const s = Math.floor(sec); if (s !== lastSec){ lastSec = s; if (rem > 0 && rem <= 5) SND.tick(); }
    if (!S.answered) S.raf = requestAnimationFrame(loop);
  };
  S.raf = requestAnimationFrame(loop);
}
function elapsed(){ return (performance.now() - S.t0)/1000; }
function lock(){ S.answered = true; cancelAnimationFrame(S.raf); $('turn').querySelectorAll('button').forEach(b => b.disabled = true); }
function finish(ok, sec, rightHTML){
  const pts = ok ? pointsAt(sec) : 0;
  S.last = Array(S.gN).fill(0); S.last[S.turn] = pts; S.scores[S.turn] += pts;
  ok ? SND.good() : SND.bad();
  const fb = $('fb'); fb.className = 'fb ' + (ok ? 'good' : 'bad');
  fb.innerHTML = ok ? `<span>إجابة صحيحة لمجموعة <b>${S.names[S.turn]}</b> خلال ${AD(Math.round(sec))} ث</span><span class="pts">+${AD(pts)}</span><button class="next" id="toChart">عرض الترتيب</button>`
                    : `<span>إجابة غير صحيحة. الإجابة الصحيحة: <b>${rightHTML}</b></span><button class="next" id="toChart">عرض الترتيب</button>`;
  $('toChart').onclick = showChart; renderMini();
}
function answerMC(btn, oi){
  if (S.answered) return; const sec = elapsed(); lock(); const q = S.qs[S.i];
  document.querySelectorAll('.opt').forEach(b => { const v = +b.dataset.oi; b.disabled = true; if (v===q.a) b.classList.add('right'); else if (b===btn) b.classList.add('wrong'); else b.classList.add('dim'); });
  finish(oi===q.a, sec, q.o[q.a]);
}
function answerTF(btn, v){
  if (S.answered) return; const sec = elapsed(); lock(); const q = S.qs[S.i];
  document.querySelectorAll('.opt').forEach(b => { const bv = b.dataset.v==='1'; b.disabled = true; if (bv===q.a) b.classList.add('right'); else if (b===btn) b.classList.add('wrong'); else b.classList.add('dim'); });
  finish(v===q.a, sec, q.a ? 'صواب' : 'خطأ');
}
function norm(s){
  return String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[−–ـ]/g,'-')
    .replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652]/g,'').replace(/\s+/g,'').replace(/^\+/,'').toLowerCase();
}
function answerFill(){
  if (S.answered) return; const val = $('fillIn').value; if (!val.trim()) return;
  const sec = elapsed(); const q = S.qs[S.i];
  const NUM = /^-?\d*\.?\d+$/;
  const ok = q.a.some(a => { const x = norm(a), y = norm(val); return x === y || (NUM.test(x) && NUM.test(y) && parseFloat(x) === parseFloat(y)); });
  lock(); $('fillIn').disabled = true; $('fillGo').disabled = true;
  if (ok) finish(true, sec, q.aH);
  else {
    $('judge').style.display = 'flex';
    $('jYes').onclick = () => { $('judge').style.display='none'; finish(true, sec, q.aH); };
    $('jNo').onclick = () => { $('judge').style.display='none'; finish(false, sec, q.aH); };
  }
}

/* ---------- chart ---------- */
function showChart(){
  show('sChart');
  const max = Math.max(1, ...S.scores);
  const order = S.scores.map((s,i) => i).sort((a,b) => S.scores[b] - S.scores[a]);
  const rank = Array(S.gN); order.forEach((g,r) => rank[g] = r+1);
  const winQ = S.last.findIndex(v => v>0);
  $('cTitle').textContent = `بعد السؤال ${AD(S.i+1)} من ${AD(S.qs.length)}`;
  $('cWin').textContent = winQ>=0 ? `مجموعة ${S.names[winQ]} حصدت نقاط هذا السؤال` : 'لم تُحتسب نقاط في هذا السؤال';
  $('chart').innerHTML = S.scores.map((s,i) => `<div class="bar${i===winQ?' win':''}">${S.last[i]?`<span class="gain">+${AD(S.last[i])}</span>`:''}<span class="val">${AD(s)}</span><div class="col" style="background:${HEX[i]}"></div></div>`).join('');
  $('names2').innerHTML = S.scores.map((s,i) => `<div>${S.names[i]}<div class="rank">المركز ${AD(rank[i])}</div></div>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('#chart .col').forEach((c,i) => c.style.height = Math.max(4, 100*S.scores[i]/max) + '%');
  }));
  SND.rise();
  $('next').textContent = S.i+1 < S.qs.length ? 'السؤال التالي' : 'إعلان النتائج';
}
$('next').onclick = () => {
  if (S.i+1 < S.qs.length){ S.i++; S.turn = (S.turn+1) % S.gN; showQuestion(); }
  else podium();
};
$('quit').onclick = () => { if (confirm('إنهاء المسابقة وعرض النتائج الحالية؟')){ cancelAnimationFrame(S.raf); podium(); } };

/* ---------- podium + calm confetti ---------- */
function podium(){
  show('sEnd');
  const order = S.scores.map((s,i) => i).sort((a,b) => S.scores[b]-S.scores[a]);
  const top = order.slice(0,3); const layout = [1,0,2].filter(k => k < top.length);
  const H = {0:'100%',1:'74%',2:'54%'};
  $('podium').innerHTML = layout.map(k => { const g = top[k]; return `<div class="pod" data-k="${k}"><div class="nm">${S.names[g]}</div><div class="sc">${AD(S.scores[g])} نقطة</div><div class="blk" style="background:${HEX[g]}">${AD(k+1)}</div></div>`; }).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.pod').forEach(p => { p.querySelector('.blk').style.height = H[p.dataset.k]; p.classList.add('show'); })));
  const rest = order.slice(3);
  $('rest').textContent = rest.length ? rest.map((g,j) => `المركز ${AD(j+4)}: ${S.names[g]} (${AD(S.scores[g])})`).join(' – ') : '';
  SND.fanfare(); confetti();
}
function confetti(){
  const cv = $('fx'), cx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const P = Array.from({length:110}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.6, r:4+Math.random()*5, c:HEX[Math.floor(Math.random()*6)], vy:.8+Math.random()*1.6, vx:-.5+Math.random(), a:Math.random()*6, va:-.04+Math.random()*.08}));
  const t0 = performance.now();
  (function f(now){
    cx.clearRect(0,0,cv.width,cv.height); const life = (now-t0)/1000;
    P.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin(p.a)*.4; p.a += p.va; cx.globalAlpha = Math.max(0, 1 - life/6);
      cx.fillStyle = p.c; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
    if (life < 6) requestAnimationFrame(f); else cx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
$('again').onclick = () => show('sSetup');

fillLessons(); renderPeriods(); renderNames(); syncMute();
</script>
</body>
