مسائل عامة على الوحدة.\nدور الطالب: يحل ويبرر.\n\n(٥ د) تقويم ذاتي\nدور المعلم: يعرض «أستطيع أن…» للوحدة الخامسة.\nدور الطالب: يحدد مستواه.\n\n(٥ د) الغلق\nدور المعلم: مسابقة قصيرة من ملف المسابقة.\nدور الطالب: تتنافس المجموعات.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) ما نوع الزاويتين على جانبي القاطع وبين المتوازيين في شكل Z؟\nالإجابة: متبادلتان\n٢. (متوقع) قاطع لمتوازيين، زاوية ٤٨°. أوجد الزاوية الداخلية الواقعة معها في الجهة نفسها\nالإجابة: ١٣٢°\n٣. (متقدم) اكتب الخطوة الأساسية في إثبات أن مجموع زوايا المثلث ١٨٠°\nالإجابة: نرسم من رأس المثلث مستقيمًا يوازي القاعدة فتساوي زاويتا القاعدة الزاويتين المتبادلتين معهما، والزوايا الثلاث على مستقيم مجموعها ١٨٠°", "١. (دعم) الزاويتان المتناظرتان بين متوازيين: متساويتان أم مجموعهما ١٨٠°؟\nالإجابة: متساويتان\n٢. (متوقع) قاطع لمتوازيين، زاوية ١٢٥°. أوجد الزاوية المتبادلة معها\nالإجابة: ١٢٥°\n٣. (متقدم) في الشكل: مستقيمان متوازيان وقاطعان يكوّنان مثلثًا، زاويتان منه ٥٢° و ٦٣°. أوجد الثالثة مع ذكر السبب\nالإجابة: ٦٥°، مجموع زوايا المثلث ١٨٠°", "للطالب: حل تمارين كتاب النشاط ص ٧١–٧٢ ومراجعة الوحدة الخامسة. لولي الأمر: مراجعة قائمة «أستطيع أن…» للوحدة مع الابن."]}]}, {"idA": "٦-١", "title": "تبسيط الكسور", "unit": "الوحدة السادسة: الكسور (1)", "st": "١٠٤–١٠٥", "ac": "٧٣–٧٤", "tb": "١٠٩–١١٠", "week": "الأسبوع التاسع", "dates": "١–٥/١١/٢٠٢٦م", "periods": [{"axis": "الكسور المتكافئة وكتابة الكسر في أبسط صورة", "axisT": "الكسور المتكافئة وكتابة الكسر في أبسط صورة", "html": ["<ol><li>يكوّن كسورًا متكافئة بضرب البسط والمقام أو قسمتهما على العدد نفسه.</li><li>يكتب الكسر في أبسط صورة بالقسمة على العامل المشترك الأكبر للبسط والمقام.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يفسر لماذا لا يكون الكسر في أبسط صورة بمجرد تعذر قسمته على ٢.</p>", "<span class=\"chip\">المخرج ١: فهم</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالنمذجة</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: شرائط كسور ورقية</span>", "<span class=\"chip\">الكسر</span><span class=\"chip\">البسط</span><span class=\"chip\">المقام</span><span class=\"chip\">الكسور المتكافئة</span><span class=\"chip\">أبسط صورة</span><span class=\"chip\">العامل المشترك الأكبر</span>", "<p>يطوي الطلاب شريطًا ورقيًا إلى نصفين ثم أربعة أرباع ثم ثمانية أثمان ويلونون النصف. كم ربعًا وكم ثمنًا يساوي النصف؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يوجه طي الشرائط وتلوين النصف.</p><p><em>الطالب:</em> يكتشف أن <span class=\"fr\"><span>١</span><span>٢</span></span> = <span class=\"fr\"><span>٢</span><span>٤</span></span> = <span class=\"fr\"><span>٤</span><span>٨</span></span>.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>لعبة سلسلة الكسور المتكافئة</b><p><em>المعلم:</em> يصف الطلاب في طوابير، ويعطي الأول ورقة عليها كسر (مثل <span class=\"fr\"><span>٢</span><span>٣</span></span>)، فيكتب كسرًا مكافئًا ويمررها لمن خلفه.</p><p><em>الطالب:</em> يكتب كل طالب كسرًا مكافئًا مختلفًا ويتحقق من سابقه.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>التبسيط بالعامل المشترك الأكبر</b><p><em>المعلم:</em> ينمذج تبسيط <span class=\"fr\"><span>١٨</span><span>٢٤</span></span> بالقسمة على ٦ مرة واحدة، و <span class=\"fr\"><span>٢٧</span><span>٣٦</span></span> بخطوتين، وينبه إلى أن <span class=\"fr\"><span>٩</span><span>١٥</span></span> ليس في أبسط صورة رغم تعذر القسمة على ٢.</p><p><em>الطالب:</em> يبسط كسورًا ويحدد ع م ك.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين ٦-١ ص ١٠٤–١٠٥ وكتاب النشاط ص ٧٣.</p><p><em>الطالب:</em> يبسط ويتحقق.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: هل <span class=\"fr\"><span>٢١</span><span>٣٥</span></span> في أبسط صورة؟</p><p><em>الطالب:</em> يجيب لا، = <span class=\"fr\"><span>٣</span><span>٥</span></span>.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>اكتب كسرًا مكافئًا للكسر <span class=\"fr\"><span>٣</span><span>٤</span></span><div class=\"ans\">الإجابة: <span class=\"fr\"><span>٦</span><span>٨</span></span> (أو <span class=\"fr\"><span>٩</span><span>١٢</span></span> …)</div></li><li><span class=\"tier t1\">متوقع</span>بسّط <span class=\"fr\"><span>١٨</span><span>٢٤</span></span> إلى أبسط صورة<div class=\"ans\">الإجابة: <span class=\"fr\"><span>٣</span><span>٤</span></span></div></li><li><span class=\"tier t2\">متقدم</span>أوجد قيمة ن: <span class=\"fr\"><span>٥</span><span>٧</span></span> = ن/٦٣<div class=\"ans\">الإجابة: ٤٥</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أكمل: <span class=\"fr\"><span>٢</span><span>٣</span></span> = …/١٢<div class=\"ans\">الإجابة: ٨</div></li><li><span class=\"tier t1\">متوقع</span>بسّط <span class=\"fr\"><span>٢٧</span><span>٣٦</span></span> إلى أبسط صورة<div class=\"ans\">الإجابة: <span class=\"fr\"><span>٣</span><span>٤</span></span></div></li><li><span class=\"tier t2\">متقدم</span>قال سعيد: <span class=\"fr\"><span>٩</span><span>١٥</span></span> في أبسط صورة لأنه لا يقبل القسمة على ٢. هل هو محق؟ وضح<div class=\"ans\">الإجابة: لا، يقسم البسط والمقام على ٣: <span class=\"fr\"><span>٣</span><span>٥</span></span></div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ٧٣–٧٤ في التبسيط. لولي الأمر: مساعدة الابن على تقسيم أشياء (بيتزا، شريط) لاكتشاف الكسور المتكافئة.</p>"], "txt": ["١. يكوّن كسورًا متكافئة بضرب البسط والمقام أو قسمتهما على العدد نفسه.\n٢. يكتب الكسر في أبسط صورة بالقسمة على العامل المشترك الأكبر للبسط والمقام.\nمخرج تعليمي آخر: يفسر لماذا لا يكون الكسر في أبسط صورة بمجرد تعذر قسمته على ٢.", "المخرج ١: فهم\nالمخرج ٢: تطبيق\nالمخرج الآخر: تحليل", "التعلم المبني على اللعب، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: شرائط كسور ورقية", "الكسر، البسط، المقام، الكسور المتكافئة، أبسط صورة، العامل المشترك الأكبر", "يطوي الطلاب شريطًا ورقيًا إلى نصفين ثم أربعة أرباع ثم ثمانية أثمان ويلونون النصف. كم ربعًا وكم ثمنًا يساوي النصف؟", "(٥ د) التهيئة\nدور المعلم: يوجه طي الشرائط وتلوين النصف.\nدور الطالب: يكتشف أن ١/٢ = ٢/٤ = ٤/٨.\n\n(١٠ د) لعبة سلسلة الكسور المتكافئة\nدور المعلم: يصف الطلاب في طوابير، ويعطي الأول ورقة عليها كسر (مثل ٢/٣)، فيكتب كسرًا مكافئًا ويمررها لمن خلفه.\nدور الطالب: يكتب كل طالب كسرًا مكافئًا مختلفًا ويتحقق من سابقه.\n\n(١٠ د) التبسيط بالعامل المشترك الأكبر\nدور المعلم: ينمذج تبسيط ١٨/٢٤ بالقسمة على ٦ مرة واحدة، و ٢٧/٣٦ بخطوتين، وينبه إلى أن ٩/١٥ ليس في أبسط صورة رغم تعذر القسمة على ٢.\nدور الطالب: يبسط كسورًا ويحدد ع م ك.\n\n(١٠ د) التدريب\nدور المعلم: يكلف بتمارين ٦-١ ص ١٠٤–١٠٥ وكتاب النشاط ص ٧٣.\nدور الطالب: يبسط ويتحقق.\n\n(٥ د) الغلق\nدور المعلم: سؤال: هل ٢١/٣٥ في أبسط صورة؟\nدور الطالب: يجيب لا، = ٣/٥.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) اكتب كسرًا مكافئًا للكسر ٣/٤\nالإجابة: ٦/٨ (أو ٩/١٢ …)\n٢. (متوقع) بسّط ١٨/٢٤ إلى أبسط صورة\nالإجابة: ٣/٤\n٣. (متقدم) أوجد قيمة ن: ٥/٧ = ن/٦٣\nالإجابة: ٤٥", "١. (دعم) أكمل: ٢/٣ = …/١٢\nالإجابة: ٨\n٢. (متوقع) بسّط ٢٧/٣٦ إلى أبسط صورة\nالإجابة: ٣/٤\n٣. (متقدم) قال سعيد: ٩/١٥ في أبسط صورة لأنه لا يقبل القسمة على ٢. هل هو محق؟ وضح\nالإجابة: لا، يقسم البسط والمقام على ٣: ٣/٥", "للطالب: حل تمارين كتاب النشاط ص ٧٣–٧٤ في التبسيط. لولي الأمر: مساعدة الابن على تقسيم أشياء (بيتزا، شريط) لاكتشاف الكسور المتكافئة."]}]}, {"idA": "٦-٢", "title": "مقارنة الكسور", "unit": "الوحدة السادسة: الكسور (1)", "st": "١٠٦–١٠٩", "ac": "٧٥–٧٦", "tb": "١١١–١١٢", "week": "الأسبوع التاسع", "dates": "١–٥/١١/٢٠٢٦م", "periods": [{"axis": "مقارنة كسرين بتوحيد المقامات", "axisT": "مقارنة كسرين بتوحيد المقامات", "html": ["<ol><li>يقارن بين كسرين بكتابتهما بمقام مشترك (المضاعف المشترك الأصغر للمقامين).</li><li>يستخدم الرمزين &lt; و &gt; بصورة صحيحة للمقارنة بين الكسور.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يفسر خطأ الاعتقاد بأن الكسر ذا المقام الأكبر هو الأكبر دائمًا.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: بطاقات كسور</span>", "<span class=\"chip\">المقام المشترك</span><span class=\"chip\">المضاعف المشترك الأصغر</span><span class=\"chip\">المقارنة</span><span class=\"chip\">الرمزان &lt; و &gt;</span>", "<p>سؤال: أيهما أكبر نصيبًا: <span class=\"fr\"><span>٣</span><span>٨</span></span> كعكة أم <span class=\"fr\"><span>٢</span><span>٥</span></span> كعكة؟ يصوت الطلاب.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح السؤال ويسجل التصويت.</p><p><em>الطالب:</em> يبرر اختياره.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج كتابة <span class=\"fr\"><span>٣</span><span>٨</span></span> و <span class=\"fr\"><span>٢</span><span>٥</span></span> بمقام ٤٠ (<span class=\"fr\"><span>١٥</span><span>٤٠</span></span> و <span class=\"fr\"><span>١٦</span><span>٤٠</span></span>) والمقارنة.</p><p><em>الطالب:</em> يقارن أزواجًا مشابهة.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>لعبة البطاقات الثنائية</b><p><em>المعلم:</em> يوزع بطاقات كسور، يسحب الأول بطاقتين، ويضع الثاني الرمز الصحيح ويسجل في جدول.</p><p><em>الطالب:</em> يتناوبان ويتحققان بتوحيد المقامات.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بالتمارين الأولى من ٦-٢ ص ١٠٧.</p><p><em>الطالب:</em> يحل فرديًا.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: أيهما أكبر <span class=\"fr\"><span /٩ > ١/٥ لأن ٩ > ٥. صحح خطأها\nالإجابة: ١/٩ < ١/٥ لأن الكل مقسم إلى أجزاء أكثر فالجزء أصغر", "للطالب: حل تمارين المقارنة في كتاب النشاط ص ٧٥. لولي الأمر: لعب لعبة بطاقات الكسور مع الابن."]}, {"axis": "المقارنة باستخدام المرجعيات والكسور العشرية", "axisT": "المقارنة باستخدام المرجعيات والكسور العشرية", "html": ["<ol><li>يقارن الكسور بالمقارنة بكسور مرجعية (مثل <span class=\"fr\"><span>١</span><span>٢</span></span>) دون حساب طويل.</li><li>يقارن الكسور بتحويلها إلى كسور عشرية عند الحاجة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يختار الطريقة الأنسب للمقارنة حسب الكسور المعطاة ويبرر اختياره.</p>", "<span class=\"chip\">المخرج ١: تحليل</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: تقييم</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">الكسر المرجعي</span><span class=\"chip\">الكسر العشري</span><span class=\"chip\">المقارنة</span>", "<p>سؤال سريع: هل <span class=\"fr\"><span>٧</span><span>١٢</span></span> أكبر من النصف أم أصغر؟ وماذا عن <span class=\"fr\"><span>٥</span><span>١١</span></span>؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح السؤالين.</p><p><em>الطالب:</em> يقارن البسط بنصف المقام.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>طريقة المرجع</b><p><em>المعلم:</em> ينمذج مقارنة <span class=\"fr\"><span>٧</span><span>١٢</span></span> و <span class=\"fr\"><span>٥</span><span>١١</span></span> بالنصف، و <span class=\"fr\"><span>٩</span><span>١٠</span></span> و <span class=\"fr\"><span>٨</span><span>٩</span></span> بالقرب من ١.</p><p><em>الطالب:</em> يطبق على أزواج جديدة.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>التحويل إلى عشري</b><p><em>المعلم:</em> ينمذج تحويل <span class=\"fr\"><span>٣</span><span>٤</span></span> = ٠٫٧٥ و <span class=\"fr\"><span>٤</span><span>٥</span></span> = ٠٫٨ للمقارنة.</p><p><em>الطالب:</em> يقارن بالكسور العشرية.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>حل مشكلات</b><p><em>المعلم:</em> يكلف بمسائل ٦-٢ المتقدمة وكتاب النشاط ص ٧٦ (من قرأ جزءًا أكبر من الكتاب...).</p><p><em>الطالب:</em> يختار الطريقة ويبررها.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: أي الطريقتين أنسب لمقارنة <span class=\"fr\"><span>٢</span><span>٣</span></span> و <span class=\"fr\"><span>٣</span><span>٧</span></span>؟</p><p><em>الطالب:</em> يجيب: المرجع <span class=\"fr\"><span>١</span><span>٢</span></span>.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>هل <span class=\"fr\"><span>٣</span><span>٧</span></span> أكبر من <span class=\"fr\"><span>١</span><span>٢</span></span> أم أصغر؟<div class=\"ans\">الإجابة: أصغر</div></li><li><span class=\"tier t1\">متوقع</span>قارن <span class=\"fr\"><span>٩</span><span>١٠</span></span> و <span class=\"fr\"><span>٨</span><span>٩</span></span> باستخدام البعد عن ١<div class=\"ans\">الإجابة: <span class=\"fr\"><span>٩</span><span>١٠</span></span> &gt; <span class=\"fr\"><span>٨</span><span>٩</span></span> لأن <span class=\"fr\"><span>١</span><span>١٠</span></span> &lt; <span class=\"fr\"><span>١</span><span>٩</span></span></div></li><li><span class=\"tier t2\">متقدم</span>قرأ أحمد <span class=\"fr\"><span>٥</span><span>٨</span></span> كتاب وقرأ سالم ٠٫٦ منه. من قرأ أكثر؟<div class=\"ans\">الإجابة: أحمد، لأن <span class=\"fr\"><span>٥</span><span>٨</span></span> = ٠٫٦٢٥ &gt; ٠٫٦</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>هل <span class=\"fr\"><span>٥</span><span>٩</span></span> أكبر من <span class=\"fr\"><span>١</span><span>٢</span></span>؟<div class=\"ans\">الإجابة: نعم</div></li><li><span class=\"tier t1\">متوقع</span>قارن <span class=\"fr\"><span>٣</span><span>٤</span></span> و <span class=\"fr\"><span>٤</span><span>٥</span></span> بتحويلهما إلى كسرين عشريين<div class=\"ans\">الإجابة: ٠٫٧٥ &lt; ٠٫٨، إذن <span class=\"fr\"><span>٣</span><span>٤</span></span> &lt; <span class=\"fr\"><span>٤</span><span>٥</span></span></div></li><li><span class=\"tier t2\">متقدم</span>رتب تصاعديًا باستخدام أي طريقة: <span class=\"fr\"><span>٢</span><span>٥</span></span>، <span class=\"fr\"><span>٥</span><span>٨</span></span>، <span class=\"fr\"><span>١</span><span>٢</span></span><div class=\"ans\">الإجابة: <span class=\"fr\"><span>٢</span><span>٥</span></span>، <span class=\"fr\"><span>١</span><span>٢</span></span>، <span class=\"fr\"><span>٥</span><span>٨</span></span></div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ٧٦. لولي الأمر: مقارنة نسب ما يأكله أفراد الأسرة من طبق باستخدام الكسور.</p>"], "txt": ["١. يقارن الكسور بالمقارنة بكسور مرجعية (مثل ١/٢) دون حساب طويل.\n٢. يقارن الكسور بتحويلها إلى كسور عشرية عند الحاجة.\nمخرج تعليمي آخر: يختار الطريقة الأنسب للمقارنة حسب الكسور المعطاة ويبرر اختياره.", "المخرج ١: تحليل\nالمخرج ٢: تطبيق\nالمخرج الآخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الكسر المرجعي، الكسر العشري، المقارنة", "سؤال سريع: هل ٧/١٢ أكبر من النصف أم أصغر؟ وماذا عن ٥/١١؟", "(٥ د) التهيئة\nدور المعلم: يطرح السؤالين.\nدور الطالب: يقارن البسط بنصف المقام.\n\n(١٠ د) طريقة المرجع\nدور المعلم: ينمذج مقارنة ٧/١٢ و ٥/١١ بالنصف، و ٩/١٠ و ٨/٩ بالقرب من ١.\nدور الطالب: يطبق على أزواج جديدة.\n\n(٨ د) التحويل إلى عشري\nدور المعلم: ينمذج تحويل ٣/٤ = ٠٫٧٥ و ٤/٥ = ٠٫٨ للمقارنة.\nدور الطالب: يقارن بالكسور العشرية.\n\n(١٢ د) حل مشكلات\nدور المعلم: يكلف بمسائل ٦-٢ المتقدمة وكتاب النشاط ص ٧٦ (من قرأ جزءًا أكبر من الكتاب...).\nدور الطالب: يختار الطريقة ويبررها.\n\n(٥ د) الغلق\nدور المعلم: سؤال: أي الطريقتين أنسب لمقارنة ٢/٣ و ٣/٧؟\nدور الطالب: يجيب: المرجع ١/٢.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) هل ٣/٧ أكبر من ١/٢ أم أصغر؟\nالإجابة: أصغر\n٢. (متوقع) قارن ٩/١٠ و ٨/٩ باستخدام البعد عن ١\nالإجابة: ٩/١٠ > ٨/٩ لأن ١/١٠ < ١/٩\n٣. (متقدم) قرأ أحمد ٥/٨ كتاب وقرأ سالم ٠٫٦ منه. من قرأ أكثر؟\nالإجابة: أحمد، لأن ٥/٨ = ٠٫٦٢٥ > ٠٫٦", "١. (دعم) هل ٥/٩ أكبر من ١/٢؟\nالإجابة: نعم\n٢. (متوقع) قارن ٣/٤ و ٤/٥ بتحويلهما إلى كسرين عشريين\nالإجابة: ٠٫٧٥ < ٠٫٨، إذن ٣/٤ < ٤/٥\n٣. (متقدم) رتب تصاعديًا باستخدام أي طريقة: ٢/٥، ٥/٨، ١/٢\nالإجابة: ٢/٥، ١/٢، ٥/٨", "للطالب: حل تمارين كتاب النشاط ص ٧٦. لولي الأمر: مقارنة نسب ما يأكله أفراد الأسرة من طبق باستخدام الكسور."]}]}, {"idA": "٦-٣", "title": "الكسور غير الاعتيادية والأعداد الكسرية", "unit": "الوحدة السادسة: الكسور (1)", "st": "١١٠–١١١", "ac": "٧٧–٧٨", "tb": "١١٣", "week": "الأسبوع التاسع", "dates": "١–٥/١١/٢٠٢٦م", "periods": [{"axis": "التحويل بين الكسور غير الاعتيادية والأعداد الكسرية", "axisT": "التحويل بين الكسور غير الاعتيادية والأعداد الكسرية", "html": ["<ol><li>يحول الكسر غير الاعتيادي إلى عدد كسري بالقسمة.</li><li>يحول العدد الكسري إلى كسر غير اعتيادي.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يمثل العدد الكسري على خط الأعداد.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: فهم</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: دوائر كسور مقسمة</span>", "<span class=\"chip\">الكسر الاعتيادي</span><span class=\"chip\">الكسر غير الاعتيادي</span><span class=\"chip\">العدد الكسري</span><span class=\"chip\">الباقي</span>", "<p>يعرض المعلم ٧ أرباع دوائر ويسأل: كم دائرة كاملة يمكن تكوينها؟ وكم يبقى؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p>< \n\n(٥ د) الغلق\nدور المعلم: مسابقة سريعة من ملف المسابقة.\nدور الطالب: تتنافس المجموعات.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) احسب: ٦ × ٢/٣\nالإجابة: ٤\n٢. (متوقع) احسب: ٥ × ٣/٤ واكتبه عددًا كسريًا\nالإجابة: ٣ ٣/٤\n٣. (متقدم) ما الكسر الذي يمثله ٤٠ دقيقة من ساعة في أبسط صورة؟\nالإجابة: ٢/٣", "١. (دعم) احسب: ٤ × ١/٢\nالإجابة: ٢\n٢. (متوقع) اكتب ١٥ سم ككسر من ١ م في أبسط صورة\nالإجابة: ٣/٢٠\n٣. (متقدم) حصّل فريق ١٨ نقطة من ٣٠. ما الكسر في أبسط صورة؟ وكم تبقى ليصل إلى ٤/٥ من ٣٠؟\nالإجابة: ٣/٥، ويحتاج ٦ نقاط", "للطالب: حل تمارين كتاب النشاط ص ٨٢. لولي الأمر: التعبير عن الأوقات ككسور من الساعة مع الابن."]}]}, {"idA": "٦-٦", "title": "تحويل الكسور إلى كسور عشرية", "unit": "الوحدة السادسة: الكسور (1)", "st": "١١٦–١١٧", "ac": "٨٣", "tb": "١١٧", "week": "الأسبوع العاشر", "dates": "٨–١٢/١١/٢٠٢٦م", "periods": [{"axis": "تحويل الكسر إلى كسر عشري منتهٍ بالقسمة", "axisT": "تحويل الكسر إلى كسر عشري منتهٍ بالقسمة", "html": ["<ol><li>يحول الكسر إلى كسر عشري بقسمة البسط على المقام.</li><li>يتذكر الكسور العشرية المكافئة للكسور الشائعة (<span class=\"fr\"><span>١</span><span>٢</span></span>، <span class=\"fr\"><span>١</span><span>٤</span></span>، <span class=\"fr\"><span>٣</span><span>٤</span></span>، <span class=\"fr\"><span>١</span><span>٥</span></span>، <span class=\"fr\"><span>١</span><span>٨</span></span>).</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يتنبأ متى يكون الكسر العشري منتهيًا من عوامل المقام.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تذكر</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: أحجار نرد</span>", "<span class=\"chip\">الكسر العشري</span><span class=\"chip\">الكسر العشري المنتهي</span><span class=\"chip\">القسمة</span>", "<p>سؤال: ثمن an class=\"fr\"><span>٤</span><span>٥</span></span>. رتبهن تنازليًا<div class=\"ans\">الإجابة: هند (٠٫٨٥)، مريم (٠٫٨٣)، ريم (٠٫٨)</div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ٨٥. لولي الأمر: مقارنة درجات الاختبارات بالكسور والنسب مع الابن.</p>"], "txt": ["١. يرتب مجموعة مختلطة من الكسور والأعداد العشرية بتحويلها إلى صورة واحدة.\n٢. يحل مسائل حياتية تتطلب ترتيب كسور وأعداد عشرية.\nمخرج تعليمي آخر: ينتبه لترتيب الأعداد العشرية المتساوية في أول منزلتين ويبرر.", "المخرج ١: تحليل\nالمخرج ٢: تطبيق\nالمخرج الآخر: تحليل", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الكسر، العدد العشري، التحويل، الترتيب", "سؤال: أيهما أكبر: ٠٫٦ أم ٥/٨؟", "(٥ د) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يحول ٥/٨ = ٠٫٦٢٥ فهي أكبر.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج ترتيب ٠٫٧، ٢/٣، ٠٫٦٧، ٧/١٠ بتحويل الكل إلى عشري لثلاث منازل.\nدور الطالب: يرتب ويلاحظ تساوي ٠٫٧ و ٧/١٠.\n\n(١٥ د) حل مسائل\nدور المعلم: يكلف بمسائل ٦-٧ وكتاب النشاط ص ٨٥ (نتائج طلاب، أجزاء مستهلكة).\nدور الطالب: يحل ويبرر.\n\n(٥ د) تحدٍّ\nدور المعلم: سؤال: رتب ٠٫٣٣، ١/٣، ٠٫٣.\nدور الطالب: يرتب ٠٫٣، ٠٫٣٣، ١/٣.\n\n(٥ د) الغلق\nدور المعلم: مسابقة قصيرة.\nدور الطالب: تتنافس المجموعات.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) أيهما أكبر: ٠٫٦ أم ٥/٨؟\nالإجابة: ٥/٨\n٢. (متوقع) رتب تصاعديًا: ٠٫٧، ٢/٣، ٠٫٦٧\nالإجابة: ٢/٣، ٠٫٦٧، ٠٫٧ (لأن ٢/٣ = ٠٫٦٦٦…)\n٣. (متقدم) رتب تصاعديًا: ٠٫٣٣، ١/٣، ٠٫٣\nالإجابة: ٠٫٣، ٠٫٣٣، ١/٣", "١. (دعم) أيهما أكبر: ٣/٤ أم ٠٫٨؟\nالإجابة: ٠٫٨\n٢. (متوقع) رتب تنازليًا: ٠٫٤٥، ٢/٥، ٠٫٥، ٣/٨\nالإجابة: ٠٫٥، ٠٫٤٥، ٢/٥، ٣/٨\n٣. (متقدم) حصلت هند على ١٧/٢٠ ومريم على ٠٫٨٣ وريم على ٤/٥. رتبهن تنازليًا\nالإجابة: هند (٠٫٨٥)، مريم (٠٫٨٣)، ريم (٠٫٨)", "للطالب: حل تمارين كتاب النشاط ص ٨٥. لولي الأمر: مقارنة درجات الاختبارات بالكسور والنسب مع الابن."]}]}, {"idA": "٦-٨", "title": "حساب الباقي", "unit": "الوحدة السادسة: الكسور (1)", "st": "١٢٠–١٢١", "ac": "٨٦–٨٨", "tb": "١٢٠–١٢١", "week": "الأسبوع العاشر", "dates": "٨–١٢/١١/٢٠٢٦م", "periods": [{"axis": "التعبير عن باقي القسمة ككسر أو عدد عشري والتقريب حسب السياق", "axisT": "التعبير عن باقي القسمة ككسر أو عدد عشري والتقريب حسب السياق", "html": ["<ol><li>يعبر عن باقي القسمة ككسر من المقسوم عليه، مثل ١٥٧ ÷ ٢٥ = ٦ <span class=\"fr\"><span>٧</span><span>٢٥</span></span>.</li><li>يقرب ناتج القسمة إلى العدد الكامل الأصغر أو الأكبر حسب سياق المسألة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يتحقق من ناتج القسمة مع الباقي باستخدام الضرب والجمع.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تقييم</span><span class=\"chip\">المخرج الآخر: تقييم</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالاكتشاف</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: بطاقات مسائل كتاب النشاط</span>", "<span class=\"chip\">الباقي</span><span class=\"chip\">الكسر</span><span class=\"chip\">التقريب للأعلى</span><span class=\"chip\">التقريب للأسفل</span><span class=\"chip\">العملية العكسية</span>", "<p>ثلاثة مواقف لـ ٢٦ ÷ ٤: تقسيم ٢٦ ريالًا على ٤، عدد السيارات لنقل ٢٦ شخصًا (٤ بكل سيارة)، عدد علب يمكن ملؤها بـ ٢٦ كعكة (٤ بكل علبة).</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يعرض المواقف الثلاثة.</p><p><em>الطالب:</em> يلاحظ اختلاف الإجابات: ٦٫٥ ريال، ٧ سيارات، ٦ علب.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>الباقي ككسر</b><p><em>المعلم:</em> ينمذج ١٥٧ ÷ ٢٥ = ٦ والباقي ٧، فالناتج ٦ <span class=\"fr\"><span>٧</span><span>٢٥</span></span> = ٦٫٢٨، وينبه لخطأ كتابة الباقي مقامًا.</p><p><em>الطالب:</em> يكتب نواتج بأشكال مختلفة.</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>حل مسائل</b><p><em>المعلم:</em> يكلف بمسائل ٦-٨ وكتاب النشاط ص ٨٦–٨٨ ويطلب تحديد شكل الإجابة المناسب لكل مسألة.</p><p><em>الطالب:</em> يحل ويبرر شكل الإجابة ويتحقق بالعملية العكسية.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>مراجعة الوحدة</b><p><em>المعلم:</em> يلخص الوحدة السادسة على خريطة مفاهيم.</p><p><em>الطالب:</em> يضيف أمثلة.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: ٥٠ بيضة في علب تتسع لـ ٦. كم علبة ممتلئة؟</p><p><em>الطالب:</em> يجيب ٨ علب (ويبقى ٢).</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب ٢٩ ÷ ٤ واكتب الباقي كسرًا<div class=\"ans\">الإجابة: ٧ <span class=\"fr\"><span>١</span><span>٤</span></span></div></li><li><span class=\"tier t1\">متوقع</span>احسب ١٥٧ ÷ ٢٥ واكتب الناتج عددًا كسريًا ثم عشريًا<div class=\"ans\">الإجابة: ٦ <span class=\"fr\"><span>٧</span><span>٢٥</span></span> = ٦٫٢٨</div></li><li><span class=\"tier t2\">متقدم</span>٢٦ شخصًا في سيارات تتسع لـ ٤. كم سيارة؟ ولماذا؟<div class=\"ans\">الإجابة: ٧ سيارات، نقرب للأعلى حتى ينتقل الجميع</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>ما الباقي في ٢٣ ÷ ٥؟<div class=\"ans\">الإجابة: ٣</div></li><li><span class=\"tier t1\">متوقع</span>احسب ٤٥ ÷ ٨ واكتبه عددًا كسريًا<div class=\"ans\">الإجابة: ٥ <span class=\"fr\"><span>٥</span><span>٨</span></span></div></li><li><span class=\"tier t2\">متقدم</span>٥٠ بيضة في علب سعة ٦. كم علبة ممتلئة؟ تحقق من إجابتك<div class=\"ans\">الإجابة: ٨ علب، و ٨ × ٦ + ٢ = ٥٠</div></li></ol>", "<p>للطالب: حل مسائل كتاب النشاط ص ٨٦–٨٨ ومراجعة الوحدة السادسة. لولي الأمر: طرح مسائل تقسيم يومية على الابن ومناقشة شكل الإجابة المناسب.</p>"], "txt": ["١. يعبر عن باقي القسمة ككسر من المقسوم عليه، مثل ١٥٧ ÷ ٢٥ = ٦ ٧/٢٥.\n٢. يقرب ناتج القسمة إلى العدد الكامل الأصغر أو الأكبر حسب سياق المسألة.\nمخرج تعليمي آخر: يتحقق من ناتج القسمة مع الباقي باستخدام الضرب والجمع.", "المخرج ١: تطبيق\nالمخرج ٢: تقييم\nالمخرج الآخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالاكتشاف", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات مسائل كتاب النشاط", "الباقي، الكسر، التقريب للأعلى، التقريب للأسفل، العملية العكسية", "ثلاثة مواقف لـ ٢٦ ÷ ٤: تقسيم ٢٦ ريالًا على ٤، عدد السيارات لنقل ٢٦ شخصًا (٤ بكل سيارة)، عدد علب يمكن ملؤها بـ ٢٦ كعكة (٤ بكل علبة).", "(٥ د) التهيئة\nدور المعلم: يعرض المواقف الثلاثة.\nدور الطالب: يلاحظ اختلاف الإجابات: ٦٫٥ ريال، ٧ سيارات، ٦ علب.\n\n(١٠ د) الباقي ككسر\nدور المعلم: ينمذج ١٥٧ ÷ ٢٥ = ٦ والباقي ٧، فالناتج ٦ ٧/٢٥ = ٦٫٢٨، وينبه لخطأ كتابة الباقي مقامًا.\nدور الطالب: يكتب نواتج بأشكال مختلفة.\n\n(١٥ د) حل مسائل\nدور المعلم: يكلف بمسائل ٦-٨ وكتاب النشاط ص ٨٦–٨٨ ويطلب تحديد شكل الإجابة المناسب لكل مسألة.\nدور الطالب: يحل ويبرر شكل الإجابة ويتحقق بالعملية العكسية.\n\n(٥ د) مراجعة الوحدة\nدور المعلم: يلخص الوحدة السادسة على خريطة مفاهيم.\nدور الطالب: يضيف أمثلة.\n\n(٥ د) الغلق\nدور المعلم: سؤال: ٥٠ بيضة في علب تتسع لـ ٦. كم علبة ممتلئة؟\nدور الطالب: يجيب ٨ علب (ويبقى ٢).\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) احسب ٢٩ ÷ ٤ واكتب الباقي كسرًا\nالإجابة: ٧ ١/٤\n٢. (متوقع) احسب ١٥٧ ÷ ٢٥ واكتب الناتج عددًا كسريًا ثم عشريًا\nالإجابة: ٦ ٧/٢٥ = ٦٫٢٨\n٣. (متقدم) ٢٦ شخصًا في سيارات تتسع لـ ٤. كم سيارة؟ ولماذا؟\nالإجابة: ٧ سيارات، نقرب للأعلى حتى ينتقل الجميع", "١. (دعم) ما الباقي في ٢٣ ÷ ٥؟\nالإجابة: ٣\n٢. (متوقع) احسب ٤٥ ÷ ٨ واكتبه عددًا كسريًا\nالإجابة: ٥ ٥/٨\n٣. (متقدم) ٥٠ بيضة في علب سعة ٦. كم علبة ممتلئة؟ تحقق من إجابتك\nالإجابة: ٨ علب، و ٨ × ٦ + ٢ = ٥٠", "للطالب: حل مسائل كتاب النشاط ص ٨٦–٨٨ ومراجعة الوحدة السادسة. لولي الأمر: طرح مسائل تقسيم يومية على الابن ومناقشة شكل الإجابة المناسب."]}]}, {"idA": "٧-١", "title": "التحويل بين وحدات قياس المساحة", "unit": "الوحدة السابعة: المساحة والمحيط", "st": "١٢٦–١٢٧", "ac": "٨٩", "tb": "١٣١–١٣٢", "week": "الأسبوع الحادي عشر", "dates": "١٥–١٩/١١/٢٠٢٦م", "periods": [{"axis": "وحدات المساحة والعلاقة بين سم<sup>٢</sup> و ملم<sup>٢</sup> و م<sup>٢</sup>", "axisT": "وحدات المساحة والعلاقة بين سم^٢ و ملم^٢ و م^٢", "html": ["<ol><li>يستنتج أن ١ سم<sup>٢</sup> = ١٠٠ ملم<sup>٢</sup> و ١ م<sup>٢</sup> = ١٠٠٠٠ سم<sup>٢</sup> من رسم مر طيل ٣٠ سم وطوله ٩ سم. ما عرضه؟</p><p><em>الطالب:</em> يجيب ٦ سم.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>مستطيل مساحته ٢٤ سم<sup>٢</sup> وطوله ٦ سم. أوجد عرضه<div class=\"ans\">الإجابة: ٤ سم</div></li><li><span class=\"tier t1\">متوقع</span>مستطيل محيطه ٣٠ سم وطوله ٩ سم. أوجد عرضه<div class=\"ans\">الإجابة: ٦ سم</div></li><li><span class=\"tier t2\">متقدم</span>مربع مساحته ٦٤ م<sup>٢</sup>. أوجد محيطه<div class=\"ans\">الإجابة: ٣٢ م</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>مستطيل مساحته ٣٥ م<sup>٢</sup> وعرضه ٥ م. أوجد طوله<div class=\"ans\">الإجابة: ٧ م</div></li><li><span class=\"tier t1\">متوقع</span>مستطيل محيطه ٢٦ سم وعرضه ٤٫٥ سم. أوجد طوله<div class=\"ans\">الإجابة: ٨٫٥ سم</div></li><li><span class=\"tier t2\">متقدم</span>اكتب أبعاد مستطيلين مختلفين مساحة كل منهما ٣٦ سم<sup>٢</sup> وقارن محيطيهما<div class=\"ans\">الإجابة: مثل ٤ × ٩ (محيط ٢٦) و ٦ × ٦ (محيط ٢٤)</div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ٩١. لولي الأمر: تحدي الابن بإيجاد أبعاد مستطيلات لها مساحة معينة.</p>"], "txt": ["١. يجد طول أو عرض المستطيل إذا عُلمت مساحته وأحد بعديه.\n٢. يجد بعدًا مجهولًا إذا عُلم المحيط وأحد البعدين.\nمخرج تعليمي آخر: يجد جميع المستطيلات ذات الأبعاد الصحيحة التي لها مساحة معطاة.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تحليل", "التعلم المبني على حل المشكلات، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات مربعة", "البعد المجهول، المساحة، المحيط، العملية العكسية", "سؤال: مستطيل مساحته ٢٤ سم^٢ وطوله ٦ سم. ما عرضه؟", "(٥ د) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقسم ٢٤ ÷ ٦ = ٤.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج إيجاد العرض من المساحة (ع = م ÷ ط) ومن المحيط (ع = ح ÷ ٢ - ط).\nدور الطالب: يحل أمثلة.\n\n(١٢ د) الاستكشاف\nدور المعلم: يطلب إيجاد كل المستطيلات بأبعاد صحيحة مساحتها ٣٦ سم^٢ وحساب محيط كل منها.\nدور الطالب: يكتشف أن المربع ٦ × ٦ له أصغر محيط.\n\n(٨ د) التدريب\nدور المعلم: يكلف بتمارين ر الطالب: يجيب ٤٠ سم^٢.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) أوجد مساحة متوازي أضلاع قاعدته ٨ سم وارتفاعه ٥ سم\nالإجابة: ٤٠ سم^٢\n٢. (متوقع) متوازي أضلاع قاعدته ١٢ م وارتفاعه ٦٫٥ م وضلعه المائل ٧ م. أوجد مساحته\nالإجابة: ٧٨ م^٢\n٣. (متقدم) متوازي أضلاع مساحته ٥٤ سم^٢ وقاعدته ٩ سم. أوجد ارتفاعه\nالإجابة: ٦ سم", "١. (دعم) أوجد مساحة متوازي أضلاع قاعدته ١٠ وارتفاعه ٣\nالإجابة: ٣٠ وحدة مربعة\n٢. (متوقع) متوازي أضلاع قاعدته ٧٫٥ سم وارتفاعه ٤ سم. مساحته؟\nالإجابة: ٣٠ سم^٢\n٣. (متقدم) متوازي أضلاع ومستطيل لهما القاعدة ٦ سم والارتفاع ٤ سم نفساهما. قارن مساحتيهما\nالإجابة: متساويتان: ٢٤ سم^٢", "للطالب: حل تمارين كتاب النشاط ص ٩٣. لولي الأمر: البحث مع الابن عن أشكال متوازيات أضلاع في البيئة."]}, {"axis": "مساحة شبه المنحرف", "axisT": "مساحة شبه المنحرف", "html": ["<ol><li>يستنتج صيغة مساحة شبه المنحرف م = <span class=\"fr\"><span>١</span><span>٢</span></span> (أ + ب) × ع.</li><li>يحسب مساحة شبه المنحرف لأبعاد معطاة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يجد طول قاعدة مجهولة لشبه منحرف علمت مساحته.</p>", "<span class=\"chip\">المخرج ١: فهم</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التعلم بالنمذجة</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: نسختان متطابقتان من شبه منحرف ورقي</span>", "<span class=\"chip\">شبه المنحرف</span><span class=\"chip\">القاعدتان المتوازيتان</span><span class=\"chip\">الارتفاع</span>", "<p>يضع الطلاب نسختين متطابقتين من شبه منحرف إحداهما مقلوبة بجوار الأخرى. ما الشكل الناتج؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يوجه التركيب.</p><p><em>الطالب:</em> يكتشف متوازي أضلاع قاعدته (أ + ب).</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>الصيغة</b><p><em>المعلم:</em> يقود إلى أن مس  د</span><div><b>التهيئة</b><p><em>المعلم:</em> يعرض الأجسام والسؤال.</p><p><em>الطالب:</em> يقترح الخيط.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>أجزاء الدائرة</b><p><em>المعلم:</em> يرسم دائرة ويسمي أجزاءها ويوضح العلاقة بين القطر ونصف القطر.</p><p><em>الطالب:</em> يرسم ويسمي.</p></div></div><div class=\"step\"><span class=\"tm\">١٧ د</span><div><b>نشاط اكتشاف π</b><p><em>المعلم:</em> توزع المجموعات الأجسام، تقيس القطر والمحيط بالخيط وتسجل في جدول، وتحسب المحيط ÷ القطر.</p><p><em>الطالب:</em> تقيس وتحسب وتجد قيمًا قريبة من ٣٫١.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>مناقشة النتائج</b><p><em>المعلم:</em> يجمع القيم على السبورة ويعرّف π ≈ ٣٫١٤.</p><p><em>الطالب:</em> يقارن ويفسر الاختلاف.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: دائرة نصف قطرها ٦ سم. ما قطرها؟</p><p><em>الطالب:</em> يجيب ١٢ سم.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>دائرة نصف قطرها ٦ سم. ما قطرها؟<div class=\"ans\">الإجابة: ١٢ سم</div></li><li><span class=\"tier t1\">متوقع</span>سمِّ القطعة التي تصل بين نقطتين على الدائرة مرورًا بالمركز<div class=\"ans\">الإجابة: القطر</div></li><li><span class=\"tier t2\">متقدم</span>قاست مجموعة محيط صحن ٦٢٫٨ سم وقطره ٢٠ سم. ما قيمة المحيط ÷ القطر؟ وماذا تمثل؟<div class=\"ans\">الإجابة: ٣٫١٤، وهي قيمة تقريبية للعدد π</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>ما الاسم الآخر لطول حافة الدائرة؟<div class=\"ans\">الإجابة: المحيط</div></li><li><span class=\"tier t1\">متوقع</span>دائرة قطرها ١٥ سم. ما نصف قطرها؟<div class=\"ans\">الإجابة: ٧٫٥ سم</div></li><li><span class=\"tier t2\">متقدم</span>لماذا اختلفت قيم المحيط ÷ القطر قليلًا بين المجموعات؟<div class=\"ans\">الإجابة: بسبب أخطاء القياس بالخيط والمسطرة</div></li></ol>", "<p>للطالب: قياس محيط وقطر جسمين أسطوانيين في البيت وحساب المحيط ÷ القطر. لولي الأمر: مساعدة الابن في ا /li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يحسب محيط نصف دائرة (القوس + القطر).</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: آلة حاسبة بتوجيه المعلم</span>", "<span class=\"chip\">محيط الدائرة</span><span class=\"chip\">π</span><span class=\"chip\">القطر</span><span class=\"chip\">نصف القطر</span>", "<p>مراجعة: القطر = ٢ × نصف القطر، و π ≈ ٣٫١٤. سؤال: إذا كان المحيط ÷ القطر = π فكيف نكتب المحيط؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح السؤال.</p><p><em>الطالب:</em> يستنتج ح = π × ق.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج حساب محيط دائرة قطرها ١٠ سم ونصف قطرها ٧ سم بـ π = ٣٫١٤، ثم إيجاد القطر من المحيط ٣١٫٤.</p><p><em>الطالب:</em> يحل أمثلة.</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين المحيط من ٧-٥ ص ١٣٦–١٣٧.</p><p><em>الطالب:</em> يحسب ويقرب.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>نصف الدائرة</b><p><em>المعلم:</em> ينمذج محيط نصف دائرة قطرها ١٠: ١٥٫٧ + ١٠ = ٢٥٫٧.</p><p><em>الطالب:</em> يحل مثالًا.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: عجلة قطرها ٥٠ سم، كم تقطع في دورة واحدة؟</p><p><em>الطالب:</em> يجيب ١٥٧ سم.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد محيط دائرة قطرها ١٠ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٣١٫٤ سم</div></li><li><span class=\"tier t1\">متوقع</span>أوجد محيط دائرة نصف قطرها ٧ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٤٣٫٩٦ سم</div></li><li><span class=\"tier t2\">متقدم</span>دائرة محيطها ٦٢٫٨ م. أوجد نصف قطرها (π = ٣٫١٤)<div class=\"ans\">الإجابة: ١٠ م</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد محيط دائرة قطرها ٢٠ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٦٢٫٨ سم</div></li><li><span class=\"tier t1\">متوقع</span>عجلة قطرها ٥٠ سم. كم سم تقطع في دورة واحدة؟<div class=\"ans\">الإجابة: ١٥٧ سم</div></li><li><span class=\"tier t2\">متقدم</span>أوجد محيط نصف دائرة قطرها ١٠ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٢٥٫٧ سم</div></li></ol>", "<p>للطالب: حل تمارين المحيط في كتاب النشاط ص ٩٥. لولي الأمر: حساب محيط عجلة الدراجة مع الابن.</p>"], "txt": ["١. يحسب محيط الدائرة باستخدام ح = π × ق أو ح = ٢ × π × نق.\n٢. يجد قطر دائرة علم محيطها.\nمخرج تعليمي آخر: يحسب محيط نصف دائرة (القوس + القطر).", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تحليل", "التعلم بالنمذجة، التعلم الذاتي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: آلة حاسبة بتوجيه المعلم", "محيط الدائرة، π، القطر، نصف القطر", "مراجعة: القطر = ٢ × نصف القطر، و π ≈ ٣٫١٤. سؤال: إذا كان المحيط ÷ القطر = π فكيف نكتب المحيط؟", "(٥ د) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يستنتج ح = π × ق.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج حساب محيط دائرة قطرها ١٠ سم ونصف قطرها ٧ سم بـ π = ٣٫١٤، ثم إيجاد القطر من المحيط ٣١٫٤.\nدور الطالب: يحل أمثلة.\n\n(١٥ د) التدريب\nدور المعلم: يكلف بتمارين المحيط من ٧-٥ ص ١٣٦–١٣٧.\nدور الطالب: يحسب ويقرب.\n\n(٥ د) نصف الدائرة\nدور المعلم: ينمذج محيط نصف دائرة قطرها ١٠: ١٥٫٧ + ١٠ = ٢٥٫٧.\nدور الطالب: يحل مثالًا.\n\n(٥ د) الغلق\nدور المعلم: سؤال: عجلة قطرها ٥٠ سم، كم تقطع في دورة واحدة؟\nدور الطالب: يجيب ١٥٧ سم.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) أوجد محيط دائرة قطرها ١٠ سم (π = ٣٫١٤)\nالإجابة: ٣١٫٤ سم\n٢. (متوقع) أوجد محيط دائرة نصف قطرها ٧ سم (π = ٣٫١٤)\nالإجابة: ٤٣٫٩٦ سم\n٣. (متقدم) دائرة محيطها ٦٢٫٨ م. أوجد نصف قطرها (π = ٣٫١٤)\nالإجابة: ١٠ م", "١. (دعم) أوجد محيط دائرة قطرها ٢٠ سم (π = ٣٫١٤)\nالإجابة: ٦٢٫٨ سم\n٢. (متوقع) عجلة قطرها ٥٠ سم. كم سم تقطع في دورة واحدة؟\nالإجابة: ١٥٧ سم\n٣. (متقدم) أوجد محيط نصف دائرة قطرها ١٠ سم (π = ٣٫١٤)\nالإجابة: ٢٥٫٧ سم", "للطالب: حل تمارين المحيط في كتاب النشاط ص ٩٥. لولي الأمر: حساب محيط عجلة الدراجة مع الابن."]}, {"axis": "مساحة الدائرة", "axisT": "مساحة الدائرة", "html": ["<ol><li>يحسب مساحة الدائرة باستخدام م = π × نق<sup>٢</sup>.</li><li>يميز بين صيغتي المحيط والمساحة ويتجنب الخلط بينهما.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يفسر صيغة مساحة الدائرة بتقطيعها إلى قطاعات تشكل شبه متوازي أضلاع.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: فهم</span><span class=\"chip\">المخرج الآخر: فهم</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: دائرة ورقية مقسمة إلى ١٦ قطاعًا</span>", "<span class=\"chip\">مساحة الدائرة</span><span class=\"chip\">نق<sup>٢</sup></span><span class=\"chip\">π</span>", "<p>يقص الطلاب دائرة ورقية إلى ١٦ قطاعًا ويرتبونها متبادلة. ما الشكل الناتج تقريبًا؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يوجه القص والترتيب.</p><p><em>الطالب:</em> يرى شكلًا يشبه متوازي الأضلاع.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>استنتاج الصيغة</b><p><em>المعلم:</em> يوضح أن القاعدة ≈ نصف المحيط = π × نق، والارتفاع ≈ نق، فالمساحة = π × نق<sup>٢</sup>، وينبه أن نق<sup>٢</sup> = نق × نق وليس ٢ × نق.</p><p><em>الطالب:</em> يكتب الاستنتاج.</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين المساحة من ٧-٥ ص ١٣٨.</p><p><em>الطالب:</em> يحسب المساحات بـ π = ٣٫١٤.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>تمييز الصيغ</b><p><em>المعلم:</em> يعرض جدولًا لصيغتي المحيط والمساحة مع الوحدات.</p><p><em>الطالب:</em> يكمل الجدول.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: مساحة دائرة نصف قطرها ١٠ سم.</p><p><em>الطالب:</em> يجيب ٣١٤ سم<sup>٢</sup>.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد مساحة دائرة نصف قطرها ١٠ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٣١٤ سم<sup>٢</sup></div></li><li><span class=\"tier t1\">متوقع</span>أوجد مساحة دائرة قطرها ٦ م (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٢٨٫٢٦ م<sup>٢</sup></div></li><li><span class=\"tier t2\">متقدم</span>حسب طالب مساحة دائرة نصف قطرها ٥ فكتب π × ١٠. ما خطؤه؟ وما الصحيح؟<div class=\"ans\">الإجابة: حسب ٢ × نق بدل نق<sup>٢</sup>، والصحيح ٢٥π = ٧٨٫٥</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد مساحة دائرة نصف قطرها ٢ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ١٢٫٥٦ سم<sup>٢</sup></div></li><li><span class=\"tier t1\">متوقع</span>أوجد مساحة دائرة قطرها ٢٠ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٣١٤ سم<sup>٢</sup></div></li><li><span class=\"tier t2\">متقدم</span>أوجد مساحة نصف دائرة نصف قطرها ٤ م (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٢٥٫١٢ م<sup>٢</sup></div></li></ol>", "<p>للطالب: حل تمارين المساحة في كتاب النشاط ص ٩٦. لولي الأمر: تشجيع الابن على شرح الفرق بين صيغتي المحيط والمساحة.</p>"], "txt": ["١. يحسب مساحة الدائرة باستخدام م = π × نق^٢.\n٢. يميز بين صيغتي المحيط والمساحة ويتجنب الخلط بينهما.\nمخرج تعليمي آخر: يفسر صيغة مساحة الدائرة بتقطيعها إلى قطاعات تشكل شبه متوازي أضلاع.", "المخرج ١: تطبيق\nالمخرج ٢: فهم\nالمخرج الآخر: فهم", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: دائرة ورقية مقسمة إلى ١٦ قطاعًا", "مساحة الدائرة، نق^٢، π", "يقص الطلاب دائرة ورقية إلى ١٦ قطاعًا ويرتبونها متبادلة. ما الشكل الناتج تقريبًا؟", "(٥ د) التهيئة\nدور المعلم: يوجه القص والترتيب.\nدور الطالب: يرى شكلًا يشبه متوازي الأضلاع.\n\n(١٠ د) استنتاج الصيغة\nدور المعلم: يوضح أن القاعدة ≈ نصف المحيط = π × نق، والارتفاع ≈ نق، فالمساحة = π × نق^٢، وينبه أن نق^٢ = نق × نق وليس ٢ × نق.\nدور الطالب: يكتب الاستنتاج.\n\n(١٥ د) التدريب\nدور المعلم: يكلف بتمارين المساحة من ٧-٥ ص ١٣٨.\nدور الطالب: يحسب المساحات بـ π = ٣٫١٤.\n\n(٥ د) تمييز الصيغ\nدور المعلم: يعرض جدولًا لصيغتي المحيط والمساحة مع الوحدات.\nدور الطالب: يكمل الجدول.\n\n(٥ د) الغلق\nدور المعلم: سؤال: مساحة دائرة نصف قطرها ١٠ سم.\nدور الطالب: يجيب ٣١٤ سم^٢.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) أوجد مساحة دائرة نصف قطرها ١٠ سم (π = ٣٫١٤)\nالإجابة: ٣١٤ سم^٢\n٢. (متوقع) أوجد مساحة دائرة قطرها ٦ م (π = ٣٫١٤)\nالإجابة: ٢٨٫٢٦ م^٢\n٣. (متقدم) حسب طالب مساحة دائرة نصف قطرها ٥ فكتب π × ١٠. ما خطؤه؟ وما الصحيح؟\nالإجابة: حسب ٢ × نق بدل نق^٢، والصحيح ٢٥π = ٧٨٫٥", "١. (دعم) أوجد مساحة دائرة نصف قطرها ٢ سم (π = ٣٫١٤)\nالإجابة: ١٢٫٥٦ سم^٢\n٢. (متوقع) أوجد مساحة دائرة قطرها ٢٠ سم (π = ٣٫١٤)\nالإجابة: ٣١٤ سم^٢\n٣. (متقدم) أوجد مساحة نصف دائرة نصف قطرها ٤ م (π = ٣٫١٤)\nالإجابة: ٢٥٫١٢ م^٢", "للطالب: حل تمارين المساحة في كتاب النشاط ص ٩٦. لولي الأمر: تشجيع الابن على شرح الفرق بين صيغتي المحيط والمساحة."]}, {"axis": "مسائل حياتية على مساحة الدائرة ومحيطها", "axisT": "مسائل حياتية على مساحة الدائرة ومحيطها", "html": ["<ol><li>يحل مسائل حياتية تتطلب حساب محيط الدائرة أو مساحتها.</li><li>يختار الصيغة المناسبة حسب المطلوب في المسألة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يحل مسألة عكسية لإيجاد نصف القطر من المساحة.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على اللعب</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">المحيط</span><span class=\"chip\">المساحة</span><span class=\"chip\">π</span><span class=\"c رية قطرها ١٫٢ م. أوجد مساحة زجاجها (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٠٫٥٦٥٢ م<sup>٢</sup></div></li></ol>", "<p>للطالب: حل مسائل الدرس ٧-٥ المتبقية. لولي الأمر: البحث مع الابن عن أشياء دائرية في البيت وحساب محيطها.</p>"], "txt": ["١. يحل مسائل حياتية تتطلب حساب محيط الدائرة أو مساحتها.\n٢. يختار الصيغة المناسبة حسب المطلوب في المسألة.\nمخرج تعليمي آخر: يحل مسألة عكسية لإيجاد نصف القطر من المساحة.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المحيط، المساحة، π، نصف الدائرة", "صور: حديقة دائرية تحتاج سياجًا، وطاولة دائرية تحتاج غطاء. أي الحالتين محيط وأيهما مساحة؟", "(٥ د) التهيئة\nدور المعلم: يعرض الصورتين.\nدور الطالب: يحدد الصيغة المناسبة.\n\n(١٥ د) محطات المسائل\nدور المعلم: ينظم محطات: سياج حديقة، غطاء طاولة، مسار سباق دائري، نافذة نصف دائرية.\nدور الطالب: تحل المجموعات في كل محطة.\n\n(١٠ د) مسألة عكسية\nدور المعلم: ينمذج: دائرة مساحتها ٧٨٫٥ سم^٢، أوجد نصف قطرها (نق^٢ = ٢٥، نق = ٥).\nدور الطالب: يحل مثالًا مشابهًا.\n\n(٥ د) مسابقة\nدور المعلم: أسئلة سريعة من ملف المسابقة.\nدور الطالب: تتنافس المجموعات.\n\n(٥ د) الغلق\nدور المعلم: سؤال: سياج حديقة قطرها ١٤ م.\nدور الطالب: يجيب ٤٣٫٩٦ م.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) كم مترًا من السياج لحديقة دائرية قطرها ١٤ م؟ (π = ٣٫١٤)\nالإجابة: ٤٣٫٩٦ م\n٢. (متوقع) غطاء طاولة دائرية نصف قطرها ٠٫٥ م. مساحته؟ (π = ٣٫١٤)\nالإجابة: ٠٫٧٨٥ م^٢\n٣. (متقدم) دائرة مساحتها ٧٨٫٥ سم^٢. أوجد نصف قطرها (π = ٣٫١٤)\nالإجابة: ٥ سم", "١. (دعم) أي صيغة نستخدم لحساب طول إطار مرآة دائرية: المحيط أم المساحة؟\nالإجابة: المحيط\n٢. (متوقع) مسار دائري نصف قطره ٥٠ م. كم مترًا يقطع العداء في ٣ لفات؟ (π = ٣٫١٤)\nالإجابة: ٩٤٢ م\n٣. (متقدم) نافذة نصف دائرية قطرها ١٫٢ م. أوجد مساحة زجاجها (π = ٣٫١٤)\nالإجابة: ٠٫٥٦٥٢ م^٢", "للطالب: حل مسائل الدرس ٧-٥ المتبقية. لولي الأمر: البحث مع الابن عن أشياء دائرية في البيت وحساب محيطها."]}]}, {"idA": "٧-٦", "title": "مساحة الأشكال المركبة" ط ملعب طوله المستقيم ١٠٠ م وطرفاه نصفا دائرة قطرها ٦٠ م.\nدور الطالب: يجيب ٢٠٠ + ١٨٨٫٤ = ٣٨٨٫٤ م.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) شكل L أضلاعه: ١٠، ٣، ٤، ٥، ٦، ٨ م. محيطه؟\nالإجابة: ٣٦ م\n٢. (متوقع) مستطيل ٨ × ٦ قُطع من زاويته مربع ٢ × ٢. محيط الشكل الناتج؟\nالإجابة: ٢٨\n٣. (متقدم) ملعب: مستقيمان طول كل منهما ١٠٠ م وطرفان نصفا دائرة قطرها ٦٠ م. محيطه؟ (π = ٣٫١٤)\nالإجابة: ٣٨٨٫٤ م", "١. (دعم) ما المقصود بمحيط الشكل المركب؟\nالإجابة: مجموع أطوال حدوده الخارجية\n٢. (متوقع) شكل مكون من مربع ضلعه ٤ سم ونصف دائرة قطرها ٤ سم على أحد أضلاعه. محيطه؟ (π = ٣٫١٤)\nالإجابة: ١٨٫٢٨ سم\n٣. (متقدم) صمم شكلًا مركبًا من مستطيلين مساحته ٣٠ وحدة مربعة واحسب محيطه\nالإجابة: تختلف الإجابات، مع صحة الحساب", "للطالب: إكمال تصميم الحديقة وحساب محيطها ومساحتها. لولي الأمر: مشاركة الابن في تصميم مخطط حديقة البيت."]}, {"axis": "تمارين ومسائل عامة على الوحدة السابعة", "axisT": "تمارين ومسائل عامة على الوحدة السابعة", "html": ["<ol><li>يوظف صيغ المساحة والمحيط للأشكال المختلفة في مسائل متنوعة.</li><li>يقوّم تعلمه في الوحدة السابعة ويحدد ما يحتاج إلى مراجعة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يحل مسألة متكاملة تجمع بين تحويل الوحدات والمساحة.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تقييم</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على اللعب</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">المساحة</span><span class=\"chip\">المحيط</span><span class=\"chip\">تحويل الوحدات</span><span class=\"chip\">الأشكال المركبة</span>", "<p>بطاقات صيغ مقلوبة: يسحب الطالب بطاقة شكل ويذكر صيغة مساحته ومحيطه.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يدير سحب البطاقات.</p><p><em>الطالب:</em> يذكر الصيغ.</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>محطات المراجعة</b><p><em>المعلم:</em> ينظم محطات من تمارين ومسائل عامة ص ١٤٤: تحويل الوحدات، المثلث ومتوازي الأضلاع وشبه المنحرف، الدائرة، الأشكال المركبة.</p><p><em>الطالب:</em> تتنقل المجموعات وتحل.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>مسألة متكاملة</b><p><em>المعلم:</em> يطرح: ساحة مدرسية ٤٠ م × ٢٥ م فيها حوض دائري نصف قطره ٣ م. كم م<sup>٢</sup> تحتاج إلى عشب؟</p><p><em>الطالب:</em> يحل: ١٠٠٠ - ٢٨٫٢٦ = ٩٧١٫٧٤ م<sup>٢</sup>.</p></div></div><div class=\"step\"><span class=\"tm\">٧ د</span><div><b>تقويم ذاتي</b><p><em>المعلم:</em> يوزع قائمة «أستطيع أن…».</p><p><em>الطالب:</em> يحدد مستواه.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> مسابقة من ملف المسابقة.</p><p><em>الطالب:</em> تتنافس المجموعات.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>حوّل ٣ م<sup>٢</sup> إلى سم<sup>٢</sup><div class=\"ans\">الإجابة: ٣٠٠٠٠ سم<sup>٢</sup></div></li><li><span class=\"tier t1\">متوقع</span>أوجد مساحة شبه منحرف قاعدتاه ٥ و ١١ وارتفاعه ٤<div class=\"ans\">الإجابة: ٣٢</div></li><li><span class=\"tier t2\">متقدم</span>ساحة ٤٠ م × ٢٥ م فيها حوض دائري نصف قطره ٣ م. مساحة العشب؟ (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٩٧١٫٧٤ م<sup>٢</sup></div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد مساحة مثلث قاعدته ١٤ وارتفاعه ٥<div class=\"ans\">الإجابة: ٣٥</div></li><li><span class=\"tier t1\">متوقع</span>أوجد محيط دائرة نصف قطرها ٣٫٥ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٢١٫٩٨ سم</div></li><li><span class=\"tier t2\">متقدم</span>شكل مركب: مستطيل ٦ × ٤ ومثلث قاعدته ٦ وارتفاعه ٤ فوقه. أوجد المساحة بالمليمتر المربع إذا كانت الأبعاد بالسنتيمتر<div class=\"ans\">الإجابة: ٣٦ سم<sup>٢</sup> = ٣٦٠٠ ملم<sup>٢</sup></div></li></ol>", "<p>للطالب: مراجعة الوحدة السابعة وحل تمارين ومسائل عامة ص ١٤٤. لولي الأمر: مراجعة قائمة الصيغ مع الابن.</p>"], "txt": ["١. يوظف صيغ المساحة والمحيط للأشكال المختلفة في مسائل متنوعة.\n٢. يقوّم تعلمه في الوحدة السابعة ويحدد ما يحتاج إلى مراجعة.\nمخرج تعليمي آخر: يحل مسألة متكاملة تجمع بين تحويل الوحدات والمساحة.", "المخرج ١: تطبيق\nالمخرج ٢: تقييم\nالمخرج الآخر: تحليل", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المساحة، المحيط، تحويل الوحدات، الأشكال المركبة", "بطاقات صيغ مقلوبة: يسحب الطالب بطاقة شكل ويذكر صيغة مساحته ومحيطه.", "(٥ د) التهيئة\nدور المعلم: يدير سحب البطاقات.\nدور الطالب: يذكر الصيغ.\n\n(١٥ د) محطات المراجعة\nدور المعلم: ينظم محطات من تمارين ومسائل عامة ص ١٤٤: تحويل الوحدات، المثلث ومتوازي الأضلاع وشبه المنحرف، الدائرة، الأشكال المركبة.\nدور الطالب: تتنقل المجموعات وتحل.\n\n(٨ د) مسألة متكاملة\nدور المعلم: يطرح: ساحة مدرسية ٤٠ م × ٢٥ م فيها حوض دائري نصف قطره ٣ م. كم م^٢ تحتاج إلى عشب؟\nدور الطالب: يحل: ١٠٠٠ - ٢٨٫٢٦ = ٩٧١٫٧٤ م^٢.\n\n(٧ د) تقويم ذاتي\nدور المعلم: يوزع قائمة «أستطيع أن…».\nدور الطالب: يحدد مستواه.\n\n(٥ د) الغلق\nدور المعلم: مسابقة من ملف المسابقة.\nدور الطالب: تتنافس المجموعات.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) حوّل ٣ م^٢ إلى سم^٢\nالإجابة: ٣٠٠٠٠ سم^٢\n٢. (متوقع) أوجد مساحة شبه منحرف قاعدتاه ٥ و ١١ وارتفاعه ٤\nالإجابة: ٣٢\n٣. (متقدم) ساحة ٤٠ م × ٢٥ م فيها حوض دائري نصف قطره ٣ م. مساحة العشب؟ (π = ٣٫١٤)\nالإجابة: ٩٧١٫٧٤ م^٢", "١. (دعم) أوجد مساحة مثلث قاعدته ١٤ وارتفاعه ٥\nالإجابة: ٣٥\n٢. (متوقع) أوجد محيط دائرة نصف قطرها ٣٫٥ سم (π = ٣٫١٤)\nالإجابة: ٢١٫٩٨ سم\n٣. (متقدم) شكل مركب: مستطيل ٦ × ٤ ومثلث قاعدته ٦ وارتفاعه ٤ فوقه. أوجد المساحة بالمليمتر المربع إذا كانت الأبعاد بالسنتيمتر\nالإجابة: ٣٦ سم^٢ = ٣٦٠٠ ملم^٢", "للطالب: مراجعة الوحدة السابعة وحل تمارين ومسائل عامة ص ١٤٤. لولي الأمر: مراجعة قائمة الصيغ مع الابن."]}]}, {"idA": "٨-١", "title": "النسب المئوية البسيطة", "unit": "الوحدة الثامنة: النسب المئوية", "st": "١٤٧–١٤٨", "ac": "٩٩–١٠٠", "tb": "١٥٠", "week": "الأسبوع الثالث عشر", "dates": "٢٩/١١–٣/١٢/٢٠٢٦م", "periods": [{"axis": "مفهوم النسبة المئوية وتمثيلها على شبكة المئة", "axisT": "مفهوم النسبة المئوية وتمثيلها على شبكة المئة", "html": ["<ol><li>يفسر النسبة المئوية بأنها عدد الأجزاء من ١٠٠ ويمثلها على شبكة المئة.</li><li>يكتب النسبة المئوية كسرًا مقامه ١٠٠ ثم في أبسط صورة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يذكر أمثلة على استخدام النسب المئوية في الحياة (التخفيضات، نسبة الشحن، النتائج).</p>", "<span class=\"chip\">المخرج ١: فهم</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: تذكر</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التشاركي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: شبكات المئة وأقلام تلوين</span>", "<span class=\"chip\">النسبة المئوية</span><span class=\"chip\">الرمز ٪</span><span class=\"chip\">شبكة المئة</span><span class=\"chip\">الكسر</span>", "<p>عرض صور: شاحن هاتف ٤٥٪، لافتة تخفيض ٣٠٪، نتيجة اختبار ٩٠٪. ماذا تعني كل نسبة؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يعرض الصور ويستقبل التفسيرات.</p><p><em>الطالب:</em> يفسر كل نسبة بلغته.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>شبكة المئة</b><p><em>المعلم:</em> يطلب تلوين ٣٧ مربعًا من ١٠٠ وكتابتها <span class=\"fr\"><span>٣٧</span><span>١٠٠</span></span> = ٣٧٪، ثم ٥٠٪ و ٢٥٪.</p><p><em>الطالب:</em> يلون ويكتب النسب بالصورتين.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج كتابة ٢٠٪ = <span class=\"fr\"><span>٢٠</span><span>١٠٠</span></span> = <span class=\"fr\"><span>١</span><span>٥</span></span> و ٧٥٪ = <span class=\"fr\"><span>٣</span><span>٤</span></span> و ٤٪ = <span class=\"fr\"><span>١</span><span>٢٥</span></span>.</p><p><em>الطالب:</em> يبسط نسبًا أخرى.</p></div></div><div class=\"step\"><span cla ", "(٥ د) التهيئة\nدور المعلم: يعرض الصور ويستقبل التفسيرات.\nدور الطالب: يفسر كل نسبة بلغته.\n\n(١٠ د) شبكة المئة\nدور المعلم: يطلب تلوين ٣٧ مربعًا من ١٠٠ وكتابتها ٣٧/١٠٠ = ٣٧٪، ثم ٥٠٪ و ٢٥٪.\nدور الطالب: يلون ويكتب النسب بالصورتين.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج كتابة ٢٠٪ = ٢٠/١٠٠ = ١/٥ و ٧٥٪ = ٣/٤ و ٤٪ = ١/٢٥.\nدور الطالب: يبسط نسبًا أخرى.\n\n(١٠ د) التدريب\nدور المعلم: يكلف بالتمارين الأولى من ٨-١ ص ١٤٧.\nدور الطالب: يحل.\n\n(٥ د) الغلق\nدور المعلم: سؤال: ما النسبة المئوية للجزء غير الملون إذا لون ٣٧ مربعًا؟\nدور الطالب: يجيب ٦٣٪.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) اكتب ٥٠٪ كسرًا في أبسط صورة\nالإجابة: ١/٢\n٢. (متوقع) اكتب ٣٥٪ كسرًا في أبسط صورة\nالإجابة: ٧/٢٠\n٣. (متقدم) لون أحمد ٢٨ مربعًا من شبكة المئة. ما النسبة المئوية لغير الملون؟\nالإجابة: ٧٢٪", "١. (دعم) ماذا يعني ٣٠٪؟\nالإجابة: ٣٠ جزءًا من كل ١٠٠\n٢. (متوقع) اكتب ٤٪ كسرًا في أبسط صورة\nالإجابة: ١/٢٥\n٣. (متقدم) شحن هاتف ٤٥٪. ما النسبة المتبقية حتى يكتمل الشحن؟\nالإجابة: ٥٥٪", "للطالب: البحث عن ثلاثة أمثلة للنسب المئوية في الإعلانات أو الأخبار وحل كتاب النشاط ص ٩٩. لولي الأمر: مناقشة الابن في معنى نسب التخفيض في المحلات."]}, {"axis": "تحويل الكسور التي مقاماتها من عوامل ١٠٠ إلى نسب مئوية", "axisT": "تحويل الكسور التي مقاماتها من عوامل ١٠٠ إلى نسب مئوية", "html": ["<ol><li>يحول كسرًا مقامه من عوامل ١٠٠ (٢، ٤، ٥، ١٠، ٢٠، ٢٥، ٥٠) إلى نسبة مئوية بكسر مكافئ مقامه ١٠٠.</li><li>يكتشف أي الكسور ذات المقامات الصغيرة يسهل تحويلها إلى نسب مئوية.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يتوصل إلى قاعدة: الكسر الذي مقامه عامل للعدد ١٠٠ يمكن كتابته بمقام ١٠٠ مباشرة.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: بطاقات كسور</span>", "<span تحويله مباشرة بمقام ١٠٠: <span class=\"fr\"><span>٣</span><span>٢٠</span></span> أم <span class=\"fr\"><span>٢</span><span>٧</span></span>؟ ولماذا؟<div class=\"ans\">الإجابة: <span class=\"fr\"><span>٣</span><span>٢٠</span></span>، لأن ٢٠ عامل من عوامل ١٠٠</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>اكتب <span class=\"fr\"><span>٣</span><span>٥</span></span> نسبة مئوية<div class=\"ans\">الإجابة: ٦٠٪</div></li><li><span class=\"tier t1\">متوقع</span>اكتب <span class=\"fr\"><span>١٣</span><span>٥٠</span></span> نسبة مئوية<div class=\"ans\">الإجابة: ٢٦٪</div></li><li><span class=\"tier t2\">متقدم</span>قال طالب: <span class=\"fr\"><span>١</span><span>٤</span></span> = ٤٪. صحح خطأه<div class=\"ans\">الإجابة: <span class=\"fr\"><span>١</span><span>٤</span></span> = <span class=\"fr\"><span>٢٥</span><span>١٠٠</span></span> = ٢٥٪</div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ١٠٠. لولي الأمر: تحويل كسور بسيطة إلى نسب مئوية مع الابن.</p>"], "txt": ["١. يحول كسرًا مقامه من عوامل ١٠٠ (٢، ٤، ٥، ١٠، ٢٠، ٢٥، ٥٠) إلى نسبة مئوية بكسر مكافئ مقامه ١٠٠.\n٢. يكتشف أي الكسور ذات المقامات الصغيرة يسهل تحويلها إلى نسب مئوية.\nمخرج تعليمي آخر: يتوصل إلى قاعدة: الكسر الذي مقامه عامل للعدد ١٠٠ يمكن كتابته بمقام ١٠٠ مباشرة.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات كسور", "الكسر المكافئ، عوامل ١٠٠، النسبة المئوية", "سؤال: كيف نكتب ٣/٤ بمقام ١٠٠؟", "(٥ د) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يضرب في ٢٥: ٧٥/١٠٠ = ٧٥٪.\n\n(١٢ د) نشاط الاستكشاف\nدور المعلم: يعرض الكسور ١/٢ حتى ١/٢٠ ويطلب تحديد أيها يمكن كتابته بمقام ١٠٠ مباشرة.\nدور الطالب: تصنف المجموعة الكسور وتستنتج القاعدة.\n\n(٨ د) النمذجة\nدور المعلم: ينمذج ٧/٢٠ = ٣٥٪ و ٩/٢٥ = ٣٦٪ و ١٣/٥٠ = ٢٦٪، وينبه لخطأ ١/٤ = ٤٪.\nدور الطالب: يحول أمثلة.\n\n(١٠ د) التدريب\nدور المعلم: يكلف بتمارين ٨-١ المتوسطة.\nدور الطالب: يحل.\n\n(٥ د) الغلق\nدور المعلم: سؤال: ٣/٥ كنسبة مئوية.\nدور الطالب: يجيب ٦٠٪.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) اكتب ١/٤ نسبة مئوية\nالإجابة: ٢٥٪\n٢. (متوقع) اكتب ٩/٢٥ نسبة مئوية\nالإجابة: ٣٦٪\n٣. (متقدم) أي الكسرين يسهل تحويله مباشرة بمقام ١٠٠: ٣/٢٠ أم ٢/٧؟ ولماذا؟\nالإجابة: ٣/٢٠، لأن ٢٠ عامل من عوامل ١٠٠", "١. (دعم) اكتب ٣/٥ نسبة مئوية\nالإجابة: ٦٠٪\n٢. (متوقع) اكتب ١٣/٥٠ نسبة مئوية\nالإجابة: ٢٦٪\n٣. (متقدم) قال طالب: ١/٤ = ٤٪. صحح خطأه\nالإجابة: ١/٤ = ٢٥/١٠٠ = ٢٥٪", "للطالب: حل تمارين كتاب النشاط ص ١٠٠. لولي الأمر: تحويل كسور بسيطة إلى نسب مئوية مع الابن."]}, {"axis": "النسب المئوية في سياقات حياتية", "axisT": "النسب المئوية في سياقات حياتية", "html": ["<ol><li>يعبر عن أجزاء من شكل أو مجموعة بنسب مئوية.</li><li>يستخدم أن مجموع الأجزاء يساوي ١٠٠٪ لإيجاد نسبة مجهولة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يحل مسألة توزيع بنسب مئوية لعدة فئات.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على اللعب</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">الكل = ١٠٠٪</span><span class=\"chip\">النسبة المئوية</span><span class=\"chip\">الجزء</span>", "<p>سؤال: في استبانة، ٤٥٪ يفضلون كرة القدم و ٣٠٪ السلة والباقي الطائرة. ما نسبة الطائرة؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح السؤال.</p><p><em>الطالب:</em> يجيب ٢٥٪.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>مسائل الكل والأجزاء</b><p><em>المعلم:</em> يوزع مسائل: أجزاء وجبة، نتائج تصويت، ألوان علم مرسوم على شبكة.</p><p><em>الطالب:</em> يحسب النسب المجهولة.</p></div></div><div class=\"step\"><span class=\"tm\">١٣ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بمسائل الدرس ٨-١ وكتاب النشاط.</p><p><em>الطالب:</em> يحل ويبرر.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>مسابقة</b><p><em>المعلم:</em> أسئلة سريعة من ملف المسابقة.</p><p><em>الطالب:</em> تتنافس المجموعات.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: ٢٠ طالبًا، ٥ منهم غائبون. نسبة الغياب؟</p><p><em>الطالب:</em> يجيب ٢٥٪.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>٤٥٪ كرة قدم و ٣٠٪ سلة والباقي طائرة. نسبة الطائرة؟<div class=\"ans\">الإجابة: ٢٥٪</div></li><li><span class=\"tier t1\">متوقع</span>٢٠ طالبًا غاب منهم ٥. ما نسبة الغياب؟<div class=\"ans\">الإجابة: ٢٥٪</div></li><li><span class=\"tier t2\">متقدم</span>في صف ٢٥ طالبًا، ١٣ بنات. ما النسبة المئوية للبنين؟<div class=\"ans\">الإجابة: ٤٨٪</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>إذا كان ٧٠٪ من الطلاب حضروا، فما نسبة الغائبين؟<div class=\"ans\">الإجابة: ٣٠٪</div></li><li><span class=\"tier t1\">متوقع</span>من ٥٠ سؤالًا أجاب سالم عن ٤٢ إجابة صحيحة. نسبته؟<div class=\"ans\">الإجابة: ٨٤٪</div></li><li><span class=\"tier t2\">متقدم</span>مزرعة: <span class=\"fr\"><span>٢</span><span>٥</span></span> نخيل و ٣٥٪ ليمون والباقي خضروات. ما نسبة الخضروات؟<div class=\"ans\">الإجابة: ٢٥٪</div></li></ol>", "<p>للطالب: مراجعة الدرس ٨-١ وحل ما تبقى من كتاب النشاط ص ٩٩–١٠٠. لولي الأمر: حساب نسبة ما أُنجز من مهام البيت مع الابن.</p>"], "txt": ["١. يعبر عن أجزاء من شكل أو مجموعة بنسب مئوية.\n٢. يستخدم أن مجموع الأجزاء يساوي ١٠٠٪ لإيجاد نسبة مجهولة.\nمخرج تعليمي آخر: يحل مسألة توزيع بنسب مئوية لعدة فئات.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الكل = ١٠٠٪، النسبة المئوية، الجزء", "سؤال: في استبانة، ٤٥٪ يفضلون كرة القدم و ٣٠٪ السلة والباقي الطائرة. ما نسبة الطائرة؟", "(٥ د) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يجيب ٢٥٪.\n\n(١٢ د) مسائل الكل والأجزاء\nدور المعلم: يوزع مسائل: أجزاء وجبة، نتائج تصويت، ألوان علم مرسوم على شبكة.\nدور الطالب: يحسب النسب المجهولة.\n\n(١٣ د) التدريب\nدور المعلم: يكلف بمسائل الدرس ٨-١ وكتاب النشاط.\nدور الطالب: يحل ويبرر.\n\n(٥ د) مسابقة\nدور المعلم: أسئلة سريعة من ملف المسابقة.\nدور الطالب: تتنافس المجموعات.\n\n(٥ د) الغلق\nدور المعلم: سؤال: ٢٠ طالبًا، ٥ منهم غائبون. نسبة الغياب؟\nدور الطالب: يجيب ٢٥٪.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) ٤٥٪ كرة قدم و ٣٠٪ سلة والباقي طائرة. نسبة الطائرة؟\nالإجابة: ٢٥٪\n٢. (متوقع) ٢٠ طالبًا غاب منهم ٥. ما نسبة الغياب؟\nالإجابة: ٢٥٪\n٣. (متقدم) في صف ٢٥ طالبًا، ١٣ بنات. ما النسبة المئوية للبنين؟\nالإجابة: ٤٨٪", "١. (دعم) إذا كان ٧٠٪ من الطلاب حضروا، فما نسبة الغائبين؟\nالإجابة: ٣٠٪\n٢. (متوقع) من ٥٠ سؤالًا أجاب سالم عن ٤٢ إجابة صحيحة. نسبته؟\nالإجابة: ٨٤٪\n٣. (متقدم) مزرعة: ٢/٥ نخيل و ٣٥٪ ليمون والباقي خضروات. ما نسبة الخضروات؟\nالإجابة: ٢٥٪", "للطالب: مراجعة الدرس ٨-١ وحل ما تبقى من كتاب النشاط ص ٩٩–١٠٠. لولي الأمر: حساب نسبة ما أُنجز من مهام البيت مع الابن."]}]}, {"idA": "٨-٢", "title": "حساب الكسور والكسور العشرية والنسب المئوية المتكافئة", "unit": "الوحدة الثامنة: النسب المئوية", "st": "١٤٩–١٥١", "ac": "١٠١–١٠٢", "tb": "١٥١", "week": "الأسبوع الرابع عشر", "dates": "٦–١٠/١٢/٢٠٢٦م", "periods": [{"axis": "التحويل بين النسب المئوية والكسور العشرية", "axisT": "التحويل بين النسب المئوية والكسور العشرية", "html": ["<ol><li>يحول النسبة المئوية إلى كسر عشري بالقسمة على ١٠٠ والعكس بالضرب في ١٠٠.</li><li>يتجنب الخطأ الشائع في النسب المكونة من رقم واحد مثل ٨٪ = ٠٫٠٨.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يكتب نسبًا مئوية أكبر من ١٠٠٪ كأعداد عشرية ويفسر معناها.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: فهم</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\"> حل مسائل</b><p><em>المعلم:</em> يكلف بمسائل ٨-٤ وكتاب النشاط ص ١٠٦.</p><p><em>الطالب:</em> يحل ويكتب قرارًا مبررًا.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>مناقشة</b><p><em>المعلم:</em> يناقش لماذا تضلل الأعداد المجردة أحيانًا.</p><p><em>الطالب:</em> يقدم مثالًا.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: صف أ نجح ٢٧ من ٣٠، صف ب نجح ٣٦ من ٤٠. أيهما أفضل؟</p><p><em>الطالب:</em> يجيب: متساويان ٩٠٪.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>في أي مادة أداء سالم أفضل: ٣٤ من ٤٠ أم ٤٢ من ٥٠؟<div class=\"ans\">الإجابة: الرياضيات (٨٥٪ &gt; ٨٤٪)</div></li><li><span class=\"tier t1\">متوقع</span>صف أ نجح ٢٧ من ٣٠ وصف ب نجح ٣٦ من ٤٠. قارن<div class=\"ans\">الإجابة: متساويان (٩٠٪)</div></li><li><span class=\"tier t2\">متقدم</span>عصير أ: ١٢ غم سكر في ٢٠٠ مل، عصير ب: ٢٠ غم في ٢٥٠ مل. أيهما أقل نسبة سكر؟<div class=\"ans\">الإجابة: عصير أ (٦٪ مقابل ٨٪)</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أيهما أعلى: ١٨ من ٢٠ أم ٤٥ من ٥٠؟<div class=\"ans\">الإجابة: متساويان (٩٠٪)</div></li><li><span class=\"tier t1\">متوقع</span>فريق فاز في ١٥ من ٢٠ مباراة وآخر في ٢١ من ٣٠. أيهما أفضل؟<div class=\"ans\">الإجابة: الأول (٧٥٪ &gt; ٧٠٪)</div></li><li><span class=\"tier t2\">متقدم</span>لماذا لا يكفي القول إن فريق ب فاز ٢١ مرة وفريق أ ١٥ مرة للحكم بأن ب أفضل؟<div class=\"ans\">الإجابة: لأن عدد المباريات مختلف، فالمقارنة الصحيحة بالنسب المئوية</div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ١٠٦. لولي الأمر: مقارنة درجات مواد الابن بالنسب المئوية.</p>"], "txt": ["١. يقارن بين نتائج أو كميات مختلفة الكل بتحويلها إلى نسب مئوية.\n٢. يتخذ قرارًا مبنيًا على المقارنة بالنسب المئوية.\nمخرج تعليمي آخر: يفسر لماذا لا تكفي مقارنة الأعداد المجردة دون النسبة.", "المخرج ١: تحليل\nالمخرج ٢: تقييم\nالمخرج الآخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبو p\">الكسور</span><span class=\"chip\">المساحة</span><span class=\"chip\">المحيط</span><span class=\"chip\">النسب المئوية</span>", "<p>سؤال لكل وحدة: <span class=\"fr\"><span>٢</span><span>٣</span></span> + <span class=\"fr\"><span>١</span><span>٤</span></span>، مساحة دائرة نصف قطرها ١٠ (π = ٣٫١٤)، ١٥٪ من ٨٠.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح الأسئلة الثلاثة.</p><p><em>الطالب:</em> يجيب <span class=\"fr\"><span>١١</span><span>١٢</span></span>، ٣١٤، ١٢.</p></div></div><div class=\"step\"><span class=\"tm\">١٨ د</span><div><b>أسئلة المراجعة</b><p><em>المعلم:</em> يكلف بأسئلة مراجعة نهاية الفصل ص ١٦٣–١٦٥ المتعلقة بالوحدات ٦–٨.</p><p><em>الطالب:</em> يحل في أزواج.</p></div></div><div class=\"step\"><span class=\"tm\">٧ د</span><div><b>تصحيح جماعي</b><p><em>المعلم:</em> يناقش الأخطاء الشائعة (جمع المقامات، صيغ المساحة، القسمة بدل الضرب في النسب).</p><p><em>الطالب:</em> يصحح ذاتيًا.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>ختام الفصل بالمسابقة</b><p><em>المعلم:</em> يدير مسابقة المجموعات على أسئلة متنوعة من الفصل.</p><p><em>الطالب:</em> تتنافس المجموعات.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: <span class=\"fr\"><span>٢</span><span>٣</span></span> + <span class=\"fr\"><span>١</span><span>٤</span></span><div class=\"ans\">الإجابة: <span class=\"fr\"><span>١١</span><span>١٢</span></span></div></li><li><span class=\"tier t1\">متوقع</span>أوجد مساحة شبه منحرف قاعدتاه ٦ و ١٠ وارتفاعه ٥<div class=\"ans\">الإجابة: ٤٠</div></li><li><span class=\"tier t2\">متقدم</span>قميص سعره ٢٤ ريالًا عليه خصم ٢٥٪. كم سعره بعد الخصم؟<div class=\"ans\">الإجابة: ١٨ ريالًا</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد ١٥٪ من ٨٠<div class=\"ans\">الإجابة: ١٢</div></li><li><span class=\"tier t1\">متوقع</span>أوجد محيط دائرة قطرها ٨ سم (π = ٣٫١٤)<div class=\"ans\">الإجابة: ٢٥٫١٢ سم</div></li><li><span class=\"tier t2\">متقدم</span>رتب تصاعديًا: <span class=\"fr\"><span>٣</span><span>٥</span></span>، ٠٫٥٨، ٦٢٪<div class=\"ans\">الإجابة: ٠٫٥٨، <span class=\"fr\"><span>٣</span><span>٥</span></span>، ٦٢٪</div></li></ol>", "<p>للطالب: مراجعة الوحدات ٦–٨ وحل أسئلة المراجعة ص ١٦٣–١٦٥، ووضع خطة مراجعة شخصية. لولي الأمر: مساعدة الابن على الالتزام بخطة المراجعة قبل الاختبارات.</p>"], "txt": ["١. يحل أسئلة مراجعة على العمليات على الكسور وترتيبها وتحويلها.\n٢. يحل أسئلة مراجعة على المساحة والمحيط والنسب المئوية.\nمخرج تعليمي آخر: يخطط خطة مراجعة شخصية لما تبقى من نقاط ضعف.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: إبداع", "التعلم المبني على اللعب، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، جهاز عرض البيانات", "الكسور، المساحة، المحيط، النسب المئوية", "سؤال لكل وحدة: ٢/٣ + ١/٤، مساحة دائرة نصف قطرها ١٠ (π = ٣٫١٤)، ١٥٪ من ٨٠.", "(٥ د) التهيئة\nدور المعلم: يطرح الأسئلة الثلاثة.\nدور الطالب: يجيب ١١/١٢، ٣١٤، ١٢.\n\n(١٨ د) أسئلة المراجعة\nدور المعلم: يكلف بأسئلة مراجعة نهاية الفصل ص ١٦٣–١٦٥ المتعلقة بالوحدات ٦–٨.\nدور الطالب: يحل في أزواج.\n\n(٧ د) تصحيح جماعي\nدور المعلم: يناقش الأخطاء الشائعة (جمع المقامات، صيغ المساحة، القسمة بدل الضرب في النسب).\nدور الطالب: يصحح ذاتيًا.\n\n(١٠ د) ختام الفصل بالمسابقة\nدور المعلم: يدير مسابقة المجموعات على أسئلة متنوعة من الفصل.\nدور الطالب: تتنافس المجموعات.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) احسب: ٢/٣ + ١/٤\nالإجابة: ١١/١٢\n٢. (متوقع) أوجد مساحة شبه منحرف قاعدتاه ٦ و ١٠ وارتفاعه ٥\nالإجابة: ٤٠\n٣. (متقدم) قميص سعره ٢٤ ريالًا عليه خصم ٢٥٪. كم سعره بعد الخصم؟\nالإجابة: ١٨ ريالًا", "١. (دعم) أوجد ١٥٪ من ٨٠\nالإجابة: ١٢\n٢. (متوقع) أوجد محيط دائرة قطرها ٨ سم (π = ٣٫١٤)\nالإجابة: ٢٥٫١٢ سم\n٣. (متقدم) رتب تصاعديًا: ٣/٥، ٠٫٥٨، ٦٢٪\nالإجابة: ٠٫٥٨، ٣/٥، ٦٢٪", "للطالب: مراجعة الوحدات ٦–٨ وحل أسئلة المراجعة ص ١٦٣–١٦٥، ووضع خطة مراجعة شخصية. لولي الأمر: مساعدة الابن على الالتزام بخطة المراجعة قبل الاختبارات."]}]}];
const NAMES = ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const AD = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
let mode = 'sep', li = 0, pi = 0;
const $ = id => document.getElementById(id);
function fillLessons(){
  let html = '', unit = null;
  D.forEach((L,i) => {
    if (L.unit !== unit){ if (unit !== null) html += '</optgroup>'; unit = L.unit; html += `<optgroup label="${unit}">`; }
    html += `<option value="${i}">${L.idA} ${L.title}</option>`;
  });
  $('lsn').innerHTML = html + '</optgroup>';
}
function render(){
  const L = D[li];
  $('mSep').setAttribute('aria-pressed', mode==='sep'); $('mCmb').setAttribute('aria-pressed', mode==='cmb');
  $('now').textContent = mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم جميع حصصه';
  const tabs = $('tabs'); tabs.innerHTML = '';
  if (mode==='sep'){
    L.periods.forEach((p,i) => { const b = document.createElement('button'); b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===pi);
      b.textContent = 'الحصة ' + AD(i+1); b.onclick = () => { pi = i; render(); }; tabs.appendChild(b); });
  }
  const P = L.periods[pi];
  $('meta').innerHTML = `<div class="t">${L.idA} ${L.title}</div><div class="g"><span><b>الوحدة:</b> ${L.unit}</span><span><b>${L.week}</b> (${L.dates})</span>
   <span><b>كتاب الطالب:</b> ص ${L.st}</span><span><b>كتاب النشاط:</b> ص ${L.ac}</span><span><b>دليل المعلم:</b> ص ${L.tb}</span>
   <span><b>${mode==='sep' ? 'الحصة ' + AD(pi+1) + ' من ' + AD(L.periods.length) : 'عدد الحصص: ' + AD(L.periods.length)}</b></span></div>
   ${mode==='sep' ? `<div><b>محور الحصة:</b> ${P.axis}</div>` : ''}`;
  let out = '';
  for (let f = 0; f < 10; f++){
    let body;
    if (mode==='sep') body = P.html[f];
    else body = L.periods.map((p,i) => `<div class="ph">الحصة ${AD(i+1)}: ${p.axis}</div>${p.html[f]}`).join('');
    out += `<article class="card c${f+1}"><header><span class="n">${AD(f+1)}</span><h2>${NAMES[f]}</h2><button class="copy" data-f="${f}">نسخ</button></header><div class="body" id="b${f}">${body}</div></article>`;
  }
  $('cards').innerHTML = out;
  document.querySelectorAll('.copy').forEach(b => b.onclick = () => copyField(+b.dataset.f, b));
}
function fieldText(f){
  const L = D[li];
  if (mode==='sep') return L.periods[pi].txt[f];
  return L.periods.map((p,i) => `الحصة ${AD(i+1)}: ${p.axisT}\n${p.txt[f]}`).join('\n\n');
}
function flash(b){ b.textContent = 'تم النسخ ✓'; b.classList.add('done'); setTimeout(() => { b.textContent = 'نسخ'; b.classList.remove('done'); }, 1800); }
function legacyCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; ta.style.top='0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta); return ok;
}
function fallback(f){
  const el = $('b'+f), r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r); el.classList.add('sel');
  const t = $('toast'); t.textContent = 'تعذّر النسخ التلقائي في هذا المتصفح؛ النص محدد الآن، انسخه يدويًا (مطوّل الضغط ثم «نسخ»).';
  t.style.display = 'block'; setTimeout(() => { t.style.display='none'; el.classList.remove('sel'); }, 4500);
}
async function copyField(f, b){
  const t = fieldText(f);
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); flash(b); return; } } catch(e) {}
  if (legacyCopy(t)) flash(b); else fallback(f);
}
$('mSep').onclick = () => { mode='sep'; render(); };
$('mCmb').onclick = () => { mode='cmb'; pi = 0; render(); };
$('lsn').onchange = e => { li = +e.target.value; pi = 0; render(); };
fillLessons(); render();
</script>
