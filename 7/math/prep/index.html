:root{--ink:#24323f;--soft:#5b7488;--line:#dbe6ec;--sky:#eaf3f8;--sky2:#f5f9fc;--mint:#edf6ef;--sand:#f7f1e3;--lilac:#f1eef8;--rose:#fbefed;--teal:#eef5f4;--acc:#2b6f94;--ok:#3d8a5a}
*{box-sizing:border-box}
html,body{margin:0;background:#f7fafb;color:var(--ink);font-family:Plex,system-ui,sans-serif;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.35rem;margin:0 0 2px;color:#2b5875}
.sub{color:var(--soft);font-size:.92rem;margin-bottom:14px}
.mode{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.seg{display:flex;background:var(--sky);border-radius:12px;padding:4px;gap:4px;max-width:480px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;color:var(--soft);padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(43,88,117,.15)}
.explain{font-size:.88rem;color:var(--soft);margin:9px 0 6px}
.explain b{color:var(--ink)}
.now{display:inline-block;background:#fdf3df;border:1px solid #edd6a6;color:#6d5118;border-radius:10px;padding:4px 12px;font-weight:700;font-size:.92rem}
.pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pick label{font-weight:700;color:#2b5875}
select{font:inherit;padding:7px 10px;border:1px solid #c9dbe6;border-radius:10px;background:#fff;color:var(--ink);min-width:260px;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.tabs button{font:inherit;border:1px solid #c9dbe6;background:#fff;color:var(--acc);border-radius:20px;padding:4px 14px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.meta{background:var(--sky2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}
.meta .t{font-weight:700;font-size:1.08rem;color:#2b5875}
.meta .g{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px;color:var(--soft)}
.meta .g b{color:var(--ink);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.card header h2{flex:1;margin:0;font-size:1rem;color:#2f4d63}
.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #b9cfdc;font-size:.85rem}
.c1 header,.c2 header{background:var(--sky)}.c3 header,.c4 header{background:var(--mint)}.c5 header,.c6 header{background:var(--sand)}
.c7 header{background:var(--lilac)}.c8 header,.c9 header{background:var(--rose)}.c10 header{background:var(--teal)}
.copy{font:inherit;font-weight:700;font-size:.9rem;border:1px solid #9cc2d8;background:#fff;color:var(--acc);border-radius:10px;padding:5px 16px;cursor:pointer;min-width:112px}
.copy.done{background:#e9f6ee;border-color:#9fd0b0;color:var(--ok)}
.body{padding:10px 14px}
.body p{margin:4px 0}
.body ol{margin:2px 0;padding-right:20px;list-style-type:arabic-indic}
.chip{display:inline-block;background:var(--sky2);border:1px solid #d4e4ee;border-radius:14px;padding:1px 10px;margin:2px 0 2px 6px;font-size:.92rem}
.ex{border-top:1px dashed var(--line);padding-top:4px}
.step{display:flex;gap:10px;border-bottom:1px dashed #e4e0f0;padding:6px 0}
.step .tm{flex:0 0 auto;background:var(--lilac);color:#4a4270;border-radius:8px;padding:2px 8px;font-weight:700;height:fit-content;white-space:nowrap}
.step p{margin:2px 0;font-size:.95rem}.step em{font-style:normal;color:#6b6790;font-weight:700}
.sum{color:#6b6790;font-size:.85rem}
.tier{display:inline-block;font-size:.78rem;font-weight:700;border-radius:10px;padding:0 8px;margin-left:6px;border:1px solid}
.t0{background:#eef7f0;color:#3b7a4c;border-color:#c8e3cf}.t1{background:#eef4fb;color:#2f5f8a;border-color:#c9dbee}.t2{background:#fbf2e6;color:#8a5a1f;border-color:#ecd5b3}
.ans{color:var(--soft);font-size:.92rem}
.ph{font-weight:700;color:#2b5875;background:var(--sky2);border-radius:8px;padding:2px 10px;margin:10px 0 4px;display:inline-block}
.ph:first-child{margin-top:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.05;margin:0 2px}
.fr span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
sup{font-size:.7em;line-height:0}
.toast{position:fixed;bottom:16px;right:50%;transform:translateX(50%);background:#fff;border:1px solid #edd6a6;color:#6d5118;border-radius:12px;padding:8px 14px;font-size:.9rem;display:none;max-width:92vw}
.sel{outline:2px solid #edd6a6;border-radius:6px}
button:focus-visible,select:focus-visible{outline:3px solid #9cc2d8;outline-offset:2px}
@media (max-width:600px){select{min-width:100%}.copy{min-width:96px;padding:5px 10px}}
</style>

<script>
const D = [{"idA": "١-١", "title": "العمليات الحسابية على الأعداد الصحيحة", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "st": "١٦–٢١", "ac": "١٣–١٤", "tb": "٢٠–٢٢", "week": "الأسبوع الأول", "dates": "٦–١٠/٩/٢٠٢٦م", "periods": [{"axis": "جمع الأعداد الصحيحة وطرحها (١-١أ)", "axisT": "جمع الأعداد الصحيحة وطرحها (١-١أ)", "html": ["<ol><li>يجمع عددين صحيحين موجبين أو سالبين باستخدام خط الأعداد.</li><li>يحوّل طرح عدد صحيح سالب إلى جمع معكوسه الجمعي ويحسب الناتج.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يحل مسألة حياتية عن تغيّر درجات الحرارة باستخدام جمع الأعداد الصحيحة وطرحها.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: فهم</span><span class=\"chip\">المخرج الآخر: تطبيق</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: خط أعداد مرسوم على أرضية الصف</span>", "<span class=\"chip\">العدد الصحيح</span><span class=\"chip\">العدد الموجب</span><span class=\"chip\">العدد السالب</span><span class=\"chip\">المعكوس الجمعي</span><span class=\"chip\">خط الأعداد</span>", "<p>عرض صورة مقياس حرارة يشير إلى -٣ درجات في جبل شمس فجرًا، وسؤال: إذا ارتفعت الحرارة ٥ درجات فكم تصبح؟ ثم تحديد مواقع الأعداد -٤، ٠، ٣ على خط الأعداد.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يعرض صورة مقياس الحرارة ويطرح سؤال الارتفاع والانخفاض.</p><p><em>الطالب:</em> يحدد الحرارة الجديدة بالتحرك على خط أعداد مرسوم على الأرض.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>النشاط ١: اكتشاف النمط</b><p><em>المعلم:</em> يكتب عمود الطرح: ٤ - ٣، ٤ - ٢، ٤ - ١، ٤ - ٠، ويطلب إكمال النمط إلى ٤ - (-١)، ٤ - (-٢).</p><p><em>الطالب:</em> يلاحظ أن الناتج يزيد ١ كلما نقص المطروح ١، ويستنتج أن طرح العدد السالب يكافئ جمع العدد الموجب المقابل.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج حل أمثلة ص ١٦: -٦ + ٤، ٣ - ٨، -٢ - (-٧) مع التفكير بصوت مرتفع.</p><p><em>الطالب:</em> يتابع خطوات الحل ويصوغ القاعدة بلغته في الدفتر.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>التدريب التعاوني</b><p><em>المعلم:</em> يوزع تمارين ١-١أ في كتاب الطالب على مجموعات رباعية ويتابع الأخطاء الشائعة.</p><p><em>الطالب:</em> يحل التمارين داخل المجموعة ويتحقق كل طالب من حل زميله على خط الأعداد.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يطرح بطاقة خروج: احسب -٥ - (-٩).</p><p><em>الطالب:</em> يكتب الناتج ويشرح طريقته في سطر واحد.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: -٤ + ٧<div class=\"ans\">الإجابة: ٣</div></li><li><span class=\"tier t1\">متوقع</span>احسب: ٦ - (-٩)<div class=\"ans\">الإجابة: ١٥</div></li><li><span class=\"tier t2\">متقدم</span>كانت درجة الحرارة -٥ ثم انخفضت ٨ درجات. كم أصبحت؟<div class=\"ans\">الإجابة: -١٣</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: ٢ - ٩<div class=\"ans\">الإجابة: -٧</div></li><li><span class=\"tier t1\">متوقع</span>احسب: -٨ - (-٣)<div class=\"ans\">الإجابة: -٥</div></li><li><span class=\"tier t2\">متقدم</span>أوجد العدد المفقود: ... - (-٦) = ٢<div class=\"ans\">الإجابة: -٤</div></li></ol>", "<p>للطالب: حل تمارين جمع الأعداد الصحيحة وطرحها في كتاب النشاط ص ١٣. لولي الأمر: تدريب الابن على أمثلة من الحياة مثل درجات الحرارة تحت الصفر.</p>"], "txt": ["١. يجمع عددين صحيحين موجبين أو سالبين باستخدام خط الأعداد.\n٢. يحوّل طرح عدد صحيح سالب إلى جمع معكوسه الجمعي ويحسب الناتج.\nمخرج تعليمي آخر: يحل مسألة حياتية عن تغيّر درجات الحرارة باستخدام جمع الأعداد الصحيحة وطرحها.", "المخرج ١: تطبيق\nالمخرج ٢: فهم\nالمخرج الآخر: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: خط أعداد مرسوم على أرضية الصف", "العدد الصحيح، العدد الموجب، العدد السالب، المعكوس الجمعي، خط الأعداد", "عرض صورة مقياس حرارة يشير إلى -٣ درجات في جبل شمس فجرًا، وسؤال: إذا ارتفعت الحرارة ٥ درجات فكم تصبح؟ ثم تحديد مواقع الأعداد -٤، ٠، ٣ على خط الأعداد.", "(٥ د) التهيئة\nدور المعلم: يعرض صورة مقياس الحرارة ويطرح سؤال الارتفاع والانخفاض.\nدور الطالب: يحدد الحرارة الجديدة بالتحرك على خط أعداد مرسوم على الأرض.\n\n(١٠ د) النشاط ١: اكتشاف النمط\nدور المعلم: يكتب عمود الطرح: ٤ - ٣، ٤ - ٢، ٤ - ١، ٤ - ٠، ويطلب إكمال النمط إلى ٤ - (-١)، ٤ - (-٢).\nدور الطالب: يلاحظ أن الناتج يزيد ١ كلما نقص المطروح ١، ويستنتج أن طرح العدد السالب يكافئ جمع العدد الموجب المقابل.\n\n(٨ د) النمذجة\nدور المعلم: ينمذج حل أمثلة ص ١٦: -٦ + ٤، ٣ - ٨، -٢ - (-٧) مع التفكير بصوت مرتفع.\nدور الطالب: يتابع خطوات الحل ويصوغ القاعدة بلغته في الدفتر.\n\n(١٢ د) التدريب التعاوني\nدور المعلم: يوزع تمارين ١-١أ في كتاب الطالب على مجموعات رباعية ويتابع الأخطاء الشائعة.\nدور الطالب: يحل التمارين داخل المجموعة ويتحقق كل طالب من حل زميله على خط الأعداد.\n\n(٥ د) الغلق\nدور المعلم: يطرح بطاقة خروج: احسب -٥ - (-٩).\nدور الطالب: يكتب الناتج ويشرح طريقته في سطر واحد.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) احسب: -٤ + ٧\nالإجابة: ٣\n٢. (متوقع) احسب: ٦ - (-٩)\nالإجابة: ١٥\n٣. (متقدم) كانت درجة الحرارة -٥ ثم انخفضت ٨ درجات. كم أصبحت؟\nالإجابة: -١٣", "١. (دعم) احسب: ٢ - ٩\nالإجابة: -٧\n٢. (متوقع) احسب: -٨ - (-٣)\nالإجابة: -٥\n٣. (متقدم) أوجد العدد المفقود: ... - (-٦) = ٢\nالإجابة: -٤", "للطالب: حل تمارين جمع الأعداد الصحيحة وطرحها في كتاب النشاط ص ١٣. لولي الأمر: تدريب الابن على أمثلة من الحياة مثل درجات الحرارة تحت الصفر."]}, {"axis": "ضرب الأعداد الصحيحة وقسمتها (١-١ب)", "axisT": "ضرب الأعداد الصحيحة وقسمتها (١-١ب)", "html": ["<ol><li>يستنتج قاعدة إشارة ناتج ضرب عددين صحيحين من نمط في جدول الضرب.</li><li>يقسم عددًا صحيحًا على آخر مستفيدًا من أن القسمة عملية عكسية للضرب.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يتحقق من ناتج قسمة الأعداد الصحيحة باستخدام عملية الضرب العكسية.</p>", "<span class=\"chip\">المخرج ١: فهم</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: تقييم</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: بطاقات إشارات (+ و -)</span>", "<span class=\"chip\">ناتج الضرب</span><span class=\"chip\">الإشارات المتشابهة</span><span class=\"chip\">الإشارات المختلفة</span><span class=\"chip\">العملية العكسية</span>", "<p>مراجعة سريعة لجمع الأعداد الصحيحة وطرحها بسؤالين شفهيين (-٣ + ٨، ٢ - (-٥))، ثم سؤال: ما ناتج ٣ × ٤؟ وماذا نتوقع لناتج ٣ × (-٤)؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح سؤالي المراجعة ثم يثير التوقع حول ٣ × (-٤).</p><p><em>الطالب:</em> يجيب شفهيًا ويسجل توقعه.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>النشاط ٢: نمط الضرب</b><p><em>المعلم:</em> يكتب العمود ٣ × ٣، ٣ × ٢، ٣ × ١، ٣ × ٠ ويطلب متابعة النمط إلى ٣ × (-١)، ٣ × (-٢)، ثم نمطًا ثانيًا يبدأ بـ (-٣) × ٢.</p><p><em>الطالب:</em> يكمل النمطين ويستنتج: إشارتان متشابهتان ← موجب، إشارتان مختلفتان ← سالب.</p></div></div><div class=\"step\"><span class=\"tm\">٧ د</span><div><b>العلاقة بين الضرب والقسمة</b><p><em>المعلم:</em> يكتب -١٢ ÷ ٣ = -٤ لأن -٤ × ٣ = -١٢، ويطلب أمثلة مشابهة.</p><p><em>الطالب:</em> يعيد كتابة عمليات ضرب على صورة قسمة ويتحقق منها.</p></div></div><div class=\"step\"><span class=\"tm\">١٣ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بحل تمارين ١-١ب من كتاب الطالب فرديًا ثم مقارنة الحلول ثنائيًا.</p><p><em>الطالب:</em> يحل التمارين ويبرر إشارة كل ناتج لزميله.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يرفع بطاقة عملية ويطلب رفع بطاقة الإشارة الصحيحة للناتج فقط.</p><p><em>الطالب:</em> يرفع بطاقة (+) أو (-) بسرعة.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: (-٦) × ٤<div class=\"ans\">الإجابة: -٢٤</div></li><li><span class=\"tier t1\">متوقع</span>احسب: (-٣٥) ÷ (-٧)<div class=\"ans\">الإجابة: ٥</div></li><li><span class=\"tier t2\">متقدم</span>أكمل: ... × (-٨) = ٥٦<div class=\"ans\">الإجابة: -٧</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: ٥ × (-٣)<div class=\"ans\">الإجابة: -١٥</div></li><li><span class=\"tier t1\">متوقع</span>احسب: ٤٨ ÷ (-٦)<div class=\"ans\">الإجابة: -٨</div></li><li><span class=\"tier t2\">متقدم</span>أوجد العدد: إذا قسمته على -٤ كان الناتج ٩<div class=\"ans\">الإجابة: -٣٦</div></li></ol>", "<p>للطالب: حل تمارين ضرب الأعداد الصحيحة وقسمتها في كتاب النشاط ص ١٤. لولي الأمر: مراجعة قاعدة الإشارات مع الابن بأسئلة شفهية قصيرة.</p>"], "txt": ["١. يستنتج قاعدة إشارة ناتج ضرب عددين صحيحين من نمط في جدول الضرب.\n٢. يقسم عددًا صحيحًا على آخر مستفيدًا من أن القسمة عملية عكسية للضرب.\nمخرج تعليمي آخر: يتحقق من ناتج قسمة الأعداد الصحيحة باستخدام عملية الضرب العكسية.", "المخرج ١: فهم\nالمخرج ٢: تطبيق\nالمخرج الآخر: تقييم", "التعلم بالاكتشاف، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات إشارات (+ و -)", "ناتج الضرب، الإشارات المتشابهة، الإشارات المختلفة، العملية العكسية", "مراجعة سريعة لجمع الأعداد الصحيحة وطرحها بسؤالين شفهيين (-٣ + ٨، ٢ - (-٥))، ثم سؤال: ما ناتج ٣ × ٤؟ وماذا نتوقع لناتج ٣ × (-٤)؟", "(٥ د) التهيئة\nدور المعلم: يطرح سؤالي المراجعة ثم يثير التوقع حول ٣ × (-٤).\nدور الطالب: يجيب شفهيًا ويسجل توقعه.\n\n(١٠ د) النشاط ٢: نمط الضرب\nدور المعلم: يكتب العمود ٣ × ٣، ٣ × ٢، ٣ × ١، ٣ × ٠ ويطلب متابعة النمط إلى ٣ × (-١)، ٣ × (-٢)، ثم نمطًا ثانيًا يبدأ بـ (-٣) × ٢.\nدور الطالب: يكمل النمطين ويستنتج: إشارتان متشابهتان ← موجب، إشارتان مختلفتان ← سالب.\n\n(٧ د) العلاقة بين الضرب والقسمة\nدور المعلم: يكتب -١٢ ÷ ٣ = -٤ لأن -٤ × ٣ = -١٢، ويطلب أمثلة مشابهة.\nدور الطالب: يعيد كتابة عمليات ضرب على صورة قسمة ويتحقق منها.\n\n(١٣ د) التدريب\nدور المعلم: يكلف بحل تمارين ١-١ب من كتاب الطالب فرديًا ثم مقارنة الحلول ثنائيًا.\nدور الطالب: يحل التمارين ويبرر إشارة كل ناتج لزميله.\n\n(٥ د) الغلق\nدور المعلم: يرفع بطاقة عملية ويطلب رفع بطاقة الإشارة الصحيحة للناتج فقط.\nدور الطالب: يرفع بطاقة (+) أو (-) بسرعة.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) احسب: (-٦) × ٤\nالإجابة: -٢٤\n٢. (متوقع) احسب: (-٣٥) ÷ (-٧)\nالإجابة: ٥\n٣. (متقدم) أكمل: ... × (-٨) = ٥٦\nالإجابة: -٧", "١. (دعم) احسب: ٥ × (-٣)\nالإجابة: -١٥\n٢. (متوقع) احسب: ٤٨ ÷ (-٦)\nالإجابة: -٨\n٣. (متقدم) أوجد العدد: إذا قسمته على -٤ كان الناتج ٩\nالإجابة: -٣٦", "للطالب: حل تمارين ضرب الأعداد الصحيحة وقسمتها في كتاب النشاط ص ١٤. لولي الأمر: مراجعة قاعدة الإشارات مع الابن بأسئلة شفهية قصيرة."]}, {"axis": "تطبيقات على العمليات الأربع في الأعداد الصحيحة", "axisT": "تطبيقات على العمليات الأربع في الأعداد الصحيحة", "html": ["<ol><li>يختار العملية المناسبة لحل مسائل كلامية تتضمن أعدادًا صحيحة.</li><li>يميز بين قواعد الجمع والطرح وقواعد الضرب والقسمة في الأعداد الصحيحة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يكوّن مسألة كلامية بنفسه ناتجها عدد صحيح سالب.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: إبداع</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على اللعب</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">العمليات الأربع</span><span class=\"chip\">العدد الصحيح</span><span class=\"chip\">المسألة الكلامية</span>", "<p>لعبة «صح أم خطأ» سريعة: -٣ × -٢ = -٦، ٥ - (-١) = ٦، -١٠ ÷ ٢ = -٥؛ يرفع الطلاب أيديهم ويصححون الخطأ.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يدير لعبة «صح أم خطأ» على ثلاث عبارات.</p><p><em>الطالب:</em> يحكم على العبارات ويصحح الخاطئة.</p></div></div><div class=\"step\  "١. (دعم) هل ٧ عامل للعدد ٤٢؟\nالإجابة: نعم، ٤٢ ÷ ٧ = ٦ بلا باقٍ\n٢. (متوقع) أوجد ع م ك للعددين ٢٤ و ٣٦\nالإجابة: ١٢\n٣. (متقدم) عددان ع م ك لهما ١، اكتب مثالًا عليهما\nالإجابة: ٨ و ١٥ (أي عددين لا عامل مشترك لهما غير ١)", "للطالب: كتابة عوامل الأعداد ٢٠، ٢٨، ٣٦ في الدفتر ومراجعة أمثلة ص ٢٤. لولي الأمر: مساعدة الابن على ترتيب أشياء (أقلام أو حبات تمر) في صفوف متساوية لاكتشاف العوامل."]}, {"axis": "اختبارات قابلية القسمة", "axisT": "اختبارات قابلية القسمة", "html": ["<ol><li>يطبق اختبارات قابلية القسمة على ٢، ٣، ٤، ٥، ٦، ٨، ٩، ١٠.</li><li>يستخدم اختبارات قابلية القسمة لتحديد عوامل الأعداد الكبيرة بسرعة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يبرر صحة اختبار القسمة على ٩ من خلال مجموع الأرقام لعدة أمثلة.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: تقييم</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">جهاز عرض البيانات</span>", "<span class=\"chip\">قابلية القسمة</span><span class=\"chip\">مجموع الأرقام</span><span class=\"chip\">الباقي</span><span class=\"chip\">العامل</span>", "<p>سؤال تحدٍّ: هل يمكن توزيع ١٢٣٦ قلمًا على ٣ طلاب بالتساوي دون إجراء القسمة؟ يستمع المعلم إلى التخمينات.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح سؤال التحدي ويسجل التخمينات.</p><p><em>الطالب:</em> يقترح طرقًا للحكم دون قسمة.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>اكتشاف الاختبارات</b><p><em>المعلم:</em> يعرض جدول اختبارات القسمة من كتاب الطالب ويوزع على كل مجموعة اختبارين لاكتشاف قاعدتهما بأمثلة.</p><p><em>الطالب:</em> تختبر كل مجموعة أعدادًا وتصوغ القاعدة وتعرضها.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج تطبيق الاختبارات على ١٢٣٦ و ٧٥٦٠ بالترتيب.</p><p><em>الطالب:</em> يسجل نتيجة كل اختبار في جدول.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>التدريب الذاتي</b><p><em>المعلم:</em> يكلف بتمارين قابلية القسمة في الدرس ١-٣.</p><p><em>الطالب:</em> يطبق الاختبارات ويتحقق بالقسمة لعدد واحد.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يكتب العدد ٤ _ ٢ ويطلب رقمًا يجعله يقبل القسمة على ٣.</p><p><em>الطالب:</em> يقترح الأرقام ٠ أو ٣ أو ٦ أو ٩ ويبرر.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>هل يقبل ٧٣٥ القسمة على ٥؟ لماذا؟<div class=\"ans\">الإجابة: نعم، لأن آحاده ٥</div></li><li><span class=\"tier t1\">متوقع</span>هل يقبل ٢٣٤٦ القسمة على ٦؟<div class=\"ans\">الإجابة: نعم، زوجي ومجموع أرقامه ١٥ يقبل القسمة على ٣</div></li><li><span class=\"tier t2\">متقدم</span>اكتب أصغر عدد من أربعة أرقام يقبل القسمة على ٩<div class=\"ans\">الإجابة: ١٠٠٨</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>هل يقبل ٤١٢ القسمة على ٤؟<div class=\"ans\">الإجابة: نعم، لأن ١٢ تقبل القسمة على ٤</div></li><li><span class=\"tier t1\">متوقع</span>أي الأعداد ٢, ٣, ٥, ٩, ١٠ تقسم ٣٣٣٠؟<div class=\"ans\">الإجابة: جميعها</div></li><li><span class=\"tier t2\">متقدم</span>أكمل الرقم الناقص ليقبل ٧ _ ٤ القسمة على ٩<div class=\"ans\">الإجابة: ٧ (العدد ٧٧٤)</div></li></ol>", "<p>للطالب: حل تمارين قابلية القسمة في كتاب النشاط ص ١٦. لولي الأمر: سؤال الابن عن أرقام لوحات السيارات: هل تقبل القسمة على ٣ أو ٩؟</p>"], "txt": ["١. يطبق اختبارات قابلية القسمة على ٢، ٣، ٤، ٥، ٦، ٨، ٩، ١٠.\n٢. يستخدم اختبارات قابلية القسمة لتحديد عوامل الأعداد الكبيرة بسرعة.\nمخرج تعليمي آخر: يبرر صحة اختبار القسمة على ٩ من خلال مجموع الأرقام لعدة أمثلة.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تقييم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، جهاز عرض البيانات", "قابلية القسمة، مجموع الأرقا /span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على حل المشكلات</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: بطاقات الأعداد ١–٢٠ (ورقة المصادر)</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">العوامل</span><span class=\"chip\">العامل المشترك الأكبر</span><span class=\"chip\">قابلية القسمة</span><span class=\"chip\">الاستراتيجية</span>", "<p>مراجعة بطاقات: يعرض المعلم أعدادًا (٢٤، ٤٥، ٦٠) ويطلب ذكر ثلاثة عوامل لكل منها خلال ١٠ ثوانٍ.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يعرض الأعداد ويطلب ذكر عواملها بسرعة.</p><p><em>الطالب:</em> يذكر العوامل شفهيًا.</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>نشاط لعبة العوامل</b><p><em>المعلم:</em> يشرح قواعد اللعبة الثنائية: يختار الطالب (أ) عددًا له عامل على الطاولة، ويأخذ (ب) جميع عوامله المتبقية، ثم يُجمع المجموع.</p><p><em>الطالب:</em> يلعب الطالبان جولتين بتبادل الأدوار ويحسبان المجموع.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>مناقشة الاستراتيجية</b><p><em>المعلم:</em> يسأل: أي الأعداد أفضل للبدء؟ لماذا تجنُّب الأعداد التي لها عوامل كثيرة؟</p><p><em>الطالب:</em> يقترح استراتيجيات ويبررها.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>مسائل تطبيقية</b><p><em>المعلم:</em> يكلف بمسائل كتاب النشاط ص ١٧ (تقطيع شرائط وتكوين مجموعات متساوية).</p><p><em>الطالب:</em> يحل المسائل في مجموعات ويعرض حلًا.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يطرح مسألة: ٢٤ قلمًا و ٣٦ دفترًا توزع في أكبر عدد من الحقائب المتماثلة.</p><p><em>الطالب:</em> يجد ع م ك = ١٢ حقيبة.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>اذكر عاملين للعدد ٣٠ أكبر من ٥<div class=\"ans\">الإجابة: ٦ و ١٠ (أو ١٥ أو ٣٠)</div يحسبها ويحصل على النقاط.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين ١-٧ من كتاب الطالب ص ٣٦.</p><p><em>الطالب:</em> يحل ويقارن مع زميله.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يطلب وضع أقواس في ٦ + ٤ × ٥ - ٢ ليصبح الناتج ٤٨.</p><p><em>الطالب:</em> يكتب (٦ + ٤) × ٥ - ٢ ويتحقق: ١٠ × ٥ - ٢ = ٤٨.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: ٥ + ٣ × ٢<div class=\"ans\">الإجابة: ١١</div></li><li><span class=\"tier t1\">متوقع</span>احسب: (١٢ - ٤) ÷ ٢ + ٣<sup>٢</sup><div class=\"ans\">الإجابة: ١٣</div></li><li><span class=\"tier t2\">متقدم</span>ضع أقواسًا لجعل ٨ - ٣ × ٢ + ١ = ١٥<div class=\"ans\">الإجابة: (٨ - ٣) × (٢ + ١)</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: ٢٠ - ١٢ ÷ ٤<div class=\"ans\">الإجابة: ١٧</div></li><li><span class=\"tier t1\">متوقع</span>احسب: ٢ × (٣ + ٥)<sup>٢</sup> - ١٠<div class=\"ans\">الإجابة: ١١٨</div></li><li><span class=\"tier t2\">متقدم</span>حل أحمد ١٨ - ٦ ÷ ٣ فكتب ٤. صحح الخطأ ووضح<div class=\"ans\">الإجابة: الصحيح ١٦ لأن القسمة قبل الطرح: ١٨ - ٢</div></li></ol>", "<p>للطالب: حل تمارين ترتيب العمليات في كتاب النشاط ص ٢٥ ومراجعة تمارين ومسائل عامة للوحدة ص ٣٧. لولي الأمر: التأكد من أن الابن يكتب خطوات الحل بالترتيب ولا يكتفي بالناتج.</p>"], "txt": ["١. يطبق ترتيب العمليات الحسابية (الأقواس، القوى، الضرب والقسمة، الجمع والطرح) لحساب قيمة عبارة عددية.\n٢. يضع الأقواس في عبارة عددية لتعطي ناتجًا محددًا.\nمخرج تعليمي آخر: يكتشف خطأً في حل منشور لعبارة عددية ويصححه مع التبرير.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تقييم", "التعلم المبني على اللعب، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: أحجار نرد", "ترتيب العمليات، الأقواس، القوى، العبارة العددية", "سؤال جدلي: كم ناتج ٣ + ٤ × ٢؟ تقول مجموعة ١٤ وأخرى ١١. من على حق؟ ولماذا؟", "(٥ د) التهيئة\nدور المعلم: يطرح السؤال الجدلي ويستقبل الحجج.\nدور الطالب: يدافع عن إجابته.\n\n(١٠ د) النمذجة\nدور المعلم: يقدم ترتيب العمليات وينمذج: ٢٠ - ٣ × ٤، (٢٠ - ٣) × ٤، ٢ × ٣^٢، ١٨ ÷ (٦ - ٣) + ١.\nدور الطالب: يحل الأمثلة خطوة بخطوة مع تحديد العملية ذات الأولوية.\n\n(١٢ د) نشاط النرد\nدور المعلم: ينظم لعبة ثنائية: يرمي الطالب ثلاثة أحجار نرد ويكوّن عبارة باستخدام الأقواس والعمليات للاقتراب من عدد هدف.\nدور الطالب: يكون العبارات ويحسبها ويحصل على النقاط.\n\n(٨ د) التدريب\nدور المعلم: يكلف بتمارين ١-٧ من كتاب الطالب ص ٣٦.\nدور الطالب: يحل ويقارن مع زميله.\n\n(٥ د) الغلق\nدور المعلم: يطلب وضع أقواس في ٦ + ٤ × ٥ - ٢ ليصبح الناتج ٤٨.\nدور الطالب: يكتب (٦ + ٤) × ٥ - ٢ ويتحقق: ١٠ × ٥ - ٢ = ٤٨.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) احسب: ٥ + ٣ × ٢\nالإجابة: ١١\n٢. (متوقع) احسب: (١٢ - ٤) ÷ ٢ + ٣^٢\nالإجابة: ١٣\n٣. (متقدم) ضع أقواسًا لجعل ٨ - ٣ × ٢ + ١ = ١٥\nالإجابة: (٨ - ٣) × (٢ + ١)", "١. (دعم) احسب: ٢٠ - ١٢ ÷ ٤\nالإجابة: ١٧\n٢. (متوقع) احسب: ٢ × (٣ + ٥)^٢ - ١٠\nالإجابة: ١١٨\n٣. (متقدم) حل أحمد ١٨ - ٦ ÷ ٣ فكتب ٤. صحح الخطأ ووضح\nالإجابة: الصحيح ١٦ لأن القسمة قبل الطرح: ١٨ - ٢", "للطالب: حل تمارين ترتيب العمليات في كتاب النشاط ص ٢٥ ومراجعة تمارين ومسائل عامة للوحدة ص ٣٧. لولي الأمر: التأكد من أن الابن يكتب خطوات الحل بالترتيب ولا يكتفي بالناتج."]}]}, {"idA": "٢-١", "title": "كتابة العبارات الجبرية", "unit": "الوحدة الثانية: العبارات الجبرية والمعادلات والصيغ", "st": "٤٠–٤٢", "ac": "٢٦–٢٨", "tb": "٤٦", "week": "الأسبوع الثالث", "dates": "٢٠–٢٤/٩/٢٠٢٦م", "periods": [{"axis": "استخدام الحروف لتمثيل الأعداد المجهولة", "axisT": "استخدام الحروف لتمثيل الأعداد المجهولة", "html": ["<ol><li>يستخدم حرفًا (متغيرًا) لتمثيل عدد مجهول في موقف معطى.</li><li>يكتب عبارة جبرية بسيطة تتضمن عملية واحدة مثل س + ٥ أو ٣س.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يصف بالكلمات عبارة جبرية معطاة بأكثر من صياغة.</p>", "<span class=\"chip\">المخرج ١: فهم</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: فهم</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"ch span class=\"tm\">١٠ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج ترجمة: «اطرح ٣ من ضعف عدد» ← ٢س - ٣، «اقسم عددًا على ٤ ثم أضف ١» ← س/٤ + ١.</p><p><em>الطالب:</em> يكتب الترجمات ويفسر سبب الترتيب.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>نشاط بطاقات المطابقة</b><p><em>المعلم:</em> يوزع على المجموعات بطاقات عبارات لفظية وأخرى جبرية للمطابقة.</p><p><em>الطالب:</em> تطابق المجموعة البطاقات وتبرر المطابقات الصعبة.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين ترجمة العبارات في الدرس ٢-١.</p><p><em>الطالب:</em> يحل فرديًا.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يعرض ترجمة خاطئة: «٤ أقل من س» = ٤ - س، ويطلب التصحيح.</p><p><em>الطالب:</em> يصحح إلى س - ٤.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>اكتب عبارة: عدد مطروحًا منه ٦<div class=\"ans\">الإجابة: س - ٦</div></li><li><span class=\"tier t1\">متوقع</span>اكتب عبارة: ربع عدد مضافًا إليه ٣<div class=\"ans\">الإجابة: س/٤ + ٣</div></li><li><span class=\"tier t2\">متقدم</span>ترجم: اطرح ضعف عدد من ٢٠<div class=\"ans\">الإجابة: ٢٠ - ٢س</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>اكتب عبارة: ٨ أكثر من عدد<div class=\"ans\">الإجابة: س + ٨</div></li><li><span class=\"tier t1\">متوقع</span>اكتب عبارة: اضرب عددًا في ٥ ثم اطرح ٢<div class=\"ans\">الإجابة: ٥س - ٢</div></li><li><span class=\"tier t2\">متقدم</span>ترجم مريم «٧ أقل من نصف عدد» إلى ٧ - س/٢. هل هي محقة؟ صحح<div class=\"ans\">الإجابة: لا، الصحيح س/٢ - ٧</div></li></ol>", "<p>للطالب: حل تمارين الترجمة في كتاب النشاط ص ٢٧. لولي الأمر: أن يكتب الابن عبارة جبرية لموقف من البيت (مثل مصروفه الأسبوعي).</p>"], "txt": ["١. يكتب عبارة جبرية من وصف لفظي يتضمن عمليتين.\n٢. يراعي ترتيب الحدود في عمليتي الطرح والقسمة عند الترجمة.\nمخرج تعليمي آخر: يكشف الخطأ في ترجمة جملة لفظية إلى عبارة جبرية ويصححه.", "المخرج ١: تطبيق\nالمخرج ٢: تحليل\nالمخرج الآخر: تقييم", "التعلم التعاوني، التعلم المبني على اللعب، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات مطابقة (عبارة لفظية ↔ عبارة جبرية)", "العبارة الجبرية، العبارة اللفظية، ترتيب الحدود", "سؤال: هل «٥ أقل من عدد» هي ٥ - س أم س - ٥؟ يصوت الطلاب ثم يجربون بعدد معلوم (س = ١٢).", "(٥ د) التهيئة\nدور المعلم: يطرح سؤال التصويت ويطلب التجربة بعدد معلوم.\nدور الطالب: يكتشف أن الصحيح س - ٥.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج ترجمة: «اطرح ٣ من ضعف عدد» ← ٢س - ٣، «اقسم عددًا على ٤ ثم أضف ١» ← س/٤ + ١.\nدور الطالب: يكتب الترجمات ويفسر سبب الترتيب.\n\n(١٢ د) نشاط بطاقات المطابقة\nدور المعلم: يوزع على المجموعات بطاقات عبارات لفظية وأخرى جبرية للمطابقة.\nدور الطالب: تطابق المجموعة البطاقات وتبرر المطابقات الصعبة.\n\n(٨ د) التدريب\nدور المعلم: يكلف بتمارين ترجمة العبارات في الدرس ٢-١.\nدور الطالب: يحل فرديًا.\n\n(٥ د) الغلق\nدور المعلم: يعرض ترجمة خاطئة: «٤ أقل من س» = ٤ - س، ويطلب التصحيح.\nدور الطالب: يصحح إلى س - ٤.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) اكتب عبارة: عدد مطروحًا منه ٦\nالإجابة: س - ٦\n٢. (متوقع) اكتب عبارة: ربع عدد مضافًا إليه ٣\nالإجابة: س/٤ + ٣\n٣. (متقدم) ترجم: اطرح ضعف عدد من ٢٠\nالإجابة: ٢٠ - ٢س", "١. (دعم) اكتب عبارة: ٨ أكثر من عدد\nالإجابة: س + ٨\n٢. (متوقع) اكتب عبارة: اضرب عددًا في ٥ ثم اطرح ٢\nالإجابة: ٥س - ٢\n٣. (متقدم) ترجم مريم «٧ أقل من نصف عدد» إلى ٧ - س/٢. هل هي محقة؟ صحح\nالإجابة: لا، الصحيح س/٢ - ٧", "للطالب: حل تمارين الترجمة في كتاب النشاط ص ٢٧. لولي الأمر: أن يكتب الابن عبارة جبرية لموقف من البيت (مثل مصروفه الأسبوعي)."]}, {"axis": "إيجاد قيمة العبارة الجبرية بالتعويض", "axisT": "إيجاد قيمة العبارة الجبرية بالتعويض", "html": ["<ol><li>يعوض بقيمة عددية للمتغير ويحسب قيمة العبارة الجبرية مطبقًا ترتيب العمليات.</li><li>يكتب عبارة جبرية لمسألة حياتية ثم يحسب قيمتها لقيمة معطاة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يصمم عبارة جبرية تعطي قيمة محددة عند قيمة معطاة للمتغير.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: إبداع</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">التعويض</span><span class=\"chip\">قيمة العبارة</span><span class=\"chip\">المتغير</span><span class=\"chip\">ترتيب العمليات</span>", "<p>لعبة «آلة الأعداد»: يقول المعلم: أدخلُ عددًا، أضربه في ٣ وأضيف ٢. ماذا يخرج إذا أدخلت ٤؟ ١٠؟ -١؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يدير لعبة آلة الأعداد بثلاث قيم.</p><p><em>الطالب:</em> يحسب المخرجات ويكتب القاعدة ٣س + ٢.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج التعويض في ٤س - ٧ عندما س = ٥ وفي س<sup>٢</sup> + ١ عندما س = ٣ وفي ٢(س + ١) عندما س = -٢، مع التأكيد على ترتيب العمليات.</p><p><em>الطالب:</em> يتابع ويحل أمثلة مشابهة على السبورة الصغيرة.</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>حل مسائل</b><p><em>المعلم:</em> يوزع مسائل حياتية: أجرة سيارة أجرة ٢ ريال + ٠٫٥ ريال لكل كم، مساحة حديقة، أعمار.</p><p><em>الطالب:</em> تكتب المجموعة العبارة ثم تعوض وتعرض النتيجة.</p></div></div><div class=\"step\"><span class=\"tm\">٧ د</span><div><b>تدريب ذاتي</b><p><em>المعلم:</em> يكلف بتمارين التعويض في كتاب النشاط ص ٢٨.</p><p><em>الطالب:</em> يحل ويتحقق مع زميله.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يطلب: اكتب عبارة قيمتها ١١ عندما س = ٣.</p><p><em>الطالب:</em> يقترح عبارات مثل ٣س + ٢ أو ٤س - ١.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد قيمة س + ٩ عندما س = ٤<div class=\"ans\">الإجابة: ١٣</div></li><li><span class=\"tier t1\">متوقع</span>أوجد قيمة ٥س - ٣ عندما س = -٢<div class=\"ans\">الإجابة: -١٣</div></li><li><span class=\"tier t2\">متقدم</span>أوجد قيمة ٢س<sup>٢</sup> - س عندما س = ٣<div class=\"ans\">الإجابة: ١٥</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أوجد قيمة ٣س عندما س = ٧<div class=\"ans\">الإجابة: ٢١</div></li><li><span class=\"tier t1\">متوقع</span>أوجد قيمة (س + ٤) ÷ ٢ عندما س = ١٠<div class=\"ans\">الإجابة: ٧</div></li><li><span class=\"tier t2\">متقدم</span>أجرة توصيل: ٢ ريال + ٠٫٥ ريال لكل كم. اكتب العبارة واحسب الأجرة لمسافة ١٢ كم<div class=\"ans\">الإجابة: ٢ + ٠٫٥س، والأجرة ٨ ريالات</div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ٢٨ ومراجعة الدرس ٢-١ كاملًا. لولي الأمر: طرح ألغاز «آلة الأعداد» على الابن بأعداد مختلفة.</p>"], "txt": ["١. يعوض بقيمة عددية للمتغير ويحسب قيمة العبارة الجبرية مطبقًا ترتيب العمليات.\n٢. يكتب عبارة جبرية لمسألة حياتية ثم يحسب قيمتها لقيمة معطاة.\nمخرج تعليمي آخر: يصمم عبارة جبرية تعطي قيمة محددة عند قيمة معطاة للمتغير.", "المخرج ١: تطبيق\nالمخرج ٢: تطبيق\nالمخرج الآخر: إبداع", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التعويض، قيمة العبارة، المتغير، ترتيب العمليات", "لعبة «آلة الأعداد»: يقول المعلم: أدخلُ عددًا، أضربه في ٣ وأضيف ٢. ماذا يخرج إذا أدخلت ٤؟ ١٠؟ -١؟", "(٥ د) التهيئة\nدور المعلم: يدير لعبة آلة الأعداد بثلاث قيم.\nدور الطالب: يحسب المخرجات ويكتب القاعدة ٣س + ٢.\n\n(٨ د) النمذجة\nدور المعلم: ينمذج التعويض في ٤س - ٧ عندما س = ٥ وفي س^٢ + ١ عندما س = ٣ وفي ٢(س + ١) عندما س = -٢، مع التأكيد على ترتيب العمليات.\nدور الطالب: يتابع ويحل أمثلة مشابهة على السبورة الصغيرة.\n\n(١٥ د) حل مسائل\nدور المعلم: يوزع مسائل حياتية: أجرة سيارة أجرة ٢ ريال + ٠٫٥ ريال لكل كم، مساحة حديقة، أعمار.\nدور الطالب: تكتب المجموعة العبارة ثم تعوض وتعرض النتيجة.\n\n(٧ د) تدريب ذاتي\nدور المعلم: يكلف بتمارين التعويض في كتاب النشاط ص ٢٨.\nدور الطالب: يحل ويتحقق مع زميله.\n\n(٥ د) الغلق\nدور المعلم: يطلب: اكتب عبارة قيمتها ١١ عندما س = ٣.\nدور الطالب: يقترح عبارات مثل ٣س + ٢ أو ٤س - ١.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) أوجد قيمة س + ٩ عندما س = ٤\nالإجابة: ١٣\n٢. (متوقع) أوجد قيمة ٥س - ٣ عندما س = -٢\nالإجابة: -١٣\n٣. (متقدم) أوجد قيمة ٢س^٢ - س عندما س = ٣\nالإجابة: ١٥", "١. (دعم) أوجد قيمة ٣س عندما س = ٧\nالإجابة: ٢١\n٢. (متوقع) أوجد قيمة (س + ٤) ÷ ٢ عندما س = ١٠\nالإجابة: ٧\n٣. (متقدم) أجرة توصيل: ٢ ريال + ٠٫٥ ريال لكل كم. اكتب العبارة واحسب الأجرة لمسافة ١٢ كم\nالإجابة: ٢ + ٠٫٥س، والأجرة ٨ ريالات", "للطالب: حل تمارين كتاب النشاط ص ٢٨ ومراجعة الدرس ٢-١ كاملًا. لولي الأمر: طرح ألغاز «آلة الأعداد» على الابن بأعداد مختلفة."]}]}, {"idA": "٢-٢", "title": "تجميع الحدود المتشابهة", "unit": "الوحدة الثانية: العبارات الجبرية والمعادلات والصيغ", "st": "٤٣–٤٥", "ac": "٢٩–٣١", "tb": "٤٧–٤٨", "week": "الأسبوع الثالث", "dates": "٢٠–٢٤/٩/٢٠٢٦م", "periods": [{"axis": "الحدود المتشابهة وتجميعها في متغير واحد", "axisT": "الحدود المتشابهة وتجميعها في متغير واحد", "html": ["<ol><li>يميز الحدود المتشابهة من غير المتشابهة في عبارة جبرية.</li><li>يبسط عبارة جبرية بجمع الحدود المتشابهة وطرحها.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يكتب عبارة جبرية مبسطة لمحيط شكل أطوال أضلاعه عبارات جبرية.</p>", "<span class=\"chip\">المخرج ١: فهم</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: تطبيق</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: بطاقات جبرية (س، ١)</span>", "<span class=\"chip\">الحد</span><span class=\"chip\">الحدود المتشابهة</span><span class=\"chip\">المعامل</span><span class=\"chip\">تبسيط العبارة</span>", "<p>سؤال: لدى سالم ٣ تفاحات و ٢ برتقالة، وأعطاه صديقه تفاحتين. كم تفاحة معه؟ هل نجمع التفاح مع البرتقال؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح موقف التفاح والبرتقال.</p><p><em>الطالب:</em> يربط جمع الأشياء المتماثلة فقط بالحدود المتشابهة.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>بناء المفهوم</b><p><em>المعلم:</em> يستخدم بطاقات س والوحدات لتمثيل ٣س + ٢ + ٢س ويجمعها إلى ٥س + ٢، ويعرّف المعامل.</p><p><em>الطالب:</em> يمثل العبارات بالبطاقات ويكتب الصيغة المبسطة.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج تبسيط ٧س - ٢س + ٤ - ١ و س + س + س.</p><p><em>الطالب:</em> يبسط أمثلة مشابهة على السبورة الصغيرة.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بالتمارين الأولى من ٢-٢ ص ٤٤.</p><p><em>الطالب:</em> يبسط العبارات ويتحقق بالتعويض بعدد.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يرسم مثلثًا أضلاعه س، س + ٢، ٢س ويسأل عن محيطه.</p><p><em>الطالب:</em> يكتب ٤س + ٢.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>بسّط: ٤س + ٣س<div class=\"ans\">الإجابة: ٧س</div></li><li><span class=\"tier t1\">متوقع</span>بسّط: ٩س - ٢ - ٥س + ٦<div class=\"ans\">الإجابة: ٤س + ٤</div></li><li><span class=\"tier t2\">متقدم</span>مستطيل طوله ٣س وعرضه س + ١. اكتب محيطه في أبسط صورة<div class=\"ans\">الإجابة: ٨س + ٢</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>بسّط: ٦س - س<div class=\"ans\">الإجابة: ٥س</div></li><li><span class=\"tier t1\">متوقع</span>بسّط: ٢س + ٧ + ٣س - ١٠<div class=\"ans\">الإجابة: ٥س - ٣</div></li><li><span class=\"tier t2\">متقدم</span>أي العبارتين تساوي الأخرى دائمًا: ٣س + ٢س أم ٥س<sup>٢</sup>؟ ولماذا؟<div class=\"ans\">الإجابة: ٣س + ٢س = ٥س، ولا تساوي ٥س<sup>٢</sup></div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ٢٩–٣٠ في تجميع الحدود. لولي الأمر: التأكد من أن الابن يجمع الحدود المتشابهة فقط.</p>"], "txt": ["١. يميز الحدود المتشابهة من غير المتشابهة في عبارة جبرية.\n٢. يبسط قع) بسّط: ٤س + ٣ص - س + ٢ص\nالإجابة: ٣س + ٥ص\n٣. (متقدم) بسّط: ٣س^٢ + ٢س - س^٢ + ٤س\nالإجابة: ٢س^٢ + ٦س", "١. (دعم) بسّط: ٥س ص - ٢س ص\nالإجابة: ٣س ص\n٢. (متوقع) بسّط: ٧أ - ٣ب + ٢أ + ٥ب\nالإجابة: ٩أ + ٢ب\n٣. (متقدم) اكتب عبارتين مختلفتين مجموعهما ٤س + ٦\nالإجابة: مثل (س + ١) و (٣س + ٥)", "للطالب: إكمال تمارين كتاب النشاط ص ٣١ ومراجعة الأخطاء الشائعة في الدفتر. لولي الأمر: سؤال الابن: لماذا لا نجمع س مع ص؟ ليشرح بأسلوبه."]}]}, {"idA": "٢-٣", "title": "فك الأقواس", "unit": "الوحدة الثانية: العبارات الجبرية والمعادلات والصيغ", "st": "٤٦–٤٧", "ac": "٣٢–٣٣", "tb": "٤٩", "week": "الأسبوع الثالث", "dates": "٢٠–٢٤/٩/٢٠٢٦م", "periods": [{"axis": "فك الأقواس بضرب عدد في مجموع أو فرق", "axisT": "فك الأقواس بضرب عدد في مجموع أو فرق", "html": ["<ol><li>يفك قوسًا بضرب العدد خارجه في كل حد داخله، مثل ٤(س + ٣) = ٤س + ١٢.</li><li>يفك أقواسًا تحتوي على طرح أو عدد سالب خارجها.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يمثل فك القوس بمساحة مستطيل مقسم إلى جزأين.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: فهم</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">صورة توضيحية</span>", "<span class=\"chip\">فك الأقواس</span><span class=\"chip\">خاصية التوزيع</span><span class=\"chip\">الحد</span><span class=\"chip\">المعامل</span>", "<p>حساب ذهني: ٦ × ٢٣ بطريقتين: ٦ × ٢٠ + ٦ × ٣. ما العلاقة بين الطريقتين؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطلب حساب ٦ × ٢٣ بالتجزئة.</p><p><em>الطالب:</em> يكتشف أن ٦(٢٠ + ٣) = ٦ × ٢٠ + ٦ × ٣.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>نموذج المساحة</b><p><em>المعلم:</em> يرسم مستطيلًا عرضه ٤ وطوله س + ٣ مقسومًا إلى جزأين ويكتب المساحة بطريقتين.</p><p><em>الطالب:</em> يستنتج أن ٤(س + ٣) = ٤س + ١٢.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج فك ٥(٢س - ١)، ٣(أ + ٢ب)، -٢(س + ٤)، ويشير إلى الخطأ الشائع بعدم ضرب الحد الأخير.</p><p><em>الطالب:</em> يفك الأمثلة ويتحقق بالتعويض س = ١.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بالتمارين الأولى من ٢-٣ ص ٤٦.</p><p><em>الطالب:</em> يحل فرديًا ثم يتبادل التصحيح.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يكتب: ٤(س + ٣) = ٤س + ٣ ويطلب اكتشاف الخطأ.</p><p><em>الطالب:</em> يوضح أن الصحيح ٤س + ١٢.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>فك القوس: ٢(س + ٥)<div class=\"ans\">الإجابة: ٢س + ١٠</div></li><li><span class=\"tier t1\">متوقع</span>فك القوس: ٣(٤س - ٢)<div class=\"ans\">الإجابة: ١٢س - ٦</div></li><li><span class=\"tier t2\">متقدم</span>فك القوس: -٥(٢س - ٣)<div class=\"ans\">الإجابة: -١٠س + ١٥</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>فك القوس: ٦(ص + ١)<div class=\"ans\">الإجابة: ٦ص + ٦</div></li><li><span class=\"tier t1\">متوقع</span>فك القوس: ٤(٣أ + ٢ب)<div class=\"ans\">الإجابة: ١٢أ + ٨ب</div></li><li><span class=\"tier t2\">متقدم</span>اكتب قوسًا ناتج فكه ١٥س - ١٠<div class=\"ans\">الإجابة: ٥(٣س - ٢)</div></li></ol>", "<p>للطالب: حل تمارين فك الأقواس في كتاب النشاط ص ٣٢. لولي الأمر: مراجعة جدول الضرب مع الابن لأنه أساس فك الأقواس.</p>"], "txt": ["١. يفك قوسًا بضرب العدد خارجه في كل حد داخله، مثل ٤(س + ٣) = ٤س + ١٢.\n٢. يفك أقواسًا تحتوي على طرح أو عدد سالب خارجها.\nمخرج تعليمي آخر: يمثل فك القوس بمساحة مستطيل مقسم إلى جزأين.", "المخرج ١: تطبيق\nالمخرج ٢: تطبيق\nالمخرج الآخر: فهم", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، صورة توضيحية", "فك الأقواس، خاصية التوزيع، الحد، المعامل", "حساب ذهني: ٦ × ٢٣ بطريقتين: ٦ × ٢٠ "ans\">الإجابة: ٢٠</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>ما الحد العاشر للنمط ص = ٢ن + ١؟<div class=\"ans\">الإجابة: ٢١</div></li><li><span class=\"tier t1\">متوقع</span>اكتب صيغة للنمط: ٣، ٧، ١١، ١٥<div class=\"ans\">الإجابة: ص = ٤ن - ١</div></li><li><span class=\"tier t2\">متقدم</span>كم مربعًا متصلًا يمكن بناؤها بـ ١٠٠ عود؟ (ع = ٣ن + ١)<div class=\"ans\">الإجابة: ٣٣ مربعًا (٣ × ٣٣ + ١ = ١٠٠)</div></li></ol>", "<p>للطالب: حل تمارين الأنماط في كتاب النشاط ص ٣٦ وتصميم نمط بالأعواد. لولي الأمر: بناء نمط بأعواد الأسنان مع الابن وعدّها معه.</p>"], "txt": ["١. يستنتج صيغة من نمط هندسي أو جدول قيم.\n٢. يستخدم الصيغة المستنتجة للتنبؤ بقيم جديدة.\nمخرج تعليمي آخر: يصمم نمطًا هندسيًا ويكتب صيغته.", "المخرج ١: تحليل\nالمخرج ٢: تطبيق\nالمخرج الآخر: إبداع", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: أعواد ثقاب أو عيدان خشبية", "النمط، الصيغة، الحد العام، جدول القيم", "يبني الطلاب بالأعواد مربعات متصلة (١، ٢، ٣) ويعدّون الأعواد: ٤، ٧، ١٠.", "(٥ د) التهيئة\nدور المعلم: يطلب بناء المربعات المتصلة وعدّ الأعواد.\nدور الطالب: يسجل الأعداد في جدول.\n\n(١٢ د) اكتشاف الصيغة\nدور المعلم: يوجه للملاحظة: يزيد العدد ٣ كل مرة، ويقود إلى الصيغة ع = ٣ن + ١.\nدور الطالب: يتحقق من الصيغة للقيم في الجدول.\n\n(١٣ د) حل مشكلات\nدور المعلم: يوزع أنماطًا أخرى (طاولات ومقاعد، مثلثات) وجداول قيم من كتاب النشاط ص ٣٦.\nدور الطالب: تستنتج المجموعة الصيغة وتستخدمها لإيجاد الحد العاشر.\n\n(٥ د) عرض\nدور المعلم: يطلب من مجموعتين عرض صيغتيهما.\nدور الطالب: تعرض المجموعة وتبرر.\n\n(٥ د) الغلق\nدور المعلم: يسأل: كم عودًا نحتاج لـ ٥٠ مربعًا؟\nدور الطالب: يحسب ١٥١.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) أكمل الجدول: ن = ١، ٢، ٣ ← ٥، ١٠، ١٥. ما الصيغة؟\nالإجابة: ص = ٥ن\n٢. (متوقع) طاولة تتسع لـ ٤، وطاولتان متصلتان لـ ٦، وثلاث لـ ٨. اكتب الصيغة\nالإجابة: ص = ٢ن + ٢\n٣. (متقدم) استخدم الصيغة ع = ٣ن + ١ لإيجاد ن عندما ع = ٦١\nالإجابة: ٢٠", "١. (دعم) ما الحد العاشر للنمط ص = ٢ن + ١؟\nالإجابة: ٢١\n٢. (متوقع) اكتب صيغة للنمط: ٣، ٧، ١١، ١٥\nالإجابة: ص = ٤ن - ١\n٣. (متقدم) كم مربعًا متصلًا يمكن بناؤها بـ ١٠٠ عود؟ (ع = ٣ن + ١)\nالإجابة: ٣٣ مربعًا (٣ × ٣٣ + ١ = ١٠٠)", "للطالب: حل تمارين الأنماط في كتاب النشاط ص ٣٦ وتصميم نمط بالأعواد. لولي الأمر: بناء نمط بأعواد الأسنان مع الابن وعدّها معه."]}]}, {"idA": "٢-٥", "title": "كتابة المعادلات وحلها", "unit": "الوحدة الثانية: العبارات الجبرية والمعادلات والصيغ", "st": "٥١–٥٣", "ac": "٣٧–٣٩", "tb": "٥٢–٥٣", "week": "الأسبوع الرابع", "dates": "٢٧/٩–١/١٠/٢٠٢٦م", "periods": [{"axis": "حل معادلات بخطوة واحدة باستخدام العمليات العكسية", "axisT": "حل معادلات بخطوة واحدة باستخدام العمليات العكسية", "html": ["<ol><li>يحل معادلة بخطوة واحدة (جمع، طرح، ضرب، قسمة) باستخدام العملية العكسية.</li><li>يتحقق من صحة الحل بالتعويض في المعادلة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يمثل المعادلة بنموذج الميزان ويوضح فكرة إجراء العملية نفسها على الطرفين.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تقييم</span><span class=\"chip\">المخرج الآخر: فهم</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على اللعب</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: ميزان ذو كفتين وأكياس متماثلة</span>", "<span class=\"chip\">المعادلة</span><span class=\"chip\">المجهول</span><span class=\"chip\">الحل</span><span class=\"chip\">العملية العكسية</span><span class=\"chip\">الطرفان</span>", "<p>لغز: «أفكر في عدد، إذا أضفت إليه ٨ كان الناتج ٢٠. ما العدد؟» ثم سؤال: كيف وصلت للإجابة؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح اللغز ويستمع للطرق.</p><p><em>الطالب:</em> يذكر أنه طرح ٨ من ٢٠.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>نموذج الميزان</b><p><em>المعلم:</em> يستخدم الميزان: كيس (س) و ٣ قطع في كفة و ٧ قطع في الأخرى، ويزيل ٣ من الكفتين.</p><p><em>الطالب:</em> يستنتج س = ٤ ويكتب س + ٣ = ٧.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج حل: س - ٥ = ٩، ٤س = ٢٨، س ÷ ٣ = ٦، مع التحقق بالتعويض.</p><p><em>الطالب:</em> يحل أمثلة مشابهة ويتحقق.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بالتمارين الأولى من ٢-٥ ص ٥٢.</p><p><em>الطالب:</em> يحل ويتحقق من كل حل.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يطرح: ٧س = -٣٥.</p><p><em>الطالب:</em> يحل س = -٥ ويتحقق.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>حل: س + ٦ = ١٥<div class=\"ans\">الإجابة: س = ٩</div></li><li><span class=\"tier t1\">متوقع</span>حل: ٥س = ٤٥<div class=\"ans\">الإجابة: س = ٩</div></li><li><span class=\"tier t2\">متقدم</span>حل: س ÷ ٤ = -٣<div class=\"ans\">الإجابة: س = -١٢</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>حل: س - ٧ = ٢<div class=\"ans\">الإجابة: س = ٩</div></li><li><span class=\"tier t1\">متوقع</span>حل: ٨س = ٥٦<div class=\"ans\">الإجابة: س = ٧</div></li><li><span class=\"tier t2\">متقدم</span>حل: ١٢ = س + ٢٠<div class=\"ans\">الإجابة: س = -٨</div></li></ol>", "<p>للطالب: حل المعادلات في كتاب النشاط ص ٣٧ مع التحقق من كل حل. لولي الأمر: طرح ألغاز «أفكر في عدد» على الابن.</p>"], "txt": ["١. يحل معادلة بخطوة واحدة (جمع، طرح، ضرب، قسمة) باستخدام العملية العكسية.\n٢. يتحقق من صحة الحل بالتعويض في المعادلة.\nمخرج تعليمي آخر: يمثل المعادلة بنموذج الميزان ويوضح فكرة إجراء العملية نفسها على الطرفين.", "المخرج ١: تطبيق\nالمخرج ٢: تقييم\nالمخرج الآخر: فهم", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: ميزان ذو كفتين وأكياس متماثلة", "المعادلة، المجهول، الحل، العملية العكسية، الطرفان", "لغز: «أفكر في عدد، إذا أضفت إليه ٨ كان الناتج ٢٠. ما العدد؟» ثم سؤال: كيف وصلت للإجابة؟", "(٥ د) التهيئة\nدور المعلم: يطرح اللغز ويستمع للطرق.\nدور الطالب: يذكر أنه طرح ٨ من ٢٠.\n\n(١٠ د) نموذج الميزان\nدور المعلم: يستخدم الميزان: كيس (س) و ٣ قطع في كفة و ٧ قطع في الأخرى، ويزيل ٣ من الكفتين.\nدور الطالب: يستنتج س = ٤ ويكتب س + ٣ = ٧.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج حل: س - ٥ = ٩، ٤س = ٢٨، س ÷ ٣ = ٦، مع التحقق بالتعويض.\nدور الطالب: يحل أمثلة مشابهة ويتحقق.\n\n(١٠ د) التدريب\nدور المعلم: يكلف بالتمارين الأولى من ٢-٥ ص ٥٢.\nدور الطالب: يحل ويتحقق من كل حل.\n\n(٥ د) الغلق\nدور المعلم: يطرح: ٧س = -٣٥.\nدور الطالب: يحل س = -٥ ويتحقق.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) حل: س + ٦ = ١٥\nالإجابة: س = ٩\n٢. (متوقع) حل: ٥س = ٤٥\nالإجابة: س = ٩\n٣. (متقدم) حل: س ÷ ٤ = -٣\nالإجابة: س = -١٢", "١. (دعم) حل: س - ٧ = ٢\nالإجابة: س = ٩\n٢. (متوقع) حل: ٨س = ٥٦\nالإجابة: س = ٧\n٣. (متقدم) حل: ١٢ = س + ٢٠\nالإجابة: س = -٨", "للطالب: حل المعادلات في كتاب النشاط ص ٣٧ مع التحقق من كل حل. لولي الأمر: طرح ألغاز «أفكر في عدد» على الابن."]}, {"axis": "حل معادلات بخطوتين", "axisT": "حل معادلات بخطوتين", "html": ["<ol><li>يحل معادلة بخطوتين مثل ٣س + ٤ = ١٩ بترتيب صحيح للعمليات العكسية.</li><li>يحل معادلات تحتوي على المجهول في الطرفين في حالات بسيطة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يكتشف الأخطاء الشائعة في حل المعادلات (تغيير طرف واحد) ويصححها.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: تقييم</span>", "<span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: ميزان ذو كفتين</span>", "<span class=\"chip\">المعادلة</span><span class=\"chip\">الخطوتان</span><span class=\"chip\">العملية العكسية</span><span class=\"chip\">التحقق</span>", "<p>مراجعة سريعة بحل س + ٤ = ١٠ و ٣س = ١٨، ثم سؤال: كيف نحل ٣س + ٤ = ١٩؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح المعادلتين البسيطتين والسؤال.</p><p><em>الطالب:</em> يقترح خطوات.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج: ٣س + ٤ = ١٩ ← ٣س = ١٥ ← س = ٥، و ٢س - ٧ = ١١، و ٥س + ٢ = ٣س + ١٠ (طرح ٣س من الطرفين).</p><p><em>الطالب:</em> يحل ويكتب العملية على الطرفين في كل خطوة.</p></div></div><div class=\"step\"><span class=\"tm\">١٣ د</span><div><b>التدريب التعاوني</b><p><em>المعلم:</em> يكلف بتمارين ٢-٥ ذات الخطوتين.</p><p><em>الطالب:</em> يحل كل زوج ويتحقق بالتعويض.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>بطاقة خطأ</b><p><em>المعلم:</em> يعرض حلًا خاطئًا: ٢س + ٣ = ١١ ← ٢س = ١٤.</p><p><em>الطالب:</em> يصحح إلى ٢س = ٨ ← س = ٤.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يطرح: ٤س - ٥ = ٢س + ٩.</p><p><em>الطالب:</em> يحل س = ٧.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>حل: ٢س + ١ = ٩<div class=\"ans\">الإجابة: س = ٤</div></li><li><span class=\"tier t1\">متوقع</span>حل: ٥س - ٨ = ٢٢<div class=\"ans\">الإجابة: س = ٦</div></li><li><span class=\"tier t2\">متقدم</span>حل: ٦س + ٣ = ٢س + ٢٣<div class=\"ans\">الإجابة: س = ٥</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>حل: ٣س + ٢ = ١٤<div class=\"ans\">الإجابة: س = ٤</div></li><li><span class=\"tier t1\">متوقع</span>حل: ٤س - ٩ = -١<div class=\"ans\">الإجابة: س = ٢</div></li><li><span class=\"tier t2\">متقدم</span>حل: ٧س - ٤ = ٣س + ١٢<div class=\"ans\">الإجابة: س = ٤</div></li></ol>", "<p>للطالب: حل تمارين المعادلات ذات الخطوتين في كتاب النشاط ص ٣٨. لولي الأمر: التأكد من تحقق الابن من الحل بالتعويض.</p>"], "txt": ["١. يحل معادلة بخطوتين مثل ٣س + ٤ = ١٩ بترتيب صحيح للعمليات العكسية.\n٢. يحل معادلات تحتوي على المجهول في الطرفين في حالات بسيطة.\nمخرج تعليمي آخر: يكتشف الأخطاء الشائعة في حل المعادلات (تغيير طرف واحد) ويصححها.", "المخرج ١: تطبيق\nالم ) التهيئة\nدور المعلم: يذكر الأرقام واحدًا تلو الآخر.\nدور الطالب: يضع كل رقم في مربع لتكوين أكبر عدد.\n\n(١٢ د) النشاط ١\nدور المعلم: يكرر النشاط بثمانية أرقام في عددين ويطلب أن يكون الأول أكبر من الثاني.\nدور الطالب: يخطط لمواقع الأرقام ويقارن نتيجته بزملائه.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج ترتيب ٠٫٥، ٠٫٤٥، ٠٫٥٠٥، ٠٫٠٥٤ تصاعديًا بعد مساواة المنازل بالأصفار.\nدور الطالب: يرتب مجموعات أعداد تصاعديًا وتنازليًا.\n\n(٨ د) التدريب\nدور المعلم: يكلف بتمارين الترتيب في الدرس ٣-١.\nدور الطالب: يحل ويتحقق مع زميله.\n\n(٥ د) الغلق\nدور المعلم: يطلب ترتيب أطوال قفز: ٣٫٤ م، ٣٫٣٩ م، ٣٫٤٠٢ م تنازليًا.\nدور الطالب: يرتب ٣٫٤٠٢، ٣٫٤، ٣٫٣٩.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) رتب تصاعديًا: ٠٫٣، ٠٫٢٥، ٠٫٣١\nالإجابة: ٠٫٢٥، ٠٫٣، ٠٫٣١\n٢. (متوقع) رتب تنازليًا: ٤٫٠٦، ٤٫٦، ٤٫٠٠٦، ٤٫٠٦٦\nالإجابة: ٤٫٦، ٤٫٠٦٦، ٤٫٠٦، ٤٫٠٠٦\n٣. (متقدم) كوّن أكبر عدد عشري بمنزلتين عشريتين من الأرقام ٣، ٨، ١، ٥\nالإجابة: ٨٥٫٣١", "١. (دعم) رتب تصاعديًا: ١٫٢، ١٫٠٢، ١٫٢٢\nالإجابة: ١٫٠٢، ١٫٢، ١٫٢٢\n٢. (متوقع) رتب تنازليًا: ٠٫٧، ٠٫٠٧٧، ٠٫٧٠٧\nالإجابة: ٠٫٧٠٧، ٠٫٧، ٠٫٠٧٧\n٣. (متقدم) كوّن أصغر عدد عشري بثلاث منازل عشرية من ٤، ٠، ٩، ٢\nالإجابة: ٠٫٢٤٩", "للطالب: حل تمارين الترتيب في كتاب النشاط ص ٤١. لولي الأمر: ترتيب أوزان أو أطوال أفراد الأسرة بالأعداد العشرية."]}, {"axis": "تطبيقات الترتيب واستخدام الرموز = و ≠ و &lt; و &gt;", "axisT": "تطبيقات الترتيب واستخدام الرموز = و ≠ و < و >", "html": ["<ol><li>يستخدم الرموز = و ≠ و &lt; و &gt; للمقارنة بين أعداد عشرية وقياسات.</li><li>يرتب قياسات حياتية بالأعداد العشرية في سياق مسائل.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يحل مسألة متعددة الخطوات تتطلب ترتيب نتائج سباق.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: تحليل</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم التشاركي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلا i><li>يستخدم العمليات العكسية للتحقق من صحة النتائج.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يصمم مسألة تسوق ويحلها زميله.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تقييم</span><span class=\"chip\">المخرج الآخر: إبداع</span>", "<span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على اللعب</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: قوائم أسعار من محل وهمي</span>", "<span class=\"chip\">العملية العكسية</span><span class=\"chip\">المسألة متعددة الخطوات</span><span class=\"chip\">الأعداد العشرية</span>", "<p>عرض قائمة أسعار مقصف المدرسة (عصير ٠٫٣٠٠، شطيرة ٠٫٤٥٠، ماء ٠٫١٠٠) وسؤال: ماذا تشتري بـ ١ ريال؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يعرض القائمة ويطرح السؤال.</p><p><em>الطالب:</em> يقترح مشتريات ويحسب الباقي.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>نشاط المتجر</b><p><em>المعلم:</em> يوزع قوائم أسعار وميزانيات على المجموعات.</p><p><em>الطالب:</em> تختار المجموعة مشتريات وتحسب المجموع والباقي.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>التحقق بالعمليات العكسية</b><p><em>المعلم:</em> ينمذج التحقق: ١٠ - ٦٫٧٢٥ = ٣٫٢٧٥ ← ٣٫٢٧٥ + ٦٫٧٢٥ = ١٠.</p><p><em>الطالب:</em> يتحقق من حلول زملائه.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بمسائل كتاب النشاط ص ٤٦.</p><p><em>الطالب:</em> يحل ويكتب جملة الإجابة.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> مسألة: قفز سالم ٣٫٨٥ م وأحمد ٤٫١ م. كم يزيد أحمد؟</p><p><em>الطالب:</em> يحسب ٠٫٢٥ م.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>معك ٥ ريالات واشتريت بـ ٣٫٢٥٠. كم الباقي؟<div class=\"ans\">الإجابة: ١٫٧٥٠ ريال</div></li><li><span class=\"tier t1\">متوقع</span>ثلاث قطع طولها ١٫٢٥ م و ٠٫٨ م و ٢٫٣٥ م. ما مجموع أطوالها؟<div class=\"ans\">الإجابة: ٤٫٤ م</div></li><li><span class=\"tier t2\">متقدم</span>تحقق باستخدام الجمع من أن ١٠ - ٦٫٧٢٥ = ٣٫٢٧٥<div class=\"ans\">الإجابة: ٣٫٢٧٥ + ٦٫٧٢٥ = ١٠، الناتج صحيح</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: ٠٫٣٠٠ + ٠٫٤٥٠<div class=\"ans\">الإجابة: ٠٫٧٥٠</div></li><li><span class=\"tier t1\">متوقع</span>وزن حقيبة ٤٫٦ كغم أُخرج منها كتاب ١٫٣٥ كغم. كم أصبح وزنها؟<div class=\"ans\">الإجابة: ٣٫٢٥ كغم</div></li><li><span class=\"tier t2\">متقدم</span>فاتورة ٧٫٨٤٥ ريال دفع منها ٤٫٩ ريال. ما المتبقي؟ وتحقق<div class=\"ans\">الإجابة: ٢٫٩٤٥ ريال، والتحقق ٢٫٩٤٥ + ٤٫٩ = ٧٫٨٤٥</div></li></ol>", "<p>للطالب: حل مسائل كتاب النشاط ص ٤٦ وتأليف مسألة تسوق. لولي الأمر: إشراك الابن في حساب باقي النقود عند الشراء.</p>"], "txt": ["١. يحل مسائل كلامية متعددة الخطوات تتضمن جمع وطرح أعداد عشرية.\n٢. يستخدم العمليات العكسية للتحقق من صحة النتائج.\nمخرج تعليمي آخر: يصمم مسألة تسوق ويحلها زميله.", "المخرج ١: تطبيق\nالمخرج ٢: تقييم\nالمخرج الآخر: إبداع", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: قوائم أسعار من محل وهمي", "العملية العكسية، المسألة متعددة الخطوات، الأعداد العشرية", "عرض قائمة أسعار مقصف المدرسة (عصير ٠٫٣٠٠، شطيرة ٠٫٤٥٠، ماء ٠٫١٠٠) وسؤال: ماذا تشتري بـ ١ ريال؟", "(٥ د) التهيئة\nدور المعلم: يعرض القائمة ويطرح السؤال.\nدور الطالب: يقترح مشتريات ويحسب الباقي.\n\n(١٢ د) نشاط المتجر\nدور المعلم: يوزع قوائم أسعار وميزانيات على المجموعات.\nدور الطالب: تختار المجموعة مشتريات وتحسب المجموع والباقي.\n\n(٨ د) التحقق بالعمليات العكسية\nدور المعلم: ينمذج التحقق: ١٠ - ٦٫٧٢٥ = ٣٫٢٧٥ ← ٣٫٢٧٥ + ٦٫٧٢٥ = ١٠.\nدور الطالب: يتحقق من حلول زملائه.\n\n(١٠ د) التدريب\nدور المعلم: يكلف بمسائل كتاب النشاط ص ٤٦.\nدور الطالب: يحل ويكتب جملة الإجابة.\n\n(٥ د) الغلق\nدور المعلم: مسألة: قفز سالم ٣٫٨٥ م وأحمد ٤٫١ م. كم يزيد أحمد؟\nدور الطالب: يحسب ٠٫٢٥ م.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) معك ٥ ريالات واشتريت بـ ٣٫٢٥٠. كم الباقي؟\nالإجابة: ١٫٧٥٠ ريال\n٢. (متوقع) ثلاث قطع طولها ١٫٢٥ م و ٠٫٨ م و ٢٫٣٥ م. ما مجموع أطوالها؟\nالإجابة: ٤٫٤ م\n٣. (متقدم) تحقق باستخدام الجمع من أن ١٠ - ٦٫٧٢٥ = ٣٫٢٧٥\nالإجابة: ٣٫٢٧٥ + ٦٫٧٢٥ = ١٠، الناتج صحيح", "١. (دعم) احسب: ٠٫٣٠٠ + ٠٫٤٥٠\nالإجابة: ٠٫٧٥٠\n٢. (متوقع) وزن حقيبة ٤٫٦ كغم أُخرج منها كتاب ١٫٣٥ كغم. كم أصبح وزنها؟\nالإجابة: ٣٫٢٥ كغم\n٣. (متقدم) فاتورة ٧٫٨٤٥ ريال دفع منها ٤٫٩ ريال. ما المتبقي؟ وتحقق\nالإجابة: ٢٫٩٤٥ ريال، والتحقق ٢٫٩٤٥ + ٤٫٩ = ٧٫٨٤٥", "للطالب: حل مسائل كتاب النشاط ص ٤٦ وتأليف مسألة تسوق. لولي الأمر: إشراك الابن في حساب باقي النقود عند الشراء."]}]}, {"idA": "٣-٤", "title": "ضرب الأعداد العشرية والكسور العشرية", "unit": "الوحدة الثالثة: القيمة المكانية والترتيب والتقريب", "st": "٦٤–٦٥", "ac": "٤٧", "tb": "٦٩–٧٠", "week": "الأسبوع السادس", "dates": "١١–١٥/١٠/٢٠٢٦م", "periods": [{"axis": "ضرب عدد عشري في عدد كامل", "axisT": "ضرب عدد عشري في عدد كامل", "html": ["<ol><li>يضرب عددًا عشريًا في عدد كامل من رقم واحد بالطريقة الكتابية.</li><li>يحدد موضع الفاصلة العشرية في الناتج باستخدام التقدير.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يستخدم حقائق الضرب المعروفة لاشتقاق نواتج عشرية (من ٣ × ٤ = ١٢ إلى ٠٫٣ × ٤ = ١٫٢).</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: فهم</span>", "<span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: نموذج المئة المربعات</span>", "<span class=\"chip\">ناتج الضرب</span><span class=\"chip\">الفاصلة العشرية</span><span class=\"chip\">التقدير</span>", "<p>سؤال: ثمن علبة عصير ٠٫٣٥٠ ريال، فكم ثمن ٤ علب؟ يقدر الطلاب الناتج أولًا.</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح سؤال العصير.</p><p><em>الطالب:</em> يقدر (أقل من ٢ ريال) ثم يحسب ١٫٤٠٠.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>الاكتشاف</b><p><em>المعلم:</em> يكتب ٢٣ × ٤ = ٩٢ ويطلب استنتاج ٢٫٣ × ٤ و ٠٫٢٣ × ٤ مع التقدير.</p><p><em>الطالب:</em> يكتشف أن عدد المنازل العشرية في الناتج يساوي عددها في العامل.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>النمذجة</b><p><em>المعلم:</em> ينمذج الطريقة الكتابية لـ ٣٫٤٧ × ٦ و ١٢٫٥ × ٨.</p><p><em>الطالب:</em> يحسب أمثلة مشابهة.</p></div></div><div class=\"step\"><span class=\"tm\">١٠ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين ٣-٤ ص ٦٤.</p><p><em>الطالب:</em> يحل ويقدر قبل الحساب.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> يطرح: ٠٫٤ × ٧.</p><p><em>الطالب:</em> يجيب ٢٫٨.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: ٠٫٣ × ٤<div class=\"ans\">الإجابة: ١٫٢</div></li><li><span class=\"tier t1\">متوقع</span>احسب: ٣٫٤٧ × ٦<div class=\"ans\">الإجابة: ٢٠٫٨٢</div></li><li><span class=\"tier t2\">متقدم</span>إذا علمت أن ٢٧ × ٨ = ٢١٦ فاحسب ٢٫٧ × ٨ و ٠٫٢٧ × ٨<div class=\"ans\">الإجابة: ٢١٫٦ و ٢٫١٦</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>احسب: ١٫٥ × ٣<div class=\"ans\">الإجابة: ٤٫٥</div></li><li><span class=\"tier t1\">متوقع</span>احسب: ١٢٫٥ × ٨<div class=\"ans\">الإجابة: ١٠٠</div></li><li><span class=\"tier t2\">متقدم</span>قلم بـ ٠٫٣٧٥ ريال. كم ثمن ٧ أقلام؟<div class=\"ans\">الإجابة: ٢٫٦٢٥ ريال</div></li></ol>", "<p>للطالب: حل تمارين الضرب في كتاب النشاط ص ٤٧. لولي الأمر: حساب أثمان مشتريات متعددة الكميات مع الابن.</p>"], "txt": ["١. يضرب عددًا عشريًا في عدد كامل من رقم واحد بالطريقة الكتابية.\n٢. يحدد موضع الفاصلة العشرية في الناتج باستخدام التقدير.\nمخرج تعليمي آخر: يستخدم حقائق الضرب المعروفة لاشتقاق نواتج عشرية (من ٣ × ٤ = ١٢ إلى ٠٫٣ × ٤ = ١٫٢).", "المخرج ١: تطبيق\nالمخرج ٢:  الأصفار."]}, {"axis": "نشاط الصديق والعالِم: دقة الإجابة حسب السياق", "axisT": "نشاط الصديق والعالِم: دقة الإجابة حسب السياق", "html": ["<ol><li>يقدم إجابتين للمسألة نفسها: تقريبية مبسطة ودقيقة، حسب حاجة السائل.</li><li>يقرب نتائج القسمة بصورة منطقية تناسب السياق.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يبرر اختيار درجة الدقة في الإجابة في مواقف حياتية.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تقييم</span><span class=\"chip\">المخرج الآخر: تقييم</span>", "<span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التشاركي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">الأقلام</span><span class=\"chip\">أخرى: ورقة المصادر ٣-٦ (مسائل الصديق والعالِم)</span>", "<span class=\"chip\">الدقة</span><span class=\"chip\">التقريب</span><span class=\"chip\">السياق</span><span class=\"chip\">القسمة</span>", "<p>سؤال: لو سألك صديقك كم نصيب كل منا من ١٠ ريالات بيننا الثلاثة؟ ولو سألك محاسب؟ هل تختلف الإجابة؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يطرح السؤال المزدوج.</p><p><em>الطالب:</em> يقارن بين «نحو ٣ ريالات» و «٣٫٣٣٣ ريال».</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>نشاط الصديق والعالِم</b><p><em>المعلم:</em> يوزع ورقة المصادر بمسائل عشر، ويطلب لكل مسألة إجابتين: للصديق (مقربة) وللعالِم (دقيقة).</p><p><em>الطالب:</em> تحل الأزواج المسائل وتكتب الإجابتين.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>مناقشة</b><p><em>المعلم:</em> يناقش اختيار درجة التقريب لكل موقف (نقود لأقرب بيسة، أطوال لأقرب سم).</p><p><em>الطالب:</em> يبرر اختياره.</p></div></div><div class=\"step\"><span class=\"tm\">٧ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين كتاب النشاط ص ٥١.</p><p><em>الطالب:</em> يحل فرديًا.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: ٥٠ طا  الابن: لماذا ٦ ÷ ٠٫١ أكبر من ٦؟"]}, {"axis": "تطبيقات على الضرب والقسمة على ٠٫١ و ٠٫٠١", "axisT": "تطبيقات على الضرب والقسمة على ٠٫١ و ٠٫٠١", "html": ["<ol><li>يحل مسائل تتضمن الضرب والقسمة على ٠٫١ و ٠٫٠١ وقوى العشرة.</li><li>يختار الطريقة المكافئة الأسهل للحساب الذهني.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يكوّن سلاسل عمليات (× ٠٫١، ÷ ٠٫٠١...) تصل من عدد إلى آخر.</p>", "<span class=\"chip\">المخرج ١: تطبيق</span><span class=\"chip\">المخرج ٢: تحليل</span><span class=\"chip\">المخرج الآخر: إبداع</span>", "<span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">الحساب الذهني</span><span class=\"chip\">التكافؤ</span><span class=\"chip\">قوى العشرة</span>", "<p>سلسلة ذهنية: ابدأ بـ ٥، اضرب في ١٠٠، اقسم على ٠٫١، اضرب في ٠٫٠١. ما الناتج؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يقرأ السلسلة ببطء.</p><p><em>الطالب:</em> يتتبع: ٥٠٠، ٥٠٠٠، ٥٠.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>لعبة السلاسل</b><p><em>المعلم:</em> تكوّن كل مجموعة سلسلة من ثلاث عمليات تصل من ٢ إلى ٠٫٠٢ وتتحدى المجموعة الأخرى.</p><p><em>الطالب:</em> تبني السلاسل وتحل سلاسل المنافسين.</p></div></div><div class=\"step\"><span class=\"tm\">١٣ د</span><div><b>حل مسائل</b><p><em>المعلم:</em> يكلف بمسائل كتاب النشاط ص ٥٤ وتمارين الدرس المتبقية.</p><p><em>الطالب:</em> يحل ويناقش.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>مراجعة</b><p><em>المعلم:</em> يلخص القواعد في جدول على السبورة.</p><p><em>الطالب:</em> ينسخ الجدول.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: ٠٫٧ ÷ ٠٫٠١ = ؟</p><p><em>الطالب:</em> يجيب ٧٠.</p></di ير ٤٨٫٧ × ٥٫٢ ≈ ٥٠ × ٥ = ٢٥٠ و ٦١٢ ÷ ٢٩ ≈ ٦٠٠ ÷ ٣٠ = ٢٠.</p><p><em>الطالب:</em> يقدر أمثلة مشابهة.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>مسائل التحقق</b><p><em>المعلم:</em> يعرض نواتج بعضها خاطئ ويطلب الحكم عليها بالتقدير.</p><p><em>الطالب:</em> يحدد الخاطئ ويبرر.</p></div></div><div class=\"step\"><span class=\"tm\">٨ د</span><div><b>التدريب</b><p><em>المعلم:</em> يكلف بتمارين ٣-٨ ص ٧٤–٧٥.</p><p><em>الطالب:</em> يقدر ثم يحسب.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> سؤال: هل ١٩٫٨ × ٣٫١ = ٦١٣٫٨ معقول؟</p><p><em>الطالب:</em> يقدر ٦٠ فيحكم بالخطأ.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>قدّر: ٩٫٨ + ٢٠٫٣<div class=\"ans\">الإجابة: ٣٠ تقريبًا</div></li><li><span class=\"tier t1\">متوقع</span>قدّر: ٤٨٫٧ × ٥٫٢<div class=\"ans\">الإجابة: ٢٥٠ تقريبًا</div></li><li><span class=\"tier t2\">متقدم</span>حسب طالب ٦١٢ ÷ ٢٩ = ٢٫١١. استخدم التقدير للحكم على إجابته<div class=\"ans\">الإجابة: غير معقولة، التقدير ٦٠٠ ÷ ٣٠ = ٢٠</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>قدّر: ٧٫٩ × ٤<div class=\"ans\">الإجابة: ٣٢ تقريبًا</div></li><li><span class=\"tier t1\">متوقع</span>قدّر: ٣٩٥ ÷ ٨٫١<div class=\"ans\">الإجابة: ٥٠ تقريبًا</div></li><li><span class=\"tier t2\">متقدم</span>هل تكفي ٢٠ ريالًا لشراء ٣ أغراض سعر كل منها ٦٫٩٥ ريال؟ وضح بالتقدير<div class=\"ans\">الإجابة: لا، ٣ × ٧ = ٢١ تقريبًا والناتج الفعلي ٢٠٫٨٥</div></li></ol>", "<p>للطالب: حل تمارين كتاب النشاط ص ٥٥–٥٦. لولي الأمر: تقدير قيمة سلة المشتريات قبل الدفع مع الابن.</p>"], "txt": ["١. يقدّر ناتج عمليات حسابية بتقريب الأعداد قبل الحساب.\n٢. يحكم على معقولية الناتج بمقارنته بالتقدير.\nمخرج تعليمي آخر: يميز بين المواقف التي يكفي فيها التقدير وتلك التي تتطلب حسابًا دقيقًا.", "المخرج ١: تطبيق\nالمخرج ٢: تقييم\nالمخرج الآخر: تحليل", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم بالاكتشاف", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات تقدير", "التقدير، التقريب، المعقولية، التحقق", "سؤال: معك ١٠ ريالات وتريد شراء أغراض بأسعار ٢٫٩٥ و ٣٫١٥ و ٤٫١٠. هل تكفي النقود؟ أجب خلال ١٠ ثوانٍ.", "(٥ د) التهيئة\nدور المعلم: يطرح السؤال بزمن محدد.\nدور الطالب: يقدر ٣ + ٣ + ٤ = ١٠ ويناقش الحالة الحدية.\n\n(١٠ د) النمذجة\nدور المعلم: ينمذج تقدير ٤٨٫٧ × ٥٫٢ ≈ ٥٠ × ٥ = ٢٥٠ و ٦١٢ ÷ ٢٩ ≈ ٦٠٠ ÷ ٣٠ = ٢٠.\nدور الطالب: يقدر أمثلة مشابهة.\n\n(١٢ د) مسائل التحقق\nدور المعلم: يعرض نواتج بعضها خاطئ ويطلب الحكم عليها بالتقدير.\nدور الطالب: يحدد الخاطئ ويبرر.\n\n(٨ د) التدريب\nدور المعلم: يكلف بتمارين ٣-٨ ص ٧٤–٧٥.\nدور الطالب: يقدر ثم يحسب.\n\n(٥ د) الغلق\nدور المعلم: سؤال: هل ١٩٫٨ × ٣٫١ = ٦١٣٫٨ معقول؟\nدور الطالب: يقدر ٦٠ فيحكم بالخطأ.\n\nمجموع زمن الحصة: ٤٠ دقيقة", "١. (دعم) قدّر: ٩٫٨ + ٢٠٫٣\nالإجابة: ٣٠ تقريبًا\n٢. (متوقع) قدّر: ٤٨٫٧ × ٥٫٢\nالإجابة: ٢٥٠ تقريبًا\n٣. (متقدم) حسب طالب ٦١٢ ÷ ٢٩ = ٢٫١١. استخدم التقدير للحكم على إجابته\nالإجابة: غير معقولة، التقدير ٦٠٠ ÷ ٣٠ = ٢٠", "١. (دعم) قدّر: ٧٫٩ × ٤\nالإجابة: ٣٢ تقريبًا\n٢. (متوقع) قدّر: ٣٩٥ ÷ ٨٫١\nالإجابة: ٥٠ تقريبًا\n٣. (متقدم) هل تكفي ٢٠ ريالًا لشراء ٣ أغراض سعر كل منها ٦٫٩٥ ريال؟ وضح بالتقدير\nالإجابة: لا، ٣ × ٧ = ٢١ تقريبًا والناتج الفعلي ٢٠٫٨٥", "للطالب: حل تمارين كتاب النشاط ص ٥٥–٥٦. لولي الأمر: تقدير قيمة سلة المشتريات قبل الدفع مع الابن."]}, {"axis": "ألعاب التقدير وتمارين ومسائل عامة على الوحدة الثالثة", "axisT": "ألعاب التقدير وتمارين ومسائل عامة على الوحدة الثالثة", "html": ["<ol><li>يستخدم التقدير والعمليات العكسية للتحقق من صحة عمله.</li><li>يوظف مهارات الوحدة الثالثة في حل مسائل متنوعة.</li></ol><p class=\"ex\"><b>مخرج تعليمي آخر:</b> يصمم بطاقات لعبة تقدير لزملائه.</p>", "<span class=\"chip\">المخرج ١: تقييم</span><span class=\"chip\">المخرج ٢: تطبيق</span><span class=\"chip\">المخرج الآخر: إبداع</span>", "<span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم الذاتي</span>", "<span class=\"chip\">الكتاب</span><span class=\"chip\">السبورة الذكية</span><span class=\"chip\">الأقلام</span><span class=\"chip\">برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span>", "<span class=\"chip\">التقدير</span><span class=\"chip\">العمليات العكسية</span><span class=\"chip\">الأعداد العشرية</span>", "<p>سؤال سريع: أي العمليات ناتجها قرابة ١٠٠: ٤٫٩ × ٢١، ٩٫٨ × ١٫١، ٢٠٥ ÷ ٢٫١؟</p>", "<div class=\"steps\"><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>التهيئة</b><p><em>المعلم:</em> يعرض العمليات الثلاث.</p><p><em>الطالب:</em> يقدر ويختار.</p></div></div><div class=\"step\"><span class=\"tm\">١٥ د</span><div><b>لعبة بطاقات التقدير</b><p><em>المعلم:</em> تكتب كل مجموعة بطاقات عمليات مع تقديرها المنطقي ثم تتبادل البطاقات للتحدي.</p><p><em>الطالب:</em> تحل المجموعات البطاقات وتتحقق من معقولية التقدير.</p></div></div><div class=\"step\"><span class=\"tm\">١٢ د</span><div><b>تمارين ومسائل عامة</b><p><em>المعلم:</em> يكلف بمسائل عامة على الوحدة (ترتيب، تقريب، عمليات عشرية) من كتاب الطالب وكتاب النشاط ص ٥٧.</p><p><em>الطالب:</em> يحل ويتحقق بالعمليات العكسية.</p></div></div><div class=\"step\"><span class=\"tm\">٣ د</span><div><b>تقويم ذاتي</b><p><em>المعلم:</em> يعرض قائمة «أستطيع أن…».</p><p><em>الطالب:</em> يحدد مستواه.</p></div></div><div class=\"step\"><span class=\"tm\">٥ د</span><div><b>الغلق</b><p><em>المعلم:</em> مسابقة قصيرة من ملف المسابقة.</p><p><em>الطالب:</em> تتنافس المجموعات.</p></div></div><p class=\"sum\">مجموع زمن الحصة: ٤٠ دقيقة</p></div>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>أي عملية ناتجها قرابة ١٠٠: ٤٫٩ × ٢١ أم ٩٫٨ × ١٫١؟<div class=\"ans\">الإجابة: ٤٫٩ × ٢١</div></li><li><span class=\"tier t1\">متوقع</span>احسب ٦٫٤ × ٣ ثم تحقق بالقسمة<div class=\"ans\">الإجابة: ١٩٫٢، و ١٩٫٢ ÷ ٣ = ٦٫٤</div></li><li><span class=\"tier t2\">متقدم</span>احسب ١٢٫٦ ÷ ٠٫١ + ٣٫٤ × ١٠<div class=\"ans\">الإجابة: ١٦٠</div></li></ol>", "<ol class=\"qs\"><li><span class=\"tier t0\">دعم</span>قرب ٣٫٨٦ لأقرب منزلة عشرية<div class=\"ans\">الإجابة: ٣٫٩</div></li><li><span class=\"tier t1\">متوقع</span>احسب: ٤٫٨ - ٢٫٣٥ + ١٫٢<div class=\"ans\">
