<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><script src="/assets/pkgmode.js" data-role="gate"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المستجدات – منصة أفق التعليمية</title>
<style>
:root{--bg:#F3F6FB;--card:#FFFFFF;--ink:#16213A;--muted:#5B6782;--line:#DCE3EE;--brand:#2F6FB3;--brand-ink:#FFFFFF;--t1:#C2367A;--t2:#0E8C8C;--t3:#D98A0B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#18223A;--ink:#E8EDF7;--muted:#9AA6C2;--line:#2B3756;--brand:#6EA8FF;--brand-ink:#0F1626;--t1:#F062A4;--t2:#2EC4C4;--t3:#F2B035}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#18223A;--ink:#E8EDF7;--muted:#9AA6C2;--line:#2B3756;--brand:#6EA8FF;--brand-ink:#0F1626;--t1:#F062A4;--t2:#2EC4C4;--t3:#F2B035}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.75}
header{background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:820px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:24px;font-weight:800;text-decoration:none;flex:none}
.top h1{margin:0;font-size:clamp(20px,4vw,26px);line-height:1.3}
.top p{margin:0;color:var(--muted);font-size:14.5px}
.top a.back{color:var(--brand);text-decoration:none;font-weight:700}
main{max-width:820px;margin:0 auto;padding:24px 16px 56px;display:grid;gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:16px 18px}
.item.pin{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px;font-size:13px;color:var(--muted)}
.tag{font-weight:700;border-radius:999px;padding:1px 10px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.new{font-weight:800;border-radius:999px;padding:1px 10px;background:var(--brand);color:var(--brand-ink)}
.item h2{margin:0;font-size:18px;line-height:1.5}
.item p{margin:6px 0 0;color:var(--ink);white-space:pre-wrap}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 16px 24px}
footer b{direction:ltr;unicode-bidi:isolate;color:var(--brand)}
</style>
</head>
<body>
<header><div class="top">
  <a class="logo" href="../" aria-label="منصة أفق التعليمية">أ</a>
  <div><h1>المستجدات</h1><p><a class="back" href="../">→ المنصة</a> · آخر الإعلانات والنشرات</p></div>
</div></header>
<main id="list"><p class="empty">جارٍ التحميل…</p></main>
<footer>© منصة أفق التعليمية · للتواصل: <b>76506037</b></footer>
<script>
(function(){
  var C={'إعلان':'var(--t1)','تحديث':'var(--t2)','نشرة':'var(--t3)'}, KEY='afuq-news-seen', seen='';
  try{ seen=localStorage.getItem(KEY)||''; }catch(e){}
  function fmt(d){ try{ return new Date(d).toLocaleDateString('ar-OM',{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return (d||'').slice(0,10); } }
  function el(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; }
  fetch('news.json',{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(list){
    var L=document.getElementById('list'); L.replaceChildren();
    list=(Array.isArray(list)?list:[]).slice().sort(function(a,b){ return (!!b.pin-!!a.pin)||(a.date<b.date?1:-1); });
    if(!list.length){ L.append(el('p','empty','لا توجد مستجدات حاليًا.')); return; }
    var latest='';
    list.forEach(function(n){
      if(n.date>latest) latest=n.date;
      var a=el('article','item'+(n.pin?' pin':'')); a.style.setProperty('--c',C[n.type]||'var(--brand)');
      var m=el('div','meta'); m.append(el('span','tag',n.type||'إعلان'));
      if(n.pin) m.append(el('span',null,'📌 مثبّت'));
      if(seen && n.date>seen) m.append(el('span','new','جديد'));
      m.append(el('span',null,fmt(n.date)));
      a.append(m, el('h2',null,n.title)); if(n.body) a.append(el('p',null,n.body));
      L.append(a);
    });
    try{ localStorage.setItem(KEY,latest); }catch(e){}
  }).catch(function(){ document.getElementById('list').replaceChildren(el('p','empty','تعذّر تحميل المستجدات. حاول لاحقًا.')); });
})();
</script>
</body>
</html>
