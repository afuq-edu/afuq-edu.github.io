:root{--ink:#26344f;--mute:#6b7894;--line:#d9e3f2;--paper:#fbfcff;--grid:#e9eff9;--blue:#4c6fb8;--blue2:#e7effb;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Taj,system-ui,sans-serif;color:var(--ink);background:var(--paper);

button{font-family:inherit;cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:18px 18px 40px;min-height:100%}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#34508f}
.brand svg{width:34px;height:34px}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;color:var(--blue)}
.icon-btn:focus-visible,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid #9fbdf0;outline-offset:2px}
.screen{display:none}.screen.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px;color:#34508f}
.step-h b{width:28px;height:28px;border-radius:50%;background:var(--blue2);display:grid;place-items:center;font-size:14px}
select,input[type=text]{font-family:inherit;font-size:17px;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:15.5px;color:var(--ink);transition:.2s}
.chip.on{background:var(--blue2);border-color:#a9c2ec;color:#2d4c8f;font-weight:700}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--blue)}
.stepper output{font-size:26px;font-weight:700;min-width:30px;text-align:center}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.nm{display:flex;align-items:center;gap:8px}
.nm svg{flex:none;width:34px;height:34px}
input[type=range]{width:100%;accent-color:#5b7fc8}
.btn{border:none;border-radius:14px;padding:13px 26px;font-size:18px;font-weight:700;background:#dfe9fa;color:#2d4c8f;transition:.2s}
.btn.main{background:#cfe6dc;color:#1f6b53}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(.97);transform:translateY(-1px)}
.center{text-align:center}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
/* question */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;color:var(--mute)}
.pill strong{color:var(--ink)}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#dbe4f3;margin:0 2px}
.dots i.on{background:#7ea0dc}
.turn{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.turn svg{width:40px;height:40px}
.qwrap{display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:start}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 28px;min-height:170px;display:flex;align-items:center}
.qtext{font-size:clamp(22px,2.6vw,32px);line-height:1.6;font-weight:500}
.timer{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.timer svg{width:170px;height:170px}
.timer .sec{font-size:44px;font-weight:700;fill:var(--ink)}
.timer .lbl{font-size:13px;fill:var(--mute)}
.ptsnow{font-size:15px;color:var(--mute)}.ptsnow b{color:var(--mint);font-size:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;font-size:clamp(19px,2vw,25px);color:var(--ink);transition:.2s;min-height:72px}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:700}
.opt:nth-child(1) .k{background:#e7effb;color:#3d5fa8}.opt:nth-child(2) .k{background:#e3f5ee;color:#2f8f72}
.opt:nth-child(3) .k{background:#fdf1e3;color:#a86a1d}.opt:nth-child(4) .k{background:#f1edfb;color:#6253b0}
.opt:hover:not(:disabled){border-color:#a9c2ec;transform:translateY(-2px)}
.opt.ok{background:var(--mint2);border-color:#8fd3b9}.opt.no{background:var(--rose2);border-color:#efb3c1}
.opt:disabled{cursor:default}
.fill{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.fill input{flex:1;min-width:200px;font-size:28px;text-align:center;direction:ltr;font-family:inherit;border:1.5px solid var(--line);border-radius:16px;padding:12px}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}
.pad button{border:1px solid var(--line);background:#fff;border-radius:12px;font-size:22px;padding:10px 0;color:var(--ink)}
.fb{margin-top:16px;border-radius:16px;padding:14px 18px;font-size:19px;display:none}
.fb.on{display:block;animation:in .35s ease}
.fb.good{background:var(--mint2);color:#1f6b53}.fb.bad{background:var(--rose2);color:#9a3c53}
.fb .pts{font-weight:700;font-size:22px;margin-right:6px}
.nav{display:flex;justify-content:center;gap:12px;margin-top:16px}
/* turn screen */
.big-turn{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 10px}
.big-turn svg{width:120px;height:120px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.big-turn h2{margin:0;font-size:34px}
.pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pick button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;font-size:18px}
.pick button svg{width:30px;height:30px;animation:none}
.pick button.on{border-color:#8fb0e6;background:var(--blue2)}
/* chart */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:330px;padding:10px 10px 0;border-bottom:2px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:clamp(70px,12vw,120px)}
.col .v{font-weight:700;font-size:20px;margin-bottom:6px}
.col .b{width:100%;border-radius:14px 14px 4px 4px;height:4px;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}

.res-h{text-align:center;margin:4px 0 6px;font-size:22px}
.res-sub{text-align:center;color:var(--mute);margin:0 0 10px}

const SH=[c=>`<circle cx="20" cy="20" r="15" fill="${c}"/>`,c=>`<path d="M20 5 35 33H5z" fill="${c}"/>`,c=>`<rect x="6" y="6" width="28" height="28" rx="6" fill="${c}"/>`,
c=>`<path d="M20 4l14 8v16l-14 8-14-8V12z" fill="${c}"/>`,c=>`<path d="M20 4 36 20 20 36 4 20z" fill="${c}"/>`,c=>`<path d="M20 4l4.7 10 10.8 1.3-8 7.4 2.1 10.7L20 28l-9.6 5.4 2.1-10.7-8-7.4L15.3 14z" fill="${c}"/>`];
const icon=i=>`<svg viewBox="0 0 40 40" aria-hidden="true">${SH[i](COLORS[i])}</svg>`;
const DEF=["المثلثات","الدوائر","المربعات","السداسيات","المعيّنات","النجوم"];
const $=id=>document.getElementById(id);
let st={lesson:null,period:1,g:4,names:[...DEF],mode:"rot",n:10};
/* ---------- audio ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,type="sine",v=.12){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);
 o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
const SND={tick:()=>tone(880,0,.08,"sine",.05),ok:()=>{tone(659,0,.25);tone(880,.12,.35)},no:()=>{tone(330,0,.3,"triangle",.09);tone(262,.15,.4,"triangle",.08)},
 res:()=>[523,659,784].forEach((f,i)=>tone(f,i*.12,.4,"sine",.09)),fin:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.16,.5,"sine",.08)),tap:()=>tone(600,0,.05,"sine",.04)};
$("mute").onclick=()=>{muted=!muted;$("wave").style.display=muted?"none":"";$("mute").setAttribute("aria-label",muted?"تشغيل الصوت":"كتم الصوت")};
/* ---------- setup ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo({top:0,behavior:"smooth"})}
function fillLessons(){const sel=$("lesson");let html="",u=null;
 DATA.forEach((L,i)=>{if(L.unit!==u){if(u!==null)html+="</optgroup>";u=L.unit;html+=`<optgroup label="${L.unitName}">`}html+=`<option value="${i}">${L.id} ${L.title}</option>`});
 sel.innerHTML=html+"</optgroup>";sel.onchange=()=>{st.lesson=+sel.value;st.period=1;fillPeriods()};st.lesson=0;fillPeriods()}
function fillPeriods(){const L=DATA[st.lesson];$("periods").innerHTML=L.topics.map((t,i)=>`<button class="chip ${i+1===st.period?"on":""}" data-p="${i+1}">الحصة ${i+1}: ${t}</button>`).join("");
 $("periods").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.period=+b.dataset.p;fillPeriods()});
 const cnt=L.qs.filter(q=>q.p===st.period).length;$("phint").textContent=`أسئلة هذه الحصة: ${cnt} • أسئلة الدرس كاملًا: ${L.qs.length}. تُقدَّم أسئلة الحصة المختارة أولًا، ويُكمَل من حصص الدرس الأخرى عند الحاجة.`;
 $("where").textContent=`${L.id} ${L.title}`}
function fillNames(){$("gcount").textContent=st.g;$("names").innerHTML=Array.from({length:st.g},(_,i)=>`<label class="nm">${icon(i)}<input type="text" value="${st.names[i]}" data-i="${i}" aria-label="اسم المجموعة ${i+1}"></label>`).join("");
 $("names").querySelectorAll("input").forEach(x=>x.oninput=()=>st.names[+x.dataset.i]=x.value.trim()||DEF[+x.dataset.i])}
$("gminus").onclick=()=>{if(st.g>2){st.g--;fillNames();SND.tap()}};$("gplus").onclick=()=>{if(st.g<6){st.g++;fillNames();SND.tap()}};
$("mode").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;$("mode").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b))});
function setN(n){st.n=n;$("qn").textContent=n;$("qrange").value=n;$("quick").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",+x.dataset.n===n))}
$("qrange").oninput=e=>setN(+e.target.value);$("quick").querySelectorAll(".chip").forEach(b=>b.onclick=()=>setN(+b.dataset.n));
/* ---------- game ---------- */
let G=null,timer=null;
function pickQs(){const L=DATA[st.lesson];const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 const own=sh(L.qs.filter(q=>q.p===st.period)),oth=sh(L.qs.filter(q=>q.p!==st.period));
 let pool=[];
 if(own.length>=st.n){ // keep spread of difficulty
  const by=[1,2,3].map(d=>own.filter(q=>q.d===d));let i=0;while(pool.length<st.n){const b=by[i%3];if(b.length)pool.push(b.shift());i++}}
 else pool=own.concat(oth.slice(0,st.n-own.length));
 return pool.sort((a,b)=>a.d-b.d||((b.p===st.period)-(a.p===st.period)))}
$("start").onclick=()=>{ac();const qs=pickQs();G={qs,i:0,score:Array(st.g).fill(0),last:Array(st.g).fill(0),turn:0,names:st.names.slice(0,st.g),cur:0};nextTurn()};
function nextTurn(){const box=$("turnbox");
 if(st.mode==="rot"){G.cur=G.i%st.g;box.innerHTML=`${icon(G.cur)}<h2>دور ${G.names[G.cur]}</h2><p class="hint">السؤال ${G.i+1} من ${G.qs.length}</p><button class="btn main" id="go">اعرض السؤال</button>`;$("go").onclick=startQ}
 else{box.innerHTML=`<h2>أي مجموعة تجيب عن السؤال ${G.i+1}؟</h2><div class="pick">${G.names.map((n,i)=>`<button data-i="${i}">${icon(i)}${n}</button>`).join("")}</div><button class="btn main" id="go" disabled>اعرض السؤال</button>`;
  box.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{G.cur=+b.dataset.i;box.querySelectorAll(".pick button").forEach(x=>x.classList.toggle("on",x===b));$("go").disabled=false;SND.tap()});$("go").onclick=startQ}
 show("s-turn")}
function pointsAt(t){if(t<=30)return Math.round((1000-t/30*500)/10)*10;if(t<=60)return Math.round((500-(t-30)/30*400)/10)*10;return 100}
const NORM=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[−–]/g,"-").replace(/٫/g,".").replace(/،/g,",").replace(/\s+/g,"").toLowerCase();
function startQ(){const q=G.qs[G.i];G.done=false;show("s-q");
 $("qturn").innerHTML=icon(G.cur)+G.names[G.cur];$("qi").textContent=`${G.i+1} / ${G.qs.length}`;
 $("qtag").textContent=`الحصة ${q.p}`;$("qd").innerHTML=[1,2,3].map(d=>`<i class="${d<=q.d?"on":""}"></i>`).join("");
 $("qtext").innerHTML=q.q;$("fb").className="fb";$("toRes").hidden=true;
 const A=$("answers");
 if(q.t==="mc"){A.innerHTML=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"أبجد"[i]}</span><span>${o}</span></button>`).join("")}</div>`;
  A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i===q.a,b))}
 else if(q.t==="tf"){A.innerHTML=`<div class="opts"><button class="opt" data-v="1"><span class="k">✓</span><span>صواب</span></button><button class="opt" data-v="0"><span class="k">✗</span><span>خطأ</span></button></div>`;
  A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer((b.dataset.v==="1")===q.a,b))}
 else{A.innerHTML=`<div class="fill"><input id="fin" inputmode="decimal" autocomplete="off" aria-label="اكتب الإجابة"><button class="btn main" id="fchk">تحقق</button></div>
  <div class="pad">${["7","8","9","4","5","6","−","1","2","3","0",".","/","⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div>`;
  const inp=$("fin");A.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;inp.value=k==="⌫"?inp.value.slice(0,-1):inp.value+(k==="−"?"-":k);SND.tap()});
  const chk=()=>{if(!inp.value.trim())return;const v=NORM(inp.value);answer(q.a.some(x=>NORM(x)===v),null)};$("fchk").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter")chk()};setTimeout(()=>inp.focus(),300)}
 G.t0=performance.now();clearInterval(timer);tick();timer=setInterval(tick,200)}
function tick(){const t=(performance.now()-G.t0)/1000;const ring=$("ring"),C=326.7;
 if(t<=30){const r=30-t;$("tsec").textContent=Math.ceil(r);$("tlbl").textContent="ثانية";ring.style.strokeDashoffset=C*(1-r/30);ring.style.stroke=r>10?"#86c9b0":"#f0c27f";
  const s=Math.ceil(r);if(s<=5&&s!==G.lastTick){G.lastTick=s;SND.tick()}}
 else{$("tsec").textContent="+"+Math.floor(t-30);$("tlbl").textContent="وقت إضافي";ring.style.stroke="#e9a9b8";ring.style.strokeDashoffset=C*Math.min(1,(t-30)/30)}
 $("pnow").textContent=pointsAt(t)}
function answer(ok,btn){if(G.done)return;G.done=true;clearInterval(timer);const q=G.qs[G.i];const t=(performance.now()-G.t0)/1000;const pts=ok?pointsAt(t):0;
 G.last=Array(st.g).fill(0);G.last[G.cur]=pts;G.score[G.cur]+=pts;
 document.querySelectorAll("#answers button,#answers input").forEach(b=>b.disabled=true);
 if(q.t==="mc"){document.querySelectorAll(".opt").forEach((b,i)=>{if(i===q.a)b.classList.add("ok");else if(b===btn)b.classList.add("no")})}
 if(q.t==="tf"){document.querySelectorAll(".opt").forEach(b=>{const v=b.dataset.v==="1";if(v===q.a)b.classList.add("ok");else if(b===btn)b.classList.add("no")})}
 const fb=$("fb");fb.className="fb on "+(ok?"good":"bad");
 fb.innerHTML=ok?`إجابة صحيحة <span class="pts">+${pts}</span> في ${t.toFixed(1)} ثانية`:`الإجابة الصحيحة: <b>${q.show}</b>${q.why?`<br><span style="font-size:16px">${q.why}</span>`:""}`;
 (ok?SND.ok:SND.no)();$("toRes").hidden=false;$("toRes").focus()}
$("toRes").onclick=results;
function ranks(){const o=G.score.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]);const r=[];o.forEach(([s,i],k)=>{r[i]=k>0&&s===o[k-1][0]?r[o[k-1][1]]:k+1});return r}
function results(){show("s-res");const mx=Math.max(1,...G.score);const r=ranks();const pts=G.last[G.cur];
 $("rh").textContent=pts>0?`${G.names[G.cur]} تكسب ${pts} نقطة`:`لم تُحسب نقاط لهذا السؤال`;
 $("rs").textContent=`بعد ${G.i+1} من ${G.qs.length} أسئلة`;
 $("chart").innerHTML=G.score.map((s,i)=>`<div class="col ${G.last[i]>0?"win":""}"><div class="v" data-v="${s}">0</div><div class="b" style="background:${COLORS[i]}"><span class="gain">+${G.last[i]}</span></div></div>`).join("");
 $("labels").innerHTML=G.names.map((n,i)=>`<div>${icon(i)}${n}<br><span class="rank">المركز ${r[i]}</span></div>`).join("");
 requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll("#chart .col").forEach((c,i)=>{c.querySelector(".b").style.height=Math.max(4,G.score[i]/mx*270)+"px";countUp(c.querySelector(".v"),G.score[i]-G.last[i],G.score[i])})}));
 SND.res();$("next").textContent=G.i+1<G.qs.length?"السؤال التالي":"منصة التتويج"}
function countUp(el,a,b){const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/1000);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
$("next").onclick=()=>{G.i++;if(G.i<G.qs.length)nextTurn();else finale()};
function finale(){show("s-end");const o=G.score.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]);const r=ranks();
 const L=DATA[st.lesson];$("es").textContent=`${L.id} ${L.title} • ${G.qs.length} أسئلة`;
 const slots=[1,0,2].filter(k=>k<o.length),H=[200,260,150];
 $("podium").innerHTML=slots.map(k=>{const[s,i]=o[k];return `<div class="pod" data-h="${[260,200,150][k]}">${icon(i)}<div class="nm2">${G.names[i]}</div><div class="sc">${s} نقطة</div><div class="blk" style="background:${COLORS[i]}">${r[i]}</div></div>`}).join("");
 $("rest").innerHTML=o.slice(3).map(([s,i])=>`<div><span>${r[i]}. ${G.names[i]}</span><b>${s}</b></div>`).join("");
 setTimeout(()=>document.querySelectorAll(".pod").forEach(p=>{p.querySelector(".blk").style.height=p.dataset.h+"px";p.classList.add("show")}),100);
 SND.fin();confetti()}
$("again").onclick=()=>{fx.clearRect(0,0,cv.width,cv.height);show("s-setup")};
/* gentle confetti */
const cv=$("fx"),fx=cv.getContext("2d");
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;cv.width=innerWidth;cv.height=innerHeight;
 const P=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,s:5+Math.random()*7,v:1+Math.random()*1.8,w:Math.random()*6,c:COLORS[Math.floor(Math.random()*6)],k:Math.floor(Math.random()*3)}));
 const t0=performance.now();(function f(now){fx.clearRect(0,0,cv.width,cv.height);const age=(now-t0)/1000;
  P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.w+p.y/40)*.8;fx.globalAlpha=Math.max(0,Math.min(1,(6-age)/2));fx.fillStyle=p.c;fx.beginPath();
   if(p.k===0)fx.arc(p.x,p.y,p.s/2,0,7);else if(p.k===1){fx.moveTo(p.x,p.y-p.s/2);fx.lineTo(p.x+p.s/2,p.y+p.s/2);fx.lineTo(p.x-p.s/2,p.y+p.s/2)}else fx.rect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);fx.fill()});
  if(age<6)requestAnimationFrame(f);else fx.clearRect(0,0,cv.width,cv.height)})(t0)}
fillLessons();fillNames();setN(10);
</script>
