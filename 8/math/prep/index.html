شبكة مكعب مرقّمة، كيف تحدد الوجه المقابل للوجه 1؟</td><td class='ans'>الوجه المقابل لا يشترك معه في حرف، ويفصله عنه وجه واحد في الشبكة</td></tr></tbody></table>", "عزيزي الطالب: ارسم شبكة متوازي مستطيلات لعلبة من منزلك وقصها واطوها، وراجع مثال 3-1 ص 49. ولي الأمر الكريم: وفّر لابنك علبة فارغة ليفكها ويقيس أبعادها."]}, {"head": {"lesson": "3-1 رسم شبكات للمجسمات", "unit": "الوحدة الثالثة: الشبكات والزوايا", "week": "الأسبوع الخامس: 4–8/10/2026م", "pages": "كتاب الطالب ص 49–51 • كتاب النشاط ص 30–32 • دليل المعلم ص 51–52", "num": "الحصة 2 من 2", "topic": "رسم شبكات المنشور الثلاثي والهرم"}, "plain": ["1) يرسم شبكة منشور ثلاثي وهرم رباعي باستخدام المسطرة والفرجار.\n2) يتخيل المجسم الناتج من شبكة معطاة ويصفه.\n3) يربط بين أبعاد الشبكة وأبعاد المجسم الناتج. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، الأقلام، نماذج مجسمة، أخرى: فرجار ومسطرة وورق مقوى", "المنشور الثلاثي، الهرم، القاعدة، الوجه الجانبي، الشبكة", "يعرض المعلم نماذج مجسمة لمنشور ثلاثي وهرم رباعي ويسأل: كم وجهًا لكل منهما؟ وما أشكال الأوجه؟ التعلم القبلي: رسم شبكة المكعب ومتوازي المستطيلات من الحصة السابقة، ورسم المثلث باستخدام الفرجار.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض المجسمين ويطلب وصف الأوجه.\nالطالب: يعد الأوجه ويصف أشكالها.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج رسم شبكة منشور ثلاثي قاعدته مثلث متطابق الأضلاع طول ضلعه 4 سم باستخدام الفرجار، ثم شبكة هرم رباعي قاعدته مربعة.\nالطالب: يرسم الشبكتين خطوة بخطوة.\n3) التخيل (8 دقائق):\nالمعلم: يناقش السؤال الذي يجد فيه الطلاب صعوبة في تخيل الطي (السؤال 5 من تمارين 3-1)، ويسمح باستخدام النماذج للتحقق.\nالطالب: يتنبأ ثم يتحقق بالطي.\n4) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 30–32.\nالطالب: يحل فرديًا.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: كم وجهًا للمنشور الثلاثي؟\nالإجابة النموذجية: 5 أوجه: قاعدتان مثلثتان و3 مستطيلات\nس2 [المستوى المتوقع]: ما أشكال الأوجه في شبكة هرم رباعي قاعدته مربعة؟\nالإجابة النموذجية: مربع واحد و4 مثلثات\nس3 [المستوى المتقدم]: شبكة منشور ثلاثي مستطيلاتها 6 × 4 سم. ما طول المنشور وطول ضلع قاعدته المثلثة إن كانت متطابقة الأضلاع؟\nالإجابة النموذجية: طول المنشور 6 سم وضلع القاعدة 4 سم (أو العكس بحسب الرسم)", "س1 [مستوى الدعم]: كم رأسًا للهرم الرباعي؟\nالإجابة النموذجية: 5 رؤوس\nس2 [المستوى المتوقع]: ارسم شبكة منشور ثلاثي قاعدته مثلث متطابق الأضلاع ضلعه 3 سم وطوله 5 سم.\nالإجابة النموذجية: شبكة من 3 مستطيلات 5 × 3 ومثلثين متطابقي الأضلاع\nس3 [المستوى المتقدم]: لماذا نحتاج إلى الفرجار في رسم القاعدة المثلثة بدقة؟\nالإجابة النموذجية: لتحديد الرأس الثالث على بعدين محددين من طرفي الضلع", "عزيزي الطالب: أكمل كتاب النشاط ص 30–32، وصمم شبكة هرم من ورق مقوى. ولي الأمر الكريم: شجع ابنك على عرض المجسم الذي صنعه للأسرة."], "html": ["<ol class='ol'><li>يرسم شبكة منشور ثلاثي وهرم رباعي باستخدام المسطرة والفرجار.</li><li>يتخيل المجسم الناتج من شبكة معطاة ويصفه.</li><li>يربط بين أبعاد الشبكة وأبعاد المجسم الناتج. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>الأقلام</span><span>نماذج مجسمة</span><span>أخرى: فرجار ومسطرة وورق مقوى</span></div>", "المنشور الثلاثي، الهرم، القاعدة، الوجه الجانبي، الشبكة", "يعرض المعلم نماذج مجسمة لمنشور ثلاثي وهرم رباعي ويسأل: كم وجهًا لكل منهما؟ وما أشكال الأوجه؟ التعلم القبلي: رسم شبكة المكعب ومتوازي المستطيلات من الحصة السابقة، ورسم المثلث باستخدام الفرجار.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض المجسمين ويطلب وصف الأوجه.</td><td>يعد الأوجه ويصف أشكالها.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph ؟</td><td class='ans'>لتحديد الرأس الثالث على بعدين محددين من طرفي الضلع</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 30–32، وصمم شبكة هرم من ورق مقوى. ولي الأمر الكريم: شجع ابنك على عرض المجسم الذي صنعه للأسرة."]}]}, {"id": "3-2", "title": "شرح خصائص الزوايا", "periods": [{"head": {"lesson": "3-2 شرح خصائص الزوايا", "unit": "الوحدة الثالثة: الشبكات والزوايا", "week": "الأسبوع الخامس: 4–8/10/2026م", "pages": "كتاب الطالب ص 52–55 • كتاب النشاط ص 33–34 • دليل المعلم ص 53–54", "num": "الحصة 1 من 3", "topic": "الزوايا على خط مستقيم وحول نقطة والزوايا المتقابلة بالرأس"}, "plain": ["1) يتذكر أن مجموع الزوايا على خط مستقيم 180° وحول نقطة 360°.\n2) يثبت أن الزاويتين المتقابلتين بالرأس متساويتان باستخدام زوايا الخط المستقيم.\n3) يحسب زوايا مجهولة مع ذكر السبب. (مخرج تعليمي آخر)", "المخرج 1: تذكر\nالمخرج 2: فهم\nمخرج آخر: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: منقلة ومسطرة", "الزوايا المتقابلة بالرأس، الزوايا على خط مستقيم، الزوايا حول نقطة، البرهان", "يرسم المعلم مستقيمين متقاطعين ويطلب قياس الزوايا الأربع بالمنقلة: ماذا تلاحظ؟ التعلم القبلي: أنواع الزوايا وقياسها بالمنقلة ومجموع الزوايا على خط مستقيم.", "1) التهيئة (5 دقائق):\nالمعلم: يرسم المستقيمين ويطلب القياس.\nالطالب: يقيس ويلاحظ تساوي الزاويتين المتقابلتين.\n2) الاستنتاج (10 دقائق):\nالمعلم: يقود الطلاب إلى برهان: أ + ب = 180° وب + ج = 180° إذن أ = ج.\nالطالب: يكتب البرهان بخطوات وأسباب.\n3) النمذجة (8 دقائق):\nالمعلم: ينمذج حساب زوايا مجهولة على خط مستقيم وحول نقطة مع كتابة السبب بعد كل خطوة.\nالطالب: يكتب السبب لكل خطوة.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 3-2 ص 53.\nالطالب: يحل فرديًا مع ذكر الأسباب.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: زاويتان على خط مستقيم، إحداهما 65°. ما الأخرى؟\nالإجابة النموذجية: 115°\nس2 [المستوى المتوقع]: ثلاث زوايا حول نقطة: 120°، 95°، س. أوجد س.\nالإجابة النموذجية: س = 360° − 215° = 145°\nس3 [المستوى المتقدم]: أثبت أن الزاويتين المتقابلتين بالرأس متساويتان.\nالإجابة النموذجية: كل منهما مع الزاوية المجاورة تكمل 180°، فهما متساويتان", "س1 [مستوى الدعم]: ما مجموع الزوايا حول نقطة؟\nالإجابة النموذجية: 360°\nس2 [المستوى المتوقع]: مستقيمان متقاطعان، إحدى الزوايا 38°. أوجد الزوايا الثلاث الأخرى.\nالإجابة النموذجية: 142°، 38°، 142°\nس3 [المستوى المتقدم]: زاويتان على خط مستقيم قياساهما 2س و3س. أوجد س.\nالإجابة النموذجية: 5س = 180° ومنها س = 36°", "عزيزي الطالب: راجع الحقائق في ص 52 واحفظ أسماء العلاقات بين الزوايا. ولي الأمر الكريم: اطلب من ابنك أن يريك زوايا متقابلة بالرأس في مقص أو تقاطع طرق."], "html": ["<ol class='ol'><li>يتذكر أن مجموع الزوايا على خط مستقيم <span class=\"m\">180°</span> وحول نقطة <span class=\"m\">360°</span>.</li><li>يثبت أن الزاويتين المتقابلتين بالرأس متساويتان باستخدام زوايا الخط المستقيم.</li><li>يحسب زوايا مجهولة مع ذكر السبب. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تذكر</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تطبيق</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: منقلة ومسطرة</span></div>", "الزوايا المتقابلة بالرأس، الزوايا على خط مستقيم، الزوايا حول نقطة، البرهان", "يرسم المعلم مستقيمين متقاطعين ويطلب قياس الزوايا الأربع بالمنقلة: ماذا تلاحظ؟ التعلم القبلي: أنواع الزوايا وقياسها بالمنقلة ومجموع الزوايا على خط مستقيم.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يرسم المستقيمين ويطلب القياس.</td><td>يقيس ويلاحظ تساوي الزاويتين المتقابلتين.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الاستنتاج</td><td>يقود الطلاب إلى برهان: <span class=\"m\">أ + ب = 180°</span> و<span class=\"m\">ب + ج = 180°</span> إذن <span class=\"m\">أ = ج</span>.</td><td>يكتب البرهان بخطوات وأسباب.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج حساب زوايا مجهولة على خط مستقيم وحول نقطة مع كتابة السبب بعد كل خطوة.</td><td>يكتب السبب لكل خطوة.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 3-2 ص 53.</td><td>يحل فرديًا مع ذكر الأسباب.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>زاويتان على خط مستقيم، إحداهما <span class=\"m\">65°</span>. ما الأخرى؟</td><td class='ans'><span class=\"m\">115°</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ثلاث زوايا حول نقطة: <span class=\"m\">120°</span>، <span class=\"m\">95°</span>، س. أوجد س.</td><td class='ans'><span class=\"m\">س = 360° − 215° = 145°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أثبت أن الزاويتين المتقابلتين بالرأس متساويتان.</td><td class='ans'>كل منهما مع الزاوية المجاورة تكمل <span class=\"m\">180°</span>، فهما متساويتان</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما مجموع الزوايا حول نقطة؟</td><td class='ans'><span class=\"m\">360°</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>مستقيمان متقاطعان، إحدى الزوايا <span class=\"m\">38°</span>. أوجد الزوايا الثلاث الأخرى.</td><td class='ans'><span class=\"m\">142°</span>، <span class=\"m\">38°</span>، <span class=\"m\">142°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>زاويتان على خط مستقيم قياساهما <span class=\"m\">2س</span> و<span class=\"m\">3س</span>. أوجد س.</td><td class='ans'><span class=\"m\">5س = 180°</span> ومنها <span class=\"m\">س = 36°</span></td></tr></tbody></table>", "عزيزي الطالب: راجع الحقائق في ص 52 واحفظ أسماء العلاقات بين الزوايا. ولي الأمر الكريم: اطلب من ابنك أن يريك زوايا متقابلة بالرأس في مقص أو تقاطع طرق."]}, {"head": {"lesson": "3-2 شرح خصائص الزوايا", "unit": "الوحدة الثالثة: الشبكات والزوايا", "week": "الأسبوع الخامس: 4–8/10/2026م", "pages": "كتاب الطالب ص 52–55 • كتاب النشاط ص 33–34 • دليل المعلم ص 53–54", "num": "الحصة 2 من 3", "topic": "الزوايا الناتجة عن قطع مستقيمين متوازيين بقاطع"}, "plain": ["1) يتعرف على الزوايا المتناظرة والمتبادلة الناتجة عن مستقيمين متوازيين وقاطع.\n2) يحسب الزوايا المجهولة باستخدام التناظر والتبادل مع ذكر السبب.\n3) يحدد ما إذا كان مستقيمان متوازيين من قياسات الزوايا. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، أخرى: منقلة ومسطرة وورق شفاف", "المستقيمات المتوازية، القاطع، الزوايا المتناظرة، الزوايا المتبادلة", "يعرض المعلم صورة سكة حديد يقطعها طريق، ويسأل: أي الزوايا تبدو متساوية؟ التعلم القبلي: الزوايا المتقابلة بالرأس وزوايا الخط المستقيم من الحصة السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الصورة ويطلب تحديد الزوايا المتساوية.\nالطالب: يشير إلى الزوايا المتساوية.\n2) الاكتشاف (11 دقيقة):\nالمعلم: يطلب رسم مستقيمين متوازيين على ورق مسطر وقاطع، وقياس الزوايا الثماني، ثم تتبع زاوية بورق شفاف وتحريكها على القاطع.\nالطالب: يكتشف تساوي المتناظرة والمتبادلة.\n3) النمذجة (8 دقائق):\nالمعلم: يسمي الأنواع كما في ص 52–53 ويرسم شكلي F وZ للمساعدة على التمييز، وينمذج مثالًا بأسباب.\nالطالب: يحدد الأنواع في أشكال معروضة.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بأسئلة الزوايا والمستقيمات المتوازية من تمارين 3-2 ص 54.\nالطالب: يحل في أزواج.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: زاويتان متناظرتان، إحداهما 70°. ما الأخرى؟\nالإجابة النموذجية: 70°\nس2 [المستوى المتوقع]: زاوية 115° عند تقاطع قاطع مع أحد مستقيمين متوازيين. أوجد الزاوية المتبادلة معها والزاوية المجاورة لها على الخط المستقيم.\nالإجابة النموذجية: المتبادلة 115° والمجاورة 65°\nس3 [المستوى المتقدم]: زاويتان متبادلتان قياساهما 72° و75°. هل المستقيمان متوازيان؟ برّر.\nالإجابة النموذجية: لا؛ لو كانا متوازيين لتساوت الزاويتان المتبادلتان", "س1 [مستوى الدعم]: ماذا نسمي الزاويتين على شكل الحرف Z؟\nالإجابة النموذجية: زاويتان متبادلتان\nس2 [المستوى المتوقع]: أوجد س إذا كانت س و58° متناظرتين.\nالإجابة النموذجية: س = 58°\nس3 [المستوى المتقدم]: زاويتان داخليتان في جهة واحدة من القاطع بين متوازيين، إحداهما 110°. أوجد الأخرى مع السبب.\nالإجابة النموذجية: 70°؛ المتناظرة مع الأولى 110° تقع على خط مستقيم مع الثانية", "عزيزي الطالب: ارسم مستقيمين متوازيين وقاطعًا ولوّن الأزواج المتناظرة بلون والمتبادلة بلون آخر. ولي الأمر الكريم: ابحث مع ابنك عن مستقيمات متوازية وقاطع في نوافذ المنزل."], "html": ["<ol class='ol'><li>يتعرف على الزوايا المتناظرة والمتبادلة الناتجة عن مستقيمين متوازيين وقاطع.</li><li>يحسب الزوايا المجهولة باستخدام التناظر والتبادل مع ذكر السبب.</li><li>يحدد ما إذا كان مستقيمان متوازيين من قياسات الزوايا. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: منقلة ومسطرة وورق شفاف</span></div>", "المستقيمات المتوازية، القاطع، الزوايا المتناظرة، الزوايا المتبادلة", "يعرض المعلم صورة سكة حديد يقطعها طريق، ويسأل: أي الزوايا تبدو متساوية؟ التعلم القبلي: الزوايا المتقابلة بالرأس وزوايا الخط المستقيم من الحصة السابقة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د ><td>ماذا نسمي الزاويتين على شكل الحرف Z؟</td><td class='ans'>زاويتان متبادلتان</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد س إذا كانت <span class=\"m\">س</span> و<span class=\"m\">58°</span> متناظرتين.</td><td class='ans'><span class=\"m\">س = 58°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>زاويتان داخليتان في جهة واحدة من القاطع بين متوازيين، إحداهما <span class=\"m\">110°</span>. أوجد الأخرى مع السبب.</td><td class='ans'><span class=\"m\">70°</span>؛ المتناظرة مع الأولى <span class=\"m\">110°</span> تقع على خط مستقيم مع الثانية</td></tr></tbody></table>", "عزيزي الطالب: ارسم مستقيمين متوازيين وقاطعًا ولوّن الأزواج المتناظرة بلون والمتبادلة بلون آخر. ولي الأمر الكريم: ابحث مع ابنك عن مستقيمات متوازية وقاطع في نوافذ المنزل."]}, {"head": {"lesson": "3-2 شرح خصائص الزوايا", "unit": "الوحدة الثالثة: الشبكات والزوايا", "week": "الأسبوع الخامس: 4–8/10/2026م", "pages": "كتاب الطالب ص 52–55 • كتاب النشاط ص 33–34 • دليل المعلم ص 53–54", "num": "الحصة 3 من 3", "topic": "برهان مجموع زوايا المثلث والزاوية الخارجية والشكل الرباعي"}, "plain": ["1) يبرهن أن مجموع قياسات زوايا المثلث 180° باستخدام المستقيمات المتوازية.\n2) يستنتج أن الزاوية الخارجية للمثلث تساوي مجموع الزاويتين الداخليتين البعيدتين.\n3) يبرهن أن مجموع زوايا الشكل الرباعي 360° ويطبقه. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تحليل\nمخرج آخر: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: مثلثات ورقية للقص", "مجموع زوايا المثلث، الزاوية الخارجية، الشكل الرباعي، البرهان", "يقص كل طالب مثلثًا ورقيًا ويمزق زواياه الثلاث ويضعها متجاورة: ماذا تكوّن؟ التعلم القبلي: الزوايا المتبادلة والمتناظرة وزوايا الخط المستقيم.", "1) التهيئة (5 دقائق):\nالمعلم: يدير نشاط تمزيق الزوايا.\nالطالب: يلاحظ أن الزوايا تكوّن خطًا مستقيمًا.\n2) البرهان (10 دقائق):\nالمعلم: يرسم مستقيمًا موازيًا لأحد أضلاع المثلث من الرأس المقابل ويقود البرهان بالزوايا المتبادلة، ثم يعرض البرهان البديل في السؤال 4 من تمارين 3-2.\nالطالب: يكمل خطوات البرهان مع الأسباب.\n3) الزاوية الخارجية (8 دقائق):\nالمعلم: يمد ضلعًا في المثلث ويستنتج مع الطلاب علاقة الزاوية الخارجية.\nالطالب: يبرر العلاقة بالجمع والطرح من 180°.\n4) الشكل الرباعي (11 دقيقة):\nالمعلم: يقسم شكلًا رباعيًا بقطر إلى مثلثين، ويناقش البرهان في السؤال 7 من التمارين، ثم يكلف بتمارين كتاب النشاط ص 33–34.\nالطالب: يبرهن ويحل.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: زاويتان في مثلث قياساهما 50° و65°. أوجد الثالثة.\nالإجابة النموذجية: 65°\nس2 [المستوى المتوقع]: زاوية خارجية لمثلث 130° وإحدى الزاويتين الداخليتين البعيدتين 55°. أوجد الأخرى.\nالإجابة النموذجية: 130° − 55° = 75°\nس3 [المستوى المتقدم]: ثلاث زوايا في شكل رباعي: 90°، 85°، 110°. أوجد الرابعة وبرّر.\nالإجابة النموذجية: 75°؛ لأن مجموع زوايا الشكل الرباعي 360° (مثلثان)", "س1 [مستوى الدعم]: ما مجموع زوايا المثلث؟\nالإجابة النموذجية: 180°\nس2 [المستوى المتوقع]: مثلث متطابق الضلعين زاوية رأسه 40°. أوجد زاويتي قاعدته.\nالإجابة النموذجية: كل منهما 70°\nس3 [المستوى المتقدم]: زوايا شكل رباعي س، 2س، 3س، 4س. أوجد أكبر زاوية.\nالإجابة النموذجية: 10س = 360°، س = 36°، وأكبرها 144°", "عزيزي الطالب: أكمل كتاب النشاط ص 33–34، واكتب برهان مجموع زوايا المثلث بأسلوبك. ولي الأمر الكريم: اطلب من ابنك إعادة نشاط تمزيق زوايا المثلث أمامك."], "html": ["<ol class='ol'><li>يبرهن أن مجموع قياسات زوايا المثلث <span class=\"m\">180°</span> باستخدام المستقيمات المتوازية.</li><li>يستنتج أن الزاوية الخارجية للمثلث تساوي مجموع الزاويتين الداخليتين البعيدتين.</li><li>يبرهن أن مجموع زوايا الشكل الرباعي <span class=\"m\">360°</span> ويطبقه. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تطبيق</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: مثلثات ورقية للقص</span></div>", "مجموع زوايا المثلث، الزاوية الخارجية، الشكل الرباعي، البرهان", "يقص كل طالب مثلثًا ورقيًا ويمزق زواياه الثلاث ويضعها متجاورة: ماذا تكوّن؟ التعلم القبلي: الزوايا المتبادلة والمتناظرة وزوايا الخط المستقيم.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يدير نشاط تمزيق الزوايا.</td><td>يلاحظ أن الزوايا تكوّن خطًا مستقيمًا.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>البرهان</td><td>يرسم مستقيمًا موازيًا لأحد أضلاع المثلث من الرأس المقابل ويقود البرهان بالزوايا المتبادلة، ثم يعرض البرهان البديل في السؤال 4 من تمارين 3-2.</td><td>يكمل خطوات البرهان مع الأسباب.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الزاوية الخارجية</td><td>يمد ضلعًا في المثلث ويستنتج مع الطلاب علاقة الزاوية الخارجية.</td><td>يبرر العلاقة بالجمع والطرح من <span class=\"m\">180°</span>.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الشكل الرباعي</td><td>يقسم شكلًا رباعيًا بقطر إلى مثلثين، ويناقش البرهان في السؤال 7 من التمارين، ثم يكلف بتمارين كتاب النشاط ص 33–34.</td><td>يبرهن ويحل.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>زاويتان في مثلث قياساهما <span class=\"m\">50°</span> و<span class=\"m\">65°</span>. أوجد الثالثة.</td><td class='ans'><span class=\"m\">65°</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>زاوية خارجية لمثلث <span class=\"m\">130°</span> وإحدى الزاويتين الداخليتين البعيدتين <span class=\"m\">55°</span>. أوجد الأخرى.</td><td class='ans'><span class=\"m\">130° − 55° = 75°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>ثلاث زوايا في شكل رباعي: <span class=\"m\">90°</span>، <span class=\"m\">85°</span>، <span class=\"m\">110°</span>. أوجد الرابعة وبرّر.</td><td class='ans'><span class=\"m\">75°</span>؛ لأن مجموع زوايا الشكل الرباعي <span class=\"m\">360°</span> (مثلثان)</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما مجموع زوايا المثلث؟</td><td class='ans'><span class=\"m\">180°</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>مثلث متطابق الضلعين زاوية رأسه <span class=\"m\">40°</span>. أوجد زاويتي قاعدته.</td><td class='ans'>كل منهما <span class=\"m\">70°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>زوايا شكل رباعي <span class=\"m\">س</span>، <span class=\"m\">2س</span>، <span class=\"m\">3س</span>، <span class=\"m\">4س</span>. أوجد أكبر زاوية.</td><td class='ans'><span class=\"m\">10س = 360°</span>، <span class=\"m\">س = 36°</span>، وأكبرها <span class=\"m\">144°</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 33–34، واكتب برهان مجموع زوايا المثلث بأسلوبك. ولي الأمر الكريم: اطلب من ابنك إعادة نشاط تمزيق زوايا المثلث أمامك."]}]}, {"id": "3-3", "title": "حل مسائل الزوايا", "periods": [{"head": {"lesson": "3-3 حل مسائل الزوايا", "unit": "الوحدة الثالثة: الشبكات والزوايا", "week": "الأسبوع الخامس: 4–8/10/2026م", "pages": "كتاب الطالب ص 56–59 • كتاب النشاط ص 35–36 • دليل المعلم ص 55–56", "num": "الحصة 1 من 2", "topic": "حل مسائل الزوايا متعددة الخطوات مع التبرير"}, "plain": ["1) يحل مسائل زوايا متعددة الخطوات مستخدمًا خصائص الزوايا والمستقيمات المتوازية والمثلثات.\n2) يكتب سببًا صحيحًا لكل خطوة في الحل.\n3) يختار ترتيبًا مناسبًا لإيجاد الزوايا المجهولة في شكل مركب. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nمخرج آخر: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام", "الاستدلال الهندسي، المستقيمات المتوازية، الزاوية الخارجية، التبرير", "يعرض المعلم شكلًا فيه زاويتان معلومتان وعدة زوايا مجهولة، ويسأل: أي زاوية يمكن إيجادها أولًا؟ ولماذا؟ التعلم القبلي: خصائص الزوايا من الدرس 3-2.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الشكل ويستمع لترتيب الخطوات المقترح.\nالطالب: يقترح البداية ويبرر.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج حل مثال 3-3 ص 56 مع كتابة السبب بعد كل خطوة، ويؤكد أن الدليل يطلب أسبابًا صحيحة لا أرقامًا فقط.\nالطالب: يدوّن الحل بالأسباب.\n3) تعلم تعاوني (12 دقيقة):\nالمعلم: يوزع أسئلة من تمارين 3-3 ص 57–58 (منها السؤالان 1 و2 حيث تُستخدم خصائص الخط المستقيم والمتقابلة بالرأس) على المجموعات، لكل مجموعة سؤال تعرضه.\nالطالب: تحل المجموعة وتعرض الحل بأسبابه، وتعلق المجموعات الأخرى.\n4) الممارسة (7 دقائق):\nالمعلم: يكلف بسؤال فردي إضافي من التمارين.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: في مثلث، زاوية خارجية 120° والزاوية الداخلية المجاورة لها؟\nالإجابة النموذجية: 60° لأنهما على خط مستقيم\nس2 [المستوى المتوقع]: مستقيمان متوازيان يقطعهما قاطع؛ زاوية 3س تبادل زاوية 75°. أوجد س.\nالإجابة النموذجية: 3س = 75° ومنها س = 25°\nس3 [المستوى المتقدم]: مثلث فيه زاويتان س + 20° و2س وزاويته الخارجية عند الرأس الثالث 110°. أوجد س.\nالإجابة النموذجية: س + 20 + 2س = 110 ومنها س = 30°", "س1 [مستوى الدعم]: زاويتان متقابلتان بالرأس إحداهما 47°. ما الأخرى؟\nالإجابة النموذجية: 47°\nس2 [المستوى المتوقع]: مثلث قائم الزاوية إحدى زاويتيه الحادتين 34°. أوجد الأخرى.\nالإجابة النموذجية: 56°\nس3 [المستوى المتقدم]: في شكل رباعي ضلعان متقابلان متوازيان، وزاويتان متتاليتان بينهما إحداهما 68°. أوجد الأخرى مع السبب.\nالإجابة النموذجية: 112°؛ زاويتان داخليتان في جهة واحدة بين متوازيين مجموعهما 180°", "عزيزي الطالب: أعد حل مثال 3-3 ص 56 دون النظر إلى الكتاب واكتب الأسباب. ولي الأمر الكريم: اطلب من ابنك أن يقرأ لك الأسباب التي كتبها في الحل."], "html": ["<ol class='ol'><li>يحل مسائل زوايا متعددة الخطوات مستخدمًا خصائص الزوايا والمستقيمات المتوازية والمثلثات.</li><li>يكتب سببًا صحيحًا لكل خطوة في الحل.</li><li>يختار ترتيبًا مناسبًا لإيجاد الزوايا المجهولة في شكل مركب. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم بالنمذجة</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "الاستدلال الهندسي، المستقيمات المتوازية، الزاوية الخارجية، التبرير", "يعرض المعلم شكلًا فيه زاويتان معلومتان وعدة زوايا مجهولة، ويسأل: أي زاوية يمكن إيجادها أولًا؟ ولماذا؟ التعلم القبلي: خصائص الزوايا من الدرس 3-2.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الشكل ويستمع لترتيب الخطوات المقترح.</td><td>يقترح البداية ويبرر.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج حل مثال 3-3 ص 56 مع كتابة السبب بعد كل خطوة، ويؤكد أن الدليل يطلب أسبابًا صحيحة لا أرقامًا فقط.</td><td>يدوّن الحل بالأسباب.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>تعلم تعاوني</td><td>يوزع أسئلة من تمارين 3-3 ص 57–58 (منها السؤالان 1 و2 حيث تُستخدم خصائص الخط المستقيم والمتقابلة بالرأس) على المجموعات، لكل مجموعة سؤال تعرضه.</td><td>تحل المجموعة وتعرض الحل بأسبابه، وتعلق المجموعات الأخرى.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بسؤال فردي إضافي من التمارين.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>في مثلث، زاوية خارجية <span class=\"m\">120°</span> والزاوية الداخلية المجاورة لها؟</td><td class='ans'><span class=\"m\">60°</span> لأنهما على خط مستقيم</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>مستقيمان متوازيان يقطعهما قاطع؛ زاوية <span class=\"m\">3س</span> تبادل زاوية <span class=\"m\">75°</span>. أوجد س.</td><td class='ans'><span class=\"m\">3س = 75°</span> ومنها <span class=\"m\">س = 25°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>مثلث فيه زاويتان <span class=\"m\">س + 20°</span> و<span class=\"m\">2س</span> وزاويته الخارجية عند الرأس الثالث <span class=\"m\">110°</span>. أوجد س.</td><td class='ans'><span class=\"m\">س + 20 + 2س = 110</span> ومنها <span class=\"m\">س = 30°</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>زاويتان متقابلتان بالرأس إحداهما <span class=\"m\">47°</span>. ما الأخرى؟</td><td class='ans'><span class=\"m\">47°</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>مثلث قائم الزاوية إحدى زاويتيه الحادتين <span class=\"m\">34°</span>. أوجد الأخرى.</td><td class='ans'><span class=\"m\">56°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>في شكل رباعي ضلعان متقابلان متوازيان، وزاويتان متتاليتان بينهما إحداهما <span class=\"m\">68°</span>. أوجد الأخرى مع السبب.</td><td class='ans'><span class=\"m\">112°</span>؛ زاويتان داخليتان في جهة واحدة بين متوازيين مجموعهما <span class=\"m\">180°</span></td></tr></tbody></table>", "عزيزي الطالب: أعد حل مثال 3-3 ص 56 دون النظر إلى الكتاب واكتب الأسباب. ولي الأمر الكريم: اطلب من ابنك أن يقرأ لك الأسباب التي كتبها في الحل."]}, {"head": {"lesson": "3-3 حل مسائل الزوايا", "unit": "الوحدة الثالثة: الشبكات والزوايا", "week": "الأسبوع الخامس: 4–8/10/2026م", "pages": "كتاب الطالب ص 56–59 • كتاب النشاط ص 35–36 • دليل المعلم ص 55–56", "num": "الحصة 2 من 2", "topic": "تطبيقات على مسائل الزوايا والحجة المنطقية"}, "plain": ["1) يبني حجة منطقية لإثبات علاقة بين زوايا في شكل هندسي.\n2) يحل مسائل الزوايا في كتاب النشاط ص 35–36.\n3) يستكشف مجموع زوايا رؤوس النجمة الخماسية ويعمم النتيجة. (مخرج تعليمي آخر)", "المخرج 1: تقييم\nالمخرج 2: تطبيق\nمخرج آخر: إبداع", "التعلم المبني على حل المشكلات، التعلم بالاكتشاف، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحجة المنطقية، النجمة الخماسية، مجموع الزوايا", "يرسم كل طالب نجمة خماسية غير منتظمة ويقيس زوايا رؤوسها الخمسة ويجمعها: ماذا تلاحظ عند مقارنة النتائج؟ التعلم القبلي: مجموع زوايا المثلث والزاوية الخارجية.", "1) التهيئة (6 دقائق):\nالمعلم: يدير نشاط القياس ويجمع النتائج على السبورة.\nالطالب: يقيس ويلاحظ أن المجموع قريب من 180° دائمًا.\n2) حل المشكلات (9 دقائق):\nالمعلم: يناقش السؤال 8 من تمارين 3-3 كما يشير الدليل (النتيجة تنطبق على كل النجوم الخماسية) ويقود الحجة بالزاوية الخارجية.\nالطالب: يبني الحجة في مجموعات.\n3) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 35–36 مع التأكيد على السؤال 5 (الحجة المنطقية).\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 3-3 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: ما مجموع زوايا رؤوس النجمة الخماسية؟\nالإجابة النموذجية: 180°\nس2 [المستوى المتوقع]: زاويتان على خط مستقيم: 4س و5س. أوجد الزاويتين.\nالإجابة النموذجية: س = 20°؛ الزاويتان 80° و100°\nس3 [المستوى المتقدم]: أثبت أن الزاوية الخارجية للمثلث أكبر من كل من الزاويتين الداخليتين البعيدتين.\nالإجابة النموذجية: لأنها تساوي مجموعهما وكل منهما موجبة", "س1 [مستوى الدعم]: مثلث متطابق الأضلاع، ما قياس كل زاوية؟\nالإجابة النموذجية: 60°\nس2 [المستوى المتوقع]: زوايا مثلث س، س، س + 30°. أوجد س.\nالإجابة النموذجية: 3س + 30 = 180، س = 50°\nس3 [المستوى المتقدم]: زوايا شكل رباعي ثلاث منها متساوية والرابعة 90°. أوجد إحدى الزوايا المتساوية.\nالإجابة النموذجية: (360 − 90) ÷ 3 = 90°", "عزيزي الطالب: أكمل كتاب النشاط ص 35–36، وراجع الوحدة الثالثة. ولي الأمر الكريم: شارك ابنك تحدي النجمة الخماسية وتحقق من النتيجة معه."], "html": ["<ol class='ol'><li>يبني حجة منطقية لإثبات علاقة بين زوايا في شكل هندسي.</li><li>يحل مسائل الزوايا في كتاب النشاط ص 35–36.</li><li>يستكشف مجموع زوايا رؤوس النجمة الخماسية ويعمم النتيجة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تقييم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم بالاكتشاف</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "الحجة المنطقية، النجمة الخماسية، مجموع الزوايا", "يرسم كل طالب نجمة خماسية غير منتظمة ويقيس زوايا رؤوسها الخمسة ويجمعها: ماذا تلاحظ عند مقارنة النتائج؟ التعلم القبلي: مجموع زوايا المثلث والزاوية الخارجية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>6<small>د</small></td><td class='ph'>التهيئة</td><td>يدير نشاط القياس ويجمع النتائج على السبورة.</td><td>يقيس ويلاحظ أن المجموع قريب من <span class=\"m\">180°</span> دائمًا.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>حل المشكلات</td><td>يناقش السؤال 8 من تمارين 3-3 كما يشير الدليل (النتيجة تنطبق على كل النجوم الخماسية) ويقود الحجة بالزاوية الخارجية.</td><td>يبني الحجة في مجموعات.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 35–36 مع التأكيد على السؤال 5 (الحجة المنطقية).</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 3-3 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما مجموع زوايا رؤوس النجمة الخماسية؟</td><td class='ans'><span class=\"m\">180°</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>زاويتان على خط مستقيم: <span class=\"m\">4س</span> و<span class=\"m\">5س</span>. أوجد الزاويتين.</td><td class='ans'><span class=\"m\">س = 20°</span>؛ الزاويتان <span class=\"m\">80°</span> و<span class=\"m\">100°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أثبت أن الزاوية الخارجية للمثلث أكبر من كل من الزاويتين الداخليتين البعيدتين.</td><td class='ans'>لأنها تساوي مجموعهما وكل منهما موجبة</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>مثلث متطابق الأضلاع، ما قياس كل زاوية؟</td><td class='ans'><span class=\"m\">60°</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>زوايا مثلث <span class=\"m\">س</span>، <span class=\"m\">س</span>، <span class=\"m\">س + 30°</span>. أوجد س.</td><td class='ans'><span class=\"m\">3س + 30 = 180</span>، <span class=\"m\">س = 50°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>زوايا شكل رباعي ثلاث منها متساوية والرابعة <span class=\"m\">90°</span>. أوجد إحدى الزوايا المتساوية.</td><td class='ans'><span class=\"m\">(360 − 90) ÷ 3 = 90°</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 35–36، وراجع الوحدة الثالثة. ولي الأمر الكريم: شارك ابنك تحدي النجمة الخماسية وتحقق من النتيجة معه."]}]}, {"id": "4-1", "title": "كتابة الكسر في أبسط صورة", "periods": [{"head": {"lesson": "4-1 كتابة الكسر في أبسط صورة", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السادس: 11–15/10/2026م", "pages": "كتاب الطالب ص 62 • كتاب النشاط ص 37 • دليل المعلم ص 66–67", "num": "الحصة 1 من 2", "topic": "تبسيط الكسور باستخدام العامل المشترك الأكبر"}, "plain": ["1) يكتب الكسر في أبسط صورة بالقسمة على العامل المشترك الأكبر للبسط والمقام.\n2) يميز الكسور المكتوبة في أبسط صورة من غيرها ويبرر.\n3) يتحقق من تكافؤ كسرين بتبسيطهما. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات كسور متكافئة", "أبسط صورة، العامل المشترك الأكبر، الكسور المتكافئة، البسط، المقام", "يوزع المعلم بطاقات كسور (12/18، 2/3، 8/12…) ويطلب من كل طالب إيجاد زميل يحمل كسرًا مكافئًا. التعلم القبلي: العوامل والعامل المشترك الأكبر والكسور المتكافئة من الصف السابع.", "1) التهيئة (6 دقائق):\nالمعلم: يدير لعبة البحث عن الكسر المكافئ.\nالطالب: يتحرك ويجد زميله ويبرر التكافؤ.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج مثال 4-1 ص 62: تبسيط 36/48 مرة واحدة بالقسمة على 12 (ع.م.أ) مقابل تبسيطه على مراحل.\nالطالب: يقارن بين الطريقتين ويختار الأسرع.\n3) الأخطاء الشائعة (8 دقائق):\nالمعلم: يعرض أخطاء مثل حذف الأرقام المتشابهة 16/64 = 1/4 بالصدفة، ويؤكد القسمة على عامل مشترك فقط.\nالطالب: يحدد الخطأ ويصحح.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالسؤالين 1 و2 من تمارين 4-1 ص 62.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: اكتب 12/18 في أبسط صورة.\nالإجابة النموذجية: 2/3\nس2 [المستوى المتوقع]: ما العامل المشترك الأكبر للعددين 36 و48؟ ثم اكتب 36/48 في أبسط صورة.\nالإجابة النموذجية: 12؛ 3/4\nس3 [المستوى المتقدم]: هل 21/35 و27/45 متكافئان؟ برّر.\nالإجابة النموذجية: نعم؛ كلاهما يساوي 3/5 في أبسط صورة", "س1 [مستوى الدعم]: اكتب 15/25 في أبسط صورة.\nالإجابة النموذجية: 3/5\nس2 [المستوى المتوقع]: اكتب 42/56 في أبسط صورة.\nالإجابة النموذجية: 3/4\nس3 [المستوى المتقدم]: اكتب ثلاثة كسور مختلفة مقاماتها أكبر من 20 أبسط صورتها 5/7.\nالإجابة النموذجية: مثل 15/21، 20/28، 25/35", "عزيزي الطالب: راجع مثال 4-1 ص 62 وتدرب على إيجاد العامل المشترك الأكبر لثلاثة أزواج من الأعداد. ولي الأمر الكريم: اطلب من ابنك تبسيط كسر مثل 250/1000 وربطه بالربع."], "html": ["<ol class='ol'><li>يكتب الكسر في أبسط صورة بالقسمة على العامل المشترك الأكبر للبسط والمقام.</li><li>يميز الكسور المكتوبة في أبسط صورة من غيرها ويبرر.</li><li>يتحقق من تكافؤ كسرين بتبسيطهما. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: بطاقات كسور متكافئة</span></div>", "أبسط صورة، العامل المشترك الأكبر، الكسور المتكافئة، البسط، المقام", "يوزع المعلم بطاقات كسور (<span class=\"m\">12/18</span>، <span class=\"m\">2/3</span>، <span class=\"m\">8/12</span>…) ويطلب من كل طالب إيجاد زميل يحمل كسرًا مكافئًا. التعلم القبلي: العوامل والعامل المشترك الأكبر والكسور المتكافئة من الصف السابع.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>6<small>د</small></td><td class='ph'>التهيئة</td><td>يدير لعبة البحث عن الكسر المكافئ.</td><td>يتحرك ويجد زميله ويبرر التكافؤ.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال 4-1 ص 62: تبسيط <span class=\"m\">36/48</span> مرة واحدة بالقسمة على 12 (ع.م.أ) مقابل تبسيطه على مراحل.</td><td>يقارن بين الطريقتين ويختار الأسرع.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الأخطاء الشائعة</td><td>يعرض أخطاء مثل حذف الأرقام المتشابهة <span class=\"m\">16/64 = 1/4</span> بالصدفة، ويؤكد القسمة على عامل مشترك فقط.</td><td>يحدد الخطأ ويصحح.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤالين 1 و2 من تمارين 4-1 ص 62.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب <span class=\"m\">12/18</span> في أبسط صورة.</td><td class='ans'><span class=\"m\">2/3</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ما العامل المشترك الأكبر للعددين 36 و48؟ ثم اكتب <span class=\"m\">36/48</span> في أبسط صورة.</td><td class='ans'>12؛ <span class=\"m\">3/4</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>هل <span class=\"m\">21/35</span> و<span class=\"m\">27/45</span> متكافئان؟ برّر.</td><td class='ans'>نعم؛ كلاهما يساوي <span class=\"m\">3/5</span> في أبسط صورة</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب <span class=\"m\">15/25</span> في أبسط صورة.</td><td class='ans'><span class=\"m\">3/5</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>اكتب <span class=\"m\">42/56</span> في أبسط صورة.</td><td class='ans'><span class=\"m\">3/4</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب ثلاثة كسور مختلفة مقاماتها أكبر من 20 أبسط صورتها <span class=\"m\">5/7</span>.</td><td class='ans'>مثل <span class=\"m\">15/21</span>، <span class=\"m\">20/28</span>، <span class=\"m\">25/35</span></td></tr></tbody></table>", "عزيزي الطالب: راجع مثال 4-1 ص 62 وتدرب على إيجاد العامل المشترك الأكبر لثلاثة أزواج من الأعداد. ولي الأمر الكريم: اطلب من ابنك تبسيط كسر مثل <span class=\"m\">250/1000</span> وربطه بالربع."]}, {"head": {"lesson": "4-1 كتابة الكسر في أبسط صورة", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السادس: 11–15/10/2026م", "pages": "كتاب الطالب ص 62 • كتاب النشاط ص 37 • دليل المعلم ص 66–67", "num": "الحصة 2 من 2", "topic": "تبسيط كسور بأعداد كبيرة وكتابة الأعداد الكسرية في أبسط صورة"}, "plain": ["1) يبسّط كسورًا بسطها ومقامها أعداد كبيرة بتحليلها إلى عواملها الأولية.\n2) يكتب الكسر غير الاعتيادي عددًا كسريًا في أبسط صورة والعكس.\n3) يحل مسائل حياتية يُعبَّر عن نتائجها بكسر في أبسط صورة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة التقليدية، الأقلام", "التحليل إلى العوامل الأولية، الكسر غير الاعتيادي، العدد الكسري، أبسط صورة", "سؤال: في مدرسة 840 طالبًا، منهم 315 في الحلقة الثانية. ما الكسر الذي يمثلهم في أبسط صورة؟ التعلم القبلي: تبسيط الكسور بالعامل المشترك الأكبر من الحصة السابقة، والتحليل إلى العوامل الأولية.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويطلب الطرق.\nالطالب: يقترح القسمة المتكررة أو التحليل.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج التحليل إلى العوامل الأولية: 315/840 = (3² × 5 × 7)/(2³ × 3 × 5 × 7) = 3/8.\nالطالب: يطبق على كسر آخر.\n3) الأعداد الكسرية (8 دقائق):\nالمعلم: يراجع التحويل بين الكسر غير الاعتيادي والعدد الكسري مع التبسيط، مثل 38/12 = 3 1/6.\nالطالب: يحول ويبسّط.\n4) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 37 والسؤال 3 من تمارين 4-1 (أعداد أكبر).\nالطالب: يحل فرديًا ثم يقارن.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: اكتب 38/12 عددًا كسريًا في أبسط صورة.\nالإجابة النموذجية: 3 1/6\nس2 [المستوى المتوقع]: اكتب 315/840 في أبسط صورة.\nالإجابة النموذجية: 3/8\nس3 [المستوى المتقدم]: قطع سالم 125 كم من رحلة طولها 300 كم. ما الكسر المتبقي من الرحلة في أبسط صورة؟\nالإجابة النموذجية: 175/300 = 7/12", "س1 [مستوى الدعم]: اكتب 9/6 عددًا كسريًا في أبسط صورة.\nالإجابة النموذجية: 1 1/2\nس2 [المستوى المتوقع]: اكتب 144/360 في أبسط صورة.\nالإجابة النموذجية: 2/5\nس3 [المستوى المتقدم]: اكتب 4 6/8 كسرًا غير اعتيادي في أبسط صورة.\nالإجابة النموذجية: 4 3/4 = 19/4", "عزيزي الطالب: أكمل كتاب النشاط ص 37، وراجع جمع الكسور من الصف السابع. ولي الأمر الكريم: ناقش مع ابنك كسورًا من حياته مثل جزء الوقت المخصص للمذاكرة من اليوم."], "html": ["<ol class='ol'><li>يبسّط كسورًا بسطها ومقامها أعداد كبيرة بتحليلها إلى عواملها الأولية.</li><li>يكتب الكسر غير الاعتيادي عددًا كسريًا في أبسط صورة والعكس.</li><li>يحل مسائل حياتية يُعبَّر عن نتائجها بكسر في أبسط صورة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم الذاتي</span><span>التعلم التعاوني</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة التقليدية</span><span>الأقلام</span></div>", "التحليل إلى العوامل الأولية، الكسر غير الاعتيادي، العدد الكسري، أبسط صورة", "سؤال: في مدرسة 840 طالبًا، منهم 315 في الحلقة الثانية. ما الكسر الذي يمثلهم في أبسط صورة؟ التعلم القبلي: تبسيط الكسور بالعامل المشترك الأكبر من الحصة السابقة، والتحليل إلى العوامل الأولية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويطلب الطرق.</td><td>يقترح القسمة المتكررة أو التحليل.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج التحليل إلى العوامل الأولية: <span class=\"m\">315/840 = (3<sup>2</sup> × 5 × 7)/(2<sup>3</sup> × 3 × 5 × 7) = 3/8</span>.</td><td>يطبق على كسر آخر.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الأعداد الكسرية</td><td>يراجع التحويل بين الكسر غير الاعتيادي والعدد الكسري مع التبسيط، مثل <span class=\"m\">38/12 = 3 1/6</span>.</td><td>يحول ويبسّط.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 37 والسؤال 3 من تمارين 4-1 (أعداد أكبر).</td><td>يحل فرديًا ثم يقارن.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب <span class=\"m\">38/12</span> عددًا كسريًا في أبسط صورة.</td><td class='ans'><span class=\"m\">3 1/6</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>اكتب <span class=\"m\">315/840</span> في أبسط صورة.</td><td class='ans'><span class=\"m\">3/8</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>قطع سالم 125 كم من رحلة طولها 300 كم. ما الكسر المتبقي من الرحلة في أبسط صورة؟</td><td class='ans'><span class=\"m\">175/300 = 7/12</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب <span class=\"m\">9/6</span> عددًا كسريًا في أبسط صورة.</td><td class='ans'><span class=\"m\">1 1/2</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>اكتب <span class=\"m\">144/360</span> في أبسط صورة.</td><td class='ans'><span class=\"m\">2/5</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب <span class=\"m\">4 6/8</span> كسرًا غير اعتيادي في أبسط صورة.</td><td class='ans'><span class=\"m\">4 3/4 = 19/4</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 37، وراجع جمع الكسور من الصف السابع. ولي الأمر الكريم: ناقش مع ابنك كسورًا من حياته مثل جزء الوقت المخصص للمذاكرة من اليوم."]}]}, {"id": "4-2", "title": "جمع الكسور وطرحها", "periods": [{"head": {"lesson": "4-2 جمع الكسور وطرحها", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السادس: 11–15/10/2026م", "pages": "كتاب الطالب ص 63–65 • كتاب النشاط ص 38–39 • دليل المعلم ص 68–70", "num": "الحصة 1 من 3", "topic": "جمع الكسور وطرحها بمقامات مختلفة"}, "plain": ["1) يجمع كسورًا ويطرحها بإيجاد المضاعف المشترك الأصغر للمقامات.\n2) يفسر لماذا لا يجوز جمع البسوط والمقامات مباشرة.\n3) يكتب الناتج في أبسط صورة ويتحقق منه بالتقدير. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تقييم", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: شرائط الكسور", "المضاعف المشترك الأصغر، المقام المشترك، الكسور المتكافئة", "يعرض المعلم حلًا خاطئًا: 1/2 + 1/3 = 2/5 ويسأل: هل الناتج معقول؟ (2/5 أقل من 1/2). التعلم القبلي: الكسور المتكافئة والمضاعفات المشتركة والتبسيط.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الحل الخاطئ ويطلب التحقق بشرائط الكسور.\nالطالب: يكتشف أن المجموع أكبر من 1/2 فالحل خاطئ.\n2) الاكتشاف (10 دقائق):\nالمعلم: يطلب تمثيل 1/2 + 1/3 بشرائط الكسور وإيجاد شريط بأجزاء متساوية يمثل الاثنين معًا.\nالطالب: يصل إلى 3/6 + 2/6 = 5/6.\n3) النمذجة (8 دقائق):\nالمعلم: ينمذج مثال 4-2 ص 63 باستخدام المضاعف المشترك الأصغر للمقامات.\nالطالب: يطبق على 5/6 − 3/8.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالسؤالين 1 و2 من تمارين 4-2 ص 64.\nالطالب: يحل فرديًا ويتحقق بالتقدير.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 1/4 + 2/4\nالإجابة النموذجية: 3/4\nس2 [المستوى المتوقع]: احسب: 5/6 − 3/8\nالإجابة النموذجية: 20/24 − 9/24 = 11/24\nس3 [المستوى المتقدم]: لماذا 1/2 + 1/3 ≠ 2/5؟\nالإجابة النموذجية: لأن الأجزاء غير متساوية الحجم؛ والناتج الصحيح 5/6 وهو أكبر من 1/2 بينما 2/5 أصغر منه", "س1 [مستوى الدعم]: احسب: 1/2 + 1/3\nالإجابة النموذجية: 5/6\nس2 [المستوى المتوقع]: احسب: 3/4 + 2/5\nالإجابة النموذجية: 15/20 + 8/20 = 23/20 = 1 3/20\nس3 [المستوى المتقدم]: احسب: 7/12 − 1/4 + 1/6\nالإجابة النموذجية: 7/12 − 3/12 + 2/12 = 6/12 = 1/2", "عزيزي الطالب: راجع مثال 4-2 ص 63 وأكمل السؤالين 1 و2. ولي الأمر الكريم: اطلب من ابنك جمع 1/2 و1/4 من وصفة طعام."], "html": ["<ol class='ol'><li>يجمع كسورًا ويطرحها بإيجاد المضاعف المشترك الأصغر للمقامات.</li><li>يفسر لماذا لا يجوز جمع البسوط والمقامات مباشرة.</li><li>يكتب الناتج في أبسط صورة ويتحقق منه بالتقدير. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: شرائط الكسور</span></div>", "المضاعف المشترك الأصغر، المقام المشترك، الكسور المتكافئة", "يعرض المعلم حلًا خاطئًا: <span class=\"m\">1/2 + 1/3 = 2/5</span> ويسأل: هل الناتج معقول؟ (<span class=\"m\">2/5</span> أقل من <span class=\"m\">1/2</span>). التعلم القبلي: الكسور المتكافئة والمضاعفات المشتركة والتبسيط.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الحل الخاطئ ويطلب التحقق بشرائط الكسور.</td><td>يكتشف أن المجموع أكبر من <span class=\"m\">1/2</span> فالحل خاطئ.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الاكتشاف</td><td>يطلب تمثيل <span class=\"m\">1/2 + 1/3</span> بشرائط الكسور وإيجاد شريط بأجزاء متساوية يمثل الاثنين معًا.</td><td>يصل إلى <span class=\"m\">3/6 + 2/6 = 5/6</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال 4-2 ص 63 باستخدام المضاعف المشترك الأصغر للمقامات.</td><td>يطبق على <span class=\"m\">5/6 − 3/8</span>.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤالين 1 و2 من تمارين 4-2 ص 64.</td><td>يحل فرديًا ويتحقق بالتقدير.</td></tr><tr><td class='t لكسرية وطرحها"}, "plain": ["1) يجمع الأعداد الكسرية ويطرحها بطريقتين: فصل الأعداد الكاملة أو التحويل إلى كسور غير اعتيادية.\n2) يعالج حالة الاستلاف عند الطرح في الأعداد الكسرية.\n3) يحكم على صحة عبارات تتضمن جمع كسور وطرحها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم بالنمذجة، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "العدد الكسري، الكسر غير الاعتيادي، الاستلاف", "مسألة: لدى مريم 3 1/4 م من القماش، استخدمت 1 2/3 م. كم بقي؟ التعلم القبلي: جمع الكسور وطرحها بمقامات مختلفة من الحصة السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح المسألة ويطلب التقدير أولًا (نحو 1.5 م).\nالطالب: يقدّر ويقترح طريقة.\n2) النمذجة (11 دقيقة):\nالمعلم: ينمذج الطريقتين: 3 3/12 − 1 8/12 = 2 15/12 − 1 8/12 = 1 7/12، والتحويل إلى 13/4 − 5/3 = 39/12 − 20/12 = 19/12.\nالطالب: يقارن الطريقتين ويختار الأنسب.\n3) صواب أم خطأ (8 دقائق):\nالمعلم: يناقش السؤال 4 من تمارين 4-2 (عبارة غير صحيحة إذا جُمع كسران متماثلان) والسؤال 5.\nالطالب: يحكم ويبرر.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالسؤال 3 من تمارين 4-2.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 2 1/3 + 1 1/3\nالإجابة النموذجية: 3 2/3\nس2 [المستوى المتوقع]: احسب: 3 1/4 − 1 2/3\nالإجابة النموذجية: 1 7/12\nس3 [المستوى المتقدم]: صواب أم خطأ: أ/ب + أ/ب = 2أ/2ب. برّر بمثال.\nالإجابة النموذجية: خطأ؛ مثل 1/3 + 1/3 = 2/3 وليس 2/6", "س1 [مستوى الدعم]: احسب: 1 1/2 + 2 1/4\nالإجابة النموذجية: 3 3/4\nس2 [المستوى المتوقع]: احسب: 5 − 2 3/8\nالإجابة النموذجية: 2 5/8\nس3 [المستوى المتقدم]: احسب: 4 2/5 − 1 3/4\nالإجابة النموذجية: 4 8/20 − 1 15/20 = 2 13/20", "عزيزي الطالب: أكمل السؤالين 3 و5 من تمارين 4-2. ولي الأمر الكريم: اطلب من ابنك قياس طول قطعتين وحساب الفرق بالكسور."], "html": ["<ol class='ol'><li>يجمع الأعداد الكسرية ويطرحها بطريقتين: فصل الأعداد الكاملة أو التحويل إلى كسور غير اعتيادية.</li><li>يعالج حالة الاستلاف عند الطرح في الأعداد الكسرية.</li><li>يحكم على صحة عبارات تتضمن جمع كسور وطرحها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "العدد الكسري، الكسر غير الاعتيادي، الاستلاف", "مسألة: لدى مريم <span class=\"m\">3 1/4</span> م من القماش، استخدمت <span class=\"m\">1 2/3</span> م. كم بقي؟ التعلم القبلي: جمع الكسور وطرحها بمقامات مختلفة من الحصة السابقة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح المسألة ويطلب التقدير أولًا (نحو <span class=\"m\">1.5</span> م).</td><td>يقدّر ويقترح طريقة.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج الطريقتين: <span class=\"m\">3 3/12 − 1 8/12 = 2 15/12 − 1 8/12 = 1 7/12</span>، والتحويل إلى <span class=\"m\">13/4 − 5/3 = 39/12 − 20/12 = 19/12</span>.</td><td>يقارن الطريقتين ويختار الأنسب.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>صواب أم خطأ</td><td>يناقش السؤال 4 من تمارين 4-2 (عبارة غير صحيحة إذا جُمع كسران متماثلان) والسؤال 5.</td><td>يحكم ويبرر.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤال 3 من تمارين 4-2.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">2 1/3 + 1 1/3</span></td><td class='ans'><span class=\"m\">3 2/3</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">3 1/4 − 1 2/3</span></td><td class='ans'><span class=\"m\">1 7/12</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>صواب أم خطأ: <span class=\"m\">أ/ب + أ/ب = 2أ/2ب</span>. برّر بمثال.</td><td class='ans'>خطأ؛ مثل <span class=\"m\">1/3 + 1/3 = 2/3</span> وليس <span class=\"m\">2/6</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">1 1/2 + 2 1/4</span></td><td class='ans'><span class=\"m\">3 3/4</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">5 − 2 3/8</span></td><td class='ans'><span class=\"m\">2 5/8</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>احسب: <span class=\"m\">4 2/5 − 1 3/4</span></td><td class='ans'><span class=\"m\">4 8/20 − 1 15/20 = 2 13/20</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤالين 3 و5 من تمارين 4-2. ولي الأمر الكريم: اطلب من ابنك قياس طول قطعتين وحساب الفرق بالكسور."]}, {"head": {"lesson": "4-2 جمع الكسور وطرحها", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السادس: 11–15/10/2026م", "pages": "كتاب الطالب ص 63–65 • كتاب النشاط ص 38–39 • دليل المعلم ص 68–70", "num": "الحصة 3 من 3", "topic": "مسائل على جمع الكسور وطرحها"}, "plain": ["1) يحل مسائل لفظية تتطلب جمع كسور وطرحها في سياقات حياتية.\n2) يحل مسائل تتضمن طرح مجموع كسرين من الكل لأول مرة.\n3) يكوّن مسألة لفظية على جمع الكسور وطرحها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: إبداع", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الكل، الجزء المتبقي، المسألة اللفظية", "مسألة الدليل: صرف أحمد 1/3 مصروفه على الكتب و1/4 على المواصلات. ما الجزء المتبقي؟ التعلم القبلي: جمع الكسور والأعداد الكسرية وطرحها.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح المسألة ويرسم شريطًا يمثل المصروف.\nالطالب: يحسب 1 − (1/3 + 1/4) = 5/12.\n2) حل المشكلات (8 دقائق):\nالمعلم: يناقش السؤال 6 من تمارين 4-2 حيث يُطرح مجموع كسرين من الكل لأول مرة.\nالطالب: يحل في أزواج ويرسم نموذجًا.\n3) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 38–39 بحسب المستويات.\nالطالب: يحل فرديًا.\n4) تأليف مسألة (5 دقائق):\nالمعلم: يطلب تأليف مسألة لفظية على جمع كسرين وتبادلها مع زميل.\nالطالب: يؤلف ويحل مسألة زميله.\n5) مسابقة ختامية (6 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 4-2 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n6) الغلق (4 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 1 − 3/8\nالإجابة النموذجية: 5/8\nس2 [المستوى المتوقع]: صرف أحمد 1/3 مصروفه على الكتب و1/4 على المواصلات. ما الجزء المتبقي؟\nالإجابة النموذجية: 1 − 7/12 = 5/12\nس3 [المستوى المتقدم]: خزان ممتلئ 5/6 منه، استُهلك 1/2 الخزان كاملًا ثم أضيف 1/3 الخزان. كم يصبح الممتلئ؟\nالإجابة النموذجية: 5/6 − 1/2 + 1/3 = 2/3 الخزان", "س1 [مستوى الدعم]: احسب: 2/5 + 1/2\nالإجابة النموذجية: 9/10\nس2 [المستوى المتوقع]: قطعة قماش طولها 5 1/2 م قُص منها 2 3/4 م. ما الطول المتبقي؟\nالإجابة النموذجية: 2 3/4 م\nس3 [المستوى المتقدم]: اكتب كسرين مختلفين مقاماهما مختلفان مجموعهما 7/10.\nالإجابة النموذجية: مثل 1/2 + 1/5", "عزيزي الطالب: أكمل كتاب النشاط ص 38–39، واقرأ مقدمة درس ضرب الكسور ص 66. ولي الأمر الكريم: شارك ابنك في حساب أجزاء ميزانية بسيطة بالكسور."], "html": ["<ol class='ol'><li>يحل مسائل لفظية تتطلب جمع كسور وطرحها في سياقات حياتية.</li><li>يحل مسائل تتضمن طرح مجموع كسرين من الكل لأول مرة.</li><li>يكوّن مسألة لفظية على جمع الكسور وطرحها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "الكل، الجزء المتبقي، المسألة اللفظية", "مسألة الدليل: صرف أحمد <span class=\"m\">1/3</span> مصروفه على الكتب و<span class=\"m\">1/4</span> على المواصلات. ما الجزء المتبقي؟ التعلم القبلي: جمع الكسور والأعداد الكسرية وطرحها.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح المسألة ويرسم شريطًا يمثل المصروف.</td><td>يحسب <span class=\"m\">1 − (1/3 + 1/4) = 5/12</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>حل المشكلات</td><td>يناقش السؤال 6 من تمارين 4-2 حيث يُطرح مجموع كسرين من الكل لأول مرة.</td><td>يحل في أزواج ويرسم نموذجًا.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 38–39 بحسب المستويات.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>تأليف مسألة</td><td>يطلب تأليف مسألة لفظية على جمع كسرين وتبادلها مع زميل.</td><td>يؤلف ويحل مسألة زميله.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 4-2 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>4<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">1 − 3/8</span></td><td class='ans'><span class=\"m\">5/8</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>صرف أحمد <span class=\"m\">1/3</span> مصروفه على الكتب و<span class=\"m\">1/4</span> على المواصلات. ما الجزء المتبقي؟</td><td class='ans'><span class=\"m\">1 − 7/12 = 5/12</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>خزان ممتلئ <span class=\"m\">5/6</span> منه، استُهلك <span class=\"m\">1/2</span> الخزان كاملًا ثم أضيف <span class=\"m\">1/3</span> الخزان. كم يصبح الممتلئ؟</td><td class='ans'><span class=\"m\">5/6 − 1/2 + 1/3 = 2/3</span> الخزان</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">2/5 + 1/2</span></td><td class='ans'><span class=\"m\">9/10</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>قطعة قماش طولها <span class=\"m\">5 1/2</span> م قُص منها <span class=\"m\">2 3/4</span> م. ما الطول المتبقي؟</td><td class='ans'><span class=\"m\">2 3/4</span> م</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب كسرين مختلفين مقاماهما مختلفان مجموعهما <span class=\"m\">7/10</span>.</td><td class='ans'>مثل <span class=\"m\">1/2 + 1/5</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 38–39، واقرأ مقدمة درس ضرب الكسور ص 66. ولي الأمر الكريم: شارك ابنك في حساب أجزاء ميزانية بسيطة بالكسور."]}]}, {"id": "4-3", "title": "ضرب الكسور", "periods": [{"head": {"lesson": "4-3 ضرب الكسور", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السادس: 11–15/10/2026م", "pages": "كتاب الطالب ص 66–68 • كتاب النشاط ص 40–41 • دليل المعلم ص 71–72", "num": "الحصة 1 من 2", "topic": "ضرب الكسور والتبسيط قبل الضرب"}, "plain": ["1) يضرب كسرًا في كسر وفي عدد صحيح ويكتب الناتج في أبسط صورة.\n2) يبسّط بالقسمة على العوامل المشتركة قبل الضرب لتسهيل الحساب.\n3) يفسر ضرب الكسور بنموذج المساحة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: فهم", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: ورق مربعات وأقلام تلوين", "ضرب الكسور، التبسيط قبل الضرب، نموذج المساحة", "يلون الطلاب 2/3 مستطيل أفقيًا ثم 3/4 منه رأسيًا: ما الكسر الملون مرتين؟ التعلم القبلي: معنى الكسر وكسر من كمية وتبسيط الكسور.", "1) التهيئة (5 دقائق):\nالمعلم: يوجه نشاط التلوين.\nالطالب: يلاحظ أن المنطقة المشتركة 6/12 = 1/2.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج قاعدة ضرب البسط في البسط والمقام في المقام، ثم التبسيط قبل الضرب: (4/9) × (3/8) = 1/6.\nالطالب: يطبق على أمثلة.\n3) معالجة الخطأ (8 دقائق):\nالمعلم: يعرض الخطأ الشائع في الدليل: توحيد المقامات قبل الضرب كما في الجمع، ويوضح عدم الحاجة إليه.\nالطالب: يقارن ويشرح لزميله.\n4) الممارسة (12 دقيقة):\nالمعلم: يكلف بالسؤالين 1 و2 من تمارين 4-3 ص 67.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: (2/3) × (3/4)\nالإجابة النموذجية: 6/12 = 1/2\nس2 [المستوى المتوقع]: احسب مع التبسيط أولًا: (4/9) × (3/8)\nالإجابة النموذجية: 1/6\nس3 [المستوى المتقدم]: احسب: (5/12) × 18\nالإجابة النموذجية: 15/2 = 7 1/2", "س1 [مستوى الدعم]: احسب: (1/2) × (3/5)\nالإجابة النموذجية: 3/10\nس2 [المستوى المتوقع]: احسب: (6/7) × (14/15)\nالإجابة النموذجية: 4/5\nس3 [المستوى المتقدم]: أيهما أكبر: (3/4) × (2/3) أم (2/3) + (1/12)؟\nالإجابة النموذجية: الأول 1/2 والثاني 3/4؛ فالثاني أكبر", "عزيزي الطالب: راجع أمثلة ص 66 وأكمل السؤالين 1 و2 من تمارين 4-3. ولي الأمر الكريم: اسأل ابنك: كم يساوي نصف ثلاثة أرباع رغيف؟"], "html": ["<ol class='ol'><li>يضرب كسرًا في كسر وفي عدد صحيح ويكتب الناتج في أبسط صورة.</li><li>يبسّط بالقسمة على العوامل المشتركة قبل الضرب لتسهيل الحساب.</li><li>يفسر ضرب الكسور بنموذج المساحة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> فهم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم بالاكتشاف< المتقدم</td><td>احسب: <span class=\"m\">(5/12) × 18</span></td><td class='ans'><span class=\"m\">15/2 = 7 1/2</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">(1/2) × (3/5)</span></td><td class='ans'><span class=\"m\">3/10</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">(6/7) × (14/15)</span></td><td class='ans'><span class=\"m\">4/5</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أيهما أكبر: <span class=\"m\">(3/4) × (2/3)</span> أم <span class=\"m\">(2/3) + (1/12)</span>؟</td><td class='ans'>الأول <span class=\"m\">1/2</span> والثاني <span class=\"m\">3/4</span>؛ فالثاني أكبر</td></tr></tbody></table>", "عزيزي الطالب: راجع أمثلة ص 66 وأكمل السؤالين 1 و2 من تمارين 4-3. ولي الأمر الكريم: اسأل ابنك: كم يساوي نصف ثلاثة أرباع رغيف؟"]}, {"head": {"lesson": "4-3 ضرب الكسور", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السادس: 11–15/10/2026م", "pages": "كتاب الطالب ص 66–68 • كتاب النشاط ص 40–41 • دليل المعلم ص 71–72", "num": "الحصة 2 من 2", "topic": "ضرب الأعداد الكسرية ومسائل متعددة الخطوات"}, "plain": ["1) يضرب أعدادًا كسرية بتحويلها إلى كسور غير اعتيادية.\n2) يحل مسائل متعددة الخطوات تتضمن ضرب الكسور.\n3) يكتشف خطأ في مسائل «مخادعة» ويبرر الحل الصحيح. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "العدد الكسري، الكسر غير الاعتيادي، المسألة متعددة الخطوات", "سؤال: مساحة غرفة مستطيلة بعداها 3 1/2 م و2 1/4 م. هل المساحة 6 1/8 م² (بضرب الأعداد الكاملة والكسور منفصلة)؟ التعلم القبلي: ضرب الكسور وتحويل الأعداد الكسرية.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويطلب التحقق.\nالطالب: يكتشف أن الطريقة خاطئة.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج: (7/2) × (9/4) = 63/8 = 7 7/8 ويبين بنموذج المساحة أجزاء الضرب المفقودة في الطريقة الخاطئة.\nالطالب: يطبق على أمثلة.\n3) حل المشكلات (12 دقيقة):\nالمعلم: يناقش السؤال الذي يتطلب عدة خطوات (السؤال 3 من تمارين 4-3) والسؤال 5 المخادع الذي يجرب فيه الطلاب كسورًا مختلفة.\nالطالب: يحل في مجموعات ويعرض الحل.\n4) كتاب النشاط (8 دقائق):\nالمعلم: يوزع تمارين كتاب النشاط ص 40–41.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 1 1/2 × 4\nالإجابة النموذجية: 6\nس2 [المستوى المتوقع]: احسب: 3 1/2 × 2 1/4\nالإجابة النموذجية: 63/8 = 7 7/8\nس3 [المستوى المتقدم]: اشترى خالد 2 1/2 كجم من التمر، أكل 2/5 منها. كم كيلوجرامًا بقي؟\nالإجابة النموذجية: (3/5) × 2 1/2 = 1 1/2 كجم", "س1 [مستوى الدعم]: احسب: 2 2/3 × 3\nالإجابة النموذجية: 8\nس2 [المستوى المتوقع]: احسب: 1 3/5 × 1 1/4\nالإجابة النموذجية: (8/5) × (5/4) = 2\nس3 [المستوى المتقدم]: هل حاصل ضرب عددين كسريين أكبر من 1 يكون دائمًا أكبر من كل منهما؟ برّر.\nالإجابة النموذجية: نعم؛ لأن الضرب في عدد أكبر من 1 يكبّر العدد", "عزيزي الطالب: أكمل كتاب النشاط ص 40–41، واقرأ مقدمة درس القسمة ص 69. ولي الأمر الكريم: اطلب من ابنك حساب كمية مضاعفة لوصفة تحتاج 1 1/2 كوب."], "html": ["<ol class='ol'><li>يضرب أعدادًا كسرية بتحويلها إلى كسور غير اعتيادية.</li><li>يحل مسائل متعددة الخطوات تتضمن ضرب الكسور.</li><li>يكتشف خطأ في مسائل «مخادعة» ويبرر الحل الصحيح. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "العدد الكسري، الكسر غير الاعتيادي، المسألة متعددة الخطوات", "سؤال: مساحة غرفة مستطيلة بعداها <span class=\"m\">3 1/2</span> م و<span class=\"m\">2 1/4</span> م. هل المساحة <span class=\"m\">6 1/8</span> <span class=\"m\">م<sup>2</sup></span> (بضرب الأعداد سب: <span class=\"m\">2 2/3 × 3</span></td><td class='ans'>8</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">1 3/5 × 1 1/4</span></td><td class='ans'><span class=\"m\">(8/5) × (5/4) = 2</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>هل حاصل ضرب عددين كسريين أكبر من 1 يكون دائمًا أكبر من كل منهما؟ برّر.</td><td class='ans'>نعم؛ لأن الضرب في عدد أكبر من 1 يكبّر العدد</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 40–41، واقرأ مقدمة درس القسمة ص 69. ولي الأمر الكريم: اطلب من ابنك حساب كمية مضاعفة لوصفة تحتاج <span class=\"m\">1 1/2</span> كوب."]}]}, {"id": "4-4", "title": "قسمة الكسور", "periods": [{"head": {"lesson": "4-4 قسمة الكسور", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السابع: 18–22/10/2026م", "pages": "كتاب الطالب ص 69–71 • كتاب النشاط ص 42–43 • دليل المعلم ص 73–74", "num": "الحصة 1 من 4", "topic": "قسمة عدد صحيح على كسر"}, "plain": ["1) يفسر قسمة عدد صحيح على كسر بمعنى «كم مرة يحتوي العدد على الكسر».\n2) يقسم عددًا صحيحًا على كسر وحدة وكسر غير وحدة.\n3) يستنتج أن القسمة على كسر تكافئ الضرب في مقلوبه من أمثلة. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: شرائط الكسور", "القسمة، المقلوب، كسر الوحدة", "سؤال: لدينا 3 بيتزا، نقسم كل واحدة إلى أرباع. كم ربعًا لدينا؟ التعلم القبلي: معنى القسمة، والقسمة على عدد بين 0 و1 من الوحدة الثانية.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويرسم البيتزا.\nالطالب: يجيب 3 ÷ (1/4) = 12.\n2) الاكتشاف (11 دقيقة):\nالمعلم: يكلف المجموعات بشرائط الكسور: 2 ÷ (1/3)، 2 ÷ (2/3)، 4 ÷ (2/5) وتسجيل النواتج.\nالطالب: يلاحظ أن 2 ÷ (2/3) = 3 وأنه يساوي 2 × (3/2).\n3) التعميم (8 دقائق):\nالمعلم: يصوغ مع الطلاب القاعدة: القسمة على كسر = الضرب في مقلوبه، ويتحقق بالضرب العكسي.\nالطالب: يكتب القاعدة ومثالًا.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالسؤال 1 من تمارين 4-4 ص 70.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 3 ÷ (1/4)\nالإجابة النموذجية: 12\nس2 [المستوى المتوقع]: احسب: 2 ÷ (2/3)\nالإجابة النموذجية: 3\nس3 [المستوى المتقدم]: لماذا يكون 5 ÷ (1/2) أكبر من 5؟\nالإجابة النموذجية: لأن العدد 5 يحتوي على 10 أنصاف؛ والقسمة على عدد أقل من 1 تكبّر الناتج", "س1 [مستوى الدعم]: احسب: 4 ÷ (1/3)\nالإجابة النموذجية: 12\nس2 [المستوى المتوقع]: احسب: 6 ÷ (3/4)\nالإجابة النموذجية: 8\nس3 [المستوى المتقدم]: حبل طوله 9 م، قُص إلى قطع طول كل منها 3/4 م. كم قطعة؟\nالإجابة النموذجية: 9 ÷ (3/4) = 12 قطعة", "عزيزي الطالب: اقرأ مقدمة الدرس ص 69 وارسم نموذجًا لـ3 ÷ (1/2). ولي الأمر الكريم: اسأل ابنك: كم كوبًا سعته 1/4 لتر يملأ 2 لتر؟"], "html": ["<ol class='ol'><li>يفسر قسمة عدد صحيح على كسر بمعنى «كم مرة يحتوي العدد على الكسر».</li><li>يقسم عددًا صحيحًا على كسر وحدة وكسر غير وحدة.</li><li>يستنتج أن القسمة على كسر تكافئ الضرب في مقلوبه من أمثلة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: شرائط الكسور</span></div>", "القسمة، المقلوب، كسر الوحدة", "سؤال: لدينا 3 بيتزا، نقسم كل واحدة إلى أرباع. كم ربعًا لدينا؟ التعلم القبلي: معنى القسمة، والقسمة على عدد بين 0 و1 من الوحدة الثانية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويرسم البيتزا.</td><td>يجيب <span class=\"m\">3 ÷ (1/4) = 12</span>.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الاكتشاف</td><td>يكلف المجموعات بشرائط الكسور: <span class=\"m\">2 ÷ (1/3)</span>، <span class=\"m\">2 ÷ (2/3)</span>، <span class=\"m\">4 ÷ (2/5)</span> وتسجيل النواتج.</td><td>يلاحظ أن <span class=\"m\">2 ÷ (2/3) = 3</span> وأنه يساوي <span class=\"m\">2 × (3/2)</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>التعميم</td><td>يصوغ مع الطلاب القاعدة: القسمة على كسر = الضرب في مقلوبه، ويتحقق بالضرب العكسي.</td><td>يكتب القاعدة ومثالًا.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤال 1 من تمارين 4-4 ص 70.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">3 ÷ (1/4)</span></td><td class='ans'>12</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">2 ÷ (2/3)</span></td><td class='ans'>3</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>لماذا يكون <span class=\"m\">5 ÷ (1/2)</span> أكبر من 5؟</td><td class='ans'>لأن العدد 5 يحتوي على 10 أنصاف؛ والقسمة على عدد أقل من 1 تكبّر الناتج</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">4 ÷ (1/3)</span></td><td class='ans'>12</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">6 ÷ (3/4)</span></td><td class='ans'>8</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>حبل طوله 9 م، قُص إلى قطع طول كل منها <span class=\"m\">3/4</span> م. كم قطعة؟</td><td class='ans'><span class=\"m\">9 ÷ (3/4) = 12</span> قطعة</td></tr></tbody></table>", "عزيزي الطالب: اقرأ مقدمة الدرس ص 69 وارسم نموذجًا لـ<span class=\"m\">3 ÷ (1/2)</span>. ولي الأمر الكريم: اسأل ابنك: كم كوبًا سعته <span class=\"m\">1/4</span> لتر يملأ 2 لتر؟"]}, {"head": {"lesson": "4-4 قسمة الكسور", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السابع: 18–22/10/2026م", "pages": "كتاب الطالب ص 69–71 • كتاب النشاط ص 42–43 • دليل المعلم ص 73–74", "num": "الحصة 2 من 4", "topic": "قسمة كسر على كسر"}, "plain": ["1) يقسم كسرًا على كسر بالضرب في مقلوب المقسوم عليه.\n2) يبسّط قبل الضرب بعد قلب المقسوم عليه.\n3) يتحقق من ناتج القسمة بعملية الضرب العكسية. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "مقلوب الكسر، القسمة، العملية العكسية", "يكتب المعلم (3/4) ÷ (1/8) ويسأل: كم ثمنًا في ثلاثة أرباع؟ التعلم القبلي: قسمة عدد صحيح على كسر ومقلوب الكسر من الحصة السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويستعين بشريط كسور.\nالطالب: يجيب 6 ويبرر بالشريط.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج مثال 4-4 ص 69: (5/6) ÷ (2/3) = (5/6) × (3/2) = 5/4 مع التبسيط.\nالطالب: يطبق على أمثلة.\n3) تعلم تعاوني (10 دقائق):\nالمعلم: يوزع السؤال 2 من تمارين 4-4 (ثماني جزئيات متعددة الخطوات) على المجموعات.\nالطالب: تحل المجموعة جزئيتين وتتحقق بالضرب.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالسؤال 4 من تمارين 4-4 مع منع التحقق بالآلة كما ينصح الدليل.\nالطالب: يفكر قبل الكتابة ويحل.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: (3/4) ÷ (1/8)\nالإجابة النموذجية: 6\nس2 [المستوى المتوقع]: احسب: (5/6) ÷ (2/3)\nالإجابة النموذجية: 5/4 = 1 1/4\nس3 [المستوى المتقدم]: تحقق من أن (2/5) ÷ (4/15) = 3/2 بالضرب العكسي.\nالإجابة النموذجية: (3/2) × (4/15) = 12/30 = 2/5 ✓", "س1 [مستوى الدعم]: ما مقلوب 3/7؟\nالإجابة النموذجية: 7/3\nس2 [المستوى المتوقع]: احسب: (7/10) ÷ (7/20)\nالإجابة النموذجية: 2\nس3 [المستوى المتقدم]: احسب: (9/16) ÷ (3/4)\nالإجابة النموذجية: 3/4", "عزيزي الطالب: أكمل السؤال 4 من تمارين 4-4 وتحقق من كل إجابة بالضرب. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك لماذا نقلب المقسوم عليه."] ='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">(3/4) ÷ (1/8)</span></td><td class='ans'>6</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">(5/6) ÷ (2/3)</span></td><td class='ans'><span class=\"m\">5/4 = 1 1/4</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>تحقق من أن <span class=\"m\">(2/5) ÷ (4/15) = 3/2</span> بالضرب العكسي.</td><td class='ans'><span class=\"m\">(3/2) × (4/15) = 12/30 = 2/5</span> ✓</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما مقلوب <span class=\"m\">3/7</span>؟</td><td class='ans'><span class=\"m\">7/3</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">(7/10) ÷ (7/20)</span></td><td class='ans'>2</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>احسب: <span class=\"m\">(9/16) ÷ (3/4)</span></td><td class='ans'><span class=\"m\">3/4</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤال 4 من تمارين 4-4 وتحقق من كل إجابة بالضرب. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك لماذا نقلب المقسوم عليه."]}, {"head": {"lesson": "4-4 قسمة الكسور", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السابع: 18–22/10/2026م", "pages": "كتاب الطالب ص 69–71 • كتاب النشاط ص 42–43 • دليل المعلم ص 73–74", "num": "الحصة 3 من 4", "topic": "قسمة الأعداد الكسرية"}, "plain": ["1) يقسم أعدادًا كسرية بتحويلها إلى كسور غير اعتيادية.\n2) يحذف العوامل المشتركة قبل الضرب لتقليل الحساب.\n3) يحل مسائل حياتية على قسمة الأعداد الكسرية. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تطبيق", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام", "العدد الكسري، الكسر غير الاعتيادي، المقلوب، التبسيط", "مسألة: لوح خشب طوله 4 1/2 م يُقطع إلى رفوف طول كل منها 1 1/8 م. كم رفًا؟ التعلم القبلي: قسمة الكسور وتحويل الأعداد الكسرية.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح المسألة ويطلب التقدير (نحو 4).\nالطالب: يقدّر.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج: (9/2) ÷ (9/8) = (9/2) × (8/9) = 4 مع حذف العوامل كما ينصح الدليل في السؤال 5.\nالطالب: يطبق على مثال مماثل.\n3) تحليل الأخطاء (8 دقائق):\nالمعلم: يعرض حلًا قسم فيه طالب الأعداد الكاملة والكسور منفصلة، ويطلب تفحص الخطوات للعثور على الخطأ.\nالطالب: يحدد الخطأ ويصححه.\n4) الممارسة (12 دقيقة):\nالمعلم: يكلف بالسؤالين 5 و6 من تمارين 4-4.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 1 1/2 ÷ 3\nالإجابة النموذجية: 1/2\nس2 [المستوى المتوقع]: احسب: 4 1/2 ÷ 1 1/8\nالإجابة النموذجية: 4\nس3 [المستوى المتقدم]: احسب: 2 2/3 ÷ 1 3/5\nالإجابة النموذجية: (8/3) × (5/8) = 5/3 = 1 2/3", "س1 [مستوى الدعم]: احسب: 2 1/2 ÷ 5\nالإجابة النموذجية: 1/2\nس2 [المستوى المتوقع]: احسب: 3 3/4 ÷ 1 1/4\nالإجابة النموذجية: 3\nس3 [المستوى المتقدم]: وُزعت 7 1/2 كجم من الأرز في أكياس سعة كل منها 1 1/4 كجم. كم كيسًا؟\nالإجابة النموذجية: 6 أكياس", "عزيزي الطالب: أكمل السؤالين 5 و6 من تمارين 4-4. ولي الأمر الكريم: اطرح على ابنك مسألة توزيع بالكسور من المطبخ."], "html": ["<ol class='ol'><li>يقسم أعدادًا كسرية بتحويلها إلى كسور غير اعتيادية.</li><li>يحذف العوامل المشتركة قبل الضرب لتقليل الحساب.</li><li>يحل مسائل حياتية على قسمة الأعداد الكسرية. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تطبيق</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التشاركي</span><span>التعلم بالنمذجة</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "العدد الكسري، الكسر غير الاعتيادي، المقلوب، التبسيط", "مسألة: لوح خشب طوله <span class=\"m\">4 1/2</span> م يُقطع إلى رفوف طول كل منها <span class=\"m\">1 1/8</span> م. كم رفًا؟ التعلم القبلي: قسمة الكسور وتحويل الأعداد الكسرية.", "<table class='steps'><thead><tr><th>الزمن</th>
