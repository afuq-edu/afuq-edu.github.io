لدعم</td><td>بسّط: <span class=\"m\">10<sup>6</sup> ÷ 10<sup>6</sup></span></td><td class='ans'><span class=\"m\">10<sup>0</sup> = 1</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>اكتب <span class=\"m\">9 × 3<sup>−5</sup></span> في صورة قوة للعدد 3.</td><td class='ans'><span class=\"m\">3<sup>2</sup> × 3<sup>−5</sup> = 3<sup>−3</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>حل المعادلة: <span class=\"m\">25<sup>2</sup> = 5<sup>س</sup></span></td><td class='ans'><span class=\"m\">25<sup>2</sup> = (5<sup>2</sup>)<sup>2</sup> = 5<sup>4</sup></span> إذن س = 4</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 18–19، وراجع مفردات الوحدة الأولى استعدادًا للوحدة الثانية. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك قانونًا واحدًا من قوانين الأسس بمثال."]}]}, {"id": "2-1", "title": "ضرب الكسور العشرية وقسمتها ذهنيًا", "periods": [{"head": {"lesson": "2-1 ضرب الكسور العشرية وقسمتها ذهنيًا", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الثالث: 20–24/9/2026م", "pages": "كتاب الطالب ص 31–34 • كتاب النشاط ص 20–22 • دليل المعلم ص 36–37", "num": "الحصة 1 من 4", "topic": "أثر الضرب والقسمة على أعداد بين 0 و1"}, "plain": ["1) يتنبأ بأن الضرب في عدد بين 0 و1 يصغّر الناتج وأن القسمة عليه تكبّره.\n2) يقارن بين عبارات عددية باستخدام < أو > ويبرر المقارنة.\n3) يحسب ذهنيًا نواتج ضرب وقسمة بسيطة على 0.5 و0.1. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تحليل\nمخرج آخر: تطبيق", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: آلات حاسبة علمية، أخرى: ورقة المصادر 2-1 في دليل المعلم", "العدد العشري، الكسر العشري، مقدار الناتج، المقارنة", "سؤال مثير للتفكير: «الضرب يكبّر الأعداد دائمًا». هل توافق؟ يجرب الطلاب 8 × 0.5. التعلم القبلي: ضرب الأعداد العشرية وقسمتها كتابيًا من الصف السابع وقيمة المنزلة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح العبارة ويطلب التصويت ثم يختبرها بمثال 8 × 0.5.\nالطالب: يصوّت ويعدل رأيه بعد المثال.\n2) الاكتشاف (10 دقائق):\nالمعلم: يكلف المجموعات باستخدام الآلة الحاسبة لإيجاد 12 × 2، 12 × 1، 12 × 0.5، 12 × 0.1 ثم 12 ÷ 2، 12 ÷ 1، 12 ÷ 0.5، 12 ÷ 0.1 وتسجيل الملاحظة.\nالطالب: يسجل النتائج في جدول ويصوغ قاعدة لأثر العدد بين 0 و1.\n3) النمذجة (8 دقائق):\nالمعلم: يعرض الحقائق في مقدمة الدرس ص 31 ويربطها بالمعنى: 12 × 0.5 نصف 12، و12 ÷ 0.5 عدد الأنصاف في 12.\nالطالب: يعيد صياغة الحقيقتين بلغته مع مثال.\n4) تعلم تعاوني (11 دقيقة):\nالمعلم: يوزع ورقة المصادر 2-1 (وضع < أو > مع ذكر السبب) ويحل السؤال الأول نموذجًا، ثم يساعد المحتاجين في سؤال مثل 10 ÷ 0.2 مقابل 10 ÷ 0.5.\nالطالب: يحل في أزواج ويكتب سببًا لكل اختيار، ويناقش الإجابات المختلفة.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: هل ناتج 25 × 0.4 أكبر أم أصغر من 25؟ احسبه.\nالإجابة النموذجية: أصغر؛ الناتج 10\nس2 [المستوى المتوقع]: ضع < أو >: 6 ÷ 0.3 ☐ 6 × 0.3\nالإجابة النموذجية: 20 > 1.8 فالإشارة >\nس3 [المستوى المتقدم]: إذا كان أ عددًا موجبًا، فرتّب تصاعديًا: أ × 0.9، أ، أ ÷ 0.9\nالإجابة النموذجية: أ × 0.9 < أ < أ ÷ 0.9", "س1 [مستوى الدعم]: احسب: 40 × 0.5\nالإجابة النموذجية: 20\nس2 [المستوى المتوقع]: احسب: 3 ÷ 0.1\nالإجابة النموذجية: 30\nس3 [المستوى المتقدم]: اختر عددًا ب يجعل 15 × ب < 15 ÷ ب صحيحة، وبرّر.\nالإجابة النموذجية: أي عدد بين 0 و1، مثل ب = 0.5: 7.5 < 30", "عزيزي الطالب: اقرأ مقدمة الدرس ص 31 واكتب الحقيقتين الأساسيتين بمثال من عندك. ولي الأمر الكريم: اسأل ابنك: لماذا 10 ÷ 0.5 = 20 وليس 5؟"], "html": ["<ol class='ol'><li>يتنبأ بأن الضرب في عدد بين 0 و1 يصغّر الناتج وأن القسمة عليه تكبّره.</li><li>يقارن بين عبارات عددية باستخدام &lt; أو &gt; ويبرر المقارنة.</li><li>يحسب ذهنيًا نواتج ضرب وقسمة بسيطة على 0.5 و0.1. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تطبيق</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span><span>التعلم بالنمذجة</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: آلات حاسبة علمية</span><span>أخرى: ورقة المصادر 2-1 في دليل المعلم</span></div>", "العدد العشري، الكسر العشري، مقدار الناتج، المقارنة", "سؤال مثير للتفكير: «الضرب يكبّر الأعداد دائمًا». هل توافق؟ يجرب الطلاب <span class=\"m\">8 × 0.5</span>. التعلم القبلي: ضرب الأعداد العشرية وقسمتها كتابيًا من الصف السابع وقيمة المنزلة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح العبارة ويطلب التصويت ثم يختبرها بمثال <span class=\"m\">8 × 0.5</span>.</td><td>يصوّت ويعدل رأيه بعد المثال.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الاكتشاف</td><td>يكلف المجموعات باستخدام الآلة الحاسبة لإيجاد <span class=\"m\">12 × 2، 12 × 1، 12 × 0.5، 12 × 0.1</span> ثم <span class=\"m\">12 ÷ 2، 12 ÷ 1، 12 ÷ 0.5، 12 ÷ 0.1</span> وتسجيل الملاحظة.</td><td>يسجل النتائج في جدول ويصوغ قاعدة لأثر العدد بين 0 و1.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>يعرض الحقائق في مقدمة الدرس ص 31 ويربطها بالمعنى: <span class=\"m\">12 × 0.5</span> نصف 12، و<span class=\"m\">12 ÷ 0.5</span> عدد الأنصاف في 12.</td><td>يعيد صياغة الحقيقتين بلغته مع مثال.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>تعلم تعاوني</td><td>يوزع ورقة المصادر 2-1 (وضع &lt; أو &gt; مع ذكر السبب) ويحل السؤال الأول نموذجًا، ثم يساعد المحتاجين في سؤال مثل <span class=\"m\">10 ÷ 0.2</span> مقابل <span class=\"m\">10 ÷ 0.5</span>.</td><td>يحل في أزواج ويكتب سببًا لكل اختيار، ويناقش الإجابات المختلفة.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>هل ناتج <span class=\"m\">25 × 0.4</span> أكبر أم أصغر من 25؟ احسبه.</td><td class='ans'>أصغر؛ الناتج 10</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ضع &lt; أو &gt;: <span class=\"m\">6 ÷ 0.3</span> ☐ <span class=\"m\">6 × 0.3</span></td><td class='ans'><span class=\"m\">20 &gt; 1.8</span> فالإشارة &gt;</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>إذا كان أ عددًا موجبًا، فرتّب تصاعديًا: <span class=\"m\">أ × 0.9</span>، أ، <span class=\"m\">أ ÷ 0.9</span></td><td class='ans'><span class=\"m\">أ × 0.9 &lt; أ &lt; أ ÷ 0.9</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">40 × 0.5</span></td><td class='ans'>20</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">3 ÷ 0.1</span></td><td class='ans'>30</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اختر عددًا ب يجعل <span class=\"m\">15 × ب &lt; 15 ÷ ب</span> صحيحة، وبرّر.</td><td class='ans'>أي عدد بين 0 و1، مثل <span class=\"m\">ب = 0.5</span>: <span class=\"m\">7.5 &lt; 30</span></td></tr></tbody></table>", "عزيزي الطالب: اقرأ مقدمة الدرس ص 31 واكتب الحقيقتين الأساسيتين بمثال من عندك. ولي الأمر الكريم: اسأل ابنك: لماذا <span class=\"m\">10 ÷ 0.5 = 20</span> وليس 5؟"]}, {"head": {"lesson": "2-1 ضرب الكسور العشرية وقسمتها ذهنيًا", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الثالث: 20–24/9/2026م", "pages": "كتاب الطالب ص 31–34 • كتاب النشاط ص 20–22 • دليل المعلم ص 36–37", "num": "الحصة 2 من 4", "topic": "ضرب الكسور العشرية ذهنيًا"}, "plain": ["1) يضرب كسورًا عشرية ذهنيًا باستخدام حقائق الضرب للأعداد الكاملة ثم ضبط الفاصلة العشرية.\n2) يتحقق من معقولية الناتج بتقدير مقداره.\n3) يستخدم حقيقة ضرب معلومة لإيجاد نواتج مرتبطة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "حقائق الضرب، المنزلة العشرية، التقدير، الطرق الكتابية المختصرة", "مسألة: ما ثمن 25 ورقة نقدية من فئة 100 بيسة بالريال؟ وما ثمن 60 ورقة من فئة 0.5 ريال؟ التعلم القبلي: أثر الضرب في أعداد بين 0 و1 من الحصة السابقة وجدول الضرب.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح مسألتي الأوراق النقدية ويستمع للطرق الذهنية.\nالطالب: يقترح حلًا ذهنيًا ويبرره.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج طريقة: احسب 3 × 2 = 6 ثم اضبط المقدار في 0.3 × 0.2 (جزء من عشرة × جزء من عشرة = جزء من مئة) ⟵ 0.06، ويحذّر من الخطأ الشائع 0.6.\nالطالب: يدوّن الطريقة ويطبقها على 0.4 × 0.07.\n3) طرق كتابية مختصرة (8 دقائق):\nالمعلم: يوضح كما يقترح الدليل أن الطرق الكتابية تُستخدم لتسجيل خطوات مختصرة لا للحل الكامل، مثل كتابة 17 × 6 = 102 ثم ضبط الفاصلة في 1.7 × 0.6.\nالطالب: يقارن طريقته الكتابية بطريقة زميله ويختار الأقصر.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بجزئيات الضرب من تمارين 2-1 ص 32–33، ويتابع الطلاب في التحقق بالتقدير.\nالطالب: يحل فرديًا ثم يتحقق بالتقدير.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب ذهنيًا: 0.4 × 3\nالإجابة النموذجية: 1.2\nس2 [المستوى المتوقع]: احسب ذهنيًا: 0.3 × 0.2\nالإجابة النموذجية: 0.06\nس3 [المستوى المتقدم]: علمًا بأن 23 × 17 = 391، أوجد 2.3 × 0.17.\nالإجابة النموذجية: 0.391", "س1 [مستوى الدعم]: احسب: 0.6 × 5\nالإجابة النموذجية: 3\nس2 [المستوى المتوقع]: احسب: 0.07 × 0.8\nالإجابة النموذجية: 0.056\nس3 [المستوى المتقدم]: إذا كان 1.2 × 0.5 = 0.6 فأوجد 0.12 × 0.05.\nالإجابة النموذجية: 0.006", "عزيزي الطالب: حل جزئيات الضرب المتبقية من تمارين 2-1 ص 32–33 دون آلة حاسبة. ولي الأمر الكريم: اطرح على ابنك أثناء التسوق أسئلة مثل: ثمن 0.5 كجم بسعر 1.4 ريال للكيلو."], "html": ["<ol class='ol'><li>يضرب كسورًا عشرية ذهنيًا باستخدام حقائق الضرب للأعداد الكاملة ثم ضبط الفاصلة العشرية.</li><li>يتحقق من معقولية الناتج بتقدير مقداره.</li><li>يستخدم حقيقة ضرب معلومة لإيجاد نواتج مرتبطة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "حقائق الضرب، المنزلة العشرية، التقدير، الطرق الكتابية المختصرة", "مسألة: ما ثمن 25 ورقة نقدية من فئة 100 بيسة بالريال؟ وما ثمن 60 ورقة من فئة 0.5 ريال؟ التعلم القبلي: أثر الضرب في أعداد بين 0 و1 من الحصة السابقة وجدول الضرب.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح مسألتي الأوراق النقدية ويستمع للطرق الذهنية.</td><td>يقترح حلًا ذهنيًا ويبرره.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج طريقة: احسب <span class=\"m\">3 × 2 = 6</span> ثم اضبط المقدار في <span class=\"m\">0.3 × 0.2</span> (جزء من عشرة × جزء من عشرة = جزء من مئة) ⟵ <span class=\"m\">0.06</span>، ويحذّر من الخطأ الشائع <span class=\"m\">0.6</span>.</td><td>يدوّن الطريقة ويطبقها على <span class=\"m\">0.4 × 0.07</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>طرق كتابية مختصرة</td><td>يوضح كما يقترح الدليل أن الطرق الكتابية تُستخدم لتسجيل خطوات مختصرة لا للحل الكامل، مثل كتابة <span class=\"m\">17 × 6 = 102</span> ثم ضبط الفاصلة في <span class=\"m\">1.7 × 0.6</span>.</td><td>يقارن طريقته الكتابية بطريقة زميله ويختار الأقصر.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بجزئيات الضرب من تمارين 2-1 ص 32–33، ويتابع الطلاب في التحقق بالتقدير.</td><td>يحل فرديًا ثم يتحقق بالتقدير.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب ذهنيًا: <span class=\"m\">0.4 × 3</span></td><td class='ans'><span class=\"m\">1.2</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب ذهنيًا: <span class=\"m\">0.3 × 0.2</span></td><td class='ans'><span class=\"m\">0.06</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>علمًا بأن <span class=\"m\">23 × 17 = 391</span>، أوجد <span class=\"m\">2.3 × 0.17</span>.</td><td class='ans'><span class=\"m\">0.391</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">0.6 × 5</span></td><td class='ans'>3</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">0.07 × 0.8</span></td><td class='ans'><span class=\"m\">0.056</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>إذا كان <span class=\"m\">1.2 × 0.5 = 0.6</span> فأوجد <span class=\"m\">0.12 × 0.05</span>.</td><td class='ans'><span class=\"m\">0.006</span></td></tr></tbody></table>", "عزيزي الطالب: حل جزئيات الضرب المتبقية من تمارين 2-1 ص 32–33 دون آلة حاسبة. ولي الأمر الكريم: اطرح على ابنك أثناء التسوق أسئلة مثل: ثمن 0.5 كجم بسعر 1.4 ريال للكيلو."]}, {"head": {"lesson": "2-1 ضرب الكسور العشرية وقسمتها ذهنيًا", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الثالث: 20–24/9/2026م", "pages": "كتاب الطالب ص 31–34 • كتاب النشاط ص 20–22 • دليل المعلم ص 36–37", "num": "الحصة 3 من 4", "topic": "قسمة الكسور العشرية ذهنيًا ومسائل حياتية"}, "plain": ["1) يقسم كسورًا عشرية ذهنيًا بتحويل المقسوم عليه إلى عدد كامل.\n2) يحل مسائل حياتية على النقود والسعة تتطلب القسمة على كسر عشري.\n3) يحكم على معقولية ناتج القسمة بمقارنته بالمقسوم. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: أكواب وإبريق مدرّج للعرض", "القسمة، المقسوم عليه، الكسر العشري، السعة", "يعرض المعلم إبريقًا سعته 3 لترات وكوبًا سعته 0.25 لتر ويسأل: كم كوبًا نملأ؟ التعلم القبلي: أثر القسمة على عدد بين 0 و1، وضرب الكسور العشرية ذهنيًا.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الإبريق والكوب ويطرح السؤال.\nالطالب: يقدّر العدد ثم يحسبه.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج: 2.4 ÷ 0.06 = 240 ÷ 6 = 40 بضرب المقسوم والمقسوم عليه في 100، ويبين أن الناتج أكبر من المقسوم لأن المقسوم عليه أقل من 1.\nالطالب: يطبق الطريقة على 1.8 ÷ 0.3 و0.36 ÷ 0.04.\n3) حل المشكلات (12 دقيقة):\nالمعلم: يطرح مسائل الدليل: عدد العملات من فئة 50 بيسة اللازمة لـ4.5 ريال، وعدد الأباريق سعة 0.5 لتر لملء دلو، ثم أسئلة القسمة من تمارين 2-1.\nالطالب: يحل في مجموعات ويعرض كل فريق مسألة.\n4) الممارسة (8 دقائق):\nالمعلم: يكلف بالسؤالين 8 و9 من تمارين 2-1 ويطلب في 8 (ب) ملاحظة نمط النواتج.\nالطالب: يحل فرديًا ويصف النمط.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 4.8 ÷ 4\nالإجابة النموذجية: 1.2\nس2 [المستوى المتوقع]: احسب: 3.6 ÷ 0.4\nالإجابة النموذجية: 9\nس3 [المستوى المتقدم]: كم كوبًا سعته 0.25 لتر يملأ إبريقًا سعته 3 لترات؟\nالإجابة النموذجية: 3 ÷ 0.25 = 12 كوبًا", "س1 [مستوى الدعم]: احسب: 0.9 ÷ 3\nالإجابة النموذجية: 0.3\nس2 [المستوى المتوقع]: احسب: 2.4 ÷ 0.06\nالإجابة النموذجية: 40\nس3 [المستوى المتقدم]: كم عملة من فئة 50 بيسة (0.05 ريال) تساوي 4.5 ريال؟\nالإجابة النموذجية: 4.5 ÷ 0.05 = 90 عملة", "عزيزي الطالب: أكمل السؤالين 8 و9 من تمارين 2-1، واكتب مسألة حياتية من عندك على القسمة على كسر عشري. ولي الأمر الكريم: شارك ابنك في حساب عدد العبوات الصغيرة التي تملأ عبوة كبيرة في المطبخ."], "html": ["<ol class='ol'><li>يقسم كسورًا عشرية ذهنيًا بتحويل المقسوم عليه إلى عدد كامل.</li><li>يحل مسائل حياتية على النقود والسعة تتطلب القسمة على كسر عشري.</li><li>يحكم على معقولية ناتج القسمة بمقارنته بالمقسوم. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم بالنمذجة</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: أكواب وإبريق مدرّج للعرض</span></div>", "القسمة، المقسوم عليه، الكسر العشري، السعة", "يعرض المعلم إبريقًا سعته 3 لترات وكوبًا سعته <span class=\"m\">0.25</span> لتر ويسأل: كم كوبًا نملأ؟ التعلم القبلي: أثر القسمة على عدد بين 0 و1، وضرب الكسور العشرية ذهنيًا.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الإبريق والكوب ويطرح السؤال.</td><td>يقدّر العدد ثم يحسبه.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج: <span class=\"m\">2.4 ÷ 0.06 = 240 ÷ 6 = 40</span> بضرب المقسوم والمقسوم عليه في 100، ويبين أن الناتج أكبر من المقسوم لأن المقسوم عليه أقل من 1.</td><td>يطبق الطريقة على <span class=\"m\">1.8 ÷ 0.3</span> و<span class=\"m\">0.36 ÷ 0.04</span>.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>حل المشكلات</td><td>يطرح مسائل الدليل: عدد العملات من فئة 50 بيسة اللازمة لـ<span class=\"m\">4.5</span> ريال، وعدد الأباريق سعة <span class=\"m\">0.5</span> لتر لملء دلو، ثم أسئلة القسمة من تمارين 2-1.</td><td>يحل في مجموعات ويعرض كل فريق مسألة.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤالين 8 و9 من تمارين 2-1 ويطلب في 8 (ب) ملاحظة نمط النواتج.</td><td>يحل فرديًا ويصف النمط.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">4.8 ÷ 4</span></td><td class='ans'><span class=\"m\">1.2</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">3.6 ÷ 0.4</span></td><td class='ans'>9</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كم كوبًا سعته <span class=\"m\">0.25</span> لتر يملأ إبريقًا سعته 3 لترات؟</td><td class='ans'><span class=\"m\">3 ÷ 0.25 = 12</span> كوبًا</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">0.9 ÷ 3</span></td><td class='ans'><span class=\"m\">0.3</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">2.4 ÷ 0.06</span></td><td class='ans'>40</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كم عملة من فئة 50 بيسة (<span class=\"m\">0.05</span> ريال) تساوي <span class=\"m\">4.5</span> ريال؟</td><td class='ans'><span class=\"m\">4.5 ÷ 0.05 = 90</span> عملة</td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤالين 8 و9 من تمارين 2-1، واكتب مسألة حياتية من عندك على القسمة على كسر عشري. ولي الأمر الكريم: شارك ابنك في حساب عدد العبوات الصغيرة التي تملأ عبوة كبيرة في المطبخ."]}, {"head": {"lesson": "2-1 ضرب الكسور العشرية وقسمتها ذهنيًا", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الثالث: 20–24/9/2026م", "pages": "كتاب الطالب ص 31–34 • كتاب النشاط ص 20–22 • دليل المعلم ص 36–37", "num": "الحصة 4 من 4", "topic": "تطبيقات على ضرب الكسور العشرية وقسمتها ذهنيًا"}, "plain": ["1) يوظف الضرب والقسمة الذهنية للكسور العشرية في حل تمارين متنوعة.\n2) يوجد العامل المفقود في عملية ضرب تتضمن كسورًا عشرية.\n3) يحل مسائل الشراء التي تتطلب إيجاد سعر الوحدة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تطبيق", "التعلم المبني على اللعب، التعلم الذاتي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "العامل المفقود، سعر الوحدة، الكسر العشري", "تحدي «الرقم السري»: ما العدد الذي إذا ضربناه في 0.4 كان الناتج 0.12؟ التعلم القبلي: طرق الضرب والقسمة الذهنية من الحصص الثلاث السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح التحدي ويقبل الإجابات المبررة.\nالطالب: يستخدم القسمة لإيجاد العدد 0.3.\n2) كتاب النشاط (15 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 20–22 بحسب المستويات ويقدم بطاقة دعم بخطوات الضرب الذهني لمن يحتاج.\nالطالب: يحل فرديًا ثم يطابق إجاباته مع زميله.\n3) حل المشكلات (7 دقائق):\nالمعلم: يطرح مسألة سعر الوحدة: ثمن 0.6 كجم من التمر 1.5 ريال؛ ما ثمن الكيلوجرام؟\nالطالب: يحل ويتحقق بالضرب العكسي.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 2-1 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 0.2 × 0.2\nالإجابة النموذجية: 0.04\nس2 [المستوى المتوقع]: احسب: 1.5 ÷ 0.3\nالإجابة النموذجية: 5\nس3 [المستوى المتقدم]: أكمل: □ × 0.4 = 0.12\nالإجابة النموذجية: 0.3", "س1 [مستوى الدعم]: احسب: 7 × 0.01\nالإجابة النموذجية: 0.07\nس2 [المستوى المتوقع]: احسب: 0.8 × 0.15\nالإجابة النموذجية: 0.12\nس3 [المستوى المتقدم]: ثمن 0.6 كجم من التمر 1.5 ريال. ما ثمن الكيلوجرام الواحد؟\nالإجابة النموذجية: 1.5 ÷ 0.6 = 2.5 ريال", "عزيزي الطالب: أكمل كتاب النشاط ص 20–22، واقرأ مقدمة درس 2-2 ص 35. ولي الأمر الكريم: تابع ابنك في حل صفحات النشاط دون آلة حاسبة."], "html": ["<ol class='ol'><li>يوظف الضرب والقسمة الذهنية للكسور العشرية في حل تمارين متنوعة.</li><li>يوجد العامل المفقود في عملية ضرب تتضمن كسورًا عشرية.</li><li>يحل مسائل الشراء التي تتطلب إيجاد سعر الوحدة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span> الدعم</td><td>احسب: <span class=\"m\">0.2 × 0.2</span></td><td class='ans'><span class=\"m\">0.04</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">1.5 ÷ 0.3</span></td><td class='ans'>5</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أكمل: <span class=\"m\">□ × 0.4 = 0.12</span></td><td class='ans'><span class=\"m\">0.3</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">7 × 0.01</span></td><td class='ans'><span class=\"m\">0.07</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">0.8 × 0.15</span></td><td class='ans'><span class=\"m\">0.12</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>ثمن <span class=\"m\">0.6</span> كجم من التمر <span class=\"m\">1.5</span> ريال. ما ثمن الكيلوجرام الواحد؟</td><td class='ans'><span class=\"m\">1.5 ÷ 0.6 = 2.5</span> ريال</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 20–22، واقرأ مقدمة درس 2-2 ص 35. ولي الأمر الكريم: تابع ابنك في حل صفحات النشاط دون آلة حاسبة."]}]}, {"id": "2-2", "title": "الضرب في قوى العدد 10 والقسمة عليها", "periods": [{"head": {"lesson": "2-2 الضرب في قوى العدد 10 والقسمة عليها", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الثالث: 20–24/9/2026م", "pages": "كتاب الطالب ص 35–37 • كتاب النشاط ص 23–24 • دليل المعلم ص 38–39", "num": "الحصة 1 من 3", "topic": "الضرب في القوى الموجبة للعدد 10 والقسمة عليها"}, "plain": ["1) يضرب الأعداد الكاملة والعشرية في 10^(ن) ويقسمها عليها ذهنيًا.\n2) يفسر الضرب في قوى العدد 10 بتحرك الأرقام بين المنازل.\n3) يوجد القوة المفقودة للعدد 10 في عملية معطاة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: لوحة المنازل العشرية", "قوى العدد 10، القيمة المكانية، المنزلة العشرية، الأس", "يعرض المعلم لوحة المنازل ويضع العدد 3.7 ثم يسأل: أين تنتقل الأرقام عند الضرب في 100؟ التعلم القبلي: الصيغة الأسية وقوى العدد 10 من الوحدة الأولى.", "1) التهيئة (5 دقائق):\nالمعلم: يحرك بطاقات الأرقام على لوحة المنازل أمام الطلاب.\nالطالب: يتوقع موقع الأرقام بعد الضرب والقسمة.\n2) النمذجة (10 دقائق):\nالمعلم: يقرأ مع الطلاب مقدمة الموضوع ص 35 ونمط قوى العدد 10 10³ = 1000، 10² = 100… وينمذج مثال 2-2 (أ، ج).\nالطالب: يكتب كل قوة في صورة عدد ويطبق على أمثلة.\n3) لعبة اللوحة (10 دقائق):\nالمعلم: يدير لعبة: يسحب طالب بطاقة عملية (× 10³، ÷ 10²…) ويطبقها على عدد مكتوب على اللوحة.\nالطالب: يتناوب أعضاء الفريق في تحريك الأرقام وإعلان الناتج.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 2-2 ص 36.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 3.7 × 10²\nالإجابة النموذجية: 370\nس2 [المستوى المتوقع]: احسب: 45 ÷ 10³\nالإجابة النموذجية: 0.045\nس3 [المستوى المتقدم]: أكمل: 0.62 × □ = 6200\nالإجابة النموذجية: 10⁴ أي 10000", "س1 [مستوى الدعم]: احسب: 5.2 ÷ 10\nالإجابة النموذجية: 0.52\nس2 [المستوى المتوقع]: احسب: 0.008 × 10³\nالإجابة النموذجية: 8\nس3 [المستوى المتقدم]: أوجد ن: 7300 ÷ 10^(ن) = 0.73\nالإجابة النموذجية: ن = 4", "عزيزي الطالب: اكتب قوى العدد 10 من 10⁴ إلى 10⁰ بالصيغة العددية، وراجع مثال 2-2 ص 35. ولي الأمر الكريم: اسأل ابنك عن عدد البيسات في 2.5 ريال (2.5 × 10³ = 2500 بيسة)."], "html": ["<ol class='ol'><li>يضرب الأعداد الكاملة والعشرية في <span class=\"m\">10<sup>ن</sup></span> ويقسمها عليها ذهنيًا.</li><li>يفسر الضرب في قوى العدد 10 بتحرك الأرقام بين المنازل.</li><li>يوجد القوة المفقودة للعدد 10 في عملية معطاة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: لوحة المنازل العشرية</span></div>", "قوى العدد 10، القيمة المكانية، المنزلة العشرية، الأس", "يعرض المعلم لوحة المنازل ويضع العدد <span class=\"m\">3.7</span> ثم يسأل: أين تنتقل الأرقام عند الضرب في 100؟ التعلم القبلي: الصيغة الأسية وقوى العدد 10 من الوحدة الأولى.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يحرك بطاقات الأرقام على لوحة المنازل أمام الطلاب.</td><td>يتوقع موقع الأرقام بعد الضرب والقسمة.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>يقرأ مع الطلاب مقدمة الموضوع ص 35 ونمط قوى العدد 10 <span class=\"m\">10<sup>3</sup> = 1000</span>، <span class=\"m\">10<sup>2</sup> = 100</span>… وينمذج مثال 2-2 (أ، ج).</td><td>يكتب كل قوة في صورة عدد ويطبق على أمثلة.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>لعبة اللوحة</td><td>يدير لعبة: يسحب طالب بطاقة عملية (<span class=\"m\">× 10<sup>3</sup></span>، <span class=\"m\">÷ 10<sup>2</sup></span>…) ويطبقها على عدد مكتوب على اللوحة.</td><td>يتناوب أعضاء الفريق في تحريك الأرقام وإعلان الناتج.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 2-2 ص 36.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">3.7 × 10<sup>2</sup></span></td><td class='ans'>370</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">45 ÷ 10<sup>3</sup></span></td><td class='ans'><span class=\"m\">0.045</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أكمل: <span class=\"m\">0.62 × □ = 6200</span></td><td class='ans'><span class=\"m\">10<sup>4</sup></span> أي 10000</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">5.2 ÷ 10</span></td><td class='ans'><span class=\"m\">0.52</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">0.008 × 10<sup>3</sup></span></td><td class='ans'>8</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أوجد ن: <span class=\"m\">7300 ÷ 10<sup>ن</sup> = 0.73</span></td><td class='ans'>ن = 4</td></tr></tbody></table>", "عزيزي الطالب: اكتب قوى العدد 10 من <span class=\"m\">10<sup>4</sup></span> إلى <span class=\"m\">10<sup>0</sup></span> بالصيغة العددية، وراجع مثال 2-2 ص 35. ولي الأمر الكريم: اسأل ابنك عن عدد البيسات في <span class=\"m\">2.5</span> ريال (<span class=\"m\">2.5 × 10<sup>3</sup> = 2500</span> بيسة)."]}, {"head": {"lesson": "2-2 الضرب في قوى العدد 10 والقسمة عليها", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الثالث: 20–24/9/2026م", "pages": "كتاب الطالب ص 35–37 • كتاب النشاط ص 23–24 • دليل المعلم ص 38–39", "num": "الحصة 2 من 3", "topic": "الضرب في 0.1 و0.01 والقوى السالبة للعدد 10 والقسمة عليها"}, "plain": ["1) يفسر أن الضرب في 10^(−ن) يكافئ القسمة على 10^(ن) وأن القسمة عليها تكافئ الضرب في 10^(ن).\n2) يحسب نواتج الضرب والقسمة على 0.1 و0.01 و10^(−ن).\n3) يكتب طرقًا مختلفة متكافئة للوصول إلى ناتج معطى. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: إبداع", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام", "الأس السالب، القوى السالبة للعدد 10، العمليات المتكافئة", "يكتب المعلم 10⁻¹ = 1/10 و10⁻² = 1/100 ويسأل: إذن ماذا يعني 35 × 10⁻¹؟ التعلم القبلي: الأس السالب من الدرس 1-3، والضرب في القوى الموجبة للعدد 10.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويستدرج الطلاب للربط بالقسمة على 10.\nالطالب: يجيب 3.5 ويبرر.\n2) النمذجة (10 دقائق):\nالمعلم: يشرح النقطتين الأساسيتين في الدليل: الضرب في 0.1، 0.01 يماثل القسمة على 10، 100؛ والقسمة على 0.1، 0.01 تماثل الضرب في 10، 100، وينمذج مثال 2-2 (ب، د).\nالطالب: يكتب العملية المكافئة لكل مثال قبل حسابه.\n3) معالجة الخطأ (8 دقائق):\nالمعلم: يعرض سؤالًا يربك الطلاب كما ينبه الدليل مثل 0.3 ÷ 10⁻² ويقترح تحويل القوة إلى عدد أو كسر أولًا.\nالطالب: يحول 10⁻² إلى 1/100 ثم يحسب 30.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالسؤالين 4 و5 من تمارين 2-2 ص 36–37 ويطلب في 4 (ب) وصف نمط النواتج المتناقصة.\nالطالب: يحل في أزواج ثم يصف النمط.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 34 × 0.1\nالإجابة النموذجية: 3.4\nس2 [المستوى المتوقع]: احسب: 6.5 × 10⁻²\nالإجابة النموذجية: 0.065\nس3 [المستوى المتقدم]: احسب: 2.4 ÷ 10⁻³\nالإجابة النموذجية: 2400", "س1 [مستوى الدعم]: احسب: 8 ÷ 0.1\nالإجابة النموذجية: 80\nس2 [المستوى المتوقع]: احسب: 0.5 ÷ 10⁻²\nالإجابة النموذجية: 50\nس3 [المستوى المتقدم]: اكتب ثلاث عمليات مختلفة تحول 37 إلى 0.37.\nالإجابة النموذجية: 37 × 10⁻²، 37 ÷ 10²، 37 × 0.01", "عزيزي الطالب: أكمل السؤالين 4 و5 من تمارين 2-2، واكتب في دفترك العمليتين المتكافئتين لكل من × 0.01 و÷ 0.01. ولي الأمر الكريم: اطلب من ابنك أن يشرح لماذا يكبر الناتج عند القسمة على 0.1."], "html": ["<ol class='ol'><li>يفسر أن الضرب في <span class=\"m\">10<sup>−ن</sup></span> يكافئ القسمة على <span class=\"m\">10<sup>ن</sup></span> وأن القسمة عليها تكافئ الضرب في <span class=\"m\">10<sup>ن</sup></span>.</li><li>يحسب نواتج الضرب والقسمة على <span class=\"m\">0.1</span> و<span class=\"m\">0.01</span> و<span class=\"m\">10<sup>−ن</sup></span>.</li><li>يكتب طرقًا مختلفة متكافئة للوصول إلى ناتج معطى. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "الأس السالب، القوى السالبة للعدد 10، العمليات المتكافئة", "يكتب المعلم <span class=\"m\">10<sup>−1</sup> = 1/10</span> و<span class=\"m\">10<sup>−2</sup> = 1/100</span> ويسأل: إذن ماذا يعني <span class=\"m\">35 × 10<sup>−1</sup></span>؟ التعلم القبلي: الأس السالب من الدرس 1-3، والضرب في القوى الموجبة للعدد 10.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويستدرج الطلاب للربط بالقسمة على 10.</td><td>يجيب <span class=\"m\">3.5</span> ويبرر.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>يشرح النقطتين الأساسيتين في الدليل: الضرب في <span class=\"m\">0.1</span>، <span class=\"m\">0.01</span> يماثل القسمة على 10، 100؛ والقسمة على <span class=\"m\">0.1</span>، <span class=\"m\">0.01</span> تماثل الضرب في 10، 100، وينمذج مثال 2-2 (ب، د).</td><td>يكتب العملية المكافئة لكل مثال قبل حسابه.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>معالجة الخطأ</td><td>يعرض سؤالًا يربك الطلاب كما ينبه الدليل مثل <span class=\"m\">0.3 ÷ 10<sup>−2</sup></span> ويقترح تحويل القوة إلى عدد أو كسر أولًا.</td><td>يحول <span class=\"m\">10<sup>−2</sup></span> إلى <span class=\"m\">1/100</span> ثم يحسب <span class=\"m\">30</span>.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤالين 4 و5 من تمارين 2-2 ص 36–37 ويطلب في 4 (ب) وصف نمط النواتج المتناقصة.</td><td>يحل في أزواج ثم يصف النمط.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">34 × 0.1</span></td><td class='ans'><span class=\"m\">3.4</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">6.5 × 10<sup>−2</sup></span></td><td class='ans'><span class=\"m\">0.065</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>احسب: <span class=\"m\">2.4 ÷ 10<sup>−3</sup></span></td><td class='ans'>2400</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">8 ÷ 0.1</span></td><td class='ans'>80</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">0.5 ÷ 10<sup>−2</sup></span></td><td class='ans'>50</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب ثلاث عمليات مختلفة تحول 37 إلى <span class=\"m\">0.37</span>.</td><td class='ans'><span class=\"m\">37 × 10<sup>−2</sup></span>، <span class=\"m\">37 ÷ 10<sup>2</sup></span>، <span class=\"m\">37 × 0.01</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤالين 4 و5 من تمارين 2-2، واكتب في دفترك العمليتين المتكافئتين لكل من <span class=\"m\">× 0.01</span> و<span class=\"m\">÷ 0.01</span>. ولي الأمر الكريم: اطلب من ابنك أن يشرح لماذا يكبر الناتج عند القسمة على <span class=\"m\">0.1</span>."]}, {"head": {"lesson": "2-2 الضرب في قوى العدد 10 والقسمة عليها", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الثالث: 20–24/9/2026م", "pages": "كتاب الطالب ص 35–37 • كتاب النشاط ص 23–24 • دليل المعلم ص 38–39", "num": "الحصة 3 من 3", "topic": "تطبيقات على الضرب في قوى العدد 10 والقسمة عليها"}, "plain": ["1) يحل تمارين متنوعة على الضرب في القوى الموجبة والسالبة للعدد 10 والقسمة عليها.\n2) يقارن بين نواتج عمليات متعددة دون حسابها كاملة.\n3) يكوّن عبارات متكافئة تعطي ناتجًا محددًا (ورقة المصادر). (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: إبداع", "التعلم التعاوني، التعلم المبني على اللعب، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورقة المصادر 2-2 من دليل المعلم", "قوى العدد 10، العمليات المتكافئة، المقارنة", "سباق سريع على السبورة: 0.9 × 100، 120 ÷ 100، 4 ÷ 0.01. التعلم القبلي: قواعد الضرب والقسمة على قوى العدد 10 الموجبة والسالبة.", "1) التهيئة (4 دقائق):\nالمعلم: يدير السباق بين صفوف الطلاب.\nالطالب: يجيب بسرعة ويصحح زميله.\n2) تعلم تعاوني (12 دقيقة):\nالمعلم: ينفذ نشاط الدليل بورقة المصادر 2-2: إكمال الأشكال البيضاوية بست طرق مختلفة تعطي العدد الموجود في الوسط.\nالطالب: تكمل المجموعة الأشكال وتناقش أسهل الطرق.\n3) كتاب النشاط (10 دقائق):\nالمعلم: يوزع تمارين كتاب النشاط ص 23–24 بحسب المستويات.\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 2-2 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 0.9 × 100\nالإجابة النموذجية: 90\nس2 [المستوى المتوقع]: احسب: 4.21 × 10⁻¹\nالإجابة النموذجية: 0.421\nس3 [المستوى المتقدم]: أيهما أكبر: 3.5 ÷ 10⁻² أم 3.5 × 10³؟\nالإجابة النموذجية: 3.5 × 10³ = 3500 أكبر من 350", "س1 [مستوى الدعم]: احسب: 120 ÷ 100\nالإجابة النموذجية: 1.2\nس2 [المستوى المتوقع]: احسب: 0.07 ÷ 0.01\nالإجابة النموذجية: 7\nس3 [المستوى المتقدم]: أوجد ن: 0.0056 × 10^(ن) = 56\nالإجابة النموذجية: ن = 4", "عزيزي الطالب: أكمل كتاب النشاط ص 23–24، ويمكنك حل ورقة المصادر 2-2 ب اختياريًا. ولي الأمر الكريم: تابع ابنك في استخدام الطرق الذهنية بدل الآلة الحاسبة."], "html": ["<ol class='ol'><li>يحل تمارين متنوعة على الضرب في القوى الموجبة والسالبة للعدد 10 والقسمة عليها.</li><li>يقارن بين نواتج عمليات متعددة دون حسابها كاملة.</li><li>يكوّن عبارات متكافئة تعطي th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">0.9 × 100</span></td><td class='ans'>90</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">4.21 × 10<sup>−1</sup></span></td><td class='ans'><span class=\"m\">0.421</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أيهما أكبر: <span class=\"m\">3.5 ÷ 10<sup>−2</sup></span> أم <span class=\"m\">3.5 × 10<sup>3</sup></span>؟</td><td class='ans'><span class=\"m\">3.5 × 10<sup>3</sup> = 3500</span> أكبر من 350</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">120 ÷ 100</span></td><td class='ans'><span class=\"m\">1.2</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">0.07 ÷ 0.01</span></td><td class='ans'>7</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أوجد ن: <span class=\"m\">0.0056 × 10<sup>ن</sup> = 56</span></td><td class='ans'>ن = 4</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 23–24، ويمكنك حل ورقة المصادر 2-2 ب اختياريًا. ولي الأمر الكريم: تابع ابنك في استخدام الطرق الذهنية بدل الآلة الحاسبة."]}]}, {"id": "2-3", "title": "التقريب", "periods": [{"head": {"lesson": "2-3 التقريب", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الرابع: 27/9–1/10/2026م", "pages": "كتاب الطالب ص 38–41 • كتاب النشاط ص 25–27 • دليل المعلم ص 40–41", "num": "الحصة 1 من 3", "topic": "التقريب لمنازل عشرية ولأرقام معنوية"}, "plain": ["1) يميز بين المنزلة العشرية والرقم المعنوي في عدد معطى.\n2) يقرّب الأعداد العشرية لعدد محدد من المنازل العشرية أو الأرقام المعنوية.\n3) يحدد مدى القيم الممكنة لعدد بعد تقريبه. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "الأرقام المعنوية، المنازل العشرية، التقريب، الرقم المعنوي الأول", "يعرض المعلم خبرًا: «أنفقت الأسرة 87.46 ريالًا» ويسأل: كيف نقرّبه لأقرب ريال؟ ولأقرب منزلة عشرية؟ التعلم القبلي: تقريب الأعداد العشرية لأقرب منزلة أو منزلتين من الصفوف السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الخبر ويطلب التقريبين.\nالطالب: يقرّب ويشرح قاعدة الرقم 5 فما فوق.\n2) النمذجة (10 دقائق):\nالمعلم: يشرح كما في الدليل: المنازل العشرية تُعد من أول رقم بعد الفاصلة، والأرقام المعنوية من أول رقم غير صفري من اليسار، بأمثلة مثل 12.48 و0.0305.\nالطالب: يحدد المنزلة العشرية الأولى والرقم المعنوي الأول في أمثلة.\n3) تعلم تعاوني (8 دقائق):\nالمعلم: يوزع بطاقات أعداد ويطلب من كل زوج تقريب العدد بطريقتين (منزلتان عشريتان، رقمان معنويان) ومقارنة النتيجتين.\nالطالب: يقرّب ويقارن ويستنتج متى تتفق الطريقتان.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 2-3 ص 39.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: قرّب 3.476 لمنزلتين عشريتين.\nالإجابة النموذجية: 3.48\nس2 [المستوى المتوقع]: ما الرقم المعنوي الأول في 0.0372؟\nالإجابة النموذجية: 3\nس3 [المستوى المتقدم]: قرّب 0.04985 لثلاثة أرقام معنوية.\nالإجابة النموذجية: 0.0499", "س1 [مستوى الدعم]: قرّب 12.65 لمنزلة عشرية واحدة.\nالإجابة النموذجية: 12.7\nس2 [المستوى المتوقع]: قرّب 0.3062 لرقمين معنويين.\nالإجابة النموذجية: 0.31\nس3 [المستوى المتقدم]: عدد قُرّب لمنزلة عشرية واحدة فأصبح 4.3. ما أصغر قيمة ممكنة له؟\nالإجابة النموذجية: 4.25", "عزيزي الطالب: اقرأ مقدمة درس التقريب ص 38، واكتب تعريف الأرقام المعنوية بمثالين. ولي الأمر الكريم: اطلب من ابنك تقريب أسعار من فاتورة منزلية لأقرب ريال."], "html": ["<ol class='ol'><li>يميز بين المنزلة العشرية والرقم المعنوي في عدد معطى.</li><li>يقرّب الأعداد العشرية لعدد محدد من المنازل العشرية أو الأرقام المعنوية.</li><li>يحدد مدى القيم الممكنة لعدد بعد تقريبه. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span بقة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويناقش الإجابة 63 000.\nالطالب: يجيب ويبرر بقاء الأصفار.\n2) معالجة الخطأ (10 دقائق):\nالمعلم: يعرض الخطأ الشائع الذي ينبه إليه الدليل: كتابة 715 تقريبًا لـ714 503 بدل 715 000، ويطلب السبب.\nالطالب: يناقش أن الأصفار تحفظ مقدار العدد.\n3) لعبة التقريب (10 دقائق):\nالمعلم: يدير لعبة «من الأقرب؟»: يعرض عددًا ويطلب تقريبه لـ1 و2 و3 أرقام معنوية بالتتابع بين الفرق.\nالطالب: يتناوب في التقريب ويصحح الفريق المنافس.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بأسئلة الأرقام المعنوية من تمارين 2-3 ص 39–40.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: قرّب 4657 لرقمين معنويين.\nالإجابة النموذجية: 4700\nس2 [المستوى المتوقع]: قرّب 82 349 لثلاثة أرقام معنوية.\nالإجابة النموذجية: 82 300\nس3 [المستوى المتقدم]: كتب طالب 715 تقريبًا للعدد 714 503 لثلاثة أرقام معنوية. صحّح خطأه.\nالإجابة النموذجية: 715 000؛ لأن الأصفار تحافظ على مقدار العدد", "س1 [مستوى الدعم]: قرّب 3841 لرقم معنوي واحد.\nالإجابة النموذجية: 4000\nس2 [المستوى المتوقع]: قرّب 0.006049 لرقمين معنويين.\nالإجابة النموذجية: 0.0060\nس3 [المستوى المتقدم]: عدد زوار 62 853. قرّبه لثلاثة أرقام معنوية ثم لرقم معنوي واحد.\nالإجابة النموذجية: 62 900، ثم 60 000", "عزيزي الطالب: أكمل أسئلة الأرقام المعنوية من تمارين 2-3، وانتبه للأصفار في الأعداد الكبيرة. ولي الأمر الكريم: اقرأ مع ابنك عددًا من خبر اقتصادي واطلب منه تقريبه."], "html": ["<ol class='ol'><li>يقرّب الأعداد الكبيرة والصغيرة لعدد محدد من الأرقام المعنوية.</li><li>يتحقق من أن العدد المقرّب يحافظ على مقدار العدد الأصلي.</li><li>يصحح أخطاء شائعة في التقريب لأرقام معنوية. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب ال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>قرّب 3841 لرقم معنوي واحد.</td><td class='ans'>4000</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>قرّب <span class=\"m\">0.006049</span> لرقمين معنويين.</td><td class='ans'><span class=\"m\">0.0060</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>عدد زوار 62 853. قرّبه لثلاثة أرقام معنوية ثم لرقم معنوي واحد.</td><td class='ans'>62 900، ثم 60 000</td></tr></tbody></table>", "عزيزي الطالب: أكمل أسئلة الأرقام المعنوية من تمارين 2-3، وانتبه للأصفار في الأعداد الكبيرة. ولي الأمر الكريم: اقرأ مع ابنك عددًا من خبر اقتصادي واطلب منه تقريبه."]}, {"head": {"lesson": "2-3 التقريب", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الرابع: 27/9–1/10/2026م", "pages": "كتاب الطالب ص 38–41 • كتاب النشاط ص 25–27 • دليل المعلم ص 40–41", "num": "الحصة 3 من 3", "topic": "التقدير بالتقريب لرقم معنوي واحد والتحقق من الإجابات"}, "plain": ["1) يقدّر نواتج عمليات حسابية بتقريب كل عدد لرقم معنوي واحد.\n2) يتحقق من صحة إجابة دقيقة بمقارنتها بالتقدير.\n3) يحلل سبب ابتعاد التقدير عن الناتج الحقيقي في بعض الحالات. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nمخرج آخر: تحليل", "التعلم المبني على اللعب، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات لعبة الشبكة من ورقة المصادر 2-3", "التقدير، التقريب لرقم معنوي واحد، التحقق من الناتج", "سؤال: اشترى سالم 48 علبة سعر الواحدة 2.1 ريال، فقال البائع: المجموع 1008 ريالات. هل هذا معقول؟ التعلم القبلي: التقريب لأرقام معنوية من الحصتين السابقتين.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح الموقف ويطلب التقدير 50 × 2 = 100.\nالطالب: يكتشف أن إجابة البائع غير معقولة.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج تقدير (39.6 × 5.1) ÷ 0.48 بالتقريب لرقم معنوي واحد ويحذّر من تقريب الأعداد قبل حساب المطلوب بدقة.\nالطالب: يكتب خطوات التقدير.\n3) لعبة الشبكة (10 دقائق):\nالمعلم: ينفذ نشاط الدليل: يكتب الطلاب تسعة أعداد من خمسة عشر في شبكة، ويقرأ المعلم بطاقة فيشطب الطالب العدد المطابق للتقريب.\nالطالب: يطابق ويشطب، والفائز أول من يشطب أعداده التسعة.\n4) المناقشة (6 دقائق):\nالمعلم: يناقش السؤال 7 من تمارين 2-3 كما يقترح الدليل: لماذا يبتعد التقدير أحيانًا عن الناتج؟ وأن القسمة على عدد أصغر تعطي ناتجًا أكبر.\nالطالب: يحلل حالة العدد الواقع في منتصف خيارين للتقريب.\n5) مسابقة ختامية (6 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 2-3 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n6) الغلق (4 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: قدّر: 48 × 21\nالإجابة النموذجية: 50 × 20 = 1000\nس2 [المستوى المتوقع]: قدّر: 612 ÷ 2.9\nالإجابة النموذجية: 600 ÷ 3 = 200\nس3 [المستوى المتقدم]: قدّر: (39.6 × 5.1) ÷ 0.48\nالإجابة النموذجية: (40 × 5) ÷ 0.5 = 400", "س1 [مستوى الدعم]: قدّر: 7.8 × 3.2\nالإجابة النموذجية: 8 × 3 = 24\nس2 [المستوى المتوقع]: قدّر: (21.7 + 18.4) ÷ 1.9\nالإجابة النموذجية: (20 + 20) ÷ 2 = 20\nس3 [المستوى المتقدم]: احسب 4.9 × 31 بدقة ثم تحقق بالتقدير.\nالإجابة النموذجية: 151.9، والتقدير 5 × 30 = 150 فالإجابة معقولة", "عزيزي الطالب: أكمل كتاب النشاط ص 25–27، واهتم بالسؤال الذي يطلب التقدير. ولي الأمر الكريم: اطلب من ابنك تقدير مجموع مشتريات قبل الدفع ثم مقارنته بالفاتورة."], "html": ["<ol class='ol'><li>يقدّر نواتج عمليات حسابية بتقريب كل عدد لرقم معنوي واحد.</li><li>يتحقق من صحة إجابة دقيقة بمقارنتها بالتقدير.</li><li>يحلل سبب ابتعاد التقدير عن الناتج الحقيقي في بعض الحالات. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span><span>أخرى: بطاقات لعبة الشبكة من ورقة المصادر 2-3</span></div>", "التقدير، التقريب لرقم معنوي واحد، التحقق من الناتج", "سؤال: اشترى سالم 48 علبة سعر الواحدة <span class=\"m\">2.1</span> ريال، فقال البائع: المجموع <span class=\"m\">1008</span> ريالات. هل هذا معقول؟ التعلم القبلي: التقريب لأرقام معنوية من الحصتين السابقتين.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح الموقف ويطلب التقدير <span class=\"m\">50 × 2 = 100</span>.</td><td>يكتشف أن إجابة البائع غير معقولة.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج تقدير <span class=\"m\">(39.6 × 5.1) ÷ 0.48</span> بالتقريب لرقم معنوي واحد ويحذّر من تقريب الأعداد قبل حساب المطلوب بدقة.</td><td>يكتب خطوات التقدير.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>لعبة الشبكة</td><td>ينفذ نشاط الدليل: يكتب الطلاب تسعة أعداد من خمسة عشر في شبكة، ويقرأ المعلم بطاقة فيشطب الطالب العدد المطابق للتقريب.</td><td>يطابق ويشطب، والفائز أول من يشطب أعداده التسعة.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>المناقشة</td><td>يناقش السؤال 7 من تمارين 2-3 كما يقترح الدليل: لماذا يبتعد التقدير أحيانًا عن الناتج؟ وأن القسمة على عدد أصغر تعطي ناتجًا أكبر.</td><td>يحلل حالة العدد الواقع في منتصف خيارين للتقريب.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 2-3 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>4<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>قدّر: <span class=\"m\">48 × 21</span></td><td class='ans'><span class=\"m\">50 × 20 = 1000</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>قدّر: <span class=\"m\">612 ÷ 2.9</span></td><td class='ans'><span class=\"m\">600 ÷ 3 = 200</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>قدّر: <span class=\"m\">(39.6 × 5.1) ÷ 0.48</span></td><td class='ans'><span class=\"m\">(40 × 5) ÷ 0.5 = 400</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>قدّر: <span class=\"m\">7.8 × 3.2</span></td><td class='ans'><span class=\"m\">8 × 3 = 24</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>قدّر: <span class=\"m\">(21.7 + 18.4) ÷ 1.9</span></td><td class='ans'><span class=\"m\">(20 + 20) ÷ 2 = 20</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>احسب <span class=\"m\">4.9 × 31</span> بدقة ثم تحقق بالتقدير.</td><td class='ans'><span class=\"m\">151.9</span>، والتقدير <span class=\"m\">5 × 30 = 150</span> فالإجابة معقولة</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 25–27، واهتم بالسؤال الذي يطلب التقدير. ولي الأمر الكريم: اطلب من ابنك تقدير مجموع مشتريات قبل الدفع ثم مقارنته بالفاتورة."]}]}, {"id": "2-4", "title": "ترتيب العمليات", "periods": [{"head": {"lesson": "2-4 ترتيب العمليات", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الرابع: 27/9–1/10/2026م", "pages": "كتاب الطالب ص 42–45 • كتاب النشاط ص 28–29 • دليل المعلم ص 42–43", "num": "الحصة 1 من 4", "topic": "ترتيب العمليات مع الأقواس والأسس"}, "plain": ["1) يطبق ترتيب العمليات (الأقواس ثم الأسس ثم الضرب والقسمة ثم الجمع والطرح) بدقة.\n2) يضع أقواسًا في جملة عددية لتعطي ناتجًا محددًا.\n3) يتذكر قواعد ترتيب العمليات ويصوغها بأسلوبه. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تذكر", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة التقليدية، الأقلام", "ترتيب العمليات، الأقواس، الأسس، الجملة العددية", "يكتب المعلم 5 + 3 × 4 ويطلب الحل فرديًا، ثم يعرض إجابتين مختلفتين (32 و17) ويسأل: أيهما صحيح ولماذا؟ التعلم القبلي: ترتيب العمليات دون أسس من الصف السابع والأسس من الوحدة الأولى.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الإجابتين ويستمع للتبريرات.\nالطالب: يحدد الإجابة الصحيحة 17 ويذكر القاعدة.\n2) النمذجة (10 دقائق):\nالمعلم: يشرح الأمثلة على السبورة دون أن يفتح الطلاب الكتاب كما يقترح الدليل، ويضيف عنصر الأسس: (8 − 2)² ÷ 4.\nالطالب: يقترح الخطوة التالية في كل مثال ويبررها.\n3) لعبة الأقواس (10 دقائق):\nالمعلم: يعرض جملًا عددية بلا أقواس ونواتج مستهدفة، ويطلب من الفرق وضع الأقواس المناسبة.\nالطالب: يجرب مواقع الأقواس ويتحقق من الناتج.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 2-4 ص 43.\nالطالب: يحل فرديًا مع كتابة الخطوات.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 5 + 3 × 4\nالإجابة النموذجية: 17\nس2 [المستوى المتوقع]: احسب: (8 − 2)² ÷ 4\nالإجابة النموذجية: 36 ÷ 4 = 9\nس3 [المستوى المتقدم]: ضع أقواسًا لتصبح الجملة صحيحة: 2 + 3 × 4 − 1 = 19\nالإجابة النموذجية: (2 + 3) × 4 − 1 = 19", "س1 [مستوى الدعم]: احسب: 20 − 12 ÷ 4\nالإجابة النموذجية: 17\nس2 [المستوى المتوقع]: احسب: 3 × 2³ − 5\nالإجابة النموذجية: 24 − 5 = 19\nس3 [المستوى المتقدم]: احسب: 6 − 2 × 3² + 4\nالإجابة النموذجية: 6 − 18 + 4 = −8", "عزيزي الطالب: اكتب قواعد ترتيب العمليات في بطاقة واحتفظ بها، وراجع الأمثلة ص 42. ولي الأمر الكريم: اسأل ابنك: لماذا لا نحسب من بداية السطر دائمًا؟"], "html": ["<ol class='ol'><li>يطبق ترتيب العمليات (الأقواس ثم الأسس ثم الضرب والقسمة ثم الجمع والطرح) بدقة.</li><li>يضع أقواسًا في جملة عددية لتعطي ناتجًا محددًا.</li><li>يتذكر قواعد ترتيب العمليات ويصوغها بأسلوبه. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تذكر</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة التقليدية</span><span>الأقلام</span></div>", "ترتيب العمليات، الأقواس، الأسس، الجملة العددية", "يكتب المعلم <span class=\"m\">5 + 3 × 4</span> ويطلب الحل فرديًا، ثم يعرض إجابتين مختلفتين (32 و17) ويسأل: أيهما صحيح ولماذا؟ التعلم القبلي: ترتيب العمليات دون أسس من الصف السابع والأسس من الوحدة الأولى.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الإجابتين ويستمع للتبريرات.</td><td>يحدد الإجابة الصحيحة 17 ويذكر القاعدة.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>يشرح الأمثلة على السبورة دون أن يفتح الطلاب الكتاب كما يقترح الدليل، ويضيف عنصر الأسس: <span class=\"m\">(8 − 2)<sup>2</sup> ÷ 4</span>.</td><td>يقترح الخطوة التالية في كل مثال ويبررها.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>لعبة الأقواس</td><td>يعرض جملًا عددية بلا أقواس ونواتج مستهدفة، ويطلب من الفرق وضع الأقواس المناسبة.</td><td>يجرب مواقع الأقواس ويتحقق من الناتج.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 2-4 ص 43.</td><td>يحل فرديًا مع كتابة الخطوات.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">5 + 3 × 4</span></td><td class='ans'>17</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">(8 − 2)<sup>2</sup> ÷ 4</span></td><td class='ans'><span class=\"m\">36 ÷ 4 = 9</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>ضع أقواسًا لتصبح الجملة صحيحة: <span class=\"m\">2 + 3 × 4 − 1 = 19</span></td><td class='ans'><span class=\"m\">(2 + 3) × 4 − 1 = 19</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">20 − 12 ÷ 4</span></td><td class='ans'>17</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">3 × 2<sup>3</sup> − 5</span></td><td class='ans'><span class=\"m\">24 − 5 = 19</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>احسب: <span class=\"m\">6 − 2 × 3<sup>2</sup> + 4</span></td><td class='ans'><span class=\"m\">6 − 18 + 4 = −8</span></td></tr></tbody></table>", "عزيزي الطالب: اكتب قواعد ترتيب العمليات في بطاقة واحتفظ بها، وراجع الأمثلة ص 42. ولي الأمر الكريم: اسأل ابنك: لماذا لا نحسب من بداية السطر دائمًا؟"]}, {"head": {"lesson": "2-4 ترتيب العمليات", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الرابع: 27/9–1/10/2026م", "pages": "كتاب الطالب ص 42–45 • كتاب النشاط ص 28–29 • دليل المعلم ص 42–43", "num": "الحصة 2 من 4", "topic": "ترتيب العمليات في الكسور والجذور واكتشاف الأخطاء"}, "plain": ["1) يحسب قيمة عبارات تتضمن خط كسر أو جذرًا تربيعيًا وفق ترتيب العمليات.\n2) يكتشف الخطأ في حل يخالف ترتيب العمليات ويصححه.\n3) يفسر أن خط الكسر والجذر يعملان عمل الأقواس. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nمخرج آخر: فهم", "التعلم التشاركي، التعلم بالنمذجة، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام", "خط الكسر، الجذر التربيعي، ترتيب العمليات، تحليل الخطأ", "يعرض المعلم (12 + 8)/(7 − 2) ويسأل: ما الذي نحسبه أولًا؟ ولماذا؟ التعلم القبلي: ترتيب العمليات مع الأقواس والأسس من الحصة السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويوضح أن خط الكسر يجمع البسط والمقام كأقواس.\nالطالب: يحسب البسط والمقام ثم يقسم.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج عبارات بجذر مثل √(36 + 64) − 3 ويبين أن ما تحت الجذر يُحسب أولًا.\nالطالب: يطبق على أمثلة مشابهة.\n3) تحليل الأخطاء (11 دقيقة):\nالمعلم: يناقش السؤال 4 من تمارين 2-4 (حل عائشة): كل عملية صحيحة منفردة لكن الترتيب خاطئ، ثم السؤال 5 (راشد ومهند).\nالطالب: يحدد موضع الخطأ ويقترح أسبابه المحتملة ويصححه.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بأسئلة تتضمن خط الكسر والجذر من تمارين 2-4 ص 44.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: (12 + 8)/(7 − 2)\nالإجابة النموذجية: 4\nس2 [المستوى المتوقع]: احسب: √(36 + 64) − 3\nالإجابة النموذجية: 10 − 3 = 7\nس3 [المستوى المتقدم]: حل طالب 10 − 4 + 2 فكتب 10 − 6 = 4. أين الخطأ؟\nالإجابة النموذجية: الجمع والطرح يُجريان بترتيب ورودهما: 10 − 4 = 6 ثم 6 + 2 = 8", "س1 [مستوى الدعم]: احسب: (15 − 3)/4\nالإجابة النموذجية: 3\nس2 [المستوى المتوقع]: احسب: 2 × (5 − 8)²\nالإجابة النموذجية: 2 × 9 = 18\nس3 [المستوى المتقدم]: احسب: (3² + 4²) ÷ √25\nالإجابة النموذجية: 25 ÷ 5 = 5", "عزيزي الطالب: أعد حل السؤالين 4 و5 من تمارين 2-4 واكتب سبب الخطأ في كل منهما. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك خطأ عائشة في السؤال 4."], "html": ["<ol class='ol'><li>يحسب قيمة عبارات تتضمن خط كسر أو جذرًا تربيعيًا وفق ترتيب العمليات.</li><li>يكتشف الخطأ في حل يخالف ترتيب العمليات ويصححه.</li><li>يفسر أن خط الكسر والجذر يعملان عمل الأقواس. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> فهم</span></div>", "<div class='chips'><span>التعلم التشاركي</span><span>التعلم بالنمذجة</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "خط الكسر، الجذر التربيعي، ترتيب العمليات، تحليل الخطأ", "يعرض المعلم <span class=\"m\">(12 + 8)/(7 − 2)</span> ويسأل: ما الذي نحسبه أولًا؟ ولماذا؟ التعلم القبلي: ترتيب العمليات مع الأقواس والأسس من الحصة السابقة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويوضح أن خط الكسر يجمع البسط والمقام كأقواس.</td><td>يحسب البسط والمقام ثم يقسم.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج عبارات بجذر مثل <span class=\"m\">√(36 + 64) − 3</span> ويبين أن ما تحت الجذر يُحسب أولًا.</td><td>يطبق على أمثلة مشابهة.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>تحليل الأخطاء</td><td>يناقش السؤال 4 من تمارين 2-4 (حل عائشة): كل عملية صحيحة منفردة لكن الترتيب خاطئ، ثم السؤال 5 (راشد ومهند).</td><td>يحدد موضع الخطأ ويقترح أسبابه المحتملة ويصححه.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بأسئلة تتضمن خط الكسر والجذر من تمارين 2-4 ص 44.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">(12 + 8)/(7 − 2)</span></td><td class='ans'>4</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">√(36 + 64) − 3</span></td><td class='ans'><span class=\"m\">10 − 3 = 7</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>حل طالب <span class=\"m\">10 − 4 + 2</span> فكتب <span class=\"m\">10 − 6 = 4</span>. أين الخطأ؟</td><td class='ans'>الجمع والطرح يُجريان بترتيب ورودهما: <span class=\"m\">10 − 4 = 6</span> ثم <span class=\"m\">6 + 2 = 8</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">(15 − 3)/4</span></td><td class='ans'>3</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">2 × (5 − 8)<sup>2</sup></span></td><td class='ans'><span class=\"m\">2 × 9 = 18</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>احسب: <span class=\"m\">(3<sup>2</sup> + 4<sup>2</sup>) ÷ √25</span></td><td class='ans'><span class=\"m\">25 ÷ 5 = 5</span></td></tr></tbody></table>", "عزيزي الطالب: أعد حل السؤالين 4 و5 من تمارين 2-4 واكتب سبب الخطأ في كل منهما. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك خطأ عائشة في السؤال 4."]}, {"head": {"lesson": "2-4 ترتيب العمليات", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الرابع: 27/9–1/10/2026م", "pages": "كتاب الطالب ص 42–45 • كتاب النشاط ص 28–29 • دليل المعلم ص 42–43", "num": "الحصة 3 من 4", "topic": "تكوين الأعداد باستخدام ترتيب العمليات"}, "plain": ["1) يكوّن جملًا عددية بأربعة أرقام معطاة باستخدام العمليات والأقواس والأسس.\n2) يتحقق من صحة جمل زملائه وفق ترتيب العمليات.\n3) يحسب قيم جمل عددية متنوعة بدقة. (مخرج تعليمي آخر)", "المخرج 1: إبداع\nالمخرج 2: تقييم\nمخرج آخر: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة التقليدية، الأقلام، أخرى: بطاقات الأرقام 1–9", "ترتيب العمليات، الأقواس، المربع، الجملة العددية", "يعرض المعلم الأرقام 1، 2، 3، 4 ويسأل: هل تستطيع تكوين العدد 10 باستخدامها جميعًا مرة واحدة؟ التعلم القبلي: قواعد ترتيب العمليات مع الأقواس والأسس وخط الكسر.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح التحدي ويقبل حلولًا متعددة.\nالطالب: يقترح 1 + 2 + 3 + 4 و4 × 3 − 2 × 1.\n2) نشاط تكوين الأعداد (17 دقيقة):\nالمعلم: ينفذ نشاط الدليل: كل مجموعة تكوّن أكبر عدد من النواتج المختلفة (من 1 إلى 20) بالأرقام الأربعة، مع نقطة لكل عدد صحيح ونقطة إضافية لكل استخدام مناسب للأقواس والمربعات، وزمن 15 دقيقة.\nالطالب: تكتب المجموعة الجمل وتراجعها مجموعة أخرى.\n3) الممارسة (12 دقيقة):\nالمعلم: يكلف بالسؤالين 9 و10 من تمارين 2-4 اللذين يتناولان هدف «يحسب بدقة».\nالطالب: يحل فرديًا.\n4) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 4 + 6 ÷ 2\nالإجابة النموذجية: 7\nس2 [المستوى المتوقع]: احسب: (1 + 2)² − 3 × 4\nالإجابة النموذجية: 9 − 12 = −3\nس3 [المستوى المتقدم]: كوّن العدد 10 من الأرقام 1، 2، 3، 4 (كل منها مرة واحدة) بطريقتين.\nالإجابة النموذجية: 1 + 2 + 3 + 4، 4 × 3 − 2 × 1", "س1 [مستوى الدعم]: احسب: 9 − 2 × 3\nالإجابة النموذجية: 3\nس2 [المستوى المتوقع]: احسب: 5² − 4² ÷ 2\nالإجابة النموذجية: 25 − 8 = 17\nس3 [المستوى المتقدم]: كوّن العدد 1 من الأرقام 2، 3، 4، 5 (كل منها مرة واحدة).\nالإجابة النموذجية: مثل (5 − 4) × (3 − 2)", "عزيزي الطالب: حاول تكوين الأعداد من 11 إلى 15 بالأرقام 1، 2، 3، 4 وسجّل جملك. ولي الأمر الكريم: شارك ابنك هذا التحدي كلعبة عائلية قصيرة."], "html": ["<ol class='ol'><li>يكوّن جملًا عددية بأربعة أرقام معطاة باستخدام العمليات والأقواس والأسس.</li><li>يتحقق من صحة جمل زملائه وفق ترتيب العمليات.</li><li>يحسب قيم جمل عددية متنوعة بدقة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> إبداع</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> تطبيق</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة التقليدية</span><span>الأقلام</span><span>أخرى: بطاقات الأرقام 1–9</span></div>", "ترتيب العمليات، الأقواس، المربع، الجملة العددية", "يعرض المعلم الأرقام 1، 2، 3، 4 ويسأل: هل تستطيع تكوين العدد 10 باستخدامها جميعًا مرة واحدة؟ التعلم القبلي: قواعد ترتيب العمليات مع الأقواس والأسس وخط الكسر.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح التحدي ويقبل حلولًا متعددة.</td><td>يقترح <span class=\"m\">1 + 2 + 3 + 4</span> و<span class=\"m\">4 × 3 − 2 × 1</span>.</td></tr><tr><td class='tm'>17<small>د</small></td><td class='ph'>نشاط تكوين الأعداد</td><td>ينفذ نشاط الدليل: كل مجموعة تكوّن أكبر عدد من النواتج المختلفة (من 1 إلى 20) بالأرقام الأربعة، مع نقطة لكل عدد صحيح ونقطة إضافية لكل استخدام مناسب للأقواس والمربعات، وزمن 15 دقيقة.</td><td>تكتب المجموعة الجمل وتراجعها مجموعة أخرى.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤالين 9 و10 من تمارين 2-4 اللذين يتناولان هدف «يحسب بدقة».</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">4 + 6 ÷ 2</span></td><td class='ans'>7</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">(1 + 2)<sup>2</sup> − 3 × 4</span></td><td class='ans'><span class=\"m\">9 − 12 = −3</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كوّن العدد 10 من الأرقام 1، 2، 3، 4 (كل منها مرة واحدة) بطريقتين.</td><td class='ans'><span class=\"m\">1 + 2 + 3 + 4</span>، <span class=\"m\">4 × 3 − 2 × 1</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">9 − 2 × 3</span></td><td class='ans'>3</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">5<sup>2</sup> − 4<sup>2</sup> ÷ 2</span></td><td class='ans'><span class=\"m\">25 − 8 = 17</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كوّن العدد 1 من الأرقام 2، 3، 4، 5 (كل منها مرة واحدة).</td><td class='ans'>مثل <span class=\"m\">(5 − 4) × (3 − 2)</span></td></tr></tbody></table>", "عزيزي الطالب: حاول تكوين الأعداد من 11 إلى 15 بالأرقام 1، 2، 3، 4 وسجّل جملك. ولي الأمر الكريم: شارك ابنك هذا التحدي كلعبة عائلية قصيرة."]}, {"head": {"lesson": "2-4 ترتيب العمليات", "unit": "الوحدة الثانية: القيمة المكانية والترتيب والتقريب", "week": "الأسبوع الرابع: 27/9–1/10/2026م", "pages": "كتاب الطالب ص 42–45 • كتاب النشاط ص 28–29 • دليل المعلم ص 42–43", "num": "الحصة 4 من 4", "topic": "تطبيقات على ترتيب العمليات ومراجعة الوحدة الثانية"}, "plain": ["1) يحل تمارين كتاب النشاط على ترتيب العمليات بدقة.\n2) يربط بين ترتيب العمليات والتقريب في حساب نواتج عشرية.\n3) يتحقق من نواتجه بالتقدير قبل اعتمادها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم الذاتي، التعلم المبني على اللعب، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "ترتيب العمليات، التقريب، التقدير، الأعداد العشرية", "خريطة مفاهيم سريعة على السبورة لمفاهيم الوحدة الثانية (الضرب الذهني، قوى العدد 10، التقريب، ترتيب العمليات). التعلم القبلي: كل دروس الوحدة الثانية.", "1) التهيئة (5 دقائق):\nالمعلم: يكمل الخريطة مع الطلاب بمثال لكل مفهوم.\nالطالب: يقترح الأمثلة ويكتبها.\n2) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 28–29 بحسب المستويات.\nالطالب: يحل فرديًا ثم يقارن.\n3) ربط المفاهيم (8 دقائق):\nالمعلم: يطرح سؤالًا يجمع ترتيب العمليات والتقريب: (4.72 + 3.1²) ÷ 2.5 لمنزلتين عشريتين.\nالطالب: يحسب ويقرّب ويتحقق بالتقدير.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 2-4 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: 18 ÷ (2 + 4)\nالإجابة النموذجية: 3\nس2 [المستوى المتوقع]: احسب: 0.5 × (6 − 2)²\nالإجابة النموذجية: 8\nس3 [المستوى المتقدم]: احسب (4.72 + 3.1²) ÷ 2.5 مقربًا لمنزلتين عشريتين.\nالإجابة النموذجية: (4.72 + 9.61) ÷ 2.5 = 5.732 ≈ 5.73", "س1 [مستوى الدعم]: احسب: 7 + 3 × (5 − 1)\nالإجابة النموذجية: 19\nس2 [المستوى المتوقع]: احسب: (−3)² + 2 × (−4)\nالإجابة النموذجية: 9 − 8 = 1\nس3 [المستوى المتقدم]: قدّر 19.8 × 0.51 ثم احسبه لمنزلة عشرية واحدة.\nالإجابة النموذجية: التقدير 20 × 0.5 = 10؛ والناتج 10.098 ≈ 10.1", "عزيزي الطالب: أكمل كتاب النشاط ص 28–29، وراجع مفردات الوحدة الثانية. ولي الأمر الكريم: تابع ابنك في مراجعة الوحدة واطلع على صفحات النشاط المنجزة."], "html": ["<ol class='ol'><li>يحل تمارين كتاب النشاط على ترتيب العمليات بدقة.</li><li>يربط بين ترتيب العمليات والتقريب في حساب نواتج عشرية.</li><li>يتحقق من نواتجه بالتقدير قبل اعتمادها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم الذاتي</span><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "ترتيب العمليات، التقريب، التقدير، الأعداد العشرية", "خريطة مفاهيم سريعة على السبورة لمفاهيم الوحدة الثانية (الضرب الذهني، قوى العدد 10، التقريب، ترتيب العمليات). التعلم القبلي: كل دروس الوحدة الثانية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يكمل الخريطة مع الطلاب بمثال لكل مفهوم.</td><td>يقترح الأمثلة ويكتبها.</td></tr><tr><td class='tm'>14<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 28–29 بحسب المستويات.</td><td>يحل فرديًا ثم يقارن.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>ربط المفاهيم</td><td>يطرح سؤالًا يجمع ترتيب العمليات والتقريب: <span class=\"m\">(4.72 + 3.1<sup>2</sup>) ÷ 2.5</span> لمنزلتين عشريتين.</td><td>يحسب ويقرّب ويتحقق بالتقدير.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 2-4 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">18 ÷ (2 + 4)</span></td><td class='ans'>3</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">0.5 × (6 − 2)<sup>2</sup></span></td><td class='ans'>8</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>احسب <span class=\"m\">(4.72 + 3.1<sup>2</sup>) ÷ 2.5</span> مقربًا لمنزلتين عشريتين.</td><td class='ans'><span class=\"m\">(4.72 + 9.61) ÷ 2.5 = 5.732 ≈ 5.73</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">7 + 3 × (5 − 1)</span></td><td class='ans'>19</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">(−3)<sup>2</sup> + 2 × (−4)</span></td><td class='ans'><span class=\"m\">9 − 8 = 1</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>قدّر <span class=\"m\">19.8 × 0.51</span> ثم احسبه لمنزلة عشرية واحدة.</td><td class='ans'>التقدير <span class=\"m\">20 × 0.5 = 10</span>؛ والناتج <span class=\"m\">10.098 ≈ 10.1</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 28–29، وراجع مفردات الوحدة الثانية. ولي الأمر الكريم: تابع ابنك في مراجعة الوحدة واطلع على صفحات النشاط المنجزة."]}]}, {"id": "3-1", "title": "رسم شبكات للمجسمات", "periods": [{"head": {"lesson": "3-1 رسم شبكات للمجسمات", "unit": "الوحدة الثالثة: الشبكات والزوايا", "week": "الأسبوع الخامس: 4–8/10/2026م", "pages": "كتاب الطالب ص 49–51 • كتاب النشاط ص 30–32 • دليل المعلم ص 51–52", "num": "الحصة 1 من 2", "topic": "رسم شبكات المكعب ومتوازي المستطيلات"}, "plain": ["1) يرسم شبكة مكعب ومتوازي مستطيلات بأبعاد دقيقة على ورق مربعات.\n2) يحدد الأوجه المتقابلة في الشبكة والأحرف التي تتلاقى عند الطي.\n3) يميز الشبكات الصحيحة للمكعب من غير الصحيحة ويبرر. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على المشاريع", "الكتاب، الأقلام، نماذج مجسمة، أخرى: ورق مربعات ومقص ومسطرة وعلب كرتونية", "الشبكة، المجسم، الوجه، الحرف، الرأس، متوازي المستطيلات", "يفك المعلم علبة كرتونية أمام الطلاب ويفردها، ويسأل: ما الأشكال التي تكوّن هذه العلبة؟ وكيف تعود مجسمًا؟ التعلم القبلي: خصائص المكعب ومتوازي المستطيلات (الأوجه والأحرف والرؤوس) واستخدام المسطرة.", "1) التهيئة (5 دقائق):\nالمعلم: يفك العلبة ويعرض الشبكة الناتجة.\nالطالب: يعد الأوجه ويصف شكلها.\n2) الاكتشاف (10 دقائق):\nالمعلم: يطلب من المجموعات إيجاد أكبر عدد من الشبكات المختلفة للمكعب بستة مربعات على ورق المربعات وقصها واختبارها بالطي.\nالطالب: يرسم ويقص ويطوي ويصنّف الشبكات الصحيحة.\n3) النمذجة (9 دقائق):\nالمعلم: ينمذج رسم شبكة متوازي مستطيلات أبعاده 4 × 3 × 2 سم بالمسطرة كما في مثال 3-1 ص 49، ويؤكد دقة القياس لأن معظم الأخطاء من ضعف الرسم والقياس.\nالطالب: يرسم الشبكة نفسها ويسمّي أوجهها المتقابلة.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 3-1 ص 50، ويحث كل طالب على تسمية شبكته كما يوصي الدليل.\nالطالب: يرسم ويطوي ويتحقق.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: كم وجهًا في شبكة المكعب؟ وما شكلها؟\nالإجابة النموذجية: 6 أوجه مربعة متطابقة\nس2 [المستوى المتوقع]: في شبكة متوازي مستطيلات أبعاده 5 × 3 × 2 سم، ما أبعاد الأوجه؟\nالإجابة النموذجية: زوجان 5 × 3، وزوجان 5 × 2، وزوجان 3 × 2\nس3 [المستوى المتقدم]: ستة مربعات مرتبة في صف واحد. هل تكوّن شبكة مكعب؟ برّر.\nالإجابة النموذجية: لا؛ عند الطي تتداخل الأوجه ويبقى وجهان مفتوحان", "س1 [مستوى الدعم]: ما عدد أحرف المكعب؟\nالإجابة النموذجية: 12 حرفًا\nس2 [المستوى المتوقع]: ارسم شبكة مكعب طول حرفه 3 سم بشكل يختلف عن شبكة زميلك.\nالإجابة النموذجية: تقبل أي شبكة صحيحة من الشبكات الإحدى عشرة\nس3 [المستوى المتقدم]: في شبكة مكعب مرقّمة، كيف تحدد الوجه المقابل للوجه 1؟\nالإجابة النموذجية: الوجه المقابل لا يشترك معه في حرف، ويفصله عنه وجه واحد في الشبكة", "عزيزي الطالب: ارسم شبكة متوازي مستطيلات لعلبة من منزلك وقصها واطوها، وراجع مثال 3-1 ص 49. ولي الأمر الكريم: وفّر لابنك علبة فارغة ليفكها ويقيس أبعادها."], "html": ["<ol class='ol'><li>يرسم شبكة مكعب ومتوازي مستطيلات بأبعاد دقيقة على ورق مربعات.</li><li>يحدد الأوجه المتقابلة في الشبكة والأحرف التي تتلاقى عند الطي.</li><li>يميز الشبكات الصحيحة للمكعب من غير الصحيحة ويبرر. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span><span>التعلم المبني على المشاريع</span></div>", "<div class='chips r'><span>الكتاب</span><span>الأقلام</span><span>نماذج مجسمة</span><span>أخرى: ورق مربعات ومقص ومسطرة وعلب كرتونية</span></div>", "الشبكة، المجسم، الوجه، الحرف، الرأس، متوازي المستطيلات", "يفك المعلم علبة كرتونية أمام الطلاب ويفردها، ويسأل: ما الأشكال التي تكوّن هذه العلبة؟ وكيف تعود مجسمًا؟ التعلم القبلي: خصائص المكعب ومتوازي المستطيلات (الأوجه والأحرف والرؤوس) واستخدام المسطرة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يفك العلبة ويعرض الشبكة الناتجة.</td><td>يعد الأوجه ويصف شكلها.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الاكتشاف</td><td>يطلب من المجموعات إيجاد أكبر عدد من الشبكات المختلفة للمكعب بستة مربعات ع
