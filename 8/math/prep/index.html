d></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد <span class=\"m\">1/5</span> من 45.</td><td class='ans'>9</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد <span class=\"m\">3/8</span> من 64 ذهنيًا.</td><td class='ans'>24</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أيهما أكبر: <span class=\"m\">2/3</span> من 60 أم <span class=\"m\">0.65</span> من 60؟ برّر.</td><td class='ans'><span class=\"m\">2/3</span> من 60 = 40 أكبر من 39</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب <span class=\"m\">0.125</span> في صورة كسر.</td><td class='ans'><span class=\"m\">1/8</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد <span class=\"m\">2/5</span> من 35.</td><td class='ans'>14</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب <span class=\"m\">7/20</span> كسرًا عشريًا ثم نسبة مئوية ذهنيًا.</td><td class='ans'><span class=\"m\">0.35</span> و35%</td></tr></tbody></table>", "عزيزي الطالب: احفظ جدول التحويل بين الكسور الشائعة (<span class=\"m\">1/2، 1/4، 1/5، 1/8، 1/10</span>) وكسورها العشرية. ولي الأمر الكريم: اطرح على ابنك أسئلة ذهنية مثل: <span class=\"m\">3/4</span> من 20 ريالًا."]}, {"head": {"lesson": "4-5 التعامل مع الكسور ذهنيًا", "unit": "الوحدة الرابعة: الكسور", "week": "الأسبوع السابع: 18–22/10/2026م", "pages": "كتاب الطالب ص 72–74 • كتاب النشاط ص 44–45 • دليل المعلم ص 75–76", "num": "الحصة 2 من 3", "topic": "استراتيجيات ذهنية للعمليات على الكسور"}, "plain": ["1) يجمع الكسور ويطرحها ويضربها ذهنيًا باستخدام التجزئة والتعويض.\n2) يقارن بين الحل الذهني والحل الكتابي من حيث السرعة والدقة.\n3) يبتكر طريقة ذهنية لحساب ناتج معطى ويشرحها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nمخرج آخر: إبداع", "التعلم التشاركي، التعلم بالنمذجة، التعلم المبني على اللعب", "الكتاب، السبورة التقليدية، الأقلام", "الحساب الذهني، التجزئة، الكسور المتكافئة", "يكتب المعلم 3/4 + 5/8 ويطلب من نصف الصف حلًا كتابيًا ومن النصف الآخر حلًا ذهنيًا ويقارن الوقت. التعلم القبلي: العمليات الأربع على الكسور.", "1) التهيئة (5 دقائق):\nالمعلم: يدير المقارنة.\nالطالب: يشارك ويقارن.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج استراتيجيات: تجزئة 2 1/2 × 6 = 12 + 3، والتعويض 1 − 3/8 = 5/8، والتحويل إلى عشري.\nالطالب: يحل أمثلة بالاستراتيجية الأنسب.\n3) الممارسة (12 دقيقة):\nالمعلم: يكلف بالسؤالين 3 و4 من تمارين 4-5 (لا يُتوقع صعوبة كبيرة لاستخدام الطرق الذهنية كما يشير الدليل).\nالطالب: يحل ذهنيًا ويكتب الطريقة باختصار.\n4) المشاركة (7 دقائق):\nالمعلم: يطلب من بعض الطلاب عرض استراتيجياتهم المختلفة للسؤال نفسه.\nالطالب: يعرض ويقارن.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب ذهنيًا: 1/2 + 1/4\nالإجابة النموذجية: 3/4\nس2 [المستوى المتوقع]: احسب ذهنيًا: 2 1/2 × 6\nالإجابة النموذجية: 12 + 3 = 15\nس3 [المستوى المتقدم]: احسب ذهنيًا: 3/4 + 5/8 واشرح طريقتك.\nالإجابة النموذجية: 6/8 + 5/8 = 11/8 = 1 3/8", "س1 [مستوى الدعم]: احسب ذهنيًا: 1 − 3/8\nالإجابة النموذجية: 5/8\nس2 [المستوى المتوقع]: احسب ذهنيًا: (1/4) × 36\nالإجابة النموذجية: 9\nس3 [المستوى المتقدم]: احسب ذهنيًا: 3 1/3 × 9\nالإجابة النموذجية: 27 + 3 = 30", "عزيزي الطالب: أكمل السؤالين 3 و4 من تمارين 4-5 بالطرق الذهنية. ولي الأمر الكريم: شجع ابنك على الحساب الذهني للكسور أثناء التسوق."], "html": ["<ol class='ol'><li>يجمع الكسور ويطرحها ويضربها ذهنيًا باستخدام التجزئة والتعويض.</li><li>يقارن بين الحل الذهني والحل الكتابي من حيث السرعة والدقة.</li><li>يبتكر طريقة ذهنية لحساب ناتج معطى ويشرحها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم التشاركي</span><span>التعلم بالنمذجة</span><span>التعلم المبني على اللعب</span></div>", "<div صة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: اكتب 18/24 في أبسط صورة.\nالإجابة النموذجية: 3/4\nس2 [المستوى المتوقع]: احسب: (2/3) × (9/10) ÷ (3/5)\nالإجابة النموذجية: (3/5) ÷ (3/5) = 1\nس3 [المستوى المتقدم]: احسب: (1/2 + 1/3) × 6 بطريقتين.\nالإجابة النموذجية: 5؛ إما (5/6) × 6 أو 3 + 2", "س1 [مستوى الدعم]: أوجد 3/4 من 48.\nالإجابة النموذجية: 36\nس2 [المستوى المتوقع]: احسب: 1 1/2 + 2 2/3\nالإجابة النموذجية: 4 1/6\nس3 [المستوى المتقدم]: احسب: (3/4 − 1/2) ÷ (1/8)\nالإجابة النموذجية: (1/4) ÷ (1/8) = 2", "عزيزي الطالب: أكمل كتاب النشاط ص 44–45 وراجع الوحدة الرابعة. ولي الأمر الكريم: اطّلع على ملخص ابنك للوحدة وشجعه على حل سؤالين إضافيين."], "html": ["<ol class='ol'><li>يوظف العمليات على الكسور في حل مسائل متنوعة.</li><li>يربط بين مفاهيم الوحدة (التبسيط، الجمع، الضرب، القسمة، الحساب الذهني).</li><li>يحكم على معقولية نتائج العمليات على الكسور. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم الذاتي</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "الكسور، العمليات الأربع، الحساب الذهني", "خريطة الوحدة: يعرض المعلم أربعة مربعات (تبسيط، جمع وطرح، ضرب، قسمة) ويطلب مثالًا لكل منها. التعلم القبلي: دروس الوحدة الرابعة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يكمل الخريطة مع الطلاب.</td><td>يقترح الأمثلة.</td></tr><tr><td class='tm'>15<small>د</small></td><td class='ph'>كتاب  ص 44–45 وراجع الوحدة الرابعة. ولي الأمر الكريم: اطّلع على ملخص ابنك للوحدة وشجعه على حل سؤالين إضافيين."]}]}, {"id": "5-1", "title": "كتابة المعادلات وحلها", "periods": [{"head": {"lesson": "5-1 كتابة المعادلات وحلها", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع الثامن: 25–29/10/2026م", "pages": "كتاب الطالب ص 78–79 • كتاب النشاط ص 46–48 • دليل المعلم ص 84–85", "num": "الحصة 1 من 4", "topic": "كتابة المعادلات من مواقف لفظية وأشكال هندسية"}, "plain": ["1) يكتب معادلة خطية تمثل موقفًا لفظيًا أو علاقة في شكل هندسي.\n2) يميز بين العبارة الجبرية والمعادلة.\n3) يحدد المجهول المناسب ويعرّفه بوضوح قبل كتابة المعادلة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام", "المعادلة، المجهول، العبارة الجبرية، الطرفان", "لغز: «فكرتُ في عدد، ضربته في 3 وأضفت 7 فكان الناتج 34». كيف نكتب ذلك رياضيًا؟ التعلم القبلي: العبارات الجبرية البسيطة وحل المعادلات بخطوة واحدة من الصف السابع.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح اللغز ويكتب 3س + 7 = 34.\nالطالب: يقترح التمثيل ويحل اللغز ذهنيًا.\n2) النمذجة (9 دقائق):\nالمعلم: يميز بين العبارة 3س + 7 والمعادلة 3س + 7 = 34، وينمذج كتابة معادلة من شكل هندسي (مثلث متطابق الضلعين محيطه معلوم).\nالطالب: يكتب معادلة لشكل آخر.\n3) تعلم تعاوني (10 دقائق):\nالمعلم: يوزع بطاقات مواقف لفظية وأشكالًا (مستطيل، مثلث بأطوال جبرية) وتكتب كل مجموعة معادلة لكل بطاقة.\nالطالب: يكتب المعادلات ويعرّف المجهول.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالسؤال 3 من تمارين 5-1 ص 79 ويذكّر بأن الخطوط القصيرة على أضلاع الشكل تعني تساويها.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: اكتب معادلة: «عدد مضافًا إليه 9 يساوي 20».\nالإجابة النموذجية: س + 9 = 20\nس2 [المستوى المتوقع]: مثلث متطابق الضلعين، طول كل من ضلعيه المتطابقين س سم والقاعدة 6 سم، ومحيطه 22 سم. اكتب معادلة.\nالإجابة النموذجية: 2س + 6 = 22\nس3 [المستوى المتقدم]: عمر أحمد ضعف عمر أخيه، ومجموع عمريهما 27 سنة. اكتب معادلة ووضح ما يمثله المجهول.\nالإجابة النموذجية: س عمر الأخ: س + 2س = 27", "س1 [مستوى الدعم]: أي مما يلي معادلة: 4س − 1 أم 4س − 1 = 11؟\nالإجابة النموذجية: 4س − 1 = 11\nس2 [المستوى المتوقع]: مستطيل طوله س + 3 وعرضه س، ومحيطه 26. اكتب معادلة.\nالإجابة النموذجية: 2(س + 3) + 2س = 26 أو 4س + 6 = 26\nس3 [المستوى المتقدم]: اكتب موقفًا حياتيًا تمثله المعادلة 5س + 2 = 17.\nالإجابة النموذجية: مثل: اشترى 5 أقلام بسعر س ريال ودفع 2 ريال للدفتر فكان المجموع 17", "عزيزي الطالب: اكتب ثلاث معادلات لمواقف من حياتك اليومية، وراجع الأمثلة ص 78. ولي الأمر الكريم: شارك ابنك ألغاز «فكرتُ في عدد» واطلب منه كتابتها معادلات."], "html": ["<ol class='ol'><li>يكتب معادلة خطية تمثل موقفًا لفظيًا أو علاقة في شكل هندسي.</li><li>يميز بين العبارة الجبرية والمعادلة.</li><li>يحدد المجهول المناسب ويعرّفه بوضوح قبل كتابة المعادلة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "المعادلة، المجهول، العبارة الجبرية، الطرفان", "لغز: «فكرتُ في عدد، ضربته في 3 وأضفت 7 فكان الناتج 34». كيف نكتب ذلك رياضيًا؟ التعلم القبلي: العبارات الجبرية البسيطة وحل المعادلات بخطوة واحدة من الصف السابع.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح اللغز ويكتب <span class=\"m\">3س + 7 = 34</span>.</td><td>يقترح التمثيل ويحل اللغز ذهنيًا.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>يميز بين العبارة <span class=\"m\">3س + 7</span> والمعادلة <span class=\"m\">3س + 7 = 34</span>، وينمذج كتابة معادلة من شكل هندسي (مثلث متطابق الضلعين محيطه معلوم).</td><td>يكتب معادلة لشكل آخر.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>تعلم تعاوني</td><td>يوزع بطاقات مواقف لفظية وأشكالًا (مستطيل، مثلث بأطوال جبرية) وتكتب كل مجموعة معادلة لكل بطاقة.</td><td>يكتب المعادلات ويعرّف المجهول.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤال 3 من تمارين 5-1 ص 79 ويذكّر بأن الخطوط القصيرة على أضلاع الشكل تعني تساويها.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب معادلة: «عدد مضافًا إليه 9 يساوي 20».</td><td class='ans'><span class=\"m\">س + 9 = 20</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>مثلث متطابق الضلعين، طول كل من ضلعيه المتطابقين س سم والقاعدة 6 سم، ومحيطه 22 سم. اكتب معادلة.</td><td class='ans'><span class=\"m\">2س + 6 = 22</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>عمر أحمد ضعف عمر أخيه، ومجموع عمريهما 27 سنة. اكتب معادلة ووضح ما يمثله المجهول.</td><td class='ans'>س عمر الأخ: <span class=\"m\">س + 2س = 27</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أي مما يلي معادلة: <span class=\"m\">4س − 1</span> أم <span class=\"m\">4س − 1 = 11</span>؟</td><td class='ans'><span class=\"m\">4س − 1 = 11</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>مستطيل طوله <span class=\"m\">س + 3</span> وعرضه س، ومحيطه 26. اكتب معادلة.</td><td class='ans'><span class=\"m\">2(س + 3) + 2س = 26</span> أو <span class=\"m\">4س + 6 = 26</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب موقفًا حياتيًا تمثله المعادلة <span class=\"m\">5س + 2 = 17</span>.</td><td class='ans'>مثل: اشترى 5 أقلام بسعر س ريال ودفع 2 ريال للدفتر فكان المجموع 17</td></tr></tbody></table>", "عزيزي الطالب: اكتب ثلاث معادلات لمواقف من حياتك اليومية، وراجع الأمثلة ص 78. ولي الأمر الكريم: شارك ابنك ألغاز «فكرتُ في عدد» واطلب منه كتابتها معادلات."]}, {"head": {"lesson": "5-1 كتابة المعادلات وحلها", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع الثامن: 25–29/10/2026م", "pages": "كتاب الطالب ص 78–79 • كتاب النشاط ص 46–48 • دليل المعلم ص 84–85", "num": "الحصة 2 من 4", "topic": "حل المعادلات ذات الخطوتين والمجهول في الطرفين"}, "plain": ["1) يحل معادلات خطية من خطوتين بالعمليات العكسية.\n2) يحل معادلات فيها المجهول في الطرفين بتجميع الحدود المتشابهة.\n3) يتحقق من الحل بالتعويض في المعادلة الأصلية. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم بالنمذجة، التعلم التشاركي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: نموذج الميزان", "حل المعادلة، العمليات العكسية، التحقق، المجهول في الطرفين", "يعرض المعلم ميزانًا متوازنًا: في الكفة الأولى 3 أكياس متماثلة و4 مكعبات، وفي الأخرى كيس و10 مكعبات. كم مكعبًا في الكيس؟ التعلم القبلي: كتابة المعادلات من الحصة السابقة والعمليات العكسية.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الميزان ويطلب خطوة تحافظ على التوازن.\nالطالب: يقترح إزالة كيس من الكفتين.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج مثال 5-1 ص 78: 3س + 4 = س + 10 ⟵ 2س + 4 = 10 ⟵ 2س = 6 ⟵ س = 3، مع التحقق.\nالطالب: يدوّن الخطوات ويبرر كل خطوة.\n3) لعبة المعادلة (8 دقائق):\nالمعلم: يدير لعبة «أكمل الخطوة»: يكتب المعلم معادلة، وكل طالب في المجموعة يكتب خطوة واحدة ويمرر الورقة.\nالطالب: يكتب خطوته ويتحقق من خطوة زميله.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالسؤال 1 من تمارين 5-1 ويحيل المتعثرين إلى المثال المحلول كما ينصح الدليل.\nالطالب: يحل فرديًا ويتحقق.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: حل: 2س + 5 = 17\nالإجابة النموذجية: س = 6\nس2 [المستوى المتوقع]: حل: 5س − 3 = 2س + 9\nالإجابة النموذجية: 3س = 12 ومنها س = 4\nس3 [المستوى المتقدم]: حل 7 − 2س = 3س − 8 وتحقق.\nالإجابة النموذجية: 15 = 5س ومنها س = 3؛ التحقق 7 − 6 = 1 و9 − 8 = 1", "س1 [مستوى الدعم]: حل: س/4 = 3\nالإجابة النموذجية: س = 12\nس2 [المستوى المتوقع]: حل: 4س + 1 = س + 13\nالإجابة النموذجية: س = 4\nس3 [المستوى المتقدم]: حل: 6 − س = 2س − 9\nالإجابة النموذجية: س = 5", "عزيزي الطالب: راجع مثال 5-1 ص 78 وحل جزئيات السؤال 1 المتبقية مع التحقق. ولي الأمر الكريم: اطلب من ابنك التحقق من حله بالتعويض أمامك."], "html": ["<ol class='ol'><li>يحل معادلات خطية من خطوتين بالعمليات العكسية.</li><li>يحل معادلات فيها المجهول في الطرفين بتجميع الحدود المتشابهة.</li><li>يتحقق من الحل بالتعويض في المعادلة الأصلية. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: نموذج الميزان</span></div>", "حل المعادلة، العمليات العكسية، التحقق، المجهول في الطرفين", "يعرض المعلم ميزانًا متوازنًا: في الكفة الأولى 3 أكياس متماثلة و4 مكعبات، وفي الأخرى كيس و10 مكعبات. كم مكعبًا في الكيس؟ التعلم القبلي: كتابة المعادلات من الحصة السابقة والعمليات العكسية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الميزان ويطلب خطوة تحافظ على التوازن.</td><td>يقترح إزالة كيس من الكفتين.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال 5-1 ص 78: <span class=\"m\">3س + 4 = س + 10</span> ⟵ <span class=\"m\">2س + 4 = 10</span> ⟵ <span class=\"m\">2س = 6</  9</span></td><td class='ans'><span class=\"m\">س = 5</span></td></tr></tbody></table>", "عزيزي الطالب: راجع مثال 5-1 ص 78 وحل جزئيات السؤال 1 المتبقية مع التحقق. ولي الأمر الكريم: اطلب من ابنك التحقق من حله بالتعويض أمامك."]}, {"head": {"lesson": "5-1 كتابة المعادلات وحلها", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع الثامن: 25–29/10/2026م", "pages": "كتاب الطالب ص 78–79 • كتاب النشاط ص 46–48 • دليل المعلم ص 84–85", "num": "الحصة 3 من 4", "topic": "حل المعادلات المتضمنة أقواسًا"}, "plain": ["1) يفك الأقواس في المعادلة ثم يحلها.\n2) يقارن بين طريقتي فك القوس أولًا أو القسمة أولًا ويختار الأنسب.\n3) يكتب معادلة بأقواس من موقف ويحلها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "الأقواس، خاصية التوزيع، حل المعادلة", "يكتب المعلم 3(س + 2) = 21 ويسأل: هل يمكن حلها بطريقتين؟ التعلم القبلي: فك الأقواس (خاصية التوزيع) وحل المعادلات ذات الخطوتين.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويعرض الطريقتين المقترحتين.\nالطالب: يقترح القسمة على 3 أولًا أو فك القوس.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج حل 3(س + 2) = 21 بالطريقتين، ثم 2(س − 1) = 4(س − 3).\nالطالب: يقارن الطريقتين.\n3) تعلم تعاوني (10 دقائق):\nالمعلم: يوزع جزئيات السؤال 2 من تمارين 5-1 (أصعب مما سبق كما يشير الدليل) على المجموعات.\nالطالب: تحل كل مجموعة جزئية وتعرضها.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بمعادلات إضافية فردية من التمارين.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: حل: 3(س + 2) = 21\nالإجابة النموذجية: س = 5\nس2 [المستوى المتوقع]: حل: 2(س − 1) = 4(س − 3)\nالإجابة النموذجية: 2س − 2 = 4س − 12 ومنها س = 5\nس3 [المستوى المتقدم]: مجموع ثلاثة أعداد صحيحة متتالية 48. اكتب معادلة وحلها.\nالإجابة النموذجية: س + (س + 1) + (س + 2) = 48، س = 15؛ الأعداد 15، 16، 17", "س1 [مستوى الدعم]: حل: 5(س − 1) = 20\nالإجابة النموذجية: س = 5\nس2 [المستوى المتوقع]: حل: 4(2س + 1) = 3(س + 8)\nالإجابة النموذجية: 8س + 4 = 3س + 24 ومنها س = 4\nس3 [المستوى المتقدم]: حل: 6(س − 2) − 2(س + 1) = 6\nالإجابة النموذجية: 4س − 14 = 6 ومنها س = 5", "عزيزي الطالب: أكمل السؤال 2 من تمارين 5-1. ولي الأمر الكريم: اطلب من ابنك شرح خطوة فك القوس في معادلة حلها."], "html": ["<ol class='ol'><li>يفك الأقواس في المعادلة ثم يحلها.</li><li>يقارن بين طريقتي فك القوس أولًا أو القسمة أولًا ويختار الأنسب.</li><li>يكتب معادلة بأقواس من موقف ويحلها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "الأقواس، خاصية التوزيع، حل المعادلة", "يكتب المعلم <span class=\"m\">3(س + 2) = 21</span> ويسأل: هل يمكن حلها بطريقتين؟ التعلم القبلي: فك الأقواس (خاصية التوزيع) وحل المعادلات ذات الخطوتين.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويعرض الطريقتين المقترحتين.</td><td>يقترح القسمة على 3 أولًا أو فك القوس.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج حل <span class=\"m\">3(س + 2) = 21</span> بالطريقتين، ثم <span class=\"m\">2(س − 1) = 4(س − 3)</span>.</td><td>يقارن الطريقتين.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>تعلم تعاوني</td><td>يوزع جزئيات السؤال 2 من تمارين 5-1 (أصعب مما سبق كما يشير الدليل) على المجموعات.</td><td>تحل كل مجموعة جزئية وتعرضها.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بمعادلات إضافية فردية من التمارين.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حل: <span class=\"m\">3(س + 2) = 21</span></td><td class='ans'><span class=\"m\">س = 5</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>حل: <span class=\"m\">2(س − 1) = 4(س − 3)</span></td><td class='ans'><span class=\"m\">2س − 2 = 4س − 12</span> ومنها <span class=\"m\">س = 5</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>مجموع ثلاثة أعداد صحيحة متتالية 48. اكتب معادلة وحلها.</td><td class='ans'><span class=\"m\">س + (س + 1) + (س + 2) = 48</span>، <span class=\"m\">س = 15</span>؛ الأعداد 15، 16، 17</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حل: <span class=\"m\">5(س − 1) = 20</span></td><td class='ans'><span class=\"m\">س = 5</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>حل: <span class=\"m\">4(2س + 1) = 3(س + 8)</span></td><td class='ans'><span class=\"m\">8س + 4 = 3س + 24</span> ومنها <span class=\"m\">س = 4</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>حل: <span class=\"m\">6(س − 2) − 2(س + 1) = 6</span></td><td class='ans'><span class=\"m\">4س − 14 = 6</span> ومنها <span class=\"m\">س = 5</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤال 2 من تمارين 5-1. ولي الأمر الكريم: اطلب من ابنك شرح خطوة فك القوس في معادلة حلها."]}, {"head": {"lesson": "5-1 كتابة المعادلات وحلها", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع الثامن: 25–29/10/2026م", "pages": "كتاب الطالب ص 78–79 • كتاب النشاط ص 46–48 • دليل المعلم ص 84–85", "num": "الحصة 4 من 4", "topic": "تطبيقات على كتابة المعادلات وحلها"}, "plain": ["1) يكتب معادلات من معلومات مجزأة في مسألة ويحلها.\n2) يحل مسائل المحيط والزوايا باستخدام المعادلات.\n3) يفسر الحل في سياق المسألة ويتحقق من معقوليته. (مخرج تعليمي آخر)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم المبني على حل المشكلات، التعلم الذاتي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المعادلة، المحيط، الزوايا، تفسير الحل", "تحدٍ: زوايا مثلث س، 2س، 3س. أوجد أكبرها. التعلم القبلي: حل المعادلات ومجموع زوايا المثلث من الوحدة الثالثة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح التحدي ويربط الجبر بالهندسة.\nالطالب: يكتب 6س = 180 ويجد 90°.\n2) حل المشكلات (8 دقائق):\nالمعلم: يناقش السؤال 5 من تمارين 5-1 حيث يرى الطلاب الأسئلة أسهل عند قراءة جزء من المعلومات في كل مرة.\nالطالب: يجزئ المعلومات ويكتب المعادلة.\n3) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 46–48 بحسب المستويات.\nالطالب: يحل فرديًا ثم يقارن.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 5-1 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: حل: س + 15 = 40\nالإجابة النموذجية: س = 25\nس2 [المستوى المتوقع]: زوايا مثلث س، 2س، 3س. أوجد قياس أكبر زاوية.\nالإجابة النموذجية: 6س = 180، س = 30، أكبرها 90°\nس3 [المستوى المتقدم]: مستطيل طوله يزيد على عرضه 4 سم ومحيطه 36 سم. أوجد بعديه.\nالإجابة النموذجية: 2س + 2(س + 4) = 36، العرض 7 سم والطول 11 سم", "س1 [مستوى الدعم]: حل: 3س = 27\nالإجابة النموذجية: س = 9\nس2 [المستوى المتوقع]: زاويتان متكاملتان (على خط مستقيم) س + 40° و2س − 10°. أوجد س.\nالإجابة النموذجية: 3س + 30 = 180، س = 50°\nس3 [المستوى المتقدم]: ثمن 3 دفاتر وقلم 2.6 ريال، وثمن القلم 0.5 ريال. اكتب معادلة وأوجد ثمن الدفتر.\nالإجابة النموذجية: 3س + 0.5 = 2.6، س = 0.7 ريال", "عزيزي الطالب: أكمل كتاب النشاط ص 46–48، واقرأ ص 80 من كتاب الطالب. ولي الأمر الكريم: تابع ابنك عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حل: <span class=\"m\">س + 15 = 40</span></td><td class='ans'><span class=\"m\">س = 25</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>زوايا مثلث <span class=\"m\">س</span>، <span class=\"m\">2س</span>، <span class=\"m\">3س</span>. أوجد قياس أكبر زاوية.</td><td class='ans'><span class=\"m\">6س = 180</span>، <span class=\"m\">س = 30</span>، أكبرها <span class=\"m\">90°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>مستطيل طوله يزيد على عرضه 4 سم ومحيطه 36 سم. أوجد بعديه.</td><td class='ans'><span class=\"m\">2س + 2(س + 4) = 36</span>، العرض 7 سم والطول 11 سم</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حل: <span class=\"m\">3س = 27</span></td><td class='ans'><span class=\"m\">س = 9</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>زاويتان متكاملتان (على خط مستقيم) <span class=\"m\">س + 40°</span> و<span class=\"m\">2س − 10°</span>. أوجد س.</td><td class='ans'><span class=\"m\">3س + 30 = 180</span>، <span class=\"m\">س = 50°</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>ثمن 3 دفاتر وقلم <span class=\"m\">2.6</span> ريال، وثمن القلم <span class=\"m\">0.5</span> ريال. اكتب معادلة وأوجد ثمن الدفتر.</td><td class='ans'><span class=\"m\">3س + 0.5 = 2.6</span>، <span class=\"m\">س = 0.7</span> ريال</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 46–48، واقرأ ص 80 من كتاب الطالب. ولي الأمر الكريم: تابع ابنك في كتابة المعادلة قبل الحل في كل مسألة."]}]}, {"id": "5-2", "title": "تبسيط العبارات الجبرية", "periods": [{"head": {"lesson": "5-2 تبسيط العبارات الجبرية", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع الثامن: 25–29/10/2026م", "pages": "كتاب الطالب ص 80–81 • كتاب النشاط ص 49–50 • دليل المعلم ص 86–87", "num": "الحصة 1 من 3", "topic": "تبسيط العبارات الجبرية بجمع الحدود المتشابهة"}, "plain": ["1) يميز الحدود المتشابهة في عبارة جبرية.\n2) يبسّط العبارات الجبرية بجمع الحدود المتشابهة وطرحها.\n3) يكتشف أخطاء التبسيط ويصححها. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم المبني على اللعب، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات حدود جبرية للتصنيف", "الحد الجبري، الحدود المتشابهة، المعامل، التبسيط", "لعبة «اجمع المتشابه»: بطاقات (3س، 5ص، −س، 2س²، 4…) يصنفها الطلاب في مجموعات. التعلم القبلي: المصطلحات الجبرية (الحد، المعامل، الثابت) من الصف السابع.", "1) التهيئة (6 دقائق):\nالمعلم: يدير نشاط التصنيف ويسأل عن س وس².\nالطالب: يصنف ويبرر لماذا س وس² غير متشابهين.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج تبسيط 5س + 3ص − 2س + ص = 3س + 4ص ويؤكد إشارة الحد قبله.\nالطالب: يطبق على أمثلة.\n3) النشاط 1 (8 دقائق):\nالمعلم: ينفذ النشاط 1 في الدليل (بطاقات عبارات تبسط إلى النتيجة نفسها) وينبه إلى قراءة التعليمات بعناية.\nالطالب: يجمع البطاقات المتكافئة في مجموعات.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالسؤال 1 من تمارين 5-2 ص 81.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: بسّط: 4س + 3س\nالإجابة النموذجية: 7س\nس2 [المستوى المتوقع]: بسّط: 5س + 3ص − 2س + ص\nالإجابة النموذجية: 3س + 4ص\nس3 [المستوى المتقدم]: بسّط: 2س² + 3س − س² + 5س − 4\nالإجابة النموذجية: س² + 8س − 4", "س1 [مستوى الدعم]: بسّط: 9ص − 4ص\nالإجابة النموذجية: 5ص\nس2 [المستوى المتوقع]: بسّط: 6أ − 2ب − 4أ + 7ب\nالإجابة النموذجية: 2أ + 5ب\nس3 [المستوى المتقدم]: كتب طالب 3س + 2ص = 5سص. صحّح الخطأ.\nالإجابة النموذجية: لا يمكن التبسيط؛ الحدان غير متشابهين فتبقى 3س + 2ص", "عزيزي الطالب: راجع ص 80 وأكمل السؤال 1 من تمارين 5-2. ولي الأمر الكريم: اطلب من ابنك أن يشرح الفرق بين 3س وس³."], "h رح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>بسّط: <span class=\"m\">4س + 3س</span></td><td class='ans'><span class=\"m\">7س</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بسّط: <span class=\"m\">5س + 3ص − 2س + ص</span></td><td class='ans'><span class=\"m\">3س + 4ص</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>بسّط: <span class=\"m\">2س<sup>2</sup> + 3س − س<sup>2</sup> + 5س − 4</span></td><td class='ans'><span class=\"m\">س<sup>2</sup> + 8س − 4</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>بسّط: <span class=\"m\">9ص − 4ص</span></td><td class='ans'><span class=\"m\">5ص</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بسّط: <span class=\"m\">6أ − 2ب − 4أ + 7ب</span></td><td class='ans'><span class=\"m\">2أ + 5ب</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كتب طالب <span class=\"m\">3س + 2ص = 5سص</span>. صحّح الخطأ.</td><td class='ans'>لا يمكن التبسيط؛ الحدان غير متشابهين فتبقى <span class=\"m\">3س + 2ص</span></td></tr></tbody></table>", "عزيزي الطالب: راجع ص 80 وأكمل السؤال 1 من تمارين 5-2. ولي الأمر الكريم: اطلب من ابنك أن يشرح الفرق بين <span class=\"m\">3س</span> و<span class=\"m\">س<sup>3</sup></span>."]}, {"head": {"lesson": "5-2 تبسيط العبارات الجبرية", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع الثامن: 25–29/10/2026م", "pages": "كتاب الطالب ص 80–81 • كتاب النشاط ص 49–50 • دليل المعلم ص 86–87", "num": "الحصة 2 من 3", "topic": "ضرب الحدود الجبرية وقسمتها"}, "plain": ["1) يضرب حدودًا جبرية ويقسمها مستخدمًا قوانين الأسس.\n2) يبسّط عبارات تتضمن ضرب حدود ذات معاملات وأسس.\n3) يميز بين تبسيط الجمع وتبسيط الضرب. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "ضرب الحدود الجبرية، قوانين الأسس، المعامل", "سؤال: ما الفرق بين س + س وس × س؟ التعلم القبلي: قوانين الأسس من الدرس 1-4 وجمع الحدود المتشابهة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويكتب 2س وس².\nالطالب: يميز بين الجمع والضرب.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج: 3س × 4س = 12س²، 2أ³ × 5أ² = 10أ⁵، 12س⁵ ÷ 4س² = 3س³.\nالطالب: يضرب المعاملات ثم يجمع الأسس.\n3) النشاط 2 (8 دقائق):\nالمعلم: ينفذ النشاط 2 من الدليل (تصنيف بطاقات بحسب الناتج).\nالطالب: يصنف البطاقات في مجموعات.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالأسئلة 2–4 من تمارين 5-2.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: بسّط: 3س × 4\nالإجابة النموذجية: 12س\nس2 [المستوى المتوقع]: بسّط: 2أ³ × 5أ²\nالإجابة النموذجية: 10أ⁵\nس3 [المستوى المتقدم]: بسّط: (6س⁴ × 2س) ÷ 4س³\nالإجابة النموذجية: 12س⁵ ÷ 4س³ = 3س²", "س1 [مستوى الدعم]: بسّط: س × س × س\nالإجابة النموذجية: س³\nس2 [المستوى المتوقع]: بسّط: 15ص⁶ ÷ 3ص²\nالإجابة النموذجية: 5ص⁴\nس3 [المستوى المتقدم]: بسّط: 3س × 2ص × 4س\nالإجابة النموذجية: 24س²ص", "عزيزي الطالب: أكمل الأسئلة 2–4 من تمارين 5-2. ولي الأمر الكريم: راجع مع ابنك قوانين الأسس التي يطبقها هنا."], "html": ["<ol class='ol'><li>يضرب حدودًا جبرية ويقسمها مستخدمًا قوانين الأسس.</li><li>يبسّط عبارات تتضمن ضرب حدود ذات معاملات وأسس.</li><li>يميز بين تبسيط الجمع وتبسيط الضرب. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>ال ns'><span class=\"m\">12س<sup>5</sup> ÷ 4س<sup>3</sup> = 3س<sup>2</sup></span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>بسّط: <span class=\"m\">س × س × س</span></td><td class='ans'><span class=\"m\">س<sup>3</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بسّط: <span class=\"m\">15ص<sup>6</sup> ÷ 3ص<sup>2</sup></span></td><td class='ans'><span class=\"m\">5ص<sup>4</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>بسّط: <span class=\"m\">3س × 2ص × 4س</span></td><td class='ans'><span class=\"m\">24س<sup>2</sup>ص</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل الأسئلة 2–4 من تمارين 5-2. ولي الأمر الكريم: راجع مع ابنك قوانين الأسس التي يطبقها هنا."]}, {"head": {"lesson": "5-2 تبسيط العبارات الجبرية", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع الثامن: 25–29/10/2026م", "pages": "كتاب الطالب ص 80–81 • كتاب النشاط ص 49–50 • دليل المعلم ص 86–87", "num": "الحصة 3 من 3", "topic": "تطبيقات على تبسيط العبارات الجبرية"}, "plain": ["1) يبسّط عبارات جبرية مركبة تجمع الجمع والضرب.\n2) يكتب عبارة مبسطة لمحيط أو مساحة شكل.\n3) يبتكر عبارات مختلفة تبسط إلى عبارة معطاة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: إبداع", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التبسيط، الحدود المتشابهة، المحيط، المساحة", "تحدٍ: اكتب ثلاث عبارات مختلفة تبسط إلى 6س + 2. التعلم القبلي: جمع الحدود المتشابهة وضربها.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح التحدي ويعرض أفضل الإجابات.\nالطالب: يكتب عبارات مختلفة.\n2) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 49–50.\nالطالب: يحل فرديًا.\n3) المحيط والمساحة (8 دقائق):\nالمعلم: يعرض مستطيلًا بعداه 3س و2س ويطلب عبارتي المحيط والمساحة.\nالطالب: يكتب 10س و6س².\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 5-2 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: بسّط: 7س − 3 + 2س + 8\nالإجابة النموذجية: 9س + 5\nس2 [المستوى المتوقع]: مستطيل بعداه 3س و2س. اكتب عبارتي محيطه ومساحته.\nالإجابة النموذجية: المحيط 10س والمساحة 6س²\nس3 [المستوى المتقدم]: اكتب ثلاث عبارات مختلفة تبسط إلى 6س + 2.\nالإجابة النموذجية: مثل 4س + 2س + 2، 7س − س + 5 − 3، 3س + 3س + 1 + 1", "س1 [مستوى الدعم]: بسّط: 4ص + 5 − ص\nالإجابة النموذجية: 3ص + 5\nس2 [المستوى المتوقع]: بسّط: 2س × 3ص + 4سص\nالإجابة النموذجية: 10سص\nس3 [المستوى المتقدم]: مربع طول ضلعه 4س. اكتب عبارة لمساحته وأخرى لمحيطه.\nالإجابة النموذجية: المساحة 16س² والمحيط 16س", "عزيزي الطالب: أكمل كتاب النشاط ص 49–50، واقرأ ص 82 من كتاب الطالب. ولي الأمر الكريم: تابع حل ابنك لصفحات النشاط."], "html": ["<ol class='ol'><li>يبسّط عبارات جبرية مركبة تجمع الجمع والضرب.</li><li>يكتب عبارة مبسطة لمحيط أو مساحة شكل.</li><li>يبتكر عبارات مختلفة تبسط إلى عبارة معطاة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "التبسيط، الحدود المتشابهة، المحيط، المساحة", "تحدٍ: اكتب ثلاث عبارات مختلفة تبسط إلى <span class=\"m\">6س + 2</span>. التعلم القبلي: جمع الحدود المتشابهة وضربها.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح التحدي ويعرض أفضل الإجابات.</td><td>يكتب عبارات ًا.", "س1 [مستوى الدعم]: اكتب عبارة: «عدد مضافًا إليه 7».\nالإجابة النموذجية: س + 7\nس2 [المستوى المتوقع]: اكتب عبارة: «ثلاثة أمثال الفرق بين ن و2».\nالإجابة النموذجية: 3(ن − 2)\nس3 [المستوى المتقدم]: اكتب وصفًا لفظيًا لكل من 2(س + 3) و2س + 3.\nالإجابة النموذجية: ضعف مجموع العدد و3؛ وضعف العدد مضافًا إليه 3", "س1 [مستوى الدعم]: اكتب عبارة: «أقل من س بـ5».\nالإجابة النموذجية: س − 5\nس2 [المستوى المتوقع]: اكتب عبارة: «مربع العدد ع مطروحًا منه 4».\nالإجابة النموذجية: ع² − 4\nس3 [المستوى المتقدم]: عمر سالم س سنة، وعمر أبيه يزيد على ثلاثة أمثال عمره بـ4 سنوات. اكتب عبارة لمجموع عمريهما في أبسط صورة.\nالإجابة النموذجية: س + (3س + 4) = 4س + 4", "عزيزي الطالب: اكتب خمسة أوصاف لفظية وعباراتها الجبرية في دفترك. ولي الأمر الكريم: اطلب من ابنك ترجمة موقف مثل «ثمن 3 كتب بسعر س ريال» إلى عبارة."], "html": ["<ol class='ol'><li>يترجم وصفًا لفظيًا إلى عبارة جبرية.</li><li>يترجم عبارة جبرية إلى وصف لفظي.</li><li>يميز بين عبارات متشابهة الصياغة مختلفة المعنى مثل <span class=\"m\">2(س + 3)</span> و<span class=\"m\">2س + 3</span>. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: بطاقات مطابقة (وصف ⟷ عبارة)</span></div>", "العبارة الجبرية، المتغير، الترجمة الجبرية", "لعبة المطابقة: بطاقات أوصاف («ضعف العدد مضافًا إليه 3»، «ضعف مجموع العدد و3») وبطاقات عبارات. التعلم القبلي: المصطلحات الجبرية وتبسيط العبارات.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>6<small>د</small></td><td class='ph'>التهيئة</td><td>يدير المطابقة ويناقش الزوجين الملتبسين.</td><td>يطابق ويبرر الفرق.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td ب النشاط ص 51–53، واقرأ ص 85. ولي الأمر الكريم: تابع ابنك في صفحات النشاط."], "html": ["<ol class='ol'><li>يكتب عبارات جبرية لمواقف متعددة الخطوات.</li><li>يحكم على تكافؤ عبارتين بالتبسيط أو التعويض.</li><li>يربط بين كتابة العبارات وحل المعادلات. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تقييم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم الذاتي</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "العبارة الجبرية، التكافؤ، المعادلة", "سؤال: هل <span class=\"m\">3(س + 2)</span> و<span class=\"m\">3س + 2</span> متكافئتان؟ جرّب <span class=\"m\">س = 1</span>. التعلم القبلي: كتابة العبارات وتبسيطها.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويعوّض مع الطلاب.</td><td>يكتشف عدم التكافؤ (9 مقابل 5).</td></tr><tr><td class='tm'>15<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 51–53.</td><td>يحل فرديًا ثم يتحقق مع زميله.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>الربط</td><td>يطرح موقفًا يُكتب عبارة ثم معادلة ويحل.</td><td>يكتب ويحل.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 5-3 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب عبارة لثمن ن كتابًا سعر الواحد 3 ريالات.</td><td class='ans'><span class=\"m\">3ن</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>هل <span class=\"m\">2(س − 4)</span> و<span class=\"m\">2س − 8</span> متكافئتان؟ برّر.</td><td class='ans'>نعم؛ بفك القوس <span class=\"m\">2(س − 4) = 2س − 8</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>مع خالد س ريالًا، ومع أخيه ضعف ما معه ناقصًا 5. ومجموع ما معهما 40 ريالًا. اكتب معادلة وحلها.</td><td class='ans'><span class=\"m\">س + 2س − 5 = 40</span>، <span class=\"m\">س = 15</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب عبارة: «العدد ن مقسومًا على 4».</td><td class='ans'><span class=\"m\">ن/4</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>هل <span class=\"m\">س<sup>2</sup> + س<sup>2</sup></span> تكافئ <span class=\"m\">س<sup>4</sup></span>؟</td><td class='ans'>لا؛ تكافئ <span class=\"m\">2س<sup>2</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب عبارة لمجموع ثلاثة أعداد زوجية متتالية أصغرها <span class=\"m\">2ن</span>.</td><td class='ans'><span class=\"m\">2ن + (2ن + 2) + (2ن + 4) = 6ن + 6</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 51–53، واقرأ ص 85. ولي الأمر الكريم: تابع ابنك في صفحات النشاط."]}]}, {"id": "5-4", "title": "التعويض في العبارات الجبرية", "periods": [{"head": {"lesson": "5-4 التعويض في العبارات الجبرية", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع التاسع: 1–5/11/2026م", "pages": "كتاب الطالب ص 85–86 • كتاب النشاط ص 54–55 • دليل المعلم ص 90–91", "num": "الحصة 1 من 2", "topic": "التعويض في العبارات الجبرية بأعداد موجبة وسالبة"}, "plain": ["1) يعوّض أعدادًا موجبة وسالبة في عبارات جبرية ويحسب قيمها.\n2) يستخدم الأقواس عند التعويض بالأعداد السالبة لتجنب أخطاء الإشارة.\n3) يحدد قيمة المتغير التي تجعل عبارتين متساويتين بالتجريب. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام", "التعويض، القيمة العددية، الأعداد الموجهة", "لعبة «آلة التعويض»: يكتب المعلم 3س − 2 ويقرأ قيمًا للمتغير، ويحسب الطلاب الناتج سريعًا. التعلم القبلي: العمليات على الأعداد الموجهة وترتيب العمليات.", "1) التهيئة (5 دقائق):\nالمعلم: يدير اللعبة بقيم موجبة ثم سالبة.\nالطالب: يحسب ويعلن الناتج.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج مثالًا في ص 85: س = −3 في س² − 2س ⟵ (−3)² − 2(−3) = 9 + 6 = 15، ويحذر من الخطأ −3² = −9.\nالطالب: يعوّض في أمثلة بالأقواس.\n3) الممارسة الموجهة (10 دقائق):\nالمعلم: يكلف بالسؤالين 1 و2 من تمارين 5-4 ويشجع على عرض العمل كالأمثلة؛ فالمحاولات المنظمة تحد من الأخطاء كما يشير الدليل.\nالطالب: يحل في أزواج ويعرض الخطوات.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بجزئيات فردية إضافية.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: إذا كان س = 4 فأوجد 3س − 2.\nالإجابة النموذجية: 10\nس2 [المستوى المتوقع]: إذا كان س = −3 فأوجد س² − 2س.\nالإجابة النموذجية: 9 + 6 = 15\nس3 [المستوى المتقدم]: إذا كان أ = −2 وب = 5 فأوجد (أ − ب)² ÷ (أ + ب) مقربًا لمنزلتين.\nالإجابة النموذجية: 49 ÷ 3 ≈ 16.33", "س1 [مستوى الدعم]: إذا كان ص = 6 فأوجد ص/2 + 7.\nالإجابة النموذجية: 10\nس2 [المستوى المتوقع]: إذا كان ن = −5 فأوجد 2ن².\nالإجابة النموذجية: 50\nس3 [المستوى المتقدم]: أوجد قيمة س الصحيحة التي تجعل 2س + 3 و5س − 9 متساويتين.\nالإجابة النموذجية: س = 4 (كلتاهما 11)", "عزيزي الطالب: راجع ص 85 وأكمل السؤالين 1 و2 من تمارين 5-4. ولي الأمر الكريم: اطلب من ابنك أن يشرح لماذا (−3)² = 9."], "html": ["<ol class='ol'><li>يعوّض أعدادًا موجبة وسالبة في عبارات جبرية ويحسب قيمها.</li><li>يستخدم الأقواس عند التعويض بالأعداد السالبة لتجنب أخطاء الإشارة.</li><li>يحدد قيمة المتغير التي تجعل عبارتين متساويتين بالتجريب. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "التعويض، القيمة العددية، الأعداد الموجهة", "لعبة «آلة التعويض»: يكتب المعلم <span class=\"m\">3س − 2</span> ويقرأ قيمًا للمتغير، ويحسب الطلاب الناتج سريعًا. التعلم القبلي: العمليات على الأعداد الموجهة وترتيب العمليات.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يدير اللعبة بقيم موجبة ثم سالبة.</td><td>يحسب ويعلن الناتج.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثالًا في ص 85: <span class=\"m\">س = −3</span> في <span class=\"m\">س<sup>2</sup> − 2س</span> ⟵ <span class=\"m\">(−3)<sup>2</sup> − 2(−3) = 9 + 6 = 15</span>، ويحذر من الخطأ <span class=\"m\">−3<sup>2</sup> = −9</span>.</td><td>يعوّض في أمثلة بالأقواس.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة الموجهة</td><td>يكلف بالسؤالين 1 و2 من تمارين 5-4 ويشجع على عرض العمل كالأمثلة؛ فالمحاولات المنظمة تحد من الأخطاء كما يشير الدليل.</td><td>يحل في أزواج ويعرض الخطوات.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بجزئيات فردية إضافية.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>إذا كان <span class=\"m\">س = 4</span> فأوجد <span class=\"m\">3س − 2</span>.</td><td class='ans'>10</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>إذا كان <span class=\"m\">س = −3</span> فأوجد <span class=\"m\">س<sup>2</sup> − 2س</span>.</td><td class='ans'><span class=\"m\">9 + 6 = 15</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>إذا كان <span class=\"m\">أ = −2</span> و<span class=\"m\">ب = 5</span> فأوجد <span class=\"m\">(أ − ب)<sup>2</sup> ÷ (أ + ب)</span> مقربًا لمنزلتين.</td><td class='ans'><span class=\"m\">49 ÷ 3 ≈ 16.33</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>إذا كان <span class=\"m\">ص = 6</span> فأوجد <span class=\"m\">ص/2 + 7</span>.</td><td class='ans'>10</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>إذا كان <span class=\"m\">ن = −5</span> فأوجد <span class=\"m\">2ن<sup>2</sup></span>.</td><td class='ans'>50</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أوجد قيمة س الصحيحة التي تجعل <span class=\"m\">2س + 3</span> و<span class=\"m\">5س − 9</span> متساويتين.</td><td class='ans'><span class=\"m\">س = 4</span> (كلتاهما 11)</td></tr></tbody></table>", "عزيزي الطالب: راجع ص 85 وأكمل السؤالين 1 و2 من تمارين 5-4. ولي الأمر الكريم: اطلب من ابنك أن يشرح لماذا <span class=\"m\">(−3)<sup>2</sup> = 9</span>."]}, {"head": {"lesson": "5-4 التعويض في العبارات الجبرية", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع التاسع: 1–5/11/2026م", "pages": "كتاب الطالب ص 85–86 • كتاب النشاط ص 54–55 • دليل المعلم ص 90–91", "num": "الحصة 2 من 2", "topic": "التعويض في عبارات تتضمن أسسًا وكسورًا وتطبيقات"}, "plain": ["1) يعوّض في عبارات تتضمن أسسًا وكسورًا جبرية.\n2) يقارن بين قيم عبارات مختلفة لقيم معطاة.\n3) يكتشف أخطاء التعويض ويصححها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم التشاركي، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التعويض، الأسس، الكسر الجبري", "يعرض المعلم حلًا خاطئًا: عند س = −2، 3س² = 36. أين الخطأ؟ التعلم القبلي: التعويض بالأعداد الموجبة والسالبة من الحصة السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الخطأ ويناقشه.\nالطالب: يكتشف أن الأس يطبق على س فقط: 3 × 4 = 12.\n2) النمذجة (8 دقائق):\nالمعلم: ينمذج التعويض في (س + 4)/(س − 1) و2أب².\nالطالب: يطبق على أمثلة.\n3) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 54–55.\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 5-4 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: إذا كان س = 3 فأوجد س³.\nالإجابة النموذجية: 27\nس2 [المستوى المتوقع]: إذا كان س = −2 فأوجد 3س².\nالإجابة النموذجية: 12\nس3 [المستوى المتقدم]: إذا كان أ = 2 وب = −3 فأوجد 2أب² و(2أب)² وقارن.\nالإجابة النموذجية: 2 × 2 × 9 = 36 و(−12)² = 144؛ مختلفتان", "س1 [مستوى الدعم]: إذا كان س = 5 فأوجد (س + 4)/(س − 2).\nالإجابة النموذجية: 3\nس2 [المستوى المتوقع]: إذا كان ن = −1 فأوجد ن³ + ن².\nالإجابة النموذجية: 0\nس3 [المستوى المتقدم]: إذا كان س = 1/2 فأوجد 4س² − 2س.\nالإجابة النموذجية: 1 − 1 = 0", "عزيزي الطالب: أكمل كتاب النشاط ص 54–55، واقرأ ص 87. ولي الأمر الكريم: تابع ابنك في استخدام الأقواس عند التعويض."], "html": ["<ol class='ol'><li>يعوّض في عبارات تتضمن أسسًا وكسورًا جبرية.</li><li>يقارن بين قيم عبارات مختلفة لقيم معطاة.</li><li>يكتشف أخطاء التعويض ويصححها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم التشاركي</span><span>التعلم الذاتي</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "التعويض، الأسس، الكسر الجبري", "يعرض المعلم حلًا خاطئًا: عند <span class=\"m\">س = −2</span>، <span class=\"m\">3س<sup>2</sup> = 36</span>. أين الخطأ؟ التعلم القبلي: التعويض بالأعداد الموجبة والسالبة من الحصة السابقة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الخطأ ويناقشه.</td><td>يكتشف أن الأس يطبق على س فقط: <span class=\"m\">3 × 4 = 12</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج التعويض في <span class=\"m\">(س + 4)/(س − 1)</span> و<span class=\"m\">2أب<sup>2</sup></span>.</td><td>يطبق على أمثلة.</td></tr><tr><td class='tm'>14<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 54–55.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 5-4 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>إذا كان <span class=\"m\">س = 3</span> فأوجد <span class=\"m\">س<sup>3</sup></span>.</td><td class='ans'>27</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>إذا كان <span class=\"m\">س = −2</span> فأوجد <span class=\"m\">3س<sup>2</sup></span>.</td><td class='ans'>12</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>إذا كان <span class=\"m\">أ = 2</span> و<span class=\"m\">ب = −3</span> فأوجد <span class=\"m\">2أب<sup>2</sup></span> و<span class=\"m\">(2أب)<sup>2</sup></span> وقارن.</td><td class='ans'><span class=\"m\">2 × 2 × 9 = 36</span> و<span class=\"m\">(−12)<sup>2</sup> = 144</span>؛ مختلفتان</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>إذا كان <span class=\"m\">س = 5</span> فأوجد <span class=\"m\">(س + 4)/(س − 2)</span>.</td><td class='ans'>3</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>إذا كان <span class=\"m\">ن = −1</span> فأوجد <span class=\"m\">ن<sup>3</sup> + ن<sup>2</sup></span>.</td><td class='ans'>0</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>إذا كان <span class=\"m\">س = 1/2</span> فأوجد <span class=\"m\">4س<sup>2</sup> − 2س</span>.</td><td class='ans'><span class=\"m\">1 − 1 = 0</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 54–55، واقرأ ص 87. ولي الأمر الكريم: تابع ابنك في استخدام الأقواس عند التعويض."]}]}, {"id": "5-5", "title": "الصيغ واستخدامها", "periods": [{"head": {"lesson": "5-5 الصيغ واستخدامها", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع التاسع: 1–5/11/2026م", "pages": "كتاب الطالب ص 87–89 • كتاب النشاط ص 56–57 • دليل المعلم ص 92–93", "num": "الحصة 1 من 2", "topic": "استخدام الصيغ بالتعويض"}, "plain": ["1) يعوّض في صيغ رياضية وعلمية لإيجاد قيمة مطلوبة.\n2) يحل معادلة ناتجة عن التعويض في صيغة لإيجاد مجهول ليس موضوعها.\n3) يفسر معنى المتغيرات في الصيغة ووحداتها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: فهم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام", "الصيغة، موضوع الصيغة، التعويض، المتغير", "يعرض المعلم صيغة تحويل درجة الحرارة أو صيغة السرعة ع = م ÷ ز ويسأل: كيف نجد السرعة إذا قطعت سيارة 240 كم في 3 ساعات؟ التعلم القبلي: التعويض في العبارات من الدرس السابق.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح المثال ويوضح معنى المتغيرات.\nالطالب: يعوّض ويحسب 80 كم/س.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج مثال ص 87 بالتعويض، ثم حالة تُعطى فيها قيمة الموضوع ويُطلب متغير آخر: ح = ط × ع × ر مع إيجاد ر.\nالطالب: يكتب المعادلة الناتجة ويحلها.\n3) الممارسة الموجهة (10 دقائق):\nالمعلم: يكلف بالسؤالين 1 و2 من تمارين 5-5، ويساعد في الجزئيات التي يشير إليها الدليل بالتعامل مع الجمع والطرح أولًا.\nالطالب: يحل في أزواج.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بجزئيات فردية إضافية.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: الصيغة م = 4ل لمحيط المربع. أوجد م إذا كان ل = 7.\nالإجابة النموذجية: 28\nس2 [المستوى المتوقع]: في الصيغة ع = م ÷ ز أوجد ع إذا كانت م = 240 كم وز = 3 ساعات.\nالإجابة النموذجية: 80 كم/ساعة\nس3 [المستوى المتقدم]: في الصيغة ص = 3س + 5 أوجد س إذا كانت ص = 23.\nالإجابة النموذجية: 3س = 18 ومنها س = 6", "س1 [مستوى الدعم]: في الصيغة م = ط × ع أوجد م إذا كان ط = 8 وع = 5.\nالإجابة النموذجية: 40\nس2 [المستوى المتوقع]: في الصيغة ح = ط × ع × ر أوجد ر إذا كان ح = 120، ط = 5، ع = 4.\nالإجابة النموذجية: ر = 6\nس3 [المستوى المتقدم]: صيغة: ف = 2(ل + ع). أوجد ل إذا كان ف = 30 وع = 6.\nالإجابة النموذجية: ل = 9", "عزيزي الطالب: أكمل السؤالين 1 و2 من تمارين 5-5. ولي الأمر الكريم: ناقش مع ابنك صيغة حساب تكلفة رحلة (المسافة × سعر الكيلومتر)."], "html": ["<ol class='ol'><li>يعوّض في صيغ رياضية وعلمية لإيجاد قيمة مطلوبة.</li><li>يحل معادلة ناتجة عن التعويض في صيغة لإيجاد مجهول ليس موضوعها.</li><li>يفسر معنى المتغيرات في الصيغة ووحداتها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> فهم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "الصيغة، موضوع الصيغة، التعويض، المتغير", "يعرض المعلم صيغة تحويل درجة الحرارة أو صيغة السرعة <span class=\"m\">ع = م ÷ ز</span> ويسأل: كيف نجد السرعة إذا قطعت سيارة 240 كم في 3 ساعات؟ التعلم القبلي: التعويض في العبارات من الدرس السابق.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح المثال ويوضح معنى المتغيرات.</td><td>يعوّض ويحسب 80 كم/س.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال ص 87 بالتعويض، ثم حالة تُعطى فيها قيمة الموضوع ويُطلب متغير آخر: <span class=\"m\">ح = ط × ع × ر</span> مع إيجاد ر.</td><td>يكتب المعادلة الناتجة ويحلها.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة الموجهة</td><td>يكلف بالسؤالين 1 و2 من تمارين 5-5، ويساعد في الجزئيات التي يشير إليها الدليل بالتعامل مع الجمع والطرح أولًا.</td><td>يحل في أزواج.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بجزئيات فردية إضافية.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>الصيغة <span class=\"m\">م = 4ل</span> لمحيط المربع. أوجد م إذا كان <span class=\"m\">ل = 7</span>.</td><td class='ans'>28</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>في الصيغة <span class=\"m\">ع = م ÷ ز</span> أوجد ع إذا كانت <span class=\"m\">م = 240</span> كم و<span class=\"m\">ز = 3</span> ساعات.</td><td class='ans'>80 كم/ساعة</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>في الصيغة <span class=\"m\">ص = 3س + 5</span> أوجد س إذا كانت <span class=\"m\">ص = 23</span>.</td><td class='ans'><span class=\"m\">3س = 18</span> ومنها <span class=\"m\">س = 6</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>في الصيغة <span class=\"m\">م = ط × ع</span> أوجد م إذا كان <span class=\"m\">ط = 8</span> و<span class=\"m\">ع = 5</span>.</td><td class='ans'>40</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>في الصيغة <span class=\"m\">ح = ط × ع × ر</span> أوجد ر إذا كان <span class=\"m\">ح = 120</span>، <span class=\"m\">ط = 5</span>، <span class=\"m\">ع = 4</span>.</td><td class='ans'><span class=\"m\">ر = 6</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>صيغة: <span class=\"m\">ف = 2(ل + ع)</span>. أوجد ل إذا كان <span class=\"m\">ف = 30</span> و<span class=\"m\">ع = 6</span>.</td><td class='ans'><span class=\"m\">ل = 9</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤالين 1 و2 من تمارين 5-5. ولي الأمر الكريم: ناقش مع ابنك صيغة حساب تكلفة رحلة (المسافة × سعر الكيلومتر)."]}, {"head": {"lesson": "5-5 الصيغ واستخدامها", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع التاسع: 1–5/11/2026م", "pages": "كتاب الطالب ص 87–89 • كتاب النشاط ص 56–57 • دليل المعلم ص 92–93", "num": "الحصة 2 من 2", "topic": "اشتقاق الصيغ وإعادة ترتيبها"}, "plain": ["1) يشتق صيغة من موقف لفظي أو نمط.\n2) يغيّر موضوع صيغة بسيطة بالعمليات العكسية.\n3) يقارن بين التعويض قبل إعادة الترتيب وبعده. (مخرج تعليمي آخر)", "المخرج 1: إبداع\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "اشتقاق الصيغة، موضوع الصيغة، إعادة الترتيب", "موقف: شركة سيارات أجرة تأخذ 2 ريال ثابتة و0.3 ريال لكل كيلومتر. اكتب صيغة التكلفة. التعلم القبلي: كتابة العبارات الجبرية واستخدام الصيغ.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح الموقف ويساعد في اختيار الرموز.\nالطالب: يكتب ت = 2 + 0.3ك.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج تغيير موضوع الصيغة: ت = 2 + 0.3ك ⟵ ك = (ت − 2) ÷ 0.3.\nالطالب: يعيد ترتيب صيغ مشابهة.\n3) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 56–57 والسؤال الأخير من تمارين 5-5.\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 5-5 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: اكتب صيغة لمحيط مثلث متطابق الأضلاع طول ضلعه ل.\nالإجابة النموذجية: م = 3ل\nس2 [المستوى المتوقع]: شركة أجرة: 2 ريال ثابتة و0.3 ريال لكل كيلومتر. اكتب صيغة التكلفة ت لمسافة ك كيلومتر، ثم احسب تكلفة 20 كم.\nالإجابة النموذجية: ت = 2 + 0.3ك؛ 8 ريالات\nس3 [المستوى المتقدم]: اجعل ك موضوع الصيغة ت = 2 + 0.3ك ثم أوجد ك عندما ت = 11.\nالإجابة النموذجية: ك = (ت − 2) ÷ 0.3؛ ك = 30 كم", "س1 [مستوى الدعم]: اجعل س موضوع الصيغة ص = س + 7.\nالإجابة النموذجية: س = ص − 7\nس2 [المستوى المتوقع]: اجعل ل موضوع الصيغة م = 4ل.\nالإجابة النموذجية: ل = م ÷ 4\nس3 [المستوى المتقدم]: اجعل ع موضوع الصيغة م = 2(ل + ع).\nالإجابة النموذجية: ع = م/2 − ل", "عزيزي الطالب: أكمل كتاب النشاط ص 56–57، واقرأ ص 90. ولي الأمر الكريم: اطلب من ابنك كتابة صيغة لتكلفة شراء عدد من السلع بسعر ثابت."], "html": ["<ol class='ol'><li>يشتق صيغة من موقف لفظي أو نمط.</li><li>يغيّر موضوع صيغة بسيطة بالعمليات العكسية.</li><li>يقارن بين التعويض قبل إعادة الترتيب وبعده. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> إبداع</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "اشتقاق الصيغة، موضوع الصيغة، إعادة الترتيب", "موقف: شركة سيارات أجرة تأخذ 2 ريال ثابتة و<span class=\"m\">0.3</span> ريال لكل كيلومتر. اكتب صيغة التكلفة. التعلم القبلي: كتابة العبارات الجبرية واستخدام الصيغ.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح الموقف ويساعد في اختيار الرموز.</td><td>يكتب <span class=\"m\">ت = 2 + 0.3ك</span>.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج تغيير موضوع الصيغة: <span class=\"m\">ت = 2 + 0.3ك</span> ⟵ <span class=\"m\">ك = (ت − 2) ÷ 0.3</span>.</td><td>يعيد ترتيب صيغ مشابهة.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 56–57 والسؤال الأخير من تمارين 5-5.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 5-5 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اكتب صيغة لمحيط مثلث متطابق الأضلاع طول ضلعه ل.</td><td class='ans'><span class=\"m\">م = 3ل</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>شركة أجرة: 2 ريال ثابتة و<span class=\"m\">0.3</span> ريال لكل كيلومتر. اكتب صيغة التكلفة ت لمسافة ك كيلومتر، ثم احسب تكلفة 20 كم.</td><td class='ans'><span class=\"m\">ت = 2 + 0.3ك</span>؛ 8 ريالات</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اجعل ك موضوع الصيغة <span class=\"m\">ت = 2 + 0.3ك</span> ثم أوجد ك عندما <span class=\"m\">ت = 11</span>.</td><td class='ans'><span class=\"m\">ك = (ت − 2) ÷ 0.3</span>؛ <span class=\"m\">ك = 30</span> كم</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>اجعل س موضوع الصيغة <span class=\"m\">ص = س + 7</span>.</td><td class='ans'><span class=\"m\">س = ص − 7</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>اجعل ل موضوع الصيغة <span class=\"m\">م = 4ل</span>.</td><td class='ans'><span class=\"m\">ل = م ÷ 4</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اجعل ع موضوع الصيغة <span class=\"m\">م = 2(ل + ع)</span>.</td><td class='ans'><span class=\"m\">ع = م/2 − ل</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 56–57، واقرأ ص 90. ولي الأمر الكريم: اطلب من ابنك كتابة صيغة لتكلفة شراء عدد من السلع بسعر ثابت."]}]}, {"id": "5-6", "title": "التحليل إلى عوامل", "periods": [{"head": {"lesson": "5-6 التحليل إلى عوامل", "unit": "الوحدة الخامسة: المعادلات والعبارات الجبرية والصيغ", "week": "الأسبوع العاشر: 8–12/11/2026م", "pages": "كتاب الطالب ص 90–91 • كتاب النشاط ص 58–59 • دليل المعلم ص 94–95", "num": "الحصة 1 من 2", "topic": "التحليل إلى عوامل بإخراج عامل مشترك عددي"}, "plain": ["1) يحلل عبارة جبرية بإخراج العامل المشترك الأكبر العددي.\n2) يفسر أن التحليل إلى عوامل عملية عكسية لفك الأقواس.\n3) يتحقق من التحليل بفك الأقواس. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام", "التحليل إلى عوامل، العامل المشترك الأكبر، فك الأقواس", "يكتب المعلم 3(س + 4) = 3س + 12 ويسأل: كيف نعود من 3س + 12 إلى الصورة الأولى؟ التعلم القبلي: فك الأقواس والعامل المشترك الأكبر للأعداد.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويقدم مصطلح التحليل إلى عوامل.\nالطالب: يستنتج العملية العكسية.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج مثال ص 90: 6س + 9 = 3(2س + 3)، ويؤكد اختيار العامل المشترك الأكبر لا أي عامل.\nالطالب: يحلل أمثلة ويتحقق بالفك.\n3) لعبة البطاقات (10 دقائق):\nالمعلم: يدير مطابقة بين عبارات مفكوكة وعبارات محللة.\nالطالب: يطابق ويتحقق.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بالسؤال 1 من تمارين 5-6 ص 91 ويطلب عرض خطوات العمل كاملة.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: حلل: 3س + 12\nالإجابة النموذجية: 3(س + 4)\nس2 [المستوى المتوقع]: حلل: 6س + 9\nالإجابة النموذجية: 3(2س + 3)\nس3 [المستوى المتقدم]: حلل تحليلًا كاملًا: 12س − 18ص + 6\nالإجابة النموذجية: 6(2س − 3ص + 1)", "س1 [مستوى الدعم]: حلل: 5س − 10\nالإجابة النموذجية: 5(س − 2)\nس2 [المستوى المتوقع]: حلل: 8ص + 12\nالإجابة النموذجية: 4(2ص + 3)\nس3 [المستوى المتقدم]: كتب طالب 16س + 24 = 2(8س + 12). هل التحليل كامل؟\nالإجابة النموذجية: لا؛ التحليل الكامل 8(2س + 3)", "عزيزي الطالب: راجع ص 90 وأكمل السؤال 1 من تمارين 5-6. ولي الأمر الكريم: اطلب من ابنك التحقق من التحليل بفك القوس."], "html": ["<ol class='ol'><li>يحلل عبارة جبرية بإخراج العامل المشترك الأكبر العددي.</li><li>يفسر أن التحليل إلى عوامل عملية عكسية لفك الأقواس.</li><li>يتحقق من التحليل بفك الأقواس. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "التحليل إلى عوامل، العامل المشترك الأكبر، فك الأقواس", "يكتب المعلم <span class=\"m\">3(س + 4) = 3س + 12</span> ويسأل: كيف نعود من <span class=\"m\">3س + 12</span> إلى الصورة الأولى؟ التعلم القبلي: فك الأقواس والعامل المشترك الأكبر للأعداد.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الط
