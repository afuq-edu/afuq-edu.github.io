إرجاع ودونه وأثره على النتائج.</li><li>يحل مسائل كتاب النشاط على فضاء الإمكانات. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تطبيق</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم الذاتي</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "السحب دون إرجاع، فضاء الإمكانات", "في علبة قلم أحمر وأزرق وأخضر. يُسحب قلمان واحدًا بعد الآخر دون إرجاع. اكتب النتائج. التعلم القبلي: القائمة المنظمة وجدول فضاء الإمكانات.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح الموقف.</td><td>يكتب 6 نتائج.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>يناقش السؤال 8 من تمارين 7-3: القلم الأول لا يُعاد، فتختفي النتائج المتكررة من الجدول.</td><td>يقارن جدولي مع الإرجاع ودونه.</td></tr><tr><td class='tm'>14<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 74–76.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 7-3 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>سُحب قلمان دون إرجاع من 3 أقلام مختلفة الألوان. كم نتيجة؟</td><td class='ans'>6</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>في السؤال السابق، ما احتمال أن يكون الأحمر أولًا؟</td><td class='ans'><span class=\"m\">2/6 = 1/3</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>بطاقات 1، 2، 3، 4. سُحبت بطاقتان دون إرجاع لتكوين عدد من رقمين. ما احتمال أن يكون العدد أكبر من 30؟</td><td class='ans'>6 من 12: <span class=\"m\">1/2</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>كم نتيجة عند سحب قلمين مع الإرجاع من 3 أقلام؟</td><td class='ans'>9</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ما الفرق بين عدد النتائج مع الإرجاع ودونه في السؤال السابق؟</td><td class='ans'>3 نتائج (اللون نفسه مرتين)</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>سُحب حرفان دون إرجاع من «ق، ل، م». ما احتمال تكوين «لم» بهذا الترتيب؟</td><td class='ans'><span class=\"m\">1/6</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 74–76، واقرأ ص 124. ولي الأمر الكريم: تابع ابنك في التمييز بين السحب مع الإرجاع ودونه."]}]}, {"id": "7-4", "title": "الاحتمالات التجريبية والنظرية", "periods": [{"head": {"lesson": "7-4 الاحتمالات التجريبية والنظرية", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثالث عشر: 29/11–3/12/2026م", "pages": "كتاب الطالب ص 124–127 • كتاب النشاط ص 77–79 • دليل المعلم ص 131–132", "num": "الحصة 1 من 4", "topic": "الاحتمال التجريبي (التكرار النسبي)"}, "plain": ["1) يجري تجربة ويسجل نتائجها في جدول تكراري.\n2) يحسب الاحتمال التجريبي = عدد مرات ظهور النتيجة ÷ عدد المحاولات.\n3) يميز بين الاحتمال التجريبي والنظري. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: فهم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، الأقلام، أخرى: دبابيس ورق وأكواب وحجارة نرد", "الاحتمال التجريبي، التكرار النسبي، المحاولة، الاحتمال النظري", "يرمي كل طالب دبوس ورق 20 مرة ويسجل: هل يسقط على جنبه أم على ظهره؟ هل يمكن حساب الاحتمال نظريًا؟ التعلم القبلي: الاحتمال النظري والجداول التكرارية.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويوزع الدبابيس.\nالطالب: يتوقع.\n2) تجربة (12 دقيقة):\nالمعلم: ينفذ النشاط في الدليل: كل مجموعة تجري 40 محاولة وتسجل في جدول تكراري.\nالطالب: تسجل وتحسب التكرار النسبي.\n3) النمذجة (9 دقائق):\nالمعلم: يعرف الاحتمال التجريبي بمثال ص 124 ويبين أن بعض المواقف لا تُحسب إلا تجريبيًا.\nالطالب: يحسب من بيانات مجموعته.\n4) الممارسة (8 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 7-4 ص 125.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: رُمي حجر نرد 60 مرة فظهر العدد 3 تسع مرات. ما الاحتمال التجريبي لظهور 3؟\nالإجابة النموذجية: 9/60 = 3/20\nس2 [المستوى المتوقع]: قارن الاحتمال التجريبي السابق بالنظري.\nالإجابة النموذجية: النظري 1/6 ≈ 0.17، والتجريبي 0.15؛ قريبان\nس3 [المستوى المتقدم]: لماذا نحتاج إلى التجربة لتقدير احتمال سقوط الدبوس على ظهره؟\nالإجابة النموذجية: لأن النتائج ليست مرجحة بالتساوي فلا يمكن الحساب نظريًا", "س1 [مستوى الدعم]: سجل طالب 12 إصابة من 30 رمية. ما الاحتمال التجريبي للإصابة؟\nالإجابة النموذجية: 12/30 = 0.4\nس2 [المستوى المتوقع]: رُميت عملة 50 مرة فظهرت الصورة 28 مرة. ما الاحتمال التجريبي للكتابة؟\nالإجابة النموذجية: 22/50 = 0.44\nس3 [المستوى المتقدم]: هل يعني احتمال تجريبي 0.44 للكتابة أن العملة غير منتظمة؟ برّر.\nالإجابة النموذجية: ليس بالضرورة؛ عدد المحاولات قليل والنتائج تتغير عند التكرار", "عزيزي الطالب: كرر تجربة الدبوس 50 مرة في المنزل واحسب الاحتمال التجريبي. ولي الأمر الكريم: ساعد ابنك في تسجيل نتائج التجربة."], "html": ["<ol class='ol'><li>يجري تجربة ويسجل نتائجها في جدول تكراري.</li><li>يحسب الاحتمال التجريبي = عدد مرات ظهور النتيجة ÷ عدد المحاولات.</li><li>يميز بين الاحتمال التجريبي والنظري. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> فهم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span><span>التعلم المبني على المشاريع</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: دبابيس ورق وأكواب وحجارة نرد</span></div>", "الاحتمال التجريبي، التكرار النسبي، المحاولة، الاحتمال النظري", "يرمي كل طالب دبوس ورق 20 مرة ويسجل: هل يسقط على جنبه أم على ظهره؟ هل يمكن حساب الاحتمال نظريًا؟ التعلم القبلي: الاحتمال النظري والجداول التكرارية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويوزع الدبابيس.</td><td>يتوقع.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>تجربة</td><td>ينفذ النشاط في الدليل: كل مجموعة تجري 40 محاولة وتسجل في جدول تكراري.</td><td>تسجل وتحسب التكرار النسبي.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>يعرف الاحتمال التجريبي بمثال ص 124 ويبين أن بعض المواقف لا تُحسب إلا تجريبيًا.</td><td>يحسب من بيانات مجموعته.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 7-4 ص 125.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>رُمي حجر نرد 60 مرة فظهر العدد 3 تسع مرات. ما الاحتمال التجريبي لظهور 3؟</td><td class='ans'><span class=\"m\">9/60 = 3/20</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>قارن الاحتمال التجريبي السابق بالنظري.</td><td class='ans'>النظري <span class=\"m\">1/6 ≈ 0.17</span>، والتجريبي <span class=\"m\">0.15</span>؛ قريبان</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>لماذا نحتاج إلى التجربة لتقدير احتمال سقوط الدبوس على ظهره؟</td><td class='ans'>لأن النتائج ليست مرجحة بالتساوي فلا يمكن الحساب نظريًا</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>سجل طالب 12 إصابة من 30 رمية. ما الاحتمال التجريبي للإصابة؟</td><td class='ans'><span class=\"m\">12/30 = 0.4</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>رُميت عملة 50 مرة فظهرت الصورة 28 مرة. ما الاحتمال التجريبي للكتابة؟</td><td class='ans'><span class=\"m\">22/50 = 0.44</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>هل يعني احتمال تجريبي <span class=\"m\">0.44</span> للكتابة أن العملة غير منتظمة؟ برّر.</td><td class='ans'>ليس بالضرورة؛ عدد المحاولات قليل والنتائج تتغير عند التكرار</td></tr></tbody></table>", "عزيزي الطالب: كرر تجربة الدبوس 50 مرة في المنزل واحسب الاحتمال التجريبي. ولي الأمر الكريم: ساعد ابنك في تسجيل نتائج التجربة."]}, {"head": {"lesson": "7-4 الاحتمالات التجريبية والنظرية", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثالث عشر: 29/11–3/12/2026م", "pages": "كتاب الطالب ص 124–127 • كتاب النشاط ص 77–79 • دليل المعلم ص 131–132", "num": "الحصة 2 من 4", "topic": "أثر عدد المحاولات ومقارنة الاحتمال التجريبي بالنظري"}, "plain": ["1) يستنتج أن زيادة عدد المحاولات تقرّب الاحتمال التجريبي من النظري.\n2) يجمع نتائج المجموعات ويحسب احتمالًا تجريبيًا أدق.\n3) يحكم على عدالة أداة احتمالية من نتائج تجريبية. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم بالاكتشاف، التعلم التشاركي، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، جهاز الحاسب، أخرى: محاكاة رمي حجر نرد على الحاسب", "عدد المحاولات، الاحتمال التجريبي، الاحتمال النظري، العدالة", "يعرض المعلم نتائج مجموعتين في تجربة رمي حجر نرد: الأولى 12 رمية والثانية 120 رمية، ويسأل: أي النتائج أقرب إلى 1/6؟ التعلم القبلي: حساب الاحتمال التجريبي.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض النتائج.\nالطالب: يتوقع أن الثانية أقرب.\n2) تجربة جماعية (12 دقيقة):\nالمعلم: يجمع نتائج رمي حجر النرد من كل المجموعات ويحسب الاحتمال التجريبي بعد 50، 100، 300 رمية، ويعرض محاكاة على الحاسب لـ1000 رمية.\nالطالب: يحسب ويلاحظ اقتراب النتائج من 1/6.\n3) المناقشة (8 دقائق):\nالمعلم: يناقش ما يورده الدليل: تكرار التجربة قد ينتج نتائج مختلفة، وزيادة المحاولات تعطي تقديرًا أفضل.\nالطالب: يكتب الاستنتاج.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف ببقية تمارين 7-4، ومنها سؤال يحتاج حججًا منطقية.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: أيهما يعطي تقديرًا أفضل للاحتمال: 20 محاولة أم 500؟\nالإجابة النموذجية: 500 محاولة\nس2 [المستوى المتوقع]: رُمي حجر نرد 600 مرة فظهر الوجه 6 مئة وخمسين مرة. هل الحجر عادل؟ برّر.\nالإجابة النموذجية: يبدو غير عادل؛ المتوقع نحو 100، و150 بعيد عنه في عدد كبير من الرميات\nس3 [المستوى المتقدم]: نتائج 3 مجموعات لرمي عملة: 12 من 20، 22 من 40، 49 من 100 صورة. احسب الاحتمال التجريبي الإجمالي للصورة.\nالإجابة النموذجية: 83/160 ≈ 0.52", "س1 [مستوى الدعم]: ماذا يحدث للاحتمال التجريبي عند زيادة عدد المحاولات؟\nالإجابة النموذجية: يقترب من الاحتمال النظري\nس2 [المستوى المتوقع]: ظهرت الصورة 260 مرة في 500 رمية. ما الاحتمال التجريبي؟\nالإجابة النموذجية: 0.52\nس3 [المستوى المتقدم]: قال طالب: رميت عملة 4 مرات فظهرت صورة 3 مرات، إذن احتمال الصورة 3/4. ناقش.\nالإجابة النموذجية: هذا احتمال تجريبي من محاولات قليلة جدًا؛ النظري 1/2 ونحتاج محاولات أكثر", "عزيزي الطالب: أكمل تمارين 7-4. ولي الأمر الكريم: ناقش مع ابنك لماذا لا نحكم على أداة من محاولات قليلة."], "html": ["<ol class='ol'><li>يستنتج أن زيادة عدد المحاولات تقرّب الاحتمال التجريبي من النظري.</li><li>يجمع نتائج المجموعات ويحسب احتمالًا تجريبيًا أدق.</li><li>يحكم على عدالة أداة احتمالية من نتائج تجريبية. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التشاركي</span><span>التعلم بالنمذجة</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>جهاز الحاسب</span><span>أخرى: محاكاة رمي حجر نرد على الحاسب</span></div>", "عدد المحاولات، الاحتمال التجريبي، الاحتمال النظري، العدالة", "يعرض المعلم نتائج مجموعتين في تجربة رمي حجر نرد: الأولى 12 رمية والثانية 120 رمية، ويسأل: أي النتائج أقرب إلى <span class=\"m\">1/6</span>؟ التعلم القبلي: حساب الاحتمال التجريبي.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض النتائج.</td><td>يتوقع أن الثانية أقرب.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>تجربة جماعية</td><td>يجمع نتائج رمي حجر النرد من كل المجموعات ويحسب الاحتمال التجريبي بعد 50، 100، 300 رمية، ويعرض محاكاة على الحاسب لـ1000 رمية.</td><td>يحسب ويلاحظ اقتراب النتائج من <span class=\"m\">1/6</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>المناقشة</td><td>يناقش ما يورده الدليل: تكرار التجربة قد ينتج نتائج مختلفة، وزيادة المحاولات تعطي تقديرًا أفضل.</td><td>يكتب الاستنتاج.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف ببقية تمارين 7-4، ومنها سؤال يحتاج حججًا منطقية.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أيهما يعطي تقديرًا أفضل للاحتمال: 20 محاولة أم 500؟</td><td class='ans'>500 محاولة</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>رُمي حجر نرد 600 مرة فظهر الوجه 6 مئة وخمسين مرة. هل الحجر عادل؟ برّر.</td><td class='ans'>يبدو غير عادل؛ المتوقع نحو 100، و150 بعيد عنه في عدد كبير من الرميات</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>نتائج 3 مجموعات لرمي عملة: 12 من 20، 22 من 40، 49 من 100 صورة. احسب الاحتمال التجريبي الإجمالي للصورة.</td><td class='ans'><span class=\"m\">83/160 ≈ 0.52</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ماذا يحدث للاحتمال التجريبي عند زيادة عدد المحاولات؟</td><td class='ans'>يقترب من الاحتمال النظري</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ظهرت الصورة 260 مرة في 500 رمية. ما الاحتمال التجريبي؟</td><td class='ans'><span class=\"m\">0.52</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>قال طالب: رميت عملة 4 مرات فظهرت صورة 3 مرات، إذن احتمال الصورة <span class=\"m\">3/4</span>. ناقش.</td><td class='ans'>هذا احتمال تجريبي من محاولات قليلة جدًا؛ النظري <span class=\"m\">1/2</span> ونحتاج محاولات أكثر</td></tr></tbody></table>", "عزيزي الطالب: أكمل تمارين 7-4. ولي الأمر الكريم: ناقش مع ابنك لماذا لا نحكم على أداة من محاولات قليلة."]}, {"head": {"lesson": "7-4 الاحتمالات التجريبية والنظرية", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثالث عشر: 29/11–3/12/2026م", "pages": "كتاب الطالب ص 124–127 • كتاب النشاط ص 77–79 • دليل المعلم ص 131–132", "num": "الحصة 3 من 4", "topic": "تقدير الاحتمال واستخدامه في التنبؤ"}, "plain": ["1) يقدّر الاحتمال من بيانات تجريبية أو إحصائية.\n2) يستخدم الاحتمال التجريبي للتنبؤ بعدد مرات حدوث نتيجة.\n3) يقيّم مدى موثوقية التنبؤ بحسب حجم البيانات. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "التقدير، التنبؤ، العدد المتوقع", "معلومة: من 200 مصباح فُحصت كان 6 معيبة. كم مصباحًا معيبًا تتوقع في شحنة من 5000؟ التعلم القبلي: الاحتمال التجريبي وأثر عدد المحاولات.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح المسألة.\nالطالب: يحسب 0.03 × 5000 = 150.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج التنبؤ من جدول تكراري (أمثلة ص 126) ويقارن بالتوقع النظري.\nالطالب: يتنبأ في أمثلة.\n3) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 77–79.\nالطالب: يحل فرديًا.\n4) المناقشة (5 دقائق):\nالمعلم: يناقش متى يكون التنبؤ موثوقًا.\nالطالب: يبرر بحجم العينة.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احتمال تجريبي 0.2. كم مرة تتوقع حدوث النتيجة في 150 محاولة؟\nالإجابة النموذجية: 30\nس2 [المستوى المتوقع]: من 200 مصباح كان 6 معيبة. كم مصباحًا معيبًا تتوقع في 5000؟\nالإجابة النموذجية: 150\nس3 [المستوى المتقدم]: أيهما أوثق: تقدير من فحص 20 مصباحًا أم من 2000؟ ولماذا؟\nالإجابة النموذجية: 2000؛ لأن العينة الكبيرة تعطي تقديرًا أقرب للحقيقة", "س1 [مستوى الدعم]: ظهر اللون الأحمر 18 مرة في 60 محاولة. ما الاحتمال التجريبي؟\nالإجابة النموذجية: 0.3\nس2 [المستوى المتوقع]: بالاحتمال السابق، كم مرة تتوقع الأحمر في 400 محاولة؟\nالإجابة النموذجية: 120\nس3 [المستوى المتقدم]: في مدرسة 600 طالب، فضّل 45 من عينة من 120 طالبًا الرياضيات. قدّر عدد من يفضلها في المدرسة.\nالإجابة النموذجية: (45/120) × 600 = 225", "عزيزي الطالب: أكمل كتاب النشاط ص 77–79. ولي الأمر الكريم: ناقش مع ابنك تنبؤات الطقس بوصفها احتمالات."], "html": ["<ol class='ol'><li>يقدّر الاحتمال من بيانات تجريبية أو إحصائية.</li><li>يستخدم الاحتمال التجريبي للتنبؤ بعدد مرات حدوث نتيجة.</li><li>يقيّم مدى موثوقية التنبؤ بحسب حجم البيانات. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "التقدير، التنبؤ، العدد المتوقع", "معلومة: من 200 مصباح فُحصت كان 6 معيبة. كم مصباحًا معيبًا تتوقع في شحنة من 5000؟ التعلم القبلي: الاحتمال التجريبي وأثر عدد المحاولات.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح المسألة.</td><td>يحسب <span class=\"m\">0.03 × 5000 = 150</span>.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج التنبؤ من جدول تكراري (أمثلة ص 126) ويقارن بالتوقع النظري.</td><td>يتنبأ في أمثلة.</td></tr><tr><td class='tm'>14<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 77–79.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>المناقشة</td><td>يناقش متى يكون التنبؤ موثوقًا.</td><td>يبرر بحجم العينة.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احتمال تجريبي <span class=\"m\">0.2</span>. كم مرة تتوقع حدوث النتيجة في 150 محاولة؟</td><td class='ans'>30</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>من 200 مصباح كان 6 معيبة. كم مصباحًا معيبًا تتوقع في 5000؟</td><td class='ans'>150</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أيهما أوثق: تقدير من فحص 20 مصباحًا أم من 2000؟ ولماذا؟</td><td class='ans'>2000؛ لأن العينة الكبيرة تعطي تقديرًا أقرب للحقيقة</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ظهر اللون الأحمر 18 مرة في 60 محاولة. ما الاحتمال التجريبي؟</td><td class='ans'><span class=\"m\">0.3</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بالاحتمال السابق، كم مرة تتوقع الأحمر في 400 محاولة؟</td><td class='ans'>120</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>في مدرسة 600 طالب، فضّل 45 من عينة من 120 طالبًا الرياضيات. قدّر عدد من يفضلها في المدرسة.</td><td class='ans'><span class=\"m\">(45/120) × 600 = 225</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 77–79. ولي الأمر الكريم: ناقش مع ابنك تنبؤات الطقس بوصفها احتمالات."]}, {"head": {"lesson": "7-4 الاحتمالات التجريبية والنظرية", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثالث عشر: 29/11–3/12/2026م", "pages": "كتاب الطالب ص 124–127 • كتاب النشاط ص 77–79 • دليل المعلم ص 131–132", "num": "الحصة 4 من 4", "topic": "مراجعة وحدة الاحتمالات"}, "plain": ["1) يحل مسائل متنوعة تجمع الاحتمال النظري والتجريبي وفضاء الإمكانات.\n2) يختار الطريقة المناسبة لحساب الاحتمال في كل موقف.\n3) يصمم لعبة احتمالية عادلة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: إبداع", "التعلم المبني على المشاريع، التعلم المبني على اللعب، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الاحتمال النظري، الاحتمال التجريبي، فضاء الإمكانات، اللعبة العادلة", "يعرض المعلم لعبة مقدمة الوحدة ويسأل: هل هي عادلة لكلا اللاعبين؟ كيف نعرف؟ التعلم القبلي: كل دروس الوحدة السابعة.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض اللعبة.\nالطالب: يحلل العدالة بجدول فضاء الإمكانات.\n2) مشروع مصغر (12 دقيقة):\nالمعلم: يطلب من كل مجموعة تصميم لعبة بحجري نرد أو بطاقات وإثبات أنها عادلة أو غير عادلة.\nالطالب: تصمم المجموعة اللعبة وتعرض تحليلها.\n3) مراجعة (10 دقائق):\nالمعلم: يطرح أسئلة مراجعة متنوعة من الوحدة.\nالطالب: يجيب ويبرر.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 7-4 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: ما احتمال ظهور عدد أكبر من 4 عند رمي حجر نرد؟\nالإجابة النموذجية: 2/6 = 1/3\nس2 [المستوى المتوقع]: لعبة: يفوز أحمد إذا كان مجموع حجري النرد زوجيًا، ويفوز سعيد إذا كان فرديًا. هل اللعبة عادلة؟\nالإجابة النموذجية: نعم؛ 18 نتيجة زوجية و18 فردية من 36\nس3 [المستوى المتقدم]: لعبة: يفوز أحمد إذا كان حاصل ضرب حجري النرد زوجيًا. ما احتمال فوزه؟ هل اللعبة عادلة لو فاز سعيد بالفردي؟\nالإجابة النموذجية: 27/36 = 3/4؛ غير عادلة", "س1 [مستوى الدعم]: ما احتمال عدم ظهور 6 عند رمي حجر نرد؟\nالإجابة النموذجية: 5/6\nس2 [المستوى المتوقع]: رُمي حجر نرد 120 مرة. كم مرة تتوقع ظهور عدد زوجي؟\nالإجابة النموذجية: 60\nس3 [المستوى المتقدم]: اقترح تعديلًا يجعل لعبة «حاصل الضرب الزوجي يفوز» عادلة.\nالإجابة النموذجية: مثل: أحمد يحصل على نقطة للزوجي وسعيد على 3 نقاط للفردي", "عزيزي الطالب: راجع الوحدة السابعة واحتفظ بتصميم لعبتك. ولي الأمر الكريم: العب مع ابنك اللعبة التي صممها وناقشا عدالتها."], "html": ["<ol class='ol'><li>يحل مسائل متنوعة تجمع الاحتمال النظري والتجريبي وفضاء الإمكانات.</li><li>يختار الطريقة المناسبة لحساب الاحتمال في كل موقف.</li><li>يصمم لعبة احتمالية عادلة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم المبني على المشاريع</span><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "الاحتمال النظري، الاحتمال التجريبي، فضاء الإمكانات، اللعبة العادلة", "يعرض المعلم لعبة مقدمة الوحدة ويسأل: هل هي عادلة لكلا اللاعبين؟ كيف نعرف؟ التعلم القبلي: كل دروس الوحدة السابعة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض اللعبة.</td><td>يحلل العدالة بجدول فضاء الإمكانات.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>مشروع مصغر</td><td>يطلب من كل مجموعة تصميم لعبة بحجري نرد أو بطاقات وإثبات أنها عادلة أو غير عادلة.</td><td>تصمم المجموعة اللعبة وتعرض تحليلها.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>مراجعة</td><td>يطرح أسئلة مراجعة متنوعة من الوحدة.</td><td>يجيب ويبرر.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 7-4 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال ظهور عدد أكبر من 4 عند رمي حجر نرد؟</td><td class='ans'><span class=\"m\">2/6 = 1/3</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>لعبة: يفوز أحمد إذا كان مجموع حجري النرد زوجيًا، ويفوز سعيد إذا كان فرديًا. هل اللعبة عادلة؟</td><td class='ans'>نعم؛ 18 نتيجة زوجية و18 فردية من 36</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>لعبة: يفوز أحمد إذا كان حاصل ضرب حجري النرد زوجيًا. ما احتمال فوزه؟ هل اللعبة عادلة لو فاز سعيد بالفردي؟</td><td class='ans'><span class=\"m\">27/36 = 3/4</span>؛ غير عادلة</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال عدم ظهور 6 عند رمي حجر نرد؟</td><td class='ans'><span class=\"m\">5/6</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>رُمي حجر نرد 120 مرة. كم مرة تتوقع ظهور عدد زوجي؟</td><td class='ans'>60</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اقترح تعديلًا يجعل لعبة «حاصل الضرب الزوجي يفوز» عادلة.</td><td class='ans'>مثل: أحمد يحصل على نقطة للزوجي وسعيد على 3 نقاط للفردي</td></tr></tbody></table>", "عزيزي الطالب: راجع الوحدة السابعة واحتفظ بتصميم لعبتك. ولي الأمر الكريم: العب مع ابنك اللعبة التي صممها وناقشا عدالتها."]}]}, {"id": "8-1", "title": "استخدام الطرق الذهنية", "periods": [{"head": {"lesson": "8-1 استخدام الطرق الذهنية", "unit": "الوحدة الثامنة: النسب المئوية", "week": "الأسبوع الرابع عشر: 6–10/12/2026م", "pages": "كتاب الطالب ص 131–132 • كتاب النشاط ص 80–81 • دليل المعلم ص 141–142", "num": "الحصة 1 من 3", "topic": "حساب النسب المئوية ذهنيًا (10% و5% و1%)"}, "plain": ["1) يحسب 10% و5% و1% و50% و25% من كمية ذهنيًا.\n2) يجزئ نسبة مئوية إلى نسب سهلة لحسابها ذهنيًا.\n3) يتحقق من معقولية الناتج بالتقدير. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم بالنمذجة، التعلم المبني على اللعب، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "النسبة المئوية، الحساب الذهني، التجزئة", "سؤال: سعر حقيبة 40 ريالًا وعليها خصم 10%. كم الخصم؟ وماذا لو كان 15%؟ التعلم القبلي: معنى النسبة المئوية والتحويل بينها وبين الكسور من الوحدة الرابعة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال.\nالطالب: يحسب 4 ريالات ثم 6 ريالات (10% + 5%).\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج مثال ص 131: 10% بالقسمة على 10، و5% نصف 10%، و1% بالقسمة على 100، ثم التجزئة: 35% = 25% + 10%.\nالطالب: يجزئ نسبًا أخرى.\n3) سباق ذهني (10 دقائق):\nالمعلم: يدير سباقًا بين الفرق: نسب مختلفة من 80 و240 و360 ريالًا.\nالطالب: يحسب ذهنيًا ويشرح التجزئة.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 8-1 ص 132.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: أوجد 10% من 250.\nالإجابة النموذجية: 25\nس2 [المستوى المتوقع]: أوجد 15% من 60 ذهنيًا.\nالإجابة النموذجية: 6 + 3 = 9\nس3 [المستوى المتقدم]: أوجد 35% من 240 ذهنيًا واشرح التجزئة.\nالإجابة النموذجية: 25% = 60 و10% = 24؛ المجموع 84", "س1 [مستوى الدعم]: أوجد 50% من 86.\nالإجابة النموذجية: 43\nس2 [المستوى المتوقع]: أوجد 1% من 4500.\nالإجابة النموذجية: 45\nس3 [المستوى المتقدم]: أوجد 95% من 300 بطريقتين.\nالإجابة النموذجية: 300 − 15 = 285، أو 270 + 15 = 285", "عزيزي الطالب: راجع مثال ص 131، وتدرب على حساب 10% و5% من أسعار سلع. ولي الأمر الكريم: اطلب من ابنك حساب خصم 10% على مشترياتكم."], "html": ["<ol class='ol'><li>يحسب 10% و5% و1% و50% و25% من كمية ذهنيًا.</li><li>يجزئ نسبة مئوية إلى نسب سهلة لحسابها ذهنيًا.</li><li>يتحقق من معقولية الناتج بالتقدير. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "النسبة المئوية، الحساب الذهني، التجزئة", "سؤال: سعر حقيبة 40 ريالًا وعليها خصم 10%. كم الخصم؟ وماذا لو كان 15%؟ التعلم القبلي: معنى النسبة المئوية والتحويل بينها وبين الكسور من الوحدة الرابعة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال.</td><td>يحسب 4 ريالات ثم 6 ريالات (10% + 5%).</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال ص 131: 10% بالقسمة على 10، و5% نصف 10%، و1% بالقسمة على 100، ثم التجزئة: <span class=\"m\">35% = 25% + 10%</span>.</td><td>يجزئ نسبًا أخرى.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>سباق ذهني</td><td>يدير سباقًا بين الفرق: نسب مختلفة من 80 و240 و360 ريالًا.</td><td>يحسب ذهنيًا ويشرح التجزئة.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 8-1 ص 132.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد 10% من 250.</td><td class='ans'>25</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد 15% من 60 ذهنيًا.</td><td class='ans'><span class=\"m\">6 + 3 = 9</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أوجد 35% من 240 ذهنيًا واشرح التجزئة.</td><td class='ans'><span class=\"m\">25% = 60</span> و<span class=\"m\">10% = 24</span>؛ المجموع 84</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد 50% من 86.</td><td class='ans'>43</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد 1% من 4500.</td><td class='ans'>45</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أوجد 95% من 300 بطريقتين.</td><td class='ans'><span class=\"m\">300 − 15 = 285</span>، أو <span class=\"m\">270 + 15 = 285</span></td></tr></tbody></table>", "عزيزي الطالب: راجع مثال ص 131، وتدرب على حساب 10% و5% من أسعار سلع. ولي الأمر الكريم: اطلب من ابنك حساب خصم 10% على مشترياتكم."]}, {"head": {"lesson": "8-1 استخدام الطرق الذهنية", "unit": "الوحدة الثامنة: النسب المئوية", "week": "الأسبوع الرابع عشر: 6–10/12/2026م", "pages": "كتاب الطالب ص 131–132 • كتاب النشاط ص 80–81 • دليل المعلم ص 141–142", "num": "الحصة 2 من 3", "topic": "تجزئة النسب المئوية وخاصية التبديل"}, "plain": ["1) يحسب نسبًا مئوية مركبة مثل 17.5% بالتجزئة.\n2) يستنتج أن أ% من ب = ب% من أ ويستخدمها لتسهيل الحساب.\n3) يختار أسهل طريقة ذهنية للحساب ويبررها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم بالاكتشاف، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "التجزئة، النسبة المئوية، خاصية التبديل", "تحدٍ: احسب 8% من 50، ثم 50% من 8. ماذا تلاحظ؟ التعلم القبلي: حساب 10% و5% و1% ذهنيًا.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح التحدي.\nالطالب: يلاحظ أن الناتجين 4.\n2) الاكتشاف (10 دقائق):\nالمعلم: يكلف الأزواج بأمثلة أخرى (4% من 75، 75% من 4) ويناقش السؤال 6 من تمارين 8-1 حيث يفاجأ الطلاب بأن عكس النسبة والكمية لا يغير الإجابة.\nالطالب: يعمم الخاصية ويفسرها.\n3) النمذجة (9 دقائق):\nالمعلم: ينمذج 17.5% = 10% + 5% + 2.5% من 80، ويناقش السؤال 4 (الجزئية ج مجموع إجابتي الجزئيتين السابقتين).\nالطالب: يطبق التجزئة.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالسؤالين 4 و5 من تمارين 8-1.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: أوجد 8% من 50.\nالإجابة النموذجية: 4\nس2 [المستوى المتوقع]: أوجد 17.5% من 80 ذهنيًا.\nالإجابة النموذجية: 8 + 4 + 2 = 14\nس3 [المستوى المتقدم]: احسب 36% من 25 بأسهل طريقة.\nالإجابة النموذجية: 25% من 36 = 9", "س1 [مستوى الدعم]: أوجد 2.5% من 400.\nالإجابة النموذجية: 10\nس2 [المستوى المتوقع]: أوجد 4% من 75 بطريقتين.\nالإجابة النموذجية: 3 (أو 75% من 4 = 3)\nس3 [المستوى المتقدم]: أوجد 12.5% من 64.\nالإجابة النموذجية: 1/8 من 64 = 8", "عزيزي الطالب: أكمل السؤالين 4 و5 من تمارين 8-1، واكتب مثالين على خاصية التبديل. ولي الأمر الكريم: اطرح على ابنك سؤالًا مثل 16% من 25."], "html": ["<ol class='ol'><li>يحسب نسبًا مئوية مركبة مثل 17.5% بالتجزئة.</li><li>يستنتج أن أ% من ب = ب% من أ ويستخدمها لتسهيل الحساب.</li><li>يختار أسهل طريقة ذهنية للحساب ويبررها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التشاركي</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "التجزئة، النسبة المئوية، خاصية التبديل", "تحدٍ: احسب 8% من 50، ثم 50% من ي على حل المشكلات، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: آلات حاسبة علمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "النسبة المئوية للتغير، القيمة الأصلية، الربح، الخسارة", "موقف: ارتفع عدد طلاب نادٍ من 40 إلى 50. بكم في المئة ارتفع؟ وانخفض نادٍ آخر من 50 إلى 40، بكم في المئة؟ التعلم القبلي: الزيادة والنقصان بنسبة مئوية.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح الموقفين.\nالطالب: يحسب 25% و20% ويلاحظ الاختلاف.\n2) النمذجة (8 دقائق):\nالمعلم: ينمذج الصيغة ويعزز أن القيمة الأصلية هي 100% وهو الخطأ الأشيع كما يشير الدليل.\nالطالب: يطبق على أمثلة.\n3) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 84–85.\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 8-3 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: ارتفع سعر من 20 إلى 25 ريالًا. أوجد النسبة المئوية للزيادة.\nالإجابة النموذجية: 25%\nس2 [المستوى المتوقع]: انخفض عدد من 50 إلى 40. أوجد النسبة المئوية للنقصان.\nالإجابة النموذجية: 20%\nس3 [المستوى المتقدم]: قال تاجر: ارتفع السعر من 40 إلى 50 ثم عاد إلى 40، فالزيادة والنقصان بالنسبة نفسها. ناقش.\nالإجابة النموذجية: غير صحيح؛ الزيادة 25% والنقصان 20% لاختلاف القيمة الأصلية", "س1 [مستوى الدعم]: زاد وزن من 60 إلى 63 كجم. أوجد النسبة المئوية للزيادة.\nالإجابة النموذجية: 5%\nس2 [المستوى المتوقع]: اشترى تاجر سلعة بـ80 ريالًا وباعها بـ100. أوجد نسبة الربح.\nالإجابة النموذجية: 25%\nس3 [المستوى المتقدم]: انخفض سعر من 250 إلى 210 ريالات. أوجد نسبة الانخفاض.\nالإجابة النموذجية: 16%", "عزيزي الطالب: أكمل كتاب النشاط ص 84–85، واقرأ ص 137. ولي الأمر الكريم: اطلب من ابنك حساب نسبة تغير فاتورة الكهرباء بين شهرين."], "html": ["<ol class='ol'><li>يحسب النسبة المئوية للتغير = التغير ÷ القيمة الأصلية × 100%.</li><li>يميز القيمة الأصلية في المواقف المختلفة.</li><li>يحك لتهيئة (5 دقائق):\nالمعلم: يعرض الإعلانين.\nالطالب: يقارن ويكتشف أن الثاني يعادل خصم 33 1/3%.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج أمثلة ص 137 ويناقش السؤال 2 من تمارين 8-4: الخصم على كل قميص أو على الإجمالي يعطي النتيجة نفسها.\nالطالب: يحسب بالطريقتين.\n3) مشروع مصغر (12 دقيقة):\nالمعلم: يوزع إعلانات حقيقية ويطلب من كل مجموعة حساب الأسعار بعد الخصم واختيار أفضل عرض لميزانية محددة.\nالطالب: تحسب المجموعة وتعرض قرارها.\n4) الممارسة (7 دقائق):\nالمعلم: يكلف بالسؤالين 1 و2 من تمارين 8-4.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: سعر 60 ريالًا وعليه خصم 10%. ما السعر بعد الخصم؟\nالإجابة النموذجية: 54\nس2 [المستوى المتوقع]: قميصان سعر كل منهما 12 ريالًا بخصم 15%. أوجد المدفوع بطريقتين.\nالإجابة النموذجية: 2 × 10.2 = 20.4 أو 24 × 0.85 = 20.4 ريالًا\nس3 [المستوى المتقدم]: أيهما أفضل: خصم 25% أم «اشترِ 3 وادفع ثمن 2»؟\nالإجابة النموذجية: الثاني يعادل خصم نحو 33% فهو أفضل إن احتجت 3 قطع", "س1 [مستوى الدعم]: سعر 80 ريالًا بخصم 25%. ما السعر الجديد؟\nالإجابة النموذجية: 60\nس2 [المستوى المتوقع]: دفع خالد 36 ريالًا بعد خصم 10%. ما السعر الأصلي؟\nالإجابة النموذجية: 40 ريالًا\nس3 [المستوى المتقدم]: خصمان متتاليان 10% ثم 10%. هل يساويان خصم 20%؟ برّر بمثال 100 ريال.\nالإجابة النموذجية: لا؛ 100 → 90 → 81 أي خصم 19%", "عزيزي الطالب: ابحث عن إعلان تخفيضات واحسب الأسعار بعد الخصم. ولي الأمر الكريم: شارك ابنك قرار شراء يعتمد على مقارنة العروض."], "html": ["<ol class='ol'><li>يحسب سعر السلعة بعد الخصم بنسبة مئوية.</li><li>يحسب الخصم على كل سلعة أو على السعر الإجمالي ويقارن الطريقتين.</li><li>يحكم على أفضل العروض الشرائية. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم المبني على المشاريع</span></div>", "<div class='chip ريال بمعدل 6% لمدة سنتين.\nالإجابة النموذجية: 60 ريالًا\nس3 [المستوى المتقدم]: دفع شخص 126 ريالًا شاملة ضريبة 5%. ما السعر قبل الضريبة؟\nالإجابة النموذجية: 120 ريالًا", "عزيزي الطالب: احسب الضريبة على فاتورة حقيقية من المنزل. ولي الأمر الكريم: ناقش مع ابنك مفهوم الادخار والفائدة."], "html": ["<ol class='ol'><li>يحسب ضريبة القيمة المضافة على السلع والخدمات.</li><li>يحسب الفائدة البسيطة <span class=\"m\">ف = أ × ن × ز</span> والمبلغ الكلي.</li><li>يميز بين معدل الضريبة والنسبة المئوية للدخل المدفوع ضرائب. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: آلات حاسبة علمية</span></div>", "الضريبة، الفائدة البسيطة، المبلغ الأصلي، المعدل", "يعرض المعلم فاتورة شراء عليها ضريبة القيمة المضافة 5% ويسأل: كيف حُسب المبلغ النهائي؟ التعلم القبلي: الزيادة بنسبة مئوية والمضاعف.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الفاتورة.</td><td>يحسب <span class=\"m\">المبلغ × 1.05</span>.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الضرائب</td><td>ينمذج حساب الضريبة ويناقش السؤال 9 من تمارين 8-4 (الفرق بين معدل الضريبة ونسبة الدخل المدفوع).</td><td>يحسب ويفسر.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الفائدة البسيطة</td><td>ينمذج: 2000 ريال بفائدة بسيطة 4% سنويًا لمدة 3 سنوات: <span class=\"m\">2000 × 0.04 × 3 = 240</span>.</td><td>يطبق على أمثلة.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بأسئلة الضريبة والفائدة من تمارين 8-4.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد ضريبة 5% على فاتورة 80 ريالًا.</td><td class='ans'>4 ريالات</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد الفائدة البسيطة على 2000 ريال بمعدل 4% سنويًا لمدة 3 سنوات.</td><td class='ans'>240 ريالًا</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كم سنة يحتاج مبلغ 1500 ريال بفائدة بسيطة 5% سنويًا ليصبح 1800؟</td><td class='ans'><span class=\"m\">300 ÷ 75 = 4</span> سنوات</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما المبلغ الكلي لفاتورة 120 ريالًا بعد ضريبة 5%؟</td><td class='ans'>126 ريالًا</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد الفائدة البسيطة على 500 ريال بمعدل 6% لمدة سنتين.</td><td class='ans'>60 ريالًا</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>دفع شخص 126 ريالًا شاملة ضريبة 5%. ما السعر قبل الضريبة؟</td><td class='ans'>120 ريالًا</td></tr></tbody></table>", "عزيزي الطالب: احسب الضريبة على فاتورة حقيقية من المنزل. ولي الأمر الكريم: ناقش مع ابنك مفهوم الادخار والفائدة."]}, {"head": {"lesson": "8-4 أمثلة عملية", "unit": "الوحدة الثامنة: النسب المئوية", "week": "الأسبوع الخامس عشر: 13–17/12/2026م", "pages": "كتاب الطالب ص 137–139 • كتاب النشاط ص 86–88 • دليل المعلم ص 146–147", "num": "الحصة 4 من 7", "topic": "تطبيقات على النسب المئوية"}, "plain": ["1) يحل مسائل متعددة الخطوات على الخصم والربح والضرائب.\n2) يتعامل مع التخفيضات في صورة نسب مئوية أو كسور.\n3) يقيّم حلول زملائه ويصحح الأخطاء. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم المبني على اللعب، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الخصم، الربح، الضريبة، النسبة المئوية", "سؤال: خصم 1/4 أم خصم 20%؟ أيهما أكبر على سلعة سعرها 60 ريالًا؟ التعلم القبلي: دروس الوحدة الثامنة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال.\nالطالب: يقارن 15 و12 ريالًا.\n2) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 86–88.\nالطالب: يحل فرديًا.\n3) تقييم الأقران (8 دقائق):\nالمعلم: يناقش السؤال 11 من تمارين 8-4 (التخفيضات بالنسب أو الكسور) ويطلب تبادل الحلول وتصحيحها.\nالطالب: يقيّم حل زميله.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 8-4 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: سعر 60 ريالًا بخصم 1/4. ما الخصم؟\nالإجابة النموذجية: 15 ريالًا\nس2 [المستوى المتوقع]: سعر 200 ريال بخصم 10% ثم ضريبة 5% على السعر بعد الخصم. ما المدفوع؟\nالإجابة النموذجية: 180 × 1.05 = 189 ريالًا\nس3 [المستوى المتقدم]: اشترى تاجر 50 قطعة بـ4 ريالات للقطعة، باع 40 منها بـ6 ريالات والباقي بـ3. ما نسبة ربحه؟\nالإجابة النموذجية: الإيراد 240 + 30 = 270، التكلفة 200، الربح 35%", "س1 [مستوى الدعم]: أوجد 20% من 75.\nالإجابة النموذجية: 15\nس2 [المستوى المتوقع]: سعر 90 ريالًا بخصم 1/3. ما السعر الجديد؟\nالإجابة النموذجية: 60 ريالًا\nس3 [المستوى المتقدم]: هل الضريبة ثم الخصم تساوي الخصم ثم الضريبة على سعر 100 ريال (خصم 10%، ضريبة 5%)؟\nالإجابة النموذجية: نعم؛ 100 × 1.05 × 0.9 = 100 × 0.9 × 1.05 = 94.5", "عزيزي الطالب: أكمل كتاب النشاط ص 86–88. ولي الأمر الكريم: تابع ابنك في إكمال صفحات النشاط ومراجعة الوحدة الثامنة."], "html": ["<ol class='ol'><li>يحل مسائل متعددة الخطوات على الخصم والربح والضرائب.</li><li>يتعامل مع التخفيضات في صورة نسب مئوية أو كسور.</li><li>يقيّم حلول زملائه ويصحح الأخطاء. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>الم ؟</td><td class='ans'><span class=\"m\">180 × 1.05 = 189</span> ريالًا</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اشترى تاجر 50 قطعة بـ4 ريالات للقطعة، باع 40 منها بـ6 ريالات والباقي بـ3. ما نسبة ربحه؟</td><td class='ans'>الإيراد <span class=\"m\">240 + 30 = 270</span>، التكلفة 200، الربح 35%</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد 20% من 75.</td><td class='ans'>15</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>سعر 90 ريالًا بخصم <span class=\"m\">1/3</span>. ما السعر الجديد؟</td><td class='ans'>60 ريالًا</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>هل الضريبة ثم الخصم تساوي الخصم ثم الضريبة على سعر 100 ريال (خصم 10%، ضريبة 5%)؟</td><td class='ans'>نعم؛ <span class=\"m\">100 × 1.05 × 0.9 = 100 × 0.9 × 1.05 = 94.5</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 86–88. ولي الأمر الكريم: تابع ابنك في إكمال صفحات النشاط ومراجعة الوحدة الثامنة."]}, {"head": {"lesson": "8-4 أمثلة عملية", "unit": "الوحدة الثامنة: النسب المئوية", "week": "الأسبوع الخامس عشر: 13–17/12/2026م", "pages": "كتاب الطالب ص 137–139 • كتاب النشاط ص 86–88 • دليل المعلم ص 146–147", "num": "الحصة 5 من 7", "topic": "مراجعة نهاية الفصل: الأعداد والأسس والتقريب"}, "plain": ["1) يحل مسائل مراجعة على الأعداد الموجهة والجذور والأسس.\n2) يطبق قواعد التقريب وترتيب العمليات في مسائل مركبة.\n3) يحدد نقاط ضعفه في الوحدتين الأولى والثانية ويعالجها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: أوراق مراجعة نهاية الفصل في دليل المعلم", "الأعداد الموجهة، الأسس، الجذور، التقريب، ترتيب العمليات", "اختبار قبلي سريع من خمسة أسئلة يحدد كل طالب منه المهارات التي يحتاج مراجعتها. التعلم القبلي: الوحدتان الأولى والثانية.", "1) التهيئة (6 دقائق):\nالمعلم: يطرح الاختبار القبلي ويصححه الطلاب ذاتيًا.\nالطالب: يحدد مهاراته الضعيفة.\n2) محطات مراجعة (14 دقيقة):\nالمعلم: ينظم ثلاث محطات: الأعداد الموجهة، الأسس والجذور، التقريب وترتيب العمليات، مستعينًا بأوراق مراجعة نهاية الفصل في الدليل.\nالطالب: يتنقل بين المحطات بحسب حاجته.\n3) الممارسة (14 دقيقة):\nالمعلم: يكلف بأسئلة مراجعة نهاية الفصل في كتاب الطالب الخاصة بالوحدتين.\nالطالب: يحل فرديًا.\n4) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احسب: −3 × (−4) − 5\nالإجابة النموذجية: 7\nس2 [المستوى المتوقع]: بسّط: 2⁵ × 2⁻³\nالإجابة النموذجية: 2² = 4\nس3 [المستوى المتقدم]: احسب (3.7 + 2.1²) ÷ 0.4 وقرّب لرقمين معنويين.\nالإجابة النموذجية: (3.7 + 4.41) ÷ 0.4 = 20.275 ≈ 20", "س1 [مستوى الدعم]: قدّر √70 بين عددين صحيحين.\nالإجابة النموذجية: بين 8 و9\nس2 [المستوى المتوقع]: احسب: 4.5 × 10⁻²\nالإجابة النموذجية: 0.045\nس3 [المستوى المتقدم]: احسب: (−2)³ + 3⁰ − 4⁻¹\nالإجابة النموذجية: −8 + 1 − 0.25 = −7.25", "عزيزي الطالب: راجع الوحدتين الأولى والثانية وأعد حل الأسئلة التي أخطأت فيها. ولي الأمر الكريم: ساعد ابنك في وضع جدول مراجعة لنهاية الفصل."], "html": ["<ol class='ol'><li>يحل مسائل مراجعة على الأعداد الموجهة والجذور والأسس.</li><li>يطبق قواعد التقريب وترتيب العمليات في مسائل مركبة.</li><li>يحدد نقاط ضعفه في الوحدتين الأولى والثانية ويعالجها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم الذاتي</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: أوراق مراجعة نهاية الفصل في دليل المعلم</span></div>", "الأعداد الموجهة، الأسس، الجذور، التقريب، ترتيب العمليات", "اختبار قبلي سريع من خمسة أسئلة يحدد كل طالب منه المهارات التي يحتاج مراجعتها. التعلم القبلي: الوحدتان الأولى والثانية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th  return L.periods.map((p,j)=>`الحصة ${j+1}: ${p.head.topic}\n${p.plain[k]}`).join("\n\n")}

 return L.periods.map((p,j)=>`<div class="sub">الحصة ${j+1}: ${p.head.topic}</div>${p.html[k]}`).join("")}
function render(){const L=D[li];
 $("mSep").classList.toggle("on",mode==="sep");$("mMer").classList.toggle("on",mode==="mer");
 $("now").textContent=mode==="sep"?"أنت الآن في الوضع المنفصل: نموذج لكل حصة":"أنت الآن في الوضع المدمج: نموذج واحد لكل درس يضم حصصه كلها";
 $("tabs").style.display=mode==="sep"?"flex":"none";
 $("tabs").innerHTML=L.periods.map((p,j)=>`<button class="${j===pi?"on":""}" data-j="${j}">الحصة ${j+1}: ${p.head.topic}</button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{pi=+b.dataset.j;render()});
 const h=L.periods[mode==="sep"?pi:0].head;
 $("hd").innerHTML=`<div class="t">${h.lesson}</div><div><b>${h.unit}</b></div><div>${h.week} • ${h.pages}</div>`+(mode==="sep"?`<div><b>${h.num}:</b> ${h.topic}</div>`:`<div><b>عدد حصص الدرس:</b> ${L.periods.length}</div>`);
 $("cards").innerHTML=F.map((f,k)=>`<div class="card ${tint[k]}"><h3><span><i>${k+1}</i>${f}</span><button class="copy" data-k="${k}">نسخ</button></h3><div class="body">${htm(k)}</div><div class="selhint" id="sh${k}">لم يسمح المتصفح بالنسخ التلقائي. النص محدد أدناه، انسخه يدويًا.</div><div class="raw" id="raw${k}"></div></div>`).join("");
 $("cards").querySelectorAll(".copy").forEach(b=>b.onclick=()=>copy(+b.dataset.k,b))}
async function copy(k,b){const t=plain(k);let ok=false;
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch(e){}
 if(!ok){const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
  try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta)}
 if(ok){b.textContent="تم النسخ ✓";b.classList.add("done");setTimeout(()=>{b.textContent="نسخ";b.classList.remove("done")},1800)}
 else{const r=$("raw"+k);r.textContent=t;r.classList.add("on");$("sh"+k).classList.add("on");const s=window.getSelection(),rg=document.createRange();rg.selectNodeContents(r);s.removeAllRanges();s.addRange(rg)}}
render();
</script></body></html>
