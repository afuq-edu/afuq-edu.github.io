ا طول ضلعه 1 سم على ورق ملليمتري ويسأل: كم مربعًا صغيرًا (1 مم²) بداخله؟ التعلم القبلي: التحويل بين وحدات الطول ومساحة المستطيل.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويوجه العد بذكاء (10 صفوف × 10).\nالطالب: يستنتج 1 سم² = 100 مم².\n2) الاكتشاف (10 دقائق):\nالمعلم: ينفذ النشاط 1 في الدليل: يرسم مربعًا طوله 1 م ويقسمه ذهنيًا إلى سنتيمترات، ويستنتج 1 م² = 10 000 سم² ثم الهكتار.\nالطالب: يستنتج عوامل التحويل ويكتبها في جدول.\n3) النمذجة (8 دقائق):\nالمعلم: ينمذج أمثلة ص 101–102 مع كتابة عامل التحويل في كل سؤال كما يوصي الدليل.\nالطالب: يكتب عامل التحويل قبل الحساب.\n4) الممارسة (11 دقيقة):\nالمعلم: يكلف بالأسئلة 1–3 من تمارين 6-1.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: حوّل 3 سم² إلى مم².\nالإجابة النموذجية: 300 مم²\nس2 [المستوى المتوقع]: حوّل 2.5 م² إلى سم².\nالإجابة النموذجية: 25 000 سم²\nس3 [المستوى المتقدم]: قال طالب: 1 م² = 100 سم². صحّح الخطأ وفسّر.\nالإجابة النموذجية: 1 م² = 100 × 100 = 10 000 سم²؛ لأن المساحة بعدان", "س1 [مستوى الدعم]: حوّل 450 مم² إلى سم².\nالإجابة النموذجية: 4.5 سم²\nس2 [المستوى المتوقع]: حوّل 3 هكتارات إلى م².\nالإجابة النموذجية: 30 000 م²\nس3 [المستوى المتقدم]: مزرعة مستطيلة بعداها 250 م و160 م. أوجد مساحتها بالهكتار.\nالإجابة النموذجية: 40 000 م² = 4 هكتارات", "عزيزي الطالب: انسخ جدول عوامل تحويل المساحة في دفترك، وأكمل الأسئلة 1–3 من تمارين 6-1. ولي الأمر الكريم: ناقش مع ابنك مساحة أرض أو مزرعة بالهكتار."], "html": ["<ol class='ol'><li>يستنتج عوامل التحويل بين وحدات المساحة (<span class=\"m\">مم<sup>2</sup></span>، <span class=\"m\">سم<sup>2</sup></span>، <span class=\"m\">م<sup>2</sup></span>، الهكتار) من وحدات الطول.</li><li>يحوّل بين وحدات المساحة بدقة مع كتابة عامل التحويل.</li><li>يحلل الخطأ الشائع في استخدام عامل الطول بدل عامل المساحة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: ورق مربعات بالملليمتر ومسطرة مترية</span></div>", "وحدات المساحة، عامل التحويل، الهكتار، السنتيمتر المربع", "يرسم المعلم مربعًا طول ضلعه 1 سم على ورق ملليمتري ويسأل: كم مربعًا صغيرًا (<span class=\"m\">1 مم<sup>2</sup></span>) بداخله؟ التعلم القبلي: التحويل بين وحدات الطول ومساحة المستطيل.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويوجه العد بذكاء (10 صفوف × 10).</td><td>يستنتج <span class=\"m\">1 سم<sup>2</sup> = 100 مم<sup>2</sup></span>.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الاكتشاف</td><td>ينفذ النشاط 1 في الدليل: يرسم مربعًا طوله 1 م ويقسمه ذهنيًا إلى سنتيمترات، ويستنتج <span class=\"m\">1 م<sup>2</sup> = 10 000 سم<sup>2</sup></span> ثم الهكتار.</td><td>يستنتج عوامل التحويل ويكتبها في جدول.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج أمثلة ص 101–102 مع كتابة عامل التحويل في كل سؤال كما يوصي الدليل.</td><td>يكتب عامل التحويل قبل الحساب.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة 1–3 من تمارين 6-1.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حوّل <span class=\"m\">3 سم<sup>2</sup></span> إلى <span class=\"m\">مم<sup>2</sup></span>.</td><td class='ans'>300 <span class=\"m\">مم<sup>2</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>حوّل <span class=\"m\">2.5 م<sup>2</sup></span> إلى <span class=\"m\">سم<sup>2</sup></span>.</td><td class='ans'>25 000 <span class=\"m\">سم<sup>2</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>قال طالب: <span class=\"m\">1 م<sup>2</sup> = 100 سم<sup>2</sup></span>. صحّح الخطأ وفسّر.</td><td class='ans'><span class=\"m\">1 م<sup>2</sup> = 100 × 100 = 10 000 سم<sup>2</sup></span>؛ لأن المساحة بعدان</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حوّل <span class=\"m\">450 مم<sup>2</sup></span> إلى <span class=\"m\">سم<sup>2</sup></span>.</td><td class='ans'><span class=\"m\">4.5 سم<sup>2</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>حوّل 3 هكتارات إلى <span class=\"m\">م<sup>2</sup></span>.</td><td class='ans'>30 000 <span class=\"m\">م<sup>2</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>مزرعة مستطيلة بعداها 250 م و160 م. أوجد مساحتها بالهكتار.</td><td class='ans'><span class=\"m\">40 000 م<sup>2</sup> = 4</span> هكتارات</td></tr></tbody></table>", "عزيزي الطالب: انسخ جدول عوامل تحويل المساحة في دفترك، وأكمل الأسئلة 1–3 من تمارين 6-1. ولي الأمر الكريم: ناقش مع ابنك مساحة أرض أو مزرعة بالهكتار."]}, {"head": {"lesson": "6-1 تحويل وحدات المساحة والحجم", "unit": "الوحدة السادسة: المساحة والمحيط والحجم", "week": "الأسبوع الحادي عشر: 15–19/11/2026م", "pages": "كتاب الطالب ص 101–104 • كتاب النشاط ص 64–65 • دليل المعلم ص 111–112", "num": "الحصة 2 من 2", "topic": "تحويل وحدات الحجم والسعة"}, "plain": ["1) يحوّل بين وحدات الحجم (مم³، سم³، م³) والسعة (مل، لتر).\n2) يستنتج أن 1 سم³ = 1 مل و1 لتر = 1000 سم³.\n3) يحل مسائل عملية تتطلب التحويل بين الحجم والسعة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تحليل", "التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، نماذج مجسمة، أخرى: مكعب لتري ومخبار مدرّج", "وحدات الحجم، السعة، اللتر، الملليلتر", "يعرض المعلم مكعبًا طول حرفه 10 سم ويملؤه ماء من قارورة لتر، ويسأل: ما حجم المكعب بـسم³؟ وماذا تستنتج؟ التعلم القبلي: تحويل وحدات المساحة وحجم المكعب.", "1) التهيئة (5 دقائق):\nالمعلم: ينفذ العرض العملي.\nالطالب: يستنتج 1000 سم³ = 1 لتر.\n2) الاستنتاج (9 دقائق):\nالمعلم: ينفذ النشاط 2 في الدليل ويستنتج مع الطلاب 1 سم³ = 1000 مم³ و1 م³ = 1 000 000 سم³.\nالطالب: يكمل جدول التحويل.\n3) مسائل عملية (8 دقائق):\nالمعلم: يناقش السؤالين 4 و5 من تمارين 6-1 (لكل منهما أساس عملي يتطلب التفكير في المطلوب).\nالطالب: يحل في مجموعات.\n4) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 64–65.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: حوّل 2 لتر إلى سم³.\nالإجابة النموذجية: 2000 سم³\nس2 [المستوى المتوقع]: حوّل 0.4 م³ إلى سم³.\nالإجابة النموذجية: 400 000 سم³\nس3 [المستوى المتقدم]: خزان على شكل متوازي مستطيلات أبعاده 2 م × 1.5 م × 1 م. كم لترًا يتسع؟\nالإجابة النموذجية: 3 م³ = 3 000 000 سم³ = 3000 لتر", "س1 [مستوى الدعم]: حوّل 750 مل إلى لتر.\nالإجابة النموذجية: 0.75 لتر\nس2 [المستوى المتوقع]: حوّل 5 سم³ إلى مم³.\nالإجابة النموذجية: 5000 مم³\nس3 [المستوى المتقدم]: كم كوبًا سعته 250 مل يملأ إناء حجمه 3 دسم³ (3000 سم³)؟\nالإجابة النموذجية: 12 كوبًا", "عزيزي الطالب: أكمل كتاب النشاط ص 64–65، وابحث عن عبوات في المنزل واكتب سعتها بالملليلتر واللتر. ولي الأمر الكريم: شارك ابنك في قراءة سعة العبوات وتحويلها."], "html": ["<ol class='ol'><li>يحوّل بين وحدات الحجم (<span class=\"m\">مم<sup>3</sup></span>، <span class=\"m\">سم<sup>3</sup></span>، <span class=\"m\">م<sup>3</sup></span>) والسعة (مل، لتر).</li><li>يستنتج أن <span class=\"m\">1 سم<sup>3</sup> = 1 مل</span> و<span class=\"m\">1 لتر = 1000 سم<sup>3</sup></span>.</li><li>يحل مسائل عملية تتطلب التحويل بين الحجم والسعة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>نماذج مجسمة</span><span>أخرى: مكعب لتري ومخبار مدرّج</span></div>", "وحدات الحجم، السعة، اللتر، الملليلتر", "يعرض المعلم مكعبًا طول حرفه 10 سم ويملؤه ماء من قارورة لتر، ويسأل: ما حجم المكعب بـ<span class=\"m\">سم<sup>3</sup></span>؟ وماذا تستنتج؟ التعلم القبلي: تحويل وحدات المساحة وحجم المكعب.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>ينفذ العرض العملي.</td><td>يستنتج <span class=\"m\">1000 سم<sup>3</sup> = 1</span> لتر.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الاستنتاج</td><td>ينفذ النشاط 2 في الدليل ويستنتج مع الطلاب <span class=\"m\">1 سم<sup>3</sup> = 1000 مم<sup>3</sup></span> و<span class=\"m\">1 م<sup>3</sup> = 1 000 000 سم<sup>3</sup></span>.</td><td>يكمل جدول التحويل.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسائل عملية</td><td>يناقش السؤالين 4 و5 من تمارين 6-1 (لكل منهما أساس عملي يتطلب التفكير في المطلوب).</td><td>يحل في مجموعات.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 64–65.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حوّل 2 لتر إلى <span class=\"m\">سم<sup>3</sup></span>.</td><td class='ans'>2000 <span class=\"m\">سم<sup>3</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>حوّل <span class=\"m\">0.4 م<sup>3</sup></span> إلى <span class=\"m\">سم<sup>3</sup></span>.</td><td class='ans'>400 000 <span class=\"m\">سم<sup>3</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>خزان على شكل متوازي مستطيلات أبعاده <span class=\"m\">2 م × 1.5 م × 1 م</span>. كم لترًا يتسع؟</td><td class='ans'><span class=\"m\">3 م<sup>3</sup> = 3 000 000 سم<sup>3</sup> = 3000</span> لتر</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>حوّل 750 مل إلى لتر.</td><td class='ans'><span class=\"m\">0.75</span> لتر</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>حوّل <span class=\"m\">5 سم<sup>3</sup></span> إلى <span class=\"m\">مم<sup>3</sup></span>.</td><td class='ans'>5000 <span class=\"m\">مم<sup>3</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كم كوبًا سعته 250 مل يملأ إناء حجمه <span class=\"m\">3 دسم<sup>3</sup></span> (3000 <span class=\"m\">سم<sup>3</sup></span>)؟</td><td class='ans'>12 كوبًا</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 64–65، وابحث عن عبوات في المنزل واكتب سعتها بالملليلتر واللتر. ولي الأمر الكريم: شارك ابنك في قراءة سعة العبوات وتحويلها."]}]}, {"id": "6-2", "title": "حل مسائل الدائرة", "periods": [{"head": {"lesson": "6-2 حل مسائل الدائرة", "unit": "الوحدة السادسة: المساحة والمحيط والحجم", "week": "الأسبوع الحادي عشر: 15–19/11/2026م", "pages": "كتاب الطالب ص 105–107 • كتاب النشاط ص 66–67 • دليل المعلم ص 113–114", "num": "الحصة 1 من 3", "topic": "محيط الدائرة ومساحتها"}, "plain": ["1) يتذكر صيغتي محيط الدائرة (2πنق) ومساحتها (πنق²).\n2) يحسب محيط الدائرة ومساحتها بمعلومية نصف القطر أو القطر.\n3) يميز بين استخدام القطر ونصف القطر في الصيغ. (مخرج تعليمي آخر)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: آلات حاسبة علمية، أخرى: فرجار", "الدائرة، نصف القطر، القطر، المحيط، المساحة، π", "يقيس الطلاب محيط أغطية دائرية بخيط ويقسمونه على القطر: ماذا تلاحظ؟ التعلم القبلي: أجزاء الدائرة ومحيطها ومساحتها من الصف السابع.", "1) التهيئة (6 دقائق):\nالمعلم: يوجه القياس ويجمع النتائج.\nالطالب: يلاحظ أن النسبة قريبة من 3.14.\n2) النمذجة (8 دقائق):\nالمعلم: يراجع الصيغتين وينمذج حساب المحيط والمساحة لدائرة نصف قطرها 5 سم مع π = 3.14 أو زر π.\nالطالب: يحسب ويقرّب.\n3) الأخطاء الشائعة (8 دقائق):\nالمعلم: يناقش أخطاء استخدام القطر بدل نصف القطر في المساحة وكتابة الوحدات.\nالطالب: يصحح أمثلة خاطئة.\n4) الممارسة (12 دقيقة):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 6-2 ص 106.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: أوجد محيط دائرة قطرها 10 سم (π = 3.14).\nالإجابة النموذجية: 31.4 سم\nس2 [المستوى المتوقع]: أوجد مساحة دائرة نصف قطرها 5 سم (π = 3.14).\nالإجابة النموذجية: 78.5 سم²\nس3 [المستوى المتقدم]: دائرة قطرها 12 سم. حسب طالب مساحتها 3.14 × 12². ما خطؤه؟ وما الصحيح؟\nالإجابة النموذجية: استخدم القطر بدل نصف القطر؛ الصحيح 3.14 × 6² = 113.04 سم²", "س1 [مستوى الدعم]: أوجد محيط دائرة نصف قطرها 7 سم (π = 3.14).\nالإجابة النموذجية: 43.96 سم\nس2 [المستوى المتوقع]: أوجد مساحة دائرة قطرها 8 سم (π = 3.14).\nالإجابة النموذجية: 50.24 سم²\nس3 [المستوى المتقدم]: أيهما أكبر: محيط دائرة نصف قطرها 4 سم أم محيط مربع طول ضلعه 6 سم؟\nالإجابة النموذجية: محيط الدائرة 25.12 سم أكبر من 24 سم", "عزيزي الطالب: احفظ صيغتي المحيط والمساحة، وأكمل الأسئلة الأولى من تمارين 6-2. ولي الأمر الكريم: اطلب من ابنك حساب محيط طبق دائري في المنزل."], "html": ["<ol class='ol'><li>يتذكر صيغتي محيط الدائرة (<span class=\"m\">2πنق</span>) ومساحتها (<span class=\"m\">πنق<sup>2</sup></span>).</li><li>يحسب محيط الدائرة ومساحتها بمعلومية نصف القطر أو القطر.</li><li>يميز بين استخدام القطر ونصف القطر في الصيغ. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تذكر</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: آلات حاسبة علمية</span><span>أخرى: فرجار</span></div>", "الدائرة، نصف القطر، القطر، المحيط، المساحة، π", "يقيس الطلاب محيط أغطية دائرية بخيط ويقسمونه على القطر: ماذا تلاحظ؟ التعلم القبلي: أجزاء الدائرة ومحيطها ومساحتها من الصف السابع.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>6<small>د</small></td><td class='ph'>التهيئة</td><td>يوجه القياس ويجمع النتائج.</td><td>يلاحظ أن النسبة قريبة من <span class=\"m\">3.14</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>يراجع الصيغتين وينمذج حساب المحيط والمساحة لدائرة نصف قطرها 5 سم مع <span class=\"m\">π = 3.14</span> أو زر π.</td><td>يحسب ويقرّب.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الأخطاء الشائعة</td><td>يناقش أخطاء استخدام القطر بدل نصف القطر في المساحة وكتابة الوحدات.</td><td>يصحح أمثلة خاطئة.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 6-2 ص 106.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد محيط دائرة قطرها 10 سم (<span class=\"m\">π = 3.14</span>).</td><td class='ans'><span class=\"m\">31.4</span> سم</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد مساحة دائرة نصف قطرها 5 سم (<span class=\"m\">π = 3.14</span>).</td><td class='ans'><span class=\"m\">78.5 سم<sup>2</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>دائرة قطرها 12 سم. حسب طالب مساحتها <span class=\"m\">3.14 × 12<sup>2</sup></span>. ما خطؤه؟ وما الصحيح؟</td><td class='ans'>استخدم القطر بدل نصف القطر؛ الصحيح <span class=\"m\">3.14 × 6<sup>2</sup> = 113.04 سم<sup>2</sup></span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد محيط دائرة نصف قطرها 7 سم (<span class=\"m\">π = 3.14</span>).</td><td class='ans'><span class=\"m\">43.96</span> سم</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد مساحة دائرة قطرها 8 سم (<span class=\"m\">π = 3.14</span>).</td><td class='ans'><span class=\"m\">50.24 سم<sup>2</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أيهما أكبر: محيط دائرة نصف قطرها 4 سم أم محيط مربع طول ضلعه 6 سم؟</td><td class='ans'>محيط الدائرة <span class=\"m\">25.12</span> سم أكبر من 24 سم</td></tr></tbody></table>", "عزيزي الطالب: احفظ صيغتي المحيط والمساحة، وأكمل الأسئلة الأولى من تمارين 6-2. ولي الأمر الكريم: اطلب من ابنك حساب محيط طبق دائري في المنزل."]}, {"head": {"lesson": "6-2 حل مسائل الدائرة", "unit": "الوحدة السادسة: المساحة والمحيط والحجم", "week": "الأسبوع الحادي عشر: 15–19/11/2026م", "pages": "كتاب الطالب ص 105–107 • كتاب النشاط ص 66–67 • دليل المعلم ص 113–114", "num": "الحصة 2 من 3", "topic": "نصف الدائرة وربع الدائرة والأشكال المركبة"}, "plain": ["1) يحسب مساحة ومحيط نصف الدائرة وربع الدائرة.\n2) يجزئ شكلًا مركبًا إلى أجزاء بسيطة لحساب مساحته ومحيطه.\n3) يكتب الصيغ المناسبة قبل التعويض. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: آلات حاسبة علمية", "نصف الدائرة، ربع الدائرة، الشكل المركب", "يعرض المعلم صورة ملعب على شكل مستطيل بطرفين نصف دائريين، ويسأل: كيف نحسب طول المضمار؟ التعلم القبلي: محيط الدائرة ومساحتها.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الصورة ويطلب التجزئة.\nالطالب: يقترح مستطيلًا ودائرة كاملة من نصفين.\n2) النمذجة (10 دقائق):\nالمعلم: ينمذج حساب محيط نصف دائرة قطرها 10 سم (القوس + القطر) ومساحتها.\nالطالب: يكتب الصيغة أولًا ثم يعوّض.\n3) تعلم تعاوني (10 دقائق):\nالمعلم: يوزع السؤالين 6 و8 من تمارين 6-2 (أشكال مركبة)، ويشجع رسم الأجزاء منفصلة كما يقترح الدليل.\nالطالب: يرسم الأجزاء ويحسب.\n4) الممارسة (9 دقائق):\nالمعلم: يكلف بسؤال فردي إضافي.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: أوجد مساحة نصف دائرة نصف قطرها 4 سم (π = 3.14).\nالإجابة النموذجية: 25.12 سم²\nس2 [المستوى المتوقع]: أوجد محيط نصف دائرة قطرها 10 سم (π = 3.14).\nالإجابة النموذجية: 15.7 + 10 = 25.7 سم\nس3 [المستوى المتقدم]: شكل مكون من مربع طول ضلعه 6 سم ونصف دائرة على أحد أضلاعه. أوجد مساحته.\nالإجابة النموذجية: 36 + 14.13 = 50.13 سم²", "س1 [مستوى الدعم]: أوجد مساحة ربع دائرة نصف قطرها 10 سم (π = 3.14).\nالإجابة النموذجية: 78.5 سم²\nس2 [المستوى المتوقع]: أوجد محيط ربع دائرة نصف قطرها 10 سم.\nالإجابة النموذجية: 15.7 + 20 = 35.7 سم\nس3 [المستوى المتقدم]: أوجد مساحة الحلقة بين دائرتين نصفا قطريهما 5 سم و3 سم.\nالإجابة النموذجية: 3.14 × (25 − 9) = 50.24 سم²", "عزيزي الطالب: أكمل السؤالين 6 و8 من تمارين 6-2. ولي الأمر الكريم: اطلب من ابنك تقدير مساحة طاولة نصف دائرية."], "html": ["<ol class='ol'><li>يحسب مساحة ومحيط نصف الدائرة وربع الدائرة.</li><li>يجزئ شكلًا مركبًا إلى أجزاء بسيطة لحساب مساحته ومحيطه.</li><li>يكتب الصيغ المناسبة قبل التعويض. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تطبيق</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاون يوزع تمارين كتاب النشاط ص 66–67.\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 6-2 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: دائرة محيطها 62.8 سم. أوجد نصف قطرها (π = 3.14).\nالإجابة النموذجية: 10 سم\nس2 [المستوى المتوقع]: دائرة مساحتها 50.24 سم². أوجد نصف قطرها.\nالإجابة النموذجية: 4 سم\nس3 [المستوى المتقدم]: عجلة قطرها 60 سم. كم دورة تدور لتقطع 94.2 م؟\nالإجابة النموذجية: محيطها 188.4 سم، وعدد الدورات 9420 ÷ 188.4 = 50", "س1 [مستوى الدعم]: دائرة محيطها 31.4 سم. أوجد قطرها.\nالإجابة النموذجية: 10 سم\nس2 [المستوى المتوقع]: دائرة مساحتها 314 سم². أوجد نصف قطرها.\nالإجابة النموذجية: 10 سم\nس3 [المستوى المتقدم]: إذا تضاعف نصف قطر دائرة، فكم مرة تتضاعف مساحتها؟ برّر.\nالإجابة النموذجية: 4 مرات؛ لأن المساحة تتناسب مع مربع نصف القطر", "عزيزي الطالب: أكمل كتاب النشاط ص 66–67، واقرأ ص 108. ولي الأمر الكريم: اسأل ابنك: كم مرة تدور عجلة الدراجة لتقطع 100 م؟"], "html": ["<ol class='ol'><li>يوجد نصف القطر أو القطر بمعلومية المحيط أو المساحة.</li><li>يعيد ترتيب صيغ الدائرة لإيجاد المجهول.</li><li>يحل مسائل حياتية على الدائرة ويفسر النتيجة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم الذاتي</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: آلات حاسبة علمية</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "إعادة ترتيب الصيغة، نصف القطر، المحيط، المساحة", "تحدٍ: عجلة دراجة تقطع <span class=\"m\">188.4</span> سم في دورة واحدة. ما قطرها؟ التعلم القبلي: صيغ الدائرة وإعادة ترتيب \nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: منشور مساحة مقطعه 12 سم² وطوله 10 سم. أوجد حجمه.\nالإجابة النموذجية: 120 سم³\nس2 [المستوى المتوقع]: أوجد حجم أسطوانة نصف قطرها 3 سم وارتفاعها 10 سم (π = 3.14).\nالإجابة النموذجية: 282.6 سم³\nس3 [المستوى المتقدم]: أسطوانة حجمها 314 سم³ ونصف قطرها 5 سم. أوجد ارتفاعها.\nالإجابة النموذجية: ع = 314 ÷ (3.14 × 25) = 4 سم", "س1 [مستوى الدعم]: منشور ثلاثي قاعدته مثلث قاعدته 6 سم وارتفاعه 4 سم، وطول المنشور 10 سم. أوجد حجمه.\nالإجابة النموذجية: 12 × 10 = 120 سم³\nس2 [المستوى المتوقع]: أوجد حجم أسطوانة قطرها 4 سم وارتفاعها 5 سم (π = 3.14).\nالإجابة النموذجية: 62.8 سم³\nس3 [المستوى المتقدم]: علبة أسطوانية سعتها 1 لتر ونصف قطرها 5 سم. أوجد ارتفاعها لأقرب منزلة عشرية.\nالإجابة النموذجية: 1000 ÷ 78.5 ≈ 12.7 سم", "عزيزي الطالب: راجع أمثلة ص 108–109 وأكمل الأسئلة الأولى من تمارين 6-3. ولي الأمر الكريم: اطلب من ابنك حساب حجم علبة أسطوانية في المطبخ."], "html": ["<ol class='ol'><li>يحسب حجم المنشور بضرب مساحة المقطع العرضي في الطول.</li><li>يحسب حجم الأسطوانة <span class=\"m\">ح = πنق<sup>2</sup>ع</span>.</li><li>يعيد ترتيب صيغة الحجم لإيجاد بعد مجهول. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>نماذج مجسمة</span><span>أخرى: آلات حاسبة علمية</span></div>", "المنشور، الأسطوانة، المقطع العرضي، الحجم", "يعرض المعلم رزمة أوراق مستطيلة ويقارنها برزمة عملات معدنية: كيف نحسب حجم كل منهما؟ التعلم القبلي: حجم متوازي المستطيلات ومساحة الدائرة والمثلث.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد حجم أسطوانة قطرها 4 سم وارتفاعها 5 سم (<span class=\"m\">π = 3.14</span>).</td><td class='ans'><span class=\"m\">62.8 سم<sup>3</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>علبة أسطوانية سعتها 1 لتر ونصف قطرها 5 سم. أوجد ارتفاعها لأقرب منزلة عشرية.</td><td class='ans'><span class=\"m\">1000 ÷ 78.5 ≈ 12.7</span> سم</td></tr></tbody></table>", "عزيزي الطالب: راجع أمثلة ص 108–109 وأكمل الأسئلة الأولى من تمارين 6-3. ولي الأمر الكريم: اطلب من ابنك حساب حجم علبة أسطوانية في المطبخ."]}, {"head": {"lesson": "6-3 العمليات الحسابية المتعلقة بالمنشور والأسطوانة", "unit": "الوحدة السادسة: المساحة والمحيط والحجم", "week": "الأسبوع الحادي عشر: 15–19/11/2026م", "pages": "كتاب الطالب ص 108–112 • كتاب النشاط ص 68–69 • دليل المعلم ص 115–116", "num": "الحصة 2 من 2", "topic": "مساحة سطح المنشور والأسطوانة"}, "plain": ["1) يحسب مساحة سطح المنشور بجمع مساحات أوجهه.\n2) يحسب مساحة سطح الأسطوانة باستخدام شبكتها.\n3) يربط بين الشبكة ومساحة السطح ويحل مسائل التغليف. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، نماذج مجسمة، أخرى: آلات حاسبة علمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "مساحة السطح، الشبكة، المساحة الجانبية", "يفك المعلم ملصق علبة أسطوانية ليظهر مستطيلًا، ويسأل: ما طول هذا المستطيل؟ التعلم القبلي: الشبكات من الوحدة الثالثة ومحيط الدائرة.", "1) التهيئة (5 دقائق):\nالمعلم: يفك الملصق ويطرح السؤال.\nالطالب: يستنتج أن الطول يساوي محيط الدائرة.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج مساحة سطح الأسطوانة 2πنق² + 2πنقع ومساحة سطح منشور ثلاثي.\nالطالب: يحسب من الشبكة.\n3) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 68–69 والسؤال 5 (د) من تمارين 6-3 مع التذكير بالسؤال 4 من تمارين 6-1.\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 6-3 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: أوجد مساحة سطح مكعب طول حرفه 3 سم.\nالإجابة النموذجية: 54 سم²\nس2 [المستوى المتوقع]: أوجد مساحة سطح أسطوانة نصف قطرها 3 سم وارتفاعها 10 سم (π = 3.14).\nالإجابة النموذجية: 56.52 + 188.4 = 244.92 سم²\nس3 [المستوى المتقدم]: منشور ثلاثي قاعدته مثلث قائم أضلاعه 3، 4، 5 سم وطوله 10 سم. أوجد مساحة سطحه.\nالإجابة النموذجية: 2 × 6 + (3 + 4 + 5) × 10 = 132 سم²", "س1 [مستوى الدعم]: أوجد المساحة الجانبية لأسطوانة نصف قطرها 2 سم وارتفاعها 5 سم.\nالإجابة النموذجية: 62.8 سم²\nس2 [المستوى المتوقع]: أوجد مساحة سطح متوازي مستطيلات أبعاده 2، 3، 4 سم.\nالإجابة النموذجية: 52 سم²\nس3 [المستوى المتقدم]: أيهما يحتاج ورقًا أكثر لتغليفه: مكعب حرفه 4 سم أم أسطوانة نصف قطرها 2 سم وارتفاعها 4 سم؟\nالإجابة النموذجية: المكعب 96 سم²، والأسطوانة 75.36 سم²؛ فالمكعب", "عزيزي الطالب: أكمل كتاب النشاط ص 68–69 وراجع الوحدة السادسة. ولي الأمر الكريم: اطلب من ابنك حساب مساحة الورق اللازم لتغليف علبة هدية."], "html": ["<ol class='ol'><li>يحسب مساحة سطح المنشور بجمع مساحات أوجهه.</li><li>يحسب مساحة سطح الأسطوانة باستخدام شبكتها.</li><li>يربط بين الشبكة ومساحة السطح ويحل مسائل التغليف. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>نماذج مجسمة</span><span>أخرى: آلات حاسبة علمية</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "مساحة السطح، الشبكة، المساحة الجانبية", "يفك المعلم ملصق علبة أسطوانية ليظهر مستطيلًا، ويسأل: ما طول هذا المستطيل؟ التعلم القبلي: الشبكات من الوحدة الثالثة ومحيط الدائرة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يفك الملصق ويطرح السؤال.</td><td>يستنتج أن الطول يساوي محيط الدائرة.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مساحة سطح الأسطوانة <span class=\"m\">2πنق<sup>2</sup> + 2πنقع</span> ومساحة سطح منشور ثلاثي.</td><td>يحسب من الشبكة.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 68–69 والسؤال 5 (د) من تمارين 6-3 مع التذكير بالسؤال 4 من تمارين 6-1.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 6-3 (الحصة 2) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد مساحة سطح مكعب طول حرفه 3 سم.</td><td class='ans'><span class=\"m\">54 سم<sup>2</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد مساحة سطح أسطوانة نصف قطرها 3 سم وارتفاعها 10 سم (<span class=\"m\">π = 3.14</span>).</td><td class='ans'><span class=\"m\">56.52 + 188.4 = 244.92 سم<sup>2</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>منشور ثلاثي قاعدته مثلث قائم أضلاعه 3، 4، 5 سم وطوله 10 سم. أوجد مساحة سطحه.</td><td class='ans'><span class=\"m\">2 × 6 + (3 + 4 + 5) × 10 = 132 سم<sup>2</sup></span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد المساحة الجانبية لأسطوانة نصف قطرها 2 سم وارتفاعها 5 سم.</td><td class='ans'><span class=\"m\">62.8 سم<sup>2</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>أوجد مساحة سطح متوازي مستطيلات أبعاده 2، 3، 4 سم.</td><td class='ans'><span class=\"m\">52 سم<sup>2</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أيهما يحتاج ورقًا أكثر لتغليفه: مكعب حرفه 4 سم أم أسطوانة نصف قطرها 2 سم وارتفاعها 4 سم؟</td><td class='ans'>المكعب <span class=\"m\">96 سم<sup>2</sup></span>، والأسطوانة <span class=\"m\">75.36 سم<sup>2</sup></span>؛ فالمكعب</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 68–69 وراجع الوحدة السادسة. ولي الأمر الكريم: اطلب من ابنك حساب مساحة الورق اللازم لتغليف علبة هدية."]}]}, {"id": "7-1", "title": "احتمال عدم حدوث نتيجة ما", "periods": [{"head": {"lesson": "7-1 احتمال عدم حدوث نتيجة ما", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثاني عشر: 22–26/11/2026م", "pages": "كتاب الطالب ص 116–117 • كتاب النشاط ص 70–71 • دليل المعلم ص 125–126", "num": "الحصة 1 من 4", "topic": "مقياس الاحتمال والتعبير عن الاحتمال"}, "plain": ["1) يصف احتمال حدث بالكلمات وبعدد من 0 إلى 1 على مقياس الاحتمال.\n2) يعبر عن الاحتمال في صورة كسر أو كسر عشري أو نسبة مئوية.\n3) يحكم على قيم احتمال غير ممكنة ويبرر. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم المبني على اللعب، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: خط مقياس الاحتمال على السبورة وبطاقات أحداث", "الاحتمال، مقياس الاحتمال، الحدث المستحيل، الحدث المؤكد، النتيجة", "يوزع المعلم بطاقات أحداث («تشرق الشمس غدًا»، «الحصول على 7 عند رمي حجر نرد»…) ويضعها الطلاب على خط مقياس الاحتمال. التعلم القبلي: مفردات الاحتمال ومقياسه من الصف السابع والتحويل بين الكسور والنسب المئوية.", "1) التهيئة (6 دقائق):\nالمعلم: يدير وضع البطاقات على الخط ويناقش المواقع المختلف عليها.\nالطالب: يضع البطاقة ويبرر موقعها.\n2) النمذجة (9 دقائق):\nالمعلم: يربط الكلمات بالأعداد: مستحيل 0، مؤكد 1، متساوي الفرص 0.5، ويعرض أمثلة ص 116.\nالطالب: يكتب الاحتمالات بثلاث صور.\n3) لعبة (9 دقائق):\nالمعلم: يدير لعبة «احتمال أم مستحيل؟»: يعرض أعدادًا مثل 1.2، −0.3، 45% ويحكم الطلاب.\nالطالب: يحكم ويبرر.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 7-1 ص 117.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: ما احتمال حدث مستحيل؟\nالإجابة النموذجية: 0\nس2 [المستوى المتوقع]: اكتب الاحتمال 3/4 كسرًا عشريًا ونسبة مئوية.\nالإجابة النموذجية: 0.75، 75%\nس3 [المستوى المتقدم]: قال طالب: احتمال نجاحي 1.3. هل هذا ممكن؟ برّر.\nالإجابة النموذجية: لا؛ الاحتمال لا يزيد على 1", "س1 [مستوى الدعم]: ما احتمال حدث مؤكد؟\nالإجابة النموذجية: 1\nس2 [المستوى المتوقع]: ضع الحدث «الحصول على عدد زوجي عند رمي حجر نرد» على مقياس الاحتمال.\nالإجابة النموذجية: عند 0.5\nس3 [المستوى المتقدم]: رتّب الاحتمالات تصاعديًا: 0.4، 3/8، 42%\nالإجابة النموذجية: 3/8 = 0.375، 0.4، 0.42", "عزيزي الطالب: راجع ص 116 واكتب ثلاثة أحداث من حياتك وضعها على مقياس الاحتمال. ولي الأمر الكريم: ناقش مع ابنك أحداثًا يومية مؤكدة ومستحيلة."], "html": ["<ol class='ol'><li>يصف احتمال حدث بالكلمات وبعدد من 0 إلى 1 على مقياس الاحتمال.</li><li>يعبر عن الاحتمال في صورة كسر أو كسر عشري أو نسبة مئوية.</li><li>يحكم على قيم احتمال غير ممكنة ويبرر. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span><span>التعلم بالنمذجة</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: خط مقياس الاحتمال على السبورة وبطاقات أحداث</span></div>", "الاحتمال، مقياس الاحتمال، الحدث المستحيل، الحدث المؤكد، النتيجة", "يوزع المعلم بطاقات أحداث («تشرق الشمس غدًا»، «الحصول على 7 عند رمي حجر نرد»…) ويضعها الطلاب على خط مقياس الاحتمال. التعلم القبلي: مفردات الاحتمال ومقياسه من الصف السابع والتحويل بين الكسور والنسب المئوية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>6<small>د</small></td><td class='ph'>التهيئة</td><td>يدير وضع البطاقات على الخط ويناقش المواقع المختلف عليها.</td><td>يضع البطاقة ويبرر موقعها.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>يربط الكلمات بالأعداد: مستحيل 0، مؤكد 1، متساوي الفرص <span class=\"m\">0.5</span>، ويعرض أمثلة ص 116.</td><td>يكتب الاحتمالات بثلاث صور.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>لعبة</td><td>يدير لعبة «احتمال أم مستحيل؟»: يعرض أعدادًا مثل <span class=\"m\">1.2</span>، <span class=\"m\">−0.3</span>، 45% ويحكم الطلاب.</td><td>يحكم ويبرر.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 7-1 ص 117.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال حدث مستحيل؟</td><td class='ans'>0</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>اكتب الاحتمال <span class=\"m\">3/4</span> كسرًا عشريًا ونسبة مئوية.</td><td class='ans'><span class=\"m\">0.75</span>، 75%</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>قال طالب: احتمال نجاحي <span class=\"m\">1.3</span>. هل هذا ممكن؟ برّر.</td><td class='ans'>لا؛ الاحتمال لا يزيد على 1</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال حدث مؤكد؟</td><td class='ans'>1</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ضع الحدث «الحصول على عدد زوجي عند رمي حجر نرد» على مقياس الاحتمال.</td><td class='ans'>عند <span class=\"m\">0.5</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>رتّب الاحتمالات تصاعديًا: <span class=\"m\">0.4</span>، <span class=\"m\">3/8</span>، 42%</td><td class='ans'><span class=\"m\">3/8 = 0.375</span>، <span class=\"m\">0.4</span>، <span class=\"m\">0.42</span></td></tr></tbody></table>", "عزيزي الطالب: راجع ص 116 واكتب ثلاثة أحداث من حياتك وضعها على مقياس الاحتمال. ولي الأمر الكريم: ناقش مع ابنك أحداثًا يومية مؤكدة ومستحيلة."]}, {"head": {"lesson": "7-1 احتمال عدم حدوث نتيجة ما", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثاني عشر: 22–26/11/2026م", "pages": "كتاب الطالب ص 116–117 • كتاب النشاط ص 70–71 • دليل المعلم ص 125–126", "num": "الحصة 2 من 4", "topic": "احتمال عدم حدوث نتيجة ما"}, "plain": ["1) يستنتج أن احتمال عدم حدوث نتيجة = 1 − احتمال حدوثها.\n2) يحسب احتمال عدم الحدوث من احتمال معطى بصور مختلفة.\n3) يحل مسائل لفظية على احتمال عدم الحدوث. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "احتمال عدم الحدوث، الحدث المكمل، مجموع الاحتمالات", "سؤال: احتمال هطول المطر غدًا 0.3. ما احتمال عدم هطوله؟ التعلم القبلي: مقياس الاحتمال من الحصة السابقة وطرح الكسور من 1.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويستمع للتبريرات.\nالطالب: يجيب 0.7.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج مثال 7-1 ص 116: ح(عدم الحدوث) = 1 − ح(الحدوث) بأمثلة بالكسور والنسب المئوية.\nالطالب: يطبق على أمثلة.\n3) الاكتشاف (10 دقائق):\nالمعلم: يطلب من المجموعات سحب بطاقة من 10 بطاقات مرقمة، وحساب احتمال الرقم 3 واحتمال «ليس 3»، ثم جمعهما.\nالطالب: يلاحظ أن المجموع 1 دائمًا.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالسؤالين 2 و3 من تمارين 7-1.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: احتمال هطول المطر 0.3. ما احتمال عدم هطوله؟\nالإجابة النموذجية: 0.7\nس2 [المستوى المتوقع]: احتمال فوز فريق 2/5. ما احتمال عدم فوزه؟\nالإجابة النموذجية: 3/5\nس3 [المستوى المتقدم]: احتمال تأخر الحافلة 15%. ما احتمال وصولها في موعدها؟ وفي 40 رحلة، كم رحلة تتوقع أن تصل في موعدها؟\nالإجابة النموذجية: 85%؛ 0.85 × 40 = 34 رحلة", "س1 [مستوى الدعم]: احتمال حدث 0.45. ما احتمال عدم حدوثه؟\nالإجابة النموذجية: 0.55\nس2 [المستوى المتوقع]: احتمال سحب كرة حمراء 3/8. ما احتمال سحب كرة ليست حمراء؟\nالإجابة النموذجية: 5/8\nس3 [المستوى المتقدم]: احتمال عدم إصابة الهدف 0.12. ما احتمال الإصابة؟ عبّر عنه نسبة مئوية.\nالإجابة النموذجية: 0.88 أي 88%", "عزيزي الطالب: أكمل السؤالين 2 و3 من تمارين 7-1. ولي الأمر الكريم: اسأل ابنك عن احتمال عدم هطول المطر في نشرة الطقس."], "html": ["<ol class='ol'><li>يستنتج أن احتمال عدم حدوث نتيجة = 1 − احتمال حدوثها.</li><li>يحسب احتمال عدم الحدوث من احتمال معطى بصور مختلفة.</li><li>يحل مسائل لفظية على احتمال عدم الحدوث. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "احتمال عدم الحدوث، الحدث المكمل، مجموع الاحتمالات", "سؤال: احتمال هطول المطر غدًا <span class=\"m\">0.3</span>. ما احتمال عدم هطوله؟ التعلم القبلي: مقياس الاحتمال من الحصة السابقة وطرح الكسور من 1.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال ويستمع للتبريرات.</td><td>يجيب <span class=\"m\">0.7</span>.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال 7-1 ص 116: <span class=\"m\">ح(عدم الحدوث) = 1 − ح(الحدوث)</span> بأمثلة بالكسور والنسب ا نشاط ص 70–71، واقرأ ص 118. ولي الأمر الكريم: تابع ابنك في صفحات النشاط."], "html": ["<ol class='ol'><li>يحل تمارين كتاب النشاط على احتمال عدم الحدوث ومجموع الاحتمالات.</li><li>يستخدم الاحتمال لتقدير العدد المتوقع لنتيجة في عدد محاولات.</li><li>يكوّن تجربة احتمالية بشروط معطاة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم الذاتي</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "احتمال عدم الحدوث، العدد المتوقع، التجربة", "تحدٍ: صمم كيسًا من 10 كرات بحيث يكون احتمال «ليس أحمر» <span class=\"m\">0.7</span>. التعلم القبلي: احتمال عدم الحدوث ومجموع الاحتمالات.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح التحدي.</td><td>يضع 3 كرات حمراء و7 بألوان أخرى.</td></tr><tr><td class='tm'>15<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 70–71.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>العدد المتوقع</td><td>ينمذج: احتمال <span class=\"m\">0.15</span> في 200 محاولة ⟵ 30 مرة متوقعة.</td><td>يحل مثالًا مشابهًا.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 7-1 (الحصة 4) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.</td><td>يتنافس ضمن مجموعته ويجيب في الزمن المحدد.</td></tr><tr><td class='tm'>5<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احتمال حدث <span class=\"m\">7/10</span>. ما احتمال عدم حدوثه؟</td><td class='ans'><span class=\"m\">3/10</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احتمال إصابة لاعب للهدف <span class=\"m\">0.6</span>. في 50 رمية، كم مرة تتوقع ألا يصيب؟</td><td class='ans'><span class=\"m\">0.4 × 50 = 20</span> مرة</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>صمم كيسًا من 20 كرة يكون فيه احتمال «ليس أزرق» <span class=\"m\">0.65</span>.</td><td class='ans'>7 كرات زرقاء و13 بألوان أخرى</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احتمال حدث 35%. ما احتمال عدم حدوثه؟</td><td class='ans'>65%</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احتمال تعطل جهاز في يوم <span class=\"m\">0.02</span>. ما احتمال عدم تعطله؟</td><td class='ans'><span class=\"m\">0.98</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>في 300 رمية لحجر نرد، كم مرة تتوقع ألا يظهر العدد 6؟</td><td class='ans'><span class=\"m\">(5/6) × 300 = 250</span> مرة</td></tr></tbody></table>", "عزيزي الطالب: أكمل كتاب النشاط ص 70–71، واقرأ ص 118. ولي الأمر الكريم: تابع ابنك في صفحات النشاط."]}]}, {"id": "7-2", "title": "نتائج الاحتمالات المرجحة بالتساوي", "periods": [{"head": {"lesson": "7-2 نتائج الاحتمالات المرجحة بالتساوي", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثاني عشر: 22–26/11/2026م", "pages": "كتاب الطالب ص 118–120 • كتاب النشاط ص 72–73 • دليل المعلم ص 127–128", "num": "الحصة 1 من 3", "topic": "النتائج المرجحة بالتساوي وحساب الاحتمال"}, "plain": ["1) يحدد ما إذا كانت نتائج تجربة مرجحة بالتساوي.\n2) يحسب الاحتمال = عدد النتائج المرغوبة ÷ عدد النتائج الكلي.\n3) يبرر متى لا تصلح هذه الصيغة. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: حجر نرد وعملات وبطاقات مرقمة", "النتائج المرجحة بالتساوي، النتيجة المرغوبة، الاحتمال النظري", "يرمي المعلم حجر نرد ويسأل: هل لكل وجه الفرصة نفسها؟ وماذا لو كان الحجر مثقلًا؟ التعلم القبلي: مقياس الاحتمال ومجموع الاحتمالات.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤالين.\nالطالب: يميز بين الحجر المنتظم والمثقل.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج حساب الاحتمال بأمثلة ص 118: حجر نرد، بطاقات من 1 إلى 20.\nالطالب: يحسب الاحتمالات.\n3) النشاط 1 (10 دقائق):\nالمعلم: ينفذ النشاط 1 في الدليل باستخدام بطاقات الأعداد.\nالطالب: يحسب الاحتمالات في مجموعات.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 7-2 ص 119.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: ما احتمال ظهور العدد 4 عند رمي حجر نرد؟\nالإجابة النموذجية: 1/6\nس2 [المستوى المتوقع]: سُحبت بطاقة عشوائيًا من بطاقات مرقمة من 1 إلى 20. ما احتمال أن يكون العدد من مضاعفات 3؟\nالإجابة النموذجية: 6/20 = 3/10\nس3 [المستوى المتقدم]: لماذا لا يكون احتمال فوز فريق في مباراة 1/3 لأن النتائج «فوز، تعادل، خسارة»؟\nالإجابة النموذجية: لأن النتائج الثلاث ليست مرجحة بالتساوي", "س1 [مستوى الدعم]: ما احتمال ظهور كتابة عند رمي عملة؟\nالإجابة النموذجية: 1/2\nس2 [المستوى المتوقع]: ما احتمال ظهور عدد أولي عند رمي حجر نرد؟\nالإجابة النموذجية: 3/6 = 1/2 (2، 3، 5)\nس3 [المستوى المتقدم]: في كيس 5 كرات حمراء و3 زرقاء و2 خضراء. ما احتمال سحب كرة ليست حمراء؟\nالإجابة النموذجية: 5/10 = 1/2", "عزيزي الطالب: راجع أمثلة ص 118 وأكمل الأسئلة الأولى من تمارين 7-2. ولي الأمر الكريم: العب مع ابنك بحجر نرد واسأله عن احتمالات الأعداد."], "html": ["<ol class='ol'><li>يحدد ما إذا كانت نتائج تجربة مرجحة بالتساوي.</li><li>يحسب الاحتمال = عدد النتائج المرغوبة ÷ عدد النتائج الكلي.</li><li>يبرر متى لا تصلح هذه الصيغة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: حجر نرد وعملات وبطاقات مرقمة</span></div>", "النتائج المرجحة بالتساوي، النتيجة المرغوبة، الاحتمال النظري", "يرمي المعلم حجر نرد ويسأل: هل لكل وجه الفرصة نفسها؟ وماذا لو كان الحجر مثقلًا؟ التعلم القبلي: مقياس الاحتمال ومجموع الاحتمالات.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤالين.</td><td>يميز بين الحجر المنتظم والمثقل.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج حساب الاحتمال بأمثلة ص 118: حجر نرد، بطاقات من 1 إلى 20.</td><td>يحسب الاحتمالات.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النشاط 1</td><td>ينفذ النشاط 1 في الدليل باستخدام بطاقات الأعداد.</td><td>يحسب الاحتمالات في مجموعات.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالأسئلة الأولى من تمارين 7-2 ص 119.</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال ظهور العدد 4 عند رمي حجر نرد؟</td><td class='ans'><span class=\"m\">1/6</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>سُحبت بطاقة عشوائيًا من بطاقات مرقمة من 1 إلى 20. ما احتمال أن يكون العدد من مضاعفات 3؟</td><td class='ans'><span class=\"m\">6/20 = 3/10</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>لماذا لا يكون احتمال فوز فريق في مباراة <span class=\"m\">1/3</span> لأن النتائج «فوز، تعادل، خسارة»؟</td><td class='ans'>لأن النتائج الثلاث ليست مرجحة بالتساوي</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال ظهور كتابة عند رمي عملة؟</td><td class='ans'><span class=\"m\">1/2</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ما احتمال ظهور عدد أولي عند رمي حجر نرد؟</td><td class='ans'><span class=\"m\">3/6 = 1/2</span> (2، 3، 5)</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>في كيس 5 كرات حمراء و3 زرقاء و2 خضراء. ما احتمال سحب كرة ليست حمراء؟</td><td class='ans'><span class=\"m\">5/10 = 1/2</span></td></tr></tbody></table>", "عزيزي الطالب: راجع أمثلة ص 118 وأكمل الأسئلة الأولى من تمارين 7-2. ولي الأمر الكريم: العب مع ابنك بحجر نرد واسأله عن احتمالات الأعداد."]}, {"head": {"lesson": "7-2 نتائج الاحتمالات المرجحة بالتساوي", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثاني عشر: 22–26/11/2026م", "pages": "كتاب الطالب ص 118–120 • كتاب النشاط ص 72–73 • دليل المعلم ص 127–128", "num": "الحصة 2 من 3", "topic": "الاحتمال باستخدام مربع الأعداد والبطاقات"}, "plain": ["1) يحسب احتمالات أحداث مركبة الوصف (مثل عدد زوجي ومن مضاعفات 5) على مجموعة أعداد.\n2) يستخدم مربع أعداد 10 × 10 لعدّ النتائج المرغوبة.\n3) يقارن بين احتمالات أحداث مختلفة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: مربع الأعداد من 1 إلى 100", "مربع الأعداد، النتائج المرغوبة، المضاعفات، الأعداد الأولية", "يعرض المعلم مربع الأعداد من 1 إلى 100 ويسأل: إذا اخترنا عددًا عشوائيًا، فما احتمال أن يكون مربعًا كاملًا؟ التعلم القبلي: حساب الاحتمال للنتائج المرجحة بالتساوي، والمربعات الكاملة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال.\nالطالب: يعد 10 مربعات كاملة ويجيب 1/10.\n2) النشاط 2 (10 دقائق):\nالمعلم: ينفذ النشاط 2 في الدليل باستخدام مربع الأعداد (السؤال 8 من تمارين 7-2).\nالطالب: يلون النتائج المرغوبة ويحسب.\n3) تعلم تعاوني (9 دقائق):\nالمعلم: يوزع أحداثًا مختلفة على المجموعات (زوجي، مضاعف 7، يحتوي الرقم 5…).\nالطالب: تحسب كل مجموعة احتمالها وتقارنه بغيرها.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالسؤالين 9 و10 من تمارين 7-2 (الأخير يتطلب تفسيرًا منطقيًا).\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: ما احتمال اختيار مربع كامل من 1 إلى 100؟\nالإجابة النموذجية: 10/100 = 1/10\nس2 [المستوى المتوقع]: ما احتمال اختيار عدد من مضاعفات 7 من 1 إلى 100؟\nالإجابة النموذجية: 14/100 = 7/50\nس3 [المستوى المتقدم]: ما احتمال اختيار عدد زوجي ومن مضاعفات 5 معًا من 1 إلى 100؟\nالإجابة النموذجية: 10/100 = 1/10 (مضاعفات 10)", "س1 [مستوى الدعم]: ما احتمال اختيار عدد أقل من 30 من 1 إلى 100؟\nالإجابة النموذجية: 29/100\nس2 [المستوى المتوقع]: ما احتمال اختيار عدد يحتوي الرقم 9 من 1 إلى 100؟\nالإجابة النموذجية: 19/100\nس3 [المستوى المتقدم]: أيهما أرجح عند اختيار عدد من 1 إلى 100: مضاعف 6 أم مضاعف 7؟\nالإجابة النموذجية: مضاعف 6 أرجح؛ لأن عدد مضاعفات 6 هو 16 (16/100) مقابل 14 لمضاعفات 7 (14/100)", "عزيزي الطالب: أكمل السؤالين 9 و10 من تمارين 7-2. ولي الأمر الكريم: اطرح على ابنك سؤالًا عن احتمال اختيار رقم هاتف ينتهي بالرقم 0."], "html": ["<ol class='ol'><li>يحسب احتمالات أحداث مركبة الوصف (مثل عدد زوجي ومن مضاعفات 5) على مجموعة أعداد.</li><li>يستخدم مربع أعداد <span class=\"m\">10 × 10</span> لعدّ النتائج المرغوبة.</li><li>يقارن بين احتمالات أحداث مختلفة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: مربع الأعداد من 1 إلى 100</span></div>", "مربع الأعداد، النتائج المرغوبة، المضاعفات، الأعداد الأولية", "يعرض المعلم مربع الأعداد من 1 إلى 100 ويسأل: إذا اخترنا عددًا عشوائيًا، فما احتمال أن يكون مربعًا كاملًا؟ التعلم القبلي: حساب الاحتمال للنتائج المرجحة بالتساوي، والمربعات الكاملة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح السؤال.</td><td>يعد 10 مربعات كاملة ويجيب <span class=\"m\">1/10</span>.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>النشاط 2</td><td>ينفذ النشاط 2 في الدليل باستخدام مربع الأعداد (السؤال 8 من تمارين 7-2).</td><td>يلون النتائج المرغوبة ويحسب.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>تعلم تعاوني</td><td>يوزع أحداثًا مختلفة على المجموعات (زوجي، مضاعف 7، يحتوي الرقم 5…).</td><td>تحسب كل مجموعة احتمالها وتقارنه بغيرها.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بالسؤالين 9 و10 من تمارين 7-2 (الأخير يتطلب تفسيرًا منطقيًا).</td><td>يحل فرديًا.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.</td><td>يجيب عن أسئلة التقويم الختامي كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال اختيار مربع كامل من 1 إلى 100؟</td><td class='ans'><span class=\"m\">10/100 = 1/10</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ما احتمال اختيار عدد من مضاعفات 7 من 1 إلى 100؟</td><td class='ans'><span class=\"m\">14/100 = 7/50</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>ما احتمال اختيار عدد زوجي ومن مضاعفات 5 معًا من 1 إلى 100؟</td><td class='ans'><span class=\"m\">10/100 = 1/10</span> (مضاعفات 10)</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما احتمال اختيار عدد أقل من 30 من 1 إلى 100؟</td><td class='ans'><span class=\"m\">29/100</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>ما احتمال اختيار عدد يحتوي الرقم 9 من 1 إلى 100؟</td><td class='ans'><span class=\"m\">19/100</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أيهما أرجح عند اختيار عدد من 1 إلى 100: مضاعف 6 أم مضاعف 7؟</td><td class='ans'>مضاعف 6 أرجح؛ لأن عدد مضاعفات 6 هو 16 (<span class=\"m\">16/100</span>) مقابل 14 لمضاعفات 7 (<span class=\"m\">14/100</span>)</td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤالين 9 و10 من تمارين 7-2. ولي الأمر الكريم: اطرح على ابنك سؤالًا عن احتمال اختيار رقم هاتف ينتهي بالرقم 0."]}, {"head": {"lesson": "7-2 نتائج الاحتمالات المرجحة بالتساوي", "unit": "الوحدة السابعة: الاحتمالات", "week": "الأسبوع الثاني عشر: 22–26/11/2026م", "pages": "كتاب الطالب ص 118–120 • كتاب النشاط ص 72–73 • دليل المعلم ص 127–128", "num": "الحصة 3 من 3", "topic": "مسائل على الاحتمالات المرجحة بالتساوي"}, "plain": ["1) يحل مسائل كتاب النشاط على الاحتمال النظري.\n2) يحدد تكوين كيس يحقق احتمالًا معطى.\n3) يمهد لفكرة فضاء الإمكانات بحالة رمي عملتين. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: فهم", "التعلم المبني على حل المشكلات، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الاحتمال النظري، النتائج المرجحة بالتساوي", "سؤال تمهيدي من السؤال 9 في الدليل: عند رمي عملتين، هل احتمالات «صورتين، كتابتين، واحدة من كل منهما» متساوية؟ التعلم القبلي: حساب الاحتمال للنتائج المرجحة بالتساوي.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح السؤال ويستمع للتوقعات.\nالطالب: يتوقع ثم يناقش.\n2) تجربة سريعة (8 دقائق):\nالمعلم: ينفذ تجربة رمي عملتين 20 مرة في كل مجموعة ويجمع النتائج.\nالطالب: يسجل ويلاحظ أن «واحدة من كل منهما» أكثر تكرارًا.\n3) كتاب النشاط (14 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 72–73.\nالطالب: يحل فرديًا.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 7-2 (الحصة 3) ويناقش السؤال الذي أخطأت فيه أكثر المجموعات.\nالطالب: يتنافس ضمن مجموعته ويجيب في الزمن المحدد.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: كيس فيه 4 كرات حمراء و6 بيضاء. ما احتمال سحب كرة حمراء؟\nالإجابة النموذجية: 4/10 = 2/5\nس2 [المستوى المتوقع]: كم كرة حمراء يجب إضافتها إلى كيس فيه 3 حمراء و5 بيضاء ليصبح احتمال الأحمر 1/2؟\nالإجابة النموذجية: كرتان\nس3 [المستوى المتقدم]: عند رمي عملتين، لماذا احتمال «واحدة من كل منهما» 1/2 لا 1/3؟\nالإجابة النموذجية: لأن النتائج المرجحة بالتساوي أربع: صص، صك، كص، كك؛ واثنتان منها مختلطتان", "س1 [مستوى الدعم]: ما احتمال سحب حرف «م» من حروف كلمة «مدرسة»؟\nالإجابة النموذجية: 1/5\nس2 [المستوى المتوقع]: ما احتمال سحب بطاقة عددها فردي من بطاقات 1–15؟\nالإجابة النموذجية: 8/15\nس3 [المستوى المتقدم]: كيس فيه كرات حمراء وزرقاء، احتمال الحمراء 3/7 وعدد الزرقاء 12. كم كرة حمراء؟\nالإجابة النموذجية: 9", "عزيزي الطالب: أكمل كتاب النشاط ص 72–73، واقرأ ص 121. ولي الأمر الكريم: نفذ مع ابنك تجربة رمي عملتين وسجّلا النتائج."], "html": ["<ol class='ol'><li>يحل مسائل كتاب النشاط على الاحتمال النظري.</li><li>يحدد تكوين كيس يحقق احتمالًا معطى.</li><li>يمهد لفكرة فضاء الإمكانات بحالة رمي عملتين. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر:</b> فهم</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم الذاتي</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "الاحتمال النظري، النتائج المرجحة بالتساوي", "سؤال تمهيدي من السؤال 9 في الدليل: عند رمي عملتين، هل احتمالات «صورتين، ك ة 6 نتائج وتحسب احتمالات.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بالأسئلة الأولى من تمارين 7-3 ص 122.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويلخص فكرة الحصة مع الطلاب.\nالطالب: يجيب عن أسئلة التقويم الختامي كتابيًا.", "س1 [مستوى الدعم]: كم نتيجة ممكنة عند رمي عملتين؟\nالإجابة النموذجية: 4\nس2 [المستوى المتوقع]: رُميت عملة وحجر نرد. ما احتمال ظهور صورة وعدد زوجي؟\nالإجابة النموذجية: 3/12 = 1/4\nس3 [المستوى المتقدم]: لماذا يجب كتابة «صك» و«كص» نتيجتين منفصلتين؟\nالإجابة النموذجية: لأنهما نتيجتان مختلفتان مرجحتان بالتساوي؛ عدّهما نتيجة واحدة يخطئ الاحتمال", "س1 [مستوى الدعم]: اكتب كل النتائج الممكنة لرمي عملة مرتين.\nالإجابة النموذجية: صص، صك، كص، كك\nس2 [المستوى المتوقع]: ما احتمال الحصول على صورتين عند رمي عملتين؟\nالإجابة النموذجية: 1/4\nس3 [المستوى المتقدم]: رُميت ثلاث عملات. كم نتيجة ممكنة؟ وما احتمال ثلاث صور؟\nالإجابة النموذجية: 8 نتائج؛ 1/8", "عزيزي الطالب: اكتب قائمة منظمة لاختياراتك من ملابس (قميصان وبنطالان) واحسب عدد التشكيلات. ولي الأمر الكريم: ناقش مع ابنك عدد الخيارات في قائمة مطعم."], "html": ["<ol class='ol'><li>يكتب قائمة منظمة بجميع النتائج الممكنة لحدثين (فضاء الإمكانات).</li><li>يحسب احتمالات أحداث من القائمة المنظمة.</li><li>يتحقق من اكتمال القائمة وعدم تكرار النتائج. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: عملات معدنية</span></div>", "فضاء الإمكانات، القائمة المنظمة، النتائج المرجحة بالتساوي", "يعيد المعلم سؤال العملتين من الحصة السابقة ويطلب كتابة كل النتائج الممكنة بطريقة منظمة. التعلم القبلي: النتائج المرجحة بالتساوي وحساب الاحتمال.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><t
