*{box-sizing:border-box}
body{margin:0;font-family:Taj,system-ui,sans-serif;color:#25324d;background:#f7f9fd;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;color:#2f4f93;margin:4px 0 12px}
.mode{background:#fff;border:1px solid #d9e3f2;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.toggle{display:inline-flex;background:#eef3fb;border-radius:14px;padding:4px;gap:4px}
.toggle button{font-family:inherit;border:none;background:transparent;border-radius:11px;padding:9px 18px;font-size:16px;color:#4a5f86;cursor:pointer}
.toggle button.on{background:#fff;color:#2f4f93;font-weight:700;box-shadow:0 1px 0 #d9e3f2}
.explain{margin:10px 0 4px;font-size:14.5px;color:#5a6c8c}
.explain p{margin:2px 0}
.now{margin-top:8px;font-weight:700;color:#2f7f66;background:#e8f6ef;border:1px solid #c5e7d8;border-radius:12px;padding:7px 12px;font-size:15px}
.pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
select{font-family:inherit;font-size:16px;border:1px solid #d9e3f2;border-radius:12px;padding:9px 12px;background:#fff;color:#25324d;flex:1;min-width:240px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{font-family:inherit;border:1px solid #d9e3f2;background:#fff;border-radius:999px;padding:7px 14px;font-size:14.5px;cursor:pointer;color:#4a5f86}
.tabs button.on{background:#e4edfa;border-color:#b5cbee;color:#2f4f93;font-weight:700}
.hd{background:#f3f7fd;border:1px solid #c9d8ee;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14.5px}
.hd .t{font-weight:700;font-size:18px;color:#2f4f93}
.hd b{color:#5a6c8c;font-weight:500}
.card{background:#fff;border:1px solid #dde6f3;border-radius:14px;margin-bottom:10px;overflow:hidden}
.card h3{margin:0;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:#3a5a9e;background:#f1f5fc;padding:8px 12px;border-bottom:1px solid #dde6f3}
.card.g h3{background:#eef8f3;color:#2f7f66}.card.y h3{background:#fdf6e6;color:#9a6a12}.card.v h3{background:#f3f0fb;color:#5f51a8}
.card h3 i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #c9d8ee;font-size:13px;margin-left:8px}
.copy{font-family:inherit;border:1px solid #b9cdeb;background:#fff;color:#2f4f93;border-radius:10px;padding:5px 16px;font-size:15px;cursor:pointer;min-width:96px;transition:.2s}
.copy.done{background:#e3f4ec;border-color:#9bd3bb;color:#1f6b53}
.copy:focus-visible,.toggle button:focus-visible,.tabs button:focus-visible{outline:3px solid #9fbdf0;outline-offset:2px}
.body{padding:10px 14px;font-size:15.5px}
.body .sub{font-weight:700;color:#2f7f66;margin:8px 0 4px;padding-top:6px;border-top:1px dashed #dde6f3}
.body .sub:first-child{border-top:none;margin-top:0;padding-top:0}
.ol{margin:0;padding-right:18px}
.tag{font-size:12px;background:#f3f0fb;color:#5f51a8;border-radius:10px;padding:0 8px}
.lv span{display:inline-block;margin-left:16px}
.chips span{display:inline-block;border:1px solid #c9d8ee;background:#f6f9fe;border-radius:12px;padding:0 9px;margin:2px 0 2px 5px;font-size:14.5px}
.chips.r span{background:#f4fbf7;border-color:#cbe8db}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{background:#f4f7fc;color:#4a5f86;font-weight:500;border:1px solid #dde6f3;padding:4px}
td{border:1px solid #e3eaf4;padding:5px 7px;vertical-align:top}
td.tm{text-align:center;font-weight:700;color:#2f7f66;background:#f4fbf7;width:46px}
td.ph{font-weight:500;color:#2f4f93;background:#f8fafe;width:90px}
td.lvq{width:90px;text-align:center;font-size:13px}
td.l0{background:#eef8f3;color:#2f7f66}td.l1{background:#eef3fc;color:#3a5a9e}td.l2{background:#f3f0fb;color:#5f51a8}
td.ans{background:#fffdf7}
tfoot td{border:none;color:#7b88a0;font-size:12.5px;text-align:left}
.selhint{display:none;margin:0 14px 10px;font-size:13px;color:#9a6a12}
.selhint.on{display:block}
.m{white-space:nowrap}
.raw{white-space:pre-wrap;user-select:all;background:#fffdf5;border:1px dashed #ecd9a8;border-radius:10px;padding:8px;margin:0 14px 10px;font-size:14px;display:none}
.raw.on{display:block}
@media (max-width:600px){td.ph{width:auto}.toggle button{padding:8px 12px;font-size:15px}}
</style>
</head>

<h1>نسخ حقول التحضير إلى منصة نور • رياضيات الصف الثامن، الفصل الأول</h1>

 <div class="toggle" role="tablist"><button id="mSep" class="on" role="tab">تحضير منفصل</button><button id="mMer" role="tab">تحضير مدمج</button></div>
 <div class="explain"><p><b>المنفصل:</b> نموذج نور مستقل لكل حصة، وتنسخ حقول الحصة التي تعبّئها فقط.</p>
 <p><b>المدمج:</b> نموذج نور واحد للدرس كله، وكل حقل يضم حصص الدرس تحت عناوين «الحصة 1، الحصة 2…».</p></div>

<script>
const D=[{"id": "1-1", "title": "الأعداد الموجهة", "periods": [{"head": {"lesson": "1-1 الأعداد الموجهة", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الأول: 6–10/9/2026م", "pages": "كتاب الطالب ص 16–19 • كتاب النشاط ص 13–14 • دليل المعلم ص 21–22", "num": "الحصة 1 من 4", "topic": "جمع الأعداد الموجهة وطرحها باستخدام المعكوس الجمعي"}, "plain": ["1) يجمع الأعداد الموجهة الصحيحة والعشرية ويطرحها بدقة.\n2) يفسّر تحويل طرح عدد سالب إلى جمع معكوسه الجمعي باستخدام خط الأعداد.\n3) يحكم على معقولية ناتج الجمع أو الطرح من موقع العددين على خط الأعداد. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تقييم", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: خط أعداد مرسوم على أرضية الصف وبطاقات أعداد موجهة", "العدد الموجه، العدد الصحيح، المعكوس الجمعي، خط الأعداد", "يعرض المعلم صورة مقياس حرارة يقرأ −3 درجات ثم يسأل: كم تصبح الحرارة إذا ارتفعت 5 درجات؟ وإذا انخفضت 5 درجات؟ يستدعي التعلم القبلي: ترتيب الأعداد الصحيحة على خط الأعداد وجمعها وطرحها، ويربط ذلك بصفحة استهلال الوحدة ص 15 (جدولا الجمع والضرب).", "1) التهيئة (5 دقائق):\nالمعلم: يعرض سؤال مقياس الحرارة ويوجّه الطلاب إلى تمثيل التغير على خط الأعداد المرسوم على الأرض.\nالطالب: يمثل طالبان الحركة بالخطوات على خط الأرضية ويجيب الباقون شفهيًا.\n2) الاكتشاف (10 دقائق):\nالمعلم: ينفذ النشاط 1 من الدليل: يكتب 3 + 5 ثم يغيّر أحد العددين أو كليهما إلى سالب −3 + 5، 3 + (−5)، −3 + (−5) ويطلب تبرير كل ناتج بخط الأعداد أو بتمديد جدول الجمع.\nالطالب: يحسب في أزواج ويبرر، ثم يكتب كل عملية جمع في صورة عمليتي طرح مثل 3 + 5 = 8 ⟵ 8 − 5 = 3 و8 − 3 = 5.\n3) النمذجة (8 دقائق):\nالمعلم: ينمذج ملاحظات ص 16 ومثال 1-1 (أ، ب) ص 17: طرح عدد سالب يساوي جمع معكوسه الجمعي، ويطبقها على الأعداد العشرية مثل 2.7 − (−1.5) = 4.2.\nالطالب: يدوّن القاعدة بأسلوبه ويتنبأ بإشارة الناتج قبل الحساب.\n4) الممارسة الموجهة (10 دقائق):\nالمعلم: يكلف بجزئيات مختارة من الأسئلة 1–4 تمارين 1-1 ص 17 موزعة بحسب المستويات، ويتابع الخطأ الشائع: تطبيق «قاعدة الإشارات» الخاصة بالضرب على الجمع.\nالطالب: يحل فرديًا ثم يقارن حله مع زميله ويصحح بخط الأعداد.\n5) الغلق (7 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي على بطاقات خروج ويلخص الفكرة الرئيسة مع الطلاب.\nالطالب: يجيب على البطاقة ويذكر طريقة تحقق واحدة من الناتج.", "س1 [مستوى الدعم]: احسب: −7 + 4\nالإجابة النموذجية: −3\nس2 [المستوى المتوقع]: احسب: −2.5 − (−4.1)\nالإجابة النموذجية: −2.5 + 4.1 = 1.6\nس3 [المستوى المتقدم]: قال سالم: −6 − (−6) = −12. هل هو محق؟ برّر.\nالإجابة النموذجية: غير محق؛ طرح −6 يساوي جمع 6، فالناتج −6 + 6 = 0.", "س1 [مستوى الدعم]: احسب: 5 − 9\nالإجابة النموذجية: −4\nس2 [المستوى المتوقع]: احسب: 3.2 + (−7.5)\nالإجابة النموذجية: −4.3\nس3 [المستوى المتقدم]: أوجد العدد المفقود: □ − (−2.4) = 1.1\nالإجابة النموذجية: −1.3 لأن −1.3 + 2.4 = 1.1", "عزيزي الطالب: راجع ملاحظات ص 16 ومثال 1-1 ص 17 من كتاب الطالب، وأكمل الجزئيات المتبقية من السؤالين 3 و4 ص 17. ولي الأمر الكريم: ناقش مع ابنك أمثلة حياتية على الأعداد السالبة مثل درجات الحرارة تحت الصفر."], "html": ["<ol class='ol'><li>يجمع الأعداد الموجهة الصحيحة والعشرية ويطرحها بدقة.</li><li>يفسّر تحويل طرح عدد سالب إلى جمع معكوسه الجمعي باستخدام خط الأعداد.</li><li>يحكم على معقولية ناتج الجمع أو الطرح من موقع العددين على خط الأعداد. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التعاوني</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: خط أعداد مرسوم على أرضية الصف وبطاقات أعداد موجهة</span></div>", "العدد الموجه، العدد الصحيح، المعكوس الجمعي، خط الأعداد", "يعرض المعلم صورة مقياس حرارة يقرأ <span class=\"m\">−3</span> درجات ثم يسأل: كم تصبح الحرارة إذا ارتفعت 5 درجات؟ وإذا انخفضت 5 درجات؟ يستدعي التعلم القبلي: ترتيب الأعداد الصحيحة على خط الأعداد وجمعها وطرحها، ويربط ذلك بصفحة استهلال الوحدة ص 15 (جدولا الجمع والضرب).", "<table class='steps'><thead><tr><th>ال ss='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">−2.5 − (−4.1)</span></td><td class='ans'><span class=\"m\">−2.5 + 4.1 = 1.6</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>قال سالم: <span class=\"m\">−6 − (−6) = −12</span>. هل هو محق؟ برّر.</td><td class='ans'>غير محق؛ طرح <span class=\"m\">−6</span> يساوي جمع 6، فالناتج <span class=\"m\">−6 + 6 = 0</span>.</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">5 − 9</span></td><td class='ans'><span class=\"m\">−4</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">3.2 + (−7.5)</span></td><td class='ans'><span class=\"m\">−4.3</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أوجد العدد المفقود: <span class=\"m\">□ − (−2.4) = 1.1</span></td><td class='ans'><span class=\"m\">−1.3</span> لأن <span class=\"m\">−1.3 + 2.4 = 1.1</span></td></tr></tbody></table>", "عزيزي الطالب: راجع ملاحظات ص 16 ومثال 1-1 ص 17 من كتاب الطالب، وأكمل الجزئيات المتبقية من السؤالين 3 و4 ص 17. ولي الأمر الكريم: ناقش مع ابنك أمثلة حياتية على الأعداد السالبة مثل درجات الحرارة تحت الصفر."]}, {"head": {"lesson": "1-1 الأعداد الموجهة", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الأول: 6–10/9/2026م", "pages": "كتاب الطالب ص 16–19 • كتاب النشاط ص 13–14 • دليل المعلم ص 21–22", "num": "الحصة 2 من 4", "topic": "تطبيقات على الجمع والطرح: الأعداد المفقودة وجدول الجمع والوسط الحسابي"}, "plain": ["1) يوجد العدد المفقود في عمليات جمع وطرح الأعداد الموجهة.\n2) يحسب الوسط الحسابي لمجموعة أعداد موجهة.\n3) يحلل جدول جمع للأعداد الموجهة لإكمال الخانات الناقصة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم المبني على اللعب، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة التقليدية، الأقلام، أخرى: بطاقات «سلّم الحرارة» للعب الجماعي", "العدد المفقود، الوسط الحسابي، جدول الجمع، المعكوس الجمعي", "لعبة «سلّم الحرارة»: يبدأ كل صف عند −2 ويسحب بطاقة (+3، −4.5، −(−1)…) ويحدد موقعه الجديد شفهيًا. التعلم القبلي: قاعدة طرح العدد السالب من الحصة السابقة، وطريقة حساب الوسط الحسابي (مجموع القيم ÷ عددها).", "1) التهيئة (6 دقائق):\nالمعلم: يدير لعبة سلّم الحرارة ثلاث جولات سريعة ويصحح فورًا.\nالطالب: يسحب البطاقة ويحسب الموقع الجديد ويعلنه.\n2) الأعداد المفقودة (9 دقائق):\nالمعلم: يعرض □ + 3 = −2 و4.5 − □ = 7 ويوضح استخدام العملية العكسية للتوصل إلى العدد المفقود، ثم يوجّه إلى السؤالين 6 و7 ص 18.\nالطالب: يحل في أزواج ويتحقق بالتعويض في العملية الأصلية.\n3) جدول الجمع (10 دقائق):\nالمعلم: يرسم جدول جمع فارغ (السؤال 8 ص 18) ويطلب إكمال خاناته بالتعاون مع إظهار نمط تزايد الأعداد وتناقصها في الصفوف والأعمدة.\nالطالب: يعمل في مجموعات رباعية: كل عضو يكمل صفًا، ثم يراجع الأعضاء خانات بعضهم.\n4) الوسط الحسابي (8 دقائق):\nالمعلم: يناقش السؤال 5 ص 17 (متوسط درجات الحرارة لعدة أيام) ويذكّر بأن مجموع القيم قد يكون سالبًا.\nالطالب: يحسب المجموع ثم يقسم على عدد الأيام، ويفسر معنى الوسط السالب.\n5) الغلق (7 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويناقش طريقة التحقق بالعملية العكسية.\nالطالب: يجيب كتابيًا ويشرح حلًا واحدًا للصف.", "س1 [مستوى الدعم]: أوجد العدد المفقود: □ + 3 = −2\nالإجابة النموذجية: −5\nس2 [المستوى المتوقع]: احسب الوسط الحسابي للأعداد: −4، 2، −1، −5\nالإجابة النموذجية: المجموع −8، والوسط −8 ÷ 4 = −2\nس3 [المستوى المتقدم]: عددان مجموعهما −3 والفرق بينهما 7. ما العددان؟\nالإجابة النموذجية: 2 و−5 لأن 2 + (−5) = −3 و2 − (−5) = 7", "س1 [مستوى الدعم]: أوجد العدد المفقود: −1.5 + □ = 2\nالإجابة النموذجية: 3.5\nس2 [المستوى المتوقع]: في جدول جمع: رأس الصف −2.5 ورأس العمود 1.2. ما العدد في الخانة المشتركة؟\nالإجابة النموذجية: −2.5 + 1.2 = −1.3\nس3 [المستوى المتقدم]: سُجلت درجات الحرارة −3، −1، 2، −4 في أربعة أيام، والوسط الحسابي لخمسة أيام −1. ما درجة اليوم الخامس؟\nالإجابة النموذجية: المجموع المطلوب −5، ومجموع الأربعة −6، فدرجة اليوم الخامس 1", "عزيزي الطالب: حل السؤالين 6 و7 ص 18 كاملين، وراجع طريقة حساب الوسط الحسابي في السؤال 5 ص 17. ولي الأمر الكريم: شجّع ابنك على تسجيل درجات الحرارة الصغرى لثلاثة أيام وحساب وسطها."], "html": ["<ol class='ol'><li>يوجد العدد المفقود في عمليات جمع وطرح الأعداد الموجهة.</li><li>يحسب الوسط الحسابي لمجموعة أعداد موجهة.</li><li>يحلل جدول جمع للأعداد الموجهة لإكمال الخانات الناقصة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span><span>التعلم المبني على حل المشكلات</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة التقليدية</span><span>الأقلام</span><span>أخرى: بطاقات «سلّم الحرارة» للعب الجماعي</span></div>", "العدد المفقود، الوسط الحسابي، جدول الجمع، المعكوس الجمعي", "لعبة «سلّم الحرارة»: يبدأ كل صف عند <span class=\"m\">−2</span> ويسحب بطاقة (<span class=\"m\">+3</span>، <span class=\"m\">−4.5</span>، <span class=\"m\">−(−1)</span>…) ويحدد موقعه الجديد شفهيًا. التعلم القبلي: قاعدة طرح العدد السالب من الحصة السابقة، وطريقة حساب الوسط الحسابي (مجموع القيم ÷ عددها).", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>6<small>د</small></td><td class='ph'>التهيئة</td><td>يدير لعبة سلّم الحرارة ثلاث جولات سريعة ويصحح فورًا.</td><td>يسحب البطاقة ويحسب الموقع الجديد ويعلنه.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>الأعداد المفقودة</td><td>يعرض <span class=\"m\">□ + 3 = −2</span> و<span class=\"m\">4.5 − □ = 7</span> ويوضح استخدام العملية العكسية للتوصل إلى العدد المفقود، ثم يوجّه إلى السؤالين 6 و7 ص 18.</td><td>يحل في أزواج ويتحقق بالتعويض في العملية الأصلية.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>جدول الجمع</td><td>يرسم جدول جمع فارغ (السؤال 8 ص 18) ويطلب إكمال خاناته بالتعاون مع إظهار نمط تزايد الأعداد وتناقصها في الصفوف والأعمدة.</td><td>يعمل في مجموعات رباعية: كل عضو يكمل صفًا، ثم يراجع الأعضاء خانات بعضهم.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الوسط الحسابي</td><td>يناقش السؤال 5 ص 17 (متوسط درجات الحرارة لعدة أيام) ويذكّر بأن مجموع القيم قد يكون سالبًا.</td><td>يحسب المجموع ثم يقسم على عدد الأيام، ويفسر معنى الوسط السالب.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويناقش طريقة التحقق بالعملية العكسية.</td><td>يجيب كتابيًا ويشرح حلًا واحدًا للصف.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد العدد المفقود: <span class=\"m\">□ + 3 = −2</span></td><td class='ans'><span class=\"m\">−5</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب الوسط الحسابي للأعداد: <span class=\"m\">−4، 2، −1، −5</span></td><td class='ans'>المجموع <span class=\"m\">−8</span>، والوسط <span class=\"m\">−8 ÷ 4 = −2</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>عددان مجموعهما <span class=\"m\">−3</span> والفرق بينهما 7. ما العددان؟</td><td class='ans'>2 و<span class=\"m\">−5</span> لأن <span class=\"m\">2 + (−5) = −3</span> و<span class=\"m\">2 − (−5) = 7</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>أوجد العدد المفقود: <span class=\"m\">−1.5 + □ = 2</span></td><td class='ans'><span class=\"m\">3.5</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>في جدول جمع: رأس الصف <span class=\"m\">−2.5</span> ورأس العمود <span class=\"m\">1.2</span>. ما العدد في الخانة المشتركة؟</td><td class='ans'><span class=\"m\">−2.5 + 1.2 = −1.3</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>سُجلت درجات الحرارة <span class=\"m\">−3، −1، 2، −4</span> في أربعة أيام، والوسط الحسابي لخمسة أيام <span class=\"m\">−1</span>. ما درجة اليوم الخامس؟</td><td class='ans'>المجموع المطلوب <span class=\"m\">−5</span>، ومجموع الأربعة <span class=\"m\">−6</span>، فدرجة اليوم الخامس 1</td></tr></tbody></table>", "عزيزي الطالب: حل السؤالين 6 و7 ص 18 كاملين، وراجع طريقة حساب الوسط الحسابي في السؤال 5 ص 17. ولي الأمر الكريم: شجّع ابنك على تسجيل درجات الحرارة الصغرى لثلاثة أيام وحساب وسطها."]}, {"head": {"lesson": "1-1 الأعداد الموجهة", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الأول: 6–10/9/2026م", "pages": "كتاب الطالب ص 16–19 • كتاب النشاط ص 13–14 • دليل المعلم ص 21–22", "num": "الحصة 3 من 4", "topic": "ضرب الأعداد الموجهة وقسمتها"}, "plain": ["1) يضرب الأعداد الموجهة الصحيحة والعشرية ويقسمها بدقة.\n2) يستنتج قاعدة إشارة ناتج الضرب والقسمة من نمط جدول الضرب.\n3) يكتب عمليات قسمة مرتبطة بعملية ضرب معطاة ويوظف حقائق معلومة لإيجاد نواتج جديدة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nمخرج آخر: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، جهاز عرض البيانات", "ناتج الضرب، ناتج القسمة، إشارة الناتج، العملية العكسية", "يعرض المعلم جدول ضرب للأعداد الموجبة (ص 15) ويسأل: إذا مددنا الجدول يسارًا وأسفل فماذا يحدث للنواتج؟ التعلم القبلي: حقائق الضرب حتى 10 × 10 وضرب الأعداد العشرية.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض الجدول ويستدرج الطلاب لملاحظة نقصان النواتج بثبات كلما نقص أحد العاملين.\nالطالب: يتوقع الناتج التالي في كل صف.\n2) الاكتشاف (10 دقائق):\nالمعلم: ينفذ النشاط 2 من الدليل: يبدأ بـ3 × 5 = 15 ثم 3 × (−5)، (−3) × 5، (−3) × (−5) ويطلب تبرير الإشارة بتمديد النمط.\nالطالب: يستنتج في مجموعات: الإشارتان المختلفتان ⟵ ناتج سالب، والمتشابهتان ⟵ ناتج موجب.\n3) النمذجة (7 دقائق):\nالمعلم: ينمذج مثال 1-1 (ج، د) ص 17 ويبين أن القسمة تتبع قاعدة الإشارة نفسها بكتابة الضرب في صورة قسمة: (−3) × 5 = −15 ⟵ −15 ÷ 5 = −3.\nالطالب: يكتب عمليتي قسمة لكل عملية ضرب في دفتره.\n4) الممارسة الموجهة (11 دقيقة):\nالمعلم: يكلف بالسؤالين 9 و10 ص 18، ويوجه في السؤال 9 إلى استخدام الحقائق المعطاة (مثل أن أحد العاملين ضعف الآخر) بدل الحساب من جديد.\nالطالب: يحل فرديًا ثم يشرح لزميله كيف وظف الحقيقة المعطاة.\n5) الغلق (7 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويختم بسؤال: لماذا الضرب أسهل من الجمع في تحديد الإشارة؟\nالطالب: يجيب ويقارن بين قاعدتي الجمع والضرب.", "س1 [مستوى الدعم]: احسب: −6 × 4\nالإجابة النموذجية: −24\nس2 [المستوى المتوقع]: احسب: −7.2 ÷ (−0.9)\nالإجابة النموذجية: 8\nس3 [المستوى المتقدم]: اكتب عمليتي قسمة مرتبطتين بـ−2.5 × 4 = −10.\nالإجابة النموذجية: −10 ÷ 4 = −2.5 و−10 ÷ (−2.5) = 4", "س1 [مستوى الدعم]: احسب: −24 ÷ (−3)\nالإجابة النموذجية: 8\nس2 [المستوى المتوقع]: احسب: 1.5 × (−0.4)\nالإجابة النموذجية: −0.6\nس3 [المستوى المتقدم]: إذا علمت أن 3.6 × 1.25 = 4.5 فأوجد: (−7.2) × 1.25 و4.5 ÷ (−3.6)\nالإجابة النموذجية: −9 (لأن −7.2 ضعف 3.6 مع إشارة سالبة)، و−1.25", "عزيزي الطالب: أكمل السؤالين 9 و10 ص 18، واحفظ قاعدة إشارة الضرب والقسمة مع مثال لكل حالة. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك لماذا (−3) × (−5) = 15 باستخدام النمط."], "html": ["<ol class='ol'><li>يضرب الأعداد الموجهة الصحيحة والعشرية ويقسمها بدقة.</li><li>يستنتج قاعدة إشارة ناتج الضرب والقسمة من نمط جدول الضرب.</li><li>يكتب عمليات قسمة مرتبطة بعملية ضرب معطاة ويوظف حقائق معلومة لإيجاد نواتج جديدة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> فهم</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>جهاز عرض البيانات</span></div>", "ناتج الضرب، ناتج القسمة، إشارة الناتج، العملية العكسية", "يعرض المعلم جدول ضرب للأعداد الموجبة (ص 15) ويسأل: إذا مددنا الجدول يسارًا وأسفل فماذا يحدث للنواتج؟ التعلم القبلي: حقائق الضرب حتى <span class=\"m\">10 × 10</span> وضرب الأعداد العشرية.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض الجدول ويستدرج الطلاب لملاحظة نقصان النواتج بثبات كلما نقص أحد العاملين.</td><td>يتوقع الناتج التالي في كل صف.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الاكتشاف</td><td>ينفذ النشاط 2 من الدليل: يبدأ بـ<span class=\"m\">3 × 5 = 15</span> ثم <span class=\"m\">3 × (−5)</span>، <span class=\"m\">(−3) × 5</span>، <span class=\"m\">(−3) × (−5)</span> ويطلب تبرير الإشارة بتمديد النمط.</td><td>يستنتج في مجموعات: الإشارتان المختلفتان ⟵ ناتج سالب، والمتشابهتان ⟵ ناتج موجب.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال 1-1 (ج، د) ص 17 ويبين أن القسمة تتبع قاعدة الإشارة نفسها بكتابة الضرب في صورة قسمة: <span class=\"m\">(−3) × 5 = −15</span> ⟵ <span class=\"m\">−15 ÷ 5 = −3</span>.</td><td>يكتب عمليتي قسمة لكل عملية ضرب في دفتره.</td></tr><tr><td class='tm'>11<small>د</small></td><td class='ph'>الممارسة الموجهة</td><td>يكلف بالسؤالين 9 و10 ص 18، ويوجه في السؤال 9 إلى استخدام الحقائق المعطاة (مثل أن أحد العاملين ضعف الآخر) بدل الحساب من جديد.</td><td>يحل فرديًا ثم يشرح لزميله كيف وظف الحقيقة المعطاة.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويختم بسؤال: لماذا الضرب أسهل من الجمع في تحديد الإشارة؟</td><td>يجيب ويقارن بين قاعدتي الجمع والضرب.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">−6 × 4</span></td><td class='ans'><span class=\"m\">−24</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">−7.2 ÷ (−0.9)</span></td><td class='ans'>8</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب عمليتي قسمة مرتبطتين بـ<span class=\"m\">−2.5 × 4 = −10</span>.</td><td class='ans'><span class=\"m\">−10 ÷ 4 = −2.5</span> و<span class=\"m\">−10 ÷ (−2.5) = 4</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">−24 ÷ (−3)</span></td><td class='ans'>8</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">1.5 × (−0.4)</span></td><td class='ans'><span class=\"m\">−0.6</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>إذا علمت أن <span class=\"m\">3.6 × 1.25 = 4.5</span> فأوجد: <span class=\"m\">(−7.2) × 1.25</span> و<span class=\"m\">4.5 ÷ (−3.6)</span></td><td class='ans'><span class=\"m\">−9</span> (لأن <span class=\"m\">−7.2</span> ضعف <span class=\"m\">3.6</span> مع إشارة سالبة)، و<span class=\"m\">−1.25</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل السؤالين 9 و10 ص 18، واحفظ قاعدة إشارة الضرب والقسمة مع مثال لكل حالة. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك لماذا <span class=\"m\">(−3) × (−5) = 15</span> باستخدام النمط."]}, {"head": {"lesson": "1-1 الأعداد الموجهة", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الأول: 6–10/9/2026م", "pages": "كتاب الطالب ص 16–19 • كتاب النشاط ص 13–14 • دليل المعلم ص 21–22", "num": "الحصة 4 من 4", "topic": "تطبيقات على العمليات الأربع على الأعداد الموجهة"}, "plain": ["1) يعوّض أعدادًا موجهة في جمل عددية ويحسب قيمها مع مراعاة ترتيب العمليات.\n2) يكمل جدول ضرب يتضمن أعدادًا موجهة ويستخدمه في الحساب.\n3) يستدل على عددين موجهين من معلومات عن مجموعهما وحاصل ضربهما. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التعويض، الجملة العددية، ترتيب العمليات، العدد الموجه", "مراجعة سريعة «صواب أم خطأ» على السبورة الذكية: −4 − 3 = −1، (−2) × (−6) = 12، −9 ÷ 3 = 3. التعلم القبلي: قواعد العمليات الأربع على الأعداد الموجهة من الحصص الثلاث السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض العبارات الثلاث ويطلب التصويت برفع البطاقات ثم يصحح الخطأ.\nالطالب: يصوّت ويبرر تصحيح العبارة الخاطئة.\n2) التعويض (9 دقائق):\nالمعلم: يناقش السؤالين 11 و12 ص 18 (إكمال العمليات والتعويض بقيم معطاة) ويركز على كتابة الأقواس عند تعويض عدد سالب.\nالطالب: يعوّض ويكتب الخطوات كاملة مع الأقواس.\n3) جدول الضرب (8 دقائق):\nالمعلم: يعرض السؤال 13 ص 19 (جدول ضرب) ويطلب استخدامه لإيجاد نواتج مركبة، ثم يطرح السؤال 14 ص 19 كتحدٍ للمتقدمين.\nالطالب: يحل في أزواج، ويحاول المتقدمون إيجاد العددين في السؤال 14.\n4) كتاب النشاط (10 دقائق):\nالمعلم: يوزع تمارين كتاب النشاط ص 13–14 بحسب المستويات (الدعم: التمارين الأولى، المتوقع والمتقدم: المسائل اللفظية).\nالطالب: يحل فرديًا ويطابق إجاباته مع زميل.\n5) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات على السبورة الذكية لدرس 1-1 (الحصة 4) ويناقش السؤال الأصعب.\nالطالب: يتنافس في مجموعات ويجيب ضمن الزمن المحدد.", "س1 [مستوى الدعم]: إذا كان س = −3 وص = 5 فأوجد س × ص.\nالإجابة النموذجية: −15\nس2 [المستوى المتوقع]: بالقيم نفسها، أوجد (س − ص) ÷ 2.\nالإجابة النموذجية: (−3 − 5) ÷ 2 = −8 ÷ 2 = −4\nس3 [المستوى المتقدم]: عددان صحيحان مجموعهما −1 وحاصل ضربهما −12. ما هما؟\nالإجابة النموذجية: 3 و−4", "س1 [مستوى الدعم]: احسب: −4 × (−2.5)\nالإجابة النموذجية: 10\nس2 [المستوى المتوقع]: احسب: (−6 + 2) × (−3)\nالإجابة النموذجية: (−4) × (−3) = 12\nس3 [المستوى المتقدم]: رتّب تصاعديًا: −0.5 × 8، 12 ÷ (−4)، −2 − 3\nالإجابة النموذجية: القيم: −4، −3، −5؛ فالترتيب: −2 − 3، −0.5 × 8، 12 ÷ (−4)", "عزيزي الطالب: أكمل تمارين كتاب النشاط ص 13–14، وراجع الأسئلة 11–14 ص 18–19 من كتاب الطالب استعدادًا لدرس الجذور. ولي الأمر الكريم: تابع حل ابنك لصفحتي النشاط وشجعه على التحقق من الإشارة في كل ناتج."], "html": ["<ol class='ol'><li>يعوّض أعدادًا موجهة في جمل عددية ويحسب قيمها مع مراعاة ترتيب العمليات.</li><li>يكمل جدول ضرب يتضمن أعدادًا موجهة ويستخدمه في الحساب.</li><li>يستدل على عددين موجهين من معلومات عن مجموعهما وحاصل ضربهما. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم المبني على اللعب</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "التعويض، الجملة العددية، ترتيب العمليات، العدد الموجه", "مراجعة سريعة «صواب أم خطأ» على السبورة الذكية: <span class=\"m\">−4 − 3 = −1</span>، <span class=\"m\">(−2) × (−6) = 12</span>، <span class=\"m\">−9 ÷ 3 = 3</span>. التعلم القبلي: قواعد العمليات الأربع على الأعداد الموجهة من الحصص الثلاث السابقة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض العبارات الثلاث ويطلب التصويت برفع البطاقات ثم يصحح الخطأ.</td><td>يصوّت ويبرر تصحيح العبارة الخاطئة.</td></tr><tr><td class='tm'>9<small>د</small></td><td class='ph'>التعويض</td><td>يناقش السؤالين 11 و12 ص 18 (إكمال العمليات والتعويض بقيم معطاة) ويركز على كتابة الأقواس عند تعويض عدد سالب.</td><td>يعوّض ويكتب الخطوات كاملة مع الأقواس.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>جدول الضرب</td><td>يعرض السؤال 13 ص 19 (جدول ضرب) ويطلب استخدامه لإيجاد نواتج مركبة، ثم يطرح السؤال 14 ص 19 كتحدٍ للمتقدمين.</td><td>يحل في أزواج، ويحاول المتقدمون إيجاد العددين في السؤال 14.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>كتاب النشاط</td><td>يوزع تمارين كتاب النشاط ص 13–14 بحسب المستويات (الدعم: التمارين الأولى، المتوقع والمتقدم: المسائل اللفظية).</td><td>يحل فرديًا ويطابق إجاباته مع زميل.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>مسابقة ختامية</td><td>يشغّل مسابقة المجموعات على السبورة الذكية لدرس 1-1 (الحصة 4) ويناقش السؤال الأصعب.</td><td>يتنافس في مجموعات ويجيب ضمن الزمن المحدد.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>إذا كان <span class=\"m\">س = −3</span> و<span class=\"m\">ص = 5</span> فأوجد <span class=\"m\">س × ص</span>.</td><td class='ans'><span class=\"m\">−15</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بالقيم نفسها، أوجد <span class=\"m\">(س − ص) ÷ 2</span>.</td><td class='ans'><span class=\"m\">(−3 − 5) ÷ 2 = −8 ÷ 2 = −4</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>عددان صحيحان مجموعهما <span class=\"m\">−1</span> وحاصل ضربهما <span class=\"m\">−12</span>. ما هما؟</td><td class='ans'>3 و<span class=\"m\">−4</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">−4 × (−2.5)</span></td><td class='ans'>10</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>احسب: <span class=\"m\">(−6 + 2) × (−3)</span></td><td class='ans'><span class=\"m\">(−4) × (−3) = 12</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>رتّب تصاعديًا: <span class=\"m\">−0.5 × 8</span>، <span class=\"m\">12 ÷ (−4)</span>، <span class=\"m\">−2 − 3</span></td><td class='ans'>القيم: <span class=\"m\">−4</span>، <span class=\"m\">−3</span>، <span class=\"m\">−5</span>؛ فالترتيب: <span class=\"m\">−2 − 3</span>، <span class=\"m\">−0.5 × 8</span>، <span class=\"m\">12 ÷ (−4)</span></td></tr></tbody></table>", "عزيزي الطالب: أكمل تمارين كتاب النشاط ص 13–14، وراجع الأسئلة 11–14 ص 18–19 من كتاب الطالب استعدادًا لدرس الجذور. ولي الأمر الكريم: تابع حل ابنك لصفحتي النشاط وشجعه على التحقق من الإشارة في كل ناتج."]}]}, {"id": "1-2", "title": "الجذور التربيعية والجذور التكعيبية", "periods": [{"head": {"lesson": "1-2 الجذور التربيعية والجذور التكعيبية", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الأول: 6–10/9/2026م", "pages": "كتاب الطالب ص 20–21 • كتاب النشاط ص 15–16 • دليل المعلم ص 23–25", "num": "الحصة 1 من 3", "topic": "المربعات والمكعبات وتقدير الجذر التربيعي بين عددين صحيحين متتاليين"}, "plain": ["1) يتذكر المربعات حتى 20 × 20 والمكعبات حتى 5 × 5 × 5 وجذورها المقابلة.\n2) يقدّر الجذر التربيعي لعدد ليس مربعًا كاملًا بتحديد عددين صحيحين متتاليين يقع بينهما.\n3) يحدد العدد الصحيح الأقرب إلى الجذر ويبرر اختياره. (مخرج تعليمي آخر)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nمخرج آخر: تقييم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات المربعات الكاملة", "المربع الكامل، الجذر التربيعي، المكعب، الجذر التكعيبي، المتباينة", "مراجعة سريعة بسؤال كل طالب: ما مربع 13؟ ما الجذر التربيعي لـ144؟ ما مكعب 4؟ التعلم القبلي: المربعات والمكعبات والرمزان √ و∛ كما في صفحة التعلم القبلي للوحدة.", "1) التهيئة (6 دقائق):\nالمعلم: يطرح أسئلة المراجعة السريعة بالتناوب ويدوّن الإجابات في جدول على السبورة.\nالطالب: يجيب بسرعة ويكمل الجدول.\n2) الاكتشاف (12 دقيقة):\nالمعلم: ينفذ النشاط 1 من الدليل: جدول الأعداد ذات الجذور الصحيحة، ثم يسأل: ماذا نقول عن √20؟ ثم يكلف الأزواج بعدّ الأعداد الصحيحة الواقعة بين مربعين متتاليين ووصف النمط.\nالطالب: يستنتج أن √20 بين 4 و5 وأقرب إلى 4، ويكتشف أن عدد الأعداد بين ن² و(ن+1)² يساوي 2ن.\n3) النمذجة (8 دقائق):\nالمعلم: ينمذج مثال 1-2 (أ) ص 20: كتابة متباينة مثل 81 < 85 < 100 ⟵ 9 < √85 < 10.\nالطالب: يكتب متباينات مماثلة لأعداد يختارها.\n4) الممارسة (8 دقائق):\nالمعلم: يكلف بجزئيات التقدير من تمارين 1-2 ص 21 مع منع الآلة الحاسبة.\nالطالب: يحل فرديًا ويتحقق بتربيع العدد الصحيح الأقرب.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويختم بسؤال الدليل: كم عددًا صحيحًا موجبًا أصغر من 100 له جذر تربيعي صحيح؟ (9)\nالطالب: يجيب ويبرر.", "س1 [مستوى الدعم]: احسب: √144\nالإجابة النموذجية: 12\nس2 [المستوى المتوقع]: بين أي عددين صحيحين متتاليين يقع √55؟ وإلى أيهما أقرب؟\nالإجابة النموذجية: بين 7 و8 لأن 49 < 55 < 64، وهو أقرب إلى 7\nس3 [المستوى المتقدم]: كم عددًا صحيحًا ن يحقق 7 < √ن < 8؟\nالإجابة النموذجية: ن من 50 إلى 63، أي 14 عددًا", "س1 [مستوى الدعم]: ما مربع العدد 13؟\nالإجابة النموذجية: 169\nس2 [المستوى المتوقع]: قدّر √200 بين عددين صحيحين متتاليين.\nالإجابة النموذجية: بين 14 و15 لأن 196 < 200 < 225، وهو أقرب إلى 14\nس3 [المستوى المتقدم]: اكتب عددًا صحيحًا جذره التربيعي بين 9.5 و10.\nالإجابة النموذجية: أي عدد من 91 إلى 99، مثل 95 (لأن 9.5² = 90.25)", "عزيزي الطالب: احفظ المربعات حتى 20² والمكعبات حتى 5³، وراجع مثال 1-2 ص 20. ولي الأمر الكريم: ساعد ابنك على حفظ المربعات بمسابقة شفهية قصيرة يوميًا."], "html": ["<ol class='ol'><li>يتذكر المربعات حتى <span class=\"m\">20 × 20</span> والمكعبات حتى <span class=\"m\">5 × 5 × 5</span> وجذورها المقابلة.</li><li>يقدّر الجذر التربيعي لعدد ليس مربعًا كاملًا بتحديد عددين صحيحين متتاليين يقع بينهما.</li><li>يحدد العدد الصحيح الأقرب إلى الجذر ويبرر اختياره. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تذكر</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تقييم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span><span>التعلم بالنمذجة</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: بطاقات المربعات الكاملة</span></div>", "المربع الكامل، الجذر التربيعي، المكعب، الجذر التكعيبي، المتباينة", "مراجعة سريعة بسؤال كل طالب: ما مربع 13؟ ما الجذر التربيعي لـ144؟ ما مكعب 4؟ التعلم القبلي: المربعات والمكعبات والرمزان <span class=\"m\">√</span> و<span class=\"m\">∛</span> كما في صفحة التعلم القبلي للوحدة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>6<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح أسئلة المراجعة السريعة بالتناوب ويدوّن الإجابات في جدول على السبورة.</td><td>يجيب بسرعة ويكمل الجدول.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>الاكتشاف</td><td>ينفذ النشاط 1 من الدليل: جدول الأعداد ذات الجذور الصحيحة، ثم يسأل: ماذا نقول عن <span class=\"m\">√20</span>؟ ثم يكلف الأزواج بعدّ الأعداد الصحيحة الواقعة بين مربعين متتاليين ووصف النمط.</td><td>يستنتج أن <span class=\"m\">√20</span> بين 4 و5 وأقرب إلى 4، ويكتشف أن عدد الأعداد بين <span class=\"m\">ن<sup>2</sup></span> و<span class=\"m\">(ن+1)<sup>2</sup></span> يساوي <span class=\"m\">2ن</span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال 1-2 (أ) ص 20: كتابة متباينة مثل <span class=\"m\">81 &lt; 85 &lt; 100</span> ⟵ <span class=\"m\">9 &lt; √85 &lt; 10</span>.</td><td>يكتب متباينات مماثلة لأعداد يختارها.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بجزئيات التقدير من تمارين 1-2 ص 21 مع منع الآلة الحاسبة.</td><td>يحل فرديًا ويتحقق بتربيع العدد الصحيح الأقرب.</td></tr><tr><td class='tm'>6<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويختم بسؤال الدليل: كم عددًا صحيحًا موجبًا أصغر من 100 له جذر تربيعي صحيح؟ (9)</td><td>يجيب ويبرر.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">√144</span></td><td class='ans'>12</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بين أي عددين صحيحين متتاليين يقع <span class=\"m\">√55</span>؟ وإلى أيهما أقرب؟</td><td class='ans'>بين 7 و8 لأن <span class=\"m\">49 &lt; 55 &lt; 64</span>، وهو أقرب إلى 7</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>كم عددًا صحيحًا ن يحقق <span class=\"m\">7 &lt; √ن &lt; 8</span>؟</td><td class='ans'>ن من 50 إلى 63، أي 14 عددًا</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>ما مربع العدد 13؟</td><td class='ans'>169</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>قدّر <span class=\"m\">√200</span> بين عددين صحيحين متتاليين.</td><td class='ans'>بين 14 و15 لأن <span class=\"m\">196 &lt; 200 &lt; 225</span>، وهو أقرب إلى 14</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>اكتب عددًا صحيحًا جذره التربيعي بين 9.5 و10.</td><td class='ans'>أي عدد من 91 إلى 99، مثل 95 (لأن <span class=\"m\">9.5<sup>2</sup> = 90.25</span>)</td></tr></tbody></table>", "عزيزي الطالب: احفظ المربعات حتى <span class=\"m\">20<sup>2</sup></span> والمكعبات حتى <span class=\"m\">5<sup>3</sup></span>، وراجع مثال 1-2 ص 20. ولي الأمر الكريم: ساعد ابنك على حفظ المربعات بمسابقة شفهية قصيرة يوميًا."]}, {"head": {"lesson": "1-2 الجذور التربيعية والجذور التكعيبية", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الأول: 6–10/9/2026م", "pages": "كتاب الطالب ص 20–21 • كتاب النشاط ص 15–16 • دليل المعلم ص 23–25", "num": "الحصة 2 من 3", "topic": "الجذور التكعيبية وتقديرها واستخدام الآلة الحاسبة"}, "plain": ["1) يقدّر الجذر التكعيبي لعدد بتحديد عددين صحيحين متتاليين يقع بينهما.\n2) يستخدم الآلة الحاسبة لإيجاد الجذور التربيعية والتكعيبية ويقرّب الناتج تقريبًا مناسبًا.\n3) يميز أن الجذر والتربيع (أو التكعيب) عمليتان عكسيتان ويتحقق بهما من الإجابة. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: فهم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، أخرى: آلات حاسبة علمية", "الجذر التكعيبي، المكعب الكامل، التقريب لمنازل عشرية، العملية العكسية", "يعرض المعلم مكعبًا من مكعبات صغيرة (3 × 3 × 3) ويسأل: كم مكعبًا صغيرًا فيه؟ وما طول ضلع مكعب يتكون من 64 مكعبًا صغيرًا؟ التعلم القبلي: المكعبات الكاملة حتى 10³ وتقدير الجذر التربيعي من الحصة السابقة.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض المجسم ويطرح السؤالين ويربطهما بالجذر التكعيبي.\nالطالب: يجيب ويستنتج العلاقة بين الحجم وطول الضلع.\n2) الاكتشاف (10 دقائق):\nالمعلم: يكلف الأزواج بعدّ الأعداد الصحيحة التي لها جذر تكعيبي صحيح بين مكعبين متتاليين (النشاط 1 من الدليل)، ثم يسأل: كم عددًا صحيحًا أصغر من 1000 له جذر تكعيبي صحيح؟ (9)\nالطالب: يكتب المكعبات ويلاحظ تزايد الفروق بينها بسرعة.\n3) النمذجة (7 دقائق):\nالمعلم: ينمذج مثال 1-2 (ب، د) ص 20 لتقدير ∛50 بين 3 و4.\nالطالب: يكتب المتباينة 27 < 50 < 64.\n4) الآلة الحاسبة (10 دقائق):\nالمعلم: ينفذ النشاط 2 من الدليل: يتأكد من تسلسل المفاتيح الصحيح في آلات الطلاب بإيجاد جذور معلومة أولًا، ثم يكلف بالسؤالين 8 و9 من تمارين 1-2 مع التقريب لمنزلتين عشريتين.\nالطالب: يتحقق من الآلة بجذور معروفة ثم يحسب ويقرّب ويتحقق بالتربيع.\n5) الغلق (8 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويناقش: لماذا نقرب ناتج الآلة الحاسبة؟\nالطالب: يجيب ويذكر مثالًا.", "س1 [مستوى الدعم]: احسب: ∛125\nالإجابة النموذجية: 5\nس2 [المستوى المتوقع]: بين أي عددين صحيحين متتاليين يقع ∛100؟\nالإجابة النموذجية: بين 4 و5 لأن 64 < 100 < 125، وهو أقرب إلى 5\nس3 [المستوى المتقدم]: باستخدام الآلة الحاسبة أوجد √30 مقربًا لمنزلتين عشريتين، ثم تحقق.\nالإجابة النموذجية: 5.48 تقريبًا؛ والتحقق 5.48² ≈ 30.03", "س1 [مستوى الدعم]: احسب: ∛1000\nالإجابة النموذجية: 10\nس2 [المستوى المتوقع]: باستخدام الآلة الحاسبة أوجد ∛50 مقربًا لمنزلتين عشريتين.\nالإجابة النموذجية: 3.68\nس3 [المستوى المتقدم]: مكعب طول ضلعه عدد صحيح من السنتيمترات، وحجمه بين 300 و400 سم³. ما طول ضلعه؟\nالإجابة النموذجية: 7 سم لأن 7³ = 343", "عزيزي الطالب: حل الأسئلة المتبقية من تمارين 1-2 ص 21، وتدرّب على مفتاح الجذر التكعيبي في آلتك الحاسبة. ولي الأمر الكريم: تأكد من توفر آلة حاسبة علمية لدى ابنك."], "html": ["<ol class='ol'><li>يقدّر الجذر التكعيبي لعدد بتحديد عددين صحيحين متتاليين يقع بينهما.</li><li>يستخدم الآلة الحاسبة لإيجاد الجذور التربيعية والتكعيبية ويقرّب الناتج تقريبًا مناسبًا.</li><li>يميز أن الجذر والتربيع (أو التكعيب) عمليتان عكسيتان ويتحقق بهما من الإجابة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> فهم</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم التعاوني</span><span>التعلم الذاتي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>أخرى: آلات حاسبة علمية</span></div>", "الجذر التكعيبي، المكعب الكامل، التقريب لمنازل عشرية، العملية العكسية", "يعرض المعلم مكعبًا من مكعبات صغيرة (<span class=\"m\">3 × 3 × 3</span>) ويسأل: كم مكعبًا صغيرًا فيه؟ وما طول ضلع مكعب يتكون من 64 مكعبًا صغيرًا؟ التعلم القبلي: المكعبات الكاملة حتى <span class=\"m\">10<sup>3</sup></span> وتقدير الجذر التربيعي من الحصة السابقة.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يعرض المجسم ويطرح السؤالين ويربطهما بالجذر التكعيبي.</td><td>يجيب ويستنتج العلاقة بين الحجم وطول الضلع.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الاكتشاف</td><td>يكلف الأزواج بعدّ الأعداد الصحيحة التي لها جذر تكعيبي صحيح بين مكعبين متتاليين (النشاط 1 من الدليل)، ثم يسأل: كم عددًا صحيحًا أصغر من 1000 له جذر تكعيبي صحيح؟ (9)</td><td>يكتب المكعبات ويلاحظ تزايد الفروق بينها بسرعة.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>النمذجة</td><td>ينمذج مثال 1-2 (ب، د) ص 20 لتقدير <span class=\"m\">∛50</span> بين 3 و4.</td><td>يكتب المتباينة <span class=\"m\">27 &lt; 50 &lt; 64</span>.</td></tr><tr><td class='tm'>10<small>د</small></td><td class='ph'>الآلة الحاسبة</td><td>ينفذ النشاط 2 من الدليل: يتأكد من تسلسل المفاتيح الصحيح في آلات الطلاب بإيجاد جذور معلومة أولًا، ثم يكلف بالسؤالين 8 و9 من تمارين 1-2 مع التقريب لمنزلتين عشريتين.</td><td>يتحقق من الآلة بجذور معروفة ثم يحسب ويقرّب ويتحقق بالتربيع.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي ويناقش: لماذا نقرب ناتج الآلة الحاسبة؟</td><td>يجيب ويذكر مثالًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">∛125</span></td><td class='ans'>5</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بين أي عددين صحيحين متتاليين يقع <span class=\"m\">∛100</span>؟</td><td class='ans'>بين 4 و5 لأن <span class=\"m\">64 &lt; 100 &lt; 125</span>، وهو أقرب إلى 5</td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>باستخدام الآلة الحاسبة أوجد <span class=\"m\">√30</span> مقربًا لمنزلتين عشريتين، ثم تحقق.</td><td class='ans'><span class=\"m\">5.48</span> تقريبًا؛ والتحقق <span class=\"m\">5.48<sup>2</sup> ≈ 30.03</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>احسب: <span class=\"m\">∛1000</span></td><td class='ans'>10</td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>باستخدام الآلة الحاسبة أوجد <span class=\"m\">∛50</span> مقربًا لمنزلتين عشريتين.</td><td class='ans'><span class=\"m\">3.68</span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>مكعب طول ضلعه عدد صحيح من السنتيمترات، وحجمه بين 300 و400 <span class=\"m\">سم<sup>3</sup></span>. ما طول ضلعه؟</td><td class='ans'>7 سم لأن <span class=\"m\">7<sup>3</sup> = 343</span></td></tr></tbody></table>", "عزيزي الطالب: حل الأسئلة المتبقية من تمارين 1-2 ص 21، وتدرّب على مفتاح الجذر التكعيبي في آلتك الحاسبة. ولي الأمر الكريم: تأكد من توفر آلة حاسبة علمية لدى ابنك."]}, {"head": {"lesson": "1-2 الجذور التربيعية والجذور التكعيبية", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الأول: 6–10/9/2026م", "pages": "كتاب الطالب ص 20–21 • كتاب النشاط ص 15–16 • دليل المعلم ص 23–25", "num": "الحصة 3 من 3", "topic": "تطبيقات على الجذور التربيعية والتكعيبية"}, "plain": ["1) يحل مسائل حياتية تتطلب إيجاد جذر تربيعي أو تكعيبي أو تقديره.\n2) يرتب أعدادًا تتضمن جذورًا تربيعية وتكعيبية دون آلة حاسبة.\n3) يحكم على صحة عبارات تتضمن جذورًا ويبرر حكمه. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nمخرج آخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المربع الكامل، المكعب الكامل، الجذر التربيعي، الجذر التكعيبي، التقدير", "سؤال افتتاحي: أرض مربعة مساحتها 70 م²؛ هل طول ضلعها أقرب إلى 8 م أم 9 م؟ التعلم القبلي: تقدير الجذور بين عددين صحيحين متتاليين واستخدام الآلة الحاسبة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح سؤال الأرض المربعة ويستمع لتبريرات الطلاب.\nالطالب: يقدّر ويبرر بالمقارنة بين 64 و81.\n2) حل المشكلات (10 دقائق):\nالمعلم: يناقش مسائل تمارين 1-2 ص 21 التي تتطلب اختيار العملية المناسبة (تربيع أو تكعيب أو جذر) كما يشير الدليل.\nالطالب: يحدد العملية المناسبة في مجموعات ثم يحل.\n3) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 15–16 بحسب المستويات ويتابع الطلاب فرديًا.\nالطالب: يحل فرديًا ثم يقارن مع زميله.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات لدرس 1-2 (الحصة 3).\nالطالب: يتنافس في مجموعات.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي.\nالطالب: يجيب كتابيًا.", "س1 [مستوى الدعم]: أكمل: 9² = 81 إذن √81 = □\nالإجابة النموذجية: 9\nس2 [المستوى المتوقع]: أرض مربعة مساحتها 70 م². قدّر طول ضلعها لأقرب متر.\nالإجابة النموذجية: 8 م تقريبًا؛ لأن √70 بين 8 و9 وأقرب إلى 8 (70 − 64 = 6 بينما 81 − 70 = 11)\nس3 [المستوى المتقدم]: هل √50 + √50 = √100؟ برّر.\nالإجابة النموذجية: لا؛ √50 ≈ 7.07 فالطرف الأيسر ≈ 14.14 بينما √100 = 10", "س1 [مستوى الدعم]: احسب: √400\nالإجابة النموذجية: 20\nس2 [المستوى المتوقع]: رتّب تصاعديًا: √40، 6.5، ∛216\nالإجابة النموذجية: ∛216 = 6، √40 ≈ 6.32؛ فالترتيب: ∛216، √40، 6.5\nس3 [المستوى المتقدم]: ما أصغر عدد صحيح أكبر من 1 يكون مربعًا كاملًا ومكعبًا كاملًا في الوقت نفسه؟\nالإجابة النموذجية: 64 لأن 64 = 8² = 4³", "عزيزي الطالب: أكمل كتاب النشاط ص 15–16، واقرأ ص 22 من كتاب الطالب استعدادًا لدرس الأسس. ولي الأمر الكريم: اطلب من ابنك تقدير الجذر التربيعي لمساحة غرفة في المنزل."], "html": ["<ol class='ol'><li>يحل مسائل حياتية تتطلب إيجاد جذر تربيعي أو تكعيبي أو تقديره.</li><li>يرتب أعدادًا تتضمن جذورًا تربيعية وتكعيبية دون آلة حاسبة.</li><li>يحكم على صحة عبارات تتضمن جذورًا ويبرر حكمه. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تحليل</span><span><b>مخرج آخر: تطبيق\nمخرج آخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات قوى للمطابقة", "القوة، الأس، الأساس، الصيغة الأسية، الضرب المتكرر", "قصة الحبوب على رقعة الشطرنج: حبة في المربع الأول، ثم يتضاعف العدد في كل مربع. كم حبة في المربع العاشر؟ التعلم القبلي: الضرب المتكرر والمربعات والمكعبات من الدرس السابق.", "1) التهيئة (6 دقائق):\nالمعلم: يروي قصة الرقعة ويكتب أعداد الحبوب في المربعات الأولى.\nالطالب: يتوقع العدد في المربع العاشر ويعبر عنه بالضرب المتكرر.\n2) النمذجة (8 دقائق):\nالمعلم: يقدم المصطلحات ص 22: القوة والأس والأساس، ويكتب 2 × 2 × 2 × 2 = 2⁴ ويقرأ «2 مرفوعًا للقوة 4».\nالطالب: يحدد الأساس والأس في أمثلة متنوعة.\n3) لعبة المطابقة (10 دقائق):\nالمعلم: يوزع بطاقات (ضرب متكرر ⟷ صيغة أسية ⟷ قيمة) ويطلب المطابقة في مجموعات، مع بطاقات لأساس سالب مثل (−2)³.\nالطالب: يطابق البطاقات الثلاث ويناقش إشارة القوة ذات الأساس السالب.\n4) الممارسة (10 دقائق):\nالمعلم: يكلف بجزئيات القوى ذات الأس الموجب من تمارين 1-3 ص 23.\nالطالب: يحل فرديًا ويتحقق بالآلة الحاسبة عند الحاجة.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي.\nالطالب: يجيب على بطاقة خروج.", "س1 [مستوى الدعم]: اكتب 5 × 5 × 5 × 5 بالصيغة الأسية.\nالإجابة النموذجية: 5⁴\nس2 [المستوى المتوقع]: احسب: 2⁵ − 3³\nالإجابة النموذجية: 32 − 27 = 5\nس3 [المستوى المتقدم]: أيهما أكبر: 2¹⁰ أم 10³؟\nالإجابة النموذجية: 2¹⁰ = 1024 أكبر من 10³ = 1000", "س1 [مستوى الدعم]: في 7³ حدّد الأساس والأس.\nالإجابة النموذجية: الأساس 7 والأس 3\nس2 [المستوى المتوقع]: احسب: (−3)⁴\nالإجابة النموذجية: 81\nس3 [المستوى المتقدم]: أوجد قيمة ن إذا كان 3^(ن) = 243.\nالإجابة النموذجية: ن = 5", "عزيزي الطالب: اقرأ مقدمة الدرس ص 22، واكتب في دفترك قوى العدد 2 من 2¹ إلى 2¹⁰. ولي الأمر الكريم: ناقش مع ابنك قصة رقعة الشطرنج وكيف تكبر القوى بسرعة."], "html": ["<ol class='ol'><li>يكتب الضرب المتكرر بالصيغة الأسية ويحدد الأساس والأس.</li><li>يحسب قيمة قوى أعداد صحيحة موجبة وسالبة بأس صحيح موجب.</li><li>يقارن بين قيم قوى مختلفة الأساس والأس. <span class='tag'>مخرج تعليمي آخر</span></li></ol اب، السبورة الذكية، الأقلام، جهاز عرض البيانات", "الأس الصفري، الأس السالب، النمط، المقلوب", "يكتب المعلم 3⁴، 3³، 3²، 3¹ وقيمها ويسأل: ما العملية التي تنقلنا من كل قيمة إلى التي تليها؟ التعلم القبلي: الصيغة الأسية من الحصة السابقة وقسمة الكسور البسيطة.", "1) التهيئة (5 دقائق):\nالمعلم: يعرض النمط ويطلب وصفه.\nالطالب: يلاحظ أن القيمة تقسم على 3 كلما نقص الأس واحدًا.\n2) الاكتشاف (14 دقيقة):\nالمعلم: ينفذ نشاط الدليل: جدول قوى العدد 3 يمتد يمينًا، فيكمل الطلاب 3⁰، 3⁻¹، 3⁻² بالقسمة المتكررة، ثم يوجه إلى كتابة النواتج كسورًا لا أعدادًا عشرية.\nالطالب: يكمل الجدول في مجموعات ويصل إلى 3⁰ = 1 و3⁻¹ = 1/3 و3⁻² = 1/9.\n3) التعميم (8 دقائق):\nالمعلم: يطلب من كل مجموعة جدولًا مماثلًا لأساس آخر (2 أو 4 أو 10) ثم يعمم مع الصف ع⁰ = 1 وع⁻¹ = 1/ع.\nالطالب: تعرض المجموعات جداولها وتصوغ التعميم.\n4) الممارسة (7 دقائق):\nالمعلم: يكلف بجزئيات الأس الصفري والسالب من تمارين 1-3 ص 23.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي ويناقش الخطأ الشائع.\nالطالب: يجيب ويشرح سبب الخطأ.", "س1 [مستوى الدعم]: احسب: 8⁰\nالإجابة النموذجية: 1\nس2 [المستوى المتوقع]: احسب: 2⁻³ في صورة كسر.\nالإجابة النموذجية: 1/8\nس3 [المستوى المتقدم]: أكمل النمط وفسّر: 4² = 16، 4¹ = 4، 4⁰ = □، 4⁻¹ = □\nالإجابة النموذجية: 1 ثم 1/4؛ لأن كل خطوة قسمة على 4", "س1 [مستوى الدعم]: احسب: 10⁻¹\nالإجابة النموذجية: 1/10\nس2 [المستوى المتوقع]: احسب: 5⁻²\nالإجابة النموذجية: 1/25\nس3 [المستوى المتقدم]: قالت مريم: 3⁰ = 0. صحّح الخطأ وفسّر.\nالإجابة النموذجية: 3⁰ = 1؛ لأن 3⁰ = 3¹ ÷ 3 = 3 ÷ 3 = 1", "عزيزي الطالب: اكتب في دفترك جدول قوى العدد 2 من 2³ إلى 2⁻³ في صورة كسور. ولي الأمر الكريم: اسأل ابنك: لماذا 5⁰ = 1 وليس صفرًا؟"], "html": ["<ol class='ol'><li>يستنتج أن <span class=\"m\">ع<sup>0</sup> = 1</span> لأي عدد صحيح موجب ع باستخدام نمط القسمة.</li><li>يستنتج أن <span class=\"m\">ع<sup>−1</sup> = 1/ع</span> ويحسب قيم قوى ذات أس سالب.</li><li>يصحح الخطأ الشائع <span class=\"m\">ع<sup>0</sup> = 0</span> ويبرر التصحيح. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج  "topic": "كتابة الأسس السالبة كسورًا وحساب قيم عبارات أسية"}, "plain": ["1) يحوّل بين الكسر الذي بسطه 1 والصيغة الأسية ذات الأس السالب.\n2) يحسب قيمة عبارات تجمع قوى بأسس موجبة وصفرية وسالبة.\n3) يرتب قوى ذات أسس سالبة بحسب قيمها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم التعاوني، التعلم بالنمذجة، التعلم الذاتي", "الكتاب، السبورة التقليدية، الأقلام، أخرى: بطاقات أرقام", "الأس السالب، الكسر، القوة، القيمة العددية", "سؤال سريع على بطاقات الأرقام: 2⁰، 2⁻¹، 10⁻². التعلم القبلي: تعريف الأس الصفري والأس السالب وجمع الكسور البسيطة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح الأسئلة الثلاثة ويطلب رفع البطاقة المناسبة.\nالطالب: يرفع البطاقة ويبرر.\n2) النمذجة (9 دقائق):\nالمعلم: ينمذج تحويلات مثل 1/1000 = 10⁻³ و1/49 = 7⁻² ويقترح كتابة الأس السالب كسرًا لا عددًا عشريًا كما يوصي الدليل.\nالطالب: يحوّل أمثلة مماثلة على السبورة.\n3) تعلم تعاوني (12 دقيقة):\nالمعلم: يناقش السؤال 5 من تمارين 1-3 ص 23 الذي يتطلب كتابة كل جزء عددًا ثم الجمع أو الطرح، ويوزع جزئياته على المجموعات.\nالطالب: تحل كل مجموعة جزئية وتعرضها، ويقارن الطلاب طرقهم.\n4) الممارسة (8 دقائق):\nالمعلم: يكلف بما تبقى من تمارين 1-3 ص 23.\nالطالب: يحل فرديًا.\n5) الغلق (6 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي.\nالطالب: يجيب كتابيًا.", "س1 [مستوى الدعم]: اكتب 1/7 في صورة قوة للعدد 7.\nالإجابة النموذجية: 7⁻¹\nس2 [المستوى المتوقع]: احسب: 2⁻² + 2⁰\nالإجابة النموذجية: 1/4 + 1 = 1 1/4\nس3 [المستوى المتقدم]: رتّب تصاعديًا: 2⁻³، 3⁻²، 4⁻¹\nالإجابة النموذجية: 3⁻² = 1/9، 2⁻³ = 1/8، 4⁻¹ = 1/4", "س1 [مستوى الدعم]: اكتب 1/1000 في صورة قوة للعدد 10.\nالإجابة النموذجية: 10⁻³\nس2 [المستوى المتوقع]: احسب: 3² − 3⁻¹\nالإجابة النموذجية: 9 − 1/3 = 8 2/3\nس3 [المستوى المتقدم]: أوجد قيمة ن إذا كان 2^(ن) = 1/32.\nالإجابة النموذجية: ن = −5", "عزيزي الطالب: أكمل تمارين 1-3 ص 23، وراجع جمع الكسور البسيطة. ولي الأمر الكريم: تابع ابنك في كتابة نواتج الأسس السالبة كسورًا."], "html": ["<ol class='ol'><li>يحوّل بين الكسر الذي بسطه 1 والصيغة الأسية ذات الأس السالب.</li><li>يحسب قيمة عبارات تجمع قوى بأسس موجبة \"m\">5<sup>−3</sup> × 5<sup>7</sup></span></td><td class='ans'><span class=\"m\">5<sup>4</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>لماذا لا يمكن تبسيط <span class=\"m\">2<sup>3</sup> × 3<sup>2</sup></span> إلى قوة واحدة بقاعدة الضرب؟</td><td class='ans'>لأن الأساسين مختلفان؛ وقيمتها <span class=\"m\">8 × 9 = 72</span></td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>بسّط: <span class=\"m\">10<sup>2</sup> × 10<sup>3</sup></span></td><td class='ans'><span class=\"m\">10<sup>5</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بسّط: <span class=\"m\">2<sup>−4</sup> × 2<sup>−1</sup></span></td><td class='ans'><span class=\"m\">2<sup>−5</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>أوجد ن: <span class=\"m\">7<sup>ن</sup> × 7<sup>3</sup> = 7<sup>−2</sup></span></td><td class='ans'>ن = <span class=\"m\">−5</span></td></tr></tbody></table>", "عزيزي الطالب: اكتب قاعدة ضرب القوى مع ثلاثة أمثلة، وراجع ص 24 من كتاب الطالب. ولي الأمر الكريم: اسأل ابنك: لماذا <span class=\"m\">2<sup>3</sup> × 2<sup>4</sup> = 2<sup>7</sup></span>؟"]}, {"head": {"lesson": "1-4 استخدام الأُسس", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الثاني: 13–17/9/2026م", "pages": "كتاب الطالب ص 24–26 • كتاب النشاط ص 18–19 • دليل المعلم ص 28–29", "num": "الحصة 2 من 3", "topic": "قاعدة قسمة القوى ذات الأساس نفسه ورفع القوة إلى قوة"}, "plain": ["1) يستنتج قاعدة ع^(س) ÷ ع^(ص) = ع^(س−ص) بإعادة كتابة الضرب قسمة.\n2) يطبق قاعدتي القسمة ورفع القوة إلى قوة في التبسيط.\n3) يبسط عبارات مركبة تجمع قواعد الضرب والقسمة. (مخرج تعليمي آخر)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nمخرج آخر: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام", "قسمة القوى، قوة القوة، الأس السالب", "يكتب المعلم 2³ × 2⁴ = 2⁷ ويطلب كتابتها في صورة عمليتي قسمة. التعلم القبلي: قاعدة الضرب من الحصة السابقة والأس الصفري.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح المطلوب ويكتب إجابات الطلاب.\nالطالب: يكتب 2⁷ ÷ 2⁴ = 2³ و2⁷ ÷ 2³ = 2⁴.\n2) الاستنتاج (8 دقائق):\nالمعلم: يقود الطلاب إلى ملاحظة طرح الأسس، ويطبق على حالة 2³ ÷ 2³ لربطها بالأس الصفري.\nالطالب: يصوغ القاعدة ويتحقق بمثال عددي.\n3) قوة القوة (8 دقائق):\nالمعلم: يعرض (2³)² = 2³ × 2³ ويقود إلى ضرب الأسس، ويشير إلى السؤال 9 من تمارين 1-4.\nالطالب: يكتب أمثلة مشابهة ويعمم.\n4) الممارسة (12 دقيقة):\nالمعلم: يكلف بجزئيات القسمة وقوة القوة من تمارين 1-4 ص 25–26، ومنها السؤال 6 الذي يبين تبسيط الأسس للحساب.\nالطالب: يحل في أزواج ثم فرديًا.\n5) الغلق (7 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي.\nالطالب: يجيب كتابيًا.", "س1 [مستوى الدعم]: بسّط: 6⁸ ÷ 6³\nالإجابة النموذجية: 6⁵\nس2 [المستوى المتوقع]: بسّط: 4² ÷ 4⁵\nالإجابة النموذجية: 4⁻³\nس3 [المستوى المتقدم]: بسّط (2³)⁴ وفسّر.\nالإجابة النموذجية: 2¹²؛ لأنها 2³ مضروبة في نفسها 4 مرات فتُجمع الأسس", "س1 [مستوى الدعم]: بسّط: 9⁵ ÷ 9⁴\nالإجابة النموذجية: 9¹ = 9\nس2 [المستوى المتوقع]: بسّط: (5⁻²)³\nالإجابة النموذجية: 5⁻⁶\nس3 [المستوى المتقدم]: بسّط: (3⁵ × 3⁻²) ÷ 3⁴\nالإجابة النموذجية: 3⁻¹ = 1/3", "عزيزي الطالب: اكتب قوانين الأسس الثلاثة في بطاقة مراجعة، وأكمل جزئيات تمارين 1-4 ص 25–26. ولي الأمر الكريم: راجع مع ابنك بطاقة القوانين."], "html": ["<ol class='ol'><li>يستنتج قاعدة <span class=\"m\">ع<sup>س</sup> ÷ ع<sup>ص</sup> = ع<sup>س−ص</sup></span> بإعادة كتابة الضرب قسمة.</li><li>يطبق قاعدتي القسمة ورفع القوة إلى قوة في التبسيط.</li><li>يبسط عبارات مركبة تجمع قواعد الضرب والقسمة. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> فهم</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> تحليل</span></div>", "<div class='chips'><span>التعلم بالاكتشاف</span><span>التعلم بالنمذجة</span><span>التعلم التشاركي</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span></div>", "قسمة القوى، قوة القوة، الأس السالب", "يكتب المعلم <span class=\"m\">2<sup>3</sup> × 2<sup>4</sup> = 2<sup>7</sup></span> ويطلب كتابتها في صورة عمليتي قسمة. التعلم القبلي: قاعدة الضرب من الحصة السابقة والأس الصفري.", "<table class='steps'><thead><tr><th>الزمن</th><th>المرحلة</th><th>دور المعلم</th><th>دور الطالب</th></tr></thead><tbody><tr><td class='tm'>5<small>د</small></td><td class='ph'>التهيئة</td><td>يطرح المطلوب ويكتب إجابات الطلاب.</td><td>يكتب <span class=\"m\">2<sup>7</sup> ÷ 2<sup>4</sup> = 2<sup>3</sup></span> و<span class=\"m\">2<sup>7</sup> ÷ 2<sup>3</sup> = 2<sup>4</sup></span>.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>الاستنتاج</td><td>يقود الطلاب إلى ملاحظة طرح الأسس، ويطبق على حالة <span class=\"m\">2<sup>3</sup> ÷ 2<sup>3</sup></span> لربطها بالأس الصفري.</td><td>يصوغ القاعدة ويتحقق بمثال عددي.</td></tr><tr><td class='tm'>8<small>د</small></td><td class='ph'>قوة القوة</td><td>يعرض <span class=\"m\">(2<sup>3</sup>)<sup>2</sup> = 2<sup>3</sup> × 2<sup>3</sup></span> ويقود إلى ضرب الأسس، ويشير إلى السؤال 9 من تمارين 1-4.</td><td>يكتب أمثلة مشابهة ويعمم.</td></tr><tr><td class='tm'>12<small>د</small></td><td class='ph'>الممارسة</td><td>يكلف بجزئيات القسمة وقوة القوة من تمارين 1-4 ص 25–26، ومنها السؤال 6 الذي يبين تبسيط الأسس للحساب.</td><td>يحل في أزواج ثم فرديًا.</td></tr><tr><td class='tm'>7<small>د</small></td><td class='ph'>الغلق</td><td>يطرح أسئلة التقويم الختامي.</td><td>يجيب كتابيًا.</td></tr></tbody><tfoot><tr><td colspan='4'>مجموع زمن الحصة: 40 دقيقة</td></tr></tfoot></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>بسّط: <span class=\"m\">6<sup>8</sup> ÷ 6<sup>3</sup></span></td><td class='ans'><span class=\"m\">6<sup>5</sup></span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بسّط: <span class=\"m\">4<sup>2</sup> ÷ 4<sup>5</sup></span></td><td class='ans'><span class=\"m\">4<sup>−3</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>بسّط <span class=\"m\">(2<sup>3</sup>)<sup>4</sup></span> وفسّر.</td><td class='ans'><span class=\"m\">2<sup>12</sup></span>؛ لأنها <span class=\"m\">2<sup>3</sup></span> مضروبة في نفسها 4 مرات فتُجمع الأسس</td></tr></tbody></table>", "<table class='qa'><thead><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr></thead><tbody><tr><td class='lvq l0'>مستوى الدعم</td><td>بسّط: <span class=\"m\">9<sup>5</sup> ÷ 9<sup>4</sup></span></td><td class='ans'><span class=\"m\">9<sup>1</sup> = 9</span></td></tr><tr><td class='lvq l1'>المستوى المتوقع</td><td>بسّط: <span class=\"m\">(5<sup>−2</sup>)<sup>3</sup></span></td><td class='ans'><span class=\"m\">5<sup>−6</sup></span></td></tr><tr><td class='lvq l2'>المستوى المتقدم</td><td>بسّط: <span class=\"m\">(3<sup>5</sup> × 3<sup>−2</sup>) ÷ 3<sup>4</sup></span></td><td class='ans'><span class=\"m\">3<sup>−1</sup> = 1/3</span></td></tr></tbody></table>", "عزيزي الطالب: اكتب قوانين الأسس الثلاثة في بطاقة مراجعة، وأكمل جزئيات تمارين 1-4 ص 25–26. ولي الأمر الكريم: راجع مع ابنك بطاقة القوانين."]}, {"head": {"lesson": "1-4 استخدام الأُسس", "unit": "الوحدة الأولى: الأعداد الصحيحة والقوى والجذور", "week": "الأسبوع الثاني: 13–17/9/2026م", "pages": "كتاب الطالب ص 24–26 • كتاب النشاط ص 18–19 • دليل المعلم ص 28–29", "num": "الحصة 3 من 3", "topic": "تطبيقات على قوانين الأسس وحل معادلات أسية"}, "plain": ["1) يكتب أعدادًا في صورة قوى لأساس مناسب لتبسيط الحساب.\n2) يحل معادلات أسية باستخدام قوانين الأسس.\n3) يصوغ معادلات من خصائص الأسس ويحلها. (مخرج تعليمي آخر)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nمخرج آخر: إبداع", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "قوانين الأسس، المعادلة الأسية، الأساس المشترك", "تحدي البداية: اكتب العدد 64 بأكبر عدد ممكن من الصيغ الأسية (2⁶، 4³، 8²). التعلم القبلي: قوانين الضرب والقسمة وقوة القوة.", "1) التهيئة (5 دقائق):\nالمعلم: يطرح التحدي ويسجل الصيغ على السبورة.\nالطالب: يقترح صيغًا ويتحقق منها.\n2) حل المشكلات (10 دقائق):\nالمعلم: يناقش السؤالين 10 و11 من تمارين 1-4 (كتابة أس العدد في صورة ناتج ضرب مناسب، وصياغة معادلات من خصائص الأسس).\nالطالب: يحل في مجموعات ويعرض الحل.\n3) كتاب النشاط (12 دقيقة):\nالمعلم: يوزع تمارين كتاب النشاط ص 18–19 بحسب المستويات.\nالطالب: يحل فرديًا ثم يقارن.\n4) مسابقة ختامية (8 دقائق):\nالمعلم: يشغّل مسابقة المجموعات لدرس 1-4 (الحصة 3) كختام للوحدة.\nالطالب: يتنافس في مجموعات.\n5) الغلق (5 دقائق):\nالمعلم: يطرح أسئلة التقويم الختامي.\nالطالب: يجيب كتابيًا.", "س1 [مستوى الدعم]: اكتب 32 في صورة قوة للعدد 2.\nالإجابة النموذجية: 2⁵\nس2 [المستوى المتوقع]: اكتب 8 × 2⁴ في صورة قوة للعدد 2.\nالإجابة النموذجية: 2³ × 2⁴ = 2⁷\nس3 [المستوى المتقدم]: حل المعادلة: 2^(س) × 4 = 2⁹\nالإجابة النموذجية: 4 = 2² إذن س + 2 = 9 ومنها س = 7", "س1 [مستوى الدعم]: بسّط: 10⁶ ÷ 10⁶\nالإجابة النموذجية: 10⁰ = 1\nس2 [المستوى المتوقع]: اكتب 9 × 3⁻⁵ في صورة قوة للعدد 3.\nالإجابة النموذجية: 3² × 3⁻⁵ = 3⁻³\nس3 [المستوى المتقدم]: حل المعادلة: 25² = 5^(س)\nالإجابة النموذجية: 25² = (5²)² = 5⁴ إذن س = 4", "عزيزي الطالب: أكمل كتاب النشاط ص 18–19، وراجع مفردات الوحدة الأولى استعدادًا للوحدة الثانية. ولي الأمر الكريم: اطلب من ابنك أن يشرح لك قانونًا واحدًا من قوانين الأسس بمثال."], "html": ["<ol class='ol'><li>يكتب أعدادًا في صورة قوى لأساس مناسب لتبسيط الحساب.</li><li>يحل معادلات أسية باستخدام قوانين الأسس.</li><li>يصوغ معادلات من خصائص الأسس ويحلها. <span class='tag'>مخرج تعليمي آخر</span></li></ol>", "<div class='lv'><span><b>المخرج 1:</b> تطبيق</span><span><b>المخرج 2:</b> تطبيق</span><span><b>مخرج آخر:</b> إبداع</span></div>", "<div class='chips'><span>التعلم المبني على حل المشكلات</span><span>التعلم التعاوني</span><span>التعلم المبني على اللعب</span></div>", "<div class='chips r'><span>الكتاب</span><span>السبورة الذكية</span><span>الأقلام</span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot</span></div>", "قوانين الأسس، المعادلة الأسية، الأساس المشترك", "تحدي البداية: اكتب العدد 64 بأكبر عدد ممكن من الصيغ الأسية (<span class=\"m\">2<sup>6</sup></span>، <span class=\"m\">4<sup>3</sup></span>، <spa
