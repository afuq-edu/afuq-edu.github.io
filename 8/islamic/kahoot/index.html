const R=2*Math.PI*52;$('arc').style.strokeDasharray=R;
function points(t){return t<=30?Math.round(1000-500*t/30):Math.max(100,Math.round(500-400*(t-30)/30))}
function drawTurns(){const b=$('turns');b.innerHTML='';G.forEach((g,i)=>{const c=document.createElement('button');c.type='button';c.className='turn'+(i==cur?' on':'');c.style.borderColor=i==cur?g.c:'';c.textContent=(i==cur?'دور: ':'')+g.n;if(st.tm=='tch'&&!answered){c.onclick=()=>{cur=i;drawTurns()}}else c.disabled=true;b.appendChild(c)})}
function askQ(){answered=false;const q=Q[qi];cur=qi%G.length;show('s2');
$('qnum').textContent=`السؤال ${qi+1} من ${Q.length}`;$('qlvl').textContent='المستوى: '+LV[q.l];$('qper').textContent=`من الحصة ${q.p}`+(q.t=='t'?' — صواب أم خطأ':q.t=='c'?' — أكمل الفراغ':' — اختيار من متعدد');
drawTurns();$('qt').textContent=q.q;$('fb').textContent='';$('toRes').style.display='none';$('skip').style.display='';
const b=$('opts');b.innerHTML='';b.style.gridTemplateColumns=q.o.length==2?'1fr 1fr':'';
q.o.forEach((t,i)=>{const c=document.createElement('button');c.type='button';c.className='opt o'+i;const s=document.createElement('i');s.textContent=SH[i];c.appendChild(s);c.appendChild(document.createTextNode(t));c.onclick=()=>answer(i);b.appendChild(c)});
t0=performance.now();clearInterval(tick);$('ring').classList.remove('over');tick=setInterval(upd,200);upd()}
function upd(){const t=(performance.now()-t0)/1000;const left=Math.max(0,30-t);$('sec').textContent=t<=30?Math.ceil(left):'+'+Math.floor(t-30);
$('arc').style.strokeDashoffset=t<=30?R*(1-left/30):0;$('ring').classList.toggle('over',t>30);$('pts').textContent=points(t)+' نقطة'}
function answer(i){if(answered)return;answered=true;clearInterval(tick);const q=Q[qi];const t=(performance.now()-t0)/1000;const ok=i===q.c;const p=ok?points(t):0;
G[cur].s+=p;last={g:cur,p};[...$('opts').children].forEach((c,k)=>{c.disabled=true;if(k==q.c)c.classList.add('right');else if(k==i)c.classList.add('wrong');else c.classList.add('dim')});
$('fb').innerHTML='';const s=document.createElement('span');s.className='pop';s.textContent=i===-1?`لم تُجب ${G[cur].n} — الإجابة الصحيحة: ${q.o[q.c]}`:ok?`إجابة صحيحة! +${p} نقطة لـ ${G[cur].n}`:`إجابة غير صحيحة — الصحيحة: ${q.o[q.c]}`;$('fb').appendChild(s);
ok?snd.ok():snd.no();drawTurns();$('skip').style.display='none';$('toRes').style.display=''}
$('skip').onclick=()=>answer(-1);$('toRes').onclick=results;
// ---------- results
function ranks(){const s=G.map((g,i)=>[g.s,i]).sort((a,b)=>b[0]-a[0]);const r=[];let k=0;s.forEach((x,j)=>{if(j>0&&x[0]<s[j-1][0])k=j;r[x[1]]=k+1});return r}
function results(){show('s3');snd.bars();$('rtitle').textContent=`الترتيب بعد السؤال ${qi+1} من ${Q.length}`;const mx=Math.max(1000,...G.map(g=>g.s));const r=ranks();
const ch=$('chart'),cn=$('cn');ch.innerHTML='';cn.innerHTML='';
G.forEach((g,i)=>{const c=document.createElement('div');c.className='col'+(last.g==i&&last.p>0?' win':'');const v=document.createElement('div');v.className='val';v.textContent=g.s;const b=document.createElement('div');b.className='b';b.style.background=g.c;
const rk=document.createElement('span');rk.className='rk';rk.textContent=r[i];b.appendChild(rk);c.appendChild(v);c.appendChild(b);ch.appendChild(c);
const nm=document.createElement('div');nm.textContent=g.n;if(last.g==i&&last.p>0){const tg=document.createElement('div');tg.className='tag';tg.textContent='فازت بالسؤال +'+last.p;nm.appendChild(tg)}cn.appendChild(nm);
requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.height=Math.max(4,g.s/mx*100*0.86)+'%'}))});
$('next').textContent=qi+1<Q.length?'السؤال التالي':'النتيجة النهائية'}
$('next').onclick=()=>{qi++;qi<Q.length?askQ():final()};
// ---------- final
function final(){show('s4');snd.end();$('fsub').textContent=`${D[st.l].t} — ${Q.length} ${Q.length<=10&&Q.length>2?'أسئلة':'سؤالًا'}`;
const s=G.map((g,i)=>({...g,i})).sort((a,b)=>b.s-a.s);const r=ranks();const pod=$('pod');pod.innerHTML='';
const order=[1,0,2].filter(k=>k<s.length);const H={0:1,1:.72,2:.52};
order.forEach(k=>{const g=s[k];const d=document.createElement('div');d.className='pl p'+(k+1);d.innerHTML='';const nm=document.createElement('div');nm.className='nm';nm.textContent=g.n;const sc=document.createElement('div');sc.className='sc';sc.textContent=g.s+' نقطة';
const bl=document.createElement('div');bl.className='blk';bl.textContent=['🥇','🥈','🥉'][k];d.appendChild(nm);d.appendChild(sc);d.appendChild(bl);pod.appendChild(d);setTimeout(()=>{const ph=Math.max(120,pod.clientHeight-80);bl.style.height=Math.round(ph*H[k])+'px'},120+k*250)});
const rk=$('rank');rk.innerHTML='';s.forEach(g=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=`${r[g.i]}. ${g.n}`;const b=document.createElement('b');b.textContent=g.s;d.appendChild(a);d.appendChild(b);rk.appendChild(d)});confetti()}
$('again').onclick=begin;$('newg').onclick=()=>show('s1');
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#f6d77a','#a9c8ef','#f2b9a0','#a8d8bb','#d3b7ec'];
const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:3+Math.random()*4,v:.6+Math.random()*1.3,d:Math.random()*6.28,c:cols[Math.floor(Math.random()*cols.length)]}));
const t1=performance.now();(function f(){const e=performance.now()-t1;x.clearRect(0,0,c.width,c.height);x.globalAlpha=e<4500?1:Math.max(0,1-(e-4500)/1500);
P.forEach(p=>{p.y+=p.v;p.d+=.02;p.x+=Math.sin(p.d)*.6;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});if(e<6000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
drawPers();drawGC();drawQuick();avail();
</script></body></html>
