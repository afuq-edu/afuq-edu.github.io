:root{--bg:#f6f7fb;--card:#fff;--ink:#283044;--mute:#6b7285;--h1:#e4f2ec;--h2:#5f9e83;--ok:#7cc4a0;--okb:#e5f5ec;--no:#e9a3a3;--nob:#fbecec;--line:#e1e4ee}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Taj,Tahoma,sans-serif;background:radial-gradient(circle at 15% 10%,var(--h1),transparent 45%),radial-gradient(circle at 90% 90%,#fdf1e6,transparent 40%),var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer}
.scr{display:none;min-height:100vh;padding:clamp(10px,2.5vw,28px);animation:fade .45s ease}.scr.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand{font-weight:700;font-size:clamp(1rem,2.2vw,1.35rem);color:var(--ink)}.brand small{display:block;font-weight:400;color:var(--mute);font-size:.8em}
.mute{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.5vw,26px);max-width:980px;margin:0 auto;box-shadow:0 10px 30px rgba(60,70,110,.06)}
.step{margin-bottom:18px}.step h3{margin:0 0 8px;font-size:1.02rem;color:var(--ink)}.step h3 span{display:inline-block;width:26px;height:26px;line-height:27px;border-radius:50%;background:var(--h1);text-align:center;margin-left:6px;font-size:.85rem}
select,input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfcff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:8px 14px;color:var(--ink);text-align:right}
.chip.on{background:var(--h1);border-color:var(--h2);font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;accent-color:var(--h2)}.range b{min-width:42px;text-align:center;font-size:1.3rem}
.note{color:var(--mute);font-size:.88rem;margin-top:6px}
.go{display:block;width:100%;border:0;border-radius:16px;padding:14px;background:var(--h2);color:#fff;font-weight:700;font-size:1.2rem;margin-top:8px;transition:transform .15s}.go:hover{transform:translateY(-1px)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:1150px;margin:0 auto 10px}
.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.92rem}
.turns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1150px;margin:0 auto 10px}
.turn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;color:var(--ink);transition:all .25s}
.turn.on{border-color:var(--h2);background:var(--h1);font-weight:700;transform:scale(1.05)}.turn[disabled]{cursor:default}
.qbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;max-width:1150px;margin:0 auto}
.ring{position:relative;width:clamp(96px,13vw,150px);height:clamp(96px,13vw,150px)}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:#e9ecf4}.ring .fg{stroke:var(--h2);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .4s}
.ring.over .fg{stroke:#e6b673}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.6rem)}
.ring .num small{font-size:.38em;font-weight:500;color:var(--mute)}
.qtext{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.6vw,28px);font-size:clamp(1.2rem,2.7vw,2.05rem);font-weight:700;line-height:1.75;min-height:120px;display:flex;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1150px;margin:16px auto 0}
.opt{border:2px solid transparent;border-radius:18px;padding:clamp(12px,2vw,22px);font-size:clamp(1.05rem,2.3vw,1.6rem);font-weight:700;text-align:right;display:flex;gap:12px;align-items:center;color:var(--ink);transition:transform .15s,opacity .3s,border-color .3s,background .3s}
.opt:hover{transform:translateY(-2px)}.opt i{font-style:normal;width:38px;height:38px;flex:none;border-radius:12px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.o0{background:#e3effd}.o1{background:#fdebe0}.o2{background:#e5f4ea}.o3{background:#f3e8fb}
.opt.right{border-color:var(--ok);background:var(--okb)}.opt.wrong{border-color:var(--no);background:var(--nob)}.opt.dim{opacity:.45}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:1150px;margin:14px auto 0;align-items:center}
.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 18px;color:var(--ink)}
.prim{border:0;border-radius:12px;padding:10px 22px;background:var(--h2);color:#fff;font-weight:700}
.fb{font-size:1.25rem;font-weight:700;min-height:1.6em;text-align:center}
.pop{display:inline-block;animation:pop .6s ease}@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:clamp(260px,52vh,460px);padding:14px 10px 0;border-bottom:2px solid var(--line);max-width:1000px;margin:10px auto 0}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:clamp(60px,12vw,130px)}
.col .val{font-weight:700;font-size:1.15rem;margin-bottom:6px}
.col .b{width:100%;border-radius:14px 14px 4px 4px;height:4px;transition:height 1.2s cubic-bezier(.2,.8,.2,1);position:relative}
.col.win .b{box-shadow:0 0 0 3px #f2d48a,0 8px 22px rgba(230,180,90,.35)}
.col .rk{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:.85rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.names2{display:flex;justify-content:center;gap:clamp(10px,3vw,34px);max-width:1000px;margin:8px auto 0}
.names2 div{width:clamp(60px,12vw,130px);text-align:center;font-weight:700;font-size:.95rem}
.tag{display:inline-block;background:#fff6dd;border:1px solid #f2d48a;border-radius:999px;padding:2px 10px;font-size:.8rem;margin-top:3px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:clamp(260px,50vh,420px);margin-top:20px}
.pl{width:clamp(90px,18vw,190px);text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end}.pl .blk{border-radius:16px 16px 6px 6px;display:flex;align-items:flex-start;justify-content:center;font-size:2rem;font-weight:700;padding-top:12px;height:0;transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.pl .nm{font-weight:700;font-size:1.15rem;margin-bottom:6px}.pl .sc{color:var(--mute);margin-bottom:6px}
.p1 .blk{background:#f6e3a7}.p2 .blk{background:#e3e7ef}.p3 .blk{background:#f1d7c3}

$('qn').oninput=e=>{st.n=+e.target.value;$('qv').textContent=st.n;drawQuick()};
function drawQuick(){const b=$('quick');b.innerHTML='';[5,10,15,20].forEach(v=>{const c=document.createElement('button');c.type='button';c.className='chip'+(v==st.n?' on':'');c.textContent=v+' أسئلة';if(v>10)c.textContent=v+' سؤالًا';c.onclick=()=>{st.n=v;$('qn').value=v;$('qv').textContent=v;drawQuick()};b.appendChild(c)})}
function avail(){const L=D[st.l];const a=L.q.filter(q=>q[0]==st.p+1).length;$('avail').textContent=`أسئلة هذه الحصة: ${a} — أسئلة الدرس كله: ${L.q.length}. تُقدَّم أسئلة الحصة المختارة أولًا ثم تُكمَل من حصص الدرس الأخرى، مرتبة من الأسهل إلى الأصعب.`}
$('tm').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.tm=c.dataset.v;$('tm').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==c))});
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(){const L=D[st.l];const mine=shuf(L.q.filter(q=>q[0]==st.p+1)),oth=shuf(L.q.filter(q=>q[0]!=st.p+1));
const sel=mine.concat(oth).slice(0,Math.min(st.n,L.q.length));const idx=sel.map((q,i)=>[q,i]);idx.sort((x,y)=>x[0][1]-y[0][1]||x[1]-y[1]);
return idx.map(([q])=>{let o,c;if(q[2]=='t'){o=['صواب','خطأ'];c=q[4][0]=='ص'?0:1}else{const s=shuf(q[4].map((t,i)=>[t,i]));o=s.map(x=>x[0]);c=s.findIndex(x=>x[1]==0)}return{p:q[0],l:q[1],t:q[2],q:q[3],o,c}})}
$('start').onclick=()=>{ac();st.names=[...$('gn').querySelectorAll('input')].map((x,i)=>x.value.trim()||('المجموعة '+(i+1)));begin()};
function begin(){G=st.names.map((n,i)=>({n,s:0,c:GC[i%GC.length]}));last={};Q=pick();qi=0;askQ()}
// ---------- question
const R=2*Math.PI*52;$('arc').style.strokeDasharray=R;
function points(t){return t<=30?Math.round(1000-500*t/30):Math.max(100,Math.round(500-400*(t-30)/30))}
function drawTurns(){const b=$('turns');b.innerHTML='';G.forEach((g,i)=>{const c=document.createElement('button');c.type='button';c.className='turn'+(i==cur?' on':'');c.style.borderColor=i==cur?g.c:'';c.textContent=(i==cur?'دور: ':'')+g.n;if(st.tm=='tch'&&!answered){c.onclick=()=>{cur=i;drawTurns()}}else c.disabled=true;b.appendChild(c)})}
function askQ(){answered=false;const q=Q[qi];cur=qi%G.length;show('s2');
$('qnum').textContent=`السؤال ${qi+1} من ${Q.length}`;$('qlvl').textContent='المستوى: '+LV[q.l];$('qper').textContent=`من الحصة ${q.p}`+(q.t=='t'?' — صواب أم خطأ':q.t=='c'?' — أكمل الفراغ':' — اختيار من متعدد');
drawTurns();$('qt').textContent=q.q;$('fb').textContent='';$('toRes').style.display='none';$('skip').style.display='';
const b=$('opts');b.innerHTML='';b.style.gridTemplateColumns=q.o.length==2?'1fr 1fr':'';
q.o.forEach((t,i)=>{const c=document.createElement('button');c.type='button';c.className='opt o'+i;const s=document.createElement('i');s.textContent=SH[i];c.appendChild(s);c.appendChild(document.createTextNode(t));c.onclick=()=>answer(i);b.appendChild(c)});
t0=performance.now();clearInterval(tick);$('ring').classList.remove('over');tick=setInterval(upd,200);upd()}
function upd(){const t=(performance.now()-t0)/1000;const left=Math.max(0,30-t);$('sec').textContent=t<=30?Math.ceil(left):'+'+Math.floor(t-30);
$('arc').style.strokeDashoffset=t<=30?R*(1-left/30):0;$('ring').classList.toggle('over',t>30);$('pts').textContent=points(t)+' نقطة'}
function answer(i){if(answered)return;answered=true;clearInterval(tick);const q=Q[qi];const t=(performance.now()-t0)/1000;const ok=i===q.c;const p=ok?points(t):0;
G[cur].s+=p;last={g:cur,p};[...$('opts').children].forEach((c,k)=>{c.disabled=true;if(k==q.c)c.classList.add('right');else if(k==i)c.classList.add('wrong');else c.classList.add('dim')});
$('fb').innerHTML='';const s=document.createElement('span');s.className='pop';s.textContent=i===-1?`لم تُجب ${G[cur].n} — الإجابة الصحيحة: ${q.o[q.c]}`:ok?`إجابة صحيحة! +${p} نقطة لـ ${G[cur].n}`:`إجابة غير صحيحة — الصحيحة: ${q.o[q.c]}`;$('fb').appendChild(s);
ok?snd.ok():snd.no();drawTurns();$('skip').style.display='none';$('toRes').style.display=''}
$('skip').onclick=()=>answer(-1);$('toRes').onclick=results;
// ---------- results
function ranks(){const s=G.map((g,i)=>[g.s,i]).sort((a,b)=>b[0]-a[0]);const r=[];let k=0;s.forEach((x,j)=>{if(j>0&&x[0]<s[j-1][0])k=j;r[x[1]]=k+1});return r}
function results(){show('s3');snd.bars();$('rtitle').textContent=`الترتيب بعد السؤال ${qi+1} من ${Q.length}`;const mx=Math.max(1000,...G.map(g=>g.s));const r=ranks();
const ch=$('chart'),cn=$('cn');ch.innerHTML='';cn.innerHTML='';
G.forEach((g,i)=>{const c=document.createElement('div');c.className='col'+(last.g==i&&last.p>0?' win':'');const v=document.createElement('div');v.className='val';v.textContent=g.s;const b=document.createElement('div');b.className='b';b.style.background=g.c;
const rk=document.createElement('span');rk.className='rk';rk.textContent=r[i];b.appendChild(rk);c.appendChild(v);c.appendChild(b);ch.appendChild(c);
const nm=document.createElement('div');nm.textContent=g.n;if(last.g==i&&last.p>0){const tg=document.createElement('div');tg.className='tag';tg.textContent='فازت بالسؤال +'+last.p;nm.appendChild(tg)}cn.appendChild(nm);
requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.height=Math.max(4,g.s/mx*100*0.86)+'%'}))});
$('next').textContent=qi+1<Q.length?'السؤال التالي':'النتيجة النهائية'}
$('next').onclick=()=>{qi++;qi<Q.length?askQ():final()};
// ---------- final
function final(){show('s4');snd.end();$('fsub').textContent=`${D[st.l].t} — ${Q.length} ${Q.length<=10&&Q.length>2?'أسئلة':'سؤالًا'}`;
const s=G.map((g,i)=>({...g,i})).sort((a,b)=>b.s-a.s);const r=ranks();const pod=$('pod');pod.innerHTML='';
const order=[1,0,2].filter(k=>k<s.length);const H={0:1,1:.72,2:.52};
order.forEach(k=>{const g=s[k];const d=document.createElement('div');d.className='pl p'+(k+1);d.innerHTML='';const nm=document.createElement('div');nm.className='nm';nm.textContent=g.n;const sc=document.createElement('div');sc.className='sc';sc.textContent=g.s+' نقطة';
const bl=document.createElement('div');bl.className='blk';bl.textContent=['🥇','🥈','🥉'][k];d.appendChild(nm);d.appendChild(sc);d.appendChild(bl);pod.appendChild(d);setTimeout(()=>{const ph=Math.max(120,pod.clientHeight-80);bl.style.height=Math.round(ph*H[k])+'px'},120+k*250)});
const rk=$('rank');rk.innerHTML='';s.forEach(g=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=`${r[g.i]}. ${g.n}`;const b=document.createElement('b');b.textContent=g.s;d.appendChild(a);d.appendChild(b);rk.appendChild(d)});confetti()}
$('again').onclick=begin;$('newg').onclick=()=>show('s1');
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#f6d77a','#a9c8ef','#f2b9a0','#a8d8bb','#d3b7ec'];
const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:3+Math.random()*4,v:.6+Math.random()*1.3,d:Math.random()*6.28,c:cols[Math.floor(Math.random()*cols.length)]}));
const t1=performance.now();(function f(){const e=performance.now()-t1;x.clearRect(0,0,c.width,c.height);x.globalAlpha=e<4500?1:Math.max(0,1-(e-4500)/1500);
P.forEach(p=>{p.y+=p.v;p.d+=.02;p.x+=Math.sin(p.d)*.6;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});if(e<6000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
drawPers();drawGC();drawQuick();avail();
</script></body></html>
