\nيمرر المعلم على المجموعات قواقع وأوراق أشجار وقطع جذوع ويسأل: صنّفوا ما تلمسونه إلى خشن وناعم، ويلمس الطالب العناصر ويصنّفها ويصف ملمس كل منها.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nالتعلم القبلي: أشرطة تدرج الملمس المنفذة في الحصة السابقة.\nيعرض المعلم مكعبًا تحت مصدر ضوء ويسأل: لماذا تختلف درجة إضاءة أوجهه؟ ويحدد الطالب الوجه المضيء والوجه المظلل بحسب اتجاه الضوء.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nالتعلم القبلي: رسم الملامس الطبيعية وتدرجها.\nيعرض المعلم صورًا لأعمال تركيبية في الفراغ (ص 11) ويسأل: كيف تحولت الوحدات الصغيرة إلى عمل كبير؟ ويلاحظ الطالب أن التكرار والتجميع صنعا عملًا واحدًا.", "الحصة 1: أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يمرر المعلم على المجموعات قواقع وأوراق أشجار وقطع جذوع ويسأل: صنّفوا ما تلمسونه إلى خشن وناعم، ويلمس الطالب العناصر ويصنّفها ويصف ملمس كل منها (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. من الحقيقي إلى الإيهامي: يعرض المعلم صور الملامس (ص 13) ويوضح الفرق بين الملمس الحقيقي الذي يُلمس والإيهامي الذي يُرى بالرسم، ويقارن الطالب بين ملمس العنصر الحقيقي وصورته المرسومة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نمذجة التدرج: ينمذج المعلم على السبورة تدرج ملمس من الشدة إلى الخفة بطريقتي التكبير والتصغير، والتقارب والتباعد، ويلاحظ الطالب الطريقتين ويحدد أيهما سيستخدم (8 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\n4. رسم الأشرطة الثلاثة: يطلب المعلم رسم ثلاثة أشرطة بمقاس (3×15) سم واختيار ثلاثة عناصر مختلفة الملمس ويتابع التنفيذ، ويرسم كل ملمس في شريط متدرجًا من الشدة إلى الخفة (17 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يطلب المعلم عرض شريط واحد من كل مجموعة، ويتحدث الطالب عن تحقق درجات الملمس في أشرطته (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم مكعبًا تحت مصدر ضوء ويسأل: لماذا تختلف درجة إضاءة أوجهه؟ ويحدد الطالب الوجه المضيء والوجه المظلل بحسب اتجاه الضوء (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. نمذجة الرسم والتظليل: ينمذج المعلم رسم مكعب أو أسطوانة وتظليل الأوجه وفق مصدر ضوء محدد، ويتابع الطالب ويختار الشكل الهندسي (كرة، مكعب، منشور، هرم، مخروط، أسطوانة) (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. رسم الشكل وتظليله: يتابع المعلم الرسم في مساحة لا تقل عن (15×15) سم، ويرسم الطالب الشكل ويظلل أوجهه بحسب اتجاه الضوء (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. إكساب الشكل الملمس: يوجه المعلم إلى نقل ملمس من أشرطته إلى الشكل بكثافة أكبر في الظل وأقل في الضوء، ويرسم الطالب الملامس على الشكل مستفيدًا من تجربته السابقة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: يطلب المعلم تلخيص ما نُفذ في النشاط، ويلخص الطالب خطوات النشاط ويتحدث عن تحقق درجات الملمس (3 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورًا لأعمال تركيبية في الفراغ (ص 11) ويسأل: كيف تحولت الوحدات الصغيرة إلى عمل كبير؟ ويلاحظ الطالب أن التكرار والتجميع صنعا عملًا واحدًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ملاحظة النمط: يعرض المعلم نماذج لتكرار الملمس (النمط) ويوضح أن النمط وحدة ملمسية تتكرر بانتظام، ويحدد الطالب الوحدة المتكررة في النماذج (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. رسم النمط على الإفراد: يوزع المعلم ورقة النشاط (الإفراد الهندسي ص 23) ويتابع رسم النمط في المساحات المحددة وتلوينه، ويرسم الطالب النمط الملمسي ويلونه على أوجه المكعب (13 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. القص واللصق: يتابع المعلم قص الإفراد وطيه ولصقه، ويقص الطالب أوجه المكعب ويلصقها ليتكون المكعب (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. الختام: ينظم المعلم تجميع مكعبات الطلبة في تركيب فراغي ويوجه لإحضار صور لعناصر طبيعية للدرس القادم، ويشارك الطالب في تجميع المكعبات ويتأمل العمل التركيبي (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – ملامس من أرض عمان: تتعاون المجموعات في تسمية ملامس من الطبيعة العمانية (جذع النخلة، رمال الشرقية، صخور الجبل الأخضر، أصداف الشاطئ) وتصنيفها إلى خشنة وناعمة، ثم تذكر كل مجموعة سلوكًا يحافظ على هذه البيئة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة\nس1 (مستوى المعرفة): ما الفرق بين الملمس الحقيقي والملمس الإيهامي؟\nالإجابة: الحقيقي يُدرك باللمس، والإيهامي يُدرك بالنظر من خلال الرسم.\n\nس2 (مستوى التطبيق): اذكر طريقتين لإظهار تدرج الملمس في الرسم.\nالإجابة: التكبير والتصغير، والتقارب والتباعد.\n\nس3 (مستوى الاستدلال): كيف تُظهر قيمة الملمس عمقًا في الرسم؟\nالإجابة: بتغيير كثافة الملمس فيبدو الكثيف قريبًا داكنًا والمتباعد بعيدًا فاتحًا.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nس1 (مستوى المعرفة): سمِّ ثلاثة أشكال هندسية ثلاثية الأبعاد.\nالإجابة: الكرة والمكعب والأسطوانة (أو الهرم والمخروط والمنشور).\n\nس2 (مستوى التطبيق): أين يكون الملمس أكثف على الشكل المظلل؟\nالإجابة: في الجهة المظللة البعيدة عن مصدر الضوء.\n\nس3 (مستوى الاستدلال): لماذا يزيد الملمس المتدرج من الإحساس بالتجسيم؟\nالإجابة: لأنه يحاكي توزيع الضوء والظل فيبدو الشكل بارزًا ذا حجم.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nس1 (مستوى المعرفة): ما المقصود بالنمط الملمسي؟\nالإجابة: وحدة ملمسية تتكرر بانتظام على السطح.\n\nس2 (مستوى التطبيق): ما الإفراد الهندسي للمكعب؟\nالإجابة: الشكل المسطح لأوجه المكعب الستة قبل طيها ولصقها.\n\nس3 (مستوى الاستدلال): كيف يغير تجميع المكعبات إحساس المشاهد بالفراغ؟\nالإجابة: يحول الفراغ إلى عمل يتفاعل معه المشاهد من زوايا متعددة.", "الحصة 1: أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة\nس1 (مستوى المعرفة): صنّف: جذع النخلة، ورقة الشجر الطرية.\nالإجابة: جذع النخلة خشن، والورقة الطرية ناعمة.\n\nس2 (مستوى التطبيق): اشرح كيف أظهرت التدرج في أحد أشرطتك.\nالإجابة: إجابة تذكر استخدام التقارب في البداية ثم التباعد تدريجيًا أو التكبير ثم التصغير.\n\nس3 (مستوى الاستدلال): قيّم أي الطريقتين أنجح في إظهار التدرج لملمس قشرة الشجر، وعلّل.\nالإجابة: إجابة تقويمية معللة، مثل: التقارب والتباعد؛ لأن خطوط القشرة تتكاثف وتتباعد طبيعيًا.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nس1 (مستوى المعرفة): ما أقل مساحة لرسم الشكل في هذا النشاط؟\nالإجابة: (15×15) سم.\n\nس2 (مستوى التطبيق): صف كيف وزعت الملمس على أوجه شكلك.\nالإجابة: إجابة تذكر تكثيف الملمس في الوجه المظلل وتخفيفه في الوجه المضيء.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يجعل الإحساس بالضوء في عملك أوضح.\nالإجابة: زيادة التباين بين كثافة الملمس في الظل وخفته في الضوء.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nس1 (مستوى المعرفة): كم وجهًا للمكعب رسمت عليه النمط؟\nالإجابة: ستة أوجه.\n\nس2 (مستوى التطبيق): صف طريقة تحويل الملمس الطبيعي إلى نمط خطي بسيط.\nالإجابة: تبسيط خطوط الملمس الطبيعي إلى وحدة خطية ثم تكرارها بانتظام.\n\nس3 (مستوى الاستدلال): اقترح مكانًا في المدرسة لعرض العمل التركيبي مع التعليل.\nالإجابة: مثال: بهو المدرسة؛ لأنه يتيح رؤية العمل من جميع الجهات.", "الحصة 1: أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة\nإرشاد للطالب: يتأمل ملامس عناصر الطبيعة في بيئته (الصخور، النخيل، الأصداف).\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة تنوع الملامس في الطبيعة تفكرًا في خلق الله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 11–14.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nإرشاد للطالب: يلاحظ ظلال الأشياء من حوله وتغيرها بتغير مصدر الضوء.\nإرشاد لولي الأمر: يتابع مع ابنه أعماله ويثني على دقته.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 14–16.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nإرشاد للطالب: يحضر صورًا لعناصر من الطبيعة (زهور، أوراق، خلايا نحل) للدرس القادم.\nإرشاد لولي الأمر: يساعد ابنه في جمع صور لعناصر طبيعية.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 18–23.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=1"]}, {"title": "الدرس الثاني: نستلهم من العمارة العمانية", "unit": "الوحدة الأولى: رحلة  عرض البيانات\n2. صورة توضيحية\n3. أخرى: لوحات كانفس، أقلام رصاص", "1. التصميم المستوحى\n2. الوحدة الزخرفية المكررة\n3. الهوية العمانية", "التعلم القبلي: الوحدة الزخرفية ذات الملامس المنفذة في النشاط الأول.\nيعرض المعلم صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟ ويذكر الطالب الأقواس والزخارف النباتية والهندسية.", "1. التهيئة: يعرض المعلم صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟ ويذكر الطالب الأقواس والزخارف النباتية والهندسية (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. تحليل النوافذ: يحلل المعلم مع الطلبة أجزاء النافذة (القوس، الإطار، الضلف، المساحات الزخرفية)، ويحدد الطالب أجزاء النافذة التي سيصممها (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. رسم التصميم على الكانفس: يتابع المعلم رسم النافذة وتكرار الوحدة الزخرفية بالقلم الرصاص، ويرسم الطالب تصميم النافذة على الكانفس ويكرر وحدته (20 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يراجع المعلم التصاميم ويوضح أن المعالجة ستكون بعجينة الورق، ويعرض الطالب تصميمه ويستعد للمرحلة القادمة (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "س1 (مستوى المعرفة): اذكر جزأين من أجزاء النافذة العمانية.\nالإجابة: القوس والضلف (أو الإطار).\n\nس2 (مستوى التطبيق): لماذا نكرر الوحدة الزخرفية من النشاط الأول؟\nالإجابة: لربط التصميم بالملامس المستلهمة من الطبيعة وتحقيق الإيقاع.\n\nس3 (مستوى الاستدلال): اقترح طريقة لتمييز القوس عن بقية النافذة في التصميم.\nالإجابة: بزخرفة مختلفة أو حجم وحدات أصغر أو ملمس مختلف.", "س1 (مستوى المعرفة): على أي سطح ستنفذ النافذة؟\nالإجابة: لوحة الكانفس.\n\nس2 (مستوى التطبيق): كيف وزعت الوحدات في تصميمك؟\nالإجابة: إجابة تذكر التوزيع المتماثل أو المتكرر داخل مساحات الضلف.\n\nس3 (مستوى الاستدلال): قيّم تصميمك من حيث استلهام روح العمارة العمانية.\nالإجابة: تقييم معلل يذكر عناصر الاستلهام وما يمكن تعزيزه.", "إرشاد للطالب: يتأمل نوافذ البيوت القديمة في الحارات العمانية.\nإرشاد لولي الأمر: يحدث ابنه عن البيوت العمانية القديمة وتفاصيلها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 29–3 ادة تدوير الورق المستهلك بدل رميه.", "س1 (مستوى المعرفة): ما نوع الملمس الذي تمنحه العجينة للعمل؟\nالإجابة: ملمس حقيقي بارز.\n\nس2 (مستوى التطبيق): اذكر خطوات تجهيز العجينة بالترتيب.\nالإجابة: تقطيع الورق، نقعه، عصره، خلطه بالغراء، تقسيمه وتلوينه.\n\nس3 (مستوى الاستدلال): اقترح خامة مستهلكة أخرى يمكن استخدامها مع العجينة لتنويع الملمس.\nالإجابة: الرمل أو الخرز أو قشر البيض.", "إرشاد للطالب: يتعرف على خامات منزلية قابلة لإعادة التدوير في الفن.\nإرشاد لولي الأمر: يحفز ابنه على فرز الورق المستهلك للاستفادة منه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 30–31.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=2"]}, {"ax": "نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة", "n": 5, "w": "الأسبوع الثامن: من 25/10/2026 إلى 29/10/2026", "pg": "31–35", "f": ["1. يضيف خامات أخرى لإظهار تنوع الملامس في العمل (15 دقيقة)\n2. يصدر حكمًا على العمل من حيث تحقق التنوع الملمسي (5 دقائق)\nمخرج آخر: يقترح أماكن لتوظيف المنتج الفني ويسوقه (20 دقيقة)", "المخرج 1: إبداع\nالمخرج 2: تقييم\nالمخرج 3: إبداع", "1. التعلم الذاتي\n2. التعلم التشاركي\n3. التقويم الذاتي", "1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: خرز، رمل، بطاقة تقويم الوحدة", "1. التنوع الملمسي\n2. الإخراج الفني\n3. تسويق المنتج الفني", "التعلم القبلي: معالجة الوحدات بعجينة الورق الملونة.\nيعرض المعلم عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟ ويختار الطالب ويعلل بتنوع الملامس.", "1. التهيئة: يعرض المعلم عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟ ويختار الطالب ويعلل بتنوع الملامس (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. إضافة الخامات: يوجه المعلم إلى إضافة الخرز أو الرمل في مواضع محددة، ويضيف الطالب خامات لتنويع الملامس ويكمل عمله (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النشاط التسويقي: يطلب المعلم اقتراح أماكن لتوظيف المنتج (ديكور منزلي، هدايا) وتسعيرًا مبدئيًا، ويقترح الطالب أماكن لتوظيف منتجه وطريقة تسويقه (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n4. تقويم الوحدة: يوزع المعلم بطاق علم القبلي: الملامس الطبيعية وتحويلها إلى أنماط.\nيعرض المعلم صور أبواب ونوافذ عمانية مزخرفة (مصادر الإلهام ص 36) ويسأل: من أين استلهم الحرفي العماني هذه الزخارف؟ ويذكر الطالب عناصر طبيعية ظهرت في الزخارف (النخلة، الزهور، الرمان).\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nالتعلم القبلي: العنصر الطبيعي المبسط في ورقة النشاط.\nيعرض المعلم نافذة من مصادر الإلهام ويسأل: كيف ميز الفنان بين مساحات الوحدة الواحدة؟ ويلاحظ الطالب استخدام ملامس مختلفة (نقاط، خطوط، شبكات).\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nالتعلم القبلي: الوحدة الزخرفية ذات الملامس المنفذة في النشاط الأول.\nيعرض المعلم صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟ ويذكر الطالب الأقواس والزخارف النباتية والهندسية.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nالتعلم القبلي: تصميم النافذة على لوحة الكانفس.\nيعرض المعلم قطعة من عجينة الورق الجافة ويسأل: من أي شيء صُنعت؟ ويتوقع الطالب مكوناتها (ورق، ماء، غراء) ويتحسس ملمسها.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nالتعلم القبلي: معالجة الوحدات بعجينة الورق الملونة.\nيعرض المعلم عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟ ويختار الطالب ويعلل بتنوع الملامس.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صور أبواب ونوافذ عمانية مزخرفة (مصادر الإلهام ص 36) ويسأل: من أين استلهم الحرفي العماني هذه الزخارف؟ ويذكر الطالب عناصر طبيعية ظهرت في الزخارف (النخلة، الزهور، الرمان) (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. اختيار العنصر: يوضح المعلم المطلوب ويعرض أمثلة لعناصر طبيعية (الزهور، الأوراق، خلايا النحل)، ويختار الطالب عنصرًا طبيعيًا من صوره (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. نمذجة التبسيط: ينمذج المعلم تبسيط زهرة إلى خط خارجي واضح مع حذف التفاصيل الدقيقة، ويتابع الطالب ويجرب التبسيط على مسودة (8 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\n4. الرسم في ورقة النشاط: يوزع المعلم ورقة النشاط (ص 37) ويتابع رسم العنصر المبسط في المساحات المحددة، ويرسم الطالب العنصر المبسط في مساحات الباب أو النافذة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: يطلب المعلم الحفاظ على الورقة لاستكمالها، ويعرض الطالب تبسيطه ويحدد ما سيضيفه من ملامس (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نافذة من مصادر الإلهام ويسأل: كيف ميز الفنان بين مساحات الوحدة الواحدة؟ ويلاحظ الطالب استخدام ملامس مختلفة (نقاط، خطوط، شبكات) (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. إكساب الملامس: يوجه المعلم إلى تعبئة أجزاء الوحدة بملامس مختلفة مستفيدًا من أنماط الدرس الأول، ويملأ الطالب أجزاء العنصر المبسط بملامس متنوعة (18 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التكرار في التصميم: يوجه المعلم إلى تكرار الوحدة في مساحات الباب الأخرى بإيقاع منتظم، ويكرر الطالب الوحدة ويحقق إيقاعًا في التصميم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يناقش المعلم القيمة الجمالية للتنوع الملمسي ويوجه لإحضار خامات ورقية مستهلكة وصور لنوافذ عمانية، ويتحدث الطالب عن جمال التنوع الملمسي في تصميمه (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟ ويذكر الطالب الأقواس والزخارف النباتية والهندسية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تحليل النوافذ: يحلل المعلم مع الطلبة أجزاء النافذة (القوس، الإطار، الضلف، المساحات الزخرفية)، ويحدد الطالب أجزاء النافذة التي سيصممها (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. رسم التصميم على الكانفس: يتابع المعلم رسم النافذة وتكرار الوحدة الزخرفية بالقلم الرصاص، ويرسم الطالب تصميم النافذة على الكانفس ويكرر وحدته (20 دقيقة)\nالاستراتيجيات: التعلم بالملاحظة.\n\n4. الختام: يراجع المعلم التصاميم ويوضح أن المعالجة ستكون بعجينة الورق، ويعرض الطالب تصميمه ويستعد للمرحلة القادمة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم قطعة من عجينة الورق الجافة ويسأل: من أي شيء صُنعت؟ ويتوقع الطالب مكوناتها (ورق، ماء، غراء) ويتحسس ملمسها (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. تجهيز العجينة: ينمذج المعلم تقطيع الورق ونقعه وعصره وخلطه بالغراء مع تغطية الطاولات، ويجهز الطالب العجينة مع مجموعته (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. تقسيم العجينة وتلوينها: يوجه المعلم إلى تقسيم العجينة وتلوينها بحسب ألوان التصميم، ويقسم الطالب العجينة ويلونها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. معالجة الوحدات: يتابع المعلم تثبيت العجينة على الوحدات المكررة، ويعالج الطالب الوحدات الزخرفية بالعجينة الملونة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: يوجه المعلم إلى تنظيف المكان وحفظ الأعمال لتجف، وينظف الطالب أدواته ويحفظ عمله (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟ ويختار الطالب ويعلل بتنوع الملامس (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. إضافة الخامات: يوجه المعلم إلى إضافة الخرز أو الرمل في مواضع محددة، ويضيف الطالب خامات لتنويع الملامس ويكمل عمله (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. النشاط التسويقي: يطلب المعلم اقتراح أماكن لتوظيف المنتج (ديكور منزلي، هدايا) وتسعيرًا مبدئيًا، ويقترح الطالب أماكن لتوظيف منتجه وطريقة تسويقه (7 دقائق)\nالاستراتيجيات: التعلم بالملاحظة.\n\n4. تقويم الوحدة: يوزع المعلم بطاقة تقويم الوحدة (ص 34)، ويجيب الطالب عن بطاقة تقويم الوحدة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: ينظم المعلم عرضًا ويطلب إصدار حكم على تحقق التنوع الملمسي، ويصدر الطالب حكمًا على عمله وأعمال زملائه (6 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – محققو الحصون: تختار كل مجموعة معلمًا عمانيًا (قلعة نزوى، حصن جبرين، قلعة بهلا) وتصف ملامس جدرانه الطينية وأبوابه الخشبية المنقوشة، ثم يعرض المتحدث المرقم عنصرًا منه يصلح مصدر إلهام لعمل فني (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nس1 (مستوى المعرفة): ما المقصود بتبسيط العنصر الطبيعي؟\nالإجابة: رسمه بخطه الخارجي الأساسي وحذف التفاصيل الدقيقة.\n\nس2 (مستوى التطبيق): اذكر عنصرين طبيعيين ظهرا في زخارف النوافذ العمانية.\nالإجابة: النخلة والزهور (أو الرمان).\n\nس3 (مستوى الاستدلال): لماذا يناسب التبسيط الزخارف المعمارية؟\nالإجابة: لأنه يسهل التكرار والتنفيذ على الخشب والجص ويمنح وضوحًا بصريًا من بعيد.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nس1 (مستوى المعرفة): سمِّ ملمسين إيهاميين استخدمتهما في الوحدة.\nالإجابة: التنقيط والتهشير (أو الشبكة والخطوط المتموجة).\n\nس2 (مستوى التطبيق): ما أثر تكرار الوحدة الزخرفية في التصميم؟\nالإجابة: يحقق الإيقاع والوحدة والترابط في التصميم.\n\nس3 (مستوى الاستدلال): كيف تمنع التنوع الملمسي من أن يتحول إلى فوضى بصرية؟\nالإجابة: باختيار ملامس محدودة متناسقة وتوزيعها بنظام متكرر.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nس1 (مستوى المعرفة): اذكر جزأين من أجزاء النافذة العمانية.\nالإجابة: القوس والضلف (أو الإطار).\n\nس2 (مستوى التطبيق): لماذا نكرر الوحدة الزخرفية من النشاط الأول؟\nالإجابة: لربط التصميم بالملامس المستلهمة من الطبيعة وتحقيق الإيقاع.\n\nس3 (مستوى الاستدلال): اقترح طريقة لتمييز القوس عن بقية النافذة في التصميم.\nالإجابة: بزخرفة مختلفة أو حجم وحدات أصغر أو ملمس مختلف.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nس1 (مستوى المعرفة): ما مكونات عجينة الورق؟\nالإجابة: ورق مستهلك وماء وغراء.\n\nس2 (مستوى التطبيق): لماذا نستخدم ألوانًا ذات وسيط مائي لتلوين العجينة؟\nالإجابة: لأنها تمتزج بالعجينة الرطبة بسهولة.\n\nس3 (مستوى الاستدلال): كيف يسهم هذا النشاط في حماية البيئة؟\nالإجابة: بإعادة تدوير الورق المستهلك بدل رميه.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): اذكر خامتين أضفتهما لتنويع الملامس.\nالإجابة: الخرز والرمل.\n\nس2 (مستوى التطبيق): كيف تقيس نجاح التنوع الملمسي في عملك؟\nالإجابة: بوضوح الفروق بين الملامس وتناسقها مع التصميم.\n\nس3 (مستوى الاستدلال): صمم بطاقة تسويق مختصرة لمنتجك.\nالإجابة: اسم المنتج، فكرته المستلهمة من العمارة العمانية، استخدامه، مكان عرضه.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nس1 (مستوى المعرفة): ما العنصر الطبيعي الذي اخترته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف خطوات تبسيطك للعنصر.\nالإجابة: ملاحظة الشكل، تحديد خطه الخارجي، حذف التفاصيل، رسمه بخط واضح.\n\nس3 (مستوى الاستدلال): قارن بين عنصرك الطبيعي ومبسطه من حيث الشكل والوظيفة الزخرفية.\nالإجابة: المبسط يحافظ على الهيئة العامة ويصبح وحدة زخرفية قابلة للتكرار.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nس1 (مستوى المعرفة): أكمل: تكرار الوحدة الزخرفية يحقق ……… في التصميم.\nالإجابة: الإيقاع.\n\nس2 (مستوى التطبيق): وضّح القيمة الجمالية للتنوع الملمسي في تصميمك.\nالإجابة: يمنح التصميم ثراء بصريًا ويميز المساحات ويجذب العين.\n\nس3 (مستوى الاستدلال): انقد تصميم زميل من حيث توازن الملامس.\nالإجابة: نقد يذكر مواطن التوازن والازدحام ويقترح تعديلًا.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nس1 (مستوى المعرفة): على أي سطح ستنفذ النافذة؟\nالإجابة: لوحة الكانفس.\n\nس2 (مستوى التطبيق): كيف وزعت الوحدات في تصميمك؟\nالإجابة: إجابة تذكر التوزيع المتماثل أو المتكرر داخل مساحات الضلف.\n\nس3 (مستوى الاستدلال): قيّم تصميمك من حيث استلهام روح العمارة العمانية.\nالإجابة: تقييم معلل يذكر عناصر الاستلهام وما يمكن تعزيزه.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nس1 (مستوى المعرفة): ما نوع الملمس الذي تمنحه العجينة للعمل؟\nالإجابة: ملمس حقيقي بارز.\n\nس2 (مستوى التطبيق): اذكر خطوات تجهيز العجينة بالترتيب.\nالإجابة: تقطيع الورق، نقعه، عصره، خلطه بالغراء، تقسيمه وتلوينه.\n\nس3 (مستوى الاستدلال): اقترح خامة مستهلكة أخرى يمكن استخدامها مع العجينة لتنويع الملمس.\nالإجابة: الرمل أو الخرز أو قشر البيض.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): هل منتجك الفني قابل للتسويق؟ ولماذا؟\nالإجابة: نعم؛ لأنه جمالي يحمل هوية عمانية ويصلح ديكورًا أو هدية.\n\nس2 (مستوى التطبيق): ما رأيك في استغلال الخامات المهملة وإعادة تدويرها؟\nالإجابة: إجابة إيجابية معللة بحماية البيئة وإنتاج أعمال مفيدة.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث التنوع الملمسي واستلهام العمارة العمانية.\nالإجابة: نقد متوازن يذكر نقاط القوة واقتراح تحسين.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nإرشاد للطالب: يلاحظ زخارف الأبواب والنوافذ في المباني القديمة في ولايته.\nإرشاد لولي الأمر: يصطحب ابنه إلى معلم أثري إن تيسر لملاحظة زخارفه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 25–27.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nإرشاد للطالب: يجمع خامات ورقية مستهلكة (محارم، صحف) لعجينة الورق.\nإرشاد لولي الأمر: يشارك ابنه في جمع الخامات المستهلكة دعمًا لإعادة التدوير.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 27–28، 35–37.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nإرشاد للطالب: يتأمل نوافذ البيوت القديمة في الحارات العمانية.\nإرشاد لولي الأمر: يحدث ابنه عن البيوت العمانية القديمة وتفاصيلها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 29–30.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nإرشاد للطالب: يتعرف على خامات منزلية قابلة لإعادة التدوير في الفن.\nإرشاد لولي الأمر: يحفز ابنه على فرز الورق المستهلك للاستفادة منه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 30–31.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nإرشاد للطالب: يعرض منتجه على أسرته ويحتفظ به في ملف إنجازه.\nإرشاد لولي الأمر: يشجع ابنه على التفكير في تسويق أعماله الفنية.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 31–35.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: ن أنواع التكوين الفني.\nالإجابة: الأفقي والهرمي (أو الدائري والإشعاعي).\n\nس2 (مستوى التطبيق): بماذا يوحي التكوين الهرمي؟\nالإجابة: بالثبات والقوة والشموخ.\n\nس3 (مستوى الاستدلال): لماذا تختلف الأحاسيس باختلاف نوع التكوين؟\nالإجابة: لأن اتجاه الحركة وتوزيع الكتل يوجهان عين المشاهد ويثيران أحاسيس مختلفة.", "س1 (مستوى المعرفة): ما نوع التكوين في عمل إدريس الهوتي؟\nالإجابة: تكوين أفقي.\n\nس2 (مستوى التطبيق): صنف عملًا حروفيًا عُرض عليك وبيّن نوع تكوينه.\nالإجابة: إجابة صحيحة تحدد نوع التكوين بدليل من العمل.\n\nس3 (مستوى الاستدلال): أي التكوينات أنسب للتعبير عن قلعة عمانية؟ علّل.\nالإجابة: الهرمي؛ لأنه يوحي بالثبات والقوة والشموخ.", "إرشاد للطالب: يلاحظ التكوينات في الخط العربي على واجهات المساجد.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جمال الخط العربي في الأماكن التي يزورها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 48–49.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=4"]}, {"ax": "تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه", "n": 2, "w": "الأسبوع الثاني عشر: من 22/11/2026 إلى 26/11/2026", "pg": "50", "f": ["1. يرسم تكوينًا فنيًا من مفردات العمارة العمانية (15 دقيقة)\n2. يوزع الحروف العربية على التكوين بطريقة متوازنة (15 دقيقة)\nمخرج آخر: يستنتج أنواع التكوينات الفنية في أعمال زملائه (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "1. التعلم الذاتي\n2. التعلم التشاركي\n3. التفكير الإبداعي", "1. صورة توضيحية\n2. أخرى: أوراق رسم، أدوات رسم هندسي، ورق شفاف", "1. مفردات العمارة العمانية\n2. التوازن\n3. التكوين بالحروف", "التعلم القبلي: أنواع التكوينات الفنية بالحرف العربي.\nيعرض المعلم صور مفردات معمارية عمانية (أبراج، أقواس، شرفات) ويسأل: أي مفردة يمكن أن تتشكل من الحروف؟ ويقترح الطالب مفردة وحرفًا مناسبًا لها.", "1. التهيئة: يعرض المعلم صور مفردات معمارية عمانية (أبراج، أقواس، شرفات) ويسأل: أي مفردة يمكن أن تتشكل من الحروف؟ ويقترح الطالب مفردة وحرفًا مناسبًا لها (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. رسم التكوين المعماري: يتابع المعلم رسم تكوين معماري (برج، قوس، بوابة) بأدوات الرسم، ويرسم الطالب التكوين من مفردات العمارة العمانية (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. توزيع الحروف: يوجه المعلم إلى توزيع الحروف على أجزاء التكوين بتوازن مع مراعاة ترتيب الطبقات للمرحلة القادمة، ويوزع الطالب الحروف على التكوين ويستعين بالورق الشفاف لتجربة التوزيع (13 دقيقة)\nالاستراتيجيات: التفكير الإبداعي.\n\n4. الختام: يطلب المعلم استنتاج نوع التكوين في أعمال الزملاء وتلخيص التعلم، ويستنتج الطالب أنواع التكوين ويلخص ما تعلمه (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "س1 (مستوى المعرفة): اذكر مفردتين من مفردات العمارة العمانية.\nالإجابة: البرج والقوس (أو البوابة والشرفات).\n\nس2 (مستوى التطبيق): كيف تحقق التوازن في توزيع الحروف؟\nالإجابة: بتوزيعها بالتساوي على جانبي التكوين أو حول محوره.\n\nس3 (مستوى الاستدلال): لماذا نحدد ترتيب الطبقات في هذه المرحلة؟\nالإجابة: لأن التكوين سينفذ بطبقات بارزة من الكرتون في النشاط القادم.", "س1 (مستوى المعرفة): ما المفردة المعمارية التي رسمتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما نوع التكوين في عمل زميلك؟\nالإجابة: إجابة صحيحة تحدد النوع بدليل.\n\nس3 (مستوى الاستدلال): قيّم توازن توزيع الحروف في تكوينك.\nالإجابة: تقييم يذكر مواطن التوازن وما يحتاج تعديلًا.", "إرشاد للطالب: يتأمل الأبراج والقلاع العمانية ويلاحظ أشكالها.\nإرشاد لولي الأمر: يحدث ابنه عن معلم معماري عماني قريب.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 50.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=4"]}, {"ax": "تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات", "n": 3, "w": "الأسبوع الثالث عشر: من 29/11/2026 إلى 3/12/2026", "pg": "52", "f": ["1. ينقل التكوين الفني بحروفه العربية إلى الكرتون أو الورق المقوى (20 دقيقة)\n2. يحدد ترتيب الطبقات في التكوين (10 دقائق)\nمخرج آخر: يلتزم بقواعد الأمن والسلامة عند استخدام القاطع (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. أخرى: كرتون مقوى، ورق شفاف، قاطع معدني", "1. الطبقات\n2. النقل\n3. الأمن والسلامة", "التعلم القبلي: التكوين المعماري المرسوم بالحروف.\nيعرض المعلم نموذجًا لعمل كرتوني متعدد الطبقات ويسأل: كيف ظهر العمق دون رسم ظل؟ ويلاحظ الطالب أن الطبقات المرتفعة صنعت العمق.", "1. التهيئة: يعرض المعلم نموذجًا لعمل كرتوني متعدد الطبقات ويسأل: كيف ظهر العمق دون رسم ظل؟ ويلاحظ الطالب أن الطبقات المرتفعة صنعت العمق (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ترتيب الطبقات: يوضح المعلم تقسيم التكوين إلى طبقات (خلفية، وسط، أمامية) وترقيمها، ويرقم الطالب أجزاء تكوينه بحسب الطبقة (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. النقل إلى الكرتون: يتابع المعلم نقل الأجزاء إلى الكرتون باستخدام الورق الشفاف، وينقل الطالب أجزاء التكوين إلى الكرتون بدقة (20 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يذكّر المعلم بقواعد السلامة ويعرض طريقة القطع الآمن للحصة القادمة، ويراجع الطالب قواعد السلامة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "س1 (مستوى المعرفة): ما فائدة الورق الشفاف في النقل؟\nالإجابة: نقل التكوين بدقة إلى الكرتون.\n\nس2 (مستوى التطبيق): رتب طبقات التكوين من الخلف إلى الأمام.\nالإجابة: الخلفية، الوسط، الأمامية.\n\nس3 (مستوى الاستدلال): كيف يسهم ترتيب الطبقات في إبراز الحروف؟\nالإجابة: يجعل الحروف في طبقة أمامية بارزة فتلفت الانتباه.", "س1 (مستوى المعرفة): ما الخامة التي نُقل إليها التكوين؟\nالإجابة: الكرتون أو الورق المقوى.\n\nس2 (مستوى التطبيق): اذكر قاعدتي سلامة عند استخدام القاطع المعدني.\nالإجابة: القطع على سطح واقٍ، وتوجيه الشفرة بعيدًا عن اليد.\n\nس3 (مستوى الاستدلال): اقترح عدد الطبقات المناسب لتكوينك وعلّل.\nالإجابة: إجابة معللة بتعدد مستويات التكوين.", "إرشاد للطالب: يجهز كرتونًا مستعملًا نظيفًا للنشاط.\nإرشاد لولي الأمر: يتابع التزام ابنه بقواعد السلامة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 52.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=4"]}, {"ax": "تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف", "n": 4, "w": "الأسبوع الرابع عشر: من 6/12/2026 إلى 10/12/2026", "pg": "52–53", "f": ["1. يفرغ الأشكال ويقطعها بالقاطع المعدني بأمان (15 دقيقة)\n2. ي عربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nالتعلم القبلي: أجزاء التكوين المنقولة إلى الكرتون.\nيعرض المعلم قطعتين ملونتين: إحداهما حروفها بلون مميز والأخرى بلون الخلفية، ويسأل: أيهما أوضح؟ ويختار الطالب الحروف المميزة باللون.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nالتعلم القبلي: الأجزاء الملونة المفرغة.\nيسأل المعلم: كيف نجعل الطبقة الأمامية ترتفع عن الخلفية؟ ويقترح الطالب وضع قطع صغيرة بين الطبقات.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عملي إدريس الهوتي ومحمد الصائغ (ص 39) ويسأل: أي العملين يوحي بالاستقرار وأيهما بالحركة؟ ويقارن الطالب ويربط الإحساس باتجاه التكوين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تحليل التكوينات: يعرض المعلم أعمال إدريس الهوتي (تكوين أفقي) ومحمد الصائغ وعبدالقادر الريس (تكوين هرمي) ويحلل مع الطلبة، ويحدد الطالب نوع التكوين في كل عمل والإحساس الناتج منه (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة التصنيف: يوزع المعلم بطاقات صور لأعمال حروفية ويطلب تصنيفها بحسب نوع التكوين، ويصنف الطالب البطاقات مع مجموعته (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. خريطة ذهنية: يبني المعلم مع الطلبة خريطة ذهنية لأنواع التكوينات وإحساس كل منها، ويكمل الطالب فروع الخريطة الذهنية (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يمهد المعلم لرسم تكوين من مفردات العمارة العمانية، ويقترح الطالب مفردة معمارية سيعتمد عليها (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صور مفردات معمارية عمانية (أبراج، أقواس، شرفات) ويسأل: أي مفردة يمكن أن تتشكل من الحروف؟ ويقترح الطالب مفردة وحرفًا مناسبًا لها (5 دقائق)\nالاستراتيجيات: التفكير الإبداعي.\n\n2. رسم التكوين المعماري: يتابع المعلم رسم تكوين معماري (برج، قوس، بوابة) بأدوات الرسم، ويرسم الطالب التكوين من مفردات العمارة العمانية (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. توزيع الحروف: يوجه المعلم إلى توزيع الحروف على أجزاء التكوين بتوازن مع مراعاة ترتيب الطبقات للمرحلة القادمة، ويوزع الطالب الحروف على التكوين ويستعين بالورق الشفاف لتجربة التوزيع (13 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يطلب المعلم استنتاج نوع التكوين في أعمال الزملاء وتلخيص التعلم، ويستنتج الطالب أنواع التكوين ويلخص ما تعلمه (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نموذجًا لعمل كرتوني متعدد الطبقات ويسأل: كيف ظهر العمق دون رسم ظل؟ ويلاحظ الطالب أن الطبقات المرتفعة صنعت العمق (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ترتيب الطبقات: يوضح المعلم تقسيم التكوين إلى طبقات (خلفية، وسط، أمامية) وترقيمها، ويرقم الطالب أجزاء تكوينه بحسب الطبقة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النقل إلى الكرتون: يتابع المعلم نقل الأجزاء إلى الكرتون باستخدام الورق الشفاف، وينقل الطالب أجزاء التكوين إلى الكرتون بدقة (20 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الختام: يذكّر المعلم بقواعد السلامة ويعرض طريقة القطع الآمن للحصة القادمة، ويراجع الطالب قواعد السلامة (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم قطعتين ملونتين: إحداهما حروفها بلون مميز والأخرى بلون الخلفية، ويسأل: أيهما أوضح؟ ويختار الطالب الحروف المميزة باللون (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التفريغ والقطع: يتابع المعلم القطع ويقدم المساعدة في المنحنيات الدقيقة، ويفرغ الطالب الأشكال ويقطعها بحذر (15 دقيقة)\nالاستراتيجيات: التفكير الإبداعي.\n\n3. التلوين: يوجه المعلم إلى استخدام تباين لوني يبرز الحروف، والطلبة يلون الأجزاء بألوان الأكريليك (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يوجه المعلم للتنظيف وحفظ الأجزاء لتجف، وينظف الطالب الفرش ويحفظ أجزاءه (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف نجعل الطبقة الأمامية ترتفع عن الخلفية؟ ويقترح الطالب وضع قطع صغيرة بين الطبقات (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. تجهيز الدعامات: يوجه المعلم إلى تجهيز قطع كرتون صغيرة وتلوينها ولصقها خلف الشرائح، ويجهز الطالب الدعامات ويلصقها (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تجميع الطبقات: يتابع المعلم لصق الطبقات بالترتيب، ويلصق الطالب الطبقات ليبرز التكوين المعماري بالحروف (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تقويم الوحدة: يوزع المعلم بطاقة تقويم الوحدة (ص 54)، ويجيب الطالب عن بطاقة التقويم (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. الختام: يناقش المعلم أفكار الاستفادة من الأعمال (لوحة جدارية، غلاف، هدية)، ويقترح الطالب طريقة للاستفادة من عمله وتسويقه (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – وطني بحروف عربية: تصمم كل مجموعة تكوينًا سريعًا أفقيًا أو دائريًا بتكرار حروف كلمة «عُمان» أو «وطني»، وتلوّنه بألوان العلم العماني، ثم تعرضه وتوضح نوع التكوين الذي اختارته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي\nس1 (مستوى المعرفة): سمِّ نوعين من أنواع التكوين الفني.\nالإجابة: الأفقي والهرمي (أو الدائري والإشعاعي).\n\nس2 (مستوى التطبيق): بماذا يوحي التكوين الهرمي؟\nالإجابة: بالثبات والقوة والشموخ.\n\nس3 (مستوى الاستدلال): لماذا تختلف الأحاسيس باختلاف نوع التكوين؟\nالإجابة: لأن اتجاه الحركة وتوزيع الكتل يوجهان عين المشاهد ويثيران أحاسيس مختلفة.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه\nس1 (مستوى المعرفة): اذكر مفردتين من مفردات العمارة العمانية.\nالإجابة: البرج والقوس (أو البوابة والشرفات).\n\nس2 (مستوى التطبيق): كيف تحقق التوازن في توزيع الحروف؟\nالإجابة: بتوزيعها بالتساوي على جانبي التكوين أو حول محوره.\n\nس3 (مستوى الاستدلال): لماذا نحدد ترتيب الطبقات في هذه المرحلة؟\nالإجابة: لأن التكوين سينفذ بطبقات بارزة من الكرتون في النشاط القادم.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات\nس1 (مستوى المعرفة): ما فائدة الورق الشفاف في النقل؟\nالإجابة: نقل التكوين بدقة إلى الكرتون.\n\nس2 (مستوى التطبيق): رتب طبقات التكوين من الخلف إلى الأمام.\nالإجابة: الخلفية، الوسط، الأمامية.\n\nس3 (مستوى الاستدلال): كيف يسهم ترتيب الطبقات في إبراز الحروف؟\nالإجابة: يجعل الحروف في طبقة أمامية بارزة فتلفت الانتباه.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nس1 (مستوى المعرفة): ما الأداة المستخدمة للتفريغ؟\nالإجابة: القاطع المعدني.\n\nس2 (مستوى التطبيق): كيف تبرز الحروف باللون؟\nالإجابة: باستخدام لون متباين مع لون الخلفية.\n\nس3 (مستوى الاستدلال): اقترح ألوانًا مستوحاة من العمارة العمانية لتكوينك.\nالإجابة: ألوان ترابية (البيج، البني) مع لمسات من الأبيض والأزرق.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): ما وظيفة الدعامات في العمل؟\nالإجابة: رفع الطبقات لإبراز العمق.\n\nس2 (مستوى التطبيق): كيف أبرزت الحروف جمال التكوين المعماري؟\nالإجابة: أضافت إيقاعًا وهوية وزخرفة للأشكال المعمارية.\n\nس3 (مستوى الاستدلال): اقترح منتجًا نفعيًا يمكن تطويره من عملك.\nالإجابة: مثال: لوحة جدارية للمنازل أو غلاف دفتر بارز.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي\nس1 (مستوى المعرفة): ما نوع التكوين في عمل إدريس الهوتي؟\nالإجابة: تكوين أفقي.\n\nس2 (مستوى التطبيق): صنف عملًا حروفيًا عُرض عليك وبيّن نوع تكوينه.\nالإجابة: إجابة صحيحة تحدد نوع التكوين بدليل من العمل.\n\nس3 (مستوى الاستدلال): أي التكوينات أنسب للتعبير عن قلعة عمانية؟ علّل.\nالإجابة: الهرمي؛ لأنه يوحي بالثبات والقوة والشموخ.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه\nس1 (مستوى المعرفة): ما المفردة المعمارية التي رسمتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما نوع التكوين في عمل زميلك؟\nالإجابة: إجابة صحيحة تحدد النوع بدليل.\n\nس3 (مستوى الاستدلال): قيّم توازن توزيع الحروف في تكوينك.\nالإجابة: تقييم يذكر مواطن التوازن وما يحتاج تعديلًا.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات\nس1 (مستوى المعرفة): ما الخامة التي نُقل إليها التكوين؟\nالإجابة: الكرتون أو الورق المقوى.\n\nس2 (مستوى التطبيق): اذكر قاعدتي سلامة عند استخدام القاطع المعدني.\nالإجابة: القطع على سطح واقٍ، وتوجيه الشفرة بعيدًا عن اليد.\n\nس3 (مستوى الاستدلال): اقترح عدد الطبقات المناسب لتكوينك وعلّل.\nالإجابة: إجابة معللة بتعدد مستويات التكوين.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nس1 (مستوى المعرفة): ما نوع الألوان المستخدمة في التلوين؟\nالإجابة: ألوان الأكريليك.\n\nس2 (مستوى التطبيق): وضّح كيف حققت التباين في عملك.\nالإجابة: إجابة تذكر لون الحروف ولون الخلفية المتباين.\n\nس3 (مستوى الاستدلال): قيّم دقة القطع في عملك واقترح تحسينًا.\nالإجابة: تقييم يذكر وضوح الحواف واقتراح القطع ببطء أو استخدام مسطرة.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): هل منتجك الفني قابل للتسويق؟\nالإجابة: إجابة معللة.\n\nس2 (مستوى التطبيق): تحدث عن أهمية الحروف العربية في عملك.\nالإجابة: تعبر عن الهوية وتضيف جمالًا وإيقاعًا للتكوين.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث وضوح الطبقات والتكوين.\nالإجابة: نقد يذكر وضوح المستويات واقتراح تحسين.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي\nإرشاد للطالب: يلاحظ التكوينات في الخط العربي على واجهات المساجد.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جمال الخط العربي في الأماكن التي يزورها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 48–49.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه\nإرشاد للطالب: يتأمل الأبراج والقلاع العمانية ويلاحظ أشكالها.\nإرشاد لولي الأمر: يحدث ابنه عن معلم معماري عماني قريب.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 50.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات\nإرشاد للطالب: يجهز كرتونًا مستعملًا نظيفًا للنشاط.\nإرشاد لولي الأمر: يتابع التزام ابنه بقواعد السلامة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 52.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nإرشاد للطالب: يتعرف على الألوان الترابية في العمارة العمانية.\nإرشاد لولي الأمر: يتابع مع ابنه تقدم عمله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 52–53.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nإرشاد للطالب: يعرض عمله على أسرته ويحدثهم عن فكرته.\nإرشاد لولي الأمر: يشجع ابنه على تطوير أعماله إلى منتجات.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 53–54.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=4"]}]);
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
