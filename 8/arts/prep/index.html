const D=[{"title": "الدرس الأول: الملمس في الطبيعة", "unit": "الوحدة الأولى: رحلة في ملامس الطبيعة", "periods": [{"ax": "أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة", "n": 1, "w": "الأسبوع الأول: من 6/9/2026 إلى 10/9/2026", "pg": "11–14", "f": ["1. يميز بين أنواع الملامس الطبيعية (خشنة وناعمة) من خلال الملاحظة واللمس.\n2. يرسم تدرج الملمس من الشدة إلى الخفة بالتكبير والتصغير والتقارب والتباعد.\nمخرج آخر: يتفكر في بديع خلق الله في تنوع ملامس الطبيعة.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم بالملاحظة", "1. صورة توضيحية\n2. جهاز عرض البيانات\n3. الأقلام\n4. أخرى: عناصر طبيعية (قواقع، أوراق أشجار، جذوع)، أدوات هندسية", "1. الملمس الحقيقي\n2. الملمس الإيهامي\n3. قيمة الملمس\n4. التدرج الملمسي", "التعلم القبلي: تصنيف الملامس إلى خشنة وناعمة من الصفوف السابقة.\n\nالتهيئة:\n- المعلم: يمرر على المجموعات قواقع وأوراق أشجار وقطع جذوع ويسأل: صنّفوا ما تلمسونه إلى خشن وناعم.\n- الطالب: يلمس العناصر ويصنّفها ويصف ملمس كل منها.", "التهيئة (5 دقائق):\n- المعلم: يمرر على المجموعات قواقع وأوراق أشجار وقطع جذوع ويسأل: صنّفوا ما تلمسونه إلى خشن وناعم.\n- الطالب: يلمس العناصر ويصنّفها ويصف ملمس كل منها.\n\nمن الحقيقي إلى الإيهامي (7 دقائق):\n- المعلم: يعرض صور الملامس (ص 13) ويوضح الفرق بين الملمس الحقيقي الذي يُلمس والإيهامي الذي يُرى بالرسم.\n- الطالب: يقارن بين ملمس العنصر الحقيقي وصورته المرسومة.\n\nنمذجة التدرج (8 دقائق):\n- المعلم: ينمذج على السبورة تدرج ملمس من الشدة إلى الخفة بطريقتي التكبير والتصغير، والتقارب والتباعد.\n- الطالب: يلاحظ الطريقتين ويحدد أيهما سيستخدم.\n\nرسم الأشرطة الثلاثة (17 دقيقة):\n- المعلم: يطلب رسم ثلاثة أشرطة بمقاس (3×15) سم واختيار ثلاثة عناصر مختلفة الملمس ويتابع التنفيذ.\n- الطالب: يرسم كل ملمس في شريط متدرجًا من الشدة إلى الخفة.\n\nالختام (3 دقائق):\n- المعلم: يطلب عرض شريط واحد من كل مجموعة.\n- الطالب: يتحدث عن تحقق درجات الملمس في أشرطته.", "س1 (مستوى المعرفة): ما الفرق بين الملمس الحقيقي والملمس الإيهامي؟\nالإجابة: الحقيقي يُدرك باللمس، والإيهامي يُدرك بالنظر من خلال الرسم.\n\nس2 (مستوى التطبيق): اذكر طريقتين لإظهار تدرج الملمس في الرسم.\nالإجابة: التكبير والتصغير، والتقارب والتباعد.\n\nس3 (مستوى الاستدلال): كيف تُظهر قيمة الملمس عمقًا في الرسم؟\nالإجابة: بتغيير كثافة الملمس فيبدو الكثيف قريبًا داكنًا والمتباعد بعيدًا فاتحًا.", "س1 (مستوى المعرفة): صنّف: جذع النخلة، ورقة الشجر الطرية.\nالإجابة: جذع النخلة خشن، والورقة الطرية ناعمة.\n\nس2 (مستوى التطبيق): اشرح كيف أظهرت التدرج في أحد أشرطتك.\nالإجابة: إجابة تذكر استخدام التقارب في البداية ثم التباعد تدريجيًا أو التكبير ثم التصغير.\n\nس3 (مستوى الاستدلال): قيّم أي الطريقتين أنجح في إظهار التدرج لملمس قشرة الشجر، وعلّل.\nالإجابة: إجابة تقويمية معللة، مثل: التقارب والتباعد؛ لأن خطوط القشرة تتكاثف وتتباعد طبيعيًا.", "إرشاد للطالب: يتأمل ملامس عناصر الطبيعة في بيئته (الصخور، النخيل، الأصداف).\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة تنوع الملامس في الطبيعة تفكرًا في خلق الله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 11–14.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=1"]}, {"ax": "أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس", "n": 2, "w": "الأسبوع الثاني: من 13/9/2026 إلى 17/9/2026", "pg": "14–16", "f": ["1. يرسم شكلًا هندسيًا ثلاثي الأبعاد ويظلل أوجهه بحسب اتجاه الضوء.\n2. يوظف الملمس المتدرج على الشكل الهندسي لإظهار التجسيم.\nمخرج آخر: يتحدث عن مدى تحقق درجات الملمس في عمله.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التعلم بالممارسة العملية", "1. السبورة التقليدية\n2. صورة توضيحية\n3. الأقلام\n4. أخرى: أدوات هندسية، أقلام رصاص وحبر", "1. الشكل ثلاثي الأبعاد\n2. اتجاه الضوء والظل\n3. قيمة الملمس\n4. التجسيم", "التعلم القبلي: أشرطة تدرج الملمس المنفذة في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض مكعبًا تحت مصدر ضوء ويسأل: لماذا تختلف درجة إضاءة أوجهه؟\n- الطالب: يحدد الوجه المضيء والوجه المظلل بحسب اتجاه الضوء.", "التهيئة (5 دقائق):\n- المعلم: يعرض مكعبًا تحت مصدر ضوء ويسأل: لماذا تختلف درجة إضاءة أوجهه؟\n- الطالب: يحدد الوجه المضيء والوجه المظلل بحسب اتجاه الضوء.\n\nنمذجة الرسم والتظليل (8 دقائق):\n- المعلم: ينمذج رسم مكعب أو أسطوانة وتظليل الأوجه وفق مصدر ضوء محدد.\n- الطالب: يتابع ويختار الشكل الهندسي (كرة، مكعب، منشور، هرم، مخروط، أسطوانة).\n\nرسم الشكل وتظليله (12 دقيقة):\n- المعلم: يتابع الرسم في مساحة لا تقل عن (15×15) سم.\n- الطالب: يرسم الشكل ويظلل أوجهه بحسب اتجاه الضوء.\n\nإكساب الشكل الملمس (12 دقيقة):\n- المعلم: يوجه إلى نقل ملمس من أشرطته إلى الشكل بكثافة أكبر في الظل وأقل في الضوء.\n- الطالب: يرسم الملامس على الشكل مستفيدًا من تجربته السابقة.\n\nالختام (3 دقائق):\n- المعلم: يطلب تلخيص ما نُفذ في النشاط.\n- الطالب: يلخص خطوات النشاط ويتحدث عن تحقق درجات الملمس.", "س1 (مستوى المعرفة): سمِّ ثلاثة أشكال هندسية ثلاثية الأبعاد.\nالإجابة: الكرة والمكعب والأسطوانة (أو الهرم والمخروط والمنشور).\n\nس2 (مستوى التطبيق): أين يكون الملمس أكثف على الشكل المظلل؟\nالإجابة: في الجهة المظللة البعيدة عن مصدر الضوء.\n\nس3 (مستوى الاستدلال): لماذا يزيد الملمس المتدرج من الإحساس بالتجسيم؟\nالإجابة: لأنه يحاكي توزيع الضوء والظل فيبدو الشكل بارزًا ذا حجم.", "س1 (مستوى المعرفة): ما أقل مساحة لرسم الشكل في هذا النشاط؟\nالإجابة: (15×15) سم.\n\nس2 (مستوى التطبيق): صف كيف وزعت الملمس على أوجه شكلك.\nالإجابة: إجابة تذكر تكثيف الملمس في الوجه المظلل وتخفيفه في الوجه المضيء.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يجعل الإحساس بالضوء في عملك أوضح.\nالإجابة: زيادة التباين بين كثافة الملمس في الظل وخفته في الضوء.", "إرشاد للطالب: يلاحظ ظلال الأشياء من حوله وتغيرها بتغير مصدر الضوء.\nإرشاد لولي الأمر: يتابع مع ابنه أعماله ويثني على دقته.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 14–16.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=1"]}, {"ax": "نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي", "n": 3, "w": "الأسبوع الثالث: من 20/9/2026 إلى 24/9/2026", "pg": "18–23", "f": ["1. يحول الملمس الطبيعي إلى نمط خطي متكرر.\n2. ينفذ مكعبًا ملمسيًا ملونًا من الإفراد الهندسي.\nمخرج آخر: يشارك في تجميع المكعبات في عمل تركيبي فراغي.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "1. التعلم التعاوني\n2. التعلم المبني على المشاريع\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. أخرى: ورقة النشاط (الإفراد الهندسي)، مقص، لاصق، أقلام تلوين", "1. النمط الملمسي\n2. الإفراد الهندسي\n3. التركيب الفراغي (التجهيز في الفراغ)", "التعلم القبلي: رسم الملامس الطبيعية وتدرجها.\n\nالتهيئة:\n- المعلم: يعرض صورًا لأعمال تركيبية في الفراغ (ص 11) ويسأل: كيف تحولت الوحدات الصغيرة إلى عمل كبير؟\n- الطالب: يلاحظ أن التكرار والتجميع صنعا عملًا واحدًا.", "التهيئة (5 دقائق):\n- المعلم: يعرض صورًا لأعمال تركيبية في الفراغ (ص 11) ويسأل: كيف تحولت الوحدات الصغيرة إلى عمل كبير؟\n- الطالب: يلاحظ أن التكرار والتجميع صنعا عملًا واحدًا.\n\nملاحظة النمط (5 دقائق):\n- المعلم: يعرض نماذج لتكرار الملمس (النمط) ويوضح أن النمط وحدة ملمسية تتكرر بانتظام.\n- الطالب: يحدد الوحدة المتكررة في النماذج.\n\nرسم النمط على الإفراد (15 دقيقة):\n- المعلم: يوزع ورقة النشاط (الإفراد الهندسي ص 23) ويتابع رسم النمط في المساحات المحددة وتلوينه.\n- الطالب: يرسم النمط الملمسي ويلونه على أوجه المكعب.\n\nالقص واللصق (8 دقائق):\n- المعلم: يتابع قص الإفراد وطيه ولصقه.\n- الطالب: يقص أوجه المكعب ويلصقها ليتكون المكعب.\n\nالختام (7 دقائق):\n- المعلم: ينظم تجميع مكعبات الطلبة في تركيب فراغي ويوجه لإحضار صور لعناصر طبيعية للدرس القادم.\n- الطالب: يشارك في تجميع المكعبات ويتأمل العمل التركيبي.", "س1 (مستوى المعرفة): ما المقصود بالنمط الملمسي؟\nالإجابة: وحدة ملمسية تتكرر بانتظام على السطح.\n\nس2 (مستوى التطبيق): ما الإفراد الهندسي للمكعب؟\nالإجابة: الشكل المسطح لأوجه المكعب الستة قبل طيها ولصقها.\n\nس3 (مستوى الاستدلال): كيف يغير تجميع المكعبات إحساس المشاهد بالفراغ؟\nالإجابة: يحول الفراغ إلى عمل يتفاعل معه المشاهد من زوايا متعددة.", "س1 (مستوى المعرفة): كم وجهًا للمكعب رسمت عليه النمط؟\nالإجابة: ستة أوجه.\n\nس2 (مستوى التطبيق): صف طريقة تحويل الملمس الطبيعي إلى نمط خطي بسيط.\nالإجابة: تبسيط خطوط الملمس الطبيعي إلى وحدة خطية ثم تكرارها بانتظام.\n\nس3 (مستوى الاستدلال): اقترح مكانًا في المدرسة لعرض العمل التركيبي مع التعليل.\nالإجابة: مثال: بهو المدرسة؛ لأنه يتيح رؤية العمل من جميع ال قطع جذوع ويسأل: صنّفوا ما تلمسونه إلى خشن وناعم.\n- الطالب: يلمس العناصر ويصنّفها ويصف ملمس كل منها.\n\nمن الحقيقي إلى الإيهامي (7 دقائق):\n- المعلم: يعرض صور الملامس (ص 13) ويوضح الفرق بين الملمس الحقيقي الذي يُلمس والإيهامي الذي يُرى بالرسم.\n- الطالب: يقارن بين ملمس العنصر الحقيقي وصورته المرسومة.\n\nنمذجة التدرج (8 دقائق):\n- المعلم: ينمذج على السبورة تدرج ملمس من الشدة إلى الخفة بطريقتي التكبير والتصغير، والتقارب والتباعد.\n- الطالب: يلاحظ الطريقتين ويحدد أيهما سيستخدم.\n\nرسم الأشرطة الثلاثة (17 دقيقة):\n- المعلم: يطلب رسم ثلاثة أشرطة بمقاس (3×15) سم واختيار ثلاثة عناصر مختلفة الملمس ويتابع التنفيذ.\n- الطالب: يرسم كل ملمس في شريط متدرجًا من الشدة إلى الخفة.\n\nالختام (3 دقائق):\n- المعلم: يطلب عرض شريط واحد من كل مجموعة.\n- الطالب: يتحدث عن تحقق درجات الملمس في أشرطته.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nالتهيئة (5 دقائق):\n- المعلم: يعرض مكعبًا تحت مصدر ضوء ويسأل: لماذا تختلف درجة إضاءة أوجهه؟\n- الطالب: يحدد الوجه المضيء والوجه المظلل بحسب اتجاه الضوء.\n\nنمذجة الرسم والتظليل (8 دقائق):\n- المعلم: ينمذج رسم مكعب أو أسطوانة وتظليل الأوجه وفق مصدر ضوء محدد.\n- الطالب: يتابع ويختار الشكل الهندسي (كرة، مكعب، منشور، هرم، مخروط، أسطوانة).\n\nرسم الشكل وتظليله (12 دقيقة):\n- المعلم: يتابع الرسم في مساحة لا تقل عن (15×15) سم.\n- الطالب: يرسم الشكل ويظلل أوجهه بحسب اتجاه الضوء.\n\nإكساب الشكل الملمس (12 دقيقة):\n- المعلم: يوجه إلى نقل ملمس من أشرطته إلى الشكل بكثافة أكبر في الظل وأقل في الضوء.\n- الطالب: يرسم الملامس على الشكل مستفيدًا من تجربته السابقة.\n\nالختام (3 دقائق):\n- المعلم: يطلب تلخيص ما نُفذ في النشاط.\n- الطالب: يلخص خطوات النشاط ويتحدث عن تحقق درجات الملمس.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورًا لأعمال تركيبية في الفراغ (ص 11) ويسأل: كيف تحولت الوحدات الصغيرة إلى عمل كبير؟\n- الطالب: يلاحظ أن التكرار والتجميع صنعا عملًا واحدًا.\n\nملاحظة النمط (5 دقائق):\n- المعلم: يعرض نماذج لتكرار الملمس (النمط) ويوضح أن النمط وحدة ملمسية تتكرر بانتظام.\n- الطالب: يحدد الوحدة المتكررة في النماذج.\n\nرسم النمط على الإفراد (15 دقيقة):\n- المعلم: يوزع ورقة النشاط (الإفراد الهندسي ص 23) ويتابع رسم النمط في المساحات المحددة وتلوينه.\n- الطالب: يرسم النمط الملمسي ويلونه على أوجه المكعب.\n\nالقص واللصق (8 دقائق):\n- المعلم: يتابع قص الإفراد وطيه ولصقه.\n- الطالب: يقص أوجه المكعب ويلصقها ليتكون المكعب.\n\nالختام (7 دقائق):\n- المعلم: ينظم تجميع مكعبات الطلبة في تركيب فراغي ويوجه لإحضار صور لعناصر طبيعية للدرس القادم.\n- الطالب: يشارك في تجميع المكعبات ويتأمل العمل التركيبي.", "الحصة 1: أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة\nس1 (مستوى المعرفة): ما الفرق بين الملمس الحقيقي والملمس الإيهامي؟\nالإجابة: الحقيقي يُدرك باللمس، والإيهامي يُدرك بالنظر من خلال الرسم.\n\nس2 (مستوى التطبيق): اذكر طريقتين لإظهار تدرج الملمس في الرسم.\nالإجابة: التكبير والتصغير، والتقارب والتباعد.\n\nس3 (مستوى الاستدلال): كيف تُظهر قيمة الملمس عمقًا في الرسم؟\nالإجابة: بتغيير كثافة الملمس فيبدو الكثيف قريبًا داكنًا والمتباعد بعيدًا فاتحًا.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nس1 (مستوى المعرفة): سمِّ ثلاثة أشكال هندسية ثلاثية الأبعاد.\nالإجابة: الكرة والمكعب والأسطوانة (أو الهرم والمخروط والمنشور).\n\nس2 (مستوى التطبيق): أين يكون الملمس أكثف على الشكل المظلل؟\nالإجابة: في الجهة المظللة البعيدة عن مصدر الضوء.\n\nس3 (مستوى الاستدلال): لماذا يزيد الملمس المتدرج من الإحساس بالتجسيم؟\nالإجابة: لأنه يحاكي توزيع الضوء والظل فيبدو الشكل بارزًا ذا حجم.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nس1 (مستوى المعرفة): ما المقصود بالنمط الملمسي؟\nالإجابة: وحدة ملمسية تتكرر بانتظام على السطح.\n\nس2 (مستوى التطبيق): ما الإفراد الهندسي للمكعب؟\nالإجابة: الشكل المسطح لأوجه المكعب الستة قبل طيها ولصقها.\n\nس3 (مستوى الاستدلال): كيف يغير تجميع المكعبات إحساس المشاهد بالفراغ؟\nالإجابة: يحول الفراغ إلى عمل يتفاعل معه المشاهد من زوايا متعددة.", "الحصة 1: أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة\nس1 (مستوى المعرفة): صنّف: جذع النخلة، ورقة الشجر الطرية.\nالإجابة: جذع النخلة خشن، والورقة الطرية ناعمة.\n\nس2 (مستوى التطبيق): اشرح كيف أظهرت التدرج في أحد أشرطتك.\nالإجابة: إجابة تذكر استخدام التقارب في البداية ثم التباعد تدريجيًا أو التكبير ثم التصغير.\n\nس3 (مستوى الاستدلال): قيّم أي الطريقتين أنجح في إظهار التدرج لملمس قشرة الشجر، وعلّل.\nالإجابة: إجابة تقويمية معللة، مثل: التقارب والتباعد؛ لأن خطوط القشرة تتكاثف وتتباعد طبيعيًا.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nس1 (مستوى المعرفة): ما أقل مساحة لرسم الشكل في هذا النشاط؟\nالإجابة: (15×15) سم.\n\nس2 (مستوى التطبيق): صف كيف وزعت الملمس على أوجه شكلك.\nالإجابة: إجابة تذكر تكثيف الملمس في الوجه المظلل وتخفيفه في الوجه المضيء.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يجعل الإحساس بالضوء في عملك أوضح.\nالإجابة: زيادة التباين بين كثافة الملمس في الظل وخفته في الضوء.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nس1 (مستوى المعرفة): كم وجهًا للمكعب رسمت عليه النمط؟\nالإجابة: ستة أوجه.\n\nس2 (مستوى التطبيق): صف طريقة تحويل الملمس الطبيعي إلى نمط خطي بسيط.\nالإجابة: تبسيط خطوط الملمس الطبيعي إلى وحدة خطية ثم تكرارها بانتظام.\n\nس3 (مستوى الاستدلال): اقترح مكانًا في المدرسة لعرض العمل التركيبي مع التعليل.\nالإجابة: مثال: بهو المدرسة؛ لأنه يتيح رؤية العمل من جميع الجهات.", "الحصة 1: أثر من الطبيعة: تصنيف الملامس ورسم تدرج الملمس من الشدة إلى الخفة\nإرشاد للطالب: يتأمل ملامس عناصر الطبيعة في بيئته (الصخور، النخيل، الأصداف).\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة تنوع الملامس في الطبيعة تفكرًا في خلق الله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 11–14.\n\nالحصة 2: أثر من الطبيعة: رسم شكل هندسي ثلاثي الأبعاد وتظليله وإكسابه الملمس\nإرشاد للطالب: يلاحظ ظلال الأشياء من حوله وتغيرها بتغير مصدر الضوء.\nإرشاد لولي الأمر: يتابع مع ابنه أعماله ويثني على دقته.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 14–16.\n\nالحصة 3: نمط ملمسي: رسم النمط على الإفراد الهندسي للمكعب وتجميع المكعبات في تركيب فراغي\nإرشاد للطالب: يحضر صورًا لعناصر من : يلاحظ استخدام ملامس مختلفة (نقاط، خطوط، شبكات).\n\nإكساب الملامس (18 دقيقة):\n- المعلم: يوجه إلى تعبئة أجزاء الوحدة بملامس مختلفة مستفيدًا من أنماط الدرس الأول.\n- الطالب: يملأ أجزاء العنصر المبسط بملامس متنوعة.\n\nالتكرار في التصميم (10 دقائق):\n- المعلم: يوجه إلى تكرار الوحدة في مساحات الباب الأخرى بإيقاع منتظم.\n- الطالب: يكرر الوحدة ويحقق إيقاعًا في التصميم.\n\nالختام (7 دقائق):\n- المعلم: يناقش القيمة الجمالية للتنوع الملمسي ويوجه لإحضار خامات ورقية مستهلكة وصور لنوافذ عمانية.\n- الطالب: يتحدث عن جمال التنوع الملمسي في تصميمه.", "س1 (مستوى المعرفة): سمِّ ملمسين إيهاميين استخدمتهما في الوحدة.\nالإجابة: التنقيط والتهشير (أو الشبكة والخطوط المتموجة).\n\nس2 (مستوى التطبيق): ما أثر تكرار الوحدة الزخرفية في التصميم؟\nالإجابة: يحقق الإيقاع والوحدة والترابط في التصميم.\n\nس3 (مستوى الاستدلال): كيف تمنع التنوع الملمسي من أن يتحول إلى فوضى بصرية؟\nالإجابة: باختيار ملامس محدودة متناسقة وتوزيعها بنظام متكرر.", "س1 (مستوى المعرفة): أكمل: تكرار الوحدة الزخرفية يحقق ……… في التصميم.\nالإجابة: الإيقاع.\n\nس2 (مستوى التطبيق): وضّح القيمة الجمالية للتنوع الملمسي في تصميمك.\nالإجابة: يمنح التصميم ثراء بصريًا ويميز المساحات ويجذب العين.\n\nس3 (مستوى الاستدلال): انقد تصميم زميل من حيث توازن الملامس.\nالإجابة: نقد يذكر مواطن التوازن والازدحام ويقترح تعديلًا.", "إرشاد للطالب: يجمع خامات ورقية مستهلكة (محارم، صحف) لعجينة الورق.\nإرشاد لولي الأمر: يشارك ابنه في جمع الخامات المستهلكة دعمًا لإعادة التدوير.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 27–28، 35–37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=2"]}, {"ax": "نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية", "n": 3, "w": "الأسبوع السادس: من 11/10/2026 إلى 15/10/2026", "pg": "29–30", "f": ["1. يصمم نافذة مستوحاة من العمارة العمانية بتكرار الوحدة الزخرفية.\n2. يوزع الوحدات الزخرفية على مساحة الكانفس بتوازن.\nمخرج آخر: يعتز بالهوية العمانية في تصميمه.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم المبني على المشاريع\n2. التعلم الذاتي\n3. التعلم بالنمذجة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: لوحات كانفس، أقلام رصاص", "1. التصميم المستوحى\n2. الوحدة الزخرفية المكررة\n3. الهوية العمانية", "التعلم القبلي: الوحدة الزخرفية ذات الملامس المنفذة في النشاط الأول.\n\nالتهيئة:\n- المعلم: يعرض صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟\n- الطالب: يذكر الأقواس والزخارف النباتية والهندسية.", "التهيئة (5 دقائق):\n- المعلم: يعرض صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟\n- الطالب: يذكر الأقواس والزخارف النباتية والهندسية.\n\nتحليل النوافذ (8 دقائق):\n- المعلم: يحلل مع الطلبة أجزاء النافذة (القوس، الإطار، الضلف، المساحات الزخرفية).\n- الطالب: يحدد أجزاء النافذة التي سيصممها.\n\nرسم التصميم على الكانفس (20 دقيقة):\n- المعلم: يتابع رسم النافذة وتكرار الوحدة الزخرفية بالقلم الرصاص.\n- الطالب: يرسم تصميم النافذة على الكانفس ويكرر وحدته.\n\nالختام (7 دقائق):\n- المعلم: يراجع التصاميم ويوضح أن المعالجة ستكون بعجينة الورق.\n- الطالب: يعرض تصميمه ويستعد للمرحلة القادمة.", "س1 (مستوى المعرفة): اذكر جزأين من أجزاء النافذة العمانية.\nالإجابة: القوس والضلف (أو الإطار).\n\nس2 (مستوى التطبيق): لماذا نكرر الوحدة الزخرفية من النشاط الأول؟\nالإجابة: لربط التصميم بالملامس المستلهمة من الطبيعة وتحقيق الإيقاع.\n\nس3 (مستوى الاستدلال): اقترح طريقة لتمييز القوس عن بقية النافذة في التصميم.\nالإجابة: بزخرفة مختلفة أو حجم وحدات أصغر أو ملمس مختلف.", "س1 (مستوى المعرفة): على أي سطح ستنفذ النافذة؟\nالإجابة: لوحة الكانفس.\n\nس2 (مستوى التطبيق): كيف وزعت الوحدات في تصميمك؟\nالإجابة: إجابة تذكر التوزيع المتماثل أو المتكرر داخل مساحات الضلف.\n\nس3 (مستوى الاستدلال): قيّم تصميمك من حيث استلهام روح العمارة العمانية.\nالإجابة: تقييم معلل يذكر عناصر الاستلهام وما يمكن تعزيزه.", "إرشاد للطالب: يتأمل نوافذ البيوت القديمة في الحارات العمانية.\nإرشاد لولي الأمر: يحدث ابنه عن البيوت العمانية القديمة وتفاصيلها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 29–30.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/a نه.\n\nس3 (مستوى الاستدلال): اقترح خامة مستهلكة أخرى يمكن استخدامها مع العجينة لتنويع الملمس.\nالإجابة: الرمل أو الخرز أو قشر البيض.", "إرشاد للطالب: يتعرف على خامات منزلية قابلة لإعادة التدوير في الفن.\nإرشاد لولي الأمر: يحفز ابنه على فرز الورق المستهلك للاستفادة منه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 30–31.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=2"]}, {"ax": "نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة", "n": 5, "w": "الأسبوع الثامن: من 25/10/2026 إلى 29/10/2026", "pg": "31–35", "f": ["1. يضيف خامات أخرى لإظهار تنوع الملامس في العمل.\n2. يصدر حكمًا على العمل من حيث تحقق التنوع الملمسي.\nمخرج آخر: يقترح أماكن لتوظيف المنتج الفني ويسوقه.", "المخرج 1: إبداع\nالمخرج 2: تقييم\nالمخرج 3: إبداع", "1. التعلم الذاتي\n2. التعلم التشاركي\n3. التقويم الذاتي", "1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: خرز، رمل، بطاقة تقويم الوحدة", "1. التنوع الملمسي\n2. الإخراج الفني\n3. تسويق المنتج الفني", "التعلم القبلي: معالجة الوحدات بعجينة الورق الملونة.\n\nالتهيئة:\n- المعلم: يعرض عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟\n- الطالب: يختار ويعلل بتنوع الملامس.", "التهيئة (5 دقائق):\n- المعلم: يعرض عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟\n- الطالب: يختار ويعلل بتنوع الملامس.\n\nإضافة الخامات (12 دقيقة):\n- المعلم: يوجه إلى إضافة الخرز أو الرمل في مواضع محددة.\n- الطالب: يضيف خامات لتنويع الملامس ويكمل عمله.\n\nالنشاط التسويقي (8 دقائق):\n- المعلم: يطلب اقتراح أماكن لتوظيف المنتج (ديكور منزلي، هدايا) وتسعيرًا مبدئيًا.\n- الطالب: يقترح أماكن لتوظيف منتجه وطريقة تسويقه.\n\nتقويم الوحدة (8 دقائق):\n- المعلم: يوزع بطاقة تقويم الوحدة (ص 34).\n- الطالب: يجيب عن بطاقة تقويم الوحدة.\n\nالختام (7 دقائق):\n- المعلم: ينظم عرضًا ويطلب إصدار حكم على تحقق التنوع الملمسي.\n- الطالب: يصدر حكمًا على عمله وأعمال زملائه.", "س1 (مستوى المعرفة): اذكر خامتين أضفتهما لتنويع الملامس.\nالإجابة: الخرز والرمل.\n\nس2 (مستوى التطبيق): كيف تقيس نجاح التنوع الملمسي في عملك؟\nالإجابة: بوضوح الفروق بين الملامس وتناسقها مع التصميم.\n\nس3 (مستوى الاستدلال): صمم بطاقة تسويق مختصرة لمنتجك.\nالإجابة: اسم المنتج، فكرته المستلهمة من العمارة العمانية، استخدامه، مكان عرضه.", "س1 (مستوى المعرفة): هل منتجك الفني قابل للتسويق؟ ولماذا؟\nالإجابة: نعم؛ لأنه جمالي يحمل هوية عمانية ويصلح ديكورًا أو هدية.\n\nس2 (مستوى التطبيق): ما رأيك في استغلال الخامات المهملة وإعادة تدويرها؟\nالإجابة: إجابة إيجابية معللة بحماية البيئة وإنتاج أعمال مفيدة.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث التنوع الملمسي واستلهام العمارة العمانية.\nالإجابة: نقد متوازن يذكر نقاط القوة واقتراح تحسين.", "إرشاد للطالب: يعرض منتجه على أسرته ويحتفظ به في ملف إنجازه.\nإرشاد لولي الأمر: يشجع ابنه على التفكير في تسويق أعماله الفنية.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 31–35.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=2"]}], "comb": ["الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\n1. يتعرف القيم الملمسية في الأعمال الفنية والعمارة العمانية.\n2. يبسط عنصرًا طبيعيًا برسم خطه الخارجي داخل مساحات الباب أو النافذة.\nمخرج آخر: يعتز بجماليات الأبواب والنوافذ في العمارة العمانية.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\n1. يوظف الملامس المتنوعة داخل الوحدة الزخرفية المبسطة.\n2. يكرر الوحدة الزخرفية في تصميم باب أو نافذة.\nمخرج آخر: يتحدث عن القيمة الجمالية للتنوع البصري الملمسي.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\n1. يصمم نافذة مستوحاة من العمارة العمانية بتكرار الوحدة الزخرفية.\n2. يوزع الوحدات الزخرفية على مساحة الكانفس بتوازن.\nمخرج آخر: يعتز بالهوية العمانية في تصميمه.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\n1. يجهز عجينة الورق من خامات مستهلكة ويلونها بألوان ذات وسيط مائي.\n2. يعالج الوحدات الزخرفية المكررة بالعجينة الملونة لإظهار الملمس الحقيقي.\nمخرج آخر: يسهم في إعادة التدوير والمحافظة على البيئة.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\n1. يضيف خامات أخرى لإظهار تنوع الملامس في العمل.\n2. يصدر حكمًا على العمل من حيث تحقق التنوع الملمسي.\nمخرج آخر: يقترح أماكن لتوظيف المنتج الفني ويسوقه.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nالمخرج 1: إبداع\nالمخرج 2: تقييم\nالمخرج 3: إبداع", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\n1. التعلم بالاكتشاف\n2. التعلم الذاتي\n3. التعلم بالملاحظة\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\n1. التعلم الذاتي\n2. التعلم التشاركي\n3. التعلم بالممارسة العملية\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\n1. التعلم المبني على المشاريع\n2. التعلم الذاتي\n3. التعلم بالنمذجة\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\n1. التعلم التعاوني\n2. التعلم بالنمذجة\n3. التعلم بالممارسة العملية\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\n1. التعلم الذاتي\n2. التعلم التشاركي\n3. التقويم الذاتي", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: ورقة النشاط (أشكال الأبواب والنوافذ)، أقلام\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\n1. صورة توضيحية\n2. الأقلام\n3. أخرى: ورقة النشاط، أقلام حبر وتلوين\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: لوحات كانفس، أقلام رصاص\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\n1. أخرى: ورق مستهلك، غراء، ألوان ذات وسيط مائي، أوعية، أغطية بلاستيكية للطاولات\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\n1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: خرز، رمل، بطاقة تقويم الوحدة", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\n1. التبسيط\n2. الخط الخارجي\n3. الوحدة الزخرفية\n4. العمارة العمانية\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\n1. التنوع الملمسي\n2. التكرار\n3. القيمة الجمالية\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\n1. التصميم المستوحى\n2. الوحدة الزخرفية المكررة\n3. الهوية العمانية\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\n1. عجينة الورق\n2. الملمس الحقيقي\n3. إعادة التدوير\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\n1. التنوع الملمسي\n2. الإخراج الفني\n3. تسويق المنتج الفني", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nالتعلم القبلي: الملامس الطبيعية وتحويلها إلى أنماط.\n\nالتهيئة:\n- المعلم: يعرض صور أبواب ونوافذ عمانية مزخرفة (مصادر الإلهام ص 36) ويسأل: من أين استلهم الحرفي العماني هذه الزخارف؟\n- الطالب: يذكر عناصر طبيعية ظهرت في الزخارف (النخلة، الزهور، الرمان).\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nالتعلم القبلي: العنصر الطبيعي المبسط في ورقة النشاط.\n\nالتهيئة:\n- المعلم: يعرض نافذة من مصادر الإلهام ويسأل: كيف ميز الفنان بين مساحات الوحدة الواحدة؟\n- الطالب: يلاحظ استخدام ملامس مختلفة (نقاط، خطوط، شبكات).\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nالتعلم القبلي: الوحدة الزخرفية ذات الملامس المنفذة في النشاط الأول.\n\nالتهيئة:\n- المعلم: يعرض صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟\n- الطالب: يذكر الأقواس والزخارف النباتية والهندسية.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nالتعلم القبلي: تصميم النافذة على لوحة الكانفس.\n\nالتهيئة:\n- المعلم: يعرض قطعة من عجينة الورق الجافة ويسأل: من أي شيء صُنعت؟\n- الطالب: يتوقع مكوناتها (ورق، ماء، غراء) ويتحسس ملمسها.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nالتعلم القبلي: معالجة الوحدات بعجينة الورق الملونة.\n\nالتهيئة:\n- المعلم: يعرض عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟\n- الطالب: يختار ويعلل بتنوع الملامس.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nالتهيئة (5 دقائق):\n- المعلم: يعرض صور أبواب ونوافذ عمانية مزخرفة (مصادر الإلهام ص 36) ويسأل: من أين استلهم الحرفي العماني هذه الزخارف؟\n- الطالب: يذكر عناصر طبيعية ظهرت في الزخارف (النخلة، الزهور، الرمان).\n\nاختيار العنصر (7 دقائق):\n- المعلم: يوضح المطلوب ويعرض أمثلة لعناصر طبيعية (الزهور، الأوراق، خلايا النحل).\n- الطالب: يختار عنصرًا طبيعيًا من صوره.\n\nنمذجة التبسيط (8 دقائق):\n- المعلم: ينمذج تبسيط زهرة إلى خط خارجي واضح مع حذف التفاصيل الدقيقة.\n- الطالب: يتابع ويجرب التبسيط على مسودة.\n\nالرسم في ورقة النشاط (15 دقيقة):\n- المعلم: يوزع ورقة النشاط (ص 37) ويتابع رسم العنصر المبسط في المساحات المحددة.\n- الطالب: يرسم العنصر المبسط في مساحات الباب أو النافذة.\n\nالختام (5 دقائق):\n- المعلم: يطلب الحفاظ على الورقة لاستكمالها.\n- الطالب: يعرض تبسيطه ويحدد ما سيضيفه من ملامس.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nالتهيئة (5 دقائق):\n- المعلم: يعرض نافذة من مصادر الإلهام ويسأل: كيف ميز الفنان بين مساحات الوحدة الواحدة؟\n- الطالب: يلاحظ استخدام ملامس مختلفة (نقاط، خطوط، شبكات).\n\nإكساب الملامس (18 دقيقة):\n- المعلم: يوجه إلى تعبئة أجزاء الوحدة بملامس مختلفة مستفيدًا من أنماط الدرس الأول.\n- الطالب: يملأ أجزاء العنصر المبسط بملامس متنوعة.\n\nالتكرار في التصميم (10 دقائق):\n- المعلم: يوجه إلى تكرار الوحدة في مساحات الباب الأخرى بإيقاع منتظم.\n- الطالب: يكرر الوحدة ويحقق إيقاعًا في التصميم.\n\nالختام (7 دقائق):\n- المعلم: يناقش القيمة الجمالية للتنوع الملمسي ويوجه لإحضار خامات ورقية مستهلكة وصور لنوافذ عمانية.\n- الطالب: يتحدث عن جمال التنوع الملمسي في تصميمه.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nالتهيئة (5 دقائق):\n- المعلم: يعرض صور نوافذ من العمارة العمانية بزخارف متنوعة ويسأل: ما الذي يجعل النافذة العمانية مميزة؟\n- الطالب: يذكر الأقواس والزخارف النباتية والهندسية.\n\nتحليل النوافذ (8 دقائق):\n- المعلم: يحلل مع الطلبة أجزاء النافذة (القوس، الإطار، الضلف، المساحات الزخرفية).\n- الطالب: يحدد أجزاء النافذة التي سيصممها.\n\nرسم التصميم على الكانفس (20 دقيقة):\n- المعلم: يتابع رسم النافذة وتكرار الوحدة الزخرفية بالقلم الرصاص.\n- الطالب: يرسم تصميم النافذة على الكانفس ويكرر وحدته.\n\nالختام (7 دقائق):\n- المعلم: يراجع التصاميم ويوضح أن المعالجة ستكون بعجينة الورق.\n- الطالب: يعرض تصميمه ويستعد للمرحلة القادمة.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nالتهيئة (5 دقائق):\n- المعلم: يعرض قطعة من عجينة الورق الجافة ويسأل: من أي شيء صُنعت؟\n- الطالب: يتوقع مكوناتها (ورق، ماء، غراء) ويتحسس ملمسها.\n\nتجهيز العجينة (10 دقائق):\n- المعلم: ينمذج تقطيع الورق ونقعه وعصره وخلطه بالغراء مع تغطية الطاولات.\n- الطالب: يجهز العجينة مع مجموعته.\n\nتقسيم العجينة وتلوينها (7 دقائق):\n- المعلم: يوجه إلى تقسيم العجينة وتلوينها بحسب ألوان التصميم.\n- الطالب: يقسم العجينة ويلونها.\n\nمعالجة الوحدات (13 دقيقة):\n- المعلم: يتابع تثبيت العجينة على الوحدات المكررة.\n- الطالب: يعالج الوحدات الزخرفية بالعجينة الملونة.\n\nالختام (5 دقائق):\n- المعلم: يوجه إلى تنظيف المكان وحفظ الأعمال لتجف.\n- الطالب: ينظف أدواته ويحفظ عمله.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nالتهيئة (5 دقائق):\n- المعلم: يعرض عملين أحدهما بملمس واحد والآخر بملامس متنوعة ويسأل: أيهما أغنى بصريًا؟\n- الطالب: يختار ويعلل بتنوع الملامس.\n\nإضافة الخامات (12 دقيقة):\n- المعلم: يوجه إلى إضافة الخرز أو الرمل في مواضع محددة.\n- الطالب: يضيف خامات لتنويع الملامس ويكمل عمله.\n\nالنشاط التسويقي (8 دقائق):\n- المعلم: يطلب اقتراح أماكن لتوظيف المنتج (ديكور منزلي، هدايا) وتسعيرًا مبدئيًا.\n- الطالب: يقترح أماكن لتوظيف منتجه وطريقة تسويقه.\n\nتقويم الوحدة (8 دقائق):\n- المعلم: يوزع بطاقة تقويم الوحدة (ص 34).\n- الطالب: يجيب عن بطاقة تقويم الوحدة.\n\nالختام (7 دقائق):\n- المعلم: ينظم عرضًا ويطلب إصدار حكم على تحقق التنوع الملمسي.\n- الطالب: يصدر حكمًا على عمله وأعمال زملائه.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nس1 (مستوى المعرفة): ما المقصود بتبسيط العنصر الطبيعي؟\nالإجابة: رسمه بخطه الخارجي الأساسي وحذف التفاصيل الدقيقة.\n\nس2 (مستوى التطبيق): اذكر عنصرين طبيعيين ظهرا في زخارف النوافذ العمانية.\nالإجابة: النخلة والزهور (أو الرمان).\n\nس3 (مستوى الاستدلال): لماذا يناسب التبسيط الزخارف المعمارية؟\nالإجابة: لأنه يسهل التكرار والتنفيذ على الخشب والجص ويمنح وضوحًا بصريًا من بعيد.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nس1 (مستوى المعرفة): سمِّ ملمسين إيهاميين استخدمتهما في الوحدة.\nالإجابة: التنقيط والتهشير (أو الشبكة والخطوط المتموجة).\n\nس2 (مستوى التطبيق): ما أثر تكرار الوحدة الزخرفية في التصميم؟\nالإجابة: يحقق الإيقاع والوحدة والترابط في التصميم.\n\nس3 (مستوى الاستدلال): كيف تمنع التنوع الملمسي من أن يتحول إلى فوضى بصرية؟\nالإجابة: باختيار ملامس محدودة متناسقة وتوزيعها بنظام متكرر.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nس1 (مستوى المعرفة): اذكر جزأين من أجزاء النافذة العمانية.\nالإجابة: القوس والضلف (أو الإطار).\n\nس2 (مستوى التطبيق): لماذا نكرر الوحدة الزخرفية من النشاط الأول؟\nالإجابة: لربط التصميم بالملامس المستلهمة من الطبيعة وتحقيق الإيقاع.\n\nس3 (مستوى الاستدلال): اقترح طريقة لتمييز القوس عن بقية النافذة في التصميم.\nالإجابة: بزخرفة مختلفة أو حجم وحدات أصغر أو ملمس مختلف.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nس1 (مستوى المعرفة): ما مكونات عجينة الورق؟\nالإجابة: ورق مستهلك وماء وغراء.\n\nس2 (مستوى التطبيق): لماذا نستخدم ألوانًا ذات وسيط مائي لتلوين العجينة؟\nالإجابة: لأنها تمتزج بالعجينة الرطبة بسهولة.\n\nس3 (مستوى الاستدلال): كيف يسهم هذا النشاط في حماية البيئة؟\nالإجابة: بإعادة تدوير الورق المستهلك بدل رميه.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): اذكر خامتين أضفتهما لتنويع الملامس.\nالإجابة: الخرز والرمل.\n\nس2 (مستوى التطبيق): كيف تقيس نجاح التنوع الملمسي في عملك؟\nالإجابة: بوضوح الفروق بين الملامس وتناسقها مع التصميم.\n\nس3 (مستوى الاستدلال): صمم بطاقة تسويق مختصرة لمنتجك.\nالإجابة: اسم المنتج، فكرته المستلهمة من العمارة العمانية، استخدامه، مكان عرضه.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nس1 (مستوى المعرفة): ما العنصر الطبيعي الذي اخترته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف خطوات تبسيطك للعنصر.\nالإجابة: ملاحظة الشكل، تحديد خطه الخارجي، حذف التفاصيل، رسمه بخط واضح.\n\nس3 (مستوى الاستدلال): قارن بين عنصرك الطبيعي ومبسطه من حيث الشكل والوظيفة الزخرفية.\nالإجابة: المبسط يحافظ على الهيئة العامة ويصبح وحدة زخرفية قابلة للتكرار.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nس1 (مستوى المعرفة): أكمل: تكرار الوحدة الزخرفية يحقق ……… في التصميم.\nالإجابة: الإيقاع.\n\nس2 (مستوى التطبيق): وضّح القيمة الجمالية للتنوع الملمسي في تصميمك.\nالإجابة: يمنح التصميم ثراء بصريًا ويميز المساحات ويجذب العين.\n\nس3 (مستوى الاستدلال): انقد تصميم زميل من حيث توازن الملامس.\nالإجابة: نقد يذكر مواطن التوازن والازدحام ويقترح تعديلًا.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nس1 (مستوى المعرفة): على أي سطح ستنفذ النافذة؟\nالإجابة: لوحة الكانفس.\n\nس2 (مستوى التطبيق): كيف وزعت الوحدات في تصميمك؟\nالإجابة: إجابة تذكر التوزيع المتماثل أو المتكرر داخل مساحات الضلف.\n\nس3 (مستوى الاستدلال): قيّم تصميمك من حيث استلهام روح العمارة العمانية.\nالإجابة: تقييم معلل يذكر عناصر الاستلهام وما يمكن تعزيزه.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nس1 (مستوى المعرفة): ما نوع الملمس الذي تمنحه العجينة للعمل؟\nالإجابة: ملمس حقيقي بارز.\n\nس2 (مستوى التطبيق): اذكر خطوات تجهيز العجينة بالترتيب.\nالإجابة: تقطيع الورق، نقعه، عصره، خلطه بالغراء، تقسيمه وتلوينه.\n\nس3 (مستوى الاستدلال): اقترح خامة مستهلكة أخرى يمكن استخدامها مع العجينة لتنويع الملمس.\nالإجابة: الرمل أو الخرز أو قشر البيض.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): هل منتجك الفني قابل للتسويق؟ ولماذا؟\nالإجابة: نعم؛ لأنه جمالي يحمل هوية عمانية ويصلح ديكورًا أو هدية.\n\nس2 (مستوى التطبيق): ما رأيك في استغلال الخامات المهملة وإعادة تدويرها؟\nالإجابة: إجابة إيجابية معللة بحماية البيئة وإنتاج أعمال مفيدة.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث التنوع الملمسي واستلهام العمارة العمانية.\nالإجابة: نقد متوازن يذكر نقاط القوة واقتراح تحسين.", "الحصة 1: أبواب وملامس: اختيار عنصر طبيعي وتبسيطه برسم خطه الخارجي في ورقة النشاط\nإرشاد للطالب: يلاحظ زخارف الأبواب والنوافذ في المباني القديمة في ولايته.\nإرشاد لولي الأمر: يصطحب ابنه إلى معلم أثري إن تيسر لملاحظة زخارفه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 25–27.\n\nالحصة 2: أبواب وملامس: إكساب الوحدة المبسطة ملامس متنوعة وتكرارها في تصميم الباب\nإرشاد للطالب: يجمع خامات ورقية مستهلكة (محارم، صحف) لعجينة الورق.\nإرشاد لولي الأمر: يشارك ابنه في جمع الخامات المستهلكة دعمًا لإعادة التدوير.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 27–28، 35–37.\n\nالحصة 3: نوافذ زاهية: تصميم نافذة عمانية على لوحة الكانفس بتكرار الوحدة الزخرفية\nإرشاد للطالب: يتأمل نوافذ البيوت القديمة في الحارات العمانية.\nإرشاد لولي الأمر: يحدث ابنه عن البيوت العمانية القديمة وتفاصيلها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 29–30.\n\nالحصة 4: نوافذ زاهية: تجهيز عجينة الورق وتلوينها ومعالجة الوحدات الزخرفية بها\nإرشاد للطالب: يتعرف على خامات منزلية قابلة لإعادة التدوير في الفن.\nإرشاد لولي الأمر: يحفز ابنه على فرز الورق المستهلك للاستفادة منه.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 30–31.\n\nالحصة 5: نوافذ زاهية: إضافة خامات لتنوع الملامس وإخراج العمل وتقويم الوحدة\nإرشاد للطالب: يعرض منتجه على أ : يلاحظ أن الطبقات المرتفعة صنعت العمق.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nالتعلم القبلي: أجزاء التكوين المنقولة إلى الكرتون.\n\nالتهيئة:\n- المعلم: يعرض قطعتين ملونتين: إحداهما حروفها بلون مميز والأخرى بلون الخلفية، ويسأل: أيهما أوضح؟\n- الطالب: يختار الحروف المميزة باللون.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nالتعلم القبلي: الأجزاء الملونة المفرغة.\n\nالتهيئة:\n- المعلم: يسأل: كيف نجعل الطبقة الأمامية ترتفع عن الخلفية؟\n- الطالب: يقترح وضع قطع صغيرة بين الطبقات.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي\nالتهيئة (5 دقائق):\n- المعلم: يعرض عملي إدريس الهوتي ومحمد الصائغ (ص 39) ويسأل: أي العملين يوحي بالاستقرار وأيهما بالحركة؟\n- الطالب: يقارن ويربط الإحساس باتجاه التكوين.\n\nتحليل التكوينات (12 دقيقة):\n- المعلم: يعرض أعمال إدريس الهوتي (تكوين أفقي) ومحمد الصائغ وعبدالقادر الريس (تكوين هرمي) ويحلل مع الطلبة.\n- الطالب: يحدد نوع التكوين في كل عمل والإحساس الناتج منه.\n\nلعبة التصنيف (10 دقائق):\n- المعلم: يوزع بطاقات صور لأعمال حروفية ويطلب تصنيفها بحسب نوع التكوين.\n- الطالب: يصنف البطاقات مع مجموعته.\n\nخريطة ذهنية (8 دقائق):\n- المعلم: يبني مع الطلبة خريطة ذهنية لأنواع التكوينات وإحساس كل منها.\n- الطالب: يكمل فروع الخريطة الذهنية.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم تكوين من مفردات العمارة العمانية.\n- الطالب: يقترح مفردة معمارية سيعتمد عليها.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه\nالتهيئة (5 دقائق):\n- المعلم: يعرض صور مفردات معمارية عمانية (أبراج، أقواس، شرفات) ويسأل: أي مفردة يمكن أن تتشكل من الحروف؟\n- الطالب: يقترح مفردة وحرفًا مناسبًا لها.\n\nرسم التكوين المعماري (15 دقيقة):\n- المعلم: يتابع رسم تكوين معماري (برج، قوس، بوابة) بأدوات الرسم.\n- الطالب: يرسم التكوين من مفردات العمارة العمانية.\n\nتوزيع الحروف (13 دقيقة):\n- المعلم: يوجه إلى توزيع الحروف على أجزاء التكوين بتوازن مع مراعاة ترتيب الطبقات للمرحلة القادمة.\n- الطالب: يوزع الحروف على التكوين ويستعين بالورق الشفاف لتجربة التوزيع.\n\nالختام (7 دقائق):\n- المعلم: يطلب استنتاج نوع التكوين في أعمال الزملاء وتلخيص التعلم.\n- الطالب: يستنتج أنواع التكوين ويلخص ما تعلمه.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات\nالتهيئة (5 دقائق):\n- المعلم: يعرض نموذجًا لعمل كرتوني متعدد الطبقات ويسأل: كيف ظهر العمق دون رسم ظل؟\n- الطالب: يلاحظ أن الطبقات المرتفعة صنعت العمق.\n\nترتيب الطبقات (8 دقائق):\n- المعلم: يوضح تقسيم التكوين إلى طبقات (خلفية، وسط، أمامية) وترقيمها.\n- الطالب: يرقم أجزاء تكوينه بحسب الطبقة.\n\nالنقل إلى الكرتون (20 دقيقة):\n- المعلم: يتابع نقل الأجزاء إلى الكرتون باستخدام الورق الشفاف.\n- الطالب: ينقل أجزاء التكوين إلى الكرتون بدقة.\n\nالختام (7 دقائق):\n- المعلم: يذكّر بقواعد السلامة ويعرض طريقة القطع الآمن للحصة القادمة.\n- الطالب: يراجع قواعد السلامة.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nالتهيئة (5 دقائق):\n- المعلم: يعرض قطعتين ملونتين: إحداهما حروفها بلون مميز والأخرى بلون الخلفية، ويسأل: أيهما أوضح؟\n- الطالب: يختار الحروف المميزة باللون.\n\nالتفريغ والقطع (15 دقيقة):\n- المعلم: يتابع القطع ويقدم المساعدة في المنحنيات الدقيقة.\n- الطالب: يفرغ الأشكال ويقطعها بحذر.\n\nالتلوين (15 دقيقة):\n- المعلم: يوجه إلى استخدام تباين لوني يبرز الحروف.\n- الطالب: يلون الأجزاء بألوان الأكريليك.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتنظيف وحفظ الأجزاء لتجف.\n- الطالب: ينظف الفرش ويحفظ أجزاءه.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نجعل الطبقة الأمامية ترتفع عن الخلفية؟\n- الطالب: يقترح وضع قطع صغيرة بين الطبقات.\n\nتجهيز الدعامات (8 دقائق):\n- المعلم: يوجه إلى تجهيز قطع كرتون صغيرة وتلوينها ولصقها خلف الشرائح.\n- الطالب: يجهز الدعامات ويلصقها.\n\nتجميع الطبقات (12 دقيقة):\n- المعلم: يتابع لصق الطبقات بالترتيب.\n- الطالب: يلصق الطبقات ليبرز التكوين المعماري بالحروف.\n\nتقويم الوحدة (8 دقائق):\n- المعلم: يوزع بطاقة تقويم الوحدة (ص 54).\n- الطالب: يجيب عن بطاقة التقويم.\n\nالختام (7 دقائق):\n- المعلم: يناقش أفكار الاستفادة من الأعمال (لوحة جدارية، غلاف، هدية).\n- الطالب: يقترح طريقة للاستفادة من عمله وتسويقه.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي\nس1 (مستوى المعرفة): سمِّ نوعين من أنواع التكوين الفني.\nالإجابة: الأفقي والهرمي (أو الدائري والإشعاعي).\n\nس2 (مستوى التطبيق): بماذا يوحي التكوين الهرمي؟\nالإجابة: بالثبات والقوة والشموخ.\n\nس3 (مستوى الاستدلال): لماذا تختلف الأحاسيس باختلاف نوع التكوين؟\nالإجابة: لأن اتجاه الحركة وتوزيع الكتل يوجهان عين المشاهد ويثيران أحاسيس مختلفة.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه\nس1 (مستوى المعرفة): اذكر مفردتين من مفردات العمارة العمانية.\nالإجابة: البرج والقوس (أو البوابة والشرفات).\n\nس2 (مستوى التطبيق): كيف تحقق التوازن في توزيع الحروف؟\nالإجابة: بتوزيعها بالتساوي على جانبي التكوين أو حول محوره.\n\nس3 (مستوى الاستدلال): لماذا نحدد ترتيب الطبقات في هذه المرحلة؟\nالإجابة: لأن التكوين سينفذ بطبقات بارزة من الكرتون في النشاط القادم.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات\nس1 (مستوى المعرفة): ما فائدة الورق الشفاف في النقل؟\nالإجابة: نقل التكوين بدقة إلى الكرتون.\n\nس2 (مستوى التطبيق): رتب طبقات التكوين من الخلف إلى الأمام.\nالإجابة: الخلفية، الوسط، الأمامية.\n\nس3 (مستوى الاستدلال): كيف يسهم ترتيب الطبقات في إبراز الحروف؟\nالإجابة: يجعل الحروف في طبقة أمامية بارزة فتلفت الانتباه.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nس1 (مستوى المعرفة): ما الأداة المستخدمة للتفريغ؟\nالإجابة: القاطع المعدني.\n\nس2 (مستوى التطبيق): كيف تبرز الحروف باللون؟\nالإجابة: باستخدام لون متباين مع لون الخلفية.\n\nس3 (مستوى الاستدلال): اقترح ألوانًا مستوحاة من العمارة العمانية لتكوينك.\nالإجابة: ألوان ترابية (البيج، البني) مع لمسات من الأبيض والأزرق.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): ما وظيفة الدعامات في العمل؟\nالإجابة: رفع الطبقات لإبراز العمق.\n\nس2 (مستوى التطبيق): كيف أبرزت الحروف جمال التكوين المعماري؟\nالإجابة: أضافت إيقاعًا وهوية وزخرفة للأشكال المعمارية.\n\nس3 (مستوى الاستدلال): اقترح منتجًا نفعيًا يمكن تطويره من عملك.\nالإجابة: مثال: لوحة جدارية للمنازل أو غلاف دفتر بارز.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي\nس1 (مستوى المعرفة): ما نوع التكوين في عمل إدريس الهوتي؟\nالإجابة: تكوين أفقي.\n\nس2 (مستوى التطبيق): صنف عملًا حروفيًا عُرض عليك وبيّن نوع تكوينه.\nالإجابة: إجابة صحيحة تحدد نوع التكوين بدليل من العمل.\n\nس3 (مستوى الاستدلال): أي التكوينات أنسب للتعبير عن قلعة عمانية؟ علّل.\nالإجابة: الهرمي؛ لأنه يوحي بالثبات والقوة والشموخ.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه\nس1 (مستوى المعرفة): ما المفردة المعمارية التي رسمتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما نوع التكوين في عمل زميلك؟\nالإجابة: إجابة صحيحة تحدد النوع بدليل.\n\nس3 (مستوى الاستدلال): قيّم توازن توزيع الحروف في تكوينك.\nالإجابة: تقييم يذكر مواطن التوازن وما يحتاج تعديلًا.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات\nس1 (مستوى المعرفة): ما الخامة التي نُقل إليها التكوين؟\nالإجابة: الكرتون أو الورق المقوى.\n\nس2 (مستوى التطبيق): اذكر قاعدتي سلامة عند استخدام القاطع المعدني.\nالإجابة: القطع على سطح واقٍ، وتوجيه الشفرة بعيدًا عن اليد.\n\nس3 (مستوى الاستدلال): اقترح عدد الطبقات المناسب لتكوينك وعلّل.\nالإجابة: إجابة معللة بتعدد مستويات التكوين.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nس1 (مستوى المعرفة): ما نوع الألوان المستخدمة في التلوين؟\nالإجابة: ألوان الأكريليك.\n\nس2 (مستوى التطبيق): وضّح كيف حققت التباين في عملك.\nالإجابة: إجابة تذكر لون الحروف ولون الخلفية المتباين.\n\nس3 (مستوى الاستدلال): قيّم دقة القطع في عملك واقترح تحسينًا.\nالإجابة: تقييم يذكر وضوح الحواف واقتراح القطع ببطء أو استخدام مسطرة.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nس1 (مستوى المعرفة): هل منتجك الفني قابل للتسويق؟\nالإجابة: إجابة معللة.\n\nس2 (مستوى التطبيق): تحدث عن أهمية الحروف العربية في عملك.\nالإجابة: تعبر عن الهوية وتضيف جمالًا وإيقاعًا للتكوين.\n\nس3 (مستوى الاستدلال): انقد عمل زميل من حيث وضوح الطبقات والتكوين.\nالإجابة: نقد يذكر وضوح المستويات واقتراح تحسين.", "الحصة 1: تكوين من روح العمارة: التعرف على أنواع التكوينات الفنية بالحرف العربي\nإرشاد للطالب: يلاحظ التكوينات في الخط العربي على واجهات المساجد.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جمال الخط العربي في الأماكن التي يزورها.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 48–49.\n\nالحصة 2: تكوين من روح العمارة: رسم تكوين من مفردات العمارة العمانية وتوزيع الحروف عليه\nإرشاد للطالب: يتأمل الأبراج والقلاع العمانية ويلاحظ أشكالها.\nإرشاد لولي الأمر: يحدث ابنه عن معلم معماري عماني قريب.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 50.\n\nالحصة 3: تكوين من الحروف العربية: نقل التكوين إلى الكرتون وتحديد الطبقات\nإرشاد للطالب: يجهز كرتونًا مستعملًا نظيفًا للنشاط.\nإرشاد لولي الأمر: يتابع التزام ابنه بقواعد السلامة.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 52.\n\nالحصة 4: تكوين من الحروف العربية: تفريغ الأشكال وقطعها وتلوينها مع إبراز الحروف\nإرشاد للطالب: يتعرف على الألوان الترابية في العمارة العمانية.\nإرشاد لولي الأمر: يتابع مع ابنه تقدم عمله.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 52–53.\n\nالحصة 5: تكوين من الحروف العربية: تجميع الطبقات بالدعامات وإخراج العمل وتقويم الوحدة\nإرشاد للطالب: يعرض عمله على أسرته ويحدثهم عن فكرته.\nإرشاد لولي الأمر: يشجع ابنه على تطوير أعماله إلى منتجات.\nالمرجع: دليل المعلم (الفنون البصرية – الصف الثامن) ص 53–54.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/arts/?l=4"]}];
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
