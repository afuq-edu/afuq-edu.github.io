ورة من الأمام ضد مدافع.\nالإجابة: يؤديها.\nس3 (مستوى الاستدلال): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك إرشادات المعلم في دليل المعلم ص 9-13.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها، ومراجعة مفهوم اللياقة المرتبطة بالصحة (دليل المعلم ص 37-39).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=1"}}, {"title": "اللياقة البدنية المرتبطة بالصحة (القوة العضلية، والتحمل الدوري التنفسي)", "unit": "اللياقة البدنية", "week": "الثاني – الثالث", "date": "13-17/9/2026 إلى 20-24/9/2026", "pages": "دليل المعلم ص 37-50", "n": 4, "periods": [{"focus": "مفهوم اللياقة المرتبطة بالصحة وعنصر القوة العضلية وأنواعها والعوامل المؤثرة فيها", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم اللياقة البدنية المرتبطة بالصحة وعناصرها.\n2. يحلل العلاقة بين القوة العضلية والعوامل المؤثرة فيها (التدريب، العمر، نوع الألياف).\n3. يؤدي تمرينات حرة وبالأدوات لتنمية القوة العضلية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: أحزمة مطاطية\n- أخرى: وسادة توازن\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- اللياقة المرتبطة بالصحة\n- القوة العضلية\n- المقاومة\n- الانقباض الإرادي", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور رامي الجلة ولاعب كرة يد يصوب ويسأل: ما العنصر المشترك؟ ويقدم اللياقة المرتبطة بالصحة والقوة العضلية (ص 39-40).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وعناصره (التحمل، المرونة، القوة، التحمل العضلي، التركيب الجسمي)، والقوة العضلية (التغلب على مقاومة بانقباض إرادي) وأنواعها وأهميتها وعواملها، ويؤدي النماذج ص 42: (إقعاء) الوثب لأعلى مع فرد الجسم، (انبطاح مائل) الارتكاز على الساعدين والثبات، دفع الكرة الطبية للأمام، (حزام مطاطي حول الساقين) رفع الرجلين، سحب يد الزميل، ثني الذراعين على وسادة التوازن، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط المحطات ص 46: أربع محطات بالتمرينات السابقة مع تبديل وتسجيل التكرارات، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة في مجموعات: لماذا يختلف الطلبة في القوة؟ ويذكرون عاملين ويعرضون، ويحلل الطالب ويعرض (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما القوة العضلية؟\nالإجابة: قدرة العضلات على التغلب على مقاومة خارجية بانقباض إرادي.\nس2 (مستوى التطبيق): اذكر مهارة تحتاج إلى القوة العضلية.\nالإجابة: دفع الجلة أو التصويب في كرة اليد.\nس3 (مستوى الاستدلال): اذكر عاملًا يؤثر في القوة.\nالإجابة: التدريب أو نوع الألياف العضلية.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر عناصر اللياقة المرتبطة بالصحة.\nالإجابة: التحمل الدوري التنفسي، المرونة، القوة، التحمل العضلي، التركيب الجسمي.\nس2 (مستوى التطبيق): أدِّ تمرين دفع الكرة الطبية للأمام.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف تحسن القوة العضلية قوامك؟\nالإجابة: تقوي عضلات الجذع التي تحمل الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرين الارتكاز على الساعدين (بلانك) 30 ثانية يوميًا (دليل المعلم ص 40-42).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=2"}}, {"focus": "قياس القوة العضلية (الوثب العريض من الثبات، دفع الكرة الطبية من الجلوس) ومنافساتها", "num": 2, "fields": {"المخرجات التعليمية": "1. يطبق اختباري الوثب العريض من الثبات ودفع الكرة الطبية من الجلوس.\n2. يسجل نتائجه ويقارنها بزملائه.\n3. يوظف القوة العضلية في منافسات.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: شريط قياس\n- أخرى: كرات طبية 1-2 كجم\n- أخرى: حائط\n- أخرى: استمارات تسجيل\n- أخرى: أقماع", "المفاهيم": "- قياس القوة\n- الوثب العريض من الثبات\n- دفع الكرة الطبية من الجلوس\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القوة ويسأل: كيف نقيسها دون أجهزة؟ ويعرض الاختبارين (ص 40-41).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مجموعات بقائد: اختبار الوثب العريض (ثني الركبتين ومرجحة الذراعين والوثب بالقدمين والهبوط بتوازن، قياس من الخط إلى الكعبين، أفضل محاولتين)، ثم دفع الكرة الطبية من الجلوس والظهر ملاصق للحائط (المسافة من الحائط إلى أول لمسة)، مع التسجيل، ويؤدي الطالب ويسجل لزميله (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط المربع ص 46: مسار مربع 5 م بمناطق أداء في الزوايا (وثب، دفع كرة، ثني ذراعين) ومنافسة بين المجموعات، ويتسابق الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يقارن الطلبة النتائج ويستنتجون علاقة الوثب العريض بقوة الرجلين ودفع الكرة بقوة الذراعين، ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين تقاس مسافة الوثب العريض؟\nالإجابة: من خط البداية إلى آخر جزء يلمس الأرض خلفًا (الكعبان).\nس2 (مستوى التطبيق): ما شرط دفع الكرة الطبية من الجلوس؟\nالإجابة: بقاء الظهر ملاصقًا للحائط.\nس3 (مستوى الاستدلال): ماذا يحدث لو سقط الطالب للخلف بعد الوثب؟\nالإجابة: تعاد المحاولة.", "التقويم الختامي": "س1 (مستوى المعرفة): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (مستوى التطبيق): أي الاختبارين يقيس قوة الرجلين؟\nالإجابة: الوثب العريض من الثبات.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين نتيجة دفع الكرة الطبية.\nالإجابة: دفع الكرة الطبية من الصدر يوميًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تسجيل نتيجته في الوثب العريض ومحاولة تحسينها (دليل المعلم ص 40-41).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=2"}}, {"focus": "التحمل الدوري التنفسي وتمرينات تنميته", "num": 3, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم التحمل الدوري التنفسي وأنواعه وأهميته.\n2. يؤدي تمرينات لتنمية التحمل (الجري الجانبي المكوكي، الصعود والنزول على المقعد، نقل الرجلين من الانبطاح المائل).\n3. يقدر أهمية التحمل في الحياة اليومية والألعاب الجماعية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n- أخرى: حبال وثب", "المفاهيم": "- التحمل الدوري التنفسي\n- التحمل الهوائي\n- اللاهوائي\n- الاقتصاد في الجهد", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يستمر لاعب كرة القدم 90 دقيقة دون انهيار؟ ويقدم التحمل (ص 43-44).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وأنواعه وأهميته (كفاءة الجهازين، الاقتصاد في الجهد)، ويؤدي النماذج ص 45: الجري الجانبي المكوكي 3 دقائق، الصعود والنزول على المقعد، نقل الرجلين للأمام والخلف من الانبطاح المائل، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات تحمل بزمن 3 دقائق لكل محطة مع قياس النبض بعدها، ويؤدي الطالب ويقيس (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يقارن الطلبة النبض بين المحطات ويستنتجون أثر الجهد المستمر، ويستنتج الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما التحمل الدوري التنفسي؟\nالإجابة: قدرة الفرد على أداء جهد متوسط الشدة لمدة طويلة.\nس2 (مستوى التطبيق): اذكر نوعين للتحمل.\nالإجابة: الهوائي واللاهوائي.\nس3 (مستوى الاستدلال): اذكر تمرينًا للتحمل بالمقعد.\nالإجابة: الصعود والنزول بالتبادل.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر فائدتين للتحمل.\nالإجابة: كفاءة القلب والرئتين والاقتصاد في الجهد.\nس2 (مستوى التطبيق): أدِّ الجري الجانبي المكوكي دقيقتين.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف يساعد التحمل في حياتك اليومية؟\nالإجابة: يجعلني أؤدي مهامي دون تعب سريع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على نشاط هوائي 20 دقيقة ثلاث مرات أسبوعيًا (دليل المعلم ص 43-45).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=2"}}, {"focus": "قياس التحمل الدوري التنفسي (اختبار الخطوة) وتوظيف العنصرين في الألعاب", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق اختبار الخطوة (الصعود والنزول على منصة) وقياس النبض.\n2. يوظف القوة العضلية والتحمل في ألعاب ومسابقات.\n3. يقدر أهمية ممارسة تمرينات اللياقة المرتبطة بالصحة باستمرار.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية أو صناديق\n- أخرى: ساعة إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n- أخرى: كرات طبية", "المفاهيم": "- اختبار الخطوة\n- النبض\n- الإيقاع\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التحمل ويعرض اختبار الخطوة (ص 44) وطريقة قياس النبض يدويًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار الخطوة: صعود ونزول على منصة بإيقاع محدد لمدة محددة ثم قياس النبض وتسجيله، في مجموعتين بالتبادل (تؤدي وتسجل)، ويؤدي الطالب ويقيس ويسجل (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة (كرة الملك المستمرة) 8 دقائق مع محطة دفع كرة طبية عند التسجيل لتوظيف القوة والتحمل، ويلعب الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا كان نبض بعض الزملاء أقل بعد الاختبار؟ ليستنتج الطلبة أثر التدريب المنتظم، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الذي نقيسه بعد اختبار الخطوة؟\nالإجابة: النبض.\nس2 (مستوى التطبيق): ماذا يدل انخفاض النبض بعد الاختبار؟\nالإجابة: على تحمل أفضل.\nس3 (مستوى الاستدلال): ما العنصران اللذان وظفناهما في اللعبة؟\nالإجابة: القوة العضلية والتحمل.", "التقويم الختامي": "س1 (مستوى المعرفة): كيف تقيس نبضك يدويًا؟\nالإجابة: بوضع إصبعين على الرسغ أو الرقبة وعد النبضات في 15 ثانية وضربها في 4.\nس2 (مستوى التطبيق): اقترح خطة أسبوعية لتحسين تحملك.\nالإجابة: جري 20 دقيقة ثلاث مرات أسبوعيًا.\nس3 (مستوى الاستدلال): لماذا نستمر في تمرينات اللياقة المرتبطة بالصحة؟\nالإجابة: لأن فوائدها تزول بالتوقف عن التدريب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تسجيل نبضه قبل النشاط وبعده أسبوعًا، والاطلاع على اللياقة المرتبطة بالمهارة (دليل المعلم ص 52-53).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مفهوم اللياقة البدنية المرتبطة بالصحة وعناصرها.\n2. يحلل العلاقة بين القوة العضلية والعوامل المؤثرة فيها (التدريب، العمر، نوع الألياف).\n3. يؤدي تمرينات حرة وبالأدوات لتنمية القوة العضلية.\n\nالحصة 2:\n1. يطبق اختباري الوثب العريض من الثبات ودفع الكرة الطبية من الجلوس.\n2. يسجل نتائجه ويقارنها بزملائه.\n3. يوظف القوة العضلية في منافسات.\n\nالحصة 3:\n1. يذكر مفهوم التحمل الدوري التنفسي وأنواعه وأهميته.\n2. يؤدي تمرينات لتنمية التحمل (الجري الجانبي المكوكي، الصعود والنزول على المقعد، نقل الرجلين من الانبطاح المائل).\n3. يقدر أهمية التحمل في الحياة اليومية والألعاب الجماعية.\n\nالحصة 4:\n1. يطبق اختبار الخطوة (الصعود والنزول على منصة) وقياس النبض.\n2. يوظف القوة العضلية والتحمل في ألعاب ومسابقات.\n3. يقدر أهمية ممارسة تمرينات اللياقة المرتبطة بالصحة باستمرار.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طبية\n- أخرى: أحزمة مطاطية\n- أخرى: وسادة توازن\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: شريط قياس\n- أخرى: كرات طبية 1-2 كجم\n- أخرى: حائط\n- أخرى: استمارات تسجيل\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: مقاعد سويدية\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n- أخرى: حبال وثب\n\nالحصة 4:\n- أخرى: مقاعد سويدية أو صناديق\n- أخرى: ساعة إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n- أخرى: كرات طبية", "المفاهيم": "الحصة 1:\n- اللياقة المرتبطة بالصحة\n- القوة العضلية\n- المقاومة\n- الانقباض الإرادي\n\nالحصة 2:\n- قياس القوة\n- الوثب العريض من الثبات\n- دفع الكرة الطبية من الجلوس\n- التسجيل\n\nالحصة 3:\n- التحمل الدوري التنفسي\n- التحمل الهوائي\n- اللاهوائي\n- الاقتصاد في الجهد\n\nالحصة 4:\n- اختبار الخطوة\n- النبض\n- الإيقاع\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور رامي الجلة ولاعب كرة يد يصوب ويسأل: ما العنصر المشترك؟ ويقدم اللياقة المرتبطة بالصحة والقوة العضلية (ص 39-40).\n\nالحصة 2:\nيراجع المعلم القوة ويسأل: كيف نقيسها دون أجهزة؟ ويعرض الاختبارين (ص 40-41).\n\nالحصة 3:\nيسأل المعلم: لماذا يستمر لاعب كرة القدم 90 دقيقة دون انهيار؟ ويقدم التحمل (ص 43-44).\n\nالحصة 4:\nيراجع المعلم التحمل ويعرض اختبار الخطوة (ص 44) وطريقة قياس النبض يدويًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وعناصره (التحمل، المرونة، القوة، التحمل العضلي، التركيب الجسمي)، والقوة العضلية (التغلب على مقاومة بانقباض إرادي) وأنواعها وأهميتها وعواملها، ويؤدي النماذج ص 42: (إقعاء) الوثب لأعلى مع فرد الجسم، (انبطاح مائل) الارتكاز على الساعدين والثبات، دفع الكرة الطبية للأمام، (حزام مطاطي حول الساقين) رفع الرجلين، سحب يد الزميل، ثني الذراعين على وسادة التوازن، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط المحطات ص 46: أربع محطات بالتمرينات السابقة مع تبديل وتسجيل التكرارات، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة في مجموعات: لماذا يختلف الطلبة في القوة؟ ويذكرون عاملين ويعرضون، ويحلل الطالب ويعرض (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مجموعات بقائد: اختبار الوثب العريض (ثني الركبتين ومرجحة الذراعين والوثب بالقدمين والهبوط بتوازن، قياس من الخط إلى الكعبين، أفضل محاولتين)، ثم دفع الكرة الطبية من الجلوس والظهر ملاصق للحائط (المسافة من الحائط إلى أول لمسة)، مع التسجيل، ويؤدي الطالب ويسجل لزميله (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط المربع ص 46: مسار مربع 5 م بمناطق أداء في الزوايا (وثب، دفع كرة، ثني ذراعين) ومنافسة بين المجموعات، ويتسابق الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يقارن الطلبة النتائج ويستنتجون علاقة الوثب العريض بقوة الرجلين ودفع الكرة بقوة الذراعين، ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وأنواعه وأهميته (كفاءة الجهازين، الاقتصاد في الجهد)، ويؤدي النماذج ص 45: الجري الجانبي المكوكي 3 دقائق، الصعود والنزول على المقعد، نقل الرجلين للأمام والخلف من الانبطاح المائل، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات تحمل بزمن 3 دقائق لكل محطة مع قياس النبض بعدها، ويؤدي الطالب ويقيس (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يقارن الطلبة النبض بين المحطات ويستنتجون أثر الجهد المستمر، ويستنتج الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار الخطوة: صعود ونزول على منصة بإيقاع محدد لمدة محددة ثم قياس النبض وتسجيله، في مجموعتين بالتبادل (تؤدي وتسجل)، ويؤدي الطالب ويقيس ويسجل (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة (كرة الملك المستمرة) 8 دقائق مع محطة دفع كرة طبية عند التسجيل لتوظيف القوة والتحمل، ويلعب الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا كان نبض بعض الزملاء أقل بعد الاختبار؟ ليستنتج الطلبة أثر التدريب المنتظم، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما القوة العضلية؟\nالإجابة: قدرة العضلات على التغلب على مقاومة خارجية بانقباض إرادي.\nس2 (مستوى التطبيق): اذكر مهارة تحتاج إلى القوة العضلية.\nالإجابة: دفع الجلة أو التصويب في كرة اليد.\nس3 (مستوى الاستدلال): اذكر عاملًا يؤثر في القوة.\nالإجابة: التدريب أو نوع الألياف العضلية.\n\nالحصة 2:\nس1 (مستوى المعرفة): من أين تقاس مسافة الوثب العريض؟\nالإجابة: من خط البداية إلى آخر جزء يلمس الأرض خلفًا (الكعبان).\nس2 (مستوى التطبيق): ما شرط دفع الكرة الطبية من الجلوس؟\nالإجابة: بقاء الظهر ملاصقًا للحائط.\nس3 (مستوى الاستدلال): ماذا يحدث لو سقط الطالب للخلف بعد الوثب؟\nالإجابة: تعاد المحاولة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما التحمل الدوري التنفسي؟\nالإجابة: قدرة الفرد على أداء جهد متوسط الشدة لمدة طويلة.\nس2 (مستوى التطبيق): اذكر نوعين للتحمل.\nالإجابة: الهوائي واللاهوائي.\nس3 (مستوى الاستدلال): اذكر تمرينًا للتحمل بالمقعد.\nالإجابة: الصعود والنزول بالتبادل.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما الذي نقيسه بعد اختبار الخطوة؟\nالإجابة: النبض.\nس2 (مستوى التطبيق): ماذا يدل انخفاض النبض بعد الاختبار؟\nالإجابة: على تحمل أفضل.\nس3 (مستوى الاستدلال): ما العنصران اللذان وظفناهما في اللعبة؟\nالإجابة: القوة العضلية والتحمل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر عناصر اللياقة المرتبطة بالصحة.\nالإجابة: التحمل الدوري التنفسي، المرونة، القوة، التحمل العضلي، التركيب الجسمي.\nس2 (مستوى التطبيق): أدِّ تمرين دفع الكرة الطبية للأمام.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف تحسن القوة العضلية قوامك؟\nالإجابة: تقوي عضلات الجذع التي تحمل الجسم معتدلًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (مستوى التطبيق): أي الاختبارين يقيس قوة الرجلين؟\nالإجابة: الوثب العريض من الثبات.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين نتيجة دفع الكرة الطبية.\nالإجابة: دفع الكرة الطبية من الصدر يوميًا.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر فائدتين للتحمل.\nالإجابة: كفاءة القلب والرئتين والاقتصاد في الجهد.\nس2 (مستوى التطبيق): أدِّ الجري الجانبي المكوكي دقيقتين.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف يساعد التحمل في حياتك اليومية؟\nالإجابة: يجعلني أؤدي مهامي دون تعب سريع.\n\nالحصة 4:\nس1 (مستوى المعرفة): كيف تقيس نبضك يدويًا؟\nالإجابة: بوضع إصبعين على الرسغ أو الرقبة وعد النبضات في 15 ثانية وضربها في 4.\nس2 (مستوى التطبيق): اقترح خطة أسبوعية لتحسين تحملك.\nالإجابة: جري 20 دقيقة ثلاث مرات أسبوعيًا.\nس3 (مستوى الاستدلال): لماذا نستمر في تمرينات اللياقة المرتبطة بالصحة؟\nالإجابة: لأن فوائدها تزول بالتوقف عن التدريب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرين الارتكاز على الساعدين (بلانك) 30 ثانية يوميًا (دليل المعلم ص 40-42).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تسجيل نتيجته في الوثب العريض ومحاولة تحسينها (دليل المعلم ص 40-41).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على نشاط هوائي 20 دقيقة ثلاث مرات أسبوعيًا (دليل المعلم ص 43-45).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تسجيل نبضه قبل النشاط وبعده أسبوعًا، والاطلاع على اللياقة المرتبطة بالمهارة (دليل المعلم ص 52-53).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=2"}}, {"title": "اللياقة البدنية المرتبطة بالمهارة (الرشاقة، والتوازن)", "unit": "اللياقة البدنية", "week": "الرابع – الخامس", "date": "27/9-1/10/2026 إلى 4-8/10/2026", "pages": "دليل المعلم ص 52-64", "n": 4, "periods": [{"focus": "مفهوم اللياقة المرتبطة بالمهارة وعنصر الرشاقة وأهميتها وعواملها", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم اللياقة البدنية المرتبطة بالمهارة وعناصرها.\n2. يربط بين الرشاقة والعوامل المؤثرة فيها (القوة، السرعة، التوافق).\n3. يؤدي تمرينات لتنمية الرشاقة (الوثب والدوران، الجري والتوقف المفاجئ، سلم الرشاقة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: سلم الرشاقة\n- أخرى: أطواق\n- أخرى: ساعة إيقاف\n- صورة توضيحية", "المفاهيم": "- اللياقة المرتبطة بالمهارة\n- الرشاقة\n- تغيير الاتجاه\n- التوقيت", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب كرة يد يراوغ ويسأل: ما العنصر الذي يمكّنه من تغيير اتجاهه فجأة؟ ويقدم الرشاقة (ص 53).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وعناصره (السرعة، الرشاقة، التوازن، التوافق)، والرشاقة (تغيير أوضاع الجسم أو اتجاهاته بدقة وتوقيت) وأهميتها وعواملها، ويؤدي النماذج ص 55: الجري 5 م ثم الوثب والدوران ربع لفة، الوثب للجانبين، الجري السريع والتوقف المفاجئ ولمس الأقماع، الجري الجانبي في سلم الرشاقة، الجري بين أقماع للأمام والخلف والجانب، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الرشاقة بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يجرب الطلبة تغيير الاتجاه بسرعة عالية ثم بسرعة متوسطة ويكتشفون علاقة الرشاقة بالتحكم، ويجرب الطالب ويستنتج (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الرشاقة؟\nالإجابة: قدرة الفرد على تغيير أوضاع جسمه أو اتجاهات حركته بدقة وتوقيت مناسب.\nس2 (مستوى التطبيق): اذكر مهارة تحتاج إلى الرشاقة.\nالإجابة: الخداع والمحاورة في كرة اليد والسلة والقدم.\nس3 (مستوى الاستدلال): اذكر عاملًا يؤثر في الرشاقة.\nالإجابة: القوة أو السرعة أو التوافق.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر عناصر اللياقة المرتبطة بالمهارة.\nالإجابة: السرعة، الرشاقة، التوازن، التوافق.\nس2 (مستوى التطبيق): أدِّ الجري السريع والتوقف المفاجئ ولمس القمع.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): لماذا تحتاج ألعاب المضرب إلى الرشاقة؟\nالإجابة: لتغطية الملعب والوصول السريع إلى الريشة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الجري بين عوائق مع تغيير الاتجاه (دليل المعلم ص 53-55).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=3"}}, {"focus": "قياس الرشاقة (اختبار T) ومنافسات الرشاقة", "num": 2, "fields": {"المخرجات التعليمية": "1. يطبق اختبار الرشاقة (T) بالتسلسل الصحيح.\n2. يسجل زمنه ويقارنه.\n3. يوظف الرشاقة في منافسات وألعاب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات", "المفاهيم": "- اختبار T\n- الجري الجانبي\n- الجري للخلف\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الرشاقة ويعرض اختبار T بأربعة أقماع (ص 54).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار T في مجموعات بقائد يحمل الساعة: جري أمامي للقمع B، جري جانبي يسارًا للقمع C، جري جانبي يمينًا للقمع D مرورًا بـB، جري جانبي للقمع B، جري للخلف للقمع A، مع التسجيل، ويؤدي الطالب ويسجل لزميله (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 60: تتابع رشاقة بين المجموعات في مسار T، ويتسابق الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يناقش الطلبة: ما المرحلة الأصعب في الاختبار ولماذا؟ ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما شكل مسار اختبار الرشاقة؟\nالإجابة: حرف T.\nس2 (مستوى التطبيق): كيف نعود إلى القمع A في نهاية الاختبار؟\nالإجابة: بالجري للخلف.\nس3 (مستوى الاستدلال): ما القاعدة في اختبار T؟\nالإجابة: لمس كل قمع في ترتيبه الصحيح.", "التقويم الختامي": "س1 (مستوى المعرفة): ما زمنك في اختبار T وما هدفك؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): أي المراحل كانت الأبطأ ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين زمنك.\nالإجابة: الجري الجانبي بين أقماع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على اختبار T أسبوعيًا ومقارنة الزمن (دليل المعلم ص 54-60).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=3"}}, {"focus": "عنصر التوازن (الثابت والحركي) وأهميته وعوامله وتمرينات تنميته", "num": 3, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم التوازن وأنواعه والعوامل المؤثرة فيه.\n2. يؤدي تمرينات للتوازن الثابت والحركي.\n3. يميز مواقف التوازن الثابت من الحركي في الألعاب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: وسائد توازن\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التوازن الثابت\n- التوازن الحركي\n- مركز الثقل\n- قاعدة الارتكاز", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم على وسادة توازن ويسأل: ما الذي يبقيني ثابتًا؟ ويقدم التوازن (ص 56-57).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم (الاحتفاظ بمركز الثقل فوق قاعدة الارتكاز) وأنواعه وأهميته وعوامله (قاعدة الارتكاز، مركز الثقل، النظر، القوة)، ويؤدي النماذج: الوقوف على قدم مع إغماض العينين، الميزان، المشي على المقعد مع تغيير الاتجاه، الهبوط بثبات بعد الوثب، الوقوف على وسادة التوازن، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوازن بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة في مجموعات مواقف (الهبوط بعد الوثب العالي، الوقوف على اليدين، المشي على العارضة) ويصنفونها، ويحلل الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما التوازن؟\nالإجابة: قدرة الفرد على الاحتفاظ بمركز ثقل الجسم فوق قاعدة الارتكاز.\nس2 (مستوى التطبيق): ما الفرق بين التوازن الثابت والحركي؟\nالإجابة: الثابت في وضع ثابت، والحركي أثناء الحركة.\nس3 (مستوى الاستدلال): اذكر عاملًا يؤثر في التوازن.\nالإجابة: اتساع قاعدة الارتكاز أو النظر لنقطة ثابتة.", "التقويم الختامي": "س1 (مستوى المعرفة): صنف: الهبوط بثبات بعد الوثب العالي.\nالإجابة: توازن حركي.\nس2 (مستوى التطبيق): أدِّ الوقوف على قدم مع إغماض العينين 10 ثوانٍ.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف يسهم التوازن في الوقاية من الإصابات؟\nالإجابة: يمنع السقوط ويحفظ ثبات المفاصل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الوقوف على قدم واحدة بعينين مغمضتين 15 ثانية يوميًا (دليل المعلم ص 56-57).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=3"}}, {"focus": "قياس التوازن (الوقوف على مشط قدم واحدة، اختبار Y) ومنافسات التوازن", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق اختباري الوقوف على مشط قدم واحدة واختبار التوازن Y.\n2. يسجل نتائجه ويقارن.\n3. يوظف الرشاقة والتوازن في ألعاب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: ساعات إيقاف\n- أخرى: شريط قياس\n- أخرى: أقماع منخفضة\n- أخرى: استمارات تسجيل\n- أخرى: كرات", "المفاهيم": "- اختبار Y\n- الوقوف على مشط القدم\n- الرجل الحرة\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التوازن ويعرض الاختبارين (ص 57-58).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار الوقوف على مشط قدم واحدة (باطن القدم الأخرى على ركبة رجل الارتكاز واليدان على الوسط ورفع العقب) بالزمن، ثم اختبار Y (مد الرجل الحرة للأمام ثم الخلف يسارًا ثم الخلف يمينًا لأقصى مسافة مع الحفاظ على التوازن) بالقياس، في مجموعات بقائد، ويؤدي الطالب ويسجل لزميله (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة: مسار يجمع الرشاقة (T مصغر) والتوازن (المشي على المقعد والهبوط بثبات)، ويتسابق الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يقارن الطلبة نتائجهم ويستنتجون أثر النظر لنقطة ثابتة في زمن الثبات، ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): أين توضع باطن القدم الحرة في اختبار الوقوف على المشط؟\nالإجابة: على الجانب الداخلي لركبة رجل الارتكاز.\nس2 (مستوى التطبيق): ما مراحل اختبار Y؟\nالإجابة: الأمام، الخلف يسارًا، الخلف يمينًا.\nس3 (مستوى الاستدلال): متى ينتهي اختبار الوقوف على المشط؟\nالإجابة: عند لمس العقب الأرض أو فقد التوازن.", "التقويم الختامي": "س1 (مستوى المعرفة): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (مستوى التطبيق): أي الاتجاهات كان الأصعب في اختبار Y ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين توازنك.\nالإجابة: الوقوف على وسادة التوازن يوميًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات التوازن اليومية، والاطلاع على سباق العدو 100 م (دليل المعلم ص 69-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مفهوم اللياقة البدنية المرتبطة بالمهارة وعناصرها.\n2. يربط بين الرشاقة والعوامل المؤثرة فيها (القوة، السرعة، التوافق).\n3. يؤدي تمرينات لتنمية الرشاقة (الوثب والدوران، الجري والتوقف المفاجئ، سلم الرشاقة).\n\nالحصة 2:\n1. يطبق اختبار الرشاقة (T) بالتسلسل الصحيح.\n2. يسجل زمنه ويقارنه.\n3. يوظف الرشاقة في منافسات وألعاب.\n\nالحصة 3:\n1. يذكر مفهوم التوازن وأنواعه والعوامل المؤثرة فيه.\n2. يؤدي تمرينات للتوازن الثابت والحركي.\n3. يميز مواقف التوازن الثابت من الحركي في الألعاب.\n\nالحصة 4:\n1. يطبق اختباري الوقوف على مشط قدم واحدة واختبار التوازن Y.\n2. يسجل نتائجه ويقارن.\n3. يوظف الرشاقة والتوازن في ألعاب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: سلم الرشاقة\n- أخرى: أطواق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n\nالحصة 3:\n- أخرى: وسائد توازن\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: ساعات إيقاف\n- أخرى: شريط قياس\n- أخرى: أقماع منخفضة\n- أخرى: استمارات تسجيل\n- أخرى: كرات", "المفاهيم": "الحصة 1:\n- اللياقة المرتبطة بالمهارة\n- الرشاقة\n- تغيير الاتجاه\n- التوقيت\n\nالحصة 2:\n- اختبار T\n- الجري الجانبي\n- الجري للخلف\n- الزمن\n\nالحصة 3:\n- التوازن الثابت\n- التوازن الحركي\n- مركز الثقل\n- قاعدة الارتكاز\n\nالحصة 4:\n- اختبار Y\n- الوقوف على مشط القدم\n- الرجل الحرة\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة لاعب كرة يد يراوغ ويسأل: ما العنصر الذي يمكّنه من تغيير اتجاهه فجأة؟ ويقدم الرشاقة (ص 53).\n\nالحصة 2:\nيراجع المعلم الرشاقة ويعرض اختبار T بأربعة أقماع (ص 54).\n\nالحصة 3:\nيقف المعلم على وسادة توازن ويسأل: ما الذي يبقيني ثابتًا؟ ويقدم التوازن (ص 56-57).\n\nالحصة 4:\nيراجع المعلم التوازن ويعرض الاختبارين (ص 57-58).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم وعناصره (السرعة، الرشاقة، التوازن، التوافق)، والرشاقة (تغيير أوضاع الجسم أو اتجاهاته بدقة وتوقيت) وأهميتها وعواملها، ويؤدي النماذج ص 55: الجري 5 م ثم الوثب والدوران ربع لفة، الوثب للجانبين، الجري السريع والتوقف المفاجئ ولمس الأقماع، الجري الجانبي في سلم الرشاقة، الجري بين أقماع للأمام والخلف والجانب، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الرشاقة بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يجرب الطلبة تغيير الاتجاه بسرعة عالية ثم بسرعة متوسطة ويكتشفون علاقة الرشاقة بالتحكم، ويجرب الطالب ويستنتج (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار T في مجموعات بقائد يحمل الساعة: جري أمامي للقمع B، جري جانبي يسارًا للقمع C، جري جانبي يمينًا للقمع D مرورًا بـB، جري جانبي للقمع B، جري للخلف للقمع A، مع التسجيل، ويؤدي الطالب ويسجل لزميله (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 60: تتابع رشاقة بين المجموعات في مسار T، ويتسابق الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يناقش الطلبة: ما المرحلة الأصعب في الاختبار ولماذا؟ ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المفهوم (الاحتفاظ بمركز الثقل فوق قاعدة الارتكاز) وأنواعه وأهميته وعوامله (قاعدة الارتكاز، مركز الثقل، النظر، القوة)، ويؤدي النماذج: الوقوف على قدم مع إغماض العينين، الميزان، المشي على المقعد مع تغيير الاتجاه، الهبوط بثبات بعد الوثب، الوقوف على وسادة التوازن، ويستمع الطالب ويقلد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوازن بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يحلل الطلبة في مجموعات مواقف (الهبوط بعد الوثب العالي، الوقوف على اليدين، المشي على العارضة) ويصنفونها، ويحلل الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار الوقوف على مشط قدم واحدة (باطن القدم الأخرى على ركبة رجل الارتكاز واليدان على الوسط ورفع العقب) بالزمن، ثم اختبار Y (مد الرجل الحرة للأمام ثم الخلف يسارًا ثم الخلف يمينًا لأقصى مسافة مع الحفاظ على التوازن) بالقياس، في مجموعات بقائد، ويؤدي الطالب ويسجل لزميله (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة: مسار يجمع الرشاقة (T مصغر) والتوازن (المشي على المقعد والهبوط بثبات)، ويتسابق الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يقارن الطلبة نتائجهم ويستنتجون أثر النظر لنقطة ثابتة في زمن الثبات، ويستنتج الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الرشاقة؟\nالإجابة: قدرة الفرد على تغيير أوضاع جسمه أو اتجاهات حركته بدقة وتوقيت مناسب.\nس2 (مستوى التطبيق): اذكر مهارة تحتاج إلى الرشاقة.\nالإجابة: الخداع والمحاورة في كرة اليد والسلة والقدم.\nس3 (مستوى الاستدلال): اذكر عاملًا يؤثر في الرشاقة.\nالإجابة: القوة أو السرعة أو التوافق.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما شكل مسار اختبار الرشاقة؟\nالإجابة: حرف T.\nس2 (مستوى التطبيق): كيف نعود إلى القمع A في نهاية الاختبار؟\nالإجابة: بالجري للخلف.\nس3 (مستوى الاستدلال): ما القاعدة في اختبار T؟\nالإجابة: لمس كل قمع في ترتيبه الصحيح.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما التوازن؟\nالإجابة: قدرة الفرد على الاحتفاظ بمركز ثقل الجسم فوق قاعدة الارتكاز.\nس2 (مستوى التطبيق): ما الفرق بين التوازن الثابت والحركي؟\nالإجابة: الثابت في وضع ثابت، والحركي أثناء الحركة.\nس3 (مستوى الاستدلال): اذكر عاملًا يؤثر في التوازن.\nالإجابة: اتساع قاعدة الارتكاز أو النظر لنقطة ثابتة.\n\nالحصة 4:\nس1 (مستوى المعرفة): أين توضع باطن القدم الحرة في اختبار الوقوف على المشط؟\nالإجابة: على الجانب الداخلي لركبة رجل الارتكاز.\nس2 (مستوى التطبيق): ما مراحل اختبار Y؟\nالإجابة: الأمام، الخلف يسارًا، الخلف يمينًا.\nس3 (مستوى الاستدلال): متى ينتهي اختبار الوقوف على المشط؟\nالإجابة: عند لمس العقب الأرض أو فقد التوازن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر عناصر اللياقة المرتبطة بالمهارة.\nالإجابة: السرعة، الرشاقة، التوازن، التوافق.\nس2 (مستوى التطبيق): أدِّ الجري السريع والتوقف المفاجئ ولمس القمع.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): لماذا تحتاج ألعاب المضرب إلى الرشاقة؟\nالإجابة: لتغطية الملعب والوصول السريع إلى الريشة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما زمنك في اختبار T وما هدفك؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): أي المراحل كانت الأبطأ ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين زمنك.\nالإجابة: الجري الجانبي بين أقماع.\n\nالحصة 3:\nس1 (مستوى المعرفة): صنف: الهبوط بثبات بعد الوثب العالي.\nالإجابة: توازن حركي.\nس2 (مستوى التطبيق): أدِّ الوقوف على قدم مع إغماض العينين 10 ثوانٍ.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف يسهم التوازن في الوقاية من الإصابات؟\nالإجابة: يمنع السقوط ويحفظ ثبات المفاصل.\n\nالحصة 4:\nس1 (مستوى المعرفة): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (مستوى التطبيق): أي الاتجاهات كان الأصعب في اختبار Y ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (مستوى الاستدلال): اقترح تمرينًا لتحسين توازنك.\nالإجابة: الوقوف على وسادة التوازن يوميًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الجري بين عوائق مع تغيير الاتجاه (دليل المعلم ص 53-55).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على اختبار T أسبوعيًا ومقارنة الزمن (دليل المعلم ص 54-60).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على الوقوف على قدم واحدة بعينين مغمضتين 15 ثانية يوميًا (دليل المعلم ص 56-57).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تمرينات التوازن اليومية، والاطلاع على سباق العدو 100 م (دليل المعلم ص 69-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=3"}}, {"title": "ألعاب القوى (سباق العدو 100 م، ودفع الجلة 3 كجم بطريقة الزحف)", "unit": "الرياضات والألعاب الحركية (1)", "week": "السادس – السابع", "date": "11-15/10/2026 إلى 18-22/10/2026", "pages": "دليل المعلم ص 69-86", "n": 4, "periods": [{"focus": "سباق العدو 100 م: المراحل الفنية والبدء المنخفض بمكعبات البدء", "num": 1, "fields": {"المخرجات التعليمية": "1. يشرح طريقة أداء سباق العدو 100 م ومراحله الفنية.\n2. يؤدي البدء المنخفض على مكعبات البدء بأقسامه الثلاثة.\n3. يحدد القواعد القانونية للسباق (الحارة، البداية الخاطئة).", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تذكر", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- سباق العدو 100 م\n- البدء والانطلاق\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- إنهاء السباق", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم فيديو سباق 100 م ويسأل: كم مرحلة في السباق؟ ويقدم المراحل والقواعد (ص 70-72).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء خاص بالعدو، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل (البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق) ويؤدي البدء المنخفض على المكعبات (خذ مكانك، استعد، انطلق مع دفع المكعب بالقدم الخلفية ثم الأمامية) مع القواعد (الحارة، استبعاد البداية الخاطئة)، ويقلد الطالب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أزواج: يعطي أحدهما الأوامر ويراقب الأخطاء ثم عدو 30 م، ويتبادلان، ويتدرب الطالب ويراقب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة رد الفعل: انطلاق بإشارات من البدء المنخفض 15 م، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما مراحل سباق 100 م؟\nالإجابة: البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق.\nس2 (مستوى التطبيق): أي القدمين تدفع المكعب أولًا؟\nالإجابة: الخلفية ثم الأمامية.\nس3 (مستوى الاستدلال): ما قرار الحكم عند البداية الخاطئة؟\nالإجابة: استبعاد المتسابق.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ البدء المنخفض على المكعبات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف ننهي السباق؟\nالإجابة: بميل الجذع للأمام عند خط النهاية دون إبطاء.\nس3 (مستوى الاستدلال): ماذا يحدث عند خروج المتسابق من حارته؟\nالإجابة: يُستبعد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد سباق 100 م (دليل المعلم ص 70-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=4"}}, {"focus": "تدريبات سباق العدو 100 م ومنافساته", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تدريبات تطوير مراحل السباق (الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق).\n2. يؤدي سباق العدو 100 م (أو مسافة أقل حسب المسار) بتطبيق القواعد.\n3. يبدي اهتمامًا بالمشاركة في السباق ويحدد هدفًا لتحسين زمنه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل", "المفاهيم": "- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المراحل ويسأل: كيف نحافظ على السرعة القصوى في الأمتار الأخيرة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء خاص، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات ص 76-78: العدو المتزايد 40 م، الجري بخطوات واسعة ثم سريعة، العدو 30 م من البدء المنخفض، إنهاء السباق بميل الجذع، ويقلد الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بميقاتي ومسجل: يعدو كل طالب 100 م (أو المسافة المتاحة) ويسجل زمنه، ويعدو الطالب ويسجل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تصفيات ونهائي بين المجموعات بحكام من الطلبة (ص 79)، ويتسابق الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتحديد هدف شخصي، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الذي يحافظ على السرعة القصوى؟\nالإجابة: تزايد طول الخطوة وترددها وتحريك الذراعين توافقيًا.\nس2 (مستوى التطبيق): ما دور الميقاتي؟\nالإجابة: تسجيل زمن المتسابق.\nس3 (مستوى الاستدلال): ماذا نفعل إذا لم يتوفر مسار 100 م؟\nالإجابة: ننفذ السباق بمسافة أقل.", "التقويم الختامي": "س1 (مستوى المعرفة): ما زمنك وما هدفك خلال أسبوعين؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): اذكر تدريبين لتطوير السرعة القصوى.\nالإجابة: العدو المتزايد والجري بخطوات واسعة.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك سباقًا بأدوار؟\nالإجابة: حكم بداية وميقاتي ومسجل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريبات السرعة ومتابعة زمنه (دليل المعلم ص 76-79).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=4"}}, {"focus": "دفع الجلة 3 كجم بطريقة الزحف: النواحي الفنية (الاستعداد، الزحف، الدفع، الاتزان)", "num": 3, "fields": {"المخرجات التعليمية": "1. يشرح النواحي الفنية لدفع الجلة بطريقة الزحف.\n2. يؤدي مسك الجلة ووضع الاستعداد والدفع من الثبات.\n3. يميز بين الدفع والرمي ويحدد القواعد القانونية.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- دفع الجلة\n- الزحف\n- دائرة الرمي\n- مقطع الرمي\n- الاتزان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة دافع الجلة ويسأل: لماذا يدور ظهره لمقطع الرمي؟ ويقدم النواحي الفنية (ص 73-75).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء: دوران الذراعين، دفع الكرة الطبية، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم النواحي: الاستعداد (مواجهة مقطع الرمي بالظهر، حمل الجلة على أصابع اليد أسفل الذقن، الارتكاز باليمنى ومد اليسرى)، الزحف (الدفع بالرجل للخلف)، الدفع (لف الجذع ودوران مشط القدم ومد الذراع وخروج الجلة من الذقن)، الاتزان (تبديل الرجلين وعدم الخروج من الدائرة)، والقواعد، ثم نموذج الدفع من الثبات بالكرة الطبية، ويقلد الطالب بالكرة الطبية (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 80-81: دفع الكرة الطبية من الثبات، دفع مع لف الجذع، دفع مع ثني ومد الركبتين، في مجموعات مع الأمان، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة دفع الكرة الطبية من الثبات، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم قطر دائرة الدفع؟\nالإجابة: 2.135 م.\nس2 (مستوى التطبيق): أين توضع الجلة في الاستعداد؟\nالإجابة: على أصابع اليد أسفل الذقن ملاصقة للرقبة.\nس3 (مستوى الاستدلال): ما الفرق بين الدفع والرمي؟\nالإجابة: الدفع بمد الذراع من الكتف دون مرجحة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ دفع الكرة الطبية من الثبات بالنواحي الفنية.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر قاعدتين من قواعد دفع الجلة.\nالإجابة: الدفع بيد واحدة، وعدم الخروج من الدائرة.\nس3 (مستوى الاستدلال): لماذا يبدأ الدافع بظهره لمقطع الرمي؟\nالإجابة: ليستفيد من الزحف ولف الجذع لزيادة القوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في دفع الجلة (دليل المعلم ص 73-75).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=4"}}, {"focus": "التدريبات التعليمية لطريقة الزحف ودفع الجلة الكامل", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي تدريبات الزحف (الزحف دون جلة، الزحف مع الدفع بالكرة الطبية).\n2. يؤدي دفع الجلة 3 كجم بطريقة الزحف من داخل الدائرة.\n3. يحلل الأخطاء الشائعة ويصححها.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: استمارات تسجيل", "المفاهيم": "- الزحف\n- الدفع\n- الاتزان\n- القياس", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم النواحي الفنية ويعرض تدريبات الزحف (ص 82-83).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات: الزحف من الوقوف على رجل واحدة للخلف دون جلة، الزحف ثم الدفع بالكرة الطبية، الدفع الكامل بالجلة من داخل الدائرة، مع الأمان (الدفع بالإشارة، الجمع بعد الجميع)، ويقلد الطالب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بحكم وقائس: يؤدي كل طالب الدفع الكامل محاولتين مع القياس، ويحلل القائد الأخطاء (رمي الجلة، الخروج من الدائرة)، ويدفع الطالب ويقيس ويحلل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يعرض المعلم أخطاء شائعة ويقترح الطلبة التصحيح، ويحلل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الزحف في دفع الجلة؟\nالإجابة: الدفع بالرجل للخلف داخل الدائرة قبل الدفع.\nس2 (مستوى التطبيق): من أين تقاس المسافة؟\nالإجابة: من مكان سقوط الجلة إلى الحد الداخلي للدائرة.\nس3 (مستوى الاستدلال): متى تحتسب المحاولة خاطئة؟\nالإجابة: عند الخروج من الدائرة أو رمي الجلة أو سقوطها خارج المقطع.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ دفع الجلة بطريقة الزحف من داخل الدائرة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): زميلك يرمي الجلة بمرجحة ذراعه، ما الخطأ؟\nالإجابة: يجب الدفع بمد الذراع لا الرمي.\nس3 (مستوى الاستدلال): من أي جهة يغادر الدافع الدائرة؟\nالإجابة: من النصف الخلفي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة دفع الجلة وتحديد مراحلها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يشرح طريقة أداء سباق العدو 100 م ومراحله الفنية.\n2. يؤدي البدء المنخفض على مكعبات البدء بأقسامه الثلاثة.\n3. يحدد القواعد القانونية للسباق (الحارة، البداية الخاطئة).\n\nالحصة 2:\n1. يؤدي تدريبات تطوير مراحل السباق (الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق).\n2. يؤدي سباق العدو 100 م (أو مسافة أقل حسب المسار) بتطبيق القواعد.\n3. يبدي اهتمامًا بالمشاركة في السباق ويحدد هدفًا لتحسين زمنه.\n\nالحصة 3:\n1. يشرح النواحي الفنية لدفع الجلة بطريقة الزحف.\n2. يؤدي مسك الجلة ووضع الاستعداد والدفع من الثبات.\n3. يميز بين الدفع والرمي ويحدد القواعد القانونية.\n\nالحصة 4:\n1. يؤدي تدريبات الزحف (الزحف دون جلة، الزحف مع الدفع بالكرة الطبية).\n2. يؤدي دفع الجلة 3 كجم بطريقة الزحف من داخل الدائرة.\n3. يحلل الأخطاء الشائعة ويصححها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تذكر\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 3:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n\nالحصة 3:\n- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 4:\n- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- سباق العدو 100 م\n- البدء والانطلاق\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- إنهاء السباق\n\nالحصة 2:\n- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن\n\nالحصة 3:\n- دفع الجلة\n- الزحف\n- دائرة الرمي\n- مقطع الرمي\n- الاتزان\n\nالحصة 4:\n- الزحف\n- الدفع\n- الاتزان\n- القياس", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم فيديو سباق 100 م ويسأل: كم مرحلة في السباق؟ ويقدم المراحل والقواعد (ص 70-72).\n\nالحصة 2:\nيراجع المعلم المراحل ويسأل: كيف نحافظ على السرعة القصوى في الأمتار الأخيرة؟\n\nالحصة 3:\nيعرض المعلم صورة دافع الجلة ويسأل: لماذا يدور ظهره لمقطع الرمي؟ ويقدم النواحي الفنية (ص 73-75).\n\nالحصة 4:\nيراجع المعلم النواحي الفنية ويعرض تدريبات الزحف (ص 82-83).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء خاص بالعدو، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل (البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق) ويؤدي البدء المنخفض على المكعبات (خذ مكانك، استعد، انطلق مع دفع المكعب بالقدم الخلفية ثم الأمامية) مع القواعد (الحارة، استبعاد البداية الخاطئة)، ويقلد الطالب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أزواج: يعطي أحدهما الأوامر ويراقب الأخطاء ثم عدو 30 م، ويتبادلان، ويتدرب الطالب ويراقب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة رد الفعل: انطلاق بإشارات من البدء المنخفض 15 م، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء خاص، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات ص 76-78: العدو المتزايد 40 م، الجري بخطوات واسعة ثم سريعة، العدو 30 م من البدء المنخفض، إنهاء السباق بميل الجذع، ويقلد الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بميقاتي ومسجل: يعدو كل طالب 100 م (أو المسافة المتاحة) ويسجل زمنه، ويعدو الطالب ويسجل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تصفيات ونهائي بين المجموعات بحكام من الطلبة (ص 79)، ويتسابق الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتحديد هدف شخصي، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء: دوران الذراعين، دفع الكرة الطبية، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم النواحي: الاستعداد (مواجهة مقطع الرمي بالظهر، حمل الجلة على أصابع اليد أسفل الذقن، الارتكاز باليمنى ومد اليسرى)، الزحف (الدفع بالرجل للخلف)، الدفع (لف الجذع ودوران مشط القدم ومد الذراع وخروج الجلة من الذقن)، الاتزان (تبديل الرجلين وعدم الخروج من الدائرة)، والقواعد، ثم نموذج الدفع من الثبات بالكرة الطبية، ويقلد الطالب بالكرة الطبية (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 80-81: دفع الكرة الطبية من الثبات، دفع مع لف الجذع، دفع مع ثني ومد الركبتين، في مجموعات مع الأمان، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة دفع الكرة الطبية من الثبات، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات: الزحف من الوقوف على رجل واحدة للخلف دون جلة، الزحف ثم الدفع بالكرة الطبية، الدفع الكامل بالجلة من داخل الدائرة، مع الأمان (الدفع بالإشارة، الجمع بعد الجميع)، ويقلد الطالب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بحكم وقائس: يؤدي كل طالب الدفع الكامل محاولتين مع القياس، ويحلل القائد الأخطاء (رمي الجلة، الخروج من الدائرة)، ويدفع الطالب ويقيس ويحلل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يعرض المعلم أخطاء شائعة ويقترح الطلبة التصحيح، ويحلل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما مراحل سباق 100 م؟\nالإجابة: البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق.\nس2 (مستوى التطبيق): أي القدمين تدفع المكعب أولًا؟\nالإجابة: الخلفية ثم الأمامية.\nس3 (مستوى الاستدلال): ما قرار الحكم عند البداية الخاطئة؟\nالإجابة: استبعاد المتسابق.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الذي يحافظ على السرعة القصوى؟\nالإجابة: تزايد طول الخطوة وترددها وتحريك الذراعين توافقيًا.\nس2 (مستوى التطبيق): ما دور الميقاتي؟\nالإجابة: تسجيل زمن المتسابق.\nس3 (مستوى الاستدلال): ماذا نفعل إذا لم يتوفر مسار 100 م؟\nالإجابة: ننفذ السباق بمسافة أقل.\n\nالحصة 3:\nس1 (مستوى المعرفة): كم قطر دائرة الدفع؟\nالإجابة: 2.135 م.\nس2 (مستوى التطبيق): أين توضع الجلة في الاستعداد؟\nالإجابة: على أصابع اليد أسفل الذقن ملاصقة للرقبة.\nس3 (مستوى الاستدلال): ما الفرق بين الدفع والرمي؟\nالإجابة: الدفع بمد الذراع من الكتف دون مرجحة.\n\nالحصة 4:\nس1 (مستوى المعرفة): ما الزحف في دفع الجلة؟\nالإجابة: الدفع بالرجل للخلف داخل الدائرة قبل الدفع.\nس2 (مستوى التطبيق): من أين تقاس المسافة؟\nالإجابة: من مكان سقوط الجلة إلى الحد الداخلي للدائرة.\nس3 (مستوى الاستدلال): متى تحتسب المحاولة خاطئة؟\nالإجابة: عند الخروج من الدائرة أو رمي الجلة أو سقوطها خارج المقطع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ البدء المنخفض على المكعبات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف ننهي السباق؟\nالإجابة: بميل الجذع للأمام عند خط النهاية دون إبطاء.\nس3 (مستوى الاستدلال): ماذا يحدث عند خروج المتسابق من حارته؟\nالإجابة: يُستبعد.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما زمنك وما هدفك خلال أسبوعين؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): اذكر تدريبين لتطوير السرعة القصوى.\nالإجابة: العدو المتزايد والجري بخطوات واسعة.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك سباقًا بأدوار؟\nالإجابة: حكم بداية وميقاتي ومسجل.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ دفع الكرة الطبية من الثبات بالنواحي الفنية.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر قاعدتين من قواعد دفع الجلة.\nالإجابة: الدفع بيد واحدة، وعدم الخروج من الدائرة.\nس3 (مستوى الاستدلال): لماذا يبدأ الدافع بظهره لمقطع الرمي؟\nالإجابة: ليستفيد من الزحف ولف الجذع لزيادة القوة.\n\nالحصة 4:\nس1 (مستوى المعرفة): أدِّ دفع الجلة بطريقة الزحف من داخل الدائرة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): زميلك يرمي الجلة بمرجحة ذراعه، ما الخطأ؟\nالإجابة: يجب الدفع بمد الذراع لا الرمي.\nس3 (مستوى الاستدلال): من أي جهة يغادر الدافع الدائرة؟\nالإجابة: من النصف الخلفي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد سباق 100 م (دليل المعلم ص 70-72).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تدريبات السرعة ومتابعة زمنه (دليل المعلم ص 76-79).\n\nالحصة 3:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في دفع الجلة (دليل المعلم ص 73-75).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة دفع الجلة وتحديد مراحلها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=4"}}, {"title": "الاختبار العملي (1)", "unit": "تقويم", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 37-64، 69-83", "n": 2, "periods": [{"focus": "اختبار عملي في عناصر اللياقة البدنية (القوة، التحمل، الرشاقة، التوازن)", "num": 1, "fields": {"المخرجات التعليمية": "1. يطبق اختبارات القوة والرشاقة والتوازن بالطريقة الصحيحة.\n2. يؤدي تمرينات لتنمية كل عنصر.\n3. يقارن نتائجه بنتائجه السابقة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "-
