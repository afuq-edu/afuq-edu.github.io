الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 88-100", "n": 3, "periods": [{"focus": "طريقة اللعب والقواعد القانونية ومراكز اللاعبين وتمرينات الإحساس بالكرة + التصويب (ركل الكرة بوجه القدم الخارجي)", "num": 1, "fields": {"المخرجات التعليمية": "1. يشرح طريقة اللعب والقواعد القانونية (الشوطان، ركلة البداية، احتساب الهدف، لمس اليد).\n2. يميز مراكز اللاعبين في طريقة 4-4-2 وواجباتها.\n3. يؤدي تمرينات الإحساس بالكرة (تحريكها بوجه القدم الخارجي، سحبها بأسفل القدم، تثبيتها على الرأس).\n4. يشرح النقاط الفنية لركل الكرة بوجه القدم الخارجي.\n5. يؤدي التصويب والتمرير بوجه القدم الخارجي من الثبات والحركة.\n6. يختار نوع الركل المناسب (أمامي، داخلي، خارجي) حسب الموقف.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: مرمى", "المفاهيم": "- كرة القدم\n- ركلة البداية\n- مراكز اللاعبين\n- الإحساس بالكرة\n- وجه القدم الخارجي\n- التصويب\n- قدم الارتكاز\n- المتابعة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم مخطط 4-4-2 ويسأل: ما واجب كل مركز في الهجوم والدفاع؟ ويشرح القواعد (ص 89، 92).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (11 لاعبًا، شوطان 45 دقيقة، ركلة البداية، الهدف، لمس اليد) ومراكز اللاعبين، ويؤدي تمرينات الإحساس ص 94: تحريك الكرة بوجه القدم الخارجي، سحبها بأسفل القدم للخلف والجانبين، تثبيتها على الرأس، رميها لأعلى واستقبالها بوجه القدم، تنطيطها بالرأس، ويستمع الطالب ويقلد (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الإحساس بالكرة بأربع مجموعات وفي كل محطة بطاقة مركز يشرحها القائد، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المراكز): يرفع المعلم بطاقة مركز فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر ويذكرون واجبه، ويلعب الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وخلفها، مرجحة الرجل الراكلة للخلف، ميل الجذع للأمام والذراعان للتوازن، ركل الكرة بوجه القدم الخارجي مع امتداد القدم للمتابعة، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات ص 95: صفان متقابلان تبادل التمرير بوجه القدم الخارجي، قطاران الجري بالكرة ثم التصويب بوجه القدم الخارجي نحو المرمى، ثم التصويب من تمريرة زميل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويب من مسافة 14 م، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم مدة الشوط في كرة القدم؟\nالإجابة: 45 دقيقة.\nس2 (مستوى التطبيق): متى تنفذ ركلة البداية؟\nالإجابة: في بداية الشوطين وبعد تسجيل الأهداف.\nس3 (مستوى الاستدلال): ما واجب لاعبي خط الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\n\nس4 (مستوى المعرفة): متى نستخدم الركل بوجه القدم الخارجي؟\nالإجابة: للتمرير والتصويب من المسافات المتوسطة والطويلة بسرعة.\nس5 (مستوى التطبيق): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وخلفها.\nس6 (مستوى الاستدلال): لماذا تساعد الذراعان في الركل؟\nالإجابة: لحفظ التوازن.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر مراكز طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (مستوى التطبيق): أدِّ تثبيت الكرة على الرأس 3 ثوانٍ.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): متى يحتسب الهدف؟\nالإجابة: عند تجاوز الكرة بكامل محيطها خط المرمى بين القائمين وتحت العارضة.\n\nس4 (مستوى المعرفة): صوب بوجه القدم الخارجي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): كرة تمر بجانبك وتريد تمريرها سريعًا للجناح، أي وجه تستخدم؟\nالإجابة: وجه القدم الخارجي.\nس6 (مستوى الاستدلال): ما الفرق بين الركل بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي أسرع وبدوران خارجي، والداخلي أدق للمسافات المتوسطة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الإحساس بالكرة يوميًا (دليل المعلم ص 89-94).\nإرشاد لولي الأمر: شجع طالبك على التصويب بوجه القدم الخارجي على هدف (دليل المعلم ص 90-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=7"}}, {"focus": "المحاورة من الجانب ومن الخلف + ضرب الكرة بالرأس", "num": 2, "fields": {"المخرجات التعليمية": "1. يشرح أنواع المحاورة من الجانب ومن الخلف واستخداماتها.\n2. يؤدي المحاورة من الجانب (مع منافس يجري بجواره) ومن الخلف (بالتمويه للجانب).\n3. يختار نوع المحاورة حسب موقع المدافع.\n4. يشرح النقاط الفنية لضرب الكرة بالرأس واستخداماته (التصويب، الإبعاد).\n5. يؤدي ضرب الكرة بالرأس من الثبات ومن الوثب بمقدمة الرأس.\n6. يطبق قواعد الأمان في ضرب الكرة بالرأس.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- أخرى: كرات قدم خفيفة\n- أخرى: مرمى\n- صورة توضيحية", "المفاهيم": "- المحاورة من الجانب\n- المحاورة من الخلف\n- التمويه\n- المدافع\n- ضرب الكرة بالرأس\n- مقدمة الرأس (الجبهة)\n- التوقيت\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المحاورة من الأمام ويسأل: ماذا لو كان المدافع بجواري أو خلفي؟ ويعرض النوعين (ص 91).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: المحاورة من الجانب (تغيير السرعة والاتجاه بعيدًا عن المدافع المجاور بوجه القدم البعيدة)، والمحاورة من الخلف بالتمويه للجانب (استلام الكرة ومراقب خلفي، حركة خداع للجانب ثم المرور في الاتجاه الآخر)، ثم تطبيق موجه مع مدافع سلبي، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 96: أزواج يجريان جنبًا إلى جنب ويحاور المهاجم، ثم ثلاثيات (ممرر، مهاجم، مدافع خلفي) مع التبادل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (1 ضد 1) من وضعيات مختلفة (جانب، خلف)، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: التحرك نحو الكرة والنظر إليها، ثني الجذع للخلف ثم للأمام لضرب الكرة بالجبهة (مقدمة الرأس) والعينان مفتوحتان، ثم من الوثب، مع الأمان (كرة خفيفة، عدم الضرب بأعلى الرأس)، ويقلد الطالب بالكرة الخفيفة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات ص 94-95: رمي الكرة لأعلى وضربها بالجبهة من الثبات، أزواج يرمي أحدهما ويضرب الآخر نحوه، ثم نحو المرمى، ثم من الوثب، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويب بالرأس من رمية زميل، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): متى نستخدم المحاورة من الجانب؟\nالإجابة: عندما يجري المنافس بجوارنا على خط واحد.\nس2 (مستوى التطبيق): متى نستخدم المحاورة من الخلف؟\nالإجابة: عندما تأتي الكرة والمدافع خلفنا.\nس3 (مستوى الاستدلال): ما التمويه؟\nالإجابة: حركة خداعية للجانب قبل المرور في الاتجاه الآخر.\n\nس4 (مستوى المعرفة): بأي جزء من الرأس نضرب الكرة؟\nالإجابة: بالجبهة (مقدمة الرأس).\nس5 (مستوى التطبيق): متى نستخدم ضرب الكرة بالرأس؟\nالإجابة: للتصويب في الهجوم وإبعاد الكرة في الدفاع.\nس6 (مستوى الاستدلال): لماذا نبقي العينين مفتوحتين؟\nالإجابة: لتوجيه الكرة بدقة.", "التقويم الختامي": "س1 (مستوى المعرفة): راوغ المدافع الذي يجري بجوارك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): أدِّ المحاورة من الخلف بالتمويه للجانب.\nالإجابة: يؤديها.\nس3 (مستوى الاستدلال): اذكر أنواع المحاورة الثلاثة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.\n\nس4 (مستوى المعرفة): اضرب الكرة المرمية بالجبهة نحو زميلك.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): اذكر قاعدة أمان في ضرب الكرة بالرأس.\nالإجابة: استخدام كرة خفيفة والضرب بالجبهة لا بأعلى الرأس.\nس6 (مستوى الاستدلال): ما دور الجذع في ضرب الكرة بالرأس؟\nالإجابة: يعطي الضربة قوة بثنيه للخلف ثم للأمام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طالبك دور المدافع من الجانب ومن الخلف (دليل المعلم ص 91-96).\nإرشاد لولي الأمر: شجع طالبك على التدرب بكرة خفيفة على ضرب الكرة بالجبهة (دليل المعلم ص 92-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=7"}}, {"focus": "محطات مهارات كرة القدم ومنافساتها + مباراة كرة القدم وتطبيق القواعد ومراكز اللاعبين", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي الركل بوجه القدم الخارجي والمحاورة وضرب الكرة بالرأس في محطات.\n2. يوظف المهارات في منافسات مصغرة.\n3. يتعاون مع زملائه ويلتزم بالقواعد.\n4. يطبق القواعد القانونية في مباراة كرة القدم.\n5. يلعب في مركز محدد ويؤدي واجباته الهجومية والدفاعية.\n6. يتعاون مع زملائه أثناء المباراة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة\n- أخرى: سلم الرشاقة\n- أخرى: مرامٍ\n- أخرى: صافرة", "المفاهيم": "- المحطات\n- التصويب\n- المحاورة\n- ضرب الكرة بالرأس\n- المنافسة\n- المباراة\n- المراكز\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 97: التصويب بوجه القدم الخارجي، المحاورة من الجانب ضد مدافع، ضرب الكرة بالرأس من رمية، الإحساس بالكرة في سلم الرشاقة، مع التبديل، ويؤدي الطالب ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة 3 ضد 3 بمرميين صغيرين بشرط لمسة بالرأس قبل التصويب أو هدف مضاعف للرأس، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجحت المحاورة من الخلف؟ ليستنتج الطلبة أهمية التمويه والتوقيت، ويستنتج الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. يخطط كل فريق مراكزه وطريقة لعبه، ويخطط الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 98-99: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تبديل المراكز، ويلعب الطالب ويحكم (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يناقش الطلبة: كيف أثر الالتزام بالمراكز في النتيجة؟ ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب بوجه القدم الخارجي وضرب الكرة بالرأس.\nس2 (مستوى التطبيق): ما شرط التصويب في منافسة اليوم؟\nالإجابة: لمسة بالرأس قبله (أو هدف مضاعف للرأس).\nس3 (مستوى الاستدلال): ما سر نجاح المحاورة من الخلف؟\nالإجابة: التمويه والتوقيت.\n\nس4 (مستوى المعرفة): ما واجب الظهير الأيمن؟\nالإجابة: منع هجمات الجناح الأيسر للمنافس ودعم الهجوم.\nس5 (مستوى التطبيق): ما دور الحكم المساعد؟\nالإجابة: مراقبة خروج الكرة والتسلل.\nس6 (مستوى الاستدلال): لماذا نتبادل المراكز؟\nالإجابة: ليجرب الجميع الأدوار المختلفة.", "التقويم الختامي": "س1 (مستوى المعرفة): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): أدِّ المحاورة من الجانب ثم التصويب بوجه القدم الخارجي.\nالإجابة: يؤديهما.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: احتساب الهدف.\nس5 (مستوى التطبيق): ما المركز الذي لعبت فيه وواجبه؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عند قرار حكم ضد فريقك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 97).\nإرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، ومراجعة قواعد كرة السلة (دليل المعلم ص 110-112).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يشرح طريقة اللعب والقواعد القانونية (الشوطان، ركلة البداية، احتساب الهدف، لمس اليد).\n2. يميز مراكز اللاعبين في طريقة 4-4-2 وواجباتها.\n3. يؤدي تمرينات الإحساس بالكرة (تحريكها بوجه القدم الخارجي، سحبها بأسفل القدم، تثبيتها على الرأس).\n4. يشرح النقاط الفنية لركل الكرة بوجه القدم الخارجي.\n5. يؤدي التصويب والتمرير بوجه القدم الخارجي من الثبات والحركة.\n6. يختار نوع الركل المناسب (أمامي، داخلي، خارجي) حسب الموقف.\n\nالحصة 2:\n1. يشرح أنواع المحاورة من الجانب ومن الخلف واستخداماتها.\n2. يؤدي المحاورة من الجانب (مع منافس يجري بجواره) ومن الخلف (بالتمويه للجانب).\n3. يختار نوع المحاورة حسب موقع المدافع.\n4. يشرح النقاط الفنية لضرب الكرة بالرأس واستخداماته (التصويب، الإبعاد).\n5. يؤدي ضرب الكرة بالرأس من الثبات ومن الوثب بمقدمة الرأس.\n6. يطبق قواعد الأمان في ضرب الكرة بالرأس.\n\nالحصة 3:\n1. يؤدي الركل بوجه القدم الخارجي والمحاورة وضرب الكرة بالرأس في محطات.\n2. يوظف المهارات في منافسات مصغرة.\n3. يتعاون مع زملائه ويلتزم بالقواعد.\n4. يطبق القواعد القانونية في مباراة كرة القدم.\n5. يلعب في مركز محدد ويؤدي واجباته الهجومية والدفاعية.\n6. يتعاون مع زملائه أثناء المباراة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: مرمى\n\nالحصة 2:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- أخرى: كرات قدم خفيفة\n- أخرى: مرمى\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة\n- أخرى: سلم الرشاقة\n- أخرى: مرامٍ\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة القدم\n- ركلة البداية\n- مراكز اللاعبين\n- الإحساس بالكرة\n- وجه القدم الخارجي\n- التصويب\n- قدم الارتكاز\n- المتابعة\n\nالحصة 2:\n- المحاورة من الجانب\n- المحاورة من الخلف\n- التمويه\n- المدافع\n- ضرب الكرة بالرأس\n- مقدمة الرأس (الجبهة)\n- التوقيت\n- الأمان\n\nالحصة 3:\n- المحطات\n- التصويب\n- المحاورة\n- ضرب الكرة بالرأس\n- المنافسة\n- المباراة\n- المراكز\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم مخطط 4-4-2 ويسأل: ما واجب كل مركز في الهجوم والدفاع؟ ويشرح القواعد (ص 89، 92).\n\nالحصة 2:\nيراجع المعلم المحاورة من الأمام ويسأل: ماذا لو كان المدافع بجواري أو خلفي؟ ويعرض النوعين (ص 91).\n\nالحصة 3:\nيراجع المعلم المهارات ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (11 لاعبًا، شوطان 45 دقيقة، ركلة البداية، الهدف، لمس اليد) ومراكز اللاعبين، ويؤدي تمرينات الإحساس ص 94: تحريك الكرة بوجه القدم الخارجي، سحبها بأسفل القدم للخلف والجانبين، تثبيتها على الرأس، رميها لأعلى واستقبالها بوجه القدم، تنطيطها بالرأس، ويستمع الطالب ويقلد (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات الإحساس بالكرة بأربع مجموعات وفي كل محطة بطاقة مركز يشرحها القائد، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (المراكز): يرفع المعلم بطاقة مركز فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر ويذكرون واجبه، ويلعب الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وخلفها، مرجحة الرجل الراكلة للخلف، ميل الجذع للأمام والذراعان للتوازن، ركل الكرة بوجه القدم الخارجي مع امتداد القدم للمتابعة، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات ص 95: صفان متقابلان تبادل التمرير بوجه القدم الخارجي، قطاران الجري بالكرة ثم التصويب بوجه القدم الخارجي نحو المرمى، ثم التصويب من تمريرة زميل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويب من مسافة 14 م، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: المحاورة من الجانب (تغيير السرعة والاتجاه بعيدًا عن المدافع المجاور بوجه القدم البعيدة)، والمحاورة من الخلف بالتمويه للجانب (استلام الكرة ومراقب خلفي، حركة خداع للجانب ثم المرور في الاتجاه الآخر)، ثم تطبيق موجه مع مدافع سلبي، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 96: أزواج يجريان جنبًا إلى جنب ويحاور المهاجم، ثم ثلاثيات (ممرر، مهاجم، مدافع خلفي) مع التبادل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (1 ضد 1) من وضعيات مختلفة (جانب، خلف)، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: التحرك نحو الكرة والنظر إليها، ثني الجذع للخلف ثم للأمام لضرب الكرة بالجبهة (مقدمة الرأس) والعينان مفتوحتان، ثم من الوثب، مع الأمان (كرة خفيفة، عدم الضرب بأعلى الرأس)، ويقلد الطالب بالكرة الخفيفة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات ص 94-95: رمي الكرة لأعلى وضربها بالجبهة من الثبات، أزواج يرمي أحدهما ويضرب الآخر نحوه، ثم نحو المرمى، ثم من الوثب، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويب بالرأس من رمية زميل، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 97: التصويب بوجه القدم الخارجي، المحاورة من الجانب ضد مدافع، ضرب الكرة بالرأس من رمية، الإحساس بالكرة في سلم الرشاقة، مع التبديل، ويؤدي الطالب ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة 3 ضد 3 بمرميين صغيرين بشرط لمسة بالرأس قبل التصويب أو هدف مضاعف للرأس، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى نجحت المحاورة من الخلف؟ ليستنتج الطلبة أهمية التمويه والتوقيت، ويستنتج الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. يخطط كل فريق مراكزه وطريقة لعبه، ويخطط الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 98-99: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تبديل المراكز، ويلعب الطالب ويحكم (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يناقش الطلبة: كيف أثر الالتزام بالمراكز في النتيجة؟ ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كم مدة الشوط في كرة القدم؟\nالإجابة: 45 دقيقة.\nس2 (مستوى التطبيق): متى تنفذ ركلة البداية؟\nالإجابة: في بداية الشوطين وبعد تسجيل الأهداف.\nس3 (مستوى الاستدلال): ما واجب لاعبي خط الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\n\nس4 (مستوى المعرفة): متى نستخدم الركل بوجه القدم الخارجي؟\nالإجابة: للتمرير والتصويب من المسافات المتوسطة والطويلة بسرعة.\nس5 (مستوى التطبيق): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وخلفها.\nس6 (مستوى الاستدلال): لماذا تساعد الذراعان في الركل؟\nالإجابة: لحفظ التوازن.\n\nالحصة 2:\nس1 (مستوى المعرفة): متى نستخدم المحاورة من الجانب؟\nالإجابة: عندما يجري المنافس بجوارنا على خط واحد.\nس2 (مستوى التطبيق): متى نستخدم المحاورة من الخلف؟\nالإجابة: عندما تأتي الكرة والمدافع خلفنا.\nس3 (مستوى الاستدلال): ما التمويه؟\nالإجابة: حركة خداعية للجانب قبل المرور في الاتجاه الآخر.\n\nس4 (مستوى المعرفة): بأي جزء من الرأس نضرب الكرة؟\nالإجابة: بالجبهة (مقدمة الرأس).\nس5 (مستوى التطبيق): متى نستخدم ضرب الكرة بالرأس؟\nالإجابة: للتصويب في الهجوم وإبعاد الكرة في الدفاع.\nس6 (مستوى الاستدلال): لماذا نبقي العينين مفتوحتين؟\nالإجابة: لتوجيه الكرة بدقة.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب بوجه القدم الخارجي وضرب الكرة بالرأس.\nس2 (مستوى التطبيق): ما شرط التصويب في منافسة اليوم؟\nالإجابة: لمسة بالرأس قبله (أو هدف مضاعف للرأس).\nس3 (مستوى الاستدلال): ما سر نجاح المحاورة من الخلف؟\nالإجابة: التمويه والتوقيت.\n\nس4 (مستوى المعرفة): ما واجب الظهير الأيمن؟\nالإجابة: منع هجمات الجناح الأيسر للمنافس ودعم الهجوم.\nس5 (مستوى التطبيق): ما دور الحكم المساعد؟\nالإجابة: مراقبة خروج الكرة والتسلل.\nس6 (مستوى الاستدلال): لماذا نتبادل المراكز؟\nالإجابة: ليجرب الجميع الأدوار المختلفة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر مراكز طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (مستوى التطبيق): أدِّ تثبيت الكرة على الرأس 3 ثوانٍ.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): متى يحتسب الهدف؟\nالإجابة: عند تجاوز الكرة بكامل محيطها خط المرمى بين القائمين وتحت العارضة.\n\nس4 (مستوى المعرفة): صوب بوجه القدم الخارجي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): كرة تمر بجانبك وتريد تمريرها سريعًا للجناح، أي وجه تستخدم؟\nالإجابة: وجه القدم الخارجي.\nس6 (مستوى الاستدلال): ما الفرق بين الركل بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي أسرع وبدوران خارجي، والداخلي أدق للمسافات المتوسطة.\n\nالحصة 2:\nس1 (مستوى المعرفة): راوغ المدافع الذي يجري بجوارك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): أدِّ المحاورة من الخلف بالتمويه للجانب.\nالإجابة: يؤديها.\nس3 (مستوى الاستدلال): اذكر أنواع المحاورة الثلاثة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.\n\nس4 (مستوى المعرفة): اضرب الكرة المرمية بالجبهة نحو زميلك.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): اذكر قاعدة أمان في ضرب الكرة بالرأس.\nالإجابة: استخدام كرة خفيفة والضرب بالجبهة لا بأعلى الرأس.\nس6 (مستوى الاستدلال): ما دور الجذع في ضرب الكرة بالرأس؟\nالإجابة: يعطي الضربة قوة بثنيه للخلف ثم للأمام.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): أدِّ المحاورة من الجانب ثم التصويب بوجه القدم الخارجي.\nالإجابة: يؤديهما.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: احتساب الهدف.\nس5 (مستوى التطبيق): ما المركز الذي لعبت فيه وواجبه؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عند قرار حكم ضد فريقك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات الإحساس بالكرة يوميًا (دليل المعلم ص 89-94).\nإرشاد لولي الأمر: شجع طالبك على التصويب بوجه القدم الخارجي على هدف (دليل المعلم ص 90-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=7\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طالبك دور المدافع من الجانب ومن الخلف (دليل المعلم ص 91-96).\nإرشاد لولي الأمر: شجع طالبك على التدرب بكرة خفيفة على ضرب الكرة بالجبهة (دليل المعلم ص 92-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=7\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 97).\nإرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، ومراجعة قواعد كرة السلة (دليل المعلم ص 110-112).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=7"}}, {"title": "لعبة كرة السلة", "unit": "الرياضات والألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 110-123", "n": 2, "periods": [{"focus": "القواعد القانونية والتمرير بعد التنطيط + التوقف (بعدة واحدة وبعدتين) والارتكاز", "num": 1, "fields": {"المخرجات التعليمية": "1. يشرح طريقة اللعب والقواعد القانونية (5 لاعبين، 4 فترات، كرة القفز، النقاط، رمية الإدخال).\n2. يؤدي التمرير بعد التنطيط مباشرة دون توقف.\n3. يميز متى يستخدم التمرير بعد التنطيط.\n4. يشرح طريقتي التوقف واستخدامهما.\n5. يؤدي التوقف بعدة واحدة (بالوثب) وبعدتين بعد التحرك بالكرة.\n6. يطبق قاعدة الارتكاز بعد كل نوع من التوقف.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: أطواق", "المفاهيم": "- كرة السلة\n- كرة القفز\n- رمية الإدخال\n- التمرير بعد التنطيط\n- التوقف بعدة واحدة\n- التوقف بعدتين\n- الارتكاز\n- امتصاص السرعة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة كرة القفز ويسأل: كيف تبدأ المباراة؟ ويشرح القواعد (ص 111-112) ويقدم التمرير بعد التنطيط (ص 113).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (الفترات 10 دقائق، كرة القفز، النقاط 1/2/3، رمية الإدخال، التبديل)، ويؤدي نموذج التمرير بعد التنطيط (التحرك بالتنطيط والنظر للزميل، مسك الكرة وتمريرها مباشرة بعد التنطيط دون توقف)، ويستمع الطالب ويقلد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: قطاران متقابلان تنطيط ثم تمرير مباشر للقطار المقابل، ثم مع مدافع في المنتصف، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كرة الملك) بشرط التمرير بعد التنطيط، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: التوقف بعدة واحدة (الهبوط بالقدمين معًا مع ثني الركبتين وميل الجذع لامتصاص السرعة، ويجوز الارتكاز على أي قدم)، والتوقف بعدتين (الهبوط على قدم ثم الأخرى، والارتكاز على القدم الأولى)، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات: تنطيط ثم التوقف بعدة واحدة بالإشارة ثم الارتكاز والتمرير، ثم التوقف بعدتين، في قطارات، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (الإشارة): تنطيط وعند الصافرة توقف بالطريقة التي يناديها المعلم، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كم فترة في مباراة كرة السلة؟\nالإجابة: 4 فترات مدة كل منها 10 دقائق.\nس2 (مستوى التطبيق): كم نقطة للتصويب من خارج قوس النقاط الثلاث؟\nالإجابة: ثلاث نقاط.\nس3 (مستوى الاستدلال): لماذا نمرر بعد التنطيط مباشرة؟\nالإجابة: لخداع المنافس وتجنب قطع التمريرة.\n\nس4 (مستوى المعرفة): متى نستخدم التوقف بعدة واحدة؟\nالإجابة: عند استلام الكرات العالية أو المرتدة.\nس5 (مستوى التطبيق): على أي قدم نرتكز بعد التوقف بعدتين؟\nالإجابة: على القدم الأولى.\nس6 (مستوى الاستدلال): لماذا نثني الركبتين عند التوقف؟\nالإجابة: لامتصاص سرعة الجري.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التمرير بعد التنطيط لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): من أين تؤدى رمية الإدخال؟\nالإجابة: من المكان الذي يحدده الحكم الأقرب للخطأ أو خروج الكرة.\nس3 (مستوى الاستدلال): متى تعد الكرة خارج الملعب؟\nالإجابة: إذا لمست الأرض خارج الحدود أو لمسها لاعب متصل بالأرض خارجها.\n\nس4 (مستوى المعرفة): أدِّ التوقف بعدة واحدة ثم الارتكاز.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما الفرق بين طريقتي التوقف؟\nالإجابة: بعدة واحدة بالقدمين معًا، وبعدتين قدم ثم الأخرى.\nس6 (مستوى الاستدلال): ما هدف التوقف في المباراة؟\nالإجابة: التحرر من المدافع أو التصويب أو الاستلام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب التنطيط ثم التمرير على الحائط (دليل المعلم ص 111-113).\nإرشاد لولي الأمر: شجع طالبك على التنطيط والتوقف بالطريقتين (دليل المعلم ص 114).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=8"}}, {"focus": "المحاورة مع تغيير الاتجاه والتصويبة السلمية + محطات مهارات كرة السلة ومباراة تطبيقية", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي المحاورة مع تغيير الاتجاه بتبديل اليدين للتخلص من المنافس.\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام قرب السلة.\n3. يحلل الأخطاء الشائعة ويصححها.\n4. يؤدي التمرير بعد التنطيط والتوقف والمحاورة والتصويبة السلمية في محطات.\n5. يطبق القواعد القانونية في مباراة.\n6. يتعاون مع زملائه بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المحاورة مع تغيير الاتجاه\n- التصويبة السلمية\n- الخطوتان\n- اللوحة\n- المحطات\n- المباراة\n- كرة القفز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التصويبة السلمية من الصف السابع ويسأل: كيف نربطها بالمحاورة لتجاوز مدافع؟ (ص 115).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: المحاورة مع تغيير الاتجاه بتبديل اليدين أمام المدافع ثم خطوتان وارتقاء وتصويب على اللوحة، من الجانبين، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 119: قطارات المحاورة بين الأقماع ثم التصويبة السلمية، ثم مع مدافع سلبي، ويعد القائد الإصابات ويصحح، ويتدرب الطالب ويصحح (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة تتابع التصويبة السلمية بعد المحاورة، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محطات ص 120: التمرير بعد التنطيط مع مدافع، التوقف بعدة واحدة وبعدتين والارتكاز، المحاورة والتصويبة السلمية، التصويب من الثبات، مع التبديل، ويؤدي الطالب ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباراة ص 121: 5 ضد 5 تبدأ بكرة القفز بحكام من الطلبة، ويلعب الطالب ويحكم (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يناقش الطلبة: متى استخدمتم التوقف بعدة واحدة في المباراة؟ ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف نغير الاتجاه في المحاورة؟\nالإجابة: بتبديل اليدين أمام الجسم.\nس2 (مستوى التطبيق): كم خطوة في التصويبة السلمية؟\nالإجابة: خطوتان.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: من المسافات القصيرة بعد المحاورة أو الاستلام قرب السلة.\n\nس4 (مستوى المعرفة): كيف بدأت المباراة؟\nالإجابة: بكرة القفز.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: التوقف والارتكاز، والمحاورة والتصويبة السلمية.\nس6 (مستوى الاستدلال): متى استخدمت التمرير بعد التنطيط؟\nالإجابة: عند وجود مدافع يحاول قطع التمريرة.", "التقويم الختامي": "س1 (مستوى المعرفة): حاور مع تغيير الاتجاه ثم أدِّ التصويبة السلمية.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): زميلك يصوب دون النظر إلى اللوحة، ما الخطأ؟\nالإجابة: يجب النظر إلى اللوحة والتصويب عليها.\nس3 (مستوى الاستدلال): لماذا نرفع الركبة عند الارتقاء؟\nالإجابة: لزيادة الارتفاع والاتزان.\n\nس4 (مستوى المعرفة): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس5 (مستوى التطبيق): اذكر قاعدة طبقتها.\nالإجابة: مثل: رمية الإدخال.\nس6 (مستوى الاستدلال): كيف تصرفت مع قرار الحكم؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب المحاورة والتصويبة السلمية (دليل المعلم ص 115-119).\nإرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يشرح طريقة اللعب والقواعد القانونية (5 لاعبين، 4 فترات، كرة القفز، النقاط، رمية الإدخال).\n2. يؤدي التمرير بعد التنطيط مباشرة دون توقف.\n3. يميز متى يستخدم التمرير بعد التنطيط.\n4. يشرح طريقتي التوقف واستخدامهما.\n5. يؤدي التوقف بعدة واحدة (بالوثب) وبعدتين بعد التحرك بالكرة.\n6. يطبق قاعدة الارتكاز بعد كل نوع من التوقف.\n\nالحصة 2:\n1. يؤدي المحاورة مع تغيير الاتجاه بتبديل اليدين للتخلص من المنافس.\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام قرب السلة.\n3. يحلل الأخطاء الشائعة ويصححها.\n4. يؤدي التمرير بعد التنطيط والتوقف والمحاورة والتصويبة السلمية في محطات.\n5. يطبق القواعد القانونية في مباراة.\n6. يتعاون مع زملائه بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: أطواق\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة السلة\n- كرة القفز\n- رمية الإدخال\n- التمرير بعد التنطيط\n- التوقف بعدة واحدة\n- التوقف بعدتين\n- الارتكاز\n- امتصاص السرعة\n\nالحصة 2:\n- المحاورة مع تغيير الاتجاه\n- التصويبة السلمية\n- الخطوتان\n- اللوحة\n- المحطات\n- المباراة\n- كرة القفز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة كرة القفز ويسأل: كيف تبدأ المباراة؟ ويشرح القواعد (ص 111-112) ويقدم التمرير بعد التنطيط (ص 113).\n\nالحصة 2:\nيراجع المعلم التصويبة السلمية من الصف السابع ويسأل: كيف نربطها بالمحاورة لتجاوز مدافع؟ (ص 115).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القواعد (الفترات 10 دقائق، كرة القفز، النقاط 1/2/3، رمية الإدخال، التبديل)، ويؤدي نموذج التمرير بعد التنطيط (التحرك بالتنطيط والنظر للزميل، مسك الكرة وتمريرها مباشرة بعد التنطيط دون توقف)، ويستمع الطالب ويقلد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: قطاران متقابلان تنطيط ثم تمرير مباشر للقطار المقابل، ثم مع مدافع في المنتصف، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كرة الملك) بشرط التمرير بعد التنطيط، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: التوقف بعدة واحدة (الهبوط بالقدمين معًا مع ثني الركبتين وميل الجذع لامتصاص السرعة، ويجوز الارتكاز على أي قدم)، والتوقف بعدتين (الهبوط على قدم ثم الأخرى، والارتكاز على القدم الأولى)، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات: تنطيط ثم التوقف بعدة واحدة بالإشارة ثم الارتكاز والتمرير، ثم التوقف بعدتين، في قطارات، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (الإشارة): تنطيط وعند الصافرة توقف بالطريقة التي يناديها المعلم، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: المحاورة مع تغيير الاتجاه بتبديل اليدين أمام المدافع ثم خطوتان وارتقاء وتصويب على اللوحة، من الجانبين، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 119: قطارات المحاورة بين الأقماع ثم التصويبة السلمية، ثم مع مدافع سلبي، ويعد القائد الإصابات ويصحح، ويتدرب الطالب ويصحح (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة تتابع التصويبة السلمية بعد المحاورة، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محطات ص 120: التمرير بعد التنطيط مع مدافع، التوقف بعدة واحدة وبعدتين والارتكاز، المحاورة والتصويبة السلمية، التصويب من الثبات، مع التبديل، ويؤدي الطالب ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباراة ص 121: 5 ضد 5 تبدأ بكرة القفز بحكام من الطلبة، ويلعب الطالب ويحكم (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يناقش الطلبة: متى استخدمتم التوقف بعدة واحدة في المباراة؟ ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كم فترة في مباراة كرة السلة؟\nالإجابة: 4 فترات مدة كل منها 10 دقائق.\nس2 (مستوى التطبيق): كم نقطة للتصويب من خارج قوس النقاط الثلاث؟\nالإجابة: ثلاث نقاط.\nس3 (مستوى الاستدلال): لماذا نمرر بعد التنطيط مباشرة؟\nالإجابة: لخداع المنافس وتجنب قطع التمريرة.\n\nس4 (مستوى المعرفة): متى نستخدم التوقف بعدة واحدة؟\nالإجابة: عند استلام الكرات العالية أو المرتدة.\nس5 (مستوى التطبيق): على أي قدم نرتكز بعد التوقف بعدتين؟\nالإجابة: على القدم الأولى.\nس6 (مستوى الاستدلال): لماذا نثني الركبتين عند التوقف؟\nالإجابة: لامتصاص سرعة الجري.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف نغير الاتجاه في المحاورة؟\nالإجابة: بتبديل اليدين أمام الجسم.\nس2 (مستوى التطبيق): كم خطوة في التصويبة السلمية؟\nالإجابة: خطوتان.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: من المسافات القصيرة بعد المحاورة أو الاستلام قرب السلة.\n\nس4 (مستوى المعرفة): كيف بدأت المباراة؟\nالإجابة: بكرة القفز.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: التوقف والارتكاز، والمحاورة والتصويبة السلمية.\nس6 (مستوى الاستدلال): متى استخدمت التمرير بعد التنطيط؟\nالإجابة: عند وجود مدافع يحاول قطع التمريرة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ التمرير بعد التنطيط لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): من أين تؤدى رمية الإدخال؟\nالإجابة: من المكان الذي يحدده الحكم الأقرب للخطأ أو خروج الكرة.\nس3 (مستوى الاستدلال): متى تعد الكرة خارج الملعب؟\nالإجابة: إذا لمست الأرض خارج الحدود أو لمسها لاعب متصل بالأرض خارجها.\n\nس4 (مستوى المعرفة): أدِّ التوقف بعدة واحدة ثم الارتكاز.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما الفرق بين طريقتي التوقف؟\nالإجابة: بعدة واحدة بالقدمين معًا، وبعدتين قدم ثم الأخرى.\nس6 (مستوى الاستدلال): ما هدف التوقف في المباراة؟\nالإجابة: التحرر من المدافع أو التصويب أو الاستلام.\n\nالحصة 2:\nس1 (مستوى المعرفة): حاور مع تغيير الاتجاه ثم أدِّ التصويبة السلمية.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): زميلك يصوب دون النظر إلى اللوحة، ما الخطأ؟\nالإجابة: يجب النظر إلى اللوحة والتصويب عليها.\nس3 (مستوى الاستدلال): لماذا نرفع الركبة عند الارتقاء؟\nالإجابة: لزيادة الارتفاع والاتزان.\n\nس4 (مستوى المعرفة): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس5 (مستوى التطبيق): اذكر قاعدة طبقتها.\nالإجابة: مثل: رمية الإدخال.\nس6 (مستوى الاستدلال): كيف تصرفت مع قرار الحكم؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تدريب التنطيط ثم التمرير على الحائط (دليل المعلم ص 111-113).\nإرشاد لولي الأمر: شجع طالبك على التنطيط والتوقف بالطريقتين (دليل المعلم ص 114).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=8\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تدريب المحاورة والتصويبة السلمية (دليل المعلم ص 115-119).\nإرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/8/pe/?l=8"}}, {"title": "الاختبار العملي (2)", "unit": "تقويم", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 69-123 (الرياضات والألعاب الحركية 1)", "n": 1, "periods": [{"focus": "اختبار عملي في كرة القدم ودفع الجلة + اختبار عملي في كرة السلة وسباق العدو", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي التصويب بوجه القدم الخارجي والمحاورة من الجانب والخلف وضرب الكرة بالرأس.\n2. يؤدي دفع الجلة بطريقة الزحف بالقواعد.\n3. const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ في وحدة الرياضات والألعاب الحركية (1) اختير: ألعاب القوى (6 حصص) + كرة القدم (6 حصص) + كرة السلة (4 حصص) = 16 حصة، مع الاختبار العملي (1) في الأسبوع الثامن.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
