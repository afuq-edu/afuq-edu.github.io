 يقي الإعداد البدني من الإصابة؟\nالإجابة: يرفع حرارة العضلات ومرونتها.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ التسليم والتسلم مع زميلك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ المحاورة من الأمام ضد مدافع.\nالإجابة: يؤديها.\nس3 (المستوى المتقدم): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك إرشادات المعلم في دليل المعلم ص 9-13.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها، ومراجعة مفهوم اللياقة المرتبطة بالصحة (دليل المعلم ص 37-39)."}}, {"title": "اللياقة البدنية المرتبطة بالصحة (القوة العضلية، والتحمل الدوري التنفسي)", "unit": "اللياقة البدنية", "week": "الثاني – الثالث", "date": "13-17/9/2026 إلى 20-24/9/2026", "pages": "دليل المعلم ص 37-50", "n": 4, "periods": [{"focus": "مفهوم اللياقة المرتبطة بالصحة وعنصر القوة العضلية وأنواعها والعوامل المؤثرة فيها", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم اللياقة البدنية المرتبطة بالصحة وعناصرها.\n2. يحلل العلاقة بين القوة العضلية والعوامل المؤثرة فيها (التدريب، العمر، نوع الألياف).\n3. يؤدي تمرينات حرة وبالأدوات لتنمية القوة العضلية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: أحزمة مطاطية\n- أخرى: وسادة توازن\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- اللياقة المرتبطة بالصحة\n- القوة العضلية\n- المقاومة\n- الانقباض الإرادي", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور رامي الجلة ولاعب كرة يد يصوب ويسأل: ما العنصر المشترك؟ ويقدم اللياقة المرتبطة بالصحة والقوة العضلية (ص 39-40).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم وعناصره (التحمل، المرونة، القوة، التحمل العضلي، التركيب الجسمي)، والقوة العضلية (التغلب على مقاومة بانقباض إرادي) وأنواعها وأهميتها وعواملها، ويؤدي النماذج ص 42: (إقعاء) الوثب لأعلى مع فرد الجسم، (انبطاح مائل) الارتكاز على الساعدين والثبات، دفع الكرة الطبية للأمام، (حزام مطاطي حول الساقين) رفع الرجلين، سحب يد الزميل، ثني الذراعين على وسادة التوازن.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط المحطات ص 46: أربع محطات بالتمرينات السابقة مع تبديل وتسجيل التكرارات.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحلل الطلبة في مجموعات: لماذا يختلف الطلبة في القوة؟ ويذكرون عاملين ويعرضون.\n- الطالب: يحلل ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلات على التغلب على مقاومة خارجية بانقباض إرادي.\nس2 (المستوى المتوقع): اذكر مهارة تحتاج إلى القوة العضلية.\nالإجابة: دفع الجلة أو التصويب في كرة اليد.\nس3 (المستوى المتقدم): اذكر عاملًا يؤثر في القوة.\nالإجابة: التدريب أو نوع الألياف العضلية.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر عناصر اللياقة المرتبطة بالصحة.\nالإجابة: التحمل الدوري التنفسي، المرونة، القوة، التحمل العضلي، التركيب الجسمي.\nس2 (المستوى المتوقع): أدِّ تمرين دفع الكرة الطبية للأمام.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف تحسن القوة العضلية قوامك؟\nالإجابة: تقوي عضلات الجذع التي تحمل الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرين الارتكاز على الساعدين (بلانك) 30 ثانية يوميًا (دليل المعلم ص 40-42)."}}, {"focus": "قياس القوة العضلية (الوثب العريض من الثبات، دفع الكرة الطبية من الجلوس) ومنافساتها", "num": 2, "fields": {"المخرجات التعليمية": "1. يطبق اختباري الوثب العريض من الثبات ودفع الكرة الطبية من الجلوس.\n2. يسجل نتائجه ويقارنها بزملائه.\n3. يوظف القوة العضلية في منافسات.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: شريط قياس\n- أخرى: كرات طبية 1-2 كجم\n- أخرى: حائط\n- أخرى: استمارات تسجيل\n- أخرى: أقماع", "المفاهيم": "- قياس القوة\n- الوثب العريض من الثبات\n- دفع الكرة الطبية من الجلوس\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القوة ويسأل: كيف نقيسها دون أجهزة؟ ويعرض الاختبارين (ص 40-41).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد: اختبار الوثب العريض (ثني الركبتين ومرجحة الذراعين والوثب بالقدمين والهبوط بتوازن، قياس من الخط إلى الكعبين، أفضل محاولتين)، ثم دفع الكرة الطبية من الجلوس والظهر ملاصق للحائط (المسافة من الحائط إلى أول لمسة)، مع التسجيل.\n- الطالب: يؤدي ويسجل لزميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط المربع ص 46: مسار مربع 5 م بمناطق أداء في الزوايا (وثب، دفع كرة، ثني ذراعين) ومنافسة بين المجموعات.\n- الطالب: يتسابق.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة النتائج ويستنتجون علاقة الوثب العريض بقوة الرجلين ودفع الكرة بقوة الذراعين.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أين تقاس مسافة الوثب العريض؟\nالإجابة: من خط البداية إلى آخر جزء يلمس الأرض خلفًا (الكعبان).\nس2 (المستوى المتوقع): ما شرط دفع الكرة الطبية من الجلوس؟\nالإجابة: بقاء الظهر ملاصقًا للحائط.\nس3 (المستوى المتقدم): ماذا يحدث لو سقط الطالب للخلف بعد الوثب؟\nالإجابة: تعاد المحاولة.", "التقويم الختامي": "س1 (مستوى الدعم): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (المستوى المتوقع): أي الاختبارين يقيس قوة الرجلين؟\nالإجابة: الوثب العريض من الثبات.\nس3 (المستوى المتقدم): اقترح تمرينًا لتحسين نتيجة دفع الكرة الطبية.\nالإجابة: دفع الكرة الطبية من الصدر يوميًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تسجيل نتيجته في الوثب العريض ومحاولة تحسينها (دليل المعلم ص 40-41)."}}, {"focus": "التحمل الدوري التنفسي وتمرينات تنميته", "num": 3, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم التحمل الدوري التنفسي وأنواعه وأهميته.\n2. يؤدي تمرينات لتنمية التحمل (الجري الجانبي المكوكي، الصعود والنزول على المقعد، نقل الرجلين من الانبطاح المائل).\n3. يقدر أهمية التحمل في الحياة اليومية والألعاب الجماعية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n- أخرى: حبال وثب", "المفاهيم": "- التحمل الدوري التنفسي\n- التحمل الهوائي\n- اللاهوائي\n- الاقتصاد في الجهد", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يستمر لاعب كرة القدم 90 دقيقة دون انهيار؟ ويقدم التحمل (ص 43-44).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم وأنواعه وأهميته (كفاءة الجهازين، الاقتصاد في الجهد)، ويؤدي النماذج ص 45: الجري الجانبي المكوكي 3 دقائق، الصعود والنزول على المقعد، نقل الرجلين للأمام والخلف من الانبطاح المائل.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات تحمل بزمن 3 دقائق لكل محطة مع قياس النبض بعدها.\n- الطالب: يؤدي ويقيس.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة النبض بين المحطات ويستنتجون أثر الجهد المستمر.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما التحمل الدوري التنفسي؟\nالإجابة: قدرة الفرد على أداء جهد متوسط الشدة لمدة طويلة.\nس2 (المستوى المتوقع): اذكر نوعين للتحمل.\nالإجابة: الهوائي واللاهوائي.\nس3 (المستوى المتقدم): اذكر تمرينًا للتحمل بالمقعد.\nالإجابة: الصعود والنزول بالتبادل.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر فائدتين للتحمل.\nالإجابة: كفاءة القلب والرئتين والاقتصاد في الجهد.\nس2 (المستوى المتوقع): أدِّ الجري الجانبي المكوكي دقيقتين.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف يساعد التحمل في حياتك اليومية؟\nالإجابة: يجعلني أؤدي مهامي دون تعب سريع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على نشاط هوائي 20 دقيقة ثلاث مرات أسبوعيًا (دليل المعلم ص 43-45)."}}, {"focus": "قياس التحمل الدوري التنفسي (اختبار الخطوة) وتوظيف العنصرين في الألعاب", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق اختبار الخطوة (الصعود والنزول على منصة) وقياس النبض.\n2. يوظف القوة العضلية والتحمل في ألعاب ومسابقات.\n3. يقدر أهمية ممارسة تمرينات اللياقة المرتبطة بالصحة باستمرار.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية أو صناديق\n- أخرى: ساعة إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n- أخرى: كرات طبية", "المفاهيم": "- اختبار الخطوة\n- النبض\n- الإيقاع\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التحمل ويعرض اختبار الخطوة (ص 44) وطريقة قياس النبض يدويًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار الخطوة: صعود ونزول على منصة بإيقاع محدد لمدة محددة ثم قياس النبض وتسجيله، في مجموعتين بالتبادل (تؤدي وتسجل).\n- الطالب: يؤدي ويقيس ويسجل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك المستمرة) 8 دقائق مع محطة دفع كرة طبية عند التسجيل لتوظيف القوة والتحمل.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كان نبض بعض الزملاء أقل بعد الاختبار؟ ليستنتج الطلبة أثر التدريب المنتظم.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الذي نقيسه بعد اختبار الخطوة؟\nالإجابة: النبض.\nس2 (المستوى المتوقع): ماذا يدل انخفاض النبض بعد الاختبار؟\nالإجابة: على تحمل أفضل.\nس3 (المستوى المتقدم): ما العنصران اللذان وظفناهما في اللعبة؟\nالإجابة: القوة العضلية والتحمل.", "التقويم الختامي": "س1 (مستوى الدعم): كيف تقيس نبضك يدويًا؟\nالإجابة: بوضع إصبعين على الرسغ أو الرقبة وعد النبضات في 15 ثانية وضربها في 4.\nس2 (المستوى المتوقع): اقترح خطة أسبوعية لتحسين تحملك.\nالإجابة: جري 20 دقيقة ثلاث مرات أسبوعيًا.\nس3 (المستوى المتقدم): لماذا نستمر في تمرينات اللياقة المرتبطة بالصحة؟\nالإجابة: لأن فوائدها تزول بالتوقف عن التدريب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تسجيل نبضه قبل النشاط وبعده أسبوعًا، والاطلاع على اللياقة المرتبطة بالمهارة (دليل المعلم ص 52-53)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مفهوم اللياقة البدنية المرتبطة بالصحة وعناصرها.\n2. يحلل العلاقة بين القوة العضلية والعوامل المؤثرة فيها (التدريب، العمر، نوع الألياف).\n3. يؤدي تمرينات حرة وبالأدوات لتنمية القوة العضلية.\n\nالحصة 2:\n1. يطبق اختباري الوثب العريض من الثبات ودفع الكرة الطبية من الجلوس.\n2. يسجل نتائجه ويقارنها بزملائه.\n3. يوظف القوة العضلية في منافسات.\n\nالحصة 3:\n1. يذكر مفهوم التحمل الدوري التنفسي وأنواعه وأهميته.\n2. يؤدي تمرينات لتنمية التحمل (الجري الجانبي المكوكي، الصعود والنزول على المقعد، نقل الرجلين من الانبطاح المائل).\n3. يقدر أهمية التحمل في الحياة اليومية والألعاب الجماعية.\n\nالحصة 4:\n1. يطبق اختبار الخطوة (الصعود والنزول على منصة) وقياس النبض.\n2. يوظف القوة العضلية والتحمل في ألعاب ومسابقات.\n3. يقدر أهمية ممارسة تمرينات اللياقة المرتبطة بالصحة باستمرار.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طبية\n- أخرى: أحزمة مطاطية\n- أخرى: وسادة توازن\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: شريط قياس\n- أخرى: كرات طبية 1-2 كجم\n- أخرى: حائط\n- أخرى: استمارات تسجيل\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: مقاعد سويدية\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n- أخرى: حبال وثب\n\nالحصة 4:\n- أخرى: مقاعد سويدية أو صناديق\n- أخرى: ساعة إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n- أخرى: كرات طبية", "المفاهيم": "الحصة 1:\n- اللياقة المرتبطة بالصحة\n- القوة العضلية\n- المقاومة\n- الانقباض الإرادي\n\nالحصة 2:\n- قياس القوة\n- الوثب العريض من الثبات\n- دفع الكرة الطبية من الجلوس\n- التسجيل\n\nالحصة 3:\n- التحمل الدوري التنفسي\n- التحمل الهوائي\n- اللاهوائي\n- الاقتصاد في الجهد\n\nالحصة 4:\n- اختبار الخطوة\n- النبض\n- الإيقاع\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور رامي الجلة ولاعب كرة يد يصوب ويسأل: ما العنصر المشترك؟ ويقدم اللياقة المرتبطة بالصحة والقوة العضلية (ص 39-40).\n\nالحصة 2:\nيراجع المعلم القوة ويسأل: كيف نقيسها دون أجهزة؟ ويعرض الاختبارين (ص 40-41).\n\nالحصة 3:\nيسأل المعلم: لماذا يستمر لاعب كرة القدم 90 دقيقة دون انهيار؟ ويقدم التحمل (ص 43-44).\n\nالحصة 4:\nيراجع المعلم التحمل ويعرض اختبار الخطوة (ص 44) وطريقة قياس النبض يدويًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم وعناصره (التحمل، المرونة، القوة، التحمل العضلي، التركيب الجسمي)، والقوة العضلية (التغلب على مقاومة بانقباض إرادي) وأنواعها وأهميتها وعواملها، ويؤدي النماذج ص 42: (إقعاء) الوثب لأعلى مع فرد الجسم، (انبطاح مائل) الارتكاز على الساعدين والثبات، دفع الكرة الطبية للأمام، (حزام مطاطي حول الساقين) رفع الرجلين، سحب يد الزميل، ثني الذراعين على وسادة التوازن.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط المحطات ص 46: أربع محطات بالتمرينات السابقة مع تبديل وتسجيل التكرارات.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحلل الطلبة في مجموعات: لماذا يختلف الطلبة في القوة؟ ويذكرون عاملين ويعرضون.\n- الطالب: يحلل ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد: اختبار الوثب العريض (ثني الركبتين ومرجحة الذراعين والوثب بالقدمين والهبوط بتوازن، قياس من الخط إلى الكعبين، أفضل محاولتين)، ثم دفع الكرة الطبية من الجلوس والظهر ملاصق للحائط (المسافة من الحائط إلى أول لمسة)، مع التسجيل.\n- الطالب: يؤدي ويسجل لزميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط المربع ص 46: مسار مربع 5 م بمناطق أداء في الزوايا (وثب، دفع كرة، ثني ذراعين) ومنافسة بين المجموعات.\n- الطالب: يتسابق.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة النتائج ويستنتجون علاقة الوثب العريض بقوة الرجلين ودفع الكرة بقوة الذراعين.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم وأنواعه وأهميته (كفاءة الجهازين، الاقتصاد في الجهد)، ويؤدي النماذج ص 45: الجري الجانبي المكوكي 3 دقائق، الصعود والنزول على المقعد، نقل الرجلين للأمام والخلف من الانبطاح المائل.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات تحمل بزمن 3 دقائق لكل محطة مع قياس النبض بعدها.\n- الطالب: يؤدي ويقيس.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة النبض بين المحطات ويستنتجون أثر الجهد المستمر.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار الخطوة: صعود ونزول على منصة بإيقاع محدد لمدة محددة ثم قياس النبض وتسجيله، في مجموعتين بالتبادل (تؤدي وتسجل).\n- الطالب: يؤدي ويقيس ويسجل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك المستمرة) 8 دقائق مع محطة دفع كرة طبية عند التسجيل لتوظيف القوة والتحمل.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كان نبض بعض الزملاء أقل بعد الاختبار؟ ليستنتج الطلبة أثر التدريب المنتظم.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلات على التغلب على مقاومة خارجية بانقباض إرادي.\nس2 (المستوى المتوقع): اذكر مهارة تحتاج إلى القوة العضلية.\nالإجابة: دفع الجلة أو التصويب في كرة اليد.\nس3 (المستوى المتقدم): اذكر عاملًا يؤثر في القوة.\nالإجابة: التدريب أو نوع الألياف العضلية.\n\nالحصة 2:\nس1 (مستوى الدعم): من أين تقاس مسافة الوثب العريض؟\nالإجابة: من خط البداية إلى آخر جزء يلمس الأرض خلفًا (الكعبان).\nس2 (المستوى المتوقع): ما شرط دفع الكرة الطبية من الجلوس؟\nالإجابة: بقاء الظهر ملاصقًا للحائط.\nس3 (المستوى المتقدم): ماذا يحدث لو سقط الطالب للخلف بعد الوثب؟\nالإجابة: تعاد المحاولة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما التحمل الدوري التنفسي؟\nالإجابة: قدرة الفرد على أداء جهد متوسط الشدة لمدة طويلة.\nس2 (المستوى المتوقع): اذكر نوعين للتحمل.\nالإجابة: الهوائي واللاهوائي.\nس3 (المستوى المتقدم): اذكر تمرينًا للتحمل بالمقعد.\nالإجابة: الصعود والنزول بالتبادل.\n\nالحصة 4:\nس1 (مستوى الدعم): ما الذي نقيسه بعد اختبار الخطوة؟\nالإجابة: النبض.\nس2 (المستوى المتوقع): ماذا يدل انخفاض النبض بعد الاختبار؟\nالإجابة: على تحمل أفضل.\nس3 (المستوى المتقدم): ما العنصران اللذان وظفناهما في اللعبة؟\nالإجابة: القوة العضلية والتحمل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر عناصر اللياقة المرتبطة بالصحة.\nالإجابة: التحمل الدوري التنفسي، المرونة، القوة، التحمل العضلي، التركيب الجسمي.\nس2 (المستوى المتوقع): أدِّ تمرين دفع الكرة الطبية للأمام.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف تحسن القوة العضلية قوامك؟\nالإجابة: تقوي عضلات الجذع التي تحمل الجسم معتدلًا.\n\nالحصة 2:\nس1 (مستوى الدعم): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (المستوى المتوقع): أي الاختبارين يقيس قوة الرجلين؟\nالإجابة: الوثب العريض من الثبات.\nس3 (المستوى المتقدم): اقترح تمرينًا لتحسين نتيجة دفع الكرة الطبية.\nالإجابة: دفع الكرة الطبية من الصدر يوميًا.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر فائدتين للتحمل.\nالإجابة: كفاءة القلب والرئتين والاقتصاد في الجهد.\nس2 (المستوى المتوقع): أدِّ الجري الجانبي المكوكي دقيقتين.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف يساعد التحمل في حياتك اليومية؟\nالإجابة: يجعلني أؤدي مهامي دون تعب سريع.\n\nالحصة 4:\nس1 (مستوى الدعم): كيف تقيس نبضك يدويًا؟\nالإجابة: بوضع إصبعين على الرسغ أو الرقبة وعد النبضات في 15 ثانية وضربها في 4.\nس2 (المستوى المتوقع): اقترح خطة أسبوعية لتحسين تحملك.\nالإجابة: جري 20 دقيقة ثلاث مرات أسبوعيًا.\nس3 (المستوى المتقدم): لماذا نستمر في تمرينات اللياقة المرتبطة بالصحة؟\nالإجابة: لأن فوائدها تزول بالتوقف عن التدريب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرين الارتكاز على الساعدين (بلانك) 30 ثانية يوميًا (دليل المعلم ص 40-42).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تسجيل نتيجته في الوثب العريض ومحاولة تحسينها (دليل المعلم ص 40-41).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على نشاط هوائي 20 دقيقة ثلاث مرات أسبوعيًا (دليل المعلم ص 43-45).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تسجيل نبضه قبل النشاط وبعده أسبوعًا، والاطلاع على اللياقة المرتبطة بالمهارة (دليل المعلم ص 52-53)."}}, {"title": "اللياقة البدنية المرتبطة بالمهارة (الرشاقة، والتوازن)", "unit": "اللياقة البدنية", "week": "الرابع – الخامس", "date": "27/9-1/10/2026 إلى 4-8/10/2026", "pages": "دليل المعلم ص 52-64", "n": 4, "periods": [{"focus": "مفهوم اللياقة المرتبطة بالمهارة وعنصر الرشاقة وأهميتها وعواملها", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم اللياقة البدنية المرتبطة بالمهارة وعناصرها.\n2. يربط بين الرشاقة والعوامل المؤثرة فيها (القوة، السرعة، التوافق).\n3. يؤدي تمرينات لتنمية الرشاقة (الوثب والدوران، الجري والتوقف المفاجئ، سلم الرشاقة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: سلم الرشاقة\n- أخرى: أطواق\n- أخرى: ساعة إيقاف\n- صورة توضيحية", "المفاهيم": "- اللياقة المرتبطة بالمهارة\n- الرشاقة\n- تغيير الاتجاه\n- التوقيت", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب كرة يد يراوغ ويسأل: ما العنصر الذي يمكّنه من تغيير اتجاهه فجأة؟ ويقدم الرشاقة (ص 53).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم وعناصره (السرعة، الرشاقة، التوازن، التوافق)، والرشاقة (تغيير أوضاع الجسم أو اتجاهاته بدقة وتوقيت) وأهميتها وعواملها، ويؤدي النماذج ص 55: الجري 5 م ثم الوثب والدوران ربع لفة، الوثب للجانبين، الجري السريع والتوقف المفاجئ ولمس الأقماع، الجري الجانبي في سلم الرشاقة، الجري بين أقماع للأمام والخلف والجانب.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الرشاقة بأربع مجموعات مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب الطلبة تغيير الاتجاه بسرعة عالية ثم بسرعة متوسطة ويكتشفون علاقة الرشاقة بالتحكم.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الرشاقة؟\nالإجابة: قدرة الفرد على تغيير أوضاع جسمه أو اتجاهات حركته بدقة وتوقيت مناسب.\nس2 (المستوى المتوقع): اذكر مهارة تحتاج إلى الرشاقة.\nالإجابة: الخداع والمحاورة في كرة اليد والسلة والقدم.\nس3 (المستوى المتقدم): اذكر عاملًا يؤثر في الرشاقة.\nالإجابة: القوة أو السرعة أو التوافق.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر عناصر اللياقة المرتبطة بالمهارة.\nالإجابة: السرعة، الرشاقة، التوازن، التوافق.\nس2 (المستوى المتوقع): أدِّ الجري السريع والتوقف المفاجئ ولمس القمع.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): لماذا تحتاج ألعاب المضرب إلى الرشاقة؟\nالإجابة: لتغطية الملعب والوصول السريع إلى الريشة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الجري بين عوائق مع تغيير الاتجاه (دليل المعلم ص 53-55)."}}, {"focus": "قياس الرشاقة (اختبار T) ومنافسات الرشاقة", "num": 2, "fields": {"المخرجات التعليمية": "1. يطبق اختبار الرشاقة (T) بالتسلسل الصحيح.\n2. يسجل زمنه ويقارنه.\n3. يوظف الرشاقة في منافسات وألعاب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات", "المفاهيم": "- اختبار T\n- الجري الجانبي\n- الجري للخلف\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الرشاقة ويعرض اختبار T بأربعة أقماع (ص 54).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: اختبار T في مجموعات بقائد يحمل الساعة: جري أمامي للقمع B، جري جانبي يسارًا للقمع C، جري جانبي يمينًا للقمع D مرورًا بـB، جري جانبي للقمع B، جري للخلف للقمع A، مع التسجيل.\n- الطالب: يؤدي ويسجل لزميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 60: تتابع رشاقة بين المجموعات في مسار T.\n- الطالب: يتسابق.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش الطلبة: ما المرحلة الأصعب في الاختبار ولماذا؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما شكل مسار اختبار الرشاقة؟\nالإجابة: حرف T.\nس2 (المستوى المتوقع): كيف نعود إلى القمع A في نهاية الاختبار؟\nالإجابة: بالجري للخلف.\nس3 (المستوى المتقدم): ما القاعدة في اختبار T؟\nالإجابة: لمس كل قمع في ترتيبه الصحيح.", "التقويم الختامي": "س1 (مستوى الدعم): ما زمنك في اختبار T وما هدفك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي المراحل كانت الأبطأ ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): اقترح تمرينًا لتحسين زمنك.\nالإجابة: الجري الجانبي بين أقماع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على اختبار T أسبوعيًا ومقارنة الزمن (دليل المعلم ص 54-60)."}}, {"focus": "عنصر التوازن (الثابت والحركي) وأهميته وعوامله وتمرينات تنميته", "num": 3, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم التوازن وأنواعه والعوامل المؤثرة فيه.\n2. يؤدي تمرينات للتوازن الثابت والحركي.\n3. يميز مواقف التوازن الثابت من الحركي في الألعاب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: وسائد توازن\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التوازن الثابت\n- التوازن الحركي\n- مركز الثقل\n- قاعدة الارتكاز", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم على وسادة توازن ويسأل: ما الذي يبقيني ثابتًا؟ ويقدم التوازن (ص 56-57).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم (الاحتفاظ بمركز الثقل فوق قاعدة الارتكاز) وأنواعه وأهميته وعوامله (قاعدة الارتكاز، مركز الثقل، النظر، القوة)، ويؤدي النماذج: الوقوف على قدم مع إغماض العينين، الميزان، المشي على المقعد مع تغيير الاتجاه، الهبوط بثبات بعد الوثب، الوقوف على وسادة التوازن.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات التوازن بأربع مجموعات مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحلل الطلبة في مجموعات مواقف (الهبوط بعد الوثب العالي، الوقوف على اليدين، المشي على العارضة) ويصنفونها.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما التوازن؟\nالإجابة: قدرة الفرد على الاحتفاظ بمركز ثقل الجسم فوق قاعدة الارتكاز.\nس2 (المستوى المتوقع): ما الفرق بين التوازن الثابت والحركي؟\nالإجابة: الثابت في وضع ثابت، والحركي أثناء الحركة.\nس3 (المستوى المتقدم): اذكر عاملًا يؤثر في التوازن.\nالإجابة: اتساع قاعدة الارتكاز أو النظر لنقطة ثابتة.", "التقويم الختامي": "س1 (مستوى الدعم): صنف: الهبوط بثبات بعد الوثب العالي.\nالإجابة: توازن حركي.\nس2 (المستوى المتوقع): أدِّ الوقوف على قدم مع إغماض العينين 10 ثوانٍ.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف يسهم التوازن في الوقاية من الإصابات؟\nالإجابة: يمنع السقوط ويحفظ ثبات المفاصل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الوقوف على قدم واحدة بعينين مغمضتين 15 ثانية يوميًا (دليل المعلم ص 56-57)."}}, {"focus": "قياس التوازن (الوقوف على مشط قدم واحدة، اختبار Y) ومنافسات التوازن", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق اختباري الوقوف على مشط قدم واحدة واختبار التوازن Y.\n2. يسجل نتائجه ويقارن.\n3. يوظف الرشاقة والتوازن في ألعاب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: ساعات إيقاف\n- أخرى: شريط قياس\n- أخرى: أقماع منخفضة\n- أخرى: استمارات تسجيل\n- أخرى: كرات", "المفاهيم": "- اختبار Y\n- الوقوف على مشط القدم\n- الرجل الحرة\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التوازن ويعرض الاختبارين (ص 57-58).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: اختبار الوقوف على مشط قدم واحدة (باطن القدم الأخرى على ركبة رجل الارتكاز واليدان على الوسط ورفع العقب) بالزمن، ثم اختبار Y (مد الرجل الحرة للأمام ثم الخلف يسارًا ثم الخلف يمينًا لأقصى مسافة مع الحفاظ على التوازن) بالقياس، في مجموعات بقائد.\n- الطالب: يؤدي ويسجل لزميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: مسار يجمع الرشاقة (T مصغر) والتوازن (المشي على المقعد والهبوط بثبات).\n- الطالب: يتسابق.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة نتائجهم ويستنتجون أثر النظر لنقطة ثابتة في زمن الثبات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): أين توضع باطن القدم الحرة في اختبار الوقوف على المشط؟\nالإجابة: على الجانب الداخلي لركبة رجل الارتكاز.\nس2 (المستوى المتوقع): ما مراحل اختبار Y؟\nالإجابة: الأمام، الخلف يسارًا، الخلف يمينًا.\nس3 (المستوى المتقدم): متى ينتهي اختبار الوقوف على المشط؟\nالإجابة: عند لمس العقب الأرض أو فقد التوازن.", "التقويم الختامي": "س1 (مستوى الدعم): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (المستوى المتوقع): أي الاتجاهات كان الأصعب في اختبار Y ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): اقترح تمرينًا لتحسين توازنك.\nالإجابة: الوقوف على وسادة التوازن يوميًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات التوازن اليومية، والاطلاع على سباق العدو 100 م (دليل المعلم ص 69-72)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مفهوم اللياقة البدنية المرتبطة بالمهارة وعناصرها.\n2. يربط بين الرشاقة والعوامل المؤثرة فيها (القوة، السرعة، التوافق).\n3. يؤدي تمرينات لتنمية الرشاقة (الوثب والدوران، الجري والتوقف المفاجئ، سلم الرشاقة).\n\nالحصة 2:\n1. يطبق اختبار الرشاقة (T) بالتسلسل الصحيح.\n2. يسجل زمنه ويقارنه.\n3. يوظف الرشاقة في منافسات وألعاب.\n\nالحصة 3:\n1. يذكر مفهوم التوازن وأنواعه والعوامل المؤثرة فيه.\n2. يؤدي تمرينات للتوازن الثابت والحركي.\n3. يميز مواقف التوازن الثابت من الحركي في الألعاب.\n\nالحصة 4:\n1. يطبق اختباري الوقوف على مشط قدم واحدة واختبار التوازن Y.\n2. يسجل نتائجه ويقارن.\n3. يوظف الرشاقة والتوازن في ألعاب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: سلم الرشاقة\n- أخرى: أطواق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: كرات\n\nالحصة 3:\n- أخرى: وسائد توازن\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: ساعات إيقاف\n- أخرى: شريط قياس\n- أخرى: أقماع منخفضة\n- أخرى: استمارات تسجيل\n- أخرى: كرات", "المفاهيم": "الحصة 1:\n- اللياقة المرتبطة بالمهارة\n- الرشاقة\n- تغيير الاتجاه\n- التوقيت\n\nالحصة 2:\n- اختبار T\n- الجري الجانبي\n- الجري للخلف\n- الزمن\n\nالحصة 3:\n- التوازن الثابت\n- التوازن الحركي\n- مركز الثقل\n- قاعدة الارتكاز\n\nالحصة 4:\n- اختبار Y\n- الوقوف على مشط القدم\n- الرجل الحرة\n- التسجيل", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة لاعب كرة يد يراوغ ويسأل: ما العنصر الذي يمكّنه من تغيير اتجاهه فجأة؟ ويقدم الرشاقة (ص 53).\n\nالحصة 2:\nيراجع المعلم الرشاقة ويعرض اختبار T بأربعة أقماع (ص 54).\n\nالحصة 3:\nيقف المعلم على وسادة توازن ويسأل: ما الذي يبقيني ثابتًا؟ ويقدم التوازن (ص 56-57).\n\nالحصة 4:\nيراجع المعلم التوازن ويعرض الاختبارين (ص 57-58).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم وعناصره (السرعة، الرشاقة، التوازن، التوافق)، والرشاقة (تغيير أوضاع الجسم أو اتجاهاته بدقة وتوقيت) وأهميتها وعواملها، ويؤدي النماذج ص 55: الجري 5 م ثم الوثب والدوران ربع لفة، الوثب للجانبين، الجري السريع والتوقف المفاجئ ولمس الأقماع، الجري الجانبي في سلم الرشاقة، الجري بين أقماع للأمام والخلف والجانب.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الرشاقة بأربع مجموعات مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب الطلبة تغيير الاتجاه بسرعة عالية ثم بسرعة متوسطة ويكتشفون علاقة الرشاقة بالتحكم.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: اختبار T في مجموعات بقائد يحمل الساعة: جري أمامي للقمع B، جري جانبي يسارًا للقمع C، جري جانبي يمينًا للقمع D مرورًا بـB، جري جانبي للقمع B، جري للخلف للقمع A، مع التسجيل.\n- الطالب: يؤدي ويسجل لزميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 60: تتابع رشاقة بين المجموعات في مسار T.\n- الطالب: يتسابق.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش الطلبة: ما المرحلة الأصعب في الاختبار ولماذا؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المفهوم (الاحتفاظ بمركز الثقل فوق قاعدة الارتكاز) وأنواعه وأهميته وعوامله (قاعدة الارتكاز، مركز الثقل، النظر، القوة)، ويؤدي النماذج: الوقوف على قدم مع إغماض العينين، الميزان، المشي على المقعد مع تغيير الاتجاه، الهبوط بثبات بعد الوثب، الوقوف على وسادة التوازن.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات التوازن بأربع مجموعات مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحلل الطلبة في مجموعات مواقف (الهبوط بعد الوثب العالي، الوقوف على اليدين، المشي على العارضة) ويصنفونها.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: اختبار الوقوف على مشط قدم واحدة (باطن القدم الأخرى على ركبة رجل الارتكاز واليدان على الوسط ورفع العقب) بالزمن، ثم اختبار Y (مد الرجل الحرة للأمام ثم الخلف يسارًا ثم الخلف يمينًا لأقصى مسافة مع الحفاظ على التوازن) بالقياس، في مجموعات بقائد.\n- الطالب: يؤدي ويسجل لزميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: مسار يجمع الرشاقة (T مصغر) والتوازن (المشي على المقعد والهبوط بثبات).\n- الطالب: يتسابق.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة نتائجهم ويستنتجون أثر النظر لنقطة ثابتة في زمن الثبات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الرشاقة؟\nالإجابة: قدرة الفرد على تغيير أوضاع جسمه أو اتجاهات حركته بدقة وتوقيت مناسب.\nس2 (المستوى المتوقع): اذكر مهارة تحتاج إلى الرشاقة.\nالإجابة: الخداع والمحاورة في كرة اليد والسلة والقدم.\nس3 (المستوى المتقدم): اذكر عاملًا يؤثر في الرشاقة.\nالإجابة: القوة أو السرعة أو التوافق.\n\nالحصة 2:\nس1 (مستوى الدعم): ما شكل مسار اختبار الرشاقة؟\nالإجابة: حرف T.\nس2 (المستوى المتوقع): كيف نعود إلى القمع A في نهاية الاختبار؟\nالإجابة: بالجري للخلف.\nس3 (المستوى المتقدم): ما القاعدة في اختبار T؟\nالإجابة: لمس كل قمع في ترتيبه الصحيح.\n\nالحصة 3:\nس1 (مستوى الدعم): ما التوازن؟\nالإجابة: قدرة الفرد على الاحتفاظ بمركز ثقل الجسم فوق قاعدة الارتكاز.\nس2 (المستوى المتوقع): ما الفرق بين التوازن الثابت والحركي؟\nالإجابة: الثابت في وضع ثابت، والحركي أثناء الحركة.\nس3 (المستوى المتقدم): اذكر عاملًا يؤثر في التوازن.\nالإجابة: اتساع قاعدة الارتكاز أو النظر لنقطة ثابتة.\n\nالحصة 4:\nس1 (مستوى الدعم): أين توضع باطن القدم الحرة في اختبار الوقوف على المشط؟\nالإجابة: على الجانب الداخلي لركبة رجل الارتكاز.\nس2 (المستوى المتوقع): ما مراحل اختبار Y؟\nالإجابة: الأمام، الخلف يسارًا، الخلف يمينًا.\nس3 (المستوى المتقدم): متى ينتهي اختبار الوقوف على المشط؟\nالإجابة: عند لمس العقب الأرض أو فقد التوازن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر عناصر اللياقة المرتبطة بالمهارة.\nالإجابة: السرعة، الرشاقة، التوازن، التوافق.\nس2 (المستوى المتوقع): أدِّ الجري السريع والتوقف المفاجئ ولمس القمع.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): لماذا تحتاج ألعاب المضرب إلى الرشاقة؟\nالإجابة: لتغطية الملعب والوصول السريع إلى الريشة.\n\nالحصة 2:\nس1 (مستوى الدعم): ما زمنك في اختبار T وما هدفك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي المراحل كانت الأبطأ ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): اقترح تمرينًا لتحسين زمنك.\nالإجابة: الجري الجانبي بين أقماع.\n\nالحصة 3:\nس1 (مستوى الدعم): صنف: الهبوط بثبات بعد الوثب العالي.\nالإجابة: توازن حركي.\nس2 (المستوى المتوقع): أدِّ الوقوف على قدم مع إغماض العينين 10 ثوانٍ.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف يسهم التوازن في الوقاية من الإصابات؟\nالإجابة: يمنع السقوط ويحفظ ثبات المفاصل.\n\nالحصة 4:\nس1 (مستوى الدعم): سجل نتيجتك في الاختبارين.\nالإجابة: يسجل.\nس2 (المستوى المتوقع): أي الاتجاهات كان الأصعب في اختبار Y ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): اقترح تمرينًا لتحسين توازنك.\nالإجابة: الوقوف على وسادة التوازن يوميًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الجري بين عوائق مع تغيير الاتجاه (دليل المعلم ص 53-55).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على اختبار T أسبوعيًا ومقارنة الزمن (دليل المعلم ص 54-60).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على الوقوف على قدم واحدة بعينين مغمضتين 15 ثانية يوميًا (دليل المعلم ص 56-57).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تمرينات التوازن اليومية، والاطلاع على سباق العدو 100 م (دليل المعلم ص 69-72)."}}, {"title": "ألعاب القوى (سباق العدو 100 م، ودفع الجلة 3 كجم بطريقة الزحف)", "unit": "الرياضات والألعاب الحركية (1)", "week": "السادس – السابع", "date": "11-15/10/2026 إلى 18-22/10/2026", "pages": "دليل المعلم ص 69-86", "n": 4, "periods": [{"focus": "سباق العدو 100 م: المراحل الفنية والبدء المنخفض بمكعبات البدء", "num": 1, "fields": {"المخرجات التعليمية": "1. يشرح طريقة أداء سباق العدو 100 م ومراحله الفنية.\n2. يؤدي البدء المنخفض على مكعبات البدء بأقسامه الثلاثة.\n3. يحدد القواعد القانونية للسباق (الحارة، البداية الخاطئة).", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تذكر", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- سباق العدو 100 م\n- البدء والانطلاق\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- إنهاء السباق", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم فيديو سباق 100 م ويسأل: كم مرحلة في السباق؟ ويقدم المراحل والقواعد (ص 70-72).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالعدو.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المراحل (البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق) ويؤدي البدء المنخفض على المكعبات (خذ مكانك، استعد، انطلق مع دفع المكعب بالقدم الخلفية ثم الأمامية) مع القواعد (الحارة، استبعاد البداية الخاطئة).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يعطي أحدهما الأوامر ويراقب الأخطاء ثم عدو 30 م، ويتبادلان.\n- الطالب: يتدرب ويراقب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة رد الفعل: انطلاق بإشارات من البدء المنخفض 15 م.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما مراحل سباق 100 م؟\nالإجابة: البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق.\nس2 (المستوى المتوقع): أي القدمين تدفع المكعب أولًا؟\nالإجابة: الخلفية ثم الأمامية.\nس3 (المستوى المتقدم): ما قرار الحكم عند البداية الخاطئة؟\nالإجابة: استبعاد المتسابق.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ البدء المنخفض على المكعبات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف ننهي السباق؟\nالإجابة: بميل الجذع للأمام عند خط النهاية دون إبطاء.\nس3 (المستوى المتقدم): ماذا يحدث عند خروج المتسابق من حارته؟\nالإجابة: يُستبعد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد سباق 100 م (دليل المعلم ص 70-72)."}}, {"focus": "تدريبات سباق العدو 100 م ومنافساته", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تدريبات تطوير مراحل السباق (الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق).\n2. يؤدي سباق العدو 100 م (أو مسافة أقل حسب المسار) بتطبيق القواعد.\n3. يبدي اهتمامًا بالمشاركة في السباق ويحدد هدفًا لتحسين زمنه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل", "المفاهيم": "- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المراحل ويسأل: كيف نحافظ على السرعة القصوى في الأمتار الأخيرة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات ص 76-78: العدو المتزايد 40 م، الجري بخطوات واسعة ثم سريعة، العدو 30 م من البدء المنخفض، إنهاء السباق بميل الجذع.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بميقاتي ومسجل: يعدو كل طالب 100 م (أو المسافة المتاحة) ويسجل زمنه.\n- الطالب: يعدو ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: تصفيات ونهائي بين المجموعات بحكام من الطلبة (ص 79).\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتحديد هدف شخصي.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الذي يحافظ على السرعة القصوى؟\nالإجابة: تزايد طول الخطوة وترددها وتحريك الذراعين توافقيًا.\nس2 (المستوى المتوقع): ما دور الميقاتي؟\nالإجابة: تسجيل زمن المتسابق.\nس3 (المستوى المتقدم): ماذا نفعل إذا لم يتوفر مسار 100 م؟\nالإجابة: ننفذ السباق بمسافة أقل.", "التقويم الختامي": "س1 (مستوى الدعم): ما زمنك وما هدفك خلال أسبوعين؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اذكر تدريبين لتطوير السرعة القصوى.\nالإجابة: العدو المتزايد والجري بخطوات واسعة.\nس3 (المستوى المتقدم): كيف تنظم مجموعتك سباقًا بأدوار؟\nالإجابة: حكم بداية وميقاتي ومسجل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريبات السرعة ومتابعة زمنه (دليل المعلم ص 76-79)."}}, {"focus": "دفع الجلة 3 كجم بطريقة الزحف: النواحي الفنية (الاستعداد، الزحف، الدفع، الاتزان)", "num": 3, "fields": {"المخرجات التعليمية": "1. يشرح النواحي الفنية لدفع الجلة بطريقة الزحف.\n2. يؤدي مسك الجلة ووضع الاستعداد والدفع من الثبات.\n3. يميز بين الدفع والرمي ويحدد القواعد القانونية.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- دفع الجلة\n- الزحف\n- دائرة الرمي\n- مقطع الرمي\n- الاتزان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة دافع الجلة ويسأل: لماذا يدور ظهره لمقطع الرمي؟ ويقدم النواحي الفنية (ص 73-75).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: دوران الذراعين، دفع الكرة الطبية.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم النواحي: الاستعداد (مواجهة مقطع الرمي بالظهر، حمل الجلة على أصابع اليد أسفل الذقن، الارتكاز باليمنى ومد اليسرى)، الزحف (الدفع بالرجل للخلف)، الدفع (لف الجذع ودوران مشط القدم ومد الذراع وخروج الجلة من الذقن)، الاتزان (تبديل الرجلين وعدم الخروج من الدائرة)، والقواعد، ثم نموذج الدفع من الثبات بالكرة الطبية.\n- الطالب: يقلد بالكرة الطبية.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 80-81: دفع الكرة الطبية من الثبات، دفع مع لف الجذع، دفع مع ثني ومد الركبتين، في مجموعات مع الأمان.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة دفع الكرة الطبية من الثبات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كم قطر دائرة الدفع؟\nالإجابة: 2.135 م.\nس2 (المستوى المتوقع): أين توضع الجلة في الاستعداد؟\nالإجابة: على أصابع اليد أسفل الذقن ملاصقة للرقبة.\nس3 (المستوى المتقدم): ما الفرق بين الدفع والرمي؟\nالإجابة: الدفع بمد الذراع من الكتف دون مرجحة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ دفع الكرة الطبية من الثبات بالنواحي الفنية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر قاعدتين من قواعد دفع الجلة.\nالإجابة: الدفع بيد واحدة، وعدم الخروج من الدائرة.\nس3 (المستوى المتقدم): لماذا يبدأ الدافع بظهره لمقطع الرمي؟\nالإجابة: ليستفيد من الزحف ولف الجذع لزيادة القوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في دفع الجلة (دليل المعلم ص 73-75)."}}, {"focus": "التدريبات التعليمية لطريقة الزحف ودفع الجلة الكامل", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي تدريبات الزحف (الزحف دون جلة، الزحف مع الدفع بالكرة الطبية).\n2. يؤدي دفع الجلة 3 كجم بطريقة الزحف من داخل الدائرة.\n3. يحلل الأخطاء الشائعة ويصححها.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: استمارات تسجيل", "المفاهيم": "- الزحف\n- الدفع\n- الاتزان\n- القياس", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم النواحي الفنية ويعرض تدريبات الزحف (ص 82-83).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات: الزحف من الوقوف على رجل واحدة للخلف دون جلة، الزحف ثم الدفع بالكرة الطبية، الدفع الكامل بالجلة من داخل الدائرة، مع الأمان (الدفع بالإشارة، الجمع بعد الجميع).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بحكم وقائس: يؤدي كل طالب الدفع الكامل محاولتين مع القياس، ويحلل القائد الأخطاء (رمي الجلة، الخروج من الدائرة).\n- الطالب: يدفع ويقيس ويحلل.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض المعلم أخطاء شائعة ويقترح الطلبة التصحيح.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الزحف في دفع الجلة؟\nالإجابة: الدفع بالرجل للخلف داخل الدائرة قبل الدفع.\nس2 (المستوى المتوقع): من أين تقاس المسافة؟\nالإجابة: من مكان سقوط الجلة إلى الحد الداخلي للدائرة.\nس3 (المستوى المتقدم): متى تحتسب المحاولة خاطئة؟\nالإجابة: عند الخروج من الدائرة أو رمي الجلة أو سقوطها خارج المقطع.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ دفع الجلة بطريقة الزحف من داخل الدائرة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): زميلك يرمي الجلة بمرجحة ذراعه، ما الخطأ؟\nالإجابة: يجب الدفع بمد الذراع لا الرمي.\nس3 (المستوى المتقدم): من أي جهة يغادر الدافع الدائرة؟\nالإجابة: من النصف الخلفي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة دفع الجلة وتحديد مراحلها."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يشرح طريقة أداء سباق العدو 100 م ومراحله الفنية.\n2. يؤدي البدء المنخفض على مكعبات البدء بأقسامه الثلاثة.\n3. يحدد القواعد القانونية للسباق (الحارة، البداية الخاطئة).\n\nالحصة 2:\n1. يؤدي تدريبات تطوير مراحل السباق (الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق).\n2. يؤدي سباق العدو 100 م (أو مسافة أقل حسب المسار) بتطبيق القواعد.\n3. يبدي اهتمامًا بالمشاركة في السباق ويحدد هدفًا لتحسين زمنه.\n\nالحصة 3:\n1. يشرح النواحي الفنية لدفع الجلة بطريقة الزحف.\n2. يؤدي مسك الجلة ووضع الاستعداد والدفع من الثبات.\n3. يميز بين الدفع والرمي ويحدد القواعد القانونية.\n\nالحصة 4:\n1. يؤدي تدريبات الزحف (الزحف دون جلة، الزحف مع الدفع بالكرة الطبية).\n2. يؤدي دفع الجلة 3 كجم بطريقة الزحف من داخل الدائرة.\n3. يحلل الأخطاء الشائعة ويصححها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تذكر\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 3:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n\nالحصة 3:\n- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 4:\n- أخرى: جلة 3 كجم\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- سباق العدو 100 م\n- البدء والانطلاق\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- إنهاء السباق\n\nالحصة 2:\n- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن\n\nالحصة 3:\n- دفع الجلة\n- الزحف\n- دائرة الرمي\n- مقطع الرمي\n- الاتزان\n\nالحصة 4:\n- الزحف\n- الدفع\n- الاتزان\n- القياس", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم فيديو سباق 100 م ويسأل: كم مرحلة في السباق؟ ويقدم المراحل والقواعد (ص 70-72).\n\nالحصة 2:\nيراجع المعلم المراحل ويسأل: كيف نحافظ على السرعة القصوى في الأمتار الأخيرة؟\n\nالحصة 3:\nيعرض المعلم صورة دافع الجلة ويسأل: لماذا يدور ظهره لمقطع الرمي؟ ويقدم النواحي الفنية (ص 73-75).\n\nالحصة 4:\nيراجع المعلم النواحي الفنية ويعرض تدريبات الزحف (ص 82-83).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالعدو.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المراحل (البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق) ويؤدي البدء المنخفض على المكعبات (خذ مكانك، استعد، انطلق مع دفع المكعب بالقدم الخلفية ثم الأمامية) مع القواعد (الحارة، استبعاد البداية الخاطئة).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يعطي أحدهما الأوامر ويراقب الأخطاء ثم عدو 30 م، ويتبادلان.\n- الطالب: يتدرب ويراقب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة رد الفعل: انطلاق بإشارات من البدء المنخفض 15 م.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات ص 76-78: العدو المتزايد 40 م، الجري بخطوات واسعة ثم سريعة، العدو 30 م من البدء المنخفض، إنهاء السباق بميل الجذع.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بميقاتي ومسجل: يعدو كل طالب 100 م (أو المسافة المتاحة) ويسجل زمنه.\n- الطالب: يعدو ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: تصفيات ونهائي بين المجموعات بحكام من الطلبة (ص 79).\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتحديد هدف شخصي.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: دوران الذراعين، دفع الكرة الطبية.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم النواحي: الاستعداد (مواجهة مقطع الرمي بالظهر، حمل الجلة على أصابع اليد أسفل الذقن، الارتكاز باليمنى ومد اليسرى)، الزحف (الدفع بالرجل للخلف)، الدفع (لف الجذع ودوران مشط القدم ومد الذراع وخروج الجلة من الذقن)، الاتزان (تبديل الرجلين وعدم الخروج من الدائرة)، والقواعد، ثم نموذج الدفع من الثبات بالكرة الطبية.\n- الطالب: يقلد بالكرة الطبية.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 80-81: دفع الكرة الطبية من الثبات، دفع مع لف الجذع، دفع مع ثني ومد الركبتين، في مجموعات مع الأمان.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة دفع الكرة الطبية من الثبات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات: الزحف من الوقوف على رجل واحدة للخلف دون جلة، الزحف ثم الدفع بالكرة الطبية، الدفع الكامل بالجلة من داخل الدائرة، مع الأمان (الدفع بالإشارة، الجمع بعد الجميع).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بحكم وقائس: يؤدي كل طالب الدفع الكامل محاولتين مع القياس، ويحلل القائد الأخطاء (رمي الجلة، الخروج من الدائرة).\n- الطالب: يدفع ويقيس ويحلل.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض المعلم أخطاء شائعة ويقترح الطلبة التصحيح.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما مراحل سباق 100 م؟\nالإجابة: البدء والانطلاق، الدفع وتزايد السرعة، السرعة القصوى، إنهاء السباق.\nس2 (المستوى المتوقع): أي القدمين تدفع المكعب أولًا؟\nالإجابة: الخلفية ثم الأمامية.\nس3 (المستوى المتقدم): ما قرار الحكم عند البداية الخاطئة؟\nالإجابة: استبعاد المتسابق.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الذي يحافظ على السرعة القصوى؟\nالإجابة: تزايد طول الخطوة وترددها وتحريك الذراعين توافقيًا.\nس2 (المستوى المتوقع): ما دور الميقاتي؟\nالإجابة: تسجيل زمن المتسابق.\nس3 (المستوى المتقدم): ماذا نفعل إذا لم يتوفر مسار 100 م؟\nالإجابة: ننفذ السباق بمسافة أقل.\n\nالحصة 3:\nس1 (مستوى الدعم): كم قطر دائرة الدفع؟\nالإجابة: 2.135 م.\nس2 (المستوى المتوقع): أين توضع الجلة في الاستعداد؟\nالإجابة: على أصابع اليد أسفل الذقن ملاصقة للرقبة.\nس3 (المستوى المتقدم): ما الفرق بين الدفع والرمي؟\nالإجابة: الدفع بمد الذراع من الكتف دون مرجحة.\n\nالحصة 4:\nس1 (مستوى الدعم): ما الزحف في دفع الجلة؟\nالإجابة: الدفع بالرجل للخلف داخل الدائرة قبل الدفع.\nس2 (المستوى المتوقع): من أين تقاس المسافة؟\nالإجابة: من مكان سقوط الجلة إلى الحد الداخلي للدائرة.\nس3 (المستوى المتقدم): متى تحتسب المحاولة خاطئة؟\nالإجابة: عند الخروج من الدائرة أو رمي الجلة أو سقوطها خارج المقطع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ البدء المنخفض على المكعبات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف ننهي السباق؟\nالإجابة: بميل الجذع للأمام عند خط النهاية دون إبطاء.\nس3 (المستوى المتقدم): ماذا يحدث عند خروج المتسابق من حارته؟\nالإجابة: يُستبعد.\n\nالحصة 2:\nس1 (مستوى الدعم): ما زمنك وما هدفك خلال أسبوعين؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اذكر تدريبين لتطوير السرعة القصوى.\nالإجابة: العدو المتزايد والجري بخطوات واسعة.\nس3 (المستوى المتقدم): كيف تنظم مجموعتك سباقًا بأدوار؟\nالإجابة: حكم بداية وميقاتي ومسجل.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ دفع الكرة الطبية من الثبات بالنواحي الفنية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر قاعدتين من قواعد دفع الجلة.\nالإجابة: الدفع بيد واحدة، وعدم الخروج من الدائرة.\nس3 (المستوى المتقدم): لماذا يبدأ الدافع بظهره لمقطع الرمي؟\nالإجابة: ليستفيد من الزحف ولف الجذع لزيادة القوة.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ دفع الجلة بطريقة الزحف من داخل الدائرة.\nالإجابة: يؤديه.\nس2 (ال ي": "س1 (مستوى الدعم): ما دور حكم البداية؟\nالإجابة: إعطاء الأوامر ورصد البداية الخاطئة.\nس2 (المستوى المتوقع): متى ينتهي احتساب الزمن؟\nالإجابة: بمرور الجذع خط النهاية.\nس3 (المستوى المتقدم): ما قرار الحكم إذا ارتكب متسابقان بداية خاطئة؟\nالإجابة: يستبعدان معًا.", "التقويم الختامي": "س1 (مستوى الدعم): ما زمنك اليوم مقارنة بالأسبوع السابع؟\nالإجابة: يقارن.\nس2 (المستوى المتوقع): اذكر قاعدتين طبقتهما في السباق.\nالإجابة: الجري في الحارة والانطلاق بعد الإشارة.\nس3 (المستوى المتقدم): ما دورك في تنظيم السباق؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة قواعد كرة القدم ومراكز اللاعبين (دليل المعلم ص 89-92)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يطبق القواعد القانونية لمسابقة دفع الجلة (3 محاولات، الدائرة، المقطع، المغادرة من النصف الخلفي).\n2. يشارك في تنظيم المسابقة بأدوار (حكم، قائس، مسجل).\n3. يحلل الحالات التحكيمية ويقرر.\n\nالحصة 2:\n1. يطبق القواعد القانونية لسباق 100 م في سباق منظم.\n2. يشارك في تنظيم السباق بأدوار (حكم بداية، ميقاتي، حكم نهاية).\n3. يبدي اهتمامًا بالمشاركة ويقيم تحسن زمنه.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: جلة 3 كجم\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: استمارات تسجيل\n\nالحصة 2:\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: أعلام\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- المسابقة\n- الحكم\n- القائس\n- الحالات التحكيمية\n\nالحصة 2:\n- السباق\n- حكم البداية\n- الميقاتي\n- الحارة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم قواعد دفع الجلة ويوزع الأدوار ويعرض نموذج استمارة التسجيل.\n\nالحصة 2:\nيراجع المعلم قواعد السباق ويوزع الأدوار ويعرض الحالات التحكيمية." .", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ دفع الجلة في المسابقة بتطبيق القواعد.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): متسابق لمس السطح العلوي لإطار الدائرة، ما القرار؟\nالإجابة: محاولة خاطئة.\nس3 (المستوى المتقدم): ما دورك في تنظيم المسابقة؟\nالإجابة: يذكر.\n\nالحصة 2:\nس1 (مستوى الدعم): ما زمنك اليوم مقارنة بالأسبوع السابع؟\nالإجابة: يقارن.\nس2 (المستوى المتوقع): اذكر قاعدتين طبقتهما في السباق.\nالإجابة: الجري في الحارة والانطلاق بعد الإشارة.\nس3 (المستوى المتقدم): ما دورك في تنظيم السباق؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على البحث عن قصة بطل في دفع الجلة.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مراجعة قواعد كرة القدم ومراكز اللاعبين (دليل المعلم ص 89-92)."}}, {"title": "لعبة كرة القدم", "unit": "الرياضات والألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 88-100", "n": 6, "periods": [{"focus": "طريقة اللعب والقواعد القانونية ومراكز اللاعبين وتمرينات الإحساس بالكرة", "num": 1, "fields": {"المخرجات التعليمية": "1. يشرح طريقة اللعب والقواعد القانونية (الشوطان، ركلة البداية، احتساب الهدف، لمس اليد).\n2. يميز مراكز اللاعبين في طريقة 4-4-2 وواجباتها.\n3. يؤدي تمرينات الإحساس بالكرة (تحريكها بوجه القدم الخارجي، سحبها بأسفل القدم، تثبيتها على الرأس).", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة القدم\n- ركلة البداية\n- مراكز اللاعبين\n- الإحساس بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم مخطط 4-4-2 ويسأل: ما واجب كل مركز في الهجوم والدفاع؟ ويشرح القواعد (ص 89، 92).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد (11 لاعبًا، شوطان 45 دقيقة، ركلة البداية، الهدف، لمس اليد) ومراكز اللاعبين، ويؤدي تمرينات الإحساس ص 94: تحريك الكرة بوجه القدم الخارجي، سحبها بأسفل القدم للخلف والجانبين، تثبيتها على الرأس، رميها لأعلى واستقبالها بوجه القدم، تنطيطها بالرأس.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الإحساس بالكرة بأربع مجموعات وفي كل محطة بطاقة مركز يشرحها القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المراكز): يرفع المعلم بطاقة مركز فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر ويذكرون واجبه.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كم مدة الشوط في كرة القدم؟\nالإجابة: 45 دقيقة.\nس2 (المستوى المتوقع): متى تنفذ ركلة البداية؟\nالإجابة: في بداية الشوطين وبعد تسجيل الأهداف.\nس3 (المستوى المتقدم): ما واجب لاعبي خط الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر مراكز طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (المستوى المتوقع): أدِّ تثبيت الكرة على الرأس 3 ثوانٍ.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): متى يحتسب الهدف؟\nالإجابة: عند تجاوز الكرة بكامل محيطها خط المرمى بين القائمين وتحت العارضة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الإحساس بالكرة يوميًا (دليل المعلم ص 89-94)."}}, {"focus": "التصويب (ركل الكرة بوجه القدم الخارجي)", "num": 2, "fields": {"المخرجات التعليمية": "1. يشرح النقاط الفنية لركل الكرة بوجه القدم الخارجي.\n2. يؤدي التصويب والتمرير بوجه القدم الخارجي من الثبات والحركة.\n3. يختار نوع الركل المناسب (أمامي، داخلي، خارجي) حسب الموقف.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- صورة توضيحية", "المفاهيم": "- وجه القدم الخارجي\n- التصويب\n- قدم الارتكاز\n- المتابعة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الركل بوجه القدم الأمامي والداخلي ويسأل: كيف نصوب بسرعة دون تغيير وضع الجسم؟ ويعرض الركل بوجه القدم الخارجي (ص 90).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وخلفها، مرجحة الرجل الراكلة للخلف، ميل الجذع للأمام والذراعان للتوازن، ركل الكرة بوجه القدم الخارجي مع امتداد القدم للمتابعة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 95: صفان متقابلان تبادل التمرير بوجه القدم الخارجي، قطاران الجري بالكرة ثم التصويب بوجه القدم الخارجي نحو المرمى، ثم التصويب من تمريرة زميل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويب من مسافة 14 م.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم الركل بوجه القدم الخارجي؟\nالإجابة: للتمرير والتصويب من المسافات المتوسطة والطويلة بسرعة.\nس2 (المستوى المتوقع): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وخلفها.\nس3 (المستوى المتقدم): لماذا تساعد الذراعان في الركل؟\nالإجابة: لحفظ التوازن.", "التقويم الختامي": "س1 (مستوى الدعم): صوب بوجه القدم الخارجي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة تمر بجانبك وتريد تمريرها سريعًا للجناح، أي وجه تستخدم؟\nالإجابة: وجه القدم الخارجي.\nس3 (المستوى المتقدم): ما الفرق بين الركل بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي أسرع وبدوران خارجي، والداخلي أدق للمسافات المتوسطة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التصويب بوجه القدم الخارجي على هدف (دليل المعلم ص 90-95)."}}, {"focus": "المحاورة من الجانب ومن الخلف", "num": 3, "fields": {"المخرجات التعليمية": "1. يشرح أنواع المحاورة من الجانب ومن الخلف واستخداماتها.\n2. يؤدي المحاورة من الجانب (مع منافس يجري بجواره) ومن الخلف (بالتمويه للجانب).\n3. يختار نوع المحاورة حسب موقع المدافع.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة", "المفاهيم": "- المحاورة من الجانب\n- المحاورة من الخلف\n- التمويه\n- المدافع", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المحاورة من الأمام ويسأل: ماذا لو كان المدافع بجواري أو خلفي؟ ويعرض النوعين (ص 91).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: المحاورة من الجانب (تغيير السرعة والاتجاه بعيدًا عن المدافع المجاور بوجه القدم البعيدة)، والمحاورة من الخلف بالتمويه للجانب (استلام الكرة ومراقب خلفي، حركة خداع للجانب ثم المرور في الاتجاه الآخر)، ثم تطبيق موجه مع مدافع سلبي.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 96: أزواج يجريان جنبًا إلى جنب ويحاور المهاجم، ثم ثلاثيات (ممرر، مهاجم، مدافع خلفي) مع التبادل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (1 ضد 1) من وضعيات مختلفة (جانب، خلف).\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم المحاورة من الجانب؟\nالإجابة: عندما يجري المنافس بجوارنا على خط واحد.\nس2 (المستوى المتوقع): متى نستخدم المحاورة من الخلف؟\nالإجابة: عندما تأتي الكرة والمدافع خلفنا.\nس3 (المستوى المتقدم): ما التمويه؟\nالإجابة: حركة خداعية للجانب قبل المرور في الاتجاه الآخر.", "التقويم الختامي": "س1 (مستوى الدعم): راوغ المدافع الذي يجري بجوارك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ المحاورة من الخلف بالتمويه للجانب.\nالإجابة: يؤديها.\nس3 (المستوى المتقدم): اذكر أنواع المحاورة الثلاثة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طالبك دور المدافع من الجانب ومن الخلف (دليل المعلم ص 91-96)."}}, {"focus": "ضرب الكرة بالرأس", "num": 4, "fields": {"المخرجات التعليمية": "1. يشرح النقاط الفنية لضرب الكرة بالرأس واستخداماته (التصويب، الإبعاد).\n2. يؤدي ضرب الكرة بالرأس من الثبات ومن الوثب بمقدمة الرأس.\n3. يطبق قواعد الأمان في ضرب الكرة بالرأس.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: مرمى\n- صورة توضيحية", "المفاهيم": "- ضرب الكرة بالرأس\n- مقدمة الرأس (الجبهة)\n- التوقيت\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم كرة خفيفة لطالب ويسأل: كيف نلعبها إذا كانت فوق مستوى الصدر دون اليدين؟ ويعرض ضرب الكرة بالرأس (ص 92).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: التحرك نحو الكرة والنظر إليها، ثني الجذع للخلف ثم للأمام لضرب الكرة بالجبهة (مقدمة الرأس) والعينان مفتوحتان، ثم من الوثب، مع الأمان (كرة خفيفة، عدم الضرب بأعلى الرأس).\n- الطالب: يقلد بالكرة الخفيفة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 94-95: رمي الكرة لأعلى وضربها بالجبهة من الثبات، أزواج يرمي أحدهما ويضرب الآخر نحوه، ثم نحو المرمى، ثم من الوثب.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويب بالرأس من رمية زميل.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء من الرأس نضرب الكرة؟\nالإجابة: بالجبهة (مقدمة الرأس).\nس2 (المستوى المتوقع): متى نستخدم ضرب الكرة بالرأس؟\nالإجابة: للتصويب في الهجوم وإبعاد الكرة في الدفاع.\nس3 (المستوى المتقدم): لماذا نبقي العينين مفتوحتين؟\nالإجابة: لتوجيه الكرة بدقة.", "التقويم الختامي": "س1 (مستوى الدعم): اضرب الكرة المرمية بالجبهة نحو زميلك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر قاعدة أمان في ضرب الكرة بالرأس.\nالإجابة: استخدام كرة خفيفة والضرب بالجبهة لا بأعلى الرأس.\nس3 (المستوى المتقدم): ما دور الجذع في ضرب الكرة بالرأس؟\nالإجابة: يعطي الضربة قوة بثنيه للخلف ثم للأمام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب بكرة خفيفة على ضرب الكرة بالجبهة (دليل المعلم ص 92-95)."}}, {"focus": "محطات مهارات كرة القدم ومنافساتها", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي الركل بوجه القدم الخارجي والمحاورة وضرب الكرة بالرأس في محطات.\n2. يوظف المهارات في منافسات مصغرة.\n3. يتعاون مع زملائه ويلتزم بالقواعد.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة\n- أخرى: سلم الرشاقة", "المفاهيم": "- المحطات\n- التصويب\n- المحاورة\n- ضرب الكرة بالرأس\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 97: التصويب بوجه القدم الخارجي، المحاورة من الجانب ضد مدافع، ضرب الكرة بالرأس من رمية، الإحساس بالكرة في سلم الرشاقة، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة 3 ضد 3 بمرميين صغيرين بشرط لمسة بالرأس قبل التصويب أو هدف مضاعف للرأس.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى نجحت المحاورة من الخلف؟ ليستنتج الطلبة أهمية التمويه والتوقيت.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب بوجه القدم الخارجي وضرب الكرة بالرأس.\nس2 (المستوى المتوقع): ما شرط التصويب في منافسة اليوم؟\nالإجابة: لمسة بالرأس قبله (أو هدف مضاعف للرأس).\nس3 (المستوى المتقدم): ما سر نجاح المحاورة من الخلف؟\nالإجابة: التمويه والتوقيت.", "التقويم الختامي": "س1 (مستوى الدعم): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أدِّ المحاورة من الجانب ثم التصويب بوجه القدم الخارجي.\nالإجابة: يؤديهما.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 97)."}}, {"focus": "مباراة كرة القدم وتطبيق القواعد ومراكز اللاعبين", "num": 6, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية في مباراة كرة القدم.\n2. يلعب في مركز محدد ويؤدي واجباته الهجومية والدفاعية.\n3. يتعاون مع زملائه أثناء المباراة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المباراة\n- المراكز\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد والمراكز ويقسم الفرق ويوزع المراكز ويعين حكامًا (حكم، مساعدان).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يخطط كل فريق مراكزه وطريقة لعبه.\n- الطالب: يخطط.\n\nالنشاط 3 (19 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 98-99: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تبديل المراكز.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش الطلبة: كيف أثر الالتزام بالمراكز في النتيجة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): ما واجب الظهير الأيمن؟\nالإجابة: منع هجمات الجناح الأيسر للمنافس ودعم الهجوم.\nس2 (المستوى المتوقع): ما دور الحكم المساعد؟\nالإجابة: مراقبة خروج الكرة والتسلل.\nس3 (المستوى المتقدم): لماذا نتبادل المراكز؟\nالإجابة: ليجرب الجميع الأدوار المختلفة.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: احتساب الهدف.\nس2 (المستوى المتوقع): ما المركز الذي لعبت فيه وواجبه؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عند قرار حكم ضد فريقك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، ومراجعة قواعد كرة السلة (دليل المعلم ص 110-112)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يشرح طريقة اللعب والقواعد القانونية (الشوطان، ركلة البداية، احتساب الهدف، لمس اليد).\n2. يميز مراكز اللاعبين في طريقة 4-4-2 وواجباتها.\n3. يؤدي تمرينات الإحساس بالكرة (تحريكها بوجه القدم الخارجي، سحبها بأسفل القدم، تثبيتها على الرأس).\n\nالحصة 2:\n1. يشرح النقاط الفنية لركل الكرة بوجه القدم الخارجي.\n2. يؤدي التصويب والتمرير بوجه القدم الخارجي من الثبات والحركة.\n3. يختار نوع الركل المناسب (أمامي، داخلي، خارجي) حسب الموقف.\n\nالحصة 3:\n1. يشرح أنواع المحاورة من الجانب ومن الخلف واستخداماتها.\n2. يؤدي المحاورة من الجانب (مع منافس يجري بجواره) ومن الخلف (بالتمويه للجانب).\n3. يختار نوع المحاورة حسب موقع المدافع.\n\nالحصة 4:\n1. يشرح النقاط الفنية لضرب الكرة بالرأس واستخداماته (التصويب، الإبعاد).\n2. يؤدي ضرب الكرة بالرأس من الثبات ومن الوثب بمقدمة الرأس.\n3. يطبق قواعد الأمان في ضرب الكرة بالرأس.\n\nالحصة 5:\n1. يؤدي الركل بوجه القدم الخارجي والمحاورة وضرب الكرة بالرأس في محطات.\n2. يوظف المهارات في منافسات مصغرة.\n3. يتعاون مع زملائه ويلتزم بالقواعد.\n\nالحصة 6:\n1. يطبق القواعد القانونية في مباراة كرة القدم.\n2. يلعب في مركز محدد ويؤدي واجباته الهجومية والدفاعية.\n3. يتعاون مع زملائه أثناء المباراة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: فهم\nا
