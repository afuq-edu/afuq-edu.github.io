 الأمامي والداخلي ويسأل: كيف نصوب بسرعة دون تغيير وضع الجسم؟ ويعرض الركل بوجه القدم الخارجي (ص 90).\n\nالحصة 3:\nيراجع المعلم المحاورة من الأمام ويسأل: ماذا لو كان المدافع بجواري أو خلفي؟ ويعرض النوعين (ص 91).\n\nالحصة 4:\nيرمي المعلم كرة خفيفة لطالب ويسأل: كيف نلعبها إذا كانت فوق مستوى الصدر دون اليدين؟ ويعرض ضرب الكرة بالرأس (ص 92).\n\nالحصة 5:\nيراجع المعلم المهارات ويعرض المحطات.\n\nالحصة 6:\nيراجع المعلم القواعد والمراكز ويقسم الفرق ويوزع المراكز ويعين حكامًا (حكم، مساعدان).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد (11 لاعبًا، شوطان 45 دقيقة، ركلة البداية، الهدف، لمس اليد) ومراكز اللاعبين، ويؤدي تمرينات الإحساس ص 94: تحريك الكرة بوجه القدم الخارجي، سحبها بأسفل القدم للخلف والجانبين، تثبيتها على الرأس، رميها لأعلى واستقبالها بوجه القدم، تنطيطها بالرأس.\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الإحساس بالكرة بأربع مجموعات وفي كل محطة بطاقة مركز يشرحها القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المراكز): يرفع المعلم بطاقة مركز فيتحرك طلبة المجموعة إلى مكانه في الملعب المصغر ويذكرون واجبه.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وخلفها، مرجحة الرجل الراكلة للخلف، ميل الجذع للأمام والذراعان للتوازن، ركل الكرة بوجه القدم الخارجي مع امتداد القدم للمتابعة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 95: صفان متقابلان تبادل التمرير بوجه القدم الخارجي، قطاران الجري بالكرة ثم التصويب بوجه القدم الخارجي نحو المرمى، ثم التصويب من تمريرة زميل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويب من مسافة 14 م.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: المحاورة من الجانب (تغيير السرعة والاتجاه بعيدًا عن المدافع المجاور بوجه القدم البعيدة)، والمحاورة من الخلف بالتمويه للجانب (استلام الكرة ومراقب خلفي، حركة خداع للجانب ثم المرور في الاتجاه الآخر)، ثم تطبيق موجه مع مدافع سلبي.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 96: أزواج يجريان جنبًا إلى جنب ويحاور المهاجم، ثم ثلاثيات (ممرر، مهاجم، مدافع خلفي) مع التبادل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (1 ضد 1) من وضعيات مختلفة (جانب، خلف).\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: التحرك نحو الكرة والنظر إليها، ثني الجذع للخلف ثم للأمام لضرب الكرة بالجبهة (مقدمة الرأس) والعينان مفتوحتان، ثم من الوثب، مع الأمان (كرة خفيفة، عدم الضرب بأعلى الرأس).\n- الطالب: يقلد بالكرة الخفيفة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 94-95: رمي الكرة لأعلى وضربها بالجبهة من الثبات، أزواج يرمي أحدهما ويضرب الآخر نحوه، ثم نحو المرمى، ثم من الوثب.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويب بالرأس من رمية زميل.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 97: التصويب بوجه القدم الخارجي، المحاورة من الجانب ضد مدافع، ضرب الكرة بالرأس من رمية، الإحساس بالكرة في سلم الرشاقة، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة 3 ضد 3 بمرميين صغيرين بشرط لمسة بالرأس قبل التصويب أو هدف مضاعف للرأس.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى نجحت المحاورة من الخلف؟ ليستنتج الطلبة أهمية التمويه والتوقيت.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 6:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يخطط كل فريق مراكزه وطريقة لعبه.\n- الطالب: يخطط.\n\nالنشاط 3 (19 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 98-99: مباريات 8 دقائق بالتبادل بحكام من الطلبة مع تبديل المراكز.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش الطلبة: كيف أثر الالتزام بالمراكز في النتيجة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كم مدة الشوط في كرة القدم؟\nالإجابة: 45 دقيقة.\nس2 (المستوى المتوقع): متى تنفذ ركلة البداية؟\nالإجابة: في بداية الشوطين وبعد تسجيل الأهداف.\nس3 (المستوى المتقدم): ما واجب لاعبي خط الوسط؟\nالإجابة: الربط بين الدفاع والهجوم.\n\nالحصة 2:\nس1 (مستوى الدعم): متى نستخدم الركل بوجه القدم الخارجي؟\nالإجابة: للتمرير والتصويب من المسافات المتوسطة والطويلة بسرعة.\nس2 (المستوى المتوقع): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وخلفها.\nس3 (المستوى المتقدم): لماذا تساعد الذراعان في الركل؟\nالإجابة: لحفظ التوازن.\n\nالحصة 3:\nس1 (مستوى الدعم): متى نستخدم المحاورة من الجانب؟\nالإجابة: عندما يجري المنافس بجوارنا على خط واحد.\nس2 (المستوى المتوقع): متى نستخدم المحاورة من الخلف؟\nالإجابة: عندما تأتي الكرة والمدافع خلفنا.\nس3 (المستوى المتقدم): ما التمويه؟\nالإجابة: حركة خداعية للجانب قبل المرور في الاتجاه الآخر.\n\nالحصة 4:\nس1 (مستوى الدعم): بأي جزء من الرأس نضرب الكرة؟\nالإجابة: بالجبهة (مقدمة الرأس).\nس2 (المستوى المتوقع): متى نستخدم ضرب الكرة بالرأس؟\nالإجابة: للتصويب في الهجوم وإبعاد الكرة في الدفاع.\nس3 (المستوى المتقدم): لماذا نبقي العينين مفتوحتين؟\nالإجابة: لتوجيه الكرة بدقة.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: التصويب بوجه القدم الخارجي وضرب الكرة بالرأس.\nس2 (المستوى المتوقع): ما شرط التصويب في منافسة اليوم؟\nالإجابة: لمسة بالرأس قبله (أو هدف مضاعف للرأس).\nس3 (المستوى المتقدم): ما سر نجاح المحاورة من الخلف؟\nالإجابة: التمويه والتوقيت.\n\nالحصة 6:\nس1 (مستوى الدعم): ما واجب الظهير الأيمن؟\nالإجابة: منع هجمات الجناح الأيسر للمنافس ودعم الهجوم.\nس2 (المستوى المتوقع): ما دور الحكم المساعد؟\nالإجابة: مراقبة خروج الكرة والتسلل.\nس3 (المستوى المتقدم): لماذا نتبادل المراكز؟\nالإجابة: ليجرب الجميع الأدوار المختلفة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر مراكز طريقة 4-4-2.\nالإجابة: حارس، 4 دفاع، 4 وسط، 2 هجوم.\nس2 (المستوى المتوقع): أدِّ تثبيت الكرة على الرأس 3 ثوانٍ.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): متى يحتسب الهدف؟\nالإجابة: عند تجاوز الكرة بكامل محيطها خط المرمى بين القائمين وتحت العارضة.\n\nالحصة 2:\nس1 (مستوى الدعم): صوب بوجه القدم الخارجي نحو المرمى من الجري بالكرة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة تمر بجانبك وتريد تمريرها سريعًا للجناح، أي وجه تستخدم؟\nالإجابة: وجه القدم الخارجي.\nس3 (المستوى المتقدم): ما الفرق بين الركل بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي أسرع وبدوران خارجي، والداخلي أدق للمسافات المتوسطة.\n\nالحصة 3:\nس1 (مستوى الدعم): راوغ المدافع الذي يجري بجوارك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ المحاورة من الخلف بالتمويه للجانب.\nالإجابة: يؤديها.\nس3 (المستوى المتقدم): اذكر أنواع المحاورة الثلاثة.\nالإجابة: من الأمام ومن الجانب ومن الخلف.\n\nالحصة 4:\nس1 (مستوى الدعم): اضرب الكرة المرمية بالجبهة نحو زميلك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر قاعدة أمان في ضرب الكرة بالرأس.\nالإجابة: استخدام كرة خفيفة والضرب بالجبهة لا بأعلى الرأس.\nس3 (المستوى المتقدم): ما دور الجذع في ضرب الكرة بالرأس؟\nالإجابة: يعطي الضربة قوة بثنيه للخلف ثم للأمام.\n\nالحصة 5:\nس1 (مستوى الدعم): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أدِّ المحاورة من الجانب ثم التصويب بوجه القدم الخارجي.\nالإجابة: يؤديهما.\n\nالحصة 6:\nس1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: احتساب الهدف.\nس2 (المستوى المتوقع): ما المركز الذي لعبت فيه وواجبه؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عند قرار حكم ضد فريقك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات الإحساس بالكرة يوميًا (دليل المعلم ص 89-94).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التصويب بوجه القدم الخارجي على هدف (دليل المعلم ص 90-95).\n\nالحصة 3:\nإرشاد لولي الأمر: العب مع طالبك دور المدافع من الجانب ومن الخلف (دليل المعلم ص 91-96).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على التدرب بكرة خفيفة على ضرب الكرة بالجبهة (دليل المعلم ص 92-95).\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على التدرب على مهارته الأضعف (دليل المعلم ص 97).\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على متابعة مباراة وتحديد مراكز اللاعبين، ومراجعة قواعد كرة السلة (دليل المعلم ص 110-112)."}}, {"title": "لعبة كرة السلة", "unit": "الرياضات والألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 110-123", "n": 4, "periods": [{"focus": "القواعد القانونية والتمرير بعد التنطيط", "num": 1, "fields": {"المخرجات التعليمية": "1. يشرح طريقة اللعب والقواعد القانونية (5 لاعبين، 4 فترات، كرة القفز، النقاط، رمية الإدخال).\n2. يؤدي التمرير بعد التنطيط مباشرة دون توقف.\n3. يميز متى يستخدم التمرير بعد التنطيط.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة السلة\n- كرة القفز\n- رمية الإدخال\n- التمرير بعد التنطيط", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة كرة القفز ويسأل: كيف تبدأ المباراة؟ ويشرح القواعد (ص 111-112) ويقدم التمرير بعد التنطيط (ص 113).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد (الفترات 10 دقائق، كرة القفز، النقاط 1/2/3، رمية الإدخال، التبديل)، ويؤدي نموذج التمرير بعد التنطيط (التحرك بالتنطيط والنظر للزميل، مسك الكرة وتمريرها مباشرة بعد التنطيط دون توقف).\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: قطاران متقابلان تنطيط ثم تمرير مباشر للقطار المقابل، ثم مع مدافع في المنتصف.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك) بشرط التمرير بعد التنطيط.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كم فترة في مباراة كرة السلة؟\nالإجابة: 4 فترات مدة كل منها 10 دقائق.\nس2 (المستوى المتوقع): كم نقطة للتصويب من خارج قوس النقاط الثلاث؟\nالإجابة: ثلاث نقاط.\nس3 (المستوى المتقدم): لماذا نمرر بعد التنطيط مباشرة؟\nالإجابة: لخداع المنافس وتجنب قطع التمريرة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التمرير بعد التنطيط لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): من أين تؤدى رمية الإدخال؟\nالإجابة: من المكان الذي يحدده الحكم الأقرب للخطأ أو خروج الكرة.\nس3 (المستوى المتقدم): متى تعد الكرة خارج الملعب؟\nالإجابة: إذا لمست الأرض خارج الحدود أو لمسها لاعب متصل بالأرض خارجها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب التنطيط ثم التمرير على الحائط (دليل المعلم ص 111-113)."}}, {"focus": "التوقف (بعدة واحدة وبعدتين) والارتكاز", "num": 2, "fields": {"المخرجات التعليمية": "1. يشرح طريقتي التوقف واستخدامهما.\n2. يؤدي التوقف بعدة واحدة (بالوثب) وبعدتين بعد التحرك بالكرة.\n3. يطبق قاعدة الارتكاز بعد كل نوع من التوقف.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- التوقف بعدة واحدة\n- التوقف بعدتين\n- الارتكاز\n- امتصاص السرعة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الارتكاز ويسأل: كيف نتوقف فجأة بالكرة دون مخالفة المشي؟ ويعرض طريقتي التوقف (ص 114).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: التوقف بعدة واحدة (الهبوط بالقدمين معًا مع ثني الركبتين وميل الجذع لامتصاص السرعة، ويجوز الارتكاز على أي قدم)، والتوقف بعدتين (الهبوط على قدم ثم الأخرى، والارتكاز على القدم الأولى)، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: تنطيط ثم التوقف بعدة واحدة بالإشارة ثم الارتكاز والتمرير، ثم التوقف بعدتين، في قطارات.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الإشارة): تنطيط وعند الصافرة توقف بالطريقة التي يناديها المعلم.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم التوقف بعدة واحدة؟\nالإجابة: عند استلام الكرات العالية أو المرتدة.\nس2 (المستوى المتوقع): على أي قدم نرتكز بعد التوقف بعدتين؟\nالإجابة: على القدم الأولى.\nس3 (المستوى المتقدم): لماذا نثني الركبتين عند التوقف؟\nالإجابة: لامتصاص سرعة الجري.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التوقف بعدة واحدة ثم الارتكاز.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين طريقتي التوقف؟\nالإجابة: بعدة واحدة بالقدمين معًا، وبعدتين قدم ثم الأخرى.\nس3 (المستوى المتقدم): ما هدف التوقف في المباراة؟\nالإجابة: التحرر من المدافع أو التصويب أو الاستلام.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التنطيط والتوقف بالطريقتين (دليل المعلم ص 114)."}}, {"focus": "المحاورة مع تغيير الاتجاه والتصويبة السلمية", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي المحاورة مع تغيير الاتجاه بتبديل اليدين للتخلص من المنافس.\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام قرب السلة.\n3. يحلل الأخطاء الشائعة ويصححها.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- المحاورة مع تغيير الاتجاه\n- التصويبة السلمية\n- الخطوتان\n- اللوحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التصويبة السلمية من الصف السابع ويسأل: كيف نربطها بالمحاورة لتجاوز مدافع؟ (ص 115).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: المحاورة مع تغيير الاتجاه بتبديل اليدين أمام المدافع ثم خطوتان وارتقاء وتصويب على اللوحة، من الجانبين، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 119: قطارات المحاورة بين الأقماع ثم التصويبة السلمية، ثم مع مدافع سلبي، ويعد القائد الإصابات ويصحح.\n- الطالب: يتدرب ويصحح.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة تتابع التصويبة السلمية بعد المحاورة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نغير الاتجاه في المحاورة؟\nالإجابة: بتبديل اليدين أمام الجسم.\nس2 (المستوى المتوقع): كم خطوة في التصويبة السلمية؟\nالإجابة: خطوتان.\nس3 (المستوى المتقدم): متى نستخدم التصويبة السلمية؟\nالإجابة: من المسافات القصيرة بعد المحاورة أو الاستلام قرب السلة.", "التقويم الختامي": "س1 (مستوى الدعم): حاور مع تغيير الاتجاه ثم أدِّ التصويبة السلمية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): زميلك يصوب دون النظر إلى اللوحة، ما الخطأ؟\nالإجابة: يجب النظر إلى اللوحة والتصويب عليها.\nس3 (المستوى المتقدم): لماذا نرفع الركبة عند الارتقاء؟\nالإجابة: لزيادة الارتفاع والاتزان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب المحاورة والتصويبة السلمية (دليل المعلم ص 115-119)."}}, {"focus": "محطات مهارات كرة السلة ومباراة تطبيقية", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي التمرير بعد التنطيط والتوقف والمحاورة والتصويبة السلمية في محطات.\n2. يطبق القواعد القانونية في مباراة.\n3. يتعاون مع زملائه بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المحطات\n- المباراة\n- كرة القفز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات والقواعد ويعرض المحطات وتنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 120: التمرير بعد التنطيط مع مدافع، التوقف بعدة واحدة وبعدتين والارتكاز، المحاورة والتصويبة السلمية، التصويب من الثبات، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة ص 121: 5 ضد 5 تبدأ بكرة القفز بحكام من الطلبة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش الطلبة: متى استخدمتم التوقف بعدة واحدة في المباراة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): كيف بدأت المباراة؟\nالإجابة: بكرة القفز.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: التوقف والارتكاز، والمحاورة والتصويبة السلمية.\nس3 (المستوى المتقدم): متى استخدمت التمرير بعد التنطيط؟\nالإجابة: عند وجود مدافع يحاول قطع التمريرة.", "التقويم الختامي": "س1 (مستوى الدعم): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اذكر قاعدة طبقتها.\nالإجابة: مثل: رمية الإدخال.\nس3 (المستوى المتقدم): كيف تصرفت مع قرار الحكم؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يشرح طريقة اللعب والقواعد القانونية (5 لاعبين، 4 فترات، كرة القفز، النقاط، رمية الإدخال).\n2. يؤدي التمرير بعد التنطيط مباشرة دون توقف.\n3. يميز متى يستخدم التمرير بعد التنطيط.\n\nالحصة 2:\n1. يشرح طريقتي التوقف واستخدامهما.\n2. يؤدي التوقف بعدة واحدة (بالوثب) وبعدتين بعد التحرك بالكرة.\n3. يطبق قاعدة الارتكاز بعد كل نوع من التوقف.\n\nالحصة 3:\n1. يؤدي المحاورة مع تغيير الاتجاه بتبديل اليدين للتخلص من المنافس.\n2. يؤدي التصويبة السلمية بعد المحاورة وبعد الاستلام قرب السلة.\n3. يحلل الأخطاء الشائعة ويصححها.\n\nالحصة 4:\n1. يؤدي التمرير بعد التنطيط والتوقف والمحاورة والتصويبة السلمية في محطات.\n2. يطبق القواعد القانونية في مباراة.\n3. يتعاون مع زملائه بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة السلة\n- كرة القفز\n- رمية الإدخال\n- التمرير بعد التنطيط\n\nالحصة 2:\n- التوقف بعدة واحدة\n- التوقف بعدتين\n- الارتكاز\n- امتصاص السرعة\n\nالحصة 3:\n- المحاورة مع تغيير الاتجاه\n- التصويبة السلمية\n- الخطوتان\n- اللوحة\n\nالحصة 4:\n- المحطات\n- المباراة\n- كرة القفز\n- التحكيم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة كرة القفز ويسأل: كيف تبدأ المباراة؟ ويشرح القواعد (ص 111-112) ويقدم التمرير بعد التنطيط (ص 113).\n\nالحصة 2:\nيراجع المعلم الارتكاز ويسأل: كيف نتوقف فجأة بالكرة دون مخالفة المشي؟ ويعرض طريقتي التوقف (ص 114).\n\nالحصة 3:\nيراجع المعلم التصويبة السلمية من الصف السابع ويسأل: كيف نربطها بالمحاورة لتجاوز مدافع؟ (ص 115).\n\nالحصة 4:\nيراجع المعلم المهارات والقواعد ويعرض المحطات وتنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القواعد (الفترات 10 دقائق، كرة القفز، النقاط 1/2/3، رمية الإدخال، التبديل)، ويؤدي نموذج التمرير بعد التنطيط (التحرك بالتنطيط والنظر للزميل، مسك الكرة وتمريرها مباشرة بعد التنطيط دون توقف).\n- الطالب: يستمع ويقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: قطاران متقابلان تنطيط ثم تمرير مباشر للقطار المقابل، ثم مع مدافع في المنتصف.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك) بشرط التمرير بعد التنطيط.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: التوقف بعدة واحدة (الهبوط بالقدمين معًا مع ثني الركبتين وميل الجذع لامتصاص السرعة، ويجوز الارتكاز على أي قدم)، والتوقف بعدتين (الهبوط على قدم ثم الأخرى، والارتكاز على القدم الأولى)، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: تنطيط ثم التوقف بعدة واحدة بالإشارة ثم الارتكاز والتمرير، ثم التوقف بعدتين، في قطارات.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الإشارة): تنطيط وعند الصافرة توقف بالطريقة التي يناديها المعلم.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: المحاورة مع تغيير الاتجاه بتبديل اليدين أمام المدافع ثم خطوتان وارتقاء وتصويب على اللوحة، من الجانبين، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 119: قطارات المحاورة بين الأقماع ثم التصويبة السلمية، ثم مع مدافع سلبي، ويعد القائد الإصابات ويصحح.\n- الطالب: يتدرب ويصحح.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة تتابع التصويبة السلمية بعد المحاورة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 120: التمرير بعد التنطيط مع مدافع، التوقف بعدة واحدة وبعدتين والارتكاز، المحاورة والتصويبة السلمية، التصويب من الثبات، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة ص 121: 5 ضد 5 تبدأ بكرة القفز بحكام من الطلبة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش الطلبة: متى استخدمتم التوقف بعدة واحدة في المباراة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كم فترة في مباراة كرة السلة؟\nالإجابة: 4 فترات مدة كل منها 10 دقائق.\nس2 (المستوى المتوقع): كم نقطة للتصويب من خارج قوس النقاط الثلاث؟\nالإجابة: ثلاث نقاط.\nس3 (المستوى المتقدم): لماذا نمرر بعد التنطيط مباشرة؟\nالإجابة: لخداع المنافس وتجنب قطع التمريرة.\n\nالحصة 2:\nس1 (مستوى الدعم): متى نستخدم التوقف بعدة واحدة؟\nالإجابة: عند استلام الكرات العالية أو المرتدة.\nس2 (المستوى المتوقع): على أي قدم نرتكز بعد التوقف بعدتين؟\nالإجابة: على القدم الأولى.\nس3 (المستوى المتقدم): لماذا نثني الركبتين عند التوقف؟\nالإجابة: لامتصاص سرعة الجري.\n\nالحصة 3:\nس1 (مستوى الدعم): كيف نغير الاتجاه في المحاورة؟\nالإجابة: بتبديل اليدين أمام الجسم.\nس2 (المستوى المتوقع): كم خطوة في التصويبة السلمية؟\nالإجابة: خطوتان.\nس3 (المستوى المتقدم): متى نستخدم التصويبة السلمية؟\nالإجابة: من المسافات القصيرة بعد المحاورة أو الاستلام قرب السلة.\n\nالحصة 4:\nس1 (مستوى الدعم): كيف بدأت المباراة؟\nالإجابة: بكرة القفز.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: التوقف والارتكاز، والمحاورة والتصويبة السلمية.\nس3 (المستوى المتقدم): متى استخدمت التمرير بعد التنطيط؟\nالإجابة: عند وجود مدافع يحاول قطع التمريرة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ التمرير بعد التنطيط لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): من أين تؤدى رمية الإدخال؟\nالإجابة: من المكان الذي يحدده الحكم الأقرب للخطأ أو خروج الكرة.\nس3 (المستوى المتقدم): متى تعد الكرة خارج الملعب؟\nالإجابة: إذا لمست الأرض خارج الحدود أو لمسها لاعب متصل بالأرض خارجها.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ التوقف بعدة واحدة ثم الارتكاز.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين طريقتي التوقف؟\nالإجابة: بعدة واحدة بالقدمين معًا، وبعدتين قدم ثم الأخرى.\nس3 (المستوى المتقدم): ما هدف التوقف في المباراة؟\nالإجابة: التحرر من المدافع أو التصويب أو الاستلام.\n\nالحصة 3:\nس1 (مستوى الدعم): حاور مع تغيير الاتجاه ثم أدِّ التصويبة السلمية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): زميلك يصوب دون النظر إلى اللوحة، ما الخطأ؟\nالإجابة: يجب النظر إلى اللوحة والتصويب عليها.\nس3 (المستوى المتقدم): لماذا نرفع الركبة عند الارتقاء؟\nالإجابة: لزيادة الارتفاع والاتزان.\n\nالحصة 4:\nس1 (مستوى الدعم): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): اذكر قاعدة طبقتها.\nالإجابة: مثل: رمية الإدخال.\nس3 (المستوى المتقدم): كيف تصرفت مع قرار الحكم؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تدريب التنطيط ثم التمرير على الحائط (دليل المعلم ص 111-113).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التنطيط والتوقف بالطريقتين (دليل المعلم ص 114).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تدريب المحاورة والتصويبة السلمية (دليل المعلم ص 115-119).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على مراجعة مهارات ألعاب القوى وكرة القدم وكرة السلة قبل الاختبار العملي (2)."}}, {"title": "الاختبار العملي (2)", "unit": "تقويم", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 69-123 (الرياضات والألعاب الحركية 1)", "n": 2, "periods": [{"focus": "اختبار عملي في كرة القدم ودفع الجلة", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي التصويب بوجه القدم الخارجي والمحاورة من الجانب والخلف وضرب الكرة بالرأس.\n2. يؤدي دفع الجلة بطريقة الزحف بالقواعد.\n3. يطبق القواعد القانونية في مواقف مصغرة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: جلة 3 كجم\n- أخرى: أقماع\n- أخرى: مرمى\n- أخرى: شريط قياس\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- الاخ const FIELDS = ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ في وحدة الرياضات والألعاب الحركية (1) اختير: ألعاب القوى (6 حصص) + كرة القدم (6 حصص) + كرة السلة (4 حصص) = 16 حصة، مع الاختبار العملي (1) في الأسبوع الثامن.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
