:root{--c1:#2563eb;--c2:#7c3aed;--bg:#f4f6fb;--card:#ffffff;--ink:#1d2433;--mute:#667085;--line:#e3e8f0;--soft:#eef2ff;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b;--sh:0 4px 18px rgba(20,30,60,.08);--fs:1}
:root[data-theme="dark"]{--bg:#0f1420;--card:#18202f;--ink:#e8edf6;--mute:#9aa6bb;--line:#2a3447;--soft:#1f2a3d;--sh:0 4px 18px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--bg:#0f1420;--card:#18202f;--ink:#e8edf6;--mute:#9aa6bb;--line:#2a3447;--soft:#1f2a3d;--sh:0 4px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(17px * var(--fs))}
body{overflow-x:hidden;margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--c1)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* header */
.top{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top .wrap{display:flex;align-items:center;gap:10px}
.top h1{font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{background:rgba(255,255,255,.18);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:1.15rem;display:grid;place-items:center;flex:none}
.pts{background:rgba(255,255,255,.2);border-radius:20px;padding:2px 12px;font-size:.85rem;white-space:nowrap}
/* install bar */
#inst{display:none;background:#fff8e1;color:#5d4300;border-bottom:1px solid #f3d27a}
#inst .wrap{display:flex;align-items:center;gap:8px;padding-top:8px;padding-bottom:8px;font-size:.9rem}
#inst b{flex:1}
#inst button{border:0;border-radius:10px;padding:6px 14px;background:#f59e0b;color:#fff;font-weight:700}
#inst .x{background:transparent;color:#5d4300;padding:6px 8px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:.72rem;padding:2px 0;border-radius:12px}
.nav a i{display:block;font-style:normal;font-size:1.35rem;line-height:1.3}
.nav a.on{color:var(--c1);font-weight:700;background:var(--soft)}
main{min-width:0;max-width:100%;padding:16px 0 24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:1.25rem;margin:.2em 0 .6em}
h3{font-size:1.05rem;margin:.2em 0 .4em}
.card{overflow-x:auto;overflow-wrap:anywhere;max-width:100%;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--line)}
.mute{color:var(--mute);font-size:.88rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:0;border-radius:14px;padding:10px 18px;background:var(--c1);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gold{background:var(--gold)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:11px}
.chip{display:inline-block;background:var(--soft);border-radius:20px;padding:2px 12px;font-size:.8rem;margin:2px;border:1px solid var(--line)}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
textarea{min-height:90px}
/* hero */
.hero{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--sh);margin-bottom:16px}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;inset:-50px auto auto -30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .big{font-size:2.6rem;line-height:1}
.hero h2{margin:.3em 0 .1em;font-size:1.35rem}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stats3 div{background:rgba(255,255,255,.18);border-radius:14px;padding:6px;text-align:center;font-size:.8rem}
.stats3 b{display:block;font-size:1.15rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,45%),1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--sh);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile i{font-style:normal;font-size:2rem;display:block}
.tile b{display:block;margin-top:4px}
.tile small{color:var(--mute);font-size:.75rem}
/* units */
.unit{border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--line)}
.unit>summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary .n{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:12px;min-width:38px;height:38px;display:grid;place-items:center;font-size:.9rem}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:9px}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lrow:hover{background:var(--soft)}
.lrow .ic{font-size:1.3rem;width:30px;text-align:center}
.lrow .t{flex:1}
.done{color:var(--ok);font-weight:700}
/* lesson */
.lhead{display:flex;gap:12px;align-items:flex-start}
.lhead .ic{font-size:2.3rem;line-height:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:60px;z-index:5;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:.88rem}
.tabs button.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.idea{background:linear-gradient(135deg,var(--soft),var(--card));border-right:5px solid var(--c1);border-radius:14px;padding:12px 14px;font-size:1.02rem}
.sec h3{color:var(--c1);display:flex;gap:8px;align-items:center}
.sec h3:before{content:"";width:8px;height:22px;border-radius:4px;background:linear-gradient(var(--c1),var(--c2))}
ul.pts{margin:0;padding:0 1.2em 0 0}
ol{list-style:arabic-indic;padding-right:1.4em}
ul.pts li{margin:.25em 0}
.q,.ch,li,.voc div,.idea,.flip .f,.flip .b,.explain,.slot,.match button,.mem button,.lrow .t{unicode-bidi:plaintext}
.box{background:var(--soft);border:1px dashed var(--c1);border-radius:12px;padding:8px 12px;margin-top:8px;overflow-x:auto}
.ex{border-right:4px solid var(--gold)}
.ex .a{background:#ecfdf3;color:#065f46;border-radius:10px;padding:6px 12px;margin-top:8px;display:inline-block}
:root[data-theme="dark"] .ex .a{background:#063d2a;color:#b9f5d0}
.tip{border-right:4px solid var(--ok)}
.mis{border-right:4px solid var(--bad)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.voc{overflow-x:auto;overflow-wrap:anywhere;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.voc b{color:var(--c1);display:block;font-size:1.05rem}
.visual{text-align:center;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
table.tb{border-collapse:collapse;margin:6px auto;background:var(--card)}
table.tb td,table.tb th{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.tb th{background:var(--soft)}
table.tb td.hl{background:#fff3c4;color:#000}
.cap{text-align:center;font-size:.85rem;color:var(--mute)}
/* math markup */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 .12em;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span{padding:0 .2em}
.fr.nb>span:first-child{border-bottom:0}
.sq{white-space:nowrap}.ov{border-top:1.5px solid currentColor;padding-top:1px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mx{display:inline-block;vertical-align:middle;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:8px;padding:0 4px;margin:0 3px}
.mx.det{border-radius:0}.mx table{border-collapse:collapse}.mx td{padding:0 6px;text-align:center}.mx td.bar{border-right:1.5px solid currentColor}
sup,sub{font-size:.7em}
/* flip cards */
.flip{perspective:1000px;height:260px;cursor:pointer;margin:10px auto;max-width:520px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center;box-shadow:var(--sh);overflow:auto}
.flip .f{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:1.4rem;font-weight:700}
.flip .b{background:var(--card);border:2px solid var(--c1);transform:rotateY(180deg);font-size:1.1rem}
/* quiz */
.q{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.ch{display:block;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:1.02rem;transition:all .15s}
.ch:hover{border-color:var(--c1)}
.ch.ok{background:#dcfce7;border-color:var(--ok);color:#064e3b}
.ch.bad{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
.ch:disabled{cursor:default}
.prog{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:6px}
.timer{font-weight:700;color:var(--c1)}
.explain{background:var(--soft);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.92rem}
.score{font-size:3rem;font-weight:700;text-align:center;color:var(--c1);line-height:1.2}
.blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--c1);margin:0 4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.06)}}
/* games */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mem button{min-height:100px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:1.6rem;box-shadow:var(--sh);padding:8px;transition:transform .2s}
.mem button.open{background:var(--card);color:var(--ink);font-size:.95rem;border:2px solid var(--c1)}
.mem button.got{background:#dcfce7;color:#064e3b;border:2px solid var(--ok);font-size:.95rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{display:block;width:100%;min-height:54px;margin-bottom:8px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:8px}
.match button.sel{border-color:var(--c1);background:var(--soft)}
.match button.got{border-color:var(--ok);background:#dcfce7;color:#064e3b;opacity:.75}
.tiles2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tiles2 button{width:52px;height:56px;border-radius:12px;border:0;font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:var(--sh)}
.tiles2 button:disabled{opacity:.25}
.slot{min-height:60px;border:2px dashed var(--c1);border-radius:14px;display:flex;justify-content:center;align-items:center;font-size:1.8rem;font-weight:700;letter-spacing:6px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tf button{font-size:1.4rem;padding:16px;border-radius:18px;border:0;color:#fff;font-weight:700}
/* duel */
.duel{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
.duel .half{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 16px;gap:6px;overflow:auto}
.duel .p2{transform:rotate(180deg);background:linear-gradient(135deg,rgba(124,58,237,.12),transparent)}
.duel .p1{background:linear-gradient(135deg,rgba(14,165,233,.12),transparent)}
.duel .mid{height:46px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;font-weight:700}
.duel .ch{margin:4px 0;padding:8px 12px}
.duel .lock{opacity:.4;pointer-events:none}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.team button{border:0;border-radius:16px;padding:14px;color:#fff;font-weight:700;font-size:1.05rem}
.team b{display:block;font-size:2rem}
/* misc */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:14px;z-index:99;font-size:.92rem;box-shadow:var(--sh);animation:fade .2s;max-width:90vw;text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.badge i{font-style:normal;font-size:2rem;display:block}
.badge.off{filter:grayscale(1);opacity:.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:560px;border-radius:22px 22px 0 0;margin:0;max-height:85vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
mark{background:#fff3a3;color:#000;border-radius:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.qday{border:2px solid var(--gold)}
#print{display:none}
@media print{
 body{background:#fff;color:#000;padding:0}
 .top,.nav,#inst,.tabs,.noprint,.toast{display:none!important}
 .card{box-shadow:none;break-inside:avoid;border:1px solid #ccc}
 body.printing main{display:none}
 body.printing #print{display:block}
 .flip{display:none}
}
@media (min-width:760px){.nav{max-width:760px;margin:0 auto;border-radius:20px 20px 0 0;border:1px solid var(--line)}}
</style>

ة على الرسم."],"box":""},{"h":"إنشاء مثلث أطوال أضلاعه معلومة","items":["ارسم الضلع الأكبر أولًا (القاعدة).","افتح الفرجار بطول الضلع الثاني وارسم قوسًا من أحد طرفي القاعدة.","افتح الفرجار بطول الضلع الثالث وارسم قوسًا من الطرف الآخر.","نقطة تقاطع القوسين هي الرأس الثالث؛ صِل بينها وبين الطرفين."],"box":""},{"h":"تنصيف زاوية","items":["ضع رأس الفرجار على رأس الزاوية وارسم قوسًا يقطع الضلعين.","من نقطتي التقاطع ارسم قوسين متقاطعين (بنفس الفتحة).","صِل الرأس بنقطة تقاطع القوسين ⇐ منصّف الزاوية."],"box":""},{"h":"المنصّف العمودي لقطعة مستقيمة","items":["افتح الفرجار بأكثر من نصف طول القطعة.","من كل طرف ارسم قوسين: أحدهما فوق القطعة والآخر تحتها.","صِل نقطتي تقاطع الأقواس ⇐ خط يعامد القطعة وينصّفها."],"box":""},{"h":"مضلعات منتظمة داخل دائرة","items":["<b>السداسي:<\/b> بفتحة نصف القطر نقسم المحيط إلى ٦ أقواس ونصل النقاط.","<b>المثلث المتطابق الأضلاع:<\/b> نصل كل نقطتين غير متتاليتين من نقاط السداسي.","<b>المربع:<\/b> نرسم قطرًا ومنصفه العمودي ونصل النقاط الأربع.","<b>الثماني:<\/b> ننصّف الزوايا القائمة عند المركز للمربع ثم نصل النقاط الثماني."],"box":""},{"h":"قواعد مهمة","items":["لا تمسح أقواس الإنشاء؛ فهي دليل على الطريقة","فتحة الفرجار تبقى ثابتة في خطوات التنصيف","ضلع السداسي المنتظم = نصف قطر الدائرة"],"box":""}],"visuals":[],"examples":[{"q":"ارسم المثلث أ ب ج: أب = ٥ سم ، ب ج = ٦ سم ، ج أ = ٤ سم","steps":["ارسم ب ج = ٦ سم (الأطول)","قوس من ب بفتحة ٥ سم، وقوس من ج بفتحة ٤ سم","تقاطعهما هو أ؛ صِل أب و أج"],"a":"مثلث مرسوم بدقة مع ظهور الأقواس"}],"tips":[],"mistakes":["تغيير فتحة الفرجار أثناء رسم قوسين يجب أن يتساويا.","فتحة أقل من نصف القطعة عند رسم المنصف العمودي فلا تتقاطع الأقواس.","مسح الأقواس بعد الإنشاء."],"check":[["أداة رسم الأقواس؟","الفرجار"],["ضلع السداسي المنتظم يساوي؟","نصف القطر"]],"review":[{"t":"الأدوات","items":["المسطرة للخطوط","الفرجار للأقواس والأطوال"]},{"t":"قطعة بطول معلوم","items":["افتح الفرجار بالطول","ارسم قوسًا على الخط"]},{"t":"المثلث","items":["ارسم الضلع الأكبر","قوسان بطولي الضلعين","تقاطعهما الرأس الثالث"]},{"t":"تنصيف الزاوية","i <script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const APP = D.app, LS = D.lessons, LM = {};
LS.forEach((l, i) => { l._i = i; LM[l.id] = l; });
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AD = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AD[d]);
const lat = s => String(s).replace(/[٠-٩]/g, d => AD.indexOf(d));
const tmp = document.createElement('div');
const plain = h => { tmp.innerHTML = h; return (tmp.textContent || '').replace(/\s+/g, ' ').trim(); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const uniqBy = (a, f) => { const s = new Set(); return a.filter(x => { const k = f(x); if (s.has(k)) return false; s.add(k); return true; }); };

/* ---------- storage ---------- */
const KEY = 'tatbiq_' + APP.id;
let ST = { name: '', done: {}, fav: {}, notes: {}, scores: [], best: {}, points: 0, streak: { last: '', n: 0 }, known: {}, theme: 'auto', fs: 1, sound: true, rate: 0.9, last: '', badges: {}, quizzes: 0 };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) ST = Object.assign(ST, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} };
function applyPrefs() {
  const r = document.documentElement;
  if (ST.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', ST.theme);
  r.style.setProperty('--fs', ST.fs);
  $('#pts').textContent = '⭐ ' + ar(ST.points);
}
(function streak() {
  const d = new Date(), today = d.toISOString().slice(0, 10);

function runQuiz(el, o) {
  // o: {ids, n, title, timer(sec total), tag, onEnd, mode:'exam'|'practice'}
  let pool = mixPool(poolFor(o.ids), o.n);
  const tf = o.withTF ? shuffle(tfFor(o.ids)).slice(0, Math.round(o.n * .25)) : [];
  let qs = pool.slice(0, o.n - tf.length).concat(tf.map(t => ({ q: 'صح أم خطأ؟<br>' + t.s, choices: ['✔ صح', '✘ خطأ'], answer: t.ok ? 0 : 1, explain: t.fix ? 'الصواب: ' + t.fix : '', lid: t.lid, kind: 'tf' })));
  qs = shuffle(qs);
  if (!qs.length) { el.innerHTML = '<div class="card mute">لا توجد أسئلة كافية لهذا الجزء بعد.</div>'; return; }
  let i = 0, right = 0, wrong = [], t0 = Date.now(), left = o.timer || 0, tick;
  const fin = () => {
    clearInterval(tick);
    const pc = Math.round(right / qs.length * 100);
    const lab = pc >= 90 ? 'ممتاز 🌟' : pc >= 75 ? 'جيد جدًا 👏' : pc >= 60 ? 'جيد 👍' : pc >= 50 ? 'مقبول 🙂' : 'تحتاج إلى مراجعة 💪';
    ST.scores.push({ tag: o.tag || '', t: o.title, s: right, n: qs.length, d: Date.now() }); if (ST.scores.length > 200) ST.scores.shift();
    ST.quizzes++; if (pc === 100) ST.badges.perfect = 1; if (o.exam) ST.badges.exam = 1;
    addPts(right * 5); save(); if (pc >= 75) { confetti(); beep(true); }
    el.innerHTML = `<div class="card" style="text-align:center"><h3>${esc(o.title)}</h3><div class="score">${ar(right)} / ${ar(qs.length)}</div><div style="font-size:1.3rem;font-weight:700">${lab}</div><div class="mute">النسبة ${ar(pc)}٪ · الوقت ${ar(Math.round((Date.now() - t0) / 1000))} ثانية · +${ar(right * 5)} نقطة</div>
     <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="again">🔁 أعد المحاولة</button></div></div>
     ${wrong.length ? `<h3>📌 راجع أخطاءك</h3>` + wrong.map(w => `<div class="card mis"><div class="q" style="font-size:1rem">${w.q.q}</div><div>❌ إجابتك: ${w.q.choices[w.c] || '—'}</div><div>✅ الصحيح: ${w.q.choices[w.q.answer]}</div>${w.q.explain ? `<div class="explain">${w.q.explain}</div>` : ''}${w.q.lid && LM[w.q.lid] ? `<a class="mute" href="#lesson/${encodeURIComponent(w.q.lid)}">📖 راجع درس ${ar(w.q.lid)}</a>` : ''}</div>`).join('') : ''}`;
    $('#again').onclick = () => runQuiz(el, o);
    o.onEnd && o.onEnd(right, qs.length);
  };
  const draw = () => {
    if (i >= qs.length) return fin();
    const q = qs[i];
    el.innerHTML = `<div class="card"><div class="prog"><span>سؤال ${ar(i + 1)} من ${ar(qs.length)}</span>${o.timer ? `<span class="timer" id="tm"></span>` : `<span>✔ ${ar(right)}</span>`}</div><div class="bar" style="margin-bottom:12px"><i style="width:${i / qs.length * 100}%"></i></div>
     <div class="q">${q.q}</div><div id="chs">${q.choices.map((c, k) => `<button class="ch" data-k="${k}">${c}</button>`).join('')}</div><div id="fb"></div></div>`;
    el.querySelectorAll('.ch').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.answer;
      el.querySelectorAll('.ch').forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add('ok'); });
      if (ok) { right++; b.classList.add('pop'); beep(true); } else { b.classList.add('bad', 'shake'); wrong.push({ q, c: k }); beep(false); vibrate(80); }
      const fb = el.querySelector('#fb');
      fb.innerHTML = `${!ok && q.explain && !o.exam ? `<div class="explain">${q.explain}</div>` : ''}<div style="text-align:center;margin-top:10px"><button class="btn" id="nx">${i + 1 < qs.length ? 'التالي ←' : 'النتيجة 🏁'}</button></div>`;
      el.querySelector('#nx').onclick = () => { i++; draw(); };
    });
    if (o.timer) showT();
  };
  const showT = () => { const e = el.querySelector('#tm'); if (e) e.textContent = '⏱ ' + ar(Math.floor(left / 60)) + ':' + ar(String(left % 60).padStart(2, '0')); };
  if (o.timer) { tick = setInterval(() => { left--; showT(); if (left <= 0) { toast('انتهى الوقت ⏰'); i = qs.length; draw(); } }, 1000); CLEAN = () => clearInterval(tick); }
  draw();
}

function rapid(el, getQ, o) {
  let score = 0, lives = o.lives || 0, left = o.time || 0, tick, qi = 0, q;
  const end = () => {

  let h = sheetHead('ورقة عمل: ' + esc(scopeName(scope.startsWith('l:') ? scope : scope)));
  if (V2.length >= 3) { const R = shuffle(V2.map((v, i) => ({ m: v[1], i }))); h += `<h3>أولًا: صِل كل مصطلح بمعناه</h3><table class="tb" style="width:100%"><tr><th>المصطلح</th><th></th><th>المعنى</th></tr>${V2.map((v, i) => `<tr><td>${ar(i + 1)}) ${v[0]}</td><td style="width:60px"></td><td>${'أبجدهوزح'[i]}) ${R[i].m}</td></tr>`).join('')}</table>`; }
  if (C.length) h += `<h3>ثانيًا: أجب عن الأسئلة الآتية</h3><ol>${C.map(c => `<li style="margin-bottom:14px">${c[0]}<br>.................................................................</li>`).join('')}</ol>`;
  if (pool.length) h += `<h3>ثالثًا: اختر الإجابة الصحيحة</h3><ol>${pool.map(q => `<li style="margin-bottom:10px">${q.q}<div style="display:flex;flex-wrap:wrap;gap:18px">${q.choices.map((c, k) => `<span>${'أبجد'[k]}) ${c}</span>`).join('')}</div></li>`).join('')}</ol>`;
  h += `<div style="break-before:page"></div><h3>🔑 الإجابات</h3>`;
  if (V2.length >= 3) { const R2 = shuffle(V2.map((v, i) => i)); }
  if (C.length) h += `<p><b>ثانيًا:</b> ${C.map((c, i) => ar(i + 1) + ') ' + c[1]).join(' — ')}</p>`;
  if (pool.length) h += `<p><b>ثالثًا:</b> ${pool.map((q, i) => ar(i + 1) + ') ' + 'أبجد'[q.answer]).join('، ')}</p>`;
  printHTML(h);
}
function printExam(scope) {
  const ids = scopeIds(scope); const pool = mixPool(poolFor(ids), 20).slice(0, 20); const tf = shuffle(tfFor(ids)).slice(0, 8);
  let h = sheetHead('امتحان: ' + esc(scopeName(scope)));
  h += `<h3>السؤال الأول: اختر الإجابة الصحيحة</h3><ol>${pool.map(q => `<li style="margin-bottom:10px">${q.q}<div style="display:flex;flex-wrap:wrap;gap:18px">${q.choices.map((c, k) => `<span>${'أبجد'[k]}) ${c}</span>`).join('')}</div></li>`).join('')}</ol>`;
  if (tf.length) h += `<h3>السؤال الثاني: ضع علامة (✓) أمام العبارة الصحيحة وعلامة (✗) أمام الخاطئة</h3><ol>${tf.map(t => `<li style="margin-bottom:8px">( &nbsp;&nbsp; ) ${t.s}</li>`).join('')}</ol>`;
  h += `<div style="break-before:page"></div><h3>🔑 نموذج الإجابة</h3><p><b>الأول:</b> ${pool.map((q, i) => ar(i + 1) + ') ' + 'أبجد'[q.answer]).join('، ')}</p>${tf.length ? `<p><b>الثاني:</b> ${tf.map((t, i) => ar(i + 1) + ') ' + (t.ok ? '✓' : '✗')).join('، ')}</p>` : ''}`;
  printHTML(h);
}

/* ---------- achievements ---------- */
const BADGES = [
  ['first', '🌱', 'أول درس', () => doneCount() >= 1], ['five', '📗', '٥ دروس', () => doneCount() >= 5], ['half', '🚀', 'نصف المنهج', () => doneCount() >= LS.length / 2],
  ['all', '👑', 'المنهج كاملًا', () => doneCount() >= LS.length], ['perfect', '💯', 'درجة كاملة', () => ST.badges.perfect], ['exam', '🎓', 'اختبار تجريبي', () => ST.badges.exam],
  ['s3', '🔥', '٣ أيام متتالية', () => ST.streak.n >= 3], ['s7', '🌟', 'أسبوع متواصل', () => ST.streak.n >= 7], ['p500', '⭐', '٥٠٠ نقطة', () => ST.points >= 500],
  ['p2000', '🏆', '٢٠٠٠ نقطة', () => ST.points >= 2000], ['memory', '🧠', 'بطل الذاكرة', () => ST.badges.memory], ['duel', '🤝', 'المتحدي', () => ST.badges.duel],
  ['cards', '🃏', '٥٠ بطاقة محفوظة', () => Object.keys(ST.known).length >= 50], ['q10', '📝', '١٠ اختبارات', () => ST.quizzes >= 10]
];
function checkBadges() { BADGES.forEach(b => { if (!ST.badges['b_' + b[0]] && b[3]()) { ST.badges['b_' + b[0]] = 1; save(); setTimeout(() => { toast(`🏅 وسام جديد: ${b[1]} ${b[2]}`, 3000); confetti(); }, 400); } }); }
V.me = () => {
  const sc = ST.scores, avg = sc.length ? Math.round(sc.reduce((a, s) => a + s.s / s.n, 0) / sc.length * 100) : 0;
  set(`<h2>🏅 إنجازاتي</h2><div class="hero"><div class="stats3" style="margin:0"><div><b>${ar(doneCount())}</b>درس منجز</div><div><b>${ar(ST.quizzes)}</b>اختبار</div><div><b>${ar(avg)}٪</b>متوسط الدرجات</div><div><b>⭐ ${ar(ST.points)}</b>نقطة</div><div><b>🔥 ${ar(ST.streak.n)}</b>أيام متتالية</div><div><b>${ar(Object.keys(ST.known).length)}</b>بطاقة محفوظة</div></div></div>
  <div class="card"><h3>الأوسمة</h3><div class="badges">${BADGES.map(b => `<div class="badge ${b[3]() ? '' : 'off'}"><i>${b[1]}</i>${b[2]}</div>`).join('')}</div></div>
  <div class="card"><h3>تقدّمك في الوحدات</h3>${UNITS.map(u => { const d = u.ids.filter(id => ST.done[id]).length; return `<div style="margin:8px 0"><div class="row"><span class="grow">${u.name}</span><span class="mute">${ar(d)}/${ar(u.ids.length)}</span></div><div class="bar"><i style="width:${d / u.ids.length * 100}%"></i></div></div>`; }).join('')}</div>
  <div class="card"><h3>الأرقام القياسية</h3><div>⚡ تحدي الدقيقة: <b>${ar(ST.best.minute || 0)}</b></div><div>❤️ تحدي البقاء: <b>${ar(ST.best.survive || 0)}</b></div>${APP.isMath ? `<div>🧮 الحساب الذهني: <b>${ar(ST.best.mental || 0)}</b></div>` : ''}</div>`);
};
V.settings = () => {
  set(`<h2>⚙️ الإعدادات</h2>
  <div class="card"><h3>👤 اسمك</h3><input type="text" id="nm" value="${esc(ST.name)}" placeholder="اكتب اسمك ليظهر في الترحيب"></div>
  <div class="card"><h3>🎨 المظهر</h3><div class="row">${[['auto', '🌓 تلقائي'], ['light', '☀️ فاتح'], ['dark', '🌙 داكن']].map(t => `<button class="btn sm ${ST.theme === t[0] ? '' : 'sec'}" onclick="A.theme('${t[0]}')">${t[1]}</button>`).join('')}</div>
   <h3 style="margin-top:14px">🔠 حجم الخط</h3><input type="range" id="fs" min="0.85" max="1.35" step="0.05" value="${ST.fs}" style="width:100%"></div>
  <div class="card"><h3>🔈 الأصوات</h3><label class="row"><input type="checkbox" id="snd" ${ST.sound ? 'checked' : ''}> مؤثرات صوتية قصيرة عند الإجابة (بدون موسيقى)</label>
   <h3 style="margin-top:14px">🗣️ سرعة القراءة الصوتية</h3><input type="range" id="rt" min="0.6" max="1.3" step="0.1" value="${ST.rate}" style="width:100%"></div>
  <div class="card"><h3>📲 تثبيت التطبيق</h3><p class="mute">ثبّت التطبيق ليظهر بين تطبيقات جهازك ويعمل بدون إنترنت.</p><button class="btn" onclick="A.install()">طريقة التثبيت</button></div>
  <div class="card"><h3>💾 بياناتي</h3><p class="mute">يُحفظ تقدمك على هذا الجهاز فقط.</p><div class="row"><button class="btn sec" onclick="A.exportP()">⬇️ حفظ نسخة من تقدمي</button><label class="btn sec">⬆️ استرجاع نسخة<input type="file" id="imp" accept=".json" hidden></label><button class="btn bad" onclick="A.reset()">🗑️ مسح التقدم</button></div></div>
  <div class="card mute">${esc(APP.subject)} · ${esc(APP.grade)} · ${esc(APP.term)}<br>المحتوى مبني على كتب سلطنة عُمان للفصل الدراسي الأول. صُمم التطبيق ليكون آمنًا للطلاب: بلا موسيقى، وبلا صور غير لائقة، وبلا إعلانات أو إنترنت.</div>`);
  $('#nm').oninput = e => { ST.name = e.target.value.trim(); save(); };
  $('#fs').oninput = e => { ST.fs = +e.target.value; save(); applyPrefs(); };
  $('#rt').oninput = e => { ST.rate = +e.target.value; save(); };
  $('#snd').onchange = e => { ST.sound = e.target.checked; save(); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { ST = Object.assign(ST, JSON.parse(t)); save(); applyPrefs(); toast('تم استرجاع التقدم ✔'); } catch (x) { toast('الملف غير صالح'); } }); };
};

/* ---------- install (PWA) ---------- */
let DEFER = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER = e; showInst(); });
window.addEventListener('appinstalled', () => { $('#inst').style.display = 'none'; toast('تم تثبيت التطبيق ✔'); });
function showInst() { let hid = false; try { hid = sessionStorage.getItem('instHide'); } catch (e) {} if (!standalone() && !hid) $('#inst').style.display = 'block'; }
function installHelp() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), file = location.protocol === 'file:';
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div class="card"><h3>📲 تثبيت التطبيق</h3>${file ? `<p>أنت تفتح التطبيق كملف من جهازك، وهو يعمل كاملًا بدون إنترنت هكذا. لتثبيته كأيقونة بين التطبيقات يجب فتحه من رابط ويب (مثلًا بعد رفع المجلد على موقع مجاني)، ثم:</p>` : ''}
   ${ios ? `<ol><li>اضغط زر المشاركة <b>⬆️</b> في أسفل متصفح سفاري.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.</li><li>اضغط <b>«إضافة»</b>.</li></ol>` :
     `<ol><li><b>أندرويد (كروم):</b> افتح القائمة <b>⋮</b> ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</li><li><b>آيفون وآيباد (سفاري):</b> زر المشاركة <b>⬆️</b> ثم «إضافة إلى الشاشة الرئيسية».</li><li><b>الكمبيوتر (كروم أو إيدج):</b> اضغط أيقونة التثبيت ⊕ في شريط العنوان.</li></ol>`}
   <div style="text-align:center"><button class="btn" onclick="this.closest('.sheet').remove()">حسنًا</button></div></div>`;
  s.onclick = e => { if (e.target === s) s.remove(); }; document.body.appendChild(s);
}
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- actions ---------- */
window.A = {
  go, install() { if (DEFER) { DEFER.prompt(); DEFER.userChoice.finally(() => DEFER = null); } else installHelp(); },
  hideInst() { $('#inst').style.display = 'none'; try { sessionStorage.setItem('instHide', 1); } catch (e) {} },
  tab(id, t) { history.replaceState(null, '', '#lesson/' + encodeURIComponent(id) + '|' + t); document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes("'" + t + "'"))); renderTab(LM[id], t); },
  toggleDone(id) { ST.done[id] = !ST.done[id]; if (ST.done[id]) { addPts(20); beep(true); toast('أحسنت! +٢٠ نقطة ⭐'); } save(); checkBadges(); route(); },
  fav(id) { ST.fav[id] = !ST.fav[id]; save(); toast(ST.fav[id] ? 'أضيف إلى المفضلة ⭐' : 'أزيل من المفضلة'); route(); },
  read() { speak(plain($('#lc').innerHTML)); },
  say(b) { speak(plain(b.closest('.voc').innerText)); },
  qday(i, b) { const q = A._qd; document.querySelectorAll('#qd .ch').forEach((x, k) => { x.disabled = true; if (k === q.answer) x.classList.add('ok'); }); if (i === q.answer) { addPts(10); beep(true); toast('إجابة صحيحة! +١٠ ⭐'); } else { b.classList.add('bad'); beep(false); } },
  quiz(sel, n, t, ex) { go('quiz/' + $('#' + sel).value + '~' + n + '~' + t + '~' + (ex || 0)); },
  printExam(sel) { printExam($('#' + sel).value); },
  worksheet(scope) { worksheet(scope.startsWith('l:') || scope.startsWith('u:') || scope === 'all' || scope === 'done' ? scope : 'l:' + scope); },
  minute(sel) { go('minute/' + $('#' + sel).value); }, survive(sel) { go('survive/' + $('#' + sel).value); }, mental() { go('mental'); },
  duel(sel) { duel(scopeIds($('#' + sel).value)); }, teams(sel) { go('teams/' + $('#' + sel).value + '~' + $('#tn').value); },
  game(g) { go(g + '/' + (ST.gscope || 'all')); },
  resetKnown(scope) { scopeIds(scope).forEach(id => Object.keys(ST.known).forEach(k => k.startsWith(id + '|') && delete ST.known[k])); save(); route(); },
  theme(t) { ST.theme = t; save(); applyPrefs(); route(); },
  exportP() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(ST)], { type: 'application/json' })); a.download = 'تقدمي_' + APP.id + '.json'; a.click(); },
  reset() { const s = document.createElement('div'); s.className = 'sheet'; s.innerHTML = `<div class="card"><h3>مسح كل التقدم؟</h3><p>ستُحذف النقاط والدروس المنجزة والنتائج والملاحظات من هذا الجهاز.</p><div class="row"><button class="btn bad" id="yy">نعم، امسح</button><button class="btn sec" onclick="this.closest('.sheet').remove()">إلغاء</button></div></div>`; document.body.appendChild(s); s.querySelector('#yy').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.hash = ''; location.reload(); }; }
};
window.addEventListener('hashchange', route);
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
applyPrefs(); route(); showInst();
if (location.protocol === 'file:' || /iphone|ipad|ipod/i.test(navigator.userAgent)) setTimeout(showInst, 800);
</script>
</body>
</html>
