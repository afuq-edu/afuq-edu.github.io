:root{--c1:#b45309;--c2:#dc2626;--bg:#f4f6fb;--card:#ffffff;--ink:#1d2433;--mute:#667085;--line:#e3e8f0;--soft:#eef2ff;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b;--sh:0 4px 18px rgba(20,30,60,.08);--fs:1}
:root[data-theme="dark"]{--bg:#0f1420;--card:#18202f;--ink:#e8edf6;--mute:#9aa6bb;--line:#2a3447;--soft:#1f2a3d;--sh:0 4px 18px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--bg:#0f1420;--card:#18202f;--ink:#e8edf6;--mute:#9aa6bb;--line:#2a3447;--soft:#1f2a3d;--sh:0 4px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(17px * var(--fs))}
body{overflow-x:hidden;margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--c1)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* header */
.top{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top .wrap{display:flex;align-items:center;gap:10px}
.top h1{font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{background:rgba(255,255,255,.18);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:1.15rem;display:grid;place-items:center;flex:none}
.pts{background:rgba(255,255,255,.2);border-radius:20px;padding:2px 12px;font-size:.85rem;white-space:nowrap}
/* install bar */
#inst{display:none;background:#fff8e1;color:#5d4300;border-bottom:1px solid #f3d27a}
#inst .wrap{display:flex;align-items:center;gap:8px;padding-top:8px;padding-bottom:8px;font-size:.9rem}
#inst b{flex:1}
#inst button{border:0;border-radius:10px;padding:6px 14px;background:#f59e0b;color:#fff;font-weight:700}
#inst .x{background:transparent;color:#5d4300;padding:6px 8px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:.72rem;padding:2px 0;border-radius:12px}
.nav a i{display:block;font-style:normal;font-size:1.35rem;line-height:1.3}
.nav a.on{color:var(--c1);font-weight:700;background:var(--soft)}
main{min-width:0;max-width:100%;padding:16px 0 24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:1.25rem;margin:.2em 0 .6em}
h3{font-size:1.05rem;margin:.2em 0 .4em}
.card{overflow-x:auto;overflow-wrap:anywhere;max-width:100%;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--line)}
.mute{color:var(--mute);font-size:.88rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:0;border-radius:14px;padding:10px 18px;background:var(--c1);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gold{background:var(--gold)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:11px}
.chip{display:inline-block;background:var(--soft);border-radius:20px;padding:2px 12px;font-size:.8rem;margin:2px;border:1px solid var(--line)}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
textarea{min-height:90px}
/* hero */
.hero{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--sh);margin-bottom:16px}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;inset:-50px auto auto -30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .big{font-size:2.6rem;line-height:1}
.hero h2{margin:.3em 0 .1em;font-size:1.35rem}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stats3 div{background:rgba(255,255,255,.18);border-radius:14px;padding:6px;text-align:center;font-size:.8rem}
.stats3 b{display:block;font-size:1.15rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,45%),1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--sh);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile i{font-style:normal;font-size:2rem;display:block}
.tile b{display:block;margin-top:4px}
.tile small{color:var(--mute);font-size:.75rem}
/* units */
.unit{border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--line)}
.unit>summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary .n{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:12px;min-width:38px;height:38px;display:grid;place-items:center;font-size:.9rem}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:9px}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lrow:hover{background:var(--soft)}
.lrow .ic{font-size:1.3rem;width:30px;text-align:center}
.lrow .t{flex:1}
.done{color:var(--ok);font-weight:700}
/* lesson */
.lhead{display:flex;gap:12px;align-items:flex-start}
.lhead .ic{font-size:2.3rem;line-height:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:60px;z-index:5;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:.88rem}
.tabs button.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.idea{background:linear-gradient(135deg,var(--soft),var(--card));border-right:5px solid var(--c1);border-radius:14px;padding:12px 14px;font-size:1.02rem}
.sec h3{color:var(--c1);display:flex;gap:8px;align-items:center}
.sec h3:before{content:"";width:8px;height:22px;border-radius:4px;background:linear-gradient(var(--c1),var(--c2))}
ul.pts{margin:0;padding:0 1.2em 0 0}
ol{list-style:arabic-indic;padding-right:1.4em}
ul.pts li{margin:.25em 0}
.q,.ch,li,.voc div,.idea,.flip .f,.flip .b,.explain,.slot,.match button,.mem button,.lrow .t{unicode-bidi:plaintext}
.box{background:var(--soft);border:1px dashed var(--c1);border-radius:12px;padding:8px 12px;margin-top:8px;overflow-x:auto}
.ex{border-right:4px solid var(--gold)}
.ex .a{background:#ecfdf3;color:#065f46;border-radius:10px;padding:6px 12px;margin-top:8px;display:inline-block}
:root[data-theme="dark"] .ex .a{background:#063d2a;color:#b9f5d0}
.tip{border-right:4px solid var(--ok)}
.mis{border-right:4px solid var(--bad)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.voc{overflow-x:auto;overflow-wrap:anywhere;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.voc b{color:var(--c1);display:block;font-size:1.05rem}
.visual{text-align:center;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
table.tb{border-collapse:collapse;margin:6px auto;background:var(--card)}
table.tb td,table.tb th{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.tb th{background:var(--soft)}
table.tb td.hl{background:#fff3c4;color:#000}
.cap{text-align:center;font-size:.85rem;color:var(--mute)}
/* math markup */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 .12em;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span{padding:0 .2em}
.fr.nb>span:first-child{border-bottom:0}
.sq{white-space:nowrap}.ov{border-top:1.5px solid currentColor;padding-top:1px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mx{display:inline-block;vertical-align:middle;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:8px;padding:0 4px;margin:0 3px}
.mx.det{border-radius:0}.mx table{border-collapse:collapse}.mx td{padding:0 6px;text-align:center}.mx td.bar{border-right:1.5px solid currentColor}
sup,sub{font-size:.7em}
/* flip cards */
.flip{perspective:1000px;height:260px;cursor:pointer;margin:10px auto;max-width:520px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center;box-shadow:var(--sh);overflow:auto}
.flip .f{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:1.4rem;font-weight:700}
.flip .b{background:var(--card);border:2px solid var(--c1);transform:rotateY(180deg);font-size:1.1rem}
/* quiz */
.q{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.ch{display:block;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:1.02rem;transition:all .15s}
.ch:hover{border-color:var(--c1)}
.ch.ok{background:#dcfce7;border-color:var(--ok);color:#064e3b}
.ch.bad{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
.ch:disabled{cursor:default}
.prog{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:6px}
.timer{font-weight:700;color:var(--c1)}
.explain{background:var(--soft);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.92rem}
.score{font-size:3rem;font-weight:700;text-align:center;color:var(--c1);line-height:1.2}
.blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--c1);margin:0 4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.06)}}
/* games */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mem button{min-height:100px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:1.6rem;box-shadow:var(--sh);padding:8px;transition:transform .2s}
.mem button.open{background:var(--card);color:var(--ink);font-size:.95rem;border:2px solid var(--c1)}
.mem button.got{background:#dcfce7;color:#064e3b;border:2px solid var(--ok);font-size:.95rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{display:block;width:100%;min-height:54px;margin-bottom:8px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:8px}
.match button.sel{border-color:var(--c1);background:var(--soft)}
.match button.got{border-color:var(--ok);background:#dcfce7;color:#064e3b;opacity:.75}
.tiles2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tiles2 button{width:52px;height:56px;border-radius:12px;border:0;font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:var(--sh)}
.tiles2 button:disabled{opacity:.25}
.slot{min-height:60px;border:2px dashed var(--c1);border-radius:14px;display:flex;justify-content:center;align-items:center;font-size:1.8rem;font-weight:700;letter-spacing:6px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tf button{font-size:1.4rem;padding:16px;border-radius:18px;border:0;color:#fff;font-weight:700}
/* duel */
.duel{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
.duel .half{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 16px;gap:6px;overflow:auto}
.duel .p2{transform:rotate(180deg);background:linear-gradient(135deg,rgba(124,58,237,.12),transparent)}
.duel .p1{background:linear-gradient(135deg,rgba(14,165,233,.12),transparent)}
.duel .mid{height:46px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;font-weight:700}
.duel .ch{margin:4px 0;padding:8px 12px}
.duel .lock{opacity:.4;pointer-events:none}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.team button{border:0;border-radius:16px;padding:14px;color:#fff;font-weight:700;font-size:1.05rem}
.team b{display:block;font-size:2rem}
/* misc */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:14px;z-index:99;font-size:.92rem;box-shadow:var(--sh);animation:fade .2s;max-width:90vw;text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.badge i{font-style:normal;font-size:2rem;display:block}
.badge.off{filter:grayscale(1);opacity:.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:560px;border-radius:22px 22px 0 0;margin:0;max-height:85vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
mark{background:#fff3a3;color:#000;border-radius:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.qday{border:2px solid var(--gold)}
#print{display:none}
@media print{
 body{background:#fff;color:#000;padding:0}
 .top,.nav,#inst,.tabs,.noprint,.toast{display:none!important}
 .card{box-shadow:none;break-inside:avoid;border:1px solid #ccc}
 body.printing main{display:none}
 body.printing #print{display:block}
 .flip{display:none}
}
@media (min-width:760px){.nav{max-width:760px;margin:0 auto;border-radius:20px 20px 0 0;border:1px solid var(--line)}}
</style>

: <b>الحركات السريعة<\/b> وتشمل <b>الزلازل<\/b> و<b>البراكين<\/b>، و<b>الحركات البطيئة<\/b> وتشمل <b>الالتواءات<\/b> و<b>الانكسارات<\/b>، وهي تبني تضاريس الأرض كالجبال والأودية.","objectives":["أعرّف الزلازل وأميز أنواعها وطرق قياسها","أصف تكون البراكين وأنواعها","أفرق بين الالتواءات والانكسارات","أتعرف واقع الزلازل والبراكين في سلطنة عمان"],"vocab":[["الزلزال","هزات أرضية سريعة متتالية ومفاجئة تصيب سطح الأرض"],["بؤرة الزلزال","النقطة التي تحدث فيها الهزات في باطن الأرض"],["الموجات الزلزالية","الهزات التي تنتقل من البؤرة إلى السطح"],["السيزموجراف","جهاز يسجل الهزات الأرضية"],["مقياس ريختر","مقياس يحدد قوة الموجات الزلزالية"],["البركان","فتحة في القشرة الأرضية تخرج منها مواد منصهرة من باطن الأرض"],["الصهارة","مواد باطن الأرض المنصهرة"],["الالتواءات","طيات تصيب سطح الأرض نتيجة الضغط الأفقي"],["الانكسارات","تكسر صخور القشرة نتيجة ضغط أو شد"],["الجيومورفولوجيا","علم دراسة أشكال سطح الأرض والعمليات التي كونتها"]],"sections":[{"h":"الزلازل","items":["تحدث غالبًا على <b>حدود الصفائح<\/b>","تنتقل الهزات من <b>البؤرة<\/b> إلى <b>المركز<\/b> على السطح وتضعف كلما ابتعدت","<b>الموجات الباطنية<\/b>: سريعة تعبر طبقات الأرض","<b>الموجات السطحية<\/b>: تتحرك على السطح وهي <b>الأكثر تدميرًا<\/b>","أنواعها: <b>بركانية<\/b> و<b>تكتونية<\/b> (حتى عمق ٧٠ كم) و<b>بلوتونية<\/b> (حتى ٨٠٠ كم وهي الأخطر)"],"box":""},{"h":"قياس الزلازل","items":["<b>السيزموجراف<\/b>: حامل ثقيل ونابض ومؤشر وأسطوانة دوارة","<b>مقياس ريختر<\/b> من ١ إلى ٩","الدرجات الصغيرة لا يشعر بها الإنسان","الدرجة ٨ إلى ٩ دمار شامل وانهيار المباني والجسور"],"box":""},{"h":"البراكين","items":["تتكون <b>الصهارة<\/b> في باطن الأرض مع غازات تندفع في مناطق الضعف","تتجمع في <b>حجرة الصهارة<\/b> ثم تصعد في <b>القصبة<\/b> إلى <b>الفوهة<\/b>","تتراكم المواد فتكون <b>جبلًا بركانيًا<\/b>","أنواعها: <b>نشطة<\/b> (إتنا في إيطاليا) و<b>متقطعة<\/b> (أسما في اليابان) و<b>ساكنة<\/b> (لاسن في أمريكا) و<b>خامدة<\/b> (كلمنجارو في تنزانيا)","تنتشر في <b>حلقة النار<\/b> حول المحيط الهادي"],"box":""},{"h":"الحركات البطيئة","items":["<b>رأسية<\/b>: CBfzNXapaP/wAg+L/gX8zV2uWW4BRRRSAKKKKACiiigAooooAKKKKAP//Z' style='max-width:100%;border-radius:10px'>"}],"examples":[{"q":"لماذا تكون الموجات السطحية أكثر تدميرًا؟","steps":[],"a":"لأنها تتحرك على سطح الأرض حيث يعيش الناس وتسبب انهيار المباني"},{"q":"ما الفرق بين بؤرة الزلزال ومركزه؟","steps":[],"a":"البؤرة في باطن الأرض حيث تحدث الهزات، والمركز هو النقطة فوقها على سطح الأرض"},{"q":"لماذا تخلو سلطنة عمان من البراكين النشطة؟","steps":[],"a":"لبعدها عن نطاقات النشاط البركاني والزلزالي على حدود الصفائح"}],"tips":["<b>سريعة<\/b> = زلازل وبراكين","<b>بطيئة<\/b> = التواءات وانكسارات","محدب = إلى أعلى ، مقعر = إلى أسفل"],"mistakes":["البركان الساكن ليس خامدًا، فقد يثور بعد فترة طويلة","مقياس ريختر يقيس قوة الزلزال وليس عدد ضحاياه"],"check":[["ما الجهاز الذي يسجل الزلازل؟","السيزموجراف"],["ما أخطر أنواع الزلازل؟","الزلازل البلوتونية"],["ما مثال البركان الخامد؟","كلمنجارو"]],"review":[],"activities":[{"t":"نشاط","d":"ارسم بركانًا وسمِّ أجزاءه (حجرة الصهارة، القصبة، الفوهة)"},{"t":"نشاط","d":"ابحث عن أحدث زلزال شعر به سكان سلطنة عمان واكتب قوته"}],"quiz":[{"q":"الجهاز الذي يسجل الهزات الأرضية:","choices":["السيزموجراف","الباروميتر","الترمومتر","البوصلة"],"answer":0,"explain":"ويتكون من حامل ونابض ومؤشر وأسطوانة"},{"q":"أخطر أنواع الزلازل:","choices":["السطحية","البركانية","البلوتونية","التكتونية"],"answer":2,"explain":"تحدث على أعماق تصل ٨٠٠ كم"},{"q":"البركان الذي لم يثر منذ بدء التاريخ يُسمى:","choices":["خامدًا","نشطًا","متقطعًا","ساكنًا"],"answer":0,"explain":"مثل كلمنجارو في تنزانيا"},{"q":"النقطة التي تحدث فيها الهزات في باطن الأرض:","choices":["القصبة","مركز الزلزال","بؤرة الزلزال","فوهة البركان"],"answer":2,"explain":"وتنتقل منها الموجات إلى السطح"},{"q":"الالتواء الذي تلتوي فيه الطبقات إلى أعلى:","choices":["التواء مقعر","أخدود","انكسار","التواء محدب"],"answer":3,"explain":"نتيجة الضغط الأفقي"},{"q":"الحركات الأفقية تعرف بالحركات:","choices":["البانية للجبال","البانية للقارات","السريعة","البركانية"],"answer":0,"explain":"تنتج عنها الالتواءات"},{"q":"من فوائد الانكسارات:","choices":["تدمير المباني","تسهيل التعدين","زيادة الزلازل","تكوين البراكين"],"answer":1,"explain":"وتنشيط المياه الجوفية"}]},{"id":"1-3","title":"الصخور","unit":"الوحدة الأولى: نشأة الأرض وتكوينها","icon":"🪨","pages":"31-39","idea":"<b>الصخر<\/b> مركب معدني ينشأ من اندماج مجموعة من <b>المعادن<\/b>. تقسم الصخور حسب نشأتها إلى: <b>نارية<\/b> تكونت من الصهارة، و<b>رسوبية<\/b> تكونت من طبقات الرواسب، و<b>متحولة<\/b> تغيرت بفعل الحرارة والضغط. وتتحول الصخور من نوع لآخر في <b>دورة الصخور<\/b>.","objectives":["أعرّف الصخر والمعدن","أصنف الصخور حسب نشأتها","أذكر خصائص كل نوع من الصخور","أصف مراحل تكون صخور سلطنة عمان"],"vocab":[["الصخر","مركب معدني ينشأ من اندماج مجموعة من المعادن"],["المعدن","ما يتكون في الطبيعة بعيدًا عن الكائنات الحية وله تركيب كيميائي وذري ثابت"],["الصخور النارية","صخور نشأت من مواد منصهرة تدعى الصهارة"],["الصخور الرسوبية","صخور تكونت على شكل طبقات من الرواسب"],["الصخور المتحولة","صخور نارية أو رسوبية تحولت واكتسبت صفات جديدة"],["المسامية","حجم الفراغات الموجودة داخل الصخر"],["النفاذية","قدرة الصخر على إنفاذ السوائل"],["دورة الصخور","تحول الصخور من حالة قديمة إلى حالة جديدة"]],"sections":[{"h":"الصخور والمعادن","items":["صخر <b>وحيد المعدن<\/b>: الكالسيت يكون <b>الرخام<\/b>، والكوارتز يكون <b>الكوارتزيت<\/b>","صخر <b>متعدد المعادن<\/b>: <b>الجرانيت<\/b> من الكوارتز والفلسبار والبيوتيت","نميز الصخور بالمعادن المكونة لها وبخصائصها الخارجية ونسيجها"],"box":""},{"h":"الصخور النارية","items":["<b>الجوفية (البلوتونية)<\/b>: تبرد ببطء في باطن الأرض فتكبر <b>بلوراتها<\/b>","<b>السطحية (البركانية)<\/b>: تبرد بسرعة فتكون بلوراتها صغيرة","حسب أكسيد السيليكون: <b>حامضية<\/b> (أكثر من ٦٦%) فاتحة خفيفة مثل الجرانيت","<b>قاعدية<\/b> (٤٤% إلى ٥٢%) قاتمة ثقيلة مثل البازلت","خصائصها: <b>صلبة<\/b> قليلة المسامية غنية بالمعادن <b>لا تحتوي حفريات<\/b>"],"box":""},{"h":"الصخور الرسوبية","items":["تتكون من تراكم الرواسب في المناطق المنخفضة ثم تضغط وتتماسك","مثل <b>الحجر الرملي<\/b> و<b>الطين<\/b> و<b>الحجر الجيري<\/b> و<b>الدولوميت<\/b> و<b>الجبس<\/b>","تتكون على شكل <b>طبقات<\/b>","تحتوي <b>حفريات<\/b>","<b>مسامية ونفاذية<\/b> عالية فتكون خزانات للمياه الجوفية و<b>النفط والغاز<\/b>"],"box":""},{"h":"الصخور المتحولة","items":["عوامل التحول: <b>الحرارة<\/b> و<b>الضغط<\/b> و<b>المحاليل الحارة<\/b>","<b>متحولة حراريًا<\/b>: الحجر الرملي يتحول إلى كوارتزيت","<b>متحولة ديناميكيًا<\/b>: بالضغط دون حرارة","<b>متحولة إقليميًا<\/b>: الطين يتحول إلى إردواز والجرانيت إلى نايس","خالية من الحفريات وتجمع بين النظامين البلوري والطبقي"],"box":""},{"h":"صخور عمان","items":["<b>المرحلة الأولى<\/b> (أكثر من ٨٥٠ مليون سنة): أقدم الصخور كالنايس والشيست والجرانيت في مرباط وحاسك وجعلان","<b>المرحلة الثانية<\/b> (٥٧٠ إلى ٢٤٥ مليون سنة): صخور متحولة كالكوارتزيت والدولوميت","<b>المرحلة الثالثة<\/b> (٩٠ مليون سنة): تكون <b>أفيوليت سمائل<\/b> الذي يعد <b>أكبر تكوين أفيوليتي في العالم<\/b>","تراكمت فوقه رواسب <b>النحاس<\/b> في صحار"],"box":""}],"visuals":[{"t":"دورة الصخور","svg":"<img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmE5NTVmYjM2LTdhMjctNGEyNi05MzM4LTlmMWM1M2Y5ZWNlYwAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNogS45kFllyt8w1xx/ejBKyQAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOmNjYWU4NjRjLTFjN2UtNGNkZC04MjRmLTc5Yjk2Y2YxM2JjOGxyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGlvbnMudjIAAAAAGGMyc2gr3nXZlZV+eipZXsm71fzPAAABmWNib3KiZ2FjdGlvbnOComZhY3Rpb25rYzJwYS5vcGVuZWRqcGFyYW1ldGVyc6FraW5ncmVkaWVudHOBomN1cmx4LXNlbGYjanVtYmY9YzJwYS5hc3NlcnRpb25zL2MycGEuaW5ncmVkaWVudC52M2RoYXNoWCA202CN5384qFdG60DJeXigxH5Oq/KaVBoVELfcuqrzMaRmYWN0aW9ueB1jb20uYW50aHJvcGljLmNsYXVkZS5wcm92aWRlZGpwYXJhbWV0ZXJzoXgfY29tLmFudGhyb3BpYy5vcmlnaW4tY29uZmlkZW5jZWd1bmtub3dua2Rlc2NyaXB0aW9ueGZDbGF1ZGUgcHJvdmlkZWQgdGhpcyBmaWxlIGF0IHRoZSByZXF1ZXN0IG9mIGEgdXNlciBhbmQgbWF5IGhhdmUgY3JlYXRlZCBvciBtb2RpZmllZC قع أفيوليت سمائل في:","choices":["تنزانيا","اليابان","سلطنة عمان","إيطاليا"],"answer":2,"explain":"أكبر تكوين أفيوليتي في العالم"}]},{"id":"2-1","title":"التجوية","unit":"الوحدة الثانية: العوامل الخارجية التي تسهم في تشكيل سطح الأرض","icon":"🏜️","pages":"42-50","idea":"<b>التجوية<\/b> هي المرحلة الأولى في تغيير سطح الأرض، وهي تفتت الصخور أو تحللها <b>في مكانها<\/b> بفعل عوامل الجو. وهي نوعان: <b>تجوية كيميائية<\/b> تغير تركيب الصخر، و<b>تجوية ميكانيكية<\/b> تفتته دون تغيير خصائصه، وتمهد الطريق لعمل <b>التعرية<\/b>.","objectives":["أعرّف التجوية والعوامل المؤثرة فيها","أميز بين التجوية الكيميائية والميكانيكية وطرق كل منهما","أذكر آثار التجوية على سطح الأرض","أوضح دور الإنسان في زيادة التجوية"],"vocab":[["التجوية","مجموع العمليات التي تسبب تفتت الصخور أو تحللها كيميائيًا في مكانها بفعل عوامل الجو"],["التجوية الكيميائية","تحلل الصخور نتيجة تفاعل غازات الجو مع معادنها"],["التجوية الميكانيكية","تحطم الصخور وتفتتها دون تغير خصائصها الأصلية"],["الأكسدة","تفاعل الأكسجين مع معادن الصخر في وجود الماء"],["التميؤ","اتحاد الماء مع بعض العناصر المكونة للصخور"],["الكربنة","إذابة مياه الأمطار لغاز ثاني أكسيد الكربون وتفاعلها مع الصخور الجيرية"],["المدى الحراري","الفرق بين أعلى وأدنى درجة حرارة"],["التقشر","انفصال قشور رقيقة من أسطح الصخور"]],"sections":[{"h":"العوامل المؤثرة","items":["<b>تركيب الصخور<\/b> ومعادنها","ما تحتويه من <b>فواصل وشقوق<\/b>","<b>المناخ السائد<\/b>","<b>الفترة الزمنية<\/b>","التجوية تفتت الصخور و<b>التعرية<\/b> تنقلها من مكان لآخر"],"box":""},{"h":"التجوية الكيميائية","items":["<b>الأكسدة<\/b>: الحديد + الأكسجين في وجود الماء ← أكسيد الحديد، كما في صخور البازلت","<b>التميؤ<\/b>: اتحاد الماء مع المعادن فيزيد حجمها مثل تحول الأنهيدريت إلى جبس","<b>الكربنة<\/b>: الأمطار تذيب ثاني أكسيد الكربون فتذيب الصخور الجيرية","<b>الأمطار الحمضية<\/b> أثرت في مبانٍ مثل <b>تاج محل<\/b>"],"box":""},{"h":"التجوية الميكانيكية","items":["<b>التفاوت الحراري في المناطق الحارة<\/b>: تتمدد الصخور نهارًا وتنكمش ليلًا فتتقشر وتتفلق","<b>التفاوت الحراري في المناطق الباردة<\/b>: يتجمد الماء في الشقوق فيزيد حجمه من ٩% إلى ١١% فيفتت الصخر","<b>الكائنات الحية<\/b>: جذور النباتات توسع الشقوق وحيوانات كالجرذان تحفر بيوتها"],"box":""},{"h":"آثار التجوية","items":["<b>التربة<\/b>: من أهم نواتج التجوية","<b>حقول الجلاميد<\/b>: صخور كبيرة مستديرة","<b>ركام السفوح<\/b>: حطام يتراكم أسفل المنحدرات","<b>الكهوف<\/b>: كهف <b>الهوتة<\/b> وكهف <b>مجلس الجن<\/b> في سلطنة عمان","قال تعالى: ﴿ثُمَّ شَقَقْنَا الْأَرْضَ شَقًّا﴾ ﴿فَأَنبَتْنَا فِيهَا حَبًّا﴾ ﴿وَعِنَبًا وَقَضْبًا﴾ [عبس: ٢٦-٢٨]"],"box":""}],"visuals":[{"t":"كهوف تكونت بفعل التجوية: كهف الهوتة وكهف مجلس الجن","svg":"<img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmJiNTdiMDhmLTJhMjAtNGQ4YS1hNjA3LTVmOTU5Yjk5NDAyNQAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNo1Ql7U3Xr8mNoeAXshaYoMgAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOjgzNmFkMTcwLWM2MjItNDBmMi05M2MzLWZhZDE0NDY2MWE5YWxyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGlvbnMudjIAAAAAGGMyc2gI31RkHxHakn6BISAgwNXCAAABmWNib3KiZ2FjdGlvbnOComZhY3Rpb25rYzJwYS5vcGVuZWRqcGFyYW1ldGVyc6FraW5ncmVkaWVudHOBomN1cmx4LXNlbGYjanVtYmY9YzJwYS5hc3NlcnRpb25zL2MycGEuaW5ncmVkaWVudC52M2RoYXNoWCB7thcbXvmo3hiBTGwnJrQGuNPqPxS+SWbfcykx+rfkdaRmYWN0aW9ueB1jb20uYW50aHJvcGljLmNsYXVkZS5wcm92aWRlZGpwYXJhbWV0ZXJzoXgfY29tLmFudGhyb3BpYy5vcmlnaW4tY29uZmlkZW5jZWd1bmtub3dua2Rlc2NyaXB0aW9ueGZDbGF1ZGUgcHJvdmlkZWQgdGhpcyBmaWxlIGF0IHRoZSByZXF1ZXN0IG9mIGEgdXNlciBhbmQgbWF5IGhhdmUgY3JlYXRlZCBvciBtb2RpZmllZCB0aGUgZmlsZSBjb250ZW50cy5tc29mdHdhcmVBZ2VudKFkbmFtZWZDbGF1ZGVyYWxsQWN0aW9uc0luY2x1ZGVk9QAAAMhqdW1iAAAAQGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaGFzaC5kYXRhAAAAABhjMnNoh3NjdOi+sordvzYzyEZOOgAAAIBjYm9ypWNhbGdmc2hhMjU2Y3BhZE4AAAAAAAAAAAAAAAAAAGRoYXNoWCChsb0ALNhvM6hN7AcH1I3nP2KXwD5Gs3E2IZ4f0+ZpeWRuYW1lbmp1bWJmIG1hbmlmZXN0amV  والزلط"],["التلال المفردة","تلال قبابية شديدة الانحدار بقيت بعد إزالة ما حولها"],["اللوس","تربة صفراء من غبار ورمل دقيق تحمله الرياح"],["الكثبان الرملية","تلال رملية متفاوتة الارتفاع تتكون من رمال مستديرة الحبيبات"]],"sections":[{"h":"النحت والأشكال الناتجة","items":["تحت الرياح الصخور <b>الرخوة<\/b> بما تحمله من حبيبات ويبقى <b>الصلب<\/b>","<b>المنخفضات الصحراوية<\/b>: تكونت بإزالة الرمال وقد يصل قاعها إلى الماء فتتكون <b>الواحات<\/b>","<b>صحاري الحمادة<\/b>: هضاب صخرية تشكل معظم صحاري العالم","<b>سهول الرق<\/b>: سهول من الحصى والزلط بعد إزالة الرمال","<b>التلال المفردة<\/b>: بقايا تلال صلبة","ومن الأشكال أيضًا <b>الكهوف<\/b> و<b>الموائد الصحراوية<\/b>"],"box":""},{"h":"نقل الرياح","items":["يعتمد على <b>سرعة الرياح<\/b> و<b>حجم المواد<\/b> المنقولة","المواد الدقيقة تنتقل <b>عالقة<\/b> في الهواء","الرمال تنتقل <b>بالقفز<\/b>","المواد الكبيرة <b>تتدحرج<\/b> قرب السطح","رياح <b>السيروكو<\/b> تنقل الغبار من الصحراء الكبرى إلى جنوب أوروبا"],"box":""},{"h":"الإرساب","items":["يحدث عندما <b>تضعف سرعة الرياح<\/b>","<b>اللوس<\/b>: غبار دقيق يتراكم مكونًا تربة صفراء <b>عالية الخصوبة<\/b> وأكبر مناطقه في شمال الصين","<b>الكثبان الرملية<\/b>: تتكون من رمال تصطدم بعائق كمبنى أو شجرة","أنواع الكثبان: <b>البرخان<\/b> (الهلالية) و<b>الطولية<\/b> و<b>النجمية<\/b> و<b>العكسية<\/b>"],"box":""},{"h":"في سلطنة عمان","items":["تضم مساحات صحراوية واسعة مثل <b>رمال الشرقية<\/b> وأجزاء من <b>الربع الخالي<\/b>","تهتم السلطنة باستغلال هذه المناطق في <b>السياحة<\/b> والمشاريع الاقتصادية"],"box":""}],"visuals":[{"t":"بعض أنواع الكثبان الرملية","svg":"<img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjdjNTM2YzIyLTA3NDEtNDQ3Mi1hYTBkLTYwMmI3OTM0MjEwYwAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNo/SmxaOlBIkKgIaf5f29McQAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5j يًا باتجاه البحر"],["قانون كوريولي","انحراف الأجسام المتحركة يمينًا في نصف الكرة الشمالي ويسارًا في الجنوبي"]],"sections":[{"h":"العوامل الطبيعية","items":["<b>الأمواج<\/b>: تتولد من هبوب الرياح، وتسهم الزلازل والبراكين في توليدها","<b>المد والجزر<\/b>: بفعل جاذبية <b>القمر<\/b> والشمس","<b>التيارات البحرية<\/b>: حركة مياه البحار رأسية أو أفقية بفعل الرياح وتباين الحرارة والملوحة","<b>دوران الأرض<\/b>: قوة <b>كوريولي<\/b> تؤثر في الرياح والتيارات"],"box":""},{"h":"العوامل البشرية","items":["مشاريع <b>الموانئ<\/b> واستغلال السواحل","أنشطة <b>الترفيه والسياحة<\/b>","<b>السدود المائية<\/b> والطرق ونقل رمال الشاطئ","قد تؤثر إيجابًا أو سلبًا على البيئة الساحلية"],"box":""},{"h":"النحت البحري","items":["يتم بـ: <b>ضغط الهواء<\/b> في الشقوق ، و<b>النحت القاعدي<\/b> بالحصى ، و<b>الذوبان<\/b> ، و<b>التصادم<\/b>","<b>الجروف<\/b>: تشكل نحو ٤٥% من ساحل سلطنة عمان من مطرح إلى المغسيل، مثل جروف <b>مسندم<\/b>","<b>الكهوف<\/b>: قد تتصل بالسطح فتكون <b>نافورات<\/b> مثل <b>شاطئ المغسيل<\/b> في صلالة","<b>الأقواس<\/b>: تتكون من التقاء كهفين","<b>المسلات<\/b>: بعد انهيار سقف القوس"],"box":""},{"h":"الإرساب البحري","items":["<b>الرواسب الشاطئية (البلاج)<\/b>: مفتتات صخرية وحصوية بين المد والجزر","<b>اللسان البحري<\/b>: حافة رملية ممتدة نحو البحر المفتوح","<b>الحواجز الرملية<\/b>: أمام الخلجان أو المصبات وقد تكون <b>بحيرات ساحلية<\/b>","طول ساحل سلطنة عمان نحو <b>٣١٦٥ كم<\/b>"],"box":""}],"visuals":[{"t":"من الأشكال الناتجة عن النحت البحري: الكهف والقوس والمسلة","svg":"<img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjAwM2IxYzQyLTdlOWQtNGY0Ni1iMzE0LTZiYzNiMzhkMDgwZAAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNoT/sg67xZSzz1Iw4/6OEf4wAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOjg4YzgyYTU2LWY2NmItNGU0NC1hYzE1LWEwN2UyMTM1YWZlY2xyZWxhdGlvbnN q":"تتولد الأمواج غالبًا بسبب:","choices":["دوران القمر","ملوحة المياه","هبوب الرياح","ذوبان الجليد"],"answer":2,"explain":"فوق سطح المياه"},{"q":"المد والجزر يحدثان بفعل:","choices":["الأنهار","الزلازل","جاذبية القمر والشمس","الرياح فقط"],"answer":2,"explain":"وأثر القمر أكبر"},{"q":"تبقى المسلة البحرية بعد انهيار:","choices":["اللسان","الشاطئ","الجرف","سقف القوس"],"answer":3,"explain":"من أشكال النحت البحري"},{"q":"تشتهر بالنافورات البحرية في سلطنة عمان:","choices":["رمال الشرقية","جبل شمس","شاطئ المغسيل","وادي بني خالد"],"answer":2,"explain":"في محافظة ظفار"},{"q":"حافة رملية تمتد طوليًا باتجاه البحر المفتوح:","choices":["الكهف","القوس","الجرف البحري","اللسان البحري"],"answer":3,"explain":"من أشكال الإرساب"},{"q":"طول ساحل سلطنة عمان تقريبًا:","choices":["٣١٦٥ كم","٥٠٠ كم","١٠٠٠٠ كم","١٠٠٠ كم"],"answer":0,"explain":"متنوع الأشكال الجيومورفولوجية"}]},{"id":"3-1","title":"ظهور الإسلام وبناء الدولة الجديدة","unit":"الوحدة الثالثة: امتداد الإسلام وبناء حضارته","icon":"🕌","pages":"77-81","idea":"ظهرت دعوة الإسلام في <b>الحجاز<\/b> في القرن السابع الميلادي رسالة سماوية عامة للبشرية، فتأسست <b>دولة الإسلام<\/b> على <b>الاحترام المتبادل<\/b> وحماية رعاياها على اختلاف معتقداتهم. وتطورت الدولة في <b>عصر الخلفاء الراشدين<\/b> واتسعت فتوحاتها، ثم مرت بفترة <b>الفتنة<\/b> حتى <b>عام الجماعة<\/b>.","objectives":["أوضح مبادئ الدولة الإسلامية الجديدة","أتتبع إنجازات الخلفاء الراشدين","أصف أحداث الفتنة ومعركة صفين","أذكر نتائج التحكيم وعام الجماعة"],"vocab":[["الدولة الجديدة","دولة الإسلام التي بدأت في الحجاز وشملت شبه الجزيرة العربية"],["الاحترام المتبادل","مبدأ التعايش بين المسلمين وغيرهم دون اعتبار لاختلاف المعتقد أو الجنس"],["الإمبراطورية الرومانية","إمبراطورية انقسمت إلى غربية عاصمتها روما وشرقية عاصمتها القسطنطينية"],["بلاد المغرب","البلاد الواقعة غرب مركز الخلافة وقسمت إلى أدنى وأوسط وأقصى"],["الفتنة","الظروف الصعبة التي تعرضت لها الدولة في نهاية خلافة عثمان واستمرت في خلافة علي"],["التحكيم","احتكام الطرفين إلى رجلين يفصلان في الخلاف بعد صفين"],["المحكمة","الذين رفضوا التحكيم ورفعوا شعار لا حكم إلا لله"]],"sections":[{"h":"مبادئ الدولة الجديدة","items":["دعوة <b>عالمية<\/b> لم تصطدم بالحضارات الأخرى بل تفاعلت معها","التزم أتباعها <b>بالتسامح<\/b> و<b>أدب الحوار<\/b> مع المخالفين","حرية شاملة ومساواة تامة","قال تعالى: ﴿وَلَوْ شَاءَ رَبُّكَ لَجَعَلَ النَّاسَ أُمَّةً وَاحِدَةً وَلَا يَزَالُونَ مُخْتَلِفِينَ﴾ [هود: ١١٨]"],"box":""},{"h":"الخلفاء الراشدون","items":["<b>أبو بكر الصديق<\/b> (١١ - ١٣هـ): تغلب على <b>الردة<\/b> وأعاد الوحدة ووجه الجيوش نحو الفرس والروم","<b>عمر بن الخطاب<\/b> (١٣ - ٢٣هـ): انتصر على الفرس في <b>القادسية<\/b> وعلى الروم في <b>اليرموك<\/b>","<b>عثمان بن عفان<\/b> (٢٣ - ٣٥هـ): استمرت الفتوح إلى فارس وأرمينيا وبلاد المغرب، وأنشأ <b>أول أسطول بحري<\/b>","<b>علي بن أبي طالب<\/b> (٣٥ - ٤٠هـ)"],"box":""},{"h":"الفتنة ومعركة صفين","items":["بدأت أحداث الفتنة في أواخر عهد عثمان وانتهت بحصاره ومقتله","تخلف <b>معاوية بن أبي سفيان<\/b> والي الشام عن بيعة <b>علي<\/b>","التقى الجيشان في <b>صفين<\/b> سنة <b>٣٧هـ<\/b>","رفعت قوات معاوية <b>المصاحف<\/b> تطالب بالتحكيم","مثل <b>أبو موسى الأشعري<\/b> عليًا ومثل <b>عمرو بن العاص<\/b> معاوية"],"box":""},{"h":"ما بعد التحكيم","items":["أصبحت الدولة تتنازعها ثلاث زعامات: <b>الكوفة<\/b> (علي) و<b>النهروان<\/b> (المحكمة بقيادة عبدالله بن وهب الراسبي) و<b>دمشق<\/b> (معاوية)","وقع صدام بين علي والمحكمة عند <b>النهروان<\/b>","في عام <b>٤٠هـ<\/b> قتل الخليفة علي","بويع ابنه <b>الحسن<\/b> ثم تنازل عن الخلافة حقنًا للدماء","سمي العام <b>عام الجماعة<\/b>"],"box":""}],"visuals":[{"t":"حدود الدولة الإسلامية زمن الخلفاء الراشدين","svg":"<img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmU3YjZhNjA2LTZmMzktNGQwMi04NDhkLWRlYmY4YzQ5ZTI5OAAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNoFfeAjOau1OsBNSrcvMEmRAAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOm "أبي بكر"],"answer":2,"explain":"وتمكن من ضم جزر في البحر المتوسط"},{"q":"وقعت معركة صفين سنة:","choices":["٣٧هـ","٢٣هـ","٤٠هـ","١٣هـ"],"answer":0,"explain":"بين علي ومعاوية"},{"q":"مثل أبو موسى الأشعري في التحكيم:","choices":["أهل الشام","الحسن","الخليفة علي","معاوية"],"answer":2,"explain":"ومثل عمرو بن العاص معاوية"},{"q":"قائد المحكمة في النهروان:","choices":["عمرو بن العاص","أبو موسى الأشعري","عبدالله بن وهب الراسبي","سعد بن أبي وقاص"],"answer":2,"explain":"رفعوا شعار لا حكم إلا لله"},{"q":"سمي العام ٤٠هـ:","choices":["عام الفتح","عام الجماعة","عام الحزن","عام الردة"],"answer":1,"explain":"بعد تنازل الحسن عن الخلافة"}]},{"id":"3-2","title":"المدارس الفكرية في الإسلام","unit":"الوحدة الثالثة: امتداد الإسلام وبناء حضارته","icon":"📚","pages":"84-91","idea":"يعد <b>القرآن الكريم<\/b> نقطة البداية للفكر الإسلامي. ومع اتساع الدولة ظهرت <b>المدن الإسلامية<\/b> مراكز للنهضة الفكرية، ونشأت مدارس فكرية أبرزها <b>مدرسة الحديث في المدينة المنورة<\/b> و<b>مدرسة الرأي في الكوفة<\/b>، ثم تقاربت المدرستان واتسع الاجتهاد مع التزامهما <b>بالقرآن والسنة والإجماع<\/b>.","objectives":["أوضح مقومات نمو الفكر الإسلامي","أبين دور المدن الإسلامية في النهضة الفكرية","أقارن بين مدرسة الحديث ومدرسة الرأي","أتتبع تطور المدارس الفكرية"],"vocab":[["الوسطية","جمع الإسلام بين الأصالة والمعاصرة وتميزه بالثبات والمرونة"],["المدرسة الفكرية","منهج علمي ارتبط بمدينة وأعلام وأسس وأدلة"],["مدرسة الحديث","مدرسة المدينة المنورة التي استندت إلى رواية الحديث مع القرآن الكريم"],["مدرسة الرأي","مدرسة الكوفة التي توسعت في الاجتهاد والقياس"],["التابعون","الطبقة التي أخذت العلم عن الصحابة"],["سد الذرائع","منع الوسائل التي تؤدي إلى الفساد"],["الإجماع","اتفاق المجتهدين على حكم شرعي"]],"sections":[{"h":"مقومات الفكر الإسلامي","items":["<b>الإسلام يرسخ القيم الفكرية<\/b>: دعوة صريحة لاستخدام العقل والتفكر والبحث عن الدليل","يحذر من <b>التبعية الفكرية<\/b> والتقليد الأعمى","<b>الحرية الواعية<\/b> أساس تقوم عليه الأخلاق","<b>الإسلام دين الوسطية<\/b>: يجمع بين الأصالة والمعاصرة ويعالج أمور الدين والدنيا"],"box":""},{"h":"المدن مراكز للنهضة","items":["<b>المدينة المنورة<\/b> حاضنة الحضارة الإسلامية","ثم <b>دمشق<\/b> و<b>الكوفة<\/b> و<b>البصرة<\/b> و<b>الفسطاط<\/b> ثم <b>بغداد<\/b> و<b>قرطبة<\/b> و<b>القاهرة<\/b>","في عمان كانت <b>نزوى<\/b> و<b>الرستاق<\/b> و<b>صحار<\/b> مراكز فكرية","تميز الفكر الإسلامي <b>بالمرونة والتسامح<\/b>","اقتبس المسلمون من الحضارات الأخرى ما لا يتعارض مع الإسلام"],"box":""},{"h":"مدرسة الحديث في المدينة","items":["المدينة عاصمة الدولة ومقصد العلماء","اعتمدت <b>رواية الحديث<\/b> مع القرآن الكريم","من أبرز علمائها: <b>عبدالله بن عباس<\/b> و<b>عبدالله بن عمر<\/b> و<b>سعيد بن المسيب<\/b> و<b>عروة بن الزبير<\/b> و<b>خارجة بن زيد بن ثابت<\/b>"],"box":""},{"h":"مدرسة الرأي في الكوفة","items":["يعد <b>عمر بن الخطاب<\/b> مؤسسها وسار على نهجه عدد من الصحابة","أسس <b>سعد بن أبي وقاص<\/b> الكوفة سنة ١٧هـ بأمر الخليفة عمر","من علمائها <b>عبدالله بن مسعود<\/b>","غلب عليها الرأي لبعدها عن الحجاز وتنوع الحياة فيها","اشتهر بها <b>أبو حنيفة النعمان<\/b>"],"box":""},{"h":"تطور المدارس","items":["حدث <b>تقارب<\/b> بين المدرستين","اعتمد العلماء <b>القياس<\/b> و<b>الاستحسان<\/b> ومراعاة <b>المصالح<\/b> و<b>سد الذرائع<\/b>","اتفق المجتهدون على <b>الالتزام بالقرآن والسنة ثم الإجماع<\/b>","سادت <b>آداب الاحترام والتسامح<\/b> بين العلماء"],"box":""}],"visuals":[],"examples":[{"q":"لماذا غلب الرأي على مدرسة الكوفة؟","steps":[],"a":"لبعدها عن الحجاز وتنوع البيئة والحياة الجديدة فيها، فاحتاجت إلى الاجتهاد والقياس"},{"q":"ما المصادر التي اتفق عليها المجتهدون في المدرستين؟","steps":[],"a":"القرآن الكريم والسنة النبوية ثم الإجماع"},{"q":"كيف أسهمت المدن الإسلامية في نهضة الفكر؟","steps":[],"a":"أصبحت مراكز علمية احتضنت العلماء وتنقل بينها طلاب العلم"}],"tips":["<b>المدينة<\/b> = مدرسة <b>الحديث<\/b> ، <b>الكوفة<\/b> = مدرسة <b>الرأي<\/b>","المصادر المتفق عليها: قرآن، سنة، إجماع"],"mistakes":["مدرسة الرأي لم تترك القرآن والسنة، بل توسعت في الاجتهاد فيما لا نص فيه","الاختلاف بين المدرستين لم يمنع الاحترام بين علمائهما"],"check":[["أين نشأت مدرسة الحديث؟","المدينة المنورة"],["من أسس مدينة الكوفة؟","سعد بن أبي وقاص"],["من أشهر أهل الرأي في الكوفة؟","أبو حنيفة النعمان"]],"review":[],"activities":[{"t":"نشاط","d":"ارسم خريطة مفاهيم للمدارس الفكرية تبين المدينة والعلماء والمنهج"},{"t":"نشاط","d":"اكتب فقرة عن دور نزوى في الحركة العلمية في عمان"}],"quiz":[{"q":"نقطة البداية للفكر الإسلامي:","choices":["تأسيس الكوفة","معركة القادسية","نزول القرآن الكريم","فتح الشام"],"answer":2,"explain":"ثم السنة النبوية"},{"q":"نشأت مدرسة الحديث في:","choices":["المدينة المنورة","الكوفة","البصرة","دمشق"],"answer":0,"explain":"عاصمة الدولة الإسلامية"},{"q":"نشأت مدرسة الرأي في:","choices":["القاهرة","مكة","المدينة المنورة","الكوفة"],"answer":3,"explain":"وتوسعت في القياس"},{"q":"أسس مدينة الكوفة:","choices":["أبو عبيدة","عمرو بن العاص","خالد بن الوليد","سعد بن أبي وقاص"],"answer":3,"explain":"سنة ١٧هـ بأمر الخليفة عمر"},{"q":"من علماء مدرسة المدينة:","choices":["سعيد بن المسيب","أبو حنيفة النعمان","عبدالله بن وهب","معاوية"],"answer":0,"explain":"وعروة بن الزبير"},{"q":"من المراكز الفكرية في عمان:","choices":["قرطبة","بغداد","الفسطاط","نزوى والرستاق وصحار"],"answer":3,"explain":"ازدهرت فيها العلوم"},{"q":"الوسطية في الإسلام تعني:","choices":["رفض كل جديد","التقليد الأعمى","الجمود","الجمع بين الأصالة والمعاصرة"],"answer":3,"explain":"مع الثبات والمرونة"}]},{"id":"3-3","title":"المذاهب الإسلامية وتطورها التاريخي","unit":"الوحدة الثالثة: امتداد الإسلام وبناء حضارته","icon":"🤝","pages":"92-98","idea":"<b>الاختلاف<\/b> في الرأي أمر فطري وضروري للأمة، والتزم أئمة المذاهب <b>آداب الاختلاف<\/b>: <b>الأخلاقية<\/b> و<b>العلمية<\/b> و<b>الاجتماعية<\/b>. ومن أهم المذاهب الإسلامية التي بقي لها أتباع: <b>الإباضي<\/b> و<b>الزيدي<\/b> و<b>الجعفري<\/b> و<b>الحنفي<\/b> و<b>المالكي<\/b> و<b>الشافعي<\/b> و<b>الحنبلي<\/b>.","objectives":["أوضح أهمية الاختلاف وأسبابه","أذكر آداب الاختلاف الأخلاقية والعلمية والاجتماعية","أتعرف أهم المذاهب الإسلامية ومؤسسيها","أقدر التسامح واحترام الرأي الآخر"],"vocab":[["الاختلاف","تباين الآراء في المسائل بسبب تفاوت الأفهام والاجتهاد"],["آداب الاختلاف","الضوابط التي تحكم الحوار بين المختلفين"],["حسن الظن","عدم محاكمة النيات وعدم اتهام الآخرين"],["الغيبة","تناول شخصية الآخرين بالتجريح"],["الموضوعية","إنصاف الرأي الآخر والتنازل عن الأنا"],["الفقه التقديري","الفقه في قضايا لم تقع بالفعل ويتوقع حدوثها"],["المذهب","منهج فقهي ينسب إلى إمام مجتهد"]],"sections":[{"h":"الاختلاف وأهميته","items":["كان الاختلاف قائمًا في عهد <b>الصحابة<\/b> ثم <b>التابعين<\/b>","جبل الناس على الاختلاف ووجوده ضروري ونافع","له علاقة <b>بالفروق الفردية<\/b> بين الناس","قال تعالى: ﴿وَلَوْ شَاءَ رَبُّكَ لَجَعَلَ النَّاسَ أُمَّةً وَاحِدَةً وَلَا يَزَالُونَ مُخْتَلِفِينَ﴾ [هود: ١١٨]","سببه <b>التفاوت في فهم النصوص<\/b> ووصولها إلى العلماء"],"box":""},{"h":"آداب الاختلاف","items":["<b>الأخلاقية<\/b>: <b>الاحترام<\/b> و<b>حسن الظن<\/b> و<b>عدم الغيبة<\/b> و<b>عدم تصيد الأخطاء<\/b>","<b>العلمية<\/b>: معرفة القضية جيدًا، والقدرة على المحاكمة، و<b>البحث عن الحقيقة<\/b>، و<b>الموضوعية<\/b> وإنصاف الرأي الآخر","<b>الاجتماعية<\/b>: التعايش الإيجابي وتقبل وجهة النظر المخالفة في إطار الاحترام"],"box":""},{"h":"المذاهب الإسلامية (١)","items":["<b>الإباضي<\/b>: مؤسسه التابعي <b>جابر بن زيد الأزدي<\/b>، ولد في <b>فرق<\/b> بولاية نزوى، من أخص تلاميذ ابن عباس، توفي سنة ٩٣هـ، وأخذ العلم عنه <b>أبو عبيدة مسلم بن أبي كريمة<\/b>","<b>الزيدي<\/b>: ينسب إلى <b>زيد بن علي زين العابدين<\/b>، ولد سنة ٨٠هـ وتوفي سنة ١٢٢هـ","<b>الجعفري<\/b>: ينسب إلى <b>جعفر بن محمد الباقر<\/b>، ولد سنة ٨٣هـ وتوفي سنة ١٤٨هـ ودفن في البقيع"],"box":""},{"h":"المذاهب الإسلامية (٢)","items":["<b>الحنفي<\/b>: <b>أبو حنيفة النعمان بن ثابت<\/b> الكوفي، ولد سنة ٨٠هـ واشتغل <b>بالفقه التقديري<\/b>، توفي سنة ١٥٠هـ","<b>المالكي<\/b>: <b>مالك بن أنس<\/b> ولد في المدينة سنة ٩٣هـ وألف <b>الموطأ<\/b>، توفي سنة ١٧٩هـ","<b>الشافعي<\/b>: <b>محمد بن إدريس<\/b> ولد في غزة سنة ١٥٠هـ وتوفي في مصر سنة ٢٠٤هـ","<b>الحنبلي<\/b>: <b>أحمد بن حنبل<\/b> ولد في بغداد سنة ١٦٤هـ وألف <b>المسند<\/b>"],"box":""},{"h":"التسامح بين الأئمة","items":["لم يتعصب أحد منهم لرأيه بل قالوا إن رأيهم صواب يحتمل الخطأ","التزموا <b>أدب الاختلاف<\/b> فلم يخطئ بعضهم بعضًا","شعارهم: نتعاون فيما اتفقنا عليه ويعذر بعضنا بعضًا فيما اختلفنا فيه"],"box":""}],"visuals":[],"examples":[{"q":"لماذا يعد الاختلاف في الرأي أمرًا طبيعيًا؟","steps":[],"a":"لأن الناس يختلفون في قدراتهم وأفهامهم، والنصوص تحتمل الاجتهاد في فهمها"},{"q":"من مؤسس المذهب الإباضي وأين ولد؟","steps":[],"a":"التابعي جابر بن زيد الأزدي، ولد في فرق إحدى قرى ولاية نزوى"},{"q":"كيف تعامل أئمة المذاهب مع الاختلاف؟","steps":[],"a":"التزموا أدب الاختلاف ولم يتعصبوا، وتعاونوا فيما اتفقوا عليه وعذر بعضهم بعضًا"}],"tips":["آداب الاختلاف ثلاثة: <b>أخلاقية، علمية، اجتماعية<\/b>","لكل مذهب إمام ومدينة: جابر (البصرة)، أبو حنيفة (الكوفة)، مالك (المدينة)، أحمد (بغداد)"],"mistakes":["الخلاف المذموم غير الاختلاف المحمود الذي يثري الفكر","تعدد المذاهب ليس تفرقًا في أصول الدين بل اجتهاد في الفروع"],"check":[["من مؤسس المذهب الإباضي؟","جابر بن زيد الأزدي"],["من صاحب كتاب الموطأ؟","الإمام مالك بن أنس"],["اذكر أدبًا من آداب الاختلاف الأخلاقية؟","حسن الظن"]],"review":[],"activities":[{"t":"نشاط","d":"أكمل جدولًا للمذاهب الإسلامية (المؤسس، مكان الولادة، الوفاة، أشهر مؤلف)"},{"t":"نشاط","d":"اكتب مقالًا للإذاعة المدرسية عن التسامح واحترام الرأي الآخر"}],"quiz":[{"q":"مؤسس المذهب الإباضي:","choices":["مالك بن أنس","أبو حنيفة","أحمد بن حنبل","جابر بن زيد الأزدي"],"answer":3,"explain":"تابعي ولد في فرق بنزوى"},{"q":"ألف الإمام مالك بن أنس كتاب:","choices":["الموطأ","المسند","الأم","الرسالة"],"answer":0,"explain":"وولد في المدينة المنورة"},{"q":"ولد الإمام الشافعي في:","choices":["غزة","بغداد","الكوفة","المدينة"],"answer":0,"explain":"سنة ١٥٠هـ"},{"q":"اشتغل كثيرًا بالفقه التقديري:","choices":["أحمد بن حنبل","زيد بن علي","أبو حنيفة النعمان","مالك بن أنس"],"answer":2,"explain":"الفقه في قضايا يتوقع حدوثها"},{"q":"من الآداب الأخلاقية للاختلاف:","choices":["حسن الظن","تصيد الأخطاء","الغيبة","التعصب"],"answer":0,"explain":"وعدم محاكمة النيات"},{"q":"ألف الإمام أحمد بن حنبل كتاب:","choices":["الموطأ","المسند","صحيح البخاري","الفقه الأكبر"],"answer":1,"explain":"وولد في بغداد"},{"q":"ينسب المذهب الجعفري إلى:","choices":["الشافعي","جابر بن زيد","جعفر بن محمد الباقر","زيد بن علي"],"answer":2,"explain":"ودفن في البقيع"}]}],"pdfs":{"1-1":{"s":"الملخصات/1-1 نشأة الأرض.pdf"},"1-2":{"s":"الملخصات/1-2 العوامل الداخلية التي تسهم في تشكيل سطح الأرض.pdf"},"1-3":{"s":"الملخصات/1-3 الصخور.pdf"},"2-1":{"s":"الملخصات/2-1 التجوية.pdf"},"2-2":{"s":"الملخصات/2-2 التعرية الريحية.pdf"},"2-3":{"s":"الملخصات/2-3 التعرية المائية.pdf"},"2-4":{"s":"الملخصات/2-4 التعرية البحرية.pdf"},"3-1":{"s":"الملخصات/3-1 ظهور الإسلام وبناء الدولة الجديدة.pdf"},"3-2":{"s":"الملخصات/3-2 المدارس الفكرية في الإسلام.pdf"},"3-3":{"s":"الملخصات/3-3 المذاهب الإسلامية وتطورها التاريخي.pdf"}}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const APP = D.app, LS = D.lessons, LM = {};
LS.forEach((l, i) => { l._i = i; LM[l.id] = l; });
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AD = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AD[d]);
const lat = s => String(s).replace(/[٠-٩]/g, d => AD.indexOf(d));
const tmp = document.createElement('div');
const plain = h => { tmp.innerHTML = h; return (tmp.textContent || '').replace(/\s+/g, ' ').trim(); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const uniqBy = (a, f) => { const s = new Set(); return a.filter(x => { const k = f(x); if (s.has(k)) return false; s.add(k); return true; }); };

/* ---------- storage ---------- */
const KEY = 'tatbiq_' + APP.id;
let ST = { name: '', done: {}, fav: {}, notes: {}, scores: [], best: {}, points: 0, streak: { last: '', n: 0 }, known: {}, theme: 'auto', fs: 1, sound: true, rate: 0.9, last: '', badges: {}, quizzes: 0 };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) ST = Object.assign(ST, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} };
function applyPrefs() {
  const r = document.documentElement;
  if (ST.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', ST.theme);
  r.style.setProperty('--fs', ST.fs);
  $('#pts').textContent = '⭐ ' + ar(ST.points);
}
(function streak() {
  const d = new Date(), today = d.toISOString().slice(0, 10);
  const y = new Date(d - 864e5).toISOString().slice(0, 10);
  if (ST.streak.last !== today) { ST.streak.n = ST.streak.last === y ? ST.streak.n + 1 : 1; ST.streak.last = today; save(); }
})();

/* ---------- sound (short tones only, no music) ---------- */
let AC;
function beep(ok) {
  if (!ST.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = ok ? 'sine' : 'triangle'; o.frequency.value = ok ? 880 : 180;
    g.gain.setValueAtTime(0.12, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (ok ? 0.18 : 0.3));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.32);
  } catch (e) {}
}
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function toast(t, ms) { const e = document.createElement('div'); e.className = 'toast'; e.innerHTML = t; document.body.appendChild(e); setTimeout(() => e.remove(), ms || 2200); }
function addPts(n) { ST.points += n; save(); $('#pts').textContent = '⭐ ' + ar(ST.points); checkBadges(); }

/* ---------- confetti ---------- */
function confetti() {
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#a855f7', '#ec4899'];
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 4 + Math.random() * 6, c: pick(cols), vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3, a: Math.random() * 6 }));
  let t = 0;
  (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .1; x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); x.restore(); }); if (++t < 170) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}

/* ---------- speech ---------- */
function speak(text) {   text = String(text).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}\uFE0F\u200D\u20E3]/gu, ' ').replace(/\s+/g, ' ').trim();
  if (!('speechSynthesis' in window)) { toast('القراءة الصوتية غير مدعومة في هذا المتصفح'); return; }
  speechSynthesis.cancel();
  const en = (text.match(/[A-Za-z]/g) || []).length > (text.match(/[ء-ي]/g) || []).length;
  const u = new SpeechSynthesisUtterance(text); u.lang = en ? 'en-US' : 'ar-SA'; u.rate = ST.rate;
  const v = speechSynthesis.getVoices().find(v => (en ? /^en/i : /^ar/i).test(v.lang)); if (v) u.voice = v;
  else if (!en) toast('لا يوجد صوت عربي مثبت على الجهاز، قد تكون القراءة غير واضحة');
  speechSynthesis.speak(u);
}

/* ---------- question bank ---------- */
const unitOf = id => LM[id].unit;
const UNITS = D.units;
function numInfo(h) {
  if (/</.test(h)) return null;
  const p = plain(h);
  const m = p.match(/^([−\-⁻]?)\s*([0-9٠-٩]+(?:[,٫.][0-9٠-٩]+)?)(\s*[^\d٠-٩]{0,14})$/);
  if (!m) return null;
  const s = lat(m[2]).replace(/[,٫]/, '.'); const dec = (s.split('.')[1] || '').length;
  return { sign: m[1], n: parseFloat(s), dec, rest: m[3], sep: (m[2].match(/[,٫.]/) || [','])[0] };
}
function numFmt(info, v) {
  const neg = v < 0; v = Math.abs(v);
  let s = info.dec ? v.toFixed(info.dec).replace('.', info.sep) : String(Math.round(v));
  return (neg ? (info.sign || '−') : (v === 0 ? '' : '')) + ar(s) + info.rest;
}
function numDistractors(h, k) {
  const I = numInfo(h); if (!I) return null;
  const n = I.sign ? -I.n : I.n, st = I.dec ? Math.pow(10, -I.dec) : 1;
  let c = [n + st, n - st, n + 2 * st, n - 2 * st, n + 10 * st, n - 10 * st, n * 2, n + 5 * st, n - 3 * st];
  if (n !== 0 && Math.abs(n) >= 2) c.push(Math.round(n / 2));
  c = c.filter(v => v !== n && (n < 0 || v >= 0) && Math.abs(v - n) > 1e-9);
  c = uniqBy(c.map(v => +v.toFixed(I.dec)), v => v);
  return shuffle(c).slice(0, k).map(v => numFmt(I, v));
}
function mcq(q, ans, others, lid, explain, kind) {
  const ap = plain(ans);
  let ds = numDistractors(ans, 3);
  if (!ds || ds.length < 3) ds = (ds || []).concat(shuffle(uniqBy(others.filter(o => plain(o) !== ap && plain(o)), plain))).slice(0, 3);
  ds = uniqBy(ds, plain).filter(d => plain(d) !== ap).slice(0, 3);
  if (ds.length < 2) return null;
  const ch = shuffle([ans].concat(ds));
  return { q, choices: ch, answer: ch.indexOf(ans), explain: explain || '', lid, kind: kind || 'mcq' };
}
let BOLD = null;
function boldTerms() {
  if (BOLD) return BOLD; BOLD = {};
  LS.forEach(l => { const s = new Set(); textLines(l).forEach(h => (h.match(/<b>([^<]{2,30})<\/b>/g) || []).forEach(b => s.add(b.slice(3, -4).trim()))); BOLD[l.id] = [...s]; });
  return BOLD;
}
function textLines(l) { let a = [l.idea]; l.sections.forEach(s => a = a.concat(s.items)); return a.concat(l.tips || []).filter(Boolean); }
const POOLS = {};
function poolFor(ids) {
  const key = ids.join('|'); if (POOLS[key]) return POOLS[key];
  const all = []; const B = boldTerms();
  ids.forEach(id => {
    const l = LM[id], u = l.unit, sib = LS.filter(x => x.unit === u), grade = LS;
    l.quiz.forEach(q => all.push(Object.assign({ lid: id, kind: 'mcq' }, q)));
    const chkA = sib.flatMap(x => x.check.map(c => c[1]));
    l.check.forEach(c => { const q = mcq(c[0], c[1], chkA.length > 4 ? chkA : grade.flatMap(x => x.check.map(c => c[1])), id, '', 'check'); if (q) all.push(q); });
    const vM = sib.flatMap(x => x.vocab.map(v => v[1])).concat(grade.flatMap(x => x.vocab.map(v => v[1])));
    const vT = sib.flatMap(x => x.vocab.map(v => v[0])).concat(grade.flatMap(x => x.vocab.map(v => v[0])));
    l.vocab.forEach(v => {
      if (!plain(v[1])) return;
      const a = mcq('ما معنى «' + v[0] + '»؟', v[1], vM, id, '', 'vocab'); if (a) all.push(a);
      const b = mcq('أي مصطلح يعني: ' + v[1] + '؟', v[0], vT, id, '', 'vocab'); if (b) all.push(b);
    });
    const bt = B[id].concat(...sib.map(x => B[x.id])).concat(...LS.map(x => B[x.id]));
    textLines(l).forEach(h => {
      const p = plain(h); if (p.length > 170 || p.length < 15) return;
      const m = h.match(/<b>([^<]{2,30})<\/b>/); if (!m) return;
      const t = m[1].trim(); const qh = h.replace(m[0], '<span class="blank"></span>');
      if (plain(qh).length < 8) return;
      const q = mcq('أكمل الفراغ: ' + qh, t, bt, id, h, 'cloze'); if (q) all.push(q);
    });
    l.examples.forEach(e => { if (e.a && numInfo(e.a) && plain(e.q)) { const q = mcq(e.q, e.a, [], id, e.steps.join('<br>'), 'example'); if (q) all.push(q); } });
  });
  POOLS[key] = uniqBy(all, q => plain(q.q) + '|' + plain(q.choices[q.answer]));
  return POOLS[key];
}
function mixPool(P, n) {

/* ---------- mental math (math subjects) ---------- */
function gradeNo() { const m = { 'الأول': 1, 'الثاني': 2, 'الثالث': 3, 'الرابع': 4, 'الخامس': 5, 'السادس': 6, 'السابع': 7, 'الثامن': 8, 'التاسع': 9, 'العاشر': 10, 'الحادي عشر': 11, 'الثاني عشر': 12 }; const g = APP.grade.replace('الصف ', ''); return m[g] || 5; }

  const g = gradeNo(), r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  let q, a, t = r(0, 3);
  if (g <= 1) { if (t < 2) { const x = r(0, 10), y = r(0, 10 - x); q = `${x} + ${y}`; a = x + y; } else { const x = r(1, 10), y = r(0, x); q = `${x} − ${y}`; a = x - y; } }
  else if (g === 2) { if (t === 0) { const x = r(10, 60), y = r(1, 39); q = `${x} + ${y}`; a = x + y; } else if (t === 1) { const x = r(20, 99), y = r(1, x - 10); q = `${x} − ${y}`; a = x - y; } else { const x = pick([2, 5, 10]), y = r(1, 10); q = `${x} × ${y}`; a = x * y; } }
  else if (g <= 4) { if (t <= 1) { const x = r(2, 10), y = r(2, 10); q = `${x} × ${y}`; a = x * y; } else if (t === 2) { const y = r(2, 10), a0 = r(2, 10); q = `${a0 * y} ÷ ${y}`; a = a0; } else { const x = r(100, 900), y = r(10, 99); q = `${x} + ${y}`; a = x + y; } }
  else if (g <= 6) { if (t === 0) { const x = r(11, 25), y = r(2, 9); q = `${x} × ${y}`; a = x * y; } else if (t === 1) { const x = r(2, 12) * 10, y = r(2, 9); q = `${x} × ${y}`; a = x * y; } else if (t === 2) { const y = r(3, 12), a0 = r(3, 12); q = `${a0 * y} ÷ ${y}`; a = a0; } else { const x = r(1, 12); q = `${x}²`; a = x * x; } }
  else if (g <= 9) { if (t === 0) { const x = r(-15, 15), y = r(-15, 15); q = `${x < 0 ? '(−' + (-x) + ')' : x} + ${y < 0 ? '(−' + (-y) + ')' : y}`; a = x + y; } else if (t === 1) { const x = r(-9, 9), y = r(-9, 9); q = `${x < 0 ? '(−' + (-x) + ')' : x} × ${y < 0 ? '(−' + (-y) + ')' : y}`; a = x * y; } else if (t === 2) { const x = r(2, 15); q = `${x}²`; a = x * x; } else { const p = pick([10, 20, 25, 50]), n = pick([40, 60, 80, 120, 200, 300]); q = `${p}٪ من ${n}`; a = p * n / 100; } }
  else { if (t === 0) { const x = r(2, 20); q = `${x}²`; a = x * x; } else if (t === 1) { const b = pick([2, 3, 5]), e = r(2, b === 2 ? 8 : 4); q = `${b}^${e}`; a = Math.pow(b, e); } else if (t === 2) { const x = r(-9, 9), k = r(2, 6), c = r(-10, 10); q = `${k}س ${c < 0 ? '−' : '+'} ${Math.abs(c)} = ${k * x + c}  ⟵  س = ؟`; a = x; } else { const x = r(2, 12); q = `√${x * x}`; a = x; } }
  q = ar(q).replace(/\^([٠-٩]+)/, '<sup>$1</sup>').replace(/(-)(?=[٠-٩])/g, '−');
  const ans = (a < 0 ? '−' : '') + ar(Math.abs(a));
  let ds = uniqBy([a + 1, a - 1, a + 2, a - 2, a + 10, a - 10, a * 2, -a].filter(v => v !== a && (g >= 7 || v >= 0)), v => v);
  ds = shuffle(ds).slice(0, 3).map(v => (v < 0 ? '−' : '') + ar(Math.abs(v)));

}

  let deck, i = 0;

  const draw = () => {

    $('#no').onclick = () => { i++; draw(); };
  };
  $('#onlyNew').onchange = build; build();
};

function runQuiz(el, o) {
  // o: {ids, n, title, timer(sec total), tag, onEnd, mode:'exam'|'practice'}
  let pool = mixPool(poolFor(o.ids), o.n);
  const tf = o.withTF ? shuffle(tfFor(o.ids)).slice(0, Math.round(o.n * .25)) : [];
  let qs = pool.slice(0, o.n - tf.length).concat(tf.map(t => ({ q: 'صح أم خطأ؟<br>' + t.s, choices: ['✔ صح', '✘ خطأ'], answer: t.ok ? 0 : 1, explain: t.fix ? 'الصواب: ' + t.fix : '', lid: t.lid, kind: 'tf' })));
  qs = shuffle(qs);
  if (!qs.length) { el.innerHTML = '<div class="card mute">لا توجد أسئلة كافية لهذا الجزء بعد.</div>'; return; }
  let i = 0, right = 0, wrong = [], t0 = Date.now(), left = o.timer || 0, tick;
  const fin = () => {
    clearInterval(tick);
    const pc = Math.round(right / qs.length * 100);
    const lab = pc >= 90 ? 'ممتاز 🌟' : pc >= 75 ? 'جيد جدًا 👏' : pc >= 60 ? 'جيد 👍' : pc >= 50 ? 'مقبول 🙂' : 'تحتاج إلى مراجعة 💪';
    ST.scores.push({ tag: o.tag || '', t: o.title, s: right, n: qs.length, d: Date.now() }); if (ST.scores.length > 200) ST.scores.shift();
    ST.quizzes++; if (pc === 100) ST.badges.perfect = 1; if (o.exam) ST.badges.exam = 1;
    addPts(right * 5); save(); if (pc >= 75) { confetti(); beep(true); }
    el.innerHTML = `<div class="card" style="text-align:center"><h3>${esc(o.title)}</h3><div class="score">${ar(right)} / ${ar(qs.length)}</div><div style="font-size:1.3rem;font-weight:700">${lab}</div><div class="mute">النسبة ${ar(pc)}٪ · الوقت ${ar(Math.round((Date.now() - t0) / 1000))} ثانية · +${ar(right * 5)} نقطة</div>
     <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="again">🔁 أعد المحاولة</button></div></div>
     ${wrong.length ? `<h3>📌 راجع أخطاءك</h3>` + wrong.map(w => `<div class="card mis"><div class="q" style="font-size:1rem">${w.q.q}</div><div>❌ إجابتك: ${w.q.choices[w.c] || '—'}</div><div>✅ الصحيح: ${w.q.choices[w.q.answer]}</div>${w.q.explain ? `<div class="explain">${w.q.explain}</div>` : ''}${w.q.lid && LM[w.q.lid] ? `<a class="mute" href="#lesson/${encodeURIComponent(w.q.lid)}">📖 راجع درس ${ar(w.q.lid)}</a>` : ''}</div>`).join('') : ''}`;
    $('#again').onclick = () => runQuiz(el, o);
    o.onEnd && o.onEnd(right, qs.length);
  };
  const draw = () => {
    if (i >= qs.length) return fin();
    const q = qs[i];
    el.innerHTML = `<div class="card"><div class="prog"><span>سؤال ${ar(i + 1)} من ${ar(qs.length)}</span>${o.timer ? `<span class="timer" id="tm"></span>` : `<span>✔ ${ar(right)}</span>`}</div><div class="bar" style="margin-bottom:12px"><i style="width:${i / qs.length * 100}%"></i></div>
     <div class="q">${q.q}</div><div id="chs">${q.choices.map((c, k) => `<button class="ch" data-k="${k}">${c}</button>`).join('')}</div><div id="fb"></div></div>`;
    el.querySelectorAll('.ch').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.answer;
      el.querySelectorAll('.ch').forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add('ok'); });
      if (ok) { right++; b.classList.add('pop'); beep(true); } else { b.classList.add('bad', 'shake'); wrong.push({ q, c: k }); beep(false); vibrate(80); }
      const fb = el.querySelector('#fb');
      fb.innerHTML = `${!ok && q.explain && !o.exam ? `<div class="explain">${q.explain}</div>` : ''}<div style="text-align:center;margin-top:10px"><button class="btn" id="nx">${i + 1 < qs.length ? 'التالي ←' : 'النتيجة 🏁'}</button></div>`;
      el.querySelector('#nx').onclick = () => { i++; draw(); };
    });
    if (o.timer) showT();
  };
  const showT = () => { const e = el.querySelector('#tm'); if (e) e.textContent = '⏱ ' + ar(Math.floor(left / 60)) + ':' + ar(String(left % 60).padStart(2, '0')); };
  if (o.timer) { tick = setInterval(() => { left--; showT(); if (left <= 0) { toast('انتهى الوقت ⏰'); i = qs.length; draw(); } }, 1000); CLEAN = () => clearInterval(tick); }
  draw();
}

function rapid(el, getQ, o) {
  let score = 0, lives = o.lives || 0, left = o.time || 0, tick, qi = 0, q;
  const end = () => {
    clearInterval(tick); const k = o.key; const best = ST.best[k] || 0; if (score > best) { ST.best[k] = score; save(); confetti(); }
    addPts(score * 3);
    el.innerHTML = `<div class="card" style="text-align:center"><h3>${o.title}</h3><div class="score">${ar(score)}</div><p>${score > best ? '🎉 رقم قياسي جديد!' : 'رقمك القياسي: ' + ar(best)}</p><button class="btn" id="ag">🔁 مرة أخرى</button> <a class="btn sec" href="#compete" style="text-decoration:none">رجوع</a></div>`;
    $('#ag').onclick = () => rapid(el, getQ, o);
  };
  const draw = () => {
    q = getQ(qi++); if (!q) return end();
    el.innerHTML = `<div class="card"><div class="prog"><span>✔ ${ar(score)}</span>${o.time ? `<span class="timer" id="tm">⏱ ${ar(left)}</span>` : `<span>${'❤️'.repeat(lives)}${'🤍'.repeat(Math.max(0, o.lives - lives))}</span>`}</div><div class="q">${q.q}</div>${q.choices.map((c, k) => `<button class="ch" data-k="${k}">${c}</button>`).join('')}</div>`;
    el.querySelectorAll('.ch').forEach(b => b.onclick = () => {
      const ok = +b.dataset.k === q.answer;
      el.querySelectorAll('.ch').forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add('ok'); });
      if (ok) { score++; beep(true); } else { b.classList.add('bad'); beep(false); vibrate(80); if (o.lives) lives--; }
      setTimeout(() => { if (o.lives && lives <= 0) end(); else draw(); }, ok ? 350 : 900);
    });
  };
  if (o.time) { tick = setInterval(() => { left--; const t = el.querySelector('#tm'); if (t) t.textContent = '⏱ ' + ar(left); if (left <= 0) end(); }, 1000); CLEAN = () => clearInterval(tick); }
  draw();
}
function duel(ids) {
  const qs = mixPool(poolFor(ids), 10).slice(0, 10); if (qs.length < 3) return toast('لا توجد أسئلة كافية');
  ST.badges.duel = 1; save();
  const w = document.createElement('div'); w.className = 'duel'; document.body.appendChild(w);
  let i = 0, s = [0, 0], lock = [false, false], busy = false;
  const close = () => { w.remove(); CLEAN = null; };
  CLEAN = close;
  const half = (p, q) => `<div class="half p${p}"><div class="row"><b class="grow">${p === 1 ? '🔵 اللاعب الأول' : '🟣 اللاعب الثاني'}</b><b>${ar(s[p - 1])}</b></div><div class="q" style="font-size:1.02rem;margin:4px 0">${q.q}</div><div class="${lock[p - 1] ? 'lock' : ''}">${q.choices.map((c, k) => `<button class="ch" data-p="${p}" data-k="${k}">${c}</button>`).join('')}</div></div>`;
  const draw = () => {
    if (i >= qs.length) {
      const win = s[0] === s[1] ? 'تعادل! 🤝' : (s[0] > s[1] ? 'فاز اللاعب الأول 🔵🏆' : 'فاز اللاعب الثاني 🟣🏆');
      w.innerHTML = `<div class="half" style="text-align:center"><div class="score">${ar(s[0])} : ${ar(s[1])}</div><h2>${win}</h2><div><button class="btn" id="dx">إغلاق</button></div></div>`; confetti(); $('#dx').onclick = close; return;
    }
    const q = qs[i];
    w.innerHTML = half(2, q) + `<div class="mid"><span>الجولة ${ar(i + 1)} / ${ar(qs.length)}</span><button class="btn sm sec" id="dq" style="background:rgba(255,255,255,.25);color:#fff;border:0">✕ خروج</button></div>` + half(1, q);
    $('#dq').onclick = close;
    w.querySelectorAll('.ch').forEach(b => b.onclick = () => {
      if (busy) return; const p = +b.dataset.p, k = +b.dataset.k;
      if (k === q.answer) { busy = true; s[p - 1]++; beep(true); b.classList.add('ok'); setTimeout(() => { i++; lock = [false, false]; busy = false; draw(); }, 900); }
      else { b.classList.add('bad'); beep(false); lock[p - 1] = true; b.parentElement.classList.add('lock'); if (lock[0] && lock[1]) { busy = true; w.querySelectorAll(`.ch[data-k="${q.answer}"]`).forEach(x => x.classList.add('ok')); setTimeout(() => { i++; lock = [false, false]; busy = false; draw(); }, 1300); } }
    });
  };
  draw();
}

V.scramble = s => {

    const upd = () => $('#sl').textContent = built.map(k => mix[k].c).join('');

V.wheel = s => {
  const pool = shuffle(poolFor(scopeIds(s))); if (!pool.length) return set('<div class="card mute">لا توجد أسئلة.</div>');
  const segs = ['⭐ ١٠', '🎯 ٢٠', '💎 ٣٠', '⭐ ١٠', '🚀 ٥٠', '🎯 ٢٠', '🍀 ١٥', '💎 ٣٠'], val = [10, 20, 30, 10, 50, 20, 15, 30];
  const cols = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#a855f7', '#ec4899', '#14b8a6', '#f97316'];
  let rot = 0, k = 0;
  const svg = () => { let g = ''; for (let i = 0; i < 8; i++) { const a0 = (i * 45 - 90) * Math.PI / 180, a1 = ((i + 1) * 45 - 90) * Math.PI / 180, am = (i * 45 + 22.5 - 90) * Math.PI / 180; g += `<path d="M150 150 L${150 + 140 * Math.cos(a0)} ${150 + 140 * Math.sin(a0)} A140 140 0 0 1 ${150 + 140 * Math.cos(a1)} ${150 + 140 * Math.sin(a1)} Z" fill="${cols[i]}" stroke="#fff" stroke-width="3"/><text x="${150 + 95 * Math.cos(am)}" y="${150 + 95 * Math.sin(am)}" fill="#fff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${i * 45 + 22.5} ${150 + 95 * Math.cos(am)} ${150 + 95 * Math.sin(am)})">${segs[i]}</text>`; } return `<svg viewBox="0 0 300 300" width="290" height="290"><g id="wh" style="transition:transform 3.2s cubic-bezier(.17,.67,.2,1);transform-origin:150px 150px">${g}<circle cx="150" cy="150" r="26" fill="#fff"/><text x="150" y="152" text-anchor="middle" dominant-baseline="middle" font-size="22">🎡</text></g><polygon points="150,2 138,26 162,26" fill="#111827"/></svg>`; };
  set(`<h2>🎡 عجلة الأسئلة</h2><div class="card" style="text-align:center">${svg()}<div><button class="btn gold" id="spin">أدر العجلة 🎡</button></div></div><div id="wq"></div>`);
  $('#spin').onclick = () => {
    $('#spin').disabled = true; const r = Math.floor(Math.random() * 8); rot += 360 * 5 + (360 - r * 45 - 22.5) - (rot % 360); $('#wh').style.transform = `rotate(${rot}deg)`;
    setTimeout(() => {
      const q = pool[k++ % pool.length], pts = val[r];

  <div class="card"><h3>📲 تثبيت التطبيق</h3><p class="mute">ثبّت التطبيق ليظهر بين تطبيقات جهازك ويعمل بدون إنترنت.</p><button class="btn" onclick="A.install()">طريقة التثبيت</button></div>
  <div class="card"><h3>💾 بياناتي</h3><p class="mute">يُحفظ تقدمك على هذا الجهاز فقط.</p><div class="row"><button class="btn sec" onclick="A.exportP()">⬇️ حفظ نسخة من تقدمي</button><label class="btn sec">⬆️ استرجاع نسخة<input type="file" id="imp" accept=".json" hidden></label><button class="btn bad" onclick="A.reset()">🗑️ مسح التقدم</button></div></div>
  <div class="card mute">${esc(APP.subject)} · ${esc(APP.grade)} · ${esc(APP.term)}<br>المحتوى مبني على كتب سلطنة عُمان للفصل الدراسي الأول. صُمم التطبيق ليكون آمنًا للطلاب: بلا موسيقى، وبلا صور غير لائقة، وبلا إعلانات أو إنترنت.</div>`);
  $('#nm').oninput = e => { ST.name = e.target.value.trim(); save(); };
  $('#fs').oninput = e => { ST.fs = +e.target.value; save(); applyPrefs(); };
  $('#rt').oninput = e => { ST.rate = +e.target.value; save(); };
  $('#snd').onchange = e => { ST.sound = e.target.checked; save(); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { ST = Object.assign(ST, JSON.parse(t)); save(); applyPrefs(); toast('تم استرجاع التقدم ✔'); } catch (x) { toast('الملف غير صالح'); } }); };
};

/* ---------- install (PWA) ---------- */
let DEFER = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER = e; showInst(); });
window.addEventListener('appinstalled', () => { $('#inst').style.display = 'none'; toast('تم تثبيت التطبيق ✔'); });
function showInst() { let hid = false; try { hid = sessionStorage.getItem('instHide'); } catch (e) {} if (!standalone() && !hid) $('#inst').style.display = 'block'; }
function installHelp() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), file = location.protocol === 'file:';
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div class="card"><h3>📲 تثبيت التطبيق</h3>${file ? `<p>أنت تفتح التطبيق كملف من جهازك، وهو يعمل كاملًا بدون إنترنت هكذا. لتثبيته كأيقونة بين التطبيقات يجب فتحه من رابط ويب (مثلًا بعد رفع المجلد على موقع مجاني)، ثم:</p>` : ''}
   ${ios ? `<ol><li>اضغط زر المشاركة <b>⬆️</b> في أسفل متصفح سفاري.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.</li><li>اضغط <b>«إضافة»</b>.</li></ol>` :
     `<ol><li><b>أندرويد (كروم):</b> افتح القائمة <b>⋮</b> ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</li><li><b>آيفون وآيباد (سفاري):</b> زر المشاركة <b>⬆️</b> ثم «إضافة إلى الشاشة الرئيسية».</li><li><b>الكمبيوتر (كروم أو إيدج):</b> اضغط أيقونة التثبيت ⊕ في شريط العنوان.</li></ol>`}
   <div style="text-align:center"><button class="btn" onclick="this.closest('.sheet').remove()">حسنًا</button></div></div>`;
  s.onclick = e => { if (e.target === s) s.remove(); }; document.body.appendChild(s);
}
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- actions ---------- */
window.A = {
  go, install() { if (DEFER) { DEFER.prompt(); DEFER.userChoice.finally(() => DEFER = null); } else installHelp(); },
  hideInst() { $('#inst').style.display = 'none'; try { sessionStorage.setItem('instHide', 1); } catch (e) {} },
  tab(id, t) { history.replaceState(null, '', '#lesson/' + encodeURIComponent(id) + '|' + t); document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes("'" + t + "'"))); renderTab(LM[id], t); },
  toggleDone(id) { ST.done[id] = !ST.done[id]; if (ST.done[id]) { addPts(20); beep(true); toast('أحسنت! +٢٠ نقطة ⭐'); } save(); checkBadges(); route(); },
  fav(id) { ST.fav[id] = !ST.fav[id]; save(); toast(ST.fav[id] ? 'أضيف إلى المفضلة ⭐' : 'أزيل من المفضلة'); route(); },
  read() { speak(plain($('#lc').innerHTML)); },
  say(b) { speak(plain(b.closest('.voc').innerText)); },
  qday(i, b) { const q = A._qd; document.querySelectorAll('#qd .ch').forEach((x, k) => { x.disabled = true; if (k === q.answer) x.classList.add('ok'); }); if (i === q.answer) { addPts(10); beep(true); toast('إجابة صحيحة! +١٠ ⭐'); } else { b.classList.add('bad'); beep(false); } },
  quiz(sel, n, t, ex) { go('quiz/' + $('#' + sel).value + '~' + n + '~' + t + '~' + (ex || 0)); },
  printExam(sel) { printExam($('#' + sel).value); },
  worksheet(scope) { worksheet(scope.startsWith('l:') || scope.startsWith('u:') || scope === 'all' || scope === 'done' ? scope : 'l:' + scope); },
  minute(sel) { go('minute/' + $('#' + sel).value); }, survive(sel) { go('survive/' + $('#' + sel).value); }, mental() { go('mental'); },
  duel(sel) { duel(scopeIds($('#' + sel).value)); }, teams(sel) { go('teams/' + $('#' + sel).value + '~' + $('#tn').value); },
  game(g) { go(g + '/' + (ST.gscope || 'all')); },
  resetKnown(scope) { scopeIds(scope).forEach(id => Object.keys(ST.known).forEach(k => k.startsWith(id + '|') && delete ST.known[k])); save(); route(); },
  theme(t) { ST.theme = t; save(); applyPrefs(); route(); },
  exportP() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(ST)], { type: 'application/json' })); a.download = 'تقدمي_' + APP.id + '.json'; a.click(); },
  reset() { const s = document.createElement('div'); s.className = 'sheet'; s.innerHTML = `<div class="card"><h3>مسح كل التقدم؟</h3><p>ستُحذف النقاط والدروس المنجزة والنتائج والملاحظات من هذا الجهاز.</p><div class="row"><button class="btn bad" id="yy">نعم، امسح</button><button class="btn sec" onclick="this.closest('.sheet').remove()">إلغاء</button></div></div>`; document.body.appendChild(s); s.querySelector('#yy').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.hash = ''; location.reload(); }; }
};
window.addEventListener('hashchange', route);
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
applyPrefs(); route(); showInst();
if (location.protocol === 'file:' || /iphone|ipad|ipod/i.test(navigator.userAgent)) setTimeout(showInst, 800);
</script>
</body>
</html>
