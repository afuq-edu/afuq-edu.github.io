الطلبة حالات (تجاوز لوحة الصلصال، الهبوط خارج الحفرة) والقرار.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما المراحل الفنية للوثب الثلاثي؟\nالإجابة: الاقتراب، الارتقاءات (الحجلة، الخطوة، الوثبة)، الهبوط.\nس2 (المستوى المتوقع): إذا ارتقى الطالب باليمنى للحجلة، بأي قدم يؤدي الخطوة؟\nالإجابة: يهبط من الحجلة على اليمنى ويؤدي الخطوة ليهبط على اليسرى ثم الوثبة.\nس3 (المستوى المتقدم): ما الصفات البدنية اللازمة؟\nالإجابة: السرعة والقوة المميزة بالسرعة والمرونة والرشاقة.\n\nالحصة 2:\nس1 (مستوى الدعم): متى يرفع القاضي العلم الأحمر؟\nالإجابة: للمحاولة الخاطئة.\nس2 (المستوى المتوقع): من أين تقاس المسافة؟\nالإجابة: من لوحة الارتقاء إلى أقرب أثر للهبوط.\nس3 (المستوى المتقدم): كم المسافة بين لوحة الارتقاء وبداية الحفرة في المستوى الأول للمدرسة؟\nالإجابة: 6 أمتار.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الخطو على المراتب الثلاث.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا يُعلّم الوثب الثلاثي بالطريقة الكلية؟\nالإجابة: لارتباط أجزاء الحركة وإتقان إيقاع الوثبات الثلاث.\nس3 (المستوى المتقدم): ما مكونات ميدان الوثب الثلاثي؟\nالإجابة: طريق الاقتراب، لوحة الارتقاء، لوحة الصلصال، حفرة الوثب.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الوثب الثلاثي الكامل من اقتراب قصير.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر المراحل الفنية بالترتيب.\nالإجابة: الاقتراب، الحجلة، الخطوة، الوثبة، الهبوط.\nس3 (المستوى المتقدم): طالب هبط على قدم واحدة في الوثبة الأخيرة، ما القرار؟\nالإجابة: محاولة خاطئة لأن الهبوط يكون على القدمين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تدريبات الحجل بالتبادل في مكان آمن (دليل المعلم ص 16-19).\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الوثب الثلاثي (دليل المعلم ص 20-21، 26)."}}, {"title": "رمي الرمح من الوقوف (وضع الرمي)", "unit": "مسابقات الميدان (ألعاب القوى)", "week": "الرابع – الخامس", "date": "27/9-1/10/2026 إلى 4-8/10/2026", "pages": "دليل المعلم ص 22-29", "n": 2, "periods": [{"focus": "مسك الرمح وحمله والاستعداد والرمي من الوقوف", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الخصائص الفنية والقانونية لرمي الرمح (المسك من القبضة، عدم مواجهة الظهر لمنطقة الرمي، ملامسة مقدمة الرمح الأرض).\n2. يؤدي مسك الرمح وحمله فوق الكتف والرمي من وضع الوقوف (القدم اليسرى أمامًا).\n3. يرتب تسلسل حركة الرمي من الرجلين إلى الحوض فالجذع فالذراع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: رماح\n- أخرى: صولجانات أو عصي\n- أخرى: كرات تنس\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- رمي الرمح\n- القبضة\n- مركز الثقل\n- الحركة الكرباجية\n- وضع الرمي", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الرمح ويسأل: من أين نمسكه ولماذا؟ ويقدم الخصائص الفنية والقانونية (ص 22-23).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص: دوران الذراعين، رمي كرات التنس.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 23-24: الرمي من الوقوف والرجل اليسرى أمامًا بالصولجان ثم الرمح (سحب الذراع الرامية للخلف مع لف الكتف والحوض، اليد في مستوى الكتف وسن الرمح في مستوى العين، ميل الجذع، مد القدم اليمنى في اتجاه الرمي واندفاع الركبة، تقديم المرفق بحركة ضاربة ودوران الجذع)، ومسك الرمح بانزلاق الإصبعين إلى القبضة وحمله فوق الكتف في مستوى الجبهة.\n- الطالب: يقلد بالعصا ثم بالرمح.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات على خط رمي واحد بالإشارة: رمي الصولجان ثم الرمح من الوقوف لرشقه في الأرض المعشبة أمام الجسم، مع قواعد الأمان.\n- الطالب: يرمي بالإشارة.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يحلل الطلبة: لماذا تبدأ حركة الرمي من الرجلين لا من الذراع؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أين نمسك الرمح؟\nالإجابة: من القبضة عند مركز ثقله.\nس2 (المستوى المتوقع): أي قدم تتقدم للرامي الأيمن؟\nالإجابة: اليسرى.\nس3 (المستوى المتقدم): ما ترتيب اشتراك أجزاء الجسم في الرمي؟\nالإجابة: الرجلان ثم الحوض ثم الجذع ثم الذراع.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الرمي من الوقوف بالرمح.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر خاصية قانونية في رمي الرمح.\nالإجابة: لا يجوز أن يواجه ظهر الرامي منطقة الرمي.\nس3 (المستوى المتقدم): لماذا تسمى حركة اليد كرباجية؟\nالإجابة: لأن المرفق يتقدم أولًا ثم تلحق به اليد بسرعة كالكرباج.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في رمي الرمح ولا يستخدم أدوات مدببة خارج الحصة (دليل المعلم ص 22-24)."}}, {"focus": "مواصفات الرمح وميدانه والقواعد القانونية ومنافسة الرمي من الوقوف", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف مواصفات الرمح (الرأس، الجسم، المقبض، الوزن) وميدان الرمي.\n2. يؤدي رمي الرمح من الوقوف لأبعد مسافة داخل مقطع الرمي.\n3. يطبق القواعد القانونية ويقيس المسافة بالتعاون مع زملائه.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: رماح\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: أقماع\n- أخرى: استمارات تسجيل", "المفاهيم": "- مقطع الرمي\n- قوس الرمي\n- زاوية المقطع\n- المحاولة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الرمي من الوقوف ويعرض مواصفات الرمح وميدانه (ص 25) والاختبار المهاري (ص 26).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم مواصفات الرمح (رأس معدني مدبب، جسم، مقبض عند مركز الثقل، 600 جم للناشئين) وميدان الرمي (طريق الاقتراب 30-36.5 م بعرض 4 م، قوس نصف قطره 8 م، زاوية المقطع 29 درجة) والقواعد (الزمن المسموح دقيقتان، سقوط الرأس أولًا).\n- الطالب: يستمع ويرسم الميدان على السبورة.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بأدوار (حكم تراتيجية: التعلم التعاوني\n- المعلم: مجموعات بأدوار (حكم، قائس، مسجل): 3 محاولات لكل طالب من الوقوف مع القياس.\n- الطالب: يرمي ويحكم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة بين المجموعات بمجموع المسافات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): من أين نمسك الرمح؟\nالإجابة: من القبضة عند مركز ثقله.\nس2 (المستوى المتوقع): أي قدم تتقدم للرامي الأيمن؟\nالإجابة: اليسرى.\nس3 (المستوى المتقدم): ما ترتيب اشتراك أجزاء الجسم في الرمي؟\nالإجابة: الرجلان ثم الحوض ثم الجذع ثم الذراع.\n\nالحصة 2:\nس1 (مستوى الدعم): مم يتكون الرمح؟\nالإجابة: الرأس والجسم والمقبض.\nس2 (المستوى المتوقع): كم زاوية مقطع رمي الرمح؟\nالإجابة: 29 درجة.\nس3 (المستوى المتقدم): كم الزمن المسموح للرمية؟\nالإجابة: دقيقتان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الرمي من الوقوف بالرمح.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر خاصية قانونية في رمي الرمح.\nالإجابة: لا يجوز أن يواجه ظهر الرامي منطقة الرمي.\nس3 (المستوى المتقدم): لماذا تسمى حركة اليد كرباجية؟\nالإجابة: لأن المرفق يتقدم أولًا ثم تلحق به اليد بسرعة كالكرباج.\n\nالحصة 2:\nس1 (مستوى الدعم): ارمِ الرمح من الوقوف داخل المقطع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): متى تحتسب المحاولة صحيحة؟\nالإجابة: عند ملامسة مقدمة الرمح الأرض أولًا داخل المقطع دون تجاوز القوس.\nس3 (المستوى المتقدم): كم وزن رمح الناشئين؟\nالإجابة: 600 جم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في رمي الرمح ولا يستخدم أدوات مدببة خارج الحصة (دليل المعلم ص 22-24).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مراجعة مكونات ميدان الوثب الثلاثي ورمي الرمح (دليل المعلم ص 26-27) والاطلاع على كرة القدم (ص 30)."}}, {"title": "كتم الكرة بأسفل القدم", "unit": "كرة القدم (ذكور)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 30-34", "n": 1, "periods": [{"focus": "كتم الكرة بأسفل القدم (التدرج من إسقاط الكرة باليد إلى كرات الزميل)", " وة، سرعة رد الفعل، الجرأة) اللازمة للدفاع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- الوسائل المتعددة (سمعية - بصرية)", "المفاهيم": "- الدفاع عن الملعب\n- الوقفة العميقة\n- الساعدان\n- سرعة رد الفعل", "التهيئة / التمهيد / التعلم القبلي": "يضرب المعلم كرة قوية نحو طالب ويسأل: كيف نستقبلها دون أن ترتد بعيدًا؟ ويقدم الدفاع من أسفل (ص 58) مع تصويب النشرة: دون سقوط.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص مع تمرين القوة للرجلين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 59: من الوقوف وبالإشارة اتخاذ وقفة الاستعداد العميقة (زوايا الركبتين والفخذين حادة)، ضم اليدين ومد الذراعين واستقبال الكرة بالساعدين وتوجيهها عاليًا للأمام، دون سقوط، ثم تطبيق موجه بكرات مرمية خفيفة.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 59-60: ثلاثيات (مدافع، وقاذفان بالتوالي)، يدفع المدافع الكرة عاليًا للقاذف ويتبادل الأدوار بعد 10 كرات، ثم ضربات أقوى تدريجيًا.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الصد): نقطة لكل دفاع ناجح يصل للزميل.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم الدفاع باليدين من أسفل؟\nالإجابة: ضد الضربات الساحقة في النصف الخلفي من الملعب.\nس2 (المستوى المتوقع): كيف تكون زوايا الركبتين في وقفة الاستعداد العميقة؟\nالإجابة: حادة.\nس3 (المستوى المتقدم): إلى أين توجه الكرة بعد الدفاع؟\nالإجابة: عاليًا للأمام للزميل.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الدفاع باليدين من أسفل لعشر كرات مرمية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر صفتين بدنيتين يحتاجهما المدافع.\nالإجابة: القوة وسرعة رد الفعل.\nس3 (المستوى ال let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';

    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
</body>
</html>
