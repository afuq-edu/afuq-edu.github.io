<style>
@font-face{font-family:Taj;src:url(/assets/f/6231d7c967bf36a7.ttf) format('truetype');font-weight:400}@font-face{font-family:Taj;src:url(/assets/f/3028c3b3afa120de.ttf) format('truetype');font-weight:700}
:root{--acc:#6a4f9a;--soft:#cdbde6;--tint:#f5f1fb;--ink:#26333f;--mute:#6f7f8d;--line:#e3e9ef;--ok:#4f9d72;--bad:#c9727a;--warm:#d9a441}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Taj,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 85% -10%,var(--tint),transparent 60%),radial-gradient(900px 500px at -10% 110%,#f3f6ef,transparent 60%),#f8fafc;overflow-x:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.scr{display:none;min-height:100vh;padding:clamp(12px,2.5vw,28px)}
.scr.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* setup */
.setup{max-width:920px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.logo{width:54px;height:54px;border-radius:16px;background:#fff;border:1px solid var(--soft);display:grid;place-items:center}
.brand h1{margin:0;font-size:clamp(22px,3.4vw,34px)}
.brand p{margin:0;color:var(--mute)}
.step{background:#fffffff2;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.step h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:10px}
.step h2 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--acc);display:grid;place-items:center;font-size:15px;border:1px solid var(--soft)}
select,input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:15px;color:var(--ink);transition:.2s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--tint);width:44px;height:44px;font-size:22px;color:var(--acc)}
.stepper b{min-width:54px;text-align:center;font-size:22px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px}
.names div{display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
input[type=range]{width:min(420px,100%);accent-color:var(--acc)}
.qn{font-size:26px;font-weight:700;color:var(--acc);min-width:46px;text-align:center}
.avail{color:var(--mute);font-size:14px}
.go{display:block;width:100%;margin-top:6px;border:0;border-radius:16px;padding:16px;font-size:21px;font-weight:700;color:#fff;background:var(--acc);box-shadow:0 8px 24px -12px var(--acc)}
/* game */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto 10px}
.top .meta{flex:1;color:var(--mute);font-size:15px}
.top .meta b{color:var(--ink)}
.prog{height:6px;background:#e9eef3;border-radius:6px;max-width:1200px;margin:0 auto 14px;overflow:hidden}
.prog div{height:100%;background:var(--acc);width:0;transition:width .5s}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:14px;color:var(--ink)}
.stage{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.clock{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;text-align:center}
.ring{width:170px;height:170px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:700}
.ring .num small{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-top:-6px}
.pts{margin-top:8px;font-size:15px;color:var(--mute)}
.pts b{font-size:24px;color:var(--ink);display:block}
.ot{display:none;margin-top:6px;font-size:13px;color:#9a6a12;background:#fff7e3;border-radius:8px;padding:3px 6px}
.ot.show{display:block}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.4vw,28px)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:13px;border-radius:999px;padding:3px 12px;background:var(--tint);color:var(--acc);border:1px solid var(--soft)}
.diff{display:inline-flex;gap:3px;align-items:center}
.diff span{width:9px;height:9px;border-radius:50%;background:#dfe6ec}
.diff span.f{background:var(--acc)}
.qt{font-size:clamp(21px,2.6vw,33px);font-weight:700;line-height:1.6;margin:6px 0 18px}
.blank{display:inline-block;min-width:110px;border-bottom:3px dashed var(--acc);margin:0 6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;font-size:clamp(17px,2vw,24px);min-height:72px;transition:transform .15s,border-color .2s,background .2s}
.opt:hover{transform:translateY(-2px)}
.opt .k{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.opt.right{border-color:var(--ok);background:#eef8f2}
.opt.wrong{border-color:var(--bad);background:#fbefef}
.opt.dim{opacity:.45}
.who{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who span{color:var(--mute)}
.gchip{border:2px solid transparent;border-radius:999px;padding:6px 14px;background:#f2f5f8;font-size:15px;display:flex;align-items:center;gap:6px}
.gchip.on{background:#fff;border-color:var(--acc);font-weight:700;box-shadow:0 4px 14px -8px var(--acc)}
.skip{margin-inline-start:auto}
/* results */
.res{max-width:1100px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(16px,2.4vw,30px)}
.verdict{font-size:clamp(22px,3vw,32px);font-weight:700;margin:0}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.correct{color:var(--mute);margin:4px 0 14px;font-size:17px}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px);height:min(46vh,360px);padding:30px 10px 0;border-bottom:2px solid var(--line)}
.col{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}

.col .sc{font-weight:700;font-size:clamp(16px,2vw,22px);margin-bottom:4px}
.col .gain{position:absolute;top:-6px;font-size:14px;color:var(--ok);font-weight:700;opacity:0;transition:opacity .6s .9s}
.col.win .gain{opacity:1}
.col.win .bar{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--warm)}
.labels .rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--acc);border:1px solid var(--soft);font-size:14px;margin-left:6px}
.labels{display:flex;justify-content:center;gap:clamp(10px,3vw,40px);padding:8px 10px 0}
.labels div{flex:1;max-width:140px;text-align:center;font-size:clamp(14px,1.7vw,18px);font-weight:700}
.next{margin-top:18px}

.final{max-width:1000px;margin:0 auto;text-align:center}
.final h1{font-size:clamp(26px,4vw,42px);margin:6px 0 0}

canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
@media(max-width:820px){.stage{grid-template-columns:1fr}.clock{display:flex;align-items:center;gap:14px;justify-content:center}.ring{width:120px;height:120px;margin:0}.ring svg{width:120px;height:120px}.ring .num{font-size:32px}.opts{grid-template-columns:1fr}}
</style></head><body>
