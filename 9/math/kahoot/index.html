const AD=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const $=id=>document.getElementById(id);

const LESSONS=[];DATA.forEach(u=>u.lessons.forEach(l=>{l.unitName=u.name;LESSONS.push(l)}));
let S={li:0,pi:0,g:4,names:DEFN.slice(),qc:10,turnMode:"rot"};
let G=null,muted=false,AC=null;

/* ---------- audio (Web Audio, no files) ---------- */
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,t0,d,type="sine",v=.12){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
const SND={good:()=>{[523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.09,.5,"sine",.11));tone(1046.5,.3,.7,"triangle",.05)},
 bad:()=>{tone(311.13,0,.35,"sine",.09);tone(261.63,.16,.5,"sine",.08)},
 tick:()=>tone(880,0,.08,"sine",.03),
 chart:()=>{[392,493.88,587.33,783.99].forEach((f,i)=>tone(f,i*.12,.45,"triangle",.06))},
 end:()=>{[523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,i)=>tone(f,i*.16,.6,"sine",.08))}};
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇 مكتوم":"🔊 الصوت"};

/* ---------- setup ---------- */
function fillLessons(){const s=$("lesson");DATA.forEach(u=>{const g=document.createElement("optgroup");g.label="الوحدة "+AD(u.n)+": "+u.name;u.lessons.forEach(l=>{const o=document.createElement("option");o.value=LESSONS.indexOf(l);o.textContent=l.idAr+" "+l.title;g.appendChild(o)});s.appendChild(g)});s.onchange=()=>{S.li=+s.value;S.pi=0;drawPeriods()}}
function drawPeriods(){const L=LESSONS[S.li],P=$("plist");P.innerHTML="";L.periods.forEach((f,i)=>{const b=document.createElement("button");b.className="pbtn"+(i===S.pi?" on":"");const n=L.qs.filter(q=>q.p===i+1).length;b.innerHTML="<b>الحصة "+AD(i+1)+":</b> "+f+"<br><small>"+AD(n)+" سؤالًا لهذه الحصة · "+AD(L.qs.length)+" في الدرس</small>";b.onclick=()=>{S.pi=i;drawPeriods()};P.appendChild(b)})}
function drawGroups(){$("gCount").textContent=AD(S.g);const W=$("gnames");W.innerHTML="";for(let i=0;i<S.g;i++){const d=document.createElement("div");d.className="gname";d.innerHTML='<span class="dot" style="background:'+COLORS[i]+'"></span>';const inp=document.createElement("input");inp.type="text";inp.value=S.names[i];inp.maxLength=18;inp.oninput=()=>S.names[i]=inp.value||DEFN[i];d.appendChild(inp);W.appendChild(d)}}
$("gMinus").onclick=()=>{if(S.g>2){S.g--;drawGroups()}};$("gPlus").onclick=()=>{if(S.g<6){S.g++;drawGroups()}};
function drawQc(){$("qc").value=S.qc;$("qcLbl").textContent=AD(S.qc);document.querySelectorAll("#qchips button").forEach(b=>b.classList.toggle("on",+b.dataset.v===S.qc))}
[5,10,15,20].forEach(v=>{const b=document.createElement("button");b.dataset.v=v;b.textContent=AD(v);b.onclick=()=>{S.qc=v;drawQc()};$("qchips").appendChild(b)});
$("qc").oninput=e=>{S.qc=+e.target.value;drawQc()};
document.querySelectorAll("#turnMode button").forEach(b=>b.onclick=()=>{S.turnMode=b.dataset.m;document.querySelectorAll("#turnMode button").forEach(x=>x.classList.toggle("on",x===b))});

/* ---------- game ---------- */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pickQs(){const L=LESSONS[S.li],p=S.pi+1;const own=shuf(L.qs.filter(q=>q.p===p)),rest=shuf(L.qs.filter(q=>q.p!==p));
 const sel=own.concat(rest).slice(0,Math.min(S.qc,L.qs.length));return sel.map((q,i)=>({q,i})).sort((a,b)=>a.q.d-b.q.d||a.i-b.i).map(x=>x.q)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo({top:0,behavior:"smooth"})}
$("start").onclick=()=>{ac();const groups=[];for(let i=0;i<S.g;i++)groups.push({name:S.names[i]||DEFN[i],color:COLORS[i],score:0,last:0});
 G={L:LESSONS[S.li],qs:pickQs(),k:0,groups,turn:0,lastWinner:-1};askQ()};
$("replay").onclick=()=>$("start").onclick();
$("again").onclick=()=>{stopFx();show("sSetup")};

const DUR=30,OVER=30,MAXP=1000,MIDP=500,MINP=100;
function ptsAt(t){if(t<=DUR)return Math.round(MAXP-(MAXP-MIDP)*t/DUR);return Math.max(MINP,Math.round(MIDP-(MIDP-MINP)*(t-DUR)/OVER))}
let timerId=null,t0=0,answered=false,lastSec=-1;
function startTimer(){t0=performance.now();lastSec=-1;cancelAnimationFrame(timerId);const arc=$("arc");
 const loop=()=>{if(answered)return;const t=(performance.now()-t0)/1000;const left=Math.max(0,DUR-t);
  const frac=t<=DUR?left/DUR:0;arc.style.strokeDashoffset=(326.73*(1-frac)).toFixed(2);
  const col=t<=DUR?(left>10?"#2f7a70":left>5?"#d39b3a":"#cf6b6b"):"#b06a28";arc.style.stroke=col;
  if(t<=DUR){$("tsec").textContent=AD(Math.ceil(left));$("tlbl").textContent="ثانية";$("tsec").classList.remove("over")}
  else{$("tsec").textContent="+"+AD(Math.floor(t-DUR));$("tlbl").textContent="وقت إضافي";$("tsec").classList.add("over")}
  $("ptsnow").textContent="النقاط الآن: "+AD(ptsAt(t));$("ptsnow").classList.toggle("over",t>DUR);
  const s=Math.ceil(left);if(t<=DUR&&s<=5&&s!==lastSec&&s>0){lastSec=s;SND.tick()}
  timerId=requestAnimationFrame(loop)};loop()}
function curGroup(){return G.groups[G.turn]}
function drawTurn(){const g=curGroup();const T=$("turn");T.innerHTML='<span class="dot" style="background:'+g.color+'"></span> دور مجموعة: '+g.name;T.style.borderColor=g.color;
 const P=$("pick");P.innerHTML="";if(S.turnMode==="pick"&&!answered){G.groups.forEach((x,i)=>{const b=document.createElement("button");b.textContent=x.name;b.style.borderColor=i===G.turn?x.color:"transparent";b.style.background=i===G.turn?x.color+"33":"#fff";b.onclick=()=>{G.turn=i;drawTurn()};P.appendChild(b)})}}
function askQ(){answered=false;const q=G.qs[G.k];
 $("qnum").textContent="السؤال "+AD(G.k+1)+" من "+AD(G.qs.length);
 if(S.turnMode==="rot")G.turn=G.k%G.groups.length;
 drawTurn();$("qtype").textContent=TYPES[q.type];$("qdiff").textContent="★".repeat(q.d)+"☆".repeat(3-q.d);$("qtext").innerHTML=q.q;
 $("fb").textContent="";$("fb").className="feedback";$("expl").innerHTML="";$("toChart").style.display="none";
 const A=$("answers");A.innerHTML="";
 if(q.type==="mc"||q.type==="tf"){const opts=q.type==="tf"?[{h:"صواب ✓",ok:q.a===true},{h:"خطأ ✗",ok:q.a===false}]:shuf(q.o.map((h,i)=>({h,ok:i===q.a})));
  const W=document.createElement("div");W.className="opts";opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt c"+i;b.innerHTML='<span class="sh">'+SHAPES[i]+'</span><span>'+o.h+'</span>';b.onclick=()=>choose(o.ok,b,W);b.dataset.ok=o.ok?1:0;W.appendChild(b)});A.appendChild(W)}
 else{const W=document.createElement("div");W.className="fillbox";W.innerHTML='<button class="big alt" id="reveal">إظهار الإجابة</button><div class="ans" id="ansv"></div><div class="judge" id="judge"><button class="jy">✓ إجابة المجموعة صحيحة</button><button class="jn">✗ إجابة المجموعة خاطئة</button></div>';A.appendChild(W);
  $("reveal").onclick=()=>{if(answered)return;freeze();$("ansv").innerHTML=q.a;$("ansv").style.display="block";$("judge").style.display="flex";$("reveal").style.display="none"};
  W.querySelector(".jy").onclick=()=>finish(true);W.querySelector(".jn").onclick=()=>finish(false)}
 show("sQ");startTimer()}
let frozenT=0;
function freeze(){if(!answered){answered=true;frozenT=(performance.now()-t0)/1000;cancelAnimationFrame(timerId);drawTurn()}}
function choose(ok,b,W){if(answered)return;freeze();W.querySelectorAll(".opt").forEach(x=>{if(x.dataset.ok==="1")x.classList.add("right");else if(x===b)x.classList.add("wrong");else x.classList.add("dim")});finish(ok)}
let finished=false;
function finish(ok){if(G.done===G.k)return;G.done=G.k;const g=curGroup();const pts=ok?ptsAt(frozenT):0;G.groups.forEach(x=>x.last=0);g.last=pts;g.score+=pts;G.lastWinner=ok?G.turn:-1;
 const q=G.qs[G.k];$("fb").textContent=ok?"أحسنتم! +"+AD(pts)+" نقطة لمجموعة "+g.name:"إجابة غير صحيحة — ٠ نقطة";$("fb").className="feedback "+(ok?"good":"bad");
 if(q.x)$("expl").innerHTML=q.x;else if(!ok&&q.type!=="fill")$("expl").innerHTML="";
 if(q.type==="fill"){$("judge").style.display="none"}
 ok?SND.good():SND.bad();$("toChart").style.display="block"}
$("toChart").querySelector("button").onclick=()=>drawChart();
function drawChart(){$("cnum").textContent="بعد السؤال "+AD(G.k+1)+" من "+AD(G.qs.length);
 $("cwin").textContent=G.lastWinner>=0?"🏅 الفائزة بالسؤال: "+G.groups[G.lastWinner].name:"لم تُحتسب نقاط لهذا السؤال";
 const max=Math.max(1,...G.groups.map(g=>g.score));const order=G.groups.map((g,i)=>i).sort((a,b)=>G.groups[b].score-G.groups[a].score);
 const rank=i=>order.indexOf(i)+1;const C=$("chart"),N=$("cnames");C.innerHTML="";N.innerHTML="";
 G.groups.forEach((g,i)=>{const d=document.createElement("div");d.className="bar"+(i===G.lastWinner?" win":"");
  d.innerHTML='<div class="crown">👑</div><div class="gain">'+(g.last?"+"+AD(g.last):"")+'</div><div class="val">'+AD(g.score)+'</div><div class="col" style="background:linear-gradient(180deg,'+g.color+','+g.color+'cc)"></div>';C.appendChild(d);
  const n=document.createElement("div");n.innerHTML=g.name+'<br><span class="rank">المرتبة '+AD(rank(i))+'</span>';N.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.querySelector(".col").style.height=Math.max(6,Math.round(250*g.score/max))+"px"}))});
 $("nextQ").textContent=G.k+1<G.qs.length?"السؤال التالي ←":"إلى منصة التتويج 🏆";show("sChart");SND.chart()}
$("nextQ").onclick=()=>{G.k++;if(G.k<G.qs.length)askQ();else podium()};
function podium(){show("sEnd");const order=G.groups.slice().sort((a,b)=>b.score-a.score);$("endSub").textContent=G.L.idAr+" "+G.L.title+" · "+AD(G.qs.length)+" سؤالًا";
 const P=$("podium");P.innerHTML="";const pos=[1,0,2],H=[200,260,150],M=["🥈","🥇","🥉"];
 pos.forEach((r,k)=>{const g=order[r];if(!g)return;const d=document.createElement("div");d.className="pod";d.innerHTML='<div class="medal">'+M[k]+'</div><div class="nm">'+g.name+'</div><div class="sc">'+AD(g.score)+' نقطة</div><div class="blk" style="background:linear-gradient(180deg,'+g.color+','+g.color+'bb)">'+AD(r+1)+'</div>';P.appendChild(d);
  setTimeout(()=>{d.querySelector(".blk").style.height=H[k]+"px";d.classList.add("show")},150+k*250)});
 const O=$("others");O.innerHTML="";order.slice(3).forEach((g,i)=>{O.innerHTML+='<span class="pill">'+AD(i+4)+'. '+g.name+' — '+AD(g.score)+'</span>'});
 SND.end();confetti()}
/* calm confetti */
let fxId=null;function stopFx(){cancelAnimationFrame(fxId);const c=$("fx");c.getContext("2d").clearRect(0,0,c.width,c.height)}
function confetti(){const c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#9fd8c9","#b8cdf0","#f6d2a8","#e6bfdc","#c6e0a6","#f3c9c9","#f1e2a4"];
 const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.8,r:4+Math.random()*6,vy:.6+Math.random()*1.3,vx:-.4+Math.random()*.8,a:Math.random()*6.28,va:-.03+Math.random()*.06,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()<.5}));
 const st=performance.now();const loop=n=>{x.clearRect(0,0,c.width,c.height);const el=(n-st)/1000;ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((p.y+p.r)*.02)*.4;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,Math.min(1,(9-el)/2));x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.s)x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{x.beginPath();x.arc(0,0,p.r/2.2,0,6.28);x.fill()}x.restore()});
  if(el<9)fxId=requestAnimationFrame(loop);else stopFx()};fxId=requestAnimationFrame(loop)}
document.addEventListener("keydown",e=>{if($("sQ").classList.contains("on")&&!answered){const k=+e.key;const bs=document.querySelectorAll("#answers .opt");if(k>=1&&k<=bs.length)bs[k-1].click()}});
fillLessons();drawPeriods();drawGroups();drawQc();
</script>
