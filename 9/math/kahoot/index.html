:root{--bg1:#f4f8f7;--bg2:#eef3fb;--ink:#26343d;--mut:#6a7d88;--line:#dde7ea;--card:#ffffffd9;--teal:#2f7a70;--teal-l:#e3f2ee;
--g1:#7cc6b4;--g2:#8fb4e8;--g3:#f2b880;--g4:#d9a0c8;--g5:#a7c97f;--g6:#e8a2a2;
--o1:#e9f4fb;--o1d:#3f7fb3;--o2:#fbf0e6;--o2d:#b06a28;--o3:#eef7ec;--o3d:#4e8a40;--o4:#f6eef8;--o4d:#8c4f9a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Taj,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 85% -10%,#e2f1ec 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#e7ecfa 0,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
.bgshapes{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
.bgshapes span{position:absolute;font-weight:900;color:#cfe3de;font-size:6rem;animation:float 18s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(8deg)}}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 16px 30px;min-height:100%}
.screen{display:none;animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand h1{margin:0;font-size:clamp(1.3rem,2.6vw,2rem);color:var(--teal);font-weight:900}
.brand small{color:var(--mut);display:block;font-weight:400;font-size:.9rem}
.iconbtn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;cursor:pointer;color:var(--mut);display:inline-flex;gap:6px;align-items:center}
.box{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px -18px rgba(40,80,90,.35)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.step{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--teal);margin:0 0 10px}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--teal-l);display:inline-flex;align-items:center;justify-content:center}
select,input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pbtn{font:inherit;text-align:right;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;cursor:pointer;transition:.2s;color:var(--ink)}
.pbtn.on{border-color:var(--teal);background:var(--teal-l);box-shadow:0 0 0 3px #2f7a7022}
.pbtn small{color:var(--mut)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{font:inherit;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:1.3rem;cursor:pointer;color:var(--teal)}
.stepper b{font-size:1.6rem;min-width:36px;text-align:center}
.gnames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gname{display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 16px;cursor:pointer;color:var(--mut)}
.chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}
input[type=range]{width:100%;accent-color:var(--teal)}
.big{font:inherit;font-weight:900;font-size:1.25rem;border:0;border-radius:16px;padding:14px 34px;cursor:pointer;background:linear-gradient(135deg,#3f8f84,#2f7a70);color:#fff;box-shadow:0 10px 24px -10px #2f7a70;transition:.2s}
.big:hover{transform:translateY(-2px)}
.big.alt{background:#fff;color:var(--teal);border:1.5px solid var(--teal);box-shadow:none}
.center{text-align:center}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;color:var(--mut)}
.turn{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem;padding:6px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);transition:.3s}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{font:inherit;border:2px solid transparent;border-radius:999px;padding:4px 12px;cursor:pointer;background:#fff;font-weight:700;color:var(--ink)}
.qarea{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center;margin:18px 0}
.timer{position:relative;width:180px;height:180px;margin:auto}
.timer svg{transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .t b{font-size:2.8rem;line-height:1;font-weight:900}
.timer .t small{color:var(--mut);font-size:.85rem;margin-top:4px}
.ptsnow{margin-top:8px;text-align:center;font-weight:700;color:var(--teal)}
.over{color:#b06a28!important}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:0 14px 30px -20px rgba(40,80,90,.4)}
.qtype{display:inline-block;font-size:.85rem;font-weight:700;border-radius:8px;padding:2px 10px;background:var(--teal-l);color:var(--teal);margin-bottom:8px}
.qtext{font-size:clamp(1.25rem,2.4vw,2rem);font-weight:700;line-height:1.6}
.diff{float:left;color:#c9a227;letter-spacing:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-size:clamp(1.05rem,2vw,1.5rem);font-weight:700;text-align:right;border:2px solid transparent;border-radius:18px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .15s,box-shadow .2s,opacity .3s;min-height:74px;color:var(--ink)}
.opt:hover{transform:translateY(-2px)}
.opt .sh{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none;background:#fff}
.opt.c0{background:var(--o1)}.opt.c0 .sh{color:var(--o1d)}
.opt.c1{background:var(--o2)}.opt.c1 .sh{color:var(--o2d)}
.opt.c2{background:var(--o3)}.opt.c2 .sh{color:var(--o3d)}
.opt.c3{background:var(--o4)}.opt.c3 .sh{color:var(--o4d)}
.opt.right{border-color:#3c9a6a;box-shadow:0 0 0 4px #3c9a6a22;background:#e6f5ec}
.opt.wrong{border-color:#cf6b6b;background:#fbecec}
.opt.dim{opacity:.45}
.fillbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.ans{font-size:1.5rem;font-weight:900;color:#2f7a5a;background:#e9f6ef;border-radius:14px;padding:10px 22px;display:none}
.judge{display:none;gap:12px}
.judge button{font:inherit;font-weight:900;font-size:1.15rem;border:0;border-radius:14px;padding:12px 26px;cursor:pointer}
.jy{background:#e2f4ea;color:#2a7d50}.jn{background:#fbe9e9;color:#b44b4b}
.feedback{margin-top:14px;text-align:center;font-weight:900;font-size:1.35rem;min-height:2rem}
.feedback.good{color:#2f8a5c}.feedback.bad{color:#b45252}
.expl{color:var(--mut);font-size:1rem;margin-top:4px;text-align:center}
.next{text-align:center;margin-top:10px;display:none}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:330px;padding:10px 0 0;border-bottom:2px solid var(--line);margin-top:14px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:clamp(56px,11vw,120px);height:100%}
.bar .col{width:100%;border-radius:16px 16px 6px 6px;height:6px;transition:height 1.1s cubic-bezier(.2,.9,.2,1);position:relative;box-shadow:inset 0 -12px 18px -12px rgba(0,0,0,.15)}
.bar .val{font-weight:900;font-size:1.25rem;margin-bottom:6px}
.bar .gain{font-size:.85rem;font-weight:700;color:#2f8a5c;height:1.2rem}
.bar.win .col{box-shadow:0 0 0 4px #ffffff,0 0 0 7px #e8c35a,0 10px 24px -8px #e8c35a}
.bar .crown{font-size:1.6rem;height:2rem;opacity:0;transition:.5s .8s}
.bar.win .crown{opacity:1}
.names{display:flex;justify-content:center;gap:clamp(10px,3vw,34px);margin-top:8px}
.names div{width:clamp(56px,11vw,120px);text-align:center;font-weight:700;font-size:.95rem}
.rank{display:inline-block;margin-top:2px;font-size:.8rem;color:var(--mut)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:340px;margin-top:20px}
.pod{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:clamp(90px,18vw,170px)}
.pod .blk{width:100%;border-radius:18px 18px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:2.4rem;font-weight:900;color:#fff;height:0;transition:height 1.2s cubic-bezier(.2,.9,.2,1)}
.pod .nm{font-weight:900;font-size:1.2rem;margin-bottom:4px;opacity:0;transition:.6s 1s}
.pod .sc{color:var(--mut);margin-bottom:8px;opacity:0;transition:.6s 1.2s}
.pod.show .nm,.pod.show .sc{opacity:1}
.medal{font-size:2.2rem;opacity:0;transform:scale(.4);transition:.6s 1.3s}
.pod.show .medal{opacity:1;transform:none}
.others{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.qarea{grid-template-columns:1fr}.timer{width:140px;height:140px}.opts{grid-template-columns:1fr}.gnames{grid-template-columns:1fr}}
</style>
</head>

<main>

<section class="screen on" id="sSetup">
 <div class="grid2">

   <div class="gnames" id="gnames"></div>

   <input type="range" id="qc" min="1" max="20" value="10">
   <div class="chips" id="qchips"></div>
   <div class="step" style="margin-top:16px"><i>٥</i>من يجيب؟</div>

 </div>
 <div class="center" style="margin-top:18px"><button class="big" id="start">ابدأ المسابقة ✦</button></div>
</section>

<section class="screen" id="sQ">

  <div class="pick" id="pick"></div>
 </div>
 <div class="qarea">
  <div>

 <div id="answers"></div>
 <div class="feedback" id="fb"></div><div class="expl" id="expl"></div>
 <div class="next" id="toChart"><button class="big">عرض النتائج ←</button></div>
</section>

<!-- CHART -->
<section class="screen" id="sChart">
 <div class="box">
  <div class="qtop"><span class="pill" id="cnum"></span><span class="pill" id="cwin"></span></div>
  <div class="chart" id="chart"></div>
  <div class="names" id="cnames"></div>
 </div>
 <div class="center" style="margin-top:16px"><button class="big" id="nextQ">السؤال التالي ←</button></div>
</section>

<!-- PODIUM -->
<section class="screen" id="sEnd">
 <div class="box center">
  <h2 style="margin:4px 0;color:var(--teal);font-size:1.8rem">منصة التتويج</h2>

  <div class="podium" id="podium"></div>
  <div class="others" id="others"></div>
 </div>
 <div class="center" style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="big" id="again">مسابقة جديدة</button><button class="big alt" id="replay">إعادة نفس الإعدادات</button></div>
</section>

const AD=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const $=id=>document.getElementById(id);
const COLORS=["#7cc6b4","#8fb4e8","#f2b880","#d9a0c8","#a7c97f","#e8a2a2"];
const DEFN=["الصقور","النجوم","المجرّات","القمم","البراعم","الرواد"];
const SHAPES=["▲","◆","●","■"];
const TYPES={mc:"اختيار من متعدد",tf:"صواب أم خطأ",fill:"أكمل"};
const LESSONS=[];DATA.forEach(u=>u.lessons.forEach(l=>{l.unitName=u.name;LESSONS.push(l)}));
let S={li:0,pi:0,g:4,names:DEFN.slice(),qc:10,turnMode:"rot"};
let G=null,muted=false,AC=null;

/* ---------- audio (Web Audio, no files) ---------- */
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,t0,d,type="sine",v=.12){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
const SND={good:()=>{[523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.09,.5,"sine",.11));tone(1046.5,.3,.7,"triangle",.05)},
 bad:()=>{tone(311.13,0,.35,"sine",.09);tone(261.63,.16,.5,"sine",.08)},
 tick:()=>tone(880,0,.08,"sine",.03),
 chart:()=>{[392,493.88,587.33,783.99].forEach((f,i)=>tone(f,i*.12,.45,"triangle",.06))},
 end:()=>{[523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,i)=>tone(f,i*.16,.6,"sine",.08))}};
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇 مكتوم":"🔊 الصوت"};

/* ---------- setup ---------- */
function fillLessons(){const s=$("lesson");DATA.forEach(u=>{const g=document.createElement("optgroup");g.label="الوحدة "+AD(u.n)+": "+u.name;u.lessons.forEach(l=>{const o=document.createElement("option");o.value=LESSONS.indexOf(l);o.textContent=l.idAr+" "+l.title;g.appendChild(o)});s.appendChild(g)});s.onchange=()=>{S.li=+s.value;S.pi=0;drawPeriods()}}
function drawPeriods(){const L=LESSONS[S.li],P=$("plist");P.innerHTML="";L.periods.forEach((f,i)=>{const b=document.createElement("button");b.className="pbtn"+(i===S.pi?" on":"");const n=L.qs.filter(q=>q.p===i+1).length;b.innerHTML="<b>الحصة "+AD(i+1)+":</b> "+f+"<br><small>"+AD(n)+" سؤالًا لهذه الحصة · "+AD(L.qs.length)+" في الدرس</small>";b.onclick=()=>{S.pi=i;drawPeriods()};P.appendChild(b)})}
function drawGroups(){$("gCount").textContent=AD(S.g);const W=$("gnames");W.innerHTML="";for(let i=0;i<S.g;i++){const d=document.createElement("div");d.className="gname";d.innerHTML='<span class="dot" style="background:'+COLORS[i]+'"></span>';const inp=document.createElement("input");inp.type="text";inp.value=S.names[i];inp.maxLength=18;inp.oninput=()=>S.names[i]=inp.value||DEFN[i];d.appendChild(inp);W.appendChild(d)}}
$("gMinus").onclick=()=>{if(S.g>2){S.g--;drawGroups()}};$("gPlus").onclick=()=>{if(S.g<6){S.g++;drawGroups()}};
function drawQc(){$("qc").value=S.qc;$("qcLbl").textContent=AD(S.qc);document.querySelectorAll("#qchips button").forEach(b=>b.classList.toggle("on",+b.dataset.v===S.qc))}
[5,10,15,20].forEach(v=>{const b=document.createElement("button");b.dataset.v=v;b.textContent=AD(v);b.onclick=()=>{S.qc=v;drawQc()};$("qchips").appendChild(b)});
$("qc").oninput=e=>{S.qc=+e.target.value;drawQc()};
document.querySelectorAll("#turnMode button").forEach(b=>b.onclick=()=>{S.turnMode=b.dataset.m;document.querySelectorAll("#turnMode button").forEach(x=>x.classList.toggle("on",x===b))});

/* ---------- game ---------- */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pickQs(){const L=LESSONS[S.li],p=S.pi+1;const own=shuf(L.qs.filter(q=>q.p===p)),rest=shuf(L.qs.filter(q=>q.p!==p));
 const sel=own.concat(rest).slice(0,Math.min(S.qc,L.qs.length));return sel.map((q,i)=>({q,i})).sort((a,b)=>a.q.d-b.q.d||a.i-b.i).map(x=>x.q)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo({top:0,behavior:"smooth"})}
$("start").onclick=()=>{ac();const groups=[];for(let i=0;i<S.g;i++)groups.push({name:S.names[i]||DEFN[i],color:COLORS[i],score:0,last:0});
 G={L:LESSONS[S.li],qs:pickQs(),k:0,groups,turn:0,lastWinner:-1};askQ()};
$("replay").onclick=()=>$("start").onclick();
$("again").onclick=()=>{stopFx();show("sSetup")};

const DUR=30,OVER=30,MAXP=1000,MIDP=500,MINP=100;
function ptsAt(t){if(t<=DUR)return Math.round(MAXP-(MAXP-MIDP)*t/DUR);return Math.max(MINP,Math.round(MIDP-(MIDP-MINP)*(t-DUR)/OVER))}
let timerId=null,t0=0,answered=false,lastSec=-1;
function startTimer(){t0=performance.now();lastSec=-1;cancelAnimationFrame(timerId);const arc=$("arc");
 const loop=()=>{if(answered)return;const t=(performance.now()-t0)/1000;const left=Math.max(0,DUR-t);
  const frac=t<=DUR?left/DUR:0;arc.style.strokeDashoffset=(326.73*(1-frac)).toFixed(2);
  const col=t<=DUR?(left>10?"#2f7a70":left>5?"#d39b3a":"#cf6b6b"):"#b06a28";arc.style.stroke=col;
  if(t<=DUR){$("tsec").textContent=AD(Math.ceil(left));$("tlbl").textContent="ثانية";$("tsec").classList.remove("over")}
  else{$("tsec").textContent="+"+AD(Math.floor(t-DUR));$("tlbl").textContent="وقت إضافي";$("tsec").classList.add("over")}
  $("ptsnow").textContent="النقاط الآن: "+AD(ptsAt(t));$("ptsnow").classList.toggle("over",t>DUR);
  const s=Math.ceil(left);if(t<=DUR&&s<=5&&s!==lastSec&&s>0){lastSec=s;SND.tick()}
  timerId=requestAnimationFrame(loop)};loop()}
function curGroup(){return G.groups[G.turn]}
function drawTurn(){const g=curGroup();const T=$("turn");T.innerHTML='<span class="dot" style="background:'+g.color+'"></span> دور مجموعة: '+g.name;T.style.borderColor=g.color;
 const P=$("pick");P.innerHTML="";if(S.turnMode==="pick"&&!answered){G.groups.forEach((x,i)=>{const b=document.createElement("button");b.textContent=x.name;b.style.borderColor=i===G.turn?x.color:"transparent";b.style.background=i===G.turn?x.color+"33":"#fff";b.onclick=()=>{G.turn=i;drawTurn()};P.appendChild(b)})}}
function askQ(){answered=false;const q=G.qs[G.k];
 $("qnum").textContent="السؤال "+AD(G.k+1)+" من "+AD(G.qs.length);
 if(S.turnMode==="rot")G.turn=G.k%G.groups.length;
 drawTurn();$("qtype").textContent=TYPES[q.type];$("qdiff").textContent="★".repeat(q.d)+"☆".repeat(3-q.d);$("qtext").innerHTML=q.q;
 $("fb").textContent="";$("fb").className="feedback";$("expl").innerHTML="";$("toChart").style.display="none";
 const A=$("answers");A.innerHTML="";
 if(q.type==="mc"||q.type==="tf"){const opts=q.type==="tf"?[{h:"صواب ✓",ok:q.a===true},{h:"خطأ ✗",ok:q.a===false}]:shuf(q.o.map((h,i)=>({h,ok:i===q.a})));
  const W=document.createElement("div");W.className="opts";opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt c"+i;b.innerHTML='<span class="sh">'+SHAPES[i]+'</span><span>'+o.h+'</span>';b.onclick=()=>choose(o.ok,b,W);b.dataset.ok=o.ok?1:0;W.appendChild(b)});A.appendChild(W)}
 else{const W=document.createElement("div");W.className="fillbox";W.innerHTML='<button class="big alt" id="reveal">إظهار الإجابة</button><div class="ans" id="ansv"></div><div class="judge" id="judge"><button class="jy">✓ إجابة المجموعة صحيحة</button><button class="jn">✗ إجابة المجموعة خاطئة</button></div>';A.appendChild(W);
  $("reveal").onclick=()=>{if(answered)return;freeze();$("ansv").innerHTML=q.a;$("ansv").style.display="block";$("judge").style.display="flex";$("reveal").style.display="none"};
  W.querySelector(".jy").onclick=()=>finish(true);W.querySelector(".jn").onclick=()=>finish(false)}
 show("sQ");startTimer()}
let frozenT=0;
function freeze(){if(!answered){answered=true;frozenT=(performance.now()-t0)/1000;cancelAnimationFrame(timerId);drawTurn()}}
function choose(ok,b,W){if(answered)return;freeze();W.querySelectorAll(".opt").forEach(x=>{if(x.dataset.ok==="1")x.classList.add("right");else if(x===b)x.classList.add("wrong");else x.classList.add("dim")});finish(ok)}
let finished=false;
function finish(ok){if(G.done===G.k)return;G.done=G.k;const g=curGroup();const pts=ok?ptsAt(frozenT):0;G.groups.forEach(x=>x.last=0);g.last=pts;g.score+=pts;G.lastWinner=ok?G.turn:-1;
 const q=G.qs[G.k];$("fb").textContent=ok?"أحسنتم! +"+AD(pts)+" نقطة لمجموعة "+g.name:"إجابة غير صحيحة — ٠ نقطة";$("fb").className="feedback "+(ok?"good":"bad");
 if(q.x)$("expl").innerHTML=q.x;else if(!ok&&q.type!=="fill")$("expl").innerHTML="";
 if(q.type==="fill"){$("judge").style.display="none"}
 ok?SND.good():SND.bad();$("toChart").style.display="block"}
$("toChart").querySelector("button").onclick=()=>drawChart();
function drawChart(){$("cnum").textContent="بعد السؤال "+AD(G.k+1)+" من "+AD(G.qs.length);
 $("cwin").textContent=G.lastWinner>=0?"🏅 الفائزة بالسؤال: "+G.groups[G.lastWinner].name:"لم تُحتسب نقاط لهذا السؤال";
 const max=Math.max(1,...G.groups.map(g=>g.score));const order=G.groups.map((g,i)=>i).sort((a,b)=>G.groups[b].score-G.groups[a].score);
 const rank=i=>order.indexOf(i)+1;const C=$("chart"),N=$("cnames");C.innerHTML="";N.innerHTML="";
 G.groups.forEach((g,i)=>{const d=document.createElement("div");d.className="bar"+(i===G.lastWinner?" win":"");
  d.innerHTML='<div class="crown">👑</div><div class="gain">'+(g.last?"+"+AD(g.last):"")+'</div><div class="val">'+AD(g.score)+'</div><div class="col" style="background:linear-gradient(180deg,'+g.color+','+g.color+'cc)"></div>';C.appendChild(d);
  const n=document.createElement("div");n.innerHTML=g.name+'<br><span class="rank">المرتبة '+AD(rank(i))+'</span>';N.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.querySelector(".col").style.height=Math.max(6,Math.round(250*g.score/max))+"px"}))});
 $("nextQ").textContent=G.k+1<G.qs.length?"السؤال التالي ←":"إلى منصة التتويج 🏆";show("sChart");SND.chart()}
$("nextQ").onclick=()=>{G.k++;if(G.k<G.qs.length)askQ();else podium()};
function podium(){show("sEnd");const order=G.groups.slice().sort((a,b)=>b.score-a.score);$("endSub").textContent=G.L.idAr+" "+G.L.title+" · "+AD(G.qs.length)+" سؤالًا";
 const P=$("podium");P.innerHTML="";const pos=[1,0,2],H=[200,260,150],M=["🥈","🥇","🥉"];
 pos.forEach((r,k)=>{const g=order[r];if(!g)return;const d=document.createElement("div");d.className="pod";d.innerHTML='<div class="medal">'+M[k]+'</div><div class="nm">'+g.name+'</div><div class="sc">'+AD(g.score)+' نقطة</div><div class="blk" style="background:linear-gradient(180deg,'+g.color+','+g.color+'bb)">'+AD(r+1)+'</div>';P.appendChild(d);
  setTimeout(()=>{d.querySelector(".blk").style.height=H[k]+"px";d.classList.add("show")},150+k*250)});
 const O=$("others");O.innerHTML="";order.slice(3).forEach((g,i)=>{O.innerHTML+='<span class="pill">'+AD(i+4)+'. '+g.name+' — '+AD(g.score)+'</span>'});
 SND.end();confetti()}
/* calm confetti */
let fxId=null;function stopFx(){cancelAnimationFrame(fxId);const c=$("fx");c.getContext("2d").clearRect(0,0,c.width,c.height)}
function confetti(){const c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#9fd8c9","#b8cdf0","#f6d2a8","#e6bfdc","#c6e0a6","#f3c9c9","#f1e2a4"];
 const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.8,r:4+Math.random()*6,vy:.6+Math.random()*1.3,vx:-.4+Math.random()*.8,a:Math.random()*6.28,va:-.03+Math.random()*.06,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()<.5}));
 const st=performance.now();const loop=n=>{x.clearRect(0,0,c.width,c.height);const el=(n-st)/1000;ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((p.y+p.r)*.02)*.4;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,Math.min(1,(9-el)/2));x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.s)x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{x.beginPath();x.arc(0,0,p.r/2.2,0,6.28);x.fill()}x.restore()});
  if(el<9)fxId=requestAnimationFrame(loop);else stopFx()};fxId=requestAnimationFrame(loop)}

fillLessons();drawPeriods();drawGroups();drawQc();
