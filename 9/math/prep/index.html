لم المبني على اللعب.\n\n6. تقويم تكويني: يطرح المعلم الأسئلة المتدرجة، والطلبة يجيبون على السبورات الصغيرة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: المضاعف المشترك الأصغر والعامل المشترك الأكبر وقواعد قابلية القسمة — زمن الحصة 40 دقيقة\n\n1. التهيئة: مسألة السباق: يعرض المعلم المسألة ويجمع التخمينات دون تصحيح، والطلبة يخمّنون ويبرّرون تخميناتهم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. (م م ص) و(ع م ك): ينمذج المعلم الأمثلة ص ٢١–٢٢: (م م ص) لـ ١٢ و ١٨ بالقوائم وبالعوامل الأولية، و(ع م ك) لـ ١٦٨ و ١٨٠ بالعوامل الأولية، والطلبة يسجّلون الخطوات ويطبّقونها على تمارين ١-٢-ج سؤال (١) و(٢) فقرات مختارة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. طبّق مهاراتك: يقود المعلم حل مسائل ص ٢٣ (الإذاعة، فاطمة وسعيد، سعاد وليلى) ويطرح سؤال: هل المسألة (م م ص) أم (ع م ك)؟ وتحل كل مجموعة مسألة وتعرضها مع التبرير، ثم يعودون لمسألة السباق ويتحققون من تخمينهم (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. قواعد قابلية القسمة: يعرض المعلم القواعد ص ٢٣–٢٤ بمثال لكل قاعدة، والطلبة يحلّون تمارين ١-٢-د سؤال (١) و(٢) ص ٢٤ بطريقة «فحص سريع» ضمن تحدٍّ زمني (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تقويم تكويني: يطرح المعلم الأسئلة المتدرجة، والطلبة يجيبون شفهيًا وكتابيًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. يختار المعلم الدرس والحصة وعدد الأسئلة، ويدير التناوب بين المجموعات، وتجيب كل مجموعة عن سؤالها في دورها خلال الزمن، وتتابع ترتيبها على مخطط الأعمدة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة ١: الأعداد الأولية والتحليل إلى العوامل الأولية\n١) [مستوى المعرفة] هل العدد ٢١ أولي؟ لماذا؟\n   الإجابة النموذجية: ليس أوليًا لأن له أكثر من عاملين: ١، ٣، ٧، ٢١.\n٢) [مستوى التطبيق] اكتب العدد ٨٤ في صورة ناتج ضرب عوامله الأولية.\n   الإجابة النموذجية: ٨٤ = ٢ × ٢ × ٣ × ٧\n٣) [مستوى الاستدلال] اكتب العدد ٦٠ مجموع عددين أوليين بطريقتين مختلفتين.\n   الإجابة النموذجية: ٦٠ = ٧ + ٥٣ = ١٣ + ٤٧ (أو ١٧ + ٤٣ ، ١٩ + ٤١ ، ٢٣ + ٣٧ ، ٢٩ + ٣١).\n\nالحصة ٢: المضاعف المشترك الأصغر والعامل المشترك الأكبر وقواعد قابلية القسمة\n١) [مستوى المعر const FN=(window.AFUQ35||function(x){return x})(["المخرجات التعليمية","المستوى المعرفي","الاستراتيجيات","المصادر التعليمية","المفاهيم","التهيئة / التمهيد / التعلم القبلي","إجراءات سير الدرس / الأنشطة التدريسية","التقويم التكويني","التقويم الختامي","ملاحظات ضمن خطة الدراسة الأسبوعية"]);
const KC=["k1","k2","k4","k4","k2","k1","k3","k5","k5","k1"];
const AD=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
let mode="sep",li=0,pi=0;
const $=id=>document.getElementById(id);
const lessons=[];DATA.forEach(u=>u.lessons.forEach(l=>{l.unit=u;lessons.push(l)}));
(function fill(){const s=$("ls");DATA.forEach(u=>{const g=document.createElement("optgroup");g.label="الوحدة "+AD(u.n)+": "+u.name;u.lessons.forEach(l=>{const o=document.createElement("option");o.value=lessons.indexOf(l);o.textContent=l.idAr+" "+l.title;g.appendChild(o)});s.appendChild(g)});s.onchange=()=>{li=+s.value;pi=0;render()}})();
$("mSep").onclick=()=>{mode="sep";render()};$("mCom").onclick=()=>{mode="com";render()};
function render(){
 $("mSep").classList.toggle("on",mode==="sep");$("mCom").classList.toggle("on",mode==="com");
 $("status").textContent=mode==="sep"?"أنت الآن في الوضع المنفصل: نموذج لكل حصة":"أنت الآن في الوضع المدمج: نموذج واحد للدرس كله";
 const L=lessons[li];const T=$("tabs");T.innerHTML="";
 if(mode==="sep"){L.periods.forEach((p,i)=>{const b=document.createElement("button");b.textContent="الحصة "+AD(p.n)+": "+p.focus;if(i===pi)b.className="on";b.onclick=()=>{pi=i;render()};T.appendChild(b)});T.style.display="flex"}else T.style.display="none";
 const m=[["الوحدة",L.unit.name],["الأسبوع",L.week+" ("+L.date+")"],["كتاب الطالب",L.sb],["كتاب النشاط",L.ab],["دليل المعلم",L.tb],["عدد الحصص",AD(L.periods.length)]];
 $("meta").innerHTML=m.map(x=>"<span>"+x[0]+": <b>"+x[1]+"</b></span>").join("");
 const fields=mode==="sep"?L.periods[pi].fields:L.combined;
 const C=$("cards");C.innerHTML="";
 fields.forEach((t,i)=>{const d=document.createElement("div");d.className="card "+KC[i];
  d.innerHTML='<div class="ch"><h3><span class="n">'+AD(i+1)+'</span>'+FN[i]+'</h3><button class="cp">نسخ</button></div><div class="cb"></div>';
  d.querySelector(".cb").textContent=t;
  const b=d.querySelector(".cp");b.onclick=()=>copy(t,b,d.querySelector(".cb"));C.appendChild(d)});
}
function done(b){b.textContent="تم النسخ ✓";b.classList.add("ok");setTimeout(()=>{b.textContent="نسخ";b.classList.remove("ok")},1800)}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function legacy(t){const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
function copy(t,b,el){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(b)).catch(()=>{legacy(t)?done(b):(selectEl(el),toast("تم تحديد النص — انسخه يدويًا (Ctrl+C أو الضغط المطوّل)"))})}
 else{legacy(t)?done(b):(selectEl(el),toast("تم تحديد النص — انسخه يدويًا (Ctrl+C أو الضغط المطوّل)"))}
}
render();
</script>
