:root{--bg:#f6f9f8;--ink:#24323a;--mut:#5f7480;--line:#dbe7e4;--teal:#2a6a62;--teal-l:#e8f3f0;--sand:#f6f0e6;--sand-d:#8a5a1f;--rose:#f7eef3;--rose-d:#8c3e66;--blue:#eef1fa;--blue-d:#3f5296;--green:#f0f6e9;--green-d:#4c7228}
*{box-sizing:border-box}
body{margin:0;font-family:Taj,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
header h1{margin:0 0 2px;font-size:1.45rem;color:var(--teal)}
header p{margin:0;color:var(--mut);font-size:.92rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.seg{display:inline-flex;background:var(--teal-l);border-radius:14px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--teal);padding:8px 18px;border-radius:11px;cursor:pointer;transition:.2s}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(42,106,98,.15)}
.explain{margin:10px 0 4px;font-size:.9rem;color:var(--mut)}
.explain b{color:var(--ink)}
.status{margin-top:8px;display:inline-block;background:#fffbe9;border:1px solid #efe2b0;color:#6d5a12;border-radius:10px;padding:5px 12px;font-weight:700;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;min-width:280px;max-width:100%;color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mut);transition:.2s}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.88rem}
.meta span{background:#f3f7f6;border:1px solid var(--line);border-radius:8px;padding:2px 10px;color:var(--mut)}
.meta b{color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
.ch h3{margin:0;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.ch .n{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;background:#fff}
.k1 .ch{background:var(--teal-l);color:var(--teal)}.k2 .ch{background:var(--blue);color:var(--blue-d)}.k3 .ch{background:var(--sand);color:var(--sand-d)}.k4 .ch{background:var(--green);color:var(--green-d)}.k5 .ch{background:var(--rose);color:var(--rose-d)}
.cp{font:inherit;font-weight:700;border:1.5px solid currentColor;background:#fff;color:inherit;border-radius:10px;padding:5px 16px;cursor:pointer;min-width:110px;transition:.2s}
.cp:hover{transform:translateY(-1px)}
.cp.ok{background:#2e8b57;border-color:#2e8b57;color:#fff}
.cb{padding:10px 14px;white-space:pre-wrap;font-size:.97rem;-webkit-user-select:text;user-select:text}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:#24323a;color:#fff;padding:9px 18px;border-radius:12px;transition:.3s;font-size:.92rem;opacity:0}
.toast.show{transform:translateX(-50%);opacity:1}
@media (max-width:600px){select{min-width:100%}.seg{width:100%}.seg button{flex:1;padding:8px 6px}.ch{flex-wrap:wrap}}
</style>
</head>

<header>
<h1>نسخ حقول التحضير لمنصة نور</h1>
<p>الرياضيات — الصف التاسع — الفصل الدراسي الأول ٢٠٢٦/٢٠٢٧م · انسخ كل بند وألصقه في حقله المقابل في نور.</p>

 <div class="seg" role="tablist">
  <button id="mSep" class="on">تحضير منفصل</button>
  <button id="mCom">تحضير مدمج</button>
 </div>
 <div class="explain"><b>المنفصل:</b> نموذج نور مستقل لكل حصة، فتختار الحصة وتنسخ بنودها العشرة.<br>
 <b>المدمج:</b> نموذج واحد للدرس كله، وكل بند يضم حصص الدرس بعناوين «الحصة ١ / الحصة ٢».</div>

ة حتى ١٠٠، ثم يعدّونها (٢٥ عددًا).\n٣) تمارين ١-٢-أ (٥ دقائق)\n   المعلم: يوجّه حل الأسئلة (١)–(٥) ص ٢٠ ويناقش التوائم الأولية وحدسية مجموع عددين أوليين.\n   الطالب: يحلّون ثنائيًا ويتحققون من أن ١٦٩ = ١٣ × ١٣ غير أولي.\n٤) العوامل الأولية: طريقتان (١٠ دقائق)\n   المعلم: ينمذج تحليل ٧٢ بشجرة العوامل وتحليل ٤٠٠ بالقسمة المتكررة (مثال ١ ص ٢٠–٢١) ويؤكد كتابة العوامل تصاعديًا.\n   الطالب: يطبّقون الطريقتين على عدد واحد ويقارنون النتيجة.\n٥) تمارين ١-٢-ب (٦ دقائق)\n   المعلم: يتابع الحل ويعالج الأخطاء (مثل ترك عامل غير أولي في نهاية الفرع).\n   الطالب: يحلّون السؤال (١) ص ٢١ فقرات مختارة فرديًا.\n٦) تقويم تكويني (٤ دقائق)\n   المعلم: يطرح الأسئلة المتدرجة.\n   الطالب: يجيبون على السبورات الصغيرة.\n\nالحصة ٢: المضاعف المشترك الأصغر والعامل المشترك الأكبر وقواعد قابلية القسمة\n١) التهيئة: مسألة السباق (٤ دقائق)\n   المعلم: يعرض المسألة ويجمع التخمينات دون تصحيح.\n   الطالب: يخمّنون ويبرّرون تخميناتهم.\n٢) (م م ص) و(ع م ك) (١٠ دقائق)\n   المعلم: ينمذج الأمثلة ص ٢١–٢٢: (م م ص) لـ ١٢ و ١٨ بالقوائم وبالعوامل الأولية، و(ع م ك) لـ ١٦٨ و ١٨٠ بالعوامل الأولية.\n   الطالب: يسجّلون الخطوات ويطبّقونها على تمارين ١-٢-ج سؤال (١) و(٢) فقرات مختارة.\n٣) طبّق مهاراتك (٨ دقائق)\n   المعلم: يقود حل مسائل ص ٢٣ (الإذاعة، فاطمة وسعيد، سعاد وليلى) ويطرح سؤال: هل المسألة (م م ص) أم (ع م ك)؟\n   الطالب: تحل كل مجموعة مسألة وتعرضها مع التبرير، ثم يعودون لمسألة السباق ويتحققون من تخمينهم.\n٤) قواعد قابلية القسمة (١٠ دقائق)\n   المعلم: يعرض القواعد ص ٢٣–٢٤ بمثال لكل قاعدة.\n   الطالب: يحلّون تمارين ١-٢-د سؤال (١) و(٢) ص ٢٤ بطريقة «فحص سريع» ضمن تحدٍّ زمني.\n٥) تقويم تكويني (٣ دقائق)\n   المعلم: يطرح الأسئلة المتدرجة.\n   الطالب: يجيبون شفهيًا وكتابيًا.\n٦) مسابقة المجموعات (ختام الحصة) (٥ دقائق)\n   المعلم: يعرض ملف المسابقة على السبورة الذكية، ويختار الدرس والحصة وعدد الأسئلة، ويدير التناوب بين المجموعات.\n   الطالب: تجيب كل مجموعة عن سؤالها في دورها خلال الزمن، وتتابع ترتيبها على مخطط الأعمدة.", "الحصة ١: الأعداد الأولية والتحليل إلى العوامل الأولية\n١) [مستوى الدعم] هل العدد ٢١ أولي؟ لماذا؟\n   ا م] ن(أ) = ١٠ ، ن(ب) = ٧ ، ن(أ ∩ ب) = ٣ ، ن(ش) = ٢٠. أوجد ن((أ ∪ ب)′).\n   الإجابة النموذجية: ن(أ ∪ ب) = ١٤ ، إذن ٦\n\nالحصة ٤: مراجعة الوحدة التاسعة: المتتاليات والمجموعات\n١) [مستوى الدعم] ما العدد المثلثي السادس؟\n   الإجابة النموذجية: ٢١\n٢) [المستوى المتوقع] أوجد الحد العام للمتتالية ٩ ، ٧ ، ٥ ، ٣.\n   الإجابة النموذجية: ١١ − ٢ن\n٣) [المستوى المتقدم] ش = {١ ، ... ، ٢٠} ، أ = الأعداد المثلثية ، ب = الأعداد الزوجية. أوجد أ ∩ ب.\n   الإجابة النموذجية: أ = {١ ، ٣ ، ٦ ، ١٠ ، ١٥} ، أ ∩ ب = {٦ ، ١٠}\n\nالحصة ٥: مراجعة عامة: الأعداد والكسور والجبر (الوحدات ١–٣)\n١) [مستوى الدعم] احسب: ٣ + ٤ × (٦ − ٢)\n   الإجابة النموذجية: ١٩\n٢) [المستوى المتوقع] أوجد ١٥% من ٣٦٠.\n   الإجابة النموذجية: ٥٤\n٣) [المستوى المتقدم] اكتب ٠٫٣٦٣٦٣٦… في صورة كسر في أبسط صورة.\n   الإجابة النموذجية: ٤/١١\n\nالحصة ٦: مراجعة عامة: الهندسة والتقريب والمعادلات والمستقيمات والتحويلات (الوحدات ٤–٨)\n١) [مستوى الدعم] أوجد الحدين للعدد ٧٫٤ مقربًا لأقرب منزلة عشرية.\n   الإجابة النموذجية: ٧٫٣٥ و ٧٫٤٥\n٢) [المستوى المتوقع] حل: ٣ − ٢س > ١١\n   الإجابة النموذجية: س < −٤\n٣) [المستوى المتقدم] ما صورة (٤ ، ١٠) بالانعكاس حول المحور السيني ثم الدوران ١٨٠° حول الأصل؟\n   الإجابة النموذجية: (٤ ، −١٠) ثم (−٤ ، ١٠)", "الحصة ١: كتابة المجموعة بصيغة الصفة المميزة\nحل تمارين ٩-٢-د في كتاب الطالب، وتمارين كتاب النشاط (ص ١٦٦–١٧٠ و ١٧١) حسب توجيه المعلم. ولي الأمر: اطلب من ابنك وصف مجموعة من الأشياء بشرط بدل سردها.\n\nالحصة ٢: تطبيقات على صيغة الصفة المميزة ومخططات فن\nحل مسائل المجموعات المتنوعة في كتاب الطالب، وتمارين كتاب النشاط (ص ١٦٦–١٧٠ و ١٧١) حسب توجيه المعلم. ولي الأمر: راجع مع ابنك رموز المجموعات.\n\nالحصة ٣: تمارين كتاب النشاط على المتتاليات والمجموعات\nحل تمارين كتاب النشاط (ص ١٦٣–١٧٠) غير المكتملة. ولي الأمر: تابع إنجاز ابنك لتمارين كتاب النشاط (ص ١٦٦–١٧٠ و ١٧١).\n\nالحصة ٤: مراجعة الوحدة التاسعة: المتتاليات والمجموعات\nمراجعة ملخص الوحدة التاسعة وتمارين نهاية الوحدة وتمارين كتاب النشاط (ص ١٧١). ولي الأمر: راجع مع ابنك الوحدة التاسعة استعدادًا لتقويمها.\n\nالحصة ٥: مراجعة عامة: الأعداد والكسور والجبر (الوحدات ١–٣)\nمراجعة الوحدات ١–٣ من كتاب الطالب وكتاب النشاط (ص ١٦٦–١٧٠ و ١٧١). ولي الأمر: ساعد ابنك على إعداد بطاقات مراجعة للقوانين.\n\nالحصة ٦: مراجعة عامة: الهندسة والتقريب والمعادلات والمستقيمات والتحويلات (الوحدات ٤–٨)\nمراجعة الوحدات ٤–٨ وتمارين المراجعة في كتاب النشاط (ص ١٦٦–١٧٠ و ١٧١) استعدادًا للتقويم الختامي. ولي الأمر: شجّع ابنك على حل نماذج مراجعة وتنظيم وقته."]}]}];
const FN=["المخرجات التعليمية","المستوى المعرفي","الاستراتيجيات","المصادر التعليمية","المفاهيم","التهيئة / التمهيد / التعلم القبلي","إجراءات سير الدرس / الأنشطة التدريسية","التقويم التكويني","التقويم الختامي","ملاحظات ضمن خطة الدراسة الأسبوعية"];
const KC=["k1","k2","k4","k4","k2","k1","k3","k5","k5","k1"];
const AD=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
let mode="sep",li=0,pi=0;
const $=id=>document.getElementById(id);
const lessons=[];DATA.forEach(u=>u.lessons.forEach(l=>{l.unit=u;lessons.push(l)}));
(function fill(){const s=$("ls");DATA.forEach(u=>{const g=document.createElement("optgroup");g.label="الوحدة "+AD(u.n)+": "+u.name;u.lessons.forEach(l=>{const o=document.createElement("option");o.value=lessons.indexOf(l);o.textContent=l.idAr+" "+l.title;g.appendChild(o)});s.appendChild(g)});s.onchange=()=>{li=+s.value;pi=0;render()}})();
$("mSep").onclick=()=>{mode="sep";render()};$("mCom").onclick=()=>{mode="com";render()};
function render(){
 $("mSep").classList.toggle("on",mode==="sep");$("mCom").classList.toggle("on",mode==="com");
 $("status").textContent=mode==="sep"?"أنت الآن في الوضع المنفصل: نموذج لكل حصة":"أنت الآن في الوضع المدمج: نموذج واحد للدرس كله";
 const L=lessons[li];const T=$("tabs");T.innerHTML="";
 if(mode==="sep"){L.periods.forEach((p,i)=>{const b=document.createElement("button");b.textContent="الحصة "+AD(p.n)+": "+p.focus;if(i===pi)b.className="on";b.onclick=()=>{pi=i;render()};T.appendChild(b)});T.style.display="flex"}else T.style.display="none";
 const m=[["الوحدة",L.unit.name],["الأسبوع",L.week+" ("+L.date+")"],["كتاب الطالب",L.sb],["كتاب النشاط",L.ab],["دليل المعلم",L.tb],["عدد الحصص",AD(L.periods.length)]];
 $("meta").innerHTML=m.map(x=>"<span>"+x[0]+": <b>"+x[1]+"</b></span>").join("");
 const fields=mode==="sep"?L.periods[pi].fields:L.combined;
 const C=$("cards");C.innerHTML="";
 fields.forEach((t,i)=>{const d=document.createElement("div");d.className="card "+KC[i];
  d.innerHTML='<div class="ch"><h3><span class="n">'+AD(i+1)+'</span>'+FN[i]+'</h3><button class="cp">نسخ</button></div><div class="cb"></div>';
  d.querySelector(".cb").textContent=t;
  const b=d.querySelector(".cp");b.onclick=()=>copy(t,b,d.querySelector(".cb"));C.appendChild(d)});
}
function done(b){b.textContent="تم النسخ ✓";b.classList.add("ok");setTimeout(()=>{b.textContent="نسخ";b.classList.remove("ok")},1800)}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function legacy(t){const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
function copy(t,b,el){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(b)).catch(()=>{legacy(t)?done(b):(selectEl(el),toast("تم تحديد النص — انسخه يدويًا (Ctrl+C أو الضغط المطوّل)"))})}
 else{legacy(t)?done(b):(selectEl(el),toast("تم تحديد النص — انسخه يدويًا (Ctrl+C أو الضغط المطوّل)"))}
}
render();
</script>
