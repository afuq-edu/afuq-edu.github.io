 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\n1. الوحدة\n2. الترابط\n3. الاتزان", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nالتعلم القبلي: مهارات الرسم والتصوير وقيمة التناسب بين الشكل والأرضية من خلال البعد والقرب في الصف الثامن.\n\nالتهيئة:\n- المعلم: يعرض صورًا لمشاهد عمانية (جبال، صحارى، أشجار، بيوت تراثية) ويسأل: ما الذي يشدك أولًا في كل مشهد؟\n- الطالب: يحدد العنصر الأبرز (الشكل) وما يحيط به (الأرضية).\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nالتعلم القبلي: مفاهيم التكوين الجيد والمخطط الأولي للمشهد.\n\nالتهيئة:\n- المعلم: يرسم على السبورة خطين لشجرتين بسماكتين مختلفتين ويسأل: أيهما أقرب إليك؟\n- الطالب: يستنتج أن الخط الأسمك والحجم الأكبر يوحيان بالقرب.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nالتعلم القبلي: التكوين المرسوم في الحصة السابقة.\n\nالتهيئة:\n- المعلم: يعرض تكوينًا ناقصًا ويسأل: ما الذي يحتاجه ليصبح مترابطًا؟\n- الطالب: يقترح وحدات تربط الأجزاء أو تفاصيل في الأرضية.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورًا لمشاهد عمانية (جبال، صحارى، أشجار، بيوت تراثية) ويسأل: ما الذي يشدك أولًا في كل مشهد؟\n- الطالب: يحدد العنصر الأبرز (الشكل) وما يحيط به (الأرضية).\n\nتحليل التكوينات (12 دقيقة):\n- المعلم: يعرض نماذج لتكوينات منفذة بالخطوط ويقود حوارًا لاستقصاء: أين الشكل؟ أين الأرضية؟ كيف رُتبت الوحدات؟\n- الطالب: يحلل النماذج ويحدد الوحدات الشكلية والأرضية.\n\nبناء المفاهيم (10 دقائق):\n- المعلم: يبني خريطة ذهنية تضم: التعبير، التكوين الجيد المعتمد على الوحدة والترابط والاتزان، الشكل، الأرضية، الخط.\n- الطالب: يشارك في صياغة تعريفات المفاهيم بلغته.\n\nاختيار المشهد (8 دقائق):\n- المعلم: يوجه كل طالب لاختيار مشهد من الطبيعة العمانية يعبر عنه بالرسم.\n- الطالب: يختار مشهدًا ويرسم مخططًا أوليًا سريعًا (اسكتش).\n\nالختام (5 دقائق):\n- المعلم: يلخص ويذكّر بإحضار كراسة النشاط والأدوات.\n- الطالب: يذكر مفهومًا تعلمه وتعريفه.\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nالتهيئة (5 دقائق):\n- المعلم: يرسم على السبورة خطين لشجرتين بسماكتين مختلفتين ويسأل: أيهما أقرب إليك؟\n- الطالب: يستنتج أن الخط الأسمك والحجم الأكبر يوحيان بالقرب.\n\nالعرض التوضيحي (8 دقائق):\n- المعلم: يعرض على لوحة الخطوات مراحل رسم التكوين: تحديد الخط الأرضي، توزيع الوحدات، التفاصيل، تأكيد الخطوط.\n- الطالب: يتابع الخطوات ويطرح أسئلته.\n\nالرسم (22 دقيقة):\n- المعلم: يتجول ويوجه بأسلوب مباشر نحو تحقيق التناسب الخطي ويعزز المحاولات الجيدة.\n- الطالب: يرسم تكوينه بالقلم الرصاص موزعًا الوحدات على الأرضية.\n\nالختام (5 دقائق):\n- المعلم: يطلب ترتيب الأدوات ويختار عملين للمناقشة.\n- الطالب: يرتب أدواته ويستمع للملاحظات.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nالتهيئة (5 دقائق):\n- المعلم: يعرض تكوينًا ناقصًا ويسأل: ما الذي يحتاجه ليصبح مترابطًا؟\n- الطالب: يقترح وحدات تربط الأجزاء أو تفاصيل في الأرضية.\n\nالاستكمال والتأكيد (18 دقيقة):\n- المعلم: يتابع الإضافات ويوجه إلى تأكيد الخطوط الأمامية وتخفيف الخلفية.\n- الطالب: يستكمل تفاصيل الوحدات والأرضية ويؤكد الخطوط.\n\nالتقويم بكراسة النشاط (8 دقائق):\n- المعلم: يفعّل أسئلة كراسة النشاط المرتبطة بالدرس.\n- الطالب: يجيب عن أسئلة الكراسة.\n\nالختام (9 دقائق):\n- المعلم: ينظم تقويمًا ثنائيًا بمعايير الوحدة والترابط والاتزان.\n- الطالب: يتبادل العمل مع زميله ويقيمه وفق المعايير.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nس1 (مستوى المعرفة): ماذا نسمي العنصر الرئيس في التكوين الذي يجذب العين؟\nالإجابة: الشكل (الوحدات الشكلية).\n\nس2 (مستوى التطبيق): ما مقومات الإجادة التي يعتمد عليها التكوين الجيد؟\nالإجابة: الوحدة والترابط والاتزان.\n\nس3 (مستوى الاستدلال): كيف يتحقق التناسب الخطي بين الشكل والأرضية؟\nالإجابة: بتنظيم أحجام الوحدات وسماكة خطوطها وفق قربها وبعدها وأهميتها في التكوين.\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nس1 (مستوى المعرفة): كيف تُظهر بالخط أن عنصرًا ما بعيد؟\nالإجابة: برسمه أصغر حجمًا وبخط أخف.\n\nس2 (مستوى التطبيق): ما أول خطوة في رسم التكوين؟\nالإجابة: تحديد خط الأرض أو الأفق وتوزيع الوحدات الرئيسة.\n\nس3 (مستوى الاستدلال): لماذا يُعد التناسب الخطي قيمة جمالية؟\nالإجابة: لأنه يمنح التكوين عمقًا وتوازنًا وانسجامًا بين أجزائه.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nس1 (مستوى المعرفة): ما المقصود بالترابط في التكوين؟\nالإجابة: اتصال الوحدات ببعضها بصريًا بحيث تبدو جزءًا من كل.\n\nس2 (مستوى التطبيق): كيف تؤكد الخطوط الأمامية في التكوين؟\nالإجابة: بزيادة الضغط وسماكة الخط.\n\nس3 (مستوى الاستدلال): اقترح وحدة شكلية تضيف ترابطًا لتكوينك.\nالإجابة: مثال: نخلة أو ممر يربط مقدمة المشهد بخلفيته.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nس1 (مستوى المعرفة): عرّف التكوين الجيد.\nالإجابة: تنظيم الشكل بمكوناته مع الأرضية وتأكيدها بالخطوط معتمدًا على الوحدة والترابط والاتزان.\n\nس2 (مستوى التطبيق): حدد الشكل والأرضية في مشهد لقلعة على جبل.\nالإجابة: الشكل: القلعة، والأرضية: الجبل والسماء.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يحقق الاتزان في تكوين تتجمع وحداته في جهة واحدة.\nالإجابة: توزيع وحدات مساندة في الجهة المقابلة أو نقل مركز الاهتمام.\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nس1 (مستوى المعرفة): ما الأداة المستخدمة في رسم التكوين؟\nالإجابة: قلم الرصاص.\n\nس2 (مستوى التطبيق): صف كيف وزعت الوحدات الشكلية في تكوينك.\nالإجابة: إجابة تذكر الوحدات القريبة والبعيدة ومواضعها.\n\nس3 (مستوى الاستدلال): قيّم تحقق التناسب الخطي في تكوين زميل.\nالإجابة: تقييم يذكر مدى تدرج الأحجام والخطوط مع اقتراح.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nس1 (مستوى المعرفة): اذكر مقومات الإجادة الثلاثة.\nالإجابة: الوحدة والترابط والاتزان.\n\nس2 (مستوى التطبيق): قيّم تكوينك وفق أحد المقومات.\nالإجابة: تقييم معلل يذكر موضع التحقق.\n\nس3 (مستوى الاستدلال): كيف سيساعدك التكوين الجيد في مرحلة التلوين القادمة؟\nالإجابة: وضوح الوحدات وخطوطها يسهل توزيع الألوان والضوء والظل.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nإرشاد للطالب: يتأمل مشهدًا طبيعيًا في بيئته ويحدد فيه الشكل والأرضية.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جمال المشاهد الطبيعية العمانية.\nالمرجع الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\n1. الضوء\n2. الظل\n3. التناغم الضوئي اللوني\n4. الألوان المائية\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\n1. الإضاءة\n2. الظلال اللونية\n3. هيئة الشكل\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\n1. التناغم الضوئي اللوني\n2. التناسق اللوني", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nالتعلم القبلي: التكوين الجيد بالخطوط ومفاهيمه.\n\nالتهيئة:\n- المعلم: يسلط ضوءًا على كرة ويسأل: كم درجة لونية تراها على سطحها؟\n- الطالب: يلاحظ الجزء المضيء ونصف الظل والظل.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nالتعلم القبلي: تجربة التدرج اللوني وتحديد مصدر الضوء.\n\nالتهيئة:\n- المعلم: يعرض تكوينًا ملونًا (الشكل 5) ويسأل: كيف عرفت أن الشمس من جهة اليمين؟\n- الطالب: يستدل بمواضع الضوء والظل في الوحدات.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nالتعلم القبلي: الوحدات الملونة بالضوء والظل.\n\nالتهيئة:\n- المعلم: يعرض لوحتين: إحداهما متناغمة الضوء والأخرى متضاربة، ويسأل: أيهما مريحة للعين؟\n- الطالب: يختار المتناغمة ويعلل بانسجام الضوء.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nالتهيئة (5 دقائق):\n- المعلم: يسلط ضوءًا على كرة ويسأل: كم درجة لونية تراها على سطحها؟\n- الطالب: يلاحظ الجزء المضيء ونصف الظل والظل.\n\nالبيان العملي (12 دقيقة):\n- المعلم: يجري بيانًا عمليًا بلوحة الخطوات: تحضير الألوان، البدء بالفاتح، التدرج نحو الداكن، ترك مساحات الضوء.\n- الطالب: يتابع البيان ويدون الخطوات.\n\nالمفاهيم (8 دقائق):\n- المعلم: يتوصل مع الطلبة إلى معنى التكوين الملون والضوء والظل والتناغم الضوئي.\n- الطالب: يصوغ التعريفات بمساعدة المعلم.\n\nتجربة الألوان (10 دقائق):\n- المعلم: يوجه إلى تجربة مزج ودرجات على ورقة تجارب.\n- الطالب: ينفذ شريط تدرج للون واحد من الفاتح للداكن.\n\nالختام (5 دقائق):\n- المعلم: يربط التجربة بتلوين الوحدات في الحصة القادمة.\n- الطالب: يحدد مصدر الضوء في تكوينه.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nالتهيئة (5 دقائق):\n- المعلم: يعرض تكوينًا ملونًا (الشكل 5) ويسأل: كيف عرفت أن الشمس من جهة اليمين؟\n- الطالب: يستدل بمواضع الضوء والظل في الوحدات.\n\nتلوين الوحدات (25 دقيقة):\n- المعلم: يتابع التلوين ويوجه إلى البدء بالطبقة الفاتحة وانتظار الجفاف قبل الظلال.\n- الطالب: يلون الوحدات الشكلية بالتدرج من الفاتح إلى الداكن.\n\nوقفة تأمل (5 دقائق):\n- المعلم: يطلب الابتعاد عن اللوحة لرؤيتها من مسافة.\n- الطالب: يتأمل لوحته ويحدد ما يحتاج تعديلًا.\n\nالختام (5 دقائق):\n- المعلم: يوجه لتنظيف الفرش وحفظ اللوحة.\n- الطالب: ينظف أدواته ويحفظ لوحته.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nالتهيئة (5 دقائق):\n- المعلم: يعرض لوحتين: إحداهما متناغمة الضوء والأخرى متضاربة، ويسأل: أيهما مريحة للعين؟\n- الطالب: يختار المتناغمة ويعلل بانسجام الضوء.\n\nمعالجة التناغم (18 دقيقة):\n- المعلم: يوجه إلى توحيد درجات الضوء وتنسيق الظلال بين الوحدات.\n- الطالب: يعالج الوحدات لتحقيق التناغم الضوئي.\n\nالتقويم (10 دقائق):\n- المعلم: يفعل أساليب التقويم في كراسة النشاط ويطرح أسئلة شفوية.\n- الطالب: يجيب عن أسئلة التقويم.\n\nالختام (7 دقائق):\n- المعلم: يمهد لتلوين الأرضية وإخراج التكوين في الدرس القادم.\n- الطالب: يحدد ألوان الأرضية المقترحة.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nس1 (مستوى المعرفة): ما وظيفة الضوء والظل في التكوين؟\nالإجابة: إظهار هيئة الشكل وتجسيمه.\n\nس2 (مستوى التطبيق): لماذا نبدأ بالدرجات الفاتحة في الألوان المائية؟\nالإجابة: لأن الألوان المائية شفافة ويصعب تفتيح اللون الداكن بعد وضعه.\n\nس3 (مستوى الاستدلال): كيف يتحقق التناغم الضوئي بين الوحدات الشكلية؟\nالإجابة: بتوحيد اتجاه الضوء على جميع الوحدات وتدرج الظلال بانسجام.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nس1 (مستوى المعرفة): لماذا ننتظر جفاف الطبقة الأولى قبل الظلال؟\nالإجابة: حتى لا تختلط الألوان وتفقد وضوحها.\n\nس2 (مستوى التطبيق): كيف تُظهر الظل في نخلة بالألوان المائية؟\nالإجابة: بإضافة درجة أغمق من لونها في الجهة المعاكسة للضوء.\n\nس3 (مستوى الاستدلال): حلل لوحة زميل: هل اتجاه الضوء موحد في جميع الوحدات؟\nالإجابة: تحليل يحدد التطابق أو الاختلاف مع اقتراح.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nس1 (مستوى المعرفة): ما المقصود بالتناغم الضوئي اللوني؟\nالإجابة: انسجام درجات الضوء والظل بين الوحدات الشكلية بحيث تبدو تحت مصدر ضوء واحد.\n\nس2 (مستوى التطبيق): كيف تعالج وحدة تبدو أكثر إضاءة من غيرها؟\nالإجابة: بتغميق درجتها أو إضافة ظل خفيف متسق مع بقية الوحدات.\n\nس3 (مستوى الاستدلال): انقد لوحة زميل من حيث التناغم الضوئي.\nالإجابة: نقد يحدد مواطن الانسجام والخلل مع اقتراح.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nس1 (مستوى المعرفة): أكمل: الضوء والظل عنصران فنيان ……… يظهران هيئة الشكل.\nالإجابة: مساعدان (ثانويان).\n\nس2 (مستوى التطبيق): صف خطوات البيان العملي بالترتيب.\nالإجابة: تحضير الألوان، التلوين بالفاتح، التدرج للداكن، ترك مناطق الضوء، التأكيد.\n\nس3 (مستوى الاستدلال): حدد مصدر الضوء في تكوينك وبيّن أثره على الوحدات.\nالإجابة: إجابة تحدد الاتجاه ومواضع الضوء والظل.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nس1 (مستوى المعرفة): ما الأداة المستخدمة لمزج الألوان؟\nالإجابة: الباليتة.\n\nس2 (مستوى التطبيق): بيّن كيف أظهرت هيئة إحدى الوحدات بالضوء والظل.\nالإجابة: إجابة تصف مواضع الضوء والظل في الوحدة.\n\nس3 (مستوى الاستدلال): اقترح طريقة لتصحيح لون داكن زائد في الألوان المائية.\nالإجابة: سحب اللون بفرشاة رطبة نظيفة أو ورق نشاف.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nس1 (مستوى المعرفة): ما القيمة الفنية لهذا الدرس؟\nالإجابة: التناغم الضوئي اللوني بين الوحدات الشكلية.\n\nس2 (مستوى التطبيق): قيّم تحقق التناغم في لوحتك.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): اقترح ألوانًا للأرضية تنسجم مع وحداتك.\nالإجابة: إجابة تربط ألوان الأرضية بألوان الوحدات ودرجتها.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nإرشاد للطالب: يلاحظ تغير الظلال في بيئته خلال اليوم.\nإرشاد لولي الأمر: يوفر لابنه بيئة هادئة لملاحظة الضوء وال التأثير الملمسي\n3. التجفيف والتثبيت", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nالتعلم القبلي: مجالات الطباعة التي درسها سابقًا (البصمة، الاستنسل).\n\nالتهيئة:\n- المعلم: يعرض نماذج منتجات مطبوعة بالعقد والربط (الشكل 13) ويسأل: كيف ظهرت هذه الدوائر والخطوط على القماش؟\n- الطالب: يتوقع طريقة الطباعة (ربط القماش قبل الصبغ).\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nالتعلم القبلي: إعداد القماش ومبدأ العزل.\n\nالتهيئة:\n- المعلم: يعرض عقدتين بحصاتين مختلفتين ويسأل: أيهما ستعطي أثرًا أكبر؟\n- الطالب: يربط حجم الحصاة بحجم الأثر.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\nالتعلم القبلي: القماش المعقود والمربوط.\n\nالتهيئة:\n- المعلم: يسأل: ماذا سيحدث لو بقي القماش في الصبغة مدة أطول؟\n- الطالب: يتوقع أن يصبح اللون أغمق.", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nالتهيئة (5 دقائق):\n- المعلم: يعرض نماذج منتجات مطبوعة بالعقد والربط (الشكل 13) ويسأل: كيف ظهرت هذه الدوائر والخطوط على القماش؟\n- الطالب: يتوقع طريقة الطباعة (ربط القماش قبل الصبغ).\n\nمبدأ العزل (10 دقائق):\n- المعلم: يوضح أن الفكرة تقوم على عزل أجزاء من القماش بالربط فلا تصلها الصبغة.\n- الطالب: يستنتج سبب ظهور المساحات البيضاء.\n\nإعداد الصبغات والقماش (10 دقائق):\n- المعلم: يشرح إعداد الصبغة (بودرة تعجن وتذاب في الماء المغلي ويضاف الملح) ويؤكد أن المعلم يتولى الماء الساخن، وغسل القماش بالماء والصابون.\n- الطالب: يدون خطوات الإعداد وقواعد السلامة.\n\nالمفاهيم (10 دقائق):\n- المعلم: يبني خريطة ذهنية: التشكيل، المساحة، اللون، الملمس، التناغم المساحي اللوني ذو التأثير الملمسي.\n- الطالب: يشارك في تعريف المفاهيم.\n\nالختام (5 دقائق):\n- المعلم: يوزع القماش ويطلب إحضار حصى بأحجام مختلفة وخيوط مشمعة.\n- الطالب: يستلم قماشه ويستعد للحصة القادمة.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nالتهيئة (5 دقائق):\n- المعلم: يعرض عقدتين بحصاتين مختلفتين ويسأل: أيهما ستعطي أثرًا أكبر؟\n- الطالب: يربط حجم الحصاة بحجم الأثر.\n\nنمذجة العقد (8 دقائق):\n- المعلم: يمسك القماش من أحد أطرافه ويلف حول حصاة ويربط بإحكام، ثم يكرر على مساحات أخرى.\n- الطالب: يتابع ويجرب عقدة أولى.\n\nنمذجة الربط (7 دقائق):\n- المعلم: ينمذج ثني القماش (طولي، مروحي، لولبي) وربطه على مسافات متنوعة.\n- الطالب: يتابع ويحدد الأسلوب الذي سيستخدمه.\n\nالتنفيذ (17 دقيقة):\n- المعلم: يتابع إحكام الربط وتنوع المسافات.\n- الطالب: ينفذ العقد والربط على قماشه بتوزيع مبتكر.\n\nالختام (3 دقائق):\n- المعلم: يجمع الأقمشة المربوطة مع كتابة اسم كل طالب.\n- الطالب: يسلم قماشه.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ماذا سيحدث لو بقي القماش في الصبغة مدة أطول؟\n- الطالب: يتوقع أن يصبح اللون أغمق.\n\nتجهيز ركن الصباغة (5 دقائق):\n- المعلم: ينظم ركن الصباغة ويوزع القفازات ويتولى الصبغة الساخنة.\n- الطالب: يرتدي القفازات والمريلة.\n\nالغمس (15 دقيقة):\n- المعلم: يشرف على الغمس بالملقط بحسب الزمن المحدد.\n- الطالب: يغمس قماشه ثم يخرجه ويعصره بلطف.\n\nفك الربط والتحليل (8 دقائق):\n- المعلم: يوجه لفك الربط بالمقص بحذر بعد شطف القماش.\n- الطالب: يفك الربط ويحلل الأثر الناتج.\n\nالختام (7 دقائق):\n- المعلم: ينظم التجفيف والتنظيف ويناقش النتائج.\n- الطالب: يعلق قماشه ويتحدث عن النتيجة.", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nس1 (مستوى المعرفة): ما فكرة الطباعة بالعقد والربط؟\nالإجابة: عزل أجزاء من القماش بربطها حتى لا تصل إليها الصبغة.\n\nس2 (مستوى التطبيق): لماذا يُغسل القماش قبل الطباعة؟\nالإجابة: للتخلص من المواد المستخدمة في تجهيزه فتثبت الصبغة.\n\nس3 (مستوى الاستدلال): لماذا يُضاف الملح إلى الصبغة؟\nالإجابة: للمساعدة على تثبيت اللون في القماش.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nس1 (مستوى المعرفة): ما وظيفة الحصى في العقد؟\nالإجابة: تكوين مساحة دائرية معزولة عن الصبغة.\n\nس2 (مستوى التطبيق): لماذا يجب إحكام الربط؟\nالإجابة: حتى لا تتسرب الصبغة إلى الأجزاء المربوطة.\n\nس3 (مستوى الاستدلال): كيف يؤثر تنوع المسافات بين العقد في التصميم؟\nالإجابة: يحقق تنوعًا وإيقاعًا في المساحات اللونية.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\nس1 (مستوى المعرفة): ما الأداة المستخدمة في غمس القماش؟\nالإجابة: الملقط.\n\nس2 (مستوى التطبيق): لماذا يُشطف القماش بعد الصبغ؟\nالإجابة: لإزالة الصبغة الزائدة.\n\nس3 (مستوى الاستدلال): حلل الأثر الناتج: أين تحقق التناغم المساحي؟\nالإجابة: تحليل يحدد المساحات الملونة والمعزولة وانسجامها.", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nس1 (مستوى المعرفة): اذكر نوعين من الأقمشة المناسبة للطباعة بالعقد والربط.\nالإجابة: القطني والحريري.\n\nس2 (مستوى التطبيق): اذكر قاعدتي سلامة عند التعامل مع الصبغات.\nالإجابة: ارتداء القفازات والمريلة، وترك الماء المغلي للمعلم.\n\nس3 (مستوى الاستدلال): توقع شكل الأثر الناتج عن ربط حصاة صغيرة في القماش.\nالإجابة: دائرة صغيرة فاتحة بحلقات متدرجة حولها.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nس1 (مستوى المعرفة): اذكر طريقتين لتنفيذ الطباعة بالعقد والربط.\nالإجابة: العقد والربط.\n\nس2 (مستوى التطبيق): صف أسلوب الثني الذي استخدمته.\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (مستوى الاستدلال): توقع شكل الأثر الناتج عن ثني القماش ثنيًا مروحيًا وربطه.\nالإجابة: خطوط أو أشرطة متوازية متكررة.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\nس1 (مستوى المعرفة): ما القيمة الفنية لهذا الدرس؟\nالإجابة: التناغم المساحي اللوني ذو التأثير الملمسي.\n\nس2 (مستوى التطبيق): صف الأثر الذي ظهر بعد فك الربط.\nالإجابة: إجابة شخصية تصف الأشكال الناتجة.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا لتحسين النتيجة في تجربة قادمة.\nالإجابة: مثال: إحكام الربط أكثر أو تنويع أحجام الحصى.", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nإرشاد للطالب: يحضر حصى بأحجام مختلفة وخيوطًا مشمعة أو بلاستيكية.\nإرشاد لولي الأمر: يساعد ابنه في تجهيز الخامات ويؤكد على السلامة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 37–45.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nإرشاد للطالب: يتأمل الأقمشة المطبوعة بأساليب تقليدية.\nإرشاد لولي الأمر: يتحاور مع ا ط بخطوط خفيفة أو قياس المسافات.\n\nالتخطيط (5 دقائق):\n- المعلم: يوجه لتحديد مواضع الطباعة بخطوط خفيفة.\n- الطالب: يخطط مواضع وحداته.\n\nالطباعة (22 دقيقة):\n- المعلم: يتابع الطباعة ويوجه لتوحيد الضغط وكمية اللون.\n- الطالب: يطبع وحداته بالتكرار على القماش.\n\nالختام (8 دقائق):\n- المعلم: ينظم التجفيف والتنظيف ويناقش أثر الإيقاع.\n- الطالب: يجفف عمله ويتحدث عن الإيقاع الناتج.\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه\nالتهيئة (5 دقائق):\n- المعلم: يعرض منتجين أحدهما محدد بالريليف ويسأل: ماذا أضاف التحديد؟\n- الطالب: يلاحظ البروز والوضوح.\n\nالتحديد بالريليف (15 دقيقة):\n- المعلم: ينمذج الضغط المنتظم على أنبوب الريليف.\n- الطالب: يحدد بعض الوحدات بالريليف.\n\nالإخراج الوظيفي (8 دقائق):\n- المعلم: يوجه إلى تشطيب الأطراف وتحويل القطعة إلى منتج.\n- الطالب: يُخرج منتجه بصورة وظيفية.\n\nالعرض والتقويم (7 دقائق):\n- المعلم: ينظم معرضًا مصغرًا ويقيم وفق التشكيل الجيد والإيقاع.\n- الطالب: يعرض منتجه ويقيم أعمال زملائه.\n\nالختام (5 دقائق):\n- المعلم: يناقش طرق التسويق وأسعارًا مقترحة.\n- الطالب: يقترح طريقة لتسويق منتجه.", "الحصة 1: البيان العملي لاستكمال المنتج بالطباعة بالبصمة والشرائح ومفهوم الإيقاع الزخرفي اللوني\nس1 (مستوى المعرفة): ما المقصود بالتكرار في المنتج المطبوع؟\nالإجابة: إعادة طباعة الوحدة الزخرفية بانتظام على المساحة.\n\nس2 (مستوى التطبيق): ما الفرق بين الطباعة بالبصمة والطباعة بالشرائح؟\nالإجابة: البصمة بختم يُضغط على القماش، والشرائح قالب مفرغ يُمرر اللون من خلاله.\n\nس3 (مستوى الاستدلال): لماذا يجب أن تتناسب الوحدة مع مساحة المنتج؟\nالإجابة: لتحقيق التشكيل الجيد والاتزان دون ازدحام أو فراغ.\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط\nس1 (مستوى المعرفة): لماذا نوحد كمية اللون في كل طبعة؟\nالإجابة: للحصول على طبعات متجانسة.\n\nس2 (مستوى التطبيق): كيف تستخدم الإسفنج في الطباعة بالشرائح؟\nالإجابة: بتربيت اللون من خلال فتحات الشريحة.\n\nس3 (مستوى الاستدلال): حلل العلاقة بين ألوان البصمة وألوان العقد والربط في منتجك.\nالإجابة: تحليل يذكر التباين أو الانسجام بينهما.\n\nالحصة 3: التحديد بالريليف وإ  const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
