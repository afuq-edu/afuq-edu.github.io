const D=(window.AFUQ35||function(x){return x})([{"title": "الدرس الأول: الطبيعة العمانية الجميلة في تكوين", "unit": "الوحدة الأولى: البيئة العمانية الجميلة", "periods": [{"ax": "مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي", "n": 1, "w": "الأسبوع الأول: من 6/9/2026 إلى 10/9/2026", "pg": "17–24", "f": ["1. يستنتج المفاهيم الفنية المرتبطة ببناء تكوين جيد من الوحدات الشكلية على الأرضية (20 دقيقة)\n2. يميز بين الشكل (الوحدات الشكلية) والأرضية والخط عناصرَ فنية للتكوين (5 دقائق)\nمخرج آخر: يقدر جمال مشاهد الطبيعة العمانية الحية والصامتة (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. العرض التوضيحي\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. السبورة التقليدية\n4. أخرى: لوحة الخطوات التعليمية، نماذج لتكوينات طبيعية بالخطوط", "1. التعبير\n2. التكوين الجيد\n3. الوحدات الشكلية (الشكل)\n4. الأرضية\n5. التناسب الخطي", "التعلم القبلي: مهارات الرسم والتصوير وقيمة التناسب بين الشكل والأرضية من خلال البعد والقرب في الصف الثامن.\nيعرض المعلم صورًا لمشاهد عمانية (جبال، صحارى، أشجار، بيوت تراثية) ويسأل: ما الذي يشدك أولًا في كل مشهد؟ ويحدد الطالب العنصر الأبرز (الشكل) وما يحيط به (الأرضية).", "1. التهيئة: يعرض المعلم صورًا لمشاهد عمانية (جبال، صحارى، أشجار، بيوت تراثية) ويسأل: ما الذي يشدك أولًا في كل مشهد؟ ويحدد الطالب العنصر الأبرز (الشكل) وما يحيط به (الأرضية) (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تحليل التكوينات: يعرض المعلم نماذج لتكوينات منفذة بالخطوط ويقود حوارًا لاستقصاء: أين الشكل؟ أين الأرضية؟ كيف رُتبت الوحدات؟ ويحلل الطالب النماذج ويحدد الوحدات الشكلية والأرضية (12 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n3. بناء المفاهيم: يبني المعلم خريطة ذهنية تضم: التعبير، التكوين الجيد المعتمد على الوحدة والترابط والاتزان، الشكل، الأرضية، الخط، ويشارك الطالب في صياغة تعريفات المفاهيم بلغته (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. اختيار المشهد: يوجه كل طالب لاختيار مشهد من الطبيعة العمانية يعبر عنه بالرسم، ويختار الطالب مشهدًا ويرسم مخططًا أوليًا سريعًا (اسكتش) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: يلخص المعلم ويذكّر بإحضار كراسة النشاط والأدوات، ويذكر الطالب مفهومًا تعلمه وتعريفه (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.", "س1 (مستوى المعرفة): ماذا نسمي العنصر الرئيس في التكوين الذي يجذب العين؟\nالإجابة: الشكل (الوحدات الشكلية).\n\nس2 (مستوى التطبيق): ما مقومات الإجادة التي يعتمد عليها التكوين الجيد؟\nالإجابة: الوحدة والترابط والاتزان.\n\nس3 (مستوى الاستدلال): كيف يتحقق التناسب الخطي بين الشكل والأرضية؟\nالإجابة: بتنظيم أحجام الوحدات وسماكة خطوطها وفق قربها وبعدها وأهميتها في التكوين.", "س1 (مستوى المعرفة): عرّف التكوين الجيد.\nالإجابة: تنظيم الشكل بمكوناته مع الأرضية وتأكيدها بالخطوط معتمدًا على الوحدة والترابط والاتزان.\n\nس2 (مستوى التطبيق): حدد الشكل والأرضية في مشهد لقلعة على جبل.\nالإجابة: الشكل: القلعة، والأرضية: الجبل والسماء.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يحقق الاتزان في تكوين تتجمع وحداته في جهة واحدة.\nالإجابة: توزيع وحدات مساندة في الجهة المقابلة أو نقل مركز الاهتمام.", "إرشاد للطالب: يتأمل مشهدًا طبيعيًا في بيئته ويحدد فيه الشكل والأرضية.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جمال المشاهد الطبيعية العمانية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 17–24.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/9/arts/?l=1"]}, {"ax": "رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية", "n": 2, "w": "الأسبوع الثاني: من 13/9/2026 إلى 17/9/2026", "pg": "23–25", "f": ["1. يرسم تكوينًا جيدًا يعبر عن مشهد طبيعي عماني مظهرًا هيئة الوحدات الشكلية بالخطوط (15 دقيقة)\n2. يحقق قيمة التناسب الخطي بين الشكل والأرضية (15 دقيقة)\nمخرج آخر: يحافظ على نظافة العمل ودقته (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. العرض التوضيحي", "1. السبورة التقليدية\n2. صورة توضيحية\n3. أخرى: كراسة النشاط، قلم رصاص، ورق رسم أبيض", "1. الخط\n2. التناسب الخطي\n3. البعد والقرب", "التعلم القبلي: مفاهيم التكوين الجيد والمخطط الأولي للمشهد.\nيرسم المعلم على السبورة خطين لشجرتين بسماكتين مختلفتين ويسأل: أيهما أقرب إليك؟ ويستنتج الط تكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. السبورة التقليدية\n4. أخرى: لوحة الخطوات التعليمية، نماذج لتكوينات طبيعية بالخطوط\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\n1. السبورة التقليدية\n2. صورة توضيحية\n3. أخرى: كراسة النشاط، قلم رصاص، ورق رسم أبيض\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\n1. صورة توضيحية\n2. أخرى: كراسة النشاط، أقلام رصاص بدرجات مختلفة", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\n1. التعبير\n2. التكوين الجيد\n3. الوحدات الشكلية (الشكل)\n4. الأرضية\n5. التناسب الخطي\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\n1. الخط\n2. التناسب الخطي\n3. البعد والقرب\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\n1. الوحدة\n2. الترابط\n3. الاتزان", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nالتعلم القبلي: مهارات الرسم والتصوير وقيمة التناسب بين الشكل والأرضية من خلال البعد والقرب في الصف الثامن.\nيعرض المعلم صورًا لمشاهد عمانية (جبال، صحارى، أشجار، بيوت تراثية) ويسأل: ما الذي يشدك أولًا في كل مشهد؟ ويحدد الطالب العنصر الأبرز (الشكل) وما يحيط به (الأرضية).\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nالتعلم القبلي: مفاهيم التكوين الجيد والمخطط الأولي للمشهد.\nيرسم المعلم على السبورة خطين لشجرتين بسماكتين مختلفتين ويسأل: أيهما أقرب إليك؟ ويستنتج الطالب أن الخط الأسمك والحجم الأكبر يوحيان بالقرب.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nالتعلم القبلي: التكوين المرسوم في الحصة السابقة.\nيعرض المعلم تكوينًا ناقصًا ويسأل: ما الذي يحتاجه ليصبح مترابطًا؟ ويقترح الطالب وحدات تربط الأجزاء أو تفاصيل في الأرضية.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورًا لمشاهد عمانية (جبال، صحارى، أشجار، بيوت تراثية) ويسأل: ما الذي يشدك أولًا في كل مشهد؟ ويحدد الطالب العنصر الأبرز (الشكل) وما يحيط به (الأرضية) (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تحليل التكوينات: يعرض المعلم نماذج لتكوينات منفذة بالخطوط ويقود حوارًا لاستقصاء: أين الشكل؟ أين الأرضية؟ كيف رُتبت الوحدات؟ ويحلل الطالب النماذج ويحدد الوحدات الشكلية والأرضية (12 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n3. بناء المفاهيم: يبني المعلم خريطة ذهنية تضم: التعبير، التكوين الجيد المعتمد على الوحدة والترابط والاتزان، الشكل، الأرضية، الخط، ويشارك الطالب في صياغة تعريفات المفاهيم بلغته (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. اختيار المشهد: يوجه كل طالب لاختيار مشهد من الطبيعة العمانية يعبر عنه بالرسم، ويختار الطالب مشهدًا ويرسم مخططًا أوليًا سريعًا (اسكتش) (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يلخص المعلم ويذكّر بإحضار كراسة النشاط والأدوات، ويذكر الطالب مفهومًا تعلمه وتعريفه (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يرسم المعلم على السبورة خطين لشجرتين بسماكتين مختلفتين ويسأل: أيهما أقرب إليك؟ ويستنتج الطالب أن الخط الأسمك والحجم الأكبر يوحيان بالقرب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. العرض التوضيحي: يعرض المعلم على لوحة الخطوات مراحل رسم التكوين: تحديد الخط الأرضي، توزيع الوحدات، التفاصيل، تأكيد الخطوط، ويتابع الطالب الخطوات ويطرح أسئلته (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. الرسم: يتجول المعلم ويوجه بأسلوب مباشر نحو تحقيق التناسب الخطي ويعزز المحاولات الجيدة، ويرسم الطالب تكوينه بالقلم الرصاص موزعًا الوحدات على الأرضية (22 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطلب المعلم ترتيب الأدوات ويختار عملين للمناقشة، ويرتب الطالب أدواته ويستمع للملاحظات (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم تكوينًا ناقصًا ويسأل: ما الذي يحتاجه ليصبح مترابطًا؟ ويقترح الطالب وحدات تربط الأجزاء أو تفاصيل في الأرضية (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الاستكمال والتأكيد: يتابع المعلم الإضافات ويوجه إلى تأكيد الخطوط الأمامية وتخفيف الخلفية، ويستكمل الطالب تفاصيل الوحدات والأرضية ويؤكد الخطوط (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التقويم بكراسة النشاط: يفعّل المعلم أسئلة كراسة النشاط المرتبطة بالدرس، ويجيب الطالب عن أسئلة الكراسة (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: ينظم المعلم تقويمًا ثنائيًا بمعايير الوحدة والترابط والاتزان، ويتبادل الطالب العمل مع زميله ويقيمه وفق المعايير (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – بطاقة بريدية من عمان: تخطط كل مجموعة تكوينًا سريعًا لمشهد عماني (نخيل وفلج، أو جبل وقلعة) على بطاقة بريدية، وتحدد فيه الشكل والأرضية، ثم تكتب عليها عبارة ترحيب قصيرة بزوار سلطنة عمان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nس1 (مستوى المعرفة): ماذا نسمي العنصر الرئيس في التكوين الذي يجذب العين؟\nالإجابة: الشكل (الوحدات الشكلية).\n\nس2 (مستوى التطبيق): ما مقومات الإجادة التي يعتمد عليها التكوين الجيد؟\nالإجابة: الوحدة والترابط والاتزان.\n\nس3 (مستوى الاستدلال): كيف يتحقق التناسب الخطي بين الشكل والأرضية؟\nالإجابة: بتنظيم أحجام الوحدات وسماكة خطوطها وفق قربها وبعدها وأهميتها في التكوين.\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nس1 (مستوى المعرفة): كيف تُظهر بالخط أن عنصرًا ما بعيد؟\nالإجابة: برسمه أصغر حجمًا وبخط أخف.\n\nس2 (مستوى التطبيق): ما أول خطوة في رسم التكوين؟\nالإجابة: تحديد خط الأرض أو الأفق وتوزيع الوحدات الرئيسة.\n\nس3 (مستوى الاستدلال): لماذا يُعد التناسب الخطي قيمة جمالية؟\nالإجابة: لأنه يمنح التكوين عمقًا وتوازنًا وانسجامًا بين أجزائه.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nس1 (مستوى المعرفة): ما المقصود بالترابط في التكوين؟\nالإجابة: اتصال الوحدات ببعضها بصريًا بحيث تبدو جزءًا من كل.\n\nس2 (مستوى التطبيق): كيف تؤكد الخطوط الأمامية في التكوين؟\nالإجابة: بزيادة الضغط وسماكة الخط.\n\nس3 (مستوى الاستدلال): اقترح وحدة شكلية تضيف ترابطًا لتكوينك.\nالإجابة: مثال: نخلة أو ممر يربط مقدمة المشهد بخلفيته.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nس1 (مستوى المعرفة): عرّف التكوين الجيد.\nالإجابة: تنظيم الشكل بمكوناته مع الأرضية وتأكيدها بالخطوط معتمدًا على الوحدة والترابط والاتزان.\n\nس2 (مستوى التطبيق): حدد الشكل والأرضية في مشهد لقلعة على جبل.\nالإجابة: الشكل: القلعة، والأرضية: الجبل والسماء.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يحقق الاتزان في تكوين تتجمع وحداته في جهة واحدة.\nالإجابة: توزيع وحدات مساندة في الجهة المقابلة أو نقل مركز الاهتمام.\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nس1 (مستوى المعرفة): ما الأداة المستخدمة في رسم التكوين؟\nالإجابة: قلم الرصاص.\n\nس2 (مستوى التطبيق): صف كيف وزعت الوحدات الشكلية في تكوينك.\nالإجابة: إجابة تذكر الوحدات القريبة والبعيدة ومواضعها.\n\nس3 (مستوى الاستدلال): قيّم تحقق التناسب الخطي في تكوين زميل.\nالإجابة: تقييم يذكر مدى تدرج الأحجام والخطوط مع اقتراح.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nس1 (مستوى المعرفة): اذكر مقومات الإجادة الثلاثة.\nالإجابة: الوحدة والترابط والاتزان.\n\nس2 (مستوى التطبيق): قيّم تكوينك وفق أحد المقومات.\nالإجابة: تقييم معلل يذكر موضع التحقق.\n\nس3 (مستوى الاستدلال): كيف سيساعدك التكوين الجيد في مرحلة التلوين القادمة؟\nالإجابة: وضوح الوحدات وخطوطها يسهل توزيع الألوان والضوء والظل.", "الحصة 1: مفاهيم التكوين الجيد: الشكل والأرضية والخط وقيمة التناسب الخطي\nإرشاد للطالب: يتأمل مشهدًا طبيعيًا في بيئته ويحدد فيه الشكل والأرضية.\nإرشاد لولي الأمر: يتحاور مع ابنه حول جمال المشاهد الطبيعية العمانية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 17–24.\n\nالحصة 2: رسم تكوين جيد بالخطوط لمشهد من الطبيعة العمانية\nإرشاد للطالب: يلاحظ الأحجام الظاهرية للأشياء القريبة والبعيدة.\nإرشاد لولي الأمر: يشجع ابنه على الرسم الحر لمشاهد بيئته.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 23–25.\n\nالحصة 3: استكمال التكوين بالخطوط وتأكيد الوحدة والترابط والاتزان وتقويمه\nإرشاد للطالب: يحفظ تكوينه نظيفًا للتلوين في الدرس القادم.\nإرشاد لولي الأمر: يتابع مع ابنه أهمية الإتقان في العمل الفني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 25.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/9/arts/?l=1"]}, {"title": "الدرس الثاني: الشكل يتناغم ضوئيًا في التكوين", "unit": "الوحدة الأولى: البيئة العمانية الجميلة", "periods": [{"ax": "مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية", "n": 1, "w": "الأسبوع الرابع: من 27/9/2026 إلى 1/10/2026", "pg": "26–29", "f": ["1. يفسر مفهومي الضوء والظل عنصرين ثانويين يظهران هيئة الشكل (15 دقيقة)\n2. يتعرف خطوات تلوين الشكل في التكوين بالألوان المائية من خلال البيان العملي (10 دقائق)\nمخرج آخر: يهتم بمتابعة خطوات العرض التوضيحي (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. العرض التوضيحي", "1. السبورة التقليدية\n2. صورة توضيحية\n3. أخرى: لوحة الخطوات التعليمية، ألوان مائية، فرش بمقاسات مختلفة", "1. الضوء\n2. الظل\n3. التناغم الضوئي اللوني\n4. الألوان المائية", "التعلم القبلي: التكوين الجيد بالخطوط ومفاهيمه.\nيسلط المعلم ضوءًا على كرة ويسأل: كم درجة لونية تراها على سطحها؟ ويلاحظ الطالب الجزء المضيء ونصف الظل والظل.", "1. التهيئة: يسلط المعلم ضوءًا على كرة ويسأل: كم درجة لونية تراها على سطحها؟ ويلاحظ الطالب الجزء المضيء ونصف الظل والظل (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. البيان العملي: يجري المعلم بيانًا عمليًا بلوحة الخطوات: تحضير الألوان، البدء بالفاتح، التدرج نحو الداكن، ترك مساحات الضوء، ويتابع الطالب البيان ويدون الخطوات (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. المفاهيم: يتوصل المعلم مع الطلبة إلى معنى التكوين الملون والضوء والظل والتناغم الضوئي، ويصوغ الطالب التعريفات بمساعدة المعلم (8 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n4. تجربة الألوان: يوجه المعلم إلى تجربة مزج ودرجات على ورقة تجارب، وينفذ الطالب شريط تدرج للون واحد من الفاتح للداكن (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يربط المعلم التجربة بتلوين الوحدات في الحصة القادمة، ويحدد الطالب مصدر الضوء في تكوينه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "س1 (مستوى المعرفة): ما وظيفة الضوء والظل في التكوين؟\nالإجابة: إظهار هيئة الشكل وتجسيمه.\n\nس2 (مستوى التطبيق): لم  تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\n1. صورة توضيحية\n2. أخرى: ألوان مائية، فرش، كراسة النشاط", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\n1. الضوء\n2. الظل\n3. التناغم الضوئي اللوني\n4. الألوان المائية\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\n1. الإضاءة\n2. الظلال اللونية\n3. هيئة الشكل\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\n1. التناغم الضوئي اللوني\n2. التناسق اللوني", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nالتعلم القبلي: التكوين الجيد بالخطوط ومفاهيمه.\nيسلط المعلم ضوءًا على كرة ويسأل: كم درجة لونية تراها على سطحها؟ ويلاحظ الطالب الجزء المضيء ونصف الظل والظل.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nالتعلم القبلي: تجربة التدرج اللوني وتحديد مصدر الضوء.\nيعرض المعلم تكوينًا ملونًا (الشكل 5) ويسأل: كيف عرفت أن الشمس من جهة اليمين؟ ويستدل الطالب بمواضع الضوء والظل في الوحدات.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nالتعلم القبلي: الوحدات الملونة بالضوء والظل.\nيعرض المعلم لوحتين: إحداهما متناغمة الضوء والأخرى متضاربة، ويسأل: أيهما مريحة للعين؟ ويختار الطالب المتناغمة ويعلل بانسجام الضوء.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسلط المعلم ضوءًا على كرة ويسأل: كم درجة لونية تراها على سطحها؟ ويلاحظ الطالب الجزء المضيء ونصف الظل والظل (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. البيان العملي: يجري المعلم بيانًا عمليًا بلوحة الخطوات: تحضير الألوان، البدء بالفاتح، التدرج نحو الداكن، ترك مساحات الضوء، ويتابع الطالب البيان ويدون الخطوات (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. المفاهيم: يتوصل المعلم مع الطلبة إلى معنى التكوين الملون والضوء والظل والتناغم الضوئي، ويصوغ الطالب التعريفات بمساعدة المعلم (8 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n4. تجربة الألوان: يوجه المعلم إلى تجربة مزج ودرجات على ورقة تجارب، وينفذ الطالب شريط تدرج للون واحد من الفاتح للداكن (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يربط المعلم التجربة بتلوين الوحدات في الحصة القادمة، ويحدد الطالب مصدر الضوء في تكوينه (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم تكوينًا ملونًا (الشكل 5) ويسأل: كيف عرفت أن الشمس من جهة اليمين؟ ويستدل الطالب بمواضع الضوء والظل في الوحدات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تلوين الوحدات: يتابع المعلم التلوين ويوجه إلى البدء بالطبقة الفاتحة وانتظار الجفاف قبل الظلال، والطلبة يلون الوحدات الشكلية بالتدرج من الفاتح إلى الداكن (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n3. وقفة تأمل: يطلب المعلم الابتعاد عن اللوحة لرؤيتها من مسافة، ويتأمل الطالب لوحته ويحدد ما يحتاج تعديلًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يوجه المعلم لتنظيف الفرش وحفظ اللوحة، وينظف الطالب أدواته ويحفظ لوحته (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم لوحتين: إحداهما متناغمة الضوء والأخرى متضاربة، ويسأل: أيهما مريحة للعين؟ ويختار الطالب المتناغمة ويعلل بانسجام الضوء (4 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. معالجة التناغم: يوجه المعلم إلى توحيد درجات الضوء وتنسيق الظلال بين الوحدات، ويعالج الطالب الوحدات لتحقيق التناغم الضوئي (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. التقويم: يفعل المعلم أساليب التقويم في كراسة النشاط ويطرح أسئلة شفوية، ويجيب الطالب عن أسئلة التقويم (9 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يمهد المعلم لتلوين الأرضية وإخراج التكوين في الدرس القادم، ويحدد الطالب ألوان الأرضية المقترحة (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ظلال على القلعة: يناقش كل زوج كيف يسقط ضوء الشمس على أبراج قلعة عمانية أو على كثبان رمال الشرقية صباحًا ومساءً، ثم يرسم سهمًا لاتجاه الضوء ويظلل جهة الظل في رسم سريع ويشاركه مع زوج آخر (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nس1 (مستوى المعرفة): ما وظيفة الضوء والظل في التكوين؟\nالإجابة: إظهار هيئة الشكل وتجسيمه.\n\nس2 (مستوى التطبيق): لماذا نبدأ بالدرجات الفاتحة في الألوان المائية؟\nالإجابة: لأن الألوان المائية شفافة ويصعب تفتيح اللون الداكن بعد وضعه.\n\nس3 (مستوى الاستدلال): كيف يتحقق التناغم الضوئي بين الوحدات الشكلية؟\nالإجابة: بتوحيد اتجاه الضوء على جميع الوحدات وتدرج الظلال بانسجام.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nس1 (مستوى المعرفة): لماذا ننتظر جفاف الطبقة الأولى قبل الظلال؟\nالإجابة: حتى لا تختلط الألوان وتفقد وضوحها.\n\nس2 (مستوى التطبيق): كيف تُظهر الظل في نخلة بالألوان المائية؟\nالإجابة: بإضافة درجة أغمق من لونها في الجهة المعاكسة للضوء.\n\nس3 (مستوى الاستدلال): حلل لوحة زميل: هل اتجاه الضوء موحد في جميع الوحدات؟\nالإجابة: تحليل يحدد التطابق أو الاختلاف مع اقتراح.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nس1 (مستوى المعرفة): ما المقصود بالتناغم الضوئي اللوني؟\nالإجابة: انسجام درجات الضوء والظل بين الوحدات الشكلية بحيث تبدو تحت مصدر ضوء واحد.\n\nس2 (مستوى التطبيق): كيف تعالج وحدة تبدو أكثر إضاءة من غيرها؟\nالإجابة: بتغميق درجتها أو إضافة ظل خفيف متسق مع بقية الوحدات.\n\nس3 (مستوى الاستدلال): انقد لوحة زميل من حيث التناغم الضوئي.\nالإجابة: نقد يحدد مواطن الانسجام والخلل مع اقتراح.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nس1 (مستوى المعرفة): أكمل: الضوء والظل عنصران فنيان ……… يظهران هيئة الشكل.\nالإجابة: مساعدان (ثانويان).\n\nس2 (مستوى التطبيق): صف خطوات البيان العملي بالترتيب.\nالإجابة: تحضير الألوان، التلوين بالفاتح، التدرج للداكن، ترك مناطق الضوء، التأكيد.\n\nس3 (مستوى الاستدلال): حدد مصدر الضوء في تكوينك وبيّن أثره على الوحدات.\nالإجابة: إجابة تحدد الاتجاه ومواضع الضوء والظل.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nس1 (مستوى المعرفة): ما الأداة المستخدمة لمزج الألوان؟\nالإجابة: الباليتة.\n\nس2 (مستوى التطبيق): بيّن كيف أظهرت هيئة إحدى الوحدات بالضوء والظل.\nالإجابة: إجابة تصف مواضع الضوء والظل في الوحدة.\n\nس3 (مستوى الاستدلال): اقترح طريقة لتصحيح لون داكن زائد في الألوان المائية.\nالإجابة: سحب اللون بفرشاة رطبة نظيفة أو ورق نشاف.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nس1 (مستوى المعرفة): ما القيمة الفنية لهذا الدرس؟\nالإجابة: التناغم الضوئي اللوني بين الوحدات الشكلية.\n\nس2 (مستوى التطبيق): قيّم تحقق التناغم في لوحتك.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): اقترح ألوانًا للأرضية تنسجم مع وحداتك.\nالإجابة: إجابة تربط ألوان الأرضية بألوان الوحدات ودرجتها.", "الحصة 1: مفاهيم الضوء والظل والتناغم الضوئي اللوني والبيان العملي للتلوين بالألوان المائية\nإرشاد للطالب: يلاحظ تغير الظلال في بيئته خلال اليوم.\nإرشاد لولي الأمر: يوفر لابنه بيئة هادئة لملاحظة الضوء والظل في المنزل.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 26–29.\n\nالحصة 2: تلوين الوحدات الشكلية بالألوان المائية وفق اتجاه الضوء\nإرشاد للطالب: يتأمل لوحات بالألوان المائية لفنانين عمانيين.\nإرشاد لولي الأمر: يشجع ابنه على الصبر في التلوين بطبقات.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 28–30.\n\nالحصة 3: تحقيق التناغم الضوئي اللوني بين الوحدات الشكلية وتقويم المرحلة\nإرشاد للطالب: يحفظ لوحته لاستكمالها في الدرس القادم.\nإرشاد لولي الأمر: يثني على جهد ابنه ويشجعه على الإتقان.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 30.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/9/arts/?l=2"]}, {"title": "الدرس الثالث: التكوين في صورته النهائية", "unit": "الوحدة الأولى: البيئة العمانية الجميلة", "periods": [{"ax": "البيان العملي لاستكمال تلوين الأرضية ومفهوم الانتشار الضوئي اللوني", "n": 1, "w": "الأسبوع السابع: من 18/10/2026 إلى 22/10/2026", "pg": "31–35", "f": ["1. يتعرف الخطوات الفنية لإخراج التكوين بصورته النهائية (10 دقائق)\n2. يفسر قيمة الانتشار الضوئي اللوني بين الشكل والأرضية (15 دقيقة)\nمخرج آخر: يبدي اهتمامًا بإتقان المرحلة النهائية (15 دقيقة)", "المخرج 1: تذكر\nال لأرضية.\nيسأل المعلم: ماذا يحدث إذا لُونت الأرضية بدرجة الشكل نفسها؟ ويستنتج الطالب أن الشكل سيختفي.\n\nالحصة 3: إخراج التكوين بصورته النهائية وتصنيف الأعمال وتقويم الوحدة\nالتعلم القبلي: اللوحة الملونة شبه المكتملة.\nيسأل المعلم: ما المعايير التي تجعلنا نحكم على لوحة بأنها ممتازة؟ ويقترح الطالب معايير (التكوين، الضوء، النظافة).", "الحصة 1: البيان العملي لاستكمال تلوين الأرضية ومفهوم الانتشار الضوئي اللوني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم تكوينات جيدة بصورتها النهائية (الشكل 9) ويسأل: كيف ظهرت الوحدات واضحة على الأرضية؟ ويلاحظ الطالب تباين الضوء بين الشكل والأرضية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. البيان العملي: يوضح المعلم تلوين الأرضية بدرجات تخدم الشكل، وتوزيع المناطق المضيئة ومتوسطة الظل والمظلمة، ويتابع الطالب البيان ويطرح أسئلة (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. المفاهيم: يتوصل المعلم مع الطلبة إلى معنى الانتشار الضوئي اللوني والضوء والظل في الصورة النهائية، ويكمل الطالب خريطة ذهنية للمفاهيم (8 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n4. البدء بالأرضية: يتابع المعلم بدء تلوين الأرضية، والطلبة يلون الطبقة الأولى من الأرضية (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يذكر المعلم بالمرحلة القادمة، ويحفظ الطالب عمله (3 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: استكمال تلوين الشكل مع الأرضية وتأكيد الإضاءة والظلال اللونية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ماذا يحدث إذا لُونت الأرضية بدرجة الشكل نفسها؟ ويستنتج الطالب أن الشكل سيختفي (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الاستكمال: يتابع المعلم التلوين ويوجه فرديًا، ويستكمل الطالب الأرضية ويؤكد الضوء والظل (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n3. مراجعة الأقران: يطلب المعلم ملاحظة سريعة من زميل، ويتلقى الطالب ملاحظة ويعدّل (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب أدواته (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: إخراج التكوين بصورته النهائية وتصنيف الأعمال وتقويم الوحدة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما المعايير التي تجعلنا نحكم على لوحة بأنها ممتازة؟ ويقترح الطالب معايير (التكوين، الضوء، النظافة) (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. اللمسات الأخيرة: يوجه المعلم إلى اللمسات النهائية وتأكيد التفاصيل، ويضع الطالب اللمسات الأخيرة على لوحته (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. التصنيف والنقد: ينظم المعلم عرضًا ويطبق معايير: التكوين، الانتشار الضوئي، النظافة، التعبير، ويصنف الطالب الأعمال إلى مستويات ويبرر (11 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. تقويم الوحدة: يطرح المعلم أسئلة ختامية للوحدة، ويجيب الطالب ويستخلص التعلم (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: يقترح المعلم معرضًا أو ركنًا فنيًا للأعمال، ويقترح الطالب عنوانًا للمعرض (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – معرض الوطن الصغير: تعلّق المجموعات تكويناتها في معرض قصير، وتتجول بينها لتمنح نجمة للعمل الذي يُبرز جمال البيئة العمانية بأفضل انتشار ضوئي لوني بين الشكل والأرضية مع ذكر السبب (5 دقائق)\nالاستراتيجيات: معرض التجوال.", "الحصة 1: البيان العملي لاستكمال تلوين الأرضية ومفهوم الانتشار الضوئي اللوني\nس1 (مستوى المعرفة): ما المناطق الثلاث للانتشار الضوئي؟\nالإجابة: المضيئة، متوسطة الظل، المظلمة.\n\nس2 (مستوى التطبيق): لماذا تُلوَّن الأرضية بدرجات تخدم الشكل؟\nالإجابة: لإبراز الوحدات الشكلية وتأكيد أهميتها.\n\nس3 (مستوى الاستدلال): كيف يحقق الانتشار الضوئي إحساسًا بالعمق؟\nالإجابة: بتوزيع الضوء والظل تدريجيًا بين المقدمة والخلفية.\n\nالحصة 2: استكمال تلوين الشكل مع الأرضية وتأكيد الإضاءة والظلال اللونية\nس1 (مستوى المعرفة): كيف تفصل الشكل عن الأرضية لونيًا؟\nالإجابة: بالتباين في الدرجة أو اللون.\n\nس2 (مستوى التطبيق): أين تضع أغمق الظلال في المشهد؟\nالإجابة: في المناطق البعيدة عن الضوء وتحت الوحدات.\n\nس3 (مستوى الاستدلال): حلل أثر لون الأرضية على وضوح الوحدات في لوحتك.\nالإجابة: تحليل يربط درجة الأرضية بوضوح الوحدات.\n\nالحصة 3: إخراج التكوين بصورته النهائية وتصنيف الأعمال وتقويم الوحدة\nس1 (مستوى المعرفة): اذكر معيارين لتقويم اللوحة النهائية.\nالإجابة: تحقق الانتشار الضوئي، ونظافة العمل (أو جودة التكوين).\n\nس2 (مستوى التطبيق): كيف تعرف أن الانتشار الضوئي تحقق في لوحة؟\nالإجابة: بوضوح المناطق المضيئة ومتوسطة الظل والمظلمة وتدرجها.\n\nس3 (مستوى الاستدلال): انقد لوحة زميل نقدًا بنّاءً.\nالإجابة: نقد يذكر نقطتي قوة واقتراحًا.", "الحصة 1: البيان العملي لاستكمال تلوين الأرضية ومفهوم الانتشار الضوئي اللوني\nس1 (مستوى المعرفة): عرّف الانتشار الضوئي اللوني.\nالإجابة: قيمة فنية تنتج من توزيع درجات الضوء اللوني بين الشكل والأرضية في التكوين.\n\nس2 (مستوى التطبيق): حدد منطقة مضيئة وأخرى مظلمة في تكوينك.\nالإجابة: إجابة صحيحة تحدد الموضعين.\n\nس3 (مستوى الاستدلال): اقترح خطة ألوان للأرضية تحقق الانتشار الضوئي.\nالإجابة: خطة تبدأ بفاتح في البعيد وتتدرج للداكن في المقدمة أو العكس بحسب الضوء.\n\nالحصة 2: استكمال تلوين الشكل مع الأرضية وتأكيد الإضاءة والظلال اللونية\nس1 (مستوى المعرفة): ما الخامة اللونية المستخدمة في الإخراج؟\nالإجابة: الألوان المائية.\n\nس2 (مستوى التطبيق): صف تعديلًا أجريته بعد ملاحظة زميلك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم وضوح الشكل على الأرضية في لوحتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: إخراج التكوين بصورته النهائية وتصنيف الأعمال وتقويم الوحدة\nس1 (مستوى المعرفة): ما مراحل الوحدة الثلاث بالترتيب؟\nالإجابة: التكوين بالخطوط، تلوين الشكل، الإخراج النهائي مع الأرضية.\n\nس2 (مستوى التطبيق): صنف لوحتك وبرر.\nالإجابة: تصنيف معلل بالمعايير.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا لمعرض الصف يعبر عن الوحدة.\nالإجابة: مثال: «عمان بألوان الماء».", "الحصة 1: البيان العملي لاستكمال تلوين الأرضية ومفهوم الانتشار الضوئي اللوني\nإرشاد للطالب: يلاحظ كيف تبدو الأشياء البعيدة أفتح لونًا.\nإرشاد لولي الأمر: يشجع ابنه على متابعة الخطوات بدقة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 31–35.\n\nالحصة 2: استكمال تلوين الشكل مع الأرضية وتأكيد الإضاءة والظلال اللونية\nإرشاد للطالب: يتأمل لوحات المناظر الطبيعية ويلاحظ الأرضية.\nإرشاد لولي الأمر: يتابع مع ابنه إنجاز لوحته.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 33–35.\n\nالحصة 3: إخراج التكوين بصورته النهائية وتصنيف الأعمال وتقويم الوحدة\nإرشاد للطالب: يحتفظ بلوحته في ملف إنجازه ويعرضها ع ر بعد فك الربط.\nالإجابة: إجابة شخصية تصف الأشكال الناتجة.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا لتحسين النتيجة في تجربة قادمة.\nالإجابة: مثال: إحكام الربط أكثر أو تنويع أحجام الحصى.", "إرشاد للطالب: يحتفظ بقماشه المطبوع لاستكماله في الدرس القادم.\nإرشاد لولي الأمر: يشجع ابنه على تجربة الصباغة الآمنة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 45–46.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/9/arts/?l=4"]}], "comb": ["الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\n1. يستنبط المفاهيم الفنية المرتبطة بالإعداد لطباعة منتج فني بالعقد والربط (15 دقيقة)\n2. يوضح معنى التشكيل والمساحة واللون والملمس عناصرَ مرتبطة بالطباعة (10 دقائق)\nمخرج آخر: يطبق قواعد الأمن والسلامة عند التعامل مع الصبغات (15 دقيقة)\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\n1. ينفذ طريقة العقد بالحصى ذات الأحجام المختلفة على مساحات القماش (15 دقيقة)\n2. ينفذ طريقة الربط بالخيوط بعد ثني القماش بأساليب متنوعة (10 دقائق)\nمخرج آخر: يتسم بالابتكار والاكتشاف الحر في توزيع العقد (15 دقيقة)\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\n1. يغمس القماش المربوط في الصبغة اللونية وفق الخطوات الصحيحة (20 دقيقة)\n2. يحلل الأثر الناتج بعد فك الربط ويحدد تحقق التناغم المساحي اللوني ذي التأثير الملمسي (10 دقائق)\nمخرج آخر: يلتزم بقواعد الأمن والسلامة والنظافة (10 دقائق)", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nالمخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\n1. التعلم بالنمذجة\n2. التعلم بالاكتشاف\n3. العصف الذهني\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\n عة بالعقد والربط (الشكل 13) ويسأل: كيف ظهرت هذه الدوائر والخطوط على القماش؟ ويتوقع الطالب طريقة الطباعة (ربط القماش قبل الصبغ) (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مبدأ العزل: يوضح المعلم أن الفكرة تقوم على عزل أجزاء من القماش بالربط فلا تصلها الصبغة، ويستنتج الطالب سبب ظهور المساحات البيضاء (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. إعداد الصبغات والقماش: يشرح المعلم إعداد الصبغة (بودرة تعجن وتذاب في الماء المغلي ويضاف الملح) ويؤكد أن المعلم يتولى الماء الساخن، وغسل القماش بالماء والصابون، والطلبة يدون خطوات الإعداد وقواعد السلامة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. المفاهيم: يبني المعلم خريطة ذهنية: التشكيل، المساحة، اللون، الملمس، التناغم المساحي اللوني ذو التأثير الملمسي، ويشارك الطالب في تعريف المفاهيم (10 دقائق)\nالاستراتيجيات: الربط بالخيوط بعد الثني).\n\n5. الختام: يوزع المعلم القماش ويطلب إحضار حصى بأحجام مختلفة وخيوط مشمعة، ويستلم الطالب قماشه ويستعد للحصة القادمة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عقدتين بحصاتين مختلفتين ويسأل: أيهما ستعطي أثرًا أكبر؟ ويربط الطالب حجم الحصاة بحجم الأثر (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف الحر.\n\n2. نمذجة العقد: يمسك المعلم القماش من أحد أطرافه ويلف حول حصاة ويربط بإحكام، ثم يكرر على مساحات أخرى، ويتابع الطالب ويجرب عقدة أولى (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. نمذجة الربط: ينمذج المعلم ثني القماش (طولي، مروحي، لولبي) وربطه على مسافات متنوعة، ويتابع الطالب ويحدد الأسلوب الذي سيستخدمه (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. التنفيذ: يتابع المعلم إحكام الربط وتنوع المسافات، وينفذ الطالب العقد والربط على قماشه بتوزيع مبتكر (17 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: يجمع المعلم الأقمشة المربوطة مع كتابة اسم كل طالب، ويسلم الطالب قماشه (3 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ماذا سيحدث لو بقي القماش في الصبغة مدة أطول؟ ويتوقع الطالب أن يصبح اللون أغمق (5 دقائق)\nالاستراتيجيات: الربط بالخيوط بعد الثني).\n\n2. تجهيز ركن الصباغة: ينظم المعلم ركن الصباغة ويوزع القفازات ويتولى الصبغة الساخنة، ويرتدي الطالب القفازات والمريلة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغمس: يشرف المعلم على الغمس بالملقط بحسب الزمن المحدد، ويغمس الطالب قماشه ثم يخرجه ويعصره بلطف (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف الحر.\n\n4. فك الربط والتحليل: يوجه المعلم لفك الربط بالمقص بحذر بعد شطف القماش، ويفك الطالب الربط ويحلل الأثر الناتج (7 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n5. الختام: ينظم المعلم التجفيف والتنظيف ويناقش النتائج، ويعلق الطالب قماشه ويتحدث عن النتيجة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – نقوش المصر العماني: تتأمل المجموعات ألوان المصر والشال العماني ونقوشهما، وتقترح في دقائق كيف يمكن استلهامها بالعقد والربط لتصميم قطعة قماش تُهدى في احتفال المدرسة بالعيد الوطني (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nس1 (مستوى المعرفة): ما فكرة الطباعة بالعقد والربط؟\nالإجابة: عزل أجزاء من القماش بربطها حتى لا تصل إليها الصبغة.\n\nس2 (مستوى التطبيق): لماذا يُغسل القماش قبل الطباعة؟\nالإجابة: للتخلص من المواد المستخدمة في تجهيزه فتثبت الصبغة.\n\nس3 (مستوى الاستدلال): لماذا يُضاف الملح إلى الصبغة؟\nالإجابة: للمساعدة على تثبيت اللون في القماش.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nس1 (مستوى المعرفة): ما وظيفة الحصى في العقد؟\nالإجابة: تكوين مساحة دائرية معزولة عن الصبغة.\n\nس2 (مستوى التطبيق): لماذا يجب إحكام الربط؟\nالإجابة: حتى لا تتسرب الصبغة إلى الأجزاء المربوطة.\n\nس3 (مستوى الاستدلال): كيف يؤثر تنوع المسافات بين العقد في التصميم؟\nالإجابة: يحقق تنوعًا وإيقاعًا في المساحات اللونية.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\nس1 (مستوى المعرفة): ما الأداة المستخدمة في غمس القماش؟\nالإجابة: الملقط.\n\nس2 (مستوى التطبيق): لماذا يُشطف القماش بعد الصبغ؟\nالإجابة: لإزالة الصبغة الزائدة.\n\nس3 (مستوى الاستدلال): حلل الأثر الناتج: أين تحقق التناغم المساحي؟\nالإجابة: تحليل يحدد المساحات الملونة والمعزولة وانسجامها.", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nس1 (مستوى المعرفة): اذكر نوعين من الأقمشة المناسبة للطباعة بالعقد والربط.\nالإجابة: القطني والحريري.\n\nس2 (مستوى التطبيق): اذكر قاعدتي سلامة عند التعامل مع الصبغات.\nالإجابة: ارتداء القفازات والمريلة، وترك الماء المغلي للمعلم.\n\nس3 (مستوى الاستدلال): توقع شكل الأثر الناتج عن ربط حصاة صغيرة في القماش.\nالإجابة: دائرة صغيرة فاتحة بحلقات متدرجة حولها.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nس1 (مستوى المعرفة): اذكر طريقتين لتنفيذ الطباعة بالعقد والربط.\nالإجابة: العقد والربط.\n\nس2 (مستوى التطبيق): صف أسلوب الثني الذي استخدمته.\nالإجابة: إجابة شخصية صحيحة.\n\nس3 (مستوى الاستدلال): توقع شكل الأثر الناتج عن ثني القماش ثنيًا مروحيًا وربطه.\nالإجابة: خطوط أو أشرطة متوازية متكررة.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائج\nس1 (مستوى المعرفة): ما القيمة الفنية لهذا الدرس؟\nالإجابة: التناغم المساحي اللوني ذو التأثير الملمسي.\n\nس2 (مستوى التطبيق): صف الأثر الذي ظهر بعد فك الربط.\nالإجابة: إجابة شخصية تصف الأشكال الناتجة.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا لتحسين النتيجة في تجربة قادمة.\nالإجابة: مثال: إحكام الربط أكثر أو تنويع أحجام الحصى.", "الحصة 1: مفاهيم الطباعة بالعقد والربط والبيان العملي وإعداد القماش والصبغات\nإرشاد للطالب: يحضر حصى بأحجام مختلفة وخيوطًا مشمعة أو بلاستيكية.\nإرشاد لولي الأمر: يساعد ابنه في تجهيز الخامات ويؤكد على السلامة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 37–45.\n\nالحصة 2: تنفيذ العقد والربط على القماش (العقد بالحصى، الربط بالخيوط بعد الثني)\nإرشاد للطالب: يتأمل الأقمشة المطبوعة بأساليب تقليدية.\nإرشاد لولي الأمر: يتحاور مع ابنه حول الحرف التقليدية في الصباغة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 44–46.\n\nالحصة 3: غمس القماش في الصبغة وفك الربط وتجفيف المنتج وتحليل النتائ ح، نماذج منتجات\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط\n1. أخرى: أختام أو شرائح مفرغة، ألوان قماش، إسفنج، القماش المطبوع\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه\n1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: ألوان ريليف، إبرة وخيط للتشطيب", "الحصة 1: البيان العملي لاستكمال المنتج بالطباعة بالبصمة والشرائح ومفهوم الإيقاع الزخرفي اللوني\n1. التشكيل الجيد\n2. التكرار\n3. الإيقاع الزخرفي اللوني ذو التأثير الملمسي\n4. الطباعة بالبصمة والشرائح\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط\n1. البصمة\n2. الشريحة (الاستنسل)\n3. التكرار المنتظم\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه\n1. الريليف\n2. الإخراج الوظيفي\n3. التسويق", "الحصة 1: البيان العملي لاستكمال المنتج بالطباعة بالبصمة والشرائح ومفهوم الإيقاع الزخرفي اللوني\nالتعلم القبلي: القماش المطبوع بالعقد والربط.\nيعرض المعلم قماشين: الأول بالعقد والربط فقط، والثاني أضيفت إليه وحدات بالبصمة، ويسأل: ماذا أضافت البصمة؟ ويلاحظ الطالب الإيقاع الزخرفي والتفاصيل الإضافية.\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط\nالتعلم القبلي: الوحدة الزخرفية المصممة.\nيسأل المعلم: كيف نضمن أن تكون البصمات على مسافات متساوية؟ ويقترح الطالب التخطيط بخطوط خفيفة أو قياس المسافات.\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه\nالتعلم القبلي: المنتج المطبوع بالعقد والربط والبصمة.\nيعرض المعلم منتجين أحدهما محدد بالريليف ويسأل: ماذا أضاف التحديد؟ ويلاحظ الطالب البروز والوضوح.", "الحصة 1: البيان العملي لاستكمال المنتج بالطباعة بالبصمة والشرائح ومفهوم الإيقاع الزخرفي اللوني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم قماشين: الأول بالعقد والربط فقط، والثاني أضيفت إليه وحدات بالبصمة، ويسأل: ماذا أضافت البصمة؟ ويلاحظ الطالب الإيقاع الزخرفي والتفاصيل الإضافية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. البيان العملي: يوضح المعلم مراحل الاستكمال: تصميم الوحدة، تجهيز البصمة أو الشريحة، الطباعة بالتكرار، التحديد بالريليف، ويتابع الطالب ويدون المراحل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. المفاهيم: يتوصل المعلم مع الطلبة إلى معنى التشكيل الجيد والتكرار والإيقاع الزخرفي اللوني، ويكمل الطالب الخريطة الذهنية (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. تصميم الوحدة: يتابع المعلم تصميم وحدات بسيطة تناسب مساحة المنتج، ويصمم الطالب وحدة زخرفية ويجهز بصمتها أو شريحتها (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: يحدد المعلم خطة الطباعة للحصة القادمة، ويحدد الطالب مواضع تكرار وحدته (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف نضمن أن تكون البصمات على مسافات متساوية؟ ويقترح الطالب التخطيط بخطوط خفيفة أو قياس المسافات (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التخطيط: يوجه المعلم لتحديد مواضع الطباعة بخطوط خفيفة، ويخطط الطالب مواضع وحداته (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الطباعة: يتابع المعلم الطباعة ويوجه لتوحيد الضغط وكمية اللون، ويطبع الطالب وحداته بالتكرار على القماش (22 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: ينظم المعلم التجفيف والتنظيف ويناقش أثر الإيقاع، ويجفف الطالب عمله ويتحدث عن الإيقاع الناتج (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم منتجين أحدهما محدد بالريليف ويسأل: ماذا أضاف التحديد؟ ويلاحظ الطالب البروز والوضوح (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التحديد بالريليف: ينمذج المعلم الضغط المنتظم على أنبوب الريليف، ويحدد بعض الوحدات بالريليف (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. الإخراج الوظيفي: يوجه المعلم إلى تشطيب الأطراف وتحويل القطعة إلى منتج، ويُخرج الطالب منتجه بصورة وظيفية (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. العرض والتقويم: ينظم المعلم معرضًا مصغرًا ويقيم وفق التشكيل الجيد والإيقاع، ويعرض الطالب منتجه ويقيم أعمال زملائه (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يناقش المعلم طرق التسويق وأسعارًا مقترحة، ويقترح الطالب طريقة لتسويق منتجه (4 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – سوق الحرفيين: تمثّل المجموعات مشهدًا في سوق تقليدي كسوق مطرح، فيعرض «الحرفي» منتجه المطبوع بالعقد والربط ويشرح إيقاعه الزخرفي وملمسه، ويسأله «الزائر» عن قيمته التراثية وسبب شرائه (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: البيان العملي لاستكمال المنتج بالطباعة بالبصمة والشرائح ومفهوم الإيقاع الزخرفي اللوني\nس1 (مستوى المعرفة): ما المقصود بالتكرار في المنتج المطبوع؟\nالإجابة: إعادة طباعة الوحدة الزخرفية بانتظام على المساحة.\n\nس2 (مستوى التطبيق): ما الفرق بين الطباعة بالبصمة والطباعة بالشرائح؟\nالإجابة: البصمة بختم يُضغط على القماش، والشرائح قالب مفرغ يُمرر اللون من خلاله.\n\nس3 (مستوى الاستدلال): لماذا يجب أن تتناسب الوحدة مع مساحة المنتج؟\nالإجابة: لتحقيق التشكيل الجيد والاتزان دون ازدحام أو فراغ.\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط\nس1 (مستوى المعرفة): لماذا نوحد كمية اللون في كل طبعة؟\nالإجابة: للحصول على طبعات متجانسة.\n\nس2 (مستوى التطبيق): كيف تستخدم الإسفنج في الطباعة بالشرائح؟\nالإجابة: بتربيت اللون من خلال فتحات الشريحة.\n\nس3 (مستوى الاستدلال): حلل العلاقة بين ألوان البصمة وألوان العقد والربط في منتجك.\nالإجابة: تحليل يذكر التباين أو الانسجام بينهما.\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه\nس1 (مستوى المعرفة): ما وظيفة الريليف في المنتج؟\nالإجابة: إبراز الوحدات وإضافة تأثير ملمسي.\n\nس2 (مستوى التطبيق): كيف تحول القطعة المطبوعة إلى منتج وظيفي؟\nالإجابة: بتشطيب أطرافها وتفصيلها كوشاح أو كيس.\n\nس3 (مستوى الاستدلال): اقترح فئة مستهدفة لمنتجك ومكانًا لبيعه.\nالإجابة: مثال: الشباب، في معرض مدرسي أو متجر إلكتروني.", "الحصة 1: البيان العملي لاستكمال المنتج بالطباعة بالبصمة والشرائح ومفهوم الإيقاع الزخرفي اللوني\nس1 (مستوى المعرفة): ما القيمة الفنية لهذا الدرس؟\nالإجابة: الإيقاع الزخرفي اللوني ذو التأثير الملمسي.\n\nس2 (مستوى التطبيق): صف الوحدة الزخرفية التي صممتها.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): اقترح نوع الإيقاع المناسب لمنتجك وعلل.\nالإجابة: منتظم لمفرش، أو متدرج لوشاح، مع تعليل.\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط\nس1 (مستوى المعرفة): اذكر خامتين مستخدمتين في الطباعة.\nالإجابة: ألوان القماش والإسفنج (أو الأختام).\n\nس2 (مستوى التطبيق): صف الإيقاع الذي حققته.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تجانس طبعاتك واقترح تحسينًا.\nالإجابة: تقييم معلل.\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه\nس1 (مستوى المعرفة): ماذا يضيف الريليف للمنتج؟\nالإجابة: تأثيرًا ملمسيًا ووضوحًا للوحدات.\n\nس2 (مستوى التطبيق): قيّم منتجك وفق التشكيل الجيد والإيقاع.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): صمم بطاقة تسويقية مختصرة لمنتجك.\nالإجابة: اسم المنتج، خامته، طريقة صنعه، سعر مقترح.", "الحصة 1: البيان العملي لاستكمال المنتج بالطباعة بالبصمة والشرائح ومفهوم الإيقاع الزخرفي اللوني\nإرشاد للطالب: يلاحظ الزخارف المتكررة على الأقمشة في المنزل.\nإرشاد لولي الأمر: يشارك ابنه في اختيار منتج مناسب (وشاح، كيس قماشي).\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 47–50.\n\nالحصة 2: طباعة الوحدات الزخرفية بالبصمة أو الشرائح على القماش المطبوع بالعقد والربط\nإرشاد للطالب: يتأمل المنتجات المطبوعة في الأسواق التقليدية.\nإرشاد لولي الأمر: يتابع تقدم ابنه في منتجه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 49–51.\n\nالحصة 3: التحديد بالريليف وإخراج المنتج الفني وتقويمه وتسويقه\nإرشاد للطالب: يعرض منتجه على أسرته ويستخدمه أو يهديه.\nإرشاد لولي الأمر: يشجع ابنه على تسويق منتجاته في المعارض.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف التاسع – الفصل الأول) ص 49–52.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/9/arts/?l=5"]}]);
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
