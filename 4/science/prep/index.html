:root{--ink:#24323E;--mute:#5E7080;--line:#DCE4EA;--bg:#F6F8FA;--card:#fff;--acc:#3F6F96;--soft:#E3EEF8;--pale:#F4F8FC;--ok:#2F7A4F;--okbg:#E4F3E9}
body.u2{--acc:#457C52;--soft:#E2F1E5;--pale:#F5FAF6}
body.u3{--acc:#A8683A;--soft:#FBEBDD;--pale:#FDF7F1}
*{box-sizing:border-box}
body{margin:0;font-family:'Plex',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;font-size:16px}
.top{position:sticky;top:0;z-index:5;background:rgba(246,248,250,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.wrap{max-width:960px;margin:0 auto;padding:12px 16px}
h1{font-size:20px;margin:0 0 8px;font-weight:700}
.mode{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--mute);padding:7px 16px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--acc)}
.now{font-weight:600;color:var(--acc);background:var(--pale);border:1px solid var(--soft);border-radius:9px;padding:5px 12px;font-size:14.5px}
.explain{font-size:13.5px;color:var(--mute);margin:8px 0 0}
.explain b{color:var(--ink);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
select{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 14px;cursor:pointer;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
main.wrap{padding-top:16px;padding-bottom:60px}
.info{background:var(--soft);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.info .t{font-size:19px;font-weight:700}
.info .ax{color:var(--acc);font-weight:600}
.info .m{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 16px;font-size:14px;margin-top:6px}
.info .m span b{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pale);border-bottom:1px solid var(--soft)}
.num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.card h2{font-size:16px;margin:0;flex:1;font-weight:700;color:var(--acc)}
.copy{font:inherit;font-weight:600;font-size:14.5px;border:1.5px solid var(--acc);color:var(--acc);background:#fff;border-radius:10px;padding:6px 16px;cursor:pointer;min-width:118px;transition:background .2s,color .2s}
.copy:hover{background:var(--soft)}
.copy.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.copy:focus-visible,.seg button:focus-visible,.tabs button:focus-visible,select:focus-visible{outline:3px solid #9CC3E4;outline-offset:2px}
.txt{white-space:pre-wrap;padding:12px 14px;font-size:15px;margin:0;font-family:inherit;user-select:text;-webkit-user-select:text}
.txt .ph{display:block;font-weight:700;color:var(--acc);margin-top:6px}
.hint{display:none;font-size:13px;color:#8A5A20;background:#FFF5E6;padding:6px 14px;border-top:1px solid #F3E2C6}
.hint.show{display:block}
@media (max-width:600px){.top{position:static}h1{font-size:17px}.copy{min-width:96px;padding:6px 10px}.txt{font-size:14.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="top"><div class="wrap">
<h1>نسخ حقول نور – العلوم، الصف الرابع، الفصل الدراسي الأول</h1>
<div class="mode">
 <div class="seg" role="group" aria-label="نوع التحضير">
  <button id="mSep" aria-pressed="true">تحضير منفصل</button>
  <button id="mComb" aria-pressed="false">تحضير مدمج</button>
 </div>
 <div class="now" id="now"></div>
</div>
<p class="explain"><b>المنفصل:</b> نموذج نور مستقل لكل حصة، فيه بنود تلك الحصة فقط.<br><b>المدمج:</b> نموذج واحد للدرس كله، وكل بند فيه يجمع حصص الدرس تحت عناوين «الحصة 1، الحصة 2…».</p>
<div class="pick">
 <select id="les" aria-label="اختر الدرس"></select>
 <div class="tabs" id="tabs" role="tablist" aria-label="الحصة"></div>
</div>
</div></div>
<main class="wrap">
 <div class="info" id="info"></div>
 <div id="cards"></div>
</main>
<script>
const D={"names": ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"], "lessons": [{"id": "1-1", "title": "الهياكل العظمية", "unit": 1, "unitName": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الأول (6–10/9/2026)", "sb": "22–23", "ab": "15", "tg": "19–21", "periods": [{"axis": "حاجة الجسم إلى هيكل عظمي داخلي", "h": {"lesson": "1-1 الهياكل العظمية", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الأول (6–10/9/2026)", "sb": "22", "ab": "—", "tg": "19–21", "n": "1 من 5", "axis": "حاجة الجسم إلى هيكل عظمي داخلي"}, "f": ["1. يذكر أن للإنسان وبعض الحيوانات هيكلًا عظميًا داخل الجسم.\nمخرج تعليمي آخر (2): يفسّر حاجة الجسم إلى الهيكل العظمي لدعمه من الداخل.", "المخرج 1 (يذكر أن للإنسان وبعض الحيوانات هيكلًا عظميًا داخل الجسم): تذكر\nالمخرج 2 (يفسّر حاجة الجسم إلى الهيكل العظمي لدعمه من الداخل): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: العصف الذهني.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: ورق مقوّى كبير لرسم مخطط الجسم، ورقة A4.", "الهيكل العظمي، العظام، الدعم، داخل الجسم.", "يعرض المعلم صورة هيكل عظمي من متحف ويسأل: ماذا ترون؟ أين يوجد هذا الشيء في أجسامنا؟ ثم يستمع لخبرات الطلاب عن هياكل شاهدوها في التلفاز أو المتاحف.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض صورة الهيكل العظمي ويطرح أسئلة التمهيد.\n   دور الطالب: يصفون الصورة ويذكرون أين شاهدوا هياكل عظمية.\n2) مخطط جسم زميل (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يلصق ورقًا مقوى على الحائط ويرسم حول جسم طالب يقف أمامه، ثم يسأل: ما الأجزاء التي يجب أن نضيفها داخل المخطط؟\n   دور الطالب: يقترحون أجزاء الجسم ومواقعها حتى يصلوا إلى إضافة العظام والهيكل العظمي.\n3) تجربة الورقة (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يمسك ورقة A4 مستقيمة ثم يتركها فتنثني، ويسأل: ماذا سيحدث لأجسامنا لو لم يكن فيها هيكل عظمي؟\n   دور الطالب: يلاحظون انثناء الورقة ويستنتجون أن الجسم يحتاج إلى دعم داخلي.\n4) قراءة ونقاش من الكتاب (9 دقائق، من الدقيقة 23 إلى 32):\n   دور المعلم: يوجّه الطلاب إلى صور ص22 ويقارن الهيكل بدعائم المباني والبيوت التقليدية.\n   دور الطالب: يقرؤون في مجموعات ويجيبون عن السؤالين 1 و2 شفهيًا ثم كتابيًا.\n5) الغلق والتقويم (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يطرح أسئلة التقويم الختامي ويلخص الفكرة على السبورة الذكية.\n   دور الطالب: يكتبون جملة تلخص: «نحتاج إلى الهيكل العظمي لأنه...».\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] مما يتكون الهيكل العظمي؟\n   الإجابة النموذجية: من العظام.\n2) [المستوى المتوقع] أين يوجد الهيكل العظمي في جسم الإنسان؟\n   الإجابة النموذجية: داخل الجسم.\n3) [المستوى المتقدم] ماذا أوضحت تجربة الورقة المنثنية؟\n   الإجابة النموذجية: أن الجسم دون هيكل عظمي لا يستطيع أن يبقى مستقيمًا فيحتاج إلى دعم من الداخل.", "1) [مستوى الدعم] اكتب وظيفة واحدة للهيكل العظمي.\n   الإجابة النموذجية: يدعم الجسم من الداخل.\n2) [المستوى المتوقع] لماذا لا يستطيع الإنسان الوقوف مستقيمًا دون هيكل عظمي؟\n   الإجابة النموذجية: لأن العظام هي التي تدعم الجسم وتحفظ شكله من الداخل.\n3) [المستوى المتقدم] شبّه الهيكل العظمي بجزء من المبنى، ووضّح وجه الشبه.\n   الإجابة النموذجية: يشبه الأعمدة والدعائم في المبنى؛ فكلاهما يحمل الثقل ويحفظ الشكل من الداخل.", "إرشاد الطالب: قراءة ص22 من كتاب التلميذ والإجابة عن السؤالين 1 و2. إرشاد ولي الأمر: مناقشة ابنكم في سبب حاجة الجسم إلى الهيكل العظمي بمثال من البيت."]}, {"axis": "تحسّس عظام الجسم (نشاط 1-1)", "h": {"lesson": "1-1 الهياكل العظمية", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الأول (6–10/9/2026)", "sb": "22", "ab": "—", "tg": "19–21", "n": "2 من 5", "axis": "تحسّس عظام الجسم (نشاط 1-1)"}, "f": ["1. يحدّد مواقع عظام الجمجمة والضلوع والعمود الفقري والورك بالتحسّس.\nمخرج تعليمي آخر (2): يلاحظ أن العمود الفقري يتكون من فقرات متعددة تسمح بالانحناء.", "المخرج 1 (يحدّد مواقع عظام الجمجمة والضلوع والعمود الفقري والورك بالتحسّس): تطبيق\nالمخرج 2 (يلاحظ أن العمود الفقري يتكون من فقرات متعددة تسمح بالانحناء): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم بالعمل في أزواج.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: عقد من الخرز لتمثيل الفقرات، مجسم هيكل عظمي إن توفر.", "الجمجمة، الضلوع، العمود الفقري، الفقرة، الورك.", "يسأل المعلم: ضع يدك على رأسك، ماذا تشعر تحت الجلد؟ هل هو لين أم صلب؟ ويربط الإجابة بالحصة السابقة عن الهيكل العظمي.", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح سؤال التحسّس ويذكّر بوظيفة الهيكل.\n   دور الطالب: يتحسّسون رؤوسهم ويصفون الصلابة تحت الجلد.\n2) نمذجة الفقرات (8 دقائق، من الدقيقة 4 إلى 12):\n   دور المعلم: يعرض عقد الخرز ويثنيه ويوضح أن الفقرات مثل الخرزات تسمح بالانحناء والالتفاف.\n   دور الطالب: يتحسّسون الفقرات بالأصابع أثناء الانحناء إلى الأمام ويعدّون بعضها.\n3) تنفيذ نشاط 1-1 (15 دقائق، من الدقيقة 12 إلى 27):\n   دور المعلم: يوزّع العمل في أزواج ويتابع، ويقترح تحسّس الضلوع تحت الذراع الممدودة لمن يصعب عليه ذلك.\n   دور الطالب: يتحسّسون الجمجمة والضلوع والعمود الفقري والورك وعظام اليد ويسجلون ملاحظاتهم في جدول.\n4) مناقشة الملاحظات (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش الملاحظات: الجمجمة تبدو عظمة واحدة لكنها عظام ملتحمة، واليد فيها عظام كثيرة لحركات دقيقة.\n   دور الطالب: يعرضون ملاحظاتهم ويرسمون كيف يتخيلون عظام اليد.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام بطاقة خروج.\n   دور الطالب: يجيبون في بطاقة الخروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] سمِّ عظام الرأس.\n   الإجابة النموذجية: الجمجمة.\n2) [المستوى المتوقع] لماذا نستطيع الانحناء إلى الأمام؟\n   الإجابة النموذجية: لأن العمود الفقري يتكون من فقرات كثيرة متصلة تتحرك قليلًا.\n3) [المستوى المتقدم] لماذا تحتوي اليد على عظام كثيرة صغيرة؟\n   الإجابة النموذجية: لتمكّننا من حركات دقيقة مثل الإمساك بالقلم والتقاط الأشياء الصغيرة.", "1) [مستوى الدعم] أين توجد الضلوع في الجسم؟\n   الإجابة النموذجية: في الصدر.\n2) [المستوى المتوقع] هل الجمجمة عظمة واحدة؟ وضّح.\n   الإجابة النموذجية: لا، هي مجموعة عظام ملتحمة مع بعضها فتبدو عظمة واحدة.\n3) [المستوى المتقدم] ماذا يحدث لو كان ال خّصون فكرة الحصة.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] هل لجميع العظام الشكل والحجم نفساهما؟\n   الإجابة النموذجية: لا، تختلف العظام في أشكالها وأحجامها.\n2) [المستوى المتوقع] اذكر وظيفة عظام الساق.\n   الإجابة النموذجية: تساعد في المشي وتحمل وزن الجسم.\n3) [المستوى المتقدم] لماذا تختلف أشكال العظام في الجسم؟\n   الإجابة النموذجية: لأن أجزاء الجسم المختلفة تؤدي وظائف مختلفة فيناسب شكل كل عظمة وظيفتها.", "1) [مستوى الدعم] ما العظام التي تحمي الدماغ؟\n   الإجابة النموذجية: الجمجمة.\n2) [المستوى المتوقع] قارن بين عظام اليد وعظمة الفخذ من حيث الحجم والوظيفة.\n   الإجابة النموذجية: عظام اليد صغيرة وكثيرة للحركات الدقيقة، وعظمة الفخذ كبيرة وقوية لحمل الجسم والمشي.\n3) [المستوى المتقدم] اقترح شكلًا مناسبًا لعظمة وظيفتها حماية عضو لين، وفسّر اختيارك.\n   الإجابة النموذجية: شكل مسطح أو منحنٍ يحيط بالعضو مثل الجمجمة أو الضلوع، ليغطيه ويحميه من الصدمات.", "إرشاد الطالب: مراجعة ص23 والإجابة عن السؤال 3 في الدفتر. إرشاد ولي الأمر: سؤال ابنكم عن عظمة كبيرة وعظمة صغيرة في الجسم ووظيفة كل منهما."]}, {"axis": "الهياكل العظمية في الحيوانات (تمرين 1-1)", "h": {"lesson": "1-1 الهياكل العظمية", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الأول (6–10/9/2026)", "sb": "23", "ab": "15", "tg": "19–21", "n": "4 من 5", "axis": "الهياكل العظمية في الحيوانات (تمرين 1-1)"}, "f": ["1. يذكر أمثلة لحيوانات تملك هيكلًا عظميًا داخليًا.\nمخرج تعليمي آخر (2): يطابق صور الهياكل العظمية مع الحيوانات المناسبة ويحدد عليها الجمجمة والضلوع والعمود الفقري والورك.", "المخرج 1 (يذكر أمثلة لحيوانات تملك هيكلًا عظميًا داخليًا): تذكر\nالمخرج 2 (يطابق صور الهياكل العظمية مع الحيوانات المناسبة ويحدد عليها الجمجمة والضلوع والعمود الفقري والورك): تطبيق", "• التعلم التعاوني\n• التعلم المبني على اللعب\n• التعلم بالاكتشاف", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات صور هياكل عظمية لحيوانات.", "الهيكل العظمي، الحيوانات الفقارية، الجمجمة، الضلوع، العمود الفقري، الورك.", "يعرض المعلم صورة هيكل عظمي لحيوان مجهول ويسأل: خمّن هذا الحيوان! ما الذي ساعدك على التخمين؟", "1) ذجية: الغضروف لين ومرن، والعظم صلب وقوي.", "1) [مستوى الدعم] اذكر مكانًا في جسمك يوجد فيه غضروف.\n   الإجابة النموذجية: الأذن الخارجية أو طرف الأنف.\n2) [المستوى المتوقع] ما الدليل على أن العظام حية؟\n   الإجابة النموذجية: أنها تنمو مع نمو الجسم وتلتئم عند الكسر.\n3) [المستوى المتقدم] لو كان هيكل الإنسان كله غضروفًا، ماذا تتوقع أن يحدث لجسمه؟ فسّر.\n   الإجابة النموذجية: سيكون أقل صلابة ودعمًا فيصعب الوقوف وحمل الوزن والحماية من الصدمات.", "إرشاد الطالب: مراجعة الدرس كاملًا ص22–23 وتمرين 1-1. إرشاد ولي الأمر: تشجيع ابنكم على شرح ما تعلمه عن الهياكل العظمية لأحد أفراد الأسرة."]}], "comb": ["الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\n1. يذكر أن للإنسان وبعض الحيوانات هيكلًا عظميًا داخل الجسم.\nمخرج تعليمي آخر (2): يفسّر حاجة الجسم إلى الهيكل العظمي لدعمه من الداخل.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\n1. يحدّد مواقع عظام الجمجمة والضلوع والعمود الفقري والورك بالتحسّس.\nمخرج تعليمي آخر (2): يلاحظ أن العمود الفقري يتكون من فقرات متعددة تسمح بالانحناء.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\n1. يلاحظ أن عظام الجسم تختلف في أشكالها وأحجامها.\nمخرج تعليمي آخر (2): يربط شكل العظمة بوظيفتها في الجسم.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\n1. يذكر أمثلة لحيوانات تملك هيكلًا عظميًا داخليًا.\nمخرج تعليمي آخر (2): يطابق صور الهياكل العظمية مع الحيوانات المناسبة ويحدد عليها الجمجمة والضلوع والعمود الفقري والورك.\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\n1. يوضح أن بعض الحيوانات كالقرش تملك هيكلًا غضروفيًا وأن العظام أجزاء حية تنمو.\nمخرج تعليمي آخر (2): يميّز بين العبارات الصحيحة والمفاهيم الخاطئة عن الهياكل العظمية.", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\nالمخرج 1 (يذكر أن للإنسان وبعض الحيوانات هيكلًا عظميًا داخل الجسم): تذكر\nالمخرج 2 (يفسّر حاجة الجسم إلى الهيكل العظمي لدعمه من الداخل): فهم\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\nالمخرج 1 (يحدّد مواقع عظام الجمجمة والضلوع والعمود الفقري والورك بالتحسّس): تطبيق\nالمخرج 2 (يلاحظ أن العمود الفقري يتكون من فقرات متعددة تسمح بالانحناء): فهم\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\nالمخرج 1 (يلاحظ أن عظام الجسم تختلف في أشكالها وأحجامها): فهم\nالمخرج 2 (يربط شكل العظمة بوظيفتها في الجسم): تحليل\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\nالمخرج 1 (يذكر أمثلة لحيوانات تملك هيكلًا عظميًا داخليًا): تذكر\nالمخرج 2 (يطابق صور الهياكل العظمية مع الحيوانات المناسبة ويحدد عليها الجمجمة والضلوع والعمود الفقري والورك): تطبيق\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\nالمخرج 1 (يوضح أن بعض الحيوانات كالقرش تملك هيكلًا غضروفيًا وأن العظام أجزاء حية تنمو): فهم\nالمخرج 2 (يميّز بين العبارات الصحيحة والمفاهيم الخاطئة عن الهياكل العظمية): تقييم", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\n• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: العصف الذهني.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\n• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم بالعمل في أزواج.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\n• التعلم بالاكتشاف\n• التعلم التشاركي\nاستراتيجيات أخرى: فكّر - زاوج - شارك.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\n• التعلم التعاوني\n• التعلم المبني على اللعب\n• التعلم بالاكتشاف\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\n• التعلم المبني على اللعب\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم بالمناقشة.", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: ورق مقوّى كبير لرسم مخطط الجسم، ورقة A4.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: عقد من الخرز لتمثيل الفقرات، مجسم هيكل عظمي إن توفر.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• نماذج مجسمة\n• أخرى: مجسم الهيكل العظمي للإنسان.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات صور هياكل عظمية لحيوانات.\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\nالهيكل العظمي، العظام، الدعم، داخل الجسم.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\nالجمجمة، الضلوع، العمود الفقري، الفقرة، الورك.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\nالعظام، الشكل، الحجم، الوظيفة.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\nالهيكل العظمي، الحيوانات الفقارية، الجمجمة، الضلوع، العمود الفقري، الورك.\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\nالغضروف، الهيكل الغضروفي، العظام حية، النمو.", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\nيعرض المعلم صورة هيكل عظمي من متحف ويسأل: ماذا ترون؟ أين يوجد هذا الشيء في أجسامنا؟ ثم يستمع لخبرات الطلاب عن هياكل شاهدوها في التلفاز أو المتاحف.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\nيسأل المعلم: ضع يدك على رأسك، ماذا تشعر تحت الجلد؟ هل هو لين أم صلب؟ ويربط الإجابة بالحصة السابقة عن الهيكل العظمي.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\nيعرض المعلم صورًا لعظمة الفخذ وعظام الأصابع والجمجمة ويسأل: هل تتشابه هذه العظام؟ لماذا برأيك اختلفت أشكالها؟\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\nيعرض المعلم صورة هيكل عظمي لحيوان مجهول ويسأل: خمّن هذا الحيوان! ما الذي ساعدك على التخمين؟\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\nيطرح المعلم سؤال «تحدّث عن!»: هل جميع الهياكل مكوّنة من العظام؟ ويطلب تصويتًا سريعًا (نعم/لا).", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض صورة الهيكل العظمي ويطرح أسئلة التمهيد.\n   دور الطالب: يصفون الصورة ويذكرون أين شاهدوا هياكل عظمية.\n2) مخطط جسم زميل (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يلصق ورقًا مقوى على الحائط ويرسم حول جسم طالب يقف أمامه، ثم يسأل: ما الأجزاء التي يجب أن نضيفها داخل المخطط؟\n   دور الطالب: يقترحون أجزاء الجسم ومواقعها حتى يصلوا إلى إضافة العظام والهيكل العظمي.\n3) تجربة الورقة (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يمسك ورقة A4 مستقيمة ثم يتركها فتنثني، ويسأل: ماذا سيحدث لأجسامنا لو لم يكن فيها هيكل عظمي؟\n   دور الطالب: يلاحظون انثناء الورقة ويستنتجون أن الجسم يحتاج إلى دعم داخلي.\n4) قراءة ونقاش من الكتاب (9 دقائق، من الدقيقة 23 إلى 32):\n   دور المعلم: يوجّه الطلاب إلى صور ص22 ويقارن الهيكل بدعائم المباني والبيوت التقليدية.\n   دور الطالب: يقرؤون في مجموعات ويجيبون عن السؤالين 1 و2 شفهيًا ثم كتابيًا.\n5) الغلق والتقويم (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يطرح أسئلة التقويم الختامي ويلخص الفكرة على السبورة الذكية.\n   دور الطالب: يكتبون جملة تلخص: «نحتاج إلى الهيكل العظمي لأنه...».\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح سؤال التحسّس ويذكّر بوظيفة الهيكل.\n   دور الطالب: يتحسّسون رؤوسهم ويصفون الصلابة تحت الجلد.\n2) نمذجة الفقرات (8 دقائق، من الدقيقة 4 إلى 12):\n   دور المعلم: يعرض عقد الخرز ويثنيه ويوضح أن الفقرات مثل الخرزات تسمح بالانحناء والالتفاف.\n   دور الطالب: يتحسّسون الفقرات بالأصابع أثناء الانحناء إلى الأمام ويعدّون بعضها.\n3) تنفيذ نشاط 1-1 (15 دقائق، من الدقيقة 12 إلى 27):\n   دور المعلم: يوزّع العمل في أزواج ويتابع، ويقترح تحسّس الضلوع تحت الذراع الممدودة لمن يصعب عليه ذلك.\n   دور الطالب: يتحسّسون الجمجمة والضلوع والعمود الفقري والورك وعظام اليد ويسجلون ملاحظاتهم في جدول.\n4) مناقشة الملاحظات (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش الملاحظات: الجمجمة تبدو عظمة واحدة لكنها عظام ملتحمة، واليد فيها عظام كثيرة لحركات دقيقة.\n   دور الطالب: يعرضون ملاحظاتهم ويرسمون كيف يتخيلون عظام اليد.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام بطاقة خروج.\n   دور الطالب: يجيبون في بطاقة الخروج.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض صور العظام المختلفة ويطرح سؤال المقارنة.\n   دور الطالب: يقارنون بين الصور ويقدمون توقعاتهم.\n2) ملاحظة المجسم (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض مجسم الهيكل العظمي ويشير إلى عظام طويلة ومسطحة وصغيرة.\n   دور الطالب: يصنفون العظام التي يرونها إلى طويلة وقصيرة ومسطحة في جدول.\n3) ربط الشكل بالوظيفة (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يدير نشاط فكّر - زاوج - شارك: لماذا عظمة الساق طويلة وقوية؟ ولماذا الجمجمة مستديرة؟\n   دور الطالب: يفكرون فرديًا ثم في أزواج ثم يشاركون: الساق للمشي وحمل الجسم، اليد للإمساك، الجمجمة لحماية الدماغ.\n4) أسئلة الكتاب (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يوجّه إلى السؤال 3 ص23 ويتابع الإجابات.\n   دور الطالب: يجيبون كتابيًا ويتحقق كل زوج من إجابة زميله.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يعرض لعبة سريعة: يذكر وظيفة ويسمّي الطلاب العظمة.\n   دور الطالب: يجيبون ويلخّصون فكرة الحصة.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض لغز الهيكل المجهول.\n   دور الطالب: يخمّنون الحيوان ويبررون من شكل الجمجمة والأطراف.\n2) لعبة مطابقة البطاقات (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوزع بطاقات هياكل وبطاقات حيوانات على المجموعات.\n   دور الطالب: يطابقون كل هيكل بحيوانه ويعرضون السبب.\n3) تمرين 1-1 (كتاب النشاط ص15) (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يوجّه إلى التمرين ويتابع أداء المجموعات.\n   دور الطالب: يطابقون هياكل الطير والأرنب والضفدع والتمساح ويسمّون الجمجمة والضلوع والعمود الفقري والورك.\n4) التصحيح الذاتي والأسئلة (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يعرض الإجابات على السبورة الذكية، ويناقش السؤال 4: لماذا عظام الطيور خفيفة؟\n   دور الطالب: يتحقق كل طالب من إجابات زميله ويجيبون عن السؤال 4.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل: ما الأجزاء المشتركة في هياكل هذه الحيوانات؟\n   دور الطالب: يذكرون الجمجمة والعمود الفقري والضلوع.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح سؤال التحدّث ويسجل التصويت على السبورة.\n   دور الطالب: يصوّتون ويبررون آراءهم.\n2) الغضروف (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوضح أن القرش يملك هيكلًا غضروفيًا لينًا مرنًا، ويطلب من الطلاب تحسّس أطراف الأذن الخارجية وطرف الأنف.\n   دور الطالب: يتحسّسون الغضروف ويقارنونه بصلابة العظم.\n3) تصحيح المفاهيم الخاطئة (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يعرض عبارات: «العظام أجزاء ميتة»، «العظام ثقيلة جدًا»، ويناقش أن العظام حية تنمو.\n   دور الطالب: يحكمون على كل عبارة بصح أو خطأ ويصححون الخطأ.\n4) مسابقة المجموعات (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشغّل ملف المسابقة على درس 1-1.\n   دور الطالب: يتنافسون في مجموعات على أسئلة الدرس.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة التقويم الختامي.\n   دور الطالب: يجيبون ويكتبون أهم ما تعلموه في الدرس.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\n1) [مستوى الدعم] مما يتكون الهيكل العظمي؟\n   الإجابة النموذجية: من العظام.\n2) [المستوى المتوقع] أين يوجد الهيكل العظمي في جسم الإنسان؟\n   الإجابة النموذجية: داخل الجسم.\n3) [المستوى المتقدم] ماذا أوضحت تجربة الورقة المنثنية؟\n   الإجابة النموذجية: أن الجسم دون هيكل عظمي لا يستطيع أن يبقى مستقيمًا فيحتاج إلى دعم من الداخل.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\n1) [مستوى الدعم] سمِّ عظام الرأس.\n   الإجابة النموذجية: الجمجمة.\n2) [المستوى المتوقع] لماذا نستطيع الانحناء إلى الأمام؟\n   الإجابة النموذجية: لأن العمود الفقري يتكون من فقرات كثيرة متصلة تتحرك قليلًا.\n3) [المستوى المتقدم] لماذا تحتوي اليد على عظام كثيرة صغيرة؟\n   الإجابة النموذجية: لتمكّننا من حركات دقيقة مثل الإمساك بالقلم والتقاط الأشياء الصغيرة.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\n1) [مستوى الدعم] هل لجميع العظام الشكل والحجم نفساهما؟\n   الإجابة النموذجية: لا، تختلف العظام في أشكالها وأحجامها.\n2) [المستوى المتوقع] اذكر وظيفة عظام الساق.\n   الإجابة النموذجية: تساعد في المشي وتحمل وزن الجسم.\n3) [المستوى المتقدم] لماذا تختلف أشكال العظام في الجسم؟\n   الإجابة النموذجية: لأن أجزاء الجسم المختلفة تؤدي وظائف مختلفة فيناسب شكل كل عظمة وظيفتها.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\n1) [مستوى الدعم] اذكر حيوانًا يملك هيكلًا عظميًا.\n   الإجابة النموذجية: الأرنب أو الطير أو الضفدع أو التمساح (أي إجابة صحيحة).\n2) [المستوى المتوقع] ما الأجزاء المشتركة بين هيكل الإنسان وهيكل الأرنب؟\n   الإجابة النموذجية: الجمجمة والعمود الفقري والضلوع والورك.\n3) [المستوى المتقدم] لماذا تكون عظام الطيور خفيفة؟\n   الإجابة النموذجية: لتسهّل حركة جسمها وطيرانها.\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\n1) [مستوى الدعم] ما نوع هيكل سمك القرش؟\n   الإجابة النموذجية: هيكل غضروفي.\n2) [المستوى المتوقع] صحّح العبارة: «العظام أجزاء غير حية في الجسم».\n   الإجابة النموذجية: العظام أجزاء حية تنمو مع نمو الجسم.\n3) [المستوى المتقدم] قارن بين الغضروف والعظم.\n   الإجابة النموذجية: الغضروف لين ومرن، والعظم صلب وقوي.", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\n1) [مستوى الدعم] اكتب وظيفة واحدة للهيكل العظمي.\n   الإجابة النموذجية: يدعم الجسم من الداخل.\n2) [المستوى المتوقع] لماذا لا يستطيع الإنسان الوقوف مستقيمًا دون هيكل عظمي؟\n   الإجابة النموذجية: لأن العظام هي التي تدعم الجسم وتحفظ شكله من الداخل.\n3) [المستوى المتقدم] شبّه الهيكل العظمي بجزء من المبنى، ووضّح وجه الشبه.\n   الإجابة النموذجية: يشبه الأعمدة والدعائم في المبنى؛ فكلاهما يحمل الثقل ويحفظ الشكل من الداخل.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\n1) [مستوى الدعم] أين توجد الضلوع في الجسم؟\n   الإجابة النموذجية: في الصدر.\n2) [المستوى المتوقع] هل الجمجمة عظمة واحدة؟ وضّح.\n   الإجابة النموذجية: لا، هي مجموعة عظام ملتحمة مع بعضها فتبدو عظمة واحدة.\n3) [المستوى المتقدم] ماذا يحدث لو كان العمود الفقري عظمة واحدة طويلة؟\n   الإجابة النموذجية: لن نستطيع الانحناء أو الالتفاف.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\n1) [مستوى الدعم] ما العظام التي تحمي الدماغ؟\n   الإجابة النموذجية: الجمجمة.\n2) [المستوى المتوقع] قارن بين عظام اليد وعظمة الفخذ من حيث الحجم والوظيفة.\n   الإجابة النموذجية: عظام اليد صغيرة وكثيرة للحركات الدقيقة، وعظمة الفخذ كبيرة وقوية لحمل الجسم والمشي.\n3) [المستوى المتقدم] اقترح شكلًا مناسبًا لعظمة وظيفتها حماية عضو لين، وفسّر اختيارك.\n   الإجابة النموذجية: شكل مسطح أو منحنٍ يحيط بالعضو مثل الجمجمة أو الضلوع، ليغطيه ويحميه من الصدمات.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\n1) [مستوى الدعم] في أي جزء من الهيكل يوجد الدماغ؟\n   الإجابة النموذجية: داخل الجمجمة.\n2) [المستوى المتوقع] كيف تعرّفت على هيكل الطير في التمرين؟\n   الإجابة النموذجية: من الأجنحة والمنقار وخفة العظام.\n3) [المستوى المتقدم] لماذا نجد عمودًا فقريًا في هياكل حيوانات مختلفة جدًا كالضفدع والتمساح؟\n   الإجابة النموذجية: لأنها جميعًا حيوانات فقارية يدعم العمود الفقري أجسامها من الداخل.\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\n1) [مستوى الدعم] اذكر مكانًا في جسمك يوجد فيه غضروف.\n   الإجابة النموذجية: الأذن الخارجية أو طرف الأنف.\n2) [المستوى المتوقع] ما الدليل على أن العظام حية؟\n   الإجابة النموذجية: أنها تنمو مع نمو الجسم وتلتئم عند الكسر.\n3) [المستوى المتقدم] لو كان هيكل الإنسان كله غضروفًا، ماذا تتوقع أن يحدث لجسمه؟ فسّر.\n   الإجابة النموذجية: سيكون أقل صلابة ودعمًا فيصعب الوقوف وحمل الوزن والحماية من الصدمات.", "الحصة 1 (حاجة الجسم إلى هيكل عظمي داخلي):\nإرشاد الطالب: قراءة ص22 من كتاب التلميذ والإجابة عن السؤالين 1 و2. إرشاد ولي الأمر: مناقشة ابنكم في سبب حاجة الجسم إلى الهيكل العظمي بمثال من البيت.\n\nالحصة 2 (تحسّس عظام الجسم (نشاط 1-1)):\nإرشاد الطالب: مراجعة نشاط 1-1 ص22 وتحسّس عظام الرسغ والكاحل في البيت. إرشاد ولي الأمر: مساعدة ابنكم على تحسّس عظام العمود الفقري أثناء الانحناء.\n\nالحصة 3 (أشكال العظام وأحجامها ووظائفها):\nإرشاد الطالب: مراجعة ص23 والإجابة عن السؤال 3 في الدفتر. إرشاد ولي الأمر: سؤال ابنكم عن عظمة كبيرة وعظمة صغيرة في الجسم ووظيفة كل منهما.\n\nالحصة 4 (الهياكل العظمية في الحيوانات (تمرين 1-1)):\nإرشاد الطالب: إكمال تمرين 1-1 في كتاب النشاط ص15. إرشاد ولي الأمر: مشاهدة صور هياكل حيوانات مع ابنكم ومقارنتها بهيكل الإنسان.\n\nالحصة 5 (هل جميع الهياكل من العظام؟ ومراجعة الدرس):\nإرشاد الطالب: مراجعة الدرس كاملًا ص22–23 وتمرين 1-1. إرشاد ولي الأمر: تشجيع ابنكم على شرح ما تعلمه عن الهياكل العظمية لأحد أفراد الأسرة."]}, {"id": "2-1", "title": "الهيكل العظمي للإنسان", "unit": 1, "unitName": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثاني (13–17/9/2026)", "sb": "24–25", "ab": "16، ورقة العمل 2-1 ص40", "tg": "21–22", "periods": [{"axis": "عظام الهيكل العظمي للإنسان: أشكالها ووظائفها", "h": {"lesson": "2-1 الهيكل العظمي للإنسان", "unit": "الوحدة الأول يط بالقلب والرئتين لتحميهما.\n3) [المستوى المتقدم] لماذا يملك الرضيع عظامًا أكثر من البالغ؟\n   الإجابة النموذجية: لأن بعض عظامه تلتحم مع بعضها أثناء النمو.", "1) [مستوى الدعم] ما أطول عظمة في الجسم؟\n   الإجابة النموذجية: عظمة الفخذ.\n2) [المستوى المتوقع] ماذا تحمي الجمجمة؟\n   الإجابة النموذجية: الدماغ وأعضاء الحس مثل العينين والأذنين.\n3) [المستوى المتقدم] هل تملك الزرافة عظامًا في رقبتها أكثر من الإنسان؟ فسّر.\n   الإجابة النموذجية: لا، كلاهما يملك سبع عظام في الرقبة لكن عظام رقبة الزرافة أكبر بكثير.", "إرشاد الطالب: مراجعة ص24 والإجابة عن الأسئلة 1–5. إرشاد ولي الأمر: سؤال ابنكم عن عدد عظام جسم البالغ ووظيفة الجمجمة والضلوع."]}, {"axis": "بناء نموذج للهيكل العظمي (نشاط 2-1)", "h": {"lesson": "2-1 الهيكل العظمي للإنسان", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثاني (13–17/9/2026)", "sb": "25", "ab": "16، 40", "tg": "21–22", "n": "2 من 2", "axis": "بناء نموذج للهيكل العظمي (نشاط 2-1)"}, "f": ["1. يستنتج أن العظام ترتبط مع بعضها لتكوّن الهيكل العظمي.\nمخرج تعليمي آخر (2): يصمّم نموذجًا للهيكل العظمي للإنسان يبرز الجمجمة والعمود الفقري والضلوع والذراعين والساقين والورك.", "المخرج 1 (يستنتج أن العظام ترتبط مع بعضها لتكوّن الهيكل العظمي): فهم\nالمخرج 2 (يصمّم نموذجًا للهيكل العظمي للإنسان يبرز الجمجمة والعمود الفقري والضلوع والذراعين والساقين والورك): إبداع", "• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على المشاريع", "• الكتاب\n• الأقلام\n• صورة توضيحية\n• أخرى: أشكال متنوعة من المعكرونة، ورق مقوى أسود، لاصق.", "نموذج الهيكل العظمي، الجمجمة، العمود الفقري، الضلوع، الورك.", "يعرض المعلم نموذجًا جاهزًا من المعكرونة لهيكل غير مكتمل، ويسأل: ما العظام الناقصة في هذا النموذج؟", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض النموذج الناقص.\n   دور الطالب: يحددون الأجزاء الناقصة.\n2) تنفيذ نشاط 2-1 (18 دقائق، من الدقيقة 4 إلى 22):\n   دور المعلم: يوزع المواد على المجموعات ويوجّه إلى المثال ص25، مع التأكيد على إبراز العظام الرئيسة لا الدقة التامة.\n   دور الطالب: يختارون أشكال المعكرونة المناسبة لكل عظمة ويلصقونها لبناء الهيك ن والساقين والورك.", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\nالمخرج 1 (يسمّي عظامًا رئيسة في الهيكل العظمي للإنسان (الجمجمة، الضلوع، الفخذ، عظام الأذن)): تذكر\nالمخرج 2 (يلاحظ أن للعظام أشكالًا وأحجامًا مختلفة ترتبط بوظائفها): فهم\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\nالمخرج 1 (يستنتج أن العظام ترتبط مع بعضها لتكوّن الهيكل العظمي): فهم\nالمخرج 2 (يصمّم نموذجًا للهيكل العظمي للإنسان يبرز الجمجمة والعمود الفقري والضلوع والذراعين والساقين والورك): إبداع", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\n• التعلم بالاكتشاف\n• التعلم التشاركي\nاستراتيجيات أخرى: العصف الذهني.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\n• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على المشاريع", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• نماذج مجسمة\n• أخرى: مجسم الهيكل العظمي للإنسان.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\n• الكتاب\n• الأقلام\n• صورة توضيحية\n• أخرى: أشكال متنوعة من المعكرونة، ورق مقوى أسود، لاصق.", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\nالهيكل العظمي، الجمجمة، الضلوع، عظمة الفخذ، عظام الأذن، الالتحام.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\nنموذج الهيكل العظمي، الجمجمة، العمود الفقري، الضلوع، الورك.", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\nيذكّر المعلم باستنتاج نشاط 1-1 (الهيكل من عظام متنوعة) ثم يسأل: توقّع أكبر عظمة وأصغر عظمة في جسمك.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\nيعرض المعلم نموذجًا جاهزًا من المعكرونة لهيكل غير مكتمل، ويسأل: ما العظام الناقصة في هذا النموذج؟", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يراجع نشاط 1-1 ويطرح سؤال التوقع.\n   دور الطالب: يكتبون توقعاتهم على بطاقة.\n2) ملاحظة صورة الهيكل ص24 (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض الصورة والمجسم، ويوضح أن البالغ يملك 206 عظام والرضيع نحو 300 تلتحم مع النمو.\n   دور الطالب: يلاحظون عظمتي الساعد والساق، ويعدّون أزواج الضلوع (12 زوجًا).\n3) أشكال العظام ووظائفها (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يدير نقاشًا: الجمجمة تحمي، الفخذ يحمل، الضلوع تحيط بالقلب والرئتين.\n   دور الطالب: يكملون جدولًا: العظمة – شكلها – وظيفتها.\n4) أسئلة الكتاب 1–5 (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يوجّه الأسئلة ويتابع، ويكلف المتقدمين بالسؤالين 5 و6.\n   دور الطالب: يجيبون في أزواج ويتحققون من توقعاتهم الأولى.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل عن «تحدّث عن!»: عظام رقبة الزرافة.\n   دور الطالب: يستنتجون أن الحيوانات الكبيرة تختلف في حجم العظام لا في عددها غالبًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض النموذج الناقص.\n   دور الطالب: يحددون الأجزاء الناقصة.\n2) تنفيذ نشاط 2-1 (18 دقائق، من الدقيقة 4 إلى 22):\n   دور المعلم: يوزع المواد على المجموعات ويوجّه إلى المثال ص25، مع التأكيد على إبراز العظام الرئيسة لا الدقة التامة.\n   دور الطالب: يختارون أشكال المعكرونة المناسبة لكل عظمة ويلصقونها لبناء الهيكل.\n3) معرض النماذج (6 دقائق، من الدقيقة 22 إلى 28):\n   دور المعلم: ينظم جولة معرض بين المجموعات.\n   دور الطالب: يقيّمون نماذج زملائهم: هل ظهرت الجمجمة والعمود الفقري والضلوع؟\n4) ورقة العمل 2-1 وتمرين 2-1 (8 دقائق، من الدقيقة 28 إلى 36):\n   دور المعلم: يوجّه إلى ورقة العمل 2-1 (تحديد أجزاء الهيكل) وتمرين 2-1 ص16 لترتيب العظام.\n   دور الطالب: يحددون أجزاء الهيكل ويتحقق كل زوج من إجابات الآخر.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يسأل: لماذا اخترت معكرونة طويلة للساق؟\n   دور الطالب: يربطون شكل المادة بشكل العظمة.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\n1) [مستوى الدعم] كم عدد العظام في جسم الإنسان البالغ؟\n   الإجابة النموذجية: 206 عظام.\n2) [المستوى المتوقع] ما وظيفة الضلوع؟\n   الإجابة النموذجية: تحيط بالقلب والرئتين لتحميهما.\n3) [المستوى المتقدم] لماذا يملك الرضيع عظامًا أكثر من البالغ؟\n   الإجابة النموذجية: لأن بعض عظامه تلتحم مع بعضها أثناء النمو.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\n1) [مستوى الدعم] سمِّ ثلاثة أجزاء أبرزتها في نموذجك.\n   الإجابة النموذجية: الجمجمة، العمود الفقري، الضلوع (أو الذراع، الساق، الورك).\n2) [المستوى المتوقع] لماذا اخترت قطعًا قصيرة متتالية للعمود الفقري؟\n   الإجابة النموذجية: لأنه يتكون من فقرات صغيرة متتالية.\n3) [المستوى المتقدم] ماذا يبيّن النموذج عن ارتباط العظام؟\n   الإجابة النموذجية: أن العظام المختلفة ترتبط مع بعضها لتكوّن هيكلًا واحدًا يدعم الجسم.", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\n1) [مستوى الدعم] ما أطول عظمة في الجسم؟\n   الإجابة النموذجية: عظمة الفخذ.\n2) [المستوى المتوقع] ماذا تحمي الجمجمة؟\n   الإجابة النموذجية: الدماغ وأعضاء الحس مثل العينين والأذنين.\n3) [المستوى المتقدم] هل تملك الزرافة عظامًا في رقبتها أكثر من الإنسان؟ فسّر.\n   الإجابة النموذجية: لا، كلاهما يملك سبع عظام في الرقبة لكن عظام رقبة الزرافة أكبر بكثير.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\n1) [مستوى الدعم] ما العظام التي تتصل بالعمود الفقري لتكوّن القفص الصدري؟\n   الإجابة النموذجية: الضلوع.\n2) [المستوى المتوقع] رتّب من الأعلى إلى الأسفل: الورك، الجمجمة، الفخذ.\n   الإجابة النموذجية: الجمجمة، الورك، الفخذ.\n3) [المستوى المتقدم] اقترح تحسينًا لنموذجك يجعله أقرب إلى الهيكل الحقيقي.\n   الإجابة النموذجية: إضافة عظمتين في الساعد والساق، أو تمثيل عدد الضلوع بدقة (12 زوجًا)، أو تمثيل المفاصل.", "الحصة 1 (عظام الهيكل العظمي للإنسان: أشكالها ووظائفها):\nإرشاد الطالب: مراجعة ص24 والإجابة عن الأسئلة 1–5. إرشاد ولي الأمر: سؤال ابنكم عن عدد عظام جسم البالغ ووظيفة الجمجمة والضلوع.\n\nالحصة 2 (بناء نموذج للهيكل العظمي (نشاط 2-1)):\nإرشاد الطالب: إكمال ورقة العمل 2-1 ص40 وتمرين 2-1 ص16 من كتاب النشاط. إرشاد ولي الأمر: مساعدة ابنكم على صنع نموذج بسيط للهيكل من أعواد أو معكرونة في البيت."]}, {"id": "3-1", "title": "لماذا نحتاج إلى هيكل عظمي؟", "unit": 1, "unitName": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثاني (13–17/9/2026)", "sb": "26–27", "ab": "17–18، ورقتا العمل 3-1أ ص41 و3-1ب ص42", "tg": "22–25", "periods": [{"axis": "الهيكل العظمي ينمو معنا (نشاط 3-1)", "h": : مسطرة، أقلام تلوين.\n\nالحصة 3 (الهيكل العظمي يدعم الجسم ويحميه):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: صورة أشعة سينية لكسر، خوذة دراجة.", "الحصة 1 (الهيكل العظمي ينمو معنا (نشاط 3-1)):\nالنمو، العضد، الفخذ، الساق، القياس، السنتيمتر.\n\nالحصة 2 (عرض قياسات العظام بالتمثيل البياني بالأعمدة):\nالتمثيل البياني بالأعمدة، المحور، العنوان، النمط.\n\nالحصة 3 (الهيكل العظمي يدعم الجسم ويحميه):\nالحماية، الدعم، القفص الصدري، الكسر، الالتئام، الأشعة السينية.", "الحصة 1 (الهيكل العظمي ينمو معنا (نشاط 3-1)):\nيسأل المعلم: لماذا يكون الأطفال صغارًا والكبار طوالًا؟ ماذا يحدث لعظامنا ونحن نكبر؟\n\nالحصة 2 (عرض قياسات العظام بالتمثيل البياني بالأعمدة):\nيعرض المعلم تمثيلًا بيانيًا بالأعمدة لأطوال الطلاب ويسأل: ماذا نعرف من هذا الرسم دون قراءة الأرقام؟ ويستدعي ما تعلّموه في الرياضيات عن تسمية الأعمدة.\n\nالحصة 3 (الهيكل العظمي يدعم الجسم ويحميه):\nيعرض المعلم خوذة دراجة ويسأل: لماذا يلبسها راكبو الدراجات؟ أي جزء في جسمك يعمل مثل الخوذة؟", "الحصة 1 (الهيكل العظمي ينمو معنا (نشاط 3-1)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح أسئلة النمو ويسجل الأفكار.\n   دور الطالب: يتوقعون أن العظام تطول مع العمر.\n2) نمذجة القياس (7 دقائق، من الدقيقة 5 إلى 12):\n   دور المعلم: يعرض قياس عظمة الفخذ من الرضفة (صابونة الركبة) إلى الأعلى، وينبه إلى أن القياس تقريبي.\n   دور الطالب: يلاحظون طريقة القياس ويطرحون الأسئلة.\n3) تنفيذ نشاط 3-1 (18 دقائق، من الدقيقة 12 إلى 30):\n   دور المعلم: يقسّم الطلاب مجموعات من 4–5 ويتابع ضبط القياس بالطريقة نفسها.\n   دور الطالب: يقيسون أطوال عظام العضد والفخذ والساق لديهم وللمجسم أو لقصاصات أطوال لشخص راشد ويسجلونها في جدول.\n4) مناقشة النتائج (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يقارن النتائج بالقيم المتوقعة: عظام المجسم (الراشد) أطول.\n   دور الطالب: يستنتجون أن العظام تطول مع النمو.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح سؤال الختام.\n   دور الطالب: يكتبون استنتاجهم في جملة.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (عرض قياسات العظام بالتمثيل البياني بالأعمدة):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الرسم ويراجع أجزاءه: العنوان، المحوران، تسمية الأعمدة.\n   دور الطالب: يقرؤون الرسم ويحددون الأطول والأقصر.\n2) ورقة العمل 3-1أ (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يوجّه إلى رسم قياسات نشاط 3-1، ويعرض معايير التقييم (العنوان، الأعمدة، الارتفاع الصحيح، التسمية، الترتيب).\n   دور الطالب: يرسمون التمثيل بالمسطرة ويقيّمون رسمهم وفق المعايير.\n3) تمرين 3-1 وورقة العمل 3-1ب (10 دقائق، من الدقيقة 20 إلى 30):\n   دور المعلم: يوزع المهام بحسب المستوى: تمرين 3-1 للجميع، و3-1ب للمتقدمين.\n   دور الطالب: يقرؤون أطوال العضد من التمثيل ويحددون الأكبر سنًا والنمط في النتائج.\n4) مناقشة النمط (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يسأل: ما العلاقة بين العمر وطول العظام؟\n   دور الطالب: يصيغون النمط: كلما زاد العمر زاد طول العظام.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون كتابيًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (الهيكل العظمي يدعم الجسم ويحميه):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الخوذة ويطرح السؤال.\n   دور الطالب: يربطون الخوذة بالجمجمة.\n2) الحماية (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يناقش دور الجمجمة في حماية الدماغ وأعضاء الحس، والقفص الصدري في حماية القلب والرئتين.\n   دور الطالب: يشيرون على المجسم إلى العظام الحامية وما تحميه.\n3) الدعم في الفقاريات واللافقاريات (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يقارن بين دعم الهيكل للإنسان وجسم الدودة والحلزون.\n   دور الطالب: يستنتجون أن الحيوانات التي ليس لها هيكل عظمي تدعم أجسامها بطرق أخرى.\n4) الكسور والأشعة السينية (10 دقائق، من الدقيقة 23 إلى 33):\n   دور المعلم: يعرض صورة أشعة سينية لكسر ويوضح أن أطراف العظم تنمو وتلتئم، وأن عظام الأطفال تلتئم أسرع.\n   دور الطالب: يقرؤون ص27 ويجيبون عن السؤالين 1 و2.\n5) الغلق ومسابقة قصيرة (7 دقائق، من الدقيقة 33 إلى 40):\n   دور المعلم: يشغّل المسابقة على الحصة الثالثة من الدرس.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (الهيكل العظمي ينمو معنا (نشاط 3-1)):\n1) [مستوى الدعم] بماذا قست طول العظام؟\n   الإجابة النموذجية: بشريط القياس أو المسطرة.\n2) [المستوى المتوقع] أيهما أطول: عظمة فخذك أم عظمة فخذ الراشد؟\n   الإجابة النموذجية: عظمة فخذ الراشد.\n3) [المستوى المتقدم] لماذا يجب أن يقيس الجميع بالطريقة نفسها؟\n   الإجابة النموذجية: لتكون المقارنة عادلة والنتائج موثوقة.\n\nالحصة 2 (عرض قياسات العظام بالتمثيل البياني بالأعمدة):\n1) [مستوى الدعم] اذكر عنصرين يجب وجودهما في التمثيل البياني بالأعمدة.\n   الإجابة النموذجية: العنوان وتسمية الأعمدة (أو المحاور).\n2) [المستوى المتوقع] ماذا يمثل ارتفاع العمود في رسمك؟\n   الإجابة النموذجية: طول العظمة بالسنتيمتر.\n3) [المستوى المتقدم] ما النمط الذي ظهر في النتائج؟\n   الإجابة النموذجية: كلما كان الشخص أكبر عمرًا كانت عظامه أطول.\n\nالحصة 3 (الهيكل العظمي يدعم الجسم ويحميه):\n1) [مستوى الدعم] ما العظام التي تحمي القلب والرئتين؟\n   الإجابة النموذجية: الضلوع (القفص الصدري).\n2) [المستوى المتوقع] ماذا يحدث للعظمة المكسورة مع الوقت؟\n   الإجابة النموذجية: تنمو أطرافها وتلتئم مع بعضها.\n3) [المستوى المتقدم] ماذا سيحدث للرضيع لو لم ينمُ هيكله العظمي؟\n   الإجابة النموذجية: سيبقى صغيرًا ولن ينمو.", "الحصة 1 (الهيكل العظمي ينمو معنا (نشاط 3-1)):\n1) [مستوى الدعم] ماذا يحدث لعظامنا كلما كبرنا؟\n   الإجابة النموذجية: تنمو وتطول.\n2) [المستوى المتوقع] لماذا تكون القياسات على الجسم تقريبية؟\n   الإجابة النموذجية: لأنه يتعذّر الوصول إلى أطراف العظام داخل المفاصل كالورك والركبة.\n3) [المستوى المتقدم] توقّع طول عظمة عضد مراهق مقارنة بك وبالراشد، وفسّر.\n   الإجابة النموذجية: أطول من عظمتي وأقصر من عظمة الراشد لأن عظامه ما زالت في طور النمو.\n\nالحصة 2 (عرض قياسات العظام بالتمثيل البياني بالأعمدة):\n1) [مستوى الدعم] ما الأداة المناسبة لرسم الأعمدة بدقة؟\n   الإجابة النموذجية: المسطرة.\n2) [المستوى المتوقع] في التمرين، كيف عرفت الشخص الأكبر سنًا؟\n   الإجابة النموذجية: لأن عظمة عضده هي الأطول، والعظام تطول مع النمو.\n3) [المستوى المتقدم] اقترح تفسيرًا لكون عظام بعض الأطفال أطول من غيرهم في العمر نفسه.\n   الإجابة النموذجية: اختلاف سرعة النمو بين الأفراد أو بين الأولاد والبنات أو الوراثة.\n\nالحصة 3 (الهيكل العظمي يدعم الجسم ويحميه):\n1) [مستوى الدعم] اذكر وظيفتين للهيكل العظمي.\n   الإجابة النموذجية: يدعم الجسم ويحمي الأعضاء الداخلية (وينمو معنا).\n2) [المستوى المتوقع] لماذا تلتئم عظام الأطفال أسرع من عظام البالغين؟\n   الإجابة النموذجية: لأن عظام الأطفال ما زالت في طور النمو.\n3) [المستوى المتقدم] لماذا تظهر العظام بيضاء في صورة الأشعة السينية؟\n   الإجابة النموذجية: لأن العظام تمتص الأشعة فلا تصل إلى الفيلم، بينما تمر الأشعة عبر الأنسجة اللينة.", "الحصة 1 (الهيكل العظمي ينمو معنا (نشاط 3-1)):\nإرشاد الطالب: مراجعة نشاط 3-1 ص26 والاحتفاظ بجدول القياسات للحصة القادمة. إرشاد ولي الأمر: مساعدة ابنكم على قياس طول عضد أحد أفراد الأسرة الراشدين.\n\nالحصة 2 (عرض قياسات العظام بالتمثيل البياني بالأعمدة):\nإرشاد الطالب: إكمال تمرين 3-1 ص17–18 من كتاب النشاط. إرشاد ولي الأمر: متابعة دقة الرسم بالمسطرة وتسمية الأعمدة.\n\nالحصة 3 (الهيكل العظمي يدعم الجسم ويحميه):\nإرشاد الطالب: مراجعة ص26–27 والإجابة عن السؤالين 1 و2 في الدفتر. إرشاد ولي الأمر: تذكير ابنكم بارتداء الخوذة عند ركوب الدراجة وربط ذلك بحماية الجمجمة للدماغ."]}, {"id": "4-1", "title": "الهياكل العظمية والحركة", "unit": 1, "unitName": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثالث (20–24/9/2026)", "sb": "28–29", "ab": "19، ورقة العمل 4-1 ص43", "tg": "25–27", "periods": [{"axis": "العضلات مرتبطة بالعظام", "h": {"lesson": "4-1 الهياكل العظمية والحركة", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثالث (20–24/9/2026)", "sb": "28", "ab": "—", "tg": "25–27", "n": "1 من 5", "axis": "العضلات مرتبطة بالعظام"}, "f": ["1. يستنتج أن الحيوانات ذات الهيكل العظمي تملك عضلات مرتبطة بالعظام.\nمخرج تعليمي آخر (2): يستنتج أن انقباض العضلة (قصرها) يؤدي إلى حركة العظام.", "المخرج 1 (يستنتج أن الحيوانات ذات الهيكل العظمي تملك عضلات مرتبطة بالعظام): فهم\nالمخرج 2 (يستنتج أن انقباض العضلة (قصرها) يؤدي إلى حركة العظام): فهم", "• التعلم بالاكتشاف\n• التعلم المبني على اللعب\nاستراتيجيات أخرى: التعلم الحركي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)", "العضلات، الانقباض، الارتخاء، الحركة، أطراف العظام.", "يطلب المعلم من الطلاب أداء حركات: الانحناء، الالتفاف، المشي في المكان، التقاط القلم، ثم يسأل: ما الذي حرّك عظامكم؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يقود لعبة «افعل الحركة» ويطرح السؤال.\n   دور الطالب: يؤدون الحركات ويقترحون إجابات.\n2) تحسّس العضلات (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يطلب ثني الذراع نحو الصدر ولمس العضد من الأمام.\n   دور الطالب: يلاحظون انتفاخ العضلة وتصلبها عند الثني.\n3) تعابير الوجه (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يطلب تمثيل الغضب والحزن والفرح وتحسّس الوجه.\n   دور الطالب: يميزون العضلات المنقبضة (القاسية) والمرتخية (اللينة).\n4) القراءة والتوضيح (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يعرض ص28 ويشرح أن العضلات ترتبط بأطراف العظام وتنقبض فتقصر فتحرك العظم.\n   دور الطالب: يقرؤون ويرسمون عظمة تتصل بها عضلة مع سهم يوضح اتجاه الجذب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون ويستخدمون الكلمتين: تنقبض، ترتخي.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما الذي يحرّك العظام؟\n   الإجابة النموذجية: العضلات.\n2) [المستوى المتوقع] ماذا يحدث للعضلة عندما تنقبض؟\n   الإجابة النموذجية: تقصر وتنتفخ وتصبح قاسية.\n3) [المستوى المتقدم] أين ترتبط العضلات بالعظام؟\n   الإجابة النموذجية: عند أطراف العظام.", "1) [مستوى الدعم] ماذا يحدث للعضلة المرتخية؟\n   الإجابة النموذجية: تصبح لينة وتطول.\n2) [المستوى المتوقع] صف ما يحدث لعضلة العضد الأمامية عند ثني الذراع.\n   الإجابة النموذجية: تنقبض فتقصر وتنتفخ.\n3) [المستوى المتقدم] لماذا لا تستطيع العظام أن تتحرك وحدها؟\n   الإجابة النموذجية: لأن العظام لا تنقبض، وتحتاج إلى عضلات مرتبطة بها تجذبها.", "إرشاد الطالب: قراءة ص28 وتحسّس عضلات الذراع أثناء رفع حقيبة المدرسة. إرشاد ولي الأمر: تشجيع ابنكم على وصف ما يحدث لعضلاته أثناء الحركة بالكلمتين تنقبض وترتخي."]}, {"axis": "عضلات الذراع أثناء رفع الثقل (نشاط 4-1)", "h": {"lesson": "4-1 الهياكل العظمية والحركة", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثالث (20–24/9/2026)", "sb": "28", "ab": "—", "tg": "25–27", "n": "2 من 5", "axis": "عضلات الذراع أثناء رفع الثقل (نشاط 4-1)"}, "f": ["1. يلاحظ تغير عضلتي العضد الأمامية والخلفية عند رفع ثقل وإنزاله.\nمخرج تعليمي آخر (2): يصف بالمفردات العلمية عمل كل عضلة عند الرفع والإنزال.", "المخرج 1 (يلاحظ تغير عضلتي العضد الأمامية والخلفية عند رفع ثقل وإنزاله): فهم\nالمخرج 2 (يصف بالمفردات العلمية عمل كل عضلة عند الرفع والإنزال): تطبيق", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: أوزان مثل كتاب ثقيل أو حقيبة مدرسية.", "عضلة العضد الأمامية، عضلة العضد الخلفية، تنقبض، ترتخي.", "يرفع المعلم حقيبة ثقيلة أمام الطلاب ويسأل: أي عضلات ذراعي تعمل الآن؟ هل تعمل عضلة واحدة أم أكثر؟", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يرفع الحقيبة ويطرح السؤال.\n   دور الطالب: يتوقعون العضلات العاملة.\n2) توجيهات النشاط والسلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يشرح خطوات نشاط 4-1 ويؤكد عدم رفع أوزان كبيرة.\n   دور الطالب: يوزعون الأدوار في مجموعات 4–5.\n3) تنفيذ نشاط 4-1 (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يتنقل بين المجموعات ويوجه إلى الإمساك بالذراع جيدًا لتحسس العضلات.\n   دور الطالب: يرفعون الوزن ببطء ثم ينزلونه ويتحسسون العضلتين الأمامية والخلفية ويسجلون ملاحظاتهم في جدول.\n4) مناقشة النتائج (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يلخص على السبورة: عند الرفع تقصر الأمامية وتنتفخ وتطول الخلفية، وعند الإنزال يحدث العكس.\n   دور الطالب: يقارنون جداولهم بالملخص ويصححون.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة التقويم.\n   دور الطالب: يجيبون شفهيًا ثم كتابيًا.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] أي عضلة تنقبض عند رفع الثقل؟\n   الإجابة النموذجية: عضلة العضد الأمامية.\n2) [المستوى المتوقع] ماذا يحدث لعضلة العضد الخلفية عند رفع الثقل؟\n   الإجابة النموذجية: ترتخي وتطول.\n3) [المستوى المتقدم] صف عمل العضلتين عند إنزال الثقل.\n   الإجابة النموذجية: تنقبض العضلة الخلفية وتقصر وترتخي العضلة الأمامية وتطول.", "1) [مستوى الدعم] ما الكلمتان العلميتان لوصف عمل العضلة؟\n   الإجابة النموذجية: تنقبض وترتخي.\n2) [المستوى المتوقع] لماذا نحتاج إلى عضلتين لتحريك الساعد إلى الأعلى والأسفل؟\n   الإجابة النموذجية: لأن كل عضلة تجذب في اتجاه واحد فقط.\n3) [المستوى المتقدم] توقّع: هل تنتفخ العضلة أكثر عند رفع وزن أثقل؟ فسّر.\n   الإجابة النموذجية: نعم غالبًا، لأن العضلة تنقبض بقوة أكبر لرفع الوزن الأثقل.", "إرشاد الطالب: مراجعة نشاط 4-1 ص28 وكتابة ملاحظاته في الدفتر. إرشاد ولي الأمر: مراقبة ابنكم وهو يرفع شيئًا خفيفًا وسؤاله عن العضلة المنقبضة."]}, {"axis": "العضلات تعمل بشكل ثنائي (تمرين 4-1)", "h": {"lesson": "4-1 الهياكل العظمية والحركة", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثالث (20–24/9/2026)", "sb": "29", "ab": "19", "tg": "25–27", "n": "3 من 5", "axis": "العضلات تعمل بشكل ثنائي (تمرين 4-1)"}, "f": ["1. يميز طريقة عمل العضلات بشكل ثنائي معاكس لتساعدنا على الحركة.\nمخرج تعليمي آخر (2): يصحح المفهوم الخاطئ بأن العضلة تدفع العظم.", "المخرج 1 (يميز طريقة عمل العضلات بشكل ثنائي معاكس لتساعدنا على الحركة): فهم\nالمخرج 2 (يصحح المفهوم الخاطئ بأن العضلة تدفع العظم): تقييم", "• التعلم بالنمذجة\n• التعلم التشاركي\n• التعلم بالاكتشاف", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: شريطان مطاطيان لتمثيل العضلتين.", "العضلات الثنائية، العضلة ذات الرأسين، العضلة ثلاثية الرؤوس، الجذب، المفصل.", "يسأل المعلم: هل تستطيع العضلة أن تدفع العظم كما تجذبه؟ ويجري تصويتًا سريعًا.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح سؤال الدفع والجذب.\n   دور الطالب: يصوتون ويبررون.\n2) نمذجة الجذب (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يستخدم شريطين مطاطيين مثبتين على ساعد من الكرتون ويوضح أن الشريط يجذب فقط.\n   دور الطالب: يلاحظون أن كل شريط يحرك الساعد في اتجاه واحد عند قصره.\n3) المصطلحات (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يعرّف عضلة العضد الأمامية (ذات الرأسين) والخلفية (ثلاثية الرؤوس) ويصحح استخدام «تتمدد».\n   دور الطالب: يكررون الوصف الصحيح بالمفردات المفتاحية.\n4) تمرين 4-1 (ص19) (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يوجّه إلى التمرين ويتابع.\n   دور الطالب: يسمّون الأجزاء (العضد، العضلة الأمامية، الساعد، العضلة الخلفية) ويحددون ما يقصر ويجذب عند الرفع والخفض ثم يصححون ذاتيًا.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل سؤال الختام.\n   دور الطالب: يكتبون: «تعمل العضلات أزواجًا لأن...».\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] هل تستطيع العضلة دفع العظم؟\n   الإجابة النموذجية: لا، العضلة تجذب فقط.\n2) [المستوى المتوقع] ما اسم عضلة العضد الأمامية؟\n   الإجابة النموذجية: العضلة ذات الرأسين.\n3) [المستوى المتقدم] لماذا تعمل العضلات في أزواج متعاكسة؟\n   الإجابة النموذجية: لأن كل عضلة تجذب في اتجاه واحد، فتحتاج إلى عضلة أخرى تجذب العظم في الاتجاه المعاكس.", "1) [مستوى الدعم] أكمل: عندما تنقبض عضلة الزوج فإن العضلة الأخرى ____.\n   الإجابة النموذجية: ترتخي.\n2) [المستوى المتوقع] في التمرين، أي جزء يرتفع عند انقباض العضلة الأمامية؟\n   الإجابة النموذجية: الساعد.\n3) [المستوى المتقدم] صحّح العبارة: «تتمدد العضلة فتدفع العظم إلى الأسفل».\n   الإجابة النموذجية: العضلة الخلفية تنقبض فتجذب الساعد إلى الأسفل، والعضلة الأمامية ترتخي.", "إرشاد الطالب: إكمال تمرين 4-1 ص19 من كتاب النشاط. إرشاد ولي الأمر: مطالبة ابنكم بشرح عمل عضلتي الذراع بالكلمات: تنقبض، ترتخي، تجذب."]}, {"axis": "نموذج عضلات الذراع (ورقة العمل 4-1)", "h": {"lesson": "4-1 الهياكل العظمية والحركة", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الثالث (20–24/9/2026)", "sb": "28–29", "ab": "43", "tg": "25–27", "n": "4 من 5", "axis": "نموذج عضلات الذراع (ورقة العمل 4-1)"}, "f": ["1. يصنع نموذجًا يوضح عمل عضلتي العضد بشكل ثنائي عند الكوع.\nمخرج تعليمي آخر (2): يشرح ما تمثله الأربطة المطاطية في النموذج.", "المخرج 1 (يصنع نموذجًا يوضح عمل عضلتي العضد بشكل ثنائي عند الكوع): إبداع\nالمخرج 2 (يشرح ما تمثله الأربطة المطاطية في النموذج): فهم", "• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على المشاريع", "• الكتاب\n• الأقلام\n• أخرى: ورق مقوى، شريطان مطاطيان (أحدهما أطول)، مسطرة، مقص، دبوس ينقسم فلقتين، صلصال اللعب.", "النموذج، الكوع، المفصل، الساعد، العضد.", "يعرض المعلم صورة لذراع آلي ويس موذج، الكوع، المفصل، الساعد، العضد.\n\nالحصة 5 (اختبار عادل لقوة عضلات الذراع):\nالاختبار العادل، المتغير، أداة القياس، عضلة القلب، الرياضة.", "الحصة 1 (العضلات مرتبطة بالعظام):\nيطلب المعلم من الطلاب أداء حركات: الانحناء، الالتفاف، المشي في المكان، التقاط القلم، ثم يسأل: ما الذي حرّك عظامكم؟\n\nالحصة 2 (عضلات الذراع أثناء رفع الثقل (نشاط 4-1)):\nيرفع المعلم حقيبة ثقيلة أمام الطلاب ويسأل: أي عضلات ذراعي تعمل الآن؟ هل تعمل عضلة واحدة أم أكثر؟\n\nالحصة 3 (العضلات تعمل بشكل ثنائي (تمرين 4-1)):\nيسأل المعلم: هل تستطيع العضلة أن تدفع العظم كما تجذبه؟ ويجري تصويتًا سريعًا.\n\nالحصة 4 (نموذج عضلات الذراع (ورقة العمل 4-1)):\nيعرض المعلم صورة لذراع آلي ويسأل: كيف يتحرك هذا الذراع؟ هل يشبه ذراعنا؟\n\nالحصة 5 (اختبار عادل لقوة عضلات الذراع):\nيسأل المعلم: من أقوى ذراعًا في المجموعة؟ كيف نتأكد بطريقة عادلة؟", "الحصة 1 (العضلات مرتبطة بالعظام):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يقود لعبة «افعل الحركة» ويطرح السؤال.\n   دور الطالب: يؤدون الحركات ويقترحون إجابات.\n2) تحسّس العضلات (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يطلب ثني الذراع نحو الصدر ولمس العضد من الأمام.\n   دور الطالب: يلاحظون انتفاخ العضلة وتصلبها عند الثني.\n3) تعابير الوجه (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يطلب تمثيل الغضب والحزن والفرح وتحسّس الوجه.\n   دور الطالب: يميزون العضلات المنقبضة (القاسية) والمرتخية (اللينة).\n4) القراءة والتوضيح (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يعرض ص28 ويشرح أن العضلات ترتبط بأطراف العظام وتنقبض فتقصر فتحرك العظم.\n   دور الطالب: يقرؤون ويرسمون عظمة تتصل بها عضلة مع سهم يوضح اتجاه الجذب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون ويستخدمون الكلمتين: تنقبض، ترتخي.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (عضلات الذراع أثناء رفع الثقل (نشاط 4-1)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يرفع الحقيبة ويطرح السؤال.\n   دور الطالب: يتوقعون العضلات العاملة.\n2) توجيهات النشاط والسلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يشرح خطوات نشاط 4-1 ويؤكد عدم رفع أوزان كبيرة.\n   دور الطالب: يوزعون الأدوار في مجموعات 4–5.\n3) تنفيذ نشاط 4-1 (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يتنقل بين المجموعات ويوجه إلى الإمساك بالذراع جيدًا لتحسس العضلات.\n   دور الطالب: يرفعون الوزن ببطء ثم ينزلونه ويتحسسون العضلتين الأمامية والخلفية ويسجلون ملاحظاتهم في جدول.\n4) مناقشة النتائج (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يلخص على السبورة: عند الرفع تقصر الأمامية وتنتفخ وتطول الخلفية، وعند الإنزال يحدث العكس.\n   دور الطالب: يقارنون جداولهم بالملخص ويصححون.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة التقويم.\n   دور الطالب: يجيبون شفهيًا ثم كتابيًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (العضلات تعمل بشكل ثنائي (تمرين 4-1)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح سؤال الدفع والجذب.\n   دور الطالب: يصوتون ويبررون.\n2) نمذجة الجذب (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يستخدم شريطين مطاطيين مثبتين على ساعد من الكرتون ويوضح أن الشريط يجذب فقط.\n   دور الطالب: يلاحظون أن كل شريط يحرك الساعد في اتجاه واحد عند قصره.\n3) المصطلحات (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يعرّف عضلة العضد الأمامية (ذات الرأسين) والخلفية (ثلاثية الرؤوس) ويصحح استخدام «تتمدد».\n   دور الطالب: يكررون الوصف الصحيح بالمفردات المفتاحية.\n4) تمرين 4-1 (ص19) (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يوجّه إلى التمرين ويتابع.\n   دور الطالب: يسمّون الأجزاء (العضد، العضلة الأمامية، الساعد، العضلة الخلفية) ويحددون ما يقصر ويجذب عند الرفع والخفض ثم يصححون ذاتيًا.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل سؤال الختام.\n   دور الطالب: يكتبون: «تعمل العضلات أزواجًا لأن...».\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (نموذج عضلات الذراع (ورقة العمل 4-1)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يقترحون أوجه الشبه.\n2) توجيهات وسلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يشرح خطوات ورقة العمل 4-1 ويؤكد وضع الدبوس على بعد 5 سم تقريبًا من طرف البطاقة وعدم شد الأربطة أكثر من اللازم، والحذر عند استخدام المقص والدبوس.\n   دور الطالب: يوزعون الأدوار ويجهزون المواد.\n3) صنع النموذج (18 دقائق، من الدقيقة 10 إلى 28):\n   دور المعلم: يتابع المجموعات ويساعد في التثبيت.\n   دور الطالب: يقصّون بطاقتي العضد والساعد ويثبتونهما بالدبوس ويربطون الشريطين في الجهتين.\n4) تجريب النموذج (7 دقائق، من الدقيقة 28 إلى 35):\n   دور المعلم: يطلب جذب كل شريط ملاحظة حركة الساعد.\n   دور الطالب: يجيبون عن أسئلة الورقة: ماذا يحدث للساعد عند جذب كل شريط؟\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل: ما الذي يمثله الدبوس؟\n   دور الطالب: يربطون الدبوس بمفصل الكوع.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (اختبار عادل لقوة عضلات الذراع):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح سؤال المقارنة ويسجل الأفكار.\n   دور الطالب: يقترحون طرقًا للمقارنة.\n2) تخطيط الاختبار العادل (السؤالان 1 و2) (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يوجّه: ما الذي سنغيّره؟ ما الذي سنقيسه؟ ما الذي سنبقيه ثابتًا؟\n   دور الطالب: يخططون: نغيّر عدد الكتب، ونقيس ارتفاع الحقيبة عن الأرض، ويقوم الشخص نفسه بالمحاولات وبالطريقة نفسها.\n3) عرض الخطط (10 دقائق، من الدقيقة 17 إلى 27):\n   دور المعلم: يطلب عرض خطتين ويقارن.\n   دور الطالب: ينتقدون الخطط ويقترحون التحسين ويرسمون جدول النتائج.\n4) عضلة القلب والرياضة (5 دقائق، من الدقيقة 27 إلى 32):\n   دور المعلم: يطرح السؤال 3 عن عضلة القلب، ويوضح أن تكرار الحركة والرياضة ينميان العضلات.\n   دور الطالب: يجيبون ويقترحون أنشطة رياضية.\n5) مسابقة المجموعات (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يشغّل مسابقة الدرس 4-1.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (العضلات مرتبطة بالعظام):\n1) [مستوى الدعم] ما الذي يحرّك العظام؟\n   الإجابة النموذجية: العضلات.\n2) [المستوى المتوقع] ماذا يحدث للعضلة عندما تنقبض؟\n   الإجابة النموذجية: تقصر وتنتفخ وتصبح قاسية.\n3) [المستوى المتقدم] أين ترتبط العضلات بالعظام؟\n   الإجابة النموذجية: عند أطراف العظام.\n\nالحصة 2 (عضلات الذراع أثناء رفع الثقل (نشاط 4-1)):\n1) [مستوى الدعم] أي عضلة تنقبض عند رفع الثقل؟\n   الإجابة النموذجية: عضلة العضد الأمامية.\n2) [المستوى المتوقع] ماذا يحدث لعضلة العضد الخلفية عند رفع الثقل؟\n   الإجابة النموذجية: ترتخي وتطول.\n3) [المستوى المتقدم] صف عمل العضلتين عند إنزال الثقل.\n   الإجابة النموذجية: تنقبض العضلة الخلفية وتقصر وترتخي العضلة الأمامية وتطول.\n\nالحصة 3 (العضلات تعمل بشكل ثنائي (تمرين 4-1)):\n1) [مستوى الدعم] هل تستطيع العضلة دفع العظم؟\n   الإجابة النموذجية: لا، العضلة تجذب فقط.\n2) [المستوى المتوقع] ما اسم عضلة العضد الأمامية؟\n   الإجابة النموذجية: العضلة ذات الرأسين.\n3) [المستوى المتقدم] لماذا تعمل العضلات في أزواج متعاكسة؟\n   الإجابة النموذجية: لأن كل عضلة تجذب في اتجاه واحد، فتحتاج إلى عضلة أخرى تجذب العظم في الاتجاه المعاكس.\n\nالحصة 4 (نموذج عضلات الذراع (ورقة العمل 4-1)):\n1) [مستوى الدعم] ماذا يحدث لبطاقة الساعد عند جذب الشريط الطويل؟\n   الإجابة النموذجية: ترتفع.\n2) [المستوى المتوقع] ماذا يمثل الدبوس في النموذج؟\n   الإجابة النموذجية: مفصل الكوع.\n3) [المستوى المتقدم] ماذا تمثل الأربطة المطاطية؟\n   الإجابة النموذجية: عضلتي العضد الأمامية والخلفية.\n\nالحصة 5 (اختبار عادل لقوة عضلات الذراع):\n1) [مستوى الدعم] في اختبارك، ما الشيء الوحيد الذي ستغيّره؟\n   الإجابة النموذجية: عدد الكتب (الوزن).\n2) [المستوى المتوقع] بماذا ستقيس ارتفاع الحقيبة؟\n   الإجابة النموذجية: بشريط القياس.\n3) [المستوى المتقدم] لماذا يجب أن يقوم الشخص نفسه بجميع المحاولات؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فلا تختلف النتائج بسبب اختلاف الأشخاص.", "الحصة 1 (العضلات مرتبطة بالعظام):\n1) [مستوى الدعم] ماذا يحدث للعضلة المرتخية؟\n   الإجابة النموذجية: تصبح لينة وتطول.\n2) [المستوى المتوقع] صف ما يحدث لعضلة العضد الأمامية عند ثني الذراع.\n   الإجابة النموذجية: تنقبض فتقصر وتنتفخ.\n3) [المستوى المتقدم] لماذا لا تستطيع العظام أن تتحرك وحدها؟\n   الإجابة النموذجية: لأن العظام لا تنقبض، وتحتاج إلى عضلات مرتبطة بها تجذبها.\n\nالحصة 2 (عضلات الذراع أثناء رفع الثقل (نشاط 4-1)):\n1) [مستوى الدعم] ما الكلمتان العلميتان لوصف عمل العضلة؟\n   الإجابة النموذجية: تنقبض وترتخي.\n2) [المستوى المتوقع] لماذا نحتاج إلى عضلتين لتحريك الساعد إلى الأعلى والأسفل؟\n   الإجابة النموذجية: لأن كل عضلة تجذب في اتجاه واحد فقط.\n3) [المستوى المتقدم] توقّع: هل تنتفخ العضلة أكثر عند رفع وزن أثقل؟ فسّر.\n   الإجابة النموذجية: نعم غالبًا، لأن العضلة تنقبض بقوة أكبر لرفع الوزن الأثقل.\n\nالحصة 3 (العضلات تعمل بشكل ثنائي (تمرين 4-1)):\n1) [مستوى الدعم] أكمل: عندما تنقبض عضلة الزوج فإن العضلة الأخرى ____.\n   الإجابة النموذجية: ترتخي.\n2) [المستوى المتوقع] في التمرين، أي جزء يرتفع عند انقباض العضلة الأمامية؟\n   الإجابة النموذجية: الساعد.\n3) [المستوى المتقدم] صحّح العبارة: «تتمدد العضلة فتدفع العظم إلى الأسفل».\n   الإجابة النموذجية: العضلة الخلفية تنقبض فتجذب الساعد إلى الأسفل، والعضلة الأمامية ترتخي.\n\nالحصة 4 (نموذج عضلات الذراع (ورقة العمل 4-1)):\n1) [مستوى الدعم] ماذا يحدث لبطاقة الساعد عند جذب الشريط القصير؟\n   الإجابة النموذجية: تنخفض.\n2) [المستوى المتوقع] لماذا يجب ألا نشد الأربطة كثيرًا؟\n   الإجابة النموذجية: لأنها تصبح ثابتة مشدودة فلا تظهر حركة «العضلة».\n3) [المستوى المتقدم] ما الذي لا يستطيع النموذج تمثيله في العضلة الحقيقية؟\n   الإجابة النموذجية: الانتفاخ الحقيقي للعضلة وتحكم الدماغ بها، فالشريط يُجذب بأيدينا.\n\nالحصة 5 (اختبار عادل لقوة عضلات الذراع):\n1) [مستوى الدعم] ما فائدة ممارسة الرياضة للعضلات؟\n   الإجابة النموذجية: تنميها وتقويها.\n2) [المستوى المتوقع] لماذا لا ترتبط عضلة القلب بالهيكل العظمي؟\n   الإجابة النموذجية: لأن عملها ضخ الدم وليس تحريك العظام.\n3) [المستوى المتقدم] اقترح طريقة لعرض نتائج اختبارك وفسّر اختيارك.\n   الإجابة النموذجية: تمثيل بياني بالأعمدة يوضح الارتفاع لكل عدد من الكتب لأنه يسهّل المقارنة.", "الحصة 1 (العضلات مرتبطة بالعظام):\nإرشاد الطالب: قراءة ص28 وتحسّس عضلات الذراع أثناء رفع حقيبة المدرسة. إرشاد ولي الأمر: تشجيع ابنكم على وصف ما يحدث لعضلاته أثناء الحركة بالكلمتين تنقبض وترتخي.\n\nالحصة 2 (عضلات الذراع أثناء رفع الثقل (نشاط 4-1)):\nإرشاد الطالب: مراجعة نشاط 4-1 ص28 وكتابة ملاحظاته في الدفتر. إرشاد ولي الأمر: مراقبة ابنكم وهو يرفع شيئًا خفيفًا وسؤاله عن العضلة المنقبضة.\n\nالحصة 3 (العضلات تعمل بشكل ثنائي (تمرين 4-1)):\nإرشاد الطالب: إكمال تمرين 4-1 ص19 من كتاب النشاط. إرشاد ولي الأمر: مطالبة ابنكم بشرح عمل عضلتي الذراع بالكلمات: تنقبض، ترتخي، تجذب.\n\nالحصة 4 (نموذج عضلات الذراع (ورقة العمل 4-1)):\nإرشاد الطالب: مراجعة ورقة العمل 4-1 ص43 وشرح النموذج لأحد أفراد الأسرة. إرشاد ولي الأمر: مشاهدة ابنكم وهو يشغّل النموذج وسؤاله عن الجزء الذي يمثل العضلة.\n\nالحصة 5 (اختبار عادل لقوة عضلات الذراع):\nإرشاد الطالب: الإجابة عن السؤالين 1 و2 ص29 في الدفتر. إرشاد ولي الأمر: تشجيع ابنكم على ممارسة نشاط رياضي يومي لتقوية عضلاته."]}, {"id": "5-1", "title": "العقاقير كأدوية", "unit": 1, "unitName": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "sb": "30–31", "ab": "20، ورقة العمل 5-1 ص44–45", "tg": "28–29", "periods": [{"axis": "العقاقير والأدوية وأشكالها", "h": {"lesson": "5-1 العقاقير كأدوية", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "sb": "30", "ab": "20", "tg": "28–29", "n": "1 من 3", "axis": "العقاقير والأدوية وأشكالها"}, "f": ["1. يميّز بين العقاقير والأدوية.\nمخرج تعليمي آخر (2): يذكر أشكالًا مختلفة للأدوية وطرق تناولها.", "المخرج 1 (يميّز بين العقاقير والأدوية): فهم\nالمخرج 2 (يذكر أشكالًا مختلفة للأدوية وطرق تناولها): تذكر", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: العصف الذهني.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: عبوات أدوية فارغة نظيفة (شراب، أقراص، مرهم، بخاخ).", "العقار، الدواء، الشراب، الأقراص، المسحوق، المرهم، البخاخ، الحقنة.", "يعرض المعلم عبوات أدوية فارغة ويسأل: ما هذه؟ ما الفرق بين شكل وآخر؟ ولماذا نتناول الدواء؟ (مع مراعاة خصوصية الطلاب الذين يتناولون أدوية).", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض العبوات ويطرح الأسئلة.\n   دور الطالب: يسمّون الأشكال ويذكرون متى يحتاجون الدواء.\n2) العقار والدواء (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرّف العقار بأنه مادة كيميائية تؤثر على الجسم وتغيّره، والدواء عقار يساعد على الشفاء إذا استُخدم وفق التوجيهات الطبية.\n   دور الطالب: يكتبون التعريفين ويعطون أمثلة.\n3) أشكال الأدوية وطرق تناولها (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يوجّه إلى صور ص30 ويصنفها مع الطلاب: بلع، دهان، استنشاق، حقن.\n   دور الطالب: يكملون جدولًا: شكل الدواء – طريقة تناوله – مثال.\n4) تمرين 5-1 السؤال 1 (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يوجّه إلى عبارات صح/خطأ ص20.\n   دور الطالب: يحكمون على العبارات ويصححون الخطأ: «ليست جميع العقاقير أدوية».\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما العقار؟\n   الإجابة النموذجية: مادة كيميائية تؤثر على الجسم وتغيّره بشكل ما.\n2) [المستوى المتوقع] اذكر شكلين من أشكال الأدوية.\n   الإجابة النموذجية: الشراب، الأقراص، المرهم، البخاخ، الحقنة (أي اثنين).\n3) [المستوى المتقدم] هل جميع العقاقير أدوية؟ وضّح.\n   الإجابة النموذجية: لا، بعض العقاقير ضارة وليست أدوية، والأدوية عقاقير مفيدة تُستخدم وفق التوجيهات الطبية.", "1) [مستوى الدعم] كيف نستخدم المرهم؟\n   الإجابة النموذجية: ندهن به الجلد.\n2) [المستوى المتوقع] لماذا لا يصلح المرهم لعلاج احتقان الحلق؟\n   الإجابة النموذجية: لأنه يستخدم لعلاج المشكلات الجلدية من الخارج وليس الأمراض الداخلية.\n3) [المستوى المتقدم] متى يصبح الدواء ضارًا؟\n   الإجابة النموذجية: عند تناوله دون وصفة أو بكمية أكبر أو لغير الشخص الموصوف له.", "إرشاد الطالب: قراءة ص30 وحل السؤال 1 من تمرين 5-1 ص20. إرشاد ولي الأمر: حفظ الأدوية بعيدًا عن متناول الأطفال وتوضيح أن الدواء يُؤخذ بإشراف الكبار."]}, {"axis": "استقصاء طرق تناول الأدوية (نشاط 5-1)", "h": {"lesson": "5-1 العقاقير كأدوية", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "sb": "30", "ab": "—", "tg": "28–29", "n": "2 من 3", "axis": "استقصاء طرق تناول الأدوية (نشاط 5-1)"}, "f": ["1. يخطط استقصاء لجمع معلومات عن طرق تناول أفراد الأسرة للأدوية.\nمخرج تعليمي آخر (2): يصمم أسئلة استبانة قصيرة وواضحة.", "المخرج 1 (يخطط استقصاء لجمع معلومات عن طرق تناول أفراد الأسرة للأدوية): إبداع\nالمخرج 2 (يصمم أسئلة استبانة قصيرة وواضحة): تطبيق", "• التعلم المبني على المشاريع\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: ورق ومسطرة لتصميم الاستبانة.", "الاستقصاء، الاستبانة، جمع البيانات، الإحصاء.", "يسأل المعلم: كيف يمكن أن نعرف أكثر أشكال الأدوية استخدامًا في بيوتنا دون أن نسأل كل شخص سؤالًا مختلفًا؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويقدّم فكرة الاستبانة.\n   دور الطالب: يقترحون طرقًا لجمع المعلومات.\n2) خصائص السؤال الجيد (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض سؤالين (جيد وغامض) ويناقش: قصير، واضح، موحّد لجميع الناس.\n   دور الطالب: يحسّنون السؤال الغامض.\n3) تخطيط نشاط 5-1 (15 دقائق، من الدقيقة 15 إلى 30):\n   دور المعلم: يتابع المجموعات أثناء التخطيط.\n   دور الطالب: يكتبون 3–4 أسئلة ويرسمون جدول تفريغ للإجابات حسب شكل الدواء.\n4) مراجعة الخطط (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يراجع خطة مجموعة أمام الصف ويحدد مدة أسبوع لجمع البيانات.\n   دور الطالب: يعدّلون أسئلتهم في ضوء الملاحظات.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يذكّر بمراعاة الخصوصية: لا نسأل عن أسماء الأمراض.\n   دور الطالب: يحددون من سيستطلعون آراءهم.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما الاستبانة؟\n   الإجابة النموذجية: مجموعة أسئلة موحدة لجمع المعلومات من الناس.\n2) [المستوى المتوقع] اذكر صفة للسؤال الجيد في الاستبانة.\n   الإجابة النموذجية: قصير أو واضح أو سهل الفهم أو موحد للجميع.\n3) [المستوى المتقدم] كيف ستنظم الإجابات بعد جمعها؟\n   الإجابة النموذجية: في جدول تكرارات بحسب شكل الدواء ثم تمثيل بياني بالأعمدة.", "1) [مستوى الدعم] ماذا ستسأل في استبانتك؟\n   الإجابة النموذجية: مثال: ما شكل الدواء الذي تناولته آخر مرة؟ (شراب/أقراص/مرهم/بخاخ).\n2) [المستوى المتوقع] لماذا يجب أن يكون السؤال موحدًا لجميع الناس؟\n   الإجابة النموذجية: لنستطيع جمع الإجابات ومقارنتها بعدل.\n3) [المستوى المتقدم] لماذا لا نسأل الناس عن أمراضهم بالاسم؟\n   الإجابة النموذجية: لاحترام خصوصيتهم، والمطلوب طرق تناول الأدوية فقط.", "إرشاد الطالب: تطبيق الاستبانة على أفراد الأسرة خلال الأسبوع وتسجيل الإجابات في الجدول. إرشاد ولي الأمر: التعاون مع ابنكم في الإجابة عن أسئلة الاستبانة."]}, {"axis": "الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)", "h": {"lesson": "5-1 العقاقير كأدوية", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "sb": "31", "ab": "20، 44–45", "tg": "28–29", "n": "3 من 3", "axis": "الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)"}, "f": ["1. يستنتج أن الأدوية تحمي من المرض وتعالجه وتخفف أعراضه.\nمخرج تعليمي آخر (2): يحلل بيانات عن التدخين في تمثيل بياني ويقترح طرقًا للحد منه.", "المخرج 1 (يستنتج أن الأدوية تحمي من المرض وتعالجه وتخفف أعراضه): فهم\nالمخرج 2 (يحلل بيانات عن التدخين في تمثيل بياني ويقترح طرقًا للحد منه): تحليل", "• التعلم المبني على حل المشكلات\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم المتمايز.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية", "الوقاية، العلاج، التبغ، التدخين، الرئتان.", "يسأل المعلم: لماذا يعطى المريض في المستشفى الدواء أحيانًا بالمحلول الوريدي (السائل المتقطر) لا بالأقراص؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح سؤال المحلول الوريدي.\n   دور الطالب: يقترحون أسبابًا.\n2) أسئلة الكتاب 1–3 (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يناقش الإجابات: الدم ينقل الدواء بسرعة، والمرضى يصعب عليهم البلع.\n   دور الطالب: يجيبون ويتحققون من إجاباتهم تقويمًا ذاتيًا.\n3) التحدي: التدخين (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يوضح أن التبغ عقار ضار يؤذي الرئتين ويصعّب التنفس.\n   دور الطالب: يناقشون أضرار التدخين.\n4) ورقة العمل 5-1 (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يوجّه المتقدمين إلى تحليل بيانات المدخنين في المدينتين، والآخرين إلى تمرين 5-1.\n   دور الطالب: يقرؤون التمثيل البياني ويحددون الزيادة والنقصان ويقترحون طرقًا للحد من التدخين.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يكتبون رسالة قصيرة توعوية ضد التدخين.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر فائدتين للأدوية.\n   الإجابة النموذجية: تشفي من المرض وتقي منه وتخفف الأعراض.\n2) [المستوى المتوقع] لماذا يُعطى بعض المرضى الدواء عبر الدم؟\n   الإجابة النموذجية: لأن الدم ينقل الدواء بسرعة إلى أنحاء الجسم، ولصعوبة بلع الدواء لديهم.\n3) [ال  التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم المتمايز.", "الحصة 1 (العقاقير والأدوية وأشكالها):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: عبوات أدوية فارغة نظيفة (شراب، أقراص، مرهم، بخاخ).\n\nالحصة 2 (استقصاء طرق تناول الأدوية (نشاط 5-1)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: ورق ومسطرة لتصميم الاستبانة.\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية", "الحصة 1 (العقاقير والأدوية وأشكالها):\nالعقار، الدواء، الشراب، الأقراص، المسحوق، المرهم، البخاخ، الحقنة.\n\nالحصة 2 (استقصاء طرق تناول الأدوية (نشاط 5-1)):\nالاستقصاء، الاستبانة، جمع البيانات، الإحصاء.\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\nالوقاية، العلاج، التبغ، التدخين، الرئتان.", "الحصة 1 (العقاقير والأدوية وأشكالها):\nيعرض المعلم عبوات أدوية فارغة ويسأل: ما هذه؟ ما الفرق بين شكل وآخر؟ ولماذا نتناول الدواء؟ (مع مراعاة خصوصية الطلاب الذين يتناولون أدوية).\n\nالحصة 2 (استقصاء طرق تناول الأدوية (نشاط 5-1)):\nيسأل المعلم: كيف يمكن أن نعرف أكثر أشكال الأدوية استخدامًا في بيوتنا دون أن نسأل كل شخص سؤالًا مختلفًا؟\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\nيسأل المعلم: لماذا يعطى المريض في المستشفى الدواء أحيانًا بالمحلول الوريدي (السائل المتقطر) لا بالأقراص؟", "الحصة 1 (العقاقير والأدوية وأشكالها):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض العبوات ويطرح الأسئلة.\n   دور الطالب: يسمّون الأشكال ويذكرون متى يحتاجون الدواء.\n2) العقار والدواء (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرّف العقار بأنه مادة كيميائية تؤثر على الجسم وتغيّره، والدواء عقار يساعد على الشفاء إذا استُخدم وفق التوجيهات الطبية.\n   دور الطالب: يكتبون التعريفين ويعطون أمثلة.\n3) أشكال الأدوية وطرق تناولها (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يوجّه إلى صور ص30 ويصنفها مع الطلاب: بلع، دهان، استنشاق، حقن.\n   دور الطالب: يكملون جدولًا: شكل الدواء – طريقة تناوله – مثال.\n4) تمرين 5-1 السؤال 1 (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يوجّه إلى عبارات صح/خطأ ص20.\n   دور الطالب: يحكمون على العبارات ويصححون الخطأ: «ليست جميع العقاقير أدوية».\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (استقصاء طرق تناول الأدوية (نشاط 5-1)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويقدّم فكرة الاستبانة.\n   دور الطالب: يقترحون طرقًا لجمع المعلومات.\n2) خصائص السؤال الجيد (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض سؤالين (جيد وغامض) ويناقش: قصير، واضح، موحّد لجميع الناس.\n   دور الطالب: يحسّنون السؤال الغامض.\n3) تخطيط نشاط 5-1 (15 دقائق، من الدقيقة 15 إلى 30):\n   دور المعلم: يتابع المجموعات أثناء التخطيط.\n   دور الطالب: يكتبون 3–4 أسئلة ويرسمون جدول تفريغ للإجابات حسب شكل الدواء.\n4) مراجعة الخطط (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يراجع خطة مجموعة أمام الصف ويحدد مدة أسبوع لجمع البيانات.\n   دور الطالب: يعدّلون أسئلتهم في ضوء الملاحظات.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يذكّر بمراعاة الخصوصية: لا نسأل عن أسماء الأمراض.\n   دور الطالب: يحددون من سيستطلعون آراءهم.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح سؤال المحلول الوريدي.\n   دور الطالب: يقترحون أسبابًا.\n2) أسئلة الكتاب 1–3 (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يناقش الإجابات: الدم ينقل الدواء بسرعة، والمرضى يصعب عليهم البلع.\n   دور الطالب: يجيبون ويتحققون من إجاباتهم تقويمًا ذاتيًا.\n3) التحدي: التدخين (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يوضح أن التبغ عقار ضار يؤذي الرئتين ويصعّب التنفس.\n   دور الطالب: يناقشون أضرار التدخين.\n4) ورقة العمل 5-1 (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يوجّه المتقدمين إلى تحليل بيانات المدخنين في المدينتين، والآخرين إلى تمرين 5-1.\n   دور الطالب: يقرؤون التمثيل البياني ويحددون الزيادة والنقصان ويقترحون طرقًا للحد من التدخين.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يكتبون رسالة قصيرة توعوية ضد التدخين.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (العقاقير والأدوية وأشكالها):\n1) [مستوى الدعم] ما العقار؟\n   الإجابة النموذجية: مادة كيميائية تؤثر على الجسم وتغيّره بشكل ما.\n2) [المستوى المتوقع] اذكر شكلين من أشكال الأدوية.\n   الإجابة النموذجية: الشراب، الأقراص، المرهم، البخاخ، الحقنة (أي اثنين).\n3) [المستوى المتقدم] هل جميع العقاقير أدوية؟ وضّح.\n   الإجابة النموذجية: لا، بعض العقاقير ضارة وليست أدوية، والأدوية عقاقير مفيدة تُستخدم وفق التوجيهات الطبية.\n\nالحصة 2 (استقصاء طرق تناول الأدوية (نشاط 5-1)):\n1) [مستوى الدعم] ما الاستبانة؟\n   الإجابة النموذجية: مجموعة أسئلة موحدة لجمع المعلومات من الناس.\n2) [المستوى المتوقع] اذكر صفة للسؤال الجيد في الاستبانة.\n   الإجابة النموذجية: قصير أو واضح أو سهل الفهم أو موحد للجميع.\n3) [المستوى المتقدم] كيف ستنظم الإجابات بعد جمعها؟\n   الإجابة النموذجية: في جدول تكرارات بحسب شكل الدواء ثم تمثيل بياني بالأعمدة.\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\n1) [مستوى الدعم] اذكر فائدتين للأدوية.\n   الإجابة النموذجية: تشفي من المرض وتقي منه وتخفف الأعراض.\n2) [المستوى المتوقع] لماذا يُعطى بعض المرضى الدواء عبر الدم؟\n   الإجابة النموذجية: لأن الدم ينقل الدواء بسرعة إلى أنحاء الجسم، ولصعوبة بلع الدواء لديهم.\n3) [المستوى المتقدم] ما العضو الذي يتضرر أكثر من التدخين؟ ولماذا؟\n   الإجابة النموذجية: الرئتان؛ لأن المدخن يستنشق مواد كيميائية ضارة تؤذيهما وتصعّب التنفس.", "الحصة 1 (العقاقير والأدوية وأشكالها):\n1) [مستوى الدعم] كيف نستخدم المرهم؟\n   الإجابة النموذجية: ندهن به الجلد.\n2) [المستوى المتوقع] لماذا لا يصلح المرهم لعلاج احتقان الحلق؟\n   الإجابة النموذجية: لأنه يستخدم لعلاج المشكلات الجلدية من الخارج وليس الأمراض الداخلية.\n3) [المستوى المتقدم] متى يصبح الدواء ضارًا؟\n   الإجابة النموذجية: عند تناوله دون وصفة أو بكمية أكبر أو لغير الشخص الموصوف له.\n\nالحصة 2 (استقصاء طرق تناول الأدوية (نشاط 5-1)):\n1) [مستوى الدعم] ماذا ستسأل في استبانتك؟\n   الإجابة النموذجية: مثال: ما شكل الدواء الذي تناولته آخر مرة؟ (شراب/أقراص/مرهم/بخاخ).\n2) [المستوى المتوقع] لماذا يجب أن يكون السؤال موحدًا لجميع الناس؟\n   الإجابة النموذجية: لنستطيع جمع الإجابات ومقارنتها بعدل.\n3) [المستوى المتقدم] لماذا لا نسأل الناس عن أمراضهم بالاسم؟\n   الإجابة النموذجية: لاحترام خصوصيتهم، والمطلوب طرق تناول الأدوية فقط.\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\n1) [مستوى الدعم] هل التبغ دواء؟\n   الإجابة النموذجية: لا، التبغ عقار ضار.\n2) [المستوى المتوقع] اقترح طريقتين لتقليل عدد المدخنين في مدينة.\n   الإجابة النموذجية: سنّ قوانين تمنع التدخين في الأماكن العامة، ورفع سعر السجائر، وبرامج توعية (أي اثنتين).\n3) [المستوى المتقدم] قارن بين دواء الصداع والتبغ من حيث الأثر على الجسم.\n   الإجابة النموذجية: دواء الصداع يخفف الألم إذا أُخذ وفق التوجيهات، والتبغ يضر الرئتين ولا يعالج شيئًا.", "الحصة 1 (العقاقير والأدوية وأشكالها):\nإرشاد الطالب: قراءة ص30 وحل السؤال 1 من تمرين 5-1 ص20. إرشاد ولي الأمر: حفظ الأدوية بعيدًا عن متناول الأطفال وتوضيح أن الدواء يُؤخذ بإشراف الكبار.\n\nالحصة 2 (استقصاء طرق تناول الأدوية (نشاط 5-1)):\nإرشاد الطالب: تطبيق الاستبانة على أفراد الأسرة خلال الأسبوع وتسجيل الإجابات في الجدول. إرشاد ولي الأمر: التعاون مع ابنكم في الإجابة عن أسئلة الاستبانة.\n\nالحصة 3 (الأدوية والعقاقير الضارة (الأسئلة وورقة العمل 5-1)):\nإرشاد الطالب: إكمال ورقة العمل 5-1 ص44–45 والإجابة عن الأسئلة 1–3 ص31. إرشاد ولي الأمر: الحديث مع ابنكم عن أضرار التدخين وأهمية البيئة الخالية منه."]}, {"id": "6-1", "title": "كيف تعمل الأدوية؟", "unit": 1, "unitName": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "sb": "32–33", "ab": "21", "tg": "30–31", "periods": [{"axis": "أعراض المرض ودور الأدوية في العلاج", "h": {"lesson": "6-1 كيف تعمل الأدوية؟", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "sb": "32", "ab": "21", "tg": "30–31", "n": "1 من 2", "axis": "أعراض المرض ودور الأدوية في العلاج"}, "f": ["1. يوضح دور الأدوية في القضاء
