 يشغّل مسابقة الدرس 1-3.\n   دور الطالب: يتنافسون في مجموعات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] هل الكيس «الفارغ» فارغ فعلًا؟\n   الإجابة النموذجية: لا، فيه هواء.\n2) [المستوى المتوقع] لماذا تتغير الإسفنجة عند الضغط عليها؟\n   الإجابة النموذجية: لأن فيها فراغات مملوءة بالهواء يخرج عند الضغط.\n3) [المستوى المتقدم] صحّح: «الهواء لا شيء لأننا لا نراه».\n   الإجابة النموذجية: الهواء مادة غازية تشغل حيزًا رغم أننا لا نراه.", "1) [مستوى الدعم] ما حالة الهواء؟\n   الإجابة النموذجية: غازية.\n2) [المستوى المتوقع] لماذا يصعب تصنيف معجون الأسنان؟\n   الإجابة النموذجية: لأنه يتغير شكله مثل السائل لكنه لا ينساب بسهولة.\n3) [المستوى المتقدم] صمّم تجربة بسيطة تثبت لزميلك أن الهواء موجود.\n   الإجابة النموذجية: نفخ بالون أو جمع الهواء في كيس وضغطه أو وضع كوب مقلوب في الماء.", "إرشاد الطالب: مراجعة الدرس ص54–55 وتمرين 1-3. إرشاد ولي الأمر: تشجيع ابنكم على شرح تجربة الكيس المملوء بالهواء لأفراد الأسرة."]}], "comb": ["الحصة 1 (كل ما حولنا مادة):\n1. يذكر أن جميع الأشياء من حولنا تتكون من مواد.\nمخرج تعليمي آخر (2): يعطي أمثلة لمواد صلبة وسائلة وغازية من الصف.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\n1. يصف خصائص يمكن ملاحظتها لكل حالة من حالات المادة.\nمخرج تعليمي آخر (2): يصنف المواد إلى صلبة وسائلة وغازية.\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\n1. يلاحظ تكوّن غاز عند خلط الخل وبيكربونات الصوديوم.\nمخرج تعليمي آخر (2): يستنتج أن الغاز مادة تشغل حيزًا رغم أننا لا نراه.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\n1. يحدد حالات المادة المختلفة في شيء واحد (كوب مشروب غازي).\nمخرج تعليمي آخر (2): يرسم أمثلة لمواد صلبة وسائلة وغازية.\n\nالحصة 5 (مواد محيّرة والهواء مادة):\n1. يصنف مواد محيرة ويبرر تصنيفه بخصائص المادة.\nمخرج تعليمي آخر (2): يصحح المفهوم الخاطئ بأن الهواء لا شيء.", "الحصة 1 (كل ما حولنا مادة):\nالمخرج 1 (يذكر أن جميع الأشياء من حولنا تتكون من مواد): تذكر\nالمخرج 2 (يعطي أمثلة لمواد صلبة وسائلة وغازية من الصف): فهم\n\nالحصة 2 (خصائص حالات المادة الثلاث):\nالمخرج 1 (يصف خصائص يمكن ملاحظتها لكل حالة من حالات المادة): فهم\nالمخرج 2 (يصنف المواد إلى صلبة وسائلة وغازية): تطبيق\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\nالمخرج 1 (يلاحظ تكوّن غاز عند خلط الخل وبيكربونات الصوديوم): فهم\nالمخرج 2 (يستنتج أن الغاز مادة تشغل حيزًا رغم أننا لا نراه): تحليل\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\nالمخرج 1 (يحدد حالات المادة المختلفة في شيء واحد (كوب مشروب غازي)): تطبيق\nالمخرج 2 (يرسم أمثلة لمواد صلبة وسائلة وغازية): تطبيق\n\nالحصة 5 (مواد محيّرة والهواء مادة):\nالمخرج 1 (يصنف مواد محيرة ويبرر تصنيفه بخصائص المادة): تقييم\nالمخرج 2 (يصحح المفهوم الخاطئ بأن الهواء لا شيء): تقييم", "الحصة 1 (كل ما حولنا مادة):\n• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: العصف الذهني.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\n• التعلم المبني على اللعب\n• التعلم بالاكتشاف\n• التعلم التعاوني\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\n• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\n• التعلم الذاتي\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم المتمايز.\n\nالحصة 5 (مواد محيّرة والهواء مادة):\n• التعلم المبني على اللعب\n• التعلم التشاركي\n• التعلم بالاكتشاف", "الحصة 1 (كل ما حولنا مادة):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: عبوة ماء، بالون منفوخ، مكعب خشبي.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات إشارات المرور (أحمر للصلب، أصفر للسائل، أخضر للغاز).\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: ربع ملعقة بيكربونات الصوديوم لكل مجموعة، خل، قفازات مطاطية، أربطة مطاطية، كوب زجاجي أو بلاستيكي، ملعقة صغيرة.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: كوب زجاجي فيه مشروب غازي.\n\nالحصة 5 (مواد محيّرة والهواء مادة):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: معجون أسنان، صلصال، إسفنجة، وسادة، كيس فارغ.", "الحصة 1 (كل ما حولنا مادة):\nالمادة، صلبة، سائلة، غازية، الهواء.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\nالصلب، السائل، الغاز، الشكل، يأخذ شكل الإناء.\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\nالغاز، ثاني أكسيد الكربون، الفقاعات، يشغل حيزًا.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\nالحالة الصلبة، الحالة السائلة، الحالة الغازية، الفقاعات.\n\nالحصة 5 (مواد محيّرة والهواء مادة):\nالهواء، الخليط، المادة الصلبة، المادة السائلة، الخصائص.", "الحصة 1 (كل ما حولنا مادة):\nيطلب المعلم من الطلاب النظر حولهم وتعداد أكبر عدد من الأشياء في دقيقة، ويكتب القائمة على السبورة.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\nيسكب المعلم ماء من كوب طويل إلى صحن واسع ويسأل: هل تغيّر شكل الماء؟ ثم يضع مكعبًا خشبيًا في الصحن ويسأل السؤال نفسه.\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\nيعرض المعلم قفازًا مطاطيًا مسطحًا ويسأل: كيف ننفخ هذا القفاز دون أن نستخدم أفواهنا؟\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\nيضع المعلم كوبًا زجاجيًا فيه مشروب غازي ويسأل: كم حالة للمادة ترون هنا؟\n\nالحصة 5 (مواد محيّرة والهواء مادة):\nيمسك المعلم كيسًا بلاستيكيًا «فارغًا» ويسأل: هل هذا الكيس فارغ حقًا؟ ثم يجمع الهواء فيه ويغلقه ويضغطه.", "الحصة 1 (كل ما حولنا مادة):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير تحدي الدقيقة ويسجل القائمة.\n   دور الطالب: يعددون: الطاولة، الكرسي، القلم، الماء...\n2) تصنيف القائمة (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يسأل: ما الذي يجمع هذه الأشياء؟ ويوجه إلى أن معظمها صلب.\n   دور الطالب: يصنفون القائمة إلى صلب وسائل.\n3) أين الغاز؟ (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يعرض بالونًا منفوخًا ويسأل: ماذا يوجد داخله؟ ويوضح أن الهواء خليط من الغازات نتنفسه.\n   دور الطالب: يستنتجون أن الهواء مادة غازية لا نراها.\n4) قراءة ص54 (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يقرأ مع الطلاب ويقدم حالات المادة الثلاث.\n   دور الطالب: يكملون جدولًا بأمثلة لكل حالة من الصف والبيت.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: ينفذ العرض ويطرح السؤالين.\n   دور الطالب: يلاحظون أن الماء أخذ شكل الصحن والمكعب لم يتغير.\n2) الخصائص (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يكتب مع الطلاب: الصلب له شكل ثابت، السائل يأخذ شكل الإناء، الغاز ينتشر ولا نراه غالبًا.\n   دور الطالب: يكملون عبارات: «أعلم أنه صلب لأنه...».\n3) لعبة إشارات المرور (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يسمّي أشياء: الخشب، المسطرة، الحليب، الهواء، العصير.\n   دور الطالب: يرفعون البطاقة المناسبة لحالة كل مادة.\n4) زيادة التحدي (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يسمّي: معجون الأسنان، الكولا، الإسفنج.\n   دور الطالب: يناقشون المواد المحيرة ويبررون.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض القفاز ويطرح التحدي.\n   دور الطالب: يقترحون أفكارًا.\n2) التوجيه والسلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يشرح الخطوات: البيكربونات في القفاز، الخل في نصف الكوب، ربط القفاز بالكوب قبل الخلط، وعدم تذوق المواد.\n   دور الطالب: يوزعون الأدوار.\n3) تنفيذ نشاط 1-3 (15 دقائق، من الدقيقة 10 إلى 25):\n   دور المعلم: يتابع المجموعات ويضمن عدم الخلط قبل الربط.\n   دور الطالب: يرفعون القفاز لتسقط البيكربونات في الخل ويلاحظون الفقاعات وانتفاخ القفاز.\n4) التفسير (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يوضح أن الفقاعات غاز ثاني أكسيد الكربون الناتج عن التفاعل، وأنه ملأ القفاز.\n   دور الطالب: يرسمون ما حدث ويكتبون تفسيرًا.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الكوب ويطرح السؤال.\n   دور الطالب: يكتشفون: الكوب صلب، المشروب سائل، الفقاعات غاز.\n2) السؤالان 1 و2 ص55 (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يحددون الحالات في الصورة ويشرحون أين الغاز.\n3) تمرين 1-3 (ص32) (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يوجه إلى الرسم والتصنيف ويكلّف الداعمين بإكمال جمل ناقصة.\n   دور الطالب: يرسمون أمثلة للحالات الثلاث ويسمّونها.\n4) صفات الغازات (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يوضح أن ليس كل الغازات بلا لون (غاز الكلور مائل للأخضر)، ويحذّر من لمس السوائل غير المعروفة.\n   دور الطالب: يكملون: «ليست جميع الغازات...».\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (مواد محيّرة والهواء مادة):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: ينفذ عرض الكيس.\n   دور الطالب: يلاحظون أن الكيس امتلأ بشيء يقاوم الضغط: الهواء.\n2) الهواء مادة (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يناقش لماذا يظن بعض الناس أن الهواء لا شيء.\n   دور الطالب: يستنتجون أن الهواء مادة غازية تشغل حيزًا.\n3) مواد محيرة (12 دقائق، من الدقيقة 13 إلى 25):\n   دور المعلم: يعرض معجون الأسنان والصلصال والإسفنجة والوسادة.\n   دور الطالب: يناقشون في مجموعات: الصلصال يتصرف كالصلب والسائل، والإسفنجة صلبة فيها هواء.\n4) مسابقة المجموعات (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشغّل مسابقة الدرس 1-3.\n   دور الطالب: يتنافسون في مجموعات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (كل ما حولنا مادة):\n1) [مستوى الدعم] اذكر مادة صلبة في الصف.\n   الإجابة النموذجية: الطاولة أو الكرسي أو القلم.\n2) [المستوى المتوقع] اذكر مادة سائلة.\n   الإجابة النموذجية: الماء أو الحليب أو العصير.\n3) [المستوى المتقدم] ما الذي يوجد داخل البالون المنفوخ؟\n   الإجابة النموذجية: الهواء وهو مادة غازية.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\n1) [مستوى الدعم] ما لون البطاقة للمادة السائلة في لعبتنا؟\n   الإجابة النموذجية: الأصفر.\n2) [المستوى المتوقع] أي حالة تأخذ شكل الإناء الذي توضع فيه؟\n   الإجابة النموذجية: السائلة (والغازية).\n3) [المستوى المتقدم] كيف تعرف أن الخشب مادة صلبة؟\n   الإجابة النموذجية: لأن له شكلًا ثابتًا لا يتغير بتغير الإناء.\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\n1) [مستوى الدعم] ماذا حدث للقفاز؟\n   الإجابة النموذجية: انتفخ.\n2) [المستوى المتوقع] ما اسم الغاز الذي تكوّن؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n3) [المستوى المتقدم] ماذا يثبت انتفاخ القفاز عن الغاز؟\n   الإجابة النموذجية: أن الغاز مادة تشغل حيزًا رغم أننا لا نراه.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\n1) [مستوى الدعم] ما حالة الكوب الزجاجي؟\n   الإجابة النموذجية: صلبة.\n2) [المستوى المتوقع] أين الغاز في كوب المشروب الغازي؟\n   الإجابة النموذجية: في الفقاعات.\n3) [المستوى المتقدم] اذكر شيئًا آخر يحتوي على الحالات الثلاث معًا.\n   الإجابة النموذجية: حوض سمك فيه ماء وفقاعات هواء وحصى (إجابات منطقية).\n\nالحصة 5 (مواد محيّرة والهواء مادة):\n1) [مستوى الدعم] هل الكيس «الفارغ» فارغ فعلًا؟\n   الإجابة النموذجية: لا، فيه هواء.\n2) [المستوى المتوقع] لماذا تتغير الإسفنجة عند الضغط عليها؟\n   الإجابة النموذجية: لأن فيها فراغات مملوءة بالهواء يخرج عند الضغط.\n3) [المستوى المتقدم] صحّح: «الهواء لا شيء لأننا لا نراه».\n   الإجابة النموذجية: الهواء مادة غازية تشغل حيزًا رغم أننا لا نراه.", "الحصة 1 (كل ما حولنا مادة):\n1) [مستوى الدعم] ما حالات المادة الثلاث؟\n   الإجابة النموذجية: الصلبة والسائلة والغازية.\n2) [المستوى المتوقع] هل الهواء مادة؟ فسّر.\n   الإجابة النموذجية: نعم، لأنه يملأ البالون ونتنفسه، وهو خليط من الغازات.\n3) [المستوى المتقدم] لماذا كانت معظم الأشياء في قائمتنا صلبة؟\n   الإجابة النموذجية: لأن الأشياء التي نستخدمها في الصف تحتاج إلى شكل ثابت مثل الطاولات والأقلام.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\n1) [مستوى الدعم] صنّف الحليب.\n   الإجابة النموذجية: سائل.\n2) [المستوى المتوقع] لماذا لا نرى الهواء رغم وجوده؟\n   الإجابة النموذجية: لأنه غاز عديم اللون.\n3) [المستوى المتقدم] هل الكولا سائل فقط؟ فسّر.\n   الإجابة النموذجية: لا، فيها سائل وفقاعات غاز.\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\n1) [مستوى الدعم] ماذا لاحظت في الكوب عند الخلط؟\n   الإجابة النموذجية: فقاعات.\n2) [المستوى المتوقع] لماذا ربطنا القفاز قبل خلط المادتين؟\n   الإجابة النموذجية: حتى لا يتسرب الغاز إلى الهواء قبل أن نجمعه.\n3) [المستوى المتقدم] توقع ماذا يحدث لو استخدمنا كمية أكبر من البيكربونات والخل.\n   الإجابة النموذجية: يتكون غاز أكثر فينتفخ القفاز أكثر.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\n1) [مستوى الدعم] ما حالة المشروب؟\n   الإجابة النموذجية: سائلة.\n2) [المستوى المتوقع] هل جميع الغازات عديمة اللون؟\n   الإجابة النموذجية: لا، بعضها له لون مثل غاز الكلور.\n3) [المستوى المتقدم] لماذا يجب ألا نلمس سائلًا لا نعرفه؟\n   الإجابة النموذجية: لأن بعض السوائل حمضية أو ضارة قد تحرق الجلد.\n\nالحصة 5 (مواد محيّرة والهواء مادة):\n1) [مستوى الدعم] ما حالة الهواء؟\n   الإجابة النموذجية: غازية.\n2) [المستوى المتوقع] لماذا يصعب تصنيف معجون الأسنان؟\n   الإجابة النموذجية: لأنه يتغير شكله مثل السائل لكنه لا ينساب بسهولة.\n3) [المستوى المتقدم] صمّم تجربة بسيطة تثبت لزميلك أن الهواء موجود.\n   الإجابة النموذجية: نفخ بالون أو جمع الهواء في كيس وضغطه أو وضع كوب مقلوب في الماء.", "الحصة 1 (كل ما حولنا مادة):\nإرشاد الطالب: قراءة ص54 وكتابة 3 أمثلة لكل حالة من حالات المادة في البيت. إرشاد ولي الأمر: مساعدة ابنكم على تصنيف أشياء المطبخ إلى صلبة وسائلة وغازية.\n\nالحصة 2 (خصائص حالات المادة الثلاث):\nإرشاد الطالب: كتابة فقرة عن أشياء في الصف وتصنيفها إلى حالات المادة الثلاث. إرشاد ولي الأمر: لعب لعبة إشارات المرور مع ابنكم بأشياء من البيت.\n\nالحصة 3 (غاز من خليط (نشاط 1-3)):\nإرشاد الطالب: كتابة خطوات نشاط 1-3 ونتيجته. إرشاد ولي الأمر: يمكن تكرار التجربة في المطبخ بإشرافكم مع الحذر من تذوق المواد.\n\nالحصة 4 (حالات المادة في كوب مشروب (تمرين 1-3)):\nإرشاد الطالب: إكمال تمرين 1-3 ص32. إرشاد ولي الأمر: البحث مع ابنكم عن أشياء في البيت فيها أكثر من حالة للمادة.\n\nالحصة 5 (مواد محيّرة والهواء مادة):\nإرشاد الطالب: مراجعة الدرس ص54–55 وتمرين 1-3. إرشاد ولي الأمر: تشجيع ابنكم على شرح تجربة الكيس المملوء بالهواء لأفراد الأسرة."]}, {"id": "2-3", "title": "المادة تتكوّن من جزيئات", "unit": 3, "unitName": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "sb": "56–57", "ab": "33، ورقة العمل 2-3 ص56–57", "tg": "57–60", "periods": [{"axis": "ما الجزيئات؟", "h": {"lesson": "2-3 المادة تتكوّن من جزيئات", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "sb": "56", "ab": "—", "tg": "57–60", "n": "1 من 5", "axis": "ما الجزيئات؟"}, "f": ["1. يذكر أن جميع المواد تتكون من جزيئات صغيرة جدًا لا نراها.\nمخرج تعليمي آخر (2): يوضح أن الماء والثلج مادة واحدة في حالتين مختلفتين.", "المخرج 1 (يذكر أن جميع المواد تتكون من جزيئات صغيرة جدًا لا نراها): تذكر\nالمخرج 2 (يوضح أن الماء والثلج مادة واحدة في حالتين مختلفتين): فهم", "• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: مكعب ثلج، كوب ماء، كيس سكر ناعم.", "الجزيئات، النموذج العلمي، الماء، الثلج، الحالة.", "يضع المعلم مكعب ثلج بجانب كوب ماء ويسأل: هل هما المادة نفسها؟ كيف تغيّر الثلج إلى ماء؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الثلج والماء.\n   دور الطالب: يتوقعون أن الثلج ماء متجمد.\n2) شيء لا يُرى (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض كومة سكر ناعم ويوضح أنها حبيبات صغيرة، ثم يوضح أن المواد تتكون من جزيئات أصغر بكثير لا نراها حتى بالعدسة.\n   دور الطالب: يشبّهون المادة بكومة حبيبات صغيرة جدًا.\n3) النموذج العلمي (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يوضح أن العلماء يستخدمون نموذج الجزيئات لتخيل ما لا نراه.\n   دور الطالب: يقرؤون ص56 ويرسمون دوائر صغيرة تمثل الجزيئات.\n4) الماء والثلج (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يسأل: هل تتغير الجزيئات عندما يذوب الثلج؟\n   دور الطالب: يستنتجون أن الجزيئات نفسها لكن ترتيبها وحركتها تتغير.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] مم تتكون جميع المواد؟\n   الإجابة النموذجية: من جزيئات.\n2) [المستوى المتوقع] هل نستطيع رؤية الجزيئات؟\n   الإجابة النموذجية: لا، لأنها صغيرة جدًا.\n3) [المستوى المتقدم] لماذا نستخدم نموذج الجزيئات؟\n   الإجابة النموذجية: لنتخيل ونفسر شيئًا لا نراه.", "1) [مستوى الدعم] هل الماء والثلج مادة واحدة؟\n   الإجابة النموذجية: نعم، الثلج ماء في الحالة الصلبة.\n2) [المستوى المتوقع] ما الذي يتغير عندما يذوب الثلج؟\n   الإجابة النموذجية: ترتيب الجزيئات وحركتها وليس نوعها.\n3) [المستوى المتقدم] لماذا يشبه السكر الناعم نموذج الجزيئات وكيف يختلف عنه؟\n   الإجابة النموذجية: يشبهه لأنه حبيبات صغيرة، ويختلف لأن الجزيئات أصغر بكثير ولا تُرى.", "إرشاد الطالب: قراءة ص56 ورسم نموذج يوضح أن المادة تتكون من جزيئات. إرشاد ولي الأمر: مراقبة ذوبان مكعب ثلج مع ابنكم والحديث عن أنه المادة نفسها."]}, {"axis": "تمثيل الجزيئات (نشاط 2-3)", "h": {"lesson": "2-3 المادة تتكوّن من جزيئات", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "sb": "57", "ab": "—", "tg": "57–60", "n": "2 من 5", "axis": "تمثيل الجزيئات (نشاط 2-3)"}, "f": ["1. يمثّل حركة الجزيئات وترتيبها في المواد الصلبة والسائلة والغازية.\nمخرج تعليمي آخر (2): يقارن بين الحالات الثلاث من حيث حركة الجزيئات والمسافة بينها.", "المخرج 1 (يمثّل حركة الجزيئات وترتيبها في المواد الصلبة والسائلة والغازية): تطبيق\nالمخرج 2 (يقارن بين الحالات الثلاث من حيث حركة الجزيئات والمسافة بينها): تحليل", "• التعلم المبني على اللعب\n• التعلم بالنمذجة\n• التعلم التعاوني", "• الكتاب\n• الأقلام\n• أخرى: مساحة واسعة (الملعب أو القاعة).", "الاهتزاز، الانزلاق، الحركة الحرة، المسافة بين الجزيئات.", "يسأل المعلم: لو كنتم جزيئات في قطعة حديد، كيف ستقفون؟ ولو كنتم جزيئات هواء؟ ثم ينقل الطلاب إلى الملعب.", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح السؤالين.\n   دور الطالب: يتوقعون أشكال الوقوف.\n2) التعليمات (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يقسم الطلاب مجموعات 10–15، كل طالب جزيء، مع مراعاة الفروق الثقافية في التلامس.\n   دور الطالب: يستمعون للقواعد.\n3) الحالة الصلبة (8 دقائق، من الدقيقة 10 إلى 18):\n   دور المعلم: يطلب الوقوف متلاصقين في صفوف مع تشابك الأذرع والاهتزاز في المكان، ثم يوقف اللعبة لطرح الأسئلة 1–3.\n   دور الطالب: يهتزون في أماكنهم دون تغيير المكان ويجيبون.\n4) الحالة السائلة (6 دقائق، من الدقيقة 18 إلى 24):\n   دور المعلم: يطلب ترك تشابك الأذرع وإمساك الأيدي.\n   دور الطالب: يتحركون وينزلقون حول بعضهم دون ترك الأيدي.\n5) الحالة الغازية (6 دقائق، من الدقيقة 24 إلى 30):\n   دور المعلم: يطلب ترك الأيدي والحركة الحرة بحذر.\n   دور الطالب: يتحركون بحرية في كل الاتجاهات ويتباعدون.\n6) المناقشة (10 دقائق، من الدقيقة 30 إلى 40):\n   دور المعلم: يعود إلى الصف ويناقش الأسئلة 1–3 ص57.\n   دور الطالب: يقارنون الحالات في جدول: الحركة، المسافة، تغيّر الشكل.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] كيف تحركتم في الحالة الصلبة؟\n   الإجابة النموذجية: اهتززنا في أماكننا دون تغيير المكان.\n2) [المستوى المتوقع] ماذا تغيّر عندما مثّلتم الحالة السائلة؟\n   الإجابة النموذجية: أصبحنا نتحرك وننزلق حول بعضنا مع بقائنا متقاربين.\n3) [المستوى المتقدم] في أي حالة استطاعت المجموعة تغيير شكلها بالكامل؟\n   الإجابة النموذجية: الحالة الغازية.", "1) [مستوى الدعم] في أي حالة كانت الجزيئات أكثر تباعدًا؟\n   الإجابة النموذجية: الحالة الغازية.\n2) [المستوى المتوقع] هل يمكن تغيير شكل المجموعة في الحالة الصلبة؟\n   الإجابة النموذجية: لا.\n3) [المستوى المتقدم] ماذا يمثل تشابك الأذرع في نموذجنا؟\n   الإجابة النموذجية: قوة ارتباط الجزيئات في المادة الصلبة التي تمنعها من تغيير أماكنها.", "إرشاد الطالب: الإجابة عن الأسئلة 1–3 ص57 في الدفتر. إرشاد ولي الأمر: الطلب من ابنكم تمثيل حركة جزيئات الحالات الثلاث مع أفراد الأسرة."]}, {"axis": "نموذج الجزيئات في علبة (ورقة العمل 2-3)", "h": {"lesson": "2-3 المادة تتكوّن من جزيئات", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "sb": "56–57", "ab": "56–57", "tg": "57–60", "n": "3 من 5", "axis": "نموذج الجزيئات في علبة (ورقة العمل 2-3)"}, "f": ["1. يستخدم نموذج العلبة والكرات لتمثيل ترتيب الجزيئات في الحالات الثلاث.\nمخرج تعليمي آخر (2): يستنتج العلاقة بين المساحة المتاحة وحركة الجزيئات.", "المخرج 1 (يستخدم نموذج العلبة والكرات لتمثيل ترتيب الجزيئات في الحالات الثلاث): تطبيق\nالمخرج 2 (يستنتج العلاقة بين المساحة المتاحة وحركة الجزيئات): تحليل", "• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم بالاكتشاف", "• الكتاب\n• الأقلام\n• أخرى: علبة مستطيلة (علبة أحذية)، قطعة ورق مقوى فاصلة، 6 كرات زجاجية صغيرة أو كرات جولف.", "النموذج، الكرات، التلاصق، التباعد، الاهتزاز.", "يسأل المعلم: هل يمكن تمثيل الجزيئات على الطاولة دون الخروج إلى الملعب؟ ويعرض العلبة والكرات.", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض المواد.\n   دور الطالب: يقترحون طرقًا للتمثيل.\n2) الخطوة 1: دون فاصل (8 دقائق، من الدقيقة 4 إلى 12):\n   دور المعلم: يطلب تحريك العلبة على الطاولة دون رفعها.\n   دور الطالب: يلاحظون حركة الكرات الحرة والمسافات الكبيرة: تمثيل الغاز.\n3) الخطوة 2: الفاصل في المنتصف (8 دقائق، من الدقيقة 12 إلى 20):\n   دور المعلم: يطلب وضع الفاصل في المنتصف ووضع الكرات في جانب واحد.\n   دور الطالب: يلاحظون أن الكرات تتقارب وتنزلق: تمثيل السائل.\n4) الخطوة 3: الفاصل قرب الطرف (8 دقائق، من الدقيقة 20 إلى 28):\n   دور المعلم: يطلب تضييق المساحة.\n   دور الطالب: يلاحظون أن الكرات تتلاصق وتهتز في مكانها: تمثيل الصلب.\n5) الإجابة عن أسئلة الورقة (8 دقائق، من الدقيقة 28 إلى 36):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يربطون كل ترتيب بالحالة ويقترحون بدائل للكرات مثل حبات البازلاء أو الفول.\n6) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] أي ترتيب للكرات يمثل المادة الصلبة؟\n   الإجابة النموذجية: الكرات متلاصقة تهتز في مكانها.\n2) [المستوى المتوقع] ماذا يمثل ترتيب الكرات دون فاصل؟\n   الإجابة النموذجية: المادة الغازية.\n3) [المستوى المتقدم] ماذا يحدث لحركة الكرات كلما ضاقت المساحة؟\n   الإجابة النموذجية: تقل حركتها وتتقارب حتى تتلاصق.", "1) [مستوى الدعم] ماذا يمثل ترتيب الكرات عندما يكون الفاصل في المنتصف؟\n   الإجابة النموذجية: المادة السائلة.\n2) [المستوى المتوقع] اقترح بديلًا للكرات الزجاجية.\n   الإجابة النموذجية: حبات البازلاء أو الفول أو أي شيء يتدحرج.\n3) [المستوى المتقدم] ما أوجه القصور في نموذج العلبة؟\n   الإجابة النموذجية: الكرات أكبر بكثير من الجزيئات ولا تتحرك وحدها، ونحن من يحرك العلبة.", "إرشاد ا كية\n• الأقلام\n• صورة توضيحية\n\nالحصة 5 (النموذج والحقيقة):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: مجسم سيارة أو طائرة.", "الحصة 1 (ما الجزيئات؟):\nالجزيئات، النموذج العلمي، الماء، الثلج، الحالة.\n\nالحصة 2 (تمثيل الجزيئات (نشاط 2-3)):\nالاهتزاز، الانزلاق، الحركة الحرة، المسافة بين الجزيئات.\n\nالحصة 3 (نموذج الجزيئات في علبة (ورقة العمل 2-3)):\nالنموذج، الكرات، التلاصق، التباعد، الاهتزاز.\n\nالحصة 4 (رسم جزيئات المواد (تمرين 2-3)):\nترتيب الجزيئات، تهتز في مكانها، تتحرك كثيرًا، متقاربة، متباعدة جدًا.\n\nالحصة 5 (النموذج والحقيقة):\nالنموذج العلمي، الجزيئات، الخصائص، التفسير.", "الحصة 1 (ما الجزيئات؟):\nيضع المعلم مكعب ثلج بجانب كوب ماء ويسأل: هل هما المادة نفسها؟ كيف تغيّر الثلج إلى ماء؟\n\nالحصة 2 (تمثيل الجزيئات (نشاط 2-3)):\nيسأل المعلم: لو كنتم جزيئات في قطعة حديد، كيف ستقفون؟ ولو كنتم جزيئات هواء؟ ثم ينقل الطلاب إلى الملعب.\n\nالحصة 3 (نموذج الجزيئات في علبة (ورقة العمل 2-3)):\nيسأل المعلم: هل يمكن تمثيل الجزيئات على الطاولة دون الخروج إلى الملعب؟ ويعرض العلبة والكرات.\n\nالحصة 4 (رسم جزيئات المواد (تمرين 2-3)):\nيعرض المعلم ثلاث صور: حجر، كوب عصير، بالون، ويطلب من الطلاب أن يتخيلوا شكل الجزيئات داخل كل منها.\n\nالحصة 5 (النموذج والحقيقة):\nيعرض المعلم مجسم سيارة ويسأل: هل هذا المجسم سيارة حقيقية؟ ما فائدته إذن؟", "الحصة 1 (ما الجزيئات؟):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الثلج والماء.\n   دور الطالب: يتوقعون أن الثلج ماء متجمد.\n2) شيء لا يُرى (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض كومة سكر ناعم ويوضح أنها حبيبات صغيرة، ثم يوضح أن المواد تتكون من جزيئات أصغر بكثير لا نراها حتى بالعدسة.\n   دور الطالب: يشبّهون المادة بكومة حبيبات صغيرة جدًا.\n3) النموذج العلمي (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يوضح أن العلماء يستخدمون نموذج الجزيئات لتخيل ما لا نراه.\n   دور الطالب: يقرؤون ص56 ويرسمون دوائر صغيرة تمثل الجزيئات.\n4) الماء والثلج (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يسأل: هل تتغير الجزيئات عندما يذوب الثلج؟\n   دور الطالب: يستنتجون أن الجزيئات نفسها لكن ترتيبها وحركتها تتغير.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (تمثيل الجزيئات (نشاط 2-3)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح السؤالين.\n   دور الطالب: يتوقعون أشكال الوقوف.\n2) التعليمات (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يقسم الطلاب مجموعات 10–15، كل طالب جزيء، مع مراعاة الفروق الثقافية في التلامس.\n   دور الطالب: يستمعون للقواعد.\n3) الحالة الصلبة (8 دقائق، من الدقيقة 10 إلى 18):\n   دور المعلم: يطلب الوقوف متلاصقين في صفوف مع تشابك الأذرع والاهتزاز في المكان، ثم يوقف اللعبة لطرح الأسئلة 1–3.\n   دور الطالب: يهتزون في أماكنهم دون تغيير المكان ويجيبون.\n4) الحالة السائلة (6 دقائق، من الدقيقة 18 إلى 24):\n   دور المعلم: يطلب ترك تشابك الأذرع وإمساك الأيدي.\n   دور الطالب: يتحركون وينزلقون حول بعضهم دون ترك الأيدي.\n5) الحالة الغازية (6 دقائق، من الدقيقة 24 إلى 30):\n   دور المعلم: يطلب ترك الأيدي والحركة الحرة بحذر.\n   دور الطالب: يتحركون بحرية في كل الاتجاهات ويتباعدون.\n6) المناقشة (10 دقائق، من الدقيقة 30 إلى 40):\n   دور المعلم: يعود إلى الصف ويناقش الأسئلة 1–3 ص57.\n   دور الطالب: يقارنون الحالات في جدول: الحركة، المسافة، تغيّر الشكل.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (نموذج الجزيئات في علبة (ورقة العمل 2-3)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض المواد.\n   دور الطالب: يقترحون طرقًا للتمثيل.\n2) الخطوة 1: دون فاصل (8 دقائق، من الدقيقة 4 إلى 12):\n   دور المعلم: يطلب تحريك العلبة على الطاولة دون رفعها.\n   دور الطالب: يلاحظون حركة الكرات الحرة والمسافات الكبيرة: تمثيل الغاز.\n3) الخطوة 2: الفاصل في المنتصف (8 دقائق، من الدقيقة 12 إلى 20):\n   دور المعلم: يطلب وضع الفاصل في المنتصف ووضع الكرات في جانب واحد.\n   دور الطالب: يلاحظون أن الكرات تتقارب وتنزلق: تمثيل السائل.\n4) الخطوة 3: الفاصل قرب الطرف (8 دقائق، من الدقيقة 20 إلى 28):\n   دور المعلم: يطلب تضييق المساحة.\n   دور الطالب: يلاحظون أن الكرات تتلاصق وتهتز في مكانها: تمثيل الصلب.\n5) الإجابة عن أسئلة الورقة (8 دقائق، من الدقيقة 28 إلى 36):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يربطون كل ترتيب بالحالة ويقترحون بدائل للكرات مثل حبات البازلاء أو الفول.\n6) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (رسم جزيئات المواد (تمرين 2-3)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصور.\n   دور الطالب: يصفون تخيلهم شفهيًا.\n2) تمرين 2-3 (ص33) الرسم (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يوجه الرسم بالدوائر ويسمح للداعمين بالرسم بدل الكتابة.\n   دور الطالب: يرسمون جزيئات الصلب متلاصقة منتظمة، والسائل متقاربة غير منتظمة، والغاز متباعدة جدًا.\n3) إكمال الجدول (10 دقائق، من الدقيقة 17 إلى 27):\n   دور المعلم: يتابع إكمال الجدول.\n   دور الطالب: يكملون: الصلبة تهتز في مكانها ومتلاصقة، السائلة تتحرك كثيرًا ومتقاربة، الغازية تتحرك كثيرًا جدًا ومتباعدة جدًا.\n4) تقويم الأقران (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: ينظم تبادل الدفاتر.\n   دور الطالب: يقيّمون رسوم زملائهم ويقترحون تصحيحًا.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (النموذج والحقيقة):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض المجسم.\n   دور الطالب: يستنتجون أن المجسم يمثل الحقيقة ولا يطابقها تمامًا.\n2) نماذجنا للجزيئات (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يراجع النماذج: تمثيل الطلاب، العلبة والكرات، الرسوم.\n   دور الطالب: يحددون ما يشبه الحقيقة وما يختلف عنها في كل نموذج.\n3) التفسير بالنموذج (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يطرح: لماذا لا يتغير شكل الطوب؟ لماذا ينساب الماء؟\n   دور الطالب: يفسرون باستخدام حركة الجزيئات وتقاربها.\n4) مسابقة المجموعات (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشغّل مسابقة الدرس 2-3.\n   دور الطالب: يتنافسون في مجموعات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (ما الجزيئات؟):\n1) [مستوى الدعم] مم تتكون جميع المواد؟\n   الإجابة النموذجية: من جزيئات.\n2) [المستوى المتوقع] هل نستطيع رؤية الجزيئات؟\n   الإجابة النموذجية: لا، لأنها صغيرة جدًا.\n3) [المستوى المتقدم] لماذا نستخدم نموذج الجزيئات؟\n   الإجابة النموذجية: لنتخيل ونفسر شيئًا لا نراه.\n\nالحصة 2 (تمثيل الجزيئات (نشاط 2-3)):\n1) [مستوى الدعم] كيف تحركتم في الحالة الصلبة؟\n   الإجابة النموذجية: اهتززنا في أماكننا دون تغيير المكان.\n2) [المستوى المتوقع] ماذا تغيّر عندما مثّلتم الحالة السائلة؟\n   الإجابة النموذجية: أصبحنا نتحرك وننزلق حول بعضنا مع بقائنا متقاربين.\n3) [المستوى المتقدم] في أي حالة استطاعت المجموعة تغيير شكلها بالكامل؟\n   الإجابة النموذجية: الحالة الغازية.\n\nالحصة 3 (نموذج الجزيئات في علبة (ورقة العمل 2-3)):\n1) [مستوى الدعم] أي ترتيب للكرات يمثل المادة الصلبة؟\n   الإجابة النموذجية: الكرات متلاصقة تهتز في مكانها.\n2) [المستوى المتوقع] ماذا يمثل ترتيب الكرات دون فاصل؟\n   الإجابة النموذجية: المادة الغازية.\n3) [المستوى المتقدم] ماذا يحدث لحركة الكرات كلما ضاقت المساحة؟\n   الإجابة النموذجية: تقل حركتها وتتقارب حتى تتلاصق.\n\nالحصة 4 (رسم جزيئات المواد (تمرين 2-3)):\n1) [مستوى الدعم] كيف ترسم جزيئات المادة الصلبة؟\n   الإجابة النموذجية: متلاصقة ومرتبة بانتظام.\n2) [المستوى المتوقع] في أي حالة تتحرك الجزيئات أكثر؟\n   الإجابة النموذجية: الحالة الغازية.\n3) [المستوى المتقدم] قارن بين جزيئات السائل والغاز من حيث المسافة.\n   الإجابة النموذجية: جزيئات السائل متقاربة، وجزيئات الغاز متباعدة جدًا.\n\nالحصة 5 (النموذج والحقيقة):\n1) [مستوى الدعم] هل الجزيئات تشبه الكرات الزجاجية تمامًا؟\n   الإجابة النموذجية: لا، الكرات نموذج يساعدنا على التخيل فقط.\n2) [المستوى المتوقع] لماذا لا يتغير شكل الطوب؟\n   الإجابة النموذجية: لأن جزيئاته متلاصقة لا تتحرك إلا اهتزازًا في مكانها.\n3) [المستوى المتقدم] لماذا ينساب الماء عند سكبه؟\n   الإجابة النموذجية: لأن جزيئاته متقاربة لكنها تنزلق على بعضها.", "الحصة 1 (ما الجزيئات؟):\n1) [مستوى الدعم] هل الماء والثلج مادة واحدة؟\n   الإجابة النموذجية: نعم، الثلج ماء في الحالة الصلبة.\n2) [المستوى المتوقع] ما الذي يتغير عندما يذوب الثلج؟\n   الإجابة النموذجية: ترتيب الجزيئات وحركتها وليس نوعها.\n3) [المستوى المتقدم] لماذا يشبه السكر الناعم نموذج الجزيئات وكيف يختلف عنه؟\n   الإجابة النموذجية: يشبهه لأنه حبيبات صغيرة، ويختلف لأن الجزيئات أصغر بكثير ولا تُرى.\n\nالحصة 2 (تمثيل الجزيئات (نشاط 2-3)):\n1) [مستوى الدعم] في أي حالة كانت الجزيئات أكثر تباعدًا؟\n   الإجابة النموذجية: الحالة الغازية.\n2) [المستوى المتوقع] هل يمكن تغيير شكل المجموعة في الحالة الصلبة؟\n   الإجابة النموذجية: لا.\n3) [المستوى المتقدم] ماذا يمثل تشابك الأذرع في نموذجنا؟\n   الإجابة النموذجية: قوة ارتباط الجزيئات في المادة الصلبة التي تمنعها من تغيير أماكنها.\n\nالحصة 3 (نموذج الجزيئات في علبة (ورقة العمل 2-3)):\n1) [مستوى الدعم] ماذا يمثل ترتيب الكرات عندما يكون الفاصل في المنتصف؟\n   الإجابة النموذجية: المادة السائلة.\n2) [المستوى المتوقع] اقترح بديلًا للكرات الزجاجية.\n   الإجابة النموذجية: حبات البازلاء أو الفول أو أي شيء يتدحرج.\n3) [المستوى المتقدم] ما أوجه القصور في نموذج العلبة؟\n   الإجابة النموذجية: الكرات أكبر بكثير من الجزيئات ولا تتحرك وحدها، ونحن من يحرك العلبة.\n\nالحصة 4 (رسم جزيئات المواد (تمرين 2-3)):\n1) [مستوى الدعم] هل تتحرك جزيئات المادة الصلبة؟\n   الإجابة النموذجية: نعم، تهتز في مكانها فقط.\n2) [المستوى المتوقع] صف جزيئات العصير في الكوب.\n   الإجابة النموذجية: متقاربة وتنزلق على بعضها.\n3) [المستوى المتقدم] فسّر بالجزيئات لماذا يملأ الغاز البالون كله.\n   الإجابة النموذجية: لأن جزيئات الغاز تتحرك بحرية وتنتشر في كل الاتجاهات.\n\nالحصة 5 (النموذج والحقيقة):\n1) [مستوى الدعم] ما فائدة النموذج العلمي؟\n   الإجابة النموذجية: يساعدنا على فهم وتخيل ما لا نراه.\n2) [المستوى المتوقع] اذكر اختلافًا بين نموذج الطلاب والجزيئات الحقيقية.\n   الإجابة النموذجية: الطلاب كبار ويرون بعضهم، والجزيئات صغيرة جدًا ولا تُرى.\n3) [المستوى المتقدم] اقترح نموذجًا جديدًا لتمثيل الجزيئات في الحالات الثلاث.\n   الإجابة النموذجية: حبات حلوى في أكواب بأحجام مختلفة أو نقاط ملونة على شاشة متحركة (إجابات متنوعة).", "الحصة 1 (ما الجزيئات؟):\nإرشاد الطالب: قراءة ص56 ورسم نموذج يوضح أن المادة تتكون من جزيئات. إرشاد ولي الأمر: مراقبة ذوبان مكعب ثلج مع ابنكم والحديث عن أنه المادة نفسها.\n\nالحصة 2 (تمثيل الجزيئات (نشاط 2-3)):\nإرشاد الطالب: الإجابة عن الأسئلة 1–3 ص57 في الدفتر. إرشاد ولي الأمر: الطلب من ابنكم تمثيل حركة جزيئات الحالات الثلاث مع أفراد الأسرة.\n\nالحصة 3 (نموذج الجزيئات في علبة (ورقة العمل 2-3)):\nإرشاد الطالب: إكمال ورقة العمل 2-3 ص56–57. إرشاد ولي الأمر: صنع نموذج العلبة مع ابنكم باستخدام حبوب البازلاء.\n\nالحصة 4 (رسم جزيئات المواد (تمرين 2-3)):\nإرشاد الطالب: إكمال تمرين 2-3 ص33. إرشاد ولي الأمر: سؤال ابنكم عن ترتيب الجزيئات في الحجر والعصير والهواء.\n\nالحصة 5 (النموذج والحقيقة):\nإرشاد الطالب: مراجعة الدرس ص56–57 وتمرين 2-3. إرشاد ولي الأمر: الاستماع إلى ابنكم وهو يفسر بالجزيئات لماذا ينساب الماء."]}, {"id": "3-3", "title": "كيف تختلف المواد الصلبة والسائلة والغازية؟", "unit": 3, "unitName": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "sb": "58–59", "ab": "34، ورقتا العمل 3-3أ ص58–59 و3-3ب ص60", "tg": "60–63", "periods": [{"axis": "السائل يأخذ شكل الإناء (نشاط 3-3أ)", "h": {"lesson": "3-3 كيف تختلف المواد الصلبة والسائلة والغازية؟", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "sb": "58", "ab": "—", "tg": "60–63", "n": "1 من 5", "axis": "السائل يأخذ شكل الإناء (نشاط 3-3أ)"}, "f": ["1. يخطط تجربة ويختار الأدوات لإثبات أن السائل يأخذ شكل الإناء الذي يوضع فيه.\nمخرج تعليمي آخر (2): يقارن بين احتفاظ المادة الصلبة بشكلها وتغير شكل السائل.", "المخرج 1 (يخطط تجربة ويختار الأدوات لإثبات أن السائل يأخذ شكل الإناء الذي يوضع فيه): إبداع\nالمخرج 2 (يقارن بين احتفاظ المادة الصلبة بشكلها وتغير شكل السائل): تحليل", "• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: أوانٍ مختلفة الأشكال (كوب، علبة بلاستيكية مستطيلة، صحن)، قنينة ماء، مكعب صلب.", "الشكل الثابت، يأخذ شكل الإناء، الحجم.", "يتحدى المعلم الطلاب: «أثبتوا لي بتجربة أن الماء ليس له شكل خاص به!» ويذكّر بحالات المادة.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح التحدي.\n   دور الطالب: يقترحون أفكارًا.\n2) التخطيط في المجموعات (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يمنح 10 دقائق للتخطيط ويتنقل بين المجموعات.\n   دور الطالب: يحددون الأدوات والخطوات وكيفية تسجيل الملاحظات.\n3) عرض خطة (5 دقائق، من الدقيقة 15 إلى 20):\n   دور المعلم: يختار مجموعة تعرض خطتها.\n   دور الطالب: يناقشون الخطة ويحسنونها.\n4) تنفيذ نشاط 3-3أ (14 دقائق، من الدقيقة 20 إلى 34):\n   دور المعلم: يتابع التنفيذ.\n   دور الطالب: يسكبون الماء في أوانٍ مختلفة ويرسمون شكله في كل مرة، ثم يضعون المكعب الصلب في الأواني نفسها ويقارنون.\n5) الاستنتاج والغلق (6 دقائق، من الدقيقة 34 إلى 40):\n   دور المعلم: يربط النتيجة بنموذج الجزيئات.\n   دور الطالب: يستنتجون: السائل يأخذ شكل الإناء لأن جزيئاته تنزلق، والصلب يحتفظ بشكله.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ماذا حدث لشكل الماء عند سكبه في إناء آخر؟\n   الإجابة النموذجية: أخذ شكل الإناء الجديد.\n2) [المستوى المتوقع] هل تغير شكل المكعب الصلب؟\n   الإجابة النموذجية: لا، احتفظ بشكله.\n3) [المستوى المتقدم] فسّر بالجزيئات لماذا يأخذ السائل شكل الإناء.\n   الإجابة النموذجية: لأن جزيئاته متقاربة لكنها تنزلق على بعضها فتملأ شكل الإناء.", "1) [مستوى الدعم] اذكر أداتين استخدمتهما في التجربة.\n   الإجابة النموذجية: كوب وعلبة (أو صحن وقنينة ماء).\n2) [المستوى المتوقع] هل تغيرت كمية الماء عند نقله من إناء لآخر؟\n   الإجابة النموذجية: لا، بقيت الكمية نفسها وتغير الشكل فقط.\n3) [المستوى المتقدم] كيف تحسّن تجربتك لتكون أوضح؟\n   الإجابة النموذجية: استخدام أوانٍ شفافة بأشكال مختلفة جدًا وتلوين الماء.", "إرشاد الطالب: قراءة ص58 وتجربة سكب الماء في أوانٍ مختلفة في البيت. إرشاد ولي الأمر: مساعدة ابنكم على تنفيذ التجربة في المطبخ وتسجيل ملاحظاته."]}, {"axis": "الغاز ينتشر في كل الاتجاهات (نشاط 3-3ب)", "h": {"lesson": "3-3 كيف تختلف المواد الصلبة والسائلة والغازية؟", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "sb": "59", "ab": "—", "tg": "60–63", "n": "2 من 5", "axis": "الغاز ينتشر في كل الاتجاهات (نشاط 3-3ب)"}, "f": ["1. يلاحظ أن الفقاعة تحتوي على هواء وأن الهواء ينتشر عند انفجارها.\nمخرج تعليمي آخر (2): يفسر انتشار الغاز باستخدام نموذج الجزيئات.", "المخرج 1 (يلاحظ أن الفقاعة تحتوي على هواء وأن الهواء ينتشر عند انفجارها): فهم\nالمخرج 2 (يفسر انتشار الغاز باستخدام نموذج الجزيئات): فهم", "• التعلم بالاكتشاف\n• التعلم المبني على اللعب\n• التعلم التعاوني", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: ماء به صابون، حلقات نفخ الفقاعات من الأسلاك.", "الفقاعة، الانتشار، الهواء، الغاز.", "ينفخ المعلم فقاعة صابون ويسأل: ماذا يوجد داخل الفقاعة؟ وأين يذهب عندما تنفجر؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: ينفخ فقاعة ويطرح السؤالين.\n   دور الطالب: يتوقعون الإجابات.\n2) التوجيه (5 دقائق، من الدقيقة 5 إلى 10):\n   دور المعلم: يوزع حلقات النفخ ومحلول الصابون ويوضح قواعد اللعب الآمن.\n   دور الطالب: يستعدون في مجموعات.\n3) تنفيذ نشاط 3-3ب (12 دقائق، من الدقيقة 10 إلى 22):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: ينفخون الفقاعات ويلاحظون أشكالها وانفجارها.\n4) السؤال 1 ص59 (10 دقائق، من الدقيقة 22 إلى 32):\n   دور المعلم: يطلب رسم جزيئات الهواء داخل الفقاعة وبعد انفجارها.\n   دور الطالب: يرسمون جزيئات متقاربة نسبيًا داخل الفقاعة ومنتشرة بعد الانفجار.\n5) الغلق والتفسير (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يلخص: الغاز ينتشر في كل الاتجاهات ويملأ أي مكان.\n   دور الطالب: يجيبون عن أسئلة الختام.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ماذا يوجد داخل فقاعة الصابون؟\n   الإجابة النموذجية: الهواء.\n2) [المستوى المتوقع] ماذا يحدث للهواء عند انفجار الفقاعة؟\n   الإجابة النموذجية: ينتشر في كل الاتجاهات.\n3) [المستوى المتقدم] لماذا ينتشر الغاز ولا يبقى في مكانه؟\n   الإجابة النموذجية: لأن جزيئاته تتحرك بحرية وسرعة في كل الاتجاهات.", "1) [مستوى الدعم] ما حالة الهواء؟\n   الإجابة النموذجية: غازية.\n2) [المستوى المتوقع] ارسم جزيئات الهواء بعد انفجار الفقاعة وصفها.\n   الإجابة النموذجية: جزيئات متباعدة جدًا منتشرة في كل مكان.\n3) [المستوى المتقدم] لماذا نشم رائحة العطر في الغرفة كلها بعد رشه في زاوية؟\n   الإجابة النموذجية: لأن جزيئات العطر الغازية تنتشر في كل الاتجاهات.", "إرشاد الطالب: الإجابة عن السؤال 1 ص59 بالرسم. إرشاد ولي الأمر: نفخ الفقاعات مع ابنكم ومناقشة ما يحدث للهواء داخلها."]}, {"axis": "ضغط المواد بالحقنة (ورقة العمل 3-3أ)", "h": {"lesson": "3-3 كيف تختلف المواد الصلبة والسائلة والغازية؟", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "sb": "58–59", "ab": "58–59", "tg": "60–63", "n": "3 من 5", "axis": "ضغط المواد بالحقنة (ورقة العمل 3-3أ)"}, "f": ["1. يقارن سهولة ضغط الغاز والسائل والصلب باستخدام حقنة دون إبرة.\nمخرج تعليمي آخر (2): يفسر سهولة ضغط الغاز بالمسافات بين جزيئاته.", "المخرج 1 (يقارن سهولة ضغط الغاز والسائل والصلب باستخدام حقنة دون إبرة): تحليل\nالمخرج 2 (يفسر سهولة ضغط الغاز بالمسافات بين جزيئاته): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: حقن دون إبر، كوب ماء، حقنة فيها ماء مجمد مسبقًا في الثلاجة.", "الضغط، المكبس، الحقنة، المسافات بين الجزيئات، المليلتر.", "يعرض المعلم كرة منفوخة ويضغطها ثم حجرًا ويحاول ضغطه، ويسأل: لماذا انضغطت الكرة ولم ينضغط الحجر؟", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: ينفذ العرض.\n   دور الطالب: يتوقعون السبب.\n2) السلامة وقراءة التدريج (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يؤكد أن الحقن دون إبر، ويعرض قراءة التدريج بالمليلتر.\n   دور الطالب: يتدربون على قراءة 10 مل.\n3) ضغط الهواء (8 دقائق، من الدقيقة 10 إلى 18):\n   دور المعلم: يتابع.\n   دور الطالب: يسحبون الهواء حتى 10 مل ويغلقون الفوهة بالإبهام ويضغطون ويسجلون أقل قراءة.\n4) ضغط الماء (8 دقائق، من الدقيقة 18 إلى 26):\n   دور المعلم: يتابع.\n   دور الطالب: يسحبون 10 مل من الماء ويحاولون الضغط ويقارنون بالهواء.\n5) ضغط الثلج (6 دقائق، من الدقيقة 26 إلى 32):\n   دور المعلم: يعطي حقنة الماء المجمد المجهزة مسبقًا.\n   دور الطالب: يحاولون ضغط الثلج ويسجلون النتيجة.\n6) التفسير والغلق (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يربط بالنموذج.\n   دور الطالب: يستنتجون: الغاز سهل الضغط لأن بين جزيئاته مسافات، والسائل والصلب يصعب ضغطهما.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] أي مادة كانت أسهل في الضغط؟\n   الإجابة النموذجية: الهواء (الغاز).\n2) [المستوى المتوقع] هل استطعت ضغط الثلج؟\n   الإجابة النموذجية: لا.\n3) [المستوى المتقدم] لماذا يسهل ضغط الغاز؟\n   الإجابة النموذجية: لأن جزيئاته متباعدة بينها مسافات فارغة تتقارب عند الضغط.", "1) [مستوى الدعم] ما حالة المادة التي يصعب ضغطها؟\n   الإجابة النموذجية: الصلبة (والسائلة).\n2) [المستوى المتوقع] لماذا أغلقنا فوهة الحقنة بالإبهام؟\n   الإجابة النموذجية: حتى لا تخرج المادة فنقيس ضغطها فقط.\n3) [المستوى المتقدم] اذكر استخدامًا في الحياة لسهولة ضغط الغاز.\n   الإجابة النموذجية: ضغط الهواء في إطارات السيارات والدراجات أو أسطوانات الغاز.", "إرشاد الطالب: إكمال ورقة العمل 3-3أ ص58–59. إرشاد ولي الأمر: ملاحظة نفخ إطار الدراجة مع ابنكم والحديث عن ضغط الهواء."]}, {"axis": "المادة الصلبة تحتفظ بشكلها (ورقة العمل 3-3ب والأسئلة)", "h": {"lesson": "3-3 كيف تختلف المواد الصلبة والسائلة والغازية؟", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "sb": "59", "ab": "60", "tg": "60–63", "n": "4 من 5", "axis": "المادة الصلبة تحتفظ بشكلها (ورقة العمل 3-3ب والأسئلة)"}, "f": ["1. يجهز تجربة تكوين بلورة الملح ويتوقع شكلها بعد النمو.\nمخرج تعليمي آخر (2): يفسر بالجزيئات احتفاظ الطوب بشكله وتجمع مياه الأمطار في الحفر.", "المخرج 1 (يجهز تجربة تكوين بلورة الملح ويتوقع شكلها بعد النمو): تطبيق\nالمخرج 2 (يفسر بالجزيئات احتفاظ الطوب بشكله وتجمع مياه الأمطار في الحفر): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على المشاريع", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: قطع ملح كبيرة، خيط قطني 10 سم، كوب زجاجي، ملح الطعام، قلم رصاص، ماء دافئ.", "البلورة، المحلول، الشكل الثابت، الطوب، البركة.", "يعرض المعلم قطعة ملح كبيرة بالعدسة ويسأل: ما شكلها؟ هل سيتغير شكلها إذا كبرت؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض قطعة الملح.\n   دور الطالب: يصفون الشكل المكعب ويتوقعون.\n2) تجهيز ورقة العمل 3-3ب (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يوجه ويؤكد عدم تذوق الملح، ويحدد مكانًا آمنًا وطالبًا مسؤولًا عن المتابعة اليومية.\n   دور الطالب: يربطون الخيط حول قطعة الملح، ويذيبون الملح في ثلث كوب ماء دافئ حتى لا يذوب المزيد، ويعلقون القطعة في المحلول بالقلم.\n3) السؤالان 2 و3 ص59 (12 دقائق، من الدقيقة 20 إلى 32):\n   دور المعلم: يناقش الطوب ومياه الأمطار.\n   دور الطالب: يفسرون: جزيئات الطوب متلاصقة فلا يتغير شكله، والمطر يجري ويأخذ شكل الحفرة.\n4) التحدي (4 دقائق، من الدقيقة 32 إلى 36):\n   دور المعلم: يطرح: لماذا يُحفظ الغاز في أسطوانات معدنية؟\n   دور الطالب: يجيبون: لسهولة تسربه وقابليته للاشتعال.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يرسمون قطعة الملح الآن ليقارنوها لاحقًا.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] لماذا لا نتذوق بلورات الملح في التجربة؟\n   الإجابة النموذجية: للسلامة، فقد تكون ملوثة ولا نتذوق شيئًا في المختبر.\n2) [المستوى المتوقع] لماذا لا يتغير شكل الطوب؟\n   الإجابة النموذجية: لأن جزيئاته متلاصقة لا تستطيع تغيير أماكنها.\n3) [المستوى المتقدم] ماذا تتوقع لشكل بلورة الملح بعد أن تكبر؟\n   الإجابة النموذجية: ستبقى بالشكل نفسه (مكعبة) لكن حجمها أكبر.", "1) [مستوى الدعم] ماذا يحدث لمياه الأمطار عندما تسقط في حفرة؟\n   الإجابة النموذجية: تأخذ شكل الحفرة وتكوّن بركة.\n2) [المستوى المتوقع] لماذا نتوقف عن إضافة الملح إلى الماء؟\n   الإجابة النموذجية: عندما لا يستطيع الماء إذابة المزيد.\n3) [المستوى المتقدم] لماذا يحفظ الغاز في أسطوانات معدنية محكمة؟\n   الإجابة النموذجية: لأنه يتسرب بسهولة وينتشر، وقد يكون قابلًا للاشتعال.", "إرشاد الطالب: متابعة بلورة الملح يوميًا ورسمها، والإجابة عن السؤالين 2 و3 ص59. إرشاد ولي الأمر: تنفيذ تجربة بلورة الملح في البيت بإشرافكم."]}, {"axis": "مقارنة خصائص الحالات الثلاث (تمرين 3-3)", "h": {"lesson": "3-3 كيف تختلف المواد الصلبة والسائلة والغازية؟", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "sb": "58–59", "ab": "34", "tg": "60–63", "n": "5 من 5", "axis": "مقارنة خصائص الحالات الثلاث (تمرين 3-3)"}, "f": ["1. يقارن بين خصائص المواد الصلبة والسائلة والغازية في جدول.\nمخرج تعليمي آخر (2): يحدد حالة المادة في حقنتي ل يأخذ شكل الإناء (نشاط 3-3أ)):\nيتحدى المعلم الطلاب: «أثبتوا لي بتجربة أن الماء ليس له شكل خاص به!» ويذكّر بحالات المادة.\n\nالحصة 2 (الغاز ينتشر في كل الاتجاهات (نشاط 3-3ب)):\nينفخ المعلم فقاعة صابون ويسأل: ماذا يوجد داخل الفقاعة؟ وأين يذهب عندما تنفجر؟\n\nالحصة 3 (ضغط المواد بالحقنة (ورقة العمل 3-3أ)):\nيعرض المعلم كرة منفوخة ويضغطها ثم حجرًا ويحاول ضغطه، ويسأل: لماذا انضغطت الكرة ولم ينضغط الحجر؟\n\nالحصة 4 (المادة الصلبة تحتفظ بشكلها (ورقة العمل 3-3ب والأسئلة)):\nيعرض المعلم قطعة ملح كبيرة بالعدسة ويسأل: ما شكلها؟ هل سيتغير شكلها إذا كبرت؟\n\nالحصة 5 (مقارنة خصائص الحالات الثلاث (تمرين 3-3)):\nيمسك المعلم الصلصال ويشكّله ثم يسأل: هل الصلصال صلب أم سائل؟ ثم يضغط الوسادة: لماذا تنضغط؟", "الحصة 1 (السائل يأخذ شكل الإناء (نشاط 3-3أ)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح التحدي.\n   دور الطالب: يقترحون أفكارًا.\n2) التخطيط في المجموعات (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يمنح 10 دقائق للتخطيط ويتنقل بين المجموعات.\n   دور الطالب: يحددون الأدوات والخطوات وكيفية تسجيل الملاحظات.\n3) عرض خطة (5 دقائق، من الدقيقة 15 إلى 20):\n   دور المعلم: يختار مجموعة تعرض خطتها.\n   دور الطالب: يناقشون الخطة ويحسنونها.\n4) تنفيذ نشاط 3-3أ (14 دقائق، من الدقيقة 20 إلى 34):\n   دور المعلم: يتابع التنفيذ.\n   دور الطالب: يسكبون الماء في أوانٍ مختلفة ويرسمون شكله في كل مرة، ثم يضعون المكعب الصلب في الأواني نفسها ويقارنون.\n5) الاستنتاج والغلق (6 دقائق، من الدقيقة 34 إلى 40):\n   دور المعلم: يربط النتيجة بنموذج الجزيئات.\n   دور الطالب: يستنتجون: السائل يأخذ شكل الإناء لأن جزيئاته تنزلق، والصلب يحتفظ بشكله.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (الغاز ينتشر في كل الاتجاهات (نشاط 3-3ب)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: ينفخ فقاعة ويطرح السؤالين.\n   دور الطالب: يتوقعون الإجابات.\n2) التوجيه (5 دقائق، من الدقيقة 5 إلى 10):\n   دور المعلم: يوزع حلقات النفخ ومحلول الصابون ويوضح قواعد اللعب الآمن.\n   دور الطالب: يستعدون في مجموعات.\n3) تنفيذ نشاط 3-3ب (12 دقائق، من الدقيقة 10 إلى 22):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: ينفخون الفقاعات ويلاحظون أشكالها وانفجارها.\n4) السؤال 1 ص59 (10 دقائق، من الدقيقة 22 إلى 32):\n   دور المعلم: يطلب رسم جزيئات الهواء داخل الفقاعة وبعد انفجارها.\n   دور الطالب: يرسمون جزيئات متقاربة نسبيًا داخل الفقاعة ومنتشرة بعد الانفجار.\n5) الغلق والتفسير (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يلخص: الغاز ينتشر في كل الاتجاهات ويملأ أي مكان.\n   دور الطالب: يجيبون عن أسئلة الختام.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (ضغط المواد بالحقنة (ورقة العمل 3-3أ)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: ينفذ العرض.\n   دور الطالب: يتوقعون السبب.\n2) السلامة وقراءة التدريج (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يؤكد أن الحقن دون إبر، ويعرض قراءة التدريج بالمليلتر.\n   دور الطالب: يتدربون على قراءة 10 مل.\n3) ضغط الهواء (8 دقائق، من الدقيقة 10 إلى 18):\n   دور المعلم: يتابع.\n   دور الطالب: يسحبون الهواء حتى 10 مل ويغلقون الفوهة بالإبهام ويضغطون ويسجلون أقل قراءة.\n4) ضغط الماء (8 دقائق، من الدقيقة 18 إلى 26):\n   دور المعلم: يتابع.\n   دور الطالب: يسحبون 10 مل من الماء ويحاولون الضغط ويقارنون بالهواء.\n5) ضغط الثلج (6 دقائق، من الدقيقة 26 إلى 32):\n   دور المعلم: يعطي حقنة الماء المجمد المجهزة مسبقًا.\n   دور الطالب: يحاولون ضغط الثلج ويسجلون النتيجة.\n6) التفسير والغلق (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يربط بالنموذج.\n   دور الطالب: يستنتجون: الغاز سهل الضغط لأن بين جزيئاته مسافات، والسائل والصلب يصعب ضغطهما.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (المادة الصلبة تحتفظ بشكلها (ورقة العمل 3-3ب والأسئلة)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض قطعة الملح.\n   دور الطالب: يصفون الشكل المكعب ويتوقعون.\n2) تجهيز ورقة العمل 3-3ب (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يوجه ويؤكد عدم تذوق الملح، ويحدد مكانًا آمنًا وطالبًا مسؤولًا عن المتابعة اليومية.\n   دور الطالب: يربطون الخيط حول قطعة الملح، ويذيبون الملح في ثلث كوب ماء دافئ حتى لا يذوب المزيد، ويعلقون القطعة في المحلول بالقلم.\n3) السؤالان 2 و3 ص59 (12 دقائق، من الدقيقة 20 إلى 32):\n   دور المعلم: يناقش الطوب ومياه الأمطار.\n   دور الطالب: يفسرون: جزيئات الطوب متلاصقة فلا يتغير شكله، والمطر يجري ويأخذ شكل الحفرة.\n4) التحدي (4 دقائق، من الدقيقة 32 إلى 36):\n   دور المعلم: يطرح: لماذا يُحفظ الغاز في أسطوانات معدنية؟\n   دور الطالب: يجيبون: لسهولة تسربه وقابليته للاشتعال.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يرسمون قطعة الملح الآن ليقارنوها لاحقًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (مقارنة خصائص الحالات الثلاث (تمرين 3-3)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصلصال والوسادة.\n   دور الطالب: يناقشون: الصلصال مركب من صلب وسائل، والوسادة فيها هواء.\n2) تمرين 3-3 (ص34) (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يوجه إلى الحقنتين أ وب، ويكلف المتقدمين بالسؤال 1(ب).\n   دور الطالب: يحددون: الحقنة أ فيها ماء (جزيئات متقاربة)، والحقنة ب فيها هواء (جزيئات قليلة متباعدة).\n3) جدول المقارنة (8 دقائق، من الدقيقة 17 إلى 25):\n   دور المعلم: يرسم جدولًا: الشكل، الضغط، الانتشار.\n   دور الطالب: يكملون الجدول للحالات الثلاث.\n4) مسابقة المجموعات (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشغّل مسابقة الدرس 3-3.\n   دور الطالب: يتنافسون في مجموعات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (السائل يأخذ شكل الإناء (نشاط 3-3أ)):\n1) [مستوى الدعم] ماذا حدث لشكل الماء عند سكبه في إناء آخر؟\n   الإجابة النموذجية: أخذ شكل الإناء الجديد.\n2) [المستوى المتوقع] هل تغير شكل المكعب الصلب؟\n   الإجابة النموذجية: لا، احتفظ بشكله.\n3) [المستوى المتقدم] فسّر بالجزيئات لماذا يأخذ السائل شكل الإناء.\n   الإجابة النموذجية: لأن جزيئاته متقاربة لكنها تنزلق على بعضها فتملأ شكل الإناء.\n\nالحصة 2 (الغاز ينتشر في كل الاتجاهات (نشاط 3-3ب)):\n1) [مستوى الدعم] ماذا يوجد داخل فقاعة الصابون؟\n   الإجابة النموذجية: الهواء.\n2) [المستوى المتوقع] ماذا يحدث للهواء عند انفجار الفقاعة؟\n   الإجابة النموذجية: ينتشر في كل الاتجاهات.\n3) [المستوى المتقدم] لماذا ينتشر الغاز ولا يبقى في مكانه؟\n   الإجابة النموذجية: لأن جزيئاته تتحرك بحرية وسرعة في كل الاتجاهات.\n\nالحصة 3 (ضغط المواد بالحقنة (ورقة العمل 3-3أ)):\n1) [مستوى الدعم] أي مادة كانت أسهل في الضغط؟\n   الإجابة النموذجية: الهواء (الغاز).\n2) [المستوى المتوقع] هل استطعت ضغط الثلج؟\n   الإجابة النموذجية: لا.\n3) [المستوى المتقدم] لماذا يسهل ضغط الغاز؟\n   الإجابة النموذجية: لأن جزيئاته متباعدة بينها مسافات فارغة تتقارب عند الضغط.\n\nالحصة 4 (المادة الصلبة تحتفظ بشكلها (ورقة العمل 3-3ب والأسئلة)):\n1) [مستوى الدعم] لماذا لا نتذوق بلورات الملح في التجربة؟\n   الإجابة النموذجية: للسلامة، فقد تكون ملوثة ولا نتذوق شيئًا في المختبر.\n2) [المستوى المتوقع] لماذا لا يتغير شكل الطوب؟\n   الإجابة النموذجية: لأن جزيئاته متلاصقة لا تستطيع تغيير أماكنها.\n3) [المستوى المتقدم] ماذا تتوقع لشكل بلورة الملح بعد أن تكبر؟\n   الإجابة النموذجية: ستبقى بالشكل نفسه (مكعبة) لكن حجمها أكبر.\n\nالحصة 5 (مقارنة خصائص الحالات الثلاث (تمرين 3-3)):\n1) [مستوى الدعم] أي حالة يسهل ضغطها؟\n   الإجابة النموذجية: الغازية.\n2) [المستوى المتوقع] في الحقنة التي جزيئاتها متباعدة وقليلة، ما المادة؟\n   الإجابة النموذجية: الهواء (غاز).\n3) [المستوى المتقدم] لماذا تنضغط الوسادة؟\n   الإجابة النموذجية: لأن فيها هواء بين أليافها يسهل ضغطه.", "الحصة 1 (السائل يأخذ شكل الإناء (نشاط 3-3أ)):\n1) [مستوى الدعم] اذكر أداتين استخدمتهما في التجربة.\n   الإجابة النموذجية: كوب وعلبة (أو صحن وقنينة ماء).\n2) [المستوى المتوقع] هل تغيرت كمية الماء عند نقله من إناء لآخر؟\n   الإجابة النموذجية: لا، بقيت الكمية نفسها وتغير الشكل فقط.\n3) [المستوى المتقدم] كيف تحسّن تجربتك لتكون أوضح؟\n   الإجابة النموذجية: استخدام أوانٍ شفافة بأشكال مختلفة جدًا وتلوين الماء.\n\nالحصة 2 (الغاز ينتشر في كل الاتجاهات (نشاط 3-3ب)):\n1) [مستوى الدعم] ما حالة الهواء؟\n   الإجابة النموذجية: غازية.\n2) [المستوى المتوقع] ارسم جزيئات الهواء بعد انفجار الفقاعة وصفها.\n   الإجابة النموذجية: جزيئات متباعدة جدًا منتشرة في كل مكان.\n3) [المستوى المتقدم] لماذا نشم رائحة العطر في الغرفة كلها بعد رشه في زاوية؟\n   الإجابة النموذجية: لأن جزيئات العطر الغازية تنتشر في كل الاتجاهات.\n\nالحصة 3 (ضغط المواد بالحقنة (ورقة العمل 3-3أ)):\n1) [مستوى الدعم] ما حالة المادة التي يصعب ضغطها؟\n   الإجابة النموذجية: الصلبة (والسائلة).\n2) [المستوى المتوقع] لماذا أغلقنا فوهة الحقنة بالإبهام؟\n   الإجابة النموذجية: حتى لا تخرج المادة فنقيس ضغطها فقط.\n3) [المستوى المتقدم] اذكر استخدامًا في الحياة لسهولة ضغط الغاز.\n   الإجابة النموذجية: ضغط الهواء في إطارات السيارات والدراجات أو أسطوانات الغاز.\n\nالحصة 4 (المادة الصلبة تحتفظ بشكلها (ورقة العمل 3-3ب والأسئلة)):\n1) [مستوى الدعم] ماذا يحدث لمياه الأمطار عندما تسقط في حفرة؟\n   الإجابة النموذجية: تأخذ شكل الحفرة وتكوّن بركة.\n2) [المستوى المتوقع] لماذا نتوقف عن إضافة الملح إلى الماء؟\n   الإجابة النموذجية: عندما لا يستطيع الماء إذابة المزيد.\n3) [المستوى المتقدم] لماذا يحفظ الغاز في أسطوانات معدنية محكمة؟\n   الإجابة النموذجية: لأنه يتسرب بسهولة وينتشر، وقد يكون قابلًا للاشتعال.\n\nالحصة 5 (مقارنة خصائص الحالات الثلاث (تمرين 3-3)):\n1) [مستوى الدعم] أي حالة تحتفظ بشكلها؟\n   الإجابة النموذجية: الصلبة.\n2) [المستوى المتوقع] أي حالة تنتشر في كل الاتجاهات؟\n   الإجابة النموذجية: الغازية.\n3) [المستوى المتقدم] صنّف الصلصال وبرّر.\n   الإجابة النموذجية: يتصرف كالصلب والسائل معًا لأنه مكوّن من مادة صلبة ممزوجة بسائل.", "الحصة 1 (السائل يأخذ شكل الإناء (نشاط 3-3أ)):\nإرشاد الطالب: قراءة ص58 وتجربة سكب الماء في أوانٍ مختلفة في البيت. إرشاد ولي الأمر: مساعدة ابنكم على تنفيذ التجربة في المطبخ وتسجيل ملاحظاته.\n\nالحصة 2 (الغاز ينتشر في كل الاتجاهات (نشاط 3-3ب)):\nإرشاد الطالب: الإجابة عن السؤال 1 ص59 بالرسم. إرشاد ولي الأمر: نفخ الفقاعات مع ابنكم ومناقشة ما يحدث للهواء داخلها.\n\nالحصة 3 (ضغط المواد بالحقنة (ورقة العمل 3-3أ)):\nإرشاد الطالب: إكمال ورقة العمل 3-3أ ص58–59. إرشاد ولي الأمر: ملاحظة نفخ إطار الدراجة مع ابنكم والحديث عن ضغط الهواء.\n\nالحصة 4 (المادة الصلبة تحتفظ بشكلها (ورقة العمل 3-3ب والأسئلة)):\nإرشاد الطالب: متابعة بلورة الملح يوميًا ورسمها، والإجابة عن السؤالين 2 و3 ص59. إرشاد ولي الأمر: تنفيذ تجربة بلورة الملح في البيت بإشرافكم.\n\nالحصة 5 (مقارنة خصائص الحالات الثلاث (تمرين 3-3)):\nإرشاد الطالب: إكمال تمرين 3-3 ص34 ومراجعة الدرس ص58–59. إرشاد ولي الأمر: مناقشة ابنكم في خصائص الحالات الثلاث بأمثلة من البيت."]}, {"id": "4-3", "title": "الانصهار والتجمّد والغليان", "unit": 3, "unitName": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "sb": "60–61", "ab": "35، ورقة العمل الداعمة للنشاط 4-3أ ص61 وورقة العمل 4-3 ص62", "tg": "63–65", "periods": [{"axis": "الانصهار والتجمد", "h": {"lesson": "4-3 الانصهار والتجمّد والغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "sb": "60", "ab": "—", "tg": "63–65", "n": "1 من 5", "axis": "الانصهار والتجمد"}, "f": ["1. يعرّف الانصهار بأنه تحول المادة من الحالة الصلبة إلى السائلة، والتجمد عكس الانصهار.\nمخرج تعليمي آخر (2): يحدد دور التسخين والتبريد في تغيير حالة المادة.", "المخرج 1 (يعرّف الانصهار بأنه تحول المادة من الحالة الصلبة إلى السائلة، والتجمد عكس الانصهار): تذكر\nالمخرج 2 (يحدد دور التسخين والتبريد في تغيير حالة المادة): فهم", "• التعلم بالاكتشاف\n• التعلم التشاركي\nاستراتيجيات أخرى: MM.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: مثلجات (آيس كريم) أو مكعب ثلج، صورة نافذة عليها جليد، مقطع مرئي قصير.", "الانصهار، التجمد، التسخين، التبريد، تغير الحالة.", "يضع المعلم مكعب ثلج في الشمس عند النافذة وآخر في الظل ويسأل: ماذا سيحدث لكل منهما؟ ولماذا؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض المكعبين ويطرح السؤال.\n   دور الطالب: يتوقعون انصهار مكعب الشمس أسرع.\n2) قراءة ص60 (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يعرض صورة المثلجات المنصهرة في الكتاب.\n   دور الطالب: يصفون ما حدث للمثلجات ولماذا.\n3) المفاهيم (10 دقائق، من الدقيقة 13 إلى 23):\n   دور المعلم: يعرّف الانصهار والتجمد ويرسم سهمين متعاكسين: صلب ⇄ سائل مع «تسخين» و«تبريد».\n   دور الطالب: يكتبون التعريفين ويكملون المخطط.\n4) أمثلة من الحياة (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يعرض مقطعًا عن تجمد الماء في الطقس البارد.\n   دور الطالب: يعددون أمثلة: صنع الثلج في الثلاجة، انصهار الشوكولاتة في الجيب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يعود إلى المكعبين.\n   دور الطالب: يقارنون ويؤكدون توقعهم.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى السائلة بالتسخين.\n2) [المستوى المتوقع] ما التجمد؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الصلبة بالتبريد.\n3) [المستوى المتقدم] لماذا انصهر مكعب الشمس أسرع؟\n   الإجابة النموذجية: لأنه اكتسب حرارة أكثر.", "1) [مستوى الدعم] ماذا يحدث للماء في الثلاجة (الفريزر)؟\n   الإجابة النموذجية: يتجمد ويصبح ثلجًا.\n2) [المستوى المتوقع] ما العملية العكسية للانصهار؟\n   الإجابة النموذجية: التجمد.\n3) [المستوى المتقدم] اذكر مثالًا من بيتك على الانصهار وآخر على التجمد.\n   الإجابة النموذجية: انصهار الزبدة في المقلاة، وتجمد الماء في قالب الثلج.", "إرشاد الطالب: قراءة ص60 وكتابة أمثلة على الانصهار والتجمد من البيت. إرشاد ولي الأمر: مراقبة تجمد الماء في قالب الثلج مع ابنكم."]}, {"axis": "من الثلج إلى الماء إلى البخار (نشاط 4-3أ)", "h": {"lesson": "4-3 الانصهار والتجمّد والغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "sb": "60", "ab": "61", "tg": "63–65", "n": "2 من 5", "axis": "من الثلج إلى الماء إلى البخار (نشاط 4-3أ)"}, "f": ["1. يلاحظ تحول الثلج إلى ماء بالتسخين ثم غليان الماء وتحوله إلى بخار.\nمخرج تعليمي آخر (2): يصف علامات الغليان (الفقاعات وتصاعد البخار).", "المخرج 1 (يلاحظ تحول الثلج إلى ماء بالتسخين ثم غليان الماء وتحوله إلى بخار): فهم\nالمخرج 2 (يصف علامات الغليان (الفقاعات وتصاعد البخار)): فهم", "• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التعاوني", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: 100 غ من الثلج، إناء أو مقلاة، سخان كهربائي (عرض يجريه المعلم).", "الانصهار، الغليان، البخار، الفقاعات، الحالة الغازية.", "يسأل المعلم: ماذا يحدث لو وضعنا الثلج على النار وتركناه طويلًا؟ ويطلب كتابة التوقع.", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح السؤال ويؤكد قواعد السلامة: الابتعاد عن الماء المغلي.\n   دور الطالب: يكتبون توقعاتهم.\n2) عرض انصهار الثلج (12 دقائق، من الدقيقة 4 إلى 16):\n   دور المعلم: يسخن الثلج أمام الصف بحيث يرى الجميع، ثم يرفع الإناء ويسأل عما لاحظوه.\n   دور الطالب: يلاحظون: الثلج (صلب) ← تسخين ← ماء (سائل).\n3) عرض الغليان (12 دقائق، من الدقيقة 16 إلى 28):\n   دور المعلم: يستمر في التسخين حتى الغليان ثم يطفئ السخان.\n   دور الطالب: يصفون الفقاعات وتصاعد البخار: ماء (سائل) ← تسخين ← بخار (غاز).\n4) ورقة العمل الداعمة للنشاط 4-3أ (8 دقائق، من الدقيقة 28 إلى 36):\n   دور المعلم: يوجه إلى الإجابة عن أسئلة الورقة.\n   دور الطالب: يجيبون: تتكوّن فقاعات، يتكوّن بخار ماء.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ماذا حدث للثلج عند تسخينه؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء.\n2) [المستوى المتوقع] ماذا لاحظت عند غليان الماء؟\n   الإجابة النموذجية: تكونت فقاعات وتصاعد البخار.\n3) [المستوى المتقدم] اكتب مخطط تغير الماء من سائل إلى غاز.\n   الإجابة النموذجية: الماء (سائل) ← التسخين ← بخار الماء (غاز).", "1) [مستوى الدعم] ما حالة بخار الماء؟\n   الإجابة النموذجية: غازية.\n2) [المستوى المتوقع] لماذا قام المعلم بالعرض بنفسه؟\n   الإجابة النموذجية: لأن الماء المغلي والبخار خطيران ويسببان الحروق.\n3) [المستوى المتقدم] فسّر بالجزيئات ما يحدث عند تسخين الثلج.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة فتتحرك أكثر وتبتعد قليلًا فيتحول الصلب إلى سائل.", "إرشاد الطالب: إكمال ورقة العمل الداعمة للنشاط 4-3أ ص61. إرشاد ولي الأمر: ملاحظة غليان الماء في المطبخ مع ابنكم من مسافة آمنة."]}, {"axis": "البخار يعود ماءً عند التبريد (نشاط 4-3ب)", "h": {"lesson": "4-3 الانصهار والتجمّد والغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "sb": "61", "ab": "—", "tg": "63–65", "n": "3 من 5", "axis": "البخار يعود ماءً عند التبريد (نشاط 4-3ب)"}, "f": ["1. يلاحظ تحول بخار الماء إلى قطرات ماء عند ملامسة سطح بارد.\nمخرج تعليمي آخر (2): يكمل مخططات تغير حالة الماء بالتسخين والتبريد.", "المخرج 1 (يلاحظ تحول بخار الماء إلى قطرات ماء عند ملامسة سطح بارد): فهم\nالمخرج 2 (يكمل مخططات تغير حالة الماء بالتسخين والتبريد): تطبيق", "• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بخار من إبريق كهربائي، لوح عاكس بارد (مرآة أو صينية لامعة أو لوح مغطى بورق ألمنيوم)، قفازات عازلة أو ملقط طويل، وعاء بلاستيكي، ثلاجة.", "بخار الماء، التبريد، القطرات، التكاثف.", "يسأل المعلم: لماذا تتكوّن قطرات ماء على غطاء قدر الطبخ من الداخل؟", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يقترحون تفسيرات.\n2) السلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يؤكد خطورة البخار وأن المعلم ينفذ العرض مستخدمًا القفازات العازلة أو الملقط.\n   دور الطالب: يحددون مسافة الأمان.\n3) عرض نشاط 4-3ب (12 دقائق، من الدقيقة 10 إلى 22):\n   دور المعلم: يمسك اللوح البارد فوق البخار ثم فوق الوعاء البلاستيكي.\n   دور الطالب: يلاحظون تكوّن قطرات الماء على اللوح وتساقطها في الوعاء.\n4) المخططات والأسئلة 1–3 ص61 (10 دقائق، من الدقيقة 22 إلى 32):\n   دور المعلم: يرسم المخططات على السبورة.\n   دور الطالب: يكتبون: البخار (غاز) ← التبريد ← الماء (سائل)، والماء (سائل) ← التبريد ← الثلج (صلب).\n5) الغلق (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يعود إلى سؤال غطاء القدر.\n   دور الطالب: يفسرون: البخار يلامس الغطاء البارد فيتحول إلى قطرات ماء.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ماذا تكوّن على اللوح البارد؟\n   الإجابة النموذجية: قطرات ماء.\n2) [المستوى المتوقع] لماذا تحول البخار إلى ماء؟\n   الإجابة النموذجية: لأنه برد عند ملامسة اللوح البارد.\n3) [المستوى المتقدم] ماذا يحدث للماء إذا بردناه كثيرًا؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج.", "1) [مستوى الدعم] ما حالة القطرات المتكونة؟\n   الإجابة النموذجية: سائلة.\n2) [المستوى المتوقع] لماذا تتكون قطرات على غطاء القدر من الداخل؟\n   الإجابة النموذجية: لأن البخار يبرد عند ملامسة الغطاء فيتحول إلى ماء.\n3) [المستوى المتقدم] ارسم مخططًا لدورة الماء بين الحالات الثلاث مع التسخين والتبريد.\n   الإجابة النموذجية: ثلج ⇄ ماء ⇄ بخار، التسخين نحو اليمين والتبريد نحو اليسار.", "إر حول إلى سائل.\n2) [المستوى المتوقع] ماذا حدث للشمع المنصهر بعد إطفاء الشمعة؟\n   الإجابة النموذجية: برد وتجمد وأصبح صلبًا.\n3) [المستوى المتقدم] صحّح: «الماء هو المادة الوحيدة التي تنصهر».\n   الإجابة النموذجية: كثير من المواد تنصهر بالتسخين مثل الشمع والشوكولاتة والزبدة والمعادن.", "1) [مستوى الدعم] ما الذي تصاعد عند إطفاء الشمعة؟\n   الإجابة النموذجية: دخان.\n2) [المستوى المتوقع] لماذا لا نلمس الشمعة بعد إطفائها مباشرة؟\n   الإجابة النموذجية: لأنها تبقى ساخنة وقد تحرقنا.\n3) [المستوى المتقدم] من أين تأتي الطاقة التي تجعل جزيئات الشمع تتحرك أكثر؟\n   الإجابة النموذجية: من التسخين (لهب الشمعة).", "إرشاد الطالب: إكمال ورقة العمل 4-3 ص62. إرشاد ولي الأمر: يمكن تكرار ملاحظة الشمعة في البيت تحت إشرافكم المباشر."]}, {"axis": "تغيرات الحالة في مواد مختلفة (تمرين 4-3)", "h": {"lesson": "4-3 الانصهار والتجمّد والغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "sb": "60–61", "ab": "35", "tg": "63–65", "n": "5 من 5", "axis": "تغيرات الحالة في مواد مختلفة (تمرين 4-3)"}, "f": ["1. يحدد التغير في حالة المادة وهل نتج عن تسخين أو تبريد.\nمخرج تعليمي آخر (2): يطبق مفاهيم الانصهار والتجمد والغليان على مواقف جديدة.", "المخرج 1 (يحدد التغير في حالة المادة وهل نتج عن تسخين أو تبريد): تطبيق\nالمخرج 2 (يطبق مفاهيم الانصهار والتجمد والغليان على مواقف جديدة): تطبيق", "• التعلم المبني على اللعب\n• التعلم التعاوني\n• التعلم الذاتي", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الانصهار، التجمد، الغليان، التسخين، التبريد.", "يعرض المعلم أربع صور: ماء يتجمد، ذهب منصهر، ماء يغلي، زبدة في مقلاة، ويسأل: ما المشترك بينها؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصور.\n   دور الطالب: يستنتجون أنها جميعًا تغيرات في حالة المادة.\n2) تمرين 4-3 (ص35) (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يوجه إلى إكمال الجدول.\n   دور الطالب: يكتبون لكل صورة: اسم المادة، التغير في الحالة، تسخين أم تبريد.\n3) التصحيح والمناقشة (8 دقائق، من الدقيقة 17 إلى 25
