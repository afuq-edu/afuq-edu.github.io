ور المعلم: يعرض صورة المثلجات المنصهرة في الكتاب.\n   دور الطالب: يصفون ما حدث للمثلجات ولماذا.\n3) المفاهيم (10 دقائق، من الدقيقة 13 إلى 23):\n   دور المعلم: يعرّف الانصهار والتجمد ويرسم سهمين متعاكسين: صلب ⇄ سائل مع «تسخين» و«تبريد».\n   دور الطالب: يكتبون التعريفين ويكملون المخطط.\n4) أمثلة من الحياة (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يعرض مقطعًا عن تجمد الماء في الطقس البارد.\n   دور الطالب: يعددون أمثلة: صنع الثلج في الثلاجة، انصهار الشوكولاتة في الجيب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يعود إلى المكعبين.\n   دور الطالب: يقارنون ويؤكدون توقعهم.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (من الثلج إلى الماء إلى البخار (نشاط 4-3أ)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح السؤال ويؤكد قواعد السلامة: الابتعاد عن الماء المغلي.\n   دور الطالب: يكتبون توقعاتهم.\n2) عرض انصهار الثلج (12 دقائق، من الدقيقة 4 إلى 16):\n   دور المعلم: يسخن الثلج أمام الصف بحيث يرى الجميع، ثم يرفع الإناء ويسأل عما لاحظوه.\n   دور الطالب: يلاحظون: الثلج (صلب) ← تسخين ← ماء (سائل).\n3) عرض الغليان (12 دقائق، من الدقيقة 16 إلى 28):\n   دور المعلم: يستمر في التسخين حتى الغليان ثم يطفئ السخان.\n   دور الطالب: يصفون الفقاعات وتصاعد البخار: ماء (سائل) ← تسخين ← بخار (غاز).\n4) ورقة العمل الداعمة للنشاط 4-3أ (8 دقائق، من الدقيقة 28 إلى 36):\n   دور المعلم: يوجه إلى الإجابة عن أسئلة الورقة.\n   دور الطالب: يجيبون: تتكوّن فقاعات، يتكوّن بخار ماء.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (البخار يعود ماءً عند التبريد (نشاط 4-3ب)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يقترحون تفسيرات.\n2) السلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يؤكد خطورة البخار وأن المعلم ينفذ العرض مستخدمًا القفازات العازلة أو الملقط.\n   دور الطالب: يحددون مسافة الأمان.\n3) عرض نشاط 4-3ب (12 دقائق، من الدقيقة 10 إلى 22):\n   دور المعلم: يمسك اللوح البارد فوق البخار ثم فوق الوعاء البلاستيكي.\n   دور الطالب: يلاحظون تكوّن قطرات الماء على اللوح وتساقطها في الوعاء.\n4) المخططات والأسئلة 1–3 ص61 (10 دقائق، من الدقيقة 22 إلى 32):\n   دور المعلم: يرسم المخططات على السبورة.\n   دور الطالب: يكتبون: البخار (غاز) ← التبريد ← الماء (سائل)، والماء (سائل) ← التبريد ← الثلج (صلب).\n5) الغلق (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يعود إلى سؤال غطاء القدر.\n   دور الطالب: يفسرون: البخار يلامس الغطاء البارد فيتحول إلى قطرات ماء.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (انصهار الشمعة (ورقة العمل 4-3)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يذكرون أمثلة مثل الشوكولاتة والزبدة.\n2) السلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يؤكد عدم لمس الشمعة المشتعلة وأنها تبقى ساخنة بعد إطفائها، ويشعلها بنفسه.\n   دور الطالب: يكررون قواعد السلامة.\n3) ملاحظة الشمعة المضاءة (14 دقائق، من الدقيقة 10 إلى 24):\n   دور المعلم: يترك الشمعة تشتعل ويطرح أسئلة الورقة أثناء الانتظار.\n   دور الطالب: يلاحظون انصهار الشمع حول الفتيل ويكتبون: الشمع (صلب) ← تسخين ← شمع (سائل).\n4) بعد إطفاء الشمعة (8 دقائق، من الدقيقة 24 إلى 32):\n   دور المعلم: يطفئ الشمعة.\n   دور الطالب: يلاحظون الدخان وتجمد الشمع المنصهر ويحددون: سائل ← صلب بالتبريد.\n5) التفسير بالجزيئات والغلق (8 دقائق، من الدقيقة 32 إلى 40):\n   دور المعلم: يوضح أن التسخين يعطي الجزيئات طاقة فتتحرك وتتباعد، والتبريد يفقدها الطاقة فتتقارب.\n   دور الطالب: يجيبون عن أسئلة الختام.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (تغيرات الحالة في مواد مختلفة (تمرين 4-3)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصور.\n   دور الطالب: يستنتجون أنها جميعًا تغيرات في حالة المادة.\n2) تمرين 4-3 (ص35) (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يوجه إلى إكمال الجدول.\n   دور الطالب: يكتبون لكل صورة: اسم المادة، التغير في الحالة، تسخين أم تبريد.\n3) التصحيح والمناقشة (8 دقائق، من الدقيقة 17 إلى 25):\n   دور المعلم: يناقش: الماء سائل إلى صلب بالتبريد، الذهب صلب إلى سائل بالتسخين...\n   دور الطالب: يصححون ويبررون.\n4) مسابقة المجموعات (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشغّل مسابقة الدرس 4-3.\n   دور الطالب: يتنافسون في مجموعات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (الانصهار والتجمد):\n1) [مستوى الدعم] ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى السائلة بالتسخين.\n2) [المستوى المتوقع] ما التجمد؟\n   الإجابة النموذجية: تحول المادة من الحالة السائلة إلى الصلبة بالتبريد.\n3) [المستوى المتقدم] لماذا انصهر مكعب الشمس أسرع؟\n   الإجابة النموذجية: لأنه اكتسب حرارة أكثر.\n\nالحصة 2 (من الثلج إلى الماء إلى البخار (نشاط 4-3أ)):\n1) [مستوى الدعم] ماذا حدث للثلج عند تسخينه؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء.\n2) [المستوى المتوقع] ماذا لاحظت عند غليان الماء؟\n   الإجابة النموذجية: تكونت فقاعات وتصاعد البخار.\n3) [المستوى المتقدم] اكتب مخطط تغير الماء من سائل إلى غاز.\n   الإجابة النموذجية: الماء (سائل) ← التسخين ← بخار الماء (غاز).\n\nالحصة 3 (البخار يعود ماءً عند التبريد (نشاط 4-3ب)):\n1) [مستوى الدعم] ماذا تكوّن على اللوح البارد؟\n   الإجابة النموذجية: قطرات ماء.\n2) [المستوى المتوقع] لماذا تحول البخار إلى ماء؟\n   الإجابة النموذجية: لأنه برد عند ملامسة اللوح البارد.\n3) [المستوى المتقدم] ماذا يحدث للماء إذا بردناه كثيرًا؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج.\n\nالحصة 4 (انصهار الشمعة (ورقة العمل 4-3)):\n1) [مستوى الدعم] ماذا حدث للشمع قرب الفتيل؟\n   الإجابة النموذجية: انصهر وتحول إلى سائل.\n2) [المستوى المتوقع] ماذا حدث للشمع المنصهر بعد إطفاء الشمعة؟\n   الإجابة النموذجية: برد وتجمد وأصبح صلبًا.\n3) [المستوى المتقدم] صحّح: «الماء هو المادة الوحيدة التي تنصهر».\n   الإجابة النموذجية: كثير من المواد تنصهر بالتسخين مثل الشمع والشوكولاتة والزبدة والمعادن.\n\nالحصة 5 (تغيرات الحالة في مواد مختلفة (تمرين 4-3)):\n1) [مستوى الدعم] ما التغير الذي يحدث للذهب عند تسخينه بشدة؟\n   الإجابة النموذجية: ينصهر من الحالة الصلبة إلى السائلة.\n2) [المستوى المتوقع] هل تجمد الماء نتيجة تسخين أم تبريد؟\n   الإجابة النموذجية: تبريد.\n3) [المستوى المتقدم] صف التغير الذي يحدث للزبدة في المقلاة الساخنة.\n   الإجابة النموذجية: تنصهر من الحالة الصلبة إلى السائلة بالتسخين.", "الحصة 1 (الانصهار والتجمد):\n1) [مستوى الدعم] ماذا يحدث للماء في الثلاجة (الفريزر)؟\n   الإجابة النموذجية: يتجمد ويصبح ثلجًا.\n2) [المستوى المتوقع] ما العملية العكسية للانصهار؟\n   الإجابة النموذجية: التجمد.\n3) [المستوى المتقدم] اذكر مثالًا من بيتك على الانصهار وآخر على التجمد.\n   الإجابة النموذجية: انصهار الزبدة في المقلاة، وتجمد الماء في قالب الثلج.\n\nالحصة 2 (من الثلج إلى الماء إلى البخار (نشاط 4-3أ)):\n1) [مستوى الدعم] ما حالة بخار الماء؟\n   الإجابة النموذجية: غازية.\n2) [المستوى المتوقع] لماذا قام المعلم بالعرض بنفسه؟\n   الإجابة النموذجية: لأن الماء المغلي والبخار خطيران ويسببان الحروق.\n3) [المستوى المتقدم] فسّر بالجزيئات ما يحدث عند تسخين الثلج.\n   الإجابة النموذجية: تكتسب الجزيئات طاقة فتتحرك أكثر وتبتعد قليلًا فيتحول الصلب إلى سائل.\n\nالحصة 3 (البخار يعود ماءً عند التبريد (نشاط 4-3ب)):\n1) [مستوى الدعم] ما حالة القطرات المتكونة؟\n   الإجابة النموذجية: سائلة.\n2) [المستوى المتوقع] لماذا تتكون قطرات على غطاء القدر من الداخل؟\n   الإجابة النموذجية: لأن البخار يبرد عند ملامسة الغطاء فيتحول إلى ماء.\n3) [المستوى المتقدم] ارسم مخططًا لدورة الماء بين الحالات الثلاث مع التسخين والتبريد.\n   الإجابة النموذجية: ثلج ⇄ ماء ⇄ بخار، التسخين نحو اليمين والتبريد نحو اليسار.\n\nالحصة 4 (انصهار الشمعة (ورقة العمل 4-3)):\n1) [مستوى الدعم] ما الذي تصاعد عند إطفاء الشمعة؟\n   الإجابة النموذجية: دخان.\n2) [المستوى المتوقع] لماذا لا نلمس الشمعة بعد إطفائها مباشرة؟\n   الإجابة النموذجية: لأنها تبقى ساخنة وقد تحرقنا.\n3) [المستوى المتقدم] من أين تأتي الطاقة التي تجعل جزيئات الشمع تتحرك أكثر؟\n   الإجابة النموذجية: من التسخين (لهب الشمعة).\n\nالحصة 5 (تغيرات الحالة في مواد مختلفة (تمرين 4-3)):\n1) [مستوى الدعم] ماذا نسمي تحول الماء إلى بخار عند تسخينه بشدة؟\n   الإجابة النموذجية: الغليان.\n2) [المستوى المتوقع] هل تحتاج كل المواد إلى الحرارة نفسها لتنصهر؟\n   الإجابة النموذجية: لا، فالذهب يحتاج حرارة أعلى بكثير من الزبدة.\n3) [المستوى المتقدم] اقترح طريقة لإعادة الذهب المنصهر صلبًا بشكل خاتم.\n   الإجابة النموذجية: صبه في قالب بشكل خاتم وتركه يبرد فيتجمد.", "الحصة 1 (الانصهار والتجمد):\nإرشاد الطالب: قراءة ص60 وكتابة أمثلة على الانصهار والتجمد من البيت. إرشاد ولي الأمر: مراقبة تجمد الماء في قالب الثلج مع ابنكم.\n\nالحصة 2 (من الثلج إلى الماء إلى البخار (نشاط 4-3أ)):\nإرشاد الطالب: إكمال ورقة العمل الداعمة للنشاط 4-3أ ص61. إرشاد ولي الأمر: ملاحظة غليان الماء في المطبخ مع ابنكم من مسافة آمنة.\n\nالحصة 3 (البخار يعود ماءً عند التبريد (نشاط 4-3ب)):\nإرشاد الطالب: الإجابة عن الأسئلة 1–3 ص61. إرشاد ولي الأمر: ملاحظة قطرات الماء على غطاء القدر أو على كوب ماء بارد مع ابنكم.\n\nالحصة 4 (انصهار الشمعة (ورقة العمل 4-3)):\nإرشاد الطالب: إكمال ورقة العمل 4-3 ص62. إرشاد ولي الأمر: يمكن تكرار ملاحظة الشمعة في البيت تحت إشرافكم المباشر.\n\nالحصة 5 (تغيرات الحالة في مواد مختلفة (تمرين 4-3)):\nإرشاد الطالب: إكمال تمرين 4-3 ص35 ومراجعة الدرس ص60–61. إرشاد ولي الأمر: مناقشة تغيرات الحالة في المطبخ مع ابنكم أثناء الطهي."]}, {"id": "5-3", "title": "انصهار أنواع مختلفة من المواد الصلبة", "unit": 3, "unitName": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السادس عشر (20–24/12/2026)", "sb": "62–63", "ab": "36، ورقة العمل الداعمة للنشاط 5-3 ص63", "tg": "65–67", "periods": [{"axis": "مواد صلبة تنصهر من حولنا", "h": {"lesson": "5-3 انصهار أنواع مختلفة من المواد الصلبة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السادس عشر (20–24/12/2026)", "sb": "62", "ab": "—", "tg": "65–67", "n": "1 من 5", "axis": "مواد صلبة تنصهر من حولنا"}, "f": ["1. يعطي أمثلة لمواد صلبة تنصهر بالتسخين (الزبدة، المثلجات، السكر، المعادن، الصخور).\nمخرج تعليمي آخر (2): يوضح أن المعادن تنصهر عند تسخينها بشدة لفصلها عن الصخور.", "المخرج 1 (يعطي أمثلة لمواد صلبة تنصهر بالتسخين (الزبدة، المثلجات، السكر، المعادن، الصخور)): تذكر\nالمخرج 2 (يوضح أن المعادن تنصهر عند تسخينها بشدة لفصلها عن الصخور): فهم", "• التعلم بالاكتشاف\n• التعلم التشاركي\nاستراتيجيات أخرى: MM.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: مقطع مرئي عن البراكين وصهر المعادن.", "الانصهار، المعادن، الحمم البركانية، الصخور المنصهرة.", "يراجع المعلم انصهار الثلج والشمع، ثم يسأل: هل يمكن للحديد أن ينصهر؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يتوقعون ويبررون.\n2) أمثلة من البيت (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يجمع أمثلة: الزبدة، المثلجات، السكر الذي يذوب حتى يصير كراميل بالتسخين.\n   دور الطالب: يصنفون الأمثلة في جدول: المادة – ما يسبب انصهارها.\n3) صهر المعادن ص62 (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يعرض صور الكتاب ويوضح أن المعادن توجد مختلطة بالصخور فتُسخَّن بشدة حتى تنصهر وتنفصل.\n   دور الطالب: يقرؤون ويجيبون عن أسئلة الفهم.\n4) البراكين (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يعرض مقطعًا عن الحمم البركانية بوصفها صخورًا منصهرة تبرد فتتجمد.\n   دور الطالب: يصفون التغير: صخر صلب ← صخر منصهر ← صخر صلب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر مادتين صلبتين تنصهران بالتسخين.\n   الإجابة النموذجية: الزبدة والشوكولاتة (أو المثلجات، الشمع، المعادن).\n2) [المستوى المتوقع] ما الحمم البركانية؟\n   الإجابة النموذجية: صخور منصهرة تخرج من باطن الأرض.\n3) [المستوى المتقدم] لماذا تُسخَّن الصخور التي فيها معادن؟\n   الإجابة النموذجية: لينصهر المعدن وينفصل عن الصخر.", "1) [مستوى الدعم] هل المعادن القاسية يمكن أن تنصهر؟\n   الإجابة النموذجية: نعم، عند تسخينها بشدة.\n2) [المستوى المتوقع] ماذا يحدث للحمم عندما تبرد على سطح الأرض؟\n   الإجابة النموذجية: تتجمد وتتحول إلى صخور صلبة.\n3) [المستوى المتقدم] لماذا تحتاج المعادن إلى حرارة أعلى بكثير من الزبدة لتنصهر؟\n   الإجابة النموذجية: لأن المواد المختلفة تتكوّن من جزيئات مختلفة تحتاج إلى طاقة مختلفة للانصهار.", "إرشاد الطالب: قراءة ص62 وكتابة أمثلة لمواد تنصهر في المطبخ. إرشاد ولي الأمر: ملاحظة انصهار الزبدة أو السكر أثناء الطهي مع ابنكم."]}, {"axis": "تخطيط اختبار عادل للانصهار (نشاط 5-3)", "h": {"lesson": "5-3 انصهار أنواع مختلفة من المواد الصلبة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السادس عشر (20–24/12/2026)", "sb": "62", "ab": "—", "tg": "65–67", "n": "2 من 5", "axis": "تخطيط اختبار عادل للانصهار (نشاط 5-3)"}, "f": ["1. يخطط اختبارًا عادلًا لمقارنة مدة انصهار الثلج والشوكولاتة والزبدة.\nمخرج تعليمي آخر (2): يحدد المتغير الذي يغيّره والمتغيرات التي يبقيها ثابتة.", "المخرج 1 (يخطط اختبارًا عادلًا لمقارنة مدة انصهار الثلج والشوكولاتة والزبدة): إبداع\nالمخرج 2 (يحدد المتغير الذي يغيّره والمتغيرات التي يبقيها ثابتة): تحليل", "• التعلم المبني على حل المشكلات\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: بطاقات تخطيط الاستقصاء.", "الاختبار العادل، المتغير، الثابت، التوقع، مدة الانصهار.", "يعرض المعلم مكعب ثلج ومكعب شوكولاتة ومكعب زبدة بالحجم نفسه ويسأل: أيها سينصهر أولًا؟ ولماذا؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض المكعبات ويجمع التوقعات.\n   دور الطالب: يكتبون توقعاتهم مع التبرير.\n2) ما الذي نغيّره وما الذي نثبّته؟ (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يكتب على السبورة جدول: نغيّر / نقيس / نثبّت.\n   دور الطالب: يحددون: نغيّر نوع المادة، نقيس مدة الانصهار، نثبّت حجم المكعبات ودرجة حرارتها والأواني والسخانات ووقت البدء.\n3) كتابة الخطة (12 دقائق، من الدقيقة 17 إلى 29):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: يكتبون خطوات الاستقصاء وجدول تسجيل الوقت وقواعد السلامة.\n4) مراجعة الخطط (7 دقائق، من الدقيقة 29 إلى 36):\n   دور المعلم: يعرض خطة ويناقش الثغرات.\n   دور الطالب: يحسّنون خططهم.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما المتغير الذي سنغيره؟\n   الإجابة النموذجية: نوع المادة الصلبة.\n2) [المستوى المتوقع] اذكر شيئين يجب أن يبقيا ثابتين.\n   الإجابة النموذجية: حجم المكعبات ونوع السخان (أو الأواني ووقت البدء ودرجة الحرارة الابتدائية).\n3) [المستوى المتقدم] لماذا نحفظ المكعبات في الثلاجة قبل التجربة؟\n   الإجابة النموذجية: لتبدأ جميعها من درجة حرارة متساوية ولا تنصهر قبل البدء.", "1) [مستوى الدعم] ما الذي سنقيسه في التجربة؟\n   الإجابة النموذجية: الوقت حتى تنصهر كل مادة.\n2) [المستوى المتوقع] ما الأداة المناسبة لقياس الوقت؟\n   الإجابة النموذجية: ساعة الإيقاف.\n3) [المستوى المتقدم] ماذا يحدث لنتيجتنا لو استخدمنا قطعة زبدة أكبر من الثلج؟\n   الإجابة النموذجية: يصبح الاختبار غير عادل فلا نعرف هل الاختلاف بسبب نوع المادة أم حجمها.", "إرشاد الطالب: مراجعة خطة الاستقصاء ص62 وكتابة التوقع. إرشاد ولي الأمر: مناقشة ابنكم في معنى «الاختبار العادل» بمثال من الحياة."]}, {"axis": "تنفيذ استقصاء الانصهار (نشاط 5-3)", "h": {"lesson": "5-3 انصهار أنواع مختلفة من المواد الصلبة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السادس عشر (20–24/12/2026)", "sb": "63", "ab": "—", "tg": "65–67", "n": "3 من 5", "axis": "تنفيذ استقصاء الانصهار (نشاط 5-3)"}, "f": ["1. ينفذ الاستقصاء ويسجل الوقت اللازم لانصهار كل مادة.\nمخرج تعليمي آخر (2): يقارن النتائج بالتوقعات ويفسرها.", "المخرج 1 (ينفذ الاستقصاء ويسجل الوقت اللازم لانصهار كل مادة): تطبيق\nالمخرج 2 (يقارن النتائج بالتوقعات ويفسرها): تحليل", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: مكعبات ثلج وشوكولاتة وزبدة متطابقة الحجم محفوظة في الثلاجة، ثلاث مقالٍ متطابقة، ثلاثة سخانات متطابقة، ساعة إيقاف.", "مدة الانصهار، التسجيل، المقارنة، التكرار.", "يذكّر المعلم بالخطة ويسأل: ما توقعك؟ ثم يؤكد قواعد السلامة مع السخانات الكهربائية.", "1) التهيئة والسلامة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يراجع التوقعات وقواعد السلامة.\n   دور الطالب: يقرؤون توقعاتهم.\n2) التجهيز (4 دقائق، من الدقيقة 4 إلى 8):\n   دور المعلم: يتأكد من تطابق الأواني والسخانات ويوزع الأدوار (أو ينفذ عرضًا أمام الصف إن تعذر).\n   دور الطالب: يحددون المسؤول عن الساعة والمسجل.\n3) التنفيذ (16 دقائق، من الدقيقة 8 إلى 24):\n   دور المعلم: يبدأ التسخين للمواد في الوقت نفسه.\n   دور الطالب: يراقبون ويسجلون وقت بدء الانصهار وانتهائه لكل مادة.\n4) المقارنة بالتوقعات (10 دقائق، من الدقيقة 24 إلى 34):\n   دور المعلم: يجمع نتائج المجموعات في جدول على السبورة.\n   دور الطالب: يقارنون النتائج بالتوقعات ويفسرون الاختلاف بين المجموعات.\n5) الغلق (6 دقائق، من الدقيقة 34 إلى 40):\n   دور المعلم: يسأل: هل كان اختبارنا عادلًا تمامًا؟\n   دور الطالب: يناقشون مصادر الخطأ (الكميات، اختلاف حرارة السخانات).\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] أي مادة انصهرت أولًا في تجربتكم؟\n   الإجابة النموذجية: بحسب النتائج (غالبًا الزبدة أو الشوكولاتة قبل الثلج).\n2) [المستوى المتوقع] كيف تأكدنا أن التسخين بدأ في الوقت نفسه؟\n   الإجابة النموذجية: بدأنا تشغيل السخانات معًا وسجلنا وقت البدء.\n3) [المستوى المتقدم] لماذا اختلفت النتائج قليلًا بين المجموعات؟\n   الإجابة النموذجية: لصعوبة تطابق الكميات تمامًا أو اختلاف حرارة السخانات.", "1) [مستوى الدعم] هل احتاجت المواد الثلاث المدة نفسها للانصهار؟\n   الإجابة النموذجية: لا، كل مادة احتاجت مدة مختلفة.\n2) [المستوى المتوقع] ما فائدة تكرار التجربة؟\n   الإجابة النموذجية: التأكد من صحة النتائج.\n3) [المستوى المتقدم] اقترح تعديلًا يجعل النتائج أدق.\n   الإجابة النموذجية: وزن المواد لتكون الكميات متساوية تمامًا وتكرار التجربة أكثر من مرة.", "إرشاد الطالب: كتابة نتائج النشاط في جدول والإجابة عن السؤالين 1 و2 ص63. إرشاد ولي الأمر: سؤال ابنكم عن المادة التي انصهرت أولًا وتفسيره لذلك."]}, {"axis": "تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)", "h": {"lesson": "5-3 انصهار أنواع مختلفة من المواد الصلبة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السادس عشر (20–24/12/2026)", "sb": "62–63", "ab": "63", "tg": "65–67", "n": "4 من 5", "axis": "تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)"}, "f": ["1. يمثل مدة انصهار المواد بتمثيل بياني بالأعمدة بعنوان ومحاور مناسبة.\nمخرج تعليمي آخر (2): يقيّم تمثيلات زملائه البيانية وفق معايير محددة.", "المخرج 1 (يمثل مدة انصهار المواد بتمثيل بياني بالأعمدة بعنوان ومحاور مناسبة): تطبيق\nالمخرج 2 (يقيّم تمثيلات زملائه البيانية وفق معايير محددة): تقييم", "• التعلم الذاتي\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم بالأقران.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: مسطرة، أقلام تلوين.", "التمثيل البياني بالأعمدة، المحور الأفقي، المحور العمودي، العنوان، الثانية.", "يعرض المعلم جدول نتائج الحصة السابقة ويسأل: كيف نجعل المقارنة أوضح بنظرة واحدة؟", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض الجدول.\n   دور الطالب: يقترحون التمثيل بالأعمدة.\n2) معايير الرسم الجيد (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يعرض معايير التقييم: طول العمود دقيق، تسمية الأعمدة، الأعمدة بالعرض نفسه، وجود عنوان.\n   دور الطالب: يكتبون المعايير في دفاترهم.\n3) ورقة العمل الداعمة للنشاط 5-3 (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يتابع ويدعم.\n   دور الطالب: يرسمون الأعمدة: المحور الأفقي المواد، والعمودي مدة الانصهار بالثواني، ويضعون عنوانًا مثل: «مدة انصهار الثلج والشوكولاتة والزبدة».\n4) تقويم الأقران (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: ينظم تبادل الأوراق.\n   دور الطالب: يقيّمون رسوم زملائهم بالمعايير ويكتبون ملاحظة.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ماذا كتبت على المحور الأفقي؟\n   الإجابة النموذجية: أسماء المواد.\n2) [المستوى المتوقع] ماذا كتبت على المحور العمودي؟\n   الإجابة النموذجية: مدة الانصهار بالثواني.\n3) [المستوى المتقدم] ماذا يدل العمود الأطول في رسمك؟\n   الإجابة النموذجية: أن تلك المادة احتاجت أطول مدة لتنصهر.", "1) [مستوى الدعم] اقترح عنوانًا مناسبًا للرسم.\n   الإجابة النموذجية: مدة الانصهار لأنواع مختلفة من المواد الصلبة.\n2) [المستوى المتوقع] لماذا يجب أن تكون الأعمدة بالعرض نفسه؟\n   الإجابة النموذجية: لتكون المقارنة واضحة وعادلة.\n3) [المستوى المتقدم] قيّم رسمًا لا يحتوي على تسمية للأعمدة، واقترح تحسينًا.\n   الإجابة النموذجية: غير مكتمل لأن القارئ لا يعرف المادة التي يمثلها كل عمود، والتحسين بكتابة اسم المادة تحت كل عمود.", "إرشاد الطالب: إكمال ورقة العمل الداعمة للنشاط 5-3 ص63. إرشاد ولي الأمر: مراجعة دقة الرسم البياني مع ابنكم وفق المعايير."]}, {"axis": "تحليل نتائج الانصهار (تمرين 5-3)", "h": {"lesson": "5-3 انصهار أنواع مختلفة من المواد الصلبة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغا كمية نفسها والسخان نفسه (أو درجة الحرارة الابتدائية والمقلاة نفسها).", "1) [مستوى الدعم] هل تنصهر جميع المواد الصلبة في المدة نفسها؟\n   الإجابة النموذجية: لا.\n2) [المستوى المتوقع] لماذا تنصهر الشوكولاتة في يوم حار؟\n   الإجابة النموذجية: لأن حرارة الجو تكفي لانصهارها.\n3) [المستوى المتقدم] لماذا يجب أن تكون درجة حرارة المادتين متساوية عند البدء؟\n   الإجابة النموذجية: لأن المادة الأدفأ ستنصهر أسرع فيصبح الاختبار غير عادل.", "إرشاد الطالب: إكمال تمرين 5-3 ص36 والإجابة عن السؤالين 3 و4 ص63. إرشاد ولي الأمر: مناقشة ابنكم في سبب انصهار الشوكولاتة في الجو الحار."]}], "comb": ["الحصة 1 (مواد صلبة تنصهر من حولنا):\n1. يعطي أمثلة لمواد صلبة تنصهر بالتسخين (الزبدة، المثلجات، السكر، المعادن، الصخور).\nمخرج تعليمي آخر (2): يوضح أن المعادن تنصهر عند تسخينها بشدة لفصلها عن الصخور.\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\n1. يخطط اختبارًا عادلًا لمقارنة مدة انصهار الثلج والشوكولاتة والزبدة.\nمخرج تعليمي آخر (2): يحدد المتغير الذي يغيّره والمتغيرات التي يبقيها ثابتة.\n\nالحصة 3 (تنفيذ استقصاء الانصهار (نشاط 5-3)):\n1. ينفذ الاستقصاء ويسجل الوقت اللازم لانصهار كل مادة.\nمخرج تعليمي آخر (2): يقارن النتائج بالتوقعات ويفسرها.\n\nالحصة 4 (تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)):\n1. يمثل مدة انصهار المواد بتمثيل بياني بالأعمدة بعنوان ومحاور مناسبة.\nمخرج تعليمي آخر (2): يقيّم تمثيلات زملائه البيانية وفق معايير محددة.\n\nالحصة 5 (تحليل نتائج الانصهار (تمرين 5-3)):\n1. يقارن بين مواد مختلفة من حيث سهولة انصهارها اعتمادًا على البيانات.\nمخرج تعليمي آخر (2): يصمم اختبارًا عادلًا للمقارنة بين انصهار السمن والزبدة.", "الحصة 1 (مواد صلبة تنصهر من حولنا):\nالمخرج 1 (يعطي أمثلة لمواد صلبة تنصهر بالتسخين (الزبدة، المثلجات، السكر، المعادن، الصخور)): تذكر\nالمخرج 2 (يوضح أن المعادن تنصهر عند تسخينها بشدة لفصلها عن الصخور): فهم\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\nالمخرج 1 (يخطط اختبارًا عادلًا لمقارنة مدة انصهار الثلج والشوكولاتة والزبدة): إبداع\nالمخرج 2 (يحدد المتغير الذي يغيّره والمتغيرات التي يبقيها ثابتة): تحليل\n\nالحصة 3 (تنفيذ استقصاء الانصهار (ن لبة تنصهر من حولنا):\nالانصهار، المعادن، الحمم البركانية، الصخور المنصهرة.\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\nالاختبار العادل، المتغير، الثابت، التوقع، مدة الانصهار.\n\nالحصة 3 (تنفيذ استقصاء الانصهار (نشاط 5-3)):\nمدة الانصهار، التسجيل، المقارنة، التكرار.\n\nالحصة 4 (تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)):\nالتمثيل البياني بالأعمدة، المحور الأفقي، المحور العمودي، العنوان، الثانية.\n\nالحصة 5 (تحليل نتائج الانصهار (تمرين 5-3)):\nالانصهار، المقارنة، البيانات، الاختبار العادل.", "الحصة 1 (مواد صلبة تنصهر من حولنا):\nيراجع المعلم انصهار الثلج والشمع، ثم يسأل: هل يمكن للحديد أن ينصهر؟\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\nيعرض المعلم مكعب ثلج ومكعب شوكولاتة ومكعب زبدة بالحجم نفسه ويسأل: أيها سينصهر أولًا؟ ولماذا؟\n\nالحصة 3 (تنفيذ استقصاء الانصهار (نشاط 5-3)):\nيذكّر المعلم بالخطة ويسأل: ما توقعك؟ ثم يؤكد قواعد السلامة مع السخانات الكهربائية.\n\nالحصة 4 (تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)):\nيعرض المعلم جدول نتائج الحصة السابقة ويسأل: كيف نجعل المقارنة أوضح بنظرة واحدة؟\n\nالحصة 5 (تحليل نتائج الانصهار (تمرين 5-3)):\nيسأل المعلم: لماذا تبقى الحلوى الصلبة في الجيب صلبة بينما تنصهر الشوكولاتة في يوم حار؟", "الحصة 1 (مواد صلبة تنصهر من حولنا):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يتوقعون ويبررون.\n2) أمثلة من البيت (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يجمع أمثلة: الزبدة، المثلجات، السكر الذي يذوب حتى يصير كراميل بالتسخين.\n   دور الطالب: يصنفون الأمثلة في جدول: المادة – ما يسبب انصهارها.\n3) صهر المعادن ص62 (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يعرض صور الكتاب ويوضح أن المعادن توجد مختلطة بالصخور فتُسخَّن بشدة حتى تنصهر وتنفصل.\n   دور الطالب: يقرؤون ويجيبون عن أسئلة الفهم.\n4) البراكين (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يعرض مقطعًا عن الحمم البركانية بوصفها صخورًا منصهرة تبرد فتتجمد.\n   دور الطالب: يصفون التغير: صخر صلب ← صخر منصهر ← صخر صلب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض المكعبات ويجمع التوقعات.\n   دور الطالب: يكتبون توقعاتهم مع التبرير.\n2) ما الذي نغيّره وما الذي نثبّته؟ (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يكتب على السبورة جدول: نغيّر / نقيس / نثبّت.\n   دور الطالب: يحددون: نغيّر نوع المادة، نقيس مدة الانصهار، نثبّت حجم المكعبات ودرجة حرارتها والأواني والسخانات ووقت البدء.\n3) كتابة الخطة (12 دقائق، من الدقيقة 17 إلى 29):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: يكتبون خطوات الاستقصاء وجدول تسجيل الوقت وقواعد السلامة.\n4) مراجعة الخطط (7 دقائق، من الدقيقة 29 إلى 36):\n   دور المعلم: يعرض خطة ويناقش الثغرات.\n   دور الطالب: يحسّنون خططهم.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (تنفيذ استقصاء الانصهار (نشاط 5-3)):\n1) التهيئة والسلامة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يراجع التوقعات وقواعد السلامة.\n   دور الطالب: يقرؤون توقعاتهم.\n2) التجهيز (4 دقائق، من الدقيقة 4 إلى 8):\n   دور المعلم: يتأكد من تطابق الأواني والسخانات ويوزع الأدوار (أو ينفذ عرضًا أمام الصف إن تعذر).\n   دور الطالب: يحددون المسؤول عن الساعة والمسجل.\n3) التنفيذ (16 دقائق، من الدقيقة 8 إلى 24):\n   دور المعلم: يبدأ التسخين للمواد في الوقت نفسه.\n   دور الطالب: يراقبون ويسجلون وقت بدء الانصهار وانتهائه لكل مادة.\n4) المقارنة بالتوقعات (10 دقائق، من الدقيقة 24 إلى 34):\n   دور المعلم: يجمع نتائج المجموعات في جدول على السبورة.\n   دور الطالب: يقارنون النتائج بالتوقعات ويفسرون الاختلاف بين المجموعات.\n5) الغلق (6 دقائق، من الدقيقة 34 إلى 40):\n   دور المعلم: يسأل: هل كان اختبارنا عادلًا تمامًا؟\n   دور الطالب: يناقشون مصادر الخطأ (الكميات، اختلاف حرارة السخانات).\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض الجدول.\n   دور الطالب: يقترحون التمثيل بالأعمدة.\n2) معايير الرسم الجيد (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يعرض معايير التقييم: طول العمود دقيق، تسمية الأعمدة، الأعمدة بالعرض نفسه، وجود عنوان.\n   دور الطالب: يكتبون المعايير في دفاترهم.\n3) ورقة العمل الداعمة للنشاط 5-3 (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يتابع ويدعم.\n   دور الطالب: يرسمون الأعمدة: المحور الأفقي المواد، والعمودي مدة الانصهار بالثواني، ويضعون عنوانًا مثل: «مدة انصهار الثلج والشوكولاتة والزبدة».\n4) تقويم الأقران (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: ينظم تبادل الأوراق.\n   دور الطالب: يقيّمون رسوم زملائهم بالمعايير ويكتبون ملاحظة.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (تحليل نتائج الانصهار (تمرين 5-3)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يربطون الإجابة باختلاف المواد.\n2) تمرين 5-3 (ص36) (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يوجه إلى تحليل البيانات.\n   دور الطالب: يعرّفون الانصهار، ويحددون المادة التي استغرقت أطول وأقصر مدة للانصهار.\n3) السؤالان 3 و4 ص63 (8 دقائق، من الدقيقة 17 إلى 25):\n   دور المعلم: يناقش ما يحدث عند الاستمرار في تسخين الماء الناتج.\n   دور الطالب: يجيبون: يستمر الماء في التسخين حتى يغلي ويتحول إلى بخار.\n4) مسابقة المجموعات (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشغّل مسابقة الدرس 5-3.\n   دور الطالب: يتنافسون في مجموعات.\n5) التحدي والغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطلب من المتقدمين كتابة شروط اختبار عادل بين السمن والزبدة.\n   دور الطالب: يكتبون: الكمية نفسها، درجة الحرارة الابتدائية نفسها، السخان والمقلاة نفسهما، الساعة نفسها.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (مواد صلبة تنصهر من حولنا):\n1) [مستوى الدعم] اذكر مادتين صلبتين تنصهران بالتسخين.\n   الإجابة النموذجية: الزبدة والشوكولاتة (أو المثلجات، الشمع، المعادن).\n2) [المستوى المتوقع] ما الحمم البركانية؟\n   الإجابة النموذجية: صخور منصهرة تخرج من باطن الأرض.\n3) [المستوى المتقدم] لماذا تُسخَّن الصخور التي فيها معادن؟\n   الإجابة النموذجية: لينصهر المعدن وينفصل عن الصخر.\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\n1) [مستوى الدعم] ما المتغير الذي سنغيره؟\n   الإجابة النموذجية: نوع المادة الصلبة.\n2) [المستوى المتوقع] اذكر شيئين يجب أن يبقيا ثابتين.\n   الإجابة النموذجية: حجم المكعبات ونوع السخان (أو الأواني ووقت البدء ودرجة الحرارة الابتدائية).\n3) [المستوى المتقدم] لماذا نحفظ المكعبات في الثلاجة قبل التجربة؟\n   الإجابة النموذجية: لتبدأ جميعها من درجة حرارة متساوية ولا تنصهر قبل البدء.\n\nالحصة 3 (تنفيذ استقصاء الانصهار (نشاط 5-3)):\n1) [مستوى الدعم] أي مادة انصهرت أولًا في تجربتكم؟\n   الإجابة النموذجية: بحسب النتائج (غالبًا الزبدة أو الشوكولاتة قبل الثلج).\n2) [المستوى المتوقع] كيف تأكدنا أن التسخين بدأ في الوقت نفسه؟\n   الإجابة النموذجية: بدأنا تشغيل السخانات معًا وسجلنا وقت البدء.\n3) [المستوى المتقدم] لماذا اختلفت النتائج قليلًا بين المجموعات؟\n   الإجابة النموذجية: لصعوبة تطابق الكميات تمامًا أو اختلاف حرارة السخانات.\n\nالحصة 4 (تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)):\n1) [مستوى الدعم] ماذا كتبت على المحور الأفقي؟\n   الإجابة النموذجية: أسماء المواد.\n2) [المستوى المتوقع] ماذا كتبت على المحور العمودي؟\n   الإجابة النموذجية: مدة الانصهار بالثواني.\n3) [المستوى المتقدم] ماذا يدل العمود الأطول في رسمك؟\n   الإجابة النموذجية: أن تلك المادة احتاجت أطول مدة لتنصهر.\n\nالحصة 5 (تحليل نتائج الانصهار (تمرين 5-3)):\n1) [مستوى الدعم] ما الانصهار؟\n   الإجابة النموذجية: تحول المادة من الحالة الصلبة إلى الحالة السائلة.\n2) [المستوى المتوقع] ماذا يحدث للماء الناتج من انصهار الثلج إذا استمر التسخين؟\n   الإجابة النموذجية: يسخن حتى يغلي ويتحول إلى بخار.\n3) [المستوى المتقدم] اذكر شرطين لاختبار عادل بين السمن والزبدة.\n   الإجابة النموذجية: الكمية نفسها والسخان نفسه (أو درجة الحرارة الابتدائية والمقلاة نفسها).", "الحصة 1 (مواد صلبة تنصهر من حولنا):\n1) [مستوى الدعم] هل المعادن القاسية يمكن أن تنصهر؟\n   الإجابة النموذجية: نعم، عند تسخينها بشدة.\n2) [المستوى المتوقع] ماذا يحدث للحمم عندما تبرد على سطح الأرض؟\n   الإجابة النموذجية: تتجمد وتتحول إلى صخور صلبة.\n3) [المستوى المتقدم] لماذا تحتاج المعادن إلى حرارة أعلى بكثير من الزبدة لتنصهر؟\n   الإجابة النموذجية: لأن المواد المختلفة تتكوّن من جزيئات مختلفة تحتاج إلى طاقة مختلفة للانصهار.\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\n1) [مستوى الدعم] ما الذي سنقيسه في التجربة؟\n   الإجابة النموذجية: الوقت حتى تنصهر كل مادة.\n2) [المستوى المتوقع] ما الأداة المناسبة لقياس الوقت؟\n   الإجابة النموذجية: ساعة الإيقاف.\n3) [المستوى المتقدم] ماذا يحدث لنتيجتنا لو استخدمنا قطعة زبدة أكبر من الثلج؟\n   الإجابة النموذجية: يصبح الاختبار غير عادل فلا نعرف هل الاختلاف بسبب نوع المادة أم حجمها.\n\nالحصة 3 (تنفيذ استقصاء الانصهار (نشاط 5-3)):\n1) [مستوى الدعم] هل احتاجت المواد الثلاث المدة نفسها للانصهار؟\n   الإجابة النموذجية: لا، كل مادة احتاجت مدة مختلفة.\n2) [المستوى المتوقع] ما فائدة تكرار التجربة؟\n   الإجابة النموذجية: التأكد من صحة النتائج.\n3) [المستوى المتقدم] اقترح تعديلًا يجعل النتائج أدق.\n   الإجابة النموذجية: وزن المواد لتكون الكميات متساوية تمامًا وتكرار التجربة أكثر من مرة.\n\nالحصة 4 (تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)):\n1) [مستوى الدعم] اقترح عنوانًا مناسبًا للرسم.\n   الإجابة النموذجية: مدة الانصهار لأنواع مختلفة من المواد الصلبة.\n2) [المستوى المتوقع] لماذا يجب أن تكون الأعمدة بالعرض نفسه؟\n   الإجابة النموذجية: لتكون المقارنة واضحة وعادلة.\n3) [المستوى المتقدم] قيّم رسمًا لا يحتوي على تسمية للأعمدة، واقترح تحسينًا.\n   الإجابة النموذجية: غير مكتمل لأن القارئ لا يعرف المادة التي يمثلها كل عمود، والتحسين بكتابة اسم المادة تحت كل عمود.\n\nالحصة 5 (تحليل نتائج الانصهار (تمرين 5-3)):\n1) [مستوى الدعم] هل تنصهر جميع المواد الصلبة في المدة نفسها؟\n   الإجابة النموذجية: لا.\n2) [المستوى المتوقع] لماذا تنصهر الشوكولاتة في يوم حار؟\n   الإجابة النموذجية: لأن حرارة الجو تكفي لانصهارها.\n3) [المستوى المتقدم] لماذا يجب أن تكون درجة حرارة المادتين متساوية عند البدء؟\n   الإجابة النموذجية: لأن المادة الأدفأ ستنصهر أسرع فيصبح الاختبار غير عادل.", "الحصة 1 (مواد صلبة تنصهر من حولنا):\nإرشاد الطالب: قراءة ص62 وكتابة أمثلة لمواد تنصهر في المطبخ. إرشاد ولي الأمر: ملاحظة انصهار الزبدة أو السكر أثناء الطهي مع ابنكم.\n\nالحصة 2 (تخطيط اختبار عادل للانصهار (نشاط 5-3)):\nإرشاد الطالب: مراجعة خطة الاستقصاء ص62 وكتابة التوقع. إرشاد ولي الأمر: مناقشة ابنكم في معنى «الاختبار العادل» بمثال من الحياة.\n\nالحصة 3 (تنفيذ استقصاء الانصهار (نشاط 5-3)):\nإرشاد الطالب: كتابة نتائج النشاط في جدول والإجابة عن السؤالين 1 و2 ص63. إرشاد ولي الأمر: سؤال ابنكم عن المادة التي انصهرت أولًا وتفسيره لذلك.\n\nالحصة 4 (تمثيل مدة الانصهار بالأعمدة (ورقة العمل الداعمة 5-3)):\nإرشاد الطالب: إكمال ورقة العمل الداعمة للنشاط 5-3 ص63. إرشاد ولي الأمر: مراجعة دقة الرسم البياني مع ابنكم وفق المعايير.\n\nالحصة 5 (تحليل نتائج الانصهار (تمرين 5-3)):\nإرشاد الطالب: إكمال تمرين 5-3 ص36 والإجابة عن السؤالين 3 و4 ص63. إرشاد ولي الأمر: مناقشة ابنكم في سبب انصهار الشوكولاتة في الجو الحار."]}, {"id": "6-3", "title": "درجات الانصهار ودرجات الغليان", "unit": 3, "unitName": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السابع عشر (27–30/12/2026)", "sb": "64–65", "ab": "37، ورقة العمل الداعمة للنشاط 6-3 ص64", "tg": "67–69", "periods": [{"axis": "ميزان الحرارة ودرجة الانصهار", "h": {"lesson": "6-3 درجات الانصهار ودرجات الغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السابع عشر (27–30/12/2026)", "sb": "64، 68", "ab": "—", "tg": "67–69", "n": "1 من 5", "axis": "ميزان الحرارة ودرجة الانصهار"}, "f": ["1. يعرّف درجة الانصهار بأنها درجة الحرارة التي تبدأ عندها المادة بالتحول من الحالة الصلبة إلى السائلة.\nمخرج تعليمي آخر (2): يقرأ ميزان الحرارة قراءة صحيحة بالدرجة السيليزية.", "المخرج 1 (يعرّف درجة الانصهار بأنها درجة الحرارة التي تبدأ عندها المادة بالتحول من الحالة الصلبة إلى السائلة): تذكر\nالمخرج 2 (يقرأ ميزان الحرارة قراءة صحيحة بالدرجة السيليزية): تطبيق", "• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم بالاكتشاف", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: موازين حرارة، صورة الذهب في الكتاب.", "درجة الحرارة، ميزان الحرارة، الدرجة السيليزية °س، درجة الانصهار.", "يعرض المعلم صورة الذهب المنصهر ص64 ويسأل: لماذا يحتاج صانعو الذهب إلى معرفة درجة الحرارة التي ينصهر عندها؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يقترحون: ليعرفوا كم يسخنونه.\n2) درجة الانصهار (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يعرّف درجة الانصهار ويوضح أن لكل مادة درجة انصهار خاصة بها.\n   دور الطالب: يكتبون التعريف.\n3) قراءة ميزان الحرارة (15 دقائق، من الدقيقة 13 إلى 28):\n   دور المعلم: يعرض طريقة القراءة من قسم مهارات الاستقصاء العلمي ص68: النظر بمستوى العين، قراءة أعلى السائل، الوحدة °س.\n   دور الطالب: يتدربون على قراءة موازين حقيقية ورسوم لموازين بقراءات مختلفة.\n4) قياس درجة حرارة الغرفة (7 دقائق، من الدقيقة 28 إلى 35):\n   دور المعلم: يطلب قياس درجة حرارة الغرفة.\n   دور الطالب: يقرؤون الميزان ويسجلون القراءة ويقارنونها.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما الأداة التي نقيس بها درجة الحرارة؟\n   الإجابة النموذجية: ميزان الحرارة.\n2) [المستوى المتوقع] ما وحدة قياس درجة الحرارة التي نستخدمها؟\n   الإجابة النموذجية: الدرجة السيليزية (°س).\n3) [المستوى المتقدم] ما درجة الانصهار؟\n   الإجابة النموذجية: درجة الحرارة التي تبدأ عندها المادة بالتحول من الحالة الصلبة إلى السائلة.", "1) [مستوى الدعم] كيف ننظر إلى ميزان الحرارة عند قراءته؟\n   الإجابة النموذجية: بمستوى العين.\n2) [المستوى المتوقع] هل لكل المواد درجة الانصهار نفسها؟\n   الإجابة النموذجية: لا، لكل مادة درجة انصهار خاصة بها.\n3) [المستوى المتقدم] لماذا يحتاج صانعو الحلي إلى معرفة درجة انصهار الذهب؟\n   الإجابة النموذجية: ليسخنوه إلى الدرجة المناسبة لصهره وتشكيله دون هدر للطاقة.", "إرشاد الطالب: قراءة ص64 وص68 (قراءة ميزان الحرارة). إرشاد ولي الأمر: قراءة ميزان حرارة في البيت مع ابنكم إن توفر."]}, {"axis": "درجة انصهار الثلج (نشاط 6-3)", "h": {"lesson": "6-3 درجات الانصهار ودرجات الغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السابع عشر (27–30/12/2026)", "sb": "65", "ab": "—", "tg": "67–69", "n": "2 من 5", "axis": "درجة انصهار الثلج (نشاط 6-3)"}, "f": ["1. يقيس درجة حرارة الماء عند درجة حرارة الغرفة ودرجة حرارة الثلج المنصهر.\nمخرج تعليمي آخر (2): يستنتج أن الثلج ينصهر عند نحو صفر °س.", "المخرج 1 (يقيس درجة حرارة الماء عند درجة حرارة الغرفة ودرجة حرارة الثلج المنصهر): تطبيق\nالمخرج 2 (يستنتج أن الثلج ينصهر عند نحو صفر °س): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: كوب ماء، مكعبات ثلج، موازين حرارة.", "درجة الانصهار، صفر درجة سيليزية، القياس، تكرار القياس.", "يسأل المعلم: هل درجة حرارة الثلج وهو ينصهر أعلى أم أقل من درجة حرارة الغرفة؟ توقّع رقمًا.", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يجمع التوقعات بالأرقام.\n   دور الطالب: يكتبون توقعاتهم.\n2) توزيع الأدوار (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يحدد في كل مجموعة: من يقيس، من يسجل، من يراقب الوقت.\n   دور الطالب: يجهزون جدول القياسات.\n3) قياس ماء الغرفة (8 دقائق، من الدقيقة 10 إلى 18):\n   دور المعلم: يتابع.\n   دور الطالب: يقيسون درجة حرارة ماء الكوب ويسجلونها.\n4) قياس الثلج المنصهر (12 دقائق، من الدقيقة 18 إلى 30):\n   دور المعلم: يطلب وضع الميزان بين مكعبات الثلج المنصهرة والانتظار حتى ثبات القراءة وتكرار القياس.\n   دور الطالب: يسجلون القراءة (نحو صفر °س) ويكررون.\n5) المقارنة (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يجمع نتائج المجموعات.\n   دور الطالب: يقارنون ويفسرون الفروق البسيطة.\n6) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] كم كانت درجة حرارة الماء في الغرفة تقريبًا؟\n   الإجابة النموذجية: نحو 25 °س (بحسب حرارة الغرفة).\n2) [المستوى المتوقع] عند أي درجة ينصهر الثلج؟\n   الإجابة النموذجية: نحو صفر °س.\n3) [المستوى المتقدم] لماذا كررنا القياس؟\n   الإجابة النموذجية: للتأكد من صحة القراءة.", "1) [مستوى الدعم] ما درجة انصهار الثلج؟\n   الإجابة النموذجية: صفر °س.\n2) [المستوى المتوقع] لماذا انتظرنا حتى تثبت قراءة الميزان؟\n   الإجابة النموذجية: لأن الميزان يحتاج وقتًا ليصل إلى حرارة المادة.\n3) [المستوى المتقدم] لماذا قد تختلف قراءات المجموعات قليلًا؟\n   الإجابة النموذجية: لصعوبة القراءة في الوقت المناسب أو اختلاف وضع الميزان.", "إرشاد الطالب: تسجيل قياسات نشاط 6-3 في الجدول والإجابة عن السؤال 1 ص65. إرشاد ولي الأمر: مناقشة ابنكم في معنى «صفر درجة سيليزية»."]}, {"axis": "درجة غليان الماء والسلامة", "h": {"lesson": "6-3 درجات الانصهار ودرجات الغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السابع عشر (27–30/12/2026)", "sb": "65", "ab": "—", "tg": "67–69", "n": "3 من 5", "axis": "درجة غليان الماء والسلامة"}, "f": ["1. يلاحظ أن الماء يغلي عند نحو 100 °س.\nمخرج تعليمي آخر (2): يطبق قواعد السلامة عند التعامل مع الماء المغلي والبخار.", "المخرج 1 (يلاحظ أن الماء يغلي عند نحو 100 °س): فهم\nالمخرج 2 (يطبق قواعد السلامة عند التعامل مع الماء المغلي والبخار): تطبيق", "• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التشاركي", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: سخان كهربائي، ماء، ميزان حرارة، ملقط لحمل الميزان (عرض يجريه المعلم).", "درجة الغليان، 100 °س، البخار، السلامة، الحروق.", "يسأل المعلم: لماذا يستخدم الطباخ القفاز عند حمل القدر المغلي؟ وما أخطر ما في القدر: الماء أم البخار؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤالين.\n   دور الطالب: يناقشون مخاطر الحروق.\n2) قواعد السلامة (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يكتب قواعد: الابتعاد عن البخار، استخدام الملقط لحمل الميزان، لا يلمس الطلاب الأجهزة الساخنة.\n   دور الطالب: يكررون القواعد ويحددون مسافة الأمان.\n3) عرض قياس الغليان (15 دقائق، من الدقيقة 11 إلى 26):\n   دور المعلم: يسخن الماء ويقيس حرارته على فترات حتى الغليان ويقرأ الطلاب معه.\n   دور الطالب: يسجلون القراءات حتى ثباتها عند نحو 100 °س.\n4) الأسئلة 3 و4 ص65 (8 دقائق، من الدقيقة 26 إلى 34):\n   دور المعلم: يناقش الإجابات.\n   دور الطالب: يجيبون: الثلج ينصهر عند صفر °س والماء يغلي عند 100 °س، والبخار خطير لأنه يسبب الحروق.\n5) الغلق (6 دقائق، من الدقيقة 34 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] عند أي درجة يغلي الماء؟\n   الإجابة النموذجية: نحو 100 °س.\n2) [المستوى المتوقع] لماذا استخدم المعلم ملقطًا لحمل الميزان؟\n   الإجابة النموذجية: لأن الماء المغلي والبخار يسببان الحروق.\n3) [المستوى المتقدم] لماذا قد تختلف القراءة قليلًا عن 100 °س؟\n   الإجابة النموذجية: لصعوبة القراءة في الوقت المناسب أثناء الغليان أو دقة الميزان.", "1) [مستوى الدعم] ما درجة غليان الماء؟\n   الإجابة النموذجية: 100 °س.\n2) [المستوى المتوقع] اذكر قاعدة سلامة عند التعامل مع الماء المغلي.\n   الإجابة النموذجية: الابتعاد عن البخار أو استخدام الملقط والقفازات.\n3) [المستوى المتقدم] لماذا تبقى درجة حرارة الماء ثابتة تقريبًا أثناء الغليان رغم استمرار التسخين؟\n   الإجابة النموذجية: لأن الطاقة تُستخدم في تحويل الماء إلى بخار.", "إرشاد الطالب: الإجابة عن السؤالين 3 و4 ص65. إرشاد ولي الأمر: تذكير ابنكم بقواعد السلامة في المطبخ عند غليان الماء."]}, {"axis": "تمثيل درجات الحرارة ودرجات انصهار المعادن (تمرين 6-3)", "h": {"lesson": "6-3 درجات الانصهار ودرجات الغليان", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع السابع عشر (27–30/12/2026)", "sb": "64–65", "ab": "37، 64", "tg": "67–69", "n": "4 من 5", "axis": "تمثيل درجات الحرارة ودرجات انصهار المعادن (تمرين 6-3)"}, "f": ["1. يمثل درجات الحرارة المقيسة (الغرفة، الانصهار، الغليان) بتمثيل بياني بالأعمدة.\nمخرج تعليمي آخر (2): يقرأ جدولًا لدرجات انصهار معادن ويرتبها ويقارن بينها.", "المخرج 1 (يمثل درجات الحرارة المقيسة (الغرفة، الانصهار، الغليان) بتمثيل بياني بالأعمدة): تطبيق\nالمخرج 2 (يقرأ جدولًا لدرجات انصهار معادن ويرتبها ويقارن بينها): تحليل", "• التعلم الذاتي\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم المتمايز.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: مسطرة، أقلام تلوين.", "التمثيل البياني بالأعمدة، درجة الانصهار، المعادن، الترتيب.", "يعرض المعلم صور ثلاثة معادن (ذهب، فضة، ألمنيوم) ويسأل: أيها في رأيك يحتاج إلى حرارة أعلى لينصهر؟", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض الصور ويجمع التوقعات.\n   دور الطالب: يتوقعون الترتيب.\n2) ورقة العمل الداعمة لحصة 1 (ميزان الحرارة ودرجة الانصهار):\nيعرض المعلم صورة الذهب المنصهر ص64 ويسأل: لماذا يحتاج صانعو الذهب إلى معرفة درجة الحرارة التي ينصهر عندها؟\n\nالحصة 2 (درجة انصهار الثلج (نشاط 6-3)):\nيسأل المعلم: هل درجة حرارة الثلج وهو ينصهر أعلى أم أقل من درجة حرارة الغرفة؟ توقّع رقمًا.\n\nالحصة 3 (درجة غليان الماء والسلامة):\nيسأل المعلم: لماذا يستخدم الطباخ القفاز عند حمل القدر المغلي؟ وما أخطر ما في القدر: الماء أم البخار؟\n\nالحصة 4 (تمثيل درجات الحرارة ودرجات انصهار المعادن (تمرين 6-3)):\nيعرض المعلم صور ثلاثة معادن (ذهب، فضة، ألمنيوم) ويسأل: أيها في رأيك يحتاج إلى حرارة أعلى لينصهر؟\n\nالحصة 5 (مراجعة الوحدة الثالثة: حالات المادة وتغيراتها):\nيعرض المعلم مخططًا ناقصًا: ثلج ⇄ ماء ⇄ بخار، ويطلب كتابة اسم كل تغير ودرجة الحرارة المرتبطة به.", "الحصة 1 (ميزان الحرارة ودرجة الانصهار):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يقترحون: ليعرفوا كم يسخنونه.\n2) درجة الانصهار (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يعرّف درجة الانصهار ويوضح أن لكل مادة درجة انصهار خاصة بها.\n   دور الطالب: يكتبون التعريف.\n3) قراءة ميزان الحرارة (15 دقائق، من الدقيقة 13 إلى 28):\n   دور المعلم: يعرض طريقة القراءة من قسم مهارات الاستقصاء العلمي ص68: النظر بمستوى العين، قراءة أعلى السائل، الوحدة °س.\n   دور الطالب: يتدربون على قراءة موازين حقيقية ورسوم لموازين بقراءات مختلفة.\n4) قياس درجة حرارة الغرفة (7 دقائق، من الدقيقة 28 إلى 35):\n   دور المعلم: يطلب قياس درجة حرارة الغرفة.\n   دور الطالب: يقرؤون الميزان ويسجلون القراءة ويقارنونها.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (درجة انصهار الثلج (نشاط 6-3)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يجمع التوقعات بالأرقام.\n   دور الطالب: يكتبون توقعاتهم.\n2) توزيع الأدوار (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يحدد في كل مجموعة: من يقيس، من يسجل، من يراقب الوقت.\n   دور الطالب: يجهزون جدول القياسات.\n3) قياس ماء الغرفة (8 دقائق، من الدقيقة 10 إلى 18):\n   دور المعلم: يتابع.\n   دور الطالب: يقيسون درجة حرارة ماء الكوب ويسجلونها.\n4) قياس الثلج المنصهر (12 دقائق، من الدقيقة 18 إلى 30):\n   دور المعلم: يطلب وضع الميزان بين مكعبات الثلج المنصهرة والانتظار حتى ثبات القراءة وتكرار القياس.\n   دور الطالب: يسجلون القراءة (نحو صفر °س) ويكررون.\n5) المقارنة (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يجمع نتائج المجموعات.\n   دور الطالب: يقارنون ويفسرون الفروق البسيطة.\n6) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (درجة غليان الماء والسلامة):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤالين.\n   دور الطالب: يناقشون مخاطر الحروق.\n2) قواعد السلامة (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يكتب قواعد: الابتعاد عن البخار، استخدام الملقط لحمل الميزان، لا يلمس الطلاب الأجهزة الساخنة.\n   دور الطالب: يكررون القواعد ويحددون مسافة الأمان.\n3) عرض قياس الغليان (15 دقائق، من الدقيقة 11 إلى 26):\n   دور المعلم: يسخن الماء ويقيس حرارته على فترات حتى الغليان ويقرأ الطلاب معه.\n   دور الطالب: يسجلون القراءات حتى ثباتها عند نحو 100 °س.\n4) الأسئلة 3 و4 ص65 (8 دقائق، من الدقيقة 26 إلى 34):\n   دور المعلم: يناقش الإجابات.\n   دور الطالب: يجيبون: الثلج ينصهر عند صفر °س والماء يغلي عند 100 °س، والبخار خطير لأنه يسبب الحروق.\n5) الغلق (6 دقائق، من الدقيقة 34 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (تمثيل درجات الحرارة ودرجات انصهار المعادن (تمرين 6-3)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض الصور ويجمع التوقعات.\n   دور الطالب: يتوقعون الترتيب.\n2) ورقة العمل الداعمة للنشاط 6-3 (14 دقائق، من الدقيقة 4 إلى 18):\n   دور المعلم: يتابع الرسم.\n   دور الطالب: يرسمون أعمدة لدرجة حرارة الماء في الغرفة ودرجة الانصهار ودرجة الغليان، ويكتبون العنوان وعناوين المحاور (درجة الحرارة °س).\n3) تمرين 6-3 (ص37) (12 دقائق، من الدقيقة 18 إلى 30):\n   دور المعلم: يوجه إلى قراءة جدول المعادن.\n   دور الطالب: يعرّفون درجة الانصهار ويرتبون المعادن حسب درجات انصهارها ويحددون الأعلى والأدنى.\n4) مقارنة بالتوقعات (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يناقش الترتيب الصحيح.\n   دور الطالب: يقارنون بتوقعاتهم.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (مراجعة الوحدة الثالثة: حالات المادة وتغيراتها):\n1) التهيئة: المخطط (6 دقائق، من الدقيقة 0 إلى 6):\n   دور المعلم: يعرض المخطط الناقص.\n   دور الطالب: يكملون: انصهار عند صفر °س، تجمد، غليان عند 100 °س.\n2) ظواهر يومية (12 دقائق، من الدقيقة 6 إلى 18):\n   دور المعلم: يعرض مواقف: قطرات على كوب بارد، انصهار الشوكولاتة، تجمد الماء في الفريزر، غلي الماء للشاي.\n   دور الطالب: يفسرون كل ظاهرة باسم التغير وبحركة الجزيئات.\n3) مسابقة المجموعات (12 دقائق، من الدقيقة 18 إلى 30):\n   دور المعلم: يشغّل مسابقة الدرس 6-3.\n   دور الطالب: يتنافسون في مجموعات.\n4) التقييم الذاتي (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يقرأ عبارات «أستطيع» للوحدة.\n   دور الطالب: يحددون ما يحتاج إلى مراجعة.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (ميزان الحرارة ودرجة الانصهار):\n1) [مستوى الدعم] ما الأداة التي نقيس بها درجة الحرارة؟\n   الإجابة النموذجية: ميزان الحرارة.\n2) [المستوى المتوقع] ما وحدة قياس درجة الحرارة التي نستخدمها؟\n   الإجابة النموذجية: الدرجة السيليزية (°س).\n3) [المستوى المتقدم] ما درجة الانصهار؟\n   الإجابة النموذجية: درجة الحرارة التي تبدأ عندها المادة بالتحول من الحالة الصلبة إلى السائلة.\n\nالحصة 2 (درجة انصهار الثلج (نشاط 6-3)):\n1) [مستوى الدعم] كم كانت درجة حرارة الماء في الغرفة تقريبًا؟\n   الإجابة النموذجية: نحو 25 °س (بحسب حرارة الغرفة).\n2) [المستوى المتوقع] عند أي درجة ينصهر الثلج؟\n   الإجابة النموذجية: نحو صفر °س.\n3) [المستوى المتقدم] لماذا كررنا القياس؟\n   الإجابة النموذجية: للتأكد من صحة القراءة.\n\nالحصة 3 (درجة غليان الماء والسلامة):\n1) [مستوى الدعم] عند أي درجة يغلي الماء؟\n   الإجابة النموذجية: نحو 100 °س.\n2) [المستوى المتوقع] لماذا استخدم المعلم ملقطًا لحمل الميزان؟\n   الإجابة النموذجية: لأن الماء المغلي والبخار يسببان الحروق.\n3) [المستوى المتقدم] لماذا قد تختلف القراءة قليلًا عن 100 °س؟\n   الإجابة النموذجية: لصعوبة القراءة في الوقت المناسب أثناء الغليان أو دقة الميزان.\n\nالحصة 4 (تمثيل درجات الحرارة ودرجات انصهار المعادن (تمرين 6-3)):\n1) [مستوى الدعم] ما عنوان المحور العمودي في رسمك؟\n   الإجابة النموذجية: درجة الحرارة (°س).\n2) [المستوى المتوقع] أي عمود هو الأطول في رسمك؟\n   الإجابة النموذجية: عمود درجة الغليان.\n3) [المستوى المتقدم] كيف عرفت المعدن الأصعب انصهارًا من الجدول؟\n   الإجابة النموذجية: هو صاحب أعلى درجة انصهار.\n\nالحصة 5 (مراجعة الوحدة الثالثة: حالات المادة وتغيراتها):\n1) [مستوى الدعم] ما اسم تحول الماء إلى ثلج؟\n   الإجابة النموذجية: التجمد.\n2) [المستوى المتوقع] عند أي درجة يتجمد الماء؟\n   الإجابة النموذجية: صفر °س.\n3) [المستوى المتقدم] فسّر بالجزيئات تحول الماء إلى بخار.\n   الإجابة النموذجية: يكتسب الماء طاقة بالتسخين فتتحرك جزيئاته بسرعة وتتباعد كثيرًا فيتحول إلى غاز.", "الحصة 1 (ميزان الحرارة ودرجة الانصهار):\n1) [مستوى الدعم] كيف ننظر إلى ميزان الحرارة عند قراءته؟\n   الإجابة النموذجية: بمستوى العين.\n2) [المستوى المتوقع] هل لكل المواد درجة الانصهار نفسها؟\n   الإجابة النموذجية: لا، لكل مادة درجة انصهار خاصة بها.\n3) [المستوى المتقدم] لماذا يحتاج صانعو الحلي إلى معرفة درجة انصهار الذهب؟\n   الإجابة النموذجية: ليسخنوه إلى الدرجة المناسبة لصهره وتشكيله دون هدر للطاقة.\n\nالحصة 2 (درجة انصهار الثلج (نشاط 6-3)):\n1) [مستوى الدعم] ما درجة انصهار الثلج؟\n   الإجابة النموذجية: صفر °س.\n2) [المستوى المتوقع] لماذا انتظرنا حتى تثبت قراءة الميزان؟\n   الإجابة النموذجية: لأن الميزان يحتاج وقتًا ليصل إلى حرارة المادة.\n3) [المستوى المتقدم] لماذا قد تختلف قراءات المجموعات قليلًا؟\n   الإجابة النموذجية: لصعوبة القراءة في الوقت المناسب أو اختلاف وضع الميزان.\n\nالحصة 3 (درجة غليان الماء والسلامة):\n1) [مستوى الدعم] ما درجة غليان الماء؟\n   الإجابة النموذجية: 100 °س.\n2) [المستوى المتوقع] اذكر قاعدة سلامة عند التعامل مع الماء المغلي.\n   الإجابة النموذجية: الابتعاد عن البخار أو استخدام الملقط والقفازات.\n3) [المستوى المتقدم] لماذا تبقى درجة حرارة الماء ثابتة تقريبًا أثناء الغليان رغم استمرار التسخين؟\n   الإجابة النموذجية: لأن الطاقة تُستخدم في تحويل الماء إلى بخار.\n\nالحصة 4 (تمثيل درجات الحرارة ودرجات انصهار المعادن (تمرين 6-3)):\n1) [مستوى الدعم] أيهما أعلى: درجة انصهار الثلج أم درجة غليان الماء؟\n   الإجابة النموذجية: درجة غليان الماء.\n2) [المستوى المتوقع] أيهما ينصهر عند درجة أعلى: الذهب أم الألمنيوم؟\n   الإجابة النموذجية: الذهب.\n3) [المستوى المتقدم] لماذا يستفيد الصناع من معرفة درجات انصهار المعادن؟\n   الإجابة النموذجية: لاستخراج المعادن من خاماتها وصهرها وتشكيلها بالحرارة المناسبة.\n\nالحصة 5 (مراجعة الوحدة الثالثة: حالات المادة وتغيراتها):\n1) [مستوى الدعم] ما الفرق بين درجة الانصهار ودرجة الغليان؟\n   الإجابة النموذجية: درجة الانصهار للتحول من صلب إلى سائل، ودرجة الغليان للتحول من سائل إلى غاز.\n2) [المستوى المتوقع] لماذا تتكون قطرات على كوب ماء بارد؟\n   الإجابة النموذجية: لأن بخار الماء في الهواء يبرد عند ملامسة الكوب فيتحول إلى ماء.\n3) [المستوى المتقدم] اقترح طريقة لحفظ الشوكولاتة من الانصهار في رحلة صيفية، وفسّرها.\n   الإجابة النموذجية: حفظها في حافظة مبردة لإبقاء حرارتها أقل من درجة انصهارها.", "الحصة 1 (ميزان الحرارة ودرجة الانصهار):\nإرشاد الطالب: قراءة ص64 وص68 (قراءة ميزان الحرارة). إرشاد ولي الأمر: قراءة ميزان حرارة في البيت مع ابنكم إن توفر.\n\nالحصة 2 (درجة انصهار الثلج (نشاط 6-3)):\nإرشاد الطالب: تسجيل قياسات نشاط 6-3 في الجدول والإجابة عن السؤال 1 ص65. إرشاد ولي الأمر: مناقشة ابنكم في معنى «صفر درجة سيليزية».\n\nالحصة 3 (درجة غليان الماء والسلامة):\nإرشاد الطالب: الإجابة عن السؤالين 3 و4 ص65. إرشاد ولي الأمر: تذكير ابنكم بقواعد السلامة في المطبخ عند غليان الماء.\n\nالحصة 4 (تمثيل درجات الحرارة ودرجات انصهار المعادن (تمرين 6-3)):\nإرشاد الطالب: إكمال ورقة العمل الداعمة للنشاط 6-3 ص64 وتمرين 6-3 ص37. إرشاد ولي الأمر: متابعة دقة الرسم البياني لدى ابنكم.\n\nالحصة 5 (مراجعة الوحدة الثالثة: حالات المادة وتغيراتها):\nإرشاد الطالب: مراجعة الوحدة الثالثة ص54–65. إرشاد ولي الأمر: مناقشة ابنكم في ظواهر يومية لتغير حالة الماء."]}]};
let mode='sep',li=0,pi=0;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fillLessons(){
 const sel=$('#les');let g=null,cur=0;
 D.lessons.forEach((l,i)=>{ if(l.unit!==cur){g=document.createElement('optgroup');g.label=l.unitName;sel.appendChild(g);cur=l.unit;}
  const o=document.createElement('option');o.value=i;o.textContent=l.id+' '+l.title+' ('+l.periods.length+' حصص)';g.appendChild(o);});
 sel.onchange=()=>{li=+sel.value;pi=0;render();};
}
function ltr(s){return '<span dir="ltr">'+esc(s)+'</span>'}
function wk(w){const i=w.indexOf(' (');return esc(w.slice(0,i))+'، '+ltr(w.slice(i+2,-1));}
function render(){
 const L=D.lessons[li];document.body.className='u'+L.unit;
 $('#mSep').setAttribute('aria-pressed',mode==='sep');$('#mComb').setAttribute('aria-pressed',mode==='comb');
 $('#now').textContent= mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس';
 const tabs=$('#tabs');tabs.innerHTML='';tabs.style.display= mode==='sep'?'flex':'none';
 if(mode==='sep') L.periods.forEach((p,i)=>{const b=document.createElement('button');b.role='tab';b.textContent='الحصة '+(i+1);
   b.setAttribute('aria-selected',i===pi);b.title=p.axis;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});
 let info;
 if(mode==='sep'){const h=L.periods[pi].h;
  info=`<div class="t">${esc(h.lesson)}</div><div class="ax">الحصة ${h.n}: ${esc(h.axis)}</div>
  <div class="m"><span><b>الوحدة:</b> ${esc(h.unit)}</span><span><b>الأسبوع:</b> ${wk(h.week)}</span>
  <span><b>كتاب التلميذ:</b> ص ${esc(h.sb)}</span><span><b>كتاب النشاط:</b> ${h.ab==='—'?'لا يُستخدم في هذه الحصة':'ص '+esc(h.ab)}</span><span><b>دليل المعلم:</b> ص ${esc(h.tg)}</span></div>`;}
 else{info=`<div class="t">${esc(L.id+' '+L.title)}</div><div class="ax">نموذج مدمج لـ ${L.periods.length} حصص</div>
  <div class="m"><span><b>الوحدة:</b> ${esc(L.unitName)}</span><span><b>الأسبوع:</b> ${wk(L.week)}</span>
  <span><b>كتاب التلميذ:</b> ص ${esc(L.sb)}</span><span><b>كتاب النشاط:</b> ص ${esc(L.ab)}</span><span><b>دليل المعلم:</b> ص ${esc(L.tg)}</span></div>
  <div class="m" style="margin-top:4px">${L.periods.map((p,i)=>'<span><b>الحصة '+(i+1)+':</b> '+esc(p.axis)+'</span>').join('')}</div>`;}
 $('#info').innerHTML=info;
 const F= mode==='sep'? L.periods[pi].f : L.comb;
 $('#cards').innerHTML=D.names.map((n,k)=>`<section class="card"><header><span class="num">${k+1}</span><h2>${esc(n)}</h2>
  <button class="copy" data-k="${k}">نسخ</button></header><div class="txt" id="t${k}">${fmt(F[k])}</div><div class="hint" id="h${k}">لم يسمح المتصفح بالنسخ التلقائي: النص محدد الآن، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم «نسخ»).</div></section>`).join('');
 document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copy(+b.dataset.k,b,F));
}
function fmt(t){return esc(t).replace(/^(الحصة \d+ \(.*?\)):$/gm,'<span class="ph">$1:</span>');}
async function copy(k,btn,F){
 const text=F[k];let ok=false;
 try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;} }catch(e){}
 if(!ok){ const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);try{ok=document.execCommand('copy');}catch(e){ok=false;}ta.remove(); }
 if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
 else{const el=$('#t'+k),r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);$('#h'+k).classList.add('show');}
}
$('#mSep').onclick=()=>{mode='sep';render();};$('#mComb').onclick=()=>{mode='comb';render();};
fillLessons();render();
</script></body></html>
