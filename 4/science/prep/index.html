n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\n• التعلم المبني على اللعب\n• التعلم التعاوني\nاستراتيجيات أخرى: لعب الأدوار.", "الحصة 1 (أعراض المرض ودور الأدوية في العلاج):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات مفردات.\n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: أوراق ملونة لتصميم ملصق.", "الحصة 1 (أعراض المرض ودور الأدوية في العلاج):\nالأعراض، الحمى، الجراثيم، العلاج، الوصفة الطبية، الأنسولين، المضاد الحيوي.\n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\nالسلامة، الجرعة، الوصفة الطبية، تاريخ الصلاحية.", "الحصة 1 (أعراض المرض ودور الأدوية في العلاج):\nيسأل المعلم: كيف تعرف أنك مريض؟ ويكتب الأعراض التي يذكرها الطلاب على السبورة.\n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\nيمثّل المعلم مشهدًا قصيرًا: طالب يتناول دواء أخيه لأنه يشعر بالصداع، ثم يسأل: هل تصرّفه صحيح؟", "الحصة 1 (أعراض المرض ودور الأدوية في العلاج):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يجمع قائمة الأعراض.\n   دور الطالب: يذكرون علامات مثل الحمى والسعال والصداع.\n2) الأعراض والأسباب (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يوضح أن الأعراض علامات للمرض، وأن الجراثيم من أسباب الأمراض.\n   دور الطالب: يميزون بين العَرَض والسبب في أمثلة.\n3) كيف تعمل الأدوية؟ (10 دقائق، من الدقيقة 13 إلى 23):\n   دور المعلم: يشرح: بعض الأدوية تقضي على الجراثيم، وبعضها يعوّض الجسم عن مادة ناقصة كالأنسولين لمرضى السكري، ويصحح أن المضادات الحيوية لا تعالج الزكام الفيروسي.\n   دور الطالب: يقرؤون ص32 ويكملون مخططًا: الدواء – كيف يعمل.\n4) تمرين 6-1 السؤال 1 (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يوجه إلى ربط الكلمات بمعانيها ص21.\n   دور الطالب: يربطون المفردات ويتحقق الزملاء من الإجابات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون شفهيًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يمثل المشهد ويطرح السؤال.\n   دور الطالب: يحكمون على التصرف ويبررون.\n2) لعب الأدوار ص32 (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يوزع أدوار المشهد في الكتاب.\n   دور الطالب: يمثلون المواقف ويستخلصون قواعد السلامة.\n3) تنفيذ نشاط 6-1 (14 دقائق، من الدقيقة 13 إلى 27):\n   دور المعلم: يتابع المجموعات أثناء كتابة الملصق ويقيّم 3 درجات للمعلومات الصحيحة ودرجتين للترتيب والوضوح.\n   دور الطالب: يكتبون قواعد: تناول دواءك فقط، الكمية الموصوفة، في الوقت المحدد، للمدة التي حددها الطبيب، لا تتناول دواء منتهي الصلاحية، اطلب مساعدة البالغين.\n4) تمرين 6-1 السؤال 2 (7 دقائق، من الدقيقة 27 إلى 34):\n   دور المعلم: يوجّه إلى تحديد الأخطاء في المواقف.\n   دور الطالب: يحددون الخطأ والتصرف الصحيح.\n5) مسابقة الختام (6 دقائق، من الدقيقة 34 إلى 40):\n   دور المعلم: يشغّل المسابقة على الدرس.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (أعراض المرض ودور الأدوية في العلاج):\n1) [مستوى الدعم] ما الأعراض؟\n   الإجابة النموذجية: علامات تدل على المرض.\n2) [المستوى المتوقع] ما الجراثيم؟\n   الإجابة النموذجية: كائنات حية صغيرة جدًا قد تسبب المرض.\n3) [المستوى المتقدم] كيف يساعد الأنسولين مريض السكري؟\n   الإجابة النموذجية: يعوّض الجسم عن مادة لا يفرزها بكمية كافية.\n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\n1) [مستوى الدعم] اذكر قاعدة من قواعد تناول الدواء بأمان.\n   الإجابة النموذجية: تناول الدواء المخصص لك فقط (أو أي قاعدة صحيحة).\n2) [المستوى المتوقع] لماذا لا نتناول دواء شخص آخر؟\n   الإجابة النموذجية: لأنه قد لا يناسب مرضنا أو جسمنا فيضرنا.\n3) [المستوى المتقدم] ماذا تفعل إذا نسيت جرعة الدواء؟\n   الإجابة النموذجية: لا أضاعف الكمية، وأسأل البالغين أو الطبيب.", "الحصة 1 (أعراض المرض ودور الأدوية في العلاج):\n1) [مستوى الدعم] ما الحمى؟\n   الإجابة النموذجية: ارتفاع درجة حرارة الجسم.\n2) [المستوى المتوقع] هل يعالج المضاد الحيوي الزكام؟ فسّر.\n   الإجابة النموذجية: لا، لأن الزكام سببه فيروس، والمضاد الحيوي يعالج العدوى البكتيرية فقط.\n3) [المستوى المتقدم] قارن بين طريقتين تعمل بهما الأدوية.\n   الإجابة النموذجية: بعضها يقضي على الجراثيم المسببة للمرض، وبعضها يعوّض الجسم عن مادة ناقصة.\n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\n1) [مستوى الدعم] من يساعدنا عند تناول الدواء؟\n   الإجابة النموذجية: البالغون (الوالدان).\n2) [المستوى المتوقع] لماذا لا نتناول الدواء منتهي الصلاحية؟\n   الإجابة النموذجية: لأنه قد يفقد فاعليته أو يصبح ضارًا.\n3) [المستوى المتقدم] صمّم عبارة توعوية قصيرة عن الاستخدام الآمن للأدوية.\n   الإجابة النموذجية: مثال: «دواؤك لك وحدك.. بالكمية والوقت الذي يحدده الطبيب».", "الحصة 1 (أعراض المرض ودور الأدوية في العلاج):\nإرشاد الطالب: مراجعة ص32 وحل السؤال 1 من تمرين 6-1 ص21. إرشاد ولي الأمر: توضيح أن الطبيب وحده يقرر الدواء المناسب لكل مرض.\n\nالحصة 2 (تناول الأدوية بأمان (نشاط 6-1)):\nإرشاد الطالب: الإجابة عن السؤال 1 ص33 وإكمال تمرين 6-1 ص21. إرشاد ولي الأمر: مراجعة قواعد حفظ الأدوية وتناولها مع ابنكم."]}, {"id": "7-1", "title": "تحقق من تقدمك (الوحدة الأولى)", "unit": 1, "unitName": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الخامس (4–8/10/2026)", "sb": "34–35", "ab": "22 (المراجعة اللغوية)", "tg": "31–32", "periods": [{"axis": "مراجعة الهيكل العظمي والعضلات", "h": {"lesson": "7-1 تحقق من تقدمك (الوحدة الأولى)", "unit": "الوحدة الأولى: الإنسان والحيوان", "week": "الأسبوع الخامس (4–8/10/2026)", "sb": "34", "ab": "22", "tg": "31–32", "n": "1 من 2", "axis": "مراجعة الهيكل العظمي والعضلات"}, "f": ["1. يسترجع مفردات الوحدة: الهيكل العظمي، الفقرات، الجمجمة، اللافقاريات، العضلات.\nمخرج تعليمي آخر (2): يطبق معرفته بأشكال العظام وعمل العضلات في حل أسئلة المراجعة.", "المخرج 1 (يسترجع مفردات الوحدة: الهيكل العظمي، الفقرات، الجمجمة، اللافقاريات، العضلات): تذكر\nالمخرج 2 (يطبق معرفته بأشكال العظام وعمل العضلات في حل أسئلة المراجعة): تطبيق", "• التعلم الذاتي\n• التعلم المبني على اللعب\n• التعلم التعاوني", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات مفردات الوحدة.", "الهيكل العظمي، الفقرات، الجمجمة، اللافقاريات، العضلات، تنقبض، ترتخي.", "يبدأ المعلم بلعبة «أنا أصف وأنت تسمّي»: يصف عظمة أو عضلة ويسمّيها الطلاب بسرعة.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير لعبة الوصف ):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير لعبة الوصف والتسمية.\n   دور الطالب: يسمّون المفردات بسرعة.\n2) السؤالان 1 و2 ص34 (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يتابع العمل الفردي.\n   دور الطالب: يكملون الجمل بالمفردات ويعطون أمثلة لعظمة مسطحة وطويلة وصغيرة.\n3) السؤال 3 (10 دقائق، من الدقيقة 17 إلى 27):\n   دور المعلم: يعرض رسم الذراع ويطلب وصف عمل العضلة 1 عند الرفع.\n   دور الطالب: يكتبون: تنقبض العضلة وتقصر وتتضخم وتجذب العظم المتصل بها فيرتفع الساعد.\n4) المراجعة اللغوية ص22 (السؤال 1) (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يوجّه إلى تعريف المفردات.\n   دور الطالب: يربطون: الجمجمة عظام الرأس، الضلوع عظام الصدر، الفقرة عظمة من العمود الفقري...\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطلب تقييمًا ذاتيًا بإشارات المرور.\n   دور الطالب: يرفعون البطاقة المناسبة لمدى فهمهم لكل جزء.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (مراجعة النمو والأدوية):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يطرح سؤال المقارنة.\n   دور الطالب: يجيبون ويبررون بنمو العظام.\n2) السؤال 4 ص35 (12 دقائق، من الدقيقة 4 إلى 16):\n   دور المعلم: يوجه إلى بيانات سلمى وشيماء وحاتم.\n   دور الطالب: يحددون الأطول والأقصر، ويستنتجون أن العظام تنمو مع العمر، ويحددون أداة القياس وطريقة القياس العادل.\n3) السؤالان 5 و6 (8 دقائق، من الدقيقة 16 إلى 24):\n   دور المعلم: يناقش أهداف الأدوية وعبارات الصح والخطأ.\n   دور الطالب: يجيبون: الأدوية تشفي من المرض وتقي منه.\n4) المراجعة اللغوية (السؤال 2) (6 دقائق، من الدقيقة 24 إلى 30):\n   دور المعلم: يوجّه إلى إكمال الفقرة عن الأدوية.\n   دور الطالب: يكملون بالكلمات: الأدوية، تقينا، مسحوق، سائل متقطر.\n5) مسابقة المجموعات (10 دقائق، من الدقيقة 30 إلى 40):\n   دور المعلم: يشغّل مسابقة الدرس 7-1.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (مراجعة الهيكل العظمي والعضلات):\n1) [مستوى الدعم] ماذا نسمّي العظام الصغيرة في العمود الفقري؟\n   الإجابة النموذجية: الفقرات.\n2) [المستوى المتوقع] أعطِ مثالًا لعظمة مسطحة.\n   الإجابة النموذجية: لوح الكتف أو الجمجمة.\n3) [المستوى المتقدم] صف ما يحدث للعضلة 1 عند رفع الساعد.\n   الإجابة النموذجية: تنقبض وتقصر وتتضخم وتجذب العظم المتصل بها فيرتفع.\n\nالحصة 2 (مراجعة النمو والأدوية):\n1) [مستوى الدعم] ما الأداة المناسبة لقياس طول العظام؟\n   الإجابة النموذجية: المسطرة أو شريط القياس.\n2) [المستوى المتوقع] لماذا تكون عظام الراشد أطول من عظام الطفل؟\n   الإجابة النموذجية: لأن العظام تنمو مع العمر.\n3) [المستوى المتقدم] كيف نجعل قياس العظام عادلًا؟\n   الإجابة النموذجية: نستخدم الأداة نفسها ويقيس الشخص نفسه بالطريقة نفسها.", "الحصة 1 (مراجعة الهيكل العظمي والعضلات):\n1) [مستوى الدعم] ماذا نسمّي الحيوانات التي ليس لها عمود فقري؟\n   الإجابة النموذجية: اللافقاريات.\n2) [المستوى المتوقع] أعطِ مثالًا لعظمة طويلة وأخرى صغيرة.\n   الإجابة النموذجية: الفخذ (أو الساق أو الذراع)، وعظام الأصابع (أو الرسغ).\n3) [المستوى المتقدم] لماذا تحتاج الذراع إلى عضلتين لا عضلة واحدة؟\n   الإجابة النموذجية: لأن العضلة تجذب فقط، فتحتاج إلى عضلة ثانية تجذب الساعد في الاتجاه المعاكس.\n\nالحصة 2 (مراجعة النمو والأدوية):\n1) [مستوى الدعم] اذكر هدفين لاستخدام الأدوية.\n   الإجابة النموذجية: الشفاء من المرض والوقاية منه.\n2) [المستوى المتوقع] صحّح: «يمكن تناول الدواء دون إشراف البالغين».\n   الإجابة النموذجية: يجب تناول الدواء بإشراف البالغين ووفق الوصفة.\n3) [المستوى المتقدم] ما الطريقة الأنسب لعرض أطوال عظام ثلاثة أشخاص؟ ولماذا؟\n   الإجابة النموذجية: التمثيل البياني بالأعمدة لأنه يسهّل المقارنة بينهم.", "الحصة 1 (مراجعة الهيكل العظمي والعضلات):\nإرشاد الطالب: مراجعة ص22–29 من كتاب التلميذ وحل السؤال 1 من المراجعة اللغوية ص22. إرشاد ولي الأمر: الاستماع إلى ابنكم وهو يشرح مفردات الوحدة.\n\nالحصة 2 (مراجعة النمو والأدوية):\nإرشاد الطالب: إكمال المراجعة اللغوية ص22 ومراجعة الوحدة الأولى كاملة. إرشاد ولي الأمر: متابعة إنجاز ابنكم لأسئلة «تحقق من تقدمك» ص34–35."]}, {"id": "1-2", "title": "الطيور المدهشة", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الخامس (4–8/10/2026)", "sb": "36–37", "ab": "23، ورقتا العمل 1-2أ ص46 و1-2ب ص47", "tg": "35–37", "periods": [{"axis": "حاجات الحيوانات وتكيّف الطيور", "h": {"lesson": "1-2 الطيور المدهشة", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الخامس (4–8/10/2026)", "sb": "36", "ab": "—", "tg": "35–37", "n": "1 من 3", "axis": "حاجات الحيوانات وتكيّف الطيور"}, "f": ["1. يذكر حاجات الحيوانات الأساسية: الغذاء والماء والمأوى والدفء والهواء.\nمخرج تعليمي آخر (2): يوضح كيف يساعد شكل منقار الطائر في الحصول على غذائه.", "المخرج 1 (يذكر حاجات الحيوانات الأساسية: الغذاء والماء والمأوى والدفء والهواء): تذكر\nالمخرج 2 (يوضح كيف يساعد شكل منقار الطائر في الحصول على غذائه): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: أدوات تمثل المناقير: ملقط، مصاصة، ملعقة، كماشة صغيرة، وأطعمة تمثيلية (حبوب، ماء في كوب).", "الموطن، الحاجات، التكيف، المنقار.", "يسأل المعلم: ماذا يحتاج قطّك أو عصفورك لكي يعيش؟ ويسجّل الإجابات في خريطة ذهنية «حاجات الحيوان».", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يرسم الخريطة الذهنية.\n   دور الطالب: يذكرون الغذاء والماء والمأوى والدفء والهواء.\n2) الموطن (7 دقائق، من الدقيقة 5 إلى 12):\n   دور المعلم: يعرّف الموطن بأنه المكان الذي يعيش فيه الكائن ويجد فيه حاجاته، ويعرض فيديو قصيرًا عن الطيور ومواطنها.\n   دور الطالب: يذكرون أمثلة لمواطن طيور يعرفونها.\n3) محاكاة المناقير (15 دقائق، من الدقيقة 12 إلى 27):\n   دور المعلم: يوزع الأدوات على المجموعات، كل أداة تمثل منقارًا.\n   دور الطالب: يجربون التقاط الحبوب وشفط الماء بأدواتهم ويحددون أي منقار يناسب أي غذاء.\n4) قراءة ص36 والسؤال 1 (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يربط نتائج المحاكاة بصور المناقير في الكتاب.\n   دور الطالب: يجيبون: شكل المنقار يساعد الطائر في الحصول على غذائه، كالعصفور يفتح الحبوب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر ثلاثًا من حاجات الحيوان.\n   الإجابة النموذجية: الغذاء، الماء، المأوى (أو الدفء، الهواء).\n2) [المستوى المتوقع] ما الموطن؟\n   الإجابة النموذجية: المكان الذي يعيش فيه الكائن الحي ويجد فيه حاجاته.\n3) [المستوى المتقدم] أي أداة في المحاكاة تشبه منقار طائر يتغذى على رحيق الأزهار؟ ولماذا؟\n   الإجابة النموذجية: المصاصة؛ لأن المنقار الطويل الرفيع يصل إلى الرحيق داخل الزهرة.", "1) [مستوى الدعم] ما الذي يساعد الطائر على الحصول على غذائه؟\n   الإجابة النموذجية: شكل منقاره.\n2) [المستوى المتوقع] لماذا يملك العصفور منقارًا قصيرًا قويًا؟\n   الإجابة النموذجية: ليفتح الحبوب ويكسرها.\n3) [المستوى المتقدم] توقع شكل منقار طائر يتغذى على الأسماك في الماء الضحل.\n   الإجابة النموذجية: طويل يشبه الملعقة أو الرمح ليغرف السمك أو يلتقطه.", "إرشاد الطالب: قراءة ص36 والإجابة عن السؤال 1. إرشاد ولي الأمر: مراقبة طيور الحي مع ابنكم وملاحظة أشكال مناقيرها."]}, {"axis": "مشاهدة الطيور قرب المدرسة (نشاط 1-2)", "h": {"lesson": "1-2 الطيور المدهشة", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الخامس (4–8/10/2026)", "sb": "36", "ab": "46", "tg": "35–37", "n": "2 من 3", "axis": "مشاهدة الطيور قرب المدرسة (نشاط 1-2)"}, "f": ["1. يخطط لمشاهدة الطيور ويجمع ملاحظات عن لونها وحجمها وعددها وغذائها.\nمخرج تعليمي آخر (2): يقارن بين الطيور في مكانين مختلفين.", "المخرج 1 (يخطط لمشاهدة الطيور ويجمع ملاحظات عن لونها وحجمها وعددها وغذائها): تطبيق\nالمخرج 2 (يقارن بين الطيور في مكانين مختلفين): تحليل", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم الميداني.", "• الكتاب\n• الأقلام\n• صورة توضيحية\n• أخرى: ورقة العمل 1-2أ، حبوب وماء لجذب الطيور، منظار إن توفر.", "المشاهدة، الملاحظة، المقارنة، تسجيل البيانات.", "يسأل المعلم: كيف نشاهد الطيور دون أن نخيفها؟ ويستمع لاقتراحات الطلاب.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويسجّل قواعد المشاهدة الهادئة.\n   دور الطالب: يقترحون: الهدوء، الابتعاد، نثر الحبوب.\n2) التخطيط (7 دقائق، من الدقيقة 5 إلى 12):\n   دور المعلم: يوجه إلى ورقة العمل 1-2أ ويحدد أماكن المشاهدة (الملعب بعد الفسحة، الشجرة، الحديقة).\n   دور الطالب: يحددون ماذا سيلاحظون: اللون، الحجم، العدد، الغذاء، الوقت.\n3) المشاهدة الميدانية (18 دقائق، من الدقيقة 12 إلى 30):\n   دور المعلم: يرافق الطلاب في ساحة المدرسة مع مراعاة السلامة.\n   دور الطالب: يشاهدون الطيور بهدوء ويسجلون ملاحظاتهم ومدة المشاهدة وتوقيتها.\n4) المقارنة (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يطلب مقارنة ما شوهد في مكانين.\n   دور الطالب: يقارنون أعداد الطيور وأنواعها بين المكانين.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يسأل: لماذا وجدنا طيورًا أكثر في مكان دون آخر؟\n   دور الطالب: يقترحون تفسيرًا: وجود الطعام أو الماء أو الشجر.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ماذا سجلت عن الطيور التي شاهدتها؟\n   الإجابة النموذجية: اللون والحجم والعدد والغذاء (أي ملاحظة صحيحة).\n2) [المستوى المتوقع] لماذا يجب أن نكون هادئين أثناء المشاهدة؟\n   الإجابة النموذجية: حتى لا نخيف الطيور فتطير.\n3) [المستوى المتقدم] لماذا قد نجد طيورًا أكثر بعد الفسحة في الملعب؟\n   الإجابة النموذجية: لأن الملعب يخلو من الناس وتبقى فيه بقايا طعام.", "1) [مستوى الدعم] اذكر مكانًا ترى فيه الطيور في بيئتك.\n   الإجابة النموذجية: الشجرة أو الحديقة العامة أو البحر.\n2) [المستوى المتوقع] كيف جذبت الطيور دون إخافتها؟\n   الإجابة النموذجية: بنثر الحبوب ووضع الماء والابتعاد بهدوء.\n3) [المستوى المتقدم] اقترح طريقة لتحسين مشاهدة الطيور في المرة القادمة.\n   الإجابة النموذجية: المشاهدة في أوقات مختلفة من اليوم وتسجيل المدة، أو استخدام منظار.", "إرشاد الطالب: إكمال ورقة العمل 1-2أ ص46 بمشاهدة الطيور قرب البيت. إرشاد ولي الأمر: مرافقة ابنكم في مشاهدة الطيور ومساعدته في التسجيل."]}, {"axis": "تكيّف الطيور مع مواطنها (تمرين 1-2)", "h": {"lesson": "1-2 الطيور المدهشة", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الخامس (4–8/10/2026)", "sb": "37", "ab": "23، 47", "tg": "35–37", "n": "3 من 3", "axis": "تكيّف الطيور مع مواطنها (تمرين 1-2)"}, "f": ["1. يحدد صفات تساعد طيورًا مختلفة على العيش في مواطنها.\nمخرج تعليمي آخر (2): يفسر سبب صعوبة بقاء الطائر إذا تغير موطنه.", "المخرج 1 (يحدد صفات تساعد طيورًا مختلفة على العيش في مواطنها): فهم\nالمخرج 2 (يفسر سبب صعوبة بقاء الطائر إذا تغير موطنه): تحليل", "• التعلم التعاوني\n• التعل : ريش فاتح يعكس الحرارة، وقدرة على تخزين الماء أو أقدام عريضة للمشي على الرمل.", "إرشاد الطالب: إكمال تمرين 1-2 ص23 وورقة العمل 1-2ب ص47. إرشاد ولي الأمر: مشاهدة مقطع تعليمي عن الطيور مع ابنكم ومناقشة كيف تتكيف مع مواطنها."]}], "comb": ["الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\n1. يذكر حاجات الحيوانات الأساسية: الغذاء والماء والمأوى والدفء والهواء.\nمخرج تعليمي آخر (2): يوضح كيف يساعد شكل منقار الطائر في الحصول على غذائه.\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\n1. يخطط لمشاهدة الطيور ويجمع ملاحظات عن لونها وحجمها وعددها وغذائها.\nمخرج تعليمي آخر (2): يقارن بين الطيور في مكانين مختلفين.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\n1. يحدد صفات تساعد طيورًا مختلفة على العيش في مواطنها.\nمخرج تعليمي آخر (2): يفسر سبب صعوبة بقاء الطائر إذا تغير موطنه.", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\nالمخرج 1 (يذكر حاجات الحيوانات الأساسية: الغذاء والماء والمأوى والدفء والهواء): تذكر\nالمخرج 2 (يوضح كيف يساعد شكل منقار الطائر في الحصول على غذائه): فهم\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\nالمخرج 1 (يخطط لمشاهدة الطيور ويجمع ملاحظات عن لونها وحجمها وعددها وغذائها): تطبيق\nالمخرج 2 (يقارن بين الطيور في مكانين مختلفين): تحليل\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\nالمخرج 1 (يحدد صفات تساعد طيورًا مختلفة على العيش في مواطنها): فهم\nالمخرج 2 (يفسر سبب صعوبة بقاء الطائر إذا تغير موطنه): تحليل", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\n• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم الميداني.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\n• التعلم التعاوني\n• التعلم المبني على اللعب\n• التعلم بالاكتشاف", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: أدوات تمثل المناقير: ملقط، مصاصة، ملعقة، كماشة صغيرة، وأطعمة تمثيلية (حبوب، ماء في كوب).\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\n• الكتاب\n• الأقلام\n• صورة توضيحية\n• أخرى: ورقة العمل 1-2أ، حبوب وماء لجذب الطيور، منظار إن توفر.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: بطاقات صور طيور (البطة، الصقر، البطريق، الطائر الطنان، أبو ملعقة، النسر، النحام).", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\nالموطن، الحاجات، التكيف، المنقار.\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\nالمشاهدة، الملاحظة، المقارنة، تسجيل البيانات.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\nالتكيف، المخالب، البصر الحاد، الأقدام المسطحة، الدهن تحت الجلد.", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\nيسأل المعلم: ماذا يحتاج قطّك أو عصفورك لكي يعيش؟ ويسجّل الإجابات في خريطة ذهنية «حاجات الحيوان».\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\nيسأل المعلم: كيف نشاهد الطيور دون أن نخيفها؟ ويستمع لاقتراحات الطلاب.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\nيعرض المعلم صورتي صقر وبطة ويسأل: لو تبادلا المكان، هل يستطيع كل منهما العيش؟", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يرسم الخريطة الذهنية.\n   دور الطالب: يذكرون الغذاء والماء والمأوى والدفء والهواء.\n2) الموطن (7 دقائق، من الدقيقة 5 إلى 12):\n   دور المعلم: يعرّف الموطن بأنه المكان الذي يعيش فيه الكائن ويجد فيه حاجاته، ويعرض فيديو قصيرًا عن الطيور ومواطنها.\n   دور الطالب: يذكرون أمثلة لمواطن طيور يعرفونها.\n3) محاكاة المناقير (15 دقائق، من الدقيقة 12 إلى 27):\n   دور المعلم: يوزع الأدوات على المجموعات، كل أداة تمثل منقارًا.\n   دور الطالب: يجربون التقاط الحبوب وشفط الماء بأدواتهم ويحددون أي منقار يناسب أي غذاء.\n4) قراءة ص36 والسؤال 1 (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يربط نتائج المحاكاة بصور المناقير في الكتاب.\n   دور الطالب: يجيبون: شكل المنقار يساعد الطائر في الحصول على غذائه، كالعصفور يفتح الحبوب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويسجّل قواعد المشاهدة الهادئة.\n   دور الطالب: يقترحون: الهدوء، الابتعاد، نثر الحبوب.\n2) التخطيط (7 دقائق، من الدقيقة 5 إلى 12):\n   دور المعلم: يوجه إلى ورقة العمل 1-2أ ويحدد أماكن المشاهدة (الملعب بعد الفسحة، الشجرة، الحديقة).\n   دور الطالب: يحددون ماذا سيلاحظون: اللون، الحجم، العدد، الغذاء، الوقت.\n3) المشاهدة الميدانية (18 دقائق، من الدقيقة 12 إلى 30):\n   دور المعلم: يرافق الطلاب في ساحة المدرسة مع مراعاة السلامة.\n   دور الطالب: يشاهدون الطيور بهدوء ويسجلون ملاحظاتهم ومدة المشاهدة وتوقيتها.\n4) المقارنة (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يطلب مقارنة ما شوهد في مكانين.\n   دور الطالب: يقارنون أعداد الطيور وأنواعها بين المكانين.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يسأل: لماذا وجدنا طيورًا أكثر في مكان دون آخر؟\n   دور الطالب: يقترحون تفسيرًا: وجود الطعام أو الماء أو الشجر.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورتين ويطرح السؤال.\n   دور الطالب: يناقشون صفات كل طائر.\n2) صفات التكيف (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوضح: للصقر بصر حاد ومخالب وأجنحة سريعة، وللبطة أقدام مسطحة للسباحة.\n   دور الطالب: يجيبون عن السؤالين 2 و3 ص37.\n3) تمرين 1-2 (ص23) (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يوجه إلى مطابقة الطيور بصفاتها.\n   دور الطالب: يربطون: البطة – الأرجل المسطحة، الطائر الطنان – المنقار الطويل، البطريق – الدهن تحت الجلد، أبو ملعقة – المنقار الملعقي.\n4) ورقة العمل 1-2ب (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يوجه المتقدمين إلى وصف موطن البطريق والنسر والنحام والبجعة.\n   دور الطالب: يكتبون أين يعيش كل طائر وكيف يتغذى.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح سؤال الموطن المتغير.\n   دور الطالب: يستنتجون أن الطائر قد لا ينجو إذا اختفى غذاؤه من موطنه.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\n1) [مستوى الدعم] اذكر ثلاثًا من حاجات الحيوان.\n   الإجابة النموذجية: الغذاء، الماء، المأوى (أو الدفء، الهواء).\n2) [المستوى المتوقع] ما الموطن؟\n   الإجابة النموذجية: المكان الذي يعيش فيه الكائن الحي ويجد فيه حاجاته.\n3) [المستوى المتقدم] أي أداة في المحاكاة تشبه منقار طائر يتغذى على رحيق الأزهار؟ ولماذا؟\n   الإجابة النموذجية: المصاصة؛ لأن المنقار الطويل الرفيع يصل إلى الرحيق داخل الزهرة.\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\n1) [مستوى الدعم] ماذا سجلت عن الطيور التي شاهدتها؟\n   الإجابة النموذجية: اللون والحجم والعدد والغذاء (أي ملاحظة صحيحة).\n2) [المستوى المتوقع] لماذا يجب أن نكون هادئين أثناء المشاهدة؟\n   الإجابة النموذجية: حتى لا نخيف الطيور فتطير.\n3) [المستوى المتقدم] لماذا قد نجد طيورًا أكثر بعد الفسحة في الملعب؟\n   الإجابة النموذجية: لأن الملعب يخلو من الناس وتبقى فيه بقايا طعام.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\n1) [مستوى الدعم] ما الصفة التي تساعد البطة على السباحة؟\n   الإجابة النموذجية: الأقدام المسطحة.\n2) [المستوى المتوقع] كيف يساعد البصر الحاد الصقر؟\n   الإجابة النموذجية: على رؤية فريسته على الأرض وهو يطير عاليًا.\n3) [المستوى المتقدم] ماذا يحدث للطائر إذا ماتت النباتات التي يتغذى عليها في موطنه؟\n   الإجابة النموذجية: لن يستطيع النجاة إلا إذا وجد مصدرًا آخر للغذاء.", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\n1) [مستوى الدعم] ما الذي يساعد الطائر على الحصول على غذائه؟\n   الإجابة النموذجية: شكل منقاره.\n2) [المستوى المتوقع] لماذا يملك العصفور منقارًا قصيرًا قويًا؟\n   الإجابة النموذجية: ليفتح الحبوب ويكسرها.\n3) [المستوى المتقدم] توقع شكل منقار طائر يتغذى على الأسماك في الماء الضحل.\n   الإجابة النموذجية: طويل يشبه الملعقة أو الرمح ليغرف السمك أو يلتقطه.\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\n1) [مستوى الدعم] اذكر مكانًا ترى فيه الطيور في بيئتك.\n   الإجابة النموذجية: الشجرة أو الحديقة العامة أو البحر.\n2) [المستوى المتوقع] كيف جذبت الطيور دون إخافتها؟\n   الإجابة النموذجية: بنثر الحبوب ووضع الماء والابتعاد بهدوء.\n3) [المستوى المتقدم] اقترح طريقة لتحسين مشاهدة الطيور في المرة القادمة.\n   الإجابة النموذجية: المشاهدة في أوقات مختلفة من اليوم وتسجيل المدة، أو استخدام منظار.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\n1) [مستوى الدعم] ما فائدة الدهن تحت جلد البطريق؟\n   الإجابة النموذجية: يحافظ على دفء جسمه.\n2) [المستوى المتوقع] لماذا يملك الطائر الطنان منقارًا طويلًا رفيعًا؟\n   الإجابة النموذجية: ليحصل على رحيق الأزهار.\n3) [المستوى المتقدم] صمّم طائرًا خياليًا يعيش في الصحراء واذكر صفتين تساعدانه.\n   الإجابة النموذجية: إجابات متنوعة، مثل: ريش فاتح يعكس الحرارة، وقدرة على تخزين الماء أو أقدام عريضة للمشي على الرمل.", "الحصة 1 (حاجات الحيوانات وتكيّف الطيور):\nإرشاد الطالب: قراءة ص36 والإجابة عن السؤال 1. إرشاد ولي الأمر: مراقبة طيور الحي مع ابنكم وملاحظة أشكال مناقيرها.\n\nالحصة 2 (مشاهدة الطيور قرب المدرسة (نشاط 1-2)):\nإرشاد الطالب: إكمال ورقة العمل 1-2أ ص46 بمشاهدة الطيور قرب البيت. إرشاد ولي الأمر: مرافقة ابنكم في مشاهدة الطيور ومساعدته في التسجيل.\n\nالحصة 3 (تكيّف الطيور مع مواطنها (تمرين 1-2)):\nإرشاد الطالب: إكمال تمرين 1-2 ص23 وورقة العمل 1-2ب ص47. إرشاد ولي الأمر: مشاهدة مقطع تعليمي عن الطيور مع ابنكم ومناقشة كيف تتكيف مع مواطنها."]}, {"id": "2-2", "title": "موطن الحلزون", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السادس (11–15/10/2026)", "sb": "38–39", "ab": "24، ورقة العمل 2-2 ص49–50", "tg": "37–40", "periods": [{"axis": "ملاحظة الحلزون وتراكيب جسمه", "h": {"lesson": "2-2 موطن الحلزون", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السادس (11–15/10/2026)", "sb": "38", "ab": "—", "tg": "37–40", "n": "1 من 3", "axis": "ملاحظة الحلزون وتراكيب جسمه"}, "f": ["1. يلاحظ أجزاء جسم الحلزون (القوقعة، القدم العضلية، قرون الاستشعار، العينين) باستخدام العدسة المكبرة.\nمخرج تعليمي آخر (2): يصف حركة الحلزون بقدمه العضلية.", "المخرج 1 (يلاحظ أجزاء جسم الحلزون (القوقعة، القدم العضلية، قرون الاستشعار، العينين) باستخدام العدسة المكبرة): فهم\nالمخرج 2 (يصف حركة الحلزون بقدمه العضلية): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم بالملاحظة.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: حلزونات، صينية بلاستيكية، أوراق نبات رطبة، عدسة مكبرة، لوح شفاف.", "الحلزون، القوقعة، القدم العضلية، قرون الاستشعار، العدسة المكبرة.", "يعرض المعلم حلزونًا في صينية ويسأل: أين رأيتم الحلزون من قبل؟ هل رأيتموه في يوم حار جاف؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الحلزون ويطرح الأسئلة.\n   دور الطالب: يذكرون أماكن رأوا فيها الحلزون.\n2) السلامة والرفق بالحيوان (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يوضح التعامل اللطيف مع الحلزون وغسل اليدين جيدًا بعد لمسه.\n   دور الطالب: يكررون قواعد السلامة.\n3) الملاحظة بالعدسة (15 دقائق، من الدقيقة 11 إلى 26):\n   دور المعلم: يتابع المجموعات ويوجّه الأسئلة: هل ترى العينين؟ قرون الاستشعار؟\n   دور الطالب: يرسمون الحلزون ويسمّون القوقعة والقدم العضلية وقرون الاستشعار والعينين.\n4) حركة الحلزون (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يضع الحلزون على لوح شفاف ليرى الطلاب القدم من الأسفل.\n   دور الطالب: يصفون حركة القدم العضلية والأثر اللزج الذي يتركه.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام ويذكّر بغسل اليدين.\n   دور الطالب: يجيبون ويغسلون أيديهم.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما الأداة التي استخدمتها لملاحظة الحلزون؟\n   الإجابة النموذجية: العدسة المكبرة.\n2) [المستوى المتوقع] ما وظيفة قرون الاستشعار؟\n   الإجابة النموذجية: الإحساس والشم.\n3) [المستوى المتقدم] كيف يتحرك الحلزون؟\n   الإجابة النموذجية: بقدمه العضلية التي تنقبض وترتخي فتدفعه إلى الأمام.", "1) [مستوى الدعم] ما الجزء الصلب الذي يحمي جسم الحلزون؟\n   الإجابة النموذجية: القوقعة.\n2) [المستوى المتوقع] لماذا نغسل أيدينا بعد لمس الحلزون؟\n   الإجابة النموذجية: للمحافظة على النظافة والوقاية من الجراثيم.\n3) [المستوى المتقدم] هل الحلزون من الفقاريات أم اللافقاريات؟ فسّر.\n   الإجابة النموذجية: من اللافقاريات لأنه لا يملك عمودًا فقريًا.", "إرشاد الطالب: قراءة ص38 ورسم الحلزون مع تسمية أجزائه. إرشاد ولي الأمر: البحث مع ابنكم عن الحلزون في حديقة المنزل بعد الري ومراقبته دون إيذائه."]}, {"axis": "أي موطن يفضّله الحلزون؟ (نشاط 2-2)", "h": {"lesson": "2-2 موطن الحلزون", "unit": "الوحدة الثانية: الكائ صحة النتائج.\n3) [المستوى المتقدم] ماذا تدل النتيجة إذا قضى الحلزون أطول وقت تحت الأوراق الرطبة؟\n   الإجابة النموذجية: أنه يفضل الموطن الرطب.", "1) [مستوى الدعم] ماذا نسمّي ما نعتقد أنه سيحدث قبل التجربة؟\n   الإجابة النموذجية: التوقع.\n2) [المستوى المتوقع] اذكر شيئًا أبقيناه ثابتًا في الاختبار.\n   الإجابة النموذجية: الصينية أو مكان بدء الحلزون أو مدة الملاحظة.\n3) [المستوى المتقدم] اقترح سؤالًا جديدًا يمكن اختباره عن الحلزون.\n   الإجابة النموذجية: هل يقطع الحلزون الأكبر مسافة أطول في الدقيقة؟ (أو أي سؤال قابل للاختبار).", "إرشاد الطالب: كتابة نتائج نشاط 2-2 في جدول ورسمها بالأعمدة إن أمكن. إرشاد ولي الأمر: مناقشة ابنكم في الموطن الذي يفضّله الحلزون ولماذا."]}, {"axis": "تكيّف الحلزون مع موطنه (تمرين 2-2)", "h": {"lesson": "2-2 موطن الحلزون", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السادس (11–15/10/2026)", "sb": "39", "ab": "24، 49–50", "tg": "37–40", "n": "3 من 3", "axis": "تكيّف الحلزون مع موطنه (تمرين 2-2)"}, "f": ["1. يحلل معلومات عن أماكن وجود الحلزونات ويحدد النمط فيها.\nمخرج تعليمي آخر (2): يفسر كيف يحمي الحلزون نفسه من الجفاف والحيوانات المفترسة.", "المخرج 1 (يحلل معلومات عن أماكن وجود الحلزونات ويحدد النمط فيها): تحليل\nالمخرج 2 (يفسر كيف يحمي الحلزون نفسه من الجفاف والحيوانات المفترسة): فهم", "• التعلم التعاوني\n• التعلم المبني على حل المشكلات\n• التعلم الذاتي", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "القوقعة، الرطوبة، البرودة، الحيوانات المفترسة، الحلزون البري، الحلزون البحري.", "يسأل المعلم: ماذا يفعل الحلزون إذا جفّ المكان فجأة؟ وماذا يفعل إذا اقترب منه طائر؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤالين.\n   دور الطالب: يتوقعون: يختبئ في قوقعته.\n2) تمرين 2-2 (ص24) (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوجه إلى تحليل بيانات أماكن وجود الحلزونات.\n   دور الطالب: يحددون أن أكثرها تحت الحطب الرطب بسبب البرودة والرطوبة، وأقلها على جذع الشجرة الجاف.\n3) السؤالان 1 و2 ص39 (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: ي 2-2)):\nيسأل المعلم: ماذا يفعل الحلزون إذا جفّ المكان فجأة؟ وماذا يفعل إذا اقترب منه طائر؟", "الحصة 1 (ملاحظة الحلزون وتراكيب جسمه):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الحلزون ويطرح الأسئلة.\n   دور الطالب: يذكرون أماكن رأوا فيها الحلزون.\n2) السلامة والرفق بالحيوان (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يوضح التعامل اللطيف مع الحلزون وغسل اليدين جيدًا بعد لمسه.\n   دور الطالب: يكررون قواعد السلامة.\n3) الملاحظة بالعدسة (15 دقائق، من الدقيقة 11 إلى 26):\n   دور المعلم: يتابع المجموعات ويوجّه الأسئلة: هل ترى العينين؟ قرون الاستشعار؟\n   دور الطالب: يرسمون الحلزون ويسمّون القوقعة والقدم العضلية وقرون الاستشعار والعينين.\n4) حركة الحلزون (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يضع الحلزون على لوح شفاف ليرى الطلاب القدم من الأسفل.\n   دور الطالب: يصفون حركة القدم العضلية والأثر اللزج الذي يتركه.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام ويذكّر بغسل اليدين.\n   دور الطالب: يجيبون ويغسلون أيديهم.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (أي موطن يفضّله الحلزون؟ (نشاط 2-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يجمع التوقعات على السبورة.\n   دور الطالب: يتوقعون أن الحلزون يفضّل المكان الرطب المظلل.\n2) تخطيط الاختبار العادل (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يناقش: ما الذي نغيّره (نوع المكان)؟ ما الذي نبقيه ثابتًا (الصينية، مكان وضع الحلزون في الوسط)؟\n   دور الطالب: يرسمون الصينية مقسمة إلى أركان: أوراق رطبة، أحجار جافة، أعواد.\n3) تنفيذ نشاط 2-2 (17 دقائق، من الدقيقة 13 إلى 30):\n   دور المعلم: يتابع ويذكّر بالتسجيل كل دقيقة أو دقيقتين وتكرار التجربة.\n   دور الطالب: يضعون الحلزون في الوسط ويسجلون مكانه في جدول ويكررون مع حلزونات مختلفة.\n4) تفسير النتائج (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يسأل: هل دعمت النتائج توقعاتكم؟ لماذا لا يختار الحلزون الصحيح من البداية أحيانًا؟\n   دور الطالب: يفسرون النتائج ويذكرون محدودية بصر الحلزون أو بحثه عن الطعام.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطلب إعادة الحلزونات إلى بيئتها.\n   دور الطالب: يعيدونها ويغسلون أيديهم.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (تكيّف الحلزون مع موطنه (تمرين 2-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤالين.\n   دور الطالب: يتوقعون: يختبئ في قوقعته.\n2) تمرين 2-2 (ص24) (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوجه إلى تحليل بيانات أماكن وجود الحلزونات.\n   دور الطالب: يحددون أن أكثرها تحت الحطب الرطب بسبب البرودة والرطوبة، وأقلها على جذع الشجرة الجاف.\n3) السؤالان 1 و2 ص39 (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يناقش حماية الحلزون والطيور المفترسة التي تسحق قوقعته.\n   دور الطالب: يجيبون كتابيًا ثم يناقشون التحدي: ماذا يحدث للطيور إن قلّ الحلزون؟\n4) ورقة العمل 2-2 (10 دقائق، من الدقيقة 23 إلى 33):\n   دور المعلم: يوجه إلى تقييم مواطن حول المدرسة.\n   دور الطالب: يحكمون على كل موطن: هل يناسب الحلزون؟ ولماذا؟\n5) مسابقة الختام (7 دقائق، من الدقيقة 33 إلى 40):\n   دور المعلم: يشغّل مسابقة الدرس.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (ملاحظة الحلزون وتراكيب جسمه):\n1) [مستوى الدعم] ما الأداة التي استخدمتها لملاحظة الحلزون؟\n   الإجابة النموذجية: العدسة المكبرة.\n2) [المستوى المتوقع] ما وظيفة قرون الاستشعار؟\n   الإجابة النموذجية: الإحساس والشم.\n3) [المستوى المتقدم] كيف يتحرك الحلزون؟\n   الإجابة النموذجية: بقدمه العضلية التي تنقبض وترتخي فتدفعه إلى الأمام.\n\nالحصة 2 (أي موطن يفضّله الحلزون؟ (نشاط 2-2)):\n1) [مستوى الدعم] ما الشيء الذي غيّرناه في الاختبار؟\n   الإجابة النموذجية: نوع المكان (رطب، جاف...).\n2) [المستوى المتوقع] لماذا كررنا التجربة أكثر من مرة؟\n   الإجابة النموذجية: لنتأكد من صحة النتائج.\n3) [المستوى المتقدم] ماذا تدل النتيجة إذا قضى الحلزون أطول وقت تحت الأوراق الرطبة؟\n   الإجابة النموذجية: أنه يفضل الموطن الرطب.\n\nالحصة 3 (تكيّف الحلزون مع موطنه (تمرين 2-2)):\n1) [مستوى الدعم] أين وُجد أكبر عدد من الحلزونات في التمرين؟\n   الإجابة النموذجية: تحت الحطب الرطب.\n2) [المستوى المتوقع] لماذا يختبئ الحلزون في قوقعته في الطقس الجاف؟\n   الإجابة النموذجية: ليحافظ على رطوبة جسمه ولا يجف.\n3) [المستوى المتقدم] لماذا لا نجد الحلزونات على جذع شجرة مشمس؟\n   الإجابة النموذجية: لأنه دافئ وجاف ولا يوجد طعام، ويمكن للطيور أن تأكلها هناك.", "الحصة 1 (ملاحظة الحلزون وتراكيب جسمه):\n1) [مستوى الدعم] ما الجزء الصلب الذي يحمي جسم الحلزون؟\n   الإجابة النموذجية: القوقعة.\n2) [المستوى المتوقع] لماذا نغسل أيدينا بعد لمس الحلزون؟\n   الإجابة النموذجية: للمحافظة على النظافة والوقاية من الجراثيم.\n3) [المستوى المتقدم] هل الحلزون من الفقاريات أم اللافقاريات؟ فسّر.\n   الإجابة النموذجية: من اللافقاريات لأنه لا يملك عمودًا فقريًا.\n\nالحصة 2 (أي موطن يفضّله الحلزون؟ (نشاط 2-2)):\n1) [مستوى الدعم] ماذا نسمّي ما نعتقد أنه سيحدث قبل التجربة؟\n   الإجابة النموذجية: التوقع.\n2) [المستوى المتوقع] اذكر شيئًا أبقيناه ثابتًا في الاختبار.\n   الإجابة النموذجية: الصينية أو مكان بدء الحلزون أو مدة الملاحظة.\n3) [المستوى المتقدم] اقترح سؤالًا جديدًا يمكن اختباره عن الحلزون.\n   الإجابة النموذجية: هل يقطع الحلزون الأكبر مسافة أطول في الدقيقة؟ (أو أي سؤال قابل للاختبار).\n\nالحصة 3 (تكيّف الحلزون مع موطنه (تمرين 2-2)):\n1) [مستوى الدعم] ما خط الدفاع الأساسي للحلزون؟\n   الإجابة النموذجية: القوقعة.\n2) [المستوى المتوقع] ماذا يحدث للطيور التي تتغذى على الحلزون إذا لم تجد غذاءً بديلًا؟\n   الإجابة النموذجية: قد تجوع وتموت.\n3) [المستوى المتقدم] هل يستطيع الحلزون البحري العيش في موطن الحلزون البري؟ فسّر.\n   الإجابة النموذجية: لا، لأن كل نوع متكيف مع موطنه الخاص.", "الحصة 1 (ملاحظة الحلزون وتراكيب جسمه):\nإرشاد الطالب: قراءة ص38 ورسم الحلزون مع تسمية أجزائه. إرشاد ولي الأمر: البحث مع ابنكم عن الحلزون في حديقة المنزل بعد الري ومراقبته دون إيذائه.\n\nالحصة 2 (أي موطن يفضّله الحلزون؟ (نشاط 2-2)):\nإرشاد الطالب: كتابة نتائج نشاط 2-2 في جدول ورسمها بالأعمدة إن أمكن. إرشاد ولي الأمر: مناقشة ابنكم في الموطن الذي يفضّله الحلزون ولماذا.\n\nالحصة 3 (تكيّف الحلزون مع موطنه (تمرين 2-2)):\nإرشاد الطالب: إكمال تمرين 2-2 ص24 وورقة العمل 2-2 ص49–50. إرشاد ولي الأمر: تشجيع ابنكم على وصف موطن مناسب للحلزون في حديقة البيت."]}, {"id": "3-2", "title": "الحيوانات في المواطن الطبيعية", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبي  حيوانات أكثر.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر حيوانًا وجدته وموطنه.\n   الإجابة النموذجية: مثل: دودة الأرض تحت الحجر، النمل قرب العشب (إجابات متنوعة).\n2) [المستوى المتوقع] ماذا يوفر الموطن للحيوان؟\n   الإجابة النموذجية: الغذاء والمأوى والماء.\n3) [المستوى المتقدم] اكتب سؤالًا يمكن اختباره عن حيوان وجدته.\n   الإجابة النموذجية: مثل: هل نجد ديدان الأرض تحت الحجارة أكثر من تحت العشب؟", "1) [مستوى الدعم] لماذا نعيد الحجارة إلى مكانها بعد البحث؟\n   الإجابة النموذجية: حتى لا نخرب موطن الحيوانات.\n2) [المستوى المتوقع] ما النمط الذي لاحظته في أعداد الحيوانات؟\n   الإجابة النموذجية: وجود حيوانات أكثر في الأماكن الرطبة والباردة.\n3) [المستوى المتقدم] كيف يمكن أن يؤثر بناء مبانٍ جديدة في المدرسة على الحيوانات؟\n   الإجابة النموذجية: يقل عدد الحيوانات والنباتات لأن مواطنها تقل.", "إرشاد الطالب: كتابة تقرير قصير عن الحيوانات التي وجدها في نشاط 3-2. إرشاد ولي الأمر: البحث مع ابنكم عن حيوانات صغيرة في حديقة البيت ومناقشة مواطنها."]}, {"axis": "تحليل بيانات الحيوانات في مواطنها (تمرين 3-2)", "h": {"lesson": "3-2 الحيوانات في المواطن الطبيعية", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السادس (11–15/10/2026)", "sb": "41", "ab": "25، 51–52", "tg": "40–42", "n": "2 من 2", "axis": "تحليل بيانات الحيوانات في مواطنها (تمرين 3-2)"}, "f": ["1. يقرأ تمثيلًا بيانيًا بالأعمدة عن أعداد اليعسوب ويفسر النتائج.\nمخرج تعليمي آخر (2): يستنتج حاجات دودة الأرض من بيانات الحقول المختلفة.", "المخرج 1 (يقرأ تمثيلًا بيانيًا بالأعمدة عن أعداد اليعسوب ويفسر النتائج): تحليل\nالمخرج 2 (يستنتج حاجات دودة الأرض من بيانات الحقول المختلفة): تحليل", "• التعلم التعاوني\n• التعلم المبني على حل المشكلات\nاستراتيجيات أخرى: التعلم المتمايز.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التمثيل البياني بالأعمدة، اليعسوب، دودة الأرض، الرطوبة المعتدلة، المسكن والموطن.", "يعرض المعلم صورة يعسوب ويسأل: أين يعيش؟ وماذا تتوقع أن يحدث لعدده في الأيام الباردة؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور ة؟ (أو هل له ريش؟).\n3) [المستوى المتقدم] كيف تتأكد أن مفتاحك يعمل جيدًا؟\n   الإجابة النموذجية: بأن يجربه زميل فيصل إلى الحيوان الصحيح.", "الحصة 1 (ما المفتاح التعريفي؟):\n1) [مستوى الدعم] اكتب سؤالًا يفرّق بين الأرنب والقطة.\n   الإجابة النموذجية: هل له أذنان طويلتان؟\n2) [المستوى المتوقع] إلى أي مجموعة ينتمي الإنسان والقطة؟\n   الإجابة النموذجية: الثدييات.\n3) [المستوى المتقدم] لماذا لا يصلح السؤال «هل هو جميل؟» في المفتاح التعريفي؟\n   الإجابة النموذجية: لأن إجابته رأي شخصي تختلف بين الناس وليست صفة يمكن ملاحظتها.\n\nالحصة 2 (بناء مفتاح تعريفي (نشاط 4-2 وتمرين 4-2)):\n1) [مستوى الدعم] ما السؤال الأول الذي استخدمته في مفتاحك؟\n   الإجابة النموذجية: هل يعيش في الماء؟ (أو سؤال مناسب).\n2) [المستوى المتوقع] في تمرين الطيور، ما الصفة التي ميّزت البطة؟\n   الإجابة النموذجية: أقدامها المسطحة أو عيشها في الماء.\n3) [المستوى المتقدم] أضف حيوانًا جديدًا (مثل الجمل) إلى مفتاحك واكتب السؤال الذي يميّزه.\n   الإجابة النموذجية: مثل: هل له سنام؟ (إجابات متنوعة).", "الحصة 1 (ما المفتاح التعريفي؟):\nإرشاد الطالب: قراءة ص42–43 والإجابة عن الأسئلة 1–4. إرشاد ولي الأمر: اللعب مع ابنكم لعبة «خمّن الحيوان» بأسئلة نعم/لا.\n\nالحصة 2 (بناء مفتاح تعريفي (نشاط 4-2 وتمرين 4-2)):\nإرشاد الطالب: إكمال تمرين 4-2 ص26 وورقة العمل 4-2 ص53. إرشاد ولي الأمر: مساعدة ابنكم في بناء مفتاح تعريفي لحيوانات البيت أو المزرعة."]}, {"id": "5-2", "title": "تمييز الحيوانات اللافقارية", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السابع (18–22/10/2026)", "sb": "44–45", "ab": "27، ورقة العمل 5-2 ص54", "tg": "43–45", "periods": [{"axis": "جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)", "h": {"lesson": "5-2 تمييز الحيوانات اللافقارية", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السابع (18–22/10/2026)", "sb": "44", "ab": "—", "tg": "43–45", "n": "1 من 3", "axis": "جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)"}, "f": ["1. يعرّف الحيوان اللافقاري ويذكر أمثلة عليه.\nمخرج تعليمي آخر (2): يلاحظ صفات اللافقاريات (عدد الأرجل، قرون الاستشعار، اللون) ويسجل ت إلى أماكنها بعد الملاحظة؟\n   الإجابة النموذجية: للمحافظة على حياتها وعلى مواطنها الطبيعية.", "إرشاد الطالب: قراءة ص44 ورسم أحد اللافقاريات التي لاحظها مع تسمية أجزائه. إرشاد ولي الأمر: البحث مع ابنكم عن لافقاريات في الحديقة دون لمسها أو إيذائها."]}, {"axis": "مفتاح تعريفي للافقاريات (تمرين 5-2)", "h": {"lesson": "5-2 تمييز الحيوانات اللافقارية", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السابع (18–22/10/2026)", "sb": "45", "ab": "27، 54", "tg": "43–45", "n": "2 من 3", "axis": "مفتاح تعريفي للافقاريات (تمرين 5-2)"}, "f": ["1. يستخدم مفتاحًا تعريفيًا لتمييز حيوانات لافقارية.\nمخرج تعليمي آخر (2): يوضح أن تصنيف الحيوانات يعتمد على المعيار المستخدم.", "المخرج 1 (يستخدم مفتاحًا تعريفيًا لتمييز حيوانات لافقارية): تطبيق\nالمخرج 2 (يوضح أن تصنيف الحيوانات يعتمد على المعيار المستخدم): فهم", "• التعلم التعاوني\n• التعلم المبني على اللعب\nاستراتيجيات أخرى: التعلم المتمايز.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات صور لافقاريات متحركة على لوحة.", "المفتاح التعريفي، الحشرة، ست أرجل، المعيار.", "يعرض المعلم صور نحلة ودعسوقة وعنكبوت ودودة ويسأل: كيف نفرّق بينها بسؤال واحد؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصور ويطرح السؤال.\n   دور الطالب: يقترحون: كم عدد الأرجل؟\n2) الحشرة (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يوضح أن الحشرة حيوان لافقاري له ست أرجل (السؤال 1).\n   دور الطالب: يعدّون الأرجل في الصور ويصنفون.\n3) تمرين 5-2 (ص27) (14 دقائق، من الدقيقة 13 إلى 27):\n   دور المعلم: يوجه إلى إكمال المفتاح ويقدم الدعم البصري.\n   دور الطالب: يملؤون المستطيلات: النحلة، الدعسوقة، العنكبوت، اليعسوب، أم أربعة وأربعين، الدودة.\n4) المعيار والتصنيف (السؤال 2) (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش: الدب والحوت في مجموعة واحدة أم لا؟\n   دور الطالب: يستنتجون أن التصنيف يعتمد على السؤال: «هل له فرو؟» يختلف عن «هل هو من الثدييات؟».\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يوزع ورقة العمل 5-2 للمتقدمين واجبًا.\n   دور الطالب: يجيبون عن أسئلة الختام.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] كم رجلًا للحشرة؟\n   الإجابة النموذجية: ست أرجل.\n2) [المستوى المتوقع] هل العنكبوت حشرة؟ ولماذا؟\n   الإجابة النموذجية: لا، لأن له ثماني أرجل.\n3) [المستوى المتقدم] لماذا يمكن أن يكون الدب والحوت في مجموعة واحدة أحيانًا وفي مجموعتين أحيانًا أخرى؟\n   الإجابة النموذجية: لأن التصنيف يعتمد على المعيار؛ فكلاهما من الثدييات، لكن الدب وحده له فرو.", "1) [مستوى الدعم] اذكر حيوانًا لافقاريًا ليس له أرجل.\n   الإجابة النموذجية: الدودة (أو الحلزون).\n2) [المستوى المتوقع] ما السؤال الذي يفرق بين النحلة والدعسوقة في المفتاح؟\n   الإجابة النموذجية: مثل: هل له خطوط صفراء وسوداء؟ أو هل له نقاط على ظهره؟\n3) [المستوى المتقدم] اقترح سؤالًا لمفتاح يفرّق بين اليعسوب والنحلة.\n   الإجابة النموذجية: هل له جسم طويل رفيع؟ أو هل يصنع العسل؟ (إجابات منطقية).", "إرشاد الطالب: إكمال تمرين 5-2 ص27، والمتقدمون ورقة العمل 5-2 ص54. إرشاد ولي الأمر: مراجعة عدد أرجل الحشرات مع ابنكم من صور في البيئة."]}, {"axis": "تصميم بيت للحشرات (نشاط 5-2ب)", "h": {"lesson": "5-2 تمييز الحيوانات اللافقارية", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع السابع (18–22/10/2026)", "sb": "45", "ab": "—", "tg": "43–45", "n": "3 من 3", "axis": "تصميم بيت للحشرات (نشاط 5-2ب)"}, "f": ["1. يصمم موطنًا (بيتًا) للحشرات باستخدام مواد بسيطة.\nمخرج تعليمي آخر (2): يقارن أعداد الحشرات وأنواعها في مواقع مختلفة ويربط ذلك بحاجاتها.", "المخرج 1 (يصمم موطنًا (بيتًا) للحشرات باستخدام مواد بسيطة): إبداع\nالمخرج 2 (يقارن أعداد الحشرات وأنواعها في مواقع مختلفة ويربط ذلك بحاجاتها): تحليل", "• التعلم المبني على المشاريع\n• التعلم التعاوني\n• التعلم بالاكتشاف", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: أحجار صغيرة، طوب، أعواد، حطب، ورق مقوى، علب وألواح خشبية صغيرة.", "الموطن، المأوى، الرطوبة، الحشرات، المقارنة.", "يسأل المعلم: لو كنت حشرة صغيرة، ماذا تحتاج في بيتك؟ ويجمع الأفكار.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يجمع حاجات الحشرة.\n   دور الطالب: يذكرون الظل والرطوبة والمأوى والغذاء.\n2) التصميم على الورق (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يطلب رسم تصميم قبل البناء.\n   دور الطالب: يرسمون تصميمًا ويحددون المواد ومكان وضعه.\n3) بناء بيت الحشرات (15 دقائق، من الدقيقة 13 إلى 28):\n   دور المعلم: يتابع البناء ويؤكد السلامة في حمل الطوب والأخشاب.\n   دور الطالب: يبنون البيت بالمواد ويضعونه في مكان في المدرسة.\n4) خطة الملاحظة والسؤال 3 (5 دقائق، من الدقيقة 28 إلى 33):\n   دور المعلم: يحدد مدة الملاحظة على عدة أيام ويناقش السؤال 3.\n   دور الطالب: يعدّون جدولًا لتسجيل عدد الحشرات ونوعها ومكانها.\n5) مسابقة الختام (7 دقائق، من الدقيقة 33 إلى 40):\n   دور المعلم: يشغّل مسابقة الدرس 5-2.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما المواد التي استخدمتها في بيت الحشرات؟\n   الإجابة النموذجية: أحجار، أعواد، حطب، ورق مقوى، علب (إجابات متنوعة).\n2) [المستوى المتوقع] لماذا وضعنا البيت في مكان رطب مظلل؟\n   الإجابة النموذجية: لأن كثيرًا من اللافقاريات تفضل الرطوبة والظل.\n3) [المستوى المتقدم] كيف ستقارن بين بيتين في مكانين مختلفين؟\n   الإجابة النموذجية: بتسجيل أعداد الحشرات وأنواعها في كل بيت على عدة أيام ثم المقارنة.", "1) [مستوى الدعم] ماذا يوفر بيت الحشرات للحشرة؟\n   الإجابة النموذجية: المأوى (والرطوبة والحماية).\n2) [المستوى المتوقع] ما الذي ستسجله في جدول الملاحظة؟\n   الإجابة النموذجية: عدد الحشرات ونوعها ومكانها.\n3) [المستوى المتقدم] اقترح تعديلًا على تصميمك يجذب حشرات أكثر، وفسّر.\n   الإجابة النموذجية: إضافة أوراق متحللة أو زهور للغذاء أو زيادة الرطوبة لأن الحشرات تحتاج الغذاء والرطوبة.", "إرشاد الطالب: متابعة بيت الحشرات وتسجيل الملاحظات عدة أيام والإجابة عن الأسئلة ص45. إرشاد ولي الأمر: مساعدة ابنكم في صنع بيت حشرات صغير في حديقة المنزل."]}], "comb": ["الحصة 1 (جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)):\n1. يعرّف الحيوان اللافقاري ويذكر أمثلة عليه.\nمخرج تعليمي آخر (2): يلاحظ صفات اللافقاريات (عدد الأرجل، قرون الاستشعار، اللون) ويسجلها.\n\nالحصة 2 (مفتاح تعريفي للافقاريات (تمرين 5-2)):\n1. يستخدم مفتاحًا تعريفيًا لتمييز حيوانات لافقارية.\nمخرج تعليمي آخر (2): يوضح أن تصنيف الحيوان ):\nالموطن، المأوى، الرطوبة، الحشرات، المقارنة.", "الحصة 1 (جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)):\nيسأل المعلم: الحلزون والنملة والفراشة.. ما الذي ينقص أجسامها مقارنة بأجسامنا؟ (العمود الفقري).\n\nالحصة 2 (مفتاح تعريفي للافقاريات (تمرين 5-2)):\nيعرض المعلم صور نحلة ودعسوقة وعنكبوت ودودة ويسأل: كيف نفرّق بينها بسؤال واحد؟\n\nالحصة 3 (تصميم بيت للحشرات (نشاط 5-2ب)):\nيسأل المعلم: لو كنت حشرة صغيرة، ماذا تحتاج في بيتك؟ ويجمع الأفكار.", "الحصة 1 (جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويعرّف اللافقاري.\n   دور الطالب: يذكرون أمثلة للافقاريات.\n2) استخدام البوتر (7 دقائق، من الدقيقة 5 إلى 12):\n   دور المعلم: يعرض طريقة استخدام البوتر بعناية دون إيذاء الحشرة ويتأكد من نظافته.\n   دور الطالب: يتدربون على السحب بلطف.\n3) تنفيذ نشاط 5-2أ (16 دقائق، من الدقيقة 12 إلى 28):\n   دور المعلم: يرافقهم في الساحة ويتابع السلامة.\n   دور الطالب: يتوقعون أماكن وجود اللافقاريات ثم يجمعونها ويضعونها في الصينية على أوراق رطبة.\n4) الملاحظة والتسجيل (8 دقائق، من الدقيقة 28 إلى 36):\n   دور المعلم: يطرح أسئلة: كم رجلًا له؟ هل له قرون استشعار؟ كم جزءًا لجسمه؟\n   دور الطالب: يرسمون الحيوان ويدونون ملاحظاتهم ويطرحون أسئلة.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطلب إعادة الحيوانات إلى أماكنها.\n   دور الطالب: يعيدونها ويغسلون أيديهم.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (مفتاح تعريفي للافقاريات (تمرين 5-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصور ويطرح السؤال.\n   دور الطالب: يقترحون: كم عدد الأرجل؟\n2) الحشرة (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يوضح أن الحشرة حيوان لافقاري له ست أرجل (السؤال 1).\n   دور الطالب: يعدّون الأرجل في الصور ويصنفون.\n3) تمرين 5-2 (ص27) (14 دقائق، من الدقيقة 13 إلى 27):\n   دور المعلم: يوجه إلى إكمال المفتاح ويقدم الدعم البصري.\n   دور الطالب: يملؤون المستطيلات: النحلة، الدعسوقة، العنكبوت، اليعسوب، أم أربعة وأربعين، الدودة.\n4) المعيار والتصنيف (السؤال 2) (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش: الدب والحوت في مجموعة واحدة أم لا؟\n   دور الطالب: يستنتجون أن التصنيف يعتمد على السؤال: «هل له فرو؟» يختلف عن «هل هو من الثدييات؟».\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يوزع ورقة العمل 5-2 للمتقدمين واجبًا.\n   دور الطالب: يجيبون عن أسئلة الختام.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (تصميم بيت للحشرات (نشاط 5-2ب)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يجمع حاجات الحشرة.\n   دور الطالب: يذكرون الظل والرطوبة والمأوى والغذاء.\n2) التصميم على الورق (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يطلب رسم تصميم قبل البناء.\n   دور الطالب: يرسمون تصميمًا ويحددون المواد ومكان وضعه.\n3) بناء بيت الحشرات (15 دقائق، من الدقيقة 13 إلى 28):\n   دور المعلم: يتابع البناء ويؤكد السلامة في حمل الطوب والأخشاب.\n   دور الطالب: يبنون البيت بالمواد ويضعونه في مكان في المدرسة.\n4) خطة الملاحظة والسؤال 3 (5 دقائق، من الدقيقة 28 إلى 33):\n   دور المعلم: يحدد مدة الملاحظة على عدة أيام ويناقش السؤال 3.\n   دور الطالب: يعدّون جدولًا لتسجيل عدد الحشرات ونوعها ومكانها.\n5) مسابقة الختام (7 دقائق، من الدقيقة 33 إلى 40):\n   دور المعلم: يشغّل مسابقة الدرس 5-2.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)):\n1) [مستوى الدعم] ما الحيوان اللافقاري؟\n   الإجابة النموذجية: حيوان لا يملك عمودًا فقريًا.\n2) [المستوى المتوقع] اذكر حيوانين لافقاريين.\n   الإجابة النموذجية: الحلزون، النملة، الفراشة، الدودة (أي اثنين).\n3) [المستوى المتقدم] لماذا نضع الحيوان على أوراق رطبة؟\n   الإجابة النموذجية: لنحافظ على رطوبته وراحته دون أن نبلله.\n\nالحصة 2 (مفتاح تعريفي للافقاريات (تمرين 5-2)):\n1) [مستوى الدعم] كم رجلًا للحشرة؟\n   الإجابة النموذجية: ست أرجل.\n2) [المستوى المتوقع] هل العنكبوت حشرة؟ ولماذا؟\n   الإجابة النموذجية: لا، لأن له ثماني أرجل.\n3) [المستوى المتقدم] لماذا يمكن أن يكون الدب والحوت في مجموعة واحدة أحيانًا وفي مجموعتين أحيانًا أخرى؟\n   الإجابة النموذجية: لأن التصنيف يعتمد على المعيار؛ فكلاهما من الثدييات، لكن الدب وحده له فرو.\n\nالحصة 3 (تصميم بيت للحشرات (نشاط 5-2ب)):\n1) [مستوى الدعم] ما المواد التي استخدمتها في بيت الحشرات؟\n   الإجابة النموذجية: أحجار، أعواد، حطب، ورق مقوى، علب (إجابات متنوعة).\n2) [المستوى المتوقع] لماذا وضعنا البيت في مكان رطب مظلل؟\n   الإجابة النموذجية: لأن كثيرًا من اللافقاريات تفضل الرطوبة والظل.\n3) [المستوى المتقدم] كيف ستقارن بين بيتين في مكانين مختلفين؟\n   الإجابة النموذجية: بتسجيل أعداد الحشرات وأنواعها في كل بيت على عدة أيام ثم المقارنة.", "الحصة 1 (جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)):\n1) [مستوى الدعم] ما الأداة التي جمعنا بها الحشرات الصغيرة؟\n   الإجابة النموذجية: البوتر (الشفاط).\n2) [المستوى المتوقع] اذكر صفتين لاحظتهما في الحيوان الذي جمعته.\n   الإجابة النموذجية: عدد الأرجل ووجود قرون استشعار أو اللون (إجابات متنوعة).\n3) [المستوى المتقدم] لماذا يجب إعادة الحيوانات إلى أماكنها بعد الملاحظة؟\n   الإجابة النموذجية: للمحافظة على حياتها وعلى مواطنها الطبيعية.\n\nالحصة 2 (مفتاح تعريفي للافقاريات (تمرين 5-2)):\n1) [مستوى الدعم] اذكر حيوانًا لافقاريًا ليس له أرجل.\n   الإجابة النموذجية: الدودة (أو الحلزون).\n2) [المستوى المتوقع] ما السؤال الذي يفرق بين النحلة والدعسوقة في المفتاح؟\n   الإجابة النموذجية: مثل: هل له خطوط صفراء وسوداء؟ أو هل له نقاط على ظهره؟\n3) [المستوى المتقدم] اقترح سؤالًا لمفتاح يفرّق بين اليعسوب والنحلة.\n   الإجابة النموذجية: هل له جسم طويل رفيع؟ أو هل يصنع العسل؟ (إجابات منطقية).\n\nالحصة 3 (تصميم بيت للحشرات (نشاط 5-2ب)):\n1) [مستوى الدعم] ماذا يوفر بيت الحشرات للحشرة؟\n   الإجابة النموذجية: المأوى (والرطوبة والحماية).\n2) [المستوى المتوقع] ما الذي ستسجله في جدول الملاحظة؟\n   الإجابة النموذجية: عدد الحشرات ونوعها ومكانها.\n3) [المستوى المتقدم] اقترح تعديلًا على تصميمك يجذب حشرات أكثر، وفسّر.\n   الإجابة النموذجية: إضافة أوراق متحللة أو زهور للغذاء أو زيادة الرطوبة لأن الحشرات تحتاج الغذاء والرطوبة.", "الحصة 1 (جمع الحيوانات اللافقارية وملاحظتها (نشاط 5-2أ)):\nإرشاد الطالب: قراءة ص44 ورسم أحد اللافقاريات التي لاحظها مع تسمية أجزائه. إرشاد ولي الأمر: البحث مع ابنكم عن لافقاريات في الحديقة دون لمسها أو إيذائها.\n\nالحصة 2 (مفتاح تعريفي للافقاريات (تمرين 5-2)):\nإرشاد الطالب: إكمال تمرين 5-2 ص27، والمتقدمون ورقة العمل 5-2 ص54. إرشاد ولي الأمر: مراجعة عدد أرجل الحشرات مع ابنكم من صور في البيئة.\n\nالحصة 3 (تصميم بيت للحشرات (نشاط 5-2ب)):\nإرشاد الطالب: متابعة بيت الحشرات وتسجيل الملاحظات عدة أيام والإجابة عن الأسئلة ص45. إرشاد ولي الأمر: مساعدة ابنكم في صنع بيت حشرات صغير في حديقة المنزل."]}, {"id": "6-2", "title": "كيف نؤثر على البيئة؟", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الثامن (25–29/10/2026)", "sb": "46–47", "ab": "28", "tg": "45–46", "periods": [{"axis": "أنشطة الإنسان والبيئة", "h": {"lesson": "6-2 كيف نؤثر على البيئة؟", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الثامن (25–29/10/2026)", "sb": "46", "ab": "—", "tg": "45–46", "n": "1 من 5", "axis": "أنشطة الإنسان والبيئة"}, "f": ["1. يذكر طرقًا تؤثر بها أنشطة الإنسان على البيئة.\nمخرج تعليمي آخر (2): يميّز بين الكوارث الطبيعية والكوارث الناتجة من صنع الإنسان.", "المخرج 1 (يذكر طرقًا تؤثر بها أنشطة الإنسان على البيئة): تذكر\nالمخرج 2 (يميّز بين الكوارث الطبيعية والكوارث الناتجة من صنع الإنسان): فهم", "• التعلم بالاكتشاف\n• التعلم التشاركي\nاستراتيجيات أخرى: العصف الذهني.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: صور: زلزال، فيضان، تسرب نفط، دخان مصانع.", "البيئة، التلوث، الكارثة الطبيعية، الكارثة من صنع الإنسان، تسرب النفط.", "يعرض المعلم صورتين: فيضان، وبقعة نفط على شاطئ، ويسأل: ما الفرق بين سبب الكارثتين؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورتين ويطرح السؤال.\n   دور الطالب: يستنتجون أن الأولى طبيعية والثانية من صنع الإنسان.\n2) تصنيف الكوارث (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض بطاقات (زلزال، تسرب نفط، فيضان، حريق غابة بسبب الإنسان...).\n   دور الطالب: يصنفونها في جدول: طبيعية / من صنع الإنسان.\n3) أنشطة الإنسان (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يدير عصفًا ذهنيًا: المركبات، المصانع، البيوت، المزارع، الصيد.\n   دور الطالب: يكتبون أثر كل نشاط على الهواء أو الماء أو اليابسة.\n4) قراءة ص46 والسؤالان 1 و3 (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يجيبون: جميع أنشطة الإنسان تؤثر على البيئة بشكل مفيد أو ضار.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر نشاطًا للإنسان يلوث الهواء.\n   الإجابة النموذجية: دخان المركبات أو المصانع.\n2) [المستوى المتوقع] هل الزلزال من صنع الإنسان؟\n   الإجابة النموذجية: لا، كارثة طبيعية.\n3) [المستوى المتقدم] لماذا يعد تسرب النفط كارثة من صنع الإنسان؟\n   الإجابة النموذجية: لأنه ينتج عن نقل الإنسان للنفط واستخدامه.", "1) [مستوى الدعم] اذكر مثالًا على كارثة طبيعية.\n   الإجابة النموذجية: الزلزال أو الفيضان.\n2) [المستوى المتوقع] كيف يؤثر الصيد الجائر على البيئة؟\n   الإجابة النموذجية: يقلل أعداد الأسماك والحيوانات وقد يهددها بالانقراض.\n3) [المستوى المتقدم] هل كل أنشطة الإنسان ضارة؟ وضّح بمثال.\n   الإجابة النموذجية: لا، بعضها مفيد مثل حماية الحيوانات المهددة بالانقراض وزراعة الأشجار.", "إرشاد الطالب: قراءة ص46 والإجابة عن السؤالين 1 و3. إرشاد ولي الأمر: مناقشة ابنكم في نشاط واحد في البيت يؤثر على البيئة وكيف نحسّنه."]}, {"axis": "آثار التلوث حول المدرسة (نشاط 6-2)", "h": {"lesson": "6-2 كيف نؤثر على البيئة؟", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الثامن (25–29/10/2026)", "sb": "46", "ab": "—", "tg": "45–46", "n": "2 من 5", "axis": "آثار التلوث حول المدرسة (نشاط 6-2)"}, "f": ["1. يحدد آثار التلوث في البيئة المدرسية والمحلية وأسبابها.\nمخرج تعليمي آخر (2): يقارن حالة ساحة المدرسة قبل جمع النفايات وبعده.", "المخرج 1 (يحدد آثار التلوث في البيئة المدرسية والمحلية وأسبابها): تطبيق\nالمخرج 2 (يقارن حالة ساحة المدرسة قبل جمع النفايات وبعده): تحليل", "• التعلم المبني على المشاريع\n• التعلم التعاوني\nاستراتيجيات أخرى: التعلم الميداني.", "• الكتاب\n• الأقلام\n• صورة توضيحية\n• أخرى: قفازات بلاستيكية، أكياس نفايات، أوراق وأقلام تلوين.", "التلوث، النفايات، المخلفات، السلامة.", "يسأل المعلم: هل ساحتنا نظيفة؟ ما الذي قد نجده بعد الفسحة؟ ويسجل التوقعات.", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يجمع التوقعات.\n   دور الطالب: يتوقعون أنواع النفايات.\n2) السلامة والتخطيط (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يؤكد لبس القفازات وعدم لمس الأشياء الحادة، ويوزع المناطق.\n   دور الطالب: يجهزون جدول تسجيل: نوع النفاية، مكانها، سببها.\n3) تنفيذ نشاط 6-2 (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يرافقهم ويلتقط صورًا قبل الجمع وبعده.\n   دور الطالب: يجمعون النفايات ويسجلونها ويرسمون آثار التلوث وأسبابها.\n4) المقارنة (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يعرض صور قبل وبعد.\n   دور الطالب: يقارنون ويحددون أكثر أنواع النفايات تكرارًا وسببها.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل: من المسؤول عن نظافة الساحة؟\n   دور الطالب: يستنتجون أن السلوك الفردي يصنع الفرق.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما أكثر نوع نفايات وجدته في الساحة؟\n   الإجابة النموذجية: بقايا الطعام أو أغلفة الحلويات أو العبوات (إجابات متنوعة).\n2) [المستوى المتوقع] لماذا لبسنا القفازات؟\n   الإجابة النموذجية: لحماية أيدينا من الجراثيم والأشياء الحادة.\n3) [المستوى المتقدم] ما سبب وجود النفايات في الساحة؟\n   الإجابة النموذجية: رمي الناس النفايات في غير أماكنها.", "1) [مستوى الدعم] كيف أصبحت الساحة بعد جمع النفايات؟\n   الإجابة النموذجية: أنظف وأجمل.\n2) [المستوى المتوقع] اذكر أثرًا ضارًا للنفايات على الحيوانات.\n   الإجابة النموذجية: قد تأكلها الحيوانات أو تعلق بها فتمرض أو تموت.\n3) [المستوى المتقدم] اقترح قاعدة صفية تقلل النفايات في الساحة.\n   الإجابة النموذجية: مثل: «كل طالب يعيد نفايته إلى السلة» أو وضع سلال ملونة.", "إرشاد الطالب: عدّ أنواع النفايات التي ينتجها منزله في يوم واحد. إرشاد ولي الأمر: مساعدة ابنكم في تسجيل نفايات المنزل لمدة يوم."]}, {"axis": "آثار إيجابية وآثار سلبية (تمرين 6-2)", "h": {"lesson": "6-2 كيف نؤثر على البيئة؟", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الثامن (25–29/10/2026)", "sb": "47", "ab": "28", "tg": "45–46", "n": "3 من 5", "axis": "آثار إيجابية وآثار سلبية (تمرين 6-2)"}, "f": ["1. يميز الآثار ح حلًا لتلوث الهواء من المصانع.\n   الإجابة النموذجية: تركيب مرشحات للدخان أو استخدام طاقة نظيفة.\n3) [المستوى المتقدم] وازن بين فائدة بناء مصنع جديد وضرره على البيئة.\n   الإجابة النموذجية: يوفر منتجات وأعمالًا، لكنه قد يلوث الهواء والماء؛ لذا يجب تقليل التلوث بوسائل الحماية.", "إرشاد الطالب: إكمال تمرين 6-2 ص28. إرشاد ولي الأمر: زيارة محمية أو متنزه طبيعي مع ابنكم إن أمكن والحديث عن أهميته."]}, {"axis": "حلول عملية للحد من التلوث", "h": {"lesson": "6-2 كيف نؤثر على البيئة؟", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الثامن (25–29/10/2026)", "sb": "47", "ab": "—", "tg": "45–46", "n": "4 من 5", "axis": "حلول عملية للحد من التلوث"}, "f": ["1. يقترح حلولًا عملية لمشكلات بيئية في المدرسة والبيت.\nمخرج تعليمي آخر (2): يصمم ملصقًا أو رسالة للتوعية بحماية البيئة.", "المخرج 1 (يقترح حلولًا عملية لمشكلات بيئية في المدرسة والبيت): إبداع\nالمخرج 2 (يصمم ملصقًا أو رسالة للتوعية بحماية البيئة): إبداع", "• التعلم المبني على المشاريع\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: أوراق ملصقات، أقلام تلوين.", "التوعية، الإسراف، ترشيد الكهرباء، السلوك البيئي.", "يعرض المعلم صورة صحن مليء ببقايا الطعام ويسأل: إلى أين يذهب هذا الطعام؟ وما المشكلة؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يناقشون هدر الطعام وأثره.\n2) تحديد مشكلة (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يطلب من كل مجموعة اختيار مشكلة: هدر الطعام، رمي النفايات، ترك الأضواء مضاءة، دخان مصنع قريب.\n   دور الطالب: يختارون المشكلة ويحددون أسبابها.\n3) تصميم الحل (17 دقائق، من الدقيقة 13 إلى 30):\n   دور المعلم: يتابع المجموعات ويقترح أشكالًا: ملصق، رسالة إلى مدير المصنع، قاعدة صفية.\n   دور الطالب: يصممون الملصق أو يكتبون الرسالة بحلول واضحة.\n4) العرض (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: ينظم عرضًا سريعًا.\n   دور الطالب: يعرضون أعمالهم ويقيّمها الزملاء.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يسأل: ما التغيير الذي ستبدأ به اليو \n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورتين ويطرح السؤال.\n   دور الطالب: يستنتجون أن الأولى طبيعية والثانية من صنع الإنسان.\n2) تصنيف الكوارث (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يعرض بطاقات (زلزال، تسرب نفط، فيضان، حريق غابة بسبب الإنسان...).\n   دور الطالب: يصنفونها في جدول: طبيعية / من صنع الإنسان.\n3) أنشطة الإنسان (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يدير عصفًا ذهنيًا: المركبات، المصانع، البيوت، المزارع، الصيد.\n   دور الطالب: يكتبون أثر كل نشاط على الهواء أو الماء أو اليابسة.\n4) قراءة ص46 والسؤالان 1 و3 (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يجيبون: جميع أنشطة الإنسان تؤثر على البيئة بشكل مفيد أو ضار.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (آثار التلوث حول المدرسة (نشاط 6-2)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يجمع التوقعات.\n   دور الطالب: يتوقعون أنواع النفايات.\n2) السلامة والتخطيط (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يؤكد لبس القفازات وعدم لمس الأشياء الحادة، ويوزع المناطق.\n   دور الطالب: يجهزون جدول تسجيل: نوع النفاية، مكانها، سببها.\n3) تنفيذ نشاط 6-2 (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يرافقهم ويلتقط صورًا قبل الجمع وبعده.\n   دور الطالب: يجمعون النفايات ويسجلونها ويرسمون آثار التلوث وأسبابها.\n4) المقارنة (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يعرض صور قبل وبعد.\n   دور الطالب: يقارنون ويحددون أكثر أنواع النفايات تكرارًا وسببها.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل: من المسؤول عن نظافة الساحة؟\n   دور الطالب: يستنتجون أن السلوك الفردي يصنع الفرق.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (آثار إيجابية وآثار سلبية (تمرين 6-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورتين.\n   دور الطالب: يقارنون ويبررون.\n2) الآثار الإيجابية (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوضح حماية الحيوانات المهددة وإنشاء المحميات وزراعة الأشجار.\n   دور الطالب: يذكرون أمثلة إيجابية من بيئتهم.\n3) الآثار السلبية (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يوضح تلويث الهواء والماء وقطع الغابات المطيرة الذي يدمر مواطن الكائنات.\n   دور الطالب: يربطون كل أثر بالكائنات المتضررة.\n4) تمرين 6-2 (ص28) (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يوجه إلى اقتراح طرق للحد من التلوث.\n   دور الطالب: يقترحون حلولًا لدخان المصانع وقطع الأشجار ورمي النفايات في الماء.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يقيّم بالمعايير: أستطيع التحدث عن الآثار السلبية والإيجابية.\n   دور الطالب: يقيّمون أنفسهم ذاتيًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (حلول عملية للحد من التلوث):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يناقشون هدر الطعام وأثره.\n2) تحديد مشكلة (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يطلب من كل مجموعة اختيار مشكلة: هدر الطعام، رمي النفايات، ترك الأضواء مضاءة، دخان مصنع قريب.\n   دور الطالب: يختارون المشكلة ويحددون أسبابها.\n3) تصميم الحل (17 دقائق، من الدقيقة 13 إلى 30):\n   دور المعلم: يتابع المجموعات ويقترح أشكالًا: ملصق، رسالة إلى مدير المصنع، قاعدة صفية.\n   دور الطالب: يصممون الملصق أو يكتبون الرسالة بحلول واضحة.\n4) العرض (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: ينظم عرضًا سريعًا.\n   دور الطالب: يعرضون أعمالهم ويقيّمها الزملاء.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يسأل: ما التغيير الذي ستبدأ به اليوم؟\n   دور الطالب: يكتب كل طالب التزامًا بيئيًا واحدًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (سلوكي الفردي يحمي البيئة):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويسجل النتيجة.\n   دور الطالب: يصوتون ويبررون.\n2) رحلة التلفاز (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يرسم مخططًا: الصناعة ← الشحن ← التشغيل بالكهرباء ← التخلص منه.\n   دور الطالب: يحددون أثر كل مرحلة على البيئة.\n3) تصحيح المفاهيم (8 دقائق، من الدقيقة 15 إلى 23):\n   دور المعلم: يناقش: «التلوث مشكلة الآخرين»، «التغييرات الصغيرة لا تفيد».\n   دور الطالب: يحكمون على العبارات ويصححونها.\n4) مسابقة المجموعات (12 دقائق، من الدقيقة 23 إلى 35):\n   دور المعلم: يشغّل مسابقة الدرس 6-2.\n   دور الطالب: يتنافسون في مجموعات.\n5) الغلق والتقويم الذاتي (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يقيّمون فهمهم بإشارات المرور.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (أنشطة الإنسان والبيئة):\n1) [مستوى الدعم] اذكر نشاطًا للإنسان يلوث الهواء.\n   الإجابة النموذجية: دخان المركبات أو المصانع.\n2) [المستوى المتوقع] هل الزلزال من صنع الإنسان؟\n   الإجابة النموذجية: لا، كارثة طبيعية.\n3) [المستوى المتقدم] لماذا يعد تسرب النفط كارثة من صنع الإنسان؟\n   الإجابة النموذجية: لأنه ينتج عن نقل الإنسان للنفط واستخدامه.\n\nالحصة 2 (آثار التلوث حول المدرسة (نشاط 6-2)):\n1) [مستوى الدعم] ما أكثر نوع نفايات وجدته في الساحة؟\n   الإجابة النموذجية: بقايا الطعام أو أغلفة الحلويات أو العبوات (إجابات متنوعة).\n2) [المستوى المتوقع] لماذا لبسنا القفازات؟\n   الإجابة النموذجية: لحماية أيدينا من الجراثيم والأشياء الحادة.\n3) [المستوى المتقدم] ما سبب وجود النفايات في الساحة؟\n   الإجابة النموذجية: رمي الناس النفايات في غير أماكنها.\n\nالحصة 3 (آثار إيجابية وآثار سلبية (تمرين 6-2)):\n1) [مستوى الدعم] اذكر أثرًا إيجابيًا للإنسان على البيئة.\n   الإجابة النموذجية: حماية الحيوانات المهددة بالانقراض أو إنشاء المحميات.\n2) [المستوى المتوقع] اذكر أثرًا سلبيًا للإنسان على البيئة.\n   الإجابة النموذجية: تلويث الماء والهواء أو قطع الأشجار.\n3) [المستوى المتقدم] كيف يؤدي قطع الغابات إلى نقص الحيوانات؟\n   الإجابة النموذجية: لأنه يدمر مواطنها فلا تجد غذاءها ومأواها.\n\nالحصة 4 (حلول عملية للحد من التلوث):\n1) [مستوى الدعم] ما المشكلة التي اخترتها مجموعتك؟\n   الإجابة النموذجية: إجابات متنوعة (هدر الطعام، رمي النفايات...).\n2) [المستوى المتوقع] اذكر حلًا لمشكلة هدر الطعام.\n   الإجابة النموذجية: أخذ كمية مناسبة وإعطاء البقايا للحيوانات أو صنع سماد منها.\n3) [المستوى المتقدم] لماذا نطفئ الأضواء عند الخروج؟\n   الإجابة النموذجية: لتوفير الكهرباء وتقليل التلوث الناتج عن إنتاجها.\n\nالحصة 5 (سلوكي الفردي يحمي البيئة):\n1) [مستوى الدعم] كيف يلوث التلفاز البيئة أثناء تشغيله؟\n   الإجابة النموذجية: باستهلاك الكهرباء التي قد ينتج عن توليدها تلوث الهواء.\n2) [المستوى المتوقع] صحّح: «تلوث البيئة مشكلة الآخرين وليس لي دخل بها».\n   الإجابة النموذجية: لكل فرد دور، فاستخدامنا للأجهزة والنفايات يؤثر على البيئة.\n3) [المستوى المتقدم] لماذا تحدث التغييرات الصغيرة فرقًا كبيرًا؟\n   الإجابة النموذجية: لأنها عندما يكررها كثير من الناس تتجمع وتصنع أثرًا كبيرًا.", "الحصة 1 (أنشطة الإنسان والبيئة):\n1) [مستوى الدعم] اذكر مثالًا على كارثة طبيعية.\n   الإجابة النموذجية: الزلزال أو الفيضان.\n2) [المستوى المتوقع] كيف يؤثر الصيد الجائر على البيئة؟\n   الإجابة النموذجية: يقلل أعداد الأسماك والحيوانات وقد يهددها بالانقراض.\n3) [المستوى المتقدم] هل كل أنشطة الإنسان ضارة؟ وضّح بمثال.\n   الإجابة النموذجية: لا، بعضها مفيد مثل حماية الحيوانات المهددة بالانقراض وزراعة الأشجار.\n\nالحصة 2 (آثار التلوث حول المدرسة (نشاط 6-2)):\n1) [مستوى الدعم] كيف أصبحت الساحة بعد جمع النفايات؟\n   الإجابة النموذجية: أنظف وأجمل.\n2) [المستوى المتوقع] اذكر أثرًا ضارًا للنفايات على الحيوانات.\n   الإجابة النموذجية: قد تأكلها الحيوانات أو تعلق بها فتمرض أو تموت.\n3) [المستوى المتقدم] اقترح قاعدة صفية تقلل النفايات في الساحة.\n   الإجابة النموذجية: مثل: «كل طالب يعيد نفايته إلى السلة» أو وضع سلال ملونة.\n\nالحصة 3 (آثار إيجابية وآثار سلبية (تمرين 6-2)):\n1) [مستوى الدعم] ماذا نسمّي المكان الذي تُحمى فيه الحيوانات؟\n   الإجابة النموذجية: المحمية الطبيعية.\n2) [المستوى المتوقع] اقترح حلًا لتلوث الهواء من المصانع.\n   الإجابة النموذجية: تركيب مرشحات للدخان أو استخدام طاقة نظيفة.\n3) [المستوى المتقدم] وازن بين فائدة بناء مصنع جديد وضرره على البيئة.\n   الإجابة النموذجية: يوفر منتجات وأعمالًا، لكنه قد يلوث الهواء والماء؛ لذا يجب تقليل التلوث بوسائل الحماية.\n\nالحصة 4 (حلول عملية للحد من التلوث):\n1) [مستوى الدعم] اكتب عبارة توعوية قصيرة عن البيئة.\n   الإجابة النموذجية: مثل: «بيئتي نظيفة بيدي» (إجابات متنوعة).\n2) [المستوى المتوقع] كيف يساعد ملصقك على حل المشكلة؟\n   الإجابة النموذجية: يذكّر الناس بالسلوك الصحيح فيغيرون عاداتهم.\n3) [المستوى المتقدم] اقترح طريقة لقياس نجاح حملتك في المدرسة.\n   الإجابة النموذجية: عدّ النفايات في الساحة قبل الحملة وبعدها ومقارنتها.\n\nالحصة 5 (سلوكي الفردي يحمي البيئة):\n1) [مستوى الدعم] اذكر مرحلة من رحلة المنتج تلوث البيئة.\n   الإجابة النموذجية: الصناعة أو الشحن أو التشغيل أو التخلص منه.\n2) [المستوى المتوقع] اذكر تغييرًا صغيرًا تقوم به لحماية البيئة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة أو عدم رمي النفايات (إجابات متنوعة).\n3) [المستوى المتقدم] اقترح طريقة لتقليل أثر الأجهزة الكهربائية على البيئة.\n   الإجابة النموذجية: إطفاؤها بعد الاستخدام، وإصلاحها بدل رميها، واختيار أجهزة موفرة للطاقة.", "الحصة 1 (أنشطة الإنسان والبيئة):\nإرشاد الطالب: قراءة ص46 والإجابة عن السؤالين 1 و3. إرشاد ولي الأمر: مناقشة ابنكم في نشاط واحد في البيت يؤثر على البيئة وكيف نحسّنه.\n\nالحصة 2 (آثار التلوث حول المدرسة (نشاط 6-2)):\nإرشاد الطالب: عدّ أنواع النفايات التي ينتجها منزله في يوم واحد. إرشاد ولي الأمر: مساعدة ابنكم في تسجيل نفايات المنزل لمدة يوم.\n\nالحصة 3 (آثار إيجابية وآثار سلبية (تمرين 6-2)):\nإرشاد الطالب: إكمال تمرين 6-2 ص28. إرشاد ولي الأمر: زيارة محمية أو متنزه طبيعي مع ابنكم إن أمكن والحديث عن أهميته.\n\nالحصة 4 (حلول عملية للحد من التلوث):\nإرشاد الطالب: الإجابة عن السؤال 2 ص47 بأفكاره الخاصة وتطبيق التزامه البيئي في البيت. إرشاد ولي الأمر: تشجيع ابنكم على ترشيد الكهرباء والماء في المنزل.\n\nالحصة 5 (سلوكي الفردي يحمي البيئة):\nإرشاد الطالب: مراجعة الدرس ص46–47 وتمرين 6-2. إرشاد ولي الأمر: الاتفاق مع ابنكم على عادة بيئية أسبوعية في المنزل."]}, {"id": "7-2", "title": "الماء الرائع", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع التاسع (1–5/11/2026)", "sb": "48–49", "ab": "29، ورقة العمل 7-2 ص55", "tg": "46–48", "periods": [{"axis": "أهمية الماء العذب واستخداماته", "h": {"lesson": "7-2 الماء الرائع", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع التاسع (1–5/11/2026)", "sb": "48", "ab": "55", "tg": "46–48", "n": "1 من 5", "axis": "أهمية الماء العذب واستخداماته"}, "f": ["1. يذكر استخدامات الإنسان للماء العذب في حياته اليومية.\nمخرج تعليمي آخر (2): يقدّر كميات الماء المستخدمة يوميًا ويقترح طرقًا لترشيدها.", "المخرج 1 (يذكر استخدامات الإنسان للماء العذب في حياته اليومية): تذكر\nالمخرج 2 (يقدّر كميات الماء المستخدمة يوميًا ويقترح طرقًا لترشيدها): تقييم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: العصف الذهني.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية", "الماء العذب، الاستهلاك، الترشيد، اللتر.", "يسأل المعلم: كم مرة استخدمت الماء منذ استيقاظك اليوم؟ في ماذا؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يجمع استخدامات الماء في خريطة ذهنية.\n   دور الطالب: يعددون: الشرب، الوضوء، الغسيل، الطبخ...\n2) الماء والكائنات الحية (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يوضح أن جميع الحيوانات والنباتات تحتاج الماء العذب.\n   دور الطالب: يعددون حيوانات ونباتات تحتاج الماء العذب.\n3) ورقة العمل 7-2 (14 دقائق، من الدقيقة 13 إلى 27):\n   دور المعلم: يوجه إلى تقدير كمية الماء لكل استخدام في اليوم.\n   دور الطالب: يكتبون في الفقاعات حول الفتاة تقديرًا للماء: الشرب، الطبخ، التنظيف، الاستحمام، غسل الثياب، الحيوانات، النباتات.\n4) الترشيد (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش أكثر الاستخدامات استهلاكًا وطرق تقليلها.\n   دور الطالب: يقترحون: إغلاق الصنبور، إعادة استخدام ماء غسل الخضار لري النباتات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر ثلاثة استخدامات للماء العذب.\n   الإجابة النموذجية: الشرب، الطبخ، التنظيف (أو الاستحمام، الري).\n2) [المستوى المتوقع] لماذا تحتاج النباتات والحيوانات الماء العذب؟\n   الإجابة النموذجية: لتعيش وتنمو، فلا حياة دون ماء.\n3) [المستوى المتقدم] أي الاستخدامات اليومية يستهلك أكبر كمية من الماء غالبًا؟\n   الإجابة النموذجية: الاستحمام وغسل الثياب.", "1) [مستوى الدعم] ما نوع الماء الذي نشربه؟\n   الإجابة النموذجية: الماء العذب.\n2) [المستوى المتوقع] اقترح طريقة لترشيد الماء في البيت.\n   الإجابة النموذجية: إغلاق الصنبور أثناء تنظيف الأسنان أو إعادة استخدام الماء لري النبات.\n3) [المستوى المتقدم] لماذا يجب علينا ترشيد الماء في سلطنة عُمان خاصة؟\n   الإجابة النموذجية: لأن مصادر الماء العذب محدودة والأمطار قليلة.", "إرشاد الطالب: سؤال أفراد الأسرة عن طرق استخدامهم للماء العذب وتسجيلها. إرشاد ولي الأمر: مساعدة ابنكم في تقدير استهلاك الأسرة للماء يومًا واحدًا."]}, {"axis": "الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)", "h": {"lesson": "7-2 الماء الرائع", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع التاسع (1–5/11/2026)", "sb": "48", "ab": "—", "tg": "46–48", "n": "2 من 5", "axis": "الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)"}, "f": ["1. يوضح أهمية الأنهار والأفلاج للإنسان والحيوان والزراعة.\nمخرج تعليمي آخر (2): يحدد آثارًا ضارة يسببها الإنسان على مصادر المياه.", "المخرج 1 (يوضح أهمية الأنهار والأفلاج للإنسان والحيوان والزراعة): فهم\nالمخرج 2 (يحدد آثارًا ضارة يسببها الإنسان على مصادر المياه): تطبيق", "• التعلم المبني على المشاريع\n• التعلم التعاوني\n• التعلم بالاكتشاف", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: ورقة كبيرة، أقلام حبر ورصاص، أقلام تلوين، صور أفلاج عُمانية.", "النهر، الفلج، الري، السد، التلوث.", "يعرض المعلم صورة فلج عُماني ويسأل: من يستفيد من ماء الفلج؟ وما الذي قد يلوثه؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض صورة الفلج.\n   دور الطالب: يذكرون المستفيدين: الإنسان، الحيوان، المزارع.\n2) توجيه النشاط (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يشرح تصميم نهر أو فلج على ورقة كبيرة بمواقع مختلفة: المنبع، القرية، المزرعة، المصنع.\n   دور الطالب: يوزعون المهام في المجموعة.\n3) تنفيذ نشاط 7-2أ (16 دقائق، من الدقيقة 11 إلى 27):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: يرسمون النهر أو الفلج ويضعون علامات خضراء للفوائد وحمراء للآثار الضارة.\n4) العرض والمناقشة (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش أثر السدود وأثر رمي المخلفات.\n   دور الطالب: يعرضون التصميم ويشرحون الفوائد والأضرار.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر فائدتين للفلج.\n   الإجابة النموذجية: مياه الشرب وري المزارع.\n2) [المستوى المتوقع] اذكر نشاطًا للإنسان يلوث ماء النهر.\n   الإجابة النموذجية: رمي المخلفات أو تصريف مياه المصانع.\n3) [المستوى المتقدم] كيف يؤثر بناء سد على الحيوانات في النهر؟\n   الإجابة النموذجية: قد يغيّر جريان الماء ويقتل أعدادًا كبيرة من الحيوانات والنباتات.", "1) [مستوى الدعم] من يستفيد من ماء النهر؟\n   الإجابة النموذجية: الإنسان والحيوان والنبات.\n2) [المستوى المتوقع] لماذا وضعت علامة حمراء عند المصنع في تصميمك؟\n   الإجابة النموذجية: لأن مخلفاته قد تلوث الماء.\n3) [المستوى المتقدم] اقترح قانونًا يحمي الأفلاج من التلوث.\n   الإجابة النموذجية: منع رمي النفايات فيها ومعاقبة من يلوثها (إجابات منطقية).", "إرشاد الطالب: قراءة ص48 والإجابة عن السؤال 1. إرشاد ولي الأمر: زيارة فلج قريب مع ابنكم إن أمكن ومناقشة أهميته والمحافظة عليه."]}, {"axis": "تنقية الماء بالترشيح (نشاط 7-2ب)", "h": {"lesson": "7-2 الماء الرائع", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع التاسع (1–5/11/2026)", "sb": "49", "ab": "—", "tg": "46–48", "n": "3 من 5", "axis": "تنقية الماء بالترشيح (نشاط 7-2ب)"}, "f": ["1. يفصل الرمل عن الماء باستخدام القمع وورق الترشيح.\nمخرج تعليمي آخر (2): يستنتج أن الماء الذي يبدو نظيفًا قد يحتوي على جراثيم أو مواد ضارة.", "المخرج 1 (يفصل الرمل عن الماء باستخدام القمع وورق الترشيح): تطبيق\nالمخرج 2 (يستنتج أن الماء الذي يبدو نظيفًا قد يحتوي على جراثيم أو مواد ضارة): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: كأسان، قمع، ورق ترشيح، ماء الصنبور، رمل، أعواد للتحريك.", "الترشيح، ورق الترشيح، القمع، الماء الملوث، الماء النظيف.", "يعرض المعلم كأسًا فيه ماء ورمل ويسأل: كيف نعيد هذا الماء صافيًا؟ ويؤكد قاعدة السلامة: لا نشرب الماء في التجربة.", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض الكأس ويطرح السؤال.\n   دور الطالب: يقترحون طرقًا للتنقية.\n2) التوقع والتخطيط (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يطلب كتابة السؤال والتوقع والأدوات.\n   دور الطالب: يكتبون: هل يفصل ورق الترشيح الرمل عن الماء؟\n3) تنفيذ نشاط 7-2ب (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يتابع تركيب القمع وورق الترشيح.\n   دور الطالب: يلاحظون ماء الصنبور، يخلطونه بالرمل، ثم يرشحونه ويجمعون الماء في كأس ويسجلون التغيرات.\n4) التفسير (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يسأل: هل أصبح الماء صالحًا للشرب؟ لماذا؟\n   دور الطالب: يستنتجون أن الترشيح يزيل الرمل لكنه لا يزيل الجراثيم أو المواد الذائبة.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يكتبون استنتاجًا.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما الأدوات التي استخدمتها لفصل الرمل عن الماء؟\n   الإجابة النموذجية: القمع وورق الترشيح.\n2) [المستوى المتوقع] أين بقي الرمل بعد الترشيح؟\n   الإجابة النموذجية: على ورق الترشيح.\n3) [المستوى المتقدم] هل الماء بعد الترشيح صالح للشرب؟ فسّر.\n   الإجابة النموذجية: لا، فقد يحتوي على جراثيم أو مواد كيميائية لا يزيلها الترشيح.", "1) [مستوى الدعم] ماذا نسمّي طريقة فصل الرمل عن الماء بورق الترشيح؟\n   الإجابة النموذجية: الترشيح.\n2) [المستوى المتوقع] لماذا لا نشرب الماء في التجربة؟\n   الإجابة النموذجية: لأنه قد يكون ملوثًا وغير آمن.\n3) [المستوى المتقدم] كيف تنظف شركات المياه ماء الشرب بطريقة أفضل من تجربتنا؟\n   الإجابة النموذجية: باستخدام مراحل أكثر للترشيح وقتل الجراثيم بمواد خاصة.", "إرشاد الطالب: كتابة خطوات نشاط 7-2ب ونتيجته في الدفتر. إرشاد ولي الأمر: توضيح أهمية شرب الماء من مصادر آمنة ونظيفة."]}, {"axis": "أثر التلوث على حيوانات الماء (تمرين 7-2)", "h": {"lesson": "7-2 الماء الرائع", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع التاسع (1–5/11/2026)", "sb": "49", "ab": "29", "tg": "46–48", "n": "4 من 5", "axis": "أثر التلوث على حيوانات الماء (تمرين 7-2)"}, "f": ["1. يحلل بيانات أعداد الحيوانات في أماكن مختلفة من الماء ويربطها بمصادر التلوث.\nمخرج تعليمي آخر (2): يوضح أثر تلوث البحار والأنهار على الكائنات الحية.", "المخرج 1 (يحلل بيانات أعداد الحيوانات في أماكن مختلفة من الماء ويربطها بمصادر التلوث): تحليل\nالمخرج 2 (يوضح أثر تلوث البحار والأنهار على الكائنات ا
