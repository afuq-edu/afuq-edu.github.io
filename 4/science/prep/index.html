\n\nالحصة 2 (الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)):\nالنهر، الفلج، الري، السد، التلوث.\n\nالحصة 3 (تنقية الماء بالترشيح (نشاط 7-2ب)):\nالترشيح، ورق الترشيح، القمع، الماء الملوث، الماء النظيف.\n\nالحصة 4 (أثر التلوث على حيوانات الماء (تمرين 7-2)):\nالتلوث، مردم النفايات، المزرعة، الكائنات المائية.\n\nالحصة 5 (اختبار ترشيح ملوثات مختلفة):\nالاختبار العادل، الملوث، الماء النظيف، الصحة.", "الحصة 1 (أهمية الماء العذب واستخداماته):\nيسأل المعلم: كم مرة استخدمت الماء منذ استيقاظك اليوم؟ في ماذا؟\n\nالحصة 2 (الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)):\nيعرض المعلم صورة فلج عُماني ويسأل: من يستفيد من ماء الفلج؟ وما الذي قد يلوثه؟\n\nالحصة 3 (تنقية الماء بالترشيح (نشاط 7-2ب)):\nيعرض المعلم كأسًا فيه ماء ورمل ويسأل: كيف نعيد هذا الماء صافيًا؟ ويؤكد قاعدة السلامة: لا نشرب الماء في التجربة.\n\nالحصة 4 (أثر التلوث على حيوانات الماء (تمرين 7-2)):\nيسأل المعلم: لو رُميت مواد خطيرة في البحر، ماذا يحدث للأسماك؟\n\nالحصة 5 (اختبار ترشيح ملوثات مختلفة):\nيسأل المعلم: هل ينجح ورق الترشيح مع الشاي كما نجح مع الرمل؟ ويطلب توقعًا.", "الحصة 1 (أهمية الماء العذب واستخداماته):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يجمع استخدامات الماء في خريطة ذهنية.\n   دور الطالب: يعددون: الشرب، الوضوء، الغسيل، الطبخ...\n2) الماء والكائنات الحية (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يوضح أن جميع الحيوانات والنباتات تحتاج الماء العذب.\n   دور الطالب: يعددون حيوانات ونباتات تحتاج الماء العذب.\n3) ورقة العمل 7-2 (14 دقائق، من الدقيقة 13 إلى 27):\n   دور المعلم: يوجه إلى تقدير كمية الماء لكل استخدام في اليوم.\n   دور الطالب: يكتبون في الفقاعات حول الفتاة تقديرًا للماء: الشرب، الطبخ، التنظيف، الاستحمام، غسل الثياب، الحيوانات، النباتات.\n4) الترشيد (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش أكثر الاستخدامات استهلاكًا وطرق تقليلها.\n   دور الطالب: يقترحون: إغلاق الصنبور، إعادة استخدام ماء غسل الخضار لري النباتات.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض صورة الفلج.\n   دور الطالب: يذكرون المستفيدين: الإنسان، الحيوان، المزارع.\n2) توجيه النشاط (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يشرح تصميم نهر أو فلج على ورقة كبيرة بمواقع مختلفة: المنبع، القرية، المزرعة، المصنع.\n   دور الطالب: يوزعون المهام في المجموعة.\n3) تنفيذ نشاط 7-2أ (16 دقائق، من الدقيقة 11 إلى 27):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: يرسمون النهر أو الفلج ويضعون علامات خضراء للفوائد وحمراء للآثار الضارة.\n4) العرض والمناقشة (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يناقش أثر السدود وأثر رمي المخلفات.\n   دور الطالب: يعرضون التصميم ويشرحون الفوائد والأضرار.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (تنقية الماء بالترشيح (نشاط 7-2ب)):\n1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض الكأس ويطرح السؤال.\n   دور الطالب: يقترحون طرقًا للتنقية.\n2) التوقع والتخطيط (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يطلب كتابة السؤال والتوقع والأدوات.\n   دور الطالب: يكتبون: هل يفصل ورق الترشيح الرمل عن الماء؟\n3) تنفيذ نشاط 7-2ب (16 دقائق، من الدقيقة 10 إلى 26):\n   دور المعلم: يتابع تركيب القمع وورق الترشيح.\n   دور الطالب: يلاحظون ماء الصنبور، يخلطونه بالرمل، ثم يرشحونه ويجمعون الماء في كأس ويسجلون التغيرات.\n4) التفسير (9 دقائق، من الدقيقة 26 إلى 35):\n   دور المعلم: يسأل: هل أصبح الماء صالحًا للشرب؟ لماذا؟\n   دور الطالب: يستنتجون أن الترشيح يزيل الرمل لكنه لا يزيل الجراثيم أو المواد الذائبة.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يكتبون استنتاجًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (أثر التلوث على حيوانات الماء (تمرين 7-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يتوقعون الضرر.\n2) تمرين 7-2 (ص29) (12 دقائق، من الدقيقة 5 إلى 17):\n   دور المعلم: يوجه إلى قراءة البيانات.\n   دور الطالب: يحددون مكان وجود أكثر الحيوانات وأقلها، ويسمّون حيوانات مثل اليعسوب والحلزون، ويفسرون بوفرة الغذاء أو التلوث.\n3) أسئلة الكتاب 1–3 ص49 (10 دقائق، من الدقيقة 17 إلى 27):\n   دور المعلم: يناقش أثر التلوث.\n   دور الطالب: يجيبون: رمي المواد الخطيرة يسمم الحياة البحرية، وقد يسبب المرض وعدم القدرة على التكاثر والموت.\n4) اقتراح حلول (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يطلب اقتراح إجراءات لحماية الأفلاج.\n   دور الطالب: يقترحون: تنظيف الأفلاج، معرفة مصادر التلوث، التواصل مع المسؤولين.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (اختبار ترشيح ملوثات مختلفة):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يجمع التوقعات.\n   دور الطالب: يتوقعون النتائج لكل ملوث.\n2) تخطيط الاختبار العادل (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يناقش: ما الذي نغيره (نوع الملوث)؟ ما الثابت (كمية الماء، القمع، ورق الترشيح)؟\n   دور الطالب: يكتبون الخطة وجدول النتائج.\n3) التنفيذ أو العرض (12 دقائق، من الدقيقة 13 إلى 25):\n   دور المعلم: ينفذ عرضًا عمليًا أو تنفذه المجموعات بإشرافه.\n   دور الطالب: يلاحظون ويسجلون: الرمل يُفصل، الشاي يمر لونه مع الماء.\n4) الماء النظيف للجميع (5 دقائق، من الدقيقة 25 إلى 30):\n   دور المعلم: يناقش أن كثيرًا من الناس في العالم لا يحصلون على ماء نظيف للشرب.\n   دور الطالب: يقترحون طرقًا لتقدير نعمة الماء.\n5) مسابقة المجموعات (10 دقائق، من الدقيقة 30 إلى 40):\n   دور المعلم: يشغّل مسابقة الدرس 7-2.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (أهمية الماء العذب واستخداماته):\n1) [مستوى الدعم] اذكر ثلاثة استخدامات للماء العذب.\n   الإجابة النموذجية: الشرب، الطبخ، التنظيف (أو الاستحمام، الري).\n2) [المستوى المتوقع] لماذا تحتاج النباتات والحيوانات الماء العذب؟\n   الإجابة النموذجية: لتعيش وتنمو، فلا حياة دون ماء.\n3) [المستوى المتقدم] أي الاستخدامات اليومية يستهلك أكبر كمية من الماء غالبًا؟\n   الإجابة النموذجية: الاستحمام وغسل الثياب.\n\nالحصة 2 (الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)):\n1) [مستوى الدعم] اذكر فائدتين للفلج.\n   الإجابة النموذجية: مياه الشرب وري المزارع.\n2) [المستوى المتوقع] اذكر نشاطًا للإنسان يلوث ماء النهر.\n   الإجابة النموذجية: رمي المخلفات أو تصريف مياه المصانع.\n3) [المستوى المتقدم] كيف يؤثر بناء سد على الحيوانات في النهر؟\n   الإجابة النموذجية: قد يغيّر جريان الماء ويقتل أعدادًا كبيرة من الحيوانات والنباتات.\n\nالحصة 3 (تنقية الماء بالترشيح (نشاط 7-2ب)):\n1) [مستوى الدعم] ما الأدوات التي استخدمتها لفصل الرمل عن الماء؟\n   الإجابة النموذجية: القمع وورق الترشيح.\n2) [المستوى المتوقع] أين بقي الرمل بعد الترشيح؟\n   الإجابة النموذجية: على ورق الترشيح.\n3) [المستوى المتقدم] هل الماء بعد الترشيح صالح للشرب؟ فسّر.\n   الإجابة النموذجية: لا، فقد يحتوي على جراثيم أو مواد كيميائية لا يزيلها الترشيح.\n\nالحصة 4 (أثر التلوث على حيوانات الماء (تمرين 7-2)):\n1) [مستوى الدعم] ما مصدر تلوث البحار في السؤال 1؟\n   الإجابة النموذجية: رمي المواد الخطيرة التي تسمم الحياة فيها.\n2) [المستوى المتوقع] اذكر أثرًا للتلوث على الحيوانات المائية.\n   الإجابة النموذجية: المرض أو عدم القدرة على التكاثر أو الموت.\n3) [المستوى المتقدم] لماذا قلّت الحيوانات قرب مردم النفايات؟\n   الإجابة النموذجية: لأن الماء هناك ملوث بالمخلفات.\n\nالحصة 5 (اختبار ترشيح ملوثات مختلفة):\n1) [مستوى الدعم] ما الشيء الذي غيّرناه في الاختبار؟\n   الإجابة النموذجية: نوع الملوث.\n2) [المستوى المتوقع] هل أزال الترشيح لون الشاي؟\n   الإجابة النموذجية: لا، لأن الشاي ذائب في الماء.\n3) [المستوى المتقدم] لماذا يجب أن تكون كمية الماء متساوية في كل مرة؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا.", "الحصة 1 (أهمية الماء العذب واستخداماته):\n1) [مستوى الدعم] ما نوع الماء الذي نشربه؟\n   الإجابة النموذجية: الماء العذب.\n2) [المستوى المتوقع] اقترح طريقة لترشيد الماء في البيت.\n   الإجابة النموذجية: إغلاق الصنبور أثناء تنظيف الأسنان أو إعادة استخدام الماء لري النبات.\n3) [المستوى المتقدم] لماذا يجب علينا ترشيد الماء في سلطنة عُمان خاصة؟\n   الإجابة النموذجية: لأن مصادر الماء العذب محدودة والأمطار قليلة.\n\nالحصة 2 (الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)):\n1) [مستوى الدعم] من يستفيد من ماء النهر؟\n   الإجابة النموذجية: الإنسان والحيوان والنبات.\n2) [المستوى المتوقع] لماذا وضعت علامة حمراء عند المصنع في تصميمك؟\n   الإجابة النموذجية: لأن مخلفاته قد تلوث الماء.\n3) [المستوى المتقدم] اقترح قانونًا يحمي الأفلاج من التلوث.\n   الإجابة النموذجية: منع رمي النفايات فيها ومعاقبة من يلوثها (إجابات منطقية).\n\nالحصة 3 (تنقية الماء بالترشيح (نشاط 7-2ب)):\n1) [مستوى الدعم] ماذا نسمّي طريقة فصل الرمل عن الماء بورق الترشيح؟\n   الإجابة النموذجية: الترشيح.\n2) [المستوى المتوقع] لماذا لا نشرب الماء في التجربة؟\n   الإجابة النموذجية: لأنه قد يكون ملوثًا وغير آمن.\n3) [المستوى المتقدم] كيف تنظف شركات المياه ماء الشرب بطريقة أفضل من تجربتنا؟\n   الإجابة النموذجية: باستخدام مراحل أكثر للترشيح وقتل الجراثيم بمواد خاصة.\n\nالحصة 4 (أثر التلوث على حيوانات الماء (تمرين 7-2)):\n1) [مستوى الدعم] اذكر حيوانًا يعيش في الماء العذب.\n   الإجابة النموذجية: اليعسوب أو الحلزون أو السمك.\n2) [المستوى المتوقع] ماذا يحدث للإنسان إذا شرب ماءً ملوثًا؟\n   الإجابة النموذجية: قد يمرض.\n3) [المستوى المتقدم] اقترح خطة من خطوتين لحماية فلج قريب من التلوث.\n   الإجابة النموذجية: تنظيفه دوريًا، ومنع رمي المخلفات فيه وتوعية الناس.\n\nالحصة 5 (اختبار ترشيح ملوثات مختلفة):\n1) [مستوى الدعم] اذكر ملوثًا يفصله ورق الترشيح بسهولة.\n   الإجابة النموذجية: الرمل.\n2) [المستوى المتوقع] اذكر شيئًا أبقيته ثابتًا في اختبارك.\n   الإجابة النموذجية: كمية الماء أو نوع ورق الترشيح أو القمع.\n3) [المستوى المتقدم] ماذا تستنتج عن حدود الترشيح في تنقية الماء؟\n   الإجابة النموذجية: يزيل المواد غير الذائبة فقط، ولا يزيل المواد الذائبة أو الجراثيم.", "الحصة 1 (أهمية الماء العذب واستخداماته):\nإرشاد الطالب: سؤال أفراد الأسرة عن طرق استخدامهم للماء العذب وتسجيلها. إرشاد ولي الأمر: مساعدة ابنكم في تقدير استهلاك الأسرة للماء يومًا واحدًا.\n\nالحصة 2 (الأنهار والأفلاج: فوائد وأخطار (نشاط 7-2أ)):\nإرشاد الطالب: قراءة ص48 والإجابة عن السؤال 1. إرشاد ولي الأمر: زيارة فلج قريب مع ابنكم إن أمكن ومناقشة أهميته والمحافظة عليه.\n\nالحصة 3 (تنقية الماء بالترشيح (نشاط 7-2ب)):\nإرشاد الطالب: كتابة خطوات نشاط 7-2ب ونتيجته في الدفتر. إرشاد ولي الأمر: توضيح أهمية شرب الماء من مصادر آمنة ونظيفة.\n\nالحصة 4 (أثر التلوث على حيوانات الماء (تمرين 7-2)):\nإرشاد الطالب: إكمال تمرين 7-2 ص29 والإجابة عن الأسئلة 1–3 ص49. إرشاد ولي الأمر: الحديث مع ابنكم عن عدم رمي المخلفات في الأودية والشواطئ.\n\nالحصة 5 (اختبار ترشيح ملوثات مختلفة):\nإرشاد الطالب: مراجعة الدرس ص48–49 والتفكير في طرق شكر نعمة الماء. إرشاد ولي الأمر: تشجيع ابنكم على ترشيد الماء في الوضوء والاستحمام."]}, {"id": "8-2", "title": "إعادة التدوير تحمي الأرض", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع العاشر (8–12/11/2026)", "sb": "50–51", "ab": "30", "tg": "48–51", "periods": [{"axis": "نفايات المنزل: التقليل وإعادة الاستخدام وإعادة التدوير", "h": {"lesson": "8-2 إعادة التدوير تحمي الأرض", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع العاشر (8–12/11/2026)", "sb": "50", "ab": "—", "tg": "48–51", "n": "1 من 5", "axis": "نفايات المنزل: التقليل وإعادة الاستخدام وإعادة التدوير"}, "f": ["1. يحدد ما يدخل المنزل من موارد وما يخرج منه من نفايات.\nمخرج تعليمي آخر (2): يميّز بين التقليل وإعادة الاستخدام وإعادة التدوير.", "المخرج 1 (يحدد ما يدخل المنزل من موارد وما يخرج منه من نفايات): تطبيق\nالمخرج 2 (يميّز بين التقليل وإعادة الاستخدام وإعادة التدوير): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: العصف الذهني.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: أقلام تلوين بلونين.", "النفايات، التقليل، إعادة الاستخدام، إعادة التدوير، المردم.", "يطلب المعلم من الطلاب رسم منزل مع أسهم بلون للأشياء الداخلة (الماء، الطعام، الورق، الكهرباء) وأسهم بلون آخر للنفايات الخارجة (بقايا الطعام، الورق، مياه الصرف، الحرارة).", "1) التهيئة (6 دقائق، من الدقيقة 0 إلى 6):\n   دور المعلم: يوجه رسم المنزل والأسهم.\n   دور الطالب: يرسمون ويلونون الأسهم.\n2) إلى أين تذهب النفايات؟ (10 دقائق، من الدقيقة 6 إلى 16):\n   دور المعلم: يتحدث عن مرادم النفايات وطمر ملايين الأطنان وتلويثها للهواء والماء واليابسة.\n   دور الطالب: يناقشون مشكلة الطمر.\n3) التقليل، إعادة الاستخدام، إعادة التدوير (12 دقائق، من الدقيقة 16 إلى 28):\n   دور المعلم: يعرّف المفاهيم بأمثلة مدرسية: ماذا يحدث لبقايا ورق المدرسة؟\n   دور الطالب: يصنفون أمثلة في جدول من ثلاثة أعمدة.\n4) قراءة ص50 (7 دقائق، من الدقيقة 28 إلى 35):\n   دور المعلم: يتابع القراءة ويطرح أسئلة الفهم.\n   دور الطالب: يقرؤون ويحددون أمثلة الكتاب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما معنى إعادة الاستخدام؟\n   الإجابة النموذجية: استخدام الشيء مرة أخرى كما هو أو لغرض آخر.\n2) [المستوى المتوقع] ما معنى إعادة التدوير؟\n   الإجابة النموذجية: معالجة المواد المستعملة لصنع منتجات جديدة.\n3) [المستوى المتقدم] لماذا يضر طمر النفايات بالبيئة؟\n   الإجابة النموذجية: لأنه يلوث التربة والماء والهواء ويشغل مساحات كبيرة.", "1) [مستوى الدعم] اذكر نفاية تخرج من منزلك يوميًا.\n   الإجابة النموذجية: بقايا الطعام أو الورق أو العبوات.\n2) [المستوى المتوقع] صنّف: إعطاء الملابس القديمة لمن يحتاجها.\n   الإجابة النموذجية: إعادة استخدام.\n3) [المستوى المتقدم] أيها أفضل للبيئة: التقليل أم إعادة التدوير؟ فسّر.\n   الإجابة النموذجية: التقليل، لأنه يمنع إنتاج النفايات أصلًا ويوفر الموارد والطاقة.", "إرشاد الطالب: قراءة ص50 وكتابة ثلاثة أمثلة للتقليل وإعادة الاستخدام وإعادة التدوير من البيت. إرشاد ولي الأمر: تخصيص سلة منفصلة للورق والعبوات في المنزل."]}, {"axis": "أكوام السماد العضوي (نشاط 8-2أ)", "h": {"lesson": "8-2 إعادة التدوير تحمي الأرض", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع العاشر (8–12/11/2026)", "sb": "50", "ab": "—", "tg": "48–51", "n": "2 من 5", "axis": "أكوام السماد العضوي (نشاط 8-2أ)"}, "f": ["1. يصنع كومة صغيرة من السماد العضوي ويلاحظ تحلل المواد.\nمخرج تعليمي آخر (2): يوضح دور الكائنات الدقيقة في تحليل بقايا النباتات والحيوانات.", "المخرج 1 (يصنع كومة صغيرة من السماد العضوي ويلاحظ تحلل المواد): تطبيق\nالمخرج 2 (يوضح دور الكائنات الدقيقة في تحليل بقايا النباتات والحيوانات): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على المشاريع", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: قفازات بلاستيكية، أوراق شجر، سيقان نبات، نواة تفاحة، كيس بلاستيكي محكم أو علبة بغطاء، ماء قليل.", "السماد العضوي، التحلل، الكائنات الدقيقة، العفن.", "يعرض المعلم صورة تربة سوداء غنية في حديقة ويسأل: من أين جاءت هذه التربة الغنية؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويجمع الأفكار.\n   دور الطالب: يتوقعون أنها من بقايا النباتات.\n2) السلامة (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يؤكد لبس القفازات وإغلاق الكيس بإحكام وعدم استنشاق العفن أو فتح الكيس لاحقًا.\n   دور الطالب: يكررون قواعد السلامة.\n3) تنفيذ نشاط 8-2أ (14 دقائق، من الدقيقة 11 إلى 25):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: يضعون الأوراق والسيقان ونواة التفاح وقليلًا من الماء في الكيس ويغلقونه ويكتبون التاريخ وتوقعاتهم.\n4) التحلل والكائنات الدقيقة (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشرح أن الكائنات الدقيقة والفطريات تحلل البقايا وتعيدها إلى التربة.\n   دور الطالب: يرسمون جدول ملاحظة لعدة أيام.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل: أي المواد ستتحلل أسرع؟\n   دور الطالب: يكتبون توقعًا لمراجعته لاحقًا.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما المواد التي وضعتها في كومة السماد؟\n   الإجابة النموذجية: أوراق الشجر وسيقان النبات ونواة التفاح.\n2) [المستوى المتوقع] لماذا نغلق الكيس بإحكام؟\n   الإجابة النموذجية: لأن العفن يطلق أبواغًا يجب ألا نستنشقها.\n3) [المستوى المتقدم] من يحلل بقايا النباتات؟\n   الإجابة النموذجية: الكائنات الدقيقة والفطريات.", "1) [مستوى الدعم] ما فائدة السماد العضوي؟\n   الإجابة النموذجية: يغني التربة ويقلل النفايات التي تذهب إلى المرادم.\n2) [المستوى المتوقع] ماذا تتوقع أن يحدث للمواد بعد عدة أيام؟\n   الإجابة النموذجية: تبدأ بالتحلل ويتغير لونها وشكلها.\n3) [المستوى المتقدم] لماذا لا نضع البلاستيك في كومة السماد؟\n   الإجابة النموذجية: لأن البلاستيك لا يتحلل بفعل الكائنات الدقيقة بسهولة.", "إرشاد الطالب: متابعة كيس السماد وتسجيل التغيرات كل يومين. إرشاد ولي الأمر: تجربة صنع سماد من بقايا الخضار مع ابنكم في حديقة المنزل."]}, {"axis": "ماذا نعيد تدويره؟ (تمرين 8-2)", "h": {"lesson": "8-2 إعادة التدوير تحمي الأرض", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع العاشر (8–12/11/2026)", "sb": "51", "ab": "30", "tg": "48–51", "n": "3 من 5", "axis": "ماذا نعيد تدويره؟ (تمرين 8-2)"}, "f": ["1. يصنف النفايات إلى حاويات إعادة التدوير المناسبة.\nمخرج تعليمي آخر (2): يتتبع مسار الورق من الشجرة إلى إعادة التدوير ويستنتج فائدته.", "المخرج 1 (يصنف النفايات إلى حاويات إعادة التدوير المناسبة): تطبيق\nالمخرج 2 (يتتبع مسار الورق من الشجرة إلى إعادة التدوير ويستنتج فائدته): تحليل", "• التعلم المبني على اللعب\n• التعلم التعاوني\n• التعلم بالنمذجة", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: حاويات ملونة صغيرة أو صناديق، نماذج نفايات نظيفة (ورق، علب، قنينات).", "الفرز، حاويات التدوير، الزجاج، الورق المقوى، البطاريات، البلاستيك.", "يضع المعلم سلة مختلطة من النفايات النظيفة ويسأل: كيف نعيد تدوير هذه الأشياء وهي مختلطة؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض السلة المختلطة.\n   دور الطالب: يقترحون الفرز.\n2) لعبة الفرز (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يضع حاويات بأسماء: زجاج، بقايا طعام، بطاريات، ورق مقوى، بلاستيك، ورق.\n   دور الطالب: يتسابقون في وضع كل نفاية في حاويتها.\n3) تمرين 8-2 (ص30) (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يوجه إلى التمرين.\n   دور الطالب: يصنفون: كأس زجاجية، شطيرة، بطارية، صندوق ورق مقوى، قنينة ماء، مجلات وجرائد.\n4) رحلة الورق (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يرسم مسار: شجرة ← طحن ← كتاب ← استخدام ← إعادة تدوير بدل القطع.\n   دور الطالب: يستنتجون أن إعادة تدوير الورق تقلل قطع الأشجار.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] في أي حاوية نضع الجرائد؟\n   الإجابة النموذجية: حاوية الورق.\n2) [المستوى المتوقع] لماذا نفرز النفايات؟\n   الإجابة النموذجية: لكي تعاد معالجة كل مادة بطريقتها المناسبة.\n3) [المستوى المتقدم] كيف تحمي إعادة تدوير الورق الأشجار؟\n   الإجابة النموذجية: لأننا نصنع ورقًا جديدًا من القديم  الحياة البحرية، التقليل.\n\nالحصة 5 (حملة «نحمي أرضنا»):\nإعادة التدوير، الطمر، المواد الأولية، الحملة التوعوية.", "الحصة 1 (نفايات المنزل: التقليل وإعادة الاستخدام وإعادة التدوير):\nيطلب المعلم من الطلاب رسم منزل مع أسهم بلون للأشياء الداخلة (الماء، الطعام، الورق، الكهرباء) وأسهم بلون آخر للنفايات الخارجة (بقايا الطعام، الورق، مياه الصرف، الحرارة).\n\nالحصة 2 (أكوام السماد العضوي (نشاط 8-2أ)):\nيعرض المعلم صورة تربة سوداء غنية في حديقة ويسأل: من أين جاءت هذه التربة الغنية؟\n\nالحصة 3 (ماذا نعيد تدويره؟ (تمرين 8-2)):\nيضع المعلم سلة مختلطة من النفايات النظيفة ويسأل: كيف نعيد تدوير هذه الأشياء وهي مختلطة؟\n\nالحصة 4 (النفايات البلاستيكية والحياة البحرية (نشاط 8-2ب)):\nيعرض المعلم صورة سلحفاة بحرية تعلق بكيس بلاستيكي ويسأل: كيف وصل الكيس إلى البحر؟\n\nالحصة 5 (حملة «نحمي أرضنا»):\nيعيد المعلم فتح نقاش كيس السماد (دون فتح الكيس): ماذا لاحظتم؟ ويربطه بتقليل الطمر.", "الحصة 1 (نفايات المنزل: التقليل وإعادة الاستخدام وإعادة التدوير):\n1) التهيئة (6 دقائق، من الدقيقة 0 إلى 6):\n   دور المعلم: يوجه رسم المنزل والأسهم.\n   دور الطالب: يرسمون ويلونون الأسهم.\n2) إلى أين تذهب النفايات؟ (10 دقائق، من الدقيقة 6 إلى 16):\n   دور المعلم: يتحدث عن مرادم النفايات وطمر ملايين الأطنان وتلويثها للهواء والماء واليابسة.\n   دور الطالب: يناقشون مشكلة الطمر.\n3) التقليل، إعادة الاستخدام، إعادة التدوير (12 دقائق، من الدقيقة 16 إلى 28):\n   دور المعلم: يعرّف المفاهيم بأمثلة مدرسية: ماذا يحدث لبقايا ورق المدرسة؟\n   دور الطالب: يصنفون أمثلة في جدول من ثلاثة أعمدة.\n4) قراءة ص50 (7 دقائق، من الدقيقة 28 إلى 35):\n   دور المعلم: يتابع القراءة ويطرح أسئلة الفهم.\n   دور الطالب: يقرؤون ويحددون أمثلة الكتاب.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (أكوام السماد العضوي (نشاط 8-2أ)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال ويجمع الأفكار.\n   دور الطالب: يتوقعون أنها من بقايا النباتات.\n2) السلامة (6 دقائق، من الدقيقة 5 إلى 11):\n   دور المعلم: يؤكد لبس القفازات وإغلاق الكيس بإحكام وعدم استنشاق العفن أو فتح الكيس لاحقًا.\n   دور الطالب: يكررون قواعد السلامة.\n3) تنفيذ نشاط 8-2أ (14 دقائق، من الدقيقة 11 إلى 25):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: يضعون الأوراق والسيقان ونواة التفاح وقليلًا من الماء في الكيس ويغلقونه ويكتبون التاريخ وتوقعاتهم.\n4) التحلل والكائنات الدقيقة (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يشرح أن الكائنات الدقيقة والفطريات تحلل البقايا وتعيدها إلى التربة.\n   دور الطالب: يرسمون جدول ملاحظة لعدة أيام.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يسأل: أي المواد ستتحلل أسرع؟\n   دور الطالب: يكتبون توقعًا لمراجعته لاحقًا.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (ماذا نعيد تدويره؟ (تمرين 8-2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض السلة المختلطة.\n   دور الطالب: يقترحون الفرز.\n2) لعبة الفرز (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يضع حاويات بأسماء: زجاج، بقايا طعام، بطاريات، ورق مقوى، بلاستيك، ورق.\n   دور الطالب: يتسابقون في وضع كل نفاية في حاويتها.\n3) تمرين 8-2 (ص30) (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يوجه إلى التمرين.\n   دور الطالب: يصنفون: كأس زجاجية، شطيرة، بطارية، صندوق ورق مقوى، قنينة ماء، مجلات وجرائد.\n4) رحلة الورق (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يرسم مسار: شجرة ← طحن ← كتاب ← استخدام ← إعادة تدوير بدل القطع.\n   دور الطالب: يستنتجون أن إعادة تدوير الورق تقلل قطع الأشجار.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (النفايات البلاستيكية والحياة البحرية (نشاط 8-2ب)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يتتبعون مسار الكيس من الإنسان إلى البحر.\n2) تنفيذ نشاط 8-2ب (بحث) (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يوزع مصادر البحث ويوجه الأسئلة: مم يُصنع البلاستيك؟ كيف يضر البحر؟\n   دور الطالب: يبحثون ويدونون: البلاستيك من مشتقات النفط، تأكله الكائنات البحرية أو تعلق به.\n3) لماذا لا يُعاد تدوير البلاستيك كله؟ (8 دقائق، من الدقيقة 20 إلى 28):\n   دور المعلم: يوضح أن بعض أنواع البلاستيك لا يمكن إعادة تدويرها.\n   دور الطالب: يستنتجون أهمية التقليل.\n4) حلول المجموعات (8 دقائق، من الدقيقة 28 إلى 36):\n   دور المعلم: يطلب حلولًا عملية.\n   دور الطالب: يقترحون: الأكياس القماشية، القوارير القابلة لإعادة الاستخدام، الكتابة للشركات.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (حملة «نحمي أرضنا»):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يناقش ملاحظات كيس السماد.\n   دور الطالب: يصفون التغيرات التي حدثت.\n2) السؤالان 1 و2 ص51 (8 دقائق، من الدقيقة 5 إلى 13):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يجيبون: السماد يقلل الطمر، وإعادة التدوير تقلل استهلاك المواد الأولية.\n3) تصميم الملصقات (12 دقائق، من الدقيقة 13 إلى 25):\n   دور المعلم: يتابع المجموعات.\n   دور الطالب: يصممون ملصقات تشجع على إعادة التدوير لتعليقها في المدرسة.\n4) التقويم بإشارات المرور (5 دقائق، من الدقيقة 25 إلى 30):\n   دور المعلم: يقرأ المعايير: أصف أثر رمي المواد المفيدة، أصف أثر إعادة التدوير، أشرح أهمية التدوير.\n   دور الطالب: يرفعون البطاقة المناسبة، ويتابع المعلم أصحاب الأحمر والأصفر.\n5) مسابقة المجموعات (10 دقائق، من الدقيقة 30 إلى 40):\n   دور المعلم: يشغّل مسابقة الدرس 8-2.\n   دور الطالب: يتنافسون في مجموعات.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (نفايات المنزل: التقليل وإعادة الاستخدام وإعادة التدوير):\n1) [مستوى الدعم] ما معنى إعادة الاستخدام؟\n   الإجابة النموذجية: استخدام الشيء مرة أخرى كما هو أو لغرض آخر.\n2) [المستوى المتوقع] ما معنى إعادة التدوير؟\n   الإجابة النموذجية: معالجة المواد المستعملة لصنع منتجات جديدة.\n3) [المستوى المتقدم] لماذا يضر طمر النفايات بالبيئة؟\n   الإجابة النموذجية: لأنه يلوث التربة والماء والهواء ويشغل مساحات كبيرة.\n\nالحصة 2 (أكوام السماد العضوي (نشاط 8-2أ)):\n1) [مستوى الدعم] ما المواد التي وضعتها في كومة السماد؟\n   الإجابة النموذجية: أوراق الشجر وسيقان النبات ونواة التفاح.\n2) [المستوى المتوقع] لماذا نغلق الكيس بإحكام؟\n   الإجابة النموذجية: لأن العفن يطلق أبواغًا يجب ألا نستنشقها.\n3) [المستوى المتقدم] من يحلل بقايا النباتات؟\n   الإجابة النموذجية: الكائنات الدقيقة والفطريات.\n\nالحصة 3 (ماذا نعيد تدويره؟ (تمرين 8-2)):\n1) [مستوى الدعم] في أي حاوية نضع الجرائد؟\n   الإجابة النموذجية: حاوية الورق.\n2) [المستوى المتوقع] لماذا نفرز النفايات؟\n   الإجابة النموذجية: لكي تعاد معالجة كل مادة بطريقتها المناسبة.\n3) [المستوى المتقدم] كيف تحمي إعادة تدوير الورق الأشجار؟\n   الإجابة النموذجية: لأننا نصنع ورقًا جديدًا من القديم فنقلل قطع الأشجار.\n\nالحصة 4 (النفايات البلاستيكية والحياة البحرية (نشاط 8-2ب)):\n1) [مستوى الدعم] مم يُصنع البلاستيك؟\n   الإجابة النموذجية: من مشتقات النفط.\n2) [المستوى المتوقع] كيف تضر الأكياس البلاستيكية السلاحف البحرية؟\n   الإجابة النموذجية: قد تأكلها ظنًا أنها غذاء أو تعلق بها فتموت.\n3) [المستوى المتقدم] لماذا التقليل أهم من إعادة التدوير في حالة البلاستيك؟\n   الإجابة النموذجية: لأن كثيرًا من البلاستيك لا يمكن إعادة تدويره.\n\nالحصة 5 (حملة «نحمي أرضنا»):\n1) [مستوى الدعم] كيف تقلل أكوام السماد العضوي النفايات؟\n   الإجابة النموذجية: تحوّل بقايا النباتات والطعام إلى سماد بدل طمرها.\n2) [المستوى المتوقع] ما فائدة إعادة التدوير للموارد الطبيعية؟\n   الإجابة النموذجية: تقلل استهلاك المواد الأولية مثل الأشجار والنفط والمعادن.\n3) [المستوى المتقدم] لماذا نعلّق الملصقات في المدرسة؟\n   الإجابة النموذجية: لنشر التوعية وتشجيع الجميع على إعادة التدوير.", "الحصة 1 (نفايات المنزل: التقليل وإعادة الاستخدام وإعادة التدوير):\n1) [مستوى الدعم] اذكر نفاية تخرج من منزلك يوميًا.\n   الإجابة النموذجية: بقايا الطعام أو الورق أو العبوات.\n2) [المستوى المتوقع] صنّف: إعطاء الملابس القديمة لمن يحتاجها.\n   الإجابة النموذجية: إعادة استخدام.\n3) [المستوى المتقدم] أيها أفضل للبيئة: التقليل أم إعادة التدوير؟ فسّر.\n   الإجابة النموذجية: التقليل، لأنه يمنع إنتاج النفايات أصلًا ويوفر الموارد والطاقة.\n\nالحصة 2 (أكوام السماد العضوي (نشاط 8-2أ)):\n1) [مستوى الدعم] ما فائدة السماد العضوي؟\n   الإجابة النموذجية: يغني التربة ويقلل النفايات التي تذهب إلى المرادم.\n2) [المستوى المتوقع] ماذا تتوقع أن يحدث للمواد بعد عدة أيام؟\n   الإجابة النموذجية: تبدأ بالتحلل ويتغير لونها وشكلها.\n3) [المستوى المتقدم] لماذا لا نضع البلاستيك في كومة السماد؟\n   الإجابة النموذجية: لأن البلاستيك لا يتحلل بفعل الكائنات الدقيقة بسهولة.\n\nالحصة 3 (ماذا نعيد تدويره؟ (تمرين 8-2)):\n1) [مستوى الدعم] اذكر مادة يمكن إعادة تدويرها.\n   الإجابة النموذجية: الورق أو الزجاج أو البلاستيك أو المعادن.\n2) [المستوى المتوقع] لماذا للبطاريات حاوية خاصة؟\n   الإجابة النموذجية: لأنها تحتوي على مواد ضارة مثل الرصاص يجب استخراجها بأمان.\n3) [المستوى المتقدم] صمّم مخططًا يبين رحلة علبة ألمنيوم من الاستخدام إلى منتج جديد.\n   الإجابة النموذجية: استخدام ← فرز ← جمع ← صهر ← صناعة علبة جديدة.\n\nالحصة 4 (النفايات البلاستيكية والحياة البحرية (نشاط 8-2ب)):\n1) [مستوى الدعم] اذكر بديلًا للكيس البلاستيكي.\n   الإجابة النموذجية: الكيس القماشي.\n2) [المستوى المتوقع] كيف تصل النفايات البلاستيكية إلى البحر؟\n   الإجابة النموذجية: برميها على الشواطئ أو في الأودية أو مع مياه الصرف.\n3) [المستوى المتقدم] اكتب رسالة قصيرة لشركة مياه تقترح فيها تقليل البلاستيك.\n   الإجابة النموذجية: مثال: نقترح استخدام قوارير قابلة لإعادة الاستخدام وجمع القوارير الفارغة لإعادة تدويرها.\n\nالحصة 5 (حملة «نحمي أرضنا»):\n1) [مستوى الدعم] اذكر فائدة واحدة لإعادة التدوير.\n   الإجابة النموذجية: تقلل النفايات المطمورة أو توفر المواد الأولية.\n2) [المستوى المتوقع] ماذا يحدث لو رمينا كل النفايات دون فرز؟\n   الإجابة النموذجية: تذهب المواد المفيدة إلى المرادم فتهدر الموارد ويزداد التلوث.\n3) [المستوى المتقدم] اقترح فكرة لعبة تعلم الأطفال الصغار إعادة التدوير.\n   الإجابة النموذجية: لعبة فرز بالحاويات الملونة مع نقاط لكل إجابة صحيحة (إجابات متنوعة).", "الحصة 1 (نفايات المنزل: التقليل وإعادة الاستخدام وإعادة التدوير):\nإرشاد الطالب: قراءة ص50 وكتابة ثلاثة أمثلة للتقليل وإعادة الاستخدام وإعادة التدوير من البيت. إرشاد ولي الأمر: تخصيص سلة منفصلة للورق والعبوات في المنزل.\n\nالحصة 2 (أكوام السماد العضوي (نشاط 8-2أ)):\nإرشاد الطالب: متابعة كيس السماد وتسجيل التغيرات كل يومين. إرشاد ولي الأمر: تجربة صنع سماد من بقايا الخضار مع ابنكم في حديقة المنزل.\n\nالحصة 3 (ماذا نعيد تدويره؟ (تمرين 8-2)):\nإرشاد الطالب: إكمال تمرين 8-2 ص30. إرشاد ولي الأمر: فرز نفايات المنزل مع ابنكم أسبوعًا وتسليم القابل للتدوير لنقاط الجمع.\n\nالحصة 4 (النفايات البلاستيكية والحياة البحرية (نشاط 8-2ب)):\nإرشاد الطالب: كتابة ملخص لبحثه عن أضرار البلاستيك على الحياة البحرية. إرشاد ولي الأمر: استخدام الأكياس القماشية عند التسوق بمشاركة ابنكم.\n\nالحصة 5 (حملة «نحمي أرضنا»):\nإرشاد الطالب: مراجعة الدرس ص50–51 واقتراح مواد للتقليل وإعادة الاستخدام وإعادة التدوير في البيت. إرشاد ولي الأمر: دعم ابنكم في تطبيق أفكار حملة «نحمي أرضنا» في المنزل."]}, {"id": "9-2", "title": "تحقق من تقدمك (الوحدة الثانية)", "unit": 2, "unitName": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "sb": "52–53", "ab": "31 (المراجعة اللغوية)", "tg": "51", "periods": [{"axis": "مراجعة المواطن وتكيّف الحيوانات (السؤال 1)", "h": {"lesson": "9-2 تحقق من تقدمك (الوحدة الثانية)", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "sb": "52", "ab": "—", "tg": "51", "n": "1 من 5", "axis": "مراجعة المواطن وتكيّف الحيوانات (السؤال 1)"}, "f": ["1. يسمّي أنواعًا من المواطن الطبيعية (البحرية، الصحراوية، البحيرات، الجبلية).\nمخرج تعليمي آخر (2): يفسّر صفات تساعد السمكة والجمل والضفدع والنسر على العيش في مواطنها.", "المخرج 1 (يسمّي أنواعًا من المواطن الطبيعية (البحرية، الصحراوية، البحيرات، الجبلية)): تذكر\nالمخرج 2 (يفسّر صفات تساعد السمكة والجمل والضفدع والنسر على العيش في مواطنها): فهم", "• التعلم التعاوني\n• التعلم المبني على اللعب\n• التعلم الذاتي", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات صور حيوانات ومواطن.", "الموطن، التكيف، الخياشيم، الزعانف، الحوافر، المخالب.", "يدير المعلم لعبة «أين أعيش؟»: يعرض صورة حيوان ويختار الطلاب بطاقة الموطن المناسب.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير اللعبة.\n   دور الطالب: يطابقون الحيوانات بالمواطن.\n2) السؤال 1(أ) (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوجه إلى تسمية المواطن.\n   دور الطالب: يسمّون: البحرية، الصحراوية، البحيرات، الجبلية.\n3) السؤال 1(ب) بالتعلم التعاوني (15 دقائق، من الدقيقة 15 إلى 30):\n   دور المعلم: يقسم الحيوانات الأربعة على المجموعات.\n   دور الطالب: تكتب كل مجموعة صفات حيوانها: السمكة خياشيم وزعانف، الجمل سنام وحوافر، الضفدع أقدام مسطحة ولسان لزج، النسر بصر حاد ومخالب.\n4) العرض (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: ينظم عرضًا سريعًا.\n   دور الطالب: تعرض كل مجموعة ويكمل الآخرون.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] في أي موطن يعيش الجمل؟\n   الإجابة النموذجية: الموطن الصحراوي.\n2) [المستوى المتوقع] ما الذي يساعد السمكة على التنفس تحت الماء؟\n   الإجابة النموذجية: الخياشيم.\n3) [المستوى المتقدم] كيف يساعد اللسان اللزج الضفدع؟\n   الإجابة النموذجية: يلتقط به الحشرات.", "1) [مستوى الدعم] اذكر صفة تساعد النسر على الصيد.\n   الإجابة النموذجية: البصر الحاد أو المخالب الحادة أو الأجنحة القوية.\n2) [المستوى المتوقع] كيف تساعد الحوافر الجمل؟\n   الإجابة النموذجية: على المشي فوق الرمل.\n3) [المستوى المتقدم] لو نُقلت سمكة إلى الصحراء، لماذا لا تستطيع العيش؟\n   الإجابة النموذجية: لأن صفاتها كالخياشيم والزعانف مناسبة للماء وليس لليابسة.", "إرشاد الطالب: مراجعة دروس المواطن ص36–41 وحل السؤال 1 ص52. إرشاد ولي الأمر: مناقشة ابنكم في حيوانات البيئة العُمانية ومواطنها."]}, {"axis": "تكيّف التمساح (السؤال 2)", "h": {"lesson": "9-2 تحقق من تقدمك (الوحدة الثانية)", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "sb": "52", "ab": "—", "tg": "51", "n": "2 من 5", "axis": "تكيّف التمساح (السؤال 2)"}, "f": ["1. يحدد أجزاء جسم التمساح ويربط كل جزء بوظيفته في البقاء.\nمخرج تعليمي آخر (2): يقارن تكيف التمساح بتكيف حيوانات درسها.", "المخرج 1 (يحدد أجزاء جسم التمساح ويربط كل جزء بوظيفته في البقاء): تحليل\nالمخرج 2 (يقارن تكيف التمساح بتكيف حيوانات درسها): تحليل", "• التعلم بالاكتشاف\n• التعلم التشاركي\nاستراتيجيات أخرى: فكّر - زاوج - شارك.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية", "التكيف، الفريسة، الجلد الخشن، المخالب.", "يعرض المعلم صورة تمساح يختبئ في الماء ولا تظهر إلا عيناه ويسأل: لماذا يفعل ذلك؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يقترحون: ليفاجئ فريسته.\n2) السؤال 2 ص52 (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يدير فكّر - زاوج - شارك على أجزاء التمساح.\n   دور الطالب: يربطون: البصر الحاد لرؤية الفريسة، الأسنان الحادة لإمساكها، الفم الواسع لبلع الطعام، الجلد الخشن لحمايته، الذيل للسباحة، المخالب للإمساك.\n3) المقارنة (10 دقائق، من الدقيقة 20 إلى 30):\n   دور المعلم: يطلب مقارنة التمساح بالضفدع أو النسر.\n   دور الطالب: يكملون جدول مقارنة: الموطن – صفة للصيد – صفة للحماية.\n4) التصحيح الذاتي (5 دقائق، من الدقيقة 30 إلى 35):\n   دور المعلم: يعرض الإجابات النموذجية.\n   دور الطالب: يصححون إجاباتهم.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما فائدة الأسنان الحادة للتمساح؟\n   الإجابة النموذجية: إمساك الفريسة.\n2) [المستوى المتوقع] كيف يساعد الذيل التمساح؟\n   الإجابة النموذجية: على السباحة.\n3) [المستوى المتقدم] ما الصفة المشتركة بين التمساح والنسر في الصيد؟\n   الإجابة النموذجية: البصر الحاد لرؤية الفريسة.", "1) [مستوى الدعم] ما فائدة الجلد الخشن للتمساح؟\n   الإجابة النموذجية: يحميه حتى لا تأكله الحيوانات الأخرى.\n2) [المستوى المتوقع] لماذا يحتاج التمساح فمًا واسعًا؟\n   الإجابة النموذجية: ليبلع طعامه.\n3) [المستوى المتقدم] صمّم صفة إضافية تساعد التمساح على الصيد في الماء العكر وفسّرها.\n   الإجابة النموذجية: مثل: حاسة شم أو إحساس قوي بحركة الماء ليشعر بالفريسة دون رؤيتها (إجابات منطقية).", "إرشاد الطالب: حل السؤال 2 ص52 في الكتاب. إرشاد ولي الأمر: مشاهدة مقطع تعليمي عن التمساح مع ابنكم وذكر صفات تكيفه."]}, {"axis": "مراجعة المفاتيح التعريفية (السؤال 3)", "h": {"lesson": "9-2 تحقق من تقدمك (الوحدة الثانية)", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "sb": "53", "ab": "—", "tg": "51", "n": "3 من 5", "axis": "مراجعة المفاتيح التعريفية (السؤال 3)"}, "f": ["1. يبني مفتاحًا تعريفيًا لمجموعة من الحيوانات.\nمخرج تعليمي آخر (2): يستخدم مفاتيح تعريفية لتمييز الفقاريات واللافقاريات.", "المخرج 1 (يبني مفتاحًا تعريفيًا لمجموعة من الحيوانات): إبداع\nالمخرج 2 (يستخدم مفاتيح تعريفية لتمييز الفقاريات واللافقاريات): تطبيق", "• التعلم التعاوني\n• التعلم المبني على اللعب\n• التعلم المبني على حل المشكلات", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات صور حيوانات متنوعة.", "المفتاح التعريفي، الفقاريات، اللافقاريات، الصفة المميزة.", "يدير المعلم لعبة «سؤال واحد فقط»: يعرض حيوانين ويطلب سؤالًا واحدًا نعم/لا يفرق بينهما.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير اللعبة بأزواج سريعة من الصور.\n   دور الطالب: يصيغون سؤالًا مميزًا لكل زوج.\n2) السؤال 3 ص53 (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يتابع بناء المفاتيح ويدعم المحتاجين بأسئلة جاهزة.\n   دور الطالب: يبنون مفتاحهم الخاص للحيوانات المعطاة.\n3) تبادل المفاتيح (8 دقائق، من الدقيقة 20 إلى 28):\n   دور المعلم: ينظم التبادل بين المجموعات.\n   دور الطالب: يجربون مفاتيح زملائهم ويقترحون تحسينات.\n4) فقاري أم لافقاري؟ (7 دقائق، من الدقيقة 28 إلى 35):\n   دور المعلم: يعرض صورًا مختلطة.\n   دور الطالب: يصنفون بسرعة ويبررون بوجود العمود الفقري.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما نوع الأسئلة في المفتاح التعريفي؟\n   الإجابة النموذجية: أسئلة إجاباتها نعم أو لا.\n2) [المستوى المتوقع] هل الحلزون فقاري أم لافقاري؟\n   الإجابة النموذجية: لافقاري.\n3) [المستوى المتقدم] ما السؤال الذي يفصل الفقاريات عن اللافقاريات؟\n   الإجابة النموذجية: هل له عمود فقري؟", "1) [مستوى الدعم] كم رجلًا للحشرة؟\n   الإجابة النموذجية: ست أرجل.\n2) [المستوى المتوقع] اكتب سؤالًا يفرّق بين الحوت والسمكة.\n   الإجابة النموذجية: هل يتنفس الهواء برئتين؟ أو هل يرضع صغاره؟\n3) [المستوى المتقدم] قيّم سؤال «هل هو كبير؟» في مفتاح تعريفي.\n   الإجابة النموذجية: غير دقيق لأن «كبير» تختلف بحسب المقارنة، والأفضل سؤال يمكن ملاحظته بوضوح.", "إرشاد الطالب: حل السؤال 3 ص53 وبناء مفتاح لحيوانات يعرفها. إرشاد ولي الأمر: تجربة مفتاح ابنكم والتعليق عليه."]}, {"axis": "مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)", "h": {"lesson": "9-2 تحقق من تقدمك (الوحدة الثانية)", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "sb": "53", "ab": "31", "tg": "51", "n": "4 من 5", "axis": "مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)"}, "f": ["1. يحلل بيانات عن تلوث نهر ويحدد مصدر التلوث.\nمخرج تعليمي آخر (2): يسترجع مفردات الوحدة: الموطن، البيئة، المفتاح التعريفي، التلوث، إعادة التدوير.", "المخرج 1 (يحلل بيانات عن تلوث نهر ويحدد مصدر التلوث): تحليل\nالمخرج 2 (يسترجع مفردات الوحدة: الموطن، البيئة، المفتاح التعريفي، التلوث، إعادة التدوير): تذكر", "• التعلم التعاوني\n• التعلم الذاتي\n• التعلم المبني على حل المشكلات", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية", "التلوث، النفايات السائلة، إعادة التدوير، البيئة، الموطن الطبيعي.", "يعرض المعلم صورة نهر ملوث بجانبه مصنع ويسأل: كيف نتأكد علميًا من أن المصنع هو سبب التلوث؟", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يقترحون جمع بيانات عن التلوث.\n2) السؤال 4 ص53 (14 دقائق، من الدقيقة 5 إلى 19):\n   دور المعلم: يوجه إلى قراءة البيانات.\n   دور الطالب: يحددون يوم التلوث الأكبر والأيام المتشابهة، ويستنتجون أن النفايات السائلة من المصنع تجري في النهر وتلوث المياه.\n3) المراجعة اللغوية ص31 (12 دقائق، من الدقيقة 19 إلى 31):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يعرّفون: الموطن الطبيعي، البيئة، المفتاح التعريفي، التلوث، إعادة التدوير، ويكملون الفقرة.\n4) التصحيح التعاوني (5 دقائق، من الدقيقة 31 إلى 36):\n   دور المعلم: يعرض الإجابات.\n   دور الطالب: يصحح الأزواج إجابات بعضهم.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما التلوث؟\n   الإجابة النموذجية: إلحاق الضرر بالبيئة.\n2) [المستوى المتوقع] ما مصدر التلوث في بيانات النهر؟\n   الإجابة النموذجية: النفايات السائلة من المصنع.\n3) [المستوى المتقدم] كيف تدعم البيانات استنتاجك؟\n   الإجابة النموذجية: لأن التلوث يزداد في الأيام التي يصرّف فيها المصنع نفاياته.", "1) [مستوى الدعم] ما إعادة التدوير؟\n   الإجابة النموذجية: استخدام المواد المستعملة لصنع منتجات جديدة.\n2) [المستوى المتوقع] عرّف البيئة.\n   الإجابة النموذجية: كل ما يحيط بالكائن الحي.\n3) [المستوى المتقدم] اقترح إجراءً يمنع المصنع من تلويث النهر.\n   الإجابة النموذجية: معالجة النفايات السائلة قبل تصريفها ومراقبة المصنع.", "إرشاد الطالب: إكمال المراجعة اللغوية ص31 وحل السؤال 4 ص53. إرشاد ولي الأمر: مراجعة مفردات الوحدة مع ابنكم بأسلوب البطاقات."]}, {"axis": "مراجعة شاملة للوحدة الثانية", "h": {"lesson": "9-2 تحقق من تقدمك (الوحدة الثانية)", "unit": "الوحدة الثانية: الكائنات الحية والبيئات", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "sb": "52–53", "ab": "—", "tg": "51", "n": "5 من 5", "axis": "مراجعة شاملة للوحدة الثانية"}, "f": ["1. يطبق مفاهيم الوحدة الثانية في حل مواقف جديدة.\nمخرج تعليمي آخر (2): يقوّم تعلمه ذاتيًا ويحدد ما يحتاج إلى مراجعة.", "المخرج 1 (يطبق مفاهيم الوحدة الثانية في حل مواقف جديدة): تطبيق\nالمخرج 2 (يقوّم تعلمه ذاتيًا ويحدد ما يحتاج إلى مراجعة): تقييم", "• التعلم المبني على اللعب\n• التعلم التعاوني\n• التعلم الذاتي", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الموطن، التكيف، المفتاح التعريفي، التلوث، إعادة التدوير، الماء العذب.", "يعرض المعلم خريطة مفاهيم ناقصة للوحدة الثانية ويطلب من الطلاب إكمالها سريعًا.", "1) التهيئة: خريطة المفاهيم (6 دقائق، من الدقيقة 0 إلى 6):\n   دور المعلم: يعرض الخريطة الناقصة.\n   دور الطالب: يكملون الفروع: المواطن، المفاتيح، أثر الإنسان، الماء، التدوير.\n2) محطات المراجعة (12 دقائق، من الدقيقة 6 إلى 18):\n   دور المعلم: يجهز 3 محطات: المواطن والتكيف، المفاتيح، البيئة والتدوير.\n   دور الطالب: يتنقلون بين المحطات ويحلون مهمة قصيرة في كل محطة.\n3) مسابقة المجموعات (12 دقائق، من الدقيقة 18 إلى 30):\n   دور المعلم: يشغّل مسابقة الدرس 9-2.\n   دور الطالب: يتنافسون في مجموعات على أسئلة الوحدة.\n4) التقييم الذاتي (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يقرأ عبارات «أستطيع» للوحدة.\n   دور الطالب: يحددون نقاط القوة وما يحتاج إلى مراجعة.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر حيوانًا وصفة تساعده في موطنه.\n   الإجابة النموذجية: الجمل وحوافره للمشي على الرمل (إجابات متنوعة).\n2) [المستوى المتوقع] اذكر طريقة لحماية الماء العذب من التلوث.\n   الإجابة النموذجية: عدم رمي النفايات في الأفلاج والأنهار.\n3) [المستوى المتقدم] لماذا تقل أعداد الحيوانات عندما يتلوث موطنها؟\n   الإجابة النموذجية: لأنها تفقد غذاءها ومأواها أو تمرض وتموت.", "1) [مستوى الدعم] ما فائدة المفتاح التعريفي؟\n   الإجابة النموذجية: تصنيف الحيوانات وتمييزها.\n2) [المستوى المتوقع] أيها يقلل النفايات أكثر: إعادة الاستخدام أم الرمي؟\n   الإجابة النموذجية: إعادة الاستخدام.\n3) [المستوى المتقدم] اقترح مشروعًا مدرسيًا يجمع بين حماية المواطن وإعادة التدوير.\n   الإجابة النموذجية: مثل: صنع بيوت للطيور والحشرات من مواد معاد استخدامها (إجابات متنوعة).", "إرشاد الطالب: مراجعة الوحدة الثانية كاملة ص36–53. إرشاد ولي الأمر: متابعة ابنكم في المراجعة والاطلاع على نتيجة تقييمه الذاتي."]}], "comb": ["الحصة 1 (مراجعة المواطن وتكيّف الحيوانات (السؤال 1)):\n1. يسمّي أنواعًا من المواطن الطبيعية (البحرية، الصحراوية، البحيرات، الجبلية).\nمخرج تعليمي آخر (2): يفسّر صفات تساعد السمكة والجمل والضفدع والنسر على العيش في مواطنها.\n\nالحصة 2 (تكيّف التمساح (السؤال 2)):\n1. يحدد أجزاء جسم التمساح ويربط كل جزء بوظيفته في البقاء.\nمخرج تعليمي آخر (2): يقارن تكيف التمساح بتكيف حيوانات درسها.\n\nالحصة 3 (مراجعة المفاتيح التعريفية (السؤال 3)):\n1. يبني مفتاحًا تعريفيًا لمجموعة من الحيوانات.\nمخرج تعليمي آخر (2): يستخدم مفاتيح تعريفية لتمييز الفقاريات واللافقاريات.\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\n1. يحلل بيانات عن تلوث نهر ويحدد مصدر التلوث.\nمخرج تعليمي آخر (2): يسترجع مفردات الوحدة: الموطن، البيئة، المفتاح التعريفي، التلوث، إعادة التدوير.\n\nالحصة 5 (مراجعة لمفاتيح التعريفية (السؤال 3)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات صور حيوانات متنوعة.\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n\nالحصة 5 (مراجعة شاملة للوحدة الثانية):\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1 (مراجعة المواطن وتكيّف الحيوانات (السؤال 1)):\nالموطن، التكيف، الخياشيم، الزعانف، الحوافر، المخالب.\n\nالحصة 2 (تكيّف التمساح (السؤال 2)):\nالتكيف، الفريسة، الجلد الخشن، المخالب.\n\nالحصة 3 (مراجعة المفاتيح التعريفية (السؤال 3)):\nالمفتاح التعريفي، الفقاريات، اللافقاريات، الصفة المميزة.\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\nالتلوث، النفايات السائلة، إعادة التدوير، البيئة، الموطن الطبيعي.\n\nالحصة 5 (مراجعة شاملة للوحدة الثانية):\nالموطن، التكيف، المفتاح التعريفي، التلوث، إعادة التدوير، الماء العذب.", "الحصة 1 (مراجعة المواطن وتكيّف الحيوانات (السؤال 1)):\nيدير المعلم لعبة «أين أعيش؟»: يعرض صورة حيوان ويختار الطلاب بطاقة الموطن المناسب.\n\nالحصة 2 (تكيّف التمساح (السؤال 2)):\nيعرض المعلم صورة تمساح يختبئ في الماء ولا تظهر إلا عيناه ويسأل: لماذا يفعل ذلك؟\n\nالحصة 3 (مراجعة المفاتيح التعريفية (السؤال 3)):\nيدير المعلم لعبة «سؤال واحد فقط»: يعرض حيوانين ويطلب سؤالًا واحدًا نعم/لا يفرق بينهما.\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\nيعرض المعلم صورة نهر ملوث بجانبه مصنع ويسأل: كيف نتأكد علميًا من أن المصنع هو سبب التلوث؟\n\nالحصة 5 (مراجعة شاملة للوحدة الثانية):\nيعرض المعلم خريطة مفاهيم ناقصة للوحدة الثانية ويطلب من الطلاب إكمالها سريعًا.", "الحصة 1 (مراجعة المواطن وتكيّف الحيوانات (السؤال 1)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير اللعبة.\n   دور الطالب: يطابقون الحيوانات بالمواطن.\n2) السؤال 1(أ) (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يوجه إلى تسمية المواطن.\n   دور الطالب: يسمّون: البحرية، الصحراوية، البحيرات، الجبلية.\n3) السؤال 1(ب) بالتعلم التعاوني (15 دقائق، من الدقيقة 15 إلى 30):\n   دور المعلم: يقسم الحيوانات الأربعة على المجموعات.\n   دور الطالب: تكتب كل مجموعة صفات حيوانها: السمكة خياشيم وزعانف، الجمل سنام وحوافر، الضفدع أقدام مسطحة ولسان لزج، النسر بصر حاد ومخالب.\n4) العرض (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: ينظم عرضًا سريعًا.\n   دور الطالب: تعرض كل مجموعة ويكمل الآخرون.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 2 (تكيّف التمساح (السؤال 2)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يعرض الصورة ويطرح السؤال.\n   دور الطالب: يقترحون: ليفاجئ فريسته.\n2) السؤال 2 ص52 (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يدير فكّر - زاوج - شارك على أجزاء التمساح.\n   دور الطالب: يربطون: البصر الحاد لرؤية الفريسة، الأسنان الحادة لإمساكها، الفم الواسع لبلع الطعام، الجلد الخشن لحمايته، الذيل للسباحة، المخالب للإمساك.\n3) المقارنة (10 دقائق، من الدقيقة 20 إلى 30):\n   دور المعلم: يطلب مقارنة التمساح بالضفدع أو النسر.\n   دور الطالب: يكملون جدول مقارنة: الموطن – صفة للصيد – صفة للحماية.\n4) التصحيح الذاتي (5 دقائق، من الدقيقة 30 إلى 35):\n   دور المعلم: يعرض الإجابات النموذجية.\n   دور الطالب: يصححون إجاباتهم.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 3 (مراجعة المفاتيح التعريفية (السؤال 3)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير اللعبة بأزواج سريعة من الصور.\n   دور الطالب: يصيغون سؤالًا مميزًا لكل زوج.\n2) السؤال 3 ص53 (15 دقائق، من الدقيقة 5 إلى 20):\n   دور المعلم: يتابع بناء المفاتيح ويدعم المحتاجين بأسئلة جاهزة.\n   دور الطالب: يبنون مفتاحهم الخاص للحيوانات المعطاة.\n3) تبادل المفاتيح (8 دقائق، من الدقيقة 20 إلى 28):\n   دور المعلم: ينظم التبادل بين المجموعات.\n   دور الطالب: يجربون مفاتيح زملائهم ويقترحون تحسينات.\n4) فقاري أم لافقاري؟ (7 دقائق، من الدقيقة 28 إلى 35):\n   دور المعلم: يعرض صورًا مختلطة.\n   دور الطالب: يصنفون بسرعة ويبررون بوجود العمود الفقري.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\n1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يطرح السؤال.\n   دور الطالب: يقترحون جمع بيانات عن التلوث.\n2) السؤال 4 ص53 (14 دقائق، من الدقيقة 5 إلى 19):\n   دور المعلم: يوجه إلى قراءة البيانات.\n   دور الطالب: يحددون يوم التلوث الأكبر والأيام المتشابهة، ويستنتجون أن النفايات السائلة من المصنع تجري في النهر وتلوث المياه.\n3) المراجعة اللغوية ص31 (12 دقائق، من الدقيقة 19 إلى 31):\n   دور المعلم: يتابع الإجابات.\n   دور الطالب: يعرّفون: الموطن الطبيعي، البيئة، المفتاح التعريفي، التلوث، إعادة التدوير، ويكملون الفقرة.\n4) التصحيح التعاوني (5 دقائق، من الدقيقة 31 إلى 36):\n   دور المعلم: يعرض الإجابات.\n   دور الطالب: يصحح الأزواج إجابات بعضهم.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.\n\nالحصة 5 (مراجعة شاملة للوحدة الثانية):\n1) التهيئة: خريطة المفاهيم (6 دقائق، من الدقيقة 0 إلى 6):\n   دور المعلم: يعرض الخريطة الناقصة.\n   دور الطالب: يكملون الفروع: المواطن، المفاتيح، أثر الإنسان، الماء، التدوير.\n2) محطات المراجعة (12 دقائق، من الدقيقة 6 إلى 18):\n   دور المعلم: يجهز 3 محطات: المواطن والتكيف، المفاتيح، البيئة والتدوير.\n   دور الطالب: يتنقلون بين المحطات ويحلون مهمة قصيرة في كل محطة.\n3) مسابقة المجموعات (12 دقائق، من الدقيقة 18 إلى 30):\n   دور المعلم: يشغّل مسابقة الدرس 9-2.\n   دور الطالب: يتنافسون في مجموعات على أسئلة الوحدة.\n4) التقييم الذاتي (6 دقائق، من الدقيقة 30 إلى 36):\n   دور المعلم: يقرأ عبارات «أستطيع» للوحدة.\n   دور الطالب: يحددون نقاط القوة وما يحتاج إلى مراجعة.\n5) الغلق (4 دقائق، من الدقيقة 36 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "الحصة 1 (مراجعة المواطن وتكيّف الحيوانات (السؤال 1)):\n1) [مستوى الدعم] في أي موطن يعيش الجمل؟\n   الإجابة النموذجية: الموطن الصحراوي.\n2) [المستوى المتوقع] ما الذي يساعد السمكة على التنفس تحت الماء؟\n   الإجابة النموذجية: الخياشيم.\n3) [المستوى المتقدم] كيف يساعد اللسان اللزج الضفدع؟\n   الإجابة النموذجية: يلتقط به الحشرات.\n\nالحصة 2 (تكيّف التمساح (السؤال 2)):\n1) [مستوى الدعم] ما فائدة الأسنان الحادة للتمساح؟\n   الإجابة النموذجية: إمساك الفريسة.\n2) [المستوى المتوقع] كيف يساعد الذيل التمساح؟\n   الإجابة النموذجية: على السباحة.\n3) [المستوى المتقدم] ما الصفة المشتركة بين التمساح والنسر في الصيد؟\n   الإجابة النموذجية: البصر الحاد لرؤية الفريسة.\n\nالحصة 3 (مراجعة المفاتيح التعريفية (السؤال 3)):\n1) [مستوى الدعم] ما نوع الأسئلة في المفتاح التعريفي؟\n   الإجابة النموذجية: أسئلة إجاباتها نعم أو لا.\n2) [المستوى المتوقع] هل الحلزون فقاري أم لافقاري؟\n   الإجابة النموذجية: لافقاري.\n3) [المستوى المتقدم] ما السؤال الذي يفصل الفقاريات عن اللافقاريات؟\n   الإجابة النموذجية: هل له عمود فقري؟\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\n1) [مستوى الدعم] ما التلوث؟\n   الإجابة النموذجية: إلحاق الضرر بالبيئة.\n2) [المستوى المتوقع] ما مصدر التلوث في بيانات النهر؟\n   الإجابة النموذجية: النفايات السائلة من المصنع.\n3) [المستوى المتقدم] كيف تدعم البيانات استنتاجك؟\n   الإجابة النموذجية: لأن التلوث يزداد في الأيام التي يصرّف فيها المصنع نفاياته.\n\nالحصة 5 (مراجعة شاملة للوحدة الثانية):\n1) [مستوى الدعم] اذكر حيوانًا وصفة تساعده في موطنه.\n   الإجابة النموذجية: الجمل وحوافره للمشي على الرمل (إجابات متنوعة).\n2) [المستوى المتوقع] اذكر طريقة لحماية الماء العذب من التلوث.\n   الإجابة النموذجية: عدم رمي النفايات في الأفلاج والأنهار.\n3) [المستوى المتقدم] لماذا تقل أعداد الحيوانات عندما يتلوث موطنها؟\n   الإجابة النموذجية: لأنها تفقد غذاءها ومأواها أو تمرض وتموت.", "الحصة 1 (مراجعة المواطن وتكيّف الحيوانات (السؤال 1)):\n1) [مستوى الدعم] اذكر صفة تساعد النسر على الصيد.\n   الإجابة النموذجية: البصر الحاد أو المخالب الحادة أو الأجنحة القوية.\n2) [المستوى المتوقع] كيف تساعد الحوافر الجمل؟\n   الإجابة النموذجية: على المشي فوق الرمل.\n3) [المستوى المتقدم] لو نُقلت سمكة إلى الصحراء، لماذا لا تستطيع العيش؟\n   الإجابة النموذجية: لأن صفاتها كالخياشيم والزعانف مناسبة للماء وليس لليابسة.\n\nالحصة 2 (تكيّف التمساح (السؤال 2)):\n1) [مستوى الدعم] ما فائدة الجلد الخشن للتمساح؟\n   الإجابة النموذجية: يحميه حتى لا تأكله الحيوانات الأخرى.\n2) [المستوى المتوقع] لماذا يحتاج التمساح فمًا واسعًا؟\n   الإجابة النموذجية: ليبلع طعامه.\n3) [المستوى المتقدم] صمّم صفة إضافية تساعد التمساح على الصيد في الماء العكر وفسّرها.\n   الإجابة النموذجية: مثل: حاسة شم أو إحساس قوي بحركة الماء ليشعر بالفريسة دون رؤيتها (إجابات منطقية).\n\nالحصة 3 (مراجعة المفاتيح التعريفية (السؤال 3)):\n1) [مستوى الدعم] كم رجلًا للحشرة؟\n   الإجابة النموذجية: ست أرجل.\n2) [المستوى المتوقع] اكتب سؤالًا يفرّق بين الحوت والسمكة.\n   الإجابة النموذجية: هل يتنفس الهواء برئتين؟ أو هل يرضع صغاره؟\n3) [المستوى المتقدم] قيّم سؤال «هل هو كبير؟» في مفتاح تعريفي.\n   الإجابة النموذجية: غير دقيق لأن «كبير» تختلف بحسب المقارنة، والأفضل سؤال يمكن ملاحظته بوضوح.\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\n1) [مستوى الدعم] ما إعادة التدوير؟\n   الإجابة النموذجية: استخدام المواد المستعملة لصنع منتجات جديدة.\n2) [المستوى المتوقع] عرّف البيئة.\n   الإجابة النموذجية: كل ما يحيط بالكائن الحي.\n3) [المستوى المتقدم] اقترح إجراءً يمنع المصنع من تلويث النهر.\n   الإجابة النموذجية: معالجة النفايات السائلة قبل تصريفها ومراقبة المصنع.\n\nالحصة 5 (مراجعة شاملة للوحدة الثانية):\n1) [مستوى الدعم] ما فائدة المفتاح التعريفي؟\n   الإجابة النموذجية: تصنيف الحيوانات وتمييزها.\n2) [المستوى المتوقع] أيها يقلل النفايات أكثر: إعادة الاستخدام أم الرمي؟\n   الإجابة النموذجية: إعادة الاستخدام.\n3) [المستوى المتقدم] اقترح مشروعًا مدرسيًا يجمع بين حماية المواطن وإعادة التدوير.\n   الإجابة النموذجية: مثل: صنع بيوت للطيور والحشرات من مواد معاد استخدامها (إجابات متنوعة).", "الحصة 1 (مراجعة المواطن وتكيّف الحيوانات (السؤال 1)):\nإرشاد الطالب: مراجعة دروس المواطن ص36–41 وحل السؤال 1 ص52. إرشاد ولي الأمر: مناقشة ابنكم في حيوانات البيئة العُمانية ومواطنها.\n\nالحصة 2 (تكيّف التمساح (السؤال 2)):\nإرشاد الطالب: حل السؤال 2 ص52 في الكتاب. إرشاد ولي الأمر: مشاهدة مقطع تعليمي عن التمساح مع ابنكم وذكر صفات تكيفه.\n\nالحصة 3 (مراجعة المفاتيح التعريفية (السؤال 3)):\nإرشاد الطالب: حل السؤال 3 ص53 وبناء مفتاح لحيوانات يعرفها. إرشاد ولي الأمر: تجربة مفتاح ابنكم والتعليق عليه.\n\nالحصة 4 (مراجعة التلوث وحماية البيئة (السؤال 4 والمراجعة اللغوية)):\nإرشاد الطالب: إكمال المراجعة اللغوية ص31 وحل السؤال 4 ص53. إرشاد ولي الأمر: مراجعة مفردات الوحدة مع ابنكم بأسلوب البطاقات.\n\nالحصة 5 (مراجعة شاملة للوحدة الثانية):\nإرشاد الطالب: مراجعة الوحدة الثانية كاملة ص36–53. إرشاد ولي الأمر: متابعة ابنكم في المراجعة والاطلاع على نتيجة تقييمه الذاتي."]}, {"id": "1-3", "title": "المادة", "unit": 3, "unitName": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "sb": "54–55", "ab": "32", "tg": "55–57", "periods": [{"axis": "كل ما حولنا مادة", "h": {"lesson": "1-3 المادة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "sb": "54", "ab": "—", "tg": "55–57", "n": "1 من 5", "axis": "كل ما حولنا مادة"}, "f": ["1. يذكر أن جميع الأشياء من حولنا تتكون من مواد.\nمخرج تعليمي آخر (2): يعطي أمثلة لمواد صلبة وسائلة وغازية من الصف.", "المخرج 1 (يذكر أن جميع الأشياء من حولنا تتكون من مواد): تذكر\nالمخرج 2 (يعطي أمثلة لمواد صلبة وسائلة وغازية من الصف): فهم", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: العصف الذهني.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: عبوة ماء، بالون منفوخ، مكعب خشبي.", "المادة، صلبة، سائلة، غازية، الهواء.", "يطلب المعلم من الطلاب النظر حولهم وتعداد أكبر عدد من الأشياء في دقيقة، ويكتب القائمة على السبورة.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: يدير تحدي الدقيقة ويسجل القائمة.\n   دور الطالب: يعددون: الطاولة، الكرسي، القلم، الماء...\n2) تصنيف القائمة (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يسأل: ما الذي يجمع هذه الأشياء؟ ويوجه إلى أن معظمها صلب.\n   دور الطالب: يصنفون القائمة إلى صلب وسائل.\n3) أين الغاز؟ (10 دقائق، من الدقيقة 15 إلى 25):\n   دور المعلم: يعرض بالونًا منفوخًا ويسأل: ماذا يوجد داخله؟ ويوضح أن الهواء خليط من الغازات نتنفسه.\n   دور الطالب: يستنتجون أن الهواء مادة غازية لا نراها.\n4) قراءة ص54 (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يقرأ مع الطلاب ويقدم حالات المادة الثلاث.\n   دور الطالب: يكملون جدولًا بأمثلة لكل حالة من الصف والبيت.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون في بطاقة خروج.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] اذكر مادة صلبة في الصف.\n   الإجابة النموذجية: الطاولة أو الكرسي أو القلم.\n2) [المستوى المتوقع] اذكر مادة سائلة.\n   الإجابة النموذجية: الماء أو الحليب أو العصير.\n3) [المستوى المتقدم] ما الذي يوجد داخل البالون المنفوخ؟\n   الإجابة النموذجية: الهواء وهو مادة غازية.", "1) [مستوى الدعم] ما حالات المادة الثلاث؟\n   الإجابة النموذجية: الصلبة والسائلة والغازية.\n2) [المستوى المتوقع] هل الهواء مادة؟ فسّر.\n   الإجابة النموذجية: نعم، لأنه يملأ البالون ونتنفسه، وهو خليط من الغازات.\n3) [المستوى المتقدم] لماذا كانت معظم الأشياء في قائمتنا صلبة؟\n   الإجابة النموذجية: لأن الأشياء التي نستخدمها في الصف تحتاج إلى شكل ثابت مثل الطاولات والأقلام.", "إرشاد الطالب: قراءة ص54 وكتابة 3 أمثلة لكل حالة من حالات المادة في البيت. إرشاد ولي الأمر: مساعدة ابنكم على تصنيف أشياء المطبخ إلى صلبة وسائلة وغازية."]}, {"axis": "خصائص حالات المادة الثلاث", "h": {"lesson": "1-3 المادة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "sb": "54", "ab": "—", "tg": "55–57", "n": "2 من 5", "axis": "خصائص حالات المادة الثلاث"}, "f": ["1. يصف خصائص يمكن ملاحظتها لكل حالة من حالات المادة.\nمخرج تعليمي آخر (2): يصنف المواد إلى صلبة وسائلة وغازية.", "المخرج 1 (يصف خصائص يمكن ملاحظتها لكل حالة من حالات المادة): فهم\nالمخرج 2 (يصنف المواد إلى صلبة وسائلة وغازية): تطبيق", "• التعلم المبني على اللعب\n• التعلم بالاكتشاف\n• التعلم التعاوني", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• صورة توضيحية\n• أخرى: بطاقات إشارات المرور (أحمر للصلب، أصفر للسائل، أخضر للغاز).", "الصلب، السائل، الغاز، الشكل، يأخذ شكل الإناء.", "يسكب المعلم ماء من كوب طويل إلى صحن واسع ويسأل: هل تغيّر شكل الماء؟ ثم يضع مكعبًا خشبيًا في الصحن ويسأل السؤال نفسه.", "1) التهيئة (5 دقائق، من الدقيقة 0 إلى 5):\n   دور المعلم: ينفذ العرض ويطرح السؤالين.\n   دور الطالب: يلاحظون أن الماء أخذ شكل الصحن والمكعب لم يتغير.\n2) الخصائص (10 دقائق، من الدقيقة 5 إلى 15):\n   دور المعلم: يكتب مع الطلاب: الصلب له شكل ثابت، السائل يأخذ شكل الإناء، الغاز ينتشر ولا نراه غالبًا.\n   دور الطالب: يكملون عبارات: «أعلم أنه صلب لأنه...».\n3) لعبة إشارات المرور (12 دقائق، من الدقيقة 15 إلى 27):\n   دور المعلم: يسمّي أشياء: الخشب، المسطرة، الحليب، الهواء، العصير.\n   دور الطالب: يرفعون البطاقة المناسبة لحالة كل مادة.\n4) زيادة التحدي (8 دقائق، من الدقيقة 27 إلى 35):\n   دور المعلم: يسمّي: معجون الأسنان، الكولا، الإسفنج.\n   دور الطالب: يناقشون المواد المحيرة ويبررون.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ما لون البطاقة للمادة السائلة في لعبتنا؟\n   الإجابة النموذجية: الأصفر.\n2) [المستوى المتوقع] أي حالة تأخذ شكل الإناء الذي توضع فيه؟\n   الإجابة النموذجية: السائلة (والغازية).\n3) [المستوى المتقدم] كيف تعرف أن الخشب مادة صلبة؟\n   الإجابة النموذجية: لأن له شكلًا ثابتًا لا يتغير بتغير الإناء.", "1) [مستوى الدعم] صنّف الحليب.\n   الإجابة النموذجية: سائل.\n2) [المستوى المتوقع] لماذا لا نرى الهواء رغم وجوده؟\n   الإجابة النموذجية: لأنه غاز عديم اللون.\n3) [المستوى المتقدم] هل الكولا سائل فقط؟ فسّر.\n   الإجابة النموذجية: لا، فيها سائل وفقاعات غاز.", "إرشاد الطالب: كتابة فقرة عن أشياء في الصف وتصنيفها إلى حالات المادة الثلاث. إرشاد ولي الأمر: لعب لعبة إشارات المرور مع ابنكم بأشياء من البيت."]}, {"axis": "غاز من خليط (نشاط 1-3)", "h": {"lesson": "1-3 المادة", "unit": "الوحدة الثالثة: المواد الصلبة والسائلة والغازية", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "sb": "55", "ab": "—", "tg": "55–57", "n": "3 من 5", "axis": "غاز من خليط (نشاط 1-3)"}, "f": ["1. يلاحظ تكوّن غاز عند خلط الخل وبيكربونات الصوديوم.\nمخرج تعليمي آخر (2): يستنتج أن الغاز مادة تشغل حيزًا رغم أننا لا نراه.", "المخرج 1 (يلاحظ تكوّن غاز عند خلط الخل وبيكربونات الصوديوم): فهم\nالمخرج 2 (يستنتج أن الغاز مادة تشغل حيزًا رغم أننا لا نراه): تحليل", "• التعلم بالاكتشاف\n• التعلم التعاوني\nاستراتيجيات أخرى: الاستقصاء العلمي.", "• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: ربع ملعقة بيكربونات الصوديوم لكل مجموعة، خل، قفازات مطاطية، أربطة مطاطية، كوب زجاجي أو بلاستيكي، ملعقة صغيرة.", "الغاز، ثاني أكسيد الكربون، الفقاعات، يشغل حيزًا.", "يعرض المعلم قفازًا مطاطيًا مسطحًا ويسأل: كيف ننفخ هذا القفاز دون أن نستخدم أفواهنا؟", "1) التهيئة (4 دقائق، من الدقيقة 0 إلى 4):\n   دور المعلم: يعرض القفاز ويطرح التحدي.\n   دور الطالب: يقترحون أفكارًا.\n2) التوجيه والسلامة (6 دقائق، من الدقيقة 4 إلى 10):\n   دور المعلم: يشرح الخطوات: البيكربونات في القفاز، الخل في نصف الكوب، ربط القفاز بالكوب قبل الخلط، وعدم تذوق المواد.\n   دور الطالب: يوزعون الأدوار.\n3) تنفيذ نشاط 1-3 (15 دقائق، من الدقيقة 10 إلى 25):\n   دور المعلم: يتابع المجموعات ويضمن عدم الخلط قبل الربط.\n   دور الطالب: يرفعون القفاز لتسقط البيكربونات في الخل ويلاحظون الفقاعات وانتفاخ القفاز.\n4) التفسير (10 دقائق، من الدقيقة 25 إلى 35):\n   دور المعلم: يوضح أن الفقاعات غاز ثاني أكسيد الكربون الناتج عن التفاعل، وأنه ملأ القفاز.\n   دور الطالب: يرسمون ما حدث ويكتبون تفسيرًا.\n5) الغلق (5 دقائق، من الدقيقة 35 إلى 40):\n   دور المعلم: يطرح أسئلة الختام.\n   دور الطالب: يجيبون.\nإجمالي زمن الحصة: 40 دقيقة.", "1) [مستوى الدعم] ماذا حدث للقفاز؟\n   الإجابة النموذجية: انتفخ.\n2) [المستوى المتوقع] ما اسم الغاز الذي تكوّن؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n3) [المستوى المتقدم] ماذا يثبت انتفاخ القفاز عن الغاز؟\n   الإجابة النموذجية: أن الغاز مادة تشغل حيزًا رغم أننا لا نراه.", "1) [مستوى الدعم] ماذا لاحظت في الكوب عند الخلط؟\n   الإجابة النموذجية: فقاعات.\n2) [المستوى المتوقع] لماذا ربطنا القفاز قبل خلط المادتين؟\n   الإجابة النموذجية: حتى لا يتسرب الغاز إلى الهواء قبل أن نجمعه.\n3) [المستوى المتقدم] توقع ماذا يحدث لو استخدمنا كمية أكبر من البيكربونات والخل.\n   الإجابة النموذجية: يتكون غاز أكثر في
