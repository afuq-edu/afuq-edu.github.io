<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الواجبات – علوم – الصف الرابع</title>
<style>
:root{--bg:#F3F6FB;--card:#FFFFFF;--ink:#16213A;--muted:#5B6782;--line:#DCE3EE;--brand:#2F6FB3;--brand-ink:#FFFFFF;--acc:#D98A0B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#18223A;--ink:#E8EDF7;--muted:#9AA6C2;--line:#2B3756;--brand:#6EA8FF;--brand-ink:#0F1626;--acc:#F2B035}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#18223A;--ink:#E8EDF7;--muted:#9AA6C2;--line:#2B3756;--brand:#6EA8FF;--brand-ink:#0F1626;--acc:#F2B035}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.7}
header{background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:960px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:24px;font-weight:800;text-decoration:none;flex:none}
.top h1{margin:0;font-size:clamp(20px,4vw,26px);line-height:1.3}
.top p{margin:0;color:var(--muted);font-size:14.5px}
.top a.back{color:var(--brand);text-decoration:none;font-weight:700}
main{flex:1;display:grid;place-items:center;padding:32px 16px}
.box{max-width:440px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:18px;padding:32px 22px}
.ic{width:72px;height:72px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.ic svg{width:38px;height:38px}
.box h2{margin:0 0 6px;font-size:26px}
.box p{margin:0;color:var(--muted)}
.box a{display:inline-block;margin-top:18px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:700;padding:.6em 1.4em;border-radius:12px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:18px 16px}
footer b{direction:ltr;unicode-bidi:isolate;color:var(--brand)}
</style>
</head>
<body>
<header><div class="top">
  <a class="logo" href="../../../" aria-label="جميع الصفوف">أ</a>
  <div><h1>الواجبات</h1><p><a class="back" href="../">→ علوم</a> · الصف الرابع</p></div>
</div></header>
<main><div class="box">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg></div>
  <h2>ستتوفر قريبًا</h2>
  <p>نعمل على إعداد واجبات علوم للصف الرابع، وستظهر هنا فور جاهزيتها.</p>
  <a href="../">العودة إلى المادة</a>
</div></main>
<footer>© منصة أفق التعليمية · للتواصل: <b>76506037</b></footer>
</body>
</html>
