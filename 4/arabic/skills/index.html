ان من ماله للمحتاج تقربًا إلى الله\n4. إعادة السرد: رواية القصة بلغة الطالب مع المحافظة على ترتيب أحداثها", "يعرض المعلم صورة سوق قديم ويسأل: ماذا تفعل لو رأيت طفلًا يبكي في السوق؟ ثم يقرأ عنوان النص ويطلب توقع أحداثه، ويعبّر التلميذ عن موقفه ويدوّن توقعين لأحداث القصة في ورقة صغيرة. (5 دقائق)", "1. آداب الاستماع وأهدافه: يذكّر المعلم بآداب الاستماع: الهدوء والانتباه وعدم المقاطعة، ويعرض أسئلة الكتاب ص 18 قبل الاستماع، ويقرأ التلميذ الأسئلة قراءة صامتة ويحدد ما سيبحث عنه أثناء الاستماع (7 دقائق)\nالاستراتيجيات: التنبؤ.\n\n2. الاستماع الأول (دون تدوين): يقرأ المعلم النص قراءة معبرة أو يشغّل التسجيل، ويتوقف عند لقاء الرسول ﷺ بالجارية ليسأل: ماذا تتوقعون أن يفعل؟ وينصت التلميذ ويتنبأ بالحدث التالي، ثم يقارن توقعه بما سمع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الاستماع الثاني (استماع وتدوين): يعيد المعلم القراءة ويوجّه الطلاب إلى الإجابة عن أسئلة «أنتبه» بالقلم الرصاص، ويدوّن التلميذ إجاباته عن سبب بكاء الجارية وكيف أنفق الرسول ﷺ الدراهم العشرة (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الاستماع الثالث (استماع وتصحيح): يقرأ المعلم النص للمرة الثالثة ويناقش الإجابات بأسلوب الرؤوس المرقمة ويدوّن الصحيح على السبورة، ويراجع التلميذ إجاباته ويصوّبها ويشارك مجموعته (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. أحلّل: وصف الشخصية: يوجّه المعلم إلى فقرة «أحلّل» ص 19 ويستخدم «فكّر، زاوج، شارك» لوصف شخصية الرسول ﷺ: رحيم، كريم، متواضع، مؤثر لغيره، ويستخرج التلميذ صفة ودليلها من النص ويتبادلها مع زميله ثم يعرضها (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n6. أسرد القصة بأسلوبي: يقسم المعلم الصف مجموعات ويطلب من كل مجموعة سرد جزء من القصة أو تمثيله بحوار قصير، ويسرد التلميذ جزء مجموعته أو يمثله أمام الصف مراعيًا التسلسل (8 دقائق)\nالاستراتيجيات: شارك.\n\n7. أبدي رأيي: أثر الصدقة: يناقش المعلم سؤال «أوضح أثر الصدقة في المجتمع» ويكتب أفكار الطلاب على السبورة، ويكتب التلميذ ثلاثة آثار للصدقة في الكتاب ص 19 (5 دقائق)\nالاستراتيجيات: تمثيل الأدوار.\n\n8. غلق الدرس – أيدٍ عمانية معطاءة: تتحدث كل مجموعة عن صور التكافل في المجتمع العماني اقتداءً بكرم الرسول ﷺ، مثل مساعدة المحتاج وإفطار الصائم في رمضان، وتقترح عملًا خيريًا بسيطًا يقوم به الصف (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لماذا كانت الجارية تبكي في السوق؟ (أ) لأنها أضاعت الدرهمين (ب) لأنها ضلّت الطريق (ج) لأنها جائعة\nالإجابة: (أ) لأنها أضاعت الدرهمين\n\nس2 (مستوى التطبيق): ما شعور الرسول ﷺ حين انصرف من عند أهل الجارية بعد أن أعتقوها؟ (أ) السرور والرضا (ب) الحزن والضيق (ج) الخوف والقلق\nالإجابة: (أ) السرور والرضا\n\nس3 (مستوى الاستدلال): رتّب الأحداث: (شراء القميص – إعطاء الجارية درهمين – عتق الجارية).\nالإجابة: إعطاء الجارية درهمين، ثم شراء القميص، ثم عتق الجارية.\n\n• نشاط علاجي (لمن لم يتقن): يستعين المعلم بعشرة دراهم ورقية ليعدّ مع التلميذ كيف أنفق الرسول ﷺ الدراهم: درهمان للجارية، وأربعة لقميص كسا به رجلًا محتاجًا، وأربعة لقميص آخر؛ وللتحقق يسأله: لماذا كانت الجارية تبكي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة سرد قصة «الرسول ﷺ لا يرد سائلًا» بلغتهم مرتبين أحداثها، واستخراج ثلاث صفات للرسول ﷺ من مواقفه فيها، ثم يقترحون عملًا يقتدون فيه برحمته.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: رافق الرسول ﷺ الجارية إلى .... لأنها خافت أن يعاقبوها.\nالإجابة: أهلها\n\nس2 (مستوى التطبيق): أكمل: كانت الدراهم العشرة مباركة؛ فقد كُسي بها رجلان وأُعتقت بها .....\nالإجابة: جارية\n\nس3 (مستوى الاستدلال): لو رأيت زميلًا أضاع مصروفه، ماذا تفعل اقتداءً بالرسول ﷺ؟\nالإجابة: أواسيه وأشاركه مصروفي أو أساعده في البحث عنه.", "- للطالب: أعِد سرد قصة «الرسول ﷺ لا يرد سائلًا» لأسرتك بأسلوبك، وراجع إجاباتك ص 18.\n- لولي الأمر: استمِع إلى سرد ابنك للقصة وشجّعه على ذكر الأحداث بترتيبها.\n- للطالب: اكتب في دفترك موقفًا تصدقت فيه أو ساعدت محتاجًا.\n- لولي الأمر: شارك ابنك في عمل خيري بسيط وحدّثه عن أثر الصدقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=11"]}]}, {"t": "المستند البصري: قراءة غلاف قصة", "u": "المحور الثاني: قصص وعبر", "s": [{"k": "التحدث", "p": ["التعرف على عناصر غلاف القصة وقراءتها", "قراءة دلالات الصور والألوان على الغلاف والتنبؤ بموضوع القصة"], "w": "الأسبوع العاشر", "f": ["1. يحدد عناصر غلاف القصة: العنوان، واسم الكاتب، واسم الرسام، ودار النشر (15 دقيقة)\n2. يجيب عن أسئلة الكتاب المتعلقة بالغلاف (15 دقيقة)\n3. يستنتج دلالة الصورة والألوان المستخدمة في الغلاف (15 دقيقة)\n4. يتنبأ بموضوع القصة من خلال عناصر الغلاف (5 دقائق)\n\nمخرج تعليمي آخر:\n- يحترم حقوق المؤلف والرسام المذكورة على الغلاف (10 دقائق)\n- يصمم غلافًا بسيطًا لقصة يحبها (20 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تحليل\nالمخرج الآخر (1): تقييم\nالمخرج الآخر (2): إبداع", "1. السؤال والجواب\n2. الرؤوس المرقمة\n3. التعلم بالاكتشاف\n4. التنبؤ\n5. التعلم التعاوني\n6. العصف الذهني\n7. التعلم المبني على المشاريع\n8. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: أغلفة قصص من مكتبة الصف\n4. الأقلام\n5. أخرى: أوراق ملونة\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. الغلاف: الصفحة الخارجية للكتاب وتحمل عنوانه وبياناته\n2. دار النشر: الجهة التي تطبع الكتاب وتنشره\n3. الرسام: الفنان الذي رسم صور القصة\n4. ملامح الوجه: ما يظهر على وجه الشخص من فرح أو حزن أو دهشة\n5. التنبؤ: توقع موضوع القصة وأحداثها قبل قراءتها", "يعرض المعلم ثلاث قصص من مكتبة الصف ويسأل: كيف تختار قصة لتقرأها قبل أن تفتحها؟ ويذكر التلميذ ما يجذبه في الغلاف: العنوان والصورة والألوان. (5 دقائق)", "1. أتأمل الغلاف: يعرض المعلم غلاف القصة ص 20 على السبورة الذكية ويشير إلى مواقع العنوان واسم الكاتب والرسام ودار النشر، ويحدد كل عنصر على الغلاف ويكتب اسمه في جدول صغير (10 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.\n\n2. أجيب عن الأسئلة: يوزع المعلم الأسئلة 1–6 على الرؤوس المرقمة ويستقبل الإجابات، ويجيب التلميذ عن الأسئلة في مجموعته ويعرض المتحدث الإجابة (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. نشاط تطبيقي: يوزّع المعلم أغلفة قصص حقيقية على المجموعات، وتستخرج كل مجموعة عناصر غلاف قصتها وتعرضها (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n4. أقرأ الصورة: يناقش المعلم الأسئلة 7–12: ما يمسكه الصبي، والكلمة المكتوبة أسفل الورقة، ومدى توافق ملامحه مع كلمة (ناجح)، ويصف التلميذ ملامح الصبي ويعلل رأيه في توافقها مع الكلمة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. دلالة الألوان: يسأل المعلم: لماذا تبدو كلمة (ناجح) باهتة؟ ولماذا الخلفية حمراء؟ ويوجه إلى العصف الذهني، ويقترح التلميذ دلالات الألوان ويستمع إلى آراء زملائه (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n6. أتنبأ وأصمم: يطلب المعلم توقع موضوع القصة ثم تصميم غلاف بسيط لقصة تختارها المجموعة، ويكتب التلميذ توقعه ثم يرسم مع مجموعته غلافًا بعناصره كاملة (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – غلاف قصة عمانية: تصمم كل مجموعة شفهيًا غلاف قصة عن شخصية أو مكان في عمان، فتحدد العنوان واسم الكاتب والرسام ودار النشر وصورة الغلاف، ثم تعرضه على الصف في نصف دقيقة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أين يُكتب عنوان القصة عادة؟ (أ) في آخر صفحة (ب) في أعلى الغلاف بخط كبير (ج) داخل الصورة فقط\nالإجابة: (ب) في أعلى الغلاف بخط كبير\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): تساعد صورة الغلاف القارئ على توقع موضوع القصة.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): هل تتوافق ملامح صبي حزين مع كلمة (ناجح)؟ علّل.\nالإجابة: لا تتوافق؛ لأن الناجح يفرح عادة، وقد يدل ذلك على أن في القصة مشكلة أو مفاجأة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم غلاف قصة حقيقية ويلصق مع التلميذ بطاقات (العنوان، الكاتب، الرسام، دار النشر) على مواضعها، ويلاحظان كبر خط العنوان؛ وللتحقق يسأله: أين يُكتب عنوان القصة عادة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم غلاف لقصة من تأليفهم يختارون فيه صورة وألوانًا معبرة ويكتبون عناصره كاملة، ثم يتنبأ زملاؤهم بموضوع القصة من الغلاف.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): من الذي يرسم صور القصة؟ (أ) الرسام (ب) الكاتب (ج) الناشر\nالإجابة: (أ) الرسام\n\nس2 (مستوى التطبيق): العنصر الذي يجذب القارئ أولًا في الغلاف غالبًا هو: (أ) رقم الطبعة (ب) الصورة والعنوان (ج) اسم المطبعة\nالإجابة: (ب) الصورة والعنوان\n\nس3 (مستوى الاستدلال): اذكر ثلاثة عناصر يجب أن يتضمنها الغلاف الذي صممته.\nالإجابة: العنوان، واسم الكاتب، والصورة المعبرة، ودار النشر.", "- للطالب: اختر قصة من البيت واكتب عنوانها واسم كاتبها ورسامها ودار نشرها.\n- لولي الأمر: ساعد ابنك على قراءة بيانات غلاف قصة في المنزل.\n- للطالب: أكمل تلوين الغلاف الذي صممته وأحضره لعرضه في ركن القراءة.\n- لولي الأمر: ناقش ابنك في توقعه لموضوع قصة قبل قراءتها معه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=12"]}]}, {"t": "الدرس القرائي الأول: عمر يتفقد الرعية", "u": "المحور الثاني: قصص وعبر", "s": [{"k": "التحدث", "p": ["أشاهد وأتحدث: مساعدة المحتاجين"], "w": "الأسبوع العاشر", "f": ["1. يصف ما يراه في صورة «أشاهد وأتحدث» بجمل فصيحة (10 دقائق)\n2. يتحدث عن طرق مساعدة الآخرين ومشاركتهم (10 دقائق)\n\nمخرج تعليمي آخر:\n- يروي موقفًا ساعد فيه محتاجًا بثقة وطلاقة (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "1. الحوار والمناقشة\n2. فكّر، زاوج، شارك\n3. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية", "1. المشاركة: أن تقتسم ما تملكه مع غيرك\n2. المحتاج: من يحتاج إلى العون في طعام أو مال أو غيرهما", "يسأل المعلم: هل تتقاسم وجبتك مع زميلك أحيانًا؟ لماذا؟ ويجيب التلميذ بجملة كاملة ويذكر سببًا. (5 دقائق)", "1. أصف الصورة: يعرض المعلم صورة ص 21 ويطرح السؤال الأول ويوجه إلى الوصف من العام إلى التفاصيل، ويصف التلميذ الصورة بثلاث جمل على الأقل مستخدمًا ألفاظًا دقيقة (6 دقائق)\nالاستراتيجيات: فكّر.\n\n2. نتحاور: طرق مساعدة الغير: يدير المعلم حوارًا حول السؤال الثالث ويدون الأفكار في خريطة ذهنية على السبورة، ويقترح التلميذ طريقة للمساعدة ويضيفها إلى الخريطة (6 دقائق)\nالاستراتيجيات: زاوج.\n\n3. أروي موقفًا: ينظم المعلم عرضًا شفهيًا قصيرًا: بداية الموقف، وما فعلته، وشعورك، ويروي التلميذ لزملائه موقفًا ساعد فيه محتاجًا ملتزمًا الوقت (8 دقائق)\nالاستراتيجيات: شارك.\n\n4. غلق الدرس – سفراء العون: يقف الطلاب في دائرة، ويرمي المعلم كرة صغيرة إلى طالب فيذكر بجملة كاملة طريقة لمساعدة محتاج ثم يمرر الكرة لزميله، وتختم كل مجموعة بذكر صورة من صور التكافل في الحي أو القرية العمانية كمساعدة الأسر المحتاجة وزيارة المرضى وكبار السن (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): مشاركة الزميل في الطعام سلوك يدل على الأنانية.\nالإجابة: خطأ، والصواب: يدل على المحبة والكرم\n\nس2 (مستوى التطبيق): أيّ مما يأتي طريقة لمساعدة الآخرين؟ (أ) السخرية من الفقير (ب) التصدق على المحتاج (ج) إهمال الجار\nالإجابة: (ب) التصدق على المحتاج\n\nس3 (مستوى الاستدلال): لماذا يحب الناس من يساعدهم؟\nالإجابة: لأنه يشعر بهم ويخفف عنهم ويدخل السرور إلى قلوبهم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لمواقف مساعدة (التصدق، مشاركة الطعام) وأخرى لمواقف سلبية، ويفرزها التلميذ مع زميل إلى «يساعد» و«لا يساعد»؛ وللتحقق يسأله: اذكر طريقة لمساعدة الآخرين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برواية موقف ساعدوا فيه محتاجًا بثقة وطلاقة، ثم يتوقعون من العنوان وصورة نص «عمر يتفقد الرعية» ماذا فعل عمر، ويتحققون من توقعهم بعد القراءة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: مساعدة المحتاج تنشر .... بين الناس.\nالإجابة: المحبة\n\nس2 (مستوى التطبيق): عند حديثك أمام زملائك يجب أن: (أ) تسرع حتى لا يفهموا (ب) تنظر إلى الأرض دائمًا (ج) تتحدث بصوت واضح ولغة فصيحة\nالإجابة: (ج) تتحدث بصوت واضح ولغة فصيحة\n\nس3 (مستوى الاستدلال): اقترح فكرة جديدة لمساعدة المحتاجين في حيّك.\nالإجابة: مثل: جمع الملابس الزائدة وتوزيعها، أو تنظيم سلة غذاء للأسر المحتاجة.", "- للطالب: حدّث أسرتك عن طريقة ساعدت بها أحدًا اليوم.\n- لولي الأمر: شجّع ابنك على مشاركة أخوته وزملائه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=13"]}, {"k": "القراءة", "p": ["أتصفح: قراءة العنوان والصورة والتعريف بالكاتب", "القراءة النموذجية والجهرية: الجزء الأول من النص", "القراءة الجهرية: الجزء الثاني من النص وتمثيل الحوار", "المفردات والتراكيب: معاني الكلمات ومضاداتها", "المستوى الأول: فهم المعنى الصريح وأحداث النص", "المستوى الثاني: استنتاج المعاني والصفات", "المستوى الثالث: التفسير ودمج الأفكار", "المستوى الرابع: التقييم وإبداء الرأي ومحاكاة التراكيب", "القراءة الأدائية ومسرحة النص", "مراجعة الدرس وتقويمه"], "w": "الأسبوع العاشر – الأسبوع الحادي عشر – الأسبوع الثاني عشر", "f": ["1. يتصفح النص قراءة سريعة ويتوقع المقصود بـ«عمر» من العنوان (10 دقائق)\n2. يستخرج اسم كاتب النص ومصدره (20 دقيقة)\n3. يقرأ الجزء الأول من النص قراءة جهرية صحيحة ضابطًا بنية الكلمات (20 دقيقة)\n4. يعبّر بصوته عن معاني الحوار بين عمر والمرأة (10 دقائق)\n5. يقرأ النص كاملًا قراءة جهرية مسترسلة مراعيًا علامات الترقيم (20 دقيقة)\n6. يمثل الحوار بين عمر وغلامه والمرأة تمثيلًا معبرًا (10 دقائق)\n7. يحدد معاني المفردات الجديدة من السياق (15 دقيقة)\n8. يصل الكلمة بمضادها ويوظفها في جمل (15 دقيقة)\n9. يجيب عن أسئلة المستوى الأول بالرجوع إلى النص (5 دقائق)\n10. يحدد الفكرة الرئيسة للنص من بين بدائل (15 دقيقة)\n11. يستنتج صفات الشخصيتين الرئيستين من أفعالهما وأقوالهما (10 دقائق)\n12. يختار المعنى الصحيح للكلمات من بين بدائل (20 دقيقة)\n13. يوضح العلاقة بين عنوان النص ومضمونه (15 دقيقة)\n14. يقترح عناوين مناسبة لفقرات النص (10 دقائق)\n15. يبدي رأيه في نهاية النص معللًا (10 دقائق)\n16. يحاكي التركيبين «واستمر... حتى» و«أنتَ أولى بـ...» في جمل من إنشائه (15 دقيقة)\n17. يقرأ النص قراءة أدائية معبرة عن المشاعر (5 دقائق)\n18. يمسرح أحداث النص في مشاهد قصيرة (20 دقيقة)\n19. يراجع أفكار النص ومفرداته وأنماطه اللغوية والإملائية (10 دقائق)\n20. يطبق ما تعلمه في تدريبات شاملة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يربط بين صورة النص ومضمونه المتوقع (10 دقائق)\n- يلتزم آداب القراءة والاستماع لزملائه (10 دقائق)\n- يقدّر تواضع عمر بن الخطاب رضي الله عنه وحرصه على رعيته (10 دقائق)\n- يستخدم المعجم المدرسي للتحقق من معنى كلمة (10 دقائق)\n- يكتب السؤال المناسب لإجابة وردت في حوار النص (20 دقيقة)\n- يقارن بين الشخصيتين الرئيستين في النص (10 دقائق)\n- يربط مضمون الحديث الشريف «كلكم راع» بموقف عمر (15 دقيقة)\n- يقترح نهاية أخرى للنص من وجهة نظره (15 دقيقة)\n- يتعاون مع زملائه في الأداء الجماعي (15 دقيقة)\n- يقيّم مستوى تعلمه ويحدد ما يحتاج إلى تحسين (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج 7: فهم\nالمخرج 8: تطبيق\nالمخرج 9: تذكر\nالمخرج 10: فهم\nالمخرج 11: تحليل\nالمخرج 12: فهم\nالمخرج 13: تحليل\nالمخرج 14: إبداع\nالمخرج 15: تقييم\nالمخرج 16: تطبيق\nالمخرج 17: تطبيق\nالمخرج 18: إبداع\nالمخرج 19: تذكر\nالمخرج 20: تطبيق\nالمخرج الآخر (1): تحليل\nالمخرج الآخر (2): تقييم\nالمخرج الآخر (3): تقييم\nالمخرج الآخر (4): تطبيق\nالمخرج الآخر (5): تطبيق\nالمخرج الآخر (6): تحليل\nالمخرج الآخر (7): تحليل\nالمخرج الآخر (8): إبداع\nالمخرج الآخر (9): تطبيق\nالمخرج الآخر (10): تقييم", "1. التنبؤ\n2. السؤال والجواب\n3. التعلم الذاتي\n4. التعلم بالنمذجة\n5. تعدد القراءات\n6. التعلم التعاوني\n7. تمثيل الأدوار\n8. التعلم المبني على اللعب\n9. تبادل البطاقات\n10. الرؤوس المرقمة\n11. ما هو السؤال؟\n12. فكّر، زاوج، شارك\n13. العصف الذهني\n14. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الوسائل المتعددة (سمعية - بصرية)\n5. السبورة التقليدية\n6. أخرى: بطاقات أدوار الشخصيات\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n8. أخرى: بطاقات المفردات\n9. أخرى: المعجم المدرسي\n10. الأقلام\n11. أخرى: مخطط فن للمقارنة\n12. أخرى: بطاقات عناوين الفقرات\n13. أخرى: أدوات تمثيل بسيطة\n14. أخرى: ورقة عمل شاملة", "1. التصفح: قراءة سريعة للعنوان والصور والحواشي لأخذ فكرة عامة\n2. الرعية: الناس الذين يتولى الحاكم أمورهم\n3. الركب: جماعة المسافرين\n4. يهرولان: يسرعان في المشي\n5. العِدْل: كيس كبير محمول على أحد جانبي الدابة\n6. الوزر: الإثم والذنب\n7. يتضاغون: يصيحون ويبكون من شدة الجوع\n8. الصحفة: إناء واسع يوضع فيه الطعام\n9. المضاد: الكلمة التي تعطي معنى عكسيًا\n10. المعنى الصريح: المعلومة المذكورة بلفظها في النص\n11. الفكرة الرئيسة: المعنى الأهم الذي يدور حوله النص كله\n12. الاستنتاج: الوصول إلى معنى غير مذكور صراحة من خلال الأدلة\n13. الشخصية الرئيسة: الشخصية التي تدور حولها أحداث القصة\n14. المسؤولية: أن يقوم الإنسان بما يجب عليه تجاه من يرعاهم\n15. عنوان الفقرة: عبارة قصيرة تلخص فكرة الفقرة\n16. النهاية: الحدث الأخير الذي تنتهي به القصة\n17. المحاكاة: كتابة جملة على نمط تركيب معطى\n18. القراءة الأدائية: قراءة تعبر بالصوت عن مشاعر الشخصيات ومعاني الكلام\n19. المشهد: جزء من القصة يُمثّل في مكان وزمن واحد\n20. المراجعة الشاملة: استعادة أهم ما تعلمه الطالب في الدرس\n21. التقييم الذاتي: حكم الطالب على مستوى إتقانه", "يكتب المعلم العنوان على السبورة ويسأل: من عمر؟ وما معنى «يتفقد»؟ ويتوقع التلميذ إجابات ويكتبها في ركن التوقعات. (5 دقائق)", "1. أتصفح النص: يحدد المعلم زمنًا قصيرًا لتصفح ص 23–25 ويطلب ملاحظة العنوان والصور والحاشية، ويتصفح التلميذ ويلاحظ ويستعد للأسئلة (12 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n2. أجيب عن أسئلة أتصفح: يناقش المعلم أسئلة ص 22: عمل المرأة في الصورة، وحال الأطفال، وحالة الأسرة، ويجيب التلميذ ويختار حال الأسرة (فقيرة) معللًا من الصورة (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الكاتب والمصدر: يعرّف المعلم بالكاتب عبد الحميد جودة السحار وكتاب «قصص الخلفاء الراشدين»، ويكتب التلميذ اسم الكاتب ومصدر النص في الكتاب (11 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة النموذجية: يقرأ المعلم من «خرج عمر بن الخطاب» إلى «أنا أحمله عنك» قراءة نموذجية معبّرة عن الحوار، ويتابع التلميذ في الكتاب ويضع خطًا تحت الكلمات الصعبة (11 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n5. القراءة الجهرية: يوزع المعلم الفقرات على الطلاب، ويعالج أخطاء النطق والضبط فورًا بلطف، ويقرأ التلميذ فقرته جهريًا بصوت واضح ونبرة مناسبة (21 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قراءة الحوار في ثنائيات: يوزع المعلم دوري عمر والمرأة على أزواج من الطلاب، ويقرأ التلميذ الحوار مع زميله ممثلًا المعنى بنبرة الصوت (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. القراءة النموذجية للجزء الثاني: يقرأ المعلم من «فقال له عمر في غضب» إلى نهاية النص ص 25، ويتابع التلميذ ويحدد علامات الترقيم: الاستفهام والتعجب (10 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n8. القراءة الجهرية المسترسلة: يطلب المعلم قراءة متتابعة للنص كاملًا ويقيّم الطلاقة والضبط، ويقرأ التلميذ جهريًا مراعيًا الوقف عند علامات الترقيم (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n9. تمثيل الحوار: يوزع المعلم بطاقات أدوار: عمر، والغلام، والمرأة، والراوي، ويمثل التلميذ دوره بنبرة معبرة أمام الصف (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. أكتشف المعنى من السياق: يقرأ المعلم الجمل التي فيها: عِدلًا، صحفة، يتضاغون، وزري، ويوجه إلى استنتاج المعنى، ويستنتج التلميذ المعنى ويختار البديل الصحيح في السؤال ص 27 (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. الكلمة ومضادها: ينفذ المعلم نشاط «تبادل البطاقات»: بطاقة كلمة وبطاقة مضاد، ويبحث التلميذ عن زميله صاحب المضاد ثم ينفذان السؤال ص 28 (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أستبدل وأوظف: يوجه المعلم إلى إعادة كتابة الجمل باستبدال ما تحته خط، ثم توظيف كلمة في جملة جديدة، ويعيد التلميذ كتابة الجملتين ويكتب جملة من إنشائه (11 دقيقة)\nالاستراتيجيات: تبادل البطاقات.\n\n13. أسئلة الأحداث: يوزع المعلم أسئلة ص 26 (ماذا رأى عمر، حال العائلة، ما في القدر، ماذا فعل) على الرؤوس المرقمة. يعرض إجابات من الحوار ويطلب كتابة أسئلتها (السؤال الخامس ص 27)، ويبحث التلميذ عن الإجابة في النص ويعرضها المتحدث برقم المجموعة. يكتب السؤال المناسب لكل إجابة (25 دقيقة)\nالاستراتيجيات: ما هو السؤال؟ (9 دقائق).\n\n14. الفكرة الرئيسة: يناقش المعلم البدائل الأربعة للفكرة الرئيسة ويطلب التعليل، ويختار التلميذ «الفقر والجوع» ويعلل اختياره (15 دقيقة)\nالاستراتيجيات: ما هو السؤال؟.\n\n15. أستنتج الصفات: يقرأ المعلم مواقف من النص ويطرح: ماذا يدل هذا الفعل على صاحبه؟ ويستنتج التلميذ صفة ودليلها: عمر متواضع لأنه حمل الدقيق بنفسه (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n16. أقارن بين الشخصيتين: يرسم المعلم مخطط فن ويوجه المجموعات إلى إكماله، وتملأ المجموعة أوجه الشبه والاختلاف بين عمر والمرأة (17 دقيقة)\nالاستراتيجيات: شارك.\n\n17. أسئلة المستوى الثاني: يناقش المعلم سؤال اختيار المعنى الصحيح ص 27 وسؤال الشخصيتين ص 28، ويجيب التلميذ كتابيًا ويقرأ إجابته (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n18. العنوان والمضمون: يناقش المعلم: لماذا كان عمر يخرج ليلًا؟ وما علاقة «يتفقد الرعية» بأحداث النص؟ ويوضح التلميذ أن خروجه ليلًا كان لتفقد أحوال الناس (17 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n19. عناوين الفقرات: يقسم المعلم النص إلى ثلاث فقرات كما في ص 30 ويطلب عنوانًا لكل فقرة، وتقترح المجموعة عنوانًا وتكتبه على البطاقة (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n20. الحديث والموقف: يوجه المعلم إلى السؤال الرابع ص 29 وسؤال «الأفكار ما عدا» ص 30، ويربط التلميذ بين الحديث وفعل عمر، ويحدد الفكرة غير الواردة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n21. أقرأ وأعلل: يطلب المعلم قراءة أكثر فقرة أعجبت الطالب بصوت جهير وتعليل اختياره، ويقرأ التلميذ الفقرة ويذكر سبب إعجابه (11 دقيقة)\nالاستراتيجيات: فكّر.\n\n22. أبدي رأيي وأقترح نهاية: يناقش المعلم رأي الطلاب في النهاية ويوجههم إلى اقتراح نهاية أخرى، ويكتب التلميذ رأيه ونهاية مقترحة في ثلاث جمل (13 دقيقة)\nالاستراتيجيات: زاوج.\n\n23. أحاكي التراكيب: يمثل المعلم للتركيبين على السبورة ثم يطلب المحاكاة ص 31، ويكتب التلميذ جملتين على نمط التركيبين (11 دقيقة)\nالاستراتيجيات: شارك.\n\n24. تقسيم المشاهد: يقسم المعلم النص ثلاثة مشاهد: لقاء المرأة، حمل الدقيق، إطعام الصبيان، ويختار التلميذ مشهده ودوره (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n25. التدريب في المجموعات: يتابع المعلم تدريب المجموعات ويوجه النبرة والحركة، ويتدرب التلميذ على أداء الحوار بالأدوار (17 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n26. العرض والتقييم: تعرض المجموعات مشاهدها ويقيمها الصف ببطاقة نجوم، ويؤدي التلميذ مشهده ويقيم أداء زملائه (11 دقيقة)\nالاستراتيجيات: تمثيل الأدوار.\n\n27. ورقة عمل شاملة: يوزع المعلم ورقة عمل تجمع: أسئلة فهم، ومفردات، وجملة اسمية، وهمزة متطرفة، ويحل التلميذ الورقة فرديًا (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n28. التصحيح التعاوني: يصحح المعلم الإجابات مع الطلاب ويعالج الأخطاء الشائعة، ويصحح التلميذ ويناقش سبب الخطأ (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n29. بطاقة التقييم الذاتي: يوزع المعلم بطاقة: أتقنت / أحتاج تدريبًا لكل مهارة، ويقيّم التلميذ نفسه ويحدد مهارة يريد تحسينها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n30. غلق الدرس – نتفقد جيراننا: يمثّل كل زوج موقفًا يتفقد فيه أحدهما حال جار مسن أو أسرة محتاجة في الحي، كما كان عمر رضي الله عنه يتفقد الرعية، ويربطان ذلك بقيمة التكافل في المجتمع العماني (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): المقصود بـ«عمر» في عنوان النص هو: (أ) عمر بن عبد العزيز (ب) عمر بن الخطاب رضي الله عنه (ج) طفل اسمه عمر\nالإجابة: (ب) عمر بن الخطاب رضي الله عنه\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): كانت المرأة تعرف أن من يطعم صبيانها هو أمير المؤمنين.\nالإجابة: خطأ، والصواب: لم تكن تعرفه\n\nس3 (مستوى الاستدلال): ما الدرس المستفاد من قصة «عمر يتفقد الرعية»؟\nالإجابة: أن المسؤول يتفقد أحوال من يرعاهم ويساعدهم بنفسه.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لمواقف مساعدة (التصدق، مشاركة الطعام) وأخرى لمواقف سلبية، ويفرزها التلميذ مع زميل إلى «يساعد» و«لا يساعد»؛ وللتحقق يسأله: اذكر طريقة لمساعدة الآخرين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برواية موقف ساعدوا فيه محتاجًا بثقة وطلاقة، ثم يتوقعون من العنوان وصورة نص «عمر يتفقد الرعية» ماذا فعل عمر، ويتحققون من توقعهم بعد القراءة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): مصدر النص كتاب «قصص الخلفاء الراشدين».\nالإجابة: صح\n\nس2 (مستوى التطبيق): معنى «فأخرج عدلًا»: (أ) ميزانًا (ب) كيسًا كبيرًا من الدقيق (ج) إناءً\nالإجابة: (ب) كيسًا كبيرًا من الدقيق\n\nس3 (مستوى الاستدلال): كوّن جملة اسمية تبدأ بضمير رفع منفصل وتنتهي بكلمة آخرها همزة.\nالإجابة: مثل: نحن نحب الهدوء.", "- للطالب: اقرأ النص ص 23–25 قراءة صامتة استعدادًا للقراءة الجهرية.\n- لولي الأمر: اسأل ابنك عن الخليفة عمر بن الخطاب وما يعرفه عن عدله.\n- للطالب: درّب نفسك على قراءة الجزء الأول ص 23–24 قراءة جهرية.\n- لولي الأمر: استمع إلى قراءة ابنك وصحّح له الكلمات بهدوء.\n- للطالب: اقرأ النص كاملًا لأسرتك ومثّل حوار عمر مع المرأة.\n- لولي الأمر: شارك ابنك تمثيل الحوار وامدحه على حسن الأداء.\n- للطالب: اكتب في دفترك خمس كلمات جديدة من النص مع معانيها.\n- لولي الأمر: اطلب من ابنك أن يشرح لك معنى كلمتين جديدتين.\n- للطالب: أجب عن أسئلة المستوى الأول ص 26–27 في كتابك.\n- لولي الأمر: تابع إجابات ابنك وتأكد من رجوعه إلى النص.\n- للطالب: أكمل مخطط المقارنة بين الشخصيتين في دفترك.\n- لولي الأمر: ناقش ابنك في صفات القائد المسؤول.\n- للطالب: اكتب عناوين الفقرات الثلاث في كتابك ص 30.\n- لولي الأمر: حدّث ابنك عن مسؤوليته تجاه أخوته الصغار.\n- للطالب: اكتب نهاية أخرى للقصة في دفترك واقرأها لأسرتك.\n- لولي الأمر: ناقش ابنك في رأيه وشجعه على التعليل.\n- للطالب: درّب أفراد أسرتك على تمثيل مشهد من القصة.\n- لولي الأمر: شاهد أداء ابنك وامدح تعبيره.\n- للطالب: راجع الدرس كاملًا ص 21–40 استعدادًا للدرس التالي.\n- لولي الأمر: اطلع على بطاقة التقييم الذاتي لابنك وساعده في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=13"]}, {"k": "الأنماط اللغوية", "p": ["الأنماط اللغوية (1): الجملة الاسمية المبدوءة باسم إشارة", "الأنماط اللغوية (2): الجملة الاسمية المبدوءة بضمير رفع منفصل", "الأنماط اللغوية (3): وصف صورة بجمل اسمية"], "w": "الأسبوع الحادي عشر", "f": ["1. يتعرف الجملة الاسمية المبدوءة باسم إشارة ويحدد ركنيها (10 دقائق)\n2. يستخرج الجمل الاسمية من فقرة ويقسمها إلى ركنيها (20 دقيقة)\n3. يتعرف ضمائر الرفع المنفصلة ويوظفها مبتدأً في جمل اسمية (10 دقائق)\n4. يكمل جملًا اسمية بالضمير المناسب للمخاطب والغائب والمتكلم (20 دقيقة)\n5. يصف صورة بجمل اسمية تبدأ باسم إشارة أو ضمير رفع منفصل (20 دقيقة)\n6. يميز الجملة الاسمية من الجملة الفعلية في فقرة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يميز اسم الإشارة للمفرد والمثنى والجمع (10 دقائق)\n- يطابق بين الضمير والخبر في الإفراد والتثنية والجمع (10 دقائق)\n- ينتج فقرة قصيرة سليمة تتضمن جملًا اسمية (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\nالمخرج الآخر (1): تحليل\nالمخرج الآخر (2): تحليل\nالمخرج الآخر (3): إبداع", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات أسماء الإشارة\n4. السبورة التقليدية\n5. أخرى: مكعب الضمائر\n6. صورة توضيحية\n7. الأقلام", "1. الجملة الاسمية: الجملة التي تبدأ باسم\n2. اسم الإشارة: اسم يدل على شيء معين بالإشارة إليه مثل: هذا، تلك، أولئك\n3. ركنا الجملة الاسمية: المبتدأ والخبر\n4. الضمير المنفصل: كلمة تدل على متكلم أو مخاطب أو غائب ولا تتصل بغيرها مثل: أنا، أنتم، هم\n5. المطابقة: موافقة الخبر للمبتدأ في العدد والنوع\n6. الجملة الفعلية: الجملة التي تبدأ بفعل\n7. الوصف: ذكر صفات الشيء وتفاصيله بالكلمات", "يشير المعلم إلى أشياء في الصف ويقول: هذا كتاب، تلك نافذة. ويسأل: بم بدأت الجمل؟ ويلاحظ التلميذ أنها بدأت بكلمات تشير إلى الأشياء. (5 دقائق)", "1. أقرأ وألاحظ: يعرض المعلم فقرة ص 32 ويلوّن الجمل المبدوءة بـ«هذه، تلك» ويسأل عن نوع الكلمات التي بدأت بها، ويقرأ التلميذ الفقرة ويحدد أن الجمل بدأت بأسماء (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أستنتج القاعدة: يقود الطلاب إلى أن الجملة الاسمية تتكون من مبتدأ وخبر، ويقسم «هذه الحياة مدرسة» في جدول، ويقسم التلميذ الجمل الملونة إلى ركنيها في الجدول (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أوظف اسم الإشارة: يوزع المعلم بطاقات أسماء الإشارة ويطلب تكوين جمل محاكاة للنموذج ص 33، ويكوّن التلميذ جملة اسمية تبدأ باسم الإشارة الذي في بطاقته (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أتعرف الضمائر: يعرض المعلم جدول الضمائر: أنا، نحن، أنتَ، أنتِ، أنتما، أنتم، أنتن، هو، هي، هما، هم، هن، ويقرأ التلميذ الضمائر ويصنفها إلى متكلم ومخاطب وغائب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. لعبة مكعب الضمائر: يرمي المعلم مكعبًا على وجوهه ضمائر ويطلب جملة اسمية تبدأ بالضمير الظاهر، ويكوّن التلميذ جملة مطابقة مثل: هم طلاب مجتهدون (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تدريب الكتاب: يوجه المعلم إلى نشاط توظيف ضمير الرفع المنفصل ص 33 محاكيًا النموذج، ويكمل التلميذ الجمل في الكتاب ويقرأها لزميله (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. أميز الجملتين: يعرض المعلم فقرة قصيرة ويطلب تلوين الجمل الاسمية بلون والفعلية بآخر، والتلاميذ يلون الجمل ويعلل التصنيف (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. أصف الصورة: يعرض المعلم صورة ص 34 ويطلب جمل وصف تبدأ باسم إشارة أو ضمير، ويكتب التلميذ أربع جمل اسمية في وصف الصورة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. فقرة المجموعة: تجمع كل مجموعة جملها في فقرة متماسكة ويقيّمها المعلم، وتقرأ المجموعة فقرتها وتحدد ركني كل جملة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. غلق الدرس – هذه عُمان: يعرض المعلم صورًا لمعالم عمانية كقلعة نزوى والفلج وشجرة اللبان، وتتسابق المجموعات في تكوين جمل اسمية تبدأ باسم إشارة أو بضمير رفع منفصل تصف كل صورة، مثل: «هذه قلعة نزوى شامخة»، «نحن نحافظ على الأفلاج»، وتنال المجموعة الأسرع بجملة صحيحة نجمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الجملة الاسمية هي التي تبدأ بـ: (أ) حرف (ب) اسم (ج) فعل\nالإجابة: (ب) اسم\n\nس2 (مستوى التطبيق): أكمل: .... طالبتان مجتهدتان.\nالإجابة: هما\n\nس3 (مستوى الاستدلال): حوّل الجملة الفعلية إلى اسمية: «يلعب الأطفال في الحديقة».\nالإجابة: الأطفال يلعبون في الحديقة، أو: هؤلاء أطفال يلعبون في الحديقة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لمواقف مساعدة (التصدق، مشاركة الطعام) وأخرى لمواقف سلبية، ويفرزها التلميذ مع زميل إلى «يساعد» و«لا يساعد»؛ وللتحقق يسأله: اذكر طريقة لمساعدة الآخرين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برواية موقف ساعدوا فيه محتاجًا بثقة وطلاقة، ثم يتوقعون من العنوان وصورة نص «عمر يتفقد الرعية» ماذا فعل عمر، ويتحققون من توقعهم بعد القراءة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): «أولئك» اسم إشارة للجمع.\nالإجابة: صح\n\nس2 (مستوى التطبيق): الضمير المناسب: (... معلمات مخلصات): (أ) أنتَ (ب) هو (ج) هن\nالإجابة: (ج) هن\n\nس3 (مستوى الاستدلال): اكتب جملتين اسميتين تصف بهما مدرستك.\nالإجابة: مثل: هذه مدرسة جميلة. نحن طلاب نحب مدرستنا.", "- للطالب: اكتب أربع جمل اسمية تبدأ بأسماء إشارة مختلفة.\n- لولي الأمر: اطلب من ابنك أن يصف غرفته بجمل تبدأ بـ«هذا، هذه».\n- للطالب: اكتب جملة اسمية لكل ضمير من ضمائر الغائب.\n- لولي الأمر: العب مع ابنك لعبة الضمائر في وصف أفراد الأسرة.\n- للطالب: صِف غرفتك بخمس جمل اسمية.\n- لولي الأمر: راجع مع ابنك الفرق بين الجملة الاسمية والفعلية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=13"]}, {"k": "الإملاء", "p": ["الإملاء (1): الهمزة في آخر الكلمة", "الإملاء (2): تدريبات على الهمزة المتطرفة", "الإملاء (3): الإملاء الاختباري وتصويب الأخطاء"], "w": "الأسبوع الحادي عشر", "f": ["1. يتعرف الهمزة المتطرفة ويحدد الحرف الذي تكتب عليه (5 دقائق)\n2. يستنتج قاعدة كتابة الهمزة في آخر الكلمة بحسب حركة ما قبلها (10 دقائق)\n3. يكمل الكلمات بالهمزة المتطرفة في صورتها الصحيحة (15 دقيقة)\n4. يوظف كلمات تنتهي بهمزة في جمل من إنشائه (10 دقائق)\n5. يكتب فقرة تُملى عليه كتابة صحيحة مراعيًا الهمزة المتطرفة (20 دقيقة)\n6. يعيد كتابة الفقرة سليمة من الأخطاء بعد التصويب (10 دقائق)\n\nمخرج تعليمي آخر:\n- يقدّر جهود العلامة نور الدين السالمي في خدمة العلم (25 دقيقة)\n- يصحح أخطاء زملائه في كتابة الهمزة المتطرفة معللًا (15 دقيقة)\n- يلتزم النظام والوضوح في الكتابة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر (1): تقييم\nالمخرج الآخر (2): تقييم\nالمخرج الآخر (3): تطبيق", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي\n6. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات كلمات الهمزة المتطرفة\n4. السبورة التقليدية\n5. أخرى: بطاقات الحروف (أ، ؤ، ئ، ء)\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n7. الأقلام", "1. الهمزة المتطرفة: الهمزة التي تقع في آخر الكلمة\n2. حركة ما قبل الهمزة: الحركة التي يحدد بها الحرف الذي تكتب عليه الهمزة المتطرفة\n3. الهمزة على الألف: تكتب إذا كان ما قبلها مفتوحًا مثل: ملجأ\n4. الهمزة على الياء: تكتب إذا كان ما قبلها مكسورًا مثل: شاطئ\n5. الإملاء الاختباري: كتابة نص يمليه المعلم لقياس إتقان الطالب\n6. التصويب الذاتي: أن يكتشف الطالب أخطاءه ويصححها بنفسه", "يكتب المعلم: يبدأ، التكافؤ، شاطئ، شيء ويسأل: أين تقع الهمزة؟ ويلاحظ التلميذ أنها في آخر الكلمة. (5 دقائق)", "1. أقرأ وأكتشف: يقرأ المعلم فقرة الشيخ نور الدين السالمي ص 35 ويطلب وضع دائرة حول الكلمات التي آخرها همزة، ويحدد التلميذ الكلمات: العلماء، قرأ، الإسلامية... ويقرؤها (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أصنف في الجدول: يوجه المعلم إلى تصنيف الكلمات بحسب الحرف الذي كتبت عليه الهمزة (ألف، واو، ياء، سطر)، ويصنف التلميذ الكلمات في جدول الكتاب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستنتج القاعدة: يربط المعلم الحرف بحركة ما قبله: فتح ← ألف، ضم ← واو، كسر ← ياء، سكون أو حرف مد ← على السطر، ويصوغ التلميذ القاعدة بلغته ويمثل لكل حالة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أكمل بالهمزة: يوجه المعلم إلى نشاط ص 36: ابدأ كل عمل باسم الله، شاطئ السوادي، أسوأ شيء، المرء بأصغريه، ويكمل التلميذ الفراغات ويعلل كل صورة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أوظف في جمل: يطلب المعلم توظيف: هدوء، التكافؤ، ملجأ، سيئ في جمل، ويكتب التلميذ أربع جمل ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. التصحيح المتبادل: يطلب المعلم تبادل الكتب وتصحيح كتابة الهمزة، ويصحح التلميذ لزميله ويعلل بالقاعدة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. قراءة القطعة ومناقشتها: يقرأ المعلم القطعة قراءة كاملة متأنية ويناقش معناها، ويستمع التلميذ ويركز على الكلمات المهموزة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الإملاء: يملي المعلم القطعة جملة جملة بوضوح ويكرر كل جملة مرتين، ويكتب التلميذ في الكتاب ص 37 بخط واضح (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n9. التصويب وإعادة الكتابة: يعرض المعلم القطعة صحيحة ويوجه إلى التصويب الذاتي ثم إعادة الكتابة، ويصحح التلميذ أخطاءه ويعيد كتابة الفقرة سليمة (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n10. غلق الدرس – سلّة الهمزات: يقرأ المعلم كلمات تنتهي بهمزة (شاطئ، ملجأ، هدوء، شيء)، وترفع كل مجموعة بطاقة الحرف الذي تكتب عليه الهمزة (الألف، الواو، الياء، السطر) وتعلل بحركة ما قبلها، ثم تكتب جملة عن عمان فيها كلمة مهموزة مثل: «شاطئ السوادي جميل» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): تكتب الهمزة على ألف في «يبدأ» لأن ما قبلها: (أ) مضموم (ب) مفتوح (ج) مكسور\nالإجابة: (ب) مفتوح\n\nس2 (مستوى التطبيق): الصواب في كتابة: «المر... بأصغريه»: (أ) المرئ (ب) المرء (ج) المرأ\nالإجابة: (ب) المرء\n\nس3 (مستوى الاستدلال): صحح: «يقرئ الطالب الدرس».\nالإجابة: يقرأ الطالب الدرس؛ لأن ما قبل الهمزة مفتوح.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لمواقف مساعدة (التصدق، مشاركة الطعام) وأخرى لمواقف سلبية، ويفرزها التلميذ مع زميل إلى «يساعد» و«لا يساعد»؛ وللتحقق يسأله: اذكر طريقة لمساعدة الآخرين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برواية موقف ساعدوا فيه محتاجًا بثقة وطلاقة، ثم يتوقعون من العنوان وصورة نص «عمر يتفقد الرعية» ماذا فعل عمر، ويتحققون من توقعهم بعد القراءة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): كلمة «التكافؤ» كتبت همزتها على واو لأن ما قبلها مضموم.\nالإجابة: صح\n\nس2 (مستوى التطبيق): الكلمة المكتوبة خطأ: (أ) شيء (ب) شيئ (ج) سماء\nالإجابة: (ب) شيئ\n\nس3 (مستوى الاستدلال): اكتب كلمتين أخطأت فيهما في الإملاء وصوّبهما.\nالإجابة: يكتب الطالب كلمتيه مع تصويبهما وتعليل كل تصويب.", "- للطالب: اكتب ثلاث كلمات لكل حالة من حالات الهمزة المتطرفة.\n- لولي الأمر: ساعد ابنك على قراءة كلمات من الصحف تنتهي بهمزة.\n- للطالب: أكمل تدريبات الكتاب ص 36 واكتب جملتين جديدتين.\n- لولي الأمر: أملِ على ابنك خمس كلمات تنتهي بهمزة.\n- للطالب: أعد كتابة القطعة الإملائية مرة أخرى في دفترك.\n- لولي الأمر: تابع ابنك في تصحيح أخطائه الإملائية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=13"]}, {"k": "الخط", "p": ["الخط: كتابة «مطل الغني ظلم» بخط النسخ"], "w": "الأسبوع الحادي عشر", "f": ["1. يكتب الحديث الشريف «مطل الغني ظلم» بخط النسخ محاكيًا النموذج (15 دقيقة)\n2. يراعي أشكال الحروف ومواضعها على السطر (10 دقائق)\n\nمخرج تعليمي آخر:\n- يفسر معنى الحديث ويقدّر أداء الحقوق في وقتها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: أقلام الخط", "1. خط النسخ: خط عربي واضح تكتب به الكتب والمصاحف\n2. المطل: تأخير سداد الدين أو الحق مع القدرة عليه", "يكتب المعلم الحديث على السبورة ويشرح معناه بإيجاز، ويقرأ التلميذ الحديث ويذكر معناه. (5 دقائق)", "1. النموذج والملاحظة: يكتب المعلم العبارة على السبورة ببطء موضحًا حرف الطاء والظاء وموضع اللام والميم، ويلاحظ التلميذ أشكال الحروف ونقاط الإعجام (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. الكتابة المتدرجة: يتابع المعلم كتابة الأسطر الخمسة ص 38 من الأسفل إلى الأعلى ويصحح الإمساك بالقلم، ويكتب التلميذ العبارة خمس مرات محاكيًا النموذج (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التقييم الذاتي: يعرض المعلم معايير: وضوح الحروف، والمسافات، والاستقامة، ويقيّم التلميذ سطره الأفضل ويضع عليه نجمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – معرض الخطاط الصغير: يعلق الطلاب أجمل بطاقاتهم لعبارة «مطل الغني ظلم» على جدار الصف، ويتجول الزملاء ويضعون نجمة على البطاقة الأوضح حروفًا والأحسن مسافات، ثم يكتب كل طالب كلمة «عُمان» بخط النسخ على بطاقة صغيرة يزين بها المعرض اعتزازًا بوطنه (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التقييم الذاتي.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): معنى «مطل الغني ظلم»: (أ) الغني يظلم دائمًا (ب) تأخير الغني سداد الحق ظلم (ج) المطر ظلم\nالإجابة: (ب) تأخير الغني سداد الحق ظلم\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): نكتب الحديث بخط النسخ مراعين المسافات بين الكلمات.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): ما الحرفان المتشابهان في الشكل في كلمتي «مطل» و«ظلم»؟\nالإجابة: الطاء والظاء، ويفرق بينهما النقطة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لمواقف مساعدة (التصدق، مشاركة الطعام) وأخرى لمواقف سلبية، ويفرزها التلميذ مع زميل إلى «يساعد» و«لا يساعد»؛ وللتحقق يسأله: اذكر طريقة لمساعدة الآخرين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برواية موقف ساعدوا فيه محتاجًا بثقة وطلاقة، ثم يتوقعون من العنوان وصورة نص «عمر يتفقد الرعية» ماذا فعل عمر، ويتحققون من توقعهم بعد القراءة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: خط .... هو الخط الذي تكتب به الكتب والمصاحف غالبًا.\nالإجابة: النسخ\n\nس2 (مستوى التطبيق): ما يجب مراعاته عند كتابة خط النسخ: (أ) السرعة فقط (ب) الكتابة بلون أحمر (ج) وضوح الحروف واستقامة السطر\nالإجابة: (ج) وضوح الحروف واستقامة السطر\n\nس3 (مستوى الاستدلال): كيف تطبق معنى الحديث في حياتك؟\nالإجابة: أعيد ما استعرته في وقته، ولا أؤخر حقوق الآخرين.", "- للطالب: أكمل كتابة الأسطر الخمسة ص 38 بعناية.\n- لولي الأمر: شجع ابنك على تحسين خطه ومراجعة كتابته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=13"]}, {"k": "التعبير", "p": ["التعبير الكتابي (1): الحوار وعلامات الترقيم وأفعال القول", "التعبير الكتابي (2): كتابة حوار قصصي عن مساعدة زميل"], "w": "الأسبوع الثاني عشر", "f": ["1. يضع علامة الترقيم المناسبة (: - ! ؟ .) في نص حواري (10 دقائق)\n2. يختار فعل القول المناسب لإثراء الحوار (15 دقيقة)\n3. يكتب حوارًا قصصيًا عن موقف مساعدة زميل مستخدمًا علامات الترقيم (10 دقائق)\n4. يوظف أفعال القول والصفات الدالة على الحال في حواره (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يميز بين السرد والحوار في القصة (15 دقيقة)\n- يراجع كتابته وفق معايير محددة ويحسنها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر (1): تحليل\nالمخرج الآخر (2): تقييم", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. التعلم بالاكتشاف\n4. التعلم الذاتي\n5. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات علامات الترقيم\n4. السبورة التقليدية\n5. الأقلام\n6. أخرى: قائمة معايير الكتابة\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. الحوار: كلام متبادل بين شخصيتين أو أكثر في القصة\n2. أفعال القول: أفعال تمهد للكلام مثل: قال، سأل، أجاب، أضاف\n3. علامات الترقيم: رموز توضح المعنى وتنظم الكتابة\n4. الصفات الدالة على الحال: كلمات تصف حال القائل مثل: قال مبتسمًا، سأل حائرًا\n5. مسودة الكتابة: الكتابة الأولى قبل التصحيح والتبييض", "يعرض المعلم جملة بلا علامات: «قالت المعلمة من يجيب» ويسأل: كيف نوضح المعنى؟ ويقترح التلميذ وضع النقطتين وعلامة الاستفهام. (5 دقائق)", "1. وظائف علامات الترقيم: يوضح المعلم: النقطتان بعد فعل القول، والشرطة في بداية كلام المتحاور، وعلامة الاستفهام والتعجب والنقطة، ويربط كل علامة بوظيفتها بمثال (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أكمل الحوار: يوجه المعلم إلى نشاط ص 39: اختيار أفعال القول ووضع العلامات في حوار «الفاروق»، ويختار التلميذ الفعل المناسب ويضع العلامة في القوسين (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحقق جماعي: يقرأ المعلم الحوار صحيحًا ويناقش لماذا سُمي عمر بالفاروق، ويصحح التلميذ إجاباته ويقرأ الحوار بالأدوار (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. التخطيط للحوار: يرسم المعلم مخططًا: من الشخصيات؟ أين؟ ماذا حدث؟ كيف انتهى؟ ويملأ التلميذ المخطط في مسودته (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الكتابة: يذكّر المعلم بالتوجيهات ص 40: أفعال القول، والصفات الدالة على الحال، وعلامات الترقيم، ويكتب التلميذ حواره في ستة أسطر على الأقل (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. المراجعة والتحسين: يعرض المعلم قائمة معايير ويطلب المراجعة الثنائية، ويراجع التلميذ حوار زميله ويقترح تحسينًا واحدًا (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. غلق الدرس – حوار في السبلة: يمثّل كل زوج حوارًا قصيرًا في السبلة العمانية بين جد وحفيده عن مساعدة زميل محتاج، مستخدمين أفعال القول (قال، سأل، أجاب)، ويرفع الزملاء بطاقة العلامة المناسبة (: أو ؟ أو !) بعد كل جملة يسمعونها (5 دقائق)\nالاستراتيجيات: لعب الأدوار، التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): العلامة التي توضع بعد فعل القول «قال»: (أ) علامة التعجب (!) (ب) النقطتان (:) (ج) الفاصلة (،)\nالإجابة: (ب) النقطتان (:)\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): في الحوار القصصي ننتقل من السرد إلى الحوار بأفعال القول.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): اكتب الجملة الأولى في حوارك مع التلميذ مستخدمًا علامات الترقيم.\nالإجابة: مثل: سألته مبتسمًا: - ما بك يا صديقي؟ هل تأخرت الحافلة؟\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لمواقف مساعدة (التصدق، مشاركة الطعام) وأخرى لمواقف سلبية، ويفرزها التلميذ مع زميل إلى «يساعد» و«لا يساعد»؛ وللتحقق يسأله: اذكر طريقة لمساعدة الآخرين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برواية موقف ساعدوا فيه محتاجًا بثقة وطلاقة، ثم يتوقعون من العنوان وصورة نص «عمر يتفقد الرعية» ماذا فعل عمر، ويتحققون من توقعهم بعد القراءة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): نضع علامة الاستفهام بعد الجملة التي تسأل عن شيء.\nالإجابة: صح\n\nس2 (مستوى التطبيق): الخاتمة المناسبة للحوار: (أ) أوصلناه إلى بيته فشكرنا (ب) كان الجو حارًا (ج) الحافلة صفراء\nالإجابة: (أ) أوصلناه إلى بيته فشكرنا\n\nس3 (مستوى الاستدلال): ما الذي حسنته في حوارك بعد المراجعة؟\nالإجابة: يذكر الطالب تحسينًا مثل: إضافة علامة ترقيم أو تغيير فعل القول.", "- للطالب: اكتب حوارًا من أربعة أسطر بينك وبين أخيك مستخدمًا علامات الترقيم.\n- لولي الأمر: راجع مع ابنك علامات الترقيم في قصة يقرؤها.\n- للطالب: بيّض الحوار الذي كتبته في دفترك بخط واضح.\n- لولي الأمر: استمع إلى حوار ابنك وشجعه على التعبير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=13"]}]}, {"t": "الدرس القرائي الثاني: مخ الوعل", "u": "المحور الثاني: قصص وعبر", "s": [{"k": "التحدث", "p": ["أشاهد وأتحدث: العقل أقوى من العضلات"], "w": "الأسبوع الثالث عشر", "f": ["1. يصف ما يراه في الرسم بجمل فصيحة مترابطة (15 دقيقة)\n2. يحدد الفكرة التي يعبر عنها الرسم (10 دقائق)\n\nمخرج تعليمي آخر:\n- يروي موقفًا تغلب فيه العقل على القوة الجسدية (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "1. الحوار والمناقشة\n2. فكّر، زاوج، شارك\n3. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية", "1. الحيلة: التدبير الذكي للوصول إلى هدف\n2. القوة الجسدية: قدرة العضلات والجسم", "يطرح المعلم لغزًا قصيرًا: كيف ينقل النمل طعامًا أكبر منه؟ ويقترح التلميذ إجابات تعتمد على التعاون والتفكير. (5 دقائق)", "1. أصف الرسم: يعرض المعلم رسم ص 41 ويوجه الوصف من الشخصيات إلى التفاصيل، ويصف التلميذ الرسم بأربع جمل على الأقل (8 دقائق)\nالاستراتيجيات: فكّر.\n\n2. الفكرة التي يعبر عنها الرسم: يناقش المعلم: أيهما أنفع في الموقف: العقل أم العضلات؟ ولماذا؟ ويحدد التلميذ الفكرة ويعلل رأيه (6 دقائق)\nالاستراتيجيات: زاوج.\n\n3. أروي موقفًا: يتيح المعلم لكل مجموعة اختيار موقف وروايته أمام الصف، ويروي التلميذ موقفًا انتصر فيه التفكير على القوة (6 دقائق)\nالاستراتيجيات: شارك.\n\n4. غلق الدرس – العقل أولًا: ينقسم الصف فريقين، ويعرض المعلم موقفًا مشكلًا كصندوق ثقيل أو باب مغلق، ويتسابق الفريقان في اقتراح حل ذكي شفهيًا، ثم يذكر كل فريق عملًا عمانيًا قام على الحكمة والتفكير كبناء الأفلاج لنقل الماء إلى القرى (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الفكرة الأقرب لرسم «أشاهد وأتحدث»: (أ) الطعام مفيد (ب) العقل يتغلب على القوة (ج) الرياضة ممتعة\nالإجابة: (ب) العقل يتغلب على القوة\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): يحتاج الإنسان إلى التفكير لحل المشكلات وليس إلى القوة فقط.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): اذكر مثالًا من حياتك استعملت فيه عقلك بدل قوتك.\nالإجابة: مثل: رفعت الصندوق الثقيل بعربة صغيرة بدل حمله.\n\n• نشاط علاجي (لمن لم يتقن): يقدم المعلم موقفًا عمليًا: صندوق ثقيل يحاول التلميذ رفعه ثم ينقله بعربة صغيرة، ويستنتج معه أن العقل يتغلب على القوة؛ وللتحقق يسأله: ما الفكرة التي يعبر عنها رسم «أشاهد وأتحدث»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة حوار قصير متوقع بين الثعلب والأسد في خرافة «مخ الوعل» لإيسوب، ثم يستخلصون العبرة ويذكرون موقفًا يغلب فيه الذكاء القوة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: التدبير الذكي للوصول إلى الهدف يسمى .....\nالإجابة: الحيلة\n\nس2 (مستوى التطبيق): عند وصف الصورة نبدأ بـ: (أ) الألوان فقط (ب) الصورة العامة ثم التفاصيل (ج) التفاصيل الصغيرة فقط\nالإجابة: (ب) الصورة العامة ثم التفاصيل\n\nس3 (مستوى الاستدلال): هل الحيلة دائمًا شيء حسن؟ علل.\nالإجابة: لا؛ فقد تستعمل للخداع والإضرار، والحسن منها ما ينفع ولا يؤذي.", "- للطالب: حدّث أسرتك عن موقف تغلب فيه عقلك على مشكلة.\n- لولي الأمر: ناقش ابنك في الفرق بين الذكاء النافع والخداع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=14"]}, {"k": "القراءة", "p": ["أتصفح: الحيوانات في الصورتين والتعريف بكاتب الحكاية", "القراءة النموذجية والجهرية: المحاولة الأولى للثعلب", "القراءة الجهرية: المحاولة الثانية ونهاية الحكاية", "المفردات والتراكيب: معاني الكلمات ومرادفاتها", "المستوى الأول: أحداث الحكاية وحيلة الثعلب", "المستوى الثاني: أفعال الشخصيات وصفاتها", "المستوى الثالث: تقسيم النص وتحديد نوعه وربطه بالحديث", "المستوى الرابع: التقييم وإبداء الرأي في التصرف والنهاية"], "w": "الأسبوع الثالث عشر – الأسبوع الرابع عشر", "f": ["1. يعدد الحيوانات الواردة في صورتي النص ويتوقع الحوار بين الثعلب والأسد (10 دقائق)\n2. يتعرف الكاتب إيسوب ومعنى «خرافات» (10 دقائق)\n3. يقرأ الجزء الأول من الحكاية قراءة جهرية سليمة (20 دقيقة)\n4. يعبر بصوته عن مكر الثعلب وانتشاء الوعل (10 دقائق)\n5. يقرأ الحكاية كاملة قراءة مسترسلة معبرة (20 دقيقة)\n6. يمثل دور الثعلب وهو يقنع الوعل بالعودة (10 دقائق)\n7. يختار المعنى الصحيح لكلمات: تستدرج، انتشى، الهرم (15 دقيقة)\n8. يكتب مرادف الكلمات التي تحتها خط في جمل النص (15 دقيقة)\n9. يجيب عن أسئلة المستوى الأول بالرجوع إلى النص (10 دقائق)\n10. يقرأ من النص ما يدعم إجابته (15 دقيقة)\n11. يستخرج الأفعال التي قامت بها كل شخصية في جدول (20 دقيقة)\n12. يصف شخصيات الحكاية كما وردت في النص (5 دقائق)\n13. يقسم النص إلى أقسامه الأربعة وفق العناوين المعطاة (15 دقيقة)\n14. يحدد نوع النص (حكاية) ويقترح عنوانًا آخر (10 دقائق)\n15. يبدي رأيه في نهاية الحكاية معللًا (10 دقائق)\n16. يتخيل تصرفه لو كان مكان الوعل (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يتوقع الضحية في النص معللًا (20 دقيقة)\n- يحذر من الانخداع بالمديح الكاذب (10 دقائق)\n- يستخلص العبرة من نهاية الحكاية (10 دقائق)\n- يوظف كلمتين جديدتين في حديثه وكتابته (10 دقائق)\n- يستخرج الحكمة التي تضمنتها الحكاية (15 دقيقة)\n- يوضح العلاقة بين أحداث النص وعنوانه (15 دقيقة)\n- يشرح انطباق الحديث «لا يلدغ المؤمن من جحر مرتين» على الحكاية (15 دقيقة)\n- يقارن بين فقرة عن عمر بن الخطاب وما تعلمه من دروس المحور (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج 7: فهم\nالمخرج 8: تطبيق\nالمخرج 9: تذكر\nالمخرج 10: فهم\nالمخرج 11: تحليل\nالمخرج 12: تحليل\nالمخرج 13: تحليل\nالمخرج 14: إبداع\nالمخرج 15: تقييم\nالمخرج 16: إبداع\nالمخرج الآخر (1): تحليل\nالمخرج الآخر (2): تقييم\nالمخرج الآخر (3): تحليل\nالمخرج الآخر (4): تطبيق\nالمخرج الآخر (5): تحليل\nالمخرج الآخر (6): تحليل\nالمخرج الآخر (7): تحليل\nالمخرج الآخر (8): تحليل", "1. التنبؤ\n2. السؤال والجواب\n3. التعلم التعاوني\n4. التعلم بالنمذجة\n5. تعدد القراءات\n6. تمثيل الأدوار\n7. التعلم المبني على اللعب\n8. تبادل البطاقات\n9. الرؤوس المرقمة\n10. فكّر، زاوج، شارك\n11. التعلم بالاكتشاف\n12. الحوار والمناقشة\n13. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الوسائل المتعددة (سمعية - بصرية)\n5. السبورة التقليدية\n6. أخرى: أقنعة الشخصيات\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n8. أخرى: بطاقات المرادفات\n9. الأقلام\n10. أخرى: جدول الشخصيات\n11. أخرى: شريط أحداث الحكاية", "1. الخرافة: حكاية خيالية على ألسنة الحيوانات تحمل عبرة\n2. إيسوب: كاتب يوناني قديم اشتهر بكتابة الحكايات على ألسنة الحيوانات\n3. العرين: بيت الأسد\n4. يستدرج: يجرّ غيره إلى مكان بالحيلة\n5. حتفي: موتي وهلاكي\n6. لا طائل: لا فائدة\n7. انتشى: اشتد فرحه\n8. الهرم: العجوز المريض الضعيف\n9. المرادف: كلمة تحمل المعنى نفسه\n10. الدليل من النص: العبارة التي تثبت صحة الإجابة\n11. الحكمة: قول موجز يحمل معنى صحيحًا نافعًا\n12. الشخصية الماكرة: الشخصية التي تخدع غيرها لتحقيق مصلحتها\n13. صفة الشخصية: ما تتميز به الشخصية من خُلق أو طبع\n14. الحكاية: نص قصصي قصير خيالي غالبًا ينتهي بعبرة\n15. العبرة: الدرس المستفاد من القصة\n16. النهاية المتوقعة: نهاية تناسب سير الأحداث السابقة\n17. الرأي: حكم الشخص على أمر مع تعليله", "يعرض المعلم صور أسد وثعلب ووعل ويسأل: ما الصفة التي تشتهر بها هذه الحيوانات؟ ويذكر التلميذ: الأسد قوي، والثعلب ماكر، والوعل ضخم. (5 دقائق)", "1. أتصفح الصور: يوجه المعلم إلى صورتي ص 43 وص 45 ويطلب عدّ الحيوانات وتوقع الحوار، ويعدد التلميذ الحيوانات ويكتب جملة متوقعة على لسان الثعلب (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n2. أتوقع الضحية: يسأل المعلم: هل تتوقع وجود ضحية في النص؟ ومن هي؟ ويدون التوقعات، ويكتب التلميذ توقعه ويعلله من الصورة والعنوان (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الكاتب والمصدر: يعرّف المعلم بإيسوب وكتاب «خرافات إيسوب» ويناقش معنى كلمة «خرافات»، ويكتب التلميذ اسم الكاتب ويشرح معنى الخرافة (11 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة النموذجية: يقرأ المعلم من «رقد أسد في عرينه» إلى فرار الوعل مجروح الأذنين، ويتابع التلميذ ويحدد الكلمات الجديدة (11 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n5. القراءة الجهرية: يوزع المعلم الفقرات ويقوّم الضبط والنطق ويحث على تمثيل المعنى، ويقرأ التلميذ فقرته بطلاقة ونبرة مناسبة (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قراءة الحوار: يوزع المعلم أدوار الأسد والثعلب والوعل، ويقرأ التلميذ دوره بنبرة تعبر عن الشخصية (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. القراءة النموذجية للجزء الثاني: يقرأ المعلم من «شرع الثعلب إلى الغابة ثانية» إلى النهاية، ويتابع التلميذ ويتحقق من توقعه (9 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n8. القراءة الجهرية المسترسلة: يطلب المعلم قراءة الحكاية كاملة بالتتابع ويعزز الطلاقة، ويقرأ التلميذ جهريًا مراعيًا الوقف والوصل (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n9. تمثيل المحاولة الثانية: يوزع المعلم الأدوار بالأقنعة ويوجه الأداء، ويمثل التلميذ الحوار ويبرز مكر الثعلب وخوف الوعل (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. أختار المعنى: يناقش المعلم سؤال ص 47: تستدرج، انتشى، الهرم من خلال السياق، ويختار التلميذ المعنى ويقرأ الجملة بالمعنى الجديد (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. أكتب المرادف: يوجه المعلم إلى سؤال ص 48: الجسيم، حتفي، عرين، الماكر، ويكتب التلميذ مرادف كل كلمة في الكتاب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. لعبة المرادفات: يوزع المعلم بطاقات كلمات ومرادفات ويطلب المطابقة السريعة، ويطابق التلميذ البطاقة مع زميله ويقرأ الزوج (11 دقيقة)\nالاستراتيجيات: تبادل البطاقات.\n\n13. ماذا أراد الأسد؟: يطرح المعلم السؤال الأول ويطلب قراءة الدليل، ويجيب التلميذ ويقرأ الجملة الداعمة من النص (11 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n14. حيلة الثعلب: يوزع المعلم أسئلة 2–4 على المجموعات بالرؤوس المرقمة، وتجيب المجموعة وتمثل دور الثعلب في السؤال الرابع (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n15. الحكمة: يوجه المعلم إلى استخراج الحكمة من آخر النص، ويستخرج التلميذ الحكمة ويكتبها (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n16. جدول الأفعال: يوجه المعلم إلى قراءة صامتة واستخراج الأفعال: الأسد (رقد، وثب)، الثعلب (مضى، اختطف)، الوعل (انتشى، فر)، ويملأ التلميذ الجدول ص 48 مع زميله (16 دقيقة)\nالاستراتيجيات: فكّر.\n\n17. جدول الصفات: يسأل المعلم: بماذا تصف كل شخصية؟ وما الدليل؟ ويكتب التلميذ الصفة ودليلها ص 49 (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n18. العنوان والأحداث: يناقش المعلم علاقة عنوان «مخ الوعل» بأحداث الحكاية ونهايتها، ويوضح التلميذ أن المخ هو ما أخذه الثعلب وما افتقده الوعل (11 دقيقة)\nالاستراتيجيات: شارك.\n\n19. تقسيم النص: يعرض المعلم العناوين: مرض الأسد، المحاولة الفاشلة، نجاح الخطة، العبرة، ويطلب تحديد بداية كل قسم ونهايته، ويحدد التلميذ حدود كل قسم في النص ص 50 (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n20. نوع النص والعنوان: يناقش المعلم: هل النص قصيدة أم مسرحية أم حكاية؟ ويطلب عنوانًا بديلًا، ويختار التلميذ «حكاية» ويقترح عنوانًا آخر (11 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n21. الحديث والحكاية: يوجه المعلم إلى شرح انطباق الحديث على موقف الوعل، ويكتب التلميذ شرحًا قصيرًا يربط الحديث بالحكاية (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n22. لو كنت مكان الوعل: يدير المعلم لعب أدوار: الثعلب يحاول الإقناع والوعل يرفض بذكاء، ويؤدي التلميذ دور الوعل ويقنع الصف بتصرفه (16 دقيقة)\nالاستراتيجيات: فكّر.\n\n23. النهاية المتوقعة: يناقش المعلم: هل النهاية متوقعة لسير الأحداث؟ ويطلب التعليل، ويكتب التلميذ رأيه في النهاية ويعلله (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n24. أقرأ الفقرة وأجيب: يوجه المعلم إلى فقرة عمر بن الخطاب ص 51 والإجابة عما يليها، ويقرأ التلميذ الفقرة ويجيب عن الأسئلة (11 دقيقة)\nالاستراتيجيات: شارك.\n\n25. غلق الدرس – مسرح الحكاية: تختار كل مجموعة مشهدًا من حكاية «مخ الوعل» وتؤديه بالأقنعة في دقيقة، ويحزر الزملاء الصفة التي يظهرها المشهد (المكر، الغرور، الطمع)، ثم تذكر المجموعة حكمة الحكاية وتربطها بقيمة الحذر والتعقل التي يوصينا بها آباؤنا في عمان (5 دقائق)\nالاستراتيجيات: تمثيل الأدوار، التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كاتب النص هو: (أ) عبد الحميد السحار (ب) مصطفى عزوز (ج) إيسوب\nالإجابة: (ج) إيسوب\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): فشلت الخطة في البداية بسبب تسرع الأسد.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): هل أعجبتك نهاية الحكاية؟ علل.\nالإجابة: يقبل الرأي المعلل، مثل: نعم لأنها تعلمنا ألا ننخدع، أو لا لأن الثعلب الماكر لم يعاقب.\n\n• نشاط علاجي (لمن لم يتقن): يقدم المعلم موقفًا عمليًا: صندوق ثقيل يحاول التلميذ رفعه ثم ينقله بعربة صغيرة، ويستنتج معه أن العقل يتغلب على القوة؛ وللتحقق يسأله: ما الفكرة التي يعبر عنها رسم «أشاهد وأتحدث»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة حوار قصير متوقع بين الثعلب والأسد في خرافة «مخ الوعل» لإيسوب، ثم يستخلصون العبرة ويذكرون موقفًا يغلب فيه الذكاء القوة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): الخرافة حكاية واقعية حدثت فعلًا.\nالإجابة: خطأ، والصواب: حكاية خيالية تحمل عبرة\n\nس2 (مستوى التطبيق): كيف أقنع الثعلب الوعل بالعودة؟ (أ) هدده بالقتل (ب) دفع له مالًا (ج) اتهمه بالجبن وزعم أن الأسد أراد أن يسرّ إليه بأسرار\nالإجابة: (ج) اتهمه بالجبن وزعم أن الأسد أراد أن يسرّ إليه بأسرار\n\nس3 (مستوى الاستدلال): اقترح نهاية أخرى للحكاية يعاقَب فيها الثعلب.\nالإجابة: مثل: اكتشف الأسد أن الثعلب أخذ المخ فطرده من العرين.", "- للطالب: اقرأ الحكاية ص 43–45 قراءة صامتة.\n- لولي الأمر: اسأل ابنك عن معنى «خرافة» وعن حكاية يعرفها على لسان حيوان.\n- للطالب: درّب نفسك على قراءة الجزء الأول ص 43–44.\n- لولي الأمر: استمع لقراءة ابنك وشجعه على تنويع النبرة.\n- للطالب: اقرأ الحكاية كاملة لأسرتك واسألهم عن العبرة.\n- لولي الأمر: ناقش ابنك في أهمية التعلم من الأخطاء.\n- للطالب: اكتب خمس كلمات من الحكاية مع مرادفاتها.\n- لولي الأمر: اطلب من ابنك استخدام كلمة جديدة في حديثه اليوم.\n- للطالب: أجب عن أسئلة ص 46 واقرأ الأدلة لأسرتك.\n- لولي الأمر: تابع إجابات ابنك وتأكد من تعليلها من النص.\n- للطالب: أكمل جدول الأفعال والصفات في كتابك ص 48–49.\n- لولي الأمر: اسأل ابنك عن صفات كل شخصية في الحكاية.\n- للطالب: اكتب عنوانًا آخر للحكاية مع تعليل اختيارك.\n- لولي الأمر: ناقش ابنك في معنى الحديث «لا يلدغ المؤمن من جحر مرتين».\n- للطالب: اكتب نهاية أخرى للحكاية يعاقَب فيها الماكر.\n- لولي الأمر: استمع إلى رأي ابنك في النهاية وناقشه بلطف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=14"]}, {"k": "الأنماط اللغوية", "p": ["الأنماط اللغوية (1): ألف الاثنين وواو الجماعة", "الأنماط اللغوية (2): ياء المخاطبة وتصنيف ضمائر الرفع المتصلة", "علامات الترقيم (1): النقطة والفاصلة والنقطتان الرأسيتان", "علامات الترقيم (2): وضع العلامة المناسبة في نصوص"], "w": "الأسبوع الرابع عشر", "f": ["1. يتعرف ضميري الرفع المتصلين: ألف الاثنين وواو الجماعة (10 دقائق)\n2. يحول الفعل من المفرد إلى المثنى والجمع مع إسناده إلى الضمير المناسب (15 دقيقة)\n3. يتعرف ياء المخاطبة ضميرًا متصلًا بالفعل (5 دقائق)\n4. يحدد الأفعال المتصلة بضمائر الرفع ويبين نوع الضمير (20 دقيقة)\n5. يتعرف مواضع النقطة والفاصلة والنقطتين الرأسيتين (5 دقائق)\n6. يقرأ العبارات مطبقًا الوقف المناسب لكل علامة (10 دقائق)\n7. يضع علامة الترقيم المناسبة في الفراغ (10 دقائق)\n8. يعلل اختياره لعلامة الترقيم (5 دقائق)\n\nمخرج تعليمي آخر:\n- يكمل الجمل بضمير الرفع المنفصل المناسب (15 دقيقة)\n- يوظف الأفعال متصلة بضمائر الرفع في جمل من إنشائه (15 دقيقة)\n- يستخرج من الفقرة عبارات أخرى تنتهي بالعلامات نفسها (25 دقيقة)\n- يقدّر شجاعة الغلام الصادق في قصة عمر والصبية (25 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تحليل\nالمخرج 5: فهم\nالمخرج 6: تطبيق\nالمخرج 7: تطبيق\nالمخرج 8: تحليل\nالمخرج الآخر (1): تطبيق\nالمخرج الآخر (2): إبداع\nالمخرج الآخر (3): تحليل\nالمخرج الآخر (4): تقييم", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الأفعال\n4. السبورة التقليدية\n5. أخرى: مكعب الضمائر المتصلة\n6. أخرى: بطاقات علامات الترقيم\n7. أخرى: بطاقات (. ، :)\n8. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. ألف الاثنين: ضمير متصل يدل على اثنين مثل: وجدا، يكتبان\n2. واو الجماعة: ضمير متصل يدل على جماعة الذكور مثل: كتبوا، يكتبون\n3. ياء المخاطبة: ضمير متصل يدل على المخاطبة المفردة مثل: تكتبين، اكتبي\n4. ضمائر الرفع المتصلة: ضمائر تتصل بالفعل وتدل على الفاعل\n5. النقطة: توضع في نهاية الجملة التامة المعنى ونقف عندها وقفة طويلة\n6. الفاصلة: توضع بين الجمل القصيرة المترابطة ونقف عندها وقفة قصيرة\n7. النقطتان الرأسيتان: توضعان بعد القول وقبل الكلام المنقول\n8. علامة الترقيم المناسبة: العلامة التي يوضحها معنى الجملة وموقعها\n9. الكلام المنقول: كلام قائل يُنقل بعد فعل القول", "يقول المعلم: «وجد» عمر، ثم «وجدا» عمر وغلامه. ويسأل: ما الذي تغير؟ ويلاحظ التلميذ زيادة الألف للدلالة على اثنين. (5 دقائق)", "1. ألاحظ الكلمات الملونة: يعرض المعلم فقرة ص 51 ويضع الكلمات الملونة في الجدول كما في المثال (وجدا = وجد + ا)، ويحلل كل فعل إلى الفعل والضمير المتصل (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أكمل بالضمير المنفصل: يوجه المعلم إلى نشاط ص 52: أنتم تساعدون، أنتِ تطعمين، ويكمل التلميذ الجمل بالضمير المناسب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أحول الأفعال: يوجه المعلم إلى نشاط ص 53 (قصة الهجرة) وتحويل الأفعال بين القوسين، ويحول التلميذ الفعل مسندًا إلى ألف الاثنين أو واو الجماعة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أحدد الضمير ونوعه: يوجه المعلم إلى نشاط ص 54: «المجتهدون ينالون الجائزة»، الآيات الكريمة، «الناس أعداء ما جهلوا»، ويحدد التلميذ الفعل والضمير المتصل به ونوعه (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. لعبة مكعب الضمائر: يرمي المعلم المكعب (ا، و، ي) ويقول فعلًا ليسنده الطلاب، ويسند التلميذ الفعل إلى الضمير الظاهر شفهيًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أوظف في جمل: يوجه المعلم إلى نشاط توظيف الأفعال ص 54 مع تغيير ما يلزم، ويكتب التلميذ جملًا متصلة بالضمائر الثلاثة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. ألاحظ العلامات الملونة: يعرض المعلم فقرة ص 55 من الحكاية ويلوّن العلامات ويناقش موضع كل منها، ويحدد التلميذ موضع كل علامة في الفقرة (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أقرأ وفق التوجيهات: يوجه المعلم إلى جدول ص 56: أقف وقفة قصيرة، أقف مع نبرة دالة على القول، أقف وقفة طويلة، ويقرأ التلميذ العبارات مطبقًا كل توجيه (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أستخرج عبارات أخرى: يطلب المعلم استخراج عبارات أخرى تنتهي بالعلامات وقراءتها، ويستخرج التلميذ عبارتين ويقرؤهما بالأداء الصحيح (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n10. أضع العلامة المناسبة: يوجه المعلم إلى تدريب ص 56: الآية، والتعاون، والحديث الشريف، والرياضة، ويضع التلميذ العلامة ويعلل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n11. قصة عمر والصبية: يقرأ المعلم قصة ص 57 ويطلب وضع العلامات في الفراغات، ويكمل التلميذ العلامات ويقرأ القصة بأداء صحيح (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n12. تصحيح وتعليل: يعرض المعلم الحل ويناقش الأخطاء الشائعة، ويصحح التلميذ ويذكر سبب كل علامة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. غلق الدرس – مكعب الضمائر الوطني: يرمي ممثل كل مجموعة مكعب الضمائر (ا، و، ي)، ويسند فعلًا (يزور، يحافظ، يرفع) إلى الضمير الظاهر في جملة عن عمان، مثل: «الطالبان يزوران قلعة بهلاء»، «المواطنون يحافظون على نظافة الشواطئ»، ثم تقرأ المجموعة جملتها بعلامة الترقيم المناسبة، وتُحتسب نقطة لكل جملة صحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الضمير المتصل في «وجدا»: (أ) ياء المخاطبة (ب) ألف الاثنين (ج) واو الجماعة\nالإجابة: (ب) ألف الاثنين\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): عند الفاصلة نقف وقفة طويلة.\nالإجابة: خطأ، والصواب: نقف وقفة قصيرة\n\nس3 (مستوى الاستدلال): لماذا لم يفر الغلام كما فر أقرانه؟\nالإجابة: لأنه لم يرتكب ذنبًا فيخاف، والطريق ليست ضيقة فيوسعها.\n\n• نشاط علاجي (لمن لم يتقن): يقدم المعلم موقفًا عمليًا: صندوق ثقيل يحاول التلميذ رفعه ثم ينقله بعربة صغيرة، ويستنتج معه أن العقل يتغلب على القوة؛ وللتحقق يسأله: ما الفكرة التي يعبر عنها رسم «أشاهد وأتحدث»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة حوار قصير متوقع بين الثعلب والأسد في خرافة «مخ الوعل» لإيسوب، ثم يستخلصون العبرة ويذكرون موقفًا يغلب فيه الذكاء القوة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): في كلمة «يكتبون» ضمير يدل على جماعة الذكور.\nالإجابة: صح\n\nس2 (مستوى التطبيق): العلامة التي توضع بين الجمل القصيرة المترابطة: (أ) الفاصلة (ب) النقطتان (ج) علامة الاستفهام\nالإجابة: (أ) الفاصلة\n\nس3 (مستوى الاستدلال): ضع العلامات: قال الغلام يا أمير المؤمنين لم أرتكب ذنبا\nالإجابة: قال الغلام: يا أمير المؤمنين، لم أرتكب ذنبًا.", "- للطالب: حوّل خمسة أفعال إلى المثنى والجمع في دفترك.\n- لولي الأمر: العب مع ابنك: قل فعلًا ويحوله إلى المثنى والجمع.\n- للطالب: اكتب ثلاث جمل لكل ضمير من ضمائر الرفع المتصلة.\n- لولي الأمر: حاور ابنك مستخدمًا أفعالًا متصلة بياء المخاطبة وواو الجماعة.\n- للطالب: اقرأ فقرة من الحكاية لأسرتك مطبقًا الوقفات.\n- لولي الأمر: لاحظ وقفات ابنك عند علامات الترقيم في قراءته.\n- للطالب: أكمل تدريبات علامات الترقيم ص 56–57.\n- لولي الأمر: راجع مع ابنك علامات الترقيم في رسالة قصيرة يكتبها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=14"]}, {"k": "الإملاء", "p": ["الإملاء الاختباري: الترقيم وضمائر الرفع"], "w": "الأسبوع الرابع عشر", "f": ["1. يكتب فقرة تُملى عليه مراعيًا علامات الترقيم (10 دقائق)\n2. يكتب الأفعال المتصلة بواو الجماعة مع الألف الفارقة كتابة صحيحة (15 دقيقة)\n\nم لصون العبرة ويذكرون موقفًا يغلب فيه الذكاء القوة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: نضع .... في نهاية الجملة التامة.\nالإجابة: النقطة\n\nس2 (مستوى التطبيق): الجملة الصحيحة إملائيًا: (أ) اجتهدو في دروسكم (ب) اجتهدوا في دروسكم (ج) اجتهدون في دروسكم\nالإجابة: (ب) اجتهدوا في دروسكم\n\nس3 (مستوى الاستدلال): اكتب كلمتين أخطأت فيهما وصوابهما.\nالإجابة: يكتب الطالب أخطاءه مع تصويبها.", "- للطالب: أعد كتابة القطعة الإملائية سليمة في دفترك.\n- لولي الأمر: أملِ على ابنك جملتين فيهما واو الجماعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=14"]}, {"k": "الخط", "p": ["الخط: كتابة «الغنى غنى النفس» بخط النسخ"], "w": "الأسبوع الرابع عشر", "f": ["1. يكتب عبارة «الغنى غنى النفس» بخط النسخ محاكيًا النموذج (20 دقيقة)\n2. يراعي شكل الألف المقصورة والسين والفاء في خط النسخ (5 دقائق)\n\nمخرج تعليمي آخر:\n- يوضح معنى غنى النفس ويقدّر القناعة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: أقلام الخط", "1. غنى النفس: القناعة والرضا بما قسمه الله\n2. الألف المقصورة: ألف تكتب على صورة الياء دون نقط في آخر الكلمة مثل: الغنى", "يسأل المعلم: من الغني حقًا؟ صاحب المال الكثير أم القانع؟ ويعبر التلميذ عن رأيه في جملة. (5 دقائق)", "1. النموذج: يكتب المعلم العبارة على السبورة ويبين الألف المقصورة في «الغنى» و«غنى» وسنّات السين، ويلاحظ التلميذ ويتتبع الحروف بإصبعه في الهواء (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. الكتابة المتدرجة: يتابع المعلم الكتابة في الأسطر ص 59 ويصحح الجلسة والإمساك بالقلم، ويكتب التلميذ العبارة على الأسطر محاكيًا النموذج (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. المعرض الصغير: يعرض المعلم أجمل الأسطر ويبين سبب تميزها، ويقيّم التلميذ سطره ويحسن ما يحتاج (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – الكلمة الذهبية: تتناوب المجموعة على كتابة عبارة «الغنى غنى النفس» بخط النسخ على بطاقة كبيرة، يكتب كل طالب كلمة منها، ثم تكتب المجموعة تحتها اسم ولاية عمانية بخط جميل وتعل ويحفظها بالتكرار، ويحفظ التلميذ ويسمّع لزميله (10 دقائق)\nالاستراتيجيات: زاوج.\n\n7. التسميع: يسمّع المعلم للطلاب فرديًا ويسجل في جدول التسميع، ويسمّع التلميذ الآيات غيبًا (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. المقصود بالآية: يناقش المعلم المقصود بقوله تعالى: ﴿كذلك العذاب ولعذاب الآخرة أكبر﴾، ويشرح التلميذ المعنى بأسلوبه (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n9. العبرة: يدير المعلم حوارًا: ما العبرة من القصة؟، ويذكر التلميذ عبرتين ويكتبهما (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – بستان العطاء: يناقش كل زوج عاقبة أصحاب الجنة الذين أرادوا منع المساكين من حقهم، ثم يربطان ذلك بعادة عمانية في التكافل كإخراج الزكاة ومشاركة الجيران في ثمار النخيل، ويعرضان فكرتهما بجملة (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): معنى «الجنة» في الآيات: (أ) الجنة في الآخرة (ب) البيت الكبير (ج) الحديقة ذات النخل والشجر\nالإجابة: (ج) الحديقة ذات النخل والشجر\n\nس2 (مستوى التطبيق): أكمل: ﴿قال أوسطهم ألم أقل لكم لولا ....﴾\nالإجابة: تسبحون\n\nس3 (مستوى الاستدلال): ما العبرة من قصة أصحاب الجنة؟\nالإجابة: أن منع حق المساكين سبب لزوال النعمة، وأن الندم والتوبة طريق الرجوع إلى الله.\n\n• نشاط علاجي (لمن لم يتقن): يتلو المعلم الآيات (17 – 21) من سورة القلم آية آية ويرددها التلميذ بعده، ويوضح له «الجنة: الحديقة ذات النخل والشجر» بصورة حديقة؛ وللتحقق يسأله: ما معنى «الجنة» في الآيات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب مشاهد قصة أصحاب الجنة في الآيات (17 – 33) من سورة القلم: القسم، ثم الطائف، ثم ذهابهم صباحًا، ثم الندم، واستخلاص عاقبة منع المساكين حقهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): معنى «طائف» في الآيات: عذاب وبلاء نزل على الحديقة.\nالإجابة: صح\n\nس2 (مستوى التطبيق): معنى ﴿وغدوا على حرد قادرين﴾: (أ) ذهبوا منفردين عن المساكين واثقين بقدرتهم (ب) ناموا في بيوتهم (ج) ذهبوا مع المساكين\nالإجابة: (أ) ذهبوا منفردين عن المساكين واثقين بقدرتهم\n\nس3 (مستوى الاستدلال): كيف تشكر الله على نعمه اقتداءً بالعبرة من القصة؟\nالإجابة: أتصدق على المحتاجين وأشكر الله بلساني وعملي.", "- للطالب: ردد الآيات (17 – 21) حتى تحفظها.\n- لولي الأمر: استمع إلى تلاوة ابنك للآيات وصحح له بلطف.\n- للطالب: احفظ الآيات (22 – 28) وردد ما سبق.\n- لولي الأمر: سمّع لابنك الآيات واسأله عن معنى «يتخافتون».\n- للطالب: راجع حفظ الآيات (17 – 33) يوميًا.\n- لولي الأمر: شجع ابنك على التصدق من مصروفه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=15"]}]}, {"t": "بين رفوف مكتبتي: القراءة الحرة (المحور الثاني)", "u": "المحور الثاني: قصص وعبر", "s": [{"k": "القراءة", "p": ["اختيار قصة من مكتبة الصف وقراءتها قراءة صامتة", "تحليل شخصيات القصة المختارة وتسجيل صفاتها", "عرض القصص المقروءة وإبداء الرأي فيها"], "w": "الأسبوع الثاني عشر – الأسبوع الخامس عشر – الأسبوع السابع عشر", "f": ["1. يختار قصة مناسبة من مكتبة الصف أو مركز مصادر التعلم (10 دقائق)\n2. يقرأ القصة قراءة صامتة ويدون كلماتها الجديدة (15 دقيقة)\n3. يحدد شخصيات القصة التي قرأها ويصف كل شخصية (20 دقيقة)\n4. يكمل استمارة القراءة الحرة (5 دقائق)\n5. يلخص القصة التي قرأها في جمل قليلة (10 دقائق)\n6. يبدي رأيه في القصة ويوصي بها أو لا يوصي معللًا (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يحافظ على الكتب ويعيدها إلى مكانها (15 دقيقة)\n- يتحدث عن قصته أمام زملائه بثقة (15 دقيقة)\n- يستمع لعروض زملائه ويطرح أسئلة مناسبة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: فهم\nالمخرج 6: تقييم\nالمخرج الآخر (1): تقييم\nالمخرج الآخر (2): تطبيق\nالمخرج الآخر (3): تطبيق", "1. التعلم الذاتي\n2. السؤال والجواب\n3. التعلم التشاركي\n4. الحوار والمناقشة\n5. التعلم التعاوني\n6. التعلم المبني على اللعب", "1. الكتاب\n2. أخرى: كتب مكتبة الصف\n3. أخرى: استمارة القراءة الحرة\n4. أخرى: ركن القراءة\n5. السبورة الذكية\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. القراءة الحرة: قراءة يختار فيها الطالب الكتاب بنفسه للمتعة والفائدة\n2. القراءة الصامتة: قراءة بالعين دون صوت لفهم المعنى\n3. الشخصية: من تقوم بالأحداث في القصة\n4. صفة الشخصية: خُلق الشخصية أو طبعها الذي تظهره أفعالها\n5. التلخيص: ذكر أهم الأحداث بإيجاز\n6. التوصية: نصح الآخرين بقراءة كتاب مع ذكر السبب", "يعرض المعلم ثلاث قصص ويقرأ بداية كل منها بإيجاز، ويختار التلميذ القصة التي تشوقه. (5 دقائق)", "1. اختيار القصة: يرشد الطلاب إلى معايير الاختيار: العنوان والغلاف والمستوى، ويختار التلميذ قصة ويسجل عنوانها (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n2. القراءة الصامتة: يتابع المعلم القراءة ويساعد من يحتاج إلى معنى كلمة، ويقرأ التلميذ صامتًا ويدون الكلمات الجديدة (22 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تسجيل البيانات: يوزع المعلم استمارة القراءة ص 81، ويكتب التلميذ الكلمة ومعناها في الاستمارة (7 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n4. إكمال القراءة: يتيح المعلم وقتًا لإكمال القصة، وينهي التلميذ قراءة قصته (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n5. جدول الشخصيات: يوجه المعلم إلى ملء جدول «الشخصية وصفتها» ص 81، ويكتب التلميذ الشخصيات وصفاتها مع الدليل (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. دائرة المشاركة: ينظم المعلم دائرة يعرض فيها كل طالب شخصية من قصته، ويقدم التلميذ شخصية ويصفها لزملائه (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. أكتب ملخصي: يوجه المعلم إلى كتابة ملخص من ثلاث جمل، ويكتب التلميذ ملخص قصته (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. العرض: ينظم المعلم عروضًا قصيرة لمدة دقيقة لكل طالب، ويعرض التلميذ ملخصه ورأيه في القصة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n9. التوصيات: يكتب المعلم على لوحة ركن القراءة القصص الموصى بها، ويصوت التلميذ للقصة التي يرغب في قراءتها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – كلمات قصتي الجديدة: يختار كل طالب كلمة جديدة دوّنها من قصته ويستخدمها في جملة عن عمان، ثم يجمع أفراد المجموعة جملهم في فقرة قصيرة يقرؤونها للصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أفضل طريقة لاختيار قصة: (أ) أقرأ العنوان وأتأمل الغلاف وبداية القصة (ب) أختار دون نظر (ج) أختار الأكبر حجمًا\nالإجابة: (أ) أقرأ العنوان وأتأمل الغلاف وبداية القصة\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): نستنتج صفة الشخصية من أفعالها وأقوالها.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): لخص قصتك في ثلاث جمل.\nالإجابة: يكتب الطالب بداية القصة وحدثها الرئيس ونهايتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ ثلاث قصص ويتأمل معه العنوان والغلاف وبداية كل منها ليختار المناسبة، ثم يقرأ معه صفحة قراءة صامتة بالعين دون صوت؛ وللتحقق يسأله: كيف تختار قصة مناسبة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإكمال استمارة القراءة الحرة لقصتهم ووصف كل شخصية بصفتين، ثم يلخصونها في فقرة قصيرة ويقارنونها بقصة قرؤوها في المحور الأول.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: أسجل في الاستمارة الكلمة الجديدة و.....\nالإجابة: معناها\n\nس2 (مستوى التطبيق): عند الحديث عن قصتي أمام الصف: (أ) أقرأ القصة كلها (ب) أتحدث بوضوح وأرتب الأفكار (ج) أتحدث بسرعة\nالإجابة: (ب) أتحدث بوضوح وأرتب الأفكار\n\nس3 (مستوى الاستدلال): هل توصي زملاءك بقراءة قصتك؟ لماذا؟\nالإجابة: يجيب الطالب برأيه معللًا.", "- للطالب: أكمل قراءة قصتك في البيت.\n- لولي الأمر: خصص وقتًا يوميًا للقراءة مع ابنك.\n- للطالب: أكمل جدول الشخصيات في الاستمارة.\n- لولي الأمر: اسأل ابنك عن شخصيات القصة التي قرأها.\n- للطالب: اختر قصة جديدة من مكتبة البيت أو المدرسة لقراءتها.\n- لولي الأمر: زر مع ابنك مكتبة عامة أو معرض كتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=16"]}]}, {"t": "الدرس القرائي الثالث: نصيحة أب", "u": "المحور الثاني: قصص وعبر", "s": [{"k": "التحدث", "p": ["أشاهد وأتحدث: فوائد العمل ضمن مجموعة"], "w": "الأسبوع الخامس عشر", "f": ["1. يصف الصورة لزملائه بجمل فصيحة (15 دقيقة)\n2. يذكر فوائد العمل ضمن مجموعة (10 دقائق)\n\nمخرج تعليمي آخر:\n- يبدي رأيه في البقاء ضمن مجموعته أو تغييرها معللًا (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج الآخر: تقييم", "1. الحوار والمناقشة\n2. التعلم التعاوني\n3. فكّر، زاوج، شارك", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية", "1. العمل الجماعي: تعاون مجموعة لإنجاز مهمة واحدة\n2. التعاون: أن يساعد الناس بعضهم بعضًا", "ينفذ المعلم تحديًا: يحاول طالب رفع صندوق ثقيل وحده ثم بمساعدة زملائه، ويلاحظ التلميذ أن التعاون يسهل المهمة. (5 دقائق)", "1. أصف الصورة: يعرض المعلم صورة ص 63 ويطرح السؤال الأول، ويصف التلميذ الصورة بأربع جمل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. فوائد العمل الجماعي: يستخدم المعلم العصف الذهني لتدوين الفوائد على السبورة، ويذكر التلميذ فائدة ويضيفها إلى القائمة (6 دقائق)\nالاستراتيجيات: فكّر.\n\n3. أبدي رأيي: يناقش المعلم السؤال الثالث: أتحب البقاء ضمن مجموعتك أم تغييرها؟، ويعبر التلميذ عن رأيه ويعلله (6 دقائق)\nالاستراتيجيات: زاوج.\n\n4. غلق الدرس – حزمة الأيدي: تقف كل مجموعة متشابكة الأيدي، ويذكر كل طالب بجملة فائدة من فوائد العمل الجماعي، ثم تذكر المجموعة عملًا يتعاون فيه العمانيون معًا كتنظيف الأفلاج أو حملات تنظيف الشواطئ، وتنال المجموعة صاحبة أكثر الأمثلة نجمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، العصف الذهني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من فوائد العمل ضمن مجموعة: (أ) تبادل الأفكار وإنجاز العمل بسرعة (ب) كثرة الخلاف (ج) إضاعة الوقت\nالإجابة: (أ) تبادل الأفكار وإنجاز العمل بسرعة\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): العمل الجماعي يحتاج إلى احترام آراء الآخرين.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): متى يكون العمل ضمن المجموعة ناجحًا؟\nالإجابة: حين يتعاون الجميع ويؤدي كل فرد دوره ويحترم الآخرين.\n\n• نشاط علاجي (لمن لم يتقن): ينفذ المعلم مع التلميذ ومجموعة صغيرة مهمة بسيطة (تركيب صورة مقطعة) يؤدي فيها كل فرد دوره، ثم يناقش معه فائدة العمل الجماعي؛ وللتحقق يسأله: اذكر فائدة من فوائد العمل ضمن مجموعة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوقع النصيحة التي يقدمها الأب لأبنائه في نص «نصيحة أب» وكتابتها بأسلوبهم، ثم يضعون ثلاث قواعد لنجاح العمل في مجموعتهم ويعللونها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: أن يساعد الناس بعضهم بعضًا يسمى .....\nالإجابة: التعاون\n\nس2 (مستوى التطبيق): عند الحديث أمام الزملاء: (أ) أنظر إليهم وأتحدث بوضوح (ب) أقاطعهم (ج) أتحدث بلغة عامية\nالإجابة: (أ) أنظر إليهم وأتحدث بوضوح\n\nس3 (مستوى الاستدلال): اذكر عملًا أنجزته مع مجموعتك ونتيجته.\nالإجابة: يذكر الطالب عملًا جماعيًا ونتيجته.", "- للطالب: اذكر لأسرتك ثلاث فوائد للعمل الجماعي.\n- لولي الأمر: شارك ابنك في عمل منزلي جماعي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.gith
