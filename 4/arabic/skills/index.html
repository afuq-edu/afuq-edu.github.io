ار مها والعصافير والراوي، ويمثل التلميذ دوره بنبرة مناسبة (10 دقائق)\nالاستراتيجيات: تمثيل الأدوار.\n\n6. أسئلة الفهم: يوزع المعلم أسئلة ص 18 على المجموعات، وتجيب المجموعة ويعرض المتحدث (14 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n7. أبدي رأيي: يناقش المعلم: هل تستحق مها وصف الكسل؟ لماذا؟ ويبدي التلميذ رأيه معللًا (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. ماذا أفعل إذا أخطأت؟: ينظم المعلم حوارًا حول السؤال الأخير ص 18، ويقترح التلميذ تصرفات: الاعتذار، إصلاح الخطأ (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. غلق الدرس – حوار العصافير: تقف المجموعات في صفين، ويقرأ أحد أفرادها جملة من حوار مها والعصافير بنبرة تناسب علامة الترقيم، ويخمن زملاؤه قائلها، ثم تذكر كل مجموعة تصرفًا يدل على الرفق بالطيور في حدائق عمان ومزارعها، وتتفق على اعتذار مهذب تقوله لو أخطأت في حق غيرها كما يفعل العماني الخلوق (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، تمثيل الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أين حطت العصافير الثلاثة؟ (أ) على شجرة (ب) على السور (ج) على حافة شباك مفتوح\nالإجابة: (ج) على حافة شباك مفتوح\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): خجلت العصافير لأنها أخطأت في حق مها.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): ماذا تفعل إذا أخطأت في حق غيرك؟\nالإجابة: أعتذر له وأصلح خطئي ولا أكرره.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورة الدرس ويوجّه التلميذ إلى وصفها بالتدريج: المنظر العام أولًا ثم التفاصيل، مكملًا جملًا فصيحة يبدؤها له؛ وللتحقق يسأله: بم نبدأ وصف الصورة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برواية موقف من إجازتهم بتسلسل منطقي مستخدمين أدوات الربط (ثم، بعد ذلك، أخيرًا)، ثم يطرح كل منهم سؤالًا مناسبًا على زميل بعد سماع حديثه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): عدد العصافير في القصة ثلاثة.\nالإجابة: صح\n\nس2 (مستوى التطبيق): شعور العصافير بعد معرفة الحقيقة: (أ) الغضب (ب) الخجل (ج) الخوف\nالإجابة: (ب) الخجل\n\nس3 (مستوى الاستدلال): لماذا يجب أن نتأكد قبل أن نحكم على الآخرين؟\nالإجابة: حتى لا نظلمهم ولا نؤذي مشاعرهم.", "- للطالب: اقرأ ص 16 قراءة جهرية لأسرتك.\n- لولي الأمر: استمع لقراءة ابنك وشجعه.\n- للطالب: مثل القصة مع إخوتك.\n- لولي الأمر: ناقش ابنك في أهمية التثبت قبل الحكم.\n- للطالب: أجب عن أسئلة ص 18 في كتابك.\n- لولي الأمر: ناقش ابنك في مواقف تحتاج إلى اعتذار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=1"]}, {"k": "الأنماط اللغوية", "p": ["المحاكاة: «يجب أن ... وإلا ...»", "مراجعة: الاسم والفعل والحرف", "مراجعة: الجملة المفيدة وغير المفيدة", "مراجعة: الجملة الاسمية والجملة الفعلية", "مراجعة: علامات الترقيم في الحوار", "تقويم شامل لدرس المراجعة"], "w": "الأسبوع الأول – الأسبوع الثاني", "f": ["1. يحاكي التعبير «يجب أن تستيقظ الآن وإلا تأخرت» في جمل من إنشائه (10 دقائق)\n2. يوظف التعبير في مواقف حياتية (15 دقيقة)\n3. يستخرج من النص أسماء وأفعالًا وحروفًا (10 دقائق)\n4. يميز أقسام الكلمة الثلاثة بعلاماتها (15 دقيقة)\n5. يميز الجملة المفيدة من غير المفيدة (10 دقائق)\n6. يكمل كلمات ناقصة ليحصل على جمل مفيدة (10 دقائق)\n7. يصنف الجمل إلى اسمية وفعلية وفق الجدول (10 دقائق)\n8. يملأ الجدول بجمل من النص (15 دقيقة)\n9. يستخرج من حوار النص جملًا تحتوي على علامات الترقيم (: . ؟ !) (15 دقيقة)\n10. يحدد وظيفة كل علامة (10 دقائق)\n11. يجيب عن أسئلة شاملة لمهارات درس المراجعة (15 دقيقة)\n12. يحدد نقاط قوته وما يحتاج إلى تدريب (10 دقائق)\n\nمخرج تعليمي آخر:\n- يربط التعبير بأهمية النظام والوقت (15 دقيقة)\n- يصنف كلمات جديدة إلى أقسامها (15 دقيقة)\n- يضع خطًا عند نهاية كل جملة في فقرة (20 دقيقة)\n- يحول جملة فعلية إلى اسمية (15 دقيقة)\n- يقرأ الحوار مراعيًا العلامات (15 دقيقة)\n- يتعاون مع زملائه في مسابقة المراجعة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: تحليل\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: فهم\nالمخرج 11: تطبيق\nالمخرج 12: تقييم\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: تطبيق\nالمخرج الآخر 5: تطبيق\nالمخرج الآخر 6: تطبيق", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. التعلم المبني على اللعب\n4. التعلم بالاكتشاف\n5. التعلم التشاركي\n6. التعلم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. أخرى: بطاقات مواقف\n4. أخرى: سلال التصنيف\n5. أخرى: بطاقات جمل ناقصة\n6. أخرى: جدول التصنيف\n7. أخرى: بطاقات العلامات\n8. السبورة الذكية\n9. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n10. أخرى: ورقة عمل شاملة", "1. المحاكاة: كتابة جملة على نمط جملة معطاة\n2. الشرط والنتيجة: أمر يترتب عليه أمر آخر\n3. الاسم: كلمة تدل على إنسان أو حيوان أو نبات أو شيء\n4. الفعل: كلمة تدل على حدث في زمن\n5. الحرف: كلمة لا يظهر معناها إلا مع غيرها مثل: في، على\n6. الجملة المفيدة: كلام يفهم منه معنى تام\n7. الجملة غير المفيدة: كلام ناقص لا يتم به المعنى\n8. الجملة الاسمية: جملة تبدأ باسم\n9. الجملة الفعلية: جملة تبدأ بفعل\n10. علامة الاستفهام: توضع بعد السؤال (؟)\n11. علامة التعجب: توضع بعد التعجب والانفعال (!)\n12. التقويم الشامل: قياس ما تعلمه الطالب في الدرس كله\n13. نقاط القوة: المهارات التي يتقنها الطالب", "يقول المعلم: يجب أن تذاكر وإلا ... ويطلب الإكمال، ويكمل التلميذ الجملة شفهيًا. (5 دقائق)", "1. أحلل التعبير: يكتب المعلم التعبير ويبين جزأيه: الأمر الواجب ونتيجة تركه، ويحدد التلميذ الجزأين (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. بطاقات المواقف: يوزع المعلم مواقف: الطعام، النوم، الحافلة، الواجب، ويكتب التلميذ جملة محاكية لكل موقف (18 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. أقرأ جملتي: يستمع المعلم لجمل الطلاب ويقوّمها، ويقرأ التلميذ جملته ويصحح عند الحاجة (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. أستخرج من النص: يوجه المعلم إلى نشاط ص 19: استخراج أسماء وأفعال وحروف، ويستخرج التلميذ ويكتب في الجدول (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. سلال التصنيف: يضع المعلم ثلاث سلال ويوزع بطاقات كلمات، ويضع التلميذ البطاقة في السلة المناسبة ويعلل (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. العلامات المميزة: يراجع المعلم علامات الاسم (ال، التنوين) والفعل (قد، السين)، ويذكر التلميذ علامة لكل كلمة (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. أحدد نهاية الجمل: يوجه المعلم إلى فقرة ص 19 ووضع خط مائل عند نهاية كل جملة، ويحدد التلميذ نهايات الجمل (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. مفيدة أم غير مفيدة: يوجه المعلم إلى نشاط ص 20 بوضع العلامة المناسبة، ويضع التلميذ علامة صح أو خطأ (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. أكمل لتصبح مفيدة: يوزع المعلم بطاقات جمل ناقصة، ويكمل التلميذ الجمل ويقرؤها (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n10. أصنف الجمل: يوجه المعلم إلى تصنيف الجمل في جدول ص 19، ويصنف التلميذ الجمل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. أملأ الجدول: يوجه المعلم إلى نشاط ص 21 من فقرة «ضحكت مها...»، ويستخرج التلميذ الجمل ويملأ الجدول (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n12. أحول الجملة: يعرض المعلم جملًا فعلية لتحويلها إلى اسمية، ويحول التلميذ الجمل ويقرؤها (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n13. أستخرج الجمل: يوجه المعلم إلى حوار مها والعصافير واستخراج جمل بها العلامات، ويستخرج التلميذ الجمل ويكتبها ص 22 (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n14. وظيفة العلامات: يناقش المعلم وظيفة كل علامة بالأمثلة، ويذكر التلميذ الوظيفة ويمثل (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n15. قراءة الحوار: يطلب المعلم قراءة الحوار بأداء يناسب العلامات، ويقرأ التلميذ بنبرة مناسبة (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n16. ورقة عمل شاملة: يوزع المعلم ورقة تتضمن: فهمًا، وتصنيف كلمات، وجملًا، وترقيمًا، ويحل التلميذ الورقة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n17. التصحيح: يصحح المعلم مع الطلاب ويعالج الأخطاء، ويصحح التلميذ ويحدد نقاط ضعفه (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n18. خطة التحسين: يوجه المعلم إلى كتابة هدف تحسين، ويكتب التلميذ هدفًا لتحسين مهارة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n19. غلق الدرس – سلة الكلمات العمانية: تسحب كل مجموعة بطاقات كلمات عن عمان مثل: «مسقط، زار، في، القلعة، شامخة، الطلاب»، وتصنفها سريعًا إلى اسم وفعل وحرف، ثم تكون منها جملة اسمية وجملة فعلية مفيدتين عن الوطن وتكتبهما بعلامة الترقيم المناسبة، والمجموعة الأسرع والأدق تفوز (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كلمة «العصافير»: (أ) حرف (ب) فعل (ج) اسم\nالإجابة: (ج) اسم\n\nس2 (مستوى التطبيق): علي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=1"]}]}, {"t": "درس الاستماع: أجمل مكان في الدنيا", "u": "المحور الأول: في ربوع وطني", "s": [{"k": "التحدث", "p": ["الاستماع الواعي والإجابة عن أسئلة النص", "تحليل النص المسموع وإبداء الرأي في حب الوطن"], "w": "الأسبوع الثاني", "f": ["1. يستمع إلى نص «أجمل مكان في الدنيا» بإنصات وانتباه (15 دقيقة)\n2. يجيب عن أسئلة تتعلق بالنص المسموع (10 دقائق)\n3. يحلل دلالة احتضان النسر للصخرة واستنشاقه الهواء بعمق (10 دقائق)\n4. يبدي رأيه في إنصاف النسر (10 دقائق)\n\nمخرج تعليمي آخر:\n- يسرد القصة بأسلوبه (15 دقيقة)\n- يعبر عن حبه لوطنه عُمان بطرق مختلفة (20 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تقييم\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: إبداع", "1. السؤال والجواب\n2. التنبؤ\n3. العصف الذهني\n4. فكّر، زاوج، شارك\n5. الحوار والمناقشة\n6. التعلم التعاوني\n7. التعلم المبني على اللعب", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة التقليدية\n4. صورة توضيحية\n5. السبورة الذكية\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. النسر: طائر جارح قوي يعيش في الجبال\n2. الوطن: المكان الذي ولد فيه الإنسان ونشأ\n3. الانتماء: شعور الإنسان بأنه جزء من وطنه\n4. الحنين: الشوق إلى المكان أو الأهل", "يسأل المعلم: ما أجمل مكان في الدنيا في رأيك؟ ويذكر التلميذ مكانًا ويعلل. (5 دقائق)", "1. آداب الاستماع: يذكر المعلم بآداب الاستماع ويعرض أسئلة ص 26، ويقرأ التلميذ الأسئلة صامتًا (7 دقائق)\nالاستراتيجيات: التنبؤ.\n\n2. الاستماع الأول: يقرأ المعلم النص أو يشغله ويتوقف عند نزول النسر ليسأل: أين تتوقع أنه نزل؟ وينصت التلميذ ويتنبأ (13 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n3. الاستماع الثاني: يعيد المعلم ويطلب الإجابة عن الأسئلة، والتلاميذ يدون الإجابات (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n4. الاستماع الثالث والتصحيح: يعيد المعلم ويناقش الإجابات، ويصحح التلميذ إجاباته (6 دقائق)\nالاستراتيجيات: التنبؤ.\n\n5. أحلل: يناقش المعلم: علام يدل احتضان النسر الصخرة؟ ولماذا تعجب الملك؟ ويحلل التلميذ ويعلل (8 دقائق)\nالاستراتيجيات: زاوج.\n\n6. أبدي رأيي: يطرح المعلم: هل أنصف النسر؟ ويستخدم «فكر، زاوج، شارك»، ويبدي التلميذ رأيه مع زميله ثم يشارك (8 دقائق)\nالاستراتيجيات: شارك.\n\n7. كيف أعبر عن حبي لوطني؟: يوجه المعلم إلى ذكر طرق التعبير عن حب الوطن، ويكتب التلميذ ثلاث طرق في الكتاب ص 27 (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. غلق الدرس – أجمل مكان في الدنيا: تختار كل مجموعة مدينة عمانية كمسقط أو نزوى أو صلالة أو صور، وتعدها «أجمل مكان في الدنيا»، وتقدّم عنها إعلانًا سياحيًا شفهيًا مدته نصف دقيقة يبرز معلمًا واحدًا فيها (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا طلب الملك من النسر؟ (أ) أن يأخذه إلى أجمل مكان في الدنيا (ب) أن يصطاد له (ج) أن يحرس قصره\nالإجابة: (أ) أن يأخذه إلى أجمل مكان في الدنيا\n\nس2 (مستوى التطبيق): أكمل: تعجب الملك من المكان لأنه كان .... في نظره.\nالإجابة: بسيطًا\n\nس3 (مستوى الاستدلال): هل أنصف النسر في اختياره؟ علل.\nالإجابة: نعم؛ لأن الوطن أجمل مكان لصاحبه مهما كان بسيطًا.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم سرد قصة النسر والملك بصور متتابعة، ويحرك التلميذ مجسم النسر فوق الأماكن حتى يهبط على الصخرة في موطنه؛ وللتحقق يسأله: ماذا طلب الملك من النسر؟ وأين نزل النسر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتفسير احتضان النسر للصخرة واستنشاقه الهواء بعمق، ثم يكتبون فقرة قصيرة عن «أجمل مكان في الدنيا» بالنسبة إليهم في عُمان معللين اختيارهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: أجمل مكان في الدنيا عند النسر هو .....\nالإجابة: وطنه\n\nس2 (مستوى التطبيق): من طرق التعبير عن حب الوطن: (أ) المحافظة على نظافته (ب) إتلاف الممتلكات (ج) الإهمال\nالإجابة: (أ) المحافظة على نظافته\n\nس3 (مستوى الاستدلال): كيف تعبر عن حبك لوطنك عُمان؟\nالإجابة: أحافظ على نظافته وأجتهد في دراستي وأحترم قوانينه.", "- للطالب: احكِ القصة لأسرتك بأسلوبك.\n- لولي الأمر: اسأل ابنك: ما أجمل مكان عندك؟ ولماذا؟\n- للطالب: اكتب ثلاث طرق تعبر بها عن حبك لعُمان.\n- لولي الأمر: شارك ابنك في نشاط وطني بسيط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=2"]}]}, {"t": "المستند البصري: قراءة شعار", "u": "المحور الأول: في ربوع وطني", "s": [{"k": " ط، ألوان معبرة، اسم المدرسة، وتصمم المجموعة شعارًا وتعرضه (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. غلق الدرس – نرسم شعار بلادي: يرسم أفراد كل مجموعة شعار السلطنة بالتعاون، فيرسم أحدهم الخنجر وآخر السيفين المتقاطعين، ثم يتحدثون عن الاعتزاز بالشعار واحترامه وأماكن رؤيته كالمباني الحكومية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): يتكون شعار سلطنة عمان من: (أ) قلعة وجمل (ب) خنجر وسيفين متقاطعين (ج) نخلة وسفينة\nالإجابة: (ب) خنجر وسيفين متقاطعين\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): يدل الشعار على الارتباط بالموروث العماني.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): ماذا يعني لك شعار وطنك؟\nالإجابة: يعني الاعتزاز بالوطن وتاريخه وأصالته.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم شعار سلطنة عُمان مكبرًا، ويلوّن التلميذ الخنجر بلون والسيفين المتقاطعين بلون آخر وهو يسمي كل جزء؛ وللتحقق يسأله: مم يتكون شعار سلطنة عُمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم شعار لمدرستهم يضم رمزين وكتابة دلالة كل رمز، ثم يقارنون بين شعارهم وشعار سلطنة عُمان من حيث العناصر والمعاني.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: الرمز الذي يدل على الدولة ويميزها يسمى .....\nالإجابة: الشعار\n\nس2 (مستوى التطبيق): من معايير الشعار الجيد: (أ) التعقيد (ب) كثرة الكتابة (ج) البساطة والتعبير عن صاحبه\nالإجابة: (ج) البساطة والتعبير عن صاحبه\n\nس3 (مستوى الاستدلال): اشرح فكرة الشعار الذي صممته لمدرستك.\nالإجابة: يشرح الطالب الرموز والألوان ودلالتها.", "- للطالب: ارسم شعار سلطنة عمان في دفترك.\n- لولي الأمر: حدث ابنك عن الخنجر العماني ومكانته.\n- للطالب: أكمل تلوين الشعار الذي صممته.\n- لولي الأمر: ناقش مع ابنك فكرة شعاره.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=3"]}]}, {"t": "الدرس القرائي الأول: مغامرة إلى قرية (الغمب)", "u": "المحور الأول: في ربوع وطني", "s": [{"k": "التحدث", "p": ["أشاهد وأتحدث: الرحلات والمغامرات"], "w": "الأسبوع الثاني", "f": ["1. يتحدث عما يشاهده في الصورة بلغة سليمة (15 دقيقة)\n2. يتوقع ما يحمله الأشخاص في حقائبهم ووقت انطلاقهم امرة في خمس جمل (10 دقائق)\n19. يجيب عن أسئلة شاملة للدرس (15 دقيقة)\n20. يحدد ما أتقنه وما يحتاج إلى تدريب (10 دقائق)\n\nمخرج تعليمي آخر:\n- يتعرف الكاتب العماني خالد العنقودي ومصدر النص (15 دقيقة)\n- يلتزم آداب القراءة الجماعية (10 دقائق)\n- يقدّر الالتزام بالجماعة وتعليمات الدليل (15 دقيقة)\n- يوظف كلمة جديدة في جملة (15 دقيقة)\n- يقرأ من النص ما يدل على جمال صباح القرية (15 دقيقة)\n- يستنتج صفات المغامر الناجح (15 دقيقة)\n- يذكر فوائد يكتسبها من الرحلات (15 دقيقة)\n- يحاكي تركيب «بدت ... كـ...» في جمل من إنشائه (15 دقيقة)\n- يقيم قراءة زملائه بمعايير محددة (15 دقيقة)\n- يتعاون في المسابقة الختامية للدرس (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: فهم\nالمخرج 8: تطبيق\nالمخرج 9: تذكر\nالمخرج 10: فهم\nالمخرج 11: تحليل\nالمخرج 12: تطبيق\nالمخرج 13: تحليل\nالمخرج 14: إبداع\nالمخرج 15: تطبيق\nالمخرج 16: تقييم\nالمخرج 17: تطبيق\nالمخرج 18: فهم\nالمخرج 19: تطبيق\nالمخرج 20: تقييم\nالمخرج الآخر 1: تذكر\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم\nالمخرج الآخر 4: تطبيق\nالمخرج الآخر 5: فهم\nالمخرج الآخر 6: تحليل\nالمخرج الآخر 7: تطبيق\nالمخرج الآخر 8: إبداع\nالمخرج الآخر 9: تقييم\nالمخرج الآخر 10: تطبيق", "1. التنبؤ\n2. السؤال والجواب\n3. التعلم الذاتي\n4. التعلم بالنمذجة\n5. تعدد القراءات\n6. التعلم التعاوني\n7. تمثيل الأدوار\n8. تبادل البطاقات\n9. التعلم المبني على اللعب\n10. الرؤوس المرقمة\n11. فكّر، زاوج، شارك\n12. التعلم بالاكتشاف\n13. العصف الذهني\n14. الحوار والمناقشة\n15. التعلم المبني على حل المشكلات\n16. التعلم التشاركي", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الوسائل المتعددة (سمعية - بصرية)\n5. السبورة التقليدية\n6. أخرى: خريطة مسار المغامرة\n7. أخرى: بطاقات الأضداد\n8. الأقلام\n9. أخرى: حقيبة مغامر\n10. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n11. أخرى: بطاقة معايير القراءة\n12. أخرى: ورقة عمل شاملة", "1. التصفح: قراءة سريعة لأخذ فكرة عامة عن النص\n2. نيابة طيوي: منطقة عمانية جبلية تقع فيها قرية الغمب\n3. الدليل: من يرشد المغامرين إلى الطريق\n4. الجبال الشاهقة: الجبال العالية جدًا\n5. الوحشة: الشعور بالخوف من المكان الخالي\n6. ضلوا الطريق: تاهوا ولم يعرفوا الطريق الصحيح\n7. يقتفي: يتتبع\n8. الراسيات: الجبال الثابتة\n9. تغمرنا: تغطينا\n10. اللياقة البدنية: قوة الجسم وقدرته على التحمل\n11. مسابقة الوقت: الإسراع للوصول قبل موعد معين\n12. نقطة الانطلاق: المكان الذي بدأت منه الرحلة\n13. أدوات المغامر: ما يحمله المغامر لسلامته وراحته\n14. الظلام الدامس: الظلام الشديد\n15. فوائد الرحلات: ما يكتسبه الإنسان من معرفة ومهارات في رحلاته\n16. المدة الزمنية: الوقت الذي يستغرقه حدث من بدايته إلى نهايته\n17. التشبيه: وصف شيء بشيء آخر يشبهه بأداة مثل الكاف\n18. التلخيص: ذكر أهم الأفكار بإيجاز\n19. القراءة الأدائية: قراءة تعبر بالصوت عن المعنى والمشاعر\n20. المراجعة: استعادة أهم ما تعلمه الطالب\n21. بطاقة الإتقان: بطاقة يحدد فيها الطالب مستوى إتقانه", "يكتب المعلم العنوان ويسأل: ما الذي يجعل الرحلة مغامرة؟ ويذكر التلميذ: الصعوبة والمفاجأة. (5 دقائق)", "1. معنى المغامرة: يناقش المعلم السؤال الأول ص 30 ويطلب الاختيار والتعليل، ويختار التلميذ المعنى الصحيح (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n2. أتأمل الصورتين: يوجه المعلم إلى توقع مكان المغامرة وأحداثها، ويتوقع التلميذ ويكتب في الكتاب (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الكاتب والمصدر: يعرف المعلم بخالد العنقودي وكتاب «أوكسجين الجبل»، ويكتب التلميذ اسم الكاتب والمصدر (11 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة النموذجية: يقرأ المعلم من «انطلقنا» إلى «وكلهم أمل في الوصول»، ويتابع التلميذ ويحدد الكلمات الجديدة؛ ثم يقرأ المعلم من «كان في صحبتنا مجموعة» إلى نهاية النص، ويتابع التلميذ (21 دقيقة)\nالاستراتيجيات: تعدد القراءات، التعلم التعاوني.\n\n5. القراءة الجهرية: يوزع المعلم الفقرات ويعالج الأخطاء فورًا، ويقرأ التلميذ بطلاقة وضبط (21 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. من ملخص المغامرة: يناقش المعلم بيانات الملخص، ويستخرج التلميذ المسار والمسافة والمكان (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. القراءة المسترسلة: يطلب المعلم قراءة النص كاملًا بالتتابع، ويقرأ التلميذ مراعيًا الوقف (19 دقيقة)\nالاستراتيجيات: تمثيل الأدوار.\n\n8. مسار المغامرة: يرسم المعلم مع الطلاب خريطة مبسطة للمسار والضياع والوصول، ويحدد التلميذ مواقع الأحداث على الخريطة (11 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n9. المعنى نفسه: يوجه المعلم إلى سؤال ص 35: تغمرنا، تطوقنا، مكتسية، ويكتب التلميذ البدائل (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. يقتفي والأضداد: يناقش المعلم سؤالي ص 36، ويختار التلميذ «يتتبع» ويصل الأضداد (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. لعبة الأضداد: يوزع المعلم بطاقات للمطابقة السريعة، ويطابق التلميذ ويقرأ الزوج (11 دقيقة)\nالاستراتيجيات: تبادل البطاقات.\n\n12. نوع المغامرة والدليل: يطرح المعلم السؤالين الأولين ص 34، ويختار التلميذ «جبلية» ويذكر الدليل (11 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n13. المجموعة المنفصلة: يوزع المعلم سؤال الانفصال والسبق على المجموعات، ويوضح التلميذ السبب والنتيجة (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n14. صباح القرية: يوجه المعلم إلى قراءة ما يدل على جمال الصباح ص 35، ويقرأ التلميذ الفقرة الدالة (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n15. أستخرج الدليل: يوجه المعلم إلى الفقرة الأولى لاستخراج ما يدل على الابتعاد، ويستخرج التلميذ: بساتين النخيل تختفي شيئًا فشيئًا (17 دقيقة)\nالاستراتيجيات: زاوج.\n\n16. أدوات النص وأدوات أقترحها: يناقش المعلم السؤال عن الأدوات والمواد ص 36، ويذكر التلميذ: قنينات المياه، حبات التمر، المصابيح، ويقترح غيرها (11 دقيقة)\nالاستراتيجيات: شارك.\n\n17. صفات المغامر: يستخدم المعلم «فكر، زاوج، شارك» لاستنتاج الصفات، ويستنتج التلميذ: الصبر، اللياقة، الالتزام (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n18. الدليل على الظلام: يوجه المعلم إلى استخراج عبارات الظلام: اشتعلت المصابيح، ظلام دامس، ويستخرج التلميذ الدليل ويقرؤه (17 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n19. عنوان آخر: ينظم المعلم عصفًا ذهنيًا للعناوين، ويقترح التلميذ عنوانًا ويصوت (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n20. فوائد الرحلات: يطلب المعلم ثلاث فوائد يتوقع اكتسابها، ويكتب التلميذ الفوائد ص 37 (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n21. أحسب المدة: يوجه المعلم إلى السؤال ص 38 ويقارن بالزمن المتوقع في الملخص، ويحسب التلميذ ويوضح السبب (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n22. هل ستوافق زميلك؟: يطرح المعلم موقف الزميل الذي يقترح السبق ويناقش، ويبدي التلميذ رأيه ويعلل (13 دقيقة)\nالاستراتيجيات: فكّر.\n\n23. أحاكي التشبيه: يعرض المعلم «بدت نخيل مزارعها كأسوار قلعة تحرسها»، ويكتب التلميذ جملة محاكية (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n24. القراءة الأدائية: يوزع المعلم الفقرات ويقيم ببطاقة المعايير، ويقرأ التلميذ فقرته أداءً (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n25. التلخيص: يوجه المعلم إلى تلخيص المغامرة في خمس جمل، ويكتب التلميذ الملخص (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n26. عرض الملخصات: يختار المعلم ملخصات للقراءة، ويقرأ التلميذ ملخصه (10 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n27. ورقة عمل: يوزع المعلم ورقة: فهم، مبتدأ وخبر، همزتا القطع والوصل، ويحل التلميذ الورقة (19 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n28. التصحيح: يصحح المعلم مع الطلاب، ويصحح التلميذ ويناقش (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n29. غلق الدرس – حقيبة رحلة جبلية: تخطط كل مجموعة لرحلة إلى قرية جبلية عمانية، فتختار خمسة أشياء تضعها في الحقيبة ووقت الانطلاق، وتضيف قاعدة للمحافظة على البيئة واحترام أهل القرية، ثم تعرض خطتها (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): معنى كلمة (مغامرة): (أ) حدث يحيط به اللعب (ب) حدث تحيط به المفاجأة والتشويق (ج) حدث يحيط به الملل\nالإجابة: (ب) حدث تحيط به المفاجأة والتشويق\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): انفصلت مجموعة من المغامرين لأنهم أرادوا الوصول قبل الباقين.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): ما العبرة من قصة المغامرة؟\nالإجابة: الالتزام بالجماعة واتباع الدليل والصبر على المشقة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم حقيبة رحلة ويُخرج منها مع التلميذ الماء والطعام والمصباح، ويسأله عن سبب حمل كل غرض، ثم يوضح معنى «المغامرة» بموقف مشوق؛ وللتحقق يسأله: ماذا يحمل المغامرون في حقائبهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لرحلة إلى قرية جبلية في عُمان تتضمن الأدوات ووقت الانطلاق والمخاطر المتوقعة وطرق تجنبها، مستفيدين من نص «مغامرة إلى قرية الغمب».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): أخذ النص من كتاب «أوكسجين الجبل».\nالإجابة: صح\n\nس2 (مستوى التطبيق): مما وصف به صباح القرية: (أ) مصانع كثيرة (ب) نخيل كأسوار قلعة تحرسها (ج) شوارع مزدحمة\nالإجابة: (ب) نخيل كأسوار قلعة تحرسها\n\nس3 (مستوى الاستدلال): قيم قراءة زميلك بجملة.\nالإجابة: مثل: قرأ بصوت واضح لكنه أسرع في الفقرة الأخيرة.", "- للطالب: اقرأ النص ص 31–33 قراءة صامتة.\n- لولي الأمر: ابحث مع ابنك عن نيابة طيوي على الخريطة.\n- للطالب: درب نفسك على قراءة ص 31–32.\n- لولي الأمر: استمع لقراءة ابنك وصحح بهدوء.\n- للطالب: اقرأ النص كاملًا لأسرتك.\n- لولي الأمر: ناقش ابنك في أهمية اتباع التعليمات.\n- للطالب: اكتب معاني خمس كلمات جديدة من النص.\n- لولي الأمر: اسأل ابنك عن معنى «يقتفي».\n- للطالب: أجب عن أسئلة ص 34–35.\n- لولي الأمر: تابع إجابات ابنك ودليلها من النص.\n- للطالب: اكتب قائمة بما تحمله في رحلة.\n- لولي الأمر: جهز مع ابنك حقيبة رحلة نموذجية.\n- للطالب: اكتب عنوانًا آخر للنص وعلله.\n- لولي الأمر: حدث ابنك عن فوائد الرحلات.\n- للطالب: اكتب جملتين على نمط التشبيه.\n- لولي الأمر: ناقش ابنك في رأيه حول الالتزام بالجماعة.\n- للطالب: اقرأ ملخصك لأسرتك.\n- لولي الأمر: استمع لملخص ابنك.\n- للطالب: راجع الدرس ص 29–46.\n- لولي الأمر: اطلع على بطاقة إتقان ابنك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=4"]}, {"k": "الأنماط اللغوية", "p": ["الأنماط اللغوية (1): الجملة الاسمية: المبتدأ والخبر", "الأنماط اللغوية (2): تحديد ركني الجملة الاسمية", "الأنماط اللغوية (3): تكوين جمل اسمية ومحاكاتها"], "w": "الأسبوع الثالث", "f": ["1. يحدد نوع الكلمات التي بدأت بها الجمل الملونة (15 دقيقة)\n2. يميز الجمل الاسمية من الفعلية في فقرة (15 دقيقة)\n3. يقسم الجمل الاسمية إلى ركنيها: المبتدأ والخبر (15 دقيقة)\n4. يستخرج جملًا اسمية غير ملونة ويحدد ركنيها (10 دقائق)\n5. يكوّن جملًا اسمية باختيار المبتدأ من عمود والخبر من آخر (15 دقيقة)\n6. يحاكي الجمل الاسمية في وصف صور (10 دقائق)\n\nمخرج تعليمي آخر:\n- يقدّر جامع السلطان قابوس الأكبر معلمًا حضاريًا (10 دقائق)\n- يستنتج أن الجملة الاسمية تتكون من ركنين (15 دقيقة)\n- يتعاون في نشاط بناء الجمل (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: فهم\nالمخرج الآخر 3: تطبيق", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم التشاركي\n5. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. السبورة التقليدية\n5. أخرى: جدول المبتدأ والخبر\n6. أخرى: بطاقات المبتدأ والخبر\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. المبتدأ: الاسم الذي تبدأ به الجملة الاسمية\n2. الخبر: ما يتم المعنى مع المبتدأ\n3. ركنا الجملة الاسمية: المبتدأ والخبر\n4. الخبر المفرد: كلمة واحدة تتم معنى المبتدأ مثل: عالية\n5. الجملة الاسمية المفيدة: مبتدأ وخبر يتم بهما المعنى\n6. المحاكاة: بناء جملة على نمط نموذج", "يعرض المعلم صورة جامع السلطان قابوس الأكبر ويسأل: صفه بجملة، ويصفه التلميذ بجملة. (5 دقائق)", "1. أقرأ وألاحظ: يقرأ المعلم فقرة ص 39 عن زيارة أحمد للجامع ويلون الجمل، ويحدد التلميذ الكلمة الأولى في كل جملة ملونة (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نوع الكلمة: يوجه المعلم إلى تحديد نوع الكلمة الأولى: اسم أم فعل أم حرف، ويحدد التلميذ أنها أسماء (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أصنف الجمل: يوجه المعلم إلى جدول الجمل الاسمية والفعلية ص 39، ويصنف التلميذ الجمل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أكمل الجدول: يوجه المعلم إلى جدول ص 40 كما في النموذج، ويضع التلميذ المبتدأ والخبر (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أستنتج القاعدة: يقود المعلم إلى أن الجملة الاسمية من ركنين، ويصوغ التلميذ القاعدة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. جمل غير ملونة: يوجه المعلم إلى استخراج جمل اسمية أخرى من الفقرة، ويستخرج التلميذ ويحدد الركنين (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. العمودان: يوجه المعلم إلى نشاط ص 41 لاختيار مبتدأ وخبر مناسبين، ويكوّن التلميذ الجمل ويكتبها (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. أحاكي بالصور: يعرض المعلم الصور ويحاكي «أحمد يصلي في المسجد»، ويكتب التلميذ جملًا اسمية للصور (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. تصحيح: يناقش المعلم الجمل غير المنطقية، ويصحح التلميذ ويعلل (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – ركنا الجملة: يوزع المعلم بطاقات مبعثرة فيها مبتدآت وأخبار عن معالم عمان مثل: «الجامع / شاسع»، «القرية / جميلة»، «الطريق / شاقة»، فيبحث كل طالب عن زميل يكمل بطاقته ليكونا جملة اسمية مفيدة، ويقرأ الزوجان جملتهما ويحددان المبتدأ والخبر، والأسرع يفوز، ثم يذكر الصف معلمًا عمانيًا يفخر به (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): نوع الكلمة «المآذن» في «المآذن عالية»: (أ) حرف (ب) فعل (ج) اسم\nالإجابة: (ج) اسم\n\nس2 (مستوى التطبيق): أكمل: المبتدأ في «الحديقة تحيط بالجامع» هو .....\nالإجابة: الحديقة\n\nس3 (مستوى الاستدلال): كوّن جملة اسمية تصف الطيور.\nالإجابة: الطيور تحلق في السماء.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم حقيبة رحلة ويُخرج منها مع التلميذ الماء والطعام والمصباح، ويسأله عن سبب حمل كل غرض، ثم يوضح معنى «المغامرة» بموقف مشوق؛ وللتحقق يسأله: ماذا يحمل المغامرون في حقائبهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لرحلة إلى قرية جبلية في عُمان تتضمن الأدوات ووقت الانطلاق والمخاطر المتوقعة وطرق تجنبها، مستفيدين من نص «مغامرة إلى قرية الغمب».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: الاسم الذي تبدأ به الجملة الاسمية يسمى .....\nالإجابة: المبتدأ\n\nس2 (مستوى التطبيق): الخبر في «الأزهار روائحها فواحة»: (أ) فواحة (ب) الأزهار (ج) روائحها فواحة\nالإجابة: (ج) روائحها فواحة\n\nس3 (مستوى الاستدلال): صف صورة بجملة اسمية من إنشائك.\nالإجابة: مثل: الوردة حمراء جميلة.", "- للطالب: اكتب ثلاث جمل اسمية عن مسجد حيك.\n- لولي الأمر: زر مع ابنك معلمًا حضاريًا في ولايتك.\n- للطالب: حدد المبتدأ والخبر في خمس جمل من كتابك.\n- لولي الأمر: راجع مع ابنك ركني الجملة الاسمية.\n- للطالب: اكتب خمس جمل اسمية تصف رحلة.\n- لولي الأمر: العب مع ابنك لعبة إكمال الخبر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=4"]}, {"k": "الإملاء", "p": ["الإملاء (1): همزتا القطع والوصل", "الإملاء (2): تصنيف همزة الوصل وتطبيقات من القرآن والحديث", "الإملاء (3): الإملاء الاختباري وتصويب الأخطاء"], "w": "الأسبوع الثالث – الأسبوع الرابع", "f": ["1. يميز الكلمات المبدوءة بهمزة قطع من المبدوءة بهمزة وصل (20 دقيقة)\n2. يستنتج الفرق بين الهمزتين نطقًا وكتابة (10 دقائق)\n3. يصنف الكلمات المبدوءة بهمزة وصل (10 دقائق)\n4. يكمل الجدول بكلمات من آيات وأحاديث (15 دقيقة)\n5. يكتب فقرة تملى عليه مراعيًا همزتي القطع والوصل (10 دقائق)\n6. يعيد كتابة الفقرة سليمة (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يقرأ الفقرة مراعيًا نطق الهمزتين (10 دقائق)\n- يستخرج من النص كلمتين بهمزة قطع وكلمتين بهمزة وصل (15 دقيقة)\n- يحدد أخطاءه الشائعة (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي\n6. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الهمزتين\n4. السبورة التقليدية\n5. أخرى: جدول التصنيف\n6. الأقلام", "1. همزة القطع: همزة تنطق في أول الكلام ووسطه وتكتب على الألف أو تحتها\n2. همزة الوصل: همزة تنطق في أول الكلام وتسقط في وسطه ولا ترسم\n3. همزة الوصل في الأفعال: تأتي في أول الأمر من الفعل الثلاثي مثل: اكتب\n4. همزة الوصل في «ال»: تأتي في «ال» التعريف مثل: القرآن\n5. الإملاء الاختباري: إملاء لقياس إتقان القاعدة\n6. التصويب: تصحيح الخطأ وكتابة الصواب", "ينطق المعلم: «انفصلوا» وحدها ثم «وانفصلوا» ويسأل: ماذا حدث للهمزة؟ ويلاحظ التلميذ سقوطها في الوصل. (5 دقائق)", "1. أقرأ وألاحظ: يقرأ المعلم فقرة ص 42 ويوجه إلى وضع دائرة حول همزة الوصل وخط تحت همزة القطع، ويحدد التلميذ الكلمات (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الفرق بين الهمزتين: يجرب المعلم مع الطلاب وصل الكلمات بما قبلها، ويستنتج التلميذ الفرق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصنيف همزة القطع: يوجه المعلم إلى جدول همزة القطع ص 42 (أُ، أَ، إِ)، ويصنف التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أصنف همزة الوصل: يوجه المعلم إلى جدول ص 43، ويصنف التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أكمل من الآيات والأحاديث: يعرض المعلم: ﴿فسبح بحمد ربك واستغفره﴾ وحديث «خيركم من تعلم القرآن وعلمه»، ويستخرج التلميذ الهمزات ويصنفها (14 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n6. من نص المغامرة: يوجه المعلم إلى نشاط ص 44، ويستخرج كلمتين لكل همزة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قراءة الفقرة: يقرأ المعلم الفقرة الإملائية ويناقش معناها، ويستمع التلميذ (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الإملاء: يملي المعلم جملة جملة، ويكتب التلميذ في الكتاب ص 44 (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n9. التصويب: يعرض المعلم الفقرة صحيحة، ويصحح التلميذ ويعيد الكتابة (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n10. غلق الدرس – قطع أم وصل؟: يقول المعلم كلمات من نص المغامرة ومن بيئة عمان مثل: «أسرة، انطلق، أفلاج، استراحة، أرض، استمتع»، وترفع كل مجموعة بطاقة «قطع» أو «وصل» بسرعة، ولكل إجابة صحيحة نقطة، ثم تكتب المجموعة الفائزة جملة عن قرى عمان الجبلية فيها همزة قطع وهمزة وصل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كلمة مبدوءة بهمزة وصل: (أ) انفصلوا (ب) إلى (ج) أولئك\nالإجابة: (أ) انفصلوا\n\nس2 (مستوى التطبيق): أكمل: همزة «القرآن» همزة .....\nالإجابة: وصل\n\nس3 (مستوى الاستدلال): صحح: «أنطلق المغامرون الى القرية».\nالإجابة: انطلق المغامرون إلى القرية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم حقيبة رحلة ويُخرج منها مع التلميذ الماء والطعام والمصباح، ويسأله عن سبب حمل كل غرض، ثم يوضح معنى «المغامرة» بموقف مشوق؛ وللتحقق يسأله: ماذا يحمل المغامرون في حقائبهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لرحلة إلى قرية جبلية في عُمان تتضمن الأدوات ووقت الانطلاق والمخاطر المتوقعة وطرق تجنبها، مستفيدين من نص «مغامرة إلى قرية الغمب».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: الكلمة «أولئك» مبدوءة بهمزة .....\nالإجابة: قطع\n\nس2 (مستوى التطبيق): كلمة مبدوءة بهمزة قطع من النص: (أ) أخرجنا (ب) انطلقنا (ج) استراحوا\nالإجابة: (أ) أخرجنا\n\nس3 (مستوى الاستدلال): اكتب كلمتين أخطأت فيهما وصوا  علاجي (لمن لم يتقن): يعرض المعلم حقيبة رحلة ويُخرج منها مع التلميذ الماء والطعام والمصباح، ويسأله عن سبب حمل كل غرض، ثم يوضح معنى «المغامرة» بموقف مشوق؛ وللتحقق يسأله: ماذا يحمل المغامرون في حقائبهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لرحلة إلى قرية جبلية في عُمان تتضمن الأدوات ووقت الانطلاق والمخاطر المتوقعة وطرق تجنبها، مستفيدين من نص «مغامرة إلى قرية الغمب».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: من يجتهد ويصبر للوصول إلى هدفه يسمى .....\nالإجابة: المكافح\n\nس2 (مستوى التطبيق): من معايير الخط الجميل: (أ) وضوح الحروف واستقامة السطر (ب) تداخل الكلمات (ج) السرعة فقط\nالإجابة: (أ) وضوح الحروف واستقامة السطر\n\nس3 (مستوى الاستدلال): كيف تكون مكافحًا في دراستك؟\nالإجابة: أجتهد في واجباتي ولا أيأس إذا أخطأت.", "- للطالب: أكمل الأسطر ص 45.\n- لولي الأمر: شجع ابنك على الكفاح والمثابرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=4"]}, {"k": "التعبير", "p": ["التعبير الكتابي (1): التخطيط لكتابة أحداث رحلة جبلية", "التعبير الكتابي (2): كتابة أحداث رحلة جبلية لأسرة عمانية"], "w": "الأسبوع الرابع", "f": ["1. يحدد عناصر قصة الرحلة من فقرة البداية والرسومات (10 دقائق)\n2. يرتب أحداث الرحلة في مخطط (15 دقيقة)\n3. يكتب أحداث رحلة جبلية مستعينًا بفقرة البداية والرسومات (5 دقائق)\n4. يستخدم الجمل الاسمية والتشبيه في وصفه (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يعتز بجمال الطبيعة الجبلية العمانية (15 دقيقة)\n- يراجع كتابته ويحسنها (20 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم التعاوني\n2. التعلم بالنمذجة\n3. التعلم المبني على المشاريع\n4. التعلم الذاتي\n5. التعلم المبني على اللعب", "1. الكتاب\n2. صورة توضيحية\n3. أخرى: مخطط القصة\n4. السبورة التقليدية\n5. الأقلام\n6. السبورة الذكية\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. السرد: رواية الأحداث بترتيب\n2. الأفلاج: قنوات ماء تقليدية عمانية تجري في البساتين\n3. الفقرة السردية: فقرة تحكي أحداثًا متتابعة\n4. المراجعة: قراءة الكتابة لتصحيحها وتحسينها", "يقرأ المعلم فقرة البداية ص 46 ويسأل: ما الذي يجذب السياح إلى جبال عمان؟ ويذكر التلميذ: الطبيعة والبساتين والأفلاج. (5 دقائق)", "1. أتأمل الرسومات: يعرض المعلم الرسومات المصاحبة ويطلب وصف كل مشهد، ويصف التلميذ المشاهد (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مخطط الرحلة: يوزع المعلم مخططًا: البداية، الأحداث، المشكلة، النهاية، ويملأ التلميذ المخطط مع زميله (14 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. مفردات الوصف: يجمع المعلم مع الطلاب كلمات وصف للطبيعة، والتلاميذ يدون الكلمات لاستخدامها (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الكتابة: يتابع المعلم الكتابة ويذكر بالتشبيه والجمل الاسمية، ويكتب التلميذ ثمانية أسطر على الأقل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. المراجعة الثنائية: يوزع المعلم قائمة مراجعة: الترتيب، الوصف، الإملاء، الترقيم، ويراجع التلميذ كتابة زميله ويحسن كتابته (12 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n6. غلق الدرس – حكاية متسلسلة: تكوّن كل مجموعة دائرة، ويضيف كل طالب جملة إلى حكاية رحلة أسرة عمانية إلى قرية جبلية مستخدمًا كلمات الترتيب (في البداية، ثم، بعد ذلك، وأخيرًا)، وتختم المجموعة حكايتها بجملة عن المحافظة على جمال الطبيعة العمانية واحترام أهل القرية، ثم تروي أجمل حكاية للصف (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الأفلاج: (أ) قنوات ماء تقليدية (ب) جبال عالية (ج) أشجار\nالإجابة: (أ) قنوات ماء تقليدية\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): نختم قصة الرحلة بنهاية وشعور.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): اكتب جملة وصف فيها تشبيه للجبال.\nالإجابة: مثل: بدت الجبال كحراس عمالقة يحيطون بالقرية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم حقيبة رحلة ويُخرج منها مع التلميذ الماء والطعام والمصباح، ويسأله عن سبب حمل كل غرض، ثم يوضح معنى «المغامرة» بموقف مشوق؛ وللتحقق يسأله: ماذا يحمل المغامرون في حقائبهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لرحلة إلى قرية جبلية في عُمان تتضمن الأدوات ووقت الانطلاق والمخاطر المتوقعة وطرق تجنبها، مستفيدين من نص «مغامرة إلى قرية الغمب».", "أسئلة التقو الخير والبشرى\n7. الإنشاد المعبر: أداء النشيد بصوت ونبرة تعبر عن معانيه\n8. الانتماء: الشعور بأن الإنسان جزء من وطنه", "يشغل المعلم النشيد مسجلًا ويسأل: من يخاطب الشاعر؟ ويجيب التلميذ: أبناء الوطن. (5 دقائق)", "1. الإنشاد النموذجي: ينشد المعلم النشيد ويعرف بالشاعر سعيد الصقلاوي، ويستمع التلميذ ويتابع (11 دقيقة)\nالاستراتيجيات: التلاوة والمحاكاة.\n\n2. القراءة والإنشاد الجماعي: يوجه المعلم الإنشاد الجماعي ثم الفردي، وينشد التلميذ مع زملائه (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. معاني الكلمات: يشرح المعلم معاني المفردات ص 82، ويكتب التلميذ المعاني ويستخدمها (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الحفظ بالتدرج: يقسم المعلم الأبيات ويحفظها بالتكرار والحذف التدريجي، ويحفظ التلميذ ويسمع لزميله (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. البيت الدال على الشوق: يطلب المعلم إنشاد البيت الدال على شوق الوطن لأبنائه، وينشد التلميذ: «بني وطني حبيبتكم تفجر شوقها وجدا» (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أوظف الكلمات: يوجه المعلم إلى نشاط ص 83، ويكتب التلميذ جملة بكلمة من النشيد (10 دقائق)\nالاستراتيجيات: التلاوة والمحاكاة.\n\n7. التسميع: يسمع المعلم للطلاب فرديًا ويسجل، ويسمّع التلميذ النشيد (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. شرح بيت: يطلب المعلم شرح بيت بأسلوب الطالب، ويشرح التلميذ بيتًا (7 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\n9. الإنشاد: ينظم المعلم إنشادًا بين المجموعات، وتنشد المجموعة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – إنشاد بني وطني: تنشد كل مجموعة مقطعًا من نشيد «بني وطني» للشاعر سعيد الصقلاوي، وتختار كلمة من كلماته الجديدة مثل «وهج» أو «الدنا» وتصوغ بها جملة عن عمان، ثم تقرؤها بفخر (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): معنى «وهج»: (أ) صوت (ب) ضياء ونور (ج) ظلام\nالإجابة: (ب) ضياء ونور\n\nس2 (مستوى التطبيق): البيت الدال على أن الأبناء سبب ازدهار الحضارة: (أ) «بكم تزهو حضارتنا وتشرق للدنا رشدا» (ب) «تناديكم وتدعوكم» (ج) «أحييكم بني وطني»\nالإجابة: (أ) «بكم تزهو حضارتنا وتشرق للدنا رشدا»\n\nس3 (مستوى الاستدلال): اشرح بأسلوبك: «بكم تزهو حضارتنا».\nالإجابة: أبناء الوطن هم سبب جمال حضارته وازدهارها.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ البيت الأول من نشيد «بني وطني» ويوضح كلمة «وهج» بمصباح يضيئه، ثم يطابق معه بطاقات الكلمات ومعانيها؛ وللتحقق يسأله: ما معنى «وهج»؟ ومن شاعر النشيد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوظيف كلمتي «الدنا» و«وهج» في جملتين من إنشائهم عن حب عُمان، ثم يحددون البيت الدال على شوق الوطن لأبنائه في نشيد «بني وطني» وينشدونه بأداء معبّر.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): معنى «الدنا»: جمع دنيا.\nالإجابة: صح\n\nس2 (مستوى التطبيق): معنى «تباشير المنى»: (أ) نهاية الأحلام (ب) بدايات تحقق الأماني (ج) الحزن\nالإجابة: (ب) بدايات تحقق الأماني\n\nس3 (مستوى الاستدلال): كيف تكون نجمًا يهدي في وطنك؟\nالإجابة: بالعلم والأخلاق والعمل لخدمة عمان.", "- للطالب: ردد النشيد مع التسجيل.\n- لولي الأمر: أنشد النشيد مع ابنك.\n- للطالب: احفظ الأبيات الخمسة الأولى.\n- لولي الأمر: سمّع لابنك ما حفظه.\n- للطالب: أنشد النشيد في الإذاعة المدرسية إن أمكن.\n- لولي الأمر: شجع ابنك على المشاركة في الإذاعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=5"]}]}, {"t": "بين رفوف مكتبتي: القراءة الحرة (المحور الأول)", "u": "المحور الأول: في ربوع وطني", "s": [{"k": "القراءة", "p": ["التعرف على المكتبة واختيار قصة للقراءة", "تسجيل بيانات القصة: الكلمات والشخصيات", "عرض القصة وإبداء الرأي ورسم مشهد منها"], "w": "الأسبوع الرابع – الأسبوع السابع – الأسبوع التاسع", "f": ["1. يتعرف أقسام مكتبة الصف أو مركز مصادر التعلم وطريقة الاستعارة (10 دقائق)\n2. يختار قصة مناسبة لمستواه (15 دقيقة)\n3. يسجل كلمات جديدة ومعانيها من قصته (20 دقيقة)\n4. يحدد شخصيات القصة وصفاتها (10 دقائق)\n5. يكتب ما تتحدث عنه القصة ويبدي رأيه فيها (10 دقائق)\n6. يرسم أحد مشاهد القصة ويعرضه على زملائه (10 دقائق)\n\nمخرج تعليمي آخر:\n- يلتزم آداب المكتبة (15 دقيقة)\n- يستخدم المعجم لمعرفة معنى كلمة (10 دقائق)\n- يتحدث عن قصته بثقة (20 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تحليل\nالمخرج 5: تقييم\nالمخرج 6: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تطبيق", "1. التعلم الذاتي\n2. السؤال والجواب\n3. التعلم التشاركي\n4. الحوار والمناقشة\n5. التعلم المبني على المشاريع\n6. التعلم المبني على اللعب", "1. الكتاب\n2. أخرى: مكتبة الصف\n3. أخرى: بطاقة الاستعارة\n4. أخرى: المعجم المدرسي\n5. الأقلام\n6. أخرى: أوراق رسم\n7. السبورة الذكية\n8. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. الاستعارة: أخذ الكتاب لمدة محددة ثم إعادته\n2. مركز مصادر التعلم: مكان في المدرسة يضم الكتب والمصادر\n3. المعجم: كتاب يشرح معاني الكلمات\n4. صفة الشخصية: ما تتميز به من أخلاق\n5. المشهد: جزء من القصة يحدث في مكان وزمن واحد\n6. الرأي: حكم الشخص مع تعليله", "يسأل المعلم: ما آخر قصة قرأتها؟ ويذكر التلميذ عنوانها. (5 دقائق)", "1. جولة في المكتبة: يعرف المعلم بأقسام المكتبة وطريقة الاستعارة، ويتجول التلميذ ويتعرف الأقسام (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n2. أختار قصتي: يرشد المعلم إلى معايير الاختيار، ويختار التلميذ قصة ويسجلها (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. أبدأ القراءة: يتيح المعلم وقتًا للقراءة الصامتة، ويبدأ التلميذ القراءة (10 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n4. إكمال القراءة: يتيح المعلم وقتًا لإكمال القصة، ويقرأ التلميذ (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n5. جدول الكلمات: يوجه المعلم إلى تسجيل الكلمات ومعانيها ص 84، ويسجل التلميذ (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. جدول الشخصيات: يوجه المعلم إلى تسجيل الشخصيات وصفاتها، ويسجل التلميذ (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. أكتب وأبدي رأيي: يوجه المعلم إلى سؤالي ص 85، ويكتب التلميذ موضوع القصة ورأيه (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. أرسم مشهدًا: يوزع المعلم أوراق الرسم، ويرسم التلميذ مشهدًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n9. المعرض: ينظم المعلم عرضًا للرسوم، ويعرض التلميذ رسمه ويتحدث عنه (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – ركن الكتاب العماني: يقترح كل زوج قصة أو كتابًا عن عمان يحب أن يُضاف إلى مكتبة الصف ويذكر سبب اختياره، ثم يضع الصف معًا قاعدة من آداب ا السبورة الذكية\n3. صورة توضيحية", "1. الفلاح: من يعمل في الزراعة\n2. البكور: الاستيقاظ في أول النهار", "يسأل المعلم: متى تستيقظ في أيام الإجازة؟ ومتى يستيقظ الفلاح؟ ويقارن التلميذ بين الوقتين. (5 دقائق)", "1. أصف الصورة: يعرض المعلم صورة ص 47 ويوجه الوصف، ويصف التلميذ المشهد بأربع جمل (6 دقائق)\nالاستراتيجيات: فكّر.\n\n2. صباح الفلاح وأهمية النوم: يناقش المعلم السؤالين الثاني والثالث، ويتحدث التلميذ عن صباح الفلاح وفوائد النوم المبكر (8 دقائق)\nالاستراتيجيات: زاوج.\n\n3. أكلة عمانية أحبها: ينظم المعلم حديثًا قصيرًا عن الأكلات العمانية، ويتحدث التلميذ عن أكلته المفضلة ويعلل (6 دقائق)\nالاستراتيجيات: شارك.\n\n4. غلق الدرس – يوم في حياة فلاح: يمثّل أفراد كل مجموعة يومًا في حياة الفلاح العماني: الاستيقاظ المبكر وسقي النخيل من الفلج وجني الرطب، ثم يذكر كل طالب أكلة عمانية يحبها ويصفها لزملائه بجملة (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): يبدأ الفلاح العماني صباحه: (أ) مبكرًا مع الفجر (ب) عند الظهر (ج) في المساء\nالإجابة: (أ) مبكرًا مع الفجر\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): النوم المبكر يساعد على الاستيقاظ بنشاط.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): لماذا يحتاج الإنسان إلى النوم؟\nالإجابة: ليريح جسمه ويستعيد نشاطه.\n\n• نشاط علاجي (لمن لم يتقن): يرتب المعلم مع التلميذ بطاقات مصورة ليوم الفلاح العماني: الاستيقاظ مع الفجر، العمل في المزرعة، النوم مبكرًا، ويربط النوم بالنشاط؛ وللتحقق يسأله: متى يبدأ الفلاح العماني صباحه؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة تصف أكلة عمانية يحبونها ومكوناتها، ثم يقارنون بين صباح الفلاح في نص «خبز ولبن» وصباحهم في يوم دراسي.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: من يعمل في الزراعة يسمى .....\nالإجابة: الفلاح\n\nس2 (مستوى التطبيق): من الأكلات العمانية: (أ) السوشي (ب) البيتزا (ج) العرسية\nالإجابة: (ج) العرسية\n\nس3 (مستوى الاستدلال): ما أكلتك العمانية المفضلة؟ ولماذا؟\nالإجابة: يذكر الطالب أكلة ويعلل.", "- للطالب: اسأل جدك أو جدتك عن صباحهم قديمًا.\n- لولي الأمر: حدث ابنك عن عادات الصباح العماني قديمًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي قيقة)\n- يفاضل بين العيش في القرية أو البلدة أو المدينة معللًا (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: فهم\nالمخرج 8: تطبيق\nالمخرج 9: فهم\nالمخرج 10: تذكر\nالمخرج 11: تذكر\nالمخرج 12: تطبيق\nالمخرج 13: فهم\nالمخرج 14: تحليل\nالمخرج 15: تحليل\nالمخرج 16: فهم\nالمخرج 17: تحليل\nالمخرج 18: إبداع\nالمخرج الآخر 1: تذكر\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم\nالمخرج الآخر 4: تطبيق\nالمخرج الآخر 5: تقييم\nالمخرج الآخر 6: تقييم\nالمخرج الآخر 7: تحليل\nالمخرج الآخر 8: تطبيق\nالمخرج الآخر 9: تقييم", "1. التنبؤ\n2. السؤال والجواب\n3. التعلم الذاتي\n4. التعلم بالنمذجة\n5. تعدد القراءات\n6. التعلم التعاوني\n7. تمثيل الأدوار\n8. تبادل البطاقات\n9. التعلم المبني على اللعب\n10. الرؤوس المرقمة\n11. التعلم بالاكتشاف\n12. فكّر، زاوج، شارك\n13. الحوار والمناقشة\n14. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الوسائل المتعددة (سمعية - بصرية)\n5. السبورة التقليدية\n6. أخرى: بطاقات المفردات\n7. الأقلام\n8. أخرى: بطاقات المراحل\n9. نماذج مجسمة\n10. أخرى: جدول المقارنة\n11. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. الزمان والمكان: متى وأين وقعت الأحداث\n2. القاص: كاتب القصص\n3. الجحال: أوان فخارية معلقة يحفظ فيها الماء\n4. القناديل: مصابيح تقليدية\n5. أم الفلج: النبع الذي تبدأ منه جداول الفلج\n6. الهاندة: إناء معدني ذو فوهة ضيقة لجلب الماء\n7. الطوبج: صفيحة غليظة يخبز عليها الخبز الرقيق\n8. منكسين: مقلوبين رأسًا على عقب\n9. ندية: رطبة باردة\n10. مشارف: أطراف المكان القريبة\n11. البيئة الزراعية: مكان فيه حقول ونخيل وأفلاج\n12. ترتيب الأعمال: ذكر الأعمال وفق حدوثها\n13. العجين: خليط الطحين والماء والملح\n14. الخبز الرقيق: خبز عماني تقليدي رقيق يخبز على الطوبج\n15. الأواني التقليدية: أدوات منزلية قديمة صنعت من الفخار والمعادن والسعف\n16. مضمون النص: ما يتحدث عنه النص من أفكار وأحداث\n17. المقارنة: بيان أوجه الشبه والاختلاف\n18. شبكة المياه: أنابيب توصل الماء إلى البيوت حديثًا\n19. البكور: الاستيقاظ والعمل في أول النهار\n20. البركة: الخير الكثير والزيادة", "يعرض المعلم صورة ص 49 ويسأل: ماذا تحمل المرأة؟ ويصف التلميذ ما تحمله. (5 دقائق)", "1. أتأمل الصورة: يطرح المعلم السؤال الأول ص 48، ويصف التلميذ ما تحمله المرأة (16 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n2. أتوقع الزمان والمكان: يطلب المعلم التوقع بعد تأمل الصورة، ويتوقع التلميذ: الصباح الباكر، قرية عمانية (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. العنوان والكاتب: يعرف المعلم بمحمود الرحبي القاص العماني من ولاية سمائل، ويكتب التلميذ العنوان والكاتب (11 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة النموذجية: يقرأ المعلم ص 49 قراءة معبرة، ويتابع التلميذ؛ ثم يقرأ المعلم ص 50، ويتابع التلميذ (19 دقيقة)\nالاستراتيجيات: تعدد القراءات، التعلم التعاوني.\n\n5. القراءة الجهرية: يوزع المعلم الفقرات ويقوم الأداء، ويقرأ التلميذ جهريًا (19 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أعمال سالمة: يطلب المعلم تتبع الأعمال الأولى، ويعدد التلميذ: دهن الرجلين بماء الورد، أطفأت القناديل، أشعلت البخور (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. القراءة المسترسلة: يطلب المعلم قراءة النص كاملًا، ويقرأ التلميذ (18 دقيقة)\nالاستراتيجيات: تمثيل الأدوار.\n\n8. أدوات سالمة: يعرض المعلم صور الهاندة والطوبج والدريجة، ويربط كل أداة باستعمالها (11 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n9. أختار المعنى: يناقش المعلم سؤال ص 52، ويختار التلميذ المعنى (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. المعنى ذاته: يوجه المعلم إلى سؤال ص 53، ويكتب التلميذ البدائل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. الأضداد: يوزع المعلم بطاقات المضاد، ويصل التلميذ الكلمة بمضادها (11 دقيقة)\nالاستراتيجيات: تبادل البطاقات.\n\n12. البيئة: يناقش المعلم السؤال الأول ص 51، ويختار التلميذ البيئة الزراعية ويعلل (11 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n13. جدول الأعمال: يوجه المعلم إلى جدول ص 51 لترتيب أعمال سالمة، ويرتب التلميذ الأعمال كما في المثال (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n14. تحقق جماعي: يقرأ المعلم الأعمال مرتبة ويصحح، ويصحح التلميذ جدوله (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n15. أستخرج المراحل: يوجه المعلم إلى الفقرة الخاصة بالخبز لاستخراج المراحل، ويكتب التلميذ المراحل في الكتاب ص 52 (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n16. لعبة ترتيب البطاقات: يوزع المعلم بطاقات المراحل مبعثرة، ويرتب التلميذ البطاقات في مجموعته (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n17. أشرح للضيف: يطلب المعلم شرح طريقة صنع الخبز لضيف بأسلوب الطالب، ويشرح التلميذ بجمل مرتبة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n18. الأدوات العمانية: يوجه المعلم إلى السؤال الأول ص 53 بالاستعانة بالصور، ويذكر التلميذ الأدوات وطريقة استعمالها (16 دقيقة)\nالاستراتيجيات: فكّر.\n\n19. العنوان والمضمون: يناقش المعلم علاقة «خبز ولبن» بالنص، ويوضح التلميذ العلاقة (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n20. دور المرأة: يستخدم المعلم «فكر، زاوج، شارك»، ويوضح التلميذ دور المرأة العمانية (11 دقيقة)\nالاستراتيجيات: شارك.\n\n21. قديمًا وحديثًا: يرسم المعلم جدول مقارنة لتوصيل المياه، ويملأ التلميذ الجدول (16 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n22. مشهد الصباح: يطلب المعلم قراءة الفقرة الأخيرة الواصفة للبيت، ويقرأ التلميذ الفقرة (11 دقيقة)\nالاستراتيجيات: فكّر.\n\n23. صباح بلدتي: يطلب المعلم التحدث عن تفاصيل الصباح في بلدة الطالب، ويتحدث التلميذ عن صباح بلدته (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n24. الحديث والنص: يوجه المعلم إلى استخراج ما يمثل الحديث من النص، ويستخرج التلميذ نهوض سالمة مع الفجر (12 دقيقة)\nالاستراتيجيات: فكّر.\n\n25. عنوان آخر: ينظم المعلم عصفًا ذهنيًا للعناوين، ويقترح التلميذ عنوانًا (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n26. أفضل العيش في: يدير المعلم حوارًا: القرية أم البلدة أم المدينة؟، ويختار التلميذ ويعلل (11 دقيقة)\nالاستراتيجيات: شارك.\n\n27. غلق الدرس – سوق الأدوات العمانية: يعرض المعلم صور الأدوات والأطعمة العمانية التي وردت في النص كالهاندة والطوبج والجحلة والخبز الرقيق، وتتسابق المجموعات في تسمية كل صورة وقراءة الجملة التي ذكرتها من النص قراءة جهرية سليمة، ثم يذكر كل طالب عملًا يساعد به أمه صباحًا كما تفعل الأسرة العمانية المتعاونة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كاتب نص «خبز ولبن»: (أ) خالد العنقودي (ب) زكريا تامر (ج) محمود الرحبي\nالإجابة: (ج) محمود الرحبي\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): جلبت سالمة الماء قبل أن تعد الخبز.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): اقترح عنوانًا آخر للنص.\nالإجابة: مثل: «صباح سالمة» أو «بيت على الفلج».\n\n• نشاط علاجي (لمن لم يتقن): يرتب المعلم مع التلميذ بطاقات مصورة ليوم الفلاح العماني: الاستيقاظ مع الفجر، العمل في المزرعة، النوم مبكرًا، ويربط النوم بالنشاط؛ وللتحقق يسأله: متى يبدأ الفلاح العماني صباحه؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة تصف أكلة عمانية يحبونها ومكوناتها، ثم يقارنون بين صباح الفلاح في نص «خبز ولبن» وصباحهم في يوم دراسي.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: كاتب القصص يسمى .....\nالإجابة: القاص\n\nس2 (مستوى التطبيق): ما دل على البيئة الزراعية: (أ) السفن (ب) الرمال (ج) الحقول والنخيل والسواقي\nالإجابة: (ج) الحقول والنخيل والسواقي\n\nس3 (مستوى الاستدلال): أين تفضل العيش: القرية أم المدينة؟ علل.\nالإجابة: يجيب الطالب برأيه معللًا.", "- للطالب: اقرأ النص ص 49–50 قراءة صامتة.\n- لولي الأمر: حدث ابنك عن الخبز العماني الرقيق.\n- للطالب: درب نفسك على قراءة ص 49.\n- لولي الأمر: استمع لقراءة ابنك.\n- للطالب: اقرأ النص كاملًا لأسرتك.\n- لولي الأمر: أطلع ابنك على أدوات عمانية قديمة في البيت أو المتحف.\n- للطالب: اكتب خمس كلمات جديدة ومعانيها.\n- لولي الأمر: اسأل ابنك عن معنى «منكسين».\n- للطالب: أكمل جدول أعمال سالمة ص 51.\n- لولي الأمر: شارك ابنك في عمل منزلي صباحي.\n- للطالب: اكتب مراحل صنع الخبز في دفترك.\n- لولي الأمر: اصنع مع ابنك خبزًا في البيت إن أمكن.\n- للطالب: اسأل أسرتك عن أداة عمانية قديمة واكتب استعمالها.\n- لولي الأمر: أطلع ابنك على الأواني العمانية القديمة.\n- للطالب: اكتب فقرة قصيرة عن صباح بلدتك.\n- لولي الأمر: حدث ابنك عن تغير الحياة بين الماضي والحاضر.\n- للطالب: نم مبكرًا لتستيقظ مبكرًا.\n- لولي الأمر: عود ابنك على البكور.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=7"]}, {"k": "الأنماط اللغوية", "p": ["الأنماط اللغوية (1): تاء الفاعل", "الأنماط اللغوية (2): نا الفاعلين ونون النسوة", "الأنماط اللغوية (3): تطبيقات ضمائر الرفع المتصلة", "أدوات الربط: الواو والفاء وثم", "تقويم الدرس الثاني ومراجعته"], "w": "الأسبوع الخامس – الأسبوع السادس", "f": ["1. يتعرف تاء الفاعل ضميرًا متصلًا بالفعل (15 دقيقة)\n2. يفصل بين الفعل وتاء الفاعل المتصلة به (10 دقائق)\n3. يتعرف «نا الفاعلين» و«نون النسوة» ضمائر رفع متصلة (15 دقيقة)\n4. يصل الضمير المنفصل بالفعل المناسب المتصل بضمير الرفع (10 دقائق)\n5. يكمل الفراغ بضمير الرفع المتصل المناسب (15 دقيقة)\n6. يحدد الأفعال المنتهية بضمير رفع متصل في آيات وأحاديث (10 دقائق)\n7. يضع أداة الربط المناسبة (و، ف، ثم) مكان الفواصل (15 دقيقة)\n8. يفرق بين دلالة الواو والفاء وثم (10 دقائق)\n9. يجيب عن أسئلة شاملة لدرس «خبز ولبن» (5 دقائق)\n10. يوظف ضمائر الرفع المتصلة والهمزة المتوسطة في جمل صحيحة (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يميز حركات تاء الفاعل (تُ، تَ، تِ) (15 دقيقة)\n- يكتب الفعل «أسفر» متصلًا بالضمير المناسب أسفل الصورة (15 دقيقة)\n- يوظف الضمائر في فقرة قصيرة (15 دقيقة)\n- يوظف أدوات الربط في جمل من إنشائه (15 دقيقة)\n- يحدد ما أتقنه وما يحتاج إلى تدريب في الدرس (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\nالمخرج 7: تطبيق\nالمخرج 8: تحليل\nالمخرج 9: تطبيق\nالمخرج 10: تطبيق\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: إبداع\nالمخرج الآخر 4: تطبيق\nالمخرج الآخر 5: تقييم", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي\n6. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الأفعال\n4. السبورة التقليدية\n5. صورة توضيحية\n6. الأقلام\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n8. أخرى: بطاقات أدوات الربط\n9. أخرى: ورقة عمل شاملة", "1. تاء الفاعل: ضمير متصل يدل على من قام بالفعل مثل: انطلقتُ\n2. الضمير المتصل: ضمير لا يستقل بنفسه بل يتصل بغيره\n3. نا الفاعلين: ضمير متصل يدل على المتكلمين مثل: مررنا\n4. نون النسوة: ضمير متصل يدل على جماعة الإناث مثل: يملأن\n5. ضمائر الرفع المتصلة: تاء الفاعل، ونا الفاعلين، ونون النسوة وغيرها\n6. تغيير ما يلزم: تعديل الفعل ليناسب الضمير\n7. الواو: أداة ربط تفيد الجمع والمشاركة\n8. الفاء: أداة ربط تفيد الترتيب مع السرعة\n9. ثم: أداة ربط تفيد الترتيب مع مهلة\n10. ورقة العمل الشاملة: أسئلة تجمع مهارات الدرس كلها\n11. العرسية: وجبة عمانية تقليدية تقدم في المناسبات", "يقول المعلم: «انطلقتُ إلى الفلج» ويسأل: من الذي انطلق؟ ويجيب التلميذ: المتكلم. (5 دقائق)", "1. أقرأ وألاحظ: يقرأ المعلم فقرة ص 55 ويلون الأفعال المتصلة بالضمائر، ويحدد التلميذ الأفعال الملونة (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أفصل الفعل عن الضمير: يوجه المعلم إلى الجدول ص 55 كما في المثال، ويفصل التلميذ: انطلق + تُ (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حركات التاء: يوضح المعلم: قرأتُ للمتكلم، قرأتَ للمخاطب، قرأتِ للمخاطبة، ويمثل التلميذ لكل حركة (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أكتشف الضميرين: يعرض المعلم أفعال الفقرة: مررنا، استمتعنا، يملأن، حافظنا، ويصنف التلميذ الضمائر (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أصل الضمير بالفعل: يوجه المعلم إلى نشاط ص 56، ويصل التلميذ الضمير بالفعل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أكتب أسفل الصورة: يوجه المعلم إلى نشاط الفعل «أسفر» مع الصور، ويكتب التلميذ الفعل متصلًا بالضمير المناسب (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. أكمل الفراغ: يوجه المعلم إلى فقرة المغامرة ص 57، ويكمل التلميذ بالضمير المناسب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. الآيات والأحاديث: يوجه المعلم إلى وضع دائرة حول الأفعال المنتهية بضمير، ويحدد التلميذ: فرغت، أنزلنا، زرتم، بعثت (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n9. فقرة قصيرة: يطلب المعلم فقرة من ثلاث جمل بضمائر مختلفة، ويكتب التلميذ الفقرة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n10. دلالات الأدوات: يمثل المعلم لكل أداة ويناقش الفرق، ويفرق التلميذ بين الأدوات بأمثلة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. أكمل الفقرة: يوجه المعلم إلى فقرة «خبز ولبن» ص 63، ويضع التلميذ الأداة المناسبة مكان الفواصل (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. أوظف الأدوات: يطلب المعلم ثلاث جمل بالأدوات، ويكتب التلميذ الجمل (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n13. ورقة عمل شاملة: يوزع المعلم ورقة تجمع: فهم النص، وتاء الفاعل ونا الفاعلين ونون النسوة، والهمزة المتوسطة، وأدوات الربط، ويحل التلميذ الورقة فرديًا (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n14. التصحيح التعاوني: يصحح المعلم مع الطلاب ويعالج الأخطاء الشائعة، ويصحح التلميذ ويناقش سبب الخطأ (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n15. بطاقة الإتقان: يوزع المعلم بطاقة: أتقنت / أحتاج تدريبًا، ويحدد التلميذ مستواه في كل مهارة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n16. غلق الدرس – مكعب الضمائر: ترمي كل مجموعة مكعبًا على أوجهه: تاء الفاعل، نا الفاعلين، نون النسوة، الواو، الفاء، ثم، فتسند فعلًا من حياة القرية العمانية كسقى أو جنى أو خبز إلى الضمير الظاهر، أو تربط به جملتين عن صباح الفلاح، ولكل جملة صحيحة نقطة، ثم تقرأ المجموعة الفائزة جملتها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الضمير المتصل في «انطلقتُ»: (أ) نون النسوة (ب) تاء الفاعل (ج) نا الفاعلين\nالإجابة: (ب) تاء الفاعل\n\nس2 (مستوى التطبيق): أكمل: قال تعالى: «وأنزل.... من المعصرات ماء ثجاجا».\nالإجابة: نا\n\nس3 (مستوى الاستدلال): ما الفرق بين الفاء وثم؟\nالإجابة: الفاء للترتيب مع السرعة، وثم للترتيب مع مهلة.\n\n• نشاط علاجي (لمن لم يتقن): يرتب المعلم مع التلميذ بطاقات مصورة ليوم الفلاح العماني: الاستيقاظ مع الفجر، العمل في المزرعة، النوم مبكرًا، ويربط النوم بالنشاط؛ وللتحقق يسأله: متى يبدأ الفلاح العماني صباحه؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة تصف أكلة عمانية يحبونها ومكوناتها، ثم يقارنون بين صباح الفلاح في نص «خبز ولبن» وصباحهم في يوم دراسي.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): في «قرأتُ» تاء مضمومة تدل على المتكلم.\nالإجابة: صح\n\nس2 (مستوى التطبيق): الأداة المناسبة: «سقط المطر ... جرى الوادي»: (أ) فـ (ب) ثم (ج) أو\nالإجابة: (أ) فـ\n\nس3 (مستوى الاستدلال): اكتب جملة فيها فعل متصل بتاء الفاعل وكلمة بها همزة متوسطة.\nالإجابة: مثل: سألتُ جدي عن الفلج.", "- للطالب: اكتب خمسة أفعال متصلة بتاء الفاعل.\n- لولي الأمر: حاور ابنك بأفعال متصلة بتاء الفاعل.\n- للطالب: اكتب ثلاث جمل لكل ضمير.\n- لولي الأمر: اطلب من ابنك وصف ما فعلته أسرته بأفعال متصلة بـ«نا».\n- للطالب: أكمل تدريبات ص 57.\n- لولي الأمر: تابع ابنك في إسناد الأفعال.\n- للطالب: اكتب خمس جمل بأدوات الربط.\n- لولي الأمر: اطلب من ابنك رواية يومه بأدوات الربط.\n- للطالب: راجع درس «خبز ولبن» ص 47–64.\n- لولي الأمر: اطلع على بطاقة إتقان ابنك وساعده في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=7"]}, {"k": "الإملاء", "p": ["الإملاء (1): الهمزة المتوسطة على الألف", "الإملاء (2): الهمزة المتوسطة على النبرة", "الإملاء (3): تدريبات على الهمزة المتوسطة", "الإملاء الاختباري: الهمزة المتوسطة على الألف والنبرة"], "w": "الأسبوع السادس", "f": ["1. يتعرف الهمزة المتوسطة المكتوبة على ألف (5 دقائق)\n2. يستنتج قاعدة كتابتها (الفتحة أقوى الحركتين) (10 دقائق)\n3. يتعرف الهمزة المتوسطة المكتوبة على نبرة (15 دقيقة)\n4. يميز الهمزة المتوسطة على ألف من التي على نبرة في آيات وأحاديث (10 دقائق)\n5. يستخرج كلمة بها همزة متوسطة من النص ويوظفها في جملة (10 دقائق)\n6. يكمل الفراغات بكلمات بها همزة متوسطة (15 دقيقة)\n7. يكتب فقرة تملى عليه مراعيًا الهمزة المتوسطة (10 دقائق)\n8. يعيد كتابة الفقرة سليمة من الأخطاء (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يستخرج كلمات بها همزة متوسطة من فقرة (25 دقيقة)\n- يكتب أسماء أشياء في صور مراعيًا الهمزة المتوسطة (15 دقيقة)\n- يعلل كتابة الهمزة بحسب الحركة الأقوى (15 دقيقة)\n- يحدد أخطاءه ويعللها (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تحليل\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج 7: تطبيق\nالمخرج 8: تقييم\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل\nالمخرج الآخر 4: تحليل", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي\n6. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات\n4. السبورة التقليدية\n5. صورة توضيحية\n6. الأقلام", "1. الهمزة المتوسطة: همزة تقع في وسط الكلمة\n2. الحركة الأقوى: الكسرة ثم الضمة ثم الفتحة ثم السكون\n3. الهمزة على النبرة: تكتب إذا كانت مكسورة أو ما قبلها مكسور\n4. النبرة: سن صغيرة تكتب عليها الهمزة\n5. التعليل: ذكر سبب الكتابة بهذه الصورة\n6. الأسئلة: كلمة بها همزة متوسطة على نبرة\n7. الإملاء الاختباري: إملاء لقياس الإتقان\n8. التصويب الذاتي: تصحيح الطالب أخطاءه بنفسه", "يكتب المعلم: سأل، رأس، يأكل ويسأل: أين الهمزة؟ ويحدد التلميذ أنها في الوسط على ألف. (5 دقائق)", "1. أقرأ وأكتشف: يقرأ المعلم فقرة ص 58 ويوجه إلى وضع دائرة حول الكلمات، ويستخرج التلميذ: فجأة، شفاه... الأفئدة (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أستنتج القاعدة: يحلل المعلم حركة الهمزة وما قبلها: سَأَل (فتحة وفتحة)، رأْس (سكون وفتحة)، ويستنتج التلميذ أن الفتحة أقوى من السكون (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تدريب: يعرض كلمات للتصنيف، ويصنف التلميذ الكلمات (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أكتشف القاعدة: يحلل المعلم: بِئْر (كسر ما قبلها)، سُئِل (الهمزة مكسورة)، ويستنتج التلميذ أن الكسرة أقوى (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الآيات والأحاديث: يوجه المعلم إلى نشاط ص 58–59، ويضع التلميذ خطًا تحت التي على ألف ودائرة حول التي على نبرة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. أسماء الصور: يوجه المعلم إلى نشاط الصور ص 59، ويكتب التلميذ الأسماء: بئر، ذئب، فأس، رأس (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. من النص: يوجه المعلم إلى استخراج كلمة من الفقرة الأولى لنص «خبز ولبن»، ويستخرج كلمة ويوظفها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أكمل الفراغات: يوجه المعلم إلى تدريب ص 60، ويكمل التلميذ: أسئلة، الدقائق، أطفأت (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n9. تصحيح وتعليل: يعرض المعلم الحلول، ويصحح التلميذ ويعلل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. قراءة الفقرة: يقرأ المعلم الفقرة الإملائية، ويستمع التلميذ (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n11. الإملاء: يملي المعلم جملة جملة، ويكتب التلميذ في الكتاب ص 61 (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n12. التصويب: يعرض المعلم الفقرة صحيحة، ويصحح التلميذ ويعيد الكتابة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n13. غلق الدرس – على الألف أم على النبرة؟: يضع المعلم سلتين كتب عليهما «أ» يعللها (8 دقائق)\nالاستراتيجيات: زاوج.\n\n3. أماكن أحب زيارتها والنشيد: يسأل المعلم عن مكان يحب الطالب زيارته، ثم يرددون النشيد الوطني، ويذكر التلميذ مكانًا ويعلل، ويردد النشيد (6 دقائق)\nالاستراتيجيات: شارك.\n\n4. غلق الدرس – ما يميز بلادي: تتسابق المجموعات في ذكر ما يميز عمان كالأفلاج والقلاع واللبان وكرم أهلها، وكل إجابة صحيحة تضيف نقطة، ثم تردد المجموعات النشيد الوطني معًا بفخر واعتزاز (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من مميزات عُمان: (أ) بعدها عن البحر (ب) قلة سكانها فقط (ج) تنوع طبيعتها وعراقة تاريخها\nالإجابة: (ج) تنوع طبيعتها وعراقة تاريخها\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): نقف باحترام عند سماع النشيد الوطني.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): ما المكان الذي تحب زيارته في عمان؟ ولماذا؟\nالإجابة: يذكر الطالب مكانًا ويعلل.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا من عُمان (جبال، شواطئ، قلاع، صحراء) ويسمي معه التلميذ ميزة كل صورة بجملة فصيحة قصيرة؛ وللتحقق يسأله: اذكر ميزة من مميزات عُمان.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة سياحية لمكان يحبونه في عُمان تتضمن وصفه وسبب زيارته، ثم يستنتجون غرض الشاعرة فوزية البادية من قصيدة «بلادي عُمان».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: الأرض التي ولد فيها الإنسان وينتمي إليها تسمى .....\nالإجابة: الوطن\n\nس2 (مستوى التطبيق): من المعالم العمانية: (أ) برج إيفل (ب) قلعة نزوى (ج) الأهرامات\nالإجابة: (ب) قلعة نزوى\n\nس3 (مستوى الاستدلال): كيف تعبر عن حبك لعمان في المدرسة؟\nالإجابة: أحافظ على مدرستي وأحترم النظام وأجتهد في دراستي.", "- للطالب: حدث أسرتك عن ثلاثة أماكن تحب زيارتها في عمان.\n- لولي الأمر: زر مع ابنك معلمًا عمانيًا قريبًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=8"]}, {"k": "القراءة", "p": ["أتصفح: التوقع من الصورة والعنوان والتعريف بالشاعرة", "القراءة النموذجية والجهرية للقصيدة", "الإلقاء المعبر وفهم الأبيات إجمالًا", "المفردات: معاني الكلمات واختيار المعنى الصحيح", "المستوى الأول: أوصاف عمان في القصيدة", "المستوى الثاني: ما غر . التعلم الذاتي\n4. التعلم بالنمذجة\n5. تعدد القراءات\n6. التعلم التعاوني\n7. المسابقات التنافسية\n8. تبادل البطاقات\n9. التعلم المبني على اللعب\n10. الرؤوس المرقمة\n11. فكّر، زاوج، شارك\n12. الحوار والمناقشة\n13. التعلم بالاكتشاف\n14. التعلم المبني على المشاريع\n15. التعلم التشاركي", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الوسائل المتعددة (سمعية - بصرية)\n5. السبورة التقليدية\n6. أخرى: بطاقات الأبيات\n7. أخرى: بطاقات المعاني\n8. الأقلام\n9. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n10. أخرى: خريطة عمان\n11. أخرى: أوراق رسم وألوان", "1. القصيدة: نص شعري موزون مقفى\n2. الشاعرة: امرأة تكتب الشعر\n3. صدر البيت: الشطر الأول من البيت\n4. عجز البيت: الشطر الثاني من البيت\n5. الإلقاء: قراءة الشعر بصوت ونبرة تعبر عن معانيه\n6. الفكرة العامة: المعنى الذي تدور حوله القصيدة كلها\n7. سادوا: سيطروا\n8. ذرى: قمم\n9. الفرقد: نجم في السماء\n10. مكين: ثابت راسخ\n11. شموس الهدى: منارات الخير والرشاد\n12. ألفاظ الطبيعة: كلمات تدل على مظاهر الأرض كالجبال والسهول\n13. الغرس: زرع القيم في النفوس\n14. الانتماء: شعور الإنسان بأنه جزء من وطنه\n15. التضاريس: مظاهر سطح الأرض من جبال وسهول ورمال وأودية\n16. الخريطة: رسم يوضح مواقع الأماكن\n17. التعبير الفني: التعبير بالرسم أو النشيد أو الخط\n18. التعليل: ذكر سبب الاختيار", "يكتب المعلم عنوان «بلادي عمان» ويسأل: ماذا تتوقع أن تقول الشاعرة؟ ويتوقع التلميذ. (5 دقائق)", "1. أتوقع الموضوع: يطرح المعلم السؤال الأول ص 66 ويطلب اختيار التوقع، ويختار التلميذ ويعلل (16 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n2. أتوقع غرض الشاعرة: يناقش المعلم الخيارات: تفتخر ببلادها، تصف بلادها، ويختار التلميذ ويعلل (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الشاعرة: يعرف المعلم بالشاعرة فوزية البادية، ويكتب التلميذ اسم الشاعرة (11 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة النموذجية: يلقي المعلم القصيدة إلقاءً معبرًا ضابطًا أواخر الكلمات، ويستمع التلميذ ويتابع (11 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n5. القراءة الجهرية: يطلب المعلم قراءة فردية بيتًا بيتًا، ويقرأ التلميذ مراعيًا الإيقاع (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أحدد الأبيات: يسأل المعلم: أي بيت يتحدث عن الأجداد؟ وأيها عن السلطان قابوس؟، ويحدد التلميذ البيتين (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. تدريب: يتابع المعلم تدريب كل مجموعة على إلقاء بيتها، ويتدرب التلميذ على الإلقاء (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. الإلقاء: تلقي المجموعات الأبيات بالترتيب ويقيم الصف، ويلقي التلميذ ويقيم (12 دقيقة)\nالاستراتيجيات: المسابقات التنافسية.\n\n9. الفكرة العامة: يسأل المعلم: عم تتحدث القصيدة كلها؟، ويصوغ التلميذ الفكرة العامة (9 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n10. أختار المعنى: يناقش المعلم سؤالي ص 68–69، ويختار التلميذ: سيطروا، قممًا (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. المعنى ذاته: يوجه المعلم إلى سؤال «أكتب كلمة أو عبارة» ص 69، ويكتب التلميذ البدائل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الوصل: يوجه المعلم إلى نشاط الوصل ص 69، ويصل التلميذ الكلمة بمعناها (11 دقيقة)\nالاستراتيجيات: تبادل البطاقات.\n\n13. أوصاف عمان: يوزع المعلم أسئلة ص 68 على الرؤوس المرقمة، ويجيب التلميذ ويقرأ البيت الدال (16 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n14. أقرأ ما يدل: يطلب المعلم قراءة ما يدل على: أهل عمان سادة البحار، الحب الكبير للوطن، ويقرأ التلميذ البيتين (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n15. ألفاظ الطبيعة: يوجه المعلم إلى استخراج ألفاظ الطبيعة من الأبيات، ويستخرج التلميذ: جبال، سهول، ذرى، رمل (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n16. ما الذي غرسه؟: يناقش المعلم السؤال الأول ص 70، ويوضح التلميذ: حب عمان بجبالها وسهولها (12 دقيقة)\nالاستراتيجيات: زاوج.\n\n17. أعبر بأسلوبي: يوجه المعلم إلى التعبير عن «وحبي لها في الفؤاد مكين... وحبي لها قبل أن أولدا»، ويكتب التلميذ المعنى بأسلوبه (11 دقيقة)\nالاستراتيجيات: شارك.\n\n18. الانتماء للبيئة: يطلب المعلم أمثلة على انتماء العماني لبيئته، ويذكر التلميذ أمثلة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n19. ما افتخرت به الشاعرة: يناقش المعلم السؤال الأول ص 70، ويذكر التلميذ: أمجاد الأجداد في البحار، وحب الوطن (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n20. التضاريس على الخريطة: يوجه المجموعات إلى تحديد الجبال والسهول والرمال والأودية على خريطة ص 71، وتحدد المجموعة المواقع وتذكر فائدة لكل تضريس (19 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n21. أوظف الكلمات: يوجه المعلم إلى نشاط ص 71، ويكتب التلميذ جملتين (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n22. البيت المعجب: يطلب المعلم إلقاء البيت المعجب وتعليل الاختيار، ويلقي التلميذ ويعلل (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n23. أعبر عن حبي لوطني: يتيح المعلم الاختيار: رسم، نشيد، فقرة، عبارة بخط مزخرف، وينفذ التلميذ تعبيره (19 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n24. المعرض: يعرض المعلم أعمال الطلاب، ويشرح التلميذ عمله (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n25. غلق الدرس – ألقي بيتي: تختار كل مجموعة بيتًا من قصيدة «بلادي عمان» وتلقيه إلقاء معبرًا، ويخمن الآخرون الشعور الذي يعبر عنه البيت من فخر أو حب، ثم تذكر المجموعة وصفًا لعمان من القصيدة، ويختم الصف بترديد البيت الأول معًا بفخر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كاتبة النص: (أ) سعيد الصقلاوي (ب) محمود الرحبي (ج) فوزية بنت عبدالله البادية\nالإجابة: (ج) فوزية بنت عبدالله البادية\n\nس2 (مستوى التطبيق): أكمل: جاء السلطان قابوس - طيب الله ثراه - بفجر .....\nالإجابة: جديد\n\nس3 (مستوى الاستدلال): لماذا أعجبك البيت الذي اخترته؟\nالإجابة: يعلل الطالب بمعنى البيت أو جمال تعبيره.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا من عُمان (جبال، شواطئ، قلاع، صحراء) ويسمي معه التلميذ ميزة كل صورة بجملة فصيحة قصيرة؛ وللتحقق يسأله: اذكر ميزة من مميزات عُمان.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة سياحية لمكان يحبونه في عُمان تتضمن وصفه وسبب زيارته، ثم يستنتجون غرض الشاعرة فوزية البادية من قصيدة «بلادي عُمان».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: النص الموزون المقفى يسمى .....\nالإجابة: قصيدة\n\nس2 (مستوى التطبيق): البيت الدال على أن أهل عمان سادة البحار يبدأ بـ: (أ) جدودي (ب) بلادي (ج) وقابوس\nالإجابة: (أ) جدودي\n\nس3 (مستوى الاستدلال): اكتب عبارة قصيرة تعبر عن حبك لعمان.\nالإجابة: مثل: عمان في قلبي دائمًا.", "- للطالب: اقرأ القصيدة ص 67 قراءة صامتة.\n- لولي الأمر: استمع مع ابنك إلى قصيدة وطنية.\n- للطالب: درب نفسك على إلقاء القصيدة.\n- لولي الأمر: استمع لإلقاء ابنك.\n- للطالب: ألق القصيدة أمام أسرتك.\n- لولي الأمر: شجع ابنك على الإلقاء.\n- للطالب: اكتب معاني مفردات القصيدة.\n- لولي الأمر: اسأل ابنك عن معنى «ذرى».\n- للطالب: أجب عن أسئلة المستوى الأول ص 68.\n- لولي الأمر: تابع إجابات ابنك.\n- للطالب: اكتب بأسلوبك معنى بيتين من القصيدة.\n- لولي الأمر: حدث ابنك عن منجزات النهضة العمانية.\n- للطالب: ارسم خريطة مبسطة لعمان وحدد عليها ولايتك.\n- لولي الأمر: ساعد ابنك في تحديد التضاريس على الخريطة.\n- للطالب: أكمل عملك الفني عن حب الوطن.\n- لولي الأمر: شارك ابنك في عمل فني عن الوطن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=8"]}, {"k": "الأنماط اللغوية", "p": ["الأنماط اللغوية (1): أسماء الإشارة للبعيد", "الأنماط اللغوية (2): الوصل وإكمال الفراغات بأسماء الإشارة", "الأنماط اللغوية (3): وصف الصور بأسماء الإشارة للبعيد"], "w": "الأسبوع الثامن", "f": ["1. يتعرف أسماء الإشارة للبعيد: ذلك، تلك، أولئك (10 دقائق)\n2. يبين ما تدل عليه الكلمات الملونة من حيث القرب والبعد (20 دقيقة)\n3. يصل اسم الإشارة بما يدل عليه (10 دقائق)\n4. يكمل الفراغات باسم الإشارة المناسب (15 دقيقة)\n5. يكتب اسم الإشارة المناسب أسفل الصور (10 دقائق)\n6. يصوغ فقرة يصف فيها صورة موظفًا أسماء الإشارة للبعيد (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يقدّر الأرض الزراعية وتراث الأجداد (10 دقائق)\n- يطابق اسم الإشارة مع المشار إليه في النوع والعدد (15 دقيقة)\n- يقرأ فقرته أمام زملائه بثقة (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تحليل\nالمخرج الآخر 3: تطبيق", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي\n6. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. السبورة التقليدية\n5. أخرى: بطاقات الإشارة\n6. الأقلام\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. ذلك: اسم إشارة للمفرد المذكر البعيد\n2. تلك: اسم إشارة للمفردة المؤنثة البعيدة\n3. أولئك: اسم إشارة للجمع البعيد\n4. المشار إليه: الاسم الذي نشير إليه\n5. المطابقة: موافقة اسم الإشارة للمشار إليه نوعًا وعددًا\n6. الفقرة الوصفية: فقرة تصف مكانًا أو صورة بتفاصيلها\n7. التوظيف: استعمال القاعدة في كتابة جديدة", "يشير المعلم إلى قلم قريب: «هذا قلم» ثم إلى بعيد: «ذلك قلم» ويسأل عن الفرق، ويلاحظ التلميذ القرب والبعد. (5 دقائق)", "1. أقرأ وألاحظ: يقرأ المعلم فقرة ص 73: «يا مروان، تأمل أولئك الفلاحين...»، ويحدد التلميذ الكلمات الملونة (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. القرب والبعد: يوجه المعلم إلى وضع الكلمات في المشهد ص 73، ويصنف التلميذ أسماء الإشارة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستنتج: يقود المعلم إلى قاعدة: ذلك للمذكر، تلك للمؤنث، أولئك للجمع البعيد، ويصوغ التلميذ القاعدة ويمثل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أصل بخط: يوجه المعلم إلى نشاط الوصل ص 74، ويصل التلميذ اسم الإشارة بما يدل عليه (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أكمل الفراغات: يقرأ المعلم فقرة الوطن والصيادين ص 74، ويكمل التلميذ بـ: أولئك، ذلك، تلك (16 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n6. المطابقة: يعرض المعلم جملًا خاطئة في المطابقة، ويصحح التلميذ ويعلل (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أكتب أسفل الصور: يوجه المعلم إلى نشاط ص 75، ويكتب التلميذ اسم الإشارة المناسب (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. أصوغ فقرة: يطلب المعلم فقرة من أربع جمل تصف الصورة، ويكتب التلميذ الفقرة موظفًا ذلك وتلك وأولئك (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. أقرأ فقرتي: يستمع المعلم لفقرات مختارة، ويقرأ التلميذ فقرته (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. غلق الدرس – ذلك من معالم بلادي: يعلق المعلم صورًا لمعالم عمانية ومناظرها على الجدار البعيد، ويشير طالب من كل مجموعة إلى صورة ويقول جملة باسم الإشارة المناسب للبعيد (ذلك، تلك، أولئك)، ولكل جملة صحيحة نقطة، ثم يذكر الصف ما يحبه في ذلك المعلم (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اسم الإشارة للمفرد المذكر البعيد: (أ) هذا (ب) ذلك (ج) تلك\nالإجابة: (ب) ذلك\n\nس2 (مستوى التطبيق): أكمل: وانظر إلى .... الشاطئ الجميل.\nالإجابة: ذلك\n\nس3 (مستوى الاستدلال): اكتب جملتين تصف بهما صورة بأسماء الإشارة للبعيد.\nالإجابة: مثل: تلك قلعة تاريخية. أولئك سياح يزورونها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا من عُمان (جبال، شواطئ، قلاع، صحراء) ويسمي معه التلميذ ميزة كل صورة بجملة فصيحة قصيرة؛ وللتحقق يسأله: اذكر ميزة من مميزات عُمان.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة سياحية لمكان يحبونه في عُمان تتضمن وصفه وسبب زيارته، ثم يستنتجون غرض الشاعرة فوزية البادية من قصيدة «بلادي عُمان».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): «هذا» اسم إشارة للقريب.\nالإجابة: صح\n\nس2 (مستوى التطبيق): المشار إليه في «أولئك أبطال»: (أ) أولئك (ب) أبطال (ج) لا يوجد\nالإجابة: (ب) أبطال\n\nس3 (مستوى الاستدلال): اقرأ فقرتك وحدد أسماء الإشارة فيها.\nالإجابة: يقرأ الطالب فقرته ويحدد أسماء الإشارة.", "- للطالب: اكتب ثلاث جمل بأسماء الإشارة للبعيد.\n- لولي الأمر: العب مع ابنك لعبة الإشارة للقريب والبعيد.\n- للطالب: أكمل تدريبات ص 74.\n- لولي الأمر: تابع ابنك في استخدام أسماء الإشارة.\n- للطالب: بيض فقرتك الوصفية.\n- لولي الأمر: اقرأ فقرة ابنك وشجعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=8"]}, {"k": "الإملاء", "p": ["الإملاء (1): الهمزة المتوسطة على الواو وعلى السطر", "الإملاء (2): كتابة الهمزة المتوسطة بالشكل المناسب", "الإملاء الاختباري: الهمزة المتوسطة على الواو والسطر"], "w": "الأسبوع الثامن", "f": ["1. يتعرف الهمزة المتوسطة على الواو وعلى السطر (15 دقيقة)\n2. يصنف الكلمات التي بها همزة متوسطة حسب الجدول (10 دقائق)\n3. يكتب الهمزة المتوسطة بالشكل المناسب (ؤ، ء) في جمل (15 دقيقة)\n4. يصحح ما تحته خط في عبارة (10 دقائق)\n5. يكتب فقرة تملى عليه مراعيًا الهمزة المتوسطة (10 دقائق)\n6. يعيد كتابة الفقرة سليمة (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يستنتج قاعدة الحركة الأقوى (15 دقيقة)\n- يقدّر حسن معاملة الجار (15 دقيقة)\n- يحدد خطأه الأكثر تكرارًا (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تقييم\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تحليل", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب\n5. التعلم التشاركي\n6. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات الكلمات\n4. السبورة التقليدية\n5. الأقلام", "1. الهمزة على الواو: تكتب إذا كانت الضمة أقوى الحركتين مثل: البؤس\n2. الهمزة على السطر: تكتب غالبًا بعد ألف ساكنة وهي مفتوحة مثل: الإساءة\n3. يؤذي: يلحق الضرر بغيره\n4. التفاؤل: توقع الخير\n5. الإملاء المسموع: كتابة ما يسمعه الطالب\n6. الخطأ المتكرر: خطأ يقع فيه الطالب أكثر من مرة", "يكتب المعلم: مؤمن، تفاؤل، ملاءة، آباؤك ويسأل عن شكل الهمزة، ويحدد التلميذ الأشكال. (5 دقائق)", "1. أقرأ وأكتشف: يقرأ المعلم فقرة الوطن ص 76 ويوجه إلى وضع دائرة حول الكلمات، ويستخرج التلميذ: آباؤك، البؤس، التشاؤم، التفاؤل، الإساءة، ملاءة (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أصنف: يوجه المعلم إلى جدول ص 76، ويصنف التلميذ إلى على واو وعلى السطر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستنتج: يحلل المعلم الحركات ويقود إلى القاعدة، ويصوغ التلميذ القاعدة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أكتب الهمزة: يوجه المعلم إلى نشاط ص 77: المؤمن، القراءة، لا تؤجل، يؤدي، تفاءلوا، ويكتب التلميذ الهمزة المناسبة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أصحح العبارة: يعرض المعلم العبارة: «المسلم لا يأذي جاره...»، ويصحح التلميذ: يؤذي، بالسؤال، جاءته (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. تعليل جماعي: يناقش المعلم سبب كل صورة، ويعلل التلميذ بالقاعدة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قراءة الفقرة: يقرأ المعلم الفقرة، ويستمع التلميذ (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الإملاء: يملي المعلم جملة جملة، ويكتب التلميذ في الكتاب ص 78 (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n9. التصويب: يعرض المعلم الفقرة صحيحة، ويصحح التلميذ ويعيد الكتابة (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n10. غلق الدرس – سباق الهمزات: تتسابق المجموعات في كتابة أكبر عدد من الكلمات ذات الهمزة الم
