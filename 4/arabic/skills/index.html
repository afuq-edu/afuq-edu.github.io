م وأعمارهم، ويجيب التلميذ ويعلل من الصورة (17 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n2. أتوقع النصيحة: يكتب المعلم التوقعات على السبورة لمقارنتها بعد القراءة، ويكتب التلميذ توقعه للنصيحة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الشاعر ومعنى النصيحة: يعرّف المعلم بالشاعر مصطفى عزوز ويناقش معنى كلمة «نصيحة»، ويكتب التلميذ اسم الشاعر ومعنى النصيحة (11 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n4. القراءة النموذجية: يلقي المعلم الأبيات الأولى إلقاءً معبرًا ضابطًا أواخر الكلمات، ويستمع التلميذ ويتابع (11 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n5. القراءة الجهرية: يطلب المعلم القراءة الفردية بيتًا بيتًا ويصحح الضبط، ويقرأ التلميذ البيت مراعيًا الإيقاع (19 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أحداث البداية: يسأل المعلم: متى حدثت القصة؟ ولماذا جمع الشيخ أبناءه؟، ويجيب التلميذ من الأبيات (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. إلقاء الجزء الثاني: يلقي المعلم بقية الأبيات ويبرز نبرة النصح، ويستمع التلميذ ويحدد النصيحة (10 دقائق)\nالاستراتيجيات: تمثيل الأدوار.\n\n8. الإلقاء الفردي والجماعي: يوزع المعلم الأبيات على المجموعات للإلقاء، وتلقي المجموعة أبياتها معبرة (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n9. تمثيل الاختبار: يمثل المعلم مع الطلاب اختبار الشيخ بحزمة العصي، ويمثل التلميذ دور الأبناء ويقرأ البيت المناسب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. أختار المعنى: يناقش المعلم سؤال ص 67–68 لاختيار المعنى الصحيح، ويختار التلميذ ويعلل من السياق (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. أصل الكلمة بمعناها: يوجه المعلم إلى نشاط الوصل ص 68، ويصل التلميذ الكلمات بمعانيها (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. سباق المعاني: ينظم المعلم سباقًا بين المجموعات على بطاقات المعاني، وتتسابق المجموعة في المطابقة الصحيحة (11 دقيقة)\nالاستراتيجيات: تبادل البطاقات.\n\n13. أسئلة المستوى الأول: يوزع المعلم أسئلة ص 66–67 على الرؤوس المرقمة، ويجيب التلميذ ويقرأ البيت الدال (17 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n14. أقرأ ما يدل: يطلب المعلم قراءة الأبيات الدالة على فشل الأبناء في كسر العصي، ويقرأ التلميذ البيت ويوضح الدلالة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n15. النصيحة الثمينة: يوجه المعلم إلى استخراج النصيحة من الأبيات، ويكتب التلميذ النصيحة بأسلوبه (11 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n16. أعبر بأسلوبي: يوجه المعلم إلى سؤال ص 68: التعبير عن البيتين بأسلوب الطالب، ويكتب التلميذ المعنى بجملتين (17 دقيقة)\nالاستراتيجيات: زاوج.\n\n17. أستخرج الأبيات: يوزع المعلم المعاني ص 69 على الأزواج لاستخراج الأبيات الدالة عليها، ويستخرج التلميذ البيت ويقرؤه (11 دقيقة)\nالاستراتيجيات: شارك.\n\n18. صفة الشيخ: يناقش المعلم: بم يتصف الشيخ؟ ويطلب الدليل، ويختار التلميذ «الحكمة» ويعلل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n19. نوع النص: يناقش المعلم سؤال تحديد نوع النص ص 69 ويوضح أنه شعر يحكي قصة، ويحدد التلميذ النوع ويعلل بالوزن والقافية (17 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n20. عنوان بديل: ينظم المعلم عصفًا ذهنيًا لاقتراح عناوين بديلة ويصوت الطلاب على الأفضل، ويقترح التلميذ عنوانًا ويصوت (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. الفكرة وحياتي: يسأل المعلم: أين تحتاج الاتحاد مع إخوتك؟، ويذكر التلميذ مثالًا من حياته (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n22. أستنتج المعاني: يوجه المعلم إلى السؤالين الأولين ص 70، ويكتب التلميذ معنيين يستنتجهما ومثالًا للاستفادة (13 دقيقة)\nالاستراتيجيات: فكّر.\n\n23. أحاكي التركيب: يمثل المعلم للتركيب على السبورة، ويكتب التلميذ جملة محاكية (11 دقيقة)\nالاستراتيجيات: زاوج.\n\n24. أتحدث عن تصرفي: ينظم المعلم حديثًا آمنًا عن تصرف خاطئ مع الإخوة وعزم على تغييره، ويتحدث التلميذ عن تصرف ويقترح بديله (11 دقيقة)\nالاستراتيجيات: شارك.\n\n25. الإلقاء: يلقي التلميذ أبياتًا ويقيم زملاءه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n26. ورقة عمل شاملة: يوزع المعلم ورقة تجمع: فهمًا ومفردات وجملة فعلية وهمزات، ويحل التلميذ الورقة فرديًا (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n27. التصحيح والتقييم الذاتي: يصحح المعلم مع الطلاب ويوزع بطاقة التقييم الذاتي، ويصحح التلميذ ويقيم نفسه (8 دقائق)\nالاستراتيجيات: تعدد القراءات.\n\n28. غلق الدرس – معًا كفريق الصيادين: تتحدث كل مجموعة عن فوائد العمل الجماعي، وتمثّل مشهدًا لصيادين عمانيين يسحبون شباكهم معًا على الشاطئ، ثم تذكر مواقف أخرى من التعاون كبناء السفن أو صيانة الأفلاج (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كاتب النص هو: (أ) إيسوب (ب) عبد الحميد السحار (ج) مصطفى عزوز\nالإجابة: (ج) مصطفى عزوز\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): جمع الشيخ أبناءه عندما شعر بسعادته.\nالإجابة: خطأ، والصواب: عندما أحس بقرب وفاته\n\nس3 (مستوى الاستدلال): ما معيار الإلقاء الجيد؟\nالإجابة: وضوح الصوت وصحة الضبط وتمثيل المعنى بالنبرة.\n\n• نشاط علاجي (لمن لم يتقن): ينفذ المعلم مع التلميذ ومجموعة صغيرة مهمة بسيطة (تركيب صورة مقطعة) يؤدي فيها كل فرد دوره، ثم يناقش معه فائدة العمل الجماعي؛ وللتحقق يسأله: اذكر فائدة من فوائد العمل ضمن مجموعة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوقع النصيحة التي يقدمها الأب لأبنائه في نص «نصيحة أب» وكتابتها بأسلوبهم، ثم يضعون ثلاث قواعد لنجاح العمل في مجموعتهم ويعللونها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: إرشاد الغير إلى ما فيه خيره يسمى .....\nالإجابة: النصيحة\n\nس2 (مستوى التطبيق): ما الذي دل على أن الأبناء لم ينجحوا أولًا؟ (أ) ضحكهم (ب) عجزهم عن كسر الحزمة مجتمعة (ج) سفرهم\nالإجابة: (ب) عجزهم عن كسر الحزمة مجتمعة\n\nس3 (مستوى الاستدلال): اكتب جملة فعلية فعلها أمر تنصح بها أخاك بالتعاون.\nالإجابة: مثل: تعاون مع إخوتك في البيت.", "- للطالب: اقرأ القصيدة ص 65–66 قراءة صامتة.\n- لولي الأمر: حدث ابنك عن نصيحة تعلمتها من والديك.\n- للطالب: درّب نفسك على إلقاء الأبيات الأولى.\n- لولي الأمر: استمع إلى إلقاء ابنك وشجعه.\n- للطالب: ألقِ القصيدة أمام أسرتك.\n- لولي الأمر: نفذ مع ابنك تجربة حزمة العصي في البيت.\n- للطالب: اكتب معاني مفردات القصيدة في دفترك.\n- لولي الأمر: اسأل ابنك عن معنى «الإمعان» و«الشتات».\n- للطالب: أجب عن أسئلة المستوى الأول ص 66–67.\n- لولي الأمر: تابع إجابات ابنك واسأله عن الدليل.\n- للطالب: اشرح لأسرتك معنى بيتين من القصيدة بأسلوبك.\n- لولي الأمر: ناقش ابنك في حكمة الشيخ.\n- للطالب: اكتب عنوانًا آخر للقصيدة وعلّله.\n- لولي الأمر: شجع أبناءك على التعاون فيما بينهم.\n- للطالب: اكتب جملتين محاكيتين للتركيب في دفترك.\n- لولي الأمر: تحدث مع أبنائك عن قيمة الاتحاد في الأسرة.\n- للطالب: راجع دروس المحور الثاني استعدادًا للتقييم.\n- لولي الأمر: اطلع على تقييم ابنك الذاتي وساعده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=17"]}, {"k": "الأنماط اللغوية", "p": ["الأنماط اللغوية (1): الجملة الفعلية المبدوءة بفعل ماض أو مضارع أو أمر", "الأنماط اللغوية (2): محاكاة الجمل الفعلية وتوظيف الأفعال في الوصف"], "w": "الأسبوع السادس عشر", "f": ["1. يتعرف الجملة الفعلية ويحدد نوع الفعل الذي تبدأ به (10 دقائق)\n2. يصنف الأفعال الملونة إلى ماض ومضارع وأمر (20 دقيقة)\n3. يحاكي الجمل الفعلية موظفًا الماضي والمضارع والأمر (10 دقائق)\n4. يصف صورتين بجمل فعلية متنوعة الأفعال (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يميز الجملة الفعلية من الاسمية (10 دقائق)\n- يحول الفعل من زمن إلى آخر بصورة صحيحة (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: إبداع\nالمخرج الآخر (1): تحليل\nالمخرج الآخر (2): تطبيق", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: جدول تصنيف الأفعال\n4. صورة توضيحية\n5. السبورة التقليدية\n6. الأقلام", "1. الجملة الفعلية: الجملة التي تبدأ بفعل\n2. الفعل الماضي: فعل حدث قبل زمن التكلم مثل: اشتعل\n3. فعل الأمر: فعل يطلب به حدوث شيء مثل: أسرع\n4. تحويل الفعل: نقل الفعل من الماضي إلى المضارع أو الأمر\n5. الجملة المحاكية: جملة تبنى على نمط جملة نموذجية", "يقول المعلم: كتبتُ، أكتب، اكتب. ويسأل: ما الفرق في الزمن؟ ويحدد التلميذ: مضى، يحدث الآن، طلب. (5 دقائق)", "1. أقرأ وألاحظ: يعرض المعلم فقرة «العاصفة» ص 71 ويلون الأفعال، ويحدد التلميذ أن الكلمات الملونة أفعال (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أصنف الأفعال: يوجه المعلم إلى تصنيف الأفعال الملونة في الجدول: ماض ومضارع وأمر، ويصنف التلميذ: انقطع، يعود، أسرع (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أستنتج: يقود المعلم إلى تعريف الجملة الفعلية وأنواع الفعل بالأمثلة، ويصوغ التلميذ التعريف ويمثل لكل نوع (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أحاكي الجمل: يوجه المعلم إلى نشاط ص 72: استدرج الثعلبُ الوعلَ / يستدرج / استدرج، ويكمل التلميذ الجمل بالأزمنة الثلاثة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أصف الصورتين: يعرض المعلم الصورتين ص 72 ويطلب جملة لكل زمن، ويكتب التلميذ جملًا فعلية تصف الصورتين (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تصحيح تعاوني: يعرض المعلم جمل الطلاب ويناقش صحة استخدام الأفعال، ويصحح التلميذ ويحسن جمله (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. غلق الدرس – أفعال الوطن: يقول المعلم فعلًا (حافظ، يزرع، اغرس) ويرفع الطلاب بطاقة (ماض، مضارع، أمر)، ثم تكوّن كل مجموعة جملة فعلية عن خدمة عمان بالفعل نفسه، مثل: «اغرسْ شجرة في حيك»، «يحافظ العمانيون على تراثهم» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): نوع الكلمات الملونة في فقرة العاصفة: (أ) أسماء (ب) أفعال (ج) حروف\nالإجابة: (ب) أفعال\n\nس2 (مستوى التطبيق): أكمل: الأمر من «يجلس» هو .....\nالإجابة: اجلس\n\nس3 (مستوى الاستدلال): حوّل إلى المضارع: «فرّ الوعل إلى مأواه».\nالإجابة: يفرّ الوعل إلى مأواه.\n\n• نشاط علاجي (لمن لم يتقن): ينفذ المعلم مع التلميذ ومجموعة صغيرة مهمة بسيطة (تركيب صورة مقطعة) يؤدي فيها كل فرد دوره، ثم يناقش معه فائدة العمل الجماعي؛ وللتحقق يسأله: اذكر فائدة من فوائد العمل ضمن مجموعة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوقع النصيحة التي يقدمها الأب لأبنائه في نص «نصيحة أب» وكتابتها بأسلوبهم، ثم يضعون ثلاث قواعد لنجاح العمل في مجموعتهم ويعللونها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): الجملة «عم الفرح» جملة فعلية فعلها ماض.\nالإجابة: صح\n\nس2 (مستوى التطبيق): الجملة الفعلية فعلها ماض: (أ) ارسم لوحة (ب) يرسم الطفل لوحة (ج) رسم الطفل لوحة\nالإجابة: (ج) رسم الطفل لوحة\n\nس3 (مستوى الاستدلال): صف إحدى الصورتين بجملتين فعليتين: ماضٍ ومضارع.\nالإجابة: مثل: جلس الأطفال في الحديقة. يلعب الأطفال بالكرة.", "- للطالب: صنف عشرة أفعال من الدرس إلى ماض ومضارع وأمر.\n- لولي الأمر: العب مع ابنك: تقول فعلًا ويحدد زمنه.\n- للطالب: اكتب ثلاث جمل فعلية تصف يومك بالأزمنة الثلاثة.\n- لولي الأمر: اطلب من ابنك وصف ما فعله اليوم بجمل فعلية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=17"]}, {"k": "الإملاء", "p": ["مراجعة إملائية (1): همزتا القطع والوصل والهمزة المتوسطة", "مراجعة إملائية (2): الهمزة المتطرفة وعلامات الترقيم", "الإملاء الاختباري: مراجعة الهمزات وعلامات الترقيم"], "w": "الأسبوع السادس عشر", "f": ["1. يستخرج من نص «نصيحة أب» كلمات بها همزة قطع وأخرى بها همزة وصل (15 دقيقة)\n2. يضع شكل الهمزة المتوسطة المناسب في الكلمات (10 دقائق)\n3. يكتب كلمات تنتهي بالهمزة في صورها المختلفة (10 دقائق)\n4. يصحح الكلمات المخطوط تحتها ويضع علامات الترقيم المناسبة (15 دقيقة)\n5. يكتب فقرة تُملى عليه مطبقًا قواعد الهمزات المختلفة (10 دقائق)\n6. يعيد كتابة الفقرة سليمة من الأخطاء (20 دقيقة)\n\nمخرج تعليمي آخر:\n- يربط ما تعلمه في المحورين من قواعد الإملاء (15 دقيقة)\n- يقدّر الحمامة رمزًا للسلام (15 دقيقة)\n- يحدد أكثر أخطائه تكرارًا ويضع خطة لعلاجها (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تقييم\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر (1): تحليل\nالمخرج الآخر (2): تقييم\nالمخرج الآخر (3): تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم المبني على اللعب\n4. التعلم التشاركي\n5. التعلم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. أخرى: بطاقات الهمزات\n4. الأقلام", "1. همزة القطع: همزة تنطق وتكتب دائمًا مثل: أبناء\n2. همزة الوصل: همزة تنطق في أول الكلام وتسقط في وسطه ولا تكتب عليها همزة مثل: اتحاد\n3. الهمزة المتوسطة: همزة تقع وسط الكلمة وتكتب بحسب الحركة الأقوى\n4. الهمزة المتطرفة: همزة في آخر الكلمة تكتب بحسب حركة ما قبلها\n5. علامات الترقيم: رموز تنظم الكتابة وتوضح المعنى\n6. الخطأ الشائع: خطأ يتكرر عند كثير من الطلاب\n7. خطة العلاج: خطوات يتبعها الطالب للتخلص من خطئه", "يكتب المعلم: أبناء، الاتحاد، سأل، مؤمن، بئر ويسأل عن موضع الهمزة، ويحدد التلميذ موضع الهمزة في كل كلمة. (5 دقائق)", "1. أستخرج من النص: يوجه المعلم إلى استخراج ثلاث كلمات بهمزة قطع وثلاث بهمزة وصل من القصيدة، ويستخرج التلميذ الكلمات ويكتبها في الكتاب ص 73 (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الهمزة المتوسطة: يراجع المعلم قاعدة الحركة الأقوى: الكسرة ثم الضمة ثم الفتحة، ويضع التلميذ الهمزة المناسبة في الكلمات ص 73 (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. سباق الهمزات: ينظم المعلم سباقًا بالبطاقات بين المجموعات، وتصنف المجموعة الكلمات بسرعة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. كلمات تنتهي بالهمزة: يوجه المعلم إلى كتابة كلمات تنتهي بـ: أ، ؤ، ئ، ء ص 74، ويكتب كلمتين لكل صورة (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. أصحح وأرقم: يقرأ المعلم فقرة الحمامة ص 74 ويوجه إلى تصحيح الكلمات ووضع العلامات، ويصحح التلميذ: تتأملها، تقرأ، تؤثر، طائر، الرسائل، ويضع العلامات (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. التصحيح الجماعي: يعرض المعلم الفقرة صحيحة ويناقش الأخطاء، ويصحح التلميذ ويعلل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قراءة الفقرة: يقرأ المعلم الفقرة الإملائية ويناقش معناها، ويستمع التلميذ ويركز (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الإملاء: يملي المعلم الفقرة جملة جملة، ويكتب التلميذ في الكتاب ص 75 (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n9. التصويب: يعرض المعلم الفقرة صحيحة ويوجه إلى التصويب وإعادة الكتابة، ويصحح التلميذ ويعيد الكتابة ويحدد خطأه الأكثر تكرارًا (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n10. غلق الدرس – صيد الهمزات: يوزع المعلم بطاقات كلمات (أبناء، الاتحاد، سؤال، بئر، شاطئ، ماء) في أرجاء الصف، ويلتقط كل فريق الكلمات ويصنفها في سلال: قطع، وصل، متوسطة، متطرفة، ثم يكتب جملة عن عمان تتضمن كلمتين منها مع علامة الترقيم المناسبة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كلمة بها همزة وصل: (أ) أبناء (ب) أعظم (ج) الاتحاد\nالإجابة: (ج) الاتحاد\n\nس2 (مستوى التطبيق): أكمل: تحب ثريا الطيور، ولكنها .... الحمامة.\nالإجابة: تؤثر\n\nس3 (مستوى الاستدلال): صحح: «يقرء الطالب كتابه بهدوئ».\nالإجابة: يقرأ الطالب كتابه بهدوء.\n\n• نشاط علاجي (لمن لم يتقن): ينفذ المعلم مع التلميذ ومجموعة صغيرة مهمة بسيطة (تركيب صورة مقطعة) يؤدي فيها كل فرد دوره، ثم يناقش معه فائدة العمل الجماعي؛ وللتحقق يسأله: اذكر فائدة من فوائد العمل ضمن مجموعة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوقع النصيحة التي يقدمها الأب لأبنائه في نص «نصيحة أب» وكتابتها بأسلوبهم، ثم يضعون ثلاث قواعد لنجاح العمل في مجموعتهم ويعللونها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع كلمة (صح) أو (خطأ): همزة القطع تنطق في أول الكلام ووسطه.\nالإجابة: صح\n\nس2 (مستوى التطبيق): كلمة همزتها متطرفة على السطر: (أ) يقرأ (ب) هدوء (ج) لؤلؤ\nالإجابة: (ب) هدوء\n\nس3 (مستوى الاستدلال): ما الخطأ الذي تكرر عندك؟ وكيف ستعالجه؟\nالإجابة: يذكر الطالب خطأه ويقترح التدرب على كلمات مشابهة.", "- للطالب: اكتب خمس كلمات بهمزة قطع وخمس بهمزة وصل.\n- لولي الأمر: راجع مع ابنك قواعد الهمزات.\n- للطالب: أكمل تدريبات ص 74 وراجع أخطاءك.\n- لولي الأمر: تابع ابنك في تصحيح كلماته.\n- للطالب: أعد كتابة الفقرة الإملائية سليمة.\n- لولي الأمر: أملِ على ابنك كلمات مهموزة متنوعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=17"]}, {"k": "الخط", "p": ["الخط: «رحم الله من جعل قضاء الحوائج عنده» بخط النسخ"], "w": "الأسبوع السادس عشر", "f": ["1. يكتب العبارة بخط النسخ محاكيًا النموذج (20 دقيقة)\n2. يراعي اتصال الحروف والمسافات بين الكلمات (5 دقائق)\n\nمخرج تعليمي آخر:\n- يحرص على قضاء حوائج الآخرين (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة التقليدية\n3. الأقلام\n4. أخرى: أقلام الخط", "1. قضاء الحوائج: مساعدة الناس في تلبية ما يحتاجون إليه\n2. اتصال الحروف: وصل الحروف بعضها ببعض في الكلمة", "يسأل المعلم: كيف تساعد جارك أو صديقك إذا احتاج إليك؟ ويذكر التلميذ طريقة للمساعدة. (5 دقائق)", "1. النموذج: يكتب المعلم العبارة ويوضح الحاء والجيم والعين والضاد في خط النسخ، ويلاحظ التلميذ أشكال الحروف (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. الكتابة: يتابع المعلم كتابة الأسطر ص 76 ويصحح، ويكتب التلميذ العبارة محاكيًا النموذج (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التقييم: يعرض المعلم معايير الخط الجميل ويقيم مع الطلاب، ويقيم التلميذ سطره الأفضل (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – لوحة قضاء الحوائج: تكتب كل مجموعة كلمة من عبارة «رحم الله من جعل قضاء الحوائج عنده» بخط النسخ على شريط ورقي، ثم تُجمع الأشرطة في لوحة واحدة، ويذكر كل طالب موقفًا يساعد فيه جارًا أو زميلًا كما اعتاد أهل عمان التعاون والتكافل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني، التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): معنى «قضاء الحوائج»: (أ) مساعدة الناس فيما يحتاجون (ب) شراء الحاجات لنفسي (ج) الحكم بين الناس\nالإجابة: (أ) مساعدة الناس فيما يحتاجون\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): نترك مسافة مناسبة بين الكلمات عند الكتابة.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): ما الحروف المتشابهة في الشكل في العبارة؟\nالإجابة: الحاء والجيم، ويميز بينهما النقطة.\n\n• نشاط علاجي (لمن لم يتقن): ينفذ المعلم مع التلميذ ومجموعة صغيرة مهمة بسيطة (تركيب صورة مقطعة) يؤدي فيها كل فرد دوره، ثم يناقش معه فائدة العمل الجماعي؛ وللتحقق يسأله: اذكر فائدة من فوائد العمل ضمن مجموعة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوقع النصيحة التي يقدمها الأب لأبنائه في نص «نصيحة أب» وكتابتها بأسلوبهم، ثم يضعون ثلاث قواعد لنجاح العمل في مجموعتهم ويعللونها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: نكتب العبارة بخط .....\nالإجابة: النسخ\n\nس2 (مستوى التطبيق): من عادات الكتابة الصحيحة: (أ) الجلسة المستقيمة (ب) الكتابة مستلقيًا (ج) الضغط الشديد على القلم\nالإجابة: (أ) الجلسة المستقيمة\n\nس3 (مستوى الاستدلال): كيف تقضي حاجة زميلك في الصف؟\nالإجابة: أعيره قلمًا أو أشرح له درسًا لم يفهمه.", "- للطالب: أكمل الأسطر ص 76 بخط جميل.\n- لولي الأمر: شجع ابنك على مساعدة الآخرين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=17"]}, {"k": "التعبير", "p": ["التعبير الكتابي (1): تسجيل أحداث القصيدة متسلسلة", "التعبير الكتابي (2): كتابة قصة «نصيحة أب» نثرًا بأسلوبي"], "w": "الأسبوع السادس عشر", "f": ["1. يسجل أحداث القصيدة متسلسلة من حضور الوفاة إلى النصيحة (10 دقائق)\n2. يستخلص الأحداث من الشعر ويعبر عنها نثرًا (5 دقائق)\n3. يكتب قصة «نصيحة أب» نثرًا في عشرة أحداث متسلسلة (10 دقائق)\n4. يستخدم أدوات الربط والحوار في قصته (15 دقيقة)\n\nمخرج تعليمي آخر:\n- يتعاون مع زميله في ترتيب الأحداث (25 دقيقة)\n- يراجع قصته وفق التوجيهات ويحسنها (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج الآخر (1): تطبيق\nالمخرج الآخر (2): تقييم", "1. التعلم التعاوني\n2. التعلم الذاتي\n3. التعلم المبني على المشاريع\n4. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة التقليدية\n3. أخرى: شريط الأحداث\n4. الأقلام\n5. أخرى: قائمة التوجيهات\n6. السبورة الذكية\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. تسلسل الأحداث: ترتيب الأحداث وفق وقوعها\n2. النثر: كلام غير موزون ولا مقفى\n3. أدوات الربط: كلمات تصل الجمل مثل: ثم، بعد ذلك، وأخيرًا\n4. الأسلوب الخاص: طريقة الكاتب في التعبير بكلماته", "يعرض المعلم الحدثين الأول والثاني ص 77: حضرت الشيخ الوفاة، جمع أبناءه، ويقترح التلميذ الحدث الثالث. (5 دقائق)", "1. قراءة صامتة: يوجه المعلم إلى قراءة القصيدة صامتة وتسجيل الأحداث، ويقرأ التلميذ ويسجل الأحداث (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. شريط الأحداث: يوزع المعلم شريطًا من عشر خانات على الأزواج، ويرتب التلميذ الأحداث العشرة مع زميله (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض الأحداث: يعرض المعلم شريطًا مكتملًا ويناقش الترتيب، ويصحح التلميذ ترتيبه (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. التوجيهات: يعرض المعلم توجيهات ص 78: عشرة أحداث متسلسلة من الشعور بالوفاة إلى النصيحة، ويقرأ التلميذ التوجيهات (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الكتابة: يتابع المعلم الكتابة ويذكّر باستخدام الحوار وأدوات الربط، ويكتب التلميذ القصة نثرًا مستعينًا بشريط الأحداث (16 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n6. المراجعة: يطلب المعلم مراجعة ثنائية بالقائمة، ويراجع التلميذ قصة زميله ويحسن قصته (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. غلق الدرس – سلسلة الحكاية: تجلس المجموعة في دائرة، ويضيف كل طالب جملة واحدة لرواية قصة «نصيحة أب» نثرًا بالترتيب مستخدمًا أداة ربط (ثم، بعد ذلك، وأخيرًا)، وتختم المجموعة بجملة عن اتحاد أبناء عمان كالعصي المجتمعة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني، التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الحدث الأول في القصيدة: (أ) كسر الأبناء العصي (ب) نصحهم بالاتحاد (ج) حضرت الشيخ الوفاة\nالإجابة: (ج) حضرت الشيخ الوفاة\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): يمكن إضافة حوار على لسان الأب في القصة النثرية.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): اكتب الجملة الأولى من قصتك.\nالإجابة: مثل: في قديم الزمان كان شيخ كبير شعر بقرب وفاته فجمع أبناءه الثمانية.\n\n• نشاط علاجي (لمن لم يتقن): ينفذ المعلم مع التلميذ ومجموعة صغيرة مهمة بسيطة (تركيب صورة مقطعة) يؤدي فيها كل فرد دوره، ثم يناقش معه فائدة العمل الجماعي؛ وللتحقق يسأله: اذكر فائدة من فوائد العمل ضمن مجموعة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوقع النصيحة التي يقدمها الأب لأبنائه في نص «نصيحة أب» وكتابتها بأسلوبهم، ثم يضعون ثلاث قواعد لنجاح العمل في مجموعتهم ويعللونها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: الكلام غير الموزون ولا المقفى يسمى .....\nالإجابة: النثر\n\nس2 (مستوى التطبيق): الخاتمة المناسبة للقصة: (أ) نام الأب (ب) فهم الأبناء النصيحة وتعاهدوا على الاتحاد (ج) سافر الأبناء\nالإجابة: (ب) فهم الأبناء النصيحة وتعاهدوا على الاتحاد\n\nس3 (مستوى الاستدلال): ما الذي أضفته لتحسين قصتك؟\nالإجابة: يذكر الطالب تحسينًا: حوارًا أو أداة ربط أو وصفًا.", "- للطالب: أكمل شريط الأحداث العشرة في كتابك ص 77.\n- لولي الأمر: اطلب من ابنك أن يحكي لك القصة بالترتيب.\n- للطالب: بيّض قصتك بخط واضح وأضف لها رسمًا.\n- لولي الأمر: اقرأ قصة ابنك وامدح إبداعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=17"]}]}, {"t": "أقيم أدائي (المحور الثاني)", "u": "المحور الثاني: قصص وعبر", "s": [{"k": "التحدث", "p": ["تقييم مهارات الاستماع والتحدث والقراءة"], "w": "الأسبوع السابع عشر", "f": ["1. يقيم أداءه في الاستماع والتحدث والقراءة الجهرية (25 دقيقة)\n2. يقرأ نصًا قصيرًا قراءة جهرية سليمة دون تعثر (5 دقائق)\n\nمخرج تعليمي آخر:\n- يحدد مهارة يحتاج إلى تطويرها (10 دقائق)", "المخرج 1: تقييم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "1. التعلم الذاتي\n2. التعلم التشاركي", "1. الكتاب\n2. أخرى: قائمة رصد المهارات", "1. التقييم الذاتي: حكم الطالب على مستوى أدائه\n2. القراءة دون تعثر: قراءة متصلة دون توقف أو تكرار", "يشرح المعلم جدول «أقيم أدائي» ص 82 ورموز التقييم، ويتعرف التلميذ معايير التقييم. (5 دقائق)", "1. الاستماع: يقرأ المعلم نصًا قصيرًا ويطرح ثلاثة أسئلة، ويجيب التلميذ ويقيم استماعه (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التحدث: يطلب المعلم حديثًا لدقيقة عن قصة أعجبته في المحور، ويتحدث التلميذ ويقيم طلاقته (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. القراءة الجهرية: يستمع المعلم إلى قراءات فردية قصيرة ويرصد الأداء، ويقرأ التلميذ فقرة ويضع علامة التقييم في الجدول (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. غلق الدرس – ميكروفون الدقيقة: يمرر الطلاب ميكروفونًا رمزيًا، ويتحدث من يحمله نصف دقيقة عن قصة أعجبته في المحور وقيمتها، ثم يذكر كيف يتمثل هذه القيمة في خدمة مجتمعه العماني (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التشاركي.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الاستماع الجيد يتطلب: (أ) الإنصات والانتباه (ب) النظر من النافذة (ج) الحديث مع الزميل\nالإجابة: (أ) الإنصات والانتباه\n\nس2 (مستوى التطبيق): ضع كلمة (صح) أو (خطأ): القراءة الجهرية الجيدة تكون بلا تعثر وبضبط صحيح.\nالإجابة: صح\n\nس3 (مستوى الاستدلال): ما المهارة التي أتقنتها أكثر في المحور الثاني؟\nالإجابة: يذكر الطالب مهارة ويعلل.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم نصًا قصيرًا قراءة نموذجية ثم يقرؤه مع التلميذ قراءة متبادلة مع ضبط أواخر الكلمات، ويحدد معه مهارة يحتاج إلى تطويرها؛ وللتحقق يقرأ التلميذ جملتين دون تعثر وبضبط صحيح.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة قصيرة عن عبرة من قصص المحور الثاني يوظفون فيها جملة اسمية وأخرى فعلية وكلمة بهمزة في آخرها (سماء، شيء)، ثم يراجعونها ذاتيًا.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: حكم الطالب على مستوى أدائه يسمى التقييم .....\nالإجابة: الذاتي\n\nس2 (مستوى التطبيق): عند التحدث أمام الزملاء أحرص على: (أ) السرعة الشديدة (ب) الطلاقة واللغة الفصيحة (ج) الكلام العامي\nالإجابة: (ب) الطلاقة واللغة الفصيحة\n\nس3 (مستوى الاستدلال): ما المهارة التي تحتاج إلى تطويرها؟ وكيف؟\nالإجابة: يذكر الطالب مهارة وطريقة تطويرها.", "- للطالب: أكمل جدول أقيم أدائي ص 82 بصدق.\n- لولي الأمر: اطلع على تقييم ابنك وساعده على التحسن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/arabic/?l=18"]}, {"k": "الأنماط اللغوية", "p": ["تقييم مهارات الأنماط اللغوية والإملاء"], "w": "الأسبوع السابع عشر", "f": ["1. يوظف ضمائر الرفع المتصلة والجمل الاسمية والفعلية توظيفًا صحيحًا (15 دقيقة)\n2. يكتب كلمات بها همزة في آخر الكلمة دون أخطاء (10 دقائق)\n\nمخرج تعليمي آخر:\n- يقيم دقته في الكتابة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم الذاتي\n2. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة التقليدية\n3. أخرى: بطاقة تقييم", "1. الضمائر المتصلة: ضمائر تتصل بالفعل مثل: ا، و، ي\n2. الدقة الإملائية: الكتابة الصحيحة الخالية من الأخطاء", "يعرض المعلم ثلاث جمل فيها أخطاء ويطلب اكتشافها، ويكتشف التلميذ الأخطاء. (5 دقائق)", "1. تدريب الأنماط: يوزع المعلم بطاقة: حوّل الأفعال، صنّف الجمل، ويحل التلميذ البطاقة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تدريب الإملاء: يملي المعلم خمس كلمات وجملة، ويكتب التلميذ ويصحح (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. رصد الأداء: يوجه المعلم إلى وضع علامة الأداء في الجدول ص 82، ويقيم التلميذ نفسه (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. غلق الدرس – الجملة الصحيحة: تتسابق المجموعات في تحويل جملة عن عمان من المفرد إلى المثنى والجمع بإسناد الفعل إلى ألف الاثنين وواو الجماعة، مثل: «الطالب يرفع علم عمان» ← «الطلاب يرفعون علم عمان»، ثم تكتبها دون خطأ إملائي، ويفوز الفريق الأسرع (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم الذاتي.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الضمير في «الطالبات يكتبن»: (أ) ألف الاثنين (ب) نون النسوة (ج) واو الجماعة\nالإجابة: (ب) نون النسوة\n\nس2 (مستوى التطبيق): أكمل: نكتب الهمزة على ياء في «شاطـ....».\nالإجابة: ئ\n\nس3 (مستوى الاستدلال): حوّل إلى الجمع: «الطالب كتب درسه».\nالإجابة: الطلاب كتبوا دروسهم.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم نصًا قصيرًا قراءة نموذجية ثم يقرؤه مع التلميذ قراءة متبادلة مع ضبط أواخر الكلمات، ويح
