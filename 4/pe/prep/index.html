المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ماذا نفعل عند الخدش البسيط؟\nالإجابة: ننظفه بالماء ونبلغ المعلم.\nس2 (مستوى التطبيق): ماذا نضع على الكدمة؟\nالإجابة: ثلجًا ملفوفًا بقطعة قماش.\nس3 (مستوى الاستدلال): ما أول ما نفعله عند الالتواء؟\nالإجابة: نتوقف عن اللعب ونرتاح ونبلغ المعلم.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ بالأدوات الإجراء الأولي لإصابات بسيطة: تنظيف الخدش بالماء، ووضع ثلج ملفوف بقماش على الكدمة، وإبلاغ المعلم، ثم يسأله: ماذا نفعل عند الخدش البسيط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «الإسعاف الأولي في الملعب» للكدمة والخدش والالتواء البسيط مع إجراء كل منها، وطرق الوقاية من الإصابة.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه القمع على القدم؟\nالإجابة: قسم الاتزان الحركي.\nس5 (مستوى التطبيق): اذكر حركة براعة أديتها.\nالإجابة: مثل: الوثب مع لمس العقبين.\nس6 (مستوى الاستدلال): ما قاعدة الأمان في الموانع؟\nالإجابة: الهبوط على المرتبة وعدم الدفع.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ بالأدوات الإجراء الأولي لإصابات بسيطة: تنظيف الخدش بالماء، ووضع ثلج ملفوف بقماش على الكدمة، وإبلاغ المعلم، ثم يسأله: ماذا نفعل عند الخدش البسيط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «الإسعاف الأولي في الملعب» للكدمة والخدش والالتواء البسيط مع إجراء كل منها، وطرق الوقاية من الإصابة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): مثّل الإجراء الصحيح لإصابة زميل بكدمة.\nالإجابة: راحة وثلج ملفوف وإبلاغ المعلم.\nس2 (مستوى التطبيق): كيف نقي أنفسنا من الإصابات في الملعب؟\nالإجابة: بالإحماء والالتزام بالقواعد والحذاء المناسب.\nس3 (مستوى الاستدلال): هل نحرك المصاب بالالتواء بسرعة؟ ولماذا؟\nالإجابة: لا، حتى لا تزداد الإصابة.\n\nس4 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الموانع، الاتزان الثابت، الاتزان الحركي، البراعة.\nس5 (مستوى التطبيق): ما القسم الذي أحببته أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\nس6 (مستوى الاستدلال): كيف ساهمت في عمل مجموعتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طفلك الإجراء الأولي للخدش والكدمة (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على حركات الاتزان والبراعة في مكان آمن (دليل المعلم ص 53-79).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=8"}}, {"title": "الطلاقة الحركية بالأدوات", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "العاشر – الحادي عشر", "date": "8-12/11/2026 إلى 15-19/11/2026", "pages": "دليل المعلم ص 80-92", "n": 2, "periods": [{"focus": "الطلاقة الحركية بالكرات (تبادل ترك الكرة ومسكها بين الرجلين، الوثب مع رفع الكرة بالقدمين) + الطلاقة الحركية بالحبل (تبادل الخطو مع تدوير الحبل، الحجل بالحبل، الوثب بالحبل مع الزميل)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي تبادل ترك الكرة ومسكها بين الرجلين مع تغيير وضع اليدين، والوثب مع رفع الكرة بالقدمين ومسكها.\n3. يميز بين حركات الطلاقة بالكرة.\n4. يؤدي تبادل الخطو بقدم تلو الأخرى مع تدوير الحبل والتقدم.\n5. يؤدي الحجل بالحبل بقدم واحدة في المكان وللأمام.\n6. يؤدي الوثب بالحبل مع الزميل في توقيت واحد.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: حبال وثب\n- أخرى: مراتب", "المفاهيم": "- الطلاقة الحركية\n- السيطرة\n- الرمي واللقف\n- التوافق\n- الوثب بالحبل\n- تبادل الخطو\n- الحجل بالحبل\n- التوقيت", "التهيئة / التمهيد / التعلم القبلي": "يؤدي المعلم تبادل ترك الكرة ومسكها بين رجليه بسرعة ويسأل: كم حركة أديت؟ ويقدم الطلاقة بالأدوات (ص 81-82).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 82-83: وقوف والقدمان متباعدتان ومسك الكرة بين الرجلين بيد أمام ويد خلف ثم تبادل تركها ومسكها مع تغيير وضع اليدين؛ الكرة بين القدمين والوثب مع رفعها ومسكها باليدين قبل سقوطها؛ انبطاح مواجه للزميل والكرة بين رأسي الزميلين والوقوف معًا دون سقوطها.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الطلاقة بالكرات: تبادل الترك والمسك، الوثب ورفع الكرة بالقدمين، الكرة بين الرأسين مع الزميل، رمي الكرة عاليًا والدوران واللقف، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: من يؤدي تبادل ترك الكرة ومسكها أكبر عدد في 20 ثانية.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 6 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 84: مسك الحبل خلف الجسم وتبادل الخطو مع التدوير والتقدم، الحجل بقدم واحدة مع التدوير في المكان ثم للأمام، الوثب بالحبل مع الزميل (أحدهما يمسك الحبل ويثبان معًا).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 7 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 88: تبادل الخطو بالحبل 5 م، الحجل بالحبل، الوثب مع الزميل، الوثب الفردي السريع، مع عد القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 8 (3 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: أي ثنائية تؤدي أكبر عدد من الوثبات المشتركة دون توقف.\n- الطالب: يتسابق.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الطلاقة الحركية؟\nالإجابة: أداء حركات مترابطة بانسيابية وسيطرة.\nس2 (مستوى التطبيق): أين تكون اليدان عند مسك الكرة بين الرجلين؟\nالإجابة: يد أمام الرجل ويد خلفها.\nس3 (مستوى الاستدلال): كيف نرفع الكرة بالقدمين؟\nالإجابة: نضعها بين القدمين ونثب ونرفعها ونمسكها باليدين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.\n\nس4 (مستوى المعرفة): كيف نؤدي تبادل الخطو بالحبل؟\nالإجابة: نمسك الحبل خلف الجسم ونخطو بقدم تلو الأخرى مع التدوير والتقدم.\nس5 (مستوى التطبيق): ما الفرق بين الحجل بالحبل والوثب بالحبل؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس6 (مستوى الاستدلال): ما أهم شرط في الوثب مع الزميل؟\nالإجابة: التوقيت الواحد.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تبادل ترك الكرة ومسكها بين الرجلين 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الوثب ورفع الكرة بالقدمين والكرة بين الرأسين.\nس3 (مستوى الاستدلال): لماذا نراعي تناسب الأطوال بين الزميلين في تمرين الكرة بين الرأسين؟\nالإجابة: حتى لا تسقط الكرة ويسهل الوقوف معًا.\n\nس4 (مستوى المعرفة): أدِّ الحجل بالحبل 5 مرات بكل قدم.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): أدِّ الوثب بالحبل مع زميلك 5 مرات.\nالإجابة: يؤديانه بتوقيت واحد.\nس6 (مستوى الاستدلال): لماذا نراعي تناسب الأطوال بين الزميلين؟\nالإجابة: ليكون التدوير مناسبًا لهما معًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على تمرين تبادل ترك الكرة ومسكها بين الرجلين (دليل المعلم ص 82-83).\nإرشاد لولي الأمر: شجع طفلك على الوثب بالحبل 3 دقائق يوميًا بأنماط مختلفة (دليل المعلم ص 84-85).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=9"}}, {"focus": "الطلاقة الحركية بسلم الرشاقة + محطات ومنافسات الطلاقة الحركية بالأدوات", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي أنماط حركية متنوعة في سلم الرشاقة (الجري، الوثب، الحجل، الخطو الجانبي، الدخول والخروج).\n2. يحافظ على الإيقاع والنظر للأمام أثناء الحركة في السلم.\n3. يميز بين الأنماط من حيث الصعوبة والسرعة.\n4. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n5. يوظف الطلاقة الحركية في منافسات.\n6. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: أطواق\n- أخرى: سلال", "المفاهيم": "- سلم الرشاقة\n- النمط الحركي\n- الإيقاع\n- الرشاقة\n- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم أنماط الصف الثالث في السلم ويسأل: ما الأنماط الجديدة التي يمكن أن نبتكرها؟ (ص 85-86).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم الأنماط: الجري بهبوط قدم في كل مربع، الوثب بالقدمين، الحجل، الخطو الجانبي، الدخول والخروج (قدم داخل المربع وقدم خارجه بالتبادل)، مع الإيقاع والنظر للأمام.\n- الطالب: يقلد ببطء ثم بسرعة.\n\nالنشاط 3 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يبتكر كل زوج نمطًا جديدًا في السلم ويعرضه، ويختار الصف الأسرع والأصعب ويعلل.\n- الطالب: يبتكر ويستنتج.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: قطارات، يؤدي كل تلميذ النمط الذي يناديه المعلم عبر السلم حاملًا كرة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 6 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 87-89: الكرة (تبادل الترك والمسك ثم رمي ولقف)، الحبل (تبادل الخطو ثم الحجل)، السلم (نمط من اختيار القائد)، الكرة والسلم (الجري في السلم بالكرة ثم رميها في السلة)، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 7 (6 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 90: تتابع يجمع الأدوات الثلاث (وثب بالحبل 5 مرات، سلم الرشاقة، رمي الكرة والدوران واللقف ثم الرمي في السلة).\n- الطالب: يتسابق.\n\nالنشاط 8 (2 دقيقتان):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا تفوقت بعض الفرق؟ ليستنتج التلاميذ أهمية الانسيابية بين الحركات.\n- الطالب: يستنتج.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر ثلاثة أنماط في سلم الرشاقة.\nالإجابة: الجري، الحجل، الخطو الجانبي.\nس2 (مستوى التطبيق): ما نمط الدخول والخروج؟\nالإجابة: قدم داخل المربع وقدم خارجه بالتبادل.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: للمحافظة على الإيقاع والاتزان.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.\n\nس4 (مستوى المعرفة): في أي محطة استخدمنا السلة؟\nالإجابة: محطة الكرة والسلم.\nس5 (مستوى التطبيق): ما ترتيب حركات المنافسة؟\nالإجابة: وثب بالحبل، سلم الرشاقة، رمي الكرة والدوران واللقف، الرمي في السلة.\nس6 (مستوى الاستدلال): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ نمط الدخول والخروج عبر السلم.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما النمط الذي ابتكره زميلك وما صعوبته؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): أي الأنماط أسرع: الجري أم الوثب بالقدمين؟ ولماذا؟\nالإجابة: الجري لأن القدمين تتبادلان بسرعة.\n\nس4 (مستوى المعرفة): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الحبل والسلم.\nس6 (مستوى الاستدلال): كيف شعرت عندما أنهيت المسار؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك مربعات بالطباشير ومارسا الأنماط المختلفة (دليل المعلم ص 85-86).\nإرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي بأدوات بسيطة (دليل المعلم ص 87-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي تبادل ترك الكرة ومسكها بين الرجلين مع تغيير وضع اليدين، والوثب مع رفع الكرة بالقدمين ومسكها.\n3. يميز بين حركات الطلاقة بالكرة.\n4. يؤدي تبادل الخطو بقدم تلو الأخرى مع تدوير الحبل والتقدم.\n5. يؤدي الحجل بالحبل بقدم واحدة في المكان وللأمام.\n6. يؤدي الوثب بالحبل مع الزميل في توقيت واحد.\n\nالحصة 2:\n1. يؤدي أنماط حركية متنوعة في سلم الرشاقة (الجري، الوثب، الحجل، الخطو الجانبي، الدخول والخروج).\n2. يحافظ على الإيقاع والنظر للأمام أثناء الحركة في السلم.\n3. يميز بين الأنماط من حيث الصعوبة والسرعة.\n4. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n5. يوظف الطلاقة الحركية في منافسات.\n6. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: حبال وثب\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: أطواق\n- أخرى: سلال", "المفاهيم": "الحصة 1:\n- الطلاقة الحركية\n- السيطرة\n- الرمي واللقف\n- التوافق\n- الوثب بالحبل\n- تبادل الخطو\n- الحجل بالحبل\n- التوقيت\n\nالحصة 2:\n- سلم الرشاقة\n- النمط الحركي\n- الإيقاع\n- الرشاقة\n- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيؤدي المعلم تبادل ترك الكرة ومسكها بين رجليه بسرعة ويسأل: كم حركة أديت؟ ويقدم الطلاقة بالأدوات (ص 81-82).\n\nالحصة 2:\nيراجع المعلم أنماط الصف الثالث في السلم ويسأل: ما الأنماط الجديدة التي يمكن أن نبتكرها؟ (ص 85-86).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 82-83: وقوف والقدمان متباعدتان ومسك الكرة بين الرجلين بيد أمام ويد خلف ثم تبادل تركها ومسكها مع تغيير وضع اليدين؛ الكرة بين القدمين والوثب مع رفعها ومسكها باليدين قبل سقوطها؛ انبطاح مواجه للزميل والكرة بين رأسي الزميلين والوقوف معًا دون سقوطها.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الطلاقة بالكرات: تبادل الترك والمسك، الوثب ورفع الكرة بالقدمين، الكرة بين الرأسين مع الزميل، رمي الكرة عاليًا والدوران واللقف، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: من يؤدي تبادل ترك الكرة ومسكها أكبر عدد في 20 ثانية.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 6 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 84: مسك الحبل خلف الجسم وتبادل الخطو مع التدوير والتقدم، الحجل بقدم واحدة مع التدوير في المكان ثم للأمام، الوثب بالحبل مع الزميل (أحدهما يمسك الحبل ويثبان معًا).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 7 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 88: تبادل الخطو بالحبل 5 م، الحجل بالحبل، الوثب مع الزميل، الوثب الفردي السريع، مع عد القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 8 (3 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: أي ثنائية تؤدي أكبر عدد من الوثبات المشتركة دون توقف.\n- الطالب: يتسابق.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم الأنماط: الجري بهبوط قدم في كل مربع، الوثب بالقدمين، الحجل، الخطو الجانبي، الدخول والخروج (قدم داخل المربع وقدم خارجه بالتبادل)، مع الإيقاع والنظر للأمام.\n- الطالب: يقلد ببطء ثم بسرعة.\n\nالنشاط 3 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يبتكر كل زوج نمطًا جديدًا في السلم ويعرضه، ويختار الصف الأسرع والأصعب ويعلل.\n- الطالب: يبتكر ويستنتج.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: قطارات، يؤدي كل تلميذ النمط الذي يناديه المعلم عبر السلم حاملًا كرة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 6 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 87-89: الكرة (تبادل الترك والمسك ثم رمي ولقف)، الحبل (تبادل الخطو ثم الحجل)، السلم (نمط من اختيار القائد)، الكرة والسلم (الجري في السلم بالكرة ثم رميها في السلة)، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 7 (6 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 90: تتابع يجمع الأدوات الثلاث (وثب بالحبل 5 مرات، سلم الرشاقة، رمي الكرة والدوران واللقف ثم الرمي في السلة).\n- الطالب: يتسابق.\n\nالنشاط 8 (2 دقيقتان):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا تفوقت بعض الفرق؟ ليستنتج التلاميذ أهمية الانسيابية بين الحركات.\n- الطالب: يستنتج.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الطلاقة الحركية؟\nالإجابة: أداء حركات مترابطة بانسيابية وسيطرة.\nس2 (مستوى التطبيق): أين تكون اليدان عند مسك الكرة بين الرجلين؟\nالإجابة: يد أمام الرجل ويد خلفها.\nس3 (مستوى الاستدلال): كيف نرفع الكرة بالقدمين؟\nالإجابة: نضعها بين القدمين ونثب ونرفعها ونمسكها باليدين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.\n\nس4 (مستوى المعرفة): كيف نؤدي تبادل الخطو بالحبل؟\nالإجابة: نمسك الحبل خلف الجسم ونخطو بقدم تلو الأخرى مع التدوير والتقدم.\nس5 (مستوى التطبيق): ما الفرق بين الحجل بالحبل والوثب بالحبل؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس6 (مستوى الاستدلال): ما أهم شرط في الوثب مع الزميل؟\nالإجابة: التوقيت الواحد.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر ثلاثة أنماط في سلم الرشاقة.\nالإجابة: الجري، الحجل، الخطو الجانبي.\nس2 (مستوى التطبيق): ما نمط الدخول والخروج؟\nالإجابة: قدم داخل المربع وقدم خارجه بالتبادل.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: للمحافظة على الإيقاع والاتزان.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.\n\nس4 (مستوى المعرفة): في أي محطة استخدمنا السلة؟\nالإجابة: محطة الكرة والسلم.\nس5 (مستوى التطبيق): ما ترتيب حركات المنافسة؟\nالإجابة: وثب بالحبل، سلم الرشاقة، رمي الكرة والدوران واللقف، الرمي في السلة.\nس6 (مستوى الاستدلال): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ ترك الكرة ومسكها بين الرجلين ببطء (يد أمام الرجل ويد خلفها) ثم تغيير اليدين، ثم يطلب منه أداءها ثلاث مرات دون سقوط الكرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط حركات الطلاقة بالكرة (المسك بين الرجلين، والوثب مع رفع الكرة بالقدمين ومسكها) في جملة حركية منسابة واحدة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ تبادل ترك الكرة ومسكها بين الرجلين 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الوثب ورفع الكرة بالقدمين والكرة بين الرأسين.\nس3 (مستوى الاستدلال): لماذا نراعي تناسب الأطوال بين الزميلين في تمرين الكرة بين الرأسين؟\nالإجابة: حتى لا تسقط الكرة ويسهل الوقوف معًا.\n\nس4 (مستوى المعرفة): أدِّ الحجل بالحبل 5 مرات بكل قدم.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): أدِّ الوثب بالحبل مع زميلك 5 مرات.\nالإجابة: يؤديانه بتوقيت واحد.\nس6 (مستوى الاستدلال): لماذا نراعي تناسب الأطوال بين الزميلين؟\nالإجابة: ليكون التدوير مناسبًا لهما معًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ نمط الدخول والخروج عبر السلم.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما النمط الذي ابتكره زميلك وما صعوبته؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): أي الأنماط أسرع: الجري أم الوثب بالقدمين؟ ولماذا؟\nالإجابة: الجري لأن القدمين تتبادلان بسرعة.\n\nس4 (مستوى المعرفة): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الحبل والسلم.\nس6 (مستوى الاستدلال): كيف شعرت عندما أنهيت المسار؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على تمرين تبادل ترك الكرة ومسكها بين الرجلين (دليل المعلم ص 82-83).\nإرشاد لولي الأمر: شجع طفلك على الوثب بالحبل 3 دقائق يوميًا بأنماط مختلفة (دليل المعلم ص 84-85).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=9\n\nالحصة 2:\nإرشاد لولي الأمر: ارسم مع طفلك مربعات بالطباشير ومارسا الأنماط المختلفة (دليل المعلم ص 85-86).\nإرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي بأدوات بسيطة (دليل المعلم ص 87-90).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=9"}}, {"title": "سباقات الجري", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 93-105", "n": 1, "periods": [{"focus": "سباق جري السلم + سباق التتابع المكوكي للعدو المتعرج والحواجز", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق جري السلم.\n2. يؤدي العدو والجري داخل مربعات سلم الجري ضمن مسار 45 م.\n3. يطبق قواعد السباق (عدم تجاوز المربعات، الانطلاق بعد الزميل).\n4. يتعرف سباق التتابع المكوكي للعدو المتعرج والحواجز وقواعده.\n5. يؤدي العدو المتعرج بين الأعلام والوثب الجانبي فوق الحواجز المنخفضة وتسليم الطوق.\n6. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الجري\n- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: أطواق مطاطية صغيرة", "المفاهيم": "- سباق جري السلم\n- العدو\n- المربعات\n- التتابع\n- القاعدة القانونية\n- التتابع المكوكي\n- العدو المتعرج\n- الحواجز\n- الحارة\n- التسليم", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم سلم الجري في منتصف المسار ويسأل: كيف نجري بسرعة داخل المربعات دون أن نخطئ؟ (ص 95).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: العدو من خط البداية 7.5 م، الجري بهبوط قدم في كل مربع عبر سلم 4.5 م، العدو إلى خط النهاية والعودة، وتسليم الدور بلمس اليد، مع القواعد.\n- الطالب: يقلد.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 97-98: فرق في قطارات خلف خط البداية، يؤدي كل تلميذ السباق ويلمس التالي، ويراقب القائد الجري الصحيح في المربعات.\n- الطالب: يؤدي السباق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 6 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: ينطلق الأول بالعدو والوثب الجانبي فوق الحواجز والجري المتعرج بين الأعلام ويسلم الطوق للزميل في القطار المقابل الذي يعود بالعدو في الحارة الفارغة، وهكذا.\n- الطالب: يقلد.\n\nالنشاط 7 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 99-100: فرق في قطارين متقابلين بأدوار محددة ويراقب القائد التسليم.\n- الطالب: يؤدي السباق.\n\nالنشاط 8 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق وتحديد الفائز.\n- الطالب: يتسابق.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى المعرفة): كم طول مسار سباق جري السلم؟\nالإجابة: 45 م.\nس2 (مستوى التطبيق): ماذا نفعل داخل مربعات السلم؟\nالإجابة: نجري بهبوط قدم في كل مربع.\nس3 (مستوى الاستدلال): ما الخطأ الذي يُحتسب على التلميذ؟\nالإجابة: تجاوز مربع أو الدوس على أطرافه.\n\n• نشاط علاجي (لمن لم يتقن): يجري المعلم مع التلميذ ببطء في مربعات سلم الجري بهبوط قدم في كل مربع دون الدوس على الأطراف، ثم يطلب منه اجتياز السلم وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق جري السلم لفريقين في مسار 45 م وتحكيمه، وتسجيل الأخطاء (تجاوز مربع أو الدوس على أطرافه).\n\nس4 (مستوى المعرفة): ماذا يحمل التلميذ الأول في السباق؟\nالإجابة: طوقًا مطاطيًا صغيرًا.\nس5 (مستوى التطبيق): كيف نتخطى الحواجز في هذا السباق؟\nالإجابة: بالوثب الجانبي فوقها.\nس6 (مستوى الاستدلال): ما الفرق بين الحارتين؟\nالإجابة: حارة بها حواجز وأعلام، وحارة فارغة للعدو.\n\n• نشاط علاجي (لمن لم يتقن): يجري المعلم مع التلميذ ببطء في مربعات سلم الجري بهبوط قدم في كل مربع دون الدوس على الأطراف، ثم يطلب منه اجتياز السلم وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق جري السلم لفريقين في مسار 45 م وتحكيمه، وتسجيل الأخطاء (تجاوز مربع أو الدوس على أطرافه).", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدتين لسباق جري السلم.\nالإجابة: الجري داخل كل مربع والانطلاق بعد لمس الزميل.\nس2 (مستوى التطبيق): أدِّ سباق جري السلم كاملًا.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف يتم تحديد الفريق الفائز؟\nالإجابة: الذي ينهي السباق أولًا دون أخطاء.\n\nس4 (مستوى المعرفة): أدِّ السباق كاملًا.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): اذكر الحركات التي تضمنها السباق.\nالإجابة: العدو، الوثب الجانبي، الجري المتعرج.\nس6 (مستوى الاستدلال): كيف شعرت بمشاركة فريقك؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك مربعات بالطباشير ومارسا الجري السريع داخلها (دليل المعلم ص 95-98).\nإرشاد لولي الأمر: شجع طفلك على الجري المتعرج بين عوائق في مكان آمن (دليل المعلم ص 96-100).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=10"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق جري السلم.\n2. يؤدي العدو والجري داخل مربعات سلم الجري ضمن مسار 45 م.\n3. يطبق قواعد السباق (عدم تجاوز المربعات، الانطلاق بعد الزميل).\n4. يتعرف سباق التتابع المكوكي للعدو المتعرج والحواجز وقواعده.\n5. يؤدي العدو المتعرج بين الأعلام والوثب الجانبي فوق الحواجز المنخفضة وتسليم الطوق.\n6. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: سلم الجري\n- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: أطواق مطاطية صغيرة", "المفاهيم": "الحصة 1:\n- سباق جري السلم\n- العدو\n- المربعات\n- التتابع\n- القاعدة القانونية\n- التتابع المكوكي\n- العدو المتعرج\n- الحواجز\n- الحارة\n- التسليم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم سلم الجري في منتصف المسار ويسأل: كيف نجري بسرعة داخل المربعات دون أ كيات الوقاية من الحرارة والعطش أثناء السباقات.\n3. يقدر أهمية شرب الماء والراحة في الظل.\n4. يوظف سباقات الجري والطلاقة الحركية في أقسام المهرجان.\n5. يطبق قواعد السباقات والأمان.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: زجاجات ماء\n- أخرى: قبعة\n- أخرى: أقماع\n- أخرى: سلم الجري\n- أخرى: حواجز منخفضة\n- أخرى: أعلام\n- أخرى: أطواق مطاطية\n- أخرى: حبال وثب\n- أخرى: كرات\n- أخرى: لوحة نقاط", "المفاهيم": "- الزي الرياضي\n- الحذاء\n- الحرارة\n- العطش\n- الظل\n- المهرجان الرياضي التعليمي\n- سباقات الجري\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم حذاءً رياضيًا وآخر غير مناسب وقبعة وزجاجة ماء ويسأل: ماذا نحتاج ليوم سباقات؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء في الظل.\n- الطالب: يقلد.\n\nالنشاط 2 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور: الزي القطني الفاتح والحذاء ذو النعل المرن المناسب للجري، وسلوكيات الوقاية (الماء قبل السباق وبعده، القبعة، الراحة في الظل، التوقف عند الدوار) (برنامج صحتي ص 23).\n- الطالب: يستمع ويرتب البطاقات.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (العداء الذكي): نداءات (اجرِ، اشرب، استرح في الظل) ويستجيب التلاميذ.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تجهز كل مجموعة (حقيبة العداء) من البطاقات وتعرض محتوياتها وسببها.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 5 (3 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 6 (14 دقيقة):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم سباق جري السلم، قسم التتابع المكوكي للعدو المتعرج والحواجز، قسم الحبل والكرة (طلاقة)، قسم الجري المتعرج بالكرة، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 7 (2 دقيقتان):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق ختامي بين الفرق.\n- الطالب: يتسابق.\n\nالنشاط 8 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي والتنفس وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى المعرفة): ما مواصفات حذاء الجري؟\nالإجابة: نعل مرن ومقاس مناسب ورباط محكم.\nس2 (مستوى التطبيق): لماذا نلبس زيًا فاتحًا في الحر؟\nالإجابة: لأنه يعكس الحرارة ويبقي الجسم أبرد.\nس3 (مستوى الاستدلال): ماذا نفعل عند الشعور بالدوار أثناء السباق؟\nالإجابة: نتوقف ونستريح في الظل ونشرب الماء ونبلغ المعلم.\n\n• نشاط علاجي (لمن لم يتقن): يختار المعلم مع التلميذ من صور حذاء الجري المناسب (نعل مرن، ومقاس مناسب، ورباط محكم) والزي الفاتح، ثم يسأله: لماذا نلبس زيًا فاتحًا في الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إرشادات للوقاية من الحرارة والعطش في سباقات المهرجان، وتحديد مكان للظل والماء وما يفعله المتسابق عند الدوار.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه الطوق المطاطي؟\nالإجابة: التتابع المكوكي.\nس5 (مستوى التطبيق): ماذا نفعل داخل مربعات سلم الجري؟\nالإجابة: نجري بهبوط قدم في كل مربع.\nس6 (مستوى الاستدلال): ماذا نفعل بعد كل قسم جري؟\nالإجابة: نمشي ونتنفس بعمق ونشرب الماء.\n\n• نشاط علاجي (لمن لم يتقن): يختار المعلم مع التلميذ من صور حذاء الجري المناسب (نعل مرن، ومقاس مناسب، ورباط محكم) والزي الفاتح، ثم يسأله: لماذا نلبس زيًا فاتحًا في الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إرشادات للوقاية من الحرارة والعطش في سباقات المهرجان، وتحديد مكان للظل والماء وما يفعله المتسابق عند الدوار.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر ثلاثة أشياء في حقيبة العداء.\nالإجابة: ماء وقبعة وزي قطني.\nس2 (مستوى التطبيق): أرفع صورة طفل يجري ظهرًا بلا ماء، ما الخطأ؟\nالإجابة: يجري وقت الحر بلا ماء ولا قبعة.\nس3 (مستوى الاستدلال): ما السلوك الذي يقي من العطش؟\nالإجابة: شرب الماء قبل النشاط وبعده.\n\nس4 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: جري السلم، التتابع المكوكي، الحبل والكرة، الجري المتعرج بالكرة.\nس5 (مستوى التطبيق): ما القاعدة التي راقبها الحكم الصغير؟\nالإجابة: التسليم الصحيح والانطلاق بعد اللمس.\nس6 (مستوى الاستدلال): كيف تشجع زميلًا تأخر في السباق؟\nالإجابة: أصفق له وأشجعه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: جهّز لطفلك حقيبة رياضية مناسبة (ماء، قبعة، زي فاتح) ليوم الحصة (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على الجري اليومي (دليل المعلم ص 93-105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=11"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مواصفات الزي والحذاء الرياضي المناسبين للجري.\n2. يميز سلوكيات الوقاية من الحرارة والعطش أثناء السباقات.\n3. يقدر أهمية شرب الماء والراحة في الظل.\n4. يوظف سباقات الجري والطلاقة الحركية في أقسام المهرجان.\n5. يطبق قواعد السباقات والأمان.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: زجاجات ماء\n- أخرى: قبعة\n- أخرى: أقماع\n- أخرى: سلم الجري\n- أخرى: حواجز منخفضة\n- أخرى: أعلام\n- أخرى: أطواق مطاطية\n- أخرى: حبال وثب\n- أخرى: كرات\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الزي الرياضي\n- الحذاء\n- الحرارة\n- العطش\n- الظل\n- المهرجان الرياضي التعليمي\n- سباقات الجري\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم حذاءً رياضيًا وآخر غير مناسب وقبعة وزجاجة ماء ويسأل: ماذا نحتاج ليوم سباقات؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء في الظل.\n- الطالب: يقلد.\n\nالنشاط 2 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور: الزي القطني الفاتح والحذاء ذو النعل المرن المناسب للجري، وسلوكيات الوقاية (الماء قبل السباق وبعده، القبعة، الراحة في الظل، التوقف عند الدوار) (برنامج صحتي ص 23).\n- الطالب: يستمع ويرتب البطاقات.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (العداء الذكي): نداءات (اجرِ، اشرب، استرح في الظل) ويستجيب التلاميذ.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تجهز كل مجموعة (حقيبة العداء) من البطاقات وتعرض محتوياتها وسببها.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 5 (3 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 6 (14 دقيقة):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم سباق جري السلم، قسم التتابع المكوكي للعدو المتعرج والحواجز، قسم الحبل والكرة (طلاقة)، قسم الجري المتعرج بالكرة، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 7 (2 دقيقتان):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق ختامي بين الفرق.\n- الطالب: يتسابق.\n\nالنشاط 8 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي والتنفس وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما مواصفات حذاء الجري؟\nالإجابة: نعل مرن ومقاس مناسب ورباط محكم.\nس2 (مستوى التطبيق): لماذا نلبس زيًا فاتحًا في الحر؟\nالإجابة: لأنه يعكس الحرارة ويبقي الجسم أبرد.\nس3 (مستوى الاستدلال): ماذا نفعل عند الشعور بالدوار أثناء السباق؟\nالإجابة: نتوقف ونستريح في الظل ونشرب الماء ونبلغ المعلم.\n\n• نشاط علاجي (لمن لم يتقن): يختار المعلم مع التلميذ من صور حذاء الجري المناسب (نعل مرن، ومقاس مناسب، ورباط محكم) والزي الفاتح، ثم يسأله: لماذا نلبس زيًا فاتحًا في الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إرشادات للوقاية من الحرارة والعطش في سباقات المهرجان، وتحديد مكان للظل والماء وما يفعله المتسابق عند الدوار.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه الطوق المطاطي؟\nالإجابة: التتابع المكوكي.\nس5 (مستوى التطبيق): ماذا نفعل داخل مربعات سلم الجري؟\nالإجابة: نجري بهبوط قدم في كل مربع.\nس6 (مستوى الاستدلال): ماذا نفعل بعد كل قسم جري؟\nالإجابة: نمشي ونتنفس بعمق ونشرب الماء.\n\n• نشاط علاجي (لمن لم يتقن): يختار المعلم مع التلميذ من صور حذاء الجري المناسب (نعل مرن، ومقاس مناسب، ورباط محكم) والزي الفاتح، ثم يسأله: لماذا نلبس زيًا فاتحًا في الحر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد إرشادات للوقاية من الحرارة والعطش في سباقات المهرجان، وتحديد مكان للظل والماء وما يفعله المتسابق عند الدوار.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر ثلاثة أشياء في حقيبة العداء.\nالإجابة: ماء وقبعة وزي قطني.\nس2 (مستوى التطبيق): أرفع صورة طفل يجري ظهرًا بلا ماء، ما الخطأ؟\nالإجابة: يجري وقت الحر بلا ماء ولا قبعة.\nس3 (مستوى الاستدلال): ما السلوك الذي يقي من العطش؟\nالإجابة: شرب الماء قبل النشاط وبعده.\n\nس4 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: جري السلم، التتابع المكوكي، الحبل والكرة، الجري المتعرج بالكرة.\nس5 (مستوى التطبيق): ما القاعدة التي راقبها الحكم الصغير؟\nالإجابة: التسليم الصحيح والانطلاق بعد اللمس.\nس6 (مستوى الاستدلال): كيف تشجع زميلًا تأخر في السباق؟\nالإجابة: أصفق له وأشجعه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز لطفلك حقيبة رياضية مناسبة (ماء، قبعة، زي فاتح) ليوم الحصة (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على الجري اليومي (دليل المعلم ص 93-105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=11"}}, {"title": "مسابقات الوثب", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الرابع عشر", "date": "6-10/12/2026", "pages": "دليل المعلم ص 106-117", "n": 1, "periods": [{"focus": "مسابقة الوثب الطويل من الاقتراب القصير (الهبوط في الدوائر) + مسابقة الوثب الثلاثي في منطقة محددة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الوثب وقواعد الوثب الطويل من الاقتراب القصير.\n2. يؤدي الوثب بقدم واحدة من منطقة الارتقاء والهبوط بالقدمين في إحدى الدوائر.\n3. يطبق قواعد المسابقة (الارتقاء من المنطقة المحددة، الهبوط داخل الدائرة).\n4. يتعرف الوثب الثلاثي (الحجلة، الخطوة، الوثبة) وقواعد المسابقة.\n5. يؤدي الوثب الثلاثي في مربعات المنطقة التي تناسب قدراته.\n6. يختار المنطقة المناسبة لقدراته ويعلل.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- أخرى: حواجز\n- صورة توضيحية\n- أخرى: مربعات الأرقام", "المفاهيم": "- الوثب الطويل\n- الاقتراب\n- منطقة الارتقاء\n- الهبوط\n- دقة الأداء\n- الوثب الثلاثي\n- الحجلة\n- الخطوة\n- الوثبة\n- المنطقة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة الوثب الطويل ويسأل: ما الفرق بين وثبة القرفصاء والوثب من الاقتراب؟ ويقدم المسابقة (ص 107).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: جري، وثب من خطوتين.\n- الطالب: يقلد.\n\nالنشاط 2 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب 10 م، الارتقاء بقدم واحدة من منطقة الارتقاء (50 سم)، الطيران مع مرجحة الذراعين، الهبوط بالقدمين بثني الركبتين في إحدى الدوائر الثلاث، ونقاط حسب بعد الدائرة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 110: قطارات، يؤدي كل تلميذ الوثبة ويحتسب القائد النقاط حسب الدائرة وصحة الأداء.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق بمجموع النقاط.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: حجل، تبادل الخطو والحجل.\n- الطالب: يقلد.\n\nالنشاط 6 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب 5 م، حجلة في المربع الأول، خطوة في الثاني، وثبة والهبوط في الثالث، بإيقاع متساوٍ، ويشرح المناطق (1.5 م، 2 م، 2.5 م) ونقاطها (1، 2، 3).\n- الطالب: يقلد بالتدرج في المنطقة الأولى.\n\nالنشاط 7 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 111: يختار كل تلميذ منطقته ويؤدي ويحتسب القائد النقاط، ثم يحاول المنطقة التالية.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 8 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق بمجموع النقاط.\n- الطالب: يتسابق.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): بكم قدم نرتقي؟\nالإجابة: بقدم واحدة.\nس2 (مستوى التطبيق): أين نهبط؟\nالإجابة: بالقدمين داخل إحدى الدوائر.\nس3 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: حسب بعد الدائرة التي نهبط فيها.\n\n• نشاط علاجي (لمن لم يتقن): يرتقي المعلم مع التلميذ بقدم واحدة من منطقة الارتقاء ببطء، ويهبطان بالقدمين في أقرب دائرة، ثم يسأله: بكم قدم نرتقي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب نحو الدوائر الأبعد وحساب نقاطهم حسب بعد الدائرة، واقتراح ما يساعدهم على الوصول أبعد (الاقتراب ومرجحة الذراعين).\n\nس4 (مستوى المعرفة): ما تسلسل الوثب الثلاثي؟\nالإجابة: حجلة، خطوة، وثبة.\nس5 (مستوى التطبيق): كم نقطة للمنطقة الثالثة؟\nالإجابة: 3 نقاط.\nس6 (مستوى الاستدلال): لماذا نختار المنطقة المناسبة لقدراتنا؟\nالإجابة: لنؤدي الوثبات الثلاث بدقة داخل المربعات.\n\n• نشاط علاجي (لمن لم يتقن): يرتقي المعلم مع التلميذ بقدم واحدة من منطقة الارتقاء ببطء، ويهبطان بالقدمين في أقرب دائرة، ثم يسأله: بكم قدم نرتقي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب نحو الدوائر الأبعد وحساب نقاطهم حسب بعد الدائرة، واقتراح ما يساعدهم على الوصول أبعد (الاقتراب ومرجحة الذراعين).", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الوثب الطويل من الاقتراب القصير.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما طول منطقة الارتقاء؟\nالإجابة: 50 سم.\nس3 (مستوى الاستدلال): ماذا يحدث لو هبطت خارج الدوائر؟\nالإجابة: لا تحتسب نقاط للمحاولة.\n\nس4 (مستوى المعرفة): أدِّ الوثب الثلاثي في المنطقة التي تناسبك.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): على أي قدم نهبط بعد الحجلة؟\nالإجابة: على قدم الارتقاء نفسها.\nس6 (مستوى الاستدلال): أي منطقة اخترت ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الوثب من الاقتراب في مكان آمن بهبوط هادئ (دليل المعلم ص 107-110).\nإرشاد لولي الأمر: تدرب مع طفلك على إيقاع (حجلة، خطوة، وثبة) داخل مربعات مرسومة (دليل المعلم ص 108-113).\n🎮 رابط ألعاب تقاء؟\nالإجابة: 50 سم.\nس3 (مستوى الاستدلال): ماذا يحدث لو هبطت خارج الدوائر؟\nالإجابة: لا تحتسب نقاط للمحاولة.\n\nس4 (مستوى المعرفة): أدِّ الوثب الثلاثي في المنطقة التي تناسبك.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): على أي قدم نهبط بعد الحجلة؟\nالإجابة: على قدم الارتقاء نفسها.\nس6 (مستوى الاستدلال): أي منطقة اخترت ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على الوثب من الاقتراب في مكان آمن بهبوط هادئ (دليل المعلم ص 107-110).\nإرشاد لولي الأمر: تدرب مع طفلك على إيقاع (حجلة، خطوة، وثبة) داخل مربعات مرسومة (دليل المعلم ص 108-113).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=12"}}, {"title": "مسابقات الرمي", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 118-130", "n": 1, "periods": [{"focus": "مسابقة الرمي بالدوران نحو أهداف مختلفة + مسابقة رمي الكرة الطبية للخلف", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الرمي وقواعد الرمي بالدوران نحو الأهداف.\n2. يؤدي الرمي بالدوران (كرمي القرص) من الوقوف مواجهًا بالجانب نحو مناطق محددة.\n3. يطبق قواعد الأمان والمسابقة (محاولتان، احتساب النقاط حسب المنطقة).\n4. يتعرف مسابقة رمي الكرة الطبية للخلف وقواعدها.\n5. يؤدي رمي الكرة الطبية للخلف بفرد الركبتين وأرجحة الذراعين.\n6. يشعر بالسعادة والرضا بمشاركته زملاءه مسابقات الرمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقراص مطاطية\n- أخرى: أطواق\n- أخرى: قائمان (مرمى كرة اليد)\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: كرات طبية 1 كجم\n- أخرى: شريط قياس\n- أخرى: أعلام", "المفاهيم": "- الرمي بالدوران\n- الهدف\n- مواجهة الجانب\n- الأرجحة\n- الأمان\n- رمي الكرة الطبية للخلف\n- أرجحة الذراعين\n- فرد الركبتين\n- المسافة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة رامي القرص ويسأل: كيف يرمي؟ ويقدم المسابقة ومنطقة الرمي بثلاث مناطق (ص 119).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: لف الجذع، دوران الذراعين.\n- الطالب: يقلد.\n\nالنشاط 2 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف مواجهًا بالجانب على بعد 5 م، أرجحة الذراع ورمي الأداة كرمي القرص أو أرجحة مضرب التنس، نحو إحدى المناطق الثلاث، مع قواعد الأمان (الرمي بالإشارة فقط).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 122: مجموعات على خط الرمي، محاولتان لكل تلميذ، ونقاط حسب المنطقة والذراع المستخدمة، يسجل القائد.\n- الطالب: يرمي ويسجل.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 6 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف وظهره لمنطقة الرمي، مسك الكرة باليدين وثني الركبتين، فرد الركبتين بسرعة مع رفع الكرة وأرجحة الذراعين ورميها للخلف، وتسجيل المسافة لكل 10 سم، مع الأمان (خلو منطقة الرمي).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 7 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 124: مجموعات، محاولتان لكل تلميذ وتسجيل الأفضل بالشريط ويجمع للفريق.\n- الطالب: يرمي ويسجل.\n\nالنشاط 8 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق بمجموع المسافات.\n- الطالب: يتسابق.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف نقف قبل الرمي بالدوران؟\nالإجابة: مواجهين بالجانب لمنطقة الرمي.\nس2 (مستوى التطبيق): كم محاولة لكل تلميذ؟\nالإجابة: محاولتان.\nس3 (مستوى الاستدلال): اذكر قاعدة أمان.\nالإجابة: الرمي بإشارة المعلم فقط.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ مواجهًا بالجانب لمنطقة الرمي، ويؤديان الرمي بالدوران ببطء بكرة خفيفة نحو منطقة قريبة بإشارة المعلم، ثم يسأله: كيف نقف قبل الرمي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي بالدوران نحو مناطق أبعد بمحاولتين وتسجيل النقاط، وكتابة قاعدتي أمان للمسابقة.\n\nس4 (مستوى المعرفة): كم وزن الكرة الطبية في المسابقة؟\nالإجابة: 1 كجم.\nس5 (مستوى التطبيق): كيف نقف قبل الرمي للخلف؟\nالإجابة: ظهرنا لمنطقة الرمي والركبتان منثنيتان.\nس6 (مستوى الاستدلال): ما الذي يعطي الرمية قوة؟\nالإجابة: فرد الركبتين بسرعة مع أرجحة الذراعين.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ مواجهًا بالجانب لمنطقة الرمي، ويؤديان الرمي بالدوران ببطء بكرة خفيفة نحو منطقة قريبة بإشارة المعلم، ثم يسأله: كيف نقف قبل الرمي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي بالدوران نحو مناطق أبعد بمحاولتين وتسجيل النقاط، وكتابة قاعدتي أمان للمسابقة.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الأداة بالدوران نحو المنطقة اليمنى.\nالإجابة: يرمي بدقة.\nس2 (مستوى التطبيق): ما حركة الذراع في الرمي بالدوران؟\nالإجابة: أرجحة كرمي القرص.\nس3 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: حسب المنطقة التي تسقط فيها الأداة.\n\nس4 (مستوى المعرفة): ارمِ الكرة الطبية للخلف لأبعد مسافة.\nالإجابة: يرمي بالطريقة الصحيحة.\nس5 (مستوى التطبيق): كيف يفوز الفريق؟\nالإجابة: بمجموع أطول المسافات لأفراده.\nس6 (مستوى الاستدلال): كيف شعرت في مسابقات الرمي؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على رمي قرص خفيف (فريزبي) نحو هدف في مكان آمن (دليل المعلم ص 119-122).\nإرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان في الرمي، ومراجعة مهارات الفصل قبل حصة القياس (دليل المعلم ص 120-126).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=13"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الرمي وقواعد الرمي بالدوران نحو الأهداف.\n2. يؤدي الرمي بالدوران (كرمي القرص) من الوقوف مواجهًا بالجانب نحو مناطق محددة.\n3. يطبق قواعد الأمان والمسابقة (محاولتان، احتساب النقاط حسب المنطقة).\n4. يتعرف مسابقة رمي الكرة الطبية للخلف وقواعدها.\n5. يؤدي رمي الكرة الطبية للخلف بفرد الركبتين وأرجحة الذراعين.\n6. يشعر بالسعادة والرضا بمشاركته زملاءه مسابقات الرمي.", "المستوى ا  5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: عصي", "المفاهيم": "- السفراء الصغار\n- الرسالة الصحية\n- القدوة\n- النشاط البدني\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يعرف ما يفعله السفير؟ ويقدم برنامج السفراء الصغار (ص 24) وسؤال: كيف تكون سفيرًا للصحة في أسرتك؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم دور السفير الصغير (قدوة في الزي والإحماء والماء والنشاط اليومي) ونماذج رسائل صحية قصيرة.\n- الطالب: يستمع.\n\nالنشاط 3 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تصوغ كل مجموعة رسالة صحية وتعرضها بالحركة أو التمثيل.\n- الطالب: يصوغ ويعرض.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (السفير): يقود تلميذ من كل مجموعة إحماءً قصيرًا ونصيحة صحية.\n- الطالب: يلعب ويقود.\n\nالنشاط 5 (3 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 6 (3 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تقسيم المجموعات بقائد وتحاور كل مجموعة لاختيار لعبة وإعداد أدواتها.\n- الطالب: يحاور ويختار.\n\nالنشاط 7 (11 دقيقة):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: تنفذ المجموعات ألعابها بإشراف المعلم مع تبديل القائد.\n- الطالب: يلعب ويلتزم ويتبادل القيادة.\n\nالنشاط 8 (2 دقيقتان):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تعرض كل مجموعة لعبتها في دقيقة.\n- الطالب: يعرض.\n\nالنشاط 9 (2 دقيقتان):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن أجمل حصة في الفصل.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى المعرفة): ما دور السفير الصغير؟\nالإجابة: أن يكون قدوة في العادات الصحية ويشجع الآخرين عليها.\nس2 (مستوى التطبيق): اذكر عادة صحية ينشرها السفير.\nالإجابة: شرب الماء أو الإحماء قبل اللعب.\nس3 (مستوى الاستدلال): لماذا نحتاج إلى قدوة في الصحة؟\nالإجابة: لأن الناس يتعلمون بالمشاهدة والتقليد.\n\n• نشاط علاجي (لمن لم يتقن): يناقش المعلم مع التلميذ صورًا لسفير صغير يشرب الماء ويؤدي الإحماء قبل اللعب، ويختاران عادة صحية واحدة يقلدها، ثم يسأله: ما دور السفير الصغير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بصياغة رسالة صحية قصيرة لأسرهم أو زملائهم عن النشاط البدني، وقيادة نشاط حر لمجموعتهم بصفتهم سفراء صغارًا.\n\nس4 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر ويعلل.\nس5 (مستوى التطبيق): ما دور القائد؟\nالإجابة: ينظم ويوزع الأدوار ويحرص على السلامة.\nس6 (مستوى الاستدلال): لماذا نبدل القائد؟\nالإجابة: ليجرب الجميع القيادة.\n\n• نشاط علاجي (لمن لم يتقن): يناقش المعلم مع التلميذ صورًا لسفير صغير يشرب الماء ويؤدي الإحماء قبل اللعب، ويختاران عادة صحية واحدة يقلدها، ثم يسأله: ما دور السفير الصغير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بصياغة رسالة صحية قصيرة لأسرهم أو زملائهم عن النشاط البدني، وقيادة نشاط حر لمجموعتهم بصفتهم سفراء صغارًا.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر الرسالة الصحية التي صاغتها مجموعتك.\nالإجابة: يذكر.\nس2 (مستوى التطبيق): كيف تشجع أخاك الأصغر على الحركة؟\nالإجابة: ألعب معه ألعابًا حركية يوميًا.\nس3 (مستوى الاستدلال): ما العادة التي ستكون سفيرًا لها في العطلة؟\nالإجابة: يذكر.\n\nس4 (مستوى المعرفة): اذكر قاعدة سلامة التزمتم بها.\nالإجابة: مثل: عدم الدفع.\nس5 (مستوى التطبيق): ما المهارة من هذا الفصل التي استخدمتها في لعبتكم؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على أن يكون سفيرًا للصحة في الأسرة بنصيحة يومية (برنامج السفراء الصغار، دليل المعلم ص 24).\nإرشاد لولي الأمر: شجع طفلك على الألعاب الشعبية والحركية في العطلة ومراجعة مهارات الفصل الأول.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=15"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف برنامج السفراء الصغار ودوره const FIELDS = (window.AFUQ35||function(x){return x})(["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"]);
const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ المرجع: دليل المعلم للصف الرابع.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
