تيجية: التعلم المبني على اللعب\n- المعلم: لعبة (العصا الطائرة): رمي العصا عموديًا ولقفها قبل سقوطها مع تصفيق.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة بالعصا.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما طول العصا تقريبًا؟\nالإجابة: نحو متر (80-110 سم).\nس2 (مستوى التطبيق): اذكر تمرينًا بالعصا للجذع.\nالإجابة: لف الجذع والعصا خلف الكتفين.\nس3 (مستوى الاستدلال): كيف نمسك العصا بأمان أثناء التمرين؟\nالإجابة: باليدين بإحكام وبمسافة كافية عن الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): يمسك المعلم مع التلميذ العصا باليدين بإحكام مع مسافة كافية عن الزملاء، ويؤديان تمرين رفع العصا عاليًا ببطء بالعد، ثم يطلب منه أداء لف الجذع والعصا خلف الكتفين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين زوجي بالعصا مع زميل للذراعين أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تمرينًا بالعصا للذراعين بالعد.\nالإجابة: تدوير الذراعين بالعصا.\nس2 (مستوى التطبيق): صنف: (جلوس طويل. العصا أمامًا) ثني الجذع.\nالإجابة: تمرين للجذع.\nس3 (مستوى الاستدلال): ابتكر تمرينًا بالعصا للرجلين.\nالإجابة: مثل: الوثب فوق العصا الموضوعة على الأرض.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: يمكن استخدام عصا خفيفة في المنزل لتمرينين للذراعين والجذع (دليل المعلم ص 34-36).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=2"}}, {"focus": "التمرينات الزوجية بالعصا ومحطات التمرينات بالعصا", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات الزوجية بالعصا.\n2. يؤدي تمرينات زوجية بالعصا بالتوافق مع الزميل.\n3. يقدر أهمية التمرينات بالعصا في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: عصي\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: كرات", "المفاهيم": "- التمرينات الزوجية بالأدوات\n- التوافق\n- الشد والدفع\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يؤدي المعلم مع تلميذ تمرين (جلوس طويل مواجه. مسك العصا) تبادل الشد ويسأل: ما الجديد؟ (ص 36-37).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم في أزواج.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ النماذج: (وقوف مواجه. مسك العصا) تبادل الدفع والشد، (جلوس طويل مواجه. مسك العصا) تبادل الرجوع وسحب الزميل، (وقوف ظهرًا لظهر. مسك العصا عاليًا) تبادل ثني الجذع، (وقوف جنبًا لجنب. العصا على الأرض) تبادل الوثب فوقها، مع العد المشترك.\n- الطالب: يؤدي مع زميله بالتوافق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات التمرينات بالعصا بأربع مجموعات: محطة فردي للذراعين، محطة فردي للجذع، محطة زوجي (شد وسحب)، محطة الوثب فوق العصي، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المرآة بالعصا) في أزواج.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما التمرين الزوجي بالعصا؟\nالإجابة: تمرين يؤديه تلميذان معًا بعصا واحدة بالتوافق.\nس2 (مستوى التطبيق): أدِّ مع زميلك تبادل الشد من الجلوس الطويل.\nالإجابة: يؤديانه.\nس3 (مستوى الاستدلال): ماذا يحدث لو شد أحدكما العصا بعنف؟\nالإجابة: قد يسقط الزميل ويصاب.\n\n• نشاط علاجي (لمن لم يتقن): يمسك المعلم مع التلميذ العصا باليدين بإحكام مع مسافة كافية عن الزملاء، ويؤديان تمرين رفع العصا عاليًا ببطء بالعد، ثم يطلب منه أداء لف الجذع والعصا خلف الكتفين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين زوجي بالعصا مع زميل للذراعين أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر تمرينًا زوجيًا بالعصا للجذع.\nالإجابة: تبادل ثني الجذع ظهرًا لظهر والعصا عاليًا.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الزوجي والوثب فوق العصي.\nس3 (مستوى الاستدلال): كيف تحافظ التمرينات بالعصا على لياقتنا؟\nالإجابة: تقوي العضلات وتزيد المرونة بجهد أكبر من التمرين الحر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بعصا خفيفة (دليل المعلم ص 36-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات بالأدوات (العصا) ومواصفات العصا.\n2. يؤدي تمرينات فردية بالعصا للذراعين والجذع والرجلين بالعد.\n3. يميز بين أنواع التمرينات بالعصا حسب الجزء العامل.\n\nالحصة 2:\n1. يتعرف التمرينات الزوجية بالعصا.\n2. يؤدي تمرينات زوجية بالعصا بالتوافق مع الزميل.\n3. يقدر أهمية التمرينات بالعصا في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: عصي\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات مصورة\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: عصي\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: كرات", "المفاهيم": "الحصة 1:\n- التمرينات بالأدوات\n- العصا\n- التمرينات الفردية\n- الجذع\n\nالحصة 2:\n- التمرينات الزوجية بالأدوات\n- التوافق\n- الشد والدفع\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم العصا ويسأل: ما الأدوات التي تمرنا بها في الصف الثالث؟ وكيف تختلف العصا عن الكرة الطبية؟ (ص 33).\n\nالحصة 2:\nيؤدي المعلم مع تلميذ تمرين (جلوس طويل مواجه. مسك العصا) تبادل الشد ويسأل: ما الجديد؟ (ص 36-37).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 34-35: (وقوف فتحًا. مسك العصا أفقيًا أمام الجسم) تبادل أرجحة الذراعين بالعصا للجانب، (وقوف. مسك العصا أفقيًا أمام الجسم) تدوير الذراعين، (وقوف. مسك العصا من المنتصف بيد) رمي العصا ومس لتوافق.\nس2 (مستوى التطبيق): أدِّ مع زميلك تبادل الشد من الجلوس الطويل.\nالإجابة: يؤديانه.\nس3 (مستوى الاستدلال): ماذا يحدث لو شد أحدكما العصا بعنف؟\nالإجابة: قد يسقط الزميل ويصاب.\n\n• نشاط علاجي (لمن لم يتقن): يمسك المعلم مع التلميذ العصا باليدين بإحكام مع مسافة كافية عن الزملاء، ويؤديان تمرين رفع العصا عاليًا ببطء بالعد، ثم يطلب منه أداء لف الجذع والعصا خلف الكتفين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم تمرين زوجي بالعصا مع زميل للذراعين أو الرجلين، وأدائه بالعد بأمان، وتحديد الجزء العامل فيه.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ تمرينًا بالعصا للذراعين بالعد.\nالإجابة: تدوير الذراعين بالعصا.\nس2 (مستوى التطبيق): صنف: (جلوس طويل. العصا أمامًا) ثني الجذع.\nالإجابة: تمرين للجذع.\nس3 (مستوى الاستدلال): ابتكر تمرينًا بالعصا للرجلين.\nالإجابة: مثل: الوثب فوق العصا الموضوعة على الأرض.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر تمرينًا زوجيًا بالعصا للجذع.\nالإجابة: تبادل ثني الجذع ظهرًا لظهر والعصا عاليًا.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الزوجي والوثب فوق العصي.\nس3 (مستوى الاستدلال): كيف تحافظ التمرينات بالعصا على لياقتنا؟\nالإجابة: تقوي العضلات وتزيد المرونة بجهد أكبر من التمرين الحر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: يمكن استخدام عصا خفيفة في المنزل لتمرينين للذراعين والجذع (دليل المعلم ص 34-36).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا زوجيًا بعصا خفيفة (دليل المعلم ص 36-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=2"}}, {"title": "التمرينات على الأجهزة", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث – الرابع", "date": "20-24/9/2026 إلى 27/9-1/10/2026", "pages": "دليل المعلم ص 43-52", "n": 4, "periods": [{"focus": "التعرف إلى المقعد السويدي وتمرينات الذراعين عليه", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات على الأجهزة ومواصفات المقعد السويدي واعتبارات الأمان.\n2. يحمل المقعد السويدي ويضعه بالطريقة الصحيحة مع زملائه.\n3. يؤدي تمرينات للذراعين على المقعد السويدي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التمرينات على الأجهزة\n- المقعد السويدي\n- عارضة التوازن\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم المقعد السويدي ويسأل: ما الأجهزة التي نتمرن عليها؟ ويشرح المواصفات واعتبارات الأمان (ص 44).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج حمل المقعد ورفعه ووضعه (أربعة تلاميذ، ثني الركبتين، النزول ببطء)، ثم نماذج تمرينات الذراعين ص 45: (انبطاح مائل مواجه المقعد. اليدان على المقعد) ثني الذراعين، (انبطاح مائل) تبادل الارتكاز على المقعد باليدين، (جلوس عالٍ. مسك المقعد) رفع الجسم بالذراعين.\n- الطالب: يقلد بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد تحمل مقعدها وتضعه بأمان ثم تؤدي تمرينات الذراعين الثلاثة بالعد ويراقب القائد.\n- الطالب: يحمل ويؤدي.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ ثني الذراعين واليدان على الأرض ثم على المقعد ويكتشف أيهما أسهل، ويستنتج أثر ارتفاع اليدين في الجهد.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإعادة المقاعد بأمان.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر جهازين من أجهزة التمرينات.\nالإجابة: المقعد السويدي والصندوق المقسم.\nس2 (مستوى التطبيق): كيف نحمل المقعد السويدي بأمان؟\nالإجابة: أربعة تلاميذ بثني الركبتين ووضعه ببطء.\nس3 (مستوى الاستدلال): اذكر تمرينًا للذراعين على المقعد.\nالإجابة: ثني الذراعين من الانبطاح المائل واليدان على المقعد.\n\n• نشاط علاجي (لمن لم يتقن): يحمل المعلم مع التلميذ وثلاثة زملاء المقعد السويدي بثني الركبتين ويضعونه ببطء، ثم يؤديان تمرين ثني الذراعين واليدان على المقعد، ثم يسأله: كم تلميذًا نحتاج لحمل المقعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم محطة من تمرينين على المقعد السويدي (للذراعين والجذع) وأدائهما بالعد، وشرح اعتبارات الأمان عند استخدامه.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ ثني الذراعين واليدان على المقعد 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): لماذا كان التمرين أسهل واليدان على المقعد؟\nالإجابة: لأن ارتفاع اليدين يقلل الحمل على الذراعين.\nس3 (مستوى الاستدلال): اذكر اعتبارًا للأمان عند التمرين على المقعد.\nالإجابة: ترك مسافة بين التلاميذ والتأكد من ثبات المقعد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان عند استخدام الأجهزة (دليل المعلم ص 44-45).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=3"}}, {"focus": "تمرينات الجذع على المقعد السويدي", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تمرينات للجذع على المقعد السويدي بالعد.\n2. يميز أنواع التمرينات على المقعد حسب الجزء العامل.\n3. يحافظ على استقامة الجذع وأمان الأداء.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: بطاقات مصورة", "المفاهيم": "- المقعد السويدي\n- الجذع\n- عضلات البطن والظهر\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الذراعين ويسأل: كيف نتمرن للجذع على المقعد؟ (ص 46).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 46: (جلوس طويل فتحًا. سند القدمين على المقعد) ميل الجذع للخلف للرقود، (جلوس عالٍ فتحًا. تشابك اليدين خلف الرأس) تبادل ثني الجذع جانبًا، (جلوس على أربع على المقعد) المشي باليدين والقدمين، (جلوس عالٍ. مسك المقعد) ميل الجذع للأمام للمس المشطين، (وقوف نصفًا. القدم على المقعد. الذراعان عاليًا) ميل الجذع، بالعد.\n- الطالب: يقلد بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات على المقاعد: محطة ميل الجذع للخلف، محطة ثني الجذع جانبًا، محطة المشي على أربع، محطة الذراعين (مراجعة)، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (البطاقة والمقعد): يرفع المعلم بطاقة تمرين وتؤديه المجموعة بأسرع وأدق أداء.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر تمرينًا للجذع على المقعد.\nالإجابة: ميل الجذع للخلف من الجلوس الطويل والقدمان على المقعد.\nس2 (مستوى التطبيق): أي العضلات تعمل في ميل الجذع للخلف؟\nالإجابة: عضلات البطن.\nس3 (مستوى الاستدلال): كيف يكون الظهر في تمرينات الجذع؟\nالإجابة: مستقيمًا.\n\n• نشاط علاجي (لمن لم يتقن): يحمل المعلم مع التلميذ وثلاثة زملاء المقعد السويدي بثني الركبتين ويضعونه ببطء، ثم يؤديان تمرين ثني الذراعين واليدان على المقعد، ثم يسأله: كم تلميذًا نحتاج لحمل المقعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم محطة من تمرينين على المقعد السويدي (للذراعين والجذع) وأدائهما بالعد، وشرح اعتبارات الأمان عند استخدامه.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تبادل ثني الجذع جانبًا من الجلوس العالي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): صنف: (جلوس على أربع على المقعد) المشي باليدين والقدمين.\nالإجابة: تمرين للذراعين والجذع.\nس3 (مستوى الاستدلال): لماذا نسند القدمين على المقعد في تمرين ميل الجذع للخلف؟\nالإجابة: لتثبيت الرجلين فتعمل عضلات البطن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع بسند القدمين على كرسي ثابت (دليل المعلم ص 46).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=3"}}, {"focus": "تمرينات الرجلين على المقعد السويدي والتمرينات على عارضة التوازن", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي تمرينات للرجلين على المقعد السويدي (الصعود والنزول، الوثب فوق المقعد، القفز على جانبيه).\n2. يؤدي المشي والاتزان على عارضة التوازن (المقعد المقلوب).\n3. يميز بين التمرين على سطح المقعد والتمرين على عارضة التوازن.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أكياس رمل\n- أخرى: كرات", "المفاهيم": "- الرجلان\n- الصعود والنزول\n- عارضة التوازن\n- الاتزان", "التهيئة / التمهيد / التعلم القبلي": "يقلب المعلم المقعد ليظهر عارضة التوازن ويسأل: ما الفرق بين الوجهين؟ ويقدم تمرينات الرجلين (ص 47).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 47: (وقوف مواجه المقعد) تبادل الصعود والنزول، (وقوف جانبًا) القفز على جانبي المقعد، الوثب بالقدمين فوق المقعد، ثم المشي على عارضة التوازن (المقعد المقلوب) مع كيس رمل على الرأس والذراعان جانبًا، مع نقاط الأمان.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: الصعود والنزول بالعد، القفز على الجانبين، الوثب فوق المقعد، المشي على عارضة التوازن بكيس الرمل، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ المشي على سطح المقعد ثم على العارضة الضيقة ويكتشف أيهما يحتاج إلى اتزان أكبر ولماذا.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر تمرينًا للرجلين على المقعد.\nالإجابة: تبادل الصعود والنزول.\nس2 (مستوى التطبيق): كم عرض عارضة التوازن تقريبًا؟\nالإجابة: نحو 10 سم.\nس3 (مستوى الاستدلال): لماذا نفتح الذراعين عند المشي على العارضة؟\nالإجابة: للمحافظة على الاتزان.\n\n• نشاط علاجي (لمن لم يتقن): يحمل المعلم مع التلميذ وثلاثة زملاء المقعد السويدي بثني الركبتين ويضعونه ببطء، ثم يؤديان تمرين ثني الذراعين واليدان على المقعد، ثم يسأله: كم تلميذًا نحتاج لحمل المقعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم محطة من تمرينين على المقعد السويدي (للذراعين والجذع) وأدائهما بالعد، وشرح اعتبارات الأمان عند استخدامه.", "التقويم الختامي": "س1 (مستوى المعرفة): امشِ على عارضة التوازن بكيس رمل على الرأس.\nالإجابة: يؤديه دون سقوط.\nس2 (مستوى التطبيق): أيهما أصعب: المشي على سطح المقعد أم على العارضة؟ ولماذا؟\nالإجابة: العارضة لأنها أضيق فتحتاج إلى اتزان أكبر.\nس3 (مستوى الاستدلال): أدِّ القفز على جانبي المقعد 6 مرات.\nالإجابة: يؤديه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الصعود والنزول على درجة ثابتة بالعد (دليل المعلم ص 47).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=3"}}, {"focus": "محطات ومنافسات التمرينات على المقعد السويدي", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي تمرينات الذراعين والجذع والرجلين على المقعد في محطات متكاملة.\n2. يوظف التمرينات على المقعد في منافسات ومسار.\n3. يقدر أهمية التمرينات على الأجهزة في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: كرات\n- أخرى: أكياس رمل", "المفاهيم": "- المحطات\n- المسار\n- المنافسة\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الأجزاء الثلاثة بنماذج من التلاميذ ويعرض المحطات والمسار.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 49-50: محطة الذراعين، محطة الجذع، محطة الرجلين، محطة عارضة التوازن، بأربع مجموعات بقائد يسجل الأداء الصحيح.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 51: مسار تتابع (صعود ونزول 4 مرات، مشي على العارضة، قفز على الجانبين 4 مرات، ثني الذراعين 3 مرات) بين المجموعات.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: أي عناصر اللياقة نمّتها تمرينات المقعد؟ ليستنتج التلاميذ القوة والاتزان والرشاقة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإعادة المقاعد.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الجذع وعارضة التوازن.\nس2 (مستوى التطبيق): ما ترتيب مسار المنافسة؟\nالإجابة: صعود ونزول، مشي على العارضة، قفز على الجانبين، ثني الذراعين.\nس3 (مستوى الاستدلال): ما عناصر اللياقة التي ننميها بالتمرين على المقعد؟\nالإجابة: القوة والاتزان والرشاقة.\n\n• نشاط علاجي (لمن لم يتقن): يحمل المعلم مع التلميذ وثلاثة زملاء المقعد السويدي بثني الركبتين ويضعونه ببطء، ثم يؤديان تمرين ثني الذراعين واليدان على المقعد، ثم يسأله: كم تلميذًا نحتاج لحمل المقعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم محطة من تمرينين على المقعد السويدي (للذراعين والجذع) وأدائهما بالعد، وشرح اعتبارات الأمان عند استخدامه.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اقترح تمرينًا جديدًا على المقعد والجزء الذي ينميه.\nالإجابة: مثل: رفع الرجلين من الجلوس العالي للرجلين والبطن.\nس3 (مستوى الاستدلال): كيف تساعد التمرينات على الأجهزة في اللياقة؟\nالإجابة: تنوع التدريب وتزيد الجهد فتقوي الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على تمرينات الصعود والنزول والاتزان على سطح منخفض ثابت (دليل المعلم ص 49-51).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات على الأجهزة ومواصفات المقعد السويدي واعتبارات الأمان.\n2. يحمل المقعد السويدي ويضعه بالطريقة الصحيحة مع زملائه.\n3. يؤدي تمرينات للذراعين على المقعد السويدي.\n\nالحصة 2:\n1. يؤدي تمرينات للجذع على المقعد السويدي بالعد.\n2. يميز أنواع التمرينات على المقعد حسب الجزء العامل.\n3. يحافظ على استقامة الجذع وأمان الأداء.\n\nالحصة 3:\n1. يؤدي تمرينات للرجلين على المقعد السويدي (الصعود والنزول، الوثب فوق المقعد، القفز على جانبيه).\n2. يؤدي المشي والاتزان على عارضة التوازن (المقعد المقلوب).\n3. يميز بين التمرين على سطح المقعد والتمرين على عارضة التوازن.\n\nالحصة 4:\n1. يؤدي تمرينات الذراعين والجذع والرجلين على المقعد في محطات متكاملة.\n2. يوظف التمرينات على المقعد في منافسات ومسار.\n3. يقدر أهمية التمرينات على الأجهزة في المحافظة على اللياقة البدنية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: بطاقات مصورة\n\nالحصة 3:\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أكياس رمل\n- أخرى: كرات\n\nالحصة 4:\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: كرات\n- أخرى: أكياس رمل", "المفاهيم": "الحصة 1:\n- التمرينات على الأجهزة\n- المقعد السويدي\n- عارضة التوازن\n- الأمان\n\nالحصة 2:\n- المقعد السويدي\n- الجذع\n- عضلات البطن والظهر\n- الأمان\n\nالحصة 3:\n- الرجلان\n- الصعود والنزول\n- عارضة التوازن\n- الاتزان\n\nالحصة 4:\n- المحطات\n- المسار\n- المنافسة\n- اللياقة البدنية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم المقعد السويدي ويسأل: ما الأجهزة التي نتمرن عليها؟ ويشرح المواصفات واعتبارات الأمان (ص 44).\n\nالحصة 2:\nيراجع المعلم تمرينات الذراعين ويسأل: كيف نتمرن للجذع على المقعد؟ (ص 46).\n\nالحصة 3:\nيقلب المعلم المقعد ليظهر عارضة التوازن ويسأل: ما الفرق بين الوجهين؟ ويقدم تمرينات الرجلين (ص 47).\n\nالحصة 4:\nيراجع المعلم تمرينات الأجزاء الثلاثة بنماذج من التلاميذ ويعرض المحطات والمسار.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج حمل المقعد ورفعه ووضعه (أربعة تلاميذ، ثني الركبتين، النزول ببطء)، ثم نماذج تمرينات الذراعين ص 45: (انبطاح مائل مواجه المقعد. اليدان على المقعد) ثني الذراعين، (انبطاح مائل) تبادل الارتكاز على المقعد باليدين، (جلوس عالٍ. مسك المقعد) رفع الجسم بالذراعين.\n- الطالب: يقلد بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد تحمل مقعدها وتضعه بأمان ثم تؤدي تمرينات الذراعين الثلاثة بالعد ويراقب القائد.\n- الطالب: يحمل ويؤدي.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ ثني الذراعين واليدان على الأرض ثم على المقعد ويكتشف أيهما أسهل، ويستنتج أثر ارتفاع اليدين في الجهد.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإعادة المقاعد بأمان.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 46: (جلوس طويل فتحًا. سند القدمين على المقعد) ميل الجذع للخلف للرقود، (جلوس عالٍ فتحًا. تشابك اليدين خلف الرأس) تبادل ثني الجذع جانبًا، (جلوس على أربع على المقعد) المشي باليدين والقدمين، (جلوس عالٍ. مسك المقعد) ميل الجذع للأمام للمس المشطين، (وقوف نصفًا. القدم على المقعد. الذراعان عاليًا) ميل الجذع، بالعد.\n- الطالب: يقلد بالعد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات على المقاعد: محطة ميل الجذع للخلف، محطة ثني الجذع جانبًا، محطة المشي على أربع، محطة الذراعين (مراجعة)، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (البطاقة والمقعد): يرفع المعلم بطاقة تمرين وتؤديه المجموعة بأسرع وأدق أداء.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 47: (وقوف مواجه المقعد) تبادل الصعود والنزول، (وقوف جانبًا) القفز على جانبي المقعد، الوثب بالقدمين فوق المقعد، ثم المشي على عارضة التوازن (المقعد المقلوب) مع كيس رمل على الرأس والذراعان جانبًا، مع نقاط الأمان.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: الصعود والنزول بالعد، القفز على الجانبين، الوثب فوق المقعد، المشي على عارضة التوازن بكيس الرمل، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ المشي على سطح المقعد ثم على العارضة الضيقة ويكتشف أيهما يحتاج إلى اتزان أكبر ولماذا.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 49-50: محطة الذراعين، محطة الجذع، محطة الرجلين، محطة عارضة التوازن، بأربع مجموعات بقائد يسجل الأداء الصحيح.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 51: مسار تتابع (صعود ونزول 4 مرات، مشي على العارضة، قفز على الجانبين 4 مرات، ثني الذراعين 3 مرات) بين المجموعات.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: أي عناصر اللياقة نمّتها تمرينات المقعد؟ ليستنتج التلاميذ القوة والاتزان والرشاقة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإعادة المقاعد.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): اذكر جهازين من أجهزة التمرينات.\nالإجابة: المقعد السويدي والصندوق المقسم.\nس2 (مستوى التطبيق): كيف نحمل المقعد السويدي بأمان؟\nالإجابة: أربعة تلاميذ بثني الركبتين ووضعه ببطء.\nس3 (مستوى الاستدلال): اذكر تمرينًا للذراعين على المقعد.\nالإجابة: ثني الذراعين من الانبطاح المائل واليدان على المقعد.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر تمرينًا للجذع على المقعد.\nالإجابة: ميل الجذع للخلف من الجلوس الطويل والقدمان على المقعد.\nس2 (مستوى التطبيق): أي العضلات تعمل في ميل الجذع للخلف؟\nالإجابة: عضلات البطن.\nس3 (مستوى الاستدلال): كيف يكون الظهر في تمرينات الجذع؟\nالإجابة: مستقيمًا.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر تمرينًا للرجلين على المقعد.\nالإجابة: تبادل الصعود والنزول.\nس2 (مستوى التطبيق): كم عرض عارضة التوازن تقريبًا؟\nالإجابة: نحو 10 سم.\nس3 (مستوى الاستدلال): لماذا نفتح الذراعين عند المشي على العارضة؟\nالإجابة: للمحافظة على الاتزان.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الجذع وعارضة التوازن.\nس2 (مستوى التطبيق): ما ترتيب مسار المنافسة؟\nالإجابة: صعود ونزول، مشي على العارضة، قفز على الجانبين، ثني الذراعين.\nس3 (مستوى الاستدلال): ما عناصر اللياقة التي ننميها بالتمرين على المقعد؟\nالإجابة: القوة والاتزان والرشاقة.\n\n• نشاط علاجي (لمن لم يتقن): يحمل المعلم مع التلميذ وثلاثة زملاء المقعد السويدي بثني الركبتين ويضعونه ببطء، ثم يؤديان تمرين ثني الذراعين واليدان على المقعد، ثم يسأله: كم تلميذًا نحتاج لحمل المقعد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم محطة من تمرينين على المقعد السويدي (للذراعين والجذع) وأدائهما بالعد، وشرح اعتبارات الأمان عند استخدامه.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ ثني الذراعين واليدان على المقعد 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): لماذا كان التمرين أسهل واليدان على المقعد؟\nالإجابة: لأن ارتفاع اليدين يقلل الحمل على الذراعين.\nس3 (مستوى الاستدلال): اذكر اعتبارًا للأمان عند التمرين على المقعد.\nالإجابة: ترك مسافة بين التلاميذ والتأكد من ثبات المقعد.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ تبادل ثني الجذع جانبًا من الجلوس العالي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): صنف: (جلوس على أربع على المقعد) المشي باليدين والقدمين.\nالإجابة: تمرين للذراعين والجذع.\nس3 (مستوى الاستدلال): لماذا نسند القدمين على المقعد في تمرين ميل الجذع للخلف؟\nالإجابة: لتثبيت الرجلين فتعمل عضلات البطن.\n\nالحصة 3:\nس1 (مستوى المعرفة): امشِ على عارضة التوازن بكيس رمل على الرأس.\nالإجابة: يؤديه دون سقوط.\nس2 (مستوى التطبيق): أيهما أصعب: المشي على سطح المقعد أم على العارضة؟ ولماذا؟\nالإجابة: العارضة لأنها أضيق فتحتاج إلى اتزان أكبر.\nس3 (مستوى الاستدلال): أدِّ القفز على جانبي المقعد 6 مرات.\nالإجابة: يؤديه.\n\nالحصة 4:\nس1 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اقترح تمرينًا جديدًا على المقعد والجزء الذي ينميه.\nالإجابة: مثل: رفع الرجلين من الجلوس العالي للرجلين والبطن.\nس3 (مستوى الاستدلال): كيف تساعد التمرينات على الأجهزة في اللياقة؟\nالإجابة: تنوع التدريب وتزيد الجهد فتقوي الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان عند استخدام الأجهزة (دليل المعلم ص 44-45).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا للجذع بسند القدمين على كرسي ثابت (دليل المعلم ص 46).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طفلك على الصعود والنزول على درجة ثابتة بالعد (دليل المعلم ص 47).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طفلك على تمرينات الصعود والنزول والاتزان على سطح منخفض ثابت (دليل المعلم ص 49-51).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=3"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 18-25 (البرامج المنهجية)", "n": 2, "periods": [{"focus": "الممارسات الصحية: الوزن الصحي والنشاط البدني", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم الوزن الصحي وعلاقته بالنشاط البدني والغذاء.\n2. يميز العادات التي تحافظ على الوزن الصحي من العادات الضارة.\n3. يقدر أهمية النشاط البدني اليومي للمحافظة على الوزن الصحي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: ميزان\n- أخرى: أقماع\n- أخرى: كرات", "المفاهيم": "- الوزن الصحي\n- النشاط البدني\n- الطاقة\n- الغذاء الصحي", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ميزان وصور عادات يومية ويسأل: ما الذي يجعل وزننا صحيًا؟ ويقدم برنامج (الوزن الصحي) ص 23.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور: الطاقة الداخلة من الطعام والخارجة بالحركة، والعادات الصحية (لعب ساعة يوميًا، فطور صحي، ماء، نوم مبكر) والضارة (شاشة طويلة، وجبات سريعة كثيرة).\n- الطالب: يستمع ويصنف البطاقات.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الطاقة): مسار محطات يمثل اليوم الصحي (مشي للمدرسة، لعب في الفسحة، رياضة عصرًا) بالتتابع.\n- الطالب: يلعب.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تضع كل مجموعة ثلاث نصائح للوزن الصحي وتعرضها بالتمثيل.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة اليوم.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الذي يساعد على الوزن الصحي؟\nالإجابة: النشاط البدني اليومي والغذاء الصحي.\nس2 (مستوى التطبيق): اذكر عادة ضارة بالوزن.\nالإجابة: الجلوس الطويل أمام الشاشة أو الإكثار من الوجبات السريعة.\nس3 (مستوى الاستدلال): كم وقتًا ننصح باللعب يوميًا؟\nالإجابة: ساعة على الأقل.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات عادات (لعب يومي، ووجبات سريعة كثيرة، وجلوس طويل أمام الشاشة، وفاكهة) ويفرزها مع التلميذ إلى ما يحافظ على الوزن الصحي وما يضره، ثم يسأله: اذكر عادة ضارة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة يوم صحي مرسومة تجمع وجبات متوازنة وساعة لعب على الأقل، وعرضها على زملائهم في المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة طفل يركب الدراجة، أهي عادة صحية؟ ولماذا؟\nالإجابة: نعم لأنها تحرك الجسم وتصرف الطاقة.\nس2 (مستوى التطبيق): اذكر نصيحة قدمتها مجموعتك.\nالإجابة: مثل: فطور صحي يوميًا.\nس3 (مستوى الاستدلال): كيف يحافظ النشاط البدني على الوزن الصحي؟\nالإجابة: يصرف الطاقة الزائدة من الطعام ويقوي الجسم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ساعة حركة يوميًا وفطور صحي (برنامج الوزن الصحي، دليل المعلم ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=4"}}, {"focus": "المهرجان الرياضي التعليمي للتمرينات (العصا، المقعد السويدي)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي التمرينات بالعصا وعلى المقعد السويدي ضمن أقسام المهرجان.\n2. يطبق قواعد الأقسام والأمان مع الأدوات والأجهزة.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: عصي\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: حبال\n- أخرى: أقماع\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء ولايات مع قائد ويعرض الأقسام (ص 18-20).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم التمرينات الفردية بالعصا، قسم التمرينات الزوجية بالعصا، قسم المقعد السويدي (ذراعان، جذع، رجلان)، قسم جمباز الموانع المبسط (عارضة التوازن، وثب فوق الحبال)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع يجمع العصا والمقعد.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى المعرفة): ما القسم الذي استخدمنا فيه العصا مع الزميل؟\nالإجابة: قسم التمرينات الزوجية بالعصا.\nس2 (مستوى التطبيق): اذكر تمرينًا أديته على المقعد.\nالإجابة: مثل: الصعود والنزول.\nس3 (مستوى الاستدلال): ما قاعدة الأمان مع العصا؟\nالإجابة: المسافة الكافية وعدم رميها نحو الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات عادات (لعب يومي، ووجبات سريعة كثيرة، وجلوس طويل أمام الشاشة، وفاكهة) ويفرزها مع التلميذ إلى ما يحافظ على الوزن الصحي وما يضره، ثم يسأله: اذكر عادة ضارة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة يوم صحي مرسومة تجمع وجبات متوازنة وساعة لعب على الأقل، وعرضها على زملائهم في المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الفردية بالعصا، الزوجية بالعصا، المقعد السويدي، جمباز الموانع.\nس2 (مستوى التطبيق): ما دورك في مجموعتك؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تعبر عن روحك الرياضية؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على التمرين اليومي (دليل المعلم ص 32-52).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم الوزن الصحي وعلاقته بالنشاط البدني والغذاء.\n2. يميز العادات التي تحافظ على الوزن الصحي من العادات الضارة.\n3. يقدر أهمية النشاط البدني اليومي للمحافظة على الوزن الصحي.\n\nالحصة 2:\n1. يؤدي التمرينات بالعصا وعلى المقعد السويدي ضمن أقسام المهرجان.\n2. يطبق قواعد الأقسام والأمان مع الأدوات والأجهزة.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: ميزان\n- أخرى: أقماع\n- أخرى: كرات\n\nالحصة 2:\n- أخرى: عصي\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: حبال\n- أخرى: أقماع\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الوزن الصحي\n- النشاط البدني\n- الطاقة\n- الغذاء الصحي\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- المحطات\n- التمرينات\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة ميزان وصور عادات يومية ويسأل: ما الذي يجعل وزننا صحيًا؟ ويقدم برنامج (الوزن الصحي) ص 23.\n\nالحصة 2:\nيعلن المعلم مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء ولايات مع قائد ويعرض الأقسام (ص 18-20).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور: الطاقة الداخلة من الطعام والخارجة بالحركة، والعادات الصحية (لعب ساعة يوميًا، فطور صحي، ماء، نوم مبكر) والضارة (شاشة طويلة، وجبات سريعة كثيرة).\n- الطالب: يستمع ويصنف البطاقات.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الطاقة): مسار محطات يمثل اليوم الصحي (مشي للمدرسة، لعب في الفسحة، رياضة عصرًا) بالتتابع.\n- الطالب: يلعب.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تضع كل مجموعة ثلاث نصائح للوزن الصحي وتعرضها بالتمثيل.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة اليوم.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم التمرينات الفردية بالعصا، قسم التمرينات الزوجية بالعصا، قسم المقعد السويدي (ذراعان، جذع، رجلان)، قسم جمباز الموانع المبسط (عارضة التوازن، وثب فوق الحبال)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع يجمع العصا والمقعد.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الذي يساعد على الوزن الصحي؟\nالإجابة: النشاط البدني اليومي والغذاء الصحي.\nس2 (مستوى التطبيق): اذكر عادة ضارة بالوزن.\nالإجابة: الجلوس الطويل أمام الشاشة أو الإكثار من الوجبات السريعة.\nس3 (مستوى الاستدلال): كم وقتًا ننصح باللعب يوميًا؟\nالإجابة: ساعة على الأقل.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما القسم الذي استخدمنا فيه العصا مع الزميل؟\nالإجابة: قسم التمرينات الزوجية بالعصا.\nس2 (مستوى التطبيق): اذكر تمرينًا أديته على المقعد.\nالإجابة: مثل: الصعود والنزول.\nس3 (مستوى الاستدلال): ما قاعدة الأمان مع العصا؟\nالإجابة: المسافة الكافية وعدم رميها نحو الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات عادات (لعب يومي، ووجبات سريعة كثيرة، وجلوس طويل أمام الشاشة، وفاكهة) ويفرزها مع التلميذ إلى ما يحافظ على الوزن الصحي وما يضره، ثم يسأله: اذكر عادة ضارة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة يوم صحي مرسومة تجمع وجبات متوازنة وساعة لعب على الأقل، وعرضها على زملائهم في المهرجان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة طفل يركب الدراجة، أهي عادة صحية؟ ولماذا؟\nالإجابة: نعم لأنها تحرك الجسم وتصرف الطاقة.\nس2 (مستوى التطبيق): اذكر نصيحة قدمتها مجموعتك.\nالإجابة: مثل: فطور صحي يوميًا.\nس3 (مستوى الاستدلال): كيف يحافظ النشاط البدني على الوزن الصحي؟\nالإجابة: يصرف الطاقة الزائدة من الطعام ويقوي الجسم.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الفردية بالعصا، الزوجية بالعصا، المقعد السويدي، جمباز الموانع.\nس2 (مستوى التطبيق): ما دورك في مجموعتك؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تعبر عن روحك الرياضية؟\nالإجابة: أهنئ الفائزين وأتدرب لأتحسن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على ساعة حركة يوميًا وفطور صحي (برنامج الوزن الصحي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على التمرين اليومي (دليل المعلم ص 32-52).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=4"}}, {"title": "تمرينات الموانع (جمباز الموانع)", "unit": "التمرينات (أتمرن بنظام)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 53-59", "n": 2, "periods": [{"focus": "توظيف الأدوات والأجهزة في تمرينات الموانع", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع والأدوات والأجهزة المستخدمة فيها (نفق المرور، سلم الرشاقة، الصندوق المقسم).\n2. يوظف التمرينات بالعصا والمقعد في أداء تمرينات الموانع.\n3. يبتكر طريقة لتخطي مانع معين.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: كرات طبية\n- أخرى: أطواق\n- أخرى: عصي\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: نفق المرور\n- أخرى: مراتب", "المفاهيم": "- تمرينات الموانع\n- المانع\n- الابتكار\n- التخطي", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم مجموعة الأدوات ويسأل: كم طريقة تعرفون لتخطي هذا المانع؟ ويذكر أن الموانع تتيح التفكير والابتكار (ص 53-54).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نماذج التخطي: الزحف داخل نفق المرور، الجري في سلم الرشاقة، الوثب فوق العصي، المشي على المقعد، المروق داخل الصندوق المقسم، الوثب فوق الحبل، مع الأمان.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط ابتكار: تعطى كل مجموعة ثلاثة موانع وتبتكر طريقتين لتخطي كل مانع، ثم تعرض وتختار الصف الأسرع والآمن.\n- الطالب: يبتكر ويعرض ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تؤدي كل مجموعة مسارًا قصيرًا بالتتابع بالطرق المختارة.\n- الطالب: يؤدي المسار.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر أداتين تستخدمان موانع.\nالإجابة: نفق المرور وسلم الرشاقة.\nس2 (مستوى التطبيق): كيف نتخطى نفق المرور؟\nالإجابة: بالزحف داخله.\nس3 (مستوى الاستدلال): لماذا تنمي تمرينات الموانع التفكير؟\nالإجابة: لأننا نختار طريقة التخطي ونبتكر.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (الزحف داخل نفق المرور، ثم الخطو في سلم الرشاقة)، ثم يطلب منه اجتياز النفق وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار طريقة جديدة آمنة لتخطي الصندوق المقسم أو المقعد، ثم اجتياز مسار موانع متكامل يجمع النفق والسلم والعصا.", "التقويم الختامي": "س1 (مستوى المعرفة): ابتكر طريقتين لتخطي المقعد السويدي.\nالإجابة: المشي عليه أو القفز على جانبيه.\nس2 (مستوى التطبيق): أدِّ المروق داخل الصندوق المقسم ثم الوثب فوق الحبل.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): أي الطرق التي ابتكرتها مجموعتك كانت الأسرع ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا وشجعه على ابتكار طرق التخطي بأمان (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=5"}}, {"focus": "مسارات ومنافسات تمرينات الموانع", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي مسار موانع متكاملًا بالحركات الصحيحة.\n2. يوظف الحركات والمهارات (تسلق، زحف، وثب، رمي، محاورة) في منافسات الموانع.\n3. يشعر بالثقة في النفس ويستمتع بمشاركة زملائه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: نفق المرور\n- أخرى: مراتب", "المفاهيم": "- مسار الموانع\n- التتابع\n- الثقة بالنفس\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم طرق التخطي ويعرض مسار اليوم (سلم الرشاقة، نفق، مقعد، حواجز، رمي الكرة في الطوق، دحرجة).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد تؤدي المسار مرتين ويصحح القائد الحركة في كل مانع (ص 57-58).\n- الطالب: يؤدي ويصحح.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة بين المجموعات بالتتابع مع احتساب الأداء الصحيح والزمن (ص 59).\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: أي مانع احتاج إلى دقة أكثر من سرعة؟ ليستنتج التلاميذ أن الرمي في الطوق يحتاج إلى دقة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: سلم الرشاقة، الزحف في النفق، المشي على المقعد، الوثب فوق الحواجز، رمي الكرة، الدحرجة.\nس2 (مستوى التطبيق): أي مانع احتاج إلى الدقة؟\nالإجابة: رمي الكرة في الطوق.\nس3 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (الزحف داخل نفق المرور، ثم الخطو في سلم الرشاقة)، ثم يطلب منه اجتياز النفق وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار طريقة جديدة آمنة لتخطي الصندوق المقسم أو المقعد، ثم اجتياز مسار موانع متكامل يجمع النفق والسلم والعصا.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف شعرت بعد تخطي الموانع؟\nالإجابة: يعبر عن الثقة.\nس3 (مستوى الاستدلال): اقترح مانعًا جديدًا يحتاج إلى المحاورة.\nالإجابة: أقماع للتنطيط المتعرج بالكرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على مسار موانع آمن وتسجيل زمنه (دليل المعلم ص 57-59).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع والأدوات والأجهزة المستخدمة فيها (نفق المرور، سلم الرشاقة، الصندوق المقسم).\n2. يوظف التمرينات بالعصا والمقعد في أداء تمرينات الموانع.\n3. يبتكر طريقة لتخطي مانع معين.\n\nالحصة 2:\n1. يؤدي مسار موانع متكاملًا بالحركات الصحيحة.\n2. يوظف الحركات والمهارات (تسلق، زحف، وثب، رمي، محاورة) في منافسات الموانع.\n3. يشعر بالثقة في النفس ويستمتع بمشاركة زملائه.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 2:\nالمخرج 1: تطبيق\nا استراتيجية: التعلم التعاوني\n- المعلم: مجموعات بقائد تؤدي المسار مرتين ويصحح القائد الحركة في كل مانع (ص 57-58).\n- الطالب: يؤدي ويصحح.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة بين المجموعات بالتتابع مع احتساب الأداء الصحيح والزمن (ص 59).\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: أي مانع احتاج إلى دقة أكثر من سرعة؟ ليستنتج التلاميذ أن الرمي في الطوق يحتاج إلى دقة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): اذكر أداتين تستخدمان موانع.\nالإجابة: نفق المرور وسلم الرشاقة.\nس2 (مستوى التطبيق): كيف نتخطى نفق المرور؟\nالإجابة: بالزحف داخله.\nس3 (مستوى الاستدلال): لماذا تنمي تمرينات الموانع التفكير؟\nالإجابة: لأننا نختار طريقة التخطي ونبتكر.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر حركات مسار اليوم بالترتيب.\nالإجابة: سلم الرشاقة، الزحف في النفق، المشي على المقعد، الوثب فوق الحواجز، رمي الكرة، الدحرجة.\nس2 (مستوى التطبيق): أي مانع احتاج إلى الدقة؟\nالإجابة: رمي الكرة في الطوق.\nس3 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.\n\n• نشاط علاجي (لمن لم يتقن): يجتاز المعلم مع التلميذ مانعًا واحدًا كل مرة ببطء (الزحف داخل نفق المرور، ثم الخطو في سلم الرشاقة)، ثم يطلب منه اجتياز النفق وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار طريقة جديدة آمنة لتخطي الصندوق المقسم أو المقعد، ثم اجتياز مسار موانع متكامل يجمع النفق والسلم والعصا.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ابتكر طريقتين لتخطي المقعد السويدي.\nالإجابة: المشي عليه أو القفز على جانبيه.\nس2 (مستوى التطبيق): أدِّ المروق داخل الصندوق المقسم ثم الوثب فوق الحبل.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): أي الطرق التي ابتكرتها مجموعتك كانت الأسرع ولماذا؟\nالإجابة: يذكر ويعلل.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف شعرت بعد تخطي الموانع؟\nالإجابة: يعبر عن الثقة.\nس3 (مستوى الاستدلال): اقترح مانعًا جديدًا يحتاج إلى المحاورة.\nالإجابة: أقماع للتنطيط المتعرج بالكرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ابنِ مع طفلك مسار موانع منزليًا وشجعه على ابتكار طرق التخطي بأمان (دليل المعلم ص 54-56).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على مسار موانع آمن وتسجيل زمنه (دليل المعلم ص 57-59).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=5"}}, {"title": "الاتزان", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 60-69", "n": 2, "periods": [{"focus": "الاتزان الثابت (اتزان الانبطاح المائل الجانبي والجلوس الهوائي)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الاتزان وأنواعه وعلاقته بمركز الثقل وقاعدة الارتكاز.\n2. يؤدي اتزان الانبطاح المائل الجانبي واتزان الجلوس الهوائي على المقعد.\n3. يميز بين الارتكاز على نقطة ونقطتين من حيث الصعوبة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: مقاعد سويدية\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- الاتزان الثابت\n- مركز الثقل\n- قاعدة الارتكاز\n- الانبطاح المائل الجانبي\n- الجلوس الهوائي", "التهيئة / التمهيد / التعلم القبلي": "يقف المعلم على قدم واحدة ثم يرفع يدًا ورجلًا من الانبطاح الجانبي ويسأل: على كم نقطة أرتكز؟ ويقدم مركز الثقل وقاعدة الارتكاز (ص 61).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 61-62: اتزان الانبطاح المائل الجانبي (انبطاح على الجانب، الارتكاز على يد وقدم، رفع الجذع وفرد الذراع والرجل الحرة عاليًا والنظر للأمام)، والجلوس الهوائي (جلوس عالٍ على المقعد، استناد اليدين ورفع الجسم وفرد الرجلين أمامًا والثبات).\n- الطالب: يقلد ويثبت 5 ثوانٍ.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ الاتزان على نقطتين ثم على نقطة واحدة، وبقاعدة واسعة ثم ضيقة، ويكتشف ما يسهل الاتزان، ويصوغ القاعدة مع المعلم.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط (الاتزان الثابت) ص 66: جري في المكان داخل الأطواق وعند النداء الثبات في وضع الاتزان المطلوب أطول مدة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الاتزان؟\nالإجابة: المحافظة على ثبات مركز ثقل الجسم بالنسبة لقاعدة الارتكاز.\nس2 (مستوى التطبيق): على كم نقطة نرتكز في الانبطاح المائل الجانبي؟\nالإجابة: نقطتين (يد وقدم).\nس3 (مستوى الاستدلال): متى يكون الاتزان أسهل: بقاعدة واسعة أم ضيقة؟\nالإجابة: بقاعدة واسعة.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الاتزان بقاعدة واسعة (القدمان متباعدتان) ثم ضيقة ثم على قدم واحدة، ويلاحظان صعوبة كل منها، ثم يسأله: متى يكون الاتزان أسهل؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء اتزان الانبطاح المائل الجانبي على نقطتين ثم الجلوس الهوائي على المقعد، وتفسير العلاقة بين قاعدة الارتكاز ومركز الثقل.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الجلوس الهوائي على المقعد 5 ثوانٍ.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر مثالًا رياضيًا على الاتزان الثابت.\nالإجابة: بعض حركات الجمباز (الميزان).\nس3 (مستوى الاستدلال): لماذا يصعب الاتزان على نقطة واحدة؟\nالإجابة: لأن قاعدة الارتكاز صغيرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الثبات في وضع الانبطاح المائل الجانبي 10 ثوانٍ لكل جانب (دليل المعلم ص 61-62).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=6"}}, {"focus": "الاتزان الحركي (اتزان الحجل بالأداة، واتزان الوثب الجانبي)", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز بين الاتزان الثابت والحركي.\n2. يؤدي الحجل مع قمع على مشط الرجل الحرة دون سقوطه والوثب الجانبي والهبوط على الرجل الحرة والثبات.\n3. يوظف حركات الاتزان في المسابقات والألعاب.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع صغيرة\n- أخرى: أطواق مطاطية\n- أخرى: مقاعد سويدية\n- أخرى: مراتب", "المفاهيم": "- الاتزان الحركي\n- الحجل بالأداة\n- الوثب الجانبي\n- الرجل الحرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الاتزان الثابت ثم يحجل وعلى قدمه قمع ويسأل: ما نوع هذا الاتزان؟ (ص 62-63).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف على قدم ومد الرجل الحرة أمامًا والمشط للأعلى، وضع القمع عليه، الحجل للأمام مع المحافظة على ثباته؛ ثم الوثب الجانبي (رفع الرجل الحرة للخلف والجانب، الوثب بقدم الارتكاز باتجاهها، الهبوط على الرجل الحرة والثبات 2-3 ثوانٍ، التكرار للجانب الآخر).\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الاتزان ص 66-67: الحجل بالقمع، الوثب الجانبي، الانبطاح المائل الجانبي، الجلوس الهوائي، مع التبديل وتسجيل القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: من يحجل أبعد مسافة دون سقوط القمع.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الفرق بين الاتزان الثابت والحركي؟\nالإجابة: الثابت في وضع ثابت، والحركي أثناء أداء حركة.\nس2 (مستوى التطبيق): أين نضع القمع في اتزان الحجل بالأداة؟\nالإجابة: على مشط الرجل الحرة.\nس3 (مستوى الاستدلال): على أي رجل نهبط في الوثب الجانبي؟\nالإجابة: على الرجل الحرة.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الاتزان بقاعدة واسعة (القدمان متباعدتان) ثم ضيقة ثم على قدم واحدة، ويلاحظان صعوبة كل منها، ثم يسأله: متى يكون الاتزان أسهل؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء اتزان الانبطاح المائل الجانبي على نقطتين ثم الجلوس الهوائي على المقعد، وتفسير العلاقة بين قاعدة الارتكاز ومركز الثقل.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الحجل 5 مرات والقمع على قدمك.\nالإجابة: يؤديه دون سقوط القمع.\nس2 (مستوى التطبيق): اذكر مهارة رياضية تحتاج إلى الاتزان الحركي.\nالإجابة: المراوغة والخداع في كرة القدم أو حركات الوثب في التمرينات الفنية.\nس3 (مستوى الاستدلال): كم ثانية نثبت بعد الهبوط في الوثب الجانبي؟\nالإجابة: 2-3 ثوانٍ.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الحجل وعلى قدمه كيس صغير دون سقوطه (دليل المعلم ص 62-68).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الاتزان وأنواعه وعلاقته بمركز الثقل وقاعدة الارتكاز.\n2. يؤدي اتزان الانبطاح المائل الجانبي واتزان الجلوس الهوائي على المقعد.\n3. يميز بين الارتكاز على نقطة ونقطتين من حيث الصعوبة.\n\nالحصة 2:\n1. يميز بين الاتزان الثابت والحركي.\n2. يؤدي الحجل مع قمع على مشط الرجل الحرة دون سقوطه والوثب الجانبي والهبوط على الرجل الحرة والثبات.\n3. يوظف حركات الاتزان في المسابقات والألعاب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: مقاعد سويدية\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع صغيرة\n- أخرى: أطواق مطاطية\n- أخرى: مقاعد سويدية\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- الاتزان الثابت\n- مركز الثقل\n- قاعدة الارتكاز\n- الانبطاح المائل الجانبي\n- الجلوس الهوائي\n\nالحصة 2:\n- الاتزان الحركي\n- الحجل بالأداة\n- الوثب الجانبي\n- الرجل الحرة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيقف المعلم على قدم واحدة ثم يرفع يدًا ورجلًا من الانبطاح الجانبي ويسأل: على كم نقطة أرتكز؟ ويقدم مركز الثقل وقاعدة الارتكاز (ص 61).\n\nالحصة 2:\nيراجع المعلم الاتزان الثابت ثم يحجل وعلى قدمه قمع ويسأل: ما نوع هذا الاتزان؟ (ص 62-63).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 61-62: اتزان الانبطاح المائل الجانبي (انبطاح على الجانب، الارتكاز على يد وقدم، رفع الجذع وفرد الذراع والرجل الحرة عاليًا والنظر للأمام)، والجلوس الهوائي (جلوس عالٍ على المقعد، استناد اليدين ورفع الجسم وفرد الرجلين أمامًا والثبات).\n- الطالب: يقلد ويثبت 5 ثوانٍ.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلميذ الاتزان على نقطتين ثم على نقطة واحدة، وبقاعدة واسعة ثم ضيقة، ويكتشف ما يسهل الاتزان، ويصوغ القاعدة مع المعلم.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط (الاتزان الثابت) ص 66: جري في المكان داخل الأطواق وعند النداء الثبات في وضع الاتزان المطلوب أطول مدة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الوقوف على قدم ومد الرجل الحرة أمامًا والمشط للأعلى، وضع القمع عليه، الحجل للأمام مع المحافظة على ثباته؛ ثم الوثب الجانبي (رفع الرجل الحرة للخلف والجانب، الوثب بقدم الارتكاز باتجاهها، الهبوط على الرجل الحرة والثبات 2-3 ثوانٍ، التكرار للجانب الآخر).\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الاتزان ص 66-67: الحجل بالقمع، الوثب الجانبي، الانبطاح المائل الجانبي، الجلوس الهوائي، مع التبديل وتسجيل القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: من يحجل أبعد مسافة دون سقوط القمع.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الاتزان؟\nالإجابة: المحافظة على ثبات مركز ثقل الجسم بالنسبة لقاعدة الارتكاز.\nس2 (مستوى التطبيق): على كم نقطة نرتكز في الانبطاح المائل الجانبي؟\nالإجابة: نقطتين (يد وقدم).\nس3 (مستوى الاستدلال): متى يكون الاتزان أسهل: بقاعدة واسعة أم ضيقة؟\nالإجابة: بقاعدة واسعة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الفرق بين الاتزان الثابت والحركي؟\nالإجابة: الثابت في وضع ثابت، والحركي أثناء أداء حركة.\nس2 (مستوى التطبيق): أين نضع القمع في اتزان الحجل بالأداة؟\nالإجابة: على مشط الرجل الحرة.\nس3 (مستوى الاستدلال): على أي رجل نهبط في الوثب الجانبي؟\nالإجابة: على الرجل الحرة.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ الاتزان بقاعدة واسعة (القدمان متباعدتان) ثم ضيقة ثم على قدم واحدة، ويلاحظان صعوبة كل منها، ثم يسأله: متى يكون الاتزان أسهل؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء اتزان الانبطاح المائل الجانبي على نقطتين ثم الجلوس الهوائي على المقعد، وتفسير العلاقة بين قاعدة الارتكاز ومركز الثقل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الجلوس الهوائي على المقعد 5 ثوانٍ.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر مثالًا رياضيًا على الاتزان الثابت.\nالإجابة: بعض حركات الجمباز (الميزان).\nس3 (مستوى الاستدلال): لماذا يصعب الاتزان على نقطة واحدة؟\nالإجابة: لأن قاعدة الارتكاز صغيرة.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الحجل 5 مرات والقمع على قدمك.\nالإجابة: يؤديه دون سقوط القمع.\nس2 (مستوى التطبيق): اذكر مهارة رياضية تحتاج إلى الاتزان الحركي.\nالإجابة: المراوغة والخداع في كرة القدم أو حركات الوثب في التمرينات الفنية.\nس3 (مستوى الاستدلال): كم ثانية نثبت بعد الهبوط في الوثب الجانبي؟\nالإجابة: 2-3 ثوانٍ.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على الثبات في وضع الانبطاح المائل الجانبي 10 ثوانٍ لكل جانب (دليل المعلم ص 61-62).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على الحجل وعلى قدمه كيس صغير دون سقوطه (دليل المعلم ص 62-68).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=6"}}, {"title": "البراعة الحركية", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 70-79", "n": 2, "periods": [{"focus": "حركات التقليد والبراعة الفردية (الوثب بالقدمين للأمام، المشي من الإقعاء، الوثب مع لمس العقبين، تلويحة الرجلين)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركات البراعة الحركية وأهميتها.\n2. يؤدي الوثب بالقدمين للأمام (الكنغر) والمشي من الإقعاء والوثب مع لمس العقبين وتلويحة الرجلين.\n3. يميز بين حركات البراعة الحركية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- البراعة الحركية\n- التقليد\n- تلويحة الرجلين\n- الإقعاء", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور الكنغر والطيور ويسأل: كيف نقلد حركتهما ببراعة؟ ويقدم حركات البراعة (ص 70-71).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 71-72: الوثب بالقدمين للأمام مع ثني بسيط للذراعين (الكنغر)، المشي من الإقعاء واليدان على الركبتين (مشي الطيور)، الوثب لأعلى مع لمس اليدين للعقبين، تلويحة الرجلين من الانبطاح المائل (دفع الأرض بالقدمين وتمرير الرجلين بين اليدين للانبطاح المائل المقلوب)، مع الأمان.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 75: قطارات، يؤدي كل تلميذ الوثب بالقدمين داخل الأطواق ثم المشي من الإقعاء ثم الوثب مع لمس العقبين على المرتبة ثم العودة، ويسجل القائد الأداء الجميل.\n- الطالب: يؤدي المسار.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (خمن الحركة): تؤدي مجموعة حركة براعة وتسميها الأخرى.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما حركة الكنغر؟\nالإجابة: الوثب بالقدمين للأمام مع ثني بسيط للذراعين.\nس2 (مستوى التطبيق): من أي وضع نبدأ تلويحة الرجلين؟\nالإجابة: من الانبطاح المائل.\nس3 (مستوى الاستدلال): ماذا نلمس في الوثب مع لمس العقبين؟\nالإجابة: العقبين باليدين في الهواء.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ حركة الكنغر بالتدرج: وثبات قصيرة بالقدمين معًا للأمام فوق خطوط على الأرض، ثم يطلب منه أداء ثلاث وثبات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: الكنغر ثم الوثب مع لمس العقبين ثم تلويحة الرجلين من الانبطاح المائل، والحجل مع زميل بتوافق.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ المشي من الإقعاء 5 خطوات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الوثب بالقدمين للأمام والوثب مع لمس العقبين؟\nالإجابة: الأول انتقال للأمام والثاني في المكان مع لمس العقبين.\nس3 (مستوى الاستدلال): اذكر حركتي براعة تعلمتهما اليوم.\nالإجابة: الكنغر وتلويحة الرجلين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على أداء حركات التقليد (الكنغر، مشي الطيور) على سجادة بأمان (دليل المعلم ص 71-75).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=7"}}, {"focus": "البراعة مع الزميل (الحجل مع الزميل) وألعاب البراعة", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الحجل مع الزميل بالتوافق.\n2. يشارك زملاءه أنشطة متنوعة لحركات البراعة الحركية.\n3. يشعر بالثقة في النفس أثناء أدائه حركات البراعة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: كرات متنوعة\n- أخرى: أعلام ملونة\n- أخرى: أقماع", "المفاهيم": "- البراعة مع الزميل\n- الحجل مع الزميل\n- التوافق\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم حركات البراعة الفردية ثم يؤدي مع تلميذ الحجل وهما ممسكان بقدم بعضهما ويسأل: ما الذي يجعلها صعبة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ النموذج ص 73: تلميذان متجاوران، كل منهما يمسك بيده الخارجية قدم زميله المرفوعة، الحجل معًا للأمام بتوافق، ثم حركات أخرى مع الزميل (الوثب معًا بمسك اليدين، الوقوف على قدم متقابلين).\n- الطالب: يؤدي مع زميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 ص 76: ثنائيات على محيط المستطيل تجري وعند النداء تدخل طوقًا وتؤدي حركة براعة مشتركة يحددها المعلم.\n- الطالب: يؤدي مع زميله.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 ص 77: مسابقة الأعلام: ترفع المجموعة علمًا بلون الحركة التي أداها القائد (أحمر كنغر، أخضر تلويحة...).\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الثقة.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف نؤدي الحجل مع الزميل؟\nالإجابة: نمسك قدم الزميل المرفوعة ونحجل معًا بتوافق.\nس2 (مستوى التطبيق): لماذا نحتاج إلى التوافق مع الزميل؟\nالإجابة: حتى نحجل بالإيقاع نفسه ولا نسقط.\nس3 (مستوى الاستدلال): اذكر حركة براعة أخرى مع الزميل.\nالإجابة: الوقوف على قدم متقابلين مع مسك اليدين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ حركة الكنغر بالتدرج: وثبات قصيرة بالقدمين معًا للأمام فوق خطوط على الأرض، ثم يطلب منه أداء ثلاث وثبات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: الكنغر ثم الوثب مع لمس العقبين ثم تلويحة الرجلين من الانبطاح المائل، والحجل مع زميل بتوافق.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الحجل مع زميلك 5 حجلات.\nالإجابة: يؤديانه بتوافق.\nس2 (مستوى التطبيق): ما الحركة التي يرمز لها العلم الأحمر في لعبة اليوم؟\nالإجابة: الكنغر (حسب الاتفاق).\nس3 (مستوى الاستدلال): كيف شعرت عند أداء الحركات أمام زملائك؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك الحجل مع الزميل بمسك القدم (دليل المعلم ص 73-78).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركات البراعة الحركية وأهميتها.\n2. يؤدي الوثب بالقدمين للأمام (الكنغر) والمشي من الإقعاء والوثب مع لمس العقبين وتلويحة الرجلين.\n3. يميز بين حركات البراعة الحركية.\n\nالحصة 2:\n1. يؤدي الحجل مع الزميل بالتوافق.\n2. يشارك زملاءه أنشطة متنوعة لحركات البراعة الحركية.\n3. يشعر بالثقة في النفس أثناء أدائه حركات البراعة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: كرات متنوعة\n- أخرى: أعلام ملونة\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- البراعة الحركية\n- التقليد\n- تلويحة الرجلين\n- الإقعاء\n\nالحصة 2:\n- البراعة مع الزميل\n- الحجل مع الزميل\n- التوافق\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور الكنغر والطيور ويسأل: كيف نقلد حركتهما ببراعة؟ ويقدم حركات البراعة (ص 70-71).\n\nالحصة 2:\nيراجع المعلم حركات البراعة الفردية ثم يؤدي مع تلميذ الحجل وهما ممسكان بقدم بعضهما ويسأل: ما الذي يجعلها صعبة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 71-72: الوثب بالقدمين للأمام مع ثني بسيط للذراعين (الكنغر)، المشي من الإقعاء واليدان على الركبتين (مشي الطيور)، الوثب لأعلى مع لمس اليدين للعقبين، تلويحة الرجلين من الانبطاح المائل (دفع الأرض بالقدمين وتمرير الرجلين بين اليدين للانبطاح المائل المقلوب)، مع الأمان.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 ص 75: قطارات، يؤدي كل تلميذ الوثب بالقدمين داخل الأطواق ثم المشي من الإقعاء ثم الوثب مع لمس العقبين على المرتبة ثم العودة، ويسجل القائد الأداء الجميل.\n- الطالب: يؤدي المسار.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (خمن الحركة): تؤدي مجموعة حركة براعة وتسميها الأخرى.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم مع تلميذ النموذج ص 73: تلميذان متجاوران، كل منهما يمسك بيده الخارجية قدم زميله المرفوعة، الحجل معًا للأمام بتوافق، ثم حركات أخرى مع الزميل (الوثب معًا بمسك اليدين، الوقوف على قدم متقابلين).\n- الطالب: يؤدي مع زميله.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 ص 76: ثنائيات على محيط المستطيل تجري وعند النداء تدخل طوقًا وتؤدي حركة براعة مشتركة يحددها المعلم.\n- الطالب: يؤدي مع زميله.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 ص 77: مسابقة الأعلام: ترفع المجموعة علمًا بلون الحركة التي أداها القائد (أحمر كنغر، أخضر تلويحة...).\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الثقة.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما حركة الكنغر؟\nالإجابة: الوثب بالقدمين للأمام مع ثني بسيط للذراعين.\nس2 (مستوى التطبيق): من أي وضع نبدأ تلويحة الرجلين؟\nالإجابة: من الانبطاح المائل.\nس3 (مستوى الاستدلال): ماذا نلمس في الوثب مع لمس العقبين؟\nالإجابة: العقبين باليدين في الهواء.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف نؤدي الحجل مع الزميل؟\nالإجابة: نمسك قدم الزميل المرفوعة ونحجل معًا بتوافق.\nس2 (مستوى التطبيق): لماذا نحتاج إلى التوافق مع الزميل؟\nالإجابة: حتى نحجل بالإيقاع نفسه ولا نسقط.\nس3 (مستوى الاستدلال): اذكر حركة براعة أخرى مع الزميل.\nالإجابة: الوقوف على قدم متقابلين مع مسك اليدين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ حركة الكنغر بالتدرج: وثبات قصيرة بالقدمين معًا للأمام فوق خطوط على الأرض، ثم يطلب منه أداء ثلاث وثبات متتالية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء سلسلة براعة: الكنغر ثم الوثب مع لمس العقبين ثم تلويحة الرجلين من الانبطاح المائل، والحجل مع زميل بتوافق.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ المشي من الإقعاء 5 خطوات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الوثب بالقدمين للأمام والوثب مع لمس العقبين؟\nالإجابة: الأول انتقال للأمام والثاني في المكان مع لمس العقبين.\nس3 (مستوى الاستدلال): اذكر حركتي براعة تعلمتهما اليوم.\nالإجابة: الكنغر وتلويحة الرجلين.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الحجل مع زميلك 5 حجلات.\nالإجابة: يؤديانه بتوافق.\nس2 (مستوى التطبيق): ما الحركة التي يرمز لها العلم الأحمر في لعبة اليوم؟\nالإجابة: الكنغر (حسب الاتفاق).\nس3 (مستوى الاستدلال): كيف شعرت عند أداء الحركات أمام زملائك؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على أداء حركات التقليد (الكنغر، مشي الطيور) على سجادة بأمان (دليل المعلم ص 71-75).\n\nالحصة 2:\nإرشاد لولي الأمر: مارس مع طفلك الحجل مع الزميل بمسك القدم (دليل المعلم ص 73-78).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=7"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 18-25", "n": 2, "periods": [{"focus": "الممارسات الصحية: الإسعافات الأولية البسيطة للإصابات في الملعب", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الإصابات البسيطة الشائعة في الملعب (كدمة، خدش، التواء بسيط).\n2. يذكر الإجراء الأولي الصحيح لكل إصابة (الراحة، الثلج، التنظيف، إبلاغ المعلم).\n3. يقدر أهمية الوقاية من الإصابات بالإحماء والالتزام بالقواعد.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: حقيبة إسعافات أولية\n- أخرى: أقماع", "المفاهيم": "- الإصابة\n- الكدمة\n- الالتواء\n- الإسعاف الأولي\n- الوقاية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم حقيبة الإسعافات ويسأل: ماذا نفعل لو سقط زميلنا وأصيب بخدش؟ ويقدم الإصابات البسيطة (برنامج صحتي ص 23).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور: الخدش (تنظيف بالماء وإبلاغ المعلم)، الكدمة (راحة وثلج ملفوف)، الالتواء البسيط (التوقف والراحة ورفع الطرف والثلج وإبلاغ المعلم)، ويؤكد عدم تحريك المصاب بعنف.\n- الطالب: يستمع ويرتب البطاقات.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تمثل كل مجموعة موقف إصابة والإجراء الصحيح وتعرضه.\n- الطالب: يمثل ويعرض.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المسعف الصغير): يجري التلاميذ وعند نداء إصابة يتجمعون في أطواق ويذكرون الإجراء الصحيح.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة الوقاية.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى المعرفة): ماذا نفعل عند الخدش البسيط؟\nالإجابة: ننظفه بالماء ونبلغ المعلم.\nس2 (مستوى التطبيق): ماذا نضع على الكدمة؟\nالإجابة: ثلجًا ملفوفًا بقطعة قماش.\nس3 (مستوى الاستدلال): ما أول ما نفعله عند الالتواء؟\nالإجابة: نتوقف عن اللعب ونرتاح ونبلغ المعلم.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ بالأدوات الإجراء الأولي لإصابات بسيطة: تنظيف الخدش بالماء، ووضع ثلج ملفوف بقماش على الكدمة، وإبلاغ المعلم، ثم يسأله: ماذا نفعل عند الخدش البسيط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «الإسعاف الأولي في الملعب» للكدمة والخدش والالتواء البسيط مع إجراء كل منها، وطرق الوقاية من الإصابة.", "التقويم الختامي": "س1 (مستوى المعرفة): مثّل الإجراء الصحيح لإصابة زميل بكدمة.\nالإجابة: راحة وثلج ملفوف وإبلاغ المعلم.\nس2 (مستوى التطبيق): كيف نقي أنفسنا من الإصابات في الملعب؟\nالإجابة: بالإحماء والالتزام بالقواعد والحذاء المناسب.\nس3 (مستوى الاستدلال): هل نحرك المصاب بالالتواء بسرعة؟ ولماذا؟\nالإجابة: لا، حتى لا تزداد الإصابة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طفلك الإجراء الأولي للخدش والكدمة (برنامج صحتي، دليل المعلم ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=8"}}, {"focus": "المهرجان الرياضي التعليمي للموانع والاتزان والبراعة الحركية", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف تمرينات الموانع والاتزان والبراعة في أقسام المهرجان.\n2. يطبق قواعد الأقسام والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أقماع صغيرة\n- أخرى: حبال\n- أخرى: نفق المرور\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- الموانع\n- الاتزان\n- البراعة الحركية", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أتحرك بطلاقة) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم مسار الموانع، قسم الاتزان الثابت (الانبطاح المائل الجانبي، الجلوس الهوائي)، قسم الاتزان الحركي (الحجل بالقمع، الوثب الجانبي)، قسم البراعة (الكنغر، لمس العقبين، الحجل مع الزميل)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية بالتتابع.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى المعرفة): ما القسم الذي استخدمنا فيه القمع على القدم؟\nالإجابة: قسم الاتزان الحركي.\nس2 (مستوى التطبيق): اذكر حركة براعة أديتها.\nالإجابة: مثل: الوثب مع لمس العقبين.\nس3 (مستوى الاستدلال): ما قاعدة الأمان في الموانع؟\nالإجابة: الهبوط على المرتبة وعدم الدفع.\n\n• نشاط علاجي (لمن لم يتقن): يمثل المعلم مع التلميذ بالأدوات الإجراء الأولي لإصابات بسيطة: تنظيف الخدش بالماء، ووضع ثلج ملفوف بقماش على الكدمة، وإبلاغ المعلم، ثم يسأله: ماذا نفعل عند الخدش البسيط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «الإسعاف الأولي في الملعب» للكدمة والخدش والالتواء البسيط مع إجراء كل منها، وطرق الوقاية من الإصابة.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: الموانع، الاتزان الثابت، الاتزان الحركي، البراعة.\nس2 (مستوى التطبيق): ما القسم الذي أحببته أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (مستوى الاستدلال): كيف ساهمت في عمل مجموعتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على حركات الاتزان والبراعة في مكان آمن (دليل المعلم ص 53-79).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الإصابات البسيطة الشائعة في الملعب (كدمة، خدش، التواء بسيط).\n2. يذكر الإجراء الأولي الصحيح لكل إصابة (الراحة، الثلج، التنظيف، إبلاغ المعلم).\n3. يقدر أهمية الوقاية من الإصابات بالإحماء والالتزام بالقواعد.\n\nالحصة 2:\n1. يوظف تمرينات الموانع والاتزان والبراعة في أقسام المهرجان.\n2. يطبق قواعد الأقسام والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: حقيبة إسعافات أولية\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أقماع صغيرة\n- أخرى: حبال\n- أخرى: نفق المرور\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الإصابة\n- الكدمة\n- الالتواء\n- الإسعاف الأولي\n- الوقاية\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- الموانع\n- الاتزان\n- البراعة الحركية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم حقيبة الإ
