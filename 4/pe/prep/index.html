ن آمن (دليل المعلم ص 53-79)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الإصابات البسيطة الشائعة في الملعب (كدمة، خدش، التواء بسيط).\n2. يذكر الإجراء الأولي الصحيح لكل إصابة (الراحة، الثلج، التنظيف، إبلاغ المعلم).\n3. يقدر أهمية الوقاية من الإصابات بالإحماء والالتزام بالقواعد.\n\nالحصة 2:\n1. يوظف تمرينات الموانع والاتزان والبراعة في أقسام المهرجان.\n2. يطبق قواعد الأقسام والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: حقيبة إسعافات أولية\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: أقماع صغيرة\n- أخرى: حبال\n- أخرى: نفق المرور\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الإصابة\n- الكدمة\n- الالتواء\n- الإسعاف الأولي\n- الوقاية\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- الموانع\n- الاتزان\n- البراعة الحركية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم حقيبة الإسعافات ويسأل: ماذا نفعل لو سقط زميلنا وأصيب بخدش؟ ويقدم الإصابات البسيطة (برنامج صحتي ص 23).\n\nالحصة 2:\nيعلن المعلم مهرجان (أتحرك بطلاقة) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور: الخدش (تنظيف بالماء وإبلاغ المعلم)، الكدمة (راحة وثلج ملفوف)، الالتواء البسيط (التوقف والراحة ورفع الطرف والثلج وإبلاغ المعلم)، ويؤكد عدم تحريك المصاب بعنف.\n- الطالب: يستمع ويرتب البطاقات.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تمثل كل مجموعة موقف إصابة والإجراء الصحيح وتعرضه.\n- الطالب: يمثل ويعرض.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (المسعف الصغير): يجري التلاميذ وعند نداء إصابة يتجمعون في أطواق ويذكرون الإجراء الصحيح.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة الوقاية.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم مسار الموانع، قسم الاتزان الثابت (الانبطاح المائل الجانبي، الجلوس الهوائي)، قسم الاتزان الحركي (الحجل بالقمع، الوثب الجانبي)، قسم البراعة (الكنغر، لمس العقبين، الحجل مع الزميل)، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية بالتتابع.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ماذا نفعل عند الخدش البسيط؟\nالإجابة: ننظفه بالماء ونبلغ المعلم.\nس2 (المستوى المتوقع): ماذا نضع على الكدمة؟\nالإجابة: ثلجًا ملفوفًا بقطعة قماش.\nس3 (المستوى المتقدم): ما أول ما نفعله عند الالتواء؟\nالإجابة: نتوقف عن اللعب ونرتاح ونبلغ المعلم.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القسم الذي استخدمنا فيه القمع على القدم؟\nالإجابة: قسم الاتزان الحركي.\nس2 (المستوى المتوقع): اذكر حركة براعة أديتها.\nالإجابة: مثل: الوثب مع لمس العقبين.\nس3 (المستوى المتقدم): ما قاعدة الأمان في الموانع؟\nالإجابة: الهبوط على المرتبة وعدم الدفع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): مثّل الإجراء الصحيح لإصابة زميل بكدمة.\nالإجابة: راحة وثلج ملفوف وإبلاغ المعلم.\nس2 (المستوى المتوقع): كيف نقي أنفسنا من الإصابات في الملعب؟\nالإجابة: بالإحماء والالتزام بالقواعد والحذاء المناسب.\nس3 (المستوى المتقدم): هل نحرك المصاب بالالتواء بسرعة؟ ولماذا؟\nالإجابة: لا، حتى لا تزداد الإصابة.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أقسام المهرجان الأربعة.\nالإجابة: الموانع، الاتزان الثابت، الاتزان الحركي، البراعة.\nس2 (المستوى المتوقع): ما القسم الذي أحببته أكثر ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): كيف ساهمت في عمل مجموعتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طفلك الإجراء الأولي للخدش والكدمة (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على حركات الاتزان والبراعة في مكان آمن (دليل المعلم ص 53-79)."}}, {"title": "الطلاقة الحركية بالأدوات", "unit": "الإدراك والطلاقة الحركية (أتحرك بطلاقة)", "week": "العاشر – الحادي عشر", "date": "8-12/11/2026 إلى 15-19/11/2026", "pages": "دليل المعلم ص 80-92", "n": 4, "periods": [{"focus": "الطلاقة الحركية بالكرات (تبادل ترك الكرة ومسكها بين الرجلين، الوثب مع رفع الكرة بالقدمين)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي تبادل ترك الكرة ومسكها بين الرجلين مع تغيير وضع اليدين، والوثب مع رفع الكرة بالقدمين ومسكها.\n3. يميز بين حركات الطلاقة بالكرة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- الطلاقة الحركية\n- السيطرة\n- الرمي واللقف\n- التوافق", "التهيئة / التمهيد / التعلم القبلي": "يؤدي المعلم تبادل ترك الكرة ومسكها بين رجليه بسرعة ويسأل: كم حركة أديت؟ ويقدم الطلاقة بالأدوات (ص 81-82).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 82-83: وقوف والقدمان متباعدتان ومسك الكرة بين الرجلين بيد أمام ويد خلف ثم تبادل تركها ومسكها مع تغيير وضع اليدين؛ الكرة بين القدمين والوثب مع رفعها ومسكها باليدين قبل سقوطها؛ انبطاح مواجه للزميل والكرة بين رأسي الزميلين والوقوف معًا دون سقوطها.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الطلاقة بالكرات: تبادل الترك والمسك، الوثب ورفع الكرة بالقدمين، الكرة بين الرأسين مع الزميل، رمي الكرة عاليًا والدوران واللقف، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: من يؤدي تبادل ترك الكرة ومسكها أكبر عدد في 20 ثانية.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الطلاقة الحركية؟\nالإجابة: أداء حركات مترابطة بانسيابية وسيطرة.\nس2 (المستوى المتوقع): أين تكون اليدان عند مسك الكرة بين الرجلين؟\nالإجابة: يد أمام الرجل ويد خلفها.\nس3 (المستوى المتقدم): كيف نرفع الكرة بالقدمين؟\nالإجابة: نضعها بين القدمين ونثب ونرفعها ونمسكها باليدين.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تبادل ترك الكرة ومسكها بين الرجلين 5 مرات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الوثب ورفع الكرة بالقدمين والكرة بين الرأسين.\nس3 (المستوى المتقدم): لماذا نراعي تناسب الأطوال بين الزميلين في تمرين الكرة بين الرأسين؟\nالإجابة: حتى لا تسقط الكرة ويسهل الوقوف معًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على تمرين تبادل ترك الكرة ومسكها بين الرجلين (دليل المعلم ص 82-83)."}}, {"focus": "الطلاقة الحركية بالحبل (تبادل الخطو مع تدوير الحبل، الحجل بالحبل، الوثب بالحبل مع الزميل)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تبادل الخطو بقدم تلو الأخرى مع تدوير الحبل والتقدم.\n2. يؤدي الحجل بالحبل بقدم واحدة في المكان وللأمام.\n3. يؤدي الوثب بالحبل مع الزميل في توقيت واحد.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: مراتب", "المفاهيم": "- الوثب بالحبل\n- تبادل الخطو\n- الحجل بالحبل\n- التوقيت", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الوثب بالحبل من الصف الثالث ويسأل: هل نستطيع المشي والوثب بالحبل في الوقت نفسه؟ (ص 84).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 84: مسك الحبل خلف الجسم وتبادل الخطو مع التدوير والتقدم، الحجل بقدم واحدة مع التدوير في المكان ثم للأمام، الوثب بالحبل مع الزميل (أحدهما يمسك الحبل ويثبان معًا).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 88: تبادل الخطو بالحبل 5 م، الحجل بالحبل، الوثب مع الزميل، الوثب الفردي السريع، مع عد القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: أي ثنائية تؤدي أكبر عدد من الوثبات المشتركة دون توقف.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نؤدي تبادل الخطو بالحبل؟\nالإجابة: نمسك الحبل خلف الجسم ونخطو بقدم تلو الأخرى مع التدوير والتقدم.\nس2 (المستوى المتوقع): ما الفرق بين الحجل بالحبل والوثب بالحبل؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (المستوى المتقدم): ما أهم شرط في الوثب مع الزميل؟\nالإجابة: التوقيت الواحد.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الحجل بالحبل 5 مرات بكل قدم.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ الوثب بالحبل مع زميلك 5 مرات.\nالإجابة: يؤديانه بتوقيت واحد.\nس3 (المستوى المتقدم): لماذا نراعي تناسب الأطوال بين الزميلين؟\nالإجابة: ليكون التدوير مناسبًا لهما معًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الوثب بالحبل 3 دقائق يوميًا بأنماط مختلفة (دليل المعلم ص 84-85)."}}, {"focus": "الطلاقة الحركية بسلم الرشاقة", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي أنماط حركية متنوعة في سلم الرشاقة (الجري، الوثب، الحجل، الخطو الجانبي، الدخول والخروج).\n2. يحافظ على الإيقاع والنظر للأمام أثناء الحركة في السلم.\n3. يميز بين الأنماط من حيث الصعوبة والسرعة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- أخرى: كرات", "المفاهيم": "- سلم الرشاقة\n- النمط الحركي\n- الإيقاع\n- الرشاقة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم أنماط الصف الثالث في السلم ويسأل: ما الأنماط الجديدة التي يمكن أن نبتكرها؟ (ص 85-86).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم الأنماط: الجري بهبوط قدم في كل مربع، الوثب بالقدمين، الحجل، الخطو الجانبي، الدخول والخروج (قدم داخل المربع وقدم خارجه بالتبادل)، مع الإيقاع والنظر للأمام.\n- الطالب: يقلد ببطء ثم بسرعة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يبتكر كل زوج نمطًا جديدًا في السلم ويعرضه، ويختار الصف الأسرع والأصعب ويعلل.\n- الطالب: يبتكر ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: قطارات، يؤدي كل تلميذ النمط الذي يناديه المعلم عبر السلم حاملًا كرة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر ثلاثة أنماط في سلم الرشاقة.\nالإجابة: الجري، الحجل، الخطو الجانبي.\nس2 (المستوى المتوقع): ما نمط الدخول والخروج؟\nالإجابة: قدم داخل المربع وقدم خارجه بالتبادل.\nس3 (المستوى المتقدم): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: للمحافظة على الإيقاع والاتزان.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ نمط الدخول والخروج عبر السلم.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما النمط الذي ابتكره زميلك وما صعوبته؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أي الأنماط أسرع: الجري أم الوثب بالقدمين؟ ولماذا؟\nالإجابة: الجري لأن القدمين تتبادلان بسرعة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك مربعات بالطباشير ومارسا الأنماط المختلفة (دليل المعلم ص 85-86)."}}, {"focus": "محطات ومنافسات الطلاقة الحركية بالأدوات", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n2. يوظف الطلاقة الحركية في منافسات.\n3. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: سلال", "المفاهيم": "- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الأدوات الثلاث ويعرض محطات اليوم ومسار المنافسة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 87-89: الكرة (تبادل الترك والمسك ثم رمي ولقف)، الحبل (تبادل الخطو ثم الحجل)، السلم (نمط من اختيار القائد)، الكرة والسلم (الجري في السلم بالكرة ثم رميها في السلة)، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 90: تتابع يجمع الأدوات الثلاث (وثب بالحبل 5 مرات، سلم الرشاقة، رمي الكرة والدوران واللقف ثم الرمي في السلة).\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا تفوقت بعض الفرق؟ ليستنتج التلاميذ أهمية الانسيابية بين الحركات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): في أي محطة استخدمنا السلة؟\nالإجابة: محطة الكرة والسلم.\nس2 (المستوى المتوقع): ما ترتيب حركات المنافسة؟\nالإجابة: وثب بالحبل، سلم الرشاقة، رمي الكرة والدوران واللقف، الرمي في السلة.\nس3 (المستوى المتقدم): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: الحبل والسلم.\nس3 (المستوى المتقدم): كيف شعرت عندما أنهيت المسار؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي بأدوات بسيطة (دليل المعلم ص 87-90)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي تبادل ترك الكرة ومسكها بين الرجلين مع تغيير وضع اليدين، والوثب مع رفع الكرة بالقدمين ومسكها.\n3. يميز بين حركات الطلاقة بالكرة.\n\nالحصة 2:\n1. يؤدي تبادل الخطو بقدم تلو الأخرى مع تدوير الحبل والتقدم.\n2. يؤدي الحجل بالحبل بقدم واحدة في المكان وللأمام.\n3. يؤدي الوثب بالحبل مع الزميل في توقيت واحد.\n\nالحصة 3:\n1. يؤدي أنماط حركية متنوعة في سلم الرشاقة (الجري، الوثب، الحجل، الخطو الجانبي، الدخول والخروج).\n2. يحافظ على الإيقاع والنظر للأمام أثناء الحركة في السلم.\n3. يميز بين الأنماط من حيث الصعوبة والسرعة.\n\nالحصة 4:\n1. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n2. يوظف الطلاقة الحركية في منافسات.\n3. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات مختلفة الأحجام\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: مراتب\n\nالحصة 3:\n- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- أخرى: كرات\n\nالحصة 4:\n- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: سلال", "المفاهيم": "الحصة 1:\n- الطلاقة الحركية\n- السيطرة\n- الرمي واللقف\n- التوافق\n\nالحصة 2:\n- الوثب بالحبل\n- تبادل الخطو\n- الحجل بالحبل\n- التوقيت\n\nالحصة 3:\n- سلم الرشاقة\n- النمط الحركي\n- الإيقاع\n- الرشاقة\n\nالحصة 4:\n- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيؤدي المعلم تبادل ترك الكرة ومسكها بين رجليه بسرعة ويسأل: كم حركة أديت؟ ويقدم الطلاقة بالأدوات (ص 81-82).\n\nالحصة 2:\nيراجع المعلم الوثب بالحبل من الصف الثالث ويسأل: هل نستطيع المشي والوثب بالحبل في الوقت نفسه؟ (ص 84).\n\nالحصة 3:\nيراجع المعلم أنماط الصف الثالث في السلم ويسأل: ما الأنماط الجديدة التي يمكن أن نبتكرها؟ (ص 85-86).\n\nالحصة 4:\nيراجع المعلم الأدوات الثلاث ويعرض محطات اليوم ومسار المنافسة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 82-83: وقوف والقدمان متباعدتان ومسك الكرة بين الرجلين بيد أمام ويد خلف ثم تبادل تركها ومسكها مع تغيير وضع اليدين؛ الكرة بين القدمين والوثب مع رفعها ومسكها باليدين قبل سقوطها؛ انبطاح مواجه للزميل والكرة بين رأسي الزميلين والوقوف معًا دون سقوطها.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الطلاقة بالكرات: تبادل الترك والمسك، الوثب ورفع الكرة بالقدمين، الكرة بين الرأسين مع الزميل، رمي الكرة عاليًا والدوران واللقف، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: من يؤدي تبادل ترك الكرة ومسكها أكبر عدد في 20 ثانية.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النماذج ص 84: مسك الحبل خلف الجسم وتبادل الخطو مع التدوير والتقدم، الحجل بقدم واحدة مع التدوير في المكان ثم للأمام، الوثب بالحبل مع الزميل (أحدهما يمسك الحبل ويثبان معًا).\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 88: تبادل الخطو بالحبل 5 م، الحجل بالحبل، الوثب مع الزميل، الوثب الفردي السريع، مع عد القائد.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: أي ثنائية تؤدي أكبر عدد من الوثبات المشتركة دون توقف.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم الأنماط: الجري بهبوط قدم في كل مربع، الوثب بالقدمين، الحجل، الخطو الجانبي، الدخول والخروج (قدم داخل المربع وقدم خارجه بالتبادل)، مع الإيقاع والنظر للأمام.\n- الطالب: يقلد ببطء ثم بسرعة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يبتكر كل زوج نمطًا جديدًا في السلم ويعرضه، ويختار الصف الأسرع والأصعب ويعلل.\n- الطالب: يبتكر ويستنتج.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: قطارات، يؤدي كل تلميذ النمط الذي يناديه المعلم عبر السلم حاملًا كرة.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 87-89: الكرة (تبادل الترك والمسك ثم رمي ولقف)، الحبل (تبادل الخطو ثم الحجل)، السلم (نمط من اختيار القائد)، الكرة والسلم (الجري في السلم بالكرة ثم رميها في السلة)، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 90: تتابع يجمع الأدوات الثلاث (وثب بالحبل 5 مرات، سلم الرشاقة، رمي الكرة والدوران واللقف ثم الرمي في السلة).\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا تفوقت بعض الفرق؟ ليستنتج التلاميذ أهمية الانسيابية بين الحركات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الطلاقة الحركية؟\nالإجابة: أداء حركات مترابطة بانسيابية وسيطرة.\nس2 (المستوى المتوقع): أين تكون اليدان عند مسك الكرة بين الرجلين؟\nالإجابة: يد أمام الرجل ويد خلفها.\nس3 (المستوى المتقدم): كيف نرفع الكرة بالقدمين؟\nالإجابة: نضعها بين القدمين ونثب ونرفعها ونمسكها باليدين.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف نؤدي تبادل الخطو بالحبل؟\nالإجابة: نمسك الحبل خلف الجسم ونخطو بقدم تلو الأخرى مع التدوير والتقدم.\nس2 (المستوى المتوقع): ما الفرق بين الحجل بالحبل والوثب بالحبل؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (المستوى المتقدم): ما أهم شرط في الوثب مع الزميل؟\nالإجابة: التوقيت الواحد.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر ثلاثة أنماط في سلم الرشاقة.\nالإجابة: الجري، الحجل، الخطو الجانبي.\nس2 (المستوى المتوقع): ما نمط الدخول والخروج؟\nالإجابة: قدم داخل المربع وقدم خارجه بالتبادل.\nس3 (المستوى المتقدم): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: للمحافظة على الإيقاع والاتزان.\n\nالحصة 4:\nس1 (مستوى الدعم): في أي محطة استخدمنا السلة؟\nالإجابة: محطة الكرة والسلم.\nس2 (المستوى المتوقع): ما ترتيب حركات المنافسة؟\nالإجابة: وثب بالحبل، سلم الرشاقة، رمي الكرة والدوران واللقف، الرمي في السلة.\nس3 (المستوى المتقدم): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ تبادل ترك الكرة ومسكها بين الرجلين 5 مرات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الوثب ورفع الكرة بالقدمين والكرة بين الرأسين.\nس3 (المستوى المتقدم): لماذا نراعي تناسب الأطوال بين الزميلين في تمرين الكرة بين الرأسين؟\nالإجابة: حتى لا تسقط الكرة ويسهل الوقوف معًا.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الحجل بالحبل 5 مرات بكل قدم.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ الوثب بالحبل مع زميلك 5 مرات.\nالإجابة: يؤديانه بتوقيت واحد.\nس3 (المستوى المتقدم): لماذا نراعي تناسب الأطوال بين الزميلين؟\nالإجابة: ليكون التدوير مناسبًا لهما معًا.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ نمط الدخول والخروج عبر السلم.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما النمط الذي ابتكره زميلك وما صعوبته؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أي الأنماط أسرع: الجري أم الوثب بالقدمين؟ ولماذا؟\nالإجابة: الجري لأن القدمين تتبادلان بسرعة.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: الحبل والسلم.\nس3 (المستوى المتقدم): كيف شعرت عندما أنهيت المسار؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على تمرين تبادل ترك الكرة ومسكها بين الرجلين (دليل المعلم ص 82-83).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على الوثب بالحبل 3 دقائق يوميًا بأنماط مختلفة (دليل المعلم ص 84-85).\n\nالحصة 3:\nإرشاد لولي الأمر: ارسم مع طفلك مربعات بالطباشير ومارسا الأنماط المختلفة (دليل المعلم ص 85-86).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي بأدوات بسيطة (دليل المعلم ص 87-90)."}}, {"title": "سباقات الجري", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 93-105", "n": 2, "periods": [{"focus": "سباق جري السلم", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق جري السلم.\n2. يؤدي العدو والجري داخل مربعات سلم الجري ضمن مسار 45 م.\n3. يطبق قواعد السباق (عدم تجاوز المربعات، الانطلاق بعد الزميل).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الجري\n- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- صورة توضيحية", "المفاهيم": "- سباق جري السلم\n- العدو\n- المربعات\n- التتابع\n- القاعدة القانونية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم سلم الجري في منتصف المسار ويسأل: كيف نجري بسرعة داخل المربعات دون أن نخطئ؟ (ص 95).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: العدو من خط البداية 7.5 م، الجري بهبوط قدم في كل مربع عبر سلم 4.5 م، العدو إلى خط النهاية والعودة، وتسليم الدور بلمس اليد، مع القواعد.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 97-98: فرق في قطارات خلف خط البداية، يؤدي كل تلميذ السباق ويلمس التالي، ويراقب القائد الجري الصحيح في المربعات.\n- الطالب: يؤدي السباق.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق مع حكم صغير.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كم طول مسار سباق جري السلم؟\nالإجابة: 45 م.\nس2 (المستوى المتوقع): ماذا نفعل داخل مربعات السلم؟\nالإجابة: نجري بهبوط قدم في كل مربع.\nس3 (المستوى المتقدم): ما الخطأ الذي يُحتسب على التلميذ؟\nالإجابة: تجاوز مربع أو الدوس على أطرافه.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدتين لسباق جري السلم.\nالإجابة: الجري داخل كل مربع والانطلاق بعد لمس الزميل.\nس2 (المستوى المتوقع): أدِّ سباق جري السلم كاملًا.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف يتم تحديد الفريق الفائز؟\nالإجابة: الذي ينهي السباق أولًا دون أخطاء.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك مربعات بالطباشير ومارسا الجري السريع داخلها (دليل المعلم ص 95-98)."}}, {"focus": "سباق التتابع المكوكي للعدو المتعرج والحواجز", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف سباق التتابع المكوكي للعدو المتعرج والحواجز وقواعده.\n2. يؤدي العدو المتعرج بين الأعلام والوثب الجانبي فوق الحواجز المنخفضة وتسليم الطوق.\n3. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: حواجز منخفضة\n- أخرى: أعلام ملونة\n- أخرى: أطواق مطاطية صغيرة\n- أخرى: أقماع", "المفاهيم": "- التتابع المكوكي\n- العدو المتعرج\n- الحواجز\n- الحارة\n- التسليم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم سباق السلم ويعرض المسار الجديد بحارتين (حارة حواجز وأعلام وحارة فارغة) (ص 96).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: ينطلق الأول بالعدو والوثب الجانبي فوق الحواجز والجري المتعرج بين الأعلام ويسلم الطوق للزميل في القطار المقابل الذي يعود بالعدو في الحارة الفارغة، وهكذا.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 99-100: فرق في قطارين متقابلين بأدوار محددة ويراقب القائد التسليم.\n- الطالب: يؤدي السباق.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق وتحديد الفائز.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا يحمل التلميذ الأول في السباق؟\nالإجابة: طوقًا مطاطيًا صغيرًا.\nس2 (المستوى المتوقع): كيف نتخطى الحواجز في هذا السباق؟\nالإجابة: بالوثب الجانبي فوقها.\nس3 (المستوى المتقدم): ما الفرق بين الحارتين؟\nالإجابة: حارة بها حواجز وأعلام، وحارة فارغة للعدو.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ السباق كاملًا.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر الحركات التي تضمنها السباق.\nالإجابة: العدو، الوثب الجانبي، الجري المتعرج.\nس3 (المستوى المتقدم): كيف شعرت بمشاركة فريقك؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الجري المتعرج بين عوائق في مكان آمن (دليل المعلم ص 96-100)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق جري السلم.\n2. يؤدي العدو والجري داخل مربعات سلم الجري ضمن م الماء.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما مواصفات حذاء الجري؟\nالإجابة: نعل مرن ومقاس مناسب ورباط محكم.\nس2 (المستوى المتوقع): لماذا نلبس زيًا فاتحًا في الحر؟\nالإجابة: لأنه يعكس الحرارة ويبقي الجسم أبرد.\nس3 (المستوى المتقدم): ماذا نفعل عند الشعور بالدوار أثناء السباق؟\nالإجابة: نتوقف ونستريح في الظل ونشرب الماء ونبلغ المعلم.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر ثلاثة أشياء في حقيبة العداء.\nالإجابة: ماء وقبعة وزي قطني.\nس2 (المستوى المتوقع): أرفع صورة طفل يجري ظهرًا بلا ماء، ما الخطأ؟\nالإجابة: يجري وقت الحر بلا ماء ولا قبعة.\nس3 (المستوى المتقدم): ما السلوك الذي يقي من العطش؟\nالإجابة: شرب الماء قبل النشاط وبعده.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: جهّز لطفلك حقيبة رياضية مناسبة (ماء، قبعة، زي فاتح) ليوم الحصة (برنامج صحتي، دليل المعلم ص 23)."}}, {"focus": "المهرجان الرياضي التعليمي لسباقات الجري والطلاقة الحركية", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف سباقات الجري والطلاقة الحركية في أقسام المهرجان.\n2. يطبق قواعد السباقات والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الجري\n- أخرى: حواجز منخفضة\n- أخرى: أعلام\n- أخرى: أطواق مطاطية\n- أخرى: حبال وثب\n- أخرى: كرات\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- سباقات الجري\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أجري) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم سباق جري السلم، قسم التتابع المكوكي للعدو المتعرج والحواجز، قسم الحبل والكرة (طلاقة)، قسم الجري المتعرج بالكرة، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق ختامي بين الفرق.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي والتنفس وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى الدعم): ما القسم الذي استخدمنا فيه الطوق المطاطي؟\nالإجابة: التتابع المكوكي.\nس2 (المستوى المتوقع): ماذا نفعل داخل مربعات سلم الجري؟\nالإجابة: نجري بهبوط قدم في كل مربع.\nس3 (المستوى المتقدم): ماذا نفعل بعد كل قسم جري؟\nالإجابة: نمشي ونتنفس بعمق ونشرب الماء.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر أقسام المهرجان الأربعة.\nالإجابة: جري السلم، التتابع المكوكي، الحبل والكرة، الجري المتعرج بالكرة.\nس2 (المستوى المتوقع): ما القاعدة التي راقبها الحكم الصغير؟\nالإجابة: التسليم الصحيح والانطلاق بعد اللمس.\nس3 (المستوى المتقدم): كيف تشجع زميلًا تأخر في السباق؟\nالإجابة: أصفق له وأشجعه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على الجري اليومي (دليل المعلم ص 93-105)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مواصفات الزي والحذاء الرياضي المناسبين للجري.\n2. يميز سلوكيات الوقاية من الحرارة والعطش أثناء السباقات.\n3. يقدر أهمية شرب الماء والراحة في الظل.\n\nالحصة 2:\n1. يوظف سباقات الجري والطلاقة الحركية في أقسام المهرجان.\n2. يطبق قواعد السباقات والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: زجاجات ماء\n- أخرى: قبعة\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: سلم الجري\n- أخرى: حواجز منخفضة\n- أخرى: أعلام\n- أخرى: أطواق مطاطية\n- أخرى: حبال وثب\n- أخرى: كرات\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الزي الرياضي\n- الحذاء\n- الحرارة\n- العطش\n- الظل\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- سباقات الجري\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم حذاءً رياضيًا وآخر غير مناسب وقبعة وزجاجة ماء ويسأل: ماذا نحتاج ليوم سباقات؟\n\nالحصة 2:\nيعلن المعلم مهرجان (أجري) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء في الظل.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم بالصور: الزي القطني الفاتح والحذاء ذو النعل المرن المناسب للجري، وسلوكيات الوقاية (الماء قبل السباق وبعده، القبعة، الراحة في الظل، التوقف عند الدوار) (برنامج صحتي ص 23).\n- الطالب: يستمع ويرتب البطاقات.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (العداء الذكي): نداءات (اجرِ، اشرب، استرح في الظل) ويستجيب التلاميذ.\n- الطالب: يلعب.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تجهز كل مجموعة (حقيبة العداء) من البطاقات وتعرض محتوياتها وسببها.\n- الطالب: يتعاون ويعرض.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وشرب الماء.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم): قسم سباق جري السلم، قسم التتابع المكوكي للعدو المتعرج والحواجز، قسم الحبل والكرة (طلاقة)، قسم الجري المتعرج بالكرة، مع تسجيل النقاط.\n- الطالب: يؤدي المهام مع مجموعته.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق ختامي بين الفرق.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي والتنفس وتكريم.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما مواصفات حذاء الجري؟\nالإجابة: نعل مرن ومقاس مناسب ورباط محكم.\nس2 (المستوى المتوقع): لماذا نلبس زيًا فاتحًا في الحر؟\nالإجابة: لأنه يعكس الحرارة ويبقي الجسم أبرد.\nس3 (المستوى المتقدم): ماذا نفعل عند الشعور بالدوار أثناء السباق؟\nالإجابة: نتوقف ونستريح في الظل ونشرب الماء ونبلغ المعلم.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القسم الذي استخدمنا فيه الطوق المطاطي؟\nالإجابة: التتابع المكوكي.\nس2 (المستوى المتوقع): ماذا نفعل داخل مربعات سلم الجري؟\nالإجابة: نجري بهبوط قدم في كل مربع.\nس3 (المستوى المتقدم): ماذا نفعل بعد كل قسم جري؟\nالإجابة: نمشي ونتنفس بعمق ونشرب الماء.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاثة أشياء في حقيبة العداء.\nالإجابة: ماء وقبعة وزي قطني.\nس2 (المستوى المتوقع): أرفع صورة طفل يجري ظهرًا بلا ماء، ما الخطأ؟\nالإجابة: يجري وقت الحر بلا ماء ولا قبعة.\nس3 (المستوى المتقدم): ما السلوك الذي يقي من العطش؟\nالإجابة: شرب الماء قبل النشاط وبعده.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أقسام المهرجان الأربعة.\nالإجابة: جري السلم، التتابع المكوكي، الحبل والكرة، الجري المتعرج بالكرة.\nس2 (المستوى المتوقع): ما القاعدة التي راقبها الحكم الصغير؟\nالإجابة: التسليم الصحيح والانطلاق بعد اللمس.\nس3 (المستوى المتقدم): كيف تشجع زميلًا تأخر في السباق؟\nالإجابة: أصفق له وأشجعه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز لطفلك حقيبة رياضية مناسبة (ماء، قبعة، زي فاتح) ليوم الحصة (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وشجعه على الجري اليومي (دليل المعلم ص 93-105)."}}, {"title": "مسابقات الوثب", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الرابع عشر", "date": "6-10/12/2026", "pages": "دليل المعلم ص 106-117", "n": 2, "periods": [{"focus": "مسابقة الوثب الطويل من الاقتراب القصير (الهبوط في الدوائر)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الوثب وقواعد الوثب الطويل من الاقتراب القصير.\n2. يؤدي الوثب بقدم واحدة من منطقة الارتقاء والهبوط بالقدمين في إحدى الدوائر.\n3. يطبق قواعد المسابقة (الارتقاء من المنطقة المحددة، الهبوط داخل الدائرة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- أخرى: حواجز\n- صورة توضيحية", "المفاهيم": "- الوثب الطويل\n- الاقتراب\n- منطقة الارتقاء\n- الهبوط\n- دقة الأداء", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة الوثب الطويل ويسأل: ما الفرق بين وثبة القرفصاء والوثب من الاقتراب؟ ويقدم المسابقة (ص 107).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: جري، وثب من خطوتين.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب 10 م، الارتقاء بقدم واحدة من منطقة الارتقاء (50 سم)، الطيران مع مرجحة الذراعين، الهبوط بالقدمين بثني الركبتين في إحدى الدوائر الثلاث، ونقاط حسب بعد الدائرة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 110: قطارات، يؤدي كل تلميذ الوثبة ويحتسب القائد النقاط حسب الدائرة وصحة الأداء.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق بمجموع النقاط.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بكم قدم نرتقي؟\nالإجابة: بقدم واحدة.\nس2 (المستوى المتوقع): أين نهبط؟\nالإجابة: بالقدمين داخل إحدى الدوائر.\nس3 (المستوى المتقدم): كيف تحسب النقاط؟\nالإجابة: حسب بعد الدائرة التي نهبط فيها.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب الطويل من الاقتراب القصير.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما طول منطقة الارتقاء؟\nالإجابة: 50 سم.\nس3 (المستوى المتقدم): ماذا يحدث لو هبطت خارج الدوائر؟\nالإجابة: لا تحتسب نقاط للمحاولة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الوثب من الاقتراب في مكان آمن بهبوط هادئ (دليل المعلم ص 107-110)."}}, {"focus": "مسابقة الوثب الثلاثي في منطقة محددة", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الوثب الثلاثي (الحجلة، الخطوة، الوثبة) وقواعد المسابقة.\n2. يؤدي الوثب الثلاثي في مربعات المنطقة التي تناسب قدراته.\n3. يختار المنطقة المناسبة لقدراته ويعلل.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: شريط لاصق\n- أخرى: مربعات الأرقام\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- الوثب الثلاثي\n- الحجلة\n- الخطوة\n- الوثبة\n- المنطقة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الوثب الطويل ويسأل: ماذا لو وثبنا ثلاث مرات متتالية في مربعات؟ ويعرض المناطق الثلاث (ص 108).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: حجل، تبادل الخطو والحجل.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب 5 م، حجلة في المربع الأول، خطوة في الثاني، وثبة والهبوط في الثالث، بإيقاع متساوٍ، ويشرح المناطق (1.5 م، 2 م، 2.5 م) ونقاطها (1، 2، 3).\n- الطالب: يقلد بالتدرج في المنطقة الأولى.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 111: يختار كل تلميذ منطقته ويؤدي ويحتسب القائد النقاط، ثم يحاول المنطقة التالية.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة بين الفرق بمجموع النقاط.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما تسلسل الوثب الثلاثي؟\nالإجابة: حجلة، خطوة، وثبة.\nس2 (المستوى المتوقع): كم نقطة للمنطقة الثالثة؟\nالإجابة: 3 نقاط.\nس3 (المستوى المتقدم): لماذا نختار المنطقة المناسبة لقدراتنا؟\nالإجابة: لنؤدي الوثبات الثلاث بدقة داخل المربعات.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب الثلاثي في المنطقة التي تناسبك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): على أي قدم نهبط بعد الحجلة؟\nالإجابة: على قدم الارتقاء نفسها.\nس3 (المستوى المتقدم): أي منطقة اخترت ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على إيقاع (حجلة، خطوة، وثبة) داخل مربعات مرسومة (دليل المعلم ص 108-113)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الوثب وقواعد الوثب الطويل من الاقتراب القصير.\n2. يؤدي الوثب بقدم واحدة من منطقة الارتقاء والهبوط بالقدمين في إحدى الدوائر.\n3. يطبق قواعد المسابقة (الارتقاء من المنطقة المحددة، الهبوط داخل الدائرة).\n\nالحصة 2:\n1. يتعرف الوثب الثلاثي (الحجلة، الخطوة، الوثبة) وقواعد المسابقة.\n2. يؤدي الوثب الثلاثي في مربعات المنطقة التي تناسب قدراته.\n3. يختار المنطقة المناسبة لقدراته ويعلل.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- أخرى: حواجز\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: شريط لاصق\n- أخرى: مربعات الأرقام\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الوثب الطويل\n- الاقتراب\n- منطقة الارتقاء\n- الهبوط\n- دقة الأداء\n\nالحصة 2:\n- الوثب الثلاثي\n- الحجلة\n- الخطوة\n- الوثبة\n- المنطقة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة الوثب الطويل ويسأل: ما الفرق بين وثبة القرفصاء والوثب من الاقتراب؟ ويقدم المسابقة (ص 107).\n\nالحصة 2:\nيراجع المعلم الوثب الطويل ويسأل: ماذا لو وثبنا ثلاث مرات متتالية في مربعات؟ ويعرض المناطق الثلاث (ص 108).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: جري، وثب من خطوتين.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: اقتراب 10 م، الارتقاء بقدم واحدة من منطقة الارتقاء (50 سم)، الطيران مع مرجحة الذراعين، الهبوط بالقدمين بثني الركبتين في إحدى الدوائر الثلاث، ونقاط حسب بعد الدائرة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط ص 110: قطارات، يؤدي كل تلميذ   const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
</body>
