<!doctype html>
<html lang="ar" dir="rtl">
<head><script>(function(){var k='ofuq-g4-unlock-board';function g(n,x){try{return window[n].getItem(x)==='1'}catch(e){return false}}if(g('localStorage',k)||g('sessionStorage',k)||g('localStorage','afuq-all')||g('sessionStorage','afuq-all'))return;document.documentElement.style.display='none';location.replace('../?lock=board')})()</script>
<meta charset="utf-8"><script src="/assets/pkgmode.js" data-role="page"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السبورات – الرياضيات – الصف الرابع</title>
<style>
:root{--bg:#F3F9F7;--ink:#24343A;--muted:#5D7A72;--line:#D5E6DF;--card:#fff;--mint:#4FA58A;--bad:#D9798B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,#0d3440,#128c8c);color:#fff;padding:18px 16px}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;opacity:.9}
header h1{margin:6px 0 2px;font-size:22px}
header p{margin:0;opacity:.85;font-size:14px}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:6px 0;color:var(--muted);font-size:15px}
.pledge{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:12px;background:#FBF3DF;border-radius:12px;font-size:15px;cursor:pointer}
.pledge input{width:20px;height:20px;margin-top:4px;flex:none}
.dl{display:block;text-align:center;background:var(--mint);color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:13px;border-radius:12px}
.dl[aria-disabled=true]{background:#c9d6d2;color:#fff;pointer-events:none}
</style>
</head>
<body>
<header>
  <a href="../">→ رجوع</a>
  <h1>السبورات</h1>
  <p>الرياضيات · الصف الرابع · الفصل الدراسي الأول</p>
</header>
<main>
  <label class="pledge"><input type="checkbox" id="cb"><span>أتعهد بعدم نشر هذا الملف أو مشاركته مع أي شخص خارج الباقة الذهبية.</span></label>
  <div class="card" style="margin-top:14px">
    <h2>سبورات الحصص (PDF)</h2>
    <p>x</p>
    <a class="dl" href="http://127.0.0.1:8767/4/math/lesson-boards.pdf" data-name="math-g4-lesson-boards.pdf" target="_blank" rel="noopener" aria-disabled="true">⬇ تحميل سبورات الحصص</a>
  </div>
</main>
<script>
(function(){var cb=document.getElementById('cb'),ds=document.querySelectorAll('.dl');
cb.onchange=function(){Array.prototype.forEach.call(ds,function(d){d.setAttribute('aria-disabled',cb.checked?'false':'true')})};
/* Direct download: cross-origin files ignore the "download" attribute, so fetch the file and save it as a blob
   (needs a CORS rule on the R2 bucket allowing GET from this site); if that fails fall back to opening the file. */
Array.prototype.forEach.call(ds,function(d){d.addEventListener('click',function(e){
  if(d.getAttribute('aria-disabled')==='true'){e.preventDefault();return}
  if(!window.fetch||!window.URL||!window.Blob) return;
  e.preventDefault(); if(d.getAttribute('data-busy')) return;
  var label=d.textContent; d.setAttribute('data-busy','1'); d.textContent='⏳ جارٍ التحميل… قد يستغرق دقيقة';
  fetch(d.href).then(function(r){ if(!r.ok) throw new Error(r.status); return r.blob(); }).then(function(b){
    var u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=d.getAttribute('data-name')||'file.pdf';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u)},60000);
  }).catch(function(){ window.open(d.href,'_blank'); }).then(function(){ d.removeAttribute('data-busy'); d.textContent=label; });
})});})();
</script>
</body>
</html>
