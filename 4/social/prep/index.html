وى التطبيق): لماذا نحدد الفئة المستهدفة في خطة المشروع؟\nالإجابة: لنصمم المنتج بما يناسب احتياجاتهم، ونعرف أين نعرضه وكيف نصل إليهم.\n\nس3 (مستوى الاستدلال): قيّم خطة مجموعة أخرى: اذكر نقطة قوة فيها واقتراحًا لتحسينها.\nالإجابة: إجابة بحسب الخطة، مثل: نقطة القوة وضوح توزيع المهام، والاقتراح تحديد مدة تنفيذ أدق.", "- للطالب: نفذ نشاط (2) ص 51 مع أسرتك: اسم المشروع، وفريق العمل، والكلفة، ومن أين ستحصلون على المال، ومدة التنفيذ، والموقع، والمستهلك.\n- لولي الأمر: شارك ابنك في التخطيط لمشروع أسري مقترح في ص 51، ودعه يقود النقاش ويوزع المهام على أفراد الأسرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=5"]}], "combined": ["الحصة 1:\n1. يوضح المقصود بخطة المشروع وأهميتها في نجاح المشروعات الأسرية.\n2. يكمل خطة مشروع أسرة شمساء (الاسم، والأدوات، والتكلفة المتوقعة، والمستهلكين) مستعينًا ببيانات النص.\n\nمخرج تعليمي آخر:\n3. يقدّر أهمية التخطيط وتوزيع المهام بين أفراد الأسرة.\n\nالحصة 2:\n1. يعدّ مع مجموعته خطة عمل لمشروعهم الريادي تتضمن الاسم، والاستخدامات، والفئة المستهدفة، والموارد، والكلفة، ومدة التنفيذ.\n2. يوزع مع زملائه مهام المشروع بحسب ما يجيده كل فرد.\n\nمخرج تعليمي آخر:\n3. يلتزم بخطوات إعداد خطة المشروع ويحترم آراء زملائه.", "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الحصة 1:\n1. التعلم بالاكتشاف\n2. الفصل المقلوب\n3. التعلم بالنمذجة\n\nالحصة 2:\n1. التعلم التشاركي\n2. التعلم المبني على المشاريع\n3. التعلم المبني على اللعب", "الحصة 1:\n1. الكتاب\n2. السبورة الذكية\n3. الأقلام\n4. الوسائل المتعددة (سمعية - بصرية)\n5. أخرى: شيء يُخفى في الصف، وخريطة بسيطة للوصول إليه\n\nالحصة 2:\n1. الكتاب\n2. الأقلام\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: نسخ استمارة «خطة عمل مشروعنا الريادي» من ملحق دليل المعلم ص 60", "الحصة 1:\n1. خطة المشروع: خريطة للعمل بها تفاصيل كافية لما يجب أداؤه من مهام وأعمال لإنجاز المشروع.\n2. التكلفة المتوقعة: مقدار المال الذي يُتوقع أن يحتاج إليه المشروع لتوفير موارده وأدواته.\n3. المستهلكون: الأشخاص الذين يُتوقع أن يشتروا المنتج أو يستفيدوا منه.\n\nالحصة 2:\n1. الفئة المستهدفة (الزبائن): الأشخاص الذين يُوجَّه إليهم المنتج ويُتوقع أن يشتروه.\n2. مدة التنفيذ: الوقت المحدد لإنجاز مهام المشروع من بدايته إلى نهايته.\n3. فريق العمل: أفراد الأسرة أو المجموعة الذين توزع عليهم مهام المشروع بحسب ما يجيده كل منهم.", "الحصة 1:\nالتعلم القبلي: صمم الطالب مع مجموعته في الحصة السابقة منتج مشروعهم الريادي، واستمع في البيت إلى نص «مشروع أسرتي (2)».\n\nالتهيئة:\n1. يخفي المعلم شيئًا داخل الصف قبل الحصة، ويخبر الطلاب باسمه.\n2. يختار طالبين للبحث عنه، ويعطي أحدهما خريطة توضح مكانه.\n3. يسأل بعد العثور عليه: لماذا وصل أحدهما قبل الآخر؟\n4. يتوصل معهم إلى أن الخريطة اختصرت الطريق، وكذلك المشروع الأسري يحتاج إلى خريطة عمل هي خطة المشروع.\n\nالحصة 2:\nالتعلم القبلي: أكمل الطالب في الحصة السابقة خطة مشروع أسرة شمساء وحسب تكلفته المتوقعة.\n\nالتهيئة:\n1. يعرض المعلم على السبورة الذكية رسوم منتجات المجموعات من الدرس السابق.\n2. يسأل: ماذا نحتاج أن نعرف قبل أن نبدأ تنفيذ منتجنا؟\n3. يجمع إجابات الطلاب ويربطها بعناصر استمارة خطة العمل.", "الحصة 1:\nالتهيئة (6 دقائق): البحث عن الشيء المفقود\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ينفذ موقف البحث بطالبين أحدهما معه خريطة، ثم يسأل عن سبب الفرق ويترك الطلاب يستنتجون معنى خطة المشروع.\n- الطالب: يلاحظ الموقف، ويستنتج دور الخريطة، ويربطه بحاجة المشروع إلى خطة.\n\nالنشاط 1 (8 دقائق): مناقشة نص «مشروع أسرتي (2)» الذي استمع إليه الطلاب في البيت\n- الاستراتيجية: الفصل المقلوب\n- المعلم: يتحقق بأسئلة سريعة من الاستماع، ويعيد تشغيل النص عبر رمز QR لمن يحتاج، ثم يناقش: سبب اجتماع أسرة شمساء، والعمل الذي سيقوم به كل فرد، وطلب الأب إعداد خطة المشروع.\n- الطالب: يجيب عن أسئلة التحقق، ويعرض ما دوّنه من مهام أفراد الأسرة (الجد: عشرون سلة بريالين للسلة، ناصر: عشرون علبة بريال للعلبة، الأم: بخور لعشرين علبة بريالين للعلبة، الأب: توفير المال).\n\nالنشاط 2 (8 دقائق): المعلم ينمذج حساب التكلفة المتوقعة\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يحسب أمام الطلاب تكلفة السلال مفكرًا بصوت عالٍ: «عشرون سلة، كل سلة بريالين: 20 × 2 = 40 ريالًا»، ثم يوجّههم في حساب تكلفة العلب (20 × 1 = 20 ريالًا) والبخور (20 × 2 = 40 ريالًا)، ثم المجموع (40 + 20 + 40 = 100 ريال عماني).\n- الطالب: يتابع تفكير المعلم، ويشارك في حساب بقية التكاليف خطوة خطوة، ويتحقق من المجموع.\n\nالنشاط 3 (10 دقائق): تطبيق مستقل: نشاط (1) ص 50 خطة مشروع أسرة شمساء\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يطلب من كل طالب إكمال الخطة بمفرده: اسم المشروع، وأدواته، وتكلفته المتوقعة، والمستهلكون، ويتابع ويقدم التغذية الراجعة.\n- الطالب: يقترح اسمًا للمشروع، ويدوّن الأدوات (البخور، سعف النخيل، الطابعة ثلاثية الأبعاد، أدوات الرسم والتلوين)، والتكلفة المتوقعة (100 ريال)، والمستهلكين (محبو البخور، الأسر، زوار المعارض).\n\nالختام (8 دقائق): تطبيق مستقل جديد (بطاقة الخروج)\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ومنها حساب تكلفة جديدة، ويناقش الحل في الدقيقة الأخيرة.\n- الطالب: يجيب بمفرده عن الأسئلة، ويطبق خطوات الحساب التي نمذجها المعلم.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (5 دقائق): ماذا نحتاج قبل التنفيذ؟\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يعرض منتجات المجموعات، ويطرح السؤال، ويبني مع الطلاب قائمة بعناصر الخطة على السبورة.\n- الطالب: يقترح ما يحتاج إليه المشروع قبل التنفيذ، ويضيف إلى اقتراحات زملائه.\n\nالنشاط 1 (18 دقيقة): استمارة «خطة عمل مشروعنا الريادي»\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يوزع الاستمارة، ويطلب من كل مجموعة إكمال عناصرها: اسم المشروع، واستخدامات المنتج، والفئة المستهدفة، والموارد والأدوات اللازمة، وكلفة المشروع، ومدة التنفيذ، ثم توزيع المهام على أفرادها بحسب ما يجيده كل منهم، ويتنقل بين المجموعات موجهًا.\n- الطالب: يشارك في إكمال الاستمارة، ويتولى مهمة تناسب ما يجيده (حساب الكلفة، أو كتابة الخطة، أو الرسم، أو العرض).\n\nالنشاط 2 (9 دقائق): عرض الخطط: نجمتان وأمنية\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يدير عرض الخطط، ويطلب من المجموعات الأخرى تقديم نجمتين (نقطتي قوة) وأمنية (اقتراح تحسين)، ثم يختم بأن نجاح المشاريع الريادية يعتمد على التخطيط الناجح، ويشرح نشاط (2) ص 51 المنزلي.\n- الطالب: يعرض خطة مجموعته أو يقدم تغذية راجعة للمجموعات الأخرى بنقطتي قوة واقتراح.\n\nالختام (8 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يشغّل مسابقة المجموعات (درس «أخطط لمشروع أسرتي»، محور الحصة، 5 أسئلة)، ثم يطرح أسئلة التقويم الختامي الثلاثة جولة أخيرة.\n- الطالب: يتنافس مع مجموعته، ويجيب في دورها، ويشارك في جولة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): لماذا وصل أحد الطالبين إلى الشيء المخفي قبل زميله؟\nالإجابة: لأنه كان يملك خريطة توضح له المسار.\n\nس2 (مستوى التطبيق): ما المهمة التي سيقوم بها كل من الجد وناصر والأم والأب في المشروع؟\nالإجابة: الجد يصنع عشرين سلة، وناصر ينتج عشرين علبة للبخور بطابعته ثلاثية الأبعاد، والأم تصنع بخورًا يكفي عشرين علبة، والأب يوفر المال.\n\nس3 (مستوى الاستدلال): احسب التكلفة المتوقعة لمشروع أسرة شمساء، ووضح خطوات حسابك.\nالإجابة: السلال: 20 × 2 = 40 ريالًا، والعلب: 20 × 1 = 20 ريالًا، والبخور: 20 × 2 = 40 ريالًا؛ المجموع: 40 + 20 + 40 = 100 ريال عماني.\n\nالحصة 2:\nس1 (مستوى المعرفة): من الفئة المستهدفة لمنتج مجموعتكم؟\nالإجابة: بحسب المجموعة، مثل: طلاب المدرسة، أو الأسر، أو زوار المعارض.\n\nس2 (مستوى التطبيق): كيف وزعتم المهام في مجموعتكم؟ ولماذا؟\nالإجابة: وزعناها بحسب ما يجيده كل فرد؛ فمن يجيد الرسم صمّم، ومن يجيد الحساب قدّر الكلفة، ليُنجَز العمل بإتقان.\n\nس3 (مستوى الاستدلال): ماذا يحدث لو بدأت المجموعة التنفيذ دون تحديد كلفة المشروع ومدة التنفيذ؟\nالإجابة: قد ينفد المال قبل إكمال المنتج، أو يتأخر الإنجاز، فيتعثر المشروع.\n\n• نشاط علاجي (لمن لم يتقن): يحسب المعلم مع التلميذ تكلفة السلال خطوة خطوة (20 سلة × 2 ريال = 40 ريالًا) باستخدام عدادات أو رسم، ثم يسأله: كم تكلفة 20 علبة إذا كان ثمن العلبة ريالًا واحدًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لمشروع أسري صغير تتضمن الاسم والأدوات والتكلفة المتوقعة والمستهلكين، وحساب التكلفة لو زاد الإنتاج إلى ثلاثين علبة.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: خطة المشروع هي ........ للعمل بها تفاصيل كافية لما يجب أداؤه لإنجاز المشروع.\nالإجابة: خريطة.\n\nس2 (مستوى التطبيق): اذكر ثلاثة من عناصر خطة المشروع في نشاط ص 50.\nالإجابة: اسم المشروع، وأدوات المشروع، والتكلفة المتوقعة (ويقبل: المستهلكون).\n\nس3 (مستوى الاستدلال): لو قررت أسرة شمساء إنتاج عشر سلال وعشر علب وبخورًا يكفيها بالأسعار نفسها، فكم تصبح التكلفة المتوقعة؟\nالإجابة: 10 × 2 + 10 × 1 + 10 × 2 = 20 + 10 + 20 = 50 ريالًا عمانيًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): صواب أم خطأ: نجاح المشاريع الريادية يعتمد على التخطيط الناجح.\nالإجابة: صواب.\n\nس2 (مستوى التطبيق): لماذا نحدد الفئة المستهدفة في خطة المشروع؟\nالإجابة: لنصمم المنتج بما يناسب احتياجاتهم، ونعرف أين نعرضه وكيف نصل إليهم.\n\nس3 (مستوى الاستدلال): قيّم خطة مجموعة أخرى: اذكر نقطة قوة فيها واقتراحًا لتحسينها.\nالإجابة: إجابة بحسب الخطة، مثل: نقطة القوة وضوح توزيع المهام، والاقتراح تحديد مدة تنفيذ أدق.", "الحصة 1:\n- للطالب: راجع نص «مشروع أسرتي (2)» ص 48–49 ونشاط ص 50، وفكر في الموارد التي يحتاج إليها منتج مجموعتك.\n- لولي الأمر: ناقش ابنك في أهمية التخطيط قبل أي عمل أسري، وساعده على تقدير تكلفة شيء بسيط في البيت.\n\nالحصة 2:\n- للطالب: نفذ نشاط (2) ص 51 مع أسرتك: اسم المشروع، وفريق العمل، والكلفة، ومن أين ستحصلون على المال، ومدة التنفيذ، والموقع، والمستهلك.\n- لولي الأمر: شارك ابنك في التخطيط لمشروع أسري مقترح في ص 51، ودعه يقود النقاش ويوزع المهام على أفراد الأسرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=5"]}, {"no": 6, "label": "الدرس الثالث: أثر مشروع أسرتي", "unit": 2, "unitName": "الوحدة الثانية: أسرتي المنتِجة", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع الحادي عشر", "dates": "15–19 نوفمبر 2026", "sb": "ص 52–54، 57", "tb": "ص 55–56", "focus": "التسويق وطرائقه", "fields": ["1. يوضح المقصود بالتسويق وأهميته في نجاح المشروعات الأسرية.\n2. يصنف طرائق التسويق إلى إلكترونية وغير إلكترونية.\n\nمخرج تعليمي آخر:\n3. يختار طريقة تسويق مناسبة لمنتج أسري ويعلل اختياره.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي", "1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. السبورة الذكية\n5. أخرى: ملصقات الملحق (1) ص 57", "1. التسويق: الإعلان الذي يسهم في توضيح طبيعة المنتج أو الخدمة بأسلوب ترويجي جذاب.\n2. التسويق الإلكتروني: الترويج للمنتج عبر الوسائل الرقمية، مثل: مواقع التواصل الاجتماعي، والبريد الإلكتروني، والهاتف الذكي.\n3. التسويق غير الإلكتروني: الترويج للمنتج بوسائل مطبوعة أو مباشرة، مثل: الصحف، واللوحات الإعلانية، والمطويات.", "التعلم القبلي: أعد الطالب مع مجموعته في الدرس السابق خطة عمل لمشروعهم الريادي.\n\nالتهيئة:\n1. يعرض المعلم لوحة «اكتشف الفرق» (صورتان لمحل، إحداهما عليها إعلان تخفيضات 30% للإلكترونيات).\n2. يناقش الطلاب: ما الفرق بين الصورتين؟ وما الطريقة التي استُخدمت لجذب الناس إلى شراء المنتج؟\n3. يتوصل معهم إلى أهمية التسويق في نجاح المشروعات الأسرية الريادية، وإلى تعريفه.", "التهيئة (7 دقائق): اكتشف الفرق\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض اللوحة، ويطرح السؤالين، ويقود الطلاب إلى استنتاج معنى التسويق وأهميته قبل صياغة تعريفه.\n- الطالب: يقارن الصورتين، ويكتشف الفرق، ويستنتج دور الإعلان في جذب المشترين.\n\nالنشاط 1 (10 دقائق): نص «مشروع أسرتي (3)» ص 52–53\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف المجموعات بأدوار بالإجابة عن: أثر المشروع في شمساء وأسرتها والمجتمع، واقتراح ناصر لتوسيع منافذ البيع، ثم يناقش الإجابات.\n- الطالب: يستمع إلى النص، ويستخرج مع مجموعته الآثار (الشعور بالفخر والسعادة، والمردود المالي الكبير للجمعيات الخيرية)، واقتراح ناصر (التسويق بطرق إلكترونية وغير إلكترونية في أنحاء سلطنة عمان).\n\nالنشاط 2 (15 دقيقة): نشاط (1) ص 54: طرائق التسويق (ملصقات ص 57)\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة مناقشة كل ملصق وتحديد نوعه قبل اللصق، ثم يلصق كل طالب الملصقات في المكان المناسب في كتابه، وتعلل كل مجموعة تصنيف ملصق واحد، ويقدم المعلم التغذية الراجعة.\n- الطالب: يناقش مع مجموعته نوع كل طريقة (إلكتروني: مواقع التواصل الاجتماعي، والبريد الإلكتروني، والهاتف؛ غير إلكتروني: الصحيفة، واللوحة الإعلانية، والمطوية)، ويلصقها في كتابه، ويشارك في التعليل.\n\nالختام (8 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويوجّه الطلاب إلى إحضار أدوات بسيطة لإعداد إعلان في الحصة القادمة.\n- الطالب: يجيب بمفرده عن الأسئلة الثلاثة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): ما الطريقة التي استُخدمت في لوحة «اكتشف الفرق» لجذب الناس إلى شراء المنتج؟\nالإجابة: الإعلان عن تخفيضات بنسبة 30% على الإلكترونيات.\n\nس2 (مستوى التطبيق): ماذا اقترح ناصر على أسرته لتوسيع منافذ بيع مشروعهم؟\nالإجابة: أن يسوّقوا لمشروعهم بطرق إلكترونية وغير إلكترونية في مختلف أنحاء سلطنة عمان.\n\nس3 (مستوى الاستدلال): صنّف الطرائق الآتية: البريد الإلكتروني، الصحيفة، مواقع التواصل الاجتماعي، اللوحة الإعلانية.\nالإجابة: إلكترونية: البريد الإلكتروني، ومواقع التواصل الاجتماعي. غير إلكترونية: الصحيفة، واللوحة الإعلانية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صور طرق تسويق (صحيفة، لوحة إعلانية، بريد إلكتروني، مواقع تواصل)، ويصنفها معه إلى إلكترونية وغير إلكترونية، ثم يسأله: هل الصحيفة طريقة إلكترونية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إعلان لمنتج أسرة شمساء يجذب المستهلكين، واختيار طريقة التسويق الأنسب له مع تعليل الاختيار.", "س1 (مستوى المعرفة): أكمل: الإعلان الذي يوضح طبيعة المنتج بأسلوب ترويجي جذاب يسمى ........\nالإجابة: التسويق.\n\nس2 (مستوى التطبيق): اذكر طريقتين للتسويق الإلكتروني، وطريقتين للتسويق غير الإلكتروني.\nالإجابة: إلكتروني: مواقع التواصل الاجتماعي، والبريد الإلكتروني (ويقبل: رسائل الهاتف). غير إلكتروني: الصحف، واللوحات الإعلانية (ويقبل: المطويات).\n\nس3 (مستوى الاستدلال): أي طريقة تسويق تختار لبخور أسرة شمساء ليصل إلى أكبر عدد من الناس؟ ولماذا؟\nالإجابة: مواقع التواصل الاجتماعي مثلًا؛ لأنها تصل إلى عدد كبير من الناس داخل عمان وخارجها بسرعة وبتكلفة قليلة (وتقبل إجابات أخرى معللة).", "- للطالب: فكر مع مجموعتك في طريقة تسويق مبتكرة لمنتج مشروعكم، وأحضر أوراقًا ملونة وأقلامًا لإعداد الإعلان في الحصة القادمة.\n- لولي الأمر: شاهد مع ابنك نماذج من الإعلانات في الصحف أو الهاتف، وناقشه: ما الذي يجعل الإعلان جذابًا؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=6"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع الثاني عشر (اليوم الوطني)", "dates": "22–26 نوفمبر 2026", "sb": "ص 55", "tb": "ص 56–58", "focus": "أسوّق لمشروعنا الريادي وأتوقع أثره", "fields": ["1. يصمم مع مجموعته طريقة تسويق مبتكرة لمنتج مشروعهم الريادي ويعرضها.\n2. يتوقع أثر المشروع الأسري فيه وفي أسرته والحي والوطن.\n\nمخرج تعليمي آخر:\n3. يقدّر أهمية استثمار ما يجيده أفراد الأسرة في دعم الاقتصاد الوطني.", "المخرج 1: إبداع\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم المبني على المشاريع\n2. التعلم التشاركي\n3. التعلم الذاتي", "1. الكتاب\n2. الأقلام\n3. السبورة الذكية\n4. أخرى: أوراق ملونة وأدوات رسم لإعداد الإعلان، ومكان مخصص للجنة التحكيم", "1. الترويج: عرض المنتج بأسلوب يجذب المستهلكين ويرغّبهم في شرائه.\n2. أثر المشروع الأسري: النتائج الإيجابية للمشروع في الفرد والأسرة والحي والوطن والعالم، مثل زيادة الدخل وتعزيز الاقتصاد الوطني.", "التعلم القبلي: تعرّف الطالب في الحصة السابقة معنى التسويق وطرائقه الإلكترونية وغير الإلكترونية.\n\nالتهيئة:\n1. يربط المعلم الحصة بمناسبة اليوم الوطني: يعرض منتجًا عمانيًا محليًا ويسأل: كيف نجعل الناس يعرفون منتجاتنا العمانية ويقبلون عليها؟\n2. يعلن عن «معرض التسويق» ويعرّف الطلاب بلجنة التحكيم (ثلاثة معلمين أو ثلاثة طلاب) وبمعايير العرض: ذكر اسم المشروع، ونوع المنتج، والطريقة المستخدمة في التسويق مع عرضها، والالتزام بالوقت، والاستماع لتعليقات اللجنة.", "التهيئة (4 دقائق): إعلان معرض التسويق\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يعرض المنتج العماني ويطرح السؤال، ثم يعلن مهمة المعرض ومعاييره وتشكيل لجنة التحكيم (ويفضل تنفيذ الحصة في مركز مصادر التعلم إن أمكن).\n- الطالب: يتعرف إلى المهمة ومعاييرها، ويستعد مع مجموعته.\n\nالنشاط 1 (12 دقيقة): إعداد التسويق لمشروعنا الريادي\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يوجّه كل مجموعة إلى اختيار طريقة التسويق المناسبة لمنتجها وإعدادها (لوحة إعلانية، أو مطوية، أو منشور مقترح لمواقع التواصل، أو إعلان مسموع قصير)، مع توزيع الأدوار بين أفرادها، ويتابع ويوجه.\n- الطالب: يختار مع مجموعته طريقة التسويق، ويتولى دورًا في إعدادها بحسب ما يجيده (الكتابة، أو الرسم، أو الإلقاء).\n\nالنشاط 2 (12 دقيقة): العرض أمام لجنة التحكيم\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يدير العروض بواقع دقيقتين لكل مجموعة، ويمنح اللجنة فرصة التعليق، ثم يتوصل مع الطلاب إلى أهمية اختيار طرق مبتكرة وفاعلة في التسويق ليصل المنتج إلى أكبر شريحة من المجتمع.\n- الطالب: يعرض مع مجموعته ملتزمًا بالمعايير والوقت، ويستمع لتعليقات اللجنة ولعروض زملائه.\n\nالنشاط 3 (7 دقائق): نشاط (2) ص 55: أتوقع أثر مشروع أسرتي\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يطلب من كل طالب كتابة أثر المشروع فيه وفي أسرته والحي ووطنه، ثم يقدم التغذية الراجعة مستعينًا بجدول دليل المعلم (الفرد، الأسرة، الوطن، العالم).\n- الطالب: يكتب بمفرده أثر المشروع في كل مستوى، ويقارن إجابته بما يعرضه المعلم.\n\nالختام (5 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويختم بتهنئة الطلاب بالمناسبة الوطنية والاعتزاز بالمنتج العماني.\n- الطالب: يجيب بمفرده عن الأسئلة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): ما اسم منتج مجموعتكم؟ وما الطريقة التي اخترتموها لتسويقه؟\nالإجابة: بحسب المجموعة، مثل: «سلة الخير»، ونسوّقه بلوحة إعلانية ومنشور مقترح لمواقع التواصل.\n\nس2 (مستوى التطبيق): ما الذي جعل طريقة تسويق المجموعة الفائزة مؤثرة؟\nالإجابة: وضوح المعلومات، وجاذبية التصميم، وابتكار الفكرة، ومناسبتها للفئة المستهدفة.\n\nس3 (مستوى الاستدلال): كيف يسهم المشروع الأسري في الاقتصاد الوطني العماني؟\nالإجابة: يزيد تنوع المنتجات المحلية، وينشر ثقافة الإنتاج بدل الاستهلاك، ويزيد دخل الأسر، ويعرّف العالم بالمنتجات العمانية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صور طرق تسويق (صحيفة، لوحة إعلانية، بريد إلكتروني، مواقع تواصل)، ويصنفها معه إلى إلكترونية وغير إلكترونية، ثم يسأله: هل الصحيفة طريقة إلكترونية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إعلان لمنتج أسرة شمساء يجذب المستهلكين، واختيار طريقة التسويق الأنسب له مع تعليل الاختيار.", "س1 (مستوى المعرفة): اذكر أثرًا واحدًا للمشروع الأسري في الفرد.\nالإجابة: الشعور بالفخر والاعتزاز (ويقبل: زيادة دخله الخاص).\n\nس2 (مستوى التطبيق): وضح أثر المشروع الأسري في الأسرة وفي الوطن.\nالإجابة: الأسرة: زيادة دخلها المادي وتعزيز المشاركة المجتمعية. الوطن: تنوع المنتجات المحلية، وإشاعة ثقافة الإنتاج، والمساهمة في تعزيز الاقتصاد الوطني العماني.\n\nس3 (مستوى الاستدلال): كيف يمكن أن يصل أثر مشروع أسرة شمساء إلى العالم؟\nالإجابة: بتسويقه إلكترونيًا وتبادل المنتجات مع بقية دول العالم، فيتعرف العالم بالمنتجات العمانية المحلية.", "- للطالب: راجع دروس الوحدة الثانية ص 44–55، واحتفظ بإعلان مجموعتك. وتهيأ للوحدة الثالثة بملاحظة الأعمال التطوعية في حيك.\n- لولي الأمر: شارك ابنك الاحتفاء بالمنتجات العمانية في مناسبة اليوم الوطني، وحدثه عن أعمال تطوعية شارك فيها أهل الحي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=6"]}], "combined": ["الحصة 1:\n1. يوضح المقصود بالتسويق وأهميته في نجاح المشروعات الأسرية.\n2. يصنف طرائق التسويق إلى إلكترونية وغير إلكترونية.\n\nمخرج تعليمي آخر:\n3. يختار طريقة تسويق مناسبة لمنتج أسري ويعلل اختياره.\n\nالحصة 2:\n1. يصمم مع مجموعته طريقة تسويق مبتكرة لمنتج مشروعهم الريادي ويعرضها.\n2. يتوقع أثر المشروع الأسري فيه وفي أسرته والحي والوطن.\n\nمخرج تعليمي آخر:\n3. يقدّر أهمية استثمار ما يجيده أفراد الأسرة في دعم الاقتصاد الوطني.", "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: إبداع\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الحصة 1:\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي\n\nالحصة 2:\n1. التعلم المبني على المشاريع\n2. التعلم التشاركي\n3. التعلم الذاتي", "الحصة 1:\n1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. السبورة الذكية\n5. أخرى: ملصقات الملحق (1) ص 57\n\nالحصة 2:\n1. الكتاب\n2. الأقلام\n3. السبورة الذكية\n4. أخرى: أوراق ملونة وأدوات رسم لإعداد الإعلان، ومكان مخصص للجنة التحكيم", "الحصة 1:\n1. التسويق: الإعلان الذي يسهم في توضيح طبيعة المنتج أو الخدمة بأسلوب ترويجي جذاب.\n2. التسويق الإلكتروني: الترويج للمنتج عبر الوسائل الرقمية، مثل: مواقع التواصل الاجتماعي، والبريد الإلكتروني، والهاتف الذكي.\n3. التسويق غير الإلكتروني: الترويج للمنتج بوسائل مطبوعة أو مباشرة، مثل: الصحف، واللوحات الإعلانية، والمطويات.\n\nالحصة 2:\n1. الترويج: عرض المنتج بأسلوب يجذب المستهلكين ويرغّبهم في شرائه.\n2. أثر المشروع الأسري: النتائج الإيجابية للمشروع في الفرد والأسرة والحي والوطن والعالم، مثل زيادة الدخل وتعزيز الاقتصاد الوطني.", "الحصة 1:\nالتعلم القبلي: أعد الطالب مع مجموعته في الدرس السابق خطة عمل لمشروعهم الريادي.\n\nالتهيئة:\n1. يعرض المعلم لوحة «اكتشف الفرق» (صورتان لمحل، إحداهما عليها إعلان تخفيضات 30% للإلكترونيات).\n2. يناقش الطلاب: ما الفرق بين الصورتين؟ وما الطريقة التي استُخدمت لجذب الناس إلى شراء المنتج؟\n3. يتوصل معهم إلى أهمية التسويق في نجاح المشروعات الأسرية الريادية، وإلى تعريفه.\n\nالحصة 2:\nالتعلم القبلي: تعرّف الطالب في الحصة السابقة معنى التسويق وطرائقه الإلكترونية وغير الإلكترونية.\n\nالتهيئة:\n1. يربط المعلم الحصة بمناسبة اليوم الوطني: يعرض منتجًا عمانيًا محليًا ويسأل: كيف نجعل الناس يعرفون منتجاتنا العمانية ويقبلون عليها؟\n2. يعلن عن «معرض التسويق» ويعرّف الطلاب بلجنة التحكيم (ثلاثة معلمين أو ثلاثة طلاب) وبمعايير العرض: ذكر اسم المشروع، ونوع المنتج، والطريقة المستخدمة في التسويق مع عرضها، والالتزام بالوقت، والاستماع لتعليقات اللجنة.", "الحصة 1:\nالتهيئة (7 دقائق): اكتشف الفرق\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض اللوحة، ويطرح السؤالين، ويقود الطلاب إلى استنتاج معنى التسويق وأهميته قبل صياغة تعريفه.\n- الطالب: يقارن الصورتين، ويكتشف الفرق، ويستنتج دور الإعلان في جذب المشترين.\n\nالنشاط 1 (10 دقائق): نص «مشروع أسرتي (3)» ص 52–53\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف المجموعات بأدوار بالإجابة عن: أثر المشروع في شمساء وأسرتها والمجتمع، واقتراح ناصر لتوسيع منافذ البيع، ثم يناقش الإجابات.\n- الطالب: يستمع إلى النص، ويستخرج مع مجموعته الآثار (الشعور بالفخر والسعادة، والمردود المالي الكبير للجمعيات الخيرية)، واقتراح ناصر (التسويق بطرق إلكترونية وغير إلكترونية في أنحاء سلطنة عمان).\n\nالنشاط 2 (15 دقيقة): نشاط (1) ص 54: طرائق التسويق (ملصقات ص 57)\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة مناقشة كل ملصق وتحديد نوعه قبل اللصق، ثم يلصق كل طالب الملصقات في المكان المناسب في كتابه، وتعلل كل مجموعة تصنيف ملصق واحد، ويقدم المعلم التغذية الراجعة.\n- الطالب: يناقش مع مجموعته نوع كل طريقة (إلكتروني: مواقع التواصل الاجتماعي، والبريد الإلكتروني، والهاتف؛ غير إلكتروني: الصحيفة، واللوحة الإعلانية، والمطوية)، ويلصقها في كتابه، ويشارك في التعليل.\n\nالختام (8 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويوجّه الطلاب إلى إحضار أدوات بسيطة لإعداد إعلان في الحصة القادمة.\n- الطالب: يجيب بمفرده عن الأسئلة الثلاثة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (4 دقائق): إعلان معرض التسويق\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يعرض المنتج العماني ويطرح السؤال، ثم يعلن مهمة المعرض ومعاييره وتشكيل لجنة التحكيم (ويفضل تنفيذ الحصة في مركز مصادر التعلم إن أمكن).\n- الطالب: يتعرف إلى المهمة ومعاييرها، ويستعد مع مجموعته.\n\nالنشاط 1 (12 دقيقة): إعداد التسويق لمشروعنا الريادي\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يوجّه كل مجموعة إلى اختيار طريقة التسويق المناسبة لمنتجها وإعدادها (لوحة إعلانية، أو مطوية، أو منشور مقترح لمواقع التواصل، أو إعلان مسموع قصير)، مع توزيع الأدوار بين أفرادها، ويتابع ويوجه.\n- الطالب: يختار مع مجموعته طريقة التسويق، ويتولى دورًا في إعدادها بحسب ما يجيده (الكتابة، أو الرسم، أو الإلقاء).\n\nالنشاط 2 (12 دقيقة): العرض أمام لجنة التحكيم\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يدير العروض بواقع دقيقتين لكل مجموعة، ويمنح اللجنة فرصة التعليق، ثم يتوصل مع الطلاب إلى أهمية اختيار طرق مبتكرة وفاعلة في التسويق ليصل المنتج إلى أكبر شريحة من المجتمع.\n- الطالب: يعرض مع مجموعته ملتزمًا بالمعايير والوقت، ويستمع لتعليقات اللجنة ولعروض زملائه.\n\nالنشاط 3 (7 دقائق): نشاط (2) ص 55: أتوقع أثر مشروع أسرتي\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يطلب من كل طالب كتابة أثر المشروع فيه وفي أسرته والحي ووطنه، ثم يقدم التغذية الراجعة مستعينًا بجدول دليل المعلم (الفرد، الأسرة، الوطن، العالم).\n- الطالب: يكتب بمفرده أثر المشروع في كل مستوى، ويقارن إجابته بما يعرضه المعلم.\n\nالختام (5 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويختم بتهنئة الطلاب بالمناسبة الوطنية والاعتزاز بالمنتج العماني.\n- الطالب: يجيب بمفرده عن الأسئلة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): ما الطريقة التي استُخدمت في لوحة «اكتشف الفرق» لجذب الناس إلى شراء المنتج؟\nالإجابة: الإعلان عن تخفيضات بنسبة 30% على الإلكترونيات.\n\nس2 (مستوى التطبيق): ماذا اقترح ناصر على أسرته لتوسيع منافذ بيع مشروعهم؟\nالإجابة: أن يسوّقوا لمشروعهم بطرق إلكترونية وغير إلكترونية في مختلف أنحاء سلطنة عمان.\n\nس3 (مستوى الاستدلال): صنّف الطرائق الآتية: البريد الإلكتروني، الصحيفة، مواقع التواصل الاجتماعي، اللوحة الإعلانية.\nالإجابة: إلكترونية: البريد الإلكتروني، ومواقع التواصل الاجتماعي. غير إلكترونية: الصحيفة، واللوحة الإعلانية.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما اسم منتج مجموعتكم؟ وما الطريقة التي اخترتموها لتسويقه؟\nالإجابة: بحسب المجموعة، مثل: «سلة الخير»، ونسوّقه بلوحة إعلانية ومنشور مقترح لمواقع التواصل.\n\nس2 (مستوى التطبيق): ما الذي جعل طريقة تسويق المجموعة الفائزة مؤثرة؟\nالإجابة: وضوح المعلومات، وجاذبية التصميم، وابتكار الفكرة، ومناسبتها للفئة المستهدفة.\n\nس3 (مستوى الاستدلال): كيف يسهم المشروع الأسري في الاقتصاد الوطني العماني؟\nالإجابة: يزيد تنوع المنتجات المحلية، وينشر ثقافة الإنتاج بدل الاستهلاك، ويزيد دخل الأسر، ويعرّف العالم بالمنتجات العمانية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صور طرق تسويق (صحيفة، لوحة إعلانية، بريد إلكتروني، مواقع تواصل)، ويصنفها معه إلى إلكترونية وغير إلكترونية، ثم يسأله: هل الصحيفة طريقة إلكترونية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إعلان لمنتج أسرة شمساء يجذب المستهلكين، واختيار طريقة التسويق الأنسب له مع تعليل الاختيار.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: الإعلان الذي يوضح طبيعة المنتج بأسلوب ترويجي جذاب يسمى ........\nالإجابة: التسويق.\n\nس2 (مستوى التطبيق): اذكر طريقتين للتسويق الإلكتروني، وطريقتين للتسويق غير الإلكتروني.\nالإجابة: إلكتروني: مواقع التواصل الاجتماعي، والبريد الإلكتروني (ويقبل: رسائل الهاتف). غير إلكتروني: الصحف، واللوحات الإعلانية (ويقبل: المطويات).\n\nس3 (مستوى الاستدلال): أي طريقة تسويق تختار لبخور أسرة شمساء ليصل إلى أكبر عدد من الناس؟ ولماذا؟\nالإجابة: مواقع التواصل الاجتماعي مثلًا؛ لأنها تصل إلى عدد كبير من الناس داخل عمان وخارجها بسرعة وبتكلفة قليلة (وتقبل إجابات أخرى معللة).\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر أثرًا واحدًا للمشروع الأسري في الفرد.\nالإجابة: الشعور بالفخر والاعتزاز (ويقبل: زيادة دخله الخاص).\n\nس2 (مستوى التطبيق): وضح أثر المشروع الأسري في الأسرة وفي الوطن.\nالإجابة: الأسرة: زيادة دخلها المادي وتعزيز المشاركة المجتمعية. الوطن: تنوع المنتجات المحلية، وإشاعة ثقافة الإنتاج، والمساهمة في تعزيز الاقتصاد الوطني العماني.\n\nس3 (مستوى الاستدلال): كيف يمكن أن يصل أثر مشروع أسرة شمساء إلى العالم؟\nالإجابة: بتسويقه إلكترونيًا وتبادل المنتجات مع بقية دول العالم، فيتعرف العالم بالمنتجات العمانية المحلية.", "الحصة 1:\n- للطالب: فكر مع مجموعتك في طريقة تسويق مبتكرة لمنتج مشروعكم، وأحضر أوراقًا ملونة وأقلامًا لإعداد الإعلان في الحصة القادمة.\n- لولي الأمر: شاهد مع ابنك نماذج من الإعلانات في الصحف أو الهاتف، وناقشه: ما الذي يجعل الإعلان جذابًا؟\n\nالحصة 2:\n- للطالب: راجع دروس الوحدة الثانية ص 44–55، واحتفظ بإعلان مجموعتك. وتهيأ للوحدة الثالثة بملاحظة الأعمال التطوعية في حيك.\n- لولي الأمر: شارك ابنك الاحتفاء بالمنتجات العمانية في مناسبة اليوم الوطني، وحدثه عن أعمال تطوعية شارك فيها أهل الحي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=6"]}, {"no": 7, "label": "الدرس الأول: أنا متطوع", "unit": 3, "unitName": "الوحدة الثالثة: حيُّنا المتفاعل", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع الثالث عشر (يوم الأنشطة التربوية)", "dates": "29 نوفمبر – 3 ديسمبر 2026", "sb": "ص 59–64", "tb": "ص 62–65", "focus": "العمل التطوعي وما يجيده أفراد الحي", "fields": ["1. يوضح المقصود بالعمل التطوعي ونوعيه الفردي والجماعي.\n2. يقترح عملًا تطوعيًا لكل فرد من أفراد الحي بحسب ما يجيده لتطوير الحديقة.\n\nمخرج تعليمي آخر:\n3. يقدّر قيمة المبادرة إلى عمل الخير في الحي دون انتظار مقابل.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي", "1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. السبورة الذكية\n5. الأقلام", "1. العمل التطوعي: كل عمل خير يُبذل للحي عن رغبة دون مقابل مادي، ويكون فرديًا أو جماعيًا.\n2. أنواع العمل التطوعي: فردي يقوم به شخص واحد، وجماعي يشترك فيه عدد من الأفراد لتحقيق هدف مشترك.", "التعلم القبلي: اكتشف الطالب في الوحدتين السابقتين ما يجيده هو وما يجيده أفراد أسرته، ويتهيأ الآن لاكتشاف ما يجيده أفراد حيّه.\n\nالتهيئة:\n1. يعرض المعلم صورة مدخل الوحدة ص 59 ولوحة (العمل التطوعي).\n2. يطلب من الطلاب تأمل الصورة والتعبير عن رأيهم فيما يقوم به الأشخاص.\n3. يتوصل معهم إلى أهمية المبادرة لعمل الخير في مختلف المجالات، وأن هذه الأعمال تسمى عملًا تطوعيًا: كل عمل خير يُبذل عن رغبة دون مقابل مادي، ويكون فرديًا أو جماعيًا.", "التهيئة (6 دقائق): لوحة العمل التطوعي\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض اللوحة ويطلب من الطلاب وصف ما يقوم به الأشخاص وسببه، ويقودهم إلى استنتاج خصائص العمل التطوعي (رغبة، بلا مقابل، فردي أو جماعي) قبل صياغة التعريف.\n- الطالب: يتأمل الصورة، ويعبر عن رأيه، ويستنتج خصائص العمل التطوعي.\n\nالنشاط 1 (12 دقيقة): نص «حينا المتطوع (1)» ص 62–63\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف المجموعات بأدوار بإعداد بطاقتين: «الحدث الذي اجتمع عليه أفراد الحي» و«ما يجيده كل فرد من الحضور»، ثم يناقش الإجابات ويقدم التغذية الراجعة.\n- الطالب: يستمع إلى النص، ويستخرج مع مجموعته الحدث (اجتماع أفراد الحي في المجلس العام لمناقشة تطوير حديقة الحي) وما يجيده الحضور (سعيد: الكهرباء، سالم: النجارة، راشد: البناء، أم ناصر وسعاد: التشجير، العم صالح: ورشة لصناعة الحديد والألمنيوم).\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 64: أقترح عملًا تطوعيًا لكل فرد\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة اقتراح عمل تطوعي لكل فرد لتطوير الحديقة، ثم يكتبه كل طالب في كتابه، ويناقش المعلم الإجابات مستعينًا بجدول دليل المعلم.\n- الطالب: يتشاور مع مجموعته ويكتب الاقتراحات: أم ناصر وسعاد: إعادة تشجير الحديقة وتنسيق النباتات، سالم: صناعة الطاولات والكراسي، سعيد: إصلاح المصابيح والتوصيلات الكهربائية، راشد: إعادة بناء طرق الحديقة ورصفها، صالح: صناعة المظلات.\n\nالختام (8 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويطلب ملاحظة مرفق في المدرسة يحتاج إلى تطوير استعدادًا للحصة القادمة.\n- الطالب: يجيب بمفرده عن الأسئلة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): أين اجتمع أفراد الحي؟ ولماذا؟\nالإجابة: في المجلس العام؛ لمناقشة أهمية تطوير حديقة الحي واقتراح أعمال تطوعية تسهم في ذلك.\n\nس2 (مستوى التطبيق): اذكر ثلاثة من الحضور وما يجيده كل منهم.\nالإجابة: سعيد: الكهرباء، وسالم: النجارة، وراشد: البناء (ويقبل: العم صالح: ورشة الحديد والألمنيوم، وأم ناصر وسعاد: التشجير).\n\nس3 (مستوى الاستدلال): لماذا يعد اجتماع أفراد الحي في المجلس خطوة مهمة قبل العمل التطوعي؟\nالإجابة: لأنه يتيح تبادل الأفكار ومعرفة ما يجيده كل فرد، فيُقترح لكل منهم عمل يناسبه ويتعاونون في تطوير الحديقة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتين: شخص ينظف وحده وفريق يزرع معًا، ويصنفهما معه إلى عمل تطوعي فردي وجماعي، ثم يسأله: ما العمل التطوعي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح عمل تطوعي لكل فرد من أفراد الحي بحسب ما يجيده (الكهرباء، النجارة، البناء)، ثم اقتراح عمل تطوعي يناسبهم في المدرسة.", "س1 (مستوى المعرفة): صواب أم خطأ: العمل التطوعي يكون مقابل أجر مادي.\nالإجابة: خطأ؛ فهو عمل خير يُبذل عن رغبة دون مقابل مادي.\n\nس2 (مستوى التطبيق): اقترح عملًا تطوعيًا في الحديقة لكل من سالم النجار وسعيد المتخصص في الكهرباء.\nالإجابة: سالم: صناعة الطاولات والكراسي. سعيد: إصلاح المصابيح والتوصيلات الكهربائية.\n\nس3 (مستوى الاستدلال): ميّز بين العمل التطوعي الفردي والجماعي بمثال لكل منهما من حيك.\nالإجابة: فردي: أن أسقي أشجار الحديقة بنفسي. جماعي: أن يشترك أفراد الحي في تنظيف الحديقة وإعادة تشجيرها.", "- للطالب: راجع نص «حينا المتطوع (1)» ص 62–63، ولاحظ مرفقًا في مدرستك يحتاج إلى تطوير لتشارك به في الحصة القادمة.\n- لولي الأمر: حدث ابنك عن أعمال تطوعية في حيكم، وعن مشاركات أفراد الأسرة فيها إن وُجدت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=7"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع الرابع عشر", "dates": "6–10 ديسمبر 2026", "sb": "ص 65", "tb": "ص 65–66", "focus": "أكتشف حاجات مدرست رسم جدارية، ومن يجيد الخط يكتب عبارات توعوية، ومن يجيد التنظيم يوزع المهام.", "- للطالب: احتفظ بعجلة حل المشكلات التي أعددتها مع مجموعتك. وقبل الحصة القادمة استمع إلى نص «حينا المتطوع (2)» ص 66–67 عبر رمز QR، ودوّن حاجات حديقة الحي إلى التطوير.\n- لولي الأمر: ساعد ابنك على الاستماع إلى نص ص 66–67، وناقشه في مرفق بالحي أو المدرسة يحتاج إلى عمل تطوعي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=7"]}], "combined": ["الحصة 1:\n1. يوضح المقصود بالعمل التطوعي ونوعيه الفردي والجماعي.\n2. يقترح عملًا تطوعيًا لكل فرد من أفراد الحي بحسب ما يجيده لتطوير الحديقة.\n\nمخرج تعليمي آخر:\n3. يقدّر قيمة المبادرة إلى عمل الخير في الحي دون انتظار مقابل.\n\nالحصة 2:\n1. يحدد مشكلة في أحد مرافق المدرسة تحتاج إلى عمل تطوعي.\n2. يقترح حلولًا للمشكلة ويختار أنسبها باستخدام نموذج «عجلة حل المشكلات».\n\nمخرج تعليمي آخر:\n3. يتعاون مع زملائه في جولة استكشافية بالمدرسة ملتزمًا بتعليمات المعلم.", "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تحليل\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الحصة 1:\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي\n\nالحصة 2:\n1. التعلم المبني على حل المشكلات\n2. التعلم التعاوني\n3. التعلم المبني على اللعب", "الحصة 1:\n1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. السبورة الذكية\n5. الأقلام\n\nالحصة 2:\n1. الكتاب\n2. الأقلام\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: لوحة ورقية مكبرة لنموذج «عجلة حل المشكلات»، ومرافق المدرسة (جولة ميدانية)", "الحصة 1:\n1. العمل التطوعي: كل عمل خير يُبذل للحي عن رغبة دون مقابل مادي، ويكون فرديًا أو جماعيًا.\n2. أنواع العمل التطوعي: فردي يقوم به شخص واحد، وجماعي يشترك فيه عدد من الأفراد لتحقيق هدف مشترك.\n\nالحصة 2:\n1. المشكلة: موقف أو خلل يحتاج إلى حل، مثل مرفق متضرر أو غير نظيف.\n2. عجلة حل المشكلات: نموذج يحدد فيه الطالب اسم المرفق، والمشكلة، والحلول المقترحة لها، والحل الأنسب.", "الحصة 1:\nالتعلم القبلي: اكتشف الطالب في الوحدتين السابقتين ما يجيده هو وما يجيده أفراد أسرته، ويتهيأ الآن لاكتشاف ما يجيده أفراد حيّه.\n\nالتهيئة:\n1. يعرض المعلم صورة مدخل الوحدة ص 59 ولوحة (العمل التطوعي).\n2. يطلب من الطلاب تأمل الصورة والتعبير عن رأيهم فيما يقوم به الأشخاص.\n3. يتوصل معهم إلى أهمية المبادرة لعمل الخير في مختلف المجالات، وأن هذه الأعمال تسمى عملًا تطوعيًا: كل عمل خير يُبذل عن رغبة دون مقابل مادي، ويكون فرديًا أو جماعيًا.\n\nالحصة 2:\nالتعلم القبلي: تعرّف الطالب في الحصة السابقة مفهوم العمل التطوعي، واقترح أعمالًا تطوعية لأفراد الحي بحسب ما يجيدونه.\n\nالتهيئة:\n1. يعرض المعلم مشكلة قصيرة: «صنبور ماء يسرب الماء في المدرسة منذ أيام، ولا أحد يبلّغ عنه». ويسأل: ما المشكلة؟ ماذا يمكن أن نفعل؟\n2. يجمع اقتراحات الطلاب، ثم يعرض نموذج «عجلة حل المشكلات» مكبرًا، ويضع المشكلة والاقتراحات في أجزائه، ويختار معهم الحل الأنسب.", "الحصة 1:\nالتهيئة (6 دقائق): لوحة العمل التطوعي\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض اللوحة ويطلب من الطلاب وصف ما يقوم به الأشخاص وسببه، ويقودهم إلى استنتاج خصائص العمل التطوعي (رغبة، بلا مقابل، فردي أو جماعي) قبل صياغة التعريف.\n- الطالب: يتأمل الصورة، ويعبر عن رأيه، ويستنتج خصائص العمل التطوعي.\n\nالنشاط 1 (12 دقيقة): نص «حينا المتطوع (1)» ص 62–63\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف المجموعات بأدوار بإعداد بطاقتين: «الحدث الذي اجتمع عليه أفراد الحي» و«ما يجيده كل فرد من الحضور»، ثم يناقش الإجابات ويقدم التغذية الراجعة.\n- الطالب: يستمع إلى النص، ويستخرج مع مجموعته الحدث (اجتماع أفراد الحي في المجلس العام لمناقشة تطوير حديقة الحي) وما يجيده الحضور (سعيد: الكهرباء، سالم: النجارة، راشد: البناء، أم ناصر وسعاد: التشجير، العم صالح: ورشة لصناعة الحديد والألمنيوم).\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 64: أقترح عملًا تطوعيًا لكل فرد\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة اقتراح عمل تطوعي لكل فرد لتطوير الحديقة، ثم يكتبه كل طالب في كتابه، ويناقش المعلم الإجابات مستعينًا بجدول دليل المعلم.\n- الطالب: يتشاور مع مجموعته ويكتب الاقتراحات: أم ناصر وسعاد: إعادة تشجير الحديقة وتنسيق النباتات، سالم: صناعة الطاولات والكراسي، سعيد: إصلاح المصابيح والتوصيلات الكهربائية، راشد: إعادة بناء طرق الحديقة ورصفها، صالح: صناعة المظلات.\n\nالختام (8 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويطلب ملاحظة مرفق في المدرسة يحتاج إلى تطوير استعدادًا للحصة القادمة.\n- الطالب: يجيب بمفرده عن الأسئلة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (5 دقائق): مشكلة الصنبور\n- الاستراتيجية: التعلم المبني على حل المشكلات\n- المعلم: يعرض المشكلة، ويطلب اقتراح حلول، ثم يرتبها في نموذج العجلة المكبر ويختار مع الطلاب الحل الأنسب.\n- الطالب: يحدد المشكلة، ويقترح حلولًا، ويشارك في اختيار الأنسب.\n\nالنشاط 1 (12 دقيقة): جولة المجموعات في مرافق المدرسة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يوزع على كل مجموعة مرفقًا (الساحة، أو المقصف، أو الممرات، أو الحديقة المدرسية، أو مركز مصادر التعلم) بعد التنسيق مع إدارة المدرسة، ويحدد الأدوار (قائد، ومسجل، وراسم، ومراقب وقت)، ويرافق الجولة ويذكّر بقواعد النظام والسلامة.\n- الطالب: يتجول مع مجموعته في المرفق المحدد، ويؤدي دوره، ويسجل ما يلاحظه من مشكلات تحتاج إلى عمل تطوعي.\n\nالنشاط 2 (12 دقيقة): نشاط (2) ص 65: عجلة حل المشكلات\n- الاستراتيجية: التعلم المبني على حل المشكلات\n- المعلم: يطلب من كل مجموعة تعبئة العجلة: اسم المرفق، والمشكلة، والحلول المقترحة، والحل الأنسب مع تعليل اختياره بالموازنة بين سهولة التنفيذ والتكلفة ودوام الأثر.\n- الطالب: يحدد مع مجموعته المشكلة بدقة، ويقترح حلولًا، ويوازن بينها ويختار الأنسب، ويعبئ العجلة في كتابه.\n\nالنشاط 3 (5 دقائق): عرض العجلات أمام المجموعات\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من متحدث كل مجموعة عرض العجلة في دقيقة، ويقدم التغذية الراجعة.\n- الطالب: يعرض المتحدث عمل المجموعة، ويستمع الطلاب للمجموعات الأخرى.\n\nالختام (6 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يشغّل مسابقة المجموعات (درس «أنا متطوع»، محور الحصة، 4 أسئلة)، ثم يطرح أسئلة التقويم الختامي الثلاثة جولة أخيرة.\n- الطالب: يتنافس مع مجموعته، ويجيب في دورها، ويشارك في جولة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): أين اجتمع أفراد الحي؟ ولماذا؟\nالإجابة: في المجلس العام؛ لمناقشة أهمية تطوير حديقة الحي واقتراح أعمال تطوعية تسهم في ذلك.\n\nس2 (مستوى التطبيق): اذكر ثلاثة من الحضور وما يجيده كل منهم.\nالإجابة: سعيد: الكهرباء، وسالم: النجارة، وراشد: البناء (ويقبل: العم صالح: ورشة الحديد والألمنيوم، وأم ناصر وسعاد: التشجير).\n\nس3 (مستوى الاستدلال): لماذا يعد اجتماع أفراد الحي في المجلس خطوة مهمة قبل العمل التطوعي؟\nالإجابة: لأنه يتيح تبادل الأفكار ومعرفة ما يجيده كل فرد، فيُقترح لكل منهم عمل يناسبه ويتعاونون في تطوير الحديقة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما المرفق الذي زارته مجموعتك؟ وما المشكلة التي لاحظتموها فيه؟\nالإجابة: بحسب المجموعة، مثل: ساحة المدرسة، وفيها أوراق ومخلفات متناثرة.\n\nس2 (مستوى التطبيق): اذكر حلين مقترحين للمشكلة التي حددتموها.\nالإجابة: مثل: تنظيم حملة نظافة أسبوعية، ووضع سلال مهملات إضافية مع لوحات توعوية.\n\nس3 (مستوى الاستدلال): كيف اخترتم الحل الأنسب من بين الحلول المقترحة؟\nالإجابة: وازنّا بين الحلول من حيث سهولة التنفيذ، والتكلفة، وقدرتنا على تنفيذه بأنفسنا، ودوام أثره.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتين: شخص ينظف وحده وفريق يزرع معًا، ويصنفهما معه إلى عمل تطوعي فردي وجماعي، ثم يسأله: ما العمل التطوعي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح عمل تطوعي لكل فرد من أفراد الحي بحسب ما يجيده (الكهرباء، النجارة، البناء)، ثم اقتراح عمل تطوعي يناسبهم في المدرسة.", "الحصة 1:\nس1 (مستوى المعرفة): صواب أم خطأ: العمل التطوعي يكون مقابل أجر مادي.\nالإجابة: خطأ؛ فهو عمل خير يُبذل عن رغبة دون مقابل مادي.\n\nس2 (مستوى التطبيق): اقترح عملًا تطوعيًا في الحديقة لكل من سالم النجار وسعيد المتخصص في الكهرباء.\nالإجابة: سالم: صناعة الطاولات والكراسي. سعيد: إصلاح المصابيح والتوصيلات الكهربائية.\n\nس3 (مستوى الاستدلال): ميّز بين العمل التطوعي الفردي والجماعي بمثال لكل منهما من حيك.\nالإجابة: فردي: أن أسقي أشجار الحديقة بنفسي. جماعي: أن يشترك أفراد الحي في تنظيف الحديقة وإعادة تشجيرها.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل عناصر عجلة حل المشكلات: اسم المرفق، والمشكلة، و........، والحل الأنسب.\nالإجابة: الحلول المقترحة للمشكلة.\n\nس2 (مستوى التطبيق): لماذا يعد إصلاح مرفق في المدرسة عملًا تطوعيًا؟\nالإجابة: لأنه عمل خير نقدمه للمدرسة برغبتنا دون مقابل مادي، ويستفيد منه الجميع.\n\nس3 (مستوى الاستدلال): اقترح عملًا تطوعيًا جماعيًا لمرفق في مدرستك، ووضح كيف يستثمر فيه أفراد مجموعتك ما يجيدونه.\nالإجابة: مثل: تجميل جدار الساحة؛ من يجيد الرسم يرسم جدارية، ومن يجيد الخط يكتب عبارات توعوية، ومن يجيد التنظيم يوزع المهام.", "الحصة 1:\n- للطالب: راجع نص «حينا المتطوع (1)» ص 62–63، ولاحظ مرفقًا في مدرستك يحتاج إلى تطوير لتشارك به في الحصة القادمة.\n- لولي الأمر: حدث ابنك عن أعمال تطوعية في حيكم، وعن مشاركات أفراد الأسرة فيها إن وُجدت.\n\nالحصة 2:\n- للطالب: احتفظ بعجلة حل المشكلات التي أعددتها مع مجموعتك. وقبل الحصة القادمة استمع إلى نص «حينا المتطوع (2)» ص 66–67 عبر رمز QR، ودوّن حاجات حديقة الحي إلى التطوير.\n- لولي الأمر: ساعد ابنك على الاستماع إلى نص ص 66–67، وناقشه في مرفق بالحي أو المدرسة يحتاج إلى عمل تطوعي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=7"]}, {"no": 8, "label": "الدرس الثاني: أخطط للعمل التطوعي", "unit": 3, "unitName": "الوحدة الثالثة: حيُّنا المتفاعل", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع الخامس عشر", "dates": "13–17 ديسمبر 2026", "sb": "ص 66–70", "tb": "ص 67–68", "focus": "التخطيط للعمل التطوعي وتوزيع المهام", "fields": ["1. يستنتج أهمية التنظيم والتخطيط وتوزيع المهام في العمل التطوعي.\n2. يحدد لكل مهمة في تطوير حديقة الحي مسؤولية تنفيذها والأدوات المقترحة لها.\n\nمخرج تعليمي آخر:\n3. يخطط مع مجموعته لعمل تطوعي في المدرسة مستفيدًا من الحل الأنسب الذي توصلوا إليه.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "1. التعلم بالاكتشاف\n2. الفصل المقلوب\n3. التعلم التعاوني", "1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. الأقلام\n5. السبورة الذكية", "1. التخطيط للعمل التطوعي: تحديد المهام والمسؤوليات والأدوات والزمان والمكان قبل التنفيذ للحد من العشوائية.\n2. مسؤولية التنفيذ: تكليف شخص أو مجموعة بأداء مهمة محددة في العمل التطوعي بحسب ما يجيده.", "التعلم القبلي: حدد الطالب مع مجموعته في الحصة السابقة مشكلة في أحد مرافق المدرسة، واختار لها الحل الأنسب، واستمع في البيت إلى نص «حينا المتطوع (2)».\n\nالتهيئة:\n1. يعرض المعلم لوحة (الشارع السعيد والشارع الحزين).\n2. يطلب من الطلاب تأمل الصورة، ويسأل: ما الذي جعل الشارع الآخر حزينًا؟\n3. يتوصل معهم إلى أن سبب حزن الشارع عدم نظافته، وأن ذلك نتج عن غياب التنظيم والتخطيط وتوزيع العمل؛ فقد اهتم أفراد الحي بشارع وأهملوا الآخر.", "التهيئة (6 دقائق): الشارع السعيد والشارع الحزين\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض اللوحة، ويطرح السؤال، ويقود الطلاب إلى استنتاج أثر غياب التخطيط قبل أن يصوغه.\n- الطالب: يقارن الشارعين، ويستنتج سبب الفرق، ويربطه بأهمية التخطيط وتوزيع العمل.\n\nالنشاط 1 (7 دقائق): مناقشة نص «حينا المتطوع (2)» الذي استمع إليه الطلاب في البيت\n- الاستراتيجية: الفصل المقلوب\n- المعلم: يتحقق بأسئلة سريعة من الاستماع، ويعيد تشغيل النص عبر رمز QR لمن يحتاج، ثم يناقش حاجة حديقة الحي إلى التطوير.\n- الطالب: يعرض ما دوّنه في البيت: مقاعد قديمة وأخشاب بالية، ومصابيح مكسورة وأخرى لا تعمل، وأشجار ذابلة، وطرق بها شقوق وحفر، وألعاب قديمة.\n\nالنشاط 2 (12 دقيقة): نشاط (1) ص 68–69: أساعد ناصرًا في التخطيط\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من المجموعات تحديد المهمة ومسؤولية التنفيذ والأدوات المقترحة لكل جزء من الحديقة مستعينين بنص الدرس الأول، ثم يعرض جدول دليل المعلم للمقارنة والتغذية الراجعة.\n- الطالب: يشارك مجموعته في تعبئة المهام: التشجير (أم ناصر وسعاد: تربة، شتلات، أدوات زراعية)، والطاولات (سالم: خشب، مطرقة، مسامير، أصباغ)، والمصابيح (سعيد: أسلاك، مصابيح)، والممرات (راشد: رمل، إسمنت، ماء، حجارة)، والمظلات (صالح: قماش، ألمنيوم، حديد، مسامير).\n\nالنشاط 3 (10 دقائق): نشاط (2) ص 70: استمارة خطة عمل تطوعي في المدرسة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يوجّه كل مجموعة إلى التخطيط لتنفيذ الحل الأنسب الذي توصلت إليه في عجلة حل المشكلات، بتعبئة الاستمارة: نوع العمل (فردي أو جماعي)، والهدف، والأدوات، ومكان التنفيذ، وتاريخه، ومدته، وينسق مسبقًا مع إدارة المدرسة لتنفيذه في الحصة القادمة.\n- الطالب: يشارك مجموعته في تعبئة الاستمارة، ويقترح الأدوات الآمنة والبسيطة اللازمة.\n\nالختام (5 دقائق): الرؤوس المرقمة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطرح أسئلة التقويم الختامي سؤالًا سؤالًا، وبعد تشاور المجموعة يستدعي رقمًا عشوائيًا ليجيب.\n- الطالب: يتشاور مع مجموعته، ويجيب إذا استُدعي رقمه.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): لماذا كان الشارع الآخر حزينًا؟\nالإجابة: لأنه غير نظيف؛ بسبب عدم التنظيم والتخطيط وتوزيع العمل، فقد اهتم أفراد الحي بشارع وأهملوا الآخر.\n\nس2 (مستوى التطبيق): اذكر ثلاثة من مظاهر حاجة حديقة الحي إلى التطوير.\nالإجابة: مقاعد قديمة وأخشاب بالية، ومصابيح مكسورة وأخرى لا تعمل، وأشجار ذابلة (ويقبل: طرق بها شقوق وحفر، وألعاب قديمة).\n\nس3 (مستوى الاستدلال): من يتولى مهمة إعادة رصف ممرات الحديقة؟ ولماذا؟ وما الأدوات التي يحتاج إليها؟\nالإجابة: راشد؛ لأنه يجيد البناء، ويحتاج إلى رمل وإسمنت وماء وحجارة.\n\n• نشاط علاجي (لمن لم يتقن): يرتب المعلم مع التلميذ بطاقات مهام تطوير الحديقة، ويطابقها معه بالمسؤول عنها والأدوات (راشد يرصف بالإسمنت، سعيد يصلح المصابيح)، ثم يسأله: من يصلح المصابيح؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لعمل تطوعي في مرفق من مرافق المدرسة، توزع المهام على أفراد المجموعة وتحدد الأدوات والوقت لكل مهمة.", "س1 (مستوى المعرفة): حدد المسؤول عن كل مهمة: إصلاح مصابيح الحديقة، صناعة الطاولات.\nالإجابة: إصلاح المصابيح: سعيد. صناعة الطاولات: سالم.\n\nس2 (مستوى التطبيق): لماذا نوزع مهام العمل التطوعي بحسب ما يجيده كل فرد؟\nالإجابة: ليؤدي كل فرد ما يتقنه، فيُنجز العمل بجودة ودقة وفي وقت أقل.\n\nس3 (مستوى الاستدلال): ما العنصر الذي تراه الأهم في استمارة خطة العمل التطوعي في المدرسة؟ علّل.\nالإجابة: إجابة معللة، مثل: الهدف من العمل؛ لأنه يوجه جميع المهام والأدوات نحو غاية واضحة.", "- للطالب: أكمل استمارة الخطة في ص 70 مع مجموعتك، واتفقوا على الأدوات البسيطة الآمنة التي يحضرها كل فرد للتنفيذ في الحصة القادمة.\n- لولي الأمر: ساعد ابنك على تجهيز ما اتفقت عليه مجموعته من أدوات بسيطة آمنة (قفازات، أكياس، أدوات زراعة صغيرة).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=8"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع السادس عشر", "dates": "20–24 ديسمبر 2026", "sb": "ص 70–71", "tb": "ص 68–69", "focus": "أنفذ عملًا تطوعيًا في مدرستي", "fields": ["1. يوزع مع مجموعته مهام العمل التطوعي على أفراد الفريق في جدول (المهمة، ومسؤولية التنفيذ، والملحوظات).\n2. يشارك في تنفيذ العمل التطوعي الذي خططت له مجموعته في المدرسة.\n\nمخرج تعليمي آخر:\n3. يقيّم ما أنجزته مجموعته في العمل التطوعي من حيث الالتزام بالخطة والوقت.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على المشاريع\n3. التعلم التشاركي", "1. الكتاب\n2. الأقلام\n3. أخرى: أدوات العمل التطوعي البسيطة بحسب خطة كل مجموعة (قفازات، أكياس، أدوات زراعة أو تنظيف)، ومرفق المدرسة المختار", "1. فريق العمل التطوعي: مجموعة من الأفراد يتعاونون لتنفيذ عمل تطوعي محدد وفق خطة.\n2. تقييم العمل التطوعي: مراجعة ما أُنجز ومقارنته بالخطة لمعرفة جوانب النجاح وما يحتاج إلى تحسين.", "التعلم القبلي: خطط الطالب مع مجموعته في الحصة السابقة لعمل تطوعي في أحد مرافق المدرسة، وأعد استمارة الخطة في ص 70.\n\nالتهيئة:\n1. يطلب المعلم من كل مجموعة مراجعة استمارة خطتها في ص 70 خلال دقيقتين.\n2. يذكّر بقواعد السلامة والنظام في أثناء التنفيذ، ويتأكد من جاهزية الأدوات.", "التهيئة (4 دقائق): مراجعة الخطة وقواعد السلامة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من المجموعات مراجعة الخطة، ويذكّر بقواعد السلامة، ويتحقق من الأدوات.\n- الطالب: يراجع مع مجموعته الخطة والأدوات، ويلتزم بقواعد السلامة.\n\nالنشاط 1 (8 دقائق): ص 71: توزيع المهام على أفراد الفريق\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة تعبئة جدول توزيع المهام (المهمة، ومسؤولية التنفيذ، والملحوظات) بحيث يتولى كل فرد مهمة تناسب ما يجيده.\n- الطالب: يتفق مع زملائه على مهمته، ويدونها في الجدول مع ملحوظاتها.\n\nالنشاط 2 (18 دقيقة): تنفيذ العمل التطوعي في مرفق المدرسة\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يرافق المجموعات إلى المرافق المحددة بعد التنسيق المسبق مع الإدارة، ويتابع التنفيذ وفق الخطة، ويوجه ويتدخل عند الحاجة، ويلتقط صورًا للتوثيق إن سمحت المدرسة.\n- الطالب: ينفذ مهمته مع فريقه وفق الخطة والجدول، ويتعاون مع زملائه، ويحافظ على السلامة والنظام.\n\nالنشاط 3 (6 دقائق): مشاركة الانطباعات بعد التنفيذ مبادرة تطوعية بسيطة في الحي أو البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=8"]}], "combined": ["الحصة 1:\n1. يستنتج أهمية التنظيم والتخطيط وتوزيع المهام في العمل التطوعي.\n2. يحدد لكل مهمة في تطوير حديقة الحي مسؤولية تنفيذها والأدوات المقترحة لها.\n\nمخرج تعليمي آخر:\n3. يخطط مع مجموعته لعمل تطوعي في المدرسة مستفيدًا من الحل الأنسب الذي توصلوا إليه.\n\nالحصة 2:\n1. يوزع مع مجموعته مهام العمل التطوعي على أفراد الفريق في جدول (المهمة، ومسؤولية التنفيذ، والملحوظات).\n2. يشارك في تنفيذ العمل التطوعي الذي خططت له مجموعته في المدرسة.\n\nمخرج تعليمي آخر:\n3. يقيّم ما أنجزته مجموعته في العمل التطوعي من حيث الالتزام بالخطة والوقت.", "الحصة 1:\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الحصة 1:\n1. التعلم بالاكتشاف\n2. الفصل المقلوب\n3. التعلم التعاوني\n\nالحصة 2:\n1. التعلم التعاوني\n2. التعلم المبني على المشاريع\n3. التعلم التشاركي", "الحصة 1:\n1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. الأقلام\n5. السبورة الذكية\n\nالحصة 2:\n1. الكتاب\n2. الأقلام\n3. أخرى: أدوات العمل التطوعي البسيطة بحسب خطة كل مجموعة (قفازات، أكياس، أدوات زراعة أو تنظيف)، ومرفق المدرسة المختار", "الحصة 1:\n1. التخطيط للعمل التطوعي: تحديد المهام والمسؤوليات والأدوات والزمان والمكان قبل التنفيذ للحد من العشوائية.\n2. مسؤولية التنفيذ: تكليف شخص أو مجموعة بأداء مهمة محددة في العمل التطوعي بحسب ما يجيده.\n\nالحصة 2:\n1. فريق العمل التطوعي: مجموعة من الأفراد يتعاونون لتنفيذ عمل تطوعي محدد وفق خطة.\n2. تقييم العمل التطوعي: مراجعة ما أُنجز ومقارنته بالخطة لمعرفة جوانب النجاح وما يحتاج إلى تحسين.", "الحصة 1:\nالتعلم القبلي: حدد الطالب مع مجموعته في الحصة السابقة مشكلة في أحد مرافق المدرسة، واختار لها الحل الأنسب، واستمع في البيت إلى نص «حينا المتطوع (2)».\n\nالتهيئة:\n1. يعرض المعلم لوحة (الشارع السعيد والشارع الحزين).\n2. يطلب من الطلاب تأمل الصورة، ويسأل: ما الذي جعل الشارع الآخر حزينًا؟\n3. يتوصل معهم إلى أن سبب حزن الشارع عدم نظافته، وأن ذلك نتج عن غياب التنظيم والتخطيط وتوزيع العمل؛ فقد اهتم أفراد الحي بشارع وأهملوا الآخر.\n\nالحصة 2:\nالتعلم القبلي: خطط الطالب مع مجموعته في الحصة السابقة لعمل تطوعي في أحد مرافق المدرسة، وأعد استمارة الخطة في ص 70.\n\nالتهيئة:\n1. يطلب المعلم من كل مجموعة مراجعة استمارة خطتها في ص 70 خلال دقيقتين.\n2. يذكّر بقواعد السلامة والنظام في أثناء التنفيذ، ويتأكد من جاهزية الأدوات.", "الحصة 1:\nالتهيئة (6 دقائق): الشارع السعيد والشارع الحزين\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض اللوحة، ويطرح السؤال، ويقود الطلاب إلى استنتاج أثر غياب التخطيط قبل أن يصوغه.\n- الطالب: يقارن الشارعين، ويستنتج سبب الفرق، ويربطه بأهمية التخطيط وتوزيع العمل.\n\nالنشاط 1 (7 دقائق): مناقشة نص «حينا المتطوع (2)» الذي استمع إليه الطلاب في البيت\n- الاستراتيجية: الفصل المقلوب\n- المعلم: يتحقق بأسئلة سريعة من الاستماع، ويعيد تشغيل النص عبر رمز QR لمن يحتاج، ثم يناقش حاجة حديقة الحي إلى التطوير.\n- الطالب: يعرض ما دوّنه في البيت: مقاعد قديمة وأخشاب بالية، ومصابيح مكسورة وأخرى لا تعمل، وأشجار ذابلة، وطرق بها شقوق وحفر، وألعاب قديمة.\n\nالنشاط 2 (12 دقيقة): نشاط (1) ص 68–69: أساعد ناصرًا في التخطيط\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من المجموعات تحديد المهمة ومسؤولية التنفيذ والأدوات المقترحة لكل جزء من الحديقة مستعينين بنص الدرس الأول، ثم يعرض جدول دليل المعلم للمقارنة والتغذية الراجعة.\n- الطالب: يشارك مجموعته في تعبئة المهام: التشجير (أم ناصر وسعاد: تربة، شتلات، أدوات زراعية)، والطاولات (سالم: خشب، مطرقة، مسامير، أصباغ)، والمصابيح (سعيد: أسلاك، مصابيح)، والممرات (راشد: رمل، إسمنت، ماء، حجارة)، والمظلات (صالح: قماش، ألمنيوم، حديد، مسامير).\n\nالنشاط 3 (10 دقائق): نشاط (2) ص 70: استمارة خطة عمل تطوعي في المدرسة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يوجّه كل مجموعة إلى التخطيط لتنفيذ الحل الأنسب الذي توصلت إليه في عجلة حل المشكلات، بتعبئة الاستمارة: نوع العمل (فردي أو جماعي)، والهدف، والأدوات، ومكان التنفيذ، وتاريخه، ومدته، وينسق مسبقًا مع إدارة المدرسة لتنفيذه في الحصة القادمة.\n- الطالب: يشارك مجموعته في تعبئة الاستمارة، ويقترح الأدوات الآمنة والبسيطة اللازمة.\n\nالختام (5 دقائق): الرؤوس المرقمة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطرح أسئلة التقويم الختامي سؤالًا سؤالًا، وبعد تشاور المجموعة يستدعي رقمًا عشوائيًا ليجيب.\n- الطالب: يتشاور مع مجموعته، ويجيب إذا استُدعي رقمه.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (4 دقائق): مراجعة الخطة وقواعد السلامة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من المجموعات مراجعة الخطة، ويذكّر بقواعد السلامة، ويتحقق من الأدوات.\n- الطالب: يراجع مع مجموعته الخطة والأدوات، ويلتزم بقواعد السلامة.\n\nالنشاط 1 (8 دقائق): ص 71: توزيع المهام على أفراد الفريق\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة تعبئة جدول توزيع المهام (المهمة، ومسؤولية التنفيذ، والملحوظات) بحيث يتولى كل فرد مهمة تناسب ما يجيده.\n- الطالب: يتفق مع زملائه على مهمته، ويدونها في الجدول مع ملحوظاتها.\n\nالنشاط 2 (18 دقيقة): تنفيذ العمل التطوعي في مرفق المدرسة\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يرافق المجموعات إلى المرافق المحددة بعد التنسيق المسبق مع الإدارة، ويتابع التنفيذ وفق الخطة، ويوجه ويتدخل عند الحاجة، ويلتقط صورًا للتوثيق إن سمحت المدرسة.\n- الطالب: ينفذ مهمته مع فريقه وفق الخطة والجدول، ويتعاون مع زملائه، ويحافظ على السلامة والنظام.\n\nالنشاط 3 (6 دقائق): مشاركة الانطباعات بعد التنفيذ\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يجمع الطلاب في الصف، ويدير حلقة نقاش: ماذا أنجزنا؟ ما الذي واجهنا؟ بماذا شعرنا؟\n- الطالب: يعرض ما أنجزه فريقه، ويعبر عن شعوره، ويستمع لتجارب الفرق الأخرى.\n\nالختام (4 دقائق): حلقة التقويم\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يطرح أسئلة التقويم الختامي الثلاثة على الصف، ويختار مجيبين من فرق مختلفة، ويختم بشكر الطلاب على مبادرتهم.\n- الطالب: يجيب عن الأسئلة، ويضيف إلى إجابات زملائه.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): لماذا كان الشارع الآخر حزينًا؟\nالإجابة: لأنه غير نظيف؛ بسبب عدم التنظيم والتخطيط وتوزيع العمل، فقد اهتم أفراد الحي بشارع وأهملوا الآخر.\n\nس2 (مستوى التطبيق): اذكر ثلاثة من مظاهر حاجة حديقة الحي إلى التطوير.\nالإجابة: مقاعد قديمة وأخشاب بالية، ومصابيح مكسورة وأخرى لا تعمل، وأشجار ذابلة (ويقبل: طرق بها شقوق وحفر، وألعاب قديمة).\n\nس3 (مستوى الاستدلال): من يتولى مهمة إعادة رصف ممرات الحديقة؟ ولماذا؟ وما الأدوات التي يحتاج إليها؟\nالإجابة: راشد؛ لأنه يجيد البناء، ويحتاج إلى رمل وإسمنت وماء وحجارة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما المهمة التي كُلفت بها في فريق العمل؟\nالإجابة: بحسب توزيع المجموعة، مثل: جمع المخلفات، أو سقي النباتات، أو تثبيت اللوحات التوعوية.\n\nس2 (مستوى التطبيق): هل التزم فريقك بالخطة في أثناء التنفيذ؟ وضح.\nالإجابة: مثل: نعم، نفذنا المهام بحسب الجدول، وعدّلنا مهمة واحدة بالتشاور بسبب نقص أداة.\n\nس3 (مستوى الاستدلال): ما الملحوظة التي ستضيفها إلى جدول توزيع المهام لتحسين التنفيذ في المرة القادمة؟\nالإجابة: مثل: تحديد وقت لكل مهمة، وتجهيز الأدوات قبل يوم من التنفيذ.\n\n• نشاط علاجي (لمن لم يتقن): يرتب المعلم مع التلميذ بطاقات مهام تطوير الحديقة، ويطابقها معه بالمسؤول عنها والأدوات (راشد يرصف بالإسمنت، سعيد يصلح المصابيح)، ثم يسأله: من يصلح المصابيح؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لعمل تطوعي في مرفق من مرافق المدرسة، توزع المهام على أفراد المجموعة وتحدد الأدوات والوقت لكل مهمة.", "الحصة 1:\nس1 (مستوى المعرفة): حدد المسؤول عن كل مهمة: إصلاح مصابيح الحديقة، صناعة الطاولات.\nالإجابة: إصلاح المصابيح: سعيد. صناعة الطاولات: سالم.\n\nس2 (مستوى التطبيق): لماذا نوزع مهام العمل التطوعي بحسب ما يجيده كل فرد؟\nالإجابة: ليؤدي كل فرد ما يتقنه، فيُنجز العمل بجودة ودقة وفي وقت أقل.\n\nس3 (مستوى الاستدلال): ما العنصر الذي تراه الأهم في استمارة خطة العمل التطوعي في المدرسة؟ علّل.\nالإجابة: إجابة معللة، مثل: الهدف من العمل؛ لأنه يوجه جميع المهام والأدوات نحو غاية واضحة.\n\nالحصة 2:\nس1 (مستوى المعرفة): صواب أم خطأ: يكفي أن نبدأ العمل التطوعي دون توزيع للمهام.\nالإجابة: خطأ؛ فعدم توزيع المهام يؤدي إلى العشوائية وإهمال بعض الأعمال.\n\nس2 (مستوى التطبيق): اذكر أثرين للعمل التطوعي الذي نفذتموه في مرفق المدرسة.\nالإجابة: مثل: أصبح المرفق أنظف وأجمل، وزاد انتباه الطلاب إلى المحافظة عليه.\n\nس3 (مستوى الاستدلال): قيّم أداء فريقك في العمل التطوعي، واقترح تحسينًا واحدًا.\nالإجابة: إجابة تقييمية، مثل: أنجزنا معظم المهام في الوقت المحدد بتعاون جيد، ونقترح تنظيم الوقت بصورة أدق.", "الحصة 1:\n- للطالب: أكمل استمارة الخطة في ص 70 مع مجموعتك، واتفقوا على الأدوات البسيطة الآمنة التي يحضرها كل فرد للتنفيذ في الحصة القادمة.\n- لولي الأمر: ساعد ابنك على تجهيز ما اتفقت عليه مجموعته من أدوات بسيطة آمنة (قفازات، أكياس، أدوات زراعة صغيرة).\n\nالحصة 2:\n- للطالب: اكتب في دفترك ما شعرت به بعد مشاركتك في العمل التطوعي، واقرأ نص «حينا المتطوع (3)» ص 72–73 استعدادًا للحصة القادمة.\n- لولي الأمر: أثنِ على مشاركة ابنك في العمل التطوعي بالمدرسة، وشجعه على مبادرة تطوعية بسيطة في الحي أو البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=8"]}, {"no": 9, "label": "الدرس الثالث: تطوعي حياة", "unit": 3, "unitName": "الوحدة الثالثة: حيُّنا المتفاعل", "periods": [{"pno": 1, "ptotal": 1, "week": "الأسبوع السابع عشر", "dates": "27–30 ديسمبر 2026", "sb": "ص 72–75", "tb": "ص 70–72", "focus": "آثار العمل التطوعي وفوائده", "fields": ["1. يستنتج فوائد العمل التطوعي على ناصر وعلى أفراد الحي من خلال الرموز وسحابة الكلمات.\n2. يكتب مع مجموعته رسالة إلى مجلس أولياء الأمور تتضمن أفكارًا تطويرية لأحد مرافق المدرسة وأثرها الإيجابي.\n\nمخرج تعليمي آخر:\n3. يقدّر أهمية استثمار ما يجيده أفراد الحي في العمل التطوعي.", "المخرج 1: تحليل\nالمخرج 2: إبداع\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التشاركي", "1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات الرموز والكلمات للعبة المطابقة", "1. فوائد العمل التطوعي: آثار إيجابية تعود على المتطوع (السعادة، والثواب، والتواصل، واستثمار الوقت) وعلى الحي والوطن (التعاون، وحب الوطن، وحل المشكلات، وانتشار الوعي).\n2. اليوم العالمي للتطوع: مناسبة عالمية في الخامس من ديسمبر يُحتفى فيها بالمتطوعين وأعمالهم.", "التعلم القبلي: نفذ الطالب مع مجموعته في الحصة السابقة عملًا تطوعيًا في أحد مرافق المدرسة، وقرأ في البيت نص «حينا المتطوع (3)».\n\nالتهيئة:\n1. يعرض المعلم على السبورة قوله تعالى: «فَمَن تَطَوَّعَ خَيْرًا فَهُوَ خَيْرٌ لَّهُ» (البقرة: 184).\n2. يطلب من الطلاب تأمل الآية والتعبير عن المقصود بها.\n3. يتوصل معهم إلى أن أي عمل خير يقوم به الفرد تجاه أفراد الحي الذي يعيش فيه سيعود إليه بالخير والثواب من الله تعالى.", "التهيئة (5 دقائق): تأمل الآية الكريمة\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض الآية، ويسأل عن معناها، ويترك الطلاب يستنتجون أن خير التطوع يعود على صاحبه قبل أن يصوغ الفكرة.\n- الطالب: يتأمل الآية، ويعبر عن فهمه لها، ويربطها بعمله التطوعي في الحصة السابقة.\n\nالنشاط 1 (8 دقائق): نص «حينا المتطوع (3)» ص 72–73: قبل وبعد\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويعرض جدولًا من عمودين «حال الحديقة قبل التطوع» (من نص الدرس السابق) و«حالها بعده»، ويقود الطلاب إلى اكتشاف أثر العمل التطوعي في الحديقة وفي ناصر وأفراد الحي.\n- الطالب: يستمع إلى النص، ويكمل الجدول (أشجار ذابلة ← ظلال وافرة وشجر، وطرق بها حفر ← طرق سالكة دون حفر، ومصابيح مكسورة ← أنوار وقمر، وألعاب قديمة ← تيجان ودرر)، ويستنتج الأثر.\n\nالنشاط 2 (9 دقائق): نشاط (1) ص 74: لعبة «طابق الرمز»\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يعرض الرموز وسحابة الكلمات، ويعطي كل مجموعة بطاقات الكلمات، ويطلق سباقًا: أي مجموعة تطابق أسرع كل رمز بكلمته وتصنفها (فوائد على ناصر/فوائد على أفراد الحي)؟ ثم يراجع الإجابات ويكتبها الطلاب في كتبهم.\n- الطالب: يتسابق مع مجموعته في المطابقة والتصنيف (على ناصر: السعادة، والثواب، والتواصل، واستثمار الوقت؛ على أفراد الحي: التعاون، وحب الوطن، وحل المشكلات، وانتشار الوعي)، ثم يدونها في الكتاب.\n\nالنشاط 3 (11 دقيقة): نشاط (2) ص 75: رسالة إلى مجلس أولياء الأمور\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يوضح مناسبة اليوم العالمي للتطوع (الخامس من ديسمبر)، ويطلب من كل مجموعة كتابة رسالة مشتركة تبين الأفكار التطويرية للمرفق الذي درسته، وأثرها في ذواتهم وفي الآخرين وفي المدرسة، ثم يقرأ متحدث كل مجموعة رسالتها، ويضيف الصف اقتراحاته.\n- الطالب: يشارك مجموعته في صياغة الرسالة، ويكتبها في كتابه، ويستمع لرسائل المجموعات الأخرى ويضيف إليها.\n\nالختام (7 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يشغّل مسابقة المجموعات (درس «تطوعي حياة»، 6 أسئلة)، ثم يطرح أسئلة التقويم الختامي الثلاثة جولة أخيرة، ويعلن المجموعة الفائزة ختامًا للفصل الدراسي.\n- الطالب: يتنافس مع مجموعته، ويجيب في دورها، ويشارك في جولة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): ماذا نظم أفراد الحي في الحديقة بعد تطويرها؟\nالإجابة: وليمة جماعية.\n\nس2 (مستوى التطبيق): قارن بين حال حديقة الحي قبل العمل التطوعي وبعده في أمرين.\nالإجابة: قبل: أشجار ذابلة وطرق بها شقوق وحفر. بعد: ظلال وافرة وشجر، وطرق سالكة دون حفر (ويقبل: المصابيح والألعاب).\n\nس3 (مستوى الاستدلال): ما المقصود بقوله تعالى: «فمن تطوع خيرًا فهو خير له»؟ وكيف يظهر ذلك في قصة ناصر؟\nالإجابة: أن من يعمل الخير تطوعًا يعود عليه بالخير والثواب من الله تعالى؛ وقد عاد على ناصر وأفراد الحي بالسعادة وبحديقة جميلة يستمتعون بها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتي الحديقة قبل العمل التطوعي وبعده، ويعد معه الفروق واحدًا واحدًا (الأشجار، الطرق، المصابيح)، ثم يسأله: ماذا نظم أهل الحي بعد التطوير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة رسالة إلى مجلس أولياء الأمور تقترح فكرة تطويرية لأحد مرافق المدرسة وأثرها الإيجابي، مع ذكر فائدة العمل التطوعي للمتطوع.", "س1 (مستوى المعرفة): اذكر فائدتين للعمل التطوعي على ناصر.\nالإجابة: السعادة، والثواب (ويقبل: التواصل، واستثمار الوقت).\n\nس2 (مستوى التطبيق): اذكر فائدتين للعمل التطوعي على أفراد الحي.\nالإجابة: التعاون، وحب الوطن (ويقبل: حل المشكلات، وانتشار الوعي).\n\nس3 (مستوى الاستدلال): اكتب فكرة تطويرية واحدة لمرفق في مدرستك، وبيّن أثرها في ذاتك وفي الآخرين.\nالإجابة: مثل: زراعة ركن أخضر في الساحة؛ أثرها فيّ: الشعور بالسعادة والانتماء، وفي الآخرين: مكان جميل للراحة والقراءة.", "- للطالب: راجع دروس الوحدة الثالثة ص 62–75، وشارك أسرتك في عمل تطوعي بسيط خلال الإجازة.\n- لولي الأمر: اصطحب ابنك في مبادرة تطوعية أسرية أو في الحي، وناقشه في أثرها عليه وعلى الآخرين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=9"]}], "combined": ["الحصة 1:\n1. يستنتج فوائد العمل التطوعي على ناصر وعلى أفراد الحي من خلال الرموز وسحابة الكلمات.\n2. يكتب مع مجموعته رسالة إلى مجلس أوليا علم المبني على اللعب\n- المعلم: يعرض الرموز وسحابة الكلمات، ويعطي كل مجموعة بطاقات الكلمات، ويطلق سباقًا: أي مجموعة تطابق أسرع كل رمز بكلمته وتصنفها (فوائد على ناصر/فوائد على أفراد الحي)؟ ثم يراجع الإجابات ويكتبها الطلاب في كتبهم.\n- الطالب: يتسابق مع مجموعته في المطابقة والتصنيف (على ناصر: السعادة، والثواب، والتواصل، واستثمار الوقت؛ على أفراد الحي: التعاون، وحب الوطن، وحل المشكلات، وانتشار الوعي)، ثم يدونها في الكتاب.\n\nالنشاط 3 (11 دقيقة): نشاط (2) ص 75: رسالة إلى مجلس أولياء الأمور\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يوضح مناسبة اليوم العالمي للتطوع (الخامس من ديسمبر)، ويطلب من كل مجموعة كتابة رسالة مشتركة تبين الأفكار التطويرية للمرفق الذي درسته، وأثرها في ذواتهم وفي الآخرين وفي المدرسة، ثم يقرأ متحدث كل مجموعة رسالتها، ويضيف الصف اقتراحاته.\n- الطالب: يشارك مجموعته في صياغة الرسالة، ويكتبها في كتابه، ويستمع لرسائل المجموعات الأخرى ويضيف إليها.\n\nالختام (7 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يشغّل مسابقة المجموعات (درس «تطوعي حياة»، 6 أسئلة)، ثم يطرح أسئلة التقويم الختامي الثلاثة جولة أخيرة، ويعلن المجموعة الفائزة ختامًا للفصل الدراسي.\n- الطالب: يتنافس مع مجموعته، ويجيب في دورها، ويشارك في جولة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): ماذا نظم أفراد الحي في الحديقة بعد تطويرها؟\nالإجابة: وليمة جماعية.\n\nس2 (مستوى التطبيق): قارن بين حال حديقة الحي قبل العمل التطوعي وبعده في أمرين.\nالإجابة: قبل: أشجار ذابلة وطرق بها شقوق وحفر. بعد: ظلال وافرة وشجر، وطرق سالكة دون حفر (ويقبل: المصابيح والألعاب).\n\nس3 (مستوى الاستدلال): ما المقصود بقوله تعالى: «فمن تطوع خيرًا فهو خير له»؟ وكيف يظهر ذلك في قصة ناصر؟\nالإجابة: أن من يعمل الخير تطوعًا يعود عليه بالخير والثواب من الله تعالى؛ وقد عاد على ناصر وأفراد الحي بالسعادة وبحديقة جميلة يستمتعون بها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتي الحديقة قبل العمل التطوعي وبعده، ويعد معه الفروق واحدًا واحدًا (الأشجار، الطرق، المصابيح)، ثم يسأله: ماذا نظم أهل الحي بعد التطوير؟\n• نشاط إثرائي (للمتقنين): يكلف ا <script>
const D = JSON.parse(document.getElementById('data').textContent);
let mode = 'sep', li = 0, pi = 0;
const $ = s => document.querySelector(s);
const sel = $('#lesson');
let og = null, lastUnit = null;
D.lessons.forEach((L, i) => {
  if (L.unit !== lastUnit) { og = document.createElement('optgroup'); og.label = L.unitName; sel.appendChild(og); lastUnit = L.unit; }
  const o = document.createElement('option'); o.value = i; o.textContent = L.label; og.appendChild(o);
});
function setMode(m){
  mode = m;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false'));
  $('#status').textContent = m === 'sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه';
  render();
}
function render(){
  const L = D.lessons[li];
  document.body.className = 'u' + L.unit;
  const tabs = $('#ptabs'); tabs.innerHTML = '';
  if (mode === 'sep') {
    L.periods.forEach((p, k) => {
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = 'الحصة ' + p.pno + ': ' + p.focus;
      b.setAttribute('aria-pressed', k === pi ? 'true' : 'false');
      b.onclick = () => { pi = k; render(); };
      tabs.appendChild(b);
    });
  }
  const meta = $('#meta'); meta.innerHTML = '';
  const add = (k, v, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; const s = document.createElement('span'); s.textContent = k + ': '; d.appendChild(s); d.appendChild(document.createTextNode(v)); meta.appendChild(d); };
  if (mode === 'sep') {
    const p = L.periods[pi];
    add('الدرس', L.label); add('الحصة', p.pno + ' من ' + p.ptotal); add('الأسبوع', p.week + ' (' + p.dates + ')');
    add('كتاب التلميذ', p.sb); add('دليل المعلم', p.tb); add('محور الحصة', p.focus, 'focus');
  } else {
    add('الدرس', L.label); add('عدد الحصص', String(L.periods.length));
    add('الأسابيع', L.periods.map(p => p.week + ' (' + p.dates + ')').join('، '));
    add('محاور الحصص', L.periods.map(p => 'الحصة ' + p.pno + ': ' + p.focus).join('، '), 'focus');
  }
  const texts = mode === 'sep' ? L.periods[pi].fields : L.combined;
  const box = $('#cards'); box.innerHTML = '';
  texts.forEach((t, i) => {
    const c = document.createElement('section'); c.className = 'card';
    const h = document.createElement('header');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    const h2 = document.createElement('h2'); h2.textContent = D.fieldNames[i];
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'copy'; btn.textContent = 'نسخ';
    btn.dataset.idx = i;
    btn.onclick = () => copyText(t, btn);
    h.append(n, h2, btn);
    const pre = document.createElement('pre'); pre.className = 'txt'; pre.textContent = t;
    c.append(h, pre); box.appendChild(c);
  });
}
function legacyCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '-2000px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta); return ok;
}
async function copyText(t, btn){
  let ok = false;
  if (navigator.clipboard && navigator.clipboard.writeText) { try { await navigator.clipboard.writeText(t); ok = true; } catch (e) { ok = false; } }
  if (!ok) ok = legacyCopy(t);
  if (ok) { btn.textContent = 'تم النسخ ✓'; btn.classList.add('done'); clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = 'نسخ'; btn.classList.remove('done'); }, 1800); }
  else openFallback(t);
}
function openFallback(t){
  const fb = $('#fb'), ta = $('#fbText'); ta.value = t; fb.classList.add('on');
  setTimeout(() => { ta.focus(); ta.select(); ta.setSelectionRange(0, t.length); }, 30);
}
$('#fbSelect').onclick = () => { const ta = $('#fbText'); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); try { document.execCommand('copy'); } catch (e) {} };
$('#fbClose').onclick = () => $('#fb').classList.remove('on');
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
sel.onchange = () => { li = +sel.value; pi = 0; render(); };
setMode('sep');
</script>
