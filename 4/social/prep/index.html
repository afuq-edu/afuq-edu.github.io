<script type="application/json" id="data">{"fieldNames": ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"], "lessons": [{"no": 1, "label": "الدرس الأول: أنا أجيد", "unit": 1, "unitName": "الوحدة الأولى: ذاتي المُجيدة", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع الأول", "dates": "6–10 سبتمبر 2026", "sb": "ص 24–28", "tb": "ص 30–34", "focus": "الفرق بين ما أحبه وما أجيده", "fields": ["1. يوضح المقصود بإجادة الأنشطة.\n2. يميز بين ما يحبه ناصر من أنشطة وما يجيده في نص «المبتكر الصغير (1)».\n\nمخرج تعليمي آخر:\n3. يقدّر تميّز الآخرين فيما يجيدونه، ويحترم اختلافهم عنه.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. الأقلام\n5. أخرى: بطاقات الشخصيات العمانية (أحمد بن ماجد، شمساء الخليلية)", "1. إجادة الأنشطة: الإلمام بأداء الأنشطة، وإتقان العمل بها.\n2. الذات الفاعلة: مقدرة الفرد على أداء السلوك الذي يحقق نتائج مرغوبة في البيئة المحيطة به.", "التعلم القبلي: سبق للطالب في الصفوف السابقة التعرف إلى صفاته وتقبلها والمحافظة على ذاته، وهذه الحصة تنقله إلى اكتشاف ما يجيده من أنشطة.\n\nالتهيئة:\n1. يعرض المعلم صفحة مدخل الوحدة (ص 24–25) ويقرأ مع الطلاب عنوانها «ذاتي المُجيدة» وما سيتمكنون منه في نهايتها.\n2. يعرض بطاقتين لشخصيتين عمانيتين: أحمد بن ماجد (يجيد علوم البحار)، وشمساء الخليلية (تجيد علوم الدين).\n3. يسأل: بماذا تتميز هاتان الشخصيتان؟\n4. يتوصل مع الطلاب إلى أن لكل إنسان ما يميزه عن الآخرين وما يجيده من أنشطة وأعمال، وأن إجادة النشاط تعني إتقانه والإلمام به.", "التهيئة (6 دقائق): بطاقات الشخصيات العمانية\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض بطاقتي أحمد بن ماجد وشمساء الخليلية، ويسأل عما تتميز به كل شخصية، ويترك الطلاب يستنتجون معنى الإجادة قبل أن يصوغه لهم.\n- الطالب: يتأمل البطاقتين، ويستنتج ما تجيده كل شخصية، ويصوغ بكلماته معنى إجادة النشاط.\n\nالنشاط 1 (15 دقيقة): قراءة نص «المبتكر الصغير (1)» ص 26–27 وتحليله\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR في الكتاب، ثم يقسمهم إلى مجموعات رباعية بأدوار (قارئ، كاتب، متحدث، مراقب وقت)، ويكلف كل مجموعة بجدول من عمودين: «ما يحبه ناصر» و«ما يجيده ناصر»، والإجابة عن سؤال: ما الفرق بين ما يحب ناصر فعله وما يجيده؟ ثم يدير عرض المجموعات ويتوصل معهم إلى أن الإجادة تتطلب الإلمام والإتقان، وأنها تحقق الذات الفاعلة.\n- الطالب: يستمع إلى النص ويقرؤه، ويؤدي دوره في المجموعة، ويشارك في تعبئة الجدول (يحب: الرسم، وكتابة القصص، والمشاركة في المسابقة وبرمجة الروبوتات؛ يجيد: فك القطع وتركيبها)، ويعرض المتحدث منتج المجموعة.\n\nالنشاط 2 (12 دقيقة): نشاط (1) ص 28: أساعد ناصرًا في رسم الروبوت\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوضح المهمة، ويطلب من كل طالب رسم الروبوت الذي يود ناصر المشاركة به في المسابقة، وكتابة جملة تحت الرسم تبين المهارة التي يحتاجها ناصر لصنعه، ويتابع ويقدم تغذية راجعة فردية.\n- الطالب: يرسم الروبوت بمفرده، ويكتب المهارة المطلوبة (فك القطع وتركيبها)، ويراجع عمله في ضوء ملاحظات المعلم.\n\nالختام (7 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة خروج تضم أسئلة التقويم الختامي الثلاثة، ويجمعها ويصحح المفاهيم الخاطئة باختصار.\n- الطالب: يجيب بمفرده عن أسئلة البطاقة، ويسلمها للمعلم.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): ما النشاط الذي يجيده ناصر كما ورد في النص؟\nالإجابة: فك القطع وتركيبها ليصنع منها أشكالًا جميلة.\n\nس2 (مستوى التطبيق): ناصر يحب الرسم، لكنه لا يجيده كما تجيده أخته شمساء. ماذا يعني ذلك؟\nالإجابة: أن حب النشاط وحده لا يكفي لإجادته؛ فشمساء ملمة بالرسم ومتقنة له، أما ناصر فيستمتع به دون أن يتقنه.\n\nس3 (مستوى الاستدلال): لماذا اختار ناصر صنع روبوت للمشاركة في مسابقة المبتكر الصغير؟\nالإجابة: لأنه نشاط يحبه ويجيده في الوقت نفسه؛ فهو يحب برمجة الروبوتات والمنافسة، ويجيد فك القطع وتركيبها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ بطاقات أنشطة (رسم، تركيب القطع، كرة القدم)، ويصنفها معه إلى ما يحبه ويجيده وما يحبه ولا يجيده، ثم يسأله: ما النشاط الذي يجيده ناصر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول لثلاثة أنشطة يحبونها، وتحديد ما يجيدونه منها مع دليل، وتوضيح الفرق بين حب النشاط وإجادته كما عند ناصر وشمساء.", "س1 (مستوى المعرفة): أكمل: إجادة الأنشطة تعني ........ بأداء النشاط، و........ العمل به.\nالإجابة: الإلمام، إتقان.\n\nس2 (مستوى التطبيق): خالد يرسم في وقت فراغه ويستمتع بالرسم، أما عائشة ففازت في مسابقة الرسم بالمدرسة. مَن يحب الرسم؟ ومَن يجيده؟\nالإجابة: خالد يحب الرسم، وعائشة تجيده؛ لأنها متقنة له وحققت فيه إنجازًا.\n\nس3 (مستوى الاستدلال): اذكر نشاطًا تحبه ولا تجيده بعد، واقترح خطوة واحدة تجعلك تجيده.\nالإجابة: إجابة شخصية، مثل: أحب كرة القدم ولا أجيدها، وسأتدرب عليها بانتظام مع فريق الحي.", "- للطالب: راجع نص «المبتكر الصغير (1)» ص 26–27، وأكمل رسم الروبوت في ص 28 إن لم تنته منه، وفكر في نشاطين تحبهما ونشاط تجيده.\n- لولي الأمر: ناقش ابنك في الأنشطة التي يحبها وتلك التي يجيدها، وساعده على التمييز بينهما بأمثلة من حياته اليومية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=1"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع الثاني", "dates": "13–17 سبتمبر 2026", "sb": "ص 29", "tb": "ص 34–35", "focus": "أكتشف الأنشطة التي أحبها وأجيدها", "fields": ["1. يصنف مجموعة من الأنشطة إلى: أحبه وأجيده، أحبه ولا أجيده، لا أحبه ولا أجيده.\n2. يحدد نشاطًا يحبه ويجيده، ويدعم ذلك بموقف أو إنجاز من حياته.\n\nمخرج تعليمي آخر:\n3. يقيّم ذاته تقييمًا صادقًا فيما يجيده من أنشطة.", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالنمذجة\n2. التعلم التشاركي\n3. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. الأقلام\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات ملونة (أخضر، أصفر، أحمر) وأوراق لاصقة", "1. الميول: الأنشطة التي يحبها الفرد ويرغب في ممارستها ويستمتع بها.\n2. تقييم الذات: حكم الفرد الصادق على ما يتقنه من أنشطة وما يحتاج إلى تنميته.", "التعلم القبلي: تعرّف الطالب في الحصة السابقة معنى إجادة الأنشطة، والفرق بين حب النشاط وإجادته من خلال نص «المبتكر الصغير (1)».\n\nالتهيئة:\n1. يذكّر المعلم الطلاب بما يحبه ناصر وما يجيده.\n2. ينمذج أمامهم تصنيف ثلاثة أنشطة من حياته مفكرًا بصوت عالٍ، مثل: «أحب الطبخ لكني لا أجيده بعد، وأجيد الخط العربي لأني أتقنه وأمارسه منذ سنوات».\n3. يسأل: كيف عرفتُ أنني أجيد الخط ولا أجيد الطبخ؟ ويتوصل معهم إلى أن الدليل هو الإتقان والإنجاز لا الاستمتاع وحده.", "التهيئة (5 دقائق): المعلم ينمذج تصنيف أنشطته\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يصنف ثلاثة أنشطة من حياته أمام الطلاب مفكرًا بصوت عالٍ، موضحًا الدليل الذي اعتمد عليه في كل تصنيف.\n- الطالب: يستمع ويلاحظ خطوات التفكير، ويحدد مع المعلم موقع كل نشاط.\n\nالنشاط 1 (7 دقائق): تطبيق موجّه: تصنيف أول ثلاثة أنشطة في جدول ص 29\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض الجدول على السبورة الذكية، ويقرأ الأنشطة الثلاثة الأولى، ويطلب رفع البطاقة الملونة المناسبة (أخضر: أحبه وأجيده، أصفر: أحبه ولا أجيده، أحمر: لا أحبه ولا أجيده)، ويسأل بعض الطلاب عن تعليل اختيارهم.\n- الطالب: يرفع البطاقة التي تعبر عنه، ويعلل اختياره بدليل من حياته.\n\nالنشاط 2 (10 دقائق): تطبيق مستقل: نشاط (2) ص 29\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يطلب من كل طالب إكمال تصنيف الأنشطة العشرين بمفرده وبصدق، ثم إحاطة نشاط واحد يحبه ويجيده، ويتجول لتقديم الدعم.\n- الطالب: يصنف الأنشطة بمفرده بصدق، ويحيط النشاط الذي يحبه ويجيده.\n\nالنشاط 3 (10 دقائق): جدار إجادتي\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يوزع الأوراق اللاصقة، ويطلب من كل طالب كتابة نشاط يحبه ويجيده ودليل إجادته، ولصقها على لوحة الصف، ثم ينظم جولة قصيرة حول اللوحة، ويختار ثلاثة طلاب للحديث، ويختم بأن تنوع ما يجيده طلاب الصف ثروة للجميع.\n- الطالب: يكتب نشاطه ودليل إجادته ويلصقه، ويتعرف إلى ما يجيده زملاؤه، ويتحدث عن نشاطه إن طُلب منه.\n\nالختام (8 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يفتح ملف مسابقة المجموعات على السبورة الذكية، ويختار درس «أنا أجيد» ومحور الحصة، وعدد الأسئلة: 5، ثم يطرح أسئلة التقويم الختامي الثلاثة جولةً أخيرة تجيب عنها المجموعات بالتناوب.\n- الطالب: يتنافس مع مجموعته، ويجيب في دور مجموعته، ويشارك في جولة أسئلة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): «حل الألغاز» نشاط يحبه أحمد ويحله بسرعة ودقة دائمًا. في أي عمود يضعه؟\nالإجابة: في عمود «أحبه وأجيده».\n\nس2 (مستوى التطبيق): لماذا لا يكفي أن أضع النشاط في عمود «أحبه وأجيده» لأني أستمتع به فقط؟\nالإجابة: لأن الإجادة تحتاج إلى إتقان وإلمام يظهران في الأداء، لا مجرد الاستمتاع بالنشاط.\n\nس3 (مستوى الاستدلال): كيف تتأكد أن تصنيفك لنفسك في نشاط ما صادق؟\nالإجابة: بالاستناد إلى أدلة، مثل: إنجاز حققته فيه، أو رأي معلمي وأسرتي، أو مقارنة أدائي بأداء المتقنين له.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ بطاقات أنشطة (رسم، تركيب القطع، كرة القدم)، ويصنفها معه إلى ما يحبه ويجيده وما يحبه ولا يجيده، ثم يسأله: ما النشاط الذي يجيده ناصر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول لثلاثة أنشطة يحبونها، وتحديد ما يجيدونه منها مع دليل، وتوضيح الفرق بين حب النشاط وإجادته كما عند ناصر وشمساء.", "س1 (مستوى المعرفة): صواب أم خطأ: كل نشاط أحبه فأنا أجيده بالضرورة.\nالإجابة: خطأ؛ فقد أحب نشاطًا ولا أتقنه بعد.\n\nس2 (مستوى التطبيق): اذكر من جدول ص 29 نشاطًا تحبه وتجيده، ونشاطًا تحبه ولا تجيده.\nالإجابة: إجابة شخصية، مثل: أحب الرسم وأجيده، وأحب لعب الشطرنج ولا أجيده.\n\nس3 (مستوى الاستدلال): اقترح كيف ينقل زميلك نشاطًا من عمود «أحبه ولا أجيده» إلى عمود «أحبه وأجيده».\nالإجابة: بالتدرب المستمر، والتعلم من المختصين أو من الكتب، وتكرار المحاولة حتى يتقنه.", "- للطالب: أكمل نشاط ص 29 إن لم تنته منه. وقبل الحصة القادمة استمع مع ولي أمرك إلى نص «المبتكر الصغير (2)» ص 30–31 عبر رمز QR، ودوّن الطرق التي نمّى بها ناصر ما يجيده.\n- لولي الأمر: ساعد ابنك على الاستماع إلى نص ص 30–31 عبر رمز QR، وشجعه على تدوين طرق تنمية ما يجيده ناصر استعدادًا للحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=1"]}], "combined": ["الحصة 1:\n1. يوضح المقصود بإجادة الأنشطة.\n2. يميز بين ما يحبه ناصر من أنشطة وما يجيده في نص «المبتكر الصغير (1)».\n\nمخرج تعليمي آخر:\n3. يقدّر تميّز الآخرين فيما يجيدونه، ويحترم اختلافهم عنه.\n\nالحصة 2:\n1. يصنف مجموعة من الأنشطة إلى: أحبه وأجيده، أحبه ولا أجيده، لا أحبه ولا أجيده.\n2. يحدد نشاطًا يحبه ويجيده، ويدعم ذلك بموقف أو إنجاز من حياته.\n\nمخرج تعليمي آخر:\n3. يقيّم ذاته تقييمًا صادقًا فيما يجيده من أنشطة.", "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الحصة 1:\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي\n\nالحصة 2:\n1. التعلم بالنمذجة\n2. التعلم التشاركي\n3. التعلم المبني على اللعب", "الحصة 1:\n1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. الأقلام\n5. أخرى: بطاقات الشخصيات العمانية (أحمد بن ماجد، شمساء الخليلية)\n\nالحصة 2:\n1. الكتاب\n2. السبورة الذكية\n3. الأقلام\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: بطاقات ملونة (أخضر، أصفر، أحمر) وأوراق لاصقة", "الحصة 1:\n1. إجادة الأنشطة: الإلمام بأداء الأنشطة، وإتقان العمل بها.\n2. الذات الفاعلة: مقدرة الفرد على أداء السلوك الذي يحقق نتائج مرغوبة في البيئة المحيطة به.\n\nالحصة 2:\n1. الميول: الأنشطة التي يحبها الفرد ويرغب في ممارستها ويستمتع بها.\n2. تقييم الذات: حكم الفرد الصادق على ما يتقنه من أنشطة وما يحتاج إلى تنميته.", "الحصة 1:\nالتعلم القبلي: سبق للطالب في الصفوف السابقة التعرف إلى صفاته وتقبلها والمحافظة على ذاته، وهذه الحصة تنقله إلى اكتشاف ما يجيده من أنشطة.\n\nالتهيئة:\n1. يعرض المعلم صفحة مدخل الوحدة (ص 24–25) ويقرأ مع الطلاب عنوانها «ذاتي المُجيدة» وما سيتمكنون منه في نهايتها.\n2. يعرض بطاقتين لشخصيتين عمانيتين: أحمد بن ماجد (يجيد علوم البحار)، وشمساء الخليلية (تجيد علوم الدين).\n3. يسأل: بماذا تتميز هاتان الشخصيتان؟\n4. يتوصل مع الطلاب إلى أن لكل إنسان ما يميزه عن الآخرين وما يجيده من أنشطة وأعمال، وأن إجادة النشاط تعني إتقانه والإلمام به.\n\nالحصة 2:\nالتعلم القبلي: تعرّف الطالب في الحصة السابقة معنى إجادة الأنشطة، والفرق بين حب النشاط وإجادته من خلال نص «المبتكر الصغير (1)».\n\nالتهيئة:\n1. يذكّر المعلم الطلاب بما يحبه ناصر وما يجيده.\n2. ينمذج أمامهم تصنيف ثلاثة أنشطة من حياته مفكرًا بصوت عالٍ، مثل: «أحب الطبخ لكني لا أجيده بعد، وأجيد الخط العربي لأني أتقنه وأمارسه منذ سنوات».\n3. يسأل: كيف عرفتُ أنني أجيد الخط ولا أجيد الطبخ؟ ويتوصل معهم إلى أن الدليل هو الإتقان والإنجاز لا الاستمتاع وحده.", "الحصة 1:\nالتهيئة (6 دقائق): بطاقات الشخصيات العمانية\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض بطاقتي أحمد بن ماجد وشمساء الخليلية، ويسأل عما تتميز به كل شخصية، ويترك الطلاب يستنتجون معنى الإجادة قبل أن يصوغه لهم.\n- الطالب: يتأمل البطاقتين، ويستنتج ما تجيده كل شخصية، ويصوغ بكلماته معنى إجادة النشاط.\n\nالنشاط 1 (15 دقيقة): قراءة نص «المبتكر الصغير (1)» ص 26–27 وتحليله\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR في الكتاب، ثم يقسمهم إلى مجموعات رباعية بأدوار (قارئ، كاتب، متحدث، مراقب وقت)، ويكلف كل مجموعة بجدول من عمودين: «ما يحبه ناصر» و«ما يجيده ناصر»، والإجابة عن سؤال: ما الفرق بين ما يحب ناصر فعله وما يجيده؟ ثم يدير عرض المجموعات ويتوصل معهم إلى أن الإجادة تتطلب الإلمام والإتقان، وأنها تحقق الذات الفاعلة.\n- الطالب: يستمع إلى النص ويقرؤه، ويؤدي دوره في المجموعة، ويشارك في تعبئة الجدول (يحب: الرسم، وكتابة القصص، والمشاركة في المسابقة وبرمجة الروبوتات؛ يجيد: فك القطع وتركيبها)، ويعرض المتحدث منتج المجموعة.\n\nالنشاط 2 (12 دقيقة): نشاط (1) ص 28: أساعد ناصرًا في رسم الروبوت\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوضح المهمة، ويطلب من كل طالب رسم الروبوت الذي يود ناصر المشاركة به في المسابقة، وكتابة جملة تحت الرسم تبين المهارة التي يحتاجها ناصر لصنعه، ويتابع ويقدم تغذية راجعة فردية.\n- الطالب: يرسم الروبوت بمفرده، ويكتب المهارة المطلوبة (فك القطع وتركيبها)، ويراجع عمله في ضوء ملاحظات المعلم.\n\nالختام (7 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة خروج تضم أسئلة التقويم الختامي الثلاثة، ويجمعها ويصحح المفاهيم الخاطئة باختصار.\n- الطالب: يجيب بمفرده عن أسئلة البطاقة، ويسلمها للمعلم.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (5 دقائق): المعلم ينمذج تصنيف أنشطته\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يصنف ثلاثة أنشطة من حياته أمام الطلاب مفكرًا بصوت عالٍ، موضحًا الدليل الذي اعتمد عليه في كل تصنيف.\n- الطالب: يستمع ويلاحظ خطوات التفكير، ويحدد مع المعلم موقع كل نشاط.\n\nالنشاط 1 (7 دقائق): تطبيق موجّه: تصنيف أول ثلاثة أنشطة في جدول ص 29\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض الجدول على السبورة الذكية، ويقرأ الأنشطة الثلاثة الأولى، ويطلب رفع البطاقة الملونة المناسبة (أخضر: أحبه وأجيده، أصفر: أحبه ولا أجيده، أحمر: لا أحبه ولا أجيده)، ويسأل بعض الطلاب عن تعليل اختيارهم.\n- الطالب: يرفع البطاقة التي تعبر عنه، ويعلل اختياره بدليل من حياته.\n\nالنشاط 2 (10 دقائق): تطبيق مستقل: نشاط (2) ص 29\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يطلب من كل طالب إكمال تصنيف الأنشطة العشرين بمفرده وبصدق، ثم إحاطة نشاط واحد يحبه ويجيده، ويتجول لتقديم الدعم.\n- الطالب: يصنف الأنشطة بمفرده بصدق، ويحيط النشاط الذي يحبه ويجيده.\n\nالنشاط 3 (10 دقائق): جدار إجادتي\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يوزع الأوراق اللاصقة، ويطلب من كل طالب كتابة نشاط يحبه ويجيده ودليل إجادته، ولصقها على لوحة الصف، ثم ينظم جولة قصيرة حول اللوحة، ويختار ثلاثة طلاب للحديث، ويختم بأن تنوع ما يجيده طلاب الصف ثروة للجميع.\n- الطالب: يكتب نشاطه ودليل إجادته ويلصقه، ويتعرف إلى ما يجيده زملاؤه، ويتحدث عن نشاطه إن طُلب منه.\n\nالختام (8 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يفتح ملف مسابقة المجموعات على السبورة الذكية، ويختار درس «أنا أجيد» ومحور الحصة، وعدد الأسئلة: 5، ثم يطرح أسئلة التقويم الختامي الثلاثة جولةً أخيرة تجيب عنها المجموعات بالتناوب.\n- الطالب: يتنافس مع مجموعته، ويجيب في دور مجموعته، ويشارك في جولة أسئلة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): ما النشاط الذي يجيده ناصر كما ورد في النص؟\nالإجابة: فك القطع وتركيبها ليصنع منها أشكالًا جميلة.\n\nس2 (مستوى التطبيق): ناصر يحب الرسم، لكنه لا يجيده كما تجيده أخته شمساء. ماذا يعني ذلك؟\nالإجابة: أن حب النشاط وحده لا يكفي لإجادته؛ فشمساء ملمة بالرسم ومتقنة له، أما ناصر فيستمتع به دون أن يتقنه.\n\nس3 (مستوى الاستدلال): لماذا اختار ناصر صنع روبوت للمشاركة في مسابقة المبتكر الصغير؟\nالإجابة: لأنه نشاط يحبه ويجيده في الوقت نفسه؛ فهو يحب برمجة الروبوتات والمنافسة، ويجيد فك القطع وتركيبها.\n\nالحصة 2:\nس1 (مستوى المعرفة): «حل الألغاز» نشاط يحبه أحمد ويحله بسرعة ودقة دائمًا. في أي عمود يضعه؟\nالإجابة: في عمود «أحبه وأجيده».\n\nس2 (مستوى التطبيق): لماذا لا يكفي أن أضع النشاط في عمود «أحبه وأجيده» لأني أستمتع به فقط؟\nالإجابة: لأن الإجادة تحتاج إلى إتقان وإلمام يظهران في الأداء، لا مجرد الاستمتاع بالنشاط.\n\nس3 (مستوى الاستدلال): كيف تتأكد أن تصنيفك لنفسك في نشاط ما صادق؟\nالإجابة: بالاستناد إلى أدلة، مثل: إنجاز حققته فيه، أو رأي معلمي وأسرتي، أو مقارنة أدائي بأداء المتقنين له.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ بطاقات أنشطة (رسم، تركيب القطع، كرة القدم)، ويصنفها معه إلى ما يحبه ويجيده وما يحبه ولا يجيده، ثم يسأله: ما النشاط الذي يجيده ناصر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول لثلاثة أنشطة يحبونها، وتحديد ما يجيدونه منها مع دليل، وتوضيح الفرق بين حب النشاط وإجادته كما عند ناصر وشمساء.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: إجادة الأنشطة تعني ........ بأداء النشاط، و........ العمل به.\nالإجابة: الإلمام، إتقان.\n\nس2 (مستوى التطبيق): خالد يرسم في وقت فراغه ويستمتع بالرسم، أما عائشة ففازت في مسابقة الرسم بالمدرسة. مَن يحب الرسم؟ ومَن يجيده؟\nالإجابة: خالد يحب الرسم، وعائشة تجيده؛ لأنها متقنة له وحققت فيه إنجازًا.\n\nس3 (مستوى الاستدلال): اذكر نشاطًا تحبه ولا تجيده بعد، واقترح خطوة واحدة تجعلك تجيده.\nالإجابة: إجابة شخصية، مثل: أحب كرة القدم ولا أجيدها، وسأتدرب عليها بانتظام مع فريق الحي.\n\nالحصة 2:\nس1 (مستوى المعرفة): صواب أم خطأ: كل نشاط أحبه فأنا أجيده بالضرورة.\nالإجابة: خطأ؛ فقد أحب نشاطًا ولا أتقنه بعد.\n\nس2 (مستوى التطبيق): اذكر من جدول ص 29 نشاطًا تحبه وتجيده، ونشاطًا تحبه ولا تجيده.\nالإجابة: إجابة شخصية، مثل: أحب الرسم وأجيده، وأحب لعب الشطرنج ولا أجيده.\n\nس3 (مستوى الاستدلال): اقترح كيف ينقل زميلك نشاطًا من عمود «أحبه ولا أجيده» إلى عمود «أحبه وأجيده».\nالإجابة: بالتدرب المستمر، والتعلم من المختصين أو من الكتب، وتكرار المحاولة حتى يتقنه.", "الحصة 1:\n- للطالب: راجع نص «المبتكر الصغير (1)» ص 26–27، وأكمل رسم الروبوت في ص 28 إن لم تنته منه، وفكر في نشاطين تحبهما ونشاط تجيده.\n- لولي الأمر: ناقش ابنك في الأنشطة التي يحبها وتلك التي يجيدها، وساعده على التمييز بينهما بأمثلة من حياته اليومية.\n\nالحصة 2:\n- للطالب: أكمل نشاط ص 29 إن لم تنته منه. وقبل الحصة القادمة استمع مع ولي أمرك إلى نص «المبتكر الصغير (2)» ص 30–31 عبر رمز QR، ودوّن الطرق التي نمّى بها ناصر ما يجيده.\n- لولي الأمر: ساعد ابنك على الاستماع إلى نص ص 30–31 عبر رمز QR، وشجعه على تدوين طرق تنمية ما يجيده ناصر استعدادًا للحصة القادمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=1"]}, {"no": 2, "label": "الدرس الثاني: أنمّي ما أجيد", "unit": 1, "unitName": "الوحدة الأولى: ذاتي المُجيدة", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع الثالث", "dates": "20–24 سبتمبر 2026", "sb": "ص 30–32", "tb": "ص 36–38", "focus": "طرق تنمية ما أجيده", "fields": ["1. يستنتج طرق تنمية ما يجيده الفرد من نص «المبتكر الصغير (2)».\n2. يوضح دور الكتب والإنترنت وشمساء والأب ومعاذ في تنمية ما يجيده ناصر.\n\nمخرج تعليمي آخر:\n3. يقدّر دور الأسرة والأصدقاء في دعم ما يجيده الفرد.", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. الفصل المقلوب\n3. التعلم التعاوني", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. أخرى: أدوات تجربة نفخ البالونة (بالونة، خل، بيكربونات الصوديوم، قنينة ماء فارغة، ملعقة)", "1. تنمية ما أجيده: تطوير النشاط الذي يتقنه الفرد وصقله حتى يصل إلى مستوى أعلى من الإتقان.\n2. مصادر التنمية: الوسائل والأشخاص الذين يساعدون الفرد على تطوير ما يجيده، مثل: الكتب، والإنترنت، والدورات التدريبية، والأسرة، والأصدقاء.", "التعلم القبلي: صنّف الطالب في الدرس السابق الأنشطة التي يحبها ويجيدها، واستمع في البيت إلى نص «المبتكر الصغير (2)».\n\nالتهيئة:\n1. يعرض المعلم أدوات التجربة: بالونة، خل، بيكربونات الصوديوم، قنينة ماء فارغة.\n2. يطرح السؤال: ماذا سيحصل لو وضعنا فوهة البالونة على فوهة القنينة بعد وضع الخل فيها؟ وتكتب كل مجموعة توقعها.\n3. ينفذ التجربة أمام الطلاب أو بمشاركة مندوبي المجموعات تحت إشرافه: يملأ ثلث القنينة بالخل، ويضع ملعقة كبيرة من البيكربونات داخل البالونة، ثم يثبتها على الفوهة ويرفعها لتسقط البيكربونات.\n4. يقارن الطلاب النتيجة بتوقعاتهم، ويتوصل معهم إلى أن البالونة تحولت من حالة خاملة إلى ممتلئة بتفاعل عدة عوامل، وكذلك ما نجيده يبقى خاملًا إن لم توجد عوامل تنميه.", "التهيئة (10 دقائق): تجربة نفخ البالونة\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض الأدوات ويطرح السؤال الاستقصائي، ويستمع لتوقعات المجموعات، وينفذ التجربة تحت إشرافه مراعيًا السلامة، ويقود الطلاب إلى استنتاج وجه الشبه بين البالونة وما نجيده.\n- الطالب: يكتب توقعه مع مجموعته، ويلاحظ التجربة، ويقارن النتيجة بالتوقع، ويستنتج أن ما نجيده يحتاج إلى عوامل تنميه.\n\nالنشاط 1 (8 دقائق): مناقشة نص «المبتكر الصغير (2)» الذي استمع إليه الطلاب في البيت\n- الاستراتيجية: الفصل المقلوب\n- المعلم: يطرح ثلاثة أسئلة سريعة للتحقق من الاستماع، ويعيد تشغيل النص عبر رمز QR لمن لم يتمكن من سماعه، ثم يدير مناقشة: كيف نمّى ناصر ما يجيده؟ ويدوّن الطرق على السبورة: قراءة الكتب، والبحث في الإنترنت، والدورات التدريبية، وتشجيع الأسرة ودعمها، ومساعدة الأصدقاء، وتكرار المحاولات.\n- الطالب: يجيب عن أسئلة التحقق، ويعرض ما دوّنه في البيت من طرق التنمية، ويضيف إلى ما يذكره زملاؤه.\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 32: محطات ناصر\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يكلف كل طالب في المجموعة الرباعية بمحطة (الكتب والإنترنت، شمساء، الأب، معاذ) ليكتب كيف استفاد منها ناصر، ثم يجمع أفراد المجموعة إجاباتهم في الكتاب، ويعرض متحدث كل مجموعة محطة واحدة، ويقدم المعلم التغذية الراجعة.\n- الطالب: يكتب إجابة محطته، ويشرحها لزملائه في المجموعة، ويستكمل بقية المحطات منهم، ويشارك في العرض.\n\nالختام (8 دقائق): الرؤوس المرقمة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يعطي كل عضو في المجموعة رقمًا، ويطرح أسئلة التقويم الختامي سؤالًا سؤالًا، وتتشاور المجموعة ثم يستدعي رقمًا عشوائيًا ليجيب عن مجموعته.\n- الطالب: يتشاور مع مجموعته في الإجابة، ويجيب إذا استُدعي رقمه.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): من أين حصل ناصر على المعلومات لتنمية ما يجيده؟\nالإجابة: من الكتب الموجودة في مكتبة أبيه، ومن شبكة الإنترنت، ومن البرامج التدريبية الإلكترونية.\n\nس2 (مستوى التطبيق): ماذا تعلم ناصر من أخته شمساء؟ وكيف ساعده أبوه؟\nالإجابة: علمته شمساء كيف يضفي لمسات جميلة على رسم الروبوت، وساعده أبوه بتوفير القطع والأدوات المناسبة لصنعه.\n\nس3 (مستوى الاستدلال): ما وجه الشبه بين البالونة في التجربة وما يجيده الإنسان؟\nالإجابة: البالونة بقيت خاملة حتى تفاعلت المواد فانتفخت، وكذلك ما نجيده يبقى خاملًا إن لم نجد عوامل تنميه، مثل: التعلم، والتدريب، والدعم.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم مع التلميذ مخططًا بسيطًا لمصادر تنمية ما يجيده ناصر (الكتب، الإنترنت، الأسرة، الأصدقاء)، ويطابقها معه بأمثلة من النص، ثم يسأله: كيف ساعد الأب ناصرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مهارة يجيدونها ووضع خطة قصيرة لتنميتها تحدد مصدرين للتعلم وشخصًا يساعدهم، وتوضيح وجه الشبه بين البالونة وما يجيده الإنسان.", "س1 (مستوى المعرفة): اذكر طريقتين من طرق تنمية ما نجيده.\nالإجابة: قراءة الكتب، والبحث في الإنترنت (ويقبل: الدورات التدريبية، تشجيع الأسرة، مساعدة الأصدقاء، تكرار المحاولات).\n\nس2 (مستوى التطبيق): وضح دور كل من الأب وشمساء ومعاذ في تنمية ما يجيده ناصر.\nالإجابة: الأب: وفّر القطع والأدوات. شمساء: علمته إضافة لمسات جميلة على رسم الروبوت. معاذ: شاركه بأفكاره الإبداعية في برمجة الروبوت.\n\nس3 (مستوى الاستدلال): صديقك يجيد كتابة القصص؛ اقترح عليه ثلاث طرق لتنمية هذه الإجادة مستفيدًا مما فعله ناصر.\nالإجابة: قراءة قصص وكتب في فن القصة، والالتحاق بورشة أو دورة في الكتابة، وعرض قصصه على معلمه وأسرته للاستفادة من ملاحظاتهم مع الكتابة باستمرار.", "- للطالب: راجع نص «المبتكر الصغير (2)» ص 30–31، وأكمل نشاط ص 32 إن لم تنته منه.\n- لولي الأمر: احكِ لابنك موقفًا كررت فيه المحاولة حتى نجحت؛ تمهيدًا لحديث الحصة القادمة عن المثابرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=2"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع الرابع", "dates": "27 سبتمبر – 1 أكتوبر 2026", "sb": "ص 31، 33", "tb": "ص 37–40", "focus": "المثابرة وخطة تنمية ما أجيده", "fields": ["1. يستنتج أهمية المثابرة وتكرار المحاولة في تنمية ما يجيده الفرد من قصص مخترعين عمانيين.\n2. يضع خطة لتنمية نشاط يجيده تحدد: كيف ينميه، وما يحتاج إليه، ومن يساعده.\n\nمخرج تعليمي آخر:\n3. يقدّر قيمة المثابرة وعدم الاستسلام أمام الصعوبات.", "المخرج 1: تحليل\nالمخرج 2: إبداع\nالمخرج 3: تقييم", "1. التعلم التعاوني\n2. التعلم الذاتي\n3. التعلم المبني على اللعب", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: أجهزة لوحية بقارئ رمز الاستجابة السريعة (QR) بعدد المجموعات، وبطاقة المثابرة من ملحق دليل المعلم ص 40", "1. المثابرة: الاستمرار في العمل وتكرار المحاولة رغم الصعوبات حتى بلوغ الهدف.\n2. خطة تنمية ما أجيده: خطوات منظمة يحدد فيها الفرد النشاط الذي يجيده، وكيف ينميه، وما يحتاج إليه، ومن يساعده.", "التعلم القبلي: تعرّف الطالب في الحصة السابقة طرق تنمية ما يجيده الفرد من خلال تجربة ناصر في صنع الروبوت.\n\nالتهيئة:\n1. يعرض المعلم من نص ص 31 قول والد ناصر: «الأبطال لا يُهزمون بل يحاولون مجددًا».\n2. يطلب من كل طالب التفكير بمفرده في معنى القول، ثم مناقشته مع زميله، ثم مشاركة الصف.\n3. يتوصل معهم إلى أن المثابرة وتكرار المحاولة طريق لتنمية ما نجيده.", "التهيئة (5 دقائق): فكّر، زاوج، شارك\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يعرض قول والد ناصر، ويمنح دقيقة للتفكير الفردي ثم دقيقتين للنقاش الثنائي، ويستمع لمشاركات الأزواج.\n- الطالب: يفكر في معنى القول، ويناقشه مع زميله، ويشارك الصف بما توصلا إليه.\n\nالنشاط 1 (15 دقيقة): بطاقات المثابرة: قصص مخترعين عمانيين\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يقسم الطلاب إلى خمس مجموعات بأدوار (قارئ الرمز، مسجل، متحدث، مراقب وقت)، ويوزع الأجهزة اللوحية وبطاقة المثابرة، ويطلب مشاهدة المقطع المرئي عبر رمز QR والإجابة عن أسئلة البطاقة الستة، ثم يدير عرض المتحدثين ويقدم التغذية الراجعة.\n- الطالب: يشاهد المقطع مع مجموعته، ويشارك في الإجابة عن أسئلة البطاقة (اسم المخترع، الابتكار وأهميته، الصعوبات، كيف واصل محاولاته، الإنجاز، هل يتخيل نفسه مكانه)، ويعرض المتحدث ما توصلت إليه المجموعة.\n\nالنشاط 2 (12 دقيقة): نشاط (2) ص 33: خطتي لتنمية ما أجيد\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوضح أجزاء الشكل الدائري (ما النشاط الذي أجيده؟ كيف أنميه؟ ماذا أحتاج لأنميه؟ من يساعدني؟)، ويطلب من كل طالب إعداد خطته بمفرده، ويتابع ويقدم تغذية راجعة فردية.\n- الطالب: يختار نشاطًا يجيده، ويكتب خطته بمفرده في أجزاء الشكل الأربعة، ويراجعها في ضوء ملاحظات المعلم.\n\nالختام (8 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يشغّل مسابقة المجموعات على السبورة الذكية (درس «أنمّي ما أجيد»، محور الحصة، 5 أسئلة)، ثم يطرح أسئلة التقويم الختامي الثلاثة جولة أخيرة.\n- الطالب: يتنافس مع مجموعته، ويجيب في دورها، ويشارك في جولة أسئلة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): ماذا فعل ناصر عندما لم يعمل الروبوت؟\nالإجابة: حزن في البداية، لكن أمه احتضنته وشجعه أبوه، فكرر المحاولة أيامًا أخرى.\n\nس2 (مستوى التطبيق): من بطاقة المثابرة: ماذا فعل المخترع الذي شاهدتموه ليواصل محاولاته رغم الصعوبات؟\nالإجابة: إجابة بحسب المقطع، مثل: تعلم من أخطائه، وطلب المساعدة، وجرب طرقًا جديدة حتى نجح.\n\nس3 (مستوى الاستدلال): ما العلاقة بين المثابرة وتحقيق الإنجاز في قصة المخترع وقصة ناصر؟\nالإجابة: المثابرة وتكرار المحاولة رغم الفشل هي التي أوصلت كليهما إلى الإنجاز، ولولاها لتوقفا عند أول صعوبة.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم مع التلميذ مخططًا بسيطًا لمصادر تنمية ما يجيده ناصر (الكتب، الإنترنت، الأسرة، الأصدقاء)، ويطابقها معه بأمثلة من النص، ثم يسأله: كيف ساعد الأب ناصرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مهارة يجيدونها ووضع خطة قصيرة لتنميتها تحدد مصدرين للتعلم وشخصًا يساعدهم، وتوضيح وجه الشبه بين البالونة وما يجيده الإنسان.", "س1 (مستوى المعرفة): أكمل قول والد ناصر: الأبطال لا ........ بل يحاولون مجددًا.\nالإجابة: يُهزمون.\n\nس2 (مستوى التطبيق): اذكر العناصر الأربعة لخطة تنمية ما أجيده في نشاط ص 33.\nالإجابة: النشاط الذي أجيده، وكيف أنميه، وماذا أحتاج لأنميه، ومن يساعدني.\n\nس3 (مستوى الاستدلال): قيّم خطة زميلك: «أجيد السباحة، وسأنميها بالتدرب مرة واحدة في السنة دون مدرب». ما ملاحظتك؟\nالإجابة: الخطة ضعيفة؛ فالتدرب مرة واحدة في السنة لا يكفي، والأفضل التدرب بانتظام مع مدرب أو في نادٍ وبمتابعة الأسرة.", "- للطالب: اعرض خطتك لتنمية ما تجيده (ص 33) على أسرتك، وابدأ تنفيذ أول خطوة منها هذا الأسبوع.\n- لولي الأمر: ناقش مع ابنك خطته في ص 33، ووفر له ما يحتاج إليه لتنفيذها، وشجعه على المثابرة عند الصعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=2"]}], "combined": ["الحصة 1:\n1. يستنتج طرق تنمية ما يجيده الفرد من نص «المبتكر الصغير (2)».\n2. يوضح دور الكتب والإنترنت وشمساء والأب ومعاذ في تنمية ما يجيده ناصر.\n\nمخرج تعليمي آخر:\n3. يقدّر دور الأسرة والأصدقاء في دعم ما يجيده الفرد.\n\nالحصة 2:\n1. يستنتج أهمية المثابرة وتكرار المحاولة في تنمية ما يجيده الفرد من قصص مخترعين عمانيين.\n2. يضع خطة لتنمية نشاط يجيده تحدد: كيف ينميه، وما يحتاج إليه، ومن يساعده.\n\nمخرج تعليمي آخر:\n3. يقدّر قيمة المثابرة وعدم الاستسلام أمام الصعوبات.", "الحصة 1:\nالمخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تحليل\nالمخرج 2: إبداع\nالمخرج 3: تقييم", "الحصة 1:\n1. التعلم بالاكتشاف\n2. الفصل المقلوب\n3. التعلم التعاوني\n\nالحصة 2:\n1. التعلم التعاوني\n2. التعلم الذاتي\n3. التعلم المبني على اللعب", "الحصة 1:\n1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. أخرى: أدوات تجربة نفخ البالونة (بالونة، خل، بيكربونات الصوديوم، قنينة ماء فارغة، ملعقة)\n\nالحصة 2:\n1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: أجهزة لوحية بقارئ رمز الاستجابة السريعة (QR) بعدد المجموعات، وبطاقة المثابرة من ملحق دليل المعلم ص 40", "الحصة 1:\n1. تنمية ما أجيده: تطوير النشاط الذي يتقنه الفرد وصقله حتى يصل إلى مستوى أعلى من الإتقان.\n2. مصادر التنمية: الوسائل والأشخاص الذين يساعدون الفرد على تطوير ما يجيده، مثل: الكتب، والإنترنت، والدورات التدريبية، والأسرة، والأصدقاء.\n\nالحصة 2:\n1. المثابرة: الاستمرار في العمل وتكرار المحاولة رغم الصعوبات حتى بلوغ الهدف.\n2. خطة تنمية ما أجيده: خطوات منظمة يحدد فيها الفرد النشاط الذي يجيده، وكيف ينميه، وما يحتاج إليه، ومن يساعده.", "الحصة 1:\nالتعلم القبلي: صنّف الطالب في الدرس السابق الأنشطة التي يحبها ويجيدها، واستمع في البيت إلى نص «المبتكر الصغير (2)».\n\nالتهيئة:\n1. يعرض المعلم أدوات التجربة: بالونة، خل، بيكربونات الصوديوم، قنينة ماء فارغة.\n2. يطرح السؤال: ماذا سيحصل لو وضعنا فوهة البالونة على فوهة القنينة بعد وضع الخل فيها؟ وتكتب كل مجموعة توقعها.\n3. ينفذ التجربة أمام الطلاب أو بمشاركة مندوبي المجموعات تحت إشرافه: يملأ ثلث القنينة بالخل، ويضع ملعقة كبيرة من البيكربونات داخل البالونة، ثم يثبتها على الفوهة ويرفعها لتسقط البيكربونات.\n4. يقارن الطلاب النتيجة بتوقعاتهم، ويتوصل معهم إلى أن البالونة تحولت من حالة خاملة إلى ممتلئة بتفاعل عدة عوامل، وكذلك ما نجيده يبقى خاملًا إن لم توجد عوامل تنميه.\n\nالحصة 2:\nالتعلم القبلي: تعرّف الطالب في الحصة السابقة طرق تنمية ما يجيده الفرد من خلال تجربة ناصر في صنع الروبوت.\n\nالتهيئة:\n1. يعرض المعلم من نص ص 31 قول والد ناصر: «الأبطال لا يُهزمون بل يحاولون مجددًا».\n2. يطلب من كل طالب التفكير بمفرده في معنى القول، ثم مناقشته مع زميله، ثم مشاركة الصف.\n3. يتوصل معهم إلى أن المثابرة وتكرار المحاولة طريق لتنمية ما نجيده.", "الحصة 1:\nالتهيئة (10 دقائق): تجربة نفخ البالونة\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض الأدوات ويطرح السؤال الاستقصائي، ويستمع لتوقعات المجموعات، وينفذ التجربة تحت إشرافه مراعيًا السلامة، ويقود الطلاب إلى استنتاج وجه الشبه بين البالونة وما نجيده.\n- الطالب: يكتب توقعه مع مجموعته، ويلاحظ التجربة، ويقارن النتيجة بالتوقع، ويستنتج أن ما نجيده يحتاج إلى عوامل تنميه.\n\nالنشاط 1 (8 دقائق): مناقشة نص «المبتكر الصغير (2)» الذي استمع إليه الطلاب في البيت\n- الاستراتيجية: الفصل المقلوب\n- المعلم: يطرح ثلاثة أسئلة سريعة للتحقق من الاستماع، ويعيد تشغيل النص عبر رمز QR لمن لم يتمكن من سماعه، ثم يدير مناقشة: كيف نمّى ناصر ما يجيده؟ ويدوّن الطرق على السبورة: قراءة الكتب، والبحث في الإنترنت، والدورات التدريبية، وتشجيع الأسرة ودعمها، ومساعدة الأصدقاء، وتكرار المحاولات.\n- الطالب: يجيب عن أسئلة التحقق، ويعرض ما دوّنه في البيت من طرق التنمية، ويضيف إلى ما يذكره زملاؤه.\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 32: محطات ناصر\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يكلف كل طالب في المجموعة الرباعية بمحطة (الكتب والإنترنت، شمساء، الأب، معاذ) ليكتب كيف استفاد منها ناصر، ثم يجمع أفراد المجموعة إجاباتهم في الكتاب، ويعرض متحدث كل مجموعة محطة واحدة، ويقدم المعلم التغذية الراجعة.\n- الطالب: يكتب إجابة محطته، ويشرحها لزملائه في المجموعة، ويستكمل بقية المحطات منهم، ويشارك في العرض.\n\nالختام (8 دقائق): الرؤوس المرقمة\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يعطي كل عضو في المجموعة رقمًا، ويطرح أسئلة التقويم الختامي سؤالًا سؤالًا، وتتشاور المجموعة ثم يستدعي رقمًا عشوائيًا ليجيب عن مجموعته.\n- الطالب: يتشاور مع مجموعته في الإجابة، ويجيب إذا استُدعي رقمه.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (5 دقائق): فكّر، زاوج، شارك\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يعرض قول والد ناصر، ويمنح دقيقة للتفكير الفردي ثم دقيقتين للنقاش الثنائي، ويستمع لمشاركات الأزواج.\n- الطالب: يفكر في معنى القول، ويناقشه مع زميله، ويشارك الصف بما توصلا إليه.\n\nالنشاط 1 (15 دقيقة): بطاقات المثابرة: قصص مخترعين عمانيين\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يقسم الطلاب إلى خمس مجموعات بأدوار (قارئ الرمز، مسجل، متحدث، مراقب وقت)، ويوزع الأجهزة اللوحية وبطاقة المثابرة، ويطلب مشاهدة المقطع المرئي عبر رمز QR والإجابة عن أسئلة البطاقة الستة، ثم يدير عرض المتحدثين ويقدم التغذية الراجعة.\n- الطالب: يشاهد المقطع مع مجموعته، ويشارك في الإجابة عن أسئلة البطاقة (اسم المخترع، الابتكار وأهميته، الصعوبات، كيف واصل محاولاته، الإنجاز، هل يتخيل نفسه مكانه)، ويعرض المتحدث ما توصلت إليه المجموعة.\n\nالنشاط 2 (12 دقيقة): نشاط (2) ص 33: خطتي لتنمية ما أجيد\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوضح أجزاء الشكل الدائري (ما النشاط الذي أجيده؟ كيف أنميه؟ ماذا أحتاج لأنميه؟ من يساعدني؟)، ويطلب من كل طالب إعداد خطته بمفرده، ويتابع ويقدم تغذية راجعة فردية.\n- الطالب: يختار نشاطًا يجيده، ويكتب خطته بمفرده في أجزاء الشكل الأربعة، ويراجعها في ضوء ملاحظات المعلم.\n\nالختام (8 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يشغّل مسابقة المجموعات على السبورة الذكية (درس «أنمّي ما أجيد»، محور الحصة، 5 أسئلة)، ثم يطرح أسئلة التقويم الختامي الثلاثة جولة أخيرة.\n- الطالب: يتنافس مع مجموعته، ويجيب في دورها، ويشارك في جولة أسئلة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): من أين حصل ناصر على المعلومات لتنمية ما يجيده؟\nالإجابة: من الكتب الموجودة في مكتبة أبيه، ومن شبكة الإنترنت، ومن البرامج التدريبية الإلكترونية.\n\nس2 (مستوى التطبيق): ماذا تعلم ناصر من أخته شمساء؟ وكيف ساعده أبوه؟\nالإجابة: علمته شمساء كيف يضفي لمسات جميلة على رسم الروبوت، وساعده أبوه بتوفير القطع والأدوات المناسبة لصنعه.\n\nس3 (مستوى الاستدلال): ما وجه الشبه بين البالونة في التجربة وما يجيده الإنسان؟\nالإجابة: البالونة بقيت خاملة حتى تفاعلت المواد فانتفخت، وكذلك ما نجيده يبقى خاملًا إن لم نجد عوامل تنميه، مثل: التعلم، والتدريب، والدعم.\n\nالحصة 2:\nس1 (مستوى المعرفة): ماذا فعل ناصر عندما لم يعمل الروبوت؟\nالإجابة: حزن في البداية، لكن أمه احتضنته وشجعه أبوه، فكرر المحاولة أيامًا أخرى.\n\nس2 (مستوى التطبيق): من بطاقة المثابرة: ماذا فعل المخترع الذي شاهدتموه ليواصل محاولاته رغم الصعوبات؟\nالإجابة: إجابة بحسب المقطع، مثل: تعلم من أخطائه، وطلب المساعدة، وجرب طرقًا جديدة حتى نجح.\n\nس3 (مستوى الاستدلال): ما العلاقة بين المثابرة وتحقيق الإنجاز في قصة المخترع وقصة ناصر؟\nالإجابة: المثابرة وتكرار المحاولة رغم الفشل هي التي أوصلت كليهما إلى الإنجاز، ولولاها لتوقفا عند أول صعوبة.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم مع التلميذ مخططًا بسيطًا لمصادر تنمية ما يجيده ناصر (الكتب، الإنترنت، الأسرة، الأصدقاء)، ويطابقها معه بأمثلة من النص، ثم يسأله: كيف ساعد الأب ناصرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باختيار مهارة يجيدونها ووضع خطة قصيرة لتنميتها تحدد مصدرين للتعلم وشخصًا يساعدهم، وتوضيح وجه الشبه بين البالونة وما يجيده الإنسان.", "الحصة 1:\nس1 (مستوى المعرفة): اذكر طريقتين من طرق تنمية ما نجيده.\nالإجابة: قراءة الكتب، والبحث في الإنترنت (ويقبل: الدورات التدريبية، تشجيع الأسرة، مساعدة الأصدقاء، تكرار المحاولات).\n\nس2 (مستوى التطبيق): وضح دور كل من الأب وشمساء ومعاذ في تنمية ما يجيده ناصر.\nالإجابة: الأب: وفّر القطع والأدوات. شمساء: علمته إضافة لمسات جميلة على رسم الروبوت. معاذ: شاركه بأفكاره الإبداعية في برمجة الروبوت.\n\nس3 (مستوى الاستدلال): صديقك يجيد كتابة القصص؛ اقترح عليه ثلاث طرق لتنمية هذه الإجادة مستفيدًا مما فعله ناصر.\nالإجابة: قراءة قصص وكتب في فن القصة، والالتحاق بورشة أو دورة في الكتابة، وعرض قصصه على معلمه وأسرته للاستفادة من ملاحظاتهم مع الكتابة باستمرار.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل قول والد ناصر: الأبطال لا ........ بل يحاولون مجددًا.\nالإجابة: يُهزمون.\n\nس2 (مستوى التطبيق): اذكر العناصر الأربعة لخطة تنمية ما أجيده في نشاط ص 33.\nالإجابة: النشاط الذي أجيده، وكيف أنميه، وماذا أحتاج لأنميه، ومن يساعدني.\n\nس3 (مستوى الاستدلال): قيّم خطة زميلك: «أجيد السباحة، وسأنميها بالتدرب مرة واحدة في السنة دون مدرب». ما ملاحظتك؟\nالإجابة: الخطة ضعيفة؛ فالتدرب مرة واحدة في السنة لا يكفي، والأفضل التدرب بانتظام مع مدرب أو في نادٍ وبمتابعة الأسرة.", "الحصة 1:\n- للطالب: راجع نص «المبتكر الصغير (2)» ص 30–31، وأكمل نشاط ص 32 إن لم تنته منه.\n- لولي الأمر: احكِ لابنك موقفًا كررت فيه المحاولة حتى نجحت؛ تمهيدًا لحديث الحصة القادمة عن المثابرة.\n\nالحصة 2:\n- للطالب: اعرض خطتك لتنمية ما تجيده (ص 33) على أسرتك، وابدأ تنفيذ أول خطوة منها هذا الأسبوع.\n- لولي الأمر: ناقش مع ابنك خطته في ص 33، ووفر له ما يحتاج إليه لتنفيذها، وشجعه على المثابرة عند الصعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=2"]}, {"no": 3, "label": "الدرس الثالث: أستفيد مما أجيد", "unit": 1, "unitName": "الوحدة الأولى: ذاتي المُجيدة", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع الخامس", "dates": "4–8 أكتوبر 2026", "sb": "ص 34–36، 39", "tb": "ص 41–43", "focus": "أثر ما أجيده في ذاتي وفي الآخرين", "fields": ["1. يوضح أثر ابتكار ناصر في ذاته وفي أسرته وزملائه.\n2. يستنتج أن ما يجيده الفرد يستفيد منه هو والآخرون، من خلال مثال أحمد بن ماجد والبوصلة.\n\nمخرج تعليمي آخر:\n3. يعتز بإسهامات الشخصيات العمانية فيما أجادته.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. الأقلام\n5. أخرى: بوصلة، والملحق (1) صفحة الجريدة ص 39", "1. أثر ما أجيده: النتائج الإيجابية التي تعود على الفرد وعلى الآخرين من إتقانه نشاطًا ما.\n2. الابتكار: تقديم شيء جديد ومفيد اعتمادًا على ما يجيده الفرد.", "التعلم القبلي: تعرّف الطالب في الدرس السابق طرق تنمية ما يجيده، وأهمية المثابرة، ووضع خطة لتنميته.\n\nالتهيئة:\n1. يعرض المعلم الموقف: «تخيل أنك وزملاءك في الصحراء، وتريدون الوصول إلى مكان التخييم الذي يقع جهة الشرق». ويسأل: كيف تصلون إليه باستخدام البوصلة؟\n2. يختار طالبًا ليحدد جهة الشرق بالبوصلة، مذكرًا بأن إبرتها المغناطيسية تشير دائمًا إلى الشمال، ومن يقف ووجهه إلى الشمال يكون الشرق عن يمينه.\n3. يناقش الطلاب في أن أحمد بن ماجد أجاد علوم البحار والملاحة وارتبط اسمه بالبوصلة واستخدامها في الملاحة البحرية، فاستفاد هو مما يجيده واستفاد منه الآخرون في معرفة الاتجاهات، وكذلك كل ما نجيده ينبغي أن ننتفع به نحن والآخرون.", "التهيئة (7 دقائق): البوصلة وأحمد بن ماجد\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض موقف الصحراء، ويطلب من طالب تحديد الشرق بالبوصلة، ثم يسأل: من استفاد مما أجاده أحمد بن ماجد؟ ويترك الطلاب يستنتجون الفكرة قبل صياغتها.\n- الطالب: يحدد الاتجاه بالبوصلة، ويستنتج أن ما يجيده الفرد ينفعه وينفع الآخرين.\n\nالنشاط 1 (13 دقيقة): نص «المبتكر الصغير (3)» ص 34–35: أثر الابتكار\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف نصف المجموعات بتحليل «أثر الابتكار في ذات ناصر» والنصف الآخر بتحليل «أثر الابتكار في الآخرين»، ثم تعرض كل مجموعة ويكمل المعلم: في ذاته: الشعور بالسعادة، والثقة بالنفس، وتحقيق الذات، والاستقلالية، وتعلم أهمية تكرار المحاولات؛ وفي الآخرين: شعور أسرته بالفخر والسعادة، واستفادة زملائه من الروبوت في البحث عن المعرفة.\n- الطالب: يستمع إلى النص، ويحلل مع مجموعته الجانب المكلفة به، ويدوّن الآثار، ويشارك في العرض.\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 36: أنا صحفي\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يطلب من كل طالب أن يتخيل نفسه صحفيًا أجرى مقابلة مع ناصر، فيدوّن البيانات في صفحة الجريدة بالملحق (1) ص 39 مستعينًا بالنصوص السابقة، ويتابع ويقدم التغذية الراجعة.\n- الطالب: يملأ صفحة الجريدة بمفرده: عنوان الجريدة، وتاريخ النشر، وعنوان المقال، والأنشطة التي يحبها ناصر، والنشاط الذي يجيده، ومن ساعده، والتحديات، والإنجاز، ومن استفاد من ابتكاره.\n\nالختام (6 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويجمعها لتحديد من يحتاج إلى دعم.\n- الطالب: يجيب بمفرده عن الأسئلة الثلاثة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): بماذا كُرِّم ناصر في المسابقة؟\nالإجابة: بهدية مميزة، هي طابعة ثلاثية الأبعاد.\n\nس2 (مستوى التطبيق): اذكر أثرين لابتكار ناصر في ذاته.\nالإجابة: الشعور بالسعادة، والثقة بالنفس (ويقبل: تحقيق الذات، الاستقلالية، تعلم أهمية تكرار المحاولات).\n\nس3 (مستوى الاستدلال): كيف استفاد الصف من روبوت ناصر؟ وماذا تستنتج؟\nالإجابة: طلبت المعلمة استخدامه في الصف ليساعدهم في الحصول على الموضوعات التي يحتاجون إلى البحث عنها؛ وأستنتج أن ما يجيده الفرد يعود بالنفع على الآخرين أيضًا.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة روبوت ناصر بالصور، ويصنف معه آثار الابتكار في ثلاث دوائر: في ذاته، وفي أسرته، وفي زملائه، ثم يسأله: كيف استفاد الصف من روبوت ناصر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة قصيرة عن أحمد بن ماجد وكيف أفادت إجادته للملاحة الآخرين، واقتراح طريقة يفيدون بها مدرستهم مما يجيدونه.", "س1 (مستوى المعرفة): صواب أم خطأ: ما يجيده الفرد يفيده هو وحده ولا يفيد الآخرين.\nالإجابة: خطأ؛ فقد استفاد من ابتكار ناصر أسرته وزملاؤه في الصف.\n\nس2 (مستوى التطبيق): كيف استفاد الناس مما أجاده أحمد بن ماجد؟\nالإجابة: استفادوا من البوصلة في معرفة الاتجاهات في البحر والصحراء وأي مكان آخر.\n\nس3 (مستوى الاستدلال): اختر نشاطًا تجيده، ووضح كيف يمكن أن يستفيد منه شخص آخر في أسرتك أو صفك.\nالإجابة: إجابة شخصية، مثل: أجيد استخدام الحاسوب، فأساعد جدي في استخدام الهاتف للتواصل مع أقاربه.", "- للطالب: راجع نص «المبتكر الصغير (3)» ص 34–35، وأكمل صفحة الجريدة في الملحق (1) ص 39 إن لم تنته منها.\n- لولي الأمر: تحدث مع ابنك عن نشاط يجيده يمكن أن يفيد به أفراد الأسرة، وامنحه فرصة لتطبيقه في البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=3"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع السادس", "dates": "11–15 أكتوبر 2026", "sb": "ص 37", "tb": "ص 43–44", "focus": "أستثمر ما أجيده مع الآخرين", "fields": ["1. يوظف ما يجيده في عمل جماعي لتحقيق هدف مشترك من خلال لعبة «بناء البرج».\n2. يكتب رسالة إلى ذاته تتضمن ما يريد أن يكون عليه في المستقبل وما يحتاجه منه وطنه والعالم.\n\nمخرج تعليمي آخر:\n3. يق هات، وكذلك كل ما نجيده ينبغي أن ننتفع به نحن والآخرون.\n\nالحصة 2:\nالتعلم القبلي: تعرّف الطالب في الحصة السابقة أثر ما يجيده الفرد في ذاته وفي الآخرين من خلال ابتكار ناصر.\n\nالتهيئة:\n1. يعرض المعلم أدوات اللعبة: عشر أوراق، ولاصق شمعي، وكرة صغيرة.\n2. يطرح التحدي: «هل تستطيع مجموعتكم بناء أطول برج ثابت يحمل الكرة في أعلاه خلال 15 دقيقة؟».\n3. يسأل: كيف نوزع الأدوار في المجموعة لننجح؟ ويستمع لاقتراحات الطلاب.", "الحصة 1:\nالتهيئة (7 دقائق): البوصلة وأحمد بن ماجد\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض موقف الصحراء، ويطلب من طالب تحديد الشرق بالبوصلة، ثم يسأل: من استفاد مما أجاده أحمد بن ماجد؟ ويترك الطلاب يستنتجون الفكرة قبل صياغتها.\n- الطالب: يحدد الاتجاه بالبوصلة، ويستنتج أن ما يجيده الفرد ينفعه وينفع الآخرين.\n\nالنشاط 1 (13 دقيقة): نص «المبتكر الصغير (3)» ص 34–35: أثر الابتكار\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف نصف المجموعات بتحليل «أثر الابتكار في ذات ناصر» والنصف الآخر بتحليل «أثر الابتكار في الآخرين»، ثم تعرض كل مجموعة ويكمل المعلم: في ذاته: الشعور بالسعادة، والثقة بالنفس، وتحقيق الذات، والاستقلالية، وتعلم أهمية تكرار المحاولات؛ وفي الآخرين: شعور أسرته بالفخر والسعادة، واستفادة زملائه من الروبوت في البحث عن المعرفة.\n- الطالب: يستمع إلى النص، ويحلل مع مجموعته الجانب المكلفة به، ويدوّن الآثار، ويشارك في العرض.\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 36: أنا صحفي\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يطلب من كل طالب أن يتخيل نفسه صحفيًا أجرى مقابلة مع ناصر، فيدوّن البيانات في صفحة الجريدة بالملحق (1) ص 39 مستعينًا بالنصوص السابقة، ويتابع ويقدم التغذية الراجعة.\n- الطالب: يملأ صفحة الجريدة بمفرده: عنوان الجريدة، وتاريخ النشر، وعنوان المقال، والأنشطة التي يحبها ناصر، والنشاط الذي يجيده، ومن ساعده، والتحديات، والإنجاز، ومن استفاد من ابتكاره.\n\nالختام (6 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويجمعها لتحديد من يحتاج إلى دعم.\n- الطالب: يجيب بمفرده عن الأسئلة الثلاثة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (3 دقائق): تحدي البرج\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يعرض الأدوات ويعلن التحدي ومعاييره (الطول، والثبات، والالتزام بالوقت، ووضع الكرة في الأعلى بثبات).\n- الطالب: يتعرف إلى التحدي ومعاييره، ويقترح طريقة لتوزيع الأدوار.\n\nالنشاط 1 (15 دقيقة): لعبة «بناء البرج»\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يوزع الأدوات، ويحدد الأدوار في كل مجموعة: الرسام والمصمم، ومهندسو البناء، والمسؤول عن الوقت، والمتحدث، ويتابع البناء ملتزمًا بالزمن المحدد (15 دقيقة).\n- الطالب: يختار الدور الذي يناسب ما يجيده، ويشارك في تصميم البرج وبنائه وفق النموذج المرسوم، ويلتزم بالوقت.\n\nالنشاط 2 (7 دقائق): عرض الأبراج ومناقشتها\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يطلب من متحدث كل مجموعة تقديم برجها، ثم يدير نقاشًا صفيًا: كيف استفاد كل منكم مما يجيد في تحقيق الهدف؟ ما التحديات التي واجهتكم؟ ما أثر تحقيق الهدف في ذواتكم وفي زملائكم في الصف؟\n- الطالب: يعرض المتحدث عمل المجموعة، ويشارك الطلاب في النقاش بآرائهم وتجاربهم.\n\nالنشاط 3 (9 دقائق): نشاط (2) ص 37: رسالة إلى ذاتي\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يطلب من كل طالب كتابة رسالة إلى ذاته يجيب فيها: ماذا أريد أن أكون في المستقبل؟ ماذا يحتاج وطني والعالم مني؟ ويتابع ويقدم التغذية الراجعة.\n- الطالب: يكتب رسالته بمفرده مستحضرًا ما يجيده وكيف سيخدم به وطنه والعالم.\n\nالختام (6 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويختم بأن ما نجيده يكتمل أثره حين نستثمره مع الآخرين.\n- الطالب: يجيب بمفرده عن الأسئلة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): بماذا كُرِّم ناصر في المسابقة؟\nالإجابة: بهدية مميزة، هي طابعة ثلاثية الأبعاد.\n\nس2 (مستوى التطبيق): اذكر أثرين لابتكار ناصر في ذاته.\nالإجابة: الشعور بالسعادة، والثقة بالنفس (ويقبل: تحقيق الذات، الاستقلالية، تعلم أهمية تكرار المحاولات).\n\nس3 (مستوى الاستدلال): كيف استفاد الصف من روبوت ناصر؟ وماذا تستنتج؟\nالإجابة: طلبت المعلمة استخدامه في الصف ليساعدهم في الحصول على الموضوعات التي يحتاجون إلى البحث عنها؛ وأستنتج أن ما يجيده الفرد يعود بالنفع على الآخرين أيضًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الدور الذي قمت به في مجموعتك في لعبة «بناء البرج»؟ ولماذا اخترته؟\nالإجابة: إجابة شخصية، مثل: كنت الرسام والمصمم؛ لأني أجيد الرسم.\n\nس2 (مستوى التطبيق): ما التحديات التي واجهت مجموعتك؟ وكيف تغلبتم عليها؟\nالإجابة: مثل: سقوط البرج أو قلة الأوراق، وتغلبنا عليها بتقوية القاعدة وتوزيع العمل بحسب ما يجيده كل فرد.\n\nس3 (مستوى الاستدلال): كيف أثّر نجاح مجموعتك في بقية زملائك في الصف؟\nالإجابة: ألهمهم أفكارًا للبناء، ونشر روح المنافسة الإيجابية، وتعلموا من طريقة تعاوننا.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة روبوت ناصر بالصور، ويصنف معه آثار الابتكار في ثلاث دوائر: في ذاته، وفي أسرته، وفي زملائه، ثم يسأله: كيف استفاد الصف من روبوت ناصر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة قصيرة عن أحمد بن ماجد وكيف أفادت إجادته للملاحة الآخرين، واقتراح طريقة يفيدون بها مدرستهم مما يجيدونه.", "الحصة 1:\nس1 (مستوى المعرفة): صواب أم خطأ: ما يجيده الفرد يفيده هو وحده ولا يفيد الآخرين.\nالإجابة: خطأ؛ فقد استفاد من ابتكار ناصر أسرته وزملاؤه في الصف.\n\nس2 (مستوى التطبيق): كيف استفاد الناس مما أجاده أحمد بن ماجد؟\nالإجابة: استفادوا من البوصلة في معرفة الاتجاهات في البحر والصحراء وأي مكان آخر.\n\nس3 (مستوى الاستدلال): اختر نشاطًا تجيده، ووضح كيف يمكن أن يستفيد منه شخص آخر في أسرتك أو صفك.\nالإجابة: إجابة شخصية، مثل: أجيد استخدام الحاسوب، فأساعد جدي في استخدام الهاتف للتواصل مع أقاربه.\n\nالحصة 2:\nس1 (مستوى المعرفة): أكمل: عندما يستثمر كل فرد في المجموعة ما ........ يتحقق الهدف المشترك بسهولة.\nالإجابة: يجيده.\n\nس2 (مستوى التطبيق): لماذا نجحت المجموعة التي وزعت الأدوار بحسب ما يجيده أفرادها؟\nالإجابة: لأن كل فرد أدى المهمة التي يتقنها، فقل الخطأ وأُنجز العمل بدقة في الوقت المحدد.\n\nس3 (مستوى الاستدلال): اكتب جملة من رسالتك إلى ذاتك تبين كيف ستخدم وطنك بما تجيده.\nالإجابة: إجابة شخصية، مثل: سأنمي مهارتي في البرمجة لأصمم تطبيقات تخدم الناس في وطني.", "الحصة 1:\n- للطالب: راجع نص «المبتكر الصغير (3)» ص 34–35، وأكمل صفحة الجريدة في الملحق (1) ص 39 إن لم تنته منها.\n- لولي الأمر: تحدث مع ابنك عن نشاط يجيده يمكن أن يفيد به أفراد الأسرة، وامنحه فرصة لتطبيقه في البيت.\n\nالحصة 2:\n- للطالب: أكمل رسالتك إلى ذاتك في ص 37 واحتفظ بها، واقرأها على أسرتك. وتهيأ للوحدة الثانية بالتعرف إلى ما يجيده كل فرد من أفراد أسرتك.\n- لولي الأمر: استمع إلى رسالة ابنك عن مستقبله وشجعه عليها، وتحدث معه عما يجيده كل فرد في الأسرة تمهيدًا لوحدة «أسرتي المنتجة».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=3"]}, {"no": 4, "label": "الدرس الأول: أسرتي تجيد", "unit": 2, "unitName": "الوحدة الثانية: أسرتي المنتِجة", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع السابع", "dates": "18–22 أكتوبر 2026", "sb": "ص 41–46", "tb": "ص 46–50", "focus": "ما يجيده أفراد الأسرة والأسر المنتجة", "fields": ["1. يستخرج من نص «مشروع أسرتي (1)» ما يجيده كل فرد من أفراد أسرة شمساء.\n2. يوضح المقصود بالأسر المنتجة.\n\nمخرج تعليمي آخر:\n3. يصمم بالرسم منتجًا أسريًا يجمع ما يجيده أفراد أسرة شمساء.", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: إبداع", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي", "1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. السبورة الذكية\n5. الأقلام", "1. الأسر المنتجة: الأسر التي تعتمد على مهارات أفرادها لسد احتياجاتها من خلال إنتاج منتجاتها وبيعها من المنزل بهدف زيادة دخلها.\n2. المنتج الأسري: سلعة أو خدمة يشترك أفراد الأسرة في إنتاجها مستثمرين ما يجيده كل منهم.", "التعلم القبلي: تعرّف الطالب في الوحدة الأولى ما يجيده هو، وكيف ينميه ويستفيد منه، ويتهيأ الآن لاكتشاف ما يجيده أفراد أسرته.\n\nالتهيئة:\n1. يعرض المعلم صورة الوحدة (الأسرة المنتجة) ص 41 مكبرة على السبورة الذكية.\n2. يطلب من الطلاب تأمل الصورة والإجابة عن السؤال: ماذا يجيد أفراد الأسرة؟\n3. يتوصل معهم إلى أن المنتجات التي شاهدوها تعبّر عما يجيده أفراد الأسرة، ويمكن استثمارها في مشاريع ريادية يعود أثرها الإيجابي عليهم وعلى المجتمع.\n4. يعرّفهم بعنوان الوحدة وما سيتمكنون منه في نهايتها (ص 42).", "التهيئة (6 دقائق): صورة الأسرة المنتجة\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض صورة الوحدة، ويسأل عما يجيده أفراد الأسرة، ويقود الطلاب إلى استنتاج إمكانية استثمار ما يجيدونه في مشروع.\n- الطالب: يتأمل الصورة، ويستخرج المنتجات وما تدل عليه من إجادة، ويستنتج فكرة المشروع الأسري.\n\nالنشاط 1 (12 دقيقة): نص «مشروع أسرتي (1)» ص 44–45\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف المجموعات بأدوار (قارئ، كاتب، متحدث، مراقب وقت) بإعداد جدول «فرد الأسرة / ما يجيده»، والإجابة: لماذا فكرت شمساء في منتج تتعاون فيه مع أسرتها؟ ثم يناقش الإجابات ويوضح مفهوم الأسر المنتجة.\n- الطالب: يستمع إلى النص، ويستخرج مع مجموعته ما يجيده كل فرد (الأم: صناعة البخور، الجد: صنع السعفيات، شمساء: الرسم والتلوين، ناصر: تصميم الأشكال بالطابعة ثلاثية الأبعاد)، ويعرض المتحدث إجابة المجموعة.\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 46: أساعد شمساء في رسم المنتج الأسري\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة تصميم منتج أسري واحد يجمع ما يجيده أفراد أسرة شمساء، ثم يرسمه كل طالب في كتابه، وتعرض المجموعات تصاميمها، ويبين المعلم أن الأسرة تستطيع جمع ما يجيده أفرادها في منتج واحد يمثل مشروعًا رياديًا صغيرًا.\n- الطالب: يتشاور مع مجموعته في فكرة المنتج (مثل: بخور في علبة مصممة بالطابعة ثلاثية الأبعاد داخل سلة سعف مزينة برسوم شمساء)، ويرسمه في الكتاب، ويشارك في العرض.\n\nالختام (8 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويجمعها ويعلّق على الأخطاء الشائعة.\n- الطالب: يجيب بمفرده عن الأسئلة الثلاثة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): ماذا يجيد جد شمساء؟\nالإجابة: صنع السعفيات.\n\nس2 (مستوى التطبيق): لماذا فكرت شمساء في منتج تتعاون فيه مع أسرتها؟\nالإجابة: لتحقق أمنيتها في أن تصل رائحة بخور أمها إلى الجميع، ولتقدم جزءًا من مردوده المالي للهيئة العمانية للأعمال الخيرية.\n\nس3 (مستوى الاستدلال): كيف يجمع منتج أسرة شمساء بين ما يجيده أفرادها؟\nالإجابة: الأم تصنع البخور، والجد يصنع السعفيات، وناصر يصمم الأشكال بطابعته ثلاثية الأبعاد، وشمساء ترسم وتلون، فيخرج منتج واحد متكامل.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صور أفراد أسرة شمساء، ويطابقها معه ببطاقات ما يجيده كل منهم (الجد السعفيات، الأم البخور)، ثم يسأله: ماذا يجيد جد شمساء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم منتج أسري يجمع ما يجيده أفراد أسرهم، وتوضيح دور كل فرد فيه، وكيف يمكن أن يفيد المجتمع.", "س1 (مستوى المعرفة): أكمل: الأسر التي تعتمد على مهارات أفرادها في إنتاج منتجات وبيعها من المنزل تسمى ........\nالإجابة: الأسر المنتجة.\n\nس2 (مستوى التطبيق): اذكر فردين من أسرة شمساء وما يجيده كل منهما.\nالإجابة: الأم تجيد صناعة البخور، وناصر يجيد تصميم الأشكال بالطابعة ثلاثية الأبعاد (ويقبل: الجد يجيد صنع السعفيات، وشمساء تجيد الرسم والتلوين).\n\nس3 (مستوى الاستدلال): ما الفائدة التي تعود على المجتمع من مشروع أسرة شمساء؟\nالإجابة: يصل منتج عماني جميل إلى الناس، ويُقدَّم جزء من مردوده للأعمال الخيرية فتستفيد منه الأسر المحتاجة.", "- للطالب: تحدث مع أفراد أسرتك عما يجيده كل منهم، ودوّن ذلك في دفترك؛ استعدادًا للحصة القادمة ولنشاط ص 47.\n- لولي الأمر: ساعد ابنك على اكتشاف ما يجيده كل فرد في الأسرة، وحدثه عن مهن أو حرف يتقنها أفراد العائلة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=4"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع الثامن", "dates": "25–29 أكتوبر 2026", "sb": "ص 46–47", "tb": "ص 50–51، 59", "focus": "المشروع المنزلي الصغير من مهارات أفراد الأسرة", "fields": ["1. يوضح المقصود بالمشروع المنزلي الصغير (الريادي).\n2. يقترح مع مجموعته منتجًا لمشروع ريادي يستثمر ما يجيده أفرادها.\n\nمخرج تعليمي آخر:\n3. يتعاون مع زملائه ويحترم آراءهم في أثناء العمل الجماعي.", "المخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج 3: تطبيق", "1. التعلم التشاركي\n2. التعلم المبني على المشاريع\n3. التعلم المبني على اللعب", "1. الكتاب\n2. الأقلام\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: نسخ نشاط «مشروعنا الريادي» من ملحق دليل المعلم ص 59، وأوراق رسم وألوان", "1. المشروع المنزلي الصغير (الريادي): نشاط يقوم به أفراد الأسرة كتوفير خدمة أو منتج مقابل مردود مادي.\n2. استثمار ما يجيده أفراد الأسرة: توظيف مهاراتهم في إنتاج منتج أو خدمة تعود بالنفع على الأسرة والمجتمع.", "التعلم القبلي: اكتشف الطالب في الحصة السابقة ما يجيده أفراد أسرة شمساء، ودوّن في البيت ما يجيده أفراد أسرته.\n\  جذابة تساعد على عرضه وتسويقه.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صور أفراد أسرة شمساء، ويطابقها معه ببطاقات ما يجيده كل منهم (الجد السعفيات، الأم البخور)، ثم يسأله: ماذا يجيد جد شمساء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم منتج أسري يجمع ما يجيده أفراد أسرهم، وتوضيح دور كل فرد فيه، وكيف يمكن أن يفيد المجتمع.", "س1 (مستوى المعرفة): صواب أم خطأ: المشروع المنزلي الريادي نشاط يقدم منتجًا أو خدمة مقابل مردود مادي.\nالإجابة: صواب.\n\nس2 (مستوى التطبيق): اذكر مثالًا لمشروع منزلي صغير يمكن أن تقوم به أسرة عمانية.\nالإجابة: مثل: صناعة الحلوى العمانية، أو البخور، أو الخياطة، أو المشغولات السعفية.\n\nس3 (مستوى الاستدلال): لماذا يعد مشروع أسرة شمساء مشروعًا رياديًا ناجحًا في بدايته؟\nالإجابة: لأنه بُني على ما يجيده أفرادها فعلًا، وجمع مهاراتهم في منتج واحد، وله هدف واضح يخدم الأسرة والمجتمع.", "- للطالب: أكمل نشاط (2) ص 47 مع ولي أمرك. وقبل الحصة القادمة استمع إلى نص «مشروع أسرتي (2)» ص 48–49 عبر رمز QR، ودوّن المهمة التي سيقوم بها كل فرد من أسرة شمساء.\n- لولي الأمر: شارك ابنك في كتابة الأنشطة التي تجيدها أسرتكم ورسم المنتج المناسب لها في ص 47، وساعده على الاستماع إلى نص ص 48–49.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=4"]}], "combined": ["الحصة 1:\n1. يستخرج من نص «مشروع أسرتي (1)» ما يجيده كل فرد من أفراد أسرة شمساء.\n2. يوضح المقصود بالأسر المنتجة.\n\nمخرج تعليمي آخر:\n3. يصمم بالرسم منتجًا أسريًا يجمع ما يجيده أفراد أسرة شمساء.\n\nالحصة 2:\n1. يوضح المقصود بالمشروع المنزلي الصغير (الريادي).\n2. يقترح مع مجموعته منتجًا لمشروع ريادي يستثمر ما يجيده أفرادها.\n\nمخرج تعليمي آخر:\n3. يتعاون مع زملائه ويحترم آراءهم في أثناء العمل الجماعي.", "الحصة 1:\nالمخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج 3: إبداع\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج 3: تطبيق", "الحصة 1:\n1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم الذاتي\n\nالحصة 2:\n1. التعلم التشاركي\n2. التعلم المبني على المشاريع\n3. التعلم المبني على اللعب", "الحصة 1:\n1. الكتاب\n2. صورة توضيحية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. السبورة الذكية\n5. الأقلام\n\nالحصة 2:\n1. الكتاب\n2. الأقلام\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: نسخ نشاط «مشروعنا الريادي» من ملحق دليل المعلم ص 59، وأوراق رسم وألوان", "الحصة 1:\n1. الأسر المنتجة: الأسر التي تعتمد على مهارات أفرادها لسد احتياجاتها من خلال إنتاج منتجاتها وبيعها من المنزل بهدف زيادة دخلها.\n2. المنتج الأسري: سلعة أو خدمة يشترك أفراد الأسرة في إنتاجها مستثمرين ما يجيده كل منهم.\n\nالحصة 2:\n1. المشروع المنزلي الصغير (الريادي): نشاط يقوم به أفراد الأسرة كتوفير خدمة أو منتج مقابل مردود مادي.\n2. استثمار ما يجيده أفراد الأسرة: توظيف مهاراتهم في إنتاج منتج أو خدمة تعود بالنفع على الأسرة والمجتمع.", "الحصة 1:\nالتعلم القبلي: تعرّف الطالب في الوحدة الأولى ما يجيده هو، وكيف ينميه ويستفيد منه، ويتهيأ الآن لاكتشاف ما يجيده أفراد أسرته.\n\nالتهيئة:\n1. يعرض المعلم صورة الوحدة (الأسرة المنتجة) ص 41 مكبرة على السبورة الذكية.\n2. يطلب من الطلاب تأمل الصورة والإجابة عن السؤال: ماذا يجيد أفراد الأسرة؟\n3. يتوصل معهم إلى أن المنتجات التي شاهدوها تعبّر عما يجيده أفراد الأسرة، ويمكن استثمارها في مشاريع ريادية يعود أثرها الإيجابي عليهم وعلى المجتمع.\n4. يعرّفهم بعنوان الوحدة وما سيتمكنون منه في نهايتها (ص 42).\n\nالحصة 2:\nالتعلم القبلي: اكتشف الطالب في الحصة السابقة ما يجيده أفراد أسرة شمساء، ودوّن في البيت ما يجيده أفراد أسرته.\n\nالتهيئة:\n1. يسأل المعلم: ماذا وجدتم في بيوتكم؟ ماذا يجيد أفراد أسركم؟\n2. يدوّن على السبورة قائمة صفية بالأنشطة التي يذكرها الطلاب (طبخ، خياطة، تصوير، زراعة، تصميم...).\n3. يسأل: هل يمكن أن يصبح بعض هذه الأنشطة مشروعًا منزليًا صغيرًا؟", "الحصة 1:\nالتهيئة (6 دقائق): صورة الأسرة المنتجة\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض صورة الوحدة، ويسأل عما يجيده أفراد الأسرة، ويقود الطلاب إلى استنتاج إمكانية استثمار ما يجيدونه في مشروع.\n- الطالب: يتأمل الصورة، ويستخرج المنتجات وما تدل عليه من إجادة، ويستنتج فكرة المشروع الأسري.\n\nالنشاط 1 (12 دقيقة): نص «مشروع أسرتي (1)» ص 44–45\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يُسمع الطلاب النص عبر رمز QR، ويكلف المجموعات بأدوار (قارئ، كاتب، متحدث، مراقب وقت) بإعداد جدول «فرد الأسرة / ما يجيده»، والإجابة: لماذا فكرت شمساء في منتج تتعاون فيه مع أسرتها؟ ثم يناقش الإجابات ويوضح مفهوم الأسر المنتجة.\n- الطالب: يستمع إلى النص، ويستخرج مع مجموعته ما يجيده كل فرد (الأم: صناعة البخور، الجد: صنع السعفيات، شمساء: الرسم والتلوين، ناصر: تصميم الأشكال بالطابعة ثلاثية الأبعاد)، ويعرض المتحدث إجابة المجموعة.\n\nالنشاط 2 (14 دقيقة): نشاط (1) ص 46: أساعد شمساء في رسم المنتج الأسري\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يطلب من كل مجموعة تصميم منتج أسري واحد يجمع ما يجيده أفراد أسرة شمساء، ثم يرسمه كل طالب في كتابه، وتعرض المجموعات تصاميمها، ويبين المعلم أن الأسرة تستطيع جمع ما يجيده أفرادها في منتج واحد يمثل مشروعًا رياديًا صغيرًا.\n- الطالب: يتشاور مع مجموعته في فكرة المنتج (مثل: بخور في علبة مصممة بالطابعة ثلاثية الأبعاد داخل سلة سعف مزينة برسوم شمساء)، ويرسمه في الكتاب، ويشارك في العرض.\n\nالختام (8 دقائق): بطاقة الخروج\n- الاستراتيجية: التعلم الذاتي\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ويجمعها ويعلّق على الأخطاء الشائعة.\n- الطالب: يجيب بمفرده عن الأسئلة الثلاثة ويسلم البطاقة.\n\nمجموع زمن الحصة: 40 دقيقة\n\nالحصة 2:\nالتهيئة (5 دقائق): سوق الأفكار\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يستقبل مشاركات الطلاب عما يجيده أفراد أسرهم، ويبني منها قائمة صفية على السبورة.\n- الطالب: يشارك بما دوّنه في البيت، ويستمع لمشاركات زملائه.\n\nالنشاط 1 (17 دقيقة): نشاط «مشروعنا الريادي» (ملحق دليل المعلم ص 59)\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: يوزع النشاط على المجموعات، ويطلب من كل مجموعة تحديد ما يجيده أفرادها، ثم اختيار منتج يجمع هذه المهارات، وتسميته ورسمه، موضحًا أن هذا المنتج سيكون مشروع المجموعة في بقية الوحدة (تخطيطه ثم تسويقه).\n- الطالب: يحدد مع مجموعته ما يجيده كل فرد، ويشارك في اختيار المنتج وتسميته ورسمه.\n\nالنشاط 2 (10 دقائق): معرض المشاريع ومفهوم المشروع الريادي\n- الاستراتيجية: التعلم التشاركي\n- المعلم: ينظم جولة يعرض فيها متحدث كل مجموعة منتجها، ويوضح مفهوم المشروع المنزلي الريادي، ثم يشرح نشاط (2) ص 47 الذي ينفذه الطالب في البيت بمساعدة ولي أمره.\n- الطالب: يتجول بين منتجات المجموعات، ويطرح سؤالًا على مجموعة واحدة على الأقل، ويتعرف إلى مطلوب نشاط ص 47.\n\nالختام (8 دقائق): مسابقة المجموعات والتقويم الختامي\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: يشغّل مسابقة المجموعات (درس «أسرتي تجيد»، محور الحصة، 5 أسئلة)، ثم يطرح أسئلة التقويم الختامي الثلاثة جولة أخيرة.\n- الطالب: يتنافس مع مجموعته، ويجيب في دورها، ويشارك في جولة التقويم الختامي.\n\nمجموع زمن الحصة: 40 دقيقة", "الحصة 1:\nس1 (مستوى المعرفة): ماذا يجيد جد شمساء؟\nالإجابة: صنع السعفيات.\n\nس2 (مستوى التطبيق): لماذا فكرت شمساء في منتج تتعاون فيه مع أسرتها؟\nالإجابة: لتحقق أمنيتها في أن تصل رائحة بخور أمها إلى الجميع، ولتقدم جزءًا من مردوده المالي للهيئة العمانية للأعمال الخيرية.\n\nس3 (مستوى الاستدلال): كيف يجمع منتج أسرة شمساء بين ما يجيده أفرادها؟\nالإجابة: الأم تصنع البخور، والجد يصنع السعفيات، وناصر يصمم الأشكال بطابعته ثلاثية الأبعاد، وشمساء ترسم وتلون، فيخرج منتج واحد متكامل.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر نشاطًا يجيده أحد أفراد مجموعتك يمكن أن يدخل في منتجكم.\nالإجابة: إجابة بحسب المجموعة، مثل: الرسم، أو الخياطة، أو الطبخ، أو التصميم بالحاسوب.\n\nس2 (مستوى التطبيق): كيف يرتبط منتج مجموعتكم بما يجيده أفرادها؟\nالإجابة: مثل: نصنع حقائب قماشية مزينة؛ لأن أحدنا يجيد الخياطة، والآخر يجيد الرسم، وثالثًا يجيد التغليف.\n\nس3 (مستوى الاستدلال): لو انضم إلى مجموعتكم فرد يجيد التصوير، كيف يطوّر منتجكم؟\nالإجابة: يصوّر المنتج صورًا جذابة تساعد على عرضه وتسويقه.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صور أفراد أسرة شمساء، ويطابقها معه ببطاقات ما يجيده كل منهم (الجد السعفيات، الأم البخور)، ثم يسأله: ماذا يجيد جد شمساء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم منتج أسري يجمع ما يجيده أفراد أسرهم، وتوضيح دور كل فرد فيه، وكيف يمكن أن يفيد المجتمع.", "الحصة 1:\nس1 (مستوى المعرفة): أكمل: الأسر التي تعتمد على مهارات أفرادها في إنتاج منتجات وبيعها من المنزل تسمى ........\nالإجابة: الأسر المنتجة.\n\nس2 (مستوى التطبيق): اذكر فردين من أسرة شمساء وما يجيده كل منهما.\nالإجابة: الأم تجيد صناعة البخور، وناصر يجيد تصميم الأشكال بالطابعة ثلاثية الأبعاد (ويقبل: الجد يجيد صنع السعفيات، وشمساء تجيد الرسم والتلوين).\n\nس3 (مستوى الاستدلال): ما الفائدة التي تعود على المجتمع من مشروع أسرة شمساء؟\nالإجابة: يصل منتج عماني جميل إلى الناس، ويُقدَّم جزء من مردوده للأعمال الخيرية فتستفيد منه الأسر المحتاجة.\n\nالحصة 2:\nس1 (مستوى المعرفة): صواب أم خطأ: المشروع المنزلي الريادي نشاط يقدم منتجًا أو خدمة مقابل مردود مادي.\nالإجابة: صواب.\n\nس2 (مستوى التطبيق): اذكر مثالًا لمشروع منزلي صغير يمكن أن تقوم به أسرة عمانية.\nالإجابة: مثل: صناعة الحلوى العمانية، أو البخور، أو الخياطة، أو المشغولات السعفية.\n\nس3 (مستوى الاستدلال): لماذا يعد مشروع أسرة شمساء مشروعًا رياديًا ناجحًا في بدايته؟\nالإجابة: لأنه بُني على ما يجيده أفرادها فعلًا، وجمع مهاراتهم في منتج واحد، وله هدف واضح يخدم الأسرة والمجتمع.", "الحصة 1:\n- للطالب: تحدث مع أفراد أسرتك عما يجيده كل منهم، ودوّن ذلك في دفترك؛ استعدادًا للحصة القادمة ولنشاط ص 47.\n- لولي الأمر: ساعد ابنك على اكتشاف ما يجيده كل فرد في الأسرة، وحدثه عن مهن أو حرف يتقنها أفراد العائلة.\n\nالحصة 2:\n- للطالب: أكمل نشاط (2) ص 47 مع ولي أمرك. وقبل الحصة القادمة استمع إلى نص «مشروع أسرتي (2)» ص 48–49 عبر رمز QR، ودوّن المهمة التي سيقوم بها كل فرد من أسرة شمساء.\n- لولي الأمر: شارك ابنك في كتابة الأنشطة التي تجيدها أسرتكم ورسم المنتج المناسب لها في ص 47، وساعده على الاستماع إلى نص ص 48–49.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=4"]}, {"no": 5, "label": "الدرس الثاني: أخطط لمشروع أسرتي", "unit": 2, "unitName": "الوحدة الثانية: أسرتي المنتِجة", "periods": [{"pno": 1, "ptotal": 2, "week": "الأسبوع التاسع", "dates": "1–5 نوفمبر 2026", "sb": "ص 48–50", "tb": "ص 52–53", "focus": "خطة المشروع وعناصرها", "fields": ["1. يوضح المقصود بخطة المشروع وأهميتها في نجاح المشروعات الأسرية.\n2. يكمل خطة مشروع أسرة شمساء (الاسم، والأدوات، والتكلفة المتوقعة، والمستهلكين) مستعينًا ببيانات النص.\n\nمخرج تعليمي آخر:\n3. يقدّر أهمية التخطيط وتوزيع المهام بين أفراد الأسرة.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. الفصل المقلوب\n3. التعلم بالنمذجة", "1. الكتاب\n2. السبورة الذكية\n3. الأقلام\n4. الوسائل المتعددة (سمعية - بصرية)\n5. أخرى: شيء يُخفى في الصف، وخريطة بسيطة للوصول إليه", "1. خطة المشروع: خريطة للعمل بها تفاصيل كافية لما يجب أداؤه من مهام وأعمال لإنجاز المشروع.\n2. التكلفة المتوقعة: مقدار المال الذي يُتوقع أن يحتاج إليه المشروع لتوفير موارده وأدواته.\n3. المستهلكون: الأشخاص الذين يُتوقع أن يشتروا المنتج أو يستفيدوا منه.", "التعلم القبلي: صمم الطالب مع مجموعته في الحصة السابقة منتج مشروعهم الريادي، واستمع في البيت إلى نص «مشروع أسرتي (2)».\n\nالتهيئة:\n1. يخفي المعلم شيئًا داخل الصف قبل الحصة، ويخبر الطلاب باسمه.\n2. يختار طالبين للبحث عنه، ويعطي أحدهما خريطة توضح مكانه.\n3. يسأل بعد العثور عليه: لماذا وصل أحدهما قبل الآخر؟\n4. يتوصل معهم إلى أن الخريطة اختصرت الطريق، وكذلك المشروع الأسري يحتاج إلى خريطة عمل هي خطة المشروع.", "التهيئة (6 دقائق): البحث عن الشيء المفقود\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ينفذ موقف البحث بطالبين أحدهما معه خريطة، ثم يسأل عن سبب الفرق ويترك الطلاب يستنتجون معنى خطة المشروع.\n- الطالب: يلاحظ الموقف، ويستنتج دور الخريطة، ويربطه بحاجة المشروع إلى خطة.\n\nالنشاط 1 (8 دقائق): مناقشة نص «مشروع أسرتي (2)» الذي استمع إليه الطلاب في البيت\n- الاستراتيجية: الفصل المقلوب\n- المعلم: يتحقق بأسئلة سريعة من الاستماع، ويعيد تشغيل النص عبر رمز QR لمن يحتاج، ثم يناقش: سبب اجتماع أسرة شمساء، والعمل الذي سيقوم به كل فرد، وطلب الأب إعداد خطة المشروع.\n- الطالب: يجيب عن أسئلة التحقق، ويعرض ما دوّنه من مهام أفراد الأسرة (الجد: عشرون سلة بريالين للسلة، ناصر: عشرون علبة بريال للعلبة، الأم: بخور لعشرين علبة بريالين للعلبة، الأب: توفير المال).\n\nالنشاط 2 (8 دقائق): المعلم ينمذج حساب التكلفة المتوقعة\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يحسب أمام الطلاب تكلفة السلال مفكرًا بصوت عالٍ: «عشرون سلة، كل سلة بريالين: 20 × 2 = 40 ريالًا»، ثم يوجّههم في حساب تكلفة العلب (20 × 1 = 20 ريالًا) والبخور (20 × 2 = 40 ريالًا)، ثم المجموع (40 + 20 + 40 = 100 ريال عماني).\n- الطالب: يتابع تفكير المعلم، ويشارك في حساب بقية التكاليف خطوة خطوة، ويتحقق من المجموع.\n\nالنشاط 3 (10 دقائق): تطبيق مستقل: نشاط (1) ص 50 خطة مشروع أسرة شمساء\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يطلب من كل طالب إكمال الخطة بمفرده: اسم المشروع، وأدواته، وتكلفته المتوقعة، والمستهلكون، ويتابع ويقدم التغذية الراجعة.\n- الطالب: يقترح اسمًا للمشروع، ويدوّن الأدوات (البخور، سعف النخيل، الطابعة ثلاثية الأبعاد، أدوات الرسم والتلوين)، والتكلفة المتوقعة (100 ريال)، والمستهلكين (محبو البخور، الأسر، زوار المعارض).\n\nالختام (8 دقائق): تطبيق مستقل جديد (بطاقة الخروج)\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يوزع بطاقة الخروج بأسئلة التقويم الختامي، ومنها حساب تكلفة جديدة، ويناقش الحل في الدقيقة الأخيرة.\n- الطالب: يجيب بمفرده عن الأسئلة، ويطبق خطوات الحساب التي نمذجها المعلم.\n\nمجموع زمن الحصة: 40 دقيقة", "س1 (مستوى المعرفة): لماذا وصل أحد الطالبين إلى الشيء المخفي قبل زميله؟\nالإجابة: لأنه كان يملك خريطة توضح له المسار.\n\nس2 (مستوى التطبيق): ما المهمة التي سيقوم بها كل من الجد وناصر والأم والأب في المشروع؟\nالإجابة: الجد يصنع عشرين سلة، وناصر ينتج عشرين علبة للبخور بطابعته ثلاثية الأبعاد، والأم تصنع بخورًا يكفي عشرين علبة، والأب يوفر المال.\n\nس3 (مستوى الاستدلال): احسب التكلفة المتوقعة لمشروع أسرة شمساء، ووضح خطوات حسابك.\nالإجابة: السلال: 20 × 2 = 40 ريالًا، والعلب: 20 × 1 = 20 ريالًا، والبخور: 20 × 2 = 40 ريالًا؛ المجموع: 40 + 20 + 40 = 100 ريال عماني.\n\n• نشاط علاجي (لمن لم يتقن): يحسب المعلم مع التلميذ تكلفة السلال خطوة خطوة (20 سلة × 2 ريال = 40 ريالًا) باستخدام عدادات أو رسم، ثم يسأله: كم تكلفة 20 علبة إذا كان ثمن العلبة ريالًا واحدًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة لمشروع أسري صغير تتضمن الاسم والأدوات والتكلفة المتوقعة والمستهلكين، وحساب التكلفة لو زاد الإنتاج إلى ثلاثين علبة.", "س1 (مستوى المعرفة): أكمل: خطة المشروع هي ........ للعمل بها تفاصيل كافية لما يجب أداؤه لإنجاز المشروع.\nالإجابة: خريطة.\n\nس2 (مستوى التطبيق): اذكر ثلاثة من عناصر خطة المشروع في نشاط ص 50.\nالإجابة: اسم المشروع، وأدوات المشروع، والتكلفة المتوقعة (ويقبل: المستهلكون).\n\nس3 (مستوى الاستدلال): لو قررت أسرة شمساء إنتاج عشر سلال وعشر علب وبخورًا يكفيها بالأسعار نفسها، فكم تصبح التكلفة المتوقعة؟\nالإجابة: 10 × 2 + 10 × 1 + 10 × 2 = 20 + 10 + 20 = 50 ريالًا عمانيًا.", "- للطالب: راجع نص «مشروع أسرتي (2)» ص 48–49 ونشاط ص 50، وفكر في الموارد التي يحتاج إليها منتج مجموعتك.\n- لولي الأمر: ناقش ابنك في أهمية التخطيط قبل أي عمل أسري، وساعده على تقدير تكلفة شيء بسيط في البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/4/social/?l=5"]}, {"pno": 2, "ptotal": 2, "week": "الأسبوع العاشر", "dates": "8–12 نوفمبر 2026", "sb": "ص 51", "tb": "ص 53–54، 60", "focus": "أخطط لمشروعنا الريادي", "fields": ["1. يعدّ مع مجموعته خطة عمل لمشروعهم الريادي تتضمن الاسم، والاستخدامات، والفئة المستهدفة، والموارد، والكلفة، ومدة التنفيذ.\n2. يوزع مع زملائه مهام المشروع بحسب ما يجيده كل فرد.\n\nمخرج تعليمي آخر:\n3. يلتزم بخطوات إعداد خطة المشروع ويحترم آراء زملائه.", "المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم التشاركي\n2. التعلم المبني على المشاريع\n3. التعلم المبني على اللعب", "1. الكتاب\n2. الأقلام\n3. السبورة الذكية\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: نسخ استمارة «خطة عمل مشروعنا الريادي» من ملحق دليل المعلم ص 60", "1. الفئة المستهدفة (الزبائن): الأشخاص الذين يُوجَّه إليهم المنتج ويُتوقع أن يشتروه.\n2. مدة التنفيذ: الوقت المحدد لإنجاز مهام المشروع من بدايته إلى نهايته.\n3. فريق العمل: أفراد الأسرة أو المجموعة الذين توزع عليهم مهام المشروع بحسب ما يجيده كل منهم.", "التعلم القبلي: أكمل الطالب في الحصة السابقة خطة مشروع أسرة شمساء وحسب تكلفته المتوقعة.\n\nالتهيئة:\n1. يعرض المعلم على السبورة الذكية رسوم منتجات المجموعات من الدرس السابق.\n2. يسأل: ماذا نحتاج أن نعرف قبل أن نبدأ تنفيذ منتجنا؟\n3. يجمع إجابات الطلاب ويربطها بعناصر استمارة خطة العمل.", "التهيئة (5 دقائق): ماذا نحتاج قبل التنفيذ؟\n- الاستراتيجية: التعلم التشاركي\n- المعلم: يعرض منتجات المجموعات، ويطرح السؤال، ويبني مع الطلاب قائمة بعناصر الخطة على السبورة.\n- الطالب: يقترح ما يحتاج إليه المشروع قبل التنفيذ، ويضيف إلى اقتراحات زملائه.\n\nالنشاط 1 (18 دقيقة): استمارة «خطة عمل مشروعنا الريادي»\n- الاستراتيجية: التعلم المبني على المشاريع\n- الم
